  - number: 7c.1
    text: |-
      1 Als fokprogramma als bedoeld in artikel 6 bis van [verordening (EG) nr. 999/2001](32001R0999) worden aangewezen
      de erkende fokprogramma’s van:

      a. een ingevolge artikel 4, derde lid, van verordening (EU) 2016/1012 van het Europees Parlement en de Raad van
      8 juni 2016 betreffende de zoötechnische en genealogische voorwaarden voor het fokken van, de handel in en de
      binnenkomst in de Unie van raszuivere fokdieren, hybride fokvarkens en levende producten daarvan en tot wijziging
      van Verordening (EU) nr. 652/2014, de [Richtlijnen 89/608/EEG](31989L0608) en [90/425/EEG](31990L0425) van de Raad
      en tot intrekking van bepaalde handelingen op het gebied van dierfokkerij (‘Fokkerijverordening’) (PbEU 2016, L
      171) erkende stamboekvereniging; of

      b. een groep houders van schapen, verenigd in een organisatie met rechtspersoonlijkheid, die zich in ieder
      geval ten doel stelt het fokken gericht op het terugdringen van de TSE-gevoeligheid bij schapen en die niet is
      aangesloten bij een stamboekvereniging als bedoeld in onderdeel a.

      2 De minister verleent op aanvraag een erkenning als bedoeld in de aanhef van het eerste lid, indien het
      fokprogramma voldoet aan bijlage VII, hoofdstuk C, delen 1 en 2, van [verordening (EG) nr. 999/2001](32001R0999) en
      aan [artikel 7c.2][ref1].

      3 Een aanvraag als bedoeld in het tweede lid wordt voor 1 juni van het betreffende jaar ingediend, waarbij in ieder
      geval de volgende gegevens worden vermeld:

      a. de naam van de stamboekvereniging of de organisatie, bedoeld in het eerste lid;

      b. het aantal schapen dat bij het stamboek is geregistreerd of bij de organisatie is ingeschreven, onderscheiden
      naar geslacht en ras;

      c. het betreffende fokprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel7c.2
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7c.1
    references:
      - id: ref1
