  - number: 7b.37
    text: |-
      1 Indien uit het onderzoek, bedoeld in [artikel 7b.29, eerste lid][ref1], blijkt dat de betreffende waarde, genoemd
      in [bijlage 12][ref2], onderdeel 2, bij twee opeenvolgende koppels vleeskuikens niet wordt behaald, maakt de
      exploitant, bedoeld in [artikel 2.76id, eerste lid, van het besluit][ref3] een plan van aanpak in overleg met een
      dierenarts en de Gezondheidsdienst voor dieren B.V..

      2 Indien uit het onderzoek, bedoeld in [artikel 7b.29, eerste lid][ref4], van één van de eerstvolgende zes
      koppels blijkt dat de betreffende waarde, genoemd in [bijlage 12][ref5], onderdeel 2, niet wordt behaald,
      herziet de exploitant het plan van aanpak in overleg met een dierenarts en de instelling die op grond van
      [artikel 3.1 van het Besluit diergezondheid][ref6] is aangewezen voor de uitvoering van het monitoringsprogramma
      voor Newcastle disease.

      3 Het plan van aanpak, bedoeld in het tweede lid, wordt uitgevoerd bij ten minste de eerstvolgende zes koppels
      vleeskuikens die op het bedrijf worden gevaccineerd.

      4 Het plan van aanpak, bedoeld in het eerste en tweede lid, bevat in ieder geval:

      a. een analyse van de dierenarts van de mogelijke oorzaken van het niet behalen van de waarde, genoemd in
      [bijlage 12][ref7], onderdeel 2;

      b. maatregelen die erop zijn gericht om de betreffende waarde, genoemd in [bijlage 12][ref8], onderdeel 2, bij de
      volgende koppels te behalen;

      c. de naam en handtekening van de exploitant;

      d. het unieke subregistratienummer, bedoeld in [artikel 5a.1, derde lid][ref9];

      e. de datum van opstellen van het plan van aanpak.

      5 De houder stuurt een kopie van het plan van aanpak of het herziene plan van aanpak aan de Gezondheidsdienst voor
      Dieren B.V..


