  - number: 5b.14a
    text: |-
      Een injecteerbare transponder voor paardachtigen wordt uitsluitend aangebracht door een dierenarts of een persoon
      die de opleiding tot paardenpaspoortconsulent, aangeboden door de ‘Koepel Fokkerij’ voor Paardachtigen, met succes
      heeft afgerond.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.14a
  - number: 5b.15
    text: |-
      1 Het is een exploitant die runderen, paardachtigen, schapen, geiten of varkens houdt verboden om bij zijn dieren
      identificatiemiddelen, slachtmerken of gebruiksmerken aan te brengen die blijkens de op het identificatiemiddel
      vermelde gegevens door de minister aan derden ter beschikking zijn gesteld.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op exploitanten die runderen, schapen of geiten
      houden, indien de derde, bedoeld in het eerste lid, de middelen of merken aan de exploitant heeft verstrekt nadat
      hij hiervan melding heeft gemaakt als bedoeld in [artikel 5b.13, tweede lid][ref1].

      3 Het is de exploitant die dieren houdt verboden om bij zijn dieren identificatiemiddelen, slachtmerken of
      gebruiksmerken aan te brengen die niet afkomstig zijn van een erkende leverancier.

      4 Het derde lid is niet van toepassing indien een leverancier op grond van deze regeling niet hoeft te zijn erkend
      voor de verstrekking van het desbetreffende middel of merk.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.13
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.15
    references:
      - id: ref1
        bwb_id: BWBR0035248
        artikel: 5b.13
        hoofdstuk: 5b
        paragraaf: 5b.2.2
        afdeling: 5b.2
  - number: 5b.15a
    text: |-
      1 Indien bijplaatsing van een injecteerbare transponder vereist is, wordt dit gedaan binnen een week nadat
      geconstateerd is dat de injecteerbare transponder niet langer functioneert.

      2 Het bijplaatsen van een injecteerbare transponder bij een hond wordt uitgevoerd door een dierenarts.

      3 Een injecteerbare transponder wordt niet verwijderd.

      4 In afwijking van het derde lid kan een injecteerbare transponder door een dierenarts worden verwijderd indien
      voor de verwijdering een diergeneeskundige noodzaak bestaat.

      5 De dierenarts registreert de verwijdering of het bijplaatsen van een injecteerbare transponder en de noodzaak
      daartoe bij de minister via een op grond van [artikel 3.32 van het besluit][ref1] aangewezen elektronisch portaal.
      Indien geen elektronisch portaal is aangewezen, wordt de registratie rechtstreeks bij de minister gedaan.

      6 Een injecteerbare transponder wordt niet hergebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3.32
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.15a
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '3.32'
  - number: 5b.15b
    text: |-
      1 Uiterlijk een week na verlies, diefstal of het onbruikbaar worden van een injecteerbare transponder, doet degene
      die de injecteerbare transponder direct voorafgaande aan het verlies of de diefstal bezat onderscheidenlijk in het
      bezit is van de onbruikbaar geraakte injecteerbare transponder hiervan melding bij de minister via een op grond van
      [artikel 3.32 van het besluit][ref1] aangewezen elektronisch portaal.

      2 De melding wordt rechtstreeks bij de minister gedaan:

      a. indien geen elektronisch portaal is aangewezen;

      b. de injecteerbare transponder in het bezit is onderscheidenlijk was van een leverancier van injecteerbare
      transponders.

      3 In afwijking van het eerste en tweede lid wordt de melding gedaan via een instantie als bedoeld in artikel 4,
      eerste lid, van verordening (EU) nr. 2021/963, indien de melding betrekking heeft op een injecteerbare transponder
      die is bestemd voor een paardachtige.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3.32
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.15b
    references:
