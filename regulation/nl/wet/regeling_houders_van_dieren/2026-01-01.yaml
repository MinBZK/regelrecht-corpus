    text: |-
      1 De termijn, bedoeld in artikel 9 van [verordening (EU) nr. 2021/963](32863R2021), bedraagt zeven dagen vanaf de
      dag na de eerste dag waarop de paardachtige gewoonlijk in de inrichting wordt gehouden.

      2 In aanvulling op artikel 9 van [verordening (EU) nr. 2021/963](32863R2021) geven exploitanten die paardachtigen
      houden bij het doorgeven van gegevens hun relatienummer door.

      3 De exploitant geeft de gegevens, bedoeld in dit artikel, door met gebruikmaking van een middel dat daartoe door
      de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.64
  - number: 5b.64a
    text: |-
      1 Een exploitant die paardachtigen houdt, kan de gegevens, bedoeld in artikel 9 van [verordening (EU) nr. 2021/963]
      (32863R2021), en de gegevens die op grond van [artikel 5b.64, tweede lid][ref1], zijn doorgegeven, herstellen of
      intrekken.

      2 Het verzoek tot herstel of intrekking van gegevens geschiedt met gebruikmaking van een middel dat daartoe door de
      minister beschikbaar is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.64
