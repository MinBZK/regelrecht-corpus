  - number: 7b.48
    text: |-
      1 De exploitant van een levensmiddelenbedrijf, bedoeld in:

      a. de bijlage, punt 2.1, onder a, bij verordening (EU) nr. 200/2012, laat de bemonstering, bedoeld in punt 2 van
      die bijlage uitvoeren door een dierenarts of een dierenartsassistent paraveterinair;

      b. [artikel 7b.45, tweede lid][ref1], laat de bemonstering, bedoeld in dat artikellid, uitvoeren door een
      dierenarts of een dierenartsassistent paraveterinair.

      2 De exploitant van een levensmiddelenbedrijf als bedoeld in het eerste lid, onder a, laat de monsters, bedoeld in
      het eerste lid, onder a, onderzoeken op de aanwezigheid van:

      a. Salmonella enteritidis;

      b. Salmonella typhimurium;

      c. Salmonella hadar;

      d. Salmonella infantis;

      e. Salmonella virchow; en

      f. Salmonella java.


