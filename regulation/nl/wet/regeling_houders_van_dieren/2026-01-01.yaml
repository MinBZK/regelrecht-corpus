  - number: 7b.49
    text: |-
      1 De houder bewaart de uitslag van het onderzoek dat krachtens [verordening (EG) nr. 2160/2003](32003R2160) of op
      grond van deze paragraaf namens de houder is uitgevoerd gedurende twee jaar en registreert die uitslag:

      a. in een register dat op grond van [artikel 1.4 Regeling handhaving en overige zaken Wet dieren][ref1] is
      aangewezen als register voor de registratie van die gegevens; of

      b. bij de minister, voor zover voor de registratie van die gegevens geen aanwijzing als bedoeld in
      [artikel 1.4 Regeling handhaving en overige zaken Wet dieren][ref2] heeft plaatsgevonden.

      2 De houder verstrekt bij de registratie, bedoeld in het eerste lid, in ieder geval de volgende gegevens:

      a. bedoeld in artikel 93, slot, van verordening (EU) nr. 2016/429, het unieke erkenningsnummer, bedoeld in
      artikel 2, onderdeel 16, van verordening (EU) nr. 2019/2035, dan wel het unieke subregistratienummer, bedoeld in
      [artikel 5a.1, derde lid][ref3];

      b. laboratoriumcode, datum, tijdstip en aanduiding van de uitslag;

      c. bedrijfstype, soort monster, datum monstername, gegevens ter identificatie van de monsternemer, stalnummer waar
      het monster is genomen, geboortedatum en nummer van het betreffende koppel;

      d. datum ontvangst bij het laboratorium van het genomen monster, aanvangsdatum laboratoriumonderzoek, soort
      onderzoek en uitslag van het onderzoek;

      e. indien van toepassing: serotype en gegevens over afwijking in het monster.

      3 Indien blijkt dat gegevens als bedoeld in het eerste en tweede lid, niet juist of volledig zijn, verstrekt de
      houder de gecorrigeerde gegevens.

      4 Geconstateerde aanwezigheid van de serotypes enteritidis, typhimurium, hadar, infantis, virchow en java wordt
      onverwijld door de houder aan de betrokken afnemer doorgegeven.


