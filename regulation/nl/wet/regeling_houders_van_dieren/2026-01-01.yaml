  - number: 5b.65
    text: |-
      1 In deze paragraaf wordt verstaan onder:

      *ouderdieren:* vogels bestemd voor de productie van broedeieren ter verkrijging van leghennen of vleespluimvee;

      *stal:* ruimte met een omsloten luchtvolume die is bestemd om er uitsluitend één koppel in te houden;

      *vogels:* kippen, kalkoenen, parelhoenders en eenden.

      2 Deze paragraaf is van toepassing op een exploitant van vogels die op enig moment in het kalenderjaar 250 of meer
      vogels houdt.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.65
  - number: 5b.66
    text: |-
      1 Een exploitant van vogels geeft iedere verplaatsing van vogels van of naar zijn inrichting door aan het
      geautomatiseerde gegevensbestand.

      2 Een exploitant verstrekt bij het doorgeven van de verplaatsingen, bedoeld in het eerste lid, in ieder geval de
      volgende gegevens:

      a. het aan de inrichting van de exploitant toegekende unieke registratienummer;

      b. het unieke subregistratienummer, bedoeld in [artikel 5a.1, derde lid][ref1], van de inrichting van herkomst
      en bestemming;

      c. het nummer van de stal van herkomst en bestemming, wanneer die stal in Nederland is gelegen;

      d. het land van herkomst of bestemming, wanneer de vogels respectievelijk binnen of buiten Nederland zijn gebracht;

      e. het type verplaatsing;

      f. de datum van verplaatsing;

      g. het unieke subregistratienummer, bedoeld in [artikel 5a.1, derde lid][ref2], van de locatie waar de ouderdieren
      van de verplaatste vogels zijn gehouden;

      h. het aantal verplaatste vogels per geslacht;

      i. de geboortedatum van de verplaatste vogels;

      j. de soort waartoe de vogels behoren;

      k. de categorie waartoe de vogels behoren;

      l. het doel waarvoor de vogels wordt gehouden;

      m. het ras van de vogels.

      3 Indien blijkt dat gegevens als bedoeld in het tweede lid niet juist of volledig zijn, geeft de exploitant de
      gecorrigeerde gegevens door.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5a.1
      [ref2]: https://wetten.overheid.nl/BWBR0035248#Artikel5a.1
