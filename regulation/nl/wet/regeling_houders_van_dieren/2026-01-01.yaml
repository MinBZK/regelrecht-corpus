  - number: 5b.23
    text: |-
      1 In afwijking van artikel 45, eerste lid, en artikel 46, vierde en vijfde lid, van verordening (EU) nr.
      2019/2035, is identificatie van schapen of geiten door middel van één identificatiemiddel of door middel van
      een identificatiemiddel waarop het unieke registratienummer van de inrichting van geboorte staat vermeld, niet
      toegestaan.

      2 De schapen en geiten, bedoeld in het eerste lid, worden geïdentificeerd overeenkomstig artikel 45, tweede lid,
      van verordening (EU) nr. 2019/2035.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.23
  - number: 5b.24
    text: |-
      In aanvulling op artikel 46, tweede en derde lid, van verordening (EU) nr. 2019/2035, en artikel 9, tweede lid, van
      verordening (EU) nr. 2021/520, voldoet een tatoeage voor schapen of geiten, aan de volgende vereisten:

      a. de tatoeage wordt aangebracht in de kleur zwart of groen;

      b. de tatoeage wordt aangebracht met een daarvoor geschikte tang op een zodanige wijze dat de tekens goed leesbaar
      blijven.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.24
  - number: 5b.25
    text: |-
      In aanvulling op artikel 9, eerste lid, van verordening (EU) nr. 2021/520, wordt een model van een conventioneel
      identificatiemiddel voor schapen en geiten, en wijzigingen daarvan, uitsluitend goedgekeurd indien het de volgende
      kleur heeft:

      a. een groene kleur in geval van identificatie door middel van:

      1°. een conventioneel oormerk en een elektronisch oormerk; of

      2°. een conventionele pootband en een elektronisch oormerk;

      b. een grijze kleur in geval van identificatie door middel van:

      1°. een conventioneel oormerk en een bolustransponder; of

      2°. een conventionele pootband en een bolustransponder;

      c. een oranje kleur in geval van identificatie door middel van een conventioneel oormerk en een elektronische
      pootband;

      d. een witte kleur in geval van identificatie door middel van een conventioneel oormerk en een injecteerbare
      transponder.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.25
  - number: 5b.26
    text: |-
      In aanvulling op artikel 9, derde lid, en artikel 11, eerste lid, van verordening (EU) nr. 2021/520, wordt een
      model van een elektronisch identificatiemiddel voor schapen en geiten uitsluitend goedgekeurd indien het de
      volgende kleur heeft:

      a. een groene kleur in geval van identificatie door middel van:

      1°. een elektronisch oormerk en een conventioneel oormerk;

      2°. een elektronisch oormerk en een conventionele pootband; of

      3°. een elektronisch oormerk en een tatoeage;

      b. een oranje kleur in geval van identificatie door middel van een elektronische pootband en een conventioneel
      oormerk.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.26
  - number: 5b.27
    text: |-
      1 De termijn, bedoeld in artikel 14, eerste lid van verordening (EU) nr. 2021/520, bedraagt zes maanden te rekenen
      vanaf de dag na de dag van geboorte.

      2 In afwijking van het eerste lid bedraagt de termijn voor een geit geboren op een inrichting waarop op enig moment
      in het kalenderjaar vijftig geiten of meer worden gehouden ten behoeve van de bedrijfsmatige productie van melk,
      zeven dagen, te rekenen vanaf de dag na de dag van geboorte.

      3 In afwijking van artikel 17, eerste lid, van verordening (EU) nr. 2021/520, bedraagt de termijn voor
      identificatie van de daar genoemde schapen en geiten drie werkdagen te rekenen vanaf de dag na de dag van aanvoer
      op de inrichting.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.27
  - number: 5b.28
    text: |-
      1 Het is de exploitant die schapen of geiten houdt, in afwijking van artikel 45, derde lid, onderdeel b, van
      verordening (EU) nr. 2019/2035, toegestaan om:

      a. bij een schaap dat, of een geit die één identificatiemiddel heeft verloren, een nieuw identificatiemiddel aan te
      brengen, met dezelfde identificatiecode, overeenkomstig artikel 19, tweede lid, onderdeel a, van verordening (EU)
      nr. 2021/520;

      b. bij een schaap dat of een geit die een identificatiemiddel heeft verloren, het andere identificatiemiddel te
      verwijderen en bij het schaap of de geit twee nieuwe identificatiemiddelen aan te brengen overeenkomstig artikel
      19, tweede lid, onderdeel d, van verordening (EU) nr. 2021/520.

      2 [Artikel 5b.14][ref1] is van toepassing op de handelingen, genoemd in het eerste lid, onderdelen a en b.


