  - number: 7b.6
    text: |-
      1 Indien een bezettingsdichtheid van meer dan 39 kg/m2, maar ten hoogste 42 kg/m2 wordt toegepast, is de gemiddelde
      score, bedoeld in [artikel 7b.5, zesde lid][ref1], niet hoger dan 80 punten.

      2 Indien de gemiddelde score, bedoeld in [artikel 7b.5, zesde lid][ref2], in afwijking van het eerste lid, meer dan
      120 punten bedraagt,

      a. stelt de houder, zo mogelijk met behulp van een dierenarts, voor 1 maart van het jaar dat volgt op het jaar
      waarop de verstrekte gegevens betrekking hadden, een verbeterplan op met daarin de maatregelen die hij gaat
      doorvoeren in elke stal waarvoor de gemiddelde score meer dan 120 punten bedroeg, om ervoor te zorgen dat in elk
      geval aan het einde van dat jaar wordt voldaan aan het eerste lid, en

      b. past de houder in elke stal waarvoor de gemiddelde score meer dan 120 punten bedroeg, uiterlijk met ingang
      van 1 maart van het jaar dat volgt op het jaar waarop de meldingen betrekking hadden, en vervolgens ten minste
      gedurende het hele kalenderjaar, een bezettingsdichtheid toe van ten hoogste 39 kg/m².

      3 Indien de gemiddelde score, bedoeld in [artikel 7b.5, zesde lid][ref3], in afwijking van het eerste lid, meer
      dan 80 punten bedraagt maar minder dan 121 punten, stelt de houder, zo mogelijk met behulp van een dierenarts, voor
      1 februari van het jaar dat volgt op het jaar waarop de meldingen betrekking hadden, een verbeterplan op met daarin
      de maatregelen die hij gaat doorvoeren in elke stal waar de gemiddelde score meer dan 80 punten bedroeg, om ervoor
      te zorgen dat binnen een jaar wordt voldaan aan het eerste lid.

      4 Een verbeterplan wordt ingediend bij de minister. [Artikel 7b.2, tweede en vierde lid][ref4], is van
      overeenkomstige toepassing.

      5 Indien naar het oordeel van de minister de uitvoering van het verbeterplan er in redelijkheid niet toe kan leiden
      dat binnen een kalenderjaar kan worden voldaan aan het eerste lid, dient de houder op verzoek van de minister
      binnen een maand na dat verzoek een aangepast verbeterplan in.

      6 De houder voert het verbeterplan, bedoeld in het tweede lid, onderdeel a, of in het derde lid, dan wel het
      aangepaste verbeterplan, bedoeld in het vijfde lid, zo spoedig mogelijk uit.

      7 De houder bewaart bewijsstukken van de maatregelen die hij bij de uitvoering van het verbeterplan heeft genomen
      gedurende ten minste 5 jaar, gerekend vanaf de datering van die stukken.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel7b.5
