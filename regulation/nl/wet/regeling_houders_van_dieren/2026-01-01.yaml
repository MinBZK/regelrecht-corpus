  - number: 8b.9
    text: |-
      Het inplanten van een transponder door een ander dan een dierenarts, bedoeld in artikel 18 van verordening (EU)
      nr. 576/2013, is toegestaan aan degene die beroepsmatig met een zekere regelmaat transponders inbrengt.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8b.9
  - number: 8c.1
    text: |-
      Het is verboden in strijd te handelen met artikel 4 van uitvoeringsbesluit (EU) nr. 2021/260 van de Commissie van
      11 februari 2021 tot goedkeuring van nationale maatregelen ter beperking van het effect van bepaalde ziekten bij
      waterdieren overeenkomstig artikel 226, lid 3, van Verordening (EU) 2016/429 van het Europees Parlement en de Raad,
      en tot intrekking van Besluit 2010/221/EU van de Commissie (PbEU 2021, L 260).
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8c.1
  - number: 8d.1
    text: |-
      In afwijking van artikel 126, eerste lid, aanhef en onderdeel d, in samenhang met artikel 143, eerste lid, aanhef
      en onderdeel d, van [verordening (EU) nr. 2016/429](32016R0429) is het toegestaan in gevangenschap levende vogels
      als bedoeld in voornoemde verordening zonder een diergezondheidscertificaat vanuit België in Nederland te brengen
      en te verplaatsen of vanuit Nederland naar België te verplaatsen indien voldaan is aan het Reglement inzake
      verplaatsingen van in gevangenschap levende vogels aan de intra-Benelux grenzen, opgenomen in de bijlage bij de
      beschikking van het Benelux Comité van Ministers van 11 december 2023, M (2023) 14.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8d.1
  - number: '9.1'
    text: |-
      De uitoefening van de sledehondensport is uitsluitend toegestaan indien gebruik wordt gemaakt van honden, behorend
      tot de volgende rassen:

      a. Alaskan Malamute,

      b. Eskimohond,

      c. Groenlandse hond,

      d. Samojeed,

      e. Siberian husky, mits bij de honden geen pijn of letsel wordt veroorzaakt en de gezondheid of het welzijn van de
      honden niet wordt benadeeld.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel9.1
  - number: '9.2'
    text: |-
      1 Als krachttoestel als bedoeld in [artikel 2.1, tweede lid, onderdeel c, van de wet][ref1] is toegelaten een
      krachttoestel dat voldoet aan de volgende eisen:

      a. het toestel is te stabiliseren tegen de achterhand van een staande of liggende koe;

      b. het toestel beschikt over een flexibele tweedelige beugel die om de achterhand van de koe past;

      c. de bevestiging van de stang aan de beugel maakt variatie in trekrichting mogelijk;

      d. de lengte van de stang bedraagt 1,8 tot 2 meter;

      e. de trekkracht van de stang is tijdelijk te verminderen zonder afkoppelen of afglijden van het toestel;

      f. het toestel is eenvoudig te reinigen en te desinfecteren, en

      g. het toestel bevat een trekkrachtindicator.

      2 Het gebruik van het in het eerste lid bedoelde krachttoestel is uitsluitend toegestaan bij een niet vorderende
      partus bij een normale voorwaartse of achterwaartse ligging van het kalf, indien:

      a. de koe niet eigenmachtig de geboorte kan voltooien, en

      b. redelijkerwijs vaginale verlossing mogelijk is.

      3 In afwijking van het eerste lid, is tot 1 januari 2025 een krachttoestel toegelaten dat voldoet aan de eisen,
      genoemd in onderdelen a tot en met f, indien deze is aangeschaft vóór 1 juli 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel9.2
    references:
