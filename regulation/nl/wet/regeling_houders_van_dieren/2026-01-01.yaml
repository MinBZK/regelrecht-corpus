  - number: 5b.8a
    text: |-
      1 Een aanvraag tot erkenning van een leverancier als bedoeld in [artikel 1.58c, eerste lid, van het besluit][ref1]
      wordt ingediend bij de minister.

      2 Op een aanvraag wordt binnen een termijn van zes weken beslist. De minister kan de beslissing op de aanvraag
      eenmaal met zes weken verdagen.

      3 De aanvraag gaat vergezeld van:

      a. een bewijs van inschrijving in het handelsregister;

      b. documenten waarmee de leverancier aantoont injecteerbare transponders te kunnen leveren die voldoen aan de
      volgende technische voorschriften:

      1° voor paardachtigen: bijlage I, deel I, bij [verordening (EU) nr. 2021/963](32863R2021);

      2° voor runderen, schapen, geiten, varkens, kameelachtigen, hertachtigen en papegaaiachtigen: bijlage II, deel II,
      bij [verordening (EU) nr. 2021/520](32420R2021);

      3° in andere gevallen dan genoemd onder 1° en 2°: bijlage II bij [verordening (EU) nr. 576/2013](32013R0576);

      c. documenten op basis waarvan kan worden beoordeeld dat wordt voldaan aan
      [artikel 1.58c, eerste lid, onderdelen b en c][ref2].

      4 Indien de aanvrager geen onderneming heeft als bedoeld in [artikel 5 van de Handelsregisterwet 2007][ref3] wordt
      bij de aanvraag het bewijs van inschrijving in het handelsregister vervangen door een bewijs waarmee de aanvrager
      aantoont een rechtspersoon te zijn in de zin van artikel 54 van het Verdrag betreffende de werking van de Europese
      Unie, die in een lidstaat van de Europese Unie of van de Europese Economische Ruimte is gevestigd.

      5 [Artikel 28, eerste lid, van de Dienstenwet][ref4] is niet van toepassing op een aanvraag tot erkenning van een
      leverancier als bedoeld in [artikel 1.58c, eerste lid, van het besluit][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.58c
      [ref2]: https://wetten.overheid.nl/BWBR0035217#Artikel1.58c
      [ref3]: https://wetten.overheid.nl/BWBR0021777#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0035217#Artikel1.58c
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.8a
