        artikel: '1'
  - number: '8.3'
    text: |-
      1 Voor zover een hond in een inrichting verblijft, laat de beheerder een hond inenten tegen de volgende ziekten:

      a. Parvovirusinfectie;

      b. de ziekte van Carré en

      c. Hepatitis Contagiosia Canis.

      2 Een hond wordt binnen 7 weken na de geboorte tegen de in het eerste lid, onderdelen a en b, bedoelde ziekten
      ingeënt, met dien verstande dat, in het geval van verkoop of aflevering, de hond uiterlijk 7 dagen vóór het moment
      van verkoop of aflevering wordt ingeënt.

      3 Voor zover een hond in een inrichting verblijft, laat de beheerder de inenting, bedoeld in het eerste lid,
      onderdeel c, en de benodigde herhalingsentingen tegen de in het eerste lid bedoelde ziekten plaatsvinden.

      4 Indien bij binnenkomst van een hond de vaccinatiestatus onvolledig of onbekend is, laat de beheerder de hond
      binnen 5 werkdagen tegen de in het eerste lid bedoelde ziekten inenten.

      5 Indien inenting binnen de termijnen, genoemd in het tweede en vierde lid, niet overeenstemt met de bijsluiter van
      het vaccin, wordt de inenting gedaan binnen de termijn die in de bijsluiter is genoemd.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8.3
  - number: '8.4'
    text: |-
      1 Voor zover een kat in een inrichting verblijft, laat de beheerder een kat inenten tegen de volgende ziekten:

      a. Panleucopenievirus en

      b. Feline herpes- en calicivirus.

      2 Een kat wordt binnen 7 weken na de geboorte tegen de in het eerste lid bedoelde ziekten ingeënt, met dien
      verstande dat, in het geval van verkoop of aflevering, de kat uiterlijk 7 dagen vóór het moment van verkoop of
      aflevering wordt ingeënt.

      3 Voor zover de kat in een inrichting verblijft, laat de beheerder de benodigde herhalingsentingen tegen de in het
      eerste lid bedoelde ziekten plaatsvinden.

      4 Indien bij binnenkomst van een kat de vaccinatiestatus onvolledig of onbekend is, laat de beheerder de kat binnen
      5 werkdagen tegen de in het eerste lid bedoelde ziekten inenten.

      5 Indien inenting binnen de termijnen, genoemd in het tweede en vierde lid, niet overeenstemt met de bijsluiter van
      het vaccin, wordt de inenting gedaan binnen de termijn die in de bijsluiter is genoemd.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8.4
  - number: '8.5'
    text: |-
      1 Het bewijs van inenting, bedoeld in [artikel 3.15, onderdeel b, van het besluit][ref1], is een door een
      dierenarts opgemaakt en schriftelijk afgegeven bewijs.

      2 Het is het eerste lid bedoelde bewijs heeft betrekking op de inentingen die overeenkomstig de
      [artikelen 8.3][ref2] en [8.4][ref3] hebben plaatsgevonden en bevat de volgende gegevens:

        - naam en praktijkadres van de dierenarts;
        - de inentingsdatum, het herhalingsinterval en voor zover dat van toepassing is de hiervan gemotiveerde
      afwijkingen;
        - geslacht van het dier;
        - kleur van het dier;
        - voor zover bekend, ras van het dier;
        - voor zover bekend, geboortedatum van het dier en
        - indien aanwezig, het identificatienummer van de chip of de cijfer- en lettercode van de tatoeage.

      3 Met het in het eerste lid bedoelde bewijs van inenting wordt gelijkgesteld een bewijs van inenting dat ingevolge
      het [Honden- en kattenbesluit 1999][ref4] voor desbetreffende hond of kat is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel3.15
      [ref2]: https://wetten.overheid.nl/BWBR0035248#Artikel8.3
