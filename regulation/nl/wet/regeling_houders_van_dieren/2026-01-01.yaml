      1 De verschillende betrokken partners in de veehouderijsector voeren zelf kwaliteitscontrole uit, gericht op
      de naleving van [artikel 2.2, vijfde lid, van de Wet dieren][ref1], [artikel 2.8 van het besluit][ref2] en
      [artikel 5.3 van de Regeling diergeneesmiddelen 2022][ref3].

      2 Bij kwaliteitscontrole als bedoeld in het eerste lid:

      a. worden de zelfcontrolemaatregelen opgenomen in daarvoor in aanmerking komende algemene voorwaarden voor merken
      en labels;

      b. vervallen de voordelen, verbonden aan de deelname aan een kwaliteitscontrolesysteem, voor een bedrijf ten
      aanzien waarvan vanwege niet-naleving van regels als bedoeld in het eerste lid, maatregelen als bedoeld in
      artikel 138, eerste lid, van [verordening (EU) 2017/625](32525R2017) of [artikel 5.10][ref4], [5.11][ref5] of
      [5.12 van de wet][ref6] maatregelen zijn getroffen, gedurende een periode van ten minste twaalf maanden vanaf de
      datum vanaf de datum dat deze maatregelen zijn opgeheven.


