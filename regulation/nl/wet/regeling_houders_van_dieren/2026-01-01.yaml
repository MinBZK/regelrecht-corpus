  - number: '8.1'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *aanvrager:* migrerende beroepsbeoefenaar als bedoeld in
      [artikel 1 van de Algemene wet erkenning EU-beroepskwalificaties][ref1], die erkenning van beroepskwalificaties
      aanvraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel1
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8.1
    references:
      - id: ref1
