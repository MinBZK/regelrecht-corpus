    text: |-
      In dit hoofdstuk wordt verstaan onder: ‘stal’: ruimte met een omsloten luchtvolume die is bestemd om er uitsluitend
      één koppel in te houden.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5a.0
  - number: 5a.1
    text: |-
      1 In aanvulling op artikel 84, eerste lid, onderdeel b, van verordening (EU) nr. 2016/429 verstrekken exploitanten
      van een inrichting met het oog op de registratie daarvan, de volgende gegevens:

      a. wanneer er op de inrichting landdieren, met uitzondering van runderen, schapen, geiten en paardachtigen, worden
      gehouden: in voorkomend geval de datum van het begin van de periode waarin er in de inrichting geen dieren worden
      gehouden;

      b. wanneer er op de inrichting kippen, kalkoenen, parelhoenders, eenden, ganzen, kwartels, duiven, fazanten,
      patrijzen of loopvogels worden gehouden: het unieke nummer van elk tot de inrichting behorende stal, waar deze
      vogels worden gehouden;

      c. hun relatienummer.

      2 Artikel 84, tweede lid, aanhef en onderdeel a, van verordening (EU) nr. 2016/429, is van overeenkomstige
      toepassing op wijzigingen ten aanzien van gegevens als bedoeld in het eerste lid.

      3 Wanneer op een inrichting kippen, kalkoenen, parelhoenders, eenden, ganzen, kwartels, duiven, fazanten, patrijzen
      of loopvogels worden gehouden, kent de minister aan de inrichting voor elk afzonderlijk doel waarvoor deze vogels
      worden gehouden, een uniek subregistratienummer toe.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5a.1
  - number: 5a.2
    text: |-
