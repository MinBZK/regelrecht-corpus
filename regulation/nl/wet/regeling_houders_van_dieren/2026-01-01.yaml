      1 De exploitant kan de gegevens die op grond van deze paragraaf zijn doorgegeven herstellen of intrekken.

      2 Het verzoek tot herstel of intrekking van gegevens, geschiedt via een elektronisch portaal als bedoeld in
      [artikel 1.4, derde lid, van de Regeling handhaving en overige zaken Wet dieren][ref1], of, indien de minister
      geen elektronisch portaal heeft aangewezen, bij de minister met gebruikmaking van een middel dat daartoe door de
      minister beschikbaar is gesteld.


