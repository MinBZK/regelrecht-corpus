  - number: 5b.39
    text: |-
      1 De termijn, bedoeld in artikel 21, eerste lid, van [verordening (EU) nr. 2021/963](32863R2021), bedraagt negen
      maanden na de geboorte van de paardachtige.

      2 De termijn voor indiening van een aanvraag door de exploitant voor de afgifte van een uniek, levenslang geldig
      identificatiedocument als bedoeld in artikel 58, eerste lid, onderdeel b, van [verordening (EU) nr. 2019/2035]
      (32035R2019), bedraagt zes maanden na de geboorte van de paardachtige.

      3 De termijn, bedoeld in artikel 14, derde lid, van [verordening (EU) nr. 2021/963](32863R2021), bedraagt zeven
      dagen vanaf de dag na de dag waarop het verlies of storing van het identificatiemiddel is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.39
  - number: 5b.41
    text: |-
      De termijn, bedoeld in artikel 16, van verordening (EU) nr. 2021/520, bedraagt negen maanden vanaf de geboorte van
      een kameel- of hertachtige.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.41
  - number: 5b.42
    text: |-
      1 Het is de exploitant die kameel- of hertachtigen houdt, in afwijking van artikel 73, derde lid, onderdeel
      b, van verordening (EU) nr. 2019/2035, toegestaan om ervoor te zorgen dat bij een kameel- of hertachtige die
      één identificatiemiddel heeft verloren, een identificatiemiddel aan te brengen met dezelfde identificatiecode,
      overeenkomstig artikel 19, tweede lid, onderdeel a, van verordening (EU) nr. 2021/520.

      2 [Artikel 5b.14][ref1] is van toepassing op de handelingen, genoemd in het eerste lid, onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.14
