  - number: 2.2a
    text: |-
      1 De Minister houdt bij het nemen van een besluit op een aanvraag als bedoeld in [artikel 2.2][ref1] rekening met
      een wetenschappelijke beoordeling van de gevraagde aanwijzing of intrekking ervan.

      2 De beoordeling, bedoeld in het eerste lid, is opgesteld door een onafhankelijk wetenschappelijk orgaan aan de
      hand van de criteria, bedoeld in [artikel 1.4, eerste lid, van het besluit][ref2].


