    text: |-
      1 Artikel 105, eerste lid, van verordening (EU) nr. 2016/429 en artikel 35 van verordening (EU) nr. 2019/2035 zijn
      van overeenkomstige toepassing op een verzamelcentrum als bedoeld in [artikel 5c.3, eerste lid][ref1].

      2 De gegevens, bedoeld in het eerste lid, worden nadat de gegevens bekend zijn bij de exploitant van het
      verzamelcentrum onverwijld bijgehouden.

      3 De exploitant bewaart de gegevens, bedoeld in het eerste lid, ten minste drie jaar.


