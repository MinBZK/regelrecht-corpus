  - number: 8b.3
    text: |-
      1 Blanco identificatiedocumenten worden uitsluitend uitgegeven door erkende uitgevers en worden elk voorzien van
      een unieke alfanumerieke code die door de minister aan hen is verstrekt.

      2 Blanco identificatiedocumenten voldoen aan de voorschriften die zijn gesteld bij of krachtens artikel 21 van
      verordening (EU) nr. 576/2013.

      3 Bij de aanvraag tot erkenning verstrekt de uitgever aan de minister:

      a. de naam, het adres en de vestigingsplaats van de uitgever; en

      b. een model van de uit te geven identificatiedocumenten.

      4 De minister erkent een uitgever indien het model van de uit te geven blanco identificatiedocumenten, bedoeld
      in het derde lid, onderdeel b, voldoet aan de voorschriften die zijn gesteld bij of krachtens artikel 21 van
      verordening (EU) nr. 576/2013.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8b.3
  - number: 8b.4
    text: |-
      1 Erkende uitgevers registreren de levering van blanco identificatiedocumenten bij de minister.

      2 Bij de registratie wordt vermeld:

      a. het nummer dat de dierenarts aan wie de blanco identificatiedocumenten zijn geleverd heeft verkregen bij de
      registratie in het register, bedoeld in [artikel 4.3, eerste lid, van de wet][ref1];

      b. de unieke alfanumerieke codes van de uitgegeven blanco identificatiedocumenten; en

      c. de datum waarop de blanco identificatiedocumenten zijn geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel8b.4
