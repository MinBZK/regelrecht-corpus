  - number: '5.10'
    text: |-
      1 Na ontwatering wordt een aal gedurende ten minste één seconde blootgesteld aan een elektrische stroomsterkte
      van ten minste 1,3 A gemiddeld, bij een golfvorm die bestaat uit een combinatie van een wisselstroom van 100 Hz ac
      sinusvormig en een gelijkstroom.

      2 Om te voorkomen dat de aal bijkomt gedurende het dodingsproces, wordt de aal na de blootstelling, bedoeld in het
      eerste lid, gedurende ten minste negentien seconden blootgesteld aan een elektrische stroomsterkte van ten minste
      0,66 A gemiddeld.

      3 De aal wordt pas blootgesteld aan de elektrische stroom op het moment dat deze zich tussen de elektroden van het
      bedwelmingsapparaat bevindt.

      4 De huid van de aal is vochtig gedurende de gehele periode van blootstelling aan de elektrische stroom.

      5 Aal die zich buiten de elektroden van het bedwelmingsapparaat bevindt, maakt geen contact met aal die zich tussen
      de elektroden van het bedwelmingsapparaat bevindt.

      6 Aal die zich buiten de elektroden van het bedwelmingsapparaat bevindt, wordt niet blootgesteld aan statische
      elektriciteit.

      7 Om te voorkomen dat bedwelmde aal bijkomt voordat het dodingsproces is voltooid, bedraagt het tijdsinterval
      tussen de blootstelling aan de elektrische stroom en de aanvang van het dodingsproces niet meer dan zestig
      seconden, welk tijdsinterval ingaat op het moment dat de aal niet meer is blootgesteld aan de elektrische stroom.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5.10
  - number: '5.11'
    text: |-
      1 De elektrische veldsterkte van het water in een waterbad waarin aal elektrisch bedwelmd wordt is zodanig homogeen
      dat de variatie in de elektrische veldsterkte van het water in het waterbad ten hoogste twee procent bedraagt.

      2 De geleidbaarheid van het water in het waterbad bedraagt ten minste 500 µS/cm.

      3 De combinatie van de elektrische veldsterkte en de geleidbaarheid van het water is dusdanig dat bij elke aal de
      bewusteloosheid onmiddellijk wordt opgewekt.

      4 Elke aal wordt na het ingaan van het waterbad gedurende één seconde blootgesteld aan:

      a) een elektrische stroomdichtheid van ten minste 0,64 A /dm2, waarbij de golfvorm sinusvormig is en de frequentie
      50 Hz, of

      b) een elektrische stroomdichtheid van ten minste 0,5 A/dm2, waarbij de golfvorm een bipolaire blokgolf van 133 Hz
      is met een arbeidscyclus van 43%.

      5 Om te voorkomen dat de aal bijkomt gedurende het dodingsproces, wordt de aal na de blootstelling, bedoeld in het
      vierde lid, gedurende negentien seconden blootgesteld aan:

      a. een elektrische stroomdichtheid van 0,15 A/ dm2, waarbij de golfvorm sinusvormig is en de frequentie 50 Hz, of

      b. een elektrische stroomdichtheid van ten minste 0,12 A/dm2 waarbij de golfvorm een bipolaire blokgolf van 133 Hz
      is met een arbeidscyclus van 43%.

      7 De aal wordt pas blootgesteld aan de elektrische stroom op het moment dat deze zich tussen de elektroden van het
      bedwelmingsapparaat bevindt.

      8 Aal die zich buiten de elektroden van het bedwelmingsapparaat bevindt, maakt geen contact met aal die zich tussen
      de elektroden van het bedwelmingsapparaat bevindt.

      9 Aal die zich buiten de elektroden van het bedwelmingsapparaat bevindt, wordt niet blootgesteld aan statische
      elektriciteit.

      10 Om te voorkomen dat bedwelmde aal bijkomt voordat het dodingsproces voltooid is, bedraagt het tijdsinterval
      tussen de blootstelling aan de elektrische stroom en de aanvang van het dodingsproces niet meer dan zestig
      seconden. Dit tijdsinterval gaat in op het moment dat de aal niet meer is blootgesteld aan de elektrische stroom.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5.11
