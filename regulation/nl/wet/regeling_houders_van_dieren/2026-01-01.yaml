  - number: 7b.9
    text: |-
      1 De minister erkent een certificaat als bedoeld in [artikel 2.54, eerste lid, van het besluit][ref1], indien dit
      certificaat betrekking heeft op:

      a. een opleiding die voldoet aan één van de volgende kwalificaties:

        - Dierverzorger hokdieren (Opleidingscode 97702), alleen voor cohorten 2012-2014, of
        - Dierenhouder hokdieren (Opleidingscode 97712), voor cohorten 2012-2013 en daaropvolgende jaren;

      b. de certificeerbare eenheid ‘welzijn van vleeskuikens’;

      c. Het certificaat houder van vleeskuikens (C0010 of K0602) als bedoeld in
      [artikel 1 van de Regeling certificaten groen beroepsonderwijs][ref2] of een diploma dat mede dat certificaat
      omvat.

      2 De minister erkent een certificaat als bedoeld in artikel 4, derde lid, van de [richtlijn nr. 2007/43/EG]
      (32007L0043) dat is afgegeven of erkend door de bevoegde autoriteit van de lidstaat van de Europese Unie.

      3 Naast de aspecten, genoemd in [artikel 2.54, derde lid, van het besluit][ref3] heeft de vleeskuikenhouder tevens
      kennis van:

      a. contactdermatitis bij vleeskuikens, en

      b. maatregelen die in het kader van de bedrijfsvoering kunnen worden genomen om het ontstaan van contactdermatitis
      te voorkomen dan wel tegen te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel2.54
      [ref2]: https://wetten.overheid.nl/BWBR0032494#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0035217#Artikel2.54
