        bwb_id: BWBR0035217
        artikel: '3.32'
  - number: 5b.16
    text: |-
      Als elektronische identificatiemiddelen voor runderen zijn uitsluitend toegestaan de middelen, genoemd in bijlage
      III, onder c, d, of e, bij verordening (EU) nr. 2019/2035.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.16
  - number: 5b.17
    text: |-
      1 Het is de exploitant die runderen houdt, in afwijking van artikel 38, eerste lid, onderdeel c, van verordening
      (EU) nr. 2019/2035, toegestaan om bij zijn runderen de conventionele oormerken, bedoeld in artikel 38, eerste lid,
      van verordening (EU) nr. 2019/2035, te verwijderen en te vervangen door één van de in bijlage III, onder c, d of
      e, bij die verordening genoemde identificatiemiddelen met een bijpassend conventioneel oormerk dat voldoet aan
      [artikel 5b.18][ref1].

      2 Wanneer toepassing wordt gegeven aan het eerste lid, wordt het vervangende elektronische oormerk, voor zover dat
      mogelijk is, aangebracht in het bestaande gat in het oor van het rund.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.18
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.17
    references:
      - id: ref1
        bwb_id: BWBR0035248
        artikel: 5b.18
        hoofdstuk: 5b
        paragraaf: 5b.3.1
        afdeling: 5b.3
  - number: 5b.18
    text: |-
      1 In aanvulling op artikel 9, eerste lid, van verordening (EU) nr. 2021/520, wordt een model van een conventioneel
      oormerk voor runderen, en wijzigingen daarvan, uitsluitend goedgekeurd indien het oormerk de volgende kleur heeft:

      a. een gele kleur in geval van identificatie door middel van twee conventionele oormerken;

      b. een groene kleur in geval van identificatie door middel van een conventioneel oormerk en een elektronisch
      oormerk;

      c. een grijze kleur in geval van identificatie door middel van een conventioneel oormerk en een bolustransponder;

      d. een witte kleur in geval van identificatie door middel van een conventioneel oormerk en een injecteerbare
      transponder.

      2 In aanvulling op artikel 9, derde lid, en artikel 11, eerste lid, van verordening (EU) nr. 2021/520, wordt
      een model van een elektronisch oormerk voor runderen dat wordt gebruikt bij identificatie door middel van een
      conventioneel oormerk en een elektronisch oormerk, en wijzigingen daarvan, uitsluitend goedgekeurd indien het
      oormerk een groene kleur heeft.

      3 Het is toegestaan om in aanvulling op het eerste en tweede lid, op een conventioneel oormerk of een elektronisch
      oormerk voor runderen een streepjescode aan te brengen.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.18
  - number: 5b.19
    text: |-
      1 De termijn, bedoeld in artikel 13, eerste lid van verordening (EU) nr. 2021/520, bedraagt drie werkdagen, te
      rekenen vanaf de dag na de dag van geboorte.

      2 In afwijking van artikel 13, eerste lid van verordening (EU) nr. 2021/520, bedraagt de termijn voor het inbrengen
      van een bolustransponder als bedoeld in bijlage III, onder d, bij verordening (EU) nr. 2019/2035 maximaal 60 dagen,
      te rekenen vanaf de dag na de dag van geboorte.

      3 In afwijking van artikel 17, eerste lid van verordening (EU) nr. 2021/520, bedraagt de termijn voor identificatie
      van de daar genoemde runderen drie werkdagen, te rekenen vanaf de dag na de dag van aanvoer op de inrichting.

      4 In afwijking van het eerste en tweede lid en artikel 17, eerste lid, van verordening (EU) nr. 2021/520, bedraagt
      de termijn voor het inbrengen van een bolustransponder als bedoeld in bijlage III, onder d, bij verordening (EU)
      nr. 2019/2035 maximaal 60 dagen, te rekenen vanaf de dag na de dag van geboorte.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.19
  - number: 5b.20
    text: |-
      1 In afwijking van artikel 13, eerste lid, van verordening (EU) nr. 2021/520, bedraagt de termijn, bedoeld in dat
      artikellid, negen maanden, indien:

      a. voldaan is aan de eisen van artikel 13, derde lid, onderdelen a tot en met c, van verordening (EU) nr. 2021/520;

      b. de dieren zijn geboren in een door de minister aangewezen natuurterrein;

      c. de minister van de geboorte van elk kalf in kennis wordt gesteld binnen de termijn, bedoeld in
      [artikel 5b.49, eerste lid][ref1].

      2 Wanneer bij kalveren onder toepassing van het eerste lid zes maanden of later na hun geboorte
      identificatiemiddelen worden aangebracht, wordt bij het aanbrengen van de identificatiemiddelen de identiteit van
      het moederdier op grond van een DNA-test geverifieerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.49
