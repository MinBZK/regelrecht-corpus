  - number: 5b.50
    text: |-
      De gegevens, bedoeld in artikel 3, eerste lid, van verordening (EU) nr. 2021/520, en in deze paragraaf, worden
      doorgegeven met gebruikmaking van een middel dat daartoe door de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.50
  - number: 5b.51
    text: |-
      1 Een exploitant die runderen houdt kan de gegevens, bedoeld in artikel 3, eerste lid, van verordening (EU) nr.
      2021/520, en de gegevens die op grond van deze paragraaf zijn doorgegeven, herstellen of intrekken.

      2 Het verzoek tot herstel of intrekking van gegevens, geschiedt met gebruikmaking van een middel dat daartoe door
      de minister beschikbaar is gesteld.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.51
  - number: 5b.52
    text: |-
      1 Exploitanten die schapen en geiten houden, geven bij het aanbrengen van de identificatiemiddelen na de geboorte
      van een schaap of geit, de volgende gegevens door aan het geautomatiseerde gegevensbestand:

      a. de identificatiecode van het schaap of de geit;

      b. het unieke registratienummer van de inrichting van geboorte;

      c. de geboortedatum;

      d. de diersoort; en

      e. hun relatienummer.

      2 In aanvulling op het eerste lid, geeft de exploitant die geiten houdt op een inrichting waarop op enig moment in
      het kalenderjaar vijftig geiten of meer worden gehouden ten behoeve van de bedrijfsmatige productie van melk, het
      geslacht van het dier door.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.52
  - number: 5b.53
    text: |-
      1 Exploitanten die schapen en geiten houden, geven bij de sterfte, slacht of verlies van een schaap of geit, de
      volgende gegevens door aan het geautomatiseerde gegevensbestand:

      a. de identificatiecode van het schaap of de geit;

      b. de datum waarop het dier op de inrichting is gestorven;

      c. de diersoort; en

      d. hun relatienummer.

      2 De exploitant van een inrichting waarop op enig moment in het kalenderjaar vijftig geiten of meer worden
      gehouden ten behoeve van de bedrijfsmatige productie van melk, stelt de minister in kennis van elke geboorte
      van een geit vanaf de laatste week van dracht waarbij de geit op het moment van geboorte niet levend is, of
      waarbij de geit sterft voordat bij de geit een identificatiemiddel is aangebracht, onder vermelding van het
      unieke registratienummer van de betrokken inrichting hun relatienummer, de datum waarop de doodgeboorte heeft
      plaatsgevonden en het geslacht van de geit.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.53
  - number: 5b.54
    text: |-
      1 In aanvulling op artikel 113, eerste lid, onderdeel c, van verordening (EU) nr. 2016/429 geeft een exploitant die
      schapen of geiten houdt, de volgende gegevens door aan het geautomatiseerde gegevensbestand:

      a. de gegevens, bedoeld in artikel 49, aanhef, onderdeel b, van verordening (EU) nr. 2019/2035;

      b. de identificatiecode van de dieren die worden verplaatst naar en van de inrichting; en

      c. hun relatienummer.

      2 De exploitant die schapen of geiten houdt, stelt de minister bij de afvoer van een schaap of geit, in aanvulling
      op het eerste lid, in kennis van gegevens over: de diersoort.

      3 Als het doorgeven van gegevens, bedoeld in het eerste lid, betrekking heeft op de aanvoer van een schaap of geit,
      afkomstig uit een lidstaat, geeft de exploitant die schapen en geiten houdt ook het land van herkomst, het nummer
      van het gezondheidscertificaat en de diersoort door.

      4 Als het doorgeven van de gegevens, bedoeld in het eerste lid, betrekking heeft op de aanvoer van een schaap of
      geit, afkomstig uit een lidstaat, op een verzamelcentrum van waaruit het schaap of de geit binnen drie dagen na
      aanvoer, wordt verplaatst naar een andere lidstaat, geeft de exploitant die schapen en geiten houdt in aanvulling
      op het eerste lid, het land van herkomst en bestemming en het nummer van het gezondheidscertificaat door.

      5 Als het doorgeven van gegevens, bedoeld in het eerste lid, betrekking heeft op de aanvoer van een schaap of geit,
      afkomstig uit een derde land, geeft de exploitant die schapen en geiten houdt tevens het land van herkomst, het
      nummer van het gezondheidscertificaat, de diersoort en de oorspronkelijke identificatiecode van het dier door.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.54
  - number: 5b.55
    text: |-
      De exploitant die schapen of geiten houdt, stelt de minister bij het vervangen van een verloren identificatiemiddel
      door twee nieuwe identificatiemiddelen, als bedoeld in [artikel 5b.28 onderdeel b][ref1], in kennis van de
      identificatiecode van het oorspronkelijke merk, de identificatiecode van de nieuwe identificatiemiddelen, de datum
      van het aanbrengen van de nieuwe identificatiemiddelen, het unieke registratienummer van de inrichting, en hun
      relatienummer.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.28
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.55
    references:
