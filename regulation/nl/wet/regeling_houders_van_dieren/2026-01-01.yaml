  - number: 5b.62
    text: |-
      1 De exploitant geeft de gegevens, bedoeld in de [artikelen 5b.59][ref1] en [5b.60][ref2], door via een elektronisch
      portaal dat op grond van [artikel 1.4, derde lid, van de Regeling handhaving en overige zaken Wet dieren][ref3] is
      aangewezen als elektronisch portaal voor de melding van die gegevens.

      2 Indien de minister meer dan één elektronisch portaal heeft aangewezen, volstaat het doorgeven van de gegevens bij
      een van de elektronische portalen.

      3 Indien de minister geen elektronisch portaal heeft aangewezen, geeft de exploitant de gegevens, bedoeld in
      de [artikelen 5b.59][ref4] en [5b.60][ref5], door met gebruikmaking van een middel dat daartoe door de minister
      beschikbaar is gesteld.

      4 Indien blijkt dat gegevens als bedoeld in het eerste lid, niet juist of volledig zijn, verstrekt de exploitant de
      gecorrigeerde gegevens.

      5 De exploitant geeft de gecorrigeerde gegevens, bedoeld in het vierde lid, binnen twee werkdagen, te rekenen vanaf
      de dag na de dag dat de exploitant op de hoogte is gesteld van de onjuistheid of onvolledigheid van de gegevens of
      de onjuistheid of onvolledigheid heeft vastgesteld in het geval hij hiervan niet op de hoogte is gesteld.


