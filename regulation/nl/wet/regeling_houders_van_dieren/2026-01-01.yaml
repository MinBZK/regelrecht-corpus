  - number: '8.11'
    text: |-
      Indien de aanvrager op grond van [artikel 11 van de Algemene wet erkenning EU-beroepskwalificaties][ref1] een
      aanpassingsstage moet doorlopen, wordt de aanvrager schriftelijk medegedeeld:

      a. de vakken waarop de aanpassingsstage betrekking heeft;

      b. de duur van de aanpassingsstage;

      c. in voorkomend geval de aanvullende opleiding die deel uitmaakt van de aanpassingsstage.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
