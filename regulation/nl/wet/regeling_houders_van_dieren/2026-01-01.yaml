  - number: 7b.36
    text: |-
      1 Indien uit het onderzoek, bedoeld in [artikel 7b.29, eerste lid][ref1], blijkt dat de betreffende waarde, bedoeld
      in [bijlage 12][ref2], onderdeel 1, bij een koppel vermeerderingsdieren van de soort kip of kalkoen, of kippen of
      kalkoenen die worden opgefokt tot vermeerderingsdier, leghennen of dieren die worden opgefokt tot leghen niet wordt
      behaald, laat de exploitant de dieren terstond door een dierenarts vaccineren.

      2 Binnen vier weken na vaccinatie, bedoeld in het eerste lid, worden de dieren, bedoeld in dat lid opnieuw
      onderzocht. [Artikel 7b.29][ref3] in samenhang met [artikel 7b.31, aanhef][ref4] of [7b.32, aanhef][ref5], zijn van
      overeenkomstige toepassing.

      3 De houder stuurt uiterlijk twee weken na de vaccinatie een kopie van de gegevens,
      bedoeld in [artikel 7b.28, vierde lid][ref6], aan de instelling die op grond van
      [artikel 3.1 van het Besluit diergezondheid][ref7] is aangewezen voor de uitvoering van het monitoringsprogramma
      voor Newcastle disease.


