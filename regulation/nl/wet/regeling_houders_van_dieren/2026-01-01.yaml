  - number: 5b.33
    text: |-
      In aanvulling op artikel 52, eerste lid, onderdeel b, van verordening (EU) nr. 2019/2035, en artikel 9, tweede
      lid, van verordening (EU) nr. 2021/520, voldoet een tatoeage ingeval van een raszuiver fokvarken of een hybride
      fokvarken als bedoeld in artikel 2, onderdelen 9 of 10, van verordening (EU) 2016/1012 aan de volgende vereisten:

      a. de tatoeage wordt aangebracht in de kleur zwart of groen;

      b. de tatoeage wordt aangebracht met een daarvoor geschikte tang op een zodanige wijze dat de tekens goed leesbaar
      blijven.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.33
  - number: 5b.34
    text: |-
      1 Een model van een slachtmerk voor varkens, en wijzigingen daarvan, wordt uitsluitend goedgekeurd indien het
      voldoet aan de volgende vereisten:

      a. het slachtmerk is vervaardigd van metaal;

      b. het slachtmerk is een beugelmerk;

      c. op één zijde van het slachtmerk, in de afmeting van 6,5 bij 3,5 millimeter, zijn de volgende gegevens
      aangebracht:

      1°. het unieke registratienummer van de inrichting waarvan het varken voor de slacht wordt afgevoerd; en

      2°. het logo zoals afgebeeld in bijlage 6;

      d. een slachtmerk een lengte heeft van maximaal 55 millimeter.

      2 Het is toegestaan om, in aanvulling op het eerste lid, onderdeel c, een individueel volgnummer van het
      betreffende dier aan te brengen.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.34
  - number: 5b.35
    text: |-
      1 Een model van een gebruiksmerk voor varkens, en wijzigingen daarvan, wordt uitsluitend goedgekeurd indien het
      voldoet aan de volgende vereisten:

      a. het gebruiksmerk is vervaardigd van thermoplastisch kunststof;

      b. het merkdeel waarop de gegevens, bedoeld in onderdeel c, staan, heeft een witte kleur;

      c. op het merkdeel van het oormerk dat na aanbrengen van het merk direct zichtbaar is, staat uitsluitend vermeld:

      1°. de letters ‘NL’, gevolgd door het unieke registratienummer van de laatste inrichting waar het varken verblijft
      voordat het, al dan niet via een verzamelcentrum, wordt afgevoerd naar een slachthuis, dat een minimumhoogte heeft
      van 7 millimeter en maximumhoogte van 10 millimeter; en

      2°. de letters ‘LNV’; en

      d. de informatie op het merk is in zwart schrift aangebracht.

      2 Het is toegestaan om, in aanvulling op het eerste lid, onderdeel c, een individueel volgnummer van het
      betreffende dier te vermelden.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5b.35
  - number: 5b.36
    text: |-
      1 De termijn, bedoeld in artikel 15, eerste lid, van verordening (EU) nr. 2021/520 bedraagt uiterlijk binnen drie
      maanden, en indien de dieren eerder worden gespeend, binnen een week na het spenen.

      2 In afwijking van artikel 17, eerste lid, van verordening (EU) nr. 2021/520 bedraagt de termijn voor identificatie
      van de daar genoemde varkens drie werkdagen, te rekenen vanaf de dag na de dag van aanvoer op de inrichting van
      bestemming.

      3 Het slachtmerk, bedoeld in [artikel 5b.34][ref1], of het gebruiksmerk, bedoeld in [artikel 5b.35][ref2],
      wordt bij slachtvarkens aangebracht voordat deze van een inrichting, al dan niet via een verzamelcentrum, worden
      afgevoerd naar een slachthuis.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.34
      [ref2]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.35
