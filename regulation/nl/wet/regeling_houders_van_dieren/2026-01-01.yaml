  - number: 3a.2
    text: |-
      1 De exploitant van een inrichting waar pluimvee wordt gehouden, meldt elke sterfte van:

      a. een koppel leghennen, vermeerderingsdieren of vleeskuikens, die ouder zijn dan 10 dagen, indien op twee
      opeenvolgende dagen er een sterfte is van 0,5% of meer per dag;

      b. een koppel vleeskalkoenen indien op twee opeenvolgende dagen er een sterfte is van 1% of meer per dag; en

      c. alle andere soorten pluimvee dan de soorten, bedoeld in de onderdelen a en b, indien er een sterfte is van meer
      dan 3% per week.

      2 De exploitant, bedoeld in het eerste lid, consulteert een dierenarts indien bij pluimvee:

      a. een klinisch probleem zichtbaar is;

      b. er op twee opeenvolgende dagen een reductie van voer- of drinkwateropname is van meer dan 5% per dag; en

      c. voor zover het leghennen of vermeerderingsdieren betreft, er op twee opeenvolgende dagen een reductie van de
      eiproductie is van 5% of meer per dag.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel3a.2
  - number: 3a.3
    text: |-
      Een houder van runderen meldt in elk geval bij runderen ouder dan twintig maanden, ziekteverschijnselen van Bovine
      Spongiforme encefalopathie, indien die runderen gedragsstoornissen of neurologische symptomen vertonen en waarbij
      de ziekte op grond van een reactie op een behandeling of op grond van een laboratoriumonderzoek niet kan worden
      uitgesloten.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel3a.3
  - number: 3a.4
    text: |-
      Een houder van schapen of geiten meldt in elk geval bij schapen en geiten ouder dan twaalf maanden,
      ziekteverschijnselen van scrapie, indien die schapen gedragsstoornissen of neurologische symptomen vertonen en
      waarbij de ziekte op grond van een reactie op een behandeling of op grond van een laboratoriumonderzoek niet kan
      worden uitgesloten.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel3a.4
  - number: 3b.1
    text: |-
      Als ziekten als bedoeld in [artikel 1.61, eerste lid, van het besluit][ref1] worden aangewezen:

      a. de ziekten, bedoeld in de [artikelen 2.1](onbekend) en [2.2 van de Regeling diergezondheid](onbekend); en

      b. de ziekten, bedoeld in [artikel 3.1, onderdeel a, onder 9° van de Regeling diergezondheid](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.61
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel3b.1
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '1.61'
  - number: 3b.2
    text: |-
      Als levende entstof tegen een ziekte als bedoeld in [artikel 1.61, tweede lid, van het besluit][ref1] wordt
      aangewezen:

      a. een recombinant vaccin als bedoeld in bijlage III, onderdeel 1, onder a, onder ii, van verordening (EU) nr.
      576/2013 ter preventie of bestrijding van rabiës;

      b. een levende entstof ter preventie en bestrijding van een infectie met het virus van de ziekte van Newcastle;

      c. een levende entstof die voldoet aan artikel 3, eerste en, ingeval zij is bestemd om te worden toegepast bij
      legkippen, het tweede lid, van [verordening (EG) nr. 1177/2006](32006R1177) van de Commissie van 1 augustus 2006
      ter uitvoering van [Verordening (EG) nr. 2160/2003](32003R2160) van het Europees Parlement en de Raad wat betreft
      voorschriften voor het gebruik van specifieke bestrijdingsmethoden in het kader van de nationale programma’s
      voor de bestrijding van salmonella bij pluimvee (PbEU 2006, L 212), ter preventie en bestrijding van een infectie
      met salmonella enteritidis, salmonella hadar, salmonella infantis, salmonella java, salmonella typhimurium, of
      salmonella virchow.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.61
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel3b.2
    references:
