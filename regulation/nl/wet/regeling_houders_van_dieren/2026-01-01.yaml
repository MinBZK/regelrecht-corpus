        artikel: '1.28'
  - number: '3.6'
    text: |-
      De houder, bedoeld in [artikel 1.28, eerste lid, van het besluit][ref1], bewaart het
      bedrijfsgezondheidsplan en het bedrijfsbehandelplan, samen met het verslag, bedoeld in
      [artikel 5.22, tweede lid, van de Regeling diergeneeskundigen][ref2], vijf jaar op zijn bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.28
