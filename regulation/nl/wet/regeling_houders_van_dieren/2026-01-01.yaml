  - number: 5b.29
    text: |-
      1 Ingeval [artikel 5b.28, onderdeel a][ref1], van toepassing is, bestelt de exploitant binnen drie werkdagen,
      te rekenen vanaf de dag na de dag waarop het verlies van het identificatiemiddel van het schaap of de geit is
      geconstateerd, een identificatiemiddel ter vervanging.

      2 De exploitant, bedoeld in het eerste lid, brengt het vervangende identificatiemiddel aan zodra het
      identificatiemiddel in zijn bezit is en in ieder geval binnen tien werkdagen nadat het verlies van het
      identificatiemiddel van het schaap of de geit is geconstateerd en voordat het schaap of de geit de inrichting
      verlaat.

      3 Ingeval [artikel 5b.28, onderdeel b][ref2], van toepassing is, brengt de exploitant binnen drie werkdagen,
