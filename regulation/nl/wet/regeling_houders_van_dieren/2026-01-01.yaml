  - number: 7b.4
    text: |-
      1 De bezettingsdichtheid van een stal wordt berekend op basis van de bruikbare oppervlakte van de stal, gelijk aan
      de bruto oppervlakte van de stal.

      2 Indien een stal is uitgerust met voersystemen waaronder de kuikens redelijkerwijs niet kunnen lopen of liggen
      wordt voor het bepalen van de bruikbare oppervlakte, bedoeld in het eerste lid, een forfaitaire aftrek gehanteerd
      van 1,7% van de bruto oppervlakte van de stal.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7b.4
  - number: 7b.5
    text: |-
      1 De houder die een bezettingsdichtheid van meer dan 39 kg/m2, maar ten hoogste 42 kg/m2 toepast, zorgt ervoor
      dat voor elk koppel in het slachthuis, of voor een voor de export bestemd koppel op het bedrijf ten hoogste vijf
      werkdagen voor het einde van de ronde, wordt vastgesteld in welke mate voetzoollaesies voorkomen.

      2 Ten behoeve van de vaststelling, bedoeld in het eerste lid, wordt bij een aantal vleeskuikens van een koppel
      beoordeeld bij hoeveel dieren er

      a. geen of een zeer kleine verkleuring zichtbaar is (klasse 0);

      b. verkleuring maar geen diepe aantasting aanwezig is (klasse 1);

      c. een laesie met aantasting van de opperhuid en onderhuidse ontsteking (klasse 2) aanwezig is.

      3 De houder maakt afspraken met de exploitant van het slachthuis respectievelijk het bedrijf dat de vaststelling in
      de stal verricht, zodanig dat de vaststelling plaatsvindt:

      a. bij het slachthuis:

      1°. door een daarvoor opgeleide medewerker, bij 100 kuikens van elk koppel, waarvan 50 kuikens direct na
      verwerking van ongeveer 30% van het koppel, en 50 kuikens direct na verwerking van ongeveer 60% van het koppel, met
      inachtneming van het protocol dat als [bijlage 3][ref1] bij deze regeling is gevoegd, dan wel:

      2°. met gebruikmaking van een digitaal meetsysteem bij ten minste 70% van alle kuikens van elk koppel,
      overeenkomstig het protocol, dat is opgenomen in [bijlage 4][ref2];

      b. in de stal: ten hoogste 5 werkdagen voordat de laatste vleeskuikens worden weggeladen, door een daarvoor
      opgeleide controleur, bij 100 kuikens van elk koppel met inachtneming van het protocol dat als [bijlage 5][ref3]
      bij deze regeling is gevoegd.

      4 De totaalscore voor het koppel wordt vastgesteld:

      a. in geval van visuele meting in het slachthuis of het houderijbedrijf met gebruikmaking van de formule:

      aantal punten = (aantal dieren klasse 0) x 0 + (aantal dieren klasse 1) x (0,5) + (aantal dieren klasse 2) x 2

      b. bij meting door middel van een digitaal meetsysteem met de formule:

      aantal punten = (percentage dieren klasse 0) x 0 + (percentage dieren klasse 1) x (0,5) + (percentage dieren klasse
      2) x 2

      5 De in het eerste lid bedoelde houder verstrekt per koppel de gegevens waaruit de score blijkt binnen 30 dagen na
      de vaststelling aan de minister. De [artikelen 7b.2, tweede lid][ref4], en [7b.8, tweede en derde lid][ref5], zijn
      van overeenkomstige toepassing.

      6 De in het eerste lid bedoelde houder stelt na elk kalenderjaar een gemiddelde score voor het afgelopen jaar per
      stal vast op basis van de gegevens, bedoeld in het vijfde lid.

      7 Het in het derde lid, onderdeel a, onder 2°, bedoelde digitale meetsysteem voldoet aan de volgende eisen:

      a. het systeem levert een betrouwbare indeling op van de voetzoollaesies in de in het tweede lid genoemde klassen
      en van de resultaten van de meting overeenkomstig de in het vierde lid, onderdeel b, genoemde formule;

      b. het systeem kan ten behoeve van een betrouwbare indeling worden ingesteld op beoordeling van de poten van de
      koppels die onder hoogbroei en van de koppels die onder laagbroei zijn verwerkt;

      c. het systeem kan op zodanige wijze worden ingesteld dat de beoordeling van ieder koppel afzonderlijk plaatsvindt;

      d. de in onderdeel a bedoelde gegevens worden ten minste eenmaal per dag opgeleverd;

      e. de beelden van de beoordeelde koppels kunnen worden bewaard.


