  - number: 7b.33
    text: |-
      In aanvulling op [artikel 7b.29][ref1] laat de exploitant, bedoeld in
      [artikel 2.76id, eerste lid, van het besluit][ref2], van ten minste 30 dieren, waaronder ten minste 5 dieren per
      koppel bloedmonsters nemen van vleeskuikens op de volgende momenten:

      a. in de periode van 4 tot 6 weken na het uitkomen;

      b. 70 dagen na het uitkomen, tenzij het koppel sinds het uitkomen met tussenpozen van ten hoogste zes weken door
      een dierenarts is gevaccineerd met een levende entstof en die vaccinaties door middel van een spray of aërosol
      zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel7b.29
