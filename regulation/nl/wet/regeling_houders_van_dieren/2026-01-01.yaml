  - number: 5b.68b
    text: |-
      1 Het registreren van een hond, bedoeld in [artikel 3.30, tweede lid, onderdelen a en b, van het besluit][ref1]
      vindt plaats uiterlijk twee weken nadat de hond is verkregen onderscheidenlijk in Nederland is gebracht.

      2 Bij de registratie, bedoeld in [artikel 3.30, tweede lid, onderdeel a, van het besluit][ref2], worden de gegevens
      vermeld, bedoeld in [7.6, tweede en derde lid, van de Regeling diergeneeskundigen][ref3].

      3 Bij de registratie, bedoeld in [artikel 3.30, tweede lid, onderdeel b, van het besluit][ref4], wordt vermeld:

      a. de datum waarop de hond in Nederland is gebracht;

      b. de identificatiecode van de hond;

      c. het registratienummer van de houder;

      d. het nummer dat de dierenarts heeft verkregen bij de inschrijving in het register, bedoeld in
      [artikel 4.3, eerste lid, van de wet][ref5];

      e. het praktijkadres van de dierenarts;

      f. de identificatiecode van het identificatiedocument van de hond;

      h. het nummer van het gezondheidscertificaat, indien beschikbaar; en

      i. het land van herkomst van de hond.


