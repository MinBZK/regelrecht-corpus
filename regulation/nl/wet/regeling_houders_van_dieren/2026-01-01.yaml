  - number: '6.4'
    text: |-
      De verplichting tot reiniging en ontsmetting, bedoeld in artikel 4, onderdeel b, van verordening (EU) nr. 2020/688
      is niet van toepassing op het vervoer binnen een inrichting, bedoeld in artikel 6, derde lid, onderdeel a, van die
      verordening indien is voldaan aan de voorwaarden in dat onderdeel.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel6.4
  - number: '7.1'
    text: |-
      1 Een A-bedrijf, C-bedrijf of E-bedrijf voldoet aan de volgende voorwaarden:

      a. een dierenarts neemt eenmaal per maand bloedmonsters van de aanwezige varkens overeenkomstig de procedure van
      [bijlage 10][ref1] ten behoeve van serologisch onderzoek op de aanwezigheid van klassieke varkenspest dat door
      Wageningen Bioveterinary Research wordt verricht;

      b. op het bedrijf is een douche aanwezig, die is gelegen in de onmiddellijke nabijheid van de ingang van de
      inrichting waar varkens worden gehouden, waarvan bezoekers van die inrichting voorafgaand aan het betreden van de
      stallen gebruik maken; en

      c. het bedrijf is voorzien van een erfafscheiding waardoor het betreden van de inrichting waar varkens worden
      gehouden zonder de medewerking van de varkenshouder niet mogelijk is.

      2 De monsters, bedoeld in het eerste lid, onderdeel a, worden uiterlijk op de werkdag na de dag dat ze zijn genomen
      aangeleverd bij het laboratorium, bedoeld in dat onderdeel.

      3 De varkenshouder stelt de uitslag van het serologisch onderzoek, bedoeld in het eerste lid, onderdeel a,
      beschikbaar aan de minister.

      4 Indien een A-bedrijf beschikt over een toevoegstal, voldoet dat bedrijf aan de in [bijlage 11][ref2]
      opgenomen eisen over inrichting en gebruik van die stal. Een dierenarts neemt overeenkomstig de procedure van
      [bijlage 10][ref3] bloedmonsters van de in die toevoegstal aanwezige varkens ten behoeve van het onderzoek, bedoeld
      in [artikel 2.27h, eerste lid, onderdeel b, van het besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0035248
      [ref2]: https://wetten.overheid.nl/BWBR0035248
      [ref3]: https://wetten.overheid.nl/BWBR0035248
      [ref4]: https://wetten.overheid.nl/BWBR0035217#Artikel2.27h
