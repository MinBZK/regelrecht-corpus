  - number: 5b.68
    text: |-
      1 De exploitant geeft de gegevens, bedoeld in [artikel 5b.66][ref1], door via een elektronisch portaal dat op grond
      van [artikel 1.4, derde lid, van de Regeling handhaving en overige zaken Wet dieren][ref2], door de minister is
      aangewezen als elektronisch portaal voor de registratie van de gegevens, bedoeld in artikel 5b.66, tweede lid.

      2 Indien de minister meer dan één elektronisch portaal heeft aangewezen, volstaat het doorgeven van de gegevens bij
      een van de elektronisch portalen.

      3 Indien de minister geen elektronisch portaal heeft aangewezen, geeft de exploitant de gegevens, bedoeld in
      [artikel 5b.66, tweede lid][ref3], aan de minister door met gebruikmaking van een middel dat daartoe door de
      minister beschikbaar is gesteld.


