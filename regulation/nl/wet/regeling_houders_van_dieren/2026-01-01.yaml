        bwb_id: BWBR0035248
        artikel: 5b.28
        hoofdstuk: 5b
        paragraaf: 5b.3.2
        afdeling: 5b.3
  - number: 5b.56
    text: |-
      1 De termijn, bedoeld in artikel 3, eerste lid, van verordening (EU) nr. 2021/520, bedraagt voor een exploitant
      die schapen en geiten houdt, zeven dagen, te rekenen vanaf de dag na de dag waarop de gebeurtenis die wordt
      doorgegeven, heeft plaatsgevonden.

      2 De termijn waarbinnen de gegevens, bedoeld in [artikel 5b.52, tweede lid][ref1], [5b.53][ref2], [5b.54][ref3],
      en [5b.55][ref4], worden doorgegeven, bedraagt zeven dagen, te rekenen vanaf de dag na de dag waarop de gebeurtenis
      die wordt doorgegeven heeft plaatsgevonden, of zoveel eerder als het schaap of de geit wordt afgevoerd of over de
      openbare weg wordt verplaatst.

      3 De termijn waarbinnen de gegevens, bedoeld in [artikel 5b.52, eerste lid][ref5], worden doorgegeven, bedraagt zes
      maanden na de geboorte te rekenen vanaf de dag na de dag van geboorte, of zoveel eerder als het schaap of de geit
      wordt afgevoerd of over de openbare weg wordt verplaatst.

      4 In afwijking van het derde lid, bedraagt de termijn waarbinnen de gegevens, bedoeld in
      [artikel 5b.52, eerste lid][ref6], worden doorgegeven, ingeval van de geboorte van een geit op een inrichting
      waarop op enig moment in het kalenderjaar vijftig geiten of meer worden gehouden ten behoeve van de bedrijfsmatige
      productie van melk, zeven dagen, te rekenen vanaf de dag na de dag van de geboorte, of zoveel eerder als de geit
      wordt afgevoerd of over de openbare weg wordt verplaatst.


