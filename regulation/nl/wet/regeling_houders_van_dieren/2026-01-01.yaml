  - number: 5c.3
    text: |-
      1 Een verzamelcentrum voor hoefdieren als bedoeld in [artikel 1.40 van het besluit][ref1], is erkend door de
      minister voor de soort van dieren die op dat verzamelcentrum bijeen worden gebracht.

      2 De minister erkent een verzamelcentrum als bedoeld in het eerste lid indien het verzamelcentrum voldoet aan:

      a. voor zover van overeenkomstige toepassing, artikel 97, eerste lid, van verordening (EU) nr. 2016/429; en

      b. artikel 5 van verordening (EU) nr. 2019/2035.


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel1.40
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel5c.3
