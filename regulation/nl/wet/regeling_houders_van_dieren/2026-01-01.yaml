  - number: 7b.23
    text: |-
      1 Indien een houder van pluimvee als bedoeld in bijlage II, deel 2, punt 2, bij verordening (EU) nr. 2019/2035
      bloedmonsters laat nemen ten behoeve van het onderzoek naar de aanwezigheid van de ziekteverwekkers, bedoeld in
      bijlage II, deel 2, punt 2, onder 2.1, bij verordening (EU) nr. 2019/2035, worden die monsters afgenomen door een
      dierenarts of een dierenartsassistent paraveterinair.

      2 Bij de monstername wordt ten minste 1 milliliter bloed per dier afgenomen.

      3 De exploitant van een broederij als bedoeld in artikel 7 van verordening (EU) nr. 2019/2035 neemt monsters als
      bedoeld in bijlage II, deel 1 van die verordening.
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7b.23
  - number: 7b.24
    text: |-
      Het onderzoek, bedoeld in bijlage II, deel 2, punt 2, onder 2.6, bij verordening (EU) nr. 2019/2035 wordt verricht
      door de instelling die op grond van [artikel 3.1 van het Besluit diergezondheid][ref1] is aangewezen voor de
      uitvoering van het monitoringsprogramma voor salmonella-serotypen.


      [ref1]: https://wetten.overheid.nl/BWBR0045039#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0035248/2026-01-01#Artikel7b.24
