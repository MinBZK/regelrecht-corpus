      goedkeuring geven om in het wild gevangen of niet overeenkomstig de biologische productiemethode geproduceerde
      aquacultuurdieren in een biologisch bedrijf binnen te brengen overeenkomstig bijlage II, deel III, punt 3.1.2.1,
      onderdeel d, van [verordening (EU) 2018/848](32748R2018).

