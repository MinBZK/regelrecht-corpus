  - number: '9.4'
    text: |-
      1 Als voorschriften als bedoeld in [artikel 6.2, eerste lid, van de wet][ref1] worden aangewezen: de artikelen 8,
      vierde lid, 9, vierde lid, 13, eerste, tweede en derde lid, 14, eerste, tweede en derde lid, 18, eerste, tweede
      en derde lid, 20, eerste en tweede lid, 21, eerste, vierde en zevende lid, 23, eerste en tweede lid, 24, eerste
      en tweede lid, 25, 27, eerste en zesde lid, 28, tweede lid, 30, eerste, derde en vierde lid, eerste alinea, vijfde
      lid, eerste alinea, zesde, zevende en achtste lid, 32, eerste lid, eerste zin, en 36, eerste lid, van verordening
      (EU) 2016/2012.

      2 Als voorschriften als bedoeld in [artikel 6.2, eerste lid, van de wet][ref2] worden aangewezen: de artikelen 1, 2
      en 3 van gedelegeerde verordening (EU) 2017/1940.


