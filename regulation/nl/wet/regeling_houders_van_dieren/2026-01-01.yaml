      opkweekdoeleinden toestemming geven dat in een biologische productie-eenheid gebruik wordt gemaakt van maximaal
      50 procent niet-biologische juvenielen overeenkomstig punt 3.1.2.1, onderdeel e, van bijlage II, deel III, van
      [verordening (EU) 2018/848](32748R2018) en onder de daar opgenomen voorwaarden en beperkingen.


