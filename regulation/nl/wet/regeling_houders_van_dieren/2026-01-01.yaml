  - number: 5b.30
    text: |-
      1 Bij een slachtvarken wordt in aanvulling op de in artikel 52, eerste lid, van verordening (EU) nr. 2019/2035
      voorgeschreven identificatiemiddelen een slachtmerk aangebracht.

      2 In afwijking van het eerste lid kan bij een zeug, gelt of beer die voor de slacht wordt aangeboden, in aanvulling
      op de in artikel 52, eerste lid, van verordening (EU) nr. 2019/2035 voorgeschreven identificatiemiddelen, een
      gebruiksmerk worden aangebracht.

      3 Wanneer een slachtmerk of een gebruiksmerk onleesbaar is geworden, brengt de exploitant een nieuw
      merk met dezelfde gegevens als bedoeld in [artikel 5b.34, eerste lid][ref1], of indien van toepassing,
      [artikel 5b.35, eerste lid][ref2], aan.

      4 Het eerste, tweede en derde lid zijn niet van toepassing op slachtvarkens die van een inrichting rechtstreeks
      naar een inrichting buiten Nederland worden verplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.34
      [ref2]: https://wetten.overheid.nl/BWBR0035248#Artikel5b.35
