  - number: '2.7'
    text: |-
      De minister kan subsidie verlenen voor activiteiten die strekken tot of dienstig zijn aan:

      a. het ondersteunen van veilige en humane opvang in de regio van herkomst van vluchtelingen en intern ontheemden,
      en het ondersteunen van kwetsbare gastgemeenschappen bij het opvangen van de gevolgen van (langdurige) ontheemding;
      of

      b. migratiesamenwerking in lijn met Duurzame Ontwikkelingsdoelstelling 10.7 van de door de Algemene Vergadering van
      de Verenigde Naties op 25 september 2015 in resolutie A/RES/70/1 vastgestelde duurzame ontwikkelingsdoelen.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel2.7
  - number: '2.8'
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [artikel 2.7, aanhef en onderdeel a][ref1],
      komen voor subsidie in aanmerking activiteiten gericht op of ter bevordering van:

      a. het bieden van bescherming aan vluchtelingen, intern ontheemden en kwetsbare gastgemeenschappen;

      b. het verhogen van de capaciteit en kwaliteit van dienstverlening op het gebied van (beroeps)onderwijs en training
      voor vluchtelingen, intern ontheemden en kwetsbare gastgemeenschappen;

      c. het verhogen van capaciteit en kwaliteit van publieke of private infrastructuur voor vluchtelingen, intern
      ontheemden en kwetsbare gastgemeenschappen;

      d. sociaaleconomische ontwikkeling van vluchtelingen, intern ontheemden en kwetsbare gastgemeenschappen;

      e. het erkennen, respecteren en versterken van onafhankelijk leiderschap, participatie, besluitvorming
      en capaciteit van lokale en nationale actoren op het gebied van de doelstellingen, genoemd in
      [artikel 2.7, aanhef en onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0019366#Artikel2.7
