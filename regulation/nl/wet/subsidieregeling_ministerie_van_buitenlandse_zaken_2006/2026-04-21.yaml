  - number: '2.10'
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan het verlenen
      van bijstand op maatschappelijk, juridisch, sociaal dan wel geestelijk vlak aan Nederlandse gedetineerden in het
      buitenland.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel2.10
  - number: '3.1'
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan het lenigen,
      beperken of voorkomen van menselijke noden ten gevolge van conflicten, natuurrampen of andere noodsituaties.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel3.1
  - number: '3.2'
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [artikel 3.1][ref1], komen voor subsidie in
      aanmerking activiteiten gericht op of ter bevordering van:

      a. directe hulpverlening ter voorziening van de primaire behoeften van slachtoffers, meer in het bijzonder de meest
      kwetsbaren onder hen, op het terrein van:

        - Bescherming;
        - *emergency shelter;*
        - voedselzekerheid;
        - voeding;
        - sanitaire voorzieningen, water en hygiëne;
        - gezondheid;
        - *non-formal education;*
        - noodtelecommunicatie;
        - logistiek;
        - *camp management en coördinatie;*

      b. versterking van de institutionele capaciteit, waaronder deskundigheidsbevordering, internationaal, in Nederland
      en in getroffen of kwetsbare gebieden, gericht op de leniging van acute menselijke noden en op het voorbereid zijn
      op rampen;

      c. bevordering van de doelgerichtheid en doelmatigheid van de hulpverlening, en

      d. beperking van humanitaire nood en materiële schade ten gevolge van rampen,


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel3.1
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0019366
        artikel: '3.1'
        afdeling: '3'
  - number: '3.4'
    text: |-
      Voor subsidieverlening op grond van deze afdeling komen uitsluitend in aanmerking rechtspersonen die:

      a. naar doelstelling en feitelijke werkzaamheden gericht zijn op een breed scala van werkzaamheden;

      b. wat betreft hulpverlening in noodsituaties aangesloten zijn bij en handelen overeenkomstig de Code of Conduct
      for the International Red Cross and Red Crescent Movement and Non-Governmental Organizations in Disaster Relief of
      een daaraan gelijkwaardige gedragscode;

      c. beschikken over ervaring en een goede staat van dienst in het desbetreffende gebied;

      d. beschikken over aantoonbare kennis en expertise met de desbetreffende problematiek;

      e. beschikken over voldoende organisatorische en implementatiecapaciteit en

      f. in voorkomend geval zelf of door tussenkomst van een lokale partner actief betrokken zijn bij het lokale
      coördinatiemechanisme van de Verenigde Naties met betrekking tot humanitaire hulp.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel3.4
  - number: '3.5'
    text: |-
      In aanvulling op [artikel 3.2][ref1] blijkt uit aanvragen om subsidie op grond van deze afdeling dat:

      a. de activiteiten voldoen aan internationaal gangbare humanitaire hulpprincipes;

      b. de activiteiten gekoppeld zijn aan duidelijk en realistisch omschreven resultaten, doelen, instrumenten en
      indicatoren;

      c. de begroting duidelijk en sluitend is en gekoppeld is aan de activiteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0019366
        artikel: '3.2'
        afdeling: '3'
  - number: '3.6'
    text: |-
      Aanvragen zullen mede worden beoordeeld aan de hand van de volgende criteria:

      a. snelheid, aard, schaal en aansluiting van de voorgestelde interventie op geïdentificeerde noden;

      b. spreiding van donoractiviteiten in relatie tot geïdentificeerde noden;

      c. daar waar sprake is van een langdurige crisis heeft voortzetting van adequaat uitgevoerde relevante activiteiten
      prioriteit boven subsidiëring van nieuwe activiteiten;

      d. het vermijden van negatieve effecten van humanitaire hulp, mede met het oog op de duurzaamheid van de
      resultaten, alsmede

      e. complementariteit en toegevoegde waarde ten opzichte van andere initiatieven in hetzelfde gebied.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel3.6
  - number: '3.7'
    text: |-
      Subsidie kan worden verleend voor activiteiten waarmee reeds een aanvang is gemaakt indien:

      a. de activiteiten zo spoedeisend zijn dat van de aanvrager in redelijkheid niet gevergd kan worden dat deze zijn
      aanvraag voor aanvang daarvan had ingediend;

      b. de aanvrager bij aanvang van de activiteiten de minister daarvan in kennis heeft gesteld onder mededeling van
      het voornemen om een subsidieaanvraag in te dienen, en

      c. de subsidieaanvraag binnen vier weken na aanvang van de activiteiten is ingediend.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel3.7
  - number: '3.8'
    text: |-
      1 Af- en overschrijvingen tussen posten op de begroting voor activiteiten waarvoor op grond van deze paragraaf
      subsidie is verleend, behoeven niet ter goedkeuring aan de minister te worden voorgelegd, indien:

      a. de af- en overschrijdingen het gevolg zijn van gewijzigde of onvoorziene omstandigheden in een situatie van
      acute nood;

      b. de af- en overschrijdingen niet meer bedragen dan 25% van de desbetreffende posten, en

      c. het totaal van de begroting niet wordt overschreden.

      2 Het eerste lid is niet van toepassing op vergoedingen voor expatriates en de aanschaf van transportmiddelen en
      van communicatieapparatuur.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel3.8
  - number: '4.1'
    text: |-
      Voor de toepassing van deze afdeling wordt verstaan onder:

        - *duurzame ontwikkelingsdoelen:* de door de Algemene Vergadering van de Verenigde Naties op 25 september 2015 in
      resolutie A/RES/70/1 vastgestelde duurzame ontwikkelingsdoelen;
        - *lage- en middeninkomenslanden:* landen die als zodanig zijn vermeld in de door het Development Assistence
      Committee (DAC) van de Organisatie voor Economische Samenwerking en Ontwikkeling (OESO) meest recent vastgestelde
      List of Recipients of Official Development Assistence;
        - *lokale maatschappelijke organisatie:* een maatschappelijke organisatie die statutair is gevestigd in een laag-
      of middeninkomensland en opereert op regionaal, nationaal of sub-nationaal niveau en zich richt op regionale,
      nationale en/of sub-nationale kwesties;
        - *maatschappelijke organisatie:* een niet op winst gerichte, niet aan een overheidsinstantie statutair
      of feitelijk verbonden organisatie met een maatschappelijk oogmerk, beschikkend over rechtspersoonlijkheid
      naar burgerlijk recht, die niet door een overheidsinstantie is opgericht, of die na oprichting door een
      overheidsinstantie geheel verzelfstandigd is.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel4.1
  - number: '4.2'
    text: |-
      1 De minister kan subsidie verlenen voor activiteiten die strekken tot of bijdragen aan de capaciteitsversterking
      van, dienstverlening door en het voeren van dialoog door maatschappelijke organisaties in of voor lage- en
      middeninkomenslanden om beleidsdoelstellingen te behalen op een van de volgende thema’s:

      a) bestrijden van HIV/Aids;

      b) tegengaan van schadelijke praktijken;

      c) bevorderen van schone en eerlijke handel;

      d) stimuleren van vrouwelijk ondernemerschap;

      e) tegengaan van geweld tegen vrouwen en steun aan vrouwenrechtenverdedigers;

      f) versterken van de positie van vrouwen in vrede- en veiligheidsprocessen; of

      g) beschermen en promoten van mensenrechten en fundamentele vrijheden van religieuze minderheden en lhbtiq+
      personen.

      2 De minister kan subsidie verlenen voor activiteiten die strekken tot of bijdragen aan het stimuleren van
      Nederlandse particuliere ontwikkelingsinitiatieven, uitgezonderd activiteiten gericht op beleidsbeïnvloeding in
      Nederland en activiteiten gericht op beleidsbeïnvloeding op internationaal niveau.

      3 Voor subsidie als bedoeld in het eerste en tweede lid kunnen alleen maatschappelijke organisaties in aanmerking
      komen.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel4.2
  - number: '4.3'
    text: |-
      1 Met het oog op en passend binnen de doelstelling, bedoeld in [artikel 4.2, eerste lid][ref1], komen op de in dat
      lid genoemde thema’s respectievelijk voor subsidie in aanmerking activiteiten gericht op of ter bevordering van:

      a) verbetering van de preventie en toegang tot de behandeling van HIV/Aids voor vrouwen, meisjes en kwetsbare
      groepen;

      b) verbetering van de preventie van schadelijke praktijken en verbeterde zorg voor de gevolgen van dergelijke
      praktijken;

      c) verbetering van arbeidsrechten en -omstandigheden en tegengaan van ontbossing en vervuiling in
      ontwikkelingslanden;

      d) versterking van de economische positie van vrouwelijkeondernemers;

      e) bestrijding van geweld tegen vrouwen en meisjes, verbeterde toegang tot zorg voor vrouwen en meisjes die
      slachtoffer zijn van geweld, en ondersteuning van vrouwenrechtenverdedigers en vrouwelijke mensenrechtenactivisten;

      f) versterking van de positie van vrouwen in vredes- en veiligheidsprocessen en de bescherming en reïntegratie van
      slachtoffers van conflictgerelateerd seksueel geweld; of

      g) bevordering van de vrijheid van religie en levensovertuiging en de bescherming van religieuze minderheden,
      alsmede de bevordering en bescherming van gelijke rechten voor lhbtiq+-personen.

      2 Met het oog op en passend binnen de doelstelling, bedoeld in [artikel 4.2, tweede lid][ref2], komen in
      aanmerking voor subsidie: activiteiten gericht op het versterken van de mate waarin Nederlandse particuliere
      ontwikkelingsinitiatieven in staat zijn om een bijdrage te leveren aan het behalen van de duurzame
      ontwikkelingsdoelen.


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0019366#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0019366
        artikel: '4.2'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0019366
        artikel: '4.2'
        afdeling: '4'
  - number: '4.4'
    text: |-
      Om in aanmerking te kunnen komen voor subsidie als bedoeld in [artikel 4.3][ref1] geldt in ieder geval dat
      activiteiten niet in strijd zijn met universele mensenrechten en:

      a. gericht zijn op versterking van de capaciteit van lokale maatschappelijke organisaties om hun dienstverlening
      en dialoog te verbeteren met dien verstande dat dialoog betrekking heeft op dialoog in of voor lage- en
      middeninkomenslanden op internationaal, regionaal, nationaal of sub-nationaal niveau, onverminderd het bepaalde in
      [artikel 4.2, eerste en tweede lid][ref2].

      b. bijdragen aan lokaal eigenaarschap van lokale maatschappelijke organisaties; en

      c. bijdragen aan de gelijke rechten van vrouwen en meisjes en aan gelijke deelname van vrouwen en meisjes aan de
      samenleving in lage- en middeninkomenslanden.


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0019366#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0019366
        artikel: '4.3'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0019366
        artikel: '4.2'
        afdeling: '4'
  - number: '5.1'
    text: |-
      De minister kan subsidie verlenen voor andere activiteiten, dan bedoeld in [afdeling 4][ref1], in of ten behoeve
      van ontwikkelingslanden op het terrein van een of meer van de volgende thema’s:

      a. voedselzekerheid;

      b. water;

      c. veiligheid en rechtsorde;

      d. mensenrechten;

      e. seksuele en reproductieve gezondheid en rechten;

      f. gender;

      g. klimaat; en

      h. private sectorontwikkeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Afdeling4
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0019366
        afdeling: '4'
  - number: '6.1'
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan de uitvoering
      van internationaal onderwijs en -onderzoek dat een bijdrage levert aan de ontwikkeling en uitvoering van het beleid
      van de minister op het gebied van de ontwikkelingssamenwerking.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel6.1
  - number: '6.2'
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan onderzoek
      en kennisontwikkeling, waarvan de uitkomsten effectief gebruikt kunnen worden voor het behalen van de Nederlandse
      doelstellingen van het buitenlands beleid op het terrein van armoedebestrijding en duurzame ontwikkeling.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel6.2
  - number: '6.4'
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan:

      a. verbetering van de kwaliteit van het hoger onderwijs;

      b. institutionele versterking van instellingen voor hoger onderwijs of

      c. het vergroten van de capaciteit en de kwaliteit van menselijke hulpbronnen, in ontwikkelingslanden.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel6.4
  - number: '6.5'
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [artikel 6.4][ref1], komen voor subsidie in
      aanmerking activiteiten gericht op of ter bevordering van:

      a. samenwerking tussen Nederlandse onderwijsinstellingen en onderwijsinstellingen in ontwikkelingslanden;

      b. financiële ondersteuning van studerenden in of afkomstig uit ontwikkelingslanden of

      c. kennisoverdracht, zoals het ontwikkelen en uitvoeren van cursussen, trainingen en stages.


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel6.4
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0019366
        artikel: '6.4'
        paragraaf: '3'
        afdeling: '6'
  - number: '7.1'
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan versterking
      van de positie van ontwikkelingslanden in het wereldhandelsverkeer door de beschikbaarstelling van deskundigheid en
      andere vormen van assistentie aan overheden van ontwikkelingslanden.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel7.1
  - number: '7.2'
    text: |-
      1 De minister kan subsidie verlenen ten behoeve van:

      a. activiteiten die strekken tot of dienstig zijn aan bevordering van een duurzame vergroting van werkgelegenheid
      en economische groei in ontwikkelingslanden door versterking van het bedrijfsleven in die landen,

      b. transacties in het economisch verkeer met een vernieuwend of stimulerend effect op de verbetering van het milieu
      in ontwikkelingslanden, en

      c. activiteiten die strekken of dienstig zijn aan de bevordering van de internationale economische betrekkingen en
      de buitenlandse handel.

      2 Voor subsidieverlening in het kader van deze paragraaf komen uitsluitend bedrijven en organisaties gericht op de
      behartiging van de belangen van het bedrijfsleven in aanmerking.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel7.2
  - number: '7.4'
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan de
      verstrekking van leningen aan ontwikkelingslanden ten behoeve van investeringen in die landen tegen een rente die
      lager ligt dan de marktrente, door rentesubsidies en garantstellingen.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel7.4
  - number: '8.1'
    text: |-
      De Minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan:

      a. bevordering van de internationale betrekkingen op cultureel gebied;

      b. bevorderen van sociale cohesie in het buitenland door middel van cultuur;

      c. versterking van de culturele sector in ontwikkelingslanden;

      d. bevordering van de kennis van en het begrip voor cultuuruitingen in ontwikkelingslanden, of

      e. versterking van de sportsector in ontwikkelingslanden.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel8.1
  - number: '8.2'
    text: |-
      1 Voor subsidie met het oog op en binnen het raam van de doelstellingen, genoemd in [artikel 8.1, onder a][ref1],
      komen in aanmerking:

      a. bezoekersprogramma’s voor buitenlandse cultuurdeskundigen;

      b. gebundelde of sectorale presentaties van Nederlandse cultuuruitingen in het buitenland;

      c. activiteiten met het oog op de uitvoering van culturele verdragen of internationale afspraken op het terrein van
      de cultuur, en

      d. kleinschalige lokale culturele projecten in het buitenland, gericht op de plaatselijke bevolking met een
      herkenbare Nederlandse component.

      2 Voor subsidie met het oog op en binnen het raam van de doelstelling, genoemd in [artikel 8.1, onder b][ref2],
      komen in aanmerking activiteiten gericht op:

      a. een krachtiger lokale cultuursector gericht op maatschappelijke innovatie;

      b. meer cultuurparticipatie door jongeren;

      c. een veiliger en duurzamer leefomgeving in steden;

      d. duurzaam behoud van lokaal cultureel erfgoed.

      3 Subsidies verstrekt namens de Minister door een Nederlandse vertegenwoordiging in het buitenland met het oog
      op de doelstelling, genoemd in [artikel 8.1, onder b][ref3], hebben betrekking op kleinschalige lokale culturele
      projecten, gericht op de plaatselijke bevolking.

      4 Subsidie voor activiteiten, bedoeld in het eerste lid, onder a en b, kan uitsluitend worden verleend aan
      sectorinstituten met een internationale taak die door de Minister van Onderwijs, Cultuur en Wetenschap zijn
      aangewezen en aan fondsen, bedoeld in [artikel 9 van de Wet op het specifiek cultuurbeleid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0019366#Artikel8.1
      [ref3]: https://wetten.overheid.nl/BWBR0019366#Artikel8.1
      [ref4]: https://wetten.overheid.nl/BWBR0005904#Artikel9
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel8.2
    references:
