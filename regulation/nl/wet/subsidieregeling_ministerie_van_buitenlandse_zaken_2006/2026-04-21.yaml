        artikel: '8.1'
        paragraaf: '1'
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0019366
        artikel: '8.1'
        paragraaf: '1'
        afdeling: '8'
      - id: ref3
        bwb_id: BWBR0019366
        artikel: '8.1'
        paragraaf: '1'
        afdeling: '8'
      - id: ref4
        bwb_id: BWBR0005904
        artikel: '9'
  - number: '8.3'
    text: |-
      1 Voor subsidie met het oog op en binnen het raam van de doelstellingen, genoemd in
      [artikel 8.1, onder c, d en e][ref1], komen in aanmerking:

      a. activiteiten gericht op de totstandkoming van cultuuruitingen met name in ontwikkelingslanden door kunstenaars
      en culturele instellingen afkomstig uit of werkzaam in ontwikkelingslanden,

      b. stageprogramma’s gericht op kunstenaars of sporters afkomstig uit ontwikkelingslanden en

      c. initiatieven gericht op totstandkoming van sportactiviteiten in ontwikkelingslanden en op vergroting van
      sportparticipatie, vooral voor jongeren, vrouwen en gehandicapten.

      2 Subsidie voor activiteiten, bedoeld in het eerste lid, kan uitsluitend worden verleend aan instellingen die naar
      doelstelling en werkwijze geheel of overwegend zijn gericht op de bevordering en verspreiding van cultuuruitingen
      met name in ontwikkelingslanden door kunstenaars of culturele instellingen afkomstig uit of werkzaam in
      ontwikkelingslanden en aan samenwerkingsverbanden van sportinstellingen met ervaring in ontwikkelingslanden.


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel8.1
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0019366
        artikel: '8.1'
        paragraaf: '1'
        afdeling: '8'
  - number: '8.4'
    text: |-
      De Minister kan subsidie verlenen voor activiteiten die strekken tot of dienstig zijn aan bevordering van de
      sociale en politieke banden en de economische samenwerking tussen Nederland en landen waarmee Nederland door
      nabuurschap, door culturele en historische betrekkingen, door hun betekenis als land van herkomst van in Nederland
      levende migranten of anderszins een bijzondere band heeft.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel8.4
  - number: '9.1'
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan:

      a. bevordering van kennis en inzicht in en de meningsvorming over aangelegenheden met betrekking tot
      ontwikkelingsamenwerking, of

      b. bevordering van het draagvlak voor het beleid inzake ontwikkelingsamenwerking.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel9.1
  - number: '9.2'
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [artikel 9.1][ref1], komen voor subsidie in
      aanmerking activiteiten gericht op of ter bevordering van:

      a. publieksvoorlichting in brede zin en voorlichting gericht op specifieke doelgroepen;

      b. themabijeenkomsten, congressen, discussiebijeenkomsten, internationale evenementen en manifestaties;

      c. de totstandkoming en distributie van publicaties; of

      d. onderwijsactiviteiten die strekken tot of dienstig zijn aan het vergroten van de kennis over ontwikkelingslanden
      in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel9.1
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0019366
        artikel: '9.1'
        paragraaf: '1'
        afdeling: '9'
  - number: '9.3'
    text: |-
      De minister kan subsidie verlenen ten behoeve van activiteiten die strekken tot of dienstig zijn aan:

      a. bevordering van kennis en inzicht in en de meningsvorming over aangelegenheden met betrekking tot de
      buitenlandse betrekkingen;

      b. bevordering van het draagvlak voor het beleid inzake de buitenlandse betrekkingen; of

      c. bevordering van een positieve beeldvorming over Nederland in het buitenland.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel9.3
  - number: '9.4'
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [artikel 9.3][ref1], komen voor subsidie in
      aanmerking activiteiten gericht op of ter bevordering van:

      a. publieksvoorlichting in brede zin en voorlichting gericht op specifieke doelgroepen;

      b. themabijeenkomsten, congressen, discussiebijeenkomsten, internationale evenementen en manifestaties;

      c. de totstandkoming en distributie van publicaties; of

      d. onderwijsactiviteiten die strekken tot of dienstig zijn aan het vergroten van de kennis van, inzicht in en de
      meningsvorming over aangelegenheden met betrekking tot de buitenlandse betrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel9.3
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0019366
        artikel: '9.3'
        paragraaf: '2'
        afdeling: '9'
  - number: '10.1'
    text: |-
      Voor de toepassing van deze afdeling wordt onder publiek private samenwerking verstaan: een samenwerkingsverband
      van enerzijds een of meer partijen afkomstig uit de kring van de overheid en anderzijds een of meer particuliere
      organisaties zonder winstoogmerk of partijen uit de kring van het bedrijfsleven, gericht op de realisering van
      gezamenlijk onderschreven doelstellingen door uitvoering van activiteiten op een zodanige wijze dat elk van de
      partijen een deel van de daartoe benodigde inspanningen levert en een deel van de daarmee gepaard gaande risico’s
      draagt.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel10.1
  - number: '10.2'
    text: |-
      1 De minister kan subsidie verlenen met het oog op de uitvoering van activiteiten, bedoeld in deze regeling,
      verricht in het kader van publiek private samenwerking.

      2 De minister kan daarbij buiten toepassing laten het ten aanzien van subsidiëring van
      de desbetreffende activiteiten vastgestelde subsidieplafond, het bepaalde ingevolge
      [artikel 7, tweede lid, van het Subsidiebesluit][ref1] alsmede bepalingen van deze regeling.

      3 De subsidie wordt in de vorm van een activiteitensubsidie verleend, in voorkomend geval in aanvulling op een
      reeds aan dezelfde ontvanger verleende instellingssubsidie. De subsidieontvanger draagt zorg voor een zodanig
      beheer van de desbetreffende subsidiegelden dat gewaarborgd is dat de subsidie uitsluitend wordt besteed voor de
      activiteiten waarvoor zij is bestemd en dat daarvan afzonderlijk verslag kan worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018039#Artikel7
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0018039
        artikel: '7'
  - number: '10.3'
    text: |-
      Indien de publiek private samenwerking niet over rechtspersoonlijkheid beschikt, kan de subsidie uitsluitend
      worden verleend aan een van de partijen in het samenwerkingsverband die wel over rechtspersoonlijkheid beschikt,
      onderverminderd [artikel 4, eerste lid, van het Subsidiebesluit][ref1]. Op deze subsidieontvanger rusten alle aan
      de subsidie verbonden verplichtingen, onverschillig welk van de partijen in het samenwerkingsverband feitelijk is
      belast met de uitvoering van de daarop betrekking hebbende werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0018039#Artikel4
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0018039
        artikel: '4'
  - number: '10.4'
    text: |-
      1 De subsidieaanvraag omvat mede een beschrijving van de wijze waarop elk van de partijen bijdraagt aan de
      werkzaamheden van de publiek private samenwerking en van de wijze waarop de besluitvorming in de publiek private
      samenwerking plaats vindt.

      2 Indien de publiek private samenwerking niet beschikt over rechtspersoonlijkheid omvat de subsidieaanvraag mede
      een overeenkomst tussen partijen op grond waarvan de naleving van de aan de subsidie verbonden verplichtingen
      jegens de minister is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel10.4
  - number: '10.5'
    text: |-
      1 De minister kan in bijzondere gevallen binnen het raam van [artikel 2 van de Kaderwet][ref1] subsidie verlenen

      a. ten behoeve van andere activiteiten dan bedoeld in deze regeling, of

      b. in afwijking van een of meer bepalingen van deze regeling, daaronder begrepen de met het oog daarop
      bekendgemaakte beleidsregels op grond van [artikel 6 van het Subsidiebesluit][ref2];

      indien te subsidiëren activiteiten naar het oordeel van de minister een betekenisvolle bijdrage leveren aan de
      realisering van de beleidsdoelstellingen van de minister.

      2 Een beschikking tot subsidiëring in afwijking van een of meer bepalingen van deze regeling vermeldt de bepalingen
      waarvan wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0010178#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018039#Artikel6
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0010178
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018039
        artikel: '6'
  - number: '11.1'
    text: |-
      De [Subsidieregeling Ministerie van Buitenlandse Zaken][ref1] en de
      [Subsidieregeling Algemene organisaties voor ontwikkelingssamenwerking][ref2] worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0010173
      [ref2]: https://wetten.overheid.nl/BWBR0013208
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0010173
      - id: ref2
        bwb_id: BWBR0013208
  - number: '11.2'
    text: |-
      1 Deze regeling treedt in werking met ingang van 1 januari 2006 en vervalt met ingang van 1 juli 2027.

      2 Het vervallen van deze regeling op grond van de datum, genoemd in het eerste lid, heeft geen gevolgen voor:

      a. beleidsregels en subsidieplafonds voor de toepassing van deze regeling die voor die datum zijn vastgesteld;

      b. subsidies die voor die datum zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel11.2
  - number: '11.3'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling Ministerie van Buitenlandse Zaken 2006.'
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel11.3
