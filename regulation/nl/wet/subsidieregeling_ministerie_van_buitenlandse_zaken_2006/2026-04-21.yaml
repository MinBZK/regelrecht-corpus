  - number: '2.4'
    text: |-
      De minister kan subsidie verstrekken voor activiteiten die niet op grond van een van de overige bepalingen van
      deze regeling voor subsidie in aanmerking kunnen komen en die strekken tot of dienstig zijn aan de ontwikkeling en
      uitvoering van het beleid van de minister op het gebied van:

      a. het milieu;

      b. de internationale rechtsorde;

      c. internationale juridische en justitiële samenwerking;

      d. de bevordering van de multilaterale samenwerking;

      e. de verbetering van bilaterale betrekkingen; of

      f. de bevordering van de Nederlandse en internationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel2.4
  - number: '2.5'
    text: |-
      De minister kan subsidie verstrekken voor activiteiten die strekken tot of dienstig zijn aan de ontwikkeling en
      uitvoering van het beleid van de minister op het gebied van vrede, veiligheid en rechtsorde.
    url: https://wetten.overheid.nl/BWBR0019366/2026-04-21#Artikel2.5
  - number: '2.6'
    text: |-
      Met het oog op en binnen het raam van de doelstelling, genoemd in [artikel 2.5][ref1], komen voor subsidie in
      aanmerking activiteiten gericht op of ter bevordering van:

      a. het functioneren van de rechtsstaat, de kwaliteit van wetgeving, rechtshandhaving en rechtspraak, de toegang tot
      recht en de rechtsbescherming van burgers;

      b. het versterken van de democratie en de structuur, capaciteit, kwaliteit, inclusiviteit en bestuurskracht van
      lokale en centrale overheden;

      c. een transparante, inclusieve, efficiënte, effectieve en professioneel opererende veiligheidssector binnen de
      kaders van internationale mensen- en humanitaire rechten;

      d. het versterken van de bescherming van burgers door het verminderen van vormen van geweld tegen burgers,
      waaronder seksueel geweld en andere vormen van bedreigingen voor de fysieke veiligheid;

      e. het versterken van de weerbaarheid van lokale gemeenschappen tegen gewapend conflict;

      f. het voorlichten over de risico’s en het verwijderen van explosieve oorlogsresten, het vergroten van de impact
      van deze activiteiten, de ondersteuning van de slachtoffers hiervan en het beïnvloeden van het beleid op dit
      gebied;

      g. het bevorderen en versterken van vredesopbouwinspanningen, inclusief conflictpreventie, conflictbeheersing en
      conflictresolutie;

      h. het erkennen, respecteren en versterken van onafhankelijk leiderschap, participatie, besluitvorming en
      capaciteit van lokale en nationale actoren op het gebied van de doelstellingen, genoemd in [artikel 2.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0019366#Artikel2.5
