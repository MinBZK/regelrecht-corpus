  - number: '2.9'
    text: |-
      Met het oog op en binnen het raam van de doelstellingen, genoemd in [artikel 2.7, aanhef en onderdeel b][ref1],
      komen voor subsidie in aanmerking activiteiten gericht op of ter bevordering van:

      a. het voorkomen van irreguliere migratie;

      b. het bieden van bescherming aan migranten;

      c. het tegengaan van mensensmokkel en -handel;

      d. het bevorderen van terugkeer naar en herintegratie in het land van herkomst;

      e. het verbeteren en versterken van legale migratie;

      f. het erkennen, respecteren en versterken van onafhankelijk leiderschap, participatie, besluitvorming
      en capaciteit van lokale en nationale actoren op het gebied van de doelstellingen, genoemd in
      [artikel 2.7, aanhef en onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019366#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0019366#Artikel2.7
