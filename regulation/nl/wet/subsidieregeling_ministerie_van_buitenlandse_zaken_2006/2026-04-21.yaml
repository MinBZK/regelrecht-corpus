articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. ontwikkelingslanden: landen, vermeld in de door het Development Assistence Committee (DAC) van de Organisatie
      voor Economische Samenwerking en Ontwikkeling (OESO) meest recent vastgestelde List of Recipients of Official
      Development Assistence;

      b. Kaderwet: [Kaderwet subsidies Ministerie van Buitenlandse Zaken][ref1];

      c. Subsidiebesluit: [Subsidiebesluit Ministerie van Buitenlandse Zaken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010178
      [ref2]: https://wetten.overheid.nl/BWBR0018039
