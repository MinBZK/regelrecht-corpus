preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat openbare verkopingen ook na intrekking van artikel
    103 van de Registratiewet 1917 ten overstaan van notarissen of deurwaarders zullen plaatsvinden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002798/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het is verboden openbare verkopingen bij opbod, bij opbod en afslag of bij afslag van roerende zaken, met
      uitzondering van zaken, toebehorende aan of beheerd door de Staat, provincies, gemeenten, waterschappen,
      veenschappen, veenpolders of andere lichamen aan wie krachtens de [Grondwet][ref1] verordenende bevoegdheid is
      verleend, te houden, anders dan ten overstaan van notarissen of van deurwaarders bij de rechterlijke colleges.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0002798/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '2'
    text: |-
      1 De bepaling van [artikel 1][ref1] is niet van toepassing op verkopingen, welke gedurende ten minste zes
      weken van het jaar ten minste eenmaal per week in hetzelfde gebouw of op het zelfde terrein plaats hebben
      en waarbij uitsluitend voortbrengselen van een zelfde tak van bedrijf worden verkocht alsmede op verkopingen
      van te velde staande gewassen en op verkopingen door de strandvonder, bedoeld in de [artikelen 14][ref2] en
      [17 van de Wet op de strandvonderij][ref3].

      2 Onze Minister van Justitie kan bepalen, dat de bepaling van [artikel 1][ref4] niet van toepassing is op de door
      hem aan te wijzen openbare verkopingen bij afslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002798#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001951#Artikel14
