      Deze wet kan worden aangehaald als Wet ambtelijk toezicht bij openbare verkopingen en treedt in werking op het
      tijdstip waarop [artikel 103, tweede, derde en vierde lid van de Registratiewet](onbekend) 1917 vervalt.
    url: https://wetten.overheid.nl/BWBR0002798/2002-01-01#Artikel4
