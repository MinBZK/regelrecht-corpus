preamble:
  text: |-
    Gelet op de artikelen 4 en 11 van de Wet op de justitiele documentatie en op de verklaringen omtrent het gedrag,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0002297/1969-07-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Van onherroepelijk geworden veroordelingen, door andere dan Nederlandse rechters gewezen, kunnen uittreksels in de
      strafregisters worden opgenomen, indien aan de navolgende voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0002297/1969-07-25#Artikel1
  - number: '2'
    text: Het bericht van de veroordeling moet langs officiële weg ter kennis van het Ministerie van Justitie zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0002297/1969-07-25#Artikel2
  - number: '3'
    text: |-
      De veroordeling moet zijn gewezen ter zake van een feit, dat door de Nederlandse strafwet als misdrijf wordt
      beschouwd of dat gelijkgesteld kan worden met een overtreding van [artikel 432 Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel432
    url: https://wetten.overheid.nl/BWBR0002297/1969-07-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '432'
  - number: '4'
    text: |-
      1 De veroordeling moet zijn gewezen door een bij de wet ingesteld burgerlijk of militair, tot het opleggen van
      straffen bevoegd gerecht.

      2 In elk geval worden de veroordelingen in de strafregisters opgenomen, indien zij zijn gewezen door een
      gerecht van Suriname, de Nederlandse Antillen of van enig land, waarmede een overeenkomst bestaat betreffende de
      uitwisseling van gegevens over strafrechtelijke veroordelingen.
    url: https://wetten.overheid.nl/BWBR0002297/1969-07-25#Artikel4
  - number: '5'
    text: |-
      In geval van twijfel over de uitlegging van de [artikelen 3][ref1] en [4][ref2] en indien de veroordeling is
      gewezen door een rechter van een ander land dan in [artikel 4][ref3] bedoeld, beslist de Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002297#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002297#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002297#Artikel4
    url: https://wetten.overheid.nl/BWBR0002297/1969-07-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002297
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002297
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0002297
        artikel: '4'
  - number: '6'
    text: |-
      1 Aan de rechterlijke ambtenaren, verbonden aan de in [artikel 4, lid 2][ref1], bedoelde gerechten, kunnen
      inlichtingen worden verstrekt over gegevens, die in de strafregisters zijn opgenomen of daarin opgenomen zijn
      geweest. Voorts kunnen inlichtingen worden verstrekt omtrent aanhangige strafzaken.

      2 De in lid 1 bedoelde inlichtingen worden verstrekt door tussenkomst van de ambtenaar, belast met het beheer van
      de ten Departemente van Justitie geregistreerde justitiële gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002297#Artikel4
    url: https://wetten.overheid.nl/BWBR0002297/1969-07-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002297
        artikel: '4'
  - number: '7'
    text: 'Dit besluit kan worden aangehaald als: Besluit registratie buitenlandse strafbladen.'
    url: https://wetten.overheid.nl/BWBR0002297/1969-07-25#Artikel7
  - number: '8'
    text: |-
      Dit besluit treedt in werking tegelijk met de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1]. Het wordt gepubliceerd in de
      *Nederlandse Staatscourant*.


