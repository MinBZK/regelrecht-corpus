  - number: '4.42'
    text: |-
      1 Een wetsvoorstel, een algemene maatregel van bestuur of ander koninklijk besluit van regelende aard en een
      ministeriële regeling worden voorzien van een toelichting.

      2 De toelichting bij een wetsvoorstel wordt aangeduid als ‘*memorie van toelichting*’, de toelichting bij een
      algemene maatregel van bestuur of een ander koninklijk besluit van regelende aard als ‘*nota van toelichting*’.

      3 Een koninklijk besluit tot inwerkingtreding van een regeling wordt alleen van een nota van toelichting voorzien
      indien dit gelet op de inhoud ervan nodig is.


          **Toelichting**
          Voor beleidsregels en ministeriële besluiten niet zijnde ministeriële regelingen geldt dat ze van een
      toelichting kunnen worden voorzien indien daar behoefte aan is. Voor de toelichting bij een nota van wijziging
      wordt verwezen naar [aanwijzing 6.28][ref1].
          **Derde lid.**Een toelichting bij een inwerkingtredingsbesluit kan met name aan de orde zijn indien
      een uitzonderingsgrond voor de vaste verandermomenten of de minimuminvoeringstermijn als bedoeld in
      [aanwijzing 4.17, vijfde lid][ref2], wordt toegepast of indien het inwerkingtredingsbesluit voorziet in een
      gefaseerde inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
