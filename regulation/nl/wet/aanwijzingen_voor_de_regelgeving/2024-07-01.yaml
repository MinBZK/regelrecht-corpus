  - number: '5.53'
    text: |-
      Indien de besluitvorming uiteenvalt in een reeks achtereenvolgende besluiten, wordt overwogen om slechts tegen één
      besluit bestuursrechtelijke rechtsbescherming open te stellen.
          **Toelichting**
          Het beperken van de lasten voor de rechtspraak enerzijds en het geen afbreuk doen aan de
      rechtsbescherming van de burger anderzijds dienen hierbij tegen elkaar te worden afgewogen. Een voorbeeld
      waarbij alleen bestuursrechtelijke rechtsbescherming openstaat tegen het laatste besluit in de reeks,
      is de aanwijzing van gedeputeerde staten aan de gemeenteraad om een bestemmingsplan vast te stellen
      ([artikel 4.2, eerste lid, van de Wet ruimtelijke ordening][ref1]; zie de vermelding van die bepaling in
      [artikel 1 van bijlage 2 Awb][ref2]). Concentratie van rechtsbescherming kan soms ook worden bereikt door te
      bepalen dat bij het beroep tegen een uitvoeringsbesluit geen gronden kunnen worden aangevoerd die betrekking hebben
      op het uit te voeren besluit (zie bijvoorbeeld [artikel 27 van de Tracéwet][ref3]).


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0006147#Artikel27
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.53
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0006147
        artikel: '27'
  - number: 5.54.1
    text: 'Administratief beroep wordt slechts opengesteld, indien:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.54
  - number: 5.54.1.a
    text: sprake is van een niet in overwegende mate gebonden besluit, en
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.54
  - number: 5.54.1.b
    text: |-
      het belang van de eenheid van beleid of van sturing door een hoger bestuursorgaan op een beleidsterrein waarvoor
      dit orgaan medeverantwoordelijkheid draagt, niet afdoende door andere bestuursinstrumenten kan worden verzekerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.54
  - number: 5.54.2
    text: |-
      Tegen besluiten van bestuursorganen wordt, tenzij daarvoor een bijzondere reden bestaat, geen administratief beroep
      opengesteld bij een ander orgaan van hetzelfde openbare lichaam.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.54
  - number: '5.55'
    text: |-
      Indien het wenselijk is dat de werking van een besluit wordt opgeschort zolang het besluit nog door de
      bestuursrechter kan worden vernietigd, wordt het volgende model gebruikt: *De werking van het besluit wordt
      opgeschort totdat de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist.*
          **Toelichting**
          [Artikel 6:16 Awb][ref1] bepaalt dat het bezwaar of beroep niet de werking schorst van het besluit
      waartegen het is gericht, tenzij bij of krachtens wettelijk voorschrift anders is bepaald. Met het oog op de
      rechtsbescherming, in het bijzonder van derden-belanghebbenden, kan het soms gewenst zijn om te regelen dat de
      werking van een besluit gedurende een bepaalde periode na de bekendmaking wordt opgeschort. Aandacht hiervoor
      is met name van belang als de uitvoering van het besluit tot onomkeerbare gevolgen leidt. Bij de overweging van
      de vraag of het noodzakelijk is om een regeling ter zake van de opschorting van de werking van een besluit op te
      nemen, moet worden bedacht dat belanghebbenden in beginsel de mogelijkheid hebben om bij de bestuursrechter een
      voorlopige voorziening te vragen, inhoudende gehele of gedeeltelijke schorsing van een besluit.
          Als tegen een besluit eerst bezwaar moet worden gemaakt voordat beroep kan worden ingesteld, dan volgt uit de
      modelbepaling, gelet op het stelsel van de [Awb][ref2], dat ook het maken van bezwaar de werking van het besluit
      opschort.
          In beginsel geldt de opschortende werking voor de periode waarbinnen bezwaar kan worden gemaakt of beroep kan
      worden ingesteld bij een bestuursrechter. Een verdergaande mogelijkheid is dat wordt bepaald dat het besluit buiten
      werking blijft totdat op een ingesteld beroep is beslist. Overigens geldt dat de bestuursrechter in het kader
      van de bevoegdheid tot het treffen van een voorlopige voorziening op grond van een daartoe ingesteld verzoek kan
      beslissen de schorsing op te heffen.
          De [WarBES][ref3] bevat geen met [artikel 6:16 Awb][ref4] vergelijkbare bepaling. Ook voor de [WarBES][ref5]
      geldt echter dat een bezwaar of beroep niet de werking schorst van de beschikking waartegen het is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0028455
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0028455
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.55
