  - number: '3.63'
    text: |-
      In een uitvoeringsregeling worden zo mogelijk de indeling en volgorde van de onderdelen, de opschriften van die
      onderdelen, de wijze van nummering van de artikelen en de volgorde van de artikelen van de hogere regeling in acht
      genomen.


          **Toelichting**
          Zie ook de [aanwijzingen 2.34][ref1] en [3.4][ref2].


