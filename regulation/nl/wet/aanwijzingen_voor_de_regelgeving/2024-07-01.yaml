  - number: '5.23'
    text: |-
      1 Indien bevoegdheden aan gemeenten, provincies of de openbare lichamen Bonaire, Sint Eustatius en Saba worden
      toegekend:

      a. wordt de bevoegdheid tot het vaststellen van algemeen verbindende voorschriften, het vaststellen van de kaders
      van het beleid en het nemen van een besluit dat een sterke democratische legitimatie nodig heeft, in beginsel
      toegekend aan de gemeenteraad, provinciale staten of de eilandsraad;

      b. wordt de bevoegdheid tot het vaststellen of uitvoeren van beleid en het vaststellen van besluiten, niet
      zijnde algemeen verbindende voorschriften, in beginsel toegekend aan het college van burgemeester en wethouders,
      gedeputeerde staten of het bestuurscollege.

      2 De termen ‘*gemeentebestuur*’, ‘*provinciebestuur*’ en ‘*eilandsbestuur*’ worden vermeden. De term ‘*gemeente*’
      of ‘*provincie*’ wordt uitsluitend gehanteerd als aanduiding van de rechtspersoon gemeente of provincie of het
      gebied van de gemeente of provincie.

      3 De term ‘*openbare lichamen*’ als aanduiding van de rechtspersonen openbaar lichaam Bonaire, openbaar lichaam
      Sint Eustatius of openbaar lichaam Saba of als aanduiding van het gebied van die openbare lichamen, wordt
      uitsluitend gebruikt, indien uit de regeling volgt dat de openbare lichamen Bonaire, Sint Eustatius en Saba bedoeld
      zijn.


          **Toelichting**
          In de [Gemeentewet][ref1] en de [Provinciewet][ref2] zijn sinds de dualisering van het gemeente- en
      het provinciebestuur de posities en bevoegdheden van gemeenteraden en het college van burgemeester en
      wethouders, respectievelijk van provinciale staten en gedeputeerde staten, ontvlochten. Bij de toedeling
      van bevoegdheden aan de bestuursorganen van gemeenten en provincies wordt een keuze gemaakt die in
      overeenstemming is met de uitgangspunten van het dualistische bestuursmodel. In het algemeen geldt
      dat het college van burgemeester en wethouders en gedeputeerde staten besturen; bij de gemeenteraad
      en provinciale staten ligt het accent op controle, het stellen van kaders en de vertegenwoordigende
      functie. Zie de [artikelen 147][ref3] en [160, eerste lid, onder a en b, van de Gemeentewet][ref4] en
      [artikel 158, eerste lid, onder a en b, van de Provinciewet][ref5], alsmede het toetsingskader dat is opgenomen
      in Kamerstukken II 2002/03, 28995, nr. 3, p. 2–3. Bij de opneming van Bonaire, Sint Eustatius en Saba in het
      Nederlandse staatsbestel heeft eenzelfde ontvlechting van de posities en bevoegdheden van de eilandsraden en
      bestuurscolleges ten grondslag gelegen aan de [Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref6].


