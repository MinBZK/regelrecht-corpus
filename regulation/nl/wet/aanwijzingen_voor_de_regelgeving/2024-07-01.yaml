  - number: '5.5'
    text: |-
      1 In een regeling die zowel in het Europese deel van Nederland als in Bonaire, Sint Eustatius en Saba van
      toepassing is, worden, indien dat de toegankelijkheid van de regeling ten goede komt, bepalingen die specifiek
      betrekking hebben op de toepassing van de regeling in Bonaire, Sint Eustatius en Saba, in een apart hoofdstuk of
      een aparte paragraaf opgenomen.

      2 Het aparte hoofdstuk of de aparte paragraaf voor Bonaire, Sint Eustatius en Saba wordt opgenomen aan het einde
      van de regeling, voor de slotartikelen.


          **Toelichting**
          In een regeling die zowel in het Europese als het Caribische deel van Nederland van toepassing is (‘gemengde
      regeling’), zullen vaak bijzondere bepalingen nodig zijn voor de toepassing van die regeling in het Caribische deel
      van Nederland. Met name in bestaande regelingen waarvan de werkingssfeer pas na de totstandkoming van de regeling
      wordt uitgebreid tot Bonaire, Sint Eustatius en Saba, kan het de toegankelijkheid van de regeling ten goede komen,
      indien deze bijzondere bepalingen worden opgenomen in een apart hoofdstuk of een aparte paragraaf. Dat hoofdstuk
      of die paragraaf wordt om de structuur van de bestaande regeling niet te doorbreken opgenomen aan het einde van
      die regeling.
          **Tweede lid.**Zie voor de slotartikelen [aanwijzing 3.55][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
