  - number: '3.31'
    text: |-
      1 Met de uitdrukking ‘*genoemd*’ wordt verwezen naar personen, zaken of onderwerpen die met name worden aangeduid.

      2 Met de aanduiding ‘*bedoeld*’ wordt verwezen naar personen, zaken of onderwerpen die in algemene of omschrijvende
      zin worden aangeduid.

      3 De aanduiding ‘*als bedoeld*’ wordt gebruikt indien het voorafgaande begrip een onbepaald lidwoord of geen
      lidwoord heeft.


          **Voorbeelden**
          de organen, genoemd in artikel 5, (met komma's)
      de omstandigheden, bedoeld in artikel 8, (met komma's)
      een aantekening als bedoeld in artikel 15 (zonder komma's).
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.31
  - number: '3.32'
    text: |-
      1 De uitdrukking ‘*is van toepassing*’ wordt gebruikt indien de bepaling waarnaar wordt verwezen, letterlijk kan
      worden toegepast.

      2 De uitdrukking ‘*is van overeenkomstige toepassing*’ wordt gebruikt indien de bepaling waarnaar wordt verwezen,
      niet geheel letterlijk kan worden toegepast, maar misverstand over de toe te passen tekst uitgesloten is.

      3 De uitdrukking ‘*is van [overeenkomstige] toepassing, met dien verstande dat ...*’ wordt gebruikt indien de
      bepaling waarnaar wordt verwezen, gedeeltelijk of met wijziging van bepaalde onderdelen moet worden toegepast.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.32
  - number: '3.33'
    text: |-
      1 De aanduiding ‘*deze wet*’ wordt uitsluitend gehanteerd bij verwijzing naar een ander onderdeel van de wet zelf
      waarin de verwijzing is opgenomen.

      2 Het eerste lid is van overeenkomstige toepassing op een algemene maatregel van bestuur of een ministeriële
      regeling.


          **Toelichting**
          Gebruik van de aanduiding ‘deze wet’ bij verwijzing naar een andere wet leidt tot verwarring en dient daarom
      achterwege te blijven. Bij verwijzing naar een andere wet wordt die andere wet aangeduid als ‘die wet’. Hetzelfde
      geldt voor algemene maatregelen van bestuur en ministeriële regelingen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.33
  - number: '3.34'
    text: |-
      Verwijzing naar een artikel uit het Burgerlijk Wetboek geschiedt overeenkomstig het volgende voorbeeld: *artikel
      162 van Boek 6 van het Burgerlijk Wetboek.*


          **Toelichting**
          In toelichtingen e.d. kan ook een kortere aanduiding worden gebruikt: [artikel 6:162 BW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel162
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.34
    references:
