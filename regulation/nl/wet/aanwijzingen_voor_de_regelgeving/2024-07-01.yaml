  - number: '3.42'
    text: |-
      1 Bij het aanhalen van bindende EU-rechtshandelingen wordt de titel gebruikt die daaraan in het Publicatieblad van
      de Europese Unie is gegeven.

      2 Indien vermelding van de vindplaats in het Publicatieblad van de Europese Unie wenselijk wordt geacht, geschiedt
      dat op de wijze zoals in [aanwijzing 3.46][ref1] beschreven.


          **Toelichting**
          **Eerste lid.**Deze aanwijzing ziet op verwijzingen in het lichaam van een regeling. Zie voor verwijzingen
      in het opschrift van een regeling [aanwijzing 4.3][ref2]. Deze aanwijzing heeft ook betrekking op het
      hoofdlettergebruik in de woorden ‘Richtlijn’ en ‘Verordening’ (zie ook het hieronder opgenomen voorbeeld).
          Vermeldingen tussen haakjes dat het om een ‘herschikking’ of ‘codificatie’ gaat worden bij het aanhalen van een
      bindende EU-rechtshandeling niet overgenomen, evenals de vermelding ‘voor de EER relevante tekst’. Tussen haakjes
      geplaatste verkorte aanduidingen van de rechtshandeling (bijvoorbeeld ‘algemene verordening gegevensbescherming’)
      worden wel overgenomen.
          **Tweede lid.** Dankzij de elektronische ontsluiting van EU-rechtshandelingen via de website [https://eur-
      lex.europa.eu](https://eur-lex.europa.eu) heeft het meestal geen meerwaarde om naast de titel ook de vindplaats in
      het Publicatieblad te vermelden, nu de in de titel van EU-rechtshandelingen opgenomen unieke nummering voldoende
      is om alle informatie daarover te kunnen vinden. Wanneer er een bijzondere reden is om dat toch te doen wordt de
      notatie gebruikt zoals in [aanwijzing 3.46][ref3] beschreven.

          Richtlijn (EU) 2015/849 van het Europees Parlement en de Raad van 20 mei 2015 inzake de voorkoming van het
      gebruik van het financiële stelsel voor het witwassen van geld of terrorismefinanciering, tot wijziging van
      Verordening (EU) nr. 648/2012 van het Europees Parlement en de Raad en tot intrekking van [Richtlijn 2005/60/EG]
      (32005L0060) van het Europees Parlement en de Raad en [Richtlijn 2006/70/EG](32006L0070) van de Commissie.


