  - number: '3.48'
    text: |-
      Verwijzing in een regeling naar toe te passen normalisatienormen geschiedt in beginsel op een niet-dwingende wijze.


          **Toelichting**
          Wanneer het wenselijk is bij overheidsinterventie aan te sluiten bij het zelfregulerende vermogen van de
      maatschappij (zie [aanwijzing 2.5][ref1]) kan dit bijvoorbeeld door in een regeling te verwijzen naar een norm die
      niet publiekrechtelijk van aard is.
          Tot zulke normen van niet-publiekrechtelijke aard behoren onder andere normalisatienormen. Normalisatie
      is het systeem waarbij private partijen door tussenkomst van een normalisatie-instituut, zoals het Nederlands
      Normalisatie-instituut NEN, gezamenlijk normen voor hun handelen opstellen. Op normalisatienormen rust
      auteursrecht zodat zij alleen tegen betaling bij het normalisatie-instituut kunnen worden verkregen. Om die
      reden is het dwingend opleggen van dergelijke normen in regelgeving minder wenselijk. Het dwingend opleggen van
      normalisatienormen past bovendien minder goed bij het vrijwillige karakter van het systeem van normalisatie. In het
      algemeen heeft het toepasselijk maken van de norm op facultatieve basis dan ook de voorkeur. Dit kan in de vorm van
      een weerlegbaar rechtsvermoeden waarbij het volgen van de norm het vermoeden oplevert dat aan een wettelijke eis is
      voldaan. Dit is bijvoorbeeld het geval in het systeem van Europese richtlijnen conform de zogenoemde Nieuwe Aanpak.
      Zie voor de formulering van een weerlegbaar rechtsvermoeden [aanwijzing 3.10, tweede lid][ref2].
          In bepaalde gevallen legt de wetgever het volgen van een normalisatienorm dwingend op. Zo zijn er EU-
      richtlijnen, verdragen en besluiten van volkenrechtelijke organisaties die de nationale wetgever daartoe
      verplichten. Dwingende verwijzing naar normalisatienormen komt verder bijvoorbeeld in aanmerking in geval van
      regelingen die zich richten tot overheidsinstanties en waarbij een exclusieve toepassing wenselijk is of in geval
      van strafrechtelijke handhaving, waarbij een duidelijke norm moet worden gesteld bijvoorbeeld met betrekking tot
      een toe te passen meetmethode. Een dergelijke vorm van verwijzing moet gemotiveerd worden. Verder moet bij de
      verwijzing worden vermeld wat de vindplaats van de norm is, moet de norm algemeen verkrijgbaar zijn en dient de
      norm (behoudens het geval dat enkel de overheid normadressaat is) kosteloos ter beschikking te worden gesteld.
      Indien dit laatste niet mogelijk is omdat het een internationale norm betreft, mag de prijs van die norm niet
      onredelijk hoog zijn.
          Zie over de verwijzing in wetgeving naar normalisatienormen en over de status van verwezen normen
      [artikel 14a van de Bekendmakingswet][ref3] en [aanwijzing 4.29][ref4]. Zie ook de brief van de Minister van
      Justitie van 9 april 2009 (Kamerstukken II 2008/09, 28 325, nr. 105) en de brief van de Minister van Economische
      Zaken, Landbouw en Innovatie van 30 juni 2011 (Kamerstukken II 2010/11, 27 406, nr. 193).


