  - number: '4.47'
    text: |-
      Een toelichting wordt niet gebruikt voor het stellen van nadere regels.


          **Toelichting**
          De toelichting geeft een motivering en uitleg van de regeling maar mag geen aanvullende normen bevatten. De te
      stellen normen worden in de regeling zelf vastgelegd. Evenmin mag een toelichting gebruikt worden voor een nadere
      omlijning van in de regeling voorkomende termen of begrippen. Dit neemt niet weg dat het in bepaalde gevallen
      wenselijk kan zijn een nadere verklaring te geven van in de regeling voorkomende termen of begrippen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.47
  - number: '4.48'
    text: |-
      1 Een toelichting wordt verdeeld in een algemeen en een artikelsgewijs gedeelte, indien dit de toegankelijkheid
      bevordert.

      2 Onderdelen van een toelichting worden genummerd, indien dit met het oog op verwijzing wenselijk is.


          **Toelichting**
          Bij omvangrijke regelingen kan het praktisch zijn een paragraaf Hoofdlijnen op te nemen. Deze paragraaf kan
      een korte schets bevatten van de strekking van de regeling, het probleem, de (politieke) doelstelling, de gekozen
      oplossing en de systematiek van de regeling. Uitgebreide historische beschouwingen blijven, tenzij onontbeerlijk,
      achterwege. Een artikelsgewijze toelichting is met name nuttig bij uitgebreide of (technisch) complexe regelingen.
      Bij eenvoudige regelingen kan worden volstaan met een verwijzing naar de artikelen in het algemeen deel van de
      toelichting. Het is overbodig in de toelichting artikelen te parafraseren of te vermelden dat een artikel geen
      toelichting behoeft.
          Zie voor implementatieregelingen ook de [aanwijzingen 9.11][ref1] en [9.12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
