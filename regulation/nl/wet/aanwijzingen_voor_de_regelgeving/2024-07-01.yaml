  - number: '5.66'
    text: |-
      Bij de beëindiging van een taak van een overheidsorgaan of de overgang van een taak op een ander overheidsorgaan
      wordt in het overgangsrecht een voorziening opgenomen voor de op die taak betrekking hebbende archiefbescheiden.
      Daarbij worden de volgende modellen als uitgangspunt genomen:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.66
  - number: 5.66.A
    text: |-
      *Archiefbescheiden van [overheidsorgaan A] betreffende zaken die op het tijdstip van inwerkingtreding van deze
      wet nog niet zijn afgedaan, worden overgedragen aan [overheidsorgaan B], voor zover zij niet overeenkomstig de
      Archiefwet 1995 zijn overgebracht naar een archiefbewaarplaats.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.66
  - number: 5.66.B
    text: |-
      *Archiefbescheiden van [voorheen bevoegde overheidsorgaan] met betrekking tot taken of werkzaamheden die op
      het tijdstip van inwerkingtreding van deze wet zijn beëindigd, worden overgedragen aan Onze Minister [van/
      voor ...]. Indien zij ingevolge de Archiefwet 1995 voor blijvende bewaring in aanmerking komen worden zij, zo
      nodig door tussenkomst van Onze Minister [van/voor ...], overeenkomstig de Archiefwet 1995 overgebracht naar een
      archiefbewaarplaats.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.66
  - number: 5.66.C
    text: |-
      *Onze Minister [van/voor ...] is met ingang van het tijdstip van inwerkingtreding van deze wet zorgdrager voor de
      archiefbescheiden die door [voorheen bevoegde overheidsorgaan] ter beschikking zijn gesteld aan privaatrechtelijke
      rechtspersonen.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.66
  - number: '5.67'
    text: |-
      Bij een wetsvoorstel wordt bezien of het noodzakelijk is de samenloop met een ander wetsvoorstel te regelen.
          **Toelichting**
          Onder samenloop wordt de situatie verstaan waarin een tekstuele afhankelijkheid tussen twee (of meer)
      wetsvoorstellen (of met betrekking tot een wet die nog niet in werking is getreden) bestaat terwijl de procedures
      van totstandkoming in de tijd onafhankelijk van elkaar verlopen. Het gaat hier dus niet om situaties als die
      van een nieuwe wet en een invoeringswet daarbij, waar de inhoud en procedurele voortgang van het ene voorstel
      rechtstreeks bepalend zijn voor die van het andere voorstel. Een samenloopprobleem zal zich over het algemeen
      slechts voordoen bij wetsvoorstellen, aangezien bij algemene maatregelen van bestuur, andere koninklijke besluiten
      en ministeriële regelingen kort voor de publicatie nog wijzigingen kunnen worden aangebracht en de tekst kan worden
      vastgesteld naar de situatie die op dat moment bestaat.
          Het verdient de voorkeur samenloopproblemen te voorkomen. Dit kan worden bereikt door:
          een tweede wetgevingstraject pas te starten wanneer het eerste zijn beslag heeft gevonden in een
      wet(swijziging) of anderszins reeds verder in procedure is, zodat de volgorde van inwerkingtreding duidelijk vooraf
      goed kan worden ingeschat;
      wetsvoorstellen aldus te formuleren dat geen tekstuele afhankelijkheid bestaat, bijvoorbeeld door gebruik te maken
      van de in [aanwijzing 5.69][ref1] opgenomen mogelijkheid;
      de wetsvoorstellen samen te voegen.
          Verder kunnen samenloopproblemen soms worden voorkomen door in het koninklijk besluit dat de inwerkingtreding
      regelt de volgorde van inwerkingtreding te bepalen: zie [aanwijzing 5.70, tweede lid][ref2].
          Het verdient aanbeveling een samenloopbepaling als bedoeld in [aanwijzing 5.68][ref3] pas in een wetsvoorstel
      op te nemen op het moment dat vaststaat dat een samenloopprobleem zich daadwerkelijk voordoet en dat probleem niet
      anders dan door een samenloopbepaling opgelost kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.67
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '5'
        paragraaf: '5.15'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '5'
