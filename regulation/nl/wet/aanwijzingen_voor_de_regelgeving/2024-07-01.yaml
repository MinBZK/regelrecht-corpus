  - number: '9.18'
    text: |-
      1 Indien voor implementatie van een bindende EU-rechtshandeling een algemene maatregel van bestuur nodig is, wordt
      het ontwerp daarvoor ten minste 9 maanden voor afloop van de implementatietermijn aan de ministerraad voorgelegd.

      2 Indien voor implementatie van een bindende EU-rechtshandeling een wet nodig is, wordt een voorstel daarvoor ten
      minste 18 maanden voor afloop van de implementatietermijn aan de ministerraad voorgelegd.

      3 In afwijking van het eerste of het tweede lid wordt het ontwerp respectievelijk het voorstel zo snel mogelijk
      doch uiterlijk 2 maanden na vaststelling van de bindende EU-rechtshandeling aan de ministerraad voorgelegd, indien
      de implementatietermijn bij vaststelling korter is dan 9 respectievelijk 18 maanden.


          **Toelichting**
          De aanwijzing bevat voor bindende EU-rechtshandelingen een nadere invulling van het reeds in
      [aanwijzing 8.7, derde lid][ref1], neergelegde vereiste van tijdige implementatie van besluiten van
      volkenrechtelijke organisaties. De in een bepaald geval geldende implementatietermijn blijkt uit de bindende
      EU-rechtshandelingen zelf. Uit het implementatieplan op grond van [aanwijzing 9.17][ref2] blijkt of formele
      wetgeving noodzakelijk is of dat kan worden volstaan met het vaststellen van een algemene maatregel van
      bestuur of ministeriële regeling. De aanwijzing dwingt er toe om op een zodanig moment te beginnen met de
      (interdepartementale) voorbereidingen dat na de ministerraad nog voldoende tijd beschikbaar is voor advisering
      door de Afdeling advisering van de Raad van State en, bij wetsvoorstellen, voor parlementaire behandeling. Onder
      ‘voorlegging aan de ministerraad’ moet in de regel voorlegging aan de in het betrokken geval bevoegde onderraad
      begrepen worden. Indien de implementatieregeling ook in een ambtelijk voorportaal moet worden behandeld, heeft de
      termijn van 9 of 18 maanden betrekking op de voorlegging aan dat voorportaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
