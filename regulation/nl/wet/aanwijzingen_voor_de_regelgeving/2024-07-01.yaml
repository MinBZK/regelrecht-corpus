  - number: '4.11'
    text: |-
      1 In de aanhef van een wet wordt een considerans opgenomen.

      2 In een andere regeling wordt geen considerans opgenomen.


          **Toelichting**
          **Eerste lid.**Bij wetten verplicht additioneel [artikel XIX van de Grondwet][ref1] tot opneming van
      een considerans. De Tweede Kamer gebruikt in plaats van ‘considerans’ de term ‘beweegreden’ (zie ook het
      [Reglement van Orde van de Tweede Kamer][ref2]).
          **Tweede lid.**De reden voor de vaststelling van een algemene maatregel van bestuur of een ministeriële
      regeling wordt kenbaar gemaakt in de (nota van) toelichting. Zie [aanwijzing 4.42][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#ArtikelXIX
      [ref2]: https://wetten.overheid.nl/BWBR0006023
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.11
