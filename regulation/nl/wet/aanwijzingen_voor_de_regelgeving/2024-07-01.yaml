  - number: '7.16'
    text: |-
      Over een bij amendement voorgestelde ingrijpende wijziging van een wetsvoorstel wordt de Afdeling advisering van de
      Raad van State alleen gehoord, indien de betrokken bewindspersoon daaraan met het oog op zijn oordeelsvorming over
      het amendement behoefte gevoelt.


          **Toelichting**
          Gaat het om een wijziging waarbij het functioneren van de Raad van State in het geding is, dan ligt het voor de
      hand daarover het gevoelen van de Raad van State te vernemen, hetzij in de vorm van een adviesaanvrage, hetzij door
      raadpleging van de vice-president.
          Advisering over een amendement is verder geïndiceerd indien de verenigbaarheid met hoger recht aan de orde is
      en de aanvaardbaarheid van dat amendement in dat licht moet worden bezien.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.16
  - number: '7.17'
    text: |-
      De in [aanwijzing 7.10][ref1] bedoelde adviezen over een voorstel van wet worden aan de Tweede Kamer toegezonden.


          **Toelichting**
          Ingevolge [artikel 80, tweede lid, van de Grondwet][ref2] worden adviezen van vaste adviescolleges, uitgebracht
      ter zake van voorstellen van wet die door of vanwege de Koning worden ingediend, behoudens bij de wet te bepalen
      uitzonderingen aan de Staten-Generaal overgelegd. De aanwijzing omvat mede de andere aan de Afdeling advisering van
      de Raad van State overgelegde adviezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel80
