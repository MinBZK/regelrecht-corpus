  - number: '3.64'
    text: |-
      In een regeling worden, tenzij dit onvermijdelijk is, bepalingen uit een andere regeling, die hetzelfde onderwerp
      regelen, niet herhaald.


          **Toelichting**
          Het gaat hierbij met name om het vermijden van herhaling in een uitvoeringsregeling van bepalingen uit de
      delegerende regeling en herhaling in een bijzondere regeling van bepalingen uit algemene regelingen, zoals het
      Burgerlijk Wetboek, de [Algemene wet bestuursrecht][ref1], de [Gemeentewet][ref2] of de [Wet milieubeheer][ref3].


