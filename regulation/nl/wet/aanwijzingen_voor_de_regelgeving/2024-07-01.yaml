        paragraaf: '3.3'
  - number: '9.12'
    text: |-
      1 De toelichting bij een regeling ter implementatie van een bindende EU-rechtshandeling bevat een
      transponeringstabel waaruit blijkt of en hoe de afzonderlijke bepalingen van de desbetreffende bindende EU-
      rechtshandeling zijn of worden geïmplementeerd. De transponeringstabel bevat een verwijzing naar de desbetreffende
      bindende EU-rechtshandeling overeenkomstig [aanwijzing 3.42][ref1].

      2 Indien een bepaling uit de desbetreffende bindende EU-rechtshandeling ruimte laat voor, dan wel verplicht tot het
      maken van beleidskeuzes, wordt dit in de transponeringstabel aangegeven en wordt verwezen naar de passages in de
      toelichting waarin de door de regering gemaakte keuzes worden toegelicht.

      3 Indien een bepaling uit een bindende EU-rechtshandeling geen implementatie behoeft, wordt dit vermeld in de
      transponeringstabel. Hierbij wordt aangegeven wat de reden daarvan is, en wordt indien noodzakelijk verwezen naar
      de passages in de toelichting waar daar nader op wordt ingegaan.

      4 De transponeringstabel maakt onderdeel uit van de toelichting bij de implementatieregeling.


          **Toelichting**
          Het model transponeringstabel wordt door de Interdepartementale Commissie Europees Recht – Implementatie (ICER-
      I) vastgesteld.
          Uit het oogpunt van kenbaarheid verdient het aanbeveling de transponeringstabel op te nemen aan het einde van
      de toelichting. Als een bepaling niet tot wijziging van bestaande regelgeving of nieuwe regelgeving leidt, wordt in
      de transponeringstabel kort aangegeven waarom dat het geval is. Daarbij valt te denken aan de volgende gevallen:
          de bepaling betreft feitelijk handelen van de centrale overheid zonder dat derden daarop aanspraak hoeven te
      kunnen maken (zie [aanwijzing 9.6][ref2]);
      de bepaling richt zich slechts tot de EU-instellingen zelf, zoals grondslagen voor uitvoeringsbesluiten;
      het betreft een facultatieve bepaling waar geen gebruik van gemaakt wordt;
      de bepaling is reeds geïmplementeerd door middel van bestaand recht (zie [aanwijzing 9.13][ref3]).
          Daar waar nadere toelichting nodig is (bijvoorbeeld om aan te geven op welke wijze bestaand recht als
      implementatie van de nieuwe EU-verplichting gezien kan worden) wordt in de transponeringstabel verwezen naar de
      desbetreffende passage in de toelichting.
          Indien de bindende EU-rechtshandeling mede in andere nationale regelingen wordt geïmplementeerd, behoren die
      ook in de tabel te worden vermeld. Deze aanwijzing laat de [aanwijzingen 4.10][ref4] en [4.13][ref5] onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
