  - number: '6.13'
    text: |-
      Bij wijziging van een regeling kunnen bestaande bepalingen strekkende tot wijziging van andere regelingen en andere
      uitgewerkte bepalingen van die regeling vervallen.


          **Toelichting**
          Het doen vervallen verdient in het bijzonder aanbeveling indien bij wijziging van een regeling
      tevens opdracht wordt gegeven tot plaatsing van de integrale actuele tekst van de regeling (zie
      [aanwijzing 6.22, tweede lid][ref1]). Bij uitgewerkte bepalingen kan ook gedacht worden aan materieel uitgewerkte
      overgangsbepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.13
    references:
