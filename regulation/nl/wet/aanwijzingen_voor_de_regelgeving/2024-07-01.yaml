        paragraaf: '4.9'
  - number: '7.7'
    text: |-
      1 Bij de voorbereiding van regelingen beziet het voor de regeling eerstverantwoordelijke ministerie steeds of
      bindende EU-rechtshandelingen of andere internationale verplichtingen ertoe noodzaken het ontwerp van de regeling
      te notificeren aan een instelling van de Europese Unie of van een andere internationale organisatie.

      2 Bij de bepaling van het tijdstip van vaststelling van de regeling wordt in voorkomend geval de voorgeschreven
      standstillperiode in acht genomen dan wel stilzwijgende of uitdrukkelijke goedkeuring van de desbetreffende
      instelling afgewacht.


          **Toelichting**
          In bepaalde gevallen moet de Europese Commissie in kennis worden gesteld van ontwerpen voor autonome nationale
      regelingen. Deze notificaties moeten worden onderscheiden van notificaties achteraf, zoals de kennisgeving van
      implementatieregelingen (zie [aanwijzing 9.19][ref1]) of notificatieverplichtingen onder de Dienstenrichtlijn
      (zie [aanwijzing 5.29][ref2]). Doel van de verplichting tot voorafgaande notificatie is om de Commissie –
      en in bepaalde gevallen de lidstaten – de gelegenheid te geven de nationale ontwerpregeling te toetsen op
      verenigbaarheid met het EU-recht en eventueel wijzigingen voor te stellen. Ook de Wereldhandelsorganisatie (WTO)
      kent notificatieverplichtingen voor ontwerpregelingen, bijvoorbeeld op grond van de op 15 april 1994 te Marrakech
      gesloten Overeenkomst inzake technische handelsbelemmeringen (Trb. 1994, 235). Ingevolge deze overeenkomst moeten
      ontwerpen van technische voorschriften worden gemeld aan het Secretariaat van de WTO.
          Het achterwege laten van een dergelijke notificatie kan de rechtsgeldigheid van de regeling aantasten. Zie
      het Securitel-arrest (HvJ EG 30 april 1996, ECLI:EU:C:1996:172) inzake [Richtlijn nr. 83/189/EEG](31983L0189) van
      de Raad van de Europese Gemeenschappen van 28 maart 1983 betreffende een informatieprocedure op het gebied van
      normen en technische voorschriften. Deze richtlijn is inmiddels vervangen door Richtlijn (EU) 2015/1535 van het
      Europees Parlement en de Raad van 9 september 2015 betreffende een informatieprocedure op het gebied van technische
      voorschriften en regels betreffende de diensten van de informatiemaatschappij.
          Algemene informatie omtrent notificatieprocedures kan worden verkregen bij de op ieder ministerie aangewezen
      notificatiecoördinator. Vraagstukken omtrent notificatie met een interdepartementale dimensie kunnen via de
      notificatiecoördinator worden voorgelegd aan de Interdepartementale Commissie voor Europees Recht-Notificatie
      (ICER-N). Informatie over de verplichting tot en de wijze van notificatie is opgenomen in de ‘ICER-Handleiding
      notificatie van technische voorschriften’ en de ‘ICER-Handleiding notificatie onder de Dienstenrichtlijn’, te
      raadplegen op [www.kcbr.nl](http://www.kcbr.nl/).
          Belangrijk is ook artikel 108, derde lid, VWEU inzake steunmaatregelen van de lidstaten. Voorgenomen
      steunmaatregelen moeten op hun verenigbaarheid met het VWEU worden beoordeeld en indien noodzakelijk ter
      goedkeuring worden aangemeld bij de Europese Commissie. Het is ook mogelijk dat kan worden volstaan met een
      kennisgeving bij de Europese Commissie. Hiervoor moet de voorgenomen regelgeving tijdig worden bezien op
      staatssteunaspecten. Ieder ministerie heeft zelf staatssteunexperts (veelal bij de directies Juridische Zaken) en
      zorgt zelf voor het tijdig doorlopen van de aanmeldingsprocedure of kennisgevingsprocedure. Algemene informatie
      omtrent deze meldingsprocedure kan worden verkregen bij het Ministerie van Economische Zaken en Klimaat en bij de
      juridische directie van ieder ministerie. Vraagstukken omtrent staatssteun met een interdepartementale dimensie
      kunnen via de contactpersoon staatssteun bij de juridische directie worden voorgelegd aan het Interdepartementale
      Staatssteun Overleg (ISO). Zie ook de Handreiking Staatssteun voor de overheid, te raadplegen op [www.kcbr.nl]
      (http://www.kcbr.nl/).
          De notificatie vindt plaats op een zodanig tijdstip dat enerzijds de nationale besluitvorming zoveel mogelijk
      is afgerond en anderzijds nog gelegenheid bestaat om de regeling aan te passen naar aanleiding van de ontvangen
      commentaren. Voor wetsvoorstellen en algemene maatregelen van bestuur wordt in de praktijk het moment van
      accordering door de ministerraad aangehouden. Bij ministeriële regelingen kan de notificatie geschieden zodra er
      een interdepartementaal afgestemd ontwerp ligt, doch in elk geval vóór ondertekening door de minister. Wanneer de
      regeling in de verdere procedure nog essentieel wordt gewijzigd, moet opnieuw notificatie plaatsvinden.
          Notificatie onder de Dienstenrichtlijn vindt onverwijld na vaststelling van de desbetreffende regeling plaats.
      Indien op onderdelen tevens richtlijn (EU) 2015/1535 van toepassing is, worden die onderdelen wel in de ontwerpfase
      genotificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
