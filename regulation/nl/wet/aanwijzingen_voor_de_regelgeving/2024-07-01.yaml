        paragraaf: '3.2'
  - number: '3.24'
    text: |-
      1 In geval van formele betrokkenheid van meer dan één minister bij de uitvoering van een wet of algemene maatregel
      van bestuur, worden zij, indien mogelijk, met de naam van hun ministerie genoemd.

      2 Indien vermelding bij naam niet doelmatig is, kan de formulering ‘*Onze Minister[s] die het mede aangaat*’ worden
      gebruikt.


          **Toelichting**
          Eventueel kan bepaald worden dat de aanwijzing van bij de uitvoering van de regeling betrokken ministers
      bij koninklijk besluit geschiedt. Indien de formulering ‘Onze Minister[s] die het mede aangaat’ wordt
      gebruikt, verdient het aanbeveling in de toelichting uiteen te zetten aan welke ministers wordt gedacht. Zie
      ook [aanwijzing 2.28][ref1]. Een portefeuillewisseling leidt niet tot competentieproblemen en is daarom geen
      zelfstandige reden tot aanpassing van een regeling.
          De aanduidingen ‘Onze met de uitvoering van deze wet belaste Minister’ en ‘Onze Minister, belast met de zorg
      voor ...’ worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
