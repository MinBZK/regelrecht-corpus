  - number: 3.10.1
    text: Formulering van een regel in de vorm van een fictie wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.10
  - number: 3.10.2
    text: Voor een weerlegbaar rechtsvermoeden wordt de formulering ‘*wordt/worden vermoed*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.10
  - number: 3.11.1
    text: In plaats van ‘*indien en voor zover*’ wordt de uitdrukking ‘*voor zover*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.11
  - number: 3.11.2
    text: |-
      De uitdrukking ‘*voor zover*’ wordt in een wettelijk voorschrift slechts gebruikt in de betekenis van ‘*in de mate
      dat*’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.11
  - number: '3.12'
    text: |-
      Het gebruik van de uitdrukking ‘*en/of*’ blijft achterwege.
          **Toelichting**
          Indien in een opsomming van gevallen ‘of’ wordt gebruikt, is daaronder mede begrepen de situatie dat meer dan
      een van de genoemde gevallen zich tegelijk voordoen. Zie ook [aanwijzing 3.60][ref1]. Om tot uitdrukking te brengen
      dat twee of meer genoemde gevallen zich niet gelijktijdig kunnen voordoen kan gebruikgemaakt worden van woorden als
      ‘hetzij’ of ‘dan wel’.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '3.13'
    text: |-
      Zinnen of zinsneden worden niet tussen haakjes geplaatst.
          **Toelichting**
          Plaatsing van zinnen of zinsneden tussen haakjes leidt tot onduidelijkheden in de regelgeving. Wel kan dit
      aanvaardbaar zijn, als het een enkel woord betreft. Zie bijvoorbeeld [artikel 70 van de Grondwet][ref1]. Zie ook
      [aanwijzing 3.30][ref2] voor het in een wijzigingsregeling aanhalen van zinsneden met gebruikmaking van haakjes.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '70'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '3.14'
    text: |-
      Het einde van een periode of reeks wordt aangeduid met de uitdrukking ‘*tot en met*’.
          **Toelichting**
          Het gebruik van een streepje of het woord tot’ kan tot misverstand aanleiding geven. Zie ook
      [aanwijzing 5.63, tweede lid][ref1].

          Het eerste tot en met vierde lid zijn niet van toepassing.
      Aanvragen kunnen worden ingediend in de periode van 1 januari 2017 tot en met 31 december 2017.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '5'
        paragraaf: '5.14'
  - number: 3.15.1
    text: |-
      De uitdrukking ‘*onderscheidenlijk*’ wordt gebruikt overeenkomstig het volgende voorbeeld: *Indien het betreft de
      verkiezing van de leden van provinciale staten of de gemeenteraad, geschiedt de kennisgeving op de in de provincie,
      onderscheidenlijk de gemeente, gebruikelijke wijze.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.15
  - number: 3.15.2
    text: Het gebruik van de uitdrukking ‘*c.q.*’ blijft achterwege.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.15
  - number: '3.16'
    text: |-
      Een ontwerp voor een formele wet wordt vanaf de voordracht aan de Koning in officiële stukken aangeduid als
      ‘*voorstel van wet*’. Bij rijkswetgeving wordt gesproken van ‘*voorstel van rijkswet*’.
          **Toelichting**
          Deze grondwettelijke aanduiding wordt in ieder geval gebruikt in de voordracht aan de Koning (de brief aan de
      Koning ter aanhangigmaking van een wetsvoorstel bij de Afdeling advisering van de Raad van State), de aanhef en
      het slot van het nader rapport, de brief waarbij een vervolgstuk aan de Tweede of de Eerste Kamer wordt gezonden
      en wetsartikelen waarin naar een wetsvoorstel wordt verwezen. Voor het overige kan de term ‘wetsvoorstel’ of
      ‘wetsontwerp’ worden gebruikt. Dit geldt ook in het stadium voorafgaand aan de voordracht aan de Koning.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.16
  - number: '3.17'
    text: |-
      Voor het aanduiden van door de regering vast te stellen of vastgestelde besluiten wordt de term ‘*algemene
      maatregel van [rijks]bestuur*’ of ‘*koninklijk besluit*’ gebruikt.
          **Toelichting**
          Zie ook [aanwijzing 2.26][ref1]. In het opschrift wordt ‘koninklijk’ voor ‘besluit’ weggelaten. Zie de
      [aanwijzingen 4.2][ref2], [4.21][ref3], [4.22][ref4] en [4.31, tweede en derde lid][ref5]. De term ‘Wij’ of ‘Ons’
      is verouderd en wordt, behalve in de aanhef van een wet of algemene maatregel van bestuur, niet meer gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref4
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.4'
      - id: ref5
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.7'
  - number: '3.18'
    text: |-
      Een door een minister of staatssecretaris vastgesteld algemeen verbindend voorschrift of ander besluit van
      regelende aard wordt aangeduid als ‘ministeriële regeling’.
          **Toelichting**
          In het opschrift wordt ‘ministeriële’ voor ‘regeling’ weggelaten. Zie de [aanwijzingen 4.2][ref1] en
      [4.31, vierde lid][ref2]. De aanduiding ‘ministeriële regeling’ wordt ook gebruikt voor door een minister
      of staatssecretaris in het kader van rijkswetgeving vastgestelde algemeen verbindende voorschriften. Zie ook
      [aanwijzing 3.25][ref3].
          Besluiten van algemene strekking die niet (primair) van regelende aard zijn, zoals besluiten tot instelling van
      een commissie, plegen als ‘besluit’ te worden aangeduid. De term ‘beschikking’ wordt alleen gebruikt voor besluiten
      inzake een concreet geval. Zie ook [artikel 1:3 Awb][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.18
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.7'
      - id: ref3
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 3.19.1
    text: Het geheel van dienstonderdelen onder leiding van een minister wordt aangeduid als ‘*ministerie*’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.19
  - number: 3.19.2
    text: Als bijvoeglijke aanduiding voor ministerie wordt de term ‘*departementaal*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.19
  - number: 3.20.1
    text: |-
      Bij de aanduiding van het Europese deel van het grondgebied van Nederland worden de woorden ‘*het Europese deel van
      Nederland*’ gebruikt. In een regeling die uitsluitend in het Europese deel van Nederland geldt, kan ter aanduiding
      van het Europese deel van het grondgebied van Nederland tevens het woord ‘*Nederland*’ worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.20
  - number: 3.20.2
    text: |-
      In een regeling van het Koninkrijk of een regeling die (mede) in Bonaire, Sint Eustatius en Saba geldt, wordt het
      woord ‘*Nederland*’ uitsluitend gebruikt ter aanduiding van het grondgebied van het Europese deel van Nederland,
      Bonaire, Sint Eustatius en Saba gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.20
  - number: 3.20.3
    text: |-
      Bij de aanduiding van het grondgebied van Nederland, Aruba, Curaçao en Sint Maarten gezamenlijk wordt het woord
      ‘*Koninkrijk*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.20
  - number: 3.20.4
    text: |-
      Het woord ‘*land*’ wordt gebruikt ter aanduiding van Nederland, Aruba, Curaçao of Sint Maarten als component van
      het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.20
  - number: 3.20.5
    text: |-
      Het woord ‘*Rijk*’ als aanduiding van Nederland of van het Koninkrijk wordt vermeden, indien over de betekenis
      daarvan onduidelijkheid kan bestaan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.20
  - number: 3.21.1
    text: Voor de aanduiding van bedragen in euro's wordt het euroteken ‘€’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.21
  - number: 3.21.2
    text: |-
      Voor de aanduiding van bedragen in de munteenheden van de Caribische delen van het Koninkrijk worden de volgende
      NEN/ISO-aanduidingen gebruikt:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.21
  - number: 3.21.2.a
    text: 'Aruba (de Arubaanse florin): AWG;'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.21
  - number: 3.21.2.b
    text: 'Curaçao en Sint Maarten (de Nederlands-Antilliaanse gulden): ANG;'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.21
  - number: 3.21.2.c
    text: 'Bonaire, Sint Eustatius en Saba (de Amerikaanse dollar): USD.'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.21
  - number: '3.22'
    text: |-
      Voor meeteenheden worden de wettelijk vastgestelde aanduidingen gebruikt.
          **Toelichting**
          Zie voor deze aanduidingen het [Meeteenhedenbesluit 2006][ref1]. Hierin wordt uitvoering gegeven aan de
      desbetreffende EU-richtlijnen.


      [ref1]: https://wetten.overheid.nl/BWBR0020422
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.22
    references:
      - id: ref1
        bwb_id: BWBR0020422
  - number: '3.23'
    text: |-
      In een wet, een algemene maatregel van bestuur of een koninklijk besluit wordt een minister aangeduid met ‘*Onze
      Minister van [aanduiding ministerie] / Onze Minister voor [aanduiding minister zonder portefeuille]*’ of, indien
      die aanduiding in de begripsbepalingen is gedefinieerd, met ‘*Onze Minister*’.
          **Toelichting**
          De aanduiding ‘Onze Minister (van/voor ...)’ wordt alleen gebruikt in regelingen die door de Koning worden
      vastgesteld. In ministeriële regelingen wordt een minister aangeduid als ‘de Minister (van/voor ...)’. Zie voor de
      aanduiding van staatssecretarissen [aanwijzing 3.26][ref1].
          In een regeling wordt een minister zonder portefeuille aangeduid met de voor hem vastgestelde benaming.

          Onze Minister van Defensie
      Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.24.1
    text: |-
      In geval van formele betrokkenheid van meer dan één minister bij de uitvoering van een wet of algemene maatregel
      van bestuur, worden zij, indien mogelijk, met de naam van hun ministerie genoemd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.24
  - number: 3.24.2
    text: |-
      Indien vermelding bij naam niet doelmatig is, kan de formulering ‘*Onze Minister[s] die het mede aangaat*’ worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.24
  - number: '3.25'
    text: |-
      In een rijkswet of algemene maatregel van rijksbestuur wordt een minister, belast met de zorg voor een
      koninkrijksaangelegenheid, aangeduid als ‘*Onze Minister van/voor [...] in zijn hoedanigheid van Minister van het
      Koninkrijk*’, tenzij daaromtrent geen verwarring kan bestaan.
          **Toelichting**
          Indien een minister soms als Nederlandse minister en in andere gevallen als minister, belast met de zorg voor
      een koninkrijksaangelegenheid, optreedt, kan verwarring worden voorkomen door in het laatste geval de minister als
      zodanig aan te duiden. Zie hierover Kamerstukken II 2002/03, 28836 (R 1735), A, punt 1a, en nr. 3, p. 1–2).

          Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in zijn hoedanigheid van Minister van het
      Koninkrijk ([Artikel 1, onderdeel k, van de Paspoortwet][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel1
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.25
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '1'
  - number: 3.26.1
    text: |-
      In het opschrift, de aanhef en de ondertekening van een regeling wordt een staatssecretaris aangeduid als ‘*de
      Staatssecretaris van [aanduiding ministerie]*’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.26
  - number: 3.26.2
    text: |-
      In een regeling worden taken en bevoegdheden altijd aan een minister opgedragen, ook indien een staatssecretaris op
      het desbetreffende terrein als verantwoordelijk bewindspersoon fungeert.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.26
  - number: 3.27.1
    text: |-
      Verwijzing naar andere bepalingen wordt vermeden indien de toegankelijkheid van de regeling daardoor onnodig wordt
      geschaad.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.27
  - number: 3.27.2
    text: |-
      Verwijzing naar bepalingen die zelf een verwijzing inhouden en verwijzing naar latere bepalingen van de regeling
      worden bij voorkeur vermeden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.27
  - number: 3.27.3
    text: In een regeling wordt niet verwezen naar een met name genoemde lagere regeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.27
  - number: 3.27.4
    text: Verwijzing binnen een artikel wordt zoveel mogelijk vermeden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.27
  - number: 3.28.1
    text: De verwijzing naar een regeling wordt zo mogelijk verbijzonderd tot een verwijzing naar artikelen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.28
  - number: 3.28.2
    text: |-
      Indien dit de duidelijkheid van de verwijzing vergroot, wordt de verwijzing naar een artikel verbijzonderd tot een
      verwijzing naar een onderdeel van het artikel.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.28
  - number: 3.29.1
    text: |-
      Verwijzing naar een lid van een artikel geschiedt overeenkomstig het volgende voorbeeld: *Artikel 5, tweede lid, is
      van toepassing*.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.29
  - number: 3.29.2
    text: |-
      Naar het voorafgaande artikel of lid van een artikel wordt verwezen door vermelding van het nummer van dat artikel
      of lid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.29
  - number: 3.29.3
    text: |-
      Verwijzing naar een onderdeel van een opsomming geschiedt met behulp van de aanduidingen ‘*onder*’ of
      ‘*onderdeel*’. Verwijzing naar een verdere onderverdeling geschiedt met een combinatie van deze aanduidingen of met
      behulp van de aanduiding ‘*subonderdeel*’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.29
  - number: 3.29.4
    text: |-
      Indien de aard van een verwijzing dit noodzakelijk maakt, wordt bij verwijzing naar een onderdeel van een opsomming
      mede verwezen naar de aanhef van de opsomming.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.29
  - number: 3.30.1
    text: Een volledige zin wordt aangeduid als ‘*zin*’, een deel van een zin als ‘*zinsnede*’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.30
  - number: 3.30.2
    text: |-
      Indien een zinsnede wordt aangehaald door vermelding van de volledige tekst of van het begin en einde daarvan, kan
      de aanduiding ‘zinsnede’ worden weggelaten.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.30
  - number: 3.31.1
    text: Met de uitdrukking ‘*genoemd*’ wordt verwezen naar personen, zaken of onderwerpen die met name worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.31
  - number: 3.31.2
    text: |-
      Met de aanduiding ‘*bedoeld*’ wordt verwezen naar personen, zaken of onderwerpen die in algemene of omschrijvende
      zin worden aangeduid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.31
  - number: 3.31.3
    text: |-
      De aanduiding ‘*als bedoeld*’ wordt gebruikt indien het voorafgaande begrip een onbepaald lidwoord of geen lidwoord
      heeft.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.31
  - number: 3.32.1
    text: |-
      De uitdrukking ‘*is van toepassing*’ wordt gebruikt indien de bepaling waarnaar wordt verwezen, letterlijk kan
      worden toegepast.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.32
  - number: 3.32.2
    text: |-
      De uitdrukking ‘*is van overeenkomstige toepassing*’ wordt gebruikt indien de bepaling waarnaar wordt verwezen,
      niet geheel letterlijk kan worden toegepast, maar misverstand over de toe te passen tekst uitgesloten is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.32
  - number: 3.32.3
    text: |-
      De uitdrukking ‘*is van [overeenkomstige] toepassing, met dien verstande dat ...*’ wordt gebruikt indien de
      bepaling waarnaar wordt verwezen, gedeeltelijk of met wijziging van bepaalde onderdelen moet worden toegepast.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.32
  - number: 3.33.1
    text: |-
      De aanduiding ‘*deze wet*’ wordt uitsluitend gehanteerd bij verwijzing naar een ander onderdeel van de wet zelf
      waarin de verwijzing is opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.33
  - number: 3.33.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een algemene maatregel van bestuur of een ministeriële
      regeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.33
  - number: '3.34'
    text: |-
      Verwijzing naar een artikel uit het Burgerlijk Wetboek geschiedt overeenkomstig het volgende voorbeeld: *artikel
      162 van Boek 6 van het Burgerlijk Wetboek.*
          **Toelichting**
          In toelichtingen e.d. kan ook een kortere aanduiding worden gebruikt: [artikel 6:162 BW][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel162
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.34
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '162'
  - number: '3.35'
    text: |-
      De uitdrukkingen ‘*onverminderd artikel ...*’ en ‘*in afwijking van artikel ...*’ worden alleen gebruikt, indien
      dit noodzakelijk is om de onderlinge verhouding tussen de ene en de andere bepaling duidelijk te maken.
          **Toelichting**
          De term ‘onverminderd’ houdt in dat het genoemde artikel in het omschreven geval onverkort van toepassing is.
      Daarbij kan het zowel gaan om de onderlinge verhouding van bepalingen binnen één wet als om die van bepalingen
      in verschillende wetten. Dit geldt ook voor de term ‘in afwijking van’, die onder andere moet worden gebruikt
      als in een bijzondere wet wordt afgeweken van een algemene wet (overigens slechts bij hoge uitzondering: zie
      [aanwijzing 2.46][ref1]), tenzij de algemene wet uitdrukkelijk de mogelijkheid tot afwijken opent door middel van
      een zinsnede als ‘tenzij bij wettelijk voorschrift anders is bepaald’.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.35
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.8'
  - number: '3.36'
    text: |-
      Bij aanhaling van een regeling met de citeertitel wordt het Staatsblad of de Staatscourant waarin zij is geplaatst,
      niet vermeld.
          **Toelichting**
          Een regeling die een citeertitel heeft, wordt daardoor afdoende geïdentificeerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.36
  - number: '3.37'
    text: |-
      Een regeling zonder citeertitel wordt aangehaald door vermelding van het opschrift van die regeling, gevolgd door
      (Stb. [jaartal, volgnummer]) respectievelijk (Stcrt. [jaartal, volgnummer]).
          **Toelichting**
          Deze aanwijzing ziet op verwijzingen in het lichaam van een regeling. Zie voor het opschrift van een regeling
      [aanwijzing 4.2][ref1], en voor verwijzingen in het opschrift van een regeling [aanwijzing 4.3][ref2].
          **Voorbeelden**
          Wet van 10 juni 2020 tot wijziging van de [Elektriciteitswet 1998][ref3] en
      [Gaswet ][ref4](__REF004___________________________________________________________________________________________
      ____________) (Stb. 2020, 236)
      Regeling van de Staatssecretaris van Economische Zaken en Klimaat van 29 juni 2022 tot wijziging van de
      [Regeling waardevermeerdering woningen gaswinning Groningenveld][ref6] in verband met de verlenging van de regeling
      (Stcrt. 2022, 17545).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0009755
      [ref4]: https://wetten.overheid.nl/BWBR0011440
      [ref5]: https://wetten.overheid.nl/BWBR0043813
      [ref6]: https://wetten.overheid.nl/BWBR0039336
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.37
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0009755
      - id: ref4
        bwb_id: BWBR0011440
      - id: ref5
        bwb_id: BWBR0043813
      - id: ref6
        bwb_id: BWBR0039336
  - number: 3.38.1
    text: |-
      Een verdrag wordt aangehaald overeenkomstig het volgende voorbeeld: *het op 20 juni 1956 te New York tot stand
      gekomen Verdrag inzake verhaal in het buitenland van uitkeringen tot onderhoud (* *Trb. 1957, 121* *).*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.38
  - number: 3.38.2
    text: |-
      Bij verdragen met een citeertitel of daarmee vergelijkbare aanduiding kunnen datum en plaats van totstandkoming en
      het nummer van het Tractatenblad worden weggelaten.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.38
  - number: '3.39'
    text: |-
      Verkorte verwijzing in de toelichting bij een regeling naar artikelen van het Verdrag betreffende de Europese Unie,
      het Verdrag betreffende de werking van de Europese Unie, het Verdrag tot oprichting van de Europese Gemeenschap
      voor Atoomenergie, het Europees Verdrag tot bescherming van de rechten van de mens en de fundamentele vrijheden en
      het Internationaal verdrag inzake burgerrechten en politieke rechten geschiedt respectievelijk overeenkomstig de
      volgende voorbeelden:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.39
  - number: 3.39.−
    text: '*artikel 6 VEU;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.39
  - number: 3.39.−
    text: '*artikel 18 VWEU;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.39
  - number: 3.39.−
    text: '*artikel 150 VEGA;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.39
  - number: 3.39.−
    text: '*artikel 6 EVRM;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.39
  - number: 3.39.−
    text: '*artikel 17 IVBPR.*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.39
  - number: '3.40'
    text: |-
      In regelingen worden de instellingen, verdragen, regelgeving en de lidstaten van de Europese Unie, dan wel de
      Europese Gemeenschap voor Atoomenergie, alsmede hun grondgebied als volgt aangeduid:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*het Europees Parlement;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*de Europese Raad;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*de Raad van de Europese Unie;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*de Europese Commissie;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*het Hof van Justitie van de Europese Unie;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*de Europese Centrale Bank;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*de Europese Rekenkamer;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*het Verdrag betreffende de werking van de Europese Unie;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*het Verdrag betreffende de Europese Unie;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*het Verdrag tot oprichting van de Europese Gemeenschap voor Atoomenergie;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*EU-verordeningen, EU-richtlijnen, EU-besluiten;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*bindende EU-rechtshandelingen, EU-rechtshandelingen, EU-regelgeving;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*Euratom-verordeningen, Euratom-richtlijnen, Euratom-besluiten;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*lidstaten van de Europese Unie;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: 3.40.−
    text: '*gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is.*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.40
  - number: '3.41'
    text: |-
      Indien bindende EU-rechtshandelingen tevens gelden voor de Europese Economische Ruimte of Zwitserland, worden de
      betrokken staten, respectievelijk hun grondgebied, aangeduid als:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.41
  - number: 3.41.−
    text: |-
      *de lidstaten van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte;*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.41
  - number: 3.41.−
    text: '*de gebieden waarop de Overeenkomst betreffende de Europese Economische Ruimte van toepassing is;*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.41
  - number: 3.41.−
    text: '*Zwitserland.*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.41
  - number: 3.42.1
    text: |-
      Bij het aanhalen van bindende EU-rechtshandelingen wordt de titel gebruikt die daaraan in het Publicatieblad van de
      Europese Unie is gegeven.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.42
  - number: 3.42.2
    text: |-
      Indien vermelding van de vindplaats in het Publicatieblad van de Europese Unie wenselijk wordt geacht, geschiedt
      dat op de wijze zoals in [aanwijzing 3.46][ref1] beschreven.


