  - number: '2.25'
    text: |-
      Delegatie van regelgevende bevoegdheid aan een minister geschiedt, indien mogelijk, rechtstreeks in de wet.


          **Toelichting**
          Indien bij het formuleren van een wet reeds vaststaat dat bepaalde voorschriften bij ministeriële regeling
      moeten worden gegeven, dient, indien dit wetgevingstechnisch niet tot problemen leidt, het stellen van die regels
      in de wet rechtstreeks aan de betrokken minister te worden gedelegeerd. Er wordt dan niet gekozen voor delegatie
      aan de regering, die op haar beurt dan weer aan de minister delegeert. Daarvoor is bijvoorbeeld reden als ten
      tijde van het formuleren van de wet wel voorzienbaar is dat er onderwerpen zullen zijn die voor opneming in een
      ministeriële regeling in aanmerking komen (volgens de criteria van [aanwijzing 2.24][ref1]), maar nog onvoldoende
      duidelijk is in welke mate de meer wezenlijke aspecten van die onderwerpen in een algemene maatregel van bestuur
      een plaats behoren te krijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.25
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '2.26'
    text: |-
      1 Voor delegatie van regelgevende bevoegdheid aan de regering wordt de formulering ‘*bij algemene maatregel van
      [rijks]bestuur*’ gebruikt.

      2 Om subdelegatie door de regering mogelijk te maken wordt de formulering ‘*bij of krachtens algemene maatregel van
      [rijks]bestuur*’ gebruikt.


          **Toelichting**
          Door de formulering ‘bij algemene maatregel van bestuur’ wordt subdelegatie van regelgevende bevoegdheid door
      de regering uitgesloten (zie HR 25 januari 1926, NJ 1926, 246, en HR 26 november 1957, NJ 1958, 53). Niettemin
      is in de jurisprudentie wel geaccepteerd dat, indien deze formulering wordt gehanteerd, in de betrokken algemene
      maatregel van bestuur aan een minister wordt overgelaten een regeling vast te stellen ter uitwerking van in
      de maatregel genoemde detailpunten ten behoeve van de toepassing van de bij de maatregel getroffen regeling in
      de praktijk (HR 8 mei 1953, NJ 1953, 614, en HR 11 januari 1977, ECLI:NL:HR:1977:AC1784). Dit wordt dan niet
      beschouwd als subdelegatie van regelgevende bevoegdheid, maar als het aan een minister overlaten van uitvoering
      van de bij algemene maatregel van bestuur getroffen regeling. Het verdient evenwel aanbeveling niet van deze
      mogelijkheid uit te gaan, maar altijd de formulering ‘bij of krachtens’ te gebruiken indien het wenselijk is ook
      subdelegatie mogelijk te maken. In oude wetgeving kan het nog voorkomen dat niet de formulering ‘bij of krachtens’
      is gebruikt, terwijl het niet de bedoeling was subdelegatie uit te sluiten. In een dergelijk geval kan soms uit de
      wetsgeschiedenis of de jurisprudentie worden afgeleid dat subdelegatie geoorloofd is.
          In de [Grondwet][ref1] wordt de bevoegdheid tot delegatie van regelgevende bevoegdheid door de wetgever,
      behalve door de formulering ‘bij of krachtens’, ook tot uitdrukking gebracht door het gebruik van enigerlei vorm
      van het werkwoord regelen’ dan wel van de zelfstandige naamwoorden ‘regels’ of ‘regeling’. Een dergelijk gebruik
      van deze termen is evenwel beperkt tot de [Grondwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0001840
  - number: '2.27'
    text: |-
      Ten aanzien van de voordracht en ondertekening van een algemene maatregel van bestuur worden in de delegerende wet
      geen voorschriften gegeven. Indien wenselijk kunnen afspraken daarover worden vermeld in de toelichting.


          **Toelichting**
          In het algemeen blijkt uit de te regelen materie welke bewindspersoon of bewindspersonen een algemene maatregel
      van bestuur moeten ondertekenen. De bewindspersoon of bewindspersonen die een algemene maatregel van bestuur
      ondertekenen, moeten er voor zorgen dat andere bewindspersonen aan wier werkterrein de regeling raakt, bij de
      voorbereiding daarvan worden betrokken, los van de vraag of de algemene maatregel van bestuur het beleid van die
      andere bewindspersonen ondersteunt of niet. Die afstemming is voor algemene maatregelen van bestuur uiteindelijk
      gewaarborgd door de behandeling van de ontwerpen daarvan in de ministerraad.
          Het is niet nodig, en daarom ook ongewenst, wettelijk te regelen dat een voordracht voor een algemene maatregel
      van bestuur gedaan wordt in overeenstemming met of mede namens een of meer andere ministers, dan wel door twee of
      meer ministers. Ook indien de wet een voordracht door twee of meer ministers voorschrijft, verdient een voordracht
      ‘mede namens’ overigens de voorkeur (zie [aanwijzing 4.7][ref1]). Bij het ontwerpen van de delegerende wet kunnen
      over een eventuele gezamenlijke voordracht afspraken worden gemaakt, die worden vermeld in de toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.27
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '2.28'
    text: |-
      1 Voor delegatie van regelgevende bevoegdheid aan een minister wordt de formulering ‘*bij ministeriële regeling*’
      of ‘*bij regeling van Onze Minister*’ gebruikt.

      2 Indien uit de delegerende regeling niet reeds voortvloeit welke minister bevoegd is, of indien een afwijkende
      bevoegdheidstoedeling is beoogd, wordt de formulering ‘*bij regeling van Onze Minister van/voor ...*’ gebruikt.

      3 Indien het wenselijk is te bepalen dat een ministeriële regeling onder verantwoordelijkheid van meer dan een
      bewindspersoon wordt vastgesteld, wordt daarvoor de formulering ‘*bij regeling van Onze Minister van/voor...,
      handelende in overeenstemming met Onze Minister van/voor ...*’ gebruikt, tenzij ‘*Onze Minister*’ in de delegerende
      regeling reeds is gedefinieerd als: ‘*Onze Minister van/voor..., handelende in overeenstemming met Onze Minister
      van/voor ...*’.


          **Toelichting**
          Ook een door een staatssecretaris vastgestelde regeling wordt aangeduid als ministeriële regeling. Zie
      [aanwijzing 3.26][ref1].
          **Tweede lid.**Ook voor een ministeriële regeling geldt dat in het algemeen uit de te regelen materie of uit
      de (ondertekening van de) delegerende regeling blijkt welke bewindspersoon bevoegd is. Indien daarover echter
      onduidelijkheid kan bestaan of indien een afwijkende bevoegdheidstoedeling is beoogd, dient in de delegerende
      regeling de formulering ‘bij regeling van Onze Minister van/voor ...’ te worden gebruikt. Aangezien bij
      ministeriële regelingen, anders dan bij wetten en algemene maatregelen van bestuur, de ondertekening door de
      bewindspersoon of bewindspersonen de vaststelling van de regeling inhoudt, kan in laatstbedoeld geval de regeling
      slechts worden ondertekend door degene aan wie de regelgevende bevoegdheid is gedelegeerd.
          **Derde lid.**Het vaststellen van een ministeriële regeling door één bewindspersoon in overeenstemming
      met een of meer andere bewindspersonen, heeft tot gevolg dat de regeling alleen kan worden vastgesteld indien
      tussen de betrokken bewindspersonen overeenstemming bestaat en dat de regeling uitsluitend door de eerstgenoemde
      bewindspersoon wordt ondertekend (zie [aanwijzing 4.33][ref2]).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: '2.29'
    text: |-
      Bij delegatie van regelgevende bevoegdheid wordt over ‘regels stellen’ gesproken, indien in de delegerende regeling
      over het betrokken onderwerp nog niets is geregeld. In andere gevallen wordt over ‘*nadere regels stellen*’
      gesproken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.29
  - number: '2.30'
    text: |-
      In een regeling wordt, behoudens in bijzondere omstandigheden, niet voorzien in mandaatverlening van regelgevende
      bevoegdheid.


          **Toelichting**
          De figuur van mandaat tot het vaststellen van algemeen verbindende voorschriften aan bijvoorbeeld
      een secretaris-generaal of directeur-generaal is over het algemeen onwenselijk en onnodig. Het is
      van belang dat de politiek verantwoordelijke bewindspersoon zelf de regeling vaststelt. Zie ook
      [artikel 10:3, tweede lid, Awb][ref1].
          Zie voor voorbeelden van mandaatverlening in bijzondere omstandigheden:
      [artikel 31a van de Gezondheids- en welzijnswet][ref2] voor dieren en [artikel 5.2 van de Wet dieren][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel31a
      [ref3]: https://wetten.overheid.nl/BWBR0030250#Artikel5.2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:3
      - id: ref2
        bwb_id: BWBR0005662
        artikel: 31a
      - id: ref3
        bwb_id: BWBR0030250
        artikel: '5.2'
  - number: '2.31'
    text: |-
      1 In een hogere regeling wordt niet toegestaan dat daarvan bij lagere regeling wordt afgeweken.

      2 Het eerste lid is niet van toepassing indien het wenselijk is in de hogere regeling de mogelijkheid te creëren
      voor:

      a. afwijkende regelingen die bij wijze van experiment worden ingevoerd;

      b. afwijkende regelingen ten behoeve van noodsituaties.


          **Toelichting**
          Een lagere regelgever heeft niet de bevoegdheid om van een regeling van een hogere regelgever af te wijken,
      tenzij de hogere regelgever de lagere regelgever daartoe bevoegd verklaart. Met de term afwijken wordt gedoeld
      op de situatie dat de lagere regelgeving bepalingen bevat die niet slechts uitwerking of invulling inhouden van
      formeelwettelijke bepalingen, maar daarmee als het ware ‘strijdig’ zijn. Ook al is een dergelijke constructie
      strikt genomen geoorloofd, zij leidt tot onoverzichtelijke regelgeving en dient derhalve in beginsel niet te worden
      toegepast.
          Afwijkende voorschriften die bij wijze van experiment worden ingevoerd, dienen een tijdelijk karakter te hebben
      en ook overigens aan bepaalde voorwaarden te voldoen. Zie hiervoor de [aanwijzingen 2.41][ref1] en [2.42][ref2]
      en [paragraaf 5.16][ref3].
          Bij noodsituaties kan worden gedacht aan het toekennen van ruime, van de wet afwijkende bevoegdheden voor
      bestuursorganen in geval van rampen, oorlogssituaties of anderszins bedreiging van de veiligheid. Voorbeeld:
      [artikel 35 van de Noodwet financieel verkeer][ref4].
          Ook [artikel 103 van de Grondwet][ref5] bevat een regeling voor een uitzonderingstoestand. Deze aanwijzing ziet
      niet op de situatie zoals beschreven in dat artikel.
          Ook bij het implementeren van internationale en EU-regelgeving dient afwijking van een hogere regeling bij
      lagere regeling achterwege te blijven. Daar doet zich het probleem van overzichtelijkheid en kenbaarheid van de
      regelgeving extra gevoelen. De mogelijkheden voor delegatie die ten behoeve van implementatie van internationale
      en EU-regelgeving bestaan, bieden afdoende mogelijkheden om tijdige implementatie te verzekeren. Zie het nadere
      kabinetsstandpunt inzake versnelde implementatie van EU-regelgeving (Kamerstukken I 2004/05, 29200 VI, F (2e
      herdruk)) en de [aanwijzingen 2.24][ref6] en [9.13][ref7].
          Van de hier bedoelde gevallen dient overigens te worden onderscheiden dat wordt toegestaan dat bij lagere
      regeling uitzonderingen op een voorschrift in een hogere regeling worden gemaakt onder het stellen van voorwaarden
      of eisen en onder aanwijzing van een bepaalde groep of situatie of een tijdsperiode. Dit betreft in het bijzonder
      de figuur van de vrijstelling of ontheffing. Een dergelijke opzet is zeker aanvaardbaar en soms zelfs de meest voor
      de hand liggende.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
