  - number: '4.50'
    text: |-
      1 Verwijzing naar artikelen of onderdelen van regelingen die in de toelichting met een afkorting of andere verkorte
      aanduiding worden aangehaald, geschiedt overeenkomstig de volgende voorbeelden:

        - *artikel 10, tweede lid, Wob;*
        - *artikel 7, tweede lid, Sr;*
        - *titel 5.2 Awb;*
        - *artikel 21 Arbowet.*

      2 Indien in de toelichting gebruik wordt gemaakt van een afkorting of verkorte aanduiding voor het aanhalen van een
      regeling, wordt daarbij bij voorkeur het hoofdlettergebruik in de citeertitel van de aangehaalde regeling gevolgd.


          **Toelichting**
          **Eerste lid.**Indien in een toelichting andere regelingen verkort worden aangehaald (bijvoorbeeld ‘Awb’
      ter aanduiding van de [Algemene wet bestuursrecht][ref1]) is het niet nodig om bij verwijzing naar specifieke
      artikelen uit die regelingen de woorden ‘van de’ of ‘van het’ te gebruiken. In plaats van ‘artikel 10 van de Wob’
      kan worden volstaan met ‘artikel 10 Wob’. Dit geldt niet voor regelingen die met hun volledige citeertitel worden
      aangehaald. In dat geval wordt de citeertitel, ook als die slechts één woord telt, steeds door ‘van de’ of ‘van
      het’ voorafgegaan (‘[artikel 5 van de Bekendmakingswet][ref2]’).
          Afkortingen en verkorte aanduidingen die algemeen bekend zijn (zoals [Awb][ref3] en BW) hoeven in de
      toelichting niet te worden verklaard. Andere afkortingen en aanduidingen dienen de eerste keer dat zij in een
      toelichting worden gebruikt, te worden verklaard.
          Zie ook de [aanwijzingen 3.34][ref4] (verwijzingen naar het BW) en [3.39][ref5] (verkorte aanhaling verdragen).
          **Tweede lid.**In een afkorting of andere verkorte aanduiding van een regeling worden in beginsel alleen
      hoofdletters gebruikt indien die hoofdletters ook in de citeertitel van de regeling voorkomen. In bijzondere
      gevallen kan van dit beginsel worden afgeweken, bijvoorbeeld bij verkorte aanduidingen waarin het woord ‘wet’ wordt
      gevolgd door een afkorting (vgl. ‘Wet IB 2001’ voor ‘Wet inkomstenbelasting 2001’).

          Wet Nationale ombudsman: WNo
      Arbeidsomstandighedenwet: Arbowet
      Wet op het financieel toezicht: Wft.


