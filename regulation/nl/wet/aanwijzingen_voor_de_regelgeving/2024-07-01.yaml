  - number: 7.21.1
    text: |-
      Een memorie van antwoord op een voorlopig verslag van de Eerste Kamer wordt uiterlijk veertien dagen vóór de
      beoogde datum van openbare behandeling van het desbetreffende wetsvoorstel bij de Eerste Kamer ingediend.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.21
  - number: 7.21.2
    text: In spoedeisende gevallen kan van deze termijn in overleg met de griffie van de Eerste Kamer worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.21
  - number: 7.22.1
    text: |-
      Intrekking van een bij de Tweede of de Eerste Kamer aanhangig wetsvoorstel geschiedt bij brief van de betrokken
      bewindspersoon, daartoe gemachtigd door de Koning.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.22
  - number: 7.22.2
    text: |-
      Is het wetsvoorstel aanhangig bij de Eerste Kamer, dan wordt ook aan de voorzitter van de Tweede Kamer mededeling
      gedaan van de intrekking.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.22
  - number: '7.23'
    text: |-
      Leden van de Tweede Kamer die een initiatiefvoorstel van wet aanhangig willen maken, kunnen de betrokken
      bewindspersoon bijstand verzoeken bij het formuleren daarvan. Deze bijstand wordt zoveel mogelijk verleend.
          **Toelichting**
          Het gaat hier, evenals bij amendementen ([aanwijzing 7.20][ref1]), om juridische en wetgevingstechnische
      bijstand. Daarnaast kan het gaan om het verstrekken van feitelijke informatie ten behoeve van het door de indiener
      op te stellen algemeen deel van de memorie van toelichting, om het formuleren van passages voor de artikelsgewijze
      toelichting, of om het (door de directie FEZ) doorrekenen van de financiële gevolgen van het voorstel. Verder
      kan het omvatten de verrichting door het departement van procedurele handelingen waartoe het voorstel aanleiding
      zou geven, zoals notificatie bij de Europese Commissie (zie aanwijzing 9.19) of het verrichten van een specifiek
      voorgeschreven evenredigheidsbeoordeling en toepassing van publieke consultatie (zie de toelichting bij aanwijzing
      2.15).
          Voor het verlenen van bijstand bij het formuleren van een initiatiefvoorstel behoeft een ambtenaar toestemming
      van zijn bewindspersoon. Zie ook Kamerstukken II 2004/05, 30095, nr. 5.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '7.24'
    text: |-
      1 Bewindspersonen geven zowel bij de schriftelijke als bij de mondelinge behandeling van een initiatiefvoorstel
      alle inlichtingen en adviezen die van hen worden gevraagd en waarvan het verstrekken niet in strijd is met het
      belang van de staat. Bij de mondelinge behandeling zijn de bewindspersonen steeds aanwezig.

      2 Bewindspersonen maken ook eigener beweging, zowel in de schriftelijke als in de mondelinge fase, alle opmerkingen
      die zij dienstig achten om te komen tot een goed wetgevingsproduct.

      3 Ook tijdens de parlementaire behandeling van een initiatiefvoorstel wordt desgewenst aan de initiatiefnemers
      zoveel mogelijk en zo snel mogelijk ambtelijke bijstand van juridische en wetgevingstechnische aard verleend.

      **Tweede lid.** De bewindspersoon maakt in ieder geval eigener beweging opmerkingen, indien de bewindspersoon
      meent dat het initiatiefvoorstel op een of meer punten onverenigbaar is met materiële of procedurele verplichtingen
      die voortvloeien uit hoger recht. De bewindspersoon zet in het kader van diens inbreng uiteen dat en in welke
      zin het voorstel onverenigbaar is met hoger recht, en wat dit volgens de bewindspersoon betekent voor het
      initiatiefvoorstel.

      Dit betekent bijvoorbeeld dat indien nog niet de ingevolge [richtlijn (EU) 2018/958](32018L0958) verplichte
      evenredigheidsbeoordeling door het betrokken lid van de Tweede Kamer heeft plaatsgevonden ten aanzien van een
      initiatiefvoorstel dat een beperking van de toegang tot of de uitoefening van een gereglementeerd beroep omvat, de
      bewindspersoon deze onverenigbaarheid met die richtlijn vermeldt in diens inbreng. Zie ook [aanwijzing 2.15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '7.25'
    text: |-
      Bewindspersonen dragen er zorg voor dat zij in voorkomende gevallen over initiatiefvoorstellen kunnen spreken
      namens het kabinet. Daartoe stellen zij deze tijdig in de ministerraad aan de orde.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.25
  - number: '7.26'
    text: |-
      Zo spoedig mogelijk, maar niet later dan drie maanden na aanneming van een initiatiefvoorstel door de Eerste Kamer
      doet de betrokken bewindspersoon mededeling aan de Staten-Generaal omtrent de besluitvorming over het al dan niet
      bekrachtigen van het voorstel, of, indien een besluit nog niet is genomen, van de stand van zaken daaromtrent en
      van het tijdstip waarop nieuwe mededelingen als vorenbedoeld zullen worden gedaan.

      Bij deze aanwijzing is ook van belang dat indien niet-bekrachtiging wordt overwogen, advies aan de Afdeling
      advisering van de Raad van State dient te worden gevraagd, hetgeen consequenties heeft voor de procedure en de
      termijn daarvan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.26
  - number: 8.1.1
    text: |-
      Onder verdrag wordt verstaan: iedere op schrift gestelde overeenkomst die volgens volkenrechtelijke criteria voor
      de staat verbindend is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.1
  - number: 8.1.2
    text: |-
      In de Nederlandse titel van een verdrag wordt bij voorkeur de grondwettelijke term ‘verdrag’ gebruikt en niet de
      term ‘overeenkomst’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.1
  - number: 8.1.3
    text: In verdragen wordt het Koninkrijk der Nederlanden als zodanig aangeduid als partij bij het verdrag.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.1
  - number: 8.1.4
    text: |-
      Bij de onderhandelingen over ontwerpverdragen wordt er naar gestreefd de staat – en derhalve niet de regering – als
      verdragspartij aan te duiden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.1
  - number: 8.2.1
    text: |-
      De regeringen van Aruba, Curaçao en Sint Maarten worden in een zo vroeg mogelijk stadium betrokken bij de
      totstandbrenging van verdragen die voor de landen mede kunnen gelden of deze landen anderszins kunnen raken en bij
      de ter zake te volgen procedures.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.2
  - number: 8.2.2
    text: |-
      De afdeling Verdragen van de Directie Juridische Zaken van het Ministerie van Buitenlandse Zaken onderhoudt de
      contacten hierover met de Gevolmachtigde Ministers van Aruba, Curaçao en Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.2
  - number: 8.3.1
    text: |-
      Over de voorbereiding van verdragen wordt in een zo vroeg mogelijk stadium contact gezocht met de afdeling
      Internationaal Recht en de afdeling Verdragen van de Directie Juridische Zaken van het Ministerie van Buitenlandse
      Zaken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.3
  - number: 8.3.2
    text: |-
      Over de goedkeuring van verdragen, over het tot uitdrukking brengen van instemming door een verdrag gebonden
      te worden en over het voornemen een verdrag op te zeggen of al dan niet te verlengen, wordt met het oog op de
      coördinatie ter verzekering van een consistent verdragsbeleid in een zo vroeg mogelijk stadium contact gezocht met
      de afdeling Verdragen van de Directie Juridische Zaken van het Ministerie van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.3
  - number: 8.3.3
    text: |-
      In gevallen dat het initiatief met betrekking tot verdragen bij het Ministerie van Buitenlandse Zaken ligt, zoekt
      de afdeling Verdragen van de Directie Juridische Zaken op haar beurt in een zo vroeg mogelijk stadium daarover
      contact met eventuele andere betrokken ministeries.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.3
  - number: 8.3.4
    text: |-
      Over de voorbereiding en goedkeuring van verdragen, over het tot uitdrukking brengen van instemming door een
      verdrag gebonden te worden en over het voornemen een verdrag op te zeggen of al dan niet te verlengen, wordt
      eveneens contact gezocht met de onderdelen van andere ministeries die bemoeienis hebben met het onderwerp waarop
      het verdrag of een onderdeel daarvan betrekking heeft of met onderwerpen die door het verdrag worden geraakt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.3
  - number: 8.4.1
    text: |-
      Bij de voorbereiding van en de onderhandelingen over een verdrag wordt tijdig en zorgvuldig aandacht besteed aan de
      gevolgen voor de nationale wet- en regelgeving.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.4
  - number: 8.4.2
    text: |-
      Zij die deelnemen aan de voorbereiding van of de onderhandelingen over een verdrag dragen er zorg voor dat de
      wetgevingsafdelingen van de betrokken ministeries daarbij in een zo vroeg mogelijk stadium worden ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.4
  - number: 8.4.3
    text: |-
      De onderhandelingsdelegaties nemen in hun verslag datgene op wat van belang is voor de implementatie en voor de
      parlementaire goedkeuring.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.4
  - number: '8.5'
    text: |-
      De opstelling van de authentieke Nederlandse tekst van een verdrag of van de Nederlandse vertaling geschiedt door
      of onder verantwoordelijkheid van de afdeling Verdragen van de Directie Juridische Zaken van het Ministerie van
      Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.5
  - number: 8.6.1
    text: |-
      Regeringsvertegenwoordigers die zitting hebben in een orgaan van een volkenrechtelijke organisatie dat besluiten
      neemt die de lidstaten van die organisatie binden, dragen er zorg voor dat, indien besluiten in voorbereiding zijn
      die het regeringsbeleid betreffen of anderszins van groot belang zijn, de ontwerpen voor deze besluiten voorwerp
      van overleg vormen tussen de betrokken ministeries en in de ministerraad aan de orde worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.6
  - number: 8.6.2
    text: |-
      Indien het om bindende besluiten gaat wordt ook de afdeling Verdragen van de Directie Juridische Zaken van het
      Ministerie van Buitenlandse Zaken in het voorbereidende stadium betrokken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.6
  - number: 8.7.1
    text: |-
      Bij de voorbereiding van besluiten van volkenrechtelijke organisaties wordt aandacht besteed aan de gevolgen voor
      de nationale wetgeving.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.7
  - number: 8.7.2
    text: |-
      Wanneer een het Koninkrijk bindend besluit van een volkenrechtelijke organisatie tot stand is gekomen dat voor zijn
      uitvoering wettelijke voorschriften vereist, worden deze zo spoedig mogelijk en binnen de eventueel voorgeschreven
      termijn tot stand gebracht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.7
  - number: 8.7.3
    text: |-
      Indien het besluit bepalingen bevat die een ieder kunnen verbinden en niet verenigbaar zijn met geldende
      wettelijke voorschriften, worden onverwijld maatregelen getroffen tot aanpassing van de desbetreffende wettelijke
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.7
  - number: 8.8.1
    text: |-
      Indien een verdrag een verwijzing bevat naar een instantie die voor het Koninkrijk bindende besluiten kan nemen
      en die instantie niet kan worden aangemerkt als orgaan van een volkenrechtelijke organisatie in de zin van de
      [artikelen 92][ref1], [93][ref2] en [94 van de Grondwet][ref3], wordt het verdrag goedgekeurd bij wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel94
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '92'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '93'
      - id: ref3
        bwb_id: BWBR0001840
        artikel: '94'
  - number: 8.8.2
    text: |-
      In het wetsvoorstel tot goedkeuring van het verdrag wordt in dat geval een machtigingsbepaling opgenomen,
      inhoudende dat de besluiten die door deze instantie worden genomen, geen goedkeuring van de Staten-Generaal
      behoeven.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.8
  - number: 8.9.1
    text: |-
      Bij de voorbereiding van de parlementaire goedkeuring van een verdrag wordt onderzocht in hoeverre de naleving door
      het Koninkrijk wettelijke voorschriften vereist.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.9
  - number: 8.9.2
    text: |-
      Bij de voorbereiding van de parlementaire goedkeuring van een verdrag wordt eveneens onderzocht of het verdrag
      mogelijk een ieder verbindende bepalingen bevat als bedoeld in [artikel 93 Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel93
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '93'
  - number: 8.9.3
    text: |-
      Indien tot stand te brengen voorschriften bij wet moeten worden vastgesteld, wordt het desbetreffende wetsvoorstel
      in beginsel gelijktijdig met het wetsvoorstel tot goedkeuring van het verdrag bij de Tweede Kamer ingediend.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.9
  - number: 8.10.1
    text: |-
      De uitdrukkelijke goedkeuring van verdragen die krachtens een territorialiteitsbepaling of naar hun aard binnen het
      Koninkrijk alleen voor Nederland gelden, geschiedt niet bij rijkswet, maar bij wet.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.10
  - number: 8.10.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de goedkeuring van verdragen waarbij medegelding voor Aruba,
      Curaçao of Sint Maarten weliswaar mogelijk is, maar waarbij reeds bij de indiening van het goedkeuringswetsvoorstel
      definitief is vastgesteld dat het verdrag niet mede voor Aruba, Curaçao of Sint Maarten zal gaan gelden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.10
  - number: '8.11'
    text: |-
      Indien in een wet de uitvoering van verdragen en besluiten van volkenrechtelijke organisaties wordt gedelegeerd
      naar een lagere regeling, wordt voor de delegatiebepaling het volgende model als uitgangspunt genomen: *[Bij of
      krachtens algemene maatregel van bestuur / Bij ministeriële regeling] worden regels gesteld ter uitvoering van
      verplichtingen die voortvloeien uit verdragen of uit bindende besluiten van volkenrechtelijke organisaties.*
          **Toelichting**
          Wanneer daarvoor gronden aanwezig zijn, kan van de standaard worden afgeweken en voor een ruimere verwijzing
      gekozen worden. Zo kan het nodig zijn om ter uitvoering van ‘aanbevelingen’ en ‘internationale beleidsafspraken’
      niet juridisch bindende regels vast te stellen. Zie ook de [aanwijzingen 2.21][ref1], [2.22][ref2], [2.23][ref3]
      en [9.8][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref4
        bwb_id: BWBR0005730
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: 8.12.1
    text: |-
      Voor een voorstel van (rijks)wet tot goedkeuring van een verdrag wordt het volgende model gevolgd: *Goedkeuring
      van het op ... te ... tot stand gekomen verdrag ... [zie aanwijzing 3.38]* *Wij Willem-Alexander, [zie verder
      aanwijzing 4.5]* *(...)* *Alzo Wij in overweging genomen hebben, dat het op ... te ... tot stand gekomen
      verdrag ... ingevolge artikel 91, eerste lid, van de Grondwet de goedkeuring van de Staten-Generaal behoeft,
      alvorens het Koninkrijk daaraan kan worden gebonden;* *Zo is het, dat Wij, de Afdeling advisering van de Raad van
      State [van het Koninkrijk] gehoord, en met gemeen overleg der Staten-Generaal, [de bepalingen van het Statuut voor
      het Koninkrijk in acht genomen zijnde,] hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij
      deze:* *Artikel 1* *Het op ... te ... tot stand gekomen verdrag ... , waarvan de ... tekst [en de vertaling in het
      Nederlands] [is/zijn] geplaatst in Tractatenblad [jaartal], nr. [ nummer] , wordt goedgekeurd voor [Nederland / het
      Europese deel van Nederland / het Caribische deel van Nederland / voor Aruba / voor Curaçao / voor Sint Maarten /
      voor het gehele Koninkrijk].* *Artikel 2* *Deze [rijks]wet treedt in werking met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin zij wordt geplaatst.* *Lasten en bevelen ... [zie verder aanwijzing 4.31, eerste
      lid].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.12
  - number: 8.12.2
    text: |-
      Voor de goedkeuring van een voorbehoud bij een verdrag wordt het volgende model gebruikt: *Artikel (...)*
      *Goedgekeurd wordt dat bij de binding van het Koninkrijk aan het in artikel 1 genoemde verdrag voor [Nederland /
      het Europese deel van Nederland / het Caribische deel van Nederland / voor Aruba / voor Curaçao / voor Sint
      Maarten / voor het gehele Koninkrijk] het volgende voorbehoud wordt gemaakt: [tekst voorbehoud].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.12
  - number: 8.12.3
    text: |-
      Voor een machtigingsbepaling als bedoeld in [aanwijzing 8.8, tweede lid][ref1], wordt het volgende model gebruikt:
      *Artikel (...)* *De besluiten, bedoeld in [artikel / de artikelen ...] van het in artikel 1 genoemde verdrag,
      behoeven niet de goedkeuring van de Staten-Generaal.*


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.13.1
    text: Een wetsvoorstel tot goedkeuring van een verdrag wordt voorzien van een memorie van toelichting.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.13
  - number: 8.13.2
    text: Een voorstel tot stilzwijgende goedkeuring van een verdrag gaat vergezeld van een toelichtende nota.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.13
  - number: 8.13.3
    text: |-
      Toelichtingen op verdragen worden beperkt tot hetgeen voor een goed begrip nodig is. In voorkomend geval wordt
      daarin aangegeven dat wijziging van een bijlage die een integrerend onderdeel vormt van het verdrag en waarvan de
      inhoud van uitvoerende aard is ten opzichte van de bepalingen van het verdrag zelf, geen parlementaire goedkeuring
      behoeft, tenzij de Staten-Generaal zich het recht daartoe voorbehouden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.13
  - number: 8.13.4
    text: |-
      Indien een verdrag gevolgen heeft voor de nationale wet- en regelgeving, wordt dit in de toelichting besproken. Bij
      de binding van het Koninkrijk te maken voorbehouden en af te leggen verklaringen die geen voorbehouden inhouden,
      worden eveneens in de toelichting besproken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.13
  - number: 8.13.5
    text: |-
      In de toelichting op een verdrag wordt besproken of een verdrag naar de mening van de regering mogelijk een ieder
      verbindende bepalingen bevat.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.13
  - number: 8.13.6
    text: |-
      In de toelichting op een verdrag dat niet voor het Koninkrijk als geheel wordt gesloten, worden de redenen
      beschreven om aan dat verdrag wel of geen gelding of medegelding voor Bonaire, Sint Eustatius en Saba te verlenen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.13
  - number: 8.13.7
    text: |-
      In de toelichting op een verdrag dat niet voor het Koninkrijk als geheel wordt gesloten, wordt aangegeven of het
      verdrag wel of geen gelding of medegelding heeft voor Aruba, Curaçao en Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.13
  - number: 8.14.1
    text: |-
      Met betrekking tot verdragen worden in de (rijks)ministerraad gelijktijdig aan de orde gesteld de sluiting en de
      eventuele voorlopige toepassing van het verdrag, alsook de parlementaire goedkeuringsstukken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.14
  - number: 8.14.2
    text: |-
      Het eerste lid geldt niet indien het noodzakelijk wordt geacht dat eerst alleen de sluiting en de eventuele
      voorlopige toepassing van het verdrag aan de orde worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.14
  - number: 8.14.3
    text: |-
      Bij de beraadslaging over de sluiting van een verdrag of de goedkeuring ervan spreekt de (rijks)ministerraad
      zich erover uit of het verdrag Aruba, Curaçao en Sint Maarten al dan niet raakt in de zin van
      [artikel 2, derde lid, van de Rijkswet goedkeuring en bekendmaking verdragen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.14
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '2'
  - number: '8.15'
    text: |-
      Originele ondertekende exemplaren van bilaterale verdragen en gewaarmerkte afschriften van multilaterale verdragen
      dienen aan de afdeling Verdragen van de Directie Juridische Zaken te worden gezonden ter deponering in het archief
      der verdragen, dat door het Ministerie van Buitenlandse Zaken wordt beheerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.15
  - number: '8.16'
    text: |-
      Teksten van besluiten van volkenrechtelijke organisaties en verdragsrechtelijke gegevens worden met het oog op
      de bekendmaking toegezonden aan de afdeling Verdragen van de Directie Juridische Zaken van het Ministerie van
      Buitenlandse Zaken.
          **Toelichting**
          **Besluiten van volkenrechtelijke organisaties.**In ieder geval moeten worden bekendgemaakt besluiten:
          die hetzij rechtstreeks rechten en verplichtingen voor de burgers kunnen meebrengen, hetzij voor de overheid
      rechten of verplichtingen van voldoende betekenis tot gevolg hebben;
      die een verdrag, of bijlagen daarbij, wijzigen;
      die van het Koninkrijk of een van de landen daarvan aanvaarding vergen; of
      die aan de Staten-Generaal, de Staten van Aruba, de Staten van Curaçao of de Staten van Sint Maarten krachtens
      internationaal voorschrift dienen te worden voorgelegd (bijvoorbeeld aanbevelingen van de Internationale
      Arbeidsorganisatie).
          Ter zake van de bekend te maken besluiten wordt ook verwezen naar de
      [artikelen 16 tot en met 20 van de Rijkswet goedkeuring en bekendmaking verdragen][ref1]. In spoedeisende gevallen
      (de tekst dient immers in het Tractatenblad te zijn bekendgemaakt vóór de datum van inwerkingtreding of voorlopige
      toepassing) is het wenselijk tijdig met de afdeling Verdragen van de Directie Juridische Zaken contact op te nemen
      en eventueel alvast een ontwerptekst toe te zenden.
          Bij twijfel of een besluit in aanmerking komt voor bekendmaking in het Tractatenblad dient ook contact te
      worden opgenomen met de afdeling Verdragen van de Directie Juridische Zaken.
          Sommige besluiten van internationale organisaties zijn eigenlijk verdragen; zie de derde categorie van deze
      aanwijzing. De naam van het besluit doet voor deze beoordeling niet ter zake. Een voorbeeld is het Besluit van
      de Raad van 14 december 2020 betreffende het stelsel van eigen middelen van de Europese Unie (Trb. 2021, 5).
      De afdeling Verdragen van de Directie Juridische Zaken zal beoordelen of voor deze besluiten een parlementaire
      procedure doorlopen dient te worden.
          Bindende EU-rechtshandelingen worden niet in het Tractatenblad maar in het Publicatieblad van de Europese Unie
      gepubliceerd.
          **Verdragsrechtelijke gegevens**. Onder verdragsrechtelijke gegevens worden verstaan gegevens betreffende
      ondertekening, bekrachtiging, aanvaarding, goedkeuring, toetreding, opzegging, territoriale toepassing, verklaring
      van voortgezette gebondenheid, het maken van of het intrekken van voorbehouden, het afleggen, wijzigen of
      intrekken van verklaringen, het doen van in een verdrag voorziene mededelingen, voorlopige toepassing, in- en
      buitenwerkingtreding en verlenging.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel16
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.16
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '16'
  - number: '8.17'
    text: |-
      Wanneer een verdrag is ondertekend of anderszins tot stand komt, wordt zo nodig overleg gevoerd met de afdeling
      Verdragen van de Directie Juridische Zaken van het Ministerie van Buitenlandse Zaken over spoedige bekendmaking van
      de tekst in het Tractatenblad.
          **Toelichting**
          Alle verdragen (behalve vertrouwelijke en geheime) worden bekendgemaakt in het Tractatenblad en komen daardoor
      ter kennis van het parlement. Verdragen die geen goedkeuring behoeven, worden bovendien, zodra het Tractatenblad is
      verschenen, door de Minister van Buitenlandse Zaken nog speciaal ter kennis van het parlement gebracht. Verdragen
      die geen parlementaire goedkeuring behoeven, komen ook daardoor onder ogen van het parlement. In het geval er
      bij het parlement bijzondere belangstelling bestaat voor een bepaald verdrag, zal er zo spoedig mogelijk een
      Tractatenblad worden gepubliceerd. Ook verdragen met een vertrouwelijk of geheim karakter worden, tenzij het belang
      van het Koninkrijk zich daartegen verzet, ter kennis gebracht van het parlement op voorwaarde van geheimhouding.
          Verdragen van de Internationale Arbeidsorganisatie (IAO) worden niet ondertekend. Krachtens artikel 19, vijfde
      lid, van het IAO-Statuut moeten deze binnen een maximumtermijn aan het parlement worden voorgelegd, dat wil zeggen
      dat zij ter goedkeuring worden ingediend, of dat aan het parlement wordt medegedeeld dat en waarom het verdrag in
      kwestie niet of nog niet ter goedkeuring wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.17
  - number: 8.18.1
    text: |-
      Voorstellen tot goedkeuring van verdragen worden op voordracht van de Minister van Buitenlandse Zaken bij de
      Afdeling advisering van de Raad van State (van het Koninkrijk) aanhangig gemaakt, met het oog op advisering.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.18
  - number: 8.18.2
    text: |-
      In spoedgevallen kan een voorstel tot goedkeuring van een verdrag bij de Afdeling advisering aanhangig worden
      gemaakt, voordat het verdrag is ondertekend of anderszins tot stand is gekomen, mits de besluitvorming in de
      (rijks)ministerraad over de tekst van het verdrag, de toelichting daarop en de overige voor de goedkeuring door de
      Staten-Generaal noodzakelijke stukken en het gebruik van de spoedprocedure is afgerond.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.18
  - number: 8.18.3
    text: |-
      Na ontvangst van het advies wordt een nader rapport opgesteld, waarin op de eventuele opmerkingen van de Afdeling
      advisering wordt ingegaan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.18
  - number: '8.19'
    text: |-
      In geval van stilzwijgende goedkeuring van een verdrag wordt dit, na daartoe van de Koning verkregen machtiging,
      door de Minister van Buitenlandse Zaken overgelegd aan de beide Kamers van de Staten-Generaal en, indien het
      verdrag Aruba, Curaçao, Sint Maarten of al die landen raakt, gelijktijdig aan de Staten van de betrokken landen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.19
  - number: 8.20.1
    text: |-
      Voor overlegging van een verdrag aan de beide Kamers der Staten-Generaal ter stilzwijgende
      goedkeuring wordt een zodanig tijdstip gekozen dat ten minste tweederde van de in
      [artikel 5, eerste lid, van de Rijkswet goedkeuring en bekendmaking verdragen][ref1] bedoelde termijn buiten een
      reces van de Kamers valt.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.20
    references:
      - id: ref1
        bwb_id: BWBR0006799
        artikel: '5'
  - number: 8.20.2
    text: |-
      Voor overlegging aan de beide Kamers der Staten-Generaal van een verdrag, dat
      uitsluitend de uitvoering betreft van een goedgekeurd verdrag, zoals bedoeld in
      [artikel 7, onder b, van de Rijkswet goedkeuring en bekendmaking verdragen][ref1],
      wordt een zodanig tijdstip gekozen dat ten minste twee derde van de in
      [artikel 8, tweede lid, van de Rijkswet goedkeuring en bekendmaking verdragen][ref2] genoemde termijn buiten een
      reces van de Kamers valt.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006799#Artikel8
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.20
    references:
