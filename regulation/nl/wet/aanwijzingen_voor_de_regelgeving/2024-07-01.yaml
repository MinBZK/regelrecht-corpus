  - number: '5.57'
    text: |-
      1 Indien het wenselijk is kosten voor het in behandeling nemen van een aanvraag door te berekenen, wordt het
      volgende model als uitgangspunt genomen:

      1. *[Naam bestuursorgaan] brengt de kosten die samenhangen met het in behandeling nemen van de aanvraag en de
      afgifte van [de vergunning / de ontheffing / het diploma / de concessie etc.] en van de overige documenten die bij
      of krachtens deze wet worden afgegeven [, alsmede van duplicaten en gewaarmerkte afschriften van deze documenten],
      ten laste van de aanvrager van het document.*

      2. *De bedragen ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.*

      2 Indien het wenselijk is kosten voor het verrichten van werkzaamheden en diensten door te berekenen, wordt het
      volgende model als uitgangspunt genomen:

      1. *[Naam bestuursorgaan] brengt de kosten die samenhangen met het verrichten van werkzaamheden als bedoeld in
      artikel ... ten laste van degene ten behoeve van wie deze werkzaamheden worden verricht.*

      2. *De bedragen ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.*

      3 Indien het wenselijk is bedragen in de wet op te nemen en vervolgens via indexering aan te passen, wordt in
      plaats van een tweede lid dat voorziet in vaststelling van de bedragen bij ministeriële regeling het volgende model
      als uitgangspunt genomen:

      2. *De bedragen ter vergoeding van de kosten zijn als volgt: ...*

      3. *De bedragen kunnen bij ministeriële regeling worden gewijzigd voor zover de [naam index, bijvoorbeeld de
      consumentenprijsindex] daartoe aanleiding geeft.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.57
  - number: '5.58'
    text: |-
      Indien het wenselijk is te bepalen dat een wet wordt geëvalueerd, of dat over de uitvoering daarvan verslag wordt
      gedaan, wordt het volgende model als uitgangspunt genomen:

      *Onze Minister van/voor ... zendt [in overeenstemming met Onze Minister van/voor ...] binnen vijf jaar na de
      inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze
      wet in de praktijk [of nadere omlijning van aspecten of onderdelen van de wet].*


          **Toelichting**
          Voor onderzoek komen in aanmerking zowel de mate van verwerkelijking van de doelstellingen en de neveneffecten
      als de evenredigheid, subsidiariteit, uitvoerbaarheid, handhaafbaarheid, afstemming op andere regelingen, eenvoud,
      duidelijkheid en toegankelijkheid. Welke vorm van evaluatie moet worden gekozen, zal afhangen van onder meer het
      gewicht van de betrokken regeling, de maatschappelijke betekenis ervan en de aan evaluatie verbonden lasten. Er
      is een breed scala denkbaar van diepgaand wetenschappelijk onderzoek tot rapportage door de uitvoeringsorganen.
      Indien voor de evaluatie de medewerking van anderen dan een onder de minister ressorterend orgaan nodig is, moet
      worden voorzien in een wettelijke verplichting tot gegevensverstrekking. Voor zelfstandige bestuursorganen is in
      [artikel 20 van de Kaderwet zelfstandige bestuursorganen][ref1] al een algemene basis voor gegevensverstrekking
      opgenomen die mede ten dienste van evaluaties kan worden ingezet.
          In het algemeen ligt een evaluatietermijn van vijf jaar in de rede. Onder omstandigheden kan een andere termijn
      de voorkeur verdienen. Bij een termijn van minder dan vijf jaar moet er echter rekening mee worden gehouden dat
      die termijn mogelijk te kort is voor een evaluatie, omdat er dan nog weinig ervaring met de wet in de praktijk zal
      zijn opgedaan.
          De modelbepaling gaat uit van een eenmalige evaluatie. In bijzondere gevallen kan er behoefte bestaan aan een
      periodieke evaluatie van een wet. In de evaluatiebepaling kan dan worden bepaald dat de evaluatie ‘binnen vijf jaar
      na de inwerkingtreding van deze wet, en vervolgens telkens na (...) jaar,’ zal plaatsvinden.
          Zie voor nadere informatie over de gevallen waarin en de wijze waarop evaluaties moeten plaatsvinden onderdeel
      5 (Wat is de voorkeursoptie?) van het Beleidskompas.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel20
