  - number: '3.49'
    text: |-
      Verwijzing in een regeling naar toe te passen ICT-standaarden of ICT-voorzieningen geschiedt slechts indien
      verplichte toepassing van de desbetreffende standaarden of voorzieningen noodzakelijk is. In zo'n geval wordt
      waar mogelijk gekozen voor een open standaard die is aangewezen door het Nationaal Beraad Digitale Overheid, of
      voor voorzieningen die op dergelijke standaarden zijn gebaseerd, tenzij er zwaarwegende redenen zijn om dat niet
      te doen.
          **Toelichting**
          Voor verwijzing in een regeling naar ICT-standaarden (ook als die zijn neergelegd in een normalisatienorm)
      of een ICT-voorziening waarin zo’n standaard is toegepast, geldt een apart regime, uitgewerkt in deze aanwijzing.
      Onder ICT-standaarden worden verstaan afspraken over de vorm van elektronische uitwisseling van gegevens. ICT-
      voorzieningen zijn informatiesystemen (hardware) of toepassingen (software) die gebruikmaken van ICT-standaarden.
          Met het oog op het streven naar techniekonafhankelijke wetgeving wordt in regelingen alleen naar concrete
      ICT-standaarden of -voorzieningen verwezen indien dit noodzakelijk is. Daarvan kan sprake zijn als het nodig
      is om burgers of bedrijven te verplichten tot toepassing van de betrokken standaard of voorziening omdat het
      openhouden van meer kanalen voor aanlevering van informatie bij de overheid onevenredig hoge kosten met zich
      zou brengen. Ook kan dit voor een goed verloop van het uitvoeringsproces nodig zijn. Een voorbeeld hiervan
      is het voorschrijven van bestandsformaten bij de aanvraag van een omgevingsvergunning (zie bijvoorbeeld
      [artikel 7.1a van de Omgevingsregeling][ref1]). Verder kan het voorschrijven van een standaard ook noodzakelijk
      zijn omdat verplichte toepassing uit Europese of andere internationale wetgeving voortvloeit (zie ook
      [aanwijzing 2.15][ref2]) of omdat het niet-implementeren van open standaarden door overheidsorganisaties
      een onaanvaardbaar risico vormt voor publieke belangen zoals informatieveiligheid, interoperabiliteit of de
      leveranciersonafhankelijkheid van de overheid.
          Indien verplichte toepassing aan de orde is, wordt in beginsel slechts verwezen naar de open standaarden die
      op grond van een besluit van het Nationaal Beraad Digitale Overheid zijn opgenomen op de lijst van open standaarden
      voor pas toe of leg uit, of naar voorzieningen die op die standaarden zijn gebaseerd. De actuele lijst is te vinden
      op www.forumstandaardisatie.nl.

          Papier voldoet aan NEN 2728:2006 ([artikel 4 van de Archiefregeling][ref3])


