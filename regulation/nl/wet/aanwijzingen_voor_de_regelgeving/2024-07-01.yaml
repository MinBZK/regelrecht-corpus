  - number: '5.12'
    text: |-
      1 De inrichting van het zelfstandig bestuursorgaan, alsmede de termijn waarvoor de leden van het zelfstandig
      bestuursorgaan worden benoemd, wordt in de instellingswet geregeld.

      2 Indien het zelfstandig bestuursorgaan wordt ingesteld omdat participatie van maatschappelijke
      organisaties in verband met de aard van de betrokken bestuurstaak bijzonder aangewezen moet worden geacht
      ([artikel 3, eerste lid, onderdeel c, van de Kaderwet zelfstandige bestuursorganen][ref1]), wordt in de
      instellingswet bepaald dat personen afkomstig van maatschappelijke organisaties in het zelfstandig bestuursorgaan
      worden benoemd. Zo mogelijk wordt daarbij bepaald dat voor elk lid een plaatsvervangend lid wordt benoemd.


          **Toelichting**
          In een instellingswet is alleen een nadere precisering van benoemingen (zittingsduur, persoonlijke
      kwalificaties van leden) nodig: de [artikelen 9][ref2] en [12 van de Kaderwet zelfstandige bestuursorganen][ref3]
      voorzien in de algemene regels.
          **Eerste lid.** Met de ‘inrichting van het zelfstandig bestuursorgaan’ wordt bedoeld de omvang van het
      zelfstandig bestuursorgaan, alsmede de kwalificaties waaraan de te benoemen leden moeten voldoen. Zie bijvoorbeeld
      [artikel 3 van de Instellingswet Autoriteit Consument en Markt][ref4].
          **Tweede lid.** Hier wordt
      [artikel 3, eerste lid, onderdeel c, van de Kaderwet zelfstandige bestuursorganen][ref5] nader uitgewerkt voor
      de samenstelling van een zelfstandig bestuursorgaan. Benoeming geschiedt uit de kring van, dan wel op aanbeveling
      van de betrokken maatschappelijke organisaties, maar niet dóór die organisaties. Door het tevens benoemen van
      plaatsvervangende leden wordt bevorderd dat bij alle besluitvorming door het zelfstandig bestuursorgaan steeds alle
      participerende maatschappelijke groeperingen daadwerkelijk gerepresenteerd zullen kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0033043#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020495#Artikel3
