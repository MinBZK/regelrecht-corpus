        paragraaf: '4.9'
  - number: '2.8'
    text: |-
      Een regeling wordt op zodanige wijze ingericht dat zij zo weinig mogelijk conflicten oproept. Daartoe wordt onder
      meer aan het volgende voldaan:

      a. het aantal beslismomenten waartoe toepassing van de regeling aanleiding geeft, wordt tot een minimum beperkt;

      b. ingeval bestuurlijke boetes mogelijk worden gemaakt, worden daarvoor bindende boetemaxima vastgesteld;

      c. de aard en omvang van uitkeringen, voorzieningen en andere voordelen worden zo duidelijk mogelijk omschreven.


          **Toelichting**
          **Noodzaak conflictbeperking.** Tot op zekere hoogte is het onvermijdelijk dat regelingen waarbij aan de
      burger lasten worden opgelegd of die hem aanspraak geven op bepaalde voordelen, aanleiding geven tot conflicten.
      Het is echter gewenst dat de kans op conflicten tot een minimum wordt beperkt. Allereerst vanuit een sociaal-
      maatschappelijk oogpunt, maar ook om de lasten die verbonden zijn aan de rechtsbescherming ter zake van de
      toepassing van de regeling, zo laag mogelijk te houden. Gelet hierop dient bij de keuze uit varianten van een
      regeling ook de mate waarin over de toepassing daarvan conflicten zijn te verwachten, in beschouwing te worden
      genomen.
          **Conflictopwekkende factoren.** Regelingen zijn in bijzondere mate conflictopwekkend indien zij een van de
      volgende kenmerken vertonen:
          het verkrijgen van een uitkering, een voorziening, een restitutie of een ander voordeel wordt afhankelijk
      gesteld van individueel bepaalde omstandigheden zoals het hebben van een ziekte of gebrek dan wel het zijn van
      ondernemer;
      belanghebbenden worden met een reeks van beschikkingen geconfronteerd;
      aan een uitvoeringsorgaan wordt een ruime mate van discretionaire bevoegdheid gelaten;
      voor het bepalen van de hoogte van een uitkering of van de aard van een voordeel worden slechts vage normen
      gesteld;
      het verkrijgen van een uitkering of van een voordeel dan wel de verplichting om belasting of een heffing te betalen
      wordt bepaald door een groot aantal persoonlijke omstandigheden waarvan moet blijken uit door het uitvoeringsorgaan
      te verifiëren gegevens die de betrokkene verstrekt;
      er worden voordelen of andere gevolgen verbonden aan bijzondere, niet strikt omschreven omstandigheden;
      de besluitvorming omtrent het toekennen van uitkeringen of andere voordelen vindt plaats nadat andere organen dan
      de met de besluitvorming belaste instantie een extern advies hebben uitgebracht dat aan betrokkene bekend wordt
      gemaakt, maar waarvan de met de besluitvorming belaste instantie nog mag afwijken;
      er worden gunstige besluiten met een voorlopig karakter genomen, die worden gevolgd door minder gunstige;
      aan een orgaan dat bevoegd wordt verklaard tot het opleggen van bestuurlijke sancties, worden ruime grenzen gelaten
      om de aard en de omvang van de sancties te bepalen;
      ontwikkelingen in vele uiteenlopende en betrekkelijk smalle sectoren van het maatschappelijk leven worden door
      middel van een financieel instrument overmatig gestuurd;
      doelgroepen worden onduidelijk afgebakend.
          Zie met betrekking tot de toelichting bij de regeling ook [aanwijzing 4.43, onderdeel c][ref1].


