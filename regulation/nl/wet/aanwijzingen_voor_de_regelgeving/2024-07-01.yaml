  - number: '3.50'
    text: |-
      1 In een regeling wordt terughoudendheid betracht bij verwijzing naar informatie op internet door middel van een
      internetadres als onderdeel van de normstelling.

      2 Een verwijzing naar informatie op internet voldoet aan de volgende voorwaarden:

      a. de verwijzing heeft betrekking op informatie die is neergelegd in een welomlijnd en zelfstandig benoemd
      informatieobject;

      b. het informatieobject wordt rechtstreeks en in de vorm van een volledig uitgeschreven internetadres aangewezen
      door de verwijzing;

      c. het informatieobject is tijdig en permanent beschikbaar op de met de verwijzing aangeduide locatie;

      d. het informatieobject is leesbaar zonder dat bijzondere beperkingen gelden voortvloeiend uit het formaat waarin
      de informatie wordt aangeboden;

      e. de authenticiteit van het aangeboden informatieobject is voldoende geborgd.


          **Toelichting**
          **Eerste lid.**Deze aanwijzing is van toepassing in situaties waarin via internet aangeboden informatie
      tot onderdeel van de normstelling wordt gemaakt doordat daarnaar wordt verwezen met gebruikmaking van een
      internetadres. Aan dergelijke verwijzingen kleven specifieke risico's vanuit het oogpunt van rechtszekerheid. Op
      internet aangeboden informatie heeft vaak een vluchtiger karakter dan traditionele papieren informatiebronnen.
      Verder is de toeleiding via een internetadres naar een beoogde webpagina afhankelijk van diverse factoren die
      niet altijd in de macht van de regelgever liggen. Hierdoor is niet automatisch gegarandeerd dat de informatie
      ook in de toekomst beschikbaar zal blijven en dat de getoonde informatie door de tijd heen identiek is aan die
      welke de regelgever in eerste instantie heeft aangewezen. Daarbij is tevens van belang te bedenken dat, wanneer
      een internetadres wordt gebruikt als onderdeel van de verwijzing, de onjuistheid of de niet-beschikbaarheid van
      de informatie op die exacte locatie juridische consequenties kan hebben bij de toepassing van de regeling. Tegen
      verwijzing naar een internetadres in een toelichting bestaat geen bezwaar, voor zover niet langs die weg de via het
      internet aangeboden informatie tot onderdeel van de normstelling wordt gemaakt (zie ook [aanwijzing 4.47][ref1]).
          **Tweede lid.**Door het gebruik van een verwijzing neemt de regelgever verantwoordelijkheid voor de informatie
      waarnaar verwezen wordt. In dit lid wordt geëxpliciteerd welke eisen uit het oogpunt van rechtszekerheid gesteld
      moeten worden aan verwijzingen naar bronnen op internet. Bij verwijzingen naar officiële bekendmakingen die via
      www.officielebekendmakingen.nl zijn aangeboden, wordt voldaan aan deze eisen vanwege de juridische kaders en
      technische voorzieningen die voor deze website zijn gecreëerd. Voor andere bronnen dient een overeenkomstige
      mate van zekerheid te bestaan dat aan die eisen wordt voldaan, bijvoorbeeld door expliciete regels te stellen ten
      aanzien van het beheer van deze informatie waarvan de naleving tot de verantwoordelijkheid van een bestuursorgaan
      behoort.
          **Onderdeel a.** Onder informatieobject wordt verstaan: een op zichzelf staand geheel van gegevens met een
      eigen identiteit, zoals een lijst, een register of een database. Zo’n object wordt niet uitsluitend geïdentificeerd
      door middel van het internetadres waarop het aangeboden wordt, maar heeft een identificerende titel, in voorkomend
      geval tevens voorzien van een versieaanduiding of een datum. De aanduiding van het object mag geen ruimte
      voor twijfel laten over wat wel en wat niet tot de door de regelgever beoogde informatie behoort. Dat betekent
      bijvoorbeeld dat verwijzingen vanuit een aangewezen webpagina naar andere pagina's geen vrijblijvende toelichtingen
      of nadere informatie mogen betreffen, maar slechts gebruikt worden indien nadrukkelijk gewenst wordt dat die andere
      pagina's zelf ook onderdeel van het object vormen.
          Bovendien impliceert deze eis dat het voor het juiste begrip van de informatie die in een object besloten
      ligt niet noodzakelijk mag zijn dat informatie vereist is die elders dan in dat object zelf gevonden moet worden.
      Wanneer bijvoorbeeld kaartmateriaal technisch gesproken bestaat uit verschillende lagen die over elkaar heen
      gelegd worden bij het tonen daarvan aan de gebruiker, dient de aanduiding van het object elk van de bedoelde lagen
      te omvatten.
          **Onderdeel b.** De verwijzing hoort naar een unieke locatie te leiden waar het beoogde informatieobject is
      te vinden zonder dat van de gebruiker aanvullende zoekacties vereist worden, omdat daardoor het risico bestaat dat
      niet de informatie wordt gevonden die de regelgever bedoelde. De verwijzing wordt in klare taal gegeven door het
      webadres voluit uitgeschreven in de tekst op te nemen. Het is dus niet toelaatbaar om de verwijzing in de metadata
      van een elektronisch bestand te coderen door bijvoorbeeld een hyperlink aan te brengen onder een woord in de tekst.
          Tenzij anders bepaald omvat een verwijzing naar een webpagina tevens de op die pagina opgenomen verwijzingen
      naar subpagina's onder het opgegeven adres binnen het domein waarop dit zich bevindt. Een doorverwijzing vanaf de
      aangewezen webpagina naar een onder een andere domeinnaam aangeboden webpagina vereist daarentegen een zelfstandige
      aanwijzing in de verwijzende regelgeving, Daarmee wordt duidelijk gemaakt dat de regelgever ook de informatie op
      het domein waarnaar doorverwezen wordt voor zijn verantwoordelijkheid neemt
          **Onderdeel c.** Wanneer een informatieobject (mede) wordt geïdentificeerd door de locatie daarvan op te
      geven in de tekst van de regeling zelf, maakt deze locatie deel uit van de identificerende kenmerken van dat
      object. In het geval dat een object met soortgelijke titel en inhoud als het aangewezen object op een andere
      locatie wordt aangeboden, kan dus niet worden gezegd dat dat het door de regelgever bedoelde object is. Houd er
      rekening mee dat de eis van beschikbaarheid ook nog geldt na het vervallen van de verwijzende regeling, omdat die
      regeling onverminderd relevant kan blijven voor de afwikkeling van juridische geschillen. Verder valt te wijzen op
      [artikel 19, derde lid, van de Bekendmakingswet][ref2], dat bepaalt dat de teksten van de daar bedoelde regelingen
      ook na wijziging of intrekking in geconsolideerde vorm beschikbaar blijven, welke verplichting ondergraven zou
      worden indien niet ook de normen die door verwijzing onderdeel vormen van de regeling beschikbaar zouden blijven.
      In voorkomend geval kan dit dus ook aanleiding vormen om de regeling nadien aan te passen om een locatiewijziging
      te verwerken (bijvoorbeeld omdat een website een andere naam of een ander adres krijgt).
          **Onderdeel d.** Het vereiste van kenbaarheid van regelgeving brengt met zich dat de gebruiker van
      de verwijzingen in de regelgeving kennis moet kunnen nemen zonder met ongebruikelijke drempels te worden
      geconfronteerd, zoals bijvoorbeeld het geval zou zijn indien niet-vrijelijk beschikbare software vereist is om de
      informatie te kunnen lezen.
          **Onderdeel e.** Er moeten voldoende waarborgen bestaan om te kunnen garanderen dat het aangeboden object
      overeenstemt met het object dat de regelgever beoogde aan te wijzen op het moment van de inwerkingtreding van
      de regeling. Bij informatie die enkel in digitale vorm wordt aangeboden bestaan geen fysieke documenten waarop
      teruggegrepen kan worden om de authenticiteit van de aangeboden tekst vast te stellen. Daarom dient langs andere
      weg voldoende zekerheid gegeven te kunnen worden dat de informatie niet onbevoegd gewijzigd is, bijvoorbeeld door
      expliciete regels te stellen over het beheer van de informatie en de registratie van wijzigingen.

          GML-bestand bij dit besluit: elektronisch geografisch databestand dat is opgemaakt in Geography Markup Language
      en is gepubliceerd via www.ruimtelijkeplannen.nl, met kenmerk: NL.IMRO.0000.IMam11Barro-3000, of
      NL.IMRO.0000.IMam11Barro-3005, of
      (...). ([Artikel 1.1, eerste lid, van het Besluit algemene regels ruimtelijke ordening][ref3])


