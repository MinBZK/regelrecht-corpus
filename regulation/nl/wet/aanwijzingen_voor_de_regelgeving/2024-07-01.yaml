  - number: '4.27'
    text: Regelingen worden na hun vaststelling zo spoedig mogelijk bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.27
  - number: '4.28'
    text: |-
      Een wet, algemene maatregel van bestuur of ministeriële regeling kan bepalen dat een daarbij behorende bijlage
      wordt bekendgemaakt door terinzagelegging, indien:

      a. de bijlage niet geschikt is voor publicatie in het Staatsblad of de Staatscourant; en

      b. de kenbaarheid voor de direct bij de regeling betrokken personen daarmee voldoende verzekerd is.


          **Toelichting**
          Deze aanwijzing bevat criteria voor gebruikmaking van de uitzonderingsmogelijkheid die wordt geboden door
      [artikel 5 van de Bekendmakingswet][ref1]. Blijkens de wetsgeschiedenis is deze uitzondering met name bedoeld voor
      stukken die niet in een elektronisch bestand zijn weer te geven of alleen in een dermate groot bestand dat het niet
      geschikt is voor de gedigitaliseerde plaatsing in het Staatsblad of de Staatscourant (zie Kamerstukken II 2006/07,
      31084, nr. 3, p. 23). In het geval van elektronische bestanden die niet geschikt zijn voor gedigitaliseerde
      plaatsing in Staatsblad of Staatscourant kan de terinzagelegging ook in elektronische vorm plaatsvinden.
          Het bepalen dat een bijlage wordt bekendgemaakt door terinzagelegging geschiedt door middel van het
      slotformulier: zie [aanwijzing 4.32][ref2]. Zie ook [aanwijzing 4.41][ref3]. Van bekendmaking door terinzagelegging
      dient mededeling te worden gedaan in de Staatscourant (zie [artikel 5, tweede lid, van de Bekendmakingswet][ref4]).


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0004287#Artikel5
