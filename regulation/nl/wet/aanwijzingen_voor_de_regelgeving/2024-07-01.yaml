  - number: '2.6'
    text: |-
      Gestreefd wordt naar duidelijkheid en eenvoud van regelingen en naar een bestendig karakter daarvan.


          **Toelichting**
          Voor de beoordeling of regelgeving duidelijk en eenvoudig is, wordt mede acht geslagen op de eigenschappen van
      de doelgroep. Bij technische voorschriften die primair gericht zijn tot professionele normadressaten, is een ander
      woordgebruik aanvaardbaar dan bij gedragsvoorschriften die tot burgers in het algemeen zijn gericht.
          Een regeling is bestendig indien zij niet frequent hoeft te worden gewijzigd. Vanuit het oogpunt van
      rechtszekerheid verdient het aanbeveling naar zo groot mogelijke bestendigheid van regelingen te streven. Dit
      vereist ook dat op weloverwogen wijze de essentiële beleidsmatige keuzes gemaakt zijn alvorens tot het tot stand
      brengen van een regeling wordt overgegaan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.6
  - number: '2.7'
    text: |-
      1 Tot het tot stand brengen van een regeling wordt niet besloten dan nadat is nagegaan of in voldoende mate
      handhaving te realiseren valt.

      2 Hierbij wordt onderzocht of handhaving het beste langs bestuursrechtelijke, civielrechtelijke of strafrechtelijke
      weg dan wel op andere wijze kan plaatsvinden.


          **Toelichting**
          Zie met betrekking tot de toelichting bij de regeling ook [aanwijzing 4.43, onderdeel c][ref1].
          **Eerste lid: handhavingsmogelijkheden.** Voor het realiseren van een met een regeling beoogd doel moet
      indien nodig handhavend kunnen worden opgetreden. Of handhaving in voldoende mate mogelijk is, dient in dat geval
      te worden onderzocht voordat tot het tot stand brengen van de regeling wordt besloten. In het bijzonder geldt
      dit indien de regeling geboden of verboden bevat, maar ook in andere gevallen – bijvoorbeeld met betrekking tot
      voorschriften die aan een vergunning worden verbonden – is het handhavingsaspect van betekenis.
          Uit het onderzoek moet blijken welke inspanningen nodig zullen zijn voor de preventieve en repressieve
      handhaving van een regeling. Bij wetsvoorstellen die uit een oogpunt van uitvoering en handhaving
      ingrijpende veranderingen tot gevolg hebben, worden die bevindingen neergelegd in handhaafbaarheids- en
      uitvoerbaarheidstoetsen. Over de handhavingsmogelijkheden moet reeds voordat tot het tot stand brengen van de
      regeling wordt besloten worden overlegd met de instanties die met de uitvoering en handhaving van de regeling
      zullen worden belast.
          De volgende uitgangspunten zijn bij de beoordeling van de handhaafbaarheid in ieder geval van belang:
          een regel dient zo weinig mogelijk ruimte te laten voor interpretatiegeschillen;
      uitzonderingsbepalingen moeten tot een minimum worden beperkt;
      regels behoren zoveel mogelijk te zijn gericht op zichtbare dan wel objectief constateerbare feiten;
      regels dienen werkbaar te zijn voor degenen tot wie de regels zijn gericht en voor de personen die met handhaving
      zijn belast.
          Zie in dit verband ook de instrumenten met betrekking tot de beoordeling van de handhaafbaarheid in onderdeel 4
      (Wat zijn de gevolgen van deze opties?) van het Beleidskompas.
          Bij het in deze aanwijzing bedoelde onderzoek dient niet alleen de theoretische handhaafbaarheid beoordeeld te
      worden, maar ook de feitelijke beschikbaarheid van de voor handhaving noodzakelijke middelen. Gelijktijdig met het
      besluit om tot regeling over te gaan moet besloten worden die middelen beschikbaar te stellen.
          **Tweede lid: handhavingsmethoden.** In dit verband moeten ook de verschillende handhavingsmethoden tegen
      elkaar worden afgewogen. Daarbij valt in de eerste plaats te denken aan bestuursrechtelijke, civielrechtelijke
      en strafrechtelijke middelen. Ook kan gedacht worden aan de mogelijkheden die het tuchtrecht biedt, en aan
      preventieve middelen zoals voorlichting. Voor elk van de repressieve handhavingsmethoden dient verder aandacht
      te worden besteed aan de mogelijke sancties. Bij de afweging van de verschillende mogelijkheden dienen de lasten
      die die keuze ten gevolge heeft voor samenleving en overheid in de overweging betrokken te worden. In bepaalde
      gevallen is het aangewezen niet voor één handhavingsmethode te kiezen maar voor een combinatie van verschillende
      methoden. Overigens dient ervoor te worden gezorgd dat niet zonder noodzaak wordt voorzien in een cumulatie van
      sanctiemogelijkheden voor de handhaving van één verplichting.
          Zie voor de keuze tussen strafrecht en bestuursrecht het nader rapport bestuurlijke boetestelsels van
      26 april 2018 (Kamerstukken II 2017/18, 34 775-VI, nr. 102, en Stcrt. 2018, 31269), waarin wordt gereageerd
      op het ongevraagd advies van de Afdeling advisering van de Raad van State van 13 juli 2015 over de verhouding
      tussen de sanctiestelsels in het bestuursrecht en het strafrecht. Het nader rapport bevat in de eerste plaats
      algemene criteria die steeds een rol moeten spelen bij de vraag of gekozen moet worden voor bestuursrechtelijke
      of strafrechtelijke handhaving. Het betreft de context van de normovertreding, de feitelijke pakkans, de aard
      en zwaarte van de voorgenomen sanctie, het beoogde generaal en speciaal preventieve effect, financiële en
      organisatorische aspecten van sanctieoplegging en de vraag of internationaalrechtelijke of Unierechtelijke
      verplichtingen dwingend zijn voor een bepaalde keuze.
          Bij een voorgenomen keuze voor bestuursrechtelijke handhaving moet bijzondere aandacht uitgaan naar de
      toerusting en professionaliteit van het beoogde bestuursorgaan, de aard van de overtreding en de aanwezigheid van
      bijzondere expertise, als die voor de handhaving is vereist. Met name bij punitieve bestuursrechtelijke handhaving
      zijn ook artikel 47 van het Handvest van de grondrechten van de Europese Unie, artikel 6 EVRM en de artikelen 14 en
      15 IVBPR van belang.
          Bij de keuze voor strafrechtelijke handhaving moet bijzondere aandacht uitgaan naar de ernst van de
      normovertreding, de vraag of vrijheidsbenemende sancties op hun plaats zijn en de eventuele wenselijkheid van
      bijzondere opsporingsbevoegdheden of strafvorderlijke dwangmiddelen. Bij handhaving van ordeningswetgeving
      door middel van het strafrecht moet worden afgewogen of toepassing van de Wet op de economische delicten moet
      plaatsvinden. Bij het voornemen tot strafrechtelijke sanctionering wordt ook nagegaan of de Wet justitiële en
      strafvorderlijke gegevens consequenties verbindt aan de strafbaarstelling. Een veroordeling kan leiden tot de
      verwerking van gegevens in de justitiële documentatie. Die gegevens worden in de regel betrokken bij besluitvorming
      over de aanvraag van een verklaring omtrent het gedrag. Zie verder ook paragraaf 5.10. Indien wordt gekozen voor
      strafrechtelijk te sanctioneren bepalingen, vereist de formulering van de elementen van de delictsomschrijvingen
      bijzonder veel zorg (zie ook aanwijzing 5.44). Hierover moet worden overlegd met het Ministerie van Justitie en
      Veiligheid of rechtstreeks met het openbaar ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
