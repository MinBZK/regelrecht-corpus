  - number: '8.11'
    text: |-
      Indien in een wet de uitvoering van verdragen en besluiten van volkenrechtelijke organisaties wordt gedelegeerd
      naar een lagere regeling, wordt voor de delegatiebepaling het volgende model als uitgangspunt genomen:

      *[Bij of krachtens algemene maatregel van bestuur / Bij ministeriële regeling] worden regels gesteld ter uitvoering
      van verplichtingen die voortvloeien uit verdragen of uit bindende besluiten van volkenrechtelijke organisaties.*


          **Toelichting**
          Wanneer daarvoor gronden aanwezig zijn, kan van de standaard worden afgeweken en voor een ruimere verwijzing
      gekozen worden. Zo kan het nodig zijn om ter uitvoering van ‘aanbevelingen’ en ‘internationale beleidsafspraken’
      niet juridisch bindende regels vast te stellen. Zie ook de [aanwijzingen 2.21][ref1], [2.22][ref2], [2.23][ref3]
      en [9.8][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
