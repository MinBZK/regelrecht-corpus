  - number: '5.2'
    text: |-
      Herhaling in een regeling van omvangrijke omschrijvingen wordt vermeden door in de begripsbepalingen een verkorte
      aanduiding op te nemen.


          **Toelichting**
          Begrippen die slechts één keer voorkomen in een regeling worden niet in de begripsbepalingen gedefinieerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.2
  - number: '5.3'
    text: |-
      1 Voor begripsbepalingen wordt de volgende formulering gebruikt:

      *In [deze wet / dit besluit / deze regeling / deze beleidsregel] [en de daarop berustende bepalingen] wordt [,
      tenzij anders bepaald,] verstaan onder:*

      2 De term ‘*verstaan*’ wordt gebruikt, indien een begrip in algemene zin wordt gedefinieerd.

      3 De term ‘*mede verstaan*’ wordt gebruikt, indien aan de, al dan niet gedefinieerde, betekenis van een begrip
      uitbreiding wordt gegeven.

      4 In een begripsbepaling worden geen aanhalingstekens gebruikt.


          **Toelichting**
          Zie [aanwijzing 3.59, derde lid][ref1], voor de wijze van opsomming van begripsbepalingen.
          Door toevoeging van de zinsnede ‘en de daarop berustende bepalingen’ gelden de begripsbepalingen uit
      een regeling ook in de op die regeling gebaseerde uitvoeringsregelingen. Hiermee wordt bewerkstelligd
      dat de terminologie van de uitvoeringsregeling aansluit bij die van de delegerende regeling (zie ook
      [aanwijzing 3.4][ref2]). Soms zal het echter nodig zijn om in een uitvoeringsregeling toch een afwijkende
      begripsbepaling te gebruiken, bijvoorbeeld omdat een bepaald begrip in de uitvoeringsregeling een beperktere
      reikwijdte dient te hebben dan in de delegerende regeling. De zinsnede ‘tenzij anders bepaald’ kan in dat geval
      uitkomst bieden.
          In begripsbepalingen kan ook worden verwezen naar de definiëring van een begrip in een andere regeling.
      Bijvoorbeeld: '‘In deze wet wordt verstaan onder accountant: een accountant als bedoeld in artikel 393, eerste lid,'
      van Boek 2 van het Burgerlijk Wetboek’.
          **Tweede en derde lid.**Zie ook de toelichting bij [aanwijzing 5.1, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.3
