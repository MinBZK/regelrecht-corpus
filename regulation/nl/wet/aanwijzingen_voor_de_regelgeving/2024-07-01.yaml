  - number: '4.44'
    text: |-
      1 In de toelichting wordt, voor zover mogelijk en relevant voor de inhoud van de regeling, vermeld welke externe
      partijen inbreng hebben geleverd bij de totstandkoming van de regeling, op welke wijze dat is gebeurd, wat de
      strekking van de inbreng was en wat er met de inbreng is gedaan.

      2 Indien voor de totstandkoming van een regeling een bijzondere procedure wettelijk is voorgeschreven, wordt aan
      het volgen daarvan in de toelichting aandacht geschonken.

      3 Indien op hoofdpunten in een regeling wordt afgeweken van een krachtens wettelijk voorschrift uitgebracht advies,
      wordt de reden hiervan in de toelichting weergegeven.


          **Toelichting**
          Bij de totstandkoming van regelingen zijn veelal externe partijen betrokken. Partijen kunnen in dit verband
      burgers, bedrijven, instellingen en andere organisaties zijn. Betrokkenheid kan aan de orde zijn doordat zij
      verzocht hebben om het opstellen van de regeling, gevraagd of ongevraagd inbreng hebben geleverd voorafgaand aan
      of gedurende het opstellen van de regeling, of hun zienswijze hebben gegeven over een conceptregeling waarover een
      consultatie is gehouden. Ook adviezen, al dan niet krachtens wettelijk voorschrift uitgebracht, kunnen onder de
      term ‘inbreng’ vallen. Het opnemen van informatie over de geleverde inbreng blijft achterwege voor zover dat niet
      mogelijk is, zoals in gevallen waarin de wetgeving over openbaarheid van overheidsinformatie zich daartegen verzet,
      of niet relevant is voor de inhoud van de regeling, zoals in gevallen waarin de inbreng geen betrekking had op de
      regeling zelf. Bij het vermelden welke externe partijen inbreng hebben geleverd, is het bij groepen van burgers
      of bedrijven met gelijksoortige inbreng toegestaan om te volstaan met een categoriale in plaats van individuele
      aanduiding daarvan; de term ‘vermelden’ staat daarbij ook een zakelijke weergave toe.
          **Tweede lid.**Te denken valt onder meer aan advisering door adviescolleges of andere organen, zoals de
      Autoriteit persoonsgegevens (artikel 36, vierde lid, van de Algemene verordening gegevensbescherming), het
      Adviescollege openbaarheid en informatiehuishouding [(artikel 7.2, derde lid, van de Wet open overheid][ref1]) en
      de Raad voor de rechtspraak ([artikel 97, tweede lid, van de Wet op de rechterlijke organisatie][ref2]).
          Andere voorbeelden van bijzondere procedures zijn voorschriften inzake parlementaire
      betrokkenheid bij de totstandkoming van gedelegeerde regelgeving (zie ook [paragraaf 2.5][ref3])
      en voorschriften betreffende de betrokkenheid van decentrale overheden bij de totstandkoming
      van regelingen waarbij van die overheden regeling of bestuur wordt gevorderd (zie bijvoorbeeld
      [artikel 114 van de Gemeentewet][ref4], [artikel 112 van de Provinciewet][ref5] en
      [artikel 209 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref6]).
          Zie voor de notificatie van ontwerpregelingen ter voldoening aan Europese of andere internationale
      notificatieverplichtingen [paragraaf 7.2][ref7].
          Het tweede en derde lid zijn niet van toepassing op de advisering door de Afdeling advisering van de Raad van
      State. Zie hiervoor de [aanwijzingen 4.5][ref8] en [4.6][ref9].


