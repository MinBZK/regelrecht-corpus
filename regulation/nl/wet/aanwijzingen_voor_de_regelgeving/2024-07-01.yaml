        paragraaf: '6.1'
  - number: 5.61.1
    text: |-
      Een nieuwe regeling is niet slechts van toepassing op hetgeen na haar inwerkingtreding voorvalt, doch ook op
      hetgeen bij haar inwerkingtreding bestaat, zoals bestaande rechtsposities en verhoudingen (onmiddellijke werking).
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.61
  - number: 5.61.2
    text: Indien beoogd wordt af te wijken van het eerste lid, wordt dit uitdrukkelijk bepaald.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.61
  - number: 5.62.1
    text: Aan een regeling wordt slechts terugwerkende kracht verleend, indien daarvoor een bijzondere reden bestaat.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.62
  - number: 5.62.2
    text: |-
      Door het verlenen van terugwerkende kracht aan een regeling worden de in die regeling voorziene rechtsgevolgen
      gerekend te zijn ingetreden vanaf een nader aangeduid tijdstip voorafgaande aan de inwerkingtreding van die
      regeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.62
  - number: 5.62.3
    text: Aan belastende regelingen wordt, behoudens in uitzonderlijke gevallen, geen terugwerkende kracht toegekend.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.62
  - number: 5.62.4
    text: |-
      Bij een regeling mag een feit dat vóór haar inwerkingtreding is geschied, niet strafbaar of zwaarder strafbaar
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.62
  - number: 5.63.1
    text: |-
      Het verlenen van terugwerkende kracht geschiedt niet door de regeling in werking te laten treden op een tijdstip
      dat in het verleden ligt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.63
  - number: 5.63.2
    text: 'Voor het verlenen van terugwerkende kracht wordt een van de volgende modellen gebruikt:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.63
  - number: 5.63.2.A
    text: |-
      Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking [op / met ingang van ...; zie
      aanwijzing 4.21] en werkt [ten aanzien van artikel... / de artikelen...] terug tot en met...
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.63
  - number: 5.63.2.B
    text: |-
      Deze wet / Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. In dat besluit kan
      worden bepaald dat [artikel ... / de artikelen ... van] deze wet / dit besluit [terugwerkt / terugwerken] tot en
      met [... / een in dat besluit te bepalen tijdstip] [, dat voor de verschillende artikelen of onderdelen daarvan
      verschillend kan worden vastgesteld].
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.63
  - number: 5.63.3
    text: |-
      Indien dit voor de duidelijkheid van de beoogde rechtsgevolgen van terugwerkende kracht nodig is, worden meer
      gespecificeerde bepalingen opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.63
  - number: 5.63.4
    text: |-
      In de toelichting wordt vermeld om welke reden en tot en met welk tijdstip het verlenen van terugwerkende kracht
      noodzakelijk is of kan zijn.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.63
  - number: 5.64.1
    text: |-
      Een nieuwe regeling kan een daarvoor geldende regeling blijvend (eerbiedigende werking) of voor een bepaalde
      periode (uitgestelde werking) van toepassing laten op nader aangeduide feiten of verhoudingen, dan wel blijvend of
      voor een bepaalde periode gelding toekennen aan door een daarvoor geldende regeling in het leven geroepen rechten
      of verplichtingen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.64
  - number: 5.64.2
    text: |-
      Bij het verlenen van eerbiedigende of uitgestelde werking of het toekennen van gelding aan door een eerdere
      regeling in het leven geroepen rechten of verplichtingen blijkt uit de regeling duidelijk welke rechtsgevolgen
      beoogd worden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.64
  - number: '5.65'
    text: |-
      In geval van nieuwe regels voor procedures en bevoegdheden van organen ter zake van geschillen wordt met betrekking
      tot de zaken die voor de inwerkingtreding van deze regels aanhangig zijn gemaakt, uitdrukkelijk geregeld of het
      oude dan wel het nieuwe recht van toepassing is.
          **Toelichting**
          Deze aanwijzing geldt ook in de sfeer van het strafprocesrecht. In de sfeer van de strafvordering geldt
      niet een regel als die van [artikel 1, tweede lid, van het Wetboek van Strafrecht][ref1]. Bij verandering van de
      bevoegde instantie of van de procedure dient men in die sfeer, evenals elders in de sfeer van het procesrecht, na
      te gaan of de oude dan wel de nieuwe regeling ook moet gelden voor de zaken, die bij de inwerkingtreding van de
      nieuwe regeling aanhangig zijn.
          [Artikel 11:3 Awb][ref2] bevat ‘permanent overgangsrecht’ voor wijzigingen van de bijlagen bij de [Awb][ref3].
      Zie ook de toelichting bij [aanwijzing 5.49][ref4].

          Op de afhandeling van een noodregeling of faillietverklaring van een kredietinstelling of
      verzekeraar die is uitgesproken voor het tijdstip van inwerkingtreding van deze wet, blijft het op het
      tijdstip van het uitspreken van de noodregeling of faillietverklaring geldende recht van toepassing.
      ([Artikel 10:9 van de Wet financiële markten BES][ref5])
      Beroepen, ingesteld op grond van artikel 18 van de Schepenwet, waarin voor de inwerkingtreding van artikel I,
      onderdeel C, nog geen uitspraak is gedaan, worden afgehandeld door de voorzitter van de Raad voor de Scheepvaart
      of, indien het beroep een beslissing van een ambtenaar in de Nederlandse Antillen of Aruba betreft, door de
      voorzitter van de Commissie van Onderzoek.
      Ten aanzien van beroepen als bedoeld in het eerste lid blijven de bij of krachtens de artikelen 18 tot en met
      22 van de Schepenwet gestelde regels, zoals deze luidden voor de inwerkingtreding van artikel I, onderdeel C,
      van kracht. (Artikel II van de Rijkswet van 20 januari 2005, houdende wijziging van de Schepenwet in verband
      met de totstandkoming van de Rijkswet Onderzoeksraad voor veiligheid en de invoering van een nieuwe regeling van
      tuchtrechtspraak voor de zeescheepvaart (Stb. 2005, 51))


