  - number: '5.11'
    text: |-
      1 Indien het toekennen van rechtspersoonlijkheid wenselijk is, wordt in de wet waarbij een zelfstandig
      bestuursorgaan wordt ingesteld het volgende model gebruikt:

      1. *Er is een [naam rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt].*

      2. *[naam rechtspersoon] is gevestigd te ... .*

      3. *[naam rechtspersoon] bezit rechtspersoonlijkheid.*

      2 In de instellingswet wordt in dat geval, indien mogelijk, duidelijk onderscheid gemaakt tussen het zelfstandig
      bestuursorgaan en de rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt. Daarbij wordt het volgende
      model gebruikt:

      1. *Aan het hoofd van [naam rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt] staat [aanduiding
      zelfstandig bestuursorgaan].*

      2. *[aanduiding zelfstandig bestuursorgaan] heeft tot taak ... / de volgende taken: ...*

      3 In de instellingswet wordt in dat geval de wijze van bekostiging van de rechtspersoon geregeld.


          **Toelichting**
          **Eerste lid.** In bepaalde gevallen kan het voor een goede taakvervulling van belang zijn dat de organisatie
      waarvan een zelfstandig bestuursorgaan deel uitmaakt, op eigen titel – dat wil zeggen los van de rechtspersoon
      Staat der Nederlanden – aan het civielrechtelijke rechtsverkeer kan deelnemen. Het zelfstandig bestuursorgaan
      heeft dan de mogelijkheid zelfstandig contracten te sluiten of personeel aan te nemen, wat voor het onafhankelijk
      verrichten van zijn publieke taak van belang kan zijn. Zonder rechtspersoonlijkheid kunnen die bevoegdheden
      alleen worden uitgevoerd indien de minister daartoe volmacht of mandaat heeft verleend. In de gevallen dat
      rechtspersoonlijkheid wenselijk is, kan deze door de wet worden toegekend. In de memorie van toelichting moet een
      uitdrukkelijke motivering worden opgenomen. De daardoor ontstane vermogensrechtelijke bevoegdheden kunnen overigens
      uitsluitend worden uitgeoefend ter verwezenlijking van de bestuurstaak van het zelfstandig bestuursorgaan: zie
      [artikel 3:14 BW][ref1].
          In de afweging over het toekennen van rechtspersoonlijkheid dient telkens te worden betrokken of het personeel
      een aanstelling bij een aparte organisatie zou prefereren boven een aanstelling in algemene rijksdienst en of het
      bestuur/de directie de verantwoordelijkheid voor het personeel, de organisatie, het financieel beheer en wat dies
      meer zij, kan dragen.
          **Tweede lid.** Het zelfstandig bestuursorgaan is de drager van publiekrechtelijke taken en bevoegdheden
      (openbaar gezag). De rechtspersoon is het lichaam waarvan het zelfstandig bestuursorgaan deel uitmaakt en dat aan
      het rechtsverkeer deelneemt. In veel gevallen zal de rechtspersoonlijkheid worden toegekend aan een organisatie
      en zullen de publiekrechtelijke taken en bevoegdheden worden toegekend aan het bestuur van die organisatie. Het
      bestuur is dan het zelfstandig bestuursorgaan. Om te voorkomen dat beide begrippen door elkaar gaan lopen doordat
      bijvoorbeeld privaatrechtelijke bevoegdheden aan het bestuur (zelfstandig bestuursorgaan) worden opgedragen, of
      publiekrechtelijke bevoegdheden aan de rechtspersoon, dient in de instellingswet een scherp onderscheid tussen
      beide te worden gemaakt.
          Het kan voorkomen dat de naam van de rechtspersoon tevens de naam van het bestuursorgaan is. Een voorbeeld
      hiervan is de Onderzoeksraad voor veiligheid. In dat geval is het onderscheid niet te maken en vervalt het in de
      modelbepaling opgenomen eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel14
