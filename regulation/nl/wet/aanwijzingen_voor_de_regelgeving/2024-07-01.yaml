  - number: '7.12'
    text: |-
      Indien tijdens de adviesprocedure bij de Afdeling advisering van de Raad van State blijkt dat aan de voortzetting
      van de behandeling van een wetsvoorstel of het ontwerp voor een algemene maatregel van bestuur geen behoefte
      meer bestaat, bevordert de eerstverantwoordelijke bewindspersoon, daartoe gemachtigd door de ministerraad, dat de
      adviesaanvraag wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.12
  - number: '7.13'
    text: |-
      In het nader rapport aan de Koning wordt het advies van de Afdeling advisering van de Raad van State integraal
      opgenomen en wordt de reactie daarop te bestemder plaatse tussengevoegd.


          **Toelichting**
          De zelfstandige leesbaarheid van het nader rapport wordt vergroot door daarin de tekst van het advies van de
      Afdeling advisering op te nemen en daar de puntsgewijze reactie tussen te plaatsen. Algemene opmerkingen die niet
      specifiek gerelateerd zijn aan punten in het advies worden in het begin of aan het eind van het nader rapport
      opgenomen.
          Indien bij gelegenheid van het nader rapport wijzigingen worden aangebracht die niet het gevolg zijn van het
      advies van de Afdeling (en waarover de Afdeling niet ingevolge [aanwijzing 7.16, eerste lid][ref1], wordt gehoord)
      wordt daarvan mededeling gedaan in een of meer afzonderlijk genummerde punten aan het slot van het nader rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '7.14'
    text: |-
      Indien een advies van de Afdeling advisering van de Raad van State ingrijpende kritiek op de inhoud of de
      vormgeving van een wetsvoorstel of een ontwerp voor een algemene maatregel van bestuur bevat, wordt het
      wetsvoorstel of ontwerp opnieuw in de ministerraad aan de orde gesteld.


          **Toelichting**
          De volgende dicta geven aan dat van ingrijpende kritiek sprake is:
          ‘De Afdeling advisering van de Raad van State heeft een aantal bezwaren bij het voorstel en adviseert het
      voorstel niet bij de Tweede Kamer der Staten-Generaal in te dienen, tenzij het is aangepast.’ (dictum c)
      ‘De Afdeling advisering van de Raad van State heeft ernstige bezwaren tegen het voorstel en adviseert het niet bij
      de Tweede Kamer der Staten-Generaal in te dienen.’ (dictum d)
          Bij algemene maatregelen van bestuur luiden deze dicta overeenkomstig, met dien verstande dat het dictum in dat
      geval ziet op de besluitvorming van de regering over de algemene maatregel van bestuur.
          Bij ingrijpende kritiek dienen de ontwerpregeling en het nader rapport ook ter toetsing te worden voorgelegd
      aan de sector Juridische Zaken en Wetgevingsbeleid van de Directie Wetgeving en Juridische Zaken van het Ministerie
      van Justitie en Veiligheid ([aanwijzing 7.4, eerste lid, onderdeel d][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.14
    references:
