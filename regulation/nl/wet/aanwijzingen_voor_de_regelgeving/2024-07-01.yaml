  - number: '6.7'
    text: |-
      Het opschrift en de aanhef van een regeling worden niet gewijzigd.


          **Toelichting**
          Het opschrift en de aanhef van een regeling vormen met het slotformulier het deel van de regeling dat een
      eenmalige, aan het tijdstip van totstandkoming gebonden, betekenis heeft. Dit deel, en dus ook de considerans
      van een wet en de passage ‘Gelet op ...’ in de aanhef van een andere regeling, kan bij een latere wijziging van
      de regeling niet meer worden gewijzigd. Indien de strekking van een wet wordt gewijzigd, kan dit tot uitdrukking
      worden gebracht in het opschrift en de considerans van de wet die in de wijziging voorziet. Wel dient in het oog
      gehouden te worden dat bij wijziging van een wetsvoorstel tijdens de parlementaire behandeling aanpassing van het
      opschrift en de considerans noodzakelijk kan zijn. Dit kan bij nota van wijziging (zie [paragraaf 6.4][ref1]). Het
      opschrift en de considerans zijn ook vatbaar voor amendering.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
