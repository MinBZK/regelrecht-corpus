        bwb_id: BWBR0006501
        artikel: '4'
  - number: '7.23'
    text: |-
      Leden van de Tweede Kamer die een initiatiefvoorstel van wet aanhangig willen maken, kunnen de betrokken
      bewindspersoon bijstand verzoeken bij het formuleren daarvan. Deze bijstand wordt zoveel mogelijk verleend.


          **Toelichting**
          Het gaat hier, evenals bij amendementen ([aanwijzing 7.20][ref1]), om juridische en wetgevingstechnische
      bijstand. Daarnaast kan het gaan om het verstrekken van feitelijke informatie ten behoeve van het door de indiener
      op te stellen algemeen deel van de memorie van toelichting, om het formuleren van passages voor de artikelsgewijze
      toelichting, of om het (door de directie FEZ) doorrekenen van de financiële gevolgen van het voorstel. Verder
      kan het omvatten de verrichting door het departement van procedurele handelingen waartoe het voorstel aanleiding
      zou geven, zoals notificatie bij de Europese Commissie (zie aanwijzing 9.19) of het verrichten van een specifiek
      voorgeschreven evenredigheidsbeoordeling en toepassing van publieke consultatie (zie de toelichting bij aanwijzing
      2.15).
          Voor het verlenen van bijstand bij het formuleren van een initiatiefvoorstel behoeft een ambtenaar toestemming
      van zijn bewindspersoon. Zie ook Kamerstukken II 2004/05, 30095, nr. 5.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.23
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: '7.24'
    text: |-
      1 Bewindspersonen geven zowel bij de schriftelijke als bij de mondelinge behandeling van een initiatiefvoorstel
      alle inlichtingen en adviezen die van hen worden gevraagd en waarvan het verstrekken niet in strijd is met het
      belang van de staat. Bij de mondelinge behandeling zijn de bewindspersonen steeds aanwezig.

      2 Bewindspersonen maken ook eigener beweging, zowel in de schriftelijke als in de mondelinge fase, alle opmerkingen
      die zij dienstig achten om te komen tot een goed wetgevingsproduct.

      3 Ook tijdens de parlementaire behandeling van een initiatiefvoorstel wordt desgewenst aan de initiatiefnemers
      zoveel mogelijk en zo snel mogelijk ambtelijke bijstand van juridische en wetgevingstechnische aard verleend.

      **Tweede lid.** De bewindspersoon maakt in ieder geval eigener beweging opmerkingen, indien de bewindspersoon
      meent dat het initiatiefvoorstel op een of meer punten onverenigbaar is met materiële of procedurele verplichtingen
      die voortvloeien uit hoger recht. De bewindspersoon zet in het kader van diens inbreng uiteen dat en in welke
      zin het voorstel onverenigbaar is met hoger recht, en wat dit volgens de bewindspersoon betekent voor het
      initiatiefvoorstel.

      Dit betekent bijvoorbeeld dat indien nog niet de ingevolge [richtlijn (EU) 2018/958](32018L0958) verplichte
      evenredigheidsbeoordeling door het betrokken lid van de Tweede Kamer heeft plaatsgevonden ten aanzien van een
      initiatiefvoorstel dat een beperking van de toegang tot of de uitoefening van een gereglementeerd beroep omvat, de
      bewindspersoon deze onverenigbaarheid met die richtlijn vermeldt in diens inbreng. Zie ook [aanwijzing 2.15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '7.25'
    text: |-
      Bewindspersonen dragen er zorg voor dat zij in voorkomende gevallen over initiatiefvoorstellen kunnen spreken
      namens het kabinet. Daartoe stellen zij deze tijdig in de ministerraad aan de orde.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.25
  - number: '7.26'
    text: |-
      Zo spoedig mogelijk, maar niet later dan drie maanden na aanneming van een initiatiefvoorstel door de Eerste Kamer
      doet de betrokken bewindspersoon mededeling aan de Staten-Generaal omtrent de besluitvorming over het al dan niet
      bekrachtigen van het voorstel, of, indien een besluit nog niet is genomen, van de stand van zaken daaromtrent en
      van het tijdstip waarop nieuwe mededelingen als vorenbedoeld zullen worden gedaan.

      Bij deze aanwijzing is ook van belang dat indien niet-bekrachtiging wordt overwogen, advies aan de Afdeling
      advisering van de Raad van State dient te worden gevraagd, hetgeen consequenties heeft voor de procedure en de
      termijn daarvan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.26
  - number: '8.1'
    text: |-
      1 Onder verdrag wordt verstaan: iedere op schrift gestelde overeenkomst die volgens volkenrechtelijke criteria voor
      de staat verbindend is.

      2 In de Nederlandse titel van een verdrag wordt bij voorkeur de grondwettelijke term ‘verdrag’ gebruikt en niet de
      term ‘overeenkomst’.

      3 In verdragen wordt het Koninkrijk der Nederlanden als zodanig aangeduid als partij bij het verdrag.

      4 Bij de onderhandelingen over ontwerpverdragen wordt er naar gestreefd de staat – en derhalve niet de regering –
      als verdragspartij aan te duiden.


          **Toelichting**
          **Criteria voor verdragen.** Niet bepalend voor de vraag of er sprake is van een verdrag zijn de vorm (een
      verdrag kan uit één of meer stukken bestaan), titel, wijze van totstandkoming en de functie van personen die de
      regeling treffen. Voor de beginselen van het verdragenrecht wordt verwezen naar het Verdrag van Wenen inzake het
      verdragenrecht, zie met name artikel 2 (Nederlandse vertaling in Trb. 1985, 79). Overigens kunnen verdragen ook
      gesloten worden met internationale organisaties. De verbindendheid van een verdrag voor het Koninkrijk treedt pas
      in na de inwerkingtreding voor het Koninkrijk.
          **Benaming.** Als een verdrag niet de benaming verdrag in de titel heeft, wordt het in stukken over het verdrag
      wel bij voorkeur met de term verdrag aangeduid, tenzij dit verwarring kan opleveren met andere in het stuk genoemde
      verdragen. Dat wil zeggen dat bijvoorbeeld in een brief die als onderwerp vermeldt ‘Overeenkomst inzake ...’,
      geschreven wordt over ‘bovengenoemd verdrag’.
          **Partijen.** Mocht het streven de staat aan te duiden als verdragspartij niet tot resultaat leiden, dan wordt
      in de toelichting aangegeven dat het verdrag wel voor de staat zal gelden. Het Koninkrijk der Nederlanden is het
      volkenrechtelijk subject, ook indien het om een verdrag gaat dat binnen het Koninkrijk uitsluitend geldt voor
      Nederland, Aruba, Curaçao of Sint Maarten. De aanduiding ‘Nederland’ als verdragsluitende partij is niet juist.
          **Internationale beleidsafspraken.** Binnen de schriftelijke internationale afspraken met publiekrechtelijk
      karakter bestaan twee categorieën die goed van elkaar moeten worden onderscheiden: verdragen en internationale
      beleidsafspraken. Het essentiële verschil tussen de twee is dat een verdrag juridisch verbindende verplichtingen
      schept voor staten (of internationale organisaties), terwijl een internationale beleidsafspraak slechts politiek
      en moreel verbindend is voor regeringen, ministers, andere overheden, met inbegrip van functioneel (zelfstandige
      bestuursorganen) en territoriaal gedecentraliseerde overheden, of de (onderdelen van) internationale organisaties
      die de afspraak maken.
          Voor internationale beleidsafspraken geldt het volgende. Indien een regeling wordt beoogd die de staten niet
      volkenrechtelijk verbindt, kan een internationale beleidsafspraak tot stand worden gebracht tussen regeringen,
      een of meer ministers, tussen lagere overheden, met inbegrip van functioneel (zelfstandige bestuursorganen)
      en territoriaal gedecentraliseerde overheden, of met (onderdelen van) internationale organisaties. Voor deze
      beleidsafspraken wordt bij voorkeur de benaming ‘memorandum van overeenstemming’ (‘Memorandum of Understanding’,
      afgekort ‘MoU’) gebruikt. Het doel is veelal afspraken te maken voor toekomstig parallel optreden, of onderling het
      beleid af te stemmen van overigens zelfstandige partijen. Beleidsafspraken zijn voor de ondertekenaars politiek en
      moreel verbindend, maar leveren geen juridische verplichtingen op waarvan men de naleving rechtens kan vorderen.
      Van internationale beleidsafspraken mag men wel verwachten dat zij door de betrokken regeringen, ministers,
      enz. worden nageleefd, voor zover de nationale grondwetten en wettelijke regels dat toelaten. De regering kan
      onmiddellijk gevolg geven aan een verzoek van bijvoorbeeld het Nederlandse parlement om afspraken stop te zetten.
      Een andere reden voor stopzetting kan zijn dat een rechter bepaalt dat de afspraken geen doorgang mogen vinden als
      zou blijken dat naleving strijdig is met de wet, of anderszins onrechtmatig is.
          Over de voorbereiding van een internationale beleidsafspraak wordt in een zo vroeg mogelijk stadium
      overleg gevoerd met de afdeling Internationaal Recht van de Directie Juridische Zaken van het Ministerie van
      Buitenlandse Zaken, ter vermijding van mogelijk internationaal misverstand over het rechtskarakter van de
      afspraak en ter vermijding van ontstaan van mogelijke frictie met de bepalingen van de [Grondwet][ref1] inzake
      verdragen. De toetsing van MoU’s door de afdeling Internationaal Recht strekt zich ook uit tot schriftelijke
      internationale beleidsafspraken van functioneel (zelfstandige bestuursorganen) en territoriaal gedecentraliseerde
      overheden, in het bijzonder waar die afspraken betrekking hebben op de wettelijke taken van de desbetreffende
      (overheids)organisatie. In die gevallen gelden dezelfde regels als voor de rijksoverheid. Het Ministerie van
      Buitenlandse Zaken heeft een brochure opgesteld inzake MoU’s waarin richtlijnen zijn gesteld. De brochure is
      beschikbaar via het Beleidskompas.
          Wanneer bij de voorbereiding van een internationale beleidsafspraak mogelijke frictie met de bepalingen van de
      [Grondwet][ref2] aan de orde is, wordt tevens de Directie Constitutionele Zaken en Wetgeving van het Ministerie van
      Binnenlandse Zaken en Koninkrijksrelaties betrokken.
          De tot stand gekomen MoU's worden bewaard door het departement dat verantwoordelijk is voor de inhoud van de
      internationale beleidsafspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0001840
  - number: '8.2'
    text: |-
      1 De regeringen van Aruba, Curaçao en Sint Maarten worden in een zo vroeg mogelijk stadium betrokken bij de
      totstandbrenging van verdragen die voor de landen mede kunnen gelden of deze landen anderszins kunnen raken en bij
      de ter zake te volgen procedures.

      2 De afdeling Verdragen van de Directie Juridische Zaken van het Ministerie van Buitenlandse Zaken onderhoudt de
      contacten hierover met de Gevolmachtigde Ministers van Aruba, Curaçao en Sint Maarten.


          **Toelichting**
          **Eerste lid.** Volgens [artikel 3 van het Statuut voor het Koninkrijk][ref1] zijn de buitenlandse
      betrekkingen koninkrijksaangelegenheid. [Artikel 27, eerste lid, van het Statuut][ref2] bepaalt dat Aruba,
      Curaçao en Sint Maarten moeten worden betrokken bij verdragen die hen ingevolge [artikel 11, derde lid][ref3],
      raken. In de praktijk worden de regeringen van Aruba, Curaçao en Sint Maarten met betrekking tot alle
      verdragen waarvan de aard zodanig is dat medegelding mogelijk is, benaderd met de vraag of het verdrag mede
      moet gelden voor deze landen. Ook in het geval het verdrag in kwestie die landen anderszins raakt in de zin
      van [artikel 2, derde lid, van de Rijkswet goedkeuring en bekendmaking verdragen][ref4], worden de landen
      betrokken. In geval van ‘anderszins raken’ wordt voor de parlementaire goedkeuring de rijksprocedure in brede zin
      toegepast. Deze procedure houdt in dat het verdrag wordt geagendeerd voor de rijksministerraad, dat de Afdeling
      advisering van de Raad van State van het Koninkrijk om advies wordt gevraagd en dat het verdrag aan de Staten
      van de Caribische landen wordt overgelegd. Dit overleggen heeft een informerend karakter. Bij een uitdrukkelijke
      goedkeuringsprocedure leidt de rijksprocedure in brede zin tot een gewone wet (en dus niet een rijkswet). Het
      Ministerie van Buitenlandse Zaken maakt in overleg met vakdepartementen een inschatting of een verdrag voor Aruba,
      Curaçao of Sint Maarten kan gelden of Aruba, Curaçao of Sint Maarten anderszins raakt. Die inschatting wordt
      gemaakt op grond van factoren zoals het insulaire karakter van de Caribische landen, de geografische ligging,
      klimatologische omstandigheden, kleinschaligheid, draagkracht, culturele verschillen, economische en sociale
      omstandigheden. Ingevolge het zesde lid van artikel 11 van het Statuut bepalen de landen uiteindelijk zelf of een
      verdrag hen raakt. De regeringen van Aruba, Curaçao en Sint Maarten worden alleen niet benaderd met betrekking tot
      verdragen waarvan zonder meer vaststaat dat zij alleen voor Nederland van belang zijn. Het is niet nodig dat een
      verdrag voor alle vier de landen van het Koninkrijk geldt. Gelding van het verdrag voor enkele van die landen van
      het Koninkrijk is ook mogelijk. Wanneer ook de interne verhouding tussen Aruba, Curaçao, Sint Maarten en Nederland
      in het geding is, wordt de Directie Constitutionele Zaken en Wetgeving van het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties bij de zaak betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002154#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002154#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0006799#Artikel2
