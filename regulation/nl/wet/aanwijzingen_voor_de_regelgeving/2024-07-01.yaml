  - number: '5.38'
    text: |-
      1 Indien het in bijzondere gevallen wenselijk wordt geacht ook anderen dan de bij of krachtens
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen algemene opsporingsambtenaren te belasten met
      de opsporing van bepaalde strafbare feiten die geen economisch delict zijn, wordt daarvoor het volgende model
      gebruikt:

      1. *Met de opsporing van de bij [artikel / de artikelen ...] strafbaar gestelde feiten zijn, onverminderd [artikel
      141 van het Wetboek van Strafvordering / artikel 184 van het Wetboek van Strafvordering BES], belast [aanduiding
      ambtenaren]. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in [de artikelen
      179 tot en met 182 en 184 van het Wetboek van Strafrecht / de artikelen 185 tot en met 188 en 190 van het Wetboek
      van Strafrecht BES], voor zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of
      ondernomen door henzelf.*

      2. *Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.*

      2 Aan buitengewoon opsporingsambtenaren worden in beginsel naast de hun op grond van het
      [Wetboek van Strafvordering][ref2] en de [Wet op de economische delicten][ref3] toekomende bevoegdheden geen
      bijzondere opsporingsbevoegdheden toegekend.


          **Toelichting**
          Voor de aanwijzing van opsporingsambtenaren voor economische delicten bevat
      [artikel 17 van de Wet op de economische delicten][ref4] (Wed) al een regeling. Het onderhavige model
      is bestemd voor gevallen waarin het wenselijk is om voor commune delicten in bijzondere wetten naast
      [artikel 141 van het Wetboek van Strafvordering][ref5] (Sv) andere ambtenaren met de opsporing van strafbare
      feiten te belasten. De feitelijke bevoegdheid tot aanwijzing kan in de bijzondere wet zelf geschieden of worden
      gedelegeerd.
          Indien de bijzondere wet zelf de opsporingsambtenaren aanwijst (bijvoorbeeld de ambtenaren van een bepaalde
      dienst) wordt in het eerste lid van de modelbepaling na het woord ‘belast’ ingevuld: de ambtenaren van ... (volgt
      de naam van de dienst).
          Indien de bijzondere wet de aanwijzing van de opsporingsambtenaren delegeert geschiedt deze delegatie
      bij voorkeur aan de Minister van Justitie en Veiligheid; delegatie aan de minister van het desbetreffende
      vakdepartement is formeel mogelijk, doch wordt minder wenselijk geacht. Bij delegatie van de aanwijzingsbevoegdheid
      wordt in het eerste lid van de modelbepaling na het woord ‘belast’ ingevuld: de bij besluit van Onze Minister van
      Justitie en Veiligheid aangewezen ambtenaren.
          De aldus bij of krachtens een bijzondere wet aangewezen opsporingsambtenaren zijn buitengewoon
      opsporingsambtenaar in de zin van [artikel 142, eerste lid, onder c, Sv][ref6]. Overigens dienen buitengewoon
      opsporingsambtenaren, alvorens hun taak feitelijk te kunnen uitoefenen, aan bepaalde vakbekwaamheids-
      en betrouwbaarheidseisen te voldoen en beëdigd te worden. Hieromtrent zijn regels gesteld in het
      [Besluit buitengewoon opsporingsambtenaar][ref7]. Dit besluit bevat ook regels over de legitimatie door
      buitengewoon opsporingsambtenaren. Het (Nederlandse) [Wetboek van Strafvordering][ref8] en de [Wed][ref9] zijn niet
      van toepassing in Bonaire, Sint Eustatius en Saba. In een (mede) voor die eilanden geldende regeling zal moeten
      worden aangesloten bij de corresponderende bepalingen uit het [Wetboek van Strafvordering BES][ref10]. Er bestaat
      voor Bonaire, Sint Eustatius en Saba geen tegenhanger van de [Wed][ref11].


