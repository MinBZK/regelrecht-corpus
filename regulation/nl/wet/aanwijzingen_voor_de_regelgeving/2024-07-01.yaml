  - number: '4.34'
    text: |-
      1 De ondertekening van een wet door een bewindspersoon brengt niet mee dat die bewindspersoon ook alle
      uitvoeringsregelingen mede moet voordragen en ondertekenen.

      2 Het niet ondertekenen van een wet door een bewindspersoon sluit niet uit dat die bewindspersoon als daartoe
      aanleiding is een of meer uitvoeringsregelingen (mede) ondertekent.


          **Toelichting**
          Welke minister of ministers een uitvoeringsregeling moeten voordragen of ondertekenen, blijkt doorgaans uit
      de ondertekening van de delegerende regeling en de aard van de materie of bij ministeriële regelingen uit de
      delegatiebepaling (zie ook de [aanwijzingen 2.27][ref1] en [2.28][ref2]).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
