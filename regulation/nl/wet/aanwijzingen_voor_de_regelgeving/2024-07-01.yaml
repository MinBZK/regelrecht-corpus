  - number: '5.63'
    text: |-
      1 Het verlenen van terugwerkende kracht geschiedt niet door de regeling in werking te laten treden op een tijdstip
      dat in het verleden ligt.

      2 Voor het verlenen van terugwerkende kracht wordt een van de volgende modellen gebruikt:

      A. Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking [op / met ingang van ...; zie
      aanwijzing 4.21] en werkt [ten aanzien van artikel... / de artikelen...] terug tot en met...

      B. Deze wet / Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. In dat besluit kan
      worden bepaald dat [artikel ... / de artikelen ... van] deze wet / dit besluit [terugwerkt / terugwerken] tot en
      met [... / een in dat besluit te bepalen tijdstip] [, dat voor de verschillende artikelen of onderdelen daarvan
      verschillend kan worden vastgesteld].

      3 Indien dit voor de duidelijkheid van de beoogde rechtsgevolgen van terugwerkende kracht nodig is, worden meer
      gespecificeerde bepalingen opgenomen.

      4 In de toelichting wordt vermeld om welke reden en tot en met welk tijdstip het verlenen van terugwerkende kracht
      noodzakelijk is of kan zijn.


          **Toelichting**
          Zie ook [aanwijzing 4.16, eerste lid][ref1].
          Indien het wenselijk is om uitdrukkelijk aan te geven in hoeverre een wet toepasselijk is op feiten die in
      het verleden hebben plaatsgevonden, kan het volgende voorbeeld worden gebruikt: Artikel 10 vindt voor het eerst
      toepassing met betrekking tot feiten die in het jaar 2015 hebben plaatsgevonden.
          Niet toegestaan is het gebruik van de formulering ‘Deze wet wordt geacht in werking te zijn getreden met ingang
      van ...’ (zie hiervoor ook de [artikelen 88][ref2] en [89 van de Grondwet][ref3]).
          De bevoegdheid om terugwerkende kracht te verlenen bij een inwerkingtredingsbesluit wordt zo mogelijk
      geclausuleerd op de punten van de reikwijdte en de datum van de terugwerkende kracht. Het is ook voorstelbaar dat
      dit nog niet bij voorbaat mogelijk is, omdat dat bijvoorbeeld afhangt van een toekomstige gebeurtenis. In dat geval
      wordt toegelicht op welke wijze het ingangsmoment van de terugwerkende kracht bepaald zal worden dan wel voor welke
      bepalingen dit mogelijk zal gelden.
          Indien nodig kunnen de modellen uit deze aanwijzing worden gecombineerd met die uit [aanwijzing 4.22][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel88
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
