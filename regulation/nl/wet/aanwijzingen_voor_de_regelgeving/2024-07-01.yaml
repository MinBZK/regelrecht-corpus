  - number: '3.27'
    text: |-
      1 Verwijzing naar andere bepalingen wordt vermeden indien de toegankelijkheid van de regeling daardoor onnodig
      wordt geschaad.

      2 Verwijzing naar bepalingen die zelf een verwijzing inhouden en verwijzing naar latere bepalingen van de regeling
      worden bij voorkeur vermeden.

      3 In een regeling wordt niet verwezen naar een met name genoemde lagere regeling.

      4 Verwijzing binnen een artikel wordt zoveel mogelijk vermeden.


          **Toelichting**
          **Eerste lid.**Verwijzing kan wenselijk zijn indien anders meermalen in een regeling dezelfde bepaling zou
      moeten worden uitgeschreven.
          **Tweede lid.**Met name bij begripsbepalingen zal verwijzing naar latere bepalingen onvermijdelijk kunnen zijn.
          **Derde lid.**Door een lagere regeling niet met name te noemen maar te verwijzen naar de grondslag waarop
      die regeling berust, blijft een verwijzing ook geldig bij wijziging of vervanging van de lagere regeling waarnaar
      inhoudelijk verwezen wordt.
          **Vierde lid.**Het komt de leesbaarheid ten goede om binnen een artikel geen onnodige verwijzingen tussen
      de verschillende leden of onderdelen van dat artikel op te nemen. Indien bijvoorbeeld uit het eerste lid van een
      artikel duidelijk blijkt dat het artikel slechts betrekking heeft op aanvragen van een bepaald type vergunning,
      kan in de verdere leden van het artikel worden volstaan met ‘de aanvraag’. Het is dan niet nodig om in die verdere
      leden van ‘een aanvraag als bedoeld in het eerste lid’ te spreken. Nadere precisering is uiteraard wel nodig,
      indien het eerste lid op verschillende soorten aanvragen ziet, en de in een verder lid vervatte uitwerking slechts
      op één daarvan betrekking heeft.

          Het is verboden om nicotinehoudende vloeistof, tabaksproducten en aanverwante producten in de handel te
      brengen, indien die producten niet aan de krachtens artikel 2, eerste, tweede, en vijfde lid, gestelde eisen
      voldoen. ([Artikel 3, eerste lid, van de Tabaks- en rookwarenwet][ref1])

          Een ieder kan het bureau schriftelijk verzoeken een advies uit te brengen omtrent de toepasselijkheid van de in
      artikel 75, eerste lid, genoemde nietigheidsgronden op een krachtens deze rijkswet verleend octrooi.
      Het verzoek bevat een gemotiveerde aanduiding van de aan artikel 75, eerste lid, ontleende bezwaren tegen het
      verleende octrooi waaromtrent een advies wordt verlangd.
      Bij of krachtens algemene maatregel van rijksbestuur worden regels gesteld met betrekking tot de voor het advies
      verschuldigde vergoeding. ([Artikel 84 van de Rijksoctrooiwet 1995][ref2])


