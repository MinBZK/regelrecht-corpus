  - number: '5.18'
    text: |-
      1 Voor de voor de inwerkingtreding van een besluit van een bestuursorgaan vereiste toestemming van een ander
      bestuursorgaan wordt de term ‘*goedkeuring*’ gebruikt.

      2 Voor de voor het nemen van een besluit door een bestuursorgaan vereiste toestemming van een ander bestuursorgaan
      wordt de term ‘*verklaring van geen bezwaar*’ gebruikt.


          **Toelichting**
          Zowel bij goedkeuring als bij een verklaring van geen bezwaar is sprake van voorafgaand toezicht op
      bestuursorganen. Het verschil is dat een besluit omtrent goedkeuring wordt genomen ten aanzien van een al bestaand
      maar nog niet werkend besluit, terwijl een verklaring van geen bezwaar een belemmering opheft voor het onder
      toezicht gestelde orgaan om een bepaald besluit te nemen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.18
  - number: '5.19'
    text: |-
      Indien de bevoegdheid wordt toegekend om bij het verlenen van een vrijstelling, ontheffing of vergunning een
      begrenzing naar tijd of plaats dan wel anderszins aan te brengen, wordt de term ‘*beperking*’ gebruikt.


          **Toelichting**
          Naast begrenzingen naar tijd of plaats kan worden gedacht aan een begrenzing ten aanzien van het aantal te
      verrichten handelingen of een begrenzing in de aard van de te verrichten handelingen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.19
  - number: '5.20'
    text: |-
      1 Indien wordt beoogd de verplichtingen van een belanghebbende die hem bij het geven van een beschikking zijn
      opgelegd, door middel van straffen te handhaven, wordt deze strafbaarstelling uitdrukkelijk geregeld.

      2 Voor dergelijke en andere bij het geven van een beschikking op te leggen verplichtingen wordt de term
      ‘*voorschriften*’ gebruikt.


          **Toelichting**
          Het is niet juist het handelen in strijd met de voorschriften bij een vergunning als handelen zonder
      vergunning en op die grond strafbaar te beschouwen. Een voorbeeld van een juiste wijze van strafbaarstelling biedt
      [artikel 6][ref1] juncto [artikel 54 van de Wet wapens en munitie][ref2]. De term ‘voorwaarden’ wordt niet gebruikt
      voor verplichtingen als bedoeld in deze aanwijzing.
          **Tweede lid.**In [titel 4.2 Awb][ref3] (Subsidies) wordt ook voor de aan een subsidiebeschikking te verbinden
      voorschriften de overkoepelende term ‘verplichtingen’ gebruikt.


