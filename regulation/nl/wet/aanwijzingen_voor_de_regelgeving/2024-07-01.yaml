        bwb_id: BWBR0005730
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '6.14'
    text: |-
      Het vervallen van een bijlage bij een regeling wordt uitdrukkelijk geregeld.


          **Toelichting**
          Voor het laten vervallen van een bijlage kan niet worden volstaan met het laten vervallen van het artikel
      waarbij de bijlage behoort.
          Zie voor bijlagen ook de [aanwijzingen 3.61][ref1] en [3.62][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
