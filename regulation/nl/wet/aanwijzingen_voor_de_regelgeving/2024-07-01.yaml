      In de wet wordt geen formele betrokkenheid van het parlement bij gedelegeerde regelgeving geregeld tenzij daarvoor
      bijzondere redenen bestaan.


          **Toelichting**
          **Terughoudendheid met parlementaire betrokkenheid.** Het is wenselijk dat bij de verdeling van een regeling
      over de wet en algemeen verbindende voorschriften van lager niveau duidelijke keuzes worden gemaakt waarbij ofwel
      een onderwerp in de wet wordt geregeld, ofwel het geven van voorschriften daaromtrent wordt gedelegeerd aan een
      lagere regelgever. Bij voorkeur moet worden vermeden dat de vaststelling van bepaalde voorschriften aan een lagere
      regelgever wordt gedelegeerd en tegelijkertijd wordt vastgelegd dat het parlement bij deze regelgeving moet worden
      betrokken. In een enkel geval valt aan gedelegeerde regelgeving met parlementaire betrokkenheid echter niet te
      ontkomen. Zie de toelichting bij [aanwijzing 4.19][ref1] voor de afstemming tussen de inwerkingtreding van een
      voorhangbepaling en een met inachtneming daarvan tot stand te brengen gedelegeerde regeling.
          **Vormen van parlementaire betrokkenheid.** Er zijn vier vormen van parlementaire betrokkenheid te
      onderscheiden, te weten: gecontroleerde delegatie ([aanwijzing 2.36][ref2]), voorwaardelijke delegatie
      ([aanwijzing 2.37][ref3]), tijdelijke delegatie ([aanwijzing 2.39][ref4]) en delegatie onder het vereiste van
      goedkeuring bij wet ([aanwijzing 2.40][ref5]), elk met een andere mate van betrokkenheid van het parlement.
          In het algemeen wordt parlementaire betrokkenheid geregeld met betrekking tot bij algemene maatregel van
      bestuur te stellen regels. Het is echter ook denkbaar dat in een dergelijke betrokkenheid wordt voorzien ten
      aanzien van bij ministeriële regeling te stellen voorschriften. Gelet op de aard van dergelijke regels (zie
      [aanwijzing 2.24][ref6]) ligt een dergelijke betrokkenheid bij gecontroleerde en voorwaardelijke delegatie
      echter weinig voor de hand. Anders ligt dit evenwel bij tijdelijke delegatie en delegatie onder het vereiste van
      goedkeuring bij wet.
          Indien ten aanzien van bij ministeriële regeling te stellen voorschriften is voorzien in gecontroleerde of
      voorwaardelijke delegatie, zijn de [aanwijzingen 2.36][ref7], [2.37][ref8] en [2.38][ref9] van overeenkomstige
      toepassing. Hetzelfde geldt in het bijzondere geval dat ten aanzien van een inwerkingtredingsbesluit is voorzien in
      parlementaire betrokkenheid.


