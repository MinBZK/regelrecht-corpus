  - number: '5.43'
    text: |-
      1 Bij het vaststellen van een maximale bestuurlijke boetehoogte wordt verwezen naar een van de boetecategorieën
      in het [Wetboek van Strafrecht][ref1], tenzij het noodzakelijk is aan te sluiten bij afwijkende bedragen in een
      bestaand stelsel.

      2 Voor de bepaling waarin een maximale bestuurlijke boetehoogte wordt vastgesteld, wordt het volgende model
      gebruikt:

      *De op grond van [artikel ... / de artikelen ...] op te leggen bestuurlijke boete bedraagt ten hoogste het bedrag
      dat is vastgesteld voor de [...] categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht /
      artikel 27, vierde lid, van het Wetboek van Strafrecht BES].*

      3 Indien het vanwege de afschrikkende werking of grote financiële belangen noodzakelijk is om aan ondernemingen
      een zeer hoge bestuurlijke boete te kunnen opleggen die aansluit bij de hoogste boetecategorie in het
      [Wetboek van Strafrecht][ref2] of die, indien dat meer is, gerelateerd is aan de omzet van de desbetreffende
      onderneming, wordt het volgende model gebruikt:

      *De op grond van [artikel ... / de artikelen ...] op te leggen bestuurlijke boete bedraagt ten hoogste het bedrag
      dat is vastgesteld voor de zesde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht /
      artikel 27, vierde lid, van het Wetboek van Strafrecht BES] of, indien dat meer is, ten hoogste 10% van de omzet
      van de onderneming, onderscheidenlijk, indien de overtreding door een ondernemersvereniging is begaan, van de
      gezamenlijke omzet van de ondernemingen die van de vereniging deel uitmaken, in het boekjaar voorafgaande aan de
      beschikking waarin de bestuurlijke boete wordt opgelegd.*


          **Toelichting**
          **Algemeen.** Het nader rapport bestuurlijke boetestelsels van 26 april 2018 (Kamerstukken II 2017/18, 34 775-
      VI, nr. 102, en Stcrt. 2018, 31269) stelt eisen aan de motivering van de hoogte van een bestuurlijke boete. Die
      eisen zijn zwaarder indien het voornemen bestaat om te sanctioneren met hogere boetes dan de maxima die gelden
      op grond van [artikel 23 van het Wetboek van Strafrecht][ref3]. Het nader rapport noemt als gronden waarin dit
      gerechtvaardigd kan worden geacht de aansluiting bij EU-recht of de noodzaak tot voordeelsontneming. Zie daarom ook
      [aanwijzing 2.7][ref4] waarin verwezen wordt naar de criteria die bij die motivering in acht moeten worden genomen.
          **Eerste lid.** In bestuursrechtelijke wetgeving wordt de maximale hoogte van
      bestuurlijke boetes vastgesteld op een bedrag dat vergelijkbaar is met een van de
      geldboetecategorieën van [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5]
      ([artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref6]). Door de dynamische verwijzing worden de
      bedragen regelmatig geïndexeerd.
          **Derde lid.** In een aantal wetgevingscomplexen is het maximumbedrag niet gefixeerd,
      maar gerelateerd aan de omzet (zie bijvoorbeeld [artikel 57 van de Mededingingswet][ref7],
      [artikel 85 van de Wet marktordening gezondheidszorg][ref8] en
      [artikel 1:82 van de Wet op het financieel toezicht][ref9]). Een dergelijk open boetemaximum is aanvaardbaar, mits
      hiervoor een goede argumentatie kan worden gegeven, zoals de uiteenlopende grootte van ondernemingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
