  - number: '8.8'
    text: |-
      1 Indien een verdrag een verwijzing bevat naar een instantie die voor het Koninkrijk bindende besluiten kan nemen
      en die instantie niet kan worden aangemerkt als orgaan van een volkenrechtelijke organisatie in de zin van de
      [artikelen 92][ref1], [93][ref2] en [94 van de Grondwet][ref3], wordt het verdrag goedgekeurd bij wet.

      2 In het wetsvoorstel tot goedkeuring van het verdrag wordt in dat geval een machtigingsbepaling opgenomen,
      inhoudende dat de besluiten die door deze instantie worden genomen, geen goedkeuring van de Staten-Generaal
      behoeven.


          **Toelichting**
          Als voorbeeld wordt verwezen naar een verdrag uit 2010 waarin een raad is aangewezen
      die besluiten kan nemen, terwijl die raad geen volkenrechtelijke organisatie is in de
      zin van de [artikelen 92][ref4], [93][ref5] en [94 van de Grondwet][ref6]. Het betreft
      de FABEC-Raad en zijn besluiten waarvoor een machtigingsbepaling is opgenomen in
      __REF003___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ________________________________________________________________ (Stb. 2012, 509). Deze aanwijzing is ook
      van toepassing indien onduidelijk is hoe de instantie gekwalificeerd moet worden in het licht van de genoemde
      grondwettelijke bepalingen.
          Zie ook de [artikelen 4][ref8] en [7, onderdeel a, van de Rijkswet goedkeuring en bekendmaking verdragen][ref9].
      Zie voor de formulering van de in het tweede lid bedoelde machtigingsbepaling [aanwijzing 8.12, derde lid][ref10].


