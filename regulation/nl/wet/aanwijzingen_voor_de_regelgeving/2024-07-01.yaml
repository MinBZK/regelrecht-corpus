  - number: '7.22'
    text: |-
      1 Intrekking van een bij de Tweede of de Eerste Kamer aanhangig wetsvoorstel geschiedt bij brief van de betrokken
      bewindspersoon, daartoe gemachtigd door de Koning.

      2 Is het wetsvoorstel aanhangig bij de Eerste Kamer, dan wordt ook aan de voorzitter van de Tweede Kamer mededeling
      gedaan van de intrekking.


          **Toelichting**
          De intrekkingsbrief kan uitgaan van alle ondertekenende bewindspersonen of van de eerstverantwoordelijke,
      mede namens de andere. Het voornemen om een wetsvoorstel in te trekken, wordt in de ministerraad behandeld
      ([artikel 4, tweede lid, onderdeel a, van het reglement van orde voor de ministerraad][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0006501#Artikel4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.22
