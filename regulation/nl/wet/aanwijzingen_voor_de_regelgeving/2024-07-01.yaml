  - number: '2.16'
    text: |-
      Bij het opstellen van een regeling wordt onderzocht of de regeling moet gelden voor het gehele grondgebied van
      Nederland, of uitsluitend voor het Europese deel van Nederland, dan wel uitsluitend voor Bonaire, Sint Eustatius
      en Saba.


          **Toelichting**
          Bonaire, Sint Eustatius en Saba hebben op grond van
      [artikel 2 van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] een eigen rechtsstelsel,
      dat grotendeels bestaat uit overgenomen Nederlands-Antilliaanse regelgeving of specifiek voor die eilanden tot
      stand gebrachte regelgeving. Slechts een beperkt aantal regelingen is zowel in het Europese deel van Nederland
      als in Bonaire, Sint Eustatius en Saba van toepassing. Een ander belangrijk verschil met het Europese deel van
      Nederland is dat Bonaire, Sint Eustatius en Saba ten opzichte van de Europese Unie de status hebben van landen en
      gebieden overzee (LGO), waardoor EU-regelgeving in beginsel niet voor Bonaire, Sint Eustatius en Saba geldt. Dit
      betekent dat Bonaire, Sint Eustatius en Saba vanuit Europeesrechtelijk perspectief doorgaans als ‘derde landen’
      zullen moeten worden aangemerkt, en dat met ‘lidstaat’ uitsluitend het Europese deel van Nederland wordt bedoeld.
          Bij de afweging of een nieuwe regeling mede voor Bonaire, Sint Eustatius en Saba moet gelden, wordt – behalve
      met de LGO-status van de eilanden – rekening gehouden met enerzijds de wens zoveel mogelijk rechtseenheid tot stand
      te brengen en anderzijds de in [artikel 132a, vierde lid, van de Grondwet][ref2] genoemde bijzondere omstandigheden
      waardoor Bonaire, Sint Eustatius en Saba zich wezenlijk onderscheiden van het Europese deel van Nederland (zie
      ook Kamerstukken II 2011/12, 33 131, nr. 3, p. 4–5). Deze bijzondere omstandigheden kunnen aanleiding zijn om een
      regeling uitsluitend voor het Europese deel van Nederland te laten gelden of een specifieke regeling voor Bonaire,
      Sint Eustatius en Saba tot stand te brengen. Vanwege de onderlinge verschillen tussen de eilanden is het in
      bijzondere gevallen ook denkbaar dat een specifieke regeling voor een bepaald eiland wordt getroffen.
          Zie ook de [aanwijzingen 4.43, onderdeel i][ref3], en [5.4][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel132a
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
