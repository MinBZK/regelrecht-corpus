  - number: '5.29'
    text: |-
      1 Een vergunningstelsel in de zin van [artikel 2, eerste lid, van de Dienstenwet][ref1]:

      a. wordt slechts opgenomen indien dit geen discriminerende werking heeft ten opzichte van de betrokken
      dienstverrichter, dit noodzakelijk is wegens een dwingende reden van algemeen belang, en het nagestreefde doel niet
      door een minder beperkende maatregel kan worden bereikt, met name omdat een controle achteraf te laat zou komen om
      werkelijk doeltreffend te zijn;

      b. wordt uitsluitend van de werking van [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] uitgezonderd
      wegens dwingende redenen van algemeen belang, met inbegrip van de belangen van derden.

      2 Indien de conflictregel van artikel 3 van de Dienstenrichtlijn en
      [artikel 2, derde lid, onder a, sub 3, van de Dienstenwet][ref3] op een vergunningstelsel als bedoeld in het eerste
      lid van toepassing is, wordt dit toegelicht.

      3 Indien bij een vergunningstelsel als bedoeld in het eerste lid het aantal beschikbare vergunningen beperkt
      is, wordt een selectieprocedure ingesteld die alle waarborgen voor transparantie en onpartijdigheid biedt voor
      gegadigden, met inbegrip van met name een toereikende bekendmaking van de opening, uitvoering en afsluiting van
      de procedure.


          **Toelichting**
          [Richtlijn 2006/123/EG](32006L0123) van het Europees Parlement en de Raad van 12 december 2006 betreffende
      diensten op de interne markt, de Dienstenrichtlijn, definieert het begrip ‘vergunningstelsel’ in artikel 4, zesde
      lid, als ‘elke procedure die voor een dienstverrichter de verplichting inhoudt om bij een bevoegde instantie
      stappen te ondernemen ter uitdrukkelijke of stilzwijgende toestemming voor de toegang tot of de uitoefening
      van een dienstenactiviteit’. De toepasselijkheid van de Dienstenrichtlijn brengt een aantal verplichtingen en
      beperkingen met zich. Tevens bevatten de [artikelen 28 e.v. van de Dienstenwet][ref4] specifieke bepalingen
      voor vergunningstelsels die onder de reikwijdte van de Dienstenrichtlijn vallen. Zie ook de toelichting bij
      [aanwijzing 5.56][ref5].
          **Eerste lid, onderdeel a.** Deze verplichting volgt uit artikel 9 van de Dienstenrichtlijn. Als dwingende
      redenen van algemeen belang gelden in ieder geval de redenen die door het Hof van Justitie van de Europese Unie
      zijn erkend.
          **Eerste lid, onderdeel b.** Ingevolge [artikel 28 van de Dienstenwet][ref6] is [paragraaf 4.1.3.3 Awb][ref7]
      van toepassing op de aanvraag van een vergunning die onder de reikwijdte van de Dienstenrichtlijn valt, tenzij
      bij wettelijk voorschrift anders is bepaald. [Paragraaf 4.1.3.3][ref8] bevat een regeling voor de totstandkoming
      van een positieve beschikking op een aanvraag bij het uitblijven van een beslissing binnen de termijn, meestal
      aangeduid als de lex silencio positivo. De Dienstenrichtlijn verplicht tot invoering van de lex silencio positivo,
      maar biedt de mogelijkheid om een uitzondering te maken indien dit gerechtvaardigd is wegens dwingende redenen
      van algemeen belang, met inbegrip van een rechtmatig belang van een derde partij. Daarnaast kan de lex silencio
      positivo naar zijn aard niet toepasbaar zijn op een vergunning in de zin van de Dienstenrichtlijn, omdat door het
      desbetreffende bestuursorgaan geen beslissing op een aanvraag in de zin van de [Awb][ref9] wordt genomen, of omdat
      de beoogde gevolgen van de vergunningverlening niet stilzwijgend tot stand kunnen worden gebracht, maar feitelijk
      handelen vergen van het bestuursorgaan. Hierbij valt te denken aan meld- en registratieplichten.
          **Tweede lid.** De conflictregel, ook wel voorrangsregel, is ingesteld om de verhouding tussen verplichtingen
      op grond van de Dienstenrichtlijn en verplichtingen op grond van andere bindende EU-rechtshandelingen te regelen.
      Indien toepassing van de Dienstenrichtlijn op een vergunningstelsel strijd oplevert met verplichtingen uit
      andere bindende EU-rechtshandelingen, gaan de desbetreffende andere verplichtingen voor. Om te voorkomen dat er
      onduidelijkheid ontstaat over de vraag of de Dienstenrichtlijn geheel of ten dele van toepassing is, is vermelding
      van de toepassing van de conflictregel in de toelichting aangewezen.
          **Derde lid.** Deze verplichting volgt uit artikel 12 van de Dienstenrichtlijn en ziet op de situatie dat
      het aantal beschikbare vergunningen voor een activiteit beperkt is door schaarste van de beschikbare natuurlijke
      hulpbronnen of de bruikbare technische mogelijkheden.


