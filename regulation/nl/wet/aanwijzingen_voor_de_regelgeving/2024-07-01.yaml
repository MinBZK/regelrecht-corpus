  - number: '3.58'
    text: |-
      1 Artikelen kunnen worden verdeeld in leden die worden aangeduid met Arabische cijfers.

      2 Een lid wordt niet verdeeld in alinea's.

      3 Indien de inhoud van een artikel zou leiden tot een groot aantal leden, wordt het artikel zo mogelijk gesplitst
      in meer artikelen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.58
  - number: '3.59'
    text: |-
      1 Indien het bij een opsomming in een artikel omwille van de duidelijkheid wenselijk is elk onderdeel daarvan op
      een nieuwe regel te laten beginnen, wordt de volgende werkwijze gevolgd:

      a. de onderdelen worden aangegeven met de letters a, b, c enzovoort, een eventuele verdere onderverdeling met 1°,
      2°, 3° enzovoort, waarbij achter deze letters en cijfers een punt wordt geplaatst;

      b. binnen de onderdelen wordt niet met een nieuwe zin begonnen;

      c. de onderdelen worden, met uitzondering van het laatste onderdeel, afgesloten met een puntkomma.

      2 Na het laatste onderdeel van een opsomming wordt geen tekst opgenomen die betrekking heeft op alle onderdelen,
      tenzij dit onvermijdelijk is.

      3 In een opsomming van begripsbepalingen wordt bij voorkeur een alfabetische volgorde zonder nummering of lettering
      gehanteerd.


          **Toelichting**
          **Eerste lid, onderdeel b.** Is bij een onderdeel van een opsomming een in een afzonderlijke zin vervatte
      nadere bepaling nodig, dan wordt deze in een afzonderlijk artikellid opgenomen.
          **Tweede lid.** Bij het opnemen van tekst die betrekking heeft op alle onderdelen, na het laatste onderdeel
      van een opsomming, is bij lezing vaak onduidelijk of die tekst betrekking heeft op alle onderdelen, dan wel deel
      uitmaakt van het laatste onderdeel. Het is vrijwel altijd mogelijk deze tekst op te nemen in de aanhef van de
      opsomming of in een apart lid.
          **Derde lid.** Bij deze werkwijze is het mogelijk om later begrippen toe te voegen in alfabetische volgorde
      zonder dat daardoor vernummering of verlettering van de opsommingstekens nodig is. Daarmee worden problemen
      voorkomen bij samenloop van wijzigingsregelingen. Zie voor samenloop ook [aanwijzing 5.69][ref1]. Zie voor het
      invoegen en het laten vervallen van begripsbepalingen de voorbeelden bij de aanwijzingen 6.11 en 6.12.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.59
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '5'
        paragraaf: '5.15'
  - number: '3.60'
    text: |-
      1 Indien dit voor de duidelijkheid nodig is, wordt door gebruik van het woord ‘*of*’ dan wel ‘*en*’
      aan het slot van het voorlaatste onderdeel van een opsomming het alternatieve, onderscheidenlijk
      cumulatieve karakter van de opsomming tot uitdrukking gebracht. In zo'n geval wordt in afwijking van
      [aanwijzing 3.59, eerste lid, onderdeel c][ref1], het voorlaatste onderdeel afgesloten met ‘*; of*’ dan wel ‘*;
      en*’.

      2 Uit de formulering van het artikel blijkt of een opsomming een limitatief of een enuntiatief karakter heeft.


          **Toelichting**
          Het enuntiatieve karakter van een opsomming kan worden uitgedrukt door de woorden ‘in ieder geval’
      of ‘ten minste’, het limitatieve karakter door de woorden ‘slechts’, ‘uitsluitend’, ‘alleen’. Zie ook
      [aanwijzing 3.12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
