        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 2.33.4
    text: Deze aanwijzing is van overeenkomstige toepassing op het vaststellen van een ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.33
  - number: '2.34'
    text: |-
      Indien een regeling voorziet in de verplichting of de bevoegdheid tot het vaststellen van uitvoeringsregelingen,
      wordt ter uitvoering van de hogere regeling zo mogelijk één algemene maatregel van bestuur of ministeriële regeling
      vastgesteld.

          [Arbeidsomstandighedenwet][ref1], [Arbeidsomstandighedenbesluit][ref2] en [Arbeidsomstandighedenregeling][ref3]
      [Binnenvaartwet][ref4], [Binnenvaartbesluit][ref5] en [Binnenvaartregeling][ref6].


