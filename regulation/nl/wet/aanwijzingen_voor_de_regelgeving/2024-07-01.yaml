  - number: '2.11'
    text: |-
      1 De voor een of meer belanghebbenden nadelige gevolgen van een voorgenomen regeling mogen niet onevenredig zijn in
      verhouding tot de daarmee te dienen doelen.

      2 Waar nodig voorziet een regeling in voldoende mogelijkheden om het bestuursorgaan in staat te stellen een besluit
      met onevenredige hardheid in een concreet geval te voorkomen.


          **Toelichting**
          **Eerste lid.** Ook wanneer geen minder bezwarende, even effectieve alternatieven worden gezien voor de
      voorgenomen regeling dient de vraag gesteld te worden of de ernst en omvang van het probleem de lasten en
      negatieve consequenties kunnen rechtvaardigen die de voorgenomen regeling in het leven zou roepen voor één of meer
      belanghebbenden (waarbij overigens niet alleen gedacht moet worden aan de geadresseerden van de norm maar ook aan
      indirect geraakte rechtssubjecten zoals gezinsleden, omwonenden, werknemers, etc.). Dit is met name een punt van
      aandacht bij regelgeving die als directe reactie op een incident wordt voorgesteld, omdat op dat moment nog niet
      altijd voldoende kennis bestaat over de objectieve noodzaak en redelijkheid van de voorgestelde maatregel.
          Deze aanwijzing correspondeert met [artikel 3:4, tweede lid, Awb][ref1].
          **Tweede lid.** Ten tijde van het tot stand brengen van regelingen zijn de concrete situaties waarin deze
      toegepast moeten worden meestal nog niet volledig bekend. Om bij de toepassing daarvan toch recht te kunnen doen
      aan de menselijke maat moeten regelingen voldoende mogelijkheden bieden aan het bestuursorgaan om onevenredige
      besluiten te kunnen voorkomen. Daarbij valt met name te denken aan:
          *categorisering in de normstelling:* hierbij voorziet de regel voor verschillende categorieën in verschillende
      uitkomsten (voorbeeld: verschillende boetehoogtes);
      *beoordelingsruimte:* hierbij wordt de inhoud van het besluit afhankelijk gesteld van een beoordeling door het
      bestuursorgaan van de feitelijke omstandigheden van het geval (voorbeeld: de vereiste mate van schuld/opzet);
      *beslisruimte:* hierbij wordt het bestuursorgaan een discretionaire bevoegdheid gegeven om de toepassing van de
      regel geheel of gedeeltelijk te mitigeren (voorbeeld: een bevoegdheid, in plaats van een verplichting, om een
      aanvraag af te wijzen wanneer niet geheel wordt voldaan aan bepaalde vormvoorschriften of termijnen);
      *nadeelcompensatie:* hierbij wordt voorzien in de mogelijkheid om bij een besluit dat meerdere betrokkenen raakt
      onevenredige hardheid ten aanzien van één of enkelen weg te nemen;
      *vrijstellings-/ontheffingsmogelijkheden:* hierbij wordt voorzien in de mogelijkheid om een nader aan
      te wijzen groep van gevallen of individueel geval uit te zonderen van de werking van de regeling (zie
      [aanwijzing 5.17][ref2]).
          Voor zover niet vaststaat dat de primaire normstelling voldoende ruimte zal bieden om onevenredige
      besluiten te voorkomen, kan daarnaast worden gedacht aan de opname van een algemene hardheidsclausule, zie
      [aanwijzing 5.25][ref3].


