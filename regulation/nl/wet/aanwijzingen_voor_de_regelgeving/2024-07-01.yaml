    text: |-
      De tijdelijkheid van een regeling wordt in het opschrift en de citeertitel tot uitdrukking gebracht.


          **Voorbeelden**
          Wet van 4 december 2013 inzake invoering van een tijdelijke heffing voor de bankensector (Tijdelijke wet
      resolutieheffing 2014)
      Besluit van 16 februari 2001 tot regeling van de doeluitkering bestrijding van rampen en zware ongevallen voor de
      periode van 1 januari 2001 tot en met 31 december 2002 (Interim-besluit doeluitkering bestrijding van rampen en
      zware ongevallen).
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.72
  - number: '5.73'
    text: |-
      1 Indien het gewenst is tijdelijk van een bestaande regeling af te wijken, geschiedt dit in de vorm van:

      a. een zelfstandige afwijkende regeling met tijdelijke werking; of

      b. een wijzigingsregeling die opeenvolgende wijzigingen aanbrengt in de tijdelijk te wijzigen regeling.

      2 In het geval, bedoeld in het eerste lid, onderdeel b, wordt, indien mogelijk, de opvolgende wijziging opgenomen
      in de tijdelijk te wijzigen regeling zelf, en wordt daarin ook tot uitdrukking gebracht op welk tijdstip de
      opvolgende wijziging effect zal krijgen.


          **Toelichting**
          **Eerste lid.** Niet toelaatbaar is dus een bepaling als: ‘Voor de duur van drie jaar luidt artikel 10 als
      volgt’. Evenmin toelaatbaar is een constructie waarin door het laten vervallen van de wijzigingsregeling beoogd
      wordt de oorspronkelijke tekst te doen herleven (zie in dit verband ook [aanwijzing 6.26][ref1]).
          Bij de in onderdeel b bedoelde werkwijze, ook wel aangeduid als ‘dubbelwijziging’, wordt door middel van de
      eerste wijzigingsopdracht geregeld hoe de regeling komt te luiden gedurende de tijdelijke afwijkingsperiode, en
      regelt de tweede wijzigingsopdracht hoe deze komt te luiden na afloop van die periode.
          **Tweede lid.** Bij tijdelijke wijzigingen geniet het met het oog op de duidelijkheid en de rechtszekerheid
      de voorkeur om de komende wijziging in de tekst van de tijdelijk gewijzigde regeling zelf op te nemen en daarbij
      ook het moment aan te geven waarop die tweede wijziging effect zal krijgen. Daarmee wordt voorkomen dat de
      wijzigingsregeling moet worden geraadpleegd om te kunnen vaststellen hoe en wanneer de tijdelijk gewijzigde
      regeling opnieuw gewijzigd zal worden.

          Regeling A wordt als volgt gewijzigd: A Artikel 6 komt te luiden: **Artikel 6** (...) B Na artikel 11 wordt
      een artikel ingevoegd, luidende: **Artikel 12** Met ingang van 1 januari 2022 komt artikel 6 te luiden: **Artikel
      6** (...)


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
