  - number: '3.38'
    text: |-
      1 Een verdrag wordt aangehaald overeenkomstig het volgende voorbeeld:

      *het op 20 juni 1956 te New York tot stand gekomen Verdrag inzake verhaal in het buitenland van uitkeringen tot
      onderhoud (* *Trb. 1957, 121* *).*

      2 Bij verdragen met een citeertitel of daarmee vergelijkbare aanduiding kunnen datum en plaats van totstandkoming
      en het nummer van het Tractatenblad worden weggelaten.


          **Toelichting**
          Het aangehaalde Tractatenblad dient de authentieke tekst van het verdrag te bevatten en niet slechts de
      vertaling.

          Verdrag betreffende de werking van de Europese Unie
      Verdrag tot instelling van de Benelux Economische Unie.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.38
  - number: '3.39'
    text: |-
      Verkorte verwijzing in de toelichting bij een regeling naar artikelen van het Verdrag betreffende de Europese Unie,
      het Verdrag betreffende de werking van de Europese Unie, het Verdrag tot oprichting van de Europese Gemeenschap
      voor Atoomenergie, het Europees Verdrag tot bescherming van de rechten van de mens en de fundamentele vrijheden en
      het Internationaal verdrag inzake burgerrechten en politieke rechten geschiedt respectievelijk overeenkomstig de
      volgende voorbeelden:

      − *artikel 6 VEU;*

      − *artikel 18 VWEU;*

      − *artikel 150 VEGA;*

      − *artikel 6 EVRM;*

      − *artikel 17 IVBPR.*


          **Toelichting**
          In verband met de leesbaarheid kan, nadat de titel van het verdrag de eerste keer volledig is uitgeschreven,
      een verkorte verwijzing naar artikelen van de Europese verdragen aangewezen zijn. In de toelichting bij een
      regeling kunnen voor een verkorte aanduiding van het Verdrag betreffende de Europese Unie en het Verdrag
      betreffende de werking van de Europese Unie ook ‘EU-verdrag’ en ‘Werkingsverdrag’ worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.39
  - number: '3.40'
    text: |-
      In regelingen worden de instellingen, verdragen, regelgeving en de lidstaten van de Europese Unie, dan wel de
      Europese Gemeenschap voor Atoomenergie, alsmede hun grondgebied als volgt aangeduid:

      − *het Europees Parlement;*

      − *de Europese Raad;*

      − *de Raad van de Europese Unie;*

      − *de Europese Commissie;*

      − *het Hof van Justitie van de Europese Unie;*

      − *de Europese Centrale Bank;*

      − *de Europese Rekenkamer;*

      − *het Verdrag betreffende de werking van de Europese Unie;*

      − *het Verdrag betreffende de Europese Unie;*

      − *het Verdrag tot oprichting van de Europese Gemeenschap voor Atoomenergie;*

      − *EU-verordeningen, EU-richtlijnen, EU-besluiten;*

      − *bindende EU-rechtshandelingen, EU-rechtshandelingen, EU-regelgeving;*

      − *Euratom-verordeningen, Euratom-richtlijnen, Euratom-besluiten;*

      − *lidstaten van de Europese Unie;*

      − *gebieden waarop het Verdrag betreffende de Europese Unie van toepassing is.*


          **Toelichting**
          Deze terminologie vloeit voort uit artikel 13 VEU en artikel 288 VWEU. Bij een aantal begrippen is ten opzichte
      van de Europese terminologie ‘van de Europese Unie’, ‘Europese’ of ‘EU’ toegevoegd om verwarring met Nederlandse
      equivalenten te voorkomen. Zie met betrekking tot regelgeving van de Europese Unie ook [aanwijzing 1.3][ref1].
          Tenzij anders bepaald omvat een verwijzing naar een EU-instelling e.d. mede de instelling e.d. zoals die
      krachtens de voorgaande EU-verdragen getiteld was. Een algemene verwijzing naar bindende EU-rechtshandelingen met
      betrekking tot een bepaald onderwerp omvat derhalve tevens bindende rechtshandelingen die tot stand zijn gebracht
      in het kader van de EEG of de EG.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk1
