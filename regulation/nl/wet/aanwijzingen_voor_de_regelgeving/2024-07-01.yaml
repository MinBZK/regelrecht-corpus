  - number: '5.26'
    text: |-
      1 Indien in een regeling een hardheidsclausule wordt opgenomen, wordt zo concreet en nauwkeurig mogelijk aangegeven
      op welke onderdelen van de regeling de clausule van toepassing is.

      2 Voor een hardheidsclausule wordt het volgende model als uitgangspunt genomen:

      *[aanduiding bestuursorgaan] kan artikel ... buiten toepassing laten of daarvan afwijken voor zover toepassing
      gelet op het belang van [aanduiding doel of strekking van de regeling] zal leiden tot een onbillijkheid van
      overwegende aard.*


          **Toelichting**
          **Eerste lid.** Gelet op de bij [aanwijzing 5.25][ref1] genoemde mogelijke bezwaren van het opnemen van
      hardheidsclausules in regelingen, is in deze aanwijzing vastgelegd dat zo concreet en nauwkeurig mogelijk wordt
      aangegeven op welke onderdelen van de regeling deze clausule van toepassing is. Daarmee blijft onverlet de
      mogelijkheid van een algemene hardheidsclausule in een algemene wet die geldt voor een aantal bijzondere wetten,
      zoals het geval is in de belastingwetgeving.
          **Tweede lid.**In de zinsnede ‘gelet op het belang van ...’ moet zo concreet mogelijk het doel of de strekking
      van de regeling worden omschreven. Als dit niet goed mogelijk is, kan de volgende formulering worden gebruikt:
      ‘gelet op het belang dat dit artikel / deze regeling beoogt te beschermen’. Een hardheidsclausule impliceert geen
      delegatie van regelgevende bevoegdheid: hij geeft slechts een beschikkingsbevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
