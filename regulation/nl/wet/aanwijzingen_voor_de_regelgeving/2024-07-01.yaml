        hoofdstuk: '4'
        paragraaf: '4.8'
  - number: '4.40'
    text: |-
      1 De tijdens de parlementaire behandeling van een wetsvoorstel door de regering in te dienen stukken worden bij
      voorkeur alleen ondertekend door de eerstverantwoordelijke bewindspersoon.

      2 De medebetrokkenheid van een of meer andere bewindspersonen wordt in de tekst tot uitdrukking gebracht.


          **Toelichting**
          **Tweede lid.**De medebetrokkenheid kan in de inleiding van het stuk tot uitdrukking worden gebracht (zie
      het eerste voorbeeld) of als slotzin, voorafgaand aan de ondertekening (zie het tweede voorbeeld). Zie ook
      [aanwijzing 4.53][ref1].

          In deze nota ga ik, mede namens de Minister-President, Minister van Algemene Zaken en de Minister van
      Veiligheid en Justitie, in op de vragen en opmerkingen in het verslag. (Kamerstukken II 2016/17, 34517, nr. 6)
      Deze toelichting wordt ondertekend mede namens de Minister van Onderwijs, Cultuur en Wetenschap. (Kamerstukken II
      2015/16, 34363, nr. 3)


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
