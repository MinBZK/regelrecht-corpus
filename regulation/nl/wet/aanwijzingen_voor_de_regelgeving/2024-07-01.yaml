  - number: '1.1'
    text: |-
      Deze aanwijzingen hebben betrekking op regelingen die onder ministeriële verantwoordelijkheid tot stand komen,
      en, voor zover uitdrukkelijk aangegeven, op verdragen, bindende besluiten van instellingen van de Europese Unie en
      andere besluiten van volkenrechtelijke organisaties.
          **Toelichting**
          In deze aanwijzingen staan met name de wetgevingstechniek en de wetgevingskwaliteit centraal. Zie voor de meer
      procedurele en organisatorische aspecten van het wetgevingsproces het Draaiboek voor de regelgeving, te raadplegen
      op de website van het Kenniscentrum voor beleid en regelgeving ([www.kcbr.nl](http://www.kcbr.nl)). Het Draaiboek
      bevat ook de modelbrieven die behoren bij de verschillende fasen van het wetgevingsproces.
          Zie voor de toepasselijkheid van de aanwijzingen op internationale regelingen en bindende EU-rechtshandelingen
      de [hoofdstukken 8][ref1] en [9][ref2]. Zie met betrekking tot de voorbereiding, totstandkoming en nationale
      implementatie van Europese regelgeving ook de Handleiding Wetgeving en Europa, eveneens te raadplegen op de website
      van het Kenniscentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
