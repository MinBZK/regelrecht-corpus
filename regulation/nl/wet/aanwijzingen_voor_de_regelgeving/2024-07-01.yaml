  - number: '1.2'
    text: |-
      1 Deze aanwijzingen worden in acht genomen door de ministers en staatssecretarissen en de onder hen ressorterende
      personen die bij de voorbereiding en vaststelling van regelingen zijn betrokken.

      2 Afwijking van deze aanwijzingen is slechts toegestaan, indien onverkorte toepassing daarvan uit een oogpunt van
      goede regelgeving niet tot aanvaardbare resultaten zou leiden.


          **Toelichting**
          **Eerste lid.** De aanwijzingen kunnen zich naar hun aard niet richten tot niet onder het gezag van
      ministers en staatssecretarissen werkzame participanten in het proces van regelgeving, zoals de Staten-Generaal,
      adviescolleges op het terrein van de wetgeving, zelfstandige bestuursorganen en decentrale overheden. De
      aanwijzingen kunnen deze organen dus niet binden. Niettemin verdient het aanbeveling dat de Staten-Generaal met
      de aanwijzingen rekening houden. Wat de Tweede Kamer betreft, verdient het aanbeveling dat op de aanwijzingen acht
      wordt geslagen bij het opstellen van amendementen en initiatiefvoorstellen van wet. Voor zover adviescolleges en
      zelfstandige bestuursorganen betrokken zijn bij de opstelling van regelingen of de advisering daarover, is het van
      belang dat rekening wordt gehouden met de aanwijzingen.
          **Tweede lid.** De aanwijzingen hebben voor de in het eerste lid genoemden bindende kracht. Er kunnen zich
      gevallen voordoen waarin toepassing van een aanwijzing uit het oogpunt van goede regelgeving niet tot aanvaardbare
      resultaten leidt. In dergelijke gevallen kan worden afgeweken van de aanwijzingen. Voor zover aanwijzingen
      elementen bevatten die reeds uit algemeen verbindende voorschriften voortvloeien, zal uiteraard van afwijking geen
      sprake kunnen zijn. Het is in het bijzonder de taak van de departementale wetgevingsafdelingen erop toe te zien dat
      van de mogelijkheid tot afwijking een terughoudend en gemotiveerd gebruik wordt gemaakt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel1.2
  - number: '1.3'
    text: |-
      1 Onder regelingen wordt in deze aanwijzingen verstaan:

      a. algemeen verbindende voorschriften;

      b. interne regels;

      c. beleidsregels.

      2 Onder EU-regelgeving wordt in deze aanwijzingen verstaan: door de instellingen van de Europese Unie of de
      Europese Gemeenschap voor Atoomenergie vastgestelde:

      a. verordeningen;

      b. richtlijnen.

      3 Onder bindende EU-rechtshandelingen wordt in deze aanwijzingen verstaan: door de instellingen van de Europese
      Unie of de Europese Gemeenschap voor Atoomenergie vastgestelde:

      a. verordeningen;

      b. richtlijnen;

      c. besluiten zonder vermelding van adressaten;

      d. besluiten met vermelding van adressaten, voor zover mede tot Nederland gericht.


          **Toelichting**
          **Eerste lid.** Zie voor een nadere omlijning van deze begrippen [aanwijzing 2.17][ref1] en
      [titel 4.3 Awb][ref2]. Aan interne regels en beleidsregels hoeft niet altijd de eis te worden gesteld dat zij ook
      wat betreft vormgeving het karakter van regelgeving hebben. Indien mogelijk dienen beleidsregels echter te worden
      ingedeeld in artikelen. Op beleidsregels in artikelvorm kunnen de op de vormgeving van regelingen betrekking
      hebbende aanwijzingen onverkort worden toegepast. Aanwijzingen van inhoudelijke aard, met name die betreffende
      het gebruik van regelgeving als instrument ([paragraaf 2.1][ref3]), kunnen op alle vormen van beleidsregels
      toepassing vinden. Bij interne regels zal de vormgeving in belangrijke mate afhangen van de doelgroep. Voor
      het [reglement van orde voor de ministerraad][ref4] ligt vormgeving als regelgeving meer voor de hand dan voor
      bijvoorbeeld gedragscodes voor alle geledingen van de rijksoverheid. In dat geval zal een minder formele vormgeving
      mogelijk meer aangewezen zijn.
          **Tweede lid.** Zie voor een nadere omlijning van deze begrippen artikel 288 VWEU. Onder deze benaming
      worden tevens verordeningen, richtlijnen en kaderbesluiten verstaan die tot stand zijn gekomen voorafgaand aan
      de inwerkingtreding van het Verdrag van Lissabon, alsmede verordeningen en richtlijnen vastgesteld op grond van
      artikel 106bis van het Euratomverdrag.
          **Derde lid.** Dit lid doelt op de juridisch bindende handelingen, genoemd in artikel 288 VWEU. Ook in
      dit geval kan het tevens gaan om juridisch bindende handelingen die zijn vastgesteld op grond van artikel
      106bis van het Euratomverdrag. Door de toevoeging van ‘bindende’ aan ‘EU-rechtshandelingen’ worden de overige
      rechtsinstrumenten van artikel 288 VWEU uitgesloten.
          Het oude begrip ‘beschikking’ uit artikel 249 EG-Verdrag is met het Verdrag van Lissabon vervangen door
      ‘besluit’. Het vereiste van een concrete adressaat is daarbij vervallen. Het nieuwe besluitbegrip uit artikel 288
      VWEU omvat twee typen rechtshandelingen: besluiten met adressaat die vooral gebruikt worden voor gevallen waarin
      onder het EG-verdrag beschikkingen golden, en besluiten zonder adressaat. Zie ook de Handleiding Wetgeving en
      Europa.


