  - number: '5.16'
    text: |-
      1 Indien aan de orde, wordt bij wet bepaald op welke wijze de op het moment van instelling van een zelfstandig
      bestuursorgaan dat geen onderdeel uitmaakt van de rechtspersoon de Staat der Nederlanden, lopende wettelijke
      procedures en rechtsgedingen, respectievelijk onderzoeken door de Nationale ombudsman, worden afgehandeld.

      2 Hiervoor wordt het volgende model gebruikt:

      1. *In wettelijke procedures en rechtsgedingen, waarbij [naam dienstonderdeel] is betrokken, treedt op het tijdstip
      van inwerkingtreding van deze wet [naam rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt, dan wel
      zelfstandig bestuursorgaan] in de plaats van de Staat dan wel Onze Minister.*

      2. *In zaken waarin voor het tijdstip van inwerkingtreding van deze wet aan de Nationale ombudsman is verzocht een
      onderzoek te doen dan wel de Nationale ombudsman een onderzoek heeft ingesteld naar een gedraging die kan worden
      toegerekend aan [naam dienstonderdeel], treedt [naam zelfstandig bestuursorgaan] op dat tijdstip als bestuursorgaan
      in de zin van de Wet Nationale ombudsman in de plaats van Onze Minister.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.16
  - number: '5.17'
    text: |-
      1 Voor een besluit waarbij een uitzondering op een wettelijk verbod of gebod wordt gemaakt voor een categorie van
      gevallen, wordt de term ‘*vrijstelling*’ gebruikt.

      2 Voor een beschikking waarbij in een individueel geval een uitzondering op een wettelijk verbod of gebod wordt
      gemaakt, wordt de term ‘*ontheffing*’ gebruikt.

      3 Voor een beschikking waarbij een bepaalde handeling wordt toegestaan, wordt de term ‘*vergunning*’ gebruikt.

      4 Voor een beschikking waarbij wordt vastgesteld dat een persoon of instelling aan bepaalde eisen voldoet, wordt de
      term ‘*erkenning*’ gebruikt.


          **Toelichting**
          Het gebruik van andere termen voor deze figuren zoals toestemming, instemming of verlof wordt vermeden. Zie
      [aanwijzing 5.29][ref1] voor vergunningen in de zin van [artikel 2, eerste lid, van de Dienstenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0026759#Artikel2
