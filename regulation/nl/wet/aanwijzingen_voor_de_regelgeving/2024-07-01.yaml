  - number: '2.21'
    text: |-
      Zoveel mogelijk worden in de wet opgenomen voorschriften:

      a. die de grondslag vormen voor een stelsel van vergunningen of een stelsel waarbij anderszins de toelaatbaarheid
      van handelingen afhankelijk wordt gesteld van toestemming van de overheid;

      b. die andere overheden in medebewind roepen;

      c. waarbij bestuursorganen in het leven worden geroepen;

      d. betreffende rechtsbescherming;

      e. inzake sancties van bestuursrechtelijke of civielrechtelijke aard;

      f. waarbij toezichts- of opsporingsbevoegdheden worden toegekend;

      g. omtrent rechten en verplichtingen van burgers jegens elkaar;

      h. die beogen aan de burger procedurele waarborgen te bieden ten aanzien van het gebruik van bevoegdheden door
      de overheid.


          **Toelichting**
          Deze aanwijzing somt een aantal categorieën van voorschriften op ten aanzien waarvan niet reeds uit de
      [Grondwet][ref1] voortvloeit dat zij bij wet moeten worden vastgesteld maar vaststelling bij wet niettemin, gelet
      op het primaat van de wetgever, wenselijk is. Het gaat om een opsomming met een enuntiatief karakter.
          **Onderdeel a: vergunningenstelsels.** Dit onderdeel laat de mogelijkheid open dat een vergunningenstelsel niet
      in de wet zelf in het leven wordt geroepen, maar dat in de wet wordt volstaan met het uitdrukkelijk opnemen van de
      mogelijkheid dat bij algemene maatregel van bestuur voor nader omschreven gedragingen een vergunningplicht wordt
      ingesteld.
          Onderdeel a geldt ook indien vergunningen niet met die term worden aangeduid maar met een andere benaming zoals
      erkenning. Het voorschrift heeft echter geen betrekking op gevallen waarin op basis van bijzondere omstandigheden
      ontheffing kan worden verleend van een verbod of gebod.
          **Onderdeel c: bestuursorganen.** Zie voor zelfstandige bestuursorganen [paragraaf 5.4][ref2].
          **Onderdeel h: procedurele waarborgen voor burgers.** Onderdeel h heeft betrekking op procedurele waarborgen
      die aan de burger worden geboden met betrekking tot het handelen van de overheid. Dit onderdeel ziet niet op
      voorschriften van administratieve aard die ertoe strekken een ordelijk en vlot verloop van het contact tussen
      burger en overheid en het functioneren van het overheidsapparaat te vergemakkelijken. Procedurele waarborgen zijn
      bijvoorbeeld voorschriften die het horen van belanghebbenden alvorens te beslissen voorschrijven, recht op inzage
      van bepaalde stukken bieden, de verplichting scheppen tot vaststellen en bekendmaken van beleidsvoornemens of de
      plicht opleggen bepaalde instanties om advies te vragen. Voorschriften van administratieve aard zijn bijvoorbeeld
      voorschriften omtrent modellen of formulieren, het verplichten tot het meezenden van bepaalde bescheiden of de
      wijze van indienen van stukken.
          Zie voor voorschriften omtrent financiële aanspraken jegens de overheid [titel 4.2 Awb][ref3] (Subsidies).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0005537
