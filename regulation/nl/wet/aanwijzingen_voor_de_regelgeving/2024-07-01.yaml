  - number: '5.66'
    text: |-
      Bij de beëindiging van een taak van een overheidsorgaan of de overgang van een taak op een ander overheidsorgaan
      wordt in het overgangsrecht een voorziening opgenomen voor de op die taak betrekking hebbende archiefbescheiden.
      Daarbij worden de volgende modellen als uitgangspunt genomen:

      A. *Archiefbescheiden van [overheidsorgaan A] betreffende zaken die op het tijdstip van inwerkingtreding van deze
      wet nog niet zijn afgedaan, worden overgedragen aan [overheidsorgaan B], voor zover zij niet overeenkomstig de
      Archiefwet 1995 zijn overgebracht naar een archiefbewaarplaats.*

      B. *Archiefbescheiden van [voorheen bevoegde overheidsorgaan] met betrekking tot taken of werkzaamheden die
      op het tijdstip van inwerkingtreding van deze wet zijn beëindigd, worden overgedragen aan Onze Minister [van/
      voor ...]. Indien zij ingevolge de Archiefwet 1995 voor blijvende bewaring in aanmerking komen worden zij, zo
      nodig door tussenkomst van Onze Minister [van/voor ...], overeenkomstig de Archiefwet 1995 overgebracht naar een
      archiefbewaarplaats.*

      C. *Onze Minister [van/voor ...] is met ingang van het tijdstip van inwerkingtreding van deze wet zorgdrager
      voor de archiefbescheiden die door [voorheen bevoegde overheidsorgaan] ter beschikking zijn gesteld aan
      privaatrechtelijke rechtspersonen.*


          **Toelichting**
          Deze aanwijzing houdt verband met [artikel 4 van de Archiefwet 1995][ref1], waarin is bepaald dat een
      regeling waarbij overheidsorganen worden opgeheven, samengevoegd of gesplitst, of waarbij een of meer taken van
      een overheidsorgaan worden overgedragen aan een ander overheidsorgaan, een voorziening moet bevatten omtrent hun
      archiefbescheiden.
          Onder overheidsorgaan in de zin van de [Archiefwet 1995][ref2] worden verstaan organen van krachtens
      publiekrecht ingestelde rechtspersonen, alsmede andere met enig openbaar gezag beklede personen of colleges. De
      [Archiefwet 1995][ref3] regelt voor de verschillende overheidsorganen wie als zorgdrager is belast met de zorg voor
      archiefbescheiden. De zorgdrager heeft onder meer als taak om selectielijsten op te stellen voor de overbrenging
      naar een archiefbewaarplaats of de vernietiging van archiefbescheiden. Voor de rijksoverheid geldt dat iedere
      minister zorgdrager is voor de bij zijn departement berustende archiefbescheiden. Deze aanwijzing geldt daarom ook
      bij een herschikking van taken binnen de rijksoverheid, indien die herschikking ertoe leidt dat voortaan een andere
      minister als zorgdrager moet worden aangemerkt.
          **Model A.**Dit model ziet op de overdracht van archiefbescheiden met betrekking tot lopende zaken indien er
      – bijvoorbeeld als gevolg van de instelling of opheffing van een zelfstandig bestuursorgaan – een herschikking
      van taken en bevoegdheden plaatsvindt. Het gaat daarbij om de archiefbescheiden die nog berusten bij het
      overheidsorgaan dat ophoudt te bestaan of waarvan een taak wordt overgedragen. Bescheiden die op grond van een
      selectielijst al zijn vernietigd of overgebracht naar een archiefbewaarplaats, vallen hier dus niet onder.
          Het model heeft tot doel te zorgen dat (digitale) archieven die zien op zaken die nog niet zijn afgedaan of
      waarbij nog geen selectie op grond van een selectielijst heeft plaatsgevonden, worden overgedragen aan het voortaan
      bevoegde overheidsorgaan. Dat overheidsorgaan is vanaf dat moment verantwoordelijk voor naleving van de bepalingen
      in de [Archiefwet 1995][ref4] en heeft die archiefbescheiden nodig voor het afdoen van lopende zaken. Daarnaast
      kan dat overheidsorgaan voor historisch onderzoek behoefte hebben aan archiefbescheiden betreffende zaken die
      bij de instelling van het overheidsorgaan wel reeds waren afgedaan. Dergelijke archiefbescheiden kunnen door de
      zorgdrager in de zin van de [Archiefwet 1995][ref5] tijdelijk ter beschikking worden gesteld van het desbetreffende
      overheidsorgaan. Na afloop van de terbeschikkingstelling keren die archiefbescheiden terug naar het archief waaruit
      ze afkomstig zijn. Aldus wordt voorkomen dat het oorspronkelijke archief van een dienstonderdeel door overdracht
      van archiefbescheiden incompleet wordt en zijn rol als bron voor verantwoording en voor historisch onderzoek niet
      meer optimaal kan vervullen.
          **Model B.**Dit model ziet op de archiefbescheiden met betrekking tot de reeds beëindigde taken en
      werkzaamheden van een opgeheven overheidsorgaan. Archiefbescheiden met betrekking tot taken die zijn beëindigd
      worden, voor zover zij niet op basis van een geldige selectielijst zijn vernietigd, overgedragen aan de betrokken
      minister. Het gaat daarbij om archiefbescheiden die tijdelijk bewaard moeten blijven, omdat zij op basis van
      een geldige selectielijst zijn aangewezen om te vernietigen, maar waarvan de vernietigingstermijn nog niet is
      verstreken. Het gaat dan onder meer ook om archiefbescheiden die nog niet in aanmerking komen voor overbrenging
      naar een archiefbewaarplaats. Indien bescheiden op basis van een geldige selectielijst voor blijvende bewaring in
      aanmerking komen, worden ze overgedragen aan een archiefbewaarplaats.
          **Model C.**Deze bepaling is nodig in de situatie dat taken worden overgedragen van een publiekrechtelijke naar
      een privaatrechtelijke rechtspersoon. Voor de vervulling van de taak moeten de archiefbescheiden voor de lopende
      zaken aan de privaatrechtelijke rechtspersoon worden overgedragen. Tegelijkertijd is van belang dat duidelijk is
      dat de archiefbescheiden binnen het publieke domein blijven en dat daarom duidelijk is wie de zorgdrager voor de
      archiefbescheiden is. Deze bepaling voorkomt dat hier onduidelijkheid over zou kunnen zijn.
          Het is bij het ontwerpen van een overgangsbepaling tevens van belang de mogelijkheid van een gedeeltelijke
      overgang van taken en bevoegdheden zichtbaar te maken in de desbetreffende bepaling ten aanzien van
      archiefbescheiden. Zo nodig kunnen meerdere modellen samen worden gebruikt. Zo zullen de modellen A en C
      bijvoorbeeld aan de orde zijn bij overdracht van een taak van een publiekrechtelijk overheidsorgaan naar een
      privaatrechtelijke rechtspersoon waarbij het orgaan van de publiekrechtelijke rechtspersoon wordt opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0007376#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007376
      [ref3]: https://wetten.overheid.nl/BWBR0007376
      [ref4]: https://wetten.overheid.nl/BWBR0007376
      [ref5]: https://wetten.overheid.nl/BWBR0007376
