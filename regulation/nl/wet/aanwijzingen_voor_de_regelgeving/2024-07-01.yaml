  - number: '7.21'
    text: |-
      1 Een memorie van antwoord op een voorlopig verslag van de Eerste Kamer wordt uiterlijk veertien dagen vóór de
      beoogde datum van openbare behandeling van het desbetreffende wetsvoorstel bij de Eerste Kamer ingediend.

      2 In spoedeisende gevallen kan van deze termijn in overleg met de griffie van de Eerste Kamer worden afgeweken.
