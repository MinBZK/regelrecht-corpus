  - number: 2.10.1
    text: |-
      Bij de keuzes met betrekking tot vorm en inhoud van een regeling wordt gestreefd naar zo beperkt mogelijke lasten
      voor burgers, bedrijven en instellingen, alsmede voor de overheid zelf.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.10
  - number: 2.10.2
    text: Tevens wordt rekening gehouden met het doenvermogen van degenen die geraakt worden door de regeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.10
  - number: 2.10.3
    text: |-
      Bij het ontwerpen van een regeling wordt mede rekening gehouden met de uitvoerbaarheid daarvan, in het bijzonder
      wat betreft de aanpassing of ontwikkeling van de voor de uitvoering vereiste ICT-systemen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.10
  - number: 2.11.1
    text: |-
      De voor een of meer belanghebbenden nadelige gevolgen van een voorgenomen regeling mogen niet onevenredig zijn in
      verhouding tot de daarmee te dienen doelen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.11
  - number: 2.11.2
    text: |-
      Waar nodig voorziet een regeling in voldoende mogelijkheden om het bestuursorgaan in staat te stellen een besluit
      met onevenredige hardheid in een concreet geval te voorkomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.11
  - number: '2.12'
    text: |-
      Bij het opstellen van een regeling wordt rekening gehouden met de overige relevante eisen en voorwaarden die deel
      uitmaken van het kabinetsbeleid inzake regelgeving.
          **Toelichting**
          De in de [aanwijzingen 2.5 tot en met 2.11][ref1] neerlegde inhoudelijke kwaliteitseisen hebben een algemeen
      karakter en zijn daarom in beginsel bij iedere vorm van regelgeving relevant. Naast de in die aanwijzingen
      neergelegde eisen gelden ook nog eisen met een meer specifiek karakter, die slechts in bepaalde gevallen relevant
      zijn of enkel toepasselijk zijn binnen bepaalde maatschappelijke sectoren of beleidsvelden. Deze eisen zijn
      elders in de aanwijzingen neergelegd of zijn te vinden in het onderdeel verplichte kwaliteitseisen binnen het
      Beleidskompas, en maken daarmee deel uit van het geheel aan eisen waarop acht geslagen moet worden bij het
      opstellen van regelgeving.
          Zie met betrekking tot de toelichting bij de regeling ook [aanwijzing 4.43, onderdeel m][ref2].


