  - number: '6.25'
    text: |-
      1 Een regeling die terstond is uitgewerkt nadat zij in werking is getreden, wordt niet ingetrokken.

      2 Evenmin wordt in een dergelijke regeling voorzien in het vervallen van de regeling.


          **Toelichting**
          Voorbeelden van regelingen waarop deze aanwijzing betrekking heeft, zijn:
          wetten die uitsluitend tot goedkeuring van verdragen strekken en geen aanvullend recht bevatten;
      wetten inzake gemeentelijke of provinciale herindeling;
      machtigingswetten tot oprichting van een privaatrechtelijke rechtspersoon door de Staat;
      wetten inzake overdracht van beheer en onderhoud van waterstaatswerken.
          Eveneens vloeit uit deze aanwijzing voort dat wijzigingsregelingen niet voor intrekking in aanmerking komen,
      tenzij daarin overgangsbepalingen staan, die niet onmiddellijk zijn uitgewerkt.
          Op grond van deze aanwijzing komen wel voor intrekking in aanmerking regelingen die bijvoorbeeld betrekking
      hebben op een financiële aanspraak over een bepaalde periode, zoals de verstrekking van een eenmalige uitkering
      over een bepaald jaar. In beginsel behoort overigens in regelingen die een tijdelijk karakter hebben een
      horizonbepaling te worden opgenomen (zie [aanwijzing 5.71][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.25
