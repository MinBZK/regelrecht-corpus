      1 Het gebruik van hoofdletters wordt zoveel mogelijk beperkt.

      2 Het gebruik van hoofdletters in de [Grondwet][ref1] en in basisregelingen wordt zoveel mogelijk gevolgd of als
      uitgangspunt genomen bij de schrijfwijze van daarin gebezigde uitdrukkingen of vastgestelde benamingen.

      3 Bij nieuwe benamingen wordt in beginsel alleen het eerste woord met een hoofdletter geschreven.

      4 Aanduidingen van afzonderlijke ministers en ministeries, als eigennaam gebruikt, worden met een hoofdletter
      geschreven.


          **Toelichting**
          **Vierde lid.**Indien ‘minister’ of ‘staatssecretaris’ wordt gevolgd door de naam van het ministerie (of – bij
      een minister zonder portefeuille – door een aanduiding van diens taakveld), dan wordt deze aanduiding beschouwd als
      een eigennaam, en wordt een hoofdletter gebruikt. Dit geldt ook voor de aanduiding ‘Onze Minister’, die beschouwd
      kan worden als een verkorte aanduiding van een (niet vermelde) eigennaam.

          **Met hoofdletter:** Algemene Rekenkamer, Eerste (Tweede) Kamer, Hoge Raad (der Nederlanden), Kabinet van
      de Koning, Kamer (indien wordt gerefereerd aan de Tweede Kamer of de Eerste Kamer), Kamerlid, Kamerstukken,
      Koning, Koninkrijk (der Nederlanden), Kroon, Minister-President, Minister van Buitenlandse Zaken, Ministerie
      van Buitenlandse Zaken, Onze Minister(s), Afdeling advisering van de Raad van State, Rijk, 's Rijks kas, Staten-
      Generaal.
          **Met kleine letter:** algemene maatregel van bestuur, burgemeester, commissaris van de Koning, commissie,
      gedeputeerde staten, gemeente, kabinet, kroonberoep, kroonlid, koninklijk besluit, lidstaat, memorie van
      toelichting, ministerraad, nota van wijziging, parlement, presidium, provinciale staten, raad, regering,
      regeringscommissaris, rijksoverheid, rijkswet, staat, voorstel van wet.

          Onderzoeksraad voor veiligheid
      Nationale ombudsman.


