  - number: '7.12'
    text: |-
      Indien tijdens de adviesprocedure bij de Afdeling advisering van de Raad van State blijkt dat aan de voortzetting
      van de behandeling van een wetsvoorstel of het ontwerp voor een algemene maatregel van bestuur geen behoefte
      meer bestaat, bevordert de eerstverantwoordelijke bewindspersoon, daartoe gemachtigd door de ministerraad, dat de
      adviesaanvraag wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.12
  - number: '7.13'
    text: |-
      In het nader rapport aan de Koning wordt het advies van de Afdeling advisering van de Raad van State integraal
      opgenomen en wordt de reactie daarop te bestemder plaatse tussengevoegd.
          **Toelichting**
          De zelfstandige leesbaarheid van het nader rapport wordt vergroot door daarin de tekst van het advies van de
      Afdeling advisering op te nemen en daar de puntsgewijze reactie tussen te plaatsen. Algemene opmerkingen die niet
      specifiek gerelateerd zijn aan punten in het advies worden in het begin of aan het eind van het nader rapport
      opgenomen.
          Indien bij gelegenheid van het nader rapport wijzigingen worden aangebracht die niet het gevolg zijn van het
      advies van de Afdeling (en waarover de Afdeling niet ingevolge [aanwijzing 7.16, eerste lid][ref1], wordt gehoord)
      wordt daarvan mededeling gedaan in een of meer afzonderlijk genummerde punten aan het slot van het nader rapport.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '7.14'
    text: |-
      Indien een advies van de Afdeling advisering van de Raad van State ingrijpende kritiek op de inhoud of de
      vormgeving van een wetsvoorstel of een ontwerp voor een algemene maatregel van bestuur bevat, wordt het
      wetsvoorstel of ontwerp opnieuw in de ministerraad aan de orde gesteld.
          **Toelichting**
          De volgende dicta geven aan dat van ingrijpende kritiek sprake is:
          ‘De Afdeling advisering van de Raad van State heeft een aantal bezwaren bij het voorstel en adviseert het
      voorstel niet bij de Tweede Kamer der Staten-Generaal in te dienen, tenzij het is aangepast.’ (dictum c)
      ‘De Afdeling advisering van de Raad van State heeft ernstige bezwaren tegen het voorstel en adviseert het niet bij
      de Tweede Kamer der Staten-Generaal in te dienen.’ (dictum d)
          Bij algemene maatregelen van bestuur luiden deze dicta overeenkomstig, met dien verstande dat het dictum in dat
      geval ziet op de besluitvorming van de regering over de algemene maatregel van bestuur.
          Bij ingrijpende kritiek dienen de ontwerpregeling en het nader rapport ook ter toetsing te worden voorgelegd
      aan de sector Juridische Zaken en Wetgevingsbeleid van de Directie Wetgeving en Juridische Zaken van het Ministerie
      van Justitie en Veiligheid ([aanwijzing 7.4, eerste lid, onderdeel d][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.15.1
    text: |-
      Indien in een wetsvoorstel of een ontwerp voor een algemene maatregel van bestuur waarover de Afdeling advisering
      van de Raad van State advies heeft uitgebracht, vóór de indiening, onderscheidenlijk de vaststelling, daarvan
      ingrijpende wijzigingen worden aangebracht die niet het gevolg zijn van het advies van de Afdeling advisering,
      wordt de Afdeling over deze wijzigingen gehoord.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.15
  - number: 7.15.2
    text: |-
      Indien in een ingediend wetsvoorstel door de regering ingrijpende wijzigingen worden aangebracht, wordt de Afdeling
      advisering over deze wijzigingen gehoord, tenzij dringende redenen zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.15
  - number: 7.15.3
    text: |-
      De [aanwijzingen 7.9, eerste lid][ref1], en [7.10 tot en met 7.14][ref2] zijn van overeenkomstige toepassing op de
      advisering over een nota van wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '7.16'
    text: |-
      Over een bij amendement voorgestelde ingrijpende wijziging van een wetsvoorstel wordt de Afdeling advisering van de
      Raad van State alleen gehoord, indien de betrokken bewindspersoon daaraan met het oog op zijn oordeelsvorming over
      het amendement behoefte gevoelt.
          **Toelichting**
          Gaat het om een wijziging waarbij het functioneren van de Raad van State in het geding is, dan ligt het voor de
      hand daarover het gevoelen van de Raad van State te vernemen, hetzij in de vorm van een adviesaanvrage, hetzij door
      raadpleging van de vice-president.
          Advisering over een amendement is verder geïndiceerd indien de verenigbaarheid met hoger recht aan de orde is
      en de aanvaardbaarheid van dat amendement in dat licht moet worden bezien.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.16
  - number: '7.17'
    text: |-
      De in [aanwijzing 7.10][ref1] bedoelde adviezen over een voorstel van wet worden aan de Tweede Kamer toegezonden.
          **Toelichting**
          Ingevolge [artikel 80, tweede lid, van de Grondwet][ref2] worden adviezen van vaste adviescolleges, uitgebracht
      ter zake van voorstellen van wet die door of vanwege de Koning worden ingediend, behoudens bij de wet te bepalen
      uitzonderingen aan de Staten-Generaal overgelegd. De aanwijzing omvat mede de andere aan de Afdeling advisering van
      de Raad van State overgelegde adviezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel80
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '80'
  - number: 7.18.1
    text: De nota naar aanleiding van het verslag volgt zoveel mogelijk de indeling en de volgorde van het verslag.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.18
  - number: 7.18.2
    text: |-
      Indien dat wenselijk is met het oog op verwijzing worden in de nota naar aanleiding van het verslag de onderdelen
      of vragen van het verslag genummerd wanneer dat niet is gebeurd in het verslag zelf.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.18
  - number: 7.18.3
    text: |-
      Deze aanwijzing is van overeenkomstige toepassing op andere stukken die het karakter hebben van een puntsgewijze
      reactie op voorgelegde vragen of opmerkingen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.18
  - number: '7.19'
    text: |-
      De beantwoording van een verslag van de Tweede Kamer vindt in beginsel plaats binnen eenzelfde termijn als die
      welke de Kamercommissie heeft genomen voor het uitbrengen van het verslag, waarbij als aanvangsdatum geldt de datum
      van de koninklijke boodschap.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.19
  - number: '7.20'
    text: |-
      Leden van de Tweede Kamer die een amendement willen voorstellen, kunnen het betrokken ministerie bijstand verzoeken
      bij het formuleren van amendementen. Deze bijstand wordt zoveel mogelijk verleend.
          **Toelichting**
          Kamerleden, hun fractiemedewerkers en medewerkers van het Bureau Wetgeving van de Tweede Kamer kunnen
      ambtenaren rechtstreeks om ambtelijke bijstand verzoeken bij het opstellen van amendementen. Ambtenaren informeren
      hun bewindspersoon over het feit dat bijstand is verzocht en verleend. De ambtelijke bijstand bestaat uit
      juridische en wetgevingstechnische adviezen bij het formuleren van een amendement, of om toetsing van amendementen.
      De adviezen kunnen bijvoorbeeld ook juridische inpassing van een amendement in het wetsvoorstel betreffen, of
      de verenigbaarheid daarvan met Europees of internationaal recht. Verder kan het omvatten de verrichting van
      procedurele handelingen door het departement waartoe het amendement aanleiding zou geven, zoals notificatie
      bij de Europese Commissie (zie [aanwijzing 9.19][ref1]) of het verrichten van een specifiek voorgeschreven
      evenredigheidsbeoordeling en toepassing van publieke consultatie (zie de toelichting bij [aanwijzing 2.15][ref2]).
      Ingevolge [artikel 9.5, tweede lid, van het Reglement van Orde van de Tweede Kamer][ref3], worden amendementen
      beknopt toegelicht. De bijstand strekt zich in beginsel niet uit tot het formuleren van deze toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0044975#Artikel9
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.20
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '9'
        paragraaf: '9.3'
      - id: ref2
