        artikel: '20'
  - number: '5.59'
    text: |-
      Bij een nieuwe regeling of wijziging van een regeling wordt overwogen of overgangsbepalingen noodzakelijk zijn.
          **Toelichting**
          Het is van belang tijdig na te gaan welke elementen van een regeling aanleiding kunnen geven tot een of
      meer overgangsbepalingen. Zie voor uitgangspunten voor overgangsrecht en de daarbij te maken keuzes bijvoorbeeld
      het voor wijzigingen in de socialezekerheidswetgeving opgestelde Toetsingskader Overgangsrecht (Kamerstukken I
      1999/2000, 25900, EK 87, nr. 87b, p. 5–7). Verder is het van belang de grenzen in het oog te houden die artikel
      1 (het eigendomsbegrip) van het Eerste Protocol bij het EVRM en artikel 17 van het Handvest van de grondrechten
      van de Europese Unie in het licht van de gevormde jurisprudentie stellen aan het overgangsrecht en meer in het
      bijzonder overgangsrecht bij wijziging van aanspraken in de socialezekerheidswetgeving en de pensioenwetgeving. Zie
      onder meer de voorlichting van de Afdeling advisering van de Raad van State met een summier beslismodel bij artikel
      1 Eerste Protocol EVRM (Kamerstukken II 2012/13, 33400 XV, nr. 7).
          Als een wet wordt gevolgd door een invoeringswet, kan worden overwogen het overgangsrecht op te nemen in die
      invoeringswet. Indien mogelijk verdient het aanbeveling om in de memorie van toelichting bij de eerste wet in te
      gaan op het voorgenomen overgangsrecht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.59
  - number: '5.60'
    text: |-
      Indien bij een wijziging van een regeling overgangsbepalingen noodzakelijk zijn, worden deze in de te wijzigen
      regeling opgenomen, tenzij dit gelet op de doelgroep, de geldigheidsduur of de toegankelijkheid, onwenselijk is.
          **Toelichting**
          Door het overgangsrecht in de te wijzigen regeling op te nemen wordt voorkomen dat verschillende
      wijzigingsregelingen van belang blijven wegens het daarin opgenomen overgangsrecht. Tevens bevordert deze
      handelwijze de kenbaarheid van het overgangsrecht, doordat dit in dezelfde regeling is opgenomen als het
      recht waarop de overgangsbepalingen betrekking hebben. Op deze hoofdregel kan een uitzondering worden gemaakt
      indien het overgangsrecht een zodanig beperkte doelgroep of geldigheidsduur kent, dat het overgangsrecht de te
      wijzigen regeling zou ‘vervuilen’. In een dergelijk geval spelen de genoemde argumenten voor het opnemen van het
      overgangsrecht in de te wijzigen regeling ook een minder grote rol. Indien een invoerings- of een overgangswet
      gebruikelijk is op het te regelen terrein, pleit de toegankelijkheid van het overgangsrecht juist voor opname in de
      desbetreffende invoerings- of overgangswet. Zie ook [aanwijzing 6.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.60
