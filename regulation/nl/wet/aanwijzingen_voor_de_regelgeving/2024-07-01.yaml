  - number: '4.21'
    text: |-
      1 Voor de inwerkingtredingsbepaling van een wet wordt zoveel mogelijk het volgende model gebruikt:

      *Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.*

      2 Voor de inwerkingtredingsbepaling van een algemene maatregel van bestuur wordt een van de volgende modellen
      gebruikt:

      A. *Dit besluit treedt in werking met ingang van ...*

      B. *Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.*

      3 Voor de inwerkingtredingsbepaling van een ministeriële regeling wordt het volgende model gebruikt:

      *Deze regeling treedt in werking met ingang van ...*

      4 Voor de inwerkingtredingsbepaling van een beleidsregel wordt het volgende model gebruikt:

      *Deze beleidsregel treedt in werking met ingang van ...*


          **Toelichting**
          Wetten, algemene maatregelen van bestuur en ministeriële regelingen treden in beginsel in werking
      op vaste tijdstippen met een voorgeschreven minimale termijn tussen publicatie en inwerkingtreding (zie
      [aanwijzing 4.17][ref1]). In wetsvoorstellen wordt in beginsel geen concreet inwerkingtredingstijdstip opgenomen.
      Een concreet inwerkingtredingstijdstip kan, indien deze dicht ligt bij de indiening van het voorstel bij
      de Eerste Kamer, een goede inhoudelijke behandeling door de Eerste Kamer frustreren. Indien het tijdstip op
      het moment van aanvaarding door de Eerste Kamer al (bijna) is verstreken, zal een novelle nodig zijn om het
      inwerkingtredingstijdstip aan te passen. Bovendien kan het opnemen van een tijdstip de naleving belemmeren van
      [aanwijzing 4.17, vierde lid][ref2]. Zie [aanwijzing 4.22][ref3] voor modellen voor bijzondere gevallen.
          Mocht in bijzondere gevallen het opnemen van een concreet tijdstip van inwerkingtreding in een wet
      onvermijdelijk zijn (bijvoorbeeld in verband met de implementatie van een bindende EU-rechtshandeling of bij
      onlosmakelijke samenhang van de wet met een boekjaar of belastingjaar), dan kan daarvoor een bepaling analoog
      aan het tweede lid, model A, worden gebruikt. Zie voor het eventueel verlenen van terugwerkende kracht de
      [aanwijzingen 4.22 (model H)][ref4], [5.62][ref5] en [5.63][ref6].
          Tegen opneming van een concreet inwerkingtredingstijdstip in een algemene maatregel van bestuur of ministeriële
      regeling bestaat in het algemeen geen bezwaar (tweede lid, model A, onderscheidenlijk derde lid), mits daarbij
      [aanwijzing 4.17][ref7] in acht wordt genomen. Dit is te beoordelen op het moment dat het nader rapport,
      onderscheidenlijk de ministeriële regeling, in procedure wordt gebracht. In andere gevallen is voor een algemene
      maatregel van bestuur het gebruik van model B, genoemd in het tweede lid, aangewezen.
          Indien het een regeling van het Koninkrijk betreft of een regeling die zowel in het Europese deel van Nederland
      als in Bonaire, Sint Eustatius en Saba geldt, kan het nodig zijn bij de inwerkingtreding rekening te houden met het
      tijdsverschil tussen het Europese en de Caribische delen van het Koninkrijk. Dit tijdsverschil bedraagt gedurende
      de wintertijd in het Europese deel van het Koninkrijk 5 uur en gedurende de zomertijd 6 uur. Indien het noodzakelijk
      of wenselijk is om de regeling in beide delen van het Koninkrijk op precies hetzelfde tijdstip in werking te laten
      treden, wordt in de inwerkingtredingsbepaling ook uitdrukkelijk het uur genoemd waarop de regeling in het Europese
      deel, onderscheidenlijk de Caribische delen, van het Koninkrijk in werking treedt. Zie voor een voorbeeld het
      Besluit van 23 september 2010 tot vaststelling van het tijdstip van inwerkingtreding van de [artikelen I][ref8] en
      [II van de Rijkswet wijziging Statuut in verband met de opheffing van de Nederlandse Antillen][ref9] (Stb. 2010,
      387*).*


