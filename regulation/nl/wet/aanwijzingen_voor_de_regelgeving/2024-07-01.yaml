  - number: '2.9'
    text: |-
      Bij het opstellen van een regeling wordt tevens bezien welke neveneffecten op bestaande of voorgenomen regelgeving
      of beleidsvelden kunnen optreden en welke consequenties dit dient te hebben voor het voorstel.


          **Toelichting**
          De opsteller van een regeling draagt de verantwoordelijkheid om, waar nodig in overleg met andere betrokken
      actoren, zich een zo volledig mogelijk beeld te vormen over de feitelijke en juridische neveneffecten van die
      regeling en om te bezien tot welke consequenties die bevindingen aanleiding geven.
          Ter beantwoording van de vraag welke regelingen geraakt worden door het voorstel wordt in ieder geval, door
      raadpleging van de wetstechnische informatie in het Basiswettenbestand op www.wetten.nl, bezien welke regelingen
      gebaseerd zijn op, of verwijzen naar de door het voorstel geraakte bepalingen. Ook moet gedacht worden aan Europese
      regelgeving, indien de geraakte regelingen ooit zijn gemaakt of aangewezen als implementatiemiddel daarvan. Verder
      wordt rekening gehouden met gelijktijdig in ontwikkeling zijnde voorstellen voor regelgeving.
          Is er sprake van een beoogd neveneffect, dan is een (secundair) doel van het voorstel in het geding. Deze
      dient dan ook als zodanig te worden aangewezen. Bij onbedoelde neveneffecten moet worden bezien in hoeverre deze
      de aanvaardbaarheid van een regeling negatief beïnvloeden. Negatieve beïnvloeding kan aanleiding zijn van een
      regeling af te zien. Anderzijds dient slechts tot het tot stand brengen van een regeling te worden besloten indien
      zij geschikt lijkt de gekozen doelen te realiseren. Er is sprake van een onzuivere afweging indien positieve maar
      onbedoelde neveneffecten de doorslag zouden geven om een regeling in te voeren die niet adequaat lijkt voor het
      verwezenlijken van de gekozen doelen.
          Welke de negatieve neveneffecten van een regeling zullen zijn, moet steeds in breed verband worden onderzocht.
      Aandacht verdient daarbij onder meer in hoeverre een maatregel van verstorende invloed zal zijn op het effect
      dat bestaande regelingen hebben. De werking van een regeling kan worden verstoord doordat een nieuwe regeling het
      voor de justitiabele minder aantrekkelijk of eenvoudig maakt aan eerstbedoelde regeling te voldoen. Voorts kan een
      nieuwe regeling naast reeds bestaande regelingen tot gevolg hebben dat een zodanige cumulatie van verplichtingen
      ontstaat dat de bereidheid tot naleving afneemt.
          Zie met betrekking tot de toelichting bij de regeling ook [aanwijzing 4.43, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.9
    references:
