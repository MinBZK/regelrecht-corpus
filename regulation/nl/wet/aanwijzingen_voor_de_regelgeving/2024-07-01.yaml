  - number: '8.3'
    text: |-
      1 Over de voorbereiding van verdragen wordt in een zo vroeg mogelijk stadium contact gezocht met de afdeling
      Internationaal Recht en de afdeling Verdragen van de Directie Juridische Zaken van het Ministerie van Buitenlandse
      Zaken.

      2 Over de goedkeuring van verdragen, over het tot uitdrukking brengen van instemming door een verdrag gebonden
      te worden en over het voornemen een verdrag op te zeggen of al dan niet te verlengen, wordt met het oog op de
      coördinatie ter verzekering van een consistent verdragsbeleid in een zo vroeg mogelijk stadium contact gezocht met
      de afdeling Verdragen van de Directie Juridische Zaken van het Ministerie van Buitenlandse Zaken.

      3 In gevallen dat het initiatief met betrekking tot verdragen bij het Ministerie van Buitenlandse Zaken ligt, zoekt
      de afdeling Verdragen van de Directie Juridische Zaken op haar beurt in een zo vroeg mogelijk stadium daarover
      contact met eventuele andere betrokken ministeries.

      4 Over de voorbereiding en goedkeuring van verdragen, over het tot uitdrukking brengen van instemming door een
      verdrag gebonden te worden en over het voornemen een verdrag op te zeggen of al dan niet te verlengen, wordt
      eveneens contact gezocht met de onderdelen van andere ministeries die bemoeienis hebben met het onderwerp waarop
      het verdrag of een onderdeel daarvan betrekking heeft of met onderwerpen die door het verdrag worden geraakt.


          **Toelichting**
          Bij het overleg over de voorbereiding van verdragen dienen de desbetreffende voorstellen, ontwerpen en
      instructies tijdig vooraf aan de afdeling Internationaal Recht en de afdeling Verdragen van de Directie Juridische
      Zaken gezonden te worden. Bij dit overleg moeten in elk geval de volgende punten onder ogen worden gezien: de
      verhouding tot andere verdragen, de rubricering (openbaar, vertrouwelijk of geheim), het niveau van sluiting,
      de status (zelfstandig of uitvoering), de inwerkingtreding, de werkingsduur, eventuele rechtstreekse werking en
      voorlopige toepassing, geschillenbeslechting, eventuele voorbehouden en verklaringen, wijziging, opzegging en
      territoriale gelding (zie ook [aanwijzing 8.4][ref1]).
          Bij de voorbereiding van het sluiten, de behandeling in de (rijks)ministerraad en de goedkeuring van verdragen
      alsmede over het tot uitdrukking brengen van instemming door een verdrag gebonden te worden, wordt de afdeling
      Verdragen van de Directie Juridische Zaken tijdig vooraf ingeschakeld. Dit geldt eveneens voor het voornemen een
      verdrag op te zeggen of al dan niet te verlengen. Indien in de voorbereidende fase overleg met het parlement plaats
      zal vinden, dient de afdeling Verdragen van de Directie Juridische Zaken daar ook bij betrokken te worden.
          Parlementaire goedkeuring van verdragen kan uitdrukkelijk of stilzwijgend plaatsvinden. Uitdrukkelijke
      goedkeuring wordt verleend bij (rijks)wet. Voor een uitdrukkelijke goedkeuring wordt in ieder geval gekozen
      wanneer:
          het verdrag bepalingen bevat die afwijken van de [Grondwet][ref2];
      ingevolge [artikel 7, aanhef en onder a, van de Rijkswet goedkeuring en bekendmaking verdragen][ref3] in de
      goedkeuringswet een machtiging wordt verleend;
      wetgeving ter implementatie van het verdrag noodzakelijk is; of
      wordt verwacht dat het parlement met de regering over het verdrag van gedachten wenst te wisselen.
          Stilzwijgende goedkeuring wordt verleend wanneer niet binnen 30 dagen na overlegging van het verdrag aan het
      parlement door een van de Kamers de wens te kennen is gegeven dat het verdrag aan uitdrukkelijke goedkeuring wordt
      onderworpen. Bij overleg over de goedkeuring moet in elk geval worden bezien of parlementaire goedkeuring wel
      of niet vereist is, of daarvoor de uitdrukkelijke of de stilzwijgende procedure gevolgd zal worden en of er een
      termijn voor de inwerkingtreding is. Ook de goedkeuringsstukken, eventuele uitvoeringswetgeving, rechtstreekse
      werking en voorlopige toepassing, zullen in dit overleg aan de orde moeten komen. Zie ook [aanwijzing 8.9][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0001840
      [ref3]: https://wetten.overheid.nl/BWBR0006799#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
