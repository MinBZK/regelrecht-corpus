  - number: '6.5'
    text: |-
      Indien een regeling strekt tot wijziging van meerdere regelingen, kunnen de wijzigingsbepalingen worden geplaatst:

      a. in volgorde naar omvang of aard van de wijziging;

      b. in alfabetische volgorde van de te wijzigen regelingen;

      c. in volgorde naar het eerstverantwoordelijke ministerie waaronder de te wijzigen regelingen ressorteren.


          **Toelichting**
          Variant a wordt vaak toegepast bij wijzigingsregelingen die zowel inhoudelijke wijzigingen als daaruit
      voortvloeiende technische aanpassingen in andere regelingen bevatten. Een logische opbouw van de regeling is dan
      om eerst de inhoudelijke wijzigingen van een bepaalde regeling op te nemen en pas daarna de daaruit voortvloeiende
      technische aanpassingen in andere regelingen. De varianten b en c zijn vooral geschikt voor wijzigingsregelingen
      waarbij een groot aantal bestaande regelingen wordt gewijzigd. Daarbij is in variant b de (citeer)titel van de
      regeling bepalend, terwijl in variant c de volgorde van de hoofdstukken van de rijksbegroting wordt gevolgd.
      Combinaties van de drie varianten zijn ook mogelijk: bijvoorbeeld eerst de meer inhoudelijke wijzigingen van een
      regeling, waarna voor de daaruit voortvloeiende technische aanpassingen van andere regelingen de alfabetische
      volgorde wordt aangehouden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.5
  - number: '6.6'
    text: |-
      1 Een regeling die slechts betrekking heeft op wijziging of intrekking van een of meer bestaande regelingen, wordt
      ingedeeld in artikelen met Romeinse cijfers.

      2 Indien een nieuwe regeling tevens strekt tot wijziging of intrekking van bestaande regelingen, worden ook de
      wijzigings- of intrekkingsbepalingen genummerd met Arabische cijfers.

      3 In een omvangrijke aanpassings- of invoeringsregeling waarin regelingen van verschillende ministeries worden
      gewijzigd of ingetrokken, kan voor een andere nummering worden gekozen.


          **Toelichting**
          **Eerste lid.**Indien een wijzigings- of intrekkingsregeling overgangsbepalingen bevat, worden deze ook met
      Romeinse cijfers genummerd. Zie ook [aanwijzing 5.60][ref1].
          Zie voor de verdere indeling van wijzigingsregelingen ook [aanwijzing 6.15][ref2].
          **Derde lid.**Bij omvangrijke aanpassings- of invoeringsregelingen waarin regelingen van
      verschillende ministeries worden gewijzigd, kan uit het oogpunt van overzichtelijkheid reden zijn
      voor een andere wijze van nummering. Gebruikelijk is in dat geval een opzet waarin voor elk ministerie
      een afzonderlijk hoofdstuk wordt opgenomen en binnen elk hoofdstuk voor iedere te wijzigen of in
      te trekken regeling een met Arabische cijfers genummerd artikel wordt gebruikt. Zie bijvoorbeeld de
      [Wet Invoering en financiering Wet werk en inkomen naar arbeidsvermogen][ref3].


