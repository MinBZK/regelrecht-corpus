  - number: '2.12'
    text: |-
      Bij het opstellen van een regeling wordt rekening gehouden met de overige relevante eisen en voorwaarden die deel
      uitmaken van het kabinetsbeleid inzake regelgeving.


          **Toelichting**
          De in de [aanwijzingen 2.5 tot en met 2.11][ref1] neerlegde inhoudelijke kwaliteitseisen hebben een algemeen
      karakter en zijn daarom in beginsel bij iedere vorm van regelgeving relevant. Naast de in die aanwijzingen
      neergelegde eisen gelden ook nog eisen met een meer specifiek karakter, die slechts in bepaalde gevallen relevant
      zijn of enkel toepasselijk zijn binnen bepaalde maatschappelijke sectoren of beleidsvelden. Deze eisen zijn
      elders in de aanwijzingen neergelegd of zijn te vinden in het onderdeel verplichte kwaliteitseisen binnen het
      Beleidskompas, en maken daarmee deel uit van het geheel aan eisen waarop acht geslagen moet worden bij het
      opstellen van regelgeving.
          Zie met betrekking tot de toelichting bij de regeling ook [aanwijzing 4.43, onderdeel m][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
