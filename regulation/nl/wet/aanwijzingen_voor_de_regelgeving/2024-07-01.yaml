  - number: '2.19'
    text: |-
      Bij verdeling van de elementen van een regeling over de wet en algemeen verbindende voorschriften van lager niveau
      bevat de wet ten minste de hoofdelementen van de regeling. Bij de keuze welke elementen in de wet zelf regeling
      moeten vinden en ter zake van welke elementen delegatie is toegestaan, dient het primaat van de wetgever als
      richtsnoer.


          **Toelichting**
          **Betrokkenheid parlement.** Het primaat van de wetgever dient niet aldus te worden verstaan dat het parlement
      bij alle onderdelen van een regeling rechtstreeks moet worden betrokken. Lang niet alle onderdelen van een
      regeling zijn van die betekenis dat directe parlementaire invloed op de vaststelling daarvan in de rede ligt. De
      mogelijkheid die het parlement heeft het regeringsbeleid achteraf te controleren, is dan voldoende.
          Gelet op het vorenstaande dient voor de keuze welke elementen van een regeling in de wet moeten worden geregeld
      en ter zake van welke elementen delegatie toelaatbaar is, steeds te worden onderzocht welke elementen van een
      regeling zo gewichtig zijn dat de volksvertegenwoordiging rechtstreeks bij de vaststelling moet worden betrokken.
      Aldus moeten ten minste de hoofdelementen van een regeling in de wet worden opgenomen.
          **Hoofdelementen van de regeling.** Hoofdelementen zijn in ieder geval de reikwijdte en de structurele
      elementen van de regeling. Veelal zullen daartoe ook de voornaamste duurzame normen behoren. Het kan echter uit een
      oogpunt van toegankelijke regelgeving beter zijn om in de wet over een bepaald onderwerp geen materiële normen op
      te nemen, maar aan de lagere wetgever over te laten een integrale materiële regeling tot stand te brengen.
          De aanwijzing ziet niet op rechtspositionele regelingen ten aanzien van overheidspersoneel, aangezien deze in
      belangrijke mate een intern karakter hebben.
          Zie met betrekking tot de toelichting bij de regeling ook [aanwijzing 4.43, onderdeel h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.19
