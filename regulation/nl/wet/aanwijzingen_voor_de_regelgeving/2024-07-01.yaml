  - number: '5.21'
    text: |-
      1 Indien het nodig is een op een regeling berustende beschikking te kunnen intrekken of wijzigen, wordt de
      bevoegdheid daartoe uitdrukkelijk geregeld.

      2 De gronden voor het intrekken of wijzigen van een beschikking worden in de regeling gespecificeerd.


          **Toelichting**
          **Eerste lid.**In het algemeen verdient het de voorkeur de intrekkings- of wijzigingsbevoegdheid als
      discretionaire bevoegdheid te verlenen. Dit stelt het bestuursorgaan in de gelegenheid te beoordelen of intrekking
      of wijziging in een bepaald geval, mede gelet op het evenredigheidsbeginsel, de juiste maatregel is.
          **Tweede lid.**Gronden voor intrekking of wijziging van een beschikking kunnen bijvoorbeeld zijn:
          de verstrekte gegevens blijken zodanig onjuist of onvolledig dat op de aanvraag een andere beslissing zou zijn
      genomen, indien bij de beoordeling daarvan de juiste gegevens bekend waren geweest;
      de beschikking is in strijd met wettelijke voorschriften gegeven;
      van de beschikking is gedurende een bepaalde ononderbroken periode geen gebruik gemaakt;
      in verband met verandering van wetgeving, gewijzigde omstandigheden of gewijzigde inzichten moet de bescherming
      van de belangen met het oog waarop het vereiste van de beschikking is gesteld, zwaarder wegen dan het belang van de
      betrokkene bij een ongewijzigde beschikking.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.21
  - number: '5.22'
    text: |-
      In een wet wordt geen delegatie van bestuursbevoegdheden aan ondergeschikten mogelijk gemaakt.


          **Toelichting**
          Deze aanwijzing ziet alleen op delegatie van bestuursbevoegdheden via een wet in formele zin. Voor wetgeving in
      materiële zin geldt [artikel 10:14 Awb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1014
