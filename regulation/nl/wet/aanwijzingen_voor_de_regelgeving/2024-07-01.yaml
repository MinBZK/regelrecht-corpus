      1 Een nieuwe regeling kan een daarvoor geldende regeling blijvend (eerbiedigende werking) of voor een bepaalde
      periode (uitgestelde werking) van toepassing laten op nader aangeduide feiten of verhoudingen, dan wel blijvend of
      voor een bepaalde periode gelding toekennen aan door een daarvoor geldende regeling in het leven geroepen rechten
      of verplichtingen.

      2 Bij het verlenen van eerbiedigende of uitgestelde werking of het toekennen van gelding aan door een eerdere
      regeling in het leven geroepen rechten of verplichtingen blijkt uit de regeling duidelijk welke rechtsgevolgen
      beoogd worden.


          **Toelichting**
          Het toekennen van eerbiedigende werking of uitgestelde werking kan onder meer wenselijk zijn indien het aan de
      nieuwe regeling voorafgaande rechtsregime heeft geleid tot het ontstaan van verwachtingen omtrent het voortduren
      van situaties dan wel het al dan niet intreden van aan bepaalde handelingen verbonden rechtsgevolgen of andere
      effecten, aan welke verwachtingen de nieuwe regeling afbreuk zal doen. In hoeverre deze verwachtingen gehonoreerd
      moeten worden, hangt in de eerste plaats af van de vraag of de overwegingen die geleid hebben tot het tot stand
      brengen van de nieuwe regeling, daartoe de ruimte laten. Verder spelen bij het tot stand brengen van een nieuwe
      regeling vaak allerlei praktische zaken: onder de oude regeling verleende vergunningen of genomen besluiten,
      waarvan het wenselijk is om die – ter voorkoming van onnodige invoeringslasten voor zowel burgers en bedrijven als
      voor betrokken overheden en bestuursorganen – onder de nieuwe regeling al dan niet tijdelijk te continueren.
          De overgangsregeling dient zodanig specifiek te zijn dat duidelijk blijkt wat rechtens de relevante situatie
      is. Leidt de toepassing van eerbiedigende of uitgestelde werking tot een zeer ingewikkelde regeling, dan verdient
      het overweging de te handhaven regeling opnieuw vast te stellen als onderdeel van en uitzondering op de nieuwe
      regeling.

          Artikel 104, zoals dat luidde voor inwerkingtreding van artikel I, onderdeel D, van de Wet
      versterking bestuur pensioenfondsen, blijft van toepassing op de leden, gewezen leden, werknemers die
      op een kandidatenlijst staan of gestaan hebben voor en de toegevoegd secretaris van een deelnemersraad.
      ([Artikel 220a, tweede lid, van de Pensioenwet][ref1])
      Artikel 20.3 van de Wet milieubeheer, zoals dat luidde onmiddellijk voorafgaand aan het tijdstip waarop deze wet
      in werking treedt, blijft gedurende zes weken na dat tijdstip van kracht met betrekking tot besluiten: (...).
      (__REF001__________________________________________________________________________________________________________
      ___________________________________________________________________ (Leemtewet Awb))
      Vergunningen tot uitoefening van het verzekeringsbedrijf, verleend op grond van artikel 9 van de Wet toezicht
      verzekeringsbedrijf BES, berusten na de inwerkingtreding van deze wet op artikel 2:1, eerste lid, onderdeel b.
      ([Artikel 10:1, tweede lid, van de Wet financiële markten BES][ref3])
      Besluiten van de raad van bestuur van de Nederlandse Mededingingsautoriteit, het college
      voor de post- en telecommunicatiemarkt of de Consumentenautoriteit worden na inwerkingtreding
      van artikel 2 van deze wet aangemerkt als besluiten van de Autoriteit Consument en Markt.
      ([Artikel 42, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref4])
      Indien voor de inwerkingtreding van artikel 12n van de Instellingswet Autoriteit Consument en Markt een overtreding
      is begaan en beëindigd, blijft met betrekking tot de hoogte van de boete die ten hoogste kan worden opgelegd [...]
      het recht gelden zoals dat luidde onmiddellijk voor het tijdstip van inwerkingtreding van genoemd artikel 12n.
      ([Artikel 44e van de Instellingswet Autoriteit Consument en Markt][ref5])
      De vaststelling door de Autoriteit Consument en Markt van een begroting als bedoeld in artikel 25 van de Kaderwet
      zelfstandige bestuursorganen vindt voor het eerst plaats ten aanzien van het kalenderjaar na dat waarin deze wet in
      het Staatsblad is geplaatst. ([Artikel 43, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref6])
      Dit artikel is niet van toepassing op overeenkomsten inzake premiepensioenvorderingen die zijn afgesloten vóór
      1 januari 2016, met dien verstande dat de niet-toepasselijkheid voor die overeenkomsten op 31 december 2020
      eindigt. ([Artikel 86c, vijfde lid, van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref7])
      Dit artikel is van toepassing op overeenkomsten inzake schadeverzekeringen die zijn aangegaan op of na 1 januari
      2012. ([Artikel 86d, derde lid, van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref8])


