      1 In de toelichting bij een regeling waarbij een adviescollege wordt ingesteld of een adviestaak wordt opgedragen,
      wordt gemotiveerd waarom onafhankelijke advisering op het desbetreffende terrein noodzakelijk wordt geacht.

      2 In de toelichting bij een regeling waarbij een adviescollege wordt ingesteld, wordt gemotiveerd waarom de
      adviestaak niet aan een bestaand adviescollege wordt opgedragen.


          **Toelichting**
          Deze aanwijzing ziet op alle adviescolleges, ongeacht of het gaat om een vast of tijdelijk college of een
      college voor de eenmalige advisering over een bepaald vraagstuk en ongeacht of het gaat over wetgeving of te voeren
      beleid dan wel over uitvoeringsaangelegenheden.
          Zie ook [hoofdstuk 2 van de Kaderwet adviescolleges][ref1] en [aanwijzing 5.10, tweede lid][ref2].


