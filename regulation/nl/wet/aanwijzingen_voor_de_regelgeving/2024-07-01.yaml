  - number: '9.17'
    text: |-
      1 Indien vereist, wordt van een voorstel voor een EU-richtlijn door of in overeenstemming met de wetgevingsafdeling
      van het eerstverantwoordelijke ministerie een implementatieplan opgesteld, zo nodig samen met andere betrokken
      ministeries.

      2 Het implementatieplan wordt uiterlijk binnen twee maanden na vaststelling van de desbetreffende EU-richtlijn bij
      de ICER-I ingediend.

      3 Het implementatieplan geeft zo gedetailleerd mogelijk weer op welke wijze de betrokken EU-richtlijn zal worden
      geïmplementeerd.

      4 Het eerstverantwoordelijke ministerie verwerkt de gegevens van het implementatieplan in de interdepartementale
      implementatiedatabase.


          **Toelichting**
          **Eerste en tweede lid.** Een implementatieplan wordt gemaakt om in een vroegtijdig stadium inzicht
      te geven in de wijze waarop een EU-richtlijn geïmplementeerd zal worden en om de noodzaak tot het
      betrekken van andere ministeries tijdig vast te stellen, en daarmee tijdige en juiste implementatie te
      bevorderen. Indien implementatie plaatsvindt door middel van een zogenoemde ‘dynamische verwijzing’ (zie
      [aanwijzing 9.10, eerste, tweede en derde lid][ref1]) is wijziging van regelgeving niet aan de orde en kan een
      implementatieplan achterwege blijven. Ook in geval van toepassing van [aanwijzing 9.18, derde lid][ref2], (zeer
      korte implementatietermijn bij vaststelling) hoeft geen plan (meer) te worden opgesteld. Implementatieplannen
      worden besproken in de vergaderingen van de ICER-I, die als taak het bewaken van de voortgang en het adviseren over
      implementatievraagstukken heeft. Met het oog op de uitvoering van die taak wordt door de ICER-I het model voor het
      implementatieplan vastgesteld.
          **Derde lid.** In het geval van de gewone wetgevingsprocedure van artikel 294 van het Verdrag betreffende de
      werking van de Europese Unie biedt de totstandkoming van het standpunt van de Raad in eerste lezing in de regel in
      een relatief vroeg stadium al voldoende aanknopingspunten voor het opstellen van een uitgewerkt implementatieplan.
          **Vierde lid.** Ten behoeve van tijdige implementatie wordt de voortgang bewaakt door middel van de
      implementatiedatabase (iTimer), op basis waarvan de kwartaalrapportages aan de Kamer worden opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
