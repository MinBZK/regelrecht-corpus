  - number: '3.54'
    text: |-
      1 Het lichaam van een regeling wordt vervat in een of meer artikelen.

      2 De artikelen worden doorlopend genummerd met Arabische cijfers. In een omvangrijke regeling kunnen de artikelen
      per hoofdstuk worden genummerd, onder vermelding van het hoofdstuknummer voor het artikelnummer.

      3 Bestaat een regeling uit één artikel, dan wordt daarboven de aanduiding ‘*Enig artikel*’ geplaatst.


          **Toelichting**
          Voorbeelden van regelingen met de in het tweede lid, tweede volzin, beschreven wijze van nummering zijn de
      [Wet milieubeheer][ref1] en het [Vreemdelingenbesluit 2000][ref2]. De artikelnummering geschiedt in die gevallen
      als volgt: 1.1, 1.2, 1.3 (...), 2.1, 2.2, 2.3 (...) enz. Er worden geen artikelnummers opgenomen zonder tekst of
      met de aanduiding ‘gereserveerd’. Zie voor de nummering van artikelen van een wijzigings- of intrekkingsregeling
      [aanwijzing 6.6][ref3].


