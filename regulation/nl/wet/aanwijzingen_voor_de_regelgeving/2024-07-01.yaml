  - number: '5.69'
    text: |-
      1 Indien door samenloop van twee of meer voorstellen van wet nog geen duidelijkheid bestaat over de uiteindelijke
      aanduiding van een artikel, een lid of een onderdeel, kan voor die aanduiding in het desbetreffende wetsvoorstel
      gebruik worden gemaakt van het symbool ‘#’, waarbij tussen blokhaken wordt vermeld op welke wijze de aanduiding in
      de bestaande nummering of lettering wordt opgenomen.

      2 In de drukproeffase wordt het symbool ‘#’ vervangen door de uiteindelijke aanduiding. De tussen blokhaken
      geplaatste tekst wordt daarbij geschrapt.


          **Toelichting**
          Soms wordt aan verschillende wijzigingen van dezelfde wet gewerkt terwijl nog niet duidelijk is welke wijziging
      als eerste in werking zal treden. In dat geval is soms onbekend welke aanduiding een artikel, een lid of een
      onderdeel uiteindelijk zal krijgen. Om te voorkomen dat artikelen, artikelleden of onderdelen daarvan met dezelfde
      aanduiding ontstaan na inwerkingtreding van de verschillende wijzigingen, kan in de fase van het opstellen van
      wetgeving soms gebruik worden gemaakt van een hekje dat uiteindelijk in de drukproeffase van het Staatsblad
      wordt ingevuld. Indien meer artikelen, leden of onderdelen nodig zijn, kunnen deze worden aangeduid door twee
      of meer hekjes te gebruiken, dan wel deze aan te duiden als #1, #2, #3, etc. In de memorie van toelichting wordt
      die aanduiding vervolgens aangehouden en wordt het gebruik van het symbool kort toegelicht. Daarbij wordt ook
      vermeld dat het hekje in de drukproeffase zal worden ingevuld, en dat het tussen blokhaken geplaatste deel van de
      wijzigingsopdracht dan wordt geschrapt.
          Bij een opsomming in een begripsbepaling wordt in nieuwe regelingen overigens bij voorkeur een alfabetische
      volgorde zonder opsommingstekens gehanteerd, waardoor het hier beschreven probleem zich niet voordoet: zie
      [aanwijzing 3.59, derde lid][ref1].
          Zie voor vernummering van een gehele regeling [aanwijzing 6.22][ref2].

          Aan artikel 1, eerste lid, wordt, onder vervanging van de punt aan het slot van dat lid door een puntkomma,
      een onderdeel [waarvan de letteraanduiding alfabetisch aansluit op het laatste onderdeel] toegevoegd, luidende: #.
      minimumloon: het minimumloon, bedoeld in (...)
      Aan hoofdstuk II van afdeling 5 worden twee artikelen [waarvan de nummering aansluit op het laatste artikel van dat
      hoofdstuk] toegevoegd, luidende: Artikel # (tekst artikel) Artikel ## (tekst artikel).
          (Voorbeelden ontleend aan Kamerstukken II 2011/12, 33241, nr. 2).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
