  - number: '4.22'
    text: |-
      Zo nodig kan voor de inwerkingtredingsbepaling van een regeling ook een van de volgende modellen worden gebruikt:

      A. *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking met ingang van ..., met
      uitzondering van de artikelen ..., die in werking treden met ingang van ... .*

      B. *Deze wet / Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk
      besluit kan een ander tijdstip worden vastgesteld waarop de artikelen ... in werking treden.*

      C. *Deze wet / Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.*

      D. *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking op het tijdstip waarop
      [artikel ... van] [citeertitel of aanduiding andere regeling] in werking treedt.*

      E. *Indien het bij [koninklijke boodschap van [datum] ingediende / geleidende brief van [datum] aanhangig gemaakte]
      voorstel van wet [als aanwijzing 3.43, tweede lid] tot wet is of wordt verheven en [artikel ... van] die wet in
      werking treedt, treedt deze wet / dit besluit op hetzelfde tijdstip in werking.*

      F. *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking met ingang van de eerste dag van
      de ... kalendermaand na de datum van uitgifte van het Staatsblad / de Staatscourant waarin zij/het/zij/hij wordt
      geplaatst.*

      G. *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking met ingang van de dag na de datum
      van uitgifte van het Staatsblad / de Staatscourant waarin zij/het/zij/hij wordt geplaatst.*

      H. *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking met ingang van [beoogde datum van
      inwerkingtreding]. Indien het Staatsblad / de Staatscourant waarin deze wet / dit besluit / deze regeling / deze
      beleidsregel wordt geplaatst, wordt uitgegeven na [de dag voor de beoogde datum van inwerkingtreding], treedt zij/
      het/zij/hij in werking met ingang van de dag na de datum van uitgifte van het Staatsblad / de Staatscourant waarin
      zij/het/ zij/hij wordt geplaatst, en werkt zij/het/zij/hij terug tot en met [beoogde datum van inwerkingtreding].*


          **Toelichting**
          Bij het gebruik van de in deze aanwijzing opgenomen modellen wordt [aanwijzing 4.17][ref1] in acht genomen,
      voor alle onderdelen van de regeling die in werking treden. De modellen G en H worden slechts gebruikt in de in
      [aanwijzing 4.17, vijfde lid][ref2], genoemde uitzonderingsgevallen.
          Voor de inwerkingtredingsbepaling van een algemeen verbindend voorschrift, niet zijnde een wet,
      algemene maatregel van bestuur of ministeriële regeling, kan een formulering analoog aan die in
      [aanwijzing 4.21, derde lid][ref3], of aan de modellen A, D, F, G of H worden gebruikt.
          **Model D.**Indien de ‘andere regeling’ waarnaar in model D wordt verwezen, voorziet in (de mogelijkheid
      van) gefaseerde inwerkingtreding (zie de modellen A, B en C) kan het nodig zijn om te verwijzen naar een of meer
      specifieke artikelen uit die andere regeling: ‘het tijdstip waarop artikel X van regeling Y in werking treedt’. Dat
      is in ieder geval nodig, indien beoogd is om aan te sluiten bij artikelen ten aanzien waarvan in de andere regeling
      is voorzien in eerdere of latere inwerkingtreding dan de rest van die regeling. In dat geval kan niet worden
      volstaan met een verwijzing naar ‘het tijdstip waarop regeling X in werking treedt’.
          **Model E.** Dit model kan worden gebruikt om aan te sluiten bij de inwerkingtreding van een nog niet tot
      wet verheven wetsvoorstel. Daarbij wordt voor regeringsvoorstellen de formulering ‘het bij koninklijke boodschap
      ingediende wetsvoorstel’ en voor initiatiefwetsvoorstellen de formulering ‘het bij geleidende brief aanhangig
      gemaakte wetsvoorstel’ gebruikt. Zie voor het gebruik van dit model ook [aanwijzing 2.33, derde lid][ref4].
          **Model H.**Dit model biedt een voorziening voor het geval onzeker is of een regeling tijdig, dat wil zeggen
      uiterlijk een dag voor de beoogde datum van inwerkingtreding van de regeling, bekend kan worden gemaakt. Als de
      regeling niet tijdig bekend kon worden gemaakt, voorziet de tweede zin van deze inwerkingtredingsbepaling erin dat
      de regeling alsnog met ingang van de eerste dag na haar bekendmaking in werking treedt en terugwerkt tot en met
      de dag van haar aanvankelijk beoogde inwerkingtreding. Bij gebruik van dit model wordt [aanwijzing 5.62][ref5] in
      acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref5]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
