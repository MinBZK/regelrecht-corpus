  - number: '3.20'
    text: |-
      1 Bij de aanduiding van het Europese deel van het grondgebied van Nederland worden de woorden ‘*het Europese
      deel van Nederland*’ gebruikt. In een regeling die uitsluitend in het Europese deel van Nederland geldt, kan ter
      aanduiding van het Europese deel van het grondgebied van Nederland tevens het woord ‘*Nederland*’ worden gebruikt.

      2 In een regeling van het Koninkrijk of een regeling die (mede) in Bonaire, Sint Eustatius en Saba geldt, wordt het
      woord ‘*Nederland*’ uitsluitend gebruikt ter aanduiding van het grondgebied van het Europese deel van Nederland,
      Bonaire, Sint Eustatius en Saba gezamenlijk.

      3 Bij de aanduiding van het grondgebied van Nederland, Aruba, Curaçao en Sint Maarten gezamenlijk wordt het woord
      ‘*Koninkrijk*’ gebruikt.

      4 Het woord ‘*land*’ wordt gebruikt ter aanduiding van Nederland, Aruba, Curaçao of Sint Maarten als component van
      het Koninkrijk.

      5 Het woord ‘*Rijk*’ als aanduiding van Nederland of van het Koninkrijk wordt vermeden, indien over de betekenis
      daarvan onduidelijkheid kan bestaan.


          **Toelichting**
          **Eerste en tweede lid.**Vanwege de grotendeels gescheiden rechtsstelsels van het Europese deel
      van Nederland enerzijds en Bonaire, Sint Eustatius en Saba anderzijds is het van belang dat uit een
      regeling duidelijk blijkt of een bepaald voorschrift zowel voor het Europese deel van Nederland als
      voor Bonaire, Sint Eustatius en Saba geldt, of slechts voor een van beide delen van Nederland. Uit
      [artikel 4 van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] volgt dat in een regeling
      die uitsluitend in het Europese deel van Nederland geldt, tevens de aanduiding ‘Nederland’ mag worden gebruikt ter
      aanduiding van het Europese deel van het grondgebied van Nederland. De uitdrukking ‘Rijk in Europa’ als aanduiding
      van het Europese deel van Nederland is verouderd. In toelichtingen kan ook worden gesproken van ‘Europees
      Nederland’ of, ter aanduiding van het gezamenlijke grondgebied van Bonaire, Sint Eustatius en Saba, van ‘Caribisch
      Nederland’. De aanduiding ‘Caribisch Nederland’ moet overigens niet worden verward met de aanduiding ‘de Caribische
      delen van het Koninkrijk’, waartoe behalve Bonaire, Sint Eustatius en Saba ook de landen Aruba, Curaçao en Sint
      Maarten behoren.
          **Derde lid.**Als partij bij een verdrag wordt de aanduiding ‘Koninkrijk der Nederlanden’ gebruikt (zie
      [aanwijzing 8.1][ref2]).


      [ref1]: https://wetten.overheid.nl/BWBR0028063#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
