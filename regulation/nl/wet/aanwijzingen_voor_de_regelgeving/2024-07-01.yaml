        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '4.14'
    text: |-
      1 Een regeling voorziet in haar inwerkingtreding.

      2 Bij de vaststelling van het moment van inwerkingtreding wordt geen onderscheid gemaakt tussen categorieën van
      gevallen waarop de regeling toepasselijk wordt.


          **Toelichting**
          **Eerste lid.**Een regeling dient altijd een inwerkingtredingsbepaling te bevatten.
      [Artikel 10, eerste lid, van de Bekendmakingswet][ref1] is slechts bedoeld als vangnet voor het geval een bepaling
      omtrent de inwerkingtreding achterwege is gelaten in algemeen verbindende voorschriften afkomstig van de centrale
      overheid: de regeling treedt in dat geval in werking met ingang van de eerste dag van de tweede kalendermaand na
      de datum van bekendmaking. Zie voor de formulering van inwerkingtredingsbepalingen de [aanwijzingen 4.21][ref2]
      en [4.22][ref3].
          **Rijkswetgeving.** [Artikel 10, eerste lid, van de Bekendmakingswet][ref4] kan zijn
      vangnetfunctie niet vervullen voor rijkswetten en algemene maatregelen van rijksbestuur: krachtens
      [artikel 22, tweede lid, van het Statuut voor het Koninkrijk][ref5] moeten de laatstgenoemde regelingen steeds zelf
      hun inwerkingtreding regelen.
          **Tweede lid.** De strekking van dit lid is dat aan een regelingsonderdeel of een wijziging daarvan niet meer
      dan één inwerkingtredingsmoment wordt toegekend. Wanneer verschillende inwerkingtredingsmomenten voor verschillende
      categorieën van gevallen worden vastgesteld geeft dit complicaties, bijvoorbeeld bij de vraag of de regeling
      als in werking getreden getoond moet worden op [www.wetten.nl](http://www.wetten.nl). Dit geldt a fortiori voor
      situaties waarin bepaald wordt dat een wijziging van een regeling op verschillende momenten in werking treedt
      voor verschillende groepen van gevallen. Daardoor ontstaat namelijk de situatie dat gedurende een bepaalde periode
      gelijktijdig twee versies van de regeling juridische gelding hebben. Zeker wanneer gedurende de overgangsfase
      nog wijzigingen van de oude of nieuwe versie van de regeling noodzakelijk zijn, leidt dit tot complicaties. Voor
      zulke gevallen is het wenselijker om verschillende toepassingsmomenten aan te wijzen met ingang waarvan de in
      werking getreden regeling gaat gelden voor de te onderscheiden categorieën. Bij wijzigingen van regeling kan worden
      gedacht aan overgangsrechtelijke bepalingen waarmee eerbiedigende of uitgestelde werking aan de nieuwe regeling
      wordt verleend (zie [aanwijzing 5.64][ref6]). Bij geheel nieuwe regelingen valt te denken aan het aanwijzen van
      toepassingsmomenten, zie aanwijzing 5.74a.
          Deze aanwijzing staat er niet aan in de weg dat per onderdeel van een regeling verschillende
      inwerkingtredingsmomenten worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
