  - number: '8.21'
    text: |-
      Voordat de Minister van Buitenlandse Zaken, na verkregen parlementaire goedkeuring, de binding van het Koninkrijk
      voor enig deel daarvan aan een verdrag tot stand doet brengen, vergewist de afdeling Verdragen van de Directie
      Juridische Zaken zich ervan bij de medebetrokken ministeries en in voorkomend geval bij de Gevolmachtigde Ministers
      van Aruba, Curaçao en Sint Maarten dat er geen bezwaar bestaat tegen de totstandbrenging van de binding voor dat
      deel van het Koninkrijk.


          **Toelichting**
          Het kan zich voordoen dat het direct tot stand brengen van de binding niet opportuun is, bijvoorbeeld omdat
      dit gemeenschappelijk in EU-kader dient plaats te vinden of omdat nog uitvoeringsmaatregelen moet worden getroffen.
      Voorts zou het kunnen voorkomen dat door plotseling veranderende omstandigheden de totstandbrenging van de binding
      niet meer opportuun is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.21
  - number: '9.1'
    text: |-
      Onder implementatie wordt in dit hoofdstuk verstaan: de uitvoering van bindende EU-rechtshandelingen in het
      nationale recht door middel van het vaststellen van algemeen verbindende voorschriften.


          **Toelichting**
          De in hoofdstuk 9 opgenomen aanwijzingen hebben tot doel de tijdige en juiste implementatie van bindende EU-
      rechtshandelingen te realiseren (zie voor het begrip bindende EU-rechtshandelingen [aanwijzing 1.3][ref1]).
      Ten behoeve van implementatie kunnen zowel regelgevende als niet-regelgevende activiteiten noodzakelijk zijn
      (bijvoorbeeld de toepassing en handhaving en het verrichten van de implementatiemelding). In dit hoofdstuk wordt
      met implementatie in het bijzonder gedoeld op het treffen van de maatregelen van intern recht die een lidstaat
      van de Europese Unie neemt ter uitvoering van bindende EU-rechtshandelingen (in EU-verband wordt hier gewoonlijk
      de term transpositie voor gebruikt). De implementatie van EU-richtlijnen is pas afgerond indien de melding aan
      de Europese Commissie is voltooid (zie [aanwijzing 9.19][ref2]). Dit hoofdstuk ziet op regelgevende activiteiten,
      zoals:
          het vastleggen van te waarborgen rechten en verplichtingen;
      het aanpassen van strijdige regelgeving;
      het creëren van noodzakelijke uitvoerings- en handhavingsstructuren (bijvoorbeeld het aanwijzen van een
      toezichthouder).
          Deze aanwijzingen zijn als zodanig niet slechts van belang voor (wetgevings)juristen, maar voor een ieder die
      bij de voorbereiding en implementatie van bindende EU-rechtshandelingen is betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.1
    references:
