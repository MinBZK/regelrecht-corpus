  - number: '5.36'
    text: |-
      Voor de regeling van de aanwijzing van toezichthouders worden de volgende modellen gebruikt:

      a. bij aanwijzing van toezichthouders bij de wet:

      *Met het toezicht op de naleving van [aanduiding desbetreffende voorschriften] zijn belast [aanduiding ambtenaren
      of andere personen].*

      b. bij aanwijzing van toezichthouders krachtens de wet:

      1. *Met het toezicht op de naleving van [aanduiding desbetreffende voorschriften] zijn belast de bij besluit van
      [aanduiding bestuursorgaan] aangewezen [ambtenaren / personen].*

      2. *Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.*


          **Toelichting**
          De bevoegdheden die toezichthouders hebben bij de uitoefening van hun taak zijn ten algemene geregeld in
      [titel 5.2 Awb][ref1]. Krachtens [artikel 5:14][ref2] van die wet kunnen de bevoegdheden onder andere bij wettelijk
      voorschrift worden beperkt. Zie hiervoor het model in [aanwijzing 5.37][ref3].
          [Titel 5.2 Awb][ref4] is niet van toepassing in Bonaire, Sint Eustatius en Saba. De toekenning van bevoegdheden
      aan toezichthouders zal in een (mede) voor die eilanden geldende regeling uitdrukkelijk moeten worden geregeld
      (zie bijvoorbeeld de [artikelen 7:4 e.v. van de Wet financiële markten BES][ref5]). Daarbij moet er rekening mee
      worden gehouden dat [titel 5.2 Awb][ref6] verwijzingen bevat naar Nederlandse wetgeving die niet van toepassing
      is in Bonaire, Sint Eustatius en Saba. Deze verwijzingen zullen moeten worden vervangen door verwijzingen naar de
      relevante BES-wetgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel514
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0005537
      [ref5]: https://wetten.overheid.nl/BWBR0030883#Artikel74
      [ref6]: https://wetten.overheid.nl/BWBR0005537
