  - number: 5.68.1
    text: |-
      Indien de formulering van een wetsvoorstel tot wijziging van een wet afhankelijk is van een wijziging die een ander
      wetsvoorstel beoogt teweeg te brengen in diezelfde wet, wordt een samenloopbepaling overeenkomstig het volgende
      model opgenomen: *Indien het bij koninklijke boodschap van [datum] ingediende voorstel van wet [opschrift en
      Kamerstuknummer] tot wet is of wordt verheven en [artikel... van] die wet eerder in werking is getreden of treedt
      dan [artikel... van] deze wet, wordt [artikel... van] deze wet als volgt gewijzigd:....*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.68
  - number: 5.68.2
    text: |-
      Indien een wetsvoorstel tot wijziging van een wet gevolgen heeft voor de formulering van een ander wetsvoorstel
      tot wijziging van diezelfde wet, wordt een samenloopbepaling overeenkomstig het volgende model opgenomen: *Indien
      het bij koninklijke boodschap van [datum] ingediende voorstel van wet [opschrift en Kamerstuknummer] tot wet
      is of wordt verheven en [artikel ... van] die wet later in werking treedt dan [artikel ... van] deze wet, wordt
      [artikel ... van] die wet als volgt gewijzigd: ....*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.68
  - number: 5.68.3
    text: |-
      Indien er tussen twee wetsvoorstellen tot wijziging van dezelfde wet een wederzijdse tekstuele afhankelijkheid
      bestaat, wordt een samenloopbepaling overeenkomstig het volgende model opgenomen: *Indien het bij koninklijke
      boodschap van [datum] ingediende voorstel van wet [opschrift en Kamerstuknummer] tot wet is of wordt verheven en
      [artikel ... van] die wet:*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.68
  - number: 5.68.3.a
    text: |-
      *eerder in werking treedt of is getreden dan [artikel ... van] deze wet, wordt [artikel ... van] deze wet als volgt
      gewijzigd: ...;*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.68
  - number: 5.68.3.b
    text: |-
      *later in werking treedt dan [artikel ... van] deze wet, wordt [artikel ... van] die wet als volgt
      gewijzigd: ... .*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.68
  - number: 5.68.4
    text: |-
      Indien een wetsvoorstel gevolgen heeft voor de formulering van een wetsvoorstel dat beoogt een nieuwe wet tot stand
      te brengen, wordt een samenloopbepaling overeenkomstig het volgende model opgenomen: *Indien het bij koninklijke
      boodschap van [datum] ingediende voorstel van wet [opschrift en Kamerstuknummer] tot wet is of wordt verheven,
      wordt [artikel ... van] die wet als volgt gewijzigd: ....*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.68
  - number: 5.68.5
    text: |-
      Indien de formulering van een wetsvoorstel dat beoogt een nieuwe wet tot stand te brengen, afhankelijk is van
      een ander wetsvoorstel, wordt een samenloopbepaling overeenkomstig het volgende model opgenomen: *Indien het
      bij koninklijke boodschap van [datum] ingediende voorstel van wet [opschrift en Kamerstuknummer] tot wet is
      of wordt verheven en [artikel ... van] die wet in werking treedt, wordt [artikel ... van] deze wet als volgt
      gewijzigd: ....*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.68
  - number: 5.69.1
    text: |-
      Indien door samenloop van twee of meer voorstellen van wet nog geen duidelijkheid bestaat over de uiteindelijke
      aanduiding van een artikel, een lid of een onderdeel, kan voor die aanduiding in het desbetreffende wetsvoorstel
      gebruik worden gemaakt van het symbool ‘#’, waarbij tussen blokhaken wordt vermeld op welke wijze de aanduiding in
      de bestaande nummering of lettering wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.69
  - number: 5.69.2
    text: |-
      In de drukproeffase wordt het symbool ‘#’ vervangen door de uiteindelijke aanduiding. De tussen blokhaken
      geplaatste tekst wordt daarbij geschrapt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.69
  - number: 5.70.1
    text: |-
      Indien daaromtrent niets is geregeld en de bedoeling van de wetgever niet uit de regeling of de toelichting kan
      worden afgeleid, is voor de volgorde van inwerkingtreding van twee of meer regelingen die op hetzelfde tijdstip in
      werking treden, bepalend:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.70
  - number: 5.70.1.a
    text: de datum van vaststelling van de regeling;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.70
  - number: 5.70.1.b
    text: |-
      indien de datum van vaststelling van beide regelingen dezelfde is: de datum van uitgifte van het Staatsblad of
      de Staatscourant;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.70
  - number: 5.70.1.c
    text: |-
      indien de datum van vaststelling en de datum van uitgifte van beide regelingen dezelfde zijn: het volgnummer van
      het Staatsblad of de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.70
  - number: 5.70.2
    text: |-
      Voor het regelen van de volgorde van inwerkingtreding van twee of meer wetten of algemene maatregelen van bestuur
      door middel van een inwerkingtredingsbesluit wordt een van de volgende modellen gebruikt:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.70
  - number: 5.70.2.A
    text: '*Met ingang van [datum] treden de volgende [wetten/besluiten] in werking, in de hieronder aangegeven volgorde:*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.70
  - number: 5.70.2.A.a
    text: '*(...);*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.70
  - number: 5.70.2.A.b
    text: '*(...).*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.70
  - number: 5.70.2.B
    text: |-
      *Met ingang van [datum] treedt [wet/besluit] in werking, met dien verstande dat die wet/dat besluit in werking
      treedt voordat/nadat [wet/besluit] in werking treedt.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.70
  - number: 5.71.1
    text: 'Voor het regelen van de werkingsduur van een tijdelijke regeling wordt een van de volgende modellen gebruikt:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.71
  - number: 5.71.1.A
    text: |-
      *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking [op / met ingang van...: zie
      aanwijzing 4.21] en vervalt [met ingang van ... / ... jaar na het tijdstip van inwerkingtreding].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.71
  - number: 5.71.1.B
    text: |-
      *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking [op / met ingang van...: zie
      aanwijzing 4.21] en vervalt op een bij [koninklijk besluit / door Onze Minister van/voor ... / door de Minister
      van/voor ...] te bepalen tijdstip.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.71
  - number: 5.71.2
    text: |-
      De verlenging van een tijdelijke regeling geschiedt door een wijziging van de vervaldatum die in de regeling (in
      geval van toepassing van model A) of het koninklijk of ministerieel besluit (in geval van toepassing van model B)
      is opgenomen, en die uiterlijk met ingang van de oorspronkelijke datum in werking kan treden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.71
  - number: '5.72'
    text: |-
      De tijdelijkheid van een regeling wordt in het opschrift en de citeertitel tot uitdrukking gebracht.
          **Voorbeelden**
          Wet van 4 december 2013 inzake invoering van een tijdelijke heffing voor de bankensector (Tijdelijke wet
      resolutieheffing 2014)
      Besluit van 16 februari 2001 tot regeling van de doeluitkering bestrijding van rampen en zware ongevallen voor de
      periode van 1 januari 2001 tot en met 31 december 2002 (Interim-besluit doeluitkering bestrijding van rampen en
      zware ongevallen).
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.72
  - number: 5.73.1
    text: 'Indien het gewenst is tijdelijk van een bestaande regeling af te wijken, geschiedt dit in de vorm van:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.73
  - number: 5.73.1.a
    text: een zelfstandige afwijkende regeling met tijdelijke werking; of
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.73
  - number: 5.73.1.b
    text: een wijzigingsregeling die opeenvolgende wijzigingen aanbrengt in de tijdelijk te wijzigen regeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.73
  - number: 5.73.2
    text: |-
      In het geval, bedoeld in het eerste lid, onderdeel b, wordt, indien mogelijk, de opvolgende wijziging opgenomen in
      de tijdelijk te wijzigen regeling zelf, en wordt daarin ook tot uitdrukking gebracht op welk tijdstip de opvolgende
      wijziging effect zal krijgen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.73
  - number: '5.74'
    text: |-
      Om aan te geven dat aan een regeling of een onderdeel daarvan tijdelijk gelding kan worden verleend of de gelding
      daarvan kan worden opgeschort wordt de term ‘in werking stellen’, respectievelijk ‘buiten werking stellen’,
      gebruikt. **Toelichting** Met name in noodwetgeving komt het voor dat een regeling of regelingsonderdeel
      tijdelijk in of buiten werking gesteld moet kunnen worden. Het is niet wenselijk dat te regelen door middel van
      de inwerkingtreding daarvan. Van nog niet in werking getreden (onderdelen van) regelingen wordt in beginsel de
      tekst niet getoond in het Basiswettenbestand, terwijl bovendien onduidelijkheden optreden hoe zo’n regeling of
      regelingsonderdeel vervolgens weer gedeactiveerd moet worden en op een later moment weer in werking gesteld moet
      worden. **Voorbeeld**
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.74
  - number: 5.74.1
    text: |-
      Indien de beperkte noodtoestand is afgekondigd, worden bij koninklijk besluit, op voordracht van Onze Minister-
      President, voor Nederland of een gedeelte daarvan bepalingen in werking gesteld die voorkomen op de bij deze wet
      behorende lijst A.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.74
  - number: 5.74.2
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het in het
      eerste lid bedoelde besluit in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons
      oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.74
  - number: 5.74a
    text: |-
      1 Indien het noodzakelijk is om te regelen dat een regeling of regelingsonderdeel niet direct bij inwerkingtreding
      zal gelden voor één of meer categorieën van gevallen wordt dit tot uitdrukking gebracht door een afwijkend moment
      vast te stellen met ingang waarvan die regeling of dat onderdeel van toepassing wordt voor de desbetreffende
      categorie.

      2 Een wet kan bepalen dat een daarin aangewezen toepassingsmoment bij koninklijk besluit wordt vastgesteld.

      **Eerste lid.** Voorkomen moet worden dat voor verschillende categorieën verschillende inwerkingtredingsmomenten
      van een regeling worden vastgesteld (zie [aanwijzing 4.14][ref1]). Normaliter is een regeling of regelingsonderdeel
      algemeen toepasselijk vanaf het moment van inwerkingtreding daarvan. Indien het noodzakelijk is van deze
      hoofdregel af te wijken door voor een of meer categorieën van gevallen een later toepassingsmoment vast te stellen,
      krijgt een in werking getreden regeling(selement) uitgestelde werking ten aanzien van die gevallen waarvoor het
      toepassingsmoment nog niet is bereikt. Deze figuur kan met name bruikbaar zijn bij de implementatie van Europese
      regelgeving waarin verschillende data van toepassing zijn vastgesteld voor verschillende categorieën van gevallen.

      Indien bij een wijziging van regelgeving een later toepassingsmoment van de nieuwe regeling moet gelden voor een
      categorie van gevallen, kan ook door middel van overgangsrecht uitgestelde werking aan de nieuwe regeling worden
      verleend voor de aangewezen categorie (zie [aanwijzing 5.64][ref2]).

      **Tweede lid.** Deze figuur is vergelijkbaar met de vaststelling van het tijdstip van inwerkingtreding bij
      afzonderlijk koninklijk besluit.

      – Deze wet is van toepassing met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor verschillende
      categorieën van inrichtingen verschillend kan worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.74a
