  - number: '7.18'
    text: |-
      1 De nota naar aanleiding van het verslag volgt zoveel mogelijk de indeling en de volgorde van het verslag.

      2 Indien dat wenselijk is met het oog op verwijzing worden in de nota naar aanleiding van het verslag de onderdelen
      of vragen van het verslag genummerd wanneer dat niet is gebeurd in het verslag zelf.

      3 Deze aanwijzing is van overeenkomstige toepassing op andere stukken die het karakter hebben van een puntsgewijze
      reactie op voorgelegde vragen of opmerkingen.


          **Toelichting**
          **Eerste lid.**In de nota naar aanleiding van het verslag kan ervoor worden gekozen de vragen uit het verslag
      bij de beantwoording te parafraseren of te herhalen, of de tekst van het verslag integraal over te nemen en daar de
      puntsgewijze beantwoording van de vragen tussen te plaatsen.
          **Tweede lid.**Het aanbrengen van een nummering brengt geen inhoudelijke wijziging in de tekst aan en kan
      zinvol zijn om het verwijzen naar vragen of antwoorden te vereenvoudigen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.18
  - number: '7.19'
    text: |-
      De beantwoording van een verslag van de Tweede Kamer vindt in beginsel plaats binnen eenzelfde termijn als die
      welke de Kamercommissie heeft genomen voor het uitbrengen van het verslag, waarbij als aanvangsdatum geldt de datum
      van de koninklijke boodschap.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.19
  - number: '7.20'
    text: |-
      Leden van de Tweede Kamer die een amendement willen voorstellen, kunnen het betrokken ministerie bijstand verzoeken
      bij het formuleren van amendementen. Deze bijstand wordt zoveel mogelijk verleend.


          **Toelichting**
          Kamerleden, hun fractiemedewerkers en medewerkers van het Bureau Wetgeving van de Tweede Kamer kunnen
      ambtenaren rechtstreeks om ambtelijke bijstand verzoeken bij het opstellen van amendementen. Ambtenaren informeren
      hun bewindspersoon over het feit dat bijstand is verzocht en verleend. De ambtelijke bijstand bestaat uit
      juridische en wetgevingstechnische adviezen bij het formuleren van een amendement, of om toetsing van amendementen.
      De adviezen kunnen bijvoorbeeld ook juridische inpassing van een amendement in het wetsvoorstel betreffen, of
      de verenigbaarheid daarvan met Europees of internationaal recht. Verder kan het omvatten de verrichting van
      procedurele handelingen door het departement waartoe het amendement aanleiding zou geven, zoals notificatie
      bij de Europese Commissie (zie [aanwijzing 9.19][ref1]) of het verrichten van een specifiek voorgeschreven
      evenredigheidsbeoordeling en toepassing van publieke consultatie (zie de toelichting bij [aanwijzing 2.15][ref2]).
      Ingevolge [artikel 9.5, tweede lid, van het Reglement van Orde van de Tweede Kamer][ref3], worden amendementen
      beknopt toegelicht. De bijstand strekt zich in beginsel niet uit tot het formuleren van deze toelichting.


