  - number: 8.20.3
    text: |-
      Voor de overlegging aan de beide Kamers der Staten-Generaal van een verdrag, dat de verlenging van een aflopend
      verdrag betreft, zoals bedoeld in [artikel 7, onder e, van de Rijkswet goedkeuring en bekendmaking verdragen][ref1],
      wordt een zodanig tijdstip gekozen dat ten minste twee derde van de in
      [artikel 9, tweede lid, van de Rijkswet goedkeuring en bekendmaking verdragen][ref2] genoemde termijn buiten een
      reces van de Kamers valt.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0006799#Artikel9
