    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.43
  - number: 3.43.2
    text: 'Verwijzing naar een wetsvoorstel geschiedt overeenkomstig de volgende voorbeelden:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.43
  - number: 3.43.2.−
    text: |-
      *het bij koninklijke boodschap van 8 mei 2009 ingediende voorstel van wet tot wijziging van de Meststoffenwet
      (differentiatie fosfaatgebruiksnorm) (Kamerstukken 31945);*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.43
  - number: 3.43.2.−
    text: |-
      *het bij geleidende brief van 13 september 2016 aanhangig gemaakte voorstel van wet van de leden Siderius en Van
      Meenen tot wijziging van de Wet op het primair onderwijs ter bevordering van kleinere klassen in het basisonderwijs
      (Kamerstukken 34538).*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.43
  - number: '3.44'
    text: |-
      Verwijzingen naar gepubliceerde jurisprudentie geschiedt door het gebruik van de European Case Law Identifier
      (ECLI) overeenkomstig het volgende voorbeeld: *HR 7 maart 1979, ECLI:NL:HR:1979:AB7440.*
          **Toelichting**
          Verwijzingen naar vindplaatsen in bijvoorbeeld NJ of AB worden ook voor oudere jurisprudentie niet meer
      gebruikt. Via www.rechtspraak.nl is voor dergelijke uitspraken een ECLI te vinden. In incidentele gevallen waarin
      (nog) geen ECLI beschikbaar is, kan een andere manier van verwijzing worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.44
  - number: 3.45.1
    text: |-
      Vermelding van vindplaatsen in het Staatsblad, de Staatscourant en het Tractatenblad geschiedt door toevoeging
      tussen haakjes van aanduidingen overeenkomstig de volgende voorbeelden: - *Stb. 2011, 35;*
        - *Stcrt. 2015, 10247;*
        - *Trb. 2008, 175*.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.45
  - number: 3.45.2
    text: |-
      Indien de regeling waarnaar wordt verwezen nog niet in het Staatsblad, de Staatscourant of het Tractatenblad is
      bekendgemaakt, wordt de vindplaats in ontwerpen van die regeling aangeduid door aanduiding van het jaartal en
      nummer van het publicatieblad met puntjes, overeenkomstig het volgende voorbeeld: *Stb. ..., ....*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.45
  - number: 3.45.3
    text: |-
      Het invullen van het jaartal en nummer van het desbetreffende publicatieblad geschiedt door het betrokken
      ministerie, uiterlijk bij de bekendmaking van de regeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.45
  - number: '3.46'
    text: |-
      Voor het Publicatieblad van de Europese Unie wordt de afkorting ‘*PbEU*’ gebruikt. Bij aanduiding van een nummer
      van het Publicatieblad gaat aan het nummer vooraf de aanduiding ‘*L*’ (Legislatio) of ‘*C*’ (Communicatio).
          **Toelichting**
          Bij mededelingen die in het C-blad verschijnen is de vermelding van de vindplaats in dat blad zinvol ter unieke
      identificatie van de publicatie, en als middel om de publicatie snel te kunnen vinden op de website [https://eur-
      lex.europa.eu](https://eur-lex.europa.eu). Voor publicaties die in het L-blad worden geplaatst, is die vermelding
      niet nodig omdat het unieke nummer waaronder deze vindbaar zijn, deel uitmaakt van de titel van de rechtshandeling
      zelf (zie [aanwijzing 3.42][ref1]). Wanneer er een bijzondere is om toch de vindplaats te vermelden (bijvoorbeeld
      om de datum van uitgifte van het betreffende Publicatieblad aan te duiden) wordt de notatie gebruikt zoals in deze
      aanwijzing beschreven.
          Hoewel de EU zelf de afkorting ‘Pb’ hanteert wordt, ter voorkoming van verwarring met het Publicatieblad van
      Curaçao, de afkorting ‘PbEU’ gebruikt dan wel, indien het een publicatie van voor 1 februari 2003 betreft, de
      afkorting ‘PbEG’.
          Vanaf 1 oktober 2023 hanteert de EU een andere wijze van nummering, zie de voorbeelden hieronder.
          **Voorbeelden**
          Mededelingen/rechtshandelingen van voor 1 februari 2003: Richtlijn 83/ 189/EEG van de Raad van 28 maart 1983
      betreffende een informatieprocedure op het gebied van normen en technische voorschriften (PbEG 1983, L 109)
      Mededelingen/rechtshandelingen van 1 februari 2003 tot 1 oktober 2023: Mededeling van de Commissie inzake
      financiële sancties in niet-nakomingsprocedures (PbEU 2023, C 2)
      Mededelingen/rechtshandelingen vanaf 1 oktober 2023: Mededeling van de Commissie van 5 januari 2024 inzake
      wisselkoersen van de euro (PbEU C 2024/573) [Uitvoeringsrichtlijn (EU) 2024/325](32024L0325) van de Commissie van
      19 januari 2024 tot wijziging van [Uitvoeringsrichtlijn (EU) 2019/68](32019L0068) wat betreft de minimale diepte
      van markeringen op vuurwapens en essentiële onderdelen (PbEU L 2024/325).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.46
