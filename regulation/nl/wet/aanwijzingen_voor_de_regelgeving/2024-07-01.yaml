        hoofdstuk: '4'
        paragraaf: '4.9'
  - number: '2.10'
    text: |-
      1 Bij de keuzes met betrekking tot vorm en inhoud van een regeling wordt gestreefd naar zo beperkt mogelijke lasten
      voor burgers, bedrijven en instellingen, alsmede voor de overheid zelf.

      2 Tevens wordt rekening gehouden met het doenvermogen van degenen die geraakt worden door de regeling.

      3 Bij het ontwerpen van een regeling wordt mede rekening gehouden met de uitvoerbaarheid daarvan, in het bijzonder
      wat betreft de aanpassing of ontwikkeling van de voor de uitvoering vereiste ICT-systemen.


          **Toelichting**
          **Eerste lid.** Deze aanwijzing staat niet in de weg aan het opleggen van lasten daar waar dat een bewust
      geaccepteerde, noodzakelijke consequentie is van het gekozen sturingsinstrument. Wel moet zoveel mogelijk voorkomen
      worden dat lasten worden opgelegd die niet bijdragen aan het bereiken van het doel van de regeling, of indien
      alternatieven bestaan waarmee hetzelfde resultaat op lastenluwere wijze bereikt kan worden. Bij het maken van een
      keuze tussen verschillende varianten voor een regeling kan het noodzakelijk zijn de lasten voor de overheid af te
      wegen tegen de lasten voor de maatschappij. De lasten voor de maatschappij bestaan uit financiële lasten die het
      gevolg zijn van een verplichting om bijvoorbeeld een geldbedrag over te maken aan de overheid of het bevoegd gezag
      (zoals belastingen, retributies, premies, leges, boetes en heffingen) en uit regeldrukkosten.
          Regeldrukkosten zijn alle investeringen en inspanningen die burgers, bedrijven of professionals moeten doen of
      verrichten om te voldoen aan verplichtingen uit regelgeving afkomstig van de rijksoverheid, uitgedrukt in euro’s.
      Het gaat hierbij om kosten die voortvloeien uit informatieverplichtingen en inhoudelijke verplichtingen, waaronder
      toezichtgerelateerde verplichtingen op basis van regelgeving. De kosten kunnen worden verdeeld in eenmalige en
      structurele kosten; de verdeling tussen administratieve lasten en nalevingskosten is vervallen. Zie voor de wijze
      waarop deze lasten vastgesteld en gekwantificeerd dienen te worden onderdeel 4 (Wat zijn de gevolgen van deze
      opties?) van het Beleidskompas. Zie ook aanwijzing 9.5 over lastenluwe implementatie.
          Bij lasten voor de overheid kan worden gedacht aan:
          lasten die rechtstreeks zijn gemoeid met de uitvoering van de regeling, zoals voorlichting, het behandelen
      van aanvragen voor vergunningen en ontheffingen, de inning van belastingen en heffingen en de uitvoering van in de
      regeling voorgeschreven feitelijke handelingen;
      lasten die voortvloeien uit in de regeling vervatte procedurele voorschriften, zoals voorschriften inzake
      verplichte advisering, inspraak, vormen van preventief toezicht, planning, verslagleggingsverplichtingen en
      evaluatieverplichtingen;
      lasten die verband houden met het toezicht op de naleving en met de handhaving van de regeling (wat de handhaving
      betreft gaat het om lasten in verband met onder meer de van overheidswege gefinancierde rechtshulp, het openbaar
      ministerie, de politie, het gevangeniswezen, andere justitiële diensten en de rechtspraak);
      lasten die voortvloeien uit de rechtsbescherming, zoals lasten in verband met de van overheidswege gefinancierde
      rechtshulp, met de behandeling van bezwaarschriften en met de rechtspraak en lasten voor uitvoerende instanties als
      gevolg van procedures.
          Om zicht te krijgen op deze lasten en de consequenties daarvan voor de organisatie is het noodzakelijk om in
      ieder geval bij ingrijpende voorstellen tijdig een uitvoeringstoets te laten plaatsvinden.
          De onder b bedoelde lasten voor de overheid kunnen onder meer worden beperkt door te streven naar soberheid
      in procedurele voorschriften en naar een duidelijke toedeling en afbakening van bestuurlijke bevoegdheden zowel op
      centraal als op decentraal niveau. Bij toedeling van bevoegdheden aan decentraal niveau worden met name bemoeienis
      van hoger niveau met de uitoefening van deze bevoegdheden (bijvoorbeeld preventief toezicht) en verplichtingen
      van het decentrale niveau jegens hoger niveau ter zake (bijvoorbeeld verplichte verslaglegging) zoveel mogelijk
      vermeden. Zie voor nadere informatie over lasten voor de overheid onderdeel 4 (Wat zijn de gevolgen van deze
      opties?) van het Beleidskompas.
          Het brengen van meer doelen binnen één regeling kan de uitvoering van die regeling ingewikkelder maken en
      daarmee de voor de overheid met die regeling gemoeide lasten doen toenemen. Aan de andere kant zal het voor de
      burger vaak belastender zijn om met diverse, naast elkaar werkende regelingen te worden geconfronteerd dan met één
      geïntegreerde regeling. Zie ook [aanwijzing 2.34][ref1].
          Zie met betrekking tot de toelichting bij een regeling aanwijzing 4.43, onderdeel e, en aanwijzing 4.45. Zie
      voor de toetsing op regeldruk aanwijzing 7.5a.
          **Tweede lid.** Bij de keuzes met betrekking tot vorm en inhoud van een regeling wordt ook rekening gehouden
      met het doenvermogen van degenen die erdoor worden geraakt. Hiertoe is besloten in de kabinetsreactie op het
      rapport ‘Weten is nog geen doen: Een realistisch perspectief op redzaamheid’ van de Wetenschappelijke raad voor
      het regeringsbeleid (WRR) (Kamerstukken II 2017/18, 34 775-VI, nr. 88). Doenvermogen wordt daar aangeduid als
      het in staat zijn om een plan te maken, in actie te komen, vol te houden en het (herhaaldelijk) om te kunnen
      gaan met verleidingen en tegenslagen. Veel mensen zijn daar slechts beperkt toe in staat. Het gaat daarbij niet
      alleen om ‘kwetsbare’ groepen, zoals laaggeletterden en mensen met een laag IQ, maar ook om mensen met een goede
      opleiding en een goede maatschappelijke positie. De overheid moet bij de ontwikkeling van beleid en regelgeving
      uitgaan van realistische aannames over de mentale belastbaarheid van burgers en daarbij (meer) gebruik maken van
      gedragswetenschappelijke inzichten. Onderdeel daarvan is het vooraf toetsen of een regeling ‘doenlijk’ is (de
      doenvermogentoets) en zo nodig maatregelen nemen om ervoor te zorgen dat aangesloten wordt bij het doenvermogen.
      Bij het bepalen van het doenvermogen gaat het onder andere om de mentale belasting van mensen, de cumulatie van
      lasten, de gevolgen van inertie of fouten en de mate waarin wordt voorzien in vroegsignalering en een toegankelijke
      frontoffice. Het begrip doenvermogen uit het WRR-rapport is weliswaar gericht op burgers, maar het kabinet past het
      ook toe op zzp’ers en het (kleine) mkb (Kamerstukken II 2017/18, 32 637, nr. 314). Zie voor meer informatie over
      doenvermogen, de doenvermogentoets en het toepassen van gedragsinzichten de verplichte kwaliteitseis Doenvermogen
      in het Beleidskompas.
          Zie met betrekking tot de toelichting bij de regeling ook aanwijzing 4.43, onderdelen e en f.
          **Derde lid.** Bij het ontwerpen van een regeling is het noodzakelijk de consequenties van de ontwerpkeuzes
      die daarbij worden gemaakt te bezien vanuit het perspectief van de uitvoerbaarheid. Dat geldt in het bijzonder
      bij regelingen waarvan de uitvoering in belangrijke mate leunt op ICT-systemen. In zo’n geval is een vroegtijdige
      afstemming tussen de ontwerpers van de regeling en die van de systemen wenselijk om de uitvoerbaarheid in de
      praktijk te kunnen garanderen. Zie ook aanwijzing 7.5b.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
