  - number: '4.17'
    text: |-
      1 Een wet of een algemene maatregel van bestuur treedt in werking met ingang van 1 januari of 1 juli.

      2 Een ministeriële regeling treedt in werking met ingang van 1 januari, 1 april, 1 juli of 1 oktober.

      3 In afwijking van het eerste en tweede lid gelden voor regelingen over het onderwijs de volgende vaste
      verandermomenten:

      a. voor wetten en algemene maatregelen van bestuur betreffende het basisonderwijs, het (voortgezet) speciaal
      onderwijs, het voortgezet onderwijs en het middelbaar beroepsonderwijs: 1 januari en 1 augustus;

      b. voor ministeriële regelingen betreffende het basisonderwijs, het (voortgezet) speciaal onderwijs, het voortgezet
      onderwijs en het middelbaar beroepsonderwijs: 1 januari, 1 april, 1 augustus en 1 oktober;

      c. voor wetten en algemene maatregelen van bestuur betreffende het hoger onderwijs: 1 januari en 1 september;

      d. voor ministeriële regelingen betreffende het hoger onderwijs: 1 januari, 1 april, 1 september en 1 oktober.

      4 De termijn tussen de publicatiedatum van een wet, algemene maatregel van bestuur of ministeriële regeling en het
      tijdstip van inwerkingtreding is minimaal twee maanden. Indien een regeling direct relevant is voor medeoverheden,
      is deze termijn minimaal drie maanden.

      5 Uitzondering op de vaste verandermomenten of de minimuminvoeringstermijn is mogelijk voor zover:

      a. dit, gelet op de doelgroep of de jaarindeling, aanmerkelijke ongewenste private of publieke voor- of nadelen
      voorkomt;

      b. het spoed- of noodregelgeving betreft;

      c. het reparatieregelgeving betreft; of

      d. het implementatie van bindende EU-rechtshandelingen, verdragen of andere besluiten van volkenrechtelijke
      organisaties betreft.

      6 De toepassing van een uitzonderingsgrond wordt gemotiveerd in de toelichting bij de regeling of in de toelichting
      bij het inwerkingtredingsbesluit.


          **Toelichting**
          De toepassing van vaste verandermomenten en een minimuminvoeringstermijn zorgen ervoor dat degenen tot wie de
      regeling zich richt, niet op te veel verschillende momenten worden geconfronteerd met wijzigingen van regelgeving
      en dat ze tijd krijgen om zich hierop voor te bereiden.
          Het beleid met betrekking tot vaste verandermomenten en een minimuminvoeringstermijn is niet van toepassing
      op rijkswetgeving. Bij rijkswetgeving moet er bij het bepalen van de invoeringstermijn echter wel rekening mee
      worden gehouden dat de regeling – behalve in het Staatsblad of de Staatscourant – ook in het Afkondigingsblad van
      Aruba, het Publicatieblad van Curaçao en het Afkondigingsblad van Sint Maarten moet worden gepubliceerd. In verband
      daarmee verdient het aanbeveling voor de inwerkingtreding minimaal een termijn van een maand na de datum van
      uitgifte van het Staatsblad of de Staatscourant in Nederland aan te houden.
          Het beleid met betrekking tot vaste verandermomenten en een minimuminvoeringstermijn is evenmin van toepassing
      op beleidsregels.
          **Derde lid.**Voor regelingen op het terrein van het onderwijs gelden met het oog op het begin van het school-
      of studiejaar (per 1 augustus en 1 september) andere vaste verandermomenten.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: '4.19'
    text: |-
      De inwerkingtreding van bepalingen betreffende inwerkingtreding, inwerkingstelling, toepassingsmomenten en
      bekendmaking van een regeling, vaststelling van een citeertitel, delegatie van regelgevende bevoegdheid of
      parlementaire betrokkenheid bij de totstandkoming van een regeling hoeft niet uitdrukkelijk te worden geregeld.
      Deze bepalingen gelden vanaf het tijdstip van totstandkoming van de regeling.


          **Toelichting**
          Deze aanwijzing houdt in dat voor de bedoelde bepalingen bij de regeling van de inwerkingtreding geen
      afzonderlijke voorziening hoeft te worden getroffen. Evenmin is het nodig om deze bepalingen uitdrukkelijk uit te
      zonderen bij het formuleren van de inwerkingtredingsbepaling.
          **Parlementaire betrokkenheid.**Indien op grond van een bij de Staten-Generaal aanhangig wetsvoorstel reeds
      een uitvoeringsregeling wordt voorbereid die met toepassing van een in dat wetsvoorstel opgenomen bepaling met
      betrekking tot de totstandkomingsprocedure tot stand gebracht moet worden, kan de voorbereiding plaatsvinden
      overeenkomstig die bepaling. Bij de vaststelling van de uitvoeringsregeling is dan aan de verplichtingen inzake
      parlementaire betrokkenheid bij de uitvoeringsregeling voldaan. De uitvoeringsregeling kan dan op hetzelfde moment
      in werking treden als de wet waarop zij is gebaseerd. Zie ook de [aanwijzingen 2.35 tot en met 2.40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
