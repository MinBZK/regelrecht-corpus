  - number: '7.1'
    text: |-
      Bij de voorbereiding van een regeling worden de onderdelen van andere ministeries betrokken die bemoeienis hebben
      met het te regelen onderwerp of een onderdeel daarvan of met onderwerpen die door de regeling worden geraakt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.1
  - number: '7.2'
    text: |-
      1 Over een regeling die van betekenis is voor het rijksbeleid inzake decentrale overheden, overlegt het
      eerstverantwoordelijke ministerie in een vroegtijdig stadium met het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties.

      2 Indien de regeling wijziging brengt in de taken en bevoegdheden van decentrale overheden, vindt tijdig overleg
      plaats met de beheerders van het gemeentefonds, het provinciefonds of het BES-fonds over de financiële gevolgen
      daarvan.


          **Toelichting**
          **Eerste lid.**Dit lid houdt verband met de verantwoordelijkheid van de Minister
      van Binnenlandse Zaken en Koninkrijksrelaties voor de coördinatie van rijksbeleid dat
      de gemeenten en provincies of de openbare lichamen Bonaire, Sint Eustatius en Saba raakt
      ([artikel 116 van de Gemeentewet][ref1], [artikel 114 van de Provinciewet][ref2] en
      [artikel 209 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref3]). Zie in dit verband ook
      [aanwijzing 7.6][ref4].
          **Tweede lid**. [Artikel 2 van de Financiële-verhoudingswet][ref5] en
      [artikel 87 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref6] bepalen dat tijdig
      overleg plaatsvindt over de financiële gevolgen en de bekostigingswijze van beleidsvoornemens die leiden tot een
      wijziging van de uitoefening van taken of activiteiten door gemeenten, provincies of de openbare lichamen Bonaire,
      Sint Eustatius en Saba. Zie in dit verband ook [aanwijzing 4.46][ref7].


