  - number: '2.32'
    text: |-
      1 In een hogere regeling wordt niet toegestaan dat deze bij lagere regeling wordt gewijzigd.

      2 Het eerste lid is niet van toepassing op:

      a. het volgens vaste systematiek aanpassen van bedragen, tarieven en percentages;

      b. wetstechnische aanpassingen van verwijzingen naar bindende EU-rechtshandelingen en verdragen of onderdelen
      daarvan.

      3 In een delegatiebepaling waarin wijziging van een hogere regeling door een lagere regeling mogelijk wordt
      gemaakt, wordt, evenals in de lagere regeling, uitsluitend de term ‘wijzigen’ of ‘vervangen’ gebruikt.


          **Toelichting**
          **Eerste en tweede lid.**Tegen wijziging van een regeling bij regeling van lagere orde bestaat hetzelfde
      bezwaar als in [aanwijzing 2.31][ref1] ten aanzien van afwijking van een regeling bij regeling van lagere orde is
      geformuleerd, namelijk dat dit onoverzichtelijke regelgeving in de hand werkt. Daarom wordt ook slechts voor twee
      specifieke gevallen een uitzondering gemaakt, namelijk voor wijziging van tarieven, bedragen en percentages en voor
      technische wijziging van verwijzingen naar (onderdelen van) bindende EU-rechtshandelingen of verdragen.
          Van wetstechnische aanpassing van verwijzingen is sprake indien onderdelen van een bindende EU-rechtshandeling
      of verdrag zijn vernummerd of indien een bindende EU-rechtshandeling in het kader van ‘codificatie’ opnieuw is
      vastgesteld, zonder dat sprake is van inhoudelijke wijziging. De aanpassing van een verwijzing heeft dan een zuiver
      wetstechnisch karakter en is veelal spoedeisend vanwege het ontbreken van een implementatietermijn.
          **Derde lid.** Gebruik van andere termen (zoals herzien, aanpassen, in de plaats treden, indexeren) leidt tot
      onduidelijke delegatieopdrachten. Om die reden wordt in de delegatiebepaling de term ‘wijzigen’ of ‘vervangen’
      gebruikt en wordt de gedelegeerde regeling als een wijzigingsregeling vormgegeven. Ook wetsbepalingen die opdracht
      geven tot wijziging of vervanging ‘van rechtswege’ worden niet gebruikt. Zie ook [aanwijzing 6.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
