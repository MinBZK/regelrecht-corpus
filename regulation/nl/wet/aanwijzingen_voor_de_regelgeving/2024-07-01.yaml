  - number: '4.30'
    text: |-
      Indien het wenselijk is aan een regeling een inhoudsopgave toe te voegen, wordt deze bij de bekendmaking van de
      regeling achter de regeling opgenomen.


          **Toelichting**
          De inhoudsopgave is geen onderdeel van de regeling en wordt daarom achter de regeling (d.w.z. na de
      ondertekening van de regeling) opgenomen. Bij de indiening van een wetsvoorstel kan een inhoudsopgave afzonderlijk
      bij de stukken worden gevoegd. Bij andere regelingen kan dit bij de publicatie van de regeling in het Staatsblad of
      de Staatscourant.
          Bij de publicatie van de integrale tekst van een gewijzigde regeling wordt tevens een herziene inhoudsopgave
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.30
  - number: '4.31'
    text: |-
      1 Voor het slotformulier van een (rijks)wet wordt het volgende model gebruikt:

      *Lasten en bevelen dat deze in het Staatsblad [, in het Afkondigingsblad van Aruba, in het Publicatieblad van
      Curaçao en in het Afkondigingsblad van Sint Maarten] zal worden geplaatst en dat alle ministeries, autoriteiten,
      colleges en ambtenaren die zulks aangaat, aan de nauwkeurige uitvoering de hand zullen houden.*

      2 Voor het slotformulier van een algemene maatregel van (rijks)bestuur wordt het volgende model gebruikt:

      *Lasten en bevelen dat dit besluit met de daarbij behorende nota van toelichting in het Staatsblad [, in het
      Afkondigingsblad van Aruba, in het Publicatieblad van Curaçao en in het Afkondigingsblad van Sint Maarten] zal
      worden geplaatst.*

      3 Voor het slotformulier van een koninklijk (rijks)besluit van regelende aard, niet zijnde een algemene maatregel
      van bestuur, en van een koninklijk (rijks)besluit betreffende de inwerkingtreding van een (rijks)wet of een
      algemene maatregel van (rijks)bestuur wordt het volgende model gebruikt:

      *Onze Minister van/voor ... is belast met de uitvoering van dit besluit dat [met de daarbij behorende nota van
      toelichting] in het Staatsblad [, in het Afkondigingsblad van Aruba, in het Publicatieblad van Curaçao en in het
      Afkondigingsblad van Sint Maarten] zal worden geplaatst.*

      4 Voor het slotformulier van een ministeriële regeling wordt het volgende model gebruikt:

      *Deze regeling zal met de toelichting in de Staatscourant [, in het Afkondigingsblad van Aruba, in het
      Publicatieblad van Curaçao en in het Afkondigingsblad van Sint Maarten] worden geplaatst.*

      5 Voor het slotformulier van een beleidsregel wordt het volgende model gebruikt:

      *Deze beleidsregel zal [met de toelichting] in de Staatscourant worden geplaatst.*


          **Toelichting**
          **Derde lid.**Ook indien het besluit door een staatssecretaris is voorgedragen of ondertekend, wordt in het
      slotformulier de minister met de uitvoering belast (vgl. de [aanwijzingen 2.28][ref1] en [3.26, tweede lid][ref2]).
          **Vierde lid.** Indien een in het kader van rijkswetgeving vastgestelde regeling niet voor in alle in het
      model genoemde landen geldt, wordt de opdracht tot plaatsing aan die situatie aangepast. Zie in verband met
      rijkswetgeving ook de toelichting bij [aanwijzing 3.18][ref3].
          **Vijfde lid.** [Artikel 5, aanhef en onderdeel e, van de Bekendmakingswet][ref4] bepaalt dat beleidsregels
      vastgesteld vanwege het Rijk in de Staatscourant worden bekendgemaakt. Indien de beleidsregel geen toelichting
      bevat, wordt vanzelfsprekend de zinsnede ‘met de toelichting’ weggelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0004287#Artikel5
