        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '4.43'
    text: |-
      De toelichting bevat een verantwoording van de regeling. Daarbij komen, voor zover van toepassing, in ieder geval
      de volgende punten aan de orde:

      a. de doelen die met de regeling worden nagestreefd of, in het geval van een implementatieregeling, de aanleiding
      en achtergronden van de te implementeren internationale regeling of bindende EU-rechtshandeling;

      b. de noodzaak tot overheidsinterventie, mede bezien in relatie tot het zelfregulerende vermogen in de betrokken
      sector of sectoren, alsmede de overwogen varianten en de te verwachten neveneffecten van de regeling;

      c. de uitvoerings- en handhavingsaspecten van de regeling, zoals de keuze van het handhavingsstelsel en de mate
      waarin te verwachten is dat de toepassing van de regeling aanleiding geeft tot conflicten;

      d. de gevolgen voor de informatievoorziening van de rijksoverheid en voor de verwerking van persoonsgegevens;

      e. de lasten voor burgers, bedrijven en instellingen en de lasten voor de overheid, waaronder de lasten verbonden
      aan rechtsbescherming;

      f. de wijze waarop rekening is gehouden met het doenvermogen van degenen die geraakt worden door de regeling;

      g. de verenigbaarheid met hoger recht en de verhouding tot andere regelingen;

      h. de wijze waarop recht is gedaan aan het primaat van de wetgever, alsmede een motivering van de keuze van de
      overheidslaag waaraan bevoegdheden zijn toegedeeld;

      i. de positie van Bonaire, Sint Eustatius en Saba en de wijze waarop rekening is gehouden met eventuele bijzondere
      omstandigheden waardoor die eilanden zich wezenlijk onderscheiden van het Europese deel van Nederland;

      j. het overgangsrecht en de inwerkingtreding van de regeling;

      k. de inbreng van externe partijen bij de totstandkoming van de regeling, alsmede de bij de totstandkoming van de
      regeling voorgeschreven bijzondere procedures;

      l. de voorgenomen evaluatie van de regeling;

      m. overige aspecten van de regeling waarop kabinetsbeleid inzake regelgeving toepasselijk is.


          **Toelichting**
          **Onderdelen a en b.**In de toelichting bij een regeling die uitvoering geeft aan nationaal beleid wordt, na
      een korte inleiding waarin de inhoud en de aanleiding van de regeling worden beschreven, ingegaan op de doelen die
      met de regeling worden nagestreefd en de noodzaak om daartoe nieuwe regelgeving tot stand te brengen of bestaande
      regelgeving te wijzigen. Zie in dit verband ook de [aanwijzingen 2.2][ref1] (noodzaak van regelgeving), [2.3][ref2]
      (voorafgaand onderzoek), [2.5][ref3] (zelfregulering) en [2.9][ref4] (neveneffecten).
          In de toelichting bij een implementatieregeling worden na een korte inleiding de aanleiding en achtergronden
      van de te implementeren internationale of Europese regeling geschetst. Zie voor de inleiding van de toelichting
      bij een EU-implementatieregeling [aanwijzing 9.11][ref5]. In de toelichting bij een EU-implementatieregeling moet
      ook een transponeringstabel worden opgenomen: zie [aanwijzing 9.12][ref6]. In de transponeringstabel kan – tenzij
      een uitgebreidere toelichting nodig is – ook worden aangegeven welke bepalingen uit een bindende EU-rechtshandeling
      naar hun aard geen implementatie behoeven (zie [aanwijzing 9.6][ref7]) of reeds door middel van bestaand recht zijn
      geïmplementeerd (zie [aanwijzing 9.13][ref8]).
          Zie voor de memorie van toelichting bij een wetsvoorstel tot goedkeuring van een verdrag
      [aanwijzing 8.13][ref9].
          **Onderdelen c en d.**Bij de uitvoerings- en handhavingsaspecten van de regeling dient onder meer aandacht
      te worden besteed aan het bestuursorgaan of overheidsonderdeel dat met de uitvoering of de handhaving van
      de regeling zal zijn belast. Zie met betrekking tot de uitvoerbaarheid en handhaafbaarheid van de regeling
      ook de [aanwijzingen 2.7][ref10] en [2.8][ref11]. Zie voorts [paragraaf 5.4][ref12] en meer specifiek de
      [aanwijzingen 5.8 tot en met 5.11][ref13], indien in de regeling taken worden opgedragen aan een zelfstandig
      bestuursorgaan.
          In de toelichting dient in voorkomend geval ook te worden ingegaan op de gevolgen die de regeling heeft voor de
      informatievoorziening van de rijksoverheid of de verwerking van persoonsgegevens: zie de [aanwijzingen 5.32][ref14]
      en [5.33][ref15]. [Aanwijzing 5.32][ref16] schrijft voor dat de gevolgen voor de informatievoorziening van de
      rijksoverheid worden toegelicht in een aparte informatieparagraaf. Gelet op het belang van de bescherming van
      persoonsgegevens ligt het in de rede om dat onderwerp eveneens in een aparte paragraaf te behandelen.
          Verder dient in de toelichting aandacht te worden besteed aan de eventuele instelling van een adviescollege
      ([aanwijzing 5.6][ref17]) of het opnemen van een hardheidsclausule in de regeling ([aanwijzing 5.25][ref18]).
          **Onderdeel e.**Dit onderdeel houdt verband met [aanwijzing 2.10][ref19], eerste lid dat moet worden
      gestreefd naar zo beperkt mogelijke lasten voor de maatschappij en voor de overheid. Zie in dit verband ook de
      [aanwijzingen 7.5][ref20] (bedrijfseffectentoets) en [7.6][ref21] (toetsing gevolgen voor decentrale overheden).
      Zie met betrekking tot EU-implementatieregelingen ook [aanwijzing 9.5][ref22] (lastenluwe implementatie).
          Ook moet worden aangegeven of en in hoeverre de belasting van de met rechtspraak belaste instanties in verband
      met de handhaving van de regeling en de rechtsbescherming ter zake van de toepassing wordt beïnvloed.
          Zie voor de financiële gevolgen van de regeling voor de rijksoverheid of voor decentrale overheden
      de [aanwijzingen 4.45][ref23] en [4.46][ref24]. Voor een wetsvoorstel geldt dat indien er geen
      financiële gevolgen zijn, dit ook uitdrukkelijk in de memorie van toelichting moet worden vermeld
      ([aanwijzing 4.45, vijfde lid][ref25]). Zie voor de toetsing op regeldruk aanwijzing 7.5a.
          **Onderdeel f.** Dit onderdeel houdt verband met aanwijzing 2.10, tweede lid, dat bij de keuzes met betrekking
      tot vorm en inhoud van een regeling ook rekening wordt gehouden met het doenvermogen van degenen die erdoor worden
      geraakt.
          **Onderdeel g.** Zie voor de verenigbaarheid met hoger recht in algemene zin [aanwijzing 2.15][ref26].
      Zie voor grondwettelijke delegatieverboden [aanwijzing 2.20][ref27]. Zie voorts de [aanwijzingen 5.28][ref28]
      (motivering niet opnemen wederzijdse erkenningsclausule) en [5.29][ref29] (motivering toepassing conflictregel uit
      de Dienstenrichtlijn).
          Bij de verhouding tot andere regelingen valt onder meer te denken aan de verhouding tot algemene wetten. Zie
      [aanwijzing 2.46][ref30]. Bij het tot stand brengen van een nieuwe regeling of het wijzigen of intrekken van een
      bestaande regeling dient ook aandacht te worden besteed aan de gevolgen die dat heeft voor andere regelingen.
      Zie in dat verband ook de [aanwijzingen 6.8][ref31] en [6.24][ref32] met betrekking tot de gevolgen voor lagere
      regelingen.
          Bij de verenigbaarheid met hoger recht en de verhouding tot andere regelingen moet niet alleen rekening worden
      gehouden met bestaand recht, maar ook met eventuele in voorbereiding zijnde regelingen. Een bijzonder aandachtspunt
      is daarbij de mogelijke samenloop van wetsvoorstellen: zie [paragraaf 5.15][ref33].
          **Onderdeel h.** Zie voor het primaat van de wetgever en de delegatie van regelgevende bevoegdheid
      de [aanwijzingen 2.19][ref34], [2.21][ref35], [2.22][ref36], [2.24][ref37] en – met betrekking tot EU-
      implementatieregelingen – [9.8][ref38].
          Zie voor de keuze van de overheidslaag waaraan bevoegdheden worden toegedeeld [aanwijzing 2.13][ref39].
      Zie ook de [aanwijzingen 5.23][ref40] (toekenning van bevoegdheden aan decentrale overheden) en [5.24][ref41]
      (interbestuurlijk toezicht).
          **Onderdeel i.** Zie ook [aanwijzing 2.16][ref42].
          **Onderdeel j.** Zie voor overgangsrecht in algemene zin [paragraaf 5.14][ref43] en voor inwerkingtreding
      [paragraaf 4.4][ref44]. Met betrekking tot de inwerkingtreding wordt in ieder geval aandacht besteed aan
      de keuze voor een bepaald tijdstip van inwerkingtreding in relatie tot de vaste verandermomenten en de
      minimuminvoeringstermijn ([aanwijzing 4.17][ref45]). Afwijking van de vaste verandermomenten of van de
      minimuminvoeringstermijn dient steeds te worden gemotiveerd. Hetzelfde geldt voor het gebruik van een
      bijzondere inwerkingtredingsbepaling ([aanwijzing 4.22][ref46]), en het verlenen van terugwerkende kracht
      ([aanwijzing 5.63][ref47]).
          **Onderdeel k.** In de toelichting moet ook de inbreng van externe partijen bij de totstandkoming van
      de regeling worden besproken. Hetzelfde geldt voor bij de totstandkoming van de regeling gevolgde bijzondere
      procedures. Zie voor beide aspecten [aanwijzing 4.44][ref48].
          Bij gevolgde bijzondere procedures dient ook te worden gedacht aan notificatieprocedures, voor zover die niet
      al in het kader van de verenigbaarheid met hoger recht aan de orde zijn geweest. Zie ook [paragraaf 7.2][ref49].
          **Onderdeel l.** Indien de regeling een evaluatiebepaling bevat, wordt in de toelichting ook aandacht besteed
      aan de voorgenomen evaluatie van de regeling. In de toelichting bij een experimenteerregeling dient in ieder geval
      te worden aangegeven hoe die regeling zal worden geëvalueerd. Zie [aanwijzing 2.42][ref50].
          **Onderdeel m.** Dit onderdeel correspondeert met [aanwijzing 2.12][ref51] inzake overige kwaliteitseisen en
      ziet op de situatie dat de regeling een element bevat waar specifiek kabinetsbeleid voor geldt (denk onder meer aan
      subsidieverstrekking, het verrichten van marktactiviteiten en privatisering of verzelfstandiging). In zo’n geval
      dient in de toelichting ingegaan te worden op de verhouding tussen de regeling en het beleid ter zake, met name
      indien van dat beleid zou worden afgeweken.
          Zie voor overige aspecten die in de toelichting aan de orde kunnen zijn ook de [aanwijzingen 2.27][ref52]
      (afspraken over de voordracht en ondertekening van een algemene maatregel van bestuur), [3.24][ref53] (toelichting
      bij ‘Onze Minister die het mede aangaat’), [4.24][ref54] (suggestie voor afkorting van citeertitel), [4.32][ref55]
      (vermelding adres waar bijlagen bij de regeling ter inzage zijn gelegd), [5.59][ref56] (in een invoeringswet
      opgenomen overgangsrecht) en [6.21][ref57] (vergelijkend overzicht van oude en nieuwe bepalingen bij een complexe
      wijzigingsregeling).


