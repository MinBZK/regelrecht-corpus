  - number: 6.1.1
    text: Wijziging of intrekking van een regeling geschiedt door een regeling van gelijke orde.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.1
  - number: 6.1.2
    text: |-
      Intrekking door een regeling van hogere orde komt alleen in aanmerking in de situatie, bedoeld in
      [aanwijzing 6.24, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.2.1
    text: |-
      Indien het voornemen bestaat in een regeling een omvangrijke wijziging aan te brengen, wordt overwogen de regeling
      in te trekken en een nieuwe regeling vast te stellen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.2
  - number: 6.2.2
    text: Bij vervanging van een regeling door een nieuwe regeling wordt de oude regeling uitdrukkelijk ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.2
  - number: '6.3'
    text: |-
      Indien de vaststelling van een nieuwe regeling een groot aantal wijzigingen in andere regelingen nodig maakt, wordt
      overwogen deze wijzigingen in een afzonderlijke regeling onder te brengen.
          **Toelichting**
          De afzonderlijke regeling kan een aanpassings- of invoeringsregeling zijn. Een aanpassingsregeling strekt
      alleen tot aanpassing van andere regelingen aan de nieuwe regeling. Een invoeringsregeling voorziet ook in de
      inwerkingtreding van de nieuwe regeling en eventueel in overgangsbepalingen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.3
  - number: '6.4'
    text: |-
      Tot een wijzigingswet waarin meerdere inhoudelijke onderwerpen worden geregeld wordt in principe slechts overgegaan
      indien:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.4
  - number: 6.4.a
    text: de verschillende onderdelen samenhang hebben;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.4
  - number: 6.4.b
    text: |-
      de verschillende onderdelen niet van een omvang en complexiteit zijn die een afzonderlijk wetsvoorstel
      rechtvaardigen; en
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.4
  - number: 6.4.c
    text: |-
      het op voorhand niet de verwachting is dat één van de onderdelen dermate politiek omstreden is dat een goede
      parlementaire behandeling van andere onderdelen in het geding komt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.4
  - number: '6.5'
    text: 'Indien een regeling strekt tot wijziging van meerdere regelingen, kunnen de wijzigingsbepalingen worden geplaatst:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.5
  - number: 6.5.a
    text: in volgorde naar omvang of aard van de wijziging;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.5
  - number: 6.5.b
    text: in alfabetische volgorde van de te wijzigen regelingen;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.5
  - number: 6.5.c
    text: in volgorde naar het eerstverantwoordelijke ministerie waaronder de te wijzigen regelingen ressorteren.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.5
  - number: 6.6.1
    text: |-
      Een regeling die slechts betrekking heeft op wijziging of intrekking van een of meer bestaande regelingen, wordt
      ingedeeld in artikelen met Romeinse cijfers.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.6
  - number: 6.6.2
    text: |-
      Indien een nieuwe regeling tevens strekt tot wijziging of intrekking van bestaande regelingen, worden ook de
      wijzigings- of intrekkingsbepalingen genummerd met Arabische cijfers.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.6
  - number: 6.6.3
    text: |-
      In een omvangrijke aanpassings- of invoeringsregeling waarin regelingen van verschillende ministeries worden
      gewijzigd of ingetrokken, kan voor een andere nummering worden gekozen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.6
  - number: '6.7'
    text: |-
      Het opschrift en de aanhef van een regeling worden niet gewijzigd.
          **Toelichting**
          Het opschrift en de aanhef van een regeling vormen met het slotformulier het deel van de regeling dat een
      eenmalige, aan het tijdstip van totstandkoming gebonden, betekenis heeft. Dit deel, en dus ook de considerans
      van een wet en de passage ‘Gelet op ...’ in de aanhef van een andere regeling, kan bij een latere wijziging van
      de regeling niet meer worden gewijzigd. Indien de strekking van een wet wordt gewijzigd, kan dit tot uitdrukking
      worden gebracht in het opschrift en de considerans van de wet die in de wijziging voorziet. Wel dient in het oog
      gehouden te worden dat bij wijziging van een wetsvoorstel tijdens de parlementaire behandeling aanpassing van het
      opschrift en de considerans noodzakelijk kan zijn. Dit kan bij nota van wijziging (zie [paragraaf 6.4][ref1]). Het
      opschrift en de considerans zijn ook vatbaar voor amendering.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.8.1
    text: |-
      Indien een gewijzigde dan wel nieuwe regeling een nieuwe grondslag biedt aan bestaande uitvoeringsregelingen kan
      een bepaling overeenkomstig het volgende model worden opgenomen: *Na de inwerkingtreding van deze wet / dit besluit
      berust [betrokken uitvoeringsregeling] [mede] op artikel [de nieuwe delegatiebepaling] van deze wet / dit besluit.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.8
  - number: 6.8.2
    text: |-
      Indien het wenselijk is dat niet in de hogere regeling, maar in de uitvoeringsregeling de nieuwe grondslag wordt
      vermeld, kan een bepaling overeenkomstig het volgende model worden opgenomen: *Dit besluit / Deze regeling berust
      [mede] op [artikel / de artikelen ...] van [delegerende wet / delegerend besluit].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.8
  - number: 6.8.3
    text: |-
      Indien een regeling een nieuwe grondslag biedt aan een bestaande uitvoeringsregeling of indien een
      uitvoeringsregeling wordt gewijzigd met gebruikmaking van een nieuwe grondslag, wordt in de toelichting bij
      die regeling een overzicht opgenomen van de verschillende onderdelen van de integrale uitvoeringsregeling en de
      grondslagen waarop zij berusten.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.8
  - number: 6.9.1
    text: |-
      Vervanging van een tekst in een regeling wordt vormgegeven met de uitdrukking ‘*wordt vervangen door*’ of, voor
      zover dit taalkundig mogelijk is, met de uitdrukking ‘*komt te luiden:*’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.9
  - number: 6.9.2
    text: |-
      Bij de vervanging van woorden of zinsneden wordt zowel de te vervangen tekst als de nieuwe tekst tussen
      aanhalingstekens geplaatst.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.9
  - number: 6.9.3
    text: |-
      Indien een artikel of onderdeel daarvan wordt vervangen, begint de nieuwe tekst met de aanduiding van het artikel
      of het onderdeel.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.9
  - number: '6.10'
    text: |-
      Bij wijziging van een bepaling wordt ten minste een gehele lees- of begripseenheid vervangen door een nieuwe lees-
      of begripseenheid.
          **Toelichting**
          Dus niet: ‘Buitenlandse’ wordt vervangen door ‘Algemene’, maar: ‘Ministerie van Buitenlandse Zaken’ wordt
      vervangen door ‘Ministerie van Algemene Zaken’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.10
  - number: 6.11.1
    text: |-
      Voor het opnemen van een nieuw artikel of ander onderdeel van een regeling of het aanvullen van de bestaande tekst
      van een artikel of ander onderdeel van een regeling wordt het werkwoord ‘*invoegen*’ of ‘*toevoegen*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.11
  - number: 6.11.2
    text: In een wijzigingsbepaling worden in of toe te voegen woorden en zinsneden tussen aanhalingstekens geplaatst.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.11
  - number: 6.12.1
    text: |-
      Het schrappen van een artikel of ander onderdeel van een regeling of het schrappen van een woord of zinsnede wordt
      aangeduid met het werkwoord ‘*vervallen*’. Het werkwoord ‘*intrekken*’ wordt slechts gebruikt voor het beëindigen
      van de gelding van een gehele regeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.12
  - number: 6.12.2
    text: In een wijzigingsbepaling worden woorden of zinsneden die vervallen tussen aanhalingstekens geplaatst.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.12
  - number: '6.13'
    text: |-
      Bij wijziging van een regeling kunnen bestaande bepalingen strekkende tot wijziging van andere regelingen en andere
      uitgewerkte bepalingen van die regeling vervallen.
          **Toelichting**
          Het doen vervallen verdient in het bijzonder aanbeveling indien bij wijziging van een regeling
      tevens opdracht wordt gegeven tot plaatsing van de integrale actuele tekst van de regeling (zie
      [aanwijzing 6.22, tweede lid][ref1]). Bij uitgewerkte bepalingen kan ook gedacht worden aan materieel uitgewerkte
      overgangsbepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: '6.14'
    text: |-
      Het vervallen van een bijlage bij een regeling wordt uitdrukkelijk geregeld.
          **Toelichting**
          Voor het laten vervallen van een bijlage kan niet worden volstaan met het laten vervallen van het artikel
      waarbij de bijlage behoort.
          Zie voor bijlagen ook de [aanwijzingen 3.61][ref1] en [3.62][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.14
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 6.15.1
    text: |-
      In een wijzigingsregeling en in de slotbepalingen van een nieuwe regeling wordt voor iedere te wijzigen regeling
      een artikel gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.15
  - number: 6.15.2
    text: Binnen een afzonderlijk artikel worden de verschillende wijzigingen van een regeling aangeduid met hoofdletters.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.15
  - number: 6.15.3
    text: |-
      In het geval, bedoeld in het tweede lid, worden de verschillende wijzigingen in een artikel van een regeling
      aangeduid met Arabische cijfers of kleine letters.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.15
  - number: 6.16.1
    text: |-
      De nummering van bij wijziging ingevoegde artikelen, boeken, delen, hoofdstukken, titels, afdelingen en paragrafen
      geschiedt met behulp van letters, die worden toegevoegd aan de bestaande nummers.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.16
  - number: 6.16.2
    text: Een eenmaal aangevangen wijze van nummering wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.16
  - number: 6.17.1
    text: |-
      Bij wijziging van regelingen worden artikelen, boeken, delen, hoofdstukken, titels, afdelingen en paragrafen niet
      vernummerd, tenzij dit voor een logische nummering van de regeling wenselijk is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.17
  - number: 6.17.2
    text: |-
      De leden, onderdelen en subonderdelen van een artikel worden wel vernummerd of verletterd, tenzij daartegen
      overwegend bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.17
  - number: 6.18.1
    text: 'Het invoegen of vervallen van een artikellid geschiedt overeenkomstig de volgende voorbeelden:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.1.A
    text: '*Onder vernummering van het tweede lid tot derde lid wordt een lid ingevoegd, luidende:*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.1.A.2
    text: '*(...)*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.1.B
    text: '*Het eerste lid vervalt, onder vernummering van het tweede tot en met vierde lid tot eerste tot en met derde lid.*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.2
    text: |-
      Het wijzigen van de aanduiding van een artikelonderdeel of het invoegen of toevoegen van een artikelonderdeel
      geschiedt overeenkomstig de volgende voorbeelden:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.2.A
    text: '*Onder verlettering van de onderdelen c tot en met f tot d tot en met g wordt een onderdeel ingevoegd, luidende:*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.2.A.c
    text: '*(...)*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.2.B
    text: |-
      *Onder vervanging van de punt aan het slot van onderdeel d door een puntkomma wordt een onderdeel toegevoegd,
      luidende:*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.2.B.e
    text: '*(...)*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.2.C
    text: |-
      *Onder vervanging van ‘; of’ aan het slot van onderdeel c door een puntkomma en onder vervanging van de punt aan
      het slot van onderdeel d door ‘; of’ wordt een onderdeel toegevoegd, luidende:*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.2.C.e
    text: (...)
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.3
    text: |-
      Het toevoegen van een of meer leden aan een artikel dat nog niet uit leden bestaat, geschiedt overeenkomstig het
      volgende voorbeeld:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.3.1
    text: '*Voor de tekst wordt de aanduiding ‘1.’ geplaatst.*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.3.2
    text: '*Er wordt een lid toegevoegd, luidende:*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.3.2.2
    text: '*(...)*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: 6.18.4
    text: |-
      Het wijzigen van een uit leden bestaand artikel tot een artikel dat niet uit leden bestaat, geschiedt
      overeenkomstig het volgende voorbeeld: *Het tweede lid alsmede de aanduiding ‘1.’ voor het eerste lid vervallen.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: '6.19'
    text: |-
      Indien een artikel, lid of onderdeel in één wijzigingsregeling zowel wordt vernummerd of verletterd als gewijzigd,
      wordt dat artikel, lid of onderdeel ten behoeve van die wijziging aangeduid met de nieuwe nummering of lettering,
      met toevoeging van de vermelding ‘*(nieuw)*’.
          **Voorbeeld**
          Artikel 20 wordt als volgt gewijzigd: Onder vernummering van het vierde lid tot vijfde lid wordt een lid
      ingevoegd, luidende: (...)
      In het vijfde lid (nieuw) wordt ‘tweede en derde lid’ vervangen door ‘tweede tot en met vierde lid’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.19
  - number: '6.20'
    text: |-
      In een overgangsbepaling ter zake van een wijziging van een voorschrift wordt verwezen naar het gewijzigde
      voorschrift en niet naar de wijzigingsbepaling.
          **Toelichting**
          Deze aanwijzing wordt toegelicht aan de hand van een voorbeeld: In artikel I, onderdeel C, van een
      wijzigingsregeling wordt een artikel 8a ingevoegd, dat een beperking bevat van aanspraken die in artikel 8 aan een
      bepaalde groep van personen worden gegeven. Die beperking moet tot 1 januari 2004 niet gelden voor personen uit de
      groep die zijn geboren voor 1 januari 1930. De betrokken overgangsbepaling van de wijzigingsregeling moet dan niet
      luiden: ‘Artikel I, onder C, geldt tot 1 januari 2004 niet voor personen die geboren zijn voor 1 januari 1930.’,
      maar: ‘Artikel 8a van [aanduiding gewijzigde regeling] geldt tot en met 31 december 2003 niet voor personen die
      geboren zijn voor 1 januari 1968.’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.20
  - number: '6.21'
    text: |-
      Bij complexe wijzigingsvoorstellen wordt ter verduidelijking van de voorgestelde wijzigingen in een wet of algemene
      maatregel van bestuur, een vergelijkend overzicht van de te wijzigen bepalingen en de voorgestelde bepalingen aan
      de Afdeling advisering van de Raad van State, respectievelijk aan de Tweede en Eerste Kamer gezonden.
          **Toelichting**
          Dit overzicht kan een apart stuk zijn, dan wel in of als bijlage bij de memorie of nota van toelichting
      worden opgenomen. Ook in een later stadium van de behandeling van een wetsvoorstel (bij indiening van een nota van
      wijziging) kan een vergelijkend overzicht nuttig zijn.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.21
  - number: 6.22.1
    text: |-
      Na wijziging van een regeling wordt geen integrale tekst van die regeling in het Staatsblad of de Staatscourant
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.22
  - number: 6.22.2
    text: |-
      In afwijking van het eerste lid kan een integrale tekst worden geplaatst, indien het gewenst is tevens tot
      vernummering van de gehele gewijzigde regeling over te gaan, of de tekst van de gewijzigde regeling die in oude
      spelling is geformuleerd, over te brengen naar de geldende spelling. In die gevallen wordt daartoe een bepaling
      opgenomen in de wijzigingsregeling, overeenkomstig het volgende model: *De tekst van [aanduiding van de betrokken
      regeling] wordt in [het Staatsblad / de Staatscourant] geplaatst.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.22
  - number: 6.22.3
    text: |-
      In geval van vernummering wordt aan het model, bedoeld in het tweede lid, toegevoegd: *Voor de plaatsing in [het
      Staatsblad / de Staatscourant] stelt [Onze Minister / de Minister (van/voor...)] de nummering van de artikelen [,
      hoofdstukken en paragrafen] van [aanduiding van de betrokken regeling] opnieuw vast en brengt hij de in [die wet /
      dat besluit / die regeling] voorkomende aanhalingen van de artikelen [, hoofdstukken en paragrafen] met de nieuwe
      nummering in overeenstemming.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.22
  - number: 6.22.4
    text: |-
      Ingeval van overbrenging in de geldende spelling wordt aan het model, bedoeld in het tweede lid, toegevoegd: *Voor
      de plaatsing in [het Staatsblad / de Staatscourant] wordt de tekst door [Onze Minister /de Minister (van/voor...)]
      overgebracht in de geldende spelling.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.22
  - number: '6.23'
    text: |-
      Intrekking van een regeling geschiedt overeenkomstig het volgende voorbeeld: *De Vuurwapenwet 1919 wordt
      ingetrokken.*
          **Toelichting**
          Bij intrekking van meer regelingen dienen deze elk afzonderlijk te worden aangeduid. Intrekking door middel van
      een algemene formule is niet toegestaan.
          Intrekking van een regeling met uitzondering van een of meer artikelen is niet mogelijk. In dat geval moet of
      voor wijziging worden gekozen of voor onderbrenging van de overgebleven artikelen in een nieuwe regeling.
          Bij intrekking van meerdere regelingen hoeft niet voor elke in te trekken regeling een apart artikel te worden
      gebruikt. Indien het past in de opbouw van de regeling, is het ook mogelijk om in één artikel een opsomming op te
      nemen van alle in te trekken regelingen (‘De volgende wetten / besluiten / regelingen worden ingetrokken:’). Zie
      bijvoorbeeld [artikel 7.1 van het Besluit houders van dieren][ref1].
          Zie ook [aanwijzing 6.12][ref2] (terminologie ‘vervallen’ en ‘intrekken’).


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.23
    references:
      - id: ref1
        bwb_id: BWBR0035217
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.24.1
    text: |-
      Bij de gehele of gedeeltelijke intrekking van een regeling wordt mede ingetrokken de op deze regeling of het in
      te trekken gedeelte daarvan gebaseerde uitvoeringsregelgeving, tenzij voor die regelgeving een andere grondslag
      bestaat of specifiek bij die gelegenheid tot stand wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.24
  - number: 6.24.2
    text: |-
      De intrekking kan geschieden in de regeling die strekt tot het geheel of gedeeltelijk intrekken van de delegerende
      regeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.24
  - number: 6.24.3
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op het laten vervallen van bepalingen in een
      uitvoeringsregeling in verband met het vervallen van de grondslag daarvan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.24
  - number: 6.25.1
    text: Een regeling die terstond is uitgewerkt nadat zij in werking is getreden, wordt niet ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.25
  - number: 6.25.2
    text: Evenmin wordt in een dergelijke regeling voorzien in het vervallen van de regeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.25
  - number: 6.26.1
    text: |-
      Het wijzigen van een al uitgevoerde wijzigingsopdracht leidt niet tot aanpassing van de aangebrachte wijzigingen.
      Evenmin maakt het laten vervallen van een al uitgevoerde wijzigingsopdracht de aangebrachte wijzigingen ongedaan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.26
  - number: 6.26.2
    text: |-
      Een ingetrokken regeling of een vervallen bepaling herleeft niet door het laten vervallen van de bepaling,
      krachtens welke zij is ingetrokken of vervallen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.26
  - number: 6.27.1
    text: |-
      Door de regering gewenste veranderingen in door haar ingediende voorstellen van wet krijgen de vorm van een nota
      van wijziging.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.27
  - number: 6.27.2
    text: |-
      Het opstellen van een nota van wijziging geschiedt overeenkomstig de [aanwijzingen 6.9 tot en met 6.12][ref1] en
      [6.16][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.27
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.27.3
    text: In het opschrift worden een tweede, derde en volgende nota van wijziging als zodanig aangeduid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.27
  - number: 6.27.4
    text: 'De aanhef van een nota van wijziging luidt: Het voorstel van wet wordt als volgt gewijzigd:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.27
  - number: 6.27.5
    text: |-
      Een nota van wijziging wordt niet ingedeeld in artikelen. De onderdelen worden met hoofdletters of Arabische
      cijfers aangeduid. Een eventuele verdere onderverdeling geschiedt met Arabische cijfers of kleine letters.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.27
  - number: 6.28.1
    text: Een nota van wijziging wordt van een toelichting voorzien.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.28
  - number: 6.28.2
    text: |-
      Betreft het een nota van wijziging die tegelijk met een nota naar aanleiding van het verslag wordt ingediend, dan
      kan ter toelichting worden volstaan met een verwijzing naar een bepaald gedeelte van de nota naar aanleiding van
      het verslag.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.28
  - number: 6.29.1
    text: Een nota van wijziging wordt niet ondertekend, de toelichting op een nota van wijziging wel.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.29
  - number: 6.29.2
    text: |-
      De toelichting op een nota van wijziging wordt bij voorkeur alleen ondertekend door de eerstverantwoordelijke
      bewindspersoon. De medebetrokkenheid van een of meer andere bewindspersonen wordt in dat geval in de toelichting
      tot uitdrukking gebracht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.29
  - number: '6.30'
    text: |-
      Indien tijdens de schriftelijke behandeling van een wetsvoorstel een nota van wijziging met inhoudelijke betekenis
      wordt overwogen, wordt overlegd met het Ministerie van Justitie en Veiligheid of die nota van wijziging aan een
      wetgevingstoets zal worden onderworpen.
          **Toelichting**
          Zie over de toetsing van ontwerpregelgeving door de sector Juridische Zaken en Wetgevingsbeleid van de Directie
      Wetgeving en Juridische Zaken van het Ministerie van Justitie en Veiligheid ten algemene: [aanwijzing 7.4][ref1].
          Om tijdsverlies in de wetgevingsprocedure te voorkomen en vanwege de soms krappe termijnen tijdens de
      mondelinge behandeling, beperkt deze toetsing zich tot nota’s van wijziging met inhoudelijke betekenis in de fase
      van schriftelijke behandeling van een wetsvoorstel. Onderdeel van de toetsing is de vraag of de nota van wijziging
      ingrijpend is en dientengevolge aan de ministerraad moet worden voorgelegd, met het oog op het vragen van advies
      daarover aan de Afdeling advisering van de Raad van State (zie ook [aanwijzing 7.15, tweede lid][ref2]).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.30
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '6.31'
    text: |-
      Indien de regering een ingediend amendement overneemt, blijft de indiening van een nota van wijziging ter zake
      achterwege.
          **Toelichting**
          Een amendement kan pas worden overgenomen, nadat is gebleken dat het niet vanuit de Kamer wordt bestreden.
      Het amendement kan zowel tijdens de plenaire beraadslaging als in een wetgevingsoverleg worden overgenomen
      (zie [artikel 9.8 van het Reglement van Orde van de Tweede Kamer][ref1]). Overneming pleegt daarbij eerst in
      de tweede termijn of tijdens de artikelsgewijze behandeling plaats te vinden. De voorzitter van de Kamer, of
      de commissievoorzitter tijdens een wetgevingsoverleg, overtuigt zich ervan dat geen van de in de vergaderzaal
      aanwezige leden tegen de overneming bezwaren heeft en constateert vervolgens dat het amendement is overgenomen. Het
      amendement wordt niet meer in stemming gebracht. Door het overnemen van een amendement wordt het wetsvoorstel per
      direct gewijzigd (en dus niet pas na aanvaarding zoals bij een door de Kamer aangenomen amendement het geval is).


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel9
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '9'
  - number: '6.32'
    text: |-
      Tijdens de behandeling van een wetsvoorstel door de Tweede Kamer wordt geen wijziging aangebracht in de nummering
      van de artikelen of, bij wijzigingswetten, in de lettering van de verschillende onderdelen van een artikel, tenzij
      dit onvermijdelijk is.
          **Toelichting**
          Tussentijdse wijziging in de nummering van een wetsvoorstel leidt ertoe dat de totstandkomingsgeschiedenis
      van een bepaling moeilijker is terug te vinden in de parlementaire stukken. Tussentijdse wijziging in de nummering
      vindt alleen plaats indien een in te voegen artikel anders niet op praktische wijze van een nummer kan worden
      voorzien. Ingevolge [artikel 9.13 van het Reglement van Orde van de Tweede Kamer der Staten-Generaal][ref1] is de
      voorzitter van de Tweede Kamer bevoegd een wetsvoorstel na aanneming door de Tweede Kamer te vernummeren (zie ook
      [aanwijzing 6.33][ref2]). Leden en (sub)onderdelen van artikelen worden bij wijziging van een wetsvoorstel wel
      vernummerd of verletterd.
          **Wijzigingswetten.** Nieuwe onderdelen die worden ingevoegd in een artikel van een wijzigingswet, worden
      geletterd door de hoofdletter van het voorgaande onderdeel te herhalen en daaraan in alfabetische volgorde een
      kleine letter toe te voegen (‘Aa, Ab, Ac, etc.’). Zie [aanwijzing 6.16, eerste lid][ref3], voor het invoegen van
      artikelen.
          Indien een onderdeel wordt ingevoegd vóór onderdeel A van een artikel, wordt dat onderdeel geletterd ‘aA’.
      Indien dat op praktische bezwaren stuit, kan ervoor worden gekozen het bestaande onderdeel A te verletteren
      tot Aa en een nieuw onderdeel A in te voegen. Bij het invoegen van twee of meer onderdelen wordt de ingezette
      reeks voortgezet: ‘aA, bA, cA, etc.’ (bij handhaving van de bestaande lettering). Zie ook de toelichting bij
      [aanwijzing 6.16][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.32
    references:
      - id: ref1
        bwb_id: BWBR0044975
        artikel: '9'
      - id: ref2
