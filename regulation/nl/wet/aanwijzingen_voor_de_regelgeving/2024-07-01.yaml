      1 Een algemene maatregel van bestuur wordt niet eerder vastgesteld dan nadat de wet waarop deze is gebaseerd, is
      vastgesteld.

      2 In uitzonderlijke situaties kan een algemene maatregel van bestuur reeds worden vastgesteld nadat het
      wetsvoorstel dat aan de algemene maatregel van bestuur ten grondslag ligt door de Tweede Kamer is aanvaard.

      3 Voor de inwerkingtredingsbepaling van een algemene maatregel van bestuur als bedoeld in het tweede lid wordt het
      in [aanwijzing 4.22, onder E][ref1], bedoelde model gebruikt.

      4 Deze aanwijzing is van overeenkomstige toepassing op het vaststellen van een ministeriële regeling.


          **Toelichting**
          Een uitvoeringsregeling kan niet eerder in werking treden of verder terugwerken dan de delegerende regeling.
      Voor de vaststelling ervan kan dat anders liggen. Van een uitzonderlijke situatie kan sprake zijn wanneer zaken
      die niet doelmatig in de wet zelf te regelen zijn (administratieve voorschriften, aangelegenheden omtrent de
      uitvoering) tijdig bekend dienen te zijn aan justitiabelen of uitvoeringsinstanties, teneinde hun de gelegenheid te
      bieden zich hierop adequaat voor te bereiden, en de wet zelf op zeer korte termijn in werking moet treden. Steeds
      moet hierbij echter bezien worden of op andere wijze, bijvoorbeeld door circulaires of voorlichting, tijdig in de
      gewenste duidelijkheid kan worden voorzien. Uiteraard dient voldoende zekerheid te bestaan over de uiteindelijke
      redactie en nummering van de artikelen van de delegerende wet, zodat niet achteraf onduidelijkheid kan ontstaan
      over de wettelijke basis van het besluit.
          **Tweede lid.** De Afdeling advisering van de Raad van State neemt een adviesaanvraag over het onderwerp van
      een algemene maatregel van bestuur in beginsel pas in behandeling na aanvaarding door de Tweede Kamer van het
      wetsvoorstel dat aan die algemene maatregel van bestuur ten grondslag ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
