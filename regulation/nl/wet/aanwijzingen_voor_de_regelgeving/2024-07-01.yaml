  - number: '6.34'
    text: |-
      Indien het gewenst is ten aanzien van een wetsvoorstel tijdens of na de behandeling in de Eerste Kamer maar voor
      de bekrachtiging door de Koning een wijzigingsvoorstel in te dienen, wordt dit voorstel geformuleerd overeenkomstig
      het volgende model:

      *ARTIKEL I*

      *Indien het bij [koninklijke boodschap van [datum] ingediende / geleidende brief van [datum] aanhangig gemaakte]
      voorstel van wet [als aanwijzing 3.43, tweede lid] tot wet wordt verheven, wordt die wet als volgt gewijzigd: ...*


          **Toelichting**
          Een wijzigingswet als bedoeld in deze aanwijzing wordt een novelle genoemd. Zie
      [aanwijzing 3.43, tweede lid][ref1], voor de wijze waarop bij de toepassing van het model de verwijzing naar het
      Kamerstuknummer wordt vormgegeven.
          Zie voor de inwerkingtreding van een novelle [aanwijzing 4.21, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
