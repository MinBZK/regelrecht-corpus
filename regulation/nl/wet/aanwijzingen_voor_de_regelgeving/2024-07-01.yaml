  - number: '5.39'
    text: |-
      1 Het regelen van de mogelijkheid om bij de uitoefening van een bevoegdheid de assistentie van de politie in te
      roepen, geschiedt overeenkomstig het volgende model:

      *De [omschrijving bevoegde personen] oefenen hun [omschrijving bevoegdheid] zo nodig uit met behulp van de sterke
      arm.*

      2 Indien het de bedoeling is taken of bevoegdheden slechts op te dragen aan ambtenaren van politie die executieve
      werkzaamheden verrichten, worden die ambtenaren aangeduid als: *ambtenaren van politie die zijn aangesteld voor de
      uitvoering van de politietaak*.

      3 Indien het de bedoeling is ook andere ambtenaren van politie taken of bevoegdheden op te dragen, worden die
      ambtenaren aangeduid als: *ambtenaren van politie*.


          **Toelichting**
          **Eerste lid.** [Artikel 5:15, tweede lid, Awb][ref1] voorziet reeds in de bevoegdheid van toezichthouders
      om politieassistentie in te roepen bij het betreden van plaatsen (met uitzondering van woningen). Het begrip
      ‘sterke arm’ omvat de ambtenaren van politie die zijn aangesteld voor de uitvoering van de politietaak (zie
      [artikel 2, onderdelen a, c en d, van de Politiewet 2012][ref2]), alsmede militairen van de Koninklijke
      marechaussee voor zover deze politietaken uitvoeren (zie [artikel 4, eerste lid, van de Politiewet 2012][ref3]).
          **Tweede lid.** Het gaat hier om de ambtenaren van politie, bedoeld in
      [artikel 2, onderdelen a, c en d, van de Politiewet 2012][ref4], die zijn aangesteld voor de
      uitvoering van de politietaak. De ambtenaren, bedoeld in artikel 2, onderdeel b, van die wet, zijn
      aldus uitgesloten. Dat geldt ook voor de militairen van de Koninklijke marechaussee. Aan hen zijn in
      [artikel 4, eerste lid, van de Politiewet 2012][ref5] enkele politietaken opgedragen, maar dat maakt hen geen
      ambtenaren van politie.
          **Derde lid.** Het gaat hier om een uitbreiding tot de ambtenaren van politie, bedoeld in
      [artikel 2, onderdeel b, van de Politiewet 2012][ref6]: het, met name technisch, administratief en ondersteunend
      personeel. Zie bijvoorbeeld [artikel 94 van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref7].

          De ambtenaren, bedoeld in het eerste lid, oefenen de hun in artikel 5:17 van de Algemene
      wet bestuursrecht toegekende bevoegdheden zo nodig uit met behulp van de sterke arm.
      ([Artikel 12b, tweede lid, van de Instellingswet Autoriteit Consument en Markt][ref8])


