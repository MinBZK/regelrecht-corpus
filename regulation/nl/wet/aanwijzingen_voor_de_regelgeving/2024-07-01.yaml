  - number: '5.47'
    text: |-
      1 Strafbaarstelling als economisch delict geschiedt door de betrokken regeling in [artikel 1][ref1] of
      [1a van de Wet op de economische delicten][ref2] op te nemen.

      2 Bij aanwijzing van economische delicten worden de artikelen van de betrokken regeling waarvan overtreding een
      economisch delict oplevert, opgesomd. Zo nodig worden ook de afzonderlijke leden genoemd.

      3 De aanwijzing van economische delicten wordt overeenkomstig het volgende voorbeeld geformuleerd:

      *In artikel 1, onder 4°, van de Wet op de economische delicten wordt in de alfabetische volgorde ingevoegd:*

      *de Wet particuliere beveiligingsorganisaties en recherchebureaus, de artikelen 2 en 5, tweede en vierde lid;.*

      4 Indien de [Wet op de economische delicten][ref3] wordt gewijzigd in verband met de wijziging van een regeling die
      reeds economische delicten bevat, wordt de wijziging overeenkomstig de volgende voorbeelden geformuleerd:

      A. *In artikel 1a, onder 1°, van de Wet op de economische delicten wordt in de zinsnede met betrekking tot de
      Meststoffenwet ‘de artikelen 7, 14, eerste lid, 19, 20, eerste lid, 21, 22, derde lid, en 26, zesde lid;’ vervangen
      door ‘(...)’.*

      B. *In artikel 1a, onder 3°, van de Wet op de economische delicten vervalt de zinsnede met betrekking tot de Wet
      bodembescherming. De desbetreffende zinsnede wordt in de alfabetische volgorde ingevoegd in artikel 1a, onder 1°,
      van de Wet op de economische delicten.*


          **Toelichting**
          Milieudelicten worden ondergebracht in [artikel 1a Wed][ref4]. Voor de keuze tussen onderbrenging
      in [artikel 1][ref5] of [1a][ref6] is bepalend of de desbetreffende wet in overwegende mate (mede)
      strekt tot bescherming van milieubelangen (zie Kamerstukken II 1992/93, 23196, nr. 3, p. 7–9). In
      [artikel 1a, onder 1°][ref7], worden opgenomen delicten die een directe aantasting opleveren van het milieu, dan
      wel daarvoor een ernstige en rechtstreekse bedreiging vormen. In de regel worden onder 1° niet opgenomen de minder
      ernstige milieudelicten, die voornamelijk betrekking hebben op het niet nakomen van administratieve verplichtingen
      en delicten in de sfeer van wederspannigheid. Deze delicten worden opgenomen onder 3°.
          Wat de overige economische delicten betreft, wordt gekozen voor opneming in
      [onderdeel 4° van artikel 1][ref8], tenzij er bijzondere redenen zijn om voor opneming in een van de andere
      onderdelen van [artikel 1][ref9] te kiezen.
          De [Wed][ref10] is niet van toepassing in Bonaire, Sint Eustatius en Saba.


