  - number: '5.76'
    text: |-
      Een wet, algemene maatregel van bestuur, ministeriële regeling of beleidsregel kan na voorafgaande instemming
      van de Minister van Binnenlandse Zaken en Koninkrijksrelaties bepalen dat een daarbij behorende bijlage wordt
      bekendgemaakt door middel van een in die wet, algemene maatregel van bestuur, ministeriële regeling of beleidsregel
      aangewezen ander algemeen toegankelijk elektronisch medium dan het Staatsblad of de Staatscourant, indien:

      a. de bijlage wegens aard of omvang niet geschikt is voor publicatie in het Staatsblad of de Staatscourant; en b.
      de kenbaarheid voor de direct bij de regeling betrokken personen op die wijze voldoende verzekerd is.

      Deze aanwijzing bevat criteria voor gebruikmaking van de uitzonderingsmogelijkheid die wordt geboden door
      [artikel 7, tweede lid, van de Bekendmakingswet][ref1]: bekendmaking door middel van een ander algemeen
      toegankelijk elektronisch medium dan het Staatsblad of de Staatscourant, bijvoorbeeld de website van (een
      dienstonderdeel van) de rijksoverheid.

      De in [aanwijzing 3.50, tweede lid][ref2], neergelegde eisen aan de vorm en locatie van bekendmaking zijn in zo’n
      geval overigens van toepassing.

      Blijkens de wetsgeschiedenis moet deze uitzondering terughoudend worden toegepast. Uit de term ‘bijlage’ volgt dat
      het bij de toepassing van [artikel 7 van de Bekendmakingswet][ref3] niet kan gaan om het gehele algemeen verbindend
      voorschrift of de gehele beleidsregel. Voorbeelden zijn bepaalde afbeeldingen, (digitale) maquettes en film- of
      geluidsbestanden die door hun aard niet in de voor het Staatsblad en de Staatscourant geldende standaarden passen
      of bestanden die door hun omvang slechts tegen hoge kosten en inspanning in die standaard te brengen zijn (zie
      Kamerstukken II 2018/19, 35 218, nr. 3, p. 41). Om te bewaken dat artikel 7 terughoudend wordt toegepast, is in
      dat artikel de figuur opgenomen van de instemming door de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
      Omdat de uitzondering in de bekend te maken publicatie dient te worden opgenomen, zal die instemming voorafgaand
      aan de vaststelling moeten worden verkregen. Bij wetten en algemene maatregelen van bestuur wordt de instemming van
      de ministerraad met het voorstel van wet onderscheidenlijk het ontwerpbesluit geacht de instemming in te houden van
      de Minister van Binnenlandse Zaken en Koninkrijksrelaties met de publicatie door middel van het aangewezen andere
      algemeen toegankelijk elektronisch medium.

      Het bepalen dat een bijlage wordt bekendgemaakt door middel van een ander algemeen toegankelijk elektronisch
      medium, geschiedt door middel van een bepaling in het lichaam van de regeling zelf, en wordt naar die bepaling
      verwezen in het slotformulier: zie [aanwijzing 4.32][ref4]. Wanneer de in de regeling aangegeven locatie moet
      worden aangepast, bijvoorbeeld omdat het internetadres wordt gewijzigd, dient dat ook te leiden tot wijziging van
      het aangegeven adres in die regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0004287
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
