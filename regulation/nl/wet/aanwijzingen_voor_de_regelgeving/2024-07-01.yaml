  - number: '8.4'
    text: |-
      1 Bij de voorbereiding van en de onderhandelingen over een verdrag wordt tijdig en zorgvuldig aandacht besteed aan
      de gevolgen voor de nationale wet- en regelgeving.

      2 Zij die deelnemen aan de voorbereiding van of de onderhandelingen over een verdrag dragen er zorg voor dat de
      wetgevingsafdelingen van de betrokken ministeries daarbij in een zo vroeg mogelijk stadium worden ingeschakeld.

      3 De onderhandelingsdelegaties nemen in hun verslag datgene op wat van belang is voor de implementatie en voor de
      parlementaire goedkeuring.


          **Toelichting**
          **Eerste lid.** Naast bestudering van vragen rond eventuele implementatie dient ook aandacht te worden besteed
      aan de eventuele rechtstreekse werking van de bepalingen van het verdrag en de gevolgen daarvan. Dat is uiteraard
      nationaal van groot belang. Zie ook de toelichting bij [aanwijzing 8.9][ref1]. Het kan echter ook nuttig zijn dit
      punt internationaal aan de orde te stellen.
          **Tweede lid.** Vroegtijdige betrokkenheid van de wetgevingsafdeling is van belang met het oog op de tijdige
      totstandbrenging van eventuele uitvoeringsregelgeving.
          **Derde lid.** Indien tijdige aanpassing van Nederlandse wet- en regelgeving aan toekomstige bindende besluiten
      op grond van het verdrag problematisch kan zijn, wordt dit gesignaleerd in het verslag. Het gaat dan om besluiten
      die bindend worden zonder dat daarvoor op enigerlei wijze nog nationale instemming is vereist. Het verslag kan in
      dergelijke gevallen analoge toepassing van [aanwijzing 9.8][ref2] in overweging geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
