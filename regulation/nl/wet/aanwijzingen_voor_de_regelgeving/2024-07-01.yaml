  - number: '5.50'
    text: |-
      Bij het toedelen van rechtsmacht aan een bestuursrechter wordt aangesloten bij de bestaande competentieverdeling.


          **Toelichting**
          In de meeste gevallen blijft een uitdrukkelijke beroepsbepaling achterwege. Uit de [Awb][ref1] volgt reeds
      dat, indien verdere regeling achterwege blijft, beroep openstaat bij de rechtbank (volgens de regels voor relatieve
      competentie van [artikel 8:7, eerste en tweede lid, Awb][ref2]) en hoger beroep bij de Afdeling bestuursrechtspraak
      van de Raad van State. Voor Bonaire, Sint Eustatius en Saba volgt uit de [WarBES][ref3] dat beroep openstaat bij
      het Gerecht in eerste aanleg en hoger beroep bij het Gemeenschappelijk Hof van Justitie van Aruba, Curaçao, Sint
      Maarten en van Bonaire, Sint Eustatius en Saba.
          Indien in het Europese deel van Nederland voor het desbetreffende terrein van regelgeving een gespecialiseerde
      rechter bestaat, dan wordt bij nieuwe regelingen ter zake beroep of hoger beroep opengesteld bij dat gerecht.
      Hiertoe dient dan [bijlage 2 Awb][ref4] te worden aangevuld.
          Voor toedeling van rechtsmacht aan de CRvB is aanleiding op het terrein van het ambtenarenrecht, de
      pensioenwetgeving, sociale zekerheid, studiefinanciering en wetgeving voor oorlogsgetroffenen. In enkele gevallen
      fungeert de CRvB als bestuursrechter in eerste en enige aanleg ([artikel 3 van bijlage 2 Awb][ref5]), in de meeste
      gevallen als hogerberoepsrechter ([artikelen 9 en 10 van bijlage 2 Awb][ref6]).
          Voor toedeling van rechtsmacht aan het College van Beroep voor het bedrijfsleven (CBb) is aanleiding bij
      regelingen van sociaal-economische aard, dat wil zeggen regelingen die economische ordening of sturing dan wel
      kwaliteitsnormen voor producten behelzen. Van een regeling van sociaal-economische aard zal in het algemeen ook
      gesproken kunnen worden, indien het gaat om wettelijke voorschriften die primair de uitoefening van beroepen of
      bedrijven betreffen. Dit geldt niet voor voorschriften die betrekking hebben op het oprichten en in werking houden
      van inrichtingen ten behoeve van bedrijf of beroep, zoals deze bijvoorbeeld in de milieuwetgeving voorkomen.
          Het CBb fungeert meestal als bestuursrechter in eerste en enige aanleg [(artikel 4 van bijlage 2 Awb][ref7]).
      Bij enkele wetten is het CBb echter hogerberoepsrechter ([artikel 11 van bijlage 2 Awb][ref8]), terwijl beroep
      in eerste aanleg openstaat bij de rechtbank Rotterdam ([artikel 7 van bijlage 2 Awb][ref9]). Het beroep in twee
      instanties in deze wetten houdt meestal verband met de mogelijkheid om deze wetten te handhaven door het opleggen
      van een bestuurlijke boete (gelet op artikel 14, vijfde lid, van het Internationaal Verdrag inzake burgerrechten en
      politieke rechten).


      [ref1]: https://wetten.overheid.nl/BWBR0005537
