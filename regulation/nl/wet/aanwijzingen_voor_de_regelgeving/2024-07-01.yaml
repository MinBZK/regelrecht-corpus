  - number: '9.11'
    text: |-
      In de eerste alinea van de toelichting bij een implementatieregeling wordt vermeld:

      a. dat de regeling strekt tot implementatie, met een verwijzing naar de bindende EU-rechtshandeling overeenkomstig
      [aanwijzing 3.42][ref1];

      b. de uiterste datum waarop de implementatie moet zijn gerealiseerd;

      c. een verwijzing naar het onderdeel van de toelichting waarin de transponeringstabel is opgenomen.


          **Toelichting**
          **Onderdeel a.** Indien veel bindende EU-rechtshandelingen tegelijkertijd worden geïmplementeerd en dus
      aangehaald, is het met het oog op de overzichtelijkheid en leesbaarheid van de toelichting beter om een verkorte
      aanduiding te gebruiken, met daarbij in een voetnoot de volledige aanduiding, bedoeld in [aanwijzing 3.42][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.11
    references:
