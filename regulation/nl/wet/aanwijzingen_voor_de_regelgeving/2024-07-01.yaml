  - number: 5.43.1
    text: |-
      Bij het vaststellen van een maximale bestuurlijke boetehoogte wordt verwezen naar een van de boetecategorieën
      in het [Wetboek van Strafrecht][ref1], tenzij het noodzakelijk is aan te sluiten bij afwijkende bedragen in een
      bestaand stelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.43
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 5.43.2
    text: |-
      Voor de bepaling waarin een maximale bestuurlijke boetehoogte wordt vastgesteld, wordt het volgende model gebruikt:
      *De op grond van [artikel ... / de artikelen ...] op te leggen bestuurlijke boete bedraagt ten hoogste het bedrag
      dat is vastgesteld voor de [...] categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht /
      artikel 27, vierde lid, van het Wetboek van Strafrecht BES].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.43
  - number: 5.43.3
    text: |-
      Indien het vanwege de afschrikkende werking of grote financiële belangen noodzakelijk is om aan ondernemingen
      een zeer hoge bestuurlijke boete te kunnen opleggen die aansluit bij de hoogste boetecategorie in het
      [Wetboek van Strafrecht][ref1] of die, indien dat meer is, gerelateerd is aan de omzet van de desbetreffende
      onderneming, wordt het volgende model gebruikt: *De op grond van [artikel ... / de artikelen ...] op te leggen
      bestuurlijke boete bedraagt ten hoogste het bedrag dat is vastgesteld voor de zesde categorie, bedoeld in [artikel
      23, vierde lid, van het Wetboek van Strafrecht / artikel 27, vierde lid, van het Wetboek van Strafrecht BES] of,
      indien dat meer is, ten hoogste 10% van de omzet van de onderneming, onderscheidenlijk, indien de overtreding door
      een ondernemersvereniging is begaan, van de gezamenlijke omzet van de ondernemingen die van de vereniging deel
      uitmaken, in het boekjaar voorafgaande aan de beschikking waarin de bestuurlijke boete wordt opgelegd.*


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.43
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: '5.44'
    text: |-
      Door sancties te handhaven bepalingen worden zo nauwkeurig mogelijk geformuleerd.
          **Toelichting**
          In het bijzonder bij bepalingen die door strafsancties of bestuurlijke sancties worden gehandhaafd
      is de rechtszekerheid van groot belang. De burger moet uit de bepalingen precies kunnen afleiden in welke
      gevallen een gedraging tot toepassing van een sanctie kan leiden. Als daarover door verwijzing naar andere
      bepalingen onduidelijkheid kan ontstaan betekent dat dus dat die verwijzing achterwege moet blijven (zie
      [aanwijzing 3.27][ref1]). Zie ook [artikel 5:4, tweede lid, Awb][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.44
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 5.45.1
    text: |-
      Indien de omschrijving van een strafbaar feit aan een lagere regeling wordt overgelaten, wordt in de wet geregeld
      welke straf kan worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.45
  - number: 5.45.2
    text: |-
      De geldboete die ten hoogste kan worden opgelegd, wordt aangegeven door het noemen van een van de
      geldboetecategorieën, vermeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], onderscheidenlijk
      [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel27
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.45
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '27'
  - number: 5.45.3
    text: |-
      Voor de strafbaarstelling van een feit dat niet alleen met een geldboete maar ook met een vrijheidsstraf wordt
      bedreigd, wordt het volgende model gebruikt: *Overtreding van artikel ... wordt gestraft met [gevangenisstraf /
      hechtenis] van ten hoogste [aantal maanden of jaren] of een geldboete van de ... categorie.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.45
  - number: '5.46'
    text: |-
      Ten aanzien van elk strafbaar feit dat door een wet in het leven wordt geroepen of dat krachtens een wet bij lagere
      regeling in het leven kan worden geroepen, wordt in de wet aangegeven of het een misdrijf of een overtreding is.
      Daarvoor worden de volgende modellen gebruikt:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.46
  - number: 5.46.A
    text: '*De in artikel ... strafbaar gestelde feiten zijn misdrijven.*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.46
  - number: 5.46.B
    text: '*De [in / krachtens] artikel ... strafbaar gestelde feiten zijn overtredingen.*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.46
  - number: 5.47.1
    text: |-
      Strafbaarstelling als economisch delict geschiedt door de betrokken regeling in [artikel 1][ref1] of
      [1a van de Wet op de economische delicten][ref2] op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.47
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: 1a
  - number: 5.47.2
    text: |-
      Bij aanwijzing van economische delicten worden de artikelen van de betrokken regeling waarvan overtreding een
      economisch delict oplevert, opgesomd. Zo nodig worden ook de afzonderlijke leden genoemd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.47
  - number: 5.47.3
    text: |-
      De aanwijzing van economische delicten wordt overeenkomstig het volgende voorbeeld geformuleerd: *In artikel 1,
      onder 4°, van de Wet op de economische delicten wordt in de alfabetische volgorde ingevoegd:* *de Wet particuliere
      beveiligingsorganisaties en recherchebureaus, de artikelen 2 en 5, tweede en vierde lid;.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.47
  - number: 5.47.4
    text: |-
      Indien de [Wet op de economische delicten][ref1] wordt gewijzigd in verband met de wijziging van een regeling die
      reeds economische delicten bevat, wordt de wijziging overeenkomstig de volgende voorbeelden geformuleerd:


      [ref1]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.47
    references:
      - id: ref1
        bwb_id: BWBR0002063
  - number: 5.47.4.A
    text: |-
      *In artikel 1a, onder 1°, van de Wet op de economische delicten wordt in de zinsnede met betrekking tot de
      Meststoffenwet ‘de artikelen 7, 14, eerste lid, 19, 20, eerste lid, 21, 22, derde lid, en 26, zesde lid;’ vervangen
      door ‘(...)’.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.47
  - number: 5.47.4.B
    text: |-
      *In artikel 1a, onder 3°, van de Wet op de economische delicten vervalt de zinsnede met betrekking tot de Wet
      bodembescherming. De desbetreffende zinsnede wordt in de alfabetische volgorde ingevoegd in artikel 1a, onder 1°,
      van de Wet op de economische delicten.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.47
  - number: 5.48.1
    text: In een bijzondere wet worden in beginsel geen bepalingen over bestuursrechtelijke rechtsbescherming opgenomen.
