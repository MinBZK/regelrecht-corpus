  - number: '6.33'
    text: |-
      1 Indien er de voorkeur aan wordt gegeven dat de (eerst)verantwoordelijke bewindspersoon en niet de voorzitter
      van de Tweede Kamer zorg draagt voor een doorlopende nummering van een wet, wordt dit bepaald overeenkomstig het
      volgende model:

      *Voor de plaatsing van deze wet in het Staatsblad stelt Onze Minister [van/voor ...] de nummering van de artikelen
      [, hoofdstukken en paragrafen] van deze wet opnieuw vast en brengt hij de in deze wet voorkomende aanhalingen van
      de artikelen [, hoofdstukken en paragrafen] met de nieuwe nummering in overeenstemming.*

      2 In dat geval geschiedt de vaststelling van de nieuwe nummering en het daarmee in overeenstemming brengen
      van de desbetreffende aanhalingen bij een door de betrokken bewindspersoon vastgesteld en ondertekend besluit
      overeenkomstig het volgende model:

      *De Minister van/voor ... / de Staatssecretaris van ...,*

      *Gelet op artikel ... [bepaling overeenkomstig het in het eerste lid gegeven model];*

      *Besluit:*

      *Enig artikel*

      *Overeenkomstig de bij dit besluit behorende bijlage wordt de nummering van de artikelen [, hoofdstukken en
      paragrafen] van de ... [citeertitel van de wet] opnieuw vastgesteld en worden de in die wet voorkomende aanhalingen
      van de artikelen [, hoofdstukken en paragrafen] met de nieuwe nummering in overeenstemming gebracht.*


          **Toelichting**
          **Eerste lid.**Vooral bij omvangrijke nieuwe wetten kan het de voorkeur verdienen dat de doorlopende
      nummering eerst na de afronding van de parlementaire behandeling door beide Kamers wordt aangebracht.
      Dit kan met name aangewezen zijn indien in verband met de doorlopende nummering ook verwijzingen in
      andere wetten of wetsvoorstellen moeten worden aangepast, bijvoorbeeld door middel van een invoeringswet.
      Indien de onderhavige bepaling wordt opgenomen, impliceert dit dat de voorzitter van de Tweede Kamer
      geen gebruikmaakt van zijn bevoegdheid tot vernummering, behoudens wat de leden van artikelen betreft
      ([artikel 9.13 van het Reglement van Orde van de Tweede Kamer][ref1]).
          **Tweede lid.** Als bijlage bij het besluit wordt opgenomen een kopie van het origineel van de wet, waarop zijn
      aangegeven de wijzigingen die voortvloeien uit de bevoegdheid van de minister om de nummering van en verwijzingen
      naar artikelen e.d. aan te passen. Het besluit en de bijlage moeten aan het Ministerie van Justitie en Veiligheid
      worden toegezonden tezamen met de gebruikelijke stukken die bij het verzoek om plaatsing in het Staatsblad aan
      deze afdeling moeten worden toegezonden. Anders dan bij een besluit tot plaatsing van de integrale tekst van een
      gewijzigde regeling ([aanwijzing 6.22][ref2]) wordt dit besluit niet gepubliceerd in het Staatsblad, maar enkel de
      aangepaste wettekst.


      [ref1]: https://wetten.overheid.nl/BWBR0044975#Artikel9.13
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
