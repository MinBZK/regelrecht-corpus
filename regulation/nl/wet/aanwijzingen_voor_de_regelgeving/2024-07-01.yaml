  - number: '5.56'
    text: |-
      Bij het opnemen van bepalingen over de doorberekening van kosten voor toelating, voor toezicht op de naleving of
      voor repressieve handhaving van wet- en regelgeving wordt het toetsingskader voor doorberekening van toelatings- en
      handhavingskosten ‘Maat houden 2014’ (Kamerstukken II 2013/14, 24036, nr. 407) in acht genomen.
          **Toelichting**
          Onder toelating wordt verstaan het door de overheid toetsen of bedrijven of burgers voldoen aan
      gestelde eisen en het verlenen van toestemming – eventueel onder het stellen van aanvullende eisen – voor
      het verrichten van bepaalde handelingen. Te denken valt aan het in behandeling nemen van een aanvraag
      voor een vergunning. Zie [artikel 6, tweede lid, eerste zin, van de Wet op de kansspelen][ref1] en
      [artikel 19, eerste en derde lid, van de Geneesmiddelenwet][ref2] voor voorbeelden van de doorberekening
      van toelatingskosten. In artikel 13, tweede lid, van de Dienstenrichtlijn is aangegeven dat eventuele
      kosten voor aanvragers van een vergunning in verband met hun aanvraag redelijk en evenredig met de kosten
      van de vergunningprocedure in kwestie zijn en de kosten van de procedure niet overschrijden. Zie ook
      [aanwijzing 5.29][ref3].
          Onder toezicht op de naleving worden verstaan alle controleactiviteiten, stelselmatig of steekproefsgewijs,
      aangekondigd of niet aangekondigd, gericht op de naleving van wet- en regelgeving. Ook controles bij
      vergunninghouders die in ‘Maat houden 1996’ (Stcrt. 2000, 90) nog tot de ‘post-toelating’ werden gerekend, vallen
      hieronder.
          Onder repressieve handhaving worden verstaan handhavingsactiviteiten die zijn gebaseerd op een redelijk
      vermoeden van een strafbaar feit of een bestuursrechtelijke overtreding. Hieronder vallen ook vervolgactiviteiten
      zoals het opmaken van een proces-verbaal of van een boeterapport gevolgd door oplegging van een bestuurlijke
      sanctie.
          Zie voor voorbeelden van doorberekening van kosten die verband houden met nalevingstoezicht en
      repressieve handhaving [artikel 6, tweede lid, tweede zin, van de Wet op de kansspelen][ref4] en
      [artikel 19, tweede en derde lid, van de Geneesmiddelenwet][ref5].


