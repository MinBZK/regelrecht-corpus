  - number: '3.26'
    text: |-
      1 In het opschrift, de aanhef en de ondertekening van een regeling wordt een staatssecretaris aangeduid als ‘*de
      Staatssecretaris van [aanduiding ministerie]*’.

      2 In een regeling worden taken en bevoegdheden altijd aan een minister opgedragen, ook indien een staatssecretaris
      op het desbetreffende terrein als verantwoordelijk bewindspersoon fungeert.


          **Toelichting**
          Bij de aanduiding van de staatssecretaris wordt verwezen naar de naam van het ministerie en niet naar de taken
      van de staatssecretaris, óók als een ministerie meer dan één staatssecretaris telt; uit de ondertekening blijkt om
      welke staatssecretaris het gaat. Aangezien een staatssecretaris niet behoort tot de regering wordt de aanduiding
      ‘Onze Staatssecretaris’ niet gebruikt.
          Het tweede lid geldt ook voor het slotformulier van een klein koninklijk besluit. Zie
      [aanwijzing 4.31, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
