  - number: '3.45'
    text: |-
      1 Vermelding van vindplaatsen in het Staatsblad, de Staatscourant en het Tractatenblad geschiedt door toevoeging
      tussen haakjes van aanduidingen overeenkomstig de volgende voorbeelden:

        - *Stb. 2011, 35;*
        - *Stcrt. 2015, 10247;*
        - *Trb. 2008, 175*.

      2 Indien de regeling waarnaar wordt verwezen nog niet in het Staatsblad, de Staatscourant of het Tractatenblad
      is bekendgemaakt, wordt de vindplaats in ontwerpen van die regeling aangeduid door aanduiding van het jaartal en
      nummer van het publicatieblad met puntjes, overeenkomstig het volgende voorbeeld: *Stb. ..., ....*

      3 Het invullen van het jaartal en nummer van het desbetreffende publicatieblad geschiedt door het betrokken
      ministerie, uiterlijk bij de bekendmaking van de regeling.


          **Toelichting**
          **Derde lid.** Het invullen van het jaartal en nummer in wetten en algemene maatregelen van bestuur kan
      derhalve uiterlijk geschieden bij het corrigeren van de drukproeven. Hiervoor is geen uitdrukkelijke opdracht
      in de desbetreffende regeling vereist, zoals wel het geval is voor het publiceren van de integrale tekst van een
      regeling (zie [aanwijzing 6.22][ref1]). Ook de datum waarop een regeling zonder citeertitel is vastgesteld, kan nog
      uiterlijk bij het corrigeren van de drukproeven worden ingevuld. Zie ook [aanwijzing 3.37][ref2].


