  - number: '9.15'
    text: |-
      1 Met betrekking tot een aan Nederland toegezonden voorstel voor een bindende EU-rechtshandeling vult het
      eerstverantwoordelijke ministerie op verzoek van de Werkgroep beoordeling nieuwe Commissievoorstellen het daarvoor
      bestemde fiche in.

      2 Indien meer ministeries bij de uitvoering van de desbetreffende bindende EU-rechtshandeling zijn betrokken,
      geschiedt de invulling in overeenstemming met die ministeries.

      3 De invulling geschiedt door of in overeenstemming met de wetgevingsafdeling van het voor de implementatie
      eerstverantwoordelijke ministerie.

      4 De ingevulde formulieren berusten bij het secretariaat van de Werkgroep beoordeling nieuwe Commissievoorstellen.


          **Toelichting**
          Deze aanwijzing betreft het opstellen van de zogenoemde ‘fiches’, die in de vorm van een door de Werkgroep
      beoordeling nieuwe Commissievoorstellen (BNC) vastgesteld standaardformulier door die werkgroep worden verspreid.
      In de werkgroep zijn alle ministeries vertegenwoordigd. Zij staat onder leiding van het Ministerie van Buitenlandse
      Zaken. De fiches worden, na goedkeuring door de ministerraad, in verkorte versie aan het parlement gestuurd. De
      fiches zijn integraal toegankelijk voor ambtenaren van de departementen via de website van het Expertisecentrum
      Europees Recht (ECER): www.minbuza.nl/ecer.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.15
  - number: '9.16'
    text: |-
      1 Bij nieuwe voorstellen voor bindende EU-rechtshandelingen wordt door de eerstverantwoordelijke minister
      steeds bezien of er aanleiding is om ten behoeve van de bepaling van het Nederlandse standpunt adviescolleges
      en representatieve organisaties van belanghebbenden te raadplegen die de regering zou horen indien het
      regeringsvoorstellen betrof.

      2 In beginsel wordt over het ontwerp van een implementatieregeling geen advies gevraagd of extern overleg gevoerd
      en wordt een zodanig ontwerp niet voorgepubliceerd, ter inzage gelegd of anderszins extern bekendgemaakt.


          **Toelichting**
          **Eerste lid.**Het raadplegen van adviescolleges en representatieve organisaties van belanghebbenden door
      het eerstverantwoordelijke ministerie kan een bijdrage leveren aan een zorgvuldige voorbereiding van bindende
      EU-rechtshandelingen. Steeds moet worden bezien of dit in de gegeven omstandigheden zinvol is. Met name kan
      raadpleging zin hebben indien voorzienbaar is dat bij de implementatie geen of weinig ruimte meer zal bestaan voor
      het maken van keuzen (‘gebonden’ implementatie).
          Raadpleging is voorts slechts zinvol, indien adviezen op zodanige termijn kunnen worden gegeven en van zodanige
      aard zijn, dat zij van invloed kunnen zijn op de bepaling van het Nederlandse standpunt. Over de wijze en de
      termijn van advisering moeten bovendien concrete afspraken worden gemaakt, waarbij rekening wordt gehouden met
      het tijdstip van aanvang en met de voortgang van de besprekingen in internationaal verband. In gevallen waarin het
      horen van adviescolleges en andere instanties over nationale regelgeving niet wettelijk is voorgeschreven, ligt het
      in de rede dat de raadpleging in de fase van de voorbereiding van bindende EU-rechtshandelingen in de plaats treedt
      van het horen over de uiteindelijke implementatieregeling.
          **Tweede lid.**Ingevolge [titel 1.2 Awb][ref1] gelden voor regelingen ter implementatie van bindende EU-
      rechtshandelingen geen advies-, overleg-, inspraak-, en voorpublicatieverplichtingen. Hierop bestaat een
      uitzondering voor bepaalde voorhangprocedures (zie [artikel 1:8, tweede lid, Awb][ref2]).
          Vanwege het risico op vertraging in de implementatie bestaat voor een afwijking van het beginsel om geen advies
      te vragen of extern overleg te voeren over implementatieregelingen slechts reden als het vragen van advies of
      voeren van overleg noodzakelijk is voor een zorgvuldige voorbereiding van de regeling. Dat kan bijvoorbeeld het
      geval zijn indien de te implementeren bindende EU-rechtshandeling wezenlijke beleidskeuzen openlaat, die nog niet
      in een eerdere fase bij advisering of overleg aan de orde zijn geweest.
          De term ‘voorpubliceren’ heeft betrekking op de praktijk waarbij een ontwerpregeling in een publicatieblad
      wordt bekendgemaakt, waardoor de mogelijkheid tot inspraak wordt geboden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel18
