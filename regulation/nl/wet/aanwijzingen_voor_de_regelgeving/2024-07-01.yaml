  - number: '4.1'
    text: Regelingen worden voorzien van een opschrift.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 Voor het opschrift van een regeling wordt een van de volgende modellen gebruikt:

      a. bij een (rijks)wet:

      *Rijkswet / Wet van [datum] tot /, houdende [aanduiding inhoud];*

      b. bij een algemene maatregel van (rijks)bestuur:

      *Besluit van [datum] tot /, houdende [aanduiding inhoud];*

      c. bij een ministeriële regeling:

      *Regeling van de [Minister van/voor ... / Staatssecretaris van ...] van [datum] tot /, houdende [aanduiding
      inhoud];*

      d. bij een beleidsregel:

      *Beleidsregel van de [Minister van/voor ... / Staatssecretaris van ...] van [datum] over / tot [aanduiding
      inhoud].*

      2 In een wetsvoorstel worden in het opschrift de woorden ‘*Rijkswet / Wet van (...) tot /, houdende*’ niet
      opgenomen.


          **Toelichting**
          **Eerste lid.** Na het opschrift wordt geen punt geplaatst.
          **Onderdeel c.** Ook een door een minister in het kader van rijkswetgeving vastgestelde regeling wordt
      aangeduid als ‘regeling’ en niet als ‘rijksregeling’. Zie ook de [aanwijzingen 3.18][ref1] en [3.25][ref2].
          **Onderdelen c en d.** Zie ook de [aanwijzingen 3.23][ref3] en [3.26][ref4].
          **Tweede lid.**Het opschrift van een wetsvoorstel bevat alleen de aanduiding van de inhoud van het
      wetsvoorstel: ‘Regels over / met betrekking tot ...’ of, in het geval van een wijzigingswet, ‘Wijziging van ...’.
      Tussen het opschrift en de aanhef (zie [aanwijzing 4.5][ref5]) worden op een afzonderlijke regel de woorden
      ‘Voorstel van wet’ of ‘Voorstel van rijkswet’ geplaatst. De woorden ‘Rijkswet / Wet van ...tot /, houdende’ worden
      pas toegevoegd bij de bekendmaking van de (rijks)wet in het Staatsblad. Degene die de drukproef aanvraagt, draagt
      hiervoor zorg. In het opschrift van (het ontwerp van) een algemene maatregel van bestuur worden de woorden ‘Besluit
      van ... tot /, houdende’ wel reeds van begin af aan opgenomen.

          [Wet van 28 februari 2013, houdende] regels omtrent de instelling van de Autoriteit Consument en Markt
      ([Instellingswet Autoriteit Consument en Markt][ref6])
      [Wet van 12 december 1985 tot] wijziging van een aantal bepalingen in de wetgeving in verband met het verkrijgen
      van de hoedanigheid van land in het Koninkrijk door Aruba
      Besluit van [18 maart 2009], houdende nadere regels voor de binnenvaart ([Binnenvaartbesluit][ref7])
      Regeling van de Minister voor Wonen en Rijksdienst van [2 september 2016] tot wijziging van de Reisregeling
      buitenland in verband met de periodieke aanpassing van de tarieflijst
      Beleidsregel van de Staatssecretaris van Infrastructuur en Milieu van [26 september 2016] over de toepassing van
      artikel 80 Spoorwegwet ([Beleidsregel bestuurlijke boetes Spoorwegwet 2016][ref8]).


