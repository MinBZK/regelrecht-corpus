  - number: '5.34'
    text: |-
      Indien het noodzakelijk is dat op structurele basis wordt voorzien in de onderlinge verstrekking van
      persoonsgegevens tussen bestuursorganen of toezichthouders, terwijl geldende geheimhoudingsbepalingen daaraan
      in de weg staan, wordt op het niveau van de formele wet voorzien in een uitdrukkelijke regeling van de
      gegevensverstrekking, met inbegrip van de vaststelling van het doel van de gegevensverstrekking.
          **Toelichting**
          In het rapport van de Werkgroep herijking toezichtsregelgeving, Den Haag, augustus 2008, zijn de achtergronden
      van de doelbinding van gegevensverwerking, de betekenis van de term verdere verwerking van gegevens en de
      functie van geheimhoudingsbepalingen specifiek voor het toezicht op de naleving beschreven. Zie de bijlage bij
      de brief van de Minister van Justitie van 29 oktober 2008 aan de Voorzitter van de Tweede Kamer der Staten-
      Generaal (Kamerstukken II 2008/09, 31700 VI, nr. 70). Indien de politie of het openbaar ministerie een van
      de betrokken partijen is, zal in de regel moeten worden teruggegrepen op de [Wet politiegegevens][ref1] en de
      [Wet justitiële en strafvorderlijke gegevens][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022463
      [ref2]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.34
    references:
      - id: ref1
        bwb_id: BWBR0022463
      - id: ref2
        bwb_id: BWBR0014194
  - number: 5.34a.1
    text: |-
      Indien er zwaarwegende redenen zijn om af te wijken van het openbaarheidsregime van de [Wet open overheid][ref1],
      wordt de afwijking in de bijlage bij die wet vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0045754
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.34a
    references:
      - id: ref1
        bwb_id: BWBR0045754
  - number: 5.34a.2
    text: |-
      Voor het wijzigen van de [bijlage bij de Wet open overheid](onbekend) wordt het volgende voorbeeld als uitgangspunt
      gebruikt: '*In de bijlage bij artikel 8.8 van de Wet open overheid wordt in de alfabetische volgorde ingevoegd:* -'
      *Waterschapswet: de artikelen 37 en 43.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.34a
  - number: 5.35.1
    text: |-
      De werkzaamheden die door of namens een bestuursorgaan worden verricht om na te gaan of voorschriften worden
      nageleefd, worden aangeduid als ‘*toezicht op de naleving*’ van die voorschriften.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.35
  - number: 5.35.2
    text: |-
      De werkzaamheden ter vaststelling in concrete gevallen of een strafbaar feit is gepleegd op basis van een redelijk
      vermoeden dat dit het geval is, worden aangeduid als ‘*opsporing*’ van die feiten.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.35
  - number: '5.36'
    text: 'Voor de regeling van de aanwijzing van toezichthouders worden de volgende modellen gebruikt:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.36
  - number: 5.36.a
    text: |-
      bij aanwijzing van toezichthouders bij de wet: *Met het toezicht op de naleving van [aanduiding desbetreffende
      voorschriften] zijn belast [aanduiding ambtenaren of andere personen].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.36
  - number: 5.36.b
    text: 'bij aanwijzing van toezichthouders krachtens de wet:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.36
  - number: 5.36.b.1
    text: |-
      *Met het toezicht op de naleving van [aanduiding desbetreffende voorschriften] zijn belast de bij besluit van
      [aanduiding bestuursorgaan] aangewezen [ambtenaren / personen].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.36
  - number: 5.36.b.2
    text: '*Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.36
  - number: '5.37'
    text: |-
      Voor het uitsluiten van toezichtsbevoegdheden wordt het volgende model gebruikt: *De toezichthouder beschikt niet
      over de [bevoegdheid / bevoegdheden], genoemd in [artikel / de artikelen ...] van de Algemene wet bestuursrecht.*
          **Toelichting**
          Als regel worden, gelet op de samenhang tussen beide bevoegdheden, de bevoegdheden met betrekking tot
      onderzoek van zaken ([artikel 5:18 Awb][ref1]) en de bevoegdheden met betrekking tot onderzoek van vervoermiddelen
      ([artikel 5:19 Awb][ref2]) steeds gezamenlijk uitgesloten. De bevoegdheden tot het vorderen van inlichtingen
      ([artikel 5:16 Awb][ref3]) en het vorderen van inzage van een identiteitsbewijs ([artikel 5:16a Awb][ref4]) worden,
      gelet op het basale karakter van deze bevoegdheden, nimmer uitgesloten. Zie overigens deel 2, paragraaf 5.7, van de
      memorie van toelichting bij de [Aanpassingswet derde tranche Awb I][ref5] (Kamerstukken II 1996/97, 25280, nr. 3).


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0008994
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.37
