  - number: '5.24'
    text: |-
      Indien de uitvoering van een wet wordt opgedragen aan organen van gemeenten of provincies, wordt in die wet niet
      voorzien in toezicht op de uitvoering.


          **Toelichting**
          In 2007 bracht de Commissie Doorlichting Interbestuurlijke Toezichtarrangementen het rapport ‘Van specifiek
      naar generiek’ uit (Kamerstukken II 2007/08, 31200 VII, nr. 8 en bijlage). De kabinetsreactie (Kamerstukken
      II 2007/08, 31200 VII, nr. 61) is uitgevoerd met de [Wet revitalisering generiek toezicht][ref1], het
      [Besluit verstrekking systematische toezichtinformatie][ref2], het Beleidskader schorsing en vernietiging
      (Kamerstukken II 2009/10, 32389, nr. 5 en bijlage) en het mede door de provinciebesturen vastgestelde Algemeen
      beleidskader indeplaatsstelling bij taakverwaarlozing (Kamerstukken II 2010/11, 32500 VII, nr. 85 en bijlage).
          Kern van het beleid is dat in wetten waarin aan organen van provincie of gemeenten taken in medebewind
      worden gegeven geen specifieke instrumenten voor interbestuurlijk toezicht worden opgenomen, maar dat,
      ingeval een interventie noodzakelijk is, wordt volstaan met de generieke instrumenten die zijn geregeld in de
      [Provinciewet][ref3] en de [Gemeentewet][ref4], te weten: indeplaatsstelling (indien een wettelijke taak niet of
      niet tijdig wordt uitgevoerd) of vernietiging door de Kroon (bij besluiten in strijd met het recht of het algemeen
      belang). Zie de [artikelen 121][ref5] e.v. en [261 e.v. van de Provinciewet][ref6] en de [artikelen 124][ref7]
      e.v. en [268 e.v. van de Gemeentewet][ref8]. Uitgangspunt daarbij is dat het interbestuurlijk toezicht op gemeenten
      berust bij het provinciebestuur en het toezicht op provincies bij de vakminister(s). Indien het provinciebestuur
      geen taak of expertise op een beleidsterrein heeft, kan het interbestuurlijk toezicht worden belegd bij de
      vakminister(s) ([artikel 124b en bijlage van de Gemeentewet][ref9]).
          Dit beleid heeft geen betrekking op waterschappen, noch op de openbare lichamen Bonaire, Sint Eustatius en
      Saba.
          **Toezichtinformatie.** Met de wettelijke basis die door de [Wet revitalisering generiek toezicht][ref10]
      in de [Provinciewet (artikel 121f)][ref11] en de [Gemeentewet (artikel 124h)][ref12] is opgenomen, is het niet
      langer nodig een aparte wettelijke grondslag in bijzondere wetten op te nemen. De bescherming van decentrale
      overheden die uitging van de noodzaak om per aangelegenheid een formeelwettelijke basis te creëren, wordt in het
      [Besluit verstrekking systematische toezichtinformatie][ref13] gecompenseerd door algemene regels te stellen over
      het verstrekken van toezichtinformatie, zodat enerzijds adequaat toezicht mogelijk is, maar anderzijds decentrale
      overheden niet worden geconfronteerd met informatieverplichtingen die onevenredige inspanningen vergen of voor een
      ander doel dan toezicht worden gebruikt.
          **Waterschappen.**Er zijn geen vergelijkbare generieke regels voor het toezicht op waterschappen.
      In sommige gevallen is het gewenst om het interbestuurlijk toezicht op waterschappen te uniformeren
      met het toezicht op gemeenten of provincies. Een voorbeeld van het uniformeren van het toezicht op
      waterschappen met het toezicht op gemeenten bij zowel indeplaatsstelling door het provinciebestuur als
      vernietiging door de Kroon is [artikel 38 van de Archiefwet 1995][ref14]. Een voorbeeld van het uniformeren
      van het toezicht op waterschappen met het toezicht op provincies bij alleen indeplaatsstelling is
      [artikel 17.15, tweede lid, laatste volzin, van de Wet milieubeheer][ref15]. In een dergelijk geval worden tevens
      de [bijlagen 1][ref16] en [2 bij de Algemene wet bestuursrecht][ref17] aangevuld (zie de [aanwijzingen 5.49][ref18]
      en [5.52][ref19]), zodat de rechtsbescherming bij de toepassing op waterschappen gelijk is aan de rechtsbescherming
      onder de [Gemeentewet][ref20] en de [Provinciewet][ref21].
          **Caribisch Nederland.**Zie voor het interbestuurlijk toezicht in Caribisch Nederland
      [hoofdstuk V van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref22].
          **Europeesrechtelijke verplichtingen.** Indien de naleving van Europeesrechtelijke verplichtingen in het geding
      is en het niet mogelijk of aangewezen is de generieke toezichtinstrumenten toe te passen, kan een beroep worden
      gedaan op de toezichtinstrumenten van de [Wet Naleving Europese regelgeving publieke entiteiten][ref23].


