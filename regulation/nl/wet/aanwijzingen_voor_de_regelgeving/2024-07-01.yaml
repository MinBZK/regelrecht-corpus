  - number: '5.68'
    text: |-
      1 Indien de formulering van een wetsvoorstel tot wijziging van een wet afhankelijk is van een wijziging die een
      ander wetsvoorstel beoogt teweeg te brengen in diezelfde wet, wordt een samenloopbepaling overeenkomstig het
      volgende model opgenomen:

      *Indien het bij koninklijke boodschap van [datum] ingediende voorstel van wet [opschrift en Kamerstuknummer] tot
      wet is of wordt verheven en [artikel... van] die wet eerder in werking is getreden of treedt dan [artikel... van]
      deze wet, wordt [artikel... van] deze wet als volgt gewijzigd:....*

      2 Indien een wetsvoorstel tot wijziging van een wet gevolgen heeft voor de formulering van een ander wetsvoorstel
      tot wijziging van diezelfde wet, wordt een samenloopbepaling overeenkomstig het volgende model opgenomen:

      *Indien het bij koninklijke boodschap van [datum] ingediende voorstel van wet [opschrift en Kamerstuknummer] tot
      wet is of wordt verheven en [artikel ... van] die wet later in werking treedt dan [artikel ... van] deze wet, wordt
      [artikel ... van] die wet als volgt gewijzigd: ....*

      3 Indien er tussen twee wetsvoorstellen tot wijziging van dezelfde wet een wederzijdse tekstuele afhankelijkheid
      bestaat, wordt een samenloopbepaling overeenkomstig het volgende model opgenomen:

      *Indien het bij koninklijke boodschap van [datum] ingediende voorstel van wet [opschrift en Kamerstuknummer] tot
      wet is of wordt verheven en [artikel ... van] die wet:*

      a. *eerder in werking treedt of is getreden dan [artikel ... van] deze wet, wordt [artikel ... van] deze wet als
      volgt gewijzigd: ...;*

      b. *later in werking treedt dan [artikel ... van] deze wet, wordt [artikel ... van] die wet als volgt
      gewijzigd: ... .*

      4 Indien een wetsvoorstel gevolgen heeft voor de formulering van een wetsvoorstel dat beoogt een nieuwe wet tot
      stand te brengen, wordt een samenloopbepaling overeenkomstig het volgende model opgenomen:

      *Indien het bij koninklijke boodschap van [datum] ingediende voorstel van wet [opschrift en Kamerstuknummer] tot
      wet is of wordt verheven, wordt [artikel ... van] die wet als volgt gewijzigd: ....*

      5 Indien de formulering van een wetsvoorstel dat beoogt een nieuwe wet tot stand te brengen, afhankelijk is van een
      ander wetsvoorstel, wordt een samenloopbepaling overeenkomstig het volgende model opgenomen:

      *Indien het bij koninklijke boodschap van [datum] ingediende voorstel van wet [opschrift en Kamerstuknummer] tot
      wet is of wordt verheven en [artikel ... van] die wet in werking treedt, wordt [artikel ... van] deze wet als volgt
      gewijzigd: ....*


          **Toelichting**
          Zie voor het aanhalen van wetsvoorstellen [aanwijzing 3.43, tweede lid][ref1].
          De modellen kunnen ook worden gebruikt indien de samenloop betrekking heeft op een wet die nog niet in werking
      is getreden. De zinsnede ‘Indien het bij koninklijke boodschap van [datum] ingediende voorstel van wet [opschrift
      en Kamerstuknummer] tot wet is of wordt verheven en [artikel ... van] die wet’ wordt in dat geval vervangen door:
      Indien [artikel ... van] de [citeertitel of aanduiding van de wet].
          Het eerste en tweede lid zien op eenzijdige samenloop: wetsvoorstel A is afhankelijk van of heeft gevolgen voor
      wetsvoorstel B, maar andersom is dat niet het geval. Hiervan is bijvoorbeeld sprake als wetsvoorstel A een bestaand
      artikellid wijzigt, dat door wetsvoorstel B wordt vernummerd in verband met de invoeging van een nieuw lid. In die
      situatie hoeft de samenloop alleen te worden geregeld voor het geval wetsvoorstel B eerder in werking treedt dan
      wetsvoorstel A. Treedt wetsvoorstel A eerder in werking, dan is de wijziging reeds doorgevoerd voordat wetsvoorstel
      B tot vernummering van het artikellid leidt.
          Het derde lid ziet op wederzijdse samenloop. Daarvan is sprake als de formulering van wetsvoorstel A niet
      alleen afhankelijk is van maar ook gevolgen heeft voor de formulering van wetsvoorstel B. De volgorde van
      inwerkingtreding van beide wetsvoorstellen zal dan bepalend zijn voor de uiteindelijke formulering. Als die
      volgorde nog niet bekend is, kan het nodig zijn alternatieve wijzigingsopdrachten te formuleren: één voor het geval
      wetsvoorstel A eerder in werking treedt, en één voor het geval wetsvoorstel B eerder in werking treedt.
          Indien gewenst kan aan de modellen worden toegevoegd ‘onderscheidenlijk op hetzelfde tijdstip’. Zie
      bijvoorbeeld Stb. 2013, 485, artikel IVb.
          Zie voor samenloop met betrekking tot de nummering of lettering van regelingselementen ook
      [aanwijzing 5.69][ref2].
          **Voorbeelden bij het eerste en tweede lid**
          Indien het bij koninklijke boodschap van 12 december 2016 ingediende voorstel van wet tot wijziging van het
      [Wetboek van Burgerlijke Rechtsvordering][ref3], de [Invorderingswet 1990][ref4] en enkele andere wetten in verband
      met een vereenvoudiging van de beslagvrije voet ([Wet vereenvoudiging beslagvrije voet][ref5]) (Kamerstukken
      34 628) tot wet is of wordt verheven en artikel I, onderdeel B, van die wet eerder in werking is getreden of treedt
      dan artikel II, onderdeel D, van deze wet, wordt artikel II van deze wet als volgt gewijzigd: A (...) B (...)
      Indien het bij geleidende brief van 5 februari 2020 aanhangig gemaakte voorstel van wet van de leden Klaver en
      Ouwehand tot wijziging van de [Wet milieubeheer][ref6] en het [Wetboek van Strafrecht][ref7] in verband met de
      invoering van een vuurwerkverbod voor consumenten (Kamerstukken 35 386) tot wet is of wordt verheven en artikel
      I, onderdeel C, van die wet later in werking treedt dan artikel IV, onderdeel F, van deze wet, wordt in artikel I,
      onderdeel C, van die wet ‘tweede lid’ vervangen door ‘derde lid’.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0001827
      [ref4]: https://wetten.overheid.nl/BWBR0004770
      [ref5]: https://wetten.overheid.nl/BWBR0039377
      [ref6]: https://wetten.overheid.nl/BWBR0003245
      [ref7]: https://wetten.overheid.nl/BWBR0001854
