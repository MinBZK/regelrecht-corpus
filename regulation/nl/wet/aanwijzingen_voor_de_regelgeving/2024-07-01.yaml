  - number: '4.49'
    text: |-
      1 In een toelichting wordt heldere en bondige taal gebruikt en een logische indeling gevolgd.

      2 Bij het formuleren van een nota van toelichting bij een algemene maatregel van bestuur of een ander koninklijk
      besluit van regelende aard, of een toelichting bij een ministeriële regeling of een beleidsregel wordt ervan
      uitgegaan dat de betrokken regeling al is vastgesteld.

      3 De [paragrafen 3.1][ref1], [3.3][ref2] en [3.4][ref3] van deze aanwijzingen zijn voor de formulering van een
      toelichting van overeenkomstige toepassing, voor zover zij verenigbaar zijn met de aard van een toelichting.


          **Toelichting**
          **Eerste lid.**Enige aandachtspunten voor helder en bondig taalgebruik zijn, in aanvulling op hetgeen hierover
      in de [paragrafen 3.1][ref4], [3.3][ref5] en [3.4][ref6] is opgemerkt:
          vermijden van onnodige woorden in een zin;
      zinnen zoveel mogelijk in de bedrijvende vorm redigeren;
      vermijden van de aanvoegende wijs;
      consistentie in woordkeus en spelling;
      vermijden van jargon en zeer technische termen;
      formuleren in korte zinnen, vermijden van lange bijzinnen.
          **Tweede lid.**In de toelichting bij een koninklijk besluit, een ministeriële regeling of een beleidsregel
      wordt niet gesproken van ‘voorgestelde bepalingen’. De toelichting wordt geschreven alsof die bepalingen al zijn
      vastgesteld. Gelet op de aard van een wetsvoorstel geldt dit niet voor een memorie van toelichting en toelichtingen
      bij nota's van wijziging. Wel moet in de toelichting bij een nota van wijziging onderscheid worden gemaakt tussen
      de wijziging van het wetsvoorstel als handeling in het wetgevingsproces en de ten gevolge van de nota van wijziging
      gewijzigde inhoud van het desbetreffende wetsvoorstel. Na indiening van de nota van wijziging is de wijziging van
      het wetsvoorstel een feit; een nota van wijziging is geen ‘voorstel’ om het wetsvoorstel te wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
