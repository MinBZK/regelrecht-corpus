  - number: '5.51'
    text: |-
      Voor één wet wordt zoveel mogelijk één rechtsgang gekozen.
          **Toelichting**
          Eenheid van rechtsgang binnen een wet bevordert voor alle betrokkenen de toegankelijkheid van de procedure en
      voorkomt complicaties bij gelijktijdige procedures over samenhangende besluiten. Een reden voor differentiatie kan
      zijn dat één rechtsgang onvoldoende aansluit bij de bestaande competentieverdeling. Zie bijvoorbeeld de vermelding
      van [artikel 125 van de Gemeentewet][ref1] in [artikel 4 van bijlage 2 Awb][ref2] (beroep in één instantie bij het
      CBb) voor zover het gaat om handhaving van de [Winkeltijdenwet][ref3].
          Tegen een besluit tot oplegging van een bestuurlijke boete dient beroep in twee instanties open te staan,
      gelet op artikel 14, vijfde lid, van het Internationaal Verdrag inzake burgerrechten en politieke rechten. Het
      kan wenselijk zijn dat tegen andere besluiten die op grond van de betrokken wet genomen kunnen worden, beroep in
      één instantie openstaat. Als in dat geval wordt gekozen voor differentiatie van de rechtsgang binnen de wet, dan
      verdient het aanbeveling om een voorziening te treffen voor het geval dat in één besluit zowel een bestuurlijke
      boete wordt opgelegd als een andere sanctie, bijvoorbeeld een last onder dwangsom.
          Deze aanwijzing ziet niet op het overslaan van de bezwaarfase (rechtstreeks beroep als bedoeld in
      [bijlage 1 Awb][ref4]).


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0007952
      [ref4]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.51
