  - number: '5.10'
    text: |-
      1 Regelgevende bevoegdheden worden aan een zelfstandig bestuursorgaan uitsluitend toegekend:

      a. voor zover het organisatorische of technische onderwerpen betreft; of

      b. in bijzondere gevallen mits voorzien is in de bevoegdheid tot goedkeuring van de regeling door een minister.

      2 Aan een zelfstandig bestuursorgaan wordt geen adviestaak opgedragen ten aanzien van algemeen verbindende
      voorschriften of te voeren beleid van het Rijk.


          **Toelichting**
          Algemeen verbindende voorschriften worden in beginsel niet vastgesteld door anderen dan regering
      (en Staten-Generaal), ministers, provincies, gemeenten of waterschappen. Daarnaast kan op grond van
      [artikel 134 van de Grondwet][ref1] die bevoegdheid worden toegekend aan een orgaan van een openbaar lichaam van
      beroep of bedrijf of een ander openbaar lichaam. Het is in dat licht in beperkte mate aanvaardbaar dat aan een
      zelfstandig bestuursorgaan regelgevende bevoegdheid wordt toegekend. Niet uitgesloten is dat in bijzondere gevallen
      over andere dan organisatorische of technische onderwerpen regels worden gesteld, doch uitsluitend indien voorzien
      is in ministeriële goedkeuring. Aan de motivering hiervan in de toelichting worden vanwege het uitzonderlijk
      karakter zware eisen gesteld.
          Indien een wet het mogelijk maakt dat aan een bij de uitvoering van die wet betrokken zelfstandig
      bestuursorgaan regelgevende bevoegdheid wordt toegekend, voorziet de formulering ‘bij of krachtens algemene
      maatregel van bestuur’ (zie [aanwijzing 2.26][ref2]) tevens in de mogelijkheid van subdelegatie aan dat
      zelfstandige bestuursorgaan.

          De Autoriteit Financiële Markten kan regels stellen met betrekking tot de wijze
      waarop de informatie, bedoeld in het eerste lid, wordt opgenomen in de jaarrekening.
      ([Artikel 124, tweede lid, van het Besluit Gedragstoezicht financiële ondernemingen Wft][ref3])

          Het UWV kan nadere regels stellen met betrekking tot de premie. De door
      het UWV (...) gestelde regels behoeven de goedkeuring van Onze Minister.
      ([Artikel 73, tweede en derde lid, van de Wet financiering sociale verzekeringen][ref4])


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0020421#Artikel124
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel73
