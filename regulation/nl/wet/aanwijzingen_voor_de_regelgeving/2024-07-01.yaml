  - number: '4.52'
    text: |-
      1 Een memorie van toelichting, een toelichting op een nota van wijziging, een nota van toelichting, een toelichting
      op een ministeriële regeling en een toelichting op een beleidsregel worden ondertekend.

      2 Een memorie van toelichting, een toelichting op een nota van wijziging die aan de Afdeling advisering van de
      Raad van State wordt voorgelegd en een nota van toelichting worden ondertekend na de behandeling van het betrokken
      voorstel in de ministerraad en voordat het aan het Kabinet van de Koning wordt toegezonden voor advies van de
      Afdeling advisering van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.52
  - number: '4.53'
    text: |-
      1 Bij de voordracht tot een voorstel van wet of een algemene maatregel van bestuur ‘mede namens’ andere
      bewindspersonen wordt de memorie of nota van toelichting alleen door de eerstverantwoordelijke bewindspersoon
      ondertekend.

      2 De medebetrokkenheid van een of meer andere bewindspersonen wordt in dat geval in de toelichting tot uitdrukking
      gebracht.


          **Toelichting**
          Zie ook de [aanwijzingen 4.6][ref1], [4.7][ref2] en [4.33][ref3]. Zie voor het tot uitdrukking brengen van de
      medebetrokkenheid ook [aanwijzing 4.40, tweede lid][ref4].
          Deze aanwijzing geldt ook voor de ondertekening van de toelichting op een nota van wijziging. De aanwijzing
      geldt niet voor de ondertekening van de voordracht en de memorie van toelichting bij een voorstel van wet tot
      goedkeuring van een verdrag en van de toelichtende nota in geval van stilzwijgende goedkeuring van een verdrag
      (zie [aanwijzing 8.13][ref5]). Deze voordracht wordt gedaan door de Minister van Buitenlandse Zaken mede namens
      de eerstverantwoordelijke bewindspersoon. De eerstverantwoordelijke bewindspersoon en de Minister van Buitenlandse
      Zaken ondertekenen gezamenlijk de toelichting en – in het geval van uitdrukkelijke goedkeuring – na aanvaarding de
      goedkeuringswet. Hiermee wordt de verantwoordelijkheid van de Minister van Buitenlandse Zaken voor het buitenlands
      beleid van het Koninkrijk tot uitdrukking gebracht.


