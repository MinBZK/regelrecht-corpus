  - number: '2.5'
    text: |-
      Bij het bepalen van de keuze voor een mogelijkheid tot overheidsinterventie om een doel te bereiken wordt zoveel
      mogelijk aangesloten bij het zelfregulerend vermogen in de maatschappij.
          **Toelichting**
          Uit de eisen van met name efficiëntie en evenredigheid vloeit voort dat voor direct overheidsingrijpen
      slechts plaats is indien van het zelfregulerend vermogen van de maatschappij – ook versterkt met ondersteunende
      overheidsmaatregelen – niet voldoende resultaten te verwachten zijn.
          Ook indien overheidsinterventie in enigerlei vorm noodzakelijk is, wordt zoveel mogelijk aangesloten bij
      bestaande vormen van zelfregulering. Daartoe wordt voor elk van de aspecten van regulering (te weten: normstelling,
      toezicht/informatieverzameling, oordeelsvorming en interventies/sanctionering) bezien of kan worden aangesloten bij
      bestaande zelfreguleringsmechanismen in de maatschappij.
          Een voorbeeld van aansluiten bij dergelijke mechanismen is het gebruik van normalisatie en certificatie. Bij of
      krachtens de wet kan bijvoorbeeld worden bepaald dat door het naleven van normalisatienormen of het bezit van een
      certificaat aan wettelijke eisen wordt voldaan of dat het wettelijk vermoeden ontstaat dat daaraan is voldaan (zie
      [aanwijzing 3.48][ref1]). Zie in dit verband ook onderdeel 3.1 (Beleidsinstrumenten) van het Beleidskompas.
          Zie met betrekking tot de toelichting bij de regeling ook [aanwijzing 4.43, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
