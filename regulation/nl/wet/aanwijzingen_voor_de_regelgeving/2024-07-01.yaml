  - number: '6.28'
    text: |-
      1 Een nota van wijziging wordt van een toelichting voorzien.

      2 Betreft het een nota van wijziging die tegelijk met een nota naar aanleiding van het verslag wordt ingediend, dan
      kan ter toelichting worden volstaan met een verwijzing naar een bepaald gedeelte van de nota naar aanleiding van
      het verslag.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.28
  - number: '6.29'
    text: |-
      1 Een nota van wijziging wordt niet ondertekend, de toelichting op een nota van wijziging wel.

      2 De toelichting op een nota van wijziging wordt bij voorkeur alleen ondertekend door de eerstverantwoordelijke
      bewindspersoon. De medebetrokkenheid van een of meer andere bewindspersonen wordt in dat geval in de toelichting
      tot uitdrukking gebracht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.29
  - number: '6.30'
    text: |-
      Indien tijdens de schriftelijke behandeling van een wetsvoorstel een nota van wijziging met inhoudelijke betekenis
      wordt overwogen, wordt overlegd met het Ministerie van Justitie en Veiligheid of die nota van wijziging aan een
      wetgevingstoets zal worden onderworpen.


          **Toelichting**
          Zie over de toetsing van ontwerpregelgeving door de sector Juridische Zaken en Wetgevingsbeleid van de Directie
      Wetgeving en Juridische Zaken van het Ministerie van Justitie en Veiligheid ten algemene: [aanwijzing 7.4][ref1].
          Om tijdsverlies in de wetgevingsprocedure te voorkomen en vanwege de soms krappe termijnen tijdens de
      mondelinge behandeling, beperkt deze toetsing zich tot nota’s van wijziging met inhoudelijke betekenis in de fase
      van schriftelijke behandeling van een wetsvoorstel. Onderdeel van de toetsing is de vraag of de nota van wijziging
      ingrijpend is en dientengevolge aan de ministerraad moet worden voorgelegd, met het oog op het vragen van advies
      daarover aan de Afdeling advisering van de Raad van State (zie ook [aanwijzing 7.15, tweede lid][ref2]).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
