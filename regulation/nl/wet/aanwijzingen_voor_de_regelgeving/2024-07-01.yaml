  - number: '5.13'
    text: |-
      1 Indien binnen een organisatie of rechtspersoon naast het publiekrechtelijke zelfstandig bestuursorgaan nog andere
      organen of nevenorganen worden ingesteld, worden in de instellingswet de onderlinge verhoudingen en bevoegdheden
      van deze organen vastgelegd.

      2 [Aanwijzing 5.12, eerste lid][ref1], is op deze andere organen en nevenorganen van overeenkomstige toepassing.


          **Toelichting**
          **Eerste lid.** Bestuursbevoegdheden worden veelal ongedeeld opgedragen aan een zelfstandig bestuursorgaan.
      Vooral bij complexe taken en grotere organisaties kan het echter raadzaam zijn de bevoegdheden over meer organen te
      verdelen. Gedacht kan worden aan de constructie van een dagelijks bestuur met daarnaast een toezichthoudend orgaan,
      een bestuur naast een (operationeel) directeur of een gebruikers- of cliëntenraad. Indien voor een gedeelde opzet
      wordt gekozen, dient duidelijk te zijn welke bevoegdheden aan welk orgaan toekomen en wat de onderlinge verhouding
      tussen de organen is. Ingevolge [artikel 7 van de Kaderwet zelfstandige bestuursorganen][ref2] kan een zelfstandig
      bestuursorgaan in deze situatie mede ten behoeve van de andere zelfstandige bestuursorganen de verplichtingen
      ingevolge deze wet nakomen. Bij de regeling van de onderlinge verhoudingen, bedoeld in deze aanwijzing, wordt
      aangegeven welk orgaan dit is, zodat duidelijk is met welk orgaan de minister communiceert.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel7
