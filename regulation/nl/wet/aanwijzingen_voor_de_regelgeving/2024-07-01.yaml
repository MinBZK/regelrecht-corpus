  - number: '2.1'
    text: |-
      Voor het normeren van gedragingen, handelingen of bevoegdheden worden algemeen verbindende voorschriften, interne
      regels of beleidsregels gebruikt.
          **Toelichting**
          De status van instrumenten als richtlijnen en circulaires is niet eenduidig en helder. Van gebruik van deze
      instrumenten voor normering dient dan ook zoveel mogelijk te worden afgezien. Circulaires worden alleen gebruikt
      voor het verstrekken van informatie, die overigens wel betrekking kan hebben op regelgeving.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.1
  - number: '2.2'
    text: |-
      Tot het tot stand brengen van een regeling wordt alleen besloten indien de noodzaak daarvan is komen vast te staan.
          **Toelichting**
          Regelgeving is noodzakelijk indien aannemelijk is dat het concrete voorstel een effectieve, efficiënte en
      evenredige reactie vormt op het maatschappelijke probleem dat aanleiding geeft voor die regelgeving. Daarvoor is
      dus vereist dat voldoende zekerheid bestaat dat de voorgestelde regeling werkelijk zal leiden tot het oplossen of
      verminderen van dat probleem, dat er geen minder bezwarende alternatieven zijn, en dat de kosten en lasten daarvan
      gerechtvaardigd worden door de ernst van het probleem. Indien niet aan elke van deze voorwaarden is voldaan,
      bestaat onvoldoende grond om tot regelgeving (in de voorgenomen vorm) over te gaan. Eventueel kan in zo'n geval
      een alternatief, minder bezwarend sturingsinstrument worden ingezet, of dient simpelweg van overheidsingrijpen te
      worden afgezien.
          Zie met betrekking tot de toelichting bij de regeling ook [aanwijzing 4.43, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
