  - number: '2.22'
    text: |-
      Voor het vaststellen van algemeen verbindende voorschriften wordt een zelfstandige algemene maatregel van bestuur
      niet gebruikt, behoudens in uitzonderlijke situaties bij wijze van tijdelijke voorziening.


          **Toelichting**
          **Toepassingsmogelijkheden.** Een zelfstandige algemene maatregel van bestuur berust niet op een wet. Naar
      huidige rechtsopvatting is er slechts in uitzonderlijke gevallen ruimte voor een dergelijk type regeling. Gezien
      het uitzonderlijk karakter moet in de toelichting bij een zelfstandige algemene maatregel van bestuur het gebruik
      daarvan worden gemotiveerd. In de aanhef van een zelfstandige algemene maatregel van bestuur wordt dan verwezen
      naar [artikel 89, eerste lid, van de Grondwet][ref1].
          **Grondwettelijke beperkingen.** Allereerst perkt de [Grondwet][ref2] de ruimte voor zelfstandige algemene
      maatregelen van bestuur sterk in. [Artikel 89, tweede lid, van de Grondwet][ref3] verzet zich tegen het opnemen van
      door straffen te handhaven voorschriften in een dergelijke algemene maatregel van bestuur. Onderwerpen ten aanzien
      waarvan de [Grondwet][ref4] voorschrijft dat de wet deze regelt of dat bepalingen daarover bij of krachtens de wet
      worden vastgesteld, lenen zich evenmin voor regeling bij zelfstandige algemene maatregel van bestuur.
          **Beperkingen vanwege het primaat van de wetgever.** Ook in de gevallen waarin de [Grondwet][ref5] het
      vaststellen van algemeen verbindende voorschriften bij zelfstandige algemene maatregel van bestuur niet
      uitsluit, is die weg ongewenst aangezien daarmee geen recht wordt gedaan aan het primaat van de wetgever (zie
      [aanwijzing 2.19][ref6]). Bepalingen die de aan de betrokkenen toekomende rechten en vrijheden inperken, kunnen
      naar huidige rechtsopvatting niet bij zelfstandige algemene maatregel van bestuur worden vastgesteld. Dit geldt
      steeds voor het stellen van voorschriften die door middel van bestuursdwang worden gehandhaafd. In andere gevallen,
      zoals algemeen verbindende voorschriften die financiële aanspraken regelen, kan in uitzonderlijke situaties zo
      nodig een zelfstandige algemene maatregel van bestuur worden vastgesteld, doch ook dan nog slechts voor het treffen
      van een tijdelijke voorziening.
          Zie ook [paragraaf 5.16][ref7] (Tijdelijke regelingen).
          **Beperkingen ingevolge afzonderlijke wetten.** De [Financiële-verhoudingswet (artikel 17)][ref8] en
      de [Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba (artikel 92)][ref9] bevatten bijzondere
      bepalingen inzake de geoorloofdheid om bij zelfstandige algemene maatregel van bestuur regels te stellen inzake
      specifieke uitkeringen voor provincies of gemeenten en inzake bijzondere uitkeringen voor de openbare lichamen
      Bonaire, Sint Eustatius en Saba.
          **Algemene maatregelen van rijksbestuur.** Het [Statuut voor het Koninkrijk][ref10] geeft voor het gebruik
      van de zelfstandige maatregel van rijksbestuur specifieke ruimere mogelijkheden (zie de [artikelen 14][ref11] en
      [38 van het Statuut][ref12]).


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0001840
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel89
      [ref4]: https://wetten.overheid.nl/BWBR0001840
