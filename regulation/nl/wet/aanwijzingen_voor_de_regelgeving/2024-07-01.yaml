  - number: '4.29'
    text: |-
      Indien in een regeling normen van niet-publiekrechtelijke aard van toepassing worden verklaard, wordt, tenzij
      de kenbaarheid van deze normen voor alle betrokkenen voldoende verzekerd is, mededeling van de normen in de
      Staatscourant voorgeschreven. [Aanwijzing 4.28][ref1] is van overeenkomstige toepassing.


          **Toelichting**
          Onder ‘mededeling’ dient ingevolge de [Bekendmakingswet][ref2] te worden verstaan: plaatsing van de integrale
      tekst van de normen in de Staatscourant.
          Zie voor het al dan niet dwingend verwijzen naar normen van niet-publiekrechtelijke aard de toelichting bij
      [aanwijzing 3.48][ref3]. Bij dwingende verwijzing naar normen van niet-publiekrechtelijke aard dienen die normen
      kosteloos ter beschikking te worden gesteld. Zie [artikel 14a van de Bekendmakingswet][ref4]. In artikel 14a,
      vierde lid, is ook bepaald dat indien de mededeling van de normen niet is toegestaan en de kenbaarheid niet kan
      worden verzekerd – bijvoorbeeld omdat het auteursrecht daaraan in de weg staat en over de toegankelijkheid (nog)
      geen overeenkomst is gesloten of niet kan worden gesloten – eenieder op verzoek kosteloos inzage in deze normen
      wordt verleend, ten minste zolang deze normen van toepassing zijn verklaard. Als een dergelijke norm alleen via
      terinzagelegging kenbaar kan worden gemaakt, zal steeds een afweging dienen te worden gemaakt of tot het opleggen
      van die norm moet worden overgegaan. Zie ook de brief van de Minister van Economische Zaken, Landbouw en Innovatie
      van 30 juni 2011, (Kamerstukken II 2010/11, 27 406, nr. 193). Kosteloze terbeschikkingstelling is niet vereist
      indien de overheid zelf de enige normadressaat is.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0004287
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0004287#Artikel14a
