  - number: '2.48'
    text: |-
      1 Voor de kennisgeving van een besluit aan de daarbij betrokkenen waardoor het besluit zijn werking als
      rechtshandeling kan verkrijgen, wordt de term bekendmaking gebruikt.

      2 In de overige gevallen wordt de term mededeling gebruikt.


          **Toelichting**
          Het onderscheid tussen ‘bekendmaking’ en ‘mededeling’ is van belang met het oog op [afdeling 3.6 Awb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.6
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.6'
  - number: '3.1'
    text: |-
      Bepalingen worden beknopt geformuleerd.


          **Toelichting**
          Indien bij het ontwerpen van een bepaling een sluitende, maar ingewikkelde formulering is gevonden, dient
      steeds te worden nagegaan of het niet eenvoudiger kan. Ook dient men bedacht te zijn op het weglaten van overbodige
      woorden. Dus bijvoorbeeld niet ‘Het bepaalde in het tweede lid van artikel 5 is van toepassing’, maar ‘Artikel 5,
      tweede lid, is van toepassing’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.1
  - number: '3.2'
    text: |-
      Voorschriften worden niet met behulp van de werkwoorden ‘*moeten*’ of ‘*dienen*’ geformuleerd, tenzij dit
      onvermijdelijk is.


          **Toelichting**
          Dus bijvoorbeeld niet: ‘Het verzoekschrift dient te worden gemotiveerd’, maar: ‘Het verzoekschrift wordt
      gemotiveerd’. Deze aanwijzing heeft alleen betrekking op de formulering van voorschriften in de regeling zelf.
      Tegen gebruik van de woorden ‘moeten’ of ‘dienen’ in de toelichting bij een regeling bestaat geen bezwaar.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.2
  - number: '3.3'
    text: |-
      1 Het normale spraakgebruik wordt zoveel mogelijk gevolgd.

      2 Woorden waarvan de betekenis te weinig bepaald of onduidelijk is, worden niet gebruikt.


          **Toelichting**
          Zie ook [aanwijzing 5.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '3.4'
    text: |-
      Voor de terminologie van een uitvoeringsregeling wordt aangesloten bij die van de regeling waarop zij is gebaseerd.


          **Toelichting**
          Dit geldt ook voor de structuur van uitvoeringsregelingen: zie [aanwijzing 3.63][ref1]. Zie tevens de
      [aanwijzingen 2.34][ref2], [3.63][ref3] en [5.3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref4
        bwb_id: BWBR0005730
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '3.5'
    text: |-
      1 Voor de terminologie in nationale regelingen wordt in beginsel aangesloten bij die van verwante bindende EU-
      rechtshandelingen en internationale regelingen.

      2 Van het eerste lid kan worden afgeweken indien:

      a. de terminologie van de bindende EU-rechtshandelingen en internationale regelingen niet voldoende is
      gepreciseerd;

      b. daardoor beter wordt aangesloten bij elders in nationale regelingen gehanteerde terminologie; of

      c. dit beter Nederlands oplevert.


          **Toelichting**
          Deze aanwijzing is met name van belang voor implementatieregelingen. Aansluiting bij de terminologie
      van verwante EU- en internationale regelgeving kan worden bewerkstelligd door bepalingen daaruit in dezelfde
      bewoordingen over te nemen, door daarnaar te verwijzen of door een combinatie van deze mogelijkheden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.5
  - number: '3.6'
    text: |-
      De Woordenlijst Nederlandse Taal wordt gevolgd, tenzij woorden die uit vreemde talen afkomstig zijn of van vreemde
      talen zijn afgeleid, de bedoeling duidelijker weergeven dan Nederlandse woorden en in het spraakgebruik ingang
      hebben gevonden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 Hetzelfde begrip wordt niet met verschillende termen aangeduid.

      2 Dezelfde term wordt niet voor verschillende begrippen gebruikt.


          **Toelichting**
          Vooral binnen één regeling dient deze aanwijzing in acht te worden genomen. Ook bij verwante regelgeving is zij
      echter van belang. Zie ook [aanwijzing 3.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '3.8'
    text: |-
      1 Indien mogelijk worden persoonsaanduidingen gebruikt die sekseneutraal zijn.

      2 Combinaties van aanduidingen van mannen en vrouwen worden niet gebruikt.


          **Toelichting**
          **Eerste lid.** Gebruik bijvoorbeeld ‘verloskundige’ in plaats van ‘vroedvrouw’ en ‘degene die’ in plaats van
      ‘hij die’. Zie ook [aanwijzing 3.3, eerste lid][ref1].
          **Tweede lid.** Formuleringen als ‘werknemer/werkneemster’, ‘werknemer(-neemster)’ of ‘hij/zij die’ worden
      niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '3.9'
    text: |-
      Afkortingen worden alleen gebruikt indien dit redelijkerwijs niet te vermijden is. Bij gebruik ervan worden zij in
      de begripsbepalingen opgenomen.


          **Toelichting**
          Zie voor de aanduiding van valuta en meeteenheden de [aanwijzingen 3.21][ref1] en [3.22][ref2], voor de
      vermelding van vindplaatsen de [aanwijzingen 3.42 tot en met 3.46][ref3], voor het gebruik van afkortingen in
      een citeertitel [aanwijzing 4.25, eerste lid][ref4], en voor de verkorte aanhaling van regelingen of verdragen
      in toelichtingen de [aanwijzingen 3.34][ref5], [3.39][ref6], [4.24, derde lid][ref7], en [4.50][ref8]. Ook in
      opschriften van artikelen (zie [aanwijzing 3.57][ref9]) mogen afkortingen worden gebruikt, indien dat nodig is om
      het opschrift beknopt te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
