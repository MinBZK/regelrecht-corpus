        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '7.15'
    text: |-
      1 Indien in een wetsvoorstel of een ontwerp voor een algemene maatregel van bestuur waarover de Afdeling advisering
      van de Raad van State advies heeft uitgebracht, vóór de indiening, onderscheidenlijk de vaststelling, daarvan
      ingrijpende wijzigingen worden aangebracht die niet het gevolg zijn van het advies van de Afdeling advisering,
      wordt de Afdeling over deze wijzigingen gehoord.

      2 Indien in een ingediend wetsvoorstel door de regering ingrijpende wijzigingen worden aangebracht, wordt de
      Afdeling advisering over deze wijzigingen gehoord, tenzij dringende redenen zich daartegen verzetten.

      3 De [aanwijzingen 7.9, eerste lid][ref1], en [7.10 tot en met 7.14][ref2] zijn van overeenkomstige toepassing op
      de advisering over een nota van wijziging.


          **Toelichting**
          Of een wijziging als ingrijpend moet worden aangemerkt, zal van geval tot geval, mede in het licht van het doel
      van de advisering door de Afdeling advisering, moeten worden beoordeeld. Ook wijzigingen op onderdelen kunnen van
      een zodanig groot belang zijn, dat het geboden is de Afdeling advisering daarover te raadplegen. Een splitsing van
      een wetsvoorstel (bijvoorbeeld om controversiële en niet-controversiële gedeelten te scheiden) of een samenvoeging
      van twee wetsvoorstellen die nauw samenhangen, zonder dat daaruit inhoudelijk wijzigingen voortvloeien, is op
      zichzelf nog niet als een ingrijpende wijziging te beschouwen.
          Ingevolge [artikel 4 van het reglement van orde voor de ministerraad][ref3] beraadslaagt de ministerraad
      opnieuw over een wetsvoorstel of ontwerp voor een algemene maatregel van bestuur, indien dit belangrijk is
      gewijzigd. De ministerraad beslist over een hernieuwde raadpleging van de Afdeling advisering. Ook in geval van
      twijfel over de ingrijpendheid van een wijziging neemt de ministerraad een beslissing.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0006501#Artikel4
