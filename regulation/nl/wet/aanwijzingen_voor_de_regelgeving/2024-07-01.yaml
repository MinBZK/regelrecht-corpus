      1 Verwijzing naar parlementaire stukken geschiedt overeenkomstig de volgende voorbeelden:

      − *Kamerstukken II 2009/10, 27858, nr. 88, p. 3;*

      − *Kamerstukken I 2008/09, 31700 VI, D, p. 4*;

      − *Handelingen II 2007/08, nr. 108, p. 7909–7943 (tot en met 31 december 2010);*

      − *Handelingen II 2010/11, nr. 108, item 5, p. 25–36 (vanaf 1 januari 2011);*

      − *Aanhangsel Handelingen I 2014/15, nr. 12.*

      2 Verwijzing naar een wetsvoorstel geschiedt overeenkomstig de volgende voorbeelden:

      − *het bij koninklijke boodschap van 8 mei 2009 ingediende voorstel van wet tot wijziging van de Meststoffenwet
      (differentiatie fosfaatgebruiksnorm) (Kamerstukken 31945);*

      − *het bij geleidende brief van 13 september 2016 aanhangig gemaakte voorstel van wet van de leden Siderius en Van
      Meenen tot wijziging van de Wet op het primair onderwijs ter bevordering van kleinere klassen in het basisonderwijs
      (Kamerstukken 34538).*


          **Toelichting**
          **Eerste lid.**Stukken afkomstig van de Tweede Kamer worden genummerd met behulp van het vijfcijferige
      Kamerstuknummer (het ‘vetnummer’), gevolgd door een ondernummer: ‘Kamerstukken II 2009/10, 32217, nr. 2’. Bij
      stukken afkomstig van de Eerste Kamer wordt in plaats van een ondernummer een letter gebruikt: ‘Kamerstukken I
      2009/10, 32217, A’.
          Bij verwijzing naar de Handelingen wordt het vergadernummer apart vermeld (in het gegeven voorbeeld nr.
      108) en niet als onderdeel van het paginanummer zoals in de Handelingen zelf. Voor 1 januari 2011 werd voor de
      Handelingen een gedurende het vergaderjaar doorlopende paginanummering gebruikt. Sinds 2011 wordt per behandeld
      item een afzonderlijke publicatie opgemaakt en begint de paginanummering elke vergadering telkens met 1. De gegeven
      voorbeelden zien op de oude en de nieuwe situatie.
          **Tweede lid.** Indien naar een wetsvoorstel wordt verwezen, zoals in de [aanwijzingen 4.22][ref1],
      [5.68][ref2], en [6.34][ref3] het geval is, kan het onwenselijk zijn de in het eerste lid genoemde formulering
      te gebruiken, bijvoorbeeld omdat de verwijzing betrekking heeft op een artikel dat bij amendement of nota van
      wijziging in het wetsvoorstel is opgenomen. Door alleen gebruik te maken van het vijfcijferige Kamerstuknummer
      wordt de verwijzing dynamisch gemaakt en heeft de verwijzing betrekking op de meest actuele versie van het
      wetsvoorstel.


