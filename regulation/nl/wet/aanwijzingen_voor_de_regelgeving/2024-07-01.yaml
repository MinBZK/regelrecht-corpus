  - number: '4.45'
    text: |-
      1 Indien een wetsvoorstel financiële gevolgen heeft, wordt in een afzonderlijk onderdeel van de memorie van
      toelichting of in een bijlage bij de memorie van toelichting aangegeven in welke omvang daaraan hogere of lagere
      uitgaven of ontvangsten verbonden zullen zijn.

      2 In het in het eerste lid bedoelde overzicht wordt een onderscheid gemaakt tussen gevolgen voor het Rijk en
      gevolgen voor andere maatschappelijke sectoren.

      3 In de memorie van toelichting wordt tevens aangegeven of en zo ja, in hoeverre de financiële gevolgen begrepen
      zijn in de laatst ingediende begroting of in de ramingen voor de vier op het begrotingsjaar volgende jaren.

      4 Indien op grond van compenserende maatregelen per saldo geen budgettair effect te verwachten valt, worden in de
      memorie van toelichting ook de bruto financiële gevolgen van een wetsvoorstel vermeld.

      5 Indien een wetsvoorstel geen financiële gevolgen heeft, blijkt dit uitdrukkelijk uit de memorie van toelichting.

      6 Indien een algemene maatregel van bestuur of een ministeriële regeling leidt tot financiële gevolgen voor het
      Rijk, wordt daaraan zo nodig in de (nota van) toelichting aandacht geschonken.


          **Toelichting**
          Deze aanwijzing ziet op de in [artikel 3.1 van de Comptabiliteitswet 2016][ref1] neergelegde verplichting
      inzake het verschaffen van financiële informatie bij wetgeving. Ook op het aanbiedingsformulier voor de
      (rijks)ministerraad, de onderraad of het ambtelijke voorportaal dienen de gevolgen voor de rijksbegroting
      inzichtelijk te worden gemaakt.
          **Eerste lid.** Bij omvangrijke overzichten kan ervoor worden gekozen om de financiële gevolgen van een
      wetsvoorstel niet in een afzonderlijk onderdeel van de memorie van toelichting, maar in een bijlage op te nemen.
          **Tweede lid.** De financiële gevolgen voor het Rijk worden aan de hand van de rijksbegroting inzichtelijk
      gemaakt. Bijvoorbeeld door aan te geven ten laste van welke begroting of beleidsartikel uit de begroting de
      financiële gevolgen komen.
          Bij ‘andere maatschappelijke sectoren’ valt te denken aan burgers, het bedrijfsleven en professionals. De
      financiële gevolgen voor die sectoren zullen doorgaans door middel van regeldrukkosten worden uitgedrukt. Zie ook
      de onderdelen 4 (Wat zijn de gevolgen van deze opties?) en 5 (Wat is de voorkeursoptie?) van het Beleidskompas. Zie
      voor de toetsing op regeldruk [aanwijzing 7.5a][ref2].
          **Derde lid.** Dit komt overeen met het begrotingsjaar vanaf wanneer de financiële gevolgen optreden dat tevens
      op het aanbiedingsformulier voor de (rijks)ministerraad, de onderraad of het ambtelijke voorportaal wordt ingevuld.
          **Zesde lid.** Het aangeven van de financiële gevolgen van een algemene maatregel van bestuur of een
      ministeriële regeling is niet nodig indien deze al volledig zijn behandeld bij de totstandkoming van de delegerende
      wet of algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
