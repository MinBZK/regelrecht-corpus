  - number: '5.28'
    text: |-
      1 Voor zover een regeling die niet strekt tot implementatie van bindende EU-rechtshandelingen, eisen stelt aan
      goederen, keuringen of diensten, wordt tevens een clausule van wederzijdse erkenning opgenomen.

      2 Het eerste lid is niet van toepassing op regelingen die uitsluitend gelden in Bonaire, Sint Eustatius en Saba.

      3 Voor een clausule van wederzijdse erkenning worden de volgende modellen als uitgangspunt genomen:

      *(Goederen)*

      *Met [aanduiding van de desbetreffende goederen] als bedoeld in [deze wet / dit besluit / deze regeling] worden
      gelijkgesteld [desbetreffende goederen] die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere
      lidstaat van de Europese Unie of in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij
      een tot een douane-unie strekkend Verdrag, dan wel rechtmatig zijn vervaardigd in een staat die partij is bij een
      tot een vrijhandelszone strekkend Verdrag dat Nederland bindt, en die voldoen aan eisen die een beschermingsniveau
      bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.*

      *(Keuringen)*

      *Met een [aanduiding van het desbetreffende document] als bedoeld in [deze wet / dit besluit / deze regeling] wordt
      gelijkgesteld een verklaring van goedkeuring, afgegeven door een onafhankelijke keuringsinstelling in een andere
      lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, welke verklaring is afgegeven op
      basis van onderzoekingen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met
      de nationale onderzoekingen wordt nagestreefd.*

      *(Diensten)*

      *Met de beroepseisen ter zake van [aanduiding van de desbetreffende dienst] als bedoeld in [deze wet / dit
      besluit / deze regeling] worden gelijkgesteld beroepseisen die worden gesteld in een andere lidstaat van de
      Europese Unie dan wel een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe
      strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die een beroepsniveau waarborgen dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.*


          **Toelichting**
          Het vrij goederen- en dienstenverkeer in de EU brengt mee dat lidstaten goederen, diensten of keuringen,
      die in een andere lidstaat rechtmatig in het verkeer zijn gebracht respectievelijk worden verricht, niet
      mogen weigeren omdat ze niet voldoen aan de eigen nationale voorschriften ter zake. Dit wordt het beginsel
      van wederzijdse erkenning genoemd. Het beginsel houdt in dat goederen en diensten die weliswaar niet identiek
      zijn aan de eigen nationale goederen en diensten, maar die wél aan buitenlandse eisen voldoen die een ten
      minste gelijkwaardig beschermingsniveau bieden, moeten worden toegelaten. Wanneer aan de toelating een keuring
      voorafgaat, geldt dat keuringen die op basis van gelijkwaardige buitenlandse onderzoeken zijn verricht, moeten
      worden erkend. Wanneer voor de dienstverrichting een bepaald beroepsniveau is vereist, geldt dat gelijkwaardige
      buitenlandse beroepseisen moeten worden erkend. Voor de erkenning van beroepskwalificaties is [Richtlijn
      2005/36/EG](32005L0036) van het Europees Parlement en de Raad van 7 september 2005 betreffende de erkenning van
      beroepskwalificaties relevant, zoals omgezet in de [Algemene wet erkenning EU-beroepskwalificaties][ref1]. Indien
      deze richtlijn van toepassing is, wordt niet een clausule van wederzijdse erkenning opgenomen, maar wordt in de
      regeling waarin een beroepskwalificatie wordt geëist deze gelijkgesteld met een afgegeven erkenning als bedoeld
      in [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref2]. Voor de uitvoering van het beginsel
      van wederzijdse erkenning op het terrein van goederen bevat [Verordening (EG) nr. 764/2008](32008R0764) van het
      Europees Parlement en de Raad van 9 juli 2008 tot vaststelling van procedures voor de toepassing van bepaalde
      nationale technische voorschriften op goederen die in een andere lidstaat rechtmatig in de handel zijn gebracht, en
      tot intrekking van Beschikking nr. 3052/95/EG specifieke procedures.
          Een lidstaat kan, uit een oogpunt van bescherming van gerechtvaardigde belangen zoals de volksgezondheid,
      de belangen van de consument, openbare orde of openbare veiligheid, eisen stellen aan goederen, keuringen of
      dienstverlening (de artikelen 36 en 52 VWEU; HvJ zaak 120/78, Cassis de Dijon, ECLI:EU:C:1979:42). Om te bevorderen
      dat ook gelijkwaardige buitenlandse goederen, diensten en keuringen op het nationale grondgebied worden toegelaten,
      moet volgens de rechtspraak van het Hof van Justitie EU in een regeling die eisen stelt aan goederen, keuringen
      of dienstverlening tevens een clausule van wederzijdse erkenning worden opgenomen (HvJ zaken C-184/96, Foie gras,
      ECLI:EU:C:1998:495, en C-355/98, Commissie/België, ECLI:EU:C:2000:113). Naar zijn aard geldt deze verplichting
      alleen voor zover het gaat om autonome nationale regelgeving en niet bij implementatieregelgeving naar aanleiding
      van bindende EU-rechtshandelingen. Voor zover er geharmoniseerd is, worden (binnen- en buitenlandse) producten
      en diensten immers aan de hand van uniforme EU-eisen beoordeeld. Zie [aanwijzing 9.1][ref3] voor hetgeen onder
      implementatie van bindende EU-rechtshandelingen moet worden verstaan.
          Slechts wanneer het uit een oogpunt van bescherming van gerechtvaardigde belangen, zoals de openbare orde of
      openbare veiligheid, onwenselijk is om gelijkwaardige buitenlandse goederen, diensten of keuringen op het nationale
      grondgebied toe te laten, kan een clausule van wederzijdse erkenning achterwege worden gelaten. Hetzelfde geldt
      wanneer er naar zijn aard (bij een totaalverbod) geen gelijkwaardige buitenlandse eisen bestaan.
          Gevolg van het achterwege laten van een clausule van wederzijdse erkenning is, dat buitenlandse goederen,
      diensten of keuringen aan de (extra) nationale eisen moeten voldoen, hetgeen een potentiële handelsbelemmering
      oplevert. Het verdient derhalve aanbeveling terughoudend met deze uitzondering om te gaan. Tevens verdient
      het aanbeveling om in de toelichting bij een regeling waarin geen clausule inzake wederzijdse erkenning wordt
      opgenomen, aandacht te besteden aan de overwegingen die hiertoe hebben geleid. Indien de Dienstenrichtlijn van
      toepassing is, zijn de mogelijkheden tot het stellen van regels verder ingeperkt (zie de [aanwijzingen 5.29][ref4]
      en [5.30][ref5]). Zie verder [paragraaf 7.2][ref6] over het notificeren van eisen aan goederen en diensten.
          In een aantal verdragen met niet-lidstaten wordt het bovenomschreven regime uitgebreid tot andere staten. Het
      belangrijkste voorbeeld hiervan is de Overeenkomst inzake de Europese Economische Ruimte. Wat goederen betreft,
      dient een onderscheid gemaakt te worden tussen niet-lidstaten waarmee de EU een douane-unie vormt en niet-
      lidstaten waarmee de EU een vrijhandelszone vormt. Bij een douane-unie geldt de wederzijdse erkenning zowel voor
      goederen die rechtmatig in de niet-lidstaat zijn vervaardigd als voor goederen die rechtmatig in het verkeer
      zijn gebracht in de desbetreffende niet-lidstaat. Bij een vrijhandelszone is de wederzijdse erkenning beperkt
      tot goederen die rechtmatig in de desbetreffende niet-lidstaat zijn vervaardigd. In dat laatste geval dient de
      passage ‘of in de handel zijn gebracht’ achterwege te worden gelaten. Het verdient aanbeveling om in de memorie
      van toelichting de landen op te sommen die het betreft. Ook sluit de Europese Unie verdragen op dit terrein die
      Nederland binden, zonder dat het Koninkrijk als zodanig partij is. In dat geval is Nederland op grond van het
      Europese recht aan het desbetreffende verdrag gebonden. Het model beoogt ook mede deze verdragen te omvatten.
      [Aanwijzing 8.1, derde lid][ref7], is op deze situatie niet van toepassing.
          **Tweede lid.**In regelingen die uitsluitend gelden in Bonaire, Sint Eustatius en Saba behoeft geen clausule
      van wederzijdse erkenning te worden opgenomen. Dit houdt verband met het feit dat deze eilanden geen deel uitmaken
      van de Europese Unie, maar onder de Associatieregeling van de landen en gebieden overzee (LGO) vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0023066
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref6]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
      [ref7]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.28
