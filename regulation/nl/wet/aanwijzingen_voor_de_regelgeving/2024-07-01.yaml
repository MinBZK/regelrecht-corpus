  - number: '6.9'
    text: |-
      1 Vervanging van een tekst in een regeling wordt vormgegeven met de uitdrukking ‘*wordt vervangen door*’ of, voor
      zover dit taalkundig mogelijk is, met de uitdrukking ‘*komt te luiden:*’.

      2 Bij de vervanging van woorden of zinsneden wordt zowel de te vervangen tekst als de nieuwe tekst tussen
      aanhalingstekens geplaatst.

      3 Indien een artikel of onderdeel daarvan wordt vervangen, begint de nieuwe tekst met de aanduiding van het artikel
      of het onderdeel.


          **Toelichting**
          Voor het vaststellen van de tekst van een nieuw artikel, lid of onderdeel of een nieuw hoofdstuk of nieuwe
      paragraaf wordt in beginsel gebruik gemaakt van de formulering ‘komt te luiden:’. Uit taalkundig oogpunt komt bij
      vervanging van een of meer woorden alleen de uitdrukking ‘wordt vervangen door’ in aanmerking. Dit is ook het geval
      als bijvoorbeeld één artikel door twee of meer artikelen wordt vervangen. In dat geval kan gebruik worden gemaakt
      van de formulering ‘wordt vervangen door [aantal] artikelen, luidende:’ of van de formulering ‘wordt vervangen door
      de volgende artikelen:’. Zie ook [aanwijzing 6.18][ref1].
          Zie [aanwijzing 3.30, tweede lid][ref2], voor het aanhalen van een zinsnede met gebruik van haakjes.
          **Tweede lid.**Dit lid geldt alleen voor tekstgedeelten die geen zelfstandig regelingselement (bijvoorbeeld een
      artikel, lid of onderdeel) zijn en die ook geen volledige zin vormen.
          Bij de vervanging van een regelingselement of een gehele zin wordt de te vervangen tekst aangeduid door naar
      het desbetreffende regelingselement of de desbetreffende zin te verwijzen (bijvoorbeeld ‘artikel 5, derde lid’ of
      ‘eerste lid, tweede zin’) en wordt de tekst die na de dubbele punt van de wijzigingsopdracht (‘komt te luiden:’ of
      ‘wordt vervangen door:’) volgt niet tussen aanhalingstekens geplaatst.
          Zie ook de [aanwijzingen 6.11, tweede lid][ref3], en [6.12, tweede lid][ref4], voor het gebruik van
      aanhalingstekens bij het in- of toevoegen van tekstgedeelten of het laten vervallen daarvan.

          Artikel 7 komt te luiden: **Artikel 7** Regels over snelheidsbegrenzingen kunnen slechts worden gesteld bij of
      krachtens algemene maatregel van bestuur.
      Artikel 8 wordt vervangen door twee artikelen, luidende: **Artikel 8** (...) **Artikel 8a** (...)
      Artikel 18, derde lid, komt te luiden: De deskundigen worden aangewezen door Onze Minister.
      In artikel 5, derde lid, wordt ‘Omroepraad’ vervangen door ‘Mediaraad’.
      In artikel 28 wordt ‘gebeurtenis’ vervangen door ‘ontwikkeling’ en wordt ‘andere gebeurtenissen’ vervangen door
      ‘andere ontwikkelingen’.
      In artikel 14 wordt ‘Het vonnis bevat (...) of een combinatie daarvan’ vervangen door ‘Het vonnis vermeldt of de
      taakstraf bestaat uit een werkstraf, een leerstraf of een combinatie van beide’.
      In artikel 32 wordt ‘meldt het voornemen daartoe aan’ vervangen door ‘stelt de Autoriteit Financiële Markten
      schriftelijk in kennis van haar voornemen daartoe, volgens de procedure uit artikel 34a. Zij zendt een afschrift
      aan’.


