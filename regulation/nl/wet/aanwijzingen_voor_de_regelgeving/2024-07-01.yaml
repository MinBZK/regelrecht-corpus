  - number: '5.33'
    text: |-
      Bij het opnemen in een regeling van bepalingen over de verwerking van persoonsgegevens bevat de regeling een
      welbepaalde en uitdrukkelijke omschrijving van de doeleinden van de gegevensverwerking en bevat de toelichting een
      expliciete afweging van de belangen van verwerkingsverantwoordelijken en betrokkenen in relatie tot die doeleinden.
          **Toelichting**
          Een regeling waarin de verwerking van persoonsgegevens een belangrijke plaats inneemt, bevat ter uitvoering van
      de artikelen 5 en 6, eerste lid, van de Algemene verordening gegevensbescherming een welbepaalde en uitdrukkelijke
      omschrijving van de doeleinden van de gegevensverwerking. Die doeleinden dienen ook gerechtvaardigd te zijn.
      Bij het ontwerpen van een dergelijke regeling wordt daarom ook altijd een afweging gemaakt tussen de belangen,
      gemoeid met de verwerking van persoonsgegevens en het belang van de bescherming van die gegevens. Zie in dit
      verband ook [aanwijzing 4.43, onderdeel d][ref1]. Het internationaalrechtelijke en Europeesrechtelijke kader en de
      Grondwet worden bij de belangenafweging in acht genomen. Daarnaast vereist de afstemming van bijzondere wettelijke
      regelingen op de Algemene verordening gegevensbescherming, mede met het oog op het legaliteitsbeginsel, specifieke
      aandacht. De verwerking van bijzondere categorieën van persoonsgegevens is ingevolge artikel 9, eerste lid, van de
      Algemene verordening gegevensbescherming in beginsel verboden. Indien de Algemene verordening gegevensbescherming
      en de [Uitvoeringswet Algemene verordening gegevensbescherming][ref2] niet voorzien in een uitdrukkelijke
      uitzondering op dat verbod zal daarvoor in beginsel op het niveau van de formele wet een regeling moeten worden
      getroffen.
          De bepalingen van de Algemene verordening gegevensbescherming inzake onder meer de beginselen voor de
      verwerking van persoonsgegevens, de rechtsgrondslagen voor verwerking en verdere verwerking, en de verwerking
      van bijzondere persoonsgegevens gelden rechtstreeks. De algemene beginselen voor rechtmatige gegevensverwerking
      volgen uit artikel 5 van de verordening en worden in de daarop volgende artikelen verder uitgewerkt. Het
      eerste lid van artikel 6 van de verordening somt limitatief de rechtsgrondslagen op waarop een verwerking van
      persoonsgegevens moet zijn gebaseerd. Voor overheidsinstanties zijn vooral de grondslagen ‘noodzakelijk om te
      voldoen aan een wettelijke plicht die op de verwerkingsverantwoordelijke rust’ en ‘noodzakelijk voor de vervulling
      van een taak van algemeen belang of een taak in het kader van de uitoefening van openbaar gezag dat aan de
      verwerkingsverantwoordelijke is opgedragen’ relevant. Wil een overheidsinstantie zich op de laatste rechtsgrond
      kunnen beroepen dan dient in de wettelijke regeling haar taak voldoende duidelijk te zijn omschreven en tevens
      die gegevensverwerking logischerwijs en voorzienbaar noodzakelijk te zijn voor het vervullen van die taak. Bij
      het opstellen van regelingen mogen geen bepalingen worden opgenomen die een juiste toepassing en verwezenlijking
      van de werking van de verordening en, voor zover van toepassing, [Richtlijn (EU) 2016/680](32016L0680) van het
      Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming van natuurlijke personen in verband
      met de verwerking van persoonsgegevens door bevoegde autoriteiten met het oog op de voorkoming, het onderzoek,
      de opsporing en de vervolging van strafbare feiten of de tenuitvoerlegging van straffen, en betreffende het vrije
      verkeer van die gegevens en tot intrekking van Kaderbesluit 2008/977/JBZ van de Raad in gevaar kunnen brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0040940
