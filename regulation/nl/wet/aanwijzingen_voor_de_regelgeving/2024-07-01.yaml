  - number: '9.13'
    text: |-
      Indien een bindende EU-rechtshandeling implementatie behoeft en aan deze verplichting reeds uitvoering wordt
      gegeven door middel van bestaand recht, doet de eerstverantwoordelijke bewindspersoon onverwijld na het van kracht
      worden van de desbetreffende bindende EU-rechtshandeling mededeling in de Staatscourant van:

      a. de te implementeren bindende EU-rechtshandeling;

      b. de bestaande nationale regelingen door middel waarvan reeds aan de te implementeren bindende EU-rechtshandeling
      wordt voldaan;

      c. de datum met ingang waarvan de te implementeren regeling in de Nederlandse rechtsorde van toepassing is dan wel
      vanaf welk tijdstip wijzigingen van de desbetreffende bepalingen van de bindende EU-rechtshandeling doorwerken in
      het Nederlandse recht;

      d. de in [aanwijzing 9.12][ref1] bedoelde transponeringstabel.


          **Toelichting**
          Deze aanwijzing ziet op het geval dat de nationale wet- en regelgeving reeds in overeenstemming is met de te
      implementeren bindende EU-rechtshandeling. Ook in dat geval is een expliciete handeling nodig om te voldoen aan
      de standaardbepaling in een richtlijn dat wanneer lidstaten bepalingen aannemen ter implementatie daarvan, in die
      bepalingen zelf of bij de officiële bekendmaking daarvan naar de richtlijn moet worden verwezen. Daarbij vallen
      twee situaties te onderscheiden:
          Het bestaande recht voldoet aan de implementatieverplichting dankzij een eerder in de regelgeving opgenomen
      dynamische verwijzing die de nieuw te implementeren bindende EU-rechtshandeling dekt (zie [aanwijzing 9.10][ref2]).
      In dit geval treedt een materiële wijziging van het geldende recht op, omdat de achterliggende norm inhoudelijk
      is gewijzigd. Omwille van de kenbaarheid van het geldende recht is het wenselijk dat hier steeds melding van wordt
      gemaakt in de Staatscourant. Hiermee wordt tevens invulling gegeven aan het in EU-richtlijnen opgenomen voorschrift
      dat naar de geïmplementeerde richtlijn wordt verwezen in de nationale uitvoeringsbepalingen of bij de officiële
      bekendmaking van die bepalingen, op een wijze die door de lidstaten wordt vastgesteld.
      Het bestaande recht voldoet aan de implementatieverplichting doordat het anders dan door dynamische verwijzing
      inhoudelijk voldoet aan de door de bindende EU-rechtshandeling gecreëerde implementatieverplichting. In dit
      geval is, in tegenstelling tot het hierbovengestelde onder a, juist geen sprake van wijziging van het materiële
      recht. Wel is het, omwille van de doorzichtigheid van het stelsel van nationale regelgeving en bindende EU-
      rechtshandelingen en ter voldoening aan de plicht tot verwijzing naar de richtlijn, van belang dat het
      implementerende karakter van die nationale bepaling wordt bekendgesteld.
          De mededeling in de Staatscourant dient als implementatiemiddel genotificeerd te worden aan de Europese
      Commissie. Zoals in de toelichting bij [aanwijzing 9.10, derde lid][ref3], is aangegeven, wordt in voorkomend
      geval de bekendmaking van het daar bedoelde besluit tot vaststelling van een ingangsdatum van de geldingsdatum
      gecombineerd met de in deze aanwijzing bedoelde mededelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
