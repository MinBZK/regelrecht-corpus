    text: |-
      1 In een bijzondere wet worden in beginsel geen bepalingen over bestuursrechtelijke rechtsbescherming opgenomen.

      2 Naast de bestaande gerechten worden geen nieuwe organen met bestuursrechtspraak belast.


          **Toelichting**
          **Eerste lid.** In beginsel wordt volstaan met het in de [Algemene wet bestuursrecht][ref1] (Awb) en
      de [Wet administratieve rechtspraak BES][ref2] (WarBES) neergelegde stelsel van rechtsbescherming (zie ook
      [aanwijzing 2.46][ref3]). Uit de [Awb][ref4] volgt dat, als een bijzondere wet aan een bestuursorgaan de
      bevoegdheid toekent besluiten te nemen, tegen een dergelijk besluit in beginsel bezwaar, beroep en hoger beroep
      openstaan. De [WarBES][ref5] bevat een vergelijkbare regeling, zij het dat de [WarBES][ref6] uitgaat van het
      begrip ‘beschikking’ in plaats van ‘besluit’. Een ander verschil met de [Awb][ref7] is dat de [WarBES][ref8]
      een facultatieve bezwaarschriftprocedure kent: belanghebbenden kunnen de bezwaarfase desgewenst overslaan en
      rechtstreeks beroep instellen.
          Uit het eerste lid volgt ook dat in beginsel voor alle belanghebbenden dezelfde beroepsmogelijkheden
      dienen open te staan, en dat tegen feitelijke handelingen in beginsel geen beroep bij een bestuursrechter wordt
      opengesteld.
          Een aantal uitzonderingen op het algemene bestuursprocesrecht van de [Awb][ref9] is opgenomen in drie bijlagen
      bij die wet, zie [aanwijzing 5.49][ref10]. De [WarBES][ref11] kent geen bijlagen met uitzonderingen. Indien het
      nodig is om een uitzondering op de [WarBES][ref12] te maken, wordt dat in de bijzondere wet geregeld.
          **Rijkswetten.** Voor rijkswetgeving geldt dat voor de rechtsbescherming in beginsel wordt aangesloten bij
      de rechtsregels van het land waar een bestuursorgaan zijn zetel heeft. Zo is op besluiten van een Nederlands
      bestuursorgaan dat met de uitvoering van rijkswetgeving is belast, in beginsel de [Awb][ref13] (of de
      [WarBES][ref14]) van toepassing, en op besluiten van bijvoorbeeld een Arubaans bestuursorgaan de Landsverordening
      administratieve rechtspraak.


