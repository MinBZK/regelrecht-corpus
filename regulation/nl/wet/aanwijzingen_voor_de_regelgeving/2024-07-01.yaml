  - number: '6.24'
    text: |-
      1 Bij de gehele of gedeeltelijke intrekking van een regeling wordt mede ingetrokken de op deze regeling of het in
      te trekken gedeelte daarvan gebaseerde uitvoeringsregelgeving, tenzij voor die regelgeving een andere grondslag
      bestaat of specifiek bij die gelegenheid tot stand wordt gebracht.

      2 De intrekking kan geschieden in de regeling die strekt tot het geheel of gedeeltelijk intrekken van de
      delegerende regeling.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op het laten vervallen van bepalingen in een
      uitvoeringsregeling in verband met het vervallen van de grondslag daarvan.


          **Toelichting**
          **Eerste lid.** Door het intrekken van een delegerende regeling vervalt de rechtsgrondslag aan
      uitvoeringsregelingen die daarop gebaseerd zijn en kunnen die regelingen niet langer effect hebben. In het
      verleden werd daarom in bepaalde gevallen volstaan met de mededeling in de toelichting dat door het vervallen
      van de delegatiegrondslag de uitvoeringsregelingen van rechtswege zijn vervallen. Deze werkwijze kan echter tot
      onduidelijkheden leiden omdat de actuele grondslag van een uitvoeringsregeling niet altijd evident is. Ingevolge
      [aanwijzing 6.8, eerste lid][ref1], kan deze uitvoeringsregeling bijvoorbeeld een andere grondslag hebben
      gekregen of krijgen met de intrekkingsregeling, zonder dat dit uit de uitvoeringsregeling als zodanig blijkt.
      Om onduidelijkheid over de juridische status van uitvoeringsregelingen te voorkomen, is het daarom wenselijk de
      intrekking expliciet te regelen. Dit betekent overigens niet dat uit het feit dat een regeling niet expliciet is
      ingetrokken, a contrario kan worden afgeleid dat de regeling nog steeds zou gelden. Bepalend voor de geldigheid van
      een uitvoeringsregeling is of voor die regeling een rechtsgrondslag in een hogere regeling bestaat.
          **Tweede lid.** Vanuit het oogpunt van wetgevingsefficiëntie kan het in de rede liggen de intrekking te regelen
      in de regeling die strekt tot het geheel of gedeeltelijk intrekken van de regeling waarop de uitvoeringsregeling
      is gebaseerd. Hiermee maakt de wetgever expliciet de keuze de regeling ofwel te voorzien van een nieuwe grondslag
      overeenkomstig [aanwijzing 6.8][ref2], ofwel in te trekken. Indien een uitvoeringsregeling niet op deze wijze
      wordt ingetrokken, maar nadien alsnog separaat wordt ingetrokken, kan de bepaling waarbij de delegerende regeling
      indertijd is ingetrokken als grondslag voor de intrekking van de uitvoeringsregeling worden gebruikt.
          **Derde lid.** Ook bij het gedeeltelijk vervallen van de grondslag van een uitvoeringregeling geldt dat
      expliciete vervallenverklaring van de daardoor geraakte bepalingen in die regeling wenselijk is. Dit kan eveneens
      plaatsvinden door middel van de regeling die strekt tot de gehele of gedeeltelijke intrekking van de delegerende
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
