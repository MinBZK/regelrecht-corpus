        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: '3.62'
    text: |-
      1 Een bijlage bij een regeling wordt voorzien van een opschrift waarin is vermeld bij welk artikel van de regeling
      de bijlage hoort, tenzij dit door het grote aantal artikelen niet doelmatig is.

      2 Indien dit voor de toegankelijkheid van een bijlage van belang is, wordt in het opschrift de inhoud van de
      bijlage beknopt aangeduid.


          **Toelichting**
          **Eerste lid.** Indien een bijlage aan een bestaande regeling wordt toegevoegd of een bestaande bijlage bij
      een regeling wordt vervangen, wordt de nieuwe bijlage vaak als bijlage bij een wijzigingsregeling opgenomen. In
      dat geval krijgt die bijlage bij de wijzigingsregeling ingevolge deze aanwijzing een ‘dubbel’ opschrift: eerst
      wordt aangegeven bij welk artikel (en onderdeel) van de wijzigingsregeling de bijlage hoort, vervolgens wordt de
      integrale tekst van de nieuwe bijlage opgenomen, inclusief het opschrift waarin is vermeld bij welk artikel van de
      te wijzigen regeling de nieuwe bijlage gaat horen.
          Zie voor bijlagen die bekend worden gemaakt door middel van een ander algemeen toegankelijk elektronisch medium
      dan het Staatsblad of de Staatscourant ook [aanwijzing 4.32][ref1].

          [Waterwet][ref2]: **Bijlage I. Dijkringen en primaire waterkeringen als bedoeld in artikel 1.3, eerste lid**
      [Regeling veiligheid zeeschepen][ref3]: **Bijlage 5. Medische uitrusting** *(bijlage als bedoeld in de artikelen 25
      en 49 van de Regeling veiligheid zeeschepen)*


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0025458
      [ref3]: https://wetten.overheid.nl/BWBR0017728
