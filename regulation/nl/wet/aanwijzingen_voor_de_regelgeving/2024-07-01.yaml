  - number: '2.45'
    text: |-
      1 In gevallen waarin soortgelijke onderwerpen worden geregeld, wordt gestreefd naar harmonisatie van regelgeving.

      2 Bij wijziging van een regeling wordt nagegaan welke wijzigingen uit een oogpunt van harmonisatie kunnen worden
      meegenomen.


          **Toelichting**
          **Eerste lid.**Harmonisatie verdient des te meer aandacht indien het gaat om onderwerpen binnen één
      beleidsterrein. Indien het gaat om binnen één regeling geregelde onderwerpen, is harmonisatie in ieder geval
      geboden. Overigens mag harmonisatie uiteraard niet aan het doorvoeren van wenselijke vernieuwingen in de weg staan.
          **Tweede lid.** Wijziging van een regeling kan soms een goede aanleiding zijn om gelijktijdig de regeling
      zoveel mogelijk naar vorm en inhoud met vergelijkbare regelingen in overeenstemming te brengen. In dergelijke
      gevallen zal noodzakelijkerwijs de wens van harmonisatie wel moeten worden afgewogen tegen de wetgevingslasten en
      het tijdsbeslag die met de harmonisatie gemoeid zijn. In verband met de implementatietermijnen van EU-richtlijnen
      zal het vaak niet wenselijk zijn aan de implementatie van een EU-richtlijn in de Nederlandse wetgeving wijzigingen
      uit een oogpunt van harmonisatie te koppelen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.45
  - number: '2.46'
    text: |-
      1 In bijzondere wetten wordt alleen afgeweken van algemene wetten, indien dit noodzakelijk is. De afwijking
      wordt in de bijzondere wet opgenomen en als zodanig benoemd, tenzij uit de algemene wet volgt dat de afwijking
      in de algemene wet moet worden opgenomen. Een afwijking wordt in de memorie van toelichting bij de bijzondere wet
      gemotiveerd.

      2 Het eerste lid is van overeenkomstige toepassing op aanvullingen in bijzondere wetten op een regeling in een
      algemene wet die uitputtend is bedoeld.


          **Toelichting**
          **Eerste lid.** Met algemene wetten worden bedoeld wetten die algemene regels voor een rechtsgebied of een
      deelterrein daarvan geven. Bij algemene wetten voor een rechtsgebied valt in ieder geval te denken aan:
          de wetboeken (wetten waarvan het woord wetboek deel uitmaakt van hun titel)
      de [Algemene termijnenwet][ref1]
      de [Algemene wet bestuursrecht][ref2]
      de [Bekendmakingswet][ref3]
      de [Gemeentewet][ref4]
      de [Provinciewet][ref5]
      de [Waterschapswet][ref6]
      de [Kaderwet adviescolleges][ref7]
      de [Kaderwet zelfstandige bestuursorganen][ref8]
      de [Uitvoeringswet Algemene verordening gegevensbescherming][ref9]
      de [Algemene wet erkenning EU-beroepskwalificaties][ref10]
      de [Dienstenwet][ref11]
      de [Wet op de economische delicten][ref12]
      de [Wet op de rechterlijke organisatie][ref13]
      de [Wet open overheid][ref14]
      de [Algemene wet op het binnentreden][ref15].
          Als algemene wetten voor een deelterrein moeten onder andere worden beschouwd:
          de [Algemene wet inzake rijksbelastingen][ref16]
      de [Wet financiering sociale verzekeringen][ref17]
      de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref18].
          Een voorbeeld van een wet die bepaalt dat de afwijking in de algemene wet moet worden opgenomen, is de
      [Wet open overheid][ref19] (Woo). In [artikel 8.8 Woo][ref20] is vastgelegd dat een aantal artikelen van de
      Woo niet geldt voor informatie waarvoor een bepaling geldt die is opgenomen in de bijlage bij de Woo. Een ander
      voorbeeld heeft betrekking op de bijlagen bij de [Awb][ref21], zie hierover [aanwijzing 5.49][ref22].
          Zie voor de formulering van bepalingen die afwijken van algemene wetten ook [aanwijzing 3.35][ref23] over de
      terminologie ‘in afwijking van’.
          **Tweede lid.**Een voorbeeld is de introductie in bijzondere wetgeving van toezichtsbevoegdheden die aanvullend
      zijn op de bevoegdheden van de [Algemene wet bestuursrecht][ref24]: er wordt in dat geval expliciet afgewogen of de
      te verwachten resultaten van toepassing van de bevoegdheid niet met behulp van bestaande bevoegdheden kunnen worden
      bereikt, in hoeverre de bevoegdheid uitvoerbaar en effectief kan zijn en in hoeverre de bevoegdheid proportioneel
      is. Daarin worden de ervaringen met de handhaving, de aard van de overtreding, de aard van de doelgroep, de aard
      van het toezicht en het karakter van de aanvullende bevoegdheid meegewogen.


