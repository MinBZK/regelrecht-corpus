  - number: '3.19'
    text: |-
      1 Het geheel van dienstonderdelen onder leiding van een minister wordt aangeduid als ‘*ministerie*’.

      2 Als bijvoeglijke aanduiding voor ministerie wordt de term ‘*departementaal*’ gebruikt.


          **Toelichting**
          **Eerste lid.**Aangezien de [Grondwet][ref1] van ‘ministerie’ spreekt, dient de term ‘departement’ te worden
      vermeden. Tot een ministerie behoren alle onder een minister ressorterende diensten, instellingen en bedrijven.
      Dient een regeling daarop geen betrekking te hebben, dan moeten ze uitdrukkelijk worden uitgezonderd, tenzij al uit
      de aard der zaak volgt dat de regeling daarvoor niet geldt.
          **Tweede lid.**De term ‘ministerieel’ heeft alleen betrekking op ‘minister’, niet op ‘ministerie’.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
