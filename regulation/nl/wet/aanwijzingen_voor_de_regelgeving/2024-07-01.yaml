  - number: 2.14.1
    text: Bij de toekenning van bestuursbevoegdheden wordt de uitoefening daarvan zoveel mogelijk genormeerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.14
  - number: 2.14.2
    text: |-
      Met het oog hierop worden discretionaire bevoegdheden en bevoegdheden met vage toepassingscriteria niet toegekend,
      tenzij daarvoor goede gronden zijn.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.14
  - number: '2.15'
    text: |-
      Bij het opstellen van een regeling wordt onderzocht welke hogere regels de vrijheid van regeling ten aanzien van
      het betrokken onderwerp hebben ingeperkt.
          **Toelichting**
          Bij hogere regels kan het gaan om internationale regelingen of bindende EU-rechtshandelingen, het Statuut,
      grondwettelijke voorschriften, rechtsbeginselen en – bij regelingen die worden vastgesteld bij algemene maatregel
      van bestuur of ministeriële regeling – regels die zijn neergelegd in een wet in formele zin. Wat de internationale
      regels betreft valt in het bijzonder te denken aan het EVRM, het Handvest van de grondrechten van de Europese
      Unie en het IVBPR. Wat EU-regelgeving en andere regelgeving betreft valt, behalve aan richtlijnen, verordeningen
      en besluiten, te denken aan algemene leerstukken als het burgerschap van de Europese Unie, het vrije verkeer van
      goederen, personen, diensten en kapitaal, gegevensbescherming en de Europese mededingingsregels. Op het terrein
      van diensten kan in het bijzonder gedacht worden aan de Dienstenrichtlijn: [Richtlijn 2006/123/EG](32006L0123)
      van het Europees Parlement en de Raad van 12 december 2006 betreffende diensten op de interne markt. Zie ook de
      [aanwijzingen 5.29][ref1] en [5.30][ref2]. Voor wat betreft de gegevensbescherming wordt gewezen op Verordening
      (EU) 2016/679 van het Europees Parlement en de Raad van 27 april 2016 betreffende de bescherming van natuurlijke
      personen in verband met de verwerking van persoonsgegevens en betreffende het vrije verkeer van die gegevens
      en tot intrekking van [Richtlijn 95/46/EG](31995L0046) (algemene verordening gegevensbescherming). Zie ook de
      [aanwijzingen 5.33][ref3] en [5.34][ref4].
          Ten aanzien van regelgeving die de toegang of uitoefening van gereglementeerde beroepen beperkt wordt gewezen
      op [richtlijn 2005/36/EG](32005L0036) van het Europees Parlement en de Raad van 7 september 2005 betreffende
      de erkenning van beroepskwalificaties en [richtlijn (EU) 2018/958](32018L0958) van het Europees Parlement en de
      Raad van 28 juni 2018 betreffende een evenredigheidsbeoordeling voorafgaand aan een nieuwe reglementering van
      beroepen. Deze richtlijnen stellen naast inhoudelijke eisen aan de regeling, ook procedurele eisen aan de wijze
      van totstandkoming van de regelgeving die de toegang tot of de uitoefening van een gereglementeerd beroep beperkt.
      Zo wordt een voorafgaande evenredigheidsbeoordeling conform het voorgeschreven kader in die richtlijn geëist, en
      dienen betrokken partijen de gelegenheid te krijgen hun standpunt over het ontwerp kenbaar te maken, bijvoorbeeld
      door internetconsultatie open te stellen.
          Indien een initiatiefvoorstel of amendement een beperking omvat van de toegang tot of de uitoefening van een
      gereglementeerd beroep, en het betrokken lid van de Tweede Kamer de evenredigheid van die beperking niet zelf heeft
      beoordeeld, verricht de verantwoordelijke bewindspersoon deze beoordeling tijdens de parlementaire behandeling
      van het initiatiefvoorstel of amendement. Deze bewindspersoon deelt de resultaten daarvan tijdig mee aan de Tweede
      Kamer. Zie voor nadere details de Handleiding gereglementeerde beroepen, te raadplegen op [www.kcbr.nl](http://
      www.kcbr.nl).
          Wat betreft [artikel 1 van de Grondwet][ref5] wordt erop gewezen dat de in dat artikel opgenomen zinsnede
      ‘op welke grond dan ook’ uitdrukt dat ook ongerechtvaardigd onderscheid op andere gronden dan de in het artikel
      expliciet genoemde – bijvoorbeeld leeftijd of handicap – verboden is. Voor de onderscheidingsgrond ‘leeftijd’ geldt
      bovendien dat ook de hoogte van de leeftijdsgrens geen ongerechtvaardigd onderscheid tot gevolg mag hebben.
          Van de rechtsbeginselen kunnen met name worden genoemd het rechtszekerheidsbeginsel, het gelijkheidsbeginsel en
      het evenredigheidsbeginsel.
          Wat de regels aangaat die zijn neergelegd in een wet, dient niet alleen te worden gelet op de wet waarop de
      betrokken algemene maatregel van bestuur of ministeriële regeling berust, maar ook op andere wetten.
          Zie ook onderdeel 3.2.1 (Aansluiting op [Grondwet][ref6] en hoger recht) van het Beleidskompas. Zie met
      betrekking tot de toelichting bij de regeling [aanwijzing 4.43, onderdeel g][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
