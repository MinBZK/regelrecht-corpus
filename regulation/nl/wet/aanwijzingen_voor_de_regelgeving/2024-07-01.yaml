      Voor de aanhef van een beleidsregel wordt het volgende model gebruikt:

      *De Minister van/voor ... / Staatssecretaris van ...,*

      *Gelet op ...;*

      *Besluit:*


          **Toelichting**
          Zie voor ‘gelet op’ [aanwijzing 4.10][ref1].


