  - number: '4.15'
    text: |-
      1 Het tijdstip van inwerkingtreding van een wet of een algemene maatregel van bestuur wordt zodanig geregeld dat
      dit blijkt uit het Staatsblad waarin de regeling is geplaatst of af te leiden is uit een ander Staatsblad.

      2 Het tijdstip van inwerkingtreding van een regeling wordt niet afhankelijk gesteld van de inwerkingtreding van een
      verdrag of van een andere niet uit het Staatsblad of de Staatscourant blijkende gebeurtenis.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.15
  - number: '4.16'
    text: |-
      1 Het tijdstip van inwerkingtreding van een regeling ligt in ieder geval na het tijdstip van haar bekendmaking.

      2 De datum van bekendmaking van een koninklijk besluit tot vaststelling van het tijdstip van inwerkingtreding van
      een wet of een algemene maatregel van bestuur ligt in ieder geval vóór het tijdstip van inwerkingtreding van de
      betrokken wet of algemene maatregel van bestuur.


          **Toelichting**
          De [Grondwet][ref1] verbiedt dat wetten, algemene maatregelen van bestuur en andere van de centrale
      overheid afkomstige algemeen verbindende voorschriften in werking treden voordat zij zijn bekendgemaakt
      ([artikelen 88][ref2] en [89, derde en vierde lid][ref3]). Ook bij de bekendmaking van koninklijke besluiten tot
      vaststelling van het tijdstip van inwerkingtreding van een wet of algemene maatregel van bestuur wordt met deze
      grondwettelijke bepalingen rekening gehouden. Voor een beleidsregel volgt uit [artikel 3:40 Awb][ref4] dat deze pas
      na bekendmaking in werking kan treden.
          Het tijdstip van bekendmaking van een regeling die in het Staatsblad of de Staatscourant wordt geplaatst,
      is het tijdstip waarop de regeling elektronisch wordt gepubliceerd op de website www.officielebekendmakingen.nl.
      In bijzondere gevallen, bijvoorbeeld met het oog op de spoedeisendheid, kunnen regelingen ook op
      andere wijze dan door publicatie in Staatsblad of Staatscourant worden bekendgemaakt: zie bijvoorbeeld
      [artikel 5.2 van de Wet dieren][ref5].
          Zie voor het eventueel toekennen van terugwerkende kracht de [aanwijzingen 5.62][ref6] en [5.63][ref7].


