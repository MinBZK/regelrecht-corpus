  - number: 3.50.1
    text: |-
      In een regeling wordt terughoudendheid betracht bij verwijzing naar informatie op internet door middel van een
      internetadres als onderdeel van de normstelling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.50
  - number: 3.50.2
    text: 'Een verwijzing naar informatie op internet voldoet aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.50
  - number: 3.50.2.a
    text: |-
      de verwijzing heeft betrekking op informatie die is neergelegd in een welomlijnd en zelfstandig benoemd
      informatieobject;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.50
  - number: 3.50.2.b
    text: |-
      het informatieobject wordt rechtstreeks en in de vorm van een volledig uitgeschreven internetadres aangewezen door
      de verwijzing;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.50
  - number: 3.50.2.c
    text: het informatieobject is tijdig en permanent beschikbaar op de met de verwijzing aangeduide locatie;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.50
  - number: 3.50.2.d
    text: |-
      het informatieobject is leesbaar zonder dat bijzondere beperkingen gelden voortvloeiend uit het formaat waarin de
      informatie wordt aangeboden;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.50
  - number: 3.50.2.e
    text: de authenticiteit van het aangeboden informatieobject is voldoende geborgd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.50
  - number: 3.51.1
    text: |-
      Indien een regeling verwijst naar normen die niet in de Nederlandse taal zijn gesteld en op overtreding van die
      normen een strafrechtelijke of bestraffende bestuurlijke sanctie is gesteld, worden die normen in het Nederlands
      vertaald.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.51
  - number: 3.51.2
    text: |-
      De vertaling wordt in de Staatscourant geplaatst. Indien de vertaalde normen slechts van belang zijn voor een
      kleine groep personen of de kenbaarheid van de vertaling op een andere wijze voldoende is verzekerd voor alle
      belanghebbenden, kan de vertaling worden gepubliceerd door middel van een ander algemeen toegankelijk elektronisch
      medium. Van deze wijze van publicatie wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.51
  - number: 3.51.3
    text: |-
      Het tweede lid is niet van toepassing op normen die worden vertaald krachtens de
      [Rijkswet goedkeuring en bekendmaking verdragen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006799
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.51
    references:
      - id: ref1
        bwb_id: BWBR0006799
  - number: 3.51.4
    text: |-
      Het eerste en tweede lid zijn niet van toepassing in geval bij wet is bepaald dat een overtreding van een
      voorschrift als strafbaar feit wordt aangemerkt dan wel wordt bestraft met een bestuurlijke sanctie, indien dit
      voorschrift in de Engelse taal is gesteld en bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.51
  - number: 3.52.1
    text: Het gebruik van hoofdletters wordt zoveel mogelijk beperkt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.52
  - number: 3.52.2
    text: |-
      Het gebruik van hoofdletters in de [Grondwet][ref1] en in basisregelingen wordt zoveel mogelijk gevolgd of als
      uitgangspunt genomen bij de schrijfwijze van daarin gebezigde uitdrukkingen of vastgestelde benamingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.52
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 3.52.3
    text: Bij nieuwe benamingen wordt in beginsel alleen het eerste woord met een hoofdletter geschreven.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.52
  - number: 3.52.4
    text: |-
      Aanduidingen van afzonderlijke ministers en ministeries, als eigennaam gebruikt, worden met een hoofdletter
      geschreven.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.52
  - number: '3.53'
    text: 'Een regeling is opgebouwd uit de volgende elementen:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.53
  - number: 3.53.a
    text: opschrift;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.53
  - number: 3.53.b
    text: aanhef;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.53
  - number: 3.53.c
    text: lichaam;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.53
  - number: 3.53.d
    text: slotformulier;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.53
  - number: 3.53.e
    text: ondertekening;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.53
  - number: 3.53.f
    text: eventuele bijlagen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.53
  - number: 3.54.1
    text: Het lichaam van een regeling wordt vervat in een of meer artikelen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.54
  - number: 3.54.2
    text: |-
      De artikelen worden doorlopend genummerd met Arabische cijfers. In een omvangrijke regeling kunnen de artikelen per
      hoofdstuk worden genummerd, onder vermelding van het hoofdstuknummer voor het artikelnummer.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.54
  - number: 3.54.3
    text: Bestaat een regeling uit één artikel, dan wordt daarboven de aanduiding ‘*Enig artikel*’ geplaatst.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.54
  - number: '3.55'
    text: |-
      De hierna genoemde bepalingen van een regeling worden in voorkomende gevallen in afzonderlijke artikelen en in de
      aangegeven volgorde aan het slot van een regeling opgenomen:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.55
  - number: 3.55.a
    text: bepaling inzake evaluatie;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.55
  - number: 3.55.b
    text: bepaling inzake overgangsrecht;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.55
  - number: 3.55.c
    text: bepaling over intrekking van een regeling;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.55
  - number: 3.55.d
    text: bepaling inzake publicatie van de integrale tekst van een regeling;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.55
  - number: 3.55.e
    text: bepaling inzake inwerkingtreding;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.55
  - number: 3.55.f
    text: bepaling tot vaststelling van een citeertitel.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.55
  - number: 3.56.1
    text: |-
      Indien dit voor de toegankelijkheid van een regeling van belang is, wordt deze systematisch in Arabisch genummerde
      onderdelen verdeeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.56
  - number: 3.56.2
    text: Bij een verdeling op één niveau worden de onderdelen ‘*hoofdstuk*’ of ‘*paragraaf*’ genoemd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.56
  - number: 3.56.3
    text: |-
      Bij een verdeling op twee niveaus worden de onderdelen van het eerste niveau ‘*hoofdstuk*’ en de onderdelen van het
      tweede niveau ‘*paragraaf*’ genoemd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.56
  - number: 3.56.4
    text: |-
      Bij een verdeling op meer dan twee niveaus worden de onderdelen in volgorde van omvang ‘*deel*’, ‘*hoofdstuk*’,
      ‘*titel*’, ‘*afdeling*’ en ‘*paragraaf*’ genoemd, met dien verstande dat in ieder geval de aanduidingen
      ‘*hoofdstuk*’ en ‘*paragraaf*’ worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.56
  - number: 3.57.1
    text: |-
      De in [aanwijzing 3.56][ref1] bedoelde onderdelen van een regeling worden voorzien van een opschrift, waarin de
      inhoud van het onderdeel beknopt wordt aangeduid.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.57
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.57.2
    text: Artikelen kunnen van een opschrift worden voorzien.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.57
  - number: 3.58.1
    text: Artikelen kunnen worden verdeeld in leden die worden aangeduid met Arabische cijfers.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.58
  - number: 3.58.2
    text: Een lid wordt niet verdeeld in alinea's.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.58
  - number: 3.58.3
    text: |-
      Indien de inhoud van een artikel zou leiden tot een groot aantal leden, wordt het artikel zo mogelijk gesplitst in
      meer artikelen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.58
  - number: 3.59.1
    text: |-
      Indien het bij een opsomming in een artikel omwille van de duidelijkheid wenselijk is elk onderdeel daarvan op een
      nieuwe regel te laten beginnen, wordt de volgende werkwijze gevolgd:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.59
  - number: 3.59.1.a
    text: |-
      de onderdelen worden aangegeven met de letters a, b, c enzovoort, een eventuele verdere onderverdeling met 1°, 2°,
      3° enzovoort, waarbij achter deze letters en cijfers een punt wordt geplaatst;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.59
  - number: 3.59.1.b
    text: binnen de onderdelen wordt niet met een nieuwe zin begonnen;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.59
  - number: 3.59.1.c
    text: de onderdelen worden, met uitzondering van het laatste onderdeel, afgesloten met een puntkomma.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.59
  - number: 3.59.2
    text: |-
      Na het laatste onderdeel van een opsomming wordt geen tekst opgenomen die betrekking heeft op alle onderdelen,
      tenzij dit onvermijdelijk is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.59
  - number: 3.59.3
    text: |-
      In een opsomming van begripsbepalingen wordt bij voorkeur een alfabetische volgorde zonder nummering of lettering
      gehanteerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.59
  - number: 3.60.1
    text: |-
      Indien dit voor de duidelijkheid nodig is, wordt door gebruik van het woord ‘*of*’ dan wel ‘*en*’
      aan het slot van het voorlaatste onderdeel van een opsomming het alternatieve, onderscheidenlijk
      cumulatieve karakter van de opsomming tot uitdrukking gebracht. In zo'n geval wordt in afwijking van
      [aanwijzing 3.59, eerste lid, onderdeel c][ref1], het voorlaatste onderdeel afgesloten met ‘*; of*’ dan wel ‘*;
      en*’.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.60
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 3.60.2
    text: Uit de formulering van het artikel blijkt of een opsomming een limitatief of een enuntiatief karakter heeft.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.60
  - number: '3.61'
    text: |-
      Bij een regeling wordt geen bijlage opgenomen, tenzij het gaat om de vaststelling van een tabel, formulier, model,
      kaart of lijst van regelingen of bepalingen dan wel dit anderszins onvermijdelijk is.
          **Toelichting**
          De inhoud van een bijlage is in gelijke mate bindend als de regeling waarbij zij behoort. Bijlagen waarin
      louter toelichtende informatie wordt verschaft, behoren niet bij een regeling te worden opgenomen. Eventueel kunnen
      dergelijke bijlagen worden opgenomen bij de toelichting op de regeling.
          Het gebruik van bijlagen kan aangewezen zijn bij een regeling die vanwege de omvang daarvan in meerdere
      bestanden gescheiden moet kunnen worden. Zie ook [aanwijzing 4.28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.61
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.6'
  - number: 3.62.1
    text: |-
      Een bijlage bij een regeling wordt voorzien van een opschrift waarin is vermeld bij welk artikel van de regeling de
      bijlage hoort, tenzij dit door het grote aantal artikelen niet doelmatig is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.62
  - number: 3.62.2
    text: |-
      Indien dit voor de toegankelijkheid van een bijlage van belang is, wordt in het opschrift de inhoud van de bijlage
      beknopt aangeduid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.62
  - number: '3.63'
    text: |-
      In een uitvoeringsregeling worden zo mogelijk de indeling en volgorde van de onderdelen, de opschriften van die
      onderdelen, de wijze van nummering van de artikelen en de volgorde van de artikelen van de hogere regeling in acht
      genomen.
          **Toelichting**
          Zie ook de [aanwijzingen 2.34][ref1] en [3.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.63
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '3.64'
    text: |-
      In een regeling worden, tenzij dit onvermijdelijk is, bepalingen uit een andere regeling, die hetzelfde onderwerp
      regelen, niet herhaald.
          **Toelichting**
          Het gaat hierbij met name om het vermijden van herhaling in een uitvoeringsregeling van bepalingen uit de
      delegerende regeling en herhaling in een bijzondere regeling van bepalingen uit algemene regelingen, zoals het
      Burgerlijk Wetboek, de [Algemene wet bestuursrecht][ref1], de [Gemeentewet][ref2] of de [Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005416
      [ref3]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.64
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005416
      - id: ref3
        bwb_id: BWBR0003245
  - number: '4.1'
    text: Regelingen worden voorzien van een opschrift.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.1
  - number: 4.2.1
    text: 'Voor het opschrift van een regeling wordt een van de volgende modellen gebruikt:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.2
  - number: 4.2.1.a
    text: 'bij een (rijks)wet: *Rijkswet / Wet van [datum] tot /, houdende [aanduiding inhoud];*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.2
  - number: 4.2.1.b
    text: 'bij een algemene maatregel van (rijks)bestuur: *Besluit van [datum] tot /, houdende [aanduiding inhoud];*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.2
  - number: 4.2.1.c
    text: |-
      bij een ministeriële regeling: *Regeling van de [Minister van/voor ... / Staatssecretaris van ...] van [datum]
      tot /, houdende [aanduiding inhoud];*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.2
  - number: 4.2.1.d
    text: |-
      bij een beleidsregel: *Beleidsregel van de [Minister van/voor ... / Staatssecretaris van ...] van [datum] over /
      tot [aanduiding inhoud].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.2
  - number: 4.2.2
    text: In een wetsvoorstel worden in het opschrift de woorden ‘*Rijkswet / Wet van (...) tot /, houdende*’ niet opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.2
  - number: 4.3.1
    text: Het opschrift bevat zo mogelijk enige materiële aanduiding van het onderwerp van de regeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.3
  - number: 4.3.2
    text: Het opschrift wordt beknopt gehouden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.3
  - number: '4.4'
    text: |-
      Indien aan een regeling een citeertitel wordt gegeven, wordt deze aan het slot van het opschrift tussen haakjes
      vermeld.
          **Toelichting**
          Toekenning van een citeertitel aan een regeling geschiedt door een bepaling daartoe in de regeling zelf op te
      nemen (zie de [aanwijzingen 4.24][ref1] en [4.25][ref2]). De vermelding van de citeertitel in het opschrift heeft
      slechts een informatief karakter.
          **Voorbeeld**
          Wet van 4 juni 2014, houdende nieuwe regels met betrekking tot de verdeling van woonruimte en de samenstelling
      van de woonruimtevoorraad (Huisvestingwet 2014)


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.4a
    text: |-
      Indien beschikbaar wordt onder het opschrift van een regeling tussen haken het KetenID vermeld. **Toelichting**
      De vermelding van het KetenID stelt de lezer in staat om via de Wetgevingskalender relevante informatie met
      betrekking tot het voorstel te vinden, zoals het advies van de Afdeling advisering en het nader rapport. Het
      KetenID wordt ontleend aan het interdepartementale wetgevingsinformatiesysteem Kiwi, waarin de meeste regelgeving
      in wording is opgenomen vanaf de ontwerpfase. Informatie over deze regelgeving in wording wordt aangeboden op de
      Wetgevingskalender. Ten behoeve van geautomatiseerde herkenning van dit kenmerk wordt het KetenID weergegeven in
      de vorm WGK[nnnnnn], waarbij een nummer van minder dan zes cijfers waar nodig van voorloopnullen wordt voorzien.
      **Voorbeelden** - Wet: *Wijziging van Boek 3 van het Burgerlijk Wetboek en van Boek 3 van het Burgerlijk Wetboek
      BES in verband met het toekennen van preferentie aan de verschuldigde uitkeringen tot voorziening in de kosten
      van verzorging en opvoeding van minderjarige kinderen en in de kosten van levensonderhoud en studie van jong
      meerderjarigen* *(KetenID WGK012963)*
        - Algemene maatregel van bestuur: *Besluit van [...], houdende regels ter uitvoering van de Wet toetreding
      zorgaanbieders (Uitvoeringsbesluit Wtza)* *(KetenID WGK008987)* *Op de voordracht van Onze Minister voor Medische
      Zorg, van [...], kenmerk [...], gedaan mede namens Onze Minister van Volksgezondheid, Welzijn en Sport;*
        - Ministeriële regeling: *Regeling van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties [PM] 2022,
      nr. CZW/S&B/...., houdende nadere eisen en regels voor het verlenen van een toelating voor publieke en private
      identificatiemiddelen (Regeling nadere eisen identificatiemiddelen, authenticatiediensten en machtigingsdiensten
      Wdo)* *(KetenID WGK010753)*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.4a
  - number: 4.5.1
    text: |-
      Voor de aanhef van een wet wordt het volgende model gebruikt: *Wij Willem-Alexander, bij de gratie Gods, Koning der
      Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.* *Allen, die deze zullen zien of horen lezen, saluut! doen te
      weten:* *Alzo Wij in overweging genomen hebben, dat [considerans];* *Zo is het, dat Wij, de Afdeling advisering van
      de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en verstaan, gelijk Wij
      goedvinden en verstaan bij deze:*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.5
  - number: 4.5.2
    text: |-
      Indien het een rijkswet betreft, luidt de laatste alinea: *Zo is het, dat Wij, de Afdeling advisering van de Raad
      van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de bepalingen van het Statuut
      voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan
      bij deze:*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.5
  - number: 4.6.1
    text: |-
      Voor de aanhef van een algemene maatregel van bestuur of een ander koninklijk besluit van regelende aard
      wordt het volgende model gebruikt: *Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins
      van Oranje-Nassau, enz. enz. enz.* *Op de voordracht van [Onze Minister van/voor .../ de Staatssecretaris
      van ...] van [datum], nr. ...[, gedaan in overeenstemming met / mede namens Onze Minister(s) van/voor .../ de
      Staatssecretaris(sen) van ...];* *Gelet op ...;* *De Afdeling advisering van de Raad van State gehoord (advies
      van [datum], nr. ...);* *Gezien het nader rapport van [Onze Minister van/voor .../ de Staatssecretaris van ...]
      van [datum], nr. ...[, uitgebracht in overeenstemming met / mede namens Onze Minister(s) van/voor .../ de
      Staatssecretaris(sen) van ...];* *Hebben goedgevonden en verstaan:*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.6
  - number: 4.6.2
    text: |-
      In de aanhef van een algemene maatregel van rijksbestuur wordt gesproken van de ‘Afdeling advisering van de Raad
      van State van het Koninkrijk’ en wordt als voorlaatste zinsnede ingevoegd: *De bepalingen van het Statuut voor het
      Koninkrijk in acht genomen zijnde;*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.6
  - number: 4.6.3
    text: |-
      Voor de aanhef van een koninklijk besluit, niet zijnde een koninklijk besluit van regelende aard, wordt het
      volgende model gebruikt: *Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-
      Nassau, enz. enz. enz.* *Op de voordracht van [Onze Minister van/voor .../ de Staatssecretaris van ...] van
      [datum], nr. ...;* *Gelet op ...;* *Hebben goedgevonden en verstaan:*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.6
  - number: 4.6.4
    text: |-
      In de aanhef van een koninklijk rijksbesluit, niet zijnde een algemene maatregel van rijksbestuur, wordt niet naar
      het Statuut verwezen, tenzij de raad van ministers van het Koninkrijk ter zake heeft overlegd. In dat geval wordt
      als voorlaatste zinsnede ingevoegd: *Artikel 10 van het Statuut voor het Koninkrijk in acht genomen zijnde;*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.6
  - number: 4.7.1
    text: |-
      Indien bij de voordracht tot een voorstel van wet, een algemene maatregel van bestuur of een ander koninklijk
      besluit van regelende aard meer dan één bewindspersoon is betrokken, geschiedt de voordracht door één van hen, in
      overeenstemming met de ander(en).
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Indien er bijzondere redenen zijn om te bepalen dat een wet of besluit wordt gecontrasigneerd door alle
      voordragende bewindspersonen geschiedt de voordracht door één van hen, mede namens de ander(en).
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.7
  - number: 4.7.3
    text: |-
      Indien er zeer bijzondere redenen zijn om de gelijkwaardigheid van de verantwoordelijkheid van de verschillende
      bewindspersonen ook in de voordracht tot uitdrukking te brengen, wordt gebruik gemaakt van de volgende formulering:
      *Op de voordracht van [Onze Minister van/voor .../ de Staatssecretaris van ...] en [Onze Minister van/voor .../ de
      Staatssecretaris van ...].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.7
  - number: '4.8'
    text: |-
      Voor de aanhef van een ministeriële regeling wordt het volgende model gebruikt: *De Minister van/voor .../
      Staatssecretaris van ...,* *[Handelende in overeenstemming met de Minister(s) van/voor... / Staatssecretaris(sen)
      van ... / in overeenstemming met het gevoelen van de ministerraad];* *Gelet op ...;* *Besluit:*
          **Toelichting**
          De zinsnede over de medebetrokkenheid (‘handelende in overeenstemming met’) wordt alleen opgenomen,
      indien zij van toepassing is. De zinsnede ‘handelende in overeenstemming met het gevoelen van de
      ministerraad’ wordt opgenomen indien – bijvoorbeeld ter voldoening aan een wettelijk voorschrift (vgl.
      [artikel 2.4 van de Wet normering topinkomens][ref1]) – over een ministeriële regeling besluitvorming in de
      ministerraad heeft plaatsgevonden.
          Indien een ministeriële regeling is gebaseerd op de regelgevende bevoegdheid van twee of meer ministers,
      worden in de eerste regel van de aanhef alle ministers (of fungerende staatssecretarissen) genoemd die de regeling
      vaststellen: De Minister van/voor ... en de Minister van/voor ...’. Tevens wordt in dat geval ‘Besluit:’ vervangen
      door de meervoudsvorm ‘Besluiten:’. Zie voor gezamenlijke regelingen ook [aanwijzing 4.33][ref2]. De formulering
      ‘mede namens’ wordt vanwege de specifieke betekenis die deze formulering heeft in de aanhef van wetten en
      koninklijke besluiten (zie [aanwijzing 4.33][ref3]), in de aanhef van ministeriële regelingen vermeden.
          Zie voor ‘gelet op’ [aanwijzing 4.10][ref4]. Zie ook [aanwijzing 3.18][ref5] (aanduiding ‘ministeriële
      regeling’).


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.8'
      - id: ref3
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.8'
      - id: ref4
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref5
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '4.9'
    text: |-
      Voor de aanhef van een beleidsregel wordt het volgende model gebruikt: *De Minister van/voor ... / Staatssecretaris
      van ...,* *Gelet op ...;* *Besluit:*
          **Toelichting**
          Zie voor ‘gelet op’ [aanwijzing 4.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.10.1
    text: |-
      De uitdrukking ‘Gelet op’ verwijst naar de hogere regeling waarop de regelgevende bevoegdheid berust en in
      voorkomend geval naar de internationale regeling of bindende EU-rechtshandeling ter uitvoering waarvan de regeling
      strekt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.10
  - number: 4.10.2
    text: |-
      Verwezen wordt naar de afzonderlijke artikelen van de hogere regeling, tenzij dit door het grote aantal artikelen
      niet doelmatig is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.10
  - number: 4.11.1
    text: In de aanhef van een wet wordt een considerans opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.11
  - number: 4.11.2
    text: In een andere regeling wordt geen considerans opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.11
  - number: 4.12.1
    text: |-
      In een considerans worden de strekking van en, indien daartoe aanleiding is, het motief tot de vaststelling van de
      wet in hoofdzaak kort weergegeven.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.12
  - number: 4.12.2
    text: In de considerans worden geen elementen opgenomen die niet in het lichaam van de wet zelf voorkomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.12
  - number: '4.13'
    text: |-
      Strekt een wet tot uitvoering van de [Grondwet][ref1], een verdrag of een bindende EU-rechtshandeling, dan wel een
      ander besluit van een volkenrechtelijke organisatie, dan wordt dit in de considerans vermeld.
          **Toelichting**
          Bij een algemene maatregel van bestuur of een ministeriële regeling wordt het verband met een hogere regeling
      tot uitdrukking gebracht door de formulering ‘gelet op’. Zie [aanwijzing 4.10][ref2].
          Deze aanwijzing geeft tevens invulling aan het in EU-richtlijnen opgenomen voorschrift dat naar de
      geïmplementeerde richtlijn wordt verwezen in de nationale uitvoeringsbepalingen of bij de officiële bekendmaking
      van die bepalingen, op een wijze die door de lidstaten wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0001840
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.14.1
    text: Een regeling voorziet in haar inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.14
  - number: 4.14.2
    text: |-
      Bij de vaststelling van het moment van inwerkingtreding wordt geen onderscheid gemaakt tussen categorieën van
      gevallen waarop de regeling toepasselijk wordt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.14
  - number: 4.15.1
    text: |-
      Het tijdstip van inwerkingtreding van een wet of een algemene maatregel van bestuur wordt zodanig geregeld dat dit
      blijkt uit het Staatsblad waarin de regeling is geplaatst of af te leiden is uit een ander Staatsblad.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.15
  - number: 4.15.2
    text: |-
      Het tijdstip van inwerkingtreding van een regeling wordt niet afhankelijk gesteld van de inwerkingtreding van een
      verdrag of van een andere niet uit het Staatsblad of de Staatscourant blijkende gebeurtenis.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.15
  - number: 4.16.1
    text: Het tijdstip van inwerkingtreding van een regeling ligt in ieder geval na het tijdstip van haar bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.16
  - number: 4.16.2
    text: |-
      De datum van bekendmaking van een koninklijk besluit tot vaststelling van het tijdstip van inwerkingtreding van
      een wet of een algemene maatregel van bestuur ligt in ieder geval vóór het tijdstip van inwerkingtreding van de
      betrokken wet of algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.16
  - number: 4.17.1
    text: Een wet of een algemene maatregel van bestuur treedt in werking met ingang van 1 januari of 1 juli.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.2
    text: Een ministeriële regeling treedt in werking met ingang van 1 januari, 1 april, 1 juli of 1 oktober.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.3
    text: |-
      In afwijking van het eerste en tweede lid gelden voor regelingen over het onderwijs de volgende vaste
      verandermomenten:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.3.a
    text: |-
      voor wetten en algemene maatregelen van bestuur betreffende het basisonderwijs, het (voortgezet) speciaal
      onderwijs, het voortgezet onderwijs en het middelbaar beroepsonderwijs: 1 januari en 1 augustus;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.3.b
    text: |-
      voor ministeriële regelingen betreffende het basisonderwijs, het (voortgezet) speciaal onderwijs, het voortgezet
      onderwijs en het middelbaar beroepsonderwijs: 1 januari, 1 april, 1 augustus en 1 oktober;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.3.c
    text: 'voor wetten en algemene maatregelen van bestuur betreffende het hoger onderwijs: 1 januari en 1 september;'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.3.d
    text: 'voor ministeriële regelingen betreffende het hoger onderwijs: 1 januari, 1 april, 1 september en 1 oktober.'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.4
    text: |-
      De termijn tussen de publicatiedatum van een wet, algemene maatregel van bestuur of ministeriële regeling en het
      tijdstip van inwerkingtreding is minimaal twee maanden. Indien een regeling direct relevant is voor medeoverheden,
      is deze termijn minimaal drie maanden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.5
    text: 'Uitzondering op de vaste verandermomenten of de minimuminvoeringstermijn is mogelijk voor zover:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.5.a
    text: |-
      dit, gelet op de doelgroep of de jaarindeling, aanmerkelijke ongewenste private of publieke voor- of nadelen
      voorkomt;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.5.b
    text: het spoed- of noodregelgeving betreft;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.5.c
    text: het reparatieregelgeving betreft; of
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.5.d
    text: |-
      het implementatie van bindende EU-rechtshandelingen, verdragen of andere besluiten van volkenrechtelijke
      organisaties betreft.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: 4.17.6
    text: |-
      De toepassing van een uitzonderingsgrond wordt gemotiveerd in de toelichting bij de regeling of in de toelichting
      bij het inwerkingtredingsbesluit.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.17
  - number: '4.19'
    text: |-
      De inwerkingtreding van bepalingen betreffende inwerkingtreding, inwerkingstelling, toepassingsmomenten en
      bekendmaking van een regeling, vaststelling van een citeertitel, delegatie van regelgevende bevoegdheid of
      parlementaire betrokkenheid bij de totstandkoming van een regeling hoeft niet uitdrukkelijk te worden geregeld.
      Deze bepalingen gelden vanaf het tijdstip van totstandkoming van de regeling.
          **Toelichting**
          Deze aanwijzing houdt in dat voor de bedoelde bepalingen bij de regeling van de inwerkingtreding geen
      afzonderlijke voorziening hoeft te worden getroffen. Evenmin is het nodig om deze bepalingen uitdrukkelijk uit te
      zonderen bij het formuleren van de inwerkingtredingsbepaling.
          **Parlementaire betrokkenheid.**Indien op grond van een bij de Staten-Generaal aanhangig wetsvoorstel reeds
      een uitvoeringsregeling wordt voorbereid die met toepassing van een in dat wetsvoorstel opgenomen bepaling met
      betrekking tot de totstandkomingsprocedure tot stand gebracht moet worden, kan de voorbereiding plaatsvinden
      overeenkomstig die bepaling. Bij de vaststelling van de uitvoeringsregeling is dan aan de verplichtingen inzake
      parlementaire betrokkenheid bij de uitvoeringsregeling voldaan. De uitvoeringsregeling kan dan op hetzelfde moment
      in werking treden als de wet waarop zij is gebaseerd. Zie ook de [aanwijzingen 2.35 tot en met 2.40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: '4.20'
    text: |-
      Een koninklijk besluit tot vaststelling van het tijdstip van inwerkingtreding van een wet of een algemene maatregel
      van bestuur voorziet niet in zijn eigen inwerkingtreding.
          **Toelichting**
          Een dergelijk koninklijk besluit geldt zodra het is bekendgemaakt (vgl. [aanwijzing 4.19][ref1]).
          Dit geldt ook in het geval dat, al dan niet tezamen met het vaststellen van een tijdstip van inwerkingtreding
      van een wet of een algemene maatregel van bestuur, bij koninklijk besluit een ander op grond van de wet of de
      algemene maatregel van bestuur vast te stellen tijdstip wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.21.1
    text: |-
      Voor de inwerkingtredingsbepaling van een wet wordt zoveel mogelijk het volgende model gebruikt: *Deze wet treedt
      in werking op een bij koninklijk besluit te bepalen tijdstip.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.21
  - number: 4.21.2
    text: |-
      Voor de inwerkingtredingsbepaling van een algemene maatregel van bestuur wordt een van de volgende modellen
      gebruikt:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.21
  - number: 4.21.2.A
    text: '*Dit besluit treedt in werking met ingang van ...*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.21
  - number: 4.21.2.B
    text: '*Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip.*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.21
  - number: 4.21.3
    text: |-
      Voor de inwerkingtredingsbepaling van een ministeriële regeling wordt het volgende model gebruikt: *Deze regeling
      treedt in werking met ingang van ...*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.21
  - number: 4.21.4
    text: |-
      Voor de inwerkingtredingsbepaling van een beleidsregel wordt het volgende model gebruikt: *Deze beleidsregel treedt
      in werking met ingang van ...*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.21
  - number: '4.22'
    text: 'Zo nodig kan voor de inwerkingtredingsbepaling van een regeling ook een van de volgende modellen worden gebruikt:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.22
  - number: 4.22.A
    text: |-
      *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking met ingang van ..., met uitzondering
      van de artikelen ..., die in werking treden met ingang van ... .*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.22
  - number: 4.22.B
    text: |-
      *Deze wet / Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit
      kan een ander tijdstip worden vastgesteld waarop de artikelen ... in werking treden.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.22
  - number: 4.22.C
    text: |-
      *Deze wet / Dit besluit treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.22
  - number: 4.22.D
    text: |-
      *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking op het tijdstip waarop [artikel ...
      van] [citeertitel of aanduiding andere regeling] in werking treedt.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.22
  - number: 4.22.E
    text: |-
      *Indien het bij [koninklijke boodschap van [datum] ingediende / geleidende brief van [datum] aanhangig gemaakte]
      voorstel van wet [als aanwijzing 3.43, tweede lid] tot wet is of wordt verheven en [artikel ... van] die wet in
      werking treedt, treedt deze wet / dit besluit op hetzelfde tijdstip in werking.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.22
  - number: 4.22.F
    text: |-
      *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking met ingang van de eerste dag van
      de ... kalendermaand na de datum van uitgifte van het Staatsblad / de Staatscourant waarin zij/het/zij/hij wordt
      geplaatst.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.22
  - number: 4.22.G
    text: |-
      *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking met ingang van de dag na de datum van
      uitgifte van het Staatsblad / de Staatscourant waarin zij/het/zij/hij wordt geplaatst.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.22
  - number: 4.22.H
    text: |-
      *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking met ingang van [beoogde datum van
      inwerkingtreding]. Indien het Staatsblad / de Staatscourant waarin deze wet / dit besluit / deze regeling / deze
      beleidsregel wordt geplaatst, wordt uitgegeven na [de dag voor de beoogde datum van inwerkingtreding], treedt zij/
      het/zij/hij in werking met ingang van de dag na de datum van uitgifte van het Staatsblad / de Staatscourant waarin
      zij/het/ zij/hij wordt geplaatst, en werkt zij/het/zij/hij terug tot en met [beoogde datum van inwerkingtreding].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.22
  - number: 4.24.1
    text: Een regeling heeft een citeertitel, tenzij aan aanhaling van de regeling in de praktijk geen behoefte zal bestaan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.24
  - number: 4.24.2
    text: Een wijzigingsregeling heeft slechts een citeertitel indien daaraan behoefte bestaat.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.24
  - number: 4.24.3
    text: |-
      Indien naar verwachting de behoefte zal bestaan een regeling veelvuldig met een afkorting aan te halen, wordt in de
      toelichting bij de regeling een aanbeveling gegeven voor de te gebruiken afkorting.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.24
  - number: 4.25.1
    text: |-
      Een citeertitel wordt kernachtig geformuleerd, heeft voldoende onderscheidend vermogen en bevat geen afkortingen
      tenzij dit onvermijdelijk is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.25
  - number: 4.25.2
    text: |-
      Voor de bepaling tot vaststelling van de citeertitel wordt het volgende model gebruikt: *Deze wet / dit besluit /
      deze regeling / deze beleidsregel wordt aangehaald als: ...*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.25
  - number: 4.25.3
    text: In beginsel wordt slechts het eerste woord van een citeertitel met een hoofdletter geschreven.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.25
  - number: 4.25.4
    text: |-
      In een citeertitel wordt alleen een jaartal opgenomen indien daartoe behoefte bestaat ter onderscheiding van de
      betrokken regeling van een andere regeling. In dat geval kan in een wet of een algemene maatregel van bestuur de
      formulering ‘*met vermelding van het jaartal van het Staatsblad waarin [zij/het] zal worden geplaatst*’ worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.25
  - number: 4.25.5
    text: |-
      In de citeertitel van een rijkswet, een algemene maatregel van rijksbestuur of een ministeriële regeling over een
      koninkrijksaangelegenheid wordt tot uitdrukking gebracht dat het rijkswetgeving betreft.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.25
  - number: 4.25.6
    text: |-
      In de citeertitel van een regeling die uitsluitend voor Bonaire, Sint Eustatius en Saba geldt, wordt door de
      toevoeging ‘BES’ tot uitdrukking gebracht dat het een regeling voor die eilanden betreft. Deze toevoeging blijft
      achterwege, indien de eilanden reeds voluit in de citeertitel worden genoemd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.25
  - number: 4.26.1
    text: |-
      In een regeling worden geen bepalingen opgenomen over de plaatsing in het Staatsblad of de Staatscourant van de
      regeling zelf of daarop berustende algemeen verbindende voorschriften.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.26
  - number: 4.26.2
    text: |-
      Een regeling schrijft, behoudens in uitzonderlijke gevallen, niet voor dat op grond van de regeling genomen
      besluiten in het Staatsblad worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.26
  - number: '4.27'
    text: Regelingen worden na hun vaststelling zo spoedig mogelijk bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.27
  - number: '4.28'
    text: |-
      Een wet, algemene maatregel van bestuur of ministeriële regeling kan bepalen dat een daarbij behorende bijlage
      wordt bekendgemaakt door terinzagelegging, indien:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.28
  - number: 4.28.a
    text: de bijlage niet geschikt is voor publicatie in het Staatsblad of de Staatscourant; en
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.28
  - number: 4.28.b
    text: de kenbaarheid voor de direct bij de regeling betrokken personen daarmee voldoende verzekerd is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.28
  - number: '4.29'
    text: |-
      Indien in een regeling normen van niet-publiekrechtelijke aard van toepassing worden verklaard, wordt, tenzij
      de kenbaarheid van deze normen voor alle betrokkenen voldoende verzekerd is, mededeling van de normen in de
      Staatscourant voorgeschreven. [Aanwijzing 4.28][ref1] is van overeenkomstige toepassing.
          **Toelichting**
          Onder ‘mededeling’ dient ingevolge de [Bekendmakingswet][ref2] te worden verstaan: plaatsing van de integrale
      tekst van de normen in de Staatscourant.
          Zie voor het al dan niet dwingend verwijzen naar normen van niet-publiekrechtelijke aard de toelichting bij
      [aanwijzing 3.48][ref3]. Bij dwingende verwijzing naar normen van niet-publiekrechtelijke aard dienen die normen
      kosteloos ter beschikking te worden gesteld. Zie [artikel 14a van de Bekendmakingswet][ref4]. In artikel 14a,
      vierde lid, is ook bepaald dat indien de mededeling van de normen niet is toegestaan en de kenbaarheid niet kan
      worden verzekerd – bijvoorbeeld omdat het auteursrecht daaraan in de weg staat en over de toegankelijkheid (nog)
      geen overeenkomst is gesloten of niet kan worden gesloten – eenieder op verzoek kosteloos inzage in deze normen
      wordt verleend, ten minste zolang deze normen van toepassing zijn verklaard. Als een dergelijke norm alleen via
      terinzagelegging kenbaar kan worden gemaakt, zal steeds een afweging dienen te worden gemaakt of tot het opleggen
      van die norm moet worden overgegaan. Zie ook de brief van de Minister van Economische Zaken, Landbouw en Innovatie
      van 30 juni 2011, (Kamerstukken II 2010/11, 27 406, nr. 193). Kosteloze terbeschikkingstelling is niet vereist
      indien de overheid zelf de enige normadressaat is.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0004287
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0004287#Artikel14a
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.6'
      - id: ref2
        bwb_id: BWBR0004287
      - id: ref3
