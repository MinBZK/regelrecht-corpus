        bwb_id: BWBR0001840
        artikel: XIX
      - id: ref2
        bwb_id: BWBR0006023
      - id: ref3
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.9'
  - number: '4.12'
    text: |-
      1 In een considerans worden de strekking van en, indien daartoe aanleiding is, het motief tot de vaststelling van
      de wet in hoofdzaak kort weergegeven.

      2 In de considerans worden geen elementen opgenomen die niet in het lichaam van de wet zelf voorkomen.


          **Toelichting**
          **Eerste lid.** Vaak is het voldoende te vermelden dat het wenselijk is ten aanzien van een bepaald onderwerp
      een regeling te treffen, bijvoorbeeld ‘dat het wenselijk is de bepalingen met betrekking tot de vermelding van de
      kandidaten op de lijsten voor de verkiezing van de leden van de vertegenwoordigende lichamen te wijzigen’. Niet
      kan echter worden volstaan met bijvoorbeeld de overweging ‘dat het wenselijk is enige wijzigingen aan te brengen
      in de Kieswet’. Het woord ‘noodzakelijk’ kan worden gebruikt als het onvermijdelijk is dat de wetgeving moet worden
      gewijzigd, bijvoorbeeld in verband met een bindende EU-rechtshandeling of een internationale verplichting.
          **Tweede lid.**Elementen als de reikwijdte van de wet moeten in de wet zelf worden geregeld. Zie ook de
      toelichting bij [aanwijzing 3.57][ref1] (opschriften) en [aanwijzing 4.47][ref2] (nadere regels in toelichting).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
