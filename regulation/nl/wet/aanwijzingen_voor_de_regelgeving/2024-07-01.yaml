  - number: '6.1'
    text: |-
      1 Wijziging of intrekking van een regeling geschiedt door een regeling van gelijke orde.

      2 Intrekking door een regeling van hogere orde komt alleen in aanmerking in de situatie, bedoeld in
      [aanwijzing 6.24, tweede lid][ref1].


          **Toelichting**
          **Eerste lid.** Deze aanwijzing ziet mede op de een enkele maal in de praktijk toegepaste techniek dat in een
      wijzigingswet tevens een met het onderwerp van de wetswijziging nauw verbonden wijziging van een algemene maatregel
      van bestuur wordt vastgesteld. Deze werkwijze is onwenselijk, omdat zij onduidelijkheid kan opleveren over de
      status van een aldus gewijzigde bepaling van een algemene maatregel van bestuur. Zie voor het in twee specifieke
      gevallen wijzigen van een hogere regeling bij een lagere regeling [aanwijzing 2.32][ref2].
          **Tweede lid.**Intrekking door een regeling van lagere orde is slechts mogelijk, indien de in te trekken
      regeling daarin uitdrukkelijk voorziet. Intrekking op deze wijze is in het algemeen onwenselijk. Zie ook
      [aanwijzing 2.32][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
