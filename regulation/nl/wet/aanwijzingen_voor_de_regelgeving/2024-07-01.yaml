  - number: '3.53'
    text: |-
      Een regeling is opgebouwd uit de volgende elementen:

      a. opschrift;

      b. aanhef;

      c. lichaam;

      d. slotformulier;

      e. ondertekening;

      f. eventuele bijlagen.


          **Toelichting**
          Tot de aanhef van een wet behoort mede de considerans. Zie [aanwijzing 4.5][ref1].
          Een inhoudsopgave is geen onderdeel van een regeling. Wel kan zij bij de bekendmaking van de regeling in het
      Staatsblad of de Staatscourant worden opgenomen. Zie [aanwijzing 4.30][ref2].


