  - number: 5.34a
    text: |-
      1 Indien er zwaarwegende redenen zijn om af te wijken van het openbaarheidsregime van de [Wet open overheid][ref1],
      wordt de afwijking in de bijlage bij die wet vermeld.

      2 Voor het wijzigen van de [bijlage bij de Wet open overheid](onbekend) wordt het volgende voorbeeld als
      uitgangspunt gebruikt:

      *In de bijlage bij artikel 8.8 van de Wet open overheid wordt in de alfabetische volgorde ingevoegd:*

        - *Waterschapswet: de artikelen 37 en 43.*

      **Toelichting**

      De [Wet open overheid][ref2] (Woo) bevat regels voor de openbaarheid van overheidsinformatie. Het uitgangspunt
      is dat de Woo van toepassing is, tenzij op grond van de bijlage bij de Woo een bijzonder openbaarheidsregime
      van toepassing is dat in een bijzondere wet is neergelegd. Dit volgt uit artikel 8.8 Woo en de daarbij behorende
      bijlage. Een uitzondering op het openbaarheidsregime van de Woo is alleen mogelijk op het niveau van de wet en
      slechts in geval van zwaarwegende redenen (zie ook [aanwijzing 2.46][ref3]). Daarbij moet altijd eerst overwogen
      worden of de uitzonderingsgronden in de Woo toereikend zijn om de gewenste beperking van de openbaarheid
      te realiseren. Ter beoordeling hiervan vindt afstemming plaats met het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties. Met het oog op de kenbaarheid en eenheid van wetgeving is het van belang dat een uitzondering
      op de Woo wordt geregeld in de bijlage bij [artikel 8.8 Woo][ref4]. Het volstaat om in die bijlage de artikelen
      uit de wet te noemen waarin het bijzondere openbaarheidsregime is neergelegd en waarmee dus wordt afgeweken van het
      algemene openbaarheidsregime van de Woo. Het wetsvoorstel waarin de uitzondering op de Woo wordt geregeld dient in
      de consultatiefase te worden voorgelegd aan het Adviescollege openbaarheid en informatiehuishouding (dit volgt uit
      [artikel 7.2, derde lid, Woo][ref5]).


