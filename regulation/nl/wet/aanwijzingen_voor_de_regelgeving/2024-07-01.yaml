  - number: '4.26'
    text: |-
      1 In een regeling worden geen bepalingen opgenomen over de plaatsing in het Staatsblad of de Staatscourant van de
      regeling zelf of daarop berustende algemeen verbindende voorschriften.

      2 Een regeling schrijft, behoudens in uitzonderlijke gevallen, niet voor dat op grond van de regeling genomen
      besluiten in het Staatsblad worden geplaatst.


          **Toelichting**
          **Eerste lid.** De plaatsing van algemeen verbindende voorschriften in het Staatsblad en algemeen
      verbindende voorschriften en beleidsregels in de Staatscourant is reeds in de [Bekendmakingswet][ref1] geregeld
      ([artikel 4][ref2] onderscheidenlijk [artikel 5][ref3]). Volstaan kan dus worden met de opdracht tot bekendmaking
      in het slotformulier. Zie [aanwijzing 4.31][ref4].
          **Tweede lid.** Het Staatsblad is in beginsel gereserveerd voor de bekendmaking van wetten en algemene
      maatregelen van bestuur, alsmede voor de bekendmaking van besluiten die de gelding van deze regelingen betreffen,
      zoals in- of uitwerkingtreding, in- of buitenwerkingstelling en vaststelling van toepassingsmomenten. Andere
      koninklijke besluiten (bijvoorbeeld een koninklijk besluit tot ontbinding van de Tweede Kamer of tot schorsing van
      een besluit van een gemeenteraad, alsmede een benoemings- of ontslagbesluit) worden in de Staatscourant geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004287
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004287#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
