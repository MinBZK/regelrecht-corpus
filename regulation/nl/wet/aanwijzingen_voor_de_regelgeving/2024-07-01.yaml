      1 Voor de aanduiding van bedragen in euro's wordt het euroteken ‘€’ gebruikt.

      2 Voor de aanduiding van bedragen in de munteenheden van de Caribische delen van het Koninkrijk worden de volgende
      NEN/ISO-aanduidingen gebruikt:

      a. Aruba (de Arubaanse florin): AWG;

      b. Curaçao en Sint Maarten (de Nederlands-Antilliaanse gulden): ANG;

      c. Bonaire, Sint Eustatius en Saba (de Amerikaanse dollar): USD.


          **Toelichting**
          Tussen de valuta-aanduiding en het bedrag wordt, ook bij gebruik van het euroteken, een spatie geplaatst.
      Duizendtallen worden steeds met een punt gescheiden. Als decimaalteken wordt ook bij bedragen in dollars de komma
      gebruikt.

