  - number: '4.24'
    text: |-
      1 Een regeling heeft een citeertitel, tenzij aan aanhaling van de regeling in de praktijk geen behoefte zal
      bestaan.

      2 Een wijzigingsregeling heeft slechts een citeertitel indien daaraan behoefte bestaat.

      3 Indien naar verwachting de behoefte zal bestaan een regeling veelvuldig met een afkorting aan te halen, wordt in
      de toelichting bij de regeling een aanbeveling gegeven voor de te gebruiken afkorting.


          **Toelichting**
          **Tweede lid.** Bij zeer uitgebreide of belangrijke wijzigingsregelingen of bij wijzigingsregelingen die naast
      wijzigingen ook veel zelfstandige bepalingen bevatten, kan het wenselijk zijn dat die regelingen een citeertitel
      hebben. Bijvoorbeeld: [Aanpassingswet Awb III][ref1], [Leemtewet Awb][ref2], Wet beursgang KPN, Wet afschaffing
      adviesverplichtingen.
          Ook met het oog op het aanhalen van een wijzigingsregeling in overgangsrecht of een andere regeling
      kan het handig zijn om de wijzigingsregeling een citeertitel te geven. In dat geval behoeven niet – zoals
      [aanwijzing 3.37][ref3] voor regelingen zonder citeertitel voorschrijft – de datum van vaststelling van de regeling
      en de vindplaats in het Staatsblad of de Staatscourant te worden vermeld, die mogelijk nog niet bekend zijn. Zie
      ook [aanwijzing 3.45, tweede en derde lid][ref4].
          **Derde lid.**Verwijzing naar een regeling door middel van een standaardafkorting kan alleen geschieden in
      memories van toelichting, nota's e.d. Verwijzingen in de wetteksten naar een andere regeling vinden steeds plaats
      door aanhaling van de (citeer)titel van die regeling. Zie ook [aanwijzing 4.50][ref5].


