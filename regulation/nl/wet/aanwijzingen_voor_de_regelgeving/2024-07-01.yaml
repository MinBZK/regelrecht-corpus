      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 9.8.a
    text: |-
      de te implementeren bindende EU-rechtshandeling de Nederlandse wetgever bij de uitvoering minder ruimte laat voor
      het maken van keuzen van beleidsinhoudelijke aard;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.8
  - number: 9.8.b
    text: de te implementeren bindende EU-rechtshandeling gedetailleerder van aard is;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.8
  - number: 9.8.c
    text: |-
      de termijn waarbinnen volgens de te implementeren bindende EU-rechtshandeling de implementatie moet geschieden
      korter is;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.8
  - number: 9.8.d
    text: |-
      verwacht mag worden dat in de toekomst de te implementeren bindende EU-rechtshandelingen vaker wijzigingen zal
      ondergaan;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.8
  - number: 9.8.e
    text: |-
      in het bestaande systeem van regelgeving waarin de implementatieregeling een plaats zal krijgen, vaker is gekozen
      voor delegatie van regelgevende bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.8
  - number: '9.9'
    text: |-
      Bepalingen van een EU-verordening worden niet in nationale regelingen overgenomen, tenzij daarvoor een bijzondere
      reden bestaat.
          **Toelichting**
          Een verordening is rechtstreeks toepasselijk in de lidstaten van de Europese Unie. Om deze rechtstreekse
      werking te garanderen is het in beginsel niet toegestaan om bepalingen van een EU-verordening over te nemen in
      nationale regelingen. Een bijzondere reden kan echter gelegen zijn in de omstandigheid dat de verordening een
      uitdrukkelijke opdracht tot het treffen van uitvoeringsmaatregelen bevat of dat anders in ernstige mate afbreuk
      wordt gedaan aan de begrijpelijkheid van een nationale regeling. Vaak is implementatie van de verordening
      nog noodzakelijk in de zin dat in nationale regelgeving nog bepalingen moeten worden opgenomen betreffende
      sanctionering, rechtsbescherming en aanwijzing van met de uitvoering van de verordening belaste instanties en met
      de verordening strijdige regelgeving moet worden aangepast. Bij het ontwerpen van dergelijke nationale regelingen
      moet veel zorgvuldigheid worden betracht, opdat wordt voorkomen dat de inhoud van de verordening door de nationale
      maatregelen wordt gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.9
  - number: 9.10.1
    text: |-
      Het verwijzen naar een bepaling van een bindende EU-rechtshandeling zoals deze met inbegrip van toekomstige
      wijzigingen zal luiden (dynamische verwijzing), geschiedt door de enkele verwijzing in de tekst van de
      implementatieregeling naar de tekst van de Europese bepaling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.10
  - number: 9.10.2
    text: |-
      Bij een dynamische verwijzing naar bepalingen van een EU-richtlijn wordt afzonderlijk aangegeven vanaf welk
      tijdstip wijzigingen van de desbetreffende bepalingen doorwerken in het Nederlandse recht. Hiervoor wordt in
      de implementatieregeling het volgende model gebruikt: *Een wijziging van [aanduiding van (bepaling uit) de EU-
      richtlijn waarnaar is verwezen] gaat voor de toepassing van [aanduiding van de nationale regeling of de nationale
      bepaling waarin de verwijzing is opgenomen] gelden met ingang van de dag waarop aan de betrokken wijziging
      uitvoering moet zijn gegeven.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.10
  - number: 9.10.3
    text: |-
      Indien het gewenst is dat een ander tijdstip kan worden gekozen, wordt aan het model, onder vervanging van de
      punt aan het slot door een komma, de volgende zinsnede toegevoegd: *tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.10
  - number: 9.10.4
    text: |-
      Het verwijzen naar een bepaling van een bindende EU-rechtshandeling zoals die op een bepaald moment luidt
      (statische verwijzing), geschiedt door verwijzing naar de tekst van die bepaling volgens de volgende voorbeelden:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.10
  - number: 9.10.4.A
    text: |-
      *Richtlijn 2006/123/EG van het Europees Parlement en de Raad van 12 december 2006 betreffende diensten op de
      interne markt, naar de tekst zoals deze bij die richtlijn is vastgesteld.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.10
  - number: 9.10.4.B
    text: |-
      *Richtlijn 2009/138/EG van het Europees Parlement en de Raad van 25 november 2009 betreffende de toegang tot en
      uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II), zoals laatstelijk gewijzigd bij
      Richtlijn (EU) 2016/2341 van het Europees Parlement en de Raad van 14 december 2016.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.10
  - number: '9.11'
    text: 'In de eerste alinea van de toelichting bij een implementatieregeling wordt vermeld:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.11
  - number: 9.11.a
    text: |-
      dat de regeling strekt tot implementatie, met een verwijzing naar de bindende EU-rechtshandeling overeenkomstig
      [aanwijzing 3.42][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.11
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 9.11.b
    text: de uiterste datum waarop de implementatie moet zijn gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.11
  - number: 9.11.c
    text: een verwijzing naar het onderdeel van de toelichting waarin de transponeringstabel is opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.11
  - number: 9.12.1
    text: |-
      De toelichting bij een regeling ter implementatie van een bindende EU-rechtshandeling bevat een transponeringstabel
      waaruit blijkt of en hoe de afzonderlijke bepalingen van de desbetreffende bindende EU-rechtshandeling zijn
      of worden geïmplementeerd. De transponeringstabel bevat een verwijzing naar de desbetreffende bindende EU-
      rechtshandeling overeenkomstig [aanwijzing 3.42][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.12
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 9.12.2
    text: |-
      Indien een bepaling uit de desbetreffende bindende EU-rechtshandeling ruimte laat voor, dan wel verplicht tot het
      maken van beleidskeuzes, wordt dit in de transponeringstabel aangegeven en wordt verwezen naar de passages in de
      toelichting waarin de door de regering gemaakte keuzes worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.12
  - number: 9.12.3
    text: |-
      Indien een bepaling uit een bindende EU-rechtshandeling geen implementatie behoeft, wordt dit vermeld in de
      transponeringstabel. Hierbij wordt aangegeven wat de reden daarvan is, en wordt indien noodzakelijk verwezen naar
      de passages in de toelichting waar daar nader op wordt ingegaan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.12
  - number: 9.12.4
    text: De transponeringstabel maakt onderdeel uit van de toelichting bij de implementatieregeling.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.12
  - number: '9.13'
    text: |-
      Indien een bindende EU-rechtshandeling implementatie behoeft en aan deze verplichting reeds uitvoering wordt
      gegeven door middel van bestaand recht, doet de eerstverantwoordelijke bewindspersoon onverwijld na het van kracht
      worden van de desbetreffende bindende EU-rechtshandeling mededeling in de Staatscourant van:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.13
  - number: 9.13.a
    text: de te implementeren bindende EU-rechtshandeling;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.13
  - number: 9.13.b
    text: |-
      de bestaande nationale regelingen door middel waarvan reeds aan de te implementeren bindende EU-rechtshandeling
      wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.13
  - number: 9.13.c
    text: |-
      de datum met ingang waarvan de te implementeren regeling in de Nederlandse rechtsorde van toepassing is dan wel
      vanaf welk tijdstip wijzigingen van de desbetreffende bepalingen van de bindende EU-rechtshandeling doorwerken in
      het Nederlandse recht;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.13
  - number: 9.13.d
    text: |-
      de in [aanwijzing 9.12][ref1] bedoelde transponeringstabel.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.13
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: 9.14.1
    text: |-
      Zij die deelnemen aan de voorbereiding van of de onderhandelingen over bindende EU-rechtshandelingen dragen er zorg
      voor dat de wetgevingsafdelingen van de betrokken ministeries daarbij worden ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.14
  - number: 9.14.2
    text: |-
      De inschakeling vindt plaats in een zo vroeg mogelijk stadium, doch uiterlijk bij de invulling van het in
      [aanwijzing 9.15][ref1] bedoelde formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.14
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: 9.15.1
    text: |-
      Met betrekking tot een aan Nederland toegezonden voorstel voor een bindende EU-rechtshandeling vult het
      eerstverantwoordelijke ministerie op verzoek van de Werkgroep beoordeling nieuwe Commissievoorstellen het daarvoor
      bestemde fiche in.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.15
  - number: 9.15.2
    text: |-
      Indien meer ministeries bij de uitvoering van de desbetreffende bindende EU-rechtshandeling zijn betrokken,
      geschiedt de invulling in overeenstemming met die ministeries.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.15
  - number: 9.15.3
    text: |-
      De invulling geschiedt door of in overeenstemming met de wetgevingsafdeling van het voor de implementatie
      eerstverantwoordelijke ministerie.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.15
  - number: 9.15.4
    text: De ingevulde formulieren berusten bij het secretariaat van de Werkgroep beoordeling nieuwe Commissievoorstellen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.15
  - number: 9.16.1
    text: |-
      Bij nieuwe voorstellen voor bindende EU-rechtshandelingen wordt door de eerstverantwoordelijke minister
      steeds bezien of er aanleiding is om ten behoeve van de bepaling van het Nederlandse standpunt adviescolleges
      en representatieve organisaties van belanghebbenden te raadplegen die de regering zou horen indien het
      regeringsvoorstellen betrof.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.16
  - number: 9.16.2
    text: |-
      In beginsel wordt over het ontwerp van een implementatieregeling geen advies gevraagd of extern overleg gevoerd en
      wordt een zodanig ontwerp niet voorgepubliceerd, ter inzage gelegd of anderszins extern bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.16
  - number: 9.17.1
    text: |-
      Indien vereist, wordt van een voorstel voor een EU-richtlijn door of in overeenstemming met de wetgevingsafdeling
      van het eerstverantwoordelijke ministerie een implementatieplan opgesteld, zo nodig samen met andere betrokken
      ministeries.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.17
  - number: 9.17.2
    text: |-
      Het implementatieplan wordt uiterlijk binnen twee maanden na vaststelling van de desbetreffende EU-richtlijn bij de
      ICER-I ingediend.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.17
  - number: 9.17.3
    text: |-
      Het implementatieplan geeft zo gedetailleerd mogelijk weer op welke wijze de betrokken EU-richtlijn zal worden
      geïmplementeerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.17
  - number: 9.17.4
    text: |-
      Het eerstverantwoordelijke ministerie verwerkt de gegevens van het implementatieplan in de interdepartementale
      implementatiedatabase.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.17
  - number: 9.18.1
    text: |-
      Indien voor implementatie van een bindende EU-rechtshandeling een algemene maatregel van bestuur nodig is, wordt
      het ontwerp daarvoor ten minste 9 maanden voor afloop van de implementatietermijn aan de ministerraad voorgelegd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.18
  - number: 9.18.2
    text: |-
      Indien voor implementatie van een bindende EU-rechtshandeling een wet nodig is, wordt een voorstel daarvoor ten
      minste 18 maanden voor afloop van de implementatietermijn aan de ministerraad voorgelegd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.18
  - number: 9.18.3
    text: |-
      In afwijking van het eerste of het tweede lid wordt het ontwerp respectievelijk het voorstel zo snel mogelijk doch
      uiterlijk 2 maanden na vaststelling van de bindende EU-rechtshandeling aan de ministerraad voorgelegd, indien de
      implementatietermijn bij vaststelling korter is dan 9 respectievelijk 18 maanden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.18
  - number: 9.19.1
    text: |-
      Bij de voorbereiding en vaststelling van implementatieregelingen beziet het eerstverantwoordelijke
      ministerie steeds of Europese verplichtingen ertoe noodzaken de Europese Commissie van het ontwerp van de
      implementatieregeling dan wel van de vastgestelde implementatieregeling in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.19
  - number: 9.19.2
    text: |-
      De notificatie van regelingen ter implementatie van EU-richtlijnen geschiedt elektronisch via het daartoe bestemde
      notificatiesysteem van de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.19
  - number: 9.19.3
    text: |-
      De notificatie van regelingen ter implementatie van andere soorten bindende EU-rechtshandelingen geschiedt
      schriftelijk aan het Ministerie van Buitenlandse Zaken, dat de gegevens doorzendt aan de Europese Commissie en in
      voorkomende gevallen tevens aan de Raad van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.19
  - number: 9.19.4
    text: 'Door middel van de notificatie wordt de Europese Commissie in kennis gesteld van:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.19
  - number: 9.19.4.a
    text: de daartoe voorgenomen of vastgestelde implementatieregelingen en de bijbehorende transponeringstabel(len);
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.19
  - number: 9.19.4.b
    text: de bestaande nationale regelingen die reeds aan de te implementeren bindende EU-rechtshandeling voldoen;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.19
  - number: 9.19.4.c
    text: |-
      de datum met ingang waarvan de regelingen ter omzetting van de te implementeren bindende EU-rechtshandeling in de
      Nederlandse rechtsorde van toepassing zijn, of met ingang waarvan de effectieve werking ervan verzekerd is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.19
