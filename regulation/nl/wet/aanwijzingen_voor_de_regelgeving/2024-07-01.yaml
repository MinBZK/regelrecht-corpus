  - number: '5.61'
    text: |-
      1 Een nieuwe regeling is niet slechts van toepassing op hetgeen na haar inwerkingtreding voorvalt, doch ook op
      hetgeen bij haar inwerkingtreding bestaat, zoals bestaande rechtsposities en verhoudingen (onmiddellijke werking).

      2 Indien beoogd wordt af te wijken van het eerste lid, wordt dit uitdrukkelijk bepaald.


          **Toelichting**
          Indien in een regeling geen overgangsrecht wordt opgenomen, heeft deze onmiddellijke (ook wel:
      exclusieve) werking. Hieraan kunnen bezwaren kleven. In dat geval kan gekozen worden voor terugwerkende
      kracht ([aanwijzingen 5.62][ref1] en [5.63][ref2]) of voor eerbiedigende dan wel uitgestelde werking
      ([aanwijzing 5.64][ref3]). Afwijkingen van de hoofdregel dienen in beginsel in de regeling zelf te worden
      neergelegd. Dit is evenwel niet altijd nodig. Er kunnen algemene bepalingen van overgangsrecht bestaan, zoals
      [artikel 1, tweede lid, van het Wetboek van Strafrecht][ref4], [artikel 16 van de Grondwet][ref5], artikel 15 IVBPR
      en artikel 7 EVRM. Op grond van deze bepalingen kunnen feiten die vóór de inwerkingtreding zijn geschied, niet
      strafbaar of zwaarder strafbaar worden gesteld.
          In de jurisprudentie is ook wel eens aanvaard dat uit een regeling een afwijking van de hoofdregel moet worden
      afgeleid (HR 7 maart 1979, ECLI:NL:HR:1979:AB7440). Het is echter niet wenselijk bij het ontwerpen van een nieuwe
      regeling van deze mogelijkheid uit te gaan.
          Voor de beoordeling in hoeverre afwijking van de hoofdregel noodzakelijk is, dient de ontwerper van een
      regeling zich de maatschappelijke gevolgen daarvan voor te stellen. Punten van overweging zijn daarbij het
      vertrouwensbeginsel, de redelijkheid en billijkheid, de rechtszekerheid en het verrassingseffect (zie ook
      [aanwijzing 5.62][ref6]).
          Het is niet altijd noodzakelijk op de gehele regeling van toepassing zijnde overgangsbepalingen te ontwerpen;
      per onderdeel van een regeling kunnen verschillende overgangsregelingen gelden.


