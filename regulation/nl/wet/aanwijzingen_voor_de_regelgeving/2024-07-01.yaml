  - number: '8.5'
    text: |-
      De opstelling van de authentieke Nederlandse tekst van een verdrag of van de Nederlandse vertaling geschiedt door
      of onder verantwoordelijkheid van de afdeling Verdragen van de Directie Juridische Zaken van het Ministerie van
      Buitenlandse Zaken.
