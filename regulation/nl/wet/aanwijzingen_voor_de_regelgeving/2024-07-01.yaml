  - number: '5.40'
    text: |-
      Als bestuurlijke sancties worden met name de volgende mogelijkheden overwogen: intrekken of schorsen van een
      beschikking, opleggen van een last onder bestuursdwang, opleggen van een last onder dwangsom of opleggen van een
      bestuurlijke boete.


          **Toelichting**
          Er zijn vier bestuurlijke sancties die vanwege hun algemene karakter in een groot aantal gevallen en voor
      regelgeving van uiteenlopende aard in aanmerking komen als handhavingsmiddel. Voor het verlenen van de bevoegdheid
      tot het toepassen van een last onder bestuursdwang en een last onder dwangsom (beide herstelsancties) is in
      [aanwijzing 5.42][ref1] een model opgenomen. [Titel 5.3 Awb][ref2] (herstelsancties) bevat algemene regels over
      het opleggen van een last onder bestuursdwang ([afdeling 5.3.1][ref3]) en het opleggen van een last onder dwangsom
      ([afdeling 5.3.2][ref4]). Een bevoegdheid tot toepassing van een last onder bestuursdwang impliceert automatisch
      een bevoegdheid tot het opleggen van een last onder dwangsom (zie [artikel 5:32, eerste lid, Awb][ref5]). Het
      opleggen van een bestuurlijke boete (bestraffende sanctie) is geregeld in [titel 5.4 Awb][ref6].
          De [titels 5.3][ref7] en [5.4 Awb][ref8] gelden niet in Bonaire, Sint Eustatius en Saba. In een regeling die
      (mede) voor die eilanden geldt, moet worden voorzien in een nadere regeling van de bevoegdheid tot het toepassen
      van bestuursdwang of het opleggen van een last onder dwangsom.
          Bij het verlenen van de bevoegdheid tot het opleggen van een bestuurlijke boete worden de artikelen 6 en
      7 EVRM en de artikelen 14 en 15 IVBPR in acht genomen (zie hiervoor met name de memorie van toelichting bij de
      Vierde tranche [Algemene wet bestuursrecht][ref9], Kamerstukken II 2003/04, 29702, nr. 3, p. 117 e.v.). Zie ook
      [aanwijzing 2.7][ref10].


