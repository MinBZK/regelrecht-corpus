  - number: '4.20'
    text: |-
      Een koninklijk besluit tot vaststelling van het tijdstip van inwerkingtreding van een wet of een algemene maatregel
      van bestuur voorziet niet in zijn eigen inwerkingtreding.


          **Toelichting**
          Een dergelijk koninklijk besluit geldt zodra het is bekendgemaakt (vgl. [aanwijzing 4.19][ref1]).
          Dit geldt ook in het geval dat, al dan niet tezamen met het vaststellen van een tijdstip van inwerkingtreding
      van een wet of een algemene maatregel van bestuur, bij koninklijk besluit een ander op grond van de wet of de
      algemene maatregel van bestuur vast te stellen tijdstip wordt bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
