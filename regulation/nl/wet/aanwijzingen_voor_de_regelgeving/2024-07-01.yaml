  - number: '4.8'
    text: |-
      Voor de aanhef van een ministeriële regeling wordt het volgende model gebruikt:

      *De Minister van/voor .../ Staatssecretaris van ...,*

      *[Handelende in overeenstemming met de Minister(s) van/voor... / Staatssecretaris(sen) van ... / in overeenstemming
      met het gevoelen van de ministerraad];*

      *Gelet op ...;*

      *Besluit:*


          **Toelichting**
          De zinsnede over de medebetrokkenheid (‘handelende in overeenstemming met’) wordt alleen opgenomen,
      indien zij van toepassing is. De zinsnede ‘handelende in overeenstemming met het gevoelen van de
      ministerraad’ wordt opgenomen indien – bijvoorbeeld ter voldoening aan een wettelijk voorschrift (vgl.
      [artikel 2.4 van de Wet normering topinkomens][ref1]) – over een ministeriële regeling besluitvorming in de
      ministerraad heeft plaatsgevonden.
          Indien een ministeriële regeling is gebaseerd op de regelgevende bevoegdheid van twee of meer ministers,
      worden in de eerste regel van de aanhef alle ministers (of fungerende staatssecretarissen) genoemd die de regeling
      vaststellen: De Minister van/voor ... en de Minister van/voor ...’. Tevens wordt in dat geval ‘Besluit:’ vervangen
      door de meervoudsvorm ‘Besluiten:’. Zie voor gezamenlijke regelingen ook [aanwijzing 4.33][ref2]. De formulering
      ‘mede namens’ wordt vanwege de specifieke betekenis die deze formulering heeft in de aanhef van wetten en
      koninklijke besluiten (zie [aanwijzing 4.33][ref3]), in de aanhef van ministeriële regelingen vermeden.
          Zie voor ‘gelet op’ [aanwijzing 4.10][ref4]. Zie ook [aanwijzing 3.18][ref5] (aanduiding ‘ministeriële
      regeling’).


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
