  - number: '5.46'
    text: |-
      Ten aanzien van elk strafbaar feit dat door een wet in het leven wordt geroepen of dat krachtens een wet bij lagere
      regeling in het leven kan worden geroepen, wordt in de wet aangegeven of het een misdrijf of een overtreding is.
      Daarvoor worden de volgende modellen gebruikt:

      A. *De in artikel ... strafbaar gestelde feiten zijn misdrijven.*

      B. *De [in / krachtens] artikel ... strafbaar gestelde feiten zijn overtredingen.*


          **Toelichting**
          Strafbare feiten die als misdrijf kwalificeren kunnen slechts bij wet in het leven worden geroepen. De
      delictsomschrijving wordt dan in de wet zelf opgenomen. Bij overtredingen kan, indien de wet de omschrijving van
      het strafbare feit aan een lagere regeling overlaat, de delictsomschrijving ook in die lagere regeling worden
      opgenomen.
          Indien het economische delicten betreft, behoeft alleen indien zij worden vermeld in
      [artikel 1, onder 3°, Wed][ref1], te worden aangegeven of er sprake is van een misdrijf of een overtreding. Voor
      het overige wordt in [artikel 2 Wed][ref2] zelf geregeld of er sprake is van een misdrijf of een overtreding (zie
      verder [aanwijzing 5.47][ref3]). De [Wed][ref4] is niet van toepassing in Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0002063
