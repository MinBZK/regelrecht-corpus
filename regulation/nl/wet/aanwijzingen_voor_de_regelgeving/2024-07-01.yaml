  - number: '2.20'
    text: |-
      1 In ieder geval worden in de wet opgenomen voorschriften ten aanzien van onderwerpen waarvoor de [Grondwet][ref1]
      een regeling bij wet eist en geen delegatie toelaat.

      2 Een in de [Grondwet][ref2] neergelegd verbod tot delegatie houdt in dat:

      a. alle wezenlijke bepalingen ten aanzien van het betrokken onderwerp in de wet worden vastgelegd; en

      b. in de wet niet wordt volstaan met het toekennen van algemene bestuursbevoegdheden waarvan de invulling geheel of
      grotendeels aan bestuursorganen wordt overgelaten.


          **Toelichting**
          Als voorbeelden van voorschriften waarvoor de [Grondwet][ref3] eist dat deze bij wet worden vastgesteld, kunnen
      worden genoemd regelingen, inhoudende beperkingen van bepaalde grondrechten ([artikelen 2, vierde lid][ref4],
      [4][ref5], [6][ref6], [7, eerste en derde lid][ref7], [8][ref8], [9][ref9], [12, tweede lid][ref10],
      en [13][ref11]), vaststelling van straffen die de rechter ter zake van een delict kan opleggen
      ([artikel 89, tweede lid][ref12]) en regeling van de berechting van andere dan civielrechtelijke geschillen
      ([artikel 112, tweede lid][ref13]).
          Delegatie is slechts toegestaan, indien in de [Grondwet][ref14] de formulering ‘bij of krachtens de wet’ of
      enigerlei vorm van het werkwoord ‘regelen’ of de zelfstandige naamwoorden ‘regels’ of ‘regeling’ zijn gebruikt.
      Een grondwettelijk delegatieverbod laat overigens onverlet dat het stellen van als uitvoering te beschouwen regels
      over details toch aan een lagere regelgever mag worden overgelaten (zie [aanwijzing 2.26][ref15]), met uitzondering
      van grondwettelijke delegatieverboden inzake klassieke grondrechten (zie Kamerstukken II 1975/76, 13872, nr.
      3, p. 22 e.v.). Laat de [Grondwet][ref16] wel delegatie toe, dan dient een afweging plaats te vinden zoals in
      [aanwijzing 2.19][ref17] is beschreven.
          Een bijzonder geval wordt gevormd door [artikel 104 van de Grondwet][ref18], waarin wordt bepaald dat
      belastingen van het Rijk worden geheven uit kracht van een wet. Met de formulering ‘uit kracht van een wet’ wordt
      aangegeven dat delegatie ten aanzien van rijksbelastingen wel is toegestaan maar slechts in zeer beperkte mate.
      Onderwerpen als belastinggrondslag, het belastbare feit, de kring van belastingplichtigen en de basis van het
      tarief dienen in ieder geval in de wet zelf te worden vastgelegd. Zie verder Kamerstukken II 1978/79, 15575, nrs.
      1–5, p. 4–5.
          Een ander bijzonder geval betreft [artikel 23 van de Grondwet][ref19] (onderwijsartikel). Uit de
      totstandkomingsgeschiedenis van dat artikel vloeit voort dat de grondwettelijke delegatieterminologie op dat
      artikel niet van toepassing is (zie Kamerstukken II 1982/83, 17450, nr. 5, p. 4).


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0001840
