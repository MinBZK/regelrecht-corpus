  - number: '2.17'
    text: |-
      Als algemeen verbindend voorschrift, vastgesteld vanwege het Rijk, wordt beschouwd een naar buiten werkende
      algemene regel, vastgesteld bij of krachtens wet dan wel, in bijzondere gevallen, bij of krachtens zelfstandige
      algemene maatregel van bestuur.
          **Toelichting**
          De in deze aanwijzing opgenomen omschrijving van het begrip algemeen verbindend voorschrift is gebaseerd op de
      huidige stand van de jurisprudentie.
          Naast algemeen verbindende voorschriften behoren interne regels en beleidsregels tot de algemene regels,
      vastgesteld vanwege het Rijk. Bij interne regels ontbreekt het element ‘naar buiten werkende’ van algemeen
      verbindende voorschriften. Voorbeelden van interne regels zijn het [reglement van orde voor de ministerraad][ref1],
      de Aanwijzingen voor de regelgeving en de Gedragscode Integriteit Rijk 2016. Zie voor de omschrijving van het
      begrip ‘beleidsregel’ [artikel 1:3, vierde lid, Awb][ref2].
          Zie met betrekking tot de zelfstandige algemene maatregel van bestuur [aanwijzing 2.22][ref3].
          Consequentie van deze aanwijzing is ook dat algemeen verbindende voorschriften zonder delegatie door een wet of
      een algemene maatregel van bestuur niet kunnen worden vastgesteld bij ministeriële regeling.
          Algemeen verbindende voorschriften hoeven niet van het Rijk afkomstig te zijn. Zij kunnen ook zijn neergelegd
      in bindende EU-rechtshandelingen en besluiten van decentrale overheden en openbare lichamen als bedoeld in
      [artikel 134 van de Grondwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006501
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0001840#Artikel134
