  - number: '7.3'
    text: |-
      1 Bij de voorbereiding van een regeling die een koninkrijksaangelegenheid betreft, vindt overleg plaats met de
      kabinetten van de Gevolmachtigde Ministers van Aruba, Curaçao en Sint Maarten. Het Ministerie van Binnenlandse
      Zaken en Koninkrijksrelaties wordt van contacten met de kabinetten van de Gevolmachtigde Ministers op de hoogte
      gehouden.

      2 Het eerste lid is eveneens van toepassing bij de voorbereiding van een regeling ten aanzien waarvan concordantie
      is voorgeschreven.


          **Toelichting**
          **Eerste lid.**Zie met betrekking tot aangelegenheden van het Koninkrijk
      [artikel 3 van het Statuut voor het Koninkrijk][ref1]. Ook bij twijfel of een onderwerp als
      koninkrijksaangelegenheid moet worden behandeld, is het wenselijk contact te zoeken met de directie Constitutionele
      Zaken en Wetgeving van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.
          **Tweede lid.**Dit lid houdt verband met het in [artikel 39 van het Statuut voor het Koninkrijk][ref2]
      neergelegde ‘concordantiebeginsel’. Als onderwerpen die in Nederland, Aruba, Curaçao en Sint Maarten zoveel
      mogelijk op overeenkomstige wijze geregeld moeten worden, noemt [artikel 39 van het Statuut][ref3]: het burgerlijk
      en handelsrecht, het strafrecht, de strafvordering, het auteursrecht, de industriële eigendom, het notarisambt en
      regelgeving inzake maten en gewichten.


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002154#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0002154#Artikel39
