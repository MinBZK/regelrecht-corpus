  - number: '3.61'
    text: |-
      Bij een regeling wordt geen bijlage opgenomen, tenzij het gaat om de vaststelling van een tabel, formulier, model,
      kaart of lijst van regelingen of bepalingen dan wel dit anderszins onvermijdelijk is.


          **Toelichting**
          De inhoud van een bijlage is in gelijke mate bindend als de regeling waarbij zij behoort. Bijlagen waarin
      louter toelichtende informatie wordt verschaft, behoren niet bij een regeling te worden opgenomen. Eventueel kunnen
      dergelijke bijlagen worden opgenomen bij de toelichting op de regeling.
          Het gebruik van bijlagen kan aangewezen zijn bij een regeling die vanwege de omvang daarvan in meerdere
      bestanden gescheiden moet kunnen worden. Zie ook [aanwijzing 4.28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.61
