  - number: 8.20.4
    text: |-
      Indien de voorgaande leden niet in acht genomen kunnen worden, wordt dit bij de overlegging dan wel de kennisgeving
      door de Minister van Buitenlandse Zaken uitdrukkelijk en gemotiveerd vermeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.20
  - number: '8.21'
    text: |-
      Voordat de Minister van Buitenlandse Zaken, na verkregen parlementaire goedkeuring, de binding van het Koninkrijk
      voor enig deel daarvan aan een verdrag tot stand doet brengen, vergewist de afdeling Verdragen van de Directie
      Juridische Zaken zich ervan bij de medebetrokken ministeries en in voorkomend geval bij de Gevolmachtigde Ministers
      van Aruba, Curaçao en Sint Maarten dat er geen bezwaar bestaat tegen de totstandbrenging van de binding voor dat
      deel van het Koninkrijk.
          **Toelichting**
          Het kan zich voordoen dat het direct tot stand brengen van de binding niet opportuun is, bijvoorbeeld omdat
      dit gemeenschappelijk in EU-kader dient plaats te vinden of omdat nog uitvoeringsmaatregelen moet worden getroffen.
      Voorts zou het kunnen voorkomen dat door plotseling veranderende omstandigheden de totstandbrenging van de binding
      niet meer opportuun is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel8.21
  - number: '9.1'
    text: |-
      Onder implementatie wordt in dit hoofdstuk verstaan: de uitvoering van bindende EU-rechtshandelingen in het
      nationale recht door middel van het vaststellen van algemeen verbindende voorschriften.
          **Toelichting**
          De in hoofdstuk 9 opgenomen aanwijzingen hebben tot doel de tijdige en juiste implementatie van bindende EU-
      rechtshandelingen te realiseren (zie voor het begrip bindende EU-rechtshandelingen [aanwijzing 1.3][ref1]).
      Ten behoeve van implementatie kunnen zowel regelgevende als niet-regelgevende activiteiten noodzakelijk zijn
      (bijvoorbeeld de toepassing en handhaving en het verrichten van de implementatiemelding). In dit hoofdstuk wordt
      met implementatie in het bijzonder gedoeld op het treffen van de maatregelen van intern recht die een lidstaat
      van de Europese Unie neemt ter uitvoering van bindende EU-rechtshandelingen (in EU-verband wordt hier gewoonlijk
      de term transpositie voor gebruikt). De implementatie van EU-richtlijnen is pas afgerond indien de melding aan
      de Europese Commissie is voltooid (zie [aanwijzing 9.19][ref2]). Dit hoofdstuk ziet op regelgevende activiteiten,
      zoals:
          het vastleggen van te waarborgen rechten en verplichtingen;
      het aanpassen van strijdige regelgeving;
      het creëren van noodzakelijke uitvoerings- en handhavingsstructuren (bijvoorbeeld het aanwijzen van een
      toezichthouder).
          Deze aanwijzingen zijn als zodanig niet slechts van belang voor (wetgevings)juristen, maar voor een ieder die
      bij de voorbereiding en implementatie van bindende EU-rechtshandelingen is betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk1
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '9'
        paragraaf: '9.3'
  - number: '9.2'
    text: |-
      De [hoofdstukken 2 tot en met 8][ref1] zijn van toepassing op de voorbereiding en totstandkoming van regelingen ter
      implementatie van bindende EU-rechtshandelingen, voor zover hiervan niet wordt afgeweken in dit hoofdstuk.
          **Toelichting**
          Voor een aantal onderwerpen, zoals delegatie van regelgevende bevoegdheid of procedures, geldt dat dit
      hoofdstuk 9 bijzondere regels geeft, specifiek voor implementatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '2'
  - number: '9.3'
    text: |-
      Indien de te implementeren bindende EU-rechtshandeling tevens geldt voor de Europese Economische Ruimte
      of Zwitserland, wordt hier rekening mee gehouden bij de vaststelling van het toepassingsbereik van de
      implementatieregeling.
          **Toelichting**
          Op grond van de Overeenkomst betreffende de Europese Economische Ruimte en de Overeenkomsten tussen de EU en
      Zwitserland wordt door het Gemengd Comité van de Europese Economische Ruimte, respectievelijk het Gemengd Comité
      van de EU-Zwitserland, bepaald of nieuwe bindende EU-rechtshandelingen op het terrein van de Overeenkomsten in de
      bijlagen bij de Overeenkomsten worden opgenomen en daarmee ook van kracht worden in niet-EU-lidstaten die partij
      zijn bij de Overeenkomsten. De desbetreffende EU-rechtshandeling moet bij afzonderlijk besluit van het Gemengd
      Comité van toepassing worden verklaard. Deze besluiten worden gepubliceerd in het Publicatieblad. Zie bijvoorbeeld
      het Besluit van het Gemengd Comité van de EER nr. 153/2014 van 9 juli 2014 tot wijziging van bijlage X (Algemene
      diensten) bij de EER-overeenkomst [2015/88].
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.3
  - number: '9.4'
    text: |-
      Bij implementatie worden in de implementatieregeling geen andere regels opgenomen dan voor de implementatie
      noodzakelijk zijn.
          **Toelichting**
          Gelet op de noodzaak van tijdige implementatie wordt vermeden dat de implementatie van bindende EU-
      rechtshandelingen wordt ‘meegenomen’ in een bredere herziening van de desbetreffende regelgeving of dat in de
      implementatieregeling ‘extra’ nationaal beleid wordt meegenomen. Bij dit laatste gaat het met name om regels
      die geen verband houden met de bindende EU-rechtshandeling en om nodeloze verfijningen ten opzichte van die
      regelgeving. Ook moet in het algemeen worden vermeden te wachten op een volgende wijziging van de desbetreffende
      bindende EU-rechtshandeling teneinde deze in de implementatieregeling mee te nemen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.4
  - number: 9.5.1
    text: |-
      Bij implementatie wordt gekozen voor de implementatiewijze die de minste lasten oplegt aan de door de regeling
      geraakte bedrijven.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.5
  - number: 9.5.2
    text: |-
      Bij afwijking van het eerste lid wordt dit expliciet vermeld in de toelichting en worden de overwegingen geschetst
      die tot deze keuze hebben geleid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.5
  - number: '9.6'
    text: |-
      Bepalingen uit bindende EU-rechtshandelingen die verplichten tot feitelijk handelen van de centrale overheid zonder
      dat derden daarop aanspraak hoeven te kunnen maken, worden niet geïmplementeerd.
          **Toelichting**
          Dergelijke bepalingen (bijvoorbeeld een notificatieverplichting van de lidstaat aan de Europese Commissie
      of het verzamelen en toezenden van gegevens aan de Europese Commissie) behoeven geen implementatie omdat de
      verplichting daartoe reeds rechtstreeks voortvloeit uit de EU-rechtshandeling die verbindend is voor de lidstaat.
      Ook bepalingen die zich richten tot EU-instellingen komen naar hun aard niet voor implementatie in aanmerking.
      Dit laat onverlet dat duidelijk dient te zijn hoe aan dergelijke verplichtingen invulling zal worden gegeven. Dit
      kan gerealiseerd worden door in de toelichting bij implementatie aandacht te besteden aan de aard en inhoud, de
      geadresseerde en de wijze van uitvoering daarvan.
          Indien voor het kunnen voldoen aan een feitelijke verplichting door Nederland de medewerking van andere
      overheden dan het Rijk, van zelfstandige bestuursorganen, of van particulieren noodzakelijk is, kunnen
      wettelijke voorzieningen wel nodig of wenselijk zijn – zie onder meer HvJ EG C-237/90 (ECLI:EU:C:1992:452) en de
      [artikelen 119 van de Gemeentewet][ref1] en [117 van de Provinciewet][ref2]. Dat geldt ook indien derden (waaronder
      andere lidstaten) zich moeten kunnen beroepen op deze verplichtingen van de overheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel119
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel117
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '119'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '117'
  - number: '9.7'
    text: |-
      Bij implementatie wordt zoveel mogelijk aangesloten bij instrumenten waarin de bestaande regelgeving reeds
      voorziet.
          **Toelichting**
          Alleen al om vertraging bij de implementatie te voorkomen, is het van belang zoveel mogelijk gebruik te
      maken van bestaande, wettelijk geregelde stelsels van vergunningen en ontheffingen, verboden, goedkeuringen,
      handhavingsmechanismen, systemen van rechtsbescherming en dergelijke.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.7
  - number: '9.8'
    text: |-
      Bij de afweging op welk niveau van regeling implementatie dient plaats te vinden, komt, onverminderd de
      [aanwijzingen 2.20][ref1] en [2.21][ref2], delegatie van regelgevende bevoegdheid eerder in aanmerking naarmate:


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.8
    references:
