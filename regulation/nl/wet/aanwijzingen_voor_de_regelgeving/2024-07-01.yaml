  - number: '2.39'
    text: |-
      1 Tijdelijke delegatie blijft beperkt tot gevallen waarin te stellen voorschriften gelet op hun betekenis bij wet
      moeten worden vastgesteld maar de totstandkoming van een wet niet kan worden afgewacht.

      2 Voor tijdelijke delegatie wordt het volgende model gebruikt:

      *Na de plaatsing in [het Staatsblad / de Staatscourant] van een krachtens artikel [...] vastgestelde [algemene
      maatregel van bestuur / ministeriële regeling] wordt een voorstel van wet tot regeling van het betrokken onderwerp
      zo spoedig mogelijk bij de Tweede Kamer der Staten-Generaal ingediend. Indien het voorstel wordt ingetrokken of
      indien een van de beide Kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de [algemene
      maatregel van bestuur / ministeriële regeling] onverwijld ingetrokken. Wordt het voorstel tot wet verheven, dan
      wordt de [algemene maatregel van bestuur / ministeriële regeling] ingetrokken op het tijdstip van inwerkingtreding
      van die wet.*


          **Toelichting**
          **Eerste lid.** Tijdelijke delegatie houdt in dat voorschriften tijdelijk bij een algemene maatregel van
      bestuur of eventueel een ministeriële regeling kunnen worden vastgesteld maar dat deze algemene maatregel van
      bestuur of ministeriële regeling op korte termijn moet worden vervangen door een wet. Voor deze constructie kan
      aanleiding zijn indien met betrekking tot een materie die op zich regeling bij wet behoeft, snelle interventie
      is geboden of anticipatie op nieuwe maatregelen moet worden voorkomen (bijvoorbeeld bij sociaaleconomische
      regelgeving).
          Duidelijk nadeel van de constructie is dat zij dubbel werk oplevert: eerst moeten de voorschriften bij lagere
      regelgeving worden vastgesteld en vervolgens moet nog een regeling bij wet tot stand worden gebracht. Dit nadeel
      wordt ondervangen door delegatie onder het vereiste van goedkeuring bij wet. Zie [aanwijzing 2.40][ref1].
          **Tweede lid.** Het verdient de voorkeur dat in het in de laatste zin van dit lid bedoelde geval de intrekking
      van de algemene maatregel van bestuur of ministeriële regeling wordt geregeld in de betrokken wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.39
