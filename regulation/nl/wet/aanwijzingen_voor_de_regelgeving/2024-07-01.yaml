  - number: '5.27'
    text: |-
      Indien een publiekrechtelijke regeling voorziet in het ontstaan van enigerlei recht dat zich naar zijn aard leent
      voor overgang op anderen, wordt die overgang óf uitgesloten óf geregeld.


          **Toelichting**
          Indien een recht slechts aan een bepaalde (rechts)persoon toe kan komen omdat het strikt persoonsgebonden is
      (bijvoorbeeld rechten voortvloeiend uit inschrijving bij een school, verstrekking van een rijbewijs of inschrijving
      van een bedrijf in een verplicht register) is overgang vanzelfsprekend niet mogelijk. Een expliciete regeling ter
      zake is in dat geval niet nodig. In andere gevallen is het wenselijk dat de regeling duidelijk maakt of de rechten
      die voortvloeien uit de regeling of uit daarop gebaseerde beschikkingen kunnen overgaan op anderen en zo ja, hoe
      dat geschiedt (bijvoorbeeld [artikel 5.37 van de Omgevingswet][ref1], [artikel 70 van de Kernenergiewet][ref2]).
      Indien overgang niet is uitgesloten en een regeling bovendien schaarste creëert of beoogt te creëren moet bij het
      opstellen van de regeling – behalve aan de overgang zelf – ook aandacht worden besteed aan de wenselijkheid van
      handel in de rechten, de handhaving van het stelsel en wijze van ontstaan, verdelen, tenietgaan en registratie
      van die rechten. Zie in dit verband voor een voorbeeld [hoofdstuk V van de Meststoffenwet][ref3] en overigens
      [artikel 3:83, derde lid, BW][ref4]. Zie verder het kabinetsstandpunt bij het eerste rapport van de MDW-werkgroep
      Verhandelbare rechten (Kamerstukken II 1999/2000, 24036, nr. 149) en het kabinetsstandpunt bij het tweede rapport
      ‘Ingrijpen en compenseren?’ (Kamerstukken II 2000/01, 24036, nr. 182).

          Vergunningen en ontheffingen, verleend ingevolge deze wet, zijn persoonlijk en niet overdraagbaar.
      ([Artikel 2:1 van de Wet op het financieel toezicht][ref5])
      Een omgevingsvergunning geldt voor een ieder die de activiteit of activiteiten verricht waarop zij betrekking
      heeft. (...) Als een aangevraagde of verleende omgevingsvergunning zal gaan gelden voor een ander dan de aanvrager
      of de vergunninghouder, meldt de aanvrager of de vergunninghouder dat ten minste een maand van tevoren aan het
      bevoegd gezag. ([Artikel 5.37, eerste en tweede lid, van de Omgevingswet][ref6])


