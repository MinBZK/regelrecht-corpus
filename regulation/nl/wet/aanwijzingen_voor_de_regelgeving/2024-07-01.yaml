  - number: 5.28.1
    text: |-
      Voor zover een regeling die niet strekt tot implementatie van bindende EU-rechtshandelingen, eisen stelt aan
      goederen, keuringen of diensten, wordt tevens een clausule van wederzijdse erkenning opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.28
  - number: 5.28.2
    text: Het eerste lid is niet van toepassing op regelingen die uitsluitend gelden in Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.28
  - number: 5.28.3
    text: |-
      Voor een clausule van wederzijdse erkenning worden de volgende modellen als uitgangspunt genomen: *(Goederen)*
      *Met [aanduiding van de desbetreffende goederen] als bedoeld in [deze wet / dit besluit / deze regeling] worden
      gelijkgesteld [desbetreffende goederen] die rechtmatig zijn vervaardigd of in de handel zijn gebracht in een andere
      lidstaat van de Europese Unie of in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij
      een tot een douane-unie strekkend Verdrag, dan wel rechtmatig zijn vervaardigd in een staat die partij is bij een
      tot een vrijhandelszone strekkend Verdrag dat Nederland bindt, en die voldoen aan eisen die een beschermingsniveau
      bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.* *(Keuringen)*
      *Met een [aanduiding van het desbetreffende document] als bedoeld in [deze wet / dit besluit / deze regeling] wordt
      gelijkgesteld een verklaring van goedkeuring, afgegeven door een onafhankelijke keuringsinstelling in een andere
      lidstaat van de Europese Unie dan wel in een staat, niet zijnde een lidstaat van de Europese Unie, die partij is
      bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, welke verklaring is afgegeven op
      basis van onderzoekingen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met
      de nationale onderzoekingen wordt nagestreefd.* *(Diensten)* *Met de beroepseisen ter zake van [aanduiding van de
      desbetreffende dienst] als bedoeld in [deze wet / dit besluit / deze regeling] worden gelijkgesteld beroepseisen
      die worden gesteld in een andere lidstaat van de Europese Unie dan wel een staat, niet zijnde een lidstaat van de
      Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en
      die een beroepsniveau waarborgen dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt
      nagestreefd.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.28
  - number: 5.29.1
    text: |-
      Een vergunningstelsel in de zin van [artikel 2, eerste lid, van de Dienstenwet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.29
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
  - number: 5.29.1.a
    text: |-
      wordt slechts opgenomen indien dit geen discriminerende werking heeft ten opzichte van de betrokken
      dienstverrichter, dit noodzakelijk is wegens een dwingende reden van algemeen belang, en het nagestreefde doel niet
      door een minder beperkende maatregel kan worden bereikt, met name omdat een controle achteraf te laat zou komen om
      werkelijk doeltreffend te zijn;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.29
  - number: 5.29.1.b
    text: |-
      wordt uitsluitend van de werking van [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref1] uitgezonderd
      wegens dwingende redenen van algemeen belang, met inbegrip van de belangen van derden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: 5.29.2
    text: |-
      Indien de conflictregel van artikel 3 van de Dienstenrichtlijn en
      [artikel 2, derde lid, onder a, sub 3, van de Dienstenwet][ref1] op een vergunningstelsel als bedoeld in het eerste
      lid van toepassing is, wordt dit toegelicht.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.29
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '2'
  - number: 5.29.3
    text: |-
      Indien bij een vergunningstelsel als bedoeld in het eerste lid het aantal beschikbare vergunningen beperkt
      is, wordt een selectieprocedure ingesteld die alle waarborgen voor transparantie en onpartijdigheid biedt voor
      gegadigden, met inbegrip van met name een toereikende bekendmaking van de opening, uitvoering en afsluiting van
      de procedure.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.29
  - number: 5.30.1
    text: |-
      In een regeling die onder de reikwijdte van artikel 16 van de Dienstenrichtlijn valt, worden geen eisen gesteld
      aan de verrichting van diensten door dienstverrichters die in een andere lidstaat van de Europese Unie gevestigd
      zijn, die niet voldoen aan de beginselen van non-discriminatie, noodzakelijkheid wegens redenen van openbare orde,
      openbare veiligheid, de volksgezondheid of de bescherming van het milieu en evenredigheid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.30
  - number: 5.30.2
    text: |-
      In een regeling die onder de reikwijdte van artikel 15, tweede lid, van de Dienstenrichtlijn valt, worden geen
      eisen opgenomen die niet voldoen aan de beginselen van non-discriminatie, noodzakelijkheid wegens een dwingende
      reden van algemeen belang en evenredigheid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.30
  - number: '5.31'
    text: |-
      Indien voor de uitvoering van een regeling gegevens van burgers, bedrijven of instellingen nodig zijn, wordt voor
      de omschrijving van de daaraan ten grondslag liggende begrippen zoveel mogelijk verwezen naar of aangesloten bij de
      definities uit de wetten inzake de basisregistraties.
          **Toelichting**
          Een belangrijk uitgangspunt bij het inrichten van (e-)overheidsdienstverlening is dat van ‘eenmalig aanleveren,
      meervoudig gebruik’ van gegevens. De overheid vraagt van burgers, bedrijven en instellingen geen gegevens waarover
      zij al beschikt. Spiegelbeeld hiervan is dat burgers, bedrijven en instellingen bij bijvoorbeeld het doen van
      belastingaangifte of aanvraag van een vergunning, geen gegevens behoeven te verstrekken die al bij de overheid
      bekend zijn.
          Om dit uitgangspunt in de praktijk te realiseren, is een stelsel van basisregistraties ingericht, waarin
      basisgegevens zijn opgenomen die nodig zijn voor het uitvoeren van verschillende (beslis)processen van
      overheidsorganisaties. Een deel van de gegevens in die basisregistraties is aangemerkt als ‘authentiek’, dat
      wil zeggen dat een overheidsorganisatie in beginsel kan uitgaan van de juistheid van het gegeven en in beginsel
      verplicht is dit te gebruiken bij de uitvoering van zijn taken.
          De genoemde verplichting van overheidsorganisaties en het recht van burgers, bedrijven en instellingen is ten
      aanzien van deze authentieke gegevens expliciet vastgelegd in de verschillende wetten inzake basisregistraties. Zie
      bijvoorbeeld de [Wet basisregistratie personen][ref1] en de [Wet basisregistraties adressen en gebouwen][ref2]. Er
      zijn in totaal 11 basisregistraties. Zie voor meer informatie www.digitaleoverheid.nl.
          Om het uitgangspunt van eenmalig aanleveren, meervoudig gebruik zo breed mogelijk ingang te doen vinden, is
      nodig dat in wetgeving waarin gegevensuitwisseling met de overheid aan de orde is, zoveel mogelijk wordt verwezen
      naar of aangesloten bij begrippen uit de basisregistraties.
          Een overzicht van de basisregistraties en de daarin opgenomen begrippen en authentieke gegevens is opgenomen in
      de Stelselcatalogus. Zie www.stelselcatalogus.nl *.*


      [ref1]: https://wetten.overheid.nl/BWBR0033715
      [ref2]: https://wetten.overheid.nl/BWBR0023466
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.31
    references:
      - id: ref1
