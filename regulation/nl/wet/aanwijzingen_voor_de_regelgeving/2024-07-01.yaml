  - number: 5.38.1
    text: |-
      Indien het in bijzondere gevallen wenselijk wordt geacht ook anderen dan de bij of krachtens
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen algemene opsporingsambtenaren te belasten met
      de opsporing van bepaalde strafbare feiten die geen economisch delict zijn, wordt daarvoor het volgende model
      gebruikt:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.38
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 5.38.1.1
    text: |-
      *Met de opsporing van de bij [artikel / de artikelen ...] strafbaar gestelde feiten zijn, onverminderd [artikel
      141 van het Wetboek van Strafvordering / artikel 184 van het Wetboek van Strafvordering BES], belast [aanduiding
      ambtenaren]. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in [de artikelen
      179 tot en met 182 en 184 van het Wetboek van Strafrecht / de artikelen 185 tot en met 188 en 190 van het Wetboek
      van Strafrecht BES], voor zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of
      ondernomen door henzelf.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.38
  - number: 5.38.1.2
    text: '*Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.38
  - number: 5.38.2
    text: |-
      Aan buitengewoon opsporingsambtenaren worden in beginsel naast de hun op grond van het
      [Wetboek van Strafvordering][ref1] en de [Wet op de economische delicten][ref2] toekomende bevoegdheden geen
      bijzondere opsporingsbevoegdheden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
      [ref2]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.38
    references:
      - id: ref1
        bwb_id: BWBR0001903
      - id: ref2
        bwb_id: BWBR0002063
  - number: 5.39.1
    text: |-
      Het regelen van de mogelijkheid om bij de uitoefening van een bevoegdheid de assistentie van de politie in te
      roepen, geschiedt overeenkomstig het volgende model: *De [omschrijving bevoegde personen] oefenen hun [omschrijving
      bevoegdheid] zo nodig uit met behulp van de sterke arm.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.39
  - number: 5.39.2
    text: |-
      Indien het de bedoeling is taken of bevoegdheden slechts op te dragen aan ambtenaren van politie die executieve
      werkzaamheden verrichten, worden die ambtenaren aangeduid als: *ambtenaren van politie die zijn aangesteld voor de
      uitvoering van de politietaak*.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.39
  - number: 5.39.3
    text: |-
      Indien het de bedoeling is ook andere ambtenaren van politie taken of bevoegdheden op te dragen, worden die
      ambtenaren aangeduid als: *ambtenaren van politie*.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.39
  - number: '5.40'
    text: |-
      Als bestuurlijke sancties worden met name de volgende mogelijkheden overwogen: intrekken of schorsen van een
      beschikking, opleggen van een last onder bestuursdwang, opleggen van een last onder dwangsom of opleggen van een
      bestuurlijke boete.
          **Toelichting**
          Er zijn vier bestuurlijke sancties die vanwege hun algemene karakter in een groot aantal gevallen en voor
      regelgeving van uiteenlopende aard in aanmerking komen als handhavingsmiddel. Voor het verlenen van de bevoegdheid
      tot het toepassen van een last onder bestuursdwang en een last onder dwangsom (beide herstelsancties) is in
      [aanwijzing 5.42][ref1] een model opgenomen. [Titel 5.3 Awb][ref2] (herstelsancties) bevat algemene regels over
      het opleggen van een last onder bestuursdwang ([afdeling 5.3.1][ref3]) en het opleggen van een last onder dwangsom
      ([afdeling 5.3.2][ref4]). Een bevoegdheid tot toepassing van een last onder bestuursdwang impliceert automatisch
      een bevoegdheid tot het opleggen van een last onder dwangsom (zie [artikel 5:32, eerste lid, Awb][ref5]). Het
      opleggen van een bestuurlijke boete (bestraffende sanctie) is geregeld in [titel 5.4 Awb][ref6].
          De [titels 5.3][ref7] en [5.4 Awb][ref8] gelden niet in Bonaire, Sint Eustatius en Saba. In een regeling die
      (mede) voor die eilanden geldt, moet worden voorzien in een nadere regeling van de bevoegdheid tot het toepassen
      van bestuursdwang of het opleggen van een last onder dwangsom.
          Bij het verlenen van de bevoegdheid tot het opleggen van een bestuurlijke boete worden de artikelen 6 en
      7 EVRM en de artikelen 14 en 15 IVBPR in acht genomen (zie hiervoor met name de memorie van toelichting bij de
      Vierde tranche [Algemene wet bestuursrecht][ref9], Kamerstukken II 2003/04, 29702, nr. 3, p. 117 e.v.). Zie ook
      [aanwijzing 2.7][ref10].


