  - number: '3.55'
    text: |-
      De hierna genoemde bepalingen van een regeling worden in voorkomende gevallen in afzonderlijke artikelen en in de
      aangegeven volgorde aan het slot van een regeling opgenomen:

      a. bepaling inzake evaluatie;

      b. bepaling inzake overgangsrecht;

      c. bepaling over intrekking van een regeling;

      d. bepaling inzake publicatie van de integrale tekst van een regeling;

      e. bepaling inzake inwerkingtreding;

      f. bepaling tot vaststelling van een citeertitel.


          **Toelichting**
          **Onderdeel b.** Zie ook [aanwijzing 5.60][ref1].
          **Onderdeel d.** Zie [aanwijzing 6.22, tweede lid][ref2].


