  - number: '5.74'
    text: |-
      Om aan te geven dat aan een regeling of een onderdeel daarvan tijdelijk gelding kan worden verleend of de gelding
      daarvan kan worden opgeschort wordt de term ‘in werking stellen’, respectievelijk ‘buiten werking stellen’,
      gebruikt.

      **Toelichting**

      Met name in noodwetgeving komt het voor dat een regeling of regelingsonderdeel tijdelijk in of buiten werking
      gesteld moet kunnen worden. Het is niet wenselijk dat te regelen door middel van de inwerkingtreding daarvan.
      Van nog niet in werking getreden (onderdelen van) regelingen wordt in beginsel de tekst niet getoond in het
      Basiswettenbestand, terwijl bovendien onduidelijkheden optreden hoe zo’n regeling of regelingsonderdeel vervolgens
      weer gedeactiveerd moet worden en op een later moment weer in werking gesteld moet worden.

      **Voorbeeld**

      1. Indien de beperkte noodtoestand is afgekondigd, worden bij koninklijk besluit, op voordracht van Onze Minister-
      President, voor Nederland of een gedeelte daarvan bepalingen in werking gesteld die voorkomen op de bij deze wet
      behorende lijst A.

      2. Bij koninklijk besluit, op voordracht van Onze Minister-President, worden bepalingen die ingevolge het in het
      eerste lid bedoelde besluit in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons
      oordeel toelaten.

      ([Artikel 7 van de Coördinatiewet uitzonderingstoestanden][ref1])


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
