  - number: '4.13'
    text: |-
      Strekt een wet tot uitvoering van de [Grondwet][ref1], een verdrag of een bindende EU-rechtshandeling, dan wel een
      ander besluit van een volkenrechtelijke organisatie, dan wordt dit in de considerans vermeld.


          **Toelichting**
          Bij een algemene maatregel van bestuur of een ministeriële regeling wordt het verband met een hogere regeling
      tot uitdrukking gebracht door de formulering ‘gelet op’. Zie [aanwijzing 4.10][ref2].
          Deze aanwijzing geeft tevens invulling aan het in EU-richtlijnen opgenomen voorschrift dat naar de
      geïmplementeerde richtlijn wordt verwezen in de nationale uitvoeringsbepalingen of bij de officiële bekendmaking
      van die bepalingen, op een wijze die door de lidstaten wordt vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
