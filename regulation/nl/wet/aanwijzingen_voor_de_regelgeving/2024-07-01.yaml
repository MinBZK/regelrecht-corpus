  - number: '5.49'
    text: |-
      Indien er aanleiding is voor een van de volgende afwijkingen van een in de [Algemene wet bestuursrecht][ref1]
      opgenomen hoofdregel van bestuursprocesrecht, wordt die afwijking in de bijlagen bij die wet geregeld:

      a. rechtstreeks beroep;

      b. geen beroep;

      c. beroep in één instantie;

      d. beroep bij een andere rechtbank dan volgens de regels over relatieve competentie;

      e. hoger beroep bij een andere bestuursrechter dan de Afdeling bestuursrechtspraak van de Raad van State;

      f. verlaagd griffierecht.


          **Toelichting**
          Voor afwijkingen van het algemene bestuursprocesrecht van de [Awb][ref2] dient een goede reden te bestaan. Voor
      enkele situaties voorziet de [Awb][ref3] zelf in de mogelijkheid van een dergelijke afwijking, door een bijzondere
      wet of een onderdeel daarvan te vermelden in een bijlage bij de [Awb][ref4]:
          rechtstreeks beroep: zie [artikel 7:1, eerste lid, onder g][ref5], en [bijlage 1][ref6];
      geen beroep: zie [artikel 8:5, eerste lid][ref7], en [artikel 1 van bijlage 2][ref8];
      beroep in één instantie: zie [artikel 8:6][ref9] en [hoofdstuk 2 van bijlage 2][ref10];
      beroep bij een andere rechtbank dan volgens de regels over relatieve competentie: zie
      [artikel 8:7, derde lid][ref11], en [hoofdstuk 3 van bijlage 2][ref12];
      hoger beroep bij een andere bestuursrechter dan de Afdeling bestuursrechtspraak van de Raad van State: zie de
      [artikelen 8:105][ref13] en [8:106, eerste lid, onder a][ref14], en [hoofdstuk 4 van bijlage 2][ref15];
      verlaagd griffierecht: zie de [artikelen 8:41, tweede lid, onder a][ref16], en [8:109, eerste lid, onder a][ref17],
      en [bijlage 3][ref18].
          Bij het openstellen van hoger beroep bij de Centrale Raad van Beroep (CRvB) dient een keuze te worden gemaakt
      tussen het wel of niet toekennen van schorsende werking, zie [artikel 8:106, eerste lid, onder a, Awb][ref19] en de
      [artikelen 9 en 10 van bijlage 2 bij die wet][ref20].
          Als een regeling of bepaling die vermeld wordt in een Awb-bijlage, wordt ingetrokken of vervalt, verdient het
      aanbeveling om die vermelding met ingang van dezelfde datum te schrappen, ook als de regeling of bepaling krachtens
      overgangsrecht nog van toepassing blijft op ‘oude’ gevallen. Desgewenst kan in dat overgangsrecht worden voorzien
      in een aanvulling of afwijking van het permanente overgangsrecht van [artikel 11:3 Awb][ref21].


