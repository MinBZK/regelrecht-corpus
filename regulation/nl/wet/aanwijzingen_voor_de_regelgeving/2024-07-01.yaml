  - number: '5.9'
    text: |-
      1 Een zelfstandig bestuursorgaan wordt bij of in bijzondere gevallen krachtens de wet ingesteld.

      2 Het toekennen van openbaar gezag geschiedt bij of in bijzondere gevallen krachtens de wet.

      3 Voor de verstrekking van subsidies kan met inachtneming van [artikel 4:23 van de Algemene wet bestuursrecht][ref1]
      worden afgeweken van het tweede lid.


          **Toelichting**
          **Eerste lid.** Instelling bij wet is aangewezen in verband met de beperkte ministeriële verantwoordelijkheid
      voor een zelfstandig bestuursorgaan. Omdat de mogelijkheden van parlementaire controle op de uitoefening van
      de desbetreffende taak niet volledig zijn, is het noodzakelijk dat de Staten-Generaal zich over het instellen
      van een zelfstandig bestuursorgaan kunnen uitspreken. In bijzondere gevallen is instelling krachtens de wet
      mogelijk, bijvoorbeeld indien de regeling een hele categorie gelijksoortige zelfstandige bestuursorganen betreft
      (bijvoorbeeld landelijk gespreide organen op een bepaald taakgebied). In een dergelijk geval worden de algemene
      kenmerken van deze organen bij wet geregeld, maar de afzonderlijke organen kunnen dan krachtens wet worden
      ingesteld.
          **Tweede lid.** Uitgangspunt is dat toekenning van openbaar gezag aan een zelfstandig bestuursorgaan
      bij formele wet geschiedt. Niet iedere toekenning van openbaar gezag is echter zo gewichtig dat de
      volksvertegenwoordiging daarbij rechtstreeks moet worden betrokken. Afhankelijk van de aard van de taak kan dan
      volstaan worden met opneming in een lagere regeling. Overigens is ook voor belangrijke bestuurstaken die niet
      gepaard gaan met het uitoefenen van openbaar gezag (zoals het verrichten van feitelijke uitvoeringshandelingen,
      bijvoorbeeld het geven van openbaar onderwijs), een wettelijke basis wenselijk of vereist. Het toekennen van
      verschillende taken wordt gemotiveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel423
