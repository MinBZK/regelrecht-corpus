  - number: '3.30'
    text: |-
      1 Een volledige zin wordt aangeduid als ‘*zin*’, een deel van een zin als ‘*zinsnede*’.

      2 Indien een zinsnede wordt aangehaald door vermelding van de volledige tekst of van het begin en einde daarvan,
      kan de aanduiding ‘zinsnede’ worden weggelaten.


          **Toelichting**
          **Tweede lid.**Het aanhalen van lange zinsneden kan ook geschieden met gebruik van haakjes: zie het
      tweede voorbeeld. Zie ook [aanwijzing 6.9][ref1]. Zie voor een andere vorm van verwijzing naar zinsneden de
      [aanwijzingen 5.47, vierde lid][ref2], en [5.52, voorbeelden B, D en F][ref3].

          In het tweede lid vervalt ‘wanneer hij daarin heeft toegestemd’.
      In artikel 4 vervalt ‘indien (...) geëindigd’.


