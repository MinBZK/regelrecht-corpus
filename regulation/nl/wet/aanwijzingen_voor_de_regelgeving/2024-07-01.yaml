  - number: '8.10'
    text: |-
      1 De uitdrukkelijke goedkeuring van verdragen die krachtens een territorialiteitsbepaling of naar hun aard binnen
      het Koninkrijk alleen voor Nederland gelden, geschiedt niet bij rijkswet, maar bij wet.

      2 Het eerste lid is van overeenkomstige toepassing op de goedkeuring van verdragen waarbij medegelding voor Aruba,
      Curaçao of Sint Maarten weliswaar mogelijk is, maar waarbij reeds bij de indiening van het goedkeuringswetsvoorstel
      definitief is vastgesteld dat het verdrag niet mede voor Aruba, Curaçao of Sint Maarten zal gaan gelden.


          **Toelichting**
          **Eerste lid.** Het ligt niet in de rede de in dit lid bedoelde verdragen bij rijkswet goed te keuren. Als
      het om nationale regelgeving inzake een koninkrijksaangelegenheid gaat die niet geldt in Aruba, Curaçao en Sint
      Maarten, geeft [artikel 14, derde lid, van het Statuut voor het Koninkrijk][ref1] immers expliciet aan dat deze bij
      gewone wet moeten worden vastgesteld.
          Voor goedkeuringswetten als bedoeld in dit lid geldt dat de ‘gewone’ Nederlandse wetgevingsprocedure wordt
      gevolgd. Dit betekent dat het wetsvoorstel niet in de rijksministerraad, maar in de Nederlandse ministerraad
      wordt behandeld (zie ook [aanwijzing 8.14][ref2]) en dat de advisering geschiedt door de Afdeling advisering van
      de Raad van State in plaats van door de Afdeling advisering van de Raad van State van het Koninkrijk (zie ook
      [aanwijzing 8.18][ref3]).
          **Tweede lid.** In de in het tweede lid genoemde gevallen moet uit de tekst van de goedkeuringswet blijken dat
      de goedkeuring voor het Koninkrijk uitsluitend plaatsvindt voor Nederland (zie artikel 1 van het model, genoemd
      in [aanwijzing 8.12][ref4]).


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
