  - number: '3.56'
    text: |-
      1 Indien dit voor de toegankelijkheid van een regeling van belang is, wordt deze systematisch in Arabisch
      genummerde onderdelen verdeeld.

      2 Bij een verdeling op één niveau worden de onderdelen ‘*hoofdstuk*’ of ‘*paragraaf*’ genoemd.

      3 Bij een verdeling op twee niveaus worden de onderdelen van het eerste niveau ‘*hoofdstuk*’ en de onderdelen van
      het tweede niveau ‘*paragraaf*’ genoemd.

      4 Bij een verdeling op meer dan twee niveaus worden de onderdelen in volgorde van omvang ‘*deel*’, ‘*hoofdstuk*’,
      ‘*titel*’, ‘*afdeling*’ en ‘*paragraaf*’ genoemd, met dien verstande dat in ieder geval de aanduidingen
      ‘*hoofdstuk*’ en ‘*paragraaf*’ worden gebruikt.


          **Toelichting**
          De benaming ‘boek’ wordt alleen voor een deel van een wetboek gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.56
  - number: '3.57'
    text: |-
      1 De in [aanwijzing 3.56][ref1] bedoelde onderdelen van een regeling worden voorzien van een opschrift, waarin de
      inhoud van het onderdeel beknopt wordt aangeduid.

      2 Artikelen kunnen van een opschrift worden voorzien.


          **Toelichting**
          Opschriften worden niet gebruikt om de inhoud van de daaropvolgende tekst te preciseren.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
