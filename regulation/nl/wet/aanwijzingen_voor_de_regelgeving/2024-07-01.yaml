  - number: '4.32'
    text: |-
      Indien een bij een regeling behorende bijlage wordt bekendgemaakt door middel van een ander algemeen toegankelijk
      elektronisch medium dan het Staatsblad of de Staatscourant, wordt in de modellen voor het slotformulier, genoemd in
      [aanwijzing 4.31][ref1], na ‘geplaatst’ telkens ingevoegd: *, met uitzondering van [de] bijlage[n] ..., die [zal /
      zullen] worden geplaatst op het in artikel ... vermelde internetadres.*


          **Toelichting**
          Deze aanwijzing ziet op het slotformulier bij gebruikmaking van de uitzonderingsmogelijkheid die wordt geboden
      door [artikel 7, tweede lid, van de Bekendmakingswet][ref2]: bekendmaking door middel van een ander algemeen
      toegankelijk elektronisch medium dan het Staatsblad of de Staatscourant. Hierbij kan worden gedacht aan de
      website van (een dienstonderdeel van) de rijksoverheid. Zie [aanwijzing 5.76][ref3]. In dat geval wordt in het
      slotformulier verwezen naar de bepaling in de regeling waar het afwijkende bekendmakingsadres is gegeven.
          **Beschikbaar blijven.** Het is ook voor met toepassing van [artikel 7 van de Bekendmakingswet][ref4]
      bekendgemaakte bijlagen van belang dat deze elektronisch beschikbaar blijven op de bij de bekendmaking aangegeven
      wijze. Indien de elektronische beschikbaarheid op de bij de bekendmaking aangegeven wijze niet langer is verzekerd,
      voorziet het desbetreffende bestuursorgaan daarom in een vervangende wijze (bijvoorbeeld een ander webadres)
      die door middel van een wijziging van het in de regeling aangegeven internetadres wordt bekendgemaakt. Zie
      [artikel 4.1 van het Besluit elektronische publicaties][ref5]. Zie ook [aanwijzing 4.41][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
