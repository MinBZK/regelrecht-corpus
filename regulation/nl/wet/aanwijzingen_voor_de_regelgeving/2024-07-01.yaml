  - number: '2.47'
    text: |-
      1 De termen *bestuursorgaan, belanghebbende, besluit, beschikking, aanvraag, beleidsregel, bestuursrechter,
      bezwaar, administratief beroep, beroep, subsidie, subsidieplafond, dwangbevel, overtreder, toezichthouder, last
      onder bestuursdwang, last onder dwangsom, bestuurlijke boete, mandaat* en *delegatie* worden in bestuursrechtelijke
      regelingen die gelden in het Europese deel van Nederland, gebruikt in de betekenis die daaraan is gegeven in de
      [Algemene wet bestuursrecht][ref1].

      2 De termen *adviseur, overtreding, bestuurlijke sanctie, herstelsanctie, bestraffende sanctie* en *goedkeuring*
      worden in bestuursrechtelijke regelingen die gelden in het Europese deel van Nederland, zoveel mogelijk gebruikt in
      de betekenis die daaraan is gegeven in de [Algemene wet bestuursrecht][ref2].

      3 In bestuursrechtelijke regelingen die gelden in Bonaire, Sint Eustatius en Saba, wordt aangesloten bij de
      terminologie van de [Wet administratieve rechtspraak BES][ref3].


          **Toelichting**
          **Eerste en tweede lid.**In de wetgeving wordt eenheid in terminologie nagestreefd. Dit streven is in het
      bijzonder van belang bij het gebruik van de centrale begrippen uit het bestuursrecht. De in het eerste lid
      genoemde begrippen hebben in de [Awb][ref4] een algemeen geldende betekenis gekregen en behoren daarom ook in
      andere bestuursrechtelijke regelgeving in die betekenis te worden gebruikt. Ook overigens verdient het aanbeveling
      de begrippen in deze zin te gebruiken. De in het tweede lid genoemde begrippen gelden formeel alleen binnen de
      [Awb][ref5] zelf. Het is echter van belang in de bijzondere bestuursrechtelijke wetgeving ook bij die begrippen aan
      te sluiten.
          Voor reacties in het kader van inspraakprocedures wordt niet de term ‘bezwaar’ gebruikt, maar ‘zienswijzen’
      of ‘bedenkingen’.
          **Derde lid.**De [Awb][ref6] geldt in beginsel niet in Bonaire, Sint Eustatius en Saba. In regelingen die voor
      deze eilanden gelden, wordt aangesloten bij de terminologie van de [Wet administratieve rechtspraak BES][ref7]
      (WarBES), welke wet in zekere zin de tegenhanger is van de [hoofdstukken 6 tot en met 8 van de Awb][ref8]. Voor
      Bonaire, Sint Eustatius en Saba bestaan geen met de overige hoofdstukken van de [Awb][ref9] vergelijkbare algemene
      regelingen.
          In een regeling die behalve in het Europese deel van Nederland ook in Bonaire, Sint Eustatius en Saba geldt,
      zal aansluiting bij zowel de [Awb][ref10] als de [WarBES][ref11] gewaarborgd moeten worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
