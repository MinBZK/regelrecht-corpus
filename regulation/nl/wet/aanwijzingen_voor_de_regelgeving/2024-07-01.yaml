  - number: '8.6'
    text: |-
      1 Regeringsvertegenwoordigers die zitting hebben in een orgaan van een volkenrechtelijke organisatie dat besluiten
      neemt die de lidstaten van die organisatie binden, dragen er zorg voor dat, indien besluiten in voorbereiding zijn
      die het regeringsbeleid betreffen of anderszins van groot belang zijn, de ontwerpen voor deze besluiten voorwerp
      van overleg vormen tussen de betrokken ministeries en in de ministerraad aan de orde worden gesteld.

      2 Indien het om bindende besluiten gaat wordt ook de afdeling Verdragen van de Directie Juridische Zaken van het
      Ministerie van Buitenlandse Zaken in het voorbereidende stadium betrokken.


          **Toelichting**
          Besluiten van volkenrechtelijke organisaties kunnen een verdrag zijn. Daarom wordt contact gezocht met de
      afdeling Verdragen van de Directie Juridische Zaken om te beoordelen of dat het geval is en te kijken of het
      besluit parlementaire goedkeuring behoeft. Zie ook [aanwijzing 8.16][ref1].
          EU-rechtshandelingen zijn ook besluiten van een volkenrechtelijke organisatie. Wanneer het om besluiten gaat
      waarbij de lidstaten de partijen zijn en wanneer die besluiten door de lidstaten geratificeerd dienen te worden
      alvorens in werking te kunnen treden, gaat het om besluiten met een verdragskarakter. In dat geval zijn deze
      aanwijzing en [aanwijzing 8.7][ref2] ook van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
