  - number: '5.14'
    text: |-
      Aan een minister wordt niet de bevoegdheid toegekend bijzondere aanwijzingen te geven aan een zelfstandig
      bestuursorgaan.


          **Toelichting**
          Indien de minister bevoegd is bijzondere aanwijzingen ofwel aanwijzingen voor een concreet geval te geven,
      kan niet meer van ‘zelfstandigheid’ gesproken worden en resteert er materieel niets anders dan een aan de minister
      ondergeschikt orgaan met een bij de wet geattribueerde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.14
  - number: '5.15'
    text: |-
      1 In de instellingswet wordt in voorkomende gevallen bepaald hoe de overgang van personeel, rechten, bezittingen
      en verplichtingen van de rechtspersoon de Staat der Nederlanden op een andere rechtspersoon waarvan het zelfstandig
      bestuursorgaan deel uitmaakt, wordt geregeld.

      2 Hiervoor worden de volgende modellen gebruikt:

      *(Artikel ...)*

      1. *Op het tijdstip van inwerkingtreding van deze wet zijn de personeelsleden van [naam dienstonderdeel], van wie
      naam en functie zijn vermeld op een door Onze Minister vastgestelde lijst, van rechtswege ontslagen en aangesteld
      als ambtenaar in dienst van [naam rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt].*

      2. *De overgang van de in het eerste lid bedoelde personeelsleden vindt plaats met een rechtspositie die als geheel
      ten minste gelijkwaardig is aan die welke voor elk van hen gold bij [naam dienstonderdeel].*

      3. *De personen die op het tijdstip van inwerkingtreding van deze wet krachtens een arbeidsovereenkomst naar
      burgerlijk recht behoren tot het personeel van [naam dienstonderdeel], en van wie naam en functie zijn vermeld
      op een door Onze Minister vastgestelde lijst, zijn op dat tijdstip van rechtswege ontslagen en aangesteld in
      dienst van [naam rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt] met een rechtspositie die in
      totaliteit ten minste gelijkwaardig is aan die welke voor elk van hen gold bij [naam dienstonderdeel].*

      *(Artikel ...)*

      1. *Onze Minister bepaalt in overeenstemming met Onze Minister van Financiën welke vermogensbestanddelen van de
      Staat die aan [naam dienstonderdeel] worden toegerekend, worden toebedeeld aan [naam rechtspersoon waarvan het
      zelfstandig bestuursorgaan deel uitmaakt].*

      2. *De in het eerste lid bedoelde vermogensbestanddelen gaan op het tijdstip van inwerkingtreding van deze wet
      onder algemene titel over op [naam dienst] tegen een door Onze Minister in overeenstemming met Onze Minister van
      Financiën te bepalen waarde.*

      3. *Ingeval krachtens het eerste en het tweede lid registergoederen overgaan, doet Onze Minister van Financiën de
      overgang van die registergoederen onverwijld inschrijven in de openbare registers, bedoeld in afdeling 2 van titel
      1 van Boek 3 van het Burgerlijk Wetboek. Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek is niet
      van toepassing.*


          **Toelichting**
          **Eerste modelbepaling.**Het tweede lid is alleen nodig indien in afwijking van
      [artikel 15, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], de rechtspositieregels die gelden
      voor ambtenaren in dienst van het Rijk bij de nieuwe werkgever niet van (overeenkomstige) toepassing zijn op het
      overkomende personeel.
          Zie voor overgangsrecht met betrekking tot archiefbescheiden [aanwijzing 5.66][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
