  - number: '7.4'
    text: |-
      1 Vanwege de primaire verantwoordelijkheid van de betrokken bewindspersoon van het Ministerie van Justitie en
      Veiligheid voor de toetsing van wetgeving op rechtsstatelijke en bestuurlijke kwaliteit, met inbegrip van de
      constitutionele, Europeesrechtelijke en internationaalrechtelijke toetsing van wetgeving, worden de volgende
      stukken, voordat zij ter behandeling aan de ministerraad of een onderraad worden aangeboden, ter toetsing aan de
      Directie Wetgeving en Juridische Zaken van het Ministerie van Justitie en Veiligheid voorgelegd:

      a. voorstellen van wet;

      b. ontwerpen van algemene maatregelen van bestuur;

      c. ingrijpende nota’s van wijziging op een wetsvoorstel;

      d. een voorstel van wet of ontwerp van een algemene maatregel van bestuur en het nader rapport daarbij, ingeval het
      advies van de Afdeling advisering van de Raad van State daarop ingrijpende kritiek op inhoud of vormgeving bevat.

      2 Vanwege de verantwoordelijkheid van de Minister van Binnenlandse Zaken en Koninkrijksrelaties voor het beheer van
      de [Grondwet][ref1] werkt het Ministerie van Justitie en Veiligheid bij de constitutionele toetsing van wetgeving
      samen met het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.

      3 Vanwege de verantwoordelijkheid van de Minister van Buitenlandse Zaken voor de eenheid van de uitleg van het
      internationale en Europese recht werkt het Ministerie van Justitie en Veiligheid bij de internationaalrechtelijke
      en Europeesrechtelijke toetsing van wetgeving samen met het Ministerie van Buitenlandse Zaken.

      4 Het voorleggen geschiedt dusdanig tijdig, dat er voldoende ruimte is voor reëel overleg over alternatieve
      mogelijkheden, indien de Directie Wetgeving en Juridische Zaken dat noodzakelijk acht.

      5 Het eerste lid is niet van toepassing op stukken als bedoeld in het eerste lid, onder a tot en met c, waarover in
      overleg tussen het betrokken ministerie en het Ministerie van Justitie en Veiligheid is bepaald dat deze niet ter
      toetsing voorgelegd hoeven worden.


          **Toelichting**
          **Toetsing Ministerie van Justitie en Veiligheid.**Het Ministerie van Justitie en Veiligheid is primair
      verantwoordelijk voor de toetsing van regelgeving op de rechtsstatelijke en bestuurlijke kwaliteit. Dit neemt
      uiteraard niet weg dat alle ministeries ook zelf zorg moeten dragen voor de kwaliteit van hun wetgeving en daarvoor
      de nodige voorzieningen moeten treffen.
          De wetgevingstoetsing betreft de in deze aanwijzingen neergelegde eisen van goede wetgeving en de toepassing
      van het Beleidskompas. Zie in dit verband ook de in [aanwijzing 4.43][ref2] genoemde aspecten.
          Het Ministerie van Justitie en Veiligheid overlegt periodiek met elk ministerie welke regelgevingsvoorstellen
      in de maak zijn aan de hand van een ten behoeve van de selectie opgesteld toetsingskader. In dit overleg wordt
      afgesproken welke dossiers wel en niet ter toetsing voorgelegd zullen worden. Niet ter toetsing voorgelegde
      dossiers kunnen direct in ambtelijk voorportaal, onderraad en ministerraad worden geagendeerd. Daarbij wordt
      vermeld dat het dossier niet onderworpen is geweest aan een wetgevingstoets.
          Stukken als bedoeld in het eerste lid, onder d (die opnieuw in de ministerraad worden gebracht vanwege
      ingrijpende kritiek van de Afdeling advisering van de Raad van State), worden wel steeds ter toetsing aangeboden,
      ongeacht de vraag of het voorstel eerder was geselecteerd voor toetsing.
          **Coördinatie wetgevingstoetsing.**De sector Juridische Zaken en Wetgevingsbeleid van de Directie Wetgeving
      en Juridische Zaken van het Ministerie van Justitie en Veiligheid is het coördinatie- en contactpunt voor deze
      toetsing. Wanneer bij de wetgevingstoetsing geen overeenstemming is bereikt, worden door de sector Juridische Zaken
      en Wetgevingsbeleid de geschilpunten neergelegd in een wetgevingsrapport dat door het desbetreffende ministerie
      met het voorstel wordt meegezonden naar de ministerraad of een onderraad daarvan, ten behoeve van de beraadslaging
      aldaar.
          Zie voor de toetsing van een nader rapport bij ingrijpende kritiek van de Afdeling advisering van de Raad van
      State [aanwijzing 7.14][ref3]. Zie voor de toetsing van nota’s van wijziging die niet aan de ministerraad behoeven
      te worden voorgelegd [aanwijzing 6.30][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
