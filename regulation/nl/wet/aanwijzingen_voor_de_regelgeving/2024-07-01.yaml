  - number: 2.36.1
    text: |-
      Gecontroleerde delegatie wordt slechts toegepast ingeval een materie regeling bij wet rechtvaardigt maar zich
      daarvoor toch niet goed leent vanwege haar sterk technische karakter, de noodzaak van snelle wijzigingen of de
      grote omvang van de te stellen regels.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.36
  - number: 2.36.2
    text: |-
      Voor gecontroleerde delegatie wordt het volgende model gebruikt: *De voordracht voor een krachtens artikel [...]
      vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide
      Kamers der Staten-Generaal is overgelegd.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.36
  - number: 2.37.1
    text: |-
      Met toepassing van voorwaardelijke delegatie wordt grote terughoudendheid betracht. Zij wordt slechts toegepast
      indien in het algemeen voor de regeling van een materie kan worden volstaan met een lagere regeling, maar het
      wenselijk is de mogelijkheid open te houden dat in bepaalde gevallen voor de totstandkoming de wetsprocedure wordt
      gevolgd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.37
  - number: 2.37.2
    text: |-
      Voor voorwaardelijke delegatie wordt het volgende model gebruikt: *Een krachtens artikel [...] vastgestelde
      algemene maatregel van bestuur wordt aan de beide Kamers der Staten-Generaal overgelegd. Hij treedt in werking
      op een tijdstip dat nadat vier weken na de overlegging zijn verstreken bij koninklijk besluit wordt vastgesteld,
      tenzij binnen die termijn door of namens een van de Kamers of door ten minste een vijfde van het grondwettelijk
      aantal leden van een van de Kamers de wens te kennen wordt gegeven dat [het onderwerp / de inwerkingtreding] van de
      algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo
      spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van de Kamers der Staten-
      Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.37
  - number: 2.38.1
    text: |-
      Voor een mededeling of overlegging aan beide Kamers van de Staten-Generaal als bedoeld in de
      [aanwijzingen 2.36][ref1] en [2.37][ref2] wordt een zodanig tijdstip gekozen dat ten minste drievierde deel van de
      in die aanwijzingen bedoelde termijn buiten een reces van de Kamers valt.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.5'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.38.2
    text: |-
      Indien het eerste lid niet in acht genomen kan worden, wordt dit bij de mededeling of overlegging uitdrukkelijk en
      gemotiveerd vermeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.38
  - number: 2.38.3
    text: |-
      Indien bij een mededeling of overlegging als bedoeld in [aanwijzing 2.36][ref1] het eerste lid niet in acht kan
      worden genomen, wordt zo mogelijk een na het reces liggende datum genoemd vóór welke de Kamers hun zienswijze
      kenbaar kunnen maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.5'
  - number: 2.38.4
    text: |-
      Indien een verlenging als bedoeld in het derde lid naar het oordeel van de betrokken minister niet mogelijk is,
      wordt dat uitdrukkelijk en gemotiveerd vermeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.38
  - number: 2.39.1
    text: |-
      Tijdelijke delegatie blijft beperkt tot gevallen waarin te stellen voorschriften gelet op hun betekenis bij wet
      moeten worden vastgesteld maar de totstandkoming van een wet niet kan worden afgewacht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.39
  - number: 2.39.2
    text: |-
      Voor tijdelijke delegatie wordt het volgende model gebruikt: *Na de plaatsing in [het Staatsblad / de
      Staatscourant] van een krachtens artikel [...] vastgestelde [algemene maatregel van bestuur / ministeriële
      regeling] wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Tweede
      Kamer der Staten-Generaal ingediend. Indien het voorstel wordt ingetrokken of indien een van de beide Kamers der
      Staten-Generaal besluit het voorstel niet aan te nemen, wordt de [algemene maatregel van bestuur / ministeriële
      regeling] onverwijld ingetrokken. Wordt het voorstel tot wet verheven, dan wordt de [algemene maatregel van
      bestuur / ministeriële regeling] ingetrokken op het tijdstip van inwerkingtreding van die wet.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.39
  - number: 2.40.1
    text: |-
      Delegatie onder het vereiste van goedkeuring bij wet blijft beperkt tot gevallen waarin tijdelijke delegatie
      aanvaardbaar is en het gaat om regelingen die de Tweede Kamer in beginsel slechts kan goedkeuren of weigeren goed
      te keuren.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.40
  - number: 2.40.2
    text: |-
      Voor delegatie onder het vereiste van goedkeuring bij wet wordt het volgende model gebruikt: *Na het tot stand
      komen van een krachtens artikel [...] vastgestelde [algemene maatregel van bestuur / ministeriële regeling]
      wordt zo spoedig mogelijk maar uiterlijk binnen acht weken een voorstel van wet tot goedkeuring van de [algemene
      maatregel van bestuur / ministeriële regeling] bij de Tweede Kamer der Staten-Generaal ingediend. Indien het
      voorstel wordt ingetrokken of indien een van de Kamers der Staten-Generaal tot het niet-aannemen van het voorstel
      besluit, wordt de [algemene maatregel van bestuur / ministeriële regeling] onverwijld ingetrokken.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.40
  - number: 2.41.1
    text: |-
      Indien het gewenst is de mogelijkheid te bieden dat in een lagere regeling bij wijze van experiment van een hogere
      regeling wordt afgeweken, wordt in die hogere regeling bepaald:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.41
  - number: 2.41.1.a
    text: wat het oogmerk is van het experiment;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.41
  - number: 2.41.1.b
    text: wat het bereik is van de experimenteerregeling;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.41
  - number: 2.41.1.c
    text: van welke onderdelen van de hogere regeling kan worden afgeweken; en
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.41
  - number: 2.41.1.d
    text: wat de maximale geldingsduur is van de afwijking.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.41
  - number: 2.41.2
    text: |-
      Van een wet in formele zin wordt slechts afgeweken bij algemene maatregel van bestuur, waarbij kan worden voorzien
      in subdelegatie.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.41
  - number: 2.41.3
    text: In de experimenteerregeling wordt vermeld van welke onderdelen van de hogere regeling wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.41
  - number: 2.42.1
    text: In de toelichting bij een experimenteerregeling wordt aangegeven hoe evaluatie van de regeling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.42
  - number: 2.42.2
    text: |-
      Indien een experimenteerregeling een evaluatiebepaling bevat wordt het volgende model als uitgangspunt genomen:
      *Onze Minister [van/voor ...] zendt [in overeenstemming met Onze Minister van/voor ...] negen maanden voor het
      einde van de werkingsduur van [een algemene maatregel van bestuur als bedoeld in artikel .../ dit besluit] aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van het experiment in de praktijk, alsmede een
      standpunt inzake de voortzetting van [die maatregel / dit besluit] anders dan als experiment.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.42
  - number: '2.43'
    text: |-
      In een wettelijk voorschrift op grond waarvan een beleidsregel wordt vastgesteld en in het opschrift en de
      citeertitel van de beleidsregel, wordt het woord ‘beleidsregel’ uitdrukkelijk gebruikt.
          **Toelichting**
          In de bestaande wetgevingstraditie wordt met het toekennen van een regelgevende bevoegdheid in het algemeen de
      bevoegdheid tot het stellen van algemeen verbindende voorschriften bedoeld, tenzij duidelijk blijkt van een andere
      bedoeling van de wetgever. Die andere bedoeling wordt tot uitdrukking gebracht door in de wettekst uitdrukkelijk
      het woord beleidsregel te gebruiken. Voorbeeld: *[aanduiding bestuursorgaan] kan beleidsregels vaststellen over
      (...)*.
          Ook indien de bevoegdheid tot het stellen van beleidsregels niet uit een wettelijk voorschrift voortvloeit
      (zie [artikel 4:81, eerste lid, Awb][ref1]) dient in de beleidsregel duidelijk te blijken dat sprake is een
      beleidsregel. Dit geschiedt onder meer door gebruik van deze term in het opschrift en de citeertitel van de
      regeling. Zie de [aanwijzingen 3.37][ref2], [4.2][ref3] en [4.25][ref4].
          **Voorbeeld**
          [Beleidsregel aanvragen kansspelvergunningen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0035632
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.43
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref5
        bwb_id: BWBR0035632
  - number: '2.44'
    text: |-
      Bij de vaststelling van een beleidsregel krachtens mandaat geschiedt deze vaststelling ten minste op het niveau van
      directeur-generaal of een daarmee vergelijkbare functionaris.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.44
  - number: 2.45.1
    text: In gevallen waarin soortgelijke onderwerpen worden geregeld, wordt gestreefd naar harmonisatie van regelgeving.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.45
  - number: 2.45.2
    text: |-
      Bij wijziging van een regeling wordt nagegaan welke wijzigingen uit een oogpunt van harmonisatie kunnen worden
      meegenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.45
  - number: 2.46.1
    text: |-
      In bijzondere wetten wordt alleen afgeweken van algemene wetten, indien dit noodzakelijk is. De afwijking wordt
      in de bijzondere wet opgenomen en als zodanig benoemd, tenzij uit de algemene wet volgt dat de afwijking in
      de algemene wet moet worden opgenomen. Een afwijking wordt in de memorie van toelichting bij de bijzondere wet
      gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.46
  - number: 2.46.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op aanvullingen in bijzondere wetten op een regeling in een
      algemene wet die uitputtend is bedoeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.46
  - number: 2.47.1
    text: |-
      De termen *bestuursorgaan, belanghebbende, besluit, beschikking, aanvraag, beleidsregel, bestuursrechter, bezwaar,
      administratief beroep, beroep, subsidie, subsidieplafond, dwangbevel, overtreder, toezichthouder, last onder
      bestuursdwang, last onder dwangsom, bestuurlijke boete, mandaat* en *delegatie* worden in bestuursrechtelijke
      regelingen die gelden in het Europese deel van Nederland, gebruikt in de betekenis die daaraan is gegeven in de
      [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 2.47.2
    text: |-
      De termen *adviseur, overtreding, bestuurlijke sanctie, herstelsanctie, bestraffende sanctie* en *goedkeuring*
      worden in bestuursrechtelijke regelingen die gelden in het Europese deel van Nederland, zoveel mogelijk gebruikt in
      de betekenis die daaraan is gegeven in de [Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 2.47.3
    text: |-
      In bestuursrechtelijke regelingen die gelden in Bonaire, Sint Eustatius en Saba, wordt aangesloten bij de
      terminologie van de [Wet administratieve rechtspraak BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028455
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0028455
  - number: 2.48.1
    text: |-
      Voor de kennisgeving van een besluit aan de daarbij betrokkenen waardoor het besluit zijn werking als
      rechtshandeling kan verkrijgen, wordt de term bekendmaking gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.48
  - number: 2.48.2
    text: In de overige gevallen wordt de term mededeling gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.48
  - number: '3.1'
    text: |-
      Bepalingen worden beknopt geformuleerd.
          **Toelichting**
          Indien bij het ontwerpen van een bepaling een sluitende, maar ingewikkelde formulering is gevonden, dient
      steeds te worden nagegaan of het niet eenvoudiger kan. Ook dient men bedacht te zijn op het weglaten van overbodige
      woorden. Dus bijvoorbeeld niet ‘Het bepaalde in het tweede lid van artikel 5 is van toepassing’, maar ‘Artikel 5,
      tweede lid, is van toepassing’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.1
  - number: '3.2'
    text: |-
      Voorschriften worden niet met behulp van de werkwoorden ‘*moeten*’ of ‘*dienen*’ geformuleerd, tenzij dit
      onvermijdelijk is.
          **Toelichting**
          Dus bijvoorbeeld niet: ‘Het verzoekschrift dient te worden gemotiveerd’, maar: ‘Het verzoekschrift wordt
      gemotiveerd’. Deze aanwijzing heeft alleen betrekking op de formulering van voorschriften in de regeling zelf.
      Tegen gebruik van de woorden ‘moeten’ of ‘dienen’ in de toelichting bij een regeling bestaat geen bezwaar.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.2
  - number: 3.3.1
    text: Het normale spraakgebruik wordt zoveel mogelijk gevolgd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.3
  - number: 3.3.2
    text: Woorden waarvan de betekenis te weinig bepaald of onduidelijk is, worden niet gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.3
  - number: '3.4'
    text: |-
      Voor de terminologie van een uitvoeringsregeling wordt aangesloten bij die van de regeling waarop zij is gebaseerd.
          **Toelichting**
          Dit geldt ook voor de structuur van uitvoeringsregelingen: zie [aanwijzing 3.63][ref1]. Zie tevens de
      [aanwijzingen 2.34][ref2], [3.63][ref3] en [5.3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref3
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref4
        bwb_id: BWBR0005730
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 3.5.1
    text: |-
      Voor de terminologie in nationale regelingen wordt in beginsel aangesloten bij die van verwante bindende EU-
      rechtshandelingen en internationale regelingen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.5
  - number: 3.5.2
    text: 'Van het eerste lid kan worden afgeweken indien:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.5
  - number: 3.5.2.a
    text: de terminologie van de bindende EU-rechtshandelingen en internationale regelingen niet voldoende is gepreciseerd;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.5
  - number: 3.5.2.b
    text: daardoor beter wordt aangesloten bij elders in nationale regelingen gehanteerde terminologie; of
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.5
  - number: 3.5.2.c
    text: dit beter Nederlands oplevert.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.5
  - number: '3.6'
    text: |-
      De Woordenlijst Nederlandse Taal wordt gevolgd, tenzij woorden die uit vreemde talen afkomstig zijn of van vreemde
      talen zijn afgeleid, de bedoeling duidelijker weergeven dan Nederlandse woorden en in het spraakgebruik ingang
      hebben gevonden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.6
  - number: 3.7.1
    text: Hetzelfde begrip wordt niet met verschillende termen aangeduid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.7
  - number: 3.7.2
    text: Dezelfde term wordt niet voor verschillende begrippen gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.7
  - number: 3.8.1
    text: Indien mogelijk worden persoonsaanduidingen gebruikt die sekseneutraal zijn.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.8
  - number: 3.8.2
    text: Combinaties van aanduidingen van mannen en vrouwen worden niet gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.8
  - number: '3.9'
    text: |-
      Afkortingen worden alleen gebruikt indien dit redelijkerwijs niet te vermijden is. Bij gebruik ervan worden zij in
      de begripsbepalingen opgenomen.
          **Toelichting**
          Zie voor de aanduiding van valuta en meeteenheden de [aanwijzingen 3.21][ref1] en [3.22][ref2], voor de
      vermelding van vindplaatsen de [aanwijzingen 3.42 tot en met 3.46][ref3], voor het gebruik van afkortingen in
      een citeertitel [aanwijzing 4.25, eerste lid][ref4], en voor de verkorte aanhaling van regelingen of verdragen
      in toelichtingen de [aanwijzingen 3.34][ref5], [3.39][ref6], [4.24, derde lid][ref7], en [4.50][ref8]. Ook in
      opschriften van artikelen (zie [aanwijzing 3.57][ref9]) mogen afkortingen worden gebruikt, indien dat nodig is om
      het opschrift beknopt te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref5]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref6]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref7]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref8]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref9]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0005730
