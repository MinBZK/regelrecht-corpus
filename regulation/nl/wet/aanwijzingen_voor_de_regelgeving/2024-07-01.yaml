  - number: 4.33.1
    text: |-
      Een regeling wordt ondertekend door één bewindspersoon, tenzij de voordracht tot het voorstel van wet of de
      algemene maatregel van bestuur is gedaan ‘mede namens’ een of meer andere bewindspersonen of er bijzondere redenen
      zijn om de gelijkwaardigheid van de verantwoordelijkheid van de verschillende bewindspersonen in de ondertekening
      tot uitdrukking te brengen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.33
  - number: 4.33.2
    text: |-
      Indien de uitvoering van de regeling geheel of in belangrijke mate geschiedt door ambtenaren die ressorteren onder
      een andere bewindspersoon dan de ondertekenaar of ondertekenaars krachtens het eerste lid, wordt medeondertekening
      door die andere bewindspersoon overwogen. Hetzelfde geldt indien de regeling deel gaat uitmaken van een regeling
      die onder een andere bewindspersoon ressorteert.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.33
  - number: 4.34.1
    text: |-
      De ondertekening van een wet door een bewindspersoon brengt niet mee dat die bewindspersoon ook alle
      uitvoeringsregelingen mede moet voordragen en ondertekenen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.34
  - number: 4.34.2
    text: |-
      Het niet ondertekenen van een wet door een bewindspersoon sluit niet uit dat die bewindspersoon als daartoe
      aanleiding is een of meer uitvoeringsregelingen (mede) ondertekent.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.34
  - number: '4.35'
    text: |-
      Bij een koninklijk besluit tot inwerkingtreding van een regeling wordt volstaan met voordracht en ondertekening
      door één bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.35
  - number: 4.36.1
    text: 'Ondertekeningen worden geplaatst in deze volgorde:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.36
  - number: 4.36.1.a
    text: de Minister-President;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.36
  - number: 4.36.1.b
    text: de in het bijzonder bij de zaak betrokken minister(s) of staatssecretaris(sen), naar de mate van hun betrokkenheid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.36
  - number: 4.36.2
    text: Bij gelijke mate van betrokkenheid is de volgorde van de hoofdstukken van de rijksbegroting bepalend.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.36
  - number: 4.36.3
    text: |-
      De Vice-Minister-President wordt alleen als zodanig aangeduid indien hij ondertekent als vervanger van de Minister-
      President. Hij wordt dan als eerste vermeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.36
  - number: '4.37'
    text: |-
      De Minister-President tekent als ‘*De Minister-President, Minister van Algemene Zaken*’, tenzij hij uitsluitend
      tekent als hoofd van zijn ministerie. In dat geval tekent hij als ‘*De Minister van Algemene Zaken*’.
          **Toelichting**
          De Minister-President kan op twee wijzen belast zijn met de behartiging van een belang dat een regeling
      beoogt te dienen: uitsluitend als hoofd van het Ministerie van Algemene Zaken (het gaat dan met name om interne
      regelingen) of anderszins (in de regel externe regelingen). Ook in dat laatste geval moet het gaan om een
      regeling voor de voorbereiding en inhoud waarvan de Minister-President in het bijzonder (mede)verantwoordelijk
      is (vgl. [aanwijzing 4.33, eerste lid][ref1]). Voorbeelden zijn wijzigingen van de [Grondwet][ref2], de
      [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref3] en aanwijzingen voor de rijksdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0001840
      [ref3]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.37
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.8'
      - id: ref2
        bwb_id: BWBR0001840
      - id: ref3
        bwb_id: BWBR0039896
  - number: '4.38'
    text: |-
      Een minister die een andere minister bij tijdelijke afwezigheid vervangt, tekent als ‘*De Minister van/voor ...
      a.i.*’.
          **Toelichting**
          In de vervangingsregeling in geval van tijdelijke afwezigheid van een van de ministers, zoals deze bij het
      aantreden van elk nieuw kabinet bij koninklijk besluit pleegt te worden vastgesteld, is bepaald dat een minister
      bij tijdelijke afwezigheid wordt vervangen door de staatssecretaris van hetzelfde ministerie, voor zover en
      voor zolang de minister in de gelegenheid is om de staatssecretaris aanwijzingen dienaangaande te geven. De
      staatssecretaris tekent ook in dat geval als staatssecretaris, en dus niet als minister ad interim. Ook in het
      opschrift en de aanhef van de regeling wordt de staatssecretaris dan genoemd. Deze aanwijzing heeft derhalve alleen
      betrekking op die gevallen waarin een minister niet wordt vervangen door een staatssecretaris maar door een andere
      minister. Dat gebeurt bij gelijktijdige afwezigheid van een minister en de staatssecretaris(sen) van hetzelfde
      ministerie, in het geval er geen staatssecretaris van hetzelfde ministerie is en indien een minister door ziekte
      of om een andere reden niet in de gelegenheid is zijn taak uit te oefenen en aanwijzingen aan de staatssecretaris
      te geven.
          De aanduiding ‘a.i.’ blijft achterwege in de aanhef van een koninklijk besluit dat is voorgedragen door een
      minister ad interim en in de aanhef van een ministeriële regeling die door een minister ad interim wordt getekend.
      De ondertekening van de voordracht geschiedt echter wel met de aanduiding ‘a.i.’.
          Bij afwezigheid van een staatssecretaris tekent de minister. Bij een ministeriële regeling wordt in dat geval,
      naast de aanduiding van de ondertekening, ook de aanduiding van de bewindspersoon in de aanhef aangepast. Bij een
      koninklijk besluit wordt de aanduiding van de bewindspersoon in de aanhef slechts aangepast indien de afwezigheid
      van de staatssecretaris heeft geleid tot ondertekening van het nader rapport door de minister, dus niet in het
      geval de minister het besluit slechts contrasigneert in plaats van de staatssecretaris.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.38
  - number: 4.39.1
    text: |-
      Bij een wijziging in de portefeuilleverdeling, een naamswijziging van een ministerie of het vervallen van een
      functie in het kabinet, wordt de aanduiding van de ondertekenende bewindspersoon in de tijdens de parlementaire
      behandeling van een voorstel van wet in te dienen stukken en in de vastgestelde wet dienovereenkomstig aangepast.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.39
  - number: 4.39.2
    text: Het eerste lid is van overeenkomstige toepassing op een algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.39
  - number: 4.40.1
    text: |-
      De tijdens de parlementaire behandeling van een wetsvoorstel door de regering in te dienen stukken worden bij
      voorkeur alleen ondertekend door de eerstverantwoordelijke bewindspersoon.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.40
  - number: 4.40.2
    text: De medebetrokkenheid van een of meer andere bewindspersonen wordt in de tekst tot uitdrukking gebracht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.40
  - number: '4.41'
    text: |-
      Bij een wijziging in een regeling van niet uit tekst bestaande informatie die niet kan worden geconsolideerd of bij
      een wijziging van een bij een regeling behorende bijlage die is bekendgemaakt door middel van een ander algemeen
      toegankelijk elektronisch medium dan het Staatsblad of de Staatscourant, wordt die informatie of bijlage opnieuw
      vastgesteld.
          **Toelichting**
          In [artikel 7, eerste lid, van de Bekendmakingswet][ref1] is bepaald dat een algemeen verbindend voorschrift
      of beleidsregel uit een tekst bestaat en tevens informatie kan bevatten die niet uit tekst bestaat, mits deze
      informatie in begrijpelijke vorm kan worden bekendgemaakt. Daarbij valt te denken aan kaarten of afbeeldingen.
      Verder voorziet artikel 7, tweede lid, van de Bekendmakingswet in bekendmaking van een bij een regeling behorende
      bijlage door middel van een ander algemeen toegankelijk elektronisch medium dan het Staatsblad of de Staatscourant
      in verband met de aard of omvang daarvan (zie [aanwijzing 4.28][ref2]). Voorbeelden zijn bepaalde afbeeldingen,
      (digitale) maquettes en film- of geluidsbestanden die door hun aard niet in de voor de publicatiebladen geldende
      standaarden passen of bestanden die door hun omvang slechts tegen hoge kosten en inspanning in die standaard te
      brengen zijn. [Artikel 19, eerste lid, van de Bekendmakingswet][ref3] verplicht er echter ook toe om dergelijke
      informatie of bijlagen in geconsolideerde vorm beschikbaar te stellen. Om te kunnen garanderen dat na wijziging van
      de informatie of bijlage een geconsolideerde versie daarvan beschikbaar is, schrijft de [Bekendmakingswet][ref4]
      voor dat zo’n wijziging de vorm moet hebben van een integrale nieuwe vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0004287#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0004287
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.41
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '7'
