  - number: '3.28'
    text: |-
      1 De verwijzing naar een regeling wordt zo mogelijk verbijzonderd tot een verwijzing naar artikelen.

      2 Indien dit de duidelijkheid van de verwijzing vergroot, wordt de verwijzing naar een artikel verbijzonderd tot
      een verwijzing naar een onderdeel van het artikel.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.28
  - number: '3.29'
    text: |-
      1 Verwijzing naar een lid van een artikel geschiedt overeenkomstig het volgende voorbeeld: *Artikel 5, tweede lid,
      is van toepassing*.

      2 Naar het voorafgaande artikel of lid van een artikel wordt verwezen door vermelding van het nummer van dat
      artikel of lid.

      3 Verwijzing naar een onderdeel van een opsomming geschiedt met behulp van de aanduidingen ‘*onder*’ of
      ‘*onderdeel*’. Verwijzing naar een verdere onderverdeling geschiedt met een combinatie van deze aanduidingen of met
      behulp van de aanduiding ‘*subonderdeel*’.

      4 Indien de aard van een verwijzing dit noodzakelijk maakt, wordt bij verwijzing naar een onderdeel van een
      opsomming mede verwezen naar de aanhef van de opsomming.


          **Toelichting**
          Vermeldingen als ‘lid 2’, ‘sub a of ‘letter b’ worden dus vermeden. Bij verwijzing naar een onderdeel van
      een opsomming wordt na de letter- of cijferaanduiding geen punt geplaatst. Alleen in opsommingen zelf wordt na de
      letter- of cijferaanduiding een punt geplaatst: zie [aanwijzing 3.59, eerste lid, onderdeel a][ref1].

          de personen, genoemd in artikel 5, onder b.
      artikel 8, onderdeel c, vervalt.
      de gevallen, bedoeld in artikel 10, onderdeel a, onder 2°.
      in artikel 2, derde lid, onderdeel c, vervallen de subonderdelen 2° tot en met 5°, onder vernummering van de
      subonderdelen 6° en 7° tot 2° en 3°.

          artikel 9, eerste lid, aanhef en onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
