  - number: '3.10'
    text: |-
      1 Formulering van een regel in de vorm van een fictie wordt vermeden.

      2 Voor een weerlegbaar rechtsvermoeden wordt de formulering ‘*wordt/worden vermoed*’ gebruikt.


          **Toelichting**
          **Eerste lid.**Een fictie in een wettelijk voorschrift (‘wordt geacht’) levert een onweerlegbaar
      rechtsvermoeden op. Vaak is het mogelijk in plaats van een fictie de vorm te kiezen van een gelijkstelling of het
      van overeenkomstige toepassing verklaren van andere regels. Zie ook [aanwijzing 5.1, tweede lid][ref1].
          **Tweede lid.** Een weerlegbaar rechtsvermoeden kan onder meer worden gebruikt om op niet-dwingende wijze naar
      normalisatienormen te verwijzen. Zie ook [aanwijzing 3.48][ref2].

          Veiligheidscomponenten, subsystemen en kabelbaaninstallaties die overeenstemmen met door
      Onze Minister aan te wijzen nationale normen ter omzetting van geharmoniseerde normen als bedoeld
      in artikel 3, tweede lid, van de richtlijn, worden vermoed te voldoen aan de essentiële eisen.
      ([Artikel 4, eerste lid, van de Wet kabelbaaninstallaties][ref3])


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0016366#Artikel4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel3.10
