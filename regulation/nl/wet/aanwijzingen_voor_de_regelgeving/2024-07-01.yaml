  - number: '8.13'
    text: |-
      1 Een wetsvoorstel tot goedkeuring van een verdrag wordt voorzien van een memorie van toelichting.

      2 Een voorstel tot stilzwijgende goedkeuring van een verdrag gaat vergezeld van een toelichtende nota.

      3 Toelichtingen op verdragen worden beperkt tot hetgeen voor een goed begrip nodig is. In voorkomend geval wordt
      daarin aangegeven dat wijziging van een bijlage die een integrerend onderdeel vormt van het verdrag en waarvan de
      inhoud van uitvoerende aard is ten opzichte van de bepalingen van het verdrag zelf, geen parlementaire goedkeuring
      behoeft, tenzij de Staten-Generaal zich het recht daartoe voorbehouden.

      4 Indien een verdrag gevolgen heeft voor de nationale wet- en regelgeving, wordt dit in de toelichting besproken.
      Bij de binding van het Koninkrijk te maken voorbehouden en af te leggen verklaringen die geen voorbehouden
      inhouden, worden eveneens in de toelichting besproken.

      5 In de toelichting op een verdrag wordt besproken of een verdrag naar de mening van de regering mogelijk een ieder
      verbindende bepalingen bevat.

      6 In de toelichting op een verdrag dat niet voor het Koninkrijk als geheel wordt gesloten, worden de redenen
      beschreven om aan dat verdrag wel of geen gelding of medegelding voor Bonaire, Sint Eustatius en Saba te verlenen.

      7 In de toelichting op een verdrag dat niet voor het Koninkrijk als geheel wordt gesloten, wordt aangegeven of het
      verdrag wel of geen gelding of medegelding heeft voor Aruba, Curaçao en Sint Maarten.


          **Toelichting**
          Als er in het kader van een internationale organisatie waarin de onderhandelingen over een verdrag hebben
      plaatsgevonden, ook een gemeenschappelijke toelichting is opgesteld, verdient het aanbeveling om een eigen
      toelichting te schrijven, aangevuld met een bespreking van de specifiek Nederlandse aspecten (Europees Nederland
      en Caribisch Nederland) of de specifiek Arubaanse, Curaçaose of Sint Maartense aspecten, met daarbij een verwijzing
      naar de vindplaats van de gemeenschappelijke toelichting. Als de gemeenschappelijke toelichting is opgesteld
      met het oogmerk om te dienen als onderdeel van de eigen toelichting, wordt de gemeenschappelijke toelichting als
      bijlage toegevoegd aan de eigen (beknopte) toelichting.
          **Vierde lid.** Voor dit lid is het onderscheid tussen voorbehouden en verklaringen van belang. Primair
      verschil is dat voorbehouden meestal wijziging brengen in de verdragsverplichtingen, terwijl verklaringen daarin
      geen verandering brengen. Er zijn velerlei soorten verklaringen mogelijk, bijvoorbeeld betreffende de interpretatie
      van bepaalde verdragsartikelen, politieke intenties of de aanwijzing van autoriteiten.
          Zie voor de ondertekening van de memorie van toelichting bij een voorstel van wet tot goedkeuring van een
      verdrag en de toelichtende nota in geval van stilzwijgende goedkeuring van een verdrag [aanwijzing 4.53][ref1].
      De afdeling Verdragen van de Directie Juridische Zaken van het Ministerie van Buitenlandse Zaken wordt wel steeds
      betrokken bij de voorbereiding van deze stukken en de Minister van Buitenlandse Zaken is altijd medeondertekenaar
      van de goedkeuringswet en de toelichting.
          **Vijfde lid.** Bij ieder verdrag dat ter goedkeuring wordt voorgelegd aan de Staten-Generaal, wordt
      aangegeven of het verdrag naar het oordeel van de regering bepalingen bevat die naar hun inhoud een ieder
      kunnen verbinden als bedoeld in de [artikelen 93][ref2] en [94 van de Grondwet][ref3] en zo ja, welke
      bepalingen het betreft. Deze verplichting geldt zowel voor verdragen die ter uitdrukkelijke goedkeuring
      worden voorgelegd als voor verdragen die ter stilzwijgende goedkeuring worden voorgelegd. Zie ook
      [artikel 2, tweede lid, van de Rijkswet goedkeuring en bekendmaking verdragen][ref4].
          **Zesde lid.** Verdragen kunnen, behalve voor het Koninkrijk als geheel, ook voor een of meer specifieke
      landen of delen van het Koninkrijk worden gesloten. Vanwege het feit dat Bonaire, Sint Eustatius en Saba in
      staatsrechtelijk opzicht deel uitmaken van het land Nederland, maar in geografisch opzicht tot het Caribische deel
      van het Koninkrijk behoren, is het wenselijk om in de toelichting op een verdrag uitdrukkelijk stil te staan bij
      de vraag of het verdrag ook voor Bonaire, Sint Eustatius en Saba zal gelden. De geografische ligging kan aanleiding
      zijn om een voor Aruba, Curaçao of Sint Maarten te sluiten verdrag ook voor Bonaire, Sint Eustatius en Saba te
      laten gelden of een voor Nederland te sluiten verdrag uitsluitend voor het Europese deel van Nederland te laten
      gelden. Omgekeerd kan de staatsrechtelijke verbondenheid met Nederland juist reden zijn om een Caribisch verdrag
      niet voor Bonaire, Sint Eustatius en Saba te laten gelden of een voor Nederland te sluiten verdrag gelijkelijk voor
      het Europese en het Caribische deel van Nederland te laten gelden. In bijzondere gevallen is het zelfs denkbaar dat
      een verdrag uitsluitend voor Bonaire, Sint Eustatius of Saba wordt gesloten, zonder ook voor de overige delen van
      het Koninkrijk te gelden.
          **Zevende lid.** Bij een verdrag dat niet voor het Koninkrijk als geheel wordt gesloten, maar voor een of meer
      specifieke landen van het Koninkrijk, zal in de toelichting de gelding nader worden toegelicht door deze landen.
      Zie hiervoor ook de toelichting bij [aanwijzing 8.2][ref5]. De coördinatie van deze informatie wordt verzorgd door
      de afdeling Verdragen van de Directie Juridische Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel93
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel94
      [ref4]: https://wetten.overheid.nl/BWBR0006799#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
