  - number: '5.45'
    text: |-
      1 Indien de omschrijving van een strafbaar feit aan een lagere regeling wordt overgelaten, wordt in de wet geregeld
      welke straf kan worden opgelegd.

      2 De geldboete die ten hoogste kan worden opgelegd, wordt aangegeven door het noemen van een van de
      geldboetecategorieën, vermeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1], onderscheidenlijk
      [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref2].

      3 Voor de strafbaarstelling van een feit dat niet alleen met een geldboete maar ook met een vrijheidsstraf wordt
      bedreigd, wordt het volgende model gebruikt:

      *Overtreding van artikel ... wordt gestraft met [gevangenisstraf / hechtenis] van ten hoogste [aantal maanden of
      jaren] of een geldboete van de ... categorie.*


          **Toelichting**
          **Eerste lid.**De strafsanctie op de overtreding van een voorschrift in een algemene maatregel van bestuur
      (of een ministeriële regeling) kan ingevolge [artikel 89, tweede en vierde lid, van de Grondwet][ref3] niet in
      dat besluit (of die ministeriële regeling) worden geregeld. De wet dient de strafsoort en de maximaal op te leggen
      straf te bepalen.
          **Derde lid.** Ingevolge [artikel 9, derde lid, van het Wetboek van Strafrecht][ref4] kan
      de rechter, indien de wet dit bepaalt, naast gevangenisstraf of hechtenis ook een geldboete
      opleggen. Deze formulering geeft die mogelijkheid aan. Zie voor Bonaire, Sint Eustatius en Saba:
      [artikel 17a, tweede lid, van het Wetboek van Strafrecht BES][ref5]. In Europees Nederland kan de rechter
      voor misdrijven die worden bedreigd met een vrijheidsstraf of geldboete en voor overtredingen die worden
      bedreigd met een vrijheidsstraf in plaats van een vrijheidsstraf of geldboete ook een taakstraf opleggen
      ([artikel 9, tweede lid, van het Wetboek van Strafecht][ref6]). Het [Wetboek van Strafrecht BES][ref7] kent niet de
      mogelijkheid om een taakstraf op te leggen.
          Gevangenisstraf en hechtenis zijn altijd alternatieven, zodat daaruit gekozen moet worden. Deze keuze hangt
      samen met de op grond van [aanwijzing 5.46][ref8] te maken keuze: misdrijven worden met gevangenisstraf bedreigd,
      overtredingen (indien het wenselijk is om voor de overtreding ook een vrijheidsstraf te kunnen opleggen) met
      hechtenis.

          Overtreding van het eerste lid wordt gestraft met een geldboete van de eerste categorie.
      ([Artikel 45, tweede lid, van de Drank- en Horecawet][ref9])


