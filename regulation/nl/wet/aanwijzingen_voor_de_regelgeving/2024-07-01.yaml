  - number: '3.47'
    text: |-
      1 Indien een regeling verwijst naar normen die zijn vervat in een andere Nederlandse publiekrechtelijke regeling of
      een bindende EU-rechtshandeling, omvat die verwijzing mede nadien in werking getreden wijzigingen van die regeling
      of EU-rechtshandeling, tenzij uitdrukkelijk anders is vermeld.

      2 Indien een regeling verwijst naar normen die niet publiekrechtelijk van aard zijn, geschiedt de verwijzing in
      beginsel naar die normen zoals zij op een gegeven tijdstip luidden. Omvat de verwijzing mede latere wijzigingen,
      dan wordt tevens voorzien in mededeling van deze wijzigingen in de Staatscourant.


          **Toelichting**
          **Eerste lid.**Met verwijzing naar een andere regeling kan bedoeld zijn een verwijzing naar de tekst zoals die
      met inbegrip van sinds de totstandkoming vastgestelde wijzigingen luidt of zal luiden (dynamische verwijzing), of
      een verwijzing naar de tekst zoals die op een bepaald tijdstip luidde (statische verwijzing). Bij verwijzing naar
      regelingen van de centrale overheid of naar bindende EU-rechtshandelingen is dynamische verwijzing het normale
      geval. Uitzonderingen zijn echter denkbaar, bijvoorbeeld in het overgangsrecht. Zie voor verwijzingen naar bindende
      EU-rechtshandelingen ook [aanwijzing 9.10][ref1].
          **Tweede lid.**Bij normen die niet van publiekrechtelijke aard zijn, kan worden gedacht aan normalisatienormen
      en aan bepalingen die in het kader van zelfregulering tot stand zijn gebracht. Bij verwijzing naar dergelijke
      normen is een met de maatstaven van de [Bekendmakingswet][ref2] vergelijkbaar niveau van bekendmaking niet
      gegarandeerd. Daarom dient naar deze normen in het algemeen altijd statisch te worden verwezen. In het hieronder
      opgenomen voorbeeld blijkt het statische karakter van de verwijzing uit de vermelding van het jaartal ‘2006’ in de
      aanduiding van de norm. Dit jaartal verwijst naar het jaar waarin de norm is gepubliceerd.

          Papier voldoet aan NEN 2728:2006. ([Artikel 4 van de Archiefregeling][ref3])


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref2]: https://wetten.overheid.nl/BWBR0004287
      [ref3]: https://wetten.overheid.nl/BWBR0027041#Artikel4
