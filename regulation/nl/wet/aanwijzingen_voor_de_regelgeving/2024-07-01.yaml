  - number: '2.14'
    text: |-
      1 Bij de toekenning van bestuursbevoegdheden wordt de uitoefening daarvan zoveel mogelijk genormeerd.

      2 Met het oog hierop worden discretionaire bevoegdheden en bevoegdheden met vage toepassingscriteria niet
      toegekend, tenzij daarvoor goede gronden zijn.


          **Toelichting**
          Teneinde de burger voldoende rechtswaarborgen te bieden, behoren bestuursbevoegdheden zo nauwkeurig mogelijk
      wettelijk te worden ingekaderd. Dit geldt evenzeer voor bestuursinstrumenten die de overheid op zich ook
      zonder wettelijke grondslag zou kunnen hanteren (bijvoorbeeld het verlenen van incidentele subsidies). Zie ook
      [aanwijzing 2.8][ref1].
          Met het oog op de wenselijkheid rechtswaarborgen te bieden, dient ook ten aanzien van elke bevoegdheid
      te worden bezien in welke mate rechtsbescherming noodzakelijk is. Daarbij geldt als uitgangspunt het in de
      [Algemene wet bestuursrecht][ref2] neergelegde stelsel van rechtsbescherming. Zie verder [paragraaf 5.11][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
