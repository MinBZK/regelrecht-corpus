  - number: '7.5'
    text: |-
      1 In de toelichting bij een regeling worden door het eerstverantwoordelijke ministerie in daarvoor in aanmerking
      komende gevallen de gevolgen van de regeling voor bedrijven en voor het milieu uiteengezet en waar nodig
      gekwantificeerd.

      2 De wijze waarop de gevolgen voor bedrijven in de toelichting zijn weergegeven wordt getoetst door het Ministerie
      van Economische Zaken en Klimaat.


          **Toelichting**
          **Eerste lid.** Zie voor de bedrijfseffectentoets en de milieueffectentoets onderdeel 4 (Wat zijn de gevolgen
      van deze opties?) van het Beleidskompas. In de bedrijfseffectentoets zijn zowel kwalitatieve als kwantitatieve
      vragen opgenomen die beogen de gevolgen voor het bedrijfsleven in beeld te brengen.
          **Tweede lid.**Het betrokken ministerie geeft de resultaten van de uitgevoerde bedrijfseffectentoets weer in de
      toelichting bij de regeling en biedt de regeling ter toetsing aan het Ministerie van Economische Zaken en Klimaat
      aan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.5
  - number: 7.5a
    text: |-
      1. In de toelichting bij een regeling worden de gevolgen van de regeling voor de regeldruk uiteengezet en
      gekwantificeerd.

      2. De wijze waarop de gevolgen voor de regeldruk in de toelichting zijn weergegeven wordt getoetst door het
      Adviescollege toetsing regeldruk.

      **Toelichting**

      **Eerste lid.** Zie ook aanwijzing 4.45.

      **Tweede lid.** Zie voor de wijze van toetsing het Instellingsbesluit Adviescollege toetsing regeldruk.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.5a
  - number: 7.5b
    text: |-
      Bij een regeling met een ICT-component van ten minste € 5.000.000 wordt advies gevraagd aan het Adviescollege ICT-
      toetsing.

      **Toelichting**

      Ingevolge het Instellingsbesluit Adviescollege ICT-toetsing dienen ICT-projecten met een ICT-component van ten
      minste € 5.000.000 van de ministeries, publiekrechtelijke zelfstandige bestuursorganen als bedoeld in artikel 4
      van de Kaderwet zelfstandige bestuursorganen, de politie of de Raad voor de rechtspraak voorgelegd te worden aan
      het Adviescollege ICT-toetsing teneinde een advies te verkrijgen over de risico’s en slaagkans, alsmede een oordeel
      over de mate van beheersbaarheid daarvan. Het adviestraject leidt tot een openbaar advies.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.5b
  - number: '7.6'
    text: |-
      1 In de toelichting bij een regeling worden door het eerstverantwoordelijke ministerie in daarvoor in aanmerking
      komende gevallen de gevolgen van de regeling voor decentrale overheden uiteengezet.

      2 De wijze waarop dit aspect is verantwoord in de toelichting bij de regeling wordt getoetst door het Ministerie
      van Binnenlandse Zaken en Koninkrijksrelaties.


          **Toelichting**
          De Minister van Binnenlandse Zaken en Koninkrijksrelaties toetst de beleids- en wetsvoorstellen van het Rijk
      waarin een rol is weggelegd voor provincies en gemeenten of voor de openbare lichamen Bonaire, Sint Eustatius
      en Saba. Het doel hiervan is de kwaliteit van de interbestuurlijke verhoudingen in ons land te bewaken en te
      bevorderen. Het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties heeft de Uitvoerbaarheidstoets decentrale
      overheden en het Normenkader interbestuurlijke verhoudingen (te raadplegen op [www.kcbr.nl](http://www.kcbr.nl/))
      opgesteld ten behoeve van de beoordeling van de relevantie van regelgeving op rijksniveau voor decentrale
      overheden.
          Indien in een regeling taken worden opgedragen aan decentrale overheden, indien bestuursinstrumenten (met
      name specifieke uitkeringen) worden ingevoerd of indien de regeling anderszins direct of indirect consequenties
      heeft voor decentrale overheden, moet hieraan in de toelichting bij de regeling aandacht worden besteed. Voor
      de beoordeling van deze aspecten wordt in een zo vroeg mogelijk stadium contact opgenomen met het Ministerie van
      Binnenlandse Zaken en Koninkrijksrelaties. Zie in verband met de financiële gevolgen van regelingen voor decentrale
      overheden [aanwijzing 4.46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.6
    references:
