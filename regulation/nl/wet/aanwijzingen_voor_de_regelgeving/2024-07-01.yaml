  - number: '6.8'
    text: |-
      1 Indien een gewijzigde dan wel nieuwe regeling een nieuwe grondslag biedt aan bestaande uitvoeringsregelingen kan
      een bepaling overeenkomstig het volgende model worden opgenomen:

      *Na de inwerkingtreding van deze wet / dit besluit berust [betrokken uitvoeringsregeling] [mede] op artikel [de
      nieuwe delegatiebepaling] van deze wet / dit besluit.*

      2 Indien het wenselijk is dat niet in de hogere regeling, maar in de uitvoeringsregeling de nieuwe grondslag wordt
      vermeld, kan een bepaling overeenkomstig het volgende model worden opgenomen:

      *Dit besluit / Deze regeling berust [mede] op [artikel / de artikelen ...] van [delegerende wet / delegerend
      besluit].*

      3 Indien een regeling een nieuwe grondslag biedt aan een bestaande uitvoeringsregeling of indien een
      uitvoeringsregeling wordt gewijzigd met gebruikmaking van een nieuwe grondslag, wordt in de toelichting bij
      die regeling een overzicht opgenomen van de verschillende onderdelen van de integrale uitvoeringsregeling en de
      grondslagen waarop zij berusten.


          **Toelichting**
          De bepalingen, bedoeld in het eerste en tweede lid, zijn wenselijk in die gevallen waarin bestaande
      uitvoeringsregelingen een nieuwe wettelijke grondslag krijgen en daarover onduidelijkheid kan bestaan. Het woord
      ‘mede’ wordt opgenomen indien de uitvoeringsregeling ook uitvoering geeft aan een andere regeling, die niet
      is gewijzigd. De formulering ‘berust mede op’ kan ook worden gebruikt indien een bestaande uitvoeringsregeling
      voortaan mede uitvoering geeft aan een nieuwe of gewijzigde regeling.
          **Derde lid.** Een dergelijk overzicht kan bij voorkeur in de vorm van een tabel in de toelichting worden
      opgenomen.

          Na inwerkingtreding van dit besluit berust artikel 8 van de Regeling aanwijzing en gebruik
      frequentieruimte commerciële radio-omroep 2003 op artikel 22, tweede lid, van dit besluit.
      ([Artikel 34 van het Mediabesluit 2008][ref1])
      Dit besluit berust op de artikelen 48 en 81, vierde lid, van de Politiewet 2012.
      ([Artikel 4 van het Besluit rangen politie][ref2])
      Dit besluit berust mede op artikel 38, zevende lid, van de Wet financiën openbare lichamen Bonaire, Sint Eustatius
      en Saba. ([Artikel 6 van het Besluit accountantscontrole decentrale overheden][ref3])


