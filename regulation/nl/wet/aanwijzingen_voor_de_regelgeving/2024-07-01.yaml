  - number: '3.51'
    text: |-
      1 Indien een regeling verwijst naar normen die niet in de Nederlandse taal zijn gesteld en op overtreding van die
      normen een strafrechtelijke of bestraffende bestuurlijke sanctie is gesteld, worden die normen in het Nederlands
      vertaald.

      2 De vertaling wordt in de Staatscourant geplaatst. Indien de vertaalde normen slechts van belang zijn voor een
      kleine groep personen of de kenbaarheid van de vertaling op een andere wijze voldoende is verzekerd voor alle
      belanghebbenden, kan de vertaling worden gepubliceerd door middel van een ander algemeen toegankelijk elektronisch
      medium. Van deze wijze van publicatie wordt mededeling gedaan in de Staatscourant.

      3 Het tweede lid is niet van toepassing op normen die worden vertaald krachtens de
      [Rijkswet goedkeuring en bekendmaking verdragen][ref1].

      4 Het eerste en tweede lid zijn niet van toepassing in geval bij wet is bepaald dat een overtreding van een
      voorschrift als strafbaar feit wordt aangemerkt dan wel wordt bestraft met een bestuurlijke sanctie, indien dit
      voorschrift in de Engelse taal is gesteld en bekendgemaakt.


          **Toelichting**
          **Eerste lid.** Het verdient in het algemeen de voorkeur dat bij verwijzing in de regelgeving naar
      niet-wettelijke normen, die normen in het Nederlands gesteld of vertaald zijn. De Hoge Raad heeft in zijn
      arrest van 24 juni 1997, ECLI:NL:HR:1997:ZD0773, vastgesteld dat uit [artikel 16 van de Grondwet][ref2] en
      [artikel 1, eerste lid, van het Wetboek van Strafrecht][ref3] volgt dat dit een dwingende eis is in geval van
      strafrechtelijk te handhaven normen. Gezien de analogie tussen beide sanctietypen ligt het voor de hand om deze eis
      tevens te stellen aan normen op overtreding waarvan een bestraffende bestuurlijke sanctie is gesteld.
          Het vereiste van vertaling geldt voor normen die rechtstreeks zijn gericht tot burgers of bedrijven. Dat
      betekent dat een vertaling eventueel achterwege kan blijven, ingeval de betrokken normen:
          niet gericht zijn tot burgers of bedrijven zelf, maar uitsluitend tot bijvoorbeeld keuringsinstanties, zodat
      overtreding van de voor goedkeuring gestelde eisen op zichzelf geen delict oplevert;
      een facultatief karakter hebben.
          Dit laatste doet zich voor als bij een regeling ‘primaire’ normen worden gesteld, op overtreding waarvan de
      sanctie is gesteld (die normen moeten dan wel in het Nederlands luiden) en daarnaast wordt bepaald dat in ieder
      geval aan die normen wordt voldaan, indien betrokkene volgens een bepaalde door een andere instantie beschreven
      manier handelt.
          **Derde lid.** Uiteraard moeten ook de strafrechtelijk of bestuursrechtelijk te handhaven normen in
      verdragen en besluiten van volkenrechtelijke organisaties in de Nederlandse taal beschikbaar zijn. Het derde
      lid doet recht aan het feit dat de bekendmaking van vertalingen daarvan primair geregeerd wordt door de
      [Rijkswet goedkeuring en bekendmaking verdragen][ref4]. De Rijkswet bevat overigens geen verplichting tot vertalen
      of het bekendmaken van vertalingen.
          **Vierde lid.** Bij Wet van 16 oktober 2013 tot wijziging van enige wetten in verband met de handhaving
      van voorschriften in de Engelse taal (Stb. 2013, 415) is in een aantal wetten een bepaling opgenomen waarin een
      uitzondering wordt gemaakt op de door de Hoge Raad geformuleerde regel dat strafbepalingen in de Nederlandse
      taal moeten zijn gesteld. Dit betreft (Engelstalige) voorschriften uit verdragen en besluiten van internationale
      organisaties met een zeer technisch karakter waarvan overtreding in Nederland strafrechtelijk of bestuursrechtelijk
      wordt gehandhaafd en die zien op een doelgroep die gewend is die voorschriften in de Engelse taal te hanteren. Te
      denken valt aan voorschriften op het terrein van de internationale lucht- en scheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0006799
