  - number: '8.9'
    text: |-
      1 Bij de voorbereiding van de parlementaire goedkeuring van een verdrag wordt onderzocht in hoeverre de naleving
      door het Koninkrijk wettelijke voorschriften vereist.

      2 Bij de voorbereiding van de parlementaire goedkeuring van een verdrag wordt eveneens onderzocht of het verdrag
      mogelijk een ieder verbindende bepalingen bevat als bedoeld in [artikel 93 Grondwet][ref1].

      3 Indien tot stand te brengen voorschriften bij wet moeten worden vastgesteld, wordt het desbetreffende
      wetsvoorstel in beginsel gelijktijdig met het wetsvoorstel tot goedkeuring van het verdrag bij de Tweede Kamer
      ingediend.


          **Toelichting**
          **Eerste lid.**Bij het in het eerste lid bedoelde onderzoek over uitvoeringswetgeving wordt in overleg met
      de afdeling Verdragen van de Directie Juridische Zaken van het Ministerie van Buitenlandse Zaken ook bezien of
      het verdrag bepalingen bevat die naar hun inhoud een ieder kunnen binden en niet verenigbaar zijn met binnen
      het Koninkrijk geldende wettelijke voorschriften, zodat aanpassing van die voorschriften nodig is. Dit omdat
      [artikel 94 van de Grondwet][ref2] bepaalt dat binnen het Koninkrijk geldende voorschriften geen toepassing vinden
      indien deze toepassing niet verenigbaar is met een ieder verbindende bepalingen van verdragen en van besluiten van
      volkenrechtelijke organisaties, en het, met het oog op de duidelijkheid van het geldende recht en ter vermijding
      van een onnodige werklast voor de rechter, wenselijk is wettelijke voorschriften die op grond van deze bepaling
      niet meer zullen worden toegepast, aan te passen.
          **Tweede lid.**De resultaten van dat onderzoek worden opgenomen in de toelichting op het verdrag.
      Zie ook [artikel 2, tweede lid, van de Rijkswet goedkeuring en bekendmaking verdragen][ref3], alsmede
      [aanwijzing 8.13][ref4].
          **Derde lid.**Deze aanwijzing verplicht niet in alle gevallen tot gelijktijdige indiening of inwerkingtreding
      van goedkeuringswet en uitvoeringswet. Bij uitzondering kunnen de goedkeuringswet en uitvoeringswet afzonderlijk
      bij de Tweede Kamer worden ingediend. Hierdoor kan de wet tot goedkeuring van het verdrag eerder tot stand komen
      en in werking treden dan de in de regel wat complexere formele uitvoeringswetgeving. Het verdrag kan dan sneller
      worden geratificeerd. Dit kan wenselijk zijn in geval van politiek belangrijke verdragen, waarvan verwacht wordt
      dat de inwerkingtreding ervan lang op zich zal laten wachten en het wenselijk wordt geacht dat ons land het verdrag
      in een vroeg stadium ratificeert. De uitvoeringswetgeving moet uiteraard wel van kracht zijn of worden op het
      moment dat het verdrag in kwestie in werking treedt om te voorkomen dat internationale verdragsverplichtingen niet
      (kunnen) worden nagekomen.
          Het ontwerp voor een mogelijk noodzakelijke algemene maatregel van bestuur of ministeriële regeling moet met
      inachtneming van de [aanwijzingen 2.33][ref5] en [4.15, tweede lid][ref6], ook op een zodanig moment in procedure
      worden gebracht dat tijdige inwerkingtreding is gegarandeerd.
          Bij verdragen die deels betrekking hebben op bevoegdheden van de EU en deels betrekking hebben op bevoegdheden
      van Nederland, wordt bij de toepassing van deze aanwijzing rekening gehouden met ratificatie door de EU, met
      inbegrip van het tijdstip van ratificatie en de vaststelling van eventuele bindende EU-rechtshandelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel94
      [ref3]: https://wetten.overheid.nl/BWBR0006799#Artikel2
