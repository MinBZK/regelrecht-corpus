  - number: 2.3.a
    text: kennis wordt vergaard over de relevante feiten en omstandigheden met betrekking tot het bewuste onderwerp;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.3
  - number: 2.3.b
    text: de doelen die moeten worden bereikt, worden zo concreet en nauwkeurig mogelijk vastgesteld;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.3
  - number: 2.3.c
    text: |-
      onderzocht wordt of de doelen kunnen worden bereikt door middel van het zelfregulerend vermogen in de betrokken
      sector of sectoren, of dat daarvoor overheidsinterventie noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.3
  - number: 2.3.d
    text: |-
      indien overheidsinterventie noodzakelijk is, wordt onderzocht of de gekozen doelen kunnen worden bereikt door
      aanpassing of beter gebruik van bestaande instrumenten dan wel, indien dit niet mogelijk blijkt, welke nieuwe
      instrumenten kunnen worden ingezet om de doelen te bereiken;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.3
  - number: 2.3.e
    text: de diverse mogelijkheden worden zorgvuldig tegen elkaar afgewogen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.3
  - number: '2.4'
    text: |-
      Met het doen van uitspraken en toezeggingen over nieuwe regelingen wordt grote terughoudendheid betracht.
          **Toelichting**
          Om recht te doen aan het in de [aanwijzingen 2.3][ref1] en [4.42][ref2] beschreven afwegings- en
      verantwoordingsproces moeten niet vooraf al bepaalde voorstellen worden gepresenteerd. Bovendien is het vaak niet
      of nauwelijks mogelijk daarvan terug te komen, ook niet wanneer daarvoor bij nader inzien goede redenen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
