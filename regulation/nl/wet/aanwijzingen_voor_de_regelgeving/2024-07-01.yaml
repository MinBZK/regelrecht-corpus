  - number: '9.14'
    text: |-
      1 Zij die deelnemen aan de voorbereiding van of de onderhandelingen over bindende EU-rechtshandelingen dragen er
      zorg voor dat de wetgevingsafdelingen van de betrokken ministeries daarbij worden ingeschakeld.

      2 De inschakeling vindt plaats in een zo vroeg mogelijk stadium, doch uiterlijk bij de invulling van het in
      [aanwijzing 9.15][ref1] bedoelde formulier.


          **Toelichting**
          Tijdige inschakeling van de wetgevingsafdeling kan problemen bij de implementatie van eenmaal vastgestelde
      bindende EU-rechtshandelingen voorkomen en een bijdrage leveren aan de juridische kwaliteit van de bindende EU-
      rechtshandelingen.
          Afhankelijk van de aard van de materie kan de betrokkenheid van wetgevingsafdelingen variëren. Mogelijke
      varianten zijn:
          het toezenden van EU-documenten met een aanduiding van het stadium waarin het voorstel zich bevindt en een
      gericht verzoek om commentaar;
      het houden van een intern instructieoverleg ter afstemming van de inbreng (als geen wetgevingsjuristen deelnemen
      aan de onderhandelingen);
      het deelnemen aan de onderhandelingen indien implementatie naar verwachting belangrijke consequenties zal hebben
      voor de nationale regelgeving;
      het inrichten van een dossierteam, waarin de wetgevingsjurist van het onderhandelingsstadium tot en met het
      implementatiestadium in oplopende mate betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
