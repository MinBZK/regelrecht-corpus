  - number: '5.31'
    text: |-
      Indien voor de uitvoering van een regeling gegevens van burgers, bedrijven of instellingen nodig zijn, wordt voor
      de omschrijving van de daaraan ten grondslag liggende begrippen zoveel mogelijk verwezen naar of aangesloten bij de
      definities uit de wetten inzake de basisregistraties.


          **Toelichting**
          Een belangrijk uitgangspunt bij het inrichten van (e-)overheidsdienstverlening is dat van ‘eenmalig aanleveren,
      meervoudig gebruik’ van gegevens. De overheid vraagt van burgers, bedrijven en instellingen geen gegevens waarover
      zij al beschikt. Spiegelbeeld hiervan is dat burgers, bedrijven en instellingen bij bijvoorbeeld het doen van
      belastingaangifte of aanvraag van een vergunning, geen gegevens behoeven te verstrekken die al bij de overheid
      bekend zijn.
          Om dit uitgangspunt in de praktijk te realiseren, is een stelsel van basisregistraties ingericht, waarin
      basisgegevens zijn opgenomen die nodig zijn voor het uitvoeren van verschillende (beslis)processen van
      overheidsorganisaties. Een deel van de gegevens in die basisregistraties is aangemerkt als ‘authentiek’, dat
      wil zeggen dat een overheidsorganisatie in beginsel kan uitgaan van de juistheid van het gegeven en in beginsel
      verplicht is dit te gebruiken bij de uitvoering van zijn taken.
          De genoemde verplichting van overheidsorganisaties en het recht van burgers, bedrijven en instellingen is ten
      aanzien van deze authentieke gegevens expliciet vastgelegd in de verschillende wetten inzake basisregistraties. Zie
      bijvoorbeeld de [Wet basisregistratie personen][ref1] en de [Wet basisregistraties adressen en gebouwen][ref2]. Er
      zijn in totaal 11 basisregistraties. Zie voor meer informatie www.digitaleoverheid.nl.
          Om het uitgangspunt van eenmalig aanleveren, meervoudig gebruik zo breed mogelijk ingang te doen vinden, is
      nodig dat in wetgeving waarin gegevensuitwisseling met de overheid aan de orde is, zoveel mogelijk wordt verwezen
      naar of aangesloten bij begrippen uit de basisregistraties.
          Een overzicht van de basisregistraties en de daarin opgenomen begrippen en authentieke gegevens is opgenomen in
      de Stelselcatalogus. Zie www.stelselcatalogus.nl *.*


      [ref1]: https://wetten.overheid.nl/BWBR0033715
      [ref2]: https://wetten.overheid.nl/BWBR0023466
