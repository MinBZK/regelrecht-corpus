  - number: '7.8'
    text: |-
      1 Indien in een regeling voorschriften worden vastgesteld die ingevolge een bindende EU-rechtshandeling of andere
      internationale verplichting in ontwerp zijn genotificeerd aan een instelling van de Europese Unie of van een andere
      internationale organisatie, wordt dat vermeld in het algemeen deel van de toelichting bij die regeling, onder
      verwijzing naar de desbetreffende EU-rechtshandeling of internationale verplichting. Voor de vermelding wordt het
      volgende model als uitgangspunt genomen:

      *[Het voorstel van wet / Het ontwerpbesluit / De ontwerpregeling] is op [datum notificatie] ingevolge artikel ...
      van [aanduiding bindende EU-rechtshandeling of internationale verplichting] voorgelegd aan [aanduiding instelling].
      Naar aanleiding van de reacties van [aanduiding instelling of andere betrokkenen] wordt het volgende opgemerkt.
      [reactie of doorgevoerde aanpassingen].*

      2 Indien het een notificatie in het kader van de op 15 april 1994 te Marrakech tot stand gekomen Overeenkomst
      inzake technische handelsbelemmeringen (Trb. 1994, 235) betreft, wordt daarvan tevens mededeling gedaan in de
      Staatscourant. Voor de mededeling wordt het volgende model als uitgangspunt genomen:

      *Ter voldoening aan [artikel 2, negende lid, / artikel 5, zesde lid,] van de op 15 april 1994 te Marrakech tot
      stand gekomen Overeenkomst inzake technische handelsbelemmeringen (Trb. 1994, 235), deelt de Minister [van /
      voor ...] mee dat een [voorstel van wet / ontwerpbesluit / ontwerpregeling tot / , houdende ...] waarin [technische
      voorschriften / voorschriften omtrent keuringen] worden gesteld aan [aanduiding soort goederen], is gemeld aan het
      Secretariaat van de Wereldhandelsorganisatie. Informatie over deze technische voorschriften kan worden ingewonnen
      bij het Ministerie van [...].*


          **Toelichting**
          **Eerste lid.**Indien het een notificatie betreft ingevolge richtlijn (EU) 2015/1535 (zie
      [aanwijzing 7.7][ref1]), dient in de toelichting tevens indicatief te worden aangegeven welke bepalingen
      vermoedelijk technische voorschriften bevatten en waarom deze bepalingen verenigbaar zijn met de artikelen 34 tot
      en met 36 VWEU (vrij verkeer van goederen).
          **Tweede lid.** De keuze voor een van beide artikelen uit de Overeenkomst inzake technische
      handelsbelemmeringen is afhankelijk van de vraag of in de regeling technische voorschriften (artikel 2, negende
      lid) of voorschriften omtrent keuringen (artikel 5, zesde lid) zijn opgenomen. Indien een regeling beide bevat,
      moeten beide artikelen en aspecten worden genoemd.


