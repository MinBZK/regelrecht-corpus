  - number: '2.23'
    text: |-
      Delegatie van regelgevende bevoegdheid wordt in de delegerende regeling zo concreet en nauwkeurig mogelijk
      begrensd.


          **Toelichting**
          Voor de begrenzing van gedelegeerde regelgevende bevoegdheid kan worden gedacht aan het concretiseren van de
      omstandigheden waarin van de gedelegeerde bevoegdheid gebruik mag worden gemaakt, van de te regelen onderwerpen en
      van de doeleinden waartoe zij mag worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.23
  - number: '2.24'
    text: |-
      1 Delegatie van regelgevende bevoegdheid aan een minister wordt beperkt tot voorschriften van administratieve aard,
      uitwerking van de details van een regeling, voorschriften die dikwijls wijziging behoeven en voorschriften waarvan
      te voorzien is dat zij mogelijk met grote spoed moeten worden vastgesteld.

      2 Delegatie van regelgevende bevoegdheid aan een minister is ook toegestaan indien het gaat om het verwerken in
      de Nederlandse wetgeving van internationale regelingen die de Nederlandse wetgever, behoudens op ondergeschikte
      punten, geen ruimte laten voor het maken van keuzen van beleidsinhoudelijke aard.


          **Toelichting**
          Indien delegatie plaatsvindt verdient het de voorkeur dat de bevoegdheid wordt toegekend bij algemene
      maatregel van bestuur regels te stellen. Slechts in bepaalde gevallen is delegatie of subdelegatie aan een
      minister geoorloofd. Deze aanwijzing geeft aan welke gevallen dit zijn. Onder omstandigheden kan het ook
      gaan om een (tijdelijke) ministeriële regeling die de instelling van een vergunningplicht inhoudt (vgl.
      [artikel 2 van de Wet op bijzondere medische verrichtingen][ref1]). Zie ook [aanwijzing 9.8][ref2].
          De aanwijzing ziet niet op rechtspositionele regelingen ten aanzien van overheidspersoneel, aangezien deze in
      belangrijke mate een intern karakter hebben


      [ref1]: https://wetten.overheid.nl/BWBR0008974#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.24
    references:
      - id: ref1
