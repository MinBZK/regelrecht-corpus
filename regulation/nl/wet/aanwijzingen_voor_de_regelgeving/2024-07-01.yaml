  - number: '2.13'
    text: |-
      Taken en bevoegdheden worden op decentraal niveau gelegd, tenzij het onderwerp van zorg niet op doelmatige en
      doeltreffende wijze door decentrale organen kan worden behartigd.


          **Toelichting**
          **Territoriale decentralisatie.** Als uitgangspunt geldt dat, indien taken op doelmatige en doeltreffende wijze
      kunnen worden verricht door besturen van provincies, gemeenten, waterschappen of de openbare lichamen Bonaire, Sint
      Eustatius en Saba, zij niet behoren te worden opgedragen aan het Rijk. Evenmin behoren taken die op doelmatige en
      doeltreffende wijze door besturen van gemeenten of waterschappen kunnen worden verricht, te worden opgedragen aan
      de besturen van provincies. Zie ook de [aanwijzingen 5.23][ref1] en [5.24][ref2].
          **Algemeen of functioneel bestuur.** Steeds zal een keuze gemaakt moeten worden tussen territoriale of
      functionele decentralisatie. Uitgangspunt is dat het zwaartepunt van de politieke en bestuurlijke activiteit berust
      bij organen van algemeen bestuur (Rijk, provincies, gemeenten en de openbare lichamen Bonaire, Sint Eustatius
      en Saba). Functioneel bestuur kan onder omstandigheden een goede aanvulling bieden op het algemeen bestuur,
      bijvoorbeeld gezien de aard van de betrokken taak of de schaal waarop deze behartigd dient te worden. Zie inzake
      organen van functioneel bestuur (zelfstandige bestuursorganen) [paragraaf 5.4][ref3] van deze aanwijzingen.
          **Beleidsvrijheid voor provincies en gemeenten.** Nederland is een gedecentraliseerde eenheidsstaat. Provincies
      en gemeenten vormen als decentrale bestuurslagen van algemeen bestuur met een rechtstreekse democratische
      legitimatie, een open huishouding, regelgevende bevoegdheid en een eigen belastinggebied, samen met het Rijk
      de bestuurlijke hoofdstructuur van ons land. Binnen de bestuurlijke hoofdstructuur dient het zwaartepunt van
      de publieke taakuitoefening te liggen. Provincies en gemeenten zijn niet hiërarchisch ondergeschikt aan het
      Rijk, maar voeren hun taken zelfstandig uit binnen de kaders van de wet en de [Grondwet][ref4]. Zij hebben
      autonome bevoegdheden, maar kunnen ook bij wet worden verplicht bepaalde taken uit te voeren (medebewind). De
      [Gemeentewet (artikel 116, eerste lid)][ref5] en de [Provinciewet (artikel 114, eerste lid)][ref6] dragen de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties op om beleidsvrijheid te bevorderen. Dankzij beleidsvrijheid
      kunnen deze decentrale overheden democratisch gelegitimeerd en rekening houdend met de plaatselijke omstandigheden
      komen tot een goede afweging om beleid doelmatig en doeltreffend in te vullen.
          Zie met betrekking tot de toelichting bij de regeling ook [aanwijzing 4.43, onderdeel h][ref7].


