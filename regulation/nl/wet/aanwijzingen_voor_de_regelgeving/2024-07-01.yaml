  - number: '4.10'
    text: |-
      1 De uitdrukking ‘Gelet op’ verwijst naar de hogere regeling waarop de regelgevende bevoegdheid berust en in
      voorkomend geval naar de internationale regeling of bindende EU-rechtshandeling ter uitvoering waarvan de regeling
      strekt.

      2 Verwezen wordt naar de afzonderlijke artikelen van de hogere regeling, tenzij dit door het grote aantal artikelen
      niet doelmatig is.


          **Toelichting**
          **Internationale regeling of EU-rechtshandeling.**In geval van verwijzing naar zowel een internationale
      regeling of bindende EU-rechtshandeling als een nationale regeling, wordt de desbetreffende internationale regeling
      of bindende EU-rechtshandeling eerst vermeld. Deze aanwijzing geeft tevens invulling aan het in EU-richtlijnen
      opgenomen voorschrift dat naar de geïmplementeerde richtlijn wordt verwezen in de nationale uitvoeringsbepalingen
      of bij de officiële bekendmaking van die bepalingen, op een wijze die door de lidstaten wordt vastgesteld.
          **Ministeriële regelingen.** Bij uitvoering van een bepaling van een algemene maatregel van bestuur wordt in
      een ministeriële regeling bij ‘gelet op’ alleen naar deze bepaling verwezen en niet tevens naar de wetsbepaling
      waarop de algemene maatregel van bestuur steunt.
          **Beleidsregels.**Bij ‘gelet op’ wordt vermeld krachtens welk wettelijk voorschrift de beleidsregel is
      vastgesteld. Indien dit niet expliciet is bepaald zal de grondslag veelal gelegen zijn in [artikel 4:81 Awb][ref1]
      en wordt in zo'n geval dat artikel genoemd. Verder wordt bij ‘gelet op’ tevens het artikel van de regeling vermeld
      waarop de beleidsregel inhoudelijk betrekking heeft. Is er geen wettelijke grondslag (dit kan zich bijvoorbeeld
      voordoen bij een beleidsregel omtrent het verrichten van privaatrechtelijke handelingen), dan wordt ‘gelet op’
      weggelaten en wordt de reden hiervan in de toelichting vermeld.
          **Wijzigingsregelingen.**In een wijzigingsregeling wordt bij ‘gelet op’ niet verwezen naar de te wijzigen
      regeling. Indien een wijzigingsregeling er (mede) toe strekt om in een uitvoeringsregeling bepalingen te laten
      vervallen waaraan door intrekking of wijziging van de delegerende regeling de rechtsgrondslag is ontvallen, kan bij
      ‘gelet op’ de bepaling worden vermeld waarbij de delegerende regeling indertijd is ingetrokken of gewijzigd (zie
      ook de toelichting bij [aanwijzing 6.24, tweede lid][ref2]).
          **Wijziging van bijlagen.**Bij wijziging van een bijlage bij een uitvoeringsregeling wordt verwezen naar de
      bepaling waar de uitvoeringsregeling op is gebaseerd en niet (tevens) naar de bepaling in de uitvoeringsregeling
      waar de bijlage bij hoort.
          **Overeenkomstige toepassing regelgevende bevoegdheid.**Indien een bepaling die regelgevende bevoegdheid
      verleent, in een andere bepaling van overeenkomstige toepassing is verklaard op een ander gebied, wordt, ingeval
      ten aanzien van dat gebied regels worden gesteld, verwezen naar laatstbedoelde bepaling. Indien dat voor de
      duidelijkheid wenselijk is, kan daaraan een verwijzing naar de van overeenkomstige toepassing verklaarde bepaling
      worden toegevoegd. Voorbeeld: artikel 35 in samenhang met artikel 8.
          **Zelfstandige algemene maatregelen van bestuur.**Zie de toelichting bij [aanwijzing 2.22][ref3].
          **Verwijzing naar artikelleden.**Bij langere artikelen of artikelen die meerdere grondslagen bevatten wordt ook
      verwezen naar het specifieke artikellid of onderdeel, tenzij dit niet doelmatig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel481
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
