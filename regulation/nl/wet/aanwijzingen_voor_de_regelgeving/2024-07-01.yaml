  - number: '8.12'
    text: |-
      1 Voor een voorstel van (rijks)wet tot goedkeuring van een verdrag wordt het volgende model gevolgd:

      *Goedkeuring van het op ... te ... tot stand gekomen verdrag ... [zie aanwijzing 3.38]*

      *Wij Willem-Alexander, [zie verder aanwijzing 4.5]*

      *(...)*

      *Alzo Wij in overweging genomen hebben, dat het op ... te ... tot stand gekomen verdrag ... ingevolge artikel 91,
      eerste lid, van de Grondwet de goedkeuring van de Staten-Generaal behoeft, alvorens het Koninkrijk daaraan kan
      worden gebonden;*

      *Zo is het, dat Wij, de Afdeling advisering van de Raad van State [van het Koninkrijk] gehoord, en met gemeen
      overleg der Staten-Generaal, [de bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde,] hebben
      goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:*

      *Artikel 1*

      *Het op ... te ... tot stand gekomen verdrag ... , waarvan de ... tekst [en de vertaling in het Nederlands] [is/
      zijn] geplaatst in Tractatenblad [jaartal], nr. [ nummer] , wordt goedgekeurd voor [Nederland / het Europese deel
      van Nederland / het Caribische deel van Nederland / voor Aruba / voor Curaçao / voor Sint Maarten / voor het gehele
      Koninkrijk].*

      *Artikel 2*

      *Deze [rijks]wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij
      wordt geplaatst.*

      *Lasten en bevelen ... [zie verder aanwijzing 4.31, eerste lid].*

      2 Voor de goedkeuring van een voorbehoud bij een verdrag wordt het volgende model gebruikt:

      *Artikel (...)*

      *Goedgekeurd wordt dat bij de binding van het Koninkrijk aan het in artikel 1 genoemde verdrag voor [Nederland /
      het Europese deel van Nederland / het Caribische deel van Nederland / voor Aruba / voor Curaçao / voor Sint
      Maarten / voor het gehele Koninkrijk] het volgende voorbehoud wordt gemaakt: [tekst voorbehoud].*

      3 Voor een machtigingsbepaling als bedoeld in [aanwijzing 8.8, tweede lid][ref1], wordt het volgende model
      gebruikt:

      *Artikel (...)*

      *De besluiten, bedoeld in [artikel / de artikelen ...] van het in artikel 1 genoemde verdrag, behoeven niet de
      goedkeuring van de Staten-Generaal.*


          **Toelichting**
          **Eerste lid.** Indien het gaat om een goedkeuring achteraf (dat wil zeggen dat het Koninkrijk al aan
      het verdrag is gebonden omdat er sprake is van een buitengewoon geval van dringende aard als bedoeld in
      [artikel 10 van de Rijkswet goedkeuring en bekendmaking verdragen][ref2]) en indien het gaat om goedkeuring van een
      (voornemen tot) opzegging, moet de tekst van het wetsvoorstel uiteraard dienovereenkomstig worden aangepast.
          Indien ten aanzien van een ter stilzwijgende goedkeuring aan de Staten-Generaal overgelegd verdrag de wens
      te kennen is gegeven dat het verdrag aan de uitdrukkelijke goedkeuring zal worden onderworpen en de Afdeling
      advisering van de Raad van State niet opnieuw gehoord wordt, blijven niettemin in de aanhef de woorden ‘de
      Afdeling advisering van de Raad van State gehoord’ staan, omdat deze Afdeling dan al is gehoord in het kader van de
      stilzwijgende goedkeuringsprocedure.
          **Inwerkingtreding.** Artikel 2 van het model wordt gebruikt in het geval een voorstel van wet uitsluitend de
      goedkeuring van een verdrag regelt.
          In het geval dat een voorstel van wet tot goedkeuring van een verdrag meer regelt dan alleen de goedkeuring
      van het verdrag – bijvoorbeeld ook de uitvoeringswetgeving bevat – kan er aanleiding zijn een van de andere in
      [aanwijzing 4.21][ref3] vervatte inwerkingtredingsbepalingen te gebruiken.
          **Tweede lid.**Het maken van een voorbehoud heeft gevolgen voor de omvang van de verdragsverplichtingen die het
      Koninkrijk op zich neemt. Vandaar dat te maken voorbehouden parlementaire goedkeuring behoeven. Overigens kunnen
      voorbehouden alleen worden gemaakt als zij volkenrechtelijk toelaatbaar zijn.
          **Derde lid.**Zie [aanwijzing 8.8][ref4] voor de aanleiding om in een wetsvoorstel een machtigingsbepaling op
      te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0006799#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
