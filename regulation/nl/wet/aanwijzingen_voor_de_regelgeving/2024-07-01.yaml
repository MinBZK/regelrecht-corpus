  - number: '5.62'
    text: |-
      1 Aan een regeling wordt slechts terugwerkende kracht verleend, indien daarvoor een bijzondere reden bestaat.

      2 Door het verlenen van terugwerkende kracht aan een regeling worden de in die regeling voorziene rechtsgevolgen
      gerekend te zijn ingetreden vanaf een nader aangeduid tijdstip voorafgaande aan de inwerkingtreding van die
      regeling.

      3 Aan belastende regelingen wordt, behoudens in uitzonderlijke gevallen, geen terugwerkende kracht toegekend.

      4 Bij een regeling mag een feit dat vóór haar inwerkingtreding is geschied, niet strafbaar of zwaarder strafbaar
      worden gesteld.


          **Toelichting**
          Het toekennen van terugwerkende kracht brengt op zichzelf geen verandering in de feiten zelf mee, maar in de
      rechtsgevolgen daarvan. De mogelijkheid tot het verlenen van terugwerkende kracht wordt beperkt door internationale
      en nationale wettelijke bepalingen (zie de toelichting bij [aanwijzing 5.61][ref1]).
          Bij belastende regelingen betekent terugwerkende kracht in beginsel een aantasting van de rechtszekerheid van
      de burger. Een reden voor het toekennen van terugwerkende kracht kan zijn de noodzaak tot het plotseling laten
      gelden van een nieuwe regeling om te voorkomen dat burgers maatregelen treffen waardoor de regeling haar beoogde
      effect ontbeert of zelfs een tegenovergesteld effect sorteert. Alsdan kan de grensdatum van de terugwerkende kracht
      samenvallen met de datum waarop van betrokkenen redelijkerwijs kan worden gevergd dat zij reeds voorafgaande aan
      de inwerkingtreding met de verandering in de regelgeving rekening hielden. Voorts kan gedacht worden aan gevallen
      waarin de regelgeving een achterstand heeft opgelopen ten opzichte van in de praktijk noodzakelijk gebleken
      ontwikkelingen die legalisering achteraf behoeven. Legalisering dient dan wel op zo kort mogelijke termijn te
      geschieden, opdat de periode waarover de regeling terugwerkt, beperkt blijft. Zie voor een nadere beschouwing
      over de uitzonderlijke gevallen waarin aan belastende regelingen terugwerkende kracht kan worden toegekend: de
      beleidslijn bij het toekennen van terugwerkende kracht aan belastende fiscale maatregelen, zoals omschreven in
      Kamerstukken II 1996/97, 25212, nr. 2, en I 2009/10, 25212, A. Deze beleidslijn kan ook worden toegepast buiten het
      terrein van de fiscale regelgeving.
          Zie voor het toekennen van terugwerkende kracht aan gedelegeerde regelingen CRvB 20 oktober 1983,
      ECLI:NL:CRVB:1983:AK2292.
          Bij het achteraf legaliseren van praktische ontwikkelingen verdient het de voorkeur gebruik
      te maken van specifieke constructies als bekrachtiging en conversie in plaats van terugwerkende
      kracht, vergelijk bijvoorbeeld de [artikelen 39][ref2] en [79][ref3], onderscheidenlijk [50][ref4] en
      [86, van de Overgangswet voor het Nieuw Burgerlijk Wetboek][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
