        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0005730
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref4
        bwb_id: BWBR0005730
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.33.1
    text: |-
      Indien er de voorkeur aan wordt gegeven dat de (eerst)verantwoordelijke bewindspersoon en niet de voorzitter
      van de Tweede Kamer zorg draagt voor een doorlopende nummering van een wet, wordt dit bepaald overeenkomstig het
      volgende model: *Voor de plaatsing van deze wet in het Staatsblad stelt Onze Minister [van/voor ...] de nummering
      van de artikelen [, hoofdstukken en paragrafen] van deze wet opnieuw vast en brengt hij de in deze wet voorkomende
      aanhalingen van de artikelen [, hoofdstukken en paragrafen] met de nieuwe nummering in overeenstemming.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.33
  - number: 6.33.2
    text: |-
      In dat geval geschiedt de vaststelling van de nieuwe nummering en het daarmee in overeenstemming brengen van
      de desbetreffende aanhalingen bij een door de betrokken bewindspersoon vastgesteld en ondertekend besluit
      overeenkomstig het volgende model: *De Minister van/voor ... / de Staatssecretaris van ...,* *Gelet op artikel ...
      [bepaling overeenkomstig het in het eerste lid gegeven model];* *Besluit:* *Enig artikel* *Overeenkomstig de
      bij dit besluit behorende bijlage wordt de nummering van de artikelen [, hoofdstukken en paragrafen] van de ...
      [citeertitel van de wet] opnieuw vastgesteld en worden de in die wet voorkomende aanhalingen van de artikelen [,
      hoofdstukken en paragrafen] met de nieuwe nummering in overeenstemming gebracht.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.33
  - number: '6.34'
    text: |-
      Indien het gewenst is ten aanzien van een wetsvoorstel tijdens of na de behandeling in de Eerste Kamer maar voor
      de bekrachtiging door de Koning een wijzigingsvoorstel in te dienen, wordt dit voorstel geformuleerd overeenkomstig
      het volgende model: *ARTIKEL I* *Indien het bij [koninklijke boodschap van [datum] ingediende / geleidende brief
      van [datum] aanhangig gemaakte] voorstel van wet [als aanwijzing 3.43, tweede lid] tot wet wordt verheven, wordt
      die wet als volgt gewijzigd: ...*
          **Toelichting**
          Een wijzigingswet als bedoeld in deze aanwijzing wordt een novelle genoemd. Zie
      [aanwijzing 3.43, tweede lid][ref1], voor de wijze waarop bij de toepassing van het model de verwijzing naar het
      Kamerstuknummer wordt vormgegeven.
          Zie voor de inwerkingtreding van een novelle [aanwijzing 4.21, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.34
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: '7.1'
    text: |-
      Bij de voorbereiding van een regeling worden de onderdelen van andere ministeries betrokken die bemoeienis hebben
      met het te regelen onderwerp of een onderdeel daarvan of met onderwerpen die door de regeling worden geraakt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.1
  - number: 7.2.1
    text: |-
      Over een regeling die van betekenis is voor het rijksbeleid inzake decentrale overheden, overlegt het
      eerstverantwoordelijke ministerie in een vroegtijdig stadium met het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.2
  - number: 7.2.2
    text: |-
      Indien de regeling wijziging brengt in de taken en bevoegdheden van decentrale overheden, vindt tijdig overleg
      plaats met de beheerders van het gemeentefonds, het provinciefonds of het BES-fonds over de financiële gevolgen
      daarvan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.2
  - number: 7.3.1
    text: |-
      Bij de voorbereiding van een regeling die een koninkrijksaangelegenheid betreft, vindt overleg plaats met de
      kabinetten van de Gevolmachtigde Ministers van Aruba, Curaçao en Sint Maarten. Het Ministerie van Binnenlandse
      Zaken en Koninkrijksrelaties wordt van contacten met de kabinetten van de Gevolmachtigde Ministers op de hoogte
      gehouden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.3
  - number: 7.3.2
    text: |-
      Het eerste lid is eveneens van toepassing bij de voorbereiding van een regeling ten aanzien waarvan concordantie
      is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.3
  - number: 7.4.1
    text: |-
      Vanwege de primaire verantwoordelijkheid van de betrokken bewindspersoon van het Ministerie van Justitie en
      Veiligheid voor de toetsing van wetgeving op rechtsstatelijke en bestuurlijke kwaliteit, met inbegrip van de
      constitutionele, Europeesrechtelijke en internationaalrechtelijke toetsing van wetgeving, worden de volgende
      stukken, voordat zij ter behandeling aan de ministerraad of een onderraad worden aangeboden, ter toetsing aan de
      Directie Wetgeving en Juridische Zaken van het Ministerie van Justitie en Veiligheid voorgelegd:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.4
  - number: 7.4.1.a
    text: voorstellen van wet;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.4
  - number: 7.4.1.b
    text: ontwerpen van algemene maatregelen van bestuur;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.4
  - number: 7.4.1.c
    text: ingrijpende nota’s van wijziging op een wetsvoorstel;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.4
  - number: 7.4.1.d
    text: |-
      een voorstel van wet of ontwerp van een algemene maatregel van bestuur en het nader rapport daarbij, ingeval het
      advies van de Afdeling advisering van de Raad van State daarop ingrijpende kritiek op inhoud of vormgeving bevat.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.4
  - number: 7.4.2
    text: |-
      Vanwege de verantwoordelijkheid van de Minister van Binnenlandse Zaken en Koninkrijksrelaties voor het beheer van
      de [Grondwet][ref1] werkt het Ministerie van Justitie en Veiligheid bij de constitutionele toetsing van wetgeving
      samen met het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 7.4.3
    text: |-
      Vanwege de verantwoordelijkheid van de Minister van Buitenlandse Zaken voor de eenheid van de uitleg van het
      internationale en Europese recht werkt het Ministerie van Justitie en Veiligheid bij de internationaalrechtelijke
      en Europeesrechtelijke toetsing van wetgeving samen met het Ministerie van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.4
  - number: 7.4.4
    text: |-
      Het voorleggen geschiedt dusdanig tijdig, dat er voldoende ruimte is voor reëel overleg over alternatieve
      mogelijkheden, indien de Directie Wetgeving en Juridische Zaken dat noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.4
  - number: 7.4.5
    text: |-
      Het eerste lid is niet van toepassing op stukken als bedoeld in het eerste lid, onder a tot en met c, waarover in
      overleg tussen het betrokken ministerie en het Ministerie van Justitie en Veiligheid is bepaald dat deze niet ter
      toetsing voorgelegd hoeven worden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.4
  - number: 7.5.1
    text: |-
      In de toelichting bij een regeling worden door het eerstverantwoordelijke ministerie in daarvoor in aanmerking
      komende gevallen de gevolgen van de regeling voor bedrijven en voor het milieu uiteengezet en waar nodig
      gekwantificeerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.5
  - number: 7.5.2
    text: |-
      De wijze waarop de gevolgen voor bedrijven in de toelichting zijn weergegeven wordt getoetst door het Ministerie
      van Economische Zaken en Klimaat.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.5
  - number: 7.5a.1
    text: |-
      In de toelichting bij een regeling worden de gevolgen van de regeling voor de regeldruk uiteengezet en
      gekwantificeerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.5a
  - number: 7.5a.2
    text: |-
      De wijze waarop de gevolgen voor de regeldruk in de toelichting zijn weergegeven wordt getoetst door het
      Adviescollege toetsing regeldruk.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.5a
  - number: 7.5b
    text: |-
      Bij een regeling met een ICT-component van ten minste € 5.000.000 wordt advies gevraagd aan het Adviescollege ICT-
      toetsing. **Toelichting** Ingevolge het Instellingsbesluit Adviescollege ICT-toetsing dienen ICT-projecten met
      een ICT-component van ten minste € 5.000.000 van de ministeries, publiekrechtelijke zelfstandige bestuursorganen
      als bedoeld in artikel 4 van de Kaderwet zelfstandige bestuursorganen, de politie of de Raad voor de rechtspraak
      voorgelegd te worden aan het Adviescollege ICT-toetsing teneinde een advies te verkrijgen over de risico’s en
      slaagkans, alsmede een oordeel over de mate van beheersbaarheid daarvan. Het adviestraject leidt tot een openbaar
      advies.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.5b
  - number: 7.6.1
    text: |-
      In de toelichting bij een regeling worden door het eerstverantwoordelijke ministerie in daarvoor in aanmerking
      komende gevallen de gevolgen van de regeling voor decentrale overheden uiteengezet.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.6
  - number: 7.6.2
    text: |-
      De wijze waarop dit aspect is verantwoord in de toelichting bij de regeling wordt getoetst door het Ministerie van
      Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.6
  - number: 7.7.1
    text: |-
      Bij de voorbereiding van regelingen beziet het voor de regeling eerstverantwoordelijke ministerie steeds of
      bindende EU-rechtshandelingen of andere internationale verplichtingen ertoe noodzaken het ontwerp van de regeling
      te notificeren aan een instelling van de Europese Unie of van een andere internationale organisatie.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.7
  - number: 7.7.2
    text: |-
      Bij de bepaling van het tijdstip van vaststelling van de regeling wordt in voorkomend geval de voorgeschreven
      standstillperiode in acht genomen dan wel stilzwijgende of uitdrukkelijke goedkeuring van de desbetreffende
      instelling afgewacht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.7
  - number: 7.8.1
    text: |-
      Indien in een regeling voorschriften worden vastgesteld die ingevolge een bindende EU-rechtshandeling of andere
      internationale verplichting in ontwerp zijn genotificeerd aan een instelling van de Europese Unie of van een andere
      internationale organisatie, wordt dat vermeld in het algemeen deel van de toelichting bij die regeling, onder
      verwijzing naar de desbetreffende EU-rechtshandeling of internationale verplichting. Voor de vermelding wordt
      het volgende model als uitgangspunt genomen: *[Het voorstel van wet / Het ontwerpbesluit / De ontwerpregeling]
      is op [datum notificatie] ingevolge artikel ... van [aanduiding bindende EU-rechtshandeling of internationale
      verplichting] voorgelegd aan [aanduiding instelling]. Naar aanleiding van de reacties van [aanduiding instelling of
      andere betrokkenen] wordt het volgende opgemerkt. [reactie of doorgevoerde aanpassingen].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.8
  - number: 7.8.2
    text: |-
      Indien het een notificatie in het kader van de op 15 april 1994 te Marrakech tot stand gekomen Overeenkomst
      inzake technische handelsbelemmeringen (Trb. 1994, 235) betreft, wordt daarvan tevens mededeling gedaan in de
      Staatscourant. Voor de mededeling wordt het volgende model als uitgangspunt genomen: *Ter voldoening aan [artikel
      2, negende lid, / artikel 5, zesde lid,] van de op 15 april 1994 te Marrakech tot stand gekomen Overeenkomst
      inzake technische handelsbelemmeringen (Trb. 1994, 235), deelt de Minister [van / voor ...] mee dat een [voorstel
      van wet / ontwerpbesluit / ontwerpregeling tot / , houdende ...] waarin [technische voorschriften / voorschriften
      omtrent keuringen] worden gesteld aan [aanduiding soort goederen], is gemeld aan het Secretariaat van de
      Wereldhandelsorganisatie. Informatie over deze technische voorschriften kan worden ingewonnen bij het Ministerie
      van [...].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.8
  - number: 7.9.1
    text: |-
      Aan de Afdeling advisering van de Raad van State worden geen voorstellen van wet of ontwerpen voor een algemene
      maatregel van bestuur voorgelegd, ten aanzien waarvan de beleidsvoorbereiding en de besluitvorming in de
      ministerraad nog niet is afgerond.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.9
  - number: 7.9.2
    text: |-
      Een ontwerp voor een algemene maatregel van bestuur wordt in beginsel niet eerder aan de Afdeling advisering van de
      Raad van State voorgelegd, dan nadat het wetsvoorstel dat aan de algemene maatregel van bestuur ten grondslag ligt,
      door de Tweede Kamer is aanvaard.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.9
  - number: '7.10'
    text: |-
      Bij een adviesaanvraag aan de Afdeling advisering van de Raad van State over een voorstel van wet of een ontwerp
      voor een algemene maatregel van bestuur worden de volgende adviezen over dat voorstel of ontwerp die door het
      ministerie zijn ontvangen, aan de Afdeling advisering toegezonden:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.10
  - number: 7.10.a
    text: adviezen van de Europese Commissie;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.10
  - number: 7.10.b
    text: adviezen van adviescolleges;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.10
  - number: 7.10.c
    text: |-
      adviezen van belangrijke organisaties van belanghebbenden indien kennisneming ervan kan dienen tot een beter
      inzicht in de in het voorstel of het ontwerp en de toelichting vervatte beleidskeuzen;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.10
  - number: 7.10.d
    text: overige adviezen waarnaar in de memorie of nota van toelichting wordt verwezen;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.10
  - number: 7.10.e
    text: overige adviezen, waarvan de verantwoordelijke bewindspersoon toezending wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.10
  - number: '7.11'
    text: |-
      Het vragen van een spoedbehandeling van een adviesaanvraag kan slechts worden gedaan met machtiging van de
      ministerraad.
          **Toelichting**
          Indien een voorgesteld verzoek om spoedbehandeling betrekking heeft op een ontwerpregeling die in een onderraad
      van de ministerraad wordt behandeld, kan het voorstel aan de onderraad worden toegezonden.
          Het ligt in de rede dat de ministerraadsbehandeling van een voorgesteld verzoek om spoedbehandeling
      gelijktijdig plaatsvindt met de behandeling van de ontwerpregeling waarop het verzoek betrekking heeft. Dit zal
      echter niet mogelijk zijn indien er na de behandeling in de ministerraad, doch voor de toezending aan de Afdeling
      advisering van de Raad van State, nog tijd gemoeid is met andere procedures, zoals voorpublicatie en advisering
      door adviescolleges. In die gevallen moet een voorgesteld verzoek om spoedbehandeling na afronding van die
      procedures aan de ministerraad worden voorgelegd, waarbij in het algemeen evenwel kan worden afgeweken van de 7-
      dagentermijn die geldt voor het aanbieden van stukken aan de ministerraad.
          De beslissing om een spoedbehandeling te vragen blijft primair behoren tot de verantwoordelijkheid van de
      betrokken bewindspersoon. Het is wel van belang dat steeds een zorgvuldige afweging wordt gemaakt; het vragen van
      spoedadvies dient uitzondering te zijn.
          Voor het voorstel aan de ministerraad om een spoedbehandeling kan worden volstaan met de brief aan de vice-
      president van de Raad van State waarin wordt verzocht om een spoedbehandeling van de adviesaanvraag. Deze brief
      wordt in concept aan de ministerraad voorgelegd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.11
  - number: 7.11a
    text: |-
      Een beslissing als bedoeld in [artikel 3.3, vijfde lid, onderdeel a, van de Wet open overheid][ref1], tot het
      uitstellen van de openbaarmaking van een ontwerpregeling, de bijbehorende adviesaanvraag en het daarop betrekking
      hebbende advies van de Afdeling advisering van de Raad van State, wordt slechts genomen met machtiging van de
      ministerraad.

      De [Woo][ref2] voorziet in [artikel 3.3, vijfde lid, onderdeel a][ref3], in een uitzondering op de hoofdregel
      dat ontwerpregelingen waarover advies wordt gevraagd aan de Afdeling advisering van de Raad van State, zo snel
      mogelijk maar uiterlijk binnen een termijn van twee weken actief openbaar worden gemaakt. Deze uitzondering geldt
      tevens voor de openbaarmaking van het uitgebrachte advies, waarvoor als hoofdregel eveneens een tweewekentermijn
      geldt (deze hoofdregel vloeit thans voort uit [artikel 10.2b Woo][ref4], dat voorziet in overgangsrecht zolang
      artikel 3.3, tweede lid, Woo inzake actieve openbaarmaking nog niet in werking is getreden). De mogelijkheid
      om de openbaarmaking uit te stellen is uitsluitend bedoeld voor situaties waarin openbaarmaking conform de
      tweewekentermijn afbreuk zou doen aan een met de regeling beoogd doel. In de parlementaire geschiedenis van de
      Woo genoemde voorbeelden zijn de [Tijdelijke wet taakverwaarlozing Sint Eustatius][ref5] en fiscale wetten die
      anticiperend gedrag kunnen uitlokken. Een dergelijke situatie zal zich slechts in uitzonderlijke gevallen voordoen.

      De beslissing om de openbaarmaking van de genoemde stukken uit te stellen behoort primair tot de
      verantwoordelijkheid van de betrokken bewindspersoon. Van belang is dat aan deze beslissing een zorgvuldige
      afweging voorafgaat. Daarbij dient afstemming plaats te vinden met het Ministerie van Binnenlandse Zaken en
      Koninkrijksrelaties.

      Voor het voorstel aan de ministerraad om deze uitzondering uit de [Woo][ref6] toe te passen kan worden volstaan
      met het ontwerp van de brief van de verantwoordelijke minister aan de vice-president van de Raad van State waarin
      gemotiveerd kennis wordt gegeven van de uitgestelde openbaarmaking. Deze brief wordt in concept aan de ministerraad
      voorgelegd.

      [Artikel 3.3, vijfde lid, onder a, Woo][ref7] is eveneens van toepassing op eventuele adviesaanvragen voorafgaand
      aan adviesaanvragen aan de Afdeling advisering. In die fase is geen instemming van de ministerraad noodzakelijk.
      In dergelijke gevallen zal echter als genoemde bepaling aan de orde is, terughoudend worden omgegaan met andere
      formele adviesaanvragen dan het wettelijk verplichte advies van de Afdeling advisering.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045754
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0045754#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0040611
      [ref6]: https://wetten.overheid.nl/BWBR0045754
      [ref7]: https://wetten.overheid.nl/BWBR0045754#Artikel3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel7.11a
