  - number: '4.33'
    text: |-
      1 Een regeling wordt ondertekend door één bewindspersoon, tenzij de voordracht tot het voorstel van wet of de
      algemene maatregel van bestuur is gedaan ‘mede namens’ een of meer andere bewindspersonen of er bijzondere redenen
      zijn om de gelijkwaardigheid van de verantwoordelijkheid van de verschillende bewindspersonen in de ondertekening
      tot uitdrukking te brengen.

      2 Indien de uitvoering van de regeling geheel of in belangrijke mate geschiedt door ambtenaren die ressorteren
      onder een andere bewindspersoon dan de ondertekenaar of ondertekenaars krachtens het eerste lid, wordt
      medeondertekening door die andere bewindspersoon overwogen. Hetzelfde geldt indien de regeling deel gaat uitmaken
      van een regeling die onder een andere bewindspersoon ressorteert.


          **Toelichting**
          De ondertekening van een regeling brengt de verantwoordelijkheid voor de voorbereiding en de inhoud van die
      regeling tot uitdrukking. Een regeling wordt slechts ondertekend door de bewindspersoon of bewindspersonen die
      belast is of zijn met de behartiging van een belang dat de betrokken regeling beoogt te dienen. Ondertekening door
      een bewindspersoon die belast is met de behartiging van een belang dat bij de regeling slechts van ondergeschikte
      aard is, kan achterwege worden gelaten. Medeondertekening dient niet plaats te vinden door bewindspersonen die
      verantwoordelijk zijn voor een belang dat slechts door de regeling wordt geraakt. Zie voor de wijze waarop de
      beleidsafstemming met die bewindspersonen moet plaatsvinden: [aanwijzing 2.27][ref1]. Indien het onderwerp van
      een regeling de portefeuilles van zowel de minister als de staatssecretaris van het betrokken ministerie raakt, is
      gezamenlijke ondertekening van de regeling door beiden niet nodig, maar wel mogelijk.
          Bij een voordracht ‘mede namens’ wordt de wet of het koninklijk besluit door alle voordragende bewindspersonen
      gecontrasigneerd. Zie ook [aanwijzing 4.7][ref2].
          Het tweede lid ziet bijvoorbeeld op de situatie dat in het [Wetboek van Koophandel][ref3] bepalingen over
      de nationaliteit van zeeschepen worden opgenomen. Medeondertekening van de desbetreffende regeling door de
      bewindspersoon onder wie de uitvoerende dienst ressorteert, geeft dan uitdrukking aan zijn verantwoordelijkheid
      voor de kwaliteit van de dienstuitvoering door het bedoelde onderdeel.
          Het is geen automatisme dat bewindspersonen die verantwoordelijk zijn voor de totstandkoming van een bepaalde
      regeling ook verantwoordelijk zijn voor wijziging van elk gedeelte van die regeling.
          Anders dan bij wetten en algemene maatregelen van bestuur het geval is, houdt de ondertekening van een
      ministeriële regeling door een bewindspersoon de vaststelling van die regeling in. Een ministeriële regeling kan
      dan ook slechts worden ondertekend door de minister aan wie ter zake regelgevende bevoegdheid is gedelegeerd of de
      staatssecretaris die op het betreffende terrein als verantwoordelijk bewindspersoon fungeert. Dit betekent ook dat
      een regeling die is gebaseerd op de regelgevende bevoegdheid van twee of meer ministers, door elk van die ministers
      dan wel de fungerende staatssecretaris(sen) moet worden ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0001838
