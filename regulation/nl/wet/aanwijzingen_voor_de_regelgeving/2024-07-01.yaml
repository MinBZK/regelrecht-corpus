  - number: '5.35'
    text: |-
      1 De werkzaamheden die door of namens een bestuursorgaan worden verricht om na te gaan of voorschriften worden
      nageleefd, worden aangeduid als ‘*toezicht op de naleving*’ van die voorschriften.

      2 De werkzaamheden ter vaststelling in concrete gevallen of een strafbaar feit is gepleegd op basis van een
      redelijk vermoeden dat dit het geval is, worden aangeduid als ‘*opsporing*’ van die feiten.


          **Toelichting**
          Het is van belang nalevingstoezicht in de zin van [titel 5.2 Awb][ref1] te onderscheiden van opsporing.
      Weliswaar hebben toezichthouders soms ook opsporingsbevoegdheid, maar met het oog zowel op de rechten van
      de belanghebbende, respectievelijk verdachte, als op de verhouding tot het openbaar ministerie moet zoveel
      mogelijk duidelijk zijn wanneer sprake is van nalevingstoezicht en wanneer van opsporing. Zie over de
      verhouding tussen nalevingstoezicht en opsporing de parlementaire stukken inzake de derde tranche van de
      [Algemene wet bestuursrecht][ref2] (met name Kamerstukken II 1994/95, 23700, nr. 5, p. 47–50, en Kamerstukken I
      1995/96, 23700, nr. 185b).
          In de gevallen waarin hetzij nalevingstoezicht, hetzij opsporing wordt bedoeld, worden voor deze activiteiten
      termen als ‘controle’, ‘inspectie’ of ‘handhaving’ vermeden. Deze termen geven onvoldoende weer of het gaat om
      toezicht of om opsporing. Wel kan in toelichtende stukken de term ‘handhaving’ worden gehanteerd voor het geheel
      van handhavingsmechanismen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
