  - number: '5.41'
    text: |-
      1 Indien intrekking of schorsing van een beschikking bij wijze van sanctie mogelijk moet zijn, wordt de bevoegdheid
      daartoe uitdrukkelijk geregeld.

      2 De gronden die kunnen of moeten leiden tot het intrekken of schorsen van een beschikking bij wijze van sanctie,
      worden in de regeling gespecificeerd.


          **Toelichting**
          Onder omstandigheden kan het ook aangewezen zijn wijziging van een beschikking bij wijze van sanctie mogelijk
      te maken. Zie bijvoorbeeld [artikel 10 van de Wet toezicht accountantsorganisaties][ref1].
          Zie ook [aanwijzing 5.21, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019468#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
