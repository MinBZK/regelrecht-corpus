  - number: '9.19'
    text: |-
      1 Bij de voorbereiding en vaststelling van implementatieregelingen beziet het eerstverantwoordelijke
      ministerie steeds of Europese verplichtingen ertoe noodzaken de Europese Commissie van het ontwerp van de
      implementatieregeling dan wel van de vastgestelde implementatieregeling in kennis te stellen.

      2 De notificatie van regelingen ter implementatie van EU-richtlijnen geschiedt elektronisch via het daartoe
      bestemde notificatiesysteem van de Europese Commissie.

      3 De notificatie van regelingen ter implementatie van andere soorten bindende EU-rechtshandelingen geschiedt
      schriftelijk aan het Ministerie van Buitenlandse Zaken, dat de gegevens doorzendt aan de Europese Commissie en in
      voorkomende gevallen tevens aan de Raad van de Europese Unie.

      4 Door middel van de notificatie wordt de Europese Commissie in kennis gesteld van:

      a. de daartoe voorgenomen of vastgestelde implementatieregelingen en de bijbehorende transponeringstabel(len);

      b. de bestaande nationale regelingen die reeds aan de te implementeren bindende EU-rechtshandeling voldoen;

      c. de datum met ingang waarvan de regelingen ter omzetting van de te implementeren bindende EU-rechtshandeling in
      de Nederlandse rechtsorde van toepassing zijn, of met ingang waarvan de effectieve werking ervan verzekerd is.


          **Toelichting**
          **Eerste en tweede lid.**EU-richtlijnen bevatten altijd een verplichting om de Europese Commissie in kennis
      te stellen van de daartoe vastgestelde implementatieregelingen, bij andere soorten bindende EU-rechtshandelingen
      is dit ook steeds vaker het geval. Een daartoe strekkende bepaling is doorgaans aan het slot van de bindende EU-
      rechtshandeling opgenomen.
          Men moet erop bedacht zijn dat soms ook al eerder een ontwerp ter informatie aan de Europese Commissie moet
      worden gezonden dan wel ter goedkeuring aan de Commissie moet worden voorgelegd.
          **Derde lid.**Het elektronische voortgangssysteem van de Europese Commissie biedt (vooralsnog) alleen de
      mogelijkheid tot het melden van implementatie van richtlijnen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.19
