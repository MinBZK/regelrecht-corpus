  - number: '5.52'
    text: |-
      Voor het wijzigen van een bijlage bij de [Algemene wet bestuursrecht][ref1] worden de volgende voorbeelden als
      uitgangspunt gebruikt:

      A. *In bijlage 1 bij de Algemene wet bestuursrecht wordt in de alfabetische volgorde ingevoegd:*

      *Wet tijdelijk huisverbod*

      B. *In artikel 1 van bijlage 2 bij de Algemene wet bestuursrecht komt de zinsnede met betrekking tot de
      Telecommunicatiewet te luiden:*

      *Telecommunicatiewet: de artikelen 3.5, 3.22 en 18.9, eerste en tweede lid*

      C. *In artikel 4 van bijlage 2 bij de Algemene wet bestuursrecht wordt in de alfabetische volgorde ingevoegd:*

      *Zeewet, met uitzondering van:*

      a. *artikel 5, voor zover het betreft een aanwijzing*

      b. *artikel 6, voor zover het betreft:*

      1°. *een besluit tot weigering, wijziging of intrekking van de ontheffing*

      2°. *een besluit tot verlening van de vergunning voor zover daaraan voorschriften zijn verbonden*

      D. *In de artikelen 4 en 11 van bijlage 2 bij de Algemene wet bestuursrecht vervalt de zinsnede met betrekking tot
      de Gezondheids- en welzijnswet voor dieren.*

      E. *In de artikelen 7 en 11 van bijlage 2 bij de Algemene wet bestuursrecht vervalt ‘Tabakswet’ en wordt in de
      alfabetische volgorde ingevoegd:*

      *Tabaks- en rookwarenwet*

      F. *In artikel 9 van bijlage 2 en artikel 2 van bijlage 3 bij de Algemene wet bestuursrecht vervalt de zinsnede met
      betrekking tot de Wet werk en bijstand en wordt in de alfabetische volgorde ingevoegd:*

      *Participatiewet: de artikelen ...*


          **Toelichting**
          In de meeste gevallen kan worden volstaan met het noemen van de bijzondere regeling of het betrokken onderdeel,
      zonder verdere aanduiding van de betrokken besluiten. Zie telkens de eerste zin van de bijlage of de artikelen
      daarvan, bijvoorbeeld de eerste zin van bijlage 1: ‘Tegen een besluit, genomen op grond van een in deze regeling
      genoemd voorschrift dan wel anderszins in deze regeling omschreven, kan geen bezwaar worden gemaakt.’
          Bij de verdere aanduiding van de betrokken besluiten mag gebruik gemaakt worden van begrippen uit de bijzondere
      regeling, zonder dat die begrippen door middel van een verwijzing of anderszins nader omschreven hoeven te worden.
          De onderdelen van de opsommingen in de Awb-bijlagen worden omwille van consistentie binnen de [Awb][ref2] niet
      afgesloten met een leesteken (vgl. [aanwijzing 3.59][ref3]).


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
