  - number: '2.42'
    text: |-
      1 In de toelichting bij een experimenteerregeling wordt aangegeven hoe evaluatie van de regeling plaatsvindt.

      2 Indien een experimenteerregeling een evaluatiebepaling bevat wordt het volgende model als uitgangspunt genomen:

      *Onze Minister [van/voor ...] zendt [in overeenstemming met Onze Minister van/voor ...] negen maanden voor het
      einde van de werkingsduur van [een algemene maatregel van bestuur als bedoeld in artikel .../ dit besluit] aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van het experiment in de praktijk, alsmede een
      standpunt inzake de voortzetting van [die maatregel / dit besluit] anders dan als experiment.*


          **Toelichting**
          **Eerste lid.** Indien na afloop van een experiment wordt besloten het experiment om te zetten in
      algemeen geldende wetgeving, moet worden overwogen of moet worden voorzien in tijdelijke verlenging van het
      experiment. Het kan uit het oogpunt van rechtszekerheid ongewenst en ook minder efficiënt zijn om voor de
      terreinen waarop het experiment betrekking heeft gedurende korte tijd weer het oude regime te laten gelden. De
      experimenteerregeling moet dan blijven gelden tot het tijdstip waarop de aanpassing van de wet in werking treedt.
      Een experimenteerregeling kan overigens slechts worden verlengd totdat een wetswijziging is ingevoerd, indien de
      grondslag voor die regeling de bevoegdheid biedt voor een zodanige verlenging.
          Zie met betrekking tot experimenteerregelingen nog het rapport ‘Het proberen waard’ (2000), eindrapport van het
      Interdepartementaal wetgevingsberaad inzake experimenteerbepalingen, aangeboden aan de Tweede Kamer bij brief van
      de Minister van Justitie van 4 augustus 2000. Het rapport is te raadplegen op [www.kcbr.nl](http://www.kcbr.nl/).
          **Tweede lid.** De beperkte werkingsduur van experimenteerregelingen brengt met zich dat op enig moment het
      experiment afloopt en besloten dient te worden over het vervolg. Om vast te stellen in hoeverre het experiment
      geslaagd genoemd kan worden, dienen enkele minimale procedurele waarborgen te bestaan. Een voor de hand liggende
      waarborg is dat de rechtstreeks bij het experiment betrokken burgers, maar onder omstandigheden bijvoorbeeld
      ook uitvoeringsorganisaties, tijdig voor het aflopen van het experiment hun zienswijze naar voren kunnen brengen
      over de wenselijkheid van omzetting van het experiment in een definitieve regeling. Een verplichting om in alle
      gevallen een expliciete evaluatiebepaling op te nemen, is echter onnodig. Wel dient in de toelichting bij een
      experimenteerbepaling te worden aangegeven hoe evaluatie zal plaatsvinden. Hierbij kan worden overwogen om een
      onafhankelijke commissie of instantie aan te wijzen voor het uitvoeren van een evaluatieonderzoek. Indien het
      wenselijk is expliciet te bepalen dat experimenteerregelingen worden geëvalueerd, wordt het in het tweede lid
      opgenomen model als uitgangspunt genomen. De daarin opgenomen termijn van negen maanden is wenselijk om voldoende
      tijd te hebben om het overleg met het parlement te voeren en eventueel een verlenging van de experimenteerregeling
      te realiseren. Het alternatief ‘dit besluit’ in het model is aangewezen voor die gevallen waarin voor een
      experimenteerregeling expliciete evaluatie noodzakelijk wordt geacht, terwijl de experimenteergrondslag daartoe
      niet verplicht. In dat geval wordt de bepaling dus opgenomen in de algemene maatregel van bestuur, dus de
      experimenteerregeling zelf.
          Indien voor de evaluatie de medewerking van anderen dan een onder de met de evaluatie belaste minister
      ressorterend orgaan nodig is, moet worden voorzien in een wettelijke verplichting tot gegevensverstrekking. Voor
      zelfstandige bestuursorganen is in artikel 20 van de Kaderwet zelfstandige bestuursorganen al een algemene basis
      voor gegevensverstrekking opgenomen die mede ten dienste van evaluaties kan worden ingezet.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.42
  - number: '2.43'
    text: |-
      In een wettelijk voorschrift op grond waarvan een beleidsregel wordt vastgesteld en in het opschrift en de
      citeertitel van de beleidsregel, wordt het woord ‘beleidsregel’ uitdrukkelijk gebruikt.


          **Toelichting**
          In de bestaande wetgevingstraditie wordt met het toekennen van een regelgevende bevoegdheid in het algemeen de
      bevoegdheid tot het stellen van algemeen verbindende voorschriften bedoeld, tenzij duidelijk blijkt van een andere
      bedoeling van de wetgever. Die andere bedoeling wordt tot uitdrukking gebracht door in de wettekst uitdrukkelijk
      het woord beleidsregel te gebruiken. Voorbeeld: *[aanduiding bestuursorgaan] kan beleidsregels vaststellen over
      (...)*.
          Ook indien de bevoegdheid tot het stellen van beleidsregels niet uit een wettelijk voorschrift voortvloeit
      (zie [artikel 4:81, eerste lid, Awb][ref1]) dient in de beleidsregel duidelijk te blijken dat sprake is een
      beleidsregel. Dit geschiedt onder meer door gebruik van deze term in het opschrift en de citeertitel van de
      regeling. Zie de [aanwijzingen 3.37][ref2], [4.2][ref3] en [4.25][ref4].
          **Voorbeeld**
          [Beleidsregel aanvragen kansspelvergunningen][ref5].


