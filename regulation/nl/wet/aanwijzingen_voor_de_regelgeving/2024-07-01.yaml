  - number: '2.36'
    text: |-
      1 Gecontroleerde delegatie wordt slechts toegepast ingeval een materie regeling bij wet rechtvaardigt maar zich
      daarvoor toch niet goed leent vanwege haar sterk technische karakter, de noodzaak van snelle wijzigingen of de
      grote omvang van de te stellen regels.

      2 Voor gecontroleerde delegatie wordt het volgende model gebruikt:

      *De voordracht voor een krachtens artikel [...] vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.*


          **Toelichting**
          **Eerste lid.**Gecontroleerde delegatie houdt in dat voorschriften bij lagere regeling kunnen worden
      vastgesteld maar dat een ontwerp daarvan ter kennis van het parlement wordt gebracht. Het parlement moet dan
      enige tijd in de gelegenheid worden gesteld opmerkingen over het ontwerp te maken en daarover met de betrokken
      bewindspersoon van gedachten te wisselen.
          Het ontwerp moet voorafgaand aan overlegging aan de beide Kamers van de Staten-Generaal
      in de ministerraad zijn behandeld, tenzij er bijzondere redenen zijn hiervan af te wijken en
      hierover overeenstemming is bereikt met het Ministerie van Algemene Zaken. Zie in dit verband
      [artikel 4, tweede lid, aanhef en onder d, van het reglement van orde voor de ministerraad][ref1]. Bij behandeling
      in de ministerraad geldt dat de eerstverantwoordelijke minister tevens wordt gemachtigd tot het doen van de
      voordracht aan de Koning met het oog op toezending van het ontwerp om advies aan de Afdeling advisering van de Raad
      van State na afloop van de voorhangprocedure, mits geen ingrijpende wijzigingen worden aangebracht.
          Zie voor een nadere toelichting op de termijnen en de mogelijkheden hiervan af te wijken, onder andere tijdens
      een recesperiode en voor subsidieregelingen, [aanwijzing 2.38][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006501#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
