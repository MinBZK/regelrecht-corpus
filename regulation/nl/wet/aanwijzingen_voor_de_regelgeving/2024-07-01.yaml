  - number: '4.30'
    text: |-
      Indien het wenselijk is aan een regeling een inhoudsopgave toe te voegen, wordt deze bij de bekendmaking van de
      regeling achter de regeling opgenomen.
          **Toelichting**
          De inhoudsopgave is geen onderdeel van de regeling en wordt daarom achter de regeling (d.w.z. na de
      ondertekening van de regeling) opgenomen. Bij de indiening van een wetsvoorstel kan een inhoudsopgave afzonderlijk
      bij de stukken worden gevoegd. Bij andere regelingen kan dit bij de publicatie van de regeling in het Staatsblad of
      de Staatscourant.
          Bij de publicatie van de integrale tekst van een gewijzigde regeling wordt tevens een herziene inhoudsopgave
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.30
  - number: 4.31.1
    text: |-
      Voor het slotformulier van een (rijks)wet wordt het volgende model gebruikt: *Lasten en bevelen dat deze in het
      Staatsblad [, in het Afkondigingsblad van Aruba, in het Publicatieblad van Curaçao en in het Afkondigingsblad van
      Sint Maarten] zal worden geplaatst en dat alle ministeries, autoriteiten, colleges en ambtenaren die zulks aangaat,
      aan de nauwkeurige uitvoering de hand zullen houden.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.31
  - number: 4.31.2
    text: |-
      Voor het slotformulier van een algemene maatregel van (rijks)bestuur wordt het volgende model gebruikt: *Lasten en
      bevelen dat dit besluit met de daarbij behorende nota van toelichting in het Staatsblad [, in het Afkondigingsblad
      van Aruba, in het Publicatieblad van Curaçao en in het Afkondigingsblad van Sint Maarten] zal worden geplaatst.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.31
  - number: 4.31.3
    text: |-
      Voor het slotformulier van een koninklijk (rijks)besluit van regelende aard, niet zijnde een algemene maatregel
      van bestuur, en van een koninklijk (rijks)besluit betreffende de inwerkingtreding van een (rijks)wet of een
      algemene maatregel van (rijks)bestuur wordt het volgende model gebruikt: *Onze Minister van/voor ... is belast
      met de uitvoering van dit besluit dat [met de daarbij behorende nota van toelichting] in het Staatsblad [, in het
      Afkondigingsblad van Aruba, in het Publicatieblad van Curaçao en in het Afkondigingsblad van Sint Maarten] zal
      worden geplaatst.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.31
  - number: 4.31.4
    text: |-
      Voor het slotformulier van een ministeriële regeling wordt het volgende model gebruikt: *Deze regeling zal met de
      toelichting in de Staatscourant [, in het Afkondigingsblad van Aruba, in het Publicatieblad van Curaçao en in het
      Afkondigingsblad van Sint Maarten] worden geplaatst.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.31
  - number: 4.31.5
    text: |-
      Voor het slotformulier van een beleidsregel wordt het volgende model gebruikt: *Deze beleidsregel zal [met de
      toelichting] in de Staatscourant worden geplaatst.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.31
  - number: '4.32'
    text: |-
      Indien een bij een regeling behorende bijlage wordt bekendgemaakt door middel van een ander algemeen toegankelijk
      elektronisch medium dan het Staatsblad of de Staatscourant, wordt in de modellen voor het slotformulier, genoemd in
      [aanwijzing 4.31][ref1], na ‘geplaatst’ telkens ingevoegd: *, met uitzondering van [de] bijlage[n] ..., die [zal /
      zullen] worden geplaatst op het in artikel ... vermelde internetadres.*
          **Toelichting**
          Deze aanwijzing ziet op het slotformulier bij gebruikmaking van de uitzonderingsmogelijkheid die wordt geboden
      door [artikel 7, tweede lid, van de Bekendmakingswet][ref2]: bekendmaking door middel van een ander algemeen
      toegankelijk elektronisch medium dan het Staatsblad of de Staatscourant. Hierbij kan worden gedacht aan de
      website van (een dienstonderdeel van) de rijksoverheid. Zie [aanwijzing 5.76][ref3]. In dat geval wordt in het
      slotformulier verwezen naar de bepaling in de regeling waar het afwijkende bekendmakingsadres is gegeven.
          **Beschikbaar blijven.** Het is ook voor met toepassing van [artikel 7 van de Bekendmakingswet][ref4]
      bekendgemaakte bijlagen van belang dat deze elektronisch beschikbaar blijven op de bij de bekendmaking aangegeven
      wijze. Indien de elektronische beschikbaarheid op de bij de bekendmaking aangegeven wijze niet langer is verzekerd,
      voorziet het desbetreffende bestuursorgaan daarom in een vervangende wijze (bijvoorbeeld een ander webadres)
      die door middel van een wijziging van het in de regeling aangegeven internetadres wordt bekendgemaakt. Zie
      [artikel 4.1 van het Besluit elektronische publicaties][ref5]. Zie ook [aanwijzing 4.41][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0004287#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0045037#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.32
