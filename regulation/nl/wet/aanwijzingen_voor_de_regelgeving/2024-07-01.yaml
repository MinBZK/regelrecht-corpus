  - number: '4.46'
    text: |-
      1 Indien een wetsvoorstel leidt tot financiële gevolgen voor decentrale overheden, wordt dit aangegeven in
      een afzonderlijk onderdeel van de memorie van toelichting. Daarbij wordt onder meer ingegaan op de uitvoering
      van [artikel 105, derde lid, van de Provinciewet][ref1], [artikel 108, derde lid, van de Gemeentewet][ref2]
      of [artikel 136, derde lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref3],
      respectievelijk [artikel 2 van de Financiële-verhoudingswet][ref4] of
      [artikel 87 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref5].

      2 Tevens wordt aangegeven via welke bekostigingswijze de in het eerste lid bedoelde financiële gevolgen kunnen
      worden opgevangen.

      3 Indien een algemene maatregel van bestuur of een ministeriële regeling leidt tot financiële gevolgen voor
      decentrale overheden, wordt daaraan zo nodig in de (nota van) toelichting aandacht geschonken.


          **Toelichting**
          Ingevolge de genoemde artikelen van de [Provinciewet][ref6], de [Gemeentewet][ref7] en de
      [Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref8] vergoedt het Rijk de kosten van medebewindstaken
      voor zover deze ten laste blijven van provincie, respectievelijk gemeente en de openbare lichamen Bonaire, Sint
      Eustatius en Saba. [Artikel 2 van de Financiële-verhoudingswet][ref9] verplicht om bij een voorstel dat leidt
      tot een wijziging in de uitoefening van taken door provincies en gemeenten gekwantificeerd inzicht te geven in
      de financiële gevolgen en in de wijze waarop deze kunnen worden opgevangen. Over de dekking van de financiële
      gevolgen voor decentrale overheden van nieuwe of gewijzigde taken dient overeenkomstig de [artikelen 2][ref10] en
      [18 van de Financiële-verhoudingswet][ref11] tijdig overleg gevoerd te worden met de Ministeries van Binnenlandse
      Zaken en Koninkrijksrelaties en van Financiën. Zie voor de openbare lichamen Bonaire, Sint Eustatius en Saba
      __REF006___________________________________________________________________________________________________________
      _____.
          Zie over het beoordelen van de gevolgen van een regeling voor decentrale overheden ook [aanwijzing 7.6][ref13].
          **Derde lid.** Zie de toelichting bij het [zesde lid van aanwijzing 4.45][ref14].


