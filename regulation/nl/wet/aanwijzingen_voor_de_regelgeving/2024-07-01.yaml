    text: |-
      1 In een regeling wordt een hardheidsclausule opgenomen, indien er aanleiding is om te verwachten dat, gelet op het
      doel en de strekking van de regeling, de toepassing van de regeling kan leiden tot onbillijkheden van overwegende
      aard in niet precies te voorziene gevallen of groepen van gevallen.

      2 Alvorens een hardheidsclausule op te nemen, wordt bezien of toepassing kan worden gegeven aan
      [aanwijzing 2.11, tweede lid][ref1].

      3 In een regeling wordt geen hardheidsclausule opgenomen voor situaties waarin het buiten toepassing laten of het
      afwijken van de regeling nadelige effecten heeft of in het algemeen kan hebben voor derden-belanghebbenden.

      4 Indien de toepassing van een hardheidsclausule voor bepaalde gevallen voldoende is uitgekristalliseerd en
      daardoor een bestendig karakter heeft gekregen, wordt dit bestendige beleid in een algemeen verbindend voorschrift
      neergelegd.


          **Toelichting**
          Deze aanwijzing ziet op hardheidsclausules in de klassieke zin van het woord, dat wil zeggen: bepalingen van
      algemene aard die voorzien in de mogelijkheid voor het bestuursorgaan om af te wijken van een dwingendrechtelijk
      voorgeschreven resultaat, op grond van het criterium dat dat resultaat, gelet op het belang van doel of strekking
      van de regeling, zou leiden tot een onbillijkheid van overwegende aard.
          Van een hardheidsclausule wordt alleen gebruik gemaakt wanneer de ruimte voor maatwerk niet op een andere wijze
      in de regeling kan worden geboden. Bepalingen waarin discretionaire bevoegdheden worden toegekend waaraan concrete
      en specifieke voorwaarden zijn verbonden, vallen buiten de reikwijdte van deze aanwijzing.
          Een hardheidsclausule onderscheidt zich van ontheffings- en vrijstellingsbepalingen, doordat vooraf niet
      (precies) te voorzien is of afwijking nodig zal zijn en zo ja, om welke gevallen of groepen gevallen het bij de
      toepassing zal gaan. Voorts beperkt de toepassing van een hardheidsclausule zich tot (eventuele) onbillijkheden
      van overwegende aard. Bij ontheffingen is het juist van meet af aan de uitdrukkelijke bedoeling om in bepaalde,
      individuele, voorzienbare gevallen een uitzondering te maken op de wettelijke regel. Alleen wanneer een
      ontheffings- of vrijstellingssysteem zeer gebonden bevoegdheden bevat, kan voor het daarnaast opnemen van een
      hardheidsclausule nog ruimte zijn.
          **Eerste lid.** Aan het opnemen van hardheidsclausules in de wetgeving kleven praktische bezwaren. Niet zelden
      blijken dergelijke clausules conflictopwekkend te zijn. In de praktijk kan het opnemen van een hardheidsclausule
      leiden tot grote aantallen aanvragen om toepassing van de hardheidsclausule, terwijl inwilliging daarvan slechts
      in zeer beperkte mate aangewezen is. Daarbij dient te worden bedacht dat tegen de afwijzing van de aanvraag om
      toepassing van een hardheidsclausule beroep openstaat bij de bestuursrechter. Mede gelet op [aanwijzing 2.8][ref2]
      leiden deze factoren tot de noodzaak terughoudendheid te betrachten met het opnemen van hardheidsclausules. Indien
      een hardheidsclausule wordt opgenomen, dient hiervoor in de toelichting een toereikende motivering opgenomen te
      worden. Daarbij dienen de volgende cumulatieve voorwaarden als oriëntatiepunten:
          *te verwachten is dat bij de toepassing van de regeling sprake zal zijn van niet door de wetgever voorziene
      situaties*: dit kan in het bijzonder aan de orde zijn bij introductie van wezenlijk nieuwe of afwijkende
      normenstelsels die rechtsgevolgen hebben voor een groot aantal burgers of bedrijven;
      *denkbaar is dat toepassing van de norm leidt tot gevolgen die, gezien de doelstelling en strekking ervan,
      als onaanvaardbare onbillijkheden zullen moeten worden aangemerkt:* hierdoor wordt verzekerd dat benutting van
      een hardheidsclausule niet aan de orde kan zijn bij rechtsgevolgen die in redelijkheid niet als onaanvaardbaar
      onbillijk kunnen worden aangemerkt, in het bijzonder niet wanneer de wetgever bewust deze rechtsgevolgen heeft
      beoogd;
      *deze rechtsgevolgen kunnen niet of onvoldoende worden voorkomen door de norm open te formuleren of door
      discretionaire bevoegdheden toe te kennen:* dit verplicht er toe om bij de formulering van de regelgeving
      indien mogelijk en gewenst het uitvoerende bestuursorgaan discretionaire ruimte te bieden in plaats van gebonden
      beschikkingen voor te schrijven (zie [aanwijzing 2.11, tweede lid][ref3]);
      *de opschorting van de wettelijke norm dient geen (onaanvaardbaar) nadelige gevolgen te hebben voor derden*:
      hierdoor wordt verzekerd dat de rechtszekerheid van derden niet te lijden heeft onder toepassing van een
      hardheidsclausule. Zie hiervoor ook de toelichting op het derde lid.
          Het primaat van de wetgever brengt met zich dat een hardheidsclausule in beginsel in de wet zelf wordt
      opgenomen; zie ook [aanwijzing 2.19][ref4]. Onder omstandigheden is ook denkbaar dat een hardheidsclausule in
      een algemene maatregel van bestuur of ministeriële regeling wordt opgenomen, voor zover dit valt te rijmen met de
      ruimte die de formele wetgever heeft willen bieden aan de gedelegeerde regelgever of de uitvoerder daarvan. In het
      algemeen zal de toepassing van een hardheidsclausule beperkt blijven tot individuele gevallen. Onder omstandigheden
      kan een hardheidsclausule evenwel ook op een concreet te traceren groep van gevallen worden toegepast. Dan zal er
      overigens al gauw sprake zijn van bestendig beleid dat uiteindelijk in een algemeen verbindend voorschrift moet
      worden neergelegd (zie het vierde lid).
          **Tweede lid.** Een hardheidsclausule in de bovenbedoelde zin geeft ruimte voor een inbreuk op het primaat van
      de wetgever, doordat het bestuursorgaan een besluit kan nemen met een niet vooraf door de wetgever voorziene (of
      zelfs: gewenste) inhoud. Dit mogelijke principiële bezwaar brengt mee dat eerst wordt onderzocht of toepassing kan
      worden gegeven aan [aanwijzing 2.11, tweede lid][ref5], waarmee de wetgever de ruimte en de criteria bepaalt om de
      met de wet beoogde beleidsdoelen te realiseren.
          **Derde lid.** Het is niet altijd te vermijden dat derden enig nadeel ondervinden van de toepassing van een
      hardheidsclausule (denk aan de situatie dat een vergunning wordt verleend hoewel niet aan alle daarvoor gestelde
      voorwaarden is voldaan terwijl concurrenten daar wel aan hebben voldaan). Vermeden moet echter worden dat het in
      bijzondere omstandigheden buiten toepassing laten of afwijken van een regeling onaanvaardbaar nadelige effecten
      heeft of in het algemeen kan hebben voor derden-belanghebbenden wier belang door de desbetreffende algemeen
      verbindende voorschriften wordt beschermd. De behoefte aan een hardheidsclausule doet zich in de praktijk soms
      gevoelen bij de toepassing van (meer) gebonden bestuursbevoegdheden. Dit geeft een verdere beperking van het
      gebruik van hardheidsclausules. In de praktijk betekent dit dat hardheidsclausules in bijzondere omstandigheden
      wel worden opgenomen in regelingen op het terrein van de belastingen, de sociale zekerheid, de rechtspositie en in
      bepaalde subsidieregelingen.
          **Vierde lid.** Voor de realisering van het primaat van de wetgever en uit het oogpunt van duidelijkheid
      en rechtszekerheid verdient het de voorkeur om bestendig beleid dat in eerste instantie zal zijn neergelegd
      in een beleidsregel, uiteindelijk in wetgeving neer te leggen. Het is daarom van belang om de toepassing van
      hardheidsclausules periodiek te evalueren.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
