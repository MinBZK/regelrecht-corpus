  - number: '8.7'
    text: |-
      1 Bij de voorbereiding van besluiten van volkenrechtelijke organisaties wordt aandacht besteed aan de gevolgen voor
      de nationale wetgeving.

      2 Wanneer een het Koninkrijk bindend besluit van een volkenrechtelijke organisatie tot stand is gekomen dat
      voor zijn uitvoering wettelijke voorschriften vereist, worden deze zo spoedig mogelijk en binnen de eventueel
      voorgeschreven termijn tot stand gebracht.

      3 Indien het besluit bepalingen bevat die een ieder kunnen verbinden en niet verenigbaar zijn met geldende
      wettelijke voorschriften, worden onverwijld maatregelen getroffen tot aanpassing van de desbetreffende wettelijke
      voorschriften.


          **Toelichting**
          Zie de toelichting bij de [aanwijzingen 8.4][ref1], [8.6][ref2] en [8.9][ref3].


