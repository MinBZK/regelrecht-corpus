  - number: '2.3'
    text: |-
      Alvorens tot het tot stand brengen van een regeling wordt besloten, worden de volgende stappen gezet:

      a. kennis wordt vergaard over de relevante feiten en omstandigheden met betrekking tot het bewuste onderwerp;

      b. de doelen die moeten worden bereikt, worden zo concreet en nauwkeurig mogelijk vastgesteld;

      c. onderzocht wordt of de doelen kunnen worden bereikt door middel van het zelfregulerend vermogen in de betrokken
      sector of sectoren, of dat daarvoor overheidsinterventie noodzakelijk is;

      d. indien overheidsinterventie noodzakelijk is, wordt onderzocht of de gekozen doelen kunnen worden bereikt door
      aanpassing of beter gebruik van bestaande instrumenten dan wel, indien dit niet mogelijk blijkt, welke nieuwe
      instrumenten kunnen worden ingezet om de doelen te bereiken;

      e. de diverse mogelijkheden worden zorgvuldig tegen elkaar afgewogen.


          **Toelichting**
          Deze aanwijzing brengt tot uitdrukking dat keuzes voor regelgeving als sturingsinstrument, maar ook de keuzes
      die vervolgens met betrekking tot de inhoud en vormgeving van die regelgeving worden gemaakt, gebaseerd dienen te
      zijn op kennis van alle relevante factoren en op een gedegen analyse daarvan. Over deze keuzes wordt verantwoording
      afgelegd in de toelichting bij de regeling, zodat andere actoren in het proces (bijvoorbeeld adviesinstanties, het
      parlement en het publiek) in staat zijn zich een oordeel te vormen over het (voorgestelde) product. Verder heeft
      de toelichting op de gemaakte keuzes ook voor de rechtspraktijk een functie doordat deze toelichting behulpzaam kan
      zijn bij de interpretatie van de regeling (zie voor de eisen aan de toelichting ook [paragraaf 4.9][ref1]).
          Het Beleidskompas (te raadplegen op [www.beleidskompas.nl](http://www.beleidskompas.nl)) heeft tot doel het
      afwegings- en verantwoordingsproces bij het formuleren van beleid en regelgeving te ondersteunen. Het kabinet
      heeft in 2022 beslist dat het Beleidskompas toegepast dient te worden bij de voorbereiding en verantwoording van
      beleid en regelgeving (Kamerstukken II 2022/23, 36200-VI, nr. 10). Dat gold ook reeds voor de voorganger van het
      Beleidskompas, het Integraal afwegingskader voor beleid en regelgeving.
          Zie met betrekking tot de toelichting bij de regeling ook [aanwijzing 4.43][ref2].
          **Onderdeel a: kennis feiten en omstandigheden.** Kennis van de relevante feiten en omstandigheden is
      noodzakelijk om tot een verantwoorde besluitvorming te kunnen komen. Allereerst moet de betrokken kennis worden
      gebruikt voor het formuleren van de doelen. Vervolgens is zij nodig voor de beantwoording van de vraag in hoeverre
      overheidsinterventie nodig is en voor de afweging van de verschillende mogelijkheden tot overheidsinterventie.
      Gewoonlijk vindt het verzamelen van de gegevens overigens gefaseerd plaats. Voor elke nieuwe stap in het
      besluitvormingsproces zijn veelal weer nieuwe (meer gedetailleerde) gegevens nodig.
          **Onderdeel b: nauwkeurige doelstelling.** Een zo concreet en nauwkeurig mogelijke vaststelling van doelen
      houdt in dat verschillende doelen duidelijk worden onderscheiden. Waar dat mogelijk en relevant is, dient ook
      te worden vastgesteld binnen welke termijn een doel bereikt moet zijn. Indien kwantificering, financieel of
      anderszins, van een doel mogelijk is, dient deze ook te geschieden.
          **Onderdeel c: noodzaak overheidsinterventie.** Slechts voor zover het zelfregulerend vermogen van de
      maatschappij tekortschiet, moet worden gedacht aan overheidsmaatregelen. Zie [aanwijzing 2.5][ref3].
          **Onderdeel d: alternatieven overheidsinterventie.** Bij het onderzoek naar de mogelijkheden die de overheid
      ten dienste staan om een doel te bereiken, dienen de verschillende denkbare alternatieven de revue te passeren.
      Het gaat daarbij evenzeer om instrumenten die door middel van wetgeving worden gecreëerd (zoals geboden en
      verboden, een vergunningenstelsel en een heffingenstelsel) als om andere middelen (zoals feitelijk optreden van de
      overheid en subsidies). Overigens brengt het uitgangspunt van de rechtsstaat mee dat ten aanzien van deze andere
      middelen veelal ook wettelijke voorzieningen moeten worden getroffen, bijvoorbeeld in verband met het bieden van
      rechtswaarborgen.
          Het onderzoek naar de mogelijkheden tot overheidsinterventie kan ook tot de slotsom leiden dat de overheid de
      betrokken doelen niet kan realiseren. Dan behoort van overheidsinterventie te worden afgezien.
          Wat wettelijke regelingen betreft kunnen te onderzoeken varianten zowel betrekking hebben op de opzet van een
      wettelijke regeling als zodanig als op onderdelen van een regeling (bijvoorbeeld het systeem van rechtsbescherming
      waarvoor wordt gekozen).
          Het zal van de aard van het betrokken geval afhangen of de in deze aanwijzing bedoelde onderzoeken omvangrijk
      dienen te zijn of beperkt van aard kunnen blijven. Het is echter wel noodzakelijk dat de in deze aanwijzing
      bedoelde stappen worden gezet, indien het tot stand brengen van een regeling een van de mogelijkheden tot
      overheidsinterventie is.


