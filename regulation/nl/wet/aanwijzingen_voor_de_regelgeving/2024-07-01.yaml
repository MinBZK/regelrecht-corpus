  - number: '2.40'
    text: |-
      1 Delegatie onder het vereiste van goedkeuring bij wet blijft beperkt tot gevallen waarin tijdelijke delegatie
      aanvaardbaar is en het gaat om regelingen die de Tweede Kamer in beginsel slechts kan goedkeuren of weigeren goed
      te keuren.

      2 Voor delegatie onder het vereiste van goedkeuring bij wet wordt het volgende model gebruikt:

      *Na het tot stand komen van een krachtens artikel [...] vastgestelde [algemene maatregel van bestuur / ministeriële
      regeling] wordt zo spoedig mogelijk maar uiterlijk binnen acht weken een voorstel van wet tot goedkeuring van de
      [algemene maatregel van bestuur / ministeriële regeling] bij de Tweede Kamer der Staten-Generaal ingediend. Indien
      het voorstel wordt ingetrokken of indien een van de Kamers der Staten-Generaal tot het niet-aannemen van het
      voorstel besluit, wordt de [algemene maatregel van bestuur / ministeriële regeling] onverwijld ingetrokken.*


          **Toelichting**
          **Eerste lid.**Een bezwaar van de figuur van delegatie onder goedkeuring bij wet is dat de Tweede Kamer
      aanleiding kan zien bij de behandeling van de goedkeuringswet wijzigingen aan te brengen in de goed te keuren
      regeling. Hierdoor ontstaat een onoverzichtelijke situatie. Om die reden moet deze figuur worden beperkt tot
      regelingen die zich niet lenen voor partiële aanpassing maar die de Tweede Kamer in beginsel slechts kan goedkeuren
      of weigeren goed te keuren.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.40
  - number: '2.41'
    text: |-
      1 Indien het gewenst is de mogelijkheid te bieden dat in een lagere regeling bij wijze van experiment van een
      hogere regeling wordt afgeweken, wordt in die hogere regeling bepaald:

      a. wat het oogmerk is van het experiment;

      b. wat het bereik is van de experimenteerregeling;

      c. van welke onderdelen van de hogere regeling kan worden afgeweken; en

      d. wat de maximale geldingsduur is van de afwijking.

      2 Van een wet in formele zin wordt slechts afgeweken bij algemene maatregel van bestuur, waarbij kan worden
      voorzien in subdelegatie.

      3 In de experimenteerregeling wordt vermeld van welke onderdelen van de hogere regeling wordt afgeweken.


          **Toelichting**
          **Eerste lid.** Bij een experiment gaat het om het proefondervindelijk vaststellen of een bepaald instrument
      een bijdrage levert aan het oplossen van een maatschappelijk probleem. Als regelgeving noodzakelijk is voor een
      experiment, wijkt dit dus af van het uitgangspunt van [aanwijzing 2.6][ref1], omdat niet kan worden overzien wat
      de effecten daarvan zullen zijn. Omdat het niet gewenst is een regeling met een ongewis effect direct landelijk
      uniform te laten werken, kan het aangewezen zijn om een, in tijd en bereik beperkte, van de wet afwijkende regeling
      vast te stellen. Op basis van de ervaringen met het experiment kan worden besloten over wijziging van de wet.
      Tot een experimenteerregeling moet niet te snel worden overgegaan, mede gelet op het gelijkheidsbeginsel en het
      rechtszekerheidsbeginsel. De overtuiging moet bestaan dat via de figuur van afwijkende regelgeving de noodzakelijke
      informatie kan worden vergaard.
          Zoals bij elke delegatiegrondslag dient ook in een experimenteergrondslag het onderwerp waarop een vast te
      stellen experimenteerregeling betrekking kan hebben, zo concreet en nauwkeurig mogelijk te worden begrensd. Daarbij
      is het van belang dat in de experimenteergrondslag het doel en de functie van experimenten worden aangeduid. Ook
      moet het bereik zo scherp mogelijk worden afgebakend: bijvoorbeeld territoriaal of naar bepaalde groepen personen
      of instellingen. Verder moet duidelijk worden vermeld van welke artikelen of onderdelen van de wet kan worden
      afgeweken. In de experimenteerregeling zelf moeten doel en functie vervolgens worden geconcretiseerd en moet worden
      aangegeven op welke punten van de afwijkingsbevoegdheid gebruik is gemaakt. Gelet op de aard van een experiment
      dient aan die regeling een tijdelijk karakter te worden gegeven. Zie in dat verband [paragraaf 5.16][ref2].
          Zie in dit verband ook de informatie over experimenten in onderdeel 3.1 (Beleidsinstrumenten) van het
      Beleidskompas.
          **Tweede lid.** Afwijking van een hogere regeling geschiedt in beginsel op het ‘naast-lagere niveau’.
      Afwijkingen van de formele wet vinden dus slechts bij algemene maatregel van bestuur plaats. Voor zover
      de experimenteerregeling nadere uitwerking van administratieve voorschriften en details behoeft, kan de
      delegatiegrondslag met inachtneming van [aanwijzing 2.24][ref3] voorzien in subdelegatie aan een minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
