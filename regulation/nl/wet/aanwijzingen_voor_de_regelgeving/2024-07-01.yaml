  - number: '6.12'
    text: |-
      1 Het schrappen van een artikel of ander onderdeel van een regeling of het schrappen van een woord of zinsnede
      wordt aangeduid met het werkwoord ‘*vervallen*’. Het werkwoord ‘*intrekken*’ wordt slechts gebruikt voor het
      beëindigen van de gelding van een gehele regeling.

      2 In een wijzigingsbepaling worden woorden of zinsneden die vervallen tussen aanhalingstekens geplaatst.


          **Toelichting**
          **Eerste lid.**Een uitzondering op deze aanwijzing betreft het geval waarbij de gelding van een gehele
      regeling van rechtswege eindigt. In dat geval spreekt men wel van het ‘vervallen’ van de regeling (vgl.
      [aanwijzing 5.71][ref1]).
          **Tweede lid.** Zie de toelichting bij [aanwijzing 6.9, tweede lid][ref2].

          De Wet rampenplannen wordt ingetrokken.
      Artikel 25, derde lid, vervalt.
      In artikel 2, onderdeel a, vervalt ‘het bestuursorgaan of’.
      In artikel 1 vervalt de begripsbepaling *universiteit*, onder vervanging van de puntkomma aan het slot van de
      begripsbepaling *Unienorm* door een punt.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
