  - number: '5.4'
    text: |-
      1 Indien een regeling van toepassing is of mede van toepassing is in Bonaire, Sint Eustatius en Saba, wordt dit in
      de regeling uitdrukkelijk bepaald.

      2 De bepaling die de toepasselijkheid van een regeling in Bonaire, Sint Eustatius en Saba regelt, wordt bij
      voorkeur in de inleidende bepalingen van de regeling opgenomen.

      3 Het eerste lid is niet van toepassing, indien het een regeling van het Koninkrijk betreft of indien de
      toepasselijkheid van een regeling in Bonaire, Sint Eustatius en Saba reeds onmiskenbaar uit een ander wettelijk
      voorschrift volgt.

      4 In een regeling die uitsluitend van toepassing is in het Europese deel van Nederland, behoeft geen bepaling te
      worden opgenomen die de werkingssfeer van de regeling uitdrukkelijk tot dat deel van Nederland beperkt.


          **Toelichting**
          Op grond van [artikel 2 van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] geldt een
      regeling alleen in Bonaire, Sint Eustatius en Saba, indien dat bij wettelijk voorschrift is bepaald of op andere
      wijze onmiskenbaar uit een wettelijk voorschrift volgt. Indien in een Nederlandse regeling niets is bepaald en haar
      toepasselijkheid in Bonaire, Sint Eustatius en Saba ook niet uit een ander wettelijk voorschrift volgt, geldt die
      regeling uitsluitend voor het Europese deel van Nederland. Om die reden behoeft in een regeling die uitsluitend
      voor het Europese deel van Nederland bestemd is, ook geen daartoe strekkende bepaling te worden opgenomen.
          Indien het een regeling betreft die uitsluitend in Bonaire, Sint Eustatius en Saba geldt, wordt dat tevens in
      de citeertitel tot uitdrukking gebracht: zie [aanwijzing 4.25, zesde lid][ref2].
          **Tweede lid.**Omwille van de duidelijkheid verdient het de voorkeur dat de werkingssfeer van de regeling reeds
      uit de inleidende bepalingen blijkt. In bestaande regelingen, waarvan de werkingssfeer pas na de totstandkoming van
      de regeling wordt uitgebreid tot Bonaire, Sint Eustatius en Saba, is het niet altijd mogelijk om de bepaling die de
      toepasselijkheid in Caribisch Nederland regelt, een logische plaats te geven aan het begin van de regeling. In dat
      geval kan ervoor worden gekozen om de daartoe strekkende bepaling aan het einde van de regeling, voor de overgangs-
      en slotartikelen, op te nemen. Zie ook [aanwijzing 5.5][ref3].

          Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
      ([Artikel 5a van de Algemene termijnenwet][ref4])


