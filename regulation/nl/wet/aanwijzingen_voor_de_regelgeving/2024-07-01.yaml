  - number: '6.15'
    text: |-
      1 In een wijzigingsregeling en in de slotbepalingen van een nieuwe regeling wordt voor iedere te wijzigen regeling
      een artikel gebruikt.

      2 Binnen een afzonderlijk artikel worden de verschillende wijzigingen van een regeling aangeduid met hoofdletters.

      3 In het geval, bedoeld in het tweede lid, worden de verschillende wijzigingen in een artikel van een regeling
      aangeduid met Arabische cijfers of kleine letters.


          **Toelichting**
          **Tweede lid.**Worden in een regeling meer wijzigingen aangebracht dan het alfabet letters telt, dan geschiedt
      de aanduiding van de volgorde verder met een combinatie van hoofdletters (AA, BB, CC ...; AAA, BBB, CCC ... etc.).

          **ARTIKEL I** Het **Besluit Raad voor de Kunst 1977** wordt als volgt gewijzigd: A. In artikel 3, tweede lid,
      onderdeel b, vervalt ‘of andere omstandigheden’ en wordt ‘bedoeld in artikel 16 van de wet’ vervangen door ‘bedoeld
      in artikel 17a van de wet’. B. Artikel 8 wordt als volgt gewijzigd: In het derde lid wordt ‘het model’ vervangen
      door ‘de modellen’.
      Het vijfde lid, tweede zin, vervalt.
      Het zesde lid wordt als volgt gewijzigd: In onderdeel a wordt ‘het model, bedoeld in artikel 12,’ vervangen door
      ‘de modellen, bedoeld in de artikelen 12 en 12a,’.
      Onderdeel k komt te luiden:
      (...)
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.15
  - number: '6.16'
    text: |-
      1 De nummering van bij wijziging ingevoegde artikelen, boeken, delen, hoofdstukken, titels, afdelingen en
      paragrafen geschiedt met behulp van letters, die worden toegevoegd aan de bestaande nummers.

      2 Een eenmaal aangevangen wijze van nummering wordt voortgezet.


          **Toelichting**
          De nummering van ingevoegde artikelen geschiedt dus niet met 1bis, 1ter en dergelijke, tenzij een zodanige
      nummering al is ingezet.
          Indien een artikel wordt ingevoegd vóór artikel 1, kan ervoor worden gekozen ofwel het bestaande artikel 1 te
      vernummeren tot ‘1a’ (of ‘1b’ of verder, afhankelijk van het aantal in te voegen artikelen) en een nieuw artikel 1
      in te voegen (en eventueel ‘1a’ etc.), ofwel een artikel in te voegen waarvan de aanduiding duidelijk vóór artikel
      1 komt, zoals ‘a1’ (en eventueel ‘b1’ etc.). Het voorgaande is van overeenkomstige toepassing op de nummering van
      hoofdstukken, paragrafen en dergelijke.

          Artikel 14a, 14b, 14c (...)
      Hoofdstuk 5A. Last onder dwangsom en bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.16
  - number: '6.17'
    text: |-
      1 Bij wijziging van regelingen worden artikelen, boeken, delen, hoofdstukken, titels, afdelingen en paragrafen niet
      vernummerd, tenzij dit voor een logische nummering van de regeling wenselijk is.

      2 De leden, onderdelen en subonderdelen van een artikel worden wel vernummerd of verletterd, tenzij daartegen
      overwegend bezwaar bestaat.


          **Toelichting**
          **Eerste lid.**Zie voor een situatie waarin het voor een logische nummering van de regeling wenselijk kan zijn
      te vernummeren de toelichting bij [aanwijzing 6.16][ref1].
          **Tweede lid.** Zie voor de vernummering of verlettering van artikelleden en (sub)onderdelen van een artikel
      [aanwijzing 6.18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
