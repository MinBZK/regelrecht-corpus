  - number: '5.8'
    text: |-
      In de toelichting bij een regeling waarbij een zelfstandig bestuursorgaan wordt ingesteld of een taak aan een
      zelfstandig bestuursorgaan wordt opgedragen, wordt de noodzaak daartoe gemotiveerd.


          **Toelichting**
          In [artikel 3 van de Kaderwet zelfstandige bestuursorganen][ref1] zijn de (restrictief geïnterpreteerde)
      gevallen opgenomen waarin een zelfstandig bestuursorgaan kan worden ingesteld, of nadien met een andere
      taak, inhoudende de uitoefening van openbaar gezag, kan worden belast. Het voldoen aan een of meer van de in
      [artikel 3 van de Kaderwet zelfstandige bestuursorganen][ref2] opgenomen gronden laat onverlet dat terughoudend
      met de instelling van een zelfstandig bestuursorgaan of het opdragen van taken aan een bestaand zelfstandig
      bestuursorgaan moet worden omgegaan.
          Bij het opstellen van de motivering kunnen de volgende vragen als leidraad worden gebruikt:
          waarom moet de overheid de taak behartigen of blijven behartigen?
      waarom is toekenning van de taak aan provincie- en gemeentebesturen of aan de besturen van de openbare lichamen
      Bonaire, Sint Eustatius en Saba niet aangewezen?
      waarom wordt de taak niet onder volledige ministeriële verantwoordelijkheid uitgeoefend?
      welke afweging is er gemaakt inzake de kosten, bestuurlijke lasten en doelmatigheid in vergelijking met het
      toekennen of blijven toekennen van de taak aan een minister?
      hoe is de taakuitoefening afgestemd op de taken van andere bestuursorganen op rijks-, provinciaal of gemeentelijk
      niveau of op het niveau van de openbare lichamen Bonaire, Sint Eustatius en Saba?


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.8
