  - number: '5.54'
    text: |-
      1 Administratief beroep wordt slechts opengesteld, indien:

      a. sprake is van een niet in overwegende mate gebonden besluit, en

      b. het belang van de eenheid van beleid of van sturing door een hoger bestuursorgaan op een beleidsterrein waarvoor
      dit orgaan medeverantwoordelijkheid draagt, niet afdoende door andere bestuursinstrumenten kan worden verzekerd.

      2 Tegen besluiten van bestuursorganen wordt, tenzij daarvoor een bijzondere reden bestaat, geen administratief
      beroep opengesteld bij een ander orgaan van hetzelfde openbare lichaam.


          **Toelichting**
          Uit het stelsel van de [Awb][ref1] en de [WarBES][ref2] volgt dat de bezwaarschriftprocedure regel en
      administratief beroep uitzondering is.
          **Tweede lid.** Het is bijvoorbeeld niet wenselijk tegen besluiten van het college van burgemeester en
      wethouders beroep open te stellen bij de gemeenteraad. Minder bezwaarlijk is het openstellen van beroep bij de
      minister tegen besluiten van een aan hem ondergeschikte ambtenaar aan wie bevoegdheid tot het nemen van besluiten
      is geattribueerd. Wel moet dan worden overwogen of administratief beroep niet kan worden vermeden door de
      bevoegdheid tot het nemen van besluiten aan de minister te attribueren, met mandaat aan de ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0028455
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.54
