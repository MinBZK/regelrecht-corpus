  - number: '6.10'
    text: |-
      Bij wijziging van een bepaling wordt ten minste een gehele lees- of begripseenheid vervangen door een nieuwe lees-
      of begripseenheid.


          **Toelichting**
          Dus niet: ‘Buitenlandse’ wordt vervangen door ‘Algemene’, maar: ‘Ministerie van Buitenlandse Zaken’ wordt
      vervangen door ‘Ministerie van Algemene Zaken’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.10
  - number: '6.11'
    text: |-
      1 Voor het opnemen van een nieuw artikel of ander onderdeel van een regeling of het aanvullen van de bestaande
      tekst van een artikel of ander onderdeel van een regeling wordt het werkwoord ‘*invoegen*’ of ‘*toevoegen*’
      gebruikt.

      2 In een wijzigingsbepaling worden in of toe te voegen woorden en zinsneden tussen aanhalingstekens geplaatst.


          **Toelichting**
          **Eerste lid.**Het werkwoord ‘toevoegen’ wordt gebruikt voor tekst die na bestaande tekst moet worden
      opgenomen, bijvoorbeeld aan het einde van een hoofdstuk of als het nieuwe laatste lid van een artikel. In overige
      situaties wordt het werkwoord ‘invoegen’ gebruikt.
          Bij het invoegen van tekst moet worden aangegeven waar de nieuwe tekst moet worden opgenomen. Als het gaat om
      een woord of zinsnede, worden uit de bestaande tekst een of meer woorden aangehaald waarna (of waarvoor) de nieuwe
      tekst moet worden ingevoegd: zie het eerste voorbeeld. Gaat het om het invoegen van een nieuw regelingselement, dan
      wordt volstaan met een vermelding van het bestaande regelingselement van hetzelfde niveau waarna (of waarvoor) het
      nieuwe regelingselement moet worden ingevoegd: zie het tweede en derde voorbeeld. Bij het invoegen van een nieuw
      artikel aan het begin van een hoofdstuk of paragraaf verdient het de voorkeur om ook het hoofdstuk of de paragraaf
      te noemen waarin het nieuwe artikel moet worden opgenomen en niet te volstaan met ‘voor artikel ... wordt een
      artikel ingevoegd’: zie het vierde voorbeeld. Dit om te voorkomen dat onduidelijkheid kan bestaan over de plaats
      van het nieuwe artikel.
          Bij het toevoegen van tekst kan worden volstaan met het noemen van het regelingselement waaraan de tekst
      moet worden toegevoegd. Uit het gebruik van het woord ‘toevoegen’ volgt al dat dit altijd aan het einde van de
      bestaande tekst van dat regelingselement is. Bij het toevoegen van woorden aan een bestaande zin hoeft niet te
      worden aangegeven dat die woorden voor de punt aan het slot van die zin moeten worden geplaatst (zie het laatste
      voorbeeld).
          Voor het opnemen van nieuwe regelingselementen mag zowel een formulering worden gebruikt waarbij wordt
      aangegeven hoeveel nieuwe regelingselementen worden in- of toegevoegd (‘worden ... artikelen ingevoegd,
      luidende:’), als een formulering waarin het aantal nieuwe regelingselementen onbenoemd blijft (‘worden de volgende
      artikelen ingevoegd:’). Bij opneming van een groot aantal nieuwe regelingselementen heeft de laatste formulering
      de voorkeur.
          Zie voor het in- of toevoegen van artikelleden of -onderdelen in combinatie met vernummering of verlettering
      binnen een artikel ook [aanwijzing 6.18][ref1].
          **Tweede lid.**Zie de toelichting bij [aanwijzing 6.9, tweede lid][ref2].

          Artikel 1.1 wordt als volgt gewijzigd: In de begripsomschrijving van economische machtspositie wordt na ‘hun
      concurrenten,’ ingevoegd ‘hun leveranciers,’.
      In de alfabetische volgorde worden de volgende begripsbepalingen ingevoegd: *algemene de-minimisverordening:*
      verordening (EU) nr. 1407/2013 van de Commissie van 18 december 2013 betreffende de toepassing van de artikelen 107
      en 108 van het Verdrag betreffende de werking van de Europese Unie op de-minimissteun;
      *glastuinbouwonderneming:* landbouwonderneming met glasopstanden;.
      Onder vervanging van de punt aan het slot van de laatste begripsbepaling door een puntkomma wordt een
      begripsbepaling toegevoegd, luidende: *universiteit:* onder a of b van de bijlage van de Wet op het hoger onderwijs
      en wetenschappelijk onderzoek genoemde instelling voor hoger onderwijs, alsmede een onder i van de bijlage van die
      wet genoemd academisch ziekenhuis.
      In artikel 18, eerste lid, wordt na ‘bestuurders van motorvoertuigen’ ingevoegd ‘en fietsers’.
      Na hoofdstuk 3 wordt een hoofdstuk ingevoegd, luidende: **Hoofdstuk 3a** (...)
      Na artikel 4 worden twee artikelen ingevoegd, luidende: **Artikel 4a** (...) **Artikel 4b** (...)
      In hoofdstuk 4 wordt voor artikel 15 een artikel ingevoegd, luidende: **Artikel 14a** (...)
      Aan hoofdstuk 3 wordt een paragraaf toegevoegd, luidende: *§ 5. Voorschriften voor brom- en snorfietsen* **Artikel
      23a** (...)
      Aan paragraaf 4 worden de volgende artikelen toegevoegd: **Artikel 51a** (...) **Artikel 51b** (...)
      Aan artikel 2 wordt een lid toegevoegd, luidende: Het eerste lid is van overeenkomstige toepassing op aanvragen
      tot verblijf.
      Aan artikel 2, tweede lid, derde zin, wordt toegevoegd ‘, voor zover de individuele steun meer bedraagt dan €
      500.000’.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
