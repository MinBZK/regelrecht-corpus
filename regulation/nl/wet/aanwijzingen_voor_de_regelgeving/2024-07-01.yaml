  - number: '2.37'
    text: |-
      1 Met toepassing van voorwaardelijke delegatie wordt grote terughoudendheid betracht. Zij wordt slechts toegepast
      indien in het algemeen voor de regeling van een materie kan worden volstaan met een lagere regeling, maar het
      wenselijk is de mogelijkheid open te houden dat in bepaalde gevallen voor de totstandkoming de wetsprocedure wordt
      gevolgd.

      2 Voor voorwaardelijke delegatie wordt het volgende model gebruikt:

      *Een krachtens artikel [...] vastgestelde algemene maatregel van bestuur wordt aan de beide Kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een van de Kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een van de Kamers de wens te kennen wordt gegeven dat
      [het onderwerp / de inwerkingtreding] van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval
      wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt
      ingetrokken of indien een van de Kamers der Staten-Generaal besluit het voorstel niet aan te nemen, wordt de
      algemene maatregel van bestuur ingetrokken.*


          **Toelichting**
          **Eerste lid.**Van voorwaardelijke delegatie is sprake indien een lagere regeling voor haar inwerkingtreding
      moet worden voorgelegd aan het parlement en het parlement of een gedeelte daarvan dan binnen een bepaalde termijn
      vaststelling van de betrokken regeling bij wet kan eisen.
          **Tweede lid.** Het is praktisch een algemene maatregel van bestuur in de vorm van de publicatie daarvan in het
      Staatsblad over te leggen aan de Staten-Generaal. Desgewenst kan een algemene maatregel van bestuur, spoedshalve
      ook vóórdat zij in het Staatsblad is geplaatst, in andere vorm aan de Staten-Generaal worden overgelegd. In dat
      geval is het echter wel gewenst dat de tekst gelijktijdig met de toezending aan de Staten-Generaal wordt aangeboden
      aan het Ministerie van Justitie en Veiligheid voor publicatie in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.37
  - number: '2.38'
    text: |-
      1 Voor een mededeling of overlegging aan beide Kamers van de Staten-Generaal als bedoeld in de
      [aanwijzingen 2.36][ref1] en [2.37][ref2] wordt een zodanig tijdstip gekozen dat ten minste drievierde deel van de
      in die aanwijzingen bedoelde termijn buiten een reces van de Kamers valt.

      2 Indien het eerste lid niet in acht genomen kan worden, wordt dit bij de mededeling of overlegging uitdrukkelijk
      en gemotiveerd vermeld.

      3 Indien bij een mededeling of overlegging als bedoeld in [aanwijzing 2.36][ref3] het eerste lid niet in acht
      kan worden genomen, wordt zo mogelijk een na het reces liggende datum genoemd vóór welke de Kamers hun zienswijze
      kenbaar kunnen maken.

      4 Indien een verlenging als bedoeld in het derde lid naar het oordeel van de betrokken minister niet mogelijk is,
      wordt dat uitdrukkelijk en gemotiveerd vermeld.


          **Toelichting**
          **Eerste lid.**Teneinde zeker te stellen dat de Staten-Generaal hun rechten bij gecontroleerde of
      voorwaardelijke delegatie ook daadwerkelijk kunnen uitoefenen, is het gewenst dat rekening wordt gehouden met de
      recesperioden van de Staten-Generaal.
          Bij voorhang van een subsidieregeling op basis van [artikel 4.10 van de Comptabiliteitswet 2016][ref4] moet
      rekening worden gehouden met de toelichting bij dat artikel, waarin is opgenomen dat voor het bepalen van de
      termijn van 30 dagen van de voorhangprocedure, de recesdagen in beginsel niet worden meegeteld (zie Kamerstukken II
      2015/16, 34 426, nr. 3).
          **Tweede lid.**In zeer spoedeisende gevallen is het denkbaar dat toch meer dan een kwart van de termijn binnen
      een reces valt. De betrokken minister meldt dan in de begeleidende brief aan de Kamers waarom van de drievierde-
      regel is afgeweken.
          **Derde en vierde lid.** Bij gecontroleerde delegatie ([aanwijzing 2.36][ref5]) laten de modelbepalingen toe
      dat de reactietermijn voor de Kamers wordt verlengd. Indien de betrokken minister echter problemen heeft met een
      verlenging, bijvoorbeeld omdat een internationaal orgaan vóór die termijn tot besluitvorming zal komen, dan moet
      ook dat probleem expliciet in de begeleidende brief worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
      [ref4]: https://wetten.overheid.nl/BWBR0039429#Artikel4.10
      [ref5]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk2
