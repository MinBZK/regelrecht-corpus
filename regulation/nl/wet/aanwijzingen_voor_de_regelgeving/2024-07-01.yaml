  - number: '5.1'
    text: |-
      1 Termen die een te weinig bepaalde of een van het spraakgebruik afwijkende betekenis hebben, worden gedefinieerd.

      2 In een begripsbepaling wordt aan een term geen sterk van het normale spraakgebruik afwijkende betekenis gegeven.

      3 Het gebruik van begripsbepalingen voor inhoudelijke normering wordt vermeden.


          **Toelichting**
          **Eerste lid.**Soms zullen op zichzelf duidelijke termen uit een juridisch oogpunt nadere definiëring behoeven,
      bijvoorbeeld ‘ambtenaar’ en ‘bouwen’.
          **Tweede lid.**In een begripsbepaling onder ‘landbouw’ mede verstaan ‘tuinbouw’ is aanvaardbaar. Onder
      ‘landbouw’ mede verstaan ‘visserij’ is daarentegen onjuist. Het tweede lid is te beschouwen als een specificering
      van [aanwijzing 3.10][ref1] ten aanzien van begripsbepalingen. Zie ook [aanwijzing 3.3][ref2].
          **Derde lid.** Inhoudelijke normering moet worden onderscheiden van de omschrijving van een gehanteerd begrip
      en leent zich daarmee niet voor opname in een artikel met begripsbepalingen. Zo dient de beoordeling of een bepaald
      project voor subsidie in aanmerking komt plaats te vinden op basis van een artikel waarin de inhoudelijke criteria
      voor die beoordeling staan en niet op basis van de vraag of het project binnen het begrip project valt. Niet
      alleen verhoogt dit de vindbaarheid van de inhoudelijke normen, ook zal er vaak behoefte bestaan aan een verwijzing
      naar die normen die bij een separaat, normstellend artikel (met zo nodig een verdeling in aanwijsbare leden of
      onderdelen) gemakkelijker te realiseren is dan bij een begripsbepaling die geen nummering of lettering kent (zie
      aanwijzing 3.59).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
