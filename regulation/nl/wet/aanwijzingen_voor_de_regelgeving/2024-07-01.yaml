  - number: '2.18'
    text: |-
      Algemeen verbindende voorschriften worden vanwege het Rijk niet op andere wijze vastgesteld dan bij:

      a. wet;

      b. algemene maatregel van bestuur;

      c. ministeriële regeling; of

      d. regeling van een zelfstandig bestuursorgaan met inachtneming van [aanwijzing 5.10][ref1].


          **Toelichting**
          Uit deze aanwijzing vloeit voort dat algemeen verbindende voorschriften vanwege de regering moeten worden
      vastgesteld bij algemene maatregel van bestuur. Zij mogen derhalve niet worden vastgesteld bij zogenaamd klein
      koninklijk besluit, dat wil zeggen een koninklijk besluit dat niet voldoet aan de bijzondere vereisten voor
      een algemene maatregel van bestuur, te weten dat het besluit is behandeld in de ministerraad, dat de Afdeling
      advisering van de Raad van State erover is gehoord en dat het is gepubliceerd in het Staatsblad.
          De vorm van een klein koninklijk besluit kan wel gebruikt worden voor regelgeving van interne aard.
      Een voorbeeld hiervan is het koninklijk besluit van 18 oktober 1988, houdende regeling van de functie en
      verantwoordelijkheid van de secretaris-generaal (Stb. 1988, 499).
          Deze aanwijzing houdt ook in dat de bevoegdheid tot vaststelling van algemeen verbindende voorschriften niet
      mag worden toegekend aan een ambtelijke functionaris die geen zelfstandig bestuursorgaan is. Aan zo'n functionaris
      kan wel de bevoegdheid worden toegekend regels te geven omtrent het functioneren van zijn eigen organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel2.18
