  - number: '5.75'
    text: |-
      Indien bij of krachtens de wet wordt voorzien in de mogelijkheid om bekendmaking van daarop gebaseerde regelingen
      of besluiten in bijzondere gevallen te laten plaatsvinden in een andere vorm of op een andere wijze of locatie
      dan gebruikelijk, wordt daarbij eveneens bepaald dat deze regelingen of besluiten tevens zo spoedig mogelijk op
      de reguliere wijze worden gepubliceerd, met vermelding van de wijze waarop de bekendmaking heeft plaatsgevonden
      alsmede de datum en in voorkomend geval het tijdstip daarvan.

      **Toelichting**

      Deze aanwijzing ziet op de situatie dat in regelgeving de mogelijkheid wordt geboden om de bekendmaking
      van regelingen of besluiten in bijzondere omstandigheden, veelal met het oog op de snelheid daarvan, te
      laten plaatsvinden in een andere dan de gebruikelijke vorm of op een andere wijze of locatie. Daarbij
      valt te denken aan bekendmaking via de media in plaats van door plaatsing in de Staatscourant of het
      Staatsblad, door plaatsing van het besluit op een ander dan het gebruikelijke webadres, of door uitgifte in
      papieren vorm. Voorbeelden hiervan zijn te vinden in [artikel 5.2, tweede lid, van de Wet dieren][ref1] en
      [artikel 3 van de Bekendmakingsregeling][ref2]. Deze andere wijze van bekendmaken biedt veelal minder garanties
      over het behoud en de toegankelijkheid van deze bekendmaking op langere termijn. Daarom dient de bekendmaking
      van zo’n regeling of besluit gevolgd te worden door publicatie op de reguliere wijze. Omdat de eerste publicatie
      formeel geldt als moment van bekendmaking, dient de tweede publicatie de informatie daarover te vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0030250#Artikel5.2
      [ref2]: https://wetten.overheid.nl/BWBR0025218#Artikel3
