  - number: '5.70'
    text: |-
      1 Indien daaromtrent niets is geregeld en de bedoeling van de wetgever niet uit de regeling of de toelichting kan
      worden afgeleid, is voor de volgorde van inwerkingtreding van twee of meer regelingen die op hetzelfde tijdstip in
      werking treden, bepalend:

      a. de datum van vaststelling van de regeling;

      b. indien de datum van vaststelling van beide regelingen dezelfde is: de datum van uitgifte van het Staatsblad of
      de Staatscourant;

      c. indien de datum van vaststelling en de datum van uitgifte van beide regelingen dezelfde zijn: het volgnummer van
      het Staatsblad of de Staatscourant.

      2 Voor het regelen van de volgorde van inwerkingtreding van twee of meer wetten of algemene maatregelen van bestuur
      door middel van een inwerkingtredingsbesluit wordt een van de volgende modellen gebruikt:

      A. *Met ingang van [datum] treden de volgende [wetten/besluiten] in werking, in de hieronder aangegeven volgorde:*

      a. *(...);*

      b. *(...).*

      B. *Met ingang van [datum] treedt [wet/besluit] in werking, met dien verstande dat die wet/dat besluit in werking
      treedt voordat/nadat [wet/besluit] in werking treedt.*


          **Toelichting**
          De volgorde van inwerkingtreding kan bijvoorbeeld van belang zijn indien twee wijzigingswetten dezelfde
      wetsartikelen wijzigen en de wijzigingsopdrachten uit die wetten slechts op de door de wetgever beoogde wijze
      kunnen worden uitgevoerd, wanneer beide wetten in de juiste volgorde in werking treden.
          **Eerste lid, onderdeel a.** Voor wetten en algemene maatregelen van bestuur is de datum van vaststelling de
      datum waarop de wet of het besluit door de Koning is ondertekend.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.70
  - number: '5.71'
    text: |-
      1 Voor het regelen van de werkingsduur van een tijdelijke regeling wordt een van de volgende modellen gebruikt:

      A. *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking [op / met ingang van...: zie
      aanwijzing 4.21] en vervalt [met ingang van ... / ... jaar na het tijdstip van inwerkingtreding].*

      B. *Deze wet / Dit besluit / Deze regeling / Deze beleidsregel treedt in werking [op / met ingang van...: zie
      aanwijzing 4.21] en vervalt op een bij [koninklijk besluit / door Onze Minister van/voor ... / door de Minister
      van/voor ...] te bepalen tijdstip.*

      2 De verlenging van een tijdelijke regeling geschiedt door een wijziging van de vervaldatum die in de regeling (in
      geval van toepassing van model A) of het koninklijk of ministerieel besluit (in geval van toepassing van model B)
      is opgenomen, en die uiterlijk met ingang van de oorspronkelijke datum in werking kan treden.


          **Toelichting**
          **Eerste lid.**
          Bij het gebruik van de modellen wordt [aanwijzing 4.17][ref1] in acht genomen. Indien nodig kunnen de modellen
      uit deze aanwijzing, voor zover het gaat om het tijdstip waarop de regeling vervalt, worden gecombineerd met die
      uit [aanwijzing 4.22][ref2].
          De in model B genoemde formulering wordt slechts gekozen, indien vaststaat dat het om een tijdelijke regeling
      gaat, maar het tijdstip waarop de regeling vervalt niet vooraf kan worden vastgesteld.
          **Tweede lid.** Bij verlenging wordt er niet voor gekozen met ingang van de datum van het vervallen van een
      regeling dezelfde regeling opnieuw vast te stellen. Indien een regeling bijvoorbeeld met ingang van 1 juli 2020
      vervalt, kan de regeling tot aanpassing van die datum met ingang van 1 juli 2020 in werking treden. In dat geval
      is de bedoeling van de wetgever uit de regeling af te leiden: de regeling wordt verlengd en vervalt dus (nog) niet
      (vgl. aanwijzing 5.70, aanhef). Een regeling die is vervallen, kan uiteraard niet meer worden verlengd; indien het
      gewenst is deze voort te laten bestaan, is hernieuwde vaststelling nodig.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
