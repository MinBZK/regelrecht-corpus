      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '5'
        paragraaf: '5.16'
  - number: '6.26'
    text: |-
      1 Het wijzigen van een al uitgevoerde wijzigingsopdracht leidt niet tot aanpassing van de aangebrachte wijzigingen.
      Evenmin maakt het laten vervallen van een al uitgevoerde wijzigingsopdracht de aangebrachte wijzigingen ongedaan.

      2 Een ingetrokken regeling of een vervallen bepaling herleeft niet door het laten vervallen van de bepaling,
      krachtens welke zij is ingetrokken of vervallen.


          **Toelichting**
          **Eerste lid.** Een wijzigingsopdracht is, nadat de wijziging is doorgevoerd in de doelregeling, meteen
      uitgewerkt. Het is dan niet meer mogelijk om een door die wijzigingsopdracht aangebrachte wijziging nog aan te
      passen door de wijzigingsopdracht anders te formuleren. Dit kan alleen door de gewijzigde regeling opnieuw te
      wijzigen door middel van een nieuwe wijzigingsopdracht. Ook voor een wijzigingsopdracht die – bijvoorbeeld door een
      onjuiste formulering – niet kon worden doorgevoerd, geldt dat deze na het moment waarop de wijziging moest worden
      doorgevoerd niet meer kan worden hersteld door alsnog de wijzigingsopdracht aan te passen.
          Voorafgaand aan het moment waarop een wijzigingsopdracht doorgevoerd moet worden kan deze nog wel worden
      aangepast. In het algemeen is dit het moment van inwerkingtreding daarvan, maar het kan ook zijn dat het
      toepassingsmoment van de wijzigingsopdracht bijvoorbeeld aan het inwerkingtreding van een andere regeling
      is gekoppeld. In dat geval kan de wijzigingsopdracht dus ook in het tijdvak tussen inwerkingtreding en
      toepassingsmoment nog zinvol worden gewijzigd.
          **Tweede lid.** Is een regeling eenmaal vervallen, dan kan zij alleen herleven door hernieuwde vaststelling,
      eventueel met terugwerkende kracht. Hiervan is te onderscheiden de situatie dat niet een regeling is vervallen maar
      een bevoegdheid in een overigens van kracht blijvende regeling. In dat geval kan door wijziging van deze regeling
      met terugwerkende kracht de vervallen bevoegdheid over de achterliggende periode weer in het leven worden geroepen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.26
  - number: '6.27'
    text: |-
      1 Door de regering gewenste veranderingen in door haar ingediende voorstellen van wet krijgen de vorm van een nota
      van wijziging.

      2 Het opstellen van een nota van wijziging geschiedt overeenkomstig de [aanwijzingen 6.9 tot en met 6.12][ref1]
      en [6.16][ref2].

      3 In het opschrift worden een tweede, derde en volgende nota van wijziging als zodanig aangeduid.

      4 De aanhef van een nota van wijziging luidt: Het voorstel van wet wordt als volgt gewijzigd:

      5 Een nota van wijziging wordt niet ingedeeld in artikelen. De onderdelen worden met hoofdletters of Arabische
      cijfers aangeduid. Een eventuele verdere onderverdeling geschiedt met Arabische cijfers of kleine letters.


          **Toelichting**
          Bij nota van wijziging kunnen behalve het lichaam van het wetsvoorstel ook het opschrift en de considerans
      worden gewijzigd.
          De indiening van een nota van wijziging leidt ertoe dat het wetsvoorstel vanaf dat moment is gewijzigd.
          Bij een nota van wijziging wordt uitgegaan van de meest recente tekst van het wetsvoorstel, dus inclusief
      eventueel bij eerdere nota van wijziging aangebrachte wijzigingen. De aanhef van een nota van wijziging luidt dus
      niet: ‘Het gewijzigde voorstel van wet wordt als volgt gewijzigd:’.
          Van een nota van verbetering kan alleen sprake zijn, als het gaat om het herstellen van afwijkingen tussen
      de ingediende en de gedrukte tekst van een Kamerstuk. Een nota van verbetering wordt uitgebracht door het Bureau
      wetgeving van de Tweede Kamer, respectievelijk de griffie van de Eerste Kamer.
          In een nota van wijziging op een wijzigingswet wordt een ingevolge die wijzigingswet in een andere wet op te
      nemen artikel aangeduid als ‘het voorgestelde artikel’: ‘In artikel III, onderdeel A, komt het voorgestelde artikel
      6a te luiden: ...’.
          Zie voor de nummering van bij nota van wijziging in te voegen artikelen of onderdelen van een wijzigingswet
      [aanwijzing 6.32][ref3].

          **Nota van wijziging** Het voorstel van wet wordt als volgt gewijzigd: A Artikel I, onderdeel A, wordt als
      volgt gewijzigd: Onder vernummering van het tweede tot en met vierde subonderdeel tot derde tot en met vijfde
      subonderdeel wordt een subonderdeel ingevoegd, luidende: (...)
      In het vierde subonderdeel (nieuw) wordt ‘(...)’ vervangen door ‘(...)’. B In artikel I, onderdeel B, wordt het
      voorgestelde artikel 2a als volgt gewijzigd: In het eerste lid wordt ‘(...)’ vervangen door ‘(...)’.
      Het derde lid wordt als volgt gewijzigd: In onderdeel a vervalt ‘(...)’.
      In onderdeel b wordt ‘(...)’ vervangen door ‘(...)’. C In artikel I, onderdeel B, wordt in het voorgestelde artikel
      2c ‘(...)’ vervangen door ‘(...)’. D Na artikel II wordt een artikel ingevoegd, luidende: ARTIKEL IIA (...) E In
      artikel III worden na onderdeel C twee onderdelen ingevoegd, luidende: Ca (...) Cb (...) F In artikel VII wordt
      voor onderdeel A een onderdeel ingevoegd, luidende: aA (...)


