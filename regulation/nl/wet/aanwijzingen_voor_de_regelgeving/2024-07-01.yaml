  - number: 5.41.1
    text: |-
      Indien intrekking of schorsing van een beschikking bij wijze van sanctie mogelijk moet zijn, wordt de bevoegdheid
      daartoe uitdrukkelijk geregeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.41
  - number: 5.41.2
    text: |-
      De gronden die kunnen of moeten leiden tot het intrekken of schorsen van een beschikking bij wijze van sanctie,
      worden in de regeling gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.41
  - number: '5.42'
    text: |-
      Voor het verlenen van de bevoegdheid tot oplegging van een last onder bestuursdwang of een last onder dwangsom
      wordt het volgende model gebruikt: *[aanduiding bestuursorgaan] is bevoegd tot oplegging van een [last onder
      bestuursdwang / last onder dwangsom] ter handhaving van [aanduiding desbetreffende verplichtingen].*
          **Toelichting**
          Door gebruik te maken van dit model wordt – indien het een regeling betreft die in het Europese deel van
      Nederland geldt – aangegeven dat [afdeling 5.3.1][ref1] of [5.3.2 Awb][ref2] van toepassing is. Deze afdelingen van
      de [Awb][ref3] gelden niet in Bonaire, Sint Eustatius en Saba (zie ook de toelichting bij [aanwijzing 5.40][ref4]).
      Het model is met name van belang voor toekenning van de bevoegdheid tot het opleggen van een last onder
      bestuursdwang (of alleen de bevoegdheid tot het opleggen van een last onder dwangsom) aan bestuursorganen van de
      centrale overheid. De [Gemeentewet][ref5], de [Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref6], de
      [Provinciewet][ref7] en de [Waterschapswet][ref8] bevatten reeds een algemene bevoegdheid tot het opleggen van
      een last onder bestuursdwang voor de besturen van gemeenten, de openbare lichamen Bonaire, Sint Eustatius en Saba,
      provincies en waterschappen.
          Uit [artikel 5:32 Awb][ref9] volgt dat een bestuursorgaan dat bevoegd is een last onder bestuursdwang op te
      leggen, in plaats daarvan ook een last onder dwangsom kan opleggen. Om een last onder bestuursdwang en last onder
      dwangsom beide mogelijk te maken hoeft dus slechts de bevoegdheid tot oplegging van een last onder bestuursdwang
      te worden geregeld. Indien het – bijvoorbeeld omdat het bestuursorgaan daartoe niet over de benodigde mensen of
      middelen beschikt – onwenselijk is om aan een bestuursorgaan ook de bevoegdheid tot het opleggen van een last onder
      bestuursdwang toe te kennen, kan ervoor worden gekozen om aan het bestuursorgaan alleen de bevoegdheid tot het
      opleggen van een last onder dwangsom toe te kennen.


