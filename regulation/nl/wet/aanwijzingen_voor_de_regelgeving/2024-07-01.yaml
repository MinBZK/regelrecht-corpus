  - number: 4.42.1
    text: |-
      Een wetsvoorstel, een algemene maatregel van bestuur of ander koninklijk besluit van regelende aard en een
      ministeriële regeling worden voorzien van een toelichting.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.42
  - number: 4.42.2
    text: |-
      De toelichting bij een wetsvoorstel wordt aangeduid als ‘*memorie van toelichting*’, de toelichting bij een
      algemene maatregel van bestuur of een ander koninklijk besluit van regelende aard als ‘*nota van toelichting*’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.42
  - number: 4.42.3
    text: |-
      Een koninklijk besluit tot inwerkingtreding van een regeling wordt alleen van een nota van toelichting voorzien
      indien dit gelet op de inhoud ervan nodig is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.42
  - number: '4.43'
    text: |-
      De toelichting bevat een verantwoording van de regeling. Daarbij komen, voor zover van toepassing, in ieder geval
      de volgende punten aan de orde:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.a
    text: |-
      de doelen die met de regeling worden nagestreefd of, in het geval van een implementatieregeling, de aanleiding en
      achtergronden van de te implementeren internationale regeling of bindende EU-rechtshandeling;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.b
    text: |-
      de noodzaak tot overheidsinterventie, mede bezien in relatie tot het zelfregulerende vermogen in de betrokken
      sector of sectoren, alsmede de overwogen varianten en de te verwachten neveneffecten van de regeling;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.c
    text: |-
      de uitvoerings- en handhavingsaspecten van de regeling, zoals de keuze van het handhavingsstelsel en de mate waarin
      te verwachten is dat de toepassing van de regeling aanleiding geeft tot conflicten;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.d
    text: de gevolgen voor de informatievoorziening van de rijksoverheid en voor de verwerking van persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.e
    text: |-
      de lasten voor burgers, bedrijven en instellingen en de lasten voor de overheid, waaronder de lasten verbonden
      aan rechtsbescherming;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.f
    text: de wijze waarop rekening is gehouden met het doenvermogen van degenen die geraakt worden door de regeling;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.g
    text: de verenigbaarheid met hoger recht en de verhouding tot andere regelingen;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.h
    text: |-
      de wijze waarop recht is gedaan aan het primaat van de wetgever, alsmede een motivering van de keuze van de
      overheidslaag waaraan bevoegdheden zijn toegedeeld;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.i
    text: |-
      de positie van Bonaire, Sint Eustatius en Saba en de wijze waarop rekening is gehouden met eventuele bijzondere
      omstandigheden waardoor die eilanden zich wezenlijk onderscheiden van het Europese deel van Nederland;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.j
    text: het overgangsrecht en de inwerkingtreding van de regeling;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.k
    text: |-
      de inbreng van externe partijen bij de totstandkoming van de regeling, alsmede de bij de totstandkoming van de
      regeling voorgeschreven bijzondere procedures;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.l
    text: de voorgenomen evaluatie van de regeling;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.43.m
    text: overige aspecten van de regeling waarop kabinetsbeleid inzake regelgeving toepasselijk is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.43
  - number: 4.44.1
    text: |-
      In de toelichting wordt, voor zover mogelijk en relevant voor de inhoud van de regeling, vermeld welke externe
      partijen inbreng hebben geleverd bij de totstandkoming van de regeling, op welke wijze dat is gebeurd, wat de
      strekking van de inbreng was en wat er met de inbreng is gedaan.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.44
  - number: 4.44.2
    text: |-
      Indien voor de totstandkoming van een regeling een bijzondere procedure wettelijk is voorgeschreven, wordt aan het
      volgen daarvan in de toelichting aandacht geschonken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.44
  - number: 4.44.3
    text: |-
      Indien op hoofdpunten in een regeling wordt afgeweken van een krachtens wettelijk voorschrift uitgebracht advies,
      wordt de reden hiervan in de toelichting weergegeven.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.44
  - number: 4.45.1
    text: |-
      Indien een wetsvoorstel financiële gevolgen heeft, wordt in een afzonderlijk onderdeel van de memorie van
      toelichting of in een bijlage bij de memorie van toelichting aangegeven in welke omvang daaraan hogere of lagere
      uitgaven of ontvangsten verbonden zullen zijn.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.45
  - number: 4.45.2
    text: |-
      In het in het eerste lid bedoelde overzicht wordt een onderscheid gemaakt tussen gevolgen voor het Rijk en gevolgen
      voor andere maatschappelijke sectoren.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.45
  - number: 4.45.3
    text: |-
      In de memorie van toelichting wordt tevens aangegeven of en zo ja, in hoeverre de financiële gevolgen begrepen zijn
      in de laatst ingediende begroting of in de ramingen voor de vier op het begrotingsjaar volgende jaren.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.45
  - number: 4.45.4
    text: |-
      Indien op grond van compenserende maatregelen per saldo geen budgettair effect te verwachten valt, worden in de
      memorie van toelichting ook de bruto financiële gevolgen van een wetsvoorstel vermeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.45
  - number: 4.45.5
    text: Indien een wetsvoorstel geen financiële gevolgen heeft, blijkt dit uitdrukkelijk uit de memorie van toelichting.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.45
  - number: 4.45.6
    text: |-
      Indien een algemene maatregel van bestuur of een ministeriële regeling leidt tot financiële gevolgen voor het Rijk,
      wordt daaraan zo nodig in de (nota van) toelichting aandacht geschonken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.45
  - number: 4.46.1
    text: |-
      Indien een wetsvoorstel leidt tot financiële gevolgen voor decentrale overheden, wordt dit aangegeven in een
      afzonderlijk onderdeel van de memorie van toelichting. Daarbij wordt onder meer ingegaan op de uitvoering
      van [artikel 105, derde lid, van de Provinciewet][ref1], [artikel 108, derde lid, van de Gemeentewet][ref2]
      of [artikel 136, derde lid, van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref3],
      respectievelijk [artikel 2 van de Financiële-verhoudingswet][ref4] of
      [artikel 87 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel108
      [ref3]: https://wetten.overheid.nl/BWBR0028142#Artikel136
      [ref4]: https://wetten.overheid.nl/BWBR0008290#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0028151#Artikel87
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.46
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '105'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '108'
      - id: ref3
        bwb_id: BWBR0028142
        artikel: '136'
      - id: ref4
        bwb_id: BWBR0008290
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0028151
        artikel: '87'
  - number: 4.46.2
    text: |-
      Tevens wordt aangegeven via welke bekostigingswijze de in het eerste lid bedoelde financiële gevolgen kunnen worden
      opgevangen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.46
  - number: 4.46.3
    text: |-
      Indien een algemene maatregel van bestuur of een ministeriële regeling leidt tot financiële gevolgen voor
      decentrale overheden, wordt daaraan zo nodig in de (nota van) toelichting aandacht geschonken.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.46
  - number: '4.47'
    text: |-
      Een toelichting wordt niet gebruikt voor het stellen van nadere regels.
          **Toelichting**
          De toelichting geeft een motivering en uitleg van de regeling maar mag geen aanvullende normen bevatten. De te
      stellen normen worden in de regeling zelf vastgelegd. Evenmin mag een toelichting gebruikt worden voor een nadere
      omlijning van in de regeling voorkomende termen of begrippen. Dit neemt niet weg dat het in bepaalde gevallen
      wenselijk kan zijn een nadere verklaring te geven van in de regeling voorkomende termen of begrippen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.47
  - number: 4.48.1
    text: |-
      Een toelichting wordt verdeeld in een algemeen en een artikelsgewijs gedeelte, indien dit de toegankelijkheid
      bevordert.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.48
  - number: 4.48.2
    text: Onderdelen van een toelichting worden genummerd, indien dit met het oog op verwijzing wenselijk is.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.48
  - number: 4.49.1
    text: In een toelichting wordt heldere en bondige taal gebruikt en een logische indeling gevolgd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.49
  - number: 4.49.2
    text: |-
      Bij het formuleren van een nota van toelichting bij een algemene maatregel van bestuur of een ander koninklijk
      besluit van regelende aard, of een toelichting bij een ministeriële regeling of een beleidsregel wordt ervan
      uitgegaan dat de betrokken regeling al is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.49
  - number: 4.49.3
    text: |-
      De [paragrafen 3.1][ref1], [3.3][ref2] en [3.4][ref3] van deze aanwijzingen zijn voor de formulering van een
      toelichting van overeenkomstige toepassing, voor zover zij verenigbaar zijn met de aard van een toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.49
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 4.50.1
    text: |-
      Verwijzing naar artikelen of onderdelen van regelingen die in de toelichting met een afkorting of andere verkorte
      aanduiding worden aangehaald, geschiedt overeenkomstig de volgende voorbeelden: - *artikel 10, tweede lid, Wob;*
        - *artikel 7, tweede lid, Sr;*
        - *titel 5.2 Awb;*
        - *artikel 21 Arbowet.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.50
  - number: 4.50.2
    text: |-
      Indien in de toelichting gebruik wordt gemaakt van een afkorting of verkorte aanduiding voor het aanhalen van een
      regeling, wordt daarbij bij voorkeur het hoofdlettergebruik in de citeertitel van de aangehaalde regeling gevolgd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.50
  - number: '4.51'
    text: |-
      Verwijzing in een toelichting naar andere stukken geschiedt door een nauwkeurige aanduiding van de vindplaats.
          **Toelichting**
          Zie ook de [aanwijzingen 3.37 tot en met 3.46][ref1] en [3.50][ref2]. Bij verwijzing naar stukken die in het L-
      blad van het Publicatieblad van de Europese Unie zijn gepubliceerd, is het niet nodig de vindplaats te vermelden,
      zie [aanwijzing 3.42][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.51
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 4.52.1
    text: |-
      Een memorie van toelichting, een toelichting op een nota van wijziging, een nota van toelichting, een toelichting
      op een ministeriële regeling en een toelichting op een beleidsregel worden ondertekend.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.52
  - number: 4.52.2
    text: |-
      Een memorie van toelichting, een toelichting op een nota van wijziging die aan de Afdeling advisering van de Raad
      van State wordt voorgelegd en een nota van toelichting worden ondertekend na de behandeling van het betrokken
      voorstel in de ministerraad en voordat het aan het Kabinet van de Koning wordt toegezonden voor advies van de
      Afdeling advisering van de Raad van State.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.52
  - number: 4.53.1
    text: |-
      Bij de voordracht tot een voorstel van wet of een algemene maatregel van bestuur ‘mede namens’ andere
      bewindspersonen wordt de memorie of nota van toelichting alleen door de eerstverantwoordelijke bewindspersoon
      ondertekend.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.53
  - number: 4.53.2
    text: |-
      De medebetrokkenheid van een of meer andere bewindspersonen wordt in dat geval in de toelichting tot uitdrukking
      gebracht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.53
  - number: 5.1.1
    text: Termen die een te weinig bepaalde of een van het spraakgebruik afwijkende betekenis hebben, worden gedefinieerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.1
  - number: 5.1.2
    text: In een begripsbepaling wordt aan een term geen sterk van het normale spraakgebruik afwijkende betekenis gegeven.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.1
  - number: 5.1.3
    text: Het gebruik van begripsbepalingen voor inhoudelijke normering wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.1
  - number: '5.2'
    text: |-
      Herhaling in een regeling van omvangrijke omschrijvingen wordt vermeden door in de begripsbepalingen een verkorte
      aanduiding op te nemen.
          **Toelichting**
          Begrippen die slechts één keer voorkomen in een regeling worden niet in de begripsbepalingen gedefinieerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.2
  - number: 5.3.1
    text: |-
      Voor begripsbepalingen wordt de volgende formulering gebruikt: *In [deze wet / dit besluit / deze regeling / deze
      beleidsregel] [en de daarop berustende bepalingen] wordt [, tenzij anders bepaald,] verstaan onder:*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.3
  - number: 5.3.2
    text: De term ‘*verstaan*’ wordt gebruikt, indien een begrip in algemene zin wordt gedefinieerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.3
  - number: 5.3.3
    text: |-
      De term ‘*mede verstaan*’ wordt gebruikt, indien aan de, al dan niet gedefinieerde, betekenis van een begrip
      uitbreiding wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.3
  - number: 5.3.4
    text: In een begripsbepaling worden geen aanhalingstekens gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.3
  - number: 5.4.1
    text: |-
      Indien een regeling van toepassing is of mede van toepassing is in Bonaire, Sint Eustatius en Saba, wordt dit in de
      regeling uitdrukkelijk bepaald.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.4
  - number: 5.4.2
    text: |-
      De bepaling die de toepasselijkheid van een regeling in Bonaire, Sint Eustatius en Saba regelt, wordt bij voorkeur
      in de inleidende bepalingen van de regeling opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.4
  - number: 5.4.3
    text: |-
      Het eerste lid is niet van toepassing, indien het een regeling van het Koninkrijk betreft of indien de
      toepasselijkheid van een regeling in Bonaire, Sint Eustatius en Saba reeds onmiskenbaar uit een ander wettelijk
      voorschrift volgt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.4
  - number: 5.4.4
    text: |-
      In een regeling die uitsluitend van toepassing is in het Europese deel van Nederland, behoeft geen bepaling te
      worden opgenomen die de werkingssfeer van de regeling uitdrukkelijk tot dat deel van Nederland beperkt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.4
  - number: 5.5.1
    text: |-
      In een regeling die zowel in het Europese deel van Nederland als in Bonaire, Sint Eustatius en Saba van toepassing
      is, worden, indien dat de toegankelijkheid van de regeling ten goede komt, bepalingen die specifiek betrekking
      hebben op de toepassing van de regeling in Bonaire, Sint Eustatius en Saba, in een apart hoofdstuk of een aparte
      paragraaf opgenomen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.5
  - number: 5.5.2
    text: |-
      Het aparte hoofdstuk of de aparte paragraaf voor Bonaire, Sint Eustatius en Saba wordt opgenomen aan het einde van
      de regeling, voor de slotartikelen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.5
  - number: 5.6.1
    text: |-
      In de toelichting bij een regeling waarbij een adviescollege wordt ingesteld of een adviestaak wordt opgedragen,
      wordt gemotiveerd waarom onafhankelijke advisering op het desbetreffende terrein noodzakelijk wordt geacht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.6
  - number: 5.6.2
    text: |-
      In de toelichting bij een regeling waarbij een adviescollege wordt ingesteld, wordt gemotiveerd waarom de
      adviestaak niet aan een bestaand adviescollege wordt opgedragen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.6
  - number: '5.7'
    text: |-
      In een regeling wordt niet voorzien in de verplichting advies te vragen over algemeen verbindende voorschriften of
      te voeren beleid van het Rijk.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.7
  - number: '5.8'
    text: |-
      In de toelichting bij een regeling waarbij een zelfstandig bestuursorgaan wordt ingesteld of een taak aan een
      zelfstandig bestuursorgaan wordt opgedragen, wordt de noodzaak daartoe gemotiveerd.
          **Toelichting**
          In [artikel 3 van de Kaderwet zelfstandige bestuursorganen][ref1] zijn de (restrictief geïnterpreteerde)
      gevallen opgenomen waarin een zelfstandig bestuursorgaan kan worden ingesteld, of nadien met een andere
      taak, inhoudende de uitoefening van openbaar gezag, kan worden belast. Het voldoen aan een of meer van de in
      [artikel 3 van de Kaderwet zelfstandige bestuursorganen][ref2] opgenomen gronden laat onverlet dat terughoudend
      met de instelling van een zelfstandig bestuursorgaan of het opdragen van taken aan een bestaand zelfstandig
      bestuursorgaan moet worden omgegaan.
          Bij het opstellen van de motivering kunnen de volgende vragen als leidraad worden gebruikt:
          waarom moet de overheid de taak behartigen of blijven behartigen?
      waarom is toekenning van de taak aan provincie- en gemeentebesturen of aan de besturen van de openbare lichamen
      Bonaire, Sint Eustatius en Saba niet aangewezen?
      waarom wordt de taak niet onder volledige ministeriële verantwoordelijkheid uitgeoefend?
      welke afweging is er gemaakt inzake de kosten, bestuurlijke lasten en doelmatigheid in vergelijking met het
      toekennen of blijven toekennen van de taak aan een minister?
      hoe is de taakuitoefening afgestemd op de taken van andere bestuursorganen op rijks-, provinciaal of gemeentelijk
      niveau of op het niveau van de openbare lichamen Bonaire, Sint Eustatius en Saba?


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '3'
  - number: 5.9.1
    text: Een zelfstandig bestuursorgaan wordt bij of in bijzondere gevallen krachtens de wet ingesteld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.9
  - number: 5.9.2
    text: Het toekennen van openbaar gezag geschiedt bij of in bijzondere gevallen krachtens de wet.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.9
  - number: 5.9.3
    text: |-
      Voor de verstrekking van subsidies kan met inachtneming van [artikel 4:23 van de Algemene wet bestuursrecht][ref1]
      worden afgeweken van het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 5.10.1
    text: 'Regelgevende bevoegdheden worden aan een zelfstandig bestuursorgaan uitsluitend toegekend:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.10
  - number: 5.10.1.a
    text: voor zover het organisatorische of technische onderwerpen betreft; of
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.10
  - number: 5.10.1.b
    text: in bijzondere gevallen mits voorzien is in de bevoegdheid tot goedkeuring van de regeling door een minister.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.10
  - number: 5.10.2
    text: |-
      Aan een zelfstandig bestuursorgaan wordt geen adviestaak opgedragen ten aanzien van algemeen verbindende
      voorschriften of te voeren beleid van het Rijk.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.10
  - number: 5.11.1
    text: |-
      Indien het toekennen van rechtspersoonlijkheid wenselijk is, wordt in de wet waarbij een zelfstandig bestuursorgaan
      wordt ingesteld het volgende model gebruikt:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.11
  - number: 5.11.1.1
    text: '*Er is een [naam rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt].*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.11
  - number: 5.11.1.2
    text: '*[naam rechtspersoon] is gevestigd te ... .*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.11
  - number: 5.11.1.3
    text: '*[naam rechtspersoon] bezit rechtspersoonlijkheid.*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.11
  - number: 5.11.2
    text: |-
      In de instellingswet wordt in dat geval, indien mogelijk, duidelijk onderscheid gemaakt tussen het zelfstandig
      bestuursorgaan en de rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt. Daarbij wordt het volgende
      model gebruikt:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.11
  - number: 5.11.2.1
    text: |-
      *Aan het hoofd van [naam rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt] staat [aanduiding
      zelfstandig bestuursorgaan].*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.11
  - number: 5.11.2.2
    text: '*[aanduiding zelfstandig bestuursorgaan] heeft tot taak ... / de volgende taken: ...*'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.11
  - number: 5.11.3
    text: In de instellingswet wordt in dat geval de wijze van bekostiging van de rechtspersoon geregeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.11
  - number: 5.12.1
    text: |-
      De inrichting van het zelfstandig bestuursorgaan, alsmede de termijn waarvoor de leden van het zelfstandig
      bestuursorgaan worden benoemd, wordt in de instellingswet geregeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.12
  - number: 5.12.2
    text: |-
      Indien het zelfstandig bestuursorgaan wordt ingesteld omdat participatie van maatschappelijke
      organisaties in verband met de aard van de betrokken bestuurstaak bijzonder aangewezen moet worden geacht
      ([artikel 3, eerste lid, onderdeel c, van de Kaderwet zelfstandige bestuursorganen][ref1]), wordt in de
      instellingswet bepaald dat personen afkomstig van maatschappelijke organisaties in het zelfstandig bestuursorgaan
      worden benoemd. Zo mogelijk wordt daarbij bepaald dat voor elk lid een plaatsvervangend lid wordt benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel3
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '3'
  - number: 5.13.1
    text: |-
      Indien binnen een organisatie of rechtspersoon naast het publiekrechtelijke zelfstandig bestuursorgaan nog andere
      organen of nevenorganen worden ingesteld, worden in de instellingswet de onderlinge verhoudingen en bevoegdheden
      van deze organen vastgelegd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.13
  - number: 5.13.2
    text: |-
      [Aanwijzing 5.12, eerste lid][ref1], is op deze andere organen en nevenorganen van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: '5.14'
    text: |-
      Aan een minister wordt niet de bevoegdheid toegekend bijzondere aanwijzingen te geven aan een zelfstandig
      bestuursorgaan.
          **Toelichting**
          Indien de minister bevoegd is bijzondere aanwijzingen ofwel aanwijzingen voor een concreet geval te geven,
      kan niet meer van ‘zelfstandigheid’ gesproken worden en resteert er materieel niets anders dan een aan de minister
      ondergeschikt orgaan met een bij de wet geattribueerde bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.14
  - number: 5.15.1
    text: |-
      In de instellingswet wordt in voorkomende gevallen bepaald hoe de overgang van personeel, rechten, bezittingen en
      verplichtingen van de rechtspersoon de Staat der Nederlanden op een andere rechtspersoon waarvan het zelfstandig
      bestuursorgaan deel uitmaakt, wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.15
  - number: 5.15.2
    text: |-
      Hiervoor worden de volgende modellen gebruikt: *(Artikel ...)* 1. *Op het tijdstip van inwerkingtreding van deze
      wet zijn de personeelsleden van [naam dienstonderdeel], van wie naam en functie zijn vermeld op een door Onze
      Minister vastgestelde lijst, van rechtswege ontslagen en aangesteld als ambtenaar in dienst van [naam rechtspersoon
      waarvan het zelfstandig bestuursorgaan deel uitmaakt].* 2. *De overgang van de in het eerste lid bedoelde
      personeelsleden vindt plaats met een rechtspositie die als geheel ten minste gelijkwaardig is aan die welke voor
      elk van hen gold bij [naam dienstonderdeel].* 3. *De personen die op het tijdstip van inwerkingtreding van deze
      wet krachtens een arbeidsovereenkomst naar burgerlijk recht behoren tot het personeel van [naam dienstonderdeel],
      en van wie naam en functie zijn vermeld op een door Onze Minister vastgestelde lijst, zijn op dat tijdstip van
      rechtswege ontslagen en aangesteld in dienst van [naam rechtspersoon waarvan het zelfstandig bestuursorgaan deel
      uitmaakt] met een rechtspositie die in totaliteit ten minste gelijkwaardig is aan die welke voor elk van hen
      gold bij [naam dienstonderdeel].* *(Artikel ...)* 1. *Onze Minister bepaalt in overeenstemming met Onze Minister
      van Financiën welke vermogensbestanddelen van de Staat die aan [naam dienstonderdeel] worden toegerekend, worden
      toebedeeld aan [naam rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt].* 2. *De in het eerste lid
      bedoelde vermogensbestanddelen gaan op het tijdstip van inwerkingtreding van deze wet onder algemene titel over op
      [naam dienst] tegen een door Onze Minister in overeenstemming met Onze Minister van Financiën te bepalen waarde.*
      3. *Ingeval krachtens het eerste en het tweede lid registergoederen overgaan, doet Onze Minister van Financiën de
      overgang van die registergoederen onverwijld inschrijven in de openbare registers, bedoeld in afdeling 2 van titel
      1 van Boek 3 van het Burgerlijk Wetboek. Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek is niet
      van toepassing.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.15
  - number: 5.16.1
    text: |-
      Indien aan de orde, wordt bij wet bepaald op welke wijze de op het moment van instelling van een zelfstandig
      bestuursorgaan dat geen onderdeel uitmaakt van de rechtspersoon de Staat der Nederlanden, lopende wettelijke
      procedures en rechtsgedingen, respectievelijk onderzoeken door de Nationale ombudsman, worden afgehandeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.16
  - number: 5.16.2
    text: 'Hiervoor wordt het volgende model gebruikt:'
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.16
  - number: 5.16.2.1
    text: |-
      *In wettelijke procedures en rechtsgedingen, waarbij [naam dienstonderdeel] is betrokken, treedt op het tijdstip
      van inwerkingtreding van deze wet [naam rechtspersoon waarvan het zelfstandig bestuursorgaan deel uitmaakt, dan wel
      zelfstandig bestuursorgaan] in de plaats van de Staat dan wel Onze Minister.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.16
  - number: 5.16.2.2
    text: |-
      *In zaken waarin voor het tijdstip van inwerkingtreding van deze wet aan de Nationale ombudsman is verzocht een
      onderzoek te doen dan wel de Nationale ombudsman een onderzoek heeft ingesteld naar een gedraging die kan worden
      toegerekend aan [naam dienstonderdeel], treedt [naam zelfstandig bestuursorgaan] op dat tijdstip als bestuursorgaan
      in de zin van de Wet Nationale ombudsman in de plaats van Onze Minister.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.16
  - number: 5.17.1
    text: |-
      Voor een besluit waarbij een uitzondering op een wettelijk verbod of gebod wordt gemaakt voor een categorie van
      gevallen, wordt de term ‘*vrijstelling*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.17
  - number: 5.17.2
    text: |-
      Voor een beschikking waarbij in een individueel geval een uitzondering op een wettelijk verbod of gebod wordt
      gemaakt, wordt de term ‘*ontheffing*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.17
  - number: 5.17.3
    text: Voor een beschikking waarbij een bepaalde handeling wordt toegestaan, wordt de term ‘*vergunning*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.17
  - number: 5.17.4
    text: |-
      Voor een beschikking waarbij wordt vastgesteld dat een persoon of instelling aan bepaalde eisen voldoet, wordt de
      term ‘*erkenning*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.17
  - number: 5.18.1
    text: |-
      Voor de voor de inwerkingtreding van een besluit van een bestuursorgaan vereiste toestemming van een ander
      bestuursorgaan wordt de term ‘*goedkeuring*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.18
  - number: 5.18.2
    text: |-
      Voor de voor het nemen van een besluit door een bestuursorgaan vereiste toestemming van een ander bestuursorgaan
      wordt de term ‘*verklaring van geen bezwaar*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.18
  - number: '5.19'
    text: |-
      Indien de bevoegdheid wordt toegekend om bij het verlenen van een vrijstelling, ontheffing of vergunning een
      begrenzing naar tijd of plaats dan wel anderszins aan te brengen, wordt de term ‘*beperking*’ gebruikt.
          **Toelichting**
          Naast begrenzingen naar tijd of plaats kan worden gedacht aan een begrenzing ten aanzien van het aantal te
      verrichten handelingen of een begrenzing in de aard van de te verrichten handelingen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.19
  - number: 5.20.1
    text: |-
      Indien wordt beoogd de verplichtingen van een belanghebbende die hem bij het geven van een beschikking zijn
      opgelegd, door middel van straffen te handhaven, wordt deze strafbaarstelling uitdrukkelijk geregeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.20
  - number: 5.20.2
    text: |-
      Voor dergelijke en andere bij het geven van een beschikking op te leggen verplichtingen wordt de term
      ‘*voorschriften*’ gebruikt.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.20
  - number: 5.21.1
    text: |-
      Indien het nodig is een op een regeling berustende beschikking te kunnen intrekken of wijzigen, wordt de
      bevoegdheid daartoe uitdrukkelijk geregeld.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.21
  - number: 5.21.2
    text: De gronden voor het intrekken of wijzigen van een beschikking worden in de regeling gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.21
  - number: '5.22'
    text: |-
      In een wet wordt geen delegatie van bestuursbevoegdheden aan ondergeschikten mogelijk gemaakt.
          **Toelichting**
          Deze aanwijzing ziet alleen op delegatie van bestuursbevoegdheden via een wet in formele zin. Voor wetgeving in
      materiële zin geldt [artikel 10:14 Awb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: 5.23.1
    text: |-
      Indien bevoegdheden aan gemeenten, provincies of de openbare lichamen Bonaire, Sint Eustatius en Saba worden
      toegekend:
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.23
  - number: 5.23.1.a
    text: |-
      wordt de bevoegdheid tot het vaststellen van algemeen verbindende voorschriften, het vaststellen van de kaders van
      het beleid en het nemen van een besluit dat een sterke democratische legitimatie nodig heeft, in beginsel toegekend
      aan de gemeenteraad, provinciale staten of de eilandsraad;
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.23
  - number: 5.23.1.b
    text: |-
      wordt de bevoegdheid tot het vaststellen of uitvoeren van beleid en het vaststellen van besluiten, niet zijnde
      algemeen verbindende voorschriften, in beginsel toegekend aan het college van burgemeester en wethouders,
      gedeputeerde staten of het bestuurscollege.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.23
  - number: 5.23.2
    text: |-
      De termen ‘*gemeentebestuur*’, ‘*provinciebestuur*’ en ‘*eilandsbestuur*’ worden vermeden. De term ‘*gemeente*’ of
      ‘*provincie*’ wordt uitsluitend gehanteerd als aanduiding van de rechtspersoon gemeente of provincie of het gebied
      van de gemeente of provincie.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.23
  - number: 5.23.3
    text: |-
      De term ‘*openbare lichamen*’ als aanduiding van de rechtspersonen openbaar lichaam Bonaire, openbaar lichaam Sint
      Eustatius of openbaar lichaam Saba of als aanduiding van het gebied van die openbare lichamen, wordt uitsluitend
      gebruikt, indien uit de regeling volgt dat de openbare lichamen Bonaire, Sint Eustatius en Saba bedoeld zijn.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel5.23
  - number: '5.24'
    text: |-
      Indien de uitvoering van een wet wordt opgedragen aan organen van gemeenten of provincies, wordt in die wet niet
      voorzien in toezicht op de uitvoering.
          **Toelichting**
          In 2007 bracht de Commissie Doorlichting Interbestuurlijke Toezichtarrangementen het rapport ‘Van specifiek
      naar generiek’ uit (Kamerstukken II 2007/08, 31200 VII, nr. 8 en bijlage). De kabinetsreactie (Kamerstukken
      II 2007/08, 31200 VII, nr. 61) is uitgevoerd met de [Wet revitalisering generiek toezicht][ref1], het
      [Besluit verstrekking systematische toezichtinformatie][ref2], het Beleidskader schorsing en vernietiging
      (Kamerstukken II 2009/10, 32389, nr. 5 en bijlage) en het mede door de provinciebesturen vastgestelde Algemeen
      beleidskader indeplaatsstelling bij taakverwaarlozing (Kamerstukken II 2010/11, 32500 VII, nr. 85 en bijlage).
          Kern van het beleid is dat in wetten waarin aan organen van provincie of gemeenten taken in medebewind
      worden gegeven geen specifieke instrumenten voor interbestuurlijk toezicht worden opgenomen, maar dat,
      ingeval een interventie noodzakelijk is, wordt volstaan met de generieke instrumenten die zijn geregeld in de
      [Provinciewet][ref3] en de [Gemeentewet][ref4], te weten: indeplaatsstelling (indien een wettelijke taak niet of
      niet tijdig wordt uitgevoerd) of vernietiging door de Kroon (bij besluiten in strijd met het recht of het algemeen
      belang). Zie de [artikelen 121][ref5] e.v. en [261 e.v. van de Provinciewet][ref6] en de [artikelen 124][ref7]
      e.v. en [268 e.v. van de Gemeentewet][ref8]. Uitgangspunt daarbij is dat het interbestuurlijk toezicht op gemeenten
      berust bij het provinciebestuur en het toezicht op provincies bij de vakminister(s). Indien het provinciebestuur
      geen taak of expertise op een beleidsterrein heeft, kan het interbestuurlijk toezicht worden belegd bij de
      vakminister(s) ([artikel 124b en bijlage van de Gemeentewet][ref9]).
          Dit beleid heeft geen betrekking op waterschappen, noch op de openbare lichamen Bonaire, Sint Eustatius en
      Saba.
          **Toezichtinformatie.** Met de wettelijke basis die door de [Wet revitalisering generiek toezicht][ref10]
      in de [Provinciewet (artikel 121f)][ref11] en de [Gemeentewet (artikel 124h)][ref12] is opgenomen, is het niet
      langer nodig een aparte wettelijke grondslag in bijzondere wetten op te nemen. De bescherming van decentrale
      overheden die uitging van de noodzaak om per aangelegenheid een formeelwettelijke basis te creëren, wordt in het
      [Besluit verstrekking systematische toezichtinformatie][ref13] gecompenseerd door algemene regels te stellen over
      het verstrekken van toezichtinformatie, zodat enerzijds adequaat toezicht mogelijk is, maar anderzijds decentrale
      overheden niet worden geconfronteerd met informatieverplichtingen die onevenredige inspanningen vergen of voor een
      ander doel dan toezicht worden gebruikt.
          **Waterschappen.**Er zijn geen vergelijkbare generieke regels voor het toezicht op waterschappen.
      In sommige gevallen is het gewenst om het interbestuurlijk toezicht op waterschappen te uniformeren
      met het toezicht op gemeenten of provincies. Een voorbeeld van het uniformeren van het toezicht op
      waterschappen met het toezicht op gemeenten bij zowel indeplaatsstelling door het provinciebestuur als
      vernietiging door de Kroon is [artikel 38 van de Archiefwet 1995][ref14]. Een voorbeeld van het uniformeren
      van het toezicht op waterschappen met het toezicht op provincies bij alleen indeplaatsstelling is
      [artikel 17.15, tweede lid, laatste volzin, van de Wet milieubeheer][ref15]. In een dergelijk geval worden tevens
      de [bijlagen 1][ref16] en [2 bij de Algemene wet bestuursrecht][ref17] aangevuld (zie de [aanwijzingen 5.49][ref18]
      en [5.52][ref19]), zodat de rechtsbescherming bij de toepassing op waterschappen gelijk is aan de rechtsbescherming
      onder de [Gemeentewet][ref20] en de [Provinciewet][ref21].
          **Caribisch Nederland.**Zie voor het interbestuurlijk toezicht in Caribisch Nederland
      [hoofdstuk V van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref22].
          **Europeesrechtelijke verplichtingen.** Indien de naleving van Europeesrechtelijke verplichtingen in het geding
      is en het niet mogelijk of aangewezen is de generieke toezichtinstrumenten toe te passen, kan een beroep worden
      gedaan op de toezichtinstrumenten van de [Wet Naleving Europese regelgeving publieke entiteiten][ref23].


