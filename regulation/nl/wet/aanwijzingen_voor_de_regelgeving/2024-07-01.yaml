  - number: '4.25'
    text: |-
      1 Een citeertitel wordt kernachtig geformuleerd, heeft voldoende onderscheidend vermogen en bevat geen afkortingen
      tenzij dit onvermijdelijk is.

      2 Voor de bepaling tot vaststelling van de citeertitel wordt het volgende model gebruikt:

      *Deze wet / dit besluit / deze regeling / deze beleidsregel wordt aangehaald als: ...*

      3 In beginsel wordt slechts het eerste woord van een citeertitel met een hoofdletter geschreven.

      4 In een citeertitel wordt alleen een jaartal opgenomen indien daartoe behoefte bestaat ter onderscheiding van
      de betrokken regeling van een andere regeling. In dat geval kan in een wet of een algemene maatregel van bestuur
      de formulering ‘*met vermelding van het jaartal van het Staatsblad waarin [zij/het] zal worden geplaatst*’ worden
      gebruikt.

      5 In de citeertitel van een rijkswet, een algemene maatregel van rijksbestuur of een ministeriële regeling over een
      koninkrijksaangelegenheid wordt tot uitdrukking gebracht dat het rijkswetgeving betreft.

      6 In de citeertitel van een regeling die uitsluitend voor Bonaire, Sint Eustatius en Saba geldt, wordt door de
      toevoeging ‘BES’ tot uitdrukking gebracht dat het een regeling voor die eilanden betreft. Deze toevoeging blijft
      achterwege, indien de eilanden reeds voluit in de citeertitel worden genoemd.


          **Toelichting**
          **Eerste lid.**Als afkortingen worden gebruikt, moeten zij voldoende algemeen bekend zijn.
          **Tweede lid.**Deze citeertitel moet aan het slot van het opschrift van de regeling tussen haakjes worden
      vermeld. Zie [aanwijzing 4.4][ref1].
          **Derde lid.**Een citeertitel kan uiteraard ook woorden bevatten die altijd met een hoofdletter worden
      geschreven, bijvoorbeeld: [Wet Nationale ombudsman][ref2].
          **Vierde lid.** Het invullen van het jaartal in de citeertitel zoals deze tussen haakjes is opgenomen aan het
      slot van het opschrift van de regeling (zie [aanwijzing 4.4][ref3]), kan dan tot aan de bekendmaking (dus uiterlijk
      in de drukproeven) door het betrokken ministerie geschieden (zie ook [aanwijzing 3.45][ref4]). Hiervoor is geen
      uitdrukkelijke opdracht in de desbetreffende regeling vereist, zoals wel het geval is voor het publiceren van een
      integrale tekst van een regeling (zie [aanwijzing 6.22][ref5]). Het is ook mogelijk in de citeertitel expliciet het
      jaar van inwerkingtreding op te nemen. In dat geval kan de werkwijze van [aanwijzing 3.45][ref6] worden toegepast.
      Aan het jaartal in de citeertitel behoort niet het nummer van het Staatsblad te worden toegevoegd.
          **Vijfde lid.**Zie voor ministeriële regelingen met het karakter van rijkswetgeving ook
      [aanwijzing 3.25][ref7].

          Deze wet wordt aangehaald als: Handelsregisterwet.

          [Rijkswet Onderzoeksraad voor veiligheid][ref8]
      [Rijksbesluit financiering Gemeenschappelijk Hof van Justitie][ref9]
      [Uitvoeringsregeling Rijkswet administratieve bijstand douane][ref10].

          [Wet geldstelsel BES][ref11]
      [Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref12].


