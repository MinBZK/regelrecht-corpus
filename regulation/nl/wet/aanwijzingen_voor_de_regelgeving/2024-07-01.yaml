  - number: '6.18'
    text: |-
      1 Het invoegen of vervallen van een artikellid geschiedt overeenkomstig de volgende voorbeelden:

      A. *Onder vernummering van het tweede lid tot derde lid wordt een lid ingevoegd, luidende:*

      2. *(...)*

      B. *Het eerste lid vervalt, onder vernummering van het tweede tot en met vierde lid tot eerste tot en met derde
      lid.*

      2 Het wijzigen van de aanduiding van een artikelonderdeel of het invoegen of toevoegen van een artikelonderdeel
      geschiedt overeenkomstig de volgende voorbeelden:

      A. *Onder verlettering van de onderdelen c tot en met f tot d tot en met g wordt een onderdeel ingevoegd,
      luidende:*

      c. *(...)*

      B. *Onder vervanging van de punt aan het slot van onderdeel d door een puntkomma wordt een onderdeel toegevoegd,
      luidende:*

      e. *(...)*

      C. *Onder vervanging van ‘; of’ aan het slot van onderdeel c door een puntkomma en onder vervanging van de punt aan
      het slot van onderdeel d door ‘; of’ wordt een onderdeel toegevoegd, luidende:*

      e. (...)

      3 Het toevoegen van een of meer leden aan een artikel dat nog niet uit leden bestaat, geschiedt overeenkomstig het
      volgende voorbeeld:

      1. *Voor de tekst wordt de aanduiding ‘1.’ geplaatst.*

      2. *Er wordt een lid toegevoegd, luidende:*

      2. *(...)*

      4 Het wijzigen van een uit leden bestaand artikel tot een artikel dat niet uit leden bestaat, geschiedt
      overeenkomstig het volgende voorbeeld:

      *Het tweede lid alsmede de aanduiding ‘1.’ voor het eerste lid vervallen.*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.18
  - number: '6.19'
    text: |-
      Indien een artikel, lid of onderdeel in één wijzigingsregeling zowel wordt vernummerd of verletterd als gewijzigd,
      wordt dat artikel, lid of onderdeel ten behoeve van die wijziging aangeduid met de nieuwe nummering of lettering,
      met toevoeging van de vermelding ‘*(nieuw)*’.


          **Voorbeeld**
          Artikel 20 wordt als volgt gewijzigd: Onder vernummering van het vierde lid tot vijfde lid wordt een lid
      ingevoegd, luidende: (...)
      In het vijfde lid (nieuw) wordt ‘tweede en derde lid’ vervangen door ‘tweede tot en met vierde lid’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.19
  - number: '6.20'
    text: |-
      In een overgangsbepaling ter zake van een wijziging van een voorschrift wordt verwezen naar het gewijzigde
      voorschrift en niet naar de wijzigingsbepaling.


          **Toelichting**
          Deze aanwijzing wordt toegelicht aan de hand van een voorbeeld: In artikel I, onderdeel C, van een
      wijzigingsregeling wordt een artikel 8a ingevoegd, dat een beperking bevat van aanspraken die in artikel 8 aan een
      bepaalde groep van personen worden gegeven. Die beperking moet tot 1 januari 2004 niet gelden voor personen uit de
      groep die zijn geboren voor 1 januari 1930. De betrokken overgangsbepaling van de wijzigingsregeling moet dan niet
      luiden: ‘Artikel I, onder C, geldt tot 1 januari 2004 niet voor personen die geboren zijn voor 1 januari 1930.’,
      maar: ‘Artikel 8a van [aanduiding gewijzigde regeling] geldt tot en met 31 december 2003 niet voor personen die
      geboren zijn voor 1 januari 1968.’.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.20
  - number: '6.21'
    text: |-
      Bij complexe wijzigingsvoorstellen wordt ter verduidelijking van de voorgestelde wijzigingen in een wet of algemene
      maatregel van bestuur, een vergelijkend overzicht van de te wijzigen bepalingen en de voorgestelde bepalingen aan
      de Afdeling advisering van de Raad van State, respectievelijk aan de Tweede en Eerste Kamer gezonden.


          **Toelichting**
          Dit overzicht kan een apart stuk zijn, dan wel in of als bijlage bij de memorie of nota van toelichting
      worden opgenomen. Ook in een later stadium van de behandeling van een wetsvoorstel (bij indiening van een nota van
      wijziging) kan een vergelijkend overzicht nuttig zijn.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.21
  - number: '6.22'
    text: |-
      1 Na wijziging van een regeling wordt geen integrale tekst van die regeling in het Staatsblad of de Staatscourant
      geplaatst.

      2 In afwijking van het eerste lid kan een integrale tekst worden geplaatst, indien het gewenst is tevens tot
      vernummering van de gehele gewijzigde regeling over te gaan, of de tekst van de gewijzigde regeling die in oude
      spelling is geformuleerd, over te brengen naar de geldende spelling. In die gevallen wordt daartoe een bepaling
      opgenomen in de wijzigingsregeling, overeenkomstig het volgende model:

      *De tekst van [aanduiding van de betrokken regeling] wordt in [het Staatsblad / de Staatscourant] geplaatst.*

      3 In geval van vernummering wordt aan het model, bedoeld in het tweede lid, toegevoegd:

      *Voor de plaatsing in [het Staatsblad / de Staatscourant] stelt [Onze Minister / de Minister (van/voor...)] de
      nummering van de artikelen [, hoofdstukken en paragrafen] van [aanduiding van de betrokken regeling] opnieuw vast
      en brengt hij de in [die wet / dat besluit / die regeling] voorkomende aanhalingen van de artikelen [, hoofdstukken
      en paragrafen] met de nieuwe nummering in overeenstemming.*

      4 Ingeval van overbrenging in de geldende spelling wordt aan het model, bedoeld in het tweede lid, toegevoegd:

      *Voor de plaatsing in [het Staatsblad / de Staatscourant] wordt de tekst door [Onze Minister /de Minister (van/
      voor...)] overgebracht in de geldende spelling.*


          **Toelichting**
          Integrale (geconsolideerde) teksten van regelingen worden reeds gepubliceerd via het overheidswettenbestand
      (www.wetten.nl). In de uitzonderingsgevallen waarin plaatsing van een integrale tekst gewenst is, draagt de
      Minister van Justitie en Veiligheid zorg voor plaatsing daarvan in het Staatsblad, waarbij de voor de regeling
      (eerst)verantwoordelijke bewindspersoon zorg draagt voor de juistheid van de tekst. De gewijzigde tekst van de
      regeling wordt tegelijk met de wijzigingsregeling aan de Minister van Justitie en Veiligheid toegezonden, zodat de
      plaatsing in het Staatsblad van de wijzigingsregeling en de integrale tekst zo mogelijk in opeenvolgende nummers
      geschiedt. Voor plaatsing van de integrale tekst van een regeling in de Staatscourant wordt zorg gedragen door de
      voor die regeling (eerst)verantwoordelijke bewindspersoon.
          Mutatis mutandis geldt hetzelfde voor plaatsing van een integrale tekst van een regeling in een ander
      publicatieblad, bijvoorbeeld voor de plaatsing van de tekst van een rijkswet of algemene maatregel van rijksbestuur
      in het Afkondigingsblad van Aruba, het Publicatieblad van Curaçao of het Afkondigingsblad van Sint Maarten. Bij
      rijkswetten en algemene maatregelen van rijksbestuur moet men er wel op bedacht zijn dat de bekendmaking van een
      integrale tekst niet geschiedt bij besluit van de Minister van Justitie en Veiligheid, maar bij koninklijk besluit,
      op voordracht van de Minister van Binnenlandse Zaken en Koninkrijksrelaties.
          Indien bij een omvangrijke regeling de wijzigingen tot een bepaald gedeelte van de regeling beperkt blijven,
      kan volstaan worden met tekstplaatsing van dat deel van de regeling.
          Bij een integrale tekstplaatsing kunnen geen verbeteringen in de tekst van een regeling worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.22
  - number: '6.23'
    text: |-
      Intrekking van een regeling geschiedt overeenkomstig het volgende voorbeeld:

      *De Vuurwapenwet 1919 wordt ingetrokken.*


          **Toelichting**
          Bij intrekking van meer regelingen dienen deze elk afzonderlijk te worden aangeduid. Intrekking door middel van
      een algemene formule is niet toegestaan.
          Intrekking van een regeling met uitzondering van een of meer artikelen is niet mogelijk. In dat geval moet of
      voor wijziging worden gekozen of voor onderbrenging van de overgebleven artikelen in een nieuwe regeling.
          Bij intrekking van meerdere regelingen hoeft niet voor elke in te trekken regeling een apart artikel te worden
      gebruikt. Indien het past in de opbouw van de regeling, is het ook mogelijk om in één artikel een opsomming op te
      nemen van alle in te trekken regelingen (‘De volgende wetten / besluiten / regelingen worden ingetrokken:’). Zie
      bijvoorbeeld [artikel 7.1 van het Besluit houders van dieren][ref1].
          Zie ook [aanwijzing 6.12][ref2] (terminologie ‘vervallen’ en ‘intrekken’).


      [ref1]: https://wetten.overheid.nl/BWBR0035217#Artikel7.1
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
