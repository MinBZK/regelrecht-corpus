  - number: '9.9'
    text: |-
      Bepalingen van een EU-verordening worden niet in nationale regelingen overgenomen, tenzij daarvoor een bijzondere
      reden bestaat.


          **Toelichting**
          Een verordening is rechtstreeks toepasselijk in de lidstaten van de Europese Unie. Om deze rechtstreekse
      werking te garanderen is het in beginsel niet toegestaan om bepalingen van een EU-verordening over te nemen in
      nationale regelingen. Een bijzondere reden kan echter gelegen zijn in de omstandigheid dat de verordening een
      uitdrukkelijke opdracht tot het treffen van uitvoeringsmaatregelen bevat of dat anders in ernstige mate afbreuk
      wordt gedaan aan de begrijpelijkheid van een nationale regeling. Vaak is implementatie van de verordening
      nog noodzakelijk in de zin dat in nationale regelgeving nog bepalingen moeten worden opgenomen betreffende
      sanctionering, rechtsbescherming en aanwijzing van met de uitvoering van de verordening belaste instanties en met
      de verordening strijdige regelgeving moet worden aangepast. Bij het ontwerpen van dergelijke nationale regelingen
      moet veel zorgvuldigheid worden betracht, opdat wordt voorkomen dat de inhoud van de verordening door de nationale
      maatregelen wordt gewijzigd.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.9
  - number: '9.10'
    text: |-
      1 Het verwijzen naar een bepaling van een bindende EU-rechtshandeling zoals deze met inbegrip van toekomstige
      wijzigingen zal luiden (dynamische verwijzing), geschiedt door de enkele verwijzing in de tekst van de
      implementatieregeling naar de tekst van de Europese bepaling.

      2 Bij een dynamische verwijzing naar bepalingen van een EU-richtlijn wordt afzonderlijk aangegeven vanaf welk
      tijdstip wijzigingen van de desbetreffende bepalingen doorwerken in het Nederlandse recht. Hiervoor wordt in de
      implementatieregeling het volgende model gebruikt:

      *Een wijziging van [aanduiding van (bepaling uit) de EU-richtlijn waarnaar is verwezen] gaat voor de toepassing van
      [aanduiding van de nationale regeling of de nationale bepaling waarin de verwijzing is opgenomen] gelden met ingang
      van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.*

      3 Indien het gewenst is dat een ander tijdstip kan worden gekozen, wordt aan het model, onder vervanging van de
      punt aan het slot door een komma, de volgende zinsnede toegevoegd: *tenzij bij ministerieel besluit, dat in de
      Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.*

      4 Het verwijzen naar een bepaling van een bindende EU-rechtshandeling zoals die op een bepaald moment luidt
      (statische verwijzing), geschiedt door verwijzing naar de tekst van die bepaling volgens de volgende voorbeelden:

      A. *Richtlijn 2006/123/EG van het Europees Parlement en de Raad van 12 december 2006 betreffende diensten op de
      interne markt, naar de tekst zoals deze bij die richtlijn is vastgesteld.*

      B. *Richtlijn 2009/138/EG van het Europees Parlement en de Raad van 25 november 2009 betreffende de toegang tot en
      uitoefening van het verzekerings- en het herverzekeringsbedrijf (Solvabiliteit II), zoals laatstelijk gewijzigd bij
      Richtlijn (EU) 2016/2341 van het Europees Parlement en de Raad van 14 december 2016.*


          **Toelichting**
          **Eerste lid.**Er kan een onderscheid gemaakt worden tussen statische en dynamische verwijzing. Bij statische
      verwijzing wordt verwezen naar specifieke Europese bepalingen zoals die op een bepaald moment luiden, terwijl bij
      dynamische verwijzing wordt verwezen naar Europese bepalingen inclusief de toekomstige wijzigingen of aanvullingen
      daarvan. Bij dynamische verwijzing zijn toevoegingen als ‘zoals deze nader is of zal worden gewijzigd’ overbodig.
      Indien geen clausulering in de zin van het vierde lid is aangebracht, is sprake van een dynamische verwijzing. Zie
      ook [aanwijzing 3.47, eerste lid][ref1].
          Dynamische verwijzing biedt het voordeel dat wijzigingen in de desbetreffende bindende EU-rechtshandeling niet
      steeds nopen tot aanpassing van de nationale regelgeving. Bij dynamische verwijzing moet men er steeds op bedacht
      zijn dat toekomstige wijzigingen in de desbetreffende bindende EU-rechtshandeling automatisch doorwerken in de
      nationale regelgeving. Een dynamische verwijzing zal nimmer volledig kunnen voorkomen dat na wijziging van de
      desbetreffende bindende EU-rechtshandeling een aanpassing van de nationale regelgeving noodzakelijk is. Aanpassing
      is bijvoorbeeld noodzakelijk indien de artikelnummers veranderen van bepalingen uit de bindende EU-rechtshandeling
      waarnaar is verwezen. Ook kan het soms nodig zijn dat de nationale regelgeving voorziet in overgangsrecht na een
      wijziging van de desbetreffende bindende EU-rechtshandeling of dat aanvullende bepalingen moeten worden opgenomen.
          Indien geïmplementeerd is door middel van dynamische verwijzing moet uit het oogpunt van kenbaarheid van
      de doorwerking van wijzigingen in de desbetreffende bindende EU-rechtshandeling melding worden gedaan in de
      Staatscourant (zie [aanwijzing 9.13][ref2]). Indien gebruik wordt gemaakt van een in de nationale regeling
      voorziene mogelijkheid om een ander tijdstip van toepassing te kiezen (zie het derde lid), geschiedt deze melding
      bij de bekendmaking van dit ministerieel besluit.
          **Tweede en derde lid.** Deze leden gelden in beginsel alleen voor richtlijnen. Bij dynamische verwijzing naar
      een verordening is een dergelijke bepaling in de meeste gevallen niet nodig en ook niet wenselijk. Bepalingen in
      een verordening omtrent het tijdstip van inwerkingtreding en het van toepassing worden, werken immers rechtstreeks
      door in het Nederlandse recht. Er kunnen echter bijzondere redenen bestaan die toch tot implementatie van een
      verordening noodzaken (zie [aanwijzing 9.9][ref3]). Indien in dergelijke gevallen dynamisch naar een verordening
      wordt verwezen, kan het, in afwijking van het eerder gestelde, zinvol zijn de standaardbepaling in het tweede lid
      van deze aanwijzing ook voor verordeningen te gebruiken.
          Het zal meestal gaan om het vaststellen van een eerder tijdstip. Voor het vaststellen van een later tijdstip
      kan uiteraard slechts aanleiding zijn indien de richtlijn niet alleen een uiterste implementatiedatum bevat, maar
      ook een latere datum met ingang waarvan de lidstaten de nationale implementatieregelingen uiterlijk dienen toe te
      passen (dus bij in de richtlijn opgenomen overgangsrecht).
          Doorslaggevend voor de vraag of een verwijzing een dynamisch karakter heeft is overigens de vormgeving daarvan
      volgens het eerste of vierde lid, niet of de standaardbepaling van het tweede lid is opgenomen.
          **Vierde lid.** Statische verwijzing kan worden bewerkstelligd door achter de aanduiding van bindende EU-
      rechtshandelingen een zinsnede toe te voegen die het statische karakter weergeeft. Bij gebruik van de in voorbeeld
      B opgenomen variant hoeft de wijzigingsrichtlijn niet met haar volledige opschrift te worden aangehaald. Volstaan
      kan worden met de in voorbeeld B opgenomen gegevens over de vaststelling en de bekendmaking van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
