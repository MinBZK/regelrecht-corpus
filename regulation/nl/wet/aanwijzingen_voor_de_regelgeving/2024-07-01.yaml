  - number: '5.44'
    text: |-
      Door sancties te handhaven bepalingen worden zo nauwkeurig mogelijk geformuleerd.


          **Toelichting**
          In het bijzonder bij bepalingen die door strafsancties of bestuurlijke sancties worden gehandhaafd
      is de rechtszekerheid van groot belang. De burger moet uit de bepalingen precies kunnen afleiden in welke
      gevallen een gedraging tot toepassing van een sanctie kan leiden. Als daarover door verwijzing naar andere
      bepalingen onduidelijkheid kan ontstaan betekent dat dus dat die verwijzing achterwege moet blijven (zie
      [aanwijzing 3.27][ref1]). Zie ook [artikel 5:4, tweede lid, Awb][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel54
