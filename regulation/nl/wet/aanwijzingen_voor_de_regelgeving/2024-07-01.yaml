  - number: '4.7'
    text: |-
      1 Indien bij de voordracht tot een voorstel van wet, een algemene maatregel van bestuur of een ander koninklijk
      besluit van regelende aard meer dan één bewindspersoon is betrokken, geschiedt de voordracht door één van hen, in
      overeenstemming met de ander(en).

      2 Indien er bijzondere redenen zijn om te bepalen dat een wet of besluit wordt gecontrasigneerd door alle
      voordragende bewindspersonen geschiedt de voordracht door één van hen, mede namens de ander(en).

      3 Indien er zeer bijzondere redenen zijn om de gelijkwaardigheid van de verantwoordelijkheid van de verschillende
      bewindspersonen ook in de voordracht tot uitdrukking te brengen, wordt gebruik gemaakt van de volgende formulering:

      *Op de voordracht van [Onze Minister van/voor .../ de Staatssecretaris van ...] en [Onze Minister van/voor .../ de
      Staatssecretaris van ...].*


          **Toelichting**
          **Eerste en tweede lid.**Een voordracht ‘in overeenstemming met’ of ‘mede namens’ veronderstelt uiteraard dat
      er tussen de betrokken bewindspersonen overeenstemming bestaat.
          Bij een voordracht ‘in overeenstemming met’ vindt geen medeondertekening van stukken plaats. Bij een voordracht
      ‘mede namens’ contrasigneren alle bewindspersonen de wet of het besluit: zie [aanwijzing 4.33][ref1]. Voor de
      memorie of nota van toelichting kan in dat geval worden volstaan met ondertekening door de eerstverantwoordelijke
      bewindspersoon: zie [aanwijzing 4.53][ref2]. Zie ook [aanwijzing 4.40][ref3].
          Na een voordracht ‘in overeenstemming met’ of ‘mede namens’ wordt ook het nader rapport ‘in overeenstemming
      met’ of ‘mede namens’ uitgebracht, tenzij in het advies een bijzondere reden is gelegen het nader rapport
      gezamenlijk te ondertekenen.
          De hoofdregel is dat één bewindspersoon voordraagt en ondertekent. Daarbij wordt het voortouwprincipe
      gehanteerd: de bewindspersoon die primair verantwoordelijk is voor de regeling, heeft het voortouw. Slechts
      indien twee of meer bewindspersonen in volstrekt gelijke mate verantwoordelijk zijn (of er bijzondere politieke
      redenen zijn om de medeverantwoordelijkheid van een andere bewindspersoon te accentueren), wordt gekozen voor
      medeondertekening.
          **Derde lid.**Een gezamenlijke voordracht komt alleen in aanmerking, indien van belang is dat de
      gelijkwaardigheid van de bemoeienis van de verschillende bewindspersonen ook in de voordracht tot uitdrukking wordt
      gebracht. Indien de delegerende wet voorschrijft dat de voordracht voor een algemene maatregel van bestuur of ander
      koninklijk besluit van regelende aard door twee of meer ministers geschiedt, verdient een voordracht door een van
      hen, ‘mede namens’ de andere minister(s), de voorkeur.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
