  - number: '5.32'
    text: |-
      Indien voor de uitvoering van een regeling de beschikbaarheid of uitwisseling van informatie tussen
      overheidsorganisaties van betekenis is, wordt in een aparte informatieparagraaf in de toelichting aandacht besteed
      aan de wijze waarop de informatievoorziening organisatorisch en technisch is ingericht.


          **Toelichting**
          **Inrichting informatievoorziening.**Het is voor een goede taakvervulling van de overheid van belang
      dat het ten behoeve daarvan ingerichte of in te richten systeem van informatievoorziening niet alleen
      doelmatig en doeltreffend is, maar ook dat het voldoet aan juridische en bestuurlijk-organisatorische
      randvoorwaarden. Onder juridische randvoorwaarden valt onder meer de afstemming op wetgeving die ziet op
      de verwerking en de bescherming van persoonsgegevens, zoals de Algemene verordening gegevensbescherming, de
      [Uitvoeringswet Algemene verordening gegevensbescherming][ref1] en de wetten inzake basisregistraties. Bestuurlijk-
      organisatorische randvoorwaarden betreffen onder meer de verantwoordelijkheid voor de informatievoorziening en
      de daarvoor benodigde bevoegdheden en systemen en de samenwerking en aansluiting tussen betrokken organisaties en
      hun informatiesystemen.
          **Inhoud informatieparagraaf.**De inhoud van de informatieparagraaf zal variëren naargelang de wijze waarop de
      informatievoorziening wordt ingericht. In het ene geval zal een volledige beschrijving van het voorgestane stelsel
      worden gegeven, waarin wordt ingegaan op de verschillende informatierelaties, de bevoegdheden die bestaan of worden
      geschapen, de wijze waarop wordt aangesloten bij bestaande informatiesystemen en dergelijke; in een ander geval
      kan worden volstaan met een beschrijving van de wijze waarop van een bestaand informatiesysteem gebruik gemaakt zal
      worden. Zie met betrekking tot de informatieparagraaf ook [aanwijzing 4.43, onderdeel d][ref2].
          **Overleg over informatieparagraaf.**Ingevolge
      [artikel 5 van het Besluit informatievoorziening in de rijksdienst 1990 (Besluit IVR 1990)][ref3] heeft de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties een coördinerende bevoegdheid op het gebied van de
      informatievoorziening in de openbare sector. Het [Besluit IVR 1990][ref4] wijst voorts verantwoordelijke ministers
      aan voor verschillende deelgebieden van de informatievoorziening. Met de desbetreffende ministeries wordt overleg
      gevoerd over de informatieparagraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0040940
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0004976#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004976
