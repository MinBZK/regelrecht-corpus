  - number: '8.14'
    text: |-
      1 Met betrekking tot verdragen worden in de (rijks)ministerraad gelijktijdig aan de orde gesteld de sluiting en de
      eventuele voorlopige toepassing van het verdrag, alsook de parlementaire goedkeuringsstukken.

      2 Het eerste lid geldt niet indien het noodzakelijk wordt geacht dat eerst alleen de sluiting en de eventuele
      voorlopige toepassing van het verdrag aan de orde worden gesteld.

      3 Bij de beraadslaging over de sluiting van een verdrag of de goedkeuring ervan spreekt de (rijks)ministerraad
      zich erover uit of het verdrag Aruba, Curaçao en Sint Maarten al dan niet raakt in de zin van
      [artikel 2, derde lid, van de Rijkswet goedkeuring en bekendmaking verdragen][ref1].


          **Toelichting**
          Het kan voorkomen dat alleen de sluiting van een verdrag aan de (rijks)ministerraad wordt voorgelegd,
      omdat parlementaire goedkeuring niet vereist is. Onder sluiting van een verdrag wordt verstaan de ondertekening
      van een verdrag of de totstandbrenging van een verdrag via een nota- of briefwisseling. Het kan ook voorkomen
      dat een verdrag alleen voor goedkeuring wordt voorgelegd, omdat het verdrag al tot stand is gebracht en
      toetreding langs andere weg dient plaats te vinden. Voor het derde lid wordt verwezen naar de toelichting bij
      [aanwijzing 8.2][ref2].
          Indien noodzakelijk kan na het besluit van de (rijks)ministerraad door de Minister van Buitenlandse Zaken een
      volmacht tot ondertekening van een verdrag worden verleend aan diegene die het verdrag zal ondertekenen.


      [ref1]: https://wetten.overheid.nl/BWBR0006799#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk8
