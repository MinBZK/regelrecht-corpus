  - number: '4.41'
    text: |-
      Bij een wijziging in een regeling van niet uit tekst bestaande informatie die niet kan worden geconsolideerd of bij
      een wijziging van een bij een regeling behorende bijlage die is bekendgemaakt door middel van een ander algemeen
      toegankelijk elektronisch medium dan het Staatsblad of de Staatscourant, wordt die informatie of bijlage opnieuw
      vastgesteld.


          **Toelichting**
          In [artikel 7, eerste lid, van de Bekendmakingswet][ref1] is bepaald dat een algemeen verbindend voorschrift
      of beleidsregel uit een tekst bestaat en tevens informatie kan bevatten die niet uit tekst bestaat, mits deze
      informatie in begrijpelijke vorm kan worden bekendgemaakt. Daarbij valt te denken aan kaarten of afbeeldingen.
      Verder voorziet artikel 7, tweede lid, van de Bekendmakingswet in bekendmaking van een bij een regeling behorende
      bijlage door middel van een ander algemeen toegankelijk elektronisch medium dan het Staatsblad of de Staatscourant
      in verband met de aard of omvang daarvan (zie [aanwijzing 4.28][ref2]). Voorbeelden zijn bepaalde afbeeldingen,
      (digitale) maquettes en film- of geluidsbestanden die door hun aard niet in de voor de publicatiebladen geldende
      standaarden passen of bestanden die door hun omvang slechts tegen hoge kosten en inspanning in die standaard te
      brengen zijn. [Artikel 19, eerste lid, van de Bekendmakingswet][ref3] verplicht er echter ook toe om dergelijke
      informatie of bijlagen in geconsolideerde vorm beschikbaar te stellen. Om te kunnen garanderen dat na wijziging van
      de informatie of bijlage een geconsolideerde versie daarvan beschikbaar is, schrijft de [Bekendmakingswet][ref4]
      voor dat zo’n wijziging de vorm moet hebben van een integrale nieuwe vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0004287#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0004287
