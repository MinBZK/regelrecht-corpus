      1 Indien het voornemen bestaat in een regeling een omvangrijke wijziging aan te brengen, wordt overwogen de
      regeling in te trekken en een nieuwe regeling vast te stellen.

      2 Bij vervanging van een regeling door een nieuwe regeling wordt de oude regeling uitdrukkelijk ingetrokken.


          **Toelichting**
          **Eerste lid.**Deze werkwijze is mede aangewezen indien de oude regeling gedurende langere tijd moet blijven
      gelden voor bestaande gevallen. Bij implementatie geldt [aanwijzing 9.4][ref1], die in beginsel in de weg staat aan
      verdergaande wijziging dan voor implementatie noodzakelijk is.
          **Tweede lid.**Het uitdrukkelijk intrekken van een oude regeling mag niet achterwege worden gelaten met een
      beroep op het beginsel dat een vroegere regeling ter zijde wordt gesteld door een latere regeling. Formuleringen
      als ‘wordt opnieuw vastgesteld als volgt’ worden vermeden.


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: '6.3'
    text: |-
      Indien de vaststelling van een nieuwe regeling een groot aantal wijzigingen in andere regelingen nodig maakt, wordt
      overwogen deze wijzigingen in een afzonderlijke regeling onder te brengen.


          **Toelichting**
          De afzonderlijke regeling kan een aanpassings- of invoeringsregeling zijn. Een aanpassingsregeling strekt
      alleen tot aanpassing van andere regelingen aan de nieuwe regeling. Een invoeringsregeling voorziet ook in de
      inwerkingtreding van de nieuwe regeling en eventueel in overgangsbepalingen.
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel6.3
  - number: '6.4'
    text: |-
      Tot een wijzigingswet waarin meerdere inhoudelijke onderwerpen worden geregeld wordt in principe slechts overgegaan
      indien:

      a. de verschillende onderdelen samenhang hebben;

      b. de verschillende onderdelen niet van een omvang en complexiteit zijn die een afzonderlijk wetsvoorstel
      rechtvaardigen; en

      c. het op voorhand niet de verwachting is dat één van de onderdelen dermate politiek omstreden is dat een goede
      parlementaire behandeling van andere onderdelen in het geding komt.


          **Toelichting**
          Deze aanwijzing heeft betrekking op zogenoemde verzamelwetten: wetten die, anders dan wetten die één
      bepaald onderwerp regelen, wijzigingen met betrekking tot meerdere onderwerpen bevatten. Verzamelwetten bestaan
      in verschillende vormen. Het kunnen bijvoorbeeld wetten zijn waarmee bepaalde rechtsontwikkelingen worden
      geconsolideerd, wetten waarmee EU-regelgeving wordt geïmplementeerd of aanpassings- of invoeringswetten in
      verband met de totstandkoming van een nieuwe wet (zie ook [aanwijzing 6.3][ref1]). Daarvan te onderscheiden
      zijn de zogenoemde technische verzamelwetten (ook wel herstel-, veeg- of reparatiewetten genoemd). Deze wetten
      worden gebruikt om technische aanpassingen te doen of om omissies in wetgeving te herstellen die naar verwachting
      zonder inhoudelijke discussie door het parlement aanvaard zullen worden. Op deze vorm van verzamelwetten is deze
      aanwijzing niet van toepassing.
          Zie met betrekking tot de implementatie van EU-regelgeving ook [aanwijzing 9.4][ref2].
          **Onderdeel a.** Het eerste criterium ziet op de samenhang tussen de verschillende onderdelen van een
      verzamelwet. Bij het opnemen van verschillende onderdelen in een wetsvoorstel is van belang dat hiermee geen
      afbreuk wordt gedaan aan de constitutionele positie van de Eerste Kamer. De Eerste Kamer kan op basis van
      [artikel 85 van de Grondwet][ref3] wetsvoorstellen slechts in hun geheel aannemen of verwerpen. Het is niet
      wenselijk dat de Eerste Kamer een inhoudelijke verzamelwet krijgt voorgelegd waarbij de onderlinge samenhang
      ontbreekt. Van samenhang is sprake bij:
          inhoudelijke samenhang;
      budgettaire samenhang, zoals bij wetgeving waarbij de opbrengst van bepaalde maatregelen wordt gebruikt als dekking
      voor andere maatregelen;
      thematische samenhang waarbij de samenhang zijn grond vindt in de aard van de onderwerpen; of
      uitvoeringstechnische samenhang, zoals bij wetgeving waarbij voor de doelgroep of de betrokken uitvoeringsinstantie
      gelijktijdige invoering gewenst is.
          **Onderdeel b.** Uitgangspunt bij een verzamelwet is dat deze bestaat uit verschillende onderdelen die als
      zodanig niet dermate groot en inhoudelijk complex zijn dat dit een separaat wetsvoorstel rechtvaardigt. Tegen een
      wat groter onderdeel dat politiek en technisch gezien eenvoudig te behandelen is, bestaat geen bezwaar. Teneinde
      te voorkomen dat het parlement geconfronteerd wordt met grote afzonderlijke onderdelen van een verzamelwet die
      een inhoudelijke behandeling vergen, is het wenselijk dergelijke onderdelen in een zelfstandig wetsvoorstel op
      te nemen.
          **Onderdeel c.** Bij het opstellen van een verzamelwetsvoorstel is het raadzaam dat een inschatting plaatsvindt
      van de politieke gevoeligheid van de verschillende onderdelen. Het is niet raadzaam om een onderdeel in een
      verzamelwet op te nemen waarvan bij voorbaat helder is dat dit politiek gezien omstreden is. Het opnemen van een
      politiek gevoelig onderdeel kan ertoe leiden dat de behandeling van dat onderdeel veel tijd vergt. Hierdoor kan
      het verzamelwetsvoorstel vertraging oplopen waardoor de andere onderdelen van het wetsvoorstel later dan nodig in
      werking kunnen treden. Het in het gedrang komen van die andere onderdelen kan weer leiden tot druk op het parlement
      om toch met het wetsvoorstel in te stemmen, ook al is het parlement van oordeel dat het politiek gevoelige punt nog
      parlementaire behandeling vergt.
          Zie ook de bij brief van de Staatssecretaris van Veiligheid en Justitie van 20 juli 2011 aan de Eerste Kamer
      aangeboden notitie over verzamelwetgeving (Kamerstukken I 2010/11, 32500 VI, M).


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk9
      [ref3]: https://wetten.overheid.nl/BWBR0001840#Artikel85
