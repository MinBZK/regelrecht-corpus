  - number: '4.3'
    text: |-
      1 Het opschrift bevat zo mogelijk enige materiële aanduiding van het onderwerp van de regeling.

      2 Het opschrift wordt beknopt gehouden.


          **Toelichting**
          Opschriften die slechts een verwijzing inhouden naar artikelen, data en nummers van verdragen, wetten of
      besluiten, zijn in het algemeen onwenselijk, omdat ze geen informatie geven over het onderwerp van de regeling.
          Bij wijzigingsregelingen kan de materiële aanduiding van het onderwerp van de wijzigingsregeling ook aan het
      slot van het opschrift tussen haakjes worden opgenomen (zie het tweede voorbeeld). Dit is alleen mogelijk als de
      wijzigingsregeling geen citeertitel heeft. Om te voorkomen dat een tussen haakjes geplaatste materiële aanduiding
      voor citeertitel wordt aangezien worden daarin geen woorden als ‘wet’, ‘besluit’ of ‘regeling’ gebruikt.
          In het opschrift van een wijzigingsregeling wordt vermeld tot wijziging van welke regeling(en) de
      wijzigingsregeling strekt. Indien de regeling tot wijziging van een groot aantal regelingen strekt, kan in het
      opschrift worden volstaan met een vermelding van de belangrijkste regeling(en), gevolgd door ‘en enige andere
      wetten / besluiten / regelingen’.
          Wanneer in het opschrift wordt verwezen naar een andere regeling kan volstaan worden met een verkorte
      aanduiding van die regeling in plaats van de wijze van aanhalen die is voorgeschreven in aanwijzing 3.37. Zo hoeft
      in het opschrift niet ook de vindplaats van die andere regeling genoemd te worden.

          Wet van 28 juni 2006 tot wijziging van de Wegenverkeerswet 1994 in verband met de invoering van een
      bromfietsrijbewijs
      Wet van 5 juli 2006 tot wijziging van het Wetboek van Strafrecht (verlenging verjaring inzake overtredingen na
      stuiting)
      Wet van 10 februari 2017 tot wijziging van de Wet basisregistraties adressen en gebouwen en enige andere wetten in
      verband met modernisering en vereenvoudiging van de registratie en het toezicht.
      Wet van 3 maart 2021 tot wijziging van de [Wet precursoren voor explosieven][ref1] en de
      [Wet op de economische delicten][ref2] ter uitvoering van [Verordening (EU) 2019/1148](32019R1148) over het op de
      markt brengen en het gebruik van precursoren voor explosieven (in plaats van: Wet van 3 maart 2021 tot wijziging
      van de Wet precursoren voor explosieven en de Wet op de economische delicten ter uitvoering van [Verordening (EU)
      2019/1148](32019R1148) van het Europees Parlement en de Raad van 20 juni 2019 over het op de markt brengen en het
      gebruik van precursoren voor explosieven, tot wijziging van [Verordening (EG) nr. 1907/2006](32006R1907) en tot
      intrekking van [Verordening (EU) nr. 98/2013](32013R0098)).


      [ref1]: https://wetten.overheid.nl/BWBR0037995
      [ref2]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0037995
      - id: ref2
        bwb_id: BWBR0002063
  - number: '4.4'
    text: |-
      Indien aan een regeling een citeertitel wordt gegeven, wordt deze aan het slot van het opschrift tussen haakjes
      vermeld.


          **Toelichting**
          Toekenning van een citeertitel aan een regeling geschiedt door een bepaling daartoe in de regeling zelf op te
      nemen (zie de [aanwijzingen 4.24][ref1] en [4.25][ref2]). De vermelding van de citeertitel in het opschrift heeft
      slechts een informatief karakter.
          **Voorbeeld**
          Wet van 4 juni 2014, houdende nieuwe regels met betrekking tot de verdeling van woonruimte en de samenstelling
      van de woonruimtevoorraad (Huisvestingwet 2014)


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.5'
      - id: ref2
        bwb_id: BWBR0005730
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.4a
    text: |-
      Indien beschikbaar wordt onder het opschrift van een regeling tussen haken het KetenID vermeld.

      **Toelichting**

      De vermelding van het KetenID stelt de lezer in staat om via de Wetgevingskalender relevante informatie met
      betrekking tot het voorstel te vinden, zoals het advies van de Afdeling advisering en het nader rapport. Het
      KetenID wordt ontleend aan het interdepartementale wetgevingsinformatiesysteem Kiwi, waarin de meeste regelgeving
      in wording is opgenomen vanaf de ontwerpfase. Informatie over deze regelgeving in wording wordt aangeboden op de
      Wetgevingskalender.

      Ten behoeve van geautomatiseerde herkenning van dit kenmerk wordt het KetenID weergegeven in de vorm WGK[nnnnnn],
      waarbij een nummer van minder dan zes cijfers waar nodig van voorloopnullen wordt voorzien.

      **Voorbeelden**

        - Wet: '*Wijziging van Boek 3 van het Burgerlijk Wetboek en van Boek 3 van het Burgerlijk Wetboek BES in verband'
      met het toekennen van preferentie aan de verschuldigde uitkeringen tot voorziening in de kosten van verzorging
      en opvoeding van minderjarige kinderen en in de kosten van levensonderhoud en studie van jong meerderjarigen*
      *(KetenID WGK012963)*
        - Algemene maatregel van bestuur: *Besluit van [...], houdende regels ter uitvoering van de Wet toetreding
      zorgaanbieders (Uitvoeringsbesluit Wtza)* *(KetenID WGK008987)* *Op de voordracht van Onze Minister voor Medische
      Zorg, van [...], kenmerk [...], gedaan mede namens Onze Minister van Volksgezondheid, Welzijn en Sport;*
        - Ministeriële regeling: *Regeling van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties [PM] 2022,
      nr. CZW/S&B/...., houdende nadere eisen en regels voor het verlenen van een toelating voor publieke en private
      identificatiemiddelen (Regeling nadere eisen identificatiemiddelen, authenticatiediensten en machtigingsdiensten
      Wdo)* *(KetenID WGK010753)*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.4a
  - number: '4.5'
    text: |-
      1 Voor de aanhef van een wet wordt het volgende model gebruikt:

      *Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.*

      *Allen, die deze zullen zien of horen lezen, saluut! doen te weten:*

      *Alzo Wij in overweging genomen hebben, dat [considerans];*

      *Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
      Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:*

      2 Indien het een rijkswet betreft, luidt de laatste alinea:

      *Zo is het, dat Wij, de Afdeling advisering van de Raad van State van het Koninkrijk gehoord, en met gemeen overleg
      der Staten-Generaal, de bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden
      en verstaan, gelijk Wij goedvinden en verstaan bij deze:*
    url: https://wetten.overheid.nl/BWBR0005730/2024-07-01#Artikel4.5
  - number: '4.6'
    text: |-
      1 Voor de aanhef van een algemene maatregel van bestuur of een ander koninklijk besluit van regelende aard wordt
      het volgende model gebruikt:

      *Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.*

      *Op de voordracht van [Onze Minister van/voor .../ de Staatssecretaris van ...] van [datum], nr. ...[, gedaan in
      overeenstemming met / mede namens Onze Minister(s) van/voor .../ de Staatssecretaris(sen) van ...];*

      *Gelet op ...;*

      *De Afdeling advisering van de Raad van State gehoord (advies van [datum], nr. ...);*

      *Gezien het nader rapport van [Onze Minister van/voor .../ de Staatssecretaris van ...] van [datum], nr. ...[,
      uitgebracht in overeenstemming met / mede namens Onze Minister(s) van/voor .../ de Staatssecretaris(sen) van ...];*

      *Hebben goedgevonden en verstaan:*

      2 In de aanhef van een algemene maatregel van rijksbestuur wordt gesproken van de ‘Afdeling advisering van de Raad
      van State van het Koninkrijk’ en wordt als voorlaatste zinsnede ingevoegd:

      *De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;*

      3 Voor de aanhef van een koninklijk besluit, niet zijnde een koninklijk besluit van regelende aard, wordt het
      volgende model gebruikt:

      *Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.*

      *Op de voordracht van [Onze Minister van/voor .../ de Staatssecretaris van ...] van [datum], nr. ...;*

      *Gelet op ...;*

      *Hebben goedgevonden en verstaan:*

      4 In de aanhef van een koninklijk rijksbesluit, niet zijnde een algemene maatregel van rijksbestuur, wordt niet
      naar het Statuut verwezen, tenzij de raad van ministers van het Koninkrijk ter zake heeft overlegd. In dat geval
      wordt als voorlaatste zinsnede ingevoegd:

      *Artikel 10 van het Statuut voor het Koninkrijk in acht genomen zijnde;*


          **Toelichting**
          Voor het ontwerp van een algemene maatregel van (rijks)bestuur of ander koninklijk besluit wordt
      beeldmerkpapier met ‘Wij Willem-Alexander’ gebruikt. Het opschrift wordt tussen het beeldmerk en de rest van de
      aanhef (‘Op de voordracht van ...’) geplaatst.
          Zie voor ‘gelet op’ [aanwijzing 4.10][ref1].
          **Eerste lid.**Een voordracht ‘in overeenstemming met’ houdt in dat de betrokken minister of staatssecretaris
      niet zelf mede voordraagt, maar wel uitdrukkelijk met de vaststelling van het besluit heeft ingestemd. Een
      voordracht ‘mede namens’ houdt in dat de minister of staatssecretaris namens wie de voordracht plaatsvindt,
      zelf ook een van de voordragende bewindspersonen is. Voor de wijze waarop de keuze voor een van deze vormen
      van medebetrokkenheid wordt bepaald, zie de [aanwijzingen 4.7][ref2] en [4.33][ref3]. De zinsneden over de
      medebetrokkenheid worden alleen opgenomen, indien zij van toepassing zijn.
          **Derde lid.**Dit lid is van toepassing op koninklijke besluiten van niet-regelende aard, zoals een besluit tot
      inwerkingtreding van een regeling. Over deze zogenaamde kleine koninklijke besluiten wordt de Afdeling advisering
      van de Raad van State niet gehoord. Zie ook [aanwijzing 4.35][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005730#Hoofdstuk4
