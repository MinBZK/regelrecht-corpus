  - number: '5.30'
    text: |-
      1 In een regeling die onder de reikwijdte van artikel 16 van de Dienstenrichtlijn valt, worden geen eisen gesteld
      aan de verrichting van diensten door dienstverrichters die in een andere lidstaat van de Europese Unie gevestigd
      zijn, die niet voldoen aan de beginselen van non-discriminatie, noodzakelijkheid wegens redenen van openbare orde,
      openbare veiligheid, de volksgezondheid of de bescherming van het milieu en evenredigheid.

      2 In een regeling die onder de reikwijdte van artikel 15, tweede lid, van de Dienstenrichtlijn valt, worden geen
      eisen opgenomen die niet voldoen aan de beginselen van non-discriminatie, noodzakelijkheid wegens een dwingende
      reden van algemeen belang en evenredigheid.


          **Toelichting**
          De Dienstenrichtlijn beperkt de mogelijkheden om eisen te kunnen stellen betreffende diensten. Zie
      [artikel 1 van de Dienstenwet][ref1] voor de definiëring van het begrip ‘eis’ in de zin van de Dienstenrichtlijn.
          **Eerste lid.** Onder artikel 16 van de Dienstenrichtlijn kunnen eisen aan de verrichting van diensten door
      dienstverrichters die niet in het Europese deel van Nederland gevestigd zijn, alleen nog op basis van een of meer
      van de vier genoemde gronden worden gesteld. Daarnaast mogen deze geen direct of indirect onderscheid maken naar
      nationaliteit of, voor rechtspersonen, naar lidstaat van vestiging, en zijn ze evenredig in verhouding tot het
      te beschermen belang. Indien er eisen worden gesteld, worden deze aan de Europese Commissie genotificeerd (zie
      [aanwijzing 7.7][ref2]).
          **Tweede lid.** Onder artikel 15, tweede en derde lid, van de Dienstenrichtlijn kunnen bepaalde eisen aan
      dienstverrichters die in het Europese deel van Nederland gevestigd zijn alleen onder voorwaarden worden gesteld.
      Het gaat om:
          kwantitatieve of territoriale beperkingen, met name in de vorm van beperkingen op basis van de bevolkingsomvang
      of een geografische minimumafstand tussen de dienstverrichters;
      eisen die van de dienstverrichter verlangen dat hij een bepaalde rechtsvorm heeft;
      eisen aangaande het aandeelhouderschap van een onderneming;
      eisen, niet zijnde eisen die betrekking hebben op aangelegenheden die vallen onder [richtlijn 2005/36/EG]
      (32005L0036) of die in andere communautaire instrumenten zijn behandeld, die de toegang tot de betrokken
      dienstenactiviteit wegens de specifieke aard ervan voorbehouden aan bepaalde dienstverrichters;
      een verbod om op het grondgebied van dezelfde staat meer dan één vestiging te hebben;
      eisen die een minimum aantal werknemers vaststellen;
      vaste minimum- of maximumtarieven waaraan de dienstverrichter zich moet houden;
      een verplichting voor de dienstverrichter om in combinatie met zijn dienst andere specifieke diensten te
      verrichten.
          Deze eisen mogen alleen worden gesteld indien zij non-discriminatoir, evenredig en noodzakelijk zijn wegens
      een dwingende reden van algemeen belang. Dergelijke eisen worden aan de Europese Commissie genotificeerd (zie
      [aanwijzing 7.7][ref3]).


