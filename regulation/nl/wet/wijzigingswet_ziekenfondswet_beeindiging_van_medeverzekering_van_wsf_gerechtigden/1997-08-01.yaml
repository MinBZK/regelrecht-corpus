preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om rechthebbenden op studiefinanciering
    ingevolge hoofdstuk II van de Wet op de studiefinanciering niet langer medeverzekerd te doen zijn in de
    ziekenfondsverzekering. Dat in verband daarmee artikel 4 van de Ziekenfondswet wordt gewijzigd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008786/1997-08-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      1 Ten aanzien van een kind dat direct voorafgaand aan de inwerkingtreding van deze wet studiefinanciering genoot
      ingevolge [hoofdstuk II van de Wet op de studiefinanciering][ref1] worden [artikel 4, tweede lid, onder ][ref2] en
      de daarop berustende bepalingen zoals deze luidden voor de inwerkingtreding van deze wet toegepast, zolang dit kind
      ononderbroken die studiefinanciering geniet.

      2 Staking van de studie in de zin van [artikel 10, vierde lid, van de Wet op de studiefinanciering][ref3] is geen
      onderbreking in de zin van het eerste lid.


