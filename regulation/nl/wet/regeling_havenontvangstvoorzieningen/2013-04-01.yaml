preamble:
  text: |-
    Gelet op Bijlagen I, II, IV en V van het op 2 november 1973 te Londen tot stand gekomen Internationaal Verdrag
    ter voorkoming van verontreiniging door schepen, met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147),
    en met het op 17 februari 1978 te Londen totstandgekomen Protocol bij dat Verdrag met Bijlage en Aanhangsels
    (Trb. 1978, 187), richtlijn nr. 2000/59/EG van het Europees Parlement en de Raad van de Europese Unie van 27
    november 2000 betreffende havenontvangstvoorzieningen voor scheepsafval en ladingresiduen (PbEG L 332), de
    artikelen 1, onder g, 6, achtste lid, 6a, tweede lid, 12a, eerste lid, 18, eerste lid, en 35a, vijfde lid, van de
    Wet voorkoming verontreiniging door schepen en de artikelen 2, 8, vijfde lid, en 9, tweede lid, van het Besluit
    havenontvangstvoorzieningen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. afmelding: het bericht dat de afgifte door de kapitein van een schip van scheepsafval en overige schadelijke
      stoffen dan wel restanten van schadelijke stoffen is beëindigd;

      b. aanmelding: de verstrekking van gegevens krachtens [artikel 12a van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel12a
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 12a
  - number: '2'
    text: |-
      Als richtlijn havenontvangstvoorzieningen, bedoeld in [artikel 1, onder g, van de wet][ref1] wordt aangewezen
      richtlijn nr. 2000/59/EG van het Europees Parlement en de Raad van de Europese Unie van 27 november 2000
      betreffende havenontvangstvoorzieningen voor scheepsafval en ladingresiduen (PbEG L 332), zoals deze laatstelijk
      is gewijzigd bij Verordening (EG) nr. 1137/2008 van het Europees Parlement en de Raad van 22 oktober 2008 tot
      aanpassing aan Besluit 1999/468/EG van de Raad van een aantal besluiten waarop de procedure van artikel 251 van het
      Verdrag van toepassing is, wat de regelgevingsprocedure met toetsing betreft (PbEU 2008, L 311).


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel1
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '1'
  - number: '3'
    text: |-
      1 De houder van een havenontvangstvoorziening meldt op een door de havenbeheerder te bepalen wijze iedere afmelding
      onverwijld aan de havenbeheerder.

      2 De afmelding gaat vergezeld van de volgende gegevens:

      a. de identiteit van het schip;

      b. de datum en het tijdstip van afmelding;

      c. de afgegeven soorten en hoeveelheden scheepsafval en overige schadelijke stoffen dan wel restanten van
      schadelijke stoffen.

      3 De havenbeheerder neemt de gegevens op in de registratie, bedoeld in [artikel 6, zesde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
  - number: '4'
    text: |-
      De havenbeheerder meldt onverwijld aan de inspecteur-generaal, op diens verzoek en op een door hem te bepalen
      wijze, de volgende gegevens:

      a. de aanmelding van de door de inspecteur-generaal aangegeven schepen;

      b. de in [artikel 3, eerste en tweede lid][ref1], vermelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0017228#Artikel3
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017228
        artikel: '3'
        paragraaf: '3'
  - number: '5'
    text: |-
      1 De houder van een havenontvangstvoorziening meldt binnen een maand na afloop van ieder kwartaal aan de
      havenbeheerder op een door de havenbeheerder te bepalen wijze de volgende gegevens over het desbetreffende
      kwartaal:

      a. de som van alle kosten, gemoeid met de inzameling, opslag en verwerking van scheepsafval;

      b. de totale hoeveelheid ingezameld, opgeslagen en verwerkt scheepsafval;

      c. de totale hoeveelheid ingezameld, opgeslagen en verwerkte overige schadelijke stoffen en restanten van
      schadelijke stoffen.

      2 De havenbeheerder neemt de gegevens op in de registratie, bedoeld in [artikel 6, zesde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
  - number: '6'
    text: |-
      De havenbeheerder meldt binnen twee maanden na afloop van ieder kalenderjaar aan de inspecteur-generaal de volgende
      gegevens over het desbetreffende jaar:

      a. de som X van de geheven bijdragen, bedoeld in [artikel 6a, eerste lid, van de wet][ref1];

      b. de som Y van de in de desbetreffende haven gemaakte kosten gemoeid met de inzameling, opslag en verwerking van
      scheepsafval dat krachtens [artikel 6a, derde lid][ref2], is afgegeven;

      c. de som Z van de in de desbetreffende haven gemaakte kosten gemoeid met de inzameling, opslag en verwerking van
      scheepsafval dat krachtens [artikel 6a, zesde lid, van de wet][ref3] is afgegeven;

      d. de bepaling van het percentage van de kosten van inzameling, opslag en verwerking van scheepsafval, volgens de
      formule X / (Y+Z) x 100%;

      e. de totale hoeveelheid ingezameld, opgeslagen en verwerkt scheepsafval;

      f. de totale hoeveelheid ingezamelde, opgeslagen en verwerkte overige schadelijke stoffen en restanten van
      schadelijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel6a
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel6a
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 6a
      - id: ref2
        bwb_id: BWBR0003642
        artikel: 6a
      - id: ref3
        bwb_id: BWBR0003642
        artikel: 6a
  - number: '7'
    text: |-
      Het percentage van de som van de jaarlijks geheven bijdragen voor het in ontvangst nemen van scheepsafval, bedoeld
      in [artikel 6a, tweede lid, van de wet][ref1], bedraagt ten minste dertig.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6a
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 6a
  - number: '8'
    text: |-
      Het aantal jaarlijks door de ambtenaren van de Inspectie Verkeer en Waterstaat te inspecteren schepen is ten minste
      gelijk aan 25 procent van het totaal aantal afzonderlijke schepen dat in een representatief kalenderjaar de havens
      aandoet, die zijn aangewezen krachtens [artikel 6, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
  - number: '10'
    text: |-
      De havenbeheerders van de in bijlage I aangewezen havens dragen zorg voor toereikende havenontvangstvoorzieningen
      voor het in ontvangst nemen van de in die bijlage aangewezen:

      a. categorieën scheepsafval, overige schadelijke stoffen of restanten van schadelijke stoffen als bedoeld in
      [artikel 6, eerste lid, onderdeel a, van de wet][ref1];

      b. stoffen en uitrusting die deze stoffen bevat als bedoeld in
      [artikel 6, eerste lid, onderdeel b, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '6'
  - number: '11'
    text: |-
      Als rechtspersoon, bedoeld in [artikel 9, tweede lid, van het Besluit havenontvangstvoorzieningen][ref1], wordt
      aangewezen de Stichting Financiering Afvalstoffen Visserij, statutair gevestigd te Urk.


      [ref1]: https://wetten.overheid.nl/BWBR0017136#Artikel9
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017136
        artikel: '9'
  - number: '12'
    text: |-
      Een melding als bedoeld in [artikel 8, eerste lid, van het Besluit havenontvangstvoorzieningen][ref1] wordt gedaan
      met behulp van het model, opgenomen in [bijlage II][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017136#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0017228
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0017136
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0017228
  - number: '14'
    text: |-
      De circulaire van de Minister van Verkeer en Waterstaat inzake melding door de scheepvaart van de voorgenomen
      afgifte van scheepsafval en ladingresiduen aan havenontvangstvoorzieningen van 19 december 2002, Stcrt. 247, wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel14
  - number: '15'
    text: |-
      In afwijking van [artikel 5][ref1] meldt de houder van de havenontvangstvoorziening de op het bij inwerkingtreding
      van deze regeling lopende kwartaal betrekking hebbende gegevens als bedoeld in dat artikel gelijktijdig met de op
      het eerstvolgende kwartaal betrekking hebbende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0017228#Artikel5
    url: https://wetten.overheid.nl/BWBR0017228/2013-04-01#Artikel15
    references:
