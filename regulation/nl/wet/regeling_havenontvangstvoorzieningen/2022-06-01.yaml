        artikel: 6d
  - number: '8'
    text: |-
      1 De ambtenaren van de Inspectie Leefomgeving en Transport inspecteren ten minste 15% van het totale aantal
      afzonderlijke schepen dat jaarlijks een Nederlandse haven aandoet. Het totaal aantal afzonderlijke schepen dat
      een Nederlandse haven aandoet wordt berekend als het gemiddelde aantal afzonderlijke schepen die zich de drie
      voorgaande kalenderjaren aan SafeSeaNet hebben gemeld.

      2 Schepen die buiten het toepassingsgebied van de richtlijn monitoring- en informatiesysteem zeescheepvaart vallen
      worden door de ambtenaren van de Inspectie Leefomgeving en Transport geïnspecteerd als hiertoe aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel8
  - number: '10'
    text: |-
      De havenbeheerders van de in bijlage I aangewezen havens dragen zorg voor toereikende havenontvangstvoorzieningen
      als bedoeld in [artikel 2 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017136#Artikel2
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0017136
        artikel: '2'
  - number: '11'
    text: |-
      Als rechtspersoon, bedoeld in [artikel 9, tweede lid, van het Besluit havenontvangstvoorzieningen][ref1], wordt
      aangewezen de Stichting Financiering Afvalstoffen Visserij, statutair gevestigd te Urk.


      [ref1]: https://wetten.overheid.nl/BWBR0017136#Artikel9
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017136
        artikel: '9'
  - number: '14'
    text: |-
      De circulaire van de Minister van Verkeer en Waterstaat inzake melding door de scheepvaart van de voorgenomen
      afgifte van scheepsafval en ladingresiduen aan havenontvangstvoorzieningen van 19 december 2002, Stcrt. 247, wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel14
  - number: '15'
    text: |-
      In afwijking van [artikel 5][ref1] meldt de houder van de havenontvangstvoorziening de op het bij inwerkingtreding
      van deze regeling lopende kalenderjaar betrekking hebbende gegevens als bedoeld in dat artikel gelijktijdig met de
      op het eerstvolgende kalenderjaar betrekking hebbende gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0017228#Artikel5
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017228
        artikel: '5'
        paragraaf: '4'
  - number: '17'
    text: 'Deze regeling wordt aangehaald als: Regeling havenontvangstvoorzieningen.'
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel17
