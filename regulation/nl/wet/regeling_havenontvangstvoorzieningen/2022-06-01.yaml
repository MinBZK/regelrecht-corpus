  - number: '10'
    text: |-
      De havenbeheerders van de in bijlage I aangewezen havens dragen zorg voor toereikende havenontvangstvoorzieningen
      als bedoeld in [artikel 2 van het besluit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017136#Artikel2
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel10
