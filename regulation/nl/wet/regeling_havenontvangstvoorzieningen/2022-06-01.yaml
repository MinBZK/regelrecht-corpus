    text: |-
      Als rechtspersoon, bedoeld in [artikel 9, tweede lid, van het Besluit havenontvangstvoorzieningen][ref1], wordt
      aangewezen de Stichting Financiering Afvalstoffen Visserij, statutair gevestigd te Urk.


      [ref1]: https://wetten.overheid.nl/BWBR0017136#Artikel9
