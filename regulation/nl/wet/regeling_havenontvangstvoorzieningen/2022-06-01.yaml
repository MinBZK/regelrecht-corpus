          timing: jaarlijks
          method: berekenen gemiddelde aantal schepen over drie voorgaande kalenderjaren
        - actor: ambtenaren van Inspectie Leefomgeving en Transport
          verb: inspecteren
          object: schepen buiten toepassingsgebied richtlijn monitoring- en informatiesysteem zeescheepvaart
          conditions: als hiertoe aanleiding bestaat
      references: []
      conditions:
        - ten minste 15% van het totale aantal schepen
