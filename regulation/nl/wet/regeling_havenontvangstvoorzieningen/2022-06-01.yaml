preamble:
  text: |-
    Gelet op Bijlagen I, II, IV en V van het op 2 november 1973 te Londen tot stand gekomen Internationaal Verdrag
    ter voorkoming van verontreiniging door schepen, met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147),
    en met het op 17 februari 1978 te Londen totstandgekomen Protocol bij dat Verdrag met Bijlage en Aanhangsels
    (Trb. 1978, 187), richtlijn nr. 2000/59/EG van het Europees Parlement en de Raad van de Europese Unie van
    27 november 2000 betreffende havenontvangstvoorzieningen voor scheepsafval en ladingresiduen (PbEG L 332), de
    artikelen 1, onder g, 6, achtste lid, 6a, tweede lid, 12a, eerste lid, 18, eerste lid, en 35a, vijfde lid, van de
    Wet voorkoming verontreiniging door schepen en de artikelen 2, 8, vijfde lid, en 9, tweede lid, van het Besluit
    havenontvangstvoorzieningen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. afmelding: het bericht dat de afgifte door de kapitein van een schip van scheepsafvalstoffen is beëindigd;

      b. aanmelding: de verstrekking van gegevens krachtens [artikel 12a van de wet][ref1];

      c. *besluit:* Besluit havenontvangstvoorzieningen;

      d. *havenbeheerder:* beheerder van een in de bijlage behorende bij [artikel 10][ref2] van de Regeling
      havenontvangstvoorzieningen aangewezen haven;

      e. *S-formulier:* scheepsafvalstoffenformulier als bedoeld in de [Bijlage behorende bij de artikelen 3, 4, 6, 6f en
      6h, onder C, onderdeel 2, van de Regeling melden bedrijfsafvalstoffen en gevaarlijke afvalstoffen](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0017228#Artikel10
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 12a
      - id: ref2
        bwb_id: BWBR0017228
        artikel: '10'
        paragraaf: '8'
  - number: 1a
    text: |-
      Deze regeling berust mede op de [artikelen 6c, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6c
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 6c
  - number: '3'
    text: |-
      1 De houder van een havenontvangstvoorziening meldt op een door de havenbeheerder te bepalen wijze iedere afmelding
      onverwijld aan de havenbeheerder.

      2 De afmelding gaat vergezeld van het S-formulier.

      3 De havenbeheerder neemt de gegevens op in de registratie, bedoeld in [artikel 6c, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6c
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 6c
  - number: '4'
    text: |-
      De havenbeheerder meldt onverwijld aan de inspecteur-generaal, op diens verzoek en op een door hem te bepalen
      wijze, de volgende gegevens:

      a. de aanmelding van de door de inspecteur-generaal aangegeven schepen;

      b. de in [artikel 3, eerste en tweede lid][ref1], vermelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0017228#Artikel3
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0017228
        artikel: '3'
        paragraaf: '3'
  - number: '5'
    text: |-
      1 De houder van een havenontvangstvoorziening meldt binnen een maand na afloop van ieder kalenderjaar aan de
      havenbeheerder op een door de havenbeheerder te bepalen wijze de volgende gegevens over het desbetreffende
      kalenderjaar:

      a. de som van de kosten, gemoeid met de inzameling, opslag en verwerking van de scheepsafvalstoffen, opgesplitst
      per afvalcategorie;

      b. de totale hoeveelheid ingezamelde, opgeslagen en verwerkte scheepsafvalstoffen, opgesplitst per afvalcategorie.

      2 De havenbeheerder neemt de gegevens op in de registratie, bedoeld in [artikel 6c, eerste lid, van de wet][ref1].
      De gegevens worden ten minste vijf jaar na de ontvangst ervan bewaard. Op verzoek van Onze Minister verstrekt
      de havenbeheerder de gegevens uit deze registratie, dan wel inlichtingen over de gegevens, op de in dat verzoek
      aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6c
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 6c
  - number: '6'
    text: |-
      De havenbeheerder meldt binnen twee maanden na afloop van ieder kalenderjaar aan de inspecteur-generaal de volgende
      gegevens over het desbetreffende jaar:

      a. de som van de geheven bijdragen, bedoeld in [artikel 6d, eerste lid, van de wet][ref1];

      b. de som van de in de desbetreffende haven gemaakte kosten gemoeid met de inzameling, opslag en verwerking van
      scheepsafvalstoffen dat krachtens [artikel 6d, tweede lid][ref2], is afgegeven;

      c. de som van de in de desbetreffende haven gemaakte kosten gemoeid met de inzameling, opslag en verwerking van
      scheepsafval dat krachtens [artikel 6d, derde lid, van de wet][ref3] is afgegeven;

      d. de totale hoeveelheid ingezamelde, opgeslagen en verwerkte scheepsafvalstoffen, opgesplitst per afvalcategorie,
      met uitzondering van ladingresiduen;

      e. de totale hoeveelheid ingezamelde, opgeslagen en verwerkte ladingresiduen.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6d
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel6d
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel6d
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel6
    references:
      - id: ref1
