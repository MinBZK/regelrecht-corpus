  - number: '4'
    text: |-
      De havenbeheerder meldt onverwijld aan de inspecteur-generaal, op diens verzoek en op een door hem te bepalen
      wijze, de volgende gegevens:

      a. de aanmelding van de door de inspecteur-generaal aangegeven schepen;

      b. de in [artikel 3, eerste en tweede lid][ref1], vermelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0017228#Artikel3
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel4
    references:
