  - number: '5'
    text: |-
      1 De houder van een havenontvangstvoorziening meldt binnen een maand na afloop van ieder kalenderjaar aan de
      havenbeheerder op een door de havenbeheerder te bepalen wijze de volgende gegevens over het desbetreffende
      kalenderjaar:

      a. de som van de kosten, gemoeid met de inzameling, opslag en verwerking van de scheepsafvalstoffen, opgesplitst
      per afvalcategorie;

      b. de totale hoeveelheid ingezamelde, opgeslagen en verwerkte scheepsafvalstoffen, opgesplitst per afvalcategorie.

      2 De havenbeheerder neemt de gegevens op in de registratie, bedoeld in [artikel 6c, eerste lid, van de wet][ref1].
      De gegevens worden ten minste vijf jaar na de ontvangst ervan bewaard. Op verzoek van Onze Minister verstrekt
      de havenbeheerder de gegevens uit deze registratie, dan wel inlichtingen over de gegevens, op de in dat verzoek
      aangegeven wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6c
    url: https://wetten.overheid.nl/BWBR0017228/2022-06-01#Artikel5
