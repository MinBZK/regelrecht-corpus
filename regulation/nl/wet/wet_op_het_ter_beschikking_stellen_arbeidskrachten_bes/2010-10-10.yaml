$id: wet_op_het_ter_beschikking_stellen_arbeidskrachten_bes
regulatory_layer: WET
publication_date: '2010-10-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028435
url: https://wetten.overheid.nl/BWBR0028435/2010-10-10
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder «ter beschikking stellen van
      arbeidskrachten» verstaan: het tegen vergoeding ter beschikking stellen van arbeidskrachten aan een ander voor
      het, anders dan krachtens een met deze gesloten arbeidsovereenkomst, in diens onderneming verrichten van aldaar
      gebruikelijke arbeid.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder «ter beschikking stellen van
      arbeidskrachten» niet verstaan:
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel1
  - number: 1.2.a
    text: |-
      het bij wijze van hulpbetoon zonder winstoogmerk ter beschikking stellen van arbeidskrachten, die bij degene, die
      hen ter beschikking stelt, ten behoeve van arbeid in diens onderneming in dienst zijn;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel1
  - number: 1.2.b
    text: |-
      het voor beperkte tijd ter beschikking stellen van arbeidskrachten als bedoeld onder a. ter uitvoering van een taak
      ten aanzien van een door degene, die hen ter beschikking stelt, ten behoeve van de onderneming, waarin zij worden
      te werk gesteld, geleverde zaak of tot stand gebracht werk;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel1
  - number: 1.2.c
    text: |-
      het door een instelling, welke door ondernemers gezamenlijk of een organisatie van ondernemers, al dan niet tezamen
      met een organisatie van werknemers, daartoe in het leven is geroepen, zonder winstoogmerk ter beschikking stellen
      van arbeidskrachten aan de betrokken ondernemers.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel1
  - number: '1.3'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde worden met onderneming gelijk gesteld:'
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel1
  - number: 1.3.a
    text: niet tot een onderneming behorende inrichtingen en kantoren;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel1
  - number: 1.3.b
    text: bedrijven, diensten en instellingen van publiekrechtelijke lichamen.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel1
  - number: '2.1'
    text: Het is verboden arbeidskrachten ter beschikking te stellen zonder door het bestuurscollege verleende vergunning.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Bij eilandsverordening kan van het in het eerste lid bedoelde verbod voor gevallen, behorende tot bij die
      verordening daartoe aangewezen categorieën*, vrijstelling worden verleend.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      Bij eilandsverordening kan worden geregeld welke gegevens bij een aanvrage om een vergunning als bedoeld
      in[ artikel 2, eerste lid][ref1], moeten worden verstrekt en welke bewijsstukken daarbij moeten worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028435#Artikel2
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028435
        artikel: '2'
  - number: '3.2'
    text: |-
      De aanvrage wordt geacht niet te zijn ingediend, zolang de krachtens het eerste lid verlangde gegevens niet zijn
      verstrekt of de krachtens dat lid verlangde bewijsstukken niet zijn overgelegd.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      Op de aanvrage wordt binnen twee maanden na indiening door het bestuurscollege beslist. Wanneer deze termijn is
      verstreken, zonder dat een vergunning is verleend, wordt het bestuurscollege geacht het geven van een vergunning te
      hebben geweigerd.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel3
  - number: '4.1'
    text: Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      Een beschikking tot verlening van een vergunning, al dan niet onder beperkingen of met voorschriften, wordt aan de
      aanvrager toegezonden bij aangetekende brief.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      Een vergunning wordt slechts geweigerd, indien gegronde vrees bestaat, dat het ter beschikking stellen van
      arbeidskrachten door de aanvrager het belang van goede verhoudingen op de arbeidsmarkt zou schaden of dat daarbij
      het belang van de betrokken arbeidskrachten onvoldoende gewaarborgd zou zijn.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      Een beschikking tot weigering van een vergunning is met redenen omkleed en wordt aan de aanvrager toegezonden bij
      aangetekende brief.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      Het ter beschikking stellen van arbeidskrachten door een houder van een vergunning betreft uitsluitend de volgende
      gevallen:
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel6
  - number: 6.1.a
    text: bij tijdelijke afwezigheid van een vaste werknemer gedurende de duur van diens afwezigheid;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel6
  - number: 6.1.b
    text: |-
      gedurende de duur van de opschorting van een arbeidsovereenkomst, behalve in geval van een kollektief
      arbeidskonflikt;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel6
  - number: 6.1.c
    text: |-
      bij beëindiging van een arbeidsovereenkomst in afwachting van de daadwerkelijke indiensttreding van de vaste
      werknemer die de werknemer moet vervangen wiens arbeidsovereenkomst is beëindigd;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel6
  - number: 6.1.d
    text: bij toevallige vermeerdering van het werk;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel6
  - number: 6.1.e
    text: bij aanvang van nieuw werk;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel6
  - number: 6.1.f
    text: |-
      bij spoedeisend werk dat onmiddellijk moet worden uitgevoerd om dreigende ongevallen te voorkomen, om
      reddingsmaatregelen te organiseren of tekortkomingen van het materieel aan de installaties of aan de
      bedrijfsgebouwen die gevaar voor de werknemers kunnen opleveren, te herstellen.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      De houder van een vergunning stelt een arbeidskracht voor een tijdvak van ten hoogste twaalf maanden aan een
      onderneming ter beschikking.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      De overeenkomst met de arbeidskracht die ter beschikking wordt gesteld, alsmede die met degene aan wie een
      arbeidskracht ter beschikking wordt gesteld, worden schriftelijk door de houder van een vergunning aangegaan.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      De overeenkomst tussen de houder van een vergunning en de arbeidskracht die ter beschikking wordt gesteld is een
      arbeidsovereenkomst als bedoeld in [artikel 1613a van het Burgerlijk Wetboek BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028752#Artikel1613a
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028752
        artikel: 1613a
  - number: '8'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld welke door de houder van een vergunning in
      acht genomen moeten worden.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel8
  - number: '9.1'
    text: |-
      Een vergunning kan slechts worden ingetrokken en de aan de vergunning verbonden beperkingen of voorschriften kunnen
      slechts worden gewijzigd, indien:
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel9
  - number: 9.1.a
    text: |-
      de verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvrage een andere beslissing zou zijn
      genomen, indien bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel9
  - number: 9.1.b
    text: |-
      beperkingen of voorschriften als bedoeld in [artikel 4, eerste lid][ref1], niet in acht zijn genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0028435#Artikel4
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028435
        artikel: '4'
  - number: 9.1.c
    text: |-
      de vergunninghouder in strijd handelt met het bepaalde in de [artikelen 6][ref1] of [7][ref2], of het bepaalde
      krachtens [artikel 8][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0028435#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028435#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028435#Artikel8
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028435
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028435
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0028435
        artikel: '8'
  - number: 9.1.d
    text: |-
      zich na de vergunningverlening nieuwe omstandigheden hebben voorgedaan, welke grond zouden hebben opgeleverd
      voor weigering van de vergunning of voor het stellen van andere beperkingen dan wel voor het verbinden van andere
      voorschriften aan de vergunning.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      Een beschikking tot intrekking van een vergunning of wijziging van de aan een vergunning verbonden beperkingen of
      voorschriften is met redenen omkleed en wordt aan de vergunninghouder toegezonden bij aangetekende brief.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel9
  - number: '10'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Bij eilandsverordening kan, indien naar het oordeel van het bestuurscollege het belang van goede verhoudingen
      op de arbeidsmarkt of het belang van de betrokken arbeidskrachten dit vereist, in het algemeen of voor gevallen,
      behorende tot bij de verordening daartoe aangewezen categorieën aan degenen, aan wie arbeidskrachten ter
      beschikking worden gesteld, de verplichting worden opgelegd de terbeschikkingstelling schriftelijk bij het
      bestuurscollege te melden overeenkomstig bij die eilandsverordening te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      Het bepaalde in [artikel 2, tweede lid][ref1], is van overeenkomstige toepassing op een krachtens het eerste lid
      opgelegde verplichting.


      [ref1]: https://wetten.overheid.nl/BWBR0028435#Artikel2
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028435
        artikel: '2'
  - number: '12.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de door het bestuurscollege
      aangewezen personen. Een zodanige aanwijzing wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      De krachtens het eerste lid aangewezen personen zijn, uitsluitend voor zover dat voor de vervulling van hun taak
      redelijkerwijze noodzakelijk is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel12
  - number: 12.2.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel12
  - number: 12.2.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel12
  - number: 12.2.c
    text: goederen aan opneming en onderzoek te onderwerpen, deze daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel12
  - number: 12.2.d
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel12
  - number: '12.3'
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel12
  - number: '12.4'
    text: |-
      Bij eilandsverordening kunnen regels worden gesteld met betrekking tot de taakuitoefening van de krachtens het
      eerste lid aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel12
  - number: '12.5'
    text: |-
      Een ieder is verplicht aan de krachtens het eerste lid aangewezen personen alle medewerking te verlenen die op
      grond van het tweede lid wordt gevorderd. De verstrekking van krachtens het tweede lid, onderdeel a, verlangde
      inlichtingen dient volledig en naar waarheid te geschieden.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel12
  - number: '13'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel13
  - number: '14'
    text: |-
      Allen die betrokken zijn of zijn geweest bij de uitvoering van deze wet, zijn verplicht tot geheimhouding van
      al hetgeen hun daarbij bekend is geworden, voor zover die verplichting uit de aard van de zaak volgt of hun
      uitdrukkelijk is opgelegd.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Hij die een bepaling van deze wet overtreedt of handelt zonder of in strijd met een vergunningen, een voorschrift
      of een voorwaarde als in deze wet bedoeld, wordt gestraft met hechtenis van ten hoogste twee jaren of een geldboete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel15
  - number: '15.2'
    text: De feiten bij deze wet strafbaar gesteld, zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel15
  - number: '16'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel16
  - number: '17'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel17
  - number: '18'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel18
  - number: '19'
    text: 'Deze wet wordt aangehaald als: Wet op het ter beschikking stellen arbeidskrachten BES.'
    url: https://wetten.overheid.nl/BWBR0028435/2010-10-10#Artikel19
