preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is een aantal knelpunten in het accreditatiestelsel op
    te lossen, de ervaren lasten van het accreditatiestelsel te verminderen en in verband daarmee de Wet op het hoger
    onderwijs en wetenschappelijk onderzoek aan te passen; dat het voorts wenselijk is de bepalingen in de Wet op het
    hoger onderwijs en wetenschappelijk onderzoek die betrekking hebben op de kwaliteitszorg en het accreditatiestelsel
    te herschikken zodat die samen een meer overzichtelijk geheel vormen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0041117/2020-04-01#ArtikelAanhef
articles:
  - number: X
    text: |-
      1 Deze wet treedt, met uitzondering van de
      [artikelen IV, onderdelen 0A en A2 tot en met A5 en V, onderdelen C1 tot en met C3][ref1], in werking op een bij
      koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan
      worden vastgesteld en kan voor artikel I, onderdelen U tot en met Y, terugwerken tot en met een in dat besluit te
      bepalen tijdstip.

      2 De [artikelen IV, onderdelen 0A en A2 tot en met A5, en V, onderdelen C1 tot en met C3][ref2], treden in werking
      met ingang van de dag na de datum van uitgifte van het Staatsblad waarin deze wet wordt geplaatst en werken terug
      tot en met 1 augustus 2017 onderscheidenlijk 1 september 2017 voor studenten in het middelbaar beroepsonderwijs
      onderscheidenlijk studenten in het hoger onderwijs.


      [ref1]: https://wetten.overheid.nl/BWBR0041117#ArtikelIV
      [ref2]: https://wetten.overheid.nl/BWBR0041117#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0041117/2020-04-01#ArtikelX
