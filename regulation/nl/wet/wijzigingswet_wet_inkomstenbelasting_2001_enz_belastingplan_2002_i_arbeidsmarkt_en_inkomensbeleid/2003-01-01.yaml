  - number: X
    text: |-
      1 Deze wet treedt in werking met ingang van 1 januari 2002, met dien verstande dat [artikel I, onderdeel Ca][ref1],
      [artikel III, onderdeel Ga][ref2], en [artikel VA][ref3] terugwerken tot en met 1 januari 2001.

      2 In afwijking van het eerste lid treden [artikel I, onderdeel J][ref4], en [artikel II, onderdeel E][ref5], in
      werking met ingang van 1 april 2002.

      3 In afwijking van het eerste lid treden [artikel I, onderdelen K, eerste lid en L][ref6], in werking met ingang
      van 1 juli 2002.

      4 In afwijking van het eerste lid treedt [artikel IA, onderdeel A en B][ref7], en [artikel IIA][ref8] in werking
      met ingang van 1 januari 2003.

      5 In afwijking van het eerste lid treedt van het in [artikel I, onderdeel L][ref9], opgenomen
      [artikel 8.13, het vierde lid][ref10] in werking op een bij koninklijk besluit vast te stellen tijdstip.

      6 [Artikel I][ref11] en [artikel II][ref12] vinden toepassing nadat [afdeling 10.1 van de Wet IB 2001][ref13] en
      [artikel 11, achtste lid, van de Wet op de loonbelasting 1964][ref14] bij het begin van het kalenderjaar 2002 zijn
      toegepast.

      7 [Artikel III][ref15] vindt toepassing nadat de [artikelen 30][ref16] en
      [30a van de Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref17] bij het begin van
      het kalenderjaar 2002 zijn toegepast.


