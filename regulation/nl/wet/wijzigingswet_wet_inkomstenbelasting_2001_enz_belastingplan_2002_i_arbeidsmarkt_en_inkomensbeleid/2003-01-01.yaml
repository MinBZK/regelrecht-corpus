  - number: IX
    text: |-
      Voor de toepassing van
      __REF000___________________________________________________________________________________________________________
      ______________ moet voor het kalenderjaar 2000 het begrip «resultaat uit overige werkzaamheden» worden opgevat
      als inkomsten uit arbeid uit niet in dienstbetrekking verrichte werkzaamheden, bedoeld in artikel 22, eerste lid,
      onderdeel b, van de Wet op de inkomstenbelasting 1964, verminderd met de aftrekbare kosten, bedoeld in artikel 35
      van de Wet op de inkomstenbelasting 1964.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel15a
