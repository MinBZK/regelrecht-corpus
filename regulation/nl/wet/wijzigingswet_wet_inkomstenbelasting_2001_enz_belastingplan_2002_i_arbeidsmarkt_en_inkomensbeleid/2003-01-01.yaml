  - number: IXA
    text: |-
      1 Ingeval de samenloop van wetten die in 2001 in het Staatsblad zijn of worden gepubliceerd en wijzigingen
      aanbrengen in één of meer belastingwetten, niet of niet juist is geregeld, of als gevolg van die samenloop
      onjuistheden ontstaan in de aanduiding van artikelonderdelen, verwijzingen en dergelijke in de desbetreffende
      wetten, herstelt Onze Minister van Financiën dat bij ministeriële regeling.

      2 Ingeval de samenloop van wetten die in 2001 in het Staatsblad zijn of worden gepubliceerd en wijzigingen
      aanbrengen in de [Coördinatiewet Sociale Verzekering][ref1], niet of niet juist is geregeld, of als gevolg van
      die samenloop onjuistheden ontstaan in de aanduiding van artikelonderdelen, verwijzingen en dergelijke in de
      [Coördinatiewet Sociale Verzekering][ref2], herstelt Onze Minister van Sociale Zaken en Werkgelegenheid dat bij
      ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002126
      [ref2]: https://wetten.overheid.nl/BWBR0002126
    url: https://wetten.overheid.nl/BWBR0013186/2003-01-01#ArtikelIXA
