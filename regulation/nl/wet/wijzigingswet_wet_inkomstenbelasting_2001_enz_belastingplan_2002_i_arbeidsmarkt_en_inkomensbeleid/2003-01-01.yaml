preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het kader van het fiscale beleid voor het jaar 2002 wenselijk is
    maatregelen te treffen inzake het arbeidsmarktbeleid, de bestrijding van de armoedeval alsmede het beloningsbeleid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0013186/2003-01-01#ArtikelAanhef
articles:
  - number: VI
    text: |-
      Voor het kalenderjaar 2002 worden voor de toepassing van
      [artikel 6.24, tweede lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref1] bij ministeriële regeling regels
      gesteld inzake welke gegevens van het kalenderjaar 2000 in aanmerking moeten worden genomen voor de toepassing van
      genoemd [artikel 6.24, tweede lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6.24
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6.24
    url: https://wetten.overheid.nl/BWBR0013186/2003-01-01#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6.24'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '6.24'
  - number: VIA
    text: |-
      De in [artikel 8.21, eerste en tweede lid, van de Wet inkomstenbelasting 2001][ref1] bedoelde toetrederskorting
      geldt niet voor de belastingplichtige die vóór 1 juli 2001 reeds voldeed aan de in die leden omschreven
      voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.21
    url: https://wetten.overheid.nl/BWBR0013186/2003-01-01#ArtikelVIA
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8.21'
  - number: VII
    text: |-
      Voor het kalenderjaar 2002 wordt in afwijking van [artikel 8.11 van de Wet inkomstenbelasting 2001][ref1] de tekst
      van het derde lid van dat artikel als volgt gelezen:

      3. In afwijking van het tweede lid wordt:

      a. ingeval de belastingplichtige bij het begin van het kalenderjaar de leeftijd van 57 jaar heeft bereikt maar
      nog niet de leeftijd van 60, het percentage, bedoeld in het tweede lid, tweede volzin, onderdeel b, vervangen door
      12,834% en het bedrag, bedoeld in het tweede lid, derde volzin, vervangen door € 1119;

      b. ingeval de belastingplichtige bij het begin van het kalenderjaar de leeftijd van 60 jaar heeft bereikt maar
      nog niet de leeftijd van 62, het percentage, bedoeld in het tweede lid, tweede volzin, onderdeel b, vervangen door
      15,046% en het bedrag, bedoeld in het tweede lid, derde volzin, vervangen door € 1289;

      c. ingeval de belastingplichtige bij het begin van het kalenderjaar de leeftijd van 62 jaar heeft bereikt, het
      percentage, bedoeld in het tweede lid, tweede volzin, onderdeel b, vervangen door 17,272% en het bedrag, bedoeld in
      het tweede lid, derde volzin, vervangen door € 1460.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.11
    url: https://wetten.overheid.nl/BWBR0013186/2003-01-01#ArtikelVII
