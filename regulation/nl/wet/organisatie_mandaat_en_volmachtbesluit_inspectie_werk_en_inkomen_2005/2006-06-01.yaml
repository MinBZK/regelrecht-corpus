  - number: '19'
    text: |-
      De afdeling Juridische Zaken is ten behoeve van de gehele Inspectie verantwoordelijk voor:

      a. de juridische ondersteuning bij de ontwikkeling en uitvoering van het toezicht;

      b. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      c. de coördinatie en uitvoering van de toezichtbaarheidstoetsen, bedoeld in [artikel 41 van de wet][ref1];

      d. het beheren en onderhouden van een wettendocumentatiesysteem en de verzorging van interne kennisoverdracht;

      e. het fungeren als coördinatie- en aanspreekpunt voor de inspectie inzake juridische aangelegenheden;

      f. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie;

      g. de inbreng van juridische expertise ten behoeve van de bedrijfsvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel41
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '41'
  - number: '20'
    text: |-
      Het hoofd van de afdeling Toezicht IB/BKWI is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door het IB en het BKWI;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door het IB en het
      BKWI;

      c. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      d. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel20
  - number: '21'
    text: |-
      De afdeling Toezicht overige bestuursorganen is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van wettelijke taken door de RWI;

      b. het houden van toezicht op de SER, DNB, het CTB en cki’s, voor zover dit toezicht is opgedragen aan de Minister;

      c. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door de RWI, de SER,
      DNB, het CTB en cki’s;

      d. het uitvoeren van onderzoek naar instellingen die de Minister om een aanwijzing tot cki op een werkveld hebben
      verzocht;

      e. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      f. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel21
  - number: '22'
    text: |-
      1 De directie Toezicht zelfstandige bestuursorganen is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door de CWI, de SVB en het UWV;

      b. het rapporteren over de resultaten en de kwaliteit van de uitvoering en over mogelijke risico’s voor de
      kwaliteit van de uitvoering en de uitvoeringsorganisaties, genoemd in onderdeel a;

      c. de inbreng van onderzoeksexpertise voor zowel domeinbepaald als domeinoverstijgend toezicht;

      d. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming door het ministerie;

      e. het relatiebeheer met de instanties, genoemd in onderdeel a;

      f. het binnen de gekozen aansturingslijnen opzetten en uitvoeren van gedragswetenschappelijk onderzoek voor zowel
      domeinbepaalde als domeinoverstijgende onderwerpen.

      2 Onder de directeur Toezicht zelfstandige bestuursorganen ressorteren:

      a. de afdeling Onderzoek;

      b. de afdeling Toezicht CWI;

      c. de afdeling Toezicht SVB;

      d. de afdeling Toezicht UWV.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel22
  - number: '23'
    text: |-
      De afdeling Onderzoek is ten behoeve van de gehele inspectie verantwoordelijk voor:

      a. het ontwikkelen en uitvoeren van gedragswetenschappelijk onderzoek naar de uitvoering door de uitvoerende
      instanties;

      b. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      c. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel23
  - number: '24'
    text: |-
      De afdeling Toezicht CWI is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door de CWI;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door de CWI;

      c. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      d. de coördinatie en afstemming binnen de Inspectie aangaande het toezicht op de samenwerking, bedoeld in
      [artikel 37, onderdeel c, van de wet][ref1], van de CWI, het UWV en de SVB met elkaar en met burgemeesters en
      wethouders van de gemeenten;

      e. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel37
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '37'
  - number: '25'
    text: |-
      De afdeling toezicht SVB is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door de SVB;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door de SVB;

      c. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      d. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel25
  - number: '26'
    text: |-
      De afdeling Toezicht UWV is verantwoordelijk voor:

      a. het houden van toezicht op de uitvoering van de wettelijke taken door het UWV;

      b. het rapporteren over de resultaten en kwaliteit van de uitvoering van de wettelijke taken door het UWV;

      c. het bijdragen aan rapportages over de uitvoering op het beleidsterrein werk en inkomen;

      d. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming van het ministerie.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel26
  - number: '27'
    text: |-
      1 De algemeen directeur is bevoegd om namens een bewindspersoon dan wel de inspecteur-generaal besluiten te
      nemen, overeenkomsten aan te gaan en handelingen te verrichten, die noch een besluit, noch een privaatrechtelijke
      rechtshandeling zijn, voor zover zij verband houden met het werkterrein van de Inspectie, tenzij deze zijn
      voorbehouden aan een bewindspersoon, de secretaris-generaal, de plaatsvervangend secretaris-generaal of de
      inspecteur-generaal.

      2 De bevoegdheden van de algemeen directeur, bedoeld in het eerste lid, omvatten in elk geval mandaat en machtiging
      ten aanzien van:

      a. de in [artikel 5, onderdelen d en e][ref1], genoemde personeelsaangelegenheden;

      b. de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref2] voor zover deze
      betrekking hebben op gedragingen van de onder hem ressorterende functionarissen.

      3 De in het eerste lid genoemde bevoegdheid om overeenkomsten aan te gaan is beperkt tot overeenkomsten met een
      waarde van € 20.000,– per overeenkomst, met dien verstande dat de volgende overeenkomsten mogen worden aangegaan
      tot een waarde van € 500.000,– per overeenkomst:

      a. overeenkomsten die voortvloeien uit het door de inspecteur-generaal vastgestelde jaarplan;

      b. overeenkomsten voor het opleiden van de medewerkers van de Inspectie, voor zover deze voortvloeien uit een door
      de algemeen directeur vastgesteld opleidingsplan;

      c. overeenkomsten voor het inhuren van personeel voor de uitvoering van werkzaamheden die onder de directe
      verantwoordelijkheid van het management van de inspectie worden verricht;

      d. arbeidsovereenkomsten naar burgerlijk recht;

      e. overeenkomsten met betrekking tot onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018588#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel91
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel27
