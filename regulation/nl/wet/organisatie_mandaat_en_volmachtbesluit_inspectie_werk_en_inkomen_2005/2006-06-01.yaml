  - number: '28'
    text: |-
      1 Elk van de directeuren is bevoegd om namens een bewindspersoon dan wel de inspecteur-generaal besluiten te
      nemen, overeenkomsten aan te gaan en handelingen te verrichten die noch een besluit, noch een privaatrechtelijke
      rechtshandeling zijn, voor zover zij verband houden met het werkterrein van zijn directie, tenzij deze zijn
      voorbehouden aan een bewindspersoon, de secretaris-generaal, de plaatsvervangend secretaris-generaal, de
      inspecteur-generaal of de algemeen directeur.

      2 De bevoegdheden van de directeuren, bedoeld in het eerste lid, omvatten in elk geval mandaat en machtiging ten
      aanzien van:

      a. de specifieke taken van de directie, met uitzondering van stukken waarvan, gelet op het belang daarvan,
      redelijkerwijze kan worden vermoed dat deze door de algemeen directeur moeten worden afgedaan;

      b. de in [artikel 5, onderdeel d][ref1], genoemde personeelsaangelegenheden;

      c. de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref2] voor zover deze
      betrekking hebben op gedragingen van de onder elk van hen ressorterende functionarissen.

      3 De in het eerste lid genoemde bevoegdheid om overeenkomsten aan te gaan is beperkt tot overeenkomsten met
      een waarde van € 20.000,– per overeenkomst, met dien verstande dat de volgende overeenkomsten mogen worden
      aangegaan tot een waarde per overeenkomst van ten hoogste de laagste drempel voor aanbesteding conform de Europese
      aanbestedingsrichtlijnen:

      a. overeenkomsten die voortvloeien uit het door de algemeen directeur vastgestelde directieplan;

      b. overeenkomsten voor het opleiden van de medewerkers van de directie, voor zover deze voortvloeien uit een door
      de algemeen directeur vastgesteld opleidingsplan;

      c. overeenkomsten voor het inhuren van personeel voor de uitvoering van werkzaamheden die onder de directe
      verantwoordelijkheid van het management van de inspectie worden verricht;

      d. arbeidsovereenkomsten naar burgerlijk recht;

      e. overeenkomsten met betrekking tot onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018588#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel91
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel28
