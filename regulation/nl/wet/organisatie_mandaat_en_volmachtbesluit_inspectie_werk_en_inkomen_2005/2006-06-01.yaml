  - number: '6'
    text: |-
      Elk van de directeuren is verantwoordelijk voor:

      a. het leiding geven aan de eigen directie;

      b. het coördineren van het toezicht op de uitvoering van de sociale verzekeringen en voorzieningen, en op de
      werking van het stelsel daarvan, en van andere taken, bedoeld in [artikel 39, tweede lid, van de wet][ref1], in
      samenspraak met de andere directeuren;

      c. het door tussenkomst van de algemeen directeur en de inspecteur-generaal adviseren van bewindspersonen ten
      aanzien van het werkterrein van de eigen directie en het hen attenderen op politiek of maatschappelijk gevoelige
      aspecten daarvan;

      d. het zorgdragen voor een effectieve en efficiënte bedrijfsvoering, binnen door de inspecteur-generaal
      vastgestelde kaders, voor periodieke evaluatie daarvan en voor planning en bewaking van de productie van de eigen
      directie;

      e. de personeelsaangelegenheden, met inbegrip van het arbeidsomstandigheden- en ziekteverzuimbeleid, van de onder
      elk van hen ressorterende functionarissen, voorzover dit niet is voorbehouden aan de secretaris-generaal, of de
      inspecteur-generaal, of de algemeen directeur;

      f. het op orde hebben van de administratieve organisatie en informatiebeveiliging;

      g. het voorbereiden van jaarplannen voor de eigen directie binnen de door de inspecteur-generaal vastgestelde
      uitgangspunten;

      h. het uitvoeren van het door de algemeen directeur vastgestelde jaarplan voor de eigen directie;

      i. het vaststellen van jaarplannen van de afdelingen binnen de eigen directie;

      j. het afleggen van verantwoording en het rapporteren over de uitvoering van het jaarplan van de eigen directie aan
      de algemeen directeur;

      k. de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref2] voor zover deze
      betrekking hebben op gedragingen van de onder hen ressorterende functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel91
