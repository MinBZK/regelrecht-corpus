  - number: '7'
    text: |-
      Het hoofd van het Bureau Bedrijfsvoering is verantwoordelijk voor de volgende algemene taken:

      a. het leiding geven aan het Bureau Bedrijfsvoering;

      b. het leveren van een bijdrage aan het opstellen en uitvoeren van het jaarplan en meerjarenplan van de Inspectie;

      c. het voorbereiden van het jaarplan voor het Bureau Bedrijfsvoering binnen de door de inspecteur-generaal
      vastgestelde uitgangspunten;

      d. het uitvoeren van het door de algemeen directeur vastgestelde jaarplan voor het Bureau Bedrijfsvoering;

      e. het afleggen van verantwoording en het rapporteren over de uitvoering van het jaarplan van het Bureau
      Bedrijfsvoering aan de algemeen directeur;

      f. het doen van voorstellen met betrekking tot het aantrekken en ontslaan van personeel.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel7
  - number: '8'
    text: |-
      1 Elk van de hoofden van een afdeling is verantwoordelijk voor de volgende algemene taken:

      a. het leiding geven aan de eigen afdeling;

      b. het leveren van een bijdrage aan het opstellen en uitvoeren van het jaarplan en meerjarenplan van de Inspectie
      en van het directieplan;

      c. het voorbereiden van jaarplannen voor de eigen afdeling binnen de door de inspecteur-generaal vastgestelde
      uitgangspunten;

      d. het uitvoeren van het door de directeur vastgestelde jaarplan voor de eigen afdeling;

      e. het afleggen van verantwoording en het rapporteren over de uitvoering van het jaarplan van de eigen afdeling aan
      de directeur;

      f. het doen van voorstellen met betrekking tot het aantrekken en ontslaan van personeel.

      2 In afwijking van het eerste lid geldt voor de hoofden van de afdelingen Communicatie, Informatiebeheer &
      Informatisering en Strategie & Beleid dat het jaarplan van ieder van deze afdelingen wordt vastgesteld door de
      algemeen directeur en verantwoording wordt afgelegd aan de algemeen directeur.

      3 In afwijking van het eerste lid geldt voor het hoofd van de afdeling Facilitymanagement dat hij geen jaarplan
      voor de eigen afdeling opstelt, maar bijdragen levert voor het jaarplan van het Bureau Bedrijfsvoering, en
      verantwoording aflegt aan het hoofd van het Bureau Bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel8
  - number: '9'
    text: |-
      De afdeling Communicatie is verantwoordelijk voor:

      a. het ontwikkelen en verzorgen van de in- en externe communicatie, met inbegrip van persvoorlichting;

      b. de afstemming van de externe communicatie met de directie Communicatie van het ministerie.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel9
  - number: '10'
    text: |-
      De afdeling Informatiebeheer & Informatisering is verantwoordelijk voor:

      a. de systeemontwikkeling;

      b. de helpdesk;

      c. de data-acquisitie en het gegevensbeheer;

      d. beleidsontwikkeling met betrekking tot informatievoorziening en informatisering en het opstellen van
      informatiseringsplannen.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel10
  - number: '11'
    text: |-
      De afdeling Strategie & Beleid is verantwoordelijk voor:

      a. de strategie- en beleidsontwikkeling op het terrein van de inspectie;

      b. de totstandkoming van de programmering en van de planning- en controlcyclus van de toezichtactiviteiten van de
      Inspectie, alsmede de uitvoering daarvan;

      c. de deskundigheidsbevordering, waaronder het opstellen van een opleidingsplan in afstemming met de afdeling
      Personeel & Financiën;

      d. het kwaliteitsmanagement;

      e. het relatiebeheer van de Inspectie.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel11
  - number: '12'
    text: |-
      1 Het Bureau Bedrijfsvoering is verantwoordelijk voor:

      a. de planning- en controlcyclus op gebied van middelenbeheer, met name op financieel en HRM-gebied;

      b. de advisering over en ondersteuning bij de uitvoering van het middelenbeheer;

      c. het voeren van de controlfunctie;

      d. de ontwikkeling, verzorging en uitvoering van financieel beleid, HRM-beleid en facilitymanagementbeleid;

      e. het beheer van administratieve systemen;

      f. de verzorging van administraties;

      g. de verzorging van de administratieve en financiële afhandeling van de uitvoering van de
      personeelsaangelegenheden van de Inspectie, voor zover deze niet is opgedragen aan anderen zoals de directie
      Personeel, Organisatie en Informatie, de directie Financieel-Economische Zaken, de directie Gemeenschappelijke
      Organisatie Bedrijfsvoering van het ministerie en de Stichting Pensioenfonds ABP;

      h. de verzorging van het ambtelijk secretariaat van de ondernemingsraad.

      2 Onder het hoofd van het Bureau Bedrijfsvoering ressorteren:

      a. de afdeling Facilitymanagement;

      b. de afdeling Documentaire Informatievoorziening;

      c. de afdeling Personeel & Financiën.

      3 Het hoofd van het Bureau Bedrijfsvoering geeft rechtstreeks leiding aan de afdeling Documentaire
      Informatievoorziening en de afdeling Personeel & Financiën.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel12
  - number: '13'
    text: |-
      De afdeling Facilitymanagement is verantwoordelijk voor:

      a. de advisering over en ontwikkeling van beleid en plannen met betrekking tot algemene facilitaire voorzieningen;

      b. de verzorging van de huisvesting van de inspectie en overige facilitaire voorzieningen en het daaraan verbonden
      budget- en overig beheer.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel13
  - number: '14'
    text: |-
      De afdeling Documentaire Informatievoorziening is verantwoordelijk voor:

      a. het adviseren van het management ten aanzien van vraagstukken op het gebied van documentaire
      informatievoorziening en bij de ontwikkeling, uitbouw en implementatie van eigentijdse toepassingen op het
      vakgebied;

      b. het bevorderen van de toegankelijkheid, vindbaarheid en benaderbaarheid van kwalitatieve informatie in fysieke
      en digitale vorm door middel van eigentijdse toepassingen ten behoeve van het verwerven, opslaan, ontsluiten en ter
      beschikking stellen van kwalitatieve informatie;

      c. het verlenen van gebruiksondersteuning.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel14
  - number: '15'
    text: |-
      De afdeling Personeel & Financiën is verantwoordelijk voor:

      a. de advisering over en ontwikkeling van beleid en plannen over besteding van middelen ten aanzien van personeel
      en financiën van de Inspectie;

      b. de levering van managementinformatie over de besteding van middelen, bedoeld in onderdeel a;

      c. het verzorgen van de planning- en controlfunctie en de daarbij behorende administraties en producten;

      d. uitvoerende werkzaamheden op het gebied van personeels- en salarisadministratie.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel15
  - number: '16'
    text: |-
      1 De directie Toezicht gemeenten en overige bestuursorganenis verantwoordelijk voor:

      a. het houden van toezicht op de rechtmatigheid van de uitvoering door gemeenten van de [WWB][ref1], het Bbz, de
      [IOAW][ref2], de [IOAZ][ref3], de [Wko][ref4], de WSW en de [Wwik][ref5];

      b. het houden van toezicht op de doeltreffendheid van (de uitvoering door gemeenten van) de wet- en regelgeving,
      genoemd in onderdeel a;

      c. het houden van toezicht op de uitvoering van wettelijke taken door het BKWI en het IB;

      d. het houden van toezicht op de uitvoering van wettelijke taken door de RWI;

      e. het houden van toezicht op de SER, DNB, het CTB en cki’s, voor zover dit toezicht is opgedragen aan de Minister;

      f. het uitvoeren van onderzoek naar instellingen die de Minister om een aanwijzing tot cki op een werkveld hebben
      verzocht;

      g. het rapporteren over de resultaten en kwaliteit van de uitvoering, genoemd in de onderdelen a, b en c, en over
      de uitkomsten van het toezicht, bedoeld in de onderdelen d en e;

      h. het opstellen van een oordeel over mogelijke risico’s voor de kwaliteit van de uitvoering;

      i. het coördineren en uitvoeren van toezichtbaarheidstoetsen;

      j. het geven van juridische en wetstechnische ondersteuning aan de ontwikkeling en uitvoering van de
      toezichtsfunctie door alle afdelingen van de Inspectie;

      k. het fungeren als coördinatie- en aanspreekpunt voor de Inspectie inzake juridische aangelegenheden;

      l. de inbreng van juridische expertise ten behoeve van de bedrijfsvoering van de Inspectie;

      m. het inbrengen van kennis van de uitvoeringspraktijk in de beleidsvorming door het ministerie;

      n. het relatiebeheer met de uitvoerende instanties binnen het gemeentelijk domein en hun vertegenwoordigende
      organisaties, en met de instanties, genoemd in de onderdelen c tot en met f.

      2 Onder de directeur Toezicht gemeenten en overige bestuursorganen ressorteren:

      a. de afdeling Beleid, Informatie en Analyse;

      b. de afdeling Noord;

      c. de afdeling Zuid;

      d. de afdeling Juridische Zaken;

      e. de afdeling Toezicht BKWI en IB;

      f. de afdeling Toezicht overige bestuursorganen.


