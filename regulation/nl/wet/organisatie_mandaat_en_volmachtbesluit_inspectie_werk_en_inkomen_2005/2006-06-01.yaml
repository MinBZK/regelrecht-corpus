  - number: '29'
    text: |-
      Aan de afdelingshoofden en het hoofd van het bureau Bedrijfsvoering wordt mandaat en machtiging verleend tot het
      nemen van besluiten over en het ondertekenen van stukken die betrekking hebben op:

      a. de specifieke taken van de afdeling respectievelijk het bureau, met uitzondering van de stukken waarvan, gelet
      op het belang daarvan, redelijkerwijze kan worden vermoed dat deze door de directeur respectievelijk de algemeen
      directeur moeten worden afgedaan;

      b. de personeelsaangelegenheden van de afdeling respectievelijk het bureau, voorzover het betreft:

      1°. het opmaken, niet zijnde vaststellen, van een beoordeling van medewerkers;

      2°. het houden van management-medewerkergesprekken;

      3°. werktijdafspraken met of verlof van medewerkers;

      4°. kleine beloningen, niet zijnde gratificaties, onder gelijktijdige mededeling daarvan aan de directeur
      respectievelijk de algemeen directeur.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel29
  - number: '30'
    text: |-
      Aan het hoofd van de afdeling Communicatie wordt volmacht verleend tot het aangaan van overeenkomsten met een
      waarde van maximaal van € 10.000,– per overeenkomst en voor zover deze betrekking hebben op:

      a. de productie en distributie van voorlichtingsmateriaal, gericht op de communicatie van toezichtsbevindingen;

      b. systeemontwikkeling, licenties en functioneel beheer en onderhoud van applicaties van voorlichtingssystemen.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel30
  - number: '31'
    text: |-
      Aan het hoofd van het Bureau Bedrijfsvoering wordt volmacht verleend tot het aangaan van overeenkomsten met een
      waarde van maximaal € 50.000,– per overeenkomst en voor zover deze betrekking hebben op:

      a. de levering van goederen en diensten ten behoeve van de Inspectie;

      b. de tewerkstelling van uitzendkrachten ten behoeve van de Inspectie, binnen de formatie van de Inspectie;

      c. de verzorging van huisvesting van de inspectie en het daaraan verbonden beheer.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel31
  - number: '32'
    text: |-
      Aan het hoofd van de afdeling Facilitymanagement wordt volmacht verleend tot het aangaan van overeenkomsten voor
      verzorging van huisvesting van de inspectie en het daaraan verbonden beheer tot een maximum van € 25.000,– per
      overeenkomst.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel32
  - number: '33'
    text: |-
      1 De afdoening van alle stukken waarvan de inspecteur-generaal aangeeft dat hij deze zelf wenst af te doen,
      geschiedt door de inspecteur-generaal.

      2 Rapporten die worden toegezonden aan de minister, worden vastgesteld door de inspecteur-generaal.

      3 Brieven, gericht aan een bewindspersoon, worden vastgesteld en ondertekend door de inspecteur-generaal.

      4 De vertegenwoordigingsbevoegde is gehouden in de ondertekening van stukken die op basis van mandaat, volmacht of
      machtiging worden ondertekend, zijn vertegenwoordigingsbevoegdheid tot uitdrukking te brengen door opneming van de
      volgende formule:

      De inspecteur-generaal van de Inspectie Werk en Inkomen,

      namens deze,

      functie betrokken vertegenwoordigingsbevoegde,

      handtekening van de betrokken vertegenwoordigingsbevoegde,

      naam van de betrokken vertegenwoordigingsbevoegde.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel33
  - number: '34'
    text: |-
      Bij afwezigheid of verhindering van zowel de inspecteur-generaal als de plaatsvervangend inspecteur-generaal neemt,
      voor de duur van die afwezigheid of verhindering, de algemeen directeur, als waarnemend inspecteur-generaal, de
      taken en bevoegdheden van de inspecteur-generaal waar.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel34
  - number: '35'
    text: |-
      1 Bij afwezigheid of verhindering van de algemeen directeur in de periode van 1 januari tot en met 30 juni neemt,
      voor de duur van die afwezigheid of verhindering, de directeur Toezicht gemeenten en overige bestuursorganen, als
      plaatsvervangend algemeen directeur, de taken en bevoegdheden van de algemeen directeur waar.

      2 Bij afwezigheid of verhindering van de algemeen directeur in de periode van 1 juli tot en met 31 december
      neemt, voor de duur van die afwezigheid of verhindering, de directeur Toezicht zelfstandige bestuursorganen, als
      plaatsvervangend algemeen directeur, de taken en bevoegdheden van de algemeen directeur waar.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel35
  - number: '36'
    text: |-
      Plaatsvervangers worden, na schriftelijke instemming van de inspecteur-generaal, benoemd door de directeur, het
      afdelingshoofd of het bureauhoofd in wiens plaats zij treden.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel36
  - number: '37'
    text: |-
      Besluiten tot aanwijzing van plaatsvervangers worden door de algemeen directeur toegezonden aan de
      directeur Wetgeving, Bestuurlijke en Juridische Aangelegenheden als beheerder van het mandaat-, volmacht- en
      machtigingsregister SZW.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel37
  - number: '38'
    text: |-
      Het [Organisatie-, mandaat- en volmachtbesluit Inspectie Werk en Inkomen 2004][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0016800
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0016800
  - number: '39'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, en werkt terug tot en met 1 januari 2005.

      2 Deze regeling wordt aangehaald als: Organisatie-, mandaat- en volmachtbesluit Inspectie Werk en Inkomen 2005.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel39
