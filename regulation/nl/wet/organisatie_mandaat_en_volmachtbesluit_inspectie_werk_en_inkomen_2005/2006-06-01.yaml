  - number: '2'
    text: Onder de inspecteur-generaal ressorteert de plaatsvervangend inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel2
  - number: '3'
    text: |-
      1 Onder de inspecteur-generaal ressorteert de algemeen directeur.

      2 Onder de algemeen directeur ressorteren:

      a. de afdeling Communicatie;

      b. de afdeling Informatiebeheer & Informatisering;

      c. de afdeling Strategie & Beleid;

      d. het Bureau Bedrijfsvoering;

      e. de directie Toezicht gemeenten en overige bestuursorganen;

      f. de directie Toezicht zelfstandige bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel3
  - number: '4'
    text: |-
      De plaatsvervangend inspecteur-generaal vervangt de inspecteur-generaal bij diens afwezigheid of verhindering en
      treedt alsdan in de verantwoordelijkheden en bevoegdheden van de inspecteur-generaal.
    url: https://wetten.overheid.nl/BWBR0018588/2006-06-01#Artikel4
  - number: '5'
    text: |-
      De algemeen directeur is verantwoordelijk voor:

      a. het door tussenkomst van de inspecteur-generaal adviseren van de bewindspersonen ten aanzien van het werkterrein
      van de Inspectie en het hen attenderen op politiek of maatschappelijk gevoelige aspecten;

      b. het coördineren van het toezicht op de uitvoering van de sociale verzekeringen en voorzieningen, en op de
      werking van het stelsel daarvan, en van andere taken, bedoeld in [artikel 39, tweede lid, van de wet][ref1];

      c. het zorgdragen voor een betrouwbare, effectieve en efficiënte bedrijfsvoering, met uitzondering van de
      vaststelling van de formatie, binnen door de inspecteur-generaal vastgestelde kaders, voor periodieke evaluatie
      daarvan en voor planning en bewaking van de productie van de Inspectie;

      d. de personeelsaangelegenheden, met inbegrip van het arbeidsomstandigheden- en ziekteverzuimbeleid, van de onder
      hem ressorterende functionarissen, voorzover dit niet is voorbehouden aan de secretaris-generaal of de inspecteur-
      generaal;

      e. de personeelsaangelegenheden van functionarissen die niet meer onder hem ressorteren en ten aanzien van wie geen
      andere functionaris binnen het ministerie (meer) kan worden aangewezen, maar die op 31 december 2002 of later onder
      de inspecteur-generaal ressorteerden;

      f. de werkgeversverplichtingen die voortvloeien uit wet- en regelgeving op het gebied van arbeidsomstandigheden ten
      aanzien van de inspectie, voor zover het niet gaat om centraal georganiseerde werkgeversverplichtingen als bedoeld
      in [artikel 6, vijfde lid, onder b, van het Organisatie-, mandaat- en volmachtbesluit SZW 2004][ref2];

      g. het op orde hebben van de administratieve organisatie en informatiebeveiliging;

      h. de strategie en de beleidsontwikkeling van de Inspectie binnen de door de inspecteur-generaal vastgestelde
      uitgangspunten;

      i. het voorbereiden en uitvoeren van jaarplannen en meerjarenplannen voor de Inspectie binnen de door de
      inspecteur-generaal vastgestelde uitgangspunten;

      j. het vaststellen van de jaarplannen van de directies;

      k. het vaststellen van de jaarplannen van het Bureau Bedrijfsvoering, de afdeling Communicatie en de afdeling
      Strategie & Beleid na overleg met de inspecteur-generaal;

      l. de deskundigheidsbevordering en het kwaliteitsmanagement bij de Inspectie;

      m. het vaststellen van het opleidingsplan IWI na overleg met de inspecteur-generaal;

      n. het informatiebeleid en de informatisering van toezichtprocessen en ondersteunende processen;

      o. het vergaren en gestructureerd beschikbaar stellen van reguliere, kwantitatieve gegevensstromen
      (toezichtinformatie) ten behoeve van de toezichtprocessen;

      p. het afleggen van verantwoording en het rapporteren aan de inspecteur-generaal over de uitvoering van het
      jaarplan en het meerjarenplan van de Inspectie en de jaarplannen van de directies;

      q. de behandeling van klachten als bedoeld in [artikel 9:1 van de Algemene wet bestuursrecht][ref3] voor zover deze
      betrekking hebben op gedragingen van de onder hem ressorterende functionarissen;

      r. het inzake de Inspectie optreden als bestuurder in de zin van
      [artikel 1 van de Wet op de ondernemingsraden][ref4].


