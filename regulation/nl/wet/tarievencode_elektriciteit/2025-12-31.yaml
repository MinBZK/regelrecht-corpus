      - id: ref3
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.8.1
    text: |-
      De transportonafhankelijke kosten worden toegerekend aan de in [3.7.1][ref1] genoemde tariefcategorieën naar de
      mate waarin zij in een tariefcategorie zijn veroorzaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.8.1
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.8.2
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.8.2
  - number: 3.8.3
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.8.3
  - number: 3.8.4
    text: |-
      Vanaf 1 januari 2005 zijn per tariefcategorie de transportonafhankelijke tarieven van alle netbeheerders aan elkaar
      gelijk.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.8.4
  - number: 3.9.1
    text: |-
      Voor verbruikers geldt een blindenergietarief indien de uitgewisselde blindenergie zoals bedoeld in [artikel
      2.27 van de Netcode elektriciteit](onbekend), uitgaat boven de bij de arbeidsfactor van 0,85 (inductief) of 1.0
      (capacitief) behorende hoeveelheid. Als tariefdrager geldt de kvarh.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.9.1
  - number: 3.9.2
    text: 'Voor het blindenergietarief voor verbruikers worden twee tariefcategorieën gehanteerd:'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.9.2
  - number: 3.9.2.a
    text: verbruikers aangesloten op een spanningsniveau van MS en hoger
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.9.2
  - number: 3.9.2.b
    text: verbruikers aangesloten op een spanningsniveau lager dan MS.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.9.2
  - number: 3.9.3
    text: 'Voor productie-eenheden aangesloten op:'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.9.3
  - number: 3.9.3.a
    text: |-
      netten met een spanningsniveau van 1 kV en lager geldt een blindenergietarief met als tariefdrager kvarh indien
      de met het net uitgewisselde blindenergie uitgaat boven de in [artikel 3.6 van de Netcode elektriciteit](onbekend)
      genoemde grenzen.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.9.3
  - number: 3.9.3.b
    text: |-
      netten met een spanningsniveau van 1 kV tot 110 kV geldt een blindenergietarief met als tariefdrager kvarh
      indien de met het net uitgewisselde blindenergie uitgaat boven de in [artikel 3.15, eerste lid, van de Netcode
      elektriciteit](onbekend) genoemde grenzen. Voor zover de betreffende blindenergie op verzoek van de netbeheerder is
      uitgewisseld, geldt het tarief niet.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.9.3
  - number: 3.9.4
    text: |-
      Voor de verrekening van de tussen netten onderling uitgewisselde blindenergie stellen de gezamenlijke netbeheerders
      een regeling vast die op een door hen te bepalen tijdstip in werking treedt.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.9.4
  - number: 3.10.1
    text: |-
      De kostentoerekening en de vaststelling van de waarden van de tariefdragers vinden plaats op basis van gemeten
      waarden, waarbij de eisen die in de [Meetcode elektriciteit](onbekend) zijn neergelegd in acht worden genomen.
      Uitgezonderd worden de waarden van de tariefdrager voor aangeslotenen in de tariefcategorieën genoemd in
      [3.7.1 onder f][ref1] met een aansluiting met een doorlaatwaarde kleiner dan of gelijk aan 3x80A en g. Deze waarden
      worden bepaald volgens [3.7.13a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.10.1
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.10.2
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.10.2
  - number: 3.10.3
    text: |-
      Over de in [hoofdstuk 13 van de Netcode elektriciteit](onbekend) bedoelde gegevensuitwisseling tussen aangeslotenen
      en de netbeheerders is geen vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.10.3
  - number: 5.1.1
    text: |-
      Indien regionale netbeheerders door faillissement van een leverancier als gevolg van toepassing van het
      leveranciersmodel, zoals bedoeld in [artikel 95cb van de Elektriciteitswet 1998][ref1], tariefinkomsten derven,
      mogen zij deze gederfde inkomsten gezamenlijk met alle kleinverbruikers verrekenen, waarbij elke kleinverbruiker
      een gelijk bedrag in rekening wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel95cb
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel5.1.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 95cb
  - number: 5.1.2
    text: |-
      De in [artikel 5.1.1.][ref1] bedoelde verrekening heeft ten hoogste betrekking op de gederfde tariefinkomsten
      gedurende


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel5
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel5.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.2.a
    text: |-
      drie maanden voorafgaand aan de datum waarop de leverancier in staat van faillissement is verklaard; dit is de
      datum waarop melding wordt gemaakt van het betreffende faillissement in de Nederlandse Staatscourant; of, indien
      dit eerder is, drie maanden voorafgaand aan de datum waarop de beschikking tot intrekking van de vergunning is
      genomen; en
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel5.1.2
  - number: 5.1.2.b
    text: |-
      de periode tussen de datum waarop de vergunninghouder in staat van faillissement is verklaard of, indien dit eerder
      is, de datum waarop de beschikking tot intrekking van de vergunning is genomen, tot de datum waarop de beschikking
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel5.1.2
  - number: 5.1.3
    text: |-
      De te verrekenen gederfde tariefinkomsten bedragen ten hoogste de overeenkomstig
      [paragraaf 8.2 van de Informatiecode elektriciteit en gas][ref1] vastgestelde verplichting over de overeenkomstig
      [artikel 5.1.2][ref2] vastgestelde periode minus de over die periode door regionale netbeheerders van de in
      [artikel 5.1.1][ref3] bedoelde leverancier ontvangen afdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Paragraaf8.2
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0037951#Artikel5
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel5.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037934
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0037951
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.4
    text: |-
      Het moment van de in [artikel 5.1.1][ref1] bedoelde verrekening is twee jaar na het jaar waarin de vergunninghouder
      in staat van faillissement is verklaard. De netbeheerder dient dit verzoek tot correctie voor gederfde
      transporttariefinkomsten te doen met het tariefvoorstel voor het betreffende jaar. Daarbij moet de netbeheerder aan
      de Autoriteit Consument en Markt een overzicht overleggen, voorzien van een goedkeurende accountantsverklaring, van
      de gederfde tariefinkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel5
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel5.1.4
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.5
    text: |-
      Indien een netbeheerder, als bedoeld in [artikel 5.1.1][ref1], gederfde inkomsten verrekent, dient deze
      netbeheerder in het jaar van het einde van het faillissement van de betreffende vergunninghouder een verklaring
      van de curator bij de Autoriteit Consument en Markt te overleggen van de uitkomsten van het faillissement. Het
      einde van een faillissement is de dag waarop het einde van een faillissement wordt gepubliceerd in de Nederlandse
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel5
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel5.1.5
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.1.6
    text: |-
      Inkomsten die de netbeheerder alsnog heeft kunnen verhalen op de failliete boedel worden op gelijke wijze als bij
      de verrekening onder [artikel 5.1.1][ref1] gezamenlijk in mindering gebracht op de tarieven twee jaar na het jaar
      van het einde van het faillissement.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel5
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel5.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 5.2.1
    text: |-
      De Tarievencode Elektriciteit, zoals vastgesteld bij besluit van 30 september 1999 en nadien diverse malen
      gewijzigd, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel5.2.1
  - number: 5.2.2
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel5.2.2
  - number: 5.2.3
    text: 'Dit besluit wordt aangehaald als: Tarievencode elektriciteit.'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel5.2.3
