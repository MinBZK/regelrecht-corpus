  - number: 2.3.4
    text: |-
      [Artikel 2.3.3a][ref1] is van overeenkomstige toepassing op eenmalige werkzaamheden van de netbeheerder ten
      behoeve van het aanpassen van de aansluiting en het realiseren van voorzieningen aan de aansluiting voor het kunnen
      toekennen van secundaire allocatiepunten aan een aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.4
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.1
    text: |-
      Voor de instandhouding van de in [2.3.3a, onderdelen a en b][ref1], en [2.3.3b][ref2] bedoelde aansluitingen
      verricht de netbeheerder de in de tabel in [2.3.5.5][ref3] genoemde (categorieën) werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.1
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.2
    text: |-
      De periodieke vergoeding voor de instandhouding van de in [2.3.3a, onderdelen a en b][ref1] en [2.3.3b][ref2]
      bedoelde aansluitingen wordt door de netbeheerder vastgesteld, waarbij de volgende uitgangspunten in acht worden
      genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.2.a
    text: |-
      Voor de in de tabel in [2.3.5.5][ref1] onder ‘beheer’ genoemde werkzaamheden wordt uitgegaan van de kosten die
      aan het beheer van de in [2.3.3a, onderdelen a en b][ref2], en [2.3.3b][ref3] bedoelde aansluitingen zijn toe
      te rekenen (omslagstelsel). De periodieke aansluitvergoeding wordt initieel vastgesteld op basis van een door de
      netbeheerder vastgesteld percentage van de met de aangeslotenen overeengekomen investeringskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.2.b
    text: |-
      Voor de in de tabel in [2.3.5.5][ref1] onder ‘vervanging’ genoemde werkzaamheden wordt uitgegaan van een vaste
      verhouding tussen de kosten van vervangingen en de met de aangeslotene overeengekomen investeringskosten.
      Deze verhouding is gebaseerd op de door de netbeheerder gehanteerde vervangingstermijnen van de afzonderlijke
      componenten van de aansluiting, waarbij deze vervangingstermijnen zijn gebaseerd op de afschrijvingstermijnen uit
      de op dat moment geldende Regulatorische Accountingregels van de desbetreffende netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.2.c
    text: |-
      Indexering vindt plaats op basis van cpi, tenzij in de aansluit- en transportovereenkomst een andere
      indexeringsregeling is vastgelegd. De indexeringsregeling zorgt ervoor dat de initiële periodieke vergoeding
      voor de in de tabel in [2.3.5.5][ref1] onder ‘beheer’ en ‘vervanging’ genoemde werkzaamheden jaarlijks wordt
      geïndexeerd. Hiertoe wordt de met de aangeslotene overeengekomen investering jaarlijks met de indexering aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.2.d
    text: |-
      Indien tussen de netbeheerder en de aangeslotene instandhouding van de aansluiting zonder vervangingsverplichting
      wordt overeengekomen, wordt de periodieke aansluitvergoeding uitsluitend gebaseerd op de in de tabel in
      [2.3.5.5][ref1] onder ‘beheer’ genoemde werkzaamheden. De kosten voor de in de tabel in 2.3.5.5 onder ‘vervanging’
      genoemde werkzaamheden zullen in dat geval separaat in rekening gebracht worden nadat deze kosten zich hebben
      voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.2.e
    text: |-
      Indien voor een aansluiting in het verleden gekozen is voor instandhouding van de aansluiting zonder
      vervangingsverplichting en de aangeslotene terug wil keren naar instandhouding inclusief vervangingsverplichting,
      komen de netbeheerder en de aangeslotene een terugkeerregeling overeen. Uitgangspunt voor de terugkeerregeling
      is dat het totaal van de reeds betaalde periodieke aansluitvergoeding en het te betalen bedrag bij de
      terugkeerregeling niet hoger is dan wat er voor deze aansluiting betaald zou zijn indien bij het oorspronkelijk
      afsluiten van de aansluit- en transportovereenkomst direct gekozen was voor instandhouding van de aansluiting
      inclusief vervangingsverplichting. Hierbij wordt rekening gehouden met onder meer de reeds in rekening gebrachte
      kosten, de verwachte levensduur van de componenten en de kwaliteit van de componenten.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.2
  - number: 2.3.5.2.f
    text: |-
      Indien voor een aansluiting in het verleden gekozen is voor instandhouding van de aansluiting inclusief
      vervangingsverplichting en de aangeslotene over wil gaan naar instandhouding zonder vervangingsverplichting, wordt
      de periodieke aansluitvergoeding opnieuw vastgesteld overeenkomstig onderdeel d. De nieuw vastgestelde periodieke
      aansluitvergoeding gaat in op de eerste dag van de kalendermaand die volgt op de maand waarin de netbeheerder en
      de aangeslotene instandhouding van de aansluiting zonder vervangingsverplichting overeen zijn gekomen en geldt niet
      met terugwerkende kracht.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.2
  - number: 2.3.5.2.g
    text: |-
      Zonder wijziging van de aansluiting als bedoeld in [artikel 2.4.3][ref1] is een aanpassing van de periodieke
      aansluitvergoeding overeenkomstig hetzij onderdeel e hetzij onderdeel f slechts één maal mogelijk per aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.2
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.3.5.3
    text: |-
      De periodieke aansluitvergoeding van de in [2.3.3a, onderdelen a en b][ref1], en [2.3.3b][ref2] bedoelde
      aansluitingen wordt bij wijziging van de aansluiting opnieuw op basis van vorenbedoelde uitgangspunten vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.3
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.4
    text: |-
      Voor de periodieke aansluitvergoeding voor de instandhouding van de in [2.3.3a, onderdeel c][ref1], bedoelde
      aansluitingen zijn de standaardvergoedingen voor standaardaansluitingen met dezelfde aansluitcapaciteit
      verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.4
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.5
    text: |-
      Tabel: 'standaardofferte initiële vaststelling periodieke aansluitvergoeding:'








