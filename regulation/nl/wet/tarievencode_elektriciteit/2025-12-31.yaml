        paragraaf: '2.3'
  - number: 2.3.5.6
    text: |-
      De in de tabel in [2.3.5.5][ref1] onder ‘beheer’ genoemde omschrijvingen hebben in deze tabel de volgende
      betekenis:


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.6
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.6.a
    text: |-
      Preventief onderhoud: het uitvoeren van periodieke of toestandsafhankelijke inspecties en het herstel van daarbij
      geconstateerde gebreken, waaronder begrepen alle werkzaamheden voor zover niet vallend onder de in de tabel in
      [2.3.5.5][ref1] onder ‘vervanging’ genoemde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.6
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.6.b
    text: |-
      Correctief onderhoud: het opheffen van storingen en werkzaamheden na een storing gericht op het herstellen van de
      functionaliteit van de aansluiting zowel primair als secundair, waaronder begrepen alle werkzaamheden voor zover
      niet vallend onder de in de tabel in [2.3.5.5][ref1] onder ‘vervanging’ genoemde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.6
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.3.5.6.c
    text: |-
      Werkzaamheden op initiatief van derden: wijzigen van bestaande aansluitingen anders dan op verzoek van de
      aangeslotene voor zover de kosten daarvan niet worden gedekt door bijdragen van derden.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.6
  - number: 2.3.5.6.d
    text: |-
      Overige operationele werkzaamheden: werkzaamheden met betrekking tot een bedrijfsvoeringscentrum, instandhouding
      van een storingsdienst en storingsvoorraad, het verrichten van diverse operationele werkzaamheden, het bijhouden
      van documentatie en het verstrekken van informatie over leidingen.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.6
  - number: 2.3.5.7
    text: |-
      De in [2.3.5.2][ref1] en [2.3.5.5][ref2] genoemde percentages betreffen voor alle in [paragraaf 2.3.5][ref3]
      bedoelde aansluitingen van een netbeheerder uniforme percentages. Deze percentages worden periodiek door de
      netbeheerder herijkt. De herijkte percentages gelden vanaf dat moment voor alle in paragraaf 2.3.5 bedoelde
      aansluitingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037951#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.7
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0037951
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.4.1
    text: |-
      Bij het verbreken of aflopen van de aansluit- en transportovereenkomst worden de kosten voor het uitgebruik nemen
      van de aansluiting via een éénmalige bijdrage in rekening gebracht bij de aangeslotene.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.1
  - number: 2.4.2
    text: |-
      Bij het verlengen van de aansluit- en transportovereenkomst hoeven bestaande aansluitingen niet ingrijpend te
      worden aangepast, tenzij wijzigingen noodzakelijk zijn om de netbeheerder in de gelegenheid te stellen zijn
      wettelijke taken uit te voeren.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.2
  - number: 2.4.3
    text: |-
      Bij wijziging van een aansluiting op verzoek van aangeslotenen geldt een tarief gebaseerd op de voorcalculatorische
      projectkosten met betrekking tot een dergelijke wijziging tot een maximum van het aansluittarief dat geldt voor
      de nieuwe aansluiting volgens de tabel genoemd onder [2.3.3c][ref1] plus eventueel de éénmalige bijdrage conform
      [artikel 2.4.1][ref2] voor het verwijderen van de oude aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.3
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.4
    text: |-
      Voor het berekenen van de éénmalige bijdrage voor het uitgebruik nemen van de aansluiting ex [artikel 2.4.1][ref1]
      en voor het berekenen van de voorcalculatorische projectkosten voor het wijzigen van een aansluiting ex
      [artikel 2.4.3][ref2] wordt de wijze, zoals bepaald in artikel 2.3.3a, toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.4
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.5
    text: |-
      In het geval dat op een bestaande aansluiting een nieuwe aansluiting wordt gemaakt, zodat een deel van de
      aansluitkabel in een net verandert, zal de netbeheerder onder de volgende voorwaarden overgaan tot restitutie van
      een deel van het door de “eerstaangeslotene” betaalde éénmalige aansluittarief:
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.5
  - number: 2.4.5.a
    text: |-
      de restitutie heeft slechts betrekking op het tarief dat is betaald voor de meerlengte van de verbinding boven de
      25 meter;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.5
  - number: 2.4.5.b
    text: |-
      de restitutie is van toepassing wanneer de afstand van de nieuwkomer hemelsbreed gemeten naar de aansluitkabel van
      de “eerstaangeslotene” korter is dan de afstand gemeten naar het voormalige net. De afstand wordt gemeten zoals
      bepaald is voor de standaardaansluiting;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.5
  - number: 2.4.5.c
    text: |-
      De restitutieregeling is niet van toepassing op aansluitingen boven de 10 MVA, tijdelijke aansluitingen,
      aansluitingen ouder dan 25 jaar en aansluitingen waarvan de aansluitwerkzaamheden zijn uitbesteed aan derden; en
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.5
  - number: 2.4.5.d
    text: |-
      voor de eerste zeven jaar wordt de restitutie op initiatief van de netbeheerder verstrekt. Na zeven jaar wordt de
      restitutie verstrekt indien de “eerstaangeslotene” hiertoe een schriftelijk, met bewijsstukken ondersteund, verzoek
      bij de netbeheerder indient; en
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.5
  - number: 2.4.5.e
    text: |-
      onder “eerstaangeslotene” wordt iedere aangeslotene verstaan op wiens aansluitkabel een nieuwe aansluiting wordt
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.5
  - number: 2.4.6
    text: |-
      De restitutie genoemd in [artikel 2.4.5][ref1] wordt als volgt berekend. De hoogte van de restitutie wordt bepaald
      door de lengte van het gemeenschappelijke deel van de voormalige aansluitkabel van de “eerstaangeslotene” te
      vermenigvuldigen met het tarief voor de meerlengte van de aansluitkabel dat de “eerstaangeslotene” destijds betaald
      heeft. Deze restitutie wordt toegepast bij elke nieuwe aansluiting waarbij weer een deel van de aansluitkabel
      van de “eerstaangeslotene” verandert in net. Voor aansluitingen groter dan 10 MVA, tijdelijke aansluitingen en
      aansluitingen waarvan de werkzaamheden zijn uitbesteed aan derden zal tussen de netbeheerder en de aangeslotene
      overleg worden gevoerd over de hoogte van restitutie.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.6
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.4.7
    text: |-
      Indien de bestaande en de nieuwe aansluiting, zoals bedoeld in [artikel 2.4.5][ref1], betrekking hebben op
      hetzelfde WOZ-object, zijn artikelen 2.4.5 en [2.4.6][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.4.7
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 3.1.3
    text: |-
      Voor het leveren van de transportdienst wordt het transportonafhankelijk transporttarief en het
      transportafhankelijk transporttarief in rekening gebracht per aansluiting van een aangeslotene die elektriciteit
      ontvangt. Voor aansluitingen bestaande uit meer verbindingen geldt dat deze verbindingen voor het transporttarief
      als één aansluiting beschouwd worden voor zover de verbindingen in één en dezelfde tariefcategorie vallen
      en de netaansluitpunten van deze verbindingen liggen in delen van het net van de netbeheerder die in de
      normale bedrijfstoestand galvanisch met elkaar verbonden zijn. Indien door deze sommatie het gecontracteerd
      transportvermogen voor afname uitgaat boven de grenzen van de betreffende tariefcategorie volgens [3.7.2][ref1],
      dan blijft toch de tariefcategorie, waarin de afzonderlijke verbindingen vallen, gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.1.3
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.1.3a
    text: |-
      In afwijking van [artikel 3.1.3][ref1] geldt dat, indien sprake is van een groepstransportovereenkomst het
      transportonafhankelijk transporttarief en het transportafhankelijk transporttarief in rekening worden gebracht
      per groep, waarbij het transportonafhankelijk transporttarief bestaat uit de som van de transportonafhankelijke
      transporttarieven behorende bij de tariefcategorieën die overeenkomen met de netvlakken waarmee de individuele aan
      de groep deelnemende aansluitingen zijn verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.1.3a
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.2.1
    text: |-
      Het transporttarief dient ter dekking van de kosten van de door de netbeheerder beheerde infrastructuur voorzover
      deze kosten geen deel uitmaken van de aansluitkosten.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.1
  - number: 3.2.2
    text: |-
      De kosten, welke worden bepaald conform de normen en eisen van de Autoriteit Consument en Markt, worden ingedeeld
      in twee categorieën:
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.a
    text: 'de transportafhankelijke kosten, zijnde:'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.a.1
    text: de afschrijvingslasten van de netinfrastructuur;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.a.2
    text: een redelijk rendement op het geïnvesteerde vermogen in de netinfrastructuur;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.a.3
    text: de kosten van aanleg en instandhouding van de netinfrastructuur;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.a.4
    text: |-
      de kosten van inkoop van energie voor de dekking van netverliezen, het oplossen van fysieke congestie, het
      toepassen van congestiemanagement en de handhaving van de spannings- en blindvermogenshuishouding;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.a.5
    text: de gecascadeerde kosten van netten op een hoger spanningsniveau;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.a.6
    text: de operationele kosten in verband met het voorgaande;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.a.7
    text: |-
      in geval van de netbeheerder van het landelijke hoogspanningsnet: de kosten als bedoeld in [artikel 3.2.2a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.2.a.8
    text: |-
      in geval van de netbeheerder van het landelijk hoogspanningsnet: de kosten ten behoeve van de centrale filtering
      als bedoeld in [artikel 2.15. derde lid, van de Netcode elektriciteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '2'
  - number: 3.2.2.b
    text: 'de transportonafhankelijke kosten, zijnde:'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.b.1
    text: |-
      de kosten van verwerking van meetgegevens ([hoofdstuk 5][ref1] en
      [6 van de Informatiecode elektriciteit en gas][ref2]);


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037934
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0037934
        hoofdstuk: '6'
  - number: 3.2.2.b.2
    text: de kosten voor beheer van het aansluitingregister;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.b.3
    text: de kosten voor allocatie, reconciliatie en validatie;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.b.4
    text: de kosten voor factureren, klantenservice, incasso en klanten- en contractadministratie;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.b.5
    text: de kosten voor het invullen van dataverzoeken van de Autoriteit Consument en Markt; en
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2.b.6
    text: de kosten voor het afhandelen van switch- en verhuisberichten.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2
  - number: 3.2.2a
    text: |-
      In aanvulling op [artikel 3.2.1][ref1] dient het transporttarief van de netbeheerder van
      het landelijk hoogspanningsnet tevens ter bestrijding van de kosten die de netbeheerder van
      het landelijk hoogspanningsnet maakt ten behoeve van de taken en werkzaamheden genoemd in
      [artikel 1, eerste lid, aanhef en onder p, van de Elektriciteitswet 1998][ref2], alsmede al hetgeen naast deze
      taken en werkzaamheden nodig is tot nakoming van in ENTSO-E-verband aangegane verplichtingen en tot nakoming van
      internationale verplichtingen voortkomend uit [Verordening (EU) 2019/943](32019R0943) en de in hoofdstuk VII van
      [Verordening (EU) 2019/943](32019R0943) bedoelde netcodes en richtsnoeren, te onderscheiden in:


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel1
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: '1'
  - number: 3.2.2a.a
    text: kosten aFRR en noodvermogen, het MARI-product en FCR;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2a
  - number: 3.2.2a.b
    text: kosten black-start mogelijkheden;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2a
  - number: 3.2.2a.c
    text: kosten verband houdend met het bewaken en handhaven van de robuustheidsfunctie van het landelijk hoogspanningsnet;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2a
  - number: 3.2.2a.d
    text: kosten van overige taken en werkzaamheden ten behoeve van het systeembeheer;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2a
  - number: 3.2.2a.e
    text: |-
      interne operationele kosten voor zover toerekenbaar aan de system operator van de netbeheerder van het landelijk
      hoogspanningsnet;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2a
  - number: 3.2.2a.f
    text: |-
      de kosten in verband met de garantstelling als bedoeld in [artikel 1.2.5.10 van de Meetcode elektriciteit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037946#Artikel1
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2a
    references:
      - id: ref1
        bwb_id: BWBR0037946
        artikel: '1'
  - number: 3.2.2a.g
    text: de kosten zoals bedoeld in [artikel 11.1, vierde lid van de Netcode elektriciteit](onbekend).
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2a
  - number: 3.2.2b
    text: |-
      De kosten zoals bedoeld in [3.2.2a][ref1] worden toegerekend aan het netvlak bedoeld in [3.2.3, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.2b
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.3
    text: 'Voor de transport-afhankelijke kosten wordt de volgende indeling van netvlakken gehanteerd:'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.3
  - number: 3.2.3.a
    text: Extra hoogspanning (EHS) ≥ 220 kV(met inbegrip van transformator EHS/HS)
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.3
  - number: 3.2.3.b
    text: Hoogspanning (HS) ≥ 110 kV en < 220 kV
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.3
  - number: 3.2.3.c
    text: Tussenspanning (TS) ≥ 25 kV en < 110 kV (met inbegrip van transformator HS/TS)
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.3
  - number: 3.2.3.d
    text: Trafo HS+TS / MS
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.3
  - number: 3.2.3.e
    text: Middenspanning (MS) > 1 kV en < 25 kV
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.3
  - number: 3.2.3.f
    text: Trafo MS/LS
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.3
  - number: 3.2.3.g
    text: Laagspanning (LS) ≤ 1 kV
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.3
  - number: 3.2.4
    text: |-
      De 50 / 25 kV-netten kunnen op grond van de specifieke netconfiguratie en in het verleden gevoerde beleid aan de
      netvlakken HS of MS worden toegerekend en voor de overige artikelen als zodanig worden beschouwd. Met betrekking
      tot de 1 tot en met 25 kV-netten kan op grond van de specifieke netconfiguratie en in het verleden gevoerde beleid
      in de kostentoerekening onderscheid worden gemaakt tussen een netvlak MS-transport en een netvlak MS-distributie.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.4
  - number: 3.2.5
    text: |-
      Indien een netbeheerder van een of meer van de in [3.2.4][ref1] geboden mogelijkheden gebruik wil maken, wordt
      het voornemen hiertoe aan de Autoriteit Consument en Markt ter kennis gebracht, tegelijk met het voorstel voor
      de tarieven als bedoeld in [artikel 41b van de Elektriciteitswet 1998][ref2]. Wijzigingen zijn van toepassing met
      ingang van de datum waarop ook nieuw vastgestelde tarieven in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 41b
  - number: 3.2.6
    text: |-
      In de verhouding tussen netbeheerders onderling geldt met betrekking tot de toerekening van de
      transportafhankelijke kosten van de netten op de in [artikel 3.2.3][ref1] genoemde spanningsniveaus, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2.6.a
    text: |-
      in geval van een aansluiting tussen netten op verschillend spanningsniveau die niet door dezelfde netbeheerder
      worden beheerd, de kosten van het net op het hogere spanningsniveau op overeenkomstige wijze als bepaald in
      [artikel 3.6.3][ref1] worden toegerekend aan het net op het lagere spanningsniveau;


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.6
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.2.6.b
    text: |-
      in geval van een aansluiting tussen netten op gelijk spanningsniveau die niet door dezelfde netbeheerder worden
      beheerd, de betrokken netbeheerders in onderling overleg een kostentoerekening vaststellen;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.6
  - number: 3.2.6.c
    text: |-
      in geval van een aansluiting tussen netten op verschillend spanningsniveau die niet door dezelfde netbeheerder
      worden beheerd, de werkelijke kosten van fysieke congestie in die aansluiting worden toegerekend aan het net op het
      lagere spanningsniveau;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.6
  - number: 3.2.6.d
    text: |-
      in geval van een aansluiting tussen netten op gelijk spanningsniveau die niet door dezelfde netbeheerder worden
      beheerd, de betrokken netbeheerders in onderling overleg vaststellen aan welk net de werkelijke kosten van fysieke
      congestie in die aansluiting worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.2.6
  - number: 3.3.1
    text: 'De transporttarieven zijn:'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.3.1
  - number: 3.3.1.a
    text: |-
      het tarief voor transport, niet zijnde het onder b genoemde transport, beschreven in de
      [paragrafen 3.4 – 3.8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037951
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.3.1.b
    text: |-
      het tarief voor het transport van blindenergie, beschreven in [paragraaf 3.9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.3.1
    references:
      - id: ref1
        bwb_id: BWBR0037951
        hoofdstuk: '3'
        paragraaf: '3.9'
  - number: 3.3.2
    text: |-
      Het in 3.3.1, onder a, genoemde tarief valt uiteen in een transportafhankelijk tarief, beschreven in de
      [paragrafen 3.4 – 3.7][ref1], en een transportonafhankelijk tarief, beschreven in [paragraaf 3.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.3.2
    references:
      - id: ref1
        bwb_id: BWBR0037951
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0037951
        hoofdstuk: '3'
        paragraaf: '3.8'
  - number: 3.3.3
    text: |-
      Een streng van lichtmasten wordt voor de toepassing van het transporttarief beschouwd als één aansluiting waarbij
      de indeling in een transporttariefcategorie, conform [artikel 3.7.2][ref1], wordt gebaseerd op (de som van) het
      gecontracteerd transportvermogen voor afname van de lichtmasten in deze streng. Daarbij wordt een “streng van
      lichtmasten” gedefinieerd als: Een aantal lichtmasten, niet zijnde een OV-installatie, dat wordt gevoed vanuit
      dezelfde laagspanningsrail in een transformatorstation en waarover slechts één aangeslotene kan beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: 3.4.1
    text: |-
      Voor de bepaling van het transportafhankelijke tarief vindt een toerekening van de in [3.2.2, onder a][ref1],
      genoemde kosten plaats tussen producenten enerzijds, verbruikers anderzijds, aldus dat aan aangeslotenen die
      elektriciteit ontvangen 100 (honderd) procent van de som van de transportafhankelijke kosten van EHS en HS netten
      alsmede de transportafhankelijke kosten met betrekking tot de overige netvlakken wordt toegerekend, een en ander
      volgens het cascade-beginsel, bedoeld in [3.6.1][ref2] en volgende.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.4.1
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.1
    text: |-
      Voor de kostentoerekening aan verbruikers worden kosten van een net op een hoger spanningsniveau toegerekend
      aan een net op een lager spanningsniveau naar rato van het aandeel van laatstgenoemd net in de totale afname van
      energie en/of vermogen van het eerstgenoemde net (het cascade-beginsel), zulks met inachtneming van het hierna,
      onder [3.6.2][ref1], bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.1
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.2
    text: |-
      Voor de toepassing van het cascade-beginsel ten aanzien van de kosten van de in [3.4.1, onder a en b][ref1]
      bedoelde netten wordt de voorcalculatorische vastgestelde opbrengst van het LUP op die kosten in mindering
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.2
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 3.6.3
    text: 'De verdeelsleutels voor de kostentoerekening volgens het cascade-beginsel zijn de volgende:'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.3
  - number: 3.6.3.a
    text: |-
      voor de toerekening van de kosten van het EHS-netvlak aan HS-netvlakken geldt: (Afname van HS af EHS) / (Afname van
      HS af EHS + Afname verbruikers op EHS);
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.3
  - number: 3.6.3.b
    text: |-
      voor de toerekening van toegerekende kosten van HS-netvlakken aan aangesloten TS-netvlakken geldt: (Afname van TS
      af HS) / (Afname van TS af HS + Afname verbruikers op HS + Afname van Trafo-HS/MS af HS);
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.3
  - number: 3.6.3.c
    text: |-
      voor de toerekening van toegerekende kosten van HS-netvlakken aan aangesloten Trafo HS+TS / MS geldt: (Afname van
      Trafo HS/MS af HS) / (Afname van TS af HS + Afname verbruikers op HS + Afname van Trafo HS/MS af HS);
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.3
  - number: 3.6.3.d
    text: |-
      voor de toerekening van toegerekende kosten van TS-netvlakken aan aangesloten Trafo HS+TS / MS geldt: (Afname van
      Trafo TS/MS af TS) / (Afname van Trafo TS/MS af TS + Afname verbruikers op TS);
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.3
  - number: 3.6.3.e
    text: |-
      voor de toerekening van toegerekende kosten van Trafo HS+TS / MS aan aangesloten MS-netvlakken geldt: (Afname van
      MS af HS+TS / MS Trafo) / (Afname verbruikers op HS+TS / MS Trafo + Afname van MS af HS+TS/MS Trafo);
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.3
  - number: 3.6.3.f
    text: |-
      voor de toerekening van toegerekende kosten van MS-netvlakken aangesloten op LS-netvlakken geldt: (Afname van LS af
      MS/LS Trafo) / (Afname verbr. op MS + Afname verbr. op MS/LS Trafo + Afname van LS af MS/LS Trafo);
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.3
  - number: 3.6.3.g
    text: |-
      voor de toerekening van de kosten van Trafo MS / LS aan aangesloten LS-netvlakken geldt: (Afname van LS af MS/LS
      Trafo) / (Afname verbruikers op MS/LS Trafo + Afname van LS af MS/LS Trafo).
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.3
  - number: 3.6.4
    text: |-
      Voor de toepassing van de [onder 3.6.3][ref1] uitgedrukte verdeelsleutels wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.4
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 3.6.4.a
    text: |-
      ingeval van een net boven MS-niveau uitgegaan van de som van de individuele kWmax gemeten op de aansluiting van het
      net met een lager spanningsniveau op het net met een hoger spanningsniveau, waarbij uitsluitend het vermogen dat
      van het net met het hoge spanningsniveau naar het net met het lage spanningsniveau wordt geteld;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.4
  - number: 3.6.4.b
    text: |-
      ingeval van een net op of onder MS-niveau uitgegaan van het saldo van de energie, uitgedrukt in kWh, die wordt
      uitgewisseld tussen een net op een hoger spanningsniveau en een net op een lager spanningsniveau, met een minimum
      van nul.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.6.4
  - number: 3.7.1
    text: |-
      Met inachtneming van [artikel 3.2.4][ref1] en [3.2.5][ref2] worden voor de bepaling van het transportafhankelijke
      verbruikers-transporttarief (TAVT) de volgende tariefcategorieën onderscheiden:


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.7.1
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.7.1.a1
    text: EHS
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.7.1
  - number: 3.7.1.a2
    text: HS
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.7.1
  - number: 3.7.1.b
    text: TS
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.7.1
  - number: 3.7.1.c
    text: Trafo HS+TS / MS
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.7.1
  - number: 3.7.1.d
