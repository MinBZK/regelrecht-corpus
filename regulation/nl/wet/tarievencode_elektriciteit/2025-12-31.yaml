preamble:
  text: |-
    Gelet op artikel 36 van de Elektriciteitswet 1998;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#ArtikelAanhef
articles:
  - number: 1.1.1
    text: |-
      Deze code beschrijft de elementen en wijze van berekening van het tarief waarvoor aangeslotenen zullen worden
      aangesloten op een net, van het tarief waarvoor transport van elektriciteit, met inbegrip van de invoer, uitvoer
      en doorvoer van elektriciteit, ten behoeve van aangeslotenen zal worden uitgevoerd en waarvoor de systeemdiensten
      worden verricht, alsmede de energiebalans wordt gehandhaafd en het tarief voor meting van elektriciteit bij
      kleinverbruikers.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel1.1.1
  - number: 1.2.1
    text: |-
      Voor de toepassing van deze code gelden de begrippen en bijbehorende begripsbepalingen uit de
      [Begrippencode elektriciteit][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037938
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037938
  - number: 1.2.2
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel1.2.2
  - number: 1.2.3
    text: |-
      Voor deze code wordt in geval van een aansluiting tussen twee netten van een ongelijk spanningsniveau het net van
      het lagere spanningsniveau geacht te zijn aangesloten op het net van het hogere spanningsniveau.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel1.2.3
  - number: 1.2.4
    text: |-
      Voor deze code worden in geval van een aansluiting tussen twee netten van een gelijk spanningsniveau de netten
      geacht over en weer op elkaar te zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel1.2.4
  - number: 1.2.6
    text: |-
      Waar in deze code sprake is van kosten worden bedoeld die kosten die de grondslag vormen voor de tarieven die door
      de Autoriteit Consument en Markt worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel1.2.6
  - number: 1.3.1
    text: |-
      Indien een aansluit- en transportovereenkomst in de loop van de maand wordt aangegaan, gewijzigd of beëindigd
      worden de maandelijks verschuldigde vergoedingen voor die maand op dagbasis bepaald en in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel1.3.1
  - number: 2.1.1
    text: |-
      Door een netbeheerder wordt aan iedere aangeslotene die een aansluiting op het door die netbeheerder beheerde net
      heeft of daarom verzoekt de aansluitdienst aangeboden.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.1.1
  - number: 2.1.2
    text: |-
      De aansluitdienst omvat de werkzaamheden, genoemd in [artikel 28 van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel28
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '28'
  - number: 2.1.3
    text: |-
      De aansluitdienst heeft betrekking op de aansluiting voor aangeslotenen met een door de aangeslotene gewenste
      aansluitcapaciteit.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.1.3
  - number: 2.1.4
    text: |-
      Voor het leveren van de aansluitdienst wordt aan iedere aangeslotene het aansluittarief in rekening gebracht.
      In geval op verzoek van de aangeslotene meerdere verbindingen zijn aangelegd, wordt elke extra verbinding die
      geen deel uitmaakt van de standaardaansluiting als extra aansluiting beschouwd waarvoor het aansluittarief in
      rekening wordt gebracht. Voor verbindingen gerealiseerd voor 1 januari 2004 en voor aansluitingen groter dan 10
      MVA of 1 MVA, indien de aangeslotene daar om verzocht heeft, zullen de instandhoudingskosten in geval van meerdere
      verbindingen in overleg tussen de netbeheerder en de aangeslotene tot stand komen.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.1.4
  - number: 2.1.5
    text: |-
      Een aangeslotene heeft recht op een aansluiting op het door hem gevraagde spanningsniveau, tenzij dit om technische
      redenen redelijkerwijs niet van de netbeheerder kan worden verlangd. De netbeheerder en de aangeslotene overleggen
      over onder welke voorwaarden en tegen welke vergoeding de aansluiting in deze gevallen wordt gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.1.5
  - number: 2.1.6
    text: |-
      Indien een aangeslotene in de zin van [artikel 16c, eerste en tweede lid, van de Elektriciteitswet 1998][ref1],
      aansluitingswerkzaamheden laat uitvoeren door een ander dan de netbeheerder, wordt in uitzondering op het gestelde
      in [artikel 2.1.4][ref2], door de netbeheerder geen aansluittarief in rekening gebracht voor de desbetreffende
      aansluiting, maar slechts de vergoeding bedoeld in [artikel 2.1.7][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16c
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.1.6
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: 16c
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.1.7
    text: |-
      In de overeenkomst, bedoeld in [artikel 2.39, eerste tot en met derde lid, van de Netcode elektriciteit][ref1],
      wordt vastgelegd welke aansluitingswerkzaamheden de aangeslotene openbaar zal aanbesteden en welke daarmee
      samenhangende taken de netbeheerder, als bedoeld in [artikel 16c, derde lid, van de Elektriciteitswet 1998][ref2],
      heeft. Voor deze in de overeenkomst vermelde taken komen de aangeslotene en de netbeheerder een redelijke
      vergoeding overeen die gespecificeerd wordt naar taak en gebaseerd is op het aantal door de netbeheerder daaraan
      daadwerkelijk te besteden uren. Daarbij worden tevens de loonkosten van de per taak bestede uren gespecificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16c
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.1.7
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009755
        artikel: 16c
  - number: 2.2.1
    text: |-
      Het aansluittarief dient ter bestrijding van de kosten die de netbeheerder in verband met de onder [2.1.2][ref1]
      genoemde werkzaamheden maakt, en voor zover deze geen deel uitmaken van de transportkosten. Deze kosten zijn te
      onderscheiden in:


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 2.2.1.a
    text: initiële investeringskosten;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.2.1
  - number: 2.2.1.b
    text: kosten voor het in stand houden van de aansluiting.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.2.1
  - number: 2.2.2
    text: |-
      Met betrekking tot de in [2.2.1 sub a][ref1] genoemde kosten geldt dat slechts de kosten van rechtstreeks
      met de totstandbrenging van de aansluiting gemoeide investeringen in aanmerking worden genomen, waarbij de
      netbeheerder voor de standaardaansluitingen, zoals aangegeven in de tabel in [2.3.3c][ref2] en nader omschreven in
      [bijlage A][ref3], uitgaat van gemiddelden.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0037951
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0037951
  - number: 2.3.1
    text: 'Het aansluittarief bestaat uit ten hoogste drie tariefdragers:'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.1
  - number: 2.3.1.a
    text: |-
      een eenmalige bijdrage op basis van de initiële investeringskosten. Hieronder wordt verstaan de specifiek voor
      de desbetreffende nieuwe aansluiting gedane investering, voor zover deze investering geen betrekking heeft op
      herbruikbare activa;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.1
  - number: 2.3.1.b
    text: |-
      indien er sprake is van herbruikbare activa: een periodieke vergoeding ter dekking van de kapitaallasten van deze
      activa in Euro’s per maand of een andere tijdsperiode;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.1
  - number: 2.3.1.c
    text: |-
      een periodieke vergoeding in Euro’s per maand ter dekking van de kosten voor het in stand houden van de
      aansluiting.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.1
  - number: 2.3.2
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.2
  - number: 2.3.2a
    text: |-
      Het eenmalige aansluittarief bestaat uit een bedrag dat is opgebouwd uit een vast bedrag voor de verbreking van
      het net van de desbetreffende netbeheerder om een fysieke verbinding van de installatie van een aangeslotene met
      dat net tot stand te brengen (de knip), een vast bedrag voor het installeren van voorzieningen om het net van de
      desbetreffende netbeheerder te beveiligen en beveiligd te houden (de beveiliging) en een vast bedrag voor het tot
      stand brengen van een verbinding met een maximale kabellengte van 25 meter tussen de plaats waar het net verbroken
      is en de voorzieningen om het net te beveiligen (de verbinding), aangevuld met een bedrag per meter voor elke meter
      meer dan die 25 meter.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.2a
  - number: 2.3.2b
    text: |-
      De periodieke vergoeding voor aansluitingen met een aansluitcapaciteit kleiner dan 3 MVA bestaat uit een bedrag
      ter dekking van de kosten van het instandhouden van de aansluiting en voor elke meter meer dan de maximale
      kabellengte van 25 meter tussen de plaats waar het net verbroken is en de voorzieningen om het net te beveiligen
      (de verbinding). De periodieke vergoeding voor aansluitingen met een aansluitcapaciteit groter dan of gelijk aan
      3 MVA bestaat uit een bedrag ter dekking van de kosten van het instandhouden van de aansluiting, aangevuld met een
      bedrag per meter ter dekking van de kosten van het instandhouden voor elke meter meer dan die 25 meter.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.2b
  - number: 2.3.3
    text: |-
      Met inachtneming van de tabel genoemd in [2.3.3c][ref1] en [bijlage A][ref2] wordt het aansluittarief bepaald door
      de aansluitcapaciteit die de aangeslotene wenst. Het is de netbeheerder toegestaan om voor zijn gebied afwijkende
      grenzen vast te stellen. Deze afwijkende grenzen liggen ter inzage bij de netbeheerder en worden, ook bij
      wijzigingen ervan, schriftelijk gemeld bij de Autoriteit Consument en Markt. Een voornemen tot het wijzigen van de
      grenzen wordt aan de Autoriteit Consument en Markt ter kennis gebracht, tegelijk met het voorstel voor de tarieven
      als bedoeld in [artikel 41b van de Elektriciteitswet 1998][ref3]. Wijzigingen van de grenzen zijn van toepassing
      met ingang van de datum waarop ook nieuw vastgestelde tarieven in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037951
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel41b
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.3
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0037951
      - id: ref3
        bwb_id: BWBR0009755
        artikel: 41b
  - number: 2.3.3a
    text: 'Voor de volgende aansluitingen:'
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.3a
  - number: 2.3.3a.a
    text: aansluitingen met een aansluitcapaciteit van meer dan 10 MVA;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.3a
  - number: 2.3.3a.b
    text: |-
      aansluitingen met een aansluitcapaciteit van meer dan 1 MVA en waarbij de aangeslotene de netbeheerder heeft
      verzocht om van de standaardaansluiting af te wijken;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.3a
  - number: 2.3.3a.c
    text: |-
      tijdelijke aansluitingen zoals bouwaansluitingen en aansluitingen voor kermissen en andere kortstondige
      evenementen,
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.3a
  - number: 2.3.3b
    text: |-
      Het aansluittarief voor een aansluiting van een netbeheerder op het net van een andere netbeheerder is gebaseerd op
      de voorcalculatorische projectkosten met betrekking tot een dergelijke aansluiting.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.3b
