      [3.7.9][ref3], [3.7.10][ref4], [artikel 3.7.15][ref5], [artikel 3.7.16][ref6], en [artikel 3.7.17][ref7], voor het
      bepalen van het TAVT:


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0037951#Artikel3
