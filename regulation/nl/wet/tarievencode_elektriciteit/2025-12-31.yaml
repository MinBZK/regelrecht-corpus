         *) Eventueel differentiatie in % voor de afzonderlijke componenten van de met de aangeslotene overeengekomen
      investeringskosten. **) De in bovenstaande tabel gegeven omschrijvingen van ‘beheer’ en ‘vervanging’ zijn
      uitsluitend van toepassing op [paragraaf 2.3.5][ref2]. ***) Uitgesplitst naar knip, verbinding, beveiliging.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel2.3.5.5
    references:
      - id: ref1
