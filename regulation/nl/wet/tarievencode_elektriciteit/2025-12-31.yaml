  - number: 3.7.18.a
    text: |-
      voor zover van toepassing de component kW toegepast op het transport over de aansluitingen van de groepsdeelnemers
      gezamenlijk waarbij voor groepen met gelijktijdige invoeding en afname wordt gerekend met het netto
      vermogensprofiel van de groep gebaseerd op een onbalansperiode van 15 minuten;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.7.18
  - number: 3.7.18.b
    text: |-
      voor zover van toepassing de component kW of de component kW toegepast op het transport over de aansluitingen van
      de groepsdeelnemers gezamenlijk waarbij voor groepen met gelijktijdige invoeding en afname wordt gerekend met het
      netto vermogensprofiel van de groep gebaseerd op een onbalansperiode van 15 minuten;
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.7.18
  - number: 3.7.18.c
    text: |-
      voor zover van toepassing de component kWh toegepast op het totaal van het transport over elk van de afzonderlijke
      aansluitingen van de groepsdeelnemers.
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.7.18
  - number: 3.7.19
    text: |-
      In aanvulling op [artikel 3.7.18][ref1], is, indien sprake is van een groepstransportovereenkomst waar
      aansluitingen behorend tot aansluitcapaciteitscategorie als bedoeld in [bijlage A][ref2], onderdeel A.3 en
      onderdelen A.4 of A.5 deel van uitmaken, per maand 1/12 deel van de in [artikel 3.7.10, onderdeel a][ref3],
      bedoelde verhoging van toepassing, vermenigvuldigd met de som van de kWmax waarden van alle aan de groep
      deelnemende aansluitingen behorend tot de aansluitcapaciteitscategorie als bedoeld in bijlage A, onderdeel A.3.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037951
      [ref3]: https://wetten.overheid.nl/BWBR0037951#Artikel3
    url: https://wetten.overheid.nl/BWBR0037951/2025-12-31#Artikel3.7.19
    references:
      - id: ref1
        bwb_id: BWBR0037951
        artikel: '3'
        hoofdstuk: '3'
