  - number: 5.14c
    text: |-
      1 Het is verboden luchtverkeersdiensten te verlenen zonder hiertoe te zijn aangewezen bij of krachtens deze wet,
      dan wel zonder de hiertoe vereiste instemming, bedoeld in [artikel 5.14b][ref1].

      2 Het is verboden luchtverkeersdiensten te doen verlenen zonder de hiertoe vereiste instemming, bedoeld in
      [artikel 5.14b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.14b
