  - number: 8.25j
    text: |-
      Een voordracht voor een algemene maatregel van bestuur op grond van de [artikelen 8.25d tot en met 8.25g][ref1]
      wordt gedaan door Onze Minister van Verkeer en Waterstaat in overeenstemming met Onze Minister van Economische
      Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25d
