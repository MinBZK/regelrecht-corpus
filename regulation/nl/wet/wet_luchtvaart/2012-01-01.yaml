  - number: '1.2'
    text: |-
      1 Deze wet is:

      a. van toepassing op het luchtverkeer, de luchtverkeersbeveiliging, luchtvaartnavigatiediensten, de
      luchtvaartuigen, het vervoer en de vluchtuitvoering met luchtvaartuigen binnen het vluchtinformatiegebied
      Amsterdam;

      b. van toepassing op Nederlandse luchtvaartuigen, alsmede het vervoer en de vluchtuitvoering met Nederlandse
      luchtvaartuigen buiten het vluchtinformatiegebied Amsterdam;

      c. met betrekking tot het bepaalde bij of krachtens [hoofdstuk 2][ref1], [3][ref2], en [4][ref3] en de
      [artikelen 11.1][ref4], [11.2][ref5], [11.2a][ref6], [11.3 tot en met 11.14][ref7] van toepassing binnen de
      delen van het vluchtinformatiegebied Curaçao en het vluchtinformatiegebied San Juan, bedoeld in artikel 1 van de
      Luchtvaartwet BES, dat zich boven het territoir van de openbare lichamen Bonaire, Sint Eustatius en Saba bevindt
      dan wel die delen waarvoor de Minister de verantwoordelijkheid voor het verzorgen van luchtverkeersdiensten heeft
      aanvaard.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat, op nader in die algemene maatregel aan te geven
      categorieën van personeel of op bepaalde soorten van luchtvaartuigen, op bepaalde soorten van vervoer of op
      bepaalde vormen van vluchtuitvoering, indien toepassing van deze wet in redelijkheid niet kan worden gevergd en de
      veiligheid van het luchtverkeer niet in gevaar wordt gebracht, geheel of gedeeltelijk niet van toepassing zijn:

        - de [artikelen 2.1 tot en met 2.10][ref8] of één of meer van deze artikelen,
        - [hoofdstuk 3][ref9],
        - [hoofdstuk 4][ref10],
        - [titel 5.1][ref11], met uitzondering van de [artikelen 5.14b tot en met 5.14d][ref12], of [5.2][ref13],
        - [titel 6.5][ref14] of [titel 6.6][ref15],
        - [hoofdstuk 9][ref16], of
        - [hoofdstuk 10][ref17].

      3 Bij de toepassing van het tweede lid kunnen bij of krachtens die algemene maatregel van bestuur voorschriften en
      beperkingen worden opgenomen met betrekking tot één of meer buiten toepassing van de wet te laten onderdelen. Deze
      voorschriften en beperkingen kunnen mede betrekking hebben op de beperking van geluidshinder.


