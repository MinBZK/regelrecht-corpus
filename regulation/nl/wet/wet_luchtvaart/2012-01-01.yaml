  - number: '8.71'
    text: |-
      De voordracht voor een luchthavenbesluit of de voordracht tot een wijziging daarvan wordt niet gedaan dan nadat
      het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen zesweken
      na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister van Verkeer en
      Waterstaat te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan beide kamers der Staten-Generaal
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.71
  - number: '8.72'
    text: |-
      1 De [artikelen 8.24a][ref1], [8.52][ref2], [8.53][ref3] en [8.54, eerste en vierde lid][ref4], zijn van toepassing
      met dien verstande dat voor de toepassing van [artikel 8.54, vierde lid][ref5], Onze Ministers van Verkeer en
      Waterstaat en Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer in de plaats treden van gedeputeerde staten.

      2 Bij regeling van Onze Minister van Verkeer en Waterstaat worden, in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, nadere regels gesteld omtrent het registreren van de
      grenswaarden die in het luchthavenbesluit zijn opgenomen, omtrent de berekeningen die daartoe noodzakelijk zijn en
