  - number: '5.39'
    text: |-
      Het bestuur stelt bij reglement de werkwijze vast voor het financiële beheer en de administratieve organisatie van
      de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.39
  - number: '5.40'
    text: |-
      1 De begroting van de LVNL bevat een raming van alle baten en lasten, de investeringsuitgaven en financiering.

      2 De begroting bestaat uit:

      a. de jaarlijkse financiële begroting, bestaande uit een exploitatiebegroting en een kapitaalsbegroting;

      b. het financiële meerjarenbeleidsplan.

      3 Tot de lasten van de LVNL worden gerekend de kosten voortvloeiende uit de taken van Onze Minister van Verkeer en
      Waterstaat op het gebied van de luchtverkeersbeveiliging.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.40
  - number: '5.41'
    text: |-
      1 Het bestuur stelt jaarlijks een jaarverslag en een jaarrekening vast.

      2 Het boekjaar van de LVNL valt samen met het kalenderjaar.

      3 Het bestuur zendt jaarlijks voor 1 mei van het jaar volgende op het jaar waarop het betrekking heeft een
      jaaroverzicht aan Onze Minister van Verkeer en Waterstaat. Het jaaroverzicht omvat:

      a. het jaarverslag;

      b. de jaarrekening;

      c. een opgave over de toepassing van de arbeidsvoorwaarden;

      d. de verklaring van de door de raad van toezicht aangewezen externe registeraccountant; en

      e. een document, houdende de instemming bedoeld in [artikel 5.32, derde lid onder e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.32
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.41
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.32'
        hoofdstuk: '5'
        paragraaf: 5.3.3
  - number: '5.42'
    text: |-
      1 Het bestuur verstrekt desgevraagd aan Onze Minister van Verkeer en Waterstaat de voor de uitoefening van zijn
      taak benodigde inlichtingen.

      2 Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van
      zijn taak redelijkerwijs nodig is.

      3 Onze Minister stelt met betrekking tot het eerste en tweede lid een informatiestatuut vast.

      4 Onze Minister van Verkeer en Waterstaat kan het bestuur opdragen periodiek rapportage uit te brengen op een door
      hem, na overleg met het bestuur, te bepalen wijze.

      5 Het bestuur geeft bij het verstrekken van de in het eerste lid bedoelde gegevens waar nodig aan welke gegevens
      een vertrouwelijk karakter dragen. Dit vertrouwelijke karakter kan voortvloeien uit de aard van de gegevens, dan
      wel uit het feit dat natuurlijke of rechtspersonen deze aan de LVNL hebben verstrekt onder het beding dat zij als
      vertrouwelijk zullen gelden.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.42
  - number: '5.43'
    text: |-
      1 De volgende stukken worden door het bestuur vastgesteld en behoeven de goedkeuring van Onze Minister van Verkeer
      en Waterstaat:

      a. de financiële begroting;

      b. het financiële meerjarenbeleidsplan.

      2 Het bestuur stelt de stukken bedoeld in het eerste lid vast en zendt deze aan de Minister van Verkeer en
      Waterstaat toe vóór 1 november van het jaar voorafgaand aan het begrotingsjaar.

      3 Indien Onze Minister van Verkeer en Waterstaat binnen vier weken na de in het tweede lid bedoelde toezending de
      goedkeuring aan de in het eerste lid, onder *a*, *b* en *c*, genoemde stukken, niet heeft onthouden, wordt deze
      geacht te zijn verleend.

      4 Het bestuur verstrekt Onze Minister van Verkeer en Waterstaat vóór 15 januari van het jaar voorafgaand aan het
      begrotingsjaar de door Onze Minister van Verkeer en Waterstaat voor het opstellen van de Rijksbegroting vereiste
      gegevens.

      5 Het bestuur verstrekt Onze Minister van Verkeer en Waterstaat de inlichtingen en andere gegevens waarover hij
      moet beschikken om inzicht in het financiële beheer van de LVNL te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.43
  - number: '5.44'
    text: |-
      Waar in deze wet de goedkeuring van Onze Minister van Verkeer en Waterstaat is vereist, verleent dan wel onthoudt
      hij die, behoudens het bepaalde in [artikel 5.43, derde lid][ref1], binnen twaalf weken na de datum van ontvangst
      van de goed te keuren stukken. Indien Onze Minister van Verkeer en Waterstaat goedkeuring onthoudt aan de
      financiële begroting, is het bestuur gerechtigd voor iedere maand gedurende welke de goedkeuring wordt onthouden,
      uitgaven te doen ter grootte van maximaal een twaalfde deel van de begroting van het voorafgaande boekjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.43
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.44
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.43'
        hoofdstuk: '5'
        paragraaf: 5.3.8
  - number: '5.45'
    text: |-
      Indien naar het oordeel van Onze Minister van Verkeer en Waterstaat het bestuur dan wel de raad van toezicht van de
      LVNL zijn taak niet of niet naar behoren vervult, kan Onze Minister van Verkeer en Waterstaat, na overleg met het
      betrokken orgaan, de noodzakelijke voorzieningen treffen. Onze Minister stelt de Tweede Kamer der Staten-Generaal
      onverwijld in kennis van de door hem getroffen voorzieningen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.45
  - number: '5.46'
    text: |-
      Onze Minister van Verkeer en Waterstaat zendt binnen vijf jaar na inwerkingtreding van deze wet en vervolgens na
      iedere vijf jaar aan de Staten-Generaal een verslag over de werking en doeltreffendheid van de LVNL. De LVNL is
      gehouden aan deze evaluatie medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.46
  - number: '6.50'
    text: |-
      Deze titel is, met uitzondering van het bepaalde bij of krachtens de[ artikelen 6.55][ref1], [6.56][ref2] en
      [6.57][ref3], niet van toepassing op het vervoer van splijtstoffen, ertsen of radioactieve stoffen als bedoeld in
      [artikel 1, eerste lid, van de Kernenergiewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.55
