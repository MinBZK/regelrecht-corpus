  - number: '8.24'
    text: |-
      De artikelen 8.13 en 8.14 zijn van overeenkomstige toepassing op het voorbereiden en het wijzigen van het
      luchthavenverkeerbesluit.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.24
  - number: 8.24a
    text: |-
      1 De exploitant van de luchthaven is verplicht om met inachtneming van de bij of krachtens deze wet of de
      [Luchtvaartwet](onbekend) gestelde bepalingen, luchthavenluchtverkeer ten behoeve van de burgerluchtvaart op de
      luchthaven toe te laten.

      2 Het eerste lid is niet van toepassing op circuitvluchten, oefenvluchten en proefvluchten.

      3 De exploitant is verplicht om in door Onze Minister van Verkeer en Waterstaat in overeenstemming met Onze
      Minister van Defensie aangewezen gevallen met inachtneming van de bij of krachtens deze wet of de Luchtvaartwet
      gestelde bepalingen, luchthavenluchtverkeer ten behoeve van de militaire luchtvaart op de luchthaven toe te laten.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.24a
  - number: '8.25'
    text: |-
      1 Het is verboden de luchthaven te exploiteren zonder vergunning van Onze Minister van Verkeer en Waterstaat.

      2 Een luchthavenexploitatievergunning wordt verleend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.25
  - number: 8.25a
    text: |-
      De exploitant van de luchthaven is verplicht tot exploitatie van de luchthaven en treft met inachtneming
      van [artikel 8.3][ref1] daartoe de voorzieningen die nodig zijn voor een goede afwikkeling van het
      luchthavenluchtverkeer en het daarmee samenhangende personen- en goederenvervoer op de luchthaven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.3
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.25a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.3'
        hoofdstuk: '8'
        afdeling: 8.2.1
  - number: 8.25b
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan een vergunning intrekken indien:

      a. de exploitant van de luchthaven zich schuldig maakt aan wanbeheer waardoor de continuïteit van de luchthaven in
      gevaar wordt gebracht;

      b. het nationale ruimtelijke beleid niet langer voorziet in een luchthaven op de desbetreffende locatie.

      2 Onze Minister van Verkeer en Waterstaat kan op aanvraag van de exploitant van de luchthaven de vergunning
      intrekken indien het algemeen belang zich niet tegen die intrekking verzet.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.25b
  - number: 8.25c
    text: |-
      Indien een ernstig vermoeden bestaat dat een omstandigheid als bedoeld in [artikel 8.25b, onderdeel a][ref1], zich
      dreigt voor te doen, kan Onze Minister van Verkeer en Waterstaat de exploitant van de luchthaven een aanwijzing
      geven om binnen een door hem te stellen termijn maatregelen te treffen ter voorkoming van wanbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25b
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.25c
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8.25b
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25d
    text: |-
      1 De exploitant van de luchthaven stelt ten minste eenmaal per jaar de tarieven en voorwaarden vast voor de
      activiteiten van de exploitant van de luchthaven ten behoeve van het gebruik van de luchthaven door gebruikers. De
      exploitant van de luchthaven doet voorafgaande aan de periode waarop de tarieven en voorwaarden betrekking hebben,
      mededeling van de tarieven en voorwaarden.

      2 De tarieven en voorwaarden zijn redelijk en non-discriminatoir.

      3 De tarieven kunnen worden gedifferentieerd uit een oogpunt van algemeen belang, met inbegrip van de bescherming
      van het milieu. De criteria voor deze tariefsdifferentiatie dienen differentiatie te kunnen rechtvaardigen en zijn
      objectief en transparant.

      4 De tarieven voor de activiteiten, bedoeld in het eerste lid, zijn voor het geheel van de activiteiten
      kostengeoriënteerd.

      5 Onverminderd het vierde lid, zijn de tarieven voor de beveiliging van passagiers en hun bagage, alsmede vracht
      voor het geheel van de beveiligingsactiviteiten kostengeoriënteerd.

      6 Bij de vaststelling van de tarieven neemt de exploitant van de luchthaven de toegerekende opbrengsten in
      aanmerking uit overige activiteiten van de exploitant van de luchthaven die rechtstreeks verband houden met de
      activiteiten, bedoeld in het eerste lid.

      7 Bij de vaststelling van de tarieven neemt de exploitant van de luchthaven de kosten in aanmerking van
      structurele maatregelen voor de uitvoering van een bijzondere aanwijzing van Onze Minister van Justitie, bedoeld
      in [artikel 37ac, tweede lid, van de Luchtvaartwet][ref1], voor zover die maatregelen betrekking hebben op de
      beveiliging van passagiers en hun bagage.

      8 Bij de vaststelling van de tarieven kan, in afwijking van het vierde en vijfde lid, de exploitant van de
      luchthaven een bijdrage uit andere activiteiten dan die, bedoeld in het eerste en zesde lid, in aanmerking nemen.

      9 Bij de vaststelling van de tarieven wordt de bijdrage, bedoeld in het achtste lid, naar rato van de kosten
      toegerekend aan de activiteiten voor de beveiliging van passagiers en hun bagage, bedoeld in het vijfde lid, en de
      overige activiteiten ten behoeve van het gebruik van de luchthaven door gebruikers, bedoeld in het zesde lid.

      10 De exploitant van de luchthaven verrekent bij de vaststelling van de tarieven, nadat deze zijn bepaald met
      inachtneming van het tweede tot en met negende lid, het verschil tussen de geraamde en de werkelijke opbrengsten en
      kosten in verband met de prognoses en de realisatie van het volume van het luchthavenluchtverkeer, het vervoer van
      passagiers en vracht en van de uitvoering van investeringen, zoals volgt uit de financiële verantwoording over het
      aan het moment van vaststelling van de tarieven voorafgaande boekjaar.

      11 Bij de vaststelling van het tarief voor de beveiliging van passagiers en hun bagage, nadat deze is bepaald met
      inachtneming van het tweede tot en met negende lid, verrekent de exploitant van de luchthaven de extra opbrengst
      voor de beveiliging van passagiers en hun bagage die is verkregen nadat een structurele maatregel als bedoeld
      in het zevende lid, is ingetrokken, en het tarief voor de beveiliging van passagiers en hun bagage nog niet
      dienovereenkomstig is aangepast.

      12 De exploitant van de luchthaven hanteert de tarieven en voorwaarden die ingevolge het eerste lid zijn
      vastgesteld, gedurende de periode waarop de vaststelling van de tarieven en voorwaarden betrekking heeft.

      13 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. de activiteiten ten behoeve van het gebruik van de luchthaven door gebruikers waarvoor tarieven en voorwaarden
      als bedoeld in het eerste lid, worden vastgesteld;

      b. de activiteiten, bedoeld in het zesde lid, die rechtstreeks verband houden met de activiteiten ten behoeve van
      het gebruik van de luchthaven, bedoeld in het eerste lid;

      c. de wijze en het tijdstip waarop de mededeling, bedoeld in het eerste lid, plaatsvindt;

      d. de kostenoriëntatie, bedoeld in het vierde en vijfde lid;

      e. het tijdstip van vaststelling en inwerkingtreding van de tarieven en voorwaarden;

      f. de wijze waarop de exploitant van de luchthaven, zonodig in afwijking van de regels, bedoeld in onderdeel e,
      uitvoering geeft aan het zevende lid.

      14 De voordracht voor een krachtens het dertiende lid vast te stellen algemene maatregel van bestuur wordt niet
      eerder gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ac
