        bwb_id: BWBR0005555
        artikel: '6.51'
        hoofdstuk: '6'
  - number: '6.61'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan van degenen die
      handelingen verrichten als bedoeld in [artikel 6.51][ref1] , alle inlichtingen of documenten vragen die naar
      zijn redelijk oordeel nodig zijn ten behoeve van het analyseren van voorvallen gevaarlijke stoffen als bedoeld
      in [artikel 6.60][ref2].

      2 De betrokkenen zijn verplicht de gevraagde inlichtingen volledig en naar waarheid te verstrekken binnen een
      door Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie in redelijkheid te stellen
      termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.51
