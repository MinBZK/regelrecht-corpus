      1 De houder van een bewijs van bevoegdheid, dat de bevoegdheid geeft een luchtvaartuig te bedienen, en de leerling-
      vlieger dienen onder door Onze Minister van Verkeer en Waterstaat te stellen regelen een logboek bij te houden.

      2 Het is verboden

      a. in het logboek onjuiste gegevens of onjuiste aantekeningen op te nemen, te doen opnemen of toe te laten dat zij
      daarin worden opgenomen;

      b. het logboek te beschadigen of te vernietigen, te doen beschadigen of vernietigen dan wel toe te laten, dat het
      wordt beschadigd of vernietigd.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel2.10
  - number: '2.11'
    text: |-
      1 Het is de houder van een bewijs van bevoegdheid of bewijs van gelijkstelling verboden werkzaamheden, tot het
      verrichten waarvan dat bewijs de bevoegdheid geeft, te verrichten wanneer de houder daardoor in verband met zijn
      lichamelijke of geestelijke gesteldheid de veiligheid van het luchtverkeer in gevaar brengt of in gevaar kan
      brengen.

      2 Onverminderd het eerste lid is het verboden luchtverkeersdiensten te verlenen dan wel een grondstation
      of een mobiel station als bedoeld in [artikel 2.1, eerste lid][ref1], te bedienen, terwijl degene, die
      luchtverkeersdiensten verleent dan wel een grondstation of een mobiel station bedient, verkeert onder zodanige
      invloed van een stof, waarvan hij weet of redelijkerwijze moet weten, dat het gebruik daarvan – al dan niet in
      combinatie met het gebruik van een andere stof – de vaardigheid voor het verlenen van luchtverkeersdiensten of het
      bedienen van een grondstation of een mobiel station kan verminderen, dat hij niet in staat moet worden geacht zulks
      naar behoren te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel2.11
