  - number: '2.12'
    text: |-
      1 Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een luchtvaartuig te verrichten,
      terwijl hij verkeert onder zodanige invloed van een stof, waarvan hij weet of redelijkerwijze moet weten, dat
      het gebruik daarvan – al dan niet in combinatie met het gebruik van een andere stof – de vaardigheid voor het
      verrichten van die werkzaamheden kan verminderen, dat hij niet in staat moet worden geacht die werkzaamheden naar
      behoren te verrichten.

      2 Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een luchtvaartuig te verrichten,
      indien hij binnen de tien daaraan voorafgaande uren alcoholhoudende drank heeft gebruikt.

      3 Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een luchtvaartuig te verrichten na
      zodanig gebruik van alcoholhoudende drank, dat:

      a. het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan negentig microgram (90 µg) alcohol
      per liter uitgeademde lucht, dan wel

      b. het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan eenvijfde milligram (0,2 mg)
      alcohol per milliliter bloed.

      4 Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een
      luchtvaartuig te verrichten gedurende de tijd, waarvoor een rijverbod als bedoeld in
      [artikel 162, eerste lid, van de Wegenverkeerswet 1994][ref1] geldt.

      5 Het is verboden een lid van het boordpersoneel van wie men weet of redelijkerwijs moet weten, dat deze verkeert
      in een toestand, als bedoeld in [artikel 2.11, eerste lid][ref2], of in het eerste of derde lid van dit artikel,
      werkzaamheden aan boord van een luchtvaartuig te doen verrichten.

      6 Het derde, vierde en vijfde lid zijn van overeenkomstige toepassing op eenieder die luchtverkeersdiensten
      verleent of een grondstation of een mobiel station als bedoeld in [artikel 2.1, eerste lid][ref3], bedient.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel162
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.11
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel2.12
