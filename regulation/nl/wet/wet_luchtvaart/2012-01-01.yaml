  - number: '11.10'
    text: |-
      1 Met een gevangenisstraf van ten hoogste een jaar of een geldboete van ten hoogste de vierde categorie wordt
      gestraft degene, die handelt in strijd met de artikelen

      a. [1.2a][ref1];

      b. [2.12][ref2];

      c. [3.8, eerste lid][ref3], [3.13, vierde en vijfde lid][ref4];

      d. [11.5, vierde lid][ref5], [11.6, tweede, zesde, achtste en negende lid][ref6], [11.8, vijfde lid][ref7],
      [11.8a][ref8] voor zover het betreft de [artikelen 11.5][ref9], [11.6][ref10] en [11.8][ref11], [11.12][ref12]
      en [11.14][ref13].

      2 De in het eerste lid strafbaar gestelde feiten zijn misdrijven.


