        paragraaf: 8.5.3
        afdeling: '8.5'
  - number: '8.56'
    text: |-
      1 Indien een belanghebbende ten gevolge van een luchthavenbesluit schade lijdt of zal lijden, welke redelijkerwijs
      niet of niet geheel te zijnen laste behoort te blijven en waarvan de vergoeding niet of onvoldoende anderszins is
      verzekerd, kennen gedeputeerde staten hem op aanvraag een naar billijkheid te bepalen schadevergoeding toe.

      2 De [artikelen 8.31, tweede en derde lid][ref1], en [8.32][ref2] zijn van overeenkomstige toepassing met dien
      verstande dat bij de toepassing van [artikel 8.31, tweede lid][ref3], gedeputeerde staten in de plaats treden van
      Onze Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.31
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.32
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8.31
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.56
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.31'
        hoofdstuk: '8'
        afdeling: '8.6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8.32'
        hoofdstuk: '8'
        afdeling: '8.6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '8.31'
        hoofdstuk: '8'
        afdeling: '8.6'
  - number: '8.57'
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat kunnen regels worden gesteld ten aanzien van het
      verstrekken van geldelijke steun uit de provinciale kas aan gemeenten ter bestrijding van de kosten ten gevolge van
      uitvoering van in overeenstemming met het luchthavenbesluit gebrachte bestemmingsplannen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.57
  - number: '8.58'
    text: |-
      1 Provinciale staten stellen voor iedere luchthaven een commissie regionaal overleg luchthaven in. De
      [artikelen 107][ref1] en [152 van de Provinciewet][ref2] zijn niet van toepassing.

      2 De commissie bestaat uit een onafhankelijke voorzitter en in ieder geval uit vertegenwoordigers van:

      a. gemeenten waarin het beperkingengebied geheel of gedeeltelijk is gelegen,

      b. de exploitant van de luchthaven,

      c. de verlener van luchtverkeersdienstverlening voor zover op de luchthaven van toepassing, en

      d. omwonenden van de luchthaven.

      3 Onverminderd het tweede lid kan de commissie ook bestaan uit vertegenwoordigers van
      rechtspersoonlijkheidbezittende gebruikersorganisaties of milieuorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel152
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.58
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '152'
  - number: '8.59'
    text: |-
      1 De commissie heeft tot taak om door overleg tussen de in [artikel 8.58, tweede en derde lid][ref1], bedoelde
      betrokkenen een gebruik van de luchthaven te bevorderen dat zoveel mogelijk recht doet aan de belangen van die
      betrokkenen.

      2 Provinciale staten stellen nadere regels vast omtrent de taak, de samenstelling en de werkwijze van de commissie.
      Daarbij wordt in ieder geval bepaald welke in [artikel 8.58, tweede lid, onderdeel a][ref2], bedoelde gemeenten in
      de commissie vertegenwoordigd zijn.

      3 De voorzitter van de commissie wordt door provinciale staten benoemd, geschorst en ontslagen.

      4 Elk ander lid wordt benoemd, geschorst en ontslagen door de voorzitter op voordracht van het orgaan of de
      organisatie die het lid vertegenwoordigt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.58
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.58
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.59
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.58'
        hoofdstuk: '8'
        paragraaf: 8.3.2.7
        afdeling: 8.3.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8.58'
        hoofdstuk: '8'
        paragraaf: 8.3.2.7
        afdeling: 8.3.2
  - number: '8.60'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan aan provinciale staten een aanwijzing geven een luchthavenbesluit
      vast te stellen met inachtneming van het bepaalde bij of krachtens [artikel 8.1a, derde lid][ref1], [8.41][ref2],
      [8.44][ref3], [8.47][ref4], [8.47a][ref5] of [8.51][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1a
