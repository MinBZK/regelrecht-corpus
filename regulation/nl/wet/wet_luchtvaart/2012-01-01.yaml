  - number: '2.14'
    text: |-
      1 Er is een Adviescommissie arbeidsomstandigheden boordpersoneel Nederlandse burgerluchtvaart.

      2 De Adviescommissie heeft tot taak in het belang van de veiligheid in de burgerluchtvaart Onze Minister van
      Verkeer en Waterstaat desgevraagd of uit eigen beweging van advies te dienen over de uitvoering van het beleid
      en van de regelgeving met betrekking tot de arbeidsomstandigheden van het boordpersoneel van in Nederland
      geregistreerde burgerluchtvaartuigen.

      3 De Adviescommissie bestaat uit elf leden, die door Onze Minister van Verkeer en Waterstaat worden benoemd.
      Hiervan worden vier leden benoemd op voordracht van naar het oordeel van Onze Minister van Verkeer en Waterstaat
      representatieve organisaties van leden van het boordpersoneel, vier leden op voordracht van de betrokken
      luchtvaartmaatschappijen en drie leden als onafhankelijken.

      4 Onze Minister van Verkeer en Waterstaat wijst uit de drie onafhankelijke leden de voorzitter aan.

      5 De leden worden voor een periode van vier jaren benoemd. Aftredende leden zijn terstond herbenoembaar.

      6 Onze Minister van Verkeer en Waterstaat verleent tussentijds ontslag aan een lid:

      a. wanneer deze zijn hoedanigheid verliest op grond waarvan hij is benoemd;

      b. op eigen verzoek;

      c. bij het bereiken van de zeventigjarige leeftijd;

      d. wegens ongeschiktheid voor de functie.

      7 De Adviescommissie stelt een reglement vast ter nadere regeling van haar werkzaamheden. Het reglement wordt ter
      kennisneming toegezonden aan Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel2.14
  - number: '3.1'
    text: |-
      1 Het is verboden een luchtvaartuig te gebruiken, dat niet is voorzien van een geldig nationaliteits- en
      inschrijvingskenmerk en een geldig bewijs van inschrijving.

      2 Het is verboden:

      a. op een luchtvaartuig een ander dan het in het eerste lid bedoelde kenmerk aan te brengen, of

      b. een luchtvaartuig te gebruiken dan wel te doen of te laten gebruiken, dat is voorzien van een ander dan het in
      het eerste lid bedoelde kenmerk, met het oogmerk het te doen voorkomen, dat het luchtvaartuig is voorzien van een
      geldig kenmerk.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 De houder van een Nederlands luchtvaartuig voorziet het luchtvaartuig van:

      a. een door Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie vastgesteld
      nationaliteitskenmerk en een voor dat luchtvaartuig vastgesteld inschrijvingskenmerk; en

      b. een bewijs van inschrijving in het register, bedoeld in [artikel 3.3][ref1].

      2 De kenmerken, bedoeld in het eerste lid, bestaan voor burgerluchtvaartuigen uit letters of cijfers of een
      combinatie van beide; zij worden op bij ministeriële regeling nader aan te geven plaats, wijze en uitvoering op het
      desbetreffende luchtvaartuig aangebracht.

      3 Voor militaire luchtvaartuigen bestaat het nationaliteitskenmerk uit een afbeelding en het inschrijvingskenmerk
      uit letters of cijfers of een combinatie van beide; zij worden op bij ministeriële regeling nader aan te geven
      plaats, wijze en uitvoering op het desbetreffende luchtvaartuig aangebracht.

      4 Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan voor luchtvaartuigen, die
      naar zijn oordeel van historische waarde zijn, kenmerken toestaan, die van het eerste lid, onderdeel a, afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3.3'
        hoofdstuk: '3'
  - number: '3.3'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie houdt een register bij
      van Nederlandse burgerluchtvaartuigen respectievelijk Nederlandse militaire luchtvaartuigen. Het register voor
      burgerluchtvaartuigen is openbaar.

      2 In het register voor burgerluchtvaartuigen worden op aanvraag op naam van de aanvrager burgerluchtvaartuigen
      ingeschreven, wanneer zowel de aanvrager als de in te schrijven burgerluchtvaartuigen voldoen aan bij algemene
      maatregel van bestuur gestelde eisen. De inschrijving geschiedt voor onbepaalde tijd.

      3 In afwijking van het tweede lid kan Onze Minister van Verkeer en Waterstaat een luchtvaartuig tijdelijk
      inschrijven:

      a. indien het desbetreffende luchtvaartuig slechts voor een bepaalde termijn aan de houder ter beschikking is
      gesteld, voor ten hoogste die bepaalde termijn; of

      b. in afwachting van het voldoen aan de eisen, bedoeld in het tweede lid, voor ten hoogste zes maanden, welke
      termijn eenmaal voor ten hoogste dezelfde periode kan worden verlengd.

      4 In het buitenland geregistreerde burgerluchtvaartuigen worden niet in het register ingeschreven.

      5 Bij ministeriële regeling kan Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie
      regels geven inzake de in het register op te nemen gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan op aanvraag van de houder van een burgerluchtvaartuig de inschrijving
      wijzigen, nadat de houder de nodige gegevens heeft verstrekt en het bewijs van inschrijving, bedoeld in
      [artikel 3.5][ref1], bij Onze Minister van Verkeer en Waterstaat heeft ingeleverd.

      2 Onze Minister van Verkeer en Waterstaat kan een inschrijving ambtshalve wijzigen, wanneer:

      a. onjuiste gegevens zijn verstrekt, of

      b. de feiten die ten grondslag liggen aan de gegevens, tijdens de duur van de inschrijving wijziging hebben
      ondergaan.

      3 Onze Minister van Verkeer en Waterstaat haalt op aanvraag van de houder van een burgerluchtvaartuig de
      inschrijving door, nadat de houder de nodige gegevens heeft verstrekt en het bewijs van inschrijving, bedoeld in
      [artikel 3.5][ref2], bij Onze Minister van Verkeer en Waterstaat heeft ingeleverd.

      4 Onze Minister van Verkeer en Waterstaat kan een inschrijving ambtshalve doorhalen, wanneer:

      a. de houder ten behoeve van de inschrijving onjuiste gegevens heeft verstrekt;

      b. de houder niet meer voldoet aan de eisen, bedoeld in [artikel 3.3, tweede lid][ref3], of

      c. gedurende langer dan een jaar het desbetreffende luchtvaartuig niet voorzien is van een geldig bewijs van
      luchtwaardigheid als bedoeld in [artikel 3.8, tweede lid][ref4].

      5 Onze Minister van Verkeer en Waterstaat haalt een inschrijving ambtshalve door, wanneer het betrokken
      luchtvaartuig:

      a. in het buitenland is geregistreerd, of

      b. definitief niet meer aan het luchtverkeer deelneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3.5
