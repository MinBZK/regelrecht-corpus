  - number: '11.14'
    text: |-
      1 Het is degene, die een luchtvaartuig bedient, verboden na een ongeval of een landing, waarbij een ander is gedood
      of letsel of schade aan een ander is toegebracht, zich van de plaats van dat ongeval of die landing te verwijderen,
      tenzij hij behoorlijk de gelegenheid heeft geboden tot vaststelling van zijn identiteit en van de identiteit van
      dat luchtvaartuig.

      2 Niet strafbaar is degene, die een luchtvaartuig bedient en die zich na een ongeval of landing, bedoeld in
      het eerste lid, van de plaats van dat ongeval of die landing verwijdert doch binnen twaalf uren na dat ongeval
      of die landing en voordat hij als verdachte is aangehouden of verhoord, vrijwillig kennis geeft aan een van de
      in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren en daarbij zijn identiteit en de
      identiteit van het betrokken luchtvaartuig bekendmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel11.14
