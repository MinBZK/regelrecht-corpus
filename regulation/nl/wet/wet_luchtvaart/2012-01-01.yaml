  - number: 8a.44
    text: |-
      1 Onze Minister van Verkeer en Waterstaat meldt vóór 30 september 2008, vóór 1 april 2010 en vervolgens elke
      vijf jaar vóór 1 april aan Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer welke
      burgerluchthavens worden aangeduid als belangrijke luchthavens.

      2 Een belangrijke luchthaven is een burgerluchthaven waarop jaarlijks meer dan 50000 vliegtuigbewegingen
      plaatsvinden. Oefenvluchten met lichte vliegtuigen, als bedoeld in hoofdstuk 5.2 ECAC.CEAC Doc 29 Report on
      standard Method of Computing Noise around civil airports, worden hierbij niet meegerekend.

      3 Een wijziging van hoofdstuk 5.2 ECAC.CEAC Doc 29 gaat voor de toepassing van het tweede lid gelden met ingang van
      de dag van inwerkingtreding van deze wijziging.

      4 Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer publiceert vóór 31 december 2008, vóór
      30 juni 2010 en vervolgens elke vijf jaar vóór 30 juni in de Staatscourant welke burgerluchthavens zijn aangeduid
      als belangrijke luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8a.44
  - number: 8a.45
    text: |-
      1 Onze Minister van Verkeer en Waterstaat stelt vóór 30 juni 2007 een geluidbelastingkaart vast die betrekking
      heeft op een geluidbelasting L en geluidbelasting L veroorzaakt door de luchthaven Schiphol op woningen en bij
      algemene maatregel van bestuur aan te wijzen categorieën van andere geluidgevoelige gebouwen.

      2 Onze Minister van Verkeer en Waterstaat stelt vóór 30 juni 2012 en vervolgens vóór 30 juni van elk vijfde
      kalenderjaar een geluidbelastingkaart vast die betrekking heeft op een geluidbelasting L en geluidbelasting
      L veroorzaakt door belangrijke luchthavens op woningen en bij algemene maatregel van bestuur aan te wijzen
      categorieën van andere geluidgevoelige gebouwen.

      3 Onder geluidbelasting L wordt verstaan: geluidbelasting op een plaats en vanwege een bron als omschreven in
      bijlage I, onderdeel 1, van richtlijn nr. 2002/49/EG van het Europees Parlement en de Raad van de Europese Unie van
      25 juni 2002 inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189) over alle perioden van 07.00 tot
      19.00 uur, van 19.00 tot 23.00 uur en van 23.00 tot 07.00 uur van een jaar. Onder geluidbelasting L wordt verstaan:
      geluidbelasting op een plaats en vanwege een bron als omschreven in bijlage I, onderdeel 2, van richtlijn nr.
      2002/49/EG van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002 inzake de evaluatie en de
      beheersing van omgevingslawaai (PbEG L 189) over alle perioden van 23.00 tot 07.00 uur van een jaar.

      4 De geluidbelastingkaart geeft ten minste een weergave van:

      a. de geluidbelasting Len de geluidbelasting L veroorzaakt door een belangrijke luchthaven in de periode van een
      jaar van 1 november van het tweede jaar voorafgaand aan het jaar van vaststelling van de geluidbelastingkaart tot
      en met 31 oktober van het jaar voorafgaand aan het jaar van vaststelling van de geluidbelastingkaart, en

      b. het aantal woningen en andere geluidgevoelige gebouwen en bewoners van woningen die aan bepaalde waarden van
      geluidbelasting L en geluidbelasting L worden blootgesteld.

      5 Bij regeling van Onze Minister van Verkeer en Waterstaat worden nadere regels gesteld omtrent de inhoud,
      vormgeving en inrichting van de geluidbelastingkaart. Ten behoeve van de bepaling van de geluidsbelasting L en de
      geluidsbelasting L vanwege een luchthaven kunnen bij regeling van Onze Minister van Verkeer en Waterstaat nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8a.45
  - number: 8a.46
    text: |-
      1 De exploitant van een luchthaven verschaft ten behoeve van de vaststelling van de geluidbelastingkaart, bedoeld
      in [artikel 8a.45, eerste of tweede lid][ref1], aan Onze Minister van Verkeer en Waterstaat op zijn verzoek alle
      noodzakelijke inlichtingen en gegevens.

      2 Bij regeling van Onze Minister van Verkeer en Waterstaat kunnen nadere regels worden gesteld omtrent de te
      verschaffen inlichtingen en gegevens, waaronder de wijze waarop en de termijn waarbinnen deze moeten worden
      verschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.45
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8a.46
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a.45
        hoofdstuk: 8a
  - number: 8a.47
    text: |-
      1 Onze Minister van Verkeer en Waterstaat geeft binnen één maand na vaststelling van de geluidbelastingkaart,
      bedoeld in [artikel 8a.45, eerste of tweede lid][ref1], mededeling van deze vaststelling in één of meer dag-,
      nieuws- of huis-aan-huisbladen dan wel op andere geschikte wijze. Hierbij geeft hij aan op welke wijze kennis kan
      worden gekregen van de inhoud van de geluidbelastingkaart.

      2 Onze Minister van Verkeer en Waterstaat:

      a. stelt de geluidbelastingkaart zo mogelijk elektronisch ter beschikking van een ieder;

      b. voegt bij de geluidbelastingkaart een overzicht van de belangrijkste punten van die kaart.

      3 Onze Minister van Verkeer en Waterstaat zendt de geluidbelastingkaart binnen één maand na vaststelling aan Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.45
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8a.47
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a.45
        hoofdstuk: 8a
  - number: 8a.48
    text: |-
      1 Onze Minister van Verkeer en Waterstaat stelt vóór 18 mei 2008 aan de hand van de geluidbelastingkaart, bedoeld
      in [artikel 8a.45][ref1], een actieplan vast met betrekking tot de luchthaven. Indien er sprake is van een
      belangrijke ontwikkeling die van invloed is op de geluidhindersituatie, en daarnaast ten minste elke vijf jaar na
      de vaststelling wordt het actieplan opnieuw overwogen, en zo nodig aangepast.

      2 Het actieplan bevat ten minste een beschrijving van:

      a. het te voeren beleid om geluidbelasting L en geluidbelasting L te beperken, en

      b. de voorgenomen in de eerstvolgende vijf jaar te treffen maatregelen om overschrijding van in het
      luchthavenverkeerbesluit of luchthavenbesluit vastgestelde waarden van geluidbelasting L of geluidbelasting L te
      voorkomen of ongedaan te maken en de te verwachten effecten van die maatregelen.

      3 Op de voorbereiding van een actieplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.
      Zienswijzen kunnen naar voren worden gebracht door een ieder.

      4 Bij regeling van Onze Minister van Verkeer en Waterstaat worden nadere regels gesteld omtrent de inhoud,
      vormgeving en inrichting van het actieplan.

      5 [Artikel 8a.47][ref3] is van overeenkomstige toepassing op de vaststelling van actieplannen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.45
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.47
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8a.48
