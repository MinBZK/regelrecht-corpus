  - number: 5.14d
    text: |-
      1 Het is verboden luchtvaartnavigatiediensten te verlenen zonder te beschikken over een daartoe bestemd certificaat
      als bedoeld in artikel 7 van de luchtvaartnavigatiedienstenverordening.

      2 Onze Minister van Verkeer en Waterstaat verstrekt een certificaat als bedoeld in het eerste lid, indien de
      aanvrager voldoet aan de in artikel 6 van de luchtvaartnavigatiedienstenverordening bedoelde eisen.

      3 Aan een certificaat kunnen de voorschriften en beperkingen, zoals bedoeld in Bijlage II van de
      luchtvaartnavigatiedienstenverordening, worden verbonden.

      4 De in het derde lid bedoelde voorschriften en beperkingen kunnen tijdens de geldigheidsduur van het certificaat
      ambtshalve worden gewijzigd of aangevuld wegens:

      a. wijziging van de krachtens deze wet gestelde regels;

      b. wijziging van de kaderverordening, luchtvaartnavigatiedienstenverordening, luchtruimverordening of
      interoperabiliteitsverordening; of

      c. wijziging van bepalingen die op grond van de in onderdeel b genoemde verordeningen zijn gesteld.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de geldigheidsduur,
      aanvraag, verlening en verlenging van een certificaat.

      6 Onze Minister van Verkeer en Waterstaat neemt binnen twaalf weken na ontvangst van de aanvraag voor het verlenen
      van een certificaat een besluit omtrent de afgifte daarvan.

      7 Onze Minister van Verkeer en Waterstaat kan een certificaat geheel of gedeeltelijk schorsen, indien een ernstig
      vermoeden rijst dat de houder van het certificaat:

      a. niet voldoet aan de eisen, bedoeld in het tweede lid;

      b. niet voldoet aan de voorschriften of beperkingen, bedoeld in het derde lid; of

      c. ter verkrijging van het certificaat onjuiste of onvolledige gegevens heeft verstrekt.

      8 Onze Minister van Verkeer en Waterstaat kan een certificaat intrekken, indien:

      a. de houder van het certificaat niet voldoet aan de eisen, bedoeld in het tweede lid;

      b. de houder van het certificaat niet voldoet aan de voorschriften of beperkingen, bedoeld in het derde lid; of

      c. het certificaat gedurende ten minste drie maanden is geschorst.

      9 Dit artikel is niet van toepassing op verleners van luchtvaartnavigatiediensten die deze diensten hoofdzakelijk
      aanbieden aan andere bewegingen van luchtvaartuigen dan aan het algemeen luchtverkeer als bedoeld in
      [artikel 2.2, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.14d
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2.2'
        hoofdstuk: '2'
  - number: 5.14e
    text: |-
      Ten aanzien van de luchtverkeers-, communicatie-, navigatie- of plaatsbepalingsdiensten worden bij
      regeling van Onze Minister van Verkeer en Waterstaat veiligheidsvoorschriften vastgesteld voor technisch en
      ontwikkelingspersoneel dat operationele aan de veiligheid gerelateerde taken verricht.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.14e
  - number: '5.15'
    text: |-
      De instanties belast met het verlenen van luchtverkeersleidingsdiensten coördineren de uitvoering van deze
      taken met de instanties belast met het verlenen van luchtverkeersleidingsdiensten binnen hetzelfde gebied of in
      aangrenzende gebieden.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.15
  - number: '5.16'
    text: |-
      Onverminderd [artikel 2.1, eerste lid][ref1], is het verboden luchtverkeersdiensten te verlenen zonder een
      daartoe verkregen opdracht van een bij of krachtens [artikel 5.13][ref2], [5.14][ref3] of [5.14a][ref4] aangewezen
      instantie of van een andere verlener van luchtverkeersdiensten als bedoeld in [artikel 5.14b, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.1
