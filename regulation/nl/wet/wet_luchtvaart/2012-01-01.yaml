        artikel: '3.25'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: '3.7'
    text: |-
      Ten aanzien van burgerluchtvaartuigen worden bij of krachtens algemene maatregel van bestuur nadere regels
      gegeven ter uitvoering van [de artikelen 3.4][ref1] en [3.5][ref2]. Deze regels bevatten in ieder geval bepalingen
      betreffende:

      a. de procedure van aanvraag, wijziging of doorhaling van een inschrijving, alsmede de gegevens, welke bij elke
      procedure dienen te worden verstrekt;

      b. de vernieuwing van het inschrijvingsbewijs, en

      c. de vergoeding, die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om
      inschrijving en om wijziging of doorhaling van de inschrijving alsmede voor afgifte en vernieuwing van een bewijs
      van inschrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.7
    references:
