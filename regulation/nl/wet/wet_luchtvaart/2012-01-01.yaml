  - number: 8.25e
    text: |-
      1 Voorafgaand aan de vaststelling van de tarieven en voorwaarden, bedoeld in [artikel 8.25d, eerste lid][ref1],
      doet de exploitant van de luchthaven aan de gebruikers van de luchthaven en representatieve organisaties mededeling
      van een voorstel van deze tarieven en voorwaarden met een omschrijving van de daarvoor te leveren diensten, alsmede
      een toelichting, inhoudende een economische onderbouwing en een omschrijving, aan de hand van indicatoren, van het
      kwaliteitsniveau van de aangeboden diensten ten behoeve van het gebruik van de luchthaven.

      2 Voorafgaand aan het voorstel voor de vaststelling van de tarieven en voorwaarden, bedoeld in
      [artikel 8.25d, eerste lid][ref2], verstrekken de gebruikers aan de exploitant de bij of krachtens algemene
      maatregel van bestuur voorgeschreven informatie.

      3 De exploitant van de luchthaven raadpleegt de gebruikers van de luchthaven en representatieve organisaties over
      het voorstel, bedoeld in het eerste lid, alvorens de tarieven en voorwaarden vast te stellen.

      4 De exploitant van de luchthaven houdt bij de vaststelling van de tarieven en voorwaarden rekening met de
      zienswijze van de gebruikers van de luchthaven en van representatieve organisaties naar aanleiding van de
      raadpleging, bedoeld in het derde lid, en motiveert bij de vaststelling van de tarieven en voorwaarden zijn
      overwegingen omtrent de ingebrachte zienswijzen.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. de wijze en het tijdstip waarop de mededeling, bedoeld in het eerste lid, plaatsvindt;

      b. de wijze waarop de raadpleging, bedoeld in het derde lid, plaatsvindt;

      c. de indicatoren, bedoeld in het eerste lid;

      d. de gegevens die door de exploitant van de luchthaven moeten worden opgenomen in het voorstel voor de tarieven en
      voorwaarden, bedoeld in het eerste lid, en de daarbij behorende toelichting.

      6 De op basis van dit artikel door de exploitant aan de gebruikers van de luchthaven verstrekte informatie dient
      door de gebruikers te worden beschouwd en behandeld als bedrijfsvertrouwelijk of economisch gevoelig. De op
      basis van dit artikel door de gebruikers van de luchthaven aan de exploitant verstrekte informatie dient door de
      exploitant evenzeer te worden beschouwd en behandeld als bedrijfsvertrouwelijk of economisch gevoelig en mag door
      de exploitant bovendien niet in een tot een gebruiker herleidbare vorm in het voorstel worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25d
