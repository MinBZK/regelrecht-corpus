valid_from: '2012-01-01'
bwb_id: BWBR0005555
url: https://wetten.overheid.nl/BWBR0005555/2012-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is mede ter uitvoering van het Verdrag van Chicago (Trb.
    1973, 109), het Eurocontrol Verdrag (Trb. 1961, 62 gewijzigd Trb. 1981, 182) en de Multilaterale Overeenkomst
    betreffende "en route" heffingen (Trb. 1981, 181), nieuwe regels te stellen omtrent de bescherming van de openbare
    veiligheid bij het gebruik van het luchtruim en de bevordering van de veilige, ordelijke en vlotte afwikkeling van
    het luchtverkeer;

    dat het tevens wenselijk is om de burgerlijke luchtverkeersbeveiliging onder te brengen in een zelfstandig
    bestuursorgaan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - algemene luchtverkeersleiding: luchtverkeersleiding voor gecontroleerde vluchten;
        - AOC: door Onze Minister van Verkeer en Waterstaat aan een onderneming of groep van ondernemingen afgegeven
      document waarin wordt verklaard dat de betrokken luchtvaartexploitant beschikt over beroepsbekwaamheid en
      organisatie om luchtvaartuigen veilig te exploiteren voor de in dat bewijs gespecificeerde luchtvaartactiviteiten
      (Air Operator's Certificate);
        - burgerexploitant: houder van een vergunning voor burgermedegebruik die is afgegeven voor burgerluchtvaart van
      commerciële aard onder vaststelling van een grenswaarde voor de geluidbelasting door dat luchthavenluchtverkeer,
      anders dan in de vorm van een maximum aantal vliegtuigbewegingen;
        - burgermedegebruik: gebruik van een militaire luchthaven door andere dan militaire luchtvaart;
        - communicatiediensten: vaste en mobiele diensten ten behoeve van de luchtvaart voor grond-tot-grond, lucht-tot-
      grond en lucht-tot-lucht-communicatie voor luchtverkeersleidingsdoeleinden;
        - EASA: het Europees Agentschap voor de veiligheid van de luchtvaart;
        - Eurocontrol-organisatie: de Organisatie, ingesteld bij het op 13 december 1960 te Brussel tot stand gekomen
      Verdrag tot samenwerking in het belang van de veiligheid van de luchtvaart «Eurocontrol» (Trb. 1961, 62), zoals
      gewijzigd bij Protocol van 12 februari 1981 (Trb. 1981, 182);
        - gevaarlijke stoffen: 1°. ontplofbare stoffen of voorwerpen; 2°. samengeperste, vloeibaar gemaakte of onder druk
      opgeloste gassen; 3°. brandbare vloeistoffen; 4°. brandbare vaste stoffen, voor zelfontbranding vatbare stoffen
      en stoffen, die bij aanraking met water brandbare gassen ontwikkelen; 5°. stoffen, die de verbranding bevorderen
      en organische peroxyden; 6°. giftige of infectueuze stoffen; 7°. radioactieve stoffen; 8°. bijtende stoffen;
      9°. andere stoffen of voorwerpen, die bij vervoer door de lucht gevaar kunnen opleveren voor de gezondheid, de
      veiligheid of het milieu; indien zij krachtens [artikel 6.51][ref1] of [artikel 10.7, eerste lid][ref2], zijn
      aangewezen.
        - gezagvoerder: degene, die de leiding heeft bij en verantwoordelijk is voor de veilige uitvoering van de vlucht;
        - houder van een luchtvaartuig: degene, op wiens naam een luchtvaartuig in het register, bedoeld in
      [artikel 3.3, tweede lid][ref3], dan wel in een buitenlands register van luchtvaartuigen is ingeschreven;
        - interoperabiliteitsverordening: verordening (EG) nr. 552/2004 van het Europees Parlement en de Raad
      van de Europese Unie van 10 maart 2004 betreffende de interoperabiliteit van het Europese netwerk voor
      luchtverkeersbeveiliging (PbEU L 96);
        - kaderverordening: verordening (EG) nr. 549/2004 van het Europees Parlement en de Raad van de Europese Unie van
      10 maart 2004 tot vaststelling van het kader voor de totstandbrenging van het gemeenschappelijke Europese luchtruim
      (PbEU L 96);
        - klaring: machtiging aan de gezagvoerder van een luchtvaartuig om een vlucht aan te vangen of te vervolgen onder
      door een verlener van luchtverkeersleiding gestelde voorwaarden;
        - lid van het boordpersoneel: lid van het cockpitpersoneel en ieder, die aan boord van een luchtvaartuig ten
      behoeve van de inzittenden of de lading werkzaamheden verricht of heeft te verrichten, onder welke werkzaamheden
      mede wordt verstaan de voorbereidingshandelingen voorafgaande aan de vlucht;
        - lid van het cockpitpersoneel: ieder, die aan boord van een luchtvaartuig werkzaamheden verricht, welke van
      direct belang zijn voor de bediening van het luchtvaartuig tijdens de vlucht, onder welke werkzaamheden mede wordt
      verstaan de voorbereidingshandelingen voorafgaande aan de vlucht;
        - luchthaven: een terrein geheel of gedeeltelijk bestemd voor het opstijgen en het landen van luchtvaartuigen
      met inbegrip van: 1°. de daarmee verband houdende bewegingen van luchtvaartuigen op de grond, 2°. de afwikkeling
      van het in de aanhef en onder 1° bedoelde luchtverkeer, of 3°. bedrijfsmatige activiteiten die samenhangen met de
      afwikkeling van het in de aanhef en onder 1° bedoelde luchtverkeer;
        - luchthavenbesluit: het besluit, bedoeld in de [artikelen 8.43, eerste en tweede lid][ref4],
      [8.70, eerste lid][ref5], of [10.15][ref6];
        - luchthavengebied: het gebied dat bestemd is voor gebruik als luchthaven;
        - luchthavenindelingbesluit: het besluit, bedoeld in [artikel 8.4][ref7];
        - luchthavenluchtverkeer: het onder het begrip luchthaven, in de aanhef en onder 1°, bedoelde luchtverkeer;
        - luchthavenregeling: de regeling, bedoeld in de [artikelen 8.64, eerste lid][ref8], [8.77, eerste lid][ref9],
      of [10.39, eerste lid][ref10];
        - luchthavenverkeerbesluit: het besluit, bedoeld in [artikel 8.15][ref11];
        - luchtruimbeheer: een planningsfunctie met als belangrijkste doel een maximale benutting van beschikbaar luchtruim
      door dynamische *timesharing* en, bij gelegenheid, scheiding van luchtruim tussen verschillende categorieën
      luchtruimgebruikers op basis van kortetermijnbehoeften;
        - luchtruimblok: luchtruim van vastgestelde afmetingen, in ruimte en tijd, waarbinnen luchtvaartnavigatiediensten
      worden verleend;
        - luchtruimgebruikers: alle luchtvaartuigen die als luchtverkeer opereren;
        - luchtruimverordening: verordening (EG) nr. 551/2004 van het Europees Parlement en de Raad van de Europese Unie
      van 10 maart 2004 betreffende de organisatie en het gebruik van het gemeenschappelijk Europees luchtruim (PbEU
      L 96);
        - luchtvaartgebied: het deel van de luchthaven dat bestemd is voor luchthavenluchtverkeer;
        - luchtvaartinlichtingendienst: een binnen het vastgestelde gebied opgerichte dienst die verantwoordelijk is voor
      het verstrekken van luchtvaartinformatie en gegevens die nodig zijn voor de veiligheid, regelmaat en efficiency
      van luchtvaartnavigatie;
        - luchtvaartmaatschappij: onderneming, welke geheel of gedeeltelijk haar bedrijf maakt van het vervoer van
      personen, dieren of goederen met luchtvaartuigen;
        - luchtvaartnavigatiediensten: luchtverkeersdiensten, communicatie-, navigatie- en plaatsbepalingsdiensten,
      meteorologische diensten voor de luchtvaartnavigatie, en luchtvaartinlichtingendiensten;
        - luchtvaartnavigatiedienstenverordening: verordening (EG) nr. 550/2004 van het Europees Parlement en de
      Raad van de Europese Unie van 10 maart 2004 betreffende de verlening van luchtvaartnavigatiediensten in het
      gemeenschappelijk Europees luchtruim (PbEU L 96);
        - luchtvaartuig: toestel, dat in de dampkring kan worden gehouden ten gevolge van krachten, die de lucht daarop
      uitoefent, anders dan de krachten van de lucht tegen het aardoppervlak;
        - luchtverkeer: het geheel der verplaatsingen van luchtvaartuigen in de lucht of op een luchthaven, alsmede het
      gebruik van het luchtruim door toestellen die geen luchtvaartuigen zijn;
        - luchtverkeersbeveiliging: de verzameling van functies in de lucht en functies op de grond, te weten
      luchtverkeersdiensten, luchtruimbeheer en regeling van luchtverkeersstromen, die nodig zijn om de veiligheid en de
      doeltreffendheid van de vliegtuigbewegingen in alle fasen te waarborgen;
        - luchtverkeersdiensten: vluchtinlichtingendiensten, alarmeringsdiensten, adviesdiensten voor het luchtverkeer
      en luchtverkeersleiding, zijnde algemene luchtverkeersleiding, naderingsluchtverkeersleiding en plaatselijke
      luchtverkeersleiding;
        - luchtverkeersleidingsdienst: 'dienst die wordt verricht teneinde: 1.° botsingen te voorkomen: – tussen'
      luchtvaartuigen en – tussen luchtvaartuigen en hindernissen op dat deel van de luchthaven dat is bedoeld voor het
      opstijgen, landen en taxiën met luchtvaartuigen, en 2.° een geordende luchtverkeersstroom tot stand te brengen en
      te handhaven;
        - luchtverkeerweg: een ten behoeve van geleiding van het luchthavenluchtverkeer afgebakend deel van het luchtruim;
        - LVNL: de organisatie voor het verlenen van luchtverkeersdiensten, bedoeld in [artikel 5.22][ref12];
        - meteorologische diensten: de faciliteiten en diensten die luchtvaartuigen voorzien van weersverwachtingen,
      instructies en waarnemingen, alsmede andere meteorologische informatie en gegevens voor gebruik in de luchtvaart;
        - naderingsluchtverkeersleiding: luchtverkeersleiding voor aankomende of vertrekkende gecontroleerde vluchten;
        - navigatiediensten: de faciliteiten en diensten die luchtvaartuigen voorzien van informatie op het gebied van
      positionering en timing;
        - Nederlands luchtvaartuig: een in Nederland geregistreerd luchtvaartuig;
        - opsporingsambtenaar: de ambtenaar, bedoeld in [artikel 11.3, eerste lid][ref13];
        - plaatsbepalingsdiensten: de faciliteiten en diensten voor het bepalen van de respectieve posities van
      luchtvaartuigen waarmee voor een veilige separatie wordt gezorgd;
        - plaatselijke verkeersleiding: luchtverkeersleidingsdienst voor luchtvaartterreinverkeer;
        - regeling van luchtverkeersstromen: functie die tot doel heeft bij te dragen aan een veilige, ordelijke en vlotte
      doorstroming van het luchtverkeer door ervoor te zorgen dat de luchtverkeersleidingscapaciteit optimaal wordt
      benut en dat het verkeersvolume verenigbaar is met de door de betrokken luchtverkeersdienstverleners afgegeven
      capaciteit;
        - STD: een trainingsinstrument zijnde een vluchtnabootser, een vliegtrainingsinstrument, een trainer voor vlieg- en
      navigatieprocedures of een ander trainingsinstrument (Synthetic Training Device);
        - timesharing: de verdeling in de tijd gezien van het beschikbaar luchtruim of een gedeelte daarvan over
      luchtruimgebruikers of verschillende categorieën luchtruimgebruikers;
        - veiligheidscertificaat: verklaring dat de exploitant van de luchthaven met het veiligheidsmanagementsysteem de
      veiligheidsrisico's op die luchthaven beheerst;
        - veiligheidsmanagementsysteem: een systeem voor het management van de orde en de veiligheid op de luchthaven;
        - vergoedingenverordening: verordening (EG) nr. 1794/2006 van de Commissie van de Europese Unie van 6 december 2006
      tot vaststelling van een gemeenschappelijk heffingenstelsel voor luchtvaartnavigatiediensten (PbEU L 341);
        - verleners van luchtvaartnavigatiediensten: de openbare of particuliere lichamen die luchtvaartnavigatiediensten
      voor het luchtverkeer verlenen;
        - vlucht: de verplaatsing van het luchtvaartuig gedurende het tijdsverloop dat het in beweging komt met de
      bedoeling om op te stijgen, tot het ogenblik dat het weer tot volledige stilstand is gekomen na de landing;
        - vluchtinformatiegebied Amsterdam: het luchtruim boven het gebied, dat wordt begrensd door de rijksgrenzen en
      de kortste lijn op de ellipsoïde tussen de posities met de coördinaten 51°22'25" N 003°21'50" O en 51°30'00" N
      002°00'00" O, 51°30'00" N 002°00'00" O en 55°00'00" N 005°00'00" O, de loxodroom tussen 55°00'00" N, 005°00'00" O
      en 55°00'00" N 006°30'00" O en de kortste lijn op de ellipsoïde tussen de posities met de coördinaten 55°00'00" N
      006°30'00" O en 53°40'00" N, 006°30'00" O, uitgedrukt in het geografische referentiesysteem WGS 84;
        - voorval: een operationele onderbreking, defect, fout of andere onregelmatigheid, waardoor de vliegveiligheid
      wordt of kan worden beïnvloed, zonder dat sprake is van een ongeval of ernstig incident, als bedoeld in artikel
      3, onderdelen a en k, van [richtlijn nr. 94/56/EG](31994L0056) van de Raad van de Europese Gemeenschappen van
      21 november 1994, houdende vaststelling van de grondbeginselen voor het onderzoek van ongevallen en incidenten in
      de burgerluchtvaart (PbEG L 319);
        - voorval gevaarlijke stoffen: ongeval of incident met gevaarlijke stoffen als bedoeld in de als bijlage bij Annex
      18 bij het Verdrag inzake de internationale burgerluchtvaart (Trb. 1973, 109) behorende Technische Voorschriften
      voor het veilig vervoer van gevaarlijke stoffen door de lucht.

      2 Onder lid van het cockpitpersoneel wordt ten aanzien van onbemande luchtvaartuigen mede verstaan ieder, die
      werkzaamheden verricht, welke van direct belang zijn voor het op afstand bedienen van het luchtvaartuig.

      3 Onder luchtvaartmaatschappij wordt mede verstaan de naar privaatrecht opgerichte rechtspersoon, die zich bezig
      houdt met het vervoer van personen, dieren of goederen met luchtvaartuigen tegen vergoeding.

      4 Een wijziging van artikel 3, onderdelen a en k, van [richtlijn nr. 94/56/EG](31994L0056), gaat voor de toepassing
      van het eerste lid, onderdeel v, gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn
      uitvoering moet zijn gegeven.


