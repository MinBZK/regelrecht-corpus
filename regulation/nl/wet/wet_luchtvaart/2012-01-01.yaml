    text: |-
      1 Onze Minister van Defensie kan een bestuurlijke boete opleggen bij overtreding van:

      a. [artikel 10.17, zesde lid][ref1] juncto [artikel 8.12, tweede lid][ref2], [artikel 10.29, tweede lid][ref3]
      juncto [artikel 8.19][ref4], [artikel 10.29, derde lid][ref5] juncto [artikel 8.21][ref6],
