      - id: ref2
        bwb_id: BWBR0005555
        artikel: 8.1a
        hoofdstuk: '8'
  - number: 8a.50a
    text: |-
      1 Indien ten aanzien van de burgerluchthaven Twente een vrijstelling, als bedoeld in
      [artikel 8a.50, tweede lid][ref1], van het verbod in [artikel 8.1a, derde lid][ref2], wordt verleend, is op de
      voorbereiding van die vrijstelling [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing.

      2 Tegen een vrijstelling als bedoeld in het eerste lid kan een belanghebbende beroep instellen bij de Afdeling
      bestuursrechtspraak van de Raad van State.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.50
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
