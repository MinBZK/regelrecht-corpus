  - number: 8.49a
    text: |-
      Tijdens de periode dat wordt beslist op de aanvraag voor de verklaring veilig gebruik, bedoeld in
      [artikel 8.49, eerste lid][ref1], kan Onze Minister van Verkeer en Waterstaat het luchthavenbesluit toetsen aan het
      bepaalde bij of krachtens [artikel 8.1a, derde lid][ref2], [8.41][ref3], [8.44][ref4], [8.47][ref5], [8.47a][ref6]
      of [8.51][ref7].


