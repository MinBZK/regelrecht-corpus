  - number: '3.29'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot deze paragraaf.
      Deze regels bevatten in ieder geval bepalingen betreffende:

      a. de aanvraag en de afgifte van een erkenning;

      b. de verlenging of wijziging van een erkenning;

      c. de procedure van aanvraag, verlenging, wijziging, schorsing of intrekking van een erkenning;

      d. de vernieuwing van de erkenning,

      e. de vergoeding die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om afgifte,
      verlenging, vernieuwing of wijziging van een erkenning;

      f. de vergoeding die de aanvrager verschuldigd is voor het verlenen van toestemming tot het verrichten van
      werkzaamheden zonder erkenning als bedoeld in [artikel 3.25, derde lid][ref1] en

      g. het model en de uitvoering van de erkenningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.25
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.29
