  - number: 11.1a
    text: |-
      1 Indien een natuurlijke of rechtspersoon voldoet aan de in Bijlage I van de luchtvaartnavigatiedienstenverordening
      genoemde eisen, verleent Onze Minister van Verkeer en Waterstaat op aanvraag een erkenning om de in artikel 2,
      tweede lid, van die verordening bedoelde inspecties en onderzoeken uit te voeren.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. de in Bijlage I van de luchtvaartnavigatiedienstenverordening genoemde eisen;

      b. de aanvraag, verlening en verlenging van een erkenning;

      c. de vergoeding die de aanvrager is verschuldigd ter zake van de kosten van de handelingen met betrekking tot de
      aanvraag en verlening van de erkenning;

      d. het tarief, dat een houder van een erkenning is verschuldigd ter zake van de kosten van toezicht. Onder
      het toezicht op de naleving van de in het eerste lid bedoelde eisen behoort in ieder geval het periodiek en in
      voorkomend geval steekproefsgewijs onderzoeken van een houder.

      3 Onze Minister van Verkeer en Waterstaat kan een erkenning geheel of gedeeltelijk schorsen, indien een ernstig
      vermoeden rijst dat de houder van de erkenning:

      a. niet voldoet aan de in het eerste lid bedoelde eisen, of

      b. ter verkrijging van de erkenning onjuiste of onvolledige gegevens heeft verstrekt.

      4 Onze Minister van Verkeer en Waterstaat kan een erkenning intrekken wegens de in het derde lid genoemde redenen
      of indien de erkenning gedurende tenminste drie maanden is geschorst.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel11.1a
  - number: 11.1b
    text: |-
      1 De op basis van [artikel 11.1, tweede lid][ref1], aangewezen ambtenaren kunnen de werkzaamheden en inspecties,
      bedoeld in artikel 14, zesde lid, van richtlijn nr. 2006/23/EG van het Europees Parlement en de Raad van de
      Europese Unie van 5 april 2006 inzake een communautaire vergunning van verkeersleiders (PbEU L 114) overdragen aan
      een houder van een erkenning als bedoeld in [artikel 11.1a][ref2].

      2 Een wijziging van artikel 14, zesde lid, van richtlijn nr. 2006/23/EG van het Europees Parlement en de Raad van
      de Europese Unie van 5 april 2006 inzake een communautaire vergunning van luchtverkeersleiders (PbEU L 114) gaat
      voor de toepassing van het eerste lid gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn
      uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11.1
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11.1a
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel11.1b
