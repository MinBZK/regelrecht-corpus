  - number: 8a.51
    text: |-
      1 Gedeputeerde staten kunnen voor tijdelijk en uitzonderlijk gebruik van een terrein ontheffing verlenen van het
      verbod, bedoeld in [artikel 8.1a, eerste lid][ref1], indien het terrein wordt gebruikt door een luchtvaartuig dat
      behoort tot een bij algemene maatregel van bestuur aan te wijzen categorie.

      2 Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.

      3 Bij regeling van Onze Minister van Verkeer en Waterstaat worden regels gesteld over:

      a. het terrein;

      b. de wijze waarop het terrein wordt gebruikt;

      c. de termijn waarbinnen gedeputeerde staten een besluit nemen op de aanvraag;

      d. de wijze waarop Onze Minister van Verkeer en Waterstaat en de burgemeester van de gemeente waarin het terrein
      ligt, worden betrokken bij het verlenen van de ontheffing en bij het gebruik van het terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1a
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8a.51
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8.1a
        hoofdstuk: '8'
  - number: 8a.52
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende het gebruik van
      luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8a.52
  - number: 8a.53
    text: |-
      Wanneer de aanleg, de instandhouding of het gebruik van een werk ten behoeve van de uitvoering van de militaire
      taak op een burgerluchthaven in strijd zou komen met een bepaling van of krachtens deze wet, kunnen Wij, op
      voordracht van Onze Minister van Defensie, daarvan ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8a.53
  - number: '9.1'
    text: |-
      1 In bijzondere omstandigheden in geval van ernstige verstoring van de binnenlandse openbare orde of veiligheid
      is Onze Minister van Verkeer en Waterstaat bevoegd in overeenstemming met Onze Minister van Binnenlandse
      Zaken en Onze Minister van Defensie aan de LVNL aanwijzingen te geven met betrekking tot het verzorgen van de
      luchtverkeersbeveiliging.

      2 In bijzondere omstandigheden in verband met de handhaving van de internationale rechtsorde of met de
      internationale betrekkingen is Onze Minister van Verkeer en Waterstaat bevoegd in overeenstemming met Onze Minister
      van Buitenlandse Zaken en Onze Minister van Defensie aan de LVNL aanwijzingen te geven met betrekking tot het
      verzorgen van de luchtverkeersbeveiliging.

      3 Indien de LVNL door het uitvoeren van de aanwijzingen financieel nadeel ondervindt, ontvangt hij een naar
      billijkheid te bepalen vergoeding.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel9.1
  - number: '9.2'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone
      omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, de
      [artikelen 9.3][ref3], [9.4][ref4] en [9.5][ref5] gezamenlijk of afzonderlijk in werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.


