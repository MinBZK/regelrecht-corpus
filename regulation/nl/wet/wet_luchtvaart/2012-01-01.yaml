      na de inwerkingtreding van dit artikel en daarna steeds maandelijks, in de Staatscourant een lijst van instanties
      ten aanzien waarvan in de daaraan voorafgaande periode een beschikking tot oplegging van de bestuurlijke boete,
      bedoeld in [artikel 11.16, eerste lid, onderdeel e][ref1], of een beschikking tot toepassing van de bestuursdwang,
      bedoeld in [artikel 11.15, onderdeel b, onder 1°, 6° en 7°][ref2], onherroepelijk is geworden.


