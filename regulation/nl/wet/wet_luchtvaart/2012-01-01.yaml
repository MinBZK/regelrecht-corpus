  - number: '8.46'
    text: |-
      1 Gedeputeerde staten kunnen indien ten gevolge van groot onderhoud van een baan of door een bijzonder voorval het
      normale gebruik van de luchthaven naar hun oordeel ernstig wordt belemmerd:

      a. vrijstelling verlenen van een regel in het luchthavenbesluit;

      b. een in het luchthavenbesluit vastgelegde grenswaarde voor geluid vervangen door een andere grenswaarde.

      2 Aan een vrijstelling of vervanging kunnen beperkingen en voorschriften worden verbonden met het oog op de
      geluidbelasting, het externe-veiligheidsrisico, de vliegveiligheid of de lokale luchtverontreiniging.

      3 [Artikel 8.23, tweede lid][ref1], is van toepassing. [Artikel 8.44, vierde lid][ref2], is van overeenkomstige
      toepassing ten aanzien van de beperkingen en voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.23
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.44
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.46
