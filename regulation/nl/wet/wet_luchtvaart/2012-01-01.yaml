  - number: 8.25ga
    text: |-
      De exploitant van de luchthaven zendt de raad en de gebruikers binnen vijf maanden na afloop van het boekjaar een
      rapportage omtrent het gerealiseerde kwaliteitsniveau van de geleverde diensten ten behoeve van het gebruik van
      de luchthaven, bedoeld in [artikel 8.25e, eerste lid][ref1], over het voorafgaande boekjaar, mede aan de hand van
      ervaringen van passagiers. De rapportage omtrent het gerealiseerde kwaliteitsniveau geschiedt aan de hand van de
      indicatoren, bedoeld in [artikel 8.25e, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25e
