        artikel: '6.55'
        hoofdstuk: '6'
  - number: '6.57'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan ter uitvoering van internationale overeenkomsten of besluiten
      van volkenrechtelijke organisaties natuurlijke personen of rechtspersonen, die handelingen als bedoeld in
      [artikel 6.55, eerste lid][ref1], verrichten op zodanige wijze, dat deze voldoen aan eisen, welke gelijkwaardig
      zijn aan de krachtens [artikel 6.55][ref2] gestelde eisen, erkennen als erkende bedrijven voor zover die bedrijven
      erkend zijn door de bevoegde autoriteit van een bij ministeriële regeling aangewezen land of internationale
      organisatie. Aan de erkenning kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.55
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6.55
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel6.57
    references:
      - id: ref1
