  - number: '2.5'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan een bewijs van bevoegdheid dan wel een daarop weergegeven
      bevoegdverklaring schorsen wanneer een ernstig vermoeden rijst, dat de houder van het bewijs van bevoegdheid:

      a. niet over voldoende kennis of bedrevenheid beschikt met betrekking tot dat bewijs van bevoegdheid of die
      bevoegdverklaring;

      b. bij het verrichten van de hem toegestane werkzaamheden de veiligheid in gevaar kan brengen;

      c. niet in het bezit is van een geldige medische verklaring.

      2 Onze Minister van Verkeer en Waterstaat neemt het document waarop het geschorste bewijs van bevoegdheid of de
      geschorste bevoegdverklaring is weergegeven in. De houder van het betrokken bewijs van bevoegdheid is verplicht
      hieraan alle medewerking te verlenen. In geval van schorsing van een of meer bevoegdverklaringen verstrekt Onze
      Minister van Verkeer en Waterstaat een aan de schorsing aangepast document.

      3 Onze Minister van Verkeer en Waterstaat heft de schorsing op zodra de redenen, die tot de schorsing hebben
      geleid, zijn komen te vervallen.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot:

      a. de wijze, waarop de houder van het betrokken bewijs van bevoegdheid opnieuw kan doen blijken over voldoende
      kennis of bedrevenheid met betrekking tot het geschorste bewijs van bevoegdheid of de geschorste bevoegdverklaring
      te beschikken;

      b. de wijze, waarop de houder van het betrokken bewijs van bevoegdheid kan doen blijken, dat hij bij het verrichten
      van de hem toegestane werkzaamheden de veiligheid niet in gevaar brengt;

      c. de wijze waarop de houder van een autorisatie als bedoeld in [artikel 2.4, derde lid, onderdeel d][ref1],
      opnieuw kan doen blijken aan de bij of krachtens dat onderdeel bedoelde eisen te voldoen.

      5 Onze Minister kan een autorisatie als bedoeld in [artikel 2.4, derde lid, onderdeel d][ref2], schorsen, wanneer
      een ernstig vermoeden rijst, dat de houder van de autorisatie niet langer voldoet aan de bij of krachtens dat
      onderdeel gestelde eisen.

      6 Het eerste tot en met vierde lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.3, zesde lid, onderdeel e][ref3].

      7 Het derde lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.4, derde lid, onderdeel d][ref4].

      8 Schorsing van het bewijs van bevoegdheid betekent schorsing van op het document weergegeven bevoegdverklaringen
      voor de duur van die schorsing.

      9 Bij ministeriële regeling kan Onze Minister van Verkeer en Waterstaat regels geven met betrekking tot de
      procedure van schorsing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2.3
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
