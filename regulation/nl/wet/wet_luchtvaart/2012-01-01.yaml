    text: |-
      1 Met betrekking tot de financiering en de bekostiging van de kosten van de uitvoering van [artikel 8.74][ref1]
      wordt onder de naam «geluidsheffing burgerluchtvaart» een heffing geheven. Tevens wordt een heffing geheven ter
      financiering van de kosten van de uitvoering van [artikel 8.33][ref2].

      2 De [artikelen 8a.38, tweede tot en met vierde en zevende tot en met negende lid][ref3], en
      [8a.39 tot en met 8a.41][ref4] zijn van overeenkomstige toepassing.

      3 Het tarief van de heffing per rekeneenheid geluidsproduktie bedraagt in het jaar 2004 € 27,– en wordt met ingang
      van elk daaropvolgend kalenderjaar verhoogd met € 1,–.


