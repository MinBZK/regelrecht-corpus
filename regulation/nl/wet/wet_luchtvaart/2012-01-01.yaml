      1 Met het toezicht op de naleving van het bij of krachtens de [artikelen 8.25d tot en met 8.25h][ref1] bepaalde
      zijn belast de bij besluit van de raad van de Nederlandse Mededingingsautoriteit aangewezen ambtenaren van de
      Nederlandse Mededingingsautoriteit. De [artikelen 51][ref2], [53][ref3] en [54 van de Mededingingswet][ref4] zijn
      van overeenkomstige toepassing.

      2 Een besluit als bedoeld in het eerste lid, wordt bekendgemaakt in de Staatscourant.


