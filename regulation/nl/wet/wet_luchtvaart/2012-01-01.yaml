  - number: 8a.39
    text: |-
      1 De heffingen worden door Onze Minister van Verkeer en Waterstaat geheven.

      2 Onverminderd het overigens in dit artikel bepaalde worden de heffingen geheven met overeenkomstige toepassing
      van de [Algemene wet inzake rijksbelastingen][ref1], met dien verstande dat van [die wet][ref2] buiten toepassing
      blijven, de [artikelen 2, vierde lid][ref3], [37][ref4], [38][ref5], [47a][ref6] , [48][ref7], [52][ref8],
      [53][ref9] en [54][ref10] alsmede [68 tot en met 88][ref11].

      3 De bevoegdheden en de verplichtingen van de hierna vermelde, in de [Algemene wet inzake rijksbelastingen][ref12]
      genoemde functionarissen gelden met betrekking tot de heffingen voor de daarachter genoemde functionarissen:

      a. Onze Minister van Financiën: Onze Minister van Verkeer en Waterstaat;

      b. de inspecteur: de door Onze Minister van Verkeer en Waterstaat daartoe aan te wijzen functionaris van de
      exploitant van de luchthaven;

      4 In afwijking van het derde lid, onderdeel b, treedt voor de toepassing van
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref13] de door Onze Minister van Verkeer en
      Waterstaat aan te wijzen ambtenaar in de plaats van de inspecteur. Voorts treedt voor de toepassing van
      [artikel 28a van de Algemene wet inzake rijksbelastingen][ref14] Onze Minister van Verkeer en Waterstaat in de
      plaats van Onze Minister van Financiën.

      5 De heffingen worden geheven bij wege van aanslag. Zij worden geheven over een bij regeling van Onze Minister van
      Verkeer en Waterstaat te bepalen tijdvak.


