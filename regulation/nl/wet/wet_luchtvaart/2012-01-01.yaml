  - number: '3.6'
    text: |-
      Voor luchtvaartuigen, die behoren tot de bedrijfsvoorraad van een natuurlijke of rechtspersoon aan wie een
      erkenning als bedoeld in [artikel 3.25][ref1] is verleend, geldt het vereiste, dat een inschrijvingskenmerk
      voor een bepaald luchtvaartuig is vastgesteld, niet, mits het betrokken luchtvaartuig een inschrijvingskenmerk
      voert, dat door Onze Minister van Verkeer en Waterstaat aan die natuurlijke of rechtspersoon met het oog op de
      bedrijfsvoorraad is opgegeven. Artikel 3.2, tweede lid, is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.25
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.6
