  - number: '11.2'
    text: |-
      1 De toezichthouders kunnen hun bevoegdheid inzage te vorderen van zakelijke gegevens en bescheiden niet uitoefenen
      op taxi-, start- en landingsbanen van een luchthaven.

      2 Indien de toezichthouders toegang verlangen tot militaire terreinen of gebouwen geschiedt zulks eerst na overleg
      met Onze Minister van Defensie.

      3 In geval van onmiddellijke dreiging van gevaar zijn de toezichthouders bevoegd het bedienen of opstijgen van
      luchtvaartuigen in strijd met het bij of krachtens deze wet bepaalde te verbieden of te beletten.

      4 [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing bij uitoefening van de
      bevoegdheid door toezichthouders buiten het vluchtinformatiegebied Amsterdam.

      5 Voor de werking van dit artikel, met uitzondering van het vierde lid, wordt onder toezichthouders mede begrepen
      de inspecteur, bedoeld in [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel13
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0023746
        artikel: 1:3
  - number: 11.2a
    text: |-
      1 Tot het toezicht op de naleving van de verplichtingen, voortvloeiend uit de erkenning, bedoeld in
      [artikel 3.25][ref1], behoort in ieder geval:

      a. het periodiek onderzoeken van het erkende bedrijf;

      b. het steekproefsgewijs onderzoeken van door het erkende bedrijf vervaardigde ontwerpen, producten of onderdelen.

      De houder van een erkenning is verplicht aan voor het houden van het toezicht noodzakelijke werkzaamheden
      medewerking te verlenen.

      2 Tot het toezicht op de naleving van de verplichtingen, voortvloeiend uit de AOC, bedoeld in
      [artikel 4.1, tweede lid][ref2], behoort in ieder geval:

      a. het periodiek onderzoeken van de houder van de AOC, en

      b. het uitvoeren van inspectievluchten.

      De houder van de AOC is verplicht aan voor het houden van het toezicht noodzakelijke werkzaamheden medewerking
      te verlenen.

      3 De houder van een erkenning of een AOC is gehouden tot betaling, overeenkomstig door Onze Minister van Verkeer
      en Waterstaat te stellen regels, van het door Onze Minister van Verkeer en Waterstaat ter zake van de kosten van
      toezicht vastgestelde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.25
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel4.1
