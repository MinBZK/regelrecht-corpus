        artikel: '6.55'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6.55'
        hoofdstuk: '6'
  - number: '6.58'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan na overleg met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties in bijzondere gevallen ontheffing verlenen van de bij
      of krachtens deze titel gegeven regels, wanneer die regels in redelijkheid geen toepassing kunnen vinden en de
      veiligheid van het luchtverkeer met het verlenen van de ontheffing niet in gevaar wordt gebracht. Aan de ontheffing
      kunnen voorschriften of beperkingen worden verbonden.

      2 Het is verboden te handelen in strijd met de voorschriften of de beperkingen bedoeld in het eerste lid.

      3 De ontheffing kan worden geweigerd op grond van de openbare veiligheid.

      4 Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan na overleg met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties een ontheffing wijzigen:

      a. op verzoek van de houder;

      b. op grond van de openbare veiligheid.

      5 Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan de ontheffing intrekken,
      wanneer

      a. de redenen, waarom de ontheffing is verleend, zijn komen te vervallen;

      b. de openbare veiligheid dit vereist;

      c. de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.

      6 De aanvrager van de ontheffing of van de wijziging daarvan is Onze Minister van Verkeer en Waterstaat een door
      deze vast te stellen vergoeding voor de behandeling van de aanvraag verschuldigd, gebaseerd op de werkelijke
      kosten.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel6.58
  - number: '6.59'
    text: |-
      Het is passagiers en leden van het boordpersoneel verboden gevaarlijke stoffen aan boord van een luchtvaartuig te
      brengen, of met zich mee te voeren in hun bagage, anders dan met inachtneming van de door Onze Minister van Verkeer
      en Waterstaat respectievelijk Onze Minister van Defensie aangewezen Technische Voorschriften van de Internationale
      Burgerluchtvaartorganisatie betreffende het vervoer van gevaarlijke stoffen door de lucht.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel6.59
  - number: '6.60'
    text: |-
      1 Degene, die een handeling als bedoeld in [artikel 6.51, eerste lid][ref1], verricht, is verplicht, indien zich
      daarbij voorvallen gevaarlijke stoffen voordoen waardoor gevaar voor de openbare veiligheid is ontstaan of is te
      duchten, daarvan onverwijld mededeling te doen aan Onze Minister van Verkeer en Waterstaat respectievelijk Onze
      Minister van Defensie.

      2 Bij regeling van Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kunnen
      voorschriften worden gegeven omtrent de procedure en de wijze van mededeling als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.51
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel6.60
    references:
