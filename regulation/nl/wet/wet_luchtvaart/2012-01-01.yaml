  - number: '5.18'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bevordering van een veilige, ordelijke en vlotte
      afwikkeling van het luchtverkeer regels worden gesteld betreffende de prioriteitstelling bij het verlenen van
      luchtverkeersdiensten.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.18
  - number: '5.19'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de exploitant van een burgerluchthaven met
      inachtneming van de daarbij te stellen regels na overleg met de gebruikers en de betrokken verlener van
      luchtverkeersleidingsdiensten, de volgorde van het gebruik van de luchthaven vaststelt.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.19
  - number: '5.20'
    text: |-
      1 De gebruiker van luchtvaartnavigatiediensten, bedoeld in artikel 2, onderdeel a, van de vergoedingenverordening,
      is in het vluchtinformatiegebied Amsterdam een vergoeding verschuldigd voor de bestrijding van kosten van:

      a. luchtvaartnavigatiediensten voor «en route»-verkeer als bedoeld in de op 12 februari 1981 te Brussel gesloten
      Multilaterale Overeenkomst betreffende «en route»-heffingen (Trb. 1981, 181),

      b. plaatselijke luchtvaartnavigatiediensten.

      2 De Eurocontrol-organisatie stelt jaarlijks de hoogte van het eenheidstarief, bedoeld in artikel 13 van
      de vergoedingenverordening, vast ter berekening van de vergoeding voor luchtvaartnavigatiediensten voor «en
      route»-verkeer.

      3 Onze Minister van Verkeer en Waterstaat stelt aan de hand van voorstellen van de desbetreffende verleners van
      plaatselijke luchtvaartnavigatiediensten, jaarlijks de hoogte van het eenheidstarief, bedoeld in artikel 13 van de
      vergoedingenverordening, vast ter berekening van de vergoeding voor plaatselijke luchtvaartnavigatiediensten.

      4 De Eurocontrol-organisatie int de vergoeding ter bestrijding van de kosten voor luchtvaartnavigatiediensten voor
      «en route»-verkeer en draagt aan de desbetreffende verleners van deze diensten het hun toekomende deel van het
      geïnde bedrag af.

      5 De verleners van plaatselijke luchtvaartnavigatiediensten dragen zorg voor de inning van de vergoedingen ter
      bestrijding van de kosten van deze diensten en stemmen daartoe onderling af.

      6 Bij algemene maatregel van bestuur worden heffingszones als bedoeld in artikel 4 van de vergoedingenverordening
      vastgesteld en worden nadere voorschriften gesteld met betrekking tot de bekendmaking en de inning van
      vergoedingen, bedoeld in het vierde en het vijfde lid, en de termijnen binnen welke betaling van de vergoedingen
      plaats moet vinden.

      7 De Eurocontrol-organisatie kan rechtsvorderingen tot inning van vergoedingen als bedoeld in het vierde lid
      en van andere vergoedingen uit hoofde van de op 12 februari 1981 te Brussel gesloten Multilaterale Overeenkomst
      betreffende «en route»-heffingen (Trb. 1981, 181) uitsluitend aanhangig maken bij de arrondissementsrechtbank te
      Amsterdam.

      8 Bij algemene maatregel van bestuur kan overeenkomstig artikel 9 van de vergoedingenverordening vrijstelling
      worden verleend van betaling van vergoedingen voor luchtvaartnavigatiediensten.

      9 Bij regeling van Onze Minister van Verkeer en Waterstaat kunnen voorschriften worden gesteld met betrekking tot
      het treffen van stimuleringsmaatregelen ter verbetering van het verlenen van luchtvaartnavigatiediensten.

      10 De in het eerste lid, onderdeel b, bedoelde vergoeding moet worden betaald zonder dat dit bij beschikking is
      vastgesteld.

      11 Bij regeling van Onze Minister van Verkeer en Waterstaat worden voorschriften gesteld voor de raadpleging van
      vertegenwoordigers van luchtruimgebruikers over het vergoedingenbeleid.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.20
  - number: '5.21'
    text: |-
      1 De vergoedingenverordening en [artikel 5.20][ref1] zijn niet van toepassing op bij algemene maatregel van bestuur
      aan te wijzen luchtvaartnavigatiediensten die worden verleend op luchthavens met minder dan 50.000 commerciële
      luchtvervoersbewegingen per jaar, ongeacht de maximale startmassa en het aantal passagierszitplaatsen. Daarbij
      worden de bewegingen geteld als de som van de starts en de landingen en berekend als een gemiddelde van de
      voorafgaande drie jaar.

      2 De gebruiker van luchtvaartnavigatiediensten als bedoeld in het eerste lid is een vergoeding verschuldigd
      ter bestrijding van de kosten van de verlening van deze diensten. Bij algemene maatregel van bestuur worden
      voorschriften gesteld ten aanzien van de hoogte, de berekening, de vaststelling, de inning en de bekendmaking van
      deze vergoeding, en de termijn binnen welke betaling van deze vergoeding plaats moet vinden.

      3 De in het tweede lid bedoelde vergoeding moet worden betaald zonder dat dit bij beschikking is vastgesteld.

      4 Voor de toepassing van het eerste lid wordt de North Sea Area Amsterdam zijnde het gebied dat als NSA Amsterdam
      is gedefinieerd in de door LVNL uitgegeven luchtvaartgids, volume I, hoofdstuk ENR 6-2-5 aangemerkt als luchthaven.

      4 Bij algemene maatregel van bestuur kan vrijstelling worden verleend van de verplichting tot betaling van
      vergoedingen als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.20
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.20'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: '5.22'
    text: Er is een organisatie voor het verlenen van luchtverkeersdiensten. Hij heeft rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.22
  - number: '5.23'
    text: |-
      1 De LVNL is, ter bevordering van een zo groot mogelijke veiligheid van het luchtverkeer in het
      vluchtinformatiegebied Amsterdam, belast met de volgende taken:

      a. het verlenen van luchtverkeersdiensten;

      b. het verlenen van communicatie-, navigatie- en plaatsbepalingsdiensten;

      c. het verlenen van luchtvaartinlichtingendiensten en het uitgeven van luchtvaartpublicaties en luchtvaartkaarten;

      d. het verzorgen of doen verzorgen van opleidingen ten behoeve van luchtverkeersbeveiliging en het verlenen van
      luchtvaartnavigatiediensten;

      e. het adviseren van Onze Minister van Verkeer en Waterstaat alsmede Onze Minister van Defensie betreffende
      aangelegenheden op het gebied van de luchtverkeersbeveiliging en het verlenen van luchtvaartnavigatiediensten;

      f. het verrichten van andere bij of krachtens deze wet opgedragen taken.

      2 Onze Minister van Verkeer en Waterstaat kan de LVNL belasten met het verlenen van luchtverkeersdiensten buiten
      het vluchtinformatiegebied Amsterdam.

      3 De LVNL kan, in ieder geval tegen vergoeding van kosten, diensten aan anderen dan Onze Minister van Verkeer en
      Waterstaat en Onze Minister van Defensie verlenen op het gebied van en verband houdende met taken bedoeld in het
      eerste lid. De in de eerste volzin bedoelde diensten kunnen buiten het vluchtinformatiegebied Amsterdam worden
      verleend.

      4 De LVNL kan, onverminderd zijn verantwoordelijkheid voor de uitvoering van de aan hem opgedragen taken,
      luchtverkeersdiensten laten verrichten door een andere verlener van luchtverkeersdiensten, indien hiervoor
      instemming is verleend op grond van [artikel 5.14b, eerste lid][ref1].

      5 De LVNL kan, onverminderd zijn verantwoordelijkheid voor de uitvoering van de aan hem opgedragen taken,
      luchtvaartnavigatiediensten anders dan de in het vierde lid bedoelde diensten laten verrichten door een andere
      verlener van luchtvaartnavigatiediensten.

      6 De LVNL kan, onverminderd zijn verantwoordelijkheid voor de uitvoering van de aan hem opgedragen taken, andere
      werkzaamheden dan die zijn bedoeld in het vierde en vijfde lid laten verrichten door derden, voor zover deze
      werkzaamheden een ondersteunend karakter hebben.

      7 De LVNL is verplicht zijn taken te verrichten overeenkomstig het bepaalde in Nederland bindende verdragen en
      besluiten van volkenrechtelijke organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.14b
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.23
