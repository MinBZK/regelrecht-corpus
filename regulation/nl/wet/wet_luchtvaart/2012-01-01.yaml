  - number: '6.54'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan na overleg met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties in het belang van de openbare veiligheid ten aanzien van
      luchtvaartuigen die door hem aangewezen gevaarlijke stoffen vervoeren, bepalen dat die luchtvaartuigen uitsluitend
      van door hem aangewezen luchthavens mogen starten of op die luchthavens mogen landen.

      2 Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan na overleg met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties in het belang van de openbare veiligheid bepalen, dat de
      in het eerste lid bedoelde gevaarlijke stoffen op de in het eerste lid bedoelde luchthavens slechts mogen worden
      geladen, gelost of neergelegd op door hem op die luchthavens aangewezen plaatsen.

      3 Onze Minister van Defensie kan ten aanzien van militaire helikopters de in het eerste en tweede lid bedoelde
      beperkingen ook doen gelden voor door hem aangewezen terreinen, niet zijnde luchthavens.

      4 Het is verboden te handelen in strijd met het bepaalde krachtens het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel6.54
  - number: '6.55'
    text: |-
      1 Het is verboden gevaarlijke stoffen ten vervoer aan te bieden, te vervoeren, te doen of laten vervoeren met
      luchtvaartuigen, zonder een door Onze Minister van Verkeer en Waterstaat verleende erkenning.

      2 Een erkenning wordt verleend voor een bij algemene maatregel van bestuur vast te stellen termijn, dan wel voor
      onbepaalde tijd indien door de betrokken natuurlijke persoon of rechtspersoon voldaan wordt aan de bij of krachtens
      die maatregel met betrekking tot de erkenning gestelde eisen. Aan de erkenning kunnen voorschriften of beperkingen
      worden verbonden.

      3 Bij algemene maatregel van bestuur wordt aangegeven welke erkenningen Onze Minister van Verkeer en Waterstaat kan
      verlenen, alsmede de bevoegdheden, welke aan iedere erkenning verbonden zijn.

      4 Onze Minister van Verkeer en Waterstaat kan een erkenning geheel of gedeeltelijk schorsen, wanneer een ernstig
      vermoeden rijst, dat de betrokken natuurlijke persoon of rechtspersoon:

      a. niet voldoet aan de eisen, gesteld krachtens het tweede lid;

      b. handelt in strijd met het bij of krachtens deze titel bepaalde.

      Hij heft de schorsing op zodra de redenen van de schorsing zijn komen te vervallen.

      5 Onze Minister van Verkeer en Waterstaat kan een erkenning intrekken, wanneer:

      a. de houder daarom verzoekt;

      b. de houder niet voldoet aan de eisen, gesteld krachtens het tweede lid;

      c. de houder krachtens de hem verleende erkenning werkzaamheden verricht, waartoe deze niet erkend is;

      d. de houder handelt in strijd met de[ artikelen 6.51, tweede lid][ref1], of [6.52][ref2];

      e. de erkenning gedurende ten minste drie maanden is geschorst;

      f. de houder in staat van faillissement verkeert.

      6 Bij regeling van Onze Minister van Verkeer en Waterstaat kunnen regels gegeven worden met betrekking tot de
      procedure van aanvraag, afgifte, wijziging, verlenging, schorsing en intrekking van erkenningen, alsmede de
      vergoeding die de aanvrager van de erkenning verschuldigd is voor de kosten van de behandeling van zijn aanvraag om
      afgifte, wijziging of verlenging, welke gebaseerd is op de werkelijke kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.51
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6.52
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel6.55
