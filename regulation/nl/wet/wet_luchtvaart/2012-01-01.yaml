        afdeling: 8.3.2
  - number: '8.47'
    text: |-
      1 In het luchthavenbesluit worden ten behoeve van de ruimtelijke indeling van het gebied van en rond de luchthaven,
      het luchthavengebied en het beperkingengebied vastgesteld.

      2 De [artikelen 8.5, derde tot en met vijfde lid][ref1], [8.6][ref2], [8.7, eerste en derde lid][ref3],
      [8.8][ref4], [8.9][ref5], [8.10][ref6], [8.11][ref7] en [8.12, eerste tot en met vierde lid][ref8],
      zijn van overeenkomstige toepassing met dien verstande dat de verklaring van geen bezwaar, bedoeld in
      [artikel 8.9, derde lid][ref9], respectievelijk de ontheffing, bedoeld in [artikel 8.12, derde lid][ref10], wordt
      verleend door gedeputeerde staten.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de in luchthavenbesluiten op
      te nemen regels omtrent de vaststelling van het luchthavengebied en het beperkingengebied. Deze maatregel stelt ten
      aanzien van het beperkingengebied in ieder geval regels ten aanzien van:

      a. de bestemming en het gebruik van grond in verband met het externe-veiligheidsrisico vanwege het
      luchthavenluchtverkeer;

      b. de bestemming en het gebruik van grond in verband met de geluidbelasting vanwege het luchthavenluchtverkeer;

      c. de bestemming en het gebruik van de grond waaronder begrepen de maximale hoogte van objecten in, op of boven de
      grond, in verband met de vliegveiligheid.

      4 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.5
