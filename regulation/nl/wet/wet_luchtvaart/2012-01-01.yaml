  - number: '11.4'
    text: |-
      1 Op eerste vordering van een opsporingsambtenaar is degene, die op grond van artikel 2.1 in het bezit dient te
      zijn van een bewijs van bevoegdheid, een bewijs van gelijkstelling of een medische verklaring, verplicht dat bewijs
      of die verklaring behoorlijk ter inzage af te geven.

      2 Op eerste vordering van een opsporingsambtenaar is het lid van het boordpersoneel, dat werkzaamheden verricht
      of aanstalten maakt werkzaamheden te gaan verrichten, verplicht zijn medewerking te verlenen aan een voorlopig
      onderzoek van uitgeademde lucht en daartoe volgens de door de opsporingsambtenaar te geven aanwijzingen ademlucht
      te blazen in een door die ambtenaar aangewezen apparaat.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel11.4
  - number: '11.5'
    text: |-
      1 Een opsporingsambtenaar kan het lid van het boordpersoneel van wie, uit het in [artikel 11.4, tweede lid][ref1],
      bedoelde onderzoek of op andere wijze, naar het oordeel van de opsporingsambtenaar gebleken is dat hij onder
      zodanige invloed van een stof, als bedoeld in [artikel 2.12, eerste lid][ref2], verkeert, dat hij onvoldoende
      in staat is zijn werkzaamheden behoorlijk te verrichten, een vliegverbod opleggen voor de tijd gedurende welke
      redelijkerwijs verwacht mag worden dat deze toestand zal voortduren, tot ten hoogste vierentwintig uren. De vorige
      volzin is van overeenkomstige toepassing op het lid van het boordpersoneel, dat aanstalten maakt zijn werkzaamheden
      te gaan verrichten.

      2 In geval van verdenking van overtreding van [artikel 2.12, tweede lid][ref3], kan een opsporingsambtenaar aan het
      betreffende lid van het boordpersoneel een vliegverbod opleggen tot ten hoogste vierentwintig uren.

      3 De opsporingsambtenaar, die een verbod als bedoeld in het eerste of tweede lid oplegt, legt dit vast in een
      beschikking die het tijdstip van ingang en de duur van het verbod bevat.

      4 Het is een lid van het boordpersoneel verboden de werkzaamheden, die hij moet verrichten, te verrichten gedurende
      de tijd waarvoor een vliegverbod als bedoeld in het eerste of tweede lid, geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11.4
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.12
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2.12
