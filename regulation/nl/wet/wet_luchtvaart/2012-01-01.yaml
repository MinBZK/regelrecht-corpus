        afdeling: '8.4'
  - number: '8.26'
    text: |-
      Een ministeriële regeling op grond van deze afdeling wordt vastgesteld door Onze Minister van Verkeer en Waterstaat
      in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.26
  - number: '8.27'
    text: |-
      1 De exploitant van de luchthaven draagt zorg voor het registreren van de veiligheids- en milieubelasting vanwege
      het luchthavenluchtverkeer. Hij verricht de metingen en berekeningen die voor die registratie noodzakelijk zijn.

      2 Het registreren wordt zodanig uitgevoerd dat een vergelijking mogelijk is met de in artikel 8.17, vierde lid,
      bedoelde grenswaarden.

      3 Bij ministeriële regeling worden nadere regels gesteld omtrent het registreren en omtrent de metingen en
      berekeningen die daartoe noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.27
  - number: '8.28'
    text: |-
      1 De exploitant van de luchthaven verstrekt de inspecteur-generaal:

      a. de op grond van [artikel 8.27][ref1] geregistreerde gegevens;

      b. gegevens over de in [artikel 8.27][ref2] bedoelde metingen en berekeningen.

      2 De exploitant, de verlener van luchtverkeersdiensten en de luchtvaartmaatschappijen verstrekken de inspecteur-
      generaal gegevens over de ter uitvoering van [artikel 8.18][ref3] getroffen voorzieningen.

      3 De exploitant verstrekt de inspecteur-generaal gegevens over de afwijkingen, bedoeld in [artikel 8.19][ref4].
      De verlener van luchtverkeersdiensten verstrekt de inspecteur-generaal gegevens over de afwijkingen, bedoeld in de
      [artikelen 8.20][ref5] en [8.21][ref6].

      4 Bij ministeriële regeling worden nadere regels gesteld omtrent de gegevensverstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.27
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.27
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8.18
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel8.19
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel8.20
      [ref6]: https://wetten.overheid.nl/BWBR0005555#Artikel8.21
