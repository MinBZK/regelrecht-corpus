  - number: 8.25h
    text: |-
      1 De exploitant van de luchthaven zendt de raad een afschrift van de mededeling, bedoeld in
      [artikel 8.25d, eerste lid][ref1], en van de mededeling, bedoeld in [artikel 8.25e, eerste lid][ref2].

      2 De raad is bevoegd van de exploitant van de luchthaven alle inlichtingen en gegevens te verlangen, die hij voor
      de uitoefening van zijn taak op grond van deze wet redelijkerwijs nodig acht.

      3 De exploitant van de luchthaven verleent binnen de door de raad gestelde redelijke termijn alle medewerking
      die deze redelijkerwijs kan verlangen bij de uitoefening van zijn bevoegdheden op grond van deze wet.
      [Artikel 4:15 van de Algemene wet bestuursrecht][ref3] is van overeenkomstige toepassing.

      4 Onze Minister van Verkeer en Waterstaat en Onze Minister van Justitie verstrekken de raad desgevraagd de
      inlichtingen en gegevens die deze voor de uitoefening van zijn taak nodig heeft.

      5 De raad gebruikt de gegevens of inlichtingen die hij heeft verkregen op grond van deze wet uitsluitend voor de
      uitoefening van zijn bevoegdheden op grond van deze wet.

      6 Ingeval van overtreding van het derde lid is [hoofdstuk 8 van de Mededingingswet][ref4], met uitzondering van de
      [artikelen 71 tot en met 76][ref5] en [artikel 80][ref6], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25d
