      - id: ref1
        bwb_id: BWBR0005555
        artikel: 5.14b
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: '5.24'
    text: De LVNL heeft een bestuur en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.24
  - number: '5.25'
    text: |-
      1 Het bestuur bestaat uit ten hoogste drie leden. De raad van toezicht stelt het aantal leden en hun onderlinge
      taakverdeling vast.

      2 De hoedanigheid van lid van het bestuur is onverenigbaar met het lidmaatschap van de raad van toezicht.

      3 Onze Minister van Verkeer en Waterstaat benoemt, schorst en ontslaat de leden van het bestuur op voordracht van
      de raad van toezicht. De raad van toezicht besluit terzake van de voordracht met een meerderheid van het aantal
      leden.

      4 De leden van het bestuur worden benoemd voor een periode van ten hoogste vijf jaren. Bij afloop van deze termijn
      kunnen zij worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.25
  - number: '5.26'
    text: |-
      1 Het bestuur is belast met de dagelijkse leiding van de LVNL.

      2 Alle bevoegdheden van de LVNL welke niet bij of krachtens deze wet aan de raad van toezicht zijn opgedragen,
      komen toe aan het bestuur.

      3 Het bestuur verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak benodigde inlichtingen en
      andere gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.26
  - number: '5.27'
    text: |-
      1 Het bestuur vertegenwoordigt de LVNL in en buiten rechte.

      2 Het bestuur kan onder zijn verantwoordelijkheid de vertegenwoordiging, bedoeld in het eerste lid, opdragen aan
      een of meer bestuursleden of andere personen. Het kan bepalen dat deze vertegenwoordiging uitsluitend betrekking
      heeft op bepaalde onderdelen van de taak van de LVNL dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.27
  - number: '5.28'
    text: |-
      Ingeval van schorsing of ontstentenis van een lid van het bestuur voorziet de raad van toezicht in de waarneming
      van zijn functie.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.28
  - number: '5.29'
    text: |-
      Het bestuur legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de raad van toezicht
      bijzondere aanleiding bestaat, aan de raad van toezicht verantwoording af over het door hem gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.29
  - number: '5.30'
    text: |-
      De raad van toezicht bestaat uit zes leden, waaronder de voorzitter, alsmede een waarnemer, die de Minister van
      Verkeer en Waterstaat in de raad van toezicht vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.30
  - number: '5.31'
    text: |-
      1 De leden van de raad van toezicht worden zonder last of ruggespraak benoemd voor een tijdvak van vier jaren
      en zijn eenmaal voor een tijdvak van vier jaren herbenoembaar. Hun kan tussentijds op eigen verzoek, dan wel om
      zwaarwichtige redenen ontslag worden verleend.

      2 De waarnemer in de raad van toezicht wordt aangewezen voor een tijdvak van vier jaren en kan eenmaal voor
      een tijdvak van vier jaar opnieuw worden aangewezen. De aanwijzing kan tussentijds op eigen verzoek, dan wel om
      zwaarwichtige redenen worden ingetrokken.

      3 Onze Minister van Verkeer en Waterstaat benoemt, schorst en ontslaat de leden, met dien verstande dat:

      a. een lid wordt benoemd op voordracht van Onze Minister van Defensie;

      b. twee leden worden benoemd op voordracht van de raad van toezicht uit verschillende in Nederland werkzame
      luchtvaartmaatschappijen;

      c. een lid wordt benoemd op voordracht van de raad van toezicht uit de kring van de exploitanten van Nederlandse
      luchthavens; en

      d. een lid, tevens voorzitter, wordt benoemd op voordracht van de raad van toezicht. Omtrent de voordracht
      besluiten de leden van de raad van toezicht met gewone meerderheid, met dien verstande dat de voorzitter niet
      deelneemt aan de vaststelling van de voordracht.

      4 Zolang in een vacature in de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad van
      toezicht, met de bevoegdheid van de volledige raad.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.31
  - number: '5.32'
    text: |-
      1 De raad van toezicht ziet toe op de werkzaamheden van het bestuur, en staat dit met raad terzijde.

      2 Bij de vervulling van hun taak nemen de leden van de raad van toezicht tot richtsnoer de verwezenlijking van de
      taakstelling en het belang van de LVNL waaronder de continuïteit van zijn bedrijfsvoering.

      3 Besluiten van het bestuur betreffende de volgende onderwerpen behoeven voorafgaande instemming van de raad van
      toezicht:

      a. de reglementen bedoeld in [de artikelen 5.34][ref1], [5.36][ref2], [5.37][ref3] en [5.39][ref4];

      b. voorstellen aan Onze Minister van Verkeer en Waterstaat met betrekking tot de hoogte van het
      eenheidstarief, bedoeld in [artikel 5.20, derde lid][ref5], en de hoogte van de vergoeding, bedoeld in
      [artikel 5.21, tweede lid][ref6];

      c. investeringen die een door de raad van toezicht vast te stellen bedrag te boven gaan;

      d. de financiële begroting, en het financiële meerjarenbeleidsplan;

      e. het jaarverslag en de jaarrekening;

      f. het aangaan of garanderen van geldleningen die een door de raad van toezicht vast te stellen bedrag te boven
      gaan;

      g. de bij of krachtens de wet aan Onze Minister van Verkeer en Waterstaat uit te brengen rapportages.

      4 De raad van toezicht kan geen rechtsgeldige besluiten nemen indien niet tenminste tweederde van het aantal leden
      ter vergadering aanwezig is.

      5 De raad van toezicht stelt bij reglement zijn werkwijze vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.34
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.36
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5.37
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel5.39
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel5.20
      [ref6]: https://wetten.overheid.nl/BWBR0005555#Artikel5.21
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.32
    references:
