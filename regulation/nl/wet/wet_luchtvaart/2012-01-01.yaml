        bwb_id: BWBR0005555
        artikel: '3.4'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3.5'
        hoofdstuk: '3'
  - number: '3.8'
    text: |-
      1 Het is verboden een vlucht uit te voeren met een luchtvaartuig, dat:

      a. niet luchtwaardig is, of

      b. niet voorzien is van een geldig bewijs van luchtwaardigheid.

      2 Voor het uitvoeren van een vlucht met een Nederlands luchtvaartuig is een door Onze Minister van Verkeer en
      Waterstaat respectievelijk Onze Minister van Defensie afgegeven bewijs van luchtwaardigheid vereist.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.8
  - number: '3.9'
    text: |-
      1 Onze Minister van Defensie geeft met betrekking tot een type-ontwerp van een militair luchtvaartuig dan wel van
      een voortstuwingsinrichting of propeller bestemd voor een militair luchtvaartuig, een type-certificaat af, indien
      wordt voldaan aan de bij regeling van Onze Minister van Defensie gestelde eisen.

      2 Een type-certificaat wordt afgegeven voor onbepaalde tijd.

      3 Het type-certificaat geldt ten aanzien van alle militaire luchtvaartuigen, voortstuwingsinrichtingen of
      propellers bestemd voor een militair luchtvaartuig, die conform het onderzochte type-ontwerp zijn.

      4 Onze Minister van Defensie wijzigt een type-certificaat, wanneer voldaan wordt aan de bij regeling van Onze
      Minister van Defensie gestelde eisen.

      5 Onze Minister van Defensie kan een aanvullend type-certificaat afgeven. Het eerste tot en met vierde lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.9
  - number: '3.12'
    text: |-
      1 Onze Minister van Defensie kan een typecertificaat of aanvullend type-certificaat schorsen, wanneer een ernstig
      vermoeden rijst, dat met betrekking tot de luchtvaartuigen dan wel voortstuwingsinrichtingen of propellers waarvoor
      dat type-certificaat of aanvullend typecertificaat is afgegeven, niet aan de bij regeling van Onze Minister van
      Defensie gestelde eisen wordt voldaan.

      2 Onze Minister van Defensie heft de schorsing op zodra de redenen van de schorsing zijn komen te vervallen.

      3 Onze Minister van Defensie kan een typecertificaat of aanvullend type-certificaat intrekken, wanneer de
      luchtvaartuigen dan wel voortstuwingsinrichtingen of propellers met betrekking waartoe dat type-certificaat is
      afgegeven, niet aan daarvoor bij regeling van Onze Minister van Defensie gestelde eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.12
  - number: '3.13'
    text: |-
      1 Bij algemene maatregel van bestuur wordt aangegeven welke bewijzen van luchtwaardigheid Onze Minister van Verkeer
      en Waterstaat kan afgeven, alsmede de verplichtingen en de bevoegdheden, welke aan ieder bewijs verbonden zijn.

      2 Van overeenkomstige toepassing op niet-militaire staatsluchtvaartuigen zijn:

      a. de [Verordening (EG) 1592/2002](32002R1592) van het Europese Parlement en de Raad van 15 juli 2002 tot
      vaststelling van gemeenschappelijke regels op het gebied van burgerluchtvaart en tot oprichting van een Europees
      Agentschap voor de veiligheid van de luchtvaart (PbEU L 240),

      b. de [Verordening (EG) nr. 1702/2003](32003R1702) van de Commissie van de Europese Gemeenschappen van 24
      september 2003 tot vaststelling van uitvoeringsvoorschriften inzake de luchtwaardigheid en milieucertificering
      van luchtvaartuigen en aanverwante producten, onderdelen en uitrustingsstukken, alsmede voor de certificering van
      ontwerp- en productieorganisaties (PbEU L 243), en

      c. de [Verordening (EG) nr. 2042/2003](32003R2042) van de Commissie van de Europese Gemeenschappen van 20 november
      2003 betreffende de permanente luchtwaardigheid van luchtvaartuigen en luchtvaartproducten, -onderdelen en
      -uitrustingsstukken, en betreffende de goedkeuring van bij voornoemde taken betrokken organisaties en personen
      (PbEU L 315).

      3 In de algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden aangegeven in welke gevallen aan de
      houder van een luchtvaartuig, waarvoor EASA geen type-certificaat of aanvullend type-certificaat heeft afgegeven,
      Onze Minister van Verkeer en Waterstaat een type-certificaat, aanvullend type-certificaat dan wel een bewijs van
      luchtwaardigheid kan afgeven of wijzigen.

      4 Aan een bewijs van luchtwaardigheid kunnen voorschriften of beperkingen worden verbonden. Het is verboden in
      strijd met die voorschriften of beperkingen te handelen.

      5 Onze Minister van Verkeer en Waterstaat kan met betrekking tot een luchtvaartuig, dat naar zijn oordeel van
      historische waarde is en niet voldoet aan de eisen van EASA, een bewijs van luchtwaardigheid afgeven, mits het
      betrokken luchtvaartuig voldoet aan de bij regeling van Onze Minister van Verkeer en Waterstaat met betrekking tot
      de luchtwaardigheid van dat luchtvaartuig gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.13
  - number: '3.14'
    text: |-
      1 Onze Minister van Defensie geeft met betrekking tot Nederlandse militaire luchtvaartuigen bewijzen van
      luchtwaardigheid af, indien:

      a. ten aanzien van het betrokken type-ontwerp een typecertificaat is afgegeven als bedoeld in
      [artikel 3.9, eerste lid][ref1]; en

      b. het betrokken luchtvaartuig voldoet aan de bij ministeriële regeling gestelde eisen; deze eisen kunnen voor
      verschillende categorieën luchtvaartuigen verschillend zijn.

      2 Bij ministeriële regeling wordt aangegeven welke bewijzen van luchtwaardigheid Onze Minister van Defensie kan
      afgeven.

      3 In afwijking van het eerste lid, onder a, wordt in de ministeriële regeling, bedoeld in het tweede lid,
      aangegeven in welke gevallen met betrekking tot een militair luchtvaartuig, waarvoor geen type-certificaat is
      afgegeven, door Onze Minister van Defensie een bewijs van luchtwaardigheid kan worden afgegeven.

      4 Aan een bewijs van luchtwaardigheid kunnen voorschriften of beperkingen worden verbonden. Het is verboden in
      strijd met die voorschriften of beperkingen te handelen.

      5 Onze Minister van Defensie kan met betrekking tot een luchtvaartuig, dat naar zijn oordeel van historische
      waarde is en niet voldoet aan een van de eisen, bedoeld in het eerste lid, een bewijs als bedoeld in het tweede
      lid afgeven. Het betrokken luchtvaartuig dient te voldoen aan door Onze Minister van Defensie met betrekking tot de
      luchtwaardigheid van dat luchtvaartuig gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.9
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3.9'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: '3.15'
    text: |-
      1 Het bewijs van luchtwaardigheid voor burgerluchtvaartuigen wordt afgegeven voor onbepaalde tijd dan wel
      voor een bij algemene maatregel van bestuur vast te stellen termijn, welke voor de verschillende bewijzen van
      luchtwaardigheid verschillend kan zijn.

      2 Op aanvraag van de houder verlengt Onze Minister van Verkeer en Waterstaat het bewijs van luchtwaardigheid voor
      een burgerluchtvaartuig, indien wordt voldaan aan de bij of krachtens [artikel 3.13][ref1] gestelde eisen.

      3 Het bewijs van luchtwaardigheid voor militaire luchtvaartuigen wordt afgegeven voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.13
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3.13'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: '3.16'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan op aanvraag van de houder een bewijs van luchtwaardigheid voor een
      burgerluchtvaartuig wijzigen, nadat hij het bewijs van luchtwaardigheid bij Onze Minister van Verkeer en Waterstaat
      daartoe heeft ingeleverd.

      2 Onze Minister van Verkeer en Waterstaat wijzigt een bewijs van luchtwaardigheid voor een burgerluchtvaartuig
      ambtshalve, indien aan het betrokken burgerlichtvaartuig veranderingen zijn aangebracht, die de gegevens als
      vermeld op het bewijs van luchtwaardigheid beïnvloeden.

      3 In de gevallen, bedoeld in het tweede lid, levert de houder van het betrokken burgerluchtvaartuig op eerste
      vordering van Onze Minister van Verkeer en Waterstaat, terstond het betrokken bewijs «van luchtwaardigheid bij Onze
      Minister» van Verkeer en Waterstaat ter wijziging in.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.16
  - number: '3.17'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan een bewijs van luchtwaardigheid voor een burgerluchtvaartuig
      schorsen, wanneer:

      a. een ernstig vermoeden rijst dat het betrokken luchtvaartuig niet lichtwaardig is;

      b. het desbetreffende luchtvaartuig niet meer in het register, bedoeld in [artikel 3.3][ref1], is ingeschreven;

      c. de houder van het betrokken luchtvaartuig dat luchtvaartuig niet overeenkomstig bij of krachtens algemene
      maatregel van bestuur gestelde eisen onderhoudt of laat onderhouden, of

      d. de houder van het betrokken luchtvaartuig anderszins het bij of krachtens dit hoofdstuk bepaalde niet nakomt.

      2 Onze Minister van Verkeer en Waterstaat heft de schorsing op zodra de redenen van de schorsing zijn komen te
      vervallen.

      3 Onze Minister van Verkeer en Waterstaat trekt een bewijs van luchtwaardigheid voor een burgerluchtvaartuig
      ambtshalve in, wanneer:

      a. het type-certificaat met betrekking tot dat luchtvaartuig is ingetrokken;

      b. ter verkrijging van het bewijs van luchtwaardigheid onjuiste gegevens zijn verstrekt, of

      c. het betrokken luchtvaartuig onherstelbaar is beschadigd.

      4 Onze Minister van Verkeer en Waterstaat kan een bewijs van luchtwaardigheid voor een burgerluchtvaartuig
      intrekken, wanneer:

      a. het betrokken luchtvaartuig anders dan wegens onherstelbare beschadiging niet luchtwaardig is, of

      b. het bewijs van luchtwaardigheid gedurende ten minste drie maanden is geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3.3'
        hoofdstuk: '3'
  - number: '3.18'
    text: |-
      1 Onze Minister van Defensie kan een bewijs van luchtwaardigheid voor een militair luchtvaartuig schorsen, wanneer:

      a. een ernstig vermoeden rijst dat het betrokken luchtvaartuig niet luchtwaardig is, of

      b. het type-certificaat met betrekking tot dat luchtvaartuig is geschorst of ingetrokken.

      2 Onze Minister van Defensie heft de schorsing op zodra de redenen van de schorsing zijn komen te vervallen.

      3 Onze Minister van Defensie trekt een bewijs van luchtwaardigheid voor een militair luchtvaartuig in, wanneer het
      betrokken luchtvaartuig:

      a. onherstelbaar is beschadigd, of

      b. definitief buiten gebruik wordt gesteld.

      4 Onze Minister van Defensie kan een bewijs van luchtwaardigheid voor een militair luchtvaartuig intrekken, wanneer
      het betrokken luchtvaartuig anders dan wegens onherstelbare beschadiging niet luchtwaardig is.

      5 Bij ministeriële regeling kunnen nadere regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.18
  - number: '3.19'
    text: |-
      1 De houder van een burgerluchtvaartuig, waarvan het type-certificaat, het beperkt type-certificaat of het
      aanvullend type-certificaat afgegeven door de EASA is ingetrokken, dan wel het bewijs van luchtwaardigheid is
      geschorst of ingetrokken, levert op eerste vordering van Onze Minister van Verkeer en Waterstaat het bewijs van
      luchtwaardigheid van het betrokken luchtvaartuig, terstond in bij Onze Minister van Verkeer en Waterstaat.

      2 Wanneer de schorsing wordt opgeheven doet Onze Minister van Verkeer en Waterstaat het ingeleverde bewijs van
      luchtwaardigheid terstond wederom toekomen aan de houder van het betrokken luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.19
  - number: 3.19a
    text: |-
      1 Het is verboden een vlucht uit te voeren met een burgerluchtvaartuig, dat:

      a. niet voldoet aan de voor dat luchtvaartuig geldende geluidseisen, of

      b. niet is voorzien van een geldig voor dat luchtvaartuig afgegeven geluidscertificaat of van een passende
      verklaring in een ander document dat door de staat van registratie is goedgekeurd voor zover dit voor dat
      luchtvaartuig vereist is.

      2 Voor het uitvoeren van een vlucht met een Nederlands burgerluchtvaartuig dat is voorzien van een
      voortstuwingsinrichting is vereist een door Onze Minister van Verkeer en Waterstaat afgegeven (voorlopig)
      geluidscertificaat, (voorlopige) geluidsverklaring of (voorlopige) aanvullende geluidsverklaring.

      3 Bij of krachtens algemene maatregel van bestuur wordt aangegeven in welke gevallen aan de houder van een
      burgerluchtvaartuig, waarvoor geen type-certificaat is afgegeven, door Onze Minister van Verkeer en Waterstaat een
      geluidscertificaat kan worden afgegeven.

      4 Een geluidscertificaat wordt afgegeven voor onbepaalde tijd. Vooruitlopend op de afgifte van een
      geluidscertificaat kan een voorlopig geluidscertificaat worden afgegeven.

      5 Aan een geluidscertificaat dan wel een voorlopig geluidscertificaat kunnen voorschriften of beperkingen worden
      verbonden in verband met het onderhoud of het gebruik van het luchtvaartuig. Het is verboden in strijd met die
      voorschriften of beperkingen te handelen.

      6 Onze Minister van Verkeer en Waterstaat kan met betrekking tot een luchtvaartuig, dat naar zijn oordeel van
      historische waarde is, geluidseisen stellen die afwijken van de door EASA vastgestelde geluidseisen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.19a
  - number: 3.19c
    text: |-
      1 Onze Minister van Verkeer en Waterstaat geeft op aanvraag aan de houder van een burgerluchtvaartuig dat is
      voorzien van een voortstuwingsinrichting, waarvoor geen geluidseisen gelden, en dat in Nederland is ingeschreven,
      een geluidsverklaring af. Op deze verklaring wordt vermeld dat voor het betrokken luchtvaartuig geen geluidseisen
      gelden.

      2 Onze Minister van Verkeer en Waterstaat kan op aanvraag aan de houder van een burgerluchtvaartuig een
      geluidsverklaring afgeven omtrent geluidsniveaus bepaald op andere wijze dan ingevolge de geldende eisen. Op deze
      verklaring wordt vermeld dat voor het betreffende luchtvaartuig een geluidscertificaat is afgegeven alsmede de
      wijze waarop van de voorschriften ingevolge de geldende eisen is afgeweken.

      3 De geluidsverklaring wordt afgegeven voor onbepaalde tijd. Vooruitlopend op de afgifte van een geluidsverklaring
      respectievelijk een aanvullende geluidsverklaring, als bedoeld in de voorgaande leden, kan een voorlopige
      geluidsverklaring respectievelijk een voorlopige aanvullende geluidsverklaring worden afgegeven.

      4 Aan een (voorlopige) geluidsverklaring en een (voorlopige) aanvullende geluidsverklaring kunnen voorschriften of
      beperkingen met betrekking tot het onderhoud of het gebruik van het luchtvaartuig worden verbonden. Het is verboden
      in strijd met die voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.19c
  - number: 3.19d
    text: |-
      1 Onze Minister van Verkeer en Waterstaat wijzigt op aanvraag van de houder een geluidscertificaat voor een
      burgerluchtvaartuig, nadat de houder een wijziging aan het luchtvaartuig heeft uitgevoerd, indien:

      a. het luchtvaartuig na de wijziging aan de geluidseisen blijft voldoen, en

      b. de houder het geluidscertificaat daartoe bij Onze Minister van Verkeer en Waterstaat heeft ingeleverd.

      2 Onze Minister van Verkeer en Waterstaat kan een geluidscertificaat ambtshalve wijzigen wanneer:

      a. onjuiste of onvolledige gegevens zijn verwerkt of verstrekt, of

      b. gegevens op het certificaat wijziging hebben ondergaan.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de wijziging van een geluidsverklaring.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.19d
  - number: 3.19e
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan een (voorlopig) geluidscertificaat voor een burgerluchtvaartuig
      vernieuwen, indien het verloren is gegaan, beschadigd of anderszins onbruikbaar is geworden.

      2 Indien een (voorlopig) geluidscertificaat wegens verlies is vernieuwd en het certificaat wordt teruggevonden,
      levert de houder van het betrokken luchtvaartuig het teruggevonden (voorlopige) certificaat binnen acht dagen bij
      Onze Minister van Verkeer en Waterstaat in.

      3 Indien een (voorlopig) geluidscertificaat anders dan wegens verlies is vernieuwd, levert de houder van het
      betrokken luchtvaartuig het oorspronkelijke (voorlopige) geluidscertificaat binnen acht dagen na ontvangst van het
      vernieuwde (voorlopige) certificaat bij Onze Minister van Verkeer en Waterstaat in.

      4 Het eerste tot en met derde lid zijn van overeenkomstige toepassing op een (voorlopige) geluidsverklaring en een
      (voorlopige) aanvullende geluidsverklaring.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.19e
  - number: 3.19f
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan een geluidscertificaat voor een burgerluchtvaartuig schorsen,
      wanneer:

      a. een ernstig vermoeden rijst dat niet meer aan de geluidseisen wordt voldaan;

      b. een ernstig vermoeden rijst dat de houder van het betrokken luchtvaartuig dat luchtvaartuig niet overeenkomstig
      bij of krachtens algemene maatregel van bestuur gestelde eisen onderhoudt of laat onderhouden;

      c. een ernstig vermoeden rijst dat met betrekking tot dat luchtvaartuig een wijziging is aangebracht, zonder dat de
      houder een daardoor noodzakelijk geworden wijziging van het geluidscertificaat heeft aangevraagd of zonder dat deze
      wijziging van het luchtvaartuig is goedgekeurd;

      d. het type-certificaat met betrekking tot dat luchtvaartuig is geschorst of ingetrokken;

      e. een ernstig vermoeden rijst dat ter verkrijging van een geluidscertificaat onjuiste of onvolledige gegevens
      zijn verstrekt;

      f. een ernstig vermoeden rijst dat op het geluidscertificaat onjuiste gegevens zijn vermeld; of

      g. de houder van het luchtvaartuig anderszins het bij of krachtens dit hoofdstuk bepaalde niet nakomt.

      2 Onze Minister van Verkeer en Waterstaat heft de schorsing op zodra de redenen van de schorsing zijn vervallen.

      3 Onze Minister van Verkeer en Waterstaat kan een geluidscertificaat voor een burgerluchtvaartuig intrekken,
      wanneer:

      a. een wijziging met betrekking tot het luchtvaartuig is aangebracht, zonder dat de houder een daardoor
      noodzakelijk geworden wijziging van het geluidscertificaat heeft aangevraagd of zonder dat deze wijziging van het
      luchtvaartuig is goedgekeurd;

      b. het geluidscertificaat gedurende tenminste drie maanden is geschorst;

      c. ter verkrijging van een geluidscertificaat onjuiste of onvolledige gegevens zijn verstrekt, of

      d. op het geluidscertificaat onjuiste gegevens zijn vermeld.

      4 Onze Minister van Verkeer en Waterstaat trekt een geluidscertificaat voor een burgerluchtvaartuig in, wanneer:

      a. het luchtvaartuig niet aan de geluidseisen voldoet ;

      b. het betrokken luchtvaartuig onherstelbaar is beschadigd, of

      c. het betrokken luchtvaartuig uit het register van Nederlandse burgerluchtvaartuigen is uitgeschreven.

      5 De houder van het burgerluchtvaartuig waarvan het geluidscertificaat is geschorst of ingetrokken, levert op
      eerste vordering van Onze Minister van Verkeer en Waterstaat het geluidscertificaat binnen acht dagen in bij Onze
      Minister van Verkeer en Waterstaat.

      6 Wanneer de schorsing wordt opgeheven doet Onze Minister van Verkeer en Waterstaat het ingeleverde
      geluidscertificaat terstond wederom toekomen aan de houder van het betrokken burgerluchtvaartuig.

      7 Het eerste lid onder b tot en met g, het tweede, derde, vierde lid onder b en c, het vijfde en het zesde
      lid zijn van overeenkomstige toepassing op een (voorlopige) geluidsverklaring en een (voorlopige) aanvullende
      geluidsverklaring.

      8 Onverminderd het zevende lid wordt een (voorlopige) geluidsverklaring, afgegeven in aanvulling op een
      (voorlopig) geluidscertificaat, geschorst indien het betrokken (voorlopige) geluidscertificaat wordt geschorst,
      onderscheidenlijk ingetrokken, wanneer het betrokken (voorlopige) geluidscertificaat wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.19f
  - number: '3.21'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan op aanvraag van de houder, respectievelijk Onze Minister van Defensie
      kan ambtshalve ontheffing verlenen van de bij of krachtens deze paragraaf gegeven regels, wanneer door bijzondere
      omstandigheden die regels in redelijkheid geen toepassing kunnen vinden en de veiligheid van het luchtverkeer met
      het verlenen van de ontheffing niet in gevaar wordt gebracht. Een ontheffing kan onder beperkingen worden verleend.
      Aan een ontheffing kunnen voorschriften worden verbonden.

      2 Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie trekt de ontheffing in,
      wanneer:

      a. de redenen, waarom de ontheffing is verleend, zijn komen te vervallen, of

      b. de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.21
  - number: '3.22'
    text: |-
      1 De houder van een Nederlands burgerluchtvaartuig, waarvoor een bewijs van luchtwaardigheid is afgegeven:

      a. ziet er op toe, dat het luchtvaartuig zijn luchtwaardigheid behoudt, en

      b. onderhoudt of laat het luchtvaartuig onderhouden overeenkomstig bij of krachtens algemene maatregel van bestuur
      gestelde regels.

      2 De houder van een Nederlands burgerluchtvaartuig dat is voorzien van een voortstuwingsinrichting ziet er op toe
      dat:

      a. het luchtvaartuig blijft voldoen aan de geldende geluidseisen, en

      b. het luchtvaartuig in de configuratie blijft waarvoor het geluidscertificaat of de geluidsverklaring is verleend.

      3 Bij regeling van Onze Minister van Verkeer en Waterstaat kan worden aangegeven in welke gevallen en onder welke
      voorwaarden een afwijking van beperkte duur van het bepaalde in het tweede lid, onder b, is toegestaan.

      4 De houder van een Nederlands burgerlichtvaartuig, waarvoor een bewijs van luchtwaardigheid is afgegeven,
      volgt de door EASA en door Onze Minister van Verkeer en Waterstaat gegeven aanwijzingen met betrekking tot de
      luchtwaardigheid op.

      5 Onze Minister van Defensie ziet er op toe dat militaire luchtvaartuigen worden onderhouden overeenkomstig de
      daartoe gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.22
  - number: '3.23'
    text: |-
      Ten aanzien van burgerluchtvaartuigen worden bij of krachtens algemene maatregel van bestuur nadere regels gesteld
      met betrekking tot het in deze paragraaf bepaalde. Deze regels bevatten in ieder geval bepalingen betreffende:

      a. de aanvraag en de afgifte van een type-certificaat, een aanvullend type-certificaat, een bewijs van
      luchtwaardigheid, een (voorlopig) geluidscertificaat, een (voorlopige) geluidsverklaring en een (voorlopige)
      aanvullende geluidsverklaring;

      b. de wijziging en overdracht van een type-certificaat, een aanvullend type-certificaat, een (voorlopig)
      geluidscertificaat, een (voorlopige) geluidsverklaring, een (voorlopige) aanvullende geluidsverklaring en een
      bewijs van luchtwaardigheid en de verlenging van zulk een bewijs;

      c. de procedure van aanvraag, wijziging, schorsing en intrekking van een type-certificaat, een aanvullend type-
      certificaat, een (voorlopig) geluidscertificaat, een (voorlopige) geluidsverklaring en een (voorlopige) aanvullende
      geluidsverklaring;

      d. de procedure van aanvraag, wijziging, verlenging, schorsing en intrekking van een bewijs van luchtwaardigheid;

      e. hetgeen moet worden verstaan onder een ingrijpende wijziging van het type-ontwerp waarvoor een type-certificaat
      is afgegeven;

      f. het aan luchtvaartuigen te verrichten onderhoud;

      g. de vernieuwing van een bewijs van luchtwaardigheid, een (voorlopig) geluidscertificaat, een (voorlopige)
      geluidsverklaring en een (voorlopige) aanvullende geluidsverklaring;

      h. de vergoeding die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om afgifte,
      wijziging of overdracht van een type-certificaat, of van een aanvullend type-certificaat, en

      i. de vergoeding die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om
      afgifte, wijziging of vernieuwing van een (voorlopig) geluidscertificaat, een (voorlopige) geluidsverklaring, een
      (voorlopige) aanvullende geluidsverklaring en een bewijs van luchtwaardigheid of de verlenging van een bewijs van
      luchtwaardigheid, dan wel van zijn aanvraag om een ontheffing;

      j. de vergoeding die de aanvrager verschuldigd is voor de kosten van de behandeling van zijn aanvraag om
      goedkeuring of wijziging van een onderhoudsprogramma.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.23
  - number: '3.24'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot het model en de uitvoering van een type-certificaat, een
      aanvullend type-certificaat, een bewijs van luchtwaardigheid, een (voorlopig) geluidscertificaat, een (voorlopige)
      geluidsverklaring of een (voorlopige) aanvullende geluidsverklaring voor een burgerluchtvaartuig regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.24
  - number: '3.25'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat verleent voor het verrichten van werkzaamheden verband houdende met
      de luchtwaardigheid of de geluidsproductie van burgerluchtvaartuigen of onderdelen daarvan op aanvraag aan een
      natuurlijke persoon of rechtspersoon een erkenning, wanneer die erkenning niet door EASA moet worden verleend en
      de desbetreffende natuurlijke persoon of rechtspersoon een bedrijf voert, dat voldoet aan bij of krachtens algemene
      maatregel van bestuur met betrekking tot die erkenning gestelde eisen. Aan de erkenning kunnen voorschriften of
      beperkingen worden verbonden.

      2 Bij algemene maatregel van bestuur wordt aangegeven welke erkenningen Onze Minister van Verkeer en Waterstaat kan
      verlenen, alsmede de bevoegdheden, welke aan iedere erkenning verbonden zijn.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot het verrichten
      van werkzaamheden verband houdende met de luchtwaardigheid van burgerluchtvaartuigen of onderdelen daarvan door een
      natuurlijke persoon of rechtspersoon zonder erkenning als bedoeld in het eerste lid.

      4 Het is behoudens het derde lid verboden de werkzaamheden verband houdende met de luchtwaardigheid van
      burgerluchtvaartuigen of onderdelen daarvan, bedoeld in het eerste lid, te verrichten zonder een daartoe strekkende
      erkenning.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.25
  - number: '3.26'
    text: |-
      1 Een erkenning wordt verleend voor een bij algemene maatregel van bestuur vast te stellen termijn dan wel voor
      onbepaalde tijd.

      2 Op aanvraag van de houder kan Onze Minister van Verkeer en Waterstaat de erkenning wijzigen.

      3 Op aanvraag van de houder verlengt Onze Minister van Verkeer en Waterstaat de erkenning, indien wordt voldaan aan
      bij of krachtens algemene maatregel van bestuur met betrekking tot die erkenning gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.26
  - number: '3.27'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan een erkenning geheel of gedeeltelijk schorsen, wanneer een ernstig
      vermoeden rijst, dat het betrokken bedrijf niet voldoet aan de eisen, gesteld krachtens [artikel 3.25][ref1].

      2 Onze Minister van Verkeer en Waterstaat heft de schorsing op zodra de redenen van de schorsing zijn komen te
      vervallen.

      3 Onze Minister van Verkeer en Waterstaat kan een erkenning intrekken, wanneer:

      a. de houder daarom verzoekt;

      b. het betrokken bedrijf niet voldoet aan de eisen, gesteld krachtens [artikel 3.25][ref2];

      c. de houder krachtens de hem verleende erkenning werkzaamheden verricht, waartoe deze niet erkend is;

      d. de houder van de erkenning de daaraan verbonden voorschriften of beperkingen niet naleeft;

      e. de erkenning gedurende ten minste drie maanden is geschorst, of

      f. de houder in staat van faillissement verkeert.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.25
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3.25
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.27
