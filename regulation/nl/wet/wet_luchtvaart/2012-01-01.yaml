  - number: '8.2'
    text: Deze titel is van toepassing ten aanzien van de luchthaven Schiphol.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.2
  - number: 8.2a
    text: |-
      1 De overheid bezit ten minste een meerderheid van het economisch en juridisch belang in de exploitant van de
      luchthaven.

      2 Onze Minister van Financiën wijst bij regeling een of meerdere overheidsorganisaties aan ter voldoening van de in
      het eerste lid genoemde eis.

      3 De krachtens het tweede lid vast te stellen regeling heeft in ieder geval betrekking op de wijze waarop invulling
      wordt gegeven aan de in het eerste lid genoemde eis en de wijze waarop de overheid in gezamenlijkheid blijvend
      invulling geeft aan de continuïteit van de Mainport.

      4 Het voorstel voor de krachtens het tweede lid vast te stellen regeling wordt gedaan door Onze Minister van
      Financiën in overeenstemming met Onze Minister van Verkeer en Waterstaat en wordt niet eerder gedaan dan vier weken
      nadat het ontwerp aan de Tweede Kamer der Staten-Generaal is overgelegd.

      5 Aan de goedkeuring van de algemene vergadering van aandeelhouders van de exploitant van de luchthaven zijn
      onderworpen de besluiten van het bestuur van de exploitant van de luchthaven omtrent investeringen welke een
      bedrag vereisen gelijk aan ten minste een tiende van het bedrag van de activa volgens de geconsolideerde balans met
      toelichting volgens de laatst vastgestelde jaarrekening van de exploitant van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.2a
  - number: '8.3'
    text: |-
      De uitoefening van de bevoegdheden die voortvloeien uit deze titel is gericht op het bevorderen van een optimaal
      gebruik van de luchthaven als kwalitatief hoogwaardig knooppunt van nationaal en internationaal luchtverkeer, met
      inachtneming van de grenzen die met het oog op de veiligheid, de geluidbelasting, de lokale luchtverontreiniging en
      de geurbelasting noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.3
  - number: '8.4'
    text: Bij algemene maatregel van bestuur wordt voor de luchthaven een luchthavenindelingbesluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.4
  - number: '8.5'
    text: |-
      1 In het luchthavenindelingbesluit worden het luchthavengebied en het beperkingengebied vastgesteld.

      2 Als luchthavengebied wordt het gebied vastgesteld dat bestemd is voor gebruik als luchthaven.

      3 Als beperkingengebied wordt het gebied vastgesteld waar in verband met de nabijheid van de luchthaven met het oog
      op de veiligheid en de geluidbelasting beperkingen noodzakelijk zijn ten aanzien van de bestemming of het gebruik
      van de grond.

      4 Het luchthavengebied en het beperkingengebied overlappen elkaar niet. De gebieden kunnen bestaan uit niet
      aaneengesloten delen.

      5 De gebieden worden vastgesteld met behulp van kaarten waarop de ligging van de gebieden is aangegeven. De
      kaarten voor het luchthavengebied worden vervaardigd op een schaal van ten minste 1 op 10 000. De kaarten voor
      het beperkingengebied worden vervaardigd op een schaal van ten minste 1 op 50 000. Zo nodig worden delen van de
      gebieden vastgelegd met behulp van kaarten op een schaal met een kleiner verhoudingsgetal.

      6 Bij de vaststelling van het luchthavenindelingsbesluit wordt gebruik gemaakt van:

      a. de gegevens met betrekking tot het verkeer over wegen en daarop gebaseerde onderzoeken,

      b. de krachtens [artikel 5.20, eerste lid, van de Wet milieubeheer][ref1] bekendgemaakte gegevens en daarop
      gebaseerde onderzoeken, en

      c. de inventarisatie van en de gevolgen voor de aanwezige flora en fauna en daarop gebaseerde onderzoeken, die ten
      grondslag hebben gelegen aan het ontwerp-besluit, met dien verstande dat indien de rapporten, waarin de gegevens,
      onderzoeken, inventarisaties en gevolgen zijn vervat, bij de vaststelling van het luchthavenindelingsbesluit ouder
      zijn dan twee jaar, het luchthavenindelingsbesluit een motivering van de actualiteit van die rapporten bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel5.20
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '5.20'
  - number: '8.6'
    text: |-
      Het luchthavenindelingbesluit bevat voor het luchthavengebied regels omtrent de bestemming en het gebruik van de
      grond voor zover die regels noodzakelijk zijn met het oog op het gebruik van het gebied als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.6
  - number: '8.7'
    text: |-
      1 Het luchthavenindelingbesluit bevat voor het beperkingengebied regels waarbij beperkingen zijn gesteld ten
      aanzien van de bestemming en het gebruik van de grond voor zover die beperkingen noodzakelijk zijn met het oog op
      de veiligheid en de geluidbelasting in verband met de nabijheid van de luchthaven.

      2 Het besluit bevat in ieder geval regels omtrent beperking van:

      a. de bestemming en het gebruik van grond in verband met het externe-veiligheidsrisico vanwege het
      luchthavenluchtverkeer;

      b. de bestemming en het gebruik van grond in verband met de geluidbelasting vanwege het luchthavenluchtverkeer;

      c. de maximale hoogte van objecten in, op of boven de grond, in verband met de veiligheid van het
      luchthavenluchtverkeer;

      d. een bestemming die, of van een gebruik dat, vogels aantrekt, in verband met de veiligheid van het
      luchthavenluchtverkeer.

      3 Bij de regels, bedoeld in het tweede lid, onderdelen a en b, worden in ieder geval gronden aangewezen die niet
      bestemd of gebruikt worden voor woningen of andere in het besluit aangewezen gebouwen.

      4 Elk besluit, volgend op het eerste luchthavenindelingbesluit, biedt een beschermingsniveau ten aanzien van
      externe veiligheid en geluidbelasting, dat voor ieder van deze aspecten, gemiddeld op jaarbasis vastgesteld, per
      saldo gelijkwaardig is aan of beter is dan het niveau zoals dat geboden werd door het eerste besluit.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.7
  - number: '8.8'
    text: |-
      1 Bij de vaststelling van een bestemmingsplan of de beheersverordening, bedoeld in
      [artikel 3.38 van de Wet ruimtelijke ordening][ref1] voor een gebied dat is gelegen binnen het luchthavengebied of
      het beperkingengebied, wordt het luchthavenindelingbesluit in acht genomen.

      2 Voor het gebied dat ligt binnen het luchthavengebied of het beperkingengebied, waarvoor geen bestemmingsplan of
      beheersverordening geldt dat in overeenstemming is met het besluit, geldt het besluit als een voorbereidingsbesluit
      als bedoeld in [artikel 3.7 van de Wet ruimtelijke ordening][ref2]. Voor zover het besluit geldt als
      voorbereidingsbesluit, is [artikel 3.7, vijfde lid, van die wet][ref3] niet van toepassing.

      3 De gemeenteraad is verplicht binnen een jaar nadat het besluit in werking is getreden het bestemmingsplan of de
      beheersverordening overeenkomstig het besluit vast te stellen.

      4 Indien een bestemmingsplan of een beheersverordening niet in overeenstemming is met het besluit, is het
      college van burgemeester en wethouders verplicht aan degenen die inzage verlangen in het bestemmingsplan of de
      beheersverordening, tevens inzage te verlenen in het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.38
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3.7
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3.7
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3.38'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3.7'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3.7'
  - number: '8.9'
    text: |-
      1 Bij de verlening van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onder a, onder 2° of 3°][ref1], of 2.12, tweede lid, van de Wet algemene
      bepalingen omgevingsrecht van het geldende bestemmingsplan wordt afgeweken en bij de toepassing van
      [artikel 3.3, derde lid, van die wet][ref2] wordt het luchthavenindelingbesluit in acht genomen.

      2 In afwijking van [artikel 3.3, tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref3] duurt de in die
      artikelen bedoelde aanhouding totdat een bestemmingsplan dat in overeenstemming is met het besluit in werking is
      getreden.

      3 Bij de toepassing van de artikelen, genoemd in het eerste lid, kan van het besluit worden afgeweken indien van
      Onze Minister van Verkeer en Waterstaat, in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, de verklaring is ontvangen dat hij tegen de afwijking geen bezwaar heeft.

      4 De verklaring van geen bezwaar die betrekking heeft op het luchthavengebied kan worden geweigerd met het oog op
      het gebruik van het gebied als luchthaven.

      5 De verklaring van geen bezwaar die betrekking heeft op het beperkingengebied kan worden geweigerd met het oog op
      de veiligheid en de geluidbelasting in verband met de nabijheid van de luchthaven.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3.3
      [ref3]: https://wetten.overheid.nl/BWBR0024779#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.9
