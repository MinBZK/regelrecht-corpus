        artikel: 8.1a
        hoofdstuk: '8'
  - number: '8.64'
    text: |-
      1 Provinciale staten stellen bij verordening een luchthavenregeling vast voor een luchthaven. Provinciale
      staten kunnen de bevoegdheid tot het vaststellen van deze verordening niet overdragen als bedoeld in
      [artikel 152 van de Provinciewet][ref1].

      2 Een luchthavenregeling bevat regels omtrent het luchthavenluchtverkeer voor zover die regels noodzakelijk zijn
      met het oog op de geluidbelasting vanwege het luchthavenluchtverkeer. Een luchthavenregeling kan tevens bevatten:

      a. grenswaarden die noodzakelijk zijn met het oog op het externe-veiligheidsrisico of de geluidbelasting; of

      b. regels die noodzakelijk zijn met het oog op het externe-veiligheidsrisico.

      3 De in de luchthavenregeling opgenomen regels of grenswaarden bevorderen in ieder geval dat niet wordt voldaan
      aan het criterium op grond waarvan volgens [artikel 8.1a, derde lid][ref2], vaststelling van een luchthavenbesluit
      is vereist.

      4 In een luchthavenregeling wordt het luchthavengebied vastgesteld. Het luchthavengebied wordt vastgesteld met
      behulp van een kaart waarop de ligging van dit gebied is aangegeven. Deze kaart wordt vervaardigd op een schaal van
      ten minste 1 op 10 000.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de in
      luchthavenregelingen op te nemen regels en grenswaarden.

      6 De [artikelen 8.19][ref3], [8.21, eerste en derde lid][ref4], [8.45][ref5], [8.46][ref6],
      [8.47a tot en met 8.49a][ref7] zijn van overeenkomstige toepassing.


