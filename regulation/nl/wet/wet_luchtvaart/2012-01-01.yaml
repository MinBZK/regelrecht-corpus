        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: '10.31'
    text: |-
      De burgerexploitant is verplicht om in door Onze Minister van Verkeer en Waterstaat in overeenstemming met Onze
      Minister van Defensie aangewezen gevallen burgerluchthavenluchtverkeer op de luchthaven toe te laten.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.31
  - number: '10.32'
    text: |-
      Het is de houder van een vergunning voor burgermedegebruik verboden om zonder of in afwijking van een daarvoor
      door Onze Minister van Defensie verleende vergunning op de luchthaven bouwwerken of andere opstallen op te richten,
      te hebben of te wijzigen dan wel bomen, gewassen of planten te hebben. De eerste volzin is van overeenkomstige
      toepassing ten aanzien van het hebben van roerende zaken of het verrichten van graafwerk anders dan in verband
      met de exploitatie of het onderhoud van dat deel van de luchthaven. Aan de vergunning kunnen beperkingen en
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.32
  - number: '10.33'
    text: |-
      Een ministeriële regeling op grond van de [artikelen 10.34][ref1] en [10.35][ref2] wordt vastgesteld door
      Onze Minister van Defensie in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.34
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10.35
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.33
