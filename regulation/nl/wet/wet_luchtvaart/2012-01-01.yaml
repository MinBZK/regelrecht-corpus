  - number: '11.6'
    text: |-
      1 Bij verdenking dat een lid van het boordpersoneel werkzaamheden heeft verricht in strijd met
      [artikel 2.12, eerste of derde lid][ref1], kan de opsporingsambtenaar hem bevelen zijn medewerking te verlenen aan
      een onderzoek als bedoeld in [artikel 2.12, derde lid, onder a][ref2].

      2 Het lid van het boordpersoneel aan wie het in het eerste lid bedoelde bevel is gegeven, is verplicht ademlucht
      te blazen in een voor het onderzoek bestemd apparaat en gevolg te geven aan alle door de opsporingsambtenaar ten
      dienste van het onderzoek gegeven aanwijzingen.

      3 De in het tweede lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat het
      verlenen van medewerking aan een ademonderzoek voor hem om bijzondere geneeskundige redenen onwenselijk is.

      4 In het geval, bedoeld in het derde lid, dan wel indien de medewerking van de verdachte niet heeft geleid tot
      een voltooid ademonderzoek, kan de opsporingsambtenaar de verdachte vragen of hij zijn toestemming geeft tot
      het verrichten van een onderzoek als bedoeld in [artikel 2.12, derde lid, onder b][ref3]. Gelijke bevoegdheid
      heeft de opsporingsambtenaar, indien het vermoeden bestaat dat de verdachte onder invloed van een andere in
      [artikel 2.12, eerste lid][ref4], bedoelde stof dan alcoholhoudende drank verkeert.

      5 Indien het lid van het boordpersoneel zijn op grond van het vierde lid gevraagde toestemming niet verleent, kan
      de officier van justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van
      Justitie aangewezen ambtenaren van politie hem bevelen zich te onderwerpen aan een bloedonderzoek.

      6 Het lid van het boordpersoneel aan wie is bevolen zich aan een bloedonderzoek te onderwerpen is verplicht aan dit
      bevel gevolg te geven en zijn medewerking te verlenen; hem wordt door een arts zoveel bloed afgenomen als voor het
      onderzoek noodzakelijk is.

      7 De in het zesde lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat afname van
      bloed bij hem om bijzondere geneeskundige redenen onwenselijk is.

      8 De krachtens het zevende lid vrijgestelde personen zijn verplicht mee te werken aan een door de officier van
      justitie, door een hulpofficier van justitie of door een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren van politie bevolen onderzoek teneinde op andere wijze dan door bloedonderzoek het gebruik
      van de in [artikel 2.12, eerste lid][ref5] bedoelde stoffen of het in 2.12, derde lid, onder *b* genoemde gehalte
      vast te stellen.

      9 Indien de verdachte niet in staat is zijn wil kenbaar te maken, kan hem met toestemming van de officier
      van justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen opsporingsambtenaren, door een arts de in het zesde lid bedoelde hoeveelheid bloed worden afgenomen.
      Een onderzoek van het bloed vindt niet plaats dan nadat de verdachte in de gelegenheid is gesteld zijn toestemming
      daartoe te geven. Zo nodig kan hem overeenkomstig het bepaalde in het vijfde lid worden bevolen zijn medewerking te
      verlenen. De verdachte, aan wie een zodanig bevel is gegeven, is verplicht zijn medewerking te verlenen. Indien de
      verdachte weigert zijn medewerking te verlenen, wordt het bloedmonster vernietigd.

      10 Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven omtrent de wijze van uitvoering van
      artikel 11.4, tweede lid, en van dit artikel. Deze regels kunnen mede betrekking hebben op de mogelijkheid tot het
      doen verrichten van een tegenonderzoek. Bij regeling van Onze Minister van Justitie worden in de bij die algemene
      maatregel aangegeven gevallen voorschriften ter uitvoering van die regels vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.12
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2.12
