  - number: '8.61'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan aan gedeputeerde staten een aanwijzing geven maatregelen te treffen
      op grond van [artikel 8.45][ref1].

      2 Indien de aanwijzing niet binnen de termijn is opgevolgd kan Onze Minister van Verkeer en Waterstaat op kosten
      van de provincie overgaan tot het voorschrijven van maatregelen op grond van [artikel 8.45, eerste lid][ref2].

      3 [Artikel 8.22, derde en vierde lid][ref3], is van overeenkomstige toepassing, met dien verstande dat voor de
      toepassing van [artikel 8.22, derde en vierde lid][ref4], Onze Minister van Verkeer en Waterstaat in de plaats
      treedt van de inspecteur-generaal. [Artikel 8.44, vierde lid][ref5], is van overeenkomstige toepassing ten aanzien
