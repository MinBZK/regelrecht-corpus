  - number: '10.7'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur, gedaan op voordracht van Onze Minister van Defensie, worden
      regels gegeven inzake het internationaal vervoer van gevaarlijke stoffen met een luchtvaartuig waarvan de
      krijgsmacht of de krijgsmacht van een andere mogendheid houder is, het daartoe aanbieden of aannemen, alsmede het
      laden in of lossen uit een dergelijk luchtvaartuig of het tijdens het vervoer neerleggen van bedoelde stoffen. De
      [artikelen 6.51, derde lid][ref1], en [6.52][ref2] zijn van overeenkomstige toepassing.

      2 Bij of krachtens algemene maatregel van bestuur, gedaan op voordracht van Onze Minister van Defensie , worden
      regels gegeven inzake het nationaal vervoer van ontplofbare stoffen of voorwerpen met een luchtvaartuig waarvan de
      krijgsmacht of de krijgsmacht van een andere mogendheid houder is, het daartoe aanbieden of aannemen alsmede het
      laden in of lossen uit een dergelijk luchtvaartuig of het tijdens het vervoer neerleggen van bedoelde stoffen of
      voorwerpen. De [artikelen 6.51, derde lid][ref3], en [6.52][ref4] zijn van overeenkomstige toepassing.

      3 De bedoelde regels kunnen onder meer betrekking hebben op:

      a. het aanwijzen van gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, die niet door de lucht mogen
      worden vervoerd;

      b. de eisen ten aanzien van constructie, inrichting en uitrusting van luchtvaartuigen waarmee gevaarlijke stoffen
      als bedoeld in het eerste dan wel tweede lid worden vervoerd;

      c. de belading van luchtvaartuigen met inbegrip van samenlading;

      d. de eisen waaraan gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, moeten voldoen;

      e. de eisen waaraan de verpakking moet voldoen;

      f. de etiketten of aanduidingen op de verpakking;

      g. de eisen, waaraan bij het laden en lossen voldaan moet worden;

      h. de eisen ten aanzien van constructie, inrichting en uitrusting van inrichtingen, voertuigen of werktuigen met
      behulp waarvan gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, worden geladen of gelost;

      i. de melding voorafgaande aan een handeling inzake het vervoer van gevaarlijke stoffen als bedoeld in het eerste
      dan wel tweede lid;

      j. de begeleiding van het vervoer en de eisen die aan de begeleider worden gesteld;

      k. het uitzonderen van gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, behorend tot de
      operationele uitrusting of het wapensysteem van het luchtvaartuig, of behorend tot de uitrusting van personen die
      met het luchtvaartuig worden vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.51
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6.52
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel6.51
