        artikel: '3.25'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: '3.30'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan op aanvraag bewijzen van bevoegdheid afgeven:

      a. voor het zonder toezicht verrichten van onderhoud aan luchtvaartuigen;

      b. waarmee de houder in aanmerking komt om door een erkend onderhoudsbedrijf gemachtigd te worden om namens dat
      bedrijf werkzaamheden te mogen vrijgeven.

      De [artikelen 2.1, tweede lid, aanhef en onderdeel c, vierde en vijfde lid][ref1], [2.2][ref2], [2.3][ref3] en
      [2.5 tot en met 2.10][ref4] zijn van overeenkomstige toepassing.

      2 Behoudens [artikel 3.25][ref5] is het verboden zonder toezicht onderhoud aan burgerluchtvaartuigen te verrichten
      indien het daarvoor geldige bewijs van bevoegdheid ontbreekt.


