  - number: '8.73'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat maakt elk jaar een verslag over de milieuaspecten en indien van
      toepassing de externe-veiligheidsaspecten van het luchthavenluchtverkeer. Het verslag bevat ten minste een
      beschrijving van de ter uitvoering van [artikel 8.45][ref1] getroffen maatregelen en van de doelmatigheid en
      doeltreffendheid van die maatregelen.

      2 Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer ontvangt een afschrift van het verslag.

      3 De [artikelen 8.29, tweede lid][ref2], en [8.30][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.45
