      1 Naar aanleiding van een onopzettelijke of uit onachtzaamheid begane overtreding van een wettelijk voorschrift
      stelt de Staat geen rechtsvordering in en legt een bestuursorgaan geen bestuurlijke sanctie op indien van deze
      overtreding kennis is verkregen door een melding als bedoeld in [artikel 7.1][ref1].

      2 Het eerste lid is niet van toepassing indien sprake is van grove nalatigheid met betrekking tot het voorval.


