  - number: '8.12'
    text: |-
      1 Dit artikel is van toepassing op het oprichten of plaatsen van objecten waar
      geen omgevingsvergunning voor een bouw- of aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a of b, van de Wet algemene bepalingen omgevingsrecht][ref1] voor is vereist.

      2 Het is verboden een object op te richten of te plaatsen indien dit in strijd is met een regel in het
      luchthavenindelingbesluit omtrent de maximale hoogte van objecten.

      3 Onze Minister van Verkeer en Waterstaat kan ontheffing verlenen van het verbod. De ontheffing wordt slechts
      geweigerd in het belang van de veiligheid.

      4 De ontheffing wordt voor een bepaalde periode verleend. Aan de ontheffing kunnen beperkingen en voorschriften
      worden verbonden in het belang van de veiligheid.

      5 Onze Minister van Verkeer en Waterstaat stelt regels omtrent de vergoeding die de aanvrager van een ontheffing
      verschuldigd is voor de kosten van het verlenen van de ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2.1'
  - number: '8.13'
    text: |-
      De voordracht voor een luchthavenindelingbesluit wordt niet gedaan dan nadat het ontwerp in de Staatscourant is
      bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen vier weken na de dag waarop de bekendmaking is
      geschiedt, wensen en bedenkingen ter kennis van Onze Minister van Verkeer en Waterstaat te brengen. Gelijktijdig
      met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.13
  - number: '8.14'
    text: Artikel 8.13 is van overeenkomstige toepassing op het wijzigen van het luchthavenindelingbesluit.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.14
  - number: '8.15'
    text: Bij algemene maatregel van bestuur wordt voor de luchthaven een luchthavenverkeerbesluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.15
  - number: '8.16'
    text: Het luchthavenverkeerbesluit bevat een beschrijving van de luchtverkeerwegen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.16
  - number: '8.17'
    text: |-
      1 Het luchthavenverkeerbesluit bevat regels omtrent het luchthavenluchtverkeer voor zover die regels noodzakelijk
      zijn met het oog op de veiligheid, de geluidbelasting, de lokale luchtverontreiniging en de geurbelasting.

      2 Het besluit bevat in ieder geval regels omtrent:

      a. de gevallen waarin van een luchtverkeerweg gebruik gemaakt wordt;

      b. een op beperking van belasting gerichte wijze van gebruik van het luchtruim in andere gevallen;

      c. de beschikbaarheid van de luchthaven voor het luchthavenluchtverkeer.

      3 Het besluit kan regels bevatten omtrent:

      a. de wijze van gebruik van de luchtverkeerwegen;

      b. de tijdstippen waarop, de frequentie waarmee en de categorieën van luchtvaartuigen waarmee van het luchtruim
      gebruik gemaakt wordt.

      4 De regels bevorderen het realiseren van een beschermingsniveau, waarbij de in het besluit beschreven grenswaarden
      met betrekking tot de door het luchthavenluchtverkeer veroorzaakte belasting ten aanzien van veiligheid, geluid en
      lokale luchtverontreiniging niet worden overschreden.

      5 Het besluit bevat in ieder geval:

      a. de grenswaarden voor het externe-veiligheidsrisico;

      b. de grenswaarden voor de geluidbelasting, waarbij in ieder geval punten in of aan de rand van woonbebouwing in de
      nabijheid van de luchthaven bepaald worden met de grenswaarden die op ieder van die punten van toepassing zijn;

      c. de grenswaarden voor de emissie van de stoffen die lokale luchtverontreiniging veroorzaken.

      6 Het besluit kan ten aanzien van de in het tweede en derde lid bedoelde onderwerpen, grenzen stellen aan de
      maatregelen die de inspecteur-generaal op grond van [artikel 8.22][ref1] kan treffen.

      7 Elk besluit, volgend op het eerste luchthavenverkeerbesluit, biedt een beschermingsniveau ten aanzien van
      externe veiligheid, geluidbelasting en lokale luchtverontreiniging, dat voor ieder van deze aspecten, gemiddeld op
      jaarbasis vastgesteld, per saldo gelijkwaardig is aan of beter is dan het niveau zoals dat geboden werd door het
      eerste besluit.

      8 Bij de vaststelling van het luchthavenverkeersbesluit wordt gebruik gemaakt van:

      a. de gegevens met betrekking tot het verkeer over wegen en daarop gebaseerde onderzoeken,

      b. de krachtens [artikel 5.20, eerste lid, van de Wet milieubeheer][ref2] bekendgemaakte gegevens en daarop
      gebaseerde onderzoeken, en

      c. de inventarisatie van en de gevolgen voor de aanwezige flora en fauna en daarop gebaseerde onderzoeken, die ten
      grondslag hebben gelegen aan het ontwerp-besluit, met dien verstande dat indien de rapporten, waarin de gegevens,
      onderzoeken, inventarisaties en gevolgen zijn vervat, bij de vaststelling van het luchthavenverkeersbesluit ouder
      zijn dan twee jaar, het luchthavenverkeersbesluit een motivering van de actualiteit van die rapporten bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.22
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5.20
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.22'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5.20'
  - number: '8.18'
    text: |-
      De exploitant van de luchthaven, de verlener van luchtverkeersdiensten en de luchtvaartmaatschappijen bevorderen
      het goede verloop van het luchthavenluchtverkeer overeenkomstig het luchthavenverkeerbesluit. Zij treffen
      daartoe zelf en in onderlinge samenwerking de voorzieningen die redelijkerwijs van hen kunnen worden gevergd om
      te bewerkstelligen dat de belasting vanwege het luchthavenluchtverkeer de in [artikel 8.17, vierde lid][ref1],
      bedoelde grenswaarden niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.17
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.18
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.17'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: '8.19'
    text: |-
      De exploitant van de luchthaven stelt de luchthaven beschikbaar overeenkomstig de regels van het
      luchthavenverkeerbesluit. De exploitant kan hiervan afwijken als dit in het belang van de veiligheid nodig is.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.19
  - number: '8.20'
    text: |-
      Luchtverkeersdiensten worden verleend overeenkomstig de regels van het luchthavenverkeerbesluit. De verlener van de
      luchtverkeersdiensten kan hiervan afwijken als dit in het belang van de veiligheid nodig is.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.20
  - number: '8.21'
    text: |-
      1 De gezagvoerder neemt deel aan het luchthavenluchtverkeer overeenkomstig de regels van het
      luchthavenverkeerbesluit.

      2 De gezagvoerder kan afwijken van het eerste lid op advies van de verlener van luchtverkeersdiensten.

      3 De gezagvoerder kan afwijken van het eerste lid als dit in het belang van de veiligheid nodig is.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.21
  - number: '8.22'
    text: |-
      1 Zodra de inspecteur-generaal constateert dat de in artikel 8.17, vierde lid, bedoelde grenswaarden zijn
      overschreden, schrijft hij maatregelen voor die naar zijn oordeel bijdragen aan het terugdringen van de belasting
      vanwege het luchthavenluchtverkeer binnen de grenswaarden.

      2 De maatregelen hebben betrekking op de in artikel 8.17, tweede en derde lid, bedoelde onderwerpen en vallen
      binnen de in artikel 8.17, zesde lid, bedoelde grenzen.

      3 De inspecteur-generaal trekt de maatregelen in of matigt deze voor zover zij naar zijn oordeel niet langer nodig
      zijn voor het terugdringen van de belasting vanwege het luchthavenluchtverkeer binnen de grenswaarden.

      4 Voordat de inspecteur-generaal een maatregel voorschrijft stelt hij degene tot wie de maatregel is gericht in de
      gelegenheid zijn zienswijze kenbaar te maken.

      5 De artikelen 8.18 tot en met 8.21 zijn van overeenkomstige toepassing ten aanzien van de voorgeschreven
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.22
  - number: '8.23'
    text: |-
      1 Bij regeling van Onze Minister van Verkeer en Waterstaat, in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, kan indien ten gevolge van groot onderhoud van een baan het
      normale gebruik van een luchthaven naar hun oordeel ernstig wordt belemmerd:

      a. vrijstelling worden verleend van een regel in het luchthavenverkeerbesluit;

      b. een in het luchthavenverkeerbesluit vastgelegde grenswaarde voor de geluidbelasting in een bepaald punt worden
      vervangen door een andere grenswaarde.

      2 Een vrijstelling kan slechts worden verleend voor een bepaalde in de vrijstelling vast te stellen termijn van ten
      hoogste een jaar.

      3 Aan een vrijstelling kunnen beperkingen en voorschriften worden verbonden met het oog op de veiligheid, de
      geluidbelasting, de lokale luchtverontreiniging en de geurbelasting. De [artikelen 8.18 tot en met 8.21][ref1] zijn
      van overeenkomstige toepassing ten aanzien van de beperkingen en voorschriften.

      4 Het tweede en derde lid zijn van overeenkomstige toepassing op een vervanging als bedoeld in het eerste lid,
      onderdeel b.

      5 Onze Minister van Verkeer en Waterstaat kan, in overeenstemming met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, indien ten gevolge van een bijzonder voorval het normale gebruik
      van een luchthaven naar hun oordeel ernstig wordt belemmerd vrijstelling verlenen van een regel in het
      luchthavenverkeerbesluit of een in het luchthavenverkeerbesluit vastgelegde grenswaarde vervangen. Het tweede en
      derde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.18
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.23
