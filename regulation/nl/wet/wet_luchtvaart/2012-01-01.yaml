  - number: '3.28'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan op grond van een internationale overeenkomst of een besluit van een
      volkenrechtelijke organisatie natuurlijke of rechtspersonen, die bedrijven voeren, welke op grond van eisen, welke
      gelijkwaardig zijn aan de krachtens [artikel 3.25][ref1] gestelde eisen,

      a. erkend zijn door de bevoegde autoriteit van een door hem bij ministeriële regeling aangewezen staat, of

      b. erkend zijn door een door hem bij ministeriële regeling aangewezen internationale organisatie erkennen als
      erkende bedrijven. Aan de erkenning kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.25
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel3.28
