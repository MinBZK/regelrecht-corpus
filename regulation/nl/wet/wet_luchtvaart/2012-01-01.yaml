      1 Indien de houder van een bewijs van bevoegdheid, dat overeenkomstig richtlijn nr. 2006/23/EG van het
      Europees Parlement en de Raad van de Europese Unie van 5 april 2006 inzake een communautaire vergunning
      van luchtverkeersleiders (PbEU L 114) door een andere lidstaat van de Europese Unie is verstrekt, binnen
      het vluchtinformatiegebied Amsterdam onder verantwoordelijkheid van een aangewezen instantie als bedoeld in
      [artikel 5.13][ref1], [5.14][ref2] of [5.14a][ref3] of een andere verlener van luchtverkeersdiensten als bedoeld
      in [artikel 5.14b, eerste lid][ref4], luchtverkeersdiensten verleent, verstrekt Onze Minister van Verkeer en
      Waterstaat hem op aanvraag een gelijkwaardig bewijs van bevoegdheid als bedoeld in deze wet.

      2 Bij ministeriële regeling kan Onze Minister van Verkeer en Waterstaat regels geven met betrekking tot de
      procedure van aanvraag.

      3 Een wijziging van richtlijn nr. 2006/23/EG van het Europees Parlement en de Raad van de Europese Unie van 5 april
      2006 inzake een communautaire vergunning van luchtverkeersleiders (PbEU L 114) gaat voor de toepassing van het
      eerste lid gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


