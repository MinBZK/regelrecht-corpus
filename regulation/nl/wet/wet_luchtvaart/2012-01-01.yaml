  - number: '8.29'
    text: |-
      1 De inspecteur-generaal brengt elk half jaar aan Onze Minister van Verkeer en Waterstaat en aan Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer verslag uit over de veiligheids- en milieuaspecten van het
      luchthavenluchtverkeer. Het verslag bevat ten minste een beschrijving van:

      a. de ter uitvoering van artikel 8.18 getroffen voorzieningen en van de doelmatigheid en doeltreffendheid van die
      voorzieningen;

      b. de ter uitvoering van artikel 8.22 getroffen maatregelen en van de doelmatigheid en de doeltreffendheid van
      die maatregelen.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent de verslaglegging.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.29
  - number: 8.29a
    text: |-
      1 De exploitant van de luchthaven brengt elke drie jaar, of zoveel eerder als Onze Minister van Verkeer en
      Waterstaat nodig oordeelt, aan Onze Minister van Verkeer en Waterstaat verslag uit over de exploitatie van de
      luchthaven. Het verslag bevat ten minste een beschrijving van de ter uitvoering van [artikel 8.25a][ref1] getroffen
      voorzieningen, een overzicht van alle daartoe relevante gegevens en een beschrijving van de doelmatigheid en
      doeltreffendheid van die voorzieningen.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de verslaggeving.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25a
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.29a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8.25a
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: '8.30'
    text: |-
      1 Bij ministeriële regeling worden regels gesteld omtrent het openbaar maken van gegevens als bedoeld in artikel
      8.28.

      2 De openbaarmaking geschiedt door kennisgeving van de gegevens of van de zakelijke inhoud ervan in een van
      overheidswege uitgegeven blad of een dag-, nieuws- of huis-aan-huisblad, dan wel op een andere geschikte wijze.
      Indien alleen van de zakelijke inhoud kennis wordt gegeven, worden de gegevens tegelijk ter inzage gelegd. In de
      kennisgeving wordt vermeld waar en wanneer de gegevens ter inzage liggen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.30
  - number: '8.31'
    text: |-
      1 Indien een belanghebbende ten gevolge van het luchthavenindelingbesluit of het luchthavenverkeerbesluit schade
      lijdt of zal lijden, welke redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven en waarvan de
      vergoeding niet of niet voldoende anderszins is verzekerd, kent Onze Minister van Verkeer en Waterstaat hem op
      aanvraag een naar billijkheid te bepalen schadevergoeding toe.

      2 Een aanvraag om schadevergoeding wordt ingediend binnen vijf jaar nadat de desbetreffende bepaling van het
      luchthavenindelingbesluit of het luchthavenverkeerbesluit of het desbetreffende besluit op grond van een van
      genoemde besluiten onherroepelijk is geworden. Van de aanvrager heft Onze Minister van Verkeer en Waterstaat een
      recht ten bedrage van € 300. De aanvrager wordt gewezen op de verschuldigdheid van het recht en wordt medegedeeld
      dat het verschuldigde bedrag binnen vier weken na de dag van verzending van de mededeling op de door Onze Minister
      van Verkeer en Waterstaat aangegeven rekening moet zijn bijgeschreven. Indien het bedrag niet binnen deze termijn
      is bijgeschreven, wordt de aanvrager niet ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden geoordeeld
      dat de aanvrager in verzuim is geweest. Indien op de aanvraag geheel of gedeeltelijk positief wordt beslist, stort
      Onze Minister van Verkeer en Waterstaat het betaalde recht terug.

      3 [Afdeling 6.1 van de Wet ruimtelijke ordening][ref1] blijft buiten toepassing voor zover de belanghebbende met
      betrekking tot de schade een beroep doet of kan doen op een schadevergoeding als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.1
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.31
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.1'
  - number: '8.32'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer een regeling vaststellen inzake het treffen van geluidwerende voorzieningen ten aanzien
      van in de regeling bepaalde woningen of andere geluidsgevoelige gebouwen voor zover die gebouwen vanwege het
      luchthavenluchtverkeer een geluidbelasting kunnen ondervinden die ligt boven de in de regeling vastgestelde
      maximale waarden.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.32
  - number: '8.33'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan regels stellen ten aanzien van het verstrekken van geldelijke steun uit
      s Rijks kas aan gemeenten ter bestrijding van de kosten ten gevolge van uitvoering van de in overeenstemming met
      het luchthavenindelingbesluit gebrachte bestemmingsplannen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.33
  - number: '8.34'
    text: |-
      1 Er is een commissie regionaal overleg luchthaven Schiphol.

      2 De commissie bestaat uit een onafhankelijke voorzitter en vertegenwoordigers van:

      a. de provincies Noord-Holland, Zuid-Holland en Utrecht;

      b. gemeenten in de in onderdeel a genoemde provincies;

      c. de exploitant van de luchthaven;

      d. de verlener van luchtverkeersdienstverlening;

      e. luchtvaartmaatschappijen die geregeld van de luchthaven gebruik maken.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.34
  - number: '8.35'
    text: |-
      De commissie heeft tot taak om door overleg tussen de in artikel 8.34 bedoelde betrokkenen een gebruik van de
      luchthaven te bevorderen dat zoveel mogelijk recht doet aan de belangen van die betrokkenen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.35
  - number: '8.36'
    text: |-
      Onze Minister van Verkeer en Waterstaat stelt nadere regels omtrent de taak en de samenstelling van de commissie.
      Daarbij wordt bepaald welke in artikel 8.34, tweede lid, bedoelde gemeenten en luchtvaartmaatschappijen in de
      commissie vertegenwoordigd zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.36
  - number: '8.37'
    text: |-
      1 De voorzitter van de commissie wordt door Onze Minister van Verkeer en Waterstaat benoemd, geschorst en
      ontslagen.

      2 Elk ander lid wordt benoemd, geschorst en ontslagen door de voorzitter op voordracht van het orgaan of de
      organisatie die het lid vertegenwoordigt.

      3 De benoeming geschiedt voor ten hoogste vier jaren. Herbenoeming kan telkens voor ten hoogste vier jaren
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.37
  - number: '8.38'
    text: |-
      De commissie stelt een bestuursreglement vast. Het reglement behoeft de goedkeuring van Onze Minister van Verkeer
      en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.38
  - number: '8.39'
    text: |-
      De commissie heeft een secretariaat. De samenstelling en de werkzaamheden van het secretariaat worden in het
      bestuursreglement geregeld.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.39
  - number: '8.40'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de commissie wordt in het bestuursreglement geregeld.
      De bescheiden worden na beëindiging van de werkzaamheden van de commissie opgeborgen in het archief van het
      ministerie van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.40
  - number: '8.41'
    text: |-
      1 Deze titel is van toepassing op luchthavens van regionale betekenis.

      2 Bij of krachtens algemene maatregel van bestuur kunnen, indien bovenprovinciale belangen dit vorderen, regels
      worden gesteld ten aanzien van de vorm van luchtvaart die in ieder geval toegang heeft tot een luchthaven van
      regionale betekenis. Bij of krachtens algemene maatregel van bestuur kan tevens worden bepaald welke grenswaarden
      voor de geluidbelasting voor dit luchthavenluchtverkeer ter beschikking moeten worden gesteld.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.41
  - number: '8.42'
    text: |-
      Deze afdeling is van toepassing op luchthavens van regionale betekenis waarvoor op grond van
      [artikel 8.1a, derde lid][ref1], vaststelling van een luchthavenbesluit is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1a
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.42
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8.1a
        hoofdstuk: '8'
  - number: '8.43'
    text: |-
      1 Provinciale staten stellen bij verordening voor de luchthaven een luchthavenbesluit vast. Provinciale
      staten kunnen de bevoegdheid tot het vaststellen van deze verordening niet overdragen als bedoeld in
      [artikel 152 van de Provinciewet][ref1].

      2 Een luchthavenbesluit bevat bepalingen omtrent:

      a. het luchthavenluchtverkeer, en

      b. de ruimtelijke indeling van het gebied van en rond de luchthaven.

      3 [Artikel 107 van de Provinciewet][ref2] is niet van toepassing, tenzij op grond van
      [artikel 106 van de Wet gemeenschappelijke regelingen][ref3] een plusregio is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel107
      [ref3]: https://wetten.overheid.nl/BWBR0003740#Artikel106
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.43
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '107'
      - id: ref3
        bwb_id: BWBR0003740
        artikel: '106'
  - number: '8.44'
    text: |-
      1 Het luchthavenbesluit bevat ten aanzien van het luchthavenluchtverkeer:

      a. grenswaarden en regels voor zover deze noodzakelijk zijn met het oog op de geluidbelasting, en

      b. regels voor zover deze noodzakelijk zijn met het oog op de vliegveiligheid.

      2 Een luchthavenbesluit kan tevens regels of grenswaarden bevatten die noodzakelijk zijn met het oog op het
      externe-veiligheidsrisico of de lokale luchtverontreiniging.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de in luchthavenbesluiten
      op te nemen grenswaarden en regels. Deze maatregel stelt in ieder geval regels omtrent het opnemen van grenswaarden
      voor de geluidbelasting. Bij deze maatregel kan een onderscheid worden gemaakt tussen categorieën luchthavens en
      tussen vormen van luchtvaart die gebruik maken van luchthavens.

      4 De [artikelen 8.19 tot en met 8.21][ref1] zijn van overeenkomstige toepassing.

      5 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      6 Bij de vaststelling van het luchthavenbesluit wordt gebruik gemaakt van:

      a. de gegevens met betrekking tot het verkeer over wegen en daarop gebaseerde onderzoeken,

      b. de krachtens [artikel 5.20, eerste lid, van de Wet milieubeheer][ref2] bekendgemaakte gegevens en daarop
      gebaseerde onderzoeken, en

      c. de inventarisatie van en de gevolgen voor de aanwezige flora en fauna en daarop gebaseerde onderzoeken, die ten
      grondslag hebben gelegen aan het ontwerp-besluit, met dien verstande dat indien de rapporten, waarin de gegevens,
      onderzoeken, inventarisaties en gevolgen zijn vervat, bij de vaststelling van het luchthavenbesluit ouder zijn dan
      twee jaar, het luchthavenbesluit een motivering van de actualiteit van die rapporten bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.19
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel5.20
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.44
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.19'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '5.20'
  - number: '8.45'
    text: |-
      1 Zodra gedeputeerde staten constateren dat een in het luchthavenbesluit opgenomen grenswaarde is overschreden,
      schrijven zij maatregelen voor die naar hun oordeel bijdragen aan het terugdringen van de belasting vanwege het
      luchthavenluchtverkeer binnen de grenswaarden.

      2 [Artikel 8.22, derde en vierde lid][ref1], is van overeenkomstige toepassing met dien verstande dat gedeputeerde
      staten in de plaats treden van de inspecteur-generaal. [Artikel 8.44, vierde lid][ref2], is van overeenkomstige
      toepassing ten aanzien van de voorgeschreven maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.22
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.44
