        artikel: '3.3'
  - number: '8.10'
    text: |-
      Voor zover het ontwerp van een bestemmingsplan zijn grondslag vindt in de uitvoering van het
      luchthavenindelingbesluit is [artikel 3.8, eerste lid, onderdeel d, van de Wet ruimtelijke ordening][ref1] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3.8
