  - number: '10.23'
    text: |-
      De gegevens omtrent het feitelijk gebruik van een luchthaven door het luchthavenluchtverkeer worden jaarlijks
      door Onze Minister van Defensie in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening
      en Milieubeheer herleid tot contouren die de actuele geluidsbelasting voor dat verkeer in dat jaar weergeven.
      [Artikel 10.19][ref1] is van toepassing. De contourenkaarten zijn openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.19
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.23
