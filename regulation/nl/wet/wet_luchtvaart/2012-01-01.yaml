  - number: 11.10a
    text: |-
      1 Voor een overtreding of misdrijf waarop in de [artikelen 11.9][ref1] en [11.10][ref2] een geldboete van de derde
      of vierde categorie is gesteld, kan de rechter in de openbare lichamen Bonaire, Sint Eustatius en Saba telkens een
      geldboete van ten hoogste de derde categorie, onderscheidenlijk de vierde categorie opleggen.

      2 Handelen in strijd met de [artikelen 4.1, eerste en derde lid][ref3], alsmede als strafbare feiten aangeduide
      overtredingen van voorschriften krachtens [hoofdstuk 4][ref4] wordt in de openbare lichamen Bonaire, Sint Eustatius
      en Saba aangemerkt als een overtreding en wordt door de rechter gestraft met een gevangenisstraf van ten hoogste 6
      maanden, een taakstraf of een geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11.9
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11.10
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel4.1
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk4
