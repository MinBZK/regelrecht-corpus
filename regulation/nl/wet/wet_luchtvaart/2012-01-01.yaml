  - number: '10.36'
    text: |-
      1 [Artikel 8.29][ref1] is ten aanzien van de veiligheidsaspecten van het luchthavenluchtverkeer ten behoeve van de
      burgerluchtvaart van overeenkomstige toepassing. Ten aanzien van de milieuaspecten van luchthavenluchtverkeer ten
      behoeve van de burgerluchtvaart is [artikel 8.29][ref2] van overeenkomstige toepassing met dien verstande dat het
      in dat artikel bedoelde verslag wordt uitgebracht door Onze Minister van Defensie.

      2 Bij ministeriële regeling worden regels gesteld omtrent het openbaar maken van op grond van de
      [artikelen 10.34][ref3] of [10.35][ref4] geregistreerde of verstrekte gegevens. [Artikel 8.30, tweede lid][ref5],
      is van toepassing.


