  - number: '3.5'
    text: |-
      1 Ten bewijze van inschrijving in het register, bedoeld in [artikel 3.3][ref1], verstrekt Onze Minister van Verkeer
      en Waterstaat respectievelijk Onze Minister van Defensie met betrekking tot het ingeschreven luchtvaartuig een
      bewijs van inschrijving. Onze Minister wie het aangaat kan een inschrijvingsbewijs wijzigen. Het bewijs wordt
      verstrekt voor onbepaalde tijd.

      2 In geval van toepassing van [artikel 3.3, derde lid][ref2], verstrekt Onze Minister van Verkeer en Waterstaat een
      bewijs van inschrijving voor de termijn, waarvoor het betrokken luchtvaartuig is ingeschreven.

      3 In geval van:

      a. wijziging van de inschrijving, bedoeld in [artikel 3.4, eerste lid][ref3], of

      b. doorhaling van de inschrijving, bedoeld in [artikel 3.4, derde lid][ref4], kan Onze Minister van Verkeer
      en Waterstaat aan de aanvrager een tijdelijk bewijs van inschrijving ver trekken voor ten hoogste vier weken.
      Wijziging of doorhaling van de inschrijving vindt plaats na verstrijken van de termijn, waarvoor het tijdelijk
      bewijs van inschrijving is verleend.

      4 In geval van ambtshalve wijziging of doorhaling van de inschrijving, bedoeld in [artikel 3.4][ref5], tweede
      respectievelijk vierde of vijfde lid, levert de houder van het bewijs van inschrijving dit bewijs terstond in bij
      Onze Minister van Verkeer en Waterstaat.

      5 Bij regeling van Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kunnen met
      betrekking tot het model en de uitvoering van het bewijs van inschrijving eisen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3.3
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel3.4
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel3.4
