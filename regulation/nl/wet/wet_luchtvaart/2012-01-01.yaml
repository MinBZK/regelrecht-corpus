  - number: 8.25da
    text: |-
      1 Onze minister van Verkeer en Waterstaat kan een groep luchthavens die wordt geëxploiteerd door de exploitant van
      de luchthaven of, indien dit een ander is, een en dezelfde houder van de luchthavenexploitatievergunning, aanwijzen
      als luchthavennetwerk.

      2 Onze minister van Verkeer en Waterstaat kan de exploitant van het luchthavennetwerk toestemming verlenen om een
      gemeenschappelijk, transparant systeem van tarieven vast te stellen voor het gehele luchthavennetwerk.

      3 Onze minister van Verkeer en Waterstaat kan de exploitant van de luchthaven en de exploitant van elke deelnemende
      overige burgerluchthaven, voor zover zij luchtverbindingen voor dezelfde stad of agglomeratie verzorgen,
      toestemming verlenen om een gemeenschappelijk, transparant systeem van tarieven vast te stellen voor alle
      luchthavens die de luchtverbindingen voor dezelfde stad of agglomeratie verzorgen.

      4 In geval van een gemeenschappelijk, transparant systeem van tarieven, als bedoeld in het tweede of derde
      lid, doet de exploitant van de luchthaven aan de gebruikers mededeling van een voorstel voor de tarieven
      en voorwaarden en stelt hij de tarieven en voorwaarden vast voor de luchthaven Schiphol overeenkomstig
      de [artikelen 8.25d tot en met 8.25i][ref1]. De exploitant van elke deelnemende overige burgerluchthaven
      doet aan de gebruikers mededeling van een voorstel en stelt de tarieven vast overeenkomstig de
      [artikelen 8.25d, eerste, tweede, zesde en tiende lid][ref2], [8.25e][ref3], [8.25f][ref4], [8.25h][ref5],
      [8.25i][ref6] en [8.25j][ref7]. De exploitant en de deelnemende overige burgerluchthavens dragen zorg voor de
      noodzakelijke onderlinge afstemming.

      5 In het geval dat een overige burgerluchthaven de drempelwaarde van vijf miljoen passagiersbewegingen
      overschrijdt, doet de exploitant van deze luchthaven aan de gebruikers mededeling van een voorstel
      voor de tarieven en voorwaarden en stelt hij de tarieven en voorwaarden vast overeenkomstig de
      [artikelen 8.25d, eerste, tweede, zesde en tiende lid][ref8], [8.25e][ref9], [8.25f][ref10], [8.25h][ref11],
      [8.25i][ref12] en [8.25j][ref13].


