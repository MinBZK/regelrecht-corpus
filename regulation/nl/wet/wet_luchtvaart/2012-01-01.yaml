        bwb_id: BWBR0005555
        artikel: 8a.45
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: 8a.47
        hoofdstuk: 8a
  - number: 8a.49
    text: |-
      Indien de belangrijke luchthaven een luchthaven van regionale betekenis is, treden bij de toepassing van de
      [artikelen 8a.45 tot en met 8a.48][ref1] gedeputeerde staten van de provincie die het luchthavenbesluit heeft
      vastgesteld, in de plaats van Onze Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.45
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8a.49
    references:
