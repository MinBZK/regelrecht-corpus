  - number: '11.15'
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving
      van:

      a. de bij of krachtens deze wet gestelde verplichtingen, met uitzondering van verplichtingen als bedoeld in de
      [artikelen 8.25d tot en met 8.25h][ref1];

      b. het bepaalde bij of krachtens de volgende EG verordeningen:

      1°. Verordening (EG) nr. 261/2004 van het Europees Parlement en de Raad van de Europese Unie van 11 februari
      2004 tot vaststelling van gemeenschappelijke regels inzake compensatie en bijstand aan luchtreizigers bij
      instapweigering en annulering of langdurige vertraging van vluchten en tot intrekking van Verordening (EEG) nr.
      259/91 (PbEU L 46);

      2°. de kaderverordening;

      3°. de luchtvaartnavigatiedienstenverordening;

      4°. de luchtruimverordening;

      5°. de interoperabiliteitsverordening;

      6°. Hoofdstuk III van Verordening (EG) nr. 2111/2005 van het Europees Parlement en de Raad van de Europese Unie van
      14 december 2005 betreffende de vaststelling van een communautaire lijst van luchtvaartmaatschappijen waaraan een
      exploitatieverbod binnen de Gemeenschap is opgelegd en het informeren van luchtreizigers over de identiteit van de
      exploiterende luchtvaartmaatschappij en tot intrekking van artikel 9 van richtlijn nr. 2004/36/EG (PbEU L344);

      7°. Verordening (EG) nr. 1107/2006 van het Europees Parlement en de Raad van de Europese Unie van 5 juli 2006
      inzake de rechten van gehandicapten en personen met beperkte mobiliteit die per luchtvervoer reizen (PbEU L 204);

      8°. de vergoedingenverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25d
