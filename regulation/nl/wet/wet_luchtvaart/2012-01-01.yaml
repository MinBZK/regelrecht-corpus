  - number: 2.1a
    text: |-
      Onverminderd de [Algemene wet erkenning EG-beroepskwalificaties][ref1] is hoofdstuk 2 van overeenkomstige
      toepassing op de erkenning van beroepskwalificaties als bedoeld in die [wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023066
