  - number: '4.8'
    text: |-
      De gezagvoerder van een burgerluchtvaartuig is verplicht de bij regeling van Onze Minister van Verkeer en
      Waterstaat genoemde documenten mee te voeren.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel4.8
  - number: '5.1'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 5.3][ref1] tot en met [5.9][ref2] is van toepassing op:

      a.. deelnemers aan het luchtverkeer binnen het vluchtinformatiegebied Amsterdam, en

      b. Nederlandse luchtvaartuigen, waar deze zich ook bevinden, tenzij dit onverenigbaar is met de daar ter plaatse
      geldende regels of de regels die in overeenstemming met internationale afspraken worden gehanteerd door de ter
      plaatse voor het verlenen van luchtverkeersdiensten verantwoordelijke Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.9
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.3'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5.9'
        hoofdstuk: '5'
  - number: '5.2'
    text: |-
      Buiten het vluchtinformatiegebied Amsterdam houdt de gezagvoerder van een Nederlands luchtvaartuig zich aan de daar
      ter plaatse geldende regels. Indien in overeenstemming met internationale afspraken andere regels worden gehanteerd
      door de ter plaatse voor het verlenen van luchtverkeersdiensten verantwoordelijke Staat, houdt de gezagvoerder zich
      aan deze regels.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.2
  - number: '5.3'
    text: |-
      Het is verboden op zodanige wijze aan het luchtverkeer deel te nemen dan wel luchtverkeersleidingsdiensten te
      verlenen dat daardoor personen of zaken in gevaar worden of kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.3
  - number: '5.4'
    text: |-
      Het is verboden boven gebieden met aaneengesloten bebouwing of kunstwerken, industrie- en havengebieden daaronder
      begrepen, dan wel boven mensenmenigten, aan het luchtverkeer deel te nemen op een zodanige hoogte dat het niet
      meer mogelijk is een noodlanding uit te voeren zonder personen of zaken op het aardoppervlak in gevaar te brengen,
      tenzij zulks noodzakelijk is:

      a. om op te stijgen van of te landen op een luchthaven;

      b. voor de uitvoering van naderings- en vertrekprocedures, alsmede van luchtverkeerspatronen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de openbare veiligheid bij het
      gebruik van het luchtruim, ter bevordering van het veilige, ordelijke en vlotte verloop van het luchtverkeer of ter
      bescherming van personen of zaken aan boord van het luchtvaartuig of op het aardoppervlak regels worden gesteld aan
      deelnemers van het luchtverkeer.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorts regels worden gesteld betreffende:

      a. de uitvoering van vluchten;

      b. de met betrekking tot de uitvoering van vluchten te verstrekken inlichtingen;

      c. de communicatie tussen deelnemers aan het luchtverkeer onderling en met de instanties en organisaties belast met
      het verlenen van luchtverkeersdiensten;

      d. de in en ten behoeve van het luchtverkeer te gebruiken tekens en seinen;

      e. het gebruik van het luchtruim anders dan door luchtverkeer; en

      f. gedrag van het verkeer op een luchthaven.

      3 Onze Minister van Verkeer en Waterstaat kan ontheffing of vrijstelling verlenen van het bepaalde bij of krachtens
      het eerste en tweede lid, mede met inachtneming van het veilige, ordelijke en vlotte verloop van het luchtverkeer.
      Aan de ontheffing of vrijstelling kunnen voorschriften of beperkingen worden verbonden. Het is verboden in strijd
      met die voorschriften of beperkingen te handelen.

      4 De kosten die samenhangen met het in behandeling nemen van de aanvraag en de afgifte van de in het derde lid
      bedoelde ontheffing of een wijziging daarvan, worden ten laste gebracht van de aanvrager.

      5 De bedragen ter vergoeding van de kosten worden vastgesteld bij regeling van Onze Minister van Verkeer en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.5
  - number: '5.6'
    text: Het is verboden een vlucht uit te voeren zonder dat een gezagvoerder is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.6
  - number: '5.7'
    text: |-
      1 De gezagvoerder bevindt zich aan boord van het luchtvaartuig.

      2 De gezagvoerder is, ongeacht of hij daadwerkelijk de stuurorganen bedient of niet, ervoor verantwoordelijk dat
      de uitvoering van de vlucht geschiedt in overeenstemming met de bij of krachtens deze wet gestelde regels. Van de
      regels bedoeld in [de eerste volzin][ref1] mag slechts worden afgeweken indien de omstandigheden dit in het belang
      van de veiligheid dringend noodzakelijk maken.

      3 Het eerste lid is niet van toepassing op door Onze Minister van Verkeer en Waterstaat respectievelijk Onze
      Minister van Defensie bij ministeriële regeling aan te wijzen onbemande luchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.7
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.7'
        hoofdstuk: '5'
  - number: '5.8'
    text: |-
      Voor de aanvang van iedere vlucht, neemt de gezagvoerder kennis van alle gegevens en inlichtingen die voor de
      uitvoering van de vlucht van belang zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.8
  - number: '5.9'
    text: |-
      1 Voor de aanvang van iedere vlucht waaraan luchtverkeersleidingsdiensten worden verleend wordt door of namens de
      gezagvoerder een vliegplan ingediend overeenkomstig de bij of krachtens de algemene maatregel van bestuur, bedoeld
      in [artikel 5.5, tweede lid, onderdeel c][ref1], gestelde regels. Het vliegplan bevat de gegevens en inlichtingen
      omtrent de voorgenomen vlucht.

      2 Alvorens een vlucht waaraan luchtverkeersleidingsdiensten worden verleend aan te vangen, of een gedeelte daarvan
      uit te voeren moet een desbetreffende klaring zijn gevraagd en verkregen.

      3 De gezagvoerder komt de door de verlener van luchtverkeersleidingsdiensten gegeven voorwaarden van de klaring
      na. Van de voorwaarden bedoeld in de eerste volzin mag slechts worden afgeweken indien de omstandigheden dit in
      het belang van de veiligheid dringend noodzakelijk maken. Een afwijking wordt zo spoedig mogelijk gemeld aan de
      betrokken verlener van luchtverkeersleidingsdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.5
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.5'
        hoofdstuk: '5'
  - number: '5.10'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat kan bij ministeriële regeling het uitoefenen van het burgerluchtverkeer
      tijdelijk of blijvend beperken of verbieden boven Nederland of gedeelten daarvan:

      a. om redenen van openbare orde en veiligheid;

      b. om andere dringende redenen, waarbij het uitoefenen van de luchtvaart en omstandigheden of gebeurtenissen op het
      aardoppervlak elkaar kunnen beïnvloeden;

      2 Onze Minister van Defensie kan bij ministeriële regeling het uitoefenen van het burgerluchtverkeer beperken of
      verbieden om reden van militaire noodzaak.

      3 Op voordracht van Onze Minister van Verkeer en Waterstaat, gedaan in overeenstemming met Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, worden bij algemene maatregel van bestuur regels
      gesteld met betrekking tot het uitoefenen van het burgerluchtverkeer boven gebieden aangewezen overeenkomstig
      [artikel 1.2, tweede lid, onder b, van de Wet milieubeheer][ref1].

      4 Van de regelingen krachtens het eerste en tweede lid wordt mededeling gedaan via de luchtvaartpublicaties bedoeld
      in [artikel 5.23, eerste lid, onder d][ref2], en voor zover nodig via de verlener van luchtverkeersdiensten aan de
      betrokken gezagvoerder.

      5 Het is verboden aan het luchtverkeer deel te nemen in strijd met het bepaalde krachtens het eerste, tweede en
      derde lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.23
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1.2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5.23'
        hoofdstuk: '5'
        paragraaf: 5.3.2
  - number: '5.11'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur:

      a. worden, met inachtneming van het type en de dichtheid van het luchtverkeer, delen van het vluchtinformatiegebied
      Amsterdam alsmede luchthavens aangewezen waar de daarbij bepaalde vormen van luchtverkeersdiensten worden verleend;

      b. worden in het vluchtinformatiegebied Amsterdam luchtverkeersroutes en -procedures vastgesteld, waaronder mede
      zijn begrepen naderings-, vertrek- en wachtprocedures, alsmede luchtverkeerspatronen;

      c. kunnen delen van het vluchtinformatiegebied Amsterdam worden aangewezen als bijzondere luchtverkeersgebieden,
      waar daarbij gegeven voorschriften gelden.

      2 Onze Minister van Verkeer en Waterstaat kan ontheffing of vrijstelling verlenen van het bepaalde bij of krachtens
      het eerste lid, mede met inachtneming van het veilige, ordelijke en vlotte verloop van het luchtverkeer. Aan de
      ontheffing of vrijstelling kunnen voorschriften of beperkingen worden verbonden. Het is verboden in strijd met die
      voorschriften of beperkingen te handelen.

      3 De kosten die samenhangen met het in behandeling nemen van de aanvraag en de afgifte van de in het tweede lid
      bedoelde ontheffing of een wijziging daarvan, worden ten laste gebracht van de aanvrager.

      4 De bedragen ter vergoeding van de kosten worden vastgesteld bij regeling van Onze Minister van Verkeer en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.11
  - number: '5.12'
    text: |-
      1 Luchtverkeersdiensten worden verleend in het belang van de algemene luchtverkeersveiligheid en een veilig,
      ordelijk en vlot verloop van het luchtverkeer.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop
      luchtverkeersdiensten worden verleend.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.12
  - number: '5.13'
    text: |-
      1 Binnen het vluchtinformatiegebied Amsterdam kunnen luchtverkeersdiensten worden verleend door:

      a. de LVNL.

      b. Onze Minister van Defensie;

      2 Onze Minister van Verkeer en Waterstaat en Onze Minister van Defensie tezamen wijzen de gebieden waarbinnen en
      het luchtverkeer waaraan de in het eerste lid genoemde instanties luchtverkeersdiensten verlenen, aan.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.13
  - number: '5.14'
    text: |-
      In afwijking van [artikel 5.13][ref1], kunnen Onze Minister van Verkeer en Waterstaat en Onze Minister van
      Defensie:

      a. delen van het vluchtinformatiegebied Amsterdam aanwijzen waarbinnen door de Eurocontrol-organisatie
      luchtverkeersdiensten worden verleend;

      b. in bijzondere situaties delen van het vluchtinformatiegebied Amsterdam aanwijzen waarbinnen
      luchtverkeersdiensten worden verleend door een andere verlener van luchtverkeersdiensten dan de in
      [artikel 5.13][ref2] genoemde verleners van luchtverkeersdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.13
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.13
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.13'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5.13'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14a
    text: |-
      Indien op basis van artikel 5 van de luchtruimverordening een luchtruimblok is ingesteld, waarvan een gedeelte van
      of het gehele vluchtinformatiegebied Amsterdam deel uitmaakt, wijzen, in afwijking van de [artikelen 5.13][ref1]
      en [5.14][ref2], Onze Minister van Verkeer en Waterstaat en Onze Minister van Defensie in overeenstemming met
      het bevoegde gezag van de overige betrokken staat of staten voor dat bepaalde gebied een of meer verleners van
      luchtverkeersdiensten aan, alsmede het luchtverkeer waaraan de bedoelde instanties luchtverkeersdiensten verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.13
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.14
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.14a
