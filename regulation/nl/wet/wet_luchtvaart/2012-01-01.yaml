  - number: '10.38'
    text: |-
      Deze afdeling is van toepassing op militaire luchthavens waarvoor op grond van [artikel 10.12][ref1] vaststelling
      van een luchthavenbesluit niet is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.12
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.38
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10.12'
        hoofdstuk: '10'
        afdeling: 10.3.1
  - number: '10.39'
    text: |-
      1 Bij regeling van Onze Minister van Defensie kan voor een luchthaven een luchthavenregeling worden vastgesteld.

      2 In een luchthavenregeling wordt het luchthavengebied vastgesteld. Een luchthavenregeling kan tevens een
      grenswaarde voor geluidbelasting in de vorm van een maximum aantal vliegtuigbewegingen per jaar bevatten.

      3 Op de voorbereiding of de wijziging van een luchthavenregeling is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.

      4 In een luchthavenregeling kunnen regels worden gegeven ten aanzien van:

      a. de aard en de omvang van het gebruik van de luchthaven;

      b. het toegestane luchthavenluchtverkeer voor zover die regels noodzakelijk zijn met het oog op de veiligheid en
      de geluidbelasting.

      5 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van luchthavens of categorieën luchthavens
      regels worden gegeven ten aanzien van:

      a. de aanleg, inrichting en uitrusting;

      b. het gebruik van de luchthaven, mede met het oog op de veiligheid.

      6 Het luchthavengebied wordt vastgesteld met behulp van een kaart waarop de ligging van dit gebied is aangegeven.
      Deze kaart wordt vervaardigd op een schaal van ten minste 1 op 10 000.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '10.40'
    text: |-
      Onze Minister van Defensie draagt er zorg voor dat het luchthavenluchtverkeer geschiedt overeenkomstig de
      luchthavenregeling.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.40
  - number: '10.41'
    text: |-
      1 Zodra Onze Minister van Defensie constateert dat de in [artikel 10.39, tweede lid][ref1], bedoelde grenswaarde is
      overschreden, schrijft hij maatregelen voor die naar zijn oordeel bijdragen aan het terugdringen van de belasting
      vanwege het luchthavenluchtverkeer binnen de gestelde grenswaarde.

      2 Onze Minister van Defensie trekt de maatregelen in of matigt deze voor zover de maatregelen naar zijn oordeel
      niet langer nodig zijn voor het terugdringen van de belasting vanwege het luchthavenluchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.39
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.41
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10.39'
        hoofdstuk: '10'
        paragraaf: 10.3.4.2
        afdeling: 10.3.4
  - number: '10.42'
    text: |-
      1 Onze Minister van Defensie kan voor een luchthaven indien ten gevolge van groot onderhoud van een baan of door
      een bijzonder voorval het normale gebruik van de luchthaven naar zijn oordeel ernstig wordt belemmerd, of in
      verband met bijzondere redenen van nationale of bondgenootschappelijke aard vrijstelling verlenen van een bepaling
      in de luchthavenregeling.

      2 Een vrijstelling kan slechts worden verleend voor een bepaalde in de vrijstelling vast te stellen termijn van ten
      hoogste een jaar.

      3 Aan de vrijstelling kunnen beperkingen en voorschriften worden verbonden met het oog op de veiligheid of de
      geluidbelasting.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.42
  - number: '10.43'
    text: |-
      Onze Minister van Defensie registreert het feitelijk gebruik van de luchthaven. Bij regeling van Onze Minister van
      Defensie in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer worden
      regels gesteld omtrent de wijze van registratie en openbaarmaking van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.43
  - number: '10.44'
    text: |-
      1 Van het in [artikel 8.1a, eerste lid][ref1], genoemde verbod kan vrijstelling worden verleend door Onze Minister
      van Defensie ten behoeve van de militaire luchtvaart.

      2 Aan de vrijstelling kunnen beperkingen en voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1a
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.44
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8.1a
        hoofdstuk: '8'
  - number: '11.1'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde, met uitzondering van de
      [artikelen 8.25d tot en met 8.25h][ref1] zijn belast:

      a. de in [artikel 141 van het Wetboek van Strafvordering][ref2] bedoelde ambtenaren, met dien verstande dat dit
      toezicht zich niet uitstrekt tot het bepaalde bij of krachtens [titel 6.5][ref3] en de [artikelen 10.7][ref4] en
      [10.8][ref5];

      b. voor zover het betreft de burgerluchtvaart de hiertoe bij besluit van Onze Minister van Verkeer en Waterstaat
      aangewezen ambtenaren; de aanwijzing kan inhouden, dat de betrokken ambtenaar slechts belast is met het toezicht
      op de naleving van een of enkele in die aanwijzing genoemde hoofdstukken of artikelen gesteld bij of krachtens
      deze wet;

      c. voor zover het betreft het vervoer van gevaarlijke stoffen als bedoeld in [titel 6.5][ref6] en de
      [artikelen 10.7][ref7] en [10.8][ref8], met luchtvaartuigen waarvan de krijgsmacht of de krijgsmacht van een andere
      mogendheid houder is, de hiertoe bij besluit van Onze Minister van Defensie aangewezen ambtenaren; de aanwijzing
      kan inhouden dat de betrokken ambtenaar slechts belast is met het toezicht op de naleving van een of enkele in die
      aanwijzing genoemde artikelen gesteld bij of krachtens deze wet.

      2 Met het toezicht op de naleving van hetgeen bepaald is bij of krachtens de kaderverordening, de
      luchtvaartnavigatiedienstenverordening, de luchtruimverordening en interoperabiliteitsverordening, zijn belast de
      hiertoe bij besluit van Onze Minister van Verkeer en Waterstaat aangewezen ambtenaren. De aanwijzing kan inhouden,
      dat de betrokken ambtenaar slechts belast is met het toezicht op de naleving van een of enkele in die aanwijzing
      genoemde hoofdstukken of artikelen gesteld bij of krachtens een van de genoemde verordeningen.

      3 Onze Minister van Verkeer en Waterstaat kan met het oog op de coördinatie van het beleid ten aanzien van het
      toezicht algemene aanwijzingen geven aan de ambtenaren, bedoeld in het eerste lid, onderdeel a.

      4 Van een besluit als bedoeld in het eerste lid, onderdeel b of c, of het tweede lid wordt mededeling gedaan door
      plaatsing in de Staatscourant.


