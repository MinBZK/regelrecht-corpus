  - number: '5.33'
    text: |-
      1 De raad van toezicht heeft een eigen secretariaat; de kosten daarvan komen ten laste van de LVNL.

      2 De raad van toezicht kan zijn leden, ten laste van de LVNL, een vergoeding toekennen voor hun werkzaamheden.

      3 De leden van de raad van toezicht hebben aanspraak op vergoeding van de door hen in de uitoefening van hun
      functie gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.33
  - number: '5.34'
    text: |-
      Het bestuur stelt bij reglement de hoofdlijnen vast van de inrichting van de LVNL en van de wijze van
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.34
  - number: '5.35'
    text: |-
      De bedrijfsvoering van de LVNL geschiedt zoveel mogelijk overeenkomstig die, welke algemeen gebruikelijk is bij het
      particuliere bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.35
  - number: '5.36'
    text: |-
      Het bestuur van de LVNL voert op bij reglement vast te stellen wijze overleg met gebruikers van door de organisatie
      geleverde diensten of met hun vertegenwoordigers omtrent aangelegenheden terzake waarvan naar zijn oordeel overleg
      dienstig is, alsmede omtrent aangelegenheden terzake waarvan de deelnemers aan het geïnstitutionaliseerde overleg
      het bestuur te kennen hebben gegeven overleg te willen voeren.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.36
  - number: '5.37'
    text: |-
      1 Het personeel van de LVNL, de leden van het bestuur daaronder begrepen, is ambtenaar in de zin van de
      [Ambtenarenwet][ref1].

      2 Het bestuur stelt bij reglement de regeling van de rechtstoestand van het personeel vast.

      3 Onverminderd hetgeen reeds bij of krachtens de wet is geregeld, geeft het reglement bedoeld in het tweede lid van
      dit artikel in ieder geval voorschriften betreffende de volgende onderwerpen:

      a. aanstelling;

      b. schorsing;

      c. ontslag;

      d. het onderzoek naar de geschiktheid en de bekwaamheid;

      e. bezoldiging;

      f. wachtgeld;

      g. diensttijden;

      h. verlof en vakantie;

      i. voorzieningen in verband met ziekte;

      j. bescherming bij de arbeid;

      k. woon-, verblijfs- en bereikbaarheidsverplichtingen;

      l. medezeggenschap;

      m. overige rechten en verplichtingen van het personeel;

      n. disciplinaire straffen;

      o. de wijze waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt
      gepleegd over aangelegenheden van algemeen belang voor de rechtstoestand en de bezoldiging van het personeel van
      de LVNL;

      p. een geschillenregeling met betrekking tot de onder *l* en *o* genoemde onderwerpen.

      4 De bepalingen van [artikel 126 van de Ambtenarenwet][ref2] zijn van overeenkomstige toepassing op de
      totstandkoming van het in het tweede lid bedoelde reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0001947
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel126
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.37
    references:
      - id: ref1
        bwb_id: BWBR0001947
      - id: ref2
        bwb_id: BWBR0001947
        artikel: '126'
  - number: '5.38'
    text: |-
      De geldmiddelen van de LVNL bestaan uit:

      a. de opbrengst van de in [artikel 5.20][ref1] en [5.21][ref2] bedoelde vergoedingen;

      b. de opbrengst van de vergoedingen voor verleende diensten waarvan de kosten niet reeds de basis vormen voor de
      vergoedingen bedoeld in de [artikelen 5.20][ref3] en [5.21][ref4];

      c. andere baten hoe ook genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.20
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.21
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5.20
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel5.21
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel5.38
