        hoofdstuk: '8'
  - number: '8.70'
    text: |-
      1 Voor een luchthaven waarvan op grond van [artikel 8.1, tweede lid][ref1], is bepaald dat deze van nationale
      betekenis is, wordt het luchthavenbesluit bij algemene maatregel van bestuur vastgesteld.

      2 De [artikelen 8.43, tweede lid][ref2], [8.44, eerste, tweede en vierde lid][ref3], [8.45][ref4], [8.46][ref5] en
      [8.47, eerste en tweede lid][ref6], zijn van overeenkomstige toepassing met dien verstande dat voor de toepassing
      van de artikelen 8.45, eerste lid, en 8.46, eerste lid, Onze Minister van Verkeer en Waterstaat in de plaats treedt
      van gedeputeerde staten.

      3 Het luchthavenbesluit bevat omtrent de ruimtelijke indeling van het gebied van en rond de luchthaven in ieder
      geval regels ten aanzien van:

      a. de bestemming en het gebruik van grond in verband met het externe-veiligheidsrisico vanwege het
      luchthavenluchtverkeer;

      b. de bestemming en het gebruik van grond in verband met de geluidbelasting vanwege het luchthavenluchtverkeer;

      c. de bestemming en het gebruik van de grond waaronder begrepen de maximale hoogte van objecten in, op of boven de
      grond, in verband met de vliegveiligheid.

      4 Bij het vaststellen van het luchthavenbesluit worden de nadere regels, bedoeld in
      [artikel 8.44, derde lid][ref7], en [artikel 8.47, derde lid][ref8], in acht genomen.

      5 Bij de vaststelling van het luchthavenbesluit wordt gebruik gemaakt van:

      a. de gegevens met betrekking tot het verkeer over wegen en daarop gebaseerde onderzoeken,

      b. de krachtens [artikel 5.20, eerste lid, van de Wet milieubeheer][ref9] bekendgemaakte gegevens en daarop
      gebaseerde onderzoeken, en

      c. de inventarisatie van en de gevolgen voor de aanwezige flora en fauna en daarop gebaseerde onderzoeken, die ten
      grondslag hebben gelegen aan het ontwerp-besluit, met dien verstande dat indien de rapporten, waarin de gegevens,
      onderzoeken, inventarisaties en gevolgen zijn vervat, bij de vaststelling van het luchthavenbesluit ouder zijn dan
      twee jaar, het luchthavenbesluit een motivering van de actualiteit van die rapporten bevat.

      6 Ten aanzien van de burgerluchthaven Twente wordt het luchthavenbesluit of een wijziging daarvan, in afwijking
      van het eerste lid, vastgesteld bij besluit van Onze Minister van Verkeer en Waterstaat in overeenstemming met Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer. [Artikel 8.71][ref10] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1
