        artikel: '11.21'
        hoofdstuk: '11'
        paragraaf: 11.2.2
  - number: '12.4'
    text: |-
      De ambtenaren die op het moment van inwerkingtreding van titel 5.3 van deze wet tot het personeel van de directie
      Luchtverkeersbeveiliging van de Rijksluchtvaartdienst van het Ministerie van Verkeer en Waterstaat behoren, gaan
      van rechtswege over in dienst van de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel12.4
  - number: '12.5'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat bepaalt in overeenstemming met Onze Minister van Financiën welke
      vermogensbestanddelen van de Staat worden toegerekend aan de LVNL.

      2 De in het eerste lid bedoelde vermogensbestanddelen gaan op de datum van inwerkingtreding van deze wet onder
      algemene titel over op de LVNL tegen een door Onze Minister van Verkeer en Waterstaat in overeenstemming met Onze
      Minister van Financiën te bepalen waarde.

      3 De in [het eerste lid van dit artikel][ref1] bedoelde overgang van vermogensbestanddelen wordt aangemerkt als
      storting op geldleningen van de Staat aan de LVNL. De voorwaarden van de geldlening worden door Onze Minister
      van Verkeer en Waterstaat in overeenstemming met Onze Minister van Financiën vastgesteld, waarbij een door Onze
      Minister van Verkeer en Waterstaat in overeenstemming met onze Minister van Financiën te bepalen deel van het te
      lenen bedrag achtergesteld zal zijn bij alle andere verplichtingen van de LVNL.

      4 Ten aanzien van de in [het eerste lid van dit artikel][ref2] bedoelde vermogensbestanddelen welke in openbare
      registers te boek zijn gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden. De daartoe
      nodige opgaven worden door de zorg van Onze Minister van Financiën aan de bewaarders van de desbetreffende
      registers gedaan.

      5 Ter zake van de verkrijging door de LVNL van de vermogensbestanddelen bedoeld in het eerste lid, blijft de
      heffing van overdrachtsbelasting achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel12.5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel12.5
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel12.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '12.5'
        hoofdstuk: '12'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '12.5'
        hoofdstuk: '12'
  - number: '12.6'
    text: |-
      In afwijking van het bepaalde in [artikel 5.31][ref1] benoemt Onze Minister van Verkeer en Waterstaat de leden van
      de raad van toezicht, bedoeld in [artikel 5.31, tweede lid onder a, b, c, en d][ref2] de eerste maal als volgt:

      a. een lid wordt benoemd op voordracht van Onze Minister van Defensie;

      b. een lid wordt benoemd uit de kring van de in Nederland werkzame luchtvaartmaatschappijen;

      c. een lid wordt benoemd uit de kring van de exploitanten van Nederlandse luchthavens;

      d. een lid, tevens voorzitter, wordt benoemd op voordracht van de vier reeds benoemde leden van de raad van
      toezicht, voor een periode van drie jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.31
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.31
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel12.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
