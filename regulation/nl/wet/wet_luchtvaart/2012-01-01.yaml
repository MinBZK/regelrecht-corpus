  - number: '10.26'
    text: |-
      Deze afdeling is in aanvulling op de [artikelen 10.15 tot en met 10.25][ref1] van toepassing op militaire
      luchthavens waar een vergunning voor burgermedegebruik kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.15
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.26
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10.15'
        hoofdstuk: '10'
        paragraaf: 10.3.2.2
        afdeling: 10.3.2
  - number: '10.27'
    text: |-
      1 Onze Minister van Defensie kan aan een rechtspersoon een vergunning verlenen voor burgermedegebruik onder
      verantwoordelijkheid van die rechtspersoon.

      2 Het verlenen van een vergunning voor burgermedegebruik door tussenkomst van een burgerexploitant geschiedt in
      overeenstemming met Onze Minister van Verkeer en Waterstaat. De overige vergunningen voor burgermedegebruik worden
      verleend na overleg met Onze Minister van Verkeer en Waterstaat.

      3 De vergunning vermeldt in ieder geval:

      a. de aard van het burgerluchtverkeer waarvoor de vergunning geldt;

      b. de termijn waarvoor de vergunning wordt verleend;

      c. de voor het burgermedegebruik geldende grenswaarden, wat betreft de geluidbelasting eventueel in de vorm van een
      maximum aantal vliegtuigbewegingen per jaar waarvoor de vergunning geldt.

      4 Aan de vergunning kunnen beperkingen en voorschriften worden verbonden.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het verlenen, wijzigen,
      overdragen en intrekken van de vergunning, alsmede omtrent de aan de behandeling van de aanvraag verbonden kosten.

      6 Een vergunning wordt niet verleend voor burgerluchtvaart van commerciële aard op een luchthaven waar reeds
      burgermedegebruik plaatsvindt door tussenkomst van een burgerexploitant.

      7 Een vergunning kan in ieder geval door Onze Minister van Defensie worden ingetrokken of gewijzigd wanneer:

      a. een of meer redenen waarom de vergunning is verleend, zijn vervallen,

      b. een of meer van de aan de vergunning verbonden beperkingen of voorschriften niet worden nageleefd,

      c. na de verlening zodanige feiten of omstandigheden bekend zijn geworden dat, indien deze ten tijde van de
      verlening bekend waren geweest, de vergunning niet of niet in die vorm zou zijn verleend, of

      d. van een voor onbepaalde tijd verleende vergunning gedurende twee achtereenvolgende jaren geen gebruik is
      gemaakt.

      8 Met betrekking tot de intrekking en wijziging, bedoeld in het zevende lid, is het tweede lid van overeenkomstige
      toepassing.

      9 Ingeval de vergunning is verleend aan een burgerexploitant, is [artikel 8.53][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.53
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.27
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.53'
        hoofdstuk: '8'
        paragraaf: 8.3.2.4
        afdeling: 8.3.2
  - number: '10.28'
    text: |-
      1 In het luchthavenbesluit voor een militaire luchthaven waar een vergunning voor burgermedegebruik kan worden
      verleend, worden de in [artikel 10.17, tweede en vierde lid][ref1], bedoelde grenswaarden en regels voor het
      militair luchtverkeer en het burgerluchtverkeer afzonderlijk vastgesteld. Voor het burgerluchtverkeer of een
      gedeelte daarvan kan de vaststelling van een afzonderlijke grenswaarde voor geluidbelasting geschieden in de vorm
      van een maximum aantal vliegtuigbewegingen per jaar.

      2 Het luchthavenbesluit bevat ten behoeve van het burgerluchtverkeer in ieder geval regels omtrent de tijdstippen
      waarop van de luchthaven gebruik kan worden gemaakt.

      3 Het luchthavenbesluit kan regels bevatten die noodzakelijk zijn met het oog op de geluidbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.17
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.28
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10.17'
        hoofdstuk: '10'
        paragraaf: 10.3.2.2
        afdeling: 10.3.2
  - number: '10.29'
    text: |-
      1 De houder van een vergunning voor burgermedegebruik en Onze Minister van Defensie bevorderen het goede
      verloop van het luchthavenluchtverkeer overeenkomstig de vergunning en het luchthavenbesluit voor zover
      dit betrekking heeft op het burgerluchtverkeer. Zij treffen daartoe zelf en in onderlinge samenwerking de
      voorzieningen die redelijkerwijs van hen kunnen worden gevergd om te bewerkstelligen dat de belasting vanwege het
      luchthavenluchtverkeer een in de vergunning voor het burgermedegebruik opgenomen grenswaarde, daaronder begrepen
      een voor het burgermedegebruik vastgesteld maximum aantal vliegtuigbewegingen, niet overschrijdt.

      2 Ingeval de vergunning voor burgermedegebruik is verleend aan een burgerexploitant, is [artikel 8.19][ref1] van
      overeenkomstige toepassing.

      3 [Artikel 8.21][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.19
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.21
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.29
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.19'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8.21'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: '10.30'
    text: |-
      1 Zodra Onze Minister van Defensie ter zake van een vergunning voor burgermedegebruik constateert dat een
      grenswaarde, daaronder begrepen een vastgesteld maximum aantal vliegtuigbewegingen, ten behoeve van het vergunde
      burgermedegebruik is overschreden, schrijft hij maatregelen voor die naar zijn oordeel bijdragen aan het
      terugdringen van de belasting vanwege het verkeer ten behoeve van de burgerluchtvaart.

      2 Onze Minister van Defensie trekt de maatregelen in of matigt deze voor zover zij naar zijn oordeel niet langer
      nodig zijn voor het terugdringen van de belasting vanwege het luchthavenluchtverkeer binnen de grenswaarden,
      daaronder begrepen het aantal vliegtuigbewegingen voor dat verkeer.

      3 Voordat Onze Minister van Defensie een maatregel voorschrijft, stelt hij degene tot wie de maatregel is gericht
      in de gelegenheid zijn zienswijze kenbaar te maken.

      4 De [artikelen 8.19][ref1] en [8.21][ref2] zijn in geval de vergunning voor burgermedegebruik is verleend aan een
      burgerexploitant, van overeenkomstige toepassing ten aanzien van de voorgeschreven maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.19
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.21
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.30
