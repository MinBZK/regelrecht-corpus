  - number: '10.37'
    text: |-
      1 De in [artikel 10.25][ref1] bedoelde commissie wordt in ieder geval uitgebreid met een vertegenwoordiger van
      degene aan wie een vergunning voor burgermedegebruik is verleend.

      2 De in [artikel 10.25][ref2] bedoelde commissie kan worden uitgebreid met vertegenwoordigers van
      rechtspersoonlijkheid bezittende gebruikersorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.25
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10.25
