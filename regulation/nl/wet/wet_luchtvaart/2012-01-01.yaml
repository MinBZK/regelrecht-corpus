  - number: '6.56'
    text: |-
      1 Onze Minister van Verkeer en Waterstaat erkent een opleiding voor een theoretisch of praktisch examen als
      opleiding voor een theoretisch of praktisch examen benodigd ter verkrijging van een erkenning, als bedoeld in
      [artikel 6.55, eerste lid][ref1], indien die opleiding voldoet aan bij ministeriële regeling te stellen eisen.

      2 Onze Minister van Verkeer en Waterstaat kan de erkenning van een opleiding intrekken, wanneer die opleiding niet
      meer aan de krachtens het eerste lid gestelde eisen voldoet.

      3 Bij ministeriële regeling kunnen ter uitvoering van het eerste en tweede lid nadere regels worden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.55
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel6.56
    references:
