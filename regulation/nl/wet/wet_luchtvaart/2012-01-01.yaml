  - number: '2.8'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan op grond van internationale overeenkomsten of besluiten van
      volkenrechtelijke organisaties bewijzen van bevoegdheid, bewijzen van gelijkstelling of medische verklaringen,
      die op grond van eisen, welke gelijkwaardig zijn aan de krachtens [artikel 2.3, zesde lid, onderdeel c][ref1], of
      [artikel 2.4, derde lid][ref2], gestelde eisen, zijn afgegeven door:

      a. de bevoegde autoriteit van een door hem bij ministeriële regeling aangewezen staat, of

      b. een door hem bij ministeriële regeling aangewezen internationale organisatie

      erkennen als geldig bewijs van bevoegdheid, geldig bewijs van gelijkstelling of geldige medische verklaring. Aan de
      erkenning kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
