  - number: 8a.43
    text: |-
      1 Provinciale staten kunnen bij verordening bepalen dat met betrekking tot de financiering en de bekostiging van de
      kosten van de uitvoering van [artikel 8.56, eerste lid][ref1], onder de naam «geluidsheffing burgerluchtvaart» een
      heffing wordt geheven. Tevens kunnen provinciale staten bij verordening bepalen dat een heffing wordt geheven ter
      financiering van de kosten van de uitvoering van [artikel 8.57][ref2].

      2 De heffingen worden geheven ter zake van het landen met een burgerluchtvaartuig tot het tijdstip waarop de kosten
      als bedoeld in het eerste lid, zijn voldaan.

      3 Voor de heffing en invordering zijn de [artikelen 220][ref3], [220a][ref4], [221][ref5] en
      [227 tot en met 232h van de Provinciewet][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.56
