  - number: '5.17'
    text: |-
      1 Een bij of krachtens [artikel 5.13][ref1], [5.14][ref2] of [5.14a][ref3] aangewezen instantie of een andere
      verlener van luchtverkeersdiensten als bedoeld in [artikel 5.14b, eerste lid][ref4], houdt een registratie
      bij van de daadwerkelijk gewerkte uren van de houders van een bewijs van bevoegdheid voor het verlenen van
      luchtverkeersdiensten aan wie deze instanties een opdracht als bedoeld in [artikel 5.16][ref5] hebben gegeven.

      2 Ten behoeve van het behoud van de geldigheid en de verlenging van een bewijs van bevoegdheid voor het verlenen
      van luchtverkeersdiensten kan Onze Minister van Verkeer en Waterstaat om inzage in de registratie als bedoeld in
      het eerste lid verzoeken.


