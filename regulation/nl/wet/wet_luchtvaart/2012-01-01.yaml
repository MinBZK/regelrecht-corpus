  - number: 8.25ea
    text: |-
      1 Gebruikers van de luchthaven die gebruik wensen te maken van diensten op maat of specifiek voor hen gereserveerde
      terminals of delen van terminals, kunnen een verzoek daartoe richten aan de exploitant.

      2 De exploitant van de luchthaven stelt relevante, objectieve, transparante en non-discriminatoire criteria vast,
      op basis waarvan een verzoek van gebruikers van de luchthaven wordt beoordeeld.

      3 Naast de criteria, bedoeld in het tweede lid, kan de exploitant van de luchthaven aanvullende criteria hanteren
      indien de inhoud van het verzoek daartoe noodzaakt. De aanvullende criteria voldoen aan dezelfde eisen als de
      criteria bedoeld in het tweede lid.

      4 Indien binnen vier weken nadat de exploitant van de luchthaven heeft beslist op een verzoek als bedoeld in
      het eerste lid, daartoe een aanvraag van een gebruiker is ingediend, stelt de raad vast of de beslissing van de
      exploitant in strijd is met bij of krachtens deze wet gestelde regels. De raad geeft zijn oordeel binnen drie
      maanden. Indien de raad vaststelt dat de beslissing in strijd is met bij of krachtens deze wet gestelde regels,
      deelt hij dit terstond mede aan de exploitant van de luchthaven. De exploitant van de luchthaven neemt binnen vier
      weken een nieuwe beslissing op het verzoek met inachtneming van de overwegingen van de raad.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel8.25ea
  - number: 8.25f
    text: |-
      1 Indien binnen vier weken na de mededeling, bedoeld in [artikel 8.25d, eerste lid][ref1], van de vaststelling
      van de tarieven en voorwaarden bij de raad een aanvraag van een gebruiker of van een representatieve organisatie
      is ingediend tot vaststelling of de tarieven en voorwaarden in strijd zijn met bij of krachtens deze wet
      gestelde regels, treden de tarieven en voorwaarden op de voorgenomen ingangsdatum niet in werking. De raad deelt
      de exploitant van de luchthaven terstond mede dat een aanvraag van een gebruiker of van een representatieve
      organisatie is ontvangen.

      2 De raad neemt binnen vier weken na ontvangst van de aanvraag een besluit omtrent de inwerkingtreding van de door
      de exploitant vastgestelde tarieven en voorwaarden. De raad wijst daarbij de tarieven en voorwaarden aan waarvoor,
      gelet op de aanvraag, de in het eerste lid bedoelde opschorting van de inwerkingtreding noodzakelijk blijft. In
      plaats van deze aangewezen tarieven en voorwaarden hanteert de exploitant de tarieven en voorwaarden die golden in
      de periode voorafgaand aan de periode waarvoor de aangewezen tarieven en voorwaarden waren vastgesteld. De tarieven
      en voorwaarden die niet zijn aangewezen, treden op de door de exploitant voorgenomen ingangsdatum in werking. Het
      nemen van een besluit als bedoeld in de eerste volzin, blijft achterwege indien binnen de daarin genoemde termijn
      een besluit over de aanvraag kan worden genomen.

      3 De raad beslist zo spoedig mogelijk doch uiterlijk binnen vier maanden na ontvangst van de aanvraag. Deze termijn
      kan in uitzonderlijke gevallen met twee maanden worden verlengd. De raad doet de aanvrager voor het einde van de in
      de eerste volzin bedoelde termijn met redenen omkleed mededeling van de verlenging.

      4 Indien de raad vaststelt dat de tarieven en voorwaarden in strijd zijn met bij of krachtens deze wet gestelde
      regels, deelt hij dit terstond mede aan de exploitant van de luchthaven. De exploitant van de luchthaven stelt
      opnieuw de tarieven en voorwaarden vast met inachtneming van de overwegingen van de raad. Nadat de tarieven
      en voorwaarden opnieuw zijn vastgesteld, trekt de raad het besluit omtrent de inwerkingtreding bedoeld in het
      tweede lid in. De opnieuw vastgestelde tarieven en voorwaarden gelden vanaf de door de exploitant oorspronkelijk
      voorgenomen ingangsdatum.

      5 Indien de raad heeft vastgesteld dat de tarieven en voorwaarden niet in strijd zijn met bij of krachtens deze
      wet gestelde regels, trekt hij het besluit omtrent de inwerkingtreding bedoeld in het tweede lid in, en gelden deze
      tarieven en voorwaarden vanaf de door de exploitant oorspronkelijk voorgenomen ingangsdatum.

      6 Eventuele verschillen in tarieven, voortvloeiende uit beslissingen van de raad als bedoeld in het eerste tot en
      met vijfde lid, worden vereffend bij de hernieuwde vaststelling van de tarieven en voorwaarden.

      7 Het eerste lid en [artikel 8.25e][ref2] zijn niet van toepassing op de vaststelling van tarieven en voorwaarden
      als bedoeld in het vierde lid.

      8 De exploitant van de luchthaven hanteert de ingevolge het vierde lid vastgestelde tarieven en
      voorwaarden gedurende het resterende deel van de periode waarvoor de tarieven en voorwaarden overeenkomstig
      [artikel 8.25d, eerste lid][ref3], waren vastgesteld.

      9 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de aanvraag, bedoeld in het
      eerste lid, aan de raad en omtrent de vaststelling van tarieven en voorwaarden, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25d
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25e
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25d
