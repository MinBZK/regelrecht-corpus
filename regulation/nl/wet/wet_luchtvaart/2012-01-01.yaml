        paragraaf: 5.2.1
  - number: 5.14b
    text: |-
      1 Een bij of krachtens [artikel 5.13][ref1], [5.14][ref2] of [5.14a][ref3] aangewezen instantie kan, onverminderd
      haar verantwoordelijkheid voor het verlenen van de diensten waartoe deze instantie is aangewezen, na schriftelijke
      instemming door Onze Minister van Verkeer en Waterstaat luchtverkeersdiensten laten verrichten door een andere
      verlener van luchtverkeersdiensten.

      2 Ter verkrijging van de in het eerste lid bedoelde instemming dient de bij of krachtens [artikel 5.13][ref4],
      [5.14][ref5] of [5.14a][ref6] aangewezen instantie hiertoe een verzoek in bij Onze Minister van Verkeer en
      Waterstaat.

      3 De bij of krachtens [artikel 5.13][ref7], [5.14][ref8] of [5.14a][ref9] aangewezen instantie verstrekt alle
      informatie die benodigd is voor de beoordeling van een verzoek als bedoeld in het tweede lid.

      4 Gronden waarop instemming als bedoeld in het eerste lid kan worden onthouden zijn:

      a. het niet voldoen of niet kunnen voldoen door de verlener van wiens diensten gebruik zal worden gemaakt aan de op
      grond van [artikel 5.14d][ref10], derde lid, aan het certificaat van de aangewezen instantie gestelde beperkingen
      en voorschriften;

      b. strijd met het belang van een veilig, ordelijk en vlot verloop van het luchtverkeer; of

      c. strijd met het recht.


