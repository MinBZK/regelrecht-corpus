  - number: '10.1'
    text: |-
      1 Behoudens titel 2.2 is [hoofdstuk 2][ref1] niet van toepassing op het bedienen van militaire luchtvaartuigen.

      2 Militaire luchtvaartuigen worden bediend door cockpitpersoneel, dat voldoet aan bij of krachtens algemene
      maatregel van bestuur gestelde eisen inzake theoretische en praktische bekwaamheid en geestelijke en lichamelijke
      geschiktheid.

      3 Onze Minister van Defensie kan in bijzondere gevallen ontheffing verlenen van de bij of krachtens het tweede lid
      gegeven regels, wanneer door bijzondere omstandigheden die regels in redelijkheid geen toepassing kunnen vinden
      en de veiligheid van het luchtverkeer met het verlenen van de ontheffing niet in gevaar wordt gebracht. Aan de
      ontheffing kunnen voorschriften of beperkingen worden verbonden.

      4 Onze Minister van Defensie trekt de door hem verleende ontheffing in, wanneer

      a. de redenen, waarom de ontheffing is verleend, zijn komen te vervallen;

      b. de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.1
