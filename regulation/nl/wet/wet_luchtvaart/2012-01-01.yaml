  - number: 8.25i
    text: |-
      1 Een belanghebbende kan beroep instellen bij de Afdeling bestuursrechtspraak van de Raad van State tegen een
      besluit als bedoeld in de [artikelen 8.25, tweede lid][ref1], [8.25b][ref2] en [8.25c][ref3].

      2 Een belanghebbende kan beroep instellen bij het College van Beroep voor het bedrijfsleven tegen een besluit
      omtrent de voorlopige inwerkingtreding als bedoeld in [artikel 8.25f, tweede lid][ref4].

      3 In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref5] is voor beroepen tegen besluiten van
      de raad op grond van [artikel 8.25f, eerste lid][ref6], en [artikel 8.25g, eerste lid][ref7], de rechtbank te
      Rotterdam bevoegd.

      4 In geval van een beroep tegen besluiten als bedoeld in [artikel 8.25f, eerste en tweede lid][ref8], en
      [artikel 8.25g, eerste lid][ref9], blijft [artikel 7:1 van de Algemene wet bestuursrecht][ref10] buiten toepassing.


