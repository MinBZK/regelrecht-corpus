        afdeling: 10.3.3
  - number: '10.34'
    text: |-
      1 De houder van de vergunning voor burgermedegebruik draagt zorg voor het registreren van de belasting vanwege
      het luchthavenluchtverkeer ten behoeve van de burgerluchtvaart zodanig dat een vergelijking mogelijk is met de
      in het luchthavenbesluit opgenomen grenswaarden voor burgerluchtvaart. Hij verricht de berekeningen die voor
      die registratie noodzakelijk zijn. Indien voor het burgermedegebruik een maximum aantal vliegtuigbewegingen is
      vastgesteld, draagt de houder van de vergunning zorg voor het registreren van het aantal vliegtuigbewegingen.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent het registreren en omtrent de berekeningen die
      daartoe noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel10.34
  - number: '10.35'
    text: |-
      1 De houder van de vergunning voor burgermedegebruik verstrekt aan Onze Minister van Defensie:

      a. de op grond van [artikel 10.34, eerste lid][ref1], door hem geregistreerde gegevens;

      b. gegevens over de in [artikel 10.34][ref2] bedoelde berekeningen, voor zover die door hem zijn verricht.

      2 De houder van de vergunning voor burgermedegebruik verstrekt aan Onze Minister van Defensie gegevens over de ter
      uitvoering van [artikel 10.29][ref3] getroffen voorzieningen.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de gegevensverstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.34
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10.34
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel10.29
