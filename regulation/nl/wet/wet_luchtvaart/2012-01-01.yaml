      - id: ref2
        bwb_id: BWBR0005775
  - number: 12.3a
    text: |-
      Onze Minister van Verkeer en Waterstaat en Onze Minister van Economische Zaken zenden binnen vier
      jaar na de inwerkingtreding van de [artikelen 8.25d tot en met 8.25h][ref1] en de artikelen 11.14a en
      [11.21 van deze wet][ref2] en vervolgens telkens na vijf jaar, aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze bepalingen in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25d
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11.21
    url: https://wetten.overheid.nl/BWBR0005555/2012-01-01#Artikel12.3a
