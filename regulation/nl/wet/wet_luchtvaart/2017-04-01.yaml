  - number: 11.25.1
    text: |-
      Naar aanleiding van een onopzettelijke of uit onachtzaamheid begane overtreding van een wettelijk voorschrift
      stelt de Staat geen rechtsvordering in en legt een bestuursorgaan geen bestuurlijke sanctie op indien van deze
      overtreding kennis is verkregen door een melding als bedoeld in [artikel 7.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel7
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.25
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '7'
        hoofdstuk: '7'
  - number: 11.25.2
    text: Het eerste lid is niet van toepassing indien sprake is van grove nalatigheid met betrekking tot het voorval.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.25
  - number: '11.26'
    text: |-
      Gegevens die bij een intern bedrijfsveiligheidsonderzoek in het kader van een bij of krachtens de Wet Luchtvaart of
      de [Luchtvaartwet][ref1] gecertificeerd veiligheidsmanagementssysteem zijn verkregen, kunnen niet ten behoeve van
      strafrechtelijk onderzoek naar aanleiding van een melding als bedoeld in [artikel 7.1][ref2] worden gevorderd dan
      na machtiging van de rechter-commissaris op vordering van de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel7
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.26
    references:
      - id: ref1
        bwb_id: BWBR0002267
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '7'
        hoofdstuk: '7'
  - number: '11.27'
    text: |-
      Onze Minister van Infrastructuur en Milieu publiceert, voor zover van toepassing, uiterlijk met ingang van één
      maand na de inwerkingtreding van dit artikel en daarna steeds maandelijks, in de Staatscourant een lijst van
      instanties ten aanzien waarvan in de daaraan voorafgaande periode een beschikking tot oplegging van de bestuurlijke
      boete, bedoeld in [artikel 11.16, eerste lid, onderdeel e][ref1], of een beschikking tot toepassing van de
      bestuursdwang, bedoeld in [artikel 11.15, onderdeel b, onder 1°, 6° en 7°][ref2], onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.27
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
