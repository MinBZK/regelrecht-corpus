        artikel: '11'
        hoofdstuk: '11'
        paragraaf: 11.2.1
  - number: '11.28'
    text: |-
      Ingeval bij of krachtens deze wet regels worden gesteld ter uitvoering van het op 7 december 1944 te Chicago tot
      stand gekomen Verdrag inzake de internationale burgerluchtvaart (Trb. 1973, 109), kan overtreding van die regels
      ook als strafbaar feit worden aangemerkt dan wel worden bestraft met een bestuurlijke sanctie indien deze regels in
      de Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.28
  - number: '12.2'
    text: |-
      Onze Minister van Infrastructuur en Milieu zendt drie jaar na de inwerkingtreding van deze wet aan de Staten-
      Generaal een verslag over de werking en de doeltreffendheid van de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.2
  - number: 12.3.2
    text: |-
      De krachtens het [Luchtverkeersreglement][ref1] 1980 (*Stb.* 1980, 786) door of vanwege Onze Minister gegeven
      nadere regels, alsook de krachtens het [Luchtverkeersreglement][ref2] 1980 door of vanwege Onze Minister gegeven
      vrijstellingen, ontheffingen en de daaraan verbonden voorschriften blijven nog twee jaar na het in werking treden
      van deze wet van kracht, tenzij zij op een vroeger tijdstip worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005775
      [ref2]: https://wetten.overheid.nl/BWBR0005775
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0005775
      - id: ref2
        bwb_id: BWBR0005775
  - number: 12.3.3
    text: |-
      De wet van 8 december 1971, *Stb.* 719, houdende inning van vergoedingen voor het gebruik van het luchtruim, wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.3
  - number: '12.4'
    text: |-
      De ambtenaren die op het moment van inwerkingtreding van titel 5.3 van deze wet tot het personeel van de directie
      Luchtverkeersbeveiliging van de Rijksluchtvaartdienst van het Ministerie van Infrastructuur en Milieu behoren, gaan
      van rechtswege over in dienst van de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.4
  - number: 12.5.1
    text: |-
      Onze Minister van Infrastructuur en Milieu bepaalt in overeenstemming met Onze Minister van Financiën welke
      vermogensbestanddelen van de Staat worden toegerekend aan de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.5
  - number: 12.5.2
    text: |-
      De in het eerste lid bedoelde vermogensbestanddelen gaan op de datum van inwerkingtreding van deze wet onder
      algemene titel over op de LVNL tegen een door Onze Minister van Infrastructuur en Milieu in overeenstemming met
      Onze Minister van Financiën te bepalen waarde.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.5
  - number: 12.5.3
    text: |-
      De in [het eerste lid van dit artikel][ref1] bedoelde overgang van vermogensbestanddelen wordt aangemerkt als
      storting op geldleningen van de Staat aan de LVNL. De voorwaarden van de geldlening worden door Onze Minister van
      Infrastructuur en Milieu in overeenstemming met Onze Minister van Financiën vastgesteld, waarbij een door Onze
      Minister van Infrastructuur en Milieu in overeenstemming met onze Minister van Financiën te bepalen deel van het te
      lenen bedrag achtergesteld zal zijn bij alle andere verplichtingen van de LVNL.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel12
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.5.4
    text: |-
      Ten aanzien van de in [het eerste lid van dit artikel][ref1] bedoelde vermogensbestanddelen welke in openbare
      registers te boek zijn gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden. De daartoe
      nodige opgaven worden door de zorg van Onze Minister van Financiën aan de bewaarders van de desbetreffende
      registers gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel12
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.5.5
    text: |-
      Ter zake van de verkrijging door de LVNL van de vermogensbestanddelen bedoeld in het eerste lid, blijft de heffing
      van overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.5
  - number: '12.6'
    text: |-
      In afwijking van het bepaalde in [artikel 5.31][ref1] benoemt Onze Minister van Infrastructuur en Milieu de leden
      van de raad van toezicht, bedoeld in [artikel 5.31, tweede lid onder a, b, c, en d][ref2] de eerste maal als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.3
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.3
  - number: 12.6.a
    text: een lid wordt benoemd op voordracht van Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.6
  - number: 12.6.b
    text: een lid wordt benoemd uit de kring van de in Nederland werkzame luchtvaartmaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.6
  - number: 12.6.c
    text: een lid wordt benoemd uit de kring van de exploitanten van Nederlandse luchthavens;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.6
  - number: 12.6.d
    text: |-
      een lid, tevens voorzitter, wordt benoemd op voordracht van de vier reeds benoemde leden van de raad van toezicht,
      voor een periode van drie jaren.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.6
  - number: '12.7'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.7
  - number: '12.8'
    text: 'Deze wet wordt aangehaald als: Wet luchtvaart.'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel12.8
