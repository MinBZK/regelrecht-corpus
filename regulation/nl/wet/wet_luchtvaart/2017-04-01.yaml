  - number: 11.16.1.e.1°
    text: |-
      Verordening (EG) nr. 261/2004 van het Europees Parlement en de Raad van de Europese Unie van 11 februari 2004 tot
      vaststelling van gemeenschappelijke regels inzake compensatie en bijstand aan luchtreizigers bij instapweigering en
      annulering of langdurige vertraging van vluchten en tot intrekking van Verordening (EEG) nr. 259/91 (PbEU L 46);
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16
  - number: 11.16.1.e.2°
    text: |-
      Hoofdstuk III van Verordening (EG) nr. 2111/2005 van het Europees Parlement en de Raad van de Europese Unie van
      14 december 2005 betreffende de vaststelling van een communautaire lijst van luchtvaartmaatschappijen waaraan een
      exploitatieverbod binnen de Gemeenschap is opgelegd en het informeren van luchtreizigers over de identiteit van de
      exploiterende luchtvaartmaatschappij en tot intrekking van artikel 9 van richtlijn nr. 2004/36/EG (PbEU L 344);
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16
  - number: 11.16.1.e.3°
    text: |-
      Verordening (EG) nr. 1107/2006 van het Europees Parlement en de Raad van de Europese Unie van 5 juli 2006 inzake de
      rechten van gehandicapten en personen met beperkte mobiliteit die per luchtvervoer reizen (PbEU L 204) en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16
  - number: 11.16.1.e.4°
    text: artikel 21, tweede lid, van de onderzoeksverordening.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16
  - number: 11.16.2
    text: Een bestuurlijke boete en een last onder dwangsom kunnen tezamen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16
  - number: 11.16.3
    text: 'De bestuurlijke boete bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16
  - number: 11.16.3.a
    text: 500 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16
  - number: 11.16.3.b
    text: 1 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16
  - number: 11.16.3.c
    text: 100 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel c;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16
  - number: 11.16.3.d
    text: 1 000 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel d;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16
  - number: 11.16.3.e
    text: 74 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel e.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16
  - number: 11.16a.1
    text: |-
      Onverminderd [titel 4.4 van de Algemene wet bestuursrecht][ref1] kan de verlener van luchtvaartnavigatiediensten
      de verdere verlening van luchtvaartnavigatiediensten opschorten, indien de gebruiker van die diensten
      niet heeft voldaan aan de eis tot het onmiddellijk en volledig betalen van de vergoedingen, bedoeld in
      [artikel 5.20, eerste lid, onderdeel b][ref2], en [artikel 5.21, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 11.16a.2
    text: |-
      De opschorting kan slechts plaatsvinden wanneer een gebruiker gedurende drie maanden zijn openstaande facturen voor
      de vergoedingen niet heeft betaald of wanneer de achterstallige schuld minimaal 10.000 euro bedraagt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.3
    text: |-
      Voor de opschorting van de dienstverlening, stuurt de verlener van luchtvaartnavigatiediensten een aangetekend
      besluit naar de gebruiker waarin wordt aangegeven dat bij niet-betaling van de vergoedingen binnen 30 dagen de
      dienstverlening op kosten van de gebruiker zal worden opgeschort. Het besluit bevat de datum en het tijdstip vanaf
      wanneer geen dienstverlening meer zal worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.4
    text: 'De kosten bedoeld in het derde lid, omvatten in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.4.a
    text: |-
      parkeerkosten voor het luchtvaartuig die de gebruiker als gevolg van de opschorting aan de betrokken
      luchthavenexploitant verschuldigd wordt,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.4.b
    text: |-
      kosten van verleende grondafhandelingsdiensten die de gebruiker als gevolg van de opschorting aan verleners van die
      diensten verschuldigd wordt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.5
    text: |-
      De dienstverlening blijft opgeschort zolang de achterstallige schuld vermeerderd met de in het derde lid bedoelde
      kosten niet is voldaan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.6
    text: |-
      De desbetreffende verlener van luchtvaartnavigatiediensten stelt de volgende instanties onverwijld op de hoogte van
      het besluit tot opschorting van de dienstverlening:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.6.a
    text: |-
      overige verleners van luchtvaartnavigatiediensten in de gebieden in en grenzend aan het vluchtinformatiegebied
      Amsterdam,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.6.b
    text: de betrokken luchthavenexploitant,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.6.c
    text: de Eurocontrol-organisatie,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.6.d
    text: Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.7
    text: |-
      Onze Minister van Infrastructuur en Milieu kan nadere regels stellen voor het opschorten van de verlening van
      luchtvaartnavigatiediensten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
  - number: 11.16a.8
    text: |-
      [Artikel 5.20, vijfde lid][ref1], is van overeenkomstige toepassing op de inning van vergoedingen als bedoeld in
      het derde lid, met dien verstande dat in onderlinge samenwerking voorzieningen worden getroffen door verleners van
      luchtvaartnavigatiediensten, exploitanten van luchthavens en verleners van grondafhandelingsdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 11.16a.9
    text: |-
      De LVNL kan op verzoek van de Eurocontrol-organisatie, ook de dienstverlening opschorten voor vluchten van
      gebruikers die een achterstand hebben in de betaling van aan de Eurocontrol-organisatie verschuldigde vergoedingen
      van kosten als bedoeld in [artikel 5.20, eerste lid, onderdeel a][ref1]. Het tweede tot en met het zevende lid zijn
      van overeenkomstige toepassing, met dien verstande dat de achterstallige schuld minimaal 50.000 euro bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.16a
