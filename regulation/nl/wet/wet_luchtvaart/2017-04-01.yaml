        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.5
        afdeling: 8.3.2
  - number: '8.79'
    text: |-
      Indien Onze Minister van Infrastructuur en Milieu voor een luchthaven een commissie regionaal overleg luchthaven
      instelt, is [artikel 8.75, lid 2, 3 en 4][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.79
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.4.2.4
        afdeling: 8.4.2
  - number: 8a.1.1
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen regels worden gesteld omtrent de aanleg,
      de inrichting, de uitrusting en het gebruik van luchthavens met het oog op de orde en de veiligheid op die
      luchthavens. Hierbij kan een onderscheid worden gemaakt tussen categorieën luchthavens en tussen vormen van
      luchtvaart die gebruik maken van luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.1
  - number: 8a.1.2
    text: |-
      Onze Minister van Infrastructuur en Milieu kan ontheffing verlenen van de regels, bedoeld in het eerste lid. Deze
      ontheffing wordt slechts verleend indien:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.1
  - number: 8a.1.2.a
    text: als gevolg van bijzondere omstandigheden de regels in redelijkheid geen toepassing kunnen vinden, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.1
  - number: 8a.1.2.b
    text: |-
      de veiligheid van de luchthaven en van het luchthavenluchtverkeer met het verlenen van een ontheffing niet in
      gevaar worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.1
  - number: 8a.1.3
    text: Aan de ontheffing, bedoeld in het tweede lid, kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.1
  - number: 8a.1.4
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen regels worden gesteld omtrent het verrichten van
      grondafhandelingsdiensten op luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.1
  - number: 8a.2.1
    text: |-
      Onze Minister van Infrastructuur en Milieu verleent of wijzigt op aanvraag van de exploitant een
      veiligheidscertificaat indien wordt voldaan aan de regels, bedoeld in [artikel 8a.1, eerste lid][ref1], voorzover
      deze regels betrekking hebben op het luchtvaartgebied en [artikel 8a.3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.2.2
    text: Een veiligheidscertificaat vermeldt het gebruik waarvoor het verleend is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.2
  - number: 8a.3.1
    text: |-
      Ten behoeve van het verkrijgen van een veiligheidscertificaat stelt de exploitant een luchthavenbedrijfshandboek
      op. Het luchthavenbedrijfshandboek bevat een beschrijving van de aanleg, de inrichting, de uitrusting en het veilig
      gebruik van het luchtvaartgebied alsmede een beschrijving van het veiligheidsmanagementsysteem van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.3
  - number: 8a.3.2
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden regels gegeven omtrent het
      veiligheidscertificaat, het veiligheidsmanagementsysteem en het luchthavenbedrijfshandboek. Hierbij kan een
      onderscheid worden gemaakt tussen categorieën luchthavens en vormen van luchtvaart die gebruik maken van
      luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.3
  - number: 8a.4.1
    text: |-
      Een veiligheidscertificaat vervalt vijf jaar na de dag van inwerkingtreding. Tussentijdse wijzigingen of
      aanvullingen gelden voor de resterende geldigheidsduur van het certificaat. Een veiligheidscertificaat is niet
      overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.4
  - number: 8a.4.2
    text: |-
      In afwijking van het eerste lid wordt de geldigheidsduur van het certificaat verlengd indien op het moment van
      de vervaldatum van het certificaat nog niet onherroepelijk op de aanvraag om verlenging van het certificaat is
      beslist. Het certificaat vervalt in dat geval op het moment dat onherroepelijk op de aanvraag om verlenging is
      beslist.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.4
  - number: 8a.4.3
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden nadere regels gegeven omtrent de aanvraag tot
      het verlenen of het wijzigen van een veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.4
  - number: 8a.4.4
    text: |-
      De kosten die samenhangen met het in behandeling nemen van de aanvraag en de afgifte van het certificaat of een
      wijziging of verlenging daarvan, worden ten laste gebracht van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.4
  - number: 8a.4.5
    text: |-
      De bedragen ter vergoeding van de kosten worden vastgesteld bij regeling van Onze Minister van Infrastructuur en
      Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.4
  - number: 8a.5.1
    text: |-
      Onze Minister van Infrastructuur en Milieu schorst het veiligheidscertificaat geheel of gedeeltelijk indien de
      veiligheid van de luchthaven niet gewaarborgd is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.5
  - number: 8a.5.2
    text: |-
      Onze Minister van Infrastructuur en Milieu trekt een veiligheidscertificaat geheel of gedeeltelijk in bij gehele of
      gedeeltelijke beëindiging van het gebruik waarvoor het certificaat is verleend.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.5
  - number: 8a.5.3
    text: |-
      Onze Minister van Infrastructuur en Milieu trekt een veiligheidscertificaat geheel of gedeeltelijk ambtshalve in
      indien:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.5
  - number: 8a.5.3.a
    text: er stelselmatig sprake is van grove overtredingen van de veiligheidsvoorschriften,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.5
  - number: 8a.5.3.b
    text: het veiligheidsmanagementsysteem de veiligheid niet langer waarborgt, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.5
  - number: 8a.5.3.c
    text: de exploitant ook na aanmaning weigert mee te werken aan het toezicht op de veiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.5
  - number: 8a.6
    text: |-
      De exploitant van de luchthaven is verplicht op de luchthaven elektronische, meteorologische en andere hulpmiddelen
      te gedogen ten behoeve van de aan de LVNL en Onze Minister van Infrastructuur en Milieu met betrekking tot de
      luchtverkeersbeveiliging en de luchtvaartmeteorologische dienstverlening opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.6
  - number: 8a.37
    text: Deze paragraaf is van toepassing op de luchthaven Schiphol.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.37
  - number: 8a.38.1
    text: |-
      Met betrekking tot de financiering en de bekostiging van de kosten van de uitvoering van [artikel 8.32][ref1] wordt
      onder de naam «geluidsheffing burgerluchtvaart» een heffing geheven. Naast de geluidsheffing burgerluchtvaart wordt
      een heffing geheven ter financiering van de kosten van de uitvoering van [artikel 8.33][ref2], alsmede de kosten van
      het Schadeschap Luchthaven Schiphol en van zijn uitspraken voor zover deze betrekking hebben op de uitvoering van
      __REF002___________________________________________________________________________________________________________
      _________________________________.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0009989#Artikel9
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.38
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.6'
      - id: ref3
        bwb_id: BWBR0009989
        artikel: '9'
  - number: 8a.38.2
    text: |-
      De heffingen worden geheven ter zake van het landen met een burgerluchtvaartuig tot het tijdstip waarop de kosten
      als bedoeld in het eerste lid, zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.38
  - number: 8a.38.3
    text: |-
      De heffingen worden geheven van de natuurlijke persoon of de rechtspersoon die als eigenaar of houder van
      een burgerluchtvaartuig dit te zijner beschikking heeft en dit onder zijn verantwoordelijkheid laat deelnemen
      aan het luchtverkeer. De natuurlijke persoon of rechtspersoon, bedoeld in de eerste volzin, is in ieder geval
      belanghebbende bij een uitspraak van het Schadeschap Luchthaven Schiphol als bedoeld in het eerste lid, tweede
      volzin.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.38
  - number: 8a.38.4
    text: |-
      De geluidsheffing burgerluchtvaart wordt geheven naar de geluidsproduktie van het burgerluchtvaartuig uitgedrukt in
      een aantal rekeneenheden. De geluidsproduktie wordt bepaald met toepassing van bij of krachtens algemene maatregel
      van bestuur te bepalen formules.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.38
  - number: 8a.38.5
    text: |-
      Het basistarief van de heffing per rekeneenheid geluidsproductie bedraagt in het jaar 2004 € 27,–. Het tarief van
      de heffing per rekeneenheid geluidsproductie wordt na 2004 met ingang van elk daarop volgend kalenderjaar verhoogd
      met € 1,–.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.38
  - number: 8a.38.6
    text: 'Het basistarief, bedoeld in het vijfde lid, wordt per rekeneenheid verhoogd met:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.38
  - number: 8a.38.6.a
    text: € 98,50 tot het jaar 2010;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.38
  - number: 8a.38.6.b
    text: |-
      € 40,– vanaf het jaar 2010, met dien verstande dat deze verhoging met ingang van elk daaropvolgend kalenderjaar
      wordt verhoogd met € 1,25.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.38
  - number: 8a.38.7
    text: |-
      Het tarief van de in het eerste lid, tweede volzin, bedoelde heffing bedraagt € 0,50 per ton van de maximale
      toegelaten startmassa van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.38
  - number: 8a.38.8
    text: |-
      Onze Minister van Infrastructuur en Milieu kan bij de toepassing van het eerste lid een deel van de kosten buiten
      toepassing laten indien toepassing, gelet op het belang van de burgerluchtvaart, zal leiden tot een onbillijkheid
      van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.38
  - number: 8a.38.9
    text: |-
      De eigenaar of houder van een luchtvaartuig dient de ter bepaling van de geluidsheffing noodzakelijke gegevens ter
      beschikking van Onze Minister van Infrastructuur en Milieu te stellen overeenkomstig door hem te geven regels.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.38
  - number: 8a.39.1
    text: De heffingen worden door Onze Minister van Infrastructuur en Milieu geheven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.39
  - number: 8a.39.2
    text: |-
      Onverminderd het overigens in dit artikel bepaalde worden de heffingen geheven met overeenkomstige toepassing
      van de [Algemene wet inzake rijksbelastingen][ref1], met dien verstande dat van [die wet][ref2] buiten toepassing
      blijven, de [artikelen 2, vierde lid][ref3], [37][ref4], [38][ref5], [47a][ref6] , [48][ref7], [52][ref8],
      [53][ref9] en [54][ref10] alsmede [68 tot en met 88][ref11].


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel37
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel38
      [ref6]: https://wetten.overheid.nl/BWBR0002320#Artikel47a
      [ref7]: https://wetten.overheid.nl/BWBR0002320#Artikel48
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel52
      [ref9]: https://wetten.overheid.nl/BWBR0002320#Artikel53
      [ref10]: https://wetten.overheid.nl/BWBR0002320#Artikel54
      [ref11]: https://wetten.overheid.nl/BWBR0002320#Artikel68
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.39
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002320
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '37'
      - id: ref5
        bwb_id: BWBR0002320
        artikel: '38'
      - id: ref6
        bwb_id: BWBR0002320
        artikel: 47a
      - id: ref7
        bwb_id: BWBR0002320
        artikel: '48'
      - id: ref8
        bwb_id: BWBR0002320
        artikel: '52'
      - id: ref9
        bwb_id: BWBR0002320
        artikel: '53'
      - id: ref10
        bwb_id: BWBR0002320
        artikel: '54'
      - id: ref11
        bwb_id: BWBR0002320
        artikel: '68'
  - number: 8a.39.3
    text: |-
      De bevoegdheden en de verplichtingen van de hierna vermelde, in de [Algemene wet inzake rijksbelastingen][ref1]
      genoemde functionarissen gelden met betrekking tot de heffingen voor de daarachter genoemde functionarissen:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.39
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 8a.39.3.a
    text: 'Onze Minister van Financiën: Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.39
  - number: 8a.39.3.b
    text: |-
      de inspecteur: de door Onze Minister van Infrastructuur en Milieu daartoe aan te wijzen functionaris van de
      exploitant van de luchthaven;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.39
  - number: 8a.39.4
    text: |-
      In afwijking van het derde lid, onderdeel b, treedt voor de toepassing van
      [hoofdstuk V van de Algemene wet inzake rijksbelastingen][ref1] de door Onze Minister van Infrastructuur
      en Milieu aan te wijzen ambtenaar in de plaats van de inspecteur. Voorts treedt voor de toepassing van
      [artikel 28a van de Algemene wet inzake rijksbelastingen][ref2] Onze Minister van Infrastructuur en Milieu in de
      plaats van Onze Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel28a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.39
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 28a
  - number: 8a.39.5
    text: |-
      De heffingen worden geheven bij wege van aanslag. Zij worden geheven over een bij regeling van Onze Minister van
      Infrastructuur en Milieu te bepalen tijdvak.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.39
  - number: 8a.40.1
    text: |-
      De heffingen worden ingevorderd door de door Onze Minister van Infrastructuur en Milieu aan te wijzen functionaris
      van de exploitant van de luchthaven, door de door Onze Minister van Infrastructuur en Milieu in overeenstemming
      met Onze Minister van Financiën aan te wijzen ambtenaar van de Dienst der Domeinen en door de ontvanger, bedoeld in
      [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.40
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
  - number: 8a.40.2
    text: |-
      Onverminderd het overigens in dit artikel bepaalde worden de heffingen ingevorderd met overeenkomstige
      toepassing van de [Invorderingswet 1990][ref1] en de [Kostenwet invordering rijksbelastingen][ref2],
      met dien verstande dat van de [Invorderingswet 1990][ref3] buiten toepassing blijven de
      [artikelen 9, eerste tot en met negende lid][ref4], [59][ref5] en [62][ref6]. Voorts blijven bij de toepassing
      van [artikel 66 van die wet][ref7] de [artikelen 76][ref8], [80, tweede, derde en vierde lid][ref9], [82][ref10],
      [84][ref11], [86][ref12] en [87 van de Algemene wet inzake rijksbelastingen][ref13] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
      [ref3]: https://wetten.overheid.nl/BWBR0004770
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel59
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel62
      [ref7]: https://wetten.overheid.nl/BWBR0004770#Artikel66
      [ref8]: https://wetten.overheid.nl/BWBR0002320#Artikel76
      [ref9]: https://wetten.overheid.nl/BWBR0002320#Artikel80
      [ref10]: https://wetten.overheid.nl/BWBR0002320#Artikel82
      [ref11]: https://wetten.overheid.nl/BWBR0002320#Artikel84
      [ref12]: https://wetten.overheid.nl/BWBR0002320#Artikel86
      [ref13]: https://wetten.overheid.nl/BWBR0002320#Artikel87
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.40
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002645
      - id: ref3
        bwb_id: BWBR0004770
      - id: ref4
