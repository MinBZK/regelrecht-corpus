  - number: 8.47.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de in luchthavenbesluiten op
      te nemen regels omtrent de vaststelling van het luchthavengebied en het beperkingengebied. Deze maatregel stelt ten
      aanzien van het beperkingengebied in ieder geval regels ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.47
  - number: 8.47.3.a
    text: |-
      de bestemming en het gebruik van grond in verband met het externe-veiligheidsrisico vanwege het
      luchthavenluchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.47
  - number: 8.47.3.b
    text: de bestemming en het gebruik van grond in verband met de geluidbelasting vanwege het luchthavenluchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.47
  - number: 8.47.3.c
    text: |-
      de bestemming en het gebruik van de grond waaronder begrepen de maximale hoogte van objecten in, op of boven de
      grond, in verband met de vliegveiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.47
  - number: 8.47.4
    text: |-
      De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.47
  - number: 8.47a
    text: |-
      Provinciale staten nemen bij de vaststelling van het luchthavenbesluit het beleid in acht dat door Onze Minister
      van Infrastructuur en Milieu over luchthavens is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.47a
  - number: '8.48'
    text: |-
      Op de voorbereiding van een luchthavenbesluit of op de voorbereiding van een wijziging van een luchthavenbesluit
      is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 8.49.1
    text: |-
      Een luchthavenbesluit of een wijziging van dit besluit treedt niet in werking dan nadat Onze Minister van
      Infrastructuur en Milieu heeft verklaard dat het veilig gebruik van het luchtruim door het luchthavenluchtverkeer
      is gewaarborgd. Onze Minister van Infrastructuur en Milieu beslist binnen negen weken na indiening van de aanvraag
      voor deze verklaring veilig gebruik.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.49
  - number: 8.49.2
    text: |-
      De afgifte van de verklaring van geen bezwaar op grond van [artikel 8.9, derde lid][ref1], of de ontheffing op
      grond van [artikel 8.12, derde lid][ref2], geschiedt niet dan nadat Onze Minister van Infrastructuur en Milieu
      heeft verklaard dat het veilig gebruik van het luchtruim door deze verklaring of ontheffing is gewaarborgd. Onze
      Minister van Infrastructuur en Milieu beslist binnen vier weken na indiening van de aanvraag voor deze verklaring
      veilig gebruik. Hij kan die beslissing eenmaal voor ten hoogste vier weken verdagen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.49
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
  - number: 8.49.3
    text: 'De verklaring veilig gebruik, bedoeld in het tweede lid, is van rechtswege verleend indien Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.49
  - number: 8.49.3.a
    text: niet binnen vier weken na ontvangst van de aanvraag een beslissing op die aanvraag heeft genomen,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.49
  - number: 8.49.3.b
    text: niet binnen vier weken na ontvangst van de aanvraag heeft besloten de beslissing op die aanvraag te verdagen, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.49
  - number: 8.49.3.c
    text: |-
      niet binnen de termijn waarmee de beslissing op de aanvraag is verdaagd, een beslissing op die aanvraag heeft
      genomen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.49
  - number: 8.49.4
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden voorschriften gegeven omtrent de gegevens die
      bij een aanvraag voor een verklaring van veilig gebruik moeten worden meegezonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.49
  - number: '8.50'
    text: |-
      Indien voor een luchthaven op grond van [artikel 5.11, eerste lid, onderdeel b][ref1], luchtverkeersroutes en
      -procedures worden vastgesteld, geschiedt vaststelling van het deel van de luchtverkeersroutes die zijn gelegen
      in het plaatselijk luchtverkeersleidinggebied, en vaststelling van de luchtverkeersprocedures, in overeenstemming
      met gedeputeerde staten. Bij de vaststelling van deze routes en procedures wordt het advies van gedeputeerde
      staten gevolgd, tenzij dit niet mogelijk is met het oog op de vliegveiligheid, de indeling van het luchtruim of de
      capaciteit van het luchtruim.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.50
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
  - number: '8.51'
    text: |-
      [Artikel 8.24a][ref1] is van toepassing met dien verstande dat voor de toepassing van het derde lid gedeputeerde
      staten in de plaats treden van Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.51
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.52.1
    text: |-
      De exploitant van een luchthaven is gerechtigd luchthavenluchtverkeer ten behoeve van burgerluchtvaart op de
      luchthaven afhankelijk te stellen van toestemming. De toestemming wordt alleen geweigerd om te voorkomen dat de in
      het luchthavenbesluit opgenomen grenswaarden worden overschreden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.52
  - number: 8.52.2
    text: |-
      Indien op de luchthaven luchtverkeersdienstverlening wordt gegeven vindt afstemming plaats met de verlening van
      luchtverkeersdienstverlening.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.52
  - number: 8.52.3
    text: |-
      Indien de exploitant gebruik maakt van het recht, bedoeld in het eerste lid, kan hij bij de vaststelling van
      tarieven voor de luchthaven een opslagtarief vaststellen voor het geval een luchtvaartuig zonder voorafgaande
      toestemming start of landt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.52
  - number: '8.53'
    text: |-
      Indien de exploitant van een luchthaven tarieven en voorwaarden vaststelt voor het gebruik van de luchthaven zijn
      deze non-discriminatoir.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.53
  - number: 8.54.1
    text: |-
      De exploitant van de luchthaven draagt zorg voor het registreren van de milieubelasting en indien van toepassing
      het externe-veiligheidsrisico vanwege het luchthavenluchtverkeer. Hij verricht de berekeningen die voor die
      registratie noodzakelijk zijn. Het registreren wordt zodanig uitgevoerd dat een vergelijking mogelijk is met de in
      het luchthavenbesluit opgenomen grenswaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.54
  - number: 8.54.2
    text: |-
      Provinciale staten kunnen bij verordening regels stellen omtrent de registratie en omtrent de berekeningen die
      daartoe noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.54
  - number: 8.54.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de registratie van de milieubelasting
      en indien van toepassing het externe-veiligheidsrisico voor zover op grond van [artikel 8.44, vierde lid][ref1],
      nadere regels zijn voorgeschreven. Hierbij worden tevens regels voorgeschreven omtrent de berekeningen die daartoe
      noodzakelijk zijn. De voordracht voor een krachtens de eerste volzin vast te stellen algemene maatregel van bestuur
      wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.54
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.2
        afdeling: 8.3.2
  - number: 8.54.4
    text: 'De exploitant van de luchthaven verstrekt aan gedeputeerde staten:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.54
  - number: 8.54.4.a
    text: de op grond van het eerste tot en met derde lid geregistreerde gegevens;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.54
  - number: 8.54.4.b
    text: gegevens over de in het eerste tot en met derde lid bedoelde berekeningen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.54
  - number: 8.55.1
    text: |-
      Gedeputeerde staten brengen ieder jaar aan provinciale staten verslag uit over de milieuaspecten en indien van
      toepassing de externe-veiligheidsaspecten vanwege het luchthavenluchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.55
  - number: 8.55.2
    text: |-
      De [artikelen 8.29, tweede lid][ref1], en [8.30][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.55
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.5.3
        afdeling: '8.5'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.5.3
        afdeling: '8.5'
  - number: 8.56.1
    text: |-
      Indien een belanghebbende ten gevolge van een luchthavenbesluit schade lijdt of zal lijden, welke redelijkerwijs
      niet of niet geheel te zijnen laste behoort te blijven en waarvan de vergoeding niet of onvoldoende anderszins is
      verzekerd, kennen gedeputeerde staten hem op aanvraag een naar billijkheid te bepalen schadevergoeding toe.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.56
  - number: 8.56.2
    text: |-
      De [artikelen 8.31, tweede en derde lid][ref1], en [8.32][ref2] zijn van overeenkomstige toepassing met dien
      verstande dat bij de toepassing van [artikel 8.31, tweede lid][ref3], gedeputeerde staten in de plaats treden van
      Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.56
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.6'
  - number: '8.57'
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen regels worden gesteld ten aanzien van het
      verstrekken van geldelijke steun uit de provinciale kas aan gemeenten ter bestrijding van de kosten ten gevolge van
      uitvoering van in overeenstemming met het luchthavenbesluit gebrachte bestemmingsplannen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.57
  - number: 8.58.1
    text: |-
      Provinciale staten stellen voor iedere luchthaven een commissie regionaal overleg luchthaven in. De
      [artikelen 107][ref1] en [152 van de Provinciewet][ref2] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel152
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.58
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '107'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '152'
  - number: 8.58.2
    text: 'De commissie bestaat uit een onafhankelijke voorzitter en in ieder geval uit vertegenwoordigers van:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.58
  - number: 8.58.2.a
    text: gemeenten waarin het beperkingengebied geheel of gedeeltelijk is gelegen,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.58
  - number: 8.58.2.b
    text: de exploitant van de luchthaven,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.58
  - number: 8.58.2.c
    text: de verlener van luchtverkeersdienstverlening voor zover op de luchthaven van toepassing, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.58
  - number: 8.58.2.d
    text: omwonenden van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.58
  - number: 8.58.3
    text: |-
      Onverminderd het tweede lid kan de commissie ook bestaan uit vertegenwoordigers van rechtspersoonlijkheidbezittende
      gebruikersorganisaties of milieuorganisaties.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.58
  - number: 8.59.1
    text: |-
      De commissie heeft tot taak om door overleg tussen de in [artikel 8.58, tweede en derde lid][ref1], bedoelde
      betrokkenen een gebruik van de luchthaven te bevorderen dat zoveel mogelijk recht doet aan de belangen van die
      betrokkenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.59
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.7
        afdeling: 8.3.2
  - number: 8.59.2
    text: |-
      Provinciale staten stellen nadere regels vast omtrent de taak, de samenstelling en de werkwijze van de commissie.
      Daarbij wordt in ieder geval bepaald welke in [artikel 8.58, tweede lid, onderdeel a][ref1], bedoelde gemeenten in
      de commissie vertegenwoordigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.59
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.7
        afdeling: 8.3.2
  - number: 8.59.3
    text: De voorzitter van de commissie wordt door provinciale staten benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.59
  - number: 8.59.4
    text: |-
      Elk ander lid wordt benoemd, geschorst en ontslagen door de voorzitter op voordracht van het orgaan of de
      organisatie die het lid vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.59
  - number: '8.62'
    text: |-
      Indien een beperkingengebied als bedoeld in [artikel 8.47][ref1], gedeeltelijk valt binnen de grenzen van een
      andere provincie dan de provincie waarin een luchthaven is gelegen, wordt het luchthavenbesluit vastgesteld in
      overeenstemming met provinciale staten van de andere provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.62
    references:
