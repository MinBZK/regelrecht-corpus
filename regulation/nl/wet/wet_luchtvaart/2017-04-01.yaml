      - id: ref9
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 1.2.1.d
    text: |-
      met betrekking tot het bepaalde bij of krachtens [hoofdstuk 11][ref1] van toepassing op de verleners van
      luchtvaartnavigatiediensten die bij of krachtens deze wet zijn gecertificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '11'
  - number: 1.2.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat, op nader in die algemene maatregel aan te geven
      categorieën van personeel of op bepaalde soorten van luchtvaartuigen, op bepaalde soorten van vervoer of op
      bepaalde vormen van vluchtuitvoering, indien toepassing van deze wet in redelijkheid niet kan worden gevergd en de
      veiligheid van het luchtverkeer niet in gevaar wordt gebracht, geheel of gedeeltelijk niet van toepassing zijn: -
      de [artikelen 2.1 tot en met 2.10][ref1] of één of meer van deze artikelen,
        - [hoofdstuk 3][ref2],
        - [hoofdstuk 4][ref3],
        - [titel 5.1][ref4], met uitzondering van de [artikelen 5.14b tot en met 5.14d][ref5], of [5.2][ref6],
        - [titel 6.5][ref7] of [titel 6.6][ref8],
        - [hoofdstuk 9][ref9], of
        - [hoofdstuk 10][ref10].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk5
      [ref7]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
      [ref8]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
      [ref9]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk9
      [ref10]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.2
    references:
      - id: ref1
