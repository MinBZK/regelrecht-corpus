  - number: 8a.40.3
    text: 'Met betrekking tot de invordering geldt vervolgens dat:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.40
  - number: 8a.40.3.a
    text: de belastingaanslagen terstond en tot het volle bedrag invorderbaar zijn;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.40
  - number: 8a.40.3.b
    text: |-
      wat betreft de toepassing van [artikel 8, eerste lid, van de Invorderingswet 1990][ref1] uitsluitend bevoegd
      is de functionaris of ambtenaar bedoeld in het eerste lid. De in de [artikelen 11][ref2], [12][ref3] en
      [15, eerste lid, onderdeel a, van de Invorderingswet 1990][ref4] bedoelde bevoegdheden komen uitsluitend toe aan de
      functionaris of ambtenaar, bedoeld in het eerste lid. De in [artikel 26 van de Invorderingswet 1990][ref5] bedoelde
      bevoegdheid komt uitsluitend toe aan de door Onze Minister van Infrastructuur en Milieu aan te wijzen ambtenaar,
      met dien verstande dat voor de toepassing van [artikel 26 van die wet][ref6] de door Onze Minister van Financiën
      bij regeling gestelde regels van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0004770#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0004770#Artikel26
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.40
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '15'
      - id: ref5
        bwb_id: BWBR0004770
        artikel: '26'
      - id: ref6
        bwb_id: BWBR0004770
        artikel: '26'
  - number: 8a.40.3.c
    text: |-
      de overige bij de invordering van toepassing zijnde bevoegdheden, met uitzondering van die bedoeld in de
      [artikelen 24, tweede en derde lid][ref1], [25][ref2] en [58 van de Invorderingswet 1990][ref3], uitsluitend
      toekomen aan de ontvanger, bedoeld in het eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel58
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.40
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '58'
  - number: 8a.40.3.d
    text: |-
      de bevoegdheid bedoeld in [artikel 24, tweede en derde lid, van de Invorderingswet 1990][ref1] zowel toekomt aan de
      functionaris of ambtenaar bedoeld in het eerste lid als aan de ontvanger bedoeld in het eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.40
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '24'
  - number: 8a.40.3.e
    text: |-
      de bevoegdheden bedoeld in [artikel 25][ref1] en [artikel 58 van de Invorderingswet 1990][ref2] toekomen, indien
      de functionaris of ambtenaar bedoeld in het eerste lid met de invordering is belast, aan deze functionaris of
      ambtenaar en indien de ontvanger, bedoeld in het eerste lid, met de invordering is belast, aan de ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel58
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.40
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '58'
  - number: 8a.40.4
    text: |-
      In het kader van het verzet tegen de tenuitvoerlegging van het dwangbevel moet in
      [artikel 17 van de Invorderingswet 1990][ref1] voor «de ontvanger die het dwangbevel heeft uitgevaardigd» telkens
      worden gelezen: de met de tenuitvoerlegging van het dwangbevel belaste ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.40
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
  - number: 8a.40.5
    text: |-
      Betaling van de heffingen dient te geschieden aan de functionaris of ambtenaar bedoeld in het eerste lid. Na de
      betekening van het dwangbevel dient te worden betaald aan de ontvanger, bedoeld in het eerste lid, die is vermeld
      op het dwangbevel.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.40
  - number: 8a.41.1
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen inzake de heffingen en de invordering daarvan
      nadere in het kader van de [artikelen 8a.38 tot en met 8a.40][ref1] passende regels worden gesteld ter aanvulling
      van de daarin geregelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.41
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
        paragraaf: 8a.3.1
  - number: 8a.41.2
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden regels gesteld inzake de afdracht van de door
      de functionaris als bedoeld in [artikel 8a.40, eerste lid][ref1], ingevorderde heffing aan Onze Minister van
      Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.41
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
        paragraaf: 8a.3.1
  - number: 8a.42.1
    text: |-
      Met betrekking tot de financiering en de bekostiging van de kosten van de uitvoering van [artikel 8.74][ref1]
      wordt onder de naam «geluidsheffing burgerluchtvaart» een heffing geheven. Tevens wordt een heffing geheven ter
      financiering van de kosten van de uitvoering van [artikel 8.33][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.42
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.4.2.3
        afdeling: 8.4.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.6'
  - number: 8a.42.2
    text: |-
      De [artikelen 8a.38, tweede tot en met vierde en zevende tot en met negende lid][ref1], en
      [8a.39 tot en met 8a.41][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.42
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
        paragraaf: 8a.3.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
        paragraaf: 8a.3.1
  - number: 8a.42.3
    text: |-
      Het tarief van de heffing per rekeneenheid geluidsproduktie bedraagt in het jaar 2004 € 27,– en wordt met ingang
      van elk daaropvolgend kalenderjaar verhoogd met € 1,–.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.42
  - number: 8a.43.1
    text: |-
      Provinciale staten kunnen bij verordening bepalen dat met betrekking tot de financiering en de bekostiging van de
      kosten van de uitvoering van [artikel 8.56, eerste lid][ref1], onder de naam «geluidsheffing burgerluchtvaart» een
      heffing wordt geheven. Tevens kunnen provinciale staten bij verordening bepalen dat een heffing wordt geheven ter
      financiering van de kosten van de uitvoering van [artikel 8.57][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.43
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.6
        afdeling: 8.3.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.6
        afdeling: 8.3.2
  - number: 8a.43.2
    text: |-
      De heffingen worden geheven ter zake van het landen met een burgerluchtvaartuig tot het tijdstip waarop de kosten
      als bedoeld in het eerste lid, zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.43
  - number: 8a.43.3
    text: |-
      Voor de heffing en invordering zijn de [artikelen 220][ref1], [220a][ref2], [221][ref3] en
      [227 tot en met 232h van de Provinciewet][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel220
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel220a
      [ref3]: https://wetten.overheid.nl/BWBR0005645#Artikel221
      [ref4]: https://wetten.overheid.nl/BWBR0005645#Artikel227
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.43
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '220'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: 220a
      - id: ref3
        bwb_id: BWBR0005645
        artikel: '221'
      - id: ref4
        bwb_id: BWBR0005645
        artikel: '227'
  - number: 8a.44.1
    text: |-
      Onze Minister van Infrastructuur en Milieu publiceert vóór 30 juni 2010 en vervolgens elke vijf jaar vóór 30 juni
      in de Staatscourant welke burgerluchthavens zijn aangeduid als belangrijke luchthavens
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.44
  - number: 8a.44.2
    text: |-
      Een belangrijke luchthaven is een burgerluchthaven waarop jaarlijks meer dan 50000 vliegtuigbewegingen
      plaatsvinden. Oefenvluchten met lichte vliegtuigen, als bedoeld in hoofdstuk 5.2 ECAC.CEAC Doc 29 Report on
      standard Method of Computing Noise around civil airports, worden hierbij niet meegerekend.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.44
  - number: 8a.44.3
    text: |-
      Een wijziging van hoofdstuk 5.2 ECAC.CEAC Doc 29 gaat voor de toepassing van het tweede lid gelden met ingang van
      de dag van inwerkingtreding van deze wijziging.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.44
  - number: 8a.45.1
    text: |-
      Onze Minister van Infrastructuur en Milieu stelt vóór 30 juni 2007 een geluidbelastingkaart vast die betrekking
      heeft op een geluidbelasting L en geluidbelasting L veroorzaakt door de luchthaven Schiphol op woningen en bij
      algemene maatregel van bestuur aan te wijzen categorieën van andere geluidgevoelige gebouwen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.45
  - number: 8a.45.2
    text: |-
      Onze Minister van Infrastructuur en Milieu stelt vóór 30 juni 2012 en vervolgens vóór 30 juni van elk vijfde
      kalenderjaar een geluidbelastingkaart vast die betrekking heeft op een geluidbelasting L en geluidbelasting
      L veroorzaakt door belangrijke luchthavens op woningen en bij algemene maatregel van bestuur aan te wijzen
      categorieën van andere geluidgevoelige gebouwen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.45
  - number: 8a.45.3
    text: |-
      Onder geluidbelasting L wordt verstaan: geluidbelasting op een plaats en vanwege een bron als omschreven in bijlage
      I, onderdeel 1, van richtlijn nr. 2002/49/EG van het Europees Parlement en de Raad van de Europese Unie van 25
      juni 2002 inzake de evaluatie en de beheersing van omgevingslawaai (PbEG L 189) over alle perioden van 07.00 tot
      19.00 uur, van 19.00 tot 23.00 uur en van 23.00 tot 07.00 uur van een jaar. Onder geluidbelasting L wordt verstaan:
      geluidbelasting op een plaats en vanwege een bron als omschreven in bijlage I, onderdeel 2, van richtlijn nr.
      2002/49/EG van het Europees Parlement en de Raad van de Europese Unie van 25 juni 2002 inzake de evaluatie en de
      beheersing van omgevingslawaai (PbEG L 189) over alle perioden van 23.00 tot 07.00 uur van een jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.45
  - number: 8a.45.4
    text: 'De geluidbelastingkaart geeft ten minste een weergave van:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.45
  - number: 8a.45.4.a
    text: |-
      de geluidbelasting Len de geluidbelasting L veroorzaakt door een belangrijke luchthaven in de periode van een jaar
      van 1 november van het tweede jaar voorafgaand aan het jaar van vaststelling van de geluidbelastingkaart tot en met
      31 oktober van het jaar voorafgaand aan het jaar van vaststelling van de geluidbelastingkaart, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.45
  - number: 8a.45.4.b
    text: |-
      het aantal woningen en andere geluidgevoelige gebouwen en bewoners van woningen die aan bepaalde waarden van
      geluidbelasting L en geluidbelasting L worden blootgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.45
  - number: 8a.45.5
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden nadere regels gesteld omtrent de inhoud,
      vormgeving en inrichting van de geluidbelastingkaart. Ten behoeve van de bepaling van de geluidsbelasting L en de
      geluidsbelasting L vanwege een luchthaven kunnen bij regeling van Onze Minister van Infrastructuur en Milieu nadere
      regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.45
  - number: 8a.46.1
    text: |-
      De exploitant van een luchthaven verschaft ten behoeve van de vaststelling van de geluidbelastingkaart, bedoeld in
      [artikel 8a.45, eerste of tweede lid][ref1], aan Onze Minister van Infrastructuur en Milieu op zijn verzoek alle
      noodzakelijke inlichtingen en gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.46
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.46.2
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen nadere regels worden gesteld omtrent de te
      verschaffen inlichtingen en gegevens, waaronder de wijze waarop en de termijn waarbinnen deze moeten worden
      verschaft.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.46
  - number: 8a.47.1
    text: |-
      Onze Minister van Infrastructuur en Milieu geeft binnen één maand na vaststelling van de geluidbelastingkaart,
      bedoeld in [artikel 8a.45, eerste of tweede lid][ref1], mededeling van deze vaststelling in één of meer dag-,
      nieuws- of huis-aan-huisbladen dan wel op andere geschikte wijze. Hierbij geeft hij aan op welke wijze kennis kan
      worden gekregen van de inhoud van de geluidbelastingkaart.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.47
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.47.2
    text: 'Onze Minister van Infrastructuur en Milieu:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.47
  - number: 8a.47.2.a
    text: stelt de geluidbelastingkaart elektronisch ter beschikking van een ieder;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.47
  - number: 8a.47.2.b
    text: voegt bij de geluidbelastingkaart een overzicht van de belangrijkste punten van die kaart.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.47
  - number: 8a.48.1
    text: |-
      Onze Minister van Infrastructuur en Milieu stelt vóór 18 mei 2008 aan de hand van de geluidbelastingkaart,
      bedoeld in [artikel 8a.45][ref1], een actieplan vast met betrekking tot de luchthaven. Indien er sprake is van een
      belangrijke ontwikkeling die van invloed is op de geluidhindersituatie, en daarnaast ten minste elke vijf jaar na
      de vaststelling wordt het actieplan opnieuw overwogen, en zo nodig aangepast.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.48
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.48.2
    text: 'Het actieplan bevat ten minste een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.48
  - number: 8a.48.2.a
    text: het te voeren beleid om geluidbelasting L en geluidbelasting L te beperken, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.48
  - number: 8a.48.2.b
    text: |-
      de voorgenomen in de eerstvolgende vijf jaar te treffen maatregelen om overschrijding van in het
      luchthavenverkeerbesluit of luchthavenbesluit vastgestelde waarden van geluidbelasting L of geluidbelasting L te
      voorkomen of ongedaan te maken en de te verwachten effecten van die maatregelen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.48
  - number: 8a.48.3
    text: |-
      Op de voorbereiding van een actieplan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.
      Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 8a.48.4
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden nadere regels gesteld omtrent de inhoud,
      vormgeving en inrichting van het actieplan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.48
  - number: 8a.48.5
    text: |-
      [Artikel 8a.47][ref1] is van overeenkomstige toepassing op de vaststelling van actieplannen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.48
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.49
    text: |-
      Indien de belangrijke luchthaven een luchthaven van regionale betekenis is, treden bij de toepassing van de
      [artikelen 8a.45 tot en met 8a.48][ref1] gedeputeerde staten van de provincie die het luchthavenbesluit heeft
      vastgesteld, in de plaats van Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.49
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
  - number: 8a.50.1
    text: |-
      De verbodsbepaling bedoeld in [artikel 8.1a, eerste lid][ref1], is niet van toepassing op bij algemene maatregel
      van bestuur te bepalen luchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.50
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
  - number: 8a.50.2
    text: |-
      Van de in [artikel 8.1a, tweede tot en met vierde lid][ref1], genoemde verboden kan vrijstelling worden verleend
      door Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.50
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
  - number: 8a.50.4
    text: Aan de vrijstelling, bedoeld in het tweede lid, kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.50
  - number: 8a.50a
    text: |-
      Indien ten aanzien van de burgerluchthaven Twente een vrijstelling, als bedoeld in
      [artikel 8a.50, tweede lid][ref1], van het verbod in [artikel 8.1a, derde lid][ref2], wordt verleend, is op de
      voorbereiding van die vrijstelling [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.50a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 8a.50b.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan op aanvraag van een exploitant van een luchthaven ontheffing
      verlenen van een regel die met het oog op de geluidbelasting is opgenomen in een luchthavenbesluit of
      luchthavenregeling voor een luchthaven van nationale betekenis.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.50b
  - number: 8a.50b.2
    text: |-
      Gedeputeerde staten kunnen op aanvraag van een exploitant van een luchthaven ontheffing verlenen van een regel die
      met het oog op de geluidbelasting is opgenomen in een luchthavenbesluit of luchthavenregeling voor een luchthaven
      van regionale betekenis.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.50b
  - number: 8a.50b.3
    text: |-
      Een ontheffing kan slechts worden verleend voor een bepaalde in de ontheffing vast te stellen termijn van ten
      hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.50b
  - number: 8a.50b.4
    text: Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.50b
  - number: 8a.50b.5
    text: |-
      Gedeputeerde staten doen zo spoedig mogelijk na de verlening van een ontheffing hiervan mededeling aan Onze
      Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.50b
  - number: 8a.50b.6
    text: De exploitant maakt de beslissing omtrent een ontheffing bekend aan de gebruikers van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.50b
  - number: 8a.51.1
    text: |-
      Gedeputeerde staten kunnen voor tijdelijk en uitzonderlijk gebruik van een terrein ontheffing verlenen van het
      verbod, bedoeld in [artikel 8.1a, eerste lid][ref1], indien het terrein wordt gebruikt door een luchtvaartuig dat
      behoort tot een bij algemene maatregel van bestuur aan te wijzen categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.51
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
  - number: 8a.51.2
    text: Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.51
  - number: 8a.51.3
    text: 'Bij regeling van Onze Minister van Infrastructuur en Milieu worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.51
  - number: 8a.51.3.a
    text: het terrein;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.51
  - number: 8a.51.3.b
    text: de wijze waarop het terrein wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.51
  - number: 8a.51.3.c
    text: de termijn waarbinnen gedeputeerde staten een besluit nemen op de aanvraag;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.51
  - number: 8a.51.3.d
    text: |-
      de wijze waarop Onze Minister van Infrastructuur en Milieu en de burgemeester van de gemeente waarin het terrein
      ligt, worden betrokken bij het verlenen van de ontheffing en bij het gebruik van het terrein.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.51
  - number: 8a.52
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende het gebruik van
      luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.52
  - number: 8a.53
    text: |-
      Wanneer de aanleg, de instandhouding of het gebruik van een werk ten behoeve van de uitvoering van de militaire
      taak op een burgerluchthaven in strijd zou komen met een bepaling van of krachtens deze wet, kunnen Wij, op
      voordracht van Onze Minister van Defensie, daarvan ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.53
  - number: 8a.54.1
    text: |-
      Bij algemene maatregel van bestuur wordt een besluit beperkingengebied buitenlandse luchthaven vastgesteld in
      verband met de nabijheid van de navolgende buitenlandse luchthavens in de Bondsrepubliek Duitsland:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.54
  - number: 8a.54.1.a
    text: de burgerluchthaven Weeze, gelegen in de gemeente Weeze;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.54
  - number: 8a.54.1.b
    text: de militaire luchthaven Brüggen, gelegen in de gemeente Brüggen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.54
  - number: 8a.54.1.c
    text: de militaire luchthaven Geilenkirchen, gelegen bij de stad Geilenkirchen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.54
  - number: 8a.54.2
    text: |-
      Bij algemene maatregel van bestuur kan een besluit beperkingengebied buitenlandse luchthaven worden vastgesteld in
      verband met de nabijheid van een andere buitenlandse luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.54
  - number: 8a.54.3
    text: |-
      De voordracht voor een besluit beperkingengebied buitenlandse luchthaven wordt niet eerder gedaan dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.54
  - number: 8a.55.1
    text: |-
      Bij een besluit beperkingengebied buitenlandse luchthaven wordt het beperkingengebied vastgesteld, dat het
      Nederlands grondgebied omvat waar met het oog op het externe-veiligheidsrisico, de geluidsbelasting of de
      vliegveiligheid, vanwege de nabijheid van de desbetreffende buitenlandse luchthaven, beperkingen noodzakelijk zijn
      ten aanzien van de bestemming of het gebruik van de grond.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.55
  - number: 8a.55.2
    text: |-
      De ruimtelijke indeling en de begrenzing van het beperkingengebied voor een buitenlandse luchthaven worden bepaald
      aan de hand van:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.55
  - number: 8a.55.2.a
    text: het gebruik van de luchthaven door het luchthavenluchtverkeer,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.55
  - number: 8a.55.2.b
    text: de ligging van start- en landingsbanen, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.55
  - number: 8a.55.2.c
    text: de positie van navigatie- en communicatieapparatuur.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.55
  - number: 8a.56
    text: |-
      Een beperkingengebied wordt vastgesteld met behulp van een of meer kaarten waarop de ligging van het gebied is
      aangegeven. De kaarten worden vervaardigd op een schaal van ten minste 1 op 50 000. Zo nodig worden delen van de
      gebieden vastgelegd met behulp van kaarten op een schaal met een kleiner verhoudingsgetal.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.56
  - number: 8a.57.1
    text: |-
      Het besluit beperkingengebied buitenlandse luchthaven bevat in elk geval regels omtrent de bestemming en het
      gebruik van de grond waaronder begrepen de maximale hoogte van objecten in, op of boven de grond, in verband met:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.57
  - number: 8a.57.1.a
    text: de geluidbelasting vanwege het luchthavenluchtverkeer, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.57
  - number: 8a.57.1.b
    text: de vliegveiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.57
  - number: 8a.57.2
    text: |-
      Indien het besluit beperkingengebied buitenlandse luchthaven wordt vastgesteld in verband met de nabijheid van een
      buitenlandse burgerluchthaven, bevat dit besluit voorts regels omtrent de bestemming en het gebruik van de grond in
      verband met het externe-veiligheidsrisico vanwege het luchthavenluchtverkeer. Indien het besluit beperkingengebied
      buitenlandse luchthaven wordt vastgesteld in verband met de nabijheid van een buitenlandse militaire luchthaven,
      kan het besluit dergelijke regels bevatten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.57
  - number: 8a.57.3
    text: |-
      Bij de regels, bedoeld in het eerste lid, onderdeel a, en het tweede lid, worden in ieder geval gronden aangewezen
      die niet bestemd zijn of gebruikt worden voor woningen of andere in het besluit aangewezen gebouwen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.57
  - number: 8a.58.1
    text: |-
      Met betrekking tot het besluit beperkingengebied buitenlandse luchthaven zijn de [artikelen 8.8][ref1],
      [8.10][ref2] en [8.11][ref3] van overeenkomstige toepassing, met dien verstande dat in plaats van
      «luchthavenindelingbesluit» telkens wordt gelezen: besluit beperkingengebied buitenlandse luchthaven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.58
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
  - number: 8a.58.2
    text: |-
      Voorts zijn [artikel 8.9, eerste tot en met derde en vijfde lid][ref1], en [artikel 8.12][ref2] van overeenkomstige
      toepassing, met dien verstande dat omtrent de verklaring van geen bezwaar en de ontheffing wordt besloten door Onze
      Minister van Infrastructuur en Milieu en dat in plaats van «het luchthavenindelingbesluit» telkens wordt gelezen:
      het besluit beperkingengebied buitenlandse luchthaven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.58
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
  - number: 8a.58.3
    text: |-
      Onze Minister van Infrastructuur en Milieu beslist omtrent de verklaring van geen bezwaar of de ontheffing, bedoeld
      in het tweede lid, indien het een militaire luchthaven betreft, in overeenstemming met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.58
  - number: 8a.58.4
    text: De beslistermijn bedraagt acht weken na ontvangst van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.58
  - number: 8a.59.1
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden regels gesteld omtrent de wijze van meten,
      berekenen en registreren van de geluidbelasting, en kunnen regels worden gesteld omtrent de wijze van meten,
      berekenen en registreren van het externe-veiligheidsrisico.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.59
  - number: 8a.59.2
    text: |-
      Een regeling als bedoeld in het eerste lid wordt ten aanzien van militaire luchthavens vastgesteld in
      overeenstemming met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.59
  - number: 8a.60
    text: |-
      Op de voorbereiding van een besluit beperkingengebied buitenlandse luchthaven of op de voorbereiding van een
      wijziging of intrekking van een zodanig besluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van
      toepassing. Zienswijzen kunnen naar voren worden gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 8a.61
    text: |-
      De [artikelen 8.31 tot en met 8.33][ref1] zijn van overeenkomstige toepassing, met dien verstande dat in plaats van
      «het luchthavenindelingbesluit of het luchthavenverkeerbesluit» onderscheidenlijk «het luchthavenindelingbesluit»
      wordt gelezen: het besluit beperkingengebied buitenlandse luchthaven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.61
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.6'
  - number: 8a.62.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan voor iedere buitenlandse luchthaven, aangewezen bij of krachtens
      [artikel 8a.54][ref1], een commissie regionaal overleg luchthaven instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.62
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
        paragraaf: 8a.6.1
  - number: 8a.62.2
    text: 'Indien een commissie wordt ingesteld, stelt Onze Minister van Infrastructuur en Milieu regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.62
  - number: 8a.62.2.a
    text: de taak, samenstelling en werkwijze van de commissie,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.62
  - number: 8a.62.2.b
    text: de instelling van een secretariaat ter ondersteuning van de commissie, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.62
  - number: 8a.62.2.c
    text: |-
      de mate waarin en de voorwaarden waaronder Onze Minister van Infrastructuur en Milieu jaarlijks bijdraagt in de
      kosten van de commissie.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.62
  - number: 8a.62.3
    text: |-
      [Artikel 8.37][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8a.62
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.7'
  - number: 9.1.1
    text: |-
      In bijzondere omstandigheden in geval van ernstige verstoring van de binnenlandse openbare orde of veiligheid is
      Onze Minister van Infrastructuur en Milieu bevoegd in overeenstemming met Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties en Onze Minister van Defensie aan de LVNL aanwijzingen te geven met betrekking tot het
      verzorgen van de luchtverkeersbeveiliging.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.1
  - number: 9.1.2
    text: |-
      In bijzondere omstandigheden in verband met de handhaving van de internationale rechtsorde of met de internationale
      betrekkingen is Onze Minister van Infrastructuur en Milieu bevoegd in overeenstemming met Onze Minister van
      Buitenlandse Zaken en Onze Minister van Defensie aan de LVNL aanwijzingen te geven met betrekking tot het verzorgen
      van de luchtverkeersbeveiliging.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.1
  - number: 9.1.3
    text: |-
      Indien de LVNL door het uitvoeren van de aanwijzingen financieel nadeel ondervindt, ontvangt hij een naar
      billijkheid te bepalen vergoeding.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.1
  - number: 9.2.1
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone
      omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, de
      [artikelen 9.3][ref3], [9.4][ref4] en [9.5][ref5] gezamenlijk of afzonderlijk in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel9
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.2
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede Kamer
      gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.2
  - number: 9.2.3
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.2
  - number: 9.2.4
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.2
  - number: 9.2.5
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.2
  - number: 9.2.6
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.2
  - number: '9.5'
    text: |-
      Het bij of krachtens de [titels 5.1][ref1] en [5.2][ref2] van deze wet bepaalde geldt niet ten aanzien van de
      luchtvaartuigen, in gebruik ten behoeve van de defensie, en de leden hunner bemanning.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005555
        hoofdstuk: '5'
  - number: 9.6.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan aan de LVNL een naar billijkheid te bepalen vergoeding toekennen
      ter zake van buitengewone kosten door de LVNL gemaakt vanwege de naleving van de aanwijzing gegeven krachtens
      [artikel 9.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel9
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.6.2
    text: |-
      Onze Minister van Defensie kan aan de LVNL een naar billijkheid te bepalen vergoeding toekennen ter zake
      van buitengewone kosten door de LVNL gemaakt vanwege de naleving van de aanwijzing gegeven krachtens
      [artikel 9.4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel9
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.7.1
    text: |-
      In afwijking van [artikel 1.4][ref1] richt Onze Minister van Defensie, voordat hij de hem krachtens
      [artikel 9.4][ref2] toekomende bevoegdheid uitoefent, een verzoek aan Onze Minister van Infrastructuur en Milieu
      om aan de behoefte gesteld door Onze Minister van Defensie te voldoen. Onze Minister van Defensie oefent de
      bevoegdheid krachtens [artikel 9.4][ref3] niet uit dan nadat Onze Minister van Infrastructuur en Milieu te kennen
      heeft gegeven niet te zullen voldoen aan dit verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel9
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.7.2
    text: |-
      In dringende omstandigheden kan Onze Minister van Defensie afwijken van het eerste lid. Hij stelt Onze Minister
      van Infrastructuur en Milieu daarvan terstond in kennis. Zodra de omstandigheden dat naar het oordeel van Onze
      Minister van Defensie en van Onze Minister van Infrastructuur en Milieu toelaten, wordt aan de door Onze Minister
      van Defensie gestelde behoefte voldaan door Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.7
  - number: 9.7.3
    text: |-
      Indien de in [artikel 9.3][ref1] toegekende bevoegdheid door Onze Minister van Infrastructuur en Milieu wordt
      uitgeoefend op verzoek van Onze Minister van Defensie als bedoeld in het eerste lid, vindt toekenning van een
      vergoeding krachtens [artikel 9.6, eerste lid][ref2], plaats in overeenstemming met Onze Minister van Defensie.
      Deze vergoeding komt voor rekening van Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel9
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
  - number: '9.8'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan in omstandigheden waarin maatregelen worden genomen als bedoeld
      in artikel 13 van de kaderverordening een of meer luchtverkeerdienstverleners ontheffing verlenen van het in
      [artikel 5.14d][ref1] bedoelde verbod, indien deze omstandigheden hiertoe noodzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 10.1.1
    text: |-
      Behoudens titel 2.2 is [hoofdstuk 2][ref1] niet van toepassing op het bedienen van militaire luchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '2'
  - number: 10.1.2
    text: |-
      Militaire luchtvaartuigen worden bediend door cockpitpersoneel, dat voldoet aan bij of krachtens algemene
      maatregel van bestuur gestelde eisen inzake theoretische en praktische bekwaamheid en geestelijke en lichamelijke
      geschiktheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.1
  - number: 10.1.3
    text: |-
      Onze Minister van Defensie kan in bijzondere gevallen ontheffing verlenen van de bij of krachtens het tweede lid
      gegeven regels, wanneer door bijzondere omstandigheden die regels in redelijkheid geen toepassing kunnen vinden
      en de veiligheid van het luchtverkeer met het verlenen van de ontheffing niet in gevaar wordt gebracht. Aan de
      ontheffing kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.1
  - number: 10.1.4
    text: Onze Minister van Defensie trekt de door hem verleende ontheffing in, wanneer
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.1
  - number: 10.1.4.a
    text: de redenen, waarom de ontheffing is verleend, zijn komen te vervallen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.1
  - number: 10.1.4.b
    text: de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.1
  - number: 10.2.1
    text: |-
      [Hoofdstuk 2, titel 2.1][ref1], en [artikel 5.16][ref2] zijn niet van toepassing op
      luchtverkeersdienstverleningspersoneel van de krijgsmacht. Dit personeel voldoet aan bij of krachtens algemene
      maatregel van bestuur gestelde eisen inzake theoretische en praktische bekwaamheid en geestelijke en lichamelijke
      geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 10.2.2
    text: |-
      [Artikel 10.1, derde en vierde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: '10.3'
    text: |-
      Onze Minister van Defensie kan voor militaire luchtvaartuigen toestaan, dat van het nationaliteitskenmerk en het
      inschrijvingskenmerk bedoeld in [artikel 3.2, eerste lid, onderdeel a][ref1], wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: '10.5'
    text: |-
      [Hoofdstuk 4][ref1] is niet van toepassing op de vluchtuitvoering met militaire luchtvaartuigen alsmede op de
      vluchtuitvoering ten behoeve van militaire doeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '4'
  - number: 10.6.1
    text: |-
      [Titel 6.5][ref1] is niet van toepassing op internationaal vervoer van gevaarlijke stoffen met luchtvaartuigen
      waarvan de krijgsmacht of de krijgsmacht van een andere mogendheid houder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '6'
  - number: 10.6.2
    text: |-
      [Titel 6.5][ref1] is, met uitzondering van [artikel 6.54][ref2], niet van toepassing op nationaal vervoer van
      ontplofbare stoffen of voorwerpen met luchtvaartuigen waarvan de krijgsmacht of de krijgsmacht van een andere
      mogendheid houder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.6.3
    text: |-
      [Artikel 6.51, eerste lid][ref1], geldt niet voor het nationale vervoer van de bij of krachtens algemene maatregel
      van bestuur aan te wijzen gevaarlijke stoffen, niet zijnde ontplofbare stoffen of voorwerpen, behorend tot de
      operationele uitrusting of het wapensysteem van een luchtvaartuig waarvan de krijgsmacht of de krijgsmacht van een
      andere mogendheid houder is, of behorend tot de uitrusting van personen die met een dergelijk luchtvaartuig worden
      vervoerd, indien aan de bij of krachtens die algemene maatregel van bestuur terzake gestelde regels is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.6.4
    text: |-
      [Artikel 6.55][ref1] is niet van toepassing op het door personeel van de krijgsmacht verrichten van de in dat
      artikel bedoelde handelingen ten aanzien van het nationaal vervoer van andere gevaarlijke stoffen dan ontplofbare
      stoffen of voorwerpen, met luchtvaartuigen waarvan de krijgsmacht of de krijgsmacht van een andere mogendheid
      houder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.6.5
    text: |-
      De[ artikelen 6.60][ref1], [6.61][ref2] en [6.61a][ref3] zijn van overeenkomstige toepassing op het internationaal
      vervoer van gevaarlijke stoffen en het nationaal vervoer van ontplofbare stoffen en voorwerpen met luchtvaartuigen
      waarvan de krijgsmacht of de krijgsmacht van een andere mogendheid houder is met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.6.5.a
    text: |-
      in [artikel 6.60, eerste lid][ref1], in plaats van «als bedoeld in [artikel 6.51, eerste lid][ref2],» wordt gelezen
      «als bedoeld in [artikel 10.7, eerste en tweede lid][ref3]»;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.6.5.b
    text: |-
      in [artikel 6.61, eerste lid][ref1], in plaats van «[artikel 6.51][ref2]» wordt gelezen
      [artikel 10.7, eerste en tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.7.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur, gedaan op voordracht van Onze Minister van Defensie, worden regels
      gegeven inzake het internationaal vervoer van gevaarlijke stoffen met een luchtvaartuig waarvan de krijgsmacht
      of de krijgsmacht van een andere mogendheid houder is, het daartoe aanbieden of aannemen, alsmede het laden
      in of lossen uit een dergelijk luchtvaartuig of het tijdens het vervoer neerleggen van bedoelde stoffen. De
      [artikelen 6.51, derde lid][ref1], en [6.52][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.7.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur, gedaan op voordracht van Onze Minister van Defensie , worden
      regels gegeven inzake het nationaal vervoer van ontplofbare stoffen of voorwerpen met een luchtvaartuig waarvan de
      krijgsmacht of de krijgsmacht van een andere mogendheid houder is, het daartoe aanbieden of aannemen alsmede het
      laden in of lossen uit een dergelijk luchtvaartuig of het tijdens het vervoer neerleggen van bedoelde stoffen of
      voorwerpen. De [artikelen 6.51, derde lid][ref1], en [6.52][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.7.3
    text: 'De bedoelde regels kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.7.3.a
    text: |-
      het aanwijzen van gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, die niet door de lucht mogen
      worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.7.3.b
    text: |-
      de eisen ten aanzien van constructie, inrichting en uitrusting van luchtvaartuigen waarmee gevaarlijke stoffen als
      bedoeld in het eerste dan wel tweede lid worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.7.3.c
    text: de belading van luchtvaartuigen met inbegrip van samenlading;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.7.3.d
    text: de eisen waaraan gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.7.3.e
    text: de eisen waaraan de verpakking moet voldoen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.7.3.f
    text: de etiketten of aanduidingen op de verpakking;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.7.3.g
    text: de eisen, waaraan bij het laden en lossen voldaan moet worden;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.7.3.h
    text: |-
      de eisen ten aanzien van constructie, inrichting en uitrusting van inrichtingen, voertuigen of werktuigen met
      behulp waarvan gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, worden geladen of gelost;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.7.3.i
    text: |-
      de melding voorafgaande aan een handeling inzake het vervoer van gevaarlijke stoffen als bedoeld in het eerste dan
      wel tweede lid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.7.3.j
    text: de begeleiding van het vervoer en de eisen die aan de begeleider worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.7.3.k
    text: |-
      het uitzonderen van gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, behorend tot de operationele
      uitrusting of het wapensysteem van het luchtvaartuig, of behorend tot de uitrusting van personen die met het
      luchtvaartuig worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.7
  - number: 10.8.1
    text: |-
      Onze Minister van Defensie kan ontheffing verlenen van de krachtens [artikel 10.7][ref1] gegeven regels, wanneer
      de taakuitvoering met militaire luchtvaartuigen meebrengt, dat die regels in redelijkheid geen toepassing kunnen
      vinden en de veiligheid van het luchtverkeer met het verlenen van de ontheffing niet in gevaar komt. Aan de
      ontheffing kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.8.2
    text: |-
      Het[ tweede tot en met het vijfde lid van artikel 6.58][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: '10.9'
    text: |-
      [Titel 6.6][ref1] is niet van toepassing op vervoer van dieren met luchtvaartuigen waarvan de krijgsmacht of de
      krijgsmacht van een andere mogendheid houder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '6'
  - number: '10.10'
    text: |-
      [Artikel 7.1, eerste lid][ref1], is niet van toepassing op voorvallen die uitsluitend de militaire luchtvaart
      betreffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel7
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.10
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '7'
        hoofdstuk: '7'
  - number: 10.11.1
    text: |-
      Tenzij uitdrukkelijk anders is bepaald zijn de [hoofdstukken 8][ref1] en [8a][ref2] niet van toepassing op
      militaire luchthavens, met uitzondering van:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005555
        hoofdstuk: 8a
  - number: 10.11.1.a
    text: |-
      [artikel 8.1a, eerste, vijfde en zesde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
  - number: 10.11.1.b
    text: |-
      [titel 8a.1][ref1] voor zover het betreft burgermedegebruik door tussenkomst van een burgerexploitant, met dien
      verstande dat de regels, bedoeld in [artikel 8a.1, eerste lid][ref2], voor zover het militaire luchthavens betreft
      worden gesteld bij regeling van Onze Minister van Infrastructuur en Milieu in overeenstemming met Onze Minister van
      Defensie, en


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8a
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
  - number: 10.11.1.c
    text: |-
      [artikel 8a.42][ref1] voor zover het betreft het gebruik van militaire luchthavens door burgerluchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a
        hoofdstuk: 8a
        paragraaf: 8a.3.2
  - number: 10.11.2
    text: |-
      Voor de toepassing ingevolge het eerste lid van [titel 8a.1][ref1] op militaire luchthavens wordt als exploitant
      aangemerkt de burgerexploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: 8a
  - number: 10.12.1
    text: |-
      Deze titel is van toepassing ten aanzien van de bij of krachtens algemene maatregel van bestuur aangewezen
      militaire luchthavens. Bij die maatregel worden de luchthavens aangewezen waarvoor vaststelling van een
      luchthavenbesluit is vereist.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.12
  - number: 10.12.2
    text: |-
      Bij algemene maatregel van bestuur worden voor bij die maatregel aangewezen luchthavens uniforme grenswaarden
      vastgesteld voor de maximaal toegelaten geluidbelasting door landende en opstijgende luchtvaartuigen. Bij
      die maatregel kunnen tevens uniforme grenswaarden worden vastgesteld voor het externe-veiligheidsrisico en
      voor lokale luchtverontreiniging en kunnen regels worden gesteld met betrekking tot geluidbelasting, het
      externe-veiligheidsrisico, lokale luchtverontreiniging en de maximale hoogte van objecten als bedoeld in
      [artikel 10.17, derde lid][ref1]. Bij de vaststelling kan onderscheid worden gemaakt naar soorten luchtvaartuigen,
      aan- en uitvliegroutes, bestemming van gronden en perioden van het etmaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.12
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.2.2
        afdeling: 10.3.2
  - number: 10.12.3
    text: |-
      Bij regeling van Onze Minister van Defensie in overeenstemming met Onze Minister van Infrastructuur en Milieu
      worden regels vastgesteld omtrent de wijze van meten, berekenen en registreren van de in het tweede lid bedoelde
      geluidbelasting en kunnen dergelijke regels worden vastgesteld met betrekking tot het externe-veiligheidsrisico
      en luchtverontreiniging.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.12
  - number: 10.13.1
    text: |-
      Het is verboden met een burgerluchtvaartuig op te stijgen van of te landen op een militaire luchthaven, zonder
      of in afwijking van een voor dat opstijgen of landen door Onze Minister van Defensie verleende vergunning voor
      burgermedegebruik als bedoeld in [artikel 10.27][ref1], vrijstelling of ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.3.2
        afdeling: 10.3.3
  - number: 10.13.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het gebruik van militaire
      luchthavens door de burgerluchtvaart. Deze regels betreffen in ieder geval de gevallen waarin militair luchtverkeer
      voorrang heeft op burgerluchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.13
  - number: 10.13.3
    text: Aan de in het eerste lid bedoelde vrijstelling en ontheffing kunnen beperkingen en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.13
  - number: 10.13.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het verlenen, wijzigen en
      intrekken van de vrijstelling of ontheffing, alsmede omtrent de aan de behandeling van de aanvraag verbonden
      kosten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.13
  - number: 10.13.5
    text: |-
      Een vrijstelling of ontheffing wordt niet verleend voor burgerluchtvaart van commerciële aard op een luchthaven
      waar burgermedegebruik plaatsvindt door tussenkomst van een burgerexploitant.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.13
  - number: 10.13.6
    text: |-
      Een vrijstelling of ontheffing kan in ieder geval door Onze Minister van Defensie worden ingetrokken of gewijzigd
      wanneer:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.13
  - number: 10.13.6.a
    text: een of meer redenen waarom de vrijstelling of ontheffing is verleend, zijn vervallen,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.13
  - number: 10.13.6.b
    text: een of meer van de daaraan verbonden beperkingen of voorschriften niet worden nageleefd, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.13
  - number: 10.13.6.c
    text: |-
      na de verlening zodanige feiten of omstandigheden bekend zijn geworden dat, indien deze ten tijde van de verlening
      bekend waren geweest, de vrijstelling of ontheffing niet of niet in die vorm zou zijn verleend.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.13
  - number: '10.14'
    text: |-
      Deze afdeling is van toepassing op militaire luchthavens waarvoor op grond van [artikel 10.12][ref1] vaststelling
      van een luchthavenbesluit is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.14
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        afdeling: 10.3.1
  - number: 10.15.1
    text: Bij algemene maatregel van bestuur wordt voor een luchthaven een luchthavenbesluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.15
  - number: 10.15.2
    text: In het luchthavenbesluit worden het luchthavengebied en het beperkingengebied vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.15
  - number: 10.15.3
    text: |-
      Het luchthavengebied en het beperkingengebied overlappen elkaar niet. De gebieden kunnen bestaan uit niet
      aaneengesloten delen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.15
  - number: 10.15.4
    text: |-
      [Artikel 8.5, vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.15
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
  - number: 10.16.1
    text: Als luchthavengebied wordt het gebied vastgesteld dat bestemd is voor gebruik als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.16
  - number: 10.16.2
    text: |-
      Het luchthavenbesluit bevat voor het luchthavengebied regels omtrent de bestemming en het gebruik van de grond voor
      zover die regels noodzakelijk zijn met het oog op het gebruik van het gebied als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.16
  - number: 10.17.1
    text: |-
      Als beperkingengebied wordt het gebied vastgesteld waar met het oog op de geluidsbelasting en de veiligheid in
      verband met de nabijheid van de luchthaven beperkingen noodzakelijk zijn ten aanzien van de bestemming of het
      gebruik van de grond. Het beperkingengebied omvat de gebieden die behoren bij de in het tweede lid bedoelde
      grenswaarden voor geluidbelasting en het externe-veiligheidsrisico, alsmede bij de in het derde lid, onderdeel b,
      bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: 10.17.2
    text: 'Het luchthavenbesluit bevat een grenswaarde voor geluidsbelasting. Het besluit kan tevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: 10.17.2.a
    text: een grenswaarde voor het externe-veiligheidsrisico;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: 10.17.2.b
    text: een of meer grenswaarden die noodzakelijk zijn met het oog op de lokale luchtverontreiniging.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: 10.17.3
    text: |-
      Het luchthavenbesluit bevat voor het beperkingengebied in ieder geval regels waarbij beperkingen zijn gesteld ten
      aanzien van de bestemming en het gebruik van de grond voor zover die beperkingen noodzakelijk zijn met het oog op:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: 10.17.3.a
    text: de geluidsbelasting in verband met de nabijheid van de luchthaven;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: 10.17.3.b
    text: |-
      de maximale hoogte van objecten in, op of boven de grond, in verband met de veiligheid van het
      luchthavenluchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: 10.17.4
    text: 'Het luchthavenbesluit kan tevens voor het luchthavenluchtverkeer bevatten:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: 10.17.4.a
    text: regels met het oog op de geluidsbelasting;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: 10.17.4.b
    text: regels die noodzakelijk zijn met het oog op de lokale luchtverontreiniging.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: 10.17.5
    text: |-
      Bij de regels met het oog op de geluidsbelasting en het externe-veiligheidsrisico, bedoeld in het derde lid,
      worden in ieder geval gronden aangewezen die niet bestemd of gebruikt worden voor woningen of andere in het besluit
      aangewezen gebouwen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: 10.17.6
    text: |-
      De [artikelen 8.8 tot en met 8.12][ref1] zijn van overeenkomstige toepassing met dien verstande dat Onze Minister
      van Defensie in de plaats treedt van Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
  - number: 10.17.7
    text: |-
      Bij de vaststelling van het luchthavenbesluit kan in ieder geval gebruik worden gemaakt van gegevens en onderzoeken
      die niet ouder zijn dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.17
  - number: '10.18'
    text: 'De voordracht voor een luchthavenbesluit of de wijziging daarvan wordt gedaan:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.18
  - number: 10.18.a
    text: |-
      na overleg met gedeputeerde staten en de colleges van burgemeester en wethouders van respectievelijk de provincies
      en de gemeenten binnen de grenzen waarvan het gebied of een gedeelte van het gebied ligt dat door het ontwerp wordt
      bestreken, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.18
  - number: 10.18.b
    text: |-
      nadat het ontwerp vervolgens in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om
      binnen zes weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister
      van Defensie te brengen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.18
  - number: '10.19'
    text: |-
      De bij algemene maatregel van bestuur aangewezen gegevens met betrekking tot de geluidsbelasting, het externe-
      veiligheidsrisico en de lokale luchtverontreiniging zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.19
  - number: '10.20'
    text: |-
      Onze Minister van Defensie draagt er zorg voor dat het luchthavenluchtverkeer zodanig geschiedt dat de belasting
      vanwege het luchthavenluchtverkeer de grenswaarden, opgenomen in het luchthavenbesluit, niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.20
  - number: 10.21.1
    text: |-
      Zodra Onze Minister van Defensie constateert dat de in [artikel 10.17][ref1] bedoelde grenswaarden zijn
      overschreden, schrijft hij maatregelen voor die naar zijn oordeel bijdragen aan het terugdringen van de belasting
      vanwege het luchthavenluchtverkeer binnen de grenswaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.21
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.2.2
        afdeling: 10.3.2
  - number: 10.21.2
    text: |-
      Onze Minister van Defensie trekt de maatregelen in of matigt deze voor zover zij naar zijn oordeel niet langer
      nodig zijn voor het terugdringen van de belasting vanwege het luchthavenluchtverkeer binnen de grenswaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.21
  - number: 10.21.3
    text: |-
      [Artikel 10.20][ref1] is van overeenkomstige toepassing ten aanzien van de voorgeschreven maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.21
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.2.3
        afdeling: 10.3.2
  - number: 10.22.1
    text: |-
      Onze Minister van Defensie kan voor een luchthaven indien ten gevolge van groot onderhoud van een baan of door een
      bijzonder voorval het normale gebruik van de luchthaven naar zijn oordeel ernstig wordt belemmerd, of in verband
      met bijzondere redenen van nationale of bondgenootschappelijke aard:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.22
  - number: 10.22.1.a
    text: vrijstelling verlenen van een regel in het luchthavenbesluit;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.22
  - number: 10.22.1.b
    text: een in het luchthavenbesluit vastgelegde grenswaarde vervangen door een andere grenswaarde.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.22
  - number: 10.22.2
    text: |-
      Het verlenen van een vrijstelling van een regel als bedoeld in [artikel 10.17, vierde lid, onder a of b][ref1],
      geschiedt in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.22
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.2.2
        afdeling: 10.3.2
  - number: 10.22.3
    text: |-
      Een vrijstelling kan slechts worden verleend voor een bepaalde in de vrijstelling vast te stellen termijn van ten
      hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.22
  - number: 10.22.4
    text: |-
      Aan een vrijstelling kunnen beperkingen en voorschriften worden verbonden met het oog op geluidsbelasting
      en veiligheid. [Artikel 10.20][ref1] is van overeenkomstige toepassing ten aanzien van de beperkingen en
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.22
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.2.3
        afdeling: 10.3.2
  - number: 10.22.5
    text: |-
      Het derde en vierde lid zijn van overeenkomstige toepassing op een vervanging als bedoeld in het eerste lid,
      onderdeel b.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.22
  - number: '10.23'
    text: |-
      De gegevens omtrent het feitelijk gebruik van een luchthaven door het luchthavenluchtverkeer worden jaarlijks door
      Onze Minister van Defensie in overeenstemming met Onze Minister van Infrastructuur en Milieu herleid tot contouren
      die de actuele geluidsbelasting voor dat verkeer in dat jaar weergeven. [Artikel 10.19][ref1] is van toepassing. De
      contourenkaarten zijn openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.23
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.2.2
        afdeling: 10.3.2
  - number: '10.24'
    text: |-
      De [artikelen 8.31 tot en met 8.33][ref1] zijn van overeenkomstige toepassing met dien verstande dat Onze Minister
      van Defensie in de plaats treedt van Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.24
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.6'
  - number: 10.25.1
    text: |-
      Onze Minister van Defensie stelt voor iedere luchthaven ten behoeve van overleg en voorlichting omtrent
      milieuaspecten buiten een luchthaven een commissie van overleg en voorlichting milieu in.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.25
  - number: 10.25.2
    text: 'De commissie bestaat in ieder geval uit:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.25
  - number: 10.25.2.a
    text: één vertegenwoordiger van elke provincie waarin het beperkingengebied geheel of gedeeltelijk is gelegen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.25
  - number: 10.25.2.b
    text: |-
      twee vertegenwoordigers van elke gemeente waarin het beperkingengebied geheel of gedeeltelijk is gelegen, waarvan
      één vertegenwoordiger van elke gemeente een omwonende van de luchthaven is;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.25
  - number: 10.25.2.c
    text: één of twee vertegenwoordigers van de luchthaven;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.25
  - number: 10.25.2.d
    text: één of twee vertegenwoordigers van Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.25
  - number: 10.25.3
    text: |-
      Onverminderd het tweede lid kan de commissie ook bestaan uit vertegenwoordigers van rechtspersoonlijkheid
      bezittende milieuorganisaties.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.25
  - number: 10.25.4
    text: |-
      De vertegenwoordiger van de provincie, dan wel één van hen indien er meer vertegenwoordigers
      van provincies in de commissie zitting hebben, treedt op als voorzitter van de commissie. De
      [artikelen 8.37, tweede en derde lid][ref1], en [8.38][ref2] zijn van overeenkomstige toepassing met dien verstande
      dat Onze Minister van Defensie in de plaats treedt van Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.25
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.7'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.7'
  - number: 10.25.5
    text: Onze Minister van Defensie voorziet in het secretariaat van de commissie.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.25
  - number: '10.26'
    text: |-
      Deze afdeling is in aanvulling op de [artikelen 10.15 tot en met 10.25][ref1] van toepassing op militaire
      luchthavens waar een vergunning voor burgermedegebruik kan worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.26
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.2.2
        afdeling: 10.3.2
  - number: 10.27.1
    text: |-
      Onze Minister van Defensie kan aan een rechtspersoon een vergunning verlenen voor burgermedegebruik onder
      verantwoordelijkheid van die rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.2
    text: |-
      Het verlenen van een vergunning voor burgermedegebruik door tussenkomst van een burgerexploitant geschiedt in
      overeenstemming met Onze Minister van Infrastructuur en Milieu. De overige vergunningen voor burgermedegebruik
      worden verleend na overleg met Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.3
    text: 'De vergunning vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.3.a
    text: de aard van het burgerluchtverkeer waarvoor de vergunning geldt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.3.b
    text: de termijn waarvoor de vergunning wordt verleend;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.3.c
    text: |-
      de voor het burgermedegebruik geldende grenswaarden, wat betreft de geluidbelasting eventueel in de vorm van een
      maximum aantal vliegtuigbewegingen per jaar waarvoor de vergunning geldt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.4
    text: Aan de vergunning kunnen beperkingen en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het verlenen, wijzigen,
      overdragen en intrekken van de vergunning, alsmede omtrent de aan de behandeling van de aanvraag verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.6
    text: |-
      Een vergunning wordt niet verleend voor burgerluchtvaart van commerciële aard op een luchthaven waar reeds
      burgermedegebruik plaatsvindt door tussenkomst van een burgerexploitant.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.7
    text: 'Een vergunning kan in ieder geval door Onze Minister van Defensie worden ingetrokken of gewijzigd wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.7.a
    text: een of meer redenen waarom de vergunning is verleend, zijn vervallen,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.7.b
    text: een of meer van de aan de vergunning verbonden beperkingen of voorschriften niet worden nageleefd,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.7.c
    text: |-
      na de verlening zodanige feiten of omstandigheden bekend zijn geworden dat, indien deze ten tijde van de verlening
      bekend waren geweest, de vergunning niet of niet in die vorm zou zijn verleend, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.7.d
    text: van een voor onbepaalde tijd verleende vergunning gedurende twee achtereenvolgende jaren geen gebruik is gemaakt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.8
    text: |-
      Met betrekking tot de intrekking en wijziging, bedoeld in het zevende lid, is het tweede lid van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
  - number: 10.27.9
    text: |-
      Ingeval de vergunning is verleend aan een burgerexploitant, is [artikel 8.53][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.27
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.4
        afdeling: 8.3.2
  - number: 10.28.1
    text: |-
      In het luchthavenbesluit voor een militaire luchthaven waar een vergunning voor burgermedegebruik kan worden
      verleend, worden de in [artikel 10.17, tweede en vierde lid][ref1], bedoelde grenswaarden en regels voor het
      militair luchtverkeer en het burgerluchtverkeer afzonderlijk vastgesteld. Voor het burgerluchtverkeer of een
      gedeelte daarvan kan de vaststelling van een afzonderlijke grenswaarde voor geluidbelasting geschieden in de vorm
      van een maximum aantal vliegtuigbewegingen per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.28
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.2.2
        afdeling: 10.3.2
  - number: 10.28.2
    text: |-
      Het luchthavenbesluit bevat ten behoeve van het burgerluchtverkeer in ieder geval regels omtrent de tijdstippen
      waarop van de luchthaven gebruik kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.28
  - number: 10.28.3
    text: Het luchthavenbesluit kan regels bevatten die noodzakelijk zijn met het oog op de geluidbelasting.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.28
  - number: 10.29.1
    text: |-
      De houder van een vergunning voor burgermedegebruik en Onze Minister van Defensie bevorderen het goede verloop van
      het luchthavenluchtverkeer overeenkomstig de vergunning en het luchthavenbesluit voor zover dit betrekking heeft op
      het burgerluchtverkeer. Zij treffen daartoe zelf en in onderlinge samenwerking de voorzieningen die redelijkerwijs
      van hen kunnen worden gevergd om te bewerkstelligen dat de belasting vanwege het luchthavenluchtverkeer een in
      de vergunning voor het burgermedegebruik opgenomen grenswaarde, daaronder begrepen een voor het burgermedegebruik
      vastgesteld maximum aantal vliegtuigbewegingen, niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.29
  - number: 10.29.2
    text: |-
      Ingeval de vergunning voor burgermedegebruik is verleend aan een burgerexploitant, is [artikel 8.19][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.29
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: 10.29.3
    text: |-
      [Artikel 8.21][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.29
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: 10.30.1
    text: |-
      Zodra Onze Minister van Defensie ter zake van een vergunning voor burgermedegebruik constateert dat een
      grenswaarde, daaronder begrepen een vastgesteld maximum aantal vliegtuigbewegingen, ten behoeve van het vergunde
      burgermedegebruik is overschreden, schrijft hij maatregelen voor die naar zijn oordeel bijdragen aan het
      terugdringen van de belasting vanwege het verkeer ten behoeve van de burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.30
  - number: 10.30.2
    text: |-
      Onze Minister van Defensie trekt de maatregelen in of matigt deze voor zover zij naar zijn oordeel niet langer
      nodig zijn voor het terugdringen van de belasting vanwege het luchthavenluchtverkeer binnen de grenswaarden,
      daaronder begrepen het aantal vliegtuigbewegingen voor dat verkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.30
  - number: 10.30.3
    text: |-
      Voordat Onze Minister van Defensie een maatregel voorschrijft, stelt hij degene tot wie de maatregel is gericht in
      de gelegenheid zijn zienswijze kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.30
  - number: 10.30.4
    text: |-
      De [artikelen 8.19][ref1] en [8.21][ref2] zijn in geval de vergunning voor burgermedegebruik is verleend aan een
      burgerexploitant, van overeenkomstige toepassing ten aanzien van de voorgeschreven maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.30
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: '10.31'
    text: |-
      De burgerexploitant is verplicht om in door Onze Minister van Infrastructuur en Milieu in overeenstemming met Onze
      Minister van Defensie aangewezen gevallen burgerluchthavenluchtverkeer op de luchthaven toe te laten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.31
  - number: '10.32'
    text: |-
      Het is de houder van een vergunning voor burgermedegebruik verboden om zonder of in afwijking van een daarvoor
      door Onze Minister van Defensie verleende vergunning op de luchthaven bouwwerken of andere opstallen op te richten,
      te hebben of te wijzigen dan wel bomen, gewassen of planten te hebben. De eerste volzin is van overeenkomstige
      toepassing ten aanzien van het hebben van roerende zaken of het verrichten van graafwerk anders dan in verband
      met de exploitatie of het onderhoud van dat deel van de luchthaven. Aan de vergunning kunnen beperkingen en
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.32
  - number: '10.33'
    text: |-
      Een ministeriële regeling op grond van de [artikelen 10.34][ref1] en [10.35][ref2] wordt vastgesteld door Onze
      Minister van Defensie in overeenstemming met Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.33
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.3.6
        afdeling: 10.3.3
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.3.6
        afdeling: 10.3.3
  - number: 10.34.1
    text: |-
      De houder van de vergunning voor burgermedegebruik draagt zorg voor het registreren van de belasting vanwege
      het luchthavenluchtverkeer ten behoeve van de burgerluchtvaart zodanig dat een vergelijking mogelijk is met de
      in het luchthavenbesluit opgenomen grenswaarden voor burgerluchtvaart. Hij verricht de berekeningen die voor
      die registratie noodzakelijk zijn. Indien voor het burgermedegebruik een maximum aantal vliegtuigbewegingen is
      vastgesteld, draagt de houder van de vergunning zorg voor het registreren van het aantal vliegtuigbewegingen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.34
  - number: 10.34.2
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent het registreren en omtrent de berekeningen die
      daartoe noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.34
  - number: 10.35.1
    text: 'De houder van de vergunning voor burgermedegebruik verstrekt aan Onze Minister van Defensie:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.35
  - number: 10.35.1.a
    text: |-
      de op grond van [artikel 10.34, eerste lid][ref1], door hem geregistreerde gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.35
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.3.6
        afdeling: 10.3.3
  - number: 10.35.1.b
    text: |-
      gegevens over de in [artikel 10.34][ref1] bedoelde berekeningen, voor zover die door hem zijn verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.35
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.3.6
        afdeling: 10.3.3
  - number: 10.35.2
    text: |-
      De houder van de vergunning voor burgermedegebruik verstrekt aan Onze Minister van Defensie gegevens over de ter
      uitvoering van [artikel 10.29][ref1] getroffen voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.35
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.3.4
        afdeling: 10.3.3
  - number: 10.35.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent de gegevensverstrekking.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.35
  - number: 10.36.1
    text: |-
      [Artikel 8.29][ref1] is ten aanzien van de veiligheidsaspecten van het luchthavenluchtverkeer ten behoeve van de
      burgerluchtvaart van overeenkomstige toepassing. Ten aanzien van de milieuaspecten van luchthavenluchtverkeer ten
      behoeve van de burgerluchtvaart is [artikel 8.29][ref2] van overeenkomstige toepassing met dien verstande dat het
      in dat artikel bedoelde verslag wordt uitgebracht door Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.36
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.5.3
        afdeling: '8.5'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.5.3
        afdeling: '8.5'
  - number: 10.36.2
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het openbaar maken van op grond van de
      [artikelen 10.34][ref1] of [10.35][ref2] geregistreerde of verstrekte gegevens. [Artikel 8.30, tweede lid][ref3],
      is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.36
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
