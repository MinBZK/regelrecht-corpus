        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.5
        afdeling: 8.3.2
  - number: 8.73.1
    text: |-
      Onze Minister van Infrastructuur en Milieu maakt elk jaar een verslag over de milieuaspecten en indien van
      toepassing de externe-veiligheidsaspecten van het luchthavenluchtverkeer. Het verslag bevat ten minste een
      beschrijving van de ter uitvoering van [artikel 8.45][ref1] getroffen maatregelen en van de doelmatigheid en
      doeltreffendheid van die maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.73
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.2
        afdeling: 8.3.2
  - number: 8.73.2
    text: |-
      De [artikelen 8.29, tweede lid][ref1], en [8.30][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.73
    references:
