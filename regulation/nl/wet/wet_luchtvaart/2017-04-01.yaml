  - number: 1.1.2
    text: |-
      Onder lid van het cockpitpersoneel wordt ten aanzien van onbemande luchtvaartuigen mede verstaan ieder, die
      werkzaamheden verricht, welke van direct belang zijn voor het op afstand bedienen van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.1
  - number: 1.1.3
    text: |-
      Onder luchtvaartmaatschappij wordt mede verstaan de naar privaatrecht opgerichte rechtspersoon, die zich bezig
      houdt met het vervoer van personen, dieren of goederen met luchtvaartuigen tegen vergoeding.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.1
  - number: 1.1.4
    text: |-
      Een wijziging van artikel 3, onderdelen a en k, van [richtlijn nr. 94/56/EG](31994L0056), gaat voor de toepassing
      van het eerste lid, onderdeel v, gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn
      uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.1
  - number: 1.2.1
    text: 'Deze wet is:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.2
  - number: 1.2.1.a
    text: |-
      van toepassing op de luchthavens, het luchtverkeer, de luchtverkeersbeveiliging, de luchtvaartnavigatiediensten,
      de luchtvaartuigen, het vervoer en de vluchtuitvoering met luchtvaartuigen binnen het vluchtinformatiegebied
      Amsterdam, voor zover hetgeen bij of krachtens de basisverordening is bepaald niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.2
  - number: 1.2.1.b
    text: |-
      van toepassing op Nederlandse luchtvaartuigen, alsmede het vervoer en de vluchtuitvoering met Nederlandse
      luchtvaartuigen buiten het vluchtinformatiegebied Amsterdam, voor zover hetgeen bij of krachtens de
      basisverordening is bepaald niet van toepassing is;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.2
  - number: 1.2.1.c
    text: |-
      met betrekking tot het bepaalde bij of krachtens [hoofdstuk 2][ref1], [3][ref2], en [4][ref3] en de
      [artikelen 5.13a][ref4], [5.14b][ref5], [11.1][ref6], [11.2][ref7], [11.2a][ref8], [11.3 tot en met 11.14][ref9]
      mede van toepassing binnen het luchtruim van Bonaire, Sint Eustatius en Saba en op het territoir van deze openbare
      lichamen;


