        paragraaf: 8.3.2.5
        afdeling: 8.3.2
  - number: 8.72.2
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden, in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, nadere regels gesteld omtrent het registreren van de
      grenswaarden die in het luchthavenbesluit zijn opgenomen, omtrent de berekeningen die daartoe noodzakelijk zijn en
      omtrent de gegevensverstrekking, bedoeld in [artikel 8.54, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.72
    references:
