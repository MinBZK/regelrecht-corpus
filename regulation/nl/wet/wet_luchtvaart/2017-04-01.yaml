        afdeling: '8.6'
  - number: 8.75.1
    text: |-
      Onze Minister van Infrastructuur en Milieu stelt voor iedere luchthaven een commissie regionaal overleg luchthaven
      in.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.75
  - number: 8.75.2
    text: 'De commissie bestaat uit een onafhankelijke voorzitter en in ieder geval uit vertegenwoordigers van:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.75
  - number: 8.75.2.a
    text: elke provincie waarin het beperkingengebied geheel of gedeeltelijk is gelegen,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.75
  - number: 8.75.2.b
    text: gemeenten waarin het beperkingengebied geheel of gedeeltelijk is gelegen,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.75
  - number: 8.75.2.c
    text: de exploitant van de luchthaven,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.75
  - number: 8.75.2.d
    text: de verlener van luchtverkeersdienstverlening voor zover op de luchthaven van toepassing, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.75
  - number: 8.75.2.e
    text: omwonenden van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.75
  - number: 8.75.3
    text: |-
      Onverminderd het tweede lid kan de commissie ook bestaan uit vertegenwoordigers van rechtspersoonlijkheid
      bezittende gebruikersorganisaties of milieuorganisaties.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.75
  - number: 8.75.4
    text: |-
      [Artikel 8.59][ref1] is van overeenkomstige toepassing met dien verstande dat voor de toepassing van het tweede en
      derde lid Onze Minister de plaats inneemt van provinciale staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.75
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.7
        afdeling: 8.3.2
  - number: '8.76'
    text: |-
      Deze afdeling is van toepassing op luchthavens van nationale betekenis waarvoor op grond van
      [artikel 8.1a, derde lid][ref1], vaststelling van een luchthavenbesluit niet is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.76
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.77.1
    text: |-
      Voor een luchthaven die is gelegen buiten provinciegrenzen zoals bepaald bij of krachtens de [Provinciewet][ref1],
      wordt bij regeling van Onze Minister van Infrastructuur en Milieu een luchthavenregeling vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005645
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.77
    references:
      - id: ref1
        bwb_id: BWBR0005645
  - number: 8.77.2
    text: |-
      [Artikel 8.64, tweede tot en met vierde en zesde lid][ref1], zijn van overeenkomstige toepassing met dien verstande
      dat voor de toepassing van de [artikelen 8.45, eerste lid][ref2], en [8.46, eerste lid][ref3], Onze Minister van
      Infrastructuur en Milieu in de plaats treedt van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.77
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.3.2
        afdeling: 8.3.3
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.2
        afdeling: 8.3.2
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.2
        afdeling: 8.3.2
  - number: '8.78'
    text: |-
      De [artikelen 8.24a, derde lid][ref1], [8.54, eerste en vierde lid][ref2], [8.72, tweede lid][ref3], en
      [8.73, eerste en derde lid][ref4], zijn van overeenkomstige toepassing met dien verstande dat voor de toepassing
      van [artikel 8.54, vierde lid][ref5], Onze Minister van Infrastructuur en Milieu in de plaats treedt van
      gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.78
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
