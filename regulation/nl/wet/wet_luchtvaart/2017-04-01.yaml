        afdeling: 8.3.2
  - number: 8.70.3
    text: |-
      Het luchthavenbesluit bevat omtrent de ruimtelijke indeling van het gebied van en rond de luchthaven in ieder geval
      regels ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.70
  - number: 8.70.3.a
    text: |-
      de bestemming en het gebruik van grond in verband met het externe-veiligheidsrisico vanwege het
      luchthavenluchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.70
  - number: 8.70.3.b
    text: de bestemming en het gebruik van grond in verband met de geluidbelasting vanwege het luchthavenluchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.70
  - number: 8.70.3.c
    text: |-
      de bestemming en het gebruik van de grond waaronder begrepen de maximale hoogte van objecten in, op of boven de
      grond, in verband met de vliegveiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.70
  - number: 8.70.4
    text: |-
      Bij het vaststellen van het luchthavenbesluit worden de nadere regels, bedoeld in [artikel 8.44, vierde lid][ref1],
      en [artikel 8.47, derde lid][ref2], in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.70
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.2
        afdeling: 8.3.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.2
        afdeling: 8.3.2
  - number: 8.70.5
    text: |-
      Bij de vaststelling van het luchthavenbesluit kan in ieder geval gebruik worden gemaakt van gegevens en onderzoeken
      die niet ouder zijn dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.70
  - number: 8.70.6
    text: |-
      Ten aanzien van de burgerluchthaven Twente wordt het luchthavenbesluit of een wijziging daarvan, in afwijking van
      het eerste lid, vastgesteld bij besluit van Onze Minister van Infrastructuur en Milieu in overeenstemming met Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer. [Artikel 8.71][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.70
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.4.2.2
        afdeling: 8.4.2
  - number: '8.71'
    text: |-
      De voordracht voor een luchthavenbesluit of de voordracht tot een wijziging daarvan wordt niet gedaan dan nadat
      het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen zesweken na
      de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister van Infrastructuur
      en Milieu te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan beide kamers der Staten-Generaal
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.71
  - number: 8.71a
    text: |-
      [Artikel 8.23a][ref1] is van overeenkomstige toepassing met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.71a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: 8.71a.a
    text: |-
      in de aanhef van het eerste lid in plaats van «krachtens [artikel 8.15][ref1] gestelde voorschriften» wordt gelezen
      «het bepaalde in een luchthavenbesluit» en in plaats van «de commissie regionaal overleg luchthaven Schiphol,
      bedoeld in [artikel 8.34][ref2]» wordt gelezen: de commissie regionaal overleg van de betreffende luchthaven,
      bedoeld in [artikel 8.75][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.71a
    references:
