        afdeling: '8.4'
      - id: ref6
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
      - id: ref7
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25da.5
    text: |-
      In het geval dat een overige burgerluchthaven de drempelwaarde van vijf miljoen passagiersbewegingen
      overschrijdt, doet de exploitant van deze luchthaven aan de gebruikers mededeling van een voorstel
      voor de tarieven en voorwaarden en stelt hij de tarieven en voorwaarden vast overeenkomstig de
      [artikelen 8.25d, eerste, tweede, zesde en tiende lid][ref1], [8.25e][ref2], [8.25f][ref3], [8.25h][ref4],
      [8.25i][ref5] en [8.25j][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel8
