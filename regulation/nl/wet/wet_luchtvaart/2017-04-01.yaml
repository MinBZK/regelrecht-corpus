  - number: 8.72.1
    text: |-
      De [artikelen 8.24a][ref1], [8.52][ref2], [8.53][ref3] en [8.54, eerste en vierde lid][ref4], zijn van toepassing
      met dien verstande dat voor de toepassing van [artikel 8.54, vierde lid][ref5], Onze Minister van Infrastructuur en
      Milieu in de plaats treedt van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.72
