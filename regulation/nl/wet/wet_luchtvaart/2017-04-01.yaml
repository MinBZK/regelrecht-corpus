  - number: '8.66'
    text: |-
      Indien provinciale staten voor een luchthaven een commissie regionaal overleg luchthaven instellen, zijn de
      [artikelen 8.58, tweede en derde lid][ref1], en [8.59][ref2] van toepassing.


