        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
      - id: ref5
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
      - id: ref6
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25e.1
    text: |-
      Voorafgaand aan de vaststelling van de tarieven en voorwaarden, bedoeld in [artikel 8.25d, eerste lid][ref1], doet
      de exploitant van de luchthaven aan de gebruikers van de luchthaven en representatieve organisaties mededeling van
      een voorstel van deze tarieven en voorwaarden met een omschrijving van de daarvoor te leveren diensten, alsmede
      een toelichting, inhoudende een economische onderbouwing en een omschrijving, aan de hand van indicatoren, van het
      kwaliteitsniveau van de aangeboden diensten ten behoeve van het gebruik van de luchthaven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25e
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25e.2
    text: |-
      Voorafgaand aan het voorstel voor de vaststelling van de tarieven en voorwaarden, bedoeld in
      [artikel 8.25d, eerste lid][ref1], verstrekken de gebruikers aan de exploitant de bij of krachtens algemene
      maatregel van bestuur voorgeschreven informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25e
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25e.3
    text: |-
      De exploitant van de luchthaven raadpleegt de gebruikers van de luchthaven en representatieve organisaties over het
      voorstel, bedoeld in het eerste lid, alvorens de tarieven en voorwaarden vast te stellen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25e
  - number: 8.25e.4
    text: |-
      De exploitant van de luchthaven houdt bij de vaststelling van de tarieven en voorwaarden rekening met de zienswijze
      van de gebruikers van de luchthaven en van representatieve organisaties naar aanleiding van de raadpleging, bedoeld
      in het derde lid, en motiveert bij de vaststelling van de tarieven en voorwaarden zijn overwegingen omtrent de
      ingebrachte zienswijzen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25e
  - number: 8.25e.5
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25e
  - number: 8.25e.5.a
    text: de wijze en het tijdstip waarop de mededeling, bedoeld in het eerste lid, plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25e
  - number: 8.25e.5.b
    text: de wijze waarop de raadpleging, bedoeld in het derde lid, plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25e
  - number: 8.25e.5.c
    text: de indicatoren, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25e
  - number: 8.25e.5.d
    text: |-
      de gegevens die door de exploitant van de luchthaven moeten worden opgenomen in het voorstel voor de tarieven en
      voorwaarden, bedoeld in het eerste lid, en de daarbij behorende toelichting.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25e
  - number: 8.25e.6
    text: |-
      De op basis van dit artikel door de exploitant aan de gebruikers van de luchthaven verstrekte informatie dient
      door de gebruikers te worden beschouwd en behandeld als bedrijfsvertrouwelijk of economisch gevoelig. De op
      basis van dit artikel door de gebruikers van de luchthaven aan de exploitant verstrekte informatie dient door de
      exploitant evenzeer te worden beschouwd en behandeld als bedrijfsvertrouwelijk of economisch gevoelig en mag door
      de exploitant bovendien niet in een tot een gebruiker herleidbare vorm in het voorstel worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25e
  - number: 8.25ea.1
    text: |-
      Gebruikers van de luchthaven die gebruik wensen te maken van diensten op maat of specifiek voor hen gereserveerde
      terminals of delen van terminals, kunnen een verzoek daartoe richten aan de exploitant.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25ea
  - number: 8.25ea.2
    text: |-
      De exploitant van de luchthaven stelt relevante, objectieve, transparante en non-discriminatoire criteria vast, op
      basis waarvan een verzoek van gebruikers van de luchthaven wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25ea
  - number: 8.25ea.3
    text: |-
      Naast de criteria, bedoeld in het tweede lid, kan de exploitant van de luchthaven aanvullende criteria hanteren
      indien de inhoud van het verzoek daartoe noodzaakt. De aanvullende criteria voldoen aan dezelfde eisen als de
      criteria bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25ea
  - number: 8.25ea.4
    text: |-
      Indien binnen vier weken nadat de exploitant van de luchthaven heeft beslist op een verzoek als bedoeld in het
      eerste lid, daartoe een aanvraag van een gebruiker is ingediend, stelt de Autoriteit Consument en Markt vast of de
      beslissing van de exploitant in strijd is met bij of krachtens deze wet gestelde regels. De Autoriteit Consument en
      Markt geeft haar oordeel binnen drie maanden. Indien de Autoriteit Consument en Markt vaststelt dat de beslissing
      in strijd is met bij of krachtens deze wet gestelde regels, deelt zij dit terstond mede aan de exploitant van
      de luchthaven. De exploitant van de luchthaven neemt binnen vier weken een nieuwe beslissing op het verzoek met
      inachtneming van de overwegingen van de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25ea
  - number: 8.25f.1
    text: |-
      Indien binnen vier weken na de mededeling, bedoeld in [artikel 8.25d, eerste lid][ref1], van de vaststelling
      van de tarieven en voorwaarden bij de Autoriteit Consument en Markt een aanvraag van een gebruiker of van een
      representatieve organisatie is ingediend tot vaststelling of de tarieven en voorwaarden in strijd zijn met bij
      of krachtens deze wet gestelde regels, treden de tarieven en voorwaarden op de voorgenomen ingangsdatum niet in
      werking. De Autoriteit Consument en Markt deelt de exploitant van de luchthaven terstond mede dat een aanvraag van
      een gebruiker of van een representatieve organisatie is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25f
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25f.2
    text: |-
      De Autoriteit Consument en Markt neemt binnen vier weken na ontvangst van de aanvraag een besluit omtrent de
      inwerkingtreding van de door de exploitant vastgestelde tarieven en voorwaarden. De Autoriteit Consument en
      Markt wijst daarbij de tarieven en voorwaarden aan waarvoor, gelet op de aanvraag, de in het eerste lid bedoelde
      opschorting van de inwerkingtreding noodzakelijk blijft. In plaats van deze aangewezen tarieven en voorwaarden
      hanteert de exploitant de tarieven en voorwaarden die golden in de periode voorafgaand aan de periode waarvoor de
      aangewezen tarieven en voorwaarden waren vastgesteld. De tarieven en voorwaarden die niet zijn aangewezen, treden
      op de door de exploitant voorgenomen ingangsdatum in werking. Het nemen van een besluit als bedoeld in de eerste
      volzin, blijft achterwege indien binnen de daarin genoemde termijn een besluit over de aanvraag kan worden genomen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25f
  - number: 8.25f.3
    text: |-
      De Autoriteit Consument en Markt beslist zo spoedig mogelijk doch uiterlijk binnen vier maanden na ontvangst van de
      aanvraag. Deze termijn kan in uitzonderlijke gevallen met twee maanden worden verlengd. De Autoriteit Consument en
      Markt doet de aanvrager voor het einde van de in de eerste volzin bedoelde termijn met redenen omkleed mededeling
      van de verlenging.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25f
  - number: 8.25f.4
    text: |-
      Indien de Autoriteit Consument en Markt vaststelt dat de tarieven en voorwaarden in strijd zijn met bij of
      krachtens deze wet gestelde regels, deelt zij dit terstond mede aan de exploitant van de luchthaven. De exploitant
      van de luchthaven stelt opnieuw de tarieven en voorwaarden vast met inachtneming van de overwegingen van de
      Autoriteit Consument en Markt. Nadat de tarieven en voorwaarden opnieuw zijn vastgesteld, trekt de Autoriteit
      Consument en Markt het besluit omtrent de inwerkingtreding bedoeld in het tweede lid in. De opnieuw vastgestelde
      tarieven en voorwaarden gelden vanaf de door de exploitant oorspronkelijk voorgenomen ingangsdatum.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25f
  - number: 8.25f.5
    text: |-
      Indien de Autoriteit Consument en Markt heeft vastgesteld dat de tarieven en voorwaarden niet in strijd zijn met
      bij of krachtens deze wet gestelde regels, trekt zij het besluit omtrent de inwerkingtreding bedoeld in het tweede
      lid in, en gelden deze tarieven en voorwaarden vanaf de door de exploitant oorspronkelijk voorgenomen ingangsdatum.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25f
  - number: 8.25f.6
    text: |-
      Eventuele verschillen in tarieven, voortvloeiende uit beslissingen van de Autoriteit Consument en Markt als
      bedoeld in het eerste tot en met vijfde lid, worden vereffend bij de hernieuwde vaststelling van de tarieven en
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25f
  - number: 8.25f.7
    text: |-
      Het eerste lid en [artikel 8.25e][ref1] zijn niet van toepassing op de vaststelling van tarieven en voorwaarden als
      bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25f
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25f.8
    text: |-
      De exploitant van de luchthaven hanteert de ingevolge het vierde lid vastgestelde tarieven en voorwaarden
      gedurende het resterende deel van de periode waarvoor de tarieven en voorwaarden overeenkomstig
      [artikel 8.25d, eerste lid][ref1], waren vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25f
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25f.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de aanvraag, bedoeld in het
      eerste lid, aan de Autoriteit Consument en Markt en omtrent de vaststelling van tarieven en voorwaarden, bedoeld in
      het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25f
  - number: 8.25g.1
    text: |-
      De exploitant van de luchthaven stelt een toerekeningssysteem vast voor de kosten en opbrengsten van de
      activiteiten, bedoeld in [artikel 8.25d, eerste lid][ref1], dat voldoet aan de eisen van marktconformiteit,
      proportionaliteit en integraliteit. De exploitant van de luchthaven legt het toerekeningssysteem ter goedkeuring
      voor aan de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25g
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25g.2
    text: |-
      De exploitant van de luchthaven voert voor de activiteiten met betrekking tot het gebruik van de luchthaven
      door gebruikers een gescheiden administratie binnen de boekhouding, waarbinnen de kosten en opbrengsten van
      de uitvoering van de beveiliging van passagiers en hun bagage, bedoeld in [artikel 8.25d, vijfde lid][ref1],
      afzonderlijk worden geadministreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25g
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25g.3
    text: |-
      Op grond van de gescheiden administratie binnen de boekhouding, bedoeld in het tweede lid, stelt de exploitant
      van de luchthaven jaarlijks een financiële verantwoording op over het voorafgaande boekjaar, die bestaat uit een
      afzonderlijke exploitatierekening en een overzicht van de toegedeelde materiële vaste activa voor het geheel van de
      activiteiten, bedoeld in [artikel 8.25d, eerste lid][ref1]. De financiële verantwoording bevat een toelichting en
      is voorzien van een verklaring van een onafhankelijke accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25g
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25g.4
    text: |-
      De exploitant van de luchthaven legt binnen vijf maanden na afloop van het boekjaar van de exploitant van
      de luchthaven de financiële verantwoording over het voorafgaande boekjaar tezamen met de verklaring van de
      onafhankelijke accountant, over aan de Autoriteit Consument en Markt en de gebruikers die daarom verzoeken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25g
  - number: 8.25g.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de inrichting en goedkeuring
      van het toerekeningssysteem, bedoeld in het eerste lid, de toedeling van activa aan de activiteiten, bedoeld in
      [artikel 8.25d, eerste lid][ref1], de inrichting van de gescheiden administratie binnen de boekhouding, bedoeld in
      het tweede lid, en omtrent de financiële verantwoording, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25g
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25g.6
    text: |-
      Op de voorbereiding van een besluit omtrent goedkeuring van het toerekeningssysteem is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 8.25g.7
    text: |-
      Onverminderd [artikel 3:15 van de Algemene wet bestuursrecht][ref1], kunnen de gebruikers van de luchthaven hun
      zienswijze naar voren brengen over het voorgenomen besluit omtrent goedkeuring van het toerekeningssysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 8.25g.8
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan de beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25g
  - number: 8.25ga
    text: |-
      De exploitant van de luchthaven zendt de Autoriteit Consument en Markt en de gebruikers binnen vijf maanden na
      afloop van het boekjaar een rapportage omtrent het gerealiseerde kwaliteitsniveau van de geleverde diensten ten
      behoeve van het gebruik van de luchthaven, bedoeld in [artikel 8.25e, eerste lid][ref1], over het voorafgaande
      boekjaar, mede aan de hand van ervaringen van passagiers. De rapportage omtrent het gerealiseerde kwaliteitsniveau
      geschiedt aan de hand van de indicatoren, bedoeld in artikel 8.25e, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25ga
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25h.1
    text: |-
      De exploitant van de luchthaven zendt de Autoriteit Consument en Markt een afschrift van de mededeling, bedoeld in
      [artikel 8.25d, eerste lid][ref1], en van de mededeling, bedoeld in [artikel 8.25e, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25h
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25h.2
    text: |-
      De exploitant van de luchthaven verleent binnen de door de Autoriteit Consument en Markt gestelde termijn alle
      medewerking die deze redelijkerwijs kan verlangen bij de uitoefening van haar bevoegdheden op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25h
  - number: 8.25h.3
    text: |-
      [Artikel 4:15 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing indien de Autoriteit
      Consument en Markt aan de exploitant van de luchthaven om gegevens verzoekt met het oog op een te nemen besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25h
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 8.25h.4
    text: |-
      Ingeval van overtreding van het tweede lid is
      [artikel 12m van de Instellingswet Autoriteit Consument en Markt][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12m
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25h
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: 12m
  - number: 8.25j
    text: |-
      Een voordracht voor een algemene maatregel van bestuur op grond van de [artikelen 8.25d tot en met 8.25g][ref1]
      wordt gedaan door Onze Minister van Infrastructuur en Milieu in overeenstemming met Onze Minister van Economische
      Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25j
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: '8.26'
    text: |-
      Een ministeriële regeling op grond van deze afdeling wordt vastgesteld door Onze Minister van Infrastructuur en
      Milieu in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.26
  - number: 8.27.1
    text: |-
      De exploitant van de luchthaven draagt zorg voor het registreren van de veiligheids- en milieubelasting vanwege het
      luchthavenluchtverkeer. Hij verricht de metingen en berekeningen die voor die registratie noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.27
  - number: 8.27.2
    text: |-
      Het registreren wordt zodanig uitgevoerd dat een vergelijking mogelijk is met de in artikel 8.17, vierde lid,
      bedoelde grenswaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.27
  - number: 8.27.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent het registreren en omtrent de metingen en
      berekeningen die daartoe noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.27
  - number: 8.28.1
    text: 'De exploitant van de luchthaven verstrekt de inspecteur-generaal:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.28
  - number: 8.28.1.a
    text: |-
      de op grond van [artikel 8.27][ref1] geregistreerde gegevens;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.28
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.5.2
        afdeling: '8.5'
  - number: 8.28.1.b
    text: |-
      gegevens over de in [artikel 8.27][ref1] bedoelde metingen en berekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.28
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.5.2
        afdeling: '8.5'
  - number: 8.28.2
    text: |-
      De exploitant, de verlener van luchtverkeersdiensten en de luchtvaartmaatschappijen verstrekken de inspecteur-
      generaal gegevens over de ter uitvoering van [artikel 8.18][ref1] getroffen voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.28
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: 8.28.3
    text: |-
      De exploitant verstrekt de inspecteur-generaal gegevens over de afwijkingen, bedoeld in [artikel 8.19][ref1]. De
      verlener van luchtverkeersdiensten verstrekt de inspecteur-generaal gegevens over de afwijkingen, bedoeld in de
      [artikelen 8.20][ref2] en [8.21][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.28
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: 8.28.4
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent de gegevensverstrekking.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.28
  - number: 8.29.1
    text: |-
      De inspecteur-generaal brengt elk half jaar aan Onze Minister van Infrastructuur en Milieu en aan Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer verslag uit over de veiligheids- en milieuaspecten van het
      luchthavenluchtverkeer. Het verslag bevat ten minste een beschrijving van:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.29
  - number: 8.29.1.a
    text: |-
      de ter uitvoering van [artikel 8.18][ref1] getroffen voorzieningen en van de doelmatigheid en doeltreffendheid van
      die voorzieningen;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.29
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: 8.29.1.b
    text: |-
      de ter uitvoering van [artikel 8.22][ref1] getroffen maatregelen en van de doelmatigheid en de doeltreffendheid van
      die maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.29
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: 8.29.2
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent de verslaglegging.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.29
  - number: 8.29a.1
    text: |-
      De exploitant van de luchthaven brengt elke drie jaar, of zoveel eerder als Onze Minister van Infrastructuur
      en Milieu nodig oordeelt, aan Onze Minister van Infrastructuur en Milieu verslag uit over de exploitatie van de
      luchthaven. Het verslag bevat ten minste een beschrijving van de ter uitvoering van [artikel 8.25a][ref1] getroffen
      voorzieningen, een overzicht van alle daartoe relevante gegevens en een beschrijving van de doelmatigheid en
      doeltreffendheid van die voorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.29a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.29a.2
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de verslaggeving.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.29a
  - number: 8.30.1
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het openbaar maken van gegevens als bedoeld in artikel
      8.28.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.30
  - number: 8.30.2
    text: |-
      De openbaarmaking geschiedt door kennisgeving van de gegevens of van de zakelijke inhoud ervan in een van
      overheidswege uitgegeven blad of een dag-, nieuws- of huis-aan-huisblad, dan wel op een andere geschikte wijze.
      Indien alleen van de zakelijke inhoud kennis wordt gegeven, worden de gegevens tegelijk ter inzage gelegd. In de
      kennisgeving wordt vermeld waar en wanneer de gegevens ter inzage liggen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.30
  - number: 8.31.1
    text: |-
      Indien een belanghebbende ten gevolge van het luchthavenindelingbesluit of het luchthavenverkeerbesluit schade
      lijdt of zal lijden, welke redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven en waarvan de
      vergoeding niet of niet voldoende anderszins is verzekerd, kent Onze Minister van Infrastructuur en Milieu hem op
      aanvraag een naar billijkheid te bepalen schadevergoeding toe.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.31
  - number: 8.31.2
    text: |-
      Een aanvraag om schadevergoeding wordt ingediend binnen vijf jaar nadat de desbetreffende bepaling van het
      luchthavenindelingbesluit of het luchthavenverkeerbesluit of het desbetreffende besluit op grond van een van
      genoemde besluiten onherroepelijk is geworden. Van de aanvrager heft Onze Minister van Infrastructuur en Milieu een
      recht ten bedrage van € 300. De aanvrager wordt gewezen op de verschuldigdheid van het recht en wordt medegedeeld
      dat het verschuldigde bedrag binnen vier weken na de dag van verzending van de mededeling op de door Onze Minister
      van Infrastructuur en Milieu aangegeven rekening moet zijn bijgeschreven. Indien het bedrag niet binnen deze
      termijn is bijgeschreven, wordt de aanvrager niet ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden
      geoordeeld dat de aanvrager in verzuim is geweest. Indien op de aanvraag geheel of gedeeltelijk positief wordt
      beslist, stort Onze Minister van Infrastructuur en Milieu het betaalde recht terug.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.31
  - number: 8.31.3
    text: |-
      [Afdeling 6.1 van de Wet ruimtelijke ordening][ref1] blijft buiten toepassing voor zover de belanghebbende met
      betrekking tot de schade een beroep doet of kan doen op een schadevergoeding als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Afdeling6.1
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.31
    references:
      - id: ref1
        bwb_id: BWBR0020449
        afdeling: '6.1'
  - number: '8.32'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan in overeenstemming met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer een regeling vaststellen inzake het treffen van geluidwerende voorzieningen
      ten aanzien van in de regeling bepaalde woningen of andere geluidsgevoelige gebouwen voor zover die gebouwen
      vanwege het luchthavenluchtverkeer een geluidbelasting kunnen ondervinden die ligt boven de in de regeling
      vastgestelde maximale waarden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.32
  - number: '8.33'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan regels stellen ten aanzien van het verstrekken van geldelijke steun
      uit s Rijks kas aan gemeenten ter bestrijding van de kosten ten gevolge van uitvoering van de in overeenstemming
      met het luchthavenindelingbesluit gebrachte bestemmingsplannen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.33
  - number: 8.34.1
    text: Er is een commissie regionaal overleg luchthaven Schiphol.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.34
  - number: 8.34.2
    text: 'De commissie bestaat uit een onafhankelijke voorzitter en vertegenwoordigers van:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.34
  - number: 8.34.2.a
    text: de provincies Noord-Holland, Zuid-Holland en Utrecht;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.34
  - number: 8.34.2.b
    text: gemeenten in de in onderdeel a genoemde provincies;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.34
  - number: 8.34.2.c
    text: de exploitant van de luchthaven;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.34
  - number: 8.34.2.d
    text: de verlener van luchtverkeersdienstverlening;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.34
  - number: 8.34.2.e
    text: luchtvaartmaatschappijen die geregeld van de luchthaven gebruik maken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.34
  - number: '8.35'
    text: |-
      De commissie heeft tot taak om door overleg tussen de in artikel 8.34 bedoelde betrokkenen een gebruik van de
      luchthaven te bevorderen dat zoveel mogelijk recht doet aan de belangen van die betrokkenen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.35
  - number: '8.36'
    text: |-
      Onze Minister van Infrastructuur en Milieu stelt nadere regels omtrent de taak en de samenstelling van
      de commissie. Daarbij wordt bepaald welke in [artikel 8.34, tweede lid][ref1], bedoelde gemeenten en
      luchtvaartmaatschappijen in de commissie vertegenwoordigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.36
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.7'
  - number: 8.37.1
    text: |-
      De voorzitter van de commissie wordt door Onze Minister van Infrastructuur en Milieu benoemd, geschorst en
      ontslagen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.37
  - number: 8.37.2
    text: |-
      Elk ander lid wordt benoemd, geschorst en ontslagen door de voorzitter op voordracht van het orgaan of de
      organisatie die het lid vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.37
  - number: 8.37.3
    text: |-
      De benoeming geschiedt voor ten hoogste vier jaren. Herbenoeming kan telkens voor ten hoogste vier jaren
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.37
  - number: '8.38'
    text: |-
      De commissie stelt een bestuursreglement vast. Het reglement behoeft de goedkeuring van Onze Minister van
      Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.38
  - number: '8.39'
    text: |-
      De commissie heeft een secretariaat. De samenstelling en de werkzaamheden van het secretariaat worden in het
      bestuursreglement geregeld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.39
  - number: '8.40'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de commissie wordt in het bestuursreglement geregeld.
      De bescheiden worden na beëindiging van de werkzaamheden van de commissie opgeborgen in het archief van het
      ministerie van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.40
  - number: 8.41.1
    text: Deze titel is van toepassing op luchthavens van regionale betekenis.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.41
  - number: 8.41.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, indien bovenprovinciale belangen dit vorderen, regels
      worden gesteld ten aanzien van de vorm van luchtvaart die in ieder geval toegang heeft tot een luchthaven van
      regionale betekenis. Bij of krachtens algemene maatregel van bestuur kan tevens worden bepaald welke grenswaarden
      voor de geluidbelasting voor dit luchthavenluchtverkeer ter beschikking moeten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.41
  - number: 8.41.3
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.41
  - number: '8.42'
    text: |-
      Deze afdeling is van toepassing op luchthavens van regionale betekenis waarvoor op grond van
      [artikel 8.1a, derde lid][ref1], vaststelling van een luchthavenbesluit is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.42
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.43.1
    text: |-
      Provinciale staten stellen bij verordening voor de luchthaven een luchthavenbesluit vast. Provinciale
      staten kunnen de bevoegdheid tot het vaststellen van deze verordening niet overdragen als bedoeld in
      [artikel 152 van de Provinciewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel152
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.43
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '152'
  - number: 8.43.2
    text: 'Een luchthavenbesluit bevat bepalingen omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.43
  - number: 8.43.2.a
    text: het luchthavenluchtverkeer, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.43
  - number: 8.43.2.b
    text: de ruimtelijke indeling van het gebied van en rond de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.43
  - number: 8.43.3
    text: |-
      [Artikel 107 van de Provinciewet][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel107
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.43
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '107'
  - number: 8.44.1
    text: 'Het luchthavenbesluit bevat ten aanzien van het luchthavenluchtverkeer:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.44
  - number: 8.44.1.a
    text: grenswaarden en regels voor zover deze noodzakelijk zijn met het oog op de geluidbelasting, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.44
  - number: 8.44.1.b
    text: regels voor zover deze noodzakelijk zijn met het oog op de vliegveiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.44
  - number: 8.44.2
    text: |-
      Binnen de in het eerste lid, onder a, bedoelde grenswaarden kan in ieder geval een grenswaarde exclusief worden
      toegewezen voor vluchten ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.44
  - number: 8.44.2.a
    text: spoedeisende hulpverlening;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.44
  - number: 8.44.2.b
    text: |-
      de uitoefening van politietaken als bedoeld in [artikel 3 van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.44
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '3'
  - number: 8.44.3
    text: |-
      Een luchthavenbesluit kan tevens regels of grenswaarden bevatten die noodzakelijk zijn met het oog op het externe-
      veiligheidsrisico of de lokale luchtverontreiniging.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.44
  - number: 8.44.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de in luchthavenbesluiten op
      te nemen grenswaarden en regels. Deze maatregel stelt in ieder geval regels omtrent het opnemen van grenswaarden
      voor de geluidbelasting. Bij deze maatregel kan een onderscheid worden gemaakt tussen categorieën luchthavens en
      tussen vormen van luchtvaart die gebruik maken van luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.44
  - number: 8.44.5
    text: |-
      De [artikelen 8.19 tot en met 8.21][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.44
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: 8.44.6
    text: |-
      De voordracht voor een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.44
  - number: 8.44.7
    text: |-
      Bij de vaststelling van het luchthavenbesluit kan in ieder geval gebruik worden gemaakt van gegevens en onderzoeken
      die niet ouder zijn dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.44
  - number: 8.45.1
    text: |-
      Zodra gedeputeerde staten constateren dat een in het luchthavenbesluit opgenomen grenswaarde is overschreden,
      schrijven zij maatregelen voor die naar hun oordeel bijdragen aan het terugdringen van de belasting vanwege het
      luchthavenluchtverkeer binnen de grenswaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.45
  - number: 8.45.2
    text: |-
      [Artikel 8.22, derde en vierde lid][ref1], is van overeenkomstige toepassing met dien verstande dat gedeputeerde
      staten in de plaats treden van de inspecteur-generaal. [Artikel 8.44, vijfde lid][ref2], is van overeenkomstige
      toepassing ten aanzien van de voorgeschreven maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.45
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.2
        afdeling: 8.3.2
  - number: 8.45.3
    text: |-
      Gedeputeerde staten schrijven geen maatregelen als bedoeld in het eerste lid voor met betrekking tot de
      overschrijding van de grenswaarde die is veroorzaakt door vluchten als bedoeld in [artikel 8.44, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.45
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.2
        afdeling: 8.3.2
  - number: 8.46.1
    text: |-
      Gedeputeerde staten kunnen indien ten gevolge van groot onderhoud van een baan of door een bijzonder voorval het
      normale gebruik van de luchthaven naar hun oordeel ernstig wordt belemmerd:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.46
  - number: 8.46.1.a
    text: vrijstelling verlenen van een regel in het luchthavenbesluit;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.46
  - number: 8.46.1.b
    text: een in het luchthavenbesluit vastgelegde grenswaarde voor geluid vervangen door een andere grenswaarde.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.46
  - number: 8.46.2
    text: |-
      Aan een vrijstelling of vervanging kunnen beperkingen en voorschriften worden verbonden met het oog op de
      geluidbelasting, het externe-veiligheidsrisico, de vliegveiligheid of de lokale luchtverontreiniging.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.46
  - number: 8.46.3
    text: |-
      [Artikel 8.23, tweede lid][ref1], is van toepassing. [Artikel 8.44, vijfde lid][ref2], is van overeenkomstige
      toepassing ten aanzien van de beperkingen en voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.46
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.2
        afdeling: 8.3.2
  - number: 8.47.1
    text: |-
      In het luchthavenbesluit worden ten behoeve van de ruimtelijke indeling van het gebied van en rond de luchthaven,
      het luchthavengebied en het beperkingengebied vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.47
  - number: 8.47.2
    text: |-
      De [artikelen 8.5, derde tot en met vijfde lid][ref1], [8.6][ref2], [8.7, eerste en derde lid][ref3], [8.8][ref4],
      [8.9][ref5], [8.10][ref6], [8.11][ref7] en [8.12, eerste tot en met vierde lid][ref8], zijn van overeenkomstige
      toepassing met dien verstande dat de verklaring van geen bezwaar, bedoeld in [artikel 8.9, derde lid][ref9],
      respectievelijk de ontheffing, bedoeld in [artikel 8.12, derde lid][ref10], wordt verleend door gedeputeerde
      staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
