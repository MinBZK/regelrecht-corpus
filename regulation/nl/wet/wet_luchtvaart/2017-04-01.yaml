        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2.2
        afdeling: 8.3.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
