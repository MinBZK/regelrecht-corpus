      [ref6]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref9]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref10]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.47
