  - number: 8.71a.d
    text: |-
      in het achtste en negende lid in plaats van «de commissie regionaal overleg luchthaven Schiphol, bedoeld in
      [artikel 8.34][ref1]» wordt gelezen: de commissie regionaal overleg van de betreffende luchthaven, bedoeld in
