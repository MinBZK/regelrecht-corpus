      van:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.15
  - number: 11.15.a
    text: |-
      de bij of krachtens deze wet gestelde verplichtingen, met uitzondering van verplichtingen als bedoeld in de
      [artikelen 8.25d tot en met 8.25h][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.15
