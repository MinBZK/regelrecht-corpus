        artikel: '62'
      - id: ref7
        bwb_id: BWBR0004770
        artikel: '66'
      - id: ref8
        bwb_id: BWBR0002320
        artikel: '76'
      - id: ref9
        bwb_id: BWBR0002320
        artikel: '80'
      - id: ref10
        bwb_id: BWBR0002320
        artikel: '82'
      - id: ref11
