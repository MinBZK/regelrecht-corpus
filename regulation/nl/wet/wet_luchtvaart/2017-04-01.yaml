  - number: '11.24'
    text: |-
      Ingeval van overtreding van de [artikelen 8.25d, eerste tot en met dertiende lid][ref1], de krachtens het veertiende
      lid gestelde regels, [8.25da, vijfde en zesde lid][ref2], [8.25e, eerste, tweede, derde of vierde lid][ref3],
      de krachtens het vijfde lid gestelde regels, [8.25ea, tweede, derde lid of vierde lid, laatste volzin][ref4],
      [8.25f, eerste, tweede, vierde, achtste of negende lid][ref5], de krachtens het tiende lid gestelde
      regels, [8.25ga][ref6] of [8.25h, eerste of tweede lid][ref7], is [hoofdstuk 7][ref8], met uitzondering van
      [artikel 58a, van de Mededingingswet][ref9] van overeenkomstige toepassing.


