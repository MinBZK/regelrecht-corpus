        artikel: '8'
        hoofdstuk: '8'
  - number: '8.69'
    text: |-
      Deze afdeling is van toepassing op luchthavens van nationale betekenis waarvoor op grond van
      [artikel 8.1a, derde lid][ref1], vaststelling van een luchthavenbesluit is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.69
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.70.1
    text: |-
      Voor een luchthaven waarvan op grond van [artikel 8.1, tweede lid][ref1], is bepaald dat deze van nationale
      betekenis is, wordt het luchthavenbesluit bij algemene maatregel van bestuur vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.70
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.70.2
    text: |-
      De [artikelen 8.43, tweede lid][ref1], [8.44, eerste, tweede, derde en vijfde lid][ref2], [8.45][ref3],
      [8.46][ref4] en [8.47, eerste en tweede lid][ref5], zijn van overeenkomstige toepassing met dien verstande dat voor
      de toepassing van de artikelen 8.45, eerste en derde lid, en 8.46, eerste lid, Onze Minister van Infrastructuur en
      Milieu in de plaats treedt van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.70
    references:
