  - number: 1.2.3
    text: |-
      Bij de toepassing van het tweede lid kunnen bij of krachtens die algemene maatregel van bestuur voorschriften en
      beperkingen worden opgenomen met betrekking tot één of meer buiten toepassing van de wet te laten onderdelen. Deze
      voorschriften en beperkingen kunnen mede betrekking hebben op de beperking van geluidshinder.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.2
  - number: 1.2a.1
    text: |-
      Het is verboden toestellen, die geen luchtvaartuig zijn, in het luchtruim te gebruiken. Onze Minister van
      Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kan bij ministeriële regeling voor door hem aan
      te wijzen toestellen vrijstelling verlenen van het verbod.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.2a
  - number: 1.2a.2
    text: |-
      Aan de vrijstelling, bedoeld in het eerste lid, kunnen voorschriften of beperkingen worden verbonden. Het is
      verboden in strijd met deze voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.2a
  - number: '1.3'
    text: 'Een luchtvaartmaatschappij is verplicht er voor zorg te dragen, dat:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.3
  - number: 1.3.a
    text: |-
      de door haar geëxploiteerde luchtvaartuigen in een zodanige staat zijn, dat daarmee veilig gevlogen en vervoerd
      kan worden;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.3
  - number: 1.3.b
    text: |-
      het boordpersoneel van de door haar geëxploiteerde luchtvaartuigen over voldoende kennis, bedrevenheid en ervaring
      beschikt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.3
  - number: 1.3.c
    text: |-
      al datgene wordt gedaan, wat in haar vermogen ligt om ernstige lichamelijke of geestelijke vermoeidheid van de
      leden van het boordpersoneel bij de bediening van luchtvaartuigen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.3
  - number: '1.4'
    text: |-
      Voor zover Onze Minister van Infrastructuur en Milieu onderscheidenlijk Onze Minister van Defensie, beslissingen
      neemt ingevolge bij of krachtens deze wet verleende bevoegdheden, die mede betrekking hebben op de militaire
      luchtvaart onderscheidenlijk de burgerluchtvaart handelt hij in overeenstemming met Onze Minister van Defensie
      onderscheidenlijk Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.4
  - number: '1.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen regels gesteld worden ter
      uitvoering van hetgeen bij of krachtens de basisverordening is bepaald.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.5
  - number: '1.6'
    text: |-
      Het is verboden in strijd te handelen met bij ministeriële regeling aangewezen voorschriften van hetgeen bij of
      krachtens de basisverordening is bepaald.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.6
  - number: 1.7.1
    text: |-
      De kosten die samenhangen met het in behandeling nemen van de aanvraag, afgifte, wijziging, beperking, schorsing,
      intrekking, verlenging en vernieuwing van bewijzen van bevoegdheid, verklaringen, certificaten en overige
      documenten die bij of krachtens de basisverordening worden afgegeven, worden ten laste gebracht van de aanvrager
      van het document.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.7
  - number: 1.7.2
    text: De bedragen ter vergoeding van de kosten, bedoeld in het eerste lid, worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel1.7
  - number: 2.1.1
    text: |-
      Het is verboden een luchtvaartuig te bedienen, luchtverkeersdiensten te verlenen, luchthaveninformatie
      te verstrekken of een grondstation of een mobiel station in de luchtvaartmobiele band, waarvoor
      een vergunning is vereist als bedoeld in [artikel 3.13 van de Telecommunicatiewet][ref1] of de
      [Wet telecommunicatievoorzieningen BES][ref2], te bedienen zonder het daarvoor geldige bewijs van bevoegdheid of
      geldige bewijs van gelijkstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028469
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028469
  - number: 2.1.2
    text: |-
      Voor het bedienen van een Nederlands burgerluchtvaartuig, het verlenen van luchtverkeersdiensten, het verstrekken
      van luchthaveninformatie of het bedienen van een grondstation of een mobiel station als bedoeld in het eerste lid
      is het bezit vereist van hetzij:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
  - number: 2.1.2.a
    text: een door Onze Minister van Infrastructuur en Milieu afgegeven bewijs van bevoegdheid of bewijs van gelijkstelling,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
  - number: 2.1.2.b
    text: |-
      een bewijs van bevoegdheid of bewijs van gelijkstelling, afgegeven door de bevoegde autoriteit van een door Onze
      Minister van Infrastructuur en Milieu op grond van [artikel 2.8][ref1] aangewezen staat of door een door hem
      aangewezen internationale organisatie. Betrokkene dient in geval van toepassing van onderdeel a tevens in het
      bezit te zijn van een geldige medische verklaring, bedoeld in [artikel 2.4][ref2], afgegeven door Onze Minister van
      Infrastructuur en Milieu dan wel door de bevoegde autoriteit van een door hem aangewezen staat, hetzij


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.2.c
    text: |-
      een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 2.1.3
    text: |-
      Bij algemene maatregel van bestuur kunnen andere werkzaamheden aan boord van een burgerluchtvaartuig worden
      aangewezen, die niet mogen worden verricht zonder een door Onze Minister van Infrastructuur en Milieu afgegeven
      bewijs van bevoegdheid, bewijs van gelijkstelling of een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '5'
  - number: 2.1.4
    text: |-
      Onze Minister van Infrastructuur en Milieu kan ontheffing verlenen van het bepaalde bij of krachtens dit artikel,
      wanneer door bijzondere omstandigheden die regels in redelijkheid geen toepassing kunnen vinden en de veiligheid
      van het luchtverkeer met het verlenen van de ontheffing niet in gevaar wordt gebracht. Aan de ontheffing kunnen
      voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
  - number: 2.1.5
    text: Onze Minister van Infrastructuur en Milieu trekt de door hem verleende ontheffing in, wanneer
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
  - number: 2.1.5.a
    text: de redenen, waarom de ontheffing is verleend, zijn komen te vervallen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
  - number: 2.1.5.b
    text: de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
  - number: 2.1.6
    text: Het is verboden te handelen in strijd met een voorschrift als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
  - number: 2.1.7
    text: |-
      Voor zover het eerste lid betrekking heeft op het bedienen van een grondstation of een mobiel station als bedoeld
      in dat lid, is het onverminderd [artikel 1.2, eerste lid][ref1], eveneens van toepassing op het continentaal plat,
      bedoeld in [artikel 1 van de Mijnbouwwet][ref2], voor zover dat buiten het vluchtinformatiegebied Amsterdam ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 2.1a
    text: |-
      Onverminderd de [Algemene wet erkenning EU-beroepskwalificaties][ref1] is hoofdstuk 2 van overeenkomstige
      toepassing op de erkenning van beroepskwalificaties als bedoeld in die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.1a
    references:
      - id: ref1
        bwb_id: BWBR0023066
  - number: 2.2.1
    text: |-
      Onze Minister van Infrastructuur en Milieu geeft op aanvraag een bewijs van bevoegdheid af, wanneer degene, die het
      bewijs van bevoegdheid heeft aangevraagd:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.2.1.a
    text: beschikt over een geldige medische verklaring;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.2.1.b
    text: |-
      beschikt over voldoende kennis, bedrevenheid en ervaring met betrekking tot het bewijs van bevoegdheid dat hij
      heeft aangevraagd; en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.2.1.c
    text: |-
      daartoe voldoende onderricht heeft genoten aan een door Onze Minister van Infrastructuur en Milieu of door de
      bevoegde autoriteit van een door hem aangewezen staat:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.2.1.c.1°
    text: goedgekeurde of geregistreerde opleidingsinstelling, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.2.1.c.2°
    text: |-
      gecertificeerde opleidingsinstelling indien degene die het bewijs van bevoegdheid heeft aangevraagd een bewijs van
      bevoegdheid voor het verlenen van luchtverkeersdiensten heeft aangevraagd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Onze Minister van Infrastructuur en Milieu geeft op aanvraag op het bewijs van bevoegdheid een of meer
      bevoegdverklaringen weer. Het eerste lid is van overeenkomstige toepassing behoudens ter zake van de medische
      verklaring.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.2.3
    text: |-
      Bij algemene maatregel van bestuur wordt aangegeven welke bewijzen van bevoegdheid Onze Minister van Infrastructuur
      en Milieu kan afgeven en welke bevoegdverklaringen Onze Minister van Infrastructuur en Milieu daarop kan weergeven;
      in die algemene maatregel worden voor elk bewijs van bevoegdheid en voor elke algemene bevoegdverklaring de
      bevoegdheden en eventueel aan de bevoegdverklaring te verbinden beperkingen aangegeven. Bij of krachtens algemene
      maatregel van bestuur kan worden aangegeven welke bijzondere bevoegdverklaringen en voor welke termijn Onze
      Minister van Infrastructuur en Milieu op het bewijs van bevoegdheid kan weergeven en welke beperkingen daaraan
      kunnen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.2.4
    text: |-
      Bij ministeriële regeling kan Onze Minister van Infrastructuur en Milieu met betrekking tot het model en
      de uitvoering van het document, waarop een bewijs van bevoegdheid en een of meer bevoegdverklaringen worden
      weergegeven, eisen vaststellen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.2.5
    text: |-
      Onze Minister van Infrastructuur en Milieu houdt van de door hem afgegeven bewijzen van bevoegdheid een register
      bij. In het belang van een goede uitvoering en handhaving van deze wet en de daarop berustende bepalingen verwerkt
      Onze Minister van Infrastructuur en Milieu in het register gegevens omtrent afgegeven bewijzen van bevoegdheid en
      bewijzen van gelijkstelling, rechterlijke uitspraken houdende ontzegging van de bevoegdheid een luchtvaartuig te
      bedienen, luchtverkeersdiensten te verlenen, luchthaveninformatie te verstrekken of een grondstation of een mobiel
      station als bedoeld in [artikel 2.1, eerste lid][ref1], te bedienen en persoonsgegevens betreffende de gezondheid
      van houders van een bewijs van bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.6
    text: |-
      Het derde lid is niet van toepassing op bewijzen van bevoegdheid voor het verlenen van luchtverkeersdiensten
      of het verstrekken van luchthaveninformatie. Bij algemene maatregel van bestuur wordt aangegeven welke bewijzen
      van bevoegdheid voor het verlenen van luchtverkeersdiensten of het verstrekken van luchthaveninformatie Onze
      Minister van Infrastructuur en Milieu kan afgeven en welke bevoegdverklaringen Onze Minister op die bewijzen van
      bevoegdheid kan weergeven. Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gesteld
      aan de bewijzen van bevoegdheid, bevoegdverklaringen en daaraan te verbinden machtigingen voor het verlenen van
      luchtverkeersdiensten of het verstrekken van luchthaveninformatie.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.2.7
    text: |-
      Het eerste lid, onderdeel c, onder 2°, is niet van toepassing op degene die zijn taken uitoefent onder de
      verantwoordelijkheid van verleners van luchtvaartnavigatiediensten die deze diensten voornamelijk aanbieden aan
      andere bewegingen van luchtvaartuigen dan aan het algemeen luchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.2.8
    text: |-
      Onder algemeen luchtverkeer als bedoeld in het zevende lid wordt verstaan: alle bewegingen van
      burgerluchtvaartuigen, alsmede alle bewegingen van staatsluchtvaartuigen, met inbegrip van militaire, douane- en
      politieluchtvaartuigen, voorzover deze bewegingen worden uitgevoerd in overeenstemming met de procedures van het op
      7 december 1944 te Chicago tot stand gekomen verdrag inzake de internationale burgerluchtvaart (Trb. 1973, 109).
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Een bewijs van bevoegdheid wordt afgegeven voor onbepaalde tijd dan wel voor een bij algemene maatregel van bestuur
      vast te stellen termijn, welke termijn voor de verschillende bewijzen van bevoegdheid verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Indien een bewijs van bevoegdheid voor onbepaalde tijd is verleend, is dit bewijs slechts geldig indien daarop ten
      minste één geldige bevoegdverklaring is weergegeven en voor de bij algemene maatregel van bestuur vast te stellen
      termijn waarvoor die bevoegdverklaring is afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Indien een bewijs van bevoegdheid voor bepaalde tijd is verleend, verlengt Onze Minister van Infrastructuur
      en Milieu op aanvraag het bewijs van bevoegdheid, indien de houder daarvan beschikt over voldoende kennis,
      bedrevenheid en ervaring met betrekking tot dat bewijs van bevoegdheid; het bewijs van bevoegdheid wordt voor de
      krachtens het eerste lid vastgestelde termijn verlengd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Onze Minister van Infrastructuur en Milieu geeft op aanvraag een bevoegdverklaring af en verlengt deze, indien
      de houder daarvan beschikt over voldoende bedrevenheid en ervaring met betrekking tot die bevoegdverklaring. De
      bevoegdverklaring wordt voor de krachtens het tweede lid vastgestelde termijn verlengd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.5
    text: |-
      Bij algemene maatregel van bestuur kan worden voorgeschreven, dat de houder van een in die algemene maatregel aan
      te geven bewijs van bevoegdheid of bevoegdverklaring bij het bereiken van een in die algemene maatregel bepaalde
      leeftijd daarin aan te geven bevoegdheden:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.5.a
    text: niet meer mag uitoefenen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.5.b
    text: slechts onder in die algemene maatregel bepaalde voorwaarden mag uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot [artikel 2.2][ref1]
      en dit artikel. Deze regels bevatten in ieder geval bepalingen betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.6.a
    text: de aanvraag en afgifte van bewijzen van bevoegdheid en de aanvraag, afgifte en verlenging van bevoegdverklaringen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.6.b
    text: |-
      de leeftijd, die een aanvrager ten minste moet hebben om voor een bewijs van bevoegdheid in aanmerking te kunnen
      komen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.6.c
    text: |-
      de eisen, waaraan de aanvrager van een bewijs van bevoegdheid of bevoegdverklaring of van de verlenging daarvan
      moet voldoen alsmede de wijze, waarop hij kan doen blijken, dat hij aan die eisen voldoet;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.6.d
    text: de te houden examens;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.6.e
    text: |-
      de eisen, waaraan examinatoren moeten voldoen, alsmede de eisen waaraan examinatoren moeten voldoen teneinde een
      autorisatie te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.6.f
    text: aan STD's te stellen eisen voor kwalificatie;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.6.g
    text: de vernieuwing van het document, waarop bewijzen van bevoegdheid en bevoegdverklaringen worden weergegeven;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.6.h
    text: |-
      de vergoeding, die de aanvrager is verschuldigd voor de kosten van de handelingen ten behoeve van de aanvraag tot
      afgifte van het bewijs van bevoegdheid, een bevoegdverklaring of het bewijs van gelijkstelling, de verlenging van
      een bewijs van bevoegdheid of verlenging een bevoegdverklaring, het afleggen van een theorie- of praktijkexamen,
      de vernieuwing van het document, bedoeld in onderdeel g, de afgifte van de autorisatie, bedoeld in onderdeel e,
      de afgifte en verlenging van de medische verklaring, bedoeld in [artikel 2.2, eerste lid][ref1], en de afgifte en
      verlenging van de kwalificatie, bedoeld in onderdeel f.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.7
    text: |-
      Bij het besluit van Onze Minister van Infrastructuur en Milieu, bedoeld in het zesde lid, onderdeel e, kunnen
      in aanmerking genomen worden het aantal reeds geautoriseerde examinatoren, hun specifieke deskundigheid en de
      spreiding van examinatoren over het land in relatie tot de regionale of plaatselijke behoefte.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
  - number: 2.3.8
    text: |-
      [Artikel 2.1, vierde tot en met zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.1
    text: |-
      Onze Minister van Infrastructuur en Milieu geeft op aanvraag de medische verklaring, bedoeld in
      [artikel 2.2][ref1], af, indien betrokkene voldoet aan de eisen van medische geschiktheid om de werkzaamheden te
      verrichten, waarvoor betrokkene een bewijs van bevoegdheid of bevoegdverklaring heeft aangevraagd of is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.2
    text: |-
      De medische verklaring wordt, al dan niet onder beperkingen, verleend voor een bij algemene maatregel van bestuur
      vast te stellen termijn. Onze Minister van Infrastructuur en Milieu verlengt op aanvraag de medische verklaring
      voor een bij algemene maatregel van bestuur vast te stellen termijn, indien de houder voldoet aan de in het eerste
      lid bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
  - number: 2.4.3
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
  - number: 2.4.3.a
    text: de eisen van medische geschiktheid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
  - number: 2.4.3.b
    text: de ten behoeve van de afgifte van een medische verklaring te verrichten medische keuring;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
  - number: 2.4.3.c
    text: de verplichtingen van de houder van de medische verklaring;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
  - number: 2.4.3.d
    text: de eisen waaraan een geneeskundige of geneeskundige instantie moet voldoen teneinde een autorisatie te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
  - number: 2.4.3.e
    text: |-
      de aanwijzing van instellingen die in het kader van een autorisatie als bedoeld in [onderdeel d][ref1] een
      certificaat kunnen afgeven;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.3.f
    text: de mogelijkheid van herbeoordeling;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
  - number: 2.4.3.g
    text: |-
      de vergoeding, die de aanvrager is verschuldigd voor de kosten van de handelingen ten behoeve van de aanvraag tot
      afgifte van de autorisatie, bedoeld in [onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven omtrent de beperkingen waaronder een
      medische verklaring kan worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
  - number: 2.4.5
    text: |-
      Onze Minister autoriseert geneeskundigen of geneeskundige instanties die met het verrichten van medische keuringen
      worden belast.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
  - number: 2.4.6
    text: |-
      Bij het besluit van Onze Minister van Infrastructuur en Milieu over de autorisatie kunnen in aanmerking worden
      genomen het aantal reeds geautoriseerde geneeskundigen of geneeskundige instanties, hun specialisme en de spreiding
      van de geautoriseerde geneeskundigen of geneeskundige instanties over het land in relatie tot de regionale of
      plaatselijke behoefte.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
  - number: 2.4.7
    text: |-
      De medische verklaring is ongeldig gedurende de periode dat de gezondheidstoestand van de houder zodanig is, dat
      deze niet meer in staat is de werkzaamheden, waarvoor hem een bewijs van bevoegdheid is verleend, te verrichten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.4
  - number: 2.5.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een bewijs van bevoegdheid dan wel een daarop weergegeven
      bevoegdverklaring schorsen wanneer een ernstig vermoeden rijst, dat de houder van het bewijs van bevoegdheid:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
  - number: 2.5.1.a
    text: |-
      niet over voldoende kennis of bedrevenheid beschikt met betrekking tot dat bewijs van bevoegdheid of die
      bevoegdverklaring;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
  - number: 2.5.1.b
    text: bij het verrichten van de hem toegestane werkzaamheden de veiligheid in gevaar kan brengen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
  - number: 2.5.1.c
    text: niet in het bezit is van een geldige medische verklaring.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Onze Minister van Infrastructuur en Milieu neemt het document waarop het geschorste bewijs van bevoegdheid of de
      geschorste bevoegdverklaring is weergegeven in. De houder van het betrokken bewijs van bevoegdheid is verplicht
      hieraan alle medewerking te verlenen. In geval van schorsing van een of meer bevoegdverklaringen verstrekt Onze
      Minister van Infrastructuur en Milieu een aan de schorsing aangepast document.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
  - number: 2.5.3
    text: |-
      Onze Minister van Infrastructuur en Milieu heft de schorsing op zodra de redenen, die tot de schorsing hebben
      geleid, zijn komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
  - number: 2.5.4
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
  - number: 2.5.4.a
    text: |-
      de wijze, waarop de houder van het betrokken bewijs van bevoegdheid opnieuw kan doen blijken over voldoende kennis
      of bedrevenheid met betrekking tot het geschorste bewijs van bevoegdheid of de geschorste bevoegdverklaring te
      beschikken;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
  - number: 2.5.4.b
    text: |-
      de wijze, waarop de houder van het betrokken bewijs van bevoegdheid kan doen blijken, dat hij bij het verrichten
      van de hem toegestane werkzaamheden de veiligheid niet in gevaar brengt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
  - number: 2.5.4.c
    text: |-
      de wijze waarop de houder van een autorisatie als bedoeld in [artikel 2.4, derde lid, onderdeel d][ref1], opnieuw
      kan doen blijken aan de bij of krachtens dat onderdeel bedoelde eisen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.5
    text: |-
      Onze Minister kan een autorisatie als bedoeld in [artikel 2.4, derde lid, onderdeel d][ref1], schorsen, wanneer een
      ernstig vermoeden rijst, dat de houder van de autorisatie niet langer voldoet aan de bij of krachtens dat onderdeel
      gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.6
    text: |-
      Het eerste tot en met vierde lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.3, zesde lid, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.7
    text: |-
      Het derde lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.4, derde lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.8
    text: |-
      Schorsing van het bewijs van bevoegdheid betekent schorsing van op het document weergegeven bevoegdverklaringen
      voor de duur van die schorsing.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
  - number: 2.5.9
    text: |-
      Bij ministeriële regeling kan Onze Minister van Infrastructuur en Milieu regels geven met betrekking tot de
      procedure van schorsing.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.5
  - number: 2.6.1
    text: 'Onze Minister van Infrastructuur en Milieu kan een bewijs van bevoegdheid of een bevoegdverklaring intrekken:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.6
  - number: 2.6.1.a
    text: op aanvraag van de houder;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.6
  - number: 2.6.1.b
    text: wanneer het bewijs van bevoegdheid of de daarop weergegeven bevoegdverklaring ten minste drie maanden is geschorst;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.6
  - number: 2.6.1.c
    text: |-
      wanneer gedurende een periode van ten minste zes maanden van het betrokken bewijs van bevoegdheid of de daarop
      weergegeven bevoegdverklaring geen gebruik is gemaakt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.6
  - number: 2.6.1.d
    text: |-
      wanneer bij de aanvraag of het verzoek om verlenging van het bewijs van bevoegdheid, de bevoegdverklaring of de
      medische verklaring onjuiste gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.6
  - number: 2.6.3
    text: |-
      Indien de houder van een bewijs van bevoegdheid of een of meer bevoegdverklaringen de bevoegdheid een luchtvaartuig
      te bedienen, luchtverkeersdiensten te verlenen, luchthaveninformatie te verstrekken of een grondstation of mobiel
      station als bedoeld in [artikel 2.1, eerste lid][ref1], te bedienen is ontzegd, dan wel zijn bewijs van bevoegdheid
      of een of meer bevoegdverklaringen zijn ingetrokken, is hij verplicht het document, waarop zijn bewijs van
      bevoegdheid en eventuele bevoegdverklaringen zijn weergegeven, onverwijld bij Onze Minister van Infrastructuur en
      Milieu in te leveren.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.4
    text: |-
      Het eerste en derde lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.3, zesde lid, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.5
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.4, derde lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.6
    text: |-
      Het eerste en derde lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.3, vijfde lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.7
    text: |-
      Bij ministeriële regeling kan Onze Minister van Infrastructuur en Milieu regels geven met betrekking tot de
      procedure van intrekking.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan op aanvraag een bewijs van gelijkstelling met een in een andere
      staat door een daar bevoegde autoriteit afgegeven bewijs van bevoegdheid afgeven. [Artikel 2.2, vierde lid][ref1],
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.7.2
    text: |-
      Het bewijs van gelijkstelling geeft niet meer bevoegdheden dan het betrokken bewijs van bevoegdheid en wordt
      slechts eenmaal afgegeven voor ten hoogste de duur van geldigheid van het betrokken bewijs van bevoegdheid doch
      niet langer dan een jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.7
  - number: 2.7.3
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een bewijs van gelijkstelling intrekken wanneer de omstandigheden,
      bedoeld in [artikel 2.6, eerste lid, onder c of d, of tweede lid][ref1] zich voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.7.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven over de voorwaarden en omstandigheden
      waaronder een bewijs van gelijkstelling wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.7
  - number: '2.8'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan op grond van internationale overeenkomsten of besluiten van
      volkenrechtelijke organisaties bewijzen van bevoegdheid, bewijzen van gelijkstelling of medische verklaringen,
      die op grond van eisen, welke gelijkwaardig zijn aan de krachtens [artikel 2.3, zesde lid, onderdeel c][ref1], of
      [artikel 2.4, derde lid][ref2], gestelde eisen, zijn afgegeven door:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.8.a
    text: de bevoegde autoriteit van een door hem bij ministeriële regeling aangewezen staat, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.8
  - number: 2.8.b
    text: een door hem bij ministeriële regeling aangewezen internationale organisatie
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een opleidingsinstelling ter verkrijging van een bewijs van
      bevoegdheid of bevoegdverklaring goedkeuren of registreren, indien die opleidingsinstelling voldoet aan bij of
      krachtens algemene maatregel van bestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.9
  - number: 2.9.2
    text: |-
      Onverminderd het eerste lid kan Onze Minister van Infrastructuur en Milieu een opleidingsinstelling ter verkrijging
      van een bewijs van bevoegdheid of bevoegdverklaring voor het verlenen van luchtverkeersdiensten certificeren indien
      die opleidingsinstelling voldoet aan bij of krachtens algemene maatregel van bestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.9
  - number: 2.9.3
    text: |-
      Onze Minister van Infrastructuur en Milieu kan de goedkeuring of registratie van een opleidingsinstelling geheel of
      deels intrekken, wanneer die opleidingsinstelling niet meer voldoet aan de eisen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.9
  - number: 2.9.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven met betrekking tot de vergoeding, die
      de aanvrager is verschuldigd voor de kosten van de handelingen ten behoeve van de aanvraag tot afgifte van de
      goedkeuring of registratie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.9
  - number: 2.9.5
    text: |-
      [Artikel 2.8][ref1] en het derde en vierde lid van onderhavig artikel zijn van overeenkomstige toepassing op het
      certificeren van een opleidingsinstelling als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.10.1
    text: |-
      De houder van een bewijs van bevoegdheid, dat de bevoegdheid geeft een luchtvaartuig te bedienen, en de leerling-
      vlieger dienen onder door Onze Minister van Infrastructuur en Milieu te stellen regelen een logboek bij te houden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.10
  - number: 2.10.2
    text: Het is verboden
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.10
  - number: 2.10.2.a
    text: |-
      in het logboek onjuiste gegevens of onjuiste aantekeningen op te nemen, te doen opnemen of toe te laten dat zij
      daarin worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.10
  - number: 2.10.2.b
    text: |-
      het logboek te beschadigen of te vernietigen, te doen beschadigen of vernietigen dan wel toe te laten, dat het
      wordt beschadigd of vernietigd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.10
  - number: '2.11'
    text: |-
      Het is de houder van een bewijs van bevoegdheid of bewijs van gelijkstelling verboden werkzaamheden, tot het
      verrichten waarvan dat bewijs de bevoegdheid geeft, te verrichten wanneer de houder daardoor in verband met zijn
      lichamelijke of geestelijke gesteldheid de veiligheid van het luchtverkeer in gevaar brengt of in gevaar kan
      brengen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.11
  - number: 2.12.1
    text: |-
      Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een luchtvaartuig te verrichten, terwijl
      hij verkeert onder zodanige invloed van een stof, waarvan hij weet of redelijkerwijze moet weten, dat het gebruik
      daarvan – al dan niet in combinatie met het gebruik van een andere stof – de vaardigheid voor het verrichten van
      die werkzaamheden kan verminderen, dat hij niet in staat moet worden geacht die werkzaamheden naar behoren te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.12
  - number: 2.12.2
    text: |-
      Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een luchtvaartuig te verrichten, indien
      hij binnen de tien daaraan voorafgaande uren alcoholhoudende drank heeft gebruikt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.12
  - number: 2.12.3
    text: |-
      Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een luchtvaartuig te verrichten na
      zodanig gebruik van alcoholhoudende drank, dat:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.12
  - number: 2.12.3.a
    text: |-
      het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan negentig microgram (90 µg) alcohol per
      liter uitgeademde lucht, dan wel
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.12
  - number: 2.12.3.b
    text: |-
      het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan eenvijfde milligram (0,2 mg) alcohol
      per milliliter bloed.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.12
  - number: 2.12.4
    text: |-
      Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een luchtvaartuig te verrichten gedurende
      de tijd, waarvoor een rijverbod als bedoeld in [artikel 162, eerste lid, van de Wegenverkeerswet 1994][ref1] geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel162
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '162'
  - number: 2.12.5
    text: |-
      Het is verboden een lid van het boordpersoneel van wie men weet of redelijkerwijs moet weten, dat deze verkeert
      in een toestand, als bedoeld in [artikel 2.11, eerste lid][ref1], of in het eerste of derde lid van dit artikel,
      werkzaamheden aan boord van een luchtvaartuig te doen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.12.6
    text: |-
      Het eerste, derde, vierde en vijfde lid zijn van overeenkomstige toepassing op eenieder die luchtverkeersdiensten
      verleent, luchthaveninformatie verstrekt of een grondstation of een mobiel station als bedoeld in
      [artikel 2.1, eerste lid][ref1], bedient.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.13'
    text: |-
      Aan de ambtenaren, die belast zijn met de handhaving van [artikel 2.12][ref1] worden uit het register, bedoeld
      in [artikel 126 van de Wegenverkeerswet 1994][ref2], op door de Dienst Wegverkeer te bepalen wijze de gegevens
      verstrekt, die zij voor de uitoefening van hun taak nodig hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '126'
  - number: 2.14.1
    text: Er is een Adviescommissie arbeidsomstandigheden boordpersoneel Nederlandse burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.14
  - number: 2.14.2
    text: |-
      De Adviescommissie heeft tot taak in het belang van de veiligheid in de burgerluchtvaart Onze Minister van
      Infrastructuur en Milieu desgevraagd of uit eigen beweging van advies te dienen over de uitvoering van het
      beleid en van de regelgeving met betrekking tot de arbeidsomstandigheden van het boordpersoneel van in Nederland
      geregistreerde burgerluchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.14
  - number: 2.14.3
    text: |-
      De Adviescommissie bestaat uit elf leden, die door Onze Minister van Infrastructuur en Milieu worden benoemd.
      Hiervan worden vier leden benoemd op voordracht van naar het oordeel van Onze Minister van Infrastructuur en
      Milieu representatieve organisaties van leden van het boordpersoneel, vier leden op voordracht van de betrokken
      luchtvaartmaatschappijen en drie leden als onafhankelijken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.14
  - number: 2.14.4
    text: Onze Minister van Infrastructuur en Milieu wijst uit de drie onafhankelijke leden de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.14
  - number: 2.14.5
    text: De leden worden voor een periode van vier jaren benoemd. Aftredende leden zijn terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.14
  - number: 2.14.6
    text: 'Onze Minister van Infrastructuur en Milieu verleent tussentijds ontslag aan een lid:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.14
  - number: 2.14.6.a
    text: wanneer deze zijn hoedanigheid verliest op grond waarvan hij is benoemd;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.14
  - number: 2.14.6.b
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.14
  - number: 2.14.6.c
    text: bij het bereiken van de zeventigjarige leeftijd;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.14
  - number: 2.14.6.d
    text: wegens ongeschiktheid voor de functie.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.14
  - number: 2.14.7
    text: |-
      De Adviescommissie stelt een reglement vast ter nadere regeling van haar werkzaamheden. Het reglement wordt ter
      kennisneming toegezonden aan Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel2.14
  - number: 3.1.1
    text: |-
      Het is verboden een luchtvaartuig te gebruiken, dat niet is voorzien van een geldig nationaliteits- en
      inschrijvingskenmerk en een geldig bewijs van inschrijving.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.1
  - number: 3.1.2
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.1
  - number: 3.1.2.a
    text: op een luchtvaartuig een ander dan het in het eerste lid bedoelde kenmerk aan te brengen, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.1
  - number: 3.1.2.b
    text: |-
      een luchtvaartuig te gebruiken dan wel te doen of te laten gebruiken, dat is voorzien van een ander dan het in
      het eerste lid bedoelde kenmerk, met het oogmerk het te doen voorkomen, dat het luchtvaartuig is voorzien van een
      geldig kenmerk.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.1
  - number: 3.2.1
    text: 'De houder van een Nederlands luchtvaartuig voorziet het luchtvaartuig van:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.2
  - number: 3.2.1.a
    text: |-
      een door Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie vastgesteld
      nationaliteitskenmerk en een voor dat luchtvaartuig vastgesteld inschrijvingskenmerk; en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.2
  - number: 3.2.1.b
    text: |-
      een bewijs van inschrijving in het register, bedoeld in [artikel 3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2.2
    text: |-
      De kenmerken, bedoeld in het eerste lid, bestaan voor burgerluchtvaartuigen uit letters of cijfers of een
      combinatie van beide; zij worden op bij ministeriële regeling nader aan te geven plaats, wijze en uitvoering op het
      desbetreffende luchtvaartuig aangebracht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.2
  - number: 3.2.3
    text: |-
      Voor militaire luchtvaartuigen bestaat het nationaliteitskenmerk uit een afbeelding en het inschrijvingskenmerk uit
      letters of cijfers of een combinatie van beide; zij worden op bij ministeriële regeling nader aan te geven plaats,
      wijze en uitvoering op het desbetreffende luchtvaartuig aangebracht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.2
  - number: 3.2.4
    text: |-
      Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kan voor luchtvaartuigen, die
      naar zijn oordeel van historische waarde zijn, kenmerken toestaan, die van het eerste lid, onderdeel a, afwijken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie houdt een register bij
      van Nederlandse burgerluchtvaartuigen respectievelijk Nederlandse militaire luchtvaartuigen. Het register voor
      burgerluchtvaartuigen is openbaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.3
  - number: 3.3.2
    text: |-
      In het register voor burgerluchtvaartuigen worden op aanvraag op naam van de aanvrager burgerluchtvaartuigen
      ingeschreven, wanneer zowel de aanvrager als de in te schrijven burgerluchtvaartuigen voldoen aan bij algemene
      maatregel van bestuur gestelde eisen. De inschrijving geschiedt voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.3
  - number: 3.3.3
    text: |-
      In afwijking van het tweede lid kan Onze Minister van Infrastructuur en Milieu een luchtvaartuig tijdelijk
      inschrijven:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.3
  - number: 3.3.3.a
    text: |-
      indien het desbetreffende luchtvaartuig slechts voor een bepaalde termijn aan de houder ter beschikking is gesteld,
      voor ten hoogste die bepaalde termijn; of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.3
  - number: 3.3.3.b
    text: |-
      in afwachting van het voldoen aan de eisen, bedoeld in het tweede lid, voor ten hoogste zes maanden, welke termijn
      eenmaal voor ten hoogste dezelfde periode kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.3
  - number: 3.3.4
    text: In het buitenland geregistreerde burgerluchtvaartuigen worden niet in het register ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.3
  - number: 3.3.5
    text: |-
      Bij ministeriële regeling kan Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie
      regels geven inzake de in het register op te nemen gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan op aanvraag van de houder van een burgerluchtvaartuig de
      inschrijving wijzigen, nadat de houder de nodige gegevens heeft verstrekt en het bewijs van inschrijving, bedoeld
      in [artikel 3.5][ref1], bij Onze Minister van Infrastructuur en Milieu heeft ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.2
    text: 'Onze Minister van Infrastructuur en Milieu kan een inschrijving ambtshalve wijzigen, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
  - number: 3.4.2.a
    text: onjuiste gegevens zijn verstrekt, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
  - number: 3.4.2.b
    text: de feiten die ten grondslag liggen aan de gegevens, tijdens de duur van de inschrijving wijziging hebben ondergaan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Onze Minister van Infrastructuur en Milieu haalt op aanvraag van de houder van een burgerluchtvaartuig de
      inschrijving door, nadat de houder de nodige gegevens heeft verstrekt en het bewijs van inschrijving, bedoeld in
      [artikel 3.5][ref1], bij Onze Minister van Infrastructuur en Milieu heeft ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.4
    text: 'Onze Minister van Infrastructuur en Milieu kan een inschrijving ambtshalve doorhalen, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
  - number: 3.4.4.a
    text: de houder ten behoeve van de inschrijving onjuiste gegevens heeft verstrekt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
  - number: 3.4.4.b
    text: |-
      de houder niet meer voldoet aan de eisen, bedoeld in [artikel 3.3, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.4.c
    text: |-
      gedurende langer dan een jaar het desbetreffende luchtvaartuig niet voorzien is van een geldig bewijs van
      luchtwaardigheid als bedoeld in [artikel 3.8, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.4.5
    text: |-
      Onze Minister van Infrastructuur en Milieu haalt een inschrijving ambtshalve door, wanneer het betrokken
      luchtvaartuig:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
  - number: 3.4.5.a
    text: in het buitenland is geregistreerd, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
  - number: 3.4.5.b
    text: definitief niet meer aan het luchtverkeer deelneemt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Ten bewijze van inschrijving in het register, bedoeld in [artikel 3.3][ref1], verstrekt Onze Minister van
      Infrastructuur en Milieu respectievelijk Onze Minister van Defensie met betrekking tot het ingeschreven
      luchtvaartuig een bewijs van inschrijving. Onze Minister wie het aangaat kan een inschrijvingsbewijs wijzigen. Het
      bewijs wordt verstrekt voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.2
    text: |-
      In geval van toepassing van [artikel 3.3, derde lid][ref1], verstrekt Onze Minister van Infrastructuur en Milieu
      een bewijs van inschrijving voor de termijn, waarvoor het betrokken luchtvaartuig is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.3
    text: 'In geval van:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.5
  - number: 3.5.3.a
    text: |-
      wijziging van de inschrijving, bedoeld in [artikel 3.4, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.3.b
    text: |-
      doorhaling van de inschrijving, bedoeld in [artikel 3.4, derde lid][ref1], kan Onze Minister van Infrastructuur en
      Milieu aan de aanvrager een tijdelijk bewijs van inschrijving ver trekken voor ten hoogste vier weken. Wijziging
      of doorhaling van de inschrijving vindt plaats na verstrijken van de termijn, waarvoor het tijdelijk bewijs van
      inschrijving is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.4
    text: |-
      In geval van ambtshalve wijziging of doorhaling van de inschrijving, bedoeld in [artikel 3.4][ref1], tweede
      respectievelijk vierde of vijfde lid, levert de houder van het bewijs van inschrijving dit bewijs terstond in bij
      Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.5
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kunnen met
      betrekking tot het model en de uitvoering van het bewijs van inschrijving eisen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.5
  - number: '3.6'
    text: |-
      Voor luchtvaartuigen, die behoren tot de bedrijfsvoorraad van een natuurlijke of rechtspersoon aan wie een
      erkenning als bedoeld in [artikel 3.25][ref1] is verleend, geldt het vereiste, dat een inschrijvingskenmerk
      voor een bepaald luchtvaartuig is vastgesteld, niet, mits het betrokken luchtvaartuig een inschrijvingskenmerk
      voert, dat door Onze Minister van Infrastructuur en Milieu aan die natuurlijke of rechtspersoon met het oog op de
      bedrijfsvoorraad is opgegeven. Artikel 3.2, tweede lid, is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: '3.7'
    text: |-
      Ten aanzien van burgerluchtvaartuigen worden bij of krachtens algemene maatregel van bestuur nadere regels
      gegeven ter uitvoering van [de artikelen 3.4][ref1] en [3.5][ref2]. Deze regels bevatten in ieder geval bepalingen
      betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.7.a
    text: |-
      de procedure van aanvraag, wijziging of doorhaling van een inschrijving, alsmede de gegevens, welke bij elke
      procedure dienen te worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.7
  - number: 3.7.b
    text: de vernieuwing van het inschrijvingsbewijs, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.7
  - number: 3.7.c
    text: |-
      de vergoeding, die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om inschrijving
      en om wijziging of doorhaling van de inschrijving alsmede voor afgifte en vernieuwing van een bewijs van
      inschrijving.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.7
  - number: 3.8.1
    text: 'Het is verboden een vlucht uit te voeren met een luchtvaartuig, dat:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.8
  - number: 3.8.1.a
    text: niet luchtwaardig is, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.8
  - number: 3.8.1.b
    text: niet voorzien is van een geldig bewijs van luchtwaardigheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.8
  - number: 3.8.2
    text: |-
      Voor het uitvoeren van een vlucht met een Nederlands luchtvaartuig is een door Onze Minister van Infrastructuur en
      Milieu respectievelijk Onze Minister van Defensie afgegeven bewijs van luchtwaardigheid vereist.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.8
  - number: 3.9.1
    text: |-
      Onze Minister van Defensie geeft met betrekking tot een type-ontwerp van een militair luchtvaartuig dan wel van een
      voortstuwingsinrichting of propeller bestemd voor een militair luchtvaartuig, een type-certificaat af, indien wordt
      voldaan aan de bij regeling van Onze Minister van Defensie gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.9
  - number: 3.9.2
    text: Een type-certificaat wordt afgegeven voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.9
  - number: 3.9.3
    text: |-
      Het type-certificaat geldt ten aanzien van alle militaire luchtvaartuigen, voortstuwingsinrichtingen of propellers
      bestemd voor een militair luchtvaartuig, die conform het onderzochte type-ontwerp zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.9
  - number: 3.9.4
    text: |-
      Onze Minister van Defensie wijzigt een type-certificaat, wanneer voldaan wordt aan de bij regeling van Onze
      Minister van Defensie gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.9
  - number: 3.9.5
    text: |-
      Onze Minister van Defensie kan een aanvullend type-certificaat afgeven. Het eerste tot en met vierde lid zijn van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.9
  - number: 3.12.1
    text: |-
      Onze Minister van Defensie kan een typecertificaat of aanvullend type-certificaat schorsen, wanneer een ernstig
      vermoeden rijst, dat met betrekking tot de luchtvaartuigen dan wel voortstuwingsinrichtingen of propellers waarvoor
      dat type-certificaat of aanvullend typecertificaat is afgegeven, niet aan de bij regeling van Onze Minister van
      Defensie gestelde eisen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.12
  - number: 3.12.2
    text: Onze Minister van Defensie heft de schorsing op zodra de redenen van de schorsing zijn komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.12
  - number: 3.12.3
    text: |-
      Onze Minister van Defensie kan een typecertificaat of aanvullend type-certificaat intrekken, wanneer de
      luchtvaartuigen dan wel voortstuwingsinrichtingen of propellers met betrekking waartoe dat type-certificaat is
      afgegeven, niet aan daarvoor bij regeling van Onze Minister van Defensie gestelde eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.12
  - number: 3.13.1
    text: |-
      Bij algemene maatregel van bestuur wordt aangegeven welke bewijzen van luchtwaardigheid Onze Minister van
      Infrastructuur en Milieu kan afgeven, alsmede de verplichtingen en de bevoegdheden, welke aan ieder bewijs
      verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.13
  - number: 3.13.2
    text: |-
      In de algemene maatregel van bestuur, bedoeld in het eerste lid, kan worden aangegeven in welke gevallen aan de
      houder van een luchtvaartuig, waarvoor EASA geen type-certificaat of aanvullend type-certificaat heeft afgegeven,
      Onze Minister van Infrastructuur en Milieu een type-certificaat, aanvullend type-certificaat dan wel een bewijs van
      luchtwaardigheid kan afgeven of wijzigen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.13
  - number: 3.13.3
    text: |-
      Aan een bewijs van luchtwaardigheid kunnen voorschriften of beperkingen worden verbonden. Het is verboden in strijd
      met die voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.13
  - number: 3.13.4
    text: |-
      Onze Minister van Verkeer en Waterstaat kan met betrekking tot een luchtvaartuig, dat naar zijn oordeel van
      historische waarde is en niet voldoet aan de eisen van EASA, een bewijs van luchtwaardigheid afgeven, mits het
      betrokken luchtvaartuig voldoet aan de bij regeling van Onze Minister van Verkeer en Waterstaat met betrekking tot
      de luchtwaardigheid van dat luchtvaartuig gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.13
  - number: 3.14.1
    text: |-
      Onze Minister van Defensie geeft met betrekking tot Nederlandse militaire luchtvaartuigen bewijzen van
      luchtwaardigheid af, indien:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.14
  - number: 3.14.1.a
    text: |-
      ten aanzien van het betrokken type-ontwerp een typecertificaat is afgegeven als bedoeld in
      [artikel 3.9, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.14.1.b
    text: |-
      het betrokken luchtvaartuig voldoet aan de bij ministeriële regeling gestelde eisen; deze eisen kunnen voor
      verschillende categorieën luchtvaartuigen verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Bij ministeriële regeling wordt aangegeven welke bewijzen van luchtwaardigheid Onze Minister van Defensie kan
      afgeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.14
  - number: 3.14.3
    text: |-
      In afwijking van het eerste lid, onder a, wordt in de ministeriële regeling, bedoeld in het tweede lid, aangegeven
      in welke gevallen met betrekking tot een militair luchtvaartuig, waarvoor geen type-certificaat is afgegeven, door
      Onze Minister van Defensie een bewijs van luchtwaardigheid kan worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.14
  - number: 3.14.4
    text: |-
      Aan een bewijs van luchtwaardigheid kunnen voorschriften of beperkingen worden verbonden. Het is verboden in strijd
      met die voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.14
  - number: 3.14.5
    text: |-
      Onze Minister van Defensie kan met betrekking tot een luchtvaartuig, dat naar zijn oordeel van historische waarde
      is en niet voldoet aan een van de eisen, bedoeld in het eerste lid, een bewijs als bedoeld in het tweede lid
      afgeven. Het betrokken luchtvaartuig dient te voldoen aan door Onze Minister van Defensie met betrekking tot de
      luchtwaardigheid van dat luchtvaartuig gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Het bewijs van luchtwaardigheid voor burgerluchtvaartuigen wordt afgegeven voor onbepaalde tijd dan wel voor
      een bij algemene maatregel van bestuur vast te stellen termijn, welke voor de verschillende bewijzen van
      luchtwaardigheid verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.15
  - number: 3.15.2
    text: |-
      Op aanvraag van de houder verlengt Onze Minister van Infrastructuur en Milieu het bewijs van luchtwaardigheid voor
      een burgerluchtvaartuig, indien wordt voldaan aan de bij of krachtens [artikel 3.13][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.15.3
    text: Het bewijs van luchtwaardigheid voor militaire luchtvaartuigen wordt afgegeven voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.15
  - number: 3.16.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan op aanvraag van de houder een bewijs van luchtwaardigheid voor een
      burgerluchtvaartuig wijzigen, nadat hij het bewijs van luchtwaardigheid bij Onze Minister van Infrastructuur en
      Milieu daartoe heeft ingeleverd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.16
  - number: 3.16.2
    text: |-
      Onze Minister van Infrastructuur en Milieu wijzigt een bewijs van luchtwaardigheid voor een burgerluchtvaartuig
      ambtshalve, indien aan het betrokken burgerlichtvaartuig veranderingen zijn aangebracht, die de gegevens als
      vermeld op het bewijs van luchtwaardigheid beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.16
  - number: 3.16.3
    text: |-
      In de gevallen, bedoeld in het tweede lid, levert de houder van het betrokken burgerluchtvaartuig op eerste
      vordering van Onze Minister van Infrastructuur en Milieu, terstond het betrokken bewijs «van luchtwaardigheid bij
      Onze Minister» van Verkeer en Waterstaat ter wijziging in.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.16
  - number: 3.17.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een bewijs van luchtwaardigheid voor een burgerluchtvaartuig
      schorsen, wanneer:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.17.1.a
    text: een ernstig vermoeden rijst dat het betrokken luchtvaartuig niet lichtwaardig is;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.17.1.b
    text: |-
      het desbetreffende luchtvaartuig niet meer in het register, bedoeld in [artikel 3.3][ref1], is ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.17.1.c
    text: |-
      de houder van het betrokken luchtvaartuig dat luchtvaartuig niet overeenkomstig bij of krachtens algemene maatregel
      van bestuur gestelde eisen onderhoudt of laat onderhouden, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.17.1.d
    text: de houder van het betrokken luchtvaartuig anderszins het bij of krachtens dit hoofdstuk bepaalde niet nakomt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.17.2
    text: |-
      Onze Minister van Infrastructuur en Milieu heft de schorsing op zodra de redenen van de schorsing zijn komen te
      vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.17.3
    text: |-
      Onze Minister van Infrastructuur en Milieu trekt een bewijs van luchtwaardigheid voor een burgerluchtvaartuig
      ambtshalve in, wanneer:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.17.3.a
    text: het type-certificaat met betrekking tot dat luchtvaartuig is ingetrokken;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.17.3.b
    text: ter verkrijging van het bewijs van luchtwaardigheid onjuiste gegevens zijn verstrekt, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.17.3.c
    text: het betrokken luchtvaartuig onherstelbaar is beschadigd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.17.4
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een bewijs van luchtwaardigheid voor een burgerluchtvaartuig
      intrekken, wanneer:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.17.4.a
    text: het betrokken luchtvaartuig anders dan wegens onherstelbare beschadiging niet luchtwaardig is, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.17.4.b
    text: het bewijs van luchtwaardigheid gedurende ten minste drie maanden is geschorst.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.17
  - number: 3.18.1
    text: 'Onze Minister van Defensie kan een bewijs van luchtwaardigheid voor een militair luchtvaartuig schorsen, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.18
  - number: 3.18.1.a
    text: een ernstig vermoeden rijst dat het betrokken luchtvaartuig niet luchtwaardig is, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.18
  - number: 3.18.1.b
    text: het type-certificaat met betrekking tot dat luchtvaartuig is geschorst of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.18
  - number: 3.18.2
    text: Onze Minister van Defensie heft de schorsing op zodra de redenen van de schorsing zijn komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.18
  - number: 3.18.3
    text: |-
      Onze Minister van Defensie trekt een bewijs van luchtwaardigheid voor een militair luchtvaartuig in, wanneer het
      betrokken luchtvaartuig:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.18
  - number: 3.18.3.a
    text: onherstelbaar is beschadigd, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.18
  - number: 3.18.3.b
    text: definitief buiten gebruik wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.18
  - number: 3.18.4
    text: |-
      Onze Minister van Defensie kan een bewijs van luchtwaardigheid voor een militair luchtvaartuig intrekken, wanneer
      het betrokken luchtvaartuig anders dan wegens onherstelbare beschadiging niet luchtwaardig is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.18
  - number: 3.18.5
    text: Bij ministeriële regeling kunnen nadere regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.18
  - number: 3.19.1
    text: |-
      De houder van een burgerluchtvaartuig, waarvan het type-certificaat, het beperkt type-certificaat of het
      aanvullend type-certificaat afgegeven door de EASA is ingetrokken, dan wel het bewijs van luchtwaardigheid is
      geschorst of ingetrokken, levert op eerste vordering van Onze Minister van Infrastructuur en Milieu het bewijs van
      luchtwaardigheid van het betrokken luchtvaartuig, terstond in bij Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19
  - number: 3.19.2
    text: |-
      Wanneer de schorsing wordt opgeheven doet Onze Minister van Infrastructuur en Milieu het ingeleverde bewijs van
      luchtwaardigheid terstond wederom toekomen aan de houder van het betrokken luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19
  - number: 3.19a.1
    text: 'Het is verboden een vlucht uit te voeren met een burgerluchtvaartuig, dat:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19a
  - number: 3.19a.1.a
    text: niet voldoet aan de voor dat luchtvaartuig geldende geluidseisen, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19a
  - number: 3.19a.1.b
    text: |-
      niet is voorzien van een geldig voor dat luchtvaartuig afgegeven geluidscertificaat of van een passende verklaring
      in een ander document dat door de staat van registratie is goedgekeurd voor zover dit voor dat luchtvaartuig
      vereist is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19a
  - number: 3.19a.2
    text: |-
      Voor het uitvoeren van een vlucht met een Nederlands burgerluchtvaartuig dat is voorzien van een
      voortstuwingsinrichting is vereist een door Onze Minister van Infrastructuur en Milieu afgegeven (voorlopig)
      geluidscertificaat, (voorlopige) geluidsverklaring of (voorlopige) aanvullende geluidsverklaring.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19a
  - number: 3.19a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt aangegeven in welke gevallen aan de houder van een
      burgerluchtvaartuig, waarvoor geen type-certificaat is afgegeven, door Onze Minister van Infrastructuur en Milieu
      een geluidscertificaat kan worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19a
  - number: 3.19a.4
    text: |-
      Een geluidscertificaat wordt afgegeven voor onbepaalde tijd. Vooruitlopend op de afgifte van een geluidscertificaat
      kan een voorlopig geluidscertificaat worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19a
  - number: 3.19a.5
    text: |-
      Aan een geluidscertificaat dan wel een voorlopig geluidscertificaat kunnen voorschriften of beperkingen worden
      verbonden in verband met het onderhoud of het gebruik van het luchtvaartuig. Het is verboden in strijd met die
      voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19a
  - number: 3.19a.6
    text: |-
      Onze Minister van Infrastructuur en Milieu kan met betrekking tot een luchtvaartuig, dat naar zijn oordeel van
      historische waarde is, geluidseisen stellen die afwijken van de door EASA vastgestelde geluidseisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19a
  - number: 3.19c.1
    text: |-
      Onze Minister van Infrastructuur en Milieu geeft op aanvraag aan de houder van een burgerluchtvaartuig dat is
      voorzien van een voortstuwingsinrichting, waarvoor geen geluidseisen gelden, en dat in Nederland is ingeschreven,
      een geluidsverklaring af. Op deze verklaring wordt vermeld dat voor het betrokken luchtvaartuig geen geluidseisen
      gelden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19c
  - number: 3.19c.2
    text: |-
      Onze Minister van Infrastructuur en Milieu kan op aanvraag aan de houder van een burgerluchtvaartuig een
      geluidsverklaring afgeven omtrent geluidsniveaus bepaald op andere wijze dan ingevolge de geldende eisen. Op deze
      verklaring wordt vermeld dat voor het betreffende luchtvaartuig een geluidscertificaat is afgegeven alsmede de
      wijze waarop van de voorschriften ingevolge de geldende eisen is afgeweken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19c
  - number: 3.19c.3
    text: |-
      De geluidsverklaring wordt afgegeven voor onbepaalde tijd. Vooruitlopend op de afgifte van een geluidsverklaring
      respectievelijk een aanvullende geluidsverklaring, als bedoeld in de voorgaande leden, kan een voorlopige
      geluidsverklaring respectievelijk een voorlopige aanvullende geluidsverklaring worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19c
  - number: 3.19c.4
    text: |-
      Aan een (voorlopige) geluidsverklaring en een (voorlopige) aanvullende geluidsverklaring kunnen voorschriften of
      beperkingen met betrekking tot het onderhoud of het gebruik van het luchtvaartuig worden verbonden. Het is verboden
      in strijd met die voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19c
  - number: 3.19d.1
    text: |-
      Onze Minister van Infrastructuur en Milieu wijzigt op aanvraag van de houder een geluidscertificaat voor een
      burgerluchtvaartuig, nadat de houder een wijziging aan het luchtvaartuig heeft uitgevoerd, indien:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19d
  - number: 3.19d.1.a
    text: het luchtvaartuig na de wijziging aan de geluidseisen blijft voldoen, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19d
  - number: 3.19d.1.b
    text: de houder het geluidscertificaat daartoe bij Onze Minister van Infrastructuur en Milieu heeft ingeleverd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19d
  - number: 3.19d.2
    text: 'Onze Minister van Infrastructuur en Milieu kan een geluidscertificaat ambtshalve wijzigen wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19d
  - number: 3.19d.2.a
    text: onjuiste of onvolledige gegevens zijn verwerkt of verstrekt, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19d
  - number: 3.19d.2.b
    text: gegevens op het certificaat wijziging hebben ondergaan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19d
  - number: 3.19d.3
    text: Het eerste en tweede lid zijn van overeenkomstige toepassing op de wijziging van een geluidsverklaring.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19d
  - number: 3.19e.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een (voorlopig) geluidscertificaat voor een burgerluchtvaartuig
      vernieuwen, indien het verloren is gegaan, beschadigd of anderszins onbruikbaar is geworden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19e
  - number: 3.19e.2
    text: |-
      Indien een (voorlopig) geluidscertificaat wegens verlies is vernieuwd en het certificaat wordt teruggevonden,
      levert de houder van het betrokken luchtvaartuig het teruggevonden (voorlopige) certificaat binnen acht dagen bij
      Onze Minister van Infrastructuur en Milieu in.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19e
  - number: 3.19e.3
    text: |-
      Indien een (voorlopig) geluidscertificaat anders dan wegens verlies is vernieuwd, levert de houder van het
      betrokken luchtvaartuig het oorspronkelijke (voorlopige) geluidscertificaat binnen acht dagen na ontvangst van het
      vernieuwde (voorlopige) certificaat bij Onze Minister van Infrastructuur en Milieu in.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19e
  - number: 3.19e.4
    text: |-
      Het eerste tot en met derde lid zijn van overeenkomstige toepassing op een (voorlopige) geluidsverklaring en een
      (voorlopige) aanvullende geluidsverklaring.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19e
  - number: 3.19f.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een geluidscertificaat voor een burgerluchtvaartuig schorsen,
      wanneer:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.1.a
    text: een ernstig vermoeden rijst dat niet meer aan de geluidseisen wordt voldaan;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.1.b
    text: |-
      een ernstig vermoeden rijst dat de houder van het betrokken luchtvaartuig dat luchtvaartuig niet overeenkomstig bij
      of krachtens algemene maatregel van bestuur gestelde eisen onderhoudt of laat onderhouden;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.1.c
    text: |-
      een ernstig vermoeden rijst dat met betrekking tot dat luchtvaartuig een wijziging is aangebracht, zonder dat de
      houder een daardoor noodzakelijk geworden wijziging van het geluidscertificaat heeft aangevraagd of zonder dat deze
      wijziging van het luchtvaartuig is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.1.d
    text: het type-certificaat met betrekking tot dat luchtvaartuig is geschorst of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.1.e
    text: |-
      een ernstig vermoeden rijst dat ter verkrijging van een geluidscertificaat onjuiste of onvolledige gegevens zijn
      verstrekt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.1.f
    text: een ernstig vermoeden rijst dat op het geluidscertificaat onjuiste gegevens zijn vermeld; of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.1.g
    text: de houder van het luchtvaartuig anderszins het bij of krachtens dit hoofdstuk bepaalde niet nakomt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.2
    text: Onze Minister van Infrastructuur en Milieu heft de schorsing op zodra de redenen van de schorsing zijn vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.3
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een geluidscertificaat voor een burgerluchtvaartuig intrekken,
      wanneer:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.3.a
    text: |-
      een wijziging met betrekking tot het luchtvaartuig is aangebracht, zonder dat de houder een daardoor noodzakelijk
      geworden wijziging van het geluidscertificaat heeft aangevraagd of zonder dat deze wijziging van het luchtvaartuig
      is goedgekeurd;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.3.b
    text: het geluidscertificaat gedurende tenminste drie maanden is geschorst;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.3.c
    text: ter verkrijging van een geluidscertificaat onjuiste of onvolledige gegevens zijn verstrekt, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.3.d
    text: op het geluidscertificaat onjuiste gegevens zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.4
    text: 'Onze Minister van Infrastructuur en Milieu trekt een geluidscertificaat voor een burgerluchtvaartuig in, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.4.a
    text: het luchtvaartuig niet aan de geluidseisen voldoet ;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.4.b
    text: het betrokken luchtvaartuig onherstelbaar is beschadigd, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.4.c
    text: het betrokken luchtvaartuig uit het register van Nederlandse burgerluchtvaartuigen is uitgeschreven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.5
    text: |-
      De houder van het burgerluchtvaartuig waarvan het geluidscertificaat is geschorst of ingetrokken, levert op eerste
      vordering van Onze Minister van Infrastructuur en Milieu het geluidscertificaat binnen acht dagen in bij Onze
      Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.6
    text: |-
      Wanneer de schorsing wordt opgeheven doet Onze Minister van Infrastructuur en Milieu het ingeleverde
      geluidscertificaat terstond wederom toekomen aan de houder van het betrokken burgerluchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.7
    text: |-
      Het eerste lid onder b tot en met g, het tweede, derde, vierde lid onder b en c, het vijfde en het zesde lid
      zijn van overeenkomstige toepassing op een (voorlopige) geluidsverklaring en een (voorlopige) aanvullende
      geluidsverklaring.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.19f.8
    text: |-
      Onverminderd het zevende lid wordt een (voorlopige) geluidsverklaring, afgegeven in aanvulling op een
      (voorlopig) geluidscertificaat, geschorst indien het betrokken (voorlopige) geluidscertificaat wordt geschorst,
      onderscheidenlijk ingetrokken, wanneer het betrokken (voorlopige) geluidscertificaat wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.19f
  - number: 3.21.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan op aanvraag van de houder, respectievelijk Onze Minister van
      Defensie kan ambtshalve ontheffing verlenen van de bij of krachtens deze paragraaf gegeven regels, wanneer door
      bijzondere omstandigheden die regels in redelijkheid geen toepassing kunnen vinden en de veiligheid van het
      luchtverkeer met het verlenen van de ontheffing niet in gevaar wordt gebracht. Een ontheffing kan onder beperkingen
      worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.21
  - number: 3.21.2
    text: |-
      Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie trekt de ontheffing in,
      wanneer:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.21
  - number: 3.21.2.a
    text: de redenen, waarom de ontheffing is verleend, zijn komen te vervallen, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.21
  - number: 3.21.2.b
    text: de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.21
  - number: 3.22.1
    text: 'De houder van een Nederlands burgerluchtvaartuig, waarvoor een bewijs van luchtwaardigheid is afgegeven:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.22
  - number: 3.22.1.a
    text: ziet er op toe, dat het luchtvaartuig zijn luchtwaardigheid behoudt, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.22
  - number: 3.22.1.b
    text: |-
      onderhoudt of laat het luchtvaartuig onderhouden overeenkomstig bij of krachtens algemene maatregel van bestuur
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.22
  - number: 3.22.2
    text: |-
      De houder van een Nederlands burgerluchtvaartuig dat is voorzien van een voortstuwingsinrichting ziet er op toe
      dat:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.22
  - number: 3.22.2.a
    text: het luchtvaartuig blijft voldoen aan de geldende geluidseisen, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.22
  - number: 3.22.2.b
    text: het luchtvaartuig in de configuratie blijft waarvoor het geluidscertificaat of de geluidsverklaring is verleend.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.22
  - number: 3.22.3
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu kan worden aangegeven in welke gevallen en onder welke
      voorwaarden een afwijking van beperkte duur van het bepaalde in het tweede lid, onder b, is toegestaan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.22
  - number: 3.22.4
    text: |-
      De houder van een Nederlands burgerlichtvaartuig, waarvoor een bewijs van luchtwaardigheid is afgegeven, volgt de
      door Onze Minister van Infrastructuur en Milieu gegeven aanwijzingen met betrekking tot de luchtwaardigheid op.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.22
  - number: 3.22.5
    text: |-
      Onze Minister van Defensie ziet er op toe dat militaire luchtvaartuigen worden onderhouden overeenkomstig de
      daartoe gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.22
  - number: '3.23'
    text: |-
      Ten aanzien van burgerluchtvaartuigen worden bij of krachtens algemene maatregel van bestuur nadere regels gesteld
      met betrekking tot het in deze paragraaf bepaalde. Deze regels bevatten in ieder geval bepalingen betreffende:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.23
  - number: 3.23.a
    text: |-
      de aanvraag en de afgifte van een type-certificaat, een aanvullend type-certificaat, een bewijs van
      luchtwaardigheid, een (voorlopig) geluidscertificaat, een (voorlopige) geluidsverklaring en een (voorlopige)
      aanvullende geluidsverklaring;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.23
  - number: 3.23.b
    text: |-
      de wijziging en overdracht van een type-certificaat, een aanvullend type-certificaat, een (voorlopig)
      geluidscertificaat, een (voorlopige) geluidsverklaring, een (voorlopige) aanvullende geluidsverklaring en een
      bewijs van luchtwaardigheid en de verlenging van zulk een bewijs;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.23
  - number: 3.23.c
    text: |-
      de procedure van aanvraag, wijziging, schorsing en intrekking van een type-certificaat, een aanvullend type-
      certificaat, een (voorlopig) geluidscertificaat, een (voorlopige) geluidsverklaring en een (voorlopige) aanvullende
      geluidsverklaring;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.23
  - number: 3.23.d
    text: de procedure van aanvraag, wijziging, verlenging, schorsing en intrekking van een bewijs van luchtwaardigheid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.23
  - number: 3.23.e
    text: |-
      hetgeen moet worden verstaan onder een ingrijpende wijziging van het type-ontwerp waarvoor een type-certificaat
      is afgegeven;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.23
  - number: 3.23.f
    text: het aan luchtvaartuigen te verrichten onderhoud;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.23
  - number: 3.23.g
    text: |-
      de vernieuwing van een bewijs van luchtwaardigheid, een (voorlopig) geluidscertificaat, een (voorlopige)
      geluidsverklaring en een (voorlopige) aanvullende geluidsverklaring;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.23
  - number: 3.23.h
    text: |-
      de vergoeding die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om afgifte,
      wijziging of overdracht van een type-certificaat, of van een aanvullend type-certificaat, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.23
  - number: 3.23.i
    text: |-
      de vergoeding die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om afgifte,
      wijziging of vernieuwing van een (voorlopig) geluidscertificaat, een (voorlopige) geluidsverklaring, een
      (voorlopige) aanvullende geluidsverklaring en een bewijs van luchtwaardigheid of de verlenging van een bewijs van
      luchtwaardigheid, dan wel van zijn aanvraag om een ontheffing;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.23
  - number: 3.23.j
    text: |-
      de vergoeding die de aanvrager verschuldigd is voor de kosten van de behandeling van zijn aanvraag om goedkeuring
      of wijziging van een onderhoudsprogramma.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.23
  - number: '3.24'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot het model en de uitvoering van een type-certificaat, een
      aanvullend type-certificaat, een bewijs van luchtwaardigheid, een (voorlopig) geluidscertificaat, een (voorlopige)
      geluidsverklaring of een (voorlopige) aanvullende geluidsverklaring voor een burgerluchtvaartuig regels worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.24
  - number: 3.25.1
    text: |-
      Onze Minister van Infrastructuur en Milieu verleent voor het verrichten van werkzaamheden verband houdende met
      de luchtwaardigheid of de geluidsproductie van burgerluchtvaartuigen of onderdelen daarvan op aanvraag aan een
      natuurlijke persoon of rechtspersoon een erkenning, wanneer de desbetreffende natuurlijke persoon of rechtspersoon
      een bedrijf voert, dat voldoet aan bij of krachtens algemene maatregel van bestuur met betrekking tot die erkenning
      gestelde eisen. Aan de erkenning kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.25
  - number: 3.25.2
    text: |-
      Bij algemene maatregel van bestuur wordt aangegeven welke erkenningen Onze Minister van Infrastructuur en Milieu
      kan verlenen, alsmede de bevoegdheden, welke aan iedere erkenning verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.25
  - number: 3.25.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot het verrichten van
      werkzaamheden verband houdende met de luchtwaardigheid van burgerluchtvaartuigen of onderdelen daarvan door een
      natuurlijke persoon of rechtspersoon zonder erkenning als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.25
  - number: 3.25.4
    text: |-
      Het is behoudens het derde lid verboden de werkzaamheden verband houdende met de luchtwaardigheid van
      burgerluchtvaartuigen of onderdelen daarvan, bedoeld in het eerste lid, te verrichten zonder een daartoe strekkende
      erkenning.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.25
  - number: 3.26.1
    text: |-
      Een erkenning wordt verleend voor een bij algemene maatregel van bestuur vast te stellen termijn dan wel voor
      onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.26
  - number: 3.26.2
    text: Op aanvraag van de houder kan Onze Minister van Infrastructuur en Milieu de erkenning wijzigen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.26
  - number: 3.26.3
    text: |-
      Op aanvraag van de houder verlengt Onze Minister van Infrastructuur en Milieu de erkenning, indien wordt voldaan
      aan bij of krachtens algemene maatregel van bestuur met betrekking tot die erkenning gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.26
  - number: 3.27.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een erkenning geheel of gedeeltelijk schorsen, wanneer een ernstig
      vermoeden rijst, dat het betrokken bedrijf niet voldoet aan de eisen, gesteld krachtens [artikel 3.25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: 3.27.2
    text: |-
      Onze Minister van Infrastructuur en Milieu heft de schorsing op zodra de redenen van de schorsing zijn komen te
      vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.27
  - number: 3.27.3
    text: 'Onze Minister van Infrastructuur en Milieu kan een erkenning intrekken, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.27
  - number: 3.27.3.a
    text: de houder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.27
  - number: 3.27.3.b
    text: |-
      het betrokken bedrijf niet voldoet aan de eisen, gesteld krachtens [artikel 3.25][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: 3.27.3.c
    text: de houder krachtens de hem verleende erkenning werkzaamheden verricht, waartoe deze niet erkend is;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.27
  - number: 3.27.3.d
    text: de houder van de erkenning de daaraan verbonden voorschriften of beperkingen niet naleeft;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.27
  - number: 3.27.3.e
    text: de erkenning gedurende ten minste drie maanden is geschorst, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.27
  - number: 3.27.3.f
    text: de houder in staat van faillissement verkeert.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.27
  - number: '3.28'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan op grond van een internationale overeenkomst of een besluit van een
      volkenrechtelijke organisatie natuurlijke of rechtspersonen, die bedrijven voeren, welke op grond van eisen, welke
      gelijkwaardig zijn aan de krachtens [artikel 3.25][ref1] gestelde eisen,


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: 3.28.a
    text: erkend zijn door de bevoegde autoriteit van een door hem bij ministeriële regeling aangewezen staat, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.28
  - number: 3.28.b
    text: |-
      erkend zijn door een door hem bij ministeriële regeling aangewezen internationale organisatie erkennen als erkende
      bedrijven. Aan de erkenning kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.28
  - number: '3.29'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot deze paragraaf.
      Deze regels bevatten in ieder geval bepalingen betreffende:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.29
  - number: 3.29.a
    text: de aanvraag en de afgifte van een erkenning;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.29
  - number: 3.29.b
    text: de verlenging of wijziging van een erkenning;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.29
  - number: 3.29.c
    text: de procedure van aanvraag, verlenging, wijziging, schorsing of intrekking van een erkenning;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.29
  - number: 3.29.d
    text: de vernieuwing van de erkenning,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.29
  - number: 3.29.e
    text: |-
      de vergoeding die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om afgifte,
      verlenging, vernieuwing of wijziging van een erkenning;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.29
  - number: 3.29.f
    text: |-
      de vergoeding die de aanvrager verschuldigd is voor het verlenen van toestemming tot het verrichten van
      werkzaamheden zonder erkenning als bedoeld in [artikel 3.25, derde lid][ref1] en


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.29
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: 3.29.g
    text: het model en de uitvoering van de erkenningen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.29
  - number: 3.30.1
    text: 'Onze Minister van Infrastructuur en Milieu kan op aanvraag bewijzen van bevoegdheid afgeven:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.30
  - number: 3.30.1.a
    text: voor het zonder toezicht verrichten van onderhoud aan luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.30
  - number: 3.30.1.b
    text: |-
      waarmee de houder in aanmerking komt om door een erkend onderhoudsbedrijf gemachtigd te worden om namens dat
      bedrijf werkzaamheden te mogen vrijgeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.30
  - number: 3.30.2
    text: |-
      Behoudens [artikel 3.25][ref1] is het verboden zonder toezicht onderhoud aan burgerluchtvaartuigen te verrichten
      indien het daarvoor geldige bewijs van bevoegdheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: '3.31'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot startinrichtingen
      voor luchtvaartuigen zonder voortstuwingsinrichting.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel3.31
  - number: 4.1.1
    text: |-
      Voor zover bij internationale overeenkomst of besluit van een volkenrechtelijke organisatie niet anders is bepaald,
      is het verboden met luchtvaartuigen vluchten tegen vergoeding uit te voeren zonder een daartoe door Onze Minister
      van Infrastructuur en Milieu afgegeven AOC.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.1
  - number: 4.1.2
    text: |-
      Onze Minister van Infrastructuur en Milieu geeft op aanvraag de AOC af, wanneer wordt voldaan aan de
      bij of krachtens algemene maatregel van bestuur te stellen eisen. De AOC wordt slechts afgegeven aan een
      luchtvaartmaatschappij.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.1
  - number: 4.1.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan aangegeven worden welke AOC's Onze Minister van Infrastructuur
      en Milieu kan afgeven alsmede de verplichtingen en bevoegdheden welke aan een AOC verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.1
  - number: 4.1.4
    text: |-
      Aan een AOC kunnen voorschriften of beperkingen worden verbonden. Het is verboden vluchten uit te voeren in strijd
      met de aan een AOC verbonden voorschriften of beperkingen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.1
  - number: 4.2.1
    text: |-
      De AOC wordt afgegeven voor een bij algemene maatregel van bestuur vast te stellen termijn, welke termijn voor de
      verschillende AOC's verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.2
  - number: 4.2.2
    text: |-
      Op aanvraag van de houder verlengt Onze Minister van Infrastructuur en Milieu de AOC, indien wordt voldaan aan de
      bij of krachtens [artikel 4.1, tweede en derde lid][ref1], gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.3
    text: Onze Minister van Infrastructuur en Milieu kan een AOC op verzoek van de houder wijzigen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.2
  - number: 4.2.4
    text: 'Onze Minister van Infrastructuur en Milieu wijzigt een AOC ambtshalve, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.2
  - number: 4.2.4.a
    text: onjuiste gegevens zijn verstrekt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.2
  - number: 4.2.4.b
    text: de vluchtuitvoering, waarvoor de AOC is verleend, tijdens de duur van de AOC veranderingen heeft ondergaan, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.2
  - number: 4.2.4.c
    text: redenen van nationaal of internationaal beleid op het gebied van de vluchtuitvoering zulks vereisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.2
  - number: 4.2.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot [artikel 4.1][ref1]
      en dit artikel. Deze regels hebben in ieder geval betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.2.5.a
    text: de aanvraag om afgifte van een AOC of een wijziging of verlenging daarvan, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.2
  - number: 4.2.5.b
    text: |-
      de vergoeding, die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om afgifte van
      een AOC of om een wijziging, het onderhouden of de verlenging daarvan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.2
  - number: 4.3.1
    text: 'Onze Minister van Infrastructuur en Milieu kan een AOC schorsen:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.3
  - number: 4.3.1.a
    text: wegens vluchtuitvoering in strijd met bij of krachtens deze wet gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.3
  - number: 4.3.1.b
    text: wegens overtreding van de aan de AOC verbonden voorschriften of beperkingen, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.3
  - number: 4.3.1.c
    text: indien ter verkrijging van de AOC onjuiste gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.3
  - number: 4.3.2
    text: |-
      Onze Minister van Infrastructuur en Milieu heft de schorsing op zodra de redenen van de schorsing zijn komen te
      vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.3
  - number: 4.3.3
    text: 'Onze Minister van Infrastructuur en Milieu kan een AOC intrekken:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.3
  - number: 4.3.3.a
    text: indien de AOC-houder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.3
  - number: 4.3.3.b
    text: wegens het gedurende een aangesloten periode van ten minste twaalf maanden niet uitvoeren van vluchten;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.3
  - number: 4.3.3.c
    text: indien ter verkrijging van de AOC onjuiste of onvolledige gegevens zijn verstrekt, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.3
  - number: 4.3.3.d
    text: indien de AOC ten minste drie maanden is geschorst.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.3
  - number: 4.4.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan op aanvraag van de houder ontheffing verlenen van de bij of
      krachtens dit hoofdstuk gestelde regels, wanneer door bijzondere omstandigheden die regels in redelijkheid geen
      toepassing kunnen vinden en de veiligheid van het luchtverkeer met het verlenen van de ontheffing niet in gevaar
      wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.4
  - number: 4.4.2
    text: Aan de ontheffing, bedoeld in het eerste lid, kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.4
  - number: 4.4.3
    text: 'Onze Minister van Infrastructuur en Milieu trekt de door hem verleende ontheffing in, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.4
  - number: 4.4.3.a
    text: de redenen, waarom de ontheffing is verleend, zijn komen te vervallen, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.4
  - number: 4.4.3.b
    text: de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.4
  - number: '4.5'
    text: |-
      De houder van een AOC volgt de door Onze Minister van Infrastructuur en Milieu gegeven aanwijzingen met betrekking
      tot de vluchtuitvoering op.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.5
  - number: 4.6.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot vluchtuitvoering
      die niet door een luchtvaartmaatschappij dan wel niet tegen vergoeding wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.6
  - number: 4.6.2
    text: Het is verboden vluchten uit te voeren in strijd met de bij of krachtens het eerste lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.6
  - number: '4.7'
    text: |-
      De[ artikelen 4.1 tot en met 4.6][ref1] zijn niet van toepassing op de vluchtuitvoering ten behoeve van douane-
      en politiedoeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '4'
        hoofdstuk: '4'
  - number: '4.8'
    text: |-
      De gezagvoerder van een burgerluchtvaartuig is verplicht de bij regeling van Onze Minister van Infrastructuur en
      Milieu genoemde documenten mee te voeren.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel4.8
  - number: '5.1'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 5.3][ref1] tot en met [5.9][ref2] is van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.1.a.
    text: deelnemers aan het luchtverkeer binnen het vluchtinformatiegebied Amsterdam, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.1
  - number: 5.1.b
    text: |-
      Nederlandse luchtvaartuigen, waar deze zich ook bevinden, tenzij dit onverenigbaar is met de daar ter plaatse
      geldende regels of de regels die in overeenstemming met internationale afspraken worden gehanteerd door de ter
      plaatse voor het verlenen van luchtverkeersdiensten verantwoordelijke Staat.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.1
  - number: '5.2'
    text: |-
      Buiten het vluchtinformatiegebied Amsterdam houdt de gezagvoerder van een Nederlands luchtvaartuig zich aan de daar
      ter plaatse geldende regels. Indien in overeenstemming met internationale afspraken andere regels worden gehanteerd
      door de ter plaatse voor het verlenen van luchtverkeersdiensten verantwoordelijke Staat, houdt de gezagvoerder zich
      aan deze regels.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.2
  - number: '5.3'
    text: |-
      Het is verboden op zodanige wijze aan het luchtverkeer deel te nemen dan wel luchtverkeersleidingsdiensten te
      verlenen dat daardoor personen of zaken in gevaar worden of kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.3
  - number: '5.4'
    text: |-
      Het is verboden boven gebieden met aaneengesloten bebouwing of kunstwerken, industrie- en havengebieden daaronder
      begrepen, dan wel boven mensenmenigten, aan het luchtverkeer deel te nemen op een zodanige hoogte dat het niet
      meer mogelijk is een noodlanding uit te voeren zonder personen of zaken op het aardoppervlak in gevaar te brengen,
      tenzij zulks noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.4
  - number: 5.4.a
    text: om op te stijgen van of te landen op een luchthaven;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.4
  - number: 5.4.b
    text: voor de uitvoering van naderings- en vertrekprocedures, alsmede van luchtverkeerspatronen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.4
  - number: 5.5.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de openbare veiligheid bij het gebruik
      van het luchtruim, ter bevordering van het veilige, ordelijke en vlotte verloop van het luchtverkeer of ter
      bescherming van personen of zaken aan boord van het luchtvaartuig of op het aardoppervlak regels worden gesteld aan
      deelnemers van het luchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.5
  - number: 5.5.2
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen voorts regels worden gesteld betreffende:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.5
  - number: 5.5.2.a
    text: de uitvoering van vluchten;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.5
  - number: 5.5.2.b
    text: de met betrekking tot de uitvoering van vluchten te verstrekken inlichtingen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.5
  - number: 5.5.2.c
    text: |-
      de communicatie tussen deelnemers aan het luchtverkeer onderling en met de instanties en organisaties belast met
      het verlenen van luchtverkeersdiensten;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.5
  - number: 5.5.2.d
    text: de in en ten behoeve van het luchtverkeer te gebruiken tekens en seinen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.5
  - number: 5.5.2.e
    text: het gebruik van het luchtruim anders dan door luchtverkeer; en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.5
  - number: 5.5.2.f
    text: gedrag van het verkeer op een luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.5
  - number: 5.5.3
    text: |-
      Onze Minister van Infrastructuur en Milieu kan ontheffing of vrijstelling verlenen van het bepaalde bij of
      krachtens het eerste en tweede lid, mede met inachtneming van het veilige, ordelijke en vlotte verloop van het
      luchtverkeer. Aan de ontheffing of vrijstelling kunnen voorschriften of beperkingen worden verbonden. Het is
      verboden in strijd met die voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.5
  - number: 5.5.4
    text: |-
      De kosten die samenhangen met het in behandeling nemen van de aanvraag en de afgifte van de in het derde lid
      bedoelde ontheffing of een wijziging daarvan, worden ten laste gebracht van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.5
  - number: 5.5.5
    text: |-
      De bedragen ter vergoeding van de kosten worden vastgesteld bij regeling van Onze Minister van Infrastructuur en
      Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.5
  - number: '5.6'
    text: Het is verboden een vlucht uit te voeren zonder dat een gezagvoerder is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.6
  - number: 5.7.1
    text: De gezagvoerder bevindt zich aan boord van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.7
  - number: 5.7.2
    text: |-
      De gezagvoerder is, ongeacht of hij daadwerkelijk de stuurorganen bedient of niet, ervoor verantwoordelijk dat
      de uitvoering van de vlucht geschiedt in overeenstemming met de bij of krachtens deze wet gestelde regels. Van de
      regels bedoeld in [de eerste volzin][ref1] mag slechts worden afgeweken indien de omstandigheden dit in het belang
      van de veiligheid dringend noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.7.3
    text: |-
      Het eerste lid is niet van toepassing op door Onze Minister van Infrastructuur en Milieu respectievelijk Onze
      Minister van Defensie bij ministeriële regeling aan te wijzen onbemande luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.7
  - number: '5.8'
    text: |-
      Voor de aanvang van iedere vlucht, neemt de gezagvoerder kennis van alle gegevens en inlichtingen die voor de
      uitvoering van de vlucht van belang zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.8
  - number: 5.9.1
    text: |-
      Voor de aanvang van iedere vlucht waaraan luchtverkeersleidingsdiensten worden verleend wordt door of namens de
      gezagvoerder een vliegplan ingediend overeenkomstig de bij of krachtens de algemene maatregel van bestuur, bedoeld
      in [artikel 5.5, tweede lid, onderdeel c][ref1], gestelde regels. Het vliegplan bevat de gegevens en inlichtingen
      omtrent de voorgenomen vlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.9.2
    text: |-
      Alvorens een vlucht waaraan luchtverkeersleidingsdiensten worden verleend aan te vangen, of een gedeelte daarvan
      uit te voeren moet een desbetreffende klaring zijn gevraagd en verkregen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.9
  - number: 5.9.3
    text: |-
      De gezagvoerder komt de door de verlener van luchtverkeersleidingsdiensten gegeven voorwaarden van de klaring
      na. Van de voorwaarden bedoeld in de eerste volzin mag slechts worden afgeweken indien de omstandigheden dit in
      het belang van de veiligheid dringend noodzakelijk maken. Een afwijking wordt zo spoedig mogelijk gemeld aan de
      betrokken verlener van luchtverkeersleidingsdiensten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.9
  - number: 5.10.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan bij ministeriële regeling het uitoefenen van het burgerluchtverkeer
      tijdelijk of blijvend beperken of verbieden boven Nederland of gedeelten daarvan:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.10
  - number: 5.10.1.a
    text: om redenen van openbare orde en veiligheid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.10
  - number: 5.10.1.b
    text: |-
      om andere dringende redenen, waarbij het uitoefenen van de luchtvaart en omstandigheden of gebeurtenissen op het
      aardoppervlak elkaar kunnen beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.10
  - number: 5.10.2
    text: |-
      Onze Minister van Defensie kan bij ministeriële regeling het uitoefenen van het burgerluchtverkeer beperken of
      verbieden om reden van militaire noodzaak.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.10
  - number: 5.10.3
    text: |-
      Op voordracht van Onze Minister van Infrastructuur en Milieu, gedaan in overeenstemming met Onze Minister
      van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, worden bij algemene maatregel van bestuur regels
      gesteld met betrekking tot het uitoefenen van het burgerluchtverkeer boven gebieden aangewezen overeenkomstig
      [artikel 1.2, tweede lid, onder b, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 5.10.4
    text: |-
      Van de regelingen krachtens het eerste en tweede lid wordt mededeling gedaan via de luchtvaartpublicaties bedoeld
      in [artikel 5.23, eerste lid, onder d][ref1], en voor zover nodig via de verlener van luchtverkeersdiensten aan de
      betrokken gezagvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.2
  - number: 5.10.5
    text: |-
      Het is verboden aan het luchtverkeer deel te nemen in strijd met het bepaalde krachtens het eerste, tweede en derde
      lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.10
  - number: 5.11.1
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.11
  - number: 5.11.1.a
    text: |-
      worden, met inachtneming van het type en de dichtheid van het luchtverkeer, delen van het vluchtinformatiegebied
      Amsterdam alsmede luchthavens aangewezen waar de daarbij bepaalde vormen van luchtverkeersdiensten worden verleend;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.11
  - number: 5.11.1.b
    text: |-
      worden in het vluchtinformatiegebied Amsterdam luchtverkeersroutes en -procedures vastgesteld, waaronder mede zijn
      begrepen naderings-, vertrek- en wachtprocedures, alsmede luchtverkeerspatronen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.11
  - number: 5.11.1.c
    text: |-
      kunnen delen van het vluchtinformatiegebied Amsterdam worden aangewezen als bijzondere luchtverkeersgebieden, waar
      daarbij gegeven voorschriften gelden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.11
  - number: 5.11.2
    text: |-
      Onze Minister van Infrastructuur en Milieu kan ontheffing of vrijstelling verlenen van het bepaalde bij of
      krachtens het eerste lid, mede met inachtneming van het veilige, ordelijke en vlotte verloop van het luchtverkeer.
      Aan de ontheffing of vrijstelling kunnen voorschriften of beperkingen worden verbonden. Het is verboden in strijd
      met die voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.11
  - number: 5.11.3
    text: |-
      De kosten die samenhangen met het in behandeling nemen van de aanvraag en de afgifte van de in het tweede lid
      bedoelde ontheffing of een wijziging daarvan, worden ten laste gebracht van de aanvrager.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.11
  - number: 5.11.4
    text: |-
      De bedragen ter vergoeding van de kosten worden vastgesteld bij regeling van Onze Minister van Infrastructuur en
      Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.11
  - number: 5.12.1
    text: |-
      Luchtverkeersdiensten worden verleend in het belang van de algemene luchtverkeersveiligheid en een veilig, ordelijk
      en vlot verloop van het luchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.12
  - number: 5.12.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop
      luchtverkeersdiensten worden verleend.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.12
  - number: 5.13.1
    text: 'Binnen het vluchtinformatiegebied Amsterdam kunnen luchtverkeersdiensten worden verleend door:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.13
  - number: 5.13.1.a
    text: de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.13
  - number: 5.13.1.b
    text: Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.13
  - number: 5.13.2
    text: |-
      Onze Minister van Infrastructuur en Milieu en Onze Minister van Defensie tezamen wijzen de gebieden waarbinnen en
      het luchtverkeer waaraan de in het eerste lid genoemde instanties luchtverkeersdiensten verlenen, aan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.13
  - number: 5.13a.1
    text: |-
      Onze Minister van Infrastructuur en Milieu wijst een verlener van meteorologische diensten voor de
      luchtvaartnavigatie aan die verantwoordelijk is voor het beschikbaar maken, stellen en houden van
      luchtvaartmeteorologische inlichtingen of delen hiervan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.13a
  - number: 5.13a.2
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden regels gesteld omtrent het beschikbaar maken,
      stellen en houden van luchtvaartmeteorologische inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.13a
  - number: 5.13a.3
    text: |-
      Voor zover de aanwijzing en de regeling, bedoeld in het eerste en tweede lid, betrekking hebben op het
      vluchtinformatiegebied Amsterdam worden zij opgesteld in overeenstemming met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.13a
  - number: '5.14'
    text: |-
      In afwijking van [artikel 5.13][ref1], kunnen Onze Minister van Infrastructuur en Milieu en Onze Minister van
      Defensie:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14.a
    text: |-
      delen van het vluchtinformatiegebied Amsterdam aanwijzen waarbinnen door de Eurocontrol-organisatie
      luchtverkeersdiensten worden verleend;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14
  - number: 5.14.b
    text: |-
      in bijzondere situaties delen van het vluchtinformatiegebied Amsterdam aanwijzen waarbinnen luchtverkeersdiensten
      worden verleend door een andere verlener van luchtverkeersdiensten dan de in [artikel 5.13][ref1] genoemde
      verleners van luchtverkeersdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14a
    text: |-
      Indien op basis van artikel 9 bis van de luchtvaartnavigatiedienstenverordening een functioneel luchtruimblok
      is ingesteld, waarvan een gedeelte van of het gehele vluchtinformatiegebied Amsterdam deel uitmaakt, wijzen, in
      afwijking van de [artikelen 5.13][ref1], [5.13a][ref2] en [5.14][ref3], Onze Minister van Infrastructuur en Milieu
      en Onze Minister van Defensie in overeenstemming met het bevoegde gezag van de betrokken staat of staten voor dat
      bepaalde gebied een of meer verleners van luchtverkeersdiensten en verleners van meteorologische diensten voor de
      luchtvaartnavigatie aan, alsmede het luchtverkeer waaraan de bedoelde instanties luchtverkeersdiensten verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14b.1
    text: |-
      Een bij of krachtens [artikel 5.13][ref1], [5.13a][ref2], [5.14][ref3] of [5.14a][ref4] aangewezen instantie kan,
      onverminderd haar verantwoordelijkheid voor het verlenen van de diensten waartoe deze instantie is aangewezen, na
      schriftelijke instemming door Onze Minister van Infrastructuur en Milieu luchtverkeersdiensten of meteorologische
      diensten voor de luchtvaartnavigatie laten verrichten door een andere verlener van luchtverkeersdiensten of
      meteorologische diensten voor de luchtvaartnavigatie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14b
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14b.2
    text: |-
      Ter verkrijging van de in het eerste lid bedoelde instemming dient de bij of krachtens [artikel 5.13][ref1],
      [5.13a][ref2], [5.14][ref3] of [5.14a][ref4] aangewezen instantie hiertoe een verzoek in bij Onze Minister van
      Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14b
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14b.3
    text: |-
      De bij of krachtens [artikel 5.13][ref1], [5.14][ref2] of [5.14a][ref3] aangewezen instantie verstrekt alle
      informatie die benodigd is voor de beoordeling van een verzoek als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14b
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14b.4
    text: 'Gronden waarop instemming als bedoeld in het eerste lid kan worden onthouden zijn:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14b
  - number: 5.14b.4.a
    text: |-
      het niet voldoen of niet kunnen voldoen door de verlener van wiens diensten gebruik zal worden gemaakt aan de op
      grond van [artikel 5.14d][ref1], derde lid, aan het certificaat van de aangewezen instantie gestelde beperkingen en
      voorschriften, dan wel indien het dienstverlening binnen het luchtruim van Bonaire, Sint Eustatius en Saba betreft,
      het niet voldoen of kunnen voldoen aan de bij regeling van Onze Minister gestelde eisen inzake het toezicht op de
      dienstverlener of inzake zijn bekwaamheid of geschiktheid;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14b
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14b.4.b
    text: strijd met het belang van een veilig, ordelijk en vlot verloop van het luchtverkeer; of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14b
  - number: 5.14b.4.c
    text: strijd met het recht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14b
  - number: 5.14c.1
    text: |-
      Het is verboden luchtverkeersdiensten te verlenen zonder hiertoe te zijn aangewezen bij of krachtens deze wet, dan
      wel zonder de hiertoe vereiste instemming, bedoeld in [artikel 5.14b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14c
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14c.2
    text: |-
      Het is verboden luchtverkeersdiensten te doen verlenen zonder de hiertoe vereiste instemming, bedoeld in
      [artikel 5.14b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14c
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14d.1
    text: |-
      Het is verboden luchtvaartnavigatiediensten te verlenen zonder te beschikken over een daartoe bestemd certificaat
      als bedoeld in artikel 7 van de luchtvaartnavigatiedienstenverordening.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.2
    text: |-
      Onze Minister van Infrastructuur en Milieu verstrekt een certificaat als bedoeld in het eerste lid, indien de
      aanvrager voldoet aan de in artikel 6 van de luchtvaartnavigatiedienstenverordening bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.3
    text: |-
      Aan een certificaat kunnen de voorschriften en beperkingen, zoals bedoeld in Bijlage II van de
      luchtvaartnavigatiedienstenverordening, worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.4
    text: |-
      De in het derde lid bedoelde voorschriften en beperkingen kunnen tijdens de geldigheidsduur van het certificaat
      ambtshalve worden gewijzigd of aangevuld wegens:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.4.a
    text: wijziging van de krachtens deze wet gestelde regels;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.4.b
    text: |-
      wijziging van de kaderverordening, luchtvaartnavigatiedienstenverordening, luchtruimverordening of
      interoperabiliteitsverordening; of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.4.c
    text: wijziging van bepalingen die op grond van de in onderdeel b genoemde verordeningen zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de geldigheidsduur, aanvraag,
      verlening en verlenging van een certificaat.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.6
    text: |-
      Onze Minister van Infrastructuur en Milieu neemt binnen twaalf weken na ontvangst van de aanvraag voor het verlenen
      van een certificaat een besluit omtrent de afgifte daarvan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.7
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een certificaat geheel of gedeeltelijk schorsen, indien een ernstig
      vermoeden rijst dat de houder van het certificaat:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.7.a
    text: niet voldoet aan de eisen, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.7.b
    text: niet voldoet aan de voorschriften of beperkingen, bedoeld in het derde lid; of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.7.c
    text: ter verkrijging van het certificaat onjuiste of onvolledige gegevens heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.8
    text: 'Onze Minister van Infrastructuur en Milieu kan een certificaat intrekken, indien:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.8.a
    text: de houder van het certificaat niet voldoet aan de eisen, bedoeld in het tweede lid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.8.b
    text: de houder van het certificaat niet voldoet aan de voorschriften of beperkingen, bedoeld in het derde lid; of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.8.c
    text: het certificaat gedurende ten minste drie maanden is geschorst.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
  - number: 5.14d.9
    text: |-
      Dit artikel is niet van toepassing op verleners van luchtvaartnavigatiediensten die deze diensten hoofdzakelijk
      aanbieden aan andere bewegingen van luchtvaartuigen dan aan het algemeen luchtverkeer als bedoeld in
      [artikel 2.2, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14d
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.14e
    text: |-
      Ten aanzien van de luchtverkeers-, communicatie-, navigatie- of plaatsbepalingsdiensten worden bij regeling
      van Onze Minister van Infrastructuur en Milieu veiligheidsvoorschriften vastgesteld voor technisch en
      ontwikkelingspersoneel dat operationele aan de veiligheid gerelateerde taken verricht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.14e
  - number: '5.15'
    text: |-
      De instanties belast met het verlenen van luchtverkeersleidingsdiensten coördineren de uitvoering van deze
      taken met de instanties belast met het verlenen van luchtverkeersleidingsdiensten binnen hetzelfde gebied of in
      aangrenzende gebieden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.15
  - number: '5.16'
    text: |-
      Onverminderd [artikel 2.1, eerste lid][ref1], van deze wet en de basisverordening is het verboden
      luchtverkeersdiensten te verlenen zonder een daartoe verkregen opdracht van een bij of krachtens
      [artikel 5.13][ref2], [5.14][ref3] of [5.14a][ref4] aangewezen instantie of van een andere verlener van
      luchtverkeersdiensten als bedoeld in [artikel 5.14b, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref5
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.17.1
    text: |-
      Een bij of krachtens [artikel 5.13][ref1], [5.14][ref2] of [5.14a][ref3] aangewezen instantie of een andere
      verlener van luchtverkeersdiensten als bedoeld in [artikel 5.14b, eerste lid][ref4], houdt een registratie
      bij van de daadwerkelijk gewerkte uren van de houders van een bewijs van bevoegdheid voor het verlenen van
      luchtverkeersdiensten aan wie deze instanties een opdracht als bedoeld in [artikel 5.16][ref5] hebben gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref5
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.17.2
    text: |-
      Ten behoeve van het behoud van de geldigheid en de verlenging van een bewijs van bevoegdheid voor het verlenen van
      luchtverkeersdiensten kan Onze Minister van Infrastructuur en Milieu om inzage in de registratie als bedoeld in het
      eerste lid verzoeken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.17
  - number: '5.18'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bevordering van een veilige, ordelijke en vlotte
      afwikkeling van het luchtverkeer regels worden gesteld betreffende de prioriteitstelling bij het verlenen van
      luchtverkeersdiensten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.18
  - number: '5.19'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de exploitant van een burgerluchthaven met
      inachtneming van de daarbij te stellen regels na overleg met de gebruikers en de betrokken verlener van
      luchtverkeersleidingsdiensten, de volgorde van het gebruik van de luchthaven vaststelt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.19
  - number: 5.20.1
    text: |-
      De gebruiker van luchtvaartnavigatiediensten, bedoeld in artikel 2, onderdeel a, van de vergoedingenverordening, is
      in het vluchtinformatiegebied Amsterdam een vergoeding verschuldigd voor de bestrijding van kosten van:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.1.a
    text: |-
      luchtvaartnavigatiediensten voor «en route»-verkeer als bedoeld in de op 12 februari 1981 te Brussel gesloten
      Multilaterale Overeenkomst betreffende «en route»-heffingen (Trb. 1981, 181),
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.1.b
    text: plaatselijke luchtvaartnavigatiediensten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.2
    text: |-
      De Eurocontrol-organisatie stelt jaarlijks in het kader van de op 12 februari 1981 te Brussel gesloten
      Multilaterale Overeenkomst betreffende «en route»-heffingen (Trb. 1981, 181), de hoogte van het
      eenheidstarief, bedoeld in artikel 11 van de vergoedingenverordening, vast ter berekening van de vergoeding
      voor luchtvaartnavigatiediensten voor «en route»-verkeer». Ter voorbereiding daarvan leggen de verleners van
      luchtvaartnavigatiediensten aan «en route»-verkeer» Onze Minister van Infrastructuur en Milieu, jaarlijks vóór 15
      mei een voorstel voor.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.3
    text: |-
      Onze Minister van Infrastructuur en Milieu stelt jaarlijks de hoogte van het eenheidstarief, bedoeld
      in artikel 12 van de vergoedingenverordening, vast ter berekening van de vergoeding voor plaatselijke
      luchtvaartnavigatiediensten. Ter voorbereiding daarvan leggen de verleners van plaatselijke
      luchtvaartnavigatiediensten genoemde Minister jaarlijks vóór 15 mei een voorstel voor.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.4
    text: |-
      De Eurocontrol-organisatie int de vergoeding ter bestrijding van de kosten voor luchtvaartnavigatiediensten voor
      «en route»-verkeer en draagt aan de desbetreffende verleners van deze diensten het hun toekomende deel van het
      geïnde bedrag af.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.5
    text: |-
      De verleners van plaatselijke luchtvaartnavigatiediensten dragen zorg voor de inning van de vergoedingen ter
      bestrijding van de kosten van deze diensten en stemmen daartoe onderling af.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.6
    text: |-
      Bij algemene maatregel van bestuur worden heffingszones als bedoeld in artikel 5 van de vergoedingenverordening
      vastgesteld en worden nadere voorschriften gesteld met betrekking tot de bekendmaking en de inning van
      vergoedingen, bedoeld in het vierde en het vijfde lid, en de termijnen binnen welke betaling van de vergoedingen
      plaats moet vinden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.7
    text: |-
      De Eurocontrol-organisatie kan rechtsvorderingen tot inning van vergoedingen als bedoeld in het vierde lid en
      van andere vergoedingen uit hoofde van de op 12 februari 1981 te Brussel gesloten Multilaterale Overeenkomst
      betreffende «en route»-heffingen (Trb. 1981, 181) uitsluitend aanhangig maken bij de rechtbank Amsterdam.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.8
    text: |-
      Bij algemene maatregel van bestuur kan overeenkomstig artikel 10 van de vergoedingenverordening vrijstelling worden
      verleend van betaling van vergoedingen voor luchtvaartnavigatiediensten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.9
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden voorschriften gesteld met betrekking tot het
      treffen van stimuleringsmaatregelen als bedoeld in artikel 15, eerste lid van de vergoedingenverordening. De
      voorschriften betreffen in ieder geval financiële stimulansen op het prestatiekerngebied capaciteit.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.10
    text: |-
      De in het eerste lid, onderdeel b, bedoelde vergoeding moet worden betaald zonder dat dit bij beschikking is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.11
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden voorschriften gesteld voor de raadpleging van
      vertegenwoordigers van luchtruimgebruikers over het vergoedingenbeleid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.20.12
    text: |-
      Onze Minister van Infrastructuur en Milieu kan besluiten tot modulering van luchtvaartnavigatieheffingen als
      bedoeld in artikel 16 van de vergoedingenverordening.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.20
  - number: 5.21.1
    text: |-
      De vergoedingenverordening en [artikel 5.20][ref1] zijn niet van toepassing op bij algemene maatregel van
      bestuur aan te wijzen luchtvaartnavigatiediensten die worden verleend op luchthavens met minder dan 70.000 IFR
      luchtvervoersbewegingen per jaar, ongeacht de maximale startmassa en het aantal passagierszitplaatsen. Daarbij
      worden de bewegingen geteld als de som van de starts en de landingen en berekend als een gemiddelde van de
      voorafgaande drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.21.2
    text: |-
      De gebruiker van luchtvaartnavigatiediensten als bedoeld in het eerste lid is een vergoeding verschuldigd
      ter bestrijding van de kosten van de verlening van deze diensten. Bij algemene maatregel van bestuur worden
      voorschriften gesteld ten aanzien van de hoogte, de berekening, de vaststelling, de inning en de bekendmaking van
      deze vergoeding, en de termijn binnen welke betaling van deze vergoeding plaats moet vinden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.21
  - number: 5.21.3
    text: De in het tweede lid bedoelde vergoeding moet worden betaald zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.21
  - number: 5.21.4
    text: |-
      Voor de toepassing van het eerste lid wordt de North Sea Area Amsterdam zijnde het gebied dat als NSA Amsterdam is
      gedefinieerd in de door LVNL uitgegeven luchtvaartgids, volume I, hoofdstuk ENR 6-2-5 aangemerkt als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.21
  - number: 5.21.4
    text: |-
      Bij algemene maatregel van bestuur kan vrijstelling worden verleend van de verplichting tot betaling van
      vergoedingen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.21
  - number: 5.22.1
    text: Er is een organisatie voor het verlenen van luchtverkeersdiensten. Hij heeft rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.22
  - number: 5.22.2
    text: |-
      Op de in het eerste lid bedoelde organisatie is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing,
      met uitzondering van de [artikelen 15][ref2] en [18 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.22
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '18'
  - number: 5.23.1
    text: |-
      De LVNL is, ter bevordering van een zo groot mogelijke veiligheid van het luchtverkeer in het
      vluchtinformatiegebied Amsterdam, belast met de volgende taken:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: 5.23.1.a
    text: het verlenen van luchtverkeersdiensten;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: 5.23.1.b
    text: het verlenen van communicatie-, navigatie- en plaatsbepalingsdiensten;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: 5.23.1.c
    text: het verlenen van luchtvaartinlichtingendiensten en het uitgeven van luchtvaartpublicaties en luchtvaartkaarten;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: 5.23.1.d
    text: |-
      het verzorgen of doen verzorgen van opleidingen ten behoeve van luchtverkeersbeveiliging en het verlenen van
      luchtvaartnavigatiediensten;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: 5.23.1.e
    text: |-
      het adviseren van Onze Minister van Infrastructuur en Milieu alsmede Onze Minister van Defensie betreffende
      aangelegenheden op het gebied van de luchtverkeersbeveiliging en het verlenen van luchtvaartnavigatiediensten;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: 5.23.1.f
    text: het verrichten van andere bij of krachtens deze wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: 5.23.2
    text: |-
      Onze Minister van Infrastructuur en Milieu kan de LVNL belasten met het verlenen van luchtverkeersdiensten buiten
      het vluchtinformatiegebied Amsterdam.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: 5.23.3
    text: |-
      De LVNL kan, in ieder geval tegen vergoeding van kosten, diensten aan anderen dan Onze Minister van Infrastructuur
      en Milieu en Onze Minister van Defensie verlenen op het gebied van en verband houdende met taken bedoeld in het
      eerste lid. De in de eerste volzin bedoelde diensten kunnen buiten het vluchtinformatiegebied Amsterdam worden
      verleend.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: 5.23.4
    text: |-
      De LVNL kan, onverminderd zijn verantwoordelijkheid voor de uitvoering van de aan hem opgedragen taken,
      luchtverkeersdiensten laten verrichten door een andere verlener van luchtverkeersdiensten, indien hiervoor
      instemming is verleend op grond van [artikel 5.14b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.23.5
    text: |-
      De LVNL kan, onverminderd zijn verantwoordelijkheid voor de uitvoering van de aan hem opgedragen taken,
      luchtvaartnavigatiediensten anders dan de in het vierde lid bedoelde diensten laten verrichten door een andere
      verlener van luchtvaartnavigatiediensten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: 5.23.6
    text: |-
      De LVNL kan, onverminderd zijn verantwoordelijkheid voor de uitvoering van de aan hem opgedragen taken, andere
      werkzaamheden dan die zijn bedoeld in het vierde en vijfde lid laten verrichten door derden, voor zover deze
      werkzaamheden een ondersteunend karakter hebben.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: 5.23.7
    text: |-
      De LVNL is verplicht zijn taken te verrichten overeenkomstig het bepaalde in Nederland bindende verdragen en
      besluiten van volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.23
  - number: '5.24'
    text: De LVNL heeft een bestuur en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.24
  - number: 5.25.1
    text: Het bestuur bestaat uit ten hoogste drie leden, waaronder de voorzitter.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.25
  - number: 5.25.2
    text: De hoedanigheid van lid van het bestuur is onverenigbaar met het lidmaatschap van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.25
  - number: 5.25.3
    text: |-
      De leden van het bestuur worden benoemd voor een periode van ten hoogste vijf jaren. Bij afloop van deze termijn
      kunnen zij worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.25
  - number: 5.26.1
    text: Het bestuur is belast met de dagelijkse leiding van de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.26
  - number: 5.26.2
    text: |-
      Alle bevoegdheden van de LVNL welke niet bij of krachtens deze wet aan de raad van toezicht zijn opgedragen, komen
      toe aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.26
  - number: 5.26.3
    text: |-
      Het bestuur verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak benodigde inlichtingen en
      andere gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.26
  - number: 5.27.1
    text: Het bestuur vertegenwoordigt de LVNL in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.27
  - number: 5.27.2
    text: |-
      Het bestuur kan onder zijn verantwoordelijkheid de vertegenwoordiging, bedoeld in het eerste lid, opdragen aan een
      of meer bestuursleden of andere personen. Het kan bepalen dat deze vertegenwoordiging uitsluitend betrekking heeft
      op bepaalde onderdelen van de taak van de LVNL dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.27
  - number: '5.28'
    text: |-
      Ingeval van schorsing of ontstentenis van een lid van het bestuur voorziet Onze Minister van Infrastructuur en
      Milieu in de waarneming van zijn functie.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.28
  - number: '5.29'
    text: |-
      Het bestuur legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de raad van toezicht
      bijzondere aanleiding bestaat, aan de raad van toezicht verantwoording af over het door hem gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.29
  - number: '5.30'
    text: |-
      De raad van toezicht bestaat uit zes leden, waaronder de voorzitter, alsmede een waarnemer, die de Minister van
      Verkeer en Waterstaat in de raad van toezicht vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.30
  - number: 5.31.1
    text: |-
      De leden van de raad van toezicht worden zonder last of ruggespraak benoemd voor een tijdvak van vier jaren en
      zijn eenmaal voor een tijdvak van vier jaren herbenoembaar. Hun kan tussentijds op eigen verzoek, dan wel om
      zwaarwichtige redenen ontslag worden verleend.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.31
  - number: 5.31.2
    text: |-
      Onze Minister van Infrastructuur en Milieu benoemt een waarnemer in de raad van toezicht. Het waarnemerschap kan
      tussentijds op eigen verzoek, dan wel om zwaarwichtige redenen worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.31
  - number: 5.31.3
    text: |-
      Onze Minister van Infrastructuur en Milieu benoemt, schorst en ontslaat de leden van de raad van toezicht, met dien
      verstande dat:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.31
  - number: 5.31.3.a
    text: een lid wordt benoemd op voordracht van Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.31
  - number: 5.31.3.b
    text: vier leden worden benoemd op voordracht van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.31
  - number: 5.31.3.c
    text: |-
      een lid, tevens voorzitter, wordt benoemd op voordracht van de raad van toezicht. Omtrent de voordracht besluiten
      de leden van de raad van toezicht met gewone meerderheid, met dien verstande dat de voorzitter niet deelneemt aan
      de vaststelling van de voordracht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.31
  - number: 5.31.4
    text: |-
      Zolang in een vacature in de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad van
      toezicht, met de bevoegdheid van de volledige raad.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.31
  - number: 5.31.5
    text: |-
      De raad van toezicht verschaft Onze Minister alle verlangde inlichtingen, met inachtneming van het door Onze
      Minister vastgestelde informatiestatuut.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.31
  - number: 5.32.1
    text: De raad van toezicht ziet toe op de werkzaamheden van het bestuur, en staat dit met raad terzijde.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
  - number: 5.32.2
    text: |-
      Bij de vervulling van hun taak nemen de leden van de raad van toezicht tot richtsnoer de verwezenlijking van de
      taakstelling en het belang van de LVNL waaronder de continuïteit van zijn bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
  - number: 5.32.3
    text: |-
      Onze Minister van Infrastructuur en Milieu kan bepalen dat het bestuur de voorafgaande instemming behoeft van de
      raad van toezicht voor een beslissing als bedoeld in [artikel 32 van de Kaderwet zelfstandige bestuursorganen][ref1]
      of dat het bestuur, ingeval Onze Minister van Infrastructuur en Milieu een beslissing als bedoeld in dat artikel
      aan zijn voorafgaande instemming heeft onderworpen, die beslissing pas aan hem kan voorleggen nadat de raad van
      toezicht heeft verklaard tegen die beslissing geen bedenkingen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel32
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '32'
  - number: 5.32.4
    text: |-
      Besluiten van het bestuur betreffende de volgende onderwerpen behoeven voorafgaande instemming van de raad van
      toezicht:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
  - number: 5.32.4.a
    text: |-
      de reglementen bedoeld in de [artikelen 5.34][ref1], [5.36][ref2], [5.37][ref3] en [5.39][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.4
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.5
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.6
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.7
  - number: 5.32.4.b
    text: |-
      voorstellen aan Onze Minister van Infrastructuur en Milieu met betrekking tot de hoogte van het
      eenheidstarief, bedoeld in [artikel 5.20, derde lid][ref1], en de hoogte van de vergoeding, bedoeld in
      [artikel 5.21, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.32.4.c
    text: de financiële begroting, en het financiële meerjarenbeleidsplan;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
  - number: 5.32.4.d
    text: het jaarverslag en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
  - number: 5.32.4.e
    text: de bij of krachtens de wet aan Onze Minister van Infrastructuur en Milieu uit te brengen rapportages;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
  - number: 5.32.4.f
    text: de aanwijzing van de externe registeraccountant.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
  - number: 5.32.5
    text: |-
      Besluiten betreffende het in het vierde lid, onderdeel c, genoemde financiële meerjarenbeleidsplan behoeven
      bovendien de goedkeuring van Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
  - number: 5.32.6
    text: |-
      De raad van toezicht kan geen rechtsgeldige besluiten nemen indien niet tenminste tweederde van het aantal leden
      ter vergadering aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
  - number: 5.32.7
    text: |-
      De raad van toezicht stelt bij reglement zijn werkwijze vast. Het reglement behoeft de goedkeuring van Onze
      Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.32
  - number: 5.33.1
    text: De raad van toezicht heeft een eigen secretariaat; de kosten daarvan komen ten laste van de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.33
  - number: 5.33.2
    text: |-
      Onze Minister van Infrastructuur en Milieu kan aan de leden van de raad van toezicht, ten laste van de LVNL, een
      vergoeding toekennen voor hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.33
  - number: 5.33.3
    text: |-
      De leden van de raad van toezicht hebben aanspraak op vergoeding van de door hen in de uitoefening van hun functie
      gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.33
  - number: '5.34'
    text: |-
      Het bestuur stelt bij reglement de hoofdlijnen vast van de inrichting van de LVNL en van de wijze van
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.34
  - number: '5.35'
    text: |-
      De bedrijfsvoering van de LVNL geschiedt zoveel mogelijk overeenkomstig die, welke algemeen gebruikelijk is bij het
      particuliere bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.35
  - number: '5.36'
    text: |-
      Het bestuur van de LVNL voert op bij reglement vast te stellen wijze overleg met gebruikers van door de organisatie
      geleverde diensten of met hun vertegenwoordigers omtrent aangelegenheden terzake waarvan naar zijn oordeel overleg
      dienstig is, alsmede omtrent aangelegenheden terzake waarvan de deelnemers aan het geïnstitutionaliseerde overleg
      het bestuur te kennen hebben gegeven overleg te willen voeren.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.36
  - number: 5.37.1
    text: |-
      Het personeel van de LVNL, de leden van het bestuur daaronder begrepen, is ambtenaar in de zin van de
      [Ambtenarenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 5.37.2
    text: Het bestuur stelt bij reglement de regeling van de rechtspositie van het personeel vast.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3
    text: |-
      Onverminderd hetgeen reeds bij of krachtens de wet is geregeld, geeft het reglement bedoeld in het tweede lid van
      dit artikel in ieder geval voorschriften betreffende de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.a
    text: aanstelling;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.b
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.c
    text: ontslag;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.d
    text: het onderzoek naar de geschiktheid en de bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.e
    text: bezoldiging;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.f
    text: wachtgeld;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.g
    text: diensttijden;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.h
    text: verlof en vakantie;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.i
    text: voorzieningen in verband met ziekte;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.j
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.k
    text: woon-, verblijfs- en bereikbaarheidsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.l
    text: medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.m
    text: overige rechten en verplichtingen van het personeel;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.n
    text: disciplinaire straffen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.o
    text: |-
      de wijze waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt gepleegd
      over aangelegenheden van algemeen belang voor de rechtspositie en de bezoldiging van het personeel van de LVNL;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.3.p
    text: een geschillenregeling met betrekking tot de onder *l* en *o* genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
  - number: 5.37.4
    text: |-
      De bepalingen van [artikel 126 van de Ambtenarenwet][ref1] zijn van overeenkomstige toepassing op de totstandkoming
      van het in het tweede lid bedoelde reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel126
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.37
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '126'
  - number: '5.38'
    text: 'De geldmiddelen van de LVNL bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.38
  - number: 5.38.a
    text: |-
      de opbrengst van de in [artikel 5.20][ref1] en [5.21][ref2] bedoelde vergoedingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.38
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.38.b
    text: |-
      de opbrengst van de vergoedingen voor verleende diensten waarvan de kosten niet reeds de basis vormen voor de
      vergoedingen bedoeld in de [artikelen 5.20][ref1] en [5.21][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.38
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.38.c
    text: andere baten hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.38
  - number: '5.39'
    text: |-
      Het bestuur stelt bij reglement de werkwijze vast voor het financiële beheer en de administratieve organisatie van
      de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.39
  - number: 5.40.1
    text: 'De begroting bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.40
  - number: 5.40.1.a
    text: de jaarlijkse financiële begroting, bestaande uit een exploitatiebegroting en een kapitaalsbegroting;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.40
  - number: 5.40.1.b
    text: het financiële meerjarenbeleidsplan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.40
  - number: 5.40.2
    text: |-
      Tot de lasten van de LVNL worden gerekend de kosten voortvloeiende uit de taken van Onze Minister van Verkeer en
      Waterstaat op het gebied van de luchtverkeersbeveiliging.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.40
  - number: 5.41.1
    text: 'Het jaarverslag van de LVNL gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.41
  - number: 5.41.1.a
    text: een opgave over de toepassing van de arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.41
  - number: 5.41.1.b
    text: |-
      een document, houdende de instemming bedoeld in [artikel 5.32, vierde lid, onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.41
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.3
  - number: 5.41.2
    text: Het boekjaar van de LVNL valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.41
  - number: 5.41.3
    text: |-
      Het bestuur zendt jaarlijks voor 1 mei van het jaar volgende op het jaar waarop het betrekking heeft het
      jaarverslag aan Onze Minister van Infrastructuur en Milieu en aan beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.41
  - number: 5.42.1
    text: |-
      Onze Minister van Infrastructuur en Milieu stelt regels over de uitoefening van het toezicht op de LVNL door Onze
      Minister van Infrastructuur en Milieu en de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.42
  - number: 5.42.2
    text: Onze Minister van Infrastructuur en Milieu stelt een informatiestatuut vast.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.42
  - number: 5.42.3
    text: |-
      Onze Minister van Infrastructuur en Milieu kan het bestuur opdragen periodiek rapportage uit te brengen op een door
      hem, na overleg met het bestuur, te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.42
  - number: 5.43.1
    text: 'De volgende stukken worden door het bestuur vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.43
  - number: 5.43.1.a
    text: de financiële begroting;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.43
  - number: 5.43.1.b
    text: het financiële meerjarenbeleidsplan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.43
  - number: 5.43.2
    text: |-
      Het bestuur zendt het financiële meerjarenbeleidsplan aan Onze Minister van Infrastructuur en Milieu toe vóór 1
      november van het jaar voorafgaand aan het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.43
  - number: 5.43.3
    text: |-
      Indien Onze Minister van Verkeer en Waterstaat binnen vier weken na de in het tweede lid bedoelde toezending de
      goedkeuring aan de in het eerste lid, onder a en b, genoemde stukken, niet heeft onthouden, wordt deze geacht te
      zijn verleend.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.43
  - number: '5.44'
    text: |-
      Waar in deze wet de goedkeuring van Onze Minister van Verkeer en Waterstaat is vereist, verleent dan wel onthoudt
      hij die, behoudens het bepaalde in [artikel 5.43, derde lid][ref1], binnen twaalf weken na de datum van ontvangst
      van de goed te keuren stukken. Indien Onze Minister van Verkeer en Waterstaat goedkeuring onthoudt aan de
      financiële begroting, is het bestuur gerechtigd voor iedere maand gedurende welke de goedkeuring wordt onthouden,
      uitgaven te doen ter grootte van maximaal een twaalfde deel van de begroting van het voorafgaande boekjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel5.44
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.8
  - number: '6.50'
    text: |-
      Deze titel is, met uitzondering van het bepaalde bij of krachtens de[ artikelen 6.55][ref1], [6.56][ref2] en
      [6.57][ref3], niet van toepassing op het vervoer van splijtstoffen, ertsen of radioactieve stoffen als bedoeld in
      [artikel 1, eerste lid, van de Kernenergiewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.50
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0002402
        artikel: '1'
  - number: 6.51.1
    text: |-
      Het is verboden bij of krachtens algemene maatregel van bestuur aan te wijzen gevaarlijke stoffen met een
      luchtvaartuig te vervoeren, ten vervoer aan te bieden of aan te nemen, alsmede te laden in of te lossen uit een
      luchtvaartuig, of tijdens het vervoer neer te leggen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.51
  - number: 6.51.2
    text: |-
      Het verbod in het eerste lid geldt niet voor de bij of krachtens algemene maatregel van bestuur aan te wijzen
      gevaarlijke stoffen of categorieën van gevaarlijke stoffen, indien aan de bij of krachtens die algemene maatregel
      van bestuur terzake gestelde regels is voldaan.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.51
  - number: 6.51.3
    text: |-
      Onder het vervoer van gevaarlijke stoffen wordt mede begrepen het laten staan op een luchthaven van een
      luchtvaartuig waarin zich dergelijke stoffen bevinden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.51
  - number: 6.52.1
    text: |-
      Het is verboden gevaarlijke stoffen ten vervoer aan te bieden onder een andere benaming of onder opgave van een
      andere categorie-indeling dan die welke bij of krachtens deze wet is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.52
  - number: 6.52.2
    text: De in het eerste lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.52
  - number: 6.53.1
    text: |-
      De regels, bedoeld in [artikel 6.51, tweede lid][ref1], kunnen onder meer betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.53.1.a
    text: |-
      de eisen ten aanzien van constructie, inrichting en uitrusting van luchtvaartuigen, waarmee gevaarlijke stoffen
      worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
  - number: 6.53.1.b
    text: de documenten die met betrekking tot gevaarlijke stoffen opgemaakt dienen te worden;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
  - number: 6.53.1.c
    text: de stuwage en de belading van luchtvaartuigen met inbegrip van samenlading;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
  - number: 6.53.1.d
    text: het onderzoek van gevaarlijke stoffen naar hun eigenschappen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
  - number: 6.53.1.e
    text: |-
      de eisen ten aanzien van verpakking van gevaarlijke stoffen, met inbegrip van de daarbij behorende inrichting of
      uitrusting, en het testen of keuren daarvan, alsmede de uitgifte en intrekking van verpakkingskenmerken;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
  - number: 6.53.1.f
    text: de etiketten, kenmerken of andere aanduidingen op de verpakking, bedoeld in onderdeel e;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
  - number: 6.53.1.g
    text: |-
      de eisen ten aanzien van constructie, inrichting en uitrusting van inrichtingen, voertuigen of werktuigen met
      behulp waarvan gevaarlijke stoffen worden geladen of gelost;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
  - number: 6.53.1.h
    text: de keuring van de inrichtingen, voertuigen of werktuigen, bedoeld in onderdeel g;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
  - number: 6.53.1.i
    text: |-
      de melding voorafgaande aan het verrichten van een handeling, als bedoeld in [artikel 6.51][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.53.1.j
    text: |-
      het opstellen van een risico-inventarisatie met betrekking tot het vervoeren, laden of lossen van door Onze
      Minister van Infrastructuur en Milieu daartoe aangewezen stoffen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
  - number: 6.53.1.k
    text: |-
      het aanwijzen van luchtroutes waarlangs door Onze Minister van Infrastructuur en Milieu aangewezen gevaarlijke
      stoffen worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
  - number: 6.53.2
    text: |-
      De betrokkene is een door Onze Minister van Infrastructuur en Milieu vast te stellen vergoeding verschuldigd voor
      de kosten van een keuring, als bedoeld in onderdeel h van het eerste lid, gebaseerd op de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.53
  - number: 6.54.1
    text: |-
      Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kan na overleg met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties in het belang van de openbare veiligheid ten aanzien van
      luchtvaartuigen die door hem aangewezen gevaarlijke stoffen vervoeren, bepalen dat die luchtvaartuigen uitsluitend
      van door hem aangewezen luchthavens mogen starten of op die luchthavens mogen landen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.54
  - number: 6.54.2
    text: |-
      Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kan na overleg met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties in het belang van de openbare veiligheid bepalen, dat de
      in het eerste lid bedoelde gevaarlijke stoffen op de in het eerste lid bedoelde luchthavens slechts mogen worden
      geladen, gelost of neergelegd op door hem op die luchthavens aangewezen plaatsen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.54
  - number: 6.54.3
    text: |-
      Onze Minister van Defensie kan ten aanzien van militaire helikopters de in het eerste en tweede lid bedoelde
      beperkingen ook doen gelden voor door hem aangewezen terreinen, niet zijnde luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.54
  - number: 6.54.4
    text: Het is verboden te handelen in strijd met het bepaalde krachtens het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.54
  - number: 6.55.1
    text: |-
      Het is verboden gevaarlijke stoffen ten vervoer aan te bieden, te vervoeren, te doen of laten vervoeren met
      luchtvaartuigen, zonder een door Onze Minister van Infrastructuur en Milieu verleende erkenning.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.2
    text: |-
      Een erkenning wordt verleend voor een bij algemene maatregel van bestuur vast te stellen termijn, dan wel voor
      onbepaalde tijd indien door de betrokken natuurlijke persoon of rechtspersoon voldaan wordt aan de bij of krachtens
      die maatregel met betrekking tot de erkenning gestelde eisen. Aan de erkenning kunnen voorschriften of beperkingen
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.3
    text: |-
      Bij algemene maatregel van bestuur wordt aangegeven welke erkenningen Onze Minister van Infrastructuur en Milieu
      kan verlenen, alsmede de bevoegdheden, welke aan iedere erkenning verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.4
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een erkenning geheel of gedeeltelijk schorsen, wanneer een ernstig
      vermoeden rijst, dat de betrokken natuurlijke persoon of rechtspersoon:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.4.a
    text: niet voldoet aan de eisen, gesteld krachtens het tweede lid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.4.b
    text: handelt in strijd met het bij of krachtens deze titel bepaalde.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.5
    text: 'Onze Minister van Infrastructuur en Milieu kan een erkenning intrekken, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.5.a
    text: de houder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.5.b
    text: de houder niet voldoet aan de eisen, gesteld krachtens het tweede lid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.5.c
    text: de houder krachtens de hem verleende erkenning werkzaamheden verricht, waartoe deze niet erkend is;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.5.d
    text: |-
      de houder handelt in strijd met de[ artikelen 6.51, tweede lid][ref1], of [6.52][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.55.5.e
    text: de erkenning gedurende ten minste drie maanden is geschorst;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.5.f
    text: de houder in staat van faillissement verkeert.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.55.6
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen regels gegeven worden met betrekking tot
      de procedure van aanvraag, afgifte, wijziging, verlenging, schorsing en intrekking van erkenningen, alsmede de
      vergoeding die de aanvrager van de erkenning verschuldigd is voor de kosten van de behandeling van zijn aanvraag om
      afgifte, wijziging of verlenging, welke gebaseerd is op de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.55
  - number: 6.56.1
    text: |-
      Onze Minister van Infrastructuur en Milieu erkent een opleiding voor een theoretisch of praktisch examen als
      opleiding voor een theoretisch of praktisch examen benodigd ter verkrijging van een erkenning, als bedoeld in
      [artikel 6.55, eerste lid][ref1], indien die opleiding voldoet aan bij ministeriële regeling te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.56
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.56.2
    text: |-
      Onze Minister van Infrastructuur en Milieu kan de erkenning van een opleiding intrekken, wanneer die opleiding niet
      meer aan de krachtens het eerste lid gestelde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.56
  - number: 6.56.3
    text: Bij ministeriële regeling kunnen ter uitvoering van het eerste en tweede lid nadere regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.56
  - number: '6.57'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan ter uitvoering van internationale overeenkomsten of besluiten
      van volkenrechtelijke organisaties natuurlijke personen of rechtspersonen, die handelingen als bedoeld in
      [artikel 6.55, eerste lid][ref1], verrichten op zodanige wijze, dat deze voldoen aan eisen, welke gelijkwaardig
      zijn aan de krachtens [artikel 6.55][ref2] gestelde eisen, erkennen als erkende bedrijven voor zover die bedrijven
      erkend zijn door de bevoegde autoriteit van een bij ministeriële regeling aangewezen land of internationale
      organisatie. Aan de erkenning kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.57
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.58.1
    text: |-
      Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kan na overleg met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties in bijzondere gevallen ontheffing verlenen van de bij
      of krachtens deze titel gegeven regels, wanneer die regels in redelijkheid geen toepassing kunnen vinden en de
      veiligheid van het luchtverkeer met het verlenen van de ontheffing niet in gevaar wordt gebracht. Aan de ontheffing
      kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.58
  - number: 6.58.2
    text: Het is verboden te handelen in strijd met de voorschriften of de beperkingen bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.58
  - number: 6.58.3
    text: De ontheffing kan worden geweigerd op grond van de openbare veiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.58
  - number: 6.58.4
    text: |-
      Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kan na overleg met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties een ontheffing wijzigen:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.58
  - number: 6.58.4.a
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.58
  - number: 6.58.4.b
    text: op grond van de openbare veiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.58
  - number: 6.58.5
    text: |-
      Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kan de ontheffing intrekken,
      wanneer
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.58
  - number: 6.58.5.a
    text: de redenen, waarom de ontheffing is verleend, zijn komen te vervallen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.58
  - number: 6.58.5.b
    text: de openbare veiligheid dit vereist;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.58
  - number: 6.58.5.c
    text: de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.58
  - number: 6.58.6
    text: |-
      De aanvrager van de ontheffing of van de wijziging daarvan is Onze Minister van Infrastructuur en Milieu een
      door deze vast te stellen vergoeding voor de behandeling van de aanvraag verschuldigd, gebaseerd op de werkelijke
      kosten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.58
  - number: '6.59'
    text: |-
      Het is passagiers en leden van het boordpersoneel verboden gevaarlijke stoffen aan boord van een luchtvaartuig
      te brengen, of met zich mee te voeren in hun bagage, anders dan met inachtneming van de door Onze Minister van
      Infrastructuur en Milieu respectievelijk Onze Minister van Defensie aangewezen Technische Voorschriften van de
      Internationale Burgerluchtvaartorganisatie betreffende het vervoer van gevaarlijke stoffen door de lucht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.59
  - number: 6.60.1
    text: |-
      Degene, die een handeling als bedoeld in [artikel 6.51, eerste lid][ref1], verricht, is verplicht, indien zich
      daarbij voorvallen gevaarlijke stoffen voordoen waardoor gevaar voor de openbare veiligheid is ontstaan of is te
      duchten, daarvan onverwijld mededeling te doen aan Onze Minister van Infrastructuur en Milieu respectievelijk Onze
      Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.60
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.60.2
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kunnen
      voorschriften worden gegeven omtrent de procedure en de wijze van mededeling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.60
  - number: 6.61.1
    text: |-
      Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kan van degenen die
      handelingen verrichten als bedoeld in [artikel 6.51][ref1] , alle inlichtingen of documenten vragen die naar
      zijn redelijk oordeel nodig zijn ten behoeve van het analyseren van voorvallen gevaarlijke stoffen als bedoeld
      in [artikel 6.60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.61
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.61.2
    text: |-
      De betrokkenen zijn verplicht de gevraagde inlichtingen volledig en naar waarheid te verstrekken binnen een door
      Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie in redelijkheid te stellen
      termijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.61
  - number: 6.61a.1
    text: |-
      Indien zich binnen het vluchtinformatiegebied Amsterdam een luchtvaartongeval voordoet verstrekt de houder van
      het betrokken luchtvaartuig onverwijld aan de betrokken hulpverlenende instanties informatie over de gevaarlijke
      stoffen die zich aan boord van dat luchtvaartuig bevinden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.61a
  - number: 6.61a.2
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie wordt
      vastgesteld welke informatie door tussenkomst van welke instantie verstrekt dient te worden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.61a
  - number: 6.62.1
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen met het oog op de luchtwaardigheid van
      luchtvaartuigen tijdens het vervoer van dieren in die luchtvaartuigen in overeenstemming met Onze Minister van
      Economische Zaken regels worden gegeven met betrekking tot dat vervoer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.62
  - number: 6.62.2
    text: Het is verboden dieren te vervoeren in strijd met het bepaalde krachtens het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.62
  - number: 6.62.3
    text: |-
      Onze Minister van Infrastructuur en Milieu kan in bijzondere gevallen ontheffing verlenen van de in het eerste lid
      bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel6.62
  - number: 7.1.1
    text: Voorvallen worden gemeld aan Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.1
  - number: 7.1.2
    text: |-
      Bij algemene maatregel van bestuur worden natuurlijke personen of rechtspersonen aangewezen die verplicht zijn tot
      het melden van een voorval.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.1
  - number: 7.1.3
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu worden nadere regels gesteld met betrekking tot de in
      het eerste lid bedoelde meldingen en kunnen regels worden gesteld voor het vrijwillig melden van tekortkomingen
      in de luchtvaart welke niet verplicht gemeld moeten worden maar die de melder als een reëel of mogelijk gevaar
      beschouwt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.1
  - number: 7.2.1
    text: |-
      Gegevens ontvangen uit een in [artikel 7.1, eerste lid][ref1], bedoelde melding, dan wel ontvangen van een lidstaat
      van de Europese Unie naar aanleiding van een soortgelijke melding in die lidstaat, zijn niet openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel7
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.2
    text: |-
      Iedere instantie met regelgevende bevoegdheid op het gebied van de veiligheid in de burgerluchtvaart of met
      onderzoeksbevoegdheid voor ongevallen en incidenten die zich in de Europese Gemeenschap voordoen, heeft toegang tot
      de in het eerste lid bedoelde gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.2
  - number: 7.2.3
    text: Bij het registreren van de melding worden geen namen en adressen van individuele personen opgenomen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.2
  - number: 7.3.1
    text: |-
      Een luchthavencoördinator als bedoeld in Verordening nr. 95/93 van de Raad van de Europese Gemeenschappen
      van 18 januari 1993 betreffende gemeenschappelijke regels voor de toewijzing van «slots» op communautaire
      luchthavens (PbEG L 14) die bij de uitvoering van zijn taak krachtens de verordening schade toebrengt aan
      luchtvaartmaatschappijen of anderen, is te dier zake niet aansprakelijk, tenzij de schade een gevolg is van zijn
      opzet of roekeloosheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.3
  - number: 7.3.2
    text: |-
      Op de luchthavencoördinator is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing, met uitzondering
      van de [artikelen 18][ref2], [21][ref3] en [22 van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0020495
        artikel: '22'
  - number: 7.4.1
    text: |-
      De luchtvervoerder en de exploitant van luchtvaartuigen, bedoeld in artikel 3 van de Verordening (EG) nr. 785/2004
      van het Europees Parlement en de Raad van 21 april 2004 tot vaststelling van gemeenschappelijke regels inzake de
      verzekeringseisen voor luchtvervoerders en exploitanten van luchtvaartuigen (PbEU L 138) hebben een verzekering die
      voldoet aan de artikelen 4, 6 en 7 van voornoemde verordening.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.4
  - number: 7.4.2
    text: |-
      Met betrekking tot niet-commerciële diensten van luchtvaartuigen met een MTOM van 2700 kg of minder bedraagt de
      verzekeringsdekking ten minste 100 000 BTR per passagier.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.4
  - number: '7.5'
    text: |-
      Het is een vliegtuigexploitant als bedoeld in artikel 3, onder o, van richtlijn nr. 2003/87/EG van het Europees
      Parlement en de Raad van de Europese Unie van 13 oktober 2003 tot vaststelling van een regeling voor de handel in
      broeikasgasemissierechten binnen de Gemeenschap en tot wijziging van richtlijn 96/61/EG van de Raad (PbEU L 275),
      zoals deze laatstelijk is gewijzigd bij richtlijn nr. 2008/101/EG van het Europees Parlement en de Raad van de
      Europese Unie van 19 november 2008 (PbEU 2009, L 8), verboden een vlucht uit te voeren met een luchtvaartuig zolang
      en voor zover de Commissie van de Europese Gemeenschappen op grond van artikel 16, tiende lid, van eerstgenoemde
      richtlijn aan de betrokken vliegtuigexploitant een exploitatieverbod heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.5
  - number: '7.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden vastgesteld betreffende de
      vergoedingen voor de kosten van handelingen die voortvloeien uit internationale overeenkomsten, die ter zake van
      de luchtvaartveiligheid door Nederland, dan wel op grond van de artikelen 100, tweede lid, en 207, eerste en vierde
      lid, in samenhang met artikel 218 van het Verdrag betreffende de werking van de Europese Unie door de Europese Unie
      zijn gesloten, voor zover deze kosten niet reeds de basis vormen voor de vergoedingen bedoeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel7.6
  - number: 8.1.1
    text: 'Luchthavens zijn te onderscheiden in:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.1.a
    text: de luchthaven Schiphol,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.1.b
    text: overige burgerluchthavens, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.1.c
    text: militaire luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.2
    text: |-
      Overige burgerluchthavens zijn van regionale betekenis of van nationale betekenis. Deze luchthavens zijn van
      nationale betekenis indien:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.2.a
    text: |-
      zij zijn gelegen buiten provinciegrenzen zoals bepaald bij of krachtens de [Provinciewet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005645
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0005645
  - number: 8.1.2.b
    text: dit bij wet is bepaald.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.3
    text: 'Luchthavens van nationale betekenis zijn:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.3.a
    text: de luchthaven Lelystad,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.3.b
    text: de luchthaven Eelde,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.3.c
    text: de luchthaven Maastricht, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.3.d
    text: de luchthaven Rotterdam.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.4
    text: |-
      Indien het militaire gebruik van een militaire luchthaven, met uitzondering van de militaire luchthaven Twenthe,
      wordt beëindigd door intrekking van:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.4.a
    text: |-
      de aanwijzing op grond van de [Luchtvaartwet][ref1] van die luchthaven als militaire luchthaven, of


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: 8.1.4.b
    text: het luchthavenbesluit dat op deze luchthaven betrekking heeft,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.5
    text: |-
      In afwijking van het vierde lid kan bij algemene maatregel van bestuur worden vastgesteld dat een luchthaven als
      bedoeld in dat lid van regionale betekenis is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1.6
    text: |-
      De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1
  - number: 8.1a.1
    text: Het is verboden met een luchtvaartuig op te stijgen of te landen, anders dan van of op een luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1a
  - number: 8.1a.2
    text: |-
      Het is verboden de luchthaven Schiphol in bedrijf te hebben indien voor deze luchthaven geen
      luchthavenindelingbesluit en luchthavenverkeerbesluit gelden en indien de exploitant van deze luchthaven niet
      beschikt over een geldig veiligheidscertificaat.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1a
  - number: 8.1a.3
    text: |-
      Het is verboden een overige burgerluchthaven in bedrijf te hebben indien voor deze luchthaven geen
      luchthavenbesluit of luchthavenregeling geldt. Vaststelling van een luchthavenbesluit is vereist indien buiten het
      luchthavengebied het externe-veiligheidsrisico of de geluidbelasting vanwege het luchthavenluchtverkeer zodanig is
      dat dit gevolgen heeft voor de ruimtelijke indeling van het gebied rond de luchthaven. Bij of krachtens algemene
      maatregel van bestuur wordt de mate van externe-veiligheidsrisico of geluidbelasting buiten het luchthavengebied
      bepaald die vaststelling van gevolgen voor de ruimtelijke indeling van het gebied rond de luchthaven noodzakelijk
      maakt. Daarbij kan worden bepaald dat voor daarbij te omschrijven luchthavens in elk geval kan worden volstaan
      met de vaststelling van een luchthavenregeling. De voordracht voor een krachtens dit lid vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1a
  - number: 8.1a.4
    text: |-
      Het is de exploitant van een overige burgerluchthaven waarvoor vaststelling van een luchthavenbesluit is vereist,
      verboden die luchthaven in bedrijf te hebben indien hij niet beschikt over een geldig veiligheidscertificaat.
      Bij algemene maatregel van bestuur kan dit verbod van toepassing worden verklaard op burgerluchthavens waarvoor
      vaststelling van een luchthavenregeling mogelijk is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1a
  - number: 8.1a.5
    text: Voor een militaire luchthaven is een luchthavenbesluit of een luchthavenregeling van kracht.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1a
  - number: 8.1b.1
    text: |-
      In deze titel wordt verstaan onder: - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *exploitant van de luchthaven:* de N.V. Luchthaven Schiphol, of, indien dit een ander is, de houder van de
      luchthavenexploitatievergunning;
        - *gebruiker:* een luchtvaartmaatschappij, alsmede een persoon of rechtspersoon die vluchten uitvoert, niet zijnde
      een luchtvaartmaatschappij;
        - *inspecteur-generaal:* de inspecteur-generaal van de Inspectie Leefomgeving en Transport;
        - *luchthavenexploitatievergunning:* de vergunning, bedoeld in [artikel 8.25][ref2];
        - *luchthavennetwerk:* een groep luchthavens die als zodanig door de lidstaat is aangewezen en die wordt
      geëxploiteerd door een en dezelfde exploitant van de luchthaven;
        - *representatieve organisatie:* een bij ministeriële regeling aangewezen rechtspersoon die de belangen
      vertegenwoordigt van gebruikers;


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1b
    references:
      - id: ref1
        bwb_id: BWBR0033043
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.1b.2
    text: |-
      In deze titel wordt onder bestemmingsplan mede verstaan een inpassingsplan als bedoeld in [artikel 3.26][ref1] of
      [3.28 van de Wet ruimtelijke ordening][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.1b
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '8.2'
    text: Deze titel is van toepassing ten aanzien van de luchthaven Schiphol.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.2
  - number: 8.2a.1
    text: |-
      De overheid bezit ten minste een meerderheid van het economisch en juridisch belang in de exploitant van de
      luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.2a
  - number: 8.2a.2
    text: |-
      Onze Minister van Financiën wijst bij regeling een of meerdere overheidsorganisaties aan ter voldoening van de in
      het eerste lid genoemde eis.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.2a
  - number: 8.2a.3
    text: |-
      De krachtens het tweede lid vast te stellen regeling heeft in ieder geval betrekking op de wijze waarop invulling
      wordt gegeven aan de in het eerste lid genoemde eis en de wijze waarop de overheid in gezamenlijkheid blijvend
      invulling geeft aan de continuïteit van de Mainport.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.2a
  - number: 8.2a.4
    text: |-
      Het voorstel voor de krachtens het tweede lid vast te stellen regeling wordt gedaan door Onze Minister van
      Financiën in overeenstemming met Onze Minister van Infrastructuur en Milieu en wordt niet eerder gedaan dan vier
      weken nadat het ontwerp aan de Tweede Kamer der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.2a
  - number: 8.2a.5
    text: |-
      Aan de goedkeuring van de algemene vergadering van aandeelhouders van de exploitant van de luchthaven zijn
      onderworpen de besluiten van het bestuur van de exploitant van de luchthaven omtrent investeringen welke een
      bedrag vereisen gelijk aan ten minste een tiende van het bedrag van de activa volgens de geconsolideerde balans met
      toelichting volgens de laatst vastgestelde jaarrekening van de exploitant van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.2a
  - number: '8.3'
    text: |-
      De uitoefening van de bevoegdheden die voortvloeien uit deze titel is gericht op het bevorderen van een optimaal
      gebruik van de luchthaven als kwalitatief hoogwaardig knooppunt van nationaal en internationaal luchtverkeer, met
      inachtneming van de grenzen die met het oog op de veiligheid, de geluidbelasting, de lokale luchtverontreiniging en
      de geurbelasting noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.3
  - number: '8.4'
    text: Bij algemene maatregel van bestuur wordt voor de luchthaven een luchthavenindelingbesluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.4
  - number: 8.5.1
    text: In het luchthavenindelingbesluit worden het luchthavengebied en het beperkingengebied vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.5
  - number: 8.5.2
    text: Als luchthavengebied wordt het gebied vastgesteld dat bestemd is voor gebruik als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.5
  - number: 8.5.3
    text: |-
      Als beperkingengebied wordt het gebied vastgesteld waar in verband met de nabijheid van de luchthaven met het oog
      op de veiligheid en de geluidbelasting beperkingen noodzakelijk zijn ten aanzien van de bestemming of het gebruik
      van de grond.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.5
  - number: 8.5.4
    text: |-
      Het luchthavengebied en het beperkingengebied overlappen elkaar niet. De gebieden kunnen bestaan uit niet
      aaneengesloten delen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.5
  - number: 8.5.5
    text: |-
      De gebieden worden langs elektronische weg en met gebruikmaking van een of meer ondergronden vastgelegd. Van een
      zodanig elektronisch document wordt tevens een papieren versie gemaakt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.5
  - number: 8.5.6
    text: |-
      Bij de vaststelling van het luchthavenindelingbesluit kan in ieder geval gebruik worden gemaakt van gegevens en
      onderzoeken die niet ouder zijn dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.5
  - number: '8.6'
    text: |-
      Het luchthavenindelingbesluit bevat voor het luchthavengebied regels omtrent de bestemming en het gebruik van de
      grond voor zover die regels noodzakelijk zijn met het oog op het gebruik van het gebied als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.6
  - number: 8.7.1
    text: |-
      Het luchthavenindelingbesluit bevat voor het beperkingengebied regels waarbij beperkingen zijn gesteld ten aanzien
      van de bestemming en het gebruik van de grond voor zover die beperkingen noodzakelijk zijn met het oog op de
      veiligheid en de geluidbelasting in verband met de nabijheid van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.7
  - number: 8.7.2
    text: 'Het besluit bevat in ieder geval regels omtrent beperking van:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.7
  - number: 8.7.2.a
    text: |-
      de bestemming en het gebruik van grond in verband met het externe-veiligheidsrisico vanwege het
      luchthavenluchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.7
  - number: 8.7.2.b
    text: de bestemming en het gebruik van grond in verband met de geluidbelasting vanwege het luchthavenluchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.7
  - number: 8.7.2.c
    text: |-
      de maximale hoogte van objecten in, op of boven de grond, in verband met de veiligheid van het
      luchthavenluchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.7
  - number: 8.7.2.d
    text: |-
      een bestemming die, of van een gebruik dat, vogels aantrekt, in verband met de veiligheid van het
      luchthavenluchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.7
  - number: 8.7.3
    text: |-
      Bij de regels, bedoeld in het tweede lid, onderdelen a en b, worden in ieder geval gronden aangewezen die niet
      bestemd of gebruikt worden voor woningen of andere in het besluit aangewezen gebouwen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.7
  - number: 8.7.4
    text: |-
      Elk besluit, volgend op het eerste luchthavenindelingbesluit, biedt een beschermingsniveau ten aanzien van externe
      veiligheid en geluidbelasting, dat voor ieder van deze aspecten, gemiddeld op jaarbasis vastgesteld, per saldo
      gelijkwaardig is aan of beter is dan het niveau zoals dat geboden werd door het eerste besluit.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.7
  - number: 8.8.1
    text: |-
      Bij de vaststelling van een bestemmingsplan of de beheersverordening, bedoeld in
      [artikel 3.38 van de Wet ruimtelijke ordening][ref1] voor een gebied dat is gelegen binnen het luchthavengebied of
      het beperkingengebied, wordt het luchthavenindelingbesluit in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 8.8.2
    text: |-
      Voor het gebied dat ligt binnen het luchthavengebied of het beperkingengebied, waarvoor geen bestemmingsplan
      of beheersverordening geldt in overeenstemming met het besluit en voor het bestemmingsplan geen toepassing
      is gegeven aan [artikel 8.9, derde lid][ref1], geldt het besluit als een voorbereidingsbesluit als bedoeld in
      [artikel 3.7 van de Wet ruimtelijke ordening][ref2]. Voor zover het besluit geldt als voorbereidingsbesluit, is
      [artikel 3.7, vijfde lid, van die wet][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 8.8.3
    text: |-
      De gemeenteraad is verplicht binnen een jaar of een andere bij het besluit te bepalen termijn nadat het besluit in
      werking is getreden het bestemmingsplan of de beheersverordening overeenkomstig het besluit vast te stellen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.8
  - number: 8.8.4
    text: |-
      Indien een bestemmingsplan of een beheersverordening niet in overeenstemming is met het besluit, is het
      college van burgemeester en wethouders verplicht aan degenen die inzage verlangen in het bestemmingsplan of de
      beheersverordening, tevens inzage te verlenen in het besluit.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.8
  - number: 8.9.1
    text: |-
      Bij de verlening van een omgevingsvergunning waarbij met toepassing van
      [artikel 2.12, eerste lid, onderdeel a, onder 1°, 2° of 3°, van de Wet algemene bepalingen omgevingsrecht][ref1]
      van het geldende bestemmingsplan wordt afgeweken en bij de toepassing van
      [artikel 3.3, derde lid, van die wet][ref2] wordt het luchthavenindelingbesluit in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0024779
        artikel: '3'
  - number: 8.9.2
    text: |-
      In afwijking van [artikel 3.3, tweede lid, van de Wet algemene bepalingen omgevingsrecht][ref1] duurt de in die
      artikelen bedoelde aanhouding totdat een bestemmingsplan dat in overeenstemming is met het besluit in werking is
      getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '3'
  - number: 8.9.3
    text: |-
      Bij de toepassing van [artikel 8.8, eerste lid][ref1],
      [artikel 3.6, eerste lid, onderdeel a en b, van de Wet ruimtelijke ordening][ref2], en de artikelen genoemd in
      het eerste lid, kan van het besluit worden afgeweken indien van Onze Minister van Infrastructuur en Milieu, in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, de verklaring is
      ontvangen dat hij tegen de afwijking geen bezwaar heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '3'
  - number: 8.9.4
    text: |-
      De verklaring van geen bezwaar die betrekking heeft op het luchthavengebied kan worden geweigerd met het oog op het
      gebruik van het gebied als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.9
  - number: 8.9.5
    text: |-
      De verklaring van geen bezwaar die betrekking heeft op het beperkingengebied kan worden geweigerd met het oog op de
      veiligheid en de geluidbelasting in verband met de nabijheid van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.9
  - number: 8.9.6
    text: |-
      [Artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing met betrekking tot de
      verklaring van geen bezwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '8.10'
    text: |-
      Voor zover het ontwerp van een bestemmingsplan zijn grondslag vindt in de uitvoering van het
      luchthavenindelingbesluit is [artikel 3.8, eerste lid, onderdeel d, van de Wet ruimtelijke ordening][ref1] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '8.11'
    text: |-
      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden een
      verklaring van geen bezwaar als bedoeld in [artikel 8.9, derde lid][ref2], en het besluit waarop de verklaring
      betrekking heeft als één besluit aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
  - number: 8.12.1
    text: |-
      Dit artikel is van toepassing op het oprichten of plaatsen van objecten waar
      geen omgevingsvergunning voor een bouw- of aanlegactiviteit als bedoeld in
      [artikel 2.1, eerste lid, onder a of b, van de Wet algemene bepalingen omgevingsrecht][ref1] voor is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.12
    references:
      - id: ref1
        bwb_id: BWBR0024779
        artikel: '2'
  - number: 8.12.2
    text: |-
      Het is verboden een object op te richten of te plaatsen indien dit in strijd is met een regel in het
      luchthavenindelingbesluit omtrent de maximale hoogte van objecten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.12
  - number: 8.12.3
    text: |-
      Onze Minister van Infrastructuur en Milieu kan ontheffing verlenen van het verbod. De ontheffing wordt slechts
      geweigerd in het belang van de veiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.12
  - number: 8.12.4
    text: |-
      De ontheffing wordt voor een bepaalde periode verleend. Aan de ontheffing kunnen beperkingen en voorschriften
      worden verbonden in het belang van de veiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.12
  - number: 8.12.5
    text: |-
      Onze Minister van Infrastructuur en Milieu stelt regels omtrent de vergoeding die de aanvrager van een ontheffing
      verschuldigd is voor de kosten van het verlenen van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.12
  - number: '8.13'
    text: |-
      De voordracht voor een luchthavenindelingbesluit wordt niet gedaan dan nadat het ontwerp in de Staatscourant is
      bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen vier weken na de dag waarop de bekendmaking is
      geschiedt, wensen en bedenkingen ter kennis van Onze Minister van Infrastructuur en Milieu te brengen. Gelijktijdig
      met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.13
  - number: '8.14'
    text: Artikel 8.13 is van overeenkomstige toepassing op het wijzigen van het luchthavenindelingbesluit.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.14
  - number: '8.15'
    text: Bij algemene maatregel van bestuur wordt voor de luchthaven een luchthavenverkeerbesluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.15
  - number: '8.16'
    text: Het luchthavenverkeerbesluit bevat een beschrijving van de luchtverkeerwegen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.16
  - number: 8.17.1
    text: |-
      Het luchthavenverkeerbesluit bevat regels omtrent het luchthavenluchtverkeer voor zover die regels noodzakelijk
      zijn met het oog op de veiligheid, de geluidbelasting, de lokale luchtverontreiniging en de geurbelasting.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.2
    text: 'Het besluit bevat in ieder geval regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.2.a
    text: de gevallen waarin van een luchtverkeerweg gebruik gemaakt wordt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.2.b
    text: een op beperking van belasting gerichte wijze van gebruik van het luchtruim in andere gevallen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.2.c
    text: de beschikbaarheid van de luchthaven voor het luchthavenluchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.3
    text: 'Het besluit kan regels bevatten omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.3.a
    text: de wijze van gebruik van de luchtverkeerwegen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.3.b
    text: |-
      de tijdstippen waarop, de frequentie waarmee en de categorieën van luchtvaartuigen waarmee van het luchtruim
      gebruik gemaakt wordt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.4
    text: |-
      De regels bevorderen het realiseren van een beschermingsniveau, waarbij de in het besluit beschreven grenswaarden
      met betrekking tot de door het luchthavenluchtverkeer veroorzaakte belasting ten aanzien van veiligheid, geluid en
      lokale luchtverontreiniging niet worden overschreden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.5
    text: 'Het besluit bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.5.a
    text: de grenswaarden voor het externe-veiligheidsrisico;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.5.b
    text: |-
      de grenswaarden voor de geluidbelasting, waarbij in ieder geval punten in of aan de rand van woonbebouwing in de
      nabijheid van de luchthaven bepaald worden met de grenswaarden die op ieder van die punten van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.5.c
    text: de grenswaarden voor de emissie van de stoffen die lokale luchtverontreiniging veroorzaken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.6
    text: |-
      Het besluit kan ten aanzien van de in het tweede en derde lid bedoelde onderwerpen, grenzen stellen aan de
      maatregelen die de inspecteur-generaal op grond van [artikel 8.22][ref1] kan treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: 8.17.7
    text: |-
      Elk besluit, volgend op het eerste luchthavenverkeerbesluit, biedt een beschermingsniveau ten aanzien van externe
      veiligheid, geluidbelasting en lokale luchtverontreiniging, dat voor ieder van deze aspecten, gemiddeld op
      jaarbasis vastgesteld, per saldo gelijkwaardig is aan of beter is dan het niveau zoals dat geboden werd door het
      eerste besluit.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: 8.17.8
    text: |-
      Bij de vaststelling van het luchthavenverkeerbesluit kan in ieder geval gebruik worden gemaakt van gegevens en
      onderzoeken die niet ouder zijn dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.17
  - number: '8.18'
    text: |-
      De exploitant van de luchthaven, de verlener van luchtverkeersdiensten en de luchtvaartmaatschappijen bevorderen
      het goede verloop van het luchthavenluchtverkeer overeenkomstig het luchthavenverkeerbesluit. Zij treffen
      daartoe zelf en in onderlinge samenwerking de voorzieningen die redelijkerwijs van hen kunnen worden gevergd om
      te bewerkstelligen dat de belasting vanwege het luchthavenluchtverkeer de in [artikel 8.17, vierde lid][ref1],
      bedoelde grenswaarden niet overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.18
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: '8.19'
    text: |-
      De exploitant van de luchthaven stelt de luchthaven beschikbaar overeenkomstig de regels van het
      luchthavenverkeerbesluit. De exploitant kan hiervan afwijken als dit in het belang van de veiligheid nodig is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.19
  - number: '8.20'
    text: |-
      Luchtverkeersdiensten worden verleend overeenkomstig de regels van het luchthavenverkeerbesluit. De verlener van de
      luchtverkeersdiensten kan hiervan afwijken als dit in het belang van de veiligheid nodig is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.20
  - number: 8.21.1
    text: |-
      De gezagvoerder neemt deel aan het luchthavenluchtverkeer overeenkomstig de regels van het
      luchthavenverkeerbesluit.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.21
  - number: 8.21.2
    text: De gezagvoerder kan afwijken van het eerste lid op advies van de verlener van luchtverkeersdiensten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.21
  - number: 8.21.3
    text: De gezagvoerder kan afwijken van het eerste lid als dit in het belang van de veiligheid nodig is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.21
  - number: 8.22.1
    text: |-
      Zodra de inspecteur-generaal constateert dat de in artikel 8.17, vierde lid, bedoelde grenswaarden zijn
      overschreden, schrijft hij maatregelen voor die naar zijn oordeel bijdragen aan het terugdringen van de belasting
      vanwege het luchthavenluchtverkeer binnen de grenswaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.22
  - number: 8.22.2
    text: |-
      De maatregelen hebben betrekking op de in artikel 8.17, tweede en derde lid, bedoelde onderwerpen en vallen binnen
      de in artikel 8.17, zesde lid, bedoelde grenzen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.22
  - number: 8.22.3
    text: |-
      De inspecteur-generaal trekt de maatregelen in of matigt deze voor zover zij naar zijn oordeel niet langer nodig
      zijn voor het terugdringen van de belasting vanwege het luchthavenluchtverkeer binnen de grenswaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.22
  - number: 8.22.4
    text: |-
      Voordat de inspecteur-generaal een maatregel voorschrijft stelt hij degene tot wie de maatregel is gericht in de
      gelegenheid zijn zienswijze kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.22
  - number: 8.22.5
    text: |-
      De artikelen 8.18 tot en met 8.21 zijn van overeenkomstige toepassing ten aanzien van de voorgeschreven
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.22
  - number: 8.23.1
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu, in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, kan indien ten gevolge van groot onderhoud van een baan het
      normale gebruik van een luchthaven naar hun oordeel ernstig wordt belemmerd:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23
  - number: 8.23.1.a
    text: vrijstelling worden verleend van een regel in het luchthavenverkeerbesluit;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23
  - number: 8.23.1.b
    text: |-
      een in het luchthavenverkeerbesluit vastgelegde grenswaarde voor de geluidbelasting in een bepaald punt worden
      vervangen door een andere grenswaarde.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23
  - number: 8.23.2
    text: |-
      Een vrijstelling kan slechts worden verleend voor een bepaalde in de vrijstelling vast te stellen termijn van ten
      hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23
  - number: 8.23.3
    text: |-
      Aan een vrijstelling kunnen beperkingen en voorschriften worden verbonden met het oog op de veiligheid, de
      geluidbelasting, de lokale luchtverontreiniging en de geurbelasting. De [artikelen 8.18 tot en met 8.21][ref1] zijn
      van overeenkomstige toepassing ten aanzien van de beperkingen en voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
  - number: 8.23.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op een vervanging als bedoeld in het eerste lid,
      onderdeel b.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23
  - number: 8.23.5
    text: |-
      Onze Minister van Infrastructuur en Milieu kan, in overeenstemming met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, indien ten gevolge van een bijzonder voorval het normale gebruik
      van een luchthaven naar hun oordeel ernstig wordt belemmerd vrijstelling verlenen van een regel in het
      luchthavenverkeerbesluit of een in het luchthavenverkeerbesluit vastgelegde grenswaarde vervangen. Het tweede en
      derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23
  - number: 8.23a.1
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu, in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, kan worden bepaald dat bij wijze van experiment wordt
      afgeweken van krachtens [artikel 8.15][ref1] gestelde voorschriften, mits de commissie regionaal overleg luchthaven
      Schiphol, bedoeld in [artikel 8.34][ref2] of een ander bij ministeriële regeling aan te wijzen regionaal orgaan,
      bij advies heeft aangegeven dat het experiment een gunstig effect kan hebben op de hinderbeleving. De afwijking kan
      bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.1
        afdeling: '8.3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.7'
  - number: 8.23a.1.a
    text: |-
      het verlenen van vrijstelling van een regel in het luchthavenverkeerbesluit voorzover deze de luchtverkeerwegen of
      het gebruik van het luchtruim en de beschikbaarheid van de banen betreft, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23a
  - number: 8.23a.1.b
    text: |-
      het vervangen van een in het luchthavenverkeerbesluit vastgelegde grenswaarde voor de geluidbelasting in een
      bepaald punt door een andere grenswaarde.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23a
  - number: 8.23a.2
    text: |-
      In de ministeriële regeling wordt het doel van het experiment vastgesteld, alsmede op welke wijze van welke
      voorschriften wordt afgeweken en op welke wijze eventuele nadelige gevolgen zo veel mogelijk worden beperkt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23a
  - number: 8.23a.3
    text: |-
      In de ministeriële regeling kan worden bepaald in hoeverre, op welke wijze en door wie eventuele nadelige gevolgen
      worden gecompenseerd. In dat geval is [artikel 8.31][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.6'
  - number: 8.23a.4
    text: |-
      Tevens worden in de ministeriële regeling regels gesteld over de uitvoering en de gevolgen van het experiment,
      over criteria aan de hand waarvan kan worden bepaald of het experiment wordt omgezet in een structurele wettelijke
      regeling, en worden voorzieningen getroffen voor onvoorziene gevallen die zich gedurende het experiment kunnen
      voordoen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23a
  - number: 8.23a.5
    text: |-
      Een experiment kan slechts worden toegestaan voor een bepaalde in de ministeriële regeling vast te stellen termijn
      van ten hoogste een jaar. Deze termijn kan eenmaal met maximaal een jaar worden verlengd. De looptijd van een
      experiment sluit zoveel mogelijk aan bij een gebruiksjaar. Bij voortijdige beëindiging van het experiment stelt
      Onze Minister van Infrastructuur en Milieu, in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer, een overgangsregeling vast.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23a
  - number: 8.23a.6
    text: |-
      Indien voor afloop van een experiment en in overeenstemming met de [artikelen 8.13][ref1], [8.14][ref2] of
      [8.24][ref3] een ontwerp is bekendgemaakt om het experiment om te zetten in een structurele wettelijke regeling,
      kan bij ministeriële regeling de termijn van het experiment worden verlengd tot het tijdstip waarop het ontwerp is
      vastgesteld en in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.2
        afdeling: '8.2'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.3.2
        afdeling: '8.3'
  - number: 8.23a.7
    text: |-
      Onze Minister van Infrastructuur en Milieu zendt, in overeenstemming met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer, voldoende tijdig voor het einde van de werkingsduur van een ministeriële
      regeling als bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten
      van het experiment in de praktijk, alsmede een standpunt inzake de voortzetting ervan anders dan als experiment.
      Onze Minister van Infrastructuur en Milieu bericht de beide kamers der Staten-Generaal bij vaststelling van deze
      ministeriële regeling wanneer en over de wijze waarop hij verslag zal doen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23a
  - number: 8.23a.8
    text: |-
      Een ministeriële regeling als bedoeld in het eerste lid wordt niet eerder vastgesteld dan nadat het voorstel voor
      advies is voorgelegd aan de commissie regionaal overleg luchthaven Schiphol, bedoeld in [artikel 8.34][ref1],
      in de Staatscourant en in een regionaal dag-, nieuws-, of huis-aan-huisblad is bekendgemaakt en aan een ieder de
      gelegenheid is geboden om binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter
      kennis van Onze Minister van Infrastructuur en Milieu te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.7'
  - number: 8.23a.9
    text: |-
      De commissie regionaal overleg luchthaven Schiphol, bedoeld in [artikel 8.34][ref1], danwel een ander per
      ministeriële regeling aan te wijzen orgaan, kan Onze Minister van Infrastructuur en Milieu verzoeken om een
      ministeriële regeling als bedoeld in het eerste lid vast te stellen. Onze Minister van Infrastructuur en Milieu, in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, overweegt het verzoek
      en deelt uiterlijk zes weken na ontvangst van het verzoek zijn overwegingen, met redenen omkleed, aan de commissie
      en aan de Tweede Kamer der Staten-Generaal mee.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.23a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.7'
  - number: '8.24'
    text: |-
      De artikelen 8.13 en 8.14 zijn van overeenkomstige toepassing op het voorbereiden en het wijzigen van het
      luchthavenverkeerbesluit.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.24
  - number: 8.24a.1
    text: |-
      De exploitant van de luchthaven is verplicht om met inachtneming van de bij of krachtens deze wet of de
      [Luchtvaartwet][ref1] gestelde bepalingen, luchthavenluchtverkeer ten behoeve van de burgerluchtvaart op de
      luchthaven toe te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.24a
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: 8.24a.2
    text: Het eerste lid is niet van toepassing op circuitvluchten, oefenvluchten en proefvluchten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.24a
  - number: 8.24a.3
    text: |-
      De exploitant is verplicht om in door Onze Minister van Infrastructuur en Milieu in overeenstemming met Onze
      Minister van Defensie aangewezen gevallen met inachtneming van de bij of krachtens deze wet of de Luchtvaartwet
      gestelde bepalingen, luchthavenluchtverkeer ten behoeve van de militaire luchtvaart op de luchthaven toe te laten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.24a
  - number: 8.25.1
    text: Het is verboden de luchthaven te exploiteren zonder vergunning van Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25
  - number: 8.25.2
    text: Een luchthavenexploitatievergunning wordt verleend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25
  - number: 8.25a
    text: |-
      De exploitant van de luchthaven is verplicht tot exploitatie van de luchthaven en treft met inachtneming
      van [artikel 8.3][ref1] daartoe de voorzieningen die nodig zijn voor een goede afwikkeling van het
      luchthavenluchtverkeer en het daarmee samenhangende personen- en goederenvervoer op de luchthaven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: 8.2.1
  - number: 8.25b.1
    text: 'Onze Minister van Infrastructuur en Milieu kan een vergunning intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25b
  - number: 8.25b.1.a
    text: |-
      de exploitant van de luchthaven zich schuldig maakt aan wanbeheer waardoor de continuïteit van de luchthaven in
      gevaar wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25b
  - number: 8.25b.1.b
    text: het nationale ruimtelijke beleid niet langer voorziet in een luchthaven op de desbetreffende locatie.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25b
  - number: 8.25b.2
    text: |-
      Onze Minister van Infrastructuur en Milieu kan op aanvraag van de exploitant van de luchthaven de vergunning
      intrekken indien het algemeen belang zich niet tegen die intrekking verzet.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25b
  - number: 8.25c
    text: |-
      Indien een ernstig vermoeden bestaat dat een omstandigheid als bedoeld in [artikel 8.25b, onderdeel a][ref1], zich
      dreigt voor te doen, kan Onze Minister van Infrastructuur en Milieu de exploitant van de luchthaven een aanwijzing
      geven om binnen een door hem te stellen termijn maatregelen te treffen ter voorkoming van wanbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25c
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25d.1
    text: |-
      De exploitant van de luchthaven stelt ten minste eenmaal per jaar de tarieven en voorwaarden vast voor de
      activiteiten van de exploitant van de luchthaven ten behoeve van het gebruik van de luchthaven door gebruikers. De
      exploitant van de luchthaven doet voorafgaande aan de periode waarop de tarieven en voorwaarden betrekking hebben,
      mededeling van de tarieven en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.2
    text: De tarieven en voorwaarden zijn redelijk en non-discriminatoir.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.3
    text: |-
      De tarieven kunnen worden gedifferentieerd uit een oogpunt van algemeen belang, met inbegrip van de bescherming
      van het milieu. De criteria voor deze tariefsdifferentiatie dienen differentiatie te kunnen rechtvaardigen en zijn
      objectief en transparant.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.4
    text: |-
      De tarieven voor de activiteiten, bedoeld in het eerste lid, zijn voor het geheel van de activiteiten
      kostengeoriënteerd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.5
    text: |-
      Onverminderd het vierde lid, zijn de tarieven voor de beveiliging van passagiers en hun bagage, alsmede vracht voor
      het geheel van de beveiligingsactiviteiten kostengeoriënteerd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.6
    text: |-
      Bij de vaststelling van de tarieven neemt de exploitant van de luchthaven de toegerekende opbrengsten in aanmerking
      uit overige activiteiten van de exploitant van de luchthaven die rechtstreeks verband houden met de activiteiten,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.7
    text: |-
      Bij de vaststelling van de tarieven neemt de exploitant van de luchthaven de kosten in aanmerking van structurele
      maatregelen voor de uitvoering van een bijzondere aanwijzing van Onze Minister van Veiligheid en Justitie, bedoeld
      in [artikel 37ac, tweede lid, van de Luchtvaartwet][ref1], voor zover die maatregelen betrekking hebben op de
      beveiliging van passagiers en hun bagage.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel37ac
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 37ac
  - number: 8.25d.8
    text: |-
      Bij de vaststelling van de tarieven kan, in afwijking van het vierde en vijfde lid, de exploitant van de luchthaven
      een bijdrage uit andere activiteiten dan die, bedoeld in het eerste en zesde lid, in aanmerking nemen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.9
    text: |-
      Bij de vaststelling van de tarieven wordt de bijdrage, bedoeld in het achtste lid, naar rato van de kosten
      toegerekend aan de activiteiten voor de beveiliging van passagiers en hun bagage, bedoeld in het vijfde lid, en de
      overige activiteiten ten behoeve van het gebruik van de luchthaven door gebruikers, bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.10
    text: |-
      De exploitant van de luchthaven verrekent bij de vaststelling van de tarieven, nadat deze zijn bepaald met
      inachtneming van het tweede tot en met negende lid, het verschil tussen de geraamde en de werkelijke opbrengsten en
      kosten in verband met de prognoses en de realisatie van het volume van het luchthavenluchtverkeer, het vervoer van
      passagiers en vracht en van de uitvoering van investeringen, zoals volgt uit de financiële verantwoording over het
      aan het moment van vaststelling van de tarieven voorafgaande boekjaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.11
    text: |-
      Bij de vaststelling van het tarief voor de beveiliging van passagiers en hun bagage, nadat deze is bepaald met
      inachtneming van het tweede tot en met negende lid, verrekent de exploitant van de luchthaven de extra opbrengst
      voor de beveiliging van passagiers en hun bagage die is verkregen nadat een structurele maatregel als bedoeld
      in het zevende lid, is ingetrokken, en het tarief voor de beveiliging van passagiers en hun bagage nog niet
      dienovereenkomstig is aangepast.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.12
    text: |-
      De exploitant van de luchthaven hanteert de tarieven en voorwaarden die ingevolge het eerste lid zijn vastgesteld,
      gedurende de periode waarop de vaststelling van de tarieven en voorwaarden betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.13
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.13.a
    text: |-
      de activiteiten ten behoeve van het gebruik van de luchthaven door gebruikers waarvoor tarieven en voorwaarden als
      bedoeld in het eerste lid, worden vastgesteld;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.13.b
    text: |-
      de activiteiten, bedoeld in het zesde lid, die rechtstreeks verband houden met de activiteiten ten behoeve van het
      gebruik van de luchthaven, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.13.c
    text: de wijze en het tijdstip waarop de mededeling, bedoeld in het eerste lid, plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.13.d
    text: de kostenoriëntatie, bedoeld in het vierde en vijfde lid;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.13.e
    text: het tijdstip van vaststelling en inwerkingtreding van de tarieven en voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.13.f
    text: |-
      de wijze waarop de exploitant van de luchthaven, zonodig in afwijking van de regels, bedoeld in onderdeel e,
      uitvoering geeft aan het zevende lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25d.14
    text: |-
      De voordracht voor een krachtens het dertiende lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25d
  - number: 8.25da.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een groep luchthavens die wordt geëxploiteerd door de exploitant van
      de luchthaven of, indien dit een ander is, een en dezelfde houder van de luchthavenexploitatievergunning, aanwijzen
      als luchthavennetwerk.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25da
  - number: 8.25da.2
    text: |-
      Onze Minister van Infrastructuur en Milieu kan de exploitant van het luchthavennetwerk toestemming verlenen om een
      gemeenschappelijk, transparant systeem van tarieven vast te stellen voor het gehele luchthavennetwerk.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25da
  - number: 8.25da.3
    text: |-
      Onze Minister van Infrastructuur en Milieu kan de exploitant van de luchthaven en de exploitant van elke
      deelnemende overige burgerluchthaven, voor zover zij luchtverbindingen voor dezelfde stad of agglomeratie
      verzorgen, toestemming verlenen om een gemeenschappelijk, transparant systeem van tarieven vast te stellen voor
      alle luchthavens die de luchtverbindingen voor dezelfde stad of agglomeratie verzorgen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25da
  - number: 8.25da.4
    text: |-
      In geval van een gemeenschappelijk, transparant systeem van tarieven, als bedoeld in het tweede of derde
      lid, doet de exploitant van de luchthaven aan de gebruikers mededeling van een voorstel voor de tarieven
      en voorwaarden en stelt hij de tarieven en voorwaarden vast voor de luchthaven Schiphol overeenkomstig
      de [artikelen 8.25d tot en met 8.25i][ref1]. De exploitant van elke deelnemende overige burgerluchthaven
      doet aan de gebruikers mededeling van een voorstel en stelt de tarieven vast overeenkomstig de
      [artikelen 8.25d, eerste, tweede, zesde en tiende lid][ref2], [8.25e][ref3], [8.25f][ref4], [8.25h][ref5],
      [8.25i][ref6] en [8.25j][ref7]. De exploitant en de deelnemende overige burgerluchthavens dragen zorg voor de
      noodzakelijke onderlinge afstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.25da
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
