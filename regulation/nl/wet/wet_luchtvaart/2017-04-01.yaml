        hoofdstuk: '8'
        paragraaf: 8.4.2.4
        afdeling: 8.4.2
  - number: 8.71a.b
    text: |-
      in de onderdelen a en b van het eerste lid in plaats van «het luchthavenverkeerbesluit» wordt gelezen: het
      luchthavenbesluit;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.71a
  - number: 8.71a.c
    text: |-
      in het zesde lid in plaats van «de [artikelen 8.13][ref1], [8.14][ref2] of [8.24][ref3]» wordt gelezen:
      [artikel 8.71][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.71a
    references:
