        paragraaf: 8.3.2.2
        afdeling: 8.3.2
  - number: '8.63'
    text: |-
      Deze afdeling is van toepassing op luchthavens van regionale betekenis waarvoor op grond van
      [artikel 8.1a, derde lid][ref1], vaststelling van een luchthavenbesluit niet is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.63
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.64.1
    text: |-
      Provinciale staten stellen bij verordening een luchthavenregeling vast voor een luchthaven. Provinciale
      staten kunnen de bevoegdheid tot het vaststellen van deze verordening niet overdragen als bedoeld in
      [artikel 152 van de Provinciewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel152
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.64
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '152'
  - number: 8.64.2
    text: |-
      Een luchthavenregeling bevat regels omtrent het luchthavenluchtverkeer voor zover die regels noodzakelijk zijn met
      het oog op de geluidbelasting vanwege het luchthavenluchtverkeer. Een luchthavenregeling kan tevens bevatten:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.64
  - number: 8.64.2.a
    text: grenswaarden die noodzakelijk zijn met het oog op het externe-veiligheidsrisico of de geluidbelasting; of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.64
  - number: 8.64.2.b
    text: regels die noodzakelijk zijn met het oog op het externe-veiligheidsrisico.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.64
  - number: 8.64.3
    text: |-
      De in de luchthavenregeling opgenomen regels of grenswaarden bevorderen in ieder geval dat niet wordt voldaan aan
      het criterium op grond waarvan volgens [artikel 8.1a, derde lid][ref1], vaststelling van een luchthavenbesluit
      is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.64
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.64.4
    text: |-
      In een luchthavenregeling wordt het luchthavengebied vastgesteld. Het luchthavengebied wordt vastgesteld met behulp
      van een kaart waarop de ligging van dit gebied is aangegeven. Deze kaart wordt vervaardigd op een schaal van ten
      minste 1 op 10 000.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.64
  - number: 8.64.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de in
      luchthavenregelingen op te nemen regels en grenswaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.64
  - number: 8.64.6
    text: |-
      De [artikelen 8.19][ref1], [8.21, eerste en derde lid][ref2], [8.45][ref3], [8.46][ref4],
      [8.47a tot en met 8.49][ref5] zijn van overeenkomstige toepassing.


