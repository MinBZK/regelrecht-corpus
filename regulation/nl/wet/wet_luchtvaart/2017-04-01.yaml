  - number: '8.68'
    text: |-
      Deze titel is van toepassing op luchthavens die op grond van [artikel 8.1, tweede lid][ref1], van nationale
      betekenis zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.68
    references:
