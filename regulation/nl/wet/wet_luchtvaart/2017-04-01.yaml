        afdeling: '8.5'
  - number: '8.74'
    text: |-
      De [artikelen 8.31 tot en met 8.33][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel8.74
    references:
