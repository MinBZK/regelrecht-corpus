  - number: 11.10.2
    text: De in het eerste lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.10
  - number: 11.10.3
    text: |-
      De ministeriële regeling, bedoeld in het eerste lid, onderdeel c, vervalt een jaar nadat zij in werking is
      getreden, dan wel indien binnen die termijn een voorstel tot wijziging van het eerste lid bij de Staten-Generaal
      is ingediend, op het tijdstip waarop dat voorstel is verworpen of, na tot wet te zijn verheven, in werking is
      getreden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.10
  - number: 11.10a.1
    text: |-
      Voor een overtreding of misdrijf waarop in de [artikelen 11.9][ref1] en [11.10][ref2] een geldboete van de derde
      of vierde categorie is gesteld, kan de rechter in de openbare lichamen Bonaire, Sint Eustatius en Saba telkens een
      geldboete van ten hoogste de derde categorie, onderscheidenlijk de vierde categorie opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.10a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.10a.2
    text: |-
      Handelen in strijd met de [artikelen 4.1, eerste en derde lid][ref1], alsmede als strafbare feiten aangeduide
      overtredingen van voorschriften krachtens [hoofdstuk 4][ref2] wordt in de openbare lichamen Bonaire, Sint Eustatius
      en Saba aangemerkt als een overtreding en wordt door de rechter gestraft met een gevangenisstraf van ten hoogste 6
      maanden, een taakstraf of een geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.10a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005555
        hoofdstuk: '4'
  - number: 11.11.1
    text: |-
      Bij veroordeling wegens overtreding van een der in [artikel 11.9, eerste lid][ref1], strafbaar gestelde feiten kan
      de bevoegdheid


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.11.1.a
    text: aan boord van een luchtvaartuig werkzaamheden te verrichten als lid van het boordpersoneel,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.11
  - number: 11.11.1.b
    text: werkzaamheden te verrichten aan een luchtvaartuig,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.11
  - number: 11.11.1.c
    text: luchtverkeersdienstverlening te geven,
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.11
  - number: 11.11.2
    text: |-
      Bij veroordeling wegens overtreding van een der in [artikel 11.10, eerste lid][ref1], strafbaar gestelde feiten kan
      een bevoegdheid als bedoeld in het eerste lid voor ten hoogste zes jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.11.3
    text: |-
      Indien tijdens het plegen van een der strafbare feiten, genoemd in [artikel 11.9, eerste lid][ref1], of bij
      of krachtens algemene maatregel van bestuur aangewezen, nog geen drie jaren zijn verlopen na het einde van de
      tijdsduur waarvoor bij een vroegere onherroepelijke veroordeling wegens een van die strafbare feiten of wegens een
      der in [artikel 11.10][ref2] bedoelde strafbare feiten de betrokkene een bevoegdheid als bedoeld in het eerste lid
      is ontzegd, kan hem die bevoegdheid voor ten hoogste zes jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.11.4
    text: |-
      Indien tijdens het plegen van een der strafbare feiten, genoemd in [artikel 11.10, eerste lid][ref1], nog geen zes
      jaren zijn verlopen na het einde van de tijdsduur waarvoor bij een vroegere onherroepelijke veroordeling wegens
      een van die strafbare feiten de betrokkene een bevoegdheid als bedoeld in het eerste lid is ontzegd, kan hem die
      bevoegdheid voor ten hoogste twaalf jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.11.5
    text: |-
      Onder vroegere onherroepelijke veroordeling als bedoeld in het derde onderscheidenlijk het vierde lid, wordt mede
      verstaan een vroegere onherroepelijke veroordeling door een strafrechter in een andere lidstaat van de Europese
      Unie wegens feiten soortgelijk aan de feiten, bedoeld in het derde onderscheidenlijk het vierde lid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.11
  - number: 11.12.1
    text: |-
      Het is degene, die weet of redelijkerwijs moet weten, dat een hem afgegeven bewijs van bevoegdheid of een daarop
      aangetekende bevoegdverklaring krachtens [artikel 2.5][ref1] van deze wet of krachtens de basisverordening is
      geschorst, verboden gedurende de tijd van schorsing werkzaamheden te verrichten, waartoe het geschorste bewijs of
      de geschorste bevoegdverklaring de bevoegdheid gaf.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.12
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.12.2
    text: |-
      Het is degene, die weet of redelijkerwijs moet weten, dat een hem afgegeven bewijs van bevoegdheid of bewijs
      van gelijkstelling krachtens [artikel 11.7][ref1] is ingevorderd, verboden gedurende de tijd, dat het bewijs is
      ingevorderd, werkzaamheden te verrichten, waartoe het geschorste bewijs of de geschorste bevoegdverklaring de
      bevoegdheid gaf.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.12
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.12.3
    text: |-
      Het is degene, die weet of redelijkerwijs moet weten, dat hem bij rechterlijke uitspraak de bevoegdheid tot het
      verrichten van werkzaamheden als bedoeld in [artikel 11.11][ref1] is ontzegd, verboden gedurende de tijd, dat hem
      die bevoegdheid is ontzegd, die werkzaamheden te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.12
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.13.1
    text: |-
      Bij de toepassing van [artikel 11.11][ref1] gaat de bijkomende straf in en verliest elk aan de veroordeelde
      ingevolge [artikel 2.2][ref2] van deze wet of de basisverordening afgegeven bewijs van bevoegdheid of ingevolge
      [artikel 2.7][ref3] van deze wet afgegeven bewijs van gelijkstelling zijn geldigheid voor de duur van de
      ontzegging, zodra de rechterlijke uitspraak voor wat genoemde bijkomende straf betreft, voor tenuitvoerlegging
      vatbaar is geworden. De uitspraak is, voor wat de bijkomende straf betreft, niet voor tenuitvoerlegging vatbaar,
      zolang de termijn, waarvoor hem bij een of meer andere rechterlijke uitspraken die bevoegdheid is ontzegd, nog niet
      verstreken is.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.13.2
    text: |-
      Bij de rechterlijke uitspraak kan worden bepaald, dat de tijd, gedurende welke het bewijs van bevoegdheid van
      de veroordeelde ingevolge [artikel 11.7][ref1] voor het tijdstip, waarop de uitspraak voor wat betreft de in
      dit artikel genoemde bijkomende straf voor tenuitvoerlegging vatbaar is geworden, ingehouden is geweest, dan
      wel ingevolge [artikel 11.8, tweede lid][ref2], een vliegverbod is opgelegd, op de duur van de in het eerste lid
      bedoelde bijkomende straf geheel of gedeeltelijk in mindering zal worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.13.3
    text: |-
      Voor wat betreft de in het eerste lid bedoelde bijkomende straf is
      [artikel 557, tweede lid, van het Wetboek van Strafvordering][ref1] op rechterlijke uitspraken niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel557
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '557'
  - number: 11.14.1
    text: |-
      Het is degene, die een luchtvaartuig bedient, verboden na een ongeval of een landing, waarbij een ander is gedood
      of letsel of schade aan een ander is toegebracht, zich van de plaats van dat ongeval of die landing te verwijderen,
      tenzij hij behoorlijk de gelegenheid heeft geboden tot vaststelling van zijn identiteit en van de identiteit van
      dat luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.14
  - number: 11.14.2
    text: |-
      Niet strafbaar is degene, die een luchtvaartuig bedient en die zich na een ongeval of landing, bedoeld in het
      eerste lid, van de plaats van dat ongeval of die landing verwijdert doch binnen twaalf uren na dat ongeval of
      die landing en voordat hij als verdachte is aangehouden of verhoord, vrijwillig kennis geeft aan een van de
      in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren en daarbij zijn identiteit en de
      identiteit van het betrokken luchtvaartuig bekendmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 11.14a
    text: |-
      De Autoriteit Consument en Markt is belast met het toezicht op de naleving van het bij of krachtens de
      [artikelen 8.25d tot en met 8.25h][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.14a
