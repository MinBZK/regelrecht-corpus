        paragraaf: 8.5.3
        afdeling: '8.5'
  - number: 10.37.1
    text: |-
      De in [artikel 10.25][ref1] bedoelde commissie wordt in ieder geval uitgebreid met een vertegenwoordiger van degene
      aan wie een vergunning voor burgermedegebruik is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.2.6
        afdeling: 10.3.2
  - number: 10.37.2
    text: |-
      De in [artikel 10.25][ref1] bedoelde commissie kan worden uitgebreid met vertegenwoordigers van
      rechtspersoonlijkheid bezittende gebruikersorganisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.37
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.2.6
        afdeling: 10.3.2
  - number: '10.38'
    text: |-
      Deze afdeling is van toepassing op militaire luchthavens waarvoor op grond van [artikel 10.12][ref1] vaststelling
      van een luchthavenbesluit niet is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.38
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        afdeling: 10.3.1
  - number: 10.39.1
    text: Bij regeling van Onze Minister van Defensie kan voor een luchthaven een luchthavenregeling worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.39
  - number: 10.39.2
    text: |-
      In een luchthavenregeling wordt het luchthavengebied vastgesteld. Een luchthavenregeling kan tevens een grenswaarde
      voor geluidbelasting in de vorm van een maximum aantal vliegtuigbewegingen per jaar bevatten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.39
  - number: 10.39.3
    text: |-
      Op de voorbereiding of de wijziging van een luchthavenregeling is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.39
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 10.39.4
    text: 'In een luchthavenregeling kunnen regels worden gegeven ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.39
  - number: 10.39.4.a
    text: de aard en de omvang van het gebruik van de luchthaven;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.39
  - number: 10.39.4.b
    text: |-
      het toegestane luchthavenluchtverkeer voor zover die regels noodzakelijk zijn met het oog op de veiligheid en de
      geluidbelasting.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.39
  - number: 10.39.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van luchthavens of categorieën luchthavens
      regels worden gegeven ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.39
  - number: 10.39.5.a
    text: de aanleg, inrichting en uitrusting;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.39
  - number: 10.39.5.b
    text: het gebruik van de luchthaven, mede met het oog op de veiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.39
  - number: 10.39.6
    text: |-
      Het luchthavengebied wordt vastgesteld met behulp van een kaart waarop de ligging van dit gebied is aangegeven.
      Deze kaart wordt vervaardigd op een schaal van ten minste 1 op 10 000.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.39
  - number: '10.40'
    text: |-
      Onze Minister van Defensie draagt er zorg voor dat het luchthavenluchtverkeer geschiedt overeenkomstig de
      luchthavenregeling.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.40
  - number: 10.41.1
    text: |-
      Zodra Onze Minister van Defensie constateert dat de in [artikel 10.39, tweede lid][ref1], bedoelde grenswaarde is
      overschreden, schrijft hij maatregelen voor die naar zijn oordeel bijdragen aan het terugdringen van de belasting
      vanwege het luchthavenluchtverkeer binnen de gestelde grenswaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.41
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
        paragraaf: 10.3.4.2
        afdeling: 10.3.4
  - number: 10.41.2
    text: |-
      Onze Minister van Defensie trekt de maatregelen in of matigt deze voor zover de maatregelen naar zijn oordeel niet
      langer nodig zijn voor het terugdringen van de belasting vanwege het luchthavenluchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.41
  - number: 10.42.1
    text: |-
      Onze Minister van Defensie kan voor een luchthaven indien ten gevolge van groot onderhoud van een baan of door een
      bijzonder voorval het normale gebruik van de luchthaven naar zijn oordeel ernstig wordt belemmerd, of in verband
      met bijzondere redenen van nationale of bondgenootschappelijke aard vrijstelling verlenen van een bepaling in de
      luchthavenregeling.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.42
  - number: 10.42.2
    text: |-
      Een vrijstelling kan slechts worden verleend voor een bepaalde in de vrijstelling vast te stellen termijn van ten
      hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.42
  - number: 10.42.3
    text: |-
      Aan de vrijstelling kunnen beperkingen en voorschriften worden verbonden met het oog op de veiligheid of de
      geluidbelasting.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.42
  - number: '10.43'
    text: |-
      Onze Minister van Defensie registreert het feitelijk gebruik van de luchthaven. Bij regeling van Onze Minister van
      Defensie in overeenstemming met Onze Minister van Infrastructuur en Milieu worden regels gesteld omtrent de wijze
      van registratie en openbaarmaking van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.43
  - number: 10.44.1
    text: |-
      Van het in [artikel 8.1a, eerste lid][ref1], genoemde verbod kan vrijstelling worden verleend door Onze Minister
      van Defensie ten behoeve van de militaire luchtvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.44
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
  - number: 10.44.2
    text: Aan de vrijstelling kunnen beperkingen en voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel10.44
  - number: 11.1.1
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet, met uitzondering van de
      [artikelen 8.25d tot en met 8.25h][ref1], bepaalde en het bij of krachtens de basisverordening bepaalde, zijn
      belast:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 11.1.1.a
    text: |-
      de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren, met dien verstande dat dit
      toezicht zich niet uitstrekt tot het bepaalde bij of krachtens [titel 6.5][ref2] en de [artikelen 10.7][ref3] en
      [10.8][ref4] van deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0005555
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: 11.1.1.b
    text: |-
      voor zover het betreft de burgerluchtvaart de hiertoe bij besluit van Onze Minister van Infrastructuur en Milieu
      aangewezen ambtenaren; de aanwijzing kan inhouden, dat de betrokken ambtenaar slechts belast is met het toezicht
      op de naleving van een of enkele in die aanwijzing genoemde hoofdstukken of artikelen gesteld bij of krachtens
      deze wet;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1
  - number: 11.1.1.c
    text: |-
      voor zover het betreft het vervoer van gevaarlijke stoffen als bedoeld in [titel 6.5][ref1] en de
      [artikelen 10.7][ref2] en [10.8][ref3] van deze wet, met luchtvaartuigen waarvan de krijgsmacht of de krijgsmacht
      van een andere mogendheid houder is, de hiertoe bij besluit van Onze Minister van Defensie aangewezen ambtenaren;
      de aanwijzing kan inhouden dat de betrokken ambtenaar slechts belast is met het toezicht op de naleving van een of
      enkele in die aanwijzing genoemde artikelen gesteld bij of krachtens deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: 11.1.1.d
    text: |-
      voor zover het betreft [titel 8A.6][ref1] de hiertoe bij besluit van Onze Minister van Infrastructuur en Milieu
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk8a
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: 8a
  - number: 11.1.2
    text: |-
      Met het toezicht op de naleving van hetgeen bepaald is bij of krachtens de verordeningen als bedoeld in
      [artikel 11.15, onderdeel b, onder 1° tot en met 8° en 10° tot en met 11°][ref1], zijn belast de hiertoe bij
      besluit van Onze Minister van Infrastructuur en Milieu aangewezen ambtenaren. De aanwijzing kan inhouden, dat de
      betrokken ambtenaar slechts belast is met het toezicht op de naleving van een of enkele in die aanwijzing genoemde
      hoofdstukken of artikelen gesteld bij of krachtens een van de genoemde verordeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
        paragraaf: 11.2.1
  - number: 11.1.3
    text: |-
      Onze Minister van Infrastructuur en Milieu kan met het oog op de coördinatie van het beleid ten aanzien van het
      toezicht algemene aanwijzingen geven aan de ambtenaren, bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1
  - number: 11.1.4
    text: |-
      Van een besluit als bedoeld in het eerste lid, de onderdelen b tot en met d, of het tweede lid wordt mededeling
      gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1
  - number: 11.1a.1
    text: |-
      Indien een natuurlijke of rechtspersoon voldoet aan de in Bijlage I van de luchtvaartnavigatiedienstenverordening
      genoemde eisen, verleent Onze Minister van Infrastructuur en Milieu op aanvraag een erkenning om de in artikel 2,
      tweede lid, van die verordening bedoelde inspecties en onderzoeken uit te voeren.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1a
  - number: 11.1a.2
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1a
  - number: 11.1a.2.a
    text: de in Bijlage I van de luchtvaartnavigatiedienstenverordening genoemde eisen;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1a
  - number: 11.1a.2.b
    text: de aanvraag, verlening en verlenging van een erkenning;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1a
  - number: 11.1a.2.c
    text: |-
      de vergoeding die de aanvrager is verschuldigd ter zake van de kosten van de handelingen met betrekking tot de
      aanvraag en verlening van de erkenning;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1a
  - number: 11.1a.2.d
    text: |-
      het tarief, dat een houder van een erkenning is verschuldigd ter zake van de kosten van toezicht. Onder het
      toezicht op de naleving van de in het eerste lid bedoelde eisen behoort in ieder geval het periodiek en in
      voorkomend geval steekproefsgewijs onderzoeken van een houder.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1a
  - number: 11.1a.3
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een erkenning geheel of gedeeltelijk schorsen, indien een ernstig
      vermoeden rijst dat de houder van de erkenning:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1a
  - number: 11.1a.3.a
    text: niet voldoet aan de in het eerste lid bedoelde eisen, of
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1a
  - number: 11.1a.3.b
    text: ter verkrijging van de erkenning onjuiste of onvolledige gegevens heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1a
  - number: 11.1a.4
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een erkenning intrekken wegens de in het derde lid genoemde redenen
      of indien de erkenning gedurende tenminste drie maanden is geschorst.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.1a
  - number: 11.2.1
    text: |-
      De toezichthouders kunnen hun bevoegdheid inzage te vorderen van zakelijke gegevens en bescheiden niet uitoefenen
      op taxi-, start- en landingsbanen van een luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2
  - number: 11.2.2
    text: |-
      Indien de toezichthouders toegang verlangen tot militaire terreinen of gebouwen geschiedt zulks eerst na overleg
      met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2
  - number: 11.2.3
    text: |-
      In geval van onmiddellijke dreiging van gevaar zijn de toezichthouders bevoegd het bedienen of opstijgen van
      luchtvaartuigen in strijd met het bij of krachtens deze wet bepaalde te verbieden of te beletten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2
  - number: 11.2.4
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing bij uitoefening van de
      bevoegdheid door toezichthouders buiten het vluchtinformatiegebied Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 11.2.5
    text: |-
      Voor de werking van dit artikel, met uitzondering van het vierde lid, wordt onder toezichthouders mede begrepen de
      inspecteur, bedoeld in [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: 11.2a.1
    text: |-
      Tot het toezicht op de naleving van de verplichtingen, voortvloeiend uit de erkenning, bedoeld in
      [artikel 3.25][ref1] van deze wet en artikel 5, tweede lid, van de basisverordening, behoort in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: 11.2a.1.a
    text: het periodiek onderzoeken van het erkende bedrijf;
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2a
  - number: 11.2a.1.b
    text: het steekproefsgewijs onderzoeken van door het erkende bedrijf vervaardigde ontwerpen, producten of onderdelen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2a
  - number: 11.2a.2
    text: |-
      Tot het toezicht op de naleving van de verplichtingen, voortvloeiend uit de AOC, bedoeld in
      [artikel 4.1, tweede lid][ref1], van deze wet en artikel 8, tweede lid, van de basisverordening, behoort in ieder
      geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '4'
        hoofdstuk: '4'
  - number: 11.2a.2.a
    text: het periodiek onderzoeken van de houder van de AOC, en
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2a
  - number: 11.2a.2.b
    text: het uitvoeren van inspectievluchten.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2a
  - number: 11.2a.3
    text: |-
      De houder van een erkenning of een AOC is gehouden tot betaling, overeenkomstig door Onze Minister van
      Infrastructuur en Milieu te stellen regels, van het door Onze Minister van Infrastructuur en Milieu ter zake van de
      kosten van toezicht vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2a
  - number: 11.2b.1
    text: |-
      Onze Minister van Infrastructuur en Milieu kan ten behoeve van het toezicht op de naleving van de verplichting,
      bedoeld in [artikel 8.25a][ref1], een onderzoek instellen bij de exploitant van de luchthaven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2b
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 11.2b.2
    text: |-
      Met het onderzoek zijn belast de krachtens [artikel 11.1, eerste lid][ref1], aangewezen toezichthouders.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2b
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.2b.3
    text: |-
      In afwijking van het tweede lid, kan Onze Minister van Infrastructuur en Milieu het onderzoek laten verrichten door
      een of meer aangewezen deskundigen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2b
  - number: 11.2b.4
    text: De ingevolge het derde lid aangewezen deskundigen horen gebruikers.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2b
  - number: 11.2b.5
    text: Na afloop van het onderzoek wordt daarvan een rapport opgemaakt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2b
  - number: 11.2b.6
    text: Een afschrift van het rapport wordt gezonden aan de exploitant van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2b
  - number: 11.2b.7
    text: |-
      De exploitant van de luchthaven wordt gedurende vier weken na de toezending van het rapport, in de gelegenheid
      gesteld om schriftelijk of mondeling zijn zienswijze daaromtrent naar voren te brengen. Van hetgeen mondeling naar
      voren is gebracht, wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2b
  - number: 11.2b.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het in het eerste lid
      bedoelde onderzoek.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.2b
  - number: 11.3.1
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn belast de bij of krachtens
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren, alsmede de bij besluit van Onze
      Minister van Infrastructuur en Milieu, respectievelijk Onze Minister van Defensie aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 11.3.2
    text: |-
      De opsporingsambtenaren zijn bevoegd het verrichten van werkzaamheden aan boord van luchtvaartuigen of het bedienen
      of opstijgen van luchtvaartuigen in strijd met het bij of krachtens deze wet bepaalde te verbieden of te beletten
      en voor zover het een burgerluchtvaartuig betreft, het luchtvaartuig, waarmee de overtreding wordt begaan naar een
      door hen aangewezen plaats over te brengen of te doen overbrengen en aldaar in bewaring te stellen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.3
  - number: 11.3.3
    text: |-
      De betrokken ambtenaar maakt van de inbewaringstelling proces-verbaal op, dat hij binnen vierentwintig uur zendt
      aan de officier van justitie van de rechtbank binnen het rechtsgebied waarvan de inbewaringstelling geschiedt.
      Een afschrift van het proces-verbaal wordt tegelijkertijd uitgereikt of toegezonden aan de gezagvoerder en aan de
      houder van het betrokken luchtvaartuig. [Artikel 11.7, vierde lid][ref1], is ten aanzien van de gezagvoerder en de
      houder van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.3.4
    text: |-
      De kosten verbonden aan de uitvoering van het tweede lid kunnen door Onze Minister van Infrastructuur en Milieu
      worden ingevorderd bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.3
  - number: 11.4.1
    text: |-
      Op eerste vordering van een opsporingsambtenaar is degene, die op grond van [artikel 2.1][ref1] van deze wet of
      artikel 7, tweede lid, van de basisverordening in het bezit dient te zijn van een bewijs van bevoegdheid, een
      bewijs van gelijkstelling of een medische verklaring, verplicht dat bewijs of die verklaring behoorlijk ter inzage
      af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.4.2
    text: |-
      Op eerste vordering van een opsporingsambtenaar is het lid van het boordpersoneel, dat werkzaamheden verricht
      of aanstalten maakt werkzaamheden te gaan verrichten, verplicht zijn medewerking te verlenen aan een voorlopig
      onderzoek van uitgeademde lucht en daartoe volgens de door de opsporingsambtenaar te geven aanwijzingen ademlucht
      te blazen in een door die ambtenaar aangewezen apparaat.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.4
  - number: 11.5.1
    text: |-
      Een opsporingsambtenaar kan het lid van het boordpersoneel van wie, uit het in [artikel 11.4, tweede lid][ref1],
      bedoelde onderzoek of op andere wijze, naar het oordeel van de opsporingsambtenaar gebleken is dat hij onder
      zodanige invloed van een stof, als bedoeld in [artikel 2.12, eerste lid][ref2], van deze wet, of paragraaf 7,
      onderdeel g, van bijlage IV bij de basisverordening, verkeert, dat hij onvoldoende in staat is zijn werkzaamheden
      behoorlijk te verrichten, een vliegverbod opleggen voor de tijd gedurende welke redelijkerwijs verwacht mag worden
      dat deze toestand zal voortduren, tot ten hoogste vierentwintig uren. De vorige volzin is van overeenkomstige
      toepassing op het lid van het boordpersoneel, dat aanstalten maakt zijn werkzaamheden te gaan verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.5.2
    text: |-
      In geval van verdenking van overtreding van [artikel 2.12, tweede lid][ref1], kan een opsporingsambtenaar aan het
      betreffende lid van het boordpersoneel een vliegverbod opleggen tot ten hoogste vierentwintig uren.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.5.3
    text: |-
      De opsporingsambtenaar, die een verbod als bedoeld in het eerste of tweede lid oplegt, legt dit vast in een
      beschikking die het tijdstip van ingang en de duur van het verbod bevat.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.5
  - number: 11.5.4
    text: |-
      Het is een lid van het boordpersoneel verboden de werkzaamheden, die hij moet verrichten, te verrichten gedurende
      de tijd waarvoor een vliegverbod als bedoeld in het eerste of tweede lid, geldt.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.5
  - number: 11.6.1
    text: |-
      Bij verdenking dat een lid van het boordpersoneel werkzaamheden heeft verricht in strijd met
      [artikel 2.12, eerste lid][ref1], van deze wet, paragraaf 7, onderdeel g, van bijlage IV bij de basisverordening,
      of artikel 2.12, derde lid, van deze wet kan de opsporingsambtenaar hem bevelen zijn medewerking te verlenen aan
      een onderzoek als bedoeld in artikel 2.12, derde lid, onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6.2
    text: |-
      Het lid van het boordpersoneel aan wie het in het eerste lid bedoelde bevel is gegeven, is verplicht ademlucht
      te blazen in een voor het onderzoek bestemd apparaat en gevolg te geven aan alle door de opsporingsambtenaar ten
      dienste van het onderzoek gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.6
  - number: 11.6.3
    text: |-
      De in het tweede lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat het verlenen
      van medewerking aan een ademonderzoek voor hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.6
  - number: 11.6.4
    text: |-
      In het geval, bedoeld in het derde lid, dan wel indien de medewerking van de verdachte niet heeft geleid tot
      een voltooid ademonderzoek, kan de opsporingsambtenaar de verdachte vragen of hij zijn toestemming geeft tot het
      verrichten van een onderzoek als bedoeld in [artikel 2.12, derde lid, onder b][ref1]. Gelijke bevoegdheid heeft de
      opsporingsambtenaar, indien het vermoeden bestaat dat de verdachte onder invloed van een andere in artikel 2.12,
      eerste lid, van deze wet of paragraaf 7, onderdeel g, van bijlage IV bij de basisverordening bedoelde stof dan
      alcoholhoudende drank verkeert.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6.5
    text: |-
      Indien het lid van het boordpersoneel zijn op grond van het vierde lid gevraagde toestemming niet verleent, kan
      de officier van justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van
      Justitie aangewezen ambtenaren van politie hem bevelen zich te onderwerpen aan een bloedonderzoek.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.6
  - number: 11.6.6
    text: |-
      Het lid van het boordpersoneel aan wie is bevolen zich aan een bloedonderzoek te onderwerpen is verplicht aan dit
      bevel gevolg te geven en zijn medewerking te verlenen; hem wordt door een arts zoveel bloed afgenomen als voor het
      onderzoek noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.6
  - number: 11.6.7
    text: |-
      De in het zesde lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat afname van
      bloed bij hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.6
  - number: 11.6.8
    text: |-
      De krachtens het zevende lid vrijgestelde personen zijn verplicht mee te werken aan een door de officier van
      justitie, door een hulpofficier van justitie of door een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren van politie bevolen onderzoek teneinde op andere wijze dan door bloedonderzoek het gebruik
      van de in [artikel 2.12, eerste lid][ref1], van deze wet of paragraaf 7, onderdeel g, van bijlage IV bij de
      basisverordening bedoelde stoffen of het in 2.12, derde lid, onder *b* genoemde gehalte vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6.9
    text: |-
      Indien de verdachte niet in staat is zijn wil kenbaar te maken, kan hem met toestemming van de officier van
      justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen opsporingsambtenaren, door een arts de in het zesde lid bedoelde hoeveelheid bloed worden afgenomen.
      Een onderzoek van het bloed vindt niet plaats dan nadat de verdachte in de gelegenheid is gesteld zijn toestemming
      daartoe te geven. Zo nodig kan hem overeenkomstig het bepaalde in het vijfde lid worden bevolen zijn medewerking te
      verlenen. De verdachte, aan wie een zodanig bevel is gegeven, is verplicht zijn medewerking te verlenen. Indien de
      verdachte weigert zijn medewerking te verlenen, wordt het bloedmonster vernietigd.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.6
  - number: 11.6.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven omtrent de wijze van uitvoering van
      artikel 11.4, tweede lid, en van dit artikel. Deze regels kunnen mede betrekking hebben op de mogelijkheid tot het
      doen verrichten van een tegenonderzoek. Bij regeling van Onze Minister van Justitie worden in de bij die algemene
      maatregel aangegeven gevallen voorschriften ter uitvoering van die regels vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.6
  - number: 11.7.1
    text: |-
      Op de eerste vordering van een opsporingsambtenaar is het lid van het boordpersoneel, tegen wie door een van die
      personen ter zake van overtreding van:
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.7
  - number: 11.7.1.a
    text: |-
      [artikel 2.12][ref1], indien bij een onderzoek als bedoeld in het derde lid, onderdeel a respectievelijk onderdeel
      b, van dat artikel blijkt of bij gebreke van een dergelijk onderzoek een ernstig vermoeden bestaat dat het
      alcoholgehalte van het lid van het boordpersoneel hoger is dan tweehonderdzeventig microgram (270 µg) alcohol per
      liter uitgeademde lucht respectievelijk drievijfde milligram (0,6 mg) alcohol per milliliter bloed, of


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.7.1.b
    text: |-
      [artikel 11.6, tweede, zesde, achtste en negende lid][ref1], proces-verbaal wordt opgemaakt,


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.7.2
    text: |-
      Het ingevorderde bewijs van bevoegdheid of bewijs van gelijkstelling wordt, tegelijk met het proces-verbaal,
      onverwijld opgezonden aan de betrokken officier van justitie. Deze is bevoegd het ingevorderde bewijs van
      bevoegdheid of bewijs van gelijkstelling onder zich te houden, totdat de rechterlijke uitspraak in kracht van
      gewijsde is gegaan of, indien bij die uitspraak het lid van het boordpersoneel de bevoegdheid een luchtvaartuig
      te bedienen is ontzegd, tot het tijdstip waarop die uitspraak, voor wat betreft de bijkomende straf der ontzegging
      voor tenuitvoerlegging vatbaar is geworden. In het laatste geval levert de ambtenaar, na het bovenbedoelde
      tijdstip, het bewijs van bevoegdheid of van gelijkstelling in bij Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.7
  - number: 11.7.3
    text: |-
      Indien de officier van justitie binnen tien dagen na de dag van invordering niet gebruik maakt van de in
      het tweede lid bedoelde bevoegdheid, geeft hij het ingevorderde bewijs onverwijld terug aan de houder.
      Teruggave vindt eveneens plaats, indien ernstig rekening moet worden gehouden met de mogelijkheid, dat aan
      de houder in geval van veroordeling geen onvoorwaardelijke ontzegging van een bevoegdheid als bedoeld in
      [artikel 11.11, tweede lid][ref1], zal worden opgelegd, dan wel geen onvoorwaardelijke ontzegging van langere duur
      dan de tijd gedurende welke het bewijs is ingevorderd of ingevorderd geweest, of indien het onderzoek van de zaak
      op de terechtzitting niet binnen zes maanden na de dag van invordering is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.7.4
    text: |-
      De opsporingsambtenaar, die gebruik maakt van de in het eerste lid bedoelde bevoegdheid, en de officier van
      justitie, die gebruik maakt van de in het tweede lid bedoelde bevoegdheid, doen daarvan onverwijld mededeling aan
      Onze Minister van Infrastructuur en Milieu. Indien de officier van justitie het ingevorderde bewijs van bevoegdheid
      of bewijs van gelijkstelling aan de houder teruggeeft, doet hij daarvan op gelijke wijze mededeling.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.7
  - number: 11.7.5
    text: |-
      In geval van toepassing van het eerste of het tweede lid kan iedere belanghebbende bij klaagschrift daartegen
      opkomen. Het klaagschrift wordt ingediend bij de griffie van het gerecht in feitelijke aanleg binnen welks
      rechtsgebied het feit, dat tot toepassing van het eerste of het tweede lid van dit artikel aanleiding heeft
      gegeven, werd gepleegd dan wel ingevolge [artikel 4 van het Wetboek van Strafvordering][ref1] geacht wordt te zijn
      gepleegd. De rechtbank geeft zo spoedig mogelijk, na de belanghebbende, desverlangd bijgestaan door diens raadsman,
      te hebben gehoord, althans opgeroepen, zijn met redenen omklede beschikking, welke onverwijld aan de belanghebbende
      wordt betekend. Tegen de beschikking kan het openbaar ministerie binnen twee weken daarna en de belanghebbende
      binnen twee weken na de betekening beroep in cassatie instellen. De Hoge Raad beslist zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel4
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '4'
  - number: 11.7.6
    text: |-
      Indien de zaak eindigt zonder oplegging van straf of maatregel of met zodanige oplegging, doch op grond
      van een feit waarvoor toepassing van het eerste of tweede lid niet is toegelaten, kan de rechter op
      verzoek van de gewezen verdachte hem een vergoeding ten laste van de Staat toekennen voor de schade,
      die hij ten gevolge van die toepassing heeft geleden. Onder schade is begrepen het nadeel, dat niet in
      vermogensschade bestaat. De [artikelen 89, derde tot en met zesde lid][ref1], [90][ref2], [91][ref3] en
      [93 van het Wetboek van Strafvordering][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel93
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '90'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '91'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '93'
  - number: 11.8.1
    text: |-
      Indien het proces-verbaal, bedoeld in [artikel 11.7, eerste lid][ref1], betreft een lid van het boordpersoneel
      als bedoeld in [artikel 10.1, tweede lid][ref2], stelt de opsporingsambtenaar onverwijld, voor de afloop van
      de in [artikel 11.5, eerste lid][ref3], bedoelde periode, de officier van justitie bij het gerecht, bedoeld in
      [hoofdstuk II][ref4], titel [I][ref5], [III][ref6] of [IV van de Wet militaire strafrechtspraak][ref7] daarvan
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004789#HoofdstukII
      [ref5]: https://wetten.overheid.nl/BWBR0004789#HoofdstukI
      [ref6]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIII
      [ref7]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref4
        bwb_id: BWBR0004789
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0004789
        hoofdstuk: I
      - id: ref6
        bwb_id: BWBR0004789
        hoofdstuk: III
      - id: ref7
        bwb_id: BWBR0004789
        hoofdstuk: IV
  - number: 11.8.2
    text: |-
      De officier van justitie, bedoeld in het eerste lid, is bevoegd het betrokken lid van het boordpersoneel een
      vliegverbod op te leggen, totdat de rechterlijke uitspraak in kracht van gewijsde is gegaan of, indien bij die
      uitspraak het lid van het boordpersoneel de bevoegdheid een luchtvaartuig te bedienen is ontzegd, tot het tijdstip
      waarop die uitspraak, voor wat betreft de bijkomende straf der ontzegging voor tenuitvoerlegging vatbaar is
      geworden. De betrokken officier van justitie stelt hiervan onverwijld Onze Minister van Defensie in kennis.
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.8
  - number: 11.8.3
    text: |-
      Indien de officier van justitie binnen tien dagen na de dag van invordering niet gebruik maakt van de in het tweede
      lid bedoelde bevoegdheid, heft hij het vliegverbod op. Opheffing vindt eveneens plaats, indien ernstig rekening
      moet worden gehouden met de mogelijkheid, dat aan de houder in geval van veroordeling geen onvoorwaardelijke
      ontzegging van een bevoegdheid, bedoeld in [artikel 11.11, tweede lid][ref1], zal worden opgelegd, dan wel geen
      onvoorwaardelijke ontzegging van langere duur wordt opgelegd dan de tijd gedurende welke het vliegverbod geldt,
      of indien het onderzoek van de zaak op de terechtzitting niet binnen zes maanden na de dag van oplegging van het
      vliegverbod is aangevangen. De betrokken officier van justitie stelt hiervan onverwijld Onze Minister van Defensie
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.8.4
    text: |-
      In geval van toepassing van het tweede lid kan iedere belanghebbende bij klaagschrift daartegen in beroep komen.
      Artikel 11.7, vijfde lid, is van overeenkomstige toepassing met dien verstande, dat het klaagschrift wordt
      ingediend bij de griffie van het gerecht in feitelijke aanleg, bedoeld in [hoofdstuk II][ref1], titel [I][ref2],
      [III][ref3] of [IV van de Wet militaire strafrechtspraak][ref4] en de beschikking van de rechtbank eveneens
      onverwijld aan Onze Minister van Defensie wordt betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004789#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0004789#HoofdstukI
      [ref3]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIII
      [ref4]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005555/2017-04-01#Artikel11.8
    references:
