  - number: 11.23.2
    text: |-
      De [artikelen 11.16, tweede en derde lid][ref1], en [11.20][ref2] zijn van overeenkomstige toepassing, met dien
      verstande dat voor de toepassing van artikel 11.20 gedeputeerde staten de plaats innemen van Onze Minister van
      Infrastructuur en Milieu.


