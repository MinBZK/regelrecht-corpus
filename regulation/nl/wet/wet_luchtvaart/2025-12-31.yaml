  - number: '2.3'
    text: |-
      1 Een bewijs van bevoegdheid wordt afgegeven voor onbepaalde tijd dan wel voor een bij algemene maatregel van
      bestuur vast te stellen termijn, welke termijn voor de verschillende bewijzen van bevoegdheid verschillend kan
      zijn.

      2 Indien een bewijs van bevoegdheid voor onbepaalde tijd is verleend, is dit bewijs slechts geldig indien daarop
      ten minste één geldige bevoegdverklaring is weergegeven en voor de bij algemene maatregel van bestuur vast te
      stellen termijn waarvoor die bevoegdverklaring is afgegeven.

      3 Indien een bewijs van bevoegdheid voor bepaalde tijd is verleend, verlengt Onze Minister van Infrastructuur
      en Milieu op aanvraag het bewijs van bevoegdheid, indien de houder daarvan beschikt over voldoende kennis,
      bedrevenheid en ervaring met betrekking tot dat bewijs van bevoegdheid; het bewijs van bevoegdheid wordt voor de
      krachtens het eerste lid vastgestelde termijn verlengd.

      4 Onze Minister van Infrastructuur en Milieu geeft op aanvraag een bevoegdverklaring af en verlengt deze, indien
      de houder daarvan beschikt over voldoende bedrevenheid en ervaring met betrekking tot die bevoegdverklaring. De
      bevoegdverklaring wordt voor de krachtens het tweede lid vastgestelde termijn verlengd.

      5 Bij algemene maatregel van bestuur kan worden voorgeschreven, dat de houder van een in die algemene maatregel aan
      te geven bewijs van bevoegdheid of bevoegdverklaring bij het bereiken van een in die algemene maatregel bepaalde
      leeftijd daarin aan te geven bevoegdheden:

      a. niet meer mag uitoefenen;

      b. slechts onder in die algemene maatregel bepaalde voorwaarden mag uitoefenen.

      6 Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot
      [artikel 2.2][ref1] en dit artikel. Deze regels bevatten in ieder geval bepalingen betreffende:

      a. de aanvraag en afgifte van bewijzen van bevoegdheid en de aanvraag, afgifte en verlenging van
      bevoegdverklaringen;

      b. de leeftijd, die een aanvrager ten minste moet hebben om voor een bewijs van bevoegdheid in aanmerking te kunnen
      komen;

      c. de eisen, waaraan de aanvrager van een bewijs van bevoegdheid of bevoegdverklaring of van de verlenging daarvan
      moet voldoen alsmede de wijze, waarop hij kan doen blijken, dat hij aan die eisen voldoet;

      d. de te houden examens;

      e. de eisen, waaraan examinatoren moeten voldoen, alsmede de eisen waaraan examinatoren moeten voldoen teneinde een
      autorisatie te verkrijgen;

      f. aan STD's te stellen eisen voor kwalificatie;

      g. de vernieuwing van het document, waarop bewijzen van bevoegdheid en bevoegdverklaringen worden weergegeven;

      h. de vergoeding, die de aanvrager is verschuldigd voor de kosten van de handelingen ten behoeve van de
      aanvraag tot afgifte van het bewijs van bevoegdheid, een bevoegdverklaring of het bewijs van gelijkstelling, de
      verlenging van een bewijs van bevoegdheid of verlenging een bevoegdverklaring, het afleggen van een theorie- of
      praktijkexamen, de vernieuwing van het document, bedoeld in onderdeel g, de afgifte van de autorisatie, bedoeld in
      onderdeel e, de afgifte en verlenging van de medische verklaring, bedoeld in [artikel 2.2, eerste lid][ref2], en de
      afgifte en verlenging van de kwalificatie, bedoeld in onderdeel f.

      7 Bij het besluit van Onze Minister van Infrastructuur en Milieu, bedoeld in het zesde lid, onderdeel e, kunnen
      in aanmerking genomen worden het aantal reeds geautoriseerde examinatoren, hun specifieke deskundigheid en de
      spreiding van examinatoren over het land in relatie tot de regionale of plaatselijke behoefte.

      8 [Artikel 2.1, vierde tot en met zesde lid][ref3], is van overeenkomstige toepassing.


