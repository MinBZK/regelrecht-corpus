  - number: '8.50'
    text: |-
      Indien voor een luchthaven op grond van [artikel 5.11, eerste lid, onderdeel b][ref1], luchtverkeersroutes en
      -procedures worden vastgesteld, geschiedt vaststelling van het deel van de luchtverkeersroutes die zijn gelegen
      in het plaatselijk luchtverkeersleidinggebied, en vaststelling van de luchtverkeersprocedures, in overeenstemming
      met gedeputeerde staten. Bij de vaststelling van deze routes en procedures wordt het advies van gedeputeerde
      staten gevolgd, tenzij dit niet mogelijk is met het oog op de vliegveiligheid, de indeling van het luchtruim of de
      capaciteit van het luchtruim.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.11
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.50
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.11'
        hoofdstuk: '5'
  - number: '8.51'
    text: |-
      [Artikel 8.24a][ref1] is van toepassing met dien verstande dat voor de toepassing van het derde lid gedeputeerde
      staten in de plaats treden van Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.24a
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.51
    references:
