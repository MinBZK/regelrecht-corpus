  - number: 8.71a
    text: |-
      [Artikel 8.23a][ref1] is van overeenkomstige toepassing met dien verstande dat:

      a. in de aanhef van het eerste lid in plaats van «krachtens [artikel 8.15][ref2] gestelde voorschriften» wordt
      gelezen «het bepaalde in een luchthavenbesluit» en in plaats van «de commissie regionaal overleg luchthaven
      Schiphol, bedoeld in [artikel 8.34][ref3]» wordt gelezen: de commissie regionaal overleg van de betreffende
      luchthaven, bedoeld in [artikel 8.75][ref4];

      b. in de onderdelen a en b van het eerste lid in plaats van «het luchthavenverkeerbesluit» wordt gelezen: het
      luchthavenbesluit;

      c. in het zesde lid in plaats van «de [artikelen 8.13][ref5], [8.14][ref6] of [8.24][ref7]» wordt gelezen:
      [artikel 8.71][ref8];

      d. in het achtste en negende lid in plaats van «de commissie regionaal overleg luchthaven Schiphol, bedoeld in
      [artikel 8.34][ref9]» wordt gelezen: de commissie regionaal overleg van de betreffende luchthaven, bedoeld in
      [artikel 8.75][ref10].


