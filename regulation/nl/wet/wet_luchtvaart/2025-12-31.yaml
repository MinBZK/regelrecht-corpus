  - number: '8.45'
    text: |-
      1 Zodra gedeputeerde staten constateren dat een in het luchthavenbesluit opgenomen grenswaarde is overschreden,
      schrijven zij maatregelen voor die naar hun oordeel bijdragen aan het terugdringen van de belasting vanwege het
      luchthavenluchtverkeer binnen de grenswaarden.

      2 [Artikel 8.22, derde en vierde lid][ref1], is van overeenkomstige toepassing met dien verstande dat gedeputeerde
      staten in de plaats treden van de inspecteur-generaal. [Artikel 8.44, vijfde lid][ref2], is van overeenkomstige
      toepassing ten aanzien van de voorgeschreven maatregel.

      3 Gedeputeerde staten schrijven geen maatregelen als bedoeld in het eerste lid voor met betrekking
      tot de overschrijding van de grenswaarde die is veroorzaakt door vluchten als bedoeld in
      [artikel 8.44, tweede lid][ref3], indien deze overschrijding het gevolg is van uitzonderlijke omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.22
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.44
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8.44
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.45
