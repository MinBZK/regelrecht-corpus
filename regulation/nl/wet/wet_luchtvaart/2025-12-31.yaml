  - number: 11.28b
    text: |-
      1 Toezichthouders als bedoeld in [artikel 11.28a][ref1] zijn bevoegd om, onder verstrekking van onjuiste of
      onvolledige gegevens met betrekking tot hun identiteit en hoedanigheid, motoren, propellers, onderdelen en
      apparatuur om luchtvaartuigen van een afstand te bedienen te verkrijgen ten behoeve van het controleren van
      de kenmerken van deze producten en de verificatie van de documenten en de hieraan gerelateerde handelingen te
      verrichten voor zover dat voor de vervulling van hun taak noodzakelijk is, ter uitvoering van de verordening
      markttoezicht en voor zover het gaat om:

      a. het toezicht op de naleving van de basisverordening, en

      b. het ontwerp, de productie en het in de handel brengen van luchtvaartuigen als bedoeld in artikel 2, eerste
      lid, onder a en b, van die basisverordening wat betreft onbemande luchtvaartuigen, en hun motoren, propellers,
      onderdelen en apparatuur om het luchtvaartuig van een afstand te bedienen.

      [Artikel 5:12, tweede lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing.

      2 De toezichthouder die gebruik heeft gemaakt van de bevoegdheid, bedoeld in het eerste lid, maakt daarvan een
      schriftelijk verslag op waarin hij vermeldt:

      a. zijn naam of nummer en hoedanigheid;

      b. de motivering van de noodzaak tot uitoefening van de bevoegdheid;

      c. de voorschriften op de naleving waarvan wordt toegezien;

      d. het adres, waaronder indien van toepassing, het elektronische adres waar de motor, de propeller, het onderdeel
      of de apparatuur om luchtvaartuigen van een afstand te bedienen is verkregen, en voor zover bekend, de omschrijving
      van de betrokken marktdeelnemer, bedoeld in artikel 3, onderdeel 13, van de verordening markttoezicht;

      e. de onjuiste of onvolledige gegevens die zijn verstrekt bij de verkrijging van de motor, de propeller, het
      onderdeel of de apparatuur om luchtvaartuigen van een afstand te bedienen;

      f. de wijze waarop en het tijdvak waarin de handelingen hebben plaatsgevonden;

      g. wat de uitkomst is van het onderzoek van de verkregen motor of propeller, het verkregen onderdeel of de
      verkregen apparatuur om luchtvaartuigen van een afstand te bedienen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11.28a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel512
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel11.28b
