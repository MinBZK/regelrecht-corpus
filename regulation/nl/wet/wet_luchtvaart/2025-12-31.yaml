  - number: 8a.40
    text: |-
      1 De heffingen worden ingevorderd door de door Onze Minister van Infrastructuur en Milieu aan te wijzen
      functionaris van de exploitant van de luchthaven, door de door Onze Minister van Infrastructuur en Milieu in
      overeenstemming met Onze Minister van Financiën aan te wijzen ambtenaar van de Dienst der Domeinen en door de
      ontvanger, bedoeld in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref1].

      2 Onverminderd het overigens in dit artikel bepaalde worden de heffingen ingevorderd met overeenkomstige
      toepassing van de [Invorderingswet 1990][ref2] en de [Kostenwet invordering rijksbelastingen][ref3],
      met dien verstande dat van de [Invorderingswet 1990][ref4] buiten toepassing blijven de
      [artikelen 9, eerste tot en met negende lid][ref5], [59][ref6] en [62][ref7]. Voorts blijven bij de toepassing
      van [artikel 66 van die wet][ref8] de [artikelen 76][ref9], [80, tweede, derde en vierde lid][ref10], [82][ref11],
      [84][ref12], [86][ref13] en [87 van de Algemene wet inzake rijksbelastingen][ref14] buiten toepassing.

      3 Met betrekking tot de invordering geldt vervolgens dat:

      a. de belastingaanslagen terstond en tot het volle bedrag invorderbaar zijn;

      b. wat betreft de toepassing van [artikel 8, eerste lid, van de Invorderingswet 1990][ref15] uitsluitend bevoegd
      is de functionaris of ambtenaar bedoeld in het eerste lid. De in de [artikelen 11][ref16], [12][ref17] en
      [15, eerste lid, onderdeel a, van de Invorderingswet 1990][ref18] bedoelde bevoegdheden komen uitsluitend toe aan
      de functionaris of ambtenaar, bedoeld in het eerste lid. De in [artikel 26 van de Invorderingswet 1990][ref19]
      bedoelde bevoegdheid komt uitsluitend toe aan de door Onze Minister van Infrastructuur en Milieu aan te wijzen
      ambtenaar, met dien verstande dat voor de toepassing van [artikel 26 van die wet][ref20] de door Onze Minister van
      Financiën bij regeling gestelde regels van toepassing zijn;

      c. de overige bij de invordering van toepassing zijnde bevoegdheden, met uitzondering van die bedoeld in de
      [artikelen 24, tweede lid][ref21], [25][ref22] en [58 van de Invorderingswet 1990][ref23], uitsluitend toekomen aan
      de ontvanger, bedoeld in het eerste lid;

      d. de bevoegdheid bedoeld in [artikel 24, tweede lid, van de Invorderingswet 1990][ref24] zowel toekomt aan de
      functionaris of ambtenaar bedoeld in het eerste lid als aan de ontvanger bedoeld in het eerste lid;

      e. de bevoegdheden bedoeld in [artikel 25][ref25] en [artikel 58 van de Invorderingswet 1990][ref26] toekomen,
      indien de functionaris of ambtenaar bedoeld in het eerste lid met de invordering is belast, aan deze functionaris
      of ambtenaar en indien de ontvanger, bedoeld in het eerste lid, met de invordering is belast, aan de ontvanger.

      4 In het kader van het verzet tegen de tenuitvoerlegging van het dwangbevel moet in
      [artikel 17 van de Invorderingswet 1990][ref27] voor «de ontvanger die het dwangbevel heeft uitgevaardigd» telkens
      worden gelezen: de met de tenuitvoerlegging van het dwangbevel belaste ontvanger.

      5 Betaling van de heffingen dient te geschieden aan de functionaris of ambtenaar bedoeld in het eerste lid. Na de
      betekening van het dwangbevel dient te worden betaald aan de ontvanger, bedoeld in het eerste lid, die is vermeld
      op het dwangbevel.


