  - number: '11.3'
    text: |-
      1 Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn belast de bij of krachtens
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren, alsmede de bij besluit van Onze
      Minister van Infrastructuur en Milieu, respectievelijk Onze Minister van Defensie aangewezen ambtenaren.

      2 De opsporingsambtenaren zijn bevoegd het verrichten van werkzaamheden aan boord van luchtvaartuigen of het
      bedienen of opstijgen van luchtvaartuigen in strijd met het bij of krachtens deze wet bepaalde te verbieden of te
      beletten en voor zover het een burgerluchtvaartuig betreft, het luchtvaartuig, waarmee de overtreding wordt begaan
      naar een door hen aangewezen plaats over te brengen of te doen overbrengen en aldaar in bewaring te stellen.

      3 De betrokken ambtenaar maakt van de inbewaringstelling proces-verbaal op, dat hij binnen vierentwintig uur zendt
      aan de officier van justitie van de rechtbank binnen het rechtsgebied waarvan de inbewaringstelling geschiedt.
      Een afschrift van het proces-verbaal wordt tegelijkertijd uitgereikt of toegezonden aan de gezagvoerder en aan de
      houder van het betrokken luchtvaartuig. [Artikel 11.7, vierde lid][ref2], is ten aanzien van de gezagvoerder en de
      houder van overeenkomstige toepassing.

      4 De kosten verbonden aan de uitvoering van het tweede lid kunnen door Onze Minister van Infrastructuur en Milieu
      worden ingevorderd bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11.7
