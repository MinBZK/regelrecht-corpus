  - number: 8.25dh
    text: |-
      De exploitant van de luchthaven hanteert de op grond van [artikel 8.25d, eerste lid][ref1], en
      [artikel 8.25db, eerste tot en met derde lid][ref2], vastgestelde tarieven en voorwaarden, de op grond van artikel
      8.25d, vierde en vijfde lid, vastgestelde aangepaste tarieven, en de op grond van artikel 8.25d, zesde lid,
      vastgestelde aangepaste voorwaarden, gedurende de periode waarop die tarieven en voorwaarden, respectievelijk die
      aangepaste tarieven en voorwaarden betrekking hebben.


