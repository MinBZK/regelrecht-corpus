  - number: 8.25e
    text: |-
      1 De exploitant van de luchthaven doet met het oog op de vaststelling van de in [artikel 8.25d, eerste lid][ref1]
      en [8.25db, eerste tot en met derde lid][ref2], bedoelde tarieven en voorwaarden, aan gebruikers en representatieve
      organisaties voorafgaand mededeling van een voorstel voor deze tarieven en voorwaarden met een omschrijving van de
      daarvoor te leveren diensten, alsmede van een toelichting, onder meer inhoudende een economische onderbouwing, een
      kostenbenchmark, een tarievenbenchmark, een benchmark kwaliteitsindicatoren en een onderbouwde beschrijving van de
      mogelijke effecten van het voorstel van de tarieven en voorwaarden op de netwerkkwaliteit.

      2 De exploitant van de luchthaven doet met het oog op de vaststelling van de in
      [artikel 8.25d, vierde en vijfde lid][ref3], bedoelde aanpassing van de tarieven, aan gebruikers en representatieve
      organisaties voorafgaand mededeling van een voorstel van de in [artikel 8.25dg][ref4] bedoelde afzonderlijke
      verrekeningen, het saldo van die verrekeningen en de daaruit volgende aangepaste tarieven.

      3 De exploitant van de luchthaven doet, met het oog op de vaststelling van de in [artikel 8.25d, zesde lid][ref5],
      bedoelde aanpassingen van de voorwaarden, aan gebruikers en representatieve organisaties voorafgaand mededeling van
      een voorstel tot aanpassing.

      4 Gebruikers verstrekken aan de exploitant van de luchthaven de in het twaalfde lid, onderdeel f, bedoelde
      informatie, voorafgaand aan de mededeling van het voorstel voor de in [artikel 8.25d, eerste lid][ref6], dan wel in
      [artikel 8.25db][ref7] bedoelde tarieven en voorwaarden.

      5 De exploitant van de luchthaven raadpleegt gebruikers en representatieve organisaties over de in het eerste tot
      en met derde lid bedoelde voorstellen, alvorens de tarieven en voorwaarden, respectievelijk de aangepaste tarieven
      en voorwaarden vast te stellen.

      6 De exploitant van de luchthaven doet met het oog op de vaststelling van het in
      [artikel 8.25de, eerste lid][ref8], bedoelde investeringsprogramma, aan gebruikers en representatieve organisaties
      voorafgaand mededeling van een voorstel van het vijfjarige investeringsprogramma.

      7 De exploitant van de luchthaven doet, met het oog op de vaststelling van de raming van een investeringsproject,
      en de ten behoeve van dat investeringsproject opgestelde functionele specificaties, aan de in
      [artikel 8.25df, eerste lid][ref9], bedoelde projectgroep, per investeringsproject of elk afzonderlijk onderdeel
      daarvan, voorafgaand mededeling van een voorstel dat in ieder geval een raming, de onderbouwing daarvan en de bij
      het betreffende investeringsproject of afzonderlijke onderdelen daarvan behorende functionele specificaties bevat.

      8 De exploitant van de luchthaven raadpleegt gebruikers en representatieve organisaties over het in het zesde lid
      bedoelde investeringsprogramma, alvorens dat vast te stellen.

      9 De exploitant van de luchthaven raadpleegt de in [artikel 8.25df, eerste lid][ref10], bedoelde projectgroep over
      de raming en de daarbij behorende functionele specificaties per investeringsproject of elk afzonderlijk onderdeel
      daarvan, alvorens deze vast te stellen.

      10 Gebruikers en representatieve organisaties kunnen binnen vier weken na de dag waarop de in het eerste, tweede,
      derde of zesde lid bedoelde mededeling is gedaan, hun zienswijze over het in het eerste, tweede, derde of zesde lid
      bedoelde voorstel, aan de exploitant van de luchthaven doen toekomen.

      11 Gebruikers en representatieve organisaties, die deelnemen in de in [artikel 8.25df, eerste lid][ref11], bedoelde
      projectgroep, kunnen binnen de door de projectgroep afgesproken termijn, welke maximaal vier weken bedraagt, na de
      dag waarop de in het zevende lid bedoelde mededeling is gedaan, hun zienswijze over dat voorstel aan de exploitant
      van de luchthaven doen toekomen.

      12 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. de wijze en het tijdstip waarop de in het eerste tot en met derde lid en het zesde en zevende lid bedoelde
      mededelingen plaatsvinden;

      b. de wijze waarop de in het vijfde en het achtste lid bedoelde raadplegingen plaatsvinden;

      c. de informatie, welke door de exploitant van de luchthaven moet worden opgenomen in het voorstel voor de in
      het eerste lid bedoelde tarieven en voorwaarden, de in het tweede en derde lid bedoelde aangepaste tarieven en
      voorwaarden en de daarbij behorende toelichtingen, waaronder ook de in het eerste lid bedoelde benchmarks;

      d. de informatie, welke door de exploitant van de luchthaven moet worden gegeven over het in het zesde lid bedoelde
      voorstel van het investeringsprogramma;

      e. de informatie, welke door de exploitant van de luchthaven moet worden gegeven over het in het zevende lid
      bedoelde voorstel van een investeringsproject of elk afzonderlijk onderdeel daarvan;

      f. de door de gebruikers aan de exploitant van de luchthaven te verstrekken informatie als bedoeld in het vierde
      lid, en

      g. het proces aan de hand waarvan invulling wordt gegeven aan de in het eerste lid bedoelde benchmarks.

      13 Gebruikers en representatieve organisaties dienen de op basis van dit artikel door de exploitant van de
      luchthaven verstrekte informatie en het in het zesde lid bedoelde investeringsprogramma, als bedrijfsvertrouwelijk
      te beschouwen en te behandelen.

      14 De op basis van dit artikel door de exploitant van de luchthaven aan de leden van de in
      [artikel 8.25df, eerste lid][ref12] bedoelde projectgroep, verstrekte informatie over een in het zevende lid
      bedoeld investeringsproject of elk afzonderlijk onderdeel daarvan, dient door de leden van de projectgroep als
      bedrijfsvertrouwelijk te worden beschouwd en behandeld.

      15 De op basis van dit artikel door de gebruikers aan de exploitant van de luchthaven verstrekte informatie,
      als bedoeld in het vierde lid, dient door de exploitant van de luchthaven evenzeer als bedrijfsvertrouwelijk te
      worden beschouwd en behandeld en mag door de exploitant van de luchthaven bovendien niet in een tot een gebruiker
      herleidbare vorm in het voorstel worden verwerkt.


