        paragraaf: 10.3.4.2
        afdeling: 10.3.4
  - number: '10.42'
    text: |-
      1 Onze Minister van Defensie kan voor een luchthaven indien ten gevolge van groot onderhoud van een baan of door
      een bijzonder voorval het normale gebruik van de luchthaven naar zijn oordeel ernstig wordt belemmerd, of in
      verband met bijzondere redenen van nationale of bondgenootschappelijke aard vrijstelling verlenen van een bepaling
      in de luchthavenregeling.

      2 Een vrijstelling kan slechts worden verleend voor een bepaalde in de vrijstelling vast te stellen termijn van ten
      hoogste een jaar.

      3 Aan de vrijstelling kunnen beperkingen en voorschriften worden verbonden met het oog op de veiligheid of de
      geluidbelasting.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.42
  - number: '10.43'
    text: |-
      Onze Minister van Defensie registreert het feitelijk gebruik van de luchthaven. Bij regeling van Onze Minister van
      Defensie in overeenstemming met Onze Minister van Infrastructuur en Milieu worden regels gesteld omtrent de wijze
      van registratie en openbaarmaking van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.43
  - number: '10.44'
    text: |-
      1 Van het in [artikel 8.1a, eerste lid][ref1], genoemde verbod kan vrijstelling worden verleend door Onze Minister
      van Defensie ten behoeve van de militaire luchtvaart.

      2 Aan de vrijstelling kunnen beperkingen en voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1a
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.44
