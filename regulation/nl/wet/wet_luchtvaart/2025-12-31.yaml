  - number: '11.9'
    text: |-
      1 Met een hechtenis van ten hoogste zes maanden of een geldboete van ten hoogste de derde categorie wordt gestraft
      degene, die

      a. handelt in strijd met de artikelen

      1°. [1.3][ref1];

      2°. [2.1, eerste, tweede en vierde lid][ref2], [2.3, achtste lid][ref3], [2.5, tweede lid][ref4],
      [2.6, derde lid][ref5], [2.10, tweede lid][ref6], [2.11][ref7];

      3°. [3.1][ref8], [3.2][ref9], [3.5, vierde lid][ref10], [3.8, tweede lid][ref11], [3.16, derde lid][ref12],
      [3.19, eerste lid][ref13], [3.19a, eerste en vijfde lid][ref14], [3.19c, vierde lid][ref15],
      [3.19e, tweede, derde en vierde lid][ref16], [3.19f, vijfde en zevende lid][ref17],
      [3.22, eerste en tweede lid][ref18], [3.25, vierde lid][ref19], [3.30, tweede lid][ref20];

      4°. [4.8][ref21];

      5°. [5.2][ref22], [5.3][ref23], [5.4][ref24], [5.6 tot en met 5.9][ref25], [5.10, vijfde lid][ref26],
      [5.16][ref27];

      6°. [6.59][ref28];

      7°. [7.4, eerste en tweede lid][ref29];

      8°. [8.1a, eerste tot en met vierde en zesde lid][ref30];

      10°. [10.1, tweede en derde lid][ref31], [10.2][ref32], [10.13, eerste lid][ref33];

      11°. [11.2a][ref34], [11.4][ref35], [11.7, eerste lid][ref36], en [11.8a][ref37] voor zover het betreft
      de[ artikelen 11.4, tweede lid][ref38], en [11.7][ref39];

      b. handelt in strijd met het bepaalde krachtens de artikelen

      1°. [1.5][ref40] voor zover het bepaalde betrekking heeft op hoofdstuk III van de basisverordening;

      2°. [2.1, derde lid][ref41], [2.3, vijfde lid][ref42];

      3°. [3.7][ref43], [3.23][ref44], [3,31][ref45];

      4°. [5.5][ref46], [5.11][ref47], [5.12, tweede lid][ref48];

      5°. [8a.50, vijfde lid][ref49];

      c. handelt in strijd met hetgeen bij of krachtens de basisverordening is bepaald voor zover deze voorschriften bij
      ministeriële regeling als bedoeld in [artikel 1.6][ref50] zijn aangewezen als overtreding.

      2 De in het eerste lid van dit artikel strafbaar gestelde feiten zijn overtredingen.

      3 Handelen in strijd met krachtens deze wet gestelde regels, bedoeld in het eerste lid, onder b, vormt slechts een
      strafbaar feit voorzover dit in die regels uitdrukkelijk is bepaald.


