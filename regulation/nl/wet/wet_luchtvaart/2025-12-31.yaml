  - number: 8.40h
    text: |-
      1 De exploitant van een overige luchthaven zendt de Autoriteit Consument en Markt een afschrift van de in de
      [artikel 8.40c, eerste lid][ref1], en [8.40e, eerste lid][ref2], bedoelde mededelingen.

      2 De exploitant van een overige luchthaven verleent binnen de door de Autoriteit Consument en Markt gestelde
      termijn alle medewerking die deze redelijkerwijs kan verlangen bij de uitoefening van haar bevoegdheden op grond
      van deze wet.

      3 [Artikel 4.15 van de Algemene wet bestuursrecht][ref3] is van overeenkomstige toepassing indien de Autoriteit
      Consument en Markt aan de exploitant van een overige luchthavens om gegevens verzoekt met het oog op een te nemen
      besluit.

      4 Ingeval van overtreding van het tweede lid is
      [artikel 12m van de Instellingswet Autoriteit Consument en Markt][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.40c
