  - number: 11.8a
    text: |-
      De [artikelen 11.4, tweede lid][ref1], [11.5, eerste, derde en vierde lid][ref2], [11.6][ref3], [11.7][ref4] en
      [11.8][ref5] van deze wet zijn van overeenkomstige toepassing op degene, die luchtverkeersdienstverlening geeft of
      luchthaveninformatie verschaft als bedoeld in de [artikelen 2.1][ref6], [5.16][ref7] of [10.2 van deze wet][ref8]
      of de artikelen 48, 49, 51 en 52 van de basisverordening dan wel een grondstation of een mobiel station als bedoeld
      in artikel 2.1, eerste lid, van deze wet bedient, met dien verstande, dat voor de toepassing van artikel 11.5 in
      plaats van het opleggen van een vliegverbod treedt het verbieden van het geven van luchtverkeersdienstverlening,
      het verschaffen van luchthaveninformatie of het gebruiken van een grondstation als bedoeld in artikel 2.1, eerste
      lid.


