  - number: 8a.63
    text: |-
      1 In deze titel wordt verstaan onder:

        - *ACNL:* Airport Coordination Netherlands;
        - *bemiddelaar inzake de dienstregelingen:* bemiddelaar inzake de dienstregelingen als bedoeld in artikel 2,
      onderdeel i, van de slotverordening;
        - *gebruiker:* een luchtvaartmaatschappij, alsmede een persoon of rechtspersoon die vluchten uitvoert, niet zijnde
      een luchtvaartmaatschappij;
        - *gefaciliteerde beweging:* een beweging die wordt gefaciliteerd op een luchthaven met bemiddeling inzake de
      dienstregelingen door de bemiddelaar inzake de dienstregelingen;
        - *slotcoördinator:* coördinator als bedoeld in de slotverordening;
        - *slotverordening:* [Verordening nr. 95/93](31993R0095) van de Raad van de Europese Gemeenschappen van 18 januari
      1993 betreffende gemeenschappelijke regels voor de toewijzing van «slots» op communautaire luchthavens (PbEG 1993,
      L 14).

      2 Een wijziging van de slotverordening gaat voor de toepassing van deze titel gelden met ingang van de dag waarop
      aan de betrokken wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.63
  - number: 8a.64
    text: |-
      1 Er is een organisatie, ACNL, belast met de taken die de slotcoördinator en de bemiddelaar inzake de
      dienstregelingen op grond van de slotverordening hebben.

      2 ACNL is gevestigd te Haarlemmermeer en bezit rechtspersoonlijkheid.

      3 De [artikelen 21][ref1] en [22 van de Kaderwet zelfstandige bestuursorganen][ref2] zijn op ACNL niet van
      toepasing.

      4 Indien ACNL bij de uitvoering van de taken van de slotcoördinator, bedoeld in het eerste lid, schade toebrengt
      aan luchtvaartmaatschappijen of anderen, is ACNL daarvoor niet aansprakelijk, tenzij de schade een gevolg is van
      opzet of roekeloosheid.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.64
    references:
