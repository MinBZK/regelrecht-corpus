  - number: 8.25dd
    text: |-
      1 De exploitant van de luchthaven neemt bij de in [artikel 8.25d, eerste lid][ref1], bedoelde vaststelling van
      de tarieven, een bijdrage in aanmerking uit de andere activiteiten dan de in artikel 8.25d, eerste lid, bedoelde
      activiteiten en de andere activiteiten dan de in het tweede lid van dit artikel bedoelde overige activiteiten.
      De exploitant van de luchthaven houdt bij deze bijdrage rekening met de continuïteit van de onderneming en de
      financierbaarheid van de investeringen van de exploitant van de luchthaven.

      2 De exploitant van de luchthaven neemt bij de in [artikel 8.25d, eerste lid][ref2], bedoelde vaststelling van de
      tarieven, de toegerekende opbrengsten in aanmerking uit de overige activiteiten van de exploitant van de luchthaven
      die rechtstreeks verband houden met de in artikel 8.25d, eerste lid, bedoelde activiteiten.

      3 De exploitant van de luchthaven neemt bij de vaststelling van de in [artikel 8.25d, eerste lid][ref3], en
      [artikel 8.25db, eerste lid][ref4], bedoelde tarieven de kosten in aanmerking van structurele maatregelen voor
      de uitvoering van een in [artikel 37ac, tweede lid, van de Luchtvaartwet][ref5], bedoelde bijzondere aanwijzing
      van Onze Minister van Veiligheid en Justitie, voor zover die maatregelen betrekking hebben op de beveiliging van
      de burgerluchtvaart.


