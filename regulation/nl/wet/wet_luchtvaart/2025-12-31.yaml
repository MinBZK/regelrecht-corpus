  - number: '8.75'
    text: |-
      1 Onze Minister van Infrastructuur en Milieu stelt voor iedere luchthaven een commissie regionaal overleg
      luchthaven in.

      2 De commissie bestaat uit een onafhankelijke voorzitter en in ieder geval uit vertegenwoordigers van:

      a. elke provincie waarin het beperkingengebied geheel of gedeeltelijk is gelegen,

      b. gemeenten waarin het beperkingengebied geheel of gedeeltelijk is gelegen,

      c. de exploitant van de luchthaven,

      d. de verlener van luchtverkeersdienstverlening voor zover op de luchthaven van toepassing, en

      e. omwonenden van de luchthaven.

      3 Onverminderd het tweede lid kan de commissie ook bestaan uit vertegenwoordigers van rechtspersoonlijkheid
      bezittende gebruikersorganisaties of milieuorganisaties.

      4 [Artikel 8.59][ref1] is van overeenkomstige toepassing met dien verstande dat voor de toepassing van het tweede
      en derde lid Onze Minister de plaats inneemt van provinciale staten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.59
