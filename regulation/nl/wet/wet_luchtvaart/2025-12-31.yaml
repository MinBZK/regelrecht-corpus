  - number: '11.12'
    text: |-
      1 Het is degene, die weet of redelijkerwijs moet weten, dat een hem afgegeven bewijs van bevoegdheid of een daarop
      aangetekende bevoegdverklaring krachtens [artikel 2.5][ref1] van deze wet of krachtens de basisverordening is
      geschorst, verboden gedurende de tijd van schorsing werkzaamheden te verrichten, waartoe het geschorste bewijs of
      de geschorste bevoegdverklaring de bevoegdheid gaf.

      2 Het is degene, die weet of redelijkerwijs moet weten, dat een hem afgegeven bewijs van bevoegdheid of bewijs
      van gelijkstelling krachtens [artikel 11.7][ref2] is ingevorderd, verboden gedurende de tijd, dat het bewijs is
      ingevorderd, werkzaamheden te verrichten, waartoe het geschorste bewijs of de geschorste bevoegdverklaring de
      bevoegdheid gaf.

      3 Het is degene, die weet of redelijkerwijs moet weten, dat hem bij rechterlijke uitspraak de bevoegdheid tot het
      verrichten van werkzaamheden als bedoeld in [artikel 11.11][ref3] is ontzegd, verboden gedurende de tijd, dat hem
      die bevoegdheid is ontzegd, die werkzaamheden te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11.7
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel11.11
