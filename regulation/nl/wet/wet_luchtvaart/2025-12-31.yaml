  - number: '10.12'
    text: |-
      1 Deze titel is van toepassing ten aanzien van de bij of krachtens algemene maatregel van bestuur aangewezen
      militaire luchthavens. Bij die maatregel worden de luchthavens aangewezen waarvoor vaststelling van een
      luchthavenbesluit is vereist.

      2 Bij algemene maatregel van bestuur worden voor bij die maatregel aangewezen luchthavens uniforme grenswaarden
      vastgesteld voor de maximaal toegelaten geluidbelasting door landende en opstijgende luchtvaartuigen. Bij
      die maatregel kunnen tevens uniforme grenswaarden worden vastgesteld voor het externe-veiligheidsrisico en
      voor lokale luchtverontreiniging en kunnen regels worden gesteld met betrekking tot geluidbelasting, het
      externe-veiligheidsrisico, lokale luchtverontreiniging en de maximale hoogte van objecten als bedoeld in
      [artikel 10.17, derde lid][ref1]. Bij de vaststelling kan onderscheid worden gemaakt naar soorten luchtvaartuigen,
      aan- en uitvliegroutes, functie van locaties en perioden van het etmaal.

      3 Bij regeling van Onze Minister van Defensie in overeenstemming met Onze Minister van Infrastructuur en Milieu
      worden regels vastgesteld omtrent de wijze van meten, berekenen en registreren van de in het tweede lid bedoelde
      geluidbelasting en kunnen dergelijke regels worden vastgesteld met betrekking tot het externe-veiligheidsrisico
      en luchtverontreiniging.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.17
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.12
