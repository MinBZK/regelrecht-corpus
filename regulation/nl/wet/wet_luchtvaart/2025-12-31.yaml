  - number: 11.1a
    text: |-
      1 Indien een natuurlijke of rechtspersoon voldoet aan de in Bijlage I van de luchtvaartnavigatiedienstenverordening
      genoemde eisen, verleent Onze Minister van Infrastructuur en Milieu op aanvraag een erkenning om de in artikel 2,
      tweede lid, van die verordening bedoelde inspecties en onderzoeken uit te voeren.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. de in Bijlage I van de luchtvaartnavigatiedienstenverordening genoemde eisen;

      b. de aanvraag, verlening en verlenging van een erkenning;

      c. de vergoeding die de aanvrager is verschuldigd ter zake van de kosten van de handelingen met betrekking tot de
      aanvraag en verlening van de erkenning;

      d. het tarief, dat een houder van een erkenning is verschuldigd ter zake van de kosten van toezicht. Onder
      het toezicht op de naleving van de in het eerste lid bedoelde eisen behoort in ieder geval het periodiek en in
      voorkomend geval steekproefsgewijs onderzoeken van een houder.

      3 Onze Minister van Infrastructuur en Milieu kan een erkenning geheel of gedeeltelijk schorsen, indien een ernstig
      vermoeden rijst dat de houder van de erkenning:

      a. niet voldoet aan de in het eerste lid bedoelde eisen, of

      b. ter verkrijging van de erkenning onjuiste of onvolledige gegevens heeft verstrekt.

      4 Onze Minister van Infrastructuur en Milieu kan een erkenning intrekken wegens de in het derde lid genoemde
      redenen of indien de erkenning gedurende tenminste drie maanden is geschorst.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel11.1a
  - number: '11.2'
    text: |-
      1 De toezichthouders kunnen hun bevoegdheid inzage te vorderen van zakelijke gegevens en bescheiden niet uitoefenen
      op taxi-, start- en landingsbanen van een luchthaven.

      2 Indien de toezichthouders toegang verlangen tot militaire terreinen of gebouwen geschiedt zulks eerst na overleg
      met Onze Minister van Defensie.

      3 In geval van onmiddellijke dreiging van gevaar zijn de toezichthouders bevoegd het bedienen of opstijgen van
      luchtvaartuigen in strijd met het bij of krachtens deze wet bepaalde te verbieden of te beletten.

      4 [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing bij uitoefening van de
      bevoegdheid door toezichthouders buiten het vluchtinformatiegebied Amsterdam.

      5 Voor de werking van dit artikel, met uitzondering van het vierde lid, wordt onder toezichthouders mede begrepen
      de inspecteur, bedoeld in [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0023746#Artikel13
