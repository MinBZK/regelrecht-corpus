        paragraaf: 8.2.1
        afdeling: '8.2'
  - number: '10.18'
    text: |-
      De voordracht voor een luchthavenbesluit of de wijziging daarvan wordt gedaan:

      a. na overleg met gedeputeerde staten en de colleges van burgemeester en wethouders van respectievelijk de
      provincies en de gemeenten binnen de grenzen waarvan het gebied of een gedeelte van het gebied ligt dat door het
      ontwerp wordt bestreken, en

      b. nadat het ontwerp vervolgens is voorbereid met toepassing van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1], waarbij zienswijzen naar voren kunnen worden gebracht door
      een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '10.19'
    text: |-
      De bij algemene maatregel van bestuur aangewezen gegevens met betrekking tot de geluidsbelasting, het externe-
      veiligheidsrisico en de lokale luchtverontreiniging zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.19
  - number: '10.20'
    text: |-
      Onze Minister van Defensie draagt er zorg voor dat het luchthavenluchtverkeer zodanig geschiedt dat de belasting
      vanwege het luchthavenluchtverkeer de grenswaarden, opgenomen in het luchthavenbesluit, niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.20
  - number: '10.21'
    text: |-
      1 Zodra Onze Minister van Defensie constateert dat de in [artikel 10.17][ref1] bedoelde grenswaarden zijn
      overschreden, schrijft hij maatregelen voor die naar zijn oordeel bijdragen aan het terugdringen van de belasting
      vanwege het luchthavenluchtverkeer binnen de grenswaarden.

      2 Onze Minister van Defensie trekt de maatregelen in of matigt deze voor zover zij naar zijn oordeel niet langer
      nodig zijn voor het terugdringen van de belasting vanwege het luchthavenluchtverkeer binnen de grenswaarden.

      3 [Artikel 10.20][ref2] is van overeenkomstige toepassing ten aanzien van de voorgeschreven maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.17
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10.20
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.21
