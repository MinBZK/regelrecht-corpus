        artikel: '10.15'
        hoofdstuk: '10'
        paragraaf: 10.3.2.2
        afdeling: 10.3.2
  - number: '10.27'
    text: |-
      1 Onze Minister van Defensie kan aan een rechtspersoon een vergunning verlenen voor burgermedegebruik onder
      verantwoordelijkheid van die rechtspersoon.

      2 Het verlenen van een vergunning voor burgermedegebruik door tussenkomst van een burgerexploitant geschiedt in
      overeenstemming met Onze Minister van Infrastructuur en Milieu. De overige vergunningen voor burgermedegebruik
      worden verleend na overleg met Onze Minister van Infrastructuur en Milieu.

      3 De vergunning vermeldt in ieder geval:

      a. de aard van het burgerluchtverkeer waarvoor de vergunning geldt;

      b. de termijn waarvoor de vergunning wordt verleend;

      c. de voor het burgermedegebruik geldende grenswaarden, wat betreft de geluidbelasting eventueel in de vorm van een
      maximum aantal vliegtuigbewegingen per jaar waarvoor de vergunning geldt.

      4 Aan de vergunning kunnen beperkingen en voorschriften worden verbonden.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het verlenen, wijzigen,
      overdragen en intrekken van de vergunning, alsmede omtrent de aan de behandeling van de aanvraag verbonden kosten.

      6 Een vergunning wordt niet verleend voor burgerluchtvaart van commerciële aard op een luchthaven waar reeds
      burgermedegebruik plaatsvindt door tussenkomst van een burgerexploitant.

      7 Een vergunning kan in ieder geval door Onze Minister van Defensie worden ingetrokken of gewijzigd wanneer:

      a. een of meer redenen waarom de vergunning is verleend, zijn vervallen,

      b. een of meer van de aan de vergunning verbonden beperkingen of voorschriften niet worden nageleefd,

      c. na de verlening zodanige feiten of omstandigheden bekend zijn geworden dat, indien deze ten tijde van de
      verlening bekend waren geweest, de vergunning niet of niet in die vorm zou zijn verleend, of

      d. van een voor onbepaalde tijd verleende vergunning gedurende twee achtereenvolgende jaren geen gebruik is
      gemaakt.

      8 Met betrekking tot de intrekking en wijziging, bedoeld in het zevende lid, is het tweede lid van overeenkomstige
      toepassing.

      9 Ingeval de vergunning is verleend aan een burgerexploitant, is [artikel 8.53][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.53
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.27
