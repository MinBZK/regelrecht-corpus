  - number: '5.15'
    text: |-
      De instanties belast met het verlenen van luchtverkeersleidingsdiensten coördineren de uitvoering van deze
      taken met de instanties belast met het verlenen van luchtverkeersleidingsdiensten binnen hetzelfde gebied of in
      aangrenzende gebieden.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.15
  - number: '5.16'
    text: |-
      Onverminderd [artikel 2.1, eerste lid][ref1], van deze wet en de basisverordening is het verboden
      luchtverkeersdiensten te verlenen zonder een daartoe verkregen opdracht van een bij of krachtens
      [artikel 5.13][ref2], [5.14][ref3] of [5.14a][ref4] aangewezen instantie of van een andere verlener van
      luchtverkeersdiensten als bedoeld in [artikel 5.14b, eerste lid][ref5].


