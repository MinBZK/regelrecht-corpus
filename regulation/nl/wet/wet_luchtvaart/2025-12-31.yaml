  - number: 11.2b
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan ten behoeve van het toezicht op de naleving van de verplichting,
      bedoeld in [artikel 8.25a][ref1], een onderzoek instellen bij de exploitant van de luchthaven.

      2 Met het onderzoek zijn belast de krachtens [artikel 11.1, eerste lid][ref2], aangewezen toezichthouders.

      3 In afwijking van het tweede lid, kan Onze Minister van Infrastructuur en Milieu het onderzoek laten verrichten
      door een of meer aangewezen deskundigen.

      4 De ingevolge het derde lid aangewezen deskundigen horen gebruikers.

      5 Na afloop van het onderzoek wordt daarvan een rapport opgemaakt.

      6 Een afschrift van het rapport wordt gezonden aan de exploitant van de luchthaven.

      7 De exploitant van de luchthaven wordt gedurende vier weken na de toezending van het rapport, in de gelegenheid
      gesteld om schriftelijk of mondeling zijn zienswijze daaromtrent naar voren te brengen. Van hetgeen mondeling naar
      voren is gebracht, wordt een verslag gemaakt.

      8 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het in het eerste lid
      bedoelde onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25a
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11.1
