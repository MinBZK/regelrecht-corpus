    text: |-
      De voordracht voor een luchthavenbesluit of voor een wijziging daarvan wordt niet gedaan dan nadat het ontwerp is
      voorbereid met toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]. Zienswijzen kunnen daarbij
      naar voren worden gebracht door een ieder. Gelijktijdig met de terinzagelegging in het kader van de procedure in de
      hiervoor bedoelde afdeling wordt het ontwerp aan beide Kamers der Staten-Generaal overgelegd.


