  - number: '8.24'
    text: |-
      De artikelen 8.13 en 8.14 zijn van overeenkomstige toepassing op het voorbereiden en het wijzigen van het
      luchthavenverkeerbesluit.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.24
  - number: 8.24a
    text: |-
      1 De exploitant van de luchthaven is verplicht om met inachtneming van de bij of krachtens deze wet of de
      [Luchtvaartwet][ref1] gestelde bepalingen, luchthavenluchtverkeer ten behoeve van de burgerluchtvaart op de
      luchthaven toe te laten.

      2 Het eerste lid is niet van toepassing op circuitvluchten, oefenvluchten en proefvluchten.

      3 De exploitant is verplicht om in door Onze Minister van Infrastructuur en Milieu in overeenstemming met Onze
      Minister van Defensie aangewezen gevallen met inachtneming van de bij of krachtens deze wet of de Luchtvaartwet
      gestelde bepalingen, luchthavenluchtverkeer ten behoeve van de militaire luchtvaart op de luchthaven toe te laten.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.24a
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '8.25'
    text: |-
      1 Het is verboden de luchthaven te exploiteren zonder vergunning van Onze Minister van Infrastructuur en Milieu.

      2 Een luchthavenexploitatievergunning wordt verleend voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.25
  - number: 8.25a
    text: |-
      De exploitant van de luchthaven is verplicht tot exploitatie van de luchthaven en treft met inachtneming
      van [artikel 8.3][ref1] daartoe de voorzieningen die nodig zijn voor een goede afwikkeling van het
      luchthavenluchtverkeer en het daarmee samenhangende personen- en goederenvervoer op de luchthaven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.3
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.25a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.3'
        hoofdstuk: '8'
        afdeling: 8.2.1
  - number: 8.25b
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan een vergunning intrekken indien:

      a. de exploitant van de luchthaven zich schuldig maakt aan wanbeheer waardoor de continuïteit van de luchthaven in
      gevaar wordt gebracht;

      b. het nationale ruimtelijke beleid niet langer voorziet in een luchthaven op de desbetreffende locatie.

      2 Onze Minister van Infrastructuur en Milieu kan op aanvraag van de exploitant van de luchthaven de vergunning
      intrekken indien het algemeen belang zich niet tegen die intrekking verzet.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.25b
  - number: 8.25c
    text: |-
      Indien een ernstig vermoeden bestaat dat een omstandigheid als bedoeld in [artikel 8.25b, onderdeel a][ref1], zich
      dreigt voor te doen, kan Onze Minister van Infrastructuur en Milieu de exploitant van de luchthaven een aanwijzing
      geven om binnen een door hem te stellen termijn maatregelen te treffen ter voorkoming van wanbeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25b
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.25c
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8.25b
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: 8.25d
    text: |-
      1 De exploitant van de luchthaven stelt eenmaal per drie jaar de tarieven en voorwaarden voor de eerstkomende
      periode van drie jaar vast voor de activiteiten van de exploitant van de luchthaven ten behoeve van het gebruik van
      de luchthaven door gebruikers.

      2 De in het eerste lid, bedoelde tarieven en voorwaarden kunnen binnen de periode van drie jaar per jaar
      verschillen.

      3 De in het eerste lid, bedoelde tarieven en voorwaarden treden op 1 april in werking.

      4 De exploitant van de luchthaven stelt jaarlijks aangepaste tarieven vast op basis van de in het eerste lid, dan
      wel in [artikel 8.25db][ref1], bedoelde tarieven die voor het desbetreffende jaar zijn vastgesteld. De aanpassing
      betreft een of meer van de door de exploitant van de luchthaven aan de gebruikers in [artikel 8.25dg][ref2],
      bedoelde verschuldigde afzonderlijke verrekeningen.

      5 De exploitant van de luchthaven kan jaarlijks aangepaste tarieven vaststellen op basis van de in het
      eerste lid dan wel in [artikel 8.25db][ref3], bedoelde tarieven die voor het desbetreffende jaar zijn
      vastgesteld. De aanpassing betreft een of meer van de door de gebruikers aan de exploitant van de luchthaven in
      [artikel 8.25dg][ref4], bedoelde verschuldigde afzonderlijke verrekeningen.

      6 De exploitant van de luchthaven kan telkens als hiertoe aanleiding bestaat aangepaste operationele voorwaarden
      vaststellen voor het resterende gedeelte van de in het eerste lid bedoelde periode van drie jaar, op basis van de
      in het eerste lid, dan wel in [artikel 8.25db][ref5] bedoelde voorwaarden.

      7 De in het vierde en vijfde lid, bedoelde aangepaste tarieven treden per 1 april in werking.

      8 De in het zesde lid, bedoelde aangepaste operationele voorwaarden treden in werking op een door de exploitant
      van de luchthaven te bepalen datum, waarbij de exploitant van de luchthaven de nadere regels, bedoeld in de
      [artikelen 8.25di, eerste lid][ref6], en [8.25e, twaalfde lid][ref7], in acht neemt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25db
