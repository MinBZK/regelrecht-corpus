  - number: 8.40b
    text: |-
      Deze titel is, tenzij anders is bepaald, van toepassing ten aanzien van overige luchthavens die de drempelwaarde
      van vijf miljoen passagiersbewegingen per jaar overschrijden.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.40b
  - number: 8.40c
    text: |-
      1 De exploitant van een overige luchthaven stelt ten minste eenmaal per jaar de tarieven en voorwaarden vast voor
      de activiteiten van deze exploitant ten behoeve van het gebruik van de luchthaven door gebruikers. De exploitant
      van een overige luchthaven doet voorafgaande aan de periode waarop de tarieven en voorwaarden betrekking hebben,
      mededeling van de tarieven en voorwaarden.

      2 De tarieven zijn redelijk en non-discriminatoir.

      3 De tarieven kunnen worden gedifferentieerd uit een oogpunt van algemeen belang, met inbegrip van de bescherming
      van het milieu. De criteria voor deze tariefdifferentiatie dienen differentiatie te kunnen rechtvaardigen en zijn
      objectief en transparant.

      4 De exploitant van de luchthaven hanteert de tarieven en voorwaarden die ingevolge het eerste lid zijn
      vastgesteld, gedurende de periode waarop de vaststelling van de tarieven en voorwaarden betrekking heeft.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. de activiteiten ten behoeve van het gebruik van de luchthaven door gebruikers waarvoor tarieven en voorwaarden
      als bedoeld in het eerste lid, worden vastgesteld;

      b. de wijze en het tijdstip waarop de mededeling, bedoeld in het eerste lid, plaatsvindt; en

      c. het tijdstip van vaststelling en inwerkingtreding van de tarieven en voorwaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.40c
  - number: 8.40d
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan een groep van overige luchthavens die wordt geëxploiteerd door een
      en dezelfde exploitant aanwijzen als luchthavennetwerk.

      2 Onze Minister van Infrastructuur en Milieu kan de exploitant van het luchthavennetwerk toestemming verlenen om
      een gemeenschappelijk, transparant systeem van tarieven vast te stellen voor het gehele luchthavennetwerk.

      3 Onze Minister van Infrastructuur en Milieu kan de exploitanten van overige luchthavens, voor zover zij
      luchtverbindingen voor dezelfde stad of agglomeratie verzorgen, toestemming verlenen om een gemeenschappelijk,
      transparant systeem van tarieven vast te stellen voor alle luchthavens die de luchtverbindingen voor dezelfde stad
      of agglomeratie verzorgen.

      4 In geval van een gemeenschappelijk, transparant systeem van tarieven, als bedoeld in het tweede of derde
      lid, doen zowel de exploitant van de overige luchthaven die de grens van vijf miljoen passagiersbewegingen
      overschrijdt als de exploitant van elke deelnemende overige luchthaven aan de gebruikers mededeling van een
      voorstel voor de tarieven en voorwaarden en stellen zij de tarieven en voorwaarden vast overeenkomstig de
      [artikelen 8.40c tot en met 8.40f][ref1] en de krachtens deze artikelen gestelde regels. De exploitanten van de
      deelnemende overige luchthavens dragen zorg voor de noodzakelijke onderlinge afstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.40c
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.40d
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8.40c
        hoofdstuk: '8'
  - number: 8.40e
    text: |-
      1 Voorafgaand aan de vaststelling van de tarieven en voorwaarden, bedoeld in [artikel 8.40c, eerste lid][ref1],
      doet de exploitant van een overige luchthaven aan de gebruikers van de luchthaven en representatieve organisaties
      mededeling van een voorstel van deze tarieven en voorwaarden met een omschrijving van de daarvoor te leveren
      diensten, alsmede een toelichting, inhoudende een economische onderbouwing en een omschrijving, aan de hand van
      indicatoren, van het kwaliteitsniveau van de aangeboden diensten ten behoeve van het gebruik van de luchthaven.

      2 Voorafgaand aan het voorstel voor de vaststelling van de tarieven en voorwaarden, bedoeld in
      [artikel 8.40c, eerste lid][ref2], verstrekken de gebruikers aan de exploitant de bij of krachtens algemene
      maatregel van bestuur voorgeschreven informatie.

      3 De exploitant van de overige luchthaven raadpleegt de gebruikers van de luchthaven en representatieve
      organisaties over het voorstel, bedoeld in het eerste lid, alvorens de tarieven en voorwaarden vast te stellen.

      4 De exploitant van de overige luchthaven houdt bij de vaststelling van de tarieven en voorwaarden rekening
      met de zienswijze van de gebruikers van de luchthaven en van representatieve organisaties naar aanleiding van
      de raadpleging, bedoeld in het derde lid, en motiveert bij de vaststelling van de tarieven en voorwaarden zijn
      overwegingen omtrent de ingebrachte zienswijzen.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. de wijze en het tijdstip waarop de mededeling, bedoeld in het eerste lid, plaatsvindt;

      b. de wijze waarop de raadpleging, bedoeld in het derde lid, plaatsvindt;

      c. de indicatoren, bedoeld in het eerste lid; en

      d. De gegevens die door de exploitant van een overige luchthaven moeten worden opgenomen in het voorstel voor de
      tarieven en voorwaarden, bedoeld in het eerste lid, en de daarbij behorende toelichting.

      6 De op basis van dit artikel door de exploitant aan de gebruikers van de overige luchthaven verstrekte informatie
      dient door de gebruikers te worden beschouwd en behandeld als bedrijfsvertrouwelijk of economisch gevoelig. De op
      basis van dit artikel door de gebruikers van de overige luchthaven aan de exploitant verstrekte informatie dient
      door de exploitant evenzeer te worden beschouwd en behandeld als bedrijfsvertrouwelijk of economisch gevoelig en
      mag door de exploitant bovendien niet in een tot een gebruiker herleidbare vorm in het voorstel worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.40c
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.40c
