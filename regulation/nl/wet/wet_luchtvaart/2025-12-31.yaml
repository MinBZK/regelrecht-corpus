        afdeling: '3.4'
  - number: '10.40'
    text: |-
      Onze Minister van Defensie draagt er zorg voor dat het luchthavenluchtverkeer geschiedt overeenkomstig de
      luchthavenregeling.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.40
  - number: '10.41'
    text: |-
      1 Zodra Onze Minister van Defensie constateert dat de in [artikel 10.39, tweede lid][ref1], bedoelde grenswaarde is
      overschreden, schrijft hij maatregelen voor die naar zijn oordeel bijdragen aan het terugdringen van de belasting
      vanwege het luchthavenluchtverkeer binnen de gestelde grenswaarde.

      2 Onze Minister van Defensie trekt de maatregelen in of matigt deze voor zover de maatregelen naar zijn oordeel
      niet langer nodig zijn voor het terugdringen van de belasting vanwege het luchthavenluchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.39
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.41
