  - number: '11.7'
    text: |-
      1 Op de eerste vordering van een opsporingsambtenaar is het lid van het boordpersoneel, tegen wie door een van die
      personen ter zake van overtreding van:

      a. [artikel 2.12][ref1], indien bij een onderzoek als bedoeld in het derde lid, onderdeel a respectievelijk
      onderdeel b, van dat artikel blijkt of bij gebreke van een dergelijk onderzoek een ernstig vermoeden bestaat dat
      het alcoholgehalte van het lid van het boordpersoneel hoger is dan tweehonderdzeventig microgram (270 µg) alcohol
      per liter uitgeademde lucht respectievelijk drievijfde milligram (0,6 mg) alcohol per milliliter bloed, of

      b. [artikel 11.6, tweede, zesde, achtste en negende lid][ref2], proces-verbaal wordt opgemaakt,

      verplicht tot afgifte van het hem afgegeven bewijs van bevoegdheid of bewijs van gelijkstelling.

      2 Het ingevorderde bewijs van bevoegdheid of bewijs van gelijkstelling wordt, tegelijk met het proces-verbaal,
      onverwijld opgezonden aan de betrokken officier van justitie. Deze is bevoegd het ingevorderde bewijs van
      bevoegdheid of bewijs van gelijkstelling onder zich te houden, totdat de rechterlijke uitspraak in kracht van
      gewijsde is gegaan of, indien bij die uitspraak het lid van het boordpersoneel de bevoegdheid een luchtvaartuig
      te bedienen is ontzegd, tot het tijdstip waarop die uitspraak, voor wat betreft de bijkomende straf der ontzegging
      voor tenuitvoerlegging vatbaar is geworden. In het laatste geval levert de ambtenaar, na het bovenbedoelde
      tijdstip, het bewijs van bevoegdheid of van gelijkstelling in bij Onze Minister van Infrastructuur en Milieu.

      3 Indien de officier van justitie binnen tien dagen na de dag van invordering niet gebruik maakt van de
      in het tweede lid bedoelde bevoegdheid, geeft hij het ingevorderde bewijs onverwijld terug aan de houder.
      Teruggave vindt eveneens plaats, indien ernstig rekening moet worden gehouden met de mogelijkheid, dat aan
      de houder in geval van veroordeling geen onvoorwaardelijke ontzegging van een bevoegdheid als bedoeld in
      [artikel 11.11, tweede lid][ref3], zal worden opgelegd, dan wel geen onvoorwaardelijke ontzegging van langere duur
      dan de tijd gedurende welke het bewijs is ingevorderd of ingevorderd geweest, of indien het onderzoek van de zaak
      op de terechtzitting niet binnen zes maanden na de dag van invordering is aangevangen.

      4 De opsporingsambtenaar, die gebruik maakt van de in het eerste lid bedoelde bevoegdheid, en de officier van
      justitie, die gebruik maakt van de in het tweede lid bedoelde bevoegdheid, doen daarvan onverwijld mededeling aan
      Onze Minister van Infrastructuur en Milieu. Indien de officier van justitie het ingevorderde bewijs van bevoegdheid
      of bewijs van gelijkstelling aan de houder teruggeeft, doet hij daarvan op gelijke wijze mededeling.

      5 In geval van toepassing van het eerste of het tweede lid kan iedere belanghebbende bij klaagschrift daartegen
      opkomen. Het klaagschrift wordt ingediend bij de griffie van het gerecht in feitelijke aanleg binnen welks
      rechtsgebied het feit, dat tot toepassing van het eerste of het tweede lid van dit artikel aanleiding heeft
      gegeven, werd gepleegd dan wel ingevolge [artikel 4 van het Wetboek van Strafvordering][ref4] geacht wordt te zijn
      gepleegd. De rechtbank geeft zo spoedig mogelijk, na de belanghebbende, desverlangd bijgestaan door diens raadsman,
      te hebben gehoord, althans opgeroepen, zijn met redenen omklede beschikking, welke onverwijld aan de belanghebbende
      wordt betekend. Tegen de beschikking kan het openbaar ministerie binnen twee weken daarna en de belanghebbende
      binnen twee weken na de betekening beroep in cassatie instellen. De Hoge Raad beslist zo spoedig mogelijk.

      6 Indien de zaak eindigt zonder oplegging van straf of maatregel of met zodanige oplegging, doch op grond van
      een feit waarvoor toepassing van het eerste of tweede lid niet is toegelaten, kan de rechter op verzoek van
      de gewezen verdachte hem een vergoeding ten laste van de Staat toekennen voor de schade, die hij ten gevolge
      van die toepassing heeft geleden. Onder schade is begrepen het nadeel, dat niet in vermogensschade bestaat.
      De [artikelen 533, derde tot en met zesde lid][ref5], en [534 tot en met 536][ref6] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.12
