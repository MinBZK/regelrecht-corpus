  - number: '2.4'
    text: |-
      1 Onze Minister van Infrastructuur en Milieu geeft op aanvraag de medische verklaring, bedoeld in
      [artikel 2.2][ref1], af, indien betrokkene voldoet aan de eisen van medische geschiktheid om de werkzaamheden te
      verrichten, waarvoor betrokkene een bewijs van bevoegdheid of bevoegdverklaring heeft aangevraagd of is verleend.

      2 De medische verklaring wordt, al dan niet onder beperkingen, verleend voor een bij algemene maatregel van bestuur
      vast te stellen termijn. Onze Minister van Infrastructuur en Milieu verlengt op aanvraag de medische verklaring
      voor een bij algemene maatregel van bestuur vast te stellen termijn, indien de houder voldoet aan de in het eerste
      lid bedoelde eisen.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gegeven omtrent:

      a. de eisen van medische geschiktheid;

      b. de ten behoeve van de afgifte van een medische verklaring te verrichten medische keuring;

      c. de verplichtingen van de houder van de medische verklaring;

      d. de eisen waaraan een geneeskundige of geneeskundige instantie moet voldoen teneinde een autorisatie te
      verkrijgen;

      e. de aanwijzing van instellingen die in het kader van een autorisatie als bedoeld in [onderdeel d][ref2] een
      certificaat kunnen afgeven;

      f. de mogelijkheid van herbeoordeling;

      g. de vergoeding, die de aanvrager is verschuldigd voor de kosten van de handelingen ten behoeve van de aanvraag
      tot afgifte van de autorisatie, bedoeld in [onderdeel d][ref3].

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven omtrent de beperkingen waaronder een
      medische verklaring kan worden afgegeven.

      5 Onze Minister autoriseert geneeskundigen of geneeskundige instanties die met het verrichten van medische
      keuringen worden belast.

      6 Bij het besluit van Onze Minister van Infrastructuur en Milieu over de autorisatie kunnen in aanmerking worden
      genomen het aantal reeds geautoriseerde geneeskundigen of geneeskundige instanties, hun specialisme en de spreiding
      van de geautoriseerde geneeskundigen of geneeskundige instanties over het land in relatie tot de regionale of
      plaatselijke behoefte.

      7 De medische verklaring is ongeldig gedurende de periode dat de gezondheidstoestand van de houder zodanig is, dat
      deze niet meer in staat is de werkzaamheden, waarvoor hem een bewijs van bevoegdheid is verleend, te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2.4
