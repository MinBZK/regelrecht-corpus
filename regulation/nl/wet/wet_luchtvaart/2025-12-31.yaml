        afdeling: '8.4'
  - number: 8.25df
    text: |-
      1 De exploitant van de luchthaven raadpleegt voor elk investeringsproject of elk afzonderlijk onderdeel daarvan,
      die gebruikers en representatieve organisaties, die hebben aangegeven deel te willen nemen in een specifiek voor
      dit investeringsproject opgerichte projectgroep.

      2 De exploitant van de luchthaven stelt voor elk investeringsproject, voorafgaande aan de start van de aanbesteding
      van dat investeringsproject of elk afzonderlijk onderdeel daarvan, in ieder geval een raming en de daarbij
      behorende functionele specificaties vast en deelt deze mede aan de gebruikers en de representatieve organisaties
      die deelnemen in de in het eerste lid, bedoelde projectgroep.

      3 De exploitant van de luchthaven betrekt bij de vaststelling van de raming en de daarbij behorende functionele
      specificaties van elk investeringsproject, of elk afzonderlijk onderdeel daarvan, de zienswijzen van de gebruikers
      en van de representatieve organisaties die deelnemen in de in het eerste lid, bedoelde projectgroep.

      4 De exploitant van de luchthaven doet, voor aanvang van de realisatiefase van elk investeringsproject, of elk
      afzonderlijk onderdeel daarvan, aan de leden van de in het eerste lid bedoelde projectgroep, in ieder geval
      mededeling van de vaststelling van de omvang van de investeringsbegroting en de functionele specificaties van dat
      investeringsproject.

      5 De exploitant van de luchthaven doet, na afloop van de realisatie van elk investeringsproject, of elk
      afzonderlijk onderdeel daarvan, aan de leden van de in het eerste lid, bedoelde projectgroep, mededeling
      ter zake van in ieder geval de daadwerkelijke uitgaven en de gerealiseerde functionele specificaties van dat
      investeringsproject, of elk afzonderlijk onderdeel daarvan, en de verschillen met de investeringsbegroting,
      respectievelijk de in het kader van de aanbesteding vastgestelde functionele specificaties.

      6 Bij wijziging van de in het vierde lid, bedoelde functionele specificaties, in de periode vanaf de aanvang van
      de realisatiefase tot het moment van afronding van de realisatiefase, is het eerste tot en met vijfde lid van
      overeenkomstige toepassing.

      7 In het geval dat het investeringsproject geheel bestaat uit diensten, leveringen of werken, die niet behoeven te
      worden aanbesteed, is het eerste tot en met vijfde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.25df
  - number: 8.25dg
    text: |-
      1 De exploitant van de luchthaven verrekent met het oog op een in [artikel 8.25d, vierde en vijfde lid][ref1],
      bedoelde aanpassing van de tarieven, en met inachtneming van deze leden, de verschillen tussen de geraamde en de
      werkelijke opbrengsten en kosten, in verband met de prognoses en de realisatie van het volume van het verkeer en
      vervoer, zoals volgt uit de financiële verantwoordingen.

      2 De exploitant van de luchthaven verrekent met het oog op een in [artikel 8.25d, vierde lid][ref2], bedoelde
      aanpassing van de tarieven voor beveiliging, en met inachtneming van dit lid, de meeropbrengst uit de in
      [artikel 8.25dc, vierde lid][ref3], bedoelde tarieven voor de beveiliging, die zijn verkregen nadat een in
      [artikel 8.25dd, derde lid][ref4], bedoelde structurele maatregel is ingetrokken, en de tarieven voor de
      beveiliging van de burgerluchtvaart nog niet dienovereenkomstig zijn aangepast, zoals volgt uit de financiële
      verantwoordingen.

      3 De exploitant van de luchthaven verrekent met het oog op een aanpassing van de tarieven, als bedoeld in
      [artikel 8.25d, vierde en vijfde lid][ref5], en met inachtneming van deze leden, de omzet als gevolg van het
      verschil tussen het door de exploitant van de luchthaven in rekening gebrachte tarief en het tarief, als bedoeld
      in [artikel 8.25f, vierde lid][ref6], dat door de exploitant van de luchthaven is vastgesteld naar aanleiding
      van een besluit van de Autoriteit Consument en Markt. De in dit lid bedoelde omzet volgt uit de financiële
      verantwoordingen.

      4 De exploitant van de luchthaven verrekent met het oog op een in [artikel 8.25d, vierde en vijfde lid][ref7],
      bedoelde aanpassing van de tarieven, en met inachtneming van deze leden, de omzet als gevolg van het verschil
      tussen het door de exploitant van de luchthaven in rekening gebrachte tarief en het tarief, dat door de exploitant
      van de luchthaven is vastgesteld naar aanleiding van een op grond van [artikel 11.24][ref8] genomen besluit van de
      Autoriteit Consument en Markt of een rechterlijke uitspraak. De in dit lid bedoelde omzet volgt uit de financiële
      verantwoordingen.

      5 De exploitant van de luchthaven verrekent met het oog op een in [artikel 8.25d, vierde en vijfde lid][ref9]
      bedoelde aanpassing van de tarieven, en met inachtneming van deze leden, de toe- of afname van de omzet als gevolg
      van een in het derde lid dan wel vierde lid bedoeld besluit van de Autoriteit Consument en Markt, of een besluit
      van de rechter dat gevolgen heeft voor de structuur van een deel van de tarieven. De in dit lid bedoelde toe- of
      afname van de omzet volgt uit de financiële verantwoordingen.

      6 De exploitant van de luchthaven verrekent met het oog op een in [artikel 8.25d, vierde en vijfde lid][ref10],
      bedoelde aanpassing van de tarieven, en met inachtneming van deze leden, het verschil in afschrijvings-, vermogens-
      en operationele kosten zoals opgenomen in de investeringsbegroting van de investering, zoals deze is opgenomen
      in het in [artikel 8.25de][ref11] bedoelde investeringsprogramma en de werkelijke afschrijvings-, vermogens- en
      operationele kosten van deze investeringen, zoals deze volgen uit de financiële verantwoordingen. De voorgaande
      volzin is van overeenkomstige toepassing in gevallen van eerdere of latere ingebruikneming of buitengebruikstelling
      van activa dan gepland gedurende de periode waarvoor de in artikel 8.25d of [artikel 8.25db][ref12], bedoelde
      tarieven van kracht zijn. De in dit lid bedoelde verschillen in afschrijvings-, vermogens- en operationele kosten
      volgen uit de financiële verantwoordingen.

      7 De exploitant van de luchthaven verrekent met het oog op een in [artikel 8.25d, vierde en vijfde lid][ref13],
      bedoelde aanpassing van de tarieven, en met inachtneming van deze leden, de verschillen tussen de geraamde en de
      werkelijke kosten in verband met activiteiten op verzoek van een gebruiker dan wel opgelegd door de overheid. De in
      dit lid bedoelde verschillen volgen uit de financiële verantwoordingen.

      8 De exploitant van de luchthaven verrekent met het oog op een in [artikel 8.25d, vierde en vijfde lid][ref14],
      bedoelde aanpassing van de tarieven, en met inachtneming van deze leden, de toe- of afname van de kosten, die het
      gevolg is van het aanvangen, respectievelijk ophouden te bestaan van de in [artikel 8.25db, tweede lid][ref15],
      bedoelde uitzonderlijke en onvoorziene omstandigheden. De in dit lid bedoelde toe- of afname van de kosten volgt
      uit de financiële verantwoordingen.

      9 Indien de in [artikel 8.25df, vijfde lid][ref16], bedoelde daadwerkelijke investeringsuitgaven lager zijn
      dan de in artikel 8.25df, vierde lid, dan wel zesde lid, bedoelde investeringsbegroting en het verschil tussen
      die uitgaven en de begroting groter is dan een bij algemene maatregel van bestuur vast te stellen percentage,
      verrekent de exploitant van de luchthaven dit verschil, in afwijking van het zesde lid, met het oog op een
      in [artikel 8.25d, vierde lid][ref17], bedoelde aanpassing van de tarieven, en met inachtneming van dit lid,
      gedurende de resterende jaren van de in artikel 8.25d, eerste lid, bedoelde periode van drie jaar, waarin het
      investeringsproject of een onderdeel daarvan in gebruik wordt genomen en de direct daarop volgende periode van drie
      jaar. De verrekening van het verschil in de in de vorige volzin bedoelde periode is gelijk aan de helft van het
      verschil in jaarlijkse afschrijvings-, vermogens- en operationele kosten dat het gevolg is van het verschil tussen
      de in artikel 8.25df, vierde lid, dan wel zesde lid, bedoelde investeringsbegroting, van het investeringsproject,
      en de lagere in artikel 8.25df, vijfde lid, bedoelde daadwerkelijke uitgaven van het investeringsproject. Het in
      dit lid bedoelde verschil volgt uit de financiële verantwoordingen.

      10 Indien de in [artikel 8.25df, vijfde lid][ref18], bedoelde daadwerkelijke investeringsuitgaven hoger zijn dan
      de in artikel 8.25df, vierde lid, dan wel het zesde lid, bedoelde investeringsbegroting en het verschil tussen die
      uitgaven en de begroting groter is dan een bij algemene maatregel van bestuur vast te stellen percentage blijft,
      in afwijking van het zesde lid, het verschil in afschrijvings-, vermogens- en operationele kosten dat voortvloeit
      uit het verschil tussen daadwerkelijke investeringsuitgaven en de investeringsbegroting buiten de kosten en de
      tarieven gedurende de resterende jaren van de in [artikel 8.25d, eerste lid][ref19], bedoelde periode van drie
      jaar, waarin het investeringsproject of elk afzonderlijk onderdeel daarvan in gebruik wordt genomen, en de direct
      daarop volgende periode van drie jaar. Het in de eerste volzin bepaalde is niet van toepassing, indien en voor
      zover het verschil tussen de investeringsbegroting en de hogere daadwerkelijke investeringsuitgaven het gevolg is
      van uitzonderlijke en onvoorziene omstandigheden.

      11 De exploitant van de luchthaven verrekent met het oog op een in [artikel 8.25d, vierde en vijfde lid][ref20],
      bedoelde aanpassing van de tarieven, en met inachtneming van deze leden, het verschil tussen de geraamde en de
      daadwerkelijke kosten in verband met verzekeringspremies tegen schade als gevolg van terrorisme, zoals volgt uit de
      financiële verantwoordingen.

      12 De exploitant van de luchthaven verrekent met het oog op een in [artikel 8.25d, vierde en vijfde lid][ref21],
      bedoelde aanpassing van de tarieven, en met inachtneming van deze leden, de verschillen tussen de geraamde en de
      werkelijke kosten in verband met een uitstel van de uitvoering van activiteiten ten opzichte van de prognose, zoals
      volgt uit de financiële verantwoordingen.


