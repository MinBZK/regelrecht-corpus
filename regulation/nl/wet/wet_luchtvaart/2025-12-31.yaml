  - number: 8.25dj
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan een groep luchthavens die wordt geëxploiteerd door de exploitant
      van de luchthaven of, indien dit een ander is, een en dezelfde houder van de luchthavenexploitatievergunning,
      aanwijzen als luchthavennetwerk.

      2 Onze Minister van Infrastructuur en Milieu kan de exploitant van het luchthavennetwerk toestemming verlenen om
      een gemeenschappelijk, transparant systeem van tarieven vast te stellen voor het gehele luchthavennetwerk.

      3 Onze Minister van Infrastructuur en Milieu kan de exploitant van de luchthaven en de exploitant van elke
      deelnemende overige burgerluchthaven, voor zover zij luchtverbindingen voor dezelfde stad of agglomeratie
      verzorgen, toestemming verlenen om een gemeenschappelijk, transparant systeem van tarieven vast te stellen voor
      alle luchthavens die de luchtverbindingen voor dezelfde stad of agglomeratie verzorgen.

      4 In geval van een gemeenschappelijk, transparant systeem van tarieven, als bedoeld in het tweede of derde
      lid, doet de exploitant van de luchthaven aan de gebruikers en representatieve organisaties mededeling van een
      voorstel voor de tarieven en voorwaarden en stelt hij de tarieven en voorwaarden vast voor de luchthaven Schiphol
      overeenkomstig de [artikelen 8.25d tot en met 8.25h][ref1] en de krachtens deze artikelen gestelde regels. De
      exploitant van elke deelnemende overige burgerluchthaven doet aan de gebruikers en representatieve organisaties
      mededeling van een voorstel en stelt de tarieven vast overeenkomstig de [artikel 8.25d][ref2], [8.25da][ref3],
      [8.25db][ref4], [8.25dc, eerste lid][ref5], [8.25dd][ref6], [8.25de, eerste lid][ref7],[8.25df, eerste lid][ref8],
      [8.25dg][ref9], [8.25e][ref10], [8.25f][ref11], [8.25fa][ref12], [8.25h][ref13] en [8.25j][ref14] en de krachtens
      deze artikelen gestelde regels. De exploitant en de deelnemende overige burgerluchthavens dragen zorg voor de
      noodzakelijke onderlinge afstemming.


