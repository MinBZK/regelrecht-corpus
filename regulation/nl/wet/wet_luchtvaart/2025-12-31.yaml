  - number: '8.79'
    text: |-
      Indien Onze Minister van Infrastructuur en Milieu voor een luchthaven een commissie regionaal overleg luchthaven
      instelt, is [artikel 8.75, lid 2, 3 en 4][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.75
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.79
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.75'
        hoofdstuk: '8'
