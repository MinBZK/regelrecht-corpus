  - number: '10.30'
    text: |-
      1 Zodra Onze Minister van Defensie ter zake van een vergunning voor burgermedegebruik constateert dat een
      grenswaarde, daaronder begrepen een vastgesteld maximum aantal vliegtuigbewegingen, ten behoeve van het vergunde
      burgermedegebruik is overschreden, schrijft hij maatregelen voor die naar zijn oordeel bijdragen aan het
      terugdringen van de belasting vanwege het verkeer ten behoeve van de burgerluchtvaart.

      2 Onze Minister van Defensie trekt de maatregelen in of matigt deze voor zover zij naar zijn oordeel niet langer
      nodig zijn voor het terugdringen van de belasting vanwege het luchthavenluchtverkeer binnen de grenswaarden,
      daaronder begrepen het aantal vliegtuigbewegingen voor dat verkeer.

      3 Voordat Onze Minister van Defensie een maatregel voorschrijft, stelt hij degene tot wie de maatregel is gericht
      in de gelegenheid zijn zienswijze kenbaar te maken.

      4 De [artikelen 8.19][ref1] en [8.21][ref2] zijn in geval de vergunning voor burgermedegebruik is verleend aan een
      burgerexploitant, van overeenkomstige toepassing ten aanzien van de voorgeschreven maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.19
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.21
