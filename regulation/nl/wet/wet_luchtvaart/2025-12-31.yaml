  - number: '8.29'
    text: |-
      1 De inspecteur-generaal brengt elk half jaar aan Onze Minister van Infrastructuur en Milieu verslag uit over de
      veiligheids- en milieuaspecten van het luchthavenluchtverkeer. Het verslag bevat ten minste een beschrijving van:

      a. de ter uitvoering van [artikel 8.18][ref1] getroffen voorzieningen en van de doelmatigheid en doeltreffendheid
      van die voorzieningen;

      b. de ter uitvoering van [artikel 8.22][ref2] getroffen maatregelen en van de doelmatigheid en de doeltreffendheid
      van die maatregelen.

      2 Bij ministeriële regeling worden nadere regels gesteld omtrent de verslaglegging.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.18
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.22
