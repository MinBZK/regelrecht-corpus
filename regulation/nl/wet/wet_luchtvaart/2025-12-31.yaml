  - number: '11.16'
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan een bestuurlijke boete opleggen bij overtreding van:

      a. [artikel 5.14c][ref1] of [5.14d, eerste lid][ref2];

      b. artikel 4, zesde, achtste en negende lid, en artikel 13, vierde en vijfde lid, van de verordening voorvallen;

      c. [artikel 8.19][ref3], [8.20][ref4], [8.21][ref5], [8.70, tweede lid][ref6], juncto de artikelen 8.19 tot en
      met 8.21, [8.77, tweede lid][ref7], juncto de artikelen 8.19 en 8.21, eerste en derde lid, of van een beperking of
      voorschrift als bedoeld in [artikel 8.23][ref8], 8.70, tweede lid, juncto artikel 8.23 of 8.77, tweede lid, juncto
      artikel 8.23;

      d. [artikel 7.5][ref9] of van een maatregel als bedoeld in [artikel 8.22][ref10], [8.70, tweede lid][ref11], juncto
      artikel 8.22 of [8.77, tweede lid][ref12], juncto [artikel 8.2][ref13];

      e. het bepaalde bij of krachtens:

      1°. Verordening (EG) nr. 261/2004 van het Europees Parlement en de Raad van de Europese Unie van 11 februari
      2004 tot vaststelling van gemeenschappelijke regels inzake compensatie en bijstand aan luchtreizigers bij
      instapweigering en annulering of langdurige vertraging van vluchten en tot intrekking van Verordening (EEG) nr.
      259/91 (PbEU L 46);

      2°. Hoofdstuk III van Verordening (EG) nr. 2111/2005 van het Europees Parlement en de Raad van de Europese Unie van
      14 december 2005 betreffende de vaststelling van een communautaire lijst van luchtvaartmaatschappijen waaraan een
      exploitatieverbod binnen de Gemeenschap is opgelegd en het informeren van luchtreizigers over de identiteit van de
      exploiterende luchtvaartmaatschappij en tot intrekking van artikel 9 van richtlijn nr. 2004/36/EG (PbEU L 344);

      3°. Verordening (EG) nr. 1107/2006 van het Europees Parlement en de Raad van de Europese Unie van 5 juli 2006
      inzake de rechten van gehandicapten en personen met beperkte mobiliteit die per luchtvervoer reizen (PbEU L 204);

      4°. artikel 21, tweede lid, van de onderzoeksverordening en

      5°. [artikel 8a.52][ref14], voor zover de nadere regels betrekking hebben op het gebruik van «slots» als bedoeld
      in artikel 2, onder a, van [Verordening (EEG) nr. 95/93](31993R0095) van de Raad van de Europese Gemeenschappen van
      18 januari 1993 betreffende gemeenschappelijke regels voor de toewijzing van «slots» op communautaire luchthavens
      (PbEG 1993, L 14);

      6°. artikel 6, derde lid, van [Verordening (EU) 2023/2405](32023R2405).

      2 Een bestuurlijke boete en een last onder dwangsom kunnen tezamen worden opgelegd.

      3 De bestuurlijke boete bedraagt ten hoogste:

      a. 500 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel a;

      b. 1 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel b, voor zover het betreft de meldplicht,
      bedoeld in artikel 4, zesde lid, van de verordening voorvallen;

      c. 100 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel c;

      d. 1 000 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel d;

      e. 74.000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel e, met uitzondering van subonderdeel
      5°;

      f. 2.000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel b, voor zover het betreft de meldplicht,
      bedoeld in artikel 4, achtste en negende lid, en de rapportageplicht bedoeld in artikel 13, vierde en vijfde lid,
      van de verordening voorvallen;

      g. 670 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel e, subonderdeel 5°;

      h. het bedrag dat is vastgesteld voor de zesde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref15], bij een overtreding als bedoeld in het eerste lid,
      onderdeel e, subonderdeel 6°.


