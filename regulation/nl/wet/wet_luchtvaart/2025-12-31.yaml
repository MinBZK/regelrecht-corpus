  - number: 8.25fa
    text: |-
      1 Een deelnemer aan de in [artikel 8.25df, eerste lid][ref1], bedoelde projectgroep, kan binnen twee weken na de
      dag waarop de in artikel 8.25df, tweede lid, bedoelde mededeling door de exploitant van de luchthaven heeft plaats
      gehad een aanvraag bij de Autoriteit Consument en Markt indienen om een beoordeling van de juiste en tijdige
      uitvoering van de in [artikel 8.25e, zevende lid][ref2], bedoelde procedure, inzake een investeringsproject of
      onderdeel daarvan. De Autoriteit Consument en Markt deelt de exploitant van de luchthaven terstond mede dat een
      aanvraag van een deelnemer aan de projectgroep is ontvangen.

      2 De Autoriteit Consument en Markt beslist zo spoedig mogelijk op de in het eerste lid, bedoelde aanvraag, doch
      uiterlijk binnen twee maanden na ontvangst van een aanvraag.

      3 Indien de Autoriteit Consument en Markt vaststelt dat de regels ter zake van de in
      [artikel 8.25e, zevende lid][ref3], bedoelde procedure, door de exploitant van de luchthaven niet tijdig, niet
      volledig of niet correct zijn nagekomen, deelt de Autoriteit Consument en Markt dit mede aan de exploitant van de
      luchthaven en de aanvrager.

      4 De exploitant van de luchthaven informeert de in [artikel 8.25df, eerste lid][ref4], bedoelde projectgroep, met
      inachtneming van de overwegingen van de Autoriteit Consument en Markt, op grond van het tweede lid en geeft tevens
      aan op welke wijze en op welk tijdstip alsnog een tijdige, volledige dan wel correcte nakoming van de regels ter
      zake van de in [artikel 8.25e, zevende lid][ref5], bedoelde procedure zal plaats hebben.

      5 De exploitant van de luchthaven doet, met inachtneming van het besluit en de overwegingen van de Autoriteit
      Consument en Markt, de in [artikel 8.25df, eerste lid][ref6], bedoelde projectgroep mededeling van in ieder geval
      de aanpassingen van de investeringsraming, de onderbouwing daarvan en de bij het betreffende investeringsproject
      behorende functionele specificaties.

      6 Het eerste lid is niet van toepassing op de in het vijfde lid bedoelde mededeling.

      7 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de in het eerste lid
      bedoelde aanvraag aan de Autoriteit Consument en Markt.


