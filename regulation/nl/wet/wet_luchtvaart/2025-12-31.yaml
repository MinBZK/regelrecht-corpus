  - number: 1.2a
    text: |-
      1 Het is verboden toestellen, die geen luchtvaartuig zijn, in het luchtruim te gebruiken. Onze Minister van
      Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kan bij ministeriële regeling voor door hem aan
      te wijzen toestellen vrijstelling verlenen van het verbod.

      2 Aan de vrijstelling, bedoeld in het eerste lid, kunnen voorschriften of beperkingen worden verbonden. Het is
      verboden in strijd met deze voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel1.2a
  - number: '1.3'
    text: |-
      Een luchtvaartmaatschappij is verplicht er voor zorg te dragen, dat:

      a. de door haar geëxploiteerde luchtvaartuigen in een zodanige staat zijn, dat daarmee veilig gevlogen en vervoerd
      kan worden;

      b. het boordpersoneel van de door haar geëxploiteerde luchtvaartuigen over voldoende kennis, bedrevenheid en
      ervaring beschikt;

      c. al datgene wordt gedaan, wat in haar vermogen ligt om ernstige lichamelijke of geestelijke vermoeidheid van de
      leden van het boordpersoneel bij de bediening van luchtvaartuigen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel1.3
  - number: '1.4'
    text: |-
      Voor zover Onze Minister van Infrastructuur en Milieu onderscheidenlijk Onze Minister van Defensie, beslissingen
      neemt ingevolge bij of krachtens deze wet verleende bevoegdheden, die mede betrekking hebben op de militaire
      luchtvaart onderscheidenlijk de burgerluchtvaart handelt hij in overeenstemming met Onze Minister van Defensie
      onderscheidenlijk Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel1.4
  - number: '1.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen regels gesteld worden ter
      uitvoering van hetgeen bij of krachtens de basisverordening is bepaald.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel1.5
  - number: '1.6'
    text: |-
      Het is verboden in strijd te handelen met bij ministeriële regeling aangewezen voorschriften van hetgeen bij of
      krachtens de basisverordening is bepaald.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel1.6
  - number: '1.7'
    text: |-
      1 De kosten die samenhangen met het in behandeling nemen van de aanvraag, afgifte, wijziging, beperking, schorsing,
      intrekking, verlenging en vernieuwing van bewijzen van bevoegdheid, verklaringen, certificaten en overige
      documenten die bij of krachtens de basisverordening worden afgegeven, worden ten laste gebracht van de aanvrager
      van het document.

      2 De bedragen ter vergoeding van de kosten, bedoeld in het eerste lid, worden bij ministeriële regeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel1.7
  - number: '2.1'
    text: |-
      1 Het is verboden een luchtvaartuig te bedienen, luchtverkeersdiensten te verlenen, luchthaveninformatie
      te verstrekken of een grondstation of een mobiel station in de luchtvaartmobiele band, waarvoor
      een vergunning is vereist als bedoeld in [artikel 3.13 van de Telecommunicatiewet][ref1] of de
      [Wet telecommunicatievoorzieningen BES][ref2], te bedienen zonder het daarvoor geldige bewijs van bevoegdheid of
      geldige bewijs van gelijkstelling.

      2 Voor het bedienen van een Nederlands burgerluchtvaartuig, het verlenen van luchtverkeersdiensten, het verstrekken
      van luchthaveninformatie of het bedienen van een grondstation of een mobiel station als bedoeld in het eerste lid
      is het bezit vereist van hetzij:

      a. een door Onze Minister van Infrastructuur en Milieu afgegeven bewijs van bevoegdheid of bewijs van
      gelijkstelling,

      b. een bewijs van bevoegdheid of bewijs van gelijkstelling, afgegeven door de bevoegde autoriteit van een door
      Onze Minister van Infrastructuur en Milieu op grond van [artikel 2.8][ref3] aangewezen staat of door een door
      hem aangewezen internationale organisatie. Betrokkene dient in geval van toepassing van onderdeel a tevens in het
      bezit te zijn van een geldige medische verklaring, bedoeld in [artikel 2.4][ref4], afgegeven door Onze Minister van
      Infrastructuur en Milieu dan wel door de bevoegde autoriteit van een door hem aangewezen staat, hetzij

      c. een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref5].

      3 Bij algemene maatregel van bestuur kunnen andere werkzaamheden aan boord van een burgerluchtvaartuig worden
      aangewezen, die niet mogen worden verricht zonder een door Onze Minister van Infrastructuur en Milieu afgegeven
      bewijs van bevoegdheid, bewijs van gelijkstelling of een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref6].

      4 Onze Minister van Infrastructuur en Milieu kan ontheffing verlenen van het bepaalde bij of krachtens dit artikel,
      wanneer door bijzondere omstandigheden die regels in redelijkheid geen toepassing kunnen vinden en de veiligheid
      van het luchtverkeer met het verlenen van de ontheffing niet in gevaar wordt gebracht. Aan de ontheffing kunnen
      voorschriften of beperkingen worden verbonden.

      5 Onze Minister van Infrastructuur en Milieu trekt de door hem verleende ontheffing in, wanneer

      a. de redenen, waarom de ontheffing is verleend, zijn komen te vervallen;

      b. de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.

      6 Het is verboden te handelen in strijd met een voorschrift als bedoeld in het vierde lid.

      7 Voor zover het eerste lid betrekking heeft op het bedienen van een grondstation of een mobiel station als bedoeld
      in dat lid, is het onverminderd [artikel 1.2, eerste lid][ref7], eveneens van toepassing op het continentaal plat,
      bedoeld in [artikel 1 van de Mijnbouwwet][ref8], voor zover dat buiten het vluchtinformatiegebied Amsterdam ligt.


