  - number: 8.23a
    text: |-
      1 Bij regeling van Onze Minister van Infrastructuur en Milieu kan worden bepaald dat bij wijze van experiment wordt
      afgeweken van krachtens [artikel 8.15][ref1] gestelde voorschriften, mits de commissie regionaal overleg luchthaven
      Schiphol, bedoeld in [artikel 8.34][ref2] of een ander bij ministeriële regeling aan te wijzen regionaal orgaan,
      bij advies heeft aangegeven dat het experiment een gunstig effect kan hebben op de hinderbeleving. De afwijking kan
      bestaan uit:

      a. het verlenen van vrijstelling van een regel in het luchthavenverkeerbesluit voorzover deze de luchtverkeerwegen
      of het gebruik van het luchtruim en de beschikbaarheid van de banen betreft, of

      b. het vervangen van een in het luchthavenverkeerbesluit vastgelegde grenswaarde voor de geluidbelasting in een
      bepaald punt door een andere grenswaarde.

      2 In de ministeriële regeling wordt het doel van het experiment vastgesteld, alsmede op welke wijze van welke
      voorschriften wordt afgeweken en op welke wijze eventuele nadelige gevolgen zo veel mogelijk worden beperkt.

      3 In de ministeriële regeling kan worden bepaald in hoeverre, op welke wijze en door wie eventuele nadelige
      gevolgen worden gecompenseerd. In dat geval is [artikel 8.31][ref3] niet van toepassing.

      4 Tevens worden in de ministeriële regeling regels gesteld over de uitvoering en de gevolgen van het experiment,
      over criteria aan de hand waarvan kan worden bepaald of het experiment wordt omgezet in een structurele wettelijke
      regeling, en worden voorzieningen getroffen voor onvoorziene gevallen die zich gedurende het experiment kunnen
      voordoen.

      5 Een experiment kan slechts worden toegestaan voor een bepaalde in de ministeriële regeling vast te stellen
      termijn van ten hoogste een jaar. Deze termijn kan eenmaal met maximaal een jaar worden verlengd. De looptijd van
      een experiment sluit zoveel mogelijk aan bij een gebruiksjaar. Bij voortijdige beëindiging van het experiment stelt
      Onze Minister van Infrastructuur en Milieu een overgangsregeling vast.

      6 Indien voor afloop van een experiment en in overeenstemming met de [artikelen 8.13][ref4], [8.14][ref5] of
      [8.24][ref6] een ontwerp is bekendgemaakt om het experiment om te zetten in een structurele wettelijke regeling,
      kan bij ministeriële regeling de termijn van het experiment worden verlengd tot het tijdstip waarop het ontwerp is
      vastgesteld en in werking treedt.

      7 Onze Minister van Infrastructuur en Milieu zendt voldoende tijdig voor het einde van de werkingsduur van een
      ministeriële regeling als bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en
      de effecten van het experiment in de praktijk, alsmede een standpunt inzake de voortzetting ervan anders dan als
      experiment. Onze Minister van Infrastructuur en Milieu bericht de beide kamers der Staten-Generaal bij vaststelling
      van deze ministeriële regeling wanneer en over de wijze waarop hij verslag zal doen.

      8 Een ministeriële regeling als bedoeld in het eerste lid wordt niet eerder vastgesteld dan nadat het voorstel
      voor advies is voorgelegd aan de commissie regionaal overleg luchthaven Schiphol, bedoeld in [artikel 8.34][ref7],
      in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen vier weken na de dag
      waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister van Infrastructuur en Milieu
      te brengen.

      9 De commissie regionaal overleg luchthaven Schiphol, bedoeld in [artikel 8.34][ref8], danwel een ander per
      ministeriële regeling aan te wijzen orgaan, kan Onze Minister van Infrastructuur en Milieu verzoeken om een
      ministeriële regeling als bedoeld in het eerste lid vast te stellen. Onze Minister van Infrastructuur en Milieu
      overweegt het verzoek en deelt uiterlijk zes weken na ontvangst van het verzoek zijn overwegingen, met redenen
      omkleed, aan de commissie en aan de Tweede Kamer der Staten-Generaal mee.


