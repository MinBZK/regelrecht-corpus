  - number: 8.25h
    text: |-
      1 De exploitant van de luchthaven zendt de Autoriteit Consument en Markt een afschrift van de in
      [artikelen 8.25da, eerste, vierde en vijfde lid][ref1], [8.25db, vierde lid][ref2], [8.25de, tweede lid][ref3],
      [8.25df, tweede en vijfde lid][ref4] en [8.25e, eerste tot en met derde, zesde en zevende lid][ref5], bedoelde
      mededelingen.

      2 De exploitant van de luchthaven verleent binnen de door de Autoriteit Consument en Markt gestelde termijn alle
      medewerking die deze redelijkerwijs kan verlangen bij de uitoefening van haar bevoegdheden op grond van deze wet.

      3 [Artikel 4:15 van de Algemene wet bestuursrecht][ref6] is van overeenkomstige toepassing indien de Autoriteit
      Consument en Markt aan de exploitant van de luchthaven om gegevens verzoekt met het oog op een te nemen besluit.

      4 Ingeval van overtreding van het tweede lid is
      [artikel 12m van de Instellingswet Autoriteit Consument en Markt][ref7] van overeenkomstige toepassing.


