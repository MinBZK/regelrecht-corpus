  - number: '11.1'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet, met uitzondering van de
      [artikelen 8.25d tot en met 8.25h][ref1], bepaalde en het bij of krachtens de basisverordening bepaalde, zijn
      belast:

      a. de in [artikel 141 van het Wetboek van Strafvordering][ref2] bedoelde ambtenaren, met dien verstande dat dit
      toezicht zich niet uitstrekt tot het bepaalde bij of krachtens [titel 6.5][ref3] en de [artikelen 10.7][ref4] en
      [10.8][ref5] van deze wet;

      b. voor zover het betreft de burgerluchtvaart de hiertoe bij besluit van Onze Minister van Infrastructuur en Milieu
      aangewezen ambtenaren; de aanwijzing kan inhouden, dat de betrokken ambtenaar slechts belast is met het toezicht
      op de naleving van een of enkele in die aanwijzing genoemde hoofdstukken of artikelen gesteld bij of krachtens
      deze wet;

      c. voor zover het betreft het vervoer van gevaarlijke stoffen als bedoeld in [titel 6.5][ref6] en de
      [artikelen 10.7][ref7] en [10.8][ref8] van deze wet, met luchtvaartuigen waarvan de krijgsmacht of de krijgsmacht
      van een andere mogendheid houder is, de hiertoe bij besluit van Onze Minister van Defensie aangewezen ambtenaren;
      de aanwijzing kan inhouden dat de betrokken ambtenaar slechts belast is met het toezicht op de naleving van een of
      enkele in die aanwijzing genoemde artikelen gesteld bij of krachtens deze wet;

      d. voor zover het betreft [titel 8A.6][ref9] de hiertoe bij besluit van Onze Minister van Infrastructuur en Milieu
      aangewezen ambtenaren.

      2 Met het toezicht op de naleving van hetgeen bepaald is bij of krachtens de verordeningen als bedoeld in
      [artikel 11.15, onderdeel b, onder 1° tot en met 8°, 10° en 11°][ref10], zijn belast de hiertoe bij
      besluit van Onze Minister van Infrastructuur en Milieu aangewezen ambtenaren. De aanwijzing kan inhouden, dat de
      betrokken ambtenaar slechts belast is met het toezicht op de naleving van een of enkele in die aanwijzing genoemde
      hoofdstukken of artikelen gesteld bij of krachtens een van de genoemde verordeningen.

      3 Onze Minister van Infrastructuur en Milieu kan met het oog op de coördinatie van het beleid ten aanzien van het
      toezicht algemene aanwijzingen geven aan de ambtenaren, bedoeld in het eerste lid, onderdeel a.

      4 Van een besluit als bedoeld in het eerste lid, de onderdelen b tot en met d, of het tweede lid wordt mededeling
      gedaan door plaatsing in de Staatscourant.


