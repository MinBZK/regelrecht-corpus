  - number: '10.13'
    text: |-
      1 Het is verboden met een burgerluchtvaartuig op te stijgen van of te landen op een militaire luchthaven, zonder
      of in afwijking van een voor dat opstijgen of landen door Onze Minister van Defensie verleende vergunning voor
      burgermedegebruik als bedoeld in [artikel 10.27][ref1], vrijstelling of ontheffing.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het gebruik van
      militaire luchthavens door de burgerluchtvaart. Deze regels betreffen in ieder geval de gevallen waarin militair
      luchtverkeer voorrang heeft op burgerluchtverkeer.

      3 Aan de in het eerste lid bedoelde vrijstelling en ontheffing kunnen beperkingen en voorschriften worden
      verbonden.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het verlenen, wijzigen
      en intrekken van de vrijstelling of ontheffing, alsmede omtrent de aan de behandeling van de aanvraag verbonden
      kosten.

      5 Een vrijstelling of ontheffing wordt niet verleend voor burgerluchtvaart van commerciële aard op een luchthaven
      waar burgermedegebruik plaatsvindt door tussenkomst van een burgerexploitant.

      6 Een vrijstelling of ontheffing kan in ieder geval door Onze Minister van Defensie worden ingetrokken of gewijzigd
      wanneer:

      a. een of meer redenen waarom de vrijstelling of ontheffing is verleend, zijn vervallen,

      b. een of meer van de daaraan verbonden beperkingen of voorschriften niet worden nageleefd, of

      c. na de verlening zodanige feiten of omstandigheden bekend zijn geworden dat, indien deze ten tijde van de
      verlening bekend waren geweest, de vrijstelling of ontheffing niet of niet in die vorm zou zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.27
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.13
