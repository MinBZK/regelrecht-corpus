  - number: 12.6a
    text: |-
      1 De eerste mededeling van een voorstel als bedoeld in [artikel 8.25e, eerste lid][ref1], zoals dat luidt met
      ingang van het tijdstip van inwerkingtreding van de wet van 22 juni 2016 tot wijziging van de Wet luchtvaart in
      verband met de evaluatie van de Wet van 29 juni 2006 tot wijziging van de Wet luchtvaart inzake de exploitatie
      van de luchthaven Schiphol (Stb. 2016, 272), wordt gedaan na het verstrijken van een periode van een jaar na dat
      tijdstip maar vóór de eerstvolgende datum van 1 oktober gelegen na het verstrijken van deze periode.

      2 Het recht zoals dat luidde onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van de in het eerste
      lid genoemde wet, blijft van toepassing op:

      a. de mededeling van een voorstel dat wordt gedaan met het oog op de vaststelling van tarieven en voorwaarden
      die gelden gedurende de periode die is gelegen vóór het tijdstip waarop de tarieven en voorwaarden, bedoeld in
      [artikel 8.25d, eerste lid][ref2], zoals dat luidt met ingang van het tijdstip van inwerkingtreding van de in het
      eerste lid genoemde wet, voor de eerste maal in werking treden;

      b. het voorstel voor tarieven en voorwaarden waarop de in onderdeel a bedoelde mededeling betrekking heeft en de
      daarop volgende vaststelling van de tarieven en voorwaarden;

      c. de aanvraag bij de Autoriteit Consument en Markt tot vaststelling of de tarieven en voorwaarden, die tot stand
      zijn gekomen met toepassing van het in de aanhef bedoelde recht, in strijd zijn met de bij of krachtens deze wet
      gestelde regels, de behandeling van deze aanvraag en het besluit daarop.

      3 Bij de vaststelling van de tarieven voor drie jaar, bedoeld in [artikel 8.25d, eerste lid][ref3], en
      bij de vaststelling van de aangepaste tarieven, bedoeld in artikel 8.25d, vierde en vijfde lid, vinden de
      verrekeningen plaats, bedoeld in artikel 8.25d, tiende en elfde lid, zoals deze leden luidden voor het tijdstip
      van inwerkingtreding van de in het eerste lid, genoemde wet, voor zover deze verrekeningen zijn opgenomen in de
      financiële verantwoording over een boekjaar waarvoor tarieven gelden die zijn vastgesteld met toepassing van het
      recht zoals dat luidde onmiddellijk voorafgaand aan dit tijdstip. Bij of krachtens algemene maatregel van bestuur
      worden nadere regels gesteld omtrent de tijdstippen en de wijze waarop deze verrekeningen plaats hebben.

      4 De tarieven en voorwaarden die zijn of worden vastgesteld met toepassing van het recht zoals dat luidde
      onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van de in het eerste lid genoemde wet, behouden
      hun geldigheid gedurende de periode waarvoor de tarieven en voorwaarden zijn vastgesteld. Indien deze periode
      nog niet is verstreken op het moment dat de in [artikel 8.25d, eerste lid][ref4], zoals dat luidt met ingang
      van het tijdstip van inwerkingtreding van de in het eerste lid, genoemde wet, bedoelde tarieven en voorwaarden
      met inachtneming van het eerste lid voor de eerste maal in werking treden, dan vervallen die eerder vastgestelde
      tarieven en voorwaarden op dat moment.

      5 [Artikel 8.25df][ref5] is slechts van toepassing op investeringsprojecten of elk afzonderlijk onderdeel daarvan,
      waarvan de in artikel 8.25df, tweede lid, bedoelde vaststelling van de raming en functionele specificaties
      plaatsvindt ten minste drie maanden na inwerkingtreding van de in het eerste lid genoemde wet.

      6 De exploitant van de luchthaven Schiphol legt het toerekeningssysteem voor de jaarlijkse kosten en opbrengsten,
      bedoeld in [artikel 8.25g, eerste lid][ref6], voor de eerste keer aan de Autoriteit Consument en Markt ter
      goedkeuring voor binnen vier weken na het tijdstip van inwerkingtreding van de in het eerste lid genoemde wet.

      7 Voor zover de [artikelen 8.25d tot en met 8.25h][ref7], zoals deze luidden onmiddellijk voorafgaand aan de
      inwerkingtreding van de in het eerste lid genoemde wet, op grond van het tweede lid van toepassing blijven, is:

      a. [artikel 11.14a][ref8] van toepassing op de naleving van deze artikelen, zoals deze toen luidden; en

      b. [artikel 11.24][ref9], zoals dit luidde onmiddellijk voorafgaand aan de inwerkingtreding van de in
      [artikel 12.6a, eerste lid][ref10], genoemde wet, van toepassing op de overtreding van deze artikelen, zoals deze
      toen luidden.


