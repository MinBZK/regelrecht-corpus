        artikel: '10.12'
        hoofdstuk: '10'
        afdeling: 10.3.1
  - number: '10.15'
    text: |-
      1 Bij algemene maatregel van bestuur wordt voor een luchthaven een luchthavenbesluit vastgesteld.

      2 In het luchthavenbesluit worden het luchthavengebied en het beperkingengebied vastgesteld.

      3 Het luchthavengebied en het beperkingengebied overlappen elkaar niet. De gebieden kunnen bestaan uit niet
      aaneengesloten delen.

      4 [Artikel 8.5, vijfde lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.5
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.15
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.5'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
  - number: '10.16'
    text: |-
      1 Als luchthavengebied wordt de locatie vastgesteld die bestemd is voor gebruik als luchthaven.

      2 Het luchthavenbesluit bevat voor het luchthavengebied regels omtrent de functie en het gebruik van de locatie
      voor zover die regels noodzakelijk zijn met het oog op het gebruik van het gebied als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.16
  - number: '10.17'
    text: |-
      1 Als beperkingengebied wordt het gebied vastgesteld waar met het oog op de geluidsbelasting en de veiligheid in
      verband met de nabijheid van de luchthaven beperkingen noodzakelijk zijn ten aanzien van de functie of het gebruik
      van de locatie. Het beperkingengebied omvat de gebieden die behoren bij de in het tweede lid bedoelde grenswaarden
      voor geluidbelasting en het externe-veiligheidsrisico, alsmede bij de in het derde lid, onderdeel b, bedoelde
      regels.

      2 Het luchthavenbesluit bevat een grenswaarde voor geluidsbelasting. Het besluit kan tevens bevatten:

      a. een grenswaarde voor het externe-veiligheidsrisico;

      b. een of meer grenswaarden die noodzakelijk zijn met het oog op de lokale luchtverontreiniging.

      3 Het luchthavenbesluit bevat voor het beperkingengebied in ieder geval regels waarbij beperkingen zijn gesteld ten
      aanzien van de functie en het gebruik van de locatie voor zover die beperkingen noodzakelijk zijn met het oog op:

      a. de geluidsbelasting in verband met de nabijheid van de luchthaven;

      b. de maximale hoogte van objecten op of boven de locatie, in verband met de veiligheid van het
      luchthavenluchtverkeer.

      Het besluit kan voor het beperkingengebied tevens regels bevatten waarbij beperkingen zijn gesteld ten aanzien van
      de functie en het gebruik van de locatie voor zover die beperkingen noodzakelijk zijn met het oog op het externe-
      veiligheidsrisico in verband met de nabijheid van de luchthaven.

      4 Het luchthavenbesluit kan tevens voor het luchthavenluchtverkeer bevatten:

      a. regels met het oog op de geluidsbelasting;

      b. regels die noodzakelijk zijn met het oog op de lokale luchtverontreiniging.

      5 Bij de regels met het oog op de geluidsbelasting en het externe-veiligheidsrisico, bedoeld in het derde lid,
      worden in ieder geval locaties aangewezen waar woningen of andere in het besluit aangewezen gebouwen niet zijn
      toegelaten.

      6 De [artikelen 8.8 tot en met 8.11][ref1] zijn van overeenkomstige toepassing met dien verstande dat Onze Minister
      van Defensie in de plaats treedt van Onze Minister van Infrastructuur en Milieu.

      7 Bij de vaststelling van het luchthavenbesluit kan in ieder geval gebruik worden gemaakt van gegevens en
      onderzoeken die niet ouder zijn dan twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.8
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.17
    references:
