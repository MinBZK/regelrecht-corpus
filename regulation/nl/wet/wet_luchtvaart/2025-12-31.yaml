  - number: 8.25di
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent:

      a. de activiteiten ten behoeve van het gebruik van de luchthaven door gebruikers waarvoor de in
      [artikel 8.25d, eerste lid][ref1] en [artikel 8.25db, eerste tot en met derde lid][ref2], bedoelde tarieven en
      voorwaarden, de in artikel 8.25d, vierde en vijfde lid, bedoelde aanpassingen van tarieven en de in artikel 8.25d,
      zesde lid, bedoelde aanpassingen van de operationele voorwaarden worden vastgesteld;

      b. het tijdstip van vaststelling van de in [artikel 8.25d, eerste lid][ref3] en
      [artikel 8.25db, eerste tot en met derde lid][ref4], bedoelde tarieven en voorwaarden, de in artikel 8.25d, vierde
      en vijfde lid, bedoelde aanpassingen van tarieven en de in artikel 8.25d, zesde lid, bedoelde aanpassingen van de
      operationele voorwaarden;

      c. de vermelding van de wijzigingen van de in [artikel 8.25d, eerste lid][ref5] en
      [artikel 8.25db, eerste tot en met derde lid][ref6], bedoelde voorwaarden, gedurende de in artikel 8.25d, eerste
      lid, bedoelde periode, en het tijdstip van die wijzigingen;

      d. de vermelding van de in [artikel 8.25d, zesde lid][ref7], bedoelde aangepaste operationele voorwaarden;

      e. de wijze en het tijdstip waarop de in [artikel 8.25da, eerste, vierde en vijfde lid][ref8] en
      [artikel 8.25db, vierde lid][ref9], bedoelde mededelingen plaatsvinden;

      f. de in [artikel 8.25db, tweede lid][ref10] en in [artikel 8.25dg, tiende lid][ref11], bedoelde uitzonderlijke en
      onvoorziene omstandigheden;

      g. de in [artikel 8.25dc, derde en vierde lid][ref12], bedoelde kostenoriëntatie;

      h. de procedure volgens welke en de methodiek aan de hand waarvan de exploitant van de luchthaven uitvoering geeft
      aan [artikel 8.25dd, eerste lid][ref13] en de informatieverstrekking ter zake;

      i. de in [artikel 8.25dd, tweede lid][ref14], bedoelde overige activiteiten, welke rechtstreeks verband houden met
      de activiteiten ten behoeve van het gebruik van de luchthaven;

      j. het tijdstip en de wijze waarop de exploitant van de luchthaven, indien nodig in afwijking van de in onderdeel b
      bedoelde regels, uitvoering geeft aan [artikel 8.25dd, derde lid][ref15];

      k. het tijdstip en de wijze waarop de in [artikel 8.25de, tweede lid][ref16], bedoelde mededeling van de
      vaststelling van het vijfjarige investeringsprogramma plaatsvindt;

      l. de tijdstippen en de wijze waarop de exploitant van de luchthaven jaarlijks gebruikers en representatieve
      organisaties informeert over de voortgang van het investeringsprogramma;

      m. het minimale bedrag van het investeringsproject;

      n. het tijdstip en de wijze waarop de in [artikel 8.25df, eerste lid][ref17], bedoelde projectgroep, wordt
      vormgegeven;

      o. de in [artikel 8.25df, eerste, tweede, vierde en vijfde lid][ref18], bedoelde raadplegingen en de mededelingen
      inzake een investeringsproject of elk afzonderlijk onderdeel daarvan;

      p. de tijdstippen en de wijze waarop de in
      [artikel 8.25dg, eerste tot en met negende en elfde en twaalfde lid][ref19], bedoelde verrekeningen, alsmede
      de informatieverstrekking door de exploitant van de luchthaven over de verrekeningen en de overige aan de
      verrekeningen te stellen voorwaarden, plaats hebben;

      q. het in [artikel 8.25dg, negende en tiende lid][ref20], bedoelde percentage van het verschil tussen de
      daadwerkelijke investeringsuitgaven van een investeringsproject of elk afzonderlijk onderdeel daarvan, en de
      investeringsbegroting.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


