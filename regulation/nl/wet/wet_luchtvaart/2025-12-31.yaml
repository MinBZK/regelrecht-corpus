  - number: 8.29a
    text: |-
      1 De exploitant van de luchthaven brengt elke drie jaar, of zoveel eerder als Onze Minister van Infrastructuur
      en Milieu nodig oordeelt, aan Onze Minister van Infrastructuur en Milieu verslag uit over de exploitatie van de
      luchthaven. Het verslag bevat ten minste een beschrijving van de ter uitvoering van [artikel 8.25a][ref1] getroffen
      voorzieningen, een overzicht van alle daartoe relevante gegevens en een beschrijving van de doelmatigheid en
      doeltreffendheid van die voorzieningen, alsmede een beschrijving van de ontwikkeling van de netwerkkwaliteit,
      tevens omvattende een vergelijking met de in [artikel 8.25da, tweede lid][ref2] en [8.25e, eerste lid][ref3],
      bedoelde beschrijvingen.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de verslaggeving.

      3 De door de exploitant van de luchthaven verstrekte beschrijving van de ontwikkeling van de netwerkkwaliteit
      stelt Onze Minister van Infrastructuur en Milieu in staat in te schatten of en in hoeverre het door de exploitant
      van de luchthaven gevoerde beleid voldoende rekening houdt met de netwerkkwaliteit. Deze inschatting van het door
      de exploitant van de luchthaven gevoerde beleid met het oog op de ontwikkeling van netwerkkwaliteit door Onze
      Minister van Infrastructuur en Milieu laat de bij of krachtens deze wet opgenomen bepalingen met betrekking tot de
      voorstellen, raadplegingen en vaststellingen en de bevoegdheden van de Autoriteit Consument en Markt onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25a
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25da
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25e
