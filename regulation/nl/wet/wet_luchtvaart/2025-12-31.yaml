      degene aan wie een vergunning voor burgermedegebruik is verleend.

      2 De in [artikel 10.25][ref2] bedoelde commissie kan worden uitgebreid met vertegenwoordigers van
      rechtspersoonlijkheid bezittende gebruikersorganisaties.


