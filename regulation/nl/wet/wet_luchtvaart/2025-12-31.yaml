  - number: 8.25g
    text: |-
      1 De exploitant van de luchthaven stelt een toerekeningssysteem vast voor de jaarlijkse kosten en opbrengsten van
      de activiteiten, bedoeld in [artikel 8.25d, eerste lid][ref1], dat voldoet aan de eisen van marktconformiteit,
      proportionaliteit en integraliteit. De exploitant van de luchthaven legt het toerekeningssysteem ter goedkeuring
      voor aan de Autoriteit Consument en Markt.

      2 De exploitant van de luchthaven voert voor de activiteiten met betrekking tot het gebruik van de luchthaven
      door gebruikers een gescheiden administratie binnen de boekhouding, waarbinnen de kosten en opbrengsten van
      de uitvoering van de beveiliging van passagiers en hun bagage, bedoeld in [artikel 8.25dc, vierde lid][ref2]
      afzonderlijk worden geadministreerd.

      3 Op grond van de gescheiden administratie binnen de boekhouding, bedoeld in het tweede lid, stelt de exploitant
      van de luchthaven jaarlijks een financiële verantwoording op over het voorafgaande boekjaar, die bestaat uit een
      afzonderlijke exploitatierekening en een overzicht van de toegedeelde materiële vaste activa voor het geheel van de
      activiteiten, bedoeld in [artikel 8.25d, eerste lid][ref3]. De financiële verantwoording bevat een toelichting en
      is voorzien van een verklaring van een onafhankelijke accountant.

      4 De exploitant van de luchthaven legt binnen vijf maanden na afloop van het boekjaar van de exploitant van
      de luchthaven de financiële verantwoording over het voorafgaande boekjaar tezamen met de verklaring van de
      onafhankelijke accountant, over aan de Autoriteit Consument en Markt en de gebruikers en representatieve
      organisaties die daarom verzoeken.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de geldigheidsduur, de
      inrichting en goedkeuring van het toerekeningssysteem, bedoeld in het eerste lid, de toedeling van activa aan de
      activiteiten, bedoeld in [artikel 8.25d, eerste lid][ref4], de inrichting van de gescheiden administratie binnen de
      boekhouding, bedoeld in het tweede lid, en omtrent de financiële verantwoording, bedoeld in het derde lid.

      6 Op de voorbereiding van een besluit omtrent goedkeuring van het toerekeningssysteem is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] van toepassing.

      7 Onverminderd [artikel 3:15 van de Algemene wet bestuursrecht][ref6], kunnen de gebruikers en representatieve
      organisaties van de luchthaven hun zienswijze naar voren brengen over het voorgenomen besluit omtrent goedkeuring
      van het toerekeningssysteem.

      8 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan de beide Kamers der Staten-Generaal is overgelegd.


