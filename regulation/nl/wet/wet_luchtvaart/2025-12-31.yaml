      1 Onze Minister van Infrastructuur en Milieu kan een bewijs van bevoegdheid of een bevoegdverklaring intrekken:

      a. op aanvraag van de houder;

      b. wanneer het bewijs van bevoegdheid of de daarop weergegeven bevoegdverklaring ten minste drie maanden is
      geschorst;

      c. wanneer gedurende een periode van ten minste zes maanden van het betrokken bewijs van bevoegdheid of de daarop
      weergegeven bevoegdverklaring geen gebruik is gemaakt;

      d. wanneer bij de aanvraag of het verzoek om verlenging van het bewijs van bevoegdheid, de bevoegdverklaring of de
      medische verklaring onjuiste gegevens zijn verstrekt.

      2

      3 Indien de houder van een bewijs van bevoegdheid of een of meer bevoegdverklaringen de bevoegdheid een
      luchtvaartuig te bedienen, luchtverkeersdiensten te verlenen, luchthaveninformatie te verstrekken of een
      grondstation of mobiel station als bedoeld in [artikel 2.1, eerste lid][ref1], te bedienen is ontzegd, dan wel zijn
      bewijs van bevoegdheid of een of meer bevoegdverklaringen zijn ingetrokken, is hij verplicht het document, waarop
      zijn bewijs van bevoegdheid en eventuele bevoegdverklaringen zijn weergegeven, onverwijld bij Onze Minister van
      Infrastructuur en Milieu in te leveren.

      4 Het eerste en derde lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.3, zesde lid, onderdeel e][ref2].

      5 Het eerste lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.4, derde lid, onderdeel d][ref3].

      6 Het eerste en derde lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.3, vijfde lid, onderdeel d][ref4].

      7 Bij ministeriële regeling kan Onze Minister van Infrastructuur en Milieu regels geven met betrekking tot de
      procedure van intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.1
