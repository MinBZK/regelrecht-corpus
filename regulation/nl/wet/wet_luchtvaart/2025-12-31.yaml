  - number: 8.40i
    text: |-
      Een voordracht voor een algemene maatregel van bestuur op grond van deze titel wordt gedaan door Onze Minister van
      Infrastructuur en Milieu in overeenstemming met Onze Minister van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.40i
  - number: '8.41'
    text: |-
      1 Deze titel is van toepassing op luchthavens van regionale betekenis.

      2 Bij of krachtens algemene maatregel van bestuur kunnen, indien bovenprovinciale belangen dit vorderen, regels
      worden gesteld ten aanzien van de vorm van luchtvaart die in ieder geval toegang heeft tot een luchthaven van
      regionale betekenis. Bij of krachtens algemene maatregel van bestuur kan tevens worden bepaald welke grenswaarden
      voor de geluidbelasting voor dit luchthavenluchtverkeer ter beschikking moeten worden gesteld.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.41
  - number: '8.42'
    text: |-
      Deze afdeling is van toepassing op luchthavens van regionale betekenis waarvoor op grond van
      [artikel 8.1a, derde lid][ref1], vaststelling van een luchthavenbesluit is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1a
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.42
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8.1a
        hoofdstuk: '8'
  - number: '8.43'
    text: |-
      1 Provinciale staten stellen bij verordening voor de luchthaven een luchthavenbesluit vast. Provinciale
      staten kunnen de bevoegdheid tot het vaststellen van deze verordening niet overdragen als bedoeld in
      [artikel 152 van de Provinciewet][ref1].

      2 Een luchthavenbesluit bevat bepalingen omtrent:

      a. het luchthavenluchtverkeer, en

      b. de ruimtelijke indeling van het gebied van en rond de luchthaven.

      3 [Artikel 107 van de Provinciewet][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel152
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel107
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.43
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '152'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '107'
  - number: '8.44'
    text: |-
      1 Het luchthavenbesluit bevat ten aanzien van het luchthavenluchtverkeer:

      a. grenswaarden en regels voor zover deze noodzakelijk zijn met het oog op de geluidbelasting, en

      b. regels voor zover deze noodzakelijk zijn met het oog op de vliegveiligheid.

      2 Binnen de in het eerste lid, onder a, bedoelde grenswaarden kan in ieder geval een grenswaarde exclusief worden
      toegewezen voor vluchten ten behoeve van:

      a. spoedeisende hulpverlening;

      b. de uitoefening van politietaken als bedoeld in [artikel 3 van de Politiewet 2012][ref1].

      3 Een luchthavenbesluit kan tevens regels of grenswaarden bevatten die noodzakelijk zijn met het oog op het
      externe-veiligheidsrisico of de lokale luchtverontreiniging.

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de in luchthavenbesluiten
      op te nemen grenswaarden en regels. Deze maatregel stelt in ieder geval regels omtrent het opnemen van grenswaarden
      voor de geluidbelasting. Bij deze maatregel kan een onderscheid worden gemaakt tussen categorieën luchthavens en
      tussen vormen van luchtvaart die gebruik maken van luchthavens.

      5 De [artikelen 8.19 tot en met 8.21][ref2] zijn van overeenkomstige toepassing.

      6 De voordracht voor een krachtens het vierde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      7 Bij de vaststelling van het luchthavenbesluit kan in ieder geval gebruik worden gemaakt van gegevens en
      onderzoeken die niet ouder zijn dan twee jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.19
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.44
