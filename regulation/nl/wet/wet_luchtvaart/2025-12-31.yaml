        artikel: '3.2'
        hoofdstuk: '3'
  - number: '10.4'
    text: |-
      1 Het onderhoud aan militaire luchtvaartuigen wordt verricht door personeel, dat voldoet aan bij of krachtens
      algemene maatregel van bestuur gestelde eisen inzake theoretische en praktische bekwaamheid en geestelijke en
      lichamelijke geschiktheid.

      2 [Artikel 10.1, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.1
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.4
