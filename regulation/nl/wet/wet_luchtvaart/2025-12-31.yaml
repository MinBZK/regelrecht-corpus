        bwb_id: BWBR0020495
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: 8a.65
    text: ACNL stelt ten behoeve van haar werkwijze een bestuursreglement op.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.65
  - number: 8a.66
    text: |-
      1 ACNL heeft een directie.

      2 De directie:

      a. is belast met de dagelijkse leiding van ACNL;

      b. bestaat uit maximaal twee leden;

      c. vertegenwoordigt ACNL in en buiten rechte.

      3 De leden van de directie worden benoemd voor een tijdvak van maximaal vier jaar en zijn aansluitend éénmalig voor
      een tijdvak van maximaal vier jaar herbenoembaar. In het geval van bijzondere omstandigheden binnen de organisatie
      van de ACNL kan een lid van de directie bij afloop van de tweede benoemingstermijn terstond opnieuw worden benoemd
      voor een tijdvak van maximaal twee jaar.

      4 In geval van schorsing of ontstentenis van een lid van de directie voorziet Onze Minister van Infrastructuur en
      Waterstaat in de waarneming van diens functie.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.66
  - number: 8a.67
    text: |-
      1 Ter dekking van de kosten die ACNL maakt ten behoeve van de uitvoering van de taken, bedoeld in
      [artikel 8a.64, eerste lid][ref1]:

      a. zijn de gebruikers van de betreffende luchthavens per gebruikt slot of gefaciliteerde beweging een vergoeding
      verschuldigd aan ACNL;

      b. zijn de exploitanten van de betreffende luchthavens een vergoeding verschuldigd aan ACNL op basis van de met
      slots gerealiseerde of gefaciliteerde bewegingen in het vorige boekjaar.

      2 ACNL stelt jaarlijks de tarieven van de vergoedingen, bedoeld in het eerste lid, bij regeling vast na consultatie
      van de gebruikers en exploitanten van de betreffende luchthavens.

      3 De tarieven, bedoeld in het tweede lid, treden na bekendmaking op de eerstvolgende 1 april in werking.

      4 De exploitant van de betreffende luchthaven int de vergoeding, bedoeld in het eerste lid, onderdeel a, en draagt
      het geïnde bedrag af aan ACNL.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.64
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.67
    references:
