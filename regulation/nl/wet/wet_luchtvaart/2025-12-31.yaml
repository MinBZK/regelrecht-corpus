  - number: 8.25ga
    text: |-
      De exploitant van de luchthaven zendt, de in [artikel 8.25e, eerste lid][ref1], bedoelde benchmarks over het
      voorafgaande boekjaar aan zowel de Autoriteit Consument en Markt, als aan de gebruikers en de representatieve
      organisaties, uiterlijk op hetzelfde tijdstip als waarop de exploitant van de luchthaven de in artikel 8.25e,
      eerste en tweede lid, bedoelde mededelingen doet.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25e
