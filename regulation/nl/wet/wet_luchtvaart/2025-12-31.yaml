  - number: 8.25db
    text: |-
      1 De exploitant van de luchthaven kan, in afwijking van [artikel 8.25d, eerste en derde lid][ref1], nieuwe tarieven
      en voorwaarden vaststellen voor het resterende gedeelte van de in artikel 8.25d, eerste lid, bedoelde periode,
      in verband met de inwerkingtreding van veranderingen van de beveiligingsmaatregelen. Deze tarieven en voorwaarden
      kunnen zowel op 1 april als op 1 november van enig jaar in werking treden.

      2 De exploitant van de luchthaven kan, in afwijking van [artikel 8.25d, eerste en derde lid][ref2], nieuwe tarieven
      en voorwaarden vaststellen voor het resterende gedeelte van de in artikel 8.25d, eerste lid, bedoelde periode,
      indien sprake is van uitzonderlijke en onvoorziene omstandigheden. Deze tarieven en voorwaarden kunnen zowel op
      1 april als op 1 november van enig jaar in werking treden.

      3 De exploitant van de luchthaven kan, in afwijking van [artikel 8.25d, eerste en derde lid][ref3], nieuwe tarieven
      en voorwaarden vaststellen voor het resterende gedeelte van de in artikel 8.25d, eerste lid, bedoelde periode,
      naar aanleiding van een in [artikel 8.25f, vierde lid][ref4], bedoeld besluit van de Autoriteit Consument en Markt,
      naar aanleiding van het op grond van [artikel 11.24][ref5] genomen besluit van de Autoriteit Consument en Markt
      of naar aanleiding van een rechterlijke uitspraak, indien een dergelijk besluit of rechterlijke uitspraak gevolgen
      heeft voor de structuur van en de onderlinge verhouding tussen de tarieven voor de onderscheiden soorten verkeer en
      vervoer. Deze tarieven en voorwaarden kunnen zowel op 1 april als op 1 november van enig jaar in werking treden.

      4 De exploitant van de luchthaven doet voorafgaande aan de periode waarop de in de voorgaande leden bedoelde
      tarieven en voorwaarden betrekking hebben, mededeling aan gebruikers en representatieve organisaties ter zake
      van de vaststelling van deze tarieven en voorwaarden. [Artikel 8.25da, tweede en derde lid][ref6], zijn van
      overeenkomstige toepassing.


