  - number: '5.18'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bevordering van een veilige, ordelijke en vlotte
      afwikkeling van het luchtverkeer regels worden gesteld betreffende de prioriteitstelling bij het verlenen van
      luchtverkeersdiensten.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.18
  - number: '5.19'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de exploitant van een burgerluchthaven met
      inachtneming van de daarbij te stellen regels na overleg met de gebruikers en de betrokken verlener van
      luchtverkeersleidingsdiensten, de volgorde van het gebruik van de luchthaven vaststelt.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.19
  - number: '5.20'
    text: |-
      1 De luchtruimgebruiker, bedoeld in artikel 2, onderdeel 5, van de prestatie- en heffingsverordening, is in het
      vluchtinformatiegebied Amsterdam een vergoeding verschuldigd voor de bestrijding van kosten van:

      a. luchtvaartnavigatiediensten voor «en route»-verkeer als bedoeld in de op 12 februari 1981 te Brussel gesloten
      Multilaterale Overeenkomst betreffende «en route»-heffingen (Trb. 1981, 181),

      b. plaatselijke luchtvaartnavigatiediensten.

      2 De Eurocontrol-organisatie stelt jaarlijks in het kader van de op 12 februari 1981 te Brussel gesloten
      Multilaterale Overeenkomst betreffende «en route»-heffingen (Trb. 1981, 181), de hoogte van het en-route-
      eenheidstarief, bedoeld in artikel 25 van de prestatie- en heffingsverordening, vast ter berekening van de
      vergoeding voor luchtvaartnavigatiediensten voor «en route»-verkeer». Ter voorbereiding daarvan leggen de verleners
      van luchtvaartnavigatiediensten aan «en route»-verkeer» Onze Minister van Infrastructuur en Milieu, jaarlijks vóór
      15 mei een voorstel voor.

      3 Onze Minister van Infrastructuur en Milieu stelt jaarlijks de hoogte van het terminaleenheidstarief,
      bedoeld in artikel 25 van de prestatie- en heffingsverordening, vast ter berekening van de vergoeding voor
      plaatselijke luchtvaartnavigatiediensten. Ter voorbereiding daarvan leggen de verleners van plaatselijke
      luchtvaartnavigatiediensten genoemde Minister jaarlijks vóór 15 mei een voorstel voor.

      4 De Eurocontrol-organisatie int de vergoeding ter bestrijding van de kosten voor luchtvaartnavigatiediensten voor
      «en route»-verkeer en draagt aan de desbetreffende verleners van deze diensten het hun toekomende deel van het
      geïnde bedrag af.

      5 De verleners van plaatselijke luchtvaartnavigatiediensten dragen zorg voor de inning van de vergoedingen ter
      bestrijding van de kosten van deze diensten en stemmen daartoe onderling af.

      6 Bij algemene maatregel van bestuur worden heffingszones als bedoeld in artikel 21 van de prestatie- en
      heffingsverordening vastgesteld en worden nadere voorschriften gesteld met betrekking tot de bekendmaking en de
      inning van vergoedingen, bedoeld in het vierde en het vijfde lid, en de termijnen binnen welke betaling van de
      vergoedingen plaats moet vinden.

      7 De Eurocontrol-organisatie kan rechtsvorderingen tot inning van vergoedingen als bedoeld in het vierde lid
      en van andere vergoedingen uit hoofde van de op 12 februari 1981 te Brussel gesloten Multilaterale Overeenkomst
      betreffende «en route»-heffingen (Trb. 1981, 181) uitsluitend aanhangig maken bij de rechtbank Amsterdam.

      8 Bij algemene maatregel van bestuur kan overeenkomstig artikel 31, derde tot en met zesde lid, van de prestatie-
      en heffingsverordening vrijstelling worden verleend van betaling van vergoedingen voor luchtvaartnavigatiediensten.

      9 Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen voorschriften worden gesteld met betrekking
      tot het treffen van stimuleringsmaatregelen als bedoeld in artikel 11 van de prestatie- en heffingsverordening.
      Dergelijke voorschriften betreffen in ieder geval financiële stimulansen op het prestatiekerngebied capaciteit.

      10 De in het eerste lid, onderdeel b, bedoelde vergoeding moet worden betaald zonder dat dit bij beschikking is
      vastgesteld.

      11 Bij regeling van Onze Minister van Infrastructuur en Milieu worden voorschriften gesteld voor de raadpleging van
      vertegenwoordigers van luchtruimgebruikers over het vergoedingenbeleid.

      12 Onze Minister van Infrastructuur en Milieu kan besluiten tot modulering van luchtvaartnavigatieheffingen als
      bedoeld in artikel 32 van de prestatie- en heffingsverordening.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.20
  - number: '5.21'
    text: |-
      1 De prestatie- en heffingsverordening en [artikel 5.20][ref1] zijn niet van toepassing op plaatselijke
      luchtvaartnavigatiediensten die worden verstrekt op luchthavens met minder dan 80.000 IFR-luchtvervoersbewegingen
      per jaar als bedoeld in artikel 2, onderdeel 10, van de prestatie- en heffingsverordening, tenzij deze luchthavens
      onderdeel uitmaken van een bij algemene maatregel van bestuur aan te wijzen terminalheffingszone als bedoeld in
      artikel 2, onderdeel 21, van de prestatie- en heffingsverordening.

      2 De gebruiker van luchtvaartnavigatiediensten als bedoeld in het eerste lid is een vergoeding verschuldigd
      ter bestrijding van de kosten van de verlening van deze diensten. Bij algemene maatregel van bestuur worden
      voorschriften gesteld ten aanzien van de hoogte, de berekening, de vaststelling, de inning en de bekendmaking van
      deze vergoeding, en de termijn binnen welke betaling van deze vergoeding plaats moet vinden.

      3 De in het tweede lid bedoelde vergoeding moet worden betaald zonder dat dit bij beschikking is vastgesteld.

      4 Voor de toepassing van het eerste lid wordt de North Sea Area Amsterdam zijnde het gebied dat als NSA Amsterdam
      is gedefinieerd in de door LVNL uitgegeven luchtvaartgids, volume I, hoofdstuk ENR 6-2-5 aangemerkt als luchthaven.

      4 Bij algemene maatregel van bestuur kan vrijstelling worden verleend van de verplichting tot betaling van
      vergoedingen als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.20
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.20'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.21a
    text: |-
      Onverminderd de prestatiekernindicatoren en de indicatoren voor monitoring als bedoeld in artikel 8, tweede lid,
      van de prestatie- en heffingsverordening kan Onze Minister van Infrastructuur en Waterstaat bij ministeriële
      regeling, met het oog op de monitoring van de prestatie van luchtvaartnavigatiediensten, aanvullende
      prestatiekernindicatoren en monitoringindicatoren vaststellen.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.21a
  - number: '5.22'
    text: |-
      1 Er is een organisatie voor het verlenen van luchtverkeersdiensten. Hij heeft rechtspersoonlijkheid.

      2 Op de in het eerste lid bedoelde organisatie is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing,
      met uitzondering van de [artikelen 15][ref2] en [18 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.22
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '5.23'
    text: |-
      1 De LVNL is, ter bevordering van een zo groot mogelijke veiligheid van het luchtverkeer in het
      vluchtinformatiegebied Amsterdam, belast met de volgende taken:

      a. het verlenen van luchtverkeersdiensten;

      b. het verlenen van communicatie-, navigatie- en plaatsbepalingsdiensten;

      c. het verlenen van luchtvaartinlichtingendiensten en het uitgeven van luchtvaartpublicaties en luchtvaartkaarten;

      d. het verzorgen of doen verzorgen van opleidingen ten behoeve van luchtverkeersbeveiliging en het verlenen van
      luchtvaartnavigatiediensten;

      e. het adviseren van Onze Minister van Infrastructuur en Milieu alsmede Onze Minister van Defensie betreffende
      aangelegenheden op het gebied van de luchtverkeersbeveiliging en het verlenen van luchtvaartnavigatiediensten;

      f. het verrichten van andere bij of krachtens deze wet opgedragen taken.

      2 Onze Minister van Infrastructuur en Milieu kan de LVNL belasten met het verlenen van luchtverkeersdiensten buiten
      het vluchtinformatiegebied Amsterdam.

      3 De LVNL kan, in ieder geval tegen vergoeding van kosten, diensten aan anderen dan Onze Minister van
      Infrastructuur en Milieu en Onze Minister van Defensie verlenen op het gebied van en verband houdende met taken
      bedoeld in het eerste lid. De in de eerste volzin bedoelde diensten kunnen buiten het vluchtinformatiegebied
      Amsterdam worden verleend.

      4 De LVNL kan, onverminderd zijn verantwoordelijkheid voor de uitvoering van de aan hem opgedragen taken,
      luchtverkeersdiensten laten verrichten door een andere verlener van luchtverkeersdiensten, indien hiervoor
      instemming is verleend op grond van [artikel 5.14b, eerste lid][ref1].

      5 De LVNL kan, onverminderd zijn verantwoordelijkheid voor de uitvoering van de aan hem opgedragen taken,
      luchtvaartnavigatiediensten anders dan de in het vierde lid bedoelde diensten laten verrichten door een andere
      verlener van luchtvaartnavigatiediensten.

      6 De LVNL kan, onverminderd zijn verantwoordelijkheid voor de uitvoering van de aan hem opgedragen taken, andere
      werkzaamheden dan die zijn bedoeld in het vierde en vijfde lid laten verrichten door derden, voor zover deze
      werkzaamheden een ondersteunend karakter hebben.

      7 De LVNL is verplicht zijn taken te verrichten overeenkomstig het bepaalde in Nederland bindende verdragen en
      besluiten van volkenrechtelijke organisaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.14b
