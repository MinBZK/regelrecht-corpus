  - number: '3.31'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot startinrichtingen
      voor luchtvaartuigen zonder voortstuwingsinrichting.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel3.31
  - number: '4.1'
    text: |-
      1 Voor zover bij internationale overeenkomst of besluit van een volkenrechtelijke organisatie niet anders is
      bepaald, is het verboden met luchtvaartuigen vluchten tegen vergoeding uit te voeren zonder een daartoe door Onze
      Minister van Infrastructuur en Milieu afgegeven AOC.

      2 Onze Minister van Infrastructuur en Milieu geeft op aanvraag de AOC af, wanneer wordt voldaan aan de
      bij of krachtens algemene maatregel van bestuur te stellen eisen. De AOC wordt slechts afgegeven aan een
      luchtvaartmaatschappij.

      3 Bij of krachtens algemene maatregel van bestuur kan aangegeven worden welke AOC's Onze Minister van
      Infrastructuur en Milieu kan afgeven alsmede de verplichtingen en bevoegdheden welke aan een AOC verbonden zijn.

      4 Aan een AOC kunnen voorschriften of beperkingen worden verbonden. Het is verboden vluchten uit te voeren in
      strijd met de aan een AOC verbonden voorschriften of beperkingen.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel4.1
  - number: '4.2'
    text: |-
      1 De AOC wordt afgegeven voor een bij algemene maatregel van bestuur vast te stellen termijn, welke termijn voor de
      verschillende AOC's verschillend kan zijn.

      2 Op aanvraag van de houder verlengt Onze Minister van Infrastructuur en Milieu de AOC, indien wordt voldaan aan de
      bij of krachtens [artikel 4.1, tweede en derde lid][ref1], gestelde eisen.

      3 Onze Minister van Infrastructuur en Milieu kan een AOC op verzoek van de houder wijzigen.

      4 Onze Minister van Infrastructuur en Milieu wijzigt een AOC ambtshalve, wanneer:

      a. onjuiste gegevens zijn verstrekt;

      b. de vluchtuitvoering, waarvoor de AOC is verleend, tijdens de duur van de AOC veranderingen heeft ondergaan, of

      c. redenen van nationaal of internationaal beleid op het gebied van de vluchtuitvoering zulks vereisen.

      5 Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot
      [artikel 4.1][ref2] en dit artikel. Deze regels hebben in ieder geval betrekking op:

      a. de aanvraag om afgifte van een AOC of een wijziging of verlenging daarvan, en

      b. de vergoeding, die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om afgifte
      van een AOC of om een wijziging, het onderhouden of de verlenging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '4.1'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '4.1'
        hoofdstuk: '4'
  - number: '4.3'
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan een AOC schorsen:

      a. wegens vluchtuitvoering in strijd met bij of krachtens deze wet gegeven voorschriften;

      b. wegens overtreding van de aan de AOC verbonden voorschriften of beperkingen, of

      c. indien ter verkrijging van de AOC onjuiste gegevens zijn verstrekt.

      2 Onze Minister van Infrastructuur en Milieu heft de schorsing op zodra de redenen van de schorsing zijn komen
      te vervallen.

      3 Onze Minister van Infrastructuur en Milieu kan een AOC intrekken:

      a. indien de AOC-houder daarom verzoekt;

      b. wegens het gedurende een aangesloten periode van ten minste twaalf maanden niet uitvoeren van vluchten;

      c. indien ter verkrijging van de AOC onjuiste of onvolledige gegevens zijn verstrekt, of

      d. indien de AOC ten minste drie maanden is geschorst.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel4.3
  - number: '4.4'
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan op aanvraag van de houder ontheffing verlenen van de bij of
      krachtens dit hoofdstuk gestelde regels, wanneer door bijzondere omstandigheden die regels in redelijkheid geen
      toepassing kunnen vinden en de veiligheid van het luchtverkeer met het verlenen van de ontheffing niet in gevaar
      wordt gebracht.

      2 Onze Minister van Infrastructuur en Milieu kan voorts ontheffing verlenen van de bij of krachtens dit hoofdstuk
      gestelde regels met betrekking tot onbemande luchtvaartuigen, wanneer door bijzondere omstandigheden die regels in
      redelijkheid geen toepassing kunnen vinden en de veiligheid van het luchtverkeer met het verlenen van de ontheffing
      niet in gevaar wordt gebracht.

      3 Aan de ontheffing, bedoeld in het eerste en tweede lid, kunnen voorschriften of beperkingen worden verbonden.

      4 Onze Minister van Infrastructuur en Milieu trekt de door hem verleende ontheffing in, wanneer:

      a. de redenen, waarom de ontheffing is verleend, zijn komen te vervallen, of

      b. de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel4.4
  - number: '4.5'
    text: |-
      De houder van een AOC volgt de door Onze Minister van Infrastructuur en Milieu gegeven aanwijzingen met betrekking
      tot de vluchtuitvoering op.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel4.5
  - number: '4.6'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot vluchtuitvoering
      die niet door een luchtvaartmaatschappij dan wel niet tegen vergoeding wordt uitgevoerd.

      2 Het is verboden vluchten uit te voeren in strijd met de bij of krachtens het eerste lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel4.6
  - number: '4.7'
    text: |-
      De[ artikelen 4.1 tot en met 4.6][ref1] zijn niet van toepassing op de vluchtuitvoering ten behoeve van douane-
      en politiedoeleinden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '4.1'
        hoofdstuk: '4'
  - number: '4.8'
    text: |-
      De gezagvoerder van een burgerluchtvaartuig is verplicht de bij regeling van Onze Minister van Infrastructuur en
      Milieu genoemde documenten mee te voeren.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel4.8
  - number: '5.1'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 5.3][ref1] tot en met [5.9][ref2] is van toepassing op:

      a.. deelnemers aan het luchtverkeer binnen het vluchtinformatiegebied Amsterdam, en

      b. Nederlandse luchtvaartuigen, waar deze zich ook bevinden, tenzij dit onverenigbaar is met de daar ter plaatse
      geldende regels of de regels die in overeenstemming met internationale afspraken worden gehanteerd door de ter
      plaatse voor het verlenen van luchtverkeersdiensten verantwoordelijke Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.9
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.3'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5.9'
        hoofdstuk: '5'
  - number: '5.2'
    text: |-
      Buiten het vluchtinformatiegebied Amsterdam houdt de gezagvoerder van een Nederlands luchtvaartuig zich aan de daar
      ter plaatse geldende regels. Indien in overeenstemming met internationale afspraken andere regels worden gehanteerd
      door de ter plaatse voor het verlenen van luchtverkeersdiensten verantwoordelijke Staat, houdt de gezagvoerder zich
      aan deze regels.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.2
  - number: '5.3'
    text: |-
      Het is verboden op zodanige wijze aan het luchtverkeer deel te nemen dan wel luchtverkeersleidingsdiensten te
      verlenen dat daardoor personen of zaken in gevaar worden of kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.3
  - number: '5.4'
    text: |-
      Het is verboden boven gebieden met aaneengesloten bebouwing of kunstwerken, industrie- en havengebieden daaronder
      begrepen, dan wel boven mensenmenigten, aan het luchtverkeer deel te nemen op een zodanige hoogte dat het niet
      meer mogelijk is een noodlanding uit te voeren zonder personen of zaken op het aardoppervlak in gevaar te brengen,
      tenzij zulks noodzakelijk is:

      a. om op te stijgen van of te landen op een luchthaven;

      b. voor de uitvoering van naderings- en vertrekprocedures, alsmede van luchtverkeerspatronen.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.4
  - number: '5.5'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de openbare veiligheid bij het
      gebruik van het luchtruim, ter bevordering van het veilige, ordelijke en vlotte verloop van het luchtverkeer of ter
      bescherming van personen of zaken aan boord van het luchtvaartuig of op het aardoppervlak regels worden gesteld aan
      deelnemers van het luchtverkeer.

      2 Bij of krachtens algemene maatregel van bestuur kunnen voorts regels worden gesteld betreffende:

      a. de uitvoering van vluchten;

      b. de met betrekking tot de uitvoering van vluchten te verstrekken inlichtingen;

      c. de communicatie tussen deelnemers aan het luchtverkeer onderling en met de instanties en organisaties belast met
      het verlenen van luchtverkeersdiensten;

      d. de in en ten behoeve van het luchtverkeer te gebruiken tekens en seinen;

      e. het gebruik van het luchtruim anders dan door luchtverkeer; en

      f. gedrag van het verkeer op een luchthaven.

      3 Onze Minister van Infrastructuur en Milieu kan ontheffing of vrijstelling verlenen van het bepaalde bij of
      krachtens het eerste en tweede lid, mede met inachtneming van het veilige, ordelijke en vlotte verloop van het
      luchtverkeer. Aan de ontheffing of vrijstelling kunnen voorschriften of beperkingen worden verbonden. Het is
      verboden in strijd met die voorschriften of beperkingen te handelen.

      4 De kosten die samenhangen met het in behandeling nemen van de aanvraag en de afgifte van de in het derde lid
      bedoelde ontheffing of een wijziging daarvan, worden ten laste gebracht van de aanvrager.

      5 De bedragen ter vergoeding van de kosten worden vastgesteld bij regeling van Onze Minister van Infrastructuur
      en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.5
  - number: '5.6'
    text: Het is verboden een vlucht uit te voeren zonder dat een gezagvoerder is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.6
  - number: '5.7'
    text: |-
      1 De gezagvoerder bevindt zich aan boord van het luchtvaartuig.

      2 De gezagvoerder is, ongeacht of hij daadwerkelijk de stuurorganen bedient of niet, ervoor verantwoordelijk dat
      de uitvoering van de vlucht geschiedt in overeenstemming met de bij of krachtens deze wet gestelde regels. Van de
      regels bedoeld in [de eerste volzin][ref1] mag slechts worden afgeweken indien de omstandigheden dit in het belang
      van de veiligheid dringend noodzakelijk maken.

      3 Het eerste lid is niet van toepassing op door Onze Minister van Infrastructuur en Milieu respectievelijk Onze
      Minister van Defensie bij ministeriële regeling aan te wijzen onbemande luchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.7
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.7'
        hoofdstuk: '5'
  - number: '5.8'
    text: |-
      Voor de aanvang van iedere vlucht, neemt de gezagvoerder kennis van alle gegevens en inlichtingen die voor de
      uitvoering van de vlucht van belang zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.8
  - number: '5.9'
    text: |-
      1 Voor de aanvang van iedere vlucht waaraan luchtverkeersleidingsdiensten worden verleend wordt door of namens de
      gezagvoerder een vliegplan ingediend overeenkomstig de bij of krachtens de algemene maatregel van bestuur, bedoeld
      in [artikel 5.5, tweede lid, onderdeel c][ref1], gestelde regels. Het vliegplan bevat de gegevens en inlichtingen
      omtrent de voorgenomen vlucht.

      2 Alvorens een vlucht waaraan luchtverkeersleidingsdiensten worden verleend aan te vangen, of een gedeelte daarvan
      uit te voeren moet een desbetreffende klaring zijn gevraagd en verkregen.

      3 De gezagvoerder komt de door de verlener van luchtverkeersleidingsdiensten gegeven voorwaarden van de klaring
      na. Van de voorwaarden bedoeld in de eerste volzin mag slechts worden afgeweken indien de omstandigheden dit in
      het belang van de veiligheid dringend noodzakelijk maken. Een afwijking wordt zo spoedig mogelijk gemeld aan de
      betrokken verlener van luchtverkeersleidingsdiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.5
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5.5'
        hoofdstuk: '5'
  - number: '5.10'
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan bij ministeriële regeling het uitoefenen van het
      burgerluchtverkeer tijdelijk of blijvend beperken of verbieden boven Nederland of gedeelten daarvan:

      a. om redenen van openbare orde en veiligheid;

      b. om andere dringende redenen, waarbij het uitoefenen van de luchtvaart en omstandigheden of gebeurtenissen op het
      aardoppervlak elkaar kunnen beïnvloeden;

      2 Onze Minister van Defensie kan bij ministeriële regeling het uitoefenen van het burgerluchtverkeer beperken of
      verbieden om reden van militaire noodzaak.

      3 Op voordracht van Onze Minister van Infrastructuur en Milieu, worden bij algemene maatregel van bestuur regels
      gesteld met betrekking tot het uitoefenen van het burgerluchtverkeer boven gebieden aangewezen overeenkomstig
      [artikel 2.24, eerste lid][ref1], in samenhang met [artikel 2.27, aanhef en onder c, van de Omgevingswet][ref2].

      4 Van de regelingen krachtens het eerste en tweede lid wordt mededeling gedaan via de luchtvaartpublicaties bedoeld
      in [artikel 5.23, eerste lid, onderdeel c][ref3], en voor zover nodig via de verlener van luchtverkeersdiensten aan
      de betrokken gezagvoerder.

      5 Het is verboden aan het luchtverkeer deel te nemen in strijd met het bepaalde krachtens het eerste, tweede en
      derde lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0037885#Artikel2.24
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2.27
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5.23
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.10
