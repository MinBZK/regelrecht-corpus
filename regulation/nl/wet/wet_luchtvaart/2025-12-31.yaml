  - number: 6.61a
    text: |-
      1 Indien zich binnen het vluchtinformatiegebied Amsterdam een luchtvaartongeval voordoet verstrekt de houder van
      het betrokken luchtvaartuig onverwijld aan de betrokken hulpverlenende instanties informatie over de gevaarlijke
      stoffen die zich aan boord van dat luchtvaartuig bevinden.

      2 Bij regeling van Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie wordt
      vastgesteld welke informatie door tussenkomst van welke instantie verstrekt dient te worden.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel6.61a
  - number: '6.62'
    text: |-
      1 Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen met het oog op de luchtwaardigheid van
      luchtvaartuigen tijdens het vervoer van dieren in die luchtvaartuigen in overeenstemming met Onze Minister van
      Economische Zaken regels worden gegeven met betrekking tot dat vervoer.

      2 Het is verboden dieren te vervoeren in strijd met het bepaalde krachtens het eerste lid.

      3 Onze Minister van Infrastructuur en Milieu kan in bijzondere gevallen ontheffing verlenen van de in het eerste
      lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel6.62
  - number: '7.1'
    text: |-
      1 Bij regeling van Onze Minister van Infrastructuur en Waterstaat worden regels gesteld met betrekking tot:

      a. de inrichting en de werking van een systeem ten behoeve van het verplicht melden van voorvallen als bedoeld in
      artikel 4, derde lid, van de verordening voorvallen;

      b. de inrichting en de werking van een systeem ten behoeve van het vrijwillig melden van voorvallen als bedoeld in
      artikel 5, tweede lid, van de verordening voorvallen;

      c. de inrichting en werking van een mechanisme voor het onafhankelijk verrichten van de verzameling, beoordeling,
      verwerking, analyse en opslag van de bijzonderheden over de overeenkomstig de artikelen 4 en 5 van de verordening
      voorvallen gemelde voorvallen.

      2 Bij regeling van Onze Minister van Infrastructuur en Waterstaat kunnen overeenkomstig artikel 5, zevende lid,
      van de verordening voorvallen regels worden gesteld voor het verzamelen en verwerken van veiligheidsinformatie,
      teneinde bijzonderheden over voorvallen te verzamelen die mogelijkerwijs niet worden opgenomen in de
      meldingssystemen als bedoeld in artikel 5, eerste lid, van de verordening voorvallen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van
      de verordening voorvallen op voorvallen en andere veiligheid gerelateerde informatie met betrekking tot
      luchtvaartuigen waarop de basisverordening niet van toepassing is.

      4 Gegevens die op grond van de artikelen 4, 5 en 10 van de verordening voorvallen zijn ontvangen of verzameld door
      of namens bestuursorganen, zijn niet openbaar.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel7.1
  - number: '7.2'
    text: |-
      Het Huis voor klokkenluiders, bedoeld in [artikel 3, eerste lid, van de Wet bescherming klokkenluiders][ref1]
      wordt aangewezen als het orgaan, bedoeld in artikel 16, twaalfde lid, van de verordening voorvallen, voor zover het
      betreft de uitvoering van de orgaantaken, bedoeld in de leden negen, elf en twaalf, van het laatstgenoemde artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '3'
  - number: '7.4'
    text: |-
      1 De luchtvervoerder en de exploitant van luchtvaartuigen, bedoeld in artikel 3 van de Verordening (EG) nr.
      785/2004 van het Europees Parlement en de Raad van 21 april 2004 tot vaststelling van gemeenschappelijke regels
      inzake de verzekeringseisen voor luchtvervoerders en exploitanten van luchtvaartuigen (PbEU L 138) hebben een
      verzekering die voldoet aan de artikelen 4, 6 en 7 van voornoemde verordening.

      2 Met betrekking tot niet-commerciële diensten van luchtvaartuigen met een MTOM van 2700 kg of minder bedraagt de
      verzekeringsdekking ten minste 100 000 BTR per passagier.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel7.4
  - number: '7.5'
    text: |-
      Het is een vliegtuigexploitant als bedoeld in artikel 3, onder o, van richtlijn nr. 2003/87/EG van het Europees
      Parlement en de Raad van de Europese Unie van 13 oktober 2003 tot vaststelling van een regeling voor de handel in
      broeikasgasemissierechten binnen de Gemeenschap en tot wijziging van richtlijn 96/61/EG van de Raad (PbEU L 275),
      zoals deze laatstelijk is gewijzigd bij richtlijn nr. 2008/101/EG van het Europees Parlement en de Raad van de
      Europese Unie van 19 november 2008 (PbEU 2009, L 8), verboden een vlucht uit te voeren met een luchtvaartuig zolang
      en voor zover de Commissie van de Europese Gemeenschappen op grond van artikel 16, tiende lid, van eerstgenoemde
      richtlijn aan de betrokken vliegtuigexploitant een exploitatieverbod heeft opgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel7.5
  - number: '7.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden vastgesteld betreffende de
      vergoedingen voor de kosten van handelingen die voortvloeien uit internationale overeenkomsten, die ter zake van
      de luchtvaartveiligheid door Nederland, dan wel op grond van de artikelen 100, tweede lid, en 207, eerste en vierde
      lid, in samenhang met artikel 218 van het Verdrag betreffende de werking van de Europese Unie door de Europese Unie
      zijn gesloten, voor zover deze kosten niet reeds de basis vormen voor de vergoedingen bedoeld in deze wet.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel7.6
  - number: '7.7'
    text: |-
      1 Wanneer een Nederlands luchtvaartuig buiten Nederland in een staat van exploitatie wordt geëxploiteerd kan met
      die staat van exploitatie een artikel 83bis-overeenkomst worden gesloten.

      2 Het bepaalde in het eerste lid is van overeenkomstige toepassing op buiten Nederland ingeschreven luchtvaartuigen
      ten aanzien waarvan de Nederlandse Staat als staat van exploitatie geldt.

      3 Een artikel 83bis-overeenkomst kan eveneens worden aangegaan met betrekking tot luchtvaartuigen, die
      geëxploiteerd worden door organisaties voor de gezamenlijke exploitatie van luchtvervoer of internationale
      exploitatiebureaus, dan wel voor het gemeenschappelijk uitoefenen van luchtdiensten op enige route of in enig
      gebied.

      4 Aan de sluiting van een artikel 83bis-overeenkomst gaat een evaluatie van de normen en voorschriften vooraf,
      zulks met inachtneming van de regels inzake gelijkstelling van buitenlandse bewijzen van luchtwaardigheid en
      buitenlandse bewijzen van bevoegdheid zoals opgenomen in deze wet.

      5 Dit artikel is uitsluitend van toepassing voor zover de basisverordening niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel7.7
  - number: '7.8'
    text: |-
      In afwijking van [artikel 7, tweede lid, van de Bekendmakingswet][ref1] kunnen bijlagen bij een krachtens deze wet
      vastgesteld algemeen verbindende voorschrift worden bekendgemaakt door terinzagelegging op een in dat voorschrift
      bepaalde locatie, indien dit voortvloeit uit internationaalrechtelijke verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel7
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '7'
  - number: '8.1'
    text: |-
      1 Luchthavens zijn te onderscheiden in:

      a. de luchthaven Schiphol,

      b. overige burgerluchthavens, en

      c. militaire luchthavens.

      2 Overige burgerluchthavens zijn van regionale betekenis of van nationale betekenis. Deze luchthavens zijn van
      nationale betekenis indien:

      a. zij zijn gelegen buiten provinciegrenzen zoals bepaald bij of krachtens de [Provinciewet][ref1], of

      b. dit bij wet is bepaald.

      3 Luchthavens van nationale betekenis zijn:

      a. de luchthaven Lelystad,

      b. de luchthaven Eelde,

      c. de luchthaven Maastricht, en

      d. de luchthaven Rotterdam.

      4 Indien het militaire gebruik van een militaire luchthaven, met uitzondering van de militaire luchthaven Twenthe,
      wordt beëindigd door intrekking van:

      a. de aanwijzing op grond van de [Luchtvaartwet][ref2] van die luchthaven als militaire luchthaven, of

      b. het luchthavenbesluit dat op deze luchthaven betrekking heeft,

      en op die plaats een burgerluchthaven wordt gevestigd, dan is deze luchthaven van nationale betekenis.

      5 In afwijking van het vierde lid kan bij algemene maatregel van bestuur worden vastgesteld dat een luchthaven als
      bedoeld in dat lid van regionale betekenis is.

      6 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005645
      [ref2]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0005645
      - id: ref2
        bwb_id: BWBR0002267
  - number: 8.1a
    text: |-
      1 Het is verboden met een luchtvaartuig op te stijgen of te landen, anders dan van of op een luchthaven.

      2 Het is verboden de luchthaven Schiphol in bedrijf te hebben indien voor deze luchthaven geen
      luchthavenindelingbesluit en luchthavenverkeerbesluit gelden en indien de exploitant van deze luchthaven niet
      beschikt over een geldig veiligheidscertificaat.

      3 Het is verboden een overige burgerluchthaven in bedrijf te hebben indien voor deze luchthaven geen
      luchthavenbesluit of luchthavenregeling geldt. Vaststelling van een luchthavenbesluit is vereist indien buiten het
      luchthavengebied het externe-veiligheidsrisico of de geluidbelasting vanwege het luchthavenluchtverkeer zodanig is
      dat dit gevolgen heeft voor de ruimtelijke indeling van het gebied rond de luchthaven. Bij of krachtens algemene
      maatregel van bestuur wordt de mate van externe-veiligheidsrisico of geluidbelasting buiten het luchthavengebied
      bepaald die vaststelling van gevolgen voor de ruimtelijke indeling van het gebied rond de luchthaven noodzakelijk
      maakt. Daarbij kan worden bepaald dat voor daarbij te omschrijven luchthavens in elk geval kan worden volstaan
      met de vaststelling van een luchthavenregeling. De voordracht voor een krachtens dit lid vast te stellen algemene
      maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-
      Generaal is overgelegd.

      4 Het is de exploitant van een overige burgerluchthaven waarvoor vaststelling van een luchthavenbesluit is vereist,
      verboden die luchthaven in bedrijf te hebben indien hij niet beschikt over een geldig veiligheidscertificaat.
      Bij algemene maatregel van bestuur kan dit verbod van toepassing worden verklaard op burgerluchthavens waarvoor
      vaststelling van een luchthavenregeling mogelijk is.

      5 Voor een militaire luchthaven is een luchthavenbesluit of een luchthavenregeling van kracht.

      6
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.1a
  - number: 8.1b
    text: |-
      1 In deze titel wordt verstaan onder:

        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *exploitant van de luchthaven:* de N.V. Luchthaven Schiphol, of, indien dit een ander is, de houder van de
      luchthavenexploitatievergunning;
        - *gebruiker:* een luchtvaartmaatschappij, alsmede een persoon of rechtspersoon die vluchten uitvoert, niet zijnde
      een luchtvaartmaatschappij;
        - *inspecteur-generaal:* de inspecteur-generaal Leefomgeving en Transport, bedoeld in het Instellingsbesluit
      Inspectie Leefomgeving en Transport;
        - *investeringsproject:* het samenhangende geheel van diensten, leveringen dan wel werken, die als zodanig
      zijn opgenomen in het in [artikel 8.25de][ref2] bedoelde investeringsprogramma, waarvan de uitgaven voor
      luchtvaartactiviteiten een bij algemene maatregel van bestuur vast te stellen bedrag overschrijden;
        - *luchthavenexploitatievergunning:* de vergunning, bedoeld in [artikel 8.25][ref3];
        - *luchthavennetwerk:* een groep luchthavens die als zodanig door de lidstaat is aangewezen en die wordt
      geëxploiteerd door een en dezelfde exploitant van de luchthaven;
        - *netwerkkwaliteit:* de directe beschikbaarheid van een omvangrijk, wereldwijd en frequent bediend lijnennet;
        - *operationele voorwaarden:* die voorwaarden die betrekking hebben op het gebruik van de luchthaven door de
      gebruikers;
        - *representatieve organisatie:* een bij ministeriële regeling aangewezen rechtspersoon die de belangen
      vertegenwoordigt van gebruikers;

      2 In deze titel wordt onder omgevingsplan mede verstaan een projectbesluit als bedoeld in de [Omgevingswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
