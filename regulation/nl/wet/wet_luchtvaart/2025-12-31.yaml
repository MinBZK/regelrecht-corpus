  - number: 8a.50
    text: |-
      1 De verbodsbepaling bedoeld in [artikel 8.1a, eerste lid][ref1], is niet van toepassing op bij algemene maatregel
      van bestuur te bepalen luchtvaartuigen.

      2 Van de in [artikel 8.1a, tweede tot en met vierde lid][ref2], genoemde verboden kan vrijstelling worden verleend
      door Onze Minister van Infrastructuur en Milieu.

      3

      4 Aan de vrijstelling, bedoeld in het tweede lid, kunnen voorwaarden worden verbonden.

      5 Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen regels worden gesteld omtrent het terrein niet
      zijnde een luchthaven waarvan de luchtvaartuigen bedoeld in het eerste lid opstijgen dan wel waarop zij landen en
      omtrent de wijze waarop dit terrein wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1a
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1a
