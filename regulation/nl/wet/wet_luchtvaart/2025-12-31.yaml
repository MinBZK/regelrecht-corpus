  - number: 11.16a
    text: |-
      1 Onverminderd [titel 4.4 van de Algemene wet bestuursrecht][ref1] kan de verlener van luchtvaartnavigatiediensten
      de verdere verlening van luchtvaartnavigatiediensten opschorten, indien de gebruiker van die diensten
      niet heeft voldaan aan de eis tot het onmiddellijk en volledig betalen van de vergoedingen, bedoeld in
      [artikel 5.20, eerste lid, onderdeel b][ref2], en [artikel 5.21, tweede lid][ref3].

      2 De opschorting kan slechts plaatsvinden wanneer een gebruiker gedurende drie maanden zijn openstaande facturen
      voor de vergoedingen niet heeft betaald of wanneer de achterstallige schuld minimaal 10.000 euro bedraagt.

      3 Voor de opschorting van de dienstverlening, stuurt de verlener van luchtvaartnavigatiediensten een aangetekend
      besluit naar de gebruiker waarin wordt aangegeven dat bij niet-betaling van de vergoedingen binnen 30 dagen de
      dienstverlening op kosten van de gebruiker zal worden opgeschort. Het besluit bevat de datum en het tijdstip vanaf
      wanneer geen dienstverlening meer zal worden gegeven.

      4 De kosten bedoeld in het derde lid, omvatten in ieder geval:

      a. parkeerkosten voor het luchtvaartuig die de gebruiker als gevolg van de opschorting aan de betrokken
      luchthavenexploitant verschuldigd wordt,

      b. kosten van verleende grondafhandelingsdiensten die de gebruiker als gevolg van de opschorting aan verleners van
      die diensten verschuldigd wordt.

      5 De dienstverlening blijft opgeschort zolang de achterstallige schuld vermeerderd met de in het derde lid bedoelde
      kosten niet is voldaan.

      6 De desbetreffende verlener van luchtvaartnavigatiediensten stelt de volgende instanties onverwijld op de hoogte
      van het besluit tot opschorting van de dienstverlening:

      a. overige verleners van luchtvaartnavigatiediensten in de gebieden in en grenzend aan het vluchtinformatiegebied
      Amsterdam,

      b. de betrokken luchthavenexploitant,

      c. de Eurocontrol-organisatie,

      d. Onze Minister van Infrastructuur en Milieu.

      7 Onze Minister van Infrastructuur en Milieu kan nadere regels stellen voor het opschorten van de verlening van
      luchtvaartnavigatiediensten.

      8 [Artikel 5.20, vijfde lid][ref4], is van overeenkomstige toepassing op de inning van vergoedingen als bedoeld in
      het derde lid, met dien verstande dat in onderlinge samenwerking voorzieningen worden getroffen door verleners van
      luchtvaartnavigatiediensten, exploitanten van luchthavens en verleners van grondafhandelingsdiensten.

      9 De LVNL kan op verzoek van de Eurocontrol-organisatie, ook de dienstverlening opschorten voor vluchten van
      gebruikers die een achterstand hebben in de betaling van aan de Eurocontrol-organisatie verschuldigde vergoedingen
      van kosten als bedoeld in [artikel 5.20, eerste lid, onderdeel a][ref5]. Het tweede tot en met het zevende lid zijn
      van overeenkomstige toepassing, met dien verstande dat de achterstallige schuld minimaal 50.000 euro bedraagt.


