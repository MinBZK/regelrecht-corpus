        bwb_id: BWBR0005555
        artikel: 8.24a
        hoofdstuk: '8'
        afdeling: '8.4'
  - number: '8.52'
    text: |-
      1 De exploitant van een luchthaven is gerechtigd luchthavenluchtverkeer ten behoeve van burgerluchtvaart op de
      luchthaven afhankelijk te stellen van toestemming. De toestemming wordt alleen geweigerd om te voorkomen dat de in
      het luchthavenbesluit opgenomen grenswaarden worden overschreden.

      2 Indien op de luchthaven luchtverkeersdienstverlening wordt gegeven vindt afstemming plaats met de verlening van
      luchtverkeersdienstverlening.

      3 Indien de exploitant gebruik maakt van het recht, bedoeld in het eerste lid, kan hij bij de vaststelling van
      tarieven voor de luchthaven een opslagtarief vaststellen voor het geval een luchtvaartuig zonder voorafgaande
      toestemming start of landt.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.52
  - number: '8.53'
    text: |-
      Indien de exploitant van een luchthaven tarieven en voorwaarden vaststelt voor het gebruik van de luchthaven zijn
      deze non-discriminatoir.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.53
  - number: '8.54'
    text: |-
      1 De exploitant van de luchthaven draagt zorg voor het registreren van de milieubelasting en indien van toepassing
      het externe-veiligheidsrisico vanwege het luchthavenluchtverkeer. Hij verricht de berekeningen die voor die
      registratie noodzakelijk zijn. Het registreren wordt zodanig uitgevoerd dat een vergelijking mogelijk is met de in
      het luchthavenbesluit opgenomen grenswaarden.

      2 Provinciale staten kunnen bij verordening regels stellen omtrent de registratie en omtrent de berekeningen die
      daartoe noodzakelijk zijn.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de registratie van
      de milieubelasting en indien van toepassing het externe-veiligheidsrisico voor zover op grond van
      [artikel 8.44, vierde lid][ref1], nadere regels zijn voorgeschreven. Hierbij worden tevens regels voorgeschreven
      omtrent de berekeningen die daartoe noodzakelijk zijn. De voordracht voor een krachtens de eerste volzin vast te
      stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers
      der Staten-Generaal is overgelegd.

      4 De exploitant van de luchthaven verstrekt aan gedeputeerde staten:

      a. de op grond van het eerste tot en met derde lid geregistreerde gegevens;

      b. gegevens over de in het eerste tot en met derde lid bedoelde berekeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.44
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.54
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.44'
        hoofdstuk: '8'
        paragraaf: 8.3.2.2
        afdeling: 8.3.2
  - number: '8.55'
    text: |-
      1 Gedeputeerde staten brengen ieder jaar aan provinciale staten verslag uit over de milieuaspecten en indien van
      toepassing de externe-veiligheidsaspecten vanwege het luchthavenluchtverkeer.

      2 De [artikelen 8.29, tweede lid][ref1], en [8.30][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.29
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.30
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.55
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.29'
        hoofdstuk: '8'
        paragraaf: 8.5.3
        afdeling: '8.5'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8.30'
        hoofdstuk: '8'
        paragraaf: 8.5.3
        afdeling: '8.5'
  - number: '8.56'
    text: |-
      De [artikelen 8.31][ref1] en [8.32][ref2] zijn van overeenkomstige toepassing met dien verstande dat bij
      de toepassing van artikel 8.31, zesde lid, gedeputeerde staten in de plaats treden van Onze Minister van
      Infrastructuur en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.31
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.32
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.56
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.31'
        hoofdstuk: '8'
        afdeling: '8.6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8.32'
        hoofdstuk: '8'
        afdeling: '8.6'
  - number: '8.57'
    text: |-
      Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen regels worden gesteld ten aanzien van het
      verstrekken van geldelijke steun uit de provinciale kas aan gemeenten ter bestrijding van de kosten ten gevolge van
      uitvoering van in overeenstemming met het luchthavenbesluit gebrachte omgevingsplannen.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.57
  - number: '8.58'
    text: |-
      1 Provinciale staten kunnen voor een luchthaven een commissie regionaal overleg luchthaven instellen.

      2 Indien provinciale staten voor een luchthaven een commissie instellen, bestaat de commissie uit een
      onafhankelijke voorzitter en in ieder geval uit vertegenwoordigers van:

      a. gemeenten waarin het beperkingengebied geheel of gedeeltelijk is gelegen,

      b. de exploitant van de luchthaven,

      c. de verlener van luchtverkeersdienstverlening voor zover op de luchthaven van toepassing, en

      d. omwonenden van de luchthaven.

      3 Onverminderd het tweede lid kan de commissie ook bestaan uit vertegenwoordigers van
      rechtspersoonlijkheidbezittende gebruikersorganisaties of milieuorganisaties.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.58
  - number: '8.59'
    text: |-
      1 De commissie heeft tot taak om door overleg tussen de in [artikel 8.58, tweede en derde lid][ref1], bedoelde
      betrokkenen een gebruik van de luchthaven te bevorderen dat zoveel mogelijk recht doet aan de belangen van die
      betrokkenen.

      2 Provinciale staten stellen nadere regels vast omtrent de taak, de samenstelling en de werkwijze van de commissie.
      Daarbij wordt in ieder geval bepaald welke in [artikel 8.58, tweede lid, onderdeel a][ref2], bedoelde gemeenten in
      de commissie vertegenwoordigd zijn.

      3 De voorzitter van de commissie wordt door provinciale staten benoemd, geschorst en ontslagen.

      4 Elk ander lid wordt benoemd, geschorst en ontslagen door de voorzitter op voordracht van het orgaan of de
      organisatie die het lid vertegenwoordigt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.58
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.58
