  - number: '10.11'
    text: |-
      1 Tenzij uitdrukkelijk anders is bepaald zijn de [hoofdstukken 8][ref1] en [8a][ref2] niet van toepassing op
      militaire luchthavens, met uitzondering van:

      a. [artikel 8.1a, eerste, vijfde en zesde lid][ref3],

      b. [titel 8a.1][ref4] voor zover het betreft burgermedegebruik door tussenkomst van een burgerexploitant, met dien
      verstande dat de regels, bedoeld in [artikel 8a.1, eerste lid][ref5], voor zover het militaire luchthavens betreft
      worden gesteld bij regeling van Onze Minister van Infrastructuur en Milieu in overeenstemming met Onze Minister van
      Defensie, en

      c. [artikel 8a.42][ref6] voor zover het betreft het gebruik van militaire luchthavens door burgerluchtvaartuigen.

      2 Voor de toepassing ingevolge het eerste lid van [titel 8a.1][ref7] op militaire luchthavens wordt als exploitant
      aangemerkt de burgerexploitant.


