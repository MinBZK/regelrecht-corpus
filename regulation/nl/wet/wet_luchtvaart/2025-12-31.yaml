  - number: '6.51'
    text: |-
      1 Het is verboden bij of krachtens algemene maatregel van bestuur aan te wijzen gevaarlijke stoffen met een
      luchtvaartuig te vervoeren, ten vervoer aan te bieden of aan te nemen, alsmede te laden in of te lossen uit een
      luchtvaartuig, of tijdens het vervoer neer te leggen.

      2 Het verbod in het eerste lid geldt niet voor de bij of krachtens algemene maatregel van bestuur aan te wijzen
      gevaarlijke stoffen of categorieën van gevaarlijke stoffen, indien aan de bij of krachtens die algemene maatregel
      van bestuur terzake gestelde regels is voldaan.

      3 Onder het vervoer van gevaarlijke stoffen wordt mede begrepen het laten staan op een luchthaven van een
      luchtvaartuig waarin zich dergelijke stoffen bevinden.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel6.51
  - number: 6.51a
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan instanties erkennen die belast zijn met de door hem aan te geven,
      in het kader van de krachtens [artikel 6.51, tweede lid][ref1], vastgestelde regels te verrichten taken. De taken
      kunnen mede betrekking hebben op het keuren en certificeren van verpakkingen of drukhouders.

      2 Onze Minister van Infrastructuur en Milieu kan regels stellen met betrekking tot de voorwaarden om voor erkenning
      in aanmerking te komen, de werkwijze van de erkende instanties, de periodieke verslaglegging over de verrichte
      werkzaamheden, alsmede de uitoefening van het toezicht op de erkende instanties.

      3 Onze Minister van Infrastructuur en Milieu kan aan de erkenning voorschriften of beperkingen verbinden. De
      voorschriften kunnen mede betrekking hebben op de door de erkende instantie in rekening te brengen tarieven.

      4 Onze Minister van Infrastructuur en Milieu kan de erkenning schorsen dan wel intrekken indien de betrokken
      instantie niet meer voldoet aan de bij of krachtens deze wet gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.51
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel6.51a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6.51'
        hoofdstuk: '6'
  - number: '6.52'
    text: |-
      1 Het is verboden gevaarlijke stoffen ten vervoer aan te bieden onder een andere benaming of onder opgave van een
      andere categorie-indeling dan die welke bij of krachtens deze wet is voorgeschreven.

      2 De in het eerste lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel6.52
  - number: '6.53'
    text: |-
      1 De regels, bedoeld in [artikel 6.51, tweede lid][ref1], kunnen onder meer betrekking hebben op:

      a. de eisen ten aanzien van constructie, inrichting en uitrusting van luchtvaartuigen, waarmee gevaarlijke stoffen
      worden vervoerd;

      b. de documenten die met betrekking tot gevaarlijke stoffen opgemaakt dienen te worden;

      c. de stuwage en de belading van luchtvaartuigen met inbegrip van samenlading;

      d. het onderzoek van gevaarlijke stoffen naar hun eigenschappen;

      e. de eisen ten aanzien van verpakking van gevaarlijke stoffen, met inbegrip van de daarbij behorende inrichting of
      uitrusting, en het testen of keuren daarvan, alsmede de uitgifte en intrekking van verpakkingskenmerken;

      f. de etiketten, kenmerken of andere aanduidingen op de verpakking, bedoeld in onderdeel e;

      g. de eisen ten aanzien van constructie, inrichting en uitrusting van inrichtingen, voertuigen of werktuigen met
      behulp waarvan gevaarlijke stoffen worden geladen of gelost;

      h. de keuring van de inrichtingen, voertuigen of werktuigen, bedoeld in onderdeel g;

      i. de melding voorafgaande aan het verrichten van een handeling, als bedoeld in [artikel 6.51][ref2];

      j. het opstellen van een risico-inventarisatie met betrekking tot het vervoeren, laden of lossen van door Onze
      Minister van Infrastructuur en Milieu daartoe aangewezen stoffen;

      k. het aanwijzen van luchtroutes waarlangs door Onze Minister van Infrastructuur en Milieu aangewezen gevaarlijke
      stoffen worden vervoerd.

      2 De betrokkene is een door Onze Minister van Infrastructuur en Milieu vast te stellen vergoeding verschuldigd voor
      de kosten van een keuring, als bedoeld in onderdeel h van het eerste lid, gebaseerd op de werkelijke kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6.51
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6.51
