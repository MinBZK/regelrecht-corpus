      Ingeval van overtreding van de [artikelen 8.25d tot en met 8.25dh][ref1], de
      krachtens [artikel 8.25di, eerste lid][ref2], gestelde regels, [8.25dj][ref3],
      [8.25i, vierde en vijfde lid][ref4], [8.25e, eerste tot en met negende lid][ref5] en de krachtens
      het twaalfde lid gestelde regels, [8.25ea, tweede, derde lid of vierde lid, laatste volzin][ref6],
      [8.25f, eerste, tweede, vierde of zevende lid][ref7] en de krachtens het achtste lid gestelde regels,
      [artikel 8.25fa, vierde en vijfde lid][ref8] en de krachtens het zevende lid gestelde regels, [8.25g][ref9],
      [8.25ga][ref10], [8.25h, eerste of tweede lid][ref11], [8.40c, eerste tot en met vierde lid][ref12] en de
      krachtens het vijfde lid gestelde regels, [8.40d][ref13], [8.40e, eerste tot en met vierde of zesde lid][ref14]
      en de krachtens het vijfde lid gestelde regels, [8.40f][ref15], [8.40g][ref16] of [8.40h][ref17], is
      [hoofdstuk 7][ref18], met uitzondering van de [artikelen 58a van de Mededingingswet][ref19] van overeenkomstige
      toepassing.


