  - number: 8.25dc
    text: |-
      1 De in [artikelen 8.25d][ref1] en [8.25db][ref2] bedoelde tarieven en voorwaarden zijn redelijk en non-
      discriminatoir.

      2 De in [artikelen 8.25d][ref3] en [8.25db][ref4] bedoelde tarieven kunnen worden gedifferentieerd uit een oogpunt
      van algemeen belang, met inbegrip van de bescherming van het milieu. De criteria voor deze tariefsdifferentiatie
      dienen de differentiatie te kunnen rechtvaardigen en zijn objectief en transparant.

      3 De in [artikelen 8.25d][ref5] en [8.25db][ref6] bedoelde tarieven zijn voor het geheel van de activiteiten
      kostengeoriënteerd.

      4 Onverminderd het derde lid zijn de tarieven voor het geheel van de beveiligingsactiviteiten ten behoeve van de
      burgerluchtvaart kostengeoriënteerd.


