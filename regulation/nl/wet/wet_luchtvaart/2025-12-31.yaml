  - number: '11.10'
    text: |-
      1 Met een gevangenisstraf van ten hoogste een jaar of een geldboete van ten hoogste de vierde categorie wordt
      gestraft degene, die

      a. handelt in strijd met de artikelen

      1°. [1.2a][ref1];

      2°. [2.12][ref2];

      3°. [3.8, eerste lid][ref3], [3.13, derde en vierde lid][ref4];

      4°. [11.5, vierde lid][ref5], [11.6, tweede, zesde, achtste en negende lid][ref6], [11.8, vijfde lid][ref7],
      [11.8a][ref8] voor zover het betreft de artikelen 11.5, 11.6 en 11.8, [11.12][ref9] en [11.14][ref10];

      b. handelt in strijd met hetgeen bij of krachtens de basisverordening is bepaald, voor zover deze voorschriften
      bij ministeriële regeling als bedoeld in [artikel 1.6][ref11] zijn aangewezen als misdrijf en het gaat om
      gelijksoortige voorschriften als bedoeld in onderdeel a;

      c. handelt in strijd met hetgeen bij of krachtens de basisverordening is bepaald, voor zover deze voorschriften bij
      ministeriële regeling als bedoeld in [artikel 1.6][ref12] zijn aangewezen als misdrijf en het gaat om andersoortige
      voorschriften dan bedoeld in onderdeel a.

      2 De in het eerste lid strafbaar gestelde feiten zijn misdrijven.

      3 De ministeriële regeling, bedoeld in het eerste lid, onderdeel c, vervalt een jaar nadat zij in werking is
      getreden, dan wel indien binnen die termijn een voorstel tot wijziging van het eerste lid bij de Staten-Generaal
      is ingediend, op het tijdstip waarop dat voorstel is verworpen of, na tot wet te zijn verheven, in werking is
      getreden.


