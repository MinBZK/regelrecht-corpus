        bwb_id: BWBR0005555
        artikel: 8a.64
        hoofdstuk: 8a
  - number: 8a.68
    text: |-
      1 Het boekjaar van ACNL loopt van 1 april van enig jaar tot en met 31 maart van het daaropvolgende jaar.

      2 In afwijking van [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref1] zendt ACNL jaarlijks het door
      hem vastgestelde jaarverslag voor 1 juni aan Onze Minister van Infrastructuur en Waterstaat en voor 15 juli aan
      beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.68
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: 8a.69
    text: |-
      1 ACNL stelt jaarlijks een begroting op, met in ieder geval:

      a. de jaarlijkse financiële begroting, bestaande uit een exploitatiebegroting en een kapitaalsbegroting;

      b. een meerjarenbegroting voor de eerstvolgende drie boekjaren.

      2 ACNL stuurt de begroting vóór 1 februari van het jaar voorafgaand aan het jaar waarop de begroting betrekking
      heeft naar Onze Minister van Infrastructuur en Waterstaat.

      3 Onze Minister van Infrastructuur en Waterstaat verleent dan wel onthoudt binnen vier weken de goedkeuring aan
      de begroting.

      4 In het geval de goedkeuring wordt onthouden, is de directie gerechtigd gedurende ten hoogste zes maanden van het
      nieuwe boekjaar voor iedere maand uitgaven te doen ter grootte van 115% van een twaalfde deel van de begroting van
      het voorafgaande boekjaar.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.69
  - number: 8a.70
    text: |-
      Onze Minister van Infrastructuur en Waterstaat stelt regels over de uitoefening van het toezicht op ACNL door Onze
      Minister van Infrastructuur en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.70
  - number: '9.1'
    text: |-
      1 In bijzondere omstandigheden in geval van ernstige verstoring van de binnenlandse openbare orde of veiligheid
      is Onze Minister van Infrastructuur en Milieu bevoegd in overeenstemming met Onze Minister van Binnenlandse Zaken
      en Koninkrijksrelaties en Onze Minister van Defensie aan de LVNL aanwijzingen te geven met betrekking tot het
      verzorgen van de luchtverkeersbeveiliging.

      2 In bijzondere omstandigheden in verband met de handhaving van de internationale rechtsorde of met de
      internationale betrekkingen is Onze Minister van Infrastructuur en Milieu bevoegd in overeenstemming met Onze
      Minister van Buitenlandse Zaken en Onze Minister van Defensie aan de LVNL aanwijzingen te geven met betrekking tot
      het verzorgen van de luchtverkeersbeveiliging.

      3 Indien de LVNL door het uitvoeren van de aanwijzingen financieel nadeel ondervindt, ontvangt hij een naar
      billijkheid te bepalen vergoeding.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel9.1
  - number: '9.2'
    text: |-
      1 Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kunnen, ingeval buitengewone
      omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, de
      [artikelen 9.3][ref3], [9.4][ref4] en [9.5][ref5] gezamenlijk of afzonderlijk in werking worden gesteld.

      2 Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede
      Kamer gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.

      3 Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.

      4 Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.

      5 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.

      6 Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
