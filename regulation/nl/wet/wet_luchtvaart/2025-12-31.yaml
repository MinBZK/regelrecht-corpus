  - number: '9.7'
    text: |-
      1 In afwijking van [artikel 1.4][ref1] richt Onze Minister van Defensie, voordat hij de hem krachtens
      [artikel 9.4][ref2] toekomende bevoegdheid uitoefent, een verzoek aan Onze Minister van Infrastructuur en Milieu
      om aan de behoefte gesteld door Onze Minister van Defensie te voldoen. Onze Minister van Defensie oefent de
      bevoegdheid krachtens [artikel 9.4][ref3] niet uit dan nadat Onze Minister van Infrastructuur en Milieu te kennen
      heeft gegeven niet te zullen voldoen aan dit verzoek.

      2 In dringende omstandigheden kan Onze Minister van Defensie afwijken van het eerste lid. Hij stelt Onze Minister
      van Infrastructuur en Milieu daarvan terstond in kennis. Zodra de omstandigheden dat naar het oordeel van Onze
      Minister van Defensie en van Onze Minister van Infrastructuur en Milieu toelaten, wordt aan de door Onze Minister
      van Defensie gestelde behoefte voldaan door Onze Minister van Infrastructuur en Milieu.

      3 Indien de in [artikel 9.3][ref4] toegekende bevoegdheid door Onze Minister van Infrastructuur en Milieu wordt
      uitgeoefend op verzoek van Onze Minister van Defensie als bedoeld in het eerste lid, vindt toekenning van een
      vergoeding krachtens [artikel 9.6, eerste lid][ref5], plaats in overeenstemming met Onze Minister van Defensie.
      Deze vergoeding komt voor rekening van Onze Minister van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1.4
