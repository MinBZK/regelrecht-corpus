  - number: 8a.62
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan voor iedere buitenlandse luchthaven, aangewezen bij of krachtens
      [artikel 8a.54][ref1], een commissie regionaal overleg luchthaven instellen.

      2 Indien een commissie wordt ingesteld, stelt Onze Minister van Infrastructuur en Milieu regels omtrent:

      a. de taak, samenstelling en werkwijze van de commissie,

      b. de instelling van een secretariaat ter ondersteuning van de commissie, en

      c. de mate waarin en de voorwaarden waaronder Onze Minister van Infrastructuur en Milieu jaarlijks bijdraagt in de
      kosten van de commissie.

      3 [Artikel 8.37][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.54
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.37
