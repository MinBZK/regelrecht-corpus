  - number: '5.24'
    text: De LVNL heeft een bestuur en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.24
  - number: '5.25'
    text: |-
      1 Het bestuur bestaat uit ten hoogste drie leden, waaronder de voorzitter.

      2 De hoedanigheid van lid van het bestuur is onverenigbaar met het lidmaatschap van de raad van toezicht.

      3 De leden van het bestuur worden benoemd voor een tijdvak van maximaal vier jaar en zijn aansluitend éénmalig voor
      een tijdvak van maximaal vier jaar herbenoembaar. In het geval van bijzondere omstandigheden binnen de organisatie
      van de LVNL kan een lid van het bestuur bij afloop van de tweede benoemingstermijn terstond opnieuw worden benoemd
      voor een tijdvak van maximaal twee jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.25
  - number: '5.26'
    text: |-
      1 Het bestuur is belast met de dagelijkse leiding van de LVNL.

      2 Alle bevoegdheden van de LVNL welke niet bij of krachtens deze wet aan de raad van toezicht zijn opgedragen,
      komen toe aan het bestuur.

      3 Het bestuur verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak benodigde inlichtingen en
      andere gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.26
  - number: '5.27'
    text: |-
      1 Het bestuur vertegenwoordigt de LVNL in en buiten rechte.

      2 Het bestuur kan onder zijn verantwoordelijkheid de vertegenwoordiging, bedoeld in het eerste lid, opdragen aan
      een of meer bestuursleden of andere personen. Het kan bepalen dat deze vertegenwoordiging uitsluitend betrekking
      heeft op bepaalde onderdelen van de taak van de LVNL dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.27
  - number: '5.28'
    text: |-
      Ingeval van schorsing of ontstentenis van een lid van het bestuur voorziet Onze Minister van Infrastructuur en
      Milieu in de waarneming van zijn functie.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.28
  - number: '5.29'
    text: |-
      Het bestuur legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de raad van toezicht
      bijzondere aanleiding bestaat, aan de raad van toezicht verantwoording af over het door hem gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.29
  - number: '5.30'
    text: |-
      De raad van toezicht bestaat uit zes leden, waaronder de voorzitter, alsmede een waarnemer, die Onze Minister van
      Infrastructuur en Milieu in de raad van toezicht vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.30
  - number: '5.31'
    text: |-
      1 De leden van de raad van toezicht worden zonder last of ruggespraak benoemd voor een tijdvak van vier jaren
      en zijn eenmaal voor een tijdvak van vier jaren herbenoembaar. Hun kan tussentijds op eigen verzoek, dan wel om
      zwaarwichtige redenen ontslag worden verleend.

      2 Onze Minister van Infrastructuur en Milieu benoemt een waarnemer in de raad van toezicht. Het waarnemerschap kan
      tussentijds op eigen verzoek, dan wel om zwaarwichtige redenen worden beëindigd.

      3 Onze Minister van Infrastructuur en Milieu benoemt, schorst en ontslaat de leden van de raad van toezicht, met
      dien verstande dat:

      a. een lid wordt benoemd op voordracht van Onze Minister van Defensie;

      b. vier leden worden benoemd op voordracht van de raad van toezicht.

      c. een lid, tevens voorzitter, wordt benoemd op voordracht van de raad van toezicht. Omtrent de voordracht
      besluiten de leden van de raad van toezicht met gewone meerderheid, met dien verstande dat de voorzitter niet
      deelneemt aan de vaststelling van de voordracht.

      4 Zolang in een vacature in de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad van
      toezicht, met de bevoegdheid van de volledige raad.

      5 De raad van toezicht verschaft Onze Minister alle verlangde inlichtingen, met inachtneming van het door Onze
      Minister vastgestelde informatiestatuut.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.31
  - number: '5.32'
    text: |-
      1 De raad van toezicht ziet toe op de werkzaamheden van het bestuur, en staat dit met raad terzijde.

      2 Bij de vervulling van hun taak nemen de leden van de raad van toezicht tot richtsnoer de verwezenlijking van de
      taakstelling en het belang van de LVNL waaronder de continuïteit van zijn bedrijfsvoering.

      3 Onze Minister van Infrastructuur en Milieu kan bepalen dat het bestuur de voorafgaande
      instemming behoeft van de raad van toezicht voor een beslissing als bedoeld in
      [artikel 32 van de Kaderwet zelfstandige bestuursorganen][ref1] of dat het bestuur, ingeval Onze Minister
      van Infrastructuur en Milieu een beslissing als bedoeld in dat artikel aan zijn voorafgaande instemming heeft
      onderworpen, die beslissing pas aan hem kan voorleggen nadat de raad van toezicht heeft verklaard tegen die
      beslissing geen bedenkingen te hebben.

      4 Besluiten van het bestuur betreffende de volgende onderwerpen behoeven voorafgaande instemming van de raad van
      toezicht:

      a. de reglementen bedoeld in de [artikelen 5.34][ref2], [5.36][ref3], [5.37][ref4] en [5.39][ref5];

      b. voorstellen aan Onze Minister van Infrastructuur en Milieu met betrekking tot de hoogte van het
      eenheidstarief, bedoeld in [artikel 5.20, derde lid][ref6], en de hoogte van de vergoeding, bedoeld in
      [artikel 5.21, tweede lid][ref7];

      c. de financiële begroting, en het financiële meerjarenbeleidsplan;

      d. het jaarverslag en de jaarrekening;

      e. de bij of krachtens de wet aan Onze Minister van Infrastructuur en Milieu uit te brengen rapportages;

      f. de aanwijzing van de externe registeraccountant;

      g. wijzigingen in de arbeidsvoorwaarden van het personeel.

      5 Besluiten betreffende het in het vierde lid, onderdeel c, genoemde financiële meerjarenbeleidsplan behoeven
      bovendien de goedkeuring van Onze Minister van Infrastructuur en Milieu.

      6 De raad van toezicht kan geen rechtsgeldige besluiten nemen indien niet tenminste tweederde van het aantal leden
      ter vergadering aanwezig is.

      7 De raad van toezicht stelt bij reglement zijn werkwijze vast. Het reglement behoeft de goedkeuring van Onze
      Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.34
