    text: |-
      1 Indien een bestuursorgaan in de rechtmatige uitoefening van zijn publiekrechtelijke bevoegdheid of taak met
      betrekking tot luchthavens schade veroorzaakt, is [titel 4.5 van de Algemene wet bestuursrecht][ref1] alleen van
      toepassing op de toekenning van vergoeding van schade als bedoeld in [artikel 4:126, eerste lid, van die wet][ref2]
      die wordt veroorzaakt door het vaststellen of wijzigen van een luchthavenindelingbesluit of
      luchthavenverkeerbesluit.

      2 Een aanvraag om schadevergoeding wordt ingediend binnen vijf jaar nadat de desbetreffende bepaling van het
      luchthavenindelingbesluit of luchthavenverkeerbesluit in werking is getreden.

      3 Voor de toepassing van dit artikel bestaat schade als bedoeld in
      [artikel 4:126 van de Algemene wet bestuursrecht][ref3] alleen uit inkomens- of omzetderving of waardevermindering
      van een onroerende zaak.

      4 De aanvrager heeft het risico van het ontstaan van de schade, bedoeld in
      [artikel 4:126, tweede lid, onder a, van de Algemene wet bestuursrecht][ref4], aanvaard als:

      a. een regel die is gesteld met het oog op een evenwichtige toedeling van functies aan locaties, wordt gewijzigd of
      beëindigd door een luchthavenindelingbesluit of luchthavenverkeerbesluit of de wijziging daarvan,

      b. gedurende een periode van ten minste drie jaar voorafgaande aan het luchthavenindelingbesluit of
      luchthavenverkeerbesluit of de wijziging daarvan van de mogelijkheden die de regel biedt geen gebruik is gemaakt,
      en

      c. na het verstrijken van de periode, bedoeld onder b, de benadeelde ten minste een jaar voor de bekendmaking van
      het luchthavenindelingbesluit of luchthavenverkeerbesluit of de wijziging daarvan is gewezen op het voornemen tot
      wijziging of beëindiging van die regel.

      5 Van schade die bestaat uit waardevermindering van een onroerende zaak, wordt vier
      procent aangemerkt als behorend tot het normale maatschappelijke risico als bedoeld in
      [artikel 4:126, eerste lid, van de Algemene wet bestuursrecht][ref5].

      6 Van de aanvrager heft Onze Minister van Infrastructuur en Waterstaat een recht ten bedrage van € 500. De
      aanvrager wordt gewezen op de verschuldigdheid van het recht en wordt medegedeeld dat het verschuldigde bedrag
      binnen vier weken na de dag van verzending van de mededeling op de door Onze Minister van Infrastructuur
      en Waterstaat aangegeven rekening moet zijn bijgeschreven. Indien het bedrag niet binnen deze termijn is
      bijgeschreven, wordt de aanvrager niet-ontvankelijk verklaard, tenzij redelijkerwijs niet kan worden geoordeeld dat
      de aanvrager in verzuim is geweest. Indien op de aanvraag geheel of gedeeltelijk positief wordt beslist, stort Onze
      Minister van Infrastructuur en Waterstaat het betaalde recht terug.

      7 [Afdeling 15.1 van de Omgevingswet][ref6] blijft buiten toepassing voor zover de belanghebbende met betrekking
      tot de schade een beroep doet of kan doen op een schadevergoeding als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4126
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4126
