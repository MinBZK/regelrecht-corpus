  - number: 11.2a
    text: |-
      1 Tot het toezicht op de naleving van de verplichtingen, voortvloeiend uit de erkenning, bedoeld in
      [artikel 3.25][ref1] van deze wet en de artikelen 11, 12, 13, 14, 15 en 16 van de basisverordening, behoort in
      ieder geval:

      a. het periodiek onderzoeken van het erkende bedrijf;

      b. het steekproefsgewijs onderzoeken van door het erkende bedrijf vervaardigde ontwerpen, producten of onderdelen.

      De houder van een erkenning is verplicht aan voor het houden van het toezicht noodzakelijke werkzaamheden
      medewerking te verlenen.

      2 Tot het toezicht op de naleving van de verplichtingen, voortvloeiend uit de AOC, bedoeld in
      [artikel 4.1, tweede lid][ref2], van deze wet en artikel 30, eerste lid, onderdeel b, van de basisverordening,
      behoort in ieder geval:

      a. het periodiek onderzoeken van de houder van de AOC, en

      b. het uitvoeren van inspectievluchten.

      De houder van de AOC is verplicht aan voor het houden van het toezicht noodzakelijke werkzaamheden medewerking
      te verlenen.

      3 De houder van een erkenning of een AOC is gehouden tot betaling, overeenkomstig door Onze Minister van
      Infrastructuur en Milieu te stellen regels, van het door Onze Minister van Infrastructuur en Milieu ter zake van de
      kosten van toezicht vastgestelde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.25
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel4.1
