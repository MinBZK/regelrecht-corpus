    text: |-
      1 Onze Minister van Defensie kan ontheffing verlenen van de krachtens [artikel 10.7][ref1] gegeven regels, wanneer
      de taakuitvoering met militaire luchtvaartuigen meebrengt, dat die regels in redelijkheid geen toepassing kunnen
      vinden en de veiligheid van het luchtverkeer met het verlenen van de ontheffing niet in gevaar komt. Aan de
      ontheffing kunnen voorschriften of beperkingen worden verbonden.

      2 Het[ tweede tot en met het vijfde lid van artikel 6.58][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.7
