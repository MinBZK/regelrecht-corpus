  - number: 2.1a
    text: |-
      Onverminderd de [Algemene wet erkenning EU-beroepskwalificaties][ref1] is hoofdstuk 2 van overeenkomstige
      toepassing op de erkenning van beroepskwalificaties als bedoeld in die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel2.1a
    references:
      - id: ref1
        bwb_id: BWBR0023066
  - number: '2.2'
    text: |-
      1 Onze Minister van Infrastructuur en Milieu geeft op aanvraag een bewijs van bevoegdheid af, wanneer degene, die
      het bewijs van bevoegdheid heeft aangevraagd:

      a. beschikt over een geldige medische verklaring;

      b. beschikt over voldoende kennis, bedrevenheid en ervaring met betrekking tot het bewijs van bevoegdheid dat hij
      heeft aangevraagd; en

      c. daartoe voldoende onderricht heeft genoten aan een door Onze Minister van Infrastructuur en Milieu of door de
      bevoegde autoriteit van een door hem aangewezen staat:

      1°. goedgekeurde of geregistreerde opleidingsinstelling, of

      2°. gecertificeerde opleidingsinstelling indien degene die het bewijs van bevoegdheid heeft aangevraagd een bewijs
      van bevoegdheid voor het verlenen van luchtverkeersdiensten heeft aangevraagd.

      2 Onze Minister van Infrastructuur en Milieu geeft op aanvraag op het bewijs van bevoegdheid een of meer
      bevoegdverklaringen weer. Het eerste lid is van overeenkomstige toepassing behoudens ter zake van de medische
      verklaring.

      3 Bij algemene maatregel van bestuur wordt aangegeven welke bewijzen van bevoegdheid Onze Minister van
      Infrastructuur en Milieu kan afgeven en welke bevoegdverklaringen Onze Minister van Infrastructuur en Milieu
      daarop kan weergeven; in die algemene maatregel worden voor elk bewijs van bevoegdheid en voor elke algemene
      bevoegdverklaring de bevoegdheden en eventueel aan de bevoegdverklaring te verbinden beperkingen aangegeven. Bij of
      krachtens algemene maatregel van bestuur kan worden aangegeven welke bijzondere bevoegdverklaringen en voor welke
      termijn Onze Minister van Infrastructuur en Milieu op het bewijs van bevoegdheid kan weergeven en welke beperkingen
      daaraan kunnen worden verbonden.

      4 Bij ministeriële regeling kan Onze Minister van Infrastructuur en Milieu met betrekking tot het model en
      de uitvoering van het document, waarop een bewijs van bevoegdheid en een of meer bevoegdverklaringen worden
      weergegeven, eisen vaststellen.

      5 Onze Minister van Infrastructuur en Milieu houdt van de door hem afgegeven bewijzen van bevoegdheid een register
      bij. In het belang van een goede uitvoering en handhaving van deze wet en de daarop berustende bepalingen verwerkt
      Onze Minister van Infrastructuur en Milieu in het register gegevens omtrent afgegeven bewijzen van bevoegdheid
      en bewijzen van gelijkstelling, rechterlijke uitspraken houdende ontzegging van de bevoegdheid een luchtvaartuig
      te bedienen, luchtverkeersdiensten te verlenen, luchthaveninformatie te verstrekken of een grondstation of een
      mobiel station als bedoeld in [artikel 2.1, eerste lid][ref1], te bedienen en persoonsgegevens over gezondheid
      als bedoeld in artikel 4, onderdeel 15, van de Algemene verordening gegevensbescherming van houders van een bewijs
      van bevoegdheid.

      6 Het derde lid is niet van toepassing op bewijzen van bevoegdheid voor het verlenen van luchtverkeersdiensten
      of het verstrekken van luchthaveninformatie. Bij algemene maatregel van bestuur wordt aangegeven welke bewijzen
      van bevoegdheid voor het verlenen van luchtverkeersdiensten of het verstrekken van luchthaveninformatie Onze
      Minister van Infrastructuur en Milieu kan afgeven en welke bevoegdverklaringen Onze Minister op die bewijzen van
      bevoegdheid kan weergeven. Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gesteld
      aan de bewijzen van bevoegdheid, bevoegdverklaringen en daaraan te verbinden machtigingen voor het verlenen van
      luchtverkeersdiensten of het verstrekken van luchthaveninformatie.

      7 Het eerste lid, onderdeel c, onder 2°, is niet van toepassing op degene die zijn taken uitoefent onder de
      verantwoordelijkheid van verleners van luchtvaartnavigatiediensten die deze diensten voornamelijk aanbieden aan
      andere bewegingen van luchtvaartuigen dan aan het algemeen luchtverkeer.

      8 Onder algemeen luchtverkeer als bedoeld in het zevende lid wordt verstaan: alle bewegingen van
      burgerluchtvaartuigen, alsmede alle bewegingen van staatsluchtvaartuigen, met inbegrip van militaire, douane- en
      politieluchtvaartuigen, voorzover deze bewegingen worden uitgevoerd in overeenstemming met de procedures van het
      Verdrag van Chicago.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.1
