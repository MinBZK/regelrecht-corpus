  - number: '11.25'
    text: |-
      Naar aanleiding van een onopzettelijke of uit onachtzaamheid begane overtreding van een wettelijk voorschrift stelt
      de Staat geen rechtsvordering in, indien van deze overtreding uitsluitend kennis is verkregen door een melding als
      bedoeld in de artikelen 4 en 5 van de verordening voorvallen, tenzij sprake is van een omstandigheid als bedoeld in
      artikel 16, tiende lid, van de verordening voorvallen.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel11.25
  - number: '11.26'
    text: |-
      Gegevens die bij een intern bedrijfsveiligheidsonderzoek in het kader van een bij of krachtens de Wet Luchtvaart
      of de [Luchtvaartwet][ref1] gecertificeerd veiligheidsmanagementssysteem zijn verkregen, kunnen niet ten behoeve
      van strafrechtelijk onderzoek naar aanleiding van een melding als bedoeld in de artikelen 4 en 5 van de verordening
      voorvallen worden gevorderd dan na machtiging van de rechter-commissaris op vordering van de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002267
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel11.26
    references:
      - id: ref1
        bwb_id: BWBR0002267
  - number: '11.27'
    text: |-
      Onze Minister van Infrastructuur en Milieu publiceert, voor zover van toepassing, uiterlijk met ingang van één
      maand na de inwerkingtreding van dit artikel en daarna steeds maandelijks, in de Staatscourant een lijst van
      instanties ten aanzien waarvan in de daaraan voorafgaande periode een beschikking tot oplegging van de bestuurlijke
      boete, bedoeld in [artikel 11.16, eerste lid, onderdeel e][ref1], of een beschikking tot toepassing van de
      bestuursdwang, bedoeld in [artikel 11.15, onderdeel b, onder 1°, 6° en 7°][ref2], onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11.16
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11.15
