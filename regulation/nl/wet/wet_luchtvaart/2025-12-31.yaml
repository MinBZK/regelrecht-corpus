  - number: '11.8'
    text: |-
      1 Indien het proces-verbaal, bedoeld in [artikel 11.7, eerste lid][ref1], betreft een lid van het boordpersoneel
      als bedoeld in [artikel 10.1, tweede lid][ref2], stelt de opsporingsambtenaar onverwijld, voor de afloop van
      de in [artikel 11.5, eerste lid][ref3], bedoelde periode, de officier van justitie bij het gerecht, bedoeld in
      [hoofdstuk II][ref4], titel [I][ref5], [III][ref6] of [IV van de Wet militaire strafrechtspraak][ref7] daarvan
      in kennis.

      2 De officier van justitie, bedoeld in het eerste lid, is bevoegd het betrokken lid van het boordpersoneel een
      vliegverbod op te leggen, totdat de rechterlijke uitspraak in kracht van gewijsde is gegaan of, indien bij die
      uitspraak het lid van het boordpersoneel de bevoegdheid een luchtvaartuig te bedienen is ontzegd, tot het tijdstip
      waarop die uitspraak, voor wat betreft de bijkomende straf der ontzegging voor tenuitvoerlegging vatbaar is
      geworden. De betrokken officier van justitie stelt hiervan onverwijld Onze Minister van Defensie in kennis.

      3 Indien de officier van justitie binnen tien dagen na de dag van invordering niet gebruik maakt van de in
      het tweede lid bedoelde bevoegdheid, heft hij het vliegverbod op. Opheffing vindt eveneens plaats, indien
      ernstig rekening moet worden gehouden met de mogelijkheid, dat aan de houder in geval van veroordeling geen
      onvoorwaardelijke ontzegging van een bevoegdheid, bedoeld in [artikel 11.11, tweede lid][ref8], zal worden
      opgelegd, dan wel geen onvoorwaardelijke ontzegging van langere duur wordt opgelegd dan de tijd gedurende welke
      het vliegverbod geldt, of indien het onderzoek van de zaak op de terechtzitting niet binnen zes maanden na de dag
      van oplegging van het vliegverbod is aangevangen. De betrokken officier van justitie stelt hiervan onverwijld Onze
      Minister van Defensie in kennis.

      4 In geval van toepassing van het tweede lid kan iedere belanghebbende bij klaagschrift daartegen in beroep
      komen. Artikel 11.7, vijfde lid, is van overeenkomstige toepassing met dien verstande, dat het klaagschrift wordt
      ingediend bij de griffie van het gerecht in feitelijke aanleg, bedoeld in [hoofdstuk II][ref9], titel [I][ref10],
      [III][ref11] of [IV van de Wet militaire strafrechtspraak][ref12] en de beschikking van de rechtbank eveneens
      onverwijld aan Onze Minister van Defensie wordt betekend.

      5 Ten aanzien van het vliegverbod, bedoeld in het tweede lid, is [artikel 11.5, vierde lid][ref13], van
      overeenkomstige toepassing.


