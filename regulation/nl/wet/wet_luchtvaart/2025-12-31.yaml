  - number: '11.11'
    text: |-
      1 Bij veroordeling wegens overtreding van een der in [artikel 11.9, eerste lid][ref1], strafbaar gestelde feiten
      kan de bevoegdheid

      a. aan boord van een luchtvaartuig werkzaamheden te verrichten als lid van het boordpersoneel,

      b. werkzaamheden te verrichten aan een luchtvaartuig,

      c. luchtverkeersdienstverlening te geven,

      voor ten hoogste drie jaren worden ontzegd.

      2 Bij veroordeling wegens overtreding van een der in [artikel 11.10, eerste lid][ref2], strafbaar gestelde feiten
      kan een bevoegdheid als bedoeld in het eerste lid voor ten hoogste zes jaren worden ontzegd.

      3 Indien tijdens het plegen van een der strafbare feiten, genoemd in [artikel 11.9, eerste lid][ref3], of bij
      of krachtens algemene maatregel van bestuur aangewezen, nog geen drie jaren zijn verlopen na het einde van de
      tijdsduur waarvoor bij een vroegere onherroepelijke veroordeling wegens een van die strafbare feiten of wegens een
      der in [artikel 11.10][ref4] bedoelde strafbare feiten de betrokkene een bevoegdheid als bedoeld in het eerste lid
      is ontzegd, kan hem die bevoegdheid voor ten hoogste zes jaren worden ontzegd.

      4 Indien tijdens het plegen van een der strafbare feiten, genoemd in [artikel 11.10, eerste lid][ref5], nog geen
      zes jaren zijn verlopen na het einde van de tijdsduur waarvoor bij een vroegere onherroepelijke veroordeling wegens
      een van die strafbare feiten de betrokkene een bevoegdheid als bedoeld in het eerste lid is ontzegd, kan hem die
      bevoegdheid voor ten hoogste twaalf jaren worden ontzegd.

      5 Onder vroegere onherroepelijke veroordeling als bedoeld in het derde onderscheidenlijk het vierde lid, wordt mede
      verstaan een vroegere onherroepelijke veroordeling door een strafrechter in een andere lidstaat van de Europese
      Unie wegens feiten soortgelijk aan de feiten, bedoeld in het derde onderscheidenlijk het vierde lid.


