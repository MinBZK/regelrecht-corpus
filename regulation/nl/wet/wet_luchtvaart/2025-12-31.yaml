  - number: '11.13'
    text: |-
      1 Bij de toepassing van [artikel 11.11][ref1] gaat de bijkomende straf in en verliest elk aan de veroordeelde
      ingevolge [artikel 2.2][ref2] van deze wet of de basisverordening afgegeven bewijs van bevoegdheid of ingevolge
      [artikel 2.7][ref3] van deze wet afgegeven bewijs van gelijkstelling zijn geldigheid voor de duur van de
      ontzegging, zodra de rechterlijke uitspraak voor wat genoemde bijkomende straf betreft, voor tenuitvoerlegging
      vatbaar is geworden. De uitspraak is, voor wat de bijkomende straf betreft, niet voor tenuitvoerlegging vatbaar,
      zolang de termijn, waarvoor hem bij een of meer andere rechterlijke uitspraken die bevoegdheid is ontzegd, nog niet
      verstreken is.

      2 Bij de rechterlijke uitspraak kan worden bepaald, dat de tijd, gedurende welke het bewijs van bevoegdheid van
      de veroordeelde ingevolge [artikel 11.7][ref4] voor het tijdstip, waarop de uitspraak voor wat betreft de in
      dit artikel genoemde bijkomende straf voor tenuitvoerlegging vatbaar is geworden, ingehouden is geweest, dan
      wel ingevolge [artikel 11.8, tweede lid][ref5], een vliegverbod is opgelegd, op de duur van de in het eerste lid
      bedoelde bijkomende straf geheel of gedeeltelijk in mindering zal worden gebracht.

      3 Voor wat betreft de in het eerste lid bedoelde bijkomende straf is
      [artikel 6:1:16, derde lid, van het Wetboek van Strafvordering][ref6] op rechterlijke uitspraken niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11.11
