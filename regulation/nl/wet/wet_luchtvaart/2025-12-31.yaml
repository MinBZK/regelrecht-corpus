  - number: 8.40f
    text: |-
      1 Gebruikers van een overige luchthaven die gebruik wensen te maken van diensten op maat of specifiek voor hen
      gereserveerde terminals of delen van terminals, kunnen een verzoek daartoe richten aan de exploitant.

      2 De exploitant van een overige luchthaven stelt relevante, objectieve, transparante en non-discriminatoire
      criteria vast, op basis waarvan een verzoek van gebruikers van de luchthaven wordt beoordeeld.

      3 Naast de criteria, bedoeld in het tweede lid, kan de exploitant van een overige luchthaven aanvullende criteria
      hanteren indien de inhoud van het verzoek daartoe noodzaakt. De aanvullende criteria voldoen aan dezelfde eisen als
      de criteria bedoeld in het tweede lid.

      4 Indien binnen vier weken nadat de exploitant van een overige luchthaven heeft beslist op een verzoek als bedoeld
      in het eerste lid, daartoe een aanvraag van een gebruiker is ingediend, stelt de Autoriteit Consument en Markt
      vast of de beslissing van de exploitant in strijd is met bij of krachtens deze wet gestelde regels. De Autoriteit
      Consument en Markt geeft haar oordeel binnen drie maanden. Indien de Autoriteit Consument en Markt vaststelt
      dat de beslissing in strijd is met bij of krachtens deze wet gestelde regels, deelt zij dit terstond mede aan de
      exploitant van de overige luchthaven die heeft beslist op het in het eerste lid bedoelde verzoek. De exploitant
      van de overige luchthaven neemt binnen vier weken een nieuwe beslissing op het verzoek met inachtneming van de
      overwegingen van de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.40f
  - number: 8.40g
    text: |-
      1 Indien binnen vier weken na de mededeling, bedoeld in [artikel 8.40c, eerste lid][ref1], van de vaststelling van
      de tarieven en voorwaarden bij de Autoriteit Consument en Markt een aanvraag van een gebruiker of representatieve
      organisatie is ingediend tot vaststelling of de tarieven en voorwaarden in strijd zijn met bij of krachtens
      deze wet gestelde regels, treden de tarieven en voorwaarden op de voorgenomen ingangsdatum niet in werking. De
      Autoriteit Consument en Markt deelt de exploitant van de overige luchthaven terstond mede dat een aanvraag van een
      gebruiker of van een representatieve organisatie is ontvangen.

      2 De Autoriteit Consument en Markt neemt binnen vier weken na ontvangst van de aanvraag een besluit omtrent
      de inwerkingtreding van de door de exploitant vastgestelde tarieven en voorwaarden. De Autoriteit Consument en
      Markt wijst daarbij de tarieven en voorwaarden aan waarvoor, gelet op de aanvraag, de in het eerste lid bedoelde
      opschorting van de inwerkingtreding noodzakelijk blijft. In plaats van deze aangewezen tarieven en voorwaarden
      hanteert de exploitant de tarieven en voorwaarden die golden in de periode voorafgaand aan de periode waarvoor de
      aangewezen tarieven en voorwaarden waren vastgesteld. De tarieven en voorwaarden die niet zijn aangewezen, treden
      op de door de exploitant voorgenomen ingangsdatum in werking. Het nemen van een besluit als bedoeld in de eerste
      volzin, blijft achterwege indien binnen de daarin genoemde termijn een besluit over de aanvraag kan worden genomen.

      3 De Autoriteit Consument en Markt beslist zo spoedig mogelijk doch uiterlijk binnen vier maanden na ontvangst
      van de aanvraag. Deze termijn kan in uitzonderlijke gevallen met twee maanden worden verlengd. De Autoriteit
      Consument en Markt doet de aanvrager voor het einde van de in de eerste volzin bedoelde termijn met redenen omkleed
      mededeling van de verlenging.

      4 Indien de Autoriteit Consument en Markt vaststelt dat de tarieven en voorwaarden in strijd zijn met bij of
      krachtens deze wet gestelde regels, deelt zij dit terstond mede aan de exploitant van de overige luchthaven.
      De exploitant van de overige luchthaven stelt opnieuw de tarieven en voorwaarden vast met inachtneming van de
      overwegingen van de Autoriteit Consument en Markt. Nadat de tarieven en voorwaarden opnieuw zijn vastgesteld, trekt
      de Autoriteit Consument en Markt het besluit omtrent de inwerkingtreding bedoeld in het tweede lid in. De opnieuw
      vastgestelde tarieven en voorwaarden gelden vanaf de door de exploitant oorspronkelijk voorgenomen ingangsdatum.

      5 Indien de Autoriteit Consument en Markt heeft vastgesteld dat de tarieven en voorwaarden niet in strijd zijn met
      bij of krachtens deze wet gestelde regels, trekt zij het besluit omtrent de inwerkingtreding bedoeld in het tweede
      lid in, en gelden deze tarieven en voorwaarden vanaf de door de exploitant oorspronkelijk voorgenomen ingangsdatum.

      6 Eventuele verschillen in tarieven, voortvloeiende uit beslissingen van de Autoriteit Consument en Markt als
      bedoeld in het eerste tot en met vijfde lid, worden vereffend bij de hernieuwde vaststelling van de tarieven en
      voorwaarden.

      7 Het eerste lid en [artikel 8.40e][ref2] zijn niet van toepassing op de vaststelling van tarieven en voorwaarden
      als bedoeld in het vierde lid.

      8 De exploitant van de overige luchthaven hanteert de ingevolge het vierde lid vastgestelde tarieven en
      voorwaarden gedurende het resterende deel van de periode waarvoor de tarieven en voorwaarden overeenkomstig
      [artikel 8.40c, eerste lid][ref3], waren vastgesteld.

      9 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de aanvraag, bedoeld in het
      eerste lid, aan de Autoriteit Consument en Markt en omtrent de vaststelling van tarieven en voorwaarden, bedoeld in
      het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.40c
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.40e
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8.40c
