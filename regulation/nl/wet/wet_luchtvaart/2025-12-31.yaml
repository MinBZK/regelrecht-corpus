  - number: 8.25da
    text: |-
      1 De exploitant van de luchthaven doet voorafgaande aan de periode waarop de in [artikel 8.25d, eerste lid][ref1],
      bedoelde tarieven en voorwaarden betrekking hebben, mededeling ter zake van de vaststelling van de tarieven en
      voorwaarden aan gebruikers en representatieve organisaties.

      2 De exploitant van de luchthaven betrekt bij de vaststelling van de in [artikel 8.25d, eerste lid][ref2], bedoelde
      tarieven en voorwaarden, de zienswijzen van gebruikers en representatieve organisaties en geeft in de mededeling
      ter zake van de vaststelling van de tarieven en voorwaarden gemotiveerd aan:

      a. of, in hoeverre en op welke wijze deze zienswijzen hebben geleid tot eventuele aanpassing van de voorgestelde
      tarieven en voorwaarden;

      b. welke mogelijke effecten de tarieven en voorwaarden hebben op de netwerkkwaliteit.

      3 De exploitant van de luchthaven draagt er op verzoek van een gebruiker of representatieve organisatie zorg
      voor dat de mededeling van de vaststelling van de tarieven geen tot die gebruiker of representatieve organisatie
      herleidbare informatie bevat, indien de informatie in de zienswijze door een gebruiker of representatieve
      organisatie als bedrijfsvertrouwelijk wordt gekwalificeerd.

      4 De exploitant van de luchthaven doet voorafgaande aan de periode waarop de in
      [artikel 8.25d, vierde en vijfde lid][ref3], bedoelde aangepaste tarieven betrekking hebben, mededeling van de
      vaststelling van de in [artikel 8.25dg][ref4], bedoelde afzonderlijke verrekeningen, het saldo van de afzonderlijke
      verrekeningen en de daaruit volgende aangepaste tarieven aan gebruikers en representatieve organisaties. Het tweede
      lid, onderdeel a, en het derde lid zijn van overeenkomstige toepassing.

      5 De exploitant van de luchthaven doet voorafgaande aan de periode waarop de in [artikel 8.25d, zesde lid][ref5],
      bedoelde aangepaste voorwaarden betrekking hebben, mededeling van de vaststelling aan gebruikers en representatieve
      organisaties. Het tweede lid, onderdeel a, en het derde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25d
