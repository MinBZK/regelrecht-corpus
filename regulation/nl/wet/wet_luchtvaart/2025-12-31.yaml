        hoofdstuk: '8'
  - number: '8.70'
    text: |-
      1 Voor een luchthaven waarvan op grond van [artikel 8.1, tweede lid][ref1], is bepaald dat deze van nationale
      betekenis is, wordt het luchthavenbesluit bij algemene maatregel van bestuur vastgesteld.

      2 De [artikelen 8.43, tweede lid][ref2], [8.44, eerste, tweede, derde en vijfde lid][ref3], [8.45][ref4],
      [8.46][ref5] en [8.47, eerste en tweede lid][ref6], zijn van overeenkomstige toepassing met dien verstande dat voor
      de toepassing van de artikelen 8.45, eerste en derde lid, en 8.46, eerste lid, Onze Minister van Infrastructuur en
      Milieu in de plaats treedt van gedeputeerde staten.

      3 Het luchthavenbesluit bevat omtrent de ruimtelijke indeling van het gebied van en rond de luchthaven in ieder
      geval regels ten aanzien van:

      a. de functie en het gebruik van de locatie in verband met het externe-veiligheidsrisico vanwege het
      luchthavenluchtverkeer;

      b. de functie en het gebruik van de locatie in verband met de geluidbelasting vanwege het luchthavenluchtverkeer;

      c. de functie en het gebruik van de locatie waaronder begrepen de maximale hoogte van objecten op of boven de
      locatie, in verband met de vliegveiligheid.

      4 Bij het vaststellen van het luchthavenbesluit worden de nadere regels, bedoeld in
      [artikel 8.44, vierde lid][ref7], en [artikel 8.47, derde lid][ref8], in acht genomen.

      5 Bij de vaststelling van het luchthavenbesluit kan in ieder geval gebruik worden gemaakt van gegevens en
      onderzoeken die niet ouder zijn dan twee jaar.

      6 Ten aanzien van de burgerluchthaven Twente wordt het luchthavenbesluit of een wijziging daarvan, in afwijking van
      het eerste lid, vastgesteld bij besluit van Onze Minister van Infrastructuur en Milieu. [Artikel 8.71][ref9] is van
      overeenkomstige toepassing.


