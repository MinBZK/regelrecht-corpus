  - number: 8.47a
    text: |-
      Provinciale staten nemen bij de vaststelling van het luchthavenbesluit het beleid in acht dat door Onze Minister
      van Infrastructuur en Milieu over luchthavens is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.47a
  - number: '8.48'
    text: |-
      Op de voorbereiding van een luchthavenbesluit of op de voorbereiding van een wijziging van een luchthavenbesluit
      is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.48
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '8.49'
    text: |-
      1 Een luchthavenbesluit of een wijziging van dit besluit treedt niet in werking dan nadat Onze Minister van
      Infrastructuur en Milieu heeft verklaard dat het veilig gebruik van het luchtruim door het luchthavenluchtverkeer
      is gewaarborgd. Onze Minister van Infrastructuur en Milieu beslist binnen negen weken na indiening van de aanvraag
      voor deze verklaring veilig gebruik.

      2 De afgifte van de verklaring van geen bezwaar op grond van [artikel 8.9, tweede lid][ref1], geschiedt niet dan
      nadat Onze Minister van Infrastructuur en Milieu heeft verklaard dat het veilig gebruik van het luchtruim door deze
      verklaring of ontheffing is gewaarborgd. Onze Minister van Infrastructuur en Milieu beslist binnen vier weken na
      indiening van de aanvraag voor deze verklaring veilig gebruik. Hij kan die beslissing eenmaal voor ten hoogste vier
      weken verdagen.

      3 De verklaring veilig gebruik, bedoeld in het tweede lid, is van rechtswege verleend indien Onze Minister:

      a. niet binnen vier weken na ontvangst van de aanvraag een beslissing op die aanvraag heeft genomen,

      b. niet binnen vier weken na ontvangst van de aanvraag heeft besloten de beslissing op die aanvraag te verdagen, of

      c. niet binnen de termijn waarmee de beslissing op de aanvraag is verdaagd, een beslissing op die aanvraag heeft
      genomen.

      4 Bij regeling van Onze Minister van Infrastructuur en Milieu worden voorschriften gegeven omtrent de gegevens die
      bij een aanvraag voor een verklaring van veilig gebruik moeten worden meegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.9
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.49
