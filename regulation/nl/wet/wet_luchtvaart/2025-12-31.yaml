        artikel: 10:31
  - number: '8.10'
    text: |-
      Voor zover het ontwerp van een omgevingsplan zijn grondslag vindt in de uitvoering van het
      luchthavenindelingbesluit kunnen zienswijzen geen betrekking hebben op dat deel van het ontwerpplan.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.10
  - number: '8.11'
    text: |-
      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden een
      verklaring van geen bezwaar als bedoeld in [artikel 8.9, tweede lid][ref2], en het besluit waarop de verklaring
      betrekking heeft als één besluit aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.9
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8.9'
        hoofdstuk: '8'
        paragraaf: 8.2.1
        afdeling: '8.2'
  - number: '8.13'
    text: |-
      De voordracht voor een luchthavenindelingbesluit wordt niet gedaan dan nadat het ontwerp is voorbereid met
      toepassing van [afdeling 3.4 van de Algemene wet bestuursrecht][ref1]. Zienswijzen kunnen daarbij naar voren worden
      gebracht door een ieder. Gelijktijdig met de terinzagelegging in het kader van de procedure in de hiervoor bedoelde
      afdeling wordt het ontwerp aan beide Kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.13
    references:
