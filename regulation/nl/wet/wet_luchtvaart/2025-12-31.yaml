  - number: '8.47'
    text: |-
      1 In het luchthavenbesluit worden ten behoeve van de ruimtelijke indeling van het gebied van en rond de luchthaven,
      het luchthavengebied en het beperkingengebied vastgesteld.

      2 De [artikelen 8.5, derde tot en met vijfde lid][ref1], [8.6][ref2], [8.7, eerste en derde lid][ref3], en
      [8.8 tot en met 8.11][ref4] zijn van overeenkomstige toepassing met dien verstande dat de verklaring van geen
      bezwaar, bedoeld in [artikel 8.9, tweede lid][ref5], wordt verleend door gedeputeerde staten en in het geval,
      bedoeld in [artikel 8.8, tweede lid][ref6], toepassing kan worden gegeven aan de [artikelen 2.22][ref7] en
      [4.16, eerste lid, van de Omgevingswet][ref8].

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de in luchthavenbesluiten op
      te nemen regels omtrent de vaststelling van het luchthavengebied en het beperkingengebied. Deze maatregel stelt ten
      aanzien van het beperkingengebied in ieder geval regels ten aanzien van:

      a. de functie en het gebruik van de locatie in verband met het externe-veiligheidsrisico vanwege het
      luchthavenluchtverkeer;

      b. de functie en het gebruik van de locatie in verband met de geluidbelasting vanwege het luchthavenluchtverkeer;

      c. de functie en het gebruik van de locatie waaronder begrepen de maximale hoogte van objecten op of boven de
      locatie, in verband met de vliegveiligheid.

      4 De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.6
