        artikel: '18'
  - number: '5.42'
    text: |-
      1 Onze Minister van Infrastructuur en Milieu stelt regels over de uitoefening van het toezicht op de LVNL door Onze
      Minister van Infrastructuur en Milieu en de raad van toezicht.

      2 Onze Minister van Infrastructuur en Milieu stelt een informatiestatuut vast.

      3 Onze Minister van Infrastructuur en Milieu kan het bestuur opdragen periodiek rapportage uit te brengen op een
      door hem, na overleg met het bestuur, te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.42
  - number: '5.43'
    text: |-
      1 De volgende stukken worden door het bestuur vastgesteld:

      a. de financiële begroting;

      b. het financiële meerjarenbeleidsplan.

      2 Het bestuur zendt het financiële meerjarenbeleidsplan aan Onze Minister van Infrastructuur en Milieu toe vóór
      1 november van het jaar voorafgaand aan het begrotingsjaar.

      3 Indien Onze Minister van Verkeer en Waterstaat binnen vier weken na de in het tweede lid bedoelde toezending de
      goedkeuring aan de in het eerste lid, onder a en b, genoemde stukken, niet heeft onthouden, wordt deze geacht te
      zijn verleend.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.43
  - number: '5.44'
    text: |-
      Waar in deze wet de goedkeuring van Onze Minister van Verkeer en Waterstaat is vereist, verleent dan wel onthoudt
      hij die, behoudens het bepaalde in [artikel 5.43, derde lid][ref1], binnen twaalf weken na de datum van ontvangst
      van de goed te keuren stukken. Indien Onze Minister van Verkeer en Waterstaat goedkeuring onthoudt aan de
      financiële begroting, is het bestuur gerechtigd voor iedere maand gedurende welke de goedkeuring wordt onthouden,
      uitgaven te doen ter grootte van maximaal een twaalfde deel van de begroting van het voorafgaande boekjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.43
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.44
