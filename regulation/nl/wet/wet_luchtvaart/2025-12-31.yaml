  - number: 8.25de
    text: |-
      1 De exploitant van de luchthaven stelt eenmaal per drie jaar een vijfjarig investeringsprogramma vast, betreffende
      de activiteiten van de exploitant ten behoeve van het gebruik van de luchthaven door gebruikers, voorafgaande aan
      de periode waarop het vijfjarige investeringsprogramma betrekking heeft. De in het vierde en vijfde jaar van het
      investeringsprogramma geplande investeringen zijn indicatief van aard.

      2 De exploitant van de luchthaven doet voor aanvang van het boekjaar waarin de in
      [artikel 8.25d, eerste lid][ref1], bedoelde tarieven en voorwaarden in werking treden, mededeling ter zake van de
      vaststelling van het in het eerste lid bedoelde vijfjarige investeringsprogramma.

      3 De exploitant van de luchthaven betrekt bij de vaststelling van het vijfjarige investeringsprogramma de
      zienswijzen van gebruikers en representatieve organisaties en geeft in de in het tweede lid, bedoelde mededeling,
      gemotiveerd aan:

      a. of, in hoeverre en op welke wijze deze zienswijzen hebben geleid tot een aanpassing van het voorgestelde
      investeringsprogramma;

      b. de mate van draagvlak voor het investeringsprogramma bij gebruikers en representatieve organisaties.

      4 De exploitant van de luchthaven draagt er op verzoek van een gebruiker of een representatieve organisatie zorg
      voor dat de mededeling van de vaststelling van het vijfjarige investeringsprogramma geen tot die gebruiker of
      representatieve organisatie herleidbare informatie bevat, indien de informatie in de zienswijze door een gebruiker
      of representatieve organisatie als bedrijfsvertrouwelijk wordt gekwalificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.25d
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.25de
