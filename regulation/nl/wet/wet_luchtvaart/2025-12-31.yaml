  - number: '10.38'
    text: |-
      Deze afdeling is van toepassing op militaire luchthavens waarvoor op grond van [artikel 10.12][ref1] vaststelling
      van een luchthavenbesluit niet is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.12
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.38
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10.12'
        hoofdstuk: '10'
        afdeling: 10.3.1
  - number: '10.39'
    text: |-
      1 Bij regeling van Onze Minister van Defensie kan voor een luchthaven een luchthavenregeling worden vastgesteld.

      2 In een luchthavenregeling wordt het luchthavengebied vastgesteld. Een luchthavenregeling kan tevens een
      grenswaarde voor geluidbelasting in de vorm van een maximum aantal vliegtuigbewegingen per jaar bevatten.

      3 Op de voorbereiding of de wijziging van een luchthavenregeling is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. Zienswijzen kunnen naar voren worden
      gebracht door een ieder.

      4 In een luchthavenregeling kunnen regels worden gegeven ten aanzien van:

      a. de aard en de omvang van het gebruik van de luchthaven;

      b. het toegestane luchthavenluchtverkeer voor zover die regels noodzakelijk zijn met het oog op de veiligheid en
      de geluidbelasting.

      5 Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van luchthavens of categorieën luchthavens
      regels worden gegeven ten aanzien van:

      a. de aanleg, inrichting en uitrusting;

      b. het gebruik van de luchthaven, mede met het oog op de veiligheid.

      6 Het luchthavengebied wordt vastgesteld met behulp van een kaart waarop de ligging van dit gebied is aangegeven.
      Deze kaart wordt vervaardigd op een schaal van ten minste 1 op 10 000.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.39
    references:
      - id: ref1
