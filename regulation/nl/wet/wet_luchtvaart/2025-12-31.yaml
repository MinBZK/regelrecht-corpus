  - number: '2.7'
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan op aanvraag een bewijs van gelijkstelling met een in een andere
      staat door een daar bevoegde autoriteit afgegeven bewijs van bevoegdheid afgeven. [Artikel 2.2, vierde lid][ref1],
      is van overeenkomstige toepassing.

      2 Het bewijs van gelijkstelling geeft niet meer bevoegdheden dan het betrokken bewijs van bevoegdheid en wordt
      slechts eenmaal afgegeven voor ten hoogste de duur van geldigheid van het betrokken bewijs van bevoegdheid doch
      niet langer dan een jaar.

      3 Onze Minister van Infrastructuur en Milieu kan een bewijs van gelijkstelling intrekken wanneer de omstandigheden,
      bedoeld in [artikel 2.6, eerste lid, onder c of d, of tweede lid][ref2] zich voordoen.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven over de voorwaarden en
      omstandigheden waaronder een bewijs van gelijkstelling wordt afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2.6
