      1 Onze Minister van Infrastructuur en Milieu kan een opleidingsinstelling ter verkrijging van een bewijs van
      bevoegdheid, bevoegdverklaring of attest als bedoeld in subdeel CCA van bijlage V bij verordening (EU) nr.
      1178/2011 goedkeuren of registreren, indien die opleidingsinstelling voldoet aan bij of krachtens algemene
      maatregel van bestuur te stellen eisen.

      2 Onverminderd het eerste lid kan Onze Minister van Infrastructuur en Milieu een opleidingsinstelling ter
      verkrijging van een bewijs van bevoegdheid of bevoegdverklaring voor het verlenen van luchtverkeersdiensten
      certificeren indien die opleidingsinstelling voldoet aan bij of krachtens algemene maatregel van bestuur te stellen
      eisen.

      3 Onze Minister van Infrastructuur en Milieu kan de goedkeuring of registratie van een opleidingsinstelling geheel
      of deels intrekken, wanneer die opleidingsinstelling niet meer voldoet aan de eisen, bedoeld in het eerste lid.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gegeven met betrekking tot de vergoeding, die
      de aanvrager is verschuldigd voor de kosten van de handelingen ten behoeve van de aanvraag tot afgifte van de
      goedkeuring of registratie, bedoeld in het eerste lid.

      5 [Artikel 2.8][ref1] en het derde en vierde lid van onderhavig artikel zijn van overeenkomstige toepassing op het
      certificeren van een opleidingsinstelling als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.8
