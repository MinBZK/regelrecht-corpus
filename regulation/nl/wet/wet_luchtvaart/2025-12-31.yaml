  - number: '10.24'
    text: |-
      De [artikelen 8.31 tot en met 8.33][ref1] zijn van overeenkomstige toepassing met dien verstande dat Onze Minister
      van Defensie in de plaats treedt van Onze Minister van Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.31
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.24
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.31'
        hoofdstuk: '8'
        afdeling: '8.6'
  - number: '10.25'
    text: |-
      1 Onze Minister van Defensie stelt voor iedere luchthaven ten behoeve van overleg en voorlichting omtrent
      milieuaspecten buiten een luchthaven een commissie van overleg en voorlichting milieu in.

      2 De commissie bestaat in ieder geval uit:

      a. één vertegenwoordiger van elke provincie waarin het beperkingengebied geheel of gedeeltelijk is gelegen;

      b. twee vertegenwoordigers van elke gemeente waarin het beperkingengebied geheel of gedeeltelijk is gelegen,
      waarvan één vertegenwoordiger van elke gemeente een omwonende van de luchthaven is;

      c. één of twee vertegenwoordigers van de luchthaven;

      d. één of twee vertegenwoordigers van Onze Minister van Defensie.

      3 Onverminderd het tweede lid kan de commissie ook bestaan uit vertegenwoordigers van rechtspersoonlijkheid
      bezittende milieuorganisaties.

      4 De vertegenwoordiger van de provincie, dan wel één van hen indien er meer vertegenwoordigers
      van provincies in de commissie zitting hebben, treedt op als voorzitter van de commissie. De
      [artikelen 8.37, tweede en derde lid][ref1], en [8.38][ref2] zijn van overeenkomstige toepassing met dien verstande
      dat Onze Minister van Defensie in de plaats treedt van Onze Minister van Infrastructuur en Milieu.

      5 Onze Minister van Defensie voorziet in het secretariaat van de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.37
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.38
