        paragraaf: 5.2.1
  - number: 5.14b
    text: |-
      1 Een bij of krachtens [artikel 5.13][ref1], [5.13a][ref2], [5.14][ref3] of [5.14a][ref4] aangewezen instantie kan,
      onverminderd haar verantwoordelijkheid voor het verlenen van de diensten waartoe deze instantie is aangewezen, na
      schriftelijke instemming door Onze Minister van Infrastructuur en Milieu luchtverkeersdiensten of meteorologische
      diensten voor de luchtvaartnavigatie laten verrichten door een andere verlener van luchtverkeersdiensten of
      meteorologische diensten voor de luchtvaartnavigatie.

      2 Ter verkrijging van de in het eerste lid bedoelde instemming dient de bij of krachtens [artikel 5.13][ref5],
      [5.13a][ref6], [5.14][ref7] of [5.14a][ref8] aangewezen instantie hiertoe een verzoek in bij Onze Minister van
      Infrastructuur en Milieu.

      3 De bij of krachtens [artikel 5.13][ref9], [5.14][ref10] of [5.14a][ref11] aangewezen instantie verstrekt alle
      informatie die benodigd is voor de beoordeling van een verzoek als bedoeld in het tweede lid.

      4 Gronden waarop instemming als bedoeld in het eerste lid kan worden onthouden zijn:

      a. het niet voldoen of niet kunnen voldoen door de verlener van wiens diensten gebruik zal worden gemaakt aan
      de op grond van [artikel 5.14d][ref12], derde lid, aan het certificaat van de aangewezen instantie gestelde
      beperkingen en voorschriften, dan wel indien het dienstverlening binnen het luchtruim van Bonaire, Sint Eustatius
      en Saba betreft, het niet voldoen of kunnen voldoen aan de bij regeling van Onze Minister gestelde eisen inzake het
      toezicht op de dienstverlener of inzake zijn bekwaamheid of geschiktheid;

      b. strijd met het belang van een veilig, ordelijk en vlot verloop van het luchtverkeer; of

      c. strijd met het recht.


