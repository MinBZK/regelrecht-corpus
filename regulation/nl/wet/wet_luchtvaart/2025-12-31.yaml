  - number: '5.39'
    text: |-
      Het bestuur stelt bij reglement de werkwijze vast voor het financiële beheer en de administratieve organisatie van
      de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.39
  - number: '5.40'
    text: |-
      1 De begroting bestaat uit:

      a. de jaarlijkse financiële begroting, bestaande uit een exploitatiebegroting en een kapitaalsbegroting;

      b. het financiële meerjarenbeleidsplan.

      2 Tot de lasten van de LVNL worden gerekend de kosten voortvloeiende uit de taken van Onze Minister van Verkeer en
      Waterstaat op het gebied van de luchtverkeersbeveiliging.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.40
  - number: '5.41'
    text: |-
      1 Het jaarverslag van de LVNL gaat vergezeld van:

      a. een opgave over de toepassing van de arbeidsvoorwaarden;

      b. een document, houdende de instemming bedoeld in [artikel 5.32, vierde lid, onder d][ref1].

      2 Het boekjaar van de LVNL valt samen met het kalenderjaar.

      3 In afwijking van [artikel 18 van de Kaderwet zelfstandige bestuursorganen][ref2] zendt het bestuur jaarlijks het
      door hem vastgestelde jaarverslag voor 1 mei aan Onze Minister van Infrastructuur en Waterstaat en voor 15 juni aan
      beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.32
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.41
