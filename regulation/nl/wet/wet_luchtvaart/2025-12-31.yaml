      2 Onze Minister van Defensie kan aan de LVNL een naar billijkheid te bepalen vergoeding toekennen ter
      zake van buitengewone kosten door de LVNL gemaakt vanwege de naleving van de aanwijzing gegeven krachtens
      [artikel 9.4][ref2].


