  - number: 8.25ea
    text: |-
      1 Gebruikers van de luchthaven die gebruik wensen te maken van diensten op maat of specifiek voor hen gereserveerde
      terminals of delen van terminals, kunnen een verzoek daartoe richten aan de exploitant.

      2 De exploitant van de luchthaven stelt relevante, objectieve, transparante en non-discriminatoire criteria vast,
      op basis waarvan een verzoek van gebruikers van de luchthaven wordt beoordeeld.

      3 Naast de criteria, bedoeld in het tweede lid, kan de exploitant van de luchthaven aanvullende criteria hanteren
      indien de inhoud van het verzoek daartoe noodzaakt. De aanvullende criteria voldoen aan dezelfde eisen als de
      criteria bedoeld in het tweede lid.

      4 Indien binnen vier weken nadat de exploitant van de luchthaven heeft beslist op een verzoek als bedoeld in het
      eerste lid, daartoe een aanvraag van een gebruiker is ingediend, stelt de Autoriteit Consument en Markt vast of de
      beslissing van de exploitant in strijd is met bij of krachtens deze wet gestelde regels. De Autoriteit Consument en
      Markt geeft haar oordeel binnen drie maanden. Indien de Autoriteit Consument en Markt vaststelt dat de beslissing
      in strijd is met bij of krachtens deze wet gestelde regels, deelt zij dit terstond mede aan de exploitant van
      de luchthaven. De exploitant van de luchthaven neemt binnen vier weken een nieuwe beslissing op het verzoek met
      inachtneming van de overwegingen van de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.25ea
  - number: 8.25f
    text: |-
      1 Binnen vier weken na de dag waarop de in [artikel 8.25da, eerste, vierde en vijfde lid][ref1], dan wel
      in [artikel 8.25db, vierde lid][ref2], bedoelde mededelingen, hebben plaats gehad kan een gebruiker of
      representatieve organisatie een aanvraag bij de Autoriteit Consument en Markt indienen tot vaststelling of de in
      [artikel 8.25d, eerste lid][ref3] en [8.25db, eerste tot en met derde lid][ref4], bedoelde tarieven en voorwaarden,
      of de in artikel 8.25d, vierde en vijfde lid, bedoelde aangepaste tarieven, of de in artikel 8.25d, zesde lid,
      bedoelde aangepaste voorwaarden, in strijd zijn met bij of krachtens deze wet gestelde regels. Als gevolg van die
      aanvraag treden bedoelde tarieven en voorwaarden, dan wel aangepaste tarieven en voorwaarden niet op de voorgenomen
      ingangsdatum in werking. De aanvraag heeft geen betrekking op de wijze waarop en de mate waarin de exploitant van
      de luchthaven de [artikelen 8.25dd, eerste lid][ref5] en [8.25de, vierde lid][ref6], heeft nageleefd. De Autoriteit
      Consument en Markt deelt de exploitant van de luchthaven terstond mede dat een aanvraag van een gebruiker of van
      een representatieve organisatie is ontvangen.

      2 De Autoriteit Consument en Markt neemt binnen vier weken na ontvangst van de in het eerste lid, bedoelde
      aanvraag, een besluit omtrent de inwerkingtreding van de door de exploitant van de luchthaven vastgestelde tarieven
      en voorwaarden, dan wel aangepaste tarieven of voorwaarden. De Autoriteit Consument en Markt wijst daarbij de
      tarieven en voorwaarden dan wel de aangepaste tarieven of voorwaarden aan waarvoor, gelet op de aanvraag, de in
      het eerste lid, bedoelde opschorting van de inwerkingtreding, noodzakelijk blijft. In plaats van deze aangewezen
      tarieven en voorwaarden, dan wel aangepaste tarieven of voorwaarden, hanteert de exploitant de tarieven en
      voorwaarden, dan wel aangepaste tarieven of voorwaarden, die golden in de periode voorafgaand aan de periode
      waarvoor de aangewezen tarieven en voorwaarden, dan wel aangepaste tarieven of voorwaarden, waren vastgesteld.
      De tarieven en voorwaarden, dan wel aangepaste tarieven of voorwaarden, die niet zijn aangewezen, treden op de
      door de exploitant van de luchthaven voorgenomen ingangsdatum in werking. Het nemen van een in de eerste volzin
      bedoelde besluit, blijft achterwege indien binnen de daarin genoemde termijn een besluit over de aanvraag kan
      worden genomen.

      3 De Autoriteit Consument en Markt beslist zo spoedig mogelijk, doch uiterlijk binnen vier maanden na ontvangst van
      een aanvraag. Deze termijn kan in uitzonderlijke gevallen met twee maanden worden verlengd. De Autoriteit Consument
      en Markt doet de aanvrager en de exploitant van de luchthaven voor het einde van de in de eerste volzin bedoelde
      termijn met redenen omkleed mededeling van de verlenging.

      4 Indien de Autoriteit Consument en Markt heeft vastgesteld dat de in [artikel 8.25d, eerste lid][ref7] en
      [8.25db, eerste tot en met derde lid][ref8], bedoelde tarieven en voorwaarden, dan wel de in artikel 8.25d, vierde
      en vijfde lid, bedoelde aangepaste tarieven, of de in artikel 8.25d, zesde lid, bedoelde aangepaste voorwaarden,
      in strijd zijn met bij of krachtens deze wet gestelde regels, deelt de Autoriteit Consument en Markt dit terstond
      mede aan de exploitant van de luchthaven en de aanvrager. De exploitant van de luchthaven stelt binnen vier weken
      na het besluit van de Autoriteit Consument en Markt nieuwe in artikel 8.25d, eerste lid en 8.25db, eerste tot
      en met derde lid, bedoelde tarieven en voorwaarden, of nieuwe in artikel 8.25d, vierde en vijfde lid, bedoelde
      aangepaste tarieven, dan wel nieuwe in artikel 8.25d, zesde lid, bedoelde aangepaste voorwaarden, met inachtneming
      van het besluit en de overwegingen van de Autoriteit Consument en Markt, vast. Nadat de tarieven en voorwaarden,
      dan wel de aangepaste tarieven of voorwaarden, opnieuw zijn vastgesteld, trekt de Autoriteit Consument en Markt
      het in het tweede lid bedoelde besluit omtrent de inwerkingtreding, in. De opnieuw vastgestelde in artikel 8.25d,
      eerste lid en 8.25db, eerste tot en met derde lid, bedoelde tarieven en voorwaarden, dan wel de nieuwe in artikel
      8.25d, vierde en vijfde lid, bedoelde aangepaste tarieven, of de in artikel 8.25d, zesde lid, bedoelde aangepaste
      voorwaarden, gelden vanaf de door de exploitant van de luchthaven oorspronkelijk voorgenomen ingangsdatum.

      5 Indien de Autoriteit Consument en Markt heeft vastgesteld dat de in [artikel 8.25d, eerste lid][ref9] en
      [8.25db, eerste tot en met derde lid][ref10], bedoelde tarieven en voorwaarden, dan wel de in artikel 8.25d, vierde
      en vijfde lid, bedoelde aangepaste tarieven, of de in artikel 8.25d, zesde lid, bedoelde aangepaste voorwaarden,
      niet in strijd zijn met de bij of krachtens deze wet gestelde regels, trekt de Autoriteit Consument en Markt het
      besluit omtrent de in het tweede lid bedoelde inwerkingtreding, in en gelden deze tarieven en voorwaarden, dan
      wel aangepaste tarieven of voorwaarden, vanaf de door de exploitant van de luchthaven oorspronkelijk voorgenomen
      ingangsdatum. De Autoriteit Consument en Markt stelt de exploitant van de luchthaven en de aanvrager van zijn
      besluit op de hoogte.

      6 Het eerste lid en de [artikelen 8.25da][ref11], [8.25db, vierde lid][ref12], en [8.25e][ref13] zijn niet van
      toepassing op de in het vierde lid bedoelde vaststelling van tarieven en voorwaarden, de aangepaste tarieven en de
      aangepaste voorwaarden.

      7 De exploitant van de luchthaven hanteert de ingevolge het vierde lid vastgestelde tarieven en voorwaarden,
      dan wel aangepaste tarieven of voorwaarden, gedurende de resterende periode waarop de in het eerste lid bedoelde
      aanvraag betrekking had.

      8 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de in het eerste lid
      bedoelde aanvraag aan de Autoriteit Consument en Markt en omtrent de in het vierde lid bedoelde vaststelling van
      tarieven en voorwaarden, dan wel aangepaste tarieven of voorwaarden, door de exploitant van de luchthaven.


