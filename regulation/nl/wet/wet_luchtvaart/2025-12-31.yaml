  - number: '12.6'
    text: |-
      In afwijking van het bepaalde in [artikel 5.31][ref1] benoemt Onze Minister van Infrastructuur en Milieu de leden
      van de raad van toezicht, bedoeld in [artikel 5.31, tweede lid onder a, b, c, en d][ref2] de eerste maal als volgt:

      a. een lid wordt benoemd op voordracht van Onze Minister van Defensie;

      b. een lid wordt benoemd uit de kring van de in Nederland werkzame luchtvaartmaatschappijen;

      c. een lid wordt benoemd uit de kring van de exploitanten van Nederlandse luchthavens;

      d. een lid, tevens voorzitter, wordt benoemd op voordracht van de vier reeds benoemde leden van de raad van
      toezicht, voor een periode van drie jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.31
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.31
