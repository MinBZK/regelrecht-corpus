  - number: '10.28'
    text: |-
      1 In het luchthavenbesluit voor een militaire luchthaven waar een vergunning voor burgermedegebruik kan worden
      verleend, worden de in [artikel 10.17, tweede en vierde lid][ref1], bedoelde grenswaarden en regels voor het
      militair luchtverkeer en het burgerluchtverkeer afzonderlijk vastgesteld. Voor het burgerluchtverkeer of een
      gedeelte daarvan kan de vaststelling van een afzonderlijke grenswaarde voor geluidbelasting geschieden in de vorm
      van een maximum aantal vliegtuigbewegingen per jaar.

      2 Het luchthavenbesluit bevat ten behoeve van het burgerluchtverkeer in ieder geval regels omtrent de tijdstippen
      waarop van de luchthaven gebruik kan worden gemaakt.

      3 Het luchthavenbesluit kan regels bevatten die noodzakelijk zijn met het oog op de geluidbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.17
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.28
