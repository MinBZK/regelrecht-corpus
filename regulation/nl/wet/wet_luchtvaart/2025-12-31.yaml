        artikel: '10.17'
        hoofdstuk: '10'
        paragraaf: 10.3.2.2
        afdeling: 10.3.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10.20'
        hoofdstuk: '10'
        paragraaf: 10.3.2.3
        afdeling: 10.3.2
  - number: '10.22'
    text: |-
      1 Onze Minister van Defensie kan voor een luchthaven indien ten gevolge van groot onderhoud van een baan of door
      een bijzonder voorval het normale gebruik van de luchthaven naar zijn oordeel ernstig wordt belemmerd, of in
      verband met bijzondere redenen van nationale of bondgenootschappelijke aard:

      a. vrijstelling verlenen van een regel in het luchthavenbesluit;

      b. een in het luchthavenbesluit vastgelegde grenswaarde vervangen door een andere grenswaarde.

      2 Het verlenen van een vrijstelling van een regel als bedoeld in [artikel 10.17, vierde lid, onder a of b][ref1],
      geschiedt in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      3 Een vrijstelling kan slechts worden verleend voor een bepaalde in de vrijstelling vast te stellen termijn van ten
      hoogste een jaar.

      4 Aan een vrijstelling kunnen beperkingen en voorschriften worden verbonden met het oog op geluidsbelasting
      en veiligheid. [Artikel 10.20][ref2] is van overeenkomstige toepassing ten aanzien van de beperkingen en
      voorschriften.

      5 Het derde en vierde lid zijn van overeenkomstige toepassing op een vervanging als bedoeld in het eerste lid,
      onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10.17
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10.20
