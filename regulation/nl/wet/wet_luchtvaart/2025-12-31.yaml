  - number: 5.14d
    text: |-
      1 Het is verboden luchtvaartnavigatiediensten te verlenen zonder te beschikken over een daartoe bestemd certificaat
      als bedoeld in artikel 7 van de luchtvaartnavigatiedienstenverordening en artikel 41 van de basisverordening.

      2 Onze Minister van Infrastructuur en Milieu verstrekt een certificaat als bedoeld in het eerste lid, indien
      de aanvrager voldoet aan de in artikel 6 van de luchtvaartnavigatiedienstenverordening en artikel 40 van de
      basisverordening bedoelde eisen.

      3 Aan een certificaat kunnen de voorschriften en beperkingen, zoals bedoeld in Bijlage II van de
      luchtvaartnavigatiedienstenverordening, worden verbonden.

      4 De in het derde lid bedoelde voorschriften en beperkingen kunnen na het verstrekken van het certificaat
      ambtshalve worden gewijzigd of aangevuld wegens:

      a. wijziging van de krachtens deze wet gestelde regels;

      b. wijziging van de kaderverordening, luchtvaartnavigatiedienstenverordening, luchtruimverordening of
      interoperabiliteitsverordening; of

      c. wijziging van bepalingen die op grond van de in onderdeel b genoemde verordeningen zijn gesteld.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de aanvraag en verlening van
      een certificaat.

      6 Onze Minister van Infrastructuur en Milieu neemt binnen twaalf weken na ontvangst van de aanvraag voor het
      verlenen van een certificaat een besluit omtrent de afgifte daarvan.

      7 Onze Minister van Infrastructuur en Milieu kan een certificaat geheel of gedeeltelijk opschorten of intrekken
      overeenkomstig hetgeen bij of krachtens de basisverordening is bepaald.

      8 Dit artikel is niet van toepassing op verleners van luchtvaartnavigatiediensten die deze diensten hoofdzakelijk
      aanbieden aan andere bewegingen van luchtvaartuigen dan aan het algemeen luchtverkeer als bedoeld in
      [artikel 2.2, achtste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.14d
