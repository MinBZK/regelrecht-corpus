    text: |-
      1 Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen inzake de heffingen en de invordering daarvan
      nadere in het kader van de [artikelen 8a.38 tot en met 8a.40][ref1] passende regels worden gesteld ter aanvulling
      van de daarin geregelde onderwerpen.

      2 Bij regeling van Onze Minister van Infrastructuur en Milieu worden regels gesteld inzake de afdracht van de
      door de functionaris als bedoeld in [artikel 8a.40, eerste lid][ref2], ingevorderde heffing aan Onze Minister van
      Infrastructuur en Milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.38
