  - number: '10.29'
    text: |-
      1 De houder van een vergunning voor burgermedegebruik en Onze Minister van Defensie bevorderen het goede
      verloop van het luchthavenluchtverkeer overeenkomstig de vergunning en het luchthavenbesluit voor zover
      dit betrekking heeft op het burgerluchtverkeer. Zij treffen daartoe zelf en in onderlinge samenwerking de
      voorzieningen die redelijkerwijs van hen kunnen worden gevergd om te bewerkstelligen dat de belasting vanwege het
      luchthavenluchtverkeer een in de vergunning voor het burgermedegebruik opgenomen grenswaarde, daaronder begrepen
      een voor het burgermedegebruik vastgesteld maximum aantal vliegtuigbewegingen, niet overschrijdt.

      2 Ingeval de vergunning voor burgermedegebruik is verleend aan een burgerexploitant, is [artikel 8.19][ref1] van
      overeenkomstige toepassing.

      3 [Artikel 8.21][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.19
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.21
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel10.29
