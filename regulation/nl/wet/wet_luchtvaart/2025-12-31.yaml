        afdeling: 8.4.2
  - number: 8a.1
    text: |-
      1 Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen regels worden gesteld omtrent de aanleg,
      de inrichting, de uitrusting en het gebruik van luchthavens met het oog op de orde en de veiligheid op die
      luchthavens. Hierbij kan een onderscheid worden gemaakt tussen categorieën luchthavens en tussen vormen van
      luchtvaart die gebruik maken van luchthavens.

      2 Onze Minister van Infrastructuur en Milieu kan ontheffing verlenen van de regels, bedoeld in het eerste lid. Deze
      ontheffing wordt slechts verleend indien:

      a. als gevolg van bijzondere omstandigheden de regels in redelijkheid geen toepassing kunnen vinden, en

      b. de veiligheid van de luchthaven en van het luchthavenluchtverkeer met het verlenen van een ontheffing niet in
      gevaar worden gebracht.

      3 Aan de ontheffing, bedoeld in het tweede lid, kunnen voorschriften of beperkingen worden verbonden.

      4 De kosten die samenhangen met het in behandeling nemen van de aanvraag en de afgifte van de in het tweede lid
      bedoelde ontheffing of een wijziging daarvan, worden ten laste gebracht aan de aanvrager.

      5 De bedragen ter vergoeding van de kosten, bedoeld in het vierde lid, worden bij ministeriële regeling
      vastgesteld.

      6 Bij regeling van Onze Minister van Infrastructuur en Milieu kunnen regels worden gesteld omtrent het verrichten
      van grondafhandelingsdiensten op luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.1
  - number: 8a.2
    text: |-
      1 Onze Minister van Infrastructuur en Milieu verleent of wijzigt op aanvraag van de exploitant een
      veiligheidscertificaat indien wordt voldaan aan de regels, bedoeld in [artikel 8a.1, eerste lid][ref1], voorzover
      deze regels betrekking hebben op het luchtvaartgebied en [artikel 8a.3, tweede lid][ref2].

      2 Een veiligheidscertificaat vermeldt het gebruik waarvoor het verleend is.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.1
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8a.3
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8a.1
        hoofdstuk: 8a
      - id: ref2
        bwb_id: BWBR0005555
        artikel: 8a.3
        hoofdstuk: 8a
  - number: 8a.3
    text: |-
      1 Ten behoeve van het verkrijgen van een veiligheidscertificaat stelt de exploitant een luchthavenbedrijfshandboek
      op. Het luchthavenbedrijfshandboek bevat een beschrijving van de aanleg, de inrichting, de uitrusting en het veilig
      gebruik van het luchtvaartgebied alsmede een beschrijving van het veiligheidsmanagementsysteem van de luchthaven.

      2 Bij regeling van Onze Minister van Infrastructuur en Milieu worden regels gegeven omtrent het
      veiligheidscertificaat, het veiligheidsmanagementsysteem en het luchthavenbedrijfshandboek. Hierbij kan een
      onderscheid worden gemaakt tussen categorieën luchthavens en vormen van luchtvaart die gebruik maken van
      luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.3
  - number: 8a.4
    text: |-
      1 Een veiligheidscertificaat wordt afgegeven voor onbepaalde tijd. Een veiligheidscertificaat is niet
      overdraagbaar.

      2 Bij regeling van Onze Minister van Infrastructuur en Milieu worden nadere regels gegeven omtrent de aanvraag tot
      het verlenen of het wijzigen van een veiligheidscertificaat.

      3 De kosten die samenhangen met het in behandeling nemen van de aanvraag en de afgifte van het certificaat of een
      wijziging daarvan, worden ten laste gebracht van de aanvrager.

      4 De bedragen ter vergoeding van de kosten worden vastgesteld bij regeling van Onze Minister van Infrastructuur
      en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.4
  - number: 8a.5
    text: |-
      1 Onze Minister van Infrastructuur en Milieu schorst het veiligheidscertificaat geheel of gedeeltelijk indien de
      veiligheid van de luchthaven niet gewaarborgd is.

      2 Onze Minister van Infrastructuur en Milieu trekt een veiligheidscertificaat geheel of gedeeltelijk in bij gehele
      of gedeeltelijke beëindiging van het gebruik waarvoor het certificaat is verleend.

      3 Onze Minister van Infrastructuur en Milieu trekt een veiligheidscertificaat geheel of gedeeltelijk ambtshalve
      in indien:

      a. er stelselmatig sprake is van grove overtredingen van de veiligheidsvoorschriften,

      b. het veiligheidsmanagementsysteem de veiligheid niet langer waarborgt, of

      c. de exploitant ook na aanmaning weigert mee te werken aan het toezicht op de veiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.5
  - number: 8a.37
    text: Deze paragraaf is van toepassing op de luchthaven Schiphol.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.37
  - number: 8a.38
    text: |-
      1 Met betrekking tot de financiering en de bekostiging van de kosten van de uitvoering van
      [artikel 8.32][ref1] wordt onder de naam «geluidsheffing burgerluchtvaart» een heffing geheven.
      Naast de geluidsheffing burgerluchtvaart wordt een heffing geheven ter financiering van de
      kosten van de uitvoering van [artikel 8.33][ref2], alsmede de kosten van het Schadeschap
      Luchthaven Schiphol en van zijn uitspraken voor zover deze betrekking hebben op de uitvoering van
      __REF002___________________________________________________________________________________________________________
      _________________________________ dan wel van de opvolger van dit schadeschap belast met de behandeling van en de
      besluitvorming inzake een aanvraag als bedoeld in [artikel 8.31][ref4].

      2 De heffingen worden geheven ter zake van het landen met een burgerluchtvaartuig tot het tijdstip waarop de kosten
      als bedoeld in het eerste lid, zijn voldaan.

      3 De heffingen worden geheven van de natuurlijke persoon of de rechtspersoon die als eigenaar of houder van
      een burgerluchtvaartuig dit te zijner beschikking heeft en dit onder zijn verantwoordelijkheid laat deelnemen
      aan het luchtverkeer. De natuurlijke persoon of rechtspersoon, bedoeld in de eerste volzin, is in ieder geval
      belanghebbende bij een uitspraak van het Schadeschap Luchthaven Schiphol als bedoeld in het eerste lid, tweede
      volzin dan wel de opvolger van dit schadeschap bedoeld in het eerste lid, tweede volzin.

      4 De geluidsheffing burgerluchtvaart wordt geheven naar de geluidsproduktie van het burgerluchtvaartuig uitgedrukt
      in een aantal rekeneenheden. De geluidsproduktie wordt bepaald met toepassing van bij of krachtens algemene
      maatregel van bestuur te bepalen formules.

      5 Het basistarief van de heffing per rekeneenheid geluidsproductie bedraagt in het jaar 2004 € 27,–. Het tarief van
      de heffing per rekeneenheid geluidsproductie wordt na 2004 met ingang van elk daarop volgend kalenderjaar verhoogd
      met € 1,–.

      6 Het basistarief, bedoeld in het vijfde lid, wordt per rekeneenheid verhoogd met:

      a. € 98,50 tot het jaar 2010;

      b. € 40,– vanaf het jaar 2010, met dien verstande dat deze verhoging met ingang van elk daaropvolgend kalenderjaar
      wordt verhoogd met € 1,25.

      7 Het tarief van de in het eerste lid, tweede volzin, bedoelde heffing bedraagt € 0,50 per ton van de maximale
      toegelaten startmassa van het luchtvaartuig.

      8 Onze Minister van Infrastructuur en Milieu kan bij de toepassing van het eerste lid een deel van de kosten buiten
      toepassing laten indien toepassing, gelet op het belang van de burgerluchtvaart, zal leiden tot een onbillijkheid
      van overwegende aard.

      9 De eigenaar of houder van een luchtvaartuig dient de ter bepaling van de geluidsheffing noodzakelijke gegevens
      ter beschikking van Onze Minister van Infrastructuur en Milieu te stellen overeenkomstig door hem te geven regels.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.32
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.33
      [ref3]: https://wetten.overheid.nl/BWBR0009989#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel8.31
