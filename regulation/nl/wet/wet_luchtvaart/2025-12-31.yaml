  - number: '8.32'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan een regeling vaststellen inzake het treffen van geluidwerende
      voorzieningen ten aanzien van in de regeling bepaalde woningen of andere geluidsgevoelige gebouwen voor zover die
      gebouwen vanwege het luchthavenluchtverkeer een geluidbelasting kunnen ondervinden die ligt boven de in de regeling
      vastgestelde maximale waarden.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.32
  - number: '8.33'
    text: |-
      Onze Minister van Infrastructuur en Milieu kan regels stellen ten aanzien van het verstrekken van geldelijke steun
      uit s Rijks kas aan gemeenten ter bestrijding van de kosten ten gevolge van uitvoering van de in overeenstemming
      met het luchthavenindelingbesluit gebrachte omgevingsplannen.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.33
  - number: '8.34'
    text: |-
      1 Er is een commissie regionaal overleg luchthaven Schiphol.

      2 De commissie bestaat uit een onafhankelijke voorzitter en vertegenwoordigers van:

      a. de provincies Noord-Holland, Zuid-Holland en Utrecht;

      b. gemeenten in de in onderdeel a genoemde provincies;

      c. de exploitant van de luchthaven;

      d. de verlener van luchtverkeersdienstverlening;

      e. luchtvaartmaatschappijen die geregeld van de luchthaven gebruik maken.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.34
  - number: '8.35'
    text: |-
      De commissie heeft tot taak om door overleg tussen de in artikel 8.34 bedoelde betrokkenen een gebruik van de
      luchthaven te bevorderen dat zoveel mogelijk recht doet aan de belangen van die betrokkenen.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.35
  - number: '8.36'
    text: |-
      Onze Minister van Infrastructuur en Milieu stelt nadere regels omtrent de taak en de samenstelling van
      de commissie. Daarbij wordt bepaald welke in [artikel 8.34, tweede lid][ref1], bedoelde gemeenten en
      luchtvaartmaatschappijen in de commissie vertegenwoordigd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.34
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.36
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8.34'
        hoofdstuk: '8'
        afdeling: '8.7'
  - number: '8.37'
    text: |-
      1 De voorzitter van de commissie wordt door Onze Minister van Infrastructuur en Milieu benoemd, geschorst en
      ontslagen.

      2 Elk ander lid wordt benoemd, geschorst en ontslagen door de voorzitter op voordracht van het orgaan of de
      organisatie die het lid vertegenwoordigt.

      3 De benoeming geschiedt voor ten hoogste vier jaren. Herbenoeming kan telkens voor ten hoogste vier jaren
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.37
  - number: '8.38'
    text: |-
      De commissie stelt een bestuursreglement vast. Het reglement behoeft de goedkeuring van Onze Minister van
      Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.38
  - number: '8.39'
    text: |-
      De commissie heeft een secretariaat. De samenstelling en de werkzaamheden van het secretariaat worden in het
      bestuursreglement geregeld.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.39
  - number: '8.40'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de commissie wordt in het bestuursreglement geregeld.
      De bescheiden worden na beëindiging van de werkzaamheden van de commissie opgeborgen in het archief van het
      ministerie van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.40
  - number: 8.40a
    text: |-
      1 In deze titel wordt verstaan onder:

        - *Autoriteit Consument en Markt:* de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - *gebruiker:* een luchtvaartmaatschappij, alsmede een persoon of rechtspersoon die vluchten uitvoert, niet zijnde
      een luchtvaartmaatschappij;
        - *luchthavennetwerk:* een groep luchthavens die als zodanig door de lidstaat is aangewezen en die wordt
      geëxploiteerd door een en dezelfde exploitant van de luchthaven;
        - *overige luchthaven:* een burgerluchthaven behorende tot de overige burgerluchthavens, bedoeld in
      [artikel 8.1, eerste lid, onder b][ref2], dan wel een militaire luchthaven voor zover het betreft burgermedegebruik
      door tussenkomst van een burgerexploitant;
        - *representatieve organisatie:* een bij ministeriële regeling aangewezen rechtspersoon die de belangen
      vertegenwoordigt van gebruikers.

      2 In deze titel wordt onder exploitant mede verstaan burgerexploitant.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1
