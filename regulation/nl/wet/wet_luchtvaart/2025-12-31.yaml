  - number: '1.2'
    text: |-
      1 Deze wet is:

      a. van toepassing op de luchthavens, het luchtverkeer, de luchtverkeersbeveiliging, de luchtvaartnavigatiediensten,
      de luchtvaartuigen, het vervoer en de vluchtuitvoering met luchtvaartuigen binnen het vluchtinformatiegebied
      Amsterdam, voor zover hetgeen bij of krachtens de basisverordening is bepaald niet van toepassing is;

      b. van toepassing op:

      1°. Nederlandse luchtvaartuigen, alsmede het vervoer en de vluchtuitvoering met Nederlandse luchtvaartuigen buiten
      het vluchtinformatiegebied Amsterdam;

      2°. in een buitenlands nationaliteitsregister ingeschreven luchtvaartuigen ten aanzien waarvan de Nederlandse Staat
      als staat van exploitatie geldt en een artikel 83bis-overeenkomst heeft gesloten,

      tenzij en voor zover:

        - i. hetgeen bij of krachtens de basisverordening is bepaald van toepassing is, of ii. ter zake van een Nederlands
      luchtvaartuig een artikel 83bis-overeenkomst is gesloten;

      c. met betrekking tot het bepaalde bij of krachtens [hoofdstuk 2][ref1], [3][ref2], en [4][ref3] en de
      [artikelen 5.13a][ref4], [5.14b][ref5], [11.1][ref6], [11.2][ref7], [11.2a][ref8], [11.3 tot en met 11.14][ref9]
      mede van toepassing binnen het luchtruim van Bonaire, Sint Eustatius en Saba en op het territoir van deze openbare
      lichamen;

      d. met betrekking tot het bepaalde bij of krachtens [hoofdstuk 11][ref10] van toepassing op de verleners van
      luchtvaartnavigatiediensten die bij of krachtens deze wet zijn gecertificeerd.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat, op nader in die algemene maatregel aan te geven
      categorieën van personeel of op bepaalde soorten van luchtvaartuigen, op bepaalde soorten van vervoer of op
      bepaalde vormen van vluchtuitvoering, indien toepassing van deze wet in redelijkheid niet kan worden gevergd en de
      veiligheid van het luchtverkeer niet in gevaar wordt gebracht, geheel of gedeeltelijk niet van toepassing zijn:

        - de [artikelen 2.1 tot en met 2.10][ref11] of één of meer van deze artikelen,
        - [hoofdstuk 3][ref12],
        - [hoofdstuk 4][ref13],
        - [titel 5.1][ref14], met uitzondering van de [artikelen 5.14b tot en met 5.14d][ref15], of [5.2][ref16],
        - [titel 6.5][ref17] of [titel 6.6][ref18],
        - [hoofdstuk 9][ref19], of
        - [hoofdstuk 10][ref20].

      3 Bij de toepassing van het tweede lid kunnen bij of krachtens die algemene maatregel van bestuur voorschriften en
      beperkingen worden opgenomen met betrekking tot één of meer buiten toepassing van de wet te laten onderdelen. Deze
      voorschriften en beperkingen kunnen mede betrekking hebben op de beperking van geluidshinder.


