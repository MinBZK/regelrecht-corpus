        artikel: '5.13'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5.13'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14a
    text: |-
      Indien op basis van artikel 9 bis van de luchtvaartnavigatiedienstenverordening een functioneel luchtruimblok
      is ingesteld, waarvan een gedeelte van of het gehele vluchtinformatiegebied Amsterdam deel uitmaakt, wijzen, in
      afwijking van de [artikelen 5.13][ref1], [5.13a][ref2] en [5.14][ref3], Onze Minister van Infrastructuur en Milieu
      en Onze Minister van Defensie in overeenstemming met het bevoegde gezag van de betrokken staat of staten voor dat
      bepaalde gebied een of meer verleners van luchtverkeersdiensten en verleners van meteorologische diensten voor de
      luchtvaartnavigatie aan, alsmede het luchtverkeer waaraan de bedoelde instanties luchtverkeersdiensten verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.13
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5.13a
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5.14
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel5.14a
