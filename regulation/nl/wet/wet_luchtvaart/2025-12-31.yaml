      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '4'
  - number: '10.6'
    text: |-
      1 [Titel 6.5][ref1] is niet van toepassing op internationaal vervoer van gevaarlijke stoffen met luchtvaartuigen
      waarvan de krijgsmacht of de krijgsmacht van een andere mogendheid houder is.

      2 [Titel 6.5][ref2] is, met uitzondering van [artikel 6.54][ref3], niet van toepassing op nationaal vervoer van
      ontplofbare stoffen of voorwerpen met luchtvaartuigen waarvan de krijgsmacht of de krijgsmacht van een andere
      mogendheid houder is.

      3 [Artikel 6.51, eerste lid][ref4], geldt niet voor het nationale vervoer van de bij of krachtens algemene
      maatregel van bestuur aan te wijzen gevaarlijke stoffen, niet zijnde ontplofbare stoffen of voorwerpen, behorend
      tot de operationele uitrusting of het wapensysteem van een luchtvaartuig waarvan de krijgsmacht of de krijgsmacht
      van een andere mogendheid houder is, of behorend tot de uitrusting van personen die met een dergelijk luchtvaartuig
      worden vervoerd, indien aan de bij of krachtens die algemene maatregel van bestuur terzake gestelde regels is
      voldaan.

      4 [Artikel 6.55][ref5] is niet van toepassing op het door personeel van de krijgsmacht verrichten van de in dat
      artikel bedoelde handelingen ten aanzien van het nationaal vervoer van andere gevaarlijke stoffen dan ontplofbare
      stoffen of voorwerpen, met luchtvaartuigen waarvan de krijgsmacht of de krijgsmacht van een andere mogendheid
      houder is.

      5 De[ artikelen 6.60][ref6], [6.61][ref7] en [6.61a][ref8] zijn van overeenkomstige toepassing op het
      internationaal vervoer van gevaarlijke stoffen en het nationaal vervoer van ontplofbare stoffen en voorwerpen met
      luchtvaartuigen waarvan de krijgsmacht of de krijgsmacht van een andere mogendheid houder is met dien verstande
      dat:

      a. in [artikel 6.60, eerste lid][ref9], in plaats van «als bedoeld in [artikel 6.51, eerste lid][ref10],» wordt
      gelezen «als bedoeld in [artikel 10.7, eerste en tweede lid][ref11]»;

      b. in [artikel 6.61, eerste lid][ref12], in plaats van «[artikel 6.51][ref13]» wordt gelezen
      [artikel 10.7, eerste en tweede lid][ref14].


