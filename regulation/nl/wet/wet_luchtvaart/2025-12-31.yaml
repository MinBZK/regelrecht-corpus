  - number: '8.2'
    text: Deze titel is van toepassing ten aanzien van de luchthaven Schiphol.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.2
  - number: 8.2a
    text: |-
      1 De overheid bezit ten minste een meerderheid van het economisch en juridisch belang in de exploitant van de
      luchthaven.

      2 Onze Minister van Financiën wijst bij regeling een of meerdere overheidsorganisaties aan ter voldoening van de in
      het eerste lid genoemde eis.

      3 De krachtens het tweede lid vast te stellen regeling heeft in ieder geval betrekking op de wijze waarop invulling
      wordt gegeven aan de in het eerste lid genoemde eis en de wijze waarop de overheid in gezamenlijkheid blijvend
      invulling geeft aan de continuïteit van de Mainport.

      4 Het voorstel voor de krachtens het tweede lid vast te stellen regeling wordt gedaan door Onze Minister van
      Financiën in overeenstemming met Onze Minister van Infrastructuur en Milieu en wordt niet eerder gedaan dan vier
      weken nadat het ontwerp aan de Tweede Kamer der Staten-Generaal is overgelegd.

      5 Aan de goedkeuring van de algemene vergadering van aandeelhouders van de exploitant van de luchthaven zijn
      onderworpen de besluiten van het bestuur van de exploitant van de luchthaven omtrent investeringen welke een
      bedrag vereisen gelijk aan ten minste een tiende van het bedrag van de activa volgens de geconsolideerde balans met
      toelichting volgens de laatst vastgestelde jaarrekening van de exploitant van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.2a
  - number: '8.3'
    text: |-
      De uitoefening van de bevoegdheden die voortvloeien uit deze titel is gericht op het bevorderen van een optimaal
      gebruik van de luchthaven als kwalitatief hoogwaardig luchtverkeersknooppunt met een hoge netwerkkwaliteit, met
      inachtneming van de grenzen die met het oog op de veiligheid, de geluidbelasting, de lokale luchtverontreiniging en
      de geurbelasting noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.3
  - number: '8.4'
    text: Bij algemene maatregel van bestuur wordt voor de luchthaven een luchthavenindelingbesluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.4
  - number: '8.5'
    text: |-
      1 In het luchthavenindelingbesluit worden het luchthavengebied en het beperkingengebied vastgesteld.

      2 Als luchthavengebied wordt het gebied vastgesteld dat bestemd is voor gebruik als luchthaven.

      3 Als beperkingengebied wordt het gebied vastgesteld waar in verband met de nabijheid van de luchthaven met het oog
      op de veiligheid en de geluidbelasting beperkingen noodzakelijk zijn ten aanzien van de functie of het gebruik van
      de locatie.

      4 Het luchthavengebied en het beperkingengebied overlappen elkaar niet. De gebieden kunnen bestaan uit niet
      aaneengesloten delen.

      5 De gebieden worden langs elektronische weg en met gebruikmaking van een of meer ondergronden vastgelegd. Van een
      zodanig elektronisch document wordt tevens een papieren versie gemaakt.

      6 Bij de vaststelling van het luchthavenindelingbesluit kan in ieder geval gebruik worden gemaakt van gegevens en
      onderzoeken die niet ouder zijn dan twee jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.5
  - number: '8.6'
    text: |-
      Het luchthavenindelingbesluit bevat voor het luchthavengebied regels omtrent de functie en het gebruik van de
      locatie voor zover die regels noodzakelijk zijn met het oog op het gebruik van het gebied als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.6
  - number: '8.7'
    text: |-
      1 Het luchthavenindelingbesluit bevat voor het beperkingengebied regels waarbij beperkingen zijn gesteld ten
      aanzien van de functie en het gebruik van de locatie voor zover die beperkingen noodzakelijk zijn met het oog op de
      veiligheid en de geluidbelasting in verband met de nabijheid van de luchthaven.

      2 Het besluit bevat in ieder geval regels omtrent beperking van:

      a. de functie en het gebruik van de locatie in verband met het externe-veiligheidsrisico vanwege het
      luchthavenluchtverkeer;

      b. de functie en het gebruik van de locatie in verband met de geluidbelasting vanwege het luchthavenluchtverkeer;

      c. de maximale hoogte van objecten op of boven de locatie, in verband met de veiligheid van het
      luchthavenluchtverkeer;

      d. een functie die, of van een gebruik dat, vogels aantrekt, in verband met de veiligheid van het
      luchthavenluchtverkeer.

      3 Bij de regels, bedoeld in het tweede lid, onderdelen a en b, worden in ieder geval locaties aangewezen waar
      woningen of andere in het besluit aangewezen gebouwen niet zijn toegelaten.

      4 Elk besluit, volgend op het eerste luchthavenindelingbesluit, biedt een beschermingsniveau ten aanzien van
      externe veiligheid en geluidbelasting, dat voor ieder van deze aspecten, gemiddeld op jaarbasis vastgesteld, per
      saldo gelijkwaardig is aan of beter is dan het niveau zoals dat geboden werd door het eerste besluit.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.7
  - number: '8.8'
    text: |-
      1 Bij de vaststelling van een omgevingsplan voor een gebied dat is gelegen binnen het luchthavengebied of het
      beperkingengebied, wordt het luchthavenindelingbesluit in acht genomen.

      2 Voor het gebied dat ligt binnen het luchthavengebied of beperkingengebied waarvoor geen omgevingsplan geldt
      in overeenstemming met het luchthavenindelingbesluit en voor het omgevingsplan geen toepassing is gegeven aan
      [artikel 8.9, tweede lid][ref1], kan bij de vaststelling van het luchthavenindelingbesluit toepassing worden
      gegeven aan de [artikelen 2.24][ref2] en [4.16, tweede lid, van de Omgevingswet][ref3].

      3 De gemeenteraad is verplicht binnen een jaar of een andere bij het besluit te bepalen termijn nadat het besluit
      in werking is getreden het omgevingsplan overeenkomstig het besluit vast te stellen.

      4 Indien een omgevingsplan niet in overeenstemming is met het besluit, is het college van burgemeester en
      wethouders verplicht aan degenen die inzage verlangen in het omgevingsplan, tevens inzage te verlenen in het
      besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.9
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel2.24
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel4.16
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.8
