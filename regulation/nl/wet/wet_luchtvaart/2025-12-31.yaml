  - number: '11.28'
    text: |-
      Ingeval bij of krachtens deze wet regels worden gesteld ter uitvoering van het Verdrag van Chicago, kan overtreding
      van die regels ook als strafbaar feit worden aangemerkt dan wel worden bestraft met een bestuurlijke sanctie indien
      deze regels in de Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel11.28
  - number: 11.28a
    text: |-
      1 De ingevolge [artikel 1.5][ref1] aangewezen toezichthouders, zijn, in afwijking van
      [artikel 5:15, eerste lid, van de Algemene wet bestuursrecht][ref2], ter uitvoering van de verordening
      markttoezicht in verband met de basisverordening, voor zover het gaat om het ontwerp, de productie en het in de
      handel brengen van luchtvaartuigen als bedoeld in artikel 2, eerste lid, onder a en b, van de basisverordening
      wat betreft onbemande luchtvaartuigen, en hun motoren, propellers, onderdelen en apparatuur om het luchtvaartuig
      van een afstand te bedienen, bevoegd met medeneming van de benodigde apparatuur een woning te betreden zonder
      toestemming van de bewoner ten behoeve van de uitoefening van de bevoegdheden, bedoeld in artikel 14, vierde lid,
      onderdelen a, d en e, van de verordening markttoezicht.

      2 Voor het uitoefenen van de bevoegdheid, bedoeld in het eerste lid, is een voorafgaande machtiging vereist van
      de rechter-commissaris. In het verzoek om afgifte van een machtiging worden de proportionaliteit en subsidiariteit
      van het verzoek gemotiveerd. De rechter-commissaris kan het openbaar ministerie horen alvorens te beslissen.
      [Artikel 171 van het Wetboek van Strafvordering][ref3] is van overeenkomstige toepassing.

      3 Tegen de beslissing van de rechter-commissaris, bedoeld in het tweede lid, staat voor zover het verzoek om
      een machtiging niet is toegewezen, voor Onze Minister binnen veertien dagen beroep open bij de rechtbank, sector
      strafrecht.

      4 De [artikelen 2][ref4] en [3 van de Algemene wet op het binnentreden][ref5] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1.5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel515
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel171
      [ref4]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0006763#Artikel3
