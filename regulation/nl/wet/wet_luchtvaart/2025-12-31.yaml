  - number: '2.14'
    text: |-
      1 Er is een Adviescommissie arbeidsomstandigheden boordpersoneel Nederlandse burgerluchtvaart.

      2 De Adviescommissie heeft tot taak in het belang van de veiligheid in de burgerluchtvaart Onze Minister van
      Infrastructuur en Milieu desgevraagd of uit eigen beweging van advies te dienen over de uitvoering van het
      beleid en van de regelgeving met betrekking tot de arbeidsomstandigheden van het boordpersoneel van in Nederland
      geregistreerde burgerluchtvaartuigen.

      3 De Adviescommissie bestaat uit elf leden, die door Onze Minister van Infrastructuur en Milieu worden benoemd.
      Hiervan worden vier leden benoemd op voordracht van naar het oordeel van Onze Minister van Infrastructuur en
      Milieu representatieve organisaties van leden van het boordpersoneel, vier leden op voordracht van de betrokken
      luchtvaartmaatschappijen en drie leden als onafhankelijken.

      4 Onze Minister van Infrastructuur en Milieu wijst uit de drie onafhankelijke leden de voorzitter aan.

      5 De leden worden voor een periode van vier jaren benoemd. Aftredende leden zijn terstond herbenoembaar.

      6 Onze Minister van Infrastructuur en Milieu verleent tussentijds ontslag aan een lid:

      a. wanneer deze zijn hoedanigheid verliest op grond waarvan hij is benoemd;

      b. op eigen verzoek;

      c. bij het bereiken van de zeventigjarige leeftijd;

      d. wegens ongeschiktheid voor de functie.

      7 De Adviescommissie stelt een reglement vast ter nadere regeling van haar werkzaamheden. Het reglement wordt ter
      kennisneming toegezonden aan Onze Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel2.14
  - number: '3.1'
    text: |-
      1 Het is verboden een luchtvaartuig te gebruiken, dat niet is voorzien van een geldig nationaliteits- en
      inschrijvingskenmerk en een geldig bewijs van inschrijving.

      2 Het is verboden:

      a. op een luchtvaartuig een ander dan het in het eerste lid bedoelde kenmerk aan te brengen, of

      b. een luchtvaartuig te gebruiken dan wel te doen of te laten gebruiken, dat is voorzien van een ander dan het in
      het eerste lid bedoelde kenmerk, met het oogmerk het te doen voorkomen, dat het luchtvaartuig is voorzien van een
      geldig kenmerk.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel3.1
  - number: '3.2'
    text: |-
      1 De houder van een Nederlands luchtvaartuig voorziet het luchtvaartuig van:

      a. een door Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie vastgesteld
      nationaliteitskenmerk en een voor dat luchtvaartuig vastgesteld inschrijvingskenmerk; en

      b. een bewijs van inschrijving in het register, bedoeld in [artikel 3.3][ref1].

      2 De kenmerken, bedoeld in het eerste lid, bestaan voor burgerluchtvaartuigen uit letters of cijfers of een
      combinatie van beide; zij worden op bij ministeriële regeling nader aan te geven plaats, wijze en uitvoering op het
      desbetreffende luchtvaartuig aangebracht.

      3 Voor militaire luchtvaartuigen bestaat het nationaliteitskenmerk uit een afbeelding en het inschrijvingskenmerk
      uit letters of cijfers of een combinatie van beide; zij worden op bij ministeriële regeling nader aan te geven
      plaats, wijze en uitvoering op het desbetreffende luchtvaartuig aangebracht.

      4 Onze Minister van Infrastructuur en Milieu respectievelijk Onze Minister van Defensie kan voor luchtvaartuigen,
      die naar zijn oordeel van historische waarde zijn, kenmerken toestaan, die van het eerste lid, onderdeel a,
      afwijken.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.3
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel3.2
    references:
