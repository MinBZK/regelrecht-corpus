  - number: '8.9'
    text: |-
      1 Bij de verlening van een omgevingsvergunning voor een omgevingsplanactiviteit als bedoeld in de
      [Omgevingswet][ref1] wordt het luchthavenindelingbesluit in acht genomen.

      2 Bij de vaststelling van een omgevingsplan of de verlening van een omgevingsvergunning als bedoeld in het eerste
      lid kan van het besluit worden afgeweken indien van Onze Minister van Infrastructuur en Milieu de verklaring is
      ontvangen dat hij tegen de afwijking geen bezwaar heeft.

      3 De verklaring van geen bezwaar die betrekking heeft op het luchthavengebied kan worden geweigerd met het oog op
      het gebruik van het gebied als luchthaven.

      4 De verklaring van geen bezwaar die betrekking heeft op het beperkingengebied kan worden geweigerd met het oog op
      de veiligheid en de geluidbelasting in verband met de nabijheid van de luchthaven.

      5 [Artikel 10:31, vierde lid, van de Algemene wet bestuursrecht][ref2] is niet van toepassing met betrekking tot de
      verklaring van geen bezwaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037885
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8.9
    references:
