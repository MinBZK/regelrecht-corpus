  - number: 8a.50b
    text: |-
      1 Onze Minister van Infrastructuur en Milieu kan op aanvraag van een exploitant van een luchthaven ontheffing
      verlenen van een regel die met het oog op de geluidbelasting is opgenomen in een luchthavenbesluit of
      luchthavenregeling voor een luchthaven van nationale betekenis.

      2 Gedeputeerde staten kunnen op aanvraag van een exploitant van een luchthaven ontheffing verlenen van een
      regel die met het oog op de geluidbelasting is opgenomen in een luchthavenbesluit of luchthavenregeling voor een
      luchthaven van regionale betekenis.

      3 Een ontheffing kan slechts worden verleend voor een bepaalde in de ontheffing vast te stellen termijn van ten
      hoogste een jaar.

      4 Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.

      5 Gedeputeerde staten doen zo spoedig mogelijk na de verlening van een ontheffing hiervan mededeling aan Onze
      Minister van Infrastructuur en Milieu.

      6 De exploitant maakt de beslissing omtrent een ontheffing bekend aan de gebruikers van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.50b
  - number: 8a.51
    text: |-
      1 Gedeputeerde staten kunnen voor tijdelijk en uitzonderlijk gebruik van een terrein ontheffing verlenen van het
      verbod, bedoeld in [artikel 8.1a, eerste lid][ref1], indien het terrein wordt gebruikt door een luchtvaartuig dat
      behoort tot een bij algemene maatregel van bestuur aan te wijzen categorie.

      2 Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden verbonden.

      3 Bij regeling van Onze Minister van Infrastructuur en Milieu worden regels gesteld over:

      a. het terrein;

      b. de wijze waarop het terrein wordt gebruikt;

      c. de termijn waarbinnen gedeputeerde staten een besluit nemen op de aanvraag;

      d. de wijze waarop Onze Minister van Infrastructuur en Milieu en de burgemeester van de gemeente waarin het terrein
      ligt, worden betrokken bij het verlenen van de ontheffing en bij het gebruik van het terrein.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.1a
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.51
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: 8.1a
        hoofdstuk: '8'
  - number: 8a.52
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld betreffende het gebruik van
      luchthavens.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.52
  - number: 8a.53
    text: |-
      Wanneer de aanleg, de instandhouding of het gebruik van een werk ten behoeve van de uitvoering van de militaire
      taak op een burgerluchthaven in strijd zou komen met een bepaling van of krachtens deze wet, kunnen Wij, op
      voordracht van Onze Minister van Defensie, daarvan ontheffing verlenen.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.53
  - number: 8a.53a
    text: |-
      1 De exploitant van de luchthaven Schiphol en de exploitant van een luchthaven van nationale betekenis verstrekken
      Onze Minister van Infrastructuur en Waterstaat op diens verzoek alle bij hen berustende gegevens met betrekking tot
      de exploitatie, de veiligheid, het milieu of het gebruik van de luchthaven voor zover dit noodzakelijk is voor de
      vervulling van de taken en bevoegdheden van Onze Minister van Infrastructuur en Waterstaat bij of krachtens deze
      wet.

      2 De exploitant is verplicht de in het eerste lid bedoelde gegevens op de door Onze Minister van Infrastructuur
      en Waterstaat aan te geven wijze en binnen de door laatstgenoemde te bepalen redelijke termijn te verstrekken.
      De exploitant geeft bij het verstrekken van de gevraagde informatie zo nodig aan welke informatie als
      bedrijfsvertrouwelijk moet worden aangemerkt.

      3 Onze Minister van Infrastructuur en Waterstaat gebruikt de gegevens uitsluitend voor de uitvoering van zijn taken
      en bevoegdheden bij of krachtens deze wet.

      4 Onze Minister van Infrastructuur en Waterstaat zendt binnen vijf jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van de opname van een informatieplicht voor
      luchthavenexploitanten in deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.53a
  - number: 8a.54
    text: |-
      1 Bij algemene maatregel van bestuur wordt een besluit beperkingengebied buitenlandse luchthaven vastgesteld in
      verband met de nabijheid van de navolgende buitenlandse luchthavens in de Bondsrepubliek Duitsland:

      a. de burgerluchthaven Weeze, gelegen in de gemeente Weeze;

      b. de militaire luchthaven Brüggen, gelegen in de gemeente Brüggen;

      c. de militaire luchthaven Geilenkirchen, gelegen bij de stad Geilenkirchen.

      2 Bij algemene maatregel van bestuur kan een besluit beperkingengebied buitenlandse luchthaven worden vastgesteld
      in verband met de nabijheid van een andere buitenlandse luchthaven.

      3 De voordracht voor een besluit beperkingengebied buitenlandse luchthaven wordt niet eerder gedaan dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.54
  - number: 8a.55
    text: |-
      1 Bij een besluit beperkingengebied buitenlandse luchthaven wordt het beperkingengebied vastgesteld, dat het
      Nederlands grondgebied omvat waar met het oog op het externe-veiligheidsrisico, de geluidsbelasting of de
      vliegveiligheid, vanwege de nabijheid van de desbetreffende buitenlandse luchthaven, beperkingen noodzakelijk zijn
      ten aanzien van de functie of het gebruik van de locatie.

      2 De ruimtelijke indeling en de begrenzing van het beperkingengebied voor een buitenlandse luchthaven worden
      bepaald aan de hand van:

      a. het gebruik van de luchthaven door het luchthavenluchtverkeer,

      b. de ligging van start- en landingsbanen, en

      c. de positie van navigatie- en communicatieapparatuur.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.55
  - number: 8a.56
    text: |-
      Een beperkingengebied wordt vastgesteld met behulp van een of meer kaarten waarop de ligging van het gebied is
      aangegeven. De kaarten worden vervaardigd op een schaal van ten minste 1 op 50 000. Zo nodig worden delen van de
      gebieden vastgelegd met behulp van kaarten op een schaal met een kleiner verhoudingsgetal.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.56
  - number: 8a.57
    text: |-
      1 Het besluit beperkingengebied buitenlandse luchthaven bevat in elk geval regels omtrent de functie en het gebruik
      van de locatie waaronder begrepen de maximale hoogte van objecten op of boven de locatie, in verband met:

      a. de geluidbelasting vanwege het luchthavenluchtverkeer, en

      b. de vliegveiligheid.

      2 Indien het besluit beperkingengebied buitenlandse luchthaven wordt vastgesteld in verband met de nabijheid
      van een buitenlandse burgerluchthaven, bevat dit besluit voorts regels omtrent de functie en het gebruik van
      de locatie in verband met het externe-veiligheidsrisico vanwege het luchthavenluchtverkeer. Indien het besluit
      beperkingengebied buitenlandse luchthaven wordt vastgesteld in verband met de nabijheid van een buitenlandse
      militaire luchthaven, kan het besluit dergelijke regels bevatten.

      3 Bij de regels, bedoeld in het eerste lid, onderdeel a, en het tweede lid, worden in ieder geval locaties
      aangewezen waar woningen of andere in het besluit aangewezen gebouwen niet zijn toegelaten.
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.57
  - number: 8a.58
    text: |-
      1 Met betrekking tot het besluit beperkingengebied buitenlandse luchthaven zijn de [artikelen 8.8][ref1],
      [8.10][ref2] en [8.11][ref3] van overeenkomstige toepassing, met dien verstande dat in plaats van
      «luchthavenindelingbesluit» telkens wordt gelezen: besluit beperkingengebied buitenlandse luchthaven.

      2 Voorts is [artikel 8.9, tweede en vierde lid][ref4], van overeenkomstige toepassing, met dien verstande dat
      omtrent de verklaring van geen bezwaar wordt besloten door Onze Minister van Infrastructuur en Milieu en dat
      in plaats van «het luchthavenindelingbesluit» telkens wordt gelezen: het besluit beperkingengebied buitenlandse
      luchthaven.

      3 Onze Minister van Infrastructuur en Milieu beslist omtrent de verklaring van geen bezwaar of de ontheffing,
      bedoeld in het tweede lid, indien het een militaire luchthaven betreft, in overeenstemming met Onze Minister van
      Defensie.

      4 De beslistermijn bedraagt acht weken na ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8.8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8.10
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel8.11
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel8.9
    url: https://wetten.overheid.nl/BWBR0005555/2025-12-31#Artikel8a.58
