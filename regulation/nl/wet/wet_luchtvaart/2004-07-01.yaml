  - number: 11.9.2
    text: De in het eerste lid van dit artikel strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.9
  - number: 11.9.3
    text: |-
      Handelen in strijd met krachtens deze wet gestelde regels, bedoeld in het eerste lid, onder b, vormt slechts een
      strafbaar feit voorzover dit in die regels uitdrukkelijk is bepaald.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.9
  - number: 11.10.1
    text: |-
      Met een gevangenisstraf van ten hoogste een jaar of een geldboete van ten hoogste de vierde categorie wordt
      gestraft degene, die handelt in strijd met de artikelen
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.10
  - number: 11.10.1.a
    text: 1.2a;
