---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_luchtvaart
regulatory_layer: WET
publication_date: '2024-04-02'
valid_from: '2004-07-01'
bwb_id: BWBR0005555
url: https://wetten.overheid.nl/BWBR0005555/2004-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is mede ter uitvoering van het Verdrag van Chicago (Trb.
    1973, 109), het Eurocontrol Verdrag (Trb. 1961, 62 gewijzigd Trb. 1981, 182) en de Multilaterale Overeenkomst
    betreffende "en route" heffingen (Trb. 1981, 181), nieuwe regels te stellen omtrent de bescherming van de openbare
    veiligheid bij het gebruik van het luchtruim en de bevordering van de veilige, ordelijke en vlotte afwikkeling van
    het luchtverkeer;

    dat het tevens wenselijk is om de burgerlijke luchtverkeersbeveiliging onder te brengen in een zelfstandig
    bestuursorgaan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#ArtikelAanhef
articles:
  - number: 1.1.1
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.a
    text: |-
      AOC: door Onze Minister van Verkeer en Waterstaat aan een onderneming of groep van ondernemingen afgegeven document
      waarin wordt verklaard dat de betrokken luchtvaartexploitant beschikt over beroepsbekwaamheid en organisatie om
      luchtvaartuigen veilig te exploiteren voor de in dat bewijs gespecificeerde luchtvaartactiviteiten (Air Operator's
      Certificate);
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.b
    text: |-
      Eurocontrol-organisatie: de Organisatie, ingesteld bij het op 13 december 1960 te Brussel tot stand gekomen Verdrag
      tot samenwerking in het belang van de veiligheid van de luchtvaart «Eurocontrol» (Trb. 1961, 62), zoals gewijzigd
      bij Protocol van 12 februari 1981 (Trb. 1981, 182);
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.c
    text: 'gevaarlijke stoffen:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.c.1°
    text: ontplofbare stoffen of voorwerpen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.c.2°
    text: samengeperste, vloeibaar gemaakte of onder druk opgeloste gassen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.c.3°
    text: brandbare vloeistoffen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.c.4°
    text: |-
      brandbare vaste stoffen, voor zelfontbranding vatbare stoffen en stoffen, die bij aanraking met water brandbare
      gassen ontwikkelen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.c.5°
    text: stoffen, die de verbranding bevorderen en organische peroxyden;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.c.6°
    text: giftige of infectueuze stoffen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.c.7°
    text: radioactieve stoffen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.c.8°
    text: bijtende stoffen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.c.9°
    text: |-
      andere stoffen of voorwerpen, die bij vervoer door de lucht gevaar kunnen opleveren voor de gezondheid, de
      veiligheid of het milieu;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.d
    text: 'gezagvoerder: degene, die de leiding heeft bij en verantwoordelijk is voor de veilige uitvoering van de vlucht;'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.e
    text: |-
      houder van een luchtvaartuig: degene, op wiens naam een luchtvaartuig in het register, bedoeld in
      [artikel 3.3, tweede lid][ref1], dan wel in een buitenlands register van luchtvaartuigen is ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 1.1.1.f
    text: |-
      klaring: machtiging aan de gezagvoerder van een luchtvaartuig om een vlucht aan te vangen of te vervolgen onder
      door een luchtverkeersleidingsdienst gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.g
    text: |-
      lid van het boordpersoneel: lid van het cockpitpersoneel en ieder, die aan boord van een luchtvaartuig ten behoeve
      van de inzittenden of de lading werkzaamheden verricht of heeft te verrichten, onder welke werkzaamheden mede wordt
      verstaan de voorbereidingshandelingen voorafgaande aan de vlucht;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.h
    text: |-
      lid van het cockpitpersoneel: ieder, die aan boord van een luchtvaartuig werkzaamheden verricht, welke van direct
      belang zijn voor de bediening van het luchtvaartuig tijdens de vlucht, onder welke werkzaamheden mede wordt
      verstaan de voorbereidingshandelingen voorafgaande aan de vlucht;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.i
    text: |-
      luchtvaartmaatschappij: onderneming, welke geheel of gedeeltelijk haar bedrijf maakt van het vervoer van personen,
      dieren of goederen met luchtvaartuigen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.j
    text: |-
      luchtvaartterrein: een terrein, dat is ingericht voor het opstijgen en het landen alsmede de daarmede verband
      houdende bewegingen van luchtvaartuigen op dat terrein;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.k
    text: |-
      luchtvaartuig: toestel, dat in de dampkring kan worden gehouden ten gevolge van krachten, die de lucht daarop
      uitoefent, anders dan de krachten van de lucht tegen het aardoppervlak;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.l
    text: |-
      luchtverkeer: het geheel der verplaatsingen van luchtvaartuigen in de lucht of op een luchtvaartterrein, alsmede
      het gebruik van het luchtruim door toestellen die geen luchtvaartuigen zijn;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.m
    text: |-
      luchtverkeersbeveiliging: het geheel van maatregelen gericht op de bevordering van een veilig, ordelijk en vlot
      verloop van het luchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.n
    text: |-
      luchtverkeersdienstverlening: het geven van luchtverkeersleiding, alsmede het verstrekken van advies of
      inlichtingen tijdens de vlucht en het verzorgen van alarmering;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.o
    text: |-
      luchtverkeersleiding: het regelen van het luchtverkeer door het geven van klaringen en aanwijzingen aan deelnemers
      aan het luchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.p
    text: |-
      LVNL: de organisatie voor luchtverkeersdienstverlening, bedoeld in [artikel 5.22][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.1
  - number: 1.1.1.q
    text: 'Nederlands luchtvaartuig: een in Nederland geregistreerd luchtvaartuig;'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.r
    text: |-
      opsporingsambtenaar: de ambtenaar, bedoeld in [artikel 11.3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 1.1.1.s
    text: |-
      STD: een trainingsinstrument zijnde een vluchtnabootser, een vliegtrainingsinstrument, een trainer voor vlieg- en
      navigatieprocedures of een ander trainingsinstrument (Synthetic Training Device);
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.t
    text: |-
      vlucht: de verplaatsing van het luchtvaartuig gedurende het tijdsverloop dat het in beweging komt met de bedoeling
      om op te stijgen, tot het ogenblik dat het weer tot volledige stilstand is gekomen na de landing;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.1.u
    text: |-
      vluchtinformatiegebied Amsterdam: het luchtruim boven het gebied, dat wordt begrensd door de rijksgrenzen en
      de kortste lijn op de ellipsoïde tussen de posities met de coördinaten 51°22'25" N 003°21'50" O en 51°30'00" N
      002°00'00" O, 51°30'00" N 002°00'00" O en 55°00'00" N 005°00'00" O, de loxodroom tussen 55°00'00" N, 005°00'00" O
      en 55°00'00" N 006°30'00" O en de kortste lijn op de ellipsoïde tussen de posities met de coördinaten 55°00'00" N
      006°30'00" O en 53°40'00" N, 006°30'00" O, uitgedrukt in het geografische referentiesysteem WGS 84.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.2
    text: |-
      Onder lid van het cockpitpersoneel wordt ten aanzien van onbemande luchtvaartuigen mede verstaan ieder, die
      werkzaamheden verricht, welke van direct belang zijn voor het op afstand bedienen van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.1.3
    text: |-
      Onder luchtvaartmaatschappij wordt mede verstaan de naar privaatrecht opgerichte rechtspersoon, die zich bezig
      houdt met het vervoer van personen, dieren of goederen met luchtvaartuigen tegen vergoeding.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.1
  - number: 1.2.1
    text: |-
      Deze wet is van toepassing op het luchtverkeer, de luchtverkeersbeveiliging, de luchtvaartuigen, het vervoer
      en de vluchtuitvoering met luchtvaartuigen binnen het vluchtinformatiegebied Amsterdam. Deze wet is eveneens
      van toepassing op Nederlandse luchtvaartuigen, alsmede het vervoer en de vluchtuitvoering met Nederlandse
      luchtvaartuigen buiten het vluchtinformatiegebied Amsterdam.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.2
  - number: 1.2.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat, op nader in die algemene maatregel aan te geven
      categorieën van personeel of op bepaalde soorten van luchtvaartuigen, op bepaalde soorten van vervoer of op
      bepaalde vormen van vluchtuitvoering, indien toepassing van deze wet in redelijkheid niet kan worden gevergd en de
      veiligheid van het luchtverkeer niet in gevaar wordt gebracht, geheel of gedeeltelijk niet van toepassing zijn: -
      de[ artikelen 2.1 tot en met 2.10][ref1] of één of meer van deze artikelen,
        - [hoofdstuk 3][ref2],
        - hoofdstuk 4,
        - [titel 5.1][ref3] of [5.2][ref4],
        - [titel 6.5][ref5] of [titel 6.6][ref6],
        - [hoofdstuk 9][ref7], of
        - [hoofdstuk 10][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk5
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
      [ref6]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
      [ref7]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk9
      [ref8]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk10
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
