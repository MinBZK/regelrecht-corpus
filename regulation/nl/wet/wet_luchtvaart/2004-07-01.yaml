  - number: 1.2.3
    text: |-
      Bij de toepassing van het tweede lid kunnen bij of krachtens die algemene maatregel van bestuur voorschriften en
      beperkingen worden opgenomen met betrekking tot één of meer buiten toepassing van de wet te laten onderdelen. Deze
      voorschriften en beperkingen kunnen mede betrekking hebben op de beperking van geluidshinder.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.2
  - number: 1.2a.1
    text: |-
      Het is verboden toestellen, die geen luchtvaartuig zijn, in het luchtruim te gebruiken. Onze Minister van Verkeer
      en Waterstaat respectievelijk Onze Minister van Defensie kan bij ministeriële regeling voor door hem aan te wijzen
      toestellen vrijstelling verlenen van het verbod.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.2a
  - number: 1.2a.2
    text: |-
      Aan de vrijstelling, bedoeld in het eerste lid, kunnen voorschriften of beperkingen worden verbonden. Het is
      verboden in strijd met deze voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.2a
  - number: '1.3'
    text: 'Een luchtvaartmaatschappij is verplicht er voor zorg te dragen, dat:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.3
  - number: 1.3.a
    text: |-
      de door haar geëxploiteerde luchtvaartuigen in een zodanige staat zijn, dat daarmee veilig gevlogen en vervoerd
      kan worden;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.3
  - number: 1.3.b
    text: |-
      het boordpersoneel van de door haar geëxploiteerde luchtvaartuigen over voldoende kennis, bedrevenheid en ervaring
      beschikt;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.3
  - number: 1.3.c
    text: |-
      al datgene wordt gedaan, wat in haar vermogen ligt om ernstige lichamelijke of geestelijke vermoeidheid van de
      leden van het boordpersoneel bij de bediening van luchtvaartuigen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.3
  - number: '1.4'
    text: |-
      Voor zover Onze Minister van Verkeer en Waterstaat onderscheidenlijk Onze Minister van Defensie, beslissingen
      neemt ingevolge bij of krachtens deze wet verleende bevoegdheden, die mede betrekking hebben op de militaire
      luchtvaart onderscheidenlijk de burgerluchtvaart handelt hij in overeenstemming met Onze Minister van Defensie
      onderscheidenlijk Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel1.4
  - number: 2.1.1
    text: |-
      Het is verboden een luchtvaartuig te bedienen zonder het daarvoor geldige bewijs van bevoegdheid of geldige bewijs
      van gelijkstelling.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.1
  - number: 2.1.2
    text: 'Voor het bedienen van een Nederlands burgerluchtvaartuig is het bezit vereist van hetzij:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.1
  - number: 2.1.2.a
    text: |-
      een door Onze Minister van Verkeer en Waterstaat afgegeven bewijs van bevoegdheid of bewijs van gelijkstelling,
      hetzij
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.1
  - number: 2.1.2.b
    text: |-
      een bewijs van bevoegdheid of bewijs van gelijkstelling, afgegeven door de bevoegde autoriteit van een door
      Onze Minister van Verkeer en Waterstaat op grond van [artikel 2.8][ref1] aangewezen staat of door een door hem
      aangewezen internationale organisatie. Betrokkene dient in geval van toepassing van [onderdeel ][ref2] tevens in
      het bezit te zijn van een geldige medische verklaring, bedoeld in [artikel 2.4][ref3], afgegeven door Onze Minister
      van Verkeer en Waterstaat dan wel door de bevoegde autoriteit van een door hem aangewezen staat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.3
    text: |-
      Bij algemene maatregel van bestuur kunnen andere werkzaamheden aan boord van een burgerluchtvaartuig worden
      aangewezen, die niet mogen worden verricht zonder een door Onze Minister van Verkeer en Waterstaat afgegeven bewijs
      van bevoegdheid of bewijs van gelijkstelling.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.1
  - number: 2.1.4
    text: |-
      Onze Minister van Verkeer en Waterstaat kan ontheffing verlenen van het bepaalde bij of krachtens
      [dit artikel][ref1], wanneer door bijzondere omstandigheden die regels in redelijkheid geen toepassing kunnen
      vinden en de veiligheid van het luchtverkeer met het verlenen van de ontheffing niet in gevaar wordt gebracht. Aan
      de ontheffing kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.1.5
    text: Onze Minister van Verkeer en Waterstaat trekt de door hem verleende ontheffing in, wanneer
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.1
  - number: 2.1.5.a
    text: de redenen, waarom de ontheffing is verleend, zijn komen te vervallen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.1
  - number: 2.1.5.b
    text: de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.1
  - number: 2.2.1
    text: |-
      Onze Minister van Verkeer en Waterstaat geeft op aanvraag een bewijs van bevoegdheid af, wanneer degene, die het
      bewijs van bevoegdheid heeft aangevraagd, beschikt over voldoende kennis, bedrevenheid en ervaring met betrekking
      tot het bewijs van bevoegdheid, dat hij heeft aangevraagd, daartoe voldoende onderricht heeft genoten aan een
      door Onze Minister van Verkeer en Waterstaat dan wel door de bevoegde autoriteit van een door hem aangewezen
      staat erkende, gekwalificeerde of geregistreerde opleidingsinstelling en hem een geldige medische verklaring is
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Onze Minister van Verkeer en Waterstaat geeft op aanvraag op het bewijs van bevoegdheid een of meer
      bevoegdverklaringen weer. Het eerste lid is van overeenkomstige toepassing behoudens ter zake van de medische
      verklaring.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.2
  - number: 2.2.3
    text: |-
      Bij algemene maatregel van bestuur wordt aangegeven welke bewijzen van bevoegdheid Onze Minister van Verkeer en
      Waterstaat kan afgeven en welke bevoegdverklaringen Onze Minister van Verkeer en Waterstaat daarop kan weergeven;
      in die algemene maatregel worden voor elk bewijs van bevoegdheid en voor elke algemene bevoegdverklaring de
      bevoegdheden en eventueel aan de bevoegdverklaring te verbinden beperkingen aangegeven. Bij of krachtens algemene
      maatregel van bestuur kan worden aangegeven welke bijzondere bevoegdverklaringen en voor welke termijn Onze
      Minister van Verkeer en Waterstaat op het bewijs van bevoegdheid kan weergeven en welke beperkingen daaraan kunnen
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.2
  - number: 2.2.4
    text: |-
      Bij ministeriële regeling kan Onze Minister van Verkeer en Waterstaat met betrekking tot het model en de uitvoering
      van het document, waarop een bewijs van bevoegdheid en een of meer bevoegdverklaringen worden weergegeven, eisen
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.2
  - number: 2.2.5
    text: |-
      Onze Minister van Verkeer en Waterstaat houdt van de door hem afgegeven bewijzen van bevoegdheid een register bij.
      In het belang van een goede uitvoering en handhaving van deze wet en de daarop berustende bepalingen verwerkt Onze
      Minister van Verkeer en Waterstaat in het register gegevens omtrent afgegeven bewijzen van bevoegdheid en bewijzen
      van gelijkstelling, rechterlijke uitspraken houdende ontzegging van de bevoegdheid een luchtvaartuig te bedienen en
      persoonsgegevens betreffende de gezondheid van houders van een bewijs van bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.2
  - number: 2.3.1
    text: |-
      Een bewijs van bevoegdheid wordt afgegeven voor onbepaalde tijd dan wel voor een bij algemene maatregel van bestuur
      vast te stellen termijn, welke termijn voor de verschillende bewijzen van bevoegdheid verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Indien een bewijs van bevoegdheid voor onbepaalde tijd is verleend, is dit bewijs slechts geldig indien daarop ten
      minste één geldige bevoegdverklaring is weergegeven en voor de bij algemene maatregel van bestuur vast te stellen
      termijn waarvoor die bevoegdverklaring is afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Indien een bewijs van bevoegdheid voor bepaalde tijd is verleend, verlengt Onze Minister van Verkeer en Waterstaat
      op aanvraag het bewijs van bevoegdheid, indien de houder daarvan beschikt over voldoende kennis, bedrevenheid en
      ervaring met betrekking tot dat bewijs van bevoegdheid; het bewijs van bevoegdheid wordt voor de krachtens het
      eerste lid vastgestelde termijn verlengd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.4
    text: |-
      Onze Minister van Verkeer en Waterstaat geeft op aanvraag een bevoegdverklaring af en verlengt deze, indien de
      houder daarvan beschikt over voldoende bedrevenheid en ervaring met betrekking tot die bevoegdverklaring. De
      bevoegdverklaring wordt voor de krachtens het tweede lid vastgestelde termijn verlengd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.5
    text: |-
      Bij algemene maatregel van bestuur kan worden voorgeschreven, dat de houder van een in die algemene maatregel aan
      te geven bewijs van bevoegdheid of bevoegdverklaring bij het bereiken van een in die algemene maatregel bepaalde
      leeftijd daarin aan te geven bevoegdheden:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.5.a
    text: niet meer mag uitoefenen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.5.b
    text: slechts onder in die algemene maatregel bepaalde voorwaarden mag uitoefenen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot [artikel 2.2][ref1]
      en [dit artikel][ref2]. Deze regels bevatten in ieder geval bepalingen betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.6.a
    text: de aanvraag en afgifte van bewijzen van bevoegdheid en de aanvraag, afgifte en verlenging van bevoegdverklaringen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.6.b
    text: |-
      de leeftijd, die een aanvrager ten minste moet hebben om voor een bewijs van bevoegdheid in aanmerking te kunnen
      komen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.6.c
    text: |-
      de eisen, waaraan de aanvrager van een bewijs van bevoegdheid of bevoegdverklaring of van de verlenging daarvan
      moet voldoen alsmede de wijze, waarop hij kan doen blijken, dat hij aan die eisen voldoet;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.6.d
    text: de te houden examens;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.6.e
    text: |-
      de eisen, waaraan examinatoren moeten voldoen, alsmede de eisen waaraan examinatoren moeten voldoen teneinde een
      autorisatie te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.6.f
    text: aan STD's te stellen eisen voor kwalificatie;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.6.g
    text: de vernieuwing van het document, waarop bewijzen van bevoegdheid en bevoegdverklaringen worden weergegeven;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.6.h
    text: |-
      de vergoeding, die de aanvrager is verschuldigd voor de kosten van de handelingen ten behoeve van de aanvraag
      tot afgifte van het bewijs van bevoegdheid, een bevoegdverklaring of het bewijs van gelijkstelling, de
      verlenging van een bewijs van bevoegdheid of verlenging een bevoegdverklaring, het afleggen van een theorie-
      of praktijkexamen,, de vernieuwing van het document, bedoeld in [onderdeel g][ref1], de afgifte van de
      autorisatie, bedoeld in [onderdeel e][ref2], de afgifte en verlenging van de medische verklaring, bedoeld in
      [artikel 2.2, eerste lid][ref3], en de afgifte en verlenging van de kwalificatie, bedoeld in [onderdeel f][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.7
    text: |-
      Bij het besluit van Onze Minister van Verkeer en Waterstaat, bedoeld in het zesde lid, onderdeel e, kunnen
      in aanmerking genomen worden het aantal reeds geautoriseerde examinatoren, hun specifieke deskundigheid en de
      spreiding van examinatoren over het land in relatie tot de regionale of plaatselijke behoefte.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
  - number: 2.3.8
    text: |-
      [Artikel 2.1, vierde en vijfde lid][ref1], is met betrekking tot [dit artikel][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.1
    text: |-
      Onze Minister van Verkeer en Waterstaat geeft op aanvraag de medische verklaring, bedoeld in [artikel 2.2][ref1],
      af, indien betrokkene voldoet aan de eisen van medische geschiktheid om de werkzaamheden te verrichten, waarvoor
      betrokkene een bewijs van bevoegdheid of bevoegdverklaring heeft aangevraagd of is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.2
    text: |-
      De medische verklaring wordt, al dan niet onder beperkingen, verleend voor een bij algemene maatregel van bestuur
      vast te stellen termijn. Onze Minister van Verkeer en Waterstaat verlengt op aanvraag de medische verklaring voor
      een bij algemene maatregel van bestuur vast te stellen termijn, indien de houder voldoet aan de in het eerste lid
      bedoelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
  - number: 2.4.3
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gegeven omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
  - number: 2.4.3.a
    text: de eisen van medische geschiktheid;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
  - number: 2.4.3.b
    text: de ten behoeve van de afgifte van een medische verklaring te verrichten medische keuring;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
  - number: 2.4.3.c
    text: de verplichtingen van de houder van de medische verklaring;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
  - number: 2.4.3.d
    text: de eisen waaraan een geneeskundige of geneeskundige instantie moet voldoen teneinde een autorisatie te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
  - number: 2.4.3.e
    text: |-
      de aanwijzing van instellingen die in het kader van een autorisatie als bedoeld in [onderdeel d][ref1] een
      certificaat kunnen afgeven;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.3.f
    text: de mogelijkheid van herbeoordeling;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
  - number: 2.4.3.g
    text: |-
      de vergoeding, die de aanvrager is verschuldigd voor de kosten van de handelingen ten behoeve van de aanvraag tot
      afgifte van de autorisatie, bedoeld in [onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.4.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven omtrent de beperkingen waaronder een
      medische verklaring kan worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
  - number: 2.4.5
    text: |-
      Onze Minister autoriseert geneeskundigen of geneeskundige instanties die met het verrichten van medische keuringen
      worden belast.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
  - number: 2.4.6
    text: |-
      Bij het besluit van Onze Minister van Verkeer en Waterstaat over de autorisatie kunnen in aanmerking worden genomen
      het aantal reeds geautoriseerde geneeskundigen of geneeskundige instanties, hun specialisme en de spreiding van de
      geautoriseerde geneeskundigen of geneeskundige instanties over het land in relatie tot de regionale of plaatselijke
      behoefte.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
  - number: 2.4.7
    text: |-
      De medische verklaring is ongeldig gedurende de periode dat de gezondheidstoestand van de houder zodanig is, dat
      deze niet meer in staat is de werkzaamheden, waarvoor hem een bewijs van bevoegdheid is verleend, te verrichten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.4
  - number: 2.5.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan een bewijs van bevoegdheid dan wel een daarop weergegeven
      bevoegdverklaring schorsen wanneer een ernstig vermoeden rijst, dat de houder van het bewijs van bevoegdheid:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
  - number: 2.5.1.a
    text: |-
      niet over voldoende kennis of bedrevenheid beschikt met betrekking tot dat bewijs van bevoegdheid of die
      bevoegdverklaring;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
  - number: 2.5.1.b
    text: bij het verrichten van de hem toegestane werkzaamheden de veiligheid in gevaar kan brengen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
  - number: 2.5.1.c
    text: niet in het bezit is van een geldige medische verklaring.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
  - number: 2.5.2
    text: |-
      Onze Minister van Verkeer en Waterstaat neemt het document waarop het geschorste bewijs van bevoegdheid of de
      geschorste bevoegdverklaring is weergegeven in. De houder van het betrokken bewijs van bevoegdheid is verplicht
      hieraan alle medewerking te verlenen. In geval van schorsing van een of meer bevoegdverklaringen verstrekt Onze
      Minister van Verkeer en Waterstaat een aan de schorsing aangepast document.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
  - number: 2.5.3
    text: |-
      Onze Minister van Verkeer en Waterstaat heft de schorsing op zodra de redenen, die tot de schorsing hebben geleid,
      zijn komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
  - number: 2.5.4
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
  - number: 2.5.4.a
    text: |-
      de wijze, waarop de houder van het betrokken bewijs van bevoegdheid opnieuw kan doen blijken over voldoende kennis
      of bedrevenheid met betrekking tot het geschorste bewijs van bevoegdheid of de geschorste bevoegdverklaring te
      beschikken;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
  - number: 2.5.4.b
    text: |-
      de wijze, waarop de houder van het betrokken bewijs van bevoegdheid kan doen blijken, dat hij bij het verrichten
      van de hem toegestane werkzaamheden de veiligheid niet in gevaar brengt;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
  - number: 2.5.4.c
    text: |-
      de wijze waarop de houder van een autorisatie als bedoeld in [artikel 2.4, derde lid, onderdeel d][ref1], opnieuw
      kan doen blijken aan de bij of krachtens dat onderdeel bedoelde eisen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.5
    text: |-
      Onze Minister kan een autorisatie als bedoeld in [artikel 2.4, derde lid, onderdeel d][ref1], schorsen, wanneer een
      ernstig vermoeden rijst, dat de houder van de autorisatie niet langer voldoet aan de bij of krachtens dat onderdeel
      gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.6
    text: |-
      Het eerste tot en met vierde lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.3, zesde lid, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.7
    text: |-
      Het derde lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.4, derde lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.5.8
    text: |-
      Schorsing van het bewijs van bevoegdheid betekent schorsing van op het document weergegeven bevoegdverklaringen
      voor de duur van die schorsing.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
  - number: 2.5.9
    text: |-
      Bij ministeriële regeling kan Onze Minister van Verkeer en Waterstaat regels geven met betrekking tot de procedure
      van schorsing.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.5
  - number: 2.6.1
    text: 'Onze Minister van Verkeer en Waterstaat kan een bewijs van bevoegdheid of een bevoegdverklaring intrekken:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.6
  - number: 2.6.1.a
    text: op aanvraag van de houder;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.6
  - number: 2.6.1.b
    text: wanneer het bewijs van bevoegdheid of de daarop weergegeven bevoegdverklaring ten minste drie maanden is geschorst;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.6
  - number: 2.6.1.c
    text: |-
      wanneer gedurende een periode van ten minste zes maanden van het betrokken bewijs van bevoegdheid of de daarop
      weergegeven bevoegdverklaring geen gebruik is gemaakt;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.6
  - number: 2.6.1.d
    text: |-
      wanneer bij de aanvraag of het verzoek om verlenging van het bewijs van bevoegdheid, de bevoegdverklaring of de
      medische verklaring onjuiste gegevens zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.6
  - number: 2.6.2
    text: |-
      Indien de houder van een bewijs van bevoegdheid of een of meer bevoegdverklaringen de bevoegdheid een luchtvaartuig
      te bedienen is ontzegd, dan wel zijn bewijs van bevoegdheid of een of meer bevoegdverklaringen zijn ingetrokken, is
      hij verplicht het document, waarop zijn bewijs van bevoegdheid en eventuele bevoegdverklaringen zijn weergegeven,
      onverwijld bij Onze Minister van Verkeer en Waterstaat in te leveren.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.6
  - number: 2.6.3
    text: |-
      Het eerste en tweede lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.3, zesde lid, onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.4
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.4, derde lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.5
    text: |-
      Het eerste en tweede lid is van overeenkomstige toepassing op een autorisatie als bedoeld in
      [artikel 2.3, vijfde lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.6
    text: |-
      Bij ministeriële regeling kan Onze Minister van Verkeer en Waterstaat regels geven met betrekking tot de procedure
      van intrekking.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.6
  - number: 2.7.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan op aanvraag een bewijs van gelijkstelling met een in een andere
      staat door een daar bevoegde autoriteit afgegeven bewijs van bevoegdheid afgeven. Artikel 2.2, vierde lid, is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.7
  - number: 2.7.2
    text: |-
      Het bewijs van gelijkstelling geeft niet meer bevoegdheden dan het betrokken bewijs van bevoegdheid en wordt
      slechts eenmaal afgegeven voor ten hoogste de duur van geldigheid van het betrokken bewijs van bevoegdheid doch
      niet langer dan een jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.7
  - number: 2.7.3
    text: |-
      Onze Minister van Verkeer en Waterstaat kan een bewijs van gelijkstelling intrekken wanneer de omstandigheden,
      bedoeld in [artikel 2.6, eerste lid, onder c of d][ref1], zich voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.7.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven over de voorwaarden en omstandigheden
      waaronder een bewijs van gelijkstelling wordt afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.7
  - number: '2.8'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan op grond van internationale overeenkomsten of besluiten van
      volkenrechtelijke organisaties bewijzen van bevoegdheid of bewijzen van gelijkstelling, die op grond van eisen,
      welke gelijkwaardig zijn aan de krachtens [artikel 2.3, zesde lid, onderdeel c][ref1], gestelde eisen, zijn
      afgegeven door


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.8.a
    text: de bevoegde autoriteit van een door hem bij ministeriële regeling aangewezen staat, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.8
  - number: 2.8.b
    text: |-
      een door hem bij ministeriële regeling aangewezen internationale organisatie erkennen als geldig bewijs van
      bevoegdheid of geldig bewijs van gelijkstelling. Aan de erkenning kunnen voorschriften of beperkingen worden
      verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.8
  - number: 2.9.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan een opleidingsinstelling ter verkrijging van een bewijs van bevoegdheid
      of bevoegdverklaring erkennen, kwalificeren of registreren, indien die opleidingsinstelling voldoet aan bij of
      krachtens algemene maatregel van bestuur te stellen eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.9
  - number: 2.9.2
    text: |-
      Onze Minister van Verkeer en Waterstaat kan de erkenning, kwalificatie of registratie van een opleidingsinstelling
      geheel of deels intrekken, wanneer die opleidingsinstelling niet meer voldoet aan de eisen, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.9
  - number: 2.9.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gegeven met betrekking tot de vergoeding, die
      de aanvrager is verschuldigd voor de kosten van de handelingen ten behoeve van de aanvraag tot afgifte van de
      kwalificatie en registratie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.9
  - number: 2.10.1
    text: |-
      De houder van een bewijs van bevoegdheid, dat de bevoegdheid geeft een luchtvaartuig te bedienen, en de leerling-
      vlieger dienen onder door Onze Minister van Verkeer en Waterstaat te stellen regelen een logboek bij te houden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.10
  - number: 2.10.2
    text: Het is verboden
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.10
  - number: 2.10.2.a
    text: |-
      in het logboek onjuiste gegevens of onjuiste aantekeningen op te nemen, te doen opnemen of toe te laten dat zij
      daarin worden opgenomen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.10
  - number: 2.10.2.b
    text: |-
      het logboek te beschadigen of te vernietigen, te doen beschadigen of vernietigen dan wel toe te laten, dat het
      wordt beschadigd of vernietigd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.10
  - number: '2.11'
    text: |-
      Het is de houder van een bewijs van bevoegdheid of bewijs van gelijkstelling verboden werkzaamheden, tot het
      verrichten waarvan dat bewijs de bevoegdheid geeft, te verrichten wanneer de houder daardoor in verband met zijn
      lichamelijke of geestelijke gesteldheid de veiligheid van het luchtverkeer in gevaar brengt of in gevaar kan
      brengen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.11
  - number: 2.12.1
    text: |-
      Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een luchtvaartuig te verrichten, terwijl
      hij verkeert onder zodanige invloed van een stof, waarvan hij weet of redelijkerwijze moet weten, dat het gebruik
      daarvan – al dan niet in combinatie met het gebruik van een andere stof – de vaardigheid voor het verrichten van
      die werkzaamheden kan verminderen, dat hij niet in staat moet worden geacht die werkzaamheden naar behoren te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.12
  - number: 2.12.2
    text: |-
      Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een luchtvaartuig te verrichten, indien
      hij binnen de tien daaraan voorafgaande uren alcoholhoudende drank heeft gebruikt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.12
  - number: 2.12.3
    text: |-
      Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een luchtvaartuig te verrichten na
      zodanig gebruik van alcoholhoudende drank, dat:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.12
  - number: 2.12.3.a
    text: |-
      het alcoholgehalte van zijn adem bij een onderzoek hoger blijkt te zijn dan negentig microgram (90 µg) alcohol per
      liter uitgeademde lucht, dan wel
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.12
  - number: 2.12.3.b
    text: |-
      het alcoholgehalte van zijn bloed bij een onderzoek hoger blijkt te zijn dan eenvijfde milligram (0,2 mg) alcohol
      per milliliter bloed.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.12
  - number: 2.12.4
    text: |-
      Het is een lid van het boordpersoneel verboden werkzaamheden aan boord van een luchtvaartuig te verrichten gedurende
      de tijd, waarvoor een rijverbod als bedoeld in [artikel 162, eerste lid, van de Wegenverkeerswet 1994][ref1] geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel162
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '162'
  - number: 2.12.5
    text: |-
      Het is verboden een lid van het boordpersoneel van wie men weet of redelijkerwijs moet weten, dat deze verkeert in
      een toestand, als bedoeld in [artikel 2.11 of in het eerste of derde lid van dit artikel][ref1], werkzaamheden aan
      boord van een luchtvaartuig te doen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.13'
    text: |-
      Aan de ambtenaren, die belast zijn met de handhaving van [artikel 2.12][ref1] worden uit het register, bedoeld
      in [artikel 126 van de Wegenverkeerswet 1994][ref2], op door de Dienst Wegverkeer te bepalen wijze de gegevens
      verstrekt, die zij voor de uitoefening van hun taak nodig hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel126
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '126'
  - number: 2.14.1
    text: Er is een Adviescommissie arbeidsomstandigheden boordpersoneel Nederlandse burgerluchtvaart.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.14
  - number: 2.14.2
    text: |-
      De Adviescommissie heeft tot taak in het belang van de veiligheid in de burgerluchtvaart Onze Minister van Verkeer
      en Waterstaat desgevraagd of uit eigen beweging van advies te dienen over de uitvoering van het beleid en van de
      regelgeving met betrekking tot de arbeidsomstandigheden van het boordpersoneel van in Nederland geregistreerde
      burgerluchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.14
  - number: 2.14.3
    text: |-
      De Adviescommissie bestaat uit elf leden, die door Onze Minister van Verkeer en Waterstaat worden benoemd.
      Hiervan worden vier leden benoemd op voordracht van naar het oordeel van Onze Minister van Verkeer en Waterstaat
      representatieve organisaties van leden van het boordpersoneel, vier leden op voordracht van de betrokken
      luchtvaartmaatschappijen en drie leden als onafhankelijken.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.14
  - number: 2.14.4
    text: Onze Minister van Verkeer en Waterstaat wijst uit de drie onafhankelijke leden de voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.14
  - number: 2.14.5
    text: De leden worden voor een periode van vier jaren benoemd. Aftredende leden zijn terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.14
  - number: 2.14.6
    text: 'Onze Minister van Verkeer en Waterstaat verleent tussentijds ontslag aan een lid:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.14
  - number: 2.14.6.a
    text: wanneer deze zijn hoedanigheid verliest op grond waarvan hij is benoemd;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.14
  - number: 2.14.6.b
    text: op eigen verzoek;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.14
  - number: 2.14.6.c
    text: bij het bereiken van de zeventigjarige leeftijd;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.14
  - number: 2.14.6.d
    text: wegens ongeschiktheid voor de functie.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.14
  - number: 2.14.7
    text: |-
      De Adviescommissie stelt een reglement vast ter nadere regeling van haar werkzaamheden. Het reglement wordt ter
      kennisneming toegezonden aan Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel2.14
  - number: 3.1.1
    text: |-
      Het is verboden een luchtvaartuig te gebruiken, dat niet is voorzien van een geldig nationaliteits- en
      inschrijvingskenmerk en een geldig bewijs van inschrijving.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.1
  - number: 3.1.2
    text: 'Het is verboden:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.1
  - number: 3.1.2.a
    text: op een luchtvaartuig een ander dan het in het eerste lid bedoelde kenmerk aan te brengen, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.1
  - number: 3.1.2.b
    text: |-
      een luchtvaartuig te gebruiken dan wel te doen of te laten gebruiken, dat is voorzien van een ander dan het in
      het eerste lid bedoelde kenmerk, met het oogmerk het te doen voorkomen, dat het luchtvaartuig is voorzien van een
      geldig kenmerk.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.1
  - number: 3.2.1
    text: 'De houder van een Nederlands luchtvaartuig voorziet het luchtvaartuig van:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.2
  - number: 3.2.1.a
    text: |-
      een door Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie vastgesteld
      nationaliteitskenmerk en een voor dat luchtvaartuig vastgesteld inschrijvingskenmerk; en
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.2
  - number: 3.2.1.b
    text: |-
      een bewijs van inschrijving in het register, bedoeld in [artikel 3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.2.2
    text: |-
      De kenmerken, bedoeld in het eerste lid, bestaan voor burgerluchtvaartuigen uit letters of cijfers of een
      combinatie van beide; zij worden op bij ministeriële regeling nader aan te geven plaats, wijze en uitvoering op het
      desbetreffende luchtvaartuig aangebracht.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.2
  - number: 3.2.3
    text: |-
      Voor militaire luchtvaartuigen bestaat het nationaliteitskenmerk uit een afbeelding en het inschrijvingskenmerk uit
      letters of cijfers of een combinatie van beide; zij worden op bij ministeriële regeling nader aan te geven plaats,
      wijze en uitvoering op het desbetreffende luchtvaartuig aangebracht.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.2
  - number: 3.2.4
    text: |-
      Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan voor luchtvaartuigen, die
      naar zijn oordeel van historische waarde zijn, kenmerken toestaan, die van het eerste lid, onderdeel a, afwijken.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie houdt een register bij van
      Nederlandse burgerluchtvaartuigen respectievelijk Nederlandse militaire luchtvaartuigen. Het register voor
      burgerluchtvaartuigen is openbaar.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.3
  - number: 3.3.2
    text: |-
      In het register voor burgerluchtvaartuigen worden op aanvraag op naam van de aanvrager burgerluchtvaartuigen
      ingeschreven, wanneer zowel de aanvrager als de in te schrijven burgerluchtvaartuigen voldoen aan bij algemene
      maatregel van bestuur gestelde eisen. De inschrijving geschiedt voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.3
  - number: 3.3.3
    text: |-
      In afwijking van het tweede lid kan Onze Minister van Verkeer en Waterstaat een luchtvaartuig tijdelijk
      inschrijven:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.3
  - number: 3.3.3.a
    text: |-
      indien het desbetreffende luchtvaartuig slechts voor een bepaalde termijn aan de houder ter beschikking is gesteld,
      voor ten hoogste die bepaalde termijn; of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.3
  - number: 3.3.3.b
    text: |-
      in afwachting van het voldoen aan de eisen, bedoeld in het tweede lid, voor ten hoogste zes maanden, welke termijn
      eenmaal voor ten hoogste dezelfde periode kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.3
  - number: 3.3.4
    text: In het buitenland geregistreerde burgerluchtvaartuigen worden niet in het register ingeschreven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.3
  - number: 3.3.5
    text: |-
      Bij ministeriële regeling kan Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie
      regels geven inzake de in het register op te nemen gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan op aanvraag van de houder van een burgerluchtvaartuig de inschrijving
      wijzigen, nadat de houder de nodige gegevens heeft verstrekt en het bewijs van inschrijving, bedoeld in
      [artikel 3.5][ref1], bij Onze Minister van Verkeer en Waterstaat heeft ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.2
    text: 'Onze Minister van Verkeer en Waterstaat kan een inschrijving ambtshalve wijzigen, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
  - number: 3.4.2.a
    text: onjuiste gegevens zijn verstrekt, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
  - number: 3.4.2.b
    text: de feiten die ten grondslag liggen aan de gegevens, tijdens de duur van de inschrijving wijziging hebben ondergaan.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Onze Minister van Verkeer en Waterstaat haalt op aanvraag van de houder van een burgerluchtvaartuig de
      inschrijving door, nadat de houder de nodige gegevens heeft verstrekt en het bewijs van inschrijving, bedoeld in
      [artikel 3.5][ref1], bij Onze Minister van Verkeer en Waterstaat heeft ingeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.4
    text: 'Onze Minister van Verkeer en Waterstaat kan een inschrijving ambtshalve doorhalen, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
  - number: 3.4.4.a
    text: de houder ten behoeve van de inschrijving onjuiste gegevens heeft verstrekt;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
  - number: 3.4.4.b
    text: |-
      de houder niet meer voldoet aan de eisen, bedoeld in [artikel 3.3, tweede lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.4.c
    text: |-
      gedurende langer dan een jaar het desbetreffende luchtvaartuig niet voorzien is van een geldig bewijs van
      luchtwaardigheid als bedoeld in [artikel 3.8, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.4.5
    text: |-
      Onze Minister van Verkeer en Waterstaat haalt een inschrijving ambtshalve door, wanneer het betrokken
      luchtvaartuig:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
  - number: 3.4.5.a
    text: in het buitenland is geregistreerd, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
  - number: 3.4.5.b
    text: definitief niet meer aan het luchtverkeer deelneemt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Ten bewijze van inschrijving in het register, bedoeld in [artikel 3.3][ref1], verstrekt Onze Minister van Verkeer
      en Waterstaat respectievelijk Onze Minister van Defensie met betrekking tot het ingeschreven luchtvaartuig een
      bewijs van inschrijving. Onze Minister wie het aangaat kan een inschrijvingsbewijs wijzigen. Het bewijs wordt
      verstrekt voor onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.2
    text: |-
      In geval van toepassing van [artikel 3.3, derde lid][ref1], verstrekt Onze Minister van Verkeer en Waterstaat een
      bewijs van inschrijving voor de termijn, waarvoor het betrokken luchtvaartuig is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.3
    text: 'In geval van:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.5
  - number: 3.5.3.a
    text: |-
      wijziging van de inschrijving, bedoeld in [artikel 3.4, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.3.b
    text: |-
      doorhaling van de inschrijving, bedoeld in [artikel 3.4, derde lid][ref1], kan Onze Minister van Verkeer en
      Waterstaat aan de aanvrager een tijdelijk bewijs van inschrijving ver trekken voor ten hoogste vier weken.
      Wijziging of doorhaling van de inschrijving vindt plaats na verstrijken van de termijn, waarvoor het tijdelijk
      bewijs van inschrijving is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.4
    text: |-
      In geval van ambtshalve wijziging of doorhaling van de inschrijving, bedoeld in [artikel 3.4][ref1], tweede
      respectievelijk vierde of vijfde lid, levert de houder van het bewijs van inschrijving dit bewijs terstond in bij
      Onze Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.5
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kunnen met
      betrekking tot het model en de uitvoering van het bewijs van inschrijving eisen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.5
  - number: '3.6'
    text: |-
      Voor luchtvaartuigen, die behoren tot de bedrijfsvoorraad van een natuurlijke of rechtspersoon aan wie een
      erkenning als bedoeld in [artikel 3.25][ref1] is verleend, geldt het vereiste, dat een inschrijvingskenmerk
      voor een bepaald luchtvaartuig is vastgesteld, niet, mits het betrokken luchtvaartuig een inschrijvingskenmerk
      voert, dat door Onze Minister van Verkeer en Waterstaat aan die natuurlijke of rechtspersoon met het oog op de
      bedrijfsvoorraad is opgegeven. Artikel 3.2, tweede lid, is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: '3.7'
    text: |-
      Ten aanzien van burgerluchtvaartuigen worden bij of krachtens algemene maatregel van bestuur nadere regels
      gegeven ter uitvoering van [de artikelen 3.4][ref1] en [3.5][ref2]. Deze regels bevatten in ieder geval bepalingen
      betreffende:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.7.a
    text: |-
      de procedure van aanvraag, wijziging of doorhaling van een inschrijving, alsmede de gegevens, welke bij elke
      procedure dienen te worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.7
  - number: 3.7.b
    text: de vernieuwing van het inschrijvingsbewijs, en
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.7
  - number: 3.7.c
    text: |-
      de vergoeding, die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om inschrijving
      en om wijziging of doorhaling van de inschrijving alsmede voor afgifte en vernieuwing van een bewijs van
      inschrijving.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.7
  - number: 3.8.1
    text: 'Het is verboden een vlucht uit te voeren met een luchtvaartuig, dat:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.8
  - number: 3.8.1.a
    text: niet luchtwaardig is, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.8
  - number: 3.8.1.b
    text: niet voorzien is van een geldig bewijs van luchtwaardigheid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.8
  - number: 3.8.2
    text: |-
      Voor het uitvoeren van een vlucht met een Nederlands luchtvaartuig is vereist hetzij - een door Onze Minister van
      Verkeer en Waterstaat respectievelijk Onze Minister van Defensie afgegeven bewijs van luchtwaardigheid, hetzij
        - voor burgerluchtvaartuigen, een bewijs van luchtwaardigheid als bedoeld in [artikel 3.20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.9.1
    text: |-
      Onze Minister van Verkeer en Waterstaat geeft op aanvraag met betrekking tot een type-ontwerp van een
      burgerluchtvaartuig dan wel van een voortstuwingsinrichting of propeller bestemd voor een burgerluchtvaartuig, dat
      nog niet eerder in Nederland is onderzocht en waarvoor geen typecertificaat als bedoeld in [artikel 3.20][ref1]
      is afgegeven, een type-certificaat af, indien wordt voldaan aan de bij of krachtens algemene maatregel van bestuur
      gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.9
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.9.2
    text: Een type-certificaat wordt afgegeven voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.9
  - number: 3.9.3
    text: |-
      Het type-certificaat geldt ten aanzien van alle burgerluchtvaartuigen, voortstuwingsinrichtingen respectievelijk
      propellers, die conform het onderzochte typeontwerp zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.9
  - number: 3.9.4
    text: |-
      Onze Minister van Defensie geeft met betrekking tot een type-ontwerp van een militair luchtvaartuig dan wel van
      een voortstuwingsinrichting of propeller bestemd voor een militair luchtvaartuig, een type-certificaat af, indien
      wordt voldaan aan de bij ministeriële regeling gestelde eisen. Het tweede en derde lid zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.9
  - number: 3.10.1
    text: |-
      Onze Minister van Verkeer en Waterstaat wijzigt op aanvraag een type-certificaat, wanneer voldaan wordt aan bij of
      krachtens algemene maatregel van bestuur gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.10
  - number: 3.10.2
    text: |-
      Onze Minister van Defensie wijzigt een type-certificaat, wanneer voldaan wordt aan de bij ministeriële regeling
      gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.10
  - number: 3.11.1
    text: 'Onze Minister van Verkeer en Waterstaat kan op aanvraag een aanvullend type-certificaat afgeven, indien:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.11
  - number: 3.11.1.a
    text: het een ingrijpende wijziging van het type-ontwerp betreft, waarvoor een type-certificaat is afgegeven, en
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.11
  - number: 3.11.1.b
    text: |-
      aan de bij of krachtens algemene maatregel van bestuur gestelde eisen wordt
      voldaan.[Artikel 3.9, tweede en derde lid][ref1], alsmede [artikel 3.10, eerste lid][ref2], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.11.2
    text: |-
      Onze Minister van Defensie kan een aanvullend typecertificaat afgeven. Artikel 3.9, vierde lid, alsmede
      [artikel 3.10, tweede lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.12.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan een typecertificaat of aanvullend type-certificaat schorsen, wanneer
      een ernstig vermoeden rijst, dat met betrekking tot de luchtvaartuigen dan wel voortstuwingsinrichtingen of
      propellers waarvoor dat type-certificaat of aanvullend typecertificaat is afgegeven, niet aan de bij of krachtens
      algemene maatregel van bestuur gestelde eisen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.12
  - number: 3.12.2
    text: |-
      Onze Minister van Verkeer en Waterstaat heft de schorsing op zodra de redenen van de schorsing zijn komen te
      vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.12
  - number: 3.12.3
    text: |-
      Onze Minister van Verkeer en Waterstaat kan een typecertificaat of aanvullend type-certificaat intrekken, wanneer
      de luchtvaartuigen dan wel voortstuwingsinrichtingen of propellers met betrekking waartoe dat type-certificaat is
      afgegeven, niet aan daarvoor bij of krachtens algemene maatregel van bestuur gestelde eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.12
  - number: 3.12.4
    text: |-
      Onze Minister van Defensie kan een type-certificaat of een aanvullend type-certificaat schorsen of intrekken. Het
      eerste tot en met derde lid zijn van overeenkomstige toepassing. Bij ministeriële regeling kunnen nadere regels
      worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.12
  - number: 3.13.1
    text: |-
      Onze Minister van Verkeer en Waterstaat geeft aan de houder van een burgerluchtvaartuig, dat in Nederland dan
      wel in het register van een staat of van een internationale organisatie als bedoeld in [artikel 3.20][ref1] is
      ingeschreven, op aanvraag een bewijs van luchtwaardigheid met betrekking tot dat luchtvaartuig af, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.13.1.a
    text: |-
      ten aanzien van het betrokken type-ontwerp een typecertificaat als bedoeld in [artikel 3.9, eerste lid][ref1], of
      [artikel 3.20][ref2] is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.13.1.b
    text: |-
      ten aanzien van dat luchtvaartuig geen bewijs van luchtwaardigheid is afgegeven als bedoeld in
      [artikel 3.20][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.13.1.c
    text: |-
      het betrokken luchtvaartuig voldoet aan bij of krachtens algemene maatregel van bestuur gestelde eisen; deze eisen
      kunnen voor verschillende categorieën luchtvaartuigen verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.13
  - number: 3.13.2
    text: |-
      Bij algemene maatregel van bestuur wordt aangegeven welke bewijzen van luchtwaardigheid Onze Minister van Verkeer
      en Waterstaat kan afgeven, alsmede de verplichtingen en de bevoegdheden, welke aan ieder bewijs verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.13
  - number: 3.13.3
    text: |-
      In afwijking van het eerste lid, onder a, wordt in de algemene maatregel van bestuur, bedoeld in het tweede lid,
      aangegeven in welke gevallen aan de houder van een luchtvaartuig, waarvoor geen type-certificaat is afgegeven, door
      Onze Minister van Verkeer en Waterstaat een bewijs van luchtwaardigheid kan worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.13
  - number: 3.13.4
    text: |-
      Aan een bewijs van luchtwaardigheid kunnen voorschriften of beperkingen worden verbonden. Het is verboden in strijd
      met die voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.13
  - number: 3.13.5
    text: |-
      Onze Minister van Verkeer en Waterstaat kan met betrekking tot een luchtvaartuig, dat naar zijn oordeel van
      historische waarde is en niet voldoet aan een van de eisen, bedoeld in het eerste lid, een bewijs als bedoeld
      in het tweede lid afgeven. Het betrokken luchtvaartuig dient te voldoen aan door Onze Minister van Verkeer en
      Waterstaat met betrekking tot de luchtwaardigheid van dat luchtvaartuig gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.13
  - number: 3.14.1
    text: |-
      Onze Minister van Defensie geeft met betrekking tot Nederlandse militaire luchtvaartuigen bewijzen van
      luchtwaardigheid af, indien:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.14
  - number: 3.14.1.a
    text: |-
      ten aanzien van het betrokken type-ontwerp een typecertificaat is afgegeven als bedoeld in
      [artikel 3.9, vierde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.14.1.b
    text: |-
      het betrokken luchtvaartuig voldoet aan de bij ministeriële regeling gestelde eisen; deze eisen kunnen voor
      verschillende categorieën luchtvaartuigen verschillend zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.14
  - number: 3.14.2
    text: |-
      Bij ministeriële regeling wordt aangegeven welke bewijzen van luchtwaardigheid Onze Minister van Defensie kan
      afgeven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.14
  - number: 3.14.3
    text: |-
      In afwijking van het eerste lid, onder a, wordt in de ministeriële regeling, bedoeld in het tweede lid, aangegeven
      in welke gevallen met betrekking tot een militair luchtvaartuig, waarvoor geen type-certificaat is afgegeven, door
      Onze Minister van Defensie een bewijs van luchtwaardigheid kan worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.14
  - number: 3.14.4
    text: |-
      Aan een bewijs van luchtwaardigheid kunnen voorschriften of beperkingen worden verbonden. Het is verboden in strijd
      met die voorschriften of beperkingen te handelen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.14
  - number: 3.14.5
    text: |-
      Onze Minister van Defensie kan met betrekking tot een luchtvaartuig, dat naar zijn oordeel van historische waarde
      is en niet voldoet aan een van de eisen, bedoeld in het eerste lid, een bewijs als bedoeld in het tweede lid
      afgeven. Het betrokken luchtvaartuig dient te voldoen aan door Onze Minister van Defensie met betrekking tot de
      luchtwaardigheid van dat luchtvaartuig gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.14
  - number: 3.15.1
    text: |-
      Het bewijs van luchtwaardigheid voor burgerluchtvaartuigen wordt afgegeven voor een bij algemene maatregel van
      bestuur vast te stellen termijn, welke voor de verschillende bewijzen van luchtwaardigheid verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.15
  - number: 3.15.2
    text: |-
      Op aanvraag van de houder verlengt Onze Minister van Verkeer en Waterstaat het bewijs van luchtwaardigheid voor een
      burgerluchtvaartuig, indien wordt voldaan aan de bij of krachtens [artikel 3.13][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.15
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.15.3
    text: Het bewijs van luchtwaardigheid voor militaire luchtvaartuigen wordt afgegeven voor onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.15
  - number: 3.16.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan op aanvraag van de houder een bewijs van luchtwaardigheid voor een
      burgerluchtvaartuig wijzigen, nadat hij het bewijs van luchtwaardigheid bij Onze Minister van Verkeer en Waterstaat
      daartoe heeft ingeleverd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.16
  - number: 3.16.2
    text: |-
      Onze Minister van Verkeer en Waterstaat wijzigt een bewijs van luchtwaardigheid voor een burgerluchtvaartuig
      ambtshalve, indien aan het betrokken burgerlichtvaartuig veranderingen zijn aangebracht, die de gegevens als
      vermeld op het bewijs van luchtwaardigheid beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.16
  - number: 3.16.3
    text: |-
      In de gevallen, bedoeld in het tweede lid, levert de houder van het betrokken burgerluchtvaartuig op eerste
      vordering van Onze Minister van Verkeer en Waterstaat, terstond het betrokken bewijs «van luchtwaardigheid bij Onze
      Minister» van Verkeer en Waterstaat ter wijziging in.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.16
  - number: 3.17.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan een bewijs van luchtwaardigheid voor een burgerluchtvaartuig schorsen,
      wanneer:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.17.1.a
    text: een ernstig vermoeden rijst dat het betrokken luchtvaartuig niet lichtwaardig is;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.17.1.b
    text: |-
      de houder van het betrokken luchtvaartuig dat luchtvaartuig niet overeenkomstig bij of krachtens algemene maatregel
      van bestuur gestelde eisen onderhoudt of laat onderhouden, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.17.1.c
    text: |-
      de houder van het betrokken luchtvaartuig anderszins het bij of krachtens [dit hoofdstuk][ref1] bepaalde niet
      nakomt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '3'
  - number: 3.17.2
    text: |-
      Onze Minister van Verkeer en Waterstaat heft de schorsing op zodra de redenen van de schorsing zijn komen te
      vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.17.3
    text: |-
      Onze Minister van Verkeer en Waterstaat trekt een bewijs van luchtwaardigheid voor een burgerluchtvaartuig
      ambtshalve in, wanneer:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.17.3.a
    text: het type-certificaat met betrekking tot dat luchtvaartuig is geschorst of ingetrokken;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.17.3.b
    text: ter verkrijging van het bewijs van luchtwaardigheid onjuiste gegevens zijn verstrekt, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.17.3.c
    text: het betrokken luchtvaartuig onherstelbaar is beschadigd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.17.4
    text: |-
      Onze Minister van Verkeer en Waterstaat trekt een bewijs van luchtwaardigheid, dat is afgegeven voor een
      burgerluchtvaartuig, dat in Nederland is ingevoerd en waarvoor een bewijs van inschrijving is afgegeven, in, indien
      binnen drie maanden na afgifte van het bewijs van luchtwaardigheid de houder van het betrokken luchtvaartuig op
      eerste vordering van Onze Minister niet heeft aangetoond, dat het betrokken luchtvaartuig voldoet aan de bij of
      krachtens algemene maatregel van bestuur gestelde eisen van luchtwaardigheid. Onze Minister kan de termijn van drie
      maanden eenmaal met drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.17.5
    text: |-
      Onze Minister van Verkeer en Waterstaat kan een bewijs van luchtwaardigheid voor een burgerluchtvaartuig intrekken,
      wanneer:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.17.5.a
    text: het betrokken luchtvaartuig anders dan wegens onherstelbare beschadiging niet luchtwaardig is, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.17.5.b
    text: het bewijs van luchtwaardigheid gedurende ten minste drie maanden is geschorst.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.17
  - number: 3.18.1
    text: 'Onze Minister van Defensie kan een bewijs van luchtwaardigheid voor een militair luchtvaartuig schorsen, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.18
  - number: 3.18.1.a
    text: een ernstig vermoeden rijst dat het betrokken luchtvaartuig niet luchtwaardig is, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.18
  - number: 3.18.1.b
    text: het type-certificaat met betrekking tot dat luchtvaartuig is geschorst of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.18
  - number: 3.18.2
    text: Onze Minister van Defensie heft de schorsing op zodra de redenen van de schorsing zijn komen te vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.18
  - number: 3.18.3
    text: |-
      Onze Minister van Defensie trekt een bewijs van luchtwaardigheid voor een militair luchtvaartuig in, wanneer het
      betrokken luchtvaartuig:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.18
  - number: 3.18.3.a
    text: onherstelbaar is beschadigd, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.18
  - number: 3.18.3.b
    text: definitief buiten gebruik wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.18
  - number: 3.18.4
    text: |-
      Onze Minister van Defensie kan een bewijs van luchtwaardigheid voor een militair luchtvaartuig intrekken, wanneer
      het betrokken luchtvaartuig anders dan wegens onherstelbare beschadiging niet luchtwaardig is.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.18
  - number: 3.18.5
    text: Bij ministeriële regeling kunnen nadere regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.18
  - number: 3.19.1
    text: |-
      De houder van een burgerluchtvaartuig, waarvan het typecertificaat, het aanvullend type-certificaat of het bewijs
      van luchtwaardigheid is geschorst of ingetrokken, levert op eerste vordering van Onze Minister van Verkeer en
      Waterstaat het bewijs van luchtwaardigheid van het betrokken luchtvaartuig, terstond in bij Onze Minister van
      Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.19
  - number: 3.19.2
    text: |-
      Wanneer de schorsing wordt opgeheven doet Onze Minister van Verkeer en Waterstaat het ingeleverde bewijs van
      luchtwaardigheid terstond wederom toekomen aan de houder van het betrokken luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.19
  - number: '3.20'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan op grond van een internationale overeenkomst of een besluit van een
      volkenrechtelijke organisatie type-certificaten, aanvullende type-certificaten of bewijzen van luchtwaardigheid,
      die op grond van eisen, welke gelijkwaardig zijn aan de krachtens [artikel 3.9, eerste lid][ref1],
      [artikel 3.11][ref2] respectievelijk [artikel 3.13, eerste lid][ref3], gestelde eisen, zijn afgegeven door - de
      bevoegde autoriteit van een door hem bij ministeriële regeling aangewezen staat, of
        - een door hem bij ministeriële regeling aangewezen internationale organisatie, erkennen als geldig
      typecertificaat, aanvullend type-certificaat of bewijs van luchtwaardigheid. Aan de erkenning kunnen voorschriften
      of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.20
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.21.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan op aanvraag van de houder respectievelijk Onze Minister van Defensie.
      kan ambtshalve ontheffing verlenen van de bij of krachtens deze paragraaf gegeven regels, wanneer door bijzondere
      omstandigheden die regels in redelijkheid geen toepassing kunnen vinden en de veiligheid van het luchtverkeer met
      het verlenen van de ontheffing niet in gevaar wordt gebracht. Aan de ontheffing kunnen voorschriften of beperkingen
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.21
  - number: 3.21.2
    text: 'Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie trekt de ontheffing in, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.21
  - number: 3.21.2.a
    text: de redenen, waarom de ontheffing is verleend, zijn komen te vervallen, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.21
  - number: 3.21.2.b
    text: de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.21
  - number: 3.22.1
    text: 'De houder van een Nederlands burgerluchtvaartuig, waarvoor een bewijs van luchtwaardigheid is afgegeven:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.22
  - number: 3.22.1.a
    text: ziet er op toe, dat het luchtvaartuig zijn luchtwaardigheid behoudt, en
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.22
  - number: 3.22.1.b
    text: |-
      onderhoudt of laat het lichtvaartuig onderhouden overeenkomstig bij of krachtens algemene maatregel van bestuur
      gestelde regels.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.22
  - number: 3.22.2
    text: |-
      De houder van een Nederlands burgerlichtvaartuig, waarvoor een bewijs van luchtwaardigheid is afgegeven, volgt de
      door Onze Minister van Verkeer en Waterstaat gegeven aanwijzingen met betrekking tot de luchtwaardigheid op.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.22
  - number: 3.22.3
    text: |-
      Onze Minister van Defensie ziet er op toe dat militaire luchtvaartuigen worden onderhouden overeenkomstig de
      daartoe gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.22
  - number: '3.23'
    text: |-
      Ten aanzien van burgerluchtvaartuigen worden bij of krachtens algemene maatregel van bestuur nadere regels gegeven
      met betrekking tot het in deze paragraaf bepaalde. Deze regels bevatten in ieder geval bepalingen betreffende:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.23
  - number: 3.23.a
    text: |-
      de aanvraag en de afgifte van een type-certificaat, een aanvullend type-certificaat en een bewijs van
      luchtwaardigheid;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.23
  - number: 3.23.b
    text: |-
      de wijziging en overdracht van een type-certificaat, een aanvullend type-certificaat en een bewijs van
      luchtwaardigheid en de verlenging van zulk een bewijs;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.23
  - number: 3.23.c
    text: |-
      de procedure van aanvraag, wijziging, vernieuwing, schorsing en intrekking van een type-certificaat en een
      aanvullend typecertificaat;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.23
  - number: 3.23.d
    text: |-
      de procedure van aanvraag, wijziging, verlenging, vernieuwing, schorsing en intrekking van een bewijs van
      luchtwaardigheid;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.23
  - number: 3.23.e
    text: |-
      hetgeen moet worden verstaan onder een ingrijpende wijziging als bedoeld in [artikel 3.11, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.23
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.1
  - number: 3.23.f
    text: het aan luchtvaartuigen te verrichten onderhoud;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.23
  - number: 3.23.g
    text: de vernieuwing van het bewijs van luchtwaardigheid, en
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.23
  - number: 3.23.h
    text: |-
      de vergoeding, die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om
      afgifte, wijziging of overdracht van een type-certificaat, een aanvullend type-certificaat of een bewijs van
      luchtwaardigheid of de verlenging van zulk een bewijs, dan wel van zijn aanvraag om een ontheffing.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.23
  - number: '3.24'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot het model en de uitvoering van het type-certificaat,
      het aanvullend type-certificaat of het bewijs van luchtwaardigheid voor een burgerluchtvaartuig eisen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.24
  - number: 3.25.1
    text: |-
      Onze Minister van Verkeer en Waterstaat verleent voor het verrichten van werkzaamheden verband houdende met
      de luchtwaardigheid van burgerluchtvaartuigen of onderdelen daarvan op aanvraag aan een natuurlijke persoon of
      rechtspersoon een erkenning, wanneer die een bedrijf voert, dat voldoet aan bij of krachtens algemene maatregel
      van bestuur met betrekking tot die erkenning gestelde eisen. Aan de erkenning kunnen voorschriften of beperkingen
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.25
  - number: 3.25.2
    text: |-
      Bij algemene maatregel van bestuur wordt aangegeven welke erkenningen Onze Minister van Verkeer en Waterstaat kan
      verlenen, alsmede de bevoegdheden, welke aan iedere erkenning verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.25
  - number: 3.25.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot het verrichten van
      werkzaamheden verband houdende met de luchtwaardigheid van burgerluchtvaartuigen of onderdelen daarvan door een
      natuurlijke persoon of rechtspersoon zonder erkenning als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.25
  - number: 3.25.4
    text: |-
      Het is behoudens het derde lid verboden de werkzaamheden, bedoeld in het eerste lid, te verrichten zonder een
      daartoe strekkende erkenning.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.25
  - number: 3.26.1
    text: |-
      Een erkenning wordt verleend voor een bij algemene maatregel van bestuur vast te stellen termijn dan wel voor
      onbepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.26
  - number: 3.26.2
    text: Op aanvraag van de houder kan Onze Minister van Verkeer en Waterstaat de erkenning wijzigen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.26
  - number: 3.26.3
    text: |-
      Op aanvraag van de houder verlengt Onze Minister van Verkeer en Waterstaat de erkenning, indien wordt voldaan aan
      bij of krachtens algemene maatregel van bestuur met betrekking tot die erkenning gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.26
  - number: 3.27.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan een erkenning geheel of gedeeltelijk schorsen, wanneer een ernstig
      vermoeden rijst, dat het betrokken bedrijf niet voldoet aan de eisen, gesteld krachtens [artikel 3.25][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: 3.27.2
    text: |-
      Onze Minister van Verkeer en Waterstaat heft de schorsing op zodra de redenen van de schorsing zijn komen te
      vervallen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.27
  - number: 3.27.3
    text: 'Onze Minister van Verkeer en Waterstaat kan een erkenning intrekken, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.27
  - number: 3.27.3.a
    text: de houder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.27
  - number: 3.27.3.b
    text: |-
      het betrokken bedrijf niet voldoet aan de eisen, gesteld krachtens [artikel 3.25][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.27
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: 3.27.3.c
    text: de houder krachtens de hem verleende erkenning werkzaamheden verricht, waartoe deze niet erkend is;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.27
  - number: 3.27.3.d
    text: de houder van de erkenning de daaraan verbonden voorschriften of beperkingen niet naleeft;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.27
  - number: 3.27.3.e
    text: de erkenning gedurende ten minste drie maanden is geschorst, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.27
  - number: 3.27.3.f
    text: de houder in staat van faillissement verkeert.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.27
  - number: '3.28'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan op grond van een internationale overeenkomst of een besluit van een
      volkenrechtelijke organisatie natuurlijke of rechtspersonen, die bedrijven voeren, welke op grond van eisen, welke
      gelijkwaardig zijn aan de krachtens [artikel 3.25][ref1] gestelde eisen,


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.28
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: 3.28.a
    text: erkend zijn door de bevoegde autoriteit van een door hem bij ministeriële regeling aangewezen staat, of
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.28
  - number: 3.28.b
    text: |-
      erkend zijn door een door hem bij ministeriële regeling aangewezen internationale organisatie erkennen als erkende
      bedrijven. Aan de erkenning kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.28
  - number: '3.29'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot deze paragraaf.
      Deze regels bevatten in ieder geval bepalingen betreffende:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.29
  - number: 3.29.a
    text: de aanvraag en de afgifte van een erkenning;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.29
  - number: 3.29.b
    text: de verlenging of wijziging van een erkenning;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.29
  - number: 3.29.c
    text: de procedure van aanvraag, verlenging, wijziging, schorsing of intrekking van een erkenning;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.29
  - number: 3.29.d
    text: de vernieuwing van de erkenning, en
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.29
  - number: 3.29.e
    text: |-
      de vergoeding, die de aanvrager is verschuldigd voor de kosten van de behandeling van zijn aanvraag om afgifte,
      verlenging of wijziging van een erkenning.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.29
  - number: 3.30.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan op aanvraag bewijzen van bevoegdheid afgeven voor het zonder toezicht
      verrichten van onderhoud aan burgerluchtvaartuigen. De artikelen 2.1, vierde en vijfde lid, 2.2, 2.3 en 2.5 tot en
      met 2.10 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.30
  - number: 3.30.2
    text: |-
      Behoudens [artikel 3.25][ref1] is het verboden zonder toezicht onderhoud aan burgerluchtvaartuigen te verrichten
      indien het daarvoor geldige bewijs van bevoegdheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.30
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: '3.31'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot startinrichtingen
      voor luchtvaartuigen zonder voortstuwingsinrichting.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel3.31
  - number: '5.1'
    text: |-
      Het bepaalde bij of krachtens [de artikelen 5.3][ref1] tot en met [5.9][ref2] is van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.1.a.
    text: deelnemers aan het luchtverkeer binnen het vluchtinformatiegebied Amsterdam, en
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.1
  - number: 5.1.b
    text: |-
      Nederlandse luchtvaartuigen, waar deze zich ook bevinden, tenzij dit onverenigbaar is met de daar ter plaatse
      geldende regels of de regels die in overeenstemming met internationale afspraken worden gehanteerd door de ter
      plaatse voor de luchtverkeersdienstverlening verantwoordelijke Staat.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.1
  - number: '5.2'
    text: |-
      Buiten het vluchtinformatiegebied Amsterdam houdt de gezagvoerder van een Nederlands luchtvaartuig zich aan de daar
      ter plaatse geldende regels. Indien in overeenstemming met internationale afspraken andere regels worden gehanteerd
      door de ter plaatse voor de luchtverkeersdienstverlening verantwoordelijke Staat, houdt de gezagvoerder zich aan
      deze regels.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.2
  - number: '5.3'
    text: |-
      Het is verboden op zodanige wijze aan het luchtverkeer deel te nemen dan wel luchtverkeersleiding te geven dat
      daardoor personen of zaken in gevaar worden of kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.3
  - number: '5.4'
    text: |-
      Het is verboden boven gebieden met aaneengesloten bebouwing of kunstwerken, industrie- en havengebieden daaronder
      begrepen, dan wel boven mensenmenigten, aan het luchtverkeer deel te nemen op een zodanige hoogte dat het niet
      meer mogelijk is een noodlanding uit te voeren zonder personen of zaken op het aardoppervlak in gevaar te brengen,
      tenzij zulks noodzakelijk is:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.4
  - number: 5.4.a
    text: om op te stijgen van of te landen op een luchtvaartterrein;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.4
  - number: 5.4.b
    text: voor de uitvoering van naderings- en vertrekprocedures, alsmede van luchtverkeerspatronen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.4
  - number: 5.5.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bescherming van de openbare veiligheid bij het gebruik
      van het luchtruim, ter bevordering van het veilige, ordelijke en vlotte verloop van het luchtverkeer of ter
      bescherming van personen of zaken aan boord van het luchtvaartuig of op het aardoppervlak regels worden gesteld aan
      deelnemers van het luchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.5
  - number: 5.5.2
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen voorts regels worden gesteld betreffende:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.5
  - number: 5.5.2.a
    text: de uitvoering van vluchten;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.5
  - number: 5.5.2.b
    text: de met betrekking tot de uitvoering van vluchten te verstrekken inlichtingen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.5
  - number: 5.5.2.c
    text: |-
      de communicatie tussen deelnemers aan het luchtverkeer onderling en met de instanties en organisaties belast met
      luchtverkeersdienstverlening;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.5
  - number: 5.5.2.d
    text: de in en ten behoeve van het luchtverkeer te gebruiken tekens en seinen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.5
  - number: 5.5.2.e
    text: het gebruik van het luchtruim anders dan door luchtverkeer; en
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.5
  - number: 5.5.2.f
    text: gedrag van het verkeer op een luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.5
  - number: 5.5.3
    text: |-
      In het bepaalde ingevolge [dit artikel][ref1] kan aan de LVNL de bevoegdheid worden gedelegeerd tot het geven van
      een ontheffing, vrijstelling of toestemming, mede met inachtneming van het veilige, ordelijke en vlotte verloop van
      het luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.6'
    text: Het is verboden een vlucht uit te voeren zonder dat een gezagvoerder is aangewezen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.6
  - number: 5.7.1
    text: De gezagvoerder bevindt zich aan boord van het luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.7
  - number: 5.7.2
    text: |-
      De gezagvoerder is, ongeacht of hij daadwerkelijk de stuurorganen bedient of niet, ervoor verantwoordelijk dat
      de uitvoering van de vlucht geschiedt in overeenstemming met de bij of krachtens deze wet gestelde regels. Van de
      regels bedoeld in [de eerste volzin][ref1] mag slechts worden afgeweken indien de omstandigheden dit in het belang
      van de veiligheid dringend noodzakelijk maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.7.3
    text: |-
      Het eerste lid is niet van toepassing op door Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister
      van Defensie bij ministeriële regeling aan te wijzen onbemande luchtvaartuigen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.7
  - number: '5.8'
    text: |-
      Voor de aanvang van iedere vlucht, neemt de gezagvoerder kennis van alle gegevens en inlichtingen die voor de
      uitvoering van de vlucht van belang zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.8
  - number: 5.9.1
    text: |-
      Voor de aanvang van iedere vlucht waaraan luchtverkeersleiding wordt gegeven wordt door of namens de gezagvoerder
      een vliegplan ingediend overeenkomstig de bij of krachtens de algemene maatregel van bestuur, bedoeld in
      [artikel 5.5, tweede lid, onderdeel c][ref1], gestelde regels. Het vliegplan bevat de gegevens en inlichtingen
      omtrent de voorgenomen vlucht.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.9.2
    text: |-
      Alvorens een vlucht waaraan luchtverkeersleiding wordt gegeven aan te vangen, of een gedeelte daarvan uit te voeren
      moet een desbetreffende klaring zijn gevraagd en verkregen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.9
  - number: 5.9.3
    text: |-
      De gezagvoerder komt de door de luchtverkeersleidingsdienst gegeven voorwaarden van de klaring na. Van de
      voorwaarden bedoeld in de eerste volzin mag slechts worden afgeweken indien de omstandigheden dit in het belang
      van de veiligheid dringend noodzakelijk maken. Een afwijking wordt zo spoedig mogelijk gemeld aan de betrokken
      luchtverkeersleidingsdienst.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.9
  - number: 5.10.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan bij ministeriële regeling het uitoefenen van het burgerluchtverkeer
      tijdelijk of blijvend beperken of verbieden boven Nederland of gedeelten daarvan:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.10
  - number: 5.10.1.a
    text: om redenen van openbare orde en veiligheid;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.10
  - number: 5.10.1.b
    text: |-
      om andere dringende redenen, waarbij het uitoefenen van de luchtvaart en omstandigheden of gebeurtenissen op het
      aardoppervlak elkaar kunnen beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.10
  - number: 5.10.2
    text: |-
      Onze Minister van Defensie kan bij ministeriële regeling het uitoefenen van het burgerluchtverkeer beperken of
      verbieden om reden van militaire noodzaak.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.10
  - number: 5.10.3
    text: |-
      Op voordracht van Onze Minister van Verkeer en Waterstaat, gedaan in overeenstemming met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, worden bij algemene maatregel van bestuur regels
      gesteld met betrekking tot het uitoefenen van het burgerluchtverkeer boven gebieden aangewezen overeenkomstig
      [artikel 1.2, tweede lid, onder b, van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: 5.10.4
    text: |-
      Van de regelingen krachtens het eerste en tweede lid wordt mededeling gedaan via de luchtvaartpublicaties bedoeld
      in [artikel 5.23, eerste lid, onder d][ref1], en voor zover nodig via de luchtverkeersdienstverlening aan de
      betrokken gezagvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.2
  - number: 5.10.5
    text: |-
      Het is verboden aan het luchtverkeer deel te nemen in strijd met het bepaalde krachtens het eerste, tweede en derde
      lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.10
  - number: 5.11.1
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.11
  - number: 5.11.1.a
    text: |-
      worden, met inachtneming van het type en de dichtheid van het luchtverkeer, delen van het vluchtinformatiegebied
      Amsterdam alsmede luchtvaartterreinen aangewezen waar de daarbij bepaalde vormen van luchtverkeersdienstverlening
      worden gegeven;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.11
  - number: 5.11.1.b
    text: |-
      worden in het vluchtinformatiegebied Amsterdam luchtverkeersroutes en -procedures vastgesteld, waaronder mede zijn
      begrepen naderings-, vertrek- en wachtprocedures, alsmede luchtverkeerspatronen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.11
  - number: 5.11.1.c
    text: |-
      kunnen delen van het vluchtinformatiegebied Amsterdam worden aangewezen als bijzondere luchtverkeersgebieden, waar
      daarbij gegeven voorschriften gelden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.11
  - number: 5.11.2
    text: |-
      In het bepaalde ingevolge het eerste lid kan in het belang van de bevordering van een veilig, ordelijk en vlot
      verloop van het luchtverkeer aan de LVNL de bevoegdheid worden gedelegeerd tot het geven van een ontheffing,
      vrijstelling of toestemming.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.11
  - number: 5.12.1
    text: |-
      Luchtverkeersdienstverlening wordt gegeven in het belang van de algemene luchtverkeersveiligheid en een veilig,
      ordelijk en vlot verloop van het luchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.12
  - number: 5.12.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop
      luchtverkeersdienstverlening wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.12
  - number: 5.13.1
    text: 'Binnen het vluchtinformatiegebied Amsterdam kan luchtverkeerdienstverlening worden verleend door:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.13
  - number: 5.13.1.a
    text: de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.13
  - number: 5.13.1.b
    text: Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.13
  - number: 5.13.2
    text: |-
      Onze Minister van Verkeer en Waterstaat en Onze Minister van Defensie tezamen wijzen de gebieden waarbinnen en het
      luchtverkeer waaraan de in het eerste lid genoemde instanties luchtverkeersdienstverlening geven, aan.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.13
  - number: 5.14.1
    text: |-
      In afwijking van het bepaalde in [artikel 5.13, eerste lid][ref1], kunnen Onze Minister van Verkeer en Waterstaat
      en Onze Minister van Defensie:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14.1.a
    text: |-
      met de Eurocontrol-organisatie overeenkomen dat deze, binnen bepaalde delen van het vluchtinformatiegebied
      Amsterdam of aan bepaald luchtverkeer, luchtverkeersdienstverlening geeft op voorwaarde dat daarbij vastgelegd
      wordt dat het bepaalde bij of krachtens [de artikelen 5.12][ref1], [5.15][ref2], [5.16][ref3] en [5.17a][ref4]
      wordt nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.14.1.b
    text: |-
      delen van het vluchtinformatiegebied Amsterdam aanwijzen waarbinnen, na overleg met de bevoegde autoriteiten van
      een aangrenzende Staat, luchtverkeersdienstverlening wordt gegeven door een instantie van die Staat;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.14
  - number: 5.14.2
    text: |-
      Onze Minister van Verkeer en Waterstaat kan de LVNL belasten met het geven van luchtverkeersdienstverlening in
      delen van een aangrenzend vluchtinformatiegebied, na overleg met de aldaar bevoegde autoriteiten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.14
  - number: '5.15'
    text: |-
      De instanties belast met luchtverkeersdienstverlening coördineren de uitvoering van deze taken met de instanties
      belast met de luchtverkeersdienstverlening binnen hetzelfde gebied of in aangrenzende gebieden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.15
  - number: 5.16.1
    text: |-
      Het is verboden luchtverkeersdienstverlening te geven zonder een daartoe door Onze Minister van Verkeer en
      Waterstaat afgegeven bewijs van bevoegdheid of bewijs van gelijkstelling en zonder daartoe verkregen opdracht van
      een in [artikel 5.13][ref1] of 5.14 aangewezen instantie. De artikelen 2.1, vierde en vijfde lid, en 2.2 tot en met
      2.9 zijn van overeenkomstige toepassing, met dien verstande, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.16.1.a
    text: het bewijs van bevoegdheid geldig is voor de duur van de medische verklaring;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.16
  - number: 5.16.1.b
    text: |-
      de zinsnede in [artikel 2.2, eerste lid][ref1], «aan een door Onze Minister van Verkeer en Waterstaat dan
      wel door de bevoegde autoriteit van een door hem aangewezen staat erkende, gekwalificeerde of geregistreerde
      opleidingsinstelling» niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.16.1.c
    text: |-
      in artikel 2.2, vierde lid, in plaats van «het document waarop het bewijs van bevoegdheid en de bevoegdverklaringen
      worden weergegeven» wordt gelezen: het model en de uitvoering van het bewijs van bevoegdheid, en
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.16
  - number: 5.16.1.d
    text: 'artikel 2.3, vijfde lid, onderdeel f, wordt vervangen door: de vernieuwing van een bewijs van bevoegdheid.'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.16
  - number: 5.16.2
    text: |-
      In afwijking van [artikel 2.3, zesde lid, onderdeel e][ref1], stelt de LVB-organisatie de regels met betrekking
      tot de kennis, de bedrevenheid en de ervaring op, waaraan degene, die luchtverkeersdienstverlening geeft, dient te
      voldoen om zijn bewijs van bevoegdheid te behouden. De regels behoeven de goedkeuring van Onze Minister van Verkeer
      en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.16.3
    text: |-
      Bij algemene maatregel van bestuur kunnen onderdelen van luchtverkeersdienstverlening aangewezen worden, waarvoor
      geen bewijs van bevoegdheid vereist is.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.16
  - number: 5.17.1
    text: |-
      Het is verboden een grondstation of een mobiel station in de luchtvaartmobiele band, waarvoor een machtiging is
      vereist als bedoeld in artikel 17 van de Wet op de Telecommunicatievoorzieningen, te bedienen, zonder een daartoe
      door Onze Minister van Verkeer en Waterstaat afgegeven bewijs van bevoegdheid of bewijs van gelijkstelling. De
      artikelen 2.1, vierde en vijfde lid, en 2.2 tot en met 2.9 zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.17
  - number: 5.17.2
    text: |-
      Het eerste lid is onverminderd [artikel 1.2, eerste lid][ref1], eveneens van toepassing op het continentaal plat,
      bedoeld in [artikel 1 van de Mijnbouwwet][ref2], voor zover dat buiten het vluchtinformatiegebied Amsterdam ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel1
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.17
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '1'
  - number: 5.17a.1
    text: |-
      Het is verboden luchtverkeersdienstverlening te geven dan wel een grondstation of een mobiel station als bedoeld in
      [artikel 5.17][ref1] te bedienen, terwijl degene, die luchtverkeersdienstverlening geeft dan wel een grondstation
      of een mobiel station bedient, verkeert onder zodanige invloed van een stof, waarvan hij weet of redelijkerwijze
      moet weten, dat het gebruik daarvan – al dan niet in combinatie met het gebruik van een andere stof – de
      vaardigheid voor het geven van luchtverkeersdienstverlening of het bedienen van een grondstation kan verminderen,
      dat hij niet in staat moet worden geacht zulks naar behoren te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.17a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.17a.2
    text: |-
      [De artikelen 2.12, derde, vierde en vijfde lid][ref1], en [2.13][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.17a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: '5.18'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter bevordering van een veilige, ordelijke en
      vlotte afwikkeling van het luchtverkeer regels worden gesteld betreffende de prioriteitstelling bij de
      luchtverkeersdienstverlening.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.18
  - number: '5.19'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de beheerder van een burgerluchtvaartterrein
      met inachtneming van de daarbij te stellen regels na overleg met de gebruikers en de betrokken
      luchtverkeersleidingsinstanties, de volgorde van het gebruik van het luchtvaartterrein vaststelt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.19
  - number: 5.20.1
    text: |-
      De exploitant van een luchtvaartuig in de zin van artikel 9 en 10 van de op 12 februari 1981 te Brussel gesloten
      Multilaterale Overeenkomst betreffende en route-heffingen (*Trb.* 1981, 181) is een vergoeding verschuldigd voor
      de bestrijding van de kosten van de luchtverkeersbeveiliging van het "en route" luchtverkeer, als bedoeld in deze
      Overeenkomst, binnen het vluchtinformatiegebied Amsterdam.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.20
  - number: 5.20.2
    text: |-
      De Eurocontrol Organisatie int de in het eerste lid van dit artikel bedoelde vergoeding en draagt het geïnde bedrag
      af aan de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.20
  - number: 5.20.3
    text: |-
      De Eurocontrol-organisatie kan rechtsvorderingen tot inning van de vergoedingen bedoeld in het eerste lid van dit
      artikel en van andere vergoedingen overeenkomstig de in het eerste lid van dit artikel bedoelde Overeenkomst in
      Nederland uitsluitend aanhangig maken bij de rechtbank te Amsterdam.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.20
  - number: 5.20.4
    text: 'Bij algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.20
  - number: 5.20.4.a
    text: |-
      de wijze van berekening van de vergoedingen zomede de aard van de betaalmiddelen, met inachtneming van de door de
      Eurocontrol-organisatie ter zake vastgestelde regels;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.20
  - number: 5.20.4.b
    text: |-
      de termijn, waarbinnen de vergoeding moet worden voldaan met dien verstande dat deze termijn gelijk is aan een door
      de Eurocontrol-organisatie vastgestelde termijn;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.20
  - number: 5.20.4.c
    text: de wijze van bekendmaking van de hoogte van de vergoedingen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.20
  - number: 5.20.5
    text: |-
      Bij algemene maatregel van bestuur kan geheel of gedeeltelijk vrijstelling van betaling der vergoeding worden
      verleend voor bepaalde vormen van luchtvaart en voor bepaalde soorten van luchtvaartuigen, met inachtneming van de
      door de Eurocontrol-organisatie ter zake vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.20
  - number: 5.21.1
    text: |-
      De natuurlijke persoon of rechtspersoon die een luchtvaartuig te zijner beschikking heeft en [dit onder][ref1]
      zijn verantwoordelijkheid laat deelnemen aan het luchtverkeer, en daarbij gebruik maakt van een luchtverkeersdienst
      verstrekt door een in [artikel 5.13][ref2] of 5.14 bedoelde instantie, is aan deze instantie een vergoeding
      verschuldigd ter dekking van de kosten van de luchtverkeersbeveiliging, anders dan bedoeld in [artikel 5.20][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.21.2
    text: |-
      De eigenaar van het luchtvaartuig, bedoeld in het eerste lid, is hoofdelijk aansprakelijk voor de vergoeding tenzij
      hij op eerste vordering de natuurlijk persoon of rechtspersoon aanwijst die het luchtvaartuig te zijner beschikking
      heeft en [dit onder][ref1] zijn verantwoordelijkheid laat deelnemen aan het luchtverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.21.3
    text: |-
      De hoogte van de vergoeding wordt vastgesteld door het bestuur, onder goedkeuring door Onze Minister van Verkeer en
      Waterstaat, onderscheidenlijk Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.21
  - number: 5.21.4
    text: |-
      Bij algemene maatregel van bestuur worden de elementen die de basis vormen voor de berekening van de vergoeding van
      de kosten vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.21
  - number: 5.21.5
    text: Van de hoogte van de vergoedingen wordt mededeling gedaan in de luchtvaartpublicaties.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.21
  - number: 5.21.6
    text: |-
      Het op grond van [het eerste lid van dit artikel][ref1], ten behoeve van de LVNL, geïnde bedrag wordt afgedragen
      aan de LVNL.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.21
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: '5.22'
    text: Er is een organisatie voor luchtverkeersdienstverlening. Hij heeft rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.22
  - number: 5.23.1
    text: |-
      De LVNL is, ter bevordering van een zo groot mogelijke veiligheid van het luchtverkeer in het
      vluchtinformatiegebied Amsterdam, belast met de volgende taken:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.23
  - number: 5.23.1.a
    text: |-
      het geven van luchtverkeersdienstverlening overeenkomstig het bepaalde in [artikel 5.13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 5.23.1.b
    text: |-
      het definiëren, verwerven, installeren, beheren en instandhouden van technische installaties en systemen ten
      behoeve van luchtverkeersbeveiliging;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.23
  - number: 5.23.1.c
    text: het verstrekken van luchtvaartinlichtingen en het uitgeven van luchtvaartpublicaties en luchtvaartkaarten;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.23
  - number: 5.23.1.d
    text: het verzorgen of doen verzorgen van opleidingen ten behoeve van luchtverkeersbeveiliging;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.23
  - number: 5.23.1.e
    text: |-
      het doen van voorstellen aan Onze Minister van Verkeer en Waterstaat betreffende het tarief van de heffingen
      bedoeld in [de artikelen 5.20][ref1] en [5.21][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.23
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.23.1.f
    text: |-
      het adviseren van Onze Minister van Verkeer en Waterstaat alsmede Onze Minister van Defensie betreffende
      aangelegenheden op het gebied van de luchtverkeersbeveiliging;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.23
  - number: 5.23.1.h
    text: het verrichten van andere bij of krachtens deze wet opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.23
  - number: 5.23.2
    text: |-
      De LVNL kan, tegen vergoeding van kosten, diensten voor anderen dan Onze Minister van Verkeer en Waterstaat en Onze
      Minister van Defensie verrichten op het gebied van en verband houdende met taken bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.23
  - number: 5.23.3
    text: |-
      De LVNL kan, onverminderd zijn verantwoordelijkheid voor de uitvoering van de aan hem opgedragen taken,
      werkzaamheden met een ondersteunend karakter laten verrichten door derden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.23
  - number: 5.23.4
    text: |-
      De LVNL is verplicht zijn taken te verrichten overeenkomstig het bepaalde in deze wet en het bepaalde in Nederland
      bindende verdragen en besluiten van volkenrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.23
  - number: '5.24'
    text: De LVNL heeft een bestuur en een raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.24
  - number: 5.25.1
    text: |-
      Het bestuur bestaat uit ten hoogste drie leden. De raad van toezicht stelt het aantal leden en hun onderlinge
      taakverdeling vast.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.25
  - number: 5.25.2
    text: De hoedanigheid van lid van het bestuur is onverenigbaar met het lidmaatschap van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.25
  - number: 5.25.3
    text: |-
      Onze Minister van Verkeer en Waterstaat benoemt, schorst en ontslaat de leden van het bestuur op voordracht van de
      raad van toezicht. De raad van toezicht besluit terzake van de voordracht met een meerderheid van het aantal leden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.25
  - number: 5.25.4
    text: |-
      De leden van het bestuur worden benoemd voor een periode van ten hoogste vijf jaren. Bij afloop van deze termijn
      kunnen zij worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.25
  - number: 5.26.1
    text: Het bestuur is belast met de dagelijkse leiding van de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.26
  - number: 5.26.2
    text: |-
      Alle bevoegdheden van de LVNL welke niet bij of krachtens deze wet aan de raad van toezicht zijn opgedragen, komen
      toe aan het bestuur.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.26
  - number: 5.26.3
    text: |-
      Het bestuur verstrekt de raad van toezicht tijdig de voor de uitoefening van diens taak benodigde inlichtingen en
      andere gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.26
  - number: 5.27.1
    text: Het bestuur vertegenwoordigt de LVNL in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.27
  - number: 5.27.2
    text: |-
      Het bestuur kan onder zijn verantwoordelijkheid de vertegenwoordiging, bedoeld in het eerste lid, opdragen aan een
      of meer bestuursleden of andere personen. Het kan bepalen dat deze vertegenwoordiging uitsluitend betrekking heeft
      op bepaalde onderdelen van de taak van de LVNL dan wel op bepaalde aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.27
  - number: '5.28'
    text: |-
      Ingeval van schorsing of ontstentenis van een lid van het bestuur voorziet de raad van toezicht in de waarneming
      van zijn functie.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.28
  - number: '5.29'
    text: |-
      Het bestuur legt jaarlijks, en voorts tussentijds indien hiertoe naar het oordeel van de raad van toezicht
      bijzondere aanleiding bestaat, aan de raad van toezicht verantwoording af over het door hem gevoerde beleid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.29
  - number: '5.30'
    text: |-
      De raad van toezicht bestaat uit zes leden, waaronder de voorzitter, alsmede een waarnemer, die de Minister van
      Verkeer en Waterstaat in de raad van toezicht vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.30
  - number: 5.31.1
    text: |-
      De leden van de raad van toezicht worden zonder last of ruggespraak benoemd voor een tijdvak van vier jaren en
      zijn eenmaal voor een tijdvak van vier jaren herbenoembaar. Hun kan tussentijds op eigen verzoek, dan wel om
      zwaarwichtige redenen ontslag worden verleend.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.31
  - number: 5.31.2
    text: |-
      De waarnemer in de raad van toezicht wordt aangewezen voor een tijdvak van vier jaren en kan eenmaal voor een
      tijdvak van vier jaar opnieuw worden aangewezen. De aanwijzing kan tussentijds op eigen verzoek, dan wel om
      zwaarwichtige redenen worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.31
  - number: 5.31.3
    text: 'Onze Minister van Verkeer en Waterstaat benoemt, schorst en ontslaat de leden, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.31
  - number: 5.31.3.a
    text: een lid wordt benoemd op voordracht van Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.31
  - number: 5.31.3.b
    text: |-
      twee leden worden benoemd op voordracht van de raad van toezicht uit verschillende in Nederland werkzame
      luchtvaartmaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.31
  - number: 5.31.3.c
    text: |-
      een lid wordt benoemd op voordracht van de raad van toezicht uit de kring van de exploitanten van Nederlandse
      luchtvaartterreinen; en
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.31
  - number: 5.31.3.d
    text: |-
      een lid, tevens voorzitter, wordt benoemd op voordracht van de raad van toezicht. Omtrent de voordracht besluiten
      de leden van de raad van toezicht met gewone meerderheid, met dien verstande dat de voorzitter niet deelneemt aan
      de vaststelling van de voordracht.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.31
  - number: 5.31.4
    text: |-
      Zolang in een vacature in de raad van toezicht niet is voorzien, vormen de overblijvende leden de raad van
      toezicht, met de bevoegdheid van de volledige raad.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.31
  - number: 5.32.1
    text: De raad van toezicht ziet toe op de werkzaamheden van het bestuur, en staat dit met raad terzijde.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
  - number: 5.32.2
    text: |-
      Bij de vervulling van hun taak nemen de leden van de raad van toezicht tot richtsnoer de verwezenlijking van de
      taakstelling en het belang van de LVNL waaronder de continuïteit van zijn bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
  - number: 5.32.3
    text: |-
      Besluiten van het bestuur betreffende de volgende onderwerpen behoeven voorafgaande instemming van de raad van
      toezicht:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
  - number: 5.32.3.a
    text: |-
      de reglementen bedoeld in [de artikelen 5.34][ref1], [5.36][ref2], [5.37][ref3] en [5.39][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.4
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.5
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.6
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.7
  - number: 5.32.3.b
    text: |-
      het voorstel aan Onze Minister van Verkeer en Waterstaat terzake van de tarieven bedoeld in
      [de artikelen 5.20][ref1] en [5.21][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.32.3.c
    text: investeringen die een door de raad van toezicht vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
  - number: 5.32.3.d
    text: de financiële begroting, en het financiële meerjarenbeleidsplan;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
  - number: 5.32.3.e
    text: het jaarverslag en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
  - number: 5.32.3.f
    text: het aangaan of garanderen van geldleningen die een door de raad van toezicht vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
  - number: 5.32.3.g
    text: de bij of krachtens de wet aan Onze Minister van Verkeer en Waterstaat uit te brengen rapportages.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
  - number: 5.32.4
    text: |-
      De raad van toezicht kan geen rechtsgeldige besluiten nemen indien niet tenminste tweederde van het aantal leden
      ter vergadering aanwezig is.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
  - number: 5.32.5
    text: De raad van toezicht stelt bij reglement zijn werkwijze vast.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.32
  - number: 5.33.1
    text: De raad van toezicht heeft een eigen secretariaat; de kosten daarvan komen ten laste van de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.33
  - number: 5.33.2
    text: De raad van toezicht kan zijn leden, ten laste van de LVNL, een vergoeding toekennen voor hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.33
  - number: 5.33.3
    text: |-
      De leden van de raad van toezicht hebben aanspraak op vergoeding van de door hen in de uitoefening van hun functie
      gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.33
  - number: '5.34'
    text: |-
      Het bestuur stelt bij reglement de hoofdlijnen vast van de inrichting van de LVNL en van de wijze van
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.34
  - number: 5.34a.1
    text: |-
      De LVNL handelt in overeenstemming met de door Onze Minister van Verkeer en Waterstaat gestelde regels inzake
      kwaliteits- en veiligheidszorg.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.34a
  - number: 5.34a.2
    text: |-
      In de in het eerste lid bedoelde regels worden in elk geval bepalingen opgenomen met betrekking tot kwaliteit,
      veiligheid en verificatie.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.34a
  - number: '5.35'
    text: |-
      De bedrijfsvoering van de LVNL geschiedt zoveel mogelijk overeenkomstig die, welke algemeen gebruikelijk is bij het
      particuliere bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.35
  - number: '5.36'
    text: |-
      Het bestuur van de LVNL voert op bij reglement vast te stellen wijze overleg met gebruikers van door de organisatie
      geleverde diensten of met hun vertegenwoordigers omtrent aangelegenheden terzake waarvan naar zijn oordeel overleg
      dienstig is, alsmede omtrent aangelegenheden terzake waarvan de deelnemers aan het geïnstitutionaliseerde overleg
      het bestuur te kennen hebben gegeven overleg te willen voeren.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.36
  - number: 5.37.1
    text: |-
      Het personeel van de LVNL, de leden van het bestuur daaronder begrepen, is ambtenaar in de zin van de
      [Ambtenarenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001947
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
    references:
      - id: ref1
        bwb_id: BWBR0001947
  - number: 5.37.2
    text: Het bestuur stelt bij reglement de regeling van de rechtstoestand van het personeel vast.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3
    text: |-
      Onverminderd hetgeen reeds bij of krachtens de wet is geregeld, geeft het reglement bedoeld in het tweede lid van
      dit artikel in ieder geval voorschriften betreffende de volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.a
    text: aanstelling;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.b
    text: schorsing;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.c
    text: ontslag;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.d
    text: het onderzoek naar de geschiktheid en de bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.e
    text: bezoldiging;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.f
    text: wachtgeld;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.g
    text: diensttijden;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.h
    text: verlof en vakantie;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.i
    text: voorzieningen in verband met ziekte;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.j
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.k
    text: woon-, verblijfs- en bereikbaarheidsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.l
    text: medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.m
    text: overige rechten en verplichtingen van het personeel;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.n
    text: disciplinaire straffen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.o
    text: |-
      de wijze waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt gepleegd
      over aangelegenheden van algemeen belang voor de rechtstoestand en de bezoldiging van het personeel van de LVNL;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.3.p
    text: een geschillenregeling met betrekking tot de onder *l* en *o* genoemde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
  - number: 5.37.4
    text: |-
      De bepalingen van [artikel 126 van de Ambtenarenwet][ref1] zijn van overeenkomstige toepassing op de totstandkoming
      van het in het tweede lid bedoelde reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel126
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.37
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '126'
  - number: '5.38'
    text: 'De geldmiddelen van de LVNL bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.38
  - number: 5.38.a
    text: |-
      de opbrengst van de in [artikel 5.20][ref1] en 5.21 bedoelde vergoedingen;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.38
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.38.b
    text: |-
      uit compensatie, indien en voorzover verleend door het Rijk, voor tekorten ontstaan door de bij de in
      [artikel 5.20, vijfde lid][ref1] van deze wet bedoelde algemene maatregel van bestuur verleende vrijstelling van
      de heffingenplicht voor vluchten en voor de exploitatietekorten op de regionale velden die ontstaan indien Onze
      Minister van Verkeer en Waterstaat tarieven goedkeurt op een lager dan kostendekkend niveau;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.38
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.38.c
    text: |-
      de opbrengst van de vergoedingen voor verleende diensten waarvan de kosten niet reeds de basis vormen voor de
      vergoedingen bedoeld in [de artikelen 5.20][ref1] en [5.21][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.38
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.2
  - number: 5.38.d
    text: andere baten hoe ook genoemd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.38
  - number: '5.39'
    text: |-
      Het bestuur stelt bij reglement de werkwijze vast voor het financiële beheer en de administratieve organisatie van
      de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.39
  - number: 5.40.1
    text: De begroting van de LVNL bevat een raming van alle baten en lasten, de investeringsuitgaven en financiering.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.40
  - number: 5.40.2
    text: 'De begroting bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.40
  - number: 5.40.2.a
    text: de jaarlijkse financiële begroting, bestaande uit een exploitatiebegroting en een kapitaalsbegroting;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.40
  - number: 5.40.2.b
    text: het financiële meerjarenbeleidsplan.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.40
  - number: 5.40.3
    text: |-
      Tot de lasten van de LVNL worden gerekend de door het Rijk geaccordeerde kosten van de Eurocontrol-organisatie
      alsmede de kosten voortvloeiende uit de taken van Onze Minister van Verkeer en Waterstaat op het gebied van de
      luchtverkeersbeveiliging.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.40
  - number: 5.41.1
    text: Het bestuur stelt jaarlijks een jaarverslag en een jaarrekening vast.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.41
  - number: 5.41.2
    text: Het boekjaar van de LVNL valt samen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.41
  - number: 5.41.3
    text: |-
      Het bestuur zendt jaarlijks voor 1 mei van het jaar volgende op het jaar waarop het betrekking heeft een
      jaaroverzicht aan Onze Minister van Verkeer en Waterstaat. Het jaaroverzicht omvat:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.41
  - number: 5.41.3.a
    text: het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.41
  - number: 5.41.3.b
    text: de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.41
  - number: 5.41.3.c
    text: een opgave over de toepassing van de arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.41
  - number: 5.41.3.d
    text: de verklaring van de door de raad van toezicht aangewezen externe registeraccountant; en
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.41
  - number: 5.41.3.e
    text: |-
      een document, houdende de instemming bedoeld in [artikel 5.32, derde lid onder e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.41
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.3
  - number: 5.42.1
    text: |-
      Het bestuur verstrekt desgevraagd aan Onze Minister van Verkeer en Waterstaat de voor de uitoefening van zijn taak
      benodigde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.42
  - number: 5.42.2
    text: |-
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.42
  - number: 5.42.3
    text: Onze Minister stelt met betrekking tot het eerste en tweede lid een informatiestatuut vast.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.42
  - number: 5.42.4
    text: |-
      Onze Minister van Verkeer en Waterstaat kan het bestuur opdragen periodiek rapportage uit te brengen op een door
      hem, na overleg met het bestuur, te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.42
  - number: 5.42.5
    text: |-
      Het bestuur geeft bij het verstrekken van de in het eerste lid bedoelde gegevens waar nodig aan welke gegevens
      een vertrouwelijk karakter dragen. Dit vertrouwelijke karakter kan voortvloeien uit de aard van de gegevens, dan
      wel uit het feit dat natuurlijke of rechtspersonen deze aan de LVNL hebben verstrekt onder het beding dat zij als
      vertrouwelijk zullen gelden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.42
  - number: 5.43.1
    text: |-
      De volgende stukken worden door het bestuur vastgesteld en behoeven de goedkeuring van Onze Minister van Verkeer
      en Waterstaat:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.43
  - number: 5.43.1.a
    text: de financiële begroting;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.43
  - number: 5.43.1.b
    text: het financiële meerjarenbeleidsplan;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.43
  - number: 5.43.1.c
    text: de in artikel 5.21, derde lid, bedoelde hoogte van de vergoedingen ten behoeve van de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.43
  - number: 5.43.2
    text: |-
      Het bestuur stelt de stukken bedoeld in het eerste lid vast en zendt deze aan de Minister van Verkeer en Waterstaat
      toe vóór 1 november van het jaar voorafgaand aan het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.43
  - number: 5.43.3
    text: |-
      Indien Onze Minister van Verkeer en Waterstaat binnen vier weken na de in het tweede lid bedoelde toezending de
      goedkeuring aan de in het eerste lid, onder *a*, *b* en *c*, genoemde stukken, niet heeft onthouden, wordt deze
      geacht te zijn verleend.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.43
  - number: 5.43.4
    text: |-
      Het bestuur verstrekt Onze Minister van Verkeer en Waterstaat vóór 15 januari van het jaar voorafgaand aan het
      begrotingsjaar de door Onze Minister van Verkeer en Waterstaat voor het opstellen van de Rijksbegroting vereiste
      gegevens.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.43
  - number: 5.43.5
    text: |-
      Het bestuur verstrekt Onze Minister van Verkeer en Waterstaat de inlichtingen en andere gegevens waarover hij moet
      beschikken om inzicht in het financiële beheer van de LVNL te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.43
  - number: '5.44'
    text: |-
      Waar in deze wet de goedkeuring van Onze Minister van Verkeer en Waterstaat is vereist, verleent dan wel onthoudt
      hij die, behoudens het bepaalde in [artikel 5.43, derde lid][ref1], binnen twaalf weken na de datum van ontvangst
      van de goed te keuren stukken. Indien Onze Minister van Verkeer en Waterstaat goedkeuring onthoudt aan de
      financiële begroting, is het bestuur gerechtigd voor iedere maand gedurende welke de goedkeuring wordt onthouden,
      uitgaven te doen ter grootte van maximaal een twaalfde deel van de begroting van het voorafgaande boekjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.44
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.8
  - number: '5.45'
    text: |-
      Indien naar het oordeel van Onze Minister van Verkeer en Waterstaat het bestuur dan wel de raad van toezicht van de
      LVNL zijn taak niet of niet naar behoren vervult, kan Onze Minister van Verkeer en Waterstaat, na overleg met het
      betrokken orgaan, de noodzakelijke voorzieningen treffen. Onze Minister stelt de Tweede Kamer der Staten-Generaal
      onverwijld in kennis van de door hem getroffen voorzieningen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.45
  - number: '5.46'
    text: |-
      Onze Minister van Verkeer en Waterstaat zendt binnen vijf jaar na inwerkingtreding van deze wet en vervolgens na
      iedere vijf jaar aan de Staten-Generaal een verslag over de werking en doeltreffendheid van de LVNL. De LVNL is
      gehouden aan deze evaluatie medewerking te verlenen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel5.46
  - number: '6.50'
    text: |-
      Deze titel is, met uitzondering van het bepaalde bij of krachtens de[ artikelen 6.55][ref1], [6.56][ref2] en
      [6.57][ref3], niet van toepassing op het vervoer van splijtstoffen, ertsen of radioactieve stoffen als bedoeld in
      [artikel 1, eerste lid, van de Kernenergiewet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.50
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0002402
        artikel: '1'
  - number: 6.51.1
    text: |-
      Het is verboden bij of krachtens algemene maatregel van bestuur aan te wijzen gevaarlijke stoffen met een
      luchtvaartuig te vervoeren, ten vervoer aan te bieden of aan te nemen, alsmede te laden in of te lossen uit een
      luchtvaartuig, of tijdens het vervoer neer te leggen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.51
  - number: 6.51.2
    text: |-
      Het verbod in het eerste lid geldt niet voor de bij of krachtens algemene maatregel van bestuur aan te wijzen
      gevaarlijke stoffen of categorieën van gevaarlijke stoffen, indien aan de bij of krachtens die algemene maatregel
      van bestuur terzake gestelde regels is voldaan.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.51
  - number: 6.51.3
    text: |-
      Onder het vervoer van gevaarlijke stoffen wordt mede begrepen het laten staan op een luchtvaartterrein van een
      luchtvaartuig waarin zich dergelijke stoffen bevinden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.51
  - number: 6.52.1
    text: |-
      Het is verboden gevaarlijke stoffen ten vervoer aan te bieden onder een andere benaming of onder opgave van een
      andere categorie-indeling dan die welke bij of krachtens deze wet is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.52
  - number: 6.52.2
    text: De in het eerste lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.52
  - number: 6.53.1
    text: |-
      De regels, bedoeld in [artikel 6.51, tweede lid][ref1], kunnen onder meer betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.53.1.a
    text: |-
      de eisen ten aanzien van constructie, inrichting en uitrusting van luchtvaartuigen, waarmee gevaarlijke stoffen
      worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
  - number: 6.53.1.b
    text: de documenten die met betrekking tot gevaarlijke stoffen opgemaakt dienen te worden;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
  - number: 6.53.1.c
    text: de stuwage en de belading van luchtvaartuigen met inbegrip van samenlading;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
  - number: 6.53.1.d
    text: het onderzoek van gevaarlijke stoffen naar hun eigenschappen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
  - number: 6.53.1.e
    text: |-
      de eisen ten aanzien van verpakking van gevaarlijke stoffen, met inbegrip van de daarbij behorende inrichting of
      uitrusting, en het testen of keuren daarvan, alsmede de uitgifte en intrekking van verpakkingskenmerken;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
  - number: 6.53.1.f
    text: de etiketten, kenmerken of andere aanduidingen op de verpakking, bedoeld in onderdeel e;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
  - number: 6.53.1.g
    text: |-
      de eisen ten aanzien van constructie, inrichting en uitrusting van inrichtingen, voertuigen of werktuigen met
      behulp waarvan gevaarlijke stoffen worden geladen of gelost;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
  - number: 6.53.1.h
    text: de keuring van de inrichtingen, voertuigen of werktuigen, bedoeld in onderdeel g;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
  - number: 6.53.1.i
    text: |-
      de melding voorafgaande aan het verrichten van een handeling, als bedoeld in [artikel 6.51][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.53.1.j
    text: |-
      het opstellen van een risico-inventarisatie met betrekking tot het vervoeren, laden of lossen van door Onze
      Minister van Verkeer en Waterstaat daartoe aangewezen stoffen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
  - number: 6.53.1.k
    text: |-
      het aanwijzen van luchtroutes waarlangs door Onze Minister van Verkeer en Waterstaat aangewezen gevaarlijke stoffen
      worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
  - number: 6.53.2
    text: |-
      De betrokkene is een door Onze Minister van Verkeer en Waterstaat vast te stellen vergoeding verschuldigd voor de
      kosten van een keuring, als bedoeld in onderdeel h van het eerste lid, gebaseerd op de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.53
  - number: 6.54.1
    text: |-
      Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan na overleg met Onze
      Minister van Binnenlandse Zaken en Koninkrijksrelaties in het belang van de openbare veiligheid ten aanzien van
      luchtvaartuigen die door hem aangewezen gevaarlijke stoffen vervoeren, bepalen dat die luchtvaartuigen uitsluitend
      van door hem aangewezen luchtvaartterreinen mogen starten of op die luchtvaartterreinen mogen landen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.54
  - number: 6.54.2
    text: |-
      Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan na overleg met Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties in het belang van de openbare veiligheid bepalen, dat de in het
      eerste lid bedoelde gevaarlijke stoffen op de in het eerste lid bedoelde luchtvaartterreinen slechts mogen worden
      geladen, gelost of neergelegd op door hem op die luchtvaartterreinen aangewezen plaatsen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.54
  - number: 6.54.3
    text: |-
      Onze Minister van Defensie kan ten aanzien van militaire helikopters de in het eerste en tweede lid bedoelde
      beperkingen ook doen gelden voor door hem aangewezen terreinen, niet zijnde luchtvaartterreinen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.54
  - number: 6.54.4
    text: Het is verboden te handelen in strijd met het bepaalde krachtens het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.54
  - number: 6.55.1
    text: |-
      Het is verboden gevaarlijke stoffen ten vervoer aan te bieden, te vervoeren, te doen of laten vervoeren met
      luchtvaartuigen, zonder een door Onze Minister van Verkeer en Waterstaat verleende erkenning.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.2
    text: |-
      Een erkenning wordt verleend voor een bij algemene maatregel van bestuur vast te stellen termijn, dan wel voor
      onbepaalde tijd indien door de betrokken natuurlijke persoon of rechtspersoon voldaan wordt aan de bij of krachtens
      die maatregel met betrekking tot de erkenning gestelde eisen. Aan de erkenning kunnen voorschriften of beperkingen
      worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.3
    text: |-
      Bij algemene maatregel van bestuur wordt aangegeven welke erkenningen Onze Minister van Verkeer en Waterstaat kan
      verlenen, alsmede de bevoegdheden, welke aan iedere erkenning verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.4
    text: |-
      Onze Minister van Verkeer en Waterstaat kan een erkenning geheel of gedeeltelijk schorsen, wanneer een ernstig
      vermoeden rijst, dat de betrokken natuurlijke persoon of rechtspersoon:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.4.a
    text: niet voldoet aan de eisen, gesteld krachtens het tweede lid;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.4.b
    text: handelt in strijd met het bij of krachtens deze titel bepaalde.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.5
    text: 'Onze Minister van Verkeer en Waterstaat kan een erkenning intrekken, wanneer:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.5.a
    text: de houder daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.5.b
    text: de houder niet voldoet aan de eisen, gesteld krachtens het tweede lid;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.5.c
    text: de houder krachtens de hem verleende erkenning werkzaamheden verricht, waartoe deze niet erkend is;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.5.d
    text: |-
      de houder handelt in strijd met de[ artikelen 6.51, tweede lid][ref1], of [6.52][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.55.5.e
    text: de erkenning gedurende ten minste drie maanden is geschorst;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.5.f
    text: de houder in staat van faillissement verkeert.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.55.6
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat kunnen regels gegeven worden met betrekking tot de
      procedure van aanvraag, afgifte, wijziging, verlenging, schorsing en intrekking van erkenningen, alsmede de
      vergoeding die de aanvrager van de erkenning verschuldigd is voor de kosten van de behandeling van zijn aanvraag om
      afgifte, wijziging of verlenging, welke gebaseerd is op de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.55
  - number: 6.56.1
    text: |-
      Onze Minister van Verkeer en Waterstaat erkent een opleiding voor een theoretisch of praktisch examen als
      opleiding voor een theoretisch of praktisch examen benodigd ter verkrijging van een erkenning, als bedoeld in
      [artikel 6.55, eerste lid][ref1], indien die opleiding voldoet aan bij ministeriële regeling te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.56
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.56.2
    text: |-
      Onze Minister van Verkeer en Waterstaat kan de erkenning van een opleiding intrekken, wanneer die opleiding niet
      meer aan de krachtens het eerste lid gestelde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.56
  - number: 6.56.3
    text: Bij ministeriële regeling kunnen ter uitvoering van het eerste en tweede lid nadere regels worden gegeven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.56
  - number: '6.57'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan ter uitvoering van internationale overeenkomsten of besluiten
      van volkenrechtelijke organisaties natuurlijke personen of rechtspersonen, die handelingen als bedoeld in
      [artikel 6.55, eerste lid][ref1], verrichten op zodanige wijze, dat deze voldoen aan eisen, welke gelijkwaardig
      zijn aan de krachtens [artikel 6.55][ref2] gestelde eisen, erkennen als erkende bedrijven voor zover die bedrijven
      erkend zijn door de bevoegde autoriteit van een bij ministeriële regeling aangewezen land of internationale
      organisatie. Aan de erkenning kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.57
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.58.1
    text: |-
      Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan na overleg met Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties in bijzondere gevallen ontheffing verlenen van de bij of krachtens
      deze titel gegeven regels, wanneer die regels in redelijkheid geen toepassing kunnen vinden en de veiligheid
      van het luchtverkeer met het verlenen van de ontheffing niet in gevaar wordt gebracht. Aan de ontheffing kunnen
      voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.58
  - number: 6.58.2
    text: Het is verboden te handelen in strijd met de voorschriften of de beperkingen bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.58
  - number: 6.58.3
    text: De ontheffing kan worden geweigerd op grond van de openbare veiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.58
  - number: 6.58.4
    text: |-
      Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan na overleg met Onze Minister
      van Binnenlandse Zaken en Koninkrijksrelaties een ontheffing wijzigen:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.58
  - number: 6.58.4.a
    text: op verzoek van de houder;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.58
  - number: 6.58.4.b
    text: op grond van de openbare veiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.58
  - number: 6.58.5
    text: |-
      Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan de ontheffing intrekken,
      wanneer
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.58
  - number: 6.58.5.a
    text: de redenen, waarom de ontheffing is verleend, zijn komen te vervallen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.58
  - number: 6.58.5.b
    text: de openbare veiligheid dit vereist;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.58
  - number: 6.58.5.c
    text: de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.58
  - number: 6.58.6
    text: |-
      De aanvrager van de ontheffing of van de wijziging daarvan is Onze Minister van Verkeer en Waterstaat een door deze
      vast te stellen vergoeding voor de behandeling van de aanvraag verschuldigd, gebaseerd op de werkelijke kosten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.58
  - number: '6.59'
    text: |-
      Het is passagiers en leden van het boordpersoneel verboden gevaarlijke stoffen aan boord van een luchtvaartuig te
      brengen, of met zich mee te voeren in hun bagage, anders dan met inachtneming van de door Onze Minister van Verkeer
      en Waterstaat respectievelijk Onze Minister van Defensie aangewezen Technische Voorschriften van de Internationale
      Burgerluchtvaartorganisatie betreffende het vervoer van gevaarlijke stoffen door de lucht.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.59
  - number: 6.60.1
    text: |-
      Degene, die een handeling als bedoeld in [artikel 6.51, eerste lid][ref1], verricht, is verplicht, indien zich
      daarbij voorvallen voordoen waardoor gevaar voor de openbare veiligheid is ontstaan of is te duchten, daarvan
      onverwijld mededeling te doen aan Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van
      Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.60
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.60.2
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kunnen
      voorschriften worden gegeven omtrent de procedure en de wijze van mededeling als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.60
  - number: 6.61.1
    text: |-
      Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie kan van degenen die handelingen
      verrichten als bedoeld in [artikel 6.51][ref1] , alle inlichtingen of documenten vragen die naar zijn redelijk
      oordeel nodig zijn ten behoeve van het analyseren van voorvallen als bedoeld in [artikel 6.60][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.61
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.61.2
    text: |-
      De betrokkenen zijn verplicht de gevraagde inlichtingen volledig en naar waarheid te verstrekken binnen een door
      Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie in redelijkheid te stellen
      termijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.61
  - number: 6.61a.1
    text: |-
      Indien zich binnen het vluchtinformatiegebied Amsterdam een luchtvaartongeval voordoet verstrekt de houder van
      het betrokken luchtvaartuig onverwijld aan de betrokken hulpverlenende instanties informatie over de gevaarlijke
      stoffen die zich aan boord van dat luchtvaartuig bevinden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.61a
  - number: 6.61a.2
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat respectievelijk Onze Minister van Defensie wordt
      vastgesteld welke informatie door tussenkomst van welke instantie verstrekt dient te worden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.61a
  - number: 6.62.1
    text: |-
      Bij regeling van Onze Minister van Verkeer en Waterstaat kunnen met het oog op de luchtwaardigheid van
      luchtvaartuigen tijdens het vervoer van dieren in die luchtvaartuigen in overeenstemming met Onze Minister van
      Landbouw, Natuurbeheer en Visserij regels worden gegeven met betrekking tot dat vervoer.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.62
  - number: 6.62.2
    text: Het is verboden dieren te vervoeren in strijd met het bepaalde krachtens het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.62
  - number: 6.62.3
    text: |-
      Onze Minister van Verkeer en Waterstaat kan in bijzondere gevallen ontheffing verlenen van de in het eerste lid
      bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel6.62
  - number: '8.1'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.1
  - number: 8.1.a
    text: '*luchthaven*: een samenstel van in elkaars nabijheid gelegen voorzieningen ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.1
  - number: 8.1.a.1°
    text: |-
      het opstijgen en het landen van luchtvaartuigen en de daarmee verband houdende bewegingen van luchtvaartuigen op
      de grond;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.1
  - number: 8.1.a.2°
    text: de afwikkeling van het in onderdeel 1° bedoelde luchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.1
  - number: 8.1.a.3°
    text: bedrijfsmatige activiteiten die samenhangen met de afwikkeling van het in onderdeel 1° bedoelde luchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.1
  - number: 8.1.b
    text: '*luchthavenluchtverkeer*: het in onderdeel a, onderdeel 1°, bedoelde luchtverkeer;'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.1
  - number: 8.1.c
    text: '*luchthavenindelingbesluit*: het besluit, bedoeld in artikel 8.4;'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.1
  - number: 8.1.d
    text: '*luchthavenverkeerbesluit*: het besluit, bedoeld in artikel 8.15;'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.1
  - number: 8.1.e
    text: '*luchtverkeerweg*: een ten behoeve van geleiding van het luchthavenluchtverkeer afgebakend deel van het luchtruim;'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.1
  - number: 8.1.f
    text: '*exploitant van de luchthaven*: de N.V. Luchthaven Schiphol;'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.1
  - number: 8.1.g
    text: '*inspecteur-generaal*: de inspecteur-generaal van de Inspectie Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.1
  - number: '8.2'
    text: Dit hoofdstuk is van toepassing ten aanzien van de luchthaven Schiphol.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.2
  - number: '8.3'
    text: |-
      De uitoefening van de bevoegdheden die voortvloeien uit dit hoofdstuk is gericht op het bevorderen van een optimaal
      gebruik van de luchthaven als kwalitatief hoogwaardig knooppunt van nationaal en internationaal luchtverkeer, met
      inachtneming van de grenzen die met het oog op de veiligheid, de geluidbelasting, de lokale luchtverontreiniging en
      de geurbelasting noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.3
  - number: '8.4'
    text: Bij algemene maatregel van bestuur wordt voor de luchthaven een luchthavenindelingbesluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.4
  - number: 8.5.1
    text: In het luchthavenindelingbesluit worden het luchthavengebied en het beperkingengebied vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.5
  - number: 8.5.2
    text: Als luchthavengebied wordt het gebied vastgesteld dat bestemd is voor gebruik als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.5
  - number: 8.5.3
    text: |-
      Als beperkingengebied wordt het gebied vastgesteld waar in verband met de nabijheid van de luchthaven met het oog
      op de veiligheid en de geluidbelasting beperkingen noodzakelijk zijn ten aanzien van de bestemming of het gebruik
      van de grond.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.5
  - number: 8.5.4
    text: |-
      Het luchthavengebied en het beperkingengebied overlappen elkaar niet. De gebieden kunnen bestaan uit niet
      aaneengesloten delen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.5
  - number: 8.5.5
    text: |-
      De gebieden worden vastgesteld met behulp van kaarten waarop de ligging van de gebieden is aangegeven. De
      kaarten voor het luchthavengebied worden vervaardigd op een schaal van ten minste 1 op 10 000. De kaarten voor
      het beperkingengebied worden vervaardigd op een schaal van ten minste 1 op 50 000. Zo nodig worden delen van de
      gebieden vastgelegd met behulp van kaarten op een schaal met een kleiner verhoudingsgetal.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.5
  - number: '8.6'
    text: |-
      Het luchthavenindelingbesluit bevat voor het luchthavengebied regels omtrent de bestemming en het gebruik van de
      grond voor zover die regels noodzakelijk zijn met het oog op het gebruik van het gebied als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.6
  - number: 8.7.1
    text: |-
      Het luchthavenindelingbesluit bevat voor het beperkingengebied regels waarbij beperkingen zijn gesteld ten aanzien
      van de bestemming en het gebruik van de grond voor zover die beperkingen noodzakelijk zijn met het oog op de
      veiligheid en de geluidbelasting in verband met de nabijheid van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.7
  - number: 8.7.2
    text: 'Het besluit bevat in ieder geval regels omtrent beperking van:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.7
  - number: 8.7.2.a
    text: |-
      de bestemming en het gebruik van grond in verband met het externe-veiligheidsrisico vanwege het
      luchthavenluchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.7
  - number: 8.7.2.b
    text: de bestemming en het gebruik van grond in verband met de geluidbelasting vanwege het luchthavenluchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.7
  - number: 8.7.2.c
    text: |-
      de maximale hoogte van objecten in, op of boven de grond, in verband met de veiligheid van het
      luchthavenluchtverkeer;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.7
  - number: 8.7.2.d
    text: |-
      een bestemming die, of van een gebruik dat, vogels aantrekt, in verband met de veiligheid van het
      luchthavenluchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.7
  - number: 8.7.3
    text: |-
      Bij de regels, bedoeld in het tweede lid, onderdelen a en b, worden in ieder geval gronden aangewezen die niet
      bestemd of gebruikt worden voor woningen of andere in het besluit aangewezen gebouwen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.7
  - number: 8.7.4
    text: |-
      Elk besluit, volgend op het eerste luchthavenindelingbesluit, biedt een beschermingsniveau ten aanzien van externe
      veiligheid en geluidbelasting, dat voor ieder van deze aspecten, gemiddeld op jaarbasis vastgesteld, per saldo
      gelijkwaardig is aan of beter is dan het niveau zoals dat geboden werd door het eerste besluit.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.7
  - number: 8.8.1
    text: |-
      Bij de vaststelling of de herziening van een bestemmingsplan voor een gebied dat is gelegen binnen het
      luchthavengebied of het beperkingengebied, wordt het luchthavenindelingbesluit in acht genomen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.8
  - number: 8.8.2
    text: |-
      Voor het gebied dat ligt binnen het luchthavengebied of het beperkingengebied, waarvoor geen bestemmingsplan
      geldt dat in overeenstemming is met het besluit, geldt het besluit als een voorbereidingsbesluit als bedoeld in
      [artikel 21 van de Wet op de Ruimtelijke Ordening][ref1]. Voor zover het besluit geldt als voorbereidingsbesluit,
      is [artikel 21, vierde tot en met zesde lid, van de Wet op de Ruimtelijke Ordening][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002375#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0002375#Artikel21
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0002375
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0002375
        artikel: '21'
  - number: 8.8.3
    text: |-
      De gemeenteraad is verplicht binnen een jaar nadat het besluit onherroepelijk is geworden het bestemmingsplan
      overeenkomstig het besluit vast te stellen of te herzien.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.8
  - number: 8.8.4
    text: |-
      Indien een bestemmingsplan niet in overeenstemming is met het besluit, is het gemeentebestuur verplicht aan degenen
      die inzage verlangen in het bestemmingsplan, tevens inzage te verlenen in het besluit.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.8
  - number: 8.9.1
    text: |-
      Bij de toepassing van de [artikelen 17](onbekend), [19](onbekend) en [46, zesde, zevende en achtste lid, van de Wet
      op de Ruimtelijke Ordening](onbekend) en van [artikel 50, vierde, vijfde en zesde lid, van de Woningwet](onbekend),
      wordt het luchthavenindelingbesluit in acht genomen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.9
  - number: 8.9.2
    text: |-
      In afwijking van de [artikelen 46, derde lid, van de Wet op de Ruimtelijke Ordening](onbekend) en [50, tweede en
      derde lid, van de Woningwet](onbekend), duurt de in die artikelen bedoelde aanhouding totdat een bestemmingsplan
      dat in overeenstemming is met het besluit in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.9
  - number: 8.9.3
    text: |-
      Bij de toepassing van de [artikelen 17](onbekend), [19](onbekend) en [46, zesde, zevende en achtste lid, van de Wet
      op de Ruimtelijke Ordening](onbekend) en van [artikel 50, vierde, vijfde en zesde lid, van de Woningwet](onbekend)
      kan van het besluit worden afgeweken indien van Onze Minister van Verkeer en Waterstaat, in overeenstemming met
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, de verklaring is ontvangen dat hij tegen
      de afwijking geen bezwaar heeft.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.9
  - number: 8.9.4
    text: |-
      De verklaring van geen bezwaar die betrekking heeft op het luchthavengebied kan worden geweigerd met het oog op het
      gebruik van het gebied als luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.9
  - number: 8.9.5
    text: |-
      De verklaring van geen bezwaar die betrekking heeft op het beperkingengebied kan worden geweigerd met het oog op de
      veiligheid en de geluidbelasting in verband met de nabijheid van de luchthaven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.9
  - number: '8.10'
    text: |-
      Voor zover het ontwerp van een bestemmingsplan zijn grondslag vindt in de uitvoering van het
      luchthavenindelingbesluit zijn [artikel 23, eerste lid, onder c](onbekend), en [artikel 27, eerste en tweede lid,
      van de Wet op de Ruimtelijke Ordening](onbekend) niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.10
  - number: '8.11'
    text: |-
      Voor de mogelijkheid van beroep ingevolge [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1] worden een
      verklaring van geen bezwaar als bedoeld in [artikel 8.9, derde lid][ref2], en het besluit waarop de verklaring
      betrekking heeft als één besluit aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.11
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: 8.2.1
  - number: 8.12.1
    text: |-
      Dit artikel is van toepassing op het oprichten of plaatsen van objecten waar geen bouwvergunning of
      aanlegvergunning voor is vereist.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.12
  - number: 8.12.2
    text: |-
      Het is verboden een object op te richten of te plaatsen indien dit in strijd is met een regel in het
      luchthavenindelingbesluit omtrent de maximale hoogte van objecten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.12
  - number: 8.12.3
    text: |-
      Onze Minister van Verkeer en Waterstaat kan ontheffing verlenen van het verbod. De ontheffing wordt slechts
      geweigerd in het belang van de veiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.12
  - number: 8.12.4
    text: |-
      De ontheffing wordt voor een bepaalde periode verleend. Aan de ontheffing kunnen beperkingen en voorschriften
      worden verbonden in het belang van de veiligheid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.12
  - number: 8.12.5
    text: |-
      Onze Minister van Verkeer en Waterstaat stelt regels omtrent de vergoeding die de aanvrager van een ontheffing
      verschuldigd is voor de kosten van het verlenen van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.12
  - number: '8.13'
    text: |-
      De voordracht voor een luchthavenindelingbesluit wordt niet gedaan dan nadat het ontwerp in de Staatscourant is
      bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen vier weken na de dag waarop de bekendmaking is
      geschiedt, wensen en bedenkingen ter kennis van Onze Minister van Verkeer en Waterstaat te brengen. Gelijktijdig
      met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.13
  - number: '8.14'
    text: Artikel 8.13 is van overeenkomstige toepassing op het wijzigen van het luchthavenindelingbesluit.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.14
  - number: '8.15'
    text: Bij algemene maatregel van bestuur wordt voor de luchthaven een luchthavenverkeerbesluit vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.15
  - number: '8.16'
    text: Het luchthavenverkeerbesluit bevat een beschrijving van de luchtverkeerwegen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.16
  - number: 8.17.1
    text: |-
      Het luchthavenverkeerbesluit bevat regels omtrent het luchthavenluchtverkeer voor zover die regels noodzakelijk
      zijn met het oog op de veiligheid, de geluidbelasting, de lokale luchtverontreiniging en de geurbelasting.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.2
    text: 'Het besluit bevat in ieder geval regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.2.a
    text: de gevallen waarin van een luchtverkeerweg gebruik gemaakt wordt;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.2.b
    text: een op beperking van belasting gerichte wijze van gebruik van het luchtruim in andere gevallen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.2.c
    text: de beschikbaarheid van de luchthaven voor het luchthavenluchtverkeer.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.3
    text: 'Het besluit kan regels bevatten omtrent:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.3.a
    text: de wijze van gebruik van de luchtverkeerwegen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.3.b
    text: |-
      de tijdstippen waarop, de frequentie waarmee en de categorieën van luchtvaartuigen waarmee van het luchtruim
      gebruik gemaakt wordt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.4
    text: |-
      De regels bevorderen het realiseren van een beschermingsniveau, waarbij de in het besluit beschreven grenswaarden
      met betrekking tot de door het luchthavenluchtverkeer veroorzaakte belasting ten aanzien van veiligheid, geluid en
      lokale luchtverontreiniging niet worden overschreden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.5
    text: 'Het besluit bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.5.a
    text: de grenswaarden voor het externe-veiligheidsrisico;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.5.b
    text: |-
      de grenswaarden voor de geluidbelasting, waarbij in ieder geval punten in of aan de rand van woonbebouwing in de
      nabijheid van de luchthaven bepaald worden met de grenswaarden die op ieder van die punten van toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.5.c
    text: de grenswaarden voor de emissie van de stoffen die lokale luchtverontreiniging veroorzaken.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.6
    text: |-
      Het besluit kan ten aanzien van de in het tweede en derde lid bedoelde onderwerpen, grenzen stellen aan de
      maatregelen die de inspecteur-generaal op grond van artikel 8.22 kan treffen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: 8.17.7
    text: |-
      Elk besluit, volgend op het eerste luchthavenverkeerbesluit, biedt een beschermingsniveau ten aanzien van externe
      veiligheid, geluidbelasting en lokale luchtverontreiniging, dat voor ieder van deze aspecten, gemiddeld op
      jaarbasis vastgesteld, per saldo gelijkwaardig is aan of beter is dan het niveau zoals dat geboden werd door het
      eerste besluit.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.17
  - number: '8.18'
    text: |-
      De exploitant van de luchthaven, de verlener van luchtverkeersdienstverlening en de luchtvaartmaatschappijen
      bevorderen het goede verloop van het luchthavenluchtverkeer overeenkomstig het luchthavenverkeerbesluit. Zij
      treffen daartoe zelf en in onderlinge samenwerking de voorzieningen die redelijkerwijs van hen kunnen worden
      gevergd om te bewerkstelligen dat de belasting vanwege het luchthavenluchtverkeer de in artikel 8.17, vierde lid,
      bedoelde grenswaarden niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.18
  - number: '8.19'
    text: |-
      De exploitant van de luchthaven stelt de luchthaven beschikbaar overeenkomstig de regels van het
      luchthavenverkeerbesluit. De exploitant kan hiervan afwijken als dit in het belang van de veiligheid nodig is.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.19
  - number: '8.20'
    text: |-
      Luchtverkeersdienstverlening wordt verleend overeenkomstig de regels van het luchthavenverkeerbesluit. De verlener
      van de dienstverlening kan hiervan afwijken als dit in het belang van de veiligheid nodig is.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.20
  - number: 8.21.1
    text: |-
      De gezagvoerder neemt deel aan het luchthavenluchtverkeer overeenkomstig de regels van het
      luchthavenverkeerbesluit.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.21
  - number: 8.21.2
    text: De gezagvoerder kan afwijken van het eerste lid op advies van de verlener van luchtverkeersdienstverlening.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.21
  - number: 8.21.3
    text: De gezagvoerder kan afwijken van het eerste lid als dit in het belang van de veiligheid nodig is.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.21
  - number: 8.22.1
    text: |-
      Zodra de inspecteur-generaal constateert dat de in artikel 8.17, vierde lid, bedoelde grenswaarden zijn
      overschreden, schrijft hij maatregelen voor die naar zijn oordeel bijdragen aan het terugdringen van de belasting
      vanwege het luchthavenluchtverkeer binnen de grenswaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.22
  - number: 8.22.2
    text: |-
      De maatregelen hebben betrekking op de in artikel 8.17, tweede en derde lid, bedoelde onderwerpen en vallen binnen
      de in artikel 8.17, zesde lid, bedoelde grenzen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.22
  - number: 8.22.3
    text: |-
      De inspecteur-generaal trekt de maatregelen in of matigt deze voor zover zij naar zijn oordeel niet langer nodig
      zijn voor het terugdringen van de belasting vanwege het luchthavenluchtverkeer binnen de grenswaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.22
  - number: 8.22.4
    text: |-
      Voordat de inspecteur-generaal een maatregel voorschrijft stelt hij degene tot wie de maatregel is gericht in de
      gelegenheid zijn zienswijze kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.22
  - number: 8.22.5
    text: |-
      De artikelen 8.18 tot en met 8.21 zijn van overeenkomstige toepassing ten aanzien van de voorgeschreven
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.22
  - number: 8.23.1
    text: |-
      Onze Minister van Verkeer en Waterstaat kan in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer indien ten gevolge van groot onderhoud van een baan of door een bijzonder voorval het
      normale gebruik van de luchthaven naar hun oordeel ernstig wordt belemmerd:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.23
  - number: 8.23.1.a
    text: vrijstelling verlenen van een regel in het luchthavenverkeerbesluit;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.23
  - number: 8.23.1.b
    text: |-
      een in het luchthavenverkeerbesluit vastgelegde grenswaarde voor de geluidbelasting in een bepaald punt vervangen
      door een andere grenswaarde.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.23
  - number: 8.23.2
    text: |-
      Een vrijstelling kan slechts worden verleend voor een bepaalde in de vrijstelling vast te stellen termijn van ten
      hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.23
  - number: 8.23.3
    text: |-
      Aan een vrijstelling kunnen beperkingen en voorschriften worden verbonden met het oog op de veiligheid, de
      geluidbelasting, de lokale luchtverontreiniging en de geurbelasting. De artikelen 8.18 tot en met 8.21 zijn van
      overeenkomstige toepassing ten aanzien van de beperkingen en voorschriften.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.23
  - number: 8.23.4
    text: |-
      Het tweede en derde lid zijn van overeenkomstige toepassing op een vervanging als bedoeld in het eerste lid,
      onderdeel b.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.23
  - number: '8.24'
    text: |-
      De artikelen 8.13 en 8.14 zijn van overeenkomstige toepassing op het voorbereiden en het wijzigen van het
      luchthavenverkeerbesluit.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.24
  - number: 8.25.1
    text: |-
      De exploitant van de luchthaven is verplicht om met inachtneming van de bij of krachtens deze wet of de
      [Luchtvaartwet](onbekend) gestelde bepalingen, luchthavenluchtverkeer ten behoeve van de burgerluchtvaart op de
      luchthaven toe te laten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.25
  - number: 8.25.2
    text: Het eerste lid is niet van toepassing op circuitvluchten, oefenvluchten en proefvluchten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.25
  - number: 8.25.3
    text: |-
      De exploitant is verplicht om in door Onze Minister van Verkeer en Waterstaat in overeenstemming met Onze Minister
      van Defensie aangewezen gevallen met inachtneming van de bij of krachtens deze wet of de Luchtvaartwet gestelde
      bepalingen, luchthavenluchtverkeer ten behoeve van de militaire luchtvaart op de luchthaven toe te laten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.25
  - number: '8.26'
    text: |-
      Een ministeriële regeling op grond van deze titel wordt vastgesteld door Onze Minister van Verkeer en Waterstaat in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.26
  - number: 8.27.1
    text: |-
      De exploitant van de luchthaven draagt zorg voor het registreren van de veiligheids- en milieubelasting vanwege het
      luchthavenluchtverkeer. Hij verricht de metingen en berekeningen die voor die registratie noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.27
  - number: 8.27.2
    text: |-
      Het registreren wordt zodanig uitgevoerd dat een vergelijking mogelijk is met de in artikel 8.17, vierde lid,
      bedoelde grenswaarden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.27
  - number: 8.27.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent het registreren en omtrent de metingen en
      berekeningen die daartoe noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.27
  - number: 8.28.1
    text: 'De exploitant van de luchthaven verstrekt de inspecteur-generaal:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.28
  - number: 8.28.1.a
    text: de op grond van artikel 8.27 geregistreerde gegevens;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.28
  - number: 8.28.1.b
    text: gegevens over de in artikel 8.27 bedoelde metingen en berekeningen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.28
  - number: 8.28.2
    text: |-
      De exploitant, de verlener van luchtverkeersdienstverlening en de luchtvaartmaatschappijen verstrekken de
      inspecteur-generaal gegevens over de ter uitvoering van artikel 8.18 getroffen voorzieningen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.28
  - number: 8.28.3
    text: |-
      De exploitant verstrekt de inspecteur-generaal gegevens over de afwijkingen, bedoeld in artikel 8.19. De verlener
      van luchtverkeersdienstverlening verstrekt de inspecteur-generaal gegevens over de afwijkingen, bedoeld in de
      artikelen 8.20 en 8.21.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.28
  - number: 8.28.4
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent de gegevensverstrekking.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.28
  - number: 8.29.1
    text: |-
      De inspecteur-generaal brengt elk half jaar aan Onze Minister van Verkeer en Waterstaat en aan Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer verslag uit over de veiligheids- en milieuaspecten van het
      luchthavenluchtverkeer. Het verslag bevat ten minste een beschrijving van:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.29
  - number: 8.29.1.a
    text: |-
      de ter uitvoering van artikel 8.18 getroffen voorzieningen en van de doelmatigheid en doeltreffendheid van die
      voorzieningen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.29
  - number: 8.29.1.b
    text: |-
      de ter uitvoering van artikel 8.22 getroffen maatregelen en van de doelmatigheid en de doeltreffendheid van die
      maatregelen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.29
  - number: 8.29.2
    text: Bij ministeriële regeling worden nadere regels gesteld omtrent de verslaglegging.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.29
  - number: 8.30.1
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent het openbaar maken van gegevens als bedoeld in artikel
      8.28.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.30
  - number: 8.30.2
    text: |-
      De openbaarmaking geschiedt door kennisgeving van de gegevens of van de zakelijke inhoud ervan in een van
      overheidswege uitgegeven blad of een dag-, nieuws- of huis-aan-huisblad, dan wel op een andere geschikte wijze.
      Indien alleen van de zakelijke inhoud kennis wordt gegeven, worden de gegevens tegelijk ter inzage gelegd. In de
      kennisgeving wordt vermeld waar en wanneer de gegevens ter inzage liggen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.30
  - number: 8.31.1
    text: |-
      Indien een belanghebbende ten gevolge van het luchthavenindelingbesluit of het luchthavenverkeerbesluit schade
      lijdt of zal lijden, welke redelijkerwijs niet of niet geheel te zijnen laste behoort te blijven en waarvan de
      vergoeding niet of niet voldoende anderszins is verzekerd, kent Onze Minister van Verkeer en Waterstaat hem op
      aanvraag een naar billijkheid te bepalen schadevergoeding toe.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.31
  - number: 8.31.2
    text: |-
      [Artikel 49 van de Wet op de Ruimtelijke Ordening](onbekend) blijft buiten toepassing voor zover de belanghebbende
      met betrekking tot de schade een beroep doet of kan doen op een schadevergoeding als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.31
  - number: '8.32'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan in overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke
      Ordening en Milieubeheer een regeling vaststellen inzake het treffen van geluidwerende voorzieningen ten aanzien
      van in de regeling bepaalde woningen of andere geluidsgevoelige gebouwen voor zover die gebouwen vanwege het
      luchthavenluchtverkeer een geluidbelasting kunnen ondervinden die ligt boven de in de regeling vastgestelde
      maximale waarden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.32
  - number: '8.33'
    text: |-
      Onze Minister van Verkeer en Waterstaat kan regels stellen ten aanzien van het verstrekken van geldelijke steun uit
      s Rijks kas aan gemeenten ter bestrijding van de kosten ten gevolge van uitvoering van de in overeenstemming met
      het luchthavenindelingbesluit gebrachte bestemmingsplannen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.33
  - number: 8.34.1
    text: Er is een commissie regionaal overleg luchthaven Schiphol.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.34
  - number: 8.34.2
    text: 'De commissie bestaat uit een onafhankelijke voorzitter en vertegenwoordigers van:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.34
  - number: 8.34.2.a
    text: de provincies Noord-Holland, Zuid-Holland en Utrecht;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.34
  - number: 8.34.2.b
    text: gemeenten in de in onderdeel a genoemde provincies;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.34
  - number: 8.34.2.c
    text: de exploitant van de luchthaven;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.34
  - number: 8.34.2.d
    text: de verlener van luchtverkeersdienstverlening;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.34
  - number: 8.34.2.e
    text: luchtvaartmaatschappijen die geregeld van de luchthaven gebruik maken.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.34
  - number: '8.35'
    text: |-
      De commissie heeft tot taak om door overleg tussen de in artikel 8.34 bedoelde betrokkenen een gebruik van de
      luchthaven te bevorderen dat zoveel mogelijk recht doet aan de belangen van die betrokkenen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.35
  - number: '8.36'
    text: |-
      Onze Minister van Verkeer en Waterstaat stelt nadere regels omtrent de taak en de samenstelling van de commissie.
      Daarbij wordt bepaald welke in artikel 8.34, tweede lid, bedoelde gemeenten en luchtvaartmaatschappijen in de
      commissie vertegenwoordigd zijn.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.36
  - number: 8.37.1
    text: De voorzitter van de commissie wordt door Onze Minister van Verkeer en Waterstaat benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.37
  - number: 8.37.2
    text: |-
      Elk ander lid wordt benoemd, geschorst en ontslagen door de voorzitter op voordracht van het orgaan of de
      organisatie die het lid vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.37
  - number: 8.37.3
    text: |-
      De benoeming geschiedt voor ten hoogste vier jaren. Herbenoeming kan telkens voor ten hoogste vier jaren
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.37
  - number: '8.38'
    text: |-
      De commissie stelt een bestuursreglement vast. Het reglement behoeft de goedkeuring van Onze Minister van Verkeer
      en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.38
  - number: '8.39'
    text: |-
      De commissie heeft een secretariaat. De samenstelling en de werkzaamheden van het secretariaat worden in het
      bestuursreglement geregeld.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.39
  - number: '8.40'
    text: |-
      Het beheer van de bescheiden betreffende de werkzaamheden van de commissie wordt in het bestuursreglement geregeld.
      De bescheiden worden na beëindiging van de werkzaamheden van de commissie opgeborgen in het archief van het
      ministerie van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel8.40
  - number: 9.1.1
    text: |-
      In bijzondere omstandigheden in geval van ernstige verstoring van de binnenlandse openbare orde of veiligheid
      is Onze Minister van Verkeer en Waterstaat bevoegd in overeenstemming met Onze Minister van Binnenlandse
      Zaken en Onze Minister van Defensie aan de LVNL aanwijzingen te geven met betrekking tot het verzorgen van de
      luchtverkeersbeveiliging.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel9.1
  - number: 9.1.2
    text: |-
      In bijzondere omstandigheden in verband met de handhaving van de internationale rechtsorde of met de internationale
      betrekkingen is Onze Minister van Verkeer en Waterstaat bevoegd in overeenstemming met Onze Minister van
      Buitenlandse Zaken en Onze Minister van Defensie aan de LVNL aanwijzingen te geven met betrekking tot het verzorgen
      van de luchtverkeersbeveiliging.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel9.1
  - number: 9.1.3
    text: |-
      Indien de LVNL door het uitvoeren van de aanwijzingen financieel nadeel ondervindt, ontvangt hij een naar
      billijkheid te bepalen vergoeding.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel9.1
  - number: 9.2.1
    text: |-
      Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kunnen, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze
      Minister-President, [de artikelen 9.3][ref2] of [9.4][ref3] en [9.5][ref4] in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel9
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.2
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen wordt onverwijld een voorstel van wet aan de Tweede Kamer
      gezonden omtrent het voortduren van de werking van de bij dat besluit in werking gestelde bepalingen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel9.2
  - number: 9.2.3
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan worden bij koninklijk besluit, op voordracht
      van Onze Minister-President, de bepalingen die ingevolge het eerste lid in werking zijn gesteld, onverwijld buiten
      werking gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel9.2
  - number: 9.2.4
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, worden de bepalingen die ingevolge het eerste
      lid in werking zijn gesteld, buiten werking gesteld, zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel9.2
  - number: 9.2.5
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel9.2
  - number: 9.2.6
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel9.2
  - number: 9.6.1
    text: |-
      De in [de artikelen 9.3][ref1] en [9.4][ref2] bedoelde aanwijzingen worden niet gegeven dan in overeenstemming met
      de minister die het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel9
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.6.2
    text: |-
      Indien de LVNL door het uitvoeren van de in [de artikelen 9.3][ref1] en [9.4][ref2] bedoelde aanwijzingen
      financieel nadeel ondervindt, ontvangt hij een naar billijkheid te bepalen vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel9
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '9'
        hoofdstuk: '9'
  - number: 10.1.1
    text: |-
      Behoudens titel 2.2 is [hoofdstuk 2][ref1] niet van toepassing op het bedienen van militaire luchtvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '2'
  - number: 10.1.2
    text: |-
      Militaire luchtvaartuigen worden bediend door cockpitpersoneel, dat voldoet aan bij of krachtens algemene
      maatregel van bestuur gestelde eisen inzake theoretische en praktische bekwaamheid en geestelijke en lichamelijke
      geschiktheid.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.1
  - number: 10.1.3
    text: |-
      Onze Minister van Defensie kan in bijzondere gevallen ontheffing verlenen van de bij of krachtens het tweede lid
      gegeven regels, wanneer door bijzondere omstandigheden die regels in redelijkheid geen toepassing kunnen vinden
      en de veiligheid van het luchtverkeer met het verlenen van de ontheffing niet in gevaar wordt gebracht. Aan de
      ontheffing kunnen voorschriften of beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.1
  - number: 10.1.4
    text: Onze Minister van Defensie trekt de door hem verleende ontheffing in, wanneer
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.1
  - number: 10.1.4.a
    text: de redenen, waarom de ontheffing is verleend, zijn komen te vervallen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.1
  - number: 10.1.4.b
    text: de houder van de ontheffing de daaraan verbonden voorschriften of beperkingen niet naleeft.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.1
  - number: 10.2.1
    text: |-
      [Artikel 5.16][ref1] is niet van toepassing op luchtverkeersdienstverleningspersoneel van de krijgsmacht. Dit
      personeel voldoet aan bij of krachtens algemene maatregel van bestuur gestelde eisen inzake theoretische en
      praktische bekwaamheid en geestelijke en lichamelijke geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.2.1
  - number: 10.2.2
    text: |-
      [Artikel 10.1, derde en vierde lid][ref1], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: '10.3'
    text: |-
      Onze Minister van Defensie kan voor militaire luchtvaartuigen toestaan, dat van het nationaliteitskenmerk en het
      inschrijvingskenmerk bedoeld in [artikel 3.2, eerste lid, onderdeel a][ref1], wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
  - number: '10.5'
    text: |-
      Hoofdstuk 4 is niet van toepassing op de vluchtuitvoering met militaire luchtvaartuigen alsmede op de
      vluchtuitvoering ten behoeve van militaire doeleinden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.5
  - number: 10.6.1
    text: |-
      [Titel 6.5][ref1] is niet van toepassing op internationaal vervoer van gevaarlijke stoffen met luchtvaartuigen
      waarvan de krijgsmacht of de krijgsmacht van een andere mogendheid houder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '6'
  - number: 10.6.2
    text: |-
      [Titel 6.5][ref1] is, met uitzondering van [artikel 6.54][ref2], niet van toepassing op nationaal vervoer van
      ontplofbare stoffen of voorwerpen met luchtvaartuigen waarvan de krijgsmacht of de krijgsmacht van een andere
      mogendheid houder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.6.3
    text: |-
      [Artikel 6.51, eerste lid][ref1], geldt niet voor het nationale vervoer van de bij of krachtens algemene maatregel
      van bestuur aan te wijzen gevaarlijke stoffen, niet zijnde ontplofbare stoffen of voorwerpen, behorend tot de
      operationele uitrusting of het wapensysteem van een luchtvaartuig waarvan de krijgsmacht of de krijgsmacht van een
      andere mogendheid houder is, of behorend tot de uitrusting van personen die met een dergelijk luchtvaartuig worden
      vervoerd, indien aan de bij of krachtens die algemene maatregel van bestuur terzake gestelde regels is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.6.4
    text: |-
      [Artikel 6.55][ref1] is niet van toepassing op het door personeel van de krijgsmacht verrichten van de in dat
      artikel bedoelde handelingen ten aanzien van het nationaal vervoer van andere gevaarlijke stoffen dan ontplofbare
      stoffen of voorwerpen, met luchtvaartuigen waarvan de krijgsmacht of de krijgsmacht van een andere mogendheid
      houder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.6.5
    text: |-
      De[ artikelen 6.60][ref1], [6.61][ref2] en [6.61a][ref3] zijn van overeenkomstige toepassing op het internationaal
      vervoer van gevaarlijke stoffen en het nationaal vervoer van ontplofbare stoffen en voorwerpen met luchtvaartuigen
      waarvan de krijgsmacht of de krijgsmacht van een andere mogendheid houder is met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.6.5.a
    text: |-
      in [artikel 6.60, eerste lid][ref1], in plaats van «als bedoeld in [artikel 6.51, eerste lid][ref2],» wordt gelezen
      «als bedoeld in [artikel 10.7, eerste en tweede lid][ref3]»;


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.6.5.b
    text: |-
      in [artikel 6.61, eerste lid][ref1], in plaats van «[artikel 6.51][ref2]» wordt gelezen
      [artikel 10.7, eerste en tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.7.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur, gedaan op voordracht van Onze Minister van Defensie, worden regels
      gegeven inzake het internationaal vervoer van gevaarlijke stoffen met een luchtvaartuig waarvan de krijgsmacht
      of de krijgsmacht van een andere mogendheid houder is, het daartoe aanbieden of aannemen, alsmede het laden
      in of lossen uit een dergelijk luchtvaartuig of het tijdens het vervoer neerleggen van bedoelde stoffen. De
      [artikelen 6.51, derde lid][ref1], en [6.52][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.7.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur, gedaan op voordracht van Onze Minister van Defensie , worden
      regels gegeven inzake het nationaal vervoer van ontplofbare stoffen of voorwerpen met een luchtvaartuig waarvan de
      krijgsmacht of de krijgsmacht van een andere mogendheid houder is, het daartoe aanbieden of aannemen alsmede het
      laden in of lossen uit een dergelijk luchtvaartuig of het tijdens het vervoer neerleggen van bedoelde stoffen of
      voorwerpen. De [artikelen 6.51, derde lid][ref1], en [6.52][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.7.3
    text: 'De bedoelde regels kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.7.3.a
    text: |-
      het aanwijzen van gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, die niet door de lucht mogen
      worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.7.3.b
    text: |-
      de eisen ten aanzien van constructie, inrichting en uitrusting van luchtvaartuigen waarmee gevaarlijke stoffen als
      bedoeld in het eerste dan wel tweede lid worden vervoerd;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.7.3.c
    text: de belading van luchtvaartuigen met inbegrip van samenlading;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.7.3.d
    text: de eisen waaraan gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.7.3.e
    text: de eisen waaraan de verpakking moet voldoen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.7.3.f
    text: de etiketten of aanduidingen op de verpakking;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.7.3.g
    text: de eisen, waaraan bij het laden en lossen voldaan moet worden;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.7.3.h
    text: |-
      de eisen ten aanzien van constructie, inrichting en uitrusting van inrichtingen, voertuigen of werktuigen met
      behulp waarvan gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, worden geladen of gelost;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.7.3.i
    text: |-
      de melding voorafgaande aan een handeling inzake het vervoer van gevaarlijke stoffen als bedoeld in het eerste dan
      wel tweede lid;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.7.3.j
    text: de begeleiding van het vervoer en de eisen die aan de begeleider worden gesteld;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.7.3.k
    text: |-
      het uitzonderen van gevaarlijke stoffen als bedoeld in het eerste dan wel tweede lid, behorend tot de operationele
      uitrusting of het wapensysteem van het luchtvaartuig, of behorend tot de uitrusting van personen die met het
      luchtvaartuig worden vervoerd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.7
  - number: 10.8.1
    text: |-
      Onze Minister van Defensie kan ontheffing verlenen van de krachtens [artikel 10.7][ref1] gegeven regels, wanneer
      de taakuitvoering met militaire luchtvaartuigen meebrengt, dat die regels in redelijkheid geen toepassing kunnen
      vinden en de veiligheid van het luchtverkeer met het verlenen van de ontheffing niet in gevaar komt. Aan de
      ontheffing kunnen voorschriften of beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.8.2
    text: |-
      Het[ tweede tot en met het vijfde lid van artikel 6.58][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '6'
        hoofdstuk: '6'
  - number: '10.9'
    text: |-
      [Titel 6.6][ref1] is niet van toepassing op vervoer van dieren met luchtvaartuigen waarvan de krijgsmacht of de
      krijgsmacht van een andere mogendheid houder is.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '6'
  - number: 11.1.1
    text: 'Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.1
  - number: 11.1.1.a
    text: |-
      de in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren, met dien verstande dat dit
      toezicht zich niet uitstrekt tot het bepaalde bij of krachtens [titel 6.5][ref2] en de[ artikelen 10.7][ref3] en
      [10.8][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0005555
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: 11.1.1.b
    text: |-
      voor zover het betreft de burgerluchtvaart de hiertoe door Onze Minister van Verkeer en Waterstaat aangewezen
      ambtenaren; de aanwijzing kan inhouden, dat de betrokken ambtenaar slechts belast is met het toezicht op de
      naleving van een of enkele in die aanwijzing genoemde hoofdstukken of artikelen gesteld bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.1
  - number: 11.1.1.c
    text: |-
      voor zover het betreft het vervoer van gevaarlijke stoffen als bedoeld in [titel 6.5][ref1] en
      de[ artikelen 10.7][ref2] en [10.8][ref3], met luchtvaartuigen waarvan de krijgsmacht of de krijgsmacht van een
      andere mogendheid houder is, de hiertoe door Onze Minister van Defensie aangewezen ambtenaren; de aanwijzing kan
      inhouden dat de betrokken ambtenaar slechts belast is met het toezicht op de naleving van een of enkele in die
      aanwijzing genoemde artikelen gesteld bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel10
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0005555
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '10'
        hoofdstuk: '10'
  - number: 11.1.2
    text: |-
      Onze Minister van Verkeer en Waterstaat kan met het oog op de coördinatie van het beleid ten aanzien van het
      toezicht algemene aanwijzingen geven aan de ambtenaren, bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.1
  - number: 11.1.3
    text: Van een besluit als bedoeld in het eerste lid, onderdelen b en c, wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.1
  - number: 11.2.1
    text: |-
      De toezichthoudende ambtenaren kunnen hun bevoegdheid inzage te vorderen van zakelijke gegevens en bescheiden niet
      uitoefenen op taxi-, start- en landingsbanen van een luchtvaartterrein.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.2
  - number: 11.2.2
    text: |-
      Indien de toezichthoudende ambtenaren toegang verlangen tot militaire terreinen of gebouwen geschiedt zulks eerst
      na overleg met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.2
  - number: 11.2.3
    text: |-
      In geval van onmiddellijke dreiging van gevaar zijn de toezichthoudende ambtenaren bevoegd het bedienen of
      opstijgen van luchtvaartuigen in strijd met het bij of krachtens deze wet bepaalde voor ten hoogste zes uren te
      verbieden of te beletten.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.2
  - number: 11.2.4
    text: |-
      [Afdeling 5.2 van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing bij uitoefening van de
      bevoegdheid door toezichthoudende ambtenaren buiten het vluchtinformatiegebied Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.2'
  - number: 11.2a.1
    text: |-
      Tot het toezicht op de naleving van de verplichtingen, voortvloeiend uit de erkenning, bedoeld in
      [artikel 3.25][ref1], behoort in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.2a
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: 3.2.2
  - number: 11.2a.1.a
    text: het periodiek onderzoeken van het erkende bedrijf;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.2a
  - number: 11.2a.1.b
    text: het steekproefsgewijs onderzoeken van door het erkende bedrijf vervaardigde ontwerpen, producten of onderdelen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.2a
  - number: 11.2a.3
    text: |-
      De houder van een erkenning is gehouden tot betaling, overeenkomstig door Onze Minister van Verkeer en Waterstaat
      te stellen regels, van het door Onze Minister van Verkeer en Waterstaat ter zake van de kosten van toezicht
      vastgestelde tarief.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.2a
  - number: 11.3.1
    text: |-
      Met de opsporing van de bij of krachtens deze wet strafbaar gestelde feiten zijn belast de bij of krachtens
      [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren, alsmede de bij besluit van Onze
      Minister van Verkeer en Waterstaat, respectievelijk Onze Minister van Defensie aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 11.3.2
    text: |-
      De opsporingsambtenaren zijn bevoegd het verrichten van werkzaamheden aan boord van luchtvaartuigen of het bedienen
      of opstijgen van luchtvaartuigen in strijd met het bij of krachtens deze wet bepaalde te verbieden of te beletten
      en voor zover het een burgerluchtvaartuig betreft, het luchtvaartuig, waarmee de overtreding wordt begaan naar een
      door hen aangewezen plaats over te brengen of te doen overbrengen en aldaar in bewaring te stellen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.3
  - number: 11.3.3
    text: |-
      De betrokken ambtenaar maakt van de inbewaringstelling proces-verbaal op, dat hij binnen vierentwintig uur zendt
      aan de officier van justitie van de rechtbank binnen het rechtsgebied waarvan de inbewaringstelling geschiedt.
      Een afschrift van het proces-verbaal wordt tegelijkertijd uitgereikt of toegezonden aan de gezagvoerder en aan de
      houder van het betrokken luchtvaartuig. [Artikel 11.7, vierde lid][ref1], is ten aanzien van de gezagvoerder en de
      houder van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.3.4
    text: |-
      De kosten verbonden aan de uitvoering van het tweede lid komen ten laste van de houder van het betrokken
      burgerluchtvaartuig en kunnen door Onze Minister van Verkeer en Waterstaat worden ingevorderd bij dwangbevel,
      dat op kosten van de houder bij deurwaardersexploit wordt betekend en ten uitvoer gelegd op de wijze bij het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] ten aanzien van vonnissen en authentieke akten is voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 11.4.1
    text: |-
      Op eerste vordering van een opsporingsambtenaar is degene, die op grond van artikel 2.1 in het bezit dient te zijn
      van een bewijs van bevoegdheid, een bewijs van gelijkstelling of een medische verklaring, verplicht dat bewijs of
      die verklaring behoorlijk ter inzage af te geven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.4
  - number: 11.4.2
    text: |-
      Op eerste vordering van een opsporingsambtenaar is het lid van het boordpersoneel, dat werkzaamheden verricht
      of aanstalten maakt werkzaamheden te gaan verrichten, verplicht zijn medewerking te verlenen aan een voorlopig
      onderzoek van uitgeademde lucht en daartoe volgens de door de opsporingsambtenaar te geven aanwijzingen ademlucht
      te blazen in een door die ambtenaar aangewezen apparaat.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.4
  - number: 11.5.1
    text: |-
      Een opsporingsambtenaar kan het lid van het boordpersoneel van wie, uit het in [artikel 11.4, tweede lid][ref1],
      bedoelde onderzoek of op andere wijze, naar het oordeel van de opsporingsambtenaar gebleken is dat hij onder
      zodanige invloed van een stof, als bedoeld in [artikel 2.12, eerste lid][ref2], verkeert, dat hij onvoldoende
      in staat is zijn werkzaamheden behoorlijk te verrichten, een vliegverbod opleggen voor de tijd gedurende welke
      redelijkerwijs verwacht mag worden dat deze toestand zal voortduren, tot ten hoogste vierentwintig uren. De vorige
      volzin is van overeenkomstige toepassing op het lid van het boordpersoneel, dat aanstalten maakt zijn werkzaamheden
      te gaan verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.5.2
    text: |-
      In geval van verdenking van overtreding van [artikel 2.12, tweede lid][ref1], kan een opsporingsambtenaar aan het
      betreffende lid van het boordpersoneel een vliegverbod opleggen tot ten hoogste vierentwintig uren.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.5.3
    text: |-
      De opsporingsambtenaar, die een verbod als bedoeld in het eerste of tweede lid oplegt, legt dit vast in een
      beschikking die het tijdstip van ingang en de duur van het verbod bevat.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.5
  - number: 11.5.4
    text: |-
      Het is een lid van het boordpersoneel verboden de werkzaamheden, die hij moet verrichten, te verrichten gedurende
      de tijd waarvoor een vliegverbod als bedoeld in het eerste of tweede lid, geldt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.5
  - number: 11.6.1
    text: |-
      Bij verdenking dat een lid van het boordpersoneel werkzaamheden heeft verricht in strijd met
      [artikel 2.12, eerste of derde lid][ref1], kan de opsporingsambtenaar hem bevelen zijn medewerking te verlenen aan
      een onderzoek als bedoeld in [artikel 2.12, derde lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6.2
    text: |-
      Het lid van het boordpersoneel aan wie het in het eerste lid bedoelde bevel is gegeven, is verplicht ademlucht
      te blazen in een voor het onderzoek bestemd apparaat en gevolg te geven aan alle door de opsporingsambtenaar ten
      dienste van het onderzoek gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.6
  - number: 11.6.3
    text: |-
      De in het tweede lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat het verlenen
      van medewerking aan een ademonderzoek voor hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.6
  - number: 11.6.4
    text: |-
      In het geval, bedoeld in het derde lid, dan wel indien de medewerking van de verdachte niet heeft geleid tot
      een voltooid ademonderzoek, kan de opsporingsambtenaar de verdachte vragen of hij zijn toestemming geeft tot
      het verrichten van een onderzoek als bedoeld in [artikel 2.12, derde lid, onder b][ref1]. Gelijke bevoegdheid
      heeft de opsporingsambtenaar, indien het vermoeden bestaat dat de verdachte onder invloed van een andere in
      [artikel 2.12, eerste lid][ref2], bedoelde stof dan alcoholhoudende drank verkeert.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6.5
    text: |-
      Indien het lid van het boordpersoneel zijn op grond van het vierde lid gevraagde toestemming niet verleent, kan
      de officier van justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van
      Justitie aangewezen ambtenaren van politie hem bevelen zich te onderwerpen aan een bloedonderzoek.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.6
  - number: 11.6.6
    text: |-
      Het lid van het boordpersoneel aan wie is bevolen zich aan een bloedonderzoek te onderwerpen is verplicht aan dit
      bevel gevolg te geven en zijn medewerking te verlenen; hem wordt door een arts zoveel bloed afgenomen als voor het
      onderzoek noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.6
  - number: 11.6.7
    text: |-
      De in het zesde lid genoemde verplichtingen gelden niet voor de verdachte van wie aannemelijk is, dat afname van
      bloed bij hem om bijzondere geneeskundige redenen onwenselijk is.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.6
  - number: 11.6.8
    text: |-
      De krachtens het zevende lid vrijgestelde personen zijn verplicht mee te werken aan een door de officier van
      justitie, door een hulpofficier van justitie of door een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen ambtenaren van politie bevolen onderzoek teneinde op andere wijze dan door bloedonderzoek het gebruik
      van de in [artikel 2.12, eerste lid][ref1] bedoelde stoffen of het in 2.12, derde lid, onder *b* genoemde gehalte
      vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.6.9
    text: |-
      Indien de verdachte niet in staat is zijn wil kenbaar te maken, kan hem met toestemming van de officier van
      justitie, een hulpofficier van justitie of een van de daartoe bij regeling van Onze Minister van Justitie
      aangewezen opsporingsambtenaren, door een arts de in het zesde lid bedoelde hoeveelheid bloed worden afgenomen.
      Een onderzoek van het bloed vindt niet plaats dan nadat de verdachte in de gelegenheid is gesteld zijn toestemming
      daartoe te geven. Zo nodig kan hem overeenkomstig het bepaalde in het vijfde lid worden bevolen zijn medewerking te
      verlenen. De verdachte, aan wie een zodanig bevel is gegeven, is verplicht zijn medewerking te verlenen. Indien de
      verdachte weigert zijn medewerking te verlenen, wordt het bloedmonster vernietigd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.6
  - number: 11.6.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gegeven omtrent de wijze van uitvoering van
      artikel 11.4, tweede lid, en van dit artikel. Deze regels kunnen mede betrekking hebben op de mogelijkheid tot het
      doen verrichten van een tegenonderzoek. Bij regeling van Onze Minister van Justitie worden in de bij die algemene
      maatregel aangegeven gevallen voorschriften ter uitvoering van die regels vastgesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.6
  - number: 11.7.1
    text: |-
      Op de eerste vordering van een opsporingsambtenaar is het lid van het boordpersoneel, tegen wie door een van die
      personen ter zake van overtreding van:
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.7
  - number: 11.7.1.a
    text: |-
      [artikel 2.12][ref1], indien bij een onderzoek als bedoeld in het derde lid, onderdeel a respectievelijk onderdeel
      b, van dat artikel blijkt of bij gebreke van een dergelijk onderzoek een ernstig vermoeden bestaat dat het
      alcoholgehalte van het lid van het boordpersoneel hoger is dan tweehonderdzeventig microgram (270 µg) alcohol per
      liter uitgeademde lucht respectievelijk drievijfde milligram (0,6 mg) alcohol per milliliter bloed, of


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.7.1.b
    text: |-
      [artikel 11.6, tweede, zesde, achtste en negende lid][ref1], proces-verbaal wordt opgemaakt,


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.7.2
    text: |-
      Het ingevorderde bewijs van bevoegdheid of bewijs van gelijkstelling wordt, tegelijk met het proces-verbaal,
      onverwijld opgezonden aan de betrokken officier van justitie. Deze is bevoegd het ingevorderde bewijs van
      bevoegdheid of bewijs van gelijkstelling onder zich te houden, totdat de rechterlijke uitspraak in kracht van
      gewijsde is gegaan of, indien bij die uitspraak het lid van het boordpersoneel de bevoegdheid een luchtvaartuig
      te bedienen is ontzegd, tot het tijdstip waarop die uitspraak, voor wat betreft de bijkomende straf der ontzegging
      voor tenuitvoerlegging vatbaar is geworden. In het laatste geval levert de ambtenaar, na het bovenbedoelde
      tijdstip, het bewijs van bevoegdheid of van gelijkstelling in bij Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.7
  - number: 11.7.3
    text: |-
      Indien de officier van justitie binnen tien dagen na de dag van invordering niet gebruik maakt van de in
      het tweede lid bedoelde bevoegdheid, geeft hij het ingevorderde bewijs onverwijld terug aan de houder.
      Teruggave vindt eveneens plaats, indien ernstig rekening moet worden gehouden met de mogelijkheid, dat aan
      de houder in geval van veroordeling geen onvoorwaardelijke ontzegging van een bevoegdheid als bedoeld in
      [artikel 11.11, tweede lid][ref1], zal worden opgelegd, dan wel geen onvoorwaardelijke ontzegging van langere duur
      dan de tijd gedurende welke het bewijs is ingevorderd of ingevorderd geweest, of indien het onderzoek van de zaak
      op de terechtzitting niet binnen zes maanden na de dag van invordering is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.7.4
    text: |-
      De opsporingsambtenaar, die gebruik maakt van de in het eerste lid bedoelde bevoegdheid, en de officier van
      justitie, die gebruik maakt van de in het tweede lid bedoelde bevoegdheid, doen daarvan onverwijld mededeling aan
      Onze Minister van Verkeer en Waterstaat. Indien de officier van justitie het ingevorderde bewijs van bevoegdheid of
      bewijs van gelijkstelling aan de houder teruggeeft, doet hij daarvan op gelijke wijze mededeling.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.7
  - number: 11.7.5
    text: |-
      In geval van toepassing van het eerste of het tweede lid kan iedere belanghebbende bij klaagschrift daartegen
      opkomen. Het klaagschrift wordt ingediend bij de griffie van het gerecht in feitelijke aanleg binnen welks
      rechtsgebied het feit, dat tot toepassing van het eerste of het tweede lid van dit artikel aanleiding heeft
      gegeven, werd gepleegd dan wel ingevolge [artikel 4 van het Wetboek van Strafvordering][ref1] geacht wordt te zijn
      gepleegd. De rechtbank geeft zo spoedig mogelijk, na de belanghebbende, desverlangd bijgestaan door diens raadsman,
      te hebben gehoord, althans opgeroepen, zijn met redenen omklede beschikking, welke onverwijld aan de belanghebbende
      wordt betekend. Tegen de beschikking kan het openbaar ministerie binnen twee weken daarna en de belanghebbende
      binnen twee weken na de betekening beroep in cassatie instellen. De Hoge Raad beslist zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel4
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '4'
  - number: 11.7.6
    text: |-
      Indien de zaak eindigt zonder oplegging van straf of maatregel of met zodanige oplegging, doch op grond
      van een feit waarvoor toepassing van het eerste of tweede lid niet is toegelaten, kan de rechter op
      verzoek van de gewezen verdachte hem een vergoeding ten laste van de Staat toekennen voor de schade,
      die hij ten gevolge van die toepassing heeft geleden. Onder schade is begrepen het nadeel, dat niet in
      vermogensschade bestaat. De [artikelen 89, derde tot en met zesde lid][ref1], [90][ref2], [91][ref3] en
      [93 van het Wetboek van Strafvordering][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel91
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel93
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '90'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '91'
      - id: ref4
        bwb_id: BWBR0001903
        artikel: '93'
  - number: 11.8.1
    text: |-
      Indien het proces-verbaal, bedoeld in [artikel 11.7, eerste lid][ref1], betreft een lid van het boordpersoneel
      als bedoeld in [artikel 10.1, tweede lid][ref2], stelt de opsporingsambtenaar onverwijld, voor de afloop van
      de in [artikel 11.5, eerste lid][ref3], bedoelde periode, de officier van justitie bij het gerecht, bedoeld in
      [hoofdstuk II][ref4], titel [I][ref5], [III][ref6] of [IV van de Wet militaire strafrechtspraak][ref7] daarvan
      in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0004789#HoofdstukII
      [ref5]: https://wetten.overheid.nl/BWBR0004789#HoofdstukI
      [ref6]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIII
      [ref7]: https://wetten.overheid.nl/BWBR0004789#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.8
    references:
