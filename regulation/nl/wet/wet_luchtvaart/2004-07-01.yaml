        artikel: '11'
        hoofdstuk: '11'
  - number: 11.8a
    text: |-
      [De artikelen 11.4, tweede lid][ref1], [11.5, eerste, derde en vierde lid][ref2], [11.6][ref3], [11.7][ref4] en
      [11.8][ref5] zijn van overeenkomstige toepassing op degene, die luchtverkeersdienstverlening geeft als bedoeld in
      [artikel 5.16][ref6] of 10.2 dan wel een grondstation of een mobiel station als bedoeld in [artikel 5.17][ref7]
      bedient, met dien verstande, dat voor de toepassing van [artikel 11.5][ref8] in plaats van het opleggen van
      een vliegverbod treedt het verbieden van het geven van luchtverkeersdienstverlening of het gebruiken van een
      grondstation als bedoeld in [artikel 5.17][ref9].


