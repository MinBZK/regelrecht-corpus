  - number: 11.10.2
    text: De in het eerste lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.10
  - number: 11.11.1
    text: |-
      Bij veroordeling wegens overtreding van een der in [artikel 11.9, eerste lid][ref1], strafbaar gestelde feiten kan
      de bevoegdheid


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.11.1.a
    text: aan boord van een luchtvaartuig werkzaamheden te verrichten als lid van het boordpersoneel,
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.11
  - number: 11.11.1.b
    text: werkzaamheden te verrichten aan een luchtvaartuig,
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.11
  - number: 11.11.1.c
    text: luchtverkeersdienstverlening te geven,
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.11
  - number: 11.11.2
    text: |-
      Bij veroordeling wegens overtreding van een der in [artikel 11.10, eerste lid][ref1], strafbaar gestelde feiten kan
      een bevoegdheid als bedoeld in het eerste lid voor ten hoogste zes jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.11.3
    text: |-
      Indien tijdens het plegen van een der strafbare feiten, genoemd in [artikel 11.9, eerste lid][ref1], of bij
      of krachtens algemene maatregel van bestuur aangewezen, nog geen drie jaren zijn verlopen na het einde van de
      tijdsduur waarvoor bij een vroegere onherroepelijke veroordeling wegens een van die strafbare feiten of wegens een
      der in [artikel 11.10][ref2] bedoelde strafbare feiten de betrokkene een bevoegdheid als bedoeld in het eerste lid
      is ontzegd, kan hem die bevoegdheid voor ten hoogste zes jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.11.4
    text: |-
      Indien tijdens het plegen van een der strafbare feiten, genoemd in [artikel 11.10, eerste lid][ref1], nog geen zes
      jaren zijn verlopen na het einde van de tijdsduur waarvoor bij een vroegere onherroepelijke veroordeling wegens
      een van die strafbare feiten de betrokkene een bevoegdheid als bedoeld in het eerste lid is ontzegd, kan hem die
      bevoegdheid voor ten hoogste twaalf jaren worden ontzegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.11
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.12.1
    text: |-
      Het is degene, die weet of redelijkerwijs moet weten, dat een hem afgegeven bewijs van bevoegdheid of een daarop
      aangetekende bevoegdverklaring krachtens [artikel 2.5][ref1] is geschorst, verboden gedurende de tijd van schorsing
      werkzaamheden te verrichten, waartoe het geschorste bewijs of de geschorste bevoegdverklaring de bevoegdheid gaf.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.12
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.12.2
    text: |-
      Het is degene, die weet of redelijkerwijs moet weten, dat een hem afgegeven bewijs van bevoegdheid of bewijs
      van gelijkstelling krachtens [artikel 11.7][ref1] is ingevorderd, verboden gedurende de tijd, dat het bewijs is
      ingevorderd, werkzaamheden te verrichten, waartoe het geschorste bewijs of de geschorste bevoegdverklaring de
      bevoegdheid gaf.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.12
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.12.3
    text: |-
      Het is degene, die weet of redelijkerwijs moet weten, dat hem bij rechterlijke uitspraak de bevoegdheid tot het
      verrichten van werkzaamheden als bedoeld in [artikel 11.11][ref1] is ontzegd, verboden gedurende de tijd, dat hem
      die bevoegdheid is ontzegd, die werkzaamheden te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.12
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.13.1
    text: |-
      Bij de toepassing van [artikel 11.11][ref1] gaat de bijkomende straf in en verliest elk aan de veroordeelde
      ingevolge [artikel 2.2][ref2] afgegeven bewijs van bevoegdheid of ingevolge [artikel 2.7][ref3] afgegeven bewijs
      van gelijkstelling zijn geldigheid voor de duur van de ontzegging, zodra de rechterlijke uitspraak voor wat
      genoemde bijkomende straf betreft, voor tenuitvoerlegging vatbaar is geworden. De uitspraak is, voor wat de
      bijkomende straf betreft, niet voor tenuitvoerlegging vatbaar, zolang de termijn, waarvoor hem bij een of meer
      andere rechterlijke uitspraken die bevoegdheid is ontzegd, nog niet verstreken zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel2
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.13.2
    text: |-
      Bij de rechterlijke uitspraak kan worden bepaald, dat de tijd, gedurende welke het bewijs van bevoegdheid van
      de veroordeelde ingevolge [artikel 11.7][ref1] voor het tijdstip, waarop de uitspraak voor wat betreft de in
      [dit artikel][ref2] genoemde bijkomende straf voor tenuitvoerlegging vatbaar is geworden, ingehouden is geweest,
      dan wel ingevolge [artikel 11.8, tweede lid][ref3], een vliegverbod is opgelegd, op de duur van de in het eerste
      lid bedoelde bijkomende straf geheel of gedeeltelijk in mindering zal worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0005555
        artikel: '11'
        hoofdstuk: '11'
  - number: 11.13.3
    text: |-
      Voor wat betreft de in het eerste lid bedoelde bijkomende straf is
      [artikel 557, tweede lid, van het Wetboek van Strafvordering][ref1] op rechterlijke uitspraken niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel557
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.13
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '557'
  - number: 11.14.1
    text: |-
      Het is degene, die een luchtvaartuig bedient, verboden na een ongeval of een landing, waarbij een ander is gedood
      of letsel of schade aan een ander is toegebracht, zich van de plaats van dat ongeval of die landing te verwijderen,
      tenzij hij behoorlijk de gelegenheid heeft geboden tot vaststelling van zijn identiteit en van de identiteit van
      dat luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.14
  - number: 11.14.2
    text: |-
      Niet strafbaar is degene, die een luchtvaartuig bedient en die zich na een ongeval of landing, bedoeld in het
      eerste lid, van de plaats van dat ongeval of die landing verwijdert doch binnen twaalf uren na dat ongeval of
      die landing en voordat hij als verdachte is aangehouden of verhoord, vrijwillig kennis geeft aan een van de
      in [artikel 141 van het Wetboek van Strafvordering][ref1] bedoelde ambtenaren en daarbij zijn identiteit en de
      identiteit van het betrokken luchtvaartuig bekendmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '11.15'
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd tot toepassing van bestuursdwang ter handhaving van de bij of
      krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.15
  - number: 11.16.1
    text: 'Onze Minister van Verkeer en Waterstaat kan een bestuurlijke boete opleggen bij overtreding van:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.16
  - number: 11.16.1.a
    text: artikel 8.12, 8.19, 8.20 of 8.21 of van een beperking of voorschrift als bedoeld in artikel 8.23;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.16
  - number: 11.16.1.b
    text: een maatregel als bedoeld in artikel 8.22.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.16
  - number: 11.16.2
    text: Een boete en een last onder dwangsom kunnen tezamen worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.16
  - number: 11.16.3
    text: 'De boete bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.16
  - number: 11.16.3.a
    text: 100 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.16
  - number: 11.16.3.b
    text: 1 000 000 euro bij een overtreding als bedoeld in het eerste lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.16
  - number: 11.16.4
    text: |-
      Een boete wordt niet opgelegd indien de natuurlijke persoon of rechtspersoon aan wie de overtreding kan worden
      toegerekend aannemelijk maakt dat hem van de overtreding geen verwijt kan worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.16
  - number: 11.16.5
    text: |-
      Bij de vaststelling van de hoogte van de boete wordt in ieder geval rekening gehouden met de ernst en de duur van
      de overtreding en zo nodig met de omstandigheden waaronder de overtreding is gepleegd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.16
  - number: 11.16.6
    text: |-
      De bevoegdheid om een boete op te leggen vervalt vijf jaren na het plegen van de overtreding. Indien tegen de
      boete bezwaar wordt gemaakt of beroep wordt ingesteld, wordt de vervaltermijn opgeschort tot onherroepelijk op het
      bezwaar of beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.16
  - number: 11.17.1
    text: |-
      De boete wordt opgelegd aan degene aan wie de overtreding kan worden toegerekend. Geen boete wordt opgelegd indien
      aan de betrokkene wegens dezelfde gedraging reeds eerder een bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.17
  - number: 11.17.2
    text: |-
      De overtreding wordt toegerekend aan de rechtspersoon waarbij de pleger van de overtreding in dienst is, indien de
      overtreding plaatsvindt tijdens de uitoefening van zijn dienst.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.17
  - number: 11.17.3
    text: In andere gevallen wordt de overtreding toegerekend aan degene die de overtreding pleegt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.17
  - number: 11.18.1
    text: |-
      Van de overtreding wordt een rapport opgemaakt. Het rapport vermeldt in ieder geval de overtreding, het overtreden
      voorschrift en zo nodig een aanduiding van de plaats waar en het tijdstip waarop de overtreding is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.18
  - number: 11.18.2
    text: |-
      De overtreder wordt in de gelegenheid gesteld over het voornemen tot het opleggen van een boete zijn zienswijze
      naar voren te brengen. Bij de uitnodiging daartoe wordt de overtreder het rapport toegezonden of uitgereikt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.18
  - number: 11.18.3
    text: |-
      Degene die aan een handeling vanwege Onze Minister van Verkeer en Waterstaat redelijkerwijs de gevolgtrekking
      kan verbinden dat aan hem een boete zal worden opgelegd, is niet langer verplicht ten behoeve van deze oplegging
      inlichtingen omtrent de overtreding te verstrekken. Hij wordt hierop gewezen alvorens hem mondeling wordt gevraagd
      inlichtingen te verstrekken en in ieder geval wanneer hij in de gelegenheid wordt gesteld over het voornemen tot
      oplegging van de boete zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.18
  - number: 11.18.4
    text: |-
      Aan degene die van de overtreding een rapport heeft opgemaakt, wordt geen mandaat verleend tot het opleggen van
      de boete.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.18
  - number: 11.19.1
    text: |-
      De boete wordt opgelegd bij beschikking. De beschikking vermeldt in ieder geval de overtreding, het overtreden
      voorschrift en het bedrag van de boete.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.19
  - number: 11.19.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen twaalf weken vanaf de dag waarop de boetebeschikking
      is bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.19
  - number: 11.19.3
    text: |-
      De boete en de rente zijn verschuldigd met ingang van de dag na die waarop de beschikking onherroepelijk is
      geworden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.19
  - number: 11.19.4
    text: De boete en de rente worden betaald binnen zes weken nadat zij verschuldigd zijn geworden.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.19
  - number: 11.19.5
    text: |-
      Indien niet is betaald binnen de in het vierde lid genoemde termijn, wordt degene die de boete is verschuldigd
      schriftelijk bevolen binnen twee weken alsnog het bedrag van de boete, de rente en de kosten van de aanmaning,
      te betalen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.19
  - number: 11.20.1
    text: |-
      Bij gebreke van betaling binnen de termijn van twee weken, bedoeld in artikel 11.19, vijfde lid, kan van de
      overtreder de boete, de rente en de op de aanmaning en invordering betrekking hebbende kosten, bij dwangbevel
      worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.20
  - number: 11.20.2
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploot betekend en levert een executoriale titel
      op in de zin van het Tweede Boek van het [Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.20
  - number: 11.20.3
    text: Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de staat.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.20
  - number: 11.20.4
    text: |-
      Het verzet schorst de tenuitvoerlegging. Op verzoek van de staat kan de rechter de schorsing van de
      tenuitvoerlegging opheffen.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.20
  - number: '12.2'
    text: |-
      Onze Minister van Verkeer en Waterstaat zendt drie jaar na de inwerkingtreding van deze wet aan de Staten-Generaal
      een verslag over de werking en de doeltreffendheid van de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.2
  - number: 12.3.2
    text: |-
      De krachtens het [Luchtverkeersreglement][ref1] 1980 (*Stb.* 1980, 786) door of vanwege Onze Minister gegeven
      nadere regels, alsook de krachtens het [Luchtverkeersreglement][ref2] 1980 door of vanwege Onze Minister gegeven
      vrijstellingen, ontheffingen en de daaraan verbonden voorschriften blijven nog twee jaar na het in werking treden
      van deze wet van kracht, tenzij zij op een vroeger tijdstip worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0005775
      [ref2]: https://wetten.overheid.nl/BWBR0005775
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0005775
      - id: ref2
        bwb_id: BWBR0005775
  - number: 12.3.3
    text: |-
      De wet van 8 december 1971, *Stb.* 719, houdende inning van vergoedingen voor het gebruik van het luchtruim, wordt
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.3
  - number: '12.4'
    text: |-
      De ambtenaren die op het moment van inwerkingtreding van titel 5.3 van deze wet tot het personeel van de directie
      Luchtverkeersbeveiliging van de Rijksluchtvaartdienst van het Ministerie van Verkeer en Waterstaat behoren, gaan
      van rechtswege over in dienst van de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.4
  - number: 12.5.1
    text: |-
      Onze Minister van Verkeer en Waterstaat bepaalt in overeenstemming met Onze Minister van Financiën welke
      vermogensbestanddelen van de Staat worden toegerekend aan de LVNL.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.5
  - number: 12.5.2
    text: |-
      De in het eerste lid bedoelde vermogensbestanddelen gaan op de datum van inwerkingtreding van deze wet onder
      algemene titel over op de LVNL tegen een door Onze Minister van Verkeer en Waterstaat in overeenstemming met Onze
      Minister van Financiën te bepalen waarde.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.5
  - number: 12.5.3
    text: |-
      De in [het eerste lid van dit artikel][ref1] bedoelde overgang van vermogensbestanddelen wordt aangemerkt als
      storting op geldleningen van de Staat aan de LVNL. De voorwaarden van de geldlening worden door Onze Minister
      van Verkeer en Waterstaat in overeenstemming met Onze Minister van Financiën vastgesteld, waarbij een door Onze
      Minister van Verkeer en Waterstaat in overeenstemming met onze Minister van Financiën te bepalen deel van het te
      lenen bedrag achtergesteld zal zijn bij alle andere verplichtingen van de LVNL.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel12
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.5.4
    text: |-
      Ten aanzien van de in [het eerste lid van dit artikel][ref1] bedoelde vermogensbestanddelen welke in openbare
      registers te boek zijn gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden. De daartoe
      nodige opgaven worden door de zorg van Onze Minister van Financiën aan de bewaarders van de desbetreffende
      registers gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel12
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.5
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '12'
        hoofdstuk: '12'
  - number: 12.5.5
    text: |-
      Ter zake van de verkrijging door de LVNL van de vermogensbestanddelen bedoeld in het eerste lid, blijft de heffing
      van overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.5
  - number: '12.6'
    text: |-
      In afwijking van het bepaalde in [artikel 5.31][ref1] benoemt Onze Minister van Verkeer en Waterstaat de leden van
      de raad van toezicht, bedoeld in [artikel 5.31, tweede lid onder a, b, c, en d][ref2] de eerste maal als volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005555#Artikel5
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.3
      - id: ref2
        bwb_id: BWBR0005555
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: 5.3.3
  - number: 12.6.a
    text: een lid wordt benoemd op voordracht van Onze Minister van Defensie;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.6
  - number: 12.6.b
    text: een lid wordt benoemd uit de kring van de in Nederland werkzame luchtvaartmaatschappijen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.6
  - number: 12.6.c
    text: een lid wordt benoemd uit de kring van de exploitanten van Nederlandse luchtvaartterreinen;
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.6
  - number: 12.6.d
    text: |-
      een lid, tevens voorzitter, wordt benoemd op voordracht van de vier reeds benoemde leden van de raad van toezicht,
      voor een periode van drie jaren.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.6
  - number: '12.7'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.7
  - number: '12.8'
    text: 'Deze wet wordt aangehaald als: Wet luchtvaart.'
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel12.8
