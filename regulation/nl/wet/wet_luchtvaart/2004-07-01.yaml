        hoofdstuk: IV
  - number: 11.8.5
    text: |-
      Ten aanzien van het vliegverbod, bedoeld in het tweede lid, is [artikel 11.5, vierde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel11
    url: https://wetten.overheid.nl/BWBR0005555/2004-07-01#Artikel11.8
    references:
