  text: |-
    Gelet op artikel 1 van het Landbouwkwaliteitsbesluit groenten en fruit (Stb. 1977, 490);

    Gehoord het Landbouwschap, het Produktschap voor Groenten en Fruit, het Bedrijfschap voor de Groothandel en de
    Tussenpersonen in Groenten en Fruit, het Bedrijfschap voor de Detailhandel in Aardappelen, Groenten en Fruit, het
    Uitvoer-Controle Bureau voor Tuinbouwprodukten, de Adviescommissie Warenwet, de Consumentenbond en het Konsumenten
    Kontakt,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003129/2001-12-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Onder groenten en fruit, als bedoeld in artikel 1 van het Landbouwkwaliteitsbesluit groenten en fruit (Stb. 1977,
      490), worden verstaan: - Aardbeien
        - Abrikozen
        - Andijvie
        - Appelen en Peren
        - Artisjokken
        - Asperges
        - Aubergines
        - Augurken
        - Avocado's
        - Bananen
        - Bessen van de ‘Ribes L’-variëteiten
        - Bessen van de ‘Vaccinium L’-variëteiten
        - Bleekselderij
        - Bloemkool
        - Boerenkool
        - Bramen
        - Broccoli
        - Capucijners
        - Champignons
        - Chinese kool
        - Citrusvruchten
        - Courgettes
        - Doperwten
        - Druiven
        - Frambozen
        - Kersen (w.o. Morellen)
        - Kervel
        - Kiwi
        - Knoflook
        - Knolselderij
        - Knolvenkel
        - Komkommers
        - Koolrabi
        - Koolrapen
        - Krenten en rozijnen
        - Kropsla
        - Kroten
        - Kruisbessen
        - Meloenen
        - Nectarine
        - Paksoi
        - Paprika
        - Perziken
        - Peterselie
        - Peulen
        - Postelein
        - Prei
        - Pruimen
        - Raapstelen
        - Rabarber
        - Radijs
        - Rettich
        - Schorseneren
        - Selderij
        - Sjalotten
        - Sluitkool
        - Snijbonen en Slabonen (w.o. spek- en pronkbonen)
        - Spinazie
        - Spruiten
        - Tomaten
        - Tuinbonen
        - Uien
        - Veldsla
        - Walnoten
        - Watermeloenen
        - Witlof
        - Wortelen
    url: https://wetten.overheid.nl/BWBR0003129/2001-12-05#Artikel1
  - number: '2.1'
    text: 'Deze regeling kan worden aangehaald als: Landbouwkwaliteitsregeling aanwijzing groenten en fruit.'
    url: https://wetten.overheid.nl/BWBR0003129/2001-12-05#Artikel2
  - number: '2.2'
    text: |-
      Zij treedt in werking met ingang van de dag waarop het [Landbouwkwaliteitsbesluit groenten en fruit][ref1] in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003120
