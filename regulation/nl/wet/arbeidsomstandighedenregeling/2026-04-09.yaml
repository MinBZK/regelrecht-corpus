      kan worden aangewezen een instelling die voldoet aan de eisen vastgelegd in Deel 2 van het Certificatieschema
      Arbodiensten dat is vastgesteld door de Stichting Beheer Certificatieregeling Arbodiensten op 9 november 2018 en
      door de minister is gepubliceerd in de Staatscourant van 5 december 2018, Stcrt. 2018, 68321.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
