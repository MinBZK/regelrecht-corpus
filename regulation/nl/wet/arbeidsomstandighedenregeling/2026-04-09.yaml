        paragraaf: '3.2'
  - number: '3.3'
    text: |-
      Het veiligheids- en gezondheidszorgsysteem is gebaseerd op een procesgerichte internationaal erkende norm voor de
      beheersing van veiligheid, gezondheid, kwaliteitszorg of milieu.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.3
  - number: 3.4.1
    text: Het veiligheids- en gezondheidszorgsysteem wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.4
  - number: 3.4.2
    text: |-
      In de beschrijving van het veiligheids- en gezondheidszorgsysteem wordt aangegeven wat de onderdelen van dit
      systeem inhouden en hoe de samenhang is tussen deze onderdelen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.4
  - number: 3.5.1
    text: |-
      Het veiligheids- en gezondheidszorgsysteem wordt regelmatig doorgelicht op basis van internationaal erkende normen
      voor het doorlichten van zorgsystemen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.5
  - number: 3.5.2
    text: |-
      De aard en de frequentie van de doorlichting wordt zodanig gekozen dat de doeltreffendheid van het veiligheids- en
      gezondheidszorgsysteem telkens na een periode van drie jaar kan worden bepaald.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.5
  - number: 3.6.1
    text: 'Er wordt een veiligheids- en gezondheidsdocument opgesteld voor de volgende mijnbouwwerken:'
