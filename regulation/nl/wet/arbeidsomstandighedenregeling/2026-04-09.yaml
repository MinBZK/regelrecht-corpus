    text: |-
      Indien sinds de afgifte van het certificaat, bedoeld in het eerste, tweede en derde lid, een periode van meer dan
      24 maanden is verstreken, wordt een verzoek als bedoeld in die leden slechts ingewilligd als door de houder van het
      certificaat is aangetoond dat hij in de periode van 24 maanden vanaf de datum van afgifte van het certificaat:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel9.1
  - number: 9.1.6.a
    text: |-
