  - number: 2.0e.1.a
    text: |-
      bij de melding van leidinggevenden en deskundigen bij de krijgsmacht, bedoeld in
      [artikel 2.5h, eerste lid, onder b en c, van het besluit][ref1] kan worden volstaan met het noemen van de functies
      met bereikbaarheidsgegevens; en


