$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: arbeidsomstandighedenregeling
regulatory_layer: WET
publication_date: '2018-12-06'
valid_from: '2026-04-09'
bwb_id: BWBR0008587
url: https://wetten.overheid.nl/BWBR0008587/2026-04-09
preamble:
  text: |-
    Gelet op de artikelen 7, vierde lid, onder b, 9, vierde en zesde lid, 10, vijfde lid, 41, eerste lid, en 42, tweede
    lid, van de Arbeidsomstandighedenwet, artikel 6 van de Wet arbeid gehandicapte werknemers en artikel 11 van de
    Algemene wet erkenning EG-hoger-onderwijsdiploma's;

    Voorts gelet op de artikelen 2.7, tweede en derde lid, 2.8, 2.15, eerste en derde lid, 2.24, eerste lid, 4.7,
    eerste, derde en vijfde lid, 4.8, tweede tot en met vijfde lid4.9, zevende lid, 4.10, tweede en derde lid, 4.14,
    vijfde lid, 4.16, eerste lid, 4.42, vijfde lid, 4.50, tweede lid, 4.54, derde en vijfde lid, 4.60, vierde en vijfde
    lid, 4.65, eerste lid, onder a en b, 4.66, onder a en b, 4.67, eerste en vijfde lid, 4.68, eerste lid, 4.7.0, derde
    en vijfde lid, 4.71, eerste lid, 4.72, eerste lid, 4.73, 5.12, 6.17, derde lid, 7.19, achtste tot en met negende en
    elfde lid, 7.29, zesde en zevende lid, 7.32, tweede lid, en vierde tot en met zevende lid, 8.4, tweede lid, van het
    Arbeidsomstandighedenbesluit;

    Gezien de adviezen van de Sociaal Economische Raad van 28 juli 1995, kenmerk 95/35, en 28 maart 1996, kenmerk
    96/31.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            besluit:

              het [Arbeidsomstandighedenbesluit][ref1];



            b
            de minister:

              de Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 1.1a
    text: |-
      In het jaarverslag van een certificerende instelling, bedoeld in [artikel 1.5eb, eerste lid, van het besluit][ref1]
      worden ten minste de volgende onderwerpen behandeld:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.1a.a
    text: de door de instelling afgegeven, ingetrokken, geschorste dan wel geweigerde certificaten;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
  - number: 1.1a.b
    text: wijzigingen in de op het werkveld van de instelling betrekking hebbende accreditaties, reglementen en procedures;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
  - number: 1.1a.c
    text: wijzigingen in de op het werkveld van de instelling betrekking hebbende taakverdeling;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
  - number: 1.1a.d
    text: wijzigingen in de bestuurssamenstelling;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
  - number: 1.1a.e
    text: wijzigingen in de statuten of het huishoudelijk reglement;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
  - number: 1.1a.f
    text: uitbesteding van werkzaamheden aan onderaannemers of uitvoering door dochterondernemingen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
  - number: 1.1a.g
    text: structurele knelpunten op het werkveld van de instelling die zich in de uitvoeringspraktijk hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
  - number: 1.1a.h
    text: het gevoerde overleg en de samenwerking op het werkveld met andere certificerende instellingen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
  - number: 1.1a.i
    text: door de instelling ontvangen klachten en de wijze van afhandeling daarvan;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
  - number: 1.1a.j
    text: |-
      tegen de beslissingen van de instelling ingediende bezwaren en ingestelde beroepen en de wijze van afhandeling
      daarvan;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
  - number: 1.1a.k
    text: een financieel verslag betreffende de activiteiten waarvoor de instelling is aangewezen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1a
  - number: 1.1b.1
    text: |-
      Voor zover ten gevolge van een verzoek of handeling dan wel nalaten van de aanvrager van een certificaat als
      bedoeld in deze regeling, extra kosten worden gemaakt in verband met de afgifte van het certificaat, worden deze
      kosten doorberekend aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1b
  - number: 1.1b.2
    text: |-
      De kosten verbonden aan de afgifte van een certificaat worden bij de aanvraag voldaan overeenkomstig de
      aanwijzingen van de instelling.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1b
  - number: 1.1c.1
    text: |-
      De verwerker, genoemd in [artikel 1.5k, tweede lid, van het besluit][ref1], voert een deugdelijk beheer ten aanzien
      van de registers, genoemd [artikel 1.5j, eerste lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.1c.2
    text: |-
      De registers, genoemd in [artikel 1.5j, eerste lid, onderdelen a tot en met c, van het besluit][ref1], bevatten
      tevens het gegeven, bedoeld in [artikel 1.5m, eerste lid, onder d, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.1ca.1
    text: |-
      De identificerende gegevens en gegevens over de bekwaamheid, bedoeld in de
      [artikelen 1.5l][ref1] en [1.5m van het besluit][ref2], zijn voor de registers, genoemd in
      [artikel 1.5j, eerste lid, onderdelen a tot en met d en f, van het besluit][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1ca
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.1ca.1.a
    text: de voornaam- of namen en achternaam;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1ca
  - number: 1.1ca.1.b
    text: de geboortedatum;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1ca
  - number: 1.1ca.1.c
    text: een kopie of scan van documenten waaruit de vereiste kennis en vaardigheden blijken.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1ca
  - number: 1.1ca.2
    text: |-
      De identificerende gegevens en gegevens over de bekwaamheid, bedoeld in de [artikelen 1.5l][ref1] en
      [1.5m van het besluit][ref2], zijn voor het Register duikarbeid brandweer en politie:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1ca
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.1ca.2.a
    text: |-
      de gegevens, genoemd in het eerste lid, de veiligheidsregio waarin de medewerker werkzaam is en het duikteam
      waartoe de medewerker behoort, indien het de registratie of herregistratie van een medewerker van de brandweer
      betreft;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1ca
  - number: 1.1ca.2.b
    text: |-
      het persoonsnummer dat de politie aan de medewerker heeft toegekend en een geanonimiseerde kopie of scan van
      documenten waaruit de vereiste kennis en vaardigheden blijken, indien het de registratie of herregistratie van een
      medewerker van de politie betreft.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1ca
  - number: 1.1d.1
    text: |-
      De persoon die zich wil laten registeren of herregistreren in een register, genoemd in
      [artikel 1.5j, eerste lid, van het besluit][ref1], verstrekt de gegevens die op grond van
      [artikel 1.5l, eerste lid, onderdelen a tot en met c, van het besluit][ref2] hiervoor zijn vereist aan de verwerker
      van het betreffende register. De persoon die zich wil laten registreren of herregisteren in een register als
      bedoeld in [artikel 1.1c, tweede lid][ref3], verstrekt daarbij tevens het gegeven bedoeld in artikel 1.5l, eerste
      lid, onderdeel d, van het besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.1b
  - number: 1.1d.2
    text: |-
      De verwerker van het register kan bepalen dat de persoon, bedoeld in het eerste lid, een of meer gegevens als
      bedoeld in [artikel 1.5l, eerste lid, van het besluit][ref1] in digitale vorm verstrekt. Daartoe zorgt de verwerker
      voor een permanent bereikbare en volgens de stand van de techniek beveiligde website.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.1d.3
    text: |-
      De persoon, bedoeld in het eerste lid, legitimeert zich bij de verwerker zodanig dat deze zijn identiteit kan
      vaststellen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1d
  - number: 1.1d.4
    text: De verwerker verstrekt de geregistreerde of geherregistreerde een bewijs van registratie of herregistratie.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1d
  - number: 1.1e.1
    text: 'De administratie van het register is zodanig ingericht dat op verzoek van:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1e
  - number: 1.1e.1.a
    text: |-
      de geregistreerde of geherregistreerde tijdig aan hem de gegevens, bedoeld in
      [artikel 1.5m, eerste lid, van het besluit][ref1] worden verstrekt die over hem in het register zijn opgenomen, ten
      behoeve van controle op juistheid en volledigheid;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.1e.1.b
    text: |-
      de werkgever van een werknemer, de opdrachtgever van een zelfstandige of de door de werkgever of opdrachtgever
      gemachtigde aan hem tijdig meegedeeld wordt of de door hem in zijn verzoek vermelde persoon in het register is
      opgenomen, en zo ja met welke status en voor welk werkveld of welke werkvelden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1e
  - number: 1.1e.1.c
    text: |-
      een andere direct betrokkene tijdig aan hem meegedeeld wordt of de door hem in zijn verzoek vermelde persoon in het
      register is opgenomen en zo ja met welke status en voor welk werkveld of welke werkvelden; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1e
  - number: 1.1e.1.d
    text: |-
      de toezichthouder tijdig aan hem de gegevens, bedoeld in [artikel 1.5m, eerste lid, van het besluit][ref1], worden
      verstrekt die voor de naleving van de bij en krachtens de wet gegeven voorschriften van belang zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.1e.2
    text: |-
      De personen, bedoeld in het eerste lid, onderdelen a en d, legitimeren zich bij de verwerker zodanig dat deze kan
      vaststellen dat zij geregistreerde of geherregistreerde onderscheidenlijk toezichthouder zijn.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1e
  - number: 1.1f.1
    text: |-
      De geregistreerde of geherregistreerde kan de minister gemotiveerd verzoeken de in het
      register opgenomen gegevens, bedoeld in [artikel 1.5m, eerste lid, van het besluit][ref1] en de
      [artikelen 1.9a, eerste, vijfde en zesde lid][ref2], en [1.9d, tweede lid][ref3], aan te passen of te verwijderen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 1.1f.2
    text: |-
      In voorkomend geval doet de geregistreerde of geherregistreerde de minister met het verzoek, bedoeld in het eerste
      lid, nieuwe gegevens toekomen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1f
  - number: 1.1f.3
    text: |-
      [Artikel 1.1d, tweede, derde en vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1f
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.1b
  - number: 1.1g
    text: 'De minister informeert de geregistreerde of geherregistreerde desgevraagd over:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1g
  - number: 1.1g.a
    text: |-
      door hem genomen besluiten betreffende een verzoek om informatie of inzage als bedoeld in
      [artikel 1.1e, eerste lid, onder b, c en d][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1g
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: 1.1b
  - number: 1.1g.b
    text: |-
      door hem anders dan op verzoek van de geregistreerde of geherregistreerde in dat register aangepaste gegevens dan
      wel uit het register verwijderde gegevens.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1g
  - number: 1.1h.1
    text: |-
      De geregistreerde of geherregistreerde voorkomt misbruik en het zoekraken van het bewijs van registratie of
      herregistratie door derden.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1h
  - number: 1.1h.2
    text: |-
      De constatering van misbruik en het zoekraken van het bewijs van registratie of herregistratie meldt de
      geregistreerde of geherregistreerde binnen tien dagen schriftelijk of digitaal aan de minister.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.1h
  - number: '1.2'
    text: |-
      Voor zover in deze regeling regels zijn gesteld over opleidingen zijn de [artikelen 1.3 tot en met 1.8][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '1.3'
    text: |-
      De opleiding wordt gegeven aan de hand van aan de cursisten ter beschikking gesteld overzichtelijk schriftelijk
      opleidingsmateriaal van voldoende didactische kwaliteit.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.3
  - number: '1.4'
    text: |-
      De docenten beschikken voor de onderwerpen die zij tijdens de opleiding behandelen aantoonbaar over ruime
      theoretische, praktische en didactische kennis of vaardigheden.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.4
  - number: 1.5.1
    text: De opleidingsinstelling beschikt over adequate opleidingsfaciliteiten.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.5
  - number: 1.5.2
    text: |-
      De opleidingsinstelling biedt de opleiding ten minste twee maal per jaar aan en voert haar ten minste eenmaal per
      jaar uit.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.5
  - number: 1.5.3
    text: |-
      De opleidingsinstelling legt de verantwoordelijkheden en bevoegdheden van alle betrokkenen bij de opleiding
      schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.5
  - number: 1.5.4
    text: De opleidingsinstelling treft adequate maatregelen om de veiligheid van de cursisten zoveel mogelijk te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.5
  - number: 1.6.1
    text: De toetsing van de eindtermen vindt plaats door middel van een examen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.6
  - number: 1.6.2
    text: De opleidingsinstelling neemt de examens af aan de hand van een deugdelijk en op schrift gesteld examenreglement.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.6
  - number: '1.7'
    text: |-
      De opleidingsinstelling overhandigt de cursist die het examen met goed gevolg heeft afgelegd, een op naam gesteld
      schriftelijk bewijs, getekend door twee leden van de examencommissie dan wel het hoofd van de opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.7
  - number: '1.8'
    text: |-
      De opleidingsinstelling voert een deugdelijke administratie waarin de persoonlijke gegevens van de cursist en de
      datum waarop het schriftelijk bewijs, bedoeld in [artikel 1.7][ref1] is uitgereikt in ieder geval zijn opgenomen en
      waarin de periode is bepaald gedurende welke de examenopgaven en de uitwerkingen daarvan worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '1.9'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9
  - number: 1.9.a
    text: |-
      *wet:* [Algemene wet erkenning EU-beroepskwalificaties][ref1];


