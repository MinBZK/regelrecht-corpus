      de minister of, indien de minister een instelling heeft aangewezen als bedoeld in [artikel 2.7][ref2], door die
      instelling afgegeven indien wordt voldaan aan de eisen vastgelegd in Deel 1 van het Certificatieschema Arbodiensten
      dat is vastgesteld door de Stichting Beheer Certificatieregeling Arbodiensten op 9 november 2018 en door de
      minister is gepubliceerd in de Staatscourant van 5 december 2018, Stcrt. 2018, 68321.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.8
