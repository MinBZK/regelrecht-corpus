  - number: 1.9a.1
    text: |-
      Het verzoek om registratie of herregistratie, bedoeld in [artikel 1.5j, vijfde lid, van het besluit][ref1], dan wel
      om een certificaat van vakbekwaamheid als bedoeld in [artikel 1.5h van het besluit][ref2], wordt ingediend bij de
      minister, of indien de minister een certificerende instelling als bedoeld in [artikel 1.5a van het besluit][ref3]
      heeft aangewezen, bij die instelling, onder verstrekking van de volgende documenten:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.9a.1.a
    text: |-
      de documenten betreffende nationaliteit en verblijf, bedoeld in
      [artikel 13, eerste lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel13
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '13'
  - number: 1.9a.1.b
    text: |-
      een gewaarmerkte kopie van een in een betrokken staat verkregen opleidingstitel of bekwaamheidsattest waarop de
      aanvrager zich beroept;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
  - number: 1.9a.1.c
    text: |-
      in voorkomend geval een bewijs van zijn beroepservaring, waarbij in ieder geval inzicht wordt verschaft in de duur
      van deze beroepservaring en de onderdelen en inhoud waaruit de beroepswerkzaamheden hebben bestaan;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
  - number: 1.9a.1.d
    text: |-
      een verklaring omtrent het gedrag als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref1] of een
      met die verklaring overeenkomend document als bedoeld in [artikel 14, eerste lid, van de wet][ref2], of een attest
      waaruit blijkt van een verklaring onder ede of plechtige verklaring als bedoeld in artikel 14, tweede lid, van de
      wet indien een dergelijke verklaring ook van eigen onderdanen wordt vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0014194
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel14
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0014194
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '14'
  - number: 1.9a.1.e
    text: |-
      een document inzake gezondheid als bedoeld in [artikel 15 van de wet][ref1] indien een dergelijk document ook van
      eigen onderdanen wordt vereist; en


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel15
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '15'
  - number: 1.9a.1.f
    text: |-
      indien het verzoek en de in de onderdelen b, c, d en e bedoelde documenten in een andere dan de Nederlandse
      taal zijn gesteld, wordt op verzoek van de minister, dan wel de door hem aangewezen instelling, bedoeld in
      [artikel 1.5b van het besluit][ref1], zo nodig een vertaling in het Nederlands overlegd die is opgesteld door een
      beëdigd vertaler. Indien de minister of hiervoor genoemde instelling daarmee instemt, kan een vertaling van de
      documenten in een andere taal dan het Nederlands worden overlegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.9a.2
    text: |-
      De minister of, indien de minister een certificerende instelling als bedoeld in
      [artikel 1.5b van het besluit][ref1], heeft aangewezen, die instelling, stelt in het kader van de erkenning
      van beroepskwalificaties vast of de verzoeker beschikt over het beroepskwalificatieniveau, bedoeld in de
      [artikelen 6 en 9 van de wet][ref2] en met inachtneming van de termijnen, genoemd in [artikel 19 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0023066#Artikel19
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0023066
        artikel: '19'
  - number: 1.9a.3
    text: |-
      Met inachtneming van [artikel 11 van de wet][ref1] stelt de minister of indien de minister een certificerende
      instelling als bedoeld in [artikel 1.5b van het besluit][ref2], heeft aangewezen, die instelling, de verzoeker op
      de hoogte van de eis van het met goed gevolg afleggen van een compenserende maatregel.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.9a.4
    text: |-
      De kosten verbonden aan het in behandeling nemen van een verzoek als bedoeld in het eerste lid, en aan het afleggen
      van een compenserende maatregel als bedoeld in [artikel 11 van de wet][ref1], worden doorberekend aan de verzoeker.
      Deze kosten worden bij de verzoek voldaan overeenkomstig de aanwijzingen van de certificerende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
  - number: 1.9a.5
    text: |-
      In geval op grond van [artikel 11 van de wet][ref1] aan de verzoeker de eis wordt gesteld dat hij een
      aanpassingsstage volgt:


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
  - number: 1.9a.5.a
    text: 'wordt de verzoeker geïnformeerd over:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
  - number: 1.9a.5.a.1°
    text: de ontbrekende kennis, vaardigheden en competenties waarop de aanpassingsstage betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
  - number: 1.9a.5.a.2°
    text: de duur van de aanpassingsstage;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
  - number: 1.9a.5.a.3°
    text: overige eisen die het kader van de aanpassingsstage worden gesteld; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
  - number: 1.9a.5.b
    text: |-
      verricht de verzoeker tijdens deze periode werkzaamheden onder verantwoordelijkheid en begeleiding van een
      deskundige die is geregistreerd of geherregistreerd in het voor het desbetreffende vakgebied wettelijk verplicht
      gestelde register dan wel, in de overige gevallen, die in het bezit is van een certificaat van vakbekwaamheid op
      het desbetreffende vakgebied.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
  - number: 1.9a.6
    text: |-
      In geval op grond van [artikel 11 van de wet][ref1] aan de verzoeker de eis wordt gesteld dat hij een proeve van
      bekwaamheid aflegt, wordt de verzoeker geïnformeerd over:


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '11'
  - number: 1.9a.6.a
    text: de ontbrekende kennis, vaardigheden en competenties waarop de proeve van bekwaamheid betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
  - number: 1.9a.6.b
    text: de kosten; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
  - number: 1.9a.6.c
    text: overige eisen die in het kader van de proeve van bekwaamheid worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9a
  - number: 1.9b.1
    text: |-
      Een dienstverrichter als bedoeld in [artikel 21 van de wet][ref1] die:


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel21
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '21'
  - number: 1.9b.1.a
    text: |-
      een beroep uitoefent, genoemd in de [artikelen 3.5h, derde lid][ref1], en
      [6.16, derde en zesde lid, van het besluit][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '6'
  - number: 1.9b.1.b
    text: |-
      beroepsmatig arbeid verricht als bedoeld in de[ artikelen 4.8, tweede lid][ref1],[ 4.9, tweede lid][ref2],
      [4.10, zesde lid][ref3], [4.54d, vijfde en zevende lid][ref4], en [7.32, eerste lid, van het besluit][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0008498
        artikel: '7'
  - number: 1.9b.2
    text: 'De documenten, bedoeld in het eerste lid, zijn:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
  - number: 1.9b.2.a
    text: |-
      een schriftelijke verklaring waaruit blijkt welk gereglementeerd beroep de meldingsplichtige dienstverrichter in
      Nederland komt verrichten en waarin gegevens zijn opgenomen betreffende de verzekeringsdekking of soortgelijke
      bescherming tegen financiële risico’s van beroepsaansprakelijkheid;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
  - number: 1.9b.2.b
    text: |-
      de documenten betreffende nationaliteit en verblijf, bedoeld in
      [artikel 23, derde lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel23
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '23'
  - number: 1.9b.2.c
    text: een bewijs van beroepskwalificaties;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
  - number: 1.9b.2.d
    text: |-
      een bewijs dat de meldingsplichtige dienstverrichter gerechtigd is om het betreffende beroep uit te oefenen in een
      andere betrokken staat dan Nederland;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
  - number: 1.9b.2.e
    text: |-
      een document dat niet ouder dan drie maanden is, waaruit blijkt dat ten aanzien van de aanvrager geen maatregel
      berustend op een in het buitenland gegeven rechterlijke, tuchtrechtelijke of bestuursrechtelijke beslissing van
      kracht is, op grond waarvan de rechten op de uitoefening van het betreffende beroep in het land waar de beslissing
      is gegeven, geheel of gedeeltelijk, tijdelijk of blijvend zijn verloren;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
  - number: 1.9b.2.f
    text: |-
      indien de aanvrager houder is van een opleidingstitel die is afgegeven in een ander land dan de betrokken staat van
      vestiging, een schriftelijke verklaring waaruit blijkt dat de opleidingstitel door het daarvoor bevoegd gezag van
      de betrokken staat van vestiging is erkend;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
  - number: 1.9b.2.g
    text: |-
      indien het beroep dat of de opleiding van de aanvrager die leidt tot toegang tot of tot uitoefening van het beroep,
      niet is gereglementeerd in de betrokken staat van vestiging, een schriftelijke verklaring waaruit blijkt dat de
      aanvrager in de tien jaar voorafgaand aan de dienstverrichting in Nederland gedurende ten minste een jaar het
      betreffende beroep heeft uitgeoefend in de betrokken staat van vestiging; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
  - number: 1.9b.2.h
    text: |-
      een document inzake gezondheid als bedoeld in [artikel 15 van de wet][ref1] indien een dergelijk document ook van
      eigen onderdanen wordt vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel15
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '15'
  - number: 1.9b.3
    text: |-
      De meldingsplichtige dienstverrichter verstrekt de in het tweede lid, onderdeel a, bedoelde verklaring een maal
      per jaar indien hij voornemens is gedurende dat jaar in Nederland diensten te verrichten. Daarbij verstrekt de
      meldingsplichtige dienstverrichter opnieuw de documenten, genoemd in het tweede lid, voor zover zich daarin een
      wijziging heeft voorgedaan.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
  - number: 1.9b.4
    text: |-
      Indien de documenten, bedoeld in het tweede lid, onderdelen a, c, d, e, f, g en h, in een andere taal dan de
      Nederlandse taal zijn gesteld, wordt op verzoek van de minister, dan wel de door hem aangewezen instelling, bedoeld
      in [artikel 1.5b van het besluit][ref1], zo nodig een vertaling in het Nederlands overlegd die is opgesteld door
      een beëdigd vertaler. Indien de minister of de hiervoor genoemde instelling daarmee instemt, kan een vertaling
      van de documenten in een andere taal dan het Nederlands worden overlegd. Afschriften van deze documenten zijn
      gewaarmerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.9c.1
    text: |-
      Voorafgaand aan de eerste dienstverrichting controleert de minister of, indien de minister een certificerende
      instelling als bedoeld in [artikel 1.5b van het besluit][ref1], heeft aangewezen, die instelling, op grond van
      [artikel 27 van de wet][ref2] de beroepskwalificaties van de meldingsplichtige dienstverrichter.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel27
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '27'
  - number: 1.9c.2
    text: |-
      In aanvulling op de documenten, genoemd in [artikel 1.9b, tweede lid][ref1], verstrekt de meldingsplichtige
      dienstverrichter de minister of, indien de minister een certificerende instelling als bedoeld in
      [artikel 1.5b van het besluit][ref2], heeft aangewezen, die instelling, desgevraagd, met inachtneming van het
      bepaalde in artikel 1.9b, vierde lid, de volgende documenten:


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9c
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.9c.2.a
    text: |-
      het programma van de opleiding tot het desbetreffende beroep, onderverdeeld in theorie en praktijkvakken, met
      opgave van de duur van het onderwijs in die vakken, afkomstig van de instelling waarbij de meldingsplichtige
      dienstverrichter de opleidingstitel heeft behaald;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9c
  - number: 1.9c.2.b
    text: |-
      cijferlijsten en beoordelingen van studieresultaten, praktijkperiode of stages van de meldingsplichtige
      dienstverrichter; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9c
  - number: 1.9c.2.c
    text: bewijsstukken van eventuele beroepservaring en aanvullend onderwijs.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9c
  - number: 1.9c.3
    text: |-
      De minister of, indien de minister een certificerende instelling als bedoeld in
      [artikel 1.5b van het besluit][ref1], heeft aangewezen, die instelling, beslist met inachtneming van de termijnen,
      genoemd in [artikel 28 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0023066#Artikel28
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0023066
        artikel: '28'
  - number: 1.9c.4
    text: |-
      In geval van constatering van wezenlijke verschillen als bedoeld in [artikel 27, derde lid, van de wet][ref1],
      biedt de minister of, indien de minister een certificerende instelling als bedoeld in
      [artikel 1.5b van het besluit][ref2], heeft aangewezen, die instelling, de meldingsplichtige dienstverrichter de
      mogelijkheid om door middel van een proeve van bekwaamheid als bedoeld in [artikel 1.9d][ref3], aan te tonen dat
      hij over de ontbrekende kennis, vaardigheden of competenties beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9c
    references:
      - id: ref1
        bwb_id: BWBR0023066
        artikel: '27'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 1.9c.5
    text: |-
      De meldingsplichtige dienstverrichter ontvangt van de minister of, indien de minister een certificerende instelling
      als bedoeld in [artikel 1.5b van het besluit][ref1] heeft aangewezen, die instelling, een schriftelijke verklaring
      in de vorm van een bewijs van toetsing indien op grond van de controle de beroepskwalificaties voldoende zijn voor
      tijdelijke en incidentele dienstverrichting in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.9d.1
    text: |-
      De meldingsplichtige dienstverrichter wordt door de minister of, indien de minister een certificerende
      instelling als bedoeld in [artikel 1.5b van het besluit][ref1], heeft aangewezen, die instelling, in de
      gelegenheid gesteld de proeve van bekwaamheid, bedoeld in [artikel 1.9c, vierde lid][ref2], af te leggen.
      [Artikel 1.9a, vijfde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref3
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
  - number: 1.9d.2
    text: |-
      Na het afleggen van de proeve van bekwaamheid zendt de minister of, indien de minister een certificerende
      instelling als bedoeld in [artikel 1.5b van het besluit][ref1], heeft aangewezen, die instelling, een bewijs van
      toetsing aan de meldingsplichtige dienstverrichter indien het resultaat van de proeve van bekwaamheid voldoende is
      voor tijdelijke en incidentele dienstverrichting in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.9d.3
    text: |-
      Indien het resultaat van de proeve van bekwaamheid onvoldoende is, heeft de meldingsplichtige dienstverrichter het
      recht nogmaals een proeve van bekwaamheid af te leggen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9d
  - number: 1.9da.1
    text: |-
      Registratie of herregistratie als bedoeld in [artikel 1.5j, vijfde lid, van het besluit][ref1], een certificaat
      dat op grond van [artikel 1.5h van het besluit][ref2] is afgegeven, en een bewijs van toetsing dat op grond van de
      [artikelen 1.9c][ref3] of [1.9d][ref4] is afgegeven, ten behoeve van tijdelijke en incidentele dienstverrichting,
      hebben een geldigheidsduur die gelijk is aan de geldigheidsduur van de registratie of herregistratie in het
      register, genoemd in artikel 1.5j, eerste lid, van het besluit, dan wel van het persoonscertificaat dat op grond
      van [artikel 20 van de wet][ref5], bedoeld in [artikel 1.5f van het besluit][ref6], vereist is voor de uitoefening
      van hetzelfde beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0008587#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0010346#Artikel20
      [ref6]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9da
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref4
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.3'
      - id: ref5
        bwb_id: BWBR0010346
        artikel: '20'
      - id: ref6
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.9da.2
    text: |-
      De geldigheid van het bewijs van toetsing, bedoeld in het eerste lid, kan door de minister worden beperkt of
      beëindigd naar aanleiding van controles die zijn uitgevoerd in het kader van toezicht.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.9da
  - number: 1.11.1
    text: |-
      In dit artikel wordt verstaan onder beroepsziekte: een ziekte of aandoening als gevolg van een belasting die in
      overwegende mate in arbeid of arbeidsomstandigheden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.11
  - number: 1.11.2
    text: |-
      De mededeling van een beroepsziekte, bedoeld in [artikel 9, derde lid, van de wet][ref1] omvat ten minste de
      volgende, niet tot een individuele natuurlijke persoon herleidbare, gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
  - number: 1.11.2.a
    text: de diagnose;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.11
  - number: 1.11.2.b
    text: het geslacht en het geboortejaar van de werknemer;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.11
  - number: 1.11.2.c
    text: de aard en de mate van de belasting in arbeid of arbeidsomstandigheden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.11
  - number: 1.11.2.d
    text: de aard van de werkzaamheden ten tijde van het ontstaan van de beroepsziekte;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.11
  - number: 1.11.2.e
    text: het beroep van de werknemer ten tijde van de blootstelling, en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.11
  - number: 1.11.2.f
    text: de economische activiteit van de werkgever ten tijde van de blootstelling.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.11
  - number: 1.11.3
    text: |-
      De in het tweede lid bedoelde gegevens worden verstrekt overeenkomstig de aanwijzingen van de instelling, bedoeld
      in [artikel 9, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
  - number: 1.12.1
    text: |-
      De minister en de door de minister aangewezen instelling, bedoeld in
      [artikel 9, derde lid, van de Arbeidsomstandighedenwet][ref1] leggen jaarlijks de afspraken over de uitoefening van
      de taken door de aangewezen instelling en de samenwerking vast in uitvoeringsafspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
  - number: 1.12.2
    text: |-
      Op verzoek van en in overleg met de minister dient de aangewezen instelling uiterlijk 1 december van enig
      kalenderjaar een jaarplan in voor het daaropvolgende kalenderjaar. Het jaarplan bevat een begroting. De minister
      beslist over de goedkeuring van het jaarplan.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.12
  - number: 1.12.3
    text: |-
      Op verzoek van de minister en in overleg met de aangewezen instelling kunnen gedurende het kalenderjaar wijzigingen
      in het jaarplan worden aangebracht indien deze verband houden met nadere afspraken die in het verlengde liggen
      van de gemaakte uitvoeringsafspraken, bedoeld in het eerste lid. De minister beslist over de goedkeuring van een
      wijziging in het jaarplan.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.12
  - number: 1.12.4
    text: |-
      De minister en de aangewezen instelling voeren jaarlijks ten minste tweemaal overleg over de voortgang en
      uitvoering van het jaarplan.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.12
  - number: 1.12.5
    text: |-
      Enkel daadwerkelijk door de aangewezen instelling binnen de goedgekeurde begroting gemaakte kosten worden door de
      minister vergoed. De aangewezen instelling voert een gescheiden en op het jaarplan aansluitende administratie met
      betrekking tot de daadwerkelijk gemaakte kosten en verrichte activiteiten.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.12
  - number: 1.12.6
    text: |-
      De aangewezen instelling dient uiterlijk voor 1 april van het kalenderjaar volgend op het kalenderjaar waarop het
      jaarplan betrekking heeft een verantwoording van het jaarplan in. De verantwoording bestaat uit:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.12
  - number: 1.12.6.a
    text: een inhoudelijk verslag met het oog op de beoordeling van de resultaten van de verrichte activiteiten;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.12
  - number: 1.12.6.b
    text: een financiële verantwoording die aansluit bij de goedgekeurde begroting, en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.12
  - number: 1.12.6.c
    text: |-
      een verklaring van een registeraccountant of een Accountant-Administratieconsulent ten aanzien van wie bij de
      inschrijving in het in [artikel 36, eerste lid, van de Wet op de Accountants-Administratieconsulenten][ref1]
      bedoelde register een aantekening is geplaatst als bedoeld in artikel 36, derde lid, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002856#Artikel36
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.12
    references:
      - id: ref1
        bwb_id: BWBR0002856
        artikel: '36'
  - number: 1.12.7
    text: |-
      Na acceptatie van de eindverantwoording verricht de minister de eindbetaling. Indien de activiteiten niet binnen
      de vastgestelde termijn zijn verricht op een wijze die aan de uitvoeringsafspraken voldoet, kan een bedrag in
      mindering worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.12
  - number: 1.12.8
    text: |-
      In afwijking van het tweede lid geldt voor het jaar 2018 dat het jaarplan over dat jaar uiterlijk 15 januari 2018
      wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel1.12
  - number: '2.0'
    text: 'Bij de vastlegging van het preventiebeleid voor zware ongevallen wordt een beschrijving gegeven van:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0
  - number: 2.0.a
    text: de hoofdlijnen van de aard en de omvang van de risico’s van zware ongevallen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0
  - number: 2.0.b
    text: |-
      de beginselen die ten grondslag liggen aan het veiligheidsbeheerssysteem en die inzicht bieden in de samenhang
      tussen het beleid en het veiligheids-beheerssysteem;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0
  - number: 2.0.c
    text: de criteria die worden toegepast bij de vaststelling van de risico’s van zware ongevallen; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0
  - number: 2.0.d
    text: |-
      de beginselen die ten grondslag liggen aan de maatregelen die zijn getroffen om zware ongevallen te voorkomen en
      die inzicht bieden in de samenhang tussen die maatregelen en de risico’s van zware ongevallen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0
  - number: 2.0a.1
    text: |-
      De procedures voor de systematische identificatie en evaluatie van de gevaren en risico’s van zware ongevallen,
      bedoeld in [artikel 2.5, tweede lid, onder a, van het besluit][ref1], hebben in ieder geval betrekking op:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.0a.1.a
    text: |-
      het verrichten van systematisch onderzoek naar de aan een installatie verbonden risico’s van een zwaar ongeval
      tijdens het ontwerp, de bouw, het gebruik en het onderhoud van de installatie, alsmede bij voorgenomen wijzigingen
      ervan;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0a
  - number: 2.0a.1.b
    text: de criteria voor het bepalen van de methoden voor het onderzoek, bedoeld onder a; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0a
  - number: 2.0a.1.c
    text: de methode voor de evaluatie van de gevaren en risico’s van zware ongevallen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0a
  - number: 2.0a.2
    text: |-
      De onderzoeksmethode, bedoeld in het eerste lid, onder b, is afgestemd op de fasen, bedoeld in het eerste lid,
      onder a.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0a
  - number: 2.0a.3
    text: |-
      De onderzoeksmethode, bedoeld in het eerste lid, onder c, is geschikt om vast te stellen welke maatregelen nodig
      zijn ter voorkoming van zware ongevallen of ter beperking van de gevolgen ervan.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0a
  - number: 2.0b.1
    text: |-
      De beschrijving van de scenario’s, bedoeld in [artikel 2.5, tweede lid, onder b, van het besluit][ref1], heeft
      betrekking op de onderdelen van installaties die de grootste risico’s van een zwaar ongeval met zich meebrengen.
      De identificatie van de betreffende onderdelen van de installaties vindt plaats op basis van een gedocumenteerde
      methode.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.0b.2
    text: |-
      Bij de beschrijving van de scenario’s, bedoeld in het eerste lid, komen in ieder geval de elementen aan de orde,
      genoemd in bijlage Ia bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0b
  - number: 2.0c
    text: |-
      In het veiligheidsbeheerssysteem, bedoeld in [artikel 2.5a, eerste lid, van het besluit][ref1] komen in ieder geval
      de elementen aan de orde, genoemd in bijlage Ib bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.0d
    text: |-
      Het intern noodplan, bedoeld in [artikel 2.5b, eerste lid, van het besluit][ref1], bevat in ieder geval de gegevens
      en beschrijvingen, bedoeld in [bijlage Ic][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel2.0d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 2.0e.1
    text: 'Voor de krijgsmacht geldt dat:'
