  - number: 3.2a.1
    text: |-
      De risico’s in het kader van de risico-analyse, bedoeld in [artikel 3.2, onderdeel a][ref1], worden kwalitatief en,
      voor zover mogelijk, kwantitatief bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2a.2
    text: |-
      De grenzen in het kader van bepaling van de acceptatiecriteria, bedoeld in [artikel 3.2, onderdeel b][ref1],
      worden, voor zover mogelijk, kwantitatief bepaald. Voor zover dit niet mogelijk is, worden deze grenzen kwalitatief
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.2a
    references:
