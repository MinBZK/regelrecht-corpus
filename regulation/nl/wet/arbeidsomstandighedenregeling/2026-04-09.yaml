  - number: 9.3.1
    text: |-
      De persoon die op 1 januari 2021 beschikt over een geldig certificaat springmeester 1 wordt op zijn verzoek voor de
      resterende geldigheidsduur van dat certificaat ingeschreven in het Register veilig werken met explosieve stoffen op
      het competentieniveau Springmeester 1 en op het competentieniveau Springmeester industriële reiniging.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel9.3
  - number: 9.3.2
    text: |-
      De persoon die op 1 januari 2021 beschikt over een geldig certificaat springmeester industriële reiniging wordt op
      zijn verzoek voor de resterende geldigheidsduur van dat certificaat ingeschreven in het Register veilig werken met
      explosieve stoffen op het competentieniveau Springmeester 1 en op het competentieniveau Springmeester industriële
      reiniging.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel9.3
  - number: 9.3.3
    text: |-
      De persoon die op 1 januari 2021 beschikt over een geldig certificaat springmeester 2 wordt op zijn verzoek voor de
      resterende geldigheidsduur van dat certificaat ingeschreven in het Register veilig werken met explosieve stoffen op
      het competentieniveau Springmeester 2.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel9.3
  - number: 9.3.4
    text: |-
