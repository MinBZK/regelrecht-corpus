        paragraaf: '4.1'
  - number: '4.14'
    text: |-
      Een certificaat van vakbekwaamheid gasdeskundige als bedoeld in [artikel 3.5h, vierde lid, van het besluit][ref1]
      wordt door de minister of, indien de minister een certificerende instelling heeft aangewezen, de certificerende
      instelling, afgegeven indien de aanvrager voldoet aan de eisen, bedoeld in versie 1 van de Regeling SGT nr. REG/
      SGT/20/001 van de Stichting Hobéon SKO Certificatie, vastgesteld per 15 mei 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
  - number: 4.15.1
    text: |-
      De aanduidingen op verpakkingen als bedoeld in de [artikelen 1.46, vierde lid][ref1] of
      [4.1d, eerste lid, van het besluit][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.15.1.a
    text: |-
      worden gesteld in de Nederlandse taal waarbij naast de Nederlandse taal een andere taal mag worden gebruikt, mits
      in alle gebruikte talen dezelfde gegevens worden vermeld;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.15
  - number: 4.15.1.b
    text: |-
      worden duurzaam op één of meer oppervlakken van de onmiddellijke verpakking van de stof of het mengsel bevestigd en
      zijn horizontaal leesbaar wanneer de verpakking op normale wijze wordt neergezet;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.15
  - number: 4.15.1.c
    text: hebben een zodanige kleur en opmaak dat het gevarenpictogram duidelijk afsteekt;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.15
  - number: 4.15.1.d
    text: |-
      bevatten vermeldingen als bedoeld in de [artikelen 1.46, vierde lid][ref1] of
      [4.1d, eerste lid, van het besluit][ref2] die duidelijk en onuitwisbaar worden aangebracht, duidelijk tegen de
      achtergrond afsteken en een zodanige grootte en spatiëring hebben dat zij gemakkelijk leesbaar zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.15.1.e
    text: |-
      hebben afmetingen die voldoen aan bijlage I, deel 1.2.1, van EG-verordening indeling, etikettering en verpakking
      van stoffen en mengsels.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.15
  - number: 4.15.2
    text: |-
      De vorm, kleur en grootte van een gevarenpictogram voldoen aan bijlage I, deel 1.2.1, van EG-verordening indeling,
      etikettering en verpakking van stoffen en mengsels.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.15
  - number: 4.15.3
    text: De gevarenpictogrammen, signaalwoorden of gevarenaanduidingen worden bij elkaar op het etiket geplaatst.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.15
  - number: 4.16.1
    text: |-
      Een persoon is in het bezit van een bewijs van registratie of herregistratie in het Register veilig werken met
      explosieve stoffen, en is geregistreerd op basis van het Registratieschema veilig werken met explosieve stoffen,
      zoals vastgesteld door het bestuur van de Stichting Veilig Omgaan met Explosieve Stoffen (VOMES) op 12 november
      2024, en door de minister is gepubliceerd in de Staatscourant van 12 december  (Stcrt. 2024-39688), op het
      competentieniveau:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.a
    text: |-
      Basiskennis VOMES, indien hij munitie keurt of test, dan wel andere werkzaamheden verricht als bedoeld
      in[ artikel 4.8, eerste lid, van het besluit][ref1], voor zover geen sprake is van werkzaamheden als bedoeld in de
      onderdelen b tot en met j;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.16.1.b
    text: |-
      Basiskennis opsporing ontplofbare oorlogsresten, indien hij werkzaamheden verricht in een gebied waar zich mogelijk
      ontplofbare oorlogsresten bevinden, die verband houden met het opsporen van ontplofbare oorlogsresten, niet zijnde
      werkzaamheden als bedoeld in onderdeel c tot en met e;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.c
    text: 'Assistent deskundige opsporing ontplofbare oorlogsresten, indien hij:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.c.1°
    text: een Deskundige opsporing ontplofbare oorlogsresten assisteert bij diens werkzaamheden; of
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.c.2°
    text: vermoede ontplofbare oorlogsresten detecteert door middel van non-realtime detectie;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.d
    text: 'Deskundige opsporing ontplofbare oorlogsresten, indien hij oorlogsresten:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.d.1°
    text: benadert;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.d.2°
    text: identificeert; of
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.d.3°
    text: de situatie tijdelijk veilig stelt.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.e
    text: 'Senior deskundige opsporing ontplofbare oorlogsresten, indien hij:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.e.1°
    text: de werkzaamheden uitvoert van een Deskundige opsporing ontplofbare oorlogsresten;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.e.2°
    text: ontplofbare oorlogsresten overdraagt aan de Explosieven Opruimingsdienst Defensie; of
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.e.3°
    text: |-
      toezicht uitoefent op de werkzaamheden van Assistent deskundige opsporing ontplofbare oorlogsresten en de
      Deskundige opsporing ontplofbare oorlogsresten indien dat op grond van het certificatieschema, bedoeld in
      [artikel 4.17f, is vereist][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: 4.2b
  - number: 4.16.1.f
    text: |-
      Schietmeester, indien hij explosieve stoffen gebruikt ten behoeve van geologische verkenning en opsporing of
      winning van delfstoffen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.g
    text: |-
      Springmeester 1, indien hij explosieve stoffen gebruikt ten behoeve van sloop van bouwwerken en objecten waarvan
      het hoogste punt zich maximaal zes meter boven het omringende niveau bevindt en van afzonderlijke constructiedelen
      die geen onderdeel vormen van de dragende constructie;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.h
    text: |-
      Springmeester 2, indien hij explosieve stoffen gebruikt ten behoeve van sloop van bouwwerken en objecten en van
      afzonderlijke constructiedelen daarvan;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.i
    text: |-
      Springmeester industriële reiniging, indien hij explosieve stoffen gebruikt voor de reiniging van industriële media
      waarbij daartoe een springlading of een springsysteem in, op of tegen het industrieel medium wordt geplaatst; of
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.1.j
    text: |-
      Springmeester onder water, indien hij explosieve stoffen gebruikt op of onder de waterspiegel van open wateren
      waarbij de springlading of het springsysteem een schokgolf veroorzaakt die zich door het water voortplant.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16.2
    text: Het eerste lid is niet van toepassing op arbeid verricht door defensiepersoneel.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16
  - number: 4.16a.1
    text: |-
      [Artikel 4.8, tweede lid, van het besluit][ref1] is niet van toepassing op arbeid waarbij wordt gewerkt met munitie
      van de categorieën II of III als bedoeld in [artikel 2, tweede lid, van de Wet wapens en munitie][ref2], voor zover
      het gaat om arbeid verricht door anderen dan defensiepersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '2'
  - number: 4.16a.2
    text: |-
      [Artikel 4.8, tweede lid, van het besluit][ref1] is voorts niet van toepassing op de volgende personen, voor zover
      zij over voldoende kennis, ervaring en vaardigheden beschikken om de genoemde werkzaamheden veilig uit te voeren:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.16a.2.a
    text: |-
      politiemedewerkers werkzaam bij de Dienst Speciale Interventies die bij de uitvoering van hun taken explosieven
      gebruiken;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16a
  - number: 4.16a.2.b
    text: |-
      politiemedewerkers die optreden als begeleider of trainer van politiespeurhonden als bedoeld in
      [artikel 23, onder c, van het Besluit bewapening en uitrusting politie][ref1], wanneer zij politiespeurhonden
      trainen in het herkennen van explosieve stoffen;


      [ref1]: https://wetten.overheid.nl/BWBR0032136#Artikel23
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16a
    references:
      - id: ref1
        bwb_id: BWBR0032136
        artikel: '23'
  - number: 4.16a.2.c
    text: |-
      medewerkers van het Nederlands Forensisch Instituut die onderzoek verrichten aan kleine hoeveelheden explosieven
      die reeds onschadelijk zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.16a
  - number: 4.17a.1
    text: |-
      In deze paragraaf wordt verstaan onder:

              a
              groot vuurwerk:

                professioneel vuurwerk dat bestemd is voor gebruik buiten tijdens een evenement of voorstelling;



              b
              pyrotechnische speciale effecten:

                professioneel vuurwerk dat bestemd is voor gebruik tijdens een evenement of voorstelling met geringe
      publieksafstanden en waarvan door de fabrikant of importeur is aangegeven dat het voor dit gebruik geschikt is.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.17a
  - number: 4.17a.2
    text: |-
      Voor de toepassing van deze paragraaf wordt consumentenvuurwerk als bedoeld in
      [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref1], dat wordt bestemd voor gebruik tijdens een evenement of
      voorstelling of dat wordt bewerkt ten behoeve van een evenement of voorstelling aangemerkt als groot vuurwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.17a
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
  - number: 4.17b.1
    text: |-
      De aanwijzing als certificerende instelling als bedoeld in [artikel 4.9, tweede lid, van het besluit][ref1],
      kan geschieden indien de aanvragende instelling voldoet aan de eisen zoals neergelegd in het Werkveldspecifiek
      document voor aanwijzing en toezicht op certificatie-instellingen behorend bij het certificatieschema voor het
      persoonscertificaat Vuurwerkdeskundige, documentcode WDAT-VD zoals opgenomen in [bijlage XIIa][ref2] bij de
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.17b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 4.17b.2
    text: |-
      Een certificaat vakbekwaamheid professioneel vuurwerk als bedoeld in
      [artikel 4.9, tweede lid, van het besluit][ref1], wordt door de certificerende instelling bedoeld in het
      eerste lid, afgegeven indien de aanvrager voldoet aan de eisen zoals neergelegd in het Werkveldspecifiek
      certificatieschema voor het persoonscertificaat Vuurwerkdeskundige, documentcode WSCS-VD, zoals opgenomen in
      [bijlage XIIb][ref2] bij de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.17b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 4.17e
    text: |-
      Een aanwijzing als certificerende instelling als bedoeld in [artikel 4.10, vijfde lid, van het besluit][ref1],
      kan geschieden indien de aanvragende instelling voldoet aan de criteria, vastgelegd in hoofdstuk 6 van het
      Certificatieschema voor het Opsporen van ontplofbare oorlogsresten, dat is vastgesteld door de Stichting Veilig
      Omgaan met Explosieve Stoffen op 15 oktober 2020 en door de minister is gepubliceerd in de Staatscourant van 13
      november 2020, (Stcrt. 2020, 58198).


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.17e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.17f
    text: |-
      Een certificaat voor het opsporen van ontplofbare oorlogsresten als bedoeld in
      [artikel 4.10, vijfde lid, van het besluit][ref1], wordt door de certificerende instelling afgegeven indien de
      aanvrager voldoet aan de eisen zoals vastgelegd in hoofdstuk 2, 3 en 4 van het Certificatieschema voor het Opsporen
      van ontplofbare oorlogsresten, dat is vastgesteld door de Stichting Veilig Omgaan met Explosieve Stoffen op
      15 oktober 2020 en door de minister is gepubliceerd in de Staatscourant van 13 november 2020, (Stcrt. 2020, 58198).


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.17f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: '4.18'
    text: |-
      Bij de beoordeling van het risico van blootstelling in de individuele ademhalingszone van de werknemer aan
      gevaarlijke stoffen in combinatie, zoals bedoeld in [artikel 4.2, zesde lid, van het besluit][ref1], wordt in geval
      van het risico van blootstelling aan stoffen waarvan bekend is dat deze stoffen hetzelfde gezondheidkundige gevolg
      hebben op hetzelfde orgaansysteem, [bijlage XIIc][ref2] bij de regeling toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 4.19.1
    text: |-
      Als grenswaarden als bedoeld in [artikel 4.3, eerste lid][ref1], in samenhang gelezen met
      [artikel 4.1 van het besluit][ref2] worden aangewezen de waarden die zijn opgenomen in [bijlage XIII][ref3] bij
      deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0008587
  - number: 4.19b
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4.3, vierde en vijfde lid][ref1], of
      [artikel 4.16, vierde tot en met zesde lid, van het besluit][ref2] worden in het plan van aanpak, bedoeld in
      [artikel 5, derde lid, van de wet][ref3] per te realiseren stap van blootstellingsverlaging, in ieder geval
      opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.19b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 4.19b.a
    text: |-
      welke doeltreffende maatregelen zijn genomen om schade aan de gezondheid van de werknemers te voorkomen zolang de
      grenswaarde wordt overschreden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.19b
  - number: 4.19b.b
    text: |-
      welke maatregelen gericht op blootstellingsverlaging in een zo kort mogelijke tijdsspanne worden genomen, waarbij
      de feitelijk te verwachten blootstelling wordt aangegeven alsmede het tijdstip waarop blootstelling onder de
      grenswaarde wordt gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.19b
  - number: 4.19b.c
    text: |-
      een onderbouwing dat de gehanteerde overschrijding van de grenswaarde, gezien de mate en de duur, niet tot
      onaanvaardbare effecten op de gezondheid van de werknemers leidt; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.19b
  - number: 4.19b.d
    text: |-
      een onderbouwing dat verdergaande maatregelen niet eerder dan in de voorgestelde fasering van de
      blootstellingsverlaging kunnen worden genomen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.19b
  - number: 4.20.1
    text: |-
      Als grenswaarden als bedoeld in [artikel 4.16, eerste lid, van het besluit][ref1] worden aangewezen de waarden die
      zijn opgenomen in [bijlage XIII][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 4.20.2
    text: |-
      De resultaten van de beoordeling, bedoeld in [artikel 4.2, eerste lid, van het besluit][ref1] worden voor elke
      stof waarvoor overeenkomstig het eerste lid en [artikel 4.16, tweede lid, van het besluit][ref2] een grenswaarde
      is vastgesteld, getoetst aan die grenswaarde. De toetsing vindt plaats volgens een voor dat doel geschikte
      genormaliseerde methode.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20a1
    text: |-
      Als biologische grenswaarde op grond van [artikel 4.16, eerste lid, van het besluit][ref1], wordt voor lood
      vastgesteld: 30 µg Pb/100 ml bloed.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20a1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20a2.1
    text: |-
      In het kader van de beoordeling, bedoeld in [artikel 4.2, van het besluit][ref1] wordt de concentratie van lood in
      de lucht om de drie maanden gemeten. Er kan worden volstaan met eenmaal per jaar meten, indien er geen verandering
      in de werkmethoden en de omstandigheden van de blootstelling plaatsvindt, en


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20a2
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20a2.1.a
    text: |-
      het loodgehalte in het bloed van geen enkele werknemer, gemeten overeenkomstig
      [artikel 4.10b van het besluit][ref1], meer bedraagt dan 26 µg Pb/100 ml bloed, of


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20a2
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20a2.1.b
    text: |-
      uit twee opeenvolgende voorafgaande metingen is gebleken, dat de concentratie van lood in de lucht minder bedraagt
      dan 20 µg/m3 lucht of dat de omstandigheden van de blootstelling niet merkbaar variëren.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20a2
  - number: 4.20a2.2
    text: |-
      De bepaling van de concentratie van lood in de lucht, als bedoeld in het eerste lid, geschiedt met behulp van de
      atomaire absorptiespectrometrie of een andere analysemethode, die gelijkwaardige resultaten oplevert.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20a2
  - number: 4.20b.1
    text: |-
      In het kader van de beoordeling, bedoeld in [artikel 4.2 van het besluit][ref1], worden de werknemers ten minste
      tweemaal per jaar in de gelegenheid gesteld tot het meten van het loodgehalte in het bloed.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20b.2
    text: |-
      De frequentie van het meten van het loodgehalte in bloed kan worden teruggebracht tot eenmaal per jaar, indien
      het loodgehalte van geen enkele werknemer meer bedraagt dan 21 µg Pb/100 ml bloed en uit de twee opeenvolgende
      voorafgaande metingen is gebleken dat de concentratie van lood in de lucht minder bedraagt dan 20 µg/m3 lucht.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20b
  - number: 4.20b.3
    text: |-
      Het loodgehalte in het bloed als bedoeld in [artikel 4.10b, tweede lid, van het besluit][ref1] wordt gemeten met
      behulp van de atomaire absorptiespectrometrie of een andere gelijkwaardige methode.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20b.4
    text: |-
      De resultaten van de meting, bedoeld in het eerste lid, worden getoetst aan de grenswaarde, bedoeld in
      [artikel 4.20a1][ref1]. De toetsing vindt plaats volgens een voor dat doel geschikte genormaliseerde methode.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20b
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.20b1.1
    text: |-
      Het arbeidsgezondheidskundig onderzoek, bedoeld in [artikel 4.10b van het besluit][ref1], wordt de werknemers ten
      minste eenmaal per jaar aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20b1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20b1.2
    text: |-
      Als invulling van [artikel 4.10b, eerste lid, onderdeel c, van het besluit][ref1], worden werknemers in de
      gelegenheid gesteld om een arbeidsgezondheidskundig onderzoek te ondergaan als de concentratie van lood in de lucht
      hoger is dan 0,015 mg/m3 of als bij een werknemer een bloedloodgehalte van meer dan 9 µg Pb/100 ml bloed wordt
      gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20b1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20b1.3
    text: |-
      Eveneens als invulling van [artikel 4.10b, eerste lid, onderdeel c, van het besluit][ref1], wordt een vrouwelijke
      werknemer in de vruchtbare leeftijd in de gelegenheid gesteld om een arbeidsgezondheidskundig onderzoek te
      ondergaan als bij haar een bloedloodgehalte van meer dan 4,5 µg Pb/100 ml bloed wordt gemeten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20b1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20c
    text: |-
      Als kankerverwekkende processen, bedoeld in [artikel 4.11, onderdeel c, onder 2°, van het besluit][ref1] worden de
      processen waarbij de volgende mengsels van stoffen vrijkomen aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20c.a
    text: dieselmotoremissies;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20c
  - number: 4.20c.b
    text: |-
      een mengsel van N-[3-hydroxy-2-(2-methylacryloylaminomethoxy)-propoxymethyl]-2-methylacrylamide en N-[2,3-
      bis-(2-methylacryloylaminomethoxy)propoxymethyl]-2-methylacrylamide en methacrylamide en 2-methyl-N-(2-
      methylacryloylaminomethoxymethyl)acrylamide en N-(2,3-dihydroxypropoxymethyl)-2-methylacrylamide, of;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20c
  - number: 4.20c.c
    text: C.I. Basic Violet 3 met 0,1% of meer Michlers keton.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.20c
  - number: '4.26'
    text: |-
      In deze paragraaf wordt verstaan onder: - *certificatieschema voor de persoonscertificaten:* Certificatieschema
      voor de Persoonscertificaten Deskundig Asbestverwijderaar niveau 1 en niveau 2 (DAV-1 en DAV-2) en Deskundig
      Toezichthouder Asbestverwijdering (DTA), dat in overeenstemming met de minister is vastgesteld door de Stichting
      Ascert op 4 juli 2025 en door de minister is gepubliceerd in de Staatscourant van 3 maart 2026 (Stcrt-2026-8344);
        - *certificatieschema voor de procescertificaten:* Certificatieschema voor de Procescertificaten
      Asbestinventarisatie en Asbestverwijdering, dat in overeenstemming met de minister is vastgesteld door de Stichting
      Ascert op 11 september 2024 en door de minister is gepubliceerd in de Staatscourant van 23 oktober 2024 (Stcrt.
      2024-34077).
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.26
  - number: '4.27'
    text: 'Een certificaat kan worden afgegeven indien:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.27
  - number: 4.27.a
    text: |-
      in geval van het certificaat asbestinventarisatie, bedoeld in [artikel 4.54a, vierde lid, van het besluit][ref1],
      de aanvrager voldoet aan de eisen, geldend voor asbestinventarisatiebedrijven en vastgelegd in paragraaf 2 en 3 van
      het certificatieschema voor de procescertificaten;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.27.b
    text: |-
      in geval van het certificaat asbestverwijdering, bedoeld in [artikel 4.54d, eerste lid, van het besluit][ref1], de
      aanvrager voldoet aan de eisen, geldend voor asbestverwijderingsbedrijven en vastgelegd in paragraaf 2 en 4 van het
      certificatieschema voor de procescertificaten;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.27.c
    text: |-
      in geval van het certificaat van vakbekwaamheid voor het toezicht houden op het werken met asbest, bedoeld in
      [artikel 4.54d, vijfde lid, van het besluit][ref1], de aanvrager voldoet aan de eisen, vastgelegd in paragraaf 6
      van het certificatieschema voor de persoonscertificaten;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.27.d
    text: |-
      in geval van het certificaat van vakbekwaamheid voor het verwijderen van asbest, bedoeld in
      [artikel 4.54d, zevende lid, van het besluit][ref1], de aanvrager voldoet aan de eisen, vastgelegd in paragraaf 4
      en 5 van het certificatieschema voor de persoonscertificaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: '4.28'
    text: 'Een aanwijzing als certificerende instelling kan geschieden indien:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.28
  - number: 4.28.a
    text: |-
      in geval van een certificerende instelling als bedoeld in [artikel 4.54a, vierde lid][ref1], of
      [artikel 4.54d, eerste lid, van het besluit][ref2], de instelling voldoet aan de toepasselijke criteria, vastgelegd
      in paragraaf 5 van het certificatieschema voor de procescertificaten;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.28
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.28.b
    text: |-
      in geval van een certificerende instelling als bedoeld in
      [artikel 4.54d, vijfde of zevende lid, van het besluit][ref1] de instelling voldoet aan de criteria, vastgelegd in
      paragraaf 2 van het certificatieschema voor de persoonscertificaten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.28
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: '4.29'
    text: |-
      Het verstrekken van gegevens en inlichtingen tussen de minister, de toezichthouders, de certificerende instellingen
      en de Stichting Raad voor Accreditatie, als bedoeld in [artikel 1.5eb, tweede lid, van het besluit][ref1], op
      het werkveld asbest geschiedt overeenkomstig het informatieprotocol zoals opgenomen in [bijlage XIIIg][ref2] bij
      de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 4.29a.1
    text: |-
      Een persoon als bedoeld in [artikel 4.54d, tiende lid, van het besluit][ref1] voldoet aan de volgende eisen die aan
      hem, de door hem uit te voeren werkzaamheden en de door hem te gebruiken machine worden gesteld, indien de machine
      zich binnen het afgebakende gebied op een projectlocatie bevindt waarbinnen de asbestverwijdering plaatsvindt:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.29a.1.a
    text: hij kent de veiligheids- en gezondheidsrisico’s die verband houden met asbestverwijdering;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29a
  - number: 4.29a.1.b
    text: hij weet hoe hij adembeschermingsmiddelen moet gebruiken;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29a
  - number: 4.29a.1.c
    text: |-
      hij werkt in een machine met een gesloten cabine die voorzien is van een in werking zijnde
      filteroverdrukinstallatie met klimaatregelingsinstallatie;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29a
  - number: 4.29a.1.d
    text: hij kent de werking van de filteroverdrukinstallatie en weet hoe de dagelijkse controle moet plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29a
  - number: 4.29a.1.e
    text: hij vermijdt breuk van asbesthoudend materiaal zoveel mogelijk door een zorgvuldige uitvoering van werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29a
  - number: 4.29a.1.f
    text: er is geen sprake van werkzaamheden in containment; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29a
  - number: 4.29a.1.g
    text: 'hij kent de procedures inzake:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29a
  - number: 4.29a.1.g.1º
    text: het betreden en verlaten van het werkgebied, inclusief de visuele inspectie van de gebruikte machine; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29a
  - number: 4.29a.1.g.2º
    text: de handelwijze in geval van nood, bij storing of uitvallen van de machine.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29a
  - number: 4.29a.2
    text: |-
      Om de in het eerste lid, onderdeel a, b, d en g, bedoelde kennis te verwerven is de persoon, bedoeld in het eerste
      lid, aantoonbaar geïnstrueerd.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.29a
  - number: 4.30.1
    text: |-
      Onder kleine losliggende oppervlakken als bedoeld in [artikel 4.53c, tweede lid, onderdeel a, van het besluit][ref1]
      wordt verstaan: een losliggend oppervlak van maximaal 2,5 m2.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.30.2
    text: |-
      De concentratie van de amfibole asbestvezels actinoliet, amosiet, anthofylliet, tremoliet en crocidoliet
      in de lucht waaraan werknemers in verband met de arbeid kunnen worden blootgesteld is beperkt in de zin van
      [artikel 4.53c, tweede lid, onderdeel b, van het besluit][ref1] indien de concentratie wordt veroorzaakt door:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.30.2.a
    text: |-
      verwijdering van asbesthoudend materiaal dat maximaal 2 massaprocent amfibole asbestvezels actinoliet, amosiet,
      anthofylliet, tremoliet en crocidoliet bevat; of
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.30
  - number: 4.30.2.b
    text: verwijdering van leidingen, buizen en kanalen van asbestcement, die niet volledig in beton gestort zijn;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.30
  - number: 4.30.2.c
    text: |-
      een asbestverwijdering waarbij gedurende de duur van de asbestverwijderingswerkzaamheden tussen de asbesttoepassing
      en de werknemer die de verwijdering uitvoert een niet-betreedbare afscheiding aanwezig is, waarmee de
      asbesttoepassing in zijn geheel lekvrij omsloten wordt.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.30
  - number: 4.32a.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.1.a
    text: |-
      producten: lijmen, verven, lakken, beitsen, vernissen, vulmiddelen, olie- of wasachtige
      producten, impregneermiddelen en vloercoatings die vluchtige organische stoffen als bedoeld in
      [artikel 4.62a van het besluit][ref1] bevatten;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32a.1.b
    text: |-
      bestanddelen van woningen of andere gebouwen: alle objecten die in woningen of andere gebouwen aanwezig zijn en die
      door hun aard, vorm, gewicht of afmetingen daaruit redelijkerwijs niet kunnen worden verwijderd. Onder bestanddelen
      van woningen en andere gebouwen worden niet verstaan objecten die worden vervaardigd, hersteld of onderhouden in
      het kader van een productieproces, onderscheidenlijk reparatie of onderhoud, voor zover het vervaardigen, herstel
      of onderhoud wordt verricht op een daartoe adequaat ingerichte arbeidsplaats.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.2
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen handelingen in woningen of
      andere gebouwen, bestaande uit:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32a.2.a
    text: |-
      het lijmen van bekleding op vloeren, trappen, wanden of plafonds van woningen of andere gebouwen, daaronder mede
      begrepen de voorbewerking;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.2.b
    text: |-
      het aanbrengen van producten in woningen of andere gebouwen of op bestanddelen van woningen of andere gebouwen,
      daaronder mede begrepen de voorbewerking.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.3
    text: 'Het tweede lid, onder b, is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.3.a
    text: |-
      metalen bestanddelen van gebouwen ten aanzien waarvan toepassing van producten op grond van de in
      [bijlage XIV][ref1] bij deze regeling beschreven omstandigheden is toegestaan;


      [ref1]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
    references:
      - id: ref1
        bwb_id: BWBR0008587
  - number: 4.32a.3.b
    text: |-
      het voorbewerken van muren en plafonds van woningen of andere gebouwen op plaatsen waar deze muren en plafonds
      ernstig verontreinigd zijn door brand- of rookschade of aanslag als gevolg van het roken van tabakswaren;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.3.c
    text: |-
      het voorbewerken in de zin van versterken van sterk poreuze of poederende bestanddelen van woningen of andere
      gebouwen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.3.d
    text: |-
      het repareren met behulp van verf of lak van beschadigingen aan stalen constructies bij nieuwbouw van woningen of
      andere gebouwen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.3.e
    text: |-
      het herstellen of onderhouden van historische afwerkings- of toplagen in een techniek die gelijk is aan of
      overeenkomt met die historische afwerking, waarbij de werkzaamheden gericht zijn op instandhouding van de
      monumentale waarden van een rijksmonument in de zin van de [Erfgoedwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037521
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
    references:
      - id: ref1
        bwb_id: BWBR0037521
  - number: 4.32a.3.f
    text: |-
      het aanbrengen van traditioneel imitatieschilderwerk, zoals marmer- en houtnerfschilderwerk, alsmede het vergulden
      met behulp van goudverf. Onder aanbrengen wordt niet verstaan de voorbewerking;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.3.g
    text: |-
      het aanbrengen van een product op beglazingskit in gebouwen voor zover deze opgeleverd zijn voor 1 januari 2001,
      teneinde deze kit geschikt te maken voor de toepassing van watergedragen verfproducten.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.4
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, onder a, bevatten ten hoogste 5 gram
      vluchtige organische stoffen per kilogram gebruiksklaar product.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.5
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, onder b, voor zover het betreft het
      aanbrengen van muurverf, bevatten ten hoogste 60 gram vluchtige organische stoffen per liter gebruiksklaar product.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32a.6
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, onder b, voor zover het andere
      werkzaamheden betreft dan het aanbrengen van muurverf, bevatten ten hoogste 100 gram vluchtige organische stoffen
      per liter gebruiksklaar product. Indien het bij de producten, bedoeld in de eerste zin, gaat om producten op
      epoxybasis, wordt benzylalcohol uitgezonderd bij het bepalen van het gewicht van de vluchtige organische stoffen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32a
  - number: 4.32b.1
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32b.1.a
    text: het drukken met behulp van een offsetpers;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32b
  - number: 4.32b.1.b
    text: |-
      het dagelijks reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt bij
      offsetdruk;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32b
  - number: 4.32b.1.c
    text: |-
      het niet-dagelijks reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt
      bij offsetdruk.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32b
  - number: 4.32b.2
    text: |-
      Het vochtwater dat wordt gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder a, bevat ten hoogste
      8 volumeprocenten isopropylalcohol of andere mono-alcoholen bij automatische doseersystemen en ten hoogste 10
      volumeprocenten bij handmatige doseersystemen en bij rotatie-offsetpersen die voor het eerst in gebruik zijn
      genomen vóór 1 januari 1985.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32b
  - number: 4.32b.3
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder b, bevatten ten hoogste 0,1
      volumeprocenten gehalogeneerde koolwaterstoffen of monoaromaten met een dampspanning van meer dan 0,1 millibar bij
      20 °C en hebben een vlampunt van ten minste 55 °C.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32b
  - number: 4.32b.4
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder c, bevatten ten hoogste 0,1
      volumeprocenten gehalogeneerde koolwaterstoffen of monoaromaten met een dampspanning van meer dan 0,1 millibar bij
      20 °C.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32b
  - number: 4.32c.1
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32c.1.a
    text: het reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt bij zeefdruk;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32c
  - number: 4.32c.1.b
    text: |-
      het zeefdrukken van papier en karton dat is bestemd voor toepassingen in binnenruimten en dat zwaarder is dan 135
      gram per vierkante meter.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32c
  - number: 4.32c.2
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder a, bevatten ten hoogste 0,1
      volumeprocenten gehalogeneerde koolwaterstoffen of monoaromaten met een dampspanning van meer dan 0,1 millibar bij
      20 °C en hebben een vlampunt van ten minste 21 °C.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32c
  - number: 4.32c.3
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder b, bevatten ten hoogste 150
      gram vluchtige organische stoffen per kilogram product.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32c
  - number: 4.32d.1
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen het reinigen van vloeren
      in illustratiediepdrukkerijen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32d.2
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, bevatten ten hoogste 0,1
      volumeprocenten gehalogeneerde koolwaterstoffen of monoaromaten met een dampspanning van meer dan 0,1 millibar bij
      20 °C en hebben een vlampunt van ten minste 55 °C.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32d
  - number: 4.32e.1
    text: |-
      In dit artikel wordt verstaan onder:

              a
              lakkeren:

                het aanbrengen van een lak op een flexibel materiaal of van een kleefstof op een flexibel materiaal ten
      behoeve van de latere afsluiting van dat materiaal;



              b
              lamineren of cacheren:

                het hechten van twee of meer flexibele materialen tot een laminaat.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32e
  - number: 4.32e.2
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32e.2.a
    text: |-
      het drukken, lakkeren, lamineren of cacheren met behulp van een verpakkingsdiepdrukpers, flexopers, lakkeer-,
      lamineer- of cacheermachine die niet is aangesloten op een afzuigsysteem;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32e
  - number: 4.32e.2.b
    text: |-
      het reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt bij de
      werkzaamheden, bedoeld onder a, tenzij deze werkzaamheden worden uitgevoerd met behulp van een afgesloten
      installatie of een installatie die wordt afgezogen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32e
  - number: 4.32e.2.c
    text: |-
      het lamineren of cacheren met behulp van een lamineer- of cacheermachine die niet is aangesloten op een installatie
      voor terugwinning of vernietiging van vluchtige organische stoffen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32e
  - number: 4.32e.2.d
    text: |-
      het drukken of lakkeren van papier en karton met behulp van een flexodrukpers of lakkeermachine die niet is
      aangesloten op een installatie voor terugwinning of vernietiging van vluchtige organische stoffen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32e
  - number: 4.32e.2.e
    text: |-
      het reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt bij de
      werkzaamheden, bedoeld onder c en d, tenzij deze werkzaamheden worden uitgevoerd met behulp van een afgesloten
      installatie of een installatie die wordt afgezogen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32e
  - number: 4.32e.3
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, bevatten ten hoogste 50 gram
      vluchtige organische stoffen per kilogram product.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32e
  - number: 4.32e.4
    text: |-
      Het derde lid is niet van toepassing op de producten die worden gebruikt bij de werkzaamheden, bedoeld in
      het tweede lid, onder c, d en e, indien daarbij bijzondere eisen aan de kwaliteit of bestendigheid van het
      gefabriceerde product worden gesteld, mits op jaarbasis het gewicht van de vluchtige organische stoffen van de
      producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, onder c, d en e, ten hoogste 80%
      bedraagt van het gewicht van de opgebrachte vaste stof.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32e
  - number: 4.32f.1
    text: |-
      In dit artikel wordt verstaan onder motorrijtuig: een personenauto, een
      bestelauto, een motorrijwiel, een autobus of een kampeerauto als bedoeld in
      [artikel 2, onder b, c, d, e onderscheidenlijk g, van de Wet op de motorrijtuigenbelasting 1994][ref1] of een
      vrachtauto als bedoeld in [artikel 1, eerste lid, onder e, van de Wet goederenvervoer over de weg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32f
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '1'
  - number: 4.32f.2
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32f.2.a
    text: |-
      het aanbrengen of toepassen van primer, surfacer, sealer of 1- en 2-laags aflaksystemen of van speciale dan wel
      overige producten als bedoeld in [bijlage XV][ref1] bij deze regeling, ten behoeve van het herstellen van lakschade
      of vernieuwing van laklagen op onderdelen van motorrijtuigen;


      [ref1]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32f
    references:
      - id: ref1
        bwb_id: BWBR0008587
  - number: 4.32f.2.b
    text: |-
      het reinigen van gereedschappen die worden gebruikt bij de werkzaamheden, bedoeld onder a, of oppervlakken van
      onderdelen van motorrijtuigen ten behoeve van de herstel- of vernieuwingswerkzaamheden, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32f
  - number: 4.32f.3
    text: |-
      Het tweede lid is niet van toepassing op werkzaamheden ten behoeve van het herstellen van lakschade of het
      vernieuwen van laklagen op onderdelen van motorrijtuigen die zijn gebouwd vóór 1970;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32f
  - number: 4.32f.4
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, bevatten in gebruiks- of spuitklare
      vorm, ten hoogste het gehalte aan vluchtige organische stoffen dat met betrekking tot deze producten is vastgesteld
      bij [bijlage XV][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32f
    references:
      - id: ref1
        bwb_id: BWBR0008587
  - number: 4.32g.1
    text: |-
      In dit artikel wordt verstaan onder coating: een product dat opgebracht wordt op een oppervlak om een decoratief,
      beschermend of ander functioneel effect te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32g
  - number: 4.32g.2
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen werkzaamheden in
      binnensituaties bestaande uit:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32g
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32g.2.a
    text: |-
      het aanbrengen van een coating op delen van nieuw vervaardigde buitendeuren, kozijnen, ramen, binnenspouwbladen,
      gevelvullende elementen en overig geveltimmerwerk, voorzover zij zijn vervaardigd van hout of een daarmee gelijk te
      stellen of vergelijkbaar materiaal, als onderdeel van het productieproces;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32g
  - number: 4.32g.2.b
    text: |-
      het aanbrengen van een coating op delen van nieuw vervaardigde binnentrappen, voorzover zij zijn vervaardigd van
      hout of een daarmee gelijk te stellen of vergelijkbaar materiaal, als onderdeel van het productieproces.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32g
  - number: 4.32g.3
    text: |-
      Coatings die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, onder a en b, bevatten ten hoogste
      150 gram vluchtige organische stoffen per liter gebruiksklaar product.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel4.32g
  - number: 4.32h
    text: |-
      Met de in de [artikelen 4.32a vierde tot en met zesde lid][ref1], [4.32b, tweede tot en met vierde lid][ref2],
      [4.32c, tweede en derde lid][ref3], [4.32d, tweede lid][ref4], [4.32e, derde lid][ref5], [4.32f, vierde lid][ref6]
      en [4.32g, derde lid][ref7], bedoelde producten worden gelijkgesteld producten, die rechtmatig zijn vervaardigd
      en in de handel zijn gebracht in een andere lidstaat van de Europese Unie dan wel rechtmatig zijn vervaardigd in
      een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij de overeenkomst inzake de Europese
      Economische Ruimte, en die voldoen aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan
      het niveau dat met de nationale eisen wordt nagestreefd.


