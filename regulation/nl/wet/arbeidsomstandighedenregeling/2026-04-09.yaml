        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.12.1
    text: |-
      Het veiligheids- en gezondheidsdocument voor de bijzondere werkzaamheden, bedoeld in
      [artikel 3.7, eerste lid, onderdelen a, b en c][ref1], wordt acht weken voor de aanvang van de werkzaamheden in
      tweevoud toegezonden aan een daartoe aangewezen toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.12.2
    text: |-
      Dit veiligheids- en gezondheidsdocument gaat vergezeld van het werkprogramma, bedoeld in
      [artikel 74 van het Mijnbouwbesluit][ref1] indien het de volgende werkzaamheden betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel74
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '74'
  - number: 3.12.2.a
    text: het boren van een boorgat;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.12
  - number: 3.12.2.b
    text: het uitvoeren van werkzaamheden in een bestaand boorgat.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.12
  - number: 3.13.1
    text: |-
      De werkgever die verantwoordelijk is voor het mijnbouwwerk, bedoeld in [artikel 3.6, eerste lid][ref1],
      gaat na of het veiligheids- en gezondheidsdocument, met uitzondering van het voorontwerprapport, bedoeld in
      [artikel 3.8, eerste lid, onder a][ref2], wordt nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.13.2
    text: |-
      De werkgever die verantwoordelijk is voor het mijnbouwwerk, bedoeld in [artikel 3.6, eerste lid][ref1], beoordeelt
      regelmatig en systematisch de naleving en de doeltreffendheid van het veiligheids- en gezondheidsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.13.3
    text: |-
      Indien de resultaten van de beoordeling, bedoeld in het tweede lid, daartoe aanleiding geven, herziet de werkgever
      die verantwoordelijk is voor de arbeidsplaats het veiligheids- en gezondheidsdocument. De herziene delen van het
      veiligheids- en gezondheidsdocument worden, alvorens het gewijzigde veiligheids- en gezondheidsdocument wordt
      uitgevoerd, in tweevoud toegezonden aan een daartoe aangewezen toezichthouder.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.13
  - number: 3.14.1
    text: |-
      Het noodplan, bedoeld in [artikel 3.37v, van het besluit][ref1], bevat in ieder geval de informatie, bedoeld in
