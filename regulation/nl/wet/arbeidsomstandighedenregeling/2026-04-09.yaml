  - number: '5.1'
    text: |-
      Apparatuur en meubilair, in gebruik bij het verrichten van beeldschermwerk, voldoen in ieder geval aan de volgende
      voorschriften:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.a
    text: |-
      de tekens op het beeldscherm zijn voldoende scherp, duidelijk van vorm en voldoende groot, met voldoende afstand
      tussen de tekens en de regels;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.b
    text: het beeld op het beeldscherm is stabiel;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.c
    text: |-
      de luminantie van of het contrast tussen de tekens en de achtergrond is gemakkelijk door de gebruiker bij te
      stellen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.d
    text: het beeldscherm is vrij te plaatsen en gemakkelijk verstelbaar en kantelbaar;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.e
    text: het beeldscherm is vrij van voor de gebruiker hinderlijke glans en spiegelingen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.f
    text: het toetsenbord kan hellend worden geplaatst en vormt geen geheel met het beeldscherm;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.g
    text: er is voor het toetsenbord voldoende ruimte voor handen en armen van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.h
    text: het toetsenbord heeft een mat oppervlak;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.i
    text: de indeling van het toetsenbord en de vorm van de toetsen zijn gericht op vergemakkelijking van het gebruik;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.j
    text: de symbolen op de toetsen zijn voldoende contrastrijk en vanuit een normale werkhouding voldoende leesbaar;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.k
    text: |-
      de werktafel of het werkvlak maakt een comfortabele houding van de gebruiker mogelijk en heeft een reflectiearm
      oppervlak, is voldoende groot en maakt een flexibele opstelling van beeldscherm, toetsenbord, documenten en
      accessoires mogelijk;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.l
    text: |-
      een voor het werk noodzakelijke documenthouder is stabiel en regelbaar en zodanig geplaatst dat oncomfortabele
      hoofd- en oogbewegingen tot een minimum zijn beperkt;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.m
    text: |-
      de werkstoel is stabiel, heeft een in hoogte verstelbare zitting en een rugleuning, waarvan de hoogte en
      hellingshoek verstelbaar zijn en geeft de gebruiker bewegingsvrijheid en een comfortabele werkhouding;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: 5.1.n
    text: indien de gebruiker dat wenst wordt een voetensteun aangebracht.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.1
  - number: '5.2'
    text: |-
      De omgeving waarin het beeldschermwerk wordt verricht en de inrichting van de beeldschermwerkplek voldoen in ieder
      geval aan de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.2
  - number: 5.2.a
    text: |-
      de verlichting van de werkruimte of de beeldschermwerkplek zorgt voor voldoende licht en een passend contrast
      tussen beeldscherm en omgeving, rekening houdende met de aard van het werk en de visuele behoeften van de
      gebruiker;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.2
  - number: 5.2.b
    text: |-
      mogelijke verblinding en hinderlijke reflecties op het beeldscherm of op apparaten door kunstmatige lichtbronnen
      zijn vermeden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.2
  - number: 5.2.c
    text: |-
      er treden door raam- en andere openingen, wanden en apparaten geen directe verblinding en hinderlijke reflecties op
      het beeldscherm op;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.2
  - number: 5.2.d
    text: |-
      de ramen zijn uitgerust met passende instelbare helderheidswering om de intensiteit van het licht dat op de
      beeldschermwerkplek valt te verminderen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.2
  - number: 5.2.e
    text: het geluid dat de apparatuur voortbrengt veroorzaakt geen verstoring van de aandacht en het gesproken woord;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.2
  - number: 5.2.f
    text: de apparatuur brengt geen voor de werknemers hinderlijke warmte voort;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.2
  - number: 5.2.g
    text: de vochtigheidsgraad is steeds toereikend.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.2
  - number: '5.3'
    text: |-
      De programmatuur die wordt gebruikt bij het verrichten van beeldschermwerk voldoet in ieder geval aan de volgende
      voorschriften:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.3
  - number: 5.3.a
    text: de programmatuur is aangepast aan de te verrichten taak;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.3
  - number: 5.3.b
    text: de programmatuur is gemakkelijk te gebruiken en aan te passen aan het kennis- en ervaringsniveau van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.3
  - number: 5.3.c
    text: |-
      er wordt zonder medeweten van de gebruiker geen gebruik gemaakt van een kwantitatief of kwalitatief
      controlemechanisme;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.3
  - number: 5.3.d
    text: de systemen verschaffen de gebruiker gegevens over de werking ervan;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.3
  - number: 5.3.e
    text: de systemen maken de informatie zichtbaar in een vorm en een tempo die zijn aangepast aan de gebruiker;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.3
  - number: 5.3.f
    text: bij de verwerking van informatie door de gebruiker worden de beginselen van de ergonomie toegepast.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel5.3
  - number: 6.1.1
    text: |-
      In dit artikel wordt verstaan onder: - *aangedreven gereedschappen:* arbeidsmiddelen die pneumatisch, hydraulisch,
      mechanisch of elektrisch dan wel via munitie worden aangedreven en aanvullend bewustzijn vereisen voor de
      duikploeg en van de duiker ten aanzien van veiligheidsmaatregelen voor zichzelf dan wel voor zijn omgeving aan de
      oppervlakte, in het water en tijdens de duikarbeid;
        - *geconditioneerde omstandigheden:* omgeving waar op voorhand met behulp van een risicoanalyse ingeschat kan
      worden dat er geen sprake zal zijn van een voorzienbare kans dat de duiker in moeilijkheden zal geraken tijdens
      de duikarbeid en waarbij ten minste wordt voldaan aan elk van de volgende criteria: a. de maximaal bereikbare
      diepte bedraagt 9 meter; b. het onderwaterzicht bedraagt ten minste 4 meter, indien de omvang van de betreffende
      faciliteit dit mogelijk maakt; c. de stroomsnelheid bedraagt maximaal 0,5 meter per seconde; en d. er is te allen
      tijde de mogelijkheid tot vrije opstijging;
        - *gesloten duikklok:* een afzinkbare kamer, afsluitbaar door middel van één of twee deuren, bedoeld voor het
      transport van duikers tussen de onder water gelegen werkplek en de aan de oppervlakte gesitueerde compressiekamer;
        - *hogedrukluchtvoorziening vanaf de oppervlakte:* luchtvoorziening vanaf de oppervlakte die gekoppeld wordt aan de
      meegedragen SCUBA ademgasvoorziening en waarbij de ademlucht pas bij de meegedragen ademgasvoorziening, niet zijnde
      een ademgasvoorziening als bedoeld bij SSE, wordt gereduceerd tot lage druk;
        - *lichte werkzaamheden:* werkzaamheden uitgevoerd tijdens duikarbeid met niet aangedreven gereedschappen;
        - *niet aangedreven gereedschappen:* arbeidsmiddelen die met de hand worden ingezet en enkel door middel van het
      inzetten van spierkracht het beoogde effect realiseren;
        - *no-deco duiktijd:* tijdsduur waarbij op basis van duikdiepte en duiktijd geen decompressiestop is benodigd;
        - *open duikklok:* open duikklok die is voorzien van een droge ruimte gevuld met ademlucht waar geademd kan worden;
        - *scopecategorie:* een groepering van scopes op basis van gedeelde kenmerken, waarbij de volgende scopecategorieën
      worden onderscheiden: a. scopecategorie A, bestaande uit de scopes, genoemd in het tweede lid, onderdelen a
      tot en met d, en het vierde lid, onderdelen a tot en met c, die zich kenmerken door lichte werkzaamheden zonder
      aangedreven gereedschappen waarbij voornamelijk mobiliteit van de duiker van belang is voor zijn werkzaamheden; b.
      scopecategorie B, bestaande uit de scopes, genoemd in het tweede lid, onderdelen e tot en met g, en het vierde lid,
      onderdelen d tot en met f, die zich kenmerken door zware werkzaamheden waarbij de duiker voornamelijk statisch zijn
      werkzaamheden uitvoert; en c. scopecategorie C, bestaande uit de scopes, genoemd in het tweede lid, onderdeel h,
      en het vierde lid, onderdeel g, die zich kenmerken door zware werkzaamheden waarbij de duiker vanuit een gesloten
      duikklok gebruik maakt van ademgassen die ten behoeve van het ademen op grotere dieptes samengesteld zijn;
        - *SCUBA:* Self Contained Underwater Breathing Apparatus, zijnde een verzamelnaam voor duikmaterieel dat zich
      kenmerkt door ademgasvoorziening vanuit cilinders die door de duiker meegedragen worden;
        - *SSE:* Surface Supplied Equipment, zijnde een verzamelnaam voor duiksystemen die standaard voorzien zijn van
      ademgasvoorziening vanaf de oppervlakte, waarbij een of meer duikers aangesloten zijn op een duikpaneel, en die
      geschikt zijn voor de uitvoering van zware werkzaamheden in de scopecategorie B;
        - *zware werkzaamheden:* werkzaamheden uitgevoerd tijdens duikarbeid waarbij de omstandigheden, de aard van de
      werkzaamheden of het gebruik van aangedreven gereedschappen leiden tot aanvullende risico's welke gemitigeerd
      worden door het gebruik van een SSE duikuitrusting.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.2
    text: |-
      Een duiker is in het bezit van een bewijs van registratie of herregistratie in het Register civiele duikarbeid of
      in het Register duikarbeid brandweer en politie, en is geregistreerd op basis van het Registratieschema duiker,
      zoals vastgesteld door het bestuur van de Stichting Werken Onder Overdruk op 1 oktober 2024 en door de minister is
      gepubliceerd in de Staatscourant van 12 december 2024 (Stcrt. 2024, 39678), voor de scope:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.2.a
    text: |-
      A9, indien hij lichte werkzaamheden uitvoert met een SCUBA duikuitrusting tot een diepte van 9 meter, binnen de
      grenzen van no-deco duiktijden, onder geconditioneerde omstandigheden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.2.b
    text: |-
      A15, indien hij lichte werkzaamheden uitvoert met een SCUBA duikuitrusting, tot een diepte van 15 meter, binnen de
      grenzen van no-deco duiktijden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.2.c
    text: |-
      A15OLV, indien hij lichte werkzaamheden uitvoert met een SCUBA duikuitrusting met aansluiting op een
      hogedrukluchtvoorziening vanaf de oppervlakte, tot een diepte van 15 meter, binnen de grenzen van no-deco
      duiktijden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.2.d
    text: A30, indien hij lichte werkzaamheden uitvoert met een SCUBA duikuitrusting tot en met een diepte van 30 meter;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.2.e
    text: B30, indien hij zware werkzaamheden uitvoert met een SSE duikuitrusting, tot en met een diepte van 30 meter;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.2.f
    text: B50R, indien hij zware werkzaamheden uitvoert met een SSE duikuitrusting, tot en met een diepte van 50 meter;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.2.g
    text: |-
      B50, indien hij zware werkzaamheden uitvoert met een SSE duikuitrusting, inclusief het duiken vanuit een open
      duikklok, tot en met een diepte van 50 meter; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.2.h
    text: |-
      C, indien hij zware werkzaamheden uitvoert met een SSE duikuitrusting, inclusief het duiken vanuit een gesloten
      duikklok.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.3
    text: |-
      Een duiker die is geregistreerd voor de scope A30, B50R of B50 kan, in afwijking van het tweede lid, bij het
      verrichten van werkzaamheden die vallen binnen de scope waarvoor hij is geregistreerd, in incidentele gevallen
      dieper duiken dan de maximale diepte die is gekoppeld aan de betreffende scope, mits wordt voldaan aan de
      voorwaarden in paragraaf 5.8 van het registratieschema, genoemd in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.4
    text: |-
      Een duikploegleider is in het bezit van een bewijs van registratie of herregistratie in het Register
      civiele duikarbeid of in het Register duikarbeid brandweer en politie, en is geregistreerd op basis van het
      Registratieschema duikploegleider, zoals vastgesteld door het bestuur van de Stichting Werken Onder Overdruk op
      1 oktober 2024 en door de minister is gepubliceerd in de Staatscourant van 12 december 2024 (Stcrt. 2024, 39683),
      voor de scope:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.4.a
    text: |-
      A9, indien hij leiding geeft aan de uitvoering van lichte werkzaamheden met een SCUBA duikuitrusting tot een diepte
      van 9 meter, binnen de grenzen van no-deco duiktijden, onder geconditioneerde omstandigheden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.4.b
    text: |-
      A15, indien hij leiding geeft aan de uitvoering van lichte werkzaamheden met een SCUBA duikuitrusting tot een
      diepte van 15 meter, binnen de grenzen van no-deco duiktijden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.4.c
    text: |-
      A30, indien hij leiding geeft aan de uitvoering van lichte werkzaamheden met een SCUBA duikuitrusting tot en met
      een diepte van 30 meter;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.4.d
    text: |-
      B30, indien hij leiding geeft aan de uitvoering van zware werkzaamheden met een SSE duikuitrusting, tot en met een
      diepte van 30 meter;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.4.e
    text: |-
      B50R, indien hij leiding geeft aan de uitvoering van zware werkzaamheden met een SSE duikuitrusting, tot en met een
      diepte van 50 meter;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.4.f
    text: |-
      B50, indien hij leiding geeft aan de uitvoering van zware werkzaamheden met een SSE duikuitrusting, inclusief het
      duiken vanuit een open duikklok, tot en met een diepte van 50 meter; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.4.g
    text: |-
      C, indien hij leiding geeft aan de uitvoering van zware werkzaamheden met een SSE duikuitrusting, inclusief het
      duiken vanuit een gesloten duikklok.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.5
    text: |-
      Een duikploegleider mag leiding geven aan werkzaamheden als bedoeld in het tweede lid, onderdeel c, waarbij gebruik
      wordt gemaakt van een aansluiting op een hogedrukluchtvoorziening vanaf de oppervlakte, indien hij is geregistreerd
      voor een of meer van de scopes, genoemd in het vierde lid, onderdelen b tot en met g, en bij deze registratie of
      herregistratie tevens de aantekening ‘A15OLV’ is geregistreerd.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.6
    text: |-
      De aantekening, bedoeld in het vijfde lid, wordt geregistreerd indien is voldaan aan de daarvoor geldende eisen in
      het registratieschema, genoemd in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.7
    text: |-
      Een duiker die is geregistreerd voor een van de scopes, genoemd in het tweede lid, mag naast de duikarbeid die valt
      binnen de betreffende scope tevens duikarbeid verrichten die valt binnen de scopes, genoemd in de onderdelen van
      het tweede lid die voorafgaan aan het onderdeel dat betrekking heeft op de scope waarin de duiker is geregistreerd,
      met uitzondering van scope A15OLV. De eerste zin is van overeenkomstige toepassing op een duikploegleider die is
      geregistreerd voor een van de scopes, genoemd in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.8
    text: |-
      Een duikmedisch begeleider is in het bezit van een bewijs van registratie of herregistratie in het Register
      civiele duikarbeid of in het Register duikarbeid brandweer en politie, en is geregistreerd op basis van het
      Registratieschema duikmedisch begeleider, zoals vastgesteld door het bestuur van de Stichting Werken Onder Overdruk
      op 1 oktober 2024 en door de minister is gepubliceerd in de Staatscourant van 12 december 2024 (Stcrt. 2024,
      39685), voor de scope:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.8.a
    text: |-
      B1, indien hij medische begeleiding uitvoert bij duikarbeid in de duikerscopes A9, A15 en A15OLV binnen de grenzen
      van no-deco duiktijden; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.8.b
    text: B2, indien hij medische begeleiding uitvoert bij duikarbeid in de duikerscopes A30 en de scopecategorieën B en C.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.9
    text: |-
      Een duikerarts is in het bezit van een bewijs van registratie of herregistratie in het Register civiele duikarbeid
      en is geregistreerd op basis van het Registratieschema duikerarts, zoals vastgesteld door het bestuur van de
      Stichting Werken Onder Overdruk op 1 oktober 2024en door de minister is gepubliceerd in de Staatscourant van
      12 december 2024 (Stcrt. 2024, 39687), voor de scope:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.9.a
    text: |-
      duikerarts A, indien hij arbeidsgezondheidskundige onderzoeken als bedoeld in artikel 6.14a, tweede lid, van het
      besluit uitvoert die niet voortkomen uit een wijziging in de lichamelijke of geestelijke toestand van de persoon
      die wordt onderzocht; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.9.b
    text: |-
      duikerarts B, indien hij arbeidsgezondheidskundige onderzoeken als bedoeld in artikel 6.14a, eerste, tweede en
      zesde lid, van het besluit uitvoert.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.1.10
    text: Dit artikel is niet van toepassing op arbeid verricht door defensiepersoneel.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.1
  - number: 6.2.1
    text: |-
      Het arbeidsgezondheidskundig onderzoek, bedoeld in [artikel 6.14a, eerste en tweede lid, van het besluit][ref1]
      vindt plaats met inachtneming van de op 10 september 2021 door het bestuur van de Stichting Werken onder Overdruk
      vastgestelde en op de website [www.arbocataloguswoo.nl](http://www.arbocataloguswoo.nl/) gepubliceerde:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
  - number: 6.2.1.a
    text: |-
      Keuringsrichtlijn Werken onder Overdruk – Duikarbeid, indien de persoon die het arbeidsgezondheidskundig onderzoek
      ondergaat duikarbeid, caissonarbeid of overige arbeid onder overdruk, niet zijnde arbeid als bedoeld in onderdeel
      b, verricht of zal verrichten;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.2
  - number: 6.2.1.b
    text: |-
      Keuringsrichtlijn Werken onder Overdruk – Hyperbare Geneeskunde, indien de persoon die het arbeidsgezondheidskundig
      onderzoek ondergaat arbeid onder overdruk verricht of zal verrichten, die bestaat uit werkzaamheden in een
      hyperbare behandelkamer.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.2
  - number: 6.2.2
    text: |-
      In dit artikel wordt onder hyperbare behandelkamer verstaan: een in een ziekenhuis of medische instelling vast
      opgestelde compressiekamer, bedoeld voor behandeling van patiënten onder overdruk volgens een door een arts
      voorgeschreven behandelprotocol.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.2
  - number: 6.3.1
    text: |-
      Het logboek, bedoeld in [artikel 6.16, vijfde lid, van het besluit][ref1], bevat ten minste de voornaam, achternaam
      en geboortedatum van de houder van het logboek en daarnaast per duik:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
  - number: 6.3.1.a
    text: een handtekening van de houder van het logboek;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
  - number: 6.3.1.b
    text: de datum van de duik;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
  - number: 6.3.1.c
    text: het aanvangstijdstip en de eindtijd van de duik;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
  - number: 6.3.1.d
    text: de maximaal bereikte diepte;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
  - number: 6.3.1.e
    text: het gevolgde schema van de betreffende duik;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
  - number: 6.3.1.f
    text: het gevolgde decompressieverloop;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
  - number: 6.3.1.g
    text: de aard van de gebruikte duikuitrusting of het gebruikte duiksysteem;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
  - number: 6.3.1.h
    text: de aard van de duikarbeid; en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
  - number: 6.3.1.i
    text: |-
      bijzondere sessies, zoals alle gevallen waarin dieper wordt gedoken dan toegestaan binnen de scope, noodprocedures,
      veiligheidsmaatregelen en aanvullende competenties.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
  - number: 6.3.2
    text: |-
      In aanvulling op het eerste lid, bevat het logboek van een duiker per duik een handtekening van de duikploegleider
      met vermelding van het duikploegleidersnummer en de totale tijd onder druk, en bevat het logboek van een
      duikploegleider per duik een aftekening namens de opdrachtgever of werkgever en het totaal aantal duikers.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
  - number: 6.3.3
    text: |-
      In afwijking van het eerste lid, onderdeel c, mag een duikploegleider de totaaltijd in plaats van het
      aanvangstijdstip en de eindtijd van een duik vastleggen in het door hem bij te houden logboek.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.3
  - number: '6.4'
    text: |-
      Als sportduikbrevet als bedoeld in [artikel 6.31, tweede lid, van het besluit][ref1] wordt aangewezen een geldig
      brevet NOB**, afgegeven door de Nederlandse onderwatersportbond, dan wel een naar het oordeel van de minister
      gelijkwaardig brevet.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
  - number: '7.4'
    text: |-
      Als modellen van de certificaten, bedoeld in [artikel 7.29, negende lid, van het besluit][ref1] worden vastgesteld
      de modellen van de certificaten, bedoeld in artikel 25, derde lid, van het Verdrag betreffende de arbeidsveiligheid
      en gezondheid in havenarbeid (1979).


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
  - number: '7.5'
    text: |-
      Als model van het register, bedoeld in [artikel 7.29, tiende lid, van het besluit][ref1] wordt vastgesteld het
      model, bedoeld in artikel 25, tweede lid, van het Verdrag betreffende de arbeidsveiligheid en gezondheid in
      havenarbeid (1979).


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
  - number: 7.6.1
    text: |-
      Een persoon is in het bezit van een bewijs van registratie of herregistratie in het Register kraanmachinist,
      bedoeld in [artikel 7.32, eerste lid, van het besluit][ref1] indien hij een torenkraan, mobiele kraan of
      funderingsmachine als omschreven in de onderdelen a tot en met c, bedient:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '7'
  - number: 7.6.1.a
    text: |-
      torenkraan: torenvormige hijskraan, al dan niet verrijdbaar, waarvan het maximumbedrijfslastmoment 10 tonmeter of
      meer bedraagt of de giek 20 meter of hoger boven het vlak van de ondersteuning van de kraan bevestigd is;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.1.b
    text: |-
      mobiele kraan: verrijdbare, niet aan een vaste baan gebonden hijskraan die geen torenkraan is en waarvan het
      maximumbedrijfslastmoment 10 tonmeter of meer bedraagt, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.1.b.1°
    text: |-
      een op een voertuig bevestigde laadkraan die uitsluitend ingericht is of althans uitsluitend wordt gebruikt voor
      het laden en lossen van de laadbak van het voertuig of een samenstel van voertuigen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.1.b.2°
    text: |-
      een grondverzetmachine die ontgravingen maakt en direct daarop aansluitend leidingwerk in die ontgravingen legt of
      ten behoeve van het uitvoeren van grondverzetwerkzaamheden ondersteuningsschotten plaatst;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.1.c
    text: |-
      funderingsmachine: verrijdbare of verrolbare funderingsmachine die is ingericht om funderingselementen te verwerken
      of bestemd om palen of andere langwerpige voorwerpen in de grond te maken, te drijven of daaruit te verwijderen
      alsmede om met een en ander rechtstreeks verband houdende verrichtingen uit te voeren met inbegrip van het met een
      maximumbedrijfslastmoment van 10 tonmeter of meer verplaatsen van lasten.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.2
    text: 'Met betrekking tot de registratie of herregistratie, bedoeld in het eerste lid, worden onderscheiden:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.2.a
    text: de registratie en herregistratie van vakbekwaamheid voor machinisten van vaste en mobiele torenkranen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.2.b
    text: |-
      de registratie of herregistratie van vakbekwaamheid voor machinisten van mobiele kranen, onderverdeeld in de
      categorieën:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.2.b.1°
    text: mobiele kraan op banden of rupsen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.2.b.2°
    text: grondverzetmachine met hijsfunctie;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.2.b.3°
    text: autolaadkraan;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.2.b.4°
    text: verreiker met hijsfunctie;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.2.c
    text: |-
      de registratie of herregistratie van vakbekwaamheid voor machinisten van funderingsmachines, onderverdeeld in de
      categorieën:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.2.c.1°
    text: |-
      kleine funderingsmachine: machine met een eigen massa inclusief uitrustingen en funderingselement die gelijk is aan
      of minder is dan 30 ton, een totale hoogte heeft van minder dan 10 meter en die funderingselementen korter dan 10
      meter verwerkt;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: 7.6.2.c.2°
    text: |-
      grote funderingsmachine: machine met een eigen massa inclusief uitrustingen en funderingselement van 30 ton of
      meer, een totale hoogte van 10 meter of meer heeft of die funderingselementen van 10 meter of langer verwerkt.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.6
  - number: '7.7'
    text: |-
      Registratie of herregistratie in het Register kraanmachinisten, bedoeld in [artikel 7.6][ref1], geschiedt indien
      de aanvrager voldoet aan de navolgende eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.7.a
    text: |-
      indien het betreft registratie of herregistratie voor de bediening van een torenkraan als bedoeld in
      [artikel 7.6, tweede lid, onderdeel a][ref1], het schema voor de machinist torenkraan ‘Schema voor registratie
      van de Machinist Torenkraan in het Register Kraanmachinisten, W4-06’, dat is vastgesteld door de Stichting Toezicht
      Certificatie Verticaal Transport Register Administratie op 28 februari 2025, Staatscourant van 22 oktober 2025,
      nr. 2025-35699, bijlage 6;


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.7.b
    text: |-
      indien het betreft registratie of herregistratie voor de bediening van een mobiele kraan, zijnde een mobiele kraan
      op banden of rupsen als bedoeld in [artikel 7.6, tweede lid, onderdeel b, onder 1°][ref1], het schema voor
      de machinist mobiele kraan op banden en/of rupsen ‘Schema voor registratie van de Machinist Mobiele Kraan in het
      Register Kraanmachinisten, W4-01’, dat is vastgesteld door de Stichting Toezicht Certificatie Verticaal Transport
      Registratie Administratie op 28 februari 2025, Staatscourant van 22 oktober 2025, nr. 2025-35699, bijlage 1;


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.7.c
    text: |-
      indien het betreft registratie of herregistratie voor de bediening van een mobiele
      kraan, zijnde een grondverzetmachine met hijsfunctie, van de categorie, bedoeld in
      [artikel 7.6, tweede lid, onderdeel b, onder 2°][ref1], het schema voor de machinist grondverzetmachine met
      hijsfunctie ‘Schema voor registratie van de Machinist Grondverzetmachine in het Register Kraanmachinisten, W4-
      05’, dat is vastgesteld door de Stichting Toezicht Certificatie Verticaal Transport Registratie Administratie
      op 28 februari 2025, Staatscourant van 22 oktober 2025, nr. 2025-35699, bijlage 5, of het schema voor de
      machinist mobiele kraan op banden of rupsen ‘Schema voor registratie van de Machinist Mobiele Kraan in het
      Register Kraanmachinisten, W4-01’, dat is vastgesteld door de Stichting Toezicht Certificatie Verticaal Transport
      Registratie Administratie op 28 februari 2025, Staatscourant van 22 oktober 2025, nr. 2025-35699, bijlage 1;


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.7.d
    text: |-
      indien het betreft registratie of herregistratie voor de bediening van een mobiele kraan, zijnde een autolaadkraan,
      van de categorie, bedoeld in [artikel 7.6, tweede lid, onderdeel b, onder 3°][ref1], het schema voor de
      machinist autolaadkraan ‘Schema voor registratie van de Machinist Autolaadkraan in het Register Kraanmachinisten,
      W4-04’, dat is vastgesteld door de Stichting Toezicht Certificatie Verticaal Transport Registratie Administratie
      op 28 februari 2025, Staatscourant van 22 oktober 2025, nr. 2025-35699, bijlage 4, of het schema voor de
      machinist mobiele kraan op banden en/of rupsen ‘Schema voor registratie van de Machinist Mobiele Kraan in het
      Register Kraanmachinisten, W4-01’, dat is vastgesteld door de Stichting Toezicht Certificatie Verticaal Transport
      Registratie Administratie op 28 februari 2025, Staatscourant van 22 oktober 2025, nr. 2025-35699, bijlage 1;


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.7.e
    text: |-
      indien het betreft registratie of herregistratie voor de bediening van een mobiele kraan, zijnde een verreiker
      met hijsfunctie, van de categorie, bedoeld in [artikel 7.6, tweede lid, onderdeel b, onder 4°][ref1], het
      schema voor de machinist verreiker met hijsfunctie ‘Schema voor registratie van de Machinist Verreiker in het
      Register Kraanmachinisten, W4-07’, dat is vastgesteld door de Stichting Toezicht Certificatie Verticaal Transport
      Registratie Administratie op 28 februari 2025, Staatscourant van 22 oktober 2025, nr. 2025-35699, bijlage 7,
      of het schema voor de machinist mobiele kraan op banden en/of rupsen ‘Schema voor registratie van de Machinist
      Mobiele Kraan in het Register Kraanmachinisten, W4-01’, dat is vastgesteld door de Stichting Toezicht Certificatie
      Verticaal Transport Registratie Administratie op 28 februari 2025, Staatscourant van 22 oktober 2025, nr. 2025-
      35699, bijlage 1;


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.7.f
    text: |-
      indien het betreft registratie of herregistratie voor de bediening van een kleine funderingsmachine als bedoeld in
      [artikel 7.6, tweede lid, onderdeel c, onder 1°][ref1], het schema voor de machinist kleine funderingsmachine
      ‘Schema voor registratie van de Machinist Funderingsmachine Klein in het Register Kraanmachinisten, W4-02’
      dat is vastgesteld door de Stichting Toezicht Certificatie Verticaal Transport Registratie Administratie op
      28 februari 2025, Staatscourant van 22 oktober 2025, nr. 2025-35699, bijlage 2, of het schema voor de machinist
      grote funderingsmachine ‘Schema voor registratie van de Machinist Funderingsmachine Groot in het Register
      Kraanmachinisten, W4-03’, dat is vastgesteld door de Stichting Toezicht Certificatie Verticaal Transport
      Registratie Administratie op 28 februari 2025, Staatscourant van 22 oktober 2025, nr. 2025-35699, bijlage 3; en


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.7.g
    text: |-
      indien het betreft registratie of herregistratie voor de bediening van een grote funderingsmachine als
      bedoeld in [artikel 7.6, tweede lid, onderdeel c, onder 2°][ref1], van het schema voor de machinist
      grote funderingsmachine ‘Schema voor registratie van de Machinist Funderingsmachine Groot in het Register
      Kraanmachinisten, W4-03’, dat is vastgesteld door de Stichting Toezicht Certificatie Verticaal Transport
      Registratie Administratie op 28 februari 2025, Staatscourant van 22 oktober 2025, nr. 2025-35699, bijlage 3.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 8.1.1
    text: |-
      Veiligheids- of gezondheidssignalering als bedoeld in [artikel 8.4 van het besluit][ref1] voldoet aan het tweede
      lid en de [artikelen 8.2 tot en met 8.29][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel8
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.1.2
    text: |-
      Veiligheids- of gezondheidssignalering wordt, al naar gelang het geval, geregeld schoongemaakt, onderhouden,
      geverifieerd en gerepareerd of zo nodig vervangen, met het oog op het behoud van hun intrinsieke of functionele
      kwaliteiten.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.1
  - number: 8.2.1
    text: |-
      De signalering met betrekking tot een verbod, een waarschuwing en een gebod, alsmede de signalering met betrekking
      tot de lokalisatie en de identificatie van reddings- of hulpmiddelen geschiedt permanent door middel van borden.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.2
  - number: 8.2.2
    text: |-
      De signalering voor de lokalisatie en identificatie van brandbestrijdingsmateriaal geschiedt permanent door middel
      van borden of een veiligheidskleur.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.2
  - number: 8.2.3
    text: |-
      De signalering op reservoirs en leidingen geschiedt overeenkomstig de [artikelen 8.4, derde lid][ref1], [8.9][ref2]
      en [8.11 tot en met 8.15][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel8
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0008587
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.2.4
    text: |-
      De signalering van gevaren van stoten tegen obstakels en van vallen van personen geschiedt permanent door middel
      van een veiligheidskleur of borden.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.2
  - number: 8.2.5
    text: De markering van verkeerswegen geschiedt permanent door middel van een veiligheidskleur.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.2
  - number: 8.3.1
    text: |-
      De signalering van gevaarlijke gebeurtenissen, de oproep van personen voor een specifieke actie, alsmede de
      dringende evacuatie van personen geschiedt occasioneel, door middel van een lichtsignaal, een akoestisch signaal of
      een mondelinge mededeling.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.3
  - number: 8.3.2
    text: |-
      Het leiden van personen die handelingen verrichten waarbij een gevaar bestaat, geschiedt occasioneel door middel
      van hand- of armseinen of mondelinge mededelingen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.3
  - number: 8.4.1
    text: 'Bij gelijke doeltreffendheid van de signalering bestaat een vrije keuze tussen:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.4
  - number: 8.4.1.a
    text: de lichtsignalen, de akoestische signalen of de mondelinge mededeling;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.4
  - number: 8.4.1.b
    text: het hand- of armsein of de mondelinge mededeling;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.4
  - number: 8.4.1.c
    text: een veiligheidskleur of een bord voor het signaleren van gevaar van struikelen, of vallen door hoogteverschil.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.4
  - number: 8.4.2
    text: 'De volgende signaleringswijzen kunnen gelijktijdig worden gebruikt:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.4
  - number: 8.4.2.a
    text: het lichtsignaal en het akoestisch signaal;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.4
  - number: 8.4.2.b
    text: het lichtsignaal en de mondelinge mededeling;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.4
  - number: 8.4.2.c
    text: het hand- of armsein en de mondelinge mededeling.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.4
  - number: 8.4.3
    text: |-
      De doeltreffendheid van een signalering mag niet in het gedrang worden gebracht door de aanwezigheid van een
      andere signalering of van andere factoren die de zicht- of hoorbaarheid verstoren, een slecht ontwerp, een
      ontoereikend aantal, een slechte plaatsing, een slechte staat of een slechte werking van de signaleringsmiddelen
      of signaleringsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.4
  - number: '8.5'
    text: 'Voor zover signalering geschiedt door middel van een veiligheidskleur wordt:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.5
  - number: 8.5.a
    text: 'met de kleur rood aangeduid:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.5
  - number: 8.5.a.1°
    text: een verbodssignaal;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.5
  - number: 8.5.a.2°
    text: gevaar of alarm;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.5
  - number: 8.5.a.3°
    text: identificatie en lokalisatie van brandbestrijdingsmateriaal en brandweeruitrusting;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.5
  - number: 8.5.b
    text: met de kleur geel of oranje-geel aangeduid een waarschuwingssignaal;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.5
  - number: 8.5.c
    text: met de kleur blauw aangeduid een gebodssignaal;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.5
  - number: 8.5.d
    text: 'met de kleur groen aangeduid:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.5
  - number: 8.5.d.1°
    text: een reddingssignaal of een eerste hulp-signaal;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.5
  - number: 8.5.d.2°
    text: een veilige situatie.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.5
  - number: '8.6'
    text: |-
      Signaleringen die een energiebron behoeven, zijn voorzien van een noodinstallatie voor het geval dat deze
      energiebron uitvalt, behalve indien het te signaleren gevaar ophoudt te bestaan bij het uitvallen van de energie.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.6
  - number: 8.7.1
    text: |-
      De licht- en geluidssignalen zijn voor de ingebruikneming op hun goede werking en reële doeltreffendheid
      gecontroleerd. Die controle wordt nadien voldoende vaak herhaald.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.7
  - number: 8.7.2
    text: |-
      Een licht- of geluidssignaal geeft bij inwerkingstelling het begin van een actie aan: de duur ervan is zo lang als
      de actie vereist.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.7
  - number: 8.7.3
    text: De licht- en geluidssignalen worden na ieder gebruik onmiddellijk opnieuw in werking gesteld.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.7
  - number: '8.8'
    text: |-
      Indien de betrokken werknemers een beperkt gehoor- of gezichtsvermogen hebben, onder meer door het dragen van
      individuele beschermende uitrusting, dienen adequate aanvullende maatregelen of vervangingsmaatregelen te worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.8
  - number: 8.9.1
    text: |-
      De pictogrammen waarvan veiligheidsborden zijn voorzien, zijn zo eenvoudig mogelijk en voor het begrip overbodige
      details worden weggelaten.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.9
  - number: 8.9.2
    text: De borden zijn gemaakt van materiaal met een zo groot mogelijke schokvastheid en weerbestendigheid.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.9
  - number: 8.9.3
    text: |-
      De borden bezitten dusdanige afmetingen en kleur- en lichttechnische eigenschappen dat zij goed zichtbaar en
      gemakkelijk te begrijpen zijn.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.9
  - number: 8.10.1
    text: |-
      Verbodsborden kenmerken zich door een ronde vorm, een zwart pictogram op witte achtergrond, rode rand en balk die
      van links naar rechts over het pictogram loopt onder een hoek van 45° ten opzichte van de horizontale lijn, waarbij
      de rode kleur ten minste 35% van het oppervlak van het bord beslaat.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.10
  - number: 8.10.2
    text: |-
      Waarschuwingsborden kenmerken zich door een driehoekige vorm, een zwart pictogram op gele achtergrond en een zwarte
      rand, waarbij de gele kleur ten minste 50% van het oppervlak van het bord beslaat.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.10
  - number: 8.10.3
    text: |-
      Gebodsborden kenmerken zich door een ronde vorm, een wit pictogram op blauwe achtergrond, waarbij de blauwe kleur
      ten minste 50% van het oppervlak van het bord beslaat.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.10
  - number: 8.10.4
    text: |-
      Reddingsborden kenmerken zich door een rechthoekige of vierkante vorm, wit pictogram op groene achtergrond, waarbij
      de groene kleur ten minste 50% van het oppervlak van het bord beslaat.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.10
  - number: 8.10.5
    text: |-
      Borden in verband met het brandbestrijdingsmateriaal kenmerken zich door een rechthoekige of vierkante vorm en een
      wit pictogram op rode achtergrond, waarbij de rode kleur ten minste 50% van het oppervlak van het bord beslaat.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.10
  - number: 8.10.6
    text: |-
      De in [bijlage XVIII][ref1] bij deze regeling opgenomen borden, worden gebruikt in de daarbij vermelde situaties.


      [ref1]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0008587
  - number: 8.10.7
    text: |-
      De gebruikte pictogrammen mogen licht afwijken van of meer gedetailleerd zijn dan de pictogrammen van de borden,
      bedoeld in [bijlage XVIII][ref1] bij deze regeling. De betekenis ervan is dan evenwel dezelfde en verschillen of
      aanpassingen maken de betekenis niet onduidelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0008587
  - number: 8.11.1
    text: |-
      De borden worden, rekening houdend met eventuele obstakels, op passende hoogte en op een passende plaats ten
      opzichte van het gezichtsveld geïnstalleerd, hetzij bij de toegang tot een zone waar een algemeen risico bestaat
      hetzij in de onmiddellijke nabijheid van een bepaald risico of het te signaleren object, en wel op een goed
      verlichte en gemakkelijk toegankelijke en zichtbare plaats.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.11
  - number: 8.11.2
    text: |-
      Bij slechte natuurlijke verlichtingsomstandigheden worden fluorescerende kleuren, reflecterende materialen of
      kunstlicht gebruikt.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.11
  - number: 8.11.3
    text: Een bord wordt verwijderd zodra de situatie die de aanwezigheid ervan rechtvaardigt, niet meer bestaat.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.11
  - number: 8.12.1
    text: |-
      Reservoirs die worden gebruikt bij werkzaamheden met dan wel de opslag van chemische stoffen of mengsels die
      overeenkomstig EG-verordening indeling, etikettering en verpakking van stoffen en mengsels als gevaarlijk worden
      ingedeeld op grond van de criteria voor enige fysische gevarenklasse of gezondheidsgevarenklasse, alsmede leidingen
      die dergelijke stoffen en mengsels bevatten of waardoor deze stoffen en mengsels worden getransporteerd, worden
      overeenkomstig die verordening voorzien van de relevante gevarenpictogrammen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.12
  - number: 8.12.2
    text: |-
      Het vorige lid is niet van toepassing op reservoirs die worden gebruikt bij werkzaamheden van korte duur of die
      vaak wisselen van inhoud mits er toereikende alternatieve maatregelen worden genomen, met name op het gebied van
      voorlichting of opleiding, die hetzelfde beschermingsniveau garanderen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.12
  - number: 8.12.3
    text: 'De in het eerste lid bedoelde gevarenpictogrammen kunnen:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.12
  - number: 8.12.3.a
    text: |-
      worden vervangen door waarschuwingsborden als weergegeven in artikel 8.10 met hetzelfde pictogram of symbool met
      dien verstande dat indien artikel 8.10 geen gelijkwaardig waarschuwingsbord bevat, het relevante gevarenpictogram
      als weergegeven in bijlage V van EG-verordening indeling, etikettering en verpakking van stoffen en mengsels wordt
      gebruikt;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.12
  - number: 8.12.3.b
    text: |-
      worden aangevuld met extra informatie zoals de naam of de formule van de gevaarlijke stof en een gedetailleerde
      beschrijving van het gevaar;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.12
  - number: 8.12.3.c
    text: |-
      voor het transport van reservoirs op de arbeidsplaats worden aangevuld met of vervangen door borden die krachtens
      de Wet vervoer gevaarlijke stoffen of de Wet luchtvaart van toepassing zijn voor het transport van gevaarlijke
      stoffen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.12
  - number: '8.13'
    text: |-
      De signalering bedoeld in [artikel 8.12][ref1] wordt aangebracht op de zichtbare zijden in de vorm van hard
      materiaal, zelfklevend materiaal of verf.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel8
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '8'
        hoofdstuk: '8'
  - number: '8.14'
    text: |-
      De op leidingen gebruikte gevarenpictogrammen of signaalwoorden worden zichtbaar en voldoende herhaald aangebracht
      in de nabijheid van de meest gevaarlijke plaatsen, zoals kleppen en aansluitingspunten.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.14
  - number: 8.15.1
    text: |-
      De signalering van plaatsen, lokalen of afgesloten ruimten die worden gebruikt voor de opslag van aanzienlijke
      hoeveelheden gevaarlijke stoffen geschiedt door een passend waarschuwingsbord als bedoeld in [artikel 8.10][ref1]
      of door gevarenpictogrammen en signaalwoorden als bedoeld in [artikel 8.12][ref2] tenzij, rekening houdend
      met [artikel 8.9, derde lid][ref3], wat de afmeting betreft, de gevarenpictogrammen en signaalwoorden van de
      afzonderlijke verpakkingen of op de reservoirs ter zake volstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel8
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0008587
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.15.2
    text: |-
      De in het eerste lid bedoelde borden of gevarenpictogrammen en signaalwoorden worden bij de opslagruimte of op de
      toegangsdeur tot de opslagruimte geplaatst.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.15
  - number: 8.15.3
    text: |-
      Indien [artikel 8.10][ref1] geen gelijkwaardig waarschuwingsbord bevat, wordt het relevante gevarenpictogram als
      weergegeven in bijlage V van EG-verordening indeling, etikettering en verpakking van stoffen en mengsels gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel8
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.15
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '8'
        hoofdstuk: '8'
  - number: '8.16'
    text: |-
      Rekening houdend met de gebruiksomstandigheden veroorzaakt het door een signaal uitgezonden licht een aan de
      omgeving aangepast lichtcontrast dat niet tot verblinding mag leiden maar voldoende zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.16
  - number: 8.17.1
    text: |-
      Het lichtoppervlak dat een signaal uitzendt, is uniform van kleur of bevat een pictogram op een bepaalde
      achtergrond.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.17
  - number: 8.17.2
    text: |-
      De uniforme kleur voldoet aan [artikel 8.5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel8
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.17.3
    text: |-
      Wanneer het signaal een pictogram bevat, voldoet dit aan [artikel 8.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel8
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.18.1
    text: |-
      Wanneer een voorziening een continu en een intermitterend signaal kan uitzenden, wordt het intermitterende signaal
      gebruikt om ten opzichte van het continue signaal aan te geven dat het gaat om een situatie die een groter gevaar
      inhoudt of waarbij de gewenste of verplichte interventie of actie met grotere spoed moet worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.18
  - number: 8.18.2
    text: |-
      Wanneer een intermitterend lichtsignaal wordt gebruikt in plaats of ter completering van een geluidssignaal, is de
      code van het signaal identiek.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.18
  - number: 8.18.3
    text: |-
      Een voorziening om een lichtsignaal uit te zenden in geval van groot gevaar, wordt speciaal in het oog gehouden of
      uitgerust met een reservelamp.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.18
  - number: 8.18.4
    text: 'De duur en de frequentie van de flitsen van een intermitterend lichtsignaal zijn zodanig dat:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.18
  - number: 8.18.4.a
    text: de boodschap van het signaal goed wordt begrepen, en
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.18
  - number: 8.18.4.b
    text: |-
      er voorkomen wordt dat verwarring ontstaat tussen verschillende lichtsignalen of tussen een continu en een
      intermitterend lichtsignaal.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.18
  - number: 8.19.1
    text: 'Een geluidssignaal:'
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.19
  - number: 8.19.1.a
    text: |-
      heeft een geluidsniveau dat duidelijk hoger is dan het niveau van het omgevingslawaai, zodat het goed hoorbaar is,
      doch niet te luid of pijnlijk voor de oren;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.19
  - number: 8.19.1.b
    text: is gemakkelijk herkenbaar;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.19
  - number: 8.19.1.c
    text: is gemakkelijk te onderscheiden van een ander geluidssignaal en andere omgevingsgeluiden.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.19
  - number: 8.19.2
    text: |-
      Wanneer een voorziening een geluidssignaal met een variabele en een vaste frequentie kan uitzenden, wordt de
      variabele frequentie gebruikt om ten opzichte van de vaste frequentie aan te geven dat het gaat om een situatie die
      een groter gevaar inhoudt of waarbij de gewenste of verplichte interventie of actie met grotere spoed moet worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.19
  - number: 8.19.3
    text: Het geluid van een ontruimingssignaal is continu.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.19
  - number: 8.20.1
    text: |-
      De mondelinge mededeling vindt plaats tussen een spreker of zender en een of meer toehoorders, en wel in de vorm
      van korte teksten, woordgroepen of afzonderlijke woorden, eventueel gecodeerd.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.2
    text: De mondelinge boodschappen zijn zo kort, eenvoudig en duidelijk mogelijk.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.3
    text: |-
      De taalvaardigheid van de spreker en het gehoorvermogen van de toehoorder zijn voldoende om een ondubbelzinnige
      communicatie tot stand te brengen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.4
    text: |-
      De mondelinge mededeling is direct door middel van gebruik van de menselijke stem of indirect door middel van de
      menselijke stem of spraaksynthese, verspreid door een middel ad hoc.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.5
    text: |-
      Indien de mondelinge mededeling wordt gebruikt in plaats van of ter aanvulling van hand- of armseinen en er geen
      codes worden gebruikt, worden met name de volgende woorden gebruikt:
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.5.a
    text: start, om het begin van een commando aan te duiden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.5.b
    text: stop, om een beweging te onderbreken of te beëindigen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.5.c
    text: einde, om de werkzaamheden stop te zetten;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.5.d
    text: hijsen, om een last te doen hijsen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.5.e
    text: vieren, om een last te doen vieren;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.5.f
    text: |-
      vooruit, achteruit, naar rechts, naar links, in combinatie met het juiste hand- of armsein, om een beweging in een
      bepaalde richting te doen plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.5.g
    text: gevaar, om een noodstop af te dwingen;
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: 8.20.5.h
    text: snel, om een beweging te versnellen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.20
  - number: '8.21'
    text: |-
      De betrokken personen kennen de gebruikte taal zodanig dat zij de boodschap correct kunnen uitspreken en begrijpen
      en zich al naar gelang van de boodschap op passende wijze kunnen gedragen op het vlak van de veiligheid of de
      gezondheid.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.21
  - number: 8.22.1
    text: Een hand- of armsein is precies en eenvoudig en bestaat uit een breed gebaar.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.22
  - number: 8.22.2
    text: Het gelijktijdig gebruik van beide armen verloopt symmetrisch en geeft slechts één enkel signaal weer.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.22
  - number: 8.23.1
    text: De seingever geeft met behulp van hand- en armseinen besturingsinstructies door aan de ontvanger van de seinen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.23
  - number: 8.23.2
    text: |-
      De seingever wijdt zijn aandacht uitsluitend aan het geven van de besturingsinstructies en de veiligheid van de
      werknemers die zich in de nabijheid bevinden.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.23
  - number: 8.23.3
    text: De seingever kan de gehele besturingsoperatie zien, zonder daarbij door de handeling gehinderd te worden.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.23
  - number: 8.23.4
    text: |-
      Wanneer niet aan de in het derde lid, genoemde voorwaarden kan worden voldaan, worden een of meer bijkomende
      seingevers ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.23
  - number: '8.24'
    text: |-
      De ontvanger van de seinen zet de in uitvoering zijnde transportbeweging stil om nieuwe instructies te vragen,
      wanneer hij de ontvangen orders niet met de nodige veiligheidsgaranties kan uitvoeren.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.24
  - number: '8.25'
    text: De seingever is makkelijk herkenbaar voor de ontvanger van de seinen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.25
  - number: '8.26'
    text: |-
      De in [bijlage XIX][ref1] bij deze regeling opgenomen hand- en armseinen, worden gebruikt in de daarbij vermelde
      situaties, waarbij deze geen afbreuk doen aan het gebruik van andere van toepassing zijnde codes, met name in
      bepaalde bedrijvigheidssectoren, waarmee dezelfde handelingen worden aangeduid.


      [ref1]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.26
    references:
      - id: ref1
        bwb_id: BWBR0008587
  - number: 8.27.1
    text: |-
      De signalering van gevaar door stoten tegen obstakels, door vallende voorwerpen of personen, geschiedt door middel
      van geel, afgewisseld met zwart, of rood afgewisseld met wit, binnen de bebouwde zones van het bedrijf of de
      inrichting waartoe de werknemer in het kader van zijn werk toegang heeft.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.27
  - number: 8.27.2
    text: |-
      De gele en zwarte of rode en witte banden worden onder een hoek van circa 45° aangebracht en hebben ongeveer
      dezelfde afmetingen.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.27
  - number: '8.28'
    text: |-
      De afmetingen van de signalering houden rekening met de afmeting van het gesignaleerde obstakel of de gesignaleerde
      gevaarlijke plaats.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.28
  - number: 8.29.1
    text: |-
      Wanneer de bescherming van de werknemers dat vereist, worden de verkeerswegen op de arbeidsplaats voor voertuigen
      duidelijk door doorlopende strepen met een goed zichtbare kleur aangegeven.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.29
  - number: 8.29.2
    text: |-
      Bij het aanbrengen van de strepen wordt rekening gehouden met de nodige veiligheidsafstanden tussen de voertuigen
      die er kunnen rijden en elk voorwerp dat zich in de nabijheid en tussen de voetgangers en de voertuigen kan
      bevinden.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel8.29
  - number: 8.29a
    text: |-
      Als overtreding ter zake waarvan een bestuurlijke boete kan worden opgelegd, wordt aangemerkt het
      handelen of het nalaten in strijd met de voorschriften welke zijn opgenomen in de [artikelen 2.0][ref1],
      [2.0a][ref2], [2.0b][ref3], [2.0c][ref4], [2.0d][ref5], [3.4][ref6], [3.5][ref7], [3.11][ref8], [3.12][ref9],
      [3.13][ref10], [3.14][ref11], [4.3 tot en met 4.7][ref12], [4.9][ref13], [4.11 tot en met 4.13][ref14],
      [4.15][ref15], [4.18][ref16], [4.19, tweede lid][ref17], [4.19b][ref18], [4.20, tweede lid][ref19],
      [4.20a2][ref20], [4.20b, eerste, derde en vierde lid][ref21], [4.20b1][ref22], [5.1 tot en met 5.3][ref23],
      [8.1, tweede lid][ref24], [8.2][ref25], [8.3][ref26], [8.4, derde lid][ref27], [8.5 tot en met 8.11][ref28],
      [8.12, eerste en tweede lid][ref29], en [8.13 tot en met 8.29][ref30].


