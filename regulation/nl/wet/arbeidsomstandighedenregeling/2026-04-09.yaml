      verzoek voor de resterende geldigheidsduur van dat certificaat ingeschreven in het Register veilig werken met
      explosieve stoffen op het competentieniveau Springmeester onder water.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel9.3
  - number: 9.3.5
    text: |-
