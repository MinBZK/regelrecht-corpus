      resterende geldigheidsduur van dat getuigschrift ingeschreven in het Register veilig werken met explosieve stoffen
      op het competentieniveau Schietmeester.
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel9.3
