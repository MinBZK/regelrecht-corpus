      deskundige of de bedrijfarts, bedoeld in [artikel 2.14a, eerste lid, van het besluit][ref2] of de arbodienst de
      volgende werkzaamheden:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
