        paragraaf: '3.2'
  - number: 3.11.5
    text: |-
      De informatie, bedoeld in [artikel 3.9, onderdeel c][ref1], wordt op verzoek van een daartoe aangewezen
      toezichthouder in tweevoud aan hem toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2026-04-09#Artikel3.11
    references:
