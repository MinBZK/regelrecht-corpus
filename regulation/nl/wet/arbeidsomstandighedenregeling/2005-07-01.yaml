  - number: 6.3a.2
    text: |-
      Een certificaat als bedoeld in het eerste lid is geldig voor een periode van ten hoogste twee jaar; na afloop
      van die periode kan de geldigheidsduur van een certificaat op aanvraag telkens met ten hoogste twee jaar worden
      verlengd, indien de aanvrager kan aantonen dat hij de noodzakelijke kennis heeft bijgehouden en in de afgelopen
      periode nodige ervaring als duikerarts heeft gehad.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3a
  - number: 6.3a.3
    text: |-
      De aanvrager van een certificaat verstrekt aan de minister of, indien de minister een certificerende instelling
      heeft aangewezen, de certificerende instelling, de relevante gegevens met betrekking tot opleiding, diploma's en
      kennis en beroepservaring als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3a
  - number: 6.3a.4
    text: 'Op de certificaten, bedoeld in het eerste lid, worden de volgende gegevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3a
  - number: 6.3a.4.a
    text: de categorie duikerarts;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3a
  - number: 6.3a.4.b
    text: de geldigheidsduur, en
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3a
  - number: 6.3a.4.c
    text: de geldigheidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3a
  - number: '6.4'
    text: |-
