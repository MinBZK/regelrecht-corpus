        artikel: '6'
  - number: 9.2d.2
    text: |-
      [Artikel 6.3, eerste lid][ref1], geldt ten aanzien van de ploegleider bij de brandweer niet tot 1 juli 2005 mits de
      aanvrager van het certificaat duikploegleider blijk heeft gegeven te beschikken over voldoende relevante en actuele
      kennis en beroepservaring.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel6
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel9.2d
