  - number: 2.11.2
    text: |-
      Een certificaat arbodienst als bedoeld in [artikel 2.14, tweede lid, van het besluit][ref1] wordt door
      de minister of, indien de minister een certificerende instelling als bedoeld in [artikel 2.7][ref2]
      heeft aangewezen, de certificerende instelling, afgegeven indien de bijstand bij de taken, bedoeld
      in [artikel 14, eerste lid, van de wet][ref3] naar behoren kan worden uitgevoerd, en wordt voldaan
      aan de [artikelen 13, zesde lid][ref4], [14, derde lid][ref5] en [14a, vierde lid, van de wet][ref6],
      de [artikelen 2.7][ref7], [2.9][ref8], [2.11][ref9] en [2.12 van het besluit][ref10], de
      [artikelen 2.1 tot en met 2.6][ref11] en [2.13, eerste lid][ref12], en bij de uitvoering van taken een
      kwaliteitssysteem wordt gehanteerd, dat bewerkstelligt dat aan deze wettelijke vereisten wordt voldaan en dat
      voldoet aan normen waarmee de belanghebbende groeperingen hebben ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel2
