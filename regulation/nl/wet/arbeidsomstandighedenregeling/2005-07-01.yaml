      - id: ref4
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.11.2
    text: |-
      Het gedetailleerd ontwerp, opstarten en gebruik, bedoeld in [artikel 3.8, eerste en tweede lid][ref1], wordt acht
      weken voor het in gebruik nemen van een mijnbouwwerk in tweevoud toegezonden aan een daartoe aangewezen ambtenaar
      als bedoeld in [artikel 24 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.11.3
    text: |-
      Het addendum gebruik, bedoeld in [artikel 3.8, eerste en tweede lid][ref1], wordt voor de eerste maal vijf jaar na
      toezending van het gedetailleerd ontwerp, opstarten en gebruik en vervolgens eenmaal in de vijf jaar in tweevoud
      toegezonden aan een daartoe aangewezen ambtenaar als bedoeld in [artikel 24 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.11.4
    text: |-
      Het addendum grote wijzigingen, bedoeld in [artikel 3.8, eerste en tweede lid][ref1], wordt acht weken voor de
      aanvang van het aanbrengen van de wijzigingen in tweevoud toegezonden aan een daartoe aangewezen ambtenaar als
      bedoeld in [artikel 24 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.11.5
    text: |-
      Het addendum verlaten en verwijderen, bedoeld in [artikel 3.8, eerste lid][ref1], wordt acht weken voor het
      verlaten van een mijnbouwwerk of het verwijderen van een vast opgestelde mijnbouwinstallatie in tweevoud
      toegezonden aan een daartoe aangewezen ambtenaar als bedoeld in [artikel 24 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.12.1
    text: |-
      Het veiligheids- en gezondheidsdocument, bedoeld in [artikel 3.7][ref1], wordt vier weken voor de
      aanvang van de werkzaamheden in tweevoud toegezonden aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.12.2
    text: |-
      Dit veiligheids- en gezondheidsdocument gaat vergezeld van het werkprogramma, bedoeld in
      [artikel 74 van het Mijnbouwbesluit][ref1] indien het de volgende werkzaamheden betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0014394#Artikel74
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0014394
        artikel: '74'
  - number: 3.12.2.a
    text: het boren van een boorgat;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.12
  - number: 3.12.2.b
    text: het uitvoeren van werkzaamheden in een bestaand boorgat.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.12
  - number: 3.12.3
    text: |-
      In afwijking van het eerste lid wordt de informatie, bedoeld in [artikel 3.9, onderdeel c][ref1], op verzoek van
      een daartoe aangewezen ambtenaar als bedoeld in [artikel 24 van de wet][ref2] in tweevoud aan hem toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.13.1
    text: |-
      De werkgever die verantwoordelijk is voor het mijnbouwwerk, bedoeld in [artikel 3.6, eerste lid][ref1],
      gaat na of het veiligheids- en gezondheidsdocument, met uitzondering van het voorontwerprapport, bedoeld in
      [artikel 3.8, eerste lid, onder a][ref2], wordt nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.13.2
    text: |-
      De werkgever die verantwoordelijk is voor het mijnbouwwerk, bedoeld in [artikel 3.6, eerste lid][ref1], beoordeelt
      regelmatig en systematisch de naleving en de doeltreffendheid van het veiligheids- en gezondheidsdocument.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.13.3
    text: |-
      Indien de resultaten van de beoordeling, bedoeld in het tweede lid, daartoe aanleiding geven, herziet
      de werkgever die verantwoordelijk is voor de arbeidsplaats het veiligheids- en gezondheidsdocument. De
      herziene delen van het veiligheids- en gezondheidsdocument worden, alvorens het gewijzigde veiligheids- en
      gezondheidsdocument wordt uitgevoerd, in tweevoud toegezonden aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel24
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.13
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '24'
  - number: 3.14.1
    text: |-
      Het noodplan, bedoeld in [artikel 3.37v, van het besluit][ref1] bevat in ieder geval de informatie, bedoeld in
      [bijlage IIIE][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 3.14.2
    text: |-
      Het noodplan is op het mijnbouwwerk, bedoeld in [artikel 3.6, eerste lid][ref1], aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.14
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '4.1'
    text: 'Voor de toepassing van deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.a
    text: 'brandbare vloeistoffen: vloeistoffen waarvan het vlampunt niet hoger is dan 100°C;'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.b
    text: |-
      K0-, K1- en K2-vloeistoffen: brandbare vloeistoffen, met een vlampunt lager of gelijk aan 55°C, waaronder mede
      begrepen brandbare gassen, al dan niet in vloeibare vorm, voor zover niet begrepen onder KT-vloeistoffen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.c
    text: 'K3-vloeistoffen: brandbare vloeistoffen, geen KT-vloeistoffen zijnde, waarvan het vlampunt hoger is dan 55°C;'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.d
    text: |-
      KT-vloeistoffen: brandbare vloeistoffen, waaronder mede begrepen brandbare gassen, al dan niet in vloeibare vorm,
      welke gevaar voor vergiftiging, bedwelming of verstikking kunnen opleveren;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.e
    text: |-
      T-vloeistoffen: vloeistoffen, niet zijnde brandbare vloeistoffen, waaronder mede begrepen gassen, al dan niet in
      vloeibare vorm, welke gevaar voor vergiftiging bedwelming of verstikking kunnen opleveren;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.f
    text: |-
      K1-ruimte: een tot een schip behorende ruimte waarin K0-, K1- of K2-vloeistoffen en geen KT-vloeistoffen of resten
      daarvan anders dan in verpakking voorkomen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.g
    text: |-
      K3-ruimte: een tot een schip behorende ruimte waarin geen andere brandbare vloeistoffen dan K3-vloeistoffen of
      resten daarvan anders dan in verpakking voorkomen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.h
    text: |-
      KT-ruimte:een tot een schip behorende ruimte waarin KT-vloeistoffen of resten daarvan anders dan in verpakking
      voorkomen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.i
    text: |-
      T-ruimte: een tot een schip behorende ruimte waarin T-vloeistoffen en geen KT-vloeistoffen of resten daarvan anders
      dan in verpakking voorkomen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.j
    text: 'K1-schip: een schip waarvan een of meer van de ladingtanks een K1-ruimte is of voor het schoonmaken daarvan was;'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.k
    text: |-
      K3-schip: een schip, in de ladingtanks waarvan noch andere brandbare vloeistoffen dan K3-vloeistoffen geen T-
      vloeistoffen of resten van een van die vloeistoffen anders dan in verpakking voorkomen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.l
    text: 'KT-schip: een schip waarvan een of meer van de ladingtanks een KT-ruimte is of voor het schoonmaken daarvan was;'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.m
    text: |-
      T-schip: een schip, niet zijnde een K1- of KT-schip, waarvan een of meer van de ladingtanks een T-ruimte is of voor
      het schoonmaken daarvan was;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.n
    text: |-
      vuur: vuur, vonkvorming, open licht of elk oppervlak met een temperatuur welke gelijk is aan of hoger is dan de
      minimumontstekingstemperatuur van de vloeistoffen of de gassen die de ladingtanks bevatten of waarvan resten in die
      tanks voorkomen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.o
    text: 'werk met vuur: werkzaamheden waarbij vuur wordt gebruikt of kan ontstaan;'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.p
    text: 'koud werk: werkzaamheden waarbij geen vuur wordt gebruikt of kan ontstaan;'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.q
    text: |-
      schoonmaken: iedere handeling die gericht is op of verband houdt met het schoon-, gasvrij- of droogmaken van een
      K1-, KT-, K3- of T-ruimte;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.r
    text: |-
      ladingzone: de ladingtanks en alle rechtstreeks aan deze tanks grenzende tanks of andere ruimten, welke als
      afscheiding dienen tussen de ladingtanks en de overige ruimten van het schip;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
  - number: 4.1.s
    text: |-
      gasdeskundige: een deskundig persoon als bedoeld in [artikel 4.7, derde lid, van het besluit][ref1] die voldoet aan
      de [artikelen 4.14][ref2] en [4.15][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.t
    text: |-
      veiligheids- en gezondheidsverklaring: een door een gasdeskundige na een doeltreffend onderzoek afgegeven
      verklaring als bedoeld in [artikel 4.7, derde lid, van het besluit][ref1], overeenkomstig een van de bij
      [bijlage IVA][ref2] van deze regeling vastgestelde modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008587
  - number: '4.2'
    text: |-
      Deze paragraaf is van toepassing op de in [artikel 4.7, eerste lid, van het besluit][ref1] bedoelde werkzaamheden
      op K1-, K3-, KT- of T-schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: '4.3'
    text: |-
      Indien zich bij of als gevolg van het verrichten van de werkzaamheden, bedoeld in
      [artikel 4.7, eerste lid, van het besluit][ref1] gevaarlijke gassen concentreren en deze door onvoldoende
      luchtbeweging niet snel genoeg worden verdund of afgevoerd, worden maatregelen getroffen om deze concentraties
      te beperken. Indien dit niet in voldoende mate mogelijk is, worden de tankdeksels gesloten en de desbetreffende
      werkzaamheden gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.4.1
    text: |-
      Alvorens werknemers de schoon te maken ruimten betreden, is vastgesteld dat zulks zonder gevaar voor de veiligheid
      en gezondheid kan geschieden.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.4
  - number: 4.4.2
    text: |-
      Een schoon te maken ruimte wordt niet betreden zolang als gevolg van werkzaamheden in een aangrenzende ruimte de
      temperatuur van de schotten aanmerkelijk hoger kan worden dan de omgevingstemperatuur.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.4
  - number: 4.4.3
    text: |-
      Een schoon te maken ruimte wordt evenmin betreden zolang in een aangrenzende ruimte een explosief mengsel aanwezig
      is en deze ruimte niet is gesloten.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.4
  - number: 4.4.4
    text: |-
      Tijdens het schoonmaken worden aan dek en in de ladingzone geen andere werkzaamheden verricht dan die welke verband
      houden met het schoonmaken.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.4
  - number: '4.5'
    text: |-
      Tijdens het schoonmaken wordt zo dikwijls als dit nodig is, onderzocht of als gevolg van vrijkomende vloeistoffen,
      gassen of dampen gevaar voor brand, ontploffing, bedwelming, verstikking of vergiftiging ontstaat.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.5
  - number: 4.6.1
    text: |-
      Het schoonmaken van K1-, K3- en KT-ruimten is erop gericht de concentratie van gassen en dampen onder de onderste
      explosiegrens te houden of op veilige wijze tot onder die grens terug te brengen. Indien tijdens het schoonmaken
      een gassamenstelling optreedt, welke gevaar oplevert voor een ontploffing, wordt de duur van deze toestand zo kort
      mogelijk gehouden. Indien het schoonmaken geschiedt met gebruikmaking van inert gas, wordt dit op zodanige wijze
      uitgevoerd, dat een ontplofbaar mengsel niet kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.6
  - number: 4.6.2
    text: |-
      Het schoonmaken van K1-, K3-, KT- en T-ruimten wordt zo uitgevoerd, dat binnen en buiten die ruimten naar redelijke
      verwachting geen gevaar voor bedwelming, verstikking of vergiftiging kan ontstaan. Indien het schoonmaken geschiedt
      met gebruikmaking van inert gas, wordt dit op zodanige wijze uitgevoerd, dat een ontplofbaar mengsel niet kan
      optreden.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.6
  - number: 4.7.1
    text: |-
      Het schoonmaken van K1-, K3- of KT-ruimten aan boord van K1-, K3-, of KT-schepen vindt slechts plaats indien binnen
      een afstand van 25 meter van de ladingzone geen vuur aanwezig is noch naar redelijke verwachting kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.7
  - number: 4.7.2
    text: |-
      Het schoonmaken van K1-, K3- of KT-ruimten aan boord van K1-, K3-, of KT-schepen vindt slechts plaats indien
      binnen een afstand van 25 meter van de ladingzone geen gevaar bestaat voor vonkvorming of ontstekingsgevaar door
      elektrostatische ladingen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.7
  - number: 4.7.3
    text: |-
      Het schoonmaken van K1-, K3- of KT-ruimten aan boord van K1-, K3-, of KT-schepen vindt slechts plaats indien binnen
      een afstand van 25 meter van de ladingzone niet gerookt wordt.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.7
  - number: 4.7.4
    text: |-
      Het schoonmaken van K1-, K3- of KT-ruimten aan boord van K1-, K3-, of KT-schepen vindt slechts plaats indien er
      binnen een afstand van 25 meter van de ladingzone geen onbevoegden kunnen komen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.7
  - number: 4.7.5
    text: |-
      De ladingtanks in de gehele ladingzone van K1,- K3- en KT-schepen worden niet geopend dan nadat aan het eerste tot
      en met vierde lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.7
  - number: 4.7.6
    text: De ladingtanks in de gehele ladingzone van T-schepen worden niet geopend dan nadat aan het vierde lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.7
  - number: '4.8'
    text: |-
      De [artikelen 4.4, vierde lid][ref1], en [4.7][ref2] zijn niet van toepassing op K3-ruimten buiten de ladingzone op
      K1-, KT- en T-schepen indien met betrekking tot deze schepen een veiligheids- en gezondheidsverklaring als bedoeld
      in [artikel 4.1, onder t][ref3], is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.9.1
    text: |-
      Het onderhouden, verbouwen, herstellen en slopen van K1-, K3-, KT- of T-schepen vindt slechts plaats nadat een
      onderzoek, uitgevoerd overeenkomstig de bij [artikel 4.10][ref1] gestelde regels heeft plaatsgevonden en in verband
      met dit onderzoek een volledig en correct ingevulde veiligheids- en gezondheidsverklaring is uitgereikt aan de
      werkgever die de onderhouds-, herstellings-, verbouwings-, of sloopwerkzaamheden zal uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.9.2
    text: |-
      Het onderhouden, verbouwen, herstellen en slopen van K1-, K3-, KT- of T-schepen vindt voorts slechts plaats voor
      zover die werkzaamheden en de ruimten waarin deze worden uitgevoerd, zijn vermeld in de in het eerste lid bedoelde
      veiligheids- en gezondheidsverklaring als zijnde toegestaan.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.9
  - number: 4.9.3
    text: Een veiligheids- en gezondheidsverklaring als bedoeld in het eerste lid wordt bij een gasdeskundige aangevraagd.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.9
  - number: 4.9.4
    text: |-
      Bij de aanvraag worden alle inlichtingen verstrekt, welke met het oog op de afgifte van de veiligheids- en
      gezondheidsverklaring van belang zijn, terwijl desverlangd nadere inlichtingen ter zake worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.9
  - number: 4.10.1
    text: |-
      Het in [artikel 4.9][ref1] bedoelde onderzoek wordt ingesteld door de gasdeskundige, die de uitslag van dat
      onderzoek vermeldt op de door hem uit te reiken veiligheids- en gezondheidsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.10.2
    text: |-
      De gasdeskundige strekt dit onderzoek uit over alle ruimten ten aanzien waarvan hij dit in verband met de aard
      van de te verrichten werkzaamheden noodzakelijk acht. Bij het onderzoek betrekt de gasdeskundige zo nodig een
      goed geoutilleerd laboratorium. Hij maakt gebruik van deugdelijke, in goede staat verkerende meet- en andere
      hulpapparatuur.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.3
    text: 'Hij stelt vast of de te onderzoeken ruimten:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.3.a
    text: K1-, KT-, K3- of T-ruimten zijn;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.3.b
    text: 'veilig voor mensen zijn in die zin, dat:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.3.b.1º
    text: werknemers die ruimten zonder gebruik van persoonlijke beschermingsmiddelen kunnen betreden, en
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.3.b.2º
    text: |-
      geen gevaar voor bedwelming, verstikking, vergiftiging of letsel bestaat, met dien verstande dat een ruimte ten
      aanzien waarvan het voorgaande niet is gebleken, op de veiligheids- en gezondheidsverklaring wordt aangeduid als
      “niet veilig voor mensen”;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.3.c
    text: 'veilig voor vuur zijn in die zin, dat:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.3.c.1º
    text: de resten van brandbare vloeistoffen daaruit zijn verwijderd zodat geen gevaar bestaat voor brand;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.3.c.2º
    text: |-
      eventueel nog aanwezige brandbare gassen of dampen nergens een concentratie in de lucht vormen, welke hoger ligt
      dan 20% van de onderste explosiegrens;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.3.c.3º
    text: |-
      de aangrenzende ruimten hetzij voldoen aan het onder 1° en 2° gestelde, hetzij tot de top zijn gevuld met water
      waarop zich geen K0-, K1-, K2- of KT-vloeistoffen bevinden, hetzij op andere wijze brand- en explosie-veilig zijn
      gemaakt,
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.4
    text: 'De gasdeskundige reikt een veiligheids- en gezondheidsverklaring uit, indien hij heeft vastgesteld, dat:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.4.a
    text: de ruimten waarin koud werk moet worden verricht, veilig voor mensen zijn;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.4.b
    text: de ruimten waarin werk met vuur moet worden verricht, zowel veilig voor mensen als veilig voor vuur zijn;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.4.c
    text: |-
      de toestand waarin andere dan de onder a en b bedoelde ruimten zich bevinden en de wijze waarop zij zijn
      afgesloten, zodanig zijn dat de in de verklaring aangewezen werkzaamheden zonder gevaar voor de veiligheid en
      gezondheid van de werknemers uitgevoerd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.5
    text: |-
      Hij reikt een veiligheids- en gezondheidsverklaring voor het verrichten van werk met vuur in een deel van de
      ladingzone van K1- en KT-schepen slechts uit, indien hem ten minste zes uren na de in het vierde lid bedoelde
      vaststelling uit een doeltreffend onderzoek is gebleken, dat de in dat lid vermelde ruimten nog steeds voldoen aan
      de daarbij gestelde eisen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.6
    text: |-
      In afwijking van het vierde lid reikt hij een veiligheids- en gezondheidsverklaring voor het verrichten van werk
      met vuur in de ladingzone van K1- en KT-schepen slechts uit, indien hij heeft vastgesteld, dat:
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.6.a
    text: |-
      de gehele ladingzone veilig voor mensen als bedoeld in het derde lid, onder b, en veilig voor vuur als bedoeld in
      het derde lid, onder c, is, en
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.6.b
    text: |-
      de toestand waarin andere dan de onder a bedoelde ruimten zich bevinden en de wijze waarop zij zijn afgesloten,
      zodanig zijn dat de in de veiligheids- en gezondheidsverklaring aangewezen werkzaamheden veilig uitgevoerd kunnen
      worden en indien hem ten minste zes uren na die vaststelling uit een doeltreffend onderzoek is gebleken, dat geen
      wijziging heeft plaatsgevonden in de onder a en b bedoelde toestand.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: 4.10.7
    text: |-
      Een veiligheids- en gezondheidsverklaring is niet van toepassing op leidingen in of buiten het tankschip en
      is alleen geldig als zij volledig en juist is ingevuld en zolang de toestand op grond waarvan de verklaring is
      verleend ongewijzigd is.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.10
  - number: '4.11'
    text: |-
      Werk met vuur boven dan wel in een deel van de ladingzone aan een K1- of KT-schip dat niet veilig voor vuur is als
      bedoeld in [artikel 4.10, derde lid, onder c][ref1] en waarbij in afwijking van [artikel 4.9][ref2] niet de daartoe
      vereiste veiligheids- en gezondheidsverklaring is uitgereikt is alleen dan toegestaan indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.11.a
    text: |-
      de aard van de werkzaamheden, de plaats of plaatsen waar deze werkzaamheden zullen worden uitgevoerd en de periode
      waarin zij zullen worden verricht, nauwkeurig zijn aangeduid door de reparateur;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.11
  - number: 4.11.b
    text: |-
      de plaatsen waar vonken of gloeiende metaaldelen kunnen neerkomen door de werkzaamheden, nauwkeurig zijn aangeduid
      door de reparateur;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.11
  - number: 4.11.c
    text: |-
      de plaatsen waar aanmerkelijke temperatuurverhoging kan optreden als gevolg van de werkzaamheden, nauwkeurig zijn
      aangeduid door de reparateur;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.11
  - number: 4.11.d
    text: |-
      door een gasdeskundige een gedagtekende verklaring is uitgereikt waaruit blijkt dat op de onder a tot en met c
      bedoelde plaatsen de resten van brandbare vloeistoffen zijn verwijderd, zodat geen brandgevaar bestaat;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.11
  - number: 4.11.e
    text: |-
      door een gasdeskundige een volledig en juist ingevulde veiligheids- en gezondheidsverklaring is afgegeven waaruit
      blijkt dat ruimten waarin gewerkt moet worden en aangrenzende ruimten veilig voor mensen zijn of geïnertiseerd als
      bedoeld in [artikel 4.10, derde lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.11
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.12.1
    text: |-
      Binnen 25 meter van de ladingzone op een K1, of KT-schip dat niet veilig voor vuur is als bedoeld in
      [artikel 4.10, derde lid, onder c][ref1], en waarvoor, in afwijking van [artikel 4.9][ref2] niet de daartoe
      vereiste veiligheids- en gezondheidsverklaring is uitgereikt, is de aanwezigheid van vuur slechts toegestaan indien
      door een gasdeskundige voor de aanvang van de werkzaamheden een verklaring is afgegeven waaruit blijkt, dat de
      ladingzone veilig voor mensen is als bedoeld in [artikel 4.10, derde lid, onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.12
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.12.2
    text: |-
      De aanwezigheid van vuur, bedoeld in het eerste lid, is voorts toegestaan indien blijkt uit de verklaring, bedoeld
      in voornoemd lid, dat:
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.12
  - number: 4.12.2.a
    text: |-
      de brandbare gassen in de atmosfeer van de ladingzone nergens een concentratie van meer dan 20% van de onderste
      explosiegrens vormen, of
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.12
  - number: 4.12.2.b
    text: |-
      de toestand van de in de ladingzone aanwezige atmosfeer zodanig is dat bij verdunning daarvan met lucht geen
      brandbaar of explosief mengsel ontstaat.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.12
  - number: '4.13'
    text: |-
      Indien de situaties, bedoeld in de [artikelen 4.11][ref1] en [4.12][ref2], zich voordoen ontvangt de in
      [artikel 24, eerste lid, van de wet][ref3] daartoe aangewezen ambtenaar voor de aanvang van de werkzaamheden
      een volledig en juist ingevuld meldingsformulier overeenkomstig het bij [bijlage IVB][ref4] bij deze regeling
      vastgestelde model.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0010346
        artikel: '24'
      - id: ref4
        bwb_id: BWBR0008587
  - number: '4.14'
    text: |-
      Een certificaat van vakbekwaamheid gasdeskundige als bedoeld in [artikel 4.7, vierde lid, van het besluit][ref1]
      wordt door de minister of, indien de minister een certificerende instelling heeft aangewezen, de certificerende
      instelling, afgegeven indien de aanvrager voldoet aan de eisen, bedoeld in versie 1 van de Regeling SGT ref.nr.
      SKO/03035/S van de Stichting voor de Certificatie van Vakbekwaamheid SKO, vastgesteld per 19 november 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.14
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: '4.16'
    text: |-
      Een certificaat van vakbekwaamheid springmeester als bedoeld in [artikel 4.8, tweede lid, van het besluit][ref1]
      wordt door de minister of, indien de minister een certificerende instelling heeft aangewezen, de certificerende
      instelling, afgegeven indien de aanvrager voldoet aan de eisen, bedoeld in versie 1 van de Regeling SPR ref.nr.
      SKO/03036/S van de Stichting voor de Certificatie van Vakbekwaamheid SKO, vastgesteld per 19 november 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.17a.1
    text: |-
      In deze paragraaf wordt verstaan onder:

              a
              groot vuurwerk:

                professioneel vuurwerk dat bestemd is voor gebruik buiten tijdens een evenement of voorstelling;



              b
              pyrotechnische speciale effecten:

                professioneel vuurwerk dat bestemd is voor gebruik tijdens een evenement of voorstelling met geringe
      publieksafstanden en waarvan door de fabrikant of importeur is aangegeven dat het voor dit gebruik geschikt is.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.17a
  - number: 4.17a.2
    text: |-
      Voor de toepassing van deze paragraaf wordt consumentenvuurwerk als bedoeld in
      [artikel 1.1.1, eerste lid, van het Vuurwerkbesluit][ref1], dat wordt bestemd voor gebruik tijdens een evenement of
      voorstelling of dat wordt bewerkt ten behoeve van een evenement of voorstelling aangemerkt als groot vuurwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0013360#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.17a
    references:
      - id: ref1
        bwb_id: BWBR0013360
        artikel: '1'
  - number: 4.17b.1
    text: |-
      Een certificaat van vakbekwaamheid professioneel vuurwerk als bedoeld in
      [artikel 4.8a, tweede lid, van het besluit][ref1] wordt door de minister of, indien de minister een certificerende
      instelling heeft aangewezen, de certificerende instelling, afgegeven indien de aanvrager voldoet aan de eisen,
      bedoeld in het document Certificatie-eisen Vuurwerkdeskundige versie 1 van Kiwa Certificatie en Keuringen N.V,
      vastgesteld per 14 februari 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.17b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.17b.2
    text: |-
      Een bewijs van vakbekwaamheid dat, met betrekking tot het veilig werken met professioneel vuurwerk, door
      een lidstaat van de Europese Unie anders dan Nederland of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte is voorgeschreven en dat naar het oordeel van de minister of, indien
      de minister een certificerende instelling heeft aangewezen, de certificerende instelling, qua vereist niveau van
      vakbekwaamheid gelijkwaardig is, wordt gelijkgesteld aan het certificaat van vakbekwaamheid, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.17b
  - number: 4.17b.3
    text: |-
      De beoordeling van gelijkwaardigheid, bedoeld in het tweede lid, vindt plaats aan de hand van de procedure
      Beoordeling buitenlandse opleidingen in het kader van de persoonscertificatie Vuurwerkdeskundige van Kiwa
      Certificatie en Keuringen NV, met kenmerk 02-41, vastgesteld per 25 september 2002.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.17b
  - number: 4.17d
    text: |-
      Het werkplan, bedoeld in [artikel 4.8a, eerste lid, van het besluit][ref1] omvat tenminste de gegevens, bedoeld in
      [bijlage VB][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.17d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 4.18.1
    text: |-
      Het is verboden lucht die, als gevolg van werkzaamheden of de aanwezigheid van een stof op de arbeidsplaats,
      een stof als bedoeld in het vierde lid bevat, opnieuw in circulatie te brengen naar een arbeidsplaats waar de
      betreffende stof niet aanwezig is.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.18
  - number: 4.18.2
    text: |-
      Het is verboden de lucht, bedoeld in het eerste lid, opnieuw op dezelfde arbeidsplaats in circulatie te brengen,
      tenzij de werkgever aantoont dat de concentratie van een stof als bedoeld in het vierde lid in de lucht die
      wordt toegevoerd aan de arbeidsplaats, ten hoogste één tiende deel van de voor die stof vastgestelde grenswaarde
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.18
  - number: 4.18.3
    text: |-
      Indien voor een stof als bedoeld in het vierde lid geen grenswaarde is vastgesteld, bedraagt, voor de toepassing
      van het tweede lid, de concentratie van de stof in de lucht die wordt toegevoerd aan de arbeidsplaats ten hoogste
      één tiende deel van de door de werkgever naar de huidige stand van de wetenschap en inzichten vastgestelde waarde.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.18
  - number: 4.18.4
    text: 'Dit artikel is van toepassing op de volgende stoffen:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.18
  - number: 4.18.4.a
    text: |-
      kankerverwekkende en mutagene stoffen als bedoeld in [artikel 4.11, onderdelen b en d, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.18.4.b
    text: |-
      een stof die vrijkomt bij een kankerverwekkend proces als bedoeld in
      [artikel 4.11, onderdeel c, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.18.4.c
    text: |-
      stoffen die voldoen aan de criteria, vastgesteld op grond van
      [artikel 34, derde lid, van de Wet milieugevaarlijke stoffen][ref1] voor toekenning van de R-zin ‘kan
      overgevoeligheid veroorzaken bij inademing (R42)’.


      [ref1]: https://wetten.overheid.nl/BWBR0003892#Artikel34
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.18
    references:
      - id: ref1
        bwb_id: BWBR0003892
        artikel: '34'
  - number: 4.19.1
    text: |-
      Als grenswaarden als bedoeld in [artikel 4.8b, eerste lid, van het besluit][ref1] worden aangewezen de waarden die
      zijn opgenomen in [bijlage VI][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 4.19a
    text: |-
      Als grenswaarde als bedoeld in [artikel 4.8b, tweede lid van het besluit][ref1], wordt voor lood vastgesteld: 70
      µg/100 ml bloed.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.19a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20.1
    text: |-
      Als grenswaarden als bedoeld in [artikel 4.16, eerste lid, van het besluit][ref1] worden aangewezen de waarden die
      zijn opgenomen in [bijlage VII][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 4.20.2
    text: |-
      De resultaten van de beoordeling, bedoeld in [artikel 4.2, eerste lid, van het besluit][ref1] worden voor elke stof
      waarvoor overeenkomstig het eerste lid een grenswaarde is vastgesteld, getoetst aan die grenswaarde. De toetsing
      vindt plaats volgens een voor dat doel geschikte genormaliseerde methode.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20a.1
    text: |-
      In het kader van de beoordeling, bedoeld in [artikel 4.2, van het besluit][ref1] wordt de concentratie van lood in
      de lucht om de drie maanden gemeten. Er kan worden volstaan met eenmaal per jaar meten, indien er geen verandering
      in de werkmethoden en de omstandigheden van de blootstelling plaatsvindt, en


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.20a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20a.1.a
    text: |-
      het loodgehalte in het bloed van geen enkele werknemer, gemeten overeenkomstig artikel 4.10b van het besluit, meer
      bedraagt dan 60 µg/100 ml bloed, of
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.20a
  - number: 4.20a.1.b
    text: |-
      uit twee opeenvolgende voorafgaande metingen is gebleken, dat de concentratie van lood in de lucht minder bedraagt
      dan 100 µg/m3 lucht of dat de omstandigheden van de blootstelling niet merkbaar variëren.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.20a
  - number: 4.20a.2
    text: |-
      De bepaling van de concentratie van lood in de lucht, als bedoeld in het eerste lid, geschiedt met behulp van de
      atomaire arbsorptiespectrometrie of een andere analysemethode, die gelijkwaardige resultaten oplevert.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.20a
  - number: 4.20b.1
    text: |-
      In het kader van de beoordeling, bedoeld in [artikel 4.2 van het besluit][ref1], worden de werknemers ten minste
      tweemaal per jaar in de gelegenheid gesteld tot het meten van het loodgehalte in het bloed.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.20b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20b.2
    text: |-
      De frequentie van het meten van het loodgehalte in bloed kan worden teruggebracht tot eenmaal per jaar, indien
      het loodgehalte van geen enkele werknemer meer bedraagt dan 50 µg/100 ml bloed en uit de twee opeenvolgende
      voorafgaande metingen is gebleken dat de concentratie van lood in de lucht minder bedraagt dan 100 µg/m³ lucht.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.20b
  - number: 4.20b.3
    text: |-
      Het loodgehalte in het bloed als bedoeld in [artikel 4.10b, tweede lid, van het besluit][ref1] wordt gemeten met
      behulp van de atomaire absorptiespectrometrie of een andere gelijkwaardige methode.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.20b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.20b.4
    text: |-
      De resultaten van de meting, bedoeld in het eerste lid, worden getoetst aan de grenswaarde, bedoeld in
      [artikel 4.19a][ref1]. De toetsing vindt plaats volgens een voor dat doel geschikte genormaliseerde methode.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.20b
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.4'
  - number: 4.20b.5
    text: |-
      Het arbeidsgezondheidskundig onderzoek, bedoeld in [artikel 4.10b, eerste lid, onder c, van het besluit][ref1],
      wordt de werknemers ten minste eenmaal per jaar aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.20b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: '4.21'
    text: |-
      De metingen, bedoeld in [artikel 4.50, tweede lid, van het besluit][ref1] worden overeenkomstig de
      [artikelen 4.22 tot en met 4.26][ref2] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.21
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: '4.22'
    text: |-
      Monsters worden genomen uit de individuele ademzone van de werknemers, dat wil zeggen binnen een halve bol met een
      straal van 300 mm frontaal voor het gezicht en gemeten vanaf het midden van een lijn, die de oren verbindt.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.22
  - number: '4.23'
    text: 'Bij monsterneming wordt gebruik gemaakt van:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.23
  - number: 4.23.a
    text: |-
      membraanfilters van gemengde esters van cellulose of cellulosenitraat, met een poriëngrootte van 0,8 tot 1,2
      micrometer met gedrukte vierkanten en een doorsnede van 25 mm en een optimale belasting van 100/400 vezels per mm²;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.23
  - number: 4.23.b
    text: |-
      een open filterhouder, voorzien van een cilindervormige kap die zich tussen 33 en 44 mm voor het filter bevindt,
      waardoor een cirkelvormig oppervlak van ten minste 20 mm doorsnee wordt blootgesteld, waarvan de kap bij het
      gebruik naar beneden is gericht;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.23
  - number: 4.23.c
    text: |-
      een draagbaar pompje met batterijvoeding dat de werknemer tijdens de monsterneming meedraagt, waarvan de
      luchtsnelheid regelmatig is en wordt afgesteld op 1 liter per minuut ± 5%; deze luchtsnelheid blijft tijdens de
      periode van de monsterneming gehandhaafd binnen ± 10% van aanvankelijke stroomsnelheid, waarbij voor de duur van de
      monsterneming een marge van 2% is toegestaan.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.23
  - number: 4.24.1
    text: 'De voor de vezeltelling te gebruiken binoculaire microscoop heeft de volgende kenmerken:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.24
  - number: 4.24.1.a
    text: Koehler-verlichting;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.24
  - number: 4.24.1.b
    text: |-
      onder de voorwerptafel is een centreerring, een Abbe- of achromatische fasecontrastcondensor ingebouwd, waarbij het
      fasecontrast onafhankelijk van het mechanisme van de condensorcentrering wordt ingesteld;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.24
  - number: 4.24.1.c
    text: |-
      een positief par-focaal achromatisch fasecontrastobjectief, met een vergroting van 40 maal en met een numerieke
      opening van 0,65 tot 0,70 en een fase-ring-absorptie van 65 tot 85%;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.24
  - number: 4.24.1.d
    text: een algeheel gecompenseerd oculair met een vergroting van 12,5;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.24
  - number: 4.24.1.e
    text: ten minste één oculair is geschikt voor een graticule en moet te focussen zijn;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.24
  - number: 4.24.1.f
    text: |-
      een Walton-Beckett ringvormige oculairgraticule met een zichtbare diameter in het objectvlak van 100 micrometer,
      ± 2 micrometer, bij gebruik van het gespecificeerde objectief en oculair, en geverifieerd met een micrometer op
      een voorwerptafel.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.24
  - number: 4.24.2
    text: |-
      De microscoop wordt aan het begin van de dag van gebruik opgesteld volgens de voorschriften van de fabrikant,
      waarbij de waarnemingsgrens wordt gecontroleerd aan de hand van een fase-contrastproefplaatje. De codes op de AIA-
      proefglaasjes of op de blokken op het HSE/NLP/Mark 2 proefglaasje zijn bij gebruik volgens de door de fabrikant
      aangegeven wijze zichtbaar tot aan code 5 respectievelijk blok 5.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.24
  - number: '4.25'
    text: |-
      Telling van de vezels op het filter, bedoeld in [artikel 4.24][ref1], vindt plaats volgens de onderstaande
      voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.5'
  - number: 4.25.a
    text: |-
      alleen telbare vezels worden geteld; onder telbare vezel wordt verstaan een vezel die voldoet aan de definitie van
      een vezel, bedoeld in [artikel 4.37, eerste lid, onder e, van het besluit][ref1] die geen deeltje met een maximum
      diameter groter dan 3 micrometer raakt;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.25.b
    text: telbare vezels waarvan de twee uiteinden zich binnen de graticulezone bevinden, worden als één vezel geteld;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.25
  - number: 4.25.c
    text: telbare vezels waarvan zich één uiteinde binnen de graticulezone bevindt, worden als een halve vezel geteld;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.25
  - number: 4.25.d
    text: |-
      een vezelcluster dat over zijn lengte op één of meer plaatsen stevig en niet gespleten schijnt te zijn maar dat op
      andere plaatsen in afzonderlijke vezels uiteen schijnt te vallen, is één telbare vezel indien het voldoet aan de
      definitie van een vezel, bedoeld in [artikel 4.37, eerste lid, onder e, van het besluit][ref1]; de diameter wordt
      gemeten dwars door het niet-gespleten deel en niet door het gespleten deel;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.25
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.25.e
    text: |-
      bij vezelclusters in de vorm van een bundel, waarin de afzonderlijke vezels elkaar raken of kruisen, worden deze
      vezels apart geteld indien zij voldoende van elkaar kunnen worden onderscheiden om vast te stellen dat zij voldoen
      aan de definitie van een vezel; wanneer dit niet het geval is, dan is de bundel een telbare vezel, indien hij als
      geheel aan de definitie voldoet;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.25
  - number: 4.25.f
    text: |-
      het filter dan wel een deel daarvan wordt op een voorwerpglaasje geplaatst, doorzichtig gemaakt volgens de
      acetontriacetinemethode en met een dekglaasje bedekt;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.25
  - number: 4.25.g
    text: graticulezones waar zal worden geteld, worden a-select in het hele blootgestelde oppervlak van het filter gekozen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.25
  - number: 4.25.h
    text: |-
      indien meer dan een achtste van een graticulezone is bedekt met een vezelcluster dan wel deeltjes wordt de
      graticulezone overgeslagen en wordt een andere zone geteld;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.25
  - number: 4.25.i
    text: |-
      er worden 100 vezels geteld, waarbij minimaal 20 graticulezones worden onderzocht of er worden 100 graticulezones
      onderzocht.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.25
  - number: 4.26.1
    text: |-
      Het gemiddelde aantal vezels per graticulezone wordt berekend door het aantal getelde vezels te delen door
      het aantal onderzochte graticulezones. De bijdrage tot het tellen als gevolg van vlekken op het filter
      en verontreiniging wordt beneden 3 vezels per 100 graticulezones gehouden en wordt gemeten met behulp van
      blancofilters.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.26
  - number: 4.26.2
    text: |-
      De concentratie van vezels in de lucht is (het gemiddeld aantal vezels per graticulezone x de gehele blootgestelde
      zone van het filter)/(graticulezone x doorgeleid luchtvolume).
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.26
  - number: '4.27'
    text: |-
      Een certificaat van vakbekwaamheid verwijdering asbest en crocidoliet als bedoeld in
      [artikel 4.54, vijfde lid, van het besluit][ref1] wordt door de minister of, indien de minister een certificerende
      instelling heeft aangewezen, de certificerende instelling, afgegeven indien de aanvrager voldoet aan de eisen,
      bedoeld in het certificatieschema Persoonscertificatie DTA-A Deskundig Toezichthouder Verwijdering Asbest
      en Crocidoliet, identificatiecode STIPDT/DTA-A juli 2000, van de Stichting Persoonscertificatie Deskundig
      Toezichthouder (STIPDT) te Bennekom, vastgesteld per 4 juli 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.27
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.30.1
    text: |-
      Als categorieën van werkzaamheden, als bedoeld in [artikel 4.37c, vierde lid, van het besluit][ref1], worden
      aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.30.1.a
    text: |-
      het verwijderen van asbest- dan wel crocidoliethoudende pakkingen dan wel delen daarvan uit procesinstallaties dan
      wel verwarmingstoestellen met een nominale belasting lager dan 2250 kilowatt;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
  - number: 4.30.1.b
    text: |-
      het verwijderen van asbestcement- dan wel crocidoliethoudende waterleidingbuizen, gasleidingbuizen,
      rioolleidingbuizen en mantelbuizen of delen daarvan, voorzover zij deel uitmaken van het ondergrondse openbare gas-
      water- en rioolleidingnet;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
  - number: 4.30.1.c
    text: het verwijderen van asbest- dan wel crocidoliethoudende rem- en frictiematerialen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
  - number: 4.30.1.d
    text: |-
      het verwijderen van hechtgebonden asbest- dan wel crocidoliethoudende geklemde vloerplaten onder
      verwarmingstoestellen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
  - number: 4.30.1.e
    text: het verwijderen van asbest- dan wel crocidoliethoudende beglazingskit uit kassen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
  - number: 4.30.2
    text: |-
      Op de werkzaamheden, bedoeld in het eerste lid onder a, zijn de [artikelen 4.54, derde en vijfde lid][ref1],
      en [4.55, eerste lid, onder c, d en g, van het besluit][ref2] niet van toepassing indien wordt voldaan aan
      het voorschrift dat de betrokken werkzaamheden, voor zover zij plaatsvinden in het kader van het periodiek
      onderhoud van installaties tijdig worden gemeld aan een daartoe aangewezen ambtenaar als bedoeld in
      [artikel 24, eerste lid, van de wet][ref3], waarbij, indien dit bekend is, wordt aangegeven op welke locaties
      de betrokken werkzaamheden zullen worden uitgevoerd. Voor zover de werkzaamheden, bedoeld in de vorige volzin,
      bestaan uit het verwijderen in de buitenlucht van door het gebruik niet-aangehechte asbesthoudende plaatpakkingen
      en spiraalgewonden pakkingen dan wel delen daarvan, zijn de [artikelen 4.19, onderdelen b en c][ref4],
      [4.20, eerste tot en met het vierde lid][ref5], [4.51][ref6], [4.52][ref7] en [4.53 van het besluit][ref8] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref7]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref8]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
