  - number: 6.3.2
    text: |-
      Een certificaat duikploegleider, duikarbeid of duikmedische begeleiding als bedoeld in het eerste lid, dat door
      een lidstaat van de Europese Unie anders dan Nederland of een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte of de Zwitserse bondsstaat is voorgeschreven en dat naar oordeel van de
      minister of, indien de minister een certificerende instelling heeft aangewezen, de certificerende instelling, qua
      vereist niveau van vakbekwaamheid gelijkwaardig is, wordt gelijkgesteld aan de certificaten, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3
  - number: 6.3.3
    text: Een certificaat als bedoeld in het eerste lid wordt afgegeven voor een periode van ten hoogste 2 jaar.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3
  - number: 6.3.4
    text: 'Op het certificaat worden de volgende gegevens vermeld:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3
  - number: 6.3.4.a
    text: de categorie duikploegleider, duikarbeid onderscheidenlijk duikmedische begeleiding;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3
  - number: 6.3.4.b
    text: de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3
  - number: 6.3.4.c
    text: de geldigheidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3
  - number: 6.3a.1
    text: |-
      Een certificaat als bedoeld in [artikel 6.14a, derde lid, van het besluit][ref1], wordt door de minister of,
      indien de minister een certificerende instelling heeft aangewezen, de certificerende instelling, afgegeven indien
      de aanvrager:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '6'
  - number: 6.3a.1.a
    text: |-
      in het bezit is van het certificaat van vakbekwaamheid arbeids- en bedrijfsgeneeskunde, bedoeld in
      [artikel 2.7, tweede lid, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.3a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 6.3a.1.b
    text: |-
