  - number: '5.1'
    text: |-
      Apparatuur en meubilair, in gebruik bij het verrichten van beeldschermwerk, voldoen aan ergonomische eisen, waarbij
      in ieder geval in acht wordt genomen dat:
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.a
    text: |-
      de tekens op het beeldscherm voldoende scherp, duidelijk van vorm en voldoende groot zijn, met voldoende afstand
      tussen de tekens en de regels;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.b
    text: het beeld op het scherm stabiel is;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.c
    text: |-
      de luminantie van of het contrast tussen de tekens en de achtergrond gemakkelijk door de gebruiker is bij te
      stellen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.d
    text: het beeldscherm vrij te plaatsen en gemakkelijk verstelbaar en kantelbaar is;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.e
    text: het beeldscherm vrij is van voor de gebruiker hinderlijke glans en spiegelingen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.f
    text: het toetsenbord hellend kan worden geplaatst en geen geheel vormt met het beeldscherm;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.g
    text: er voor het toetsenbord voldoende ruimte is voor handen en armen van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.h
    text: het toetsenbord een mat oppervlak heeft;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.i
    text: de indeling van het toetsenbord en de vorm van de toetsen zijn gericht op vergemakkelijking van het gebruik;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.j
    text: de symbolen op de toetsen voldoende contrastrijk zijn en vanuit een normale werkhouding voldoende leesbaar;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.k
    text: |-
      de werktafel of het werkvlak een comfortabele houding van de gebruiker mogelijk maakt en een reflectiearm oppervlak
      heeft, voldoende groot is en een flexibele opstelling van beeldscherm, toetsenbord, documenten en accessoires
      mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: 5.1.l
    text: |-
      een voor het werk noodzakelijke documenthouder stabiel en regelbaar is, en zodanig geplaatst dat oncomfortabele
      hoofd- en oogbewegingen tot een minimum zijn beperkt.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.1
  - number: '5.2'
    text: |-
      De omgeving waarin het beeldschermwerk wordt verricht en de inrichting van de werkplek voldoen aan ergonomische
      eisen, waarbij in ieder geval in acht wordt genomen dat:
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.2
  - number: 5.2.a
    text: |-
      de verlichting van de werkruimte zorgt voor voldoende licht en een passend contrast tussen beeldscherm en omgeving,
      rekening houdende met de aard van het werk en de visuele behoeften van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.2
  - number: 5.2.b
    text: mogelijke verblinding en hinderlijke reflecties op de werkplek worden vermeden;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.2
  - number: 5.2.c
    text: er geen directe verblinding en hinderlijke reflecties op het beeldscherm optreden;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.2
  - number: 5.2.d
    text: |-
      de ramen zijn uitgerust met passende instelbare helderheidswering om de intensiteit van het licht dat op de
      werkplek valt te verminderen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.2
  - number: 5.2.e
    text: het geluid dat de apparatuur voortbrengt geen verstoring van de aandacht en het gesproken woord veroorzaakt;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.2
  - number: 5.2.f
    text: de apparatuur geen voor de werknemers hinderlijke warmte voortbrengt;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.2
  - number: 5.2.g
    text: de vochtigheidsgraad steeds toereikend is.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.2
  - number: '5.3'
    text: |-
      De programmatuur die wordt gebruikt bij het verrichten van beeldschermwerk voldoet aan ergonomische eisen, waarbij
      in ieder geval in acht wordt genomen dat:
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.3
  - number: 5.3.a
    text: de programmatuur is aangepast aan de te verrichten taak;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.3
  - number: 5.3.b
    text: de programmatuur gemakkelijk te gebruiken en aan te passen is aan het kennis- en ervaringsniveau van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.3
  - number: 5.3.c
    text: |-
      er zonder medeweten van de gebruiker geen gebruik wordt gemaakt van een kwantitatief of kwalitatief
      controlemechanisme;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.3
  - number: 5.3.d
    text: de systemen de gebruiker gegevens verschaffen over de werking ervan;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.3
  - number: 5.3.e
    text: de systemen de informatie zichtbaar maken in een vorm en een tempo die zijn aangepast aan de gebruiker.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel5.3
  - number: 6.1.1
    text: |-
