  - number: 2.11.3
    text: |-
      Een certificaat als bedoeld in het eerste en tweede lid, wordt afgegeven voor een periode van ten hoogste vier
      jaar.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.11
  - number: 2.12.1
    text: |-
      Een externe arbodienst verstrekt aan de minister dan wel, indien de minister een certificerende instelling
      als bedoeld in [artikel 2.7][ref1] heeft aangewezen, aan de certificerende instelling, bij de aanvraag van een
      certificaat arbodienst als bedoeld in [artikel 2.11, eerste lid][ref2], de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.12.1.a
    text: 'met betrekking tot de deskundigen die voor de arbodienst werkzaam zijn:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
  - number: 2.12.1.a.1º
    text: |-
      een overzicht van het aantal deskundigen, bedoeld in [artikel 2.7, eerste lid, van het besluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.12.1.a.2º
    text: |-
      een overzicht van het aantal deskundigen dat per vakgebied, bedoeld in
      [artikel 2.7, tweede lid, van het besluit][ref1], aan de arbodienst verbonden is, waarbij tevens het aantal
      formatieplaatsen en de wijze waarop de deskundigen aan de dienst verbonden zijn, worden vermeld;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.12.1.a.3º
    text: |-
      van elk van de deskundigen een afschrift van het certificaat van vakbekwaamheid, bedoeld
      in [artikel 2.7, tweede lid, van het besluit][ref1] of een EG-verklaring als bedoeld in
      [artikel 2.8 van het besluit][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.12.1.a.4º
    text: het aantal deskundigen op andere vakgebieden en de aard van die deskundigheden;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
  - number: 2.12.1.b
    text: |-
      met betrekking tot de organisatie-eisen, bedoeld in [artikel 2.10 van het besluit][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.12.1.b.1º
    text: een actueel bewijs van inschrijving bij de Kamer van Koophandel en de statuten van de arbodienst, en
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
  - number: 2.12.1.b.2º
    text: |-
      een afschrift van de arbeidsovereenkomst voor onbepaalde tijd dan wel van de publiekrechtelijke aanstelling van de
      deskundigen in vaste dienst, waarbij de omvang van het dienstverband wordt vermeld;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
  - number: 2.12.1.c
    text: 'met betrekking tot de werkgevers aan wie bijstand wordt verleend:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
  - number: 2.12.1.c.1º
    text: |-
      een lijst van verzorgde bedrijven, waarin opgenomen zijn de namen, adressen en telefoonnummers van die bedrijven en
      hun vestigingen, de economische hoofdactiviteit en het aantal werknemers per bedrijf of vestiging, en
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
  - number: 2.12.1.c.2º
    text: een overzicht van het totaal aantal verzorgde werknemers.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
  - number: 2.12.2
    text: |-
      Indien een externe arbodienst niet de in het eerste lid, onder a tot en met c, bedoelde gegevens verstrekt, wordt
      de aanvraag van het certificaat arbodienst niet in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.12
  - number: 2.13.1
    text: |-
      De werkgever verstrekt aan de minister of, indien de minister een certificerende instelling als bedoeld in
      [artikel 2.7][ref1] heeft aangewezen, aan de certificerende instelling, bij de aanvraag van een certificaat
      arbodienst als bedoeld in [artikel 2.11, tweede lid][ref2], de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.13
