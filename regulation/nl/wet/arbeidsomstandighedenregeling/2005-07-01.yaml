  - number: 6.3.1
    text: |-
      Een certificaat duikploegleider, duikarbeid of duikmedische begeleiding als bedoeld in
      [artikel 6.16, derde lid, zesde lid, onderscheidenlijk zevende lid, van het besluit][ref1] wordt door de
      instelling, bedoeld in [artikel 6.1, tweede lid en derde lid][ref2], afgegeven indien de cursist met goed gevolg
      het examen, behorend bij de opleiding, bedoeld in de laatstgenoemde artikelleden, heeft afgelegd. Het certificaat
      wordt aangemerkt als een schriftelijk bewijs als bedoeld in [artikel 1.7][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel6
