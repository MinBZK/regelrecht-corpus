  - number: 9.1.2
    text: |-
      Voor het bepalen van het tarief per certificaat worden de duur van de onderzoeken, bedoeld in het eerste lid,
      en het aantal en de soort van de verrichtingen die daarbij worden uitgevoerd alsmede de aard en de hoogte van de
      bijkomende kosten zo nauwkeurig mogelijk omschreven.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel9.1
  - number: 9.2.1
    text: |-
      Voor zover ten gevolge van een verzoek of handeling dan wel nalaten van de aanvrager van een certificaat als
      bedoeld in deze regeling, extra kosten worden gemaakt in verband met de afgifte van het certificaat, worden deze
      kosten doorberekend aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel9.2
  - number: 9.2.2
    text: |-
      De kosten verbonden aan de afgifte van een certificaat, voor zover de afgifte gebeurt door de minister, worden bij
      de aanvraag voldaan door overmaking op gironummer 552712 (Postbank), ten name van het Ministerie van Sociale Zaken
      en Werkgelegenheid, Postbus 90801, 2509 LV te 's-Gravenhage. Indien de minister voor de afgifte van een certificaat
      een certificerende instelling heeft aangewezen, worden de kosten, verbonden aan de afgifte van het certificaat, bij
      de aanvraag voldaan overeenkomstig de aanwijzingen van de instelling.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel9.2
  - number: 9.2.3
    text: |-
      Met ingang van 1 december 1999 wordt in het tweede lid “gironummer 552712 (Postbank)” vervangen door:
      bankrekeningnummer 19.23.21.366 (Rabobank).
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel9.2
  - number: 9.2d.1
    text: |-
      [Artikel 6.3, eerste lid][ref1], geldt ten aanzien van de ploegleider, bedoeld in
      [artikel 6.16, derde lid, van het besluit][ref2], met uitzondering van de ploegleider bij de brandweer, niet tot 1
      januari 2004 mits de aanvrager van het certificaat duikploegleider blijk heeft gegeven te beschikken over voldoende
      relevante en actuele kennis en beroepservaring


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel6
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel9.2d
    references:
