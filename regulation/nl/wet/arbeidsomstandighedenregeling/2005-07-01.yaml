  - number: 9.2e
    text: |-
      [Artikel 6.3a, eerste lid, onder a en b][ref1], geldt niet mits de aanvrager in een periode van een jaar, direct
      voorafgaand aan de eerste aanvraag van een certificaat als bedoeld in [artikel 6.3a, eerste lid][ref2], tenminste
      10 personen belast met het verrichten van duikarbeid, heeft gekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel6
