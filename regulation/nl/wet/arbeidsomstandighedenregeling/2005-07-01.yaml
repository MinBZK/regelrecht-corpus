        artikel: '4'
  - number: 4.30.3
    text: 'Op de werkzaamheden, bedoeld in het eerste lid onder b, zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
  - number: 4.30.3.a
    text: |-
      [artikel 4.19, onderdelen b en c, van het besluit][ref1] voor zover het de verplichting betreft om de plaatsen waar
      met asbest wordt gewerkt te markeren door waarschuwingsborden;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.30.3.b
    text: |-
      [4.20, vierde lid, van het besluit][ref1] voor zover het de beschikbaarheid van douches betreft, en


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.30.3.c
    text: |-
      de [artikelen 4.52][ref1], [4.53][ref2], [4.54, vijfde lid][ref3], en
      [4.55, eerste lid, onder c, d en g, van het besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.30.4
    text: |-
      Op de werkzaamheden, bedoeld in het eerste lid, onder c, zijn de [artikelen 4.54, derde en vijfde lid][ref1], en
      [4.55, eerste lid, onder c, d en g, van het besluit][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.30.5
    text: |-
      Op de werkzaamheden, bedoeld in het eerste lid, onder d, zijn de [artikelen 4.54, vijfde lid][ref1], en
      [4.55, eerste lid, onder c, d en g, van het besluit][ref2], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.30.6
    text: |-
      Op de werkzaamheden, bedoeld in het eerste lid, onder e, zijn de [artikelen 4.19, onderdelen b en c][ref1],
      [4.52][ref2], [4.53][ref3], [4.54, derde en vijfde lid][ref4], en
      [4.55, eerste lid, onder c, d en g, van het besluit][ref5] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.30.7
    text: |-
      De uitvoering van de werkzaamheden, bedoeld in het eerste lid, vindt plaats overeenkomstig een deugdelijke
      werkmethode, die is gebaseerd op een doeltreffende beoordeling van het blootstellingsniveau en zodanige
      beheersmaatregelen bevat dat blootstelling zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.30
  - number: 4.32a.1
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen handelingen in woningen of
      andere gebouwen, bestaande uit:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32a.1.a
    text: |-
      het lijmen van bekleding op vloeren, trappen, wanden of plafonds van de betreffende woningen of andere gebouwen,
      inclusief de voorbewerking;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.1.b
    text: |-
      het aanbrengen van verf, lak, beits, vernis of vulmiddel op bestanddelen van en bekleding van vloeren in de
      betreffende woningen of andere gebouwen, inclusief de voorbewerking;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.1.c
    text: |-
      het aanbrengen van olie- of wasachtige producten en het aanbrengen van een parketimpregneermiddel op parket
      of anderszins houten bestanddelen van, en bekleding van vloeren in de betreffende woningen of andere gebouwen,
      inclusief de voorbewerking.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.2
    text: 'Het eerste lid, onder b, is niet van toepassing op handelingen in woningen of andere gebouwen, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.2.a
    text: |-
      het voorbewerken van muren of andere bestanddelen van de betreffende woningen of andere gebouwen op plaatsen waar
      deze muren of andere bestanddelen ernstig verontreinigd zijn door brand- of rookschade of door nicotineaanslag;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.2.b
    text: |-
      het voorbewerken in de zin van versterken van sterk poreuze of poederende bestanddelen van de betreffende woningen
      of andere gebouwen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.2.c
    text: |-
      het repareren met behulp van verf of lak van beschadigingen aan stalen constructies bij nieuwbouw van woningen of
      andere gebouwen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.2.d
    text: |-
      het geheel of gedeeltelijk herstellen van historische afwerkings- of toplagen in een techniek die gelijk is
      aan of overeenkomt met die historische afwerking, waarbij deze herstelwerkzaamheden gericht zijn op herstel
      of instandhouding van een architectuurhistorische eenheid binnen een beschermd monument in de zin van de
      [Monumentenwet 1988][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004471
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
    references:
      - id: ref1
        bwb_id: BWBR0004471
  - number: 4.32a.2.e
    text: |-
      het aanbrengen van traditioneel imitatieschilderwerk, zoals marmer- en houtnerfschilderwerk, alsmede het vergulden
      met behulp van goudverf, exclusief de voorbewerking;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.2.f
    text: |-
      het aanbrengen van een product op beglazingskit in gebouwen voorzover deze opgeleverd zijn voor 1 januari 2001,
      teneinde deze kit geschikt te maken voor de toepassing van watergedragen verfproducten.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.3
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder a, bevatten ten hoogste 5 gram
      vluchtige organische stoffen per kilogram product.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.4
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder b, voor zover het betreft het
      aanbrengen van muurverf, bevatten ten hoogste 75 gram vluchtige organische stoffen per liter product.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.5
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder b, voor zover het betreft het
      aanbrengen van overige verf en andere genoemde producten, zijn watergedragen, uitsluitend met water te verdunnen,
      en bevatten ten hoogste 125 gram vluchtige organische stoffen per liter product.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.6
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder c, bevatten ten hoogste 125
      gram vluchtige organische stoffen per liter product.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.7
    text: |-
      Met ingang van 1 januari 2002 bedragen de gehaltes aan vluchtige organische stoffen van producten als bedoeld in
      het vierde en vijfde lid, 60 respectievelijk 100 gram per liter product.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32a.8
    text: |-
      Met ingang van 1 januari 2002 bedraagt het gehalte aan vluchtige organische stoffen van producten als bedoeld in
      het zesde lid 100 gram per liter product.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32a
  - number: 4.32b.1
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32b
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32b.1.a
    text: het drukken met behulp van een offsetpers;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32b
  - number: 4.32b.1.b
    text: |-
      het dagelijks reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt bij
      offsetdruk;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32b
  - number: 4.32b.1.c
    text: |-
      het niet-dagelijks reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt
      bij offsetdruk.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32b
  - number: 4.32b.2
    text: |-
      Het vochtwater dat wordt gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder a, bevat ten hoogste
      8 volumeprocenten isopropylalcohol of andere mono-alcoholen bij automatische doseersystemen en ten hoogste 10
      volumeprocenten bij handmatige doseersystemen en bij rotatie-offsetpersen die voor het eerst in gebruik zijn
      genomen vóór 1 januari 1985.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32b
  - number: 4.32b.3
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder b, bevatten ten hoogste 0,1
      volumeprocenten gehalogeneerde koolwaterstoffen of monoaromaten met een dampspanning van meer dan 0,1 millibar bij
      20 °C en hebben een vlampunt van ten minste 55 °C.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32b
  - number: 4.32b.4
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder c, bevatten ten hoogste 0,1
      volumeprocenten gehalogeneerde koolwaterstoffen of monoaromaten met een dampspanning van meer dan 0,1 millibar bij
      20 °C.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32b
  - number: 4.32c.1
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32c.1.a
    text: het reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt bij zeefdruk;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32c
  - number: 4.32c.1.b
    text: |-
      het zeefdrukken van papier en karton dat is bestemd voor toepassingen in binnenruimten en dat zwaarder is dan 135
      gram per vierkante meter.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32c
  - number: 4.32c.2
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder a, bevatten ten hoogste 0,1
      volumeprocenten gehalogeneerde koolwaterstoffen of monoaromaten met een dampspanning van meer dan 0,1 millibar bij
      20 °C en hebben een vlampunt van ten minste 21 °C.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32c
  - number: 4.32c.3
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder b, bevatten ten hoogste 150
      gram vluchtige organische stoffen per kilogram product.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32c
  - number: 4.32d.1
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen het reinigen van vloeren
      in illustratiediepdrukkerijen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32d
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32d.2
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, bevatten ten hoogste 0,1
      volumeprocenten gehalogeneerde koolwaterstoffen of monoaromaten met een dampspanning van meer dan 0,1 millibar bij
      20 °C en hebben een vlampunt van ten minste 55 °C.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32d
  - number: 4.32e.1
    text: |-
      In dit artikel wordt verstaan onder:

              a
              lakkeren:

                het aanbrengen van een lak op een flexibel materiaal of van een kleefstof op een flexibel materiaal ten
      behoeve van de latere afsluiting van dat materiaal;



              b
              lamineren of cacheren:

                het hechten van twee of meer flexibele materialen tot een laminaat.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32e
  - number: 4.32e.2
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32e
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32e.2.a
    text: |-
      het drukken, lakkeren, lamineren of cacheren met behulp van een verpakkingsdiepdrukpers, flexopers, lakkeer-,
      lamineer- of cacheermachine die niet is aangesloten op een afzuigsysteem;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32e
  - number: 4.32e.2.b
    text: |-
      het reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt bij de
      werkzaamheden, bedoeld onder a, tenzij deze werkzaamheden worden uitgevoerd met behulp van een afgesloten
      installatie of een installatie die wordt afgezogen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32e
  - number: 4.32e.2.c
    text: |-
      het lamineren of cacheren met behulp van een lamineer- of cacheermachine die niet is aangesloten op een installatie
      voor terugwinning of vernietiging van vluchtige organische stoffen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32e
  - number: 4.32e.2.d
    text: |-
      het drukken of lakkeren van papier en karton met behulp van een flexodrukpers of lakkeermachine die niet is
      aangesloten op een installatie voor terugwinning of vernietiging van vluchtige organische stoffen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32e
  - number: 4.32e.2.e
    text: |-
      het reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt bij de
      werkzaamheden, bedoeld onder c en d, tenzij deze werkzaamheden worden uitgevoerd met behulp van een afgesloten
      installatie of een installatie die wordt afgezogen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32e
  - number: 4.32e.3
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, bevatten ten hoogste 50 gram
      vluchtige organische stoffen per kilogram product.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32e
  - number: 4.32e.4
    text: |-
      Het derde lid is niet van toepassing op de producten die worden gebruikt bij de werkzaamheden, bedoeld in
      het tweede lid, onder c, d en e, indien daarbij bijzondere eisen aan de kwaliteit of bestendigheid van het
      gefabriceerde product worden gesteld, mits op jaarbasis het gewicht van de vluchtige organische stoffen van de
      producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, onder c, d en e, ten hoogste 80%
      bedraagt van het gewicht van de opgebrachte vaste stof.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32e
  - number: 4.32f.1
    text: |-
      In dit artikel wordt verstaan onder motorrijtuig: een personenauto, een
      bestelauto, een motorrijwiel, een autobus of een kampeerauto als bedoeld in
      [artikel 2, onder b, c, d, e onderscheidenlijk g, van de Wet op de motorrijtuigenbelasting 1994][ref1] of een
      vrachtauto als bedoeld in [artikel 1, eerste lid, onder e, van de Wet goederenvervoer over de weg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005443#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32f
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005443
        artikel: '1'
  - number: 4.32f.2
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32f
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4'
  - number: 4.32f.2.a
    text: |-
      het aanbrengen of toepassen van primer, surfacer, sealer of 1- en 2-laags aflaksystemen of van speciale dan wel
      overige producten als bedoeld in [bijlage VIIIA][ref1] bij deze regeling, ten behoeve van het herstellen van
      lakschade of vernieuwing van laklagen op onderdelen van motorrijtuigen;


      [ref1]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32f
    references:
      - id: ref1
        bwb_id: BWBR0008587
  - number: 4.32f.2.b
    text: |-
      het reinigen van gereedschappen die worden gebruikt bij de werkzaamheden, bedoeld onder a, of oppervlakken van
      onderdelen van motorrijtuigen ten behoeve van de herstel- of vernieuwingswerkzaamheden, bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32f
  - number: 4.32f.3
    text: |-
      Het tweede lid is niet van toepassing op werkzaamheden ten behoeve van het herstellen van lakschade of het
      vernieuwen van laklagen op onderdelen van motorrijtuigen die zijn gebouwd vóór 1970;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32f
  - number: 4.32f.4
    text: |-
      Producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, bevatten in gebruiks- of spuitklare
      vorm, ten hoogste het gehalte aan vluchtige organische stoffen dat met betrekking tot deze producten is vastgesteld
      bij [bijlage VIIIA][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32f
    references:
      - id: ref1
        bwb_id: BWBR0008587
  - number: 4.32g.1
    text: |-
      In dit artikel wordt verstaan onder coating: een product dat opgebracht wordt op een oppervlak om een decoratief,
      beschermend of ander functioneel effect te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32g
  - number: 4.32g.2
    text: |-
      Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit](onbekend) worden aangewezen werkzaamheden in
      binnensituaties bestaande uit:
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32g
  - number: 4.32g.2.a
    text: |-
      het aanbrengen van een coating op delen van nieuw vervaardigde buitendeuren, kozijnen, ramen, binnenspouwbladen,
      gevelvullende elementen en overig geveltimmerwerk, voorzover zij zijn vervaardigd van hout of een daarmee gelijk te
      stellen of vergelijkbaar materiaal, als onderdeel van het productieproces;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32g
  - number: 4.32g.2.b
    text: |-
      het aanbrengen van een coating op delen van nieuw vervaardigde binnentrappen, voorzover zij zijn vervaardigd van
      hout of een daarmee gelijk te stellen of vergelijkbaar materiaal, als onderdeel van het productieproces.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32g
  - number: 4.32g.3
    text: |-
      Coatings die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, onder a en b, bevatten ten hoogste
      150 gram vluchtige organische stoffen per liter gebruiksklaar product.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32g
  - number: 4.32g.4
    text: |-
      Het derde lid is niet van toepassing op het aanbrengen van een coating op delen van de in het tweede lid genoemde
      producten, voorzover die producten zijn vervaardigd van houtsoorten waarbij door het aanbrengen van een coating,
      als bedoeld in het derde lid, inhoudstoffen kunnen vrijkomen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel4.32g
  - number: 4.32h
    text: |-
      Met de in de [artikelen 4.32a, derde tot en met zesde lid][ref1], [4.32b, tweede tot en met vierde lid][ref2],
      [4.32c, tweede en derde lid][ref3], [4.32d, tweede lid][ref4], [4.32e, derde lid][ref5], [4.32f, vierde lid][ref6]
      en [4.32g, derde lid][ref7], bedoelde producten worden gelijkgesteld producten, die rechtmatig zijn vervaardigd
      en in de handel zijn gebracht in een andere lidstaat van de Europese Unie dan wel rechtmatig zijn vervaardigd in
      een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij de overeenkomst inzake de Europese
      Economische Ruimte, en die voldoen aan eisen die een beschermingsniveau bieden dat ten minste gelijkwaardig is aan
      het niveau dat met de nationale eisen wordt nagestreefd.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4
