      een overzicht van het aantal deskundigen dat per vakgebied, bedoeld in
      [artikel 2.7, tweede lid, van het besluit][ref1], binnen de arbodienst werkzaam is;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.13.1.a.3º
    text: |-
      een afschrift van de arbeidsovereenkomst voor onbepaalde tijd of publiekrechtelijke aanstelling in vaste dienst
      van de deskundigen in vaste dienst, waarbij de omvang van het dienstverband en het aantal formatieplaatsen worden
      vermeld;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.13
  - number: 2.13.1.a.4º
    text: |-
      van elk van de deskundigen een afschrift van het certificaat van vakbekwaamheid, bedoeld
      in [artikel 2.7, tweede lid, van het besluit][ref1] of een EG-verklaring als bedoeld in
      [artikel 2.8 van het besluit][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.13.1.a.5º
    text: het aantal deskundigen op andere vakgebieden en de aard van die deskundigheden;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.13
  - number: 2.13.1.b
    text: 'met betrekking tot zijn bedrijf of de vestigingen van zijn bedrijf:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.13
  - number: 2.13.1.b.1º
    text: |-
      naam, adres en telefoonnummer van het bedrijf of vestigingen, de economische hoofdactiviteit en het aantal
      werknemers van het bedrijf of van elke vestiging, en
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.13
  - number: 2.13.1.b.2º
    text: een overzicht van het totaal aantal verzorgde werknemers;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.13
  - number: 2.13.2
    text: |-
      Indien de werkgever niet de in het eerste lid, onder a en b, bedoelde gegevens verstrekt, wordt de aanvraag van het
      certificaat arbodienst niet in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.13
  - number: 2.14.1
    text: |-
      Een certificaat van vakbekwaamheid arbeids- en bedrijfsgeneeskunde als bedoeld in
      [artikel 2.7, tweede lid, van het besluit][ref1] wordt door de minister of, indien de minister een certificerende
      instelling heeft aangewezen, de certificerende instelling, afgegeven indien de aanvrager een opleiding heeft
      gevolgd die voldoet aan de opleidingseisen voor het sociaal-geneeskundig specialisme arbeid en gezondheid –
      bedrijfsgeneeskunde, bedoeld in het Besluit Bedrijfsgeneeskunde van 24 maart 2004 van het College voor Sociale
      Geneeskunde, die heeft geleid tot registratie als sociaal-geneeskundige voor arbeid en gezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.14.2
    text: Een certificaat als bedoeld in het eerste lid, wordt afgegeven voor een periode van ten hoogste vijf jaar.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.14
  - number: '2.15'
    text: |-
      Een certificaat van vakbekwaamheid arbeidshygiëne als bedoeld in [artikel 2.7, tweede lid, van het besluit][ref1]
      wordt door de minister of, indien de minister een certificerende instelling heeft aangewezen, de certificerende
      instelling, afgegeven indien de aanvrager voldoet aan de eisen, bedoeld in versie 1 van de Regelingen
      SAH, SVK ref.nr. SKO/03034S van de Stichting voor de Certificatie van Vakbekwaamheid SKO, ten aanzien van
      arbeidshygiënisten, vastgesteld per 19 november 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: '2.16'
    text: |-
      Een certificaat van vakbekwaamheid veiligheidskunde als bedoeld in [artikel 2.7, tweede lid, van het besluit][ref1]
      wordt door de minister of, indien de minister een certificerende instelling heeft aangewezen, de certificerende
      instelling, afgegeven indien de aanvrager voldoet aan de eisen, bedoeld in versie 1 van de Regelingen
      SAH, SVK ref.nr. SKO/03034S, van de Stichting voor de Certificatie van Vakbekwaamheid SKO, ten aanzien van
      veiligheidskundigen, vastgesteld per 19 november 2003.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: '2.17'
    text: |-
      Een certificaat arbeids- en organisatiekunde als bedoeld in [artikel 2.7, tweede lid van het besluit][ref1],
      wordt door de minister of, indien de minister een certificerende instelling heeft aangewezen, de certificerende
      instelling, afgegeven indien de aanvrager voldoet aan de certificatie-eisen voor arbeids- en organisatiekundigen,
      bedoeld in versie 1.0 van het Certificatie-schema Persoonscertificatie Arbeids- en Organisatiekunde van de
      Stichting Registratie Arbeids- en Organisatiedeskundigen, vastgesteld per 4 januari 2001.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.19.1
    text: |-
      In deze paragraaf wordt verstaan onder lidstaat: een lidstaat van de Europese Unie of een andere staat die partij
      is bij de overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.19
  - number: 2.19.2
    text: |-
      De minister geeft op schriftelijke aanvraag een EG-verklaring als bedoeld in [artikel 2.8 van het besluit][ref1] af
      op de vakgebieden van de veiligheidskunde, arbeidshygiëne dan wel arbeids- en organisatiekunde indien wordt voldaan
      aan de [artikelen 2.20 tot en met 2.22][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: '2.20'
    text: |-
      Bij de schriftelijke aanvraag, bedoeld in [artikel 2.19, tweede lid][ref1], wordt aangegeven dan wel overgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.20.a
    text: |-
      een gewaarmerkte kopie van het diploma dan wel de diploma’s, bedoeld in [artikel 2][ref1] dan wel
      [3 van de Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref2] waarvan gelijkstelling door middel van een
      EG-verklaring wordt verlangd alsmede een gewaarmerkte kopie van de daarbij behorende cijferlijst of beoordelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006317#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006317
        artikel: '3'
  - number: 2.20.b
    text: |-
      een overzicht van relevante studiegegevens, in ieder geval bevattende de totale cursusduur, de bestudeerde
      hoofdvakken, en eventueel andere vakken, gegevens omtrent gevolgde stages, gemaakte verslagen en publicaties en,
      indien beschikbaar, tevens een globale leerstofomschrijving van deze vakken met de daarbij behorende studietijd;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.20
  - number: 2.20.c
    text: |-
      een schriftelijke verklaring van een daartoe bevoegde instantie in de lidstaat waar het diploma is behaald of
      erkend waaruit blijkt welke bevoegdheid de aanvrager in de lidstaat op grond van zijn diploma heeft;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.20
  - number: 2.20.d
    text: |-
      indien de opleiding overwegend buiten de lidstaat is genoten, een bewijsstuk gewaarmerkt door de daartoe bevoegde
      instantie in de lidstaat waar het diploma is behaald of erkend, dat ten minste drie jaren beroepservaring is
      opgedaan;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.20
  - number: 2.20.e
    text: |-
      indien de aanvraag en de in dit artikel bedoelde stukken in een andere dan de Nederlandse of Engelse taal zijn
      gesteld, een, zo mogelijk, door een beëdigd tolk vertaler opgestelde vertaling daarvan in één van deze talen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.20
  - number: 2.21.1
    text: 'Een EG-verklaring wordt afgegeven indien:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.21
  - number: 2.21.1.1º
    text: |-
      de vakgebieden van de opleiding die ten grondslag heeft gelegen aan het door de aanvrager behaalde diploma als
      bedoeld in [artikel 2][ref1] of [artikel 3 van de Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref2]
      niet of in geringe mate verschillen van de wezenlijke vakgebieden van de Nederlandse opleidingen die de
      diploma’s afgeven die zijn vereist voor afgifte van een certificaat van vakbekwaamheid als bedoeld in
      [artikel 2.7, tweede lid, van het besluit][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006317#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006317
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.21.1.2º
    text: |-
      de cursusduur van de gevolgde opleiding minder dan een jaar korter is dan die van de Nederlandse opleidingen,
      bedoeld onder 1°, of
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.21
  - number: 2.21.1.3º
    text: |-
      de cursusduur van de gevolgde opleiding ten minste een jaar korter is dan de cursusduur van de Nederlandse
      opleiding, bedoeld onder 1°, indien de aanvrager aantoont te beschikken over ten minste twee jaar beroepservaring,
      of
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.21
  - number: 2.21.1.4º
    text: |-
      de aanvrager een deeltijdse opleiding heeft gevolgd, dan wel een opleiding heeft gevolgd die in de lidstaat waar
      het diploma is afgegeven of erkend gelijkwaardig is verklaard met de aldaar vereiste opleiding.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.21
  - number: 2.21.2
    text: |-
      Een EG-verklaring wordt niet afgegeven dan nadat de aanvrager met goed gevolg, naar keuze, een
      proeve van bekwaamheid heeft afgelegd of een aanpassingsstage heeft doorlopen als bedoeld in
      [artikel 10 van de Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref1] indien de opleiding die
      ten grondslag heeft gelegen aan het door de aanvrager behaalde diploma als bedoeld in [artikel 2][ref2]
      of [artikel 3 van de Algemene wet erkenning EG-hoger-onderwijsdiploma’s][ref3] betrekking heeft op
      vakgebieden die meer dan in geringe mate verschillen van de wezenlijke vakgebieden van de Nederlandse
      opleiding die is vereist voor het verkrijgen van een certificaat van vakbekwaamheid als bedoeld in
      [artikel 2.7, tweede lid, van het besluit][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0006317#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006317#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0006317
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0006317
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.22.1
    text: 'Bij een proeve van bekwaamheid wordt de volgende procedure gevolgd:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.1.a
    text: |-
      op grond van de door aanvrager overgelegde gegevens wordt een lijst opgesteld van de vakgebieden die, in
      vergelijking met de vereiste Nederlandse opleiding, meer dan in geringe mate verschillen van de opleiding die de
      aanvrager heeft gevolgd, en waarvan de kennis een wezenlijke voorwaarde is om in Nederland een certificaat van
      vakbekwaamheid als bedoeld in [artikel 2.7, tweede lid, van het besluit][ref1] te verkrijgen;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.22.1.b
    text: |-
      de proeve van bekwaamheid heeft betrekking op de onder a bedoelde vakgebieden en wordt afgenomen door een in het
      kader van de aanvraag aan te wijzen Nederlandse instelling die een relevante opleiding verzorgt;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.1.c
    text: |-
      in het kader van de aanvraag wordt op basis van de omvang van de af te leggen proeve de hoogte van het door de
      aanvrager aan de desbetreffende instelling te betalen examengeld bepaald;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.1.d
    text: |-
      aan aanvrager wordt schriftelijk meegedeeld op welke vakgebieden de proeve betrekking zal hebben, welke instelling
      de proeve af zal nemen en wat de hoogte van het examengeld is;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.1.e
    text: de desbetreffende instelling doet de aanvrager schriftelijk opgave van de te bestuderen literatuur;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.1.f
    text: de desbetreffende instelling stelt de criteria vast voor de beoordeling van de proeve;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.1.g
    text: |-
      de desbetreffende instelling biedt binnen vier maanden nadat de aanvrager te kennen heeft gegeven de proeve van
      bekwaamheid te willen afleggen en hij tevens het examengeld heeft betaald, de gelegenheid tot het afleggen van
      de proeve;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.1.h
    text: de proeve wordt naar keuze van de aanvrager in de Nederlandse of Engelse taal afgenomen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.1.i
    text: |-
      de desbetreffende instelling deelt het resultaat van de proeve zo spoedig mogelijk mee aan de aanvrager en aan
      de minister.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.2
    text: 'Een aanpassingsstage wordt als volgt vormgegeven:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.2.a
    text: |-
      de aanvrager verricht gedurende een in het kader van de aanvraag te bepalen periode van ten hoogste drie jaar
      werkzaamheden op het desbetreffende vakgebied;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.2.b
    text: |-
      de aanvrager verricht tijdens deze periode werkzaamheden onder verantwoordelijkheid en begeleiding
      van een deskundige die in het bezit is van een certificaat van vakbekwaamheid als bedoeld in
      [artikel 2.7, tweede lid, van het besluit][ref1] op het desbetreffende vakgebied;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.22.2.c
    text: |-
      na overleg tussen de aanvrager en diens begeleider kan de begeleider besluiten dat aan de stage een aanvullende
      opleiding wordt gekoppeld;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.2.d
    text: |-
      de stage wordt beoordeeld op de vraag of de aanvrager de vakgebieden bedoeld in [artikel 2.20, tweede lid][ref1],
      in voldoende mate beheerst, en


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.4'
  - number: 2.22.2.e
    text: het resultaat van de beoordeling wordt zo spoedig mogelijk meegedeeld aan de aanvrager en de minister.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: 2.22.3
    text: |-
      Indien de proeve van bekwaamheid niet met positief resultaat is afgelegd of de aanpassingsstage negatief is
      beoordeeld, heeft de aanvrager het recht nog een maal, naar keuze, een proeve van bekwaamheid af te leggen of een
      aanpassingsstage te doorlopen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.22
  - number: '3.1'
    text: |-
      Als model van de kennisgeving, bedoeld in [artikel 2.26, eerste lid, van het besluit][ref1] wordt vastgesteld het
      model dat als [bijlage III][ref2] bij deze regeling is gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008587
  - number: '3.2'
    text: |-
      In deze paragraaf wordt verstaan onder:

            a
             risico-analyse:

              systematisch onderzoek van risico's voor de veiligheid en de gezondheid op basis waarvan een beoordeling
      van die risico's wordt gemaakt als bedoeld in [artikel 5 van de wet][ref1];



            b
            acceptatiecriteria:

              de grenzen waarbinnen risico's aanvaardbaar zijn;



            c
            prestatienormen:

              duidelijke en meetbare parameters ten aanzien van die prestaties van een procesinstallatie of componenten
      daarvan, van apparatuur en van beheerssystemen, die direct bijdragen aan de verwezenlijking van veiligheids- en
      gezondheidsdoelstellingen;



            d
             mijnbouwwerk:

              een werk als bedoeld in [artikel 1, onderdeel n, van de Mijnbouwwet][ref2];



            e
            mijnbouwinstallatie:

              een installatie als bedoeld in [artikel 1.1, derde lid, onderdeel f, van het besluit][ref3];



            f
             veiligheids- en gezondheidszorgsysteem:

              een systeem als bedoeld in [artikel 2.42e van het besluit][ref4];



            g
            veiligheids- en gezondheidsdocument:

              een document als bedoeld in [artikel 2.42f van het besluit][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0014168#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0014168
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0008498
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0008498
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 3.2a.1
    text: |-
      De risico’s in het kader van de risico-analyse, bedoeld in [artikel 3.2, eerste lid, onderdeel a][ref1], worden
      kwalitatief en, voor zover mogelijk, kwantitatief bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.2a.2
    text: |-
      De grenzen in het kader van bepaling van de acceptatiecriteria, bedoeld in
      [artikel 3.2, eerste lid, onderdeel b][ref1], worden, voor zover mogelijk, kwantitatief bepaald. Voor zover dit
      niet mogelijk is, worden deze grenzen kwalitatief bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.2a
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '3.3'
    text: |-
      Het veiligheids- en gezondheidszorgsysteem is gebaseerd op een procesgerichte internationaal erkende norm voor de
      beheersing van veiligheid, gezondheid, kwaliteitszorg of milieu.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.3
  - number: 3.4.1
    text: Het veiligheids- en gezondheidszorgsysteem wordt schriftelijk vastgelegd.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.4
  - number: 3.4.2
    text: |-
      In de beschrijving van het veiligheids- en gezondheidszorgsysteem wordt aangegeven wat de onderdelen van dit
      systeem inhouden en hoe de samenhang is tussen deze onderdelen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.4
  - number: 3.5.1
    text: |-
      Het veiligheids- en gezondheidszorgsysteem wordt regelmatig doorgelicht op basis van internationaal erkende normen
      voor het doorlichten van zorgsystemen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.5
  - number: 3.5.2
    text: |-
      De aard en de frequentie van de doorlichting wordt zodanig gekozen dat de doeltreffendheid van het veiligheids- en
      gezondheidszorgsysteem telkens na een periode van drie jaar kan worden bepaald.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.5
  - number: 3.6.1
    text: 'Er wordt een veiligheids- en gezondheidsdocument opgesteld voor de volgende mijnbouwwerken:'
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.6
  - number: 3.6.1.a
    text: ieder mijnbouwwerk op het land;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.6
  - number: 3.6.1.b
    text: iedere vast opgestelde mijnbouwinstallatie;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.6
  - number: 3.6.1.c
    text: iedere als een geheel verplaatsbare mijnbouwinstallatie, en
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.6
  - number: 3.6.1.d
    text: |-
      iedere andere verplaatsbare installatie met behulp waarvan boorgaten worden geboord of werkzaamheden in of aan een
      bestaand boorgat worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.6
  - number: 3.6.2
    text: |-
      Het veiligheids- en gezondheidsdocument, bedoeld in het eerste lid, is op de mijnbouwwerken, bedoeld in het eerste
      lid, aanwezig.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.6
  - number: 3.7.1
    text: |-
      Voor zover niet reeds bij het opstellen van het veiligheids- en gezondheidsdocument, bedoeld in
      [artikel 3.6][ref1], hiermee rekening is gehouden, wordt er een veiligheids- en gezondheidsdocument opgesteld voor
      de volgende bijzondere werkzaamheden:


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.7
    references:
