  - number: 7.6.1
    text: |-
      Een persoon is in het bezit van een certificaat van vakbekwaamheid als bedoeld in
      [artikel 7.32, eerste lid, onder a, van het besluit][ref1] indien hij een torenkraan, mobiele kraan of mobiele hei-
      installatie als omschreven in de onderdelen a tot en met c, bedient:

              a
              torenkraan:

                torenvormige hijskraan waarvan het maximumbedrijfslastmoment 10 tonmeter of meer bedraagt of de giek 20
      meter of hoger boven het vlak van de ondersteuning van de kraan bevestigd is;



              b
              mobiele kraan:

                verrijdbare, niet aan een vaste baan gebonden hijskraan die geen torenkraan is en waarvan het
      maximumbedrijfslastmoment 10 ton-meter of meer bedraagt, met uitzondering van:
                een op een voertuig bevestigde laadkraan die uitsluitend ingericht is of althans uitsluitend wordt
      gebruikt voor het laden en lossen van de laadbak van het voertuig of een samenstel van voertuigen;
      een grondverzetmachine die ontgravingen maakt en direct daarop aansluitend leidingwerk in die ontgravingen legt of
      ten behoeve van het uitvoeren van grondverzetwerkzaamheden ondersteuningsschotten plaatst;



              c
              mobiele hei-installatie:

                verrijdbare of verrolbare funderingsmachine die is ingericht of bestemd om palen of andere langwerpige
      voorwerpen in de grond te maken, te drijven of daaruit te verwijderen alsmede om met een en ander rechtstreeks
      verband houdende verrichtingen uit te voeren, met inbegrip van het met een maximumbedrijfslastmoment van 10
      tonmeter of meer verplaatsen van lasten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel7
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel7.6
