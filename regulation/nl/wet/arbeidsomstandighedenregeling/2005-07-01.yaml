---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: arbeidsomstandighedenregeling
regulatory_layer: WET
publication_date: '2018-12-06'
valid_from: '2005-07-01'
bwb_id: BWBR0008587
url: https://wetten.overheid.nl/BWBR0008587/2005-07-01
preamble:
  text: |-
    Gelet op de artikelen 7, vierde lid, onder b, 9, vierde en zesde lid, 10, vijfde lid, 41, eerste lid, en 42, tweede
    lid, van de Arbeidsomstandighedenwet, artikel 6 van de Wet arbeid gehandicapte werknemers en artikel 11 van de
    Algemene wet erkenning EG-hoger-onderwijsdiploma's;

    Voorts gelet op de artikelen 2.7, tweede en derde lid, 2.8, 2.15, eerste en derde lid, 2.24, eerste lid, 4.7,
    eerste, derde en vijfde lid, 4.8, tweede tot en met vijfde lid4.9, zevende lid, 4.10, tweede en derde lid, 4.14,
    vijfde lid, 4.16, eerste lid, 4.42, vijfde lid, 4.50, tweede lid, 4.54, derde en vijfde lid, 4.60, vierde en vijfde
    lid, 4.65, eerste lid, onder a en b, 4.66, onder a en b, 4.67, eerste en vijfde lid, 4.68, eerste lid, 4.7.0, derde
    en vijfde lid, 4.71, eerste lid, 4.72, eerste lid, 4.73, 5.12, 6.17, derde lid, 7.19, achtste tot en met negende en
    elfde lid, 7.29, zesde en zevende lid, 7.32, tweede lid, en vierde tot en met zevende lid, 8.4, tweede lid, van het
    Arbeidsomstandighedenbesluit;

    Gezien de adviezen van de Sociaal Economische Raad van 28 juli 1995, kenmerk 95/35, en 28 maart 1996, kenmerk
    96/31.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
            besluit:

              het [Arbeidsomstandighedenbesluit][ref1];



            b
            de minister:

              de Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 1.1a
    text: |-
      In het jaarverslag van een certificerende instelling, bedoeld in [artikel 1.5b, eerste lid, van het besluit][ref1]
      worden ten minste de volgende onderwerpen behandeld:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '1'
  - number: 1.1a.a
    text: de door de instelling afgegeven, ingetrokken dan wel geweigerde certificaten;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
  - number: 1.1a.b
    text: wijzigingen in de op het werkveld van de instelling betrekking hebbende accreditaties, reglementen en procedures;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
  - number: 1.1a.c
    text: wijzigingen in de op het werkveld van de instelling betrekking hebbende taakverdeling;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
  - number: 1.1a.d
    text: wijzigingen in de bestuurssamenstelling;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
  - number: 1.1a.e
    text: wijzigingen in de statuten of het huishoudelijk reglement;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
  - number: 1.1a.f
    text: aan derden uitbestede werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
  - number: 1.1a.g
    text: structurele knelpunten op het werkveld van de instelling die zich in de uitvoeringspraktijk hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
  - number: 1.1a.h
    text: het gevoerde overleg en de samenwerking op het werkveld met andere certificerende instellingen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
  - number: 1.1a.i
    text: door de instelling ontvangen klachten en de wijze van afhandeling daarvan;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
  - number: 1.1a.j
    text: |-
      tegen de beslissingen van de instelling ingediende bezwaren en ingestelde beroepen en de wijze van afhandeling
      daarvan;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
  - number: 1.1a.k
    text: een financieel verslag betreffende de activiteiten waarvoor de instelling is aangewezen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.1a
  - number: '1.2'
    text: |-
      Voor zover in deze regeling regels zijn gesteld over opleidingen zijn de [artikelen 1.3 tot en met 1.8][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '1.3'
    text: |-
      De opleiding wordt gegeven aan de hand van aan de cursisten ter beschikking gesteld overzichtelijk schriftelijk
      opleidingsmateriaal van voldoende didactische kwaliteit.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.3
  - number: '1.4'
    text: |-
      De docenten beschikken voor de onderwerpen die zij tijdens de opleiding behandelen aantoonbaar over ruime
      theoretische, praktische en didactische kennis of vaardigheden.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.4
  - number: 1.5.1
    text: De opleidingsinstelling beschikt over adequate opleidingsfaciliteiten.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.5
  - number: 1.5.2
    text: |-
      De opleidingsinstelling biedt de opleiding ten minste twee maal per jaar aan en voert haar ten minste eenmaal per
      jaar uit.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.5
  - number: 1.5.3
    text: |-
      De opleidingsinstelling legt de verantwoordelijkheden en bevoegdheden van alle betrokkenen bij de opleiding
      schriftelijk vast.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.5
  - number: 1.5.4
    text: De opleidingsinstelling treft adequate maatregelen om de veiligheid van de cursisten zoveel mogelijk te waarborgen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.5
  - number: 1.6.1
    text: De toetsing van de eindtermen vindt plaats door middel van een examen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.6
  - number: 1.6.2
    text: De opleidingsinstelling neemt de examens af aan de hand van een deugdelijk en op schrift gesteld examenreglement.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.6
  - number: '1.7'
    text: |-
      De opleidingsinstelling overhandigt de cursist die het examen met goed gevolg heeft afgelegd, een op naam gesteld
      schriftelijk bewijs, getekend door twee leden van de examencommissie dan wel het hoofd van de opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.7
  - number: '1.8'
    text: |-
      De opleidingsinstelling voert een deugdelijke administratie waarin de persoonlijke gegevens van de cursist en de
      datum waarop het schriftelijk bewijs, bedoeld in [artikel 1.7][ref1] is uitgereikt in ieder geval zijn opgenomen en
      waarin de periode is bepaald gedurende welke de examenopgaven en de uitwerkingen daarvan worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel1
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '1.10'
    text: |-
      De schriftelijke mededeling van arbeidsongevallen, bedoeld in [artikel 9, eerste lid, van de wet][ref1] omvat ten
      minste de gegevens, bedoeld in [bijlage I][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.10
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 1.11.1
    text: |-
      In dit artikel wordt verstaan onder beroepsziekte: een ziekte of aandoening als gevolg van een belasting die in
      overwegende mate in arbeid of arbeidsomstandigheden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.11
  - number: 1.11.2
    text: |-
      De mededeling van een beroepsziekte, bedoeld in [artikel 9, derde lid, van de wet][ref1] omvat ten minste de
      volgende, niet tot een individuele natuurlijke persoon herleidbare, gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
  - number: 1.11.2.a
    text: de diagnose;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.11
  - number: 1.11.2.b
    text: het geslacht en het geboortejaar van de werknemer;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.11
  - number: 1.11.2.c
    text: de aard en de mate van de belasting in arbeid of arbeidsomstandigheden;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.11
  - number: 1.11.2.d
    text: de aard van de werkzaamheden ten tijde van het ontstaan van de beroepsziekte;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.11
  - number: 1.11.2.e
    text: het beroep van de werknemer ten tijde van de blootstelling, en
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.11
  - number: 1.11.2.f
    text: de economische activiteit van de werkgever ten tijde van de blootstelling.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.11
  - number: 1.11.3
    text: |-
      De in het tweede lid bedoelde gegevens worden verstrekt overeenkomstig de aanwijzingen van de instelling, bedoeld
      in [artikel 9, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel1.11
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '9'
  - number: '2.0'
    text: |-
      In het veiligheidsbeheerssysteem, bedoeld in [artikel 2.5a, tweede lid, van het besluit][ref1] komen ten minste de
      elementen aan de orde, genoemd in [bijlage IA][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 2.0a.1
    text: |-
      De procedures voor de systematische identificatie van de ongewenste gebeurtenissen en de evaluatie van de risico’s
      van zware ongevallen, bedoeld in [artikel 2.5b, eerste lid, onder a, van het besluit](onbekend), hebben betrekking
      op:
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0a
  - number: 2.0a.1.a
    text: |-
      het verrichten van systematisch onderzoek naar de aan een installatie verbonden risico’s van een zwaar ongeval
      tijdens het ontwerp, de bouw, het gebruik en het onderhoud van de installatie, alsmede bij voorgenomen wijzigingen
      daarvan;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0a
  - number: 2.0a.1.b
    text: de criteria voor het bepalen van de methoden voor het onderzoek als bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0a
  - number: 2.0a.1.c
    text: de methode voor de evaluatie van de risico’s van zware ongevallen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0a
  - number: 2.0a.2
    text: |-
      De in het eerste lid, onderdeel b, bedoelde onderzoeksmethode is afgestemd op de in dat lid, onderdeel a, bedoelde
      fasen.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0a
  - number: 2.0a.3
    text: |-
      De methode, bedoeld in het eerste lid, onderdeel c, is geschikt om vast te stellen welke maatregelen nodig zijn ter
      voorkoming van zware ongevallen of ter beperking van de gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0a
  - number: 2.0b.1
    text: |-
      De beschrijving van de scenario’s, bedoeld in [artikel 2.5b, eerste lid, onder b, van het besluit](onbekend), heeft
      betrekking op de onderdelen van installaties die de grootste risico’s van een zwaar ongeval met zich meebrengen.
      De identificatie van de betreffende onderdelen van de installaties vindt plaats op basis van een gedocumenteerde
      methode.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0b
  - number: 2.0b.2
    text: |-
      Bij de beschrijving van de scenario’s, bedoeld in het eerste lid, wordt ten minste in aanmerking genomen welke
      van de volgende voorvallen deze scenario’s op gang kunnen brengen: corrosie, erosie, externe belasting, impact,
      overdruk, onderdruk, lage temperatuur, hoge temperatuur, trillingen, menselijke fouten tijdens gebruik, wijziging
      of onderhoud.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0b
  - number: 2.0b.3
    text: |-
      Van elk scenario wordt aangegeven wat de waarschijnlijkheid en het effect is en welke maatregelen getroffen zijn om
      te voorkomen dat het scenario zich voordoet.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0b
  - number: 2.0b.4
    text: |-
      Voorts wordt van elk scenario, met inachtneming van de reeds getroffen maatregelen, een samenhangend inzicht
      geboden in:
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0b
  - number: 2.0b.4.a
    text: de resterende kans dat een zwaar ongeval geschiedt;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0b
  - number: 2.0b.4.b
    text: de ernst van de gevolgen die het ongeval in dat geval zal hebben;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0b
  - number: 2.0b.4.c
    text: |-
      welke verdere maatregelen technisch mogelijk zijn om de kans op een zwaar ongeval verder te verkleinen tot een
      daarbij aan te geven niveau;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0b
  - number: 2.0b.4.d
    text: een indicatie van de kosten die verbonden zouden zijn aan het treffen van de maatregelen, bedoeld in onderdeel c.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0b
  - number: 2.0c
    text: |-
      Het intern noodplan, bedoeld in [artikel 2.5c van het besluit][ref1], bevat ten minste de gegevens en de
      beschrijvingen, bedoeld in [bijlage IB][ref2] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.0c
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008587
  - number: 2.1.1
    text: |-
      Bij de uitvoering van de taken, bedoeld in [artikel 14, eerste lid, onder a, van de wet][ref1] verricht
      de deskundige, bedoeld in [artikel 2.14a, eerste lid, van het besluit][ref2] of de arbodienst de volgende
      werkzaamheden:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.1.1.a
    text: |-
      het toetsen of de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref1], volledig en
      betrouwbaar is;


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 2.1.1.b
    text: |-
      het toetsen of in de risico-inventarisatie en -evaluatie, bedoeld onder a, de actuele inzichten op het terrein van
      arbeidsomstandigheden zijn verwerkt;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.1
  - number: 2.1.1.c
    text: |-
      het op basis van de risico-inventarisatie en -evaluatie, bedoeld onder a, uitbrengen van een advies aan de
      werkgever. Dit advies gaat in op de in het plan van aanpak, bedoeld in [artikel 5, derde lid, van de wet][ref1],
      voorgestelde wijze waarop de geconstateerde tekortkomingen kunnen worden verholpen en de prioriteiten en de
      volgorde waarin de maatregelen worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: 2.1.2
    text: |-
      Bij de uitvoering van de taak, bedoeld in [artikel 2.14b, tweede lid, onder b, van het besluit][ref1] verricht
      de deskundige, bedoeld in [artikel 2.14a, eerste lid, van het besluit][ref2] of de arbodienst de volgende
      werkzaamheden:


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.1.2.a
    text: |-
      het toetsen of het model voor het opstellen van een risico-inventarisatie en -evaluatie, bedoeld in
      [artikel 2.14b, eerste lid, onder b, van het besluit][ref1], volledig en betrouwbaar is;


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.1.2.b
    text: |-
      het toetsen of in het model, bedoeld onder a, de actuele inzichten op het terrein van arbeidsomstandigheden in de
      desbetreffende branche zijn verwerkt;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.1
  - number: 2.1.2.c
    text: |-
      het toetsen of het model, bedoeld onder a, adequate aanwijzingen bevat voor het kunnen opstellen van een plan van
      aanpak, bedoeld in [artikel 5, derde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel5
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '5'
  - number: '2.2'
    text: |-
      Bij de uitvoering van de taken, bedoeld in [artikel 14, eerste lid, onder b, van de wet][ref1] ondersteunt de
      deskundige, bedoeld in [artikel 2.14a, tweede lid, van het besluit][ref2] of de arbodienst de werkgever bij het
      adequaat begeleiden van werknemers die door ziekte niet in staat zijn om hun arbeid te verrichten teneinde een
      verantwoorde werkhervatting te bevorderen. Voor het uitvoeren van deze taak legt de deskundige of de arbodienst
      vast:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.2.a
    text: op welke wijze deze taak wordt uitgevoerd en welke procedures daarbij worden gevolgd;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.2
  - number: 2.2.b
    text: op welke wijze wordt omgegaan met de gegevens over het verzuim van werknemers;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.2
  - number: 2.2.c
    text: op welke wijze de persoonlijke levenssfeer van individuen is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.2
  - number: '2.3'
    text: |-
      Bij de uitvoering van de taak, bedoeld in [artikel 14, eerste lid, onderdeel c, onder 1°, van de wet][ref1] legt
      de deskundige, bedoeld in [artikel 2.14a, tweede lid, van het besluit][ref2] of de arbodienst vast:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.3.a
    text: op welke wijze deze taak wordt uitgevoerd en welke procedures daarbij worden gevolgd;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.3
  - number: 2.3.b
    text: op welke wijze de periodiciteit en de inhoud van het arbeidsgezondheidskundig onderzoek zijn geregeld;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.3
  - number: 2.3.c
    text: |-
      hoe met bedrijven afspraken worden gemaakt over de wijze waarop werknemers van het recht op het
      arbeidsgezondheidskundig onderzoek gebruik kunnen maken;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.3
  - number: 2.3.d
    text: op welke indicaties groepsgewijze arbeidsgezondheidskundige onderzoeken plaats kunnen vinden;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.3
  - number: 2.3.e
    text: op welke wijze wordt omgegaan met de gegevens die uit arbeidsgezondheidskundige onderzoeken voortvloeien;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.3
  - number: 2.3.f
    text: op welke wijze de persoonlijke levenssfeer van individuen is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.3
  - number: '2.4'
    text: |-
      Bij de uitvoering van de taak, bedoeld in [artikel 14, eerste lid, onderdeel c, onder 2°, van de wet][ref1] legt
      de deskundige, bedoeld in [artikel 2.14a, tweede lid, van het besluit][ref2] of de arbodienst vast:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.4.a
    text: op welke wijze de aanstellingskeuring wordt uitgevoerd en welke procedures daarbij worden gevolgd;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.4
  - number: 2.4.b
    text: |-
      op welke wijze wordt omgegaan met de gegevens die uit het onderzoek in het kader van de aanstellingskeuring
      voortvloeien;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.4
  - number: 2.4.c
    text: op welke wijze de persoonlijke levenssfeer van individuen wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.4
  - number: '2.5'
    text: |-
      Bij de uitvoering van de taak, bedoeld in [artikel 14, eerste lid, onder d, van de wet][ref1] legt de deskundige,
      bedoeld in [artikel 2.14a, derde lid, van het besluit][ref2] of de arbodienst vast:


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '2'
  - number: 2.5.a
    text: op welke wijze deze taak wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.5
  - number: 2.5.b
    text: welke gegevens uit het arbeidsomstandighedenspreekuur worden vastgelegd;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.5
  - number: 2.5.c
    text: |-
      op welke wijze wordt geadviseerd ten aanzien van onderwerpen die op het arbeidsomstandighedenspreekuur aan de orde
      komen;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.5
  - number: 2.5.d
    text: |-
      op welke wijze wordt omgegaan met gegevens uit het arbeidsomstandighedenspreekuur die een relatie hebben met het
      werk of de werkplek;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.5
  - number: 2.5.e
    text: |-
      op welke wijze de persoonlijke levenssfeer van individuele werknemers die op het arbeidsomstandighedenspreekuur
      komen is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.5
  - number: 2.6.1
    text: |-
      De arbodienst meldt een wijziging van zijn organisatievorm terstond aan de minister of, indien de minister een
      certificerende instelling heeft aangewezen, aan de certificerende instelling, bedoeld in [artikel 2.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.6.2
    text: |-
      Indien zich een wijziging voordoet in de gegevens, bedoeld in de [artikelen 2.12, eerste lid, onder a of b][ref1],
      of [2.13, eerste lid, onder a][ref2], meldt de arbodienst onderscheidenlijk de werkgever dit zo spoedig mogelijk
      aan de minister of, indien de minister een certificerende instelling heeft aangewezen, aan de certificerende
      instelling, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '2.7'
    text: |-
      Als certificerende instelling als bedoeld in [artikel 2.14, eerste en tweede lid, van het besluit][ref1] kan worden
      aangewezen een instelling die voldoet aan de criteria, opgenomen in het Reglement Certificatie Arbodiensten van 17
      februari 1998 van de Stichting Beheer Certificatie Arbodiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '2'
  - number: '2.9'
    text: |-
      Een certificerende instelling als bedoeld in [artikel 2.7][ref1] heeft een procedure voor het behandelen
      van klachten aangaande de dienstverlening door arbodiensten. Vastgelegd wordt op welke wijze deze taak wordt
      uitgevoerd, welke procedures daarbij worden gevolgd en op welke wijze klachten zo nodig zullen leiden tot
      correcties en preventieve maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '2.10'
    text: |-
      Een certificerende instelling als bedoeld in [artikel 2.7][ref1] verricht jaarlijks controle bij de arbodienst ten
      behoeve waarvan door de instelling een certificaat arbodienst is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 2.11.1
    text: |-
      Een certificaat arbodienst als bedoeld in [artikel 2.14, eerste lid, van het besluit][ref1] wordt door
      de minister of, indien de minister een certificerende instelling als bedoeld in [artikel 2.7][ref2]
      heeft aangewezen, de certificerende instelling, afgegeven indien de bijstand bij de taken, bedoeld in
      [artikel 14, eerste lid, van de wet][ref3] naar behoren kan worden uitgevoerd, en wordt voldaan aan
      de [artikelen 13, zesde lid][ref4], [14, derde lid][ref5] en [14a, vierde lid, van de wet][ref6], de
      [artikelen 2.7][ref7] en [2.9 tot en met 2.12 van het besluit][ref8], de [artikelen 2.1 tot en met 2.6][ref9]
      en [2.12][ref10], eerste lid, en bij de uitvoering van taken een kwaliteitssysteem wordt gehanteerd, dat
      bewerkstelligt dat aan deze wettelijke vereisten wordt voldaan en dat voldoet aan normen, waarmee de belanghebbende
      groeperingen hebben ingestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel14
