      Een certificerende instelling als bedoeld in [artikel 6.1, eerste en derde lid][ref1] verstrekt aan de minister op
      diens verzoek alle informatie met betrekking tot de door haar verzorgde opleiding en stelt hem tijdig op de hoogte
      van voorgenomen wijzigingen van de inhoud van de opleiding en het bijbehorende examen.


