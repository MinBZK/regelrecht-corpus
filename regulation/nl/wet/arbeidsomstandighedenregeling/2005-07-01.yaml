        artikel: '6'
  - number: 6.1.2.a
    text: |-
      op grond van een daartoe door de Minister van Binnenlandse Zaken en Koninkrijksrelaties vastgestelde regeling een
      examen behorend bij de opleiding duikploegleider, duiker of duikmedische begeleiding bij de brandweer afneemt;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.1
  - number: 6.1.2.b
    text: |-
      op grond van een daartoe door de Minister van Defensie vastgestelde regeling een opleiding duikploegleider, duiker
      of duikmedische begeleiding bij het Ministerie van Defensie verzorgt en de bijbehorende examens afneemt.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.1
  - number: 6.1.3
    text: |-
      Als certificerende instelling als bedoeld in het tweede lid kan tevens worden aangewezen een opleidingsinstelling
      die een opleiding verzorgt die tot doel heeft personen op te leiden die uit hoofde van een bedrijf of beroep:
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.1
  - number: 6.1.3.a
    text: arbeid als duikploegleider verrichten of zullen gaan verrichten;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.1
  - number: 6.1.3.b
    text: duikarbeid verrichten of zullen gaan verrichten;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel6.1
  - number: 6.1.3.c
    text: |-
      duikers adequaat medisch begeleiden of zullen gaan begeleiden, en die voldoet aan de
      [artikelen 1.3 tot en met 1.8][ref1] en de [artikelen 6.2][ref2], [6.3][ref3], [6.4][ref4], [6.5][ref5], en
      [6.6][ref6]


