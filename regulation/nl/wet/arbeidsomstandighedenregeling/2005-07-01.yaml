      [ref9]: https://wetten.overheid.nl/BWBR0008587#Artikel2
      [ref10]: https://wetten.overheid.nl/BWBR0008587#Artikel2
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel2.11
