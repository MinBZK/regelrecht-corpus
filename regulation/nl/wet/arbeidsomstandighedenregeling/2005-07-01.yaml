    text: het boren van een boorgat;
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.7
  - number: 3.7.1.b
    text: het uitvoeren van werkzaamheden in of aan een bestaand boorgat, en
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.7
  - number: 3.7.1.c
    text: |-
      het gelijktijdig uitvoeren van werkzaamheden op een mijnbouwwerk of op of in de nabijheid van een
      mijnbouwinstallatie, indien het gelijktijdig uitvoeren van deze werkzaamheden een gevaar voor de veiligheid en de
      gezondheid vormt.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.7
  - number: 3.7.2
    text: Het veiligheids- en gezondheidsdocument, bedoeld in het eerste lid, is bij de uit te voeren werkzaamheden aanwezig.
    url: https://wetten.overheid.nl/BWBR0008587/2005-07-01#Artikel3.7
  - number: 3.8.1
    text: |-
      Het veiligheids- en gezondheidsdocument, bedoeld in artikel [3.6, onderdelen a en b][ref1], bestaat uit de volgende
