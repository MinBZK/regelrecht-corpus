  - number: '4.2'
    text: |-
      Deze paragraaf is van toepassing op de in [artikel 3.5h, eerste lid, van het besluit][ref1] bedoelde werkzaamheden
      op K1-, K3-, KT- of T-schepen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5h
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: 3.5h
  - number: '4.3'
    text: |-
      Indien zich bij of als gevolg van het verrichten van de werkzaamheden, bedoeld in
      [artikel 3.5h, eerste lid, van het besluit][ref1] gevaarlijke gassen concentreren en deze door onvoldoende
      luchtbeweging niet snel genoeg worden verdund of afgevoerd, worden maatregelen getroffen om deze concentraties
      te beperken. Indien dit niet in voldoende mate mogelijk is, worden de tankdeksels gesloten en de desbetreffende
      werkzaamheden gestaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5h
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: 3.5h
  - number: '4.4'
    text: |-
      1 Alvorens werknemers de schoon te maken ruimten betreden, is vastgesteld dat zulks zonder gevaar voor de
      veiligheid en gezondheid kan geschieden.

      2 Een schoon te maken ruimte wordt niet betreden zolang als gevolg van werkzaamheden in een aangrenzende ruimte de
      temperatuur van de schotten aanmerkelijk hoger kan worden dan de omgevingstemperatuur.

      3 Een schoon te maken ruimte wordt evenmin betreden zolang in een aangrenzende ruimte een explosief mengsel
      aanwezig is en deze ruimte niet is gesloten.

      4 Tijdens het schoonmaken worden aan dek en in de ladingzone geen andere werkzaamheden verricht dan die welke
      verband houden met het schoonmaken, tenzij deze werkzaamheden plaatsvinden tijdens een gesloten schoonmaakproces en
      uitsluitend betrekking hebben op laden en lossen. Het schoonmaken en de laad- en loswerkzaamheden:

      a. vinden volledig gescheiden van elkaar plaats;

      b. beïnvloeden elkaar niet en

      c. staan onder voortdurend toezicht.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.4
  - number: '4.5'
    text: |-
      Tijdens het schoonmaken wordt zo dikwijls als dit nodig is, onderzocht of als gevolg van vrijkomende vloeistoffen,
      gassen of dampen gevaar voor brand, ontploffing, bedwelming, verstikking of vergiftiging ontstaat.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.5
  - number: '4.6'
    text: |-
      1 Het schoonmaken van K1-, K3- en KT-ruimten is erop gericht de concentratie van gassen en dampen onder de onderste
      explosiegrens te houden of op veilige wijze tot onder die grens terug te brengen. Indien tijdens het schoonmaken
      een gassamenstelling optreedt, welke gevaar oplevert voor een ontploffing, wordt de duur van deze toestand zo kort
      mogelijk gehouden. Indien het schoonmaken geschiedt met gebruikmaking van inert gas, wordt dit op zodanige wijze
      uitgevoerd, dat een ontplofbaar mengsel niet kan ontstaan.

      2 Het schoonmaken van K1-, K3-, KT- en T-ruimten wordt zo uitgevoerd, dat binnen en buiten die ruimten naar
      redelijke verwachting geen gevaar voor bedwelming, verstikking of vergiftiging kan ontstaan. Indien het schoonmaken
      geschiedt met gebruikmaking van inert gas, wordt dit op zodanige wijze uitgevoerd, dat een ontplofbaar mengsel niet
      kan optreden.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 Het schoonmaken van K1-, K3- of KT-ruimten aan boord van K1-, K3-, of KT-schepen vindt slechts plaats indien
      binnen een afstand van 25 meter van de ladingzone geen vuur aanwezig is noch naar redelijke verwachting kan
      ontstaan.

      2 Het schoonmaken van K1-, K3- of KT-ruimten aan boord van K1-, K3-, of KT-schepen vindt slechts plaats indien
      binnen een afstand van 25 meter van de ladingzone geen gevaar bestaat voor vonkvorming of ontstekingsgevaar door
      elektrostatische ladingen.

      3 Het schoonmaken van K1-, K3- of KT-ruimten aan boord van K1-, K3-, of KT-schepen vindt slechts plaats indien
      binnen een afstand van 25 meter van de ladingzone niet gerookt wordt.

      4 Het schoonmaken van K1-, K3- of KT-ruimten aan boord van K1-, K3-, of KT-schepen vindt slechts plaats indien er
      binnen een afstand van 25 meter van de ladingzone geen onbevoegden kunnen komen.

      5 De ladingtanks in de gehele ladingzone van K1,- K3- en KT-schepen worden niet geopend dan nadat aan het eerste
      tot en met vierde lid is voldaan.

      6 De ladingtanks in de gehele ladingzone van T-schepen worden niet geopend dan nadat aan het vierde lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.7
  - number: '4.8'
    text: |-
      De [artikelen 4.4, vierde lid][ref1], en [4.7][ref2] zijn niet van toepassing op K3-ruimten buiten de ladingzone op
      K1-, KT- en T-schepen indien met betrekking tot deze schepen een veiligheids- en gezondheidsverklaring als bedoeld
      in [artikel 4.1, onder t][ref3], is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4.4
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel4.7
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.8
