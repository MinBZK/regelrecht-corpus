  - number: '4.12'
    text: |-
      1 Binnen 25 meter van de ladingzone op een K1, of KT-schip dat niet veilig voor vuur is als bedoeld in
      [artikel 4.10, derde lid, onder c][ref1], en waarvoor, in afwijking van [artikel 4.9][ref2] niet de daartoe
      vereiste veiligheids- en gezondheidsverklaring is uitgereikt, is de aanwezigheid van vuur slechts toegestaan indien
      door een gasdeskundige voor de aanvang van de werkzaamheden een verklaring is afgegeven waaruit blijkt, dat de
      ladingzone veilig voor mensen is als bedoeld in [artikel 4.10, derde lid, onder b][ref3].

      2 De aanwezigheid van vuur, bedoeld in het eerste lid, is voorts toegestaan indien blijkt uit de verklaring,
      bedoeld in voornoemd lid, dat:

      a. de brandbare gassen in de atmosfeer van de ladingzone nergens een concentratie van meer dan 20% van de onderste
      explosiegrens vormen, of

      b. de toestand van de in de ladingzone aanwezige atmosfeer zodanig is dat bij verdunning daarvan met lucht geen
      brandbaar of explosief mengsel ontstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4.10
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel4.9
