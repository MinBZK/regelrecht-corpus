  - number: '4.28'
    text: |-
      Een aanwijzing als certificerende instelling kan geschieden indien:

      a. in geval van een certificerende instelling als bedoeld in [artikel 4.54a, vierde lid][ref1], of artikel 4.45d,
      eerste lid, van het besluit, de aanvragende instelling voldoet aan de criteria, vastgelegd in het Werkveldspecifiek
      document voor Aanwijzing en Toezicht op de certificatie-instellingen voor Asbestverwijderingsbedrijven (AVB) en
      Asbestinventarisatiebedrijven (AIB), zoals opgenomen in [bijlage XIIIe][ref2] bij de regeling;

      b. in geval van een certificerende instelling als bedoeld in
      [artikel 4.54d, vijfde of zevende lid, van het besluit][ref3] de aanvragende instelling voldoet aan de criteria,
      vastgelegd in het Werkveldspecifiek document voor Aanwijzing en Toezicht op de certificatieinstellingen voor
      Deskundig Toezichthouder Asbestverwijdering (DTA) en Deskundig Asbestverwijderaar (DAV), zoals opgenomen in
      [bijlage XIIIf][ref4] bij de regeling.


