  - number: BXIIIf:6
    text: |-
      1. De certificerende instelling beschikt voor de verificatie van de competenties inzake kennis, kunde en houding
      van het certificatiepersoneel over een specifieke verificatiemethode.

      2. De certificerende instelling zet alleen competent personeel in.

      3. Een certificerende instelling beschikt over de volgende deskundigen:

      a. een toezichthouder theorie-examen die zorg draagt voor de naleving en uitvoering van het examenreglement en de
      daarin opgenomen uitvoeringsvoorschriften voor het afnemen van het theorie-examen;

      b. een examinator praktijkexamen DAV respectievelijk DTA die belast is met de vaststelling of, en in welke mate
      kennis, vaardigheden en attitude van de kandidaat voldoen aan de gestelde eisen voor het praktijkexamen en die
      toeziet op de naleving en uitvoering van het examenreglement, de uitvoeringsvoorschriften en de exameneisen bij de
      afname van het praktijkexamen;

      c. een beoordelaar van theorie-examen en praktijkexamen die binnen de door de certificerende instelling gestelde
      termijn de resultaten van theorie- en praktijkexamens beoordeelt op basis van de waarderingsmethodiek zoals
      vastgelegd in [bijlage XIIIc][ref1]; en

      d. een certificaatbeslisser die de bevoegdheid heeft om certificatiebeslissingen te nemen.

      4. De in het derde lid bedoelde deskundigen voldoen aan de volgende algemene eisen:

      a. zij zijn in staat zich in woord en geschrift doeltreffend in de Nederlandse taal uit te drukken;

      b. zij kunnen onafhankelijk en zelfstandig handelen;

      c. zij beschikken over voldoende communicatieve en contactuele vaardigheden voor de uitoefening van hun taken; en

      d. zij hebben een integriteitsverklaring als bedoeld in artikel 7, derde lid, getekend in verband met
      geheimhouding, onafhankelijkheid van kandidaat en opleider en beslotenheid van de examens.

      5. Ten aanzien van een toezichthouder theorie-examen geldt tevens dat hij:

      a. objectief en zonder vooroordelen kan examineren;

      b. in staat is om tijdens een examen regelend en besluitvaardig op te treden;

      c. op basis van een overeenkomst met de certificerende instelling werkzaam is.

      6. Ten aanzien van een examinator praktijkexamen DAV en DTA geldt tevens dat hij naast de in het vierde lid
      genoemde eisen:

      a. voldoet aan alle eisen gesteld aan de toezichthouder theorie-examen;

      b. in staat is te oordelen op basis van feiten en de beoordelingscriteria;

      c. in staat is te verantwoorden hoe hij tot zijn oordeel is gekomen en hij dat schriftelijk kan vastleggen;

      d. gedegen kennis heeft van het certificatieschema zoals opgenomen als [bijlage XIIIc][ref2] bij de regeling;

      e. aantoonbaar minimaal twee jaar relevante werkervaring heeft in het vakgebied; en

      f. beschikt over een geldig DTA certificaat of het diploma Asbestdeskundige van de beheerstichting.

      7. Ten aanzien van de beoordelaar van theorie-examen en praktijkexamen geldt tevens dat hij naast de in het vierde
      lid genoemde eisen:

      a. actuele vakinhoudelijke kennis heeft van en inzicht in de werkzaamheden van de DAV en DTA;

      b. gedegen kennis heeft het in [bijlage XIIIc][ref3] bij de regeling opgenomen certificatieschema;

      c. de examenresultaten en het examenproces kan beoordelen;

      d. niet betrokken is bij de directe afname van theorie-examens en praktijkexamens; en

      e. een arbeidsovereenkomst voor onbepaalde tijd heeft met de certificerende instelling.

      8. Ten aanzien van de certificaatbeslisser geldt tevens dat hij naast de in het vierde lid genoemde eisen:

      a. gedegen kennis heeft van het examenreglement;

      b. gedegen kennis heeft van de NEN-EN-ISO/IEC 17024;

      c. niet betrokken is bij de directe afname en de beoordeling van de resultaten van theorie-examen en
      praktijkexamen; en

      d. een arbeidsovereenkomst voor onbepaalde tijd heeft met de certificerende instelling.

      9. De certificerende instelling houdt een register bij van het certificatiepersoneel en van hun inzet bij de
      examens.

      10. De certificerende instelling beschikt over persoonsdossiers van het certificatiepersoneel waarin ten minste
      zijn opgenomen:

      a. een curriculum vitae;

      b. een integriteitsverklaring als bedoeld in artikel 7, derde lid; en

      c. beoordelingsformulieren en andere relevante, persoonsgebonden documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0008587
      [ref2]: https://wetten.overheid.nl/BWBR0008587
      [ref3]: https://wetten.overheid.nl/BWBR0008587
