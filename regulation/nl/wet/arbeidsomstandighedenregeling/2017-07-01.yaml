  - number: BXIIIf:4
    text: |-
      1. Een certificerende instelling neemt deel aan het door het Centrale Commissie van Deskundigen georganiseerde
      harmonisatieoverleg.

      2. Een certificerende instelling voert de tijdens het in het eerste lid bedoelde overleg vastgestelde en bekend
      gemaakte afspraken over de geharmoniseerde uitvoering van de certificatie-eisen uit.

      3. De certificerende instellingen melden het weigeren, opschorten of intrekken van certificaten aan de andere
      certificerende instellingen die op hetzelfde werkveld werkzaam zijn.

      4. Afwijkingen worden geregistreerd door de certificerende instelling.

      5. Een certificerende instelling besteedt de afgifte van certificaten en de daaraan voorafgaande beoordeling en
      beslissing over de initiële certificatie en de hercertificatie niet uit aan derden.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4
  - number: BXIIIf:5
    text: |-
      1. Een certificerende instelling sluit een overeenkomst met de beheerstichting overeenkomstig
      [artikel 1.5a, eerste lid, onderdeel f, van het besluit][ref1].

      2. De in het eerste lid bedoelde overeenkomst bepaalt dat de certificerende instelling zich aansluit bij de
      door de beheerstichting ingestelde Centrale Commissie van Deskundigen en de daaronder ressorterende Centrale
      Examencommissie.

      3. Indien er meerdere certificerende instellingen zijn, kunnen deze instellingen overeenkomen dat zij gezamenlijk
      een vertegenwoordiger aanwijzen die de betreffende certificerende instellingen vertegenwoordigt bij de Centrale
      Commissie van Deskundigen.

      4. Indien er verschil van inzicht bestaat tussen een certificerende instelling en een certificaathouder over de
      interpretatie van [bijlage XIIIc][ref2] of de onderhavige bijlage, legt de certificerende instelling dit voor aan
      de Centrale Commissie van Deskundigen.

      5. De in het eerste lid bedoelde overeenkomst bepaalt tevens dat:

      a. de beheerstichting ten behoeve van het examen dat door de aanvrager van een certificaat wordt afgelegd, een
      itembank beheert waarin door de beheerstichting gegenereerde examenpakketten zijn opgenomen;

      b. de beheerstichting en de certificerende instelling geen informatie aan derden verstrekken over de inhoud van de
      itembank, bedoeld in onderdeel a;

      c. in afwijking van onderdeel b, de beheerstichting de Stichting Raad voor Accreditatie toegang verleent tot de
      itembank, bedoeld in onderdeel a, indien dat voor de beoordeling en tussentijdse controles van de certificerende
      instelling naar het oordeel van de Stichting Raad voor Accreditatie nodig is;

      d. de beheerstichting er zorg voor draagt dat tekortkomingen in de itembank die tijdens de in onderdeel c genoemde
      beoordelingen en controles kunnen blijken, zo spoedig mogelijk worden opgelost zodat dit een positieve beoordeling
      van de certificerende instelling door de Stichting Raad voor Accreditatie niet in de weg kan staan.

      6. De in het eerste lid bedoelde overeenkomst kan eisen bevatten inzake de procedures, bedoeld in artikel 3, tweede
      lid, onderdeel d, van deze bijlage.

      7. De in het eerste lid bedoelde overeenkomst bepaalt tevens dat de certificerende instelling de beheerstichting
      informeert zodra zij voornemens is een of meer van haar taken te beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5a
      [ref2]: https://wetten.overheid.nl/BWBR0008587
