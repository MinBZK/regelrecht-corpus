  - number: '4.18'
    text: |-
      Bij de beoordeling van het risico van blootstelling in de individuele ademhalingszone van de werknemer aan
      gevaarlijke stoffen in combinatie, zoals bedoeld in [artikel 4.2, zesde lid, van het besluit][ref1], wordt in geval
      van het risico van blootstelling aan stoffen waarvan bekend is dat deze stoffen hetzelfde gezondheidkundige gevolg
      hebben op hetzelfde orgaansysteem, [bijlage XIIc][ref2] bij de regeling toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.18
