  - number: BXIIIc:33
    text: |-
      1 Een kandidaat kan uiterlijk zes maanden na het behalen van een voldoende resultaat voor ofwel zijn praktijkexamen
      ofwel voor zijn theorie-examen herexamen doen voor het nog als onvoldoende gekwalificeerde examengedeelte theorie
      of praktijk.

      2 In de in het eerste lid bedoelde situatie kan de kandidaat kan maximaal twee maal een herexamen afleggen.

      3 Wanneer de kandidaat in de in het tweede lid bedoelde situatie niet geslaagd is na een herexamen, of na het
      verstrijken van de in het eerste lid bedoelde termijn, wordt zowel het theorie- als het praktijkexamen afgelegd.

      4 Er is geen maximum verbonden aan het aantal af te leggen gecombineerde praktijk- en theorie-examens.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel33
  - number: BXIIIc:34
    text: |-
      De DTA begrijpt wat de consequenties zijn wanneer hij niet in overeenstemming met de in artikel 29 en 30
      geformuleerde eindtermen handelt en kan uitleggen waarom zijn handelen daarmee in overeenstemming is.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel34
  - number: BXIIIc:35
    text: |-
      1 Een deskundig asbestverwijderaar (DAV) die is gecertificeerd voor of op 1 oktober 2013 wordt, zolang dat
      certificaat geldig is, geacht te voldoen aan de eisen die in deze bijlage gesteld worden aan de certificaathouder
      DAV-2.

      2 Een deskundig toezichthouder asbestverwijdering (DTA) die is gecertificeerd voor of op 1 maart 2013 wordt,
      zolang dat certificaat geldig is, geacht te voldoen aan de eisen die in deze bijlage gesteld worden aan de
      certificaathouder DTA.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel35
  - number: BXIIIc:36
    text: |-
      1 Een deskundig toezichthouder asbestverwijdering als bedoeld in [artikel 4.27, onderdeel c][ref1], van de
      Arbeidsomstandighedenregeling die beschikt over een certificaat DTA dat is afgegeven voor 1 maart 2016, wordt
      gedurende de looptijd van dat certificaat geacht te voldoen aan de eisen voor de deskundig toezichthouder
      asbestverwijdering zoals neergelegd in deze bijlage, met dien verstande het certificaat kan worden geschorst
      of ingetrokken indien de certificaathouder zich niet houdt aan de voor het gebruik van het certificaat geldende
      voorschriften.

      2 Een deskundig asbestverwijderaar als bedoeld in [artikel 4.27, onderdeel d][ref2], van de
      Arbeidsomstandighedenregeling die beschikt over een certificaat DAV dat is afgegeven voor 1 maart 2016, wordt
      gedurende de looptijd van dat certificaat geacht te voldoen aan de eisen voor de deskundig asbestverwijderaar
      niveau 2 zoals neergelegd in deze bijlage, met dien verstande het certificaat kan worden geschorst of ingetrokken
      indien de certificaathouder zich niet houdt aan de voor het gebruik van het certificaat geldende voorschriften.


