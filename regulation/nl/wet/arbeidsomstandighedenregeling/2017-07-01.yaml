  - number: '4.30'
    text: |-
      1 Onder kleine losliggende oppervlakken als bedoeld in
      [artikel 4.53c, tweede lid, onderdeel a, van het besluit][ref1] wordt verstaan: een losliggend oppervlak van
      maximaal 2,5 m2.

      2 De concentratie van de amfibole asbestvezels actinoliet, amosiet, anthofylliet, tremoliet en crocidoliet
      in de lucht waaraan werknemers in verband met de arbeid kunnen worden blootgesteld is beperkt in de zin van
      [artikel 4.53c, tweede lid, onderdeel b, van het besluit][ref2] indien de concentratie wordt veroorzaakt door:

      a. verwijdering van asbesthoudend materiaal dat maximaal 2 massaprocent amfibole asbestvezels actinoliet, amosiet,
      anthofylliet, tremoliet en crocidoliet bevat; of

      b. verwijdering van leidingen, buizen en kanalen van asbestcement, die niet volledig in beton gestort zijn;

      c. een asbestverwijdering waarbij gedurende de duur van de asbestverwijderingswerkzaamheden tussen de
      asbesttoepassing en de werknemer die de verwijdering uitvoert een niet-betreedbare afscheiding aanwezig is, waarmee
      de asbesttoepassing in zijn geheel lekvrij omsloten wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.53c
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.53c
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.30
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: 4.53c
