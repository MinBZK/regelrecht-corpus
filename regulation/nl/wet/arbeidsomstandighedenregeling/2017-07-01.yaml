  - number: '8.2'
    text: |-
      1 De signalering met betrekking tot een verbod, een waarschuwing en een gebod, alsmede de signalering met
      betrekking tot de lokalisatie en de identificatie van reddings- of hulpmiddelen geschiedt permanent door middel
      van borden.

      2 De signalering voor de lokalisatie en identificatie van brandbestrijdingsmateriaal geschiedt permanent door
      middel van borden of een veiligheidskleur.

      3 De signalering op reservoirs en leidingen geschiedt overeenkomstig de [artikelen 8.4, derde lid][ref1],
      [8.9][ref2] en [8.11 tot en met 8.15][ref3].

      4 De signalering van gevaren van stoten tegen obstakels en van vallen van personen geschiedt permanent door middel
      van een veiligheidskleur of borden.

      5 De markering van verkeerswegen geschiedt permanent door middel van een veiligheidskleur.


