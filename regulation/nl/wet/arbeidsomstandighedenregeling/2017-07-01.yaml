  - number: 3.2a
    text: |-
      1 De risico’s in het kader van de risico-analyse, bedoeld in [artikel 3.2, onderdeel a][ref1], worden kwalitatief
      en, voor zover mogelijk, kwantitatief bepaald.

      2 De grenzen in het kader van bepaling van de acceptatiecriteria, bedoeld in [artikel 3.2, onderdeel b][ref2],
      worden, voor zover mogelijk, kwantitatief bepaald. Voor zover dit niet mogelijk is, worden deze grenzen kwalitatief
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel3.2
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel3.2a
