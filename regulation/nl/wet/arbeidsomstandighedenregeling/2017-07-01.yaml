  - number: '7.7'
    text: |-
      1 De aanwijzing als certificerende instelling, bedoeld in
      [artikel 7.32, eerste lid, aanhef en onder a, van het besluit][ref1], kan geschieden indien de aanvragende
      instelling voldoet aan de eisen zoals neergelegd in het Werkveldspecifiek document voor aanwijzing en toezicht
      op de certificatie- en keuringsinstellingen die personen certificeren in het kader van verticaal transport,
      documentcode WDAT-VT-Personen zoals opgenomen in [bijlage XVII][ref2] bij de regeling.

      2 Een certificaat als bedoeld in [artikel 7.6][ref3], wordt door de minister of, indien de minister een
      certificerende instelling als bedoeld in het eerste lid, heeft aangewezen, de certificerende instelling, afgegeven
      indien de aanvrager voldoet aan de navolgende eisen:

      a. indien het betreft een certificaat voor de bediening van een mobiele torenkraan van de categorie, bedoeld in
      [artikel 7.6, tweede lid, onderdeel a, sub 1°][ref4], het Werkveldspecifiek certificatieschema ‘Machinist Mobiele
      Torenkraan’, documentcode WSCS-VT Machinist Mobiele Torenkraan, zoals opgenomen in [bijlage XVIIa][ref5] bij de
      regeling;

      b. indien het betreft een certificaat voor de bediening van een torenkraan van de categorieën, bedoeld in
      [artikel 7.6, tweede lid, onderdeel a, sub 2° en 3°][ref6], het Werkveldspecifiek certificatieschema ‘Machinist
      Torenkraan’, documentcode WSCS-VT Machinist Torenkraan, zoals opgenomen in [bijlage XVIIb][ref7] bij de regeling
      dan wel het Werkveldspecifiek certificatieschema Machinist Mobiele Torenkraan, documentcode WSCS-VT Machinist
      Mobiele Torenkraan, zoals opgenomen in [bijlage XVIIa][ref8] bij de regeling;

      c. indien het betreft een certificaat voor de bediening van een mobiele kraan van de categorieën, bedoeld in
      [artikel 7.6, tweede lid, onderdeel b, sub 1° en 2°][ref9], het Werkveldspecifiek certificatieschema ‘Machinist
      Mobiele Kraan’, documentcode WSCS-VT Machinist Mobiele Kraan, zoals opgenomen in [bijlage XVIIc][ref10] bij de
      regeling;

      d. indien het betreft een certificaat voor de bediening van een mobiele kraan, zijnde een grondverzetmachine
      met hijsfunctie, van de categorie, bedoeld in [artikel 7.6, tweede lid onderdeel b, sub 3°][ref11], het
      Werkveldspecifiek certificatieschema ‘Machinist Grondverzetmachine met Hijsfunctie’, documentcode WSCS-VT Machinist
      Grondverzetmachine met Hijsfunctie, zoals opgenomen als [bijlage XVIId][ref12] bij de regeling dan wel het
      Werkveldspecifiek certificatieschema Machinist Mobiele Kraan, documentcode WSCS-VT Machinist Mobiele Kraan, zoals
      opgenomen in [bijlage XVIIc][ref13] bij de regeling;

      e. indien het betreft een certificaat voor de bediening van een mobiele kraan, zijnde een autolaadkraan
      met hijsfunctie, van de categorie, bedoeld in [artikel 7.6, tweede lid, onderdeel b, sub 4°][ref14], het
      Werkveldspecifiek certificatieschema ‘Machinist Autolaadkraan’, documentcode WSCS-VT Machinist Autolaadkraan, zoals
      opgenomen in [bijlage XVIIe][ref15] bij de regeling dan wel het Werkveldspecifiek certificatieschema Machinist
      Mobiele Kraan, documentcode WSCS-VT Machinist Mobiele Kraan, zoals opgenomen in [bijlage XVIIc][ref16] bij de
      regeling;

      f. indien het betreft een certificaat voor de bediening van een mobiele kraan, zijnde een verreiker met
      hijsfunctie, van de categorie, bedoeld in [artikel 7.6, tweede lid, onderdeel b, sub 5°][ref17], het
      Werkveldspecifiek certificatieschema ‘Machinist Verreiker met Hijsfunctie’, documentcode WSCS-VT Machinist
      Verreiker met Hijsfunctie, zoals opgenomen in [bijlage XVIIf][ref18] bij de regeling dan wel het Werkveldspecifiek
      certificatieschema Machinist Mobiele Kraan, documentcode WSCS-VT Machinist Mobiele Kraan, zoals opgenomen in
      [bijlage XVIIc][ref19] bij de regeling;

      g. indien het betreft een certificaat voor de bediening van een funderingsmachine als bedoeld in artikel 7.6,
      tweede lid, onderdeel c, sub 1°, van het Werkveldspecifiek certificatieschema ‘Machinist Kleine Funderingsmachine’,
      documentcode WSCS-VT Machinist Kleine Funderingsmachine, zoals opgenomen in [bijlage XVIIg][ref20] bij de regeling
      dan wel het Werkveldspecifiek certificatieschema ‘Machinist Grote Funderingsmachine’, documentcode WSCS-VT
      Machinist Grote Funderingsmachine, zoals opgenomen in [bijlage XVIIh][ref21] bij de regeling;

      h. indien het betreft een certificaat voor de bediening van een funderingsmachine als bedoeld in artikel 7.6,
      tweede lid, onderdeel c, sub 2° van, het Werkveldspecifiek certificatieschema ‘Machinist Grote Funderingsmachine’,
      documentcode WSCS-VT Machinist Grote Funderingsmachine, zoals opgenomen in [bijlage XVIIh][ref22] bij de regeling.


