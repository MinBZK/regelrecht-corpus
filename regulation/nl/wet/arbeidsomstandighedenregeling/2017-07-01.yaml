  - number: 1.9d
    text: |-
      1 De dienstverrichter, bedoeld in [artikel 1.9b][ref1], wordt door de minister of, indien de minister een
      certificerende instelling als bedoeld in [artikel 1.5a van het besluit][ref2], heeft aangewezen, die instelling,
      in de gelegenheid gesteld de proeve van bekwaamheid, bedoeld in [artikel 1.9c, vierde lid][ref3], af te leggen.
      [Artikel 1.9a, vijfde lid][ref4], is van overeenkomstige toepassing.

      2 Na het afleggen van de proeve van bekwaamheid zendt de minister of, indien de minister een certificerende
      instelling als bedoeld in [artikel 1.5a van het besluit][ref5], heeft aangewezen, die instelling, een bewijs van
      toetsing aan de dienstverrichter indien het resultaat van de proeve van bekwaamheid voldoende is voor tijdelijke en
      incidentele dienstverrichting in Nederland.

      3 Indien het resultaat van de proeve van bekwaamheid onvoldoende is, heeft de dienstverrichter het recht nogmaals
      een proeve van bekwaamheid af te leggen.


