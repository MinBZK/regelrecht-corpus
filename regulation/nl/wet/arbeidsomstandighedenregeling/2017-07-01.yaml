  - number: '1.11'
    text: |-
      1 In dit artikel wordt verstaan onder beroepsziekte: een ziekte of aandoening als gevolg van een belasting die in
      overwegende mate in arbeid of arbeidsomstandigheden heeft plaatsgevonden.

      2 De mededeling van een beroepsziekte, bedoeld in [artikel 9, derde lid, van de wet][ref1] omvat ten minste de
      volgende, niet tot een individuele natuurlijke persoon herleidbare, gegevens:

      a. de diagnose;

      b. het geslacht en het geboortejaar van de werknemer;

      c. de aard en de mate van de belasting in arbeid of arbeidsomstandigheden;

      d. de aard van de werkzaamheden ten tijde van het ontstaan van de beroepsziekte;

      e. het beroep van de werknemer ten tijde van de blootstelling, en

      f. de economische activiteit van de werkgever ten tijde van de blootstelling.

      3 De in het tweede lid bedoelde gegevens worden verstrekt overeenkomstig de aanwijzingen van de instelling, bedoeld
      in [artikel 9, derde lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel9
