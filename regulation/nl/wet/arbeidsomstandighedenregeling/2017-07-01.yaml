  - number: 4.17b
    text: |-
      1 De aanwijzing als certificerende instelling als bedoeld in [artikel 4.9, tweede lid, van het besluit][ref1],
      kan geschieden indien de aanvragende instelling voldoet aan de eisen zoals neergelegd in het Werkveldspecifiek
      document voor aanwijzing en toezicht op certificatie-instellingen behorend bij het certificatieschema voor het
      persoonscertificaat Vuurwerkdeskundige, documentcode WDAT-VD zoals opgenomen in [bijlage XIIa][ref2] bij de
      regeling.

      2 Een certificaat vakbekwaamheid professioneel vuurwerk als bedoeld in
      [artikel 4.9, tweede lid, van het besluit][ref3], wordt door de certificerende instelling bedoeld in het
      eerste lid, afgegeven indien de aanvrager voldoet aan de eisen zoals neergelegd in het Werkveldspecifiek
      certificatieschema voor het persoonscertificaat Vuurwerkdeskundige, documentcode WSCS-VD, zoals opgenomen in
      [bijlage XIIb][ref4] bij de regeling.


