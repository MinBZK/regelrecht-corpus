  - number: '3.3'
    text: |-
      Het veiligheids- en gezondheidszorgsysteem is gebaseerd op een procesgerichte internationaal erkende norm voor de
      beheersing van veiligheid, gezondheid, kwaliteitszorg of milieu.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 Het veiligheids- en gezondheidszorgsysteem wordt schriftelijk vastgelegd.

      2 In de beschrijving van het veiligheids- en gezondheidszorgsysteem wordt aangegeven wat de onderdelen van dit
      systeem inhouden en hoe de samenhang is tussen deze onderdelen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 Het veiligheids- en gezondheidszorgsysteem wordt regelmatig doorgelicht op basis van internationaal erkende
      normen voor het doorlichten van zorgsystemen.

      2 De aard en de frequentie van de doorlichting wordt zodanig gekozen dat de doeltreffendheid van het veiligheids-
      en gezondheidszorgsysteem telkens na een periode van drie jaar kan worden bepaald.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Er wordt een veiligheids- en gezondheidsdocument opgesteld voor de volgende mijnbouwwerken:

      a. ieder mijnbouwwerk op het land;

      b. iedere vast opgestelde mijnbouwinstallatie;

      c. iedere als een geheel verplaatsbare mijnbouwinstallatie, en

      d. iedere andere verplaatsbare installatie met behulp waarvan boorgaten worden geboord of werkzaamheden in of aan
      een bestaand boorgat worden uitgevoerd;

      2 Het veiligheids- en gezondheidsdocument, bedoeld in het eerste lid, is op de mijnbouwwerken, bedoeld in het
      eerste lid, aanwezig.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 Voor zover niet reeds bij het opstellen van het veiligheids- en gezondheidsdocument, bedoeld in
      [artikel 3.6][ref1], hiermee rekening is gehouden, wordt er een veiligheids- en gezondheidsdocument opgesteld voor
      de volgende bijzondere werkzaamheden:

      a. het boren van een boorgat;

      b. het uitvoeren van werkzaamheden in of aan een bestaand boorgat, en

      c. het gelijktijdig uitvoeren van werkzaamheden op een mijnbouwwerk of op of in de nabijheid van een
      mijnbouwinstallatie, indien het gelijktijdig uitvoeren van deze werkzaamheden een gevaar voor de veiligheid en de
      gezondheid vormt.

      2 Het veiligheids- en gezondheidsdocument, bedoeld in het eerste lid, is bij de uit te voeren werkzaamheden
      aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3.6
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3.6'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '3.8'
    text: |-
      1 Het veiligheids- en gezondheidsdocument, bedoeld in artikel [3.6, onderdelen a en b][ref1], bestaat uit de
      volgende onderdelen:

      a. het voorontwerprapport;

      b. het gedetailleerd ontwerp, opstarten en gebruik;

      c. het addendum gebruik;

      d. het addendum grote wijzigingen, en

      e. het addendum verlaten en verwijderen.

      2 Het veiligheids- en gezondheidsdocument, bedoeld in [artikel 3.6, onderdelen c en d][ref2], bestaat uit de
      volgende onderdelen:

      a. het gedetailleerd ontwerp, opstarten en gebruik;

      b. het addendum gebruik, en

      c. het addendum grote wijzigingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3.6
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel3.6
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '3.6'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '3.6'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '3.9'
    text: |-
      Het veiligheids- en gezondheidsdocument, bedoeld in [artikel 3.6][ref1], bevat:

      a. een duidelijke en nauwkeurige beschrijving van het mijnbouwwerk alsmede van de werkzaamheden die op het
      mijnbouwwerk worden uitgevoerd, met inbegrip van een aanduiding van de voorzieningen die in het ontwerp van het
      mijnbouwwerk zijn opgenomen ter uitsluiting of vermindering van de risico's;

      b. in aanvulling op onderdeel a, de informatie, bedoeld in [bijlage IV][ref2] bij deze regeling;

      c. de informatie, bedoeld in [bijlage V][ref3] bij deze regeling, met betrekking tot het brandbestrijdingsplan;

      d. de informatie, bedoeld in onderdeel c, is gebaseerd op de opgave, bedoeld in
      [artikel 2.42f, eerste lid, onder a, van het besluit][ref4];

      e. een opgave van de acceptatiecriteria;

      f. een lijst van alle geïdentificeerde en geanalyseerde risico's, inclusief een samenvatting van het onderzoek dat
      in dit kader is verricht voor het mijnbouwwerk op het land of de vast opgestelde mijnbouwinstallatie als bedoeld
      in [bijlage VI][ref5] bij deze regeling of voor de als een geheel verplaatsbare mijnbouwinstallatie of een andere
      verplaatsbare installatie met behulp waarvan boorgaten worden geboord of werkzaamheden in een bestaand boorgat
      worden uitgevoerd, bedoeld in [bijlage VII][ref6] bij deze regeling;

      g. een specificatie van de bronnen, die zijn gebruikt bij het identificeren, analyseren en evalueren van de
      risico's, met inbegrip van een beschrijving van de wijze waarop de geschiktheid en betrouwbaarheid van de bronnen
      is vastgesteld;

      h. een beoordeling van de doeltreffendheid en geschiktheid van het veiligheids- en gezondheidszorgsysteem voor
      het mijnbouwwerk met inbegrip van de resultaten en de noodzakelijk bevonden wijzigingen of aanvullingen van dat
      zorgsysteem;

      i. een samenvatting, in niet-technische terminologie, van het onderzoek, bedoeld in [bijlage VI][ref7]
      en [VII][ref8] bij deze regeling, dat is verricht in het kader van het opstellen van het veiligheids- en
      gezondheidsdocument;

      j. een opgave van de noodzakelijk geachte risicoverminderende maatregelen, inclusief een samenvatting van al het
      onderzoek dat in dit kader is verricht;

      k. een opgave van de prestatienormen;

      l. de grenzen waarbinnen de op het mijnbouwwerk gebruikte apparatuur en beheerssystemen normaal kunnen
      functioneren;

      m. een actieplan met tijdpad voor de realisatie van de maatregelen, bedoeld in onderdeel j;

      n. een toetsing van de vermelde risico's aan de acceptatiecriteria;

      o. een toetsing van de prestaties van een procesinstallatie of componenten daarvan, van apparatuur en van
      beheerssystemen aan de prestatienormen, en

      p. een schriftelijke verklaring dat de risico's ten minste binnen de van tevoren vastgestelde acceptatiecriteria en
      prestatienormen vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3.6
      [ref2]: https://wetten.overheid.nl/BWBR0008587
      [ref3]: https://wetten.overheid.nl/BWBR0008587
      [ref4]: https://wetten.overheid.nl/BWBR0008498#Artikel2.42f
      [ref5]: https://wetten.overheid.nl/BWBR0008587
      [ref6]: https://wetten.overheid.nl/BWBR0008587
      [ref7]: https://wetten.overheid.nl/BWBR0008587
      [ref8]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel3.9
    references:
