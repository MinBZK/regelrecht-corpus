  - number: '4.15'
    text: |-
      1 De aanduidingen op verpakkingen als bedoeld in de [artikelen 1.46, vierde lid][ref1] of
      [4.1d, eerste lid, van het besluit][ref2]:

      a. worden gesteld in de Nederlandse taal waarbij naast de Nederlandse taal een andere taal mag worden gebruikt,
      mits in alle gebruikte talen dezelfde gegevens worden vermeld;

      b. worden duurzaam op één of meer oppervlakken van de onmiddellijke verpakking van de stof of het mengsel bevestigd
      en zijn horizontaal leesbaar wanneer de verpakking op normale wijze wordt neergezet;

      c. hebben een zodanige kleur en opmaak dat het gevarenpictogram duidelijk afsteekt;

      d. bevatten vermeldingen als bedoeld in de [artikelen 1.46, vierde lid][ref3] of
      [4.1d, eerste lid, van het besluit][ref4] die duidelijk en onuitwisbaar worden aangebracht, duidelijk tegen de
      achtergrond afsteken en een zodanige grootte en spatiëring hebben dat zij gemakkelijk leesbaar zijn, en

      e. hebben afmetingen die voldoen aan bijlage I, deel 1.2.1, van EG-verordening indeling, etikettering en verpakking
      van stoffen en mengsels.

      2 De vorm, kleur en grootte van een gevarenpictogram voldoen aan bijlage I, deel 1.2.1, van EG-verordening
      indeling, etikettering en verpakking van stoffen en mengsels.

      3 De gevarenpictogrammen, signaalwoorden of gevarenaanduidingen worden bij elkaar op het etiket geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.46
