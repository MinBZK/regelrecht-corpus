  - number: '4.16'
    text: |-
      Een certificaat van vakbekwaamheid springmeester als bedoeld in [artikel 4.8, tweede lid, van het besluit][ref1]
      wordt door de minister of, indien de minister een certificerende instelling heeft aangewezen, de certificerende
      instelling, afgegeven indien de aanvrager voldoet aan de eisen zoals neergelegd in het certificatieschema voor het
      persoonscertificaat springmeester, zoals opgenomen in [bijlage X][ref2] bij de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.8
      [ref2]: https://wetten.overheid.nl/BWBR0008587
