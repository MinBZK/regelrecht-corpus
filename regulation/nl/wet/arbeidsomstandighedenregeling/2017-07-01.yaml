  - number: BXIIIc:2
    text: |-
      De eisen in NEN-EN-ISO/IEC 17024 zijn onverkort van toepassing voor het verlenen van een certificaat overeenkomstig
      deze bijlage en worden in deze bijlage nader uitgewerkt.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel2
  - number: BXIIIc:3
    text: |-
      1 De certificerende instelling is verantwoordelijk voor de afgifte van een persoonscertificaat en draagt zorg voor
      de uitvoering van de volgende werkzaamheden:

      a. fase 1: examineren van de kandidaat met onderscheid in theorie en praktijkexamen;

      b. fase 2: beoordelen van de examenresultaten van de kandidaat;

      c. fase 3: beslissen omtrent verlening, en eventueel intrekking, van het certificaat.

      2 De in het eerste lid, onder a, bedoelde werkzaamheden kunnen worden uitbesteed aan een exameninstelling, mits
      de certificerende instelling een overeenkomst met deze exameninstelling heeft afgesloten en hiervan een afschrift
      heeft verstrekt aan de beheerstichting. De certificerende instelling blijft verantwoordelijk voor de uitvoering van
      het examen.

      3 De werkwijze voor certificatie wordt de certificerende instelling in een certificatieprocedure vastgelegd. Deze
      certificatieprocedure bevat ten minste de volgende elementen:

      a. de wijze van controle op de entreecriteria;

      b. de wijze van registratie van de gegevens van de kandidaat;

      c. de wijze en frequentie van het doorgegeven van mutaties ten behoeve van het certificaatregister;

      d. de verplichting tot het gebruik van de itembank welke wordt beheerd door de beheerstichting;

      e. de wijze van omgaan met de examenopgaven en de maatregelen die genomen worden om de vertrouwelijkheid van deze
      gegevens te waarborgen;

      f. de verplichting om interpretatieverschillen met betrekking tot vragen of opdrachten uit de itembank voor te
      leggen aan de beheerstichting;

      g. de wijze van beoordeling van de examenresultaten door de beoordelaar;

      h. de wijze van beslissing tot verlening, weigering of intrekking van een certificaat; en

      i. eisen en wijze van beoordeling ten aanzien van de erkenning van buitenlandse certificaten.

      4 De certificerende instelling controleert vooraf of de kandidaat reeds een certificaat heeft gehad bij een
      andere certificerende instelling en of dit certificaat is geschorst of ingetrokken. Indien het certificaat in een
      periode van twaalf maanden voorafgaand aan de aanvraag is geschorst of ingetrokken, accepteert de certificerende
      instelling de aanvraag niet en verwijst de kandidaat terug naar zijn oorspronkelijke certificerende instelling. De
      certificerende instelling beslist binnen vier weken nadat aan alle eisen is voldaan.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel3
  - number: BXIIIc:4
    text: |-
      1 Voor hercertificatie gelden dezelfde procedures en eisen als voor initiële certificatie.

      2 Hercertificatie vindt plaats nadat het gehele praktijk- en theorie-examen met goed gevolg is afgelegd.

      3 Indien de positieve hercertificatiebeslissing valt binnen drie maanden voor de vervaldatum van het lopende
      certificaat, dan is deze vervaldatum tevens de ingangsdatum van het vervolgcertificaat.

      4 Indien de positieve hercertificatiebeslissing valt voor de drie maanden voorafgaand aan de vervaldatum van het
      lopende certificaat dan is de datum van de hercertificatiebeslissing de ingangsdatum van het vervolgcertificaat.

      5 Een nieuw certificaat wordt slechts verstrekt onder het gelijktijdig intrekken of ongeldig maken van het eerder
      afgegeven certificaat.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4
  - number: BXIIIc:5
    text: |-
      1 Het examen bestaat uit een praktijkexamen en een theorie-examen.

      2 De certificerende instelling beschikt over een examenreglement dat ten minste de volgende elementen bevat:

      a. de wijze waarop de deelname en oproep worden bevestigd;

      b. de wijze van identificatie van de deelnemers;

      c. een regeling inzake toelating en afwezigheid;

      d. de wijze van examinering;

      e. gedragsregels voor kandidaten;

      f. een regeling inzake alternatieven voor het theorie-examen;

      g. de wijze van bekendmaking van de uitslag door de certificerende instelling aan de kandidaat;

      h. een regeling inzake het vaststellen van de bewaartermijn van de examendocumenten zoals uitwerkingen en
      beoordelingsformulieren; en

      i. een regeling inzake het inzagerecht.

      3 De vragen en opdrachten voor het examen worden ontleend aan de itembank die wordt beheerd door de
      beheerstichting.

      4 De certificerende instelling informeert de kandidaat over de kosten van het examen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel5
  - number: BXIIIc:6
    text: |-
      Het theorie-examen wordt in de Nederlandse taal afgenomen waarbij de tekst van de vragen op papier of in
      elektronische vorm kan worden aangeboden.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel6
  - number: BXIIIc:7
    text: |-
      1 De volgende alternatieve wijzen voor het afnemen van een theorie-examen worden onderscheiden:

      a. een voorleesexamen door middel van een geluidsdrager; of

      b. een verlengd examen.

      2 Een voorleesexamen kan alleen en onder de in het zesde lid opgenomen voorwaarden worden afgenomen bij een DAV-
      1 of DAV-2 kandidaat, maar niet bij DTA kandidaten. Een voorleesexamen wordt door de beheerstichting beschikbaar
      gesteld.

      3 Een verlengd examen kan alleen worden afgenomen bij kandidaten die een door een psycholoog of orthopedagoog
      afgegeven dyslexieverklaring kunnen overleggen.

      4 Een kandidaat richt een schriftelijk verzoek voor het mogen afleggen van een alternatief theorie-examen aan de
      certificerende instelling.

      5 Voor een alternatief theorie-examen kunnen hogere kosten in rekening worden gebracht. De kandidaat wordt over
      deze kosten vooraf geïnformeerd door de certificerende instelling.

      6 Bij een voorleesexamen geldt het volgende:

      a. de toezichthouder instrueert de kandidaat;

      b. de kandidaat krijgt het examen aangeboden op een geluidsdrager of computer en kan zelf vragen opnieuw afspelen
      binnen de beschikbare tijd;

      c. de kandidaat duidt en noteert zelf het antwoord, en

      d. de beschikbare tijd is gelijk aan die voor het reguliere examen.

      7 Voor een verlengd examen is de beschikbare tijd 150% van de reguliere maximale examenduur.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel7
  - number: BXIIIc:8
    text: |-
      1 De locatie van het praktijkexamen is geschikt voor het afnemen van de betreffende praktijkexamens.

      2 Tijdens het praktijkexamen wordt gecommuniceerd in de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8
  - number: BXIIIc:9
    text: |-
      1 De certificaathouder verleent desgevraagd medewerking aan controles van een certificerende instelling
      procescertificatie, voor zover het een controle betreft van een gecertificeerd asbestverwijderingsbedrijf waarvoor
      de certificaathouder werkzaamheden verricht.

      2 Indien een certificerende instelling procescertificatie met betrekking tot het functioneren van een
      certificaathouder DTA of DAV-1 of DAV-2 afwijkingen constateert van hetgeen is voorgeschreven in deze bijlage
      en dit rapporteert aan de certificerende instelling die het betreffende persoonscertificaat heeft afgegeven, dan
      onderzoekt de laatstbedoelde certificerende instelling deze melding en gaat deze zo nodig over tot het opleggen van
      sancties jegens de betreffende certificaathouder.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel9
  - number: BXIIIc:10
    text: |-
      1 Indien een toezichthoudende overheidsinstelling, waaronder in ieder geval begrepen de Inspectie SZW, met
      betrekking tot het functioneren van een certificaathouder DTA of DAV-1 of DAV-2 afwijkingen constateert van
      hetgeen is voorgeschreven in deze bijlage en dit rapporteert aan de certificerende instelling die het betreffende
      persoonscertificaat heeft afgegeven, dan onderzoekt de laatstbedoelde instelling deze melding en gaat deze zo nodig
      over tot het opleggen van sancties jegens de betreffende certificaathouder. Indien de certificerende instelling
      besluit dit niet te doen, legt zij dit besluit inclusief de onderbouwing daarvan schriftelijk vast en zorgt zij
      voor een deugdelijke archivering hiervan.

      2 Indien de toezichthoudende overheidsinstelling daarom verzoekt, wordt deze door de certificerende instelling
      schriftelijk geïnformeerd over haar besluit en over de redenen die aan dat besluit ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel10
  - number: BXIIIc:11
    text: |-
      1 Indien de certificerende instelling een melding ontvangt over gedragingen van een certificaathouder anders dan
      op basis van artikel 9 of artikel 10, beoordeelt de certificerende instelling of sprake is van een afwijking van de
      eisen en of die afwijking toe te rekenen is aan de certificaathouder.

      2 De certificerende instelling meldt schriftelijk aan degene die de melding gedaan heeft of naar haar oordeel
      sprake was van een afwijking en deze heeft geleid tot oplegging van een sanctie.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel11
  - number: BXIIIc:12
    text: |-
      1 De certificerende instelling onderzoekt naar aanleiding van een melding van een certificerende instelling
      voor het Procescertificaat Asbestverwijdering dan wel van een toezichthoudende overheidsinstelling, of een
      certificaathouder niet voldoet of voldaan heeft aan of één meer bepalingen opgenomen in bijlage 1 en daarmee sprake
      is van een of meer afwijkingen.

      2 De certificerende instelling stelt binnen een week na ontvangst van een melding als bedoeld in het eerste lid,
      een onderzoek in.

      3 De certificerende instelling rondt het onderzoek, bedoeld in het eerste lid, binnen twee weken af met het
      vaststellen van haar conclusie ter zake en indien die conclusie inhoudt dat sprake is van een of meer afwijkingen,
      de bepaling van de sanctie die zij overeenkomstig artikel 12a voornemens is te treffen.

      4 De certificerende instelling registreert de meldingen, bedoeld in het eerste lid, de conclusies van de verrichte
      onderzoeken en de sancties die zijn getroffen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel12
  - number: BXIIIc:12a
    text: |-
      1 Indien de certificaathouder niet voldoet aan of voldaan heeft aan een of meer bepalingen die in bijlage 1
      zijn opgenomen is sprake van een afwijking en wordt het persoonscertificaat van de certificaathouder door de
      certificerende instelling voorwaardelijk geschorst voor ten hoogste 90 dagen, onvoorwaardelijk geschorst voor 30
      dagen of ingetrokken.

      2 Het persoonscertificaat wordt voorwaardelijk geschorst voor ten hoogste 90 dagen in geval van één geconstateerde
      afwijking van categorie II naar aanleiding van een beoordeling op een projectlocatie.

      3 Wanneer een persoonscertificaat voorwaardelijk is geschorst mag de certificaathouder werkzaamheden blijven
      verrichten waarvoor het bezit van een geldig persoonscertificaat verplicht is.

      4 Indien de houder van het persoonscertificaat dat voorwaardelijk is geschorst binnen uiterlijk twee dagen voor
      afloop van de duur van de opgelegde voorwaardelijke schorsing aan de certificerende instelling heeft aangetoond
      adequate corrigerende maatregelen te hebben genomen en de certificerende instelling heeft vastgesteld dat deze
      adequaat zijn, bevestigt de certificerende instelling zulks aan de certificaathouder.

      5 Het persoonscertificaat wordt onvoorwaardelijk geschorst voor 30 dagen, indien:

      a. de certificerende instelling een categorie I afwijking constateert;

      b. de certificerende instelling binnen een periode van één jaar na constatering van een categorie II-afwijking
      opnieuw een categorie II-afwijking constateert; of

      c. de certificaathouder waarvan het persoonscertificaat voorwaardelijk is geschorst niet uiterlijk twee dagen voor
      afloop van de duur van de opgelegde voorwaardelijke schorsing aan de certificerende instelling heeft aangetoond
      adequate corrigerende maatregelen te hebben genomen.

      6 Wanneer een persoonscertificaat onvoorwaardelijk is geschorst mag de certificaathouder geen werkzaamheden
      verrichten waarvoor het bezit van een geldig persoonscertificaat verplicht is.

      7 Het persoonscertificaat wordt ingetrokken indien:

      a. de certificaathouder tijdens een onvoorwaardelijke schorsing van zijn persoonscertificaat werkzaamheden heeft
      uitgevoerd waarvoor een geldig persoonscertificaat vereist is;

      b. de certificaathouder van wie het persoonscertificaat onvoorwaardelijk is geschorst niet uiterlijk twee dagen
      voor afloop van de onvoorwaardelijke schorsing aan de certificerende instelling heeft aangetoond het examen op
      basis waarvan het certificaat was verstrekt opnieuw te hebben gedaan en met goed gevolg te hebben afgesloten; of

      c. binnen twee jaar na de aanvangsdatum van een onvoorwaardelijke schorsing van het persoonscertificaat van een
      certificaathouder opnieuw gronden bestaan voor een onvoorwaardelijke schorsing van zijn persoonscertificaat.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel12a
  - number: BXIIIc:12b
    text: |-
      1 De certificerende instelling zendt de certificaathouder binnen een zeven kalenderdagen na afronding van het
      onderzoek, bedoeld in artikel 12, eerste lid, de door haar getrokken conclusie.

      2 Indien de conclusie, bedoeld in het eerste lid, leidt tot een sanctie als bedoeld in artikel 12a, tweede, vijfde
      of zevende lid, stelt de certificerende instelling de certificaathouder bij die conclusie in de gelegenheid om
      binnen twee weken na ontvangst van die conclusie zijn zienswijze in te dienen op dat voornemen tot het treffen van
      een sanctie.

      3 De certificerende instelling zendt de certificaathouder zo spoedig mogelijk doch uiterlijk zeven kalenderdagen na
      de termijn, genoemd in het tweede lid, haar besluit omtrent het al dan niet treffen van een sanctie.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel12b
  - number: BXIIIc:13
    text: |-
      De volgende gegevens worden op het certificaat in ieder geval vermeld:

      a. naam en initialen van de certificaathouder;

      b. geboortedatum en geboorteplaats van de certificaathouder;

      c. het burgerservicenummer;

      d. uniek en eenduidig documentnummer of certificaatnummer afgegeven door de beheerstichting;

      e. naam van de certificerende instelling die het certificaat verleend heeft;

      f. verwijzing naar de geldende normen waaraan getoetst is;

      g. scope van het certificaat, inclusief de eisen die zijn opgenomen in de certificatieovereenkomst, bedoeld in
      artikel 14;

      h. de ingangsdatum van het certificaat en de datum waarop het certificaat ophoudt geldig te zijn; en

      i. een verklaring van de certificerende instelling dat de certificaathouder voldoet aan de eisen zoals vastgesteld
      in deze bijlage.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel13
  - number: BXIIIc:14
    text: |-
      1 De certificaathouder en de certificerende instelling sluiten een certificatieovereenkomst waarin ten minste
      de in het tweede en derde lid genoemde verplichtingen van de certificaathouder respectievelijk de certificerende
      instelling zijn opgenomen.

      2 De certificaathouder:

      a. blijft gedurende de looptijd van het certificaat voldoen aan de eisen uit deze bijlage;

      b. verleent medewerking aan controles door de certificerende instelling;

      c. legt bij een schorsing binnen vier weken na die schorsing opnieuw examen af waarbij bij goed gevolg de schorsing
      wordt opgeheven;

      d. stuurt een ongeldig geworden certificaat terug aan de certificerende instelling, binnen 14 dagen na een
      aangetekend verzoek hiertoe; en

      e. geeft wijzigingen door in zijn omstandigheden die voor het certificaat van belang kunnen zijn.

      3 De certificerende instelling:

      a. informeert de beheerstichting over de afgifte van een certificaat nadat de kandidaat is geslaagd voor het examen
      en heeft voldaan aan de betalingsverplichtingen ten behoeve van het certificaatregister; en

      b. besluit tot intrekking van het certificaat wanneer na een in het eerste lid, onderdeel c, bedoelde schorsing
      niet met goed gevolg examen is afgelegd.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel14
  - number: BXIIIc:15
    text: |-
      1 De entreecriteria voor de certificaathouder DAV-1 houden in dat de aanvrager:

      a. minimaal de leeftijd van 18 jaar heeft;

      b. aantoonbaar minder dan twaalf maanden voor het afleggen van het examen een facefit-test heeft uitgevoerd;

      c. de beschikking heeft over een masker van het juiste model en de goede maat; en

      d. deel 1 van het online-instructieprogramma adembescherming heeft afgerond en dat kan aantonen.

      2 In aanvulling op het eerste lid geldt als entreecriterium dat in de voorgaande twaalf maanden geen certificaat
      DAV-1, DAV-2 of DTA van de aanvrager is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel15
  - number: BXIIIc:16
    text: |-
      1 Het theorie-examen duurt maximaal 45 minuten en bestaat uit 20 gesloten vragen.

      2 Het praktijkexamen duurt maximaal 60 minuten en bestaat uit drie opdrachten.

      3 Een kandidaat is geslaagd als hij:

      a. voor het theorie-examen 70% van de te behalen punten heeft behaald;

      b. voor alle praktijkopdrachten minimaal 70% van de te behalen punten heeft gehaald; en

      c. geen fatale fout heeft gemaakt.

      4 Het certificaat DAV-1 is maximaal 6 maanden geldig.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel16
  - number: BXIIIc:17
    text: |-
