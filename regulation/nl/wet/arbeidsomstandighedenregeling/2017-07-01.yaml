  - number: 1.9b
    text: |-
      1 Voorafgaand aan de eerste dienstverrichting doet de dienstverrichter, die een beroep uitoefent
      als genoemd in de [artikelen 3.5h, derde lid][ref1], [4.8, tweede en derde lid][ref2],
      [4.9, tweede lid][ref3], [4.54d, vijfde en zevende lid][ref4], [6.16, derde en zesde lid][ref5], en
      [7.32, eerste lid, van het besluit][ref6], melding aan de minister of, indien de minister een certificerende
      instelling als bedoeld in [artikel 1.5a van het besluit][ref7], heeft aangewezen, die instelling, en verstrekt
      daarbij de volgende documenten:

      a. een schriftelijke verklaring waaruit blijkt welk gereglementeerd beroep de dienstverrichter in Nederland komt
      verrichten en waarin gegevens zijn opgenomen betreffende de verzekeringsdekking of soortgelijke bescherming tegen
      financiële risico’s van beroepsaansprakelijkheid;

      b. de documenten betreffende nationaliteit en verblijf, bedoeld in
      [artikel 23, derde lid, onderdeel a, van de wet][ref8];

      c. een bewijs van beroepskwalificaties;

      d. een bewijs dat de dienstverrichter gerechtigd is om het betreffende beroep uit te oefenen in een andere
      betrokken staat dan Nederland;

      e. een document dat niet ouder dan drie maanden is, waaruit blijkt dat ten aanzien van de aanvrager geen maatregel
      berustend op een in het buitenland gegeven rechterlijke, tuchtrechtelijke of bestuursrechtelijke beslissing van
      kracht is, op grond waarvan de rechten op de uitoefening van het betreffende beroep in het land waar de beslissing
      is gegeven, geheel of gedeeltelijk, tijdelijk of blijvend zijn verloren;

      f. indien de aanvrager houder is van een opleidingstitel die is afgegeven in een ander land dan de betrokken staat
      van vestiging, een schriftelijke verklaring waaruit blijkt dat de opleidingstitel door het daarvoor bevoegd gezag
      van de betrokken staat van vestiging is erkend;

      g. Indien het beroep dat of de opleiding van de aanvrager die leidt tot toegang tot of tot uitoefening van het
      beroep, niet is gereglementeerd in de betrokken staat van vestiging, een schriftelijke verklaring waaruit blijkt
      dat de aanvrager in de tien jaar voorafgaand aan de dienstverrichting in Nederland gedurende ten minste een jaar
      het betreffende beroep heeft uitgeoefend in de betrokken staat van vestiging; en

      h. een document inzake gezondheid als bedoeld in [artikel 15 van de wet][ref9] indien een dergelijk document ook
      van eigen onderdanen wordt vereist.

      2 De dienstverrichter verstrekt de in het eerste lid, onderdeel a, bedoelde verklaring een maal per jaar indien hij
      voornemens is gedurende dat jaar in Nederland diensten te verrichten. Daarbij verstrekt de dienstverrichter opnieuw
      de documenten, genoemd in het eerste lid, voor zover zich daarin een wijziging heeft voorgedaan.

      3 Indien de documenten, bedoeld in het eerste lid, onderdelen a, c, d, e, f, g en h, in een andere taal dan de
      Nederlandse taal zijn gesteld, wordt op verzoek van de minister, dan wel de door hem aangewezen instelling, bedoeld
      in [artikel 1.5a van het besluit][ref10], zo nodig een vertaling in het Nederlands overlegd die is opgesteld door
      een beëdigd vertaler. Indien de minister of de hiervoor genoemde instelling daarmee instemt, kan een vertaling
      van de documenten in een andere taal dan het Nederlands worden overlegd. Afschriften van deze documenten zijn
      gewaarmerkt.


