      1 Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref1] worden aangewezen:

      a. het drukken met behulp van een offsetpers;

      b. het dagelijks reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt bij
      offsetdruk;

      c. het niet-dagelijks reinigen van machines of machineonderdelen, gereedschappen of materialen die worden gebruikt
      bij offsetdruk.

      2 Het vochtwater dat wordt gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder a, bevat ten hoogste
      8 volumeprocenten isopropylalcohol of andere mono-alcoholen bij automatische doseersystemen en ten hoogste 10
      volumeprocenten bij handmatige doseersystemen en bij rotatie-offsetpersen die voor het eerst in gebruik zijn
      genomen vóór 1 januari 1985.

      3 Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder b, bevatten ten hoogste 0,1
      volumeprocenten gehalogeneerde koolwaterstoffen of monoaromaten met een dampspanning van meer dan 0,1 millibar bij
      20 °C en hebben een vlampunt van ten minste 55 °C.

      4 Producten die worden gebruikt bij de werkzaamheden, bedoeld in het eerste lid, onder c, bevatten ten hoogste 0,1
      volumeprocenten gehalogeneerde koolwaterstoffen of monoaromaten met een dampspanning van meer dan 0,1 millibar bij
      20 °C.


