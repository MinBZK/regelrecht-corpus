  - number: BXIIIf:7
    text: |-
      1. De certificerende instelling en haar certificatiepersoneel handelt en treedt onpartijdig en onafhankelijk op en
      heeft geen belang bij de uitslag van een examen of het verlenen van een certificaat.

      2. Het certificatiepersoneel verricht geen betaalde of onbetaalde werkzaamheden of andere activiteiten van welke
      aard dan ook, in welke hoedanigheid dan ook, in opdracht van het opleidingsinstituut van de aanvrager of in
      opdracht van een met dat opleidingsinstituut gelieerde onderneming.

      3. Ieder lid van het certificatiepersoneel tekent een integriteitsverklaring waarin de betrokkene verklaart
      onafhankelijk te zullen optreden en handelen en zich te houden aan de in verband met de examens noodzakelijke
      geheimhouding.

      4. Gezien de vereiste onafhankelijkheid van de certificerende instelling kan een aandeelhouder bij een
      certificerende instelling niet tegelijkertijd aandeelhouder zijn bij:

      a. een asbestverwijderingsbedrijf; of

      b. een opleidinginstelling die opleidt voor het certificaat DAV-1, DAV-2 of DTA.

      5. Gezien de vereiste onafhankelijkheid van de certificerende instelling kan een bestuurder bij een certificerende
      instelling niet tegelijkertijd bestuurder zijn bij een asbestverwijderingsbedrijf.

      6. De certificerende instelling beschrijft haar juridische structuur, de bestuurlijke verhoudingen, de
      eigendomsverhoudingen, de personele invulling van het management, doel en aard van de onderneming en van haar
      dienstverlening.

      7. De in het zesde lid bedoelde beschrijving wordt door alle bestuurders ondertekend.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel7
  - number: BXIIIf:8
    text: De certificerende instelling gebruikt in haar administratie uitsluitend de Nederlandse taal.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8
  - number: BXIIIf:9
    text: |-
      De certificerende instelling stelt op grond van [artikel 1.5e, eerste lid, van het besluit][ref1] een jaarverslag
      op waarin informatie wordt gegeven over de in [artikel 1.1a][ref2] van de regeling genoemde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5e
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel1.1a
