  - number: '2.3'
    text: |-
      Bij de uitvoering van de taak, bedoeld in [artikel 14, eerste lid, onderdeel c, onder 1°, van de wet][ref1] legt
      de bedrijfarts, bedoeld in [artikel 2.14a, tweede lid, van het besluit][ref2] of de arbodienst vast:

      a. op welke wijze deze taak wordt uitgevoerd en welke procedures daarbij worden gevolgd;

      b. op welke wijze de periodiciteit en de inhoud van het arbeidsgezondheidskundig onderzoek zijn geregeld;

      c. hoe met bedrijven afspraken worden gemaakt over de wijze waarop werknemers van het recht op het
      arbeidsgezondheidskundig onderzoek gebruik kunnen maken;

      d. op welke indicaties groepsgewijze arbeidsgezondheidskundige onderzoeken plaats kunnen vinden;

      e. op welke wijze wordt omgegaan met de gegevens die uit arbeidsgezondheidskundige onderzoeken voortvloeien;

      f. op welke wijze de persoonlijke levenssfeer van individuen is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.14a
