  - number: '4.13'
    text: |-
      Indien de situaties, bedoeld in de [artikelen 4.11][ref1] en [4.12][ref2], zich voordoen, wordt hiervan melding
      gedaan aan de daartoe aangewezen toezichthouder vóór de aanvang van de werkzaamheden.


