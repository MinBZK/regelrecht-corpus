      persoonscertificaat dat op grond van [artikel 20 van de wet][ref4], bedoeld in [artikel 1.1 van het besluit][ref5]
      vereist is voor de uitoefening van hetzelfde beroep.

      2 De geldigheid van het in het eerste lid bedoelde certificaat van vakbekwaamheid respectievelijk van het bewijs
      van toetsing kan worden beëindigd of beperkt naar aanleiding van controles die zijn uitgevoerd in het kader van
      toezicht.


