  - number: 4.20a
    text: |-
      1 In het kader van de beoordeling, bedoeld in [artikel 4.2, van het besluit][ref1] wordt de concentratie van
      lood in de lucht om de drie maanden gemeten. Er kan worden volstaan met eenmaal per jaar meten, indien er geen
      verandering in de werkmethoden en de omstandigheden van de blootstelling plaatsvindt, en

      a. het loodgehalte in het bloed van geen enkele werknemer, gemeten overeenkomstig artikel 4.10b van het besluit,
      meer bedraagt dan 60 µg/100 ml bloed, of

      b. uit twee opeenvolgende voorafgaande metingen is gebleken, dat de concentratie van lood in de lucht minder
      bedraagt dan 100 µg/m3 lucht of dat de omstandigheden van de blootstelling niet merkbaar variëren.

      2 De bepaling van de concentratie van lood in de lucht, als bedoeld in het eerste lid, geschiedt met behulp van de
      atomaire arbsorptiespectrometrie of een andere analysemethode, die gelijkwaardige resultaten oplevert.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.20a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: '4.2'
  - number: 4.20b
    text: |-
      1 In het kader van de beoordeling, bedoeld in [artikel 4.2 van het besluit][ref1], worden de werknemers ten minste
      tweemaal per jaar in de gelegenheid gesteld tot het meten van het loodgehalte in het bloed.

      2 De frequentie van het meten van het loodgehalte in bloed kan worden teruggebracht tot eenmaal per jaar, indien
      het loodgehalte van geen enkele werknemer meer bedraagt dan 50 µg/100 ml bloed en uit de twee opeenvolgende
      voorafgaande metingen is gebleken dat de concentratie van lood in de lucht minder bedraagt dan 100 µg/m³ lucht.

      3 Het loodgehalte in het bloed als bedoeld in [artikel 4.10b, tweede lid, van het besluit][ref2] wordt gemeten met
      behulp van de atomaire absorptiespectrometrie of een andere gelijkwaardige methode.

      4 De resultaten van de meting, bedoeld in het eerste lid, worden getoetst aan de grenswaarde, bedoeld in
      [artikel 4.19a][ref3]. De toetsing vindt plaats volgens een voor dat doel geschikte genormaliseerde methode.

      5 Het arbeidsgezondheidskundig onderzoek, bedoeld in [artikel 4.10b, eerste lid, van het besluit][ref4], wordt de
      werknemers ten minste eenmaal per jaar aangeboden.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.10b
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel4.19a
