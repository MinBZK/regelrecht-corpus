  - number: '8.1'
    text: |-
      1 Veiligheids- of gezondheidssignalering als bedoeld in [artikel 8.4 van het besluit][ref1] voldoet aan het tweede
      lid en de [artikelen 8.2 tot en met 8.29][ref2].

      2 Veiligheids- of gezondheidssignalering wordt, al naar gelang het geval, geregeld schoongemaakt, onderhouden,
      geverifieerd en gerepareerd of zo nodig vervangen, met het oog op het behoud van hun intrinsieke of functionele
      kwaliteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel8.4
