      1 In aanvulling op [artikel 4.32a, derde lid][ref1], is artikel 4.32a, tweede lid, onder b, niet van toepassing op
      het gebruik van vloercoatings op basis van methylmethacrylaat, voor zover het betreft het repareren en onderhouden
      van een bestaande vloer in een woning of een gebouw, mits de ingebruikname en volledige chemische en mechanische
      bestendigheid van die vloer noodzakelijk zijn binnen 7 dagen na het aanbrengen van de vloercoatings en dit onder de
      gegeven omstandigheden niet mogelijk is met producten als bedoeld in artikel 4.32a, zesde lid.

      2 Dit artikel vervalt met ingang van 1 augustus 2020.


