  - number: '2.2'
    text: |-
      Bij de uitvoering van de taken, bedoeld in [artikel 14, eerste lid, onder b, van de wet][ref1] ondersteunt de
      bedrijfarts, bedoeld in [artikel 2.14a, tweede lid, van het besluit][ref2] of de arbodienst de werkgever bij het
      adequaat begeleiden van werknemers die door ziekte niet in staat zijn om hun arbeid te verrichten teneinde een
      verantwoorde werkhervatting te bevorderen. Voor het uitvoeren van deze taak legt de bedrijfarts of de arbodienst
      vast:

      a. op welke wijze deze taak wordt uitgevoerd en welke procedures daarbij worden gevolgd;

      b. op welke wijze wordt omgegaan met de gegevens over het verzuim van werknemers;

      c. op welke wijze de persoonlijke levenssfeer van individuen is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.14a
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel2.2
