  - number: '5.1'
    text: |-
      Apparatuur en meubilair, in gebruik bij het verrichten van beeldschermwerk, voldoen in ieder geval aan de volgende
      voorschriften:

      a. de tekens op het beeldscherm zijn voldoende scherp, duidelijk van vorm en voldoende groot, met voldoende afstand
      tussen de tekens en de regels;

      b. het beeld op het beeldscherm is stabiel;

      c. de luminantie van of het contrast tussen de tekens en de achtergrond is gemakkelijk door de gebruiker bij te
      stellen;

      d. het beeldscherm is vrij te plaatsen en gemakkelijk verstelbaar en kantelbaar;

      e. het beeldscherm is vrij van voor de gebruiker hinderlijke glans en spiegelingen;

      f. het toetsenbord kan hellend worden geplaatst en vormt geen geheel met het beeldscherm;

      g. er is voor het toetsenbord voldoende ruimte voor handen en armen van de gebruiker;

      h. het toetsenbord heeft een mat oppervlak;

      i. de indeling van het toetsenbord en de vorm van de toetsen zijn gericht op vergemakkelijking van het gebruik;

      j. de symbolen op de toetsen zijn voldoende contrastrijk en vanuit een normale werkhouding voldoende leesbaar;

      k. de werktafel of het werkvlak maakt een comfortabele houding van de gebruiker mogelijk en heeft een reflectiearm
      oppervlak, is voldoende groot en maakt een flexibele opstelling van beeldscherm, toetsenbord, documenten en
      accessoires mogelijk;

      l. een voor het werk noodzakelijke documenthouder is stabiel en regelbaar en zodanig geplaatst dat oncomfortabele
      hoofd- en oogbewegingen tot een minimum zijn beperkt;

      m. de werkstoel is stabiel, heeft een in hoogte verstelbare zitting en een rugleuning, waarvan de hoogte en
      hellingshoek verstelbaar zijn en geeft de gebruiker bewegingsvrijheid en een comfortabele werkhouding;

      n. indien de gebruiker dat wenst wordt een voetensteun aangebracht.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel5.1
  - number: '5.2'
    text: |-
      De omgeving waarin het beeldschermwerk wordt verricht en de inrichting van de beeldschermwerkplek voldoen in ieder
      geval aan de volgende voorschriften:

      a. de verlichting van de werkruimte of de beeldschermwerkplek zorgt voor voldoende licht en een passend contrast
      tussen beeldscherm en omgeving, rekening houdende met de aard van het werk en de visuele behoeften van de
      gebruiker;

      b. mogelijke verblinding en hinderlijke reflecties op het beeldscherm of op apparaten door kunstmatige lichtbronnen
      zijn vermeden;

      c. er treden door raam- en andere openingen, wanden en apparaten geen directe verblinding en hinderlijke reflecties
      op het beeldscherm op;

      d. de ramen zijn uitgerust met passende instelbare helderheidswering om de intensiteit van het licht dat op de
      beeldschermwerkplek valt te verminderen;

      e. het geluid dat de apparatuur voortbrengt veroorzaakt geen verstoring van de aandacht en het gesproken woord;

      f. de apparatuur brengt geen voor de werknemers hinderlijke warmte voort;

      g. de vochtigheidsgraad is steeds toereikend.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel5.2
  - number: '5.3'
    text: |-
      De programmatuur die wordt gebruikt bij het verrichten van beeldschermwerk voldoet in ieder geval aan de volgende
      voorschriften:

      a. de programmatuur is aangepast aan de te verrichten taak;

      b. de programmatuur is gemakkelijk te gebruiken en aan te passen aan het kennis- en ervaringsniveau van de
      gebruiker;

      c. er wordt zonder medeweten van de gebruiker geen gebruik gemaakt van een kwantitatief of kwalitatief
      controlemechanisme;

      d. de systemen verschaffen de gebruiker gegevens over de werking ervan;

      e. de systemen maken de informatie zichtbaar in een vorm en een tempo die zijn aangepast aan de gebruiker;

      f. bij de verwerking van informatie door de gebruiker worden de beginselen van de ergonomie toegepast.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel5.3
  - number: '6.1'
    text: |-
      1 Als certificerende instelling als bedoeld in [artikel 6.14a, derde lid, van het besluit][ref1] kan worden
      aangewezen een opleidingsinstelling die een opleiding verzorgt die tot doel heeft personen op te leiden die uit
      hoofde van een bedrijf of beroep arbeidsgezondheidskundige onderzoeken als bedoeld in artikel 6.14a, eerste en
      tweede lid, van het besluit, uitvoeren of zullen gaan uitvoeren, en die voldoet aan de criteria zoals vastgelegd in
      het document, genoemd in het tweede lid.

      2 Als certificerende instelling als bedoeld in [artikel 6.16, derde, zesde of zevende lid, van het besluit][ref2],
      kan worden aangewezen een instelling die voldoet aan de criteria zoals vastgelegd in het Werkveldspecifiek document
      voor aanwijzing en toezicht op certificatie-instellingen belast met persoonscertificatie op het gebied van Werken
      onder Overdruk, document: WDAT-WOD-P, zoals opgenomen in [bijlage XVI][ref3] bij de regeling.

      3 Als certificerende instelling als bedoeld in [artikel 6.16, derde, zesde of zevende lid, van het besluit][ref4],
      is aangewezen een instelling die:

      a. op grond van een daartoe door de Minister van Veiligheid en Justitie vastgestelde regeling een examen behorend
      bij de opleiding duikploegleider, duiker of duikmedische begeleiding bij de brandweer afneemt;

      b. op grond van een daartoe door de Minister van Defensie vastgestelde regeling een opleiding duikerarts,
      duikploegleider, duiker of duikmedische begeleiding bij het Ministerie van Defensie verzorgt en de bijbehorende
      examens afneemt.


