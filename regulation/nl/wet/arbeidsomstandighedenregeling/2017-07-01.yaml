  - number: 2.0a
    text: |-
      1 De procedures voor de systematische identificatie van de ongewenste gebeurtenissen en de evaluatie van de
      risico’s van zware ongevallen, bedoeld in [artikel 2.5b, eerste lid, onder a, van het besluit](onbekend), hebben
      betrekking op:

      a. het verrichten van systematisch onderzoek naar de aan een installatie verbonden risico’s van een zwaar ongeval
      tijdens het ontwerp, de bouw, het gebruik en het onderhoud van de installatie, alsmede bij voorgenomen wijzigingen
      daarvan;

      b. de criteria voor het bepalen van de methoden voor het onderzoek als bedoeld onder a;

      c. de methode voor de evaluatie van de risico’s van zware ongevallen.

      2 De in het eerste lid, onderdeel b, bedoelde onderzoeksmethode is afgestemd op de in dat lid, onderdeel a,
      bedoelde fasen.

      3 De methode, bedoeld in het eerste lid, onderdeel c, is geschikt om vast te stellen welke maatregelen nodig zijn
      ter voorkoming van zware ongevallen of ter beperking van de gevolgen daarvan.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel2.0a
  - number: 2.0b
    text: |-
      1 De beschrijving van de scenario’s, bedoeld in [artikel 2.5b, eerste lid, onder b, van het besluit](onbekend),
      heeft betrekking op de onderdelen van installaties die de grootste risico’s van een zwaar ongeval met zich
      meebrengen. De identificatie van de betreffende onderdelen van de installaties vindt plaats op basis van een
      gedocumenteerde methode.

      2 Bij de beschrijving van de scenario’s, bedoeld in het eerste lid, wordt ten minste in aanmerking genomen welke
      van de volgende voorvallen deze scenario’s op gang kunnen brengen: corrosie, erosie, externe belasting, impact,
      overdruk, onderdruk, lage temperatuur, hoge temperatuur, trillingen, menselijke fouten tijdens gebruik, wijziging
      of onderhoud.

      3 Van elk scenario wordt aangegeven wat de waarschijnlijkheid en het effect is en welke maatregelen getroffen zijn
      om te voorkomen dat het scenario zich voordoet.

      4 Voorts wordt van elk scenario, met inachtneming van de reeds getroffen maatregelen, een samenhangend inzicht
      geboden in:

      a. de resterende kans dat een zwaar ongeval geschiedt;

      b. de ernst van de gevolgen die het ongeval in dat geval zal hebben;

      c. welke verdere maatregelen technisch mogelijk zijn om de kans op een zwaar ongeval verder te verkleinen tot een
      daarbij aan te geven niveau;

      d. een indicatie van de kosten die verbonden zouden zijn aan het treffen van de maatregelen, bedoeld in onderdeel
      c.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel2.0b
