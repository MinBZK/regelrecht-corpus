  - number: BXIIIc:20
    text: |-
      1 De entreecriteria voor de certificaathouder DAV-2 houden in dat de aanvrager:

      a. in bezit is van een DAV-certificaat dat is afgegeven voor 1 maart 2016;

      b. in het bezit is of is geweest van een DAV-2 certificaat of van een DTA-certificaat; of.

      c. in het bezit is van een DAV-1 certificaat dat geldig is op de datum waarop het examen wordt afgelegd of op dat
      tijdstip niet langer dan drie maanden verlopen is, waarbij de aanvrager het praktijkservaringsdeel in een bedrijf
      met het procescertificaat asbestverwijdering heeft uitgevoerd en dit aantoonbaar is:

      1°. door middel van tijdens de asbestverwijderingswerkzaamheden verkregen logboekregistraties van ten minste
      120 pakuren, waarvan ten minste 30 in containment, gewerkt in ten minste 40 dagen, waarin ten minste 1 pakuur is
      gewerkt; en

      2°. door een volledig ingevulde DAV-1 opdrachtenset.

      2 In aanvulling op het eerste lid geldt dat de aanvrager:

      a. aantoonbaar minder dan twaalf maanden voor het afleggen van het examen een facefit-test heeft uitgevoerd;

      b. beschikt over een masker van het juiste model en de goede maat; en

      c. deel 2 van het online-instructieprogramma adembescherming heeft afgerond en dat kan aantonen.

      3 In aanvulling op het eerste en tweede lid geldt als entreecriterium dat in de voorgaande twaalf maanden geen
      certificaat DAV-1, DAV-2 of DTA van de aanvrager is ingetrokken.
