    text: |-
      1 De arbodienst meldt een wijziging van zijn organisatievorm terstond aan de minister of, indien de minister een
      certificerende instelling heeft aangewezen, aan de certificerende instelling, bedoeld in [artikel 2.7][ref1].

      2 Indien zich een wijziging voordoet in de gegevens, bedoeld in de
      [artikelen 2.12, eerste lid, onder a of b][ref2], of [2.13, eerste lid, onder a][ref3], meldt de arbodienst
      onderscheidenlijk de werkgever dit zo spoedig mogelijk aan de minister of, indien de minister een certificerende
      instelling heeft aangewezen, aan de certificerende instelling, bedoeld in het eerste lid.


