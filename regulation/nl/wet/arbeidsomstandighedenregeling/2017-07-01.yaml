        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '4.7'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0008587
        artikel: '4.1'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.9'
    text: |-
      1 Het onderhouden, verbouwen, herstellen en slopen van K1-, K3-, KT- of T-schepen vindt slechts plaats nadat een
      onderzoek, uitgevoerd overeenkomstig de bij [artikel 4.10][ref1] gestelde regels heeft plaatsgevonden en in verband
      met dit onderzoek een volledig en correct ingevulde veiligheids- en gezondheidsverklaring is uitgereikt aan de
      werkgever die de onderhouds-, herstellings-, verbouwings-, of sloopwerkzaamheden zal uitvoeren.

      2 Het onderhouden, verbouwen, herstellen en slopen van K1-, K3-, KT- of T-schepen vindt voorts slechts plaats voor
      zover die werkzaamheden en de ruimten waarin deze worden uitgevoerd, zijn vermeld in de in het eerste lid bedoelde
      veiligheids- en gezondheidsverklaring als zijnde toegestaan.

      3 Een veiligheids- en gezondheidsverklaring als bedoeld in het eerste lid wordt bij een gasdeskundige aangevraagd.

      4 Bij de aanvraag worden alle inlichtingen verstrekt, welke met het oog op de afgifte van de veiligheids- en
      gezondheidsverklaring van belang zijn, terwijl desverlangd nadere inlichtingen ter zake worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4.10
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '4.10'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '4.10'
    text: |-
      1 Het in [artikel 4.9][ref1] bedoelde onderzoek wordt ingesteld door de gasdeskundige, die de uitslag van dat
      onderzoek vermeldt op de door hem uit te reiken veiligheids- en gezondheidsverklaring.

      2 De gasdeskundige strekt dit onderzoek uit over alle ruimten ten aanzien waarvan hij dit in verband met de aard
      van de te verrichten werkzaamheden noodzakelijk acht. Bij het onderzoek betrekt de gasdeskundige zo nodig een
      goed geoutilleerd laboratorium. Hij maakt gebruik van deugdelijke, in goede staat verkerende meet- en andere
      hulpapparatuur.

      3 Hij stelt vast of de te onderzoeken ruimten:

      a. K1-, KT-, K3- of T-ruimten zijn;

      b. veilig voor mensen zijn in die zin, dat:

      1º. werknemers die ruimten zonder gebruik van persoonlijke beschermingsmiddelen kunnen betreden, en

      2º. geen gevaar voor bedwelming, verstikking, vergiftiging of letsel bestaat, met dien verstande dat een ruimte ten
      aanzien waarvan het voorgaande niet is gebleken, op de veiligheids- en gezondheidsverklaring wordt aangeduid als
      “niet veilig voor mensen”;

      c. veilig voor vuur zijn in die zin, dat:

      1º. de resten van brandbare vloeistoffen daaruit zijn verwijderd zodat geen gevaar bestaat voor brand;

      2º. eventueel nog aanwezige brandbare gassen of dampen nergens een concentratie in de lucht vormen, welke hoger
      ligt dan 20% van de onderste explosiegrens;

      3º. de aangrenzende ruimten hetzij voldoen aan het onder 1° en 2° gestelde, hetzij tot de top zijn gevuld met water
      waarop zich geen K0-, K1-, K2- of KT-vloeistoffen bevinden, hetzij op andere wijze brand- en explosie-veilig zijn
      gemaakt,

      met dien verstande, dat een ruimte ten aanzien waarvan het voorgaande niet is gebleken, op de veiligheids- en
      gezondheidsverklaring wordt aangeduid als “niet veilig voor vuur”.

      4 De gasdeskundige reikt een veiligheids- en gezondheidsverklaring uit, indien hij heeft vastgesteld, dat:

      a. de ruimten waarin koud werk moet worden verricht, veilig voor mensen zijn;

      b. de ruimten waarin werk met vuur moet worden verricht, zowel veilig voor mensen als veilig voor vuur zijn;

      c. de toestand waarin andere dan de onder a en b bedoelde ruimten zich bevinden en de wijze waarop zij zijn
      afgesloten, zodanig zijn dat de in de verklaring aangewezen werkzaamheden zonder gevaar voor de veiligheid en
      gezondheid van de werknemers uitgevoerd kunnen worden.

      5 Hij reikt een veiligheids- en gezondheidsverklaring voor het verrichten van werk met vuur in een deel van de
      ladingzone van K1- en KT-schepen slechts uit, indien hem ten minste zes uren na de in het vierde lid bedoelde
      vaststelling uit een doeltreffend onderzoek is gebleken, dat de in dat lid vermelde ruimten nog steeds voldoen aan
      de daarbij gestelde eisen.

      6 In afwijking van het vierde lid reikt hij een veiligheids- en gezondheidsverklaring voor het verrichten van werk
      met vuur in de ladingzone van K1- en KT-schepen slechts uit, indien hij heeft vastgesteld, dat:

      a. de gehele ladingzone veilig voor mensen als bedoeld in het derde lid, onder b, en veilig voor vuur als bedoeld
      in het derde lid, onder c, is, en

      b. de toestand waarin andere dan de onder a bedoelde ruimten zich bevinden en de wijze waarop zij zijn afgesloten,
      zodanig zijn dat de in de veiligheids- en gezondheidsverklaring aangewezen werkzaamheden veilig uitgevoerd kunnen
      worden en indien hem ten minste zes uren na die vaststelling uit een doeltreffend onderzoek is gebleken, dat geen
      wijziging heeft plaatsgevonden in de onder a en b bedoelde toestand.

      7 Een veiligheids- en gezondheidsverklaring is niet van toepassing op leidingen in of buiten het tankschip en
      is alleen geldig als zij volledig en juist is ingevuld en zolang de toestand op grond waarvan de verklaring is
      verleend ongewijzigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4.9
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.10
