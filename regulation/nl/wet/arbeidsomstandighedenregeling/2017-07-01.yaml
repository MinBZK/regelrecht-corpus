  - number: 1.9c
    text: |-
      1 Voorafgaand aan de eerste dienstverrichting controleert de minister of, indien de minister een certificerende
      instelling als bedoeld in [artikel 1.5a van het besluit][ref1], heeft aangewezen, die instelling, op grond van
      [artikel 27 van de wet][ref2] de beroepskwalificaties van de dienstverrichter, bedoeld in [artikel 1.9b][ref3].

      2 In aanvulling op de documenten, genoemd in [artikel 1.9b, eerste lid][ref4], verstrekt de dienstverrichter de
      minister of, indien de minister een certificerende instelling als bedoeld in [artikel 1.5a van het besluit][ref5],
      heeft aangewezen, die instelling, desgevraagd, met inachtneming van het bepaalde in artikel 1.9b, derde lid, de
      volgende documenten:

      a. het programma van de opleiding tot het desbetreffende beroep, onderverdeeld in theorie en praktijkvakken, met
      opgave van de duur van het onderwijs in die vakken, afkomstig van de instelling waarbij de dienstverrichter de
      opleidingstitel heeft behaald;

      b. cijferlijsten en beoordelingen van studieresultaten, praktijkperiode of stages van de dienstverrichter; en

      c. bewijsstukken van eventuele beroepservaring en aanvullend onderwijs.

      3 De minister of, indien de minister een certificerende instelling als bedoeld in
      [artikel 1.5a van het besluit][ref6], heeft aangewezen, die instelling, beslist met inachtneming van de termijnen,
      genoemd in [artikel 28 van de wet][ref7].

      4 In geval van constatering van wezenlijke verschillen als bedoeld in [artikel 27, derde lid, van de wet][ref8],
      biedt de minister of, indien de minister een certificerende instelling als bedoeld in
      [artikel 1.5a van het besluit][ref9], heeft aangewezen, die instelling, de dienstverrichter de mogelijkheid
      om door middel van een proeve van bekwaamheid, bedoeld in [artikel 1.9d][ref10], aan te tonen dat hij over de
      ontbrekende kennis, vaardigheden of competenties beschikt.

      5 De dienstverrichter ontvangt van de minister of, indien de minister een certificerende instelling als bedoeld in
      [artikel 1.5a, van het besluit][ref11] heeft aangewezen, die instelling, een schriftelijke verklaring in de vorm
      van een bewijs van toetsing indien op grond van de controle de beroepskwalificaties voldoende zijn voor tijdelijke
      en incidentele dienstverrichting in Nederland.


