  - number: '9.3'
    text: |-
      De aanvulling van het veiligheids- en gezondheidszorgsysteem, bedoeld in [artikel 3.16][ref1], de aanvulling van
      het veiligheids- en gezondheidsbeleid en -document, bedoeld in[ artikel 3.17][ref2], de aanvulling van de risico-
      inventarisatie en -evaluatie, bedoeld in de [artikelen 3.18][ref3] en [3.19][ref4], en de aanvulling van het
      noodplan, bedoeld in [artikel 3.20][ref5], worden door de werkgever vastgelegd en aan de toezichthouder gezonden:

      a. voor installaties die bestaan op de dag voorafgaand aan de dag van inwerkingtreding, bedoeld in artikel II:
      uiterlijk 19 juli 2018;

      b. voor installaties anders dan bedoeld in onderdeel a: voor de aanvang van de werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel3.16
