      2 Een certificaat als bedoeld in [artikel 6.16, zesde lid, van het besluit][ref4], wordt door de certificerende
      instelling, bedoeld in [artikel 6.1, derde lid][ref5], afgegeven indien de aanvrager, zijnde brandweerduiker,
      voldoet aan de criteria zoals vastgelegd in het Werkveldspecifiek certificatieschema voor het persoonscertificaat
      duikarbeid verricht door de brandweer, document: WSCS-WOD-E, zoals opgenomen in [bijlage XVIf][ref6] bij de
      regeling.


