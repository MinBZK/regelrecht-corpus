  - number: '9.5'
    text: |-
      Deze regeling wordt aangehaald als: Arbeidsomstandighedenregeling.

      Deze regeling zal met de toelichting en de bijlagen in de Staatscourant worden gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel9.5
  - number: BXIIIc:1
    text: |-
      In deze bijlage wordt verstaan onder:

        - *Aanvrager:* een persoon die bij een certificerende instelling een aanvraag doet voor het afgeven van een
      certificaat van vakbekwaamheid;
        - *Beheerstichting:* Stichting Ascert, zijnde de beheerstichting, bedoeld in
      [artikel 1.5a, eerste lid, onderdeel f, van het besluit][ref1];
        - *Certificaat of persoonscertificaat:* een certificaat als bedoeld in [artikel 20, eerste lid, van de wet][ref2];
        - *Certificaatregister:* het register dat door de beheerstichting wordt beheerd op basis van de gegevens die de
      certificerende instellingen vastleggen op grond van [artikel 1.5a, eerste lid, onderdeel d, van het besluit][ref3];
        - *Certificerende instelling procescertificatie:* een certificerende instelling als bedoeld in
      [artikel 4.27, onderdeel b][ref4], van de Arbeidsomstandighedenregeling;
        - *DAV-1:* persoon die in het bezit is van een persoonscertificaat deskundig asbestverwijderaar niveau 1;
        - *DAV-2:* persoon die in het bezit is van een persoonscertificaat deskundig asbestverwijderaar niveau 2;
        - *DTA:* persoon die in het bezit is van een persoonscertificaat deskundig toezichthouder asbestverwijdering;
        - *Eindtermen:* een omschrijving van het geheel aan kennis, ervaring, attitude en praktische vaardigheden van een
      specifiek vakbekwaamheidgebied ten behoeve van het toetsen van een aanvrager;
        - *Entreecriteria:* criteria, zoals opleiding en werkervaring, waaraan de aanvrager voldoet om toegelaten te worden
      tot de certificatieprocedure;
        - *Fatale fout:* een handeling tijdens het praktijkexamen die kan leiden tot blootstelling aan asbest en daardoor
      gevaar kan opleveren voor de kandidaat of de omgeving;
        - *Itembank:* een door de beheerstichting beheerd totaalbestand van vragen en opdrachten ten behoeve van het
      examen;
        - *NEN-EN-ISO/IEC 17024:* algemene eisen voor instellingen die certificatie van personen uitvoeren, uitgegeven door
      het Nederlands Normalisatie-instituut, zoals deze luidden in 2012;
        - *Risicoklasse 1:* wanneer sprake is van de concentraties asbestvezels als omschreven in de [artikelen 4.44][ref5]
      en [4.46 van het besluit][ref6];
        - *Risicoklasse 2:* wanneer sprake is van de concentraties asbestvezels als omschreven in de [artikelen 4.46][ref7]
      en [4.48 van het besluit][ref8];
        - *Risicoklasse 2A:* wanneer sprake is van de concentraties asbestvezels als omschreven in de
      [artikelen 4.46][ref9] en [4.53a van het besluit][ref10];
        - *Toetsterm:* een omschrijving van een eindterm of een element van een eindterm in de vorm van een kennisaspect,
      een vaardigheid of de attitude zodanig dat deze toetsbaar is.


