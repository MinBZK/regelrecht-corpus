  - number: '3.11'
    text: |-
      1 Het voorontwerprapport, bedoeld in [artikel 3.8, eerste lid, onder a][ref1],
      wordt voorafgaand aan de aanvraag om een omgevingsvergunning als bedoeld in
      [artikel 2.1, eerste lid, aanhef en onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] en de aanvraag
      om een vergunning als bedoeld in [artikel 40 van de Mijnbouwwet][ref3], in tweevoud toegezonden aan een daartoe
      aangewezen toezichthouder.

      2 Het gedetailleerd ontwerp, opstarten en gebruik, bedoeld in [artikel 3.8, eerste en tweede lid][ref4], wordt
      twaalf weken voor het in gebruik nemen van een mijnbouwwerk in tweevoud toegezonden aan een daartoe aangewezen
      toezichthouder.

      3 Het addendum gebruik, bedoeld in [artikel 3.8, eerste en tweede lid][ref5], wordt voor de eerste maal vijf jaar
      na toezending van het gedetailleerd ontwerp, opstarten en gebruik en vervolgens eenmaal in de vijf jaar in tweevoud
      toegezonden aan een daartoe aangewezen toezichthouder.

      4 Het addendum verlaten en verwijderen, bedoeld in [artikel 3.8, eerste lid][ref6], wordt twaalf weken voor
      het verlaten van een mijnbouwwerk of het verwijderen van een vast opgestelde mijnbouwinstallatie in tweevoud
      toegezonden aan een daartoe aangewezen toezichthouder.

      5 De informatie, bedoeld in [artikel 3.9, onderdeel c][ref7], wordt op verzoek van een daartoe aangewezen
      toezichthouder in tweevoud aan hem toegezonden.


