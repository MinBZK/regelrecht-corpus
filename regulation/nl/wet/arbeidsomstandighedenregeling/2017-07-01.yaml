  - number: '8.16'
    text: |-
      Rekening houdend met de gebruiksomstandigheden veroorzaakt het door een signaal uitgezonden licht een aan de
      omgeving aangepast lichtcontrast dat niet tot verblinding mag leiden maar voldoende zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.16
  - number: '8.17'
    text: |-
      1 Het lichtoppervlak dat een signaal uitzendt, is uniform van kleur of bevat een pictogram op een bepaalde
      achtergrond.

      2 De uniforme kleur voldoet aan [artikel 8.5][ref1].

      3 Wanneer het signaal een pictogram bevat, voldoet dit aan [artikel 8.10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel8.5
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel8.10
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.17
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '8.5'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0008587
        artikel: '8.10'
        hoofdstuk: '8'
  - number: '8.18'
    text: |-
      1 Wanneer een voorziening een continu en een intermitterend signaal kan uitzenden, wordt het intermitterende
      signaal gebruikt om ten opzichte van het continue signaal aan te geven dat het gaat om een situatie die een groter
      gevaar inhoudt of waarbij de gewenste of verplichte interventie of actie met grotere spoed moet worden uitgevoerd.

      2 Wanneer een intermitterend lichtsignaal wordt gebruikt in plaats of ter completering van een geluidssignaal, is
      de code van het signaal identiek.

      3 Een voorziening om een lichtsignaal uit te zenden in geval van groot gevaar, wordt speciaal in het oog gehouden
      of uitgerust met een reservelamp.

      4 De duur en de frequentie van de flitsen van een intermitterend lichtsignaal zijn zodanig dat:

      a. de boodschap van het signaal goed wordt begrepen, en

      b. er voorkomen wordt dat verwarring ontstaat tussen verschillende lichtsignalen of tussen een continu en een
      intermitterend lichtsignaal.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.18
  - number: '8.19'
    text: |-
      1 Een geluidssignaal:

      a. heeft een geluidsniveau dat duidelijk hoger is dan het niveau van het omgevingslawaai, zodat het goed hoorbaar
      is, doch niet te luid of pijnlijk voor de oren;

      b. is gemakkelijk herkenbaar;

      c. is gemakkelijk te onderscheiden van een ander geluidssignaal en andere omgevingsgeluiden.

      2 Wanneer een voorziening een geluidssignaal met een variabele en een vaste frequentie kan uitzenden, wordt de
      variabele frequentie gebruikt om ten opzichte van de vaste frequentie aan te geven dat het gaat om een situatie die
      een groter gevaar inhoudt of waarbij de gewenste of verplichte interventie of actie met grotere spoed moet worden
      uitgevoerd.

      3 Het geluid van een ontruimingssignaal is continu.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.19
  - number: '8.20'
    text: |-
      1 De mondelinge mededeling vindt plaats tussen een spreker of zender en een of meer toehoorders, en wel in de vorm
      van korte teksten, woordgroepen of afzonderlijke woorden, eventueel gecodeerd.

      2 De mondelinge boodschappen zijn zo kort, eenvoudig en duidelijk mogelijk.

      3 De taalvaardigheid van de spreker en het gehoorvermogen van de toehoorder zijn voldoende om een ondubbelzinnige
      communicatie tot stand te brengen.

      4 De mondelinge mededeling is direct door middel van gebruik van de menselijke stem of indirect door middel van de
      menselijke stem of spraaksynthese, verspreid door een middel ad hoc.

      5 Indien de mondelinge mededeling wordt gebruikt in plaats van of ter aanvulling van hand- of armseinen en er geen
      codes worden gebruikt, worden met name de volgende woorden gebruikt:

      a. start, om het begin van een commando aan te duiden;

      b. stop, om een beweging te onderbreken of te beëindigen;

      c. einde, om de werkzaamheden stop te zetten;

      d. hijsen, om een last te doen hijsen;

      e. vieren, om een last te doen vieren;

      f. vooruit, achteruit, naar rechts, naar links, in combinatie met het juiste hand- of armsein, om een beweging in
      een bepaalde richting te doen plaatsvinden;

      g. gevaar, om een noodstop af te dwingen;

      h. snel, om een beweging te versnellen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.20
  - number: '8.21'
    text: |-
      De betrokken personen kennen de gebruikte taal zodanig dat zij de boodschap correct kunnen uitspreken en begrijpen
      en zich al naar gelang van de boodschap op passende wijze kunnen gedragen op het vlak van de veiligheid of de
      gezondheid.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.21
  - number: '8.22'
    text: |-
      1 Een hand- of armsein is precies en eenvoudig en bestaat uit een breed gebaar.

      2 Het gelijktijdig gebruik van beide armen verloopt symmetrisch en geeft slechts één enkel signaal weer.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.22
  - number: '8.23'
    text: |-
      1 De seingever geeft met behulp van hand- en armseinen besturingsinstructies door aan de ontvanger van de seinen.

      2 De seingever wijdt zijn aandacht uitsluitend aan het geven van de besturingsinstructies en de veiligheid van de
      werknemers die zich in de nabijheid bevinden.

      3 De seingever kan de gehele besturingsoperatie zien, zonder daarbij door de handeling gehinderd te worden.

      4 Wanneer niet aan de in het derde lid, genoemde voorwaarden kan worden voldaan, worden een of meer bijkomende
      seingevers ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.23
  - number: '8.24'
    text: |-
      De ontvanger van de seinen zet de in uitvoering zijnde transportbeweging stil om nieuwe instructies te vragen,
      wanneer hij de ontvangen orders niet met de nodige veiligheidsgaranties kan uitvoeren.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.24
  - number: '8.25'
    text: De seingever is makkelijk herkenbaar voor de ontvanger van de seinen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.25
  - number: '8.26'
    text: |-
      De in [bijlage XIX][ref1] bij deze regeling opgenomen hand- en armseinen, worden gebruikt in de daarbij vermelde
      situaties, waarbij deze geen afbreuk doen aan het gebruik van andere van toepassing zijnde codes, met name in
      bepaalde bedrijvigheidssectoren, waarmee dezelfde handelingen worden aangeduid.


      [ref1]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.26
    references:
      - id: ref1
        bwb_id: BWBR0008587
  - number: '8.27'
    text: |-
      1 De signalering van gevaar door stoten tegen obstakels, door vallende voorwerpen of personen, geschiedt door
      middel van geel, afgewisseld met zwart, of rood afgewisseld met wit, binnen de bebouwde zones van het bedrijf of de
      inrichting waartoe de werknemer in het kader van zijn werk toegang heeft.

      2 De gele en zwarte of rode en witte banden worden onder een hoek van circa 45° aangebracht en hebben ongeveer
      dezelfde afmetingen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.27
  - number: '8.28'
    text: |-
      De afmetingen van de signalering houden rekening met de afmeting van het gesignaleerde obstakel of de gesignaleerde
      gevaarlijke plaats.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.28
  - number: '8.29'
    text: |-
      1 Wanneer de bescherming van de werknemers dat vereist, worden de verkeerswegen op de arbeidsplaats voor voertuigen
      duidelijk door doorlopende strepen met een goed zichtbare kleur aangegeven.

      2 Bij het aanbrengen van de strepen wordt rekening gehouden met de nodige veiligheidsafstanden tussen de voertuigen
      die er kunnen rijden en elk voorwerp dat zich in de nabijheid en tussen de voetgangers en de voertuigen kan
      bevinden.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.29
  - number: 8.29a
    text: |-
      Als overtreding ter zake waarvan een bestuurlijke boete kan worden opgelegd, wordt aangemerkt het handelen of het
      nalaten in strijd met de voorschriften welke zijn opgenomen in de [artikelen 3.4][ref1], [3.5][ref2], [3.11][ref3],
      [3.12][ref4], [3.13][ref5], [3.14][ref6], [4.3 tot en met 4.7][ref7], [4.9][ref8], [4.11 tot en met 4.13][ref9],
      [4.15][ref10], [4.18][ref11], [4.19, tweede lid][ref12], [4.20, tweede lid][ref13], [4.20a][ref14],
      [4.20b, eerste, derde, vierde en vijfde lid][ref15], [4.22 tot en met 4.26][ref16], [5.1 tot en met 5.3][ref17],
      [8.1, tweede lid][ref18], [8.2][ref19], [8.3][ref20], [8.4, derde lid][ref21], [8.5 tot en met 8.11][ref22],
      [8.12, eerste en tweede lid][ref23], en [8.13 tot en met 8.29][ref24].


