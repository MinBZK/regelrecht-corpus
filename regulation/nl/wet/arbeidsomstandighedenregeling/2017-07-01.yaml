  - number: 9.2a
    text: |-
      De afgifte van een certificaat van vakbekwaamheid arbeidshygiëne door de Stichting voor de Certificatie van
      Vakbekwaamheid SKO in de periode van 1 november 1999 tot 3 november 2006 wordt aangemerkt als de afgifte van een
      certificaat van vakbekwaamheid arbeidshygiëne als bedoeld in [artikel 2.15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel2.15
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel9.2a
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '2.15'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 9.2b
    text: |-
      De in [artikel 6.5, eerste lid, onderdeel a][ref1], opgenomen eis geldt niet indien de aanvrager voor 1 januari
      2003 al werkzaam was als duikerarts en in de periode van een jaar voor de eerste afgifte van het certificaat
      duikerarts aan hem, ten minste 10 personen belast met het verrichten van duikarbeid heeft gekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel6.5
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel9.2b
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '6.5'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 9.2c
    text: |-
      1 Het werkveld dienstverlening door arbodiensten wordt aangewezen als werkveld als bedoeld in
      [artikel 1.5b, vijfde lid, van het besluit][ref1] met dien verstande dat voor de aanvraag tot aanwijzing,
      bedoeld in artikel 1.5b, tweede lid, van het besluit, kan worden uitgegaan van een beoordeling die de Nederlandse
      Organisatie voor toegepast-natuurwetenschappelijk onderzoek TNO te Delft heeft verricht en waaruit is gebleken dat
      de instelling voldoet aan de criteria, genoemd in [artikel 1.5a van het besluit][ref2], mits:

      a. wanneer die beoordeling in 2015 is vastgesteld, de aanwijzing uiterlijk met ingang van 1 december 2017 eindigt;

      b. wanneer die beoordeling in de periode van 1 juli 2017 tot en met 30 juni 2018 wordt vastgesteld, de aanvraag
      wordt vergezeld van die beoordeling en de aanwijzing uiterlijk met ingang van 1 januari 2020 eindigt.

      2 Dit artikel vervalt met ingang van 1 januari 2020.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5b
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5a
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel9.2c
    references:
