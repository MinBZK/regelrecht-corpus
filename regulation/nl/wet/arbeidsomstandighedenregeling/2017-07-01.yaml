        bwb_id: BWBR0008587
        artikel: '8.11'
        hoofdstuk: '8'
  - number: '8.3'
    text: |-
      1 De signalering van gevaarlijke gebeurtenissen, de oproep van personen voor een specifieke actie, alsmede de
      dringende evacuatie van personen geschiedt occasioneel, door middel van een lichtsignaal, een akoestisch signaal of
      een mondelinge mededeling.

      2 Het leiden van personen die handelingen verrichten waarbij een gevaar bestaat, geschiedt occasioneel door middel
      van hand- of armseinen of mondelinge mededelingen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.3
  - number: '8.4'
    text: |-
      1 Bij gelijke doeltreffendheid van de signalering bestaat een vrije keuze tussen:

      a. de lichtsignalen, de akoestische signalen of de mondelinge mededeling;

      b. het hand- of armsein of de mondelinge mededeling;

      c. een veiligheidskleur of een bord voor het signaleren van gevaar van struikelen, of vallen door hoogteverschil.

      2 De volgende signaleringswijzen kunnen gelijktijdig worden gebruikt:

      a. het lichtsignaal en het akoestisch signaal;

      b. het lichtsignaal en de mondelinge mededeling;

      c. het hand- of armsein en de mondelinge mededeling.

      3 De doeltreffendheid van een signalering mag niet in het gedrang worden gebracht door de aanwezigheid van
      een andere signalering of van andere factoren die de zicht- of hoorbaarheid verstoren, een slecht ontwerp, een
      ontoereikend aantal, een slechte plaatsing, een slechte staat of een slechte werking van de signaleringsmiddelen
      of signaleringsvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.4
  - number: '8.5'
    text: |-
      Voor zover signalering geschiedt door middel van een veiligheidskleur wordt:

      a. met de kleur rood aangeduid:

      1°. een verbodssignaal;

      2°. gevaar of alarm;

      3°. identificatie en lokalisatie van brandbestrijdingsmateriaal en brandweeruitrusting;

      b. met de kleur geel of oranje-geel aangeduid een waarschuwingssignaal;

      c. met de kleur blauw aangeduid een gebodssignaal;

      d. met de kleur groen aangeduid:

      1°. een reddingssignaal of een eerste hulp-signaal;

      2°. een veilige situatie.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.5
  - number: '8.6'
    text: |-
      Signaleringen die een energiebron behoeven, zijn voorzien van een noodinstallatie voor het geval dat deze
      energiebron uitvalt, behalve indien het te signaleren gevaar ophoudt te bestaan bij het uitvallen van de energie.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.6
  - number: '8.7'
    text: |-
      1 De licht- en geluidssignalen zijn voor de ingebruikneming op hun goede werking en reële doeltreffendheid
      gecontroleerd. Die controle wordt nadien voldoende vaak herhaald.

      2 Een licht- of geluidssignaal geeft bij inwerkingstelling het begin van een actie aan: de duur ervan is zo lang
      als de actie vereist.

      3 De licht- en geluidssignalen worden na ieder gebruik onmiddellijk opnieuw in werking gesteld.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.7
  - number: '8.8'
    text: |-
      Indien de betrokken werknemers een beperkt gehoor- of gezichtsvermogen hebben, onder meer door het dragen van
      individuele beschermende uitrusting, dienen adequate aanvullende maatregelen of vervangingsmaatregelen te worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.8
  - number: '8.9'
    text: |-
      1 De pictogrammen waarvan veiligheidsborden zijn voorzien, zijn zo eenvoudig mogelijk en voor het begrip overbodige
      details worden weggelaten.

      2 De borden zijn gemaakt van materiaal met een zo groot mogelijke schokvastheid en weerbestendigheid.

      3 De borden bezitten dusdanige afmetingen en kleur- en lichttechnische eigenschappen dat zij goed zichtbaar en
      gemakkelijk te begrijpen zijn.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.9
  - number: '8.10'
    text: |-
      1 Verbodsborden kenmerken zich door een ronde vorm, een zwart pictogram op witte achtergrond, rode rand en balk die
      van links naar rechts over het pictogram loopt onder een hoek van 45° ten opzichte van de horizontale lijn, waarbij
      de rode kleur ten minste 35% van het oppervlak van het bord beslaat.

      2 Waarschuwingsborden kenmerken zich door een driehoekige vorm, een zwart pictogram op gele achtergrond en een
      zwarte rand, waarbij de gele kleur ten minste 50% van het oppervlak van het bord beslaat.

      3 Gebodsborden kenmerken zich door een ronde vorm, een wit pictogram op blauwe achtergrond, waarbij de blauwe kleur
      ten minste 50% van het oppervlak van het bord beslaat.

      4 Reddingsborden kenmerken zich door een rechthoekige of vierkante vorm, wit pictogram op groene achtergrond,
      waarbij de groene kleur ten minste 50% van het oppervlak van het bord beslaat.

      5 Borden in verband met het brandbestrijdingsmateriaal kenmerken zich door een rechthoekige of vierkante vorm en
      een wit pictogram op rode achtergrond, waarbij de rode kleur ten minste 50% van het oppervlak van het bord beslaat.

      6 De in [bijlage XVIII][ref1] bij deze regeling opgenomen borden, worden gebruikt in de daarbij vermelde situaties.

      7 De gebruikte pictogrammen mogen licht afwijken van of meer gedetailleerd zijn dan de pictogrammen van de borden,
      bedoeld in [bijlage XVIII][ref2] bij deze regeling. De betekenis ervan is dan evenwel dezelfde en verschillen of
      aanpassingen maken de betekenis niet onduidelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0008587
      [ref2]: https://wetten.overheid.nl/BWBR0008587
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.10
    references:
      - id: ref1
        bwb_id: BWBR0008587
      - id: ref2
        bwb_id: BWBR0008587
  - number: '8.11'
    text: |-
      1 De borden worden, rekening houdend met eventuele obstakels, op passende hoogte en op een passende plaats ten
      opzichte van het gezichtsveld geïnstalleerd, hetzij bij de toegang tot een zone waar een algemeen risico bestaat
      hetzij in de onmiddellijke nabijheid van een bepaald risico of het te signaleren object, en wel op een goed
      verlichte en gemakkelijk toegankelijke en zichtbare plaats.

      2 Bij slechte natuurlijke verlichtingsomstandigheden worden fluorescerende kleuren, reflecterende materialen of
      kunstlicht gebruikt.

      3 Een bord wordt verwijderd zodra de situatie die de aanwezigheid ervan rechtvaardigt, niet meer bestaat.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.11
  - number: '8.12'
    text: |-
      1 Reservoirs die worden gebruikt bij werkzaamheden met dan wel de opslag van chemische stoffen of mengsels die
      overeenkomstig EG-verordening indeling, etikettering en verpakking van stoffen en mengsels als gevaarlijk worden
      ingedeeld op grond van de criteria voor enige fysische gevarenklasse of gezondheidsgevarenklasse, alsmede leidingen
      die dergelijke stoffen en mengsels bevatten of waardoor deze stoffen en mengsels worden getransporteerd, worden
      overeenkomstig die verordening voorzien van de relevante gevarenpictogrammen.

      2 Het vorige lid is niet van toepassing op reservoirs die worden gebruikt bij werkzaamheden van korte duur of die
      vaak wisselen van inhoud mits er toereikende alternatieve maatregelen worden genomen, met name op het gebied van
      voorlichting of opleiding, die hetzelfde beschermingsniveau garanderen.

      3 De in het eerste lid bedoelde gevarenpictogrammen kunnen:

      a. worden vervangen door waarschuwingsborden als weergegeven in artikel 8.10 met hetzelfde pictogram of symbool met
      dien verstande dat indien artikel 8.10 geen gelijkwaardig waarschuwingsbord bevat, het relevante gevarenpictogram
      als weergegeven in bijlage V van EG-verordening indeling, etikettering en verpakking van stoffen en mengsels wordt
      gebruikt;

      b. worden aangevuld met extra informatie zoals de naam of de formule van de gevaarlijke stof en een gedetailleerde
      beschrijving van het gevaar;

      c. voor het transport van reservoirs op de arbeidsplaats worden aangevuld met of vervangen door borden die
      krachtens de Wet vervoer gevaarlijke stoffen of de Wet luchtvaart van toepassing zijn voor het transport van
      gevaarlijke stoffen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.12
  - number: '8.13'
    text: |-
      De signalering bedoeld in [artikel 8.12][ref1] wordt aangebracht op de zichtbare zijden in de vorm van hard
      materiaal, zelfklevend materiaal of verf.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel8.12
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.13
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '8.12'
        hoofdstuk: '8'
  - number: '8.14'
    text: |-
      De op leidingen gebruikte gevarenpictogrammen of signaalwoorden worden zichtbaar en voldoende herhaald aangebracht
      in de nabijheid van de meest gevaarlijke plaatsen, zoals kleppen en aansluitingspunten.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.14
  - number: '8.15'
    text: |-
      1 De signalering van plaatsen, lokalen of afgesloten ruimten die worden gebruikt voor de opslag van aanzienlijke
      hoeveelheden gevaarlijke stoffen geschiedt door een passend waarschuwingsbord als bedoeld in [artikel 8.10][ref1]
      of door gevarenpictogrammen en signaalwoorden als bedoeld in [artikel 8.12][ref2] tenzij, rekening houdend
      met [artikel 8.9, derde lid][ref3], wat de afmeting betreft, de gevarenpictogrammen en signaalwoorden van de
      afzonderlijke verpakkingen of op de reservoirs ter zake volstaan.

      2 De in het eerste lid bedoelde borden of gevarenpictogrammen en signaalwoorden worden bij de opslagruimte of op de
      toegangsdeur tot de opslagruimte geplaatst.

      3 Indien [artikel 8.10][ref4] geen gelijkwaardig waarschuwingsbord bevat, wordt het relevante gevarenpictogram als
      weergegeven in bijlage V van EG-verordening indeling, etikettering en verpakking van stoffen en mengsels gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel8.10
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel8.12
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel8.9
      [ref4]: https://wetten.overheid.nl/BWBR0008587#Artikel8.10
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel8.15
