  - number: BXIIIf:2
    text: |-
      Het beoordelen en aanwijzen van certificerende instellingen vindt plaats op basis van de normen gesteld in NEN-EN-
      ISO/IEC 17024 en de criteria, bedoeld in artikel 3, die gesteld worden aan de certificerende instelling op grond
      van de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel2
  - number: BXIIIf:3
    text: |-
      1. Een instelling die een aanvraag, als bedoeld in [artikel 1.5b van het besluit][ref1], heeft gedaan om
      aangewezen te worden als certificerende instelling, wordt beoordeeld op basis van de criteria, bedoeld in
      [artikel 1.5a van het besluit][ref2].

      2. Bij deze beoordeling wordt gelet op de volgende aspecten:

      a. de aan te wijzen certificerende instelling en diens medewerkers die met werkzaamheden in het kader van de
      afgifte van certificaten zijn belast, voeren deze uit met de grootste mate van beroepsintegriteit;

      b. de certificerende instelling heeft een integriteitsbeleid, dat waar nodig in duidelijke voorschriften is
      uitgewerkt in een gedragscode en bestuurders en medewerkers tekenen een integriteitsverklaring en handelen
      overeenkomstig dat integriteitsbeleid;

      c. de certificerende instelling treedt integer op en handelt binnen haar bevoegdheden;

      d. de aan te wijzen certificerende instelling heeft de volgende procedures op schrift gesteld:

      1°. een zienswijzeprocedure overeenkomstig [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref3];

      2°. een bezwaarschriftprocedure overeenkomstig de [hoofdstukken 6][ref4] en
      [7 van de Algemene wet bestuursrecht][ref5], en

      3°. een klachtenprocedure overeenkomstig [titel 9.1 van de Algemene wet bestuursrecht][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5b
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
      [ref6]: https://wetten.overheid.nl/BWBR0005537
