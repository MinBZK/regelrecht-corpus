  - number: BXIIIf:10
    text: |-
      1. Een certificerende instelling die haar activiteiten als certificerende instelling geheel of gedeeltelijk
      beëindigt of voornemens is te beëindigen informeert de minister hierover zo spoedig mogelijk en volgt vervolgens de
      aanwijzingen van de minister op met betrekking tot overdracht van dossiers.

      2. Een certificerende instelling informeert de minister zodra zij een aanvraag indient voor een aanvullende
      accreditatie of beoordeling op basis van een ander werkveldspecifiek certificatieschema in het kader van de wet.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel10
  - number: BXIIIf:11
    text: |-
      1. De certificerende instelling verstrekt overeenkomstig [artikel 1.5e, tweede lid, van het besluit][ref1]
      desgevraagd informatie aan de Stichting Raad voor Accreditatie over onder meer de wijze waarop de certificerende
      instelling omgaat met:

      a. de afhandeling van klachten;

      b. de afhandeling van geconstateerde afwijkingen;

      c. de verstrekking van certificaten en beoordeling naar aanleiding van klachten en meldingen; en

      d. het uitvoeren van controles van certificaathouders qua frequentie, aard en duur.

      2. De certificerende instelling verstrekt overeenkomstig [artikel 1.5e, derde lid, van het besluit][ref2]
      desgevraagd informatie aan de Inspectie SZW over onder meer de in het eerste lid genoemde onderwerpen.

      3. De certificerende instelling informeert de Inspectie SZW, de Stichting Raad voor Accreditatie en haar
      certificaathouders alsmede degenen die een aanvraag tot certificatie hebben ingediend wanneer zij voornemens is een
      of meer van haar taken waarvoor zij is aangewezen, te beëindigen.

      4. De certificerende instelling informeert de Inspectie SZW en de beheerstichting over individuele
      certificaathouders aan wie een sanctie is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5e
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5e
