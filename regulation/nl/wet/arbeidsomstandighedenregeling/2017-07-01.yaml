  - number: '4.19'
    text: |-
      1 Als grenswaarden als bedoeld in [artikel 4.3, eerste lid][ref1], jo.
      [artikel 4.1, tweede lid, onder a, van het besluit][ref2] worden aangewezen de waarden die zijn opgenomen in
      [bijlage XIII][ref3] bij deze regeling.

      2

      De resultaten van de beoordeling, bedoeld in [artikel 4.2, eerste lid, van het besluit][ref4] worden voor elke
      stof waarvoor overeenkomstig het eerste lid en [artikel 4.3, tweede lid, van het besluit][ref5] een grenswaarde
      is vastgesteld, getoetst aan die grenswaarde. De toetsing vindt plaats volgens een voor dat doel geschikte
      genormaliseerde methode.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.3
