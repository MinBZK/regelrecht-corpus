  - number: '4.27'
    text: |-
      Een certificaat kan worden afgegeven indien:

      a. in geval van het certificaat, bedoeld in [artikel 4.54a, vierde lid, van het besluit][ref1], de aanvrager
      voldoet aan de eisen, vastgelegd in het Werkveldspecifiek certificatieschema voor de Procescertificaten
      Asbestinventarisatie en Asbestverwijdering, zoals opgenomen in [bijlage XIIIa][ref2] bij de regeling;

      b. in geval van het certificaat, bedoeld in [artikel 4.54d, eerste lid, van het besluit][ref3], de aanvrager
      voldoet aan de eisen, vastgelegd in het Werkveldspecifiek certificatieschema voor de Procescertificaten
      Asbestinventarisatie en Asbestverwijdering, zoals opgenomen in [bijlage XIIIa][ref4] bij de regeling;

      c. in geval van het certificaat, bedoeld in [artikel 4.54d, vijfde lid, van het besluit][ref5], de aanvrager
      voldoet aan de eisen, vastgelegd in het Werkveldspecifiek certificatieschema voor het Persoonscertificaat Deskundig
      Toezichthouder Asbestverwijdering (DTA), zoals opgenomen in [bijlage XIIIc][ref6] bij de regeling;

      d. in geval van het certificaat, bedoeld in [artikel 4.54d, zevende lid, van het besluit][ref7], de aanvrager
      voldoet aan de eisen, vastgelegd in het Werkveldspecifiek certificatieschema voor de Persoonscertificaten
      Deskundig Asbestverwijderaar niveau 1 en niveau 2, (DAV-1 en DAV-2), zoals opgenomen in [bijlage XIIIc][ref8] bij
      de regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.54a
