  - number: '4.14'
    text: |-
      Een certificaat van vakbekwaamheid gasdeskundige als bedoeld in [artikel 3.5h, vierde lid, van het besluit][ref1]
      wordt door de minister of, indien de minister een certificerende instelling heeft aangewezen, de certificerende
      instelling, afgegeven indien de aanvrager voldoet aan de eisen, bedoeld in versie 1 van de Regeling SGT nr. REG/
      SGT/20/001 van de Stichting Hobéon SKO Certificatie, vastgesteld per 15 mei 2009.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5h
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.14
