  - number: BXIIIc:29
    text: |-
      Voor het theorie-examen gelden de volgende eindtermen:

      1. In het kader van de soorten en toepassingen kan de aanvrager:

      a. de verschillende soorten asbest en asbesthoudend materiaal noemen; en

      b. de verschillende toepassingen van asbest of asbesthoudend materiaal noemen en kan hij de situaties waarin het
      werd toegepast noemen en herkennen.

      2. In relatie tot de regelgeving:

      a. heeft de aanvrager kennis van de bestaande arbeidsbeschermende voorschriften op het gebied van asbest in het
      algemeen en op het gebied van het slopen of verwijderen van asbest in het bijzonder;

      b. kan de aanvrager werkzaamheden uitvoeren conform de eisen uit een sloopmelding als bedoeld
      in [artikel 1.26 tot en met 1.33 van het Bouwbesluit 2012][ref1] en de eisen, bedoeld in het
      [Asbestverwijderingsbesluit 2005][ref2];

      c. heeft de aanvrager kennis van de milieuvoorschriften die gelden bij het verwijderen van asbest;

      d. heeft de aanvrager kennis van de voor een deskundig asbestverwijderingsbedrijf relevante regelgeving; en

      e. kan de aanvrager de instanties noemen die de controle op de naleving van voornoemde voorschriften uitvoeren en
      kent hij hun bevoegdheden.

      3. De aanvrager kan de taken van een DAV-1 en DAV-2 noemen en toelichten.

      4. In relatie tot de risicobeoordeling kan de aanvrager:

      a. de risico’s voor de gezondheid bij het verwijderen van asbest herkennen en beoordelen en weet hij maatregelen te
      noemen om deze risico’s te voorkomen;

      b. het doel, de werking en de aspecten van alternatieven voor verwijdering benoemen en uitleggen.

      5. In relatie tot de asbestinventarisatie:

      a. weet de aanvrager in welke gevallen er een asbestinventarisatieplicht is, door wie deze inventarisatie verricht
      wordt en kent hij de uitzonderingen op deze verplichting;

      b. kent de aanvrager de verschillende typen asbestinventarisaties, weet hij de verschillen en kent hij de
      geldigheidsduur van de rapporten;

      c. kan de aanvrager beoordelen of een asbestinventarisatierapport volledig is en handelend optreden indien dit niet
      het geval is.

      6. In relatie tot de indeling in risicoklassen:

      a. weet de aanvrager wie bevoegd zijn om risicoklassen te bepalen en hoe deze bepaald worden;

      b. kent de aanvrager de voorwaarden voor het eventueel aanpassen van de risicoklasse en kent hij de concentraties
      die aan de indeling in klassen ten grondslag liggen; en

      c. kent de aanvrager de eisen met betrekking tot de werkmethoden, opleiding van personeel, meldingsplicht, gebruik
      van persoonlijke beschermingsmiddelen en de eindinspectie.

      7. In relatie tot de procesbeheersing:

      a. is de aanvrager op de hoogte van de meldingsplicht en kan hij de aan het certificatieschema Procescertificaat
      Asbestverwijdering verbonden meldingsplicht uitvoeren;

      b. kan de aanvrager een werkplan voor het verwijderen van asbest samenstellen en beoordelen en weet hij wanneer een
      werkplan noodzakelijk is;

      c. kan de aanvrager de kwaliteit van de bij het slopen of verwijderen van asbest gebruikte hulpmiddelen beoordelen;

      d. kan de aanvrager maatregelen benoemen en beschrijven om vezelemissie zo veel mogelijk te voorkomen;

      e. is de aanvrager op de hoogte van de voorschriften voor het omgaan met asbesthoudend afval en kan hij deze
      voorschriften toepassen; en

      f. kan de aanvrager aan de hand van documenten de benodigde kwaliteits- en veiligheidsregistraties op de werkplek
      benoemen en uitvoeren.

      8. In relatie tot de eindinspecties kent de aanvrager:

      a. de voorwaarden van de visuele inspectie die door de DTA uitgevoerd wordt voordat de inspectie-instelling een
      eindcontrole komt uitvoeren;

      b. de randvoorwaarden en condities van eindinspectie die behoren bij de verschillende verwijdering technieken en
      risicoklassen; en

      c. de verantwoordelijkheden van de DTA en de inspectie-instelling bij de eindinspectie.

      9. De aanvrager kan de relaties tussen de beheerstichting, de certificerende instellingen en een certificaathouder
      duidelijk maken en kent de relevante certificatieschema’s en overige relevante documenten van de beheerstichting.


      [ref1]: https://wetten.overheid.nl/BWBR0030461#Artikel1.26
      [ref2]: https://wetten.overheid.nl/BWBR0019316
