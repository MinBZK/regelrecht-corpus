      1 Een certificaat als bedoeld in [artikel 6.16, derde lid, van het besluit][ref1], wordt door de
      certificerende instelling, bedoeld in [artikel 6.1, derde lid][ref2], afgegeven indien de aanvrager, zijnde
      brandweerduikploegleider, voldoet aan de criteria zoals vastgelegd in het Werkveldspecifiek certificatieschema
      voor het persoonscertificaat duikploegleider bij de brandweer, document: WSCS-WOD-F, zoals opgenomen in
