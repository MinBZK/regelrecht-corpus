  - number: '3.10'
    text: |-
      1 Het veiligheids- en gezondheidsdocument, bedoeld in [artikel 3.7][ref1], bevat:

      a. een overzichtstekening waarop de combinaties, bedoeld in het tweede lid, zijn aangegeven;

      b. een opgave van de acceptatiecriteria;

      c. een beoordeling en een evaluatie van de gevaren en de daarmee samenhangende risico's die specifiek zijn voor de
      locatie en voor de werkzaamheden waarop het veiligheids- en gezondheidsdocument betrekking heeft;

      d. een specificatie van de bronnen, die zijn gebruikt bij het identificeren, analyseren en evalueren van de
      risico's, met inbegrip van een beschrijving van de wijze waarop de geschiktheid en betrouwbaarheid van de bronnen
      is vastgesteld;

      e. een evaluatie van alle beheerssystemen die bijdragen aan de vermindering van de risico's;

      f. een opgave van de noodzakelijk geachte risicoverminderende maatregelen, inclusief een samenvatting van al het
      onderzoek dat in dit kader is verricht;

      g. een opgave van de prestatienormen;

      h. een toetsing van de vermelde risico's aan de acceptatiecriteria, en

      i. een toetsing van de prestaties van een procesinstallatie of componenten daarvan, van apparatuur en van
      beheerssystemen aan de prestatienormen.

      2 In het veiligheids- en gezondheidsdocument, bedoeld in het eerste lid, worden de maatregelen, die noodzakelijk
      zijn voor het beheersen van risico's, afgestemd op het veiligheids- en gezondheidsdocument, bedoeld in
      [artikel 3.6][ref2], indien bij het uitvoeren van werkzaamheden gebruik wordt gemaakt van een combinatie van:

      a. een vast opgestelde mijnbouwinstallatie als bedoeld in [artikel 3.6, eerste lid, onderdeel b][ref3] en een als
      een geheel verplaatsbare mijnbouwinstallatie als bedoeld in [artikel 3.6, eerste lid, onder c][ref4];

      b. een andere verplaatsbare installatie met behulp waarvan boorgaten worden geboord of werkzaamheden in een
      bestaand boorgat worden uitgevoerd als bedoeld in [artikel 3.6, eerste lid, onderdeel d][ref5] en een vast
      opgestelde mijnbouwinstallatie als bedoeld in [artikel 3.6, eerste lid, onderdeel b][ref6];

      c. een als een geheel verplaatsbare mijnbouwinstallatie als bedoeld in [artikel 3.6, eerste lid, onderdeel c][ref7]
      en een andere verplaatsbare installatie met behulp waarvan werkzaamheden in een bestaand boorgat worden uitgevoerd
      als bedoeld in [artikel 3.6, eerste lid, onderdeel d][ref8], of

      d. een mijnbouwwerk op het land als bedoeld in [artikel 3.6, eerste lid, onderdeel a][ref9] en een andere
      verplaatsbare installatie met behulp waarvan boorgaten worden geboord of werkzaamheden in een bestaand boorgat
      worden uitgevoerd als bedoeld in [artikel 3.6, eerste lid, onderdeel d][ref10].


