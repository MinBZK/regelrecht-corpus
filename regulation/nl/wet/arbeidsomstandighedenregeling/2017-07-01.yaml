preamble:
  text: |-
    Gelet op de artikelen 7, vierde lid, onder b, 9, vierde en zesde lid, 10, vijfde lid, 41, eerste lid, en 42, tweede
    lid, van de Arbeidsomstandighedenwet, artikel 6 van de Wet arbeid gehandicapte werknemers en artikel 11 van de
    Algemene wet erkenning EG-hoger-onderwijsdiploma's;

    Voorts gelet op de artikelen 2.7, tweede en derde lid, 2.8, 2.15, eerste en derde lid, 2.24, eerste lid, 4.7,
    eerste, derde en vijfde lid, 4.8, tweede tot en met vijfde lid4.9, zevende lid, 4.10, tweede en derde lid, 4.14,
    vijfde lid, 4.16, eerste lid, 4.42, vijfde lid, 4.50, tweede lid, 4.54, derde en vijfde lid, 4.60, vierde en vijfde
    lid, 4.65, eerste lid, onder a en b, 4.66, onder a en b, 4.67, eerste en vijfde lid, 4.68, eerste lid, 4.7.0, derde
    en vijfde lid, 4.71, eerste lid, 4.72, eerste lid, 4.73, 5.12, 6.17, derde lid, 7.19, achtste tot en met negende en
    elfde lid, 7.29, zesde en zevende lid, 7.32, tweede lid, en vierde tot en met zevende lid, 8.4, tweede lid, van het
    Arbeidsomstandighedenbesluit;

    Gezien de adviezen van de Sociaal Economische Raad van 28 juli 1995, kenmerk 95/35, en 28 maart 1996, kenmerk
    96/31.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            besluit:

              het [Arbeidsomstandighedenbesluit][ref1];



            b
            de minister:

              de Minister van Sociale Zaken en Werkgelegenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0008498
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0008498
  - number: 1.1a
    text: |-
      In het jaarverslag van een certificerende instelling, bedoeld in [artikel 1.5e, eerste lid, van het besluit][ref1]
      worden ten minste de volgende onderwerpen behandeld:

      a. de door de instelling afgegeven, ingetrokken, geschorste dan wel geweigerde certificaten;

      b. wijzigingen in de op het werkveld van de instelling betrekking hebbende accreditaties, reglementen en
      procedures;

      c. wijzigingen in de op het werkveld van de instelling betrekking hebbende taakverdeling;

      d. wijzigingen in de bestuurssamenstelling;

      e. wijzigingen in de statuten of het huishoudelijk reglement;

      f. aan derden uitbestede werkzaamheden;

      g. structurele knelpunten op het werkveld van de instelling die zich in de uitvoeringspraktijk hebben voorgedaan;

      h. het gevoerde overleg en de samenwerking op het werkveld met andere certificerende instellingen;

      i. door de instelling ontvangen klachten en de wijze van afhandeling daarvan;

      j. tegen de beslissingen van de instelling ingediende bezwaren en ingestelde beroepen en de wijze van afhandeling
      daarvan;

      k. een financieel verslag betreffende de activiteiten waarvoor de instelling is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5e
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel1.1a
    references:
      - id: ref1
        bwb_id: BWBR0008498
        artikel: 1.5e
  - number: 1.1b
    text: |-
      1 Voor zover ten gevolge van een verzoek of handeling dan wel nalaten van de aanvrager van een certificaat als
      bedoeld in deze regeling, extra kosten worden gemaakt in verband met de afgifte van het certificaat, worden deze
      kosten doorberekend aan de aanvrager.

      2 De kosten verbonden aan de afgifte van een certificaat worden bij de aanvraag voldaan overeenkomstig de
      aanwijzingen van de instelling.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel1.1b
  - number: '1.2'
    text: |-
      Voor zover in deze regeling regels zijn gesteld over opleidingen zijn de [artikelen 1.3 tot en met 1.8][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel1.3
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0008587
        artikel: '1.3'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '1.3'
    text: |-
      De opleiding wordt gegeven aan de hand van aan de cursisten ter beschikking gesteld overzichtelijk schriftelijk
      opleidingsmateriaal van voldoende didactische kwaliteit.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel1.3
  - number: '1.4'
    text: |-
      De docenten beschikken voor de onderwerpen die zij tijdens de opleiding behandelen aantoonbaar over ruime
      theoretische, praktische en didactische kennis of vaardigheden.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel1.4
  - number: '1.5'
    text: |-
      1 De opleidingsinstelling beschikt over adequate opleidingsfaciliteiten.

      2 De opleidingsinstelling biedt de opleiding ten minste twee maal per jaar aan en voert haar ten minste eenmaal per
      jaar uit.

      3 De opleidingsinstelling legt de verantwoordelijkheden en bevoegdheden van alle betrokkenen bij de opleiding
      schriftelijk vast.

      4 De opleidingsinstelling treft adequate maatregelen om de veiligheid van de cursisten zoveel mogelijk te
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel1.5
  - number: '1.6'
    text: |-
      1 De toetsing van de eindtermen vindt plaats door middel van een examen.

      2 De opleidingsinstelling neemt de examens af aan de hand van een deugdelijk en op schrift gesteld examenreglement.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel1.6
  - number: '1.7'
    text: |-
      De opleidingsinstelling overhandigt de cursist die het examen met goed gevolg heeft afgelegd, een op naam gesteld
      schriftelijk bewijs, getekend door twee leden van de examencommissie dan wel het hoofd van de opleidingsinstelling.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel1.7
  - number: '1.8'
    text: |-
      De opleidingsinstelling voert een deugdelijke administratie waarin de persoonlijke gegevens van de cursist en de
      datum waarop het schriftelijk bewijs, bedoeld in [artikel 1.7][ref1] is uitgereikt in ieder geval zijn opgenomen en
      waarin de periode is bepaald gedurende welke de examenopgaven en de uitwerkingen daarvan worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel1.7
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel1.8
