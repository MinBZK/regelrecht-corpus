  - number: BXIIIc:32
    text: |-
      De verdeling van de vragen en opdrachten van het praktijkexamen over de eindtermen, genoemd in artikel 29, vindt
      plaats op basis van de hierna opgenomen tabel.









                      Eindtermen / toetstermen


                      Aantal toetstermen


                      %




                      Eindterm 1.
                      Het kunnen geven van een mondelinge voorlichting of instructie


                      **1**


                      25




                      Toetstermen




                      1.1 Beschikt over de communicatieve vaardigheden om werknemers die betrokken zijn bij het
      verwijderen van asbest volgens het werkplan te instrueren en te beoordelen of de instructie begrepen is en
      opgevolgd kan worden. Kandidaat is daarbij in staat om zijn gekozen methodiek te verdedigen en inhoudelijke vragen
      adequaat te beantwoorden.




                      1.2 Beschikt over de communicatieve vaardigheden om opdrachtgevers en derden die betrokken zijn
      bij het verwijderen van asbest volgens het werkplan te instrueren en voor te lichten en te beoordelen of de
      voorlichting begrepen is.
                      Kandidaat is daarbij in staat om zijn gekozen methodiek te verdedigen en inhoudelijke vragen
      adequaat te beantwoorden.




                      1.3 Beschikt over de communicatieve vaardigheden om controlerende instanties tijdens de
      werkzaamheden effectief van de stand van zaken op de hoogte te brengen en de juiste documenten te laten zien.
      Kandidaat is daarbij in staat om zijn gekozen methodiek te verdedigen en inhoudelijke vragen adequaat te
      beantwoorden.




                      Eindtermen / toetstermen


                      Aantal toetstermen


                      %




                      Eindterm 2.
                      Het kunnen houden van toezicht bij de diverse werkzaamheden en zo nodig corrigerend optreden


                      **5**


                      50




                      Toetstermen




                      2.1 Kan zijn toezichthoudende taak -mede op basis van zijn leidinggevende capaciteiten en sociale
      vaardigheden- uitvoeren.




                      2.2 Kan -zowel in technische als in sociale zin- corrigerend optreden wanneer er niet op juiste
      wijze omgegaan wordt met de hulpmiddelen en de persoonlijke beschermingsmiddelen.




                      2.3 Kan effectief handelend optreden bij het wegvallen van de onderdruk.




                      2.4 Kan effectief handelend optreden bij te veel onderdruk.




                      2.5 Kan effectief handelend optreden bij een ongeval met persoonlijk letsel.




                      2.6 Kan effectief handelend optreden bij het open gaan van een afvalzak.




                      2.7 Kan effectief handelend optreden bij het uitvallen van stroom.




                      2.8 Kan effectief handelend optreden bij het wegvallen van de watervoorziening.




                      2.9 Kan effectief handelend optreden bij het openscheuren van het containment.




                      2.10 Kan opdracht geven tot het plaatsen van afzettingen, er op toezien dat deze handelingen op de
      juiste wijze worden uitgevoerd en kan handelend optreden indien dit niet het geval is.




                      2.11 Kan opdracht geven tot het uitvoeren van werkzaamheden met de glovebag, kan er op toezien dat
      de werkzaamheden met de glovebag techniek op een juiste wijze worden uitgevoerd en kan handelend optreden indien
      dit niet het geval is.




                      2.12 Kan opdracht geven tot het opbouwen van een containment, er op toezien dat een containment op
      de juiste wijze wordt opgebouwd en kan handelend optreden indien dit niet het geval is. Kan tevens de inrichting
      testen op effectiviteit.




                      2.13 Kan opdracht geven tot het opstellen en aansluiten van een decontaminatie-unit, er op
      toezien dat dit juist en veilig geschiedt en kan handelend optreden indien dit niet het geval is. Kan tevens de
      decontaminatie-unit testen op juiste werking.




                      2.14 Kan opdracht geven tot het opbouwen van een transitsluis, er op toezien dat dit juist en
      veilig geschiedt en kan handelend optreden indien dit niet het geval is.




                      2.15 Kan opdracht geven tot het verpakken en in de afvalsluis plaatsen van asbesthoudend afval, er
      op toezien dat dit juist en veilig geschiedt en kan handelend optreden indien dit niet het geval is.




                      2.16 Kan opdracht geven tot het uitsluizen van asbesthoudend afval inclusief de administratieve
      handelingen, er op toezien dat dit juist en veilig geschiedt en kan handelend optreden indien dit niet het geval
      is.




                      2.17 Kan opdracht geven tot het verwijderen van materiaal waarbij gebruik wordt gemaakt van
      bronmaatregelen, er op toezien dat dit juist en veilig geschiedt en kan handelend optreden indien dit niet het
      geval is.




                      2.18 Kan beoordelen of hulpmiddelen en apparatuur zijn gekeurd.




                      2.19 Kan opdracht geven tot het inplakken van een onderdrukmachine, er op toezien dat de machine op
      de juiste wijze wordt geplaatst en kan handelend optreden indien dit niet het geval is.




                      2.20 Kan opdracht geven tot het inschakelen van een onderdrukmachine, er op toezien dat de machine
      op de juiste wijze wordt ingeschakeld en kan handelend optreden indien dit niet het geval is.




                      2.21 Kan een effectieve luchtverversing en een gewenste onderdruk in een concrete situatie bereiken
      door instructies te geven aan de DAV-1 en DAV-2.




                      2.22 kan de werking van apparatuur en hulpmiddelen tijdens het gebruik beoordelen op
      functionaliteit, veiligheid en effectiviteit.




                      2.23 Kan de decontaminatieprocedure uitleggen, er op toezien dat deze veilig wordt uitgevoerd en
      kan handelend optreden indien dit niet het geval is.




                      2.24 Kan opdracht geven tot het wisselen van een voor- en tussenfilter van een onderdrukmachine, er
      op toezien dat deze handelingen op de juiste wijze worden uitgevoerd en kan handelend optreden indien dit niet het
      geval is.




                      2.25 Kan tijdens de werkzaamheden het logboek invullen waarin alle van belang zijnde gebeurtenissen
      die hebben plaatsgevonden worden geregistreerd.




                      Eindtermen / toetstermen


                      Aantal toetstermen


                      %




                      Eindterm 3.
                      Het herkennen van asbestverdachte materialen


                      **2**


                      25




                      Toetstermen




                      3.1 Kan op basis van een set van 10 materialen in monsterpotjes, een bijbehorende omschrijving en
      een foto beoordelen of de materialen al dan niet asbestverdacht zijn.




                      Totaal


                      **8**


                      100
