    text: |-
      Als grenswaarde als bedoeld in [artikel 4.3, eerste lid][ref1], jo.
      [artikel 4.1, tweede lid, onder b, van het besluit][ref2], wordt voor lood vastgesteld: 70 µg/100 ml bloed.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.3
