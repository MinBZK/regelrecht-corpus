  - number: 1.9a
    text: |-
      1 De aanvraag van een certificaat van vakbekwaamheid, bedoeld in [artikel 1.5h, van het besluit][ref1],
      wordt ingediend bij de minister of, indien de minister een certificerende instelling als bedoeld in
      [artikel 1.5a van het besluit][ref2], heeft aangewezen, bij die instelling, onder verstrekking van de volgende
      documenten:

      a. de documenten betreffende nationaliteit en verblijf, bedoeld in
      [artikel 13, eerste lid, onderdeel a, van de wet][ref3];

      b. een gewaarmerkte kopie van een in een betrokken staat verkregen opleidingstitel of bekwaamheidsattest waarop de
      aanvrager zich beroept;

      c. in voorkomend geval een bewijs van zijn beroepservaring, waarbij in ieder geval inzicht wordt verschaft in de
      duur van deze beroepservaring en de onderdelen en inhoud waaruit de beroepswerkzaamheden hebben bestaan;

      d. een verklaring omtrent het gedrag als bedoeld in de [Wet justitiële en strafvorderlijke gegevens][ref4] of een
      met die verklaring overeenkomend document als bedoeld in [artikel 14, eerste lid, van de wet][ref5], of een attest
      waaruit blijkt van een verklaring onder ede of plechtige verklaring als bedoeld in artikel 14, tweede lid, van de
      wet indien een dergelijke verklaring ook van eigen onderdanen wordt vereist;

      e. een document inzake gezondheid als bedoeld in [artikel 15 van de wet][ref6] indien een dergelijk document ook
      van eigen onderdanen wordt vereist; en

      f. indien de aanvraag en de in de onderdelen b, c, d en e bedoelde documenten in een andere dan de Nederlandse
      taal zijn gesteld, wordt op verzoek van de minister, dan wel de door hem aangewezen instelling, bedoeld in
      [artikel 1.5a van het besluit][ref7], zo nodig een vertaling in het Nederlands overlegd die is opgesteld door een
      beëdigd vertaler. Indien de minister of hiervoor genoemde instelling daarmee instemt, kan een vertaling van de
      documenten in een andere taal dan het Nederlands worden overlegd.

      2 De minister of, indien de minister een certificerende instelling als bedoeld in
      [artikel 1.5a van het besluit][ref8], heeft aangewezen, die instelling, stelt in het kader van de
      erkenning van beroepskwalificaties vast of de aanvrager beschikt over het beroepskwalificatieniveau,
      bedoeld in de [artikelen 6 en 9 van de wet][ref9] en met inachtneming van de termijnen, genoemd in
      [artikel 19 van de wet][ref10].

      3 Met inachtneming van [artikel 11 van de wet][ref11] stelt de minister of indien de minister een certificerende
      instelling als bedoeld in [artikel 1.5a van het besluit][ref12], heeft aangewezen, die instelling, de aanvrager op
      de hoogte van de eis van het met goed gevolg afleggen van een compenserende maatregel.

      4 De kosten verbonden aan het in behandeling nemen van een aanvraag als bedoeld in het eerste lid, en aan het
      afleggen van een compenserende maatregel als bedoeld in [artikel 11 van de wet][ref13], worden doorberekend aan
      de aanvrager. Deze kosten worden bij de aanvraag voldaan overeenkomstig de aanwijzingen van de certificerende
      instelling.

      5 In geval op grond van [artikel 11 van de wet][ref14] aan de aanvrager de eis wordt gesteld dat hij een
      aanpassingsstage volgt:

      a. wordt de aanvrager geïnformeerd over:

      1°. de ontbrekende kennis, vaardigheden en competenties waarop de aanpassingsstage betrekking heeft;

      2°. de duur van de aanpassingsstage;

      3°. overige eisen die het kader van de aanpassingsstage worden gesteld; en

      b. verricht de aanvrager tijdens deze periode werkzaamheden onder verantwoordelijkheid en begeleiding van een
      deskundige die in het bezit is van een certificaat van vakbekwaamheid op het desbetreffende vakgebied.

      6 In geval op grond van [artikel 11 van de wet][ref15] aan de aanvrager de eis wordt gesteld dat hij een proeve van
      bekwaamheid aflegt, wordt de aanvrager geïnformeerd over:

      a. de ontbrekende kennis, vaardigheden en competenties waarop de proeve van bekwaamheid betrekking heeft;

      b. de kosten; en

      c. overige eisen die in het kader van de proeve van bekwaamheid worden gesteld.


