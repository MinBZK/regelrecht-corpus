      a. *wet:* [Algemene wet erkenning EU-beroepskwalificaties][ref1];

      b. *beroepskwalificaties:* beroepskwalificaties, als bedoeld in [artikel 1 van de wet][ref2];

      c. *betrokken staat:* betrokken staat, als bedoeld in [artikel 1 van de wet][ref3];

      d. *dienstverrichter:* dienstverrichter, als bedoeld in [artikel 21 van de wet][ref4];

      e. *aanpassingsstage:* aanpassingstage, als bedoeld in [artikel 1 van de wet][ref5];

      f. *proeve van bekwaamheid:* proeve van bekwaamheid, als bedoeld in [artikel 1 van de wet][ref6].


