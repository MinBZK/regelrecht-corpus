  - number: '4.11'
    text: |-
      Werk met vuur boven dan wel in een deel van de ladingzone aan een K1- of KT-schip dat niet veilig voor vuur is als
      bedoeld in [artikel 4.10, derde lid, onder c][ref1] en waarbij in afwijking van [artikel 4.9][ref2] niet de daartoe
      vereiste veiligheids- en gezondheidsverklaring is uitgereikt is alleen dan toegestaan indien:

      a. de aard van de werkzaamheden, de plaats of plaatsen waar deze werkzaamheden zullen worden uitgevoerd en de
      periode waarin zij zullen worden verricht, nauwkeurig zijn aangeduid door de reparateur;

      b. de plaatsen waar vonken of gloeiende metaaldelen kunnen neerkomen door de werkzaamheden, nauwkeurig zijn
      aangeduid door de reparateur;

      c. de plaatsen waar aanmerkelijke temperatuurverhoging kan optreden als gevolg van de werkzaamheden, nauwkeurig
      zijn aangeduid door de reparateur;

      d. door een gasdeskundige een gedagtekende verklaring is uitgereikt waaruit blijkt dat op de onder a tot en met c
      bedoelde plaatsen de resten van brandbare vloeistoffen zijn verwijderd, zodat geen brandgevaar bestaat;

      e. door een gasdeskundige een volledig en juist ingevulde veiligheids- en gezondheidsverklaring is afgegeven
      waaruit blijkt dat ruimten waarin gewerkt moet worden en aangrenzende ruimten veilig voor mensen zijn of
      geïnertiseerd als bedoeld in [artikel 4.10, derde lid, onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Artikel4.10
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel4.9
      [ref3]: https://wetten.overheid.nl/BWBR0008587#Artikel4.10
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel4.11
