  - number: '2.7'
    text: |-
      Als certificerende instelling als bedoeld in [artikel 2.14, eerste en tweede lid, van het besluit][ref1],
      kan worden aangewezen een instelling die voldoet aan de eisen vastgelegd in het Werkveldspecifiek document
      voor aanwijzing en toezicht (WDA&T op certificatie-instellingen behorend bij het Certificatieschema voor de
      dienstverlening door Arbodiensten: document: WDA&T-Arbodiensten, opgenomen in [bijlage IIa][ref2] bij de regeling.


