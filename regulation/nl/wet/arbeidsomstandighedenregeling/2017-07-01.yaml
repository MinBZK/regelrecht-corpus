  - number: '4.1'
    text: |-
      Voor de toepassing van deze paragraaf wordt verstaan onder:

      a. brandbare vloeistoffen: vloeistoffen waarvan het vlampunt niet hoger is dan 100°C;

      b. K0-, K1- en K2-vloeistoffen: brandbare vloeistoffen, met een vlampunt lager of gelijk aan 55°C, waaronder mede
      begrepen brandbare gassen, al dan niet in vloeibare vorm, voor zover niet begrepen onder KT-vloeistoffen;

      c. K3-vloeistoffen: brandbare vloeistoffen, geen KT-vloeistoffen zijnde, waarvan het vlampunt hoger is dan 55°C;

      d. KT-vloeistoffen: brandbare vloeistoffen, waaronder mede begrepen brandbare gassen, al dan niet in vloeibare
      vorm, welke gevaar voor vergiftiging, bedwelming of verstikking kunnen opleveren;

      e. T-vloeistoffen: vloeistoffen, niet zijnde brandbare vloeistoffen, waaronder mede begrepen gassen, al dan niet in
      vloeibare vorm, welke gevaar voor vergiftiging bedwelming of verstikking kunnen opleveren;

      f. K1-ruimte: een tot een schip behorende ruimte waarin K0-, K1- of K2-vloeistoffen en geen KT-vloeistoffen of
      resten daarvan anders dan in verpakking voorkomen;

      g. K3-ruimte: een tot een schip behorende ruimte waarin geen andere brandbare vloeistoffen dan K3-vloeistoffen of
      resten daarvan anders dan in verpakking voorkomen;

      h. KT-ruimte:een tot een schip behorende ruimte waarin KT-vloeistoffen of resten daarvan anders dan in verpakking
      voorkomen;

      i. T-ruimte: een tot een schip behorende ruimte waarin T-vloeistoffen en geen KT-vloeistoffen of resten daarvan
      anders dan in verpakking voorkomen;

      j. K1-schip: een schip waarvan een of meer van de ladingtanks een K1-ruimte is of voor het schoonmaken daarvan was;

      k. K3-schip: een schip, in de ladingtanks waarvan noch andere brandbare vloeistoffen dan K3-vloeistoffen geen T-
      vloeistoffen of resten van een van die vloeistoffen anders dan in verpakking voorkomen;

      l. KT-schip: een schip waarvan een of meer van de ladingtanks een KT-ruimte is of voor het schoonmaken daarvan was;

      m. T-schip: een schip, niet zijnde een K1- of KT-schip, waarvan een of meer van de ladingtanks een T-ruimte is of
      voor het schoonmaken daarvan was;

      n. vuur: vuur, vonkvorming, open licht of elk oppervlak met een temperatuur welke gelijk is aan of hoger is dan de
      minimumontstekingstemperatuur van de vloeistoffen of de gassen die de ladingtanks bevatten of waarvan resten in die
      tanks voorkomen;

      o. werk met vuur: werkzaamheden waarbij vuur wordt gebruikt of kan ontstaan;

      p. koud werk: werkzaamheden waarbij geen vuur wordt gebruikt of kan ontstaan;

      q. schoonmaken: iedere handeling die gericht is op of verband houdt met het schoon-, gasvrij- of droogmaken van een
      K1-, KT-, K3- of T-ruimte;

      r. ladingzone: de ladingtanks en alle rechtstreeks aan deze tanks grenzende tanks of andere ruimten, welke als
      afscheiding dienen tussen de ladingtanks en de overige ruimten van het schip;

      s. gasdeskundige: een deskundig persoon als bedoeld in [artikel 3.5h, derde lid, van het besluit][ref1] die voldoet
      aan [artikel 4.14][ref2];

      t. veiligheids- en gezondheidsverklaring: een door een gasdeskundige na een doeltreffend onderzoek afgegeven
      verklaring als bedoeld in [artikel 3.5h, derde lid, van het besluit][ref3], overeenkomstig een van de bij
      [bijlage IX][ref4] van deze regeling vastgestelde modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5h
      [ref2]: https://wetten.overheid.nl/BWBR0008587#Artikel4.14
      [ref3]: https://wetten.overheid.nl/BWBR0008498#Artikel3.5h
      [ref4]: https://wetten.overheid.nl/BWBR0008587
