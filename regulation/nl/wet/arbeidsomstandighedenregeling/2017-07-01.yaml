  - number: 4.19b
    text: |-
      Indien toepassing wordt gegeven aan [artikel 4.3, vierde en vijfde lid][ref1], of
      [artikel 4.16, vierde en vijfde lid, van het besluit][ref2] worden in het plan van aanpak, bedoeld in
      [artikel 5, derde lid, van de wet][ref3] per te realiseren stap van blootstellingsverlaging, in ieder geval
      opgenomen:

      a. welke doeltreffende maatregelen zijn genomen om schade aan de gezondheid van de werknemers te voorkomen zolang
      de grenswaarde wordt overschreden;

      b. welke maatregelen gericht op blootstellingsverlaging in een zo kort mogelijke tijdsspanne worden genomen,
      waarbij de feitelijk te verwachten blootstelling wordt aangegeven alsmede het tijdstip waarop blootstelling onder
      de grenswaarde wordt gerealiseerd;

      c. een onderbouwing dat de gehanteerde overschrijding van de grenswaarde, gezien de mate en de duur, niet tot
      onaanvaardbare effecten op de gezondheid van de werknemers leidt; en

      d. een onderbouwing dat verdergaande maatregelen niet eerder dan in de voorgestelde fasering van de
      blootstellingsverlaging kunnen worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.3
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.16
      [ref3]: https://wetten.overheid.nl/BWBR0010346#Artikel5
