      tweevoud toegezonden aan een daartoe aangewezen toezichthouder.

      2 Dit veiligheids- en gezondheidsdocument gaat vergezeld van het werkprogramma, bedoeld in
      [artikel 74 van het Mijnbouwbesluit][ref2] indien het de volgende werkzaamheden betreft:

