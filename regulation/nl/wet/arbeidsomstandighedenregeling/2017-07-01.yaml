    text: |-
      1 De werkgever die verantwoordelijk is voor het mijnbouwwerk, bedoeld in [artikel 3.6, eerste lid][ref1],
      gaat na of het veiligheids- en gezondheidsdocument, met uitzondering van het voorontwerprapport, bedoeld in
      [artikel 3.8, eerste lid, onder a][ref2], wordt nageleefd.

      2 De werkgever die verantwoordelijk is voor het mijnbouwwerk, bedoeld in [artikel 3.6, eerste lid][ref3],
      beoordeelt regelmatig en systematisch de naleving en de doeltreffendheid van het veiligheids- en
      gezondheidsdocument.

      3 Indien de resultaten van de beoordeling, bedoeld in het tweede lid, daartoe aanleiding geven, herziet de
      werkgever die verantwoordelijk is voor de arbeidsplaats het veiligheids- en gezondheidsdocument. De herziene delen
      van het veiligheids- en gezondheidsdocument worden, alvorens het gewijzigde veiligheids- en gezondheidsdocument
      wordt uitgevoerd, in tweevoud toegezonden aan een daartoe aangewezen toezichthouder.


