  - number: '2.1'
    text: |-
      1 Bij de uitvoering van de taken, bedoeld in [artikel 14, eerste lid, onder a, van de wet][ref1] verricht de
      deskundige of de bedrijfarts, bedoeld in [artikel 2.14a, eerste lid, van het besluit][ref2] of de arbodienst de
      volgende werkzaamheden:

      a. het toetsen of de risico-inventarisatie en -evaluatie, bedoeld in [artikel 5 van de wet][ref3], volledig en
      betrouwbaar is;

      b. het toetsen of in de risico-inventarisatie en -evaluatie, bedoeld onder a, de actuele inzichten op het terrein
      van arbeidsomstandigheden zijn verwerkt;

      c. het op basis van de risico-inventarisatie en -evaluatie, bedoeld onder a, uitbrengen van een
      advies aan de werkgever. Dit advies heeft mede betrekking op de in het plan van aanpak, bedoeld in
      [artikel 5, derde lid, van de wet][ref4], voorgestelde wijze waarop de geconstateerde tekortkomingen kunnen worden
      verholpen en de prioriteiten en de volgorde waarin de maatregelen worden genomen.

      2 Bij de uitvoering van de taak, bedoeld in [artikel 2.14b, tweede en derde lid, onder b, van het besluit][ref5]
      verricht de deskundige of de bedrijfarts, bedoeld in [artikel 2.14a, eerste lid, van het besluit][ref6] of de
      arbodienst de volgende werkzaamheden:

      a. het toetsen of het model, bedoeld in [artikel 14, twaalfde lid, onderdeel b, onder 1°, van de wet][ref7] of het
      instrument, bedoeld in artikel 14, twaalfde lid, onderdeel b, onder 2°, van de wet, volledig en betrouwbaar is;

      b. het toetsen of in het model of het instrument, bedoeld onder a, de actuele inzichten op het terrein van
      arbeidsomstandigheden in de desbetreffende branche zijn verwerkt;

      c. het toetsen of het model of het instrument, bedoeld onder a, adequate aanwijzingen bevat voor het kunnen
      opstellen van een plan van aanpak, bedoeld in [artikel 5, derde lid, van de wet][ref8].

      3 De Stichting van de Arbeid, te Den Haag, wordt aangewezen als de instelling waar een instrument als bedoeld in
      [artikel 14, twaalfde lid, onderdeel b, onder 2°, van de wet][ref9] kan worden aangemeld.

      4 De Stichting van de Arbeid draagt zorg voor plaatsing van een aangemeld instrument als bedoeld in
      [artikel 14, twaalfde lid, onderdeel b, onder 2°, van de wet][ref10] op de website www.rie.nl.


