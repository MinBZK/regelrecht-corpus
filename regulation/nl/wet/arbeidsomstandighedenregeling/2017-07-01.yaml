  - number: '3.2'
    text: |-
      In deze paragraaf en [paragraaf 3.3][ref1] wordt verstaan onder:



            a
             risico-analyse:

              systematisch onderzoek van risico's voor de veiligheid en de gezondheid op basis waarvan een beoordeling
      van die risico's wordt gemaakt als bedoeld in [artikel 5 van de wet][ref2];



            b
            acceptatiecriteria:

              de grenzen waarbinnen risico's aanvaardbaar zijn;



            c
            prestatienormen:

              duidelijke en meetbare parameters ten aanzien van die prestaties van een procesinstallatie of componenten
      daarvan, van apparatuur en van beheerssystemen, die direct bijdragen aan de verwezenlijking van veiligheids- en
      gezondheidsdoelstellingen;



            d
             mijnbouwwerk:

              een werk als bedoeld in [artikel 1, onderdeel n, van de Mijnbouwwet][ref3];



            e
            mijnbouwinstallatie:

              een installatie als bedoeld in [artikel 1.1, derde lid, onderdeel f, van het besluit][ref4];



            f
            richtlijn:

              richtlijn nr. 2013/30/EU van het Europees Parlement en de Raad van 12 juni 2013 betreffende de veiligheid
      van offshore olie- en gasactiviteiten en tot wijziging van Richtlijn 2004/35/EG (PbEU 2013, L 178);



            g
             veiligheids- en gezondheidszorgsysteem:

              een systeem als bedoeld in de [artikelen 2.42e, eerste lid][ref5], en
      [2.42k, tweede lid, van het besluit][ref6];



            h
            veiligheids- en gezondheidsdocument:

              een document als bedoeld in de [artikelen 2.42f, eerste lid][ref7], en
      [2.42k, eerste lid, van het besluit][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0008587#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0010346#Artikel5
