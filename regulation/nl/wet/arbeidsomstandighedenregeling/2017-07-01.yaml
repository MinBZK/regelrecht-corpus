  - number: BXIIIc:37
    text: |-
      1. Voor meldingen die door een certificerende instelling procescertificaat of door een toezichthoudende
      overheidsinstelling zijn gedaan voor 1 maart 2017 blijven de bepalingen van bijlage XIIIc, zoals deze luidden op
      28 februari 2017, van toepassing.

      2. De certificerende instellingen informeren de certificaathouders over de gevolgen die de inwerkingtreding met
      ingang van 1 maart 2017 van de artikelen 12, 12a en 12b heeft of kan hebben voor een individuele certificaathouder
      wanneer:

      a. het certificaat van een certificaathouder ten tijde van de inwerkingtreding is ingetrokken; of

      b. het certificaat van een certificaathouder ten tijde van de inwerkingtreding geschorst is.
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel37
  - number: BXIIIf:1
    text: |-
      In deze bijlage wordt verstaan onder:

        - *Beheerstichting:* Stichting Ascert, zijnde de beheerstichting, bedoeld in
      [artikel 1.5a, eerste lid, onderdeel f, van het besluit][ref1];
        - *DAV:* deskundig asbestverwijderaar;
        - *DAV-1:* persoon die in het bezit is van een persoonscertificaat deskundig asbestverwijderaar niveau 1
      overeenkomstig [bijlage XIIIc][ref2];
        - *DAV-2:* persoon die in het bezit is van een persoonscertificaat deskundig asbestverwijderaar niveau 2
      overeenkomstig [bijlage XIIIc][ref3];
        - *DTA:* persoon die in het bezit is van een persoonscertificaat deskundig toezichthouder asbestverwijdering
      overeenkomstig [bijlage XIIIc][ref4];
        - *NEN-EN-ISO/IEC 17024:* algemene eisen voor instellingen die certificatie van personen uitvoeren, uitgegeven door
      het Nederlands Normalisatie-instituut, zoals deze luidden in 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel1.5a
