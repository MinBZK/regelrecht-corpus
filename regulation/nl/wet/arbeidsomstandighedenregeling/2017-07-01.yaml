  - number: '6.5'
    text: |-
      1 Een certificaat als bedoeld in [artikel 6.14a, derde lid, van het besluit][ref1], wordt door de certificerende
      instelling afgegeven indien de aanvrager:

      a. is ingeschreven als bedrijfsarts als bedoeld in [artikel 14, eerste lid, aanhef van de wet][ref2];

      b. met goed gevolg het examen, behorende bij de opleiding, bedoeld bij [artikel 6.1, eerste lid][ref3], heeft
      afgelegd, en

      c. voldoet aan de criteria zoals neergelegd in het Werkveldspecifiek certificatieschema voor het
      persoonscertificaat duikerarts, document: WSCS-WOD-A, zoals opgenomen in [bijlage XVIa][ref4] bij de regeling.

      2 Een certificaat als bedoeld in [artikel 6.16, derde lid, van het besluit][ref5], wordt door de certificerende
      instelling afgegeven indien de aanvrager, niet zijnde brandweerduikploegleider, voldoet aan de criteria zoals
      vastgelegd in het Werkveldspecifiek certificatieschema voor het persoonscertificaat duikploegleider, document:
      WSCS-WOD-L, zoals opgenomen in [bijlage XVIb][ref6] bij de regeling.

      3 Een certificaat als bedoeld in [artikel 6.16, zesde lid, van het besluit][ref7], wordt door de certificerende
      instelling afgegeven indien de aanvrager, niet zijnde brandweerduiker, voldoet aan de criteria zoals vastgelegd
      in het Werkveldspecifiek certificatieschema voor het persoonscertificaat duikarbeid, document: WSCS-WOD-D, zoals
      opgenomen in [bijlage XVIc][ref8] bij de regeling.

      4 Een certificaat als bedoeld in [artikel 6.16, zevende lid, van het besluit][ref9], wordt door de certificerende
      instelling afgegeven indien de aanvrager voldoet aan de criteria zoals vastgelegd in het Werkveldspecifiek
      certificatieschema voor het persoonscertificaat duikmedisch begeleider, document: WSCS-WOD-B, zoals opgenomen in
      [bijlage XVId][ref10] bij de regeling.


