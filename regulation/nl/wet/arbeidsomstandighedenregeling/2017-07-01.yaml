  - number: '2.4'
    text: |-
      Bij de uitvoering van de taak, bedoeld in [artikel 14, eerste lid, onderdeel c, onder 2°, van de wet][ref1] legt
      de bedrijfarts, bedoeld in [artikel 2.14a, tweede lid, van het besluit][ref2] of de arbodienst vast:

      a. op welke wijze de aanstellingskeuring wordt uitgevoerd en welke procedures daarbij worden gevolgd;

      b. op welke wijze wordt omgegaan met de gegevens die uit het onderzoek in het kader van de aanstellingskeuring
      voortvloeien;

      c. op welke wijze de persoonlijke levenssfeer van individuen wordt gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel2.14a
    url: https://wetten.overheid.nl/BWBR0008587/2017-07-01#Artikel2.4
