        bwb_id: BWBR0008498
        artikel: 4.53c
  - number: 4.32a
    text: |-
      1 In deze paragraaf wordt verstaan onder:

      a. producten: lijmen, verven, lakken, beitsen, vernissen, vulmiddelen, olie- of wasachtige
      producten, impregneermiddelen en vloercoatings die vluchtige organische stoffen als bedoeld in
      [artikel 4.62a van het besluit][ref1] bevatten;

      b. bestanddelen van woningen of andere gebouwen: alle objecten die in woningen of andere gebouwen aanwezig zijn
      en die door hun aard, vorm, gewicht of afmetingen daaruit redelijkerwijs niet kunnen worden verwijderd. Onder
      bestanddelen van woningen en andere gebouwen worden niet verstaan objecten die worden vervaardigd, hersteld
      of onderhouden in het kader van een productieproces, onderscheidenlijk reparatie of onderhoud, voor zover het
      vervaardigen, herstel of onderhoud wordt verricht op een daartoe adequaat ingerichte arbeidsplaats.

      2 Als werkzaamheden als bedoeld in [artikel 4.62b van het besluit][ref2] worden aangewezen handelingen in woningen
      of andere gebouwen, bestaande uit:

      a. het lijmen van bekleding op vloeren, trappen, wanden of plafonds van woningen of andere gebouwen, daaronder mede
      begrepen de voorbewerking;

      b. het aanbrengen van producten in woningen of andere gebouwen of op bestanddelen van woningen of andere gebouwen,
      daaronder mede begrepen de voorbewerking.

      3 Het tweede lid, onder b, is niet van toepassing op:

      a. metalen bestanddelen van gebouwen ten aanzien waarvan toepassing van producten op grond van de in
      [bijlage XIV][ref3] bij deze regeling beschreven omstandigheden is toegestaan;

      b. het voorbewerken van muren en plafonds van woningen of andere gebouwen op plaatsen waar deze muren en plafonds
      ernstig verontreinigd zijn door brand- of rookschade of aanslag als gevolg van het roken van tabakswaren;

      c. het voorbewerken in de zin van versterken van sterk poreuze of poederende bestanddelen van woningen of andere
      gebouwen;

      d. het repareren met behulp van verf of lak van beschadigingen aan stalen constructies bij nieuwbouw van woningen
      of andere gebouwen;

      e. het herstellen of onderhouden van historische afwerkings- of toplagen in een techniek die gelijk is aan
      of overeenkomt met die historische afwerking, waarbij de werkzaamheden gericht zijn op instandhouding van de
      monumentale waarden van een rijksmonument in de zin van de [Erfgoedwet][ref4];

      f. het aanbrengen van traditioneel imitatieschilderwerk, zoals marmer- en houtnerfschilderwerk, alsmede het
      vergulden met behulp van goudverf. Onder aanbrengen wordt niet verstaan de voorbewerking;

      g. het aanbrengen van een product op beglazingskit in gebouwen voor zover deze opgeleverd zijn voor 1 januari 2001,
      teneinde deze kit geschikt te maken voor de toepassing van watergedragen verfproducten.

      4 Producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, onder a, bevatten ten hoogste 5
      gram vluchtige organische stoffen per kilogram gebruiksklaar product.

      5 Producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, onder b, voor zover het betreft
      het aanbrengen van muurverf, bevatten ten hoogste 60 gram vluchtige organische stoffen per liter gebruiksklaar
      product.

      6 Producten die worden gebruikt bij de werkzaamheden, bedoeld in het tweede lid, onder b, voor zover het andere
      werkzaamheden betreft dan het aanbrengen van muurverf, bevatten ten hoogste 100 gram vluchtige organische stoffen
      per liter gebruiksklaar product. Indien het bij de producten, bedoeld in de eerste zin, gaat om producten op
      epoxybasis, wordt benzylalcohol uitgezonderd bij het bepalen van het gewicht van de vluchtige organische stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0008498#Artikel4.62a
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel4.62b
      [ref3]: https://wetten.overheid.nl/BWBR0008587
      [ref4]: https://wetten.overheid.nl/BWBR0037521
