    text: |-
      1 Voor het onderzoek van geklasseerde bestaande schepen en de verdere werkzaamheden nodig voor de eerste afgifte
      van certificaten, volgens het geharmoniseerde systeem van onderzoek en certificering, is een toeslag van 100% van
      de in deze regeling genoemde tarieven voor de hernieuwde afgifte van certificaten verschuldigd.

