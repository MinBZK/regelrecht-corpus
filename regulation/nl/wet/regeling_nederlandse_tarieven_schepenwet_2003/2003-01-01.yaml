    text: |-
      1 Indien het onderzoek, bedoeld in [artikel 40, eerste lid][ref1], niet leidt tot de afgifte van een document, is,
      inclusief reistijd, een tarief verschuldigd van € 83 per uur.

      2 Voor hernieuwing van een document als bedoeld in [artikel 35, eerste lid][ref2], is een tarief verschuldigd van
      € 175.

      3 Bij gelijktijdige aanbieding voor een onderzoek ter goedkeuring van meerdere vrijwel identieke uitvoeringen
      van uitrustingsstukken en materialen, is voor de afgifte van het eerste document het tarief, genoemd in
      [artikel 36][ref3] en voor elk van de volgende documenten een tarief verschuldigd van € 175.


