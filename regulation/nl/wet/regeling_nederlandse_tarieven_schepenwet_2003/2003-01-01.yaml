  - number: '43'
    text: |-
      Voor het onderzoek verbonden aan de produktietest van uitrustingsstukken of onderdelen daarvan is, inclusief
      reistijd, een tarief verschuldigd van € 83 per uur.
    url: https://wetten.overheid.nl/BWBR0014430/2003-01-01#Artikel43
  - number: '44'
    text: |-
      Voor het behandelen van een verzoek tot samenlading van gevaarlijke stoffen in één laadeenheid is een tarief
      verschuldigd van € 50.
    url: https://wetten.overheid.nl/BWBR0014430/2003-01-01#Artikel44
  - number: '45'
    text: |-
      Voor het behandelen van een verzoek tot goedkeuring op grond van de International

      Maritime Dangerous Goods Code is een vergoeding verschuldigd van € 230.
    url: https://wetten.overheid.nl/BWBR0014430/2003-01-01#Artikel45
  - number: '46'
    text: |-
      1 Indien een onderzoek als bedoeld in deze regeling geheel of gedeeltelijk in het buitenland wordt uitgevoerd
      en de voor het betreffende onderzoek vastgestelde termijn, opgenomen in de bijlage, wordt overschreden, is per
      termijnoverschrijdende dag een aanvullend tarief verschuldigd van € 668.

      2 De eventuele reis- en verblijfskosten van de ambtenaar ten behoeve van de in deze regeling genoemde onderzoeken
      in het buitenland komen voor rekening van de opdrachtgever. Deze kosten worden afzonderlijk in rekening gebracht.
    url: https://wetten.overheid.nl/BWBR0014430/2003-01-01#Artikel46
  - number: '47'
    text: |-
      1 Indien de in deze regeling genoemde onderzoeken geheel of gedeeltelijk worden uitgevoerd op werkdagen tussen
      18.00 uur en 08.00 uur, op een zaterdag, op een zondag of op een in het [Algemeen Rijksambtenarenreglement][ref1]
      daaraan gelijkgestelde dag, is een aanvullend tarief verschuldigd van € 41 per uur per ambtenaar.

      2 Het in het eerste lid genoemde tarief is eveneens voor uitgevoerde onderzoeken in het buitenland buiten de daar
      ter plaatse geldende werktijden verschuldigd.


