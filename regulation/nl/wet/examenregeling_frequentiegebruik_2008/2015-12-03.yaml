        artikel: '18'
        paragraaf: '3'
  - number: '13'
    text: |-
      1 De Minister verleent op verzoek een basiscertificaat marifonie, indien de Minister heeft vastgesteld dat een
      kandidaat met goed gevolg het examen basiscertificaat marifonie heeft afgelegd.

      2 De Minister verleent op verzoek een beperkt certificaat maritieme radiocommunicatie, indien de Minister heeft
      vastgesteld dat een kandidaat met goed gevolg de examens voor het basiscertificaat marifonie en de module GMDSS-B
      heeft afgelegd.

      3 De Minister verleent op verzoek een algemeen certificaat maritieme radiocommunicatie, indien de Minister heeft
      vastgesteld dat een kandidaat met goed gevolg het examen voor het algemene certificaat maritieme radiocommunicatie
      heeft afgelegd.

      4 Een verzoek als bedoeld in het eerste tot en met derde lid wordt uiterlijk vijf jaar na het met goed gevolg
      afleggen van het examen ingediend.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel13
  - number: '14'
    text: |-
      De examens, bedoeld in [artikel 13, eerste, tweede en derde lid][ref1], voldoen aan respectievelijk de
      [bijlagen 3][ref2], [4][ref3] en [5][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0024285
      [ref3]: https://wetten.overheid.nl/BWBR0024285
      [ref4]: https://wetten.overheid.nl/BWBR0024285
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '13'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0024285
      - id: ref3
        bwb_id: BWBR0024285
      - id: ref4
        bwb_id: BWBR0024285
  - number: '15'
    text: |-
      1 Voor zover praktische vaardigheden deel uitmaken van het examen mag de termijn tussen het schriftelijk examen en
      het praktijkgedeelte ten hoogste vijf jaar bedragen.

      2 De tijdsduur van de examens als bedoeld in [artikel 13][ref1] bedraagt:

      a. voor het examen voor het basiscertificaat marifonie: maximaal zestig minuten;

      b. voor het examen voor de module GMDSS-B: maximaal dertig minuten;

      c. voor het examen voor het algemeen certificaat maritieme radiocommunicatie: minimaal dertig minuten en maximaal
      twee uur en dertig minuten, welke tijd als volgt wordt verdeeld over de onderdelen waarin examen wordt afgenomen:

      a. voorschriften, procedures en techniek: minimaal dertig minuten en maximaal negentig minuten;

      b. Engels: dertig minuten;

      c. topografie: dertig minuten.

      3 De Minister kan een kandidaat die een voltijdopleiding volgt aan een zeevaartschool, vrijstelling geven voor de
      onderdelen Engels en topografie, indien de kandidaat in het kader van zijn opleiding aan die zeevaartschool voor de
      toetsen op deze onderdelen voor elk onderdeel afzonderlijk tenminste een 6,0 heeft behaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel13
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '13'
        paragraaf: '3'
  - number: '16'
    text: |-
      1 Het schriftelijke examen geschiedt volgens het systeem van meerkeuze. Hierbij wordt slechts voor het juiste
      antwoord het daarbij behorende aantal punten van de vastgestelde waarderingsgraad toegekend. De kandidaat behaald
      een voldoende voor een onderdeel van het examen indien hij tenminste 70% van het totaal van de punten heeft
      behaald.

      2 Bij een praktijkexamen heeft een kandidaat het examen met goed gevolg afgelegd indien de Minister aan de hand
      van de door de examinerende instelling verstrekte gegevens heeft vastgesteld dat de kandidaat ten aanzien van het
      betreffende onder voldoende kennis bezit op het gebied van radiotechniek en de voorschriften.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel16
  - number: '17'
    text: |-
      Voor deelname aan een examen als bedoeld in [artikel 13][ref1] moet de kandidaat de leeftijd van elf jaar hebben
      bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel13
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '13'
        paragraaf: '3'
  - number: '18'
    text: |-
      1 De Minister erkent op verzoek geldige buitenlandse maritieme certificaten van bediening, indien de aanvrager kan
      aantonen dat de exameneisen van het buitenlandse examen overeenkomen met de eisen gesteld in de ERC/DEC (99)01 of
      in het Regionaal akkoord met betrekking tot de radiotelefoondienst voor de binnenvaart (Basel-overeenkomst, Stcrt.
      2003, 153).

      2 Het verzoek wordt door de kandidaat schriftelijk onderbouwd ingediend bij Agentschap Telecom van het Ministerie
      van Economische Zaken.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel18
  - number: '19'
    text: |-
      1 De Minister kan, in het kader van de door hem af te nemen examens, op aanvraag examinerende instellingen
      aanwijzen waar kandidaten hun examen feitelijk kunnen afleggen.

      2 De aanwijzing wordt afgegeven voor ten hoogste vijf jaar en is niet overdraagbaar.

      3 De Minister kan op aanvraag een aanwijzing verlengen met een door hem te bepalen termijn die niet langer is dan
      vijf jaar.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel19
  - number: '20'
    text: |-
      1 De aanvraag heeft betrekking op één of meer examensoorten.

      2 De Minister toetst de aanvraag aan de criteria, bedoeld in [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel21
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '21'
        paragraaf: '4'
  - number: '21'
    text: |-
      1 De aanvrager toont aan, voor zover mogelijk door het overleggen van stukken, dat hij ten tijde van het afnemen
      van de examens kan beschikken over de vereiste kennis en faciliteiten die noodzakelijk zijn voor de door hem af te
      nemen examens. De aanvrager voldoet in ieder geval aan de volgende criteria:

      a. de aanvrager beschikt over voldoende mogelijkheden om aan [bijlage 6][ref1] te voldoen.

      b. ten aanzien van examens genoemd in [artikel 8][ref2] en [artikel 13, eerste lid][ref3], beschikt de aanvrager
      ten minste over:

      1. geschikte ruimte;

      2. voldoende surveillanten.

      c. ten aanzien van de examens genoemd in [artikel 13, tweede en derde lid][ref4], beschikt de aanvrager bovendien
      over:

      1. toereikende technische middelen om de vaardigheden te toetsen;

      2. personen die op basis van een te overleggen certificaat, verkregen na het met goed gevolg afleggen van een
      examen genoemd in [artikel 13, tweede en derde lid][ref5], in staat worden geacht om de praktische vaardigheden
      te toetsen.


      [ref1]: https://wetten.overheid.nl/BWBR0024285
      [ref2]: https://wetten.overheid.nl/BWBR0024285#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0024285#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0024285#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0024285#Artikel13
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024285
      - id: ref2
        bwb_id: BWBR0024285
        artikel: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0024285
        artikel: '13'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0024285
        artikel: '13'
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0024285
        artikel: '13'
        paragraaf: '3'
  - number: '22'
    text: |-
      Indien de examinerende instelling niet meer voldoet aan de criteria op basis waarvan hij is aangewezen, bericht hij
      dit onverwijld schriftelijk aan de Minister.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel22
  - number: '23'
    text: |-
      1 De examinerende instelling neemt examens af in overeenstemming met [bijlage 6][ref1].

      2 De examinerende instelling verleent op verzoek van de Minister een bijdrage aan het actueel houden van de vragen
      uit examencategorieën waarvoor zij is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0024285
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024285
  - number: '24'
    text: |-
      De examinerende instelling neemt per examencategorie, waarvoor zij is aangewezen ten minste het volgens
      onderstaande tabel bepaalde aantal examens af.








                  Examensoort


                  Minimaal aantal af te nemen examens per jaar






                  Basiscertificaat marifonie


                  4




                  Module GMDSS-B


                  2




                  Algemeen certificaat maritieme radiocommunicatie


                  2




                  Examen categorie N


                  2




                  Examen categorie F


                  2
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel24
  - number: '25'
    text: |-
      De Minister kan de aanwijzing opschorten indien:

      a. de examinerende instelling naar oordeel van de Minister tijdelijk niet meer voldoet aan de criteria voor
      aanwijzing;

      b. de examinerende instelling tijdelijk niet geacht wordt in staat te zijn om examens af te nemen in
      overeenstemming met de procedurele eisen, bedoeld in [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024285
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0024285
  - number: '26'
    text: |-
      De Minister kan de aanwijzing geheel of gedeeltelijk intrekken indien:

      a. de examinerende instelling daarom verzoekt;

      b. de examinerende instelling gedurende een jaar niet het minimale aantal examens heeft afgenomen en ook niet
      aannemelijk is dat dit binnen afzienbare termijn nog zal gebeuren;

      c. de examinerende instelling tekort is geschoten bij de uitvoering van procedurele eisen als bedoeld
      [bijlage 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024285
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0024285
  - number: '27'
    text: In gevallen waarin deze regeling niet voorziet beslist de Minister.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel27
  - number: '28'
    text: |-
      1 Tot en met 31 augustus 2008 geldt ook als examinerende instelling:

      a. een instelling waarmee de Minister ter uitvoering van [artikel 39 van de Examenregeling frequentiegebruik][ref1]
      een overeenkomst heeft gesloten;

      b. de examencommissie, bedoeld in [artikel 30 van de Examenregeling frequentiegebruik][ref2].

      2 Vaststellingen van examenresultaten op basis van de [Examenregeling frequentiegebruik][ref3] of door
      instellingen, genoemd in het eerste lid, gelden als krachtens onderhavige regeling vastgestelde resultaten.


      [ref1]: https://wetten.overheid.nl/BWBR0010039#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0010039#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0010039
