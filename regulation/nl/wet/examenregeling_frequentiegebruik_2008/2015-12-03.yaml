  - number: '10'
    text: |-
      De examens hebben een tijdsduur van minimaal dertig minuten en van maximaal twee uur en worden schriftelijk
      afgenomen.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel10
  - number: '11'
    text: |-
      1 Het examen voor de categorie N bestaat uit veertig vragen met elk drie antwoordmogelijkheden. Indien de Minister
      heeft vastgesteld dat de kandidaat ten minste 29 vragen goed heeft beantwoord, heeft de kandidaat het examen met
      goed gevolg afgelegd.

      2 Het examen voor de categorie F bestaat uit vijftig vragen met vier antwoordmogelijkheden. Indien de Minister
      heeft vastgesteld dat de kandidaat ten minste 35 vragen goed heeft beantwoord, heeft de kandidaat het examen met
      goed gevolg afgelegd.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel11
  - number: '12'
    text: |-
      Aan de in [artikel 4, eerste lid, van de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend)
      of aan de in [artikel 5 Regeling aanvraag en toelating van vergunningen voor het gebruik van frequentieruimte][ref1]
      opgenomen voorwaarde dat de gebruiker dan wel vergunninghouder voor maritiemmobiele communicatie dient te
      beschikken over een certificaat van bediening is voldaan, indien:

      a. hij beschikt over het basiscertificaat marifonie, voor het gebruik van apparatuur waarbij in [bijlage 2, punt 5,
      van de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend) de aanduiding ‘X’ is geplaatst in
      de kolom ‘basiscertificaat’;

      b. hij beschikt over het beperkte certificaat maritieme radiocommunicatie, voor het gebruik van apparatuur
      waarbij in [bijlage 2, punt 5, van de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend) de
      aanduiding ‘X’ is geplaatst in de kolom ‘MARCOM B’;

      c. hij beschikt over het algemeen certificaat maritieme radiocommunicatie, voor het gebruik van apparatuur
      waarbij in [bijlage 2, punt 5, van de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend) de
      aanduiding ‘X’ is geplaatst in de kolom ‘MARCOM A’, of

      d. hij beschikt over een erkenning als bedoeld in [artikel 18, eerste lid][ref2], voor het betreffende
      frequentiegebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0015731#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0024285#Artikel18
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel12
