preamble:
  text: |-
    Gelet op de artikelen 11, eerste lid, onder b en c, en tweede lid, en 20, eerste lid, van het Frequentiebesluit en
    gelet op de artikelen 5 en 6 van het Besluit vergoedingen Telecommunicatiewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. examinerende instelling: een instelling die door de Minister is aangewezen om in het kader van deze regeling één
      of meerdere soorten examens feitelijk af te nemen;

      b. kandidaat: degene die zich voor deelneming aan een examen heeft aangemeld;

      c. HAREC-certificaat: geharmoniseerd amateurradiozendexamen certificaat (HAREC) als bedoeld in de Recommandatie T/R
      61-02 van de Conférence Européenne des Postes et des Télécommunications (CEPT);

      d. N-certificaat: een Amateur Radio Novice Examination Certificate als bedoeld in rapport nr. 32 van het European
      Radiocommunications Committee;

      e. GMDSS: Global Martime Distress and Safety System, het wereldwijde radiocommunicatiesysteem ten behoeve van de
      veiligheid van de scheepvaart;

      f. zeevaartschool: een door de Minister van Onderwijs, Cultuur en Wetenschap als zodanig erkende instelling, welke
      op MBO-niveau 3 en 4 een opleiding verzorgt op basis van crebo-codes, KOAS 91940/KOAL 91930 en Maritiem Officier op
      HBO-niveau, met credo-codes 34384;

      g. radiozendamateur: degene die vanuit een persoonlijke belangstelling en zonder financieel oogmerk gebruik maakt
      van frequentieruimte ten behoeve van het opdoen van vaardigheden, het communiceren via de radio en het doen van
      technisch onderzoekingen.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel1
  - number: '2'
    text: |-
      1 De Minister stelt de examenopgaven en de daarbij behorende juiste antwoorden vast.

      2 De Minister kan zelf examens afnemen.

      3 De Minister stelt voor elke deelnemer het resultaat van het examen vast.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel2
  - number: '3'
    text: |-
      Indien een examen door een kandidaat wordt afgelegd bij een examinerende instelling wordt de vergoeding voor het
      afnemen van het examen, door die kandidaat, voorafgaand aan het examen, aan die instelling voldaan.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel3
  - number: '4'
    text: |-
      1 Indien een kandidaat zich schuldig heeft gemaakt aan onregelmatigheden voor, tijdens of na een examen, kan de
      Minister het examen van de desbetreffende kandidaat ongeldig verklaren.

      2 Indien feiten of omstandigheden daartoe aanleiding geven, kan de Minister beslissen dat het examen geheel of
      gedeeltelijk opnieuw moet worden afgenomen.

      3 De Minister informeert de betrokken kandida(a)t(en) uiterlijk binnen tien werkdagen na de datum waarop het
      verslag, bedoeld in [bijlage 6][ref1], is opgemaakt, over de verdere gang van zaken met betrekking tot het
      geconstateerde voorval.


      [ref1]: https://wetten.overheid.nl/BWBR0024285
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024285
  - number: '5'
    text: |-
      1 Indien uitzonderlijke omstandigheden daartoe naar het oordeel van de Minister aanleiding geven, kan de Minister
      op verzoek toestemming geven voor het afnemen van een bijzonder examen.

      2 De toestemming is drie maanden geldig en wordt niet verlengd.

      3 Een verzoek voor het afleggen van een bijzonder examen wordt gemotiveerd bij de Minister ingediend. Indien nodig
      verzoekt de kandidaat gemotiveerd om een tijdsduur voor het afleggen van het examen die afwijkt van de tijdsduur
      als bedoeld in de [artikelen 10][ref1] en [15][ref2].

      4 De Minister bepaalt hoe het bijzondere examen wordt afgenomen en stelt zonodig eisen aan de examinator.

      5 De kandidaat heeft het bijzondere examen met goed gevolg afgelegd indien de Minister, in voorkomend geval aan
      de hand van de door een examinerende instelling verstrekte gegevens, heeft vastgesteld dat de kandidaat heeft
      aangetoond dat hij voldoende kennis en indien nodig voldoende vaardigheden bezit in relatie tot de op het examen
      van toepassing zijnde exameneisen.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0024285#Artikel15
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel5
    references:
      - id: ref1
