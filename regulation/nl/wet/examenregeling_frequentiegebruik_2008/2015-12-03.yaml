  - number: '6'
    text: Examens worden in Nederland afgenomen.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel6
  - number: '7'
    text: |-
      Een radiozendamateur voldoet aan de in
      [artikel 4, tweede lid, van de Regeling gebruik van frequentieruimte met meldingsplicht 2015][ref1] opgenomen
      voorwaarde dat hij met goed gevolg een examen afgelegd moet hebben, indien:

      a. de Minister heeft vastgesteld dat hij met goed gevolg een examen voor de categorie N heeft afgelegd, voor het
      gebruik van frequentiebanden die in [bijlage 1 van de Regeling gebruik van frequentieruimte met meldingsplicht
      2015](onbekend) zijn aangeduid met de categorie N;

      b. een andere administratie van de Conférence Européenne des Postes et des Télécommunications aan hem een
      certificaat of ander document heeft verstrekt dat gelijkwaardig is aan een N-certificaat, voor het gebruik van
      frequentiebanden die in [bijlage 1 van de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend)
      zijn aangeduid met de categorie N;

      c. een administratie die geen onderdeel uitmaakt van de Conférence Européenne des Postes et des Télécommunications
      en die is opgenomen in Annex 4 van ECC Recommendation (05) 06, aan hem een certificaat of ander document heeft
      verstrekt dat gelijkwaardig is aan een N-certificaat, voor het gebruik van frequentiebanden die in [bijlage 1 van
      de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend) zijn aangeduid met de categorie N;

      d. de Minister heeft vastgesteld dat een kandidaat met goed gevolg een examen voor de categorie F heeft afgelegd
      voor het gebruik van frequentiebanden die in [bijlage 1 van de Regeling gebruik van frequentieruimte met
      meldingsplicht 2015](onbekend) zijn aangeduid met de categorie F, of

      e. een andere administratie van de Conférence Européenne des Postes et des Télécommunications aan hem een HAREC-
      certificaat heeft verstrekt, voor het gebruik van frequentiebanden die in [bijlage 1 van de Regeling gebruik van
      frequentieruimte met meldingsplicht 2015](onbekend) zijn aangeduid met de categorie F;

      f. een administratie die geen onderdeel uitmaakt van de Conférence Européenne des Postes et des Télécommunications
      en die is opgenomen in Annex 4 van CEPT Recommendation T/R 61-02, aan hem een certificaat of ander document heeft
      verstrekt dat gelijkwaardig is aan een F-certificaat, voor het gebruik van frequentiebanden die in [bijlage 1 van
      de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend) zijn aangeduid met de categorie F.


      [ref1]: https://wetten.overheid.nl/BWBR0036375#Artikel4
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036375
        artikel: '4'
  - number: '8'
    text: |-
      1 De Minister verleent op verzoek een N-certificaat, indien de Minister heeft vastgesteld dat een kandidaat met
      goed gevolg een examen voor de categorie N heeft afgelegd.

      2 De Minister verstrekt op verzoek een HAREC-certificaat, indien de Minister heeft vastgesteld dat een kandidaat
      met goed gevolg een examen voor de categorie F heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0024285/2015-12-03#Artikel8
  - number: '9'
    text: |-
      De examens in de categorie N, genoemd in [artikel 7, onder a, b en c][ref1] en de examens in de categorie F,
      genoemd in [artikel 7, onder d, e en f][ref2], voldoen aan respectievelijk de [bijlagen 1][ref3] en [2][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel7
