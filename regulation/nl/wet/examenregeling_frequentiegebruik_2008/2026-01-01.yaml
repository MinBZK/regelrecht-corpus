  - number: '29'
    text: |-
      Examinerende instellingen die vóór het tijdstip van inwerkingtreding van de Regeling van de Minister van
      Economische Zaken en Klimaat van 24 mei 2023 tot wijziging van de Examenregeling frequentiegebruik 2008 in
      verband met de eerste fase van de overdracht van de uitvoering van de Examenregeling frequentiegebruik 2008 van De
      Rijksinspectie Digitale Infrastructuur aan het Centraal Bureau voor Rijvaardigheidsbewijzen (Stcrt. 2023, 14764)
      beschikten over een aanwijzing op grond van [artikel 19][ref1], zoals dat artikel luidde onmiddellijk vóór het
      tijdstip van inwerkingtreding van de hiervoor genoemde regeling, worden geacht te beschikken over een erkenning op
      grond van artikel 19, indien en voor zover deze aanwijzing voortduurt na dit tijdstip van inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel19
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel29
