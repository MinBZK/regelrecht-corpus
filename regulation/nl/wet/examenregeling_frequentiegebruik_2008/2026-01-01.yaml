  - number: 26b.1
    text: |-
      De vergoedingen, bedoeld in [artikel 26a][ref1] worden, voorafgaand aan het in behandeling nemen van de aanvraag,
      voldaan aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel26a
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: 26a
        paragraaf: 4a
  - number: 26b.2
    text: |-
      Indien een praktijkexamen wordt afgelegd bij een erkende instelling, worden de vergoedingen voor de
      praktijkexamens, bedoeld in [artikel 26a][ref1], in afwijking van het bepaalde in het eerste lid, voorafgaand aan
      het examen voldaan door de betreffende erkende instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel26a
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: 26a
        paragraaf: 4a
  - number: '27'
    text: In gevallen waarin deze regeling niet voorziet beslist de Minister.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel27
  - number: '28'
    text: |-
      Bij de vaststelling of examens met goed gevolg zijn afgelegd als bedoeld in de
      [artikelen 7, onderdelen a en d][ref1], [8][ref2], en [16][ref3], betrekt de minister tevens examens die vóór
      1 juli 2023 zijn afgelegd bij een instelling die op het moment van afname van het examen was aangewezen op
      grond van [artikel 19][ref4] zoals dat artikel luidde onmiddellijk vóór het tijdstip van inwerkingtreding van de
      Regeling van 24 mei 2023 tot wijziging van de Examenregeling frequentiegebruik 2008 in verband met de eerste fase
      van de overdracht van de uitvoering van de Examenregeling frequentiegebruik 2008 van de Rijksinspectie Digitale
      Infrastructuur aan het Centraal Bureau voor Rijvaardigheidsbewijzen (Stcrt. 2023, 14764).


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0024285#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0024285#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0024285#Artikel19
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel28
    references:
