    text: Deze regeling treedt in werking per 1 augustus 2008.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel32
  - number: '33'
    text: 'Deze regeling wordt aangehaald als: Examenregeling frequentiegebruik 2008.'
