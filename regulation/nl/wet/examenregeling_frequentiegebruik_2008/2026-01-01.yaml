  - number: '12'
    text: |-
      Aan de in [artikel 4, eerste lid, van de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend)
      of aan de in [artikel 5 Regeling aanvraag en toelating van vergunningen voor het gebruik van frequentieruimte][ref1]
      opgenomen voorwaarde dat de gebruiker dan wel vergunninghouder voor maritiemmobiele communicatie dient te
      beschikken over een certificaat van bediening is voldaan, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015731#Artikel5
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015731
        artikel: '5'
  - number: 12.a
    text: |-
      hij beschikt over het basiscertificaat marifonie, voor het gebruik van apparatuur waarbij in [bijlage 2, punt 5,
      van de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend) de aanduiding ‘X’ is geplaatst in
      de kolom ‘basiscertificaat’;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel12
  - number: 12.b
    text: |-
      hij beschikt over het beperkte certificaat maritieme radiocommunicatie, voor het gebruik van apparatuur waarbij in
      [bijlage 2, punt 5, van de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend) de aanduiding
      ‘X’ is geplaatst in de kolom ‘MARCOM B’;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel12
  - number: 12.c
    text: |-
      hij beschikt over het algemeen certificaat maritieme radiocommunicatie, voor het gebruik van apparatuur waarbij in
      [bijlage 2, punt 5, van de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend) de aanduiding
      ‘X’ is geplaatst in de kolom ‘MARCOM A’, of
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel12
  - number: 12.d
    text: |-
      hij beschikt over een erkenning als bedoeld in [artikel 18, eerste lid][ref1], voor het betreffende
      frequentiegebruik.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel18
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '18'
        paragraaf: '3'
  - number: '13.1'
    text: |-
      De minister verleent op verzoek een basiscertificaat marifonie, indien de minister heeft vastgesteld dat een
      kandidaat met goed gevolg het theorie-examen basiscertificaat marifonie heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel13
  - number: '13.2'
    text: |-
      De minister verleent op verzoek een beperkt certificaat maritieme radiocommunicatie, indien de minister heeft
      vastgesteld dat een kandidaat met goed gevolg het theorie-examen voor het basiscertificaat marifonie en de module
      GMDSS-B en het praktijkexamen voor het beperkt certificaat maritieme radiocommunicatie heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel13
  - number: '13.3'
    text: |-
      De minister verleent op verzoek een algemeen certificaat maritieme radiocommunicatie, indien de minister heeft
      vastgesteld dat een kandidaat met goed gevolg het theorie-examen voor de module voorschriften, procedures
      & techniek en voor de module Engels, alsmede het praktijkexamen voor het algemene certificaat maritieme
      radiocommunicatie heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel13
  - number: '13.4'
    text: |-
      Een verzoek als bedoeld in het eerste tot en met derde lid wordt uiterlijk vijf jaar na het met goed gevolg
      afleggen van het examen of de examens ingediend.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel13
  - number: '14.1'
    text: |-
      De examens, bedoeld in [artikel 13, eerste, tweede en derde lid][ref1], voldoen aan respectievelijk de eisen
      gesteld in het Regionaal akkoord ERC/DEC/(99)/01 Annex 1 en ERC/DEC/(99)/01 Annex 2.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel13
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '13'
        paragraaf: '3'
  - number: '14.2'
    text: |-
      Het theorie-examen basiscertificaat marifonie, bedoeld in [artikel 13, eerste lid][ref1], omvat de volgende
      onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel13
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '13'
        paragraaf: '3'
  - number: 14.2.a
    text: de algemene principes en basiskenmerken van de Maritime Mobile Service;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: 14.2.b
    text: kennis van het gebruik van de basisapparatuur van een scheepsstation;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: 14.2.c
    text: kennis van de operationele procedures, en
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: 14.2.d
    text: overige kennis en operationele procedures voor algemene communicatie.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: '14.3'
    text: |-
      Het theorie-examen basiscertificaat marifonie en de module GMDSS-B, bedoeld in [artikel 13, tweede lid][ref1],
      omvatten de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel13
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '13'
        paragraaf: '3'
  - number: 14.3.a
    text: kennis van de basiskenmerken van de Maritime Mobile Service en de Maritime Mobile-satellite service;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: 14.3.b
    text: kennis van de praktijk en vaardigheid in het gebruik van de basisapparatuur van een scheepsstation;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: 14.3.c
    text: |-
      kennis van de operationele procedures en uitgebreide vaardigheden met het GMDSS-systeem en subsystemen binnen
      zeegebied A1;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: 14.3.d
    text: overige kennis en vaardigheden en operationele procedures voor algemene communicatie, en
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: 14.3.e
    text: internationale en nationale regelgeving met betrekking tot de radiodienst.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: '14.4'
    text: |-
      Het theorie-examen algemene certificaat maritieme radiocommunicatie, bedoeld in [artikel 13, derde lid][ref1],
      omvat de volgende onderdelen:


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel13
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '13'
        paragraaf: '3'
  - number: 14.4.a
    text: kennis van de basiskenmerken van de Maritime Mobile Service en de Maritime Mobile-satellite service;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: 14.4.b
    text: kennis van de praktijk en vaardigheid in het gebruik van de basisapparatuur van een scheepsstation;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: 14.4.c
    text: |-
      grondige kennis van de operationele procedures en uitgebreide vaardigheden met het GMDSS-systeem en de subsystemen,
      en
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: 14.4.d
    text: overige kennis en vaardigheden, en operationele procedures voor algemene communicatie.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel14
  - number: '15'
    text: |-
      De minister kan een kandidaat die een voltijdopleiding volgt aan een zeevaartschool, vrijstelling geven voor het
      onderdeel Engels, indien de kandidaat in het kader van zijn opleiding aan die zeevaartschool voor de toets op dit
      onderdeel ten minste een 6,0 heeft behaald.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel15
  - number: '16'
    text: |-
      Bij een praktijkexamen heeft een kandidaat het examen met goed gevolg afgelegd indien de minister aan de hand
      van de door de erkende instelling verstrekte gegevens heeft vastgesteld dat de kandidaat ten aanzien van het
      betreffende over voldoende kennis bezit op het gebied van radiotechniek en de voorschriften.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel16
  - number: '17'
    text: |-
      Voor deelname aan een examen als bedoeld in [artikel 13][ref1] moet de kandidaat de leeftijd van elf jaar hebben
      bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel13
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '13'
        paragraaf: '3'
  - number: '18.1'
    text: 'De minister erkent op verzoek als geldige maritieme certificaten van bediening:'
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel18
  - number: 18.1.a
    text: |-
      een certificaat van bediening dat conform ERC/DEC (99)01, ECC/REC (10)03 of ERC/REC 31-04 is afgegeven door of
      namens een land dat lid is van de CEPT en de genoemde internationale afspraken heeft geïmplementeerd; of
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel18
  - number: 18.1.b
    text: |-
      een certificaat van bediening dat conform het Regionaal akkoord is afgegeven door of namens een land dat
      het Regionaal akkoord met betrekking tot de radiocommunicatiedienst voor de binnenvaart heeft ondertekend en
      geïmplementeerd.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het verzoek wordt door de kandidaat schriftelijk onderbouwd ingediend bij de Rijksinspectie Digitale Infrastructuur
      van het Ministerie van Economische Zaken en Klimaat.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel18
  - number: '19.1'
    text: De minister kan op aanvraag instellingen erkennen waar kandidaten het praktijkexamen afleggen.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel19
  - number: '19.2'
    text: De erkenning wordt afgegeven voor ten hoogste vijf jaar en is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel19
  - number: '19.3'
    text: |-
      De minister kan op aanvraag een erkenning verlengen met een door hem te bepalen termijn die niet langer is dan
      vijf jaar.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel19
  - number: '20.1'
    text: De aanvraag heeft betrekking op één of meer praktijkexamensoorten.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel20
  - number: '20.2'
    text: |-
      De Minister toetst de aanvraag aan de eisen, bedoeld in [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel21
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '21'
        paragraaf: '4'
  - number: '21.1'
    text: |-
      De aanvrager toont aan, voor zo ver mogelijk door het overhandigen van stukken, dat hij ten tijde van het afnemen
      van de praktijkexamens kan beschikken over de vereiste kennis en faciliteiten die noodzakelijk zijn voor het
      afnemen van de praktijkexamens.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel21
  - number: '21.2'
    text: 'De aanvrager:'
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel21
  - number: 21.2.a
    text: |-
      beschikt over voldoende mogelijkheden om te voldoen aan de eisen, genoemd in [artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel23
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '23'
        paragraaf: '4'
  - number: 21.2.b
    text: beschikt over een geschikte locatie binnen Nederland voor het afnemen van de praktijkexamens;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel21
  - number: 21.2.c
    text: |-
      is ingeschreven in het handelsregister, bedoeld in [artikel 2, van de Handelsregisterwet 2007][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel2
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '2'
  - number: 21.2.d
    text: is ingeschreven bij de minister als instelling voor het afnemen van praktijkexamens
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel21
  - number: '21.3'
    text: |-
      De minister stelt vast of is voldaan aan het bepaalde in het eerste lid, onder b, door middel van een schouw van
      de locatie.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel21
  - number: '22'
    text: |-
      Indien de erkende instelling niet meer voldoet aan het bepaalde in [artikel 21, tweede lid][ref1], bericht hij dit
      onverwijld aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel21
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '21'
        paragraaf: '4'
  - number: '23.1'
    text: 'De erkende instelling neemt bij het afnemen van praktijkexamens het volgende in acht:'
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
  - number: 23.1.a
    text: instructie en examen vinden niet op dezelfde dag plaats;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
  - number: 23.1.b
    text: de instelling ziet er op toe dat kandidaten zich op de juiste wijze legitimeren;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
  - number: 23.1.c
    text: de instelling neemt een door de minister te bepalen minimum- of maximumduur van de praktijkexamens in acht;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
  - number: 23.1.d
    text: de instelling voert een voldoende en juiste administratie vooraf, tijdens en na de praktijkexamens;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
  - number: 23.1.e
    text: |-
      de examens worden afgenomen in een locatie als bedoeld in [artikel 21, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel21
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '21'
        paragraaf: '4'
  - number: 23.1.f
    text: de gebruikte apparatuur is technisch toereikend voor het doel van het praktijkexamen;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
  - number: 23.1.g
    text: de instelling zorgt voor voldoende toezicht met het oog op een eerlijk en ordelijk verloop van de praktijkexamens;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
  - number: 23.1.h
    text: de instelling waarborgt de onafhankelijkheid en onpartijdigheid van de examinator;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
  - number: 23.1.i
    text: |-
      de examinator is geregistreerd door de instelling en beschikt over voldoende kennis en vaardigheden voor het
      afnemen van het praktijkexamen; en
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
  - number: 23.1.j
    text: |-
      de instelling deelt binnen een door de minister te bepalen termijn vóór afname van een praktijkexamen de datum,
      tijd en plaats van het praktijkexamen mee aan de minister.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
  - number: '23.2'
    text: |-
      Indien de instelling geen toepassing geeft aan het bepaalde in het eerste lid, onderdeel j en een examen afneemt,
      is het afgenomen examen ongeldig.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel23
  - number: '25'
    text: 'De minister kan de erkenning opschorten indien:'
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel25
  - number: 25.a
    text: |-
      de erkende instelling naar het oordeel van de minister niet meer voldoet aan het bepaalde in
      [artikel 21, tweede lid][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel21
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '21'
        paragraaf: '4'
  - number: 25.b
    text: |-
      de erkende instelling tekort is geschoten bij de uitvoering van het bepaalde in [artikel 23][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel23
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '23'
        paragraaf: '4'
  - number: '26'
    text: 'De minister kan de erkenning geheel of gedeeltelijk intrekken indien:'
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel26
  - number: 26.a
    text: |-
      de erkende instelling naar het oordeel van de minister niet meer voldoet aan het bepaalde in
      [artikel 21, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel21
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '21'
        paragraaf: '4'
  - number: 26.b
    text: |-
      de erkende instelling tekort is geschoten bij de uitvoering van het bepaalde in [artikel 23][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel23
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '23'
        paragraaf: '4'
  - number: 26.c
    text: de erkende instelling daarom verzoekt.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel26
