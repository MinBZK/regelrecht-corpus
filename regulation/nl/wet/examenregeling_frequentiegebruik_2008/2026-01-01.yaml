---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: examenregeling_frequentiegebruik_2008
regulatory_layer: WET
publication_date: '2025-12-03'
valid_from: '2026-01-01'
bwb_id: BWBR0024285
url: https://wetten.overheid.nl/BWBR0024285/2026-01-01
preamble:
  text: |-
    Gelet op de artikelen 11, eerste lid, onder b en c, en tweede lid, en 20, eerste lid, van het Frequentiebesluit en
    gelet op de artikelen 5 en 6 van het Besluit vergoedingen Telecommunicatiewet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel1
  - number: 1.a
    text: |-
      erkende instelling: een instelling die door de minister is erkend om in het kader van deze regeling één of meerdere
      examens feitelijk af te nemen;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel1
  - number: 1.b
    text: 'kandidaat: degene die zich voor deelneming aan een examen heeft aangemeld;'
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel1
  - number: 1.c
    text: |-
      HAREC-certificaat: geharmoniseerd amateurradiozendexamen certificaat (HAREC) als bedoeld in de Recommandatie T/R
      61-02 van de Conférence Européenne des Postes et des Télécommunications (CEPT);
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel1
  - number: 1.d
    text: |-
      N-certificaat: een Amateur Radio Novice Examination Certificate als bedoeld in rapport nr. 32 van het European
      Radiocommunications Committee;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel1
  - number: 1.e
    text: |-
      GMDSS: Global Martime Distress and Safety System, het wereldwijde radiocommunicatiesysteem ten behoeve van de
      veiligheid van de scheepvaart;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel1
  - number: 1.f
    text: |-
      zeevaartschool: een door de Minister van Onderwijs, Cultuur en Wetenschap als zodanig erkende instelling, welke
      op MBO-niveau 3 en 4 een opleiding verzorgt op basis van opleidingscodes 25679, 25677, 25680 en 25683, en op HBO-
      niveau met opleidingscode 34384;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel1
  - number: 1.g
    text: |-
      radiozendamateur: degene die vanuit een persoonlijke belangstelling en zonder financieel oogmerk gebruik maakt
      van frequentieruimte ten behoeve van het opdoen van vaardigheden, het communiceren via de radio en het doen van
      technisch onderzoekingen;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel1
  - number: 1.h
    text: 'minister: Minister van Economische Zaken en Klimaat;'
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel1
  - number: 1.i
    text: |-
      Regionaal akkoord: akkoord met betrekking tot de radiotelefoondienst voor de binnenvaart (Basel-overeenkomst,
      Stcrt. 2003, 153).
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel1
  - number: '2.1'
    text: 'De minister:'
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel2
  - number: 2.1.a
    text: |-
      stelt de theorie-examenopgaven, het vraagtype, de daarbij behorende juiste antwoorden, het aantal vragen, de
      tijdsduur en de minimumscore voor een geslaagd examen vast; en
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel2
  - number: 2.1.b
    text: kan de praktijkexamenopgaven en de juiste wijze van uitvoering daarvan vaststellen.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel2
  - number: '2.2'
    text: 'De minister:'
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel2
  - number: 2.2.a
    text: neemt de theorie-examens af; en
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel2
  - number: 2.2.b
    text: kan de praktijkexamens afnemen of door erkende instellingen laten afnemen.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel2
  - number: '4.1'
    text: |-
      Indien een kandidaat zich schuldig heeft gemaakt aan onregelmatigheden voor, tijdens of na een examen, kan de
      minister het examen van de desbetreffende kandidaat ongeldig verklaren.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien feiten of omstandigheden daartoe aanleiding geven, kan de minister beslissen dat het examen geheel of
      gedeeltelijk opnieuw moet worden afgenomen.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel4
  - number: '4.3'
    text: |-
      De minister informeert de betrokken kandidaat over de verdere gang van zaken met betrekking tot het geconstateerde
      voorval binnen een redelijke termijn na de datum waarop de minister het besluit, bedoeld in het eerste of tweede
      lid, heeft genomen.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel4
  - number: '6.1'
    text: Examens worden in Nederland afgenomen.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel6
  - number: '6.2'
    text: De kandidaat legitimeert zich voor de toelating tot een examen.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel6
  - number: '7'
    text: |-
      Een radiozendamateur voldoet aan de in
      [artikel 4, tweede lid, van de Regeling gebruik van frequentieruimte met meldingsplicht 2015][ref1] opgenomen
      voorwaarde dat hij met goed gevolg een examen afgelegd moet hebben, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0036375#Artikel4
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036375
        artikel: '4'
  - number: 7.a
    text: |-
      de minister heeft vastgesteld dat hij met goed gevolg een examen voor de categorie N heeft afgelegd, voor het
      gebruik van frequentiebanden die in [bijlage 1 van de Regeling gebruik van frequentieruimte met meldingsplicht
      2015](onbekend) zijn aangeduid met de categorie N;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel7
  - number: 7.b
    text: |-
      een andere administratie van de Conférence Européenne des Postes et des Télécommunications aan hem een certificaat
      of ander document heeft verstrekt dat gelijkwaardig is aan een N-certificaat, voor het gebruik van frequentiebanden
      die in [bijlage 1 van de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend) zijn aangeduid
      met de categorie N;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel7
  - number: 7.c
    text: |-
      een administratie die geen onderdeel uitmaakt van de Conférence Européenne des Postes et des Télécommunications
      en die is opgenomen in Annex 4 van ECC Recommendation (05) 06, aan hem een certificaat of ander document heeft
      verstrekt dat gelijkwaardig is aan een N-certificaat, voor het gebruik van frequentiebanden die in [bijlage 1 van
      de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend) zijn aangeduid met de categorie N;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel7
  - number: 7.d
    text: |-
      de minister heeft vastgesteld dat een kandidaat met goed gevolg een examen voor de categorie F heeft afgelegd voor
      het gebruik van frequentiebanden die in [bijlage 1 van de Regeling gebruik van frequentieruimte met meldingsplicht
      2015](onbekend) zijn aangeduid met de categorie F, of
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel7
  - number: 7.e
    text: |-
      een andere administratie van de Conférence Européenne des Postes et des Télécommunications aan hem een HAREC-
      certificaat heeft verstrekt, voor het gebruik van frequentiebanden die in [bijlage 1 van de Regeling gebruik van
      frequentieruimte met meldingsplicht 2015](onbekend) zijn aangeduid met de categorie F;
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel7
  - number: 7.f
    text: |-
      een administratie die geen onderdeel uitmaakt van de Conférence Européenne des Postes et des Télécommunications
      en die is opgenomen in Annex 4 van CEPT Recommendation T/R 61-02, aan hem een certificaat of ander document heeft
      verstrekt dat gelijkwaardig is aan een F-certificaat, voor het gebruik van frequentiebanden die in [bijlage 1 van
      de Regeling gebruik van frequentieruimte met meldingsplicht 2015](onbekend) zijn aangeduid met de categorie F.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel7
  - number: '8.1'
    text: |-
      De minister verleent op verzoek een N-certificaat, indien de minister heeft vastgesteld dat een kandidaat met goed
      gevolg een examen voor de categorie N heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      De minister verstrekt op verzoek een HAREC-certificaat, indien de minister heeft vastgesteld dat een kandidaat met
      goed gevolg een examen voor de categorie F heeft afgelegd.
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel8
  - number: '9.1'
    text: |-
      De examens in de categorie N, genoemd in [artikel 7, onder a, b en c][ref1] en de examens in de categorie F,
      genoemd in [artikel 7, onder d, e en f][ref2], voldoen aan respectievelijk de eisen, bedoeld in ERC Report 32 en
      CEPT Recommendation T/R 61-02.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0024285#Artikel7
    url: https://wetten.overheid.nl/BWBR0024285/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024285
        artikel: '7'
        paragraaf: '2'
