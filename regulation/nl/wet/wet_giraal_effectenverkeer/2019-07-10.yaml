$id: wet_giraal_effectenverkeer
regulatory_layer: WET
publication_date: '2020-07-17'
valid_from: '2019-07-10'
bwb_id: BWBR0003109
url: https://wetten.overheid.nl/BWBR0003109/2019-07-10
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is wettelijke bepalingen vast te stellen betreffende het
    giraal effectenverkeer;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aangesloten instelling:* rechtspersoon die
      als zodanig door een centraal instituut is toegelaten;
        - *centraal instituut:* een centrale effectenbewaarinstelling als bedoeld in artikel 2 van Verordening
      (EU) nr. 909/2014 van het Europees parlement en de Raad van 23 juli 2014 betreffende de verbetering van de
      effectenafwikkeling in de Europese Unie, betreffende centrale effectenbewaarinstellingen en tot wijziging van
      Richtlijnen 98/26/EG en 2014/65/EU en Verordening (EU) nr. 236/2012 (PbEU 2014, L 257);
        - *effect:* financieel instrument als bedoeld in onderdeel a, b of c van de definitie van financieel instrument in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] en een ander financieel instrument waarvan een centraal
      instituut heeft bepaald dat het tot een girodepot kan behoren;
        - *intermediair:* aangesloten instelling, beleggingsonderneming of bank in de zin van
      [artikel 1:1 van de Wet op het financieel toezicht][ref2] waaraan het op grond van die wet is toegestaan
      beleggingsdiensten te verlenen respectievelijk het bedrijf van bank uit te oefenen;
        - *Onze Minister:* Onze Minister van Financiën;
        - *verzamelbewijs:* document waarin effecten aan toonder van één soort zijn belichaamd die tot een verzameldepot of
      een girodepot behoren.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '7'
    text: |-
      Indien het een beleggingsonderneming of bank als bedoeld in de definitie van intermediair op grond van de
      [Wet op het financieel toezicht][ref1] niet langer is toegestaan zijn beroep of bedrijf uit te oefenen, geldt deze
      wet alsof de beleggingsonderneming of bank nog intermediair in de zin van deze wet is voor zover dit nodig is voor
      de afwikkeling van de bestaande verzameldepots.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '8.1'
    text: 'Effecten aan toonder behoren per soort slechts tot een verzameldepot of een girodepot indien zij:'
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel8
  - number: 8.1.a
    text: |-
      door middel van een verzamelbewijs in bewaring worden gegeven bij een intermediair onderscheidenlijk een centraal
      instituut;
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel8
  - number: 8.1.b
    text: |-
      ten name van een intermediair worden bewaard door een instelling in het buitenland waaraan het op grond van
      het op die instelling van toepassing zijnde recht is toegestaan ten name van cliënten rekeningen in effecten te
      administreren of aan te houden;
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel8
  - number: 8.1.c
    text: |-
      ten name van een centraal instituut worden bewaard door een instelling in het buitenland waaraan het op grond van
      het op die instelling van toepassing zijnde recht is toegestaan ten name van cliënten rekeningen in effecten te
      administreren of aan te houden; of
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel8
  - number: 8.1.d
    text: |-
      ten name van een intermediair onderscheidenlijk een centraal instituut worden bewaard door een in het buitenland
      gevestigd centraal instituut of een instelling in het buitenland met een vergelijkbare functie dat is erkend op
      grond van artikel 25, vierde tot en met elfde lid, van Verordening (EU) Nr. 909/2014 van het Europees parlement
      en de Raad van 23 juli 2014 betreffende de verbetering van de effectenafwikkeling in de Europese Unie, betreffende
      centrale effectenbewaarinstellingen en tot wijziging van Richtlijnen 98/26/EG en 2014/65/EU en Verordening (EU) nr.
      236/2012 (PbEU 2014, L 257).
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid zullen indien een buitenlands recht van toepassing is op effecten die behoren tot
      een verzameldepot en die anders dan door middel van een verzamelbewijs in bewaring worden gegeven, die effecten
      blijven behoren tot het desbetreffende verzameldepot indien dat buitenlands recht niet voorziet in de mogelijkheid
      van omzetting.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel8
  - number: 8a
    text: |-
      Tot een verzameldepot en een girodepot kunnen niet behoren effecten op naam voor de levering waarvan een notariële
      akte is voorgeschreven en waarvan tevens de overdraagbaarheid bij de statuten respectievelijk de voorwaarden van
      uitgifte is beperkt of uitgesloten, tenzij deze zijn toegelaten tot de handel op een handelsplatform als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] als bedoeld in artikel 1:1 van de Wet op het financieel
      toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 8b
    text: |-
      Indien effecten op naam zijn geleverd aan een intermediair of aan een centraal instituut, kan in het desbetreffende
      register van de uitgevende instelling, de naam en het adres van de intermediair onderscheidenlijk het centraal
      instituut worden opgenomen, met vermelding van de datum waarop die aandelen zijn gaan behoren tot het verzameldepot
      onderscheidenlijk girodepot, de datum van de erkenning of betekening, alsmede van het op ieder aandeel gestorte
      bedrag.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel8b
  - number: '9.1'
    text: Alleen een intermediair kan een verzameldepot in de zin van deze wet houden.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel9
  - number: '9.2'
    text: Ten aanzien van iedere soort effecten bestaat een afzonderlijk verzameldepot.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel9
  - number: '10'
    text: 'Tot een verzameldepot behoren:'
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel10
  - number: 10.a
    text: |-
      alle effecten van de betreffende soort die onder de intermediair berusten, voor de intermediair worden bewaard of
      aan de intermediair zijn geleverd, met uitzondering van effecten aan toonder ten aanzien waarvan de intermediair
      tot afzonderlijke bewaring verplicht is;
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel10
  - number: 10.b
    text: |-
      het ten name van de intermediair staande aandeel in het verzameldepot van effecten van de betreffende soort bij een
      andere intermediair;
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel10
  - number: 10.c
    text: |-
      het ten name van de aangesloten instelling staande aandeel in het in [hoofdstuk 3][ref1] bedoelde girodepot van
      effecten van de betreffende soort;


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003109
        hoofdstuk: '3'
  - number: 10.d
    text: |-
      het ten name van de intermediair staande tegoed terzake van effecten van de betreffende soort, dat wordt
      aangehouden bij een instelling in het buitenland;
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel10
  - number: 10.e
    text: |-
      in het geval dat effecten als bedoeld onder a verloren zijn gegaan, de rechten daaruit of de daarvoor in de plaats
      getreden vorderingen tot vergoeding, alsmede hetgeen uit hoofde daarvan is ontvangen;
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel10
  - number: 10.f
    text: |-
      alle overige goederen die geacht moeten worden in de plaats te zijn getreden van onder a bedoelde effecten, van een
      onder b of c bedoeld aandeel of van een onder d bedoeld tegoed.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel10
  - number: '11.1'
    text: De intermediair is belast met het beheer van het verzameldepot.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel11
  - number: '11.2'
    text: |-
      Hij kan tegenover derden de rechten van degenen aan wie het verzameldepot toebehoort, uitoefenen, indien dit voor
      een goed beheer dienstig kan zijn.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel11
  - number: '11.3'
    text: |-
      Het tweede lid is niet van toepassing op het recht tot bijeenroeping van een vergadering van aandeelhouders
      of houders van andere effecten, tot het bijwonen van en het woordvoeren in een zodanige vergadering, tot het
      uitoefenen van stemrecht en tot het doen instellen van een onderzoek naar het beleid en de gang van zaken van een
      rechtspersoon als bedoeld in [artikel 345 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel345
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '345'
  - number: '11.4'
    text: |-
      De intermediair is bevoegd tot een door hem gehouden verzameldepot behorende toonderstukken, te vervangen door een
      door de instelling die de effecten heeft uitgegeven terzake van die effecten af te geven verzamelbewijs. Op het
      verzamelbewijs wordt, indien van toepassing, vermeld dat de intermediair door een aantekening op het verzamelbewijs
      te plaatsen dit mede betrekking kan doen hebben op andere effecten van dezelfde soort, en kan bewerkstelligen dat
      het verzamelbewijs niet langer betrekking heeft op een of meer effecten waarop het voorafgaand aan de plaatsing van
      de aantekening betrekking had.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel11
  - number: '11.5'
    text: De intermediair is bevoegd effecten aan toonder als bedoeld in het vierde lid op naam te doen stellen.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel11
  - number: '11.6'
    text: |-
      De intermediair oefent de in het vierde en vijfde lid genoemde bevoegdheden uitsluitend uit met instemming van de
      instelling die de effecten heeft uitgegeven.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel11
  - number: '12.1'
    text: |-
      Bewaargeving van effecten aan toonder aan een intermediair of levering van effecten op naam aan een intermediair
      ter opname in het verzameldepot heeft tot gevolg dat degene aan wie de effecten toebehoorden op het tijdstip
      waarop zij door de intermediair ter bewaring in ontvangst zijn genomen dan wel aan de intermediair zijn geleverd,
      alsdan in het verzameldepot gerechtigd wordt als deelgenoot gezamenlijk met hen die daarin op dat tijdstip reeds
      gerechtigd waren. Voor zover de effecten bezwaard waren met een beperkt recht, komt dit op zijn aandeel te rusten.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel12
  - number: '12.2'
    text: |-
      Bewaargeving van effecten aan toonder of levering van effecten op naam door de instelling die de effecten heeft
      uitgegeven aan een intermediair ter opname van die effecten in een verzameldepot, heeft tot gevolg dat degene ten
      gunste van wie de effecten worden uitgegeven in het verzameldepot gerechtigd wordt als deelgenoot, gezamenlijk met
      hen die daarin op dat tijdstip reeds gerechtigd waren.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel12
  - number: '12.3'
    text: Het aandeel wordt berekend naar evenredigheid van de hoeveelheid van de in bewaring gegeven of geleverde effecten.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel12
  - number: '12.4'
    text: |-
      De vorige leden zijn ten aanzien van effecten aan toonder niet van toepassing indien de intermediair zich tot
      afzonderlijke bewaring heeft verplicht.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel12
  - number: '13'
    text: |-
      Indien effecten aan toonder uit anderen hoofde dan bewaargeving aan een intermediair worden toevertrouwd, zijn
      de bepalingen betreffende de in het eerste lid van het vorige artikel bedoelde bewaargeving van overeenkomstige
      toepassing, tenzij de rechtsverhouding meebrengt dat de intermediair tot afzonderlijke bewaring verplicht is.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel13
  - number: '14.1'
    text: |-
      Verkrijging van effecten door een intermediair uit hoofde van een levering door een beschikkingsonbevoegde
      heeft tot gevolg dat degene aan wie de effecten toebehoorden op het tijdstip waarop zij aan de intermediair
      zijn geleverd, alsdan in het verzameldepot gerechtigd wordt als deelgenoot gezamenlijk met hen die daarop op dat
      tijdstip reeds gerechtigd waren. Voor zover de effecten bezwaard waren met een beperkt recht, komt dit op zijn
      aandeel te rusten.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel14
  - number: '14.2'
    text: |-
      Indien de effecten aan toonder luiden en de intermediair de effecten te goeder trouw verkregen heeft, is het eerste
      lid niet van toepassing en is de overdracht van de effecten aan de intermediair geldig.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel14
  - number: '14.3'
    text: |-
      Indien de effecten op naam luiden is het eerste lid niet van toepassing en is de overdracht van de effecten aan
      de intermediair geldig indien de intermediair de effecten te goeder trouw heeft verkregen en de onbevoegdheid
      voortvloeit uit de ongeldigheid van een vroegere overdracht die niet het gevolg was van onbevoegdheid van de
      toenmalige overdrager.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel14
  - number: '15'
    text: |-
      De intermediair draagt desgewenst zorg dat de deelgenoten het aan de effecten verbonden stemrecht, ieder tot de
      hoeveelheid waarvoor hij in de aanwezige effecten deelgenoot is, kunnen uitoefenen.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel15
  - number: '16.1'
    text: |-
      Behoort een verzameldepot toe aan twee of meer deelgenoten, dan kan ieder over zijn aandeel daarin, of over een
      gedeelte van dat aandeel, beschikken. Een deelgenoot kan met instemming van de intermediair ook beschikken over
      een gedeelte van een effect, met dien verstande dat uitoefening van aan een aandeel, of van aan een gedeelte van
      dat aandeel verbonden stemrechten niet mogelijk is voor zover dat aandeel onderscheidenlijk dat gedeelte van dat
      aandeel niet overeenkomt met een of meer effecten.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel16
  - number: '16.2'
    text: Een deelgenoot kan niet beschikken over zijn aandeel in een tot een verzameldepot behorend goed afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel16
  - number: '17'
    text: |-
      Levering van een aandeel in een verzameldepot geschiedt door bijschrijving op naam van de verkrijger in het daartoe
      bestemde deel van de administratie van de intermediair.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel17
  - number: '18'
    text: |-
      Voor zover een bijschrijving van effecten geschiedt tot een grotere hoeveelheid dan waarover de intermediair
      bevoegd was te beschikken, maakt hij de verkrijger geen deelgenoot in het verzameldepot. Was de verkrijger te
      goeder trouw op het tijdstip dat hij van de bijschrijving kennis kreeg, dan wordt hij niettemin deelgenoot naar
      evenredigheid van de bijgeschreven hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel18
  - number: '19.1'
    text: |-
      Een overdracht van een aandeel aan de intermediair is ondanks onbevoegdheid van de vervreemder geldig, indien de
      intermediair te goeder trouw was op het tijdstip van de bijschrijving op zijn naam.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel19
  - number: '19.2'
    text: |-
      Een overdracht van een aandeel aan een ander dan de intermediair in opdracht van de in het vorige lid bedoelde
      vervreemder is geldig, indien de verkrijger te goeder trouw was op het tijdstip dat hij van de bijschrijving kennis
      kreeg.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel19
  - number: '20.1'
    text: |-
      Vestiging van een pandrecht op een aandeel in een verzameldepot ten behoeve van een ander dan de intermediair
      geschiedt door bijschrijving ten name van de pandhouder in de administratie van de intermediair.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel20
  - number: '20.2'
    text: |-
      Ondanks onbevoegdheid van de pandgever is de vestiging van het pandrecht geldig, indien de pandhouder op het
      tijdstip dat hij van de bijschrijving kennis kreeg, te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel20
  - number: '21.1'
    text: |-
      Vestiging van een pandrecht op een aandeel in een verzameldepot ten behoeve van de intermediair geschiedt door
      overeenkomst tussen de pandgever en de instelling.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel21
  - number: '21.2'
    text: |-
      Ondanks de onbevoegdheid van de pandgever is de vestiging van het pandrecht geldig, indien de pandhouder op het
      tijdstip van het ontstaan te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel21
  - number: '22'
    text: |-
      Onverminderd het bepaalde in [artikel 54 van Boek 7 van het Burgerlijk Wetboek][ref1], is de pandhouder in geval
      van verzuim van de schuldenaar bevoegd effecten van de desbetreffende soort en hoeveelheid, overeenkomstig de op de
      uitoefening van pandrecht op de betreffende soort effecten toepasselijke wettelijke bepalingen, te doen verkopen en
      vervolgens het daarmee corresponderende aandeel in het verzameldepot te doen leveren door bijschrijving als in deze
      wet bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel54
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '54'
  - number: '23'
    text: |-
      Vestiging van een vruchtgebruik op een aandeel in een verzameldepot geschiedt door bijschrijving ten name van de
      vruchtgebruiker in de administratie van de intermediair.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel23
  - number: '24'
    text: |-
      Indien onder een intermediair executoriaal derdenbeslag is gelegd op het aandeel van een deelgenoot in een
      verzameldepot, is de beslaglegger bevoegd effecten van de desbetreffende soort en hoeveelheid, overeenkomstig de
      op de executie van een beslag op de betreffende effecten toepasselijke wettelijke bepalingen, te doen verkopen en
      vervolgens het daarmee corresponderende aandeel in het verzameldepot te doen leveren door bijschrijving als in deze
      wet bedoeld.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel24
  - number: '25'
    text: |-
      Beslag onder een intermediair op een ten name van een andere intermediair staand aandeel in een verzameldepot is
      niet toegelaten.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel25
  - number: '26.1'
    text: |-
      Voor zover uitlevering op grond van het derde lid en het vierde lid mogelijk is, heeft een deelgenoot recht op
      uitlevering van de hoeveelheid effecten waarvoor hij deelgenoot is. Uitlevering van een gedeelte van een effect is
      niet mogelijk.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel26
  - number: '26.2'
    text: |-
      Is het verzameldepot niet toereikend om aan iedere deelgenoot de in het eerste lid bedoelde hoeveelheid effecten
      uit te leveren, dan levert de intermediair aan een deelgenoot slechts zoveel effecten uit als in verband met de
      rechten van de andere deelgenoten mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel26
  - number: '26.3'
    text: 'Effecten worden uit een verzameldepot slechts uitgeleverd:'
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel26
  - number: 26.3.a
    text: |-
      ter opname in een depot van een in het buitenland gevestigd centraal instituut of een buitenlandse instelling met
      een functie vergelijkbaar met die van een centraal instituut; of
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel26
  - number: 26.3.b
    text: |-
      ter opname in een verzameldepot van een andere intermediair of, indien de instelling die de effecten heeft
      uitgegeven daarmee heeft ingestemd, een depot van een instelling in het buitenland waaraan het op grond van
      het op die instelling van toepassing zijnde recht is toegestaan ten name van cliënten rekeningen in effecten te
      administreren, indien alle effecten van de desbetreffende soort worden uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel26
  - number: '26.4'
    text: |-
      In afwijking van het derde lid worden effecten op verzoek van een deelgenoot uit een verzameldepot uitgeleverd
      indien de uitlevering noodzakelijk is voor de deelgenoot om een aan de effecten verbonden recht uit te kunnen
      oefenen. De effecten worden onverwijld teruggeleverd ter opname in het verzameldepot zodra het niet langer
      noodzakelijk is voor de betreffende deelgenoot de effecten in eigen naam te houden voor het uitoefenen van het
      hiervoor bedoelde recht.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel26
  - number: '27.1'
    text: |-
      De verdeling van een verzameldepot dat niet toereikend is om aan iedere deelgenoot de hoeveelheid effecten,
      waarvoor hij deelgenoot is, te leveren, geschiedt overeenkomstig de volgende regels.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel27
  - number: '27.2'
    text: |-
      Aan ieder der deelgenoten worden naar evenredigheid van zijn aandeel zoveel effecten geleverd als in verband
      met de rechten van de andere deelgenoten mogelijk is. Blijft een hoeveelheid effecten over die voor een zodanige
      verdeling te klein is, dan worden zij, tenzij de deelgenoten anders overeenkomen en voor zover mogelijk, verkocht
      op een handelsplatform, als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] of een met een
      handelsplatform vergelijkbaar systeem uit een staat die geen lidstaat is en wordt de opbrengst onder de deelgenoten
      naar evenredigheid van ieders aandeel verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '27.3'
    text: |-
      Andere tot het verzameldepot behorende goederen worden op de daartoe meest geschikte wijze te gelde gemaakt en de
      opbrengst wordt onder de deelgenoten naar evenredigheid van ieders aandeel verdeeld.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel27
  - number: '28.1'
    text: |-
      Indien de intermediair die het verzameldepot houdt, zelf deelgenoot is, wordt hem bij toepassing van het voorgaande
      artikel slechts toegedeeld hetgeen overblijft, nadat de andere deelgenoten zoveel hebben ontvangen, dat zij niets
      meer uit hoofde van hun aandeel hebben te vorderen.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel28
  - number: '28.2'
    text: |-
      Het eerste lid geldt niet, indien de intermediair bewijst dat het tekort is ontstaan door omstandigheden die hem
      niet kunnen worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel28
  - number: '29'
    text: |-
      Levert de intermediair aan een deelgenoot meer effecten uit dan waartoe hij ingevolge de drie voorgaande artikelen
      bevoegd is, dan kan het teveel uitgeleverde door de intermediair worden teruggevorderd, tenzij de deelgenoot op het
      tijdstip van de uitlevering te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel29
  - number: '30.1'
    text: De intermediair is tot uitlevering bevoegd zonder medewerking van de andere deelgenoten.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel30
  - number: '30.2'
    text: |-
      Uitlevering van effecten aan toonder geschiedt door terbeschikkingstelling van de effecten aan de deelgenoot.
      Uitlevering van effecten op naam geschiedt door levering ter uitlevering uit het verzameldepot.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel30
  - number: '31.1'
    text: |-
      Voor zover uitlevering op grond van [artikel 26][ref1] mogelijk is, komt bij de uitlevering van effecten uit
      hoofde van een aandeel waarop een beperkt recht of beslag rust dit beperkte recht of beslag mede op de uitgeleverde
      effecten te rusten.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel26
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '26'
        hoofdstuk: '2'
  - number: '31.2'
    text: |-
      Het eerste lid is bij uitkering als bedoeld in [artikel 27, tweede lid, tweede volzin en derde lid][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel27
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '27'
        hoofdstuk: '2'
  - number: '32'
    text: |-
      Degene die overeenkomstig [artikel 12, eerste lid][ref1], een hoeveelheid effecten in bewaring heeft gegeven of
      heeft geleverd maar daarvoor geen deelgenoot is, wordt vermoed bevoegd te zijn de rechten van de deelgenoot uit de
      [artikelen 15][ref2], [26][ref3] en [27][ref4] uit te oefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0003109#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0003109#Artikel27
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '12'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003109
        artikel: '15'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0003109
        artikel: '26'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0003109
        artikel: '27'
        hoofdstuk: '2'
  - number: '33.1'
    text: |-
      In geval van faillissement van de intermediair is de curator belast met het beheer van het verzameldepot. Hij
      brengt het verzameldepot tot verdeling met inachtneming van de bepalingen van deze wet. Indien het bedrijf van de
      gefailleerde instelling overeenkomstig [artikel 98 van de Faillissementswet][ref1] wordt voortgezet, is de curator
      bevoegd tot verdeling van het verzameldepot over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel98
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '98'
  - number: '33.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ingeval de schuldsaneringsregeling natuurlijke
      personen ten aanzien van de intermediair van toepassing is, met dien verstande dat in de plaats van
      [artikel 98 van de Faillissementswet][ref1] wordt gelezen [artikel 311 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel311
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '98'
      - id: ref2
        bwb_id: BWBR0001860
        artikel: '311'
  - number: '34.1'
    text: Alleen een centraal instituut kan girodepots in de zin van deze wet houden.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel34
  - number: '34.2'
    text: Het centraal instituut bepaalt welke effecten tot een door hem gehouden girodepot kunnen behoren.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel34
  - number: '34.3'
    text: |-
      Het centraal instituut bepaalt welke effecten die tot een door hem gehouden girodepot kunnen behoren, voor de
      toepassing van deze wet als effecten van dezelfde soort worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel34
  - number: '34.4'
    text: Ten aanzien van iedere soort effecten die tot een girodepot kunnen behoren bestaat een afzonderlijk girodepot.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel34
  - number: '34.5'
    text: |-
      Een aangesloten instelling is bevoegd tot bewaargeving of levering ter opname in het girodepot van tot een
      verzameldepot behorende effecten aan een centraal instituut zonder de medewerking van de andere deelgenoten.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel34
  - number: '35'
    text: 'Tot een girodepot behoren:'
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel35
  - number: 35.a
    text: |-
      alle effecten van de betreffende soort die onder het centraal instituut berusten, voor het centraal instituut
      worden bewaard of aan het centraal instituut zijn geleverd;
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel35
  - number: 35.b
    text: |-
      het ten name van het centraal instituut staande tegoed terzake van effecten van de betreffende soort, dat wordt
      aangehouden bij instellingen in het buitenland;
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel35
  - number: 35.c
    text: |-
      in het geval dat effecten als bedoeld onder *a* verloren zijn gegaan, de rechten daaruit of de daarvoor in de
      plaats getreden vorderingen tot vergoeding, alsmede hetgeen uit hoofde daarvan is ontvangen;
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel35
  - number: 35.d
    text: |-
      alle overige goederen die geacht moeten worden in de plaats te zijn getreden van onder *a* bedoelde effecten of van
      een onder *b* bedoeld tegoed.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel35
  - number: '36.1'
    text: Een centraal instituut is belast met het beheer van de door hem gehouden girodepots.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel36
  - number: '36.2'
    text: |-
      Het centraal instituut kan tegenover derden de rechten van degenen aan wie een girodepot toebehoort, uitoefenen,
      indien dit voor een goed beheer dienstig kan zijn.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel36
  - number: '36.3'
    text: |-
      Het tweede lid is niet van toepassing op het recht tot bijeenroeping van een vergadering van aandeelhouders
      of houders van andere effecten, tot het bijwonen van en het woord voeren in een zodanige vergadering, tot het
      uitoefenen van stemrecht en tot het doen instellen van een onderzoek naar het beleid en de gang van zaken van een
      rechtspersoon, als bedoeld in [artikel 345 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel345
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '345'
  - number: '36.4'
    text: |-
      Het centraal instituut is bevoegd effecten aan toonder die tot een girodepot behoren te vervangen door een
      verzamelbewijs. Het centraal instituut kan bepalen dat in de tekst van een aldus door hem te verkrijgen
      verzamelbewijs een regeling is opgenomen als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel36
  - number: '36.5'
    text: |-
      Indien in de tekst van een verzamelbewijs dat tot een girodepot behoort een daartoe strekkende regeling is
      opgenomen, kan het centraal instituut door een aantekening op het stuk te plaatsen dit mede betrekking doen hebben
      op een of meer andere effecten van dezelfde soort, dan wel bewerkstelligen dat het stuk niet langer betrekking
      heeft op een of meer van de effecten waarop het voorafgaand aan de plaatsing van de aantekening betrekking had.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel36
  - number: '36.6'
    text: |-
      Het centraal instituut is bevoegd tot een girodepot behorende effecten die aan toonder luiden, op naam te doen
      stellen.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel36
  - number: '36.7'
    text: |-
      Het centraal instituut oefent de in het vierde tot en met zesde lid genoemde bevoegdheden uitsluitend uit met
      instemming van de instelling die de effecten heeft uitgegeven.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel36
  - number: '37.1'
    text: Alleen een aangesloten instelling kan effecten in bewaring hebben of aanhouden bij een centraal instituut.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel37
  - number: '37.2'
    text: |-
      De rechten jegens het centraal instituut worden door de aangesloten instelling op eigen naam uitgeoefend voor hen
      aan wie de effecten toebehoren.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel37
  - number: '38.1'
    text: |-
      Zij aan wie de in bewaring gegeven effecten aan toonder of ter opname in een girodepot geleverde effecten op naam
      toebehoorden op het tijdstip waarop zij door het centraal instituut ter bewaring in ontvangst zijn genomen dan wel
      aan het centraal instituut zijn geleverd, worden vanaf dat tijdstip in het girodepot gerechtigd als deelgenoten,
      gezamenlijk met hen die in dat girodepot op het tijdstip van de bewaargeving of levering reeds gerechtigd waren.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel38
  - number: '38.2'
    text: |-
      Bewaargeving van effecten aan toonder of levering van effecten op naam door de instelling die de effecten heeft
      uitgegeven aan een centraal instituut ter opname van die effecten in een girodepot, heeft tot gevolg dat de
      aangesloten instelling ten gunste van wie de effecten worden bijgeschreven, alsdan in het girodepot gerechtigd
      wordt als deelgenoot, gezamenlijk met hen die daarinop dat tijdstip reeds gerechtigd waren. De effecten
      makenvanaf het moment van opname in het girodepot deel uit van de verzameldepots van de desbetreffende aangesloten
      instellingen.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel38
  - number: '38.3'
    text: Het aandeel in een girodepot staat op naam van de aangesloten instelling.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel38
  - number: '38.4'
    text: |-
      Het aandeel wordt berekend naar evenredigheid van de hoeveelheid van de door de aangesloten instelling ingebrachte
      of geleverde effecten, dan wel door de instelling die de effecten heeft uitgegeven overeenkomstig het tweede lid
      geleverde effecten.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel38
  - number: '39'
    text: |-
      Een centraal instituut draagt zorg dat de aangesloten instellingen kunnen voldoen aan hun in [artikel 15][ref1]
      bedoelde verplichting ten aanzien van het aan de effecten verbonden stemrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel15
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '15'
        hoofdstuk: '2'
  - number: '40.1'
    text: |-
      Het ten name van een aangesloten instelling staande aandeel in een girodepot is overdraagbaar. Een gedeelte van
      zodanig aandeel is eveneens overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel40
  - number: '40.2'
    text: Het aandeel in een tot een girodepot behorend goed afzonderlijk is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel40
  - number: '41.1'
    text: |-
      Levering tussen aangesloten instellingen van een aandeel in een girodepot geschiedt door bijschrijving op naam van
      de verkrijgende instelling in het daartoe bestemde deel van de administratie van het centraal instituut.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel41
  - number: '41.2'
    text: |-
      Ondanks onbevoegdheid van die instelling is een overdracht van een aandeel geldig, indien de verkrijgende
      instelling op het tijdstip dat zij van de bijschrijving kennis kreeg, te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel41
  - number: '42.1'
    text: |-
      Vestiging van een pandrecht ten behoeve van een andere aangesloten instelling op een aandeel in een girodepot
      geschiedt door bijschrijving ten name van de andere instelling in de administratie van het centraal instituut.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel42
  - number: '42.2'
    text: |-
      [Artikel 20, tweede lid][ref1], en [artikel 22][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel22
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '20'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003109
        artikel: '22'
        hoofdstuk: '2'
  - number: '43.1'
    text: |-
      Een centraal instituut is verplicht van een door hem verrichte bijschrijving terstond een kennisgeving te zenden
      aan de aangesloten instelling op wier naam de bijschrijving heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel43
  - number: '43.2'
    text: Van het voorgaande lid kan niet bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel43
  - number: '44'
    text: |-
      Beslag onder een centraal instituut op een ten name van een aangesloten instelling staand aandeel in een girodepot
      is niet toegelaten.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel44
  - number: '45.1'
    text: |-
      Voor zover uitlevering op grond van het derde lid en het vierde lid mogelijk is, heeft een aangesloten instelling
      recht op uitlevering van de haar toekomende hoeveelheid effecten. Uitlevering van een gedeelte van een effect is
      niet mogelijk.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel45
  - number: '45.2'
    text: |-
      Is het girodepot niet toereikend om aan iedere aangesloten instelling de in het eerste lid bedoelde hoeveelheid
      effecten uit te leveren, dan levert het centraal instituut aan een aangesloten instelling slechts zoveel effecten
      uit als in verband met de rechten van de andere aangesloten instellingen mogelijk is.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel45
  - number: '45.3'
    text: 'Effecten worden uit een girodepot slechts uitgeleverd:'
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel45
  - number: 45.3.a
    text: |-
      ter opname in een depot van een in het buitenland gevestigd centraal instituut of een buitenlandse instelling met
      een functie vergelijkbaar met die van een centraal instituut; of
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel45
  - number: 45.3.b
    text: |-
      ter opname in een verzameldepot van een intermediair of, indien de instelling die de effecten heeft uitgegeven
      daarmee heeft ingestemd, een depot van een instelling in het buitenland waaraan het op grond van het op die
      instelling van toepassing zijnde recht is toegestaan ten name van cliënten rekeningen in effecten te administreren,
      indien alle effecten van de desbetreffende soort worden uitgeleverd.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel45
  - number: '45.4'
    text: |-
      In afwijking van het derde lid worden effecten op verzoek van een aangesloten instelling uit een girodepot
      uitgeleverd indien de uitlevering noodzakelijk is voor de deelgenoot om een aan de effecten verbonden recht uit te
      kunnen oefenen. De effecten worden onverwijld teruggeleverd ter opname in het verzameldepot zodra het niet langer
      noodzakelijk is voor de betreffende deelgenoot de effecten in eigen naam te houden voor het uitoefenen van het
      hiervoor bedoelde recht.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel45
  - number: '46'
    text: |-
      De verdeling van een girodepot dat niet toereikend is om aan iedere instelling de haar toekomende hoeveelheid
      effecten uit te leveren, geschiedt door overeenkomstige toepassing van [artikel 27, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel27
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '27'
        hoofdstuk: '2'
  - number: '47'
    text: |-
      Levert een centraal instituut aan een instelling meer effecten uit dan waartoe het ingevolge de vorige twee
      artikelen bevoegd is, dan kan het teveel uitgeleverde door het centraal instituut worden teruggevorderd, tenzij de
      instelling op het tijdstip van de uitlevering te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel47
  - number: '48'
    text: |-
      Een centraal instituut is tot uitlevering bevoegd zonder medewerking van de andere instellingen op wier naam
      aandelen in het girodepot staan.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel48
  - number: '49.1'
    text: |-
      Bij uitlevering van effecten uit hoofde van een aandeel waarop een pandrecht rust, komt dit pandrecht mede op de
      uitgeleverde effecten te rusten.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49
  - number: '49.2'
    text: |-
      Het eerste lid is bij uitkeringen als bedoeld in [artikel 27, tweede lid, tweede zin, en derde lid][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel27
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '27'
        hoofdstuk: '2'
  - number: 49a
    text: |-
      Voor de toepassing van het ingevolge dit hoofdstuk bepaalde wordt verstaan onder:
        - *effecten met een aandelenkarakter:* 1°. verhandelbare aandelen als bedoeld in
      [artikel 79, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]; 2°. verhandelbare aandelen die zijn
      uitgegeven door een rechtspersoon, opgericht naar het recht van een andere staat dan Nederland, die gelijk te
      stellen zijn met aandelen als bedoeld onder 1°; 3°. certificaten van aandelen of andere met certificaten van
      aandelen gelijk te stellen verhandelbare waardebewijzen;
        - *instelling in het buitenland:* een instelling met zetel in het buitenland waaraan het op grond van het op die
      instelling van toepassing zijnde recht is toegestaan ten name van cliënten rekeningen in effecten te administreren
      of aan te houden.
        - *aandeelhouder:* 1°. degene die voor eigen rekening een tegoed, luidend in effecten met een aandelenkarakter
      aanhoudt bij een aangesloten instelling, intermediair of instelling in het buitenland, of 2°. beheerder van een
      belegginginstelling als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2].
        - *uitgevende instelling:* naamloze vennootschap naar Nederlands recht of een rechtspersoon
      opgericht naar het recht van een andere staat dan Nederland, niet zijnde een beleggingsinstelling
      als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3], waarvan effecten zijn
      toegelaten tot de handel op een gereglementeerde markt waarvoor een vergunning als bedoeld in
      [artikel 5:26, eerste lid, van de Wet op het financieel toezicht][ref4] is verleend, of op een
      georganiseerde handelsfaciliteit of multilaterale handelsfaciliteit waarvoor een vergunning als bedoeld in
      [artikel 2:96 van de Wet op het financieel toezicht][ref5] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '79'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0020368
        artikel: '1'
