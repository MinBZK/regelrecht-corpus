        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 49b.1
    text: 'Een uitgevende instelling kan:'
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49b
  - number: 49b.1.a
    text: |-
      een centraal instituut schriftelijk verzoeken tot verstrekking van de naam, het adres, en, indien aanwezig,
      het e-mailadres van iedere aangesloten instelling die als deelgenoot in het girodepot gerechtigd is tot door de
      uitgevende instelling of met haar medewerking uitgegeven effecten met een aandelenkarakter, alsmede van het tegoed
      van iedere aangesloten instelling luidend in zodanige effecten in dat girodepot;
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49b
  - number: 49b.1.b
    text: |-
      een intermediair van wie de uitgevende instelling weet of redelijkerwijs mag aannemen dat deze een verzameldepot
      houdt van door de uitgevende instelling of met haar medewerking uitgegeven effecten met een aandelenkarakter,
      schriftelijk verzoeken tot verstrekking van de naam, het adres en, indien aanwezig, het e-mailadres van iedere
      deelgenoot in dat verzameldepot alsmede van het tegoed van iedere deelgenoot luidend in zodanige effecten in dat
      verzameldepot;
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49b
  - number: 49b.1.c
    text: |-
      een instelling in het buitenland van wie de uitgevende instelling weet of redelijkerwijs mag aannemen dat zij,
      beroepsmatig en anders dan als aandeelhouder, door de uitgevende instelling of met haar medewerking uitgegeven
      effecten met een aandelenkarakter bewaart, administreert of aanhoudt, schriftelijk verzoeken tot verstrekking van
      de naam, het adres, het tegoed luidend in zodanige effecten en, indien aanwezig, het e-mailadres van iedere cliënt
      voor wie zij een tegoed luidend in effecten met een aandelenkarakter bewaart, administreert of aanhoudt alsmede van
      het tegoed van iedere cliënt luidend in zodanige effecten dat bij de instelling wordt aangehouden; of
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49b
  - number: 49b.1.d
    text: |-
      een bewaarder van een beleggingsinstelling als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1]
      van wie de uitgevende instelling weet of redelijkerwijs mag aannemen dat hij door de uitgevende instelling of met
      haar medewerking uitgegeven effecten met een aandelenkarakter bewaart, administreert of aanhoudt, schriftelijk
      verzoeken tot verstrekking van de naam, het adres en, indien aanwezig, het e-mailadres van de beheerder van die
      beleggingsinstelling alsmede van het tegoed van de beheerder luidend in zodanige effecten dat bij de bewaarder
      wordt aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 49b.2
    text: |-
      Degene tot wie het verzoek als bedoeld in het eerste lid zich richt, verstrekt geen informatie over aandeelhouders
      die elk minder dan een tweehonderdste deel van het geplaatste kapitaal van een uitgevende instelling
      vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49b
  - number: 49b.3
    text: |-
      De uitgevende instelling doet een verzoek als bedoeld in het eerste lid alleen in een periode vanaf zestig dagen
      tot en met de dag van een algemene vergadering van aandeelhouders. De uitgevende instelling vermeldt in het verzoek
      de peildatum waarop het verzoek, bedoeld in het eerste lid, is gericht.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49b
  - number: 49b.4
    text: |-
      Degene tot wie het verzoek, bedoeld in het eerste lid, is gericht, beantwoordt dit binnen drie werkdagen na
      ontvangst door middel van verstrekking van de verzochte gegevens of een verklaring dat hij geen door of met
      medewerking van de verzoeker uitgegeven effecten met een aandelenkarakter administreert of aanhoudt. Indien de
      geadresseerde wegens omstandigheden die buiten zijn macht liggen niet in staat is tot beantwoording binnen de
      genoemde termijn informeert hij de verzoeker daarover binnen drie werkdagen na ontvangst van het verzoek, onder
      vermelding van de reden en de termijn waarbinnen het verzoek beantwoord zal worden. De termijn bedraagt maximaal
      zeven werkdagen gerekend vanaf het moment van ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49b
  - number: 49b.5
    text: |-
      Op schriftelijk verzoek, gedaan in een periode vanaf zestig dagen tot de tweeënveertigste dag voor die van
      de algemene vergadering, van een aandeelhouder die op het moment van het verzoek alleen of gezamenlijk met
      andere aandeelhouders tenminste een tiende gedeelte van het geplaatste kapitaal van een uitgevende instelling
      vertegenwoordigt, identificeert de uitgevende instelling aandeelhouders van door haar of met haar medewerking
      uitgegeven effecten met een aandelenkarakter door middel van het doen van verzoeken als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49b
  - number: 49b.6
    text: |-
      Uiterlijk op het moment van het eerste verzoek als bedoeld in het eerste lid doet de uitgevende instelling hierover
      een mededeling op haar website, onder vermelding van de mogelijkheid van verzending van informatie overeenkomstig
      [artikel 49c][ref1], de mogelijke data van die verzending en de uiterlijke data voor terbeschikkingstelling van
      informatie door aandeelhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49c
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49b
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49c
        hoofdstuk: 3a
  - number: 49b.7
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop een verzoek op grond van
      het eerste of vijfde lid wordt gedaan en beantwoord.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49b
  - number: 49c.1
    text: |-
      Op schriftelijk verzoek van een aandeelhouder die alleen of gezamenlijk met andere aandeelhouders tenminste een
      honderdste gedeelte van het geplaatste kapitaal van een uitgevende instelling vertegenwoordigt of rechthebbende is
      op een bedrag van aandelen of certificaten daarvan met een gezamenlijke waarde van tenminste € 250 000, verzendt
      de uitgevende instelling, indien deze beschikt over op grond van [artikel 49b, eerste lid, onder b, c of d][ref1],
      verkregen gegevens, door de aandeelhouder ter beschikking gestelde informatie welke verband houdt met een onderwerp
      dat is geagendeerd voor de algemene vergadering aan de aandeelhouders van de uitgevende instelling. De uitgevende
      instelling verzendt de informatie met de meeste spoed, in elk geval binnen drie werkdagen na ontvangst van het
      verzoek of plaatst deze informatie met de meeste spoed, in elk geval binnen drie werkdagen, op haar website, waar
      deze informatie tenminste tot en met de dag van de algemene vergadering beschikbaar wordt gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49b
        hoofdstuk: 3a
  - number: 49c.2
    text: |-
      In afwijking van het eerste lid is de uitgevende instelling niet verplicht tot verzending van informatie die minder
      dan zeven werkdagen voor de algemene vergadering door haar wordt ontvangen.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49c
  - number: 49c.3
    text: |-
      Indien een uitgevende instelling ter uitvoering van het eerste lid informatie verzendt, vermeldt zij de naam van
      de verzoeker.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49c
  - number: 49c.4
    text: 'In afwijking van het eerste lid is een uitgevende instelling evenmin verplicht informatie te verzenden:'
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49c
  - number: 49c.4.a
    text: waarvan een onjuist of misleidend signaal uitgaat of te duchten is met betrekking tot de uitgevende instelling; of
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49c
  - number: 49c.4.b
    text: |-
      die van zodanige aard is dat verzending naar maatstaven van redelijkheid en billijkheid niet van de uitgevende
      instelling kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49c
  - number: 49c.5
    text: |-
      De uitgevende instelling plaatst informatie die zij uit eigen beweging of op schriftelijk verzoek van een
      aandeelhouder heeft verzonden onverwijld na verzending op haar website. De uitgevende instelling houdt de
      informatie gedurende tenminste een jaar op de website toegankelijk.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49c
  - number: 49c.6
    text: |-
      Voor de toepassing van dit artikel wordt als aandeelhouder beschouwd degene die aandeelhouder is op de peildatum
      die is vermeld in het laatst gedane verzoek, bedoeld in [artikel 49b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49b
        hoofdstuk: 3a
  - number: 49c.7
    text: |-
      Indien door de aandeelhouder, bedoeld in het zesde lid, een overeenkomst is gesloten met een derde op grond waarvan
      deze derde naar eigen goeddunken stemmen kan uitbrengen en de aandeelhouder informatie van de uitgevende instelling
      ontvangt, verstrekt hij de naam, het adres en het emailadres van de derde aan de uitgevende instelling en stuurt
      hij de informatie die van de uitgevende instelling is ontvangen onverwijld door aan de derde.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49c
  - number: 49c.8
    text: |-
      Indien door de aandeelhouder, bedoeld in het zesde lid, toepassing is gegeven aan [artikel 88, derde lid][ref1],
      onderscheidenlijk [89, derde lid, van boek 2 van het Burgerlijk Wetboek][ref2] en de aandeelhouder informatie van
      de uitgevende instelling ontvangt, verstrekt hij de naam, het adres en het emailadres van de vruchtgebruiker of
      pandhouder aan de uitgevende instelling en stuurt hij de informatie die van de uitgevende instelling is ontvangen
      onverwijld door aan de vruchtgebruiker of pandhouder.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel89
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49c
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '89'
  - number: 49c.9
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor de wijze waarop het in het eerste lid bedoelde verzoek
      wordt gedaan en de wijze waarop een uitgevende instelling hieraan uitvoering geeft.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49c
  - number: 49d.1
    text: |-
      De uitgevende instelling is verplicht tot geheimhouding van de in [artikel 49b, eerste lid][ref1] en
      [artikel 49c, zevende en achtste lid][ref2] bedoelde gegevens, waarvan zij kennis neemt en verwerkt deze gegevens
      op een behoorlijke en zorgvuldige wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel49c
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49d
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49b
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0003109
        artikel: 49c
        hoofdstuk: 3a
  - number: 49d.2
    text: |-
      Indien een uitgevende instelling aan een derde volmacht heeft verleend om namens haar een verzoek als bedoeld
      in [artikel 49b, eerste lid][ref1], te doen en de verzochte gegevens te ontvangen, is deze derde verplicht tot
      geheimhouding van de in artikel 49b, eerste lid en [artikel 49c, zevende en achtste lid][ref2], bedoelde gegevens
      waarvan hij kennis neemt en verwerkt deze gegevens op een behoorlijke en zorgvuldige wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel49c
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49d
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49b
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0003109
        artikel: 49c
        hoofdstuk: 3a
  - number: 49d.3
    text: |-
      De uitgevende instelling of, indien van toepassing, de derde aan wie de uitgevende instelling een volmacht heeft
      verleend om namens haar een verzoek als bedoeld in [artikel 49b, eerste lid][ref1], te doen, verwerkt de in
      artikel 49b, eerste lid en [artikel 49c, zevende en achtste lid][ref2], bedoelde gegevens niet verder op een wijze
      die onverenigbaar is met de doeleinden waarvoor ze zijn verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel49c
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49d
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49b
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0003109
        artikel: 49c
        hoofdstuk: 3a
  - number: 49d.4
    text: |-
      De uitgevende instelling of, indien van toepassing, de derde aan wie de uitgevende instelling een volmacht
      heeft verleend om namens haar een verzoek als bedoeld in [artikel 49b, eerste lid][ref1], te doen, legt
      passende technische en organisatorische maatregelen ten uitvoer om de in de in artikel 49b, eerste lid en
      [artikel 49c, zevende en achtste lid][ref2], bedoelde gegevens te beveiligen tegen verlies of enige vorm van
      onrechtmatige verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel49c
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49d
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49b
        hoofdstuk: 3a
      - id: ref2
        bwb_id: BWBR0003109
        artikel: 49c
        hoofdstuk: 3a
  - number: 49e.1
    text: |-
      Indien een verzoek als bedoeld in [artikel 49b, eerste lid, onderdeel a, b of d][ref1], geheel of gedeeltelijk
      niet wordt beantwoord, kan de rechtbank binnen wiens arrondissement de uitgevende instelling die het verzoek heeft
      gedaan is gevestigd, op vordering van die uitgevende instelling of een derde aan wie de uitgevende instelling een
      volmacht heeft verleend degene tot wie het verzoek is gericht bevelen het gedane verzoek na te komen.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49e
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49b
        hoofdstuk: 3a
  - number: 49e.2
    text: |-
      De bevoegdheid om de vordering in te stellen vervalt door verloop van drie maanden vanaf de dag waarop de
      uitgevende instelling van de niet-beantwoording kennis heeft genomen of heeft kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49e
  - number: 49f
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder: - *centrale tegenpartij:* centrale tegenpartij als
      bedoeld in artikel 2 van verordening (EU) nr. 648/2012 (EMIR);
        - *cliënt:* degene voor wie een tussenpersoon een derivatenpositie aangaat of beheert;
        - *cliëntpositie:* derivatenpositie die een tussenpersoon houdt voor een cliënt;
        - *corresponderende positie:* de derivatenpositie die een tussenpersoon met een derde is aangegaan in verband met
      het aangaan van een cliëntpositie, en die overeenkomt met de betreffende cliëntpositie;
        - *derivatenpositie:* de rechten en verplichtingen die voortvloeien uit een financieel
      instrument als bedoeld in onderdeel d tot en met j van de definitie van financieel instrument in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1], voor zover die rechten en verplichtingen betrekking
      hebben op de bedingen die de kern van de prestaties aangeven;
        - *derivatenvermogen:* afgescheiden deel van het vermogen van een tussenpersoon waartoe alle corresponderende
      posities behoren alsmede alle rechten en verplichtingen met betrekking tot het stellen van zekerheid ten behoeve
      van corresponderende posities;
        - *tussenpersoon:* beleggingsonderneming, bank of clearinginstelling als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2], met zetel in Nederland waaraan het op grond van die wet
      is toegestaan beleggingsdiensten te verlenen onderscheidenlijk het bedrijf van bank of clearinginstelling uit te
      oefenen, die voor rekening en risico van haar cliënten corresponderende posities aangaat;
        - *verordening (EU) nr. 648/2012 (EMIR):* verordening (EU) nr. 648/2012 van het Europees parlement en de Raad van
      4 juli 2012 inzake otc-derivaten, centrale tegenpartijen en transactieregisters (PbEU 2012, L 201);
        - *zekerheid:* goederen die strekken tot waarborg van de verplichtingen voortvloeiend uit derivatenposities, of de
      goederen die daarvoor in de plaats moeten worden geacht te zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49f
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 49g.1
    text: |-
      In afwijking van [artikel 276 van boek 3 van het Burgerlijk Wetboek][ref1] dient het derivatenvermogen
      uitsluitend tot voldoening van vorderingen die voortvloeien uit de met de corresponderende posities samenhangende
      cliëntposities, en vorderingen met betrekking tot de in verband met die cliëntposities gestelde zekerheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel276
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49g
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '276'
  - number: 49g.2
    text: |-
      Een tussenpersoon legt in zijn administratie vast welke corresponderende posities behoren tot het
      derivatenvermogen. De tussenpersoon legt voor iedere cliëntpositie vast welke corresponderende positie is
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49g
  - number: 49g.3
    text: |-
      Indien zowel een cliëntpositie als de daarmee corresponderende positie gelijktijdig worden beëindigd, wordt een
      eventuele restvordering die de cliënt na de beëindiging heeft op de tussenpersoon voor zover mogelijk voldaan
      uit de restvordering die de tussenpersoon heeft uit hoofde van het beëindigen van de corresponderende positie
      en de in verband daarmee gestelde zekerheden. Voor het niet-voldane gedeelte heeft de cliënt een vordering op de
      tussenpersoon.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49g
  - number: 49g.4
    text: |-
      Indien een cliëntpositie wordt beëindigd zonder dat de daarmee corresponderende positie wordt beëindigd, maakt
      de corresponderende positie geen deel meer uit van het derivatenvermogen en is een eventuele restvordering van
      de cliënt na beëindiging van de cliëntpositie een vordering op de tussenpersoon, waarbij de cliënt een voorrecht
      heeft op de derivatenpositie die correspondeerde met de beëindigde cliëntpositie en de in verband daarmee gestelde
      zekerheden.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49g
  - number: 49g.5
    text: |-
      Indien een corresponderende positie wordt beëindigd voordat de daarmee samenhangende cliëntpositie wordt beëindigd,
      blijven eventuele restvorderingen uit hoofde van die corresponderende positie en de in verband daarmee gestelde
      zekerheden beschikbaar voor het voldoen van de vorderingen uit hoofde van de daarmee samenhangende cliëntpositie.
      Indien de vorderingen van de cliënt daarmee niet volledig kunnen worden voldaan, heeft hij voor het niet-voldane
      gedeelte een vordering op de tussenpersoon.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49g
  - number: 49g.6
    text: |-
      Beslag onder een tussenpersoon op het derivatenvermogen is niet toegelaten. Beslag onder een centrale tegenpartij
      of een tussenpersoon op cliëntposities die worden aangehouden voor een tussenpersoon onderscheidenlijk een andere
      tussenpersoon is niet toegelaten, voor zover die cliëntposities samenhangen met posities die behoren tot het
      derivatenvermogen van laatstbedoelde tussenpersoon.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49g
  - number: 49g.7
    text: |-
      Indien het een tussenpersoon op grond van de [Wet op het financieel toezicht][ref1] niet langer is toegestaan
      zijn beroep of bedrijf uit te oefenen, blijft het derivatenvermogen bestaan voor zover het reeds bestaande
      derivatenposities betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49g
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 49h.1
    text: |-
      In geval van het faillissement van een tussenpersoon wijst de curator een deskundige aan die onder
      verantwoordelijkheid van de curator is belast met het beheer van de corresponderende posities, de daarmee
      samenhangende cliëntposities en de in verband met deze posities gestelde zekerheden. Indien het faillissement een
      beleggingsonderneming betreft vindt de aanwijzing plaats met instemming van de Stichting Autoriteit Financiële
      Markten. Indien het faillissement een bank of clearinginstelling betreft vindt de aanwijzing plaats met instemming
      van De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49h
  - number: 49h.2
    text: |-
      De curator verleent zijn medewerking aan de overdracht, bedoeld in artikel 48, vijfde of zesde lid, van verordening
      (EU) nr. 648/2012 (EMIR), alsmede de overdracht van de daarmee samenhangende cliëntposities en, met inachtneming
      van het vierde lid, de in verband daarmee gestelde zekerheden.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49h
  - number: 49h.3
    text: |-
      Indien de in het tweede lid bedoelde overdracht niet slaagt, kan de curator het derivatenvermogen en de daarmee
      samenhangende cliëntposities en, met inachtneming van het vierde lid, de in verband daarmee gestelde zekerheden,
      geheel of gedeeltelijk overdragen aan een andere tussenpersoon, of een met een tussenpersoon vergelijkbare
      instelling in het buitenland waaraan het op grond van het op die instelling van toepassing zijnde recht is
      toegestaan beleggingsdiensten te verlenen, onverminderd het recht van cliënten of de centrale tegenpartijen op
      voortijdige beëindiging van hun posities.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49h
  - number: 49h.4
    text: |-
      Indien de tussenpersoon in verband met de corresponderende posities bij de centrale tegenpartijen zekerheid heeft
      gesteld en de waarde daarvan op het tijdstip van faillietverklaring onvoldoende is om de vorderingen tot teruggave
      van gestelde zekerheden te voldoen uit hoofde van de daarmee samenhangende cliëntposities, worden de rechten van
      de tussenpersoon jegens de centrale tegenpartijen inzake de terug te geven zekerheden over de betreffende cliënten
      verdeeld naar rato van de waarde van de door hen gestelde zekerheden, onverminderd het voorrecht bedoeld in
      [artikel 53 lid 3 van boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel53
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49h
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '53'
  - number: 49h.5
    text: |-
      In afwijking van het vorige lid behouden cliënten die vermogensscheiding per individuele cliënt als bedoeld
      in artikel 39, derde lid, van verordening (EU) nr. 648/2012 (EMIR) hebben bedongen, het recht op volledige
      teruggave van de zekerheden die zij bij de tussenpersoon hebben gesteld, en die de tussenpersoon in verband met de
      betreffende corresponderende derivatenposities heeft gesteld bij de centrale tegenpartij.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49h
  - number: 49h.6
    text: |-
      Het tweede tot en met vijfde lid is van overeenkomstige toepassing indien niet een centrale tegenpartij wederpartij
      is bij de corresponderende posities, maar een andere tussenpersoon.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49h
  - number: 49h.7
    text: |-
      Indien de vordering van een wederpartij bij een derivatenpositie niet of niet volledig kan worden voldaan uit het
      derivatenvermogen, kan die wederpartij voor het niet-voldane gedeelte een vordering ter verificatie aanmelden bij
      de curator.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49h
  - number: 49h.8
    text: |-
      De curator zorgt ervoor dat, uiterlijk op het tijdstip waarop het faillissement van de tussenpersoon is geëindigd,
      alle derivatenposities die deel uitmaken van het derivatenvermogen en de daarmee samenhangende cliëntposities
      zijn beëindigd of overgedragen aan een andere tussenpersoon, tenzij het bedrijf van de gefailleerde instelling
      overeenkomstig [artikel 98 van de Faillissementswet][ref1] wordt voortgezet.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel98
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel49h
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '98'
  - number: 50b.1
    text: |-
      Indien ten aanzien vaneffecten een verzameldepot kan bestaan, en zodanige effecten op dat tijdstip worden bewaard
      door een bewaarbedrijf, is dit bewaarbedrijf bevoegd deze effecten aan de bewaargever uit te leveren door ze namens
      hem in bewaring te geven aan de met het bewaarbedrijf verbonden intermediair.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel50b
  - number: 50b.2
    text: |-
      Beperkte rechten die rusten op de vordering van de bewaargever op hetbewaarbedrijf tot uitlevering van niet
      afzonderlijk voor de bewaargever bewaarde effecten, komen te rusten op de overeenkomstig het eerste lid
      uitgeleverde effecten. Is op een zodanige vordering beslag gelegd, dan is het bewaarbedrijf niet bevoegd tot
      uitlevering van effecten overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel50b
  - number: 50b.3
    text: |-
      In dit artikel wordt onder een bewaarbedrijf verstaan een rechtspersoon die krachtens haar statuten
      uitsluitend of hoofdzakelijk ten doel heeft de bewaring van financiële instrumenten als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel50b
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 50c
    text: |-
      In afwijking van [artikel 26][ref1] of [45][ref2] kunnen effecten tot uiterlijk zes maanden na het tijdstip
      van inwerkingtreding van deze bepaling worden uitgeleverd aan een deelgenoot onderscheidenlijk een aangesloten
      instelling, met inachtneming van het op het tijdstip voorafgaande aan de inwerkingtreding van deze wet met
      betrekking tot uitlevering bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel45
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel50c
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '26'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003109
        artikel: '45'
        hoofdstuk: '3'
  - number: 50d.1
    text: |-
      Indien effecten aan toonder behoren tot een verzameldepot of een girodepot, maar niet zijn belichaamd in een
      verzamelbewijs, kunnen de met deze effecten corresponderende aandelen in een verzameldepot of girodepot vanaf
      1 januari 2013 niet meer worden geleverd op grond van [artikel 17][ref1] of [artikel 41][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel41
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel50d
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '17'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003109
        artikel: '41'
        hoofdstuk: '3'
  - number: 50d.2
    text: |-
      Een instelling die effecten aan toonder heeft uitgegeven die zijnopgenomen in een verzameldepot of een girodepot
      zet deze effecten voor 1 januari 2013 om in een verzamelbewijs of in effecten op naam.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel50d
  - number: 50d.3
    text: |-
      Indien de voorwaarden waaronder effecten aan toonder zijn uitgegeven niet voorzien in de mogelijkheid die effecten
      om te zetten in verzamelbewijzen of een procedure om de voorwaarden aan te passen, kan de uitgevende instelling van
      die effecten eenzijdig de voorwaarden wijzigen om een omzetting als bedoeld in het tweede lid mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel50d
  - number: 50d.4
    text: |-
      Indien een buitenlands recht dat op effecten van toepassing is niet voorziet in de mogelijkheid van omzetting,
      zullen de effecten in afwijking van het eerste lid wel geleverd kunnen worden op grond van [artikel 17][ref1] of
      [artikel 41][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel41
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel50d
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '17'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003109
        artikel: '41'
        hoofdstuk: '3'
  - number: '51.1'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel51
  - number: '51.2'
    text: Zij kan worden aangehaald als "Wet giraal effectenverkeer".
    url: https://wetten.overheid.nl/BWBR0003109/2019-07-10#Artikel51
