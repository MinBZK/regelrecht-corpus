  - number: 49f
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder:

        - *centrale tegenpartij:* centrale tegenpartij als bedoeld in artikel 2 van verordening (EU) nr. 648/2012 (EMIR);
        - *cliënt:* degene voor wie een tussenpersoon een derivatenpositie aangaat of beheert;
        - *cliëntpositie:* derivatenpositie die een tussenpersoon houdt voor een cliënt;
        - *corresponderende positie:* de derivatenpositie die een tussenpersoon met een derde is aangegaan in verband met
      het aangaan van een cliëntpositie, en die overeenkomt met de betreffende cliëntpositie;
        - *derivatenpositie:* de rechten en verplichtingen die voortvloeien uit een financieel
      instrument als bedoeld in onderdeel d tot en met j van de definitie van financieel instrument in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1], voor zover die rechten en verplichtingen betrekking
      hebben op de bedingen die de kern van de prestaties aangeven;
        - *derivatenvermogen:* afgescheiden deel van het vermogen van een tussenpersoon waartoe alle corresponderende
      posities behoren alsmede alle rechten en verplichtingen met betrekking tot het stellen van zekerheid ten behoeve
      van corresponderende posities;
        - *tussenpersoon:* beleggingsonderneming, bank of clearinginstelling als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2], met zetel in Nederland waaraan het op grond van die wet
      is toegestaan beleggingsdiensten te verlenen onderscheidenlijk het bedrijf van bank of clearinginstelling uit te
      oefenen, die voor rekening en risico van haar cliënten corresponderende posities aangaat;
        - *verordening (EU) nr. 648/2012 (EMIR):* verordening (EU) nr. 648/2012 van het Europees parlement en de Raad van
      4 juli 2012 inzake otc-derivaten, centrale tegenpartijen en transactieregisters (PbEU 2012, L 201);
        - *zekerheid:* goederen die strekken tot waarborg van de verplichtingen voortvloeiend uit derivatenposities, of de
      goederen die daarvoor in de plaats moeten worden geacht te zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel11
