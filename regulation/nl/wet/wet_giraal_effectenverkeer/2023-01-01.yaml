  - number: 49d
    text: |-
      1 De uitgevende instelling is verplicht tot geheimhouding van de in [artikel 49b, eerste en tweede lid][ref1] en
      [artikel 49c, zevende en achtste lid][ref2] bedoelde gegevens, waarvan zij kennis neemt en verwerkt deze gegevens
      op een behoorlijke en zorgvuldige wijze.

      2 Indien een uitgevende instelling aan een derde volmacht heeft verleend om namens haar een verzoek als bedoeld in
      [artikel 49b, eerste en tweede lid][ref3], te doen en de verzochte gegevens te ontvangen, is deze derde verplicht
      tot geheimhouding van de in artikel 49b, eerste en tweede lid en [artikel 49c, zevende en achtste lid][ref4],
      bedoelde gegevens waarvan hij kennis neemt en verwerkt deze gegevens op een behoorlijke en zorgvuldige wijze.

      3 De uitgevende instelling of, indien van toepassing, de derde aan wie de uitgevende instelling een volmacht heeft
      verleend om namens haar een verzoek als bedoeld in [artikel 49b, eerste en tweede lid][ref5], te doen, verwerkt de
      in artikel 49b, eerste en tweede lid en [artikel 49c, zevende en achtste lid][ref6], bedoelde gegevens niet verder
      op een wijze die onverenigbaar is met de doeleinden waarvoor ze zijn verkregen.

      4 De uitgevende instelling of, indien van toepassing, de derde aan wie de uitgevende instelling een volmacht
      heeft verleend om namens haar een verzoek als bedoeld in [artikel 49b, eerste en tweede lid][ref7], te doen, legt
      passende technische en organisatorische maatregelen ten uitvoer om de in de in artikel 49b, eerste en tweede lid
      en [artikel 49c, zevende en achtste lid][ref8], bedoelde gegevens te beveiligen tegen verlies of enige vorm van
      onrechtmatige verwerking.

      5 Partijen in de bewaarketen, de uitgevende instelling of, indien van toepassing, de derde aan
      wie de uitgevende instelling een volmacht heeft verleend, bewaren de persoonsgegevens, bedoeld in
      [artikel 49b, eerste en tweede lid][ref9], niet langer dan twaalf maanden nadat zij ervan op de hoogte zijn geraakt
      dat de betrokkene niet langer ten minste twee honderdste van het geplaatste kapitaal van de uitgevende instelling
      vertegenwoordigt.

      6 Rechtspersonen hebben het recht om gegevens betreffende hun identiteit die door de uitgevende
      instelling met zetel in Nederland verkregen zijn naar aanleiding van een verzoek als bedoeld in
      [artikel 49b, eerste en tweede lid][ref10], te corrigeren wanneer deze onvolledig of onjuist zijn gebleken.

      7 Een partij in de bewaarketen die een verzoek als bedoeld in [artikel 49b, eerste of tweede lid][ref11],
      beantwoordt kan niet worden aangesproken voor overtreding van een civielrechtelijk of bestuursrechtelijk beding op
      grond waarvan geheimhouding van deze gegevens verplicht is.


