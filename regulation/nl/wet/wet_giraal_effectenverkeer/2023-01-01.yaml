  - number: 50d
    text: |-
      1 Indien effecten aan toonder behoren tot een verzameldepot of een girodepot, maar niet zijn belichaamd in een
      verzamelbewijs, kunnen de met deze effecten corresponderende aandelen in een verzameldepot of girodepot vanaf
      1 januari 2013 niet meer worden geleverd op grond van [artikel 17][ref1] of [artikel 41][ref2].

      2 Een instelling die effecten aan toonder heeft uitgegeven die zijnopgenomen in een verzameldepot of een girodepot
      zet deze effecten voor 1 januari 2013 om in een verzamelbewijs of in effecten op naam.

      3 Indien de voorwaarden waaronder effecten aan toonder zijn uitgegeven niet voorzien in de mogelijkheid die
      effecten om te zetten in verzamelbewijzen of een procedure om de voorwaarden aan te passen, kan de uitgevende
      instelling van die effecten eenzijdig de voorwaarden wijzigen om een omzetting als bedoeld in het tweede lid
      mogelijk te maken.

      4 Indien een buitenlands recht dat op effecten van toepassing is niet voorziet in de mogelijkheid van omzetting,
      zullen de effecten in afwijking van het eerste lid wel geleverd kunnen worden op grond van [artikel 17][ref3] of
      [artikel 41][ref4].


