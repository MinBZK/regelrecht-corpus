  - number: 49c
    text: |-
      1 Op schriftelijk verzoek van een aandeelhouder die alleen of gezamenlijk met andere aandeelhouders tenminste een
      honderdste gedeelte van het geplaatste kapitaal van een uitgevende instelling vertegenwoordigt of rechthebbende is
      op een bedrag van aandelen of certificaten daarvan met een gezamenlijke waarde van tenminste € 250 000, verzendt
      de uitgevende instelling, indien deze beschikt over op grond van [artikel 49b, eerste lid, onder b, c of d][ref1],
      verkregen gegevens, door de aandeelhouder ter beschikking gestelde informatie welke verband houdt met een onderwerp
      dat is geagendeerd voor de algemene vergadering aan de aandeelhouders van de uitgevende instelling. De uitgevende
      instelling verzendt de informatie met de meeste spoed, in elk geval binnen drie werkdagen na ontvangst van het
      verzoek of plaatst deze informatie met de meeste spoed, in elk geval binnen drie werkdagen, op haar website, waar
      deze informatie tenminste tot en met de dag van de algemene vergadering beschikbaar wordt gehouden.

      2 In afwijking van het eerste lid is de uitgevende instelling niet verplicht tot verzending van informatie die
      minder dan zeven werkdagen voor de algemene vergadering door haar wordt ontvangen.

      3 Indien een uitgevende instelling ter uitvoering van het eerste lid informatie verzendt, vermeldt zij de naam van
      de verzoeker.

      4 In afwijking van het eerste lid is een uitgevende instelling evenmin verplicht informatie te verzenden:

      a. waarvan een onjuist of misleidend signaal uitgaat of te duchten is met betrekking tot de uitgevende instelling;
      of

      b. die van zodanige aard is dat verzending naar maatstaven van redelijkheid en billijkheid niet van de uitgevende
      instelling kan worden verlangd.

      5 De uitgevende instelling plaatst informatie die zij uit eigen beweging of op schriftelijk verzoek van een
      aandeelhouder heeft verzonden onverwijld na verzending op haar website. De uitgevende instelling houdt de
      informatie gedurende tenminste een jaar op de website toegankelijk.

      6 Voor de toepassing van dit artikel wordt als aandeelhouder beschouwd degene die aandeelhouder is op de peildatum
      die is vermeld in het laatst gedane verzoek, bedoeld in [artikel 49b, eerste lid][ref2].

      7 Indien door de aandeelhouder, bedoeld in het zesde lid, een overeenkomst is gesloten met een derde op grond
      waarvan deze derde naar eigen goeddunken stemmen kan uitbrengen en de aandeelhouder informatie van de uitgevende
      instelling ontvangt, verstrekt hij de naam, het adres en het emailadres van de derde aan de uitgevende instelling
      en stuurt hij de informatie die van de uitgevende instelling is ontvangen onverwijld door aan de derde.

      8 Indien door de aandeelhouder, bedoeld in het zesde lid, toepassing is gegeven aan [artikel 88, derde lid][ref3],
      onderscheidenlijk [89, derde lid, van boek 2 van het Burgerlijk Wetboek][ref4] en de aandeelhouder informatie van
      de uitgevende instelling ontvangt, verstrekt hij de naam, het adres en het emailadres van de vruchtgebruiker of
      pandhouder aan de uitgevende instelling en stuurt hij de informatie die van de uitgevende instelling is ontvangen
      onverwijld door aan de vruchtgebruiker of pandhouder.

      9 Bij ministeriële regeling kunnen regels worden gesteld voor de wijze waarop het in het eerste lid bedoelde
      verzoek wordt gedaan en de wijze waarop een uitgevende instelling hieraan uitvoering geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
