  - number: 49da
    text: |-
      1 Een uitgevende instelling met zetel in Nederland verstrekt tijdig en op gestandaardiseerde wijze aan een partij
      in de bewaarketen de informatie die benodigd is om de aandeelhouders in staat te stellen de rechten uit te oefenen
      die uit hun effecten met aandelenkarakter voortvloeien en die aan alle houders van de effecten met aandelenkarakter
      van die soort is gericht, of wanneer die informatie reeds voor de aandeelhouders beschikbaar is op de website van
      de uitgevende instelling, het bericht met daarin de plaats op de website waar die informatie beschikbaar is.

      2 De partij in de bewaarketen met zetel in Nederland die de informatie of het bericht, bedoeld in het eerste lid,
      heeft ontvangen verstrekt die onverwijld aan de aandeelhouder of een door de aandeelhouder aangewezen derde.

      3 In afwijking van het tweede lid verstrekt de partij in de bewaarketen met zetel in Nederland die de informatie
      of het bericht, bedoeld in het eerste lid, niet rechtstreeks aan de aandeelhouder of een door de aandeelhouder
      aangewezen derde kan verstrekken omdat die partij de effecten met aandelenkarakter niet rechtstreeks namens
      de aandeelhouder bewaart, die informatie of dat bericht onverwijld aan de partijen in die bewaarketen voor wie
      hij de effecten met een aandelenkarakter bewaart. Wanneer het bericht de partij bereikt die de effecten met een
      aandelenkarakter bewaart voor de aandeelhouder verstrekt die vervolgens de informatie of het bericht onverwijld aan
      de aandeelhouder of een door de aandeelhouder aangewezen derde.

      4 Het eerste tot en met het derde lid zijn niet van toepassing indien de uitgevende instelling met zetel in
      Nederland de in het eerste lid bedoelde informatie of het bericht rechtstreeks aan alle aandeelhouders of aan door
      de aandeelhouders aangewezen derden verstrekt.

      5 Partijen in de bewaarketen met zetel in Nederland die informatie hebben ontvangen afkomstig van de aandeelhouder
      met betrekking tot de uitoefening van rechten die voortvloeien uit zijn effecten met aandelenkarakter verstrekken
      die informatie onverwijld overeenkomstig de aanwijzingen van de aandeelhouder aan de uitgevende instelling.

      6 In afwijking van het vijfde lid verstrekt de partij in de bewaarketen met zetel in Nederland die de informatie,
      bedoeld in het vijfde lid, niet rechtstreeks aan de uitgevende instelling kan verstrekken omdat zij de effecten
      met aandelenkarakter niet rechtstreeks voor de uitgevende instelling bewaart, de informatie aan de partij in die
      bewaarketen die voor haar de effecten met aandelenkarakter bewaart. Wanneer de informatie de partij bereikt die
      de effecten met aandelenkarakter voor de uitgevende instelling bewaart, verstrekt die de informatie vervolgens
      onverwijld aan de uitgevende instelling.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel49da
  - number: 49db
    text: |-
      1 Partijen in de bewaarketen met zetel in Nederland faciliteren de uitoefening van de rechten door de aandeelhouder
      door ten minste:

      a. regelingen te treffen die noodzakelijk zijn om te zorgen dat de aandeelhouder of een door hem aangewezen derde
      in staat is om deze rechten zelf uit te oefenen; of

      b. ten behoeve van de aandeelhouder de rechten voortvloeiend uit de effecten met aandelenkarakter uit te oefenen
      met de uitdrukkelijke machtiging en instructie van de aandeelhouder.

      2 Indien de uitgevende instelling de bevestiging van de geldige registratie en telling van de uitgebrachte
      stemmen, bedoeld in [artikel 120, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref1], niet rechtstreeks aan de
      aandeelhouder of een door de aandeelhouder aangewezen derde kan verstrekken verstrekt hij die bevestiging aan een
      partij in de bewaarketen die de bevestiging vervolgens onverwijld aan de aandeelhouder of een door de aandeelhouder
      aangewezen derde verstrekt.

      3 Indien een partij in de bewaarketen met zetel in Nederland de bevestiging, bedoeld in het tweede lid, niet
      rechtstreeks aan de aandeelhouder of een door de aandeelhouder aangewezen derde kan verstrekken, geeft hij
      de bevestiging onverwijld door aan de volgende partijen in die bewaarketen voor wie hij de effecten met een
      aandelenkarakter bewaart. Wanneer de bevestiging de partij bereikt die de effecten met een aandelenkarakter bewaart
      voor de aandeelhouder verstrekt die vervolgens de informatie of het bericht onverwijld aan de aandeelhouder of een
      door de aandeelhouder aangewezen derde.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel120
