        bwb_id: BWBR0001860
        artikel: '311'
  - number: '34'
    text: |-
      1 Alleen een centraal instituut kan girodepots in de zin van deze wet houden.

      2 Het centraal instituut bepaalt welke effecten tot een door hem gehouden girodepot kunnen behoren.

      3 Het centraal instituut bepaalt welke effecten die tot een door hem gehouden girodepot kunnen behoren, voor de
      toepassing van deze wet als effecten van dezelfde soort worden beschouwd.

      4 Ten aanzien van iedere soort effecten die tot een girodepot kunnen behoren bestaat een afzonderlijk girodepot.

      5 Een aangesloten instelling is bevoegd tot bewaargeving of levering ter opname in het girodepot van tot een
      verzameldepot behorende effecten aan een centraal instituut zonder de medewerking van de andere deelgenoten.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel34
  - number: '35'
    text: |-
      Tot een girodepot behoren:

      a. alle effecten van de betreffende soort die onder het centraal instituut berusten, voor het centraal instituut
      worden bewaard of aan het centraal instituut zijn geleverd;

      b. het ten name van het centraal instituut staande tegoed terzake van effecten van de betreffende soort, dat wordt
      aangehouden bij instellingen in het buitenland;

      c. in het geval dat effecten als bedoeld onder *a* verloren zijn gegaan, de rechten daaruit of de daarvoor in de
      plaats getreden vorderingen tot vergoeding, alsmede hetgeen uit hoofde daarvan is ontvangen;

      d. alle overige goederen die geacht moeten worden in de plaats te zijn getreden van onder *a* bedoelde effecten of
      van een onder *b* bedoeld tegoed.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel35
  - number: '36'
    text: |-
      1 Een centraal instituut is belast met het beheer van de door hem gehouden girodepots.

      2 Het centraal instituut kan tegenover derden de rechten van degenen aan wie een girodepot toebehoort, uitoefenen,
      indien dit voor een goed beheer dienstig kan zijn.

      3 Het tweede lid is niet van toepassing op het recht tot bijeenroeping van een vergadering van aandeelhouders
      of houders van andere effecten, tot het bijwonen van en het woord voeren in een zodanige vergadering, tot het
      uitoefenen van stemrecht en tot het doen instellen van een onderzoek naar het beleid en de gang van zaken van een
      rechtspersoon, als bedoeld in [artikel 345 van Boek 2 van het Burgerlijk Wetboek][ref1].

      4 Het centraal instituut is bevoegd effecten aan toonder die tot een girodepot behoren te vervangen door
      een verzamelbewijs. Het centraal instituut kan bepalen dat in de tekst van een aldus door hem te verkrijgen
      verzamelbewijs een regeling is opgenomen als bedoeld in het vijfde lid.

      5 Indien in de tekst van een verzamelbewijs dat tot een girodepot behoort een daartoe strekkende regeling is
      opgenomen, kan het centraal instituut door een aantekening op het stuk te plaatsen dit mede betrekking doen hebben
      op een of meer andere effecten van dezelfde soort, dan wel bewerkstelligen dat het stuk niet langer betrekking
      heeft op een of meer van de effecten waarop het voorafgaand aan de plaatsing van de aantekening betrekking had.

      6 Het centraal instituut is bevoegd tot een girodepot behorende effecten die aan toonder luiden, op naam te doen
      stellen.

      7 Het centraal instituut oefent de in het vierde tot en met zesde lid genoemde bevoegdheden uitsluitend uit met
      instemming van de instelling die de effecten heeft uitgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel345
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '345'
  - number: '37'
    text: |-
      1 Alleen een aangesloten instelling kan effecten in bewaring hebben of aanhouden bij een centraal instituut.

      2 De rechten jegens het centraal instituut worden door de aangesloten instelling op eigen naam uitgeoefend voor hen
      aan wie de effecten toebehoren.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel37
  - number: '38'
    text: |-
      1 Zij aan wie de in bewaring gegeven effecten aan toonder of ter opname in een girodepot geleverde effecten op naam
      toebehoorden op het tijdstip waarop zij door het centraal instituut ter bewaring in ontvangst zijn genomen dan wel
      aan het centraal instituut zijn geleverd, worden vanaf dat tijdstip in het girodepot gerechtigd als deelgenoten,
      gezamenlijk met hen die in dat girodepot op het tijdstip van de bewaargeving of levering reeds gerechtigd waren.

      2 Bewaargeving van effecten aan toonder of levering van effecten op naam door de instelling die de effecten
      heeft uitgegeven aan een centraal instituut ter opname van die effecten in een girodepot, heeft tot gevolg
      dat de aangesloten instelling ten gunste van wie de effecten worden bijgeschreven, alsdan in het girodepot
      gerechtigd wordt als deelgenoot, gezamenlijk met hen die daarinop dat tijdstip reeds gerechtigd waren. De effecten
      makenvanaf het moment van opname in het girodepot deel uit van de verzameldepots van de desbetreffende aangesloten
      instellingen.

      3 Het aandeel in een girodepot staat op naam van de aangesloten instelling.

      4 Het aandeel wordt berekend naar evenredigheid van de hoeveelheid van de door de aangesloten instelling
      ingebrachte of geleverde effecten, dan wel door de instelling die de effecten heeft uitgegeven overeenkomstig het
      tweede lid geleverde effecten.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel38
  - number: '39'
    text: |-
      Een centraal instituut draagt zorg dat de aangesloten instellingen kunnen voldoen aan hun in [artikel 15][ref1]
      bedoelde verplichting ten aanzien van het aan de effecten verbonden stemrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel15
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '15'
        hoofdstuk: '2'
  - number: '40'
    text: |-
      1 Het ten name van een aangesloten instelling staande aandeel in een girodepot is overdraagbaar. Een gedeelte van
      zodanig aandeel is eveneens overdraagbaar.

      2 Het aandeel in een tot een girodepot behorend goed afzonderlijk is niet overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel40
  - number: '41'
    text: |-
      1 Levering tussen aangesloten instellingen van een aandeel in een girodepot geschiedt door bijschrijving op naam
      van de verkrijgende instelling in het daartoe bestemde deel van de administratie van het centraal instituut.

      2 Ondanks onbevoegdheid van die instelling is een overdracht van een aandeel geldig, indien de verkrijgende
      instelling op het tijdstip dat zij van de bijschrijving kennis kreeg, te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel41
  - number: '42'
    text: |-
      1 Vestiging van een pandrecht ten behoeve van een andere aangesloten instelling op een aandeel in een girodepot
      geschiedt door bijschrijving ten name van de andere instelling in de administratie van het centraal instituut.

      2 [Artikel 20, tweede lid][ref1], en [artikel 22][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel22
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '20'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0003109
        artikel: '22'
        hoofdstuk: '2'
  - number: '43'
    text: |-
      1 Een centraal instituut is verplicht van een door hem verrichte bijschrijving terstond een kennisgeving te zenden
      aan de aangesloten instelling op wier naam de bijschrijving heeft plaatsgevonden.

      2 Van het voorgaande lid kan niet bij overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel43
  - number: '44'
    text: |-
      Beslag onder een centraal instituut op een ten name van een aangesloten instelling staand aandeel in een girodepot
      is niet toegelaten.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel44
  - number: '45'
    text: |-
      1 Voor zover uitlevering op grond van het derde lid en het vierde lid mogelijk is, heeft een aangesloten instelling
      recht op uitlevering van de haar toekomende hoeveelheid effecten. Uitlevering van een gedeelte van een effect is
      niet mogelijk.

      2 Is het girodepot niet toereikend om aan iedere aangesloten instelling de in het eerste lid bedoelde hoeveelheid
      effecten uit te leveren, dan levert het centraal instituut aan een aangesloten instelling slechts zoveel effecten
      uit als in verband met de rechten van de andere aangesloten instellingen mogelijk is.

      3 Effecten worden uit een girodepot slechts uitgeleverd:

      a. ter opname in een depot van een in het buitenland gevestigd centraal instituut of een buitenlandse instelling
      met een functie vergelijkbaar met die van een centraal instituut; of

      b. ter opname in een verzameldepot van een intermediair of, indien de instelling die de effecten heeft uitgegeven
      daarmee heeft ingestemd, een depot van een instelling in het buitenland waaraan het op grond van het op die
      instelling van toepassing zijnde recht is toegestaan ten name van cliënten rekeningen in effecten te administreren,
      indien alle effecten van de desbetreffende soort worden uitgeleverd.

      4 In afwijking van het derde lid worden effecten op verzoek van een aangesloten instelling uit een girodepot
      uitgeleverd indien de uitlevering noodzakelijk is voor de deelgenoot om een aan de effecten verbonden recht uit te
      kunnen oefenen. De effecten worden onverwijld teruggeleverd ter opname in het verzameldepot zodra het niet langer
      noodzakelijk is voor de betreffende deelgenoot de effecten in eigen naam te houden voor het uitoefenen van het
      hiervoor bedoelde recht.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel45
  - number: '46'
    text: |-
      De verdeling van een girodepot dat niet toereikend is om aan iedere instelling de haar toekomende hoeveelheid
      effecten uit te leveren, geschiedt door overeenkomstige toepassing van [artikel 27, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel27
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '27'
        hoofdstuk: '2'
  - number: '47'
    text: |-
      Levert een centraal instituut aan een instelling meer effecten uit dan waartoe het ingevolge de vorige twee
      artikelen bevoegd is, dan kan het teveel uitgeleverde door het centraal instituut worden teruggevorderd, tenzij de
      instelling op het tijdstip van de uitlevering te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel47
  - number: '48'
    text: |-
      Een centraal instituut is tot uitlevering bevoegd zonder medewerking van de andere instellingen op wier naam
      aandelen in het girodepot staan.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel48
  - number: '49'
    text: |-
      1 Bij uitlevering van effecten uit hoofde van een aandeel waarop een pandrecht rust, komt dit pandrecht mede op de
      uitgeleverde effecten te rusten.

      2 Het eerste lid is bij uitkeringen als bedoeld in [artikel 27, tweede lid, tweede zin, en derde lid][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel27
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '27'
        hoofdstuk: '2'
  - number: 49a
    text: |-
      Voor de toepassing van het ingevolge dit hoofdstuk bepaalde wordt verstaan onder:

        - *effecten met een aandelenkarakter:* 1°. verhandelbare aandelen als bedoeld in
      [artikel 79, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]; 2°. verhandelbare aandelen die
      zijn uitgegeven door een rechtspersoon, opgericht naar het recht van een andere lidstaat als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref2] dan Nederland, die gelijk te stellen zijn met aandelen
      als bedoeld onder 1°; 3°. certificaten van aandelen of andere met certificaten van aandelen gelijk te stellen
      verhandelbare waardebewijzen;
        - *instelling in het buitenland:* een instelling met zetel in het buitenland waaraan het op grond van het op die
      instelling van toepassing zijnde recht is toegestaan ten name van cliënten rekeningen in effecten te administreren
      of aan te houden.
        - *aandeelhouder:* 1°. degene die voor eigen rekening een tegoed, luidend in effecten met een aandelenkarakter
      aanhoudt bij een aangesloten instelling, intermediair of instelling in het buitenland, of 2°. beheerder van een
      belegginginstelling als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3] of een beheerder van
      een icbe als bedoeld in artikel 1:1 van die wet.
        - *uitgevende instelling:* vennootschap naar Nederlands recht of een rechtspersoon opgericht naar het recht van een
      andere lidstaat als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref4] dan Nederland, niet zijnde
      een beleggingsinstelling als bedoeld in artikel 1:1 van de Wet op het financieel toezicht of een icbe als bedoeld
      in artikel 1:1 van die wet, waarvan effecten zijn toegelaten tot de handel op een gereglementeerde markt.
        - *bewaarketen:* een of meer van de volgende partijen gezamenlijk voor zover die door de uitgevende
      instelling of met haar medewerking uitgegeven effecten met een aandelenkarakter van een soort
      bewaren: centraal instituut, intermediair, bewaarder van een beleggingsinstelling als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref5] of instelling in het buitenland.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel79
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel49a
