  - number: 49g
    text: |-
      1 In afwijking van [artikel 276 van boek 3 van het Burgerlijk Wetboek][ref1] dient het derivatenvermogen
      uitsluitend tot voldoening van vorderingen die voortvloeien uit de met de corresponderende posities samenhangende
      cliëntposities, en vorderingen met betrekking tot de in verband met die cliëntposities gestelde zekerheden.

      2 Een tussenpersoon legt in zijn administratie vast welke corresponderende posities behoren tot het
      derivatenvermogen. De tussenpersoon legt voor iedere cliëntpositie vast welke corresponderende positie is
      aangegaan.

      3 Indien zowel een cliëntpositie als de daarmee corresponderende positie gelijktijdig worden beëindigd, wordt
      een eventuele restvordering die de cliënt na de beëindiging heeft op de tussenpersoon voor zover mogelijk voldaan
      uit de restvordering die de tussenpersoon heeft uit hoofde van het beëindigen van de corresponderende positie
      en de in verband daarmee gestelde zekerheden. Voor het niet-voldane gedeelte heeft de cliënt een vordering op de
      tussenpersoon.

      4 Indien een cliëntpositie wordt beëindigd zonder dat de daarmee corresponderende positie wordt beëindigd, maakt
      de corresponderende positie geen deel meer uit van het derivatenvermogen en is een eventuele restvordering van
      de cliënt na beëindiging van de cliëntpositie een vordering op de tussenpersoon, waarbij de cliënt een voorrecht
      heeft op de derivatenpositie die correspondeerde met de beëindigde cliëntpositie en de in verband daarmee gestelde
      zekerheden.

      5 Indien een corresponderende positie wordt beëindigd voordat de daarmee samenhangende cliëntpositie wordt
      beëindigd, blijven eventuele restvorderingen uit hoofde van die corresponderende positie en de in verband daarmee
      gestelde zekerheden beschikbaar voor het voldoen van de vorderingen uit hoofde van de daarmee samenhangende
      cliëntpositie. Indien de vorderingen van de cliënt daarmee niet volledig kunnen worden voldaan, heeft hij voor het
      niet-voldane gedeelte een vordering op de tussenpersoon.

      6 Beslag onder een tussenpersoon op het derivatenvermogen is niet toegelaten. Beslag onder een centrale tegenpartij
      of een tussenpersoon op cliëntposities die worden aangehouden voor een tussenpersoon onderscheidenlijk een andere
      tussenpersoon is niet toegelaten, voor zover die cliëntposities samenhangen met posities die behoren tot het
      derivatenvermogen van laatstbedoelde tussenpersoon.

      7 Indien het een tussenpersoon op grond van de [Wet op het financieel toezicht][ref2] niet langer is toegestaan
      zijn beroep of bedrijf uit te oefenen, blijft het derivatenvermogen bestaan voor zover het reeds bestaande
      derivatenposities betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel276
      [ref2]: https://wetten.overheid.nl/BWBR0020368
