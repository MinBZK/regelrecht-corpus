        bwb_id: BWBR0020368
        artikel: 1:1
  - number: 49b
    text: |-
      1 Een uitgevende instelling kan:

      a. een centraal instituut schriftelijk verzoeken tot verstrekking van de naam, het adres, in voorkomend geval
      de unieke identificatiecode voor rechtspersonen, en, indien aanwezig, het e-mailadres van iedere aangesloten
      instelling die als deelgenoot in het girodepot gerechtigd is tot door de uitgevende instelling of met haar
      medewerking uitgegeven effecten met een aandelenkarakter, alsmede van het tegoed van iedere aangesloten instelling
      luidend in zodanige effecten in dat girodepot, de categorieën of klassen van de effecten en de datum sinds welke de
      effecten worden aangehouden;

      b. een intermediair van wie de uitgevende instelling weet of redelijkerwijs mag aannemen dat deze een verzameldepot
      houdt van door de uitgevende instelling of met haar medewerking uitgegeven effecten met een aandelenkarakter,
      schriftelijk verzoeken tot verstrekking van de naam, het adres, in voorkomend geval de unieke identificatiecode
      voor rechtspersonen en, indien aanwezig, het e-mailadres van iedere deelgenoot in dat verzameldepot alsmede van het
      tegoed van iedere deelgenoot luidend in zodanige effecten in dat verzameldepot, de categorieën of klassen van de
      effecten en de datum sinds welke de effecten worden aangehouden;

      c. een instelling in het buitenland van wie de uitgevende instelling weet of redelijkerwijs mag aannemen dat zij,
      beroepsmatig en anders dan als aandeelhouder, door de uitgevende instelling of met haar medewerking uitgegeven
      effecten met een aandelenkarakter bewaart, administreert of aanhoudt, schriftelijk verzoeken tot verstrekking
      van de naam, het adres, in voorkomend geval de unieke identificatiecode voor rechtspersonen, het tegoed luidend
      in zodanige effecten en, indien aanwezig, het e-mailadres van iedere cliënt voor wie zij een tegoed luidend in
      effecten met een aandelenkarakter bewaart, administreert of aanhoudt alsmede van het tegoed van iedere cliënt
      luidend in zodanige effecten dat bij de instelling wordt aangehouden, de categorieën of klassen van de effecten en
      de datum sinds welke de effecten worden aangehouden; of

      d. een bewaarder als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] van wie de uitgevende
      instelling weet of redelijkerwijs mag aannemen dat hij door de uitgevende instelling of met haar medewerking
      uitgegeven effecten met een aandelenkarakter bewaart, administreert of aanhoudt, schriftelijk verzoeken tot
      verstrekking van de naam, het adres, in voorkomend geval de unieke identificatiecode voor rechtspersonen en,
      indien aanwezig, het e-mailadres van de beheerder van de desbetreffende beleggingsinstelling of icbe alsmede van
      het tegoed van de beheerder luidend in zodanige effecten dat bij de bewaarder wordt aangehouden, de categorieën of
      klassen van de effecten en de datum sinds welke de effecten worden aangehouden.

      2 Een uitgevende instelling kan een partij in de bewaarketen verzoeken tot verstrekking van de naam, het adres,
      in voorkomend geval de unieke identificatiecode voor rechtspersonen, en, indien aanwezig, het e-mailadres van
      iedere aandeelhouder die door de uitgevende instelling of met haar medewerking uitgegeven effecten met een
      aandelenkarakter aanhoudt, alsmede het tegoed in zodanige effecten, de categorieën of klassen van de effecten en de
      datum sinds welke de effecten worden aangehouden.

      3 In afwijking van het eerste en het tweede lid kan een uitgevende instelling met zetel in Nederland de verzoeken,
      bedoeld in het eerste en tweede lid, slechts doen ten aanzien van aandeelhouders die ten minste een tweehonderdste
      deel van het geplaatste kapitaal van de uitgevende instelling vertegenwoordigen.

      4 De partij in de bewaarketen met zetel in Nederland tot wie het verzoek, bedoeld in het eerste of het tweede lid,
      is gericht verstrekt de verzochte gegevens onverwijld aan de uitgevende instelling, of een door haar aangewezen
      derde.

      5 In afwijking van het vierde lid geleidt de partij in de bewaarketen met zetel in Nederland tot wie het verzoek,
      bedoeld in het tweede lid, is gericht en die niet of niet volledig over de gevraagde gegevens beschikt, het
      verzoek telkens onverwijld door aan de partijen in de bewaarketen voor wie zij de effecten met een aandelenkarakter
      bewaren. Wanneer het verzoek de partijen bereikt die over de verzochte gegevens, of een deel daarvan, beschikken
      verstrekken die vervolgens de verzochte gegevens onverwijld aan de uitgevende instelling of een door haar
      aangewezen derde.

      6 Op schriftelijk verzoek, gedaan in een periode vanaf zestig dagen tot de tweeënveertigste dag voor die van
      de algemene vergadering, van een aandeelhouder die op het moment van het verzoek alleen of gezamenlijk met
      andere aandeelhouders tenminste een tiende gedeelte van het geplaatste kapitaal van een uitgevende instelling
      vertegenwoordigt, identificeert de uitgevende instelling aandeelhouders van door haar of met haar medewerking
      uitgegeven effecten met een aandelenkarakter door middel van het doen van verzoeken als bedoeld in het eerste lid.

      7 Uiterlijk op het moment van het eerste verzoek als bedoeld in het eerste lid doet de uitgevende instelling
      hierover een mededeling op haar website, onder vermelding van de mogelijkheid van verzending van informatie
      overeenkomstig [artikel 49c][ref2], de mogelijke data van die verzending en de uiterlijke data voor
      terbeschikkingstelling van informatie door aandeelhouders.

      8 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop een verzoek op grond
      van het eerste of vijfde lid wordt gedaan en beantwoord.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel49c
