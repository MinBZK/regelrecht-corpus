  - number: '33'
    text: |-
      1 In geval van faillissement van de intermediair is de curator belast met het beheer van het verzameldepot. Hij
      brengt het verzameldepot tot verdeling met inachtneming van de bepalingen van deze wet. Indien het bedrijf van de
      gefailleerde instelling overeenkomstig [artikel 98 van de Faillissementswet][ref1] wordt voortgezet, is de curator
      bevoegd tot verdeling van het verzameldepot over te gaan.

      2 Het eerste lid is van overeenkomstige toepassing ingeval de schuldsaneringsregeling natuurlijke
      personen ten aanzien van de intermediair van toepassing is, met dien verstande dat in de plaats van
      [artikel 98 van de Faillissementswet][ref2] wordt gelezen [artikel 311 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0001860#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel311
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel33
