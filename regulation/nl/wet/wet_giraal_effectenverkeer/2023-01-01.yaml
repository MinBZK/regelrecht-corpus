    text: |-
      1 Partijen in de bewaarketen met zetel in Nederland maken voor elke dienst die overeenkomstig dit hoofdstuk
      wordt aangeboden afzonderlijk de kosten openbaar die in rekening kunnen worden gebracht bij aandeelhouders,
      vennootschappen of andere partijen in de bewaarketen.

      2 De kosten, bedoeld in het eerste lid, zijn niet-discriminatoir en evenredig met de daadwerkelijk gemaakte kosten.
    url: https://wetten.overheid.nl/BWBR0003109/2023-01-01#Artikel49dc
  - number: 49e
    text: |-
      1 Indien een verzoek als bedoeld in [artikel 49b, eerste lid, onderdeel a, b of d, of tweede lid][ref1] en
      [artikel 49da, tweede of derde lid][ref2], geheel of gedeeltelijk niet wordt beantwoord, kan de rechtbank binnen
      wiens arrondissement de partij in de bewaarketen tot wie het verzoek is gericht is gevestigd, op vordering van de
      uitgevende instelling of een derde aan wie de uitgevende instelling een volmacht heeft verleend degene tot wie het
      verzoek is gericht bevelen het gedane verzoek na te komen.

      2 Indien een verzoek als bedoeld in [artikel 49da, vijfde lid][ref3] en [artikel 49db, eerste lid][ref4], niet
      wordt beantwoord, kan de rechtbank binnen wiens arrondissement de partij in de bewaarketen tot wie het verzoek is
      gericht is gevestigd, op vordering van de aandeelhouder of een derde aan wie de aandeelhouder een volmacht heeft
      verleend degene tot wie het verzoek is gericht bevelen het gedane verzoek na te komen.

      3 De bevoegdheid om de vordering in te stellen vervalt door verloop van drie maanden vanaf de dag waarop de
      uitgevende instelling van de niet-beantwoording kennis heeft genomen of heeft kunnen nemen.


