preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het met het oog op het tegengaan van mogelijk misbruik wenselijk is te
    voorzien in de mogelijkheid subsidieontvangers een bestuurlijke boete op te leggen bij niet naleving van aan een
    subsidie van een minister verbonden bijzondere meldingsplichten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032155/2013-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet is van toepassing op door Onze Ministers verstrekte subsidies waarop ingevolge de
      [Algemene wet bestuursrecht][ref1][titel 4.2 van die wet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0032155/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
  - number: '2'
    text: |-
      Indien voor een subsidie een datum geldt waarop de activiteiten waarvoor de subsidie is verleend uiterlijk moeten
      zijn verricht alsmede een datum waarop de subsidie uiterlijk ambtshalve wordt vastgesteld, verbindt Onze Minister
      die het aangaat aan de subsidiebeschikking de bijzondere meldingsplicht voor de subsidieontvanger om, zodra
      de eerstgenoemde datum is verstreken zonder dat de activiteiten geheel zijn verricht, daarvan onverwijld een
      schriftelijke melding te doen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032155/2013-07-01#Artikel2
  - number: '3'
    text: |-
      Indien bij de verlening van een subsidie tevens voorschotten van in totaal per jaar gemiddeld € 200 000 of
      meer ambtshalve worden verleend, kan Onze Minister die het aangaat aan de subsidie de bijzondere meldingsplicht
      verbinden om, indien de gemaakte subsidiabele kosten in bij die beschikking te bepalen periodes 75% of minder
      bedragen van de voor de desbetreffende periode begrote subsidiabele kosten, dit binnen twee maanden na afloop van
      die periode schriftelijk te melden bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0032155/2013-07-01#Artikel3
  - number: '4'
    text: |-
      1 Indien aan een subsidie verplichtingen zijn verbonden die strekken tot het voorkomen van inzet van dwangarbeid
      en kinderarbeid bij subsidiabele activiteiten in het buitenland, kan Onze Minister die het aangaat aan de subsidie
      tevens de bijzondere meldingsplicht verbinden om feiten en omstandigheden die duiden op inzet van dwangarbeid of
      kinderarbeid door één of meer van de bij de subsidiabele activiteiten betrokken partijen die in de beschikking tot
      verlening van de subsidie zijn aangeduid, binnen een daarbij te bepalen termijn schriftelijk te melden.

      2 Onder dwangarbeid wordt verstaan gedwongen of verplichte arbeid als bedoeld in artikel 2 van het Verdrag
      betreffende den gedwongen of verplichten arbeid, 1930.

      3 Onder kinderarbeid wordt in elk geval verstaan elke vorm van arbeid in en buiten dienstverband verricht door
      personen die de leeftijd van 18 jaar nog niet hebben bereikt en die behoort tot de ergste vormen van kinderarbeid,
      bedoeld in artikel 3, van het Verdrag betreffende de ergste vormen van kinderarbeid, 1999.

      4 Indien de subsidiabele activiteiten plaatsvinden op het grondgebied van een Staat die partij is bij het Verdrag
      betreffende de minimumleeftijd, 1973 wordt voorts onder kinderarbeid verstaan: elke vorm van arbeid die krachtens
      de wetgeving van die Staat ter uitvoering van dat verdrag is verboden.

      5 Indien de subsidiabele activiteiten plaatsvinden op het grondgebied van een Staat die geen partij is bij het
      Verdrag betreffende de minimumleeftijd, 1973 wordt onder kinderarbeid voorts verstaan:

      a. elke vorm van arbeid in en buiten dienstverband verricht door personen die leerplichtig zijn of die de leeftijd
      van 15 jaar nog niet hebben bereikt, en

      b. elke vorm van arbeid in en buiten dienstverband verricht door personen die de leeftijd van 18 jaar nog niet
      hebben bereikt, voor zover die arbeid krachtens de aard van de arbeid of de omstandigheden waaronder deze wordt
      uitgevoerd de gezondheid, de veiligheid of de zedelijkheid van jeugdige personen in gevaar kan brengen.

      6 In afwijking van het vijfde lid wordt onder kinderarbeid niet verstaan lichte werkzaamheden als bedoeld in
      artikel 7, eerste lid, van het Verdrag betreffende de minimumleeftijd, 1973, die gedurende ten hoogste 14 uur per
      week worden verricht door personen die de leeftijd van 13 jaar hebben bereikt.

      7 Indien blijkens de subsidie-aanvraag de omstandigheden waaronder de arbeid wordt verricht van dien aard zijn
      dat ontwikkeling, scholing, gezondheid, veiligheid noch zedelijkheid van de desbetreffende personen hierdoor
      naar verwachting wordt geschaad kan Onze Minister die het aangaat in de beschikking tot verlening van de subsidie
      bepalen dat, in afwijking van het vijfde en het zesde lid, onder kinderarbeid niet wordt verstaan:

      a. arbeid als bedoeld in het vijfde lid onder a, verricht door personen die nog leerplichtig zijn;

      b. arbeid als bedoeld in het vijfde lid onder a, verricht door personen die de leeftijd van 14 jaar hebben bereikt;

      c. arbeid als bedoeld in het vijfde lid onder b, verricht door personen die de leeftijd van 16 jaar hebben bereikt;

      d. lichte werkzaamheden als bedoeld in het zesde lid, verricht door personen die de leeftijd van 12 jaar hebben
      bereikt.

      8 Onze Minister die het aangaat kan bij toepassing van het zevende lid voorschriften en beperkingen aan de
      subsidiebeschikking verbinden met het oog op bescherming van de ontwikkeling, scholing, gezondheid, veiligheid en
      zedelijkheid van de desbetreffende personen.
    url: https://wetten.overheid.nl/BWBR0032155/2013-07-01#Artikel4
  - number: '5'
    text: |-
      Een beschikking waarbij een bijzondere meldingsplicht als bedoeld in [artikel 2][ref1], [3][ref2] of [4][ref3]
      aan een subsidie wordt verbonden, merkt deze aan als bijzondere meldingsplicht in de zin van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0032155#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032155#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0032155#Artikel4
    url: https://wetten.overheid.nl/BWBR0032155/2013-07-01#Artikel5
