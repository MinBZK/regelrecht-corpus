  - number: '6'
    text: |-
      1 Het niet voldoen aan de bijzondere meldingsplicht, bedoeld in [artikel 2][ref1], is een overtreding ter zake
      waarvan door Onze Minister die het aangaat een bestuurlijke boete kan worden opgelegd van ten hoogste het bedrag
      van de vierde categorie geldboete, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].

      2 Het niet voldoen aan de bijzondere meldingsplicht, bedoeld in [artikel 3][ref3] of [artikel 4, eerste lid][ref4],
      is een overtreding ter zake waarvan door Onze Minister die het aangaat een bestuurlijke boete
      kan worden opgelegd van ten hoogste het bedrag van de vijfde categorie geldboete, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0032155#Artikel2
