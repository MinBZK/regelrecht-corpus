  - number: '8'
    text: |-
      Onze Minister van Financiën zendt binnen 5 jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0032155/2013-07-01#Artikel8
  - number: '9'
    text: Deze wet is niet van toepassing op subsidies die voor de inwerkingtreding van deze wet zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0032155/2013-07-01#Artikel9
  - number: '10'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0032155/2013-07-01#Artikel10
  - number: '11'
    text: 'Deze wet wordt aangehaald als: Wet bestuurlijke boete meldingsplichten door ministers verstrekte subsidies.'
