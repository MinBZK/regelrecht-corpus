  - number: '6'
    text: |-
      1 Zodra de noodzakelijk geachte scholing en begeleiding zijn uitgevoerd volgens de in [artikel 5][ref1] bedoelde
      overeenkomst, en tijdig voor het verstrijken van de benoemingsperiode of tewerkstellingsperiode, bedoeld in
      [artikel 2, tweede lid][ref2], stelt het instellingsbestuur van de instelling voor hoger onderwijs die de scholing
      verzorgt of onder haar verantwoordelijkheid doet verzorgen, de leraar in de gelegenheid deel te nemen aan een
      bekwaamheidsonderzoek.

      2 Door het bekwaamheidsonderzoek wordt vastgesteld of de leraar de
      bekwaamheden bezit die in overeenstemming zijn met de kwaliteiten, bedoeld in
      [artikel 7.13, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] zoals die zijn
      opgenomen in de onderwijs- en examenregeling van de desbetreffende lerarenopleiding.

      3 Het met goed gevolg deelnemen aan het bekwaamheidsonderzoek wordt gelijkgesteld met het met goed
      gevolg afleggen van het afsluitend examen van de desbetreffende lerarenopleiding, verzorgd door de
      in het eerste lid bedoelde instelling, met dien verstande dat het daaraan verbonden getuigschrift
      wordt uitgereikt door de daarvoor in aanmerking komende examencommissie van die instelling.
      Het getuigschrift, uitgereikt op grond van de eerste volzin, wordt ingericht volgens een bij
      ministeriële regeling vast te stellen model, waarbij kan worden afgeweken van de laatste volzin van
      [artikel 7.11, eerste lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4].


