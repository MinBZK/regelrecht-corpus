  - number: '7'
    text: |-
      1 Het instellingsbestuur dat zich daartoe bij Onze Minister heeft gemeld, is na die melding en
      onder overlegging van een plan van aanpak, in aanvulling op het bepaalde bij of krachtens de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] bevoegd tot:

      a. het uitvoeren of onder zijn verantwoordelijkheid doen uitvoeren van geschiktheidsonderzoek,

      b. het verstrekken van geschiktheidsverklaringen op grond van het geschiktheidsonderzoek,

      c. het met inachtneming van [artikel 4, tweede lid, onder c][ref2], doen van voorstellen omtrent de in dat artikel
      bedoelde scholing en begeleiding,

      d. het verzorgen of onder zijn verantwoordelijkheid doen verzorgen van die scholing en begeleiding, en

      e. het uitvoeren of onder zijn verantwoordelijkheid doen uitvoeren van bekwaamheidsonderzoek.

      2 Het instellingsbestuur kan bepalen dat de aanvrager van het geschiktheidsonderzoek een vergoeding is verschuldigd
      voor uitvoering van dat onderzoek en afgifte van de geschiktheidsverklaring, alsmede voor het bekwaamheidsonderzoek
      en afgifte van het in [artikel 6, derde lid][ref3], bedoelde getuigschrift. Bij algemene maatregel van bestuur kan
      voor deze bijdrage een maximum worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0011469#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0011469#Artikel6
