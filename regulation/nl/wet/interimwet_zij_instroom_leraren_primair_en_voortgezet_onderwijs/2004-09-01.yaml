preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het teneinde de diversiteit in het beroep van leraar te vergroten
    en meer ruimte te bieden voor nieuwe kwaliteiten, alsmede vanwege de problematische arbeidsmarktsituatie
    in het primair en voortgezet onderwijs wenselijk is regelen te stellen opdat personen die niet de vereiste
    onderwijsbevoegdheid bezitten maar wel geschikt worden geacht voor het beroep van leraar, onder voorwaarden
    tijdelijk kunnen worden belast met het geven van onderwijs in afwachting van het alsnog verkrijgen van die
    bevoegdheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0011469/2004-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende regelingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap, en voorzover het betreft het
      landbouwonderwijs, Onze Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. school:

      1°. een basisschool of een speciale school voor basisonderwijs als bedoeld in de
      [Wet op het primair onderwijs][ref1];

      2°. een school voor speciaal onderwijs, een school of instelling voor speciaal en voortgezet speciaal onderwijs of
      een school voor voortgezet speciaal onderwijs als bedoeld in de [Wet op de expertisecentra][ref2];

      3°. een school voor voortgezet onderwijs als bedoeld in de [Wet op het voortgezet onderwijs][ref3];

      c. bevoegd gezag: het bevoegd gezag van een school;

      d. directeur: de directeur, bedoeld in [artikel 29, eerste lid, van de Wet op het primair onderwijs][ref4] of
      [artikel 29, eerste lid, van de Wet op de expertisecentra][ref5];

      e. instelling voor hoger onderwijs: een instelling voor hoger onderwijs als bedoeld in
      [artikel 1.1, onder g, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref6], die een
      lerarenopleiding verzorgt;

      f. instellingsbestuur: het instellingsbestuur, bedoeld in
      [artikel 1.1, onderdeel j, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref7],
      met dien verstande dat voorzover het openbare instellingen voor hoger onderwijs betreft, de
      [artikelen 9.2, tweede lid][ref8], [10.9, tweede lid][ref9], en [11.1, tweede lid, van die wet][ref10] van
      overeenkomstige toepassing zijn;

      g. geschiktheidsverklaring: de in [artikel 3, eerste lid][ref11], bedoelde verklaring;

      h. geschiktheidsonderzoek: het in [artikel 4, eerste lid][ref12], bedoelde onderzoek;

      i. bekwaamheidsonderzoek: het in [artikel 6][ref13] bedoelde onderzoek.


