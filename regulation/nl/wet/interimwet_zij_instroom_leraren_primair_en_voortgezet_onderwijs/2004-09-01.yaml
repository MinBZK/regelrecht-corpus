  - number: '8'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven voor de uitvoering van
      [artikel 4, tweede lid, onder b, en vierde lid][ref1].

      2 Tevens kunnen bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur voorschriften worden
      vastgesteld voor de uitvoering van deze wet, waaronder in elk geval voorschriften met betrekking tot:

      a. waarborging van de kwaliteit van het geschiktheidsonderzoek en van de instellingen die dat onderzoek uitvoeren,

      b. de scholing en begeleiding, en het bekwaamheidsonderzoek, waaronder voorschriften ter waarborging van de
      kwaliteit,

      c. de procedure voor het indienen van een aanvraag voor het geschiktheidsonderzoek, voor afgifte van de
      geschiktheidsverklaring en voor afgifte van het getuigschrift, bedoeld in [artikel 6, derde lid][ref2], alsmede

      d. gevallen waarin men voor dezelfde werkzaamheden wenst te worden benoemd aan scholen die niet uitgaan van
      hetzelfde bevoegd gezag, voor welke gevallen bijzondere, zonodig van een of meer onderdelen van deze wet afwijkende
      voorschriften kunnen worden vastgesteld met het oog op een goede toepassing van deze wet.

      3 De algemene maatregel van bestuur, bedoeld in het eerste lid, wordt aan de beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken en niet door
      of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde onderwerp bij de
      wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011469#Artikel6
