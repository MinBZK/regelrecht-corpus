  - number: '10'
    text: |-
      1 Het instellingsbestuur draagt zorg voor de kwaliteit van de in [artikel 7, eerste lid][ref1], bedoelde
      werkzaamheden.

      2 [Hoofdstuk 5 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] is van toepassing ten aanzien
      van instellingen voor hoger onderwijs waarvan het instellingsbestuur een in [artikel 7, eerste lid][ref3], bedoelde
      melding heeft gedaan.

      3 Onze Minister kan besluiten dat ten aanzien van een instelling voor hoger onderwijs een of meer van de in
      [artikel 7, eerste lid][ref4], genoemde bevoegdheden worden ontnomen indien gebleken is dat de kwaliteit van de
      uitoefening daarvan tekortschiet, dan wel indien niet of niet meer wordt voldaan aan het bij en krachtens deze wet
      bepaalde. [Artikel 6.10, vierde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5] is van
      overeenkomstige toepassing ten aanzien van de ontneming.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel7
