  - number: '14'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst, en vervalt op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0011469/2004-09-01#Artikel14
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Interimwet zij-instroom leraren primair en voortgezet onderwijs.'
