  - number: '11'
    text: |-
      1 Het bevoegd gezag en het instellingsbestuur dat zich op grond van [artikel 7, eerste lid][ref1], heeft gemeld,
      verstrekken aan Onze Minister alle inlichtingen die deze nodig acht ten behoeve van een goede naleving van deze
      wet.

      2 Het in het eerste lid bedoelde instellingsbestuur zendt de inspectie van het onderwijs telkens na zes maanden een
      overzicht van in die periode afgegeven geschiktheidsverklaringen en bekwaamheidsonderzoeken waaraan met goed gevolg
      is deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel7
