  - number: '12'
    text: |-
      Onze Minister kan voor inwerkingtreding van deze wet afgegeven respectievelijk opgestelde verklaringen en adviezen
      voor de toepassing van deze wet gelijkstellen met geschiktheidsverklaringen respectievelijk gelijkstellen aan het
      oordeel, bedoeld in [artikel 4, tweede lid, onder c][ref1], indien zij daarmee vergelijkbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel4
    url: https://wetten.overheid.nl/BWBR0011469/2004-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011469
        artikel: '4'
  - number: '13'
    text: |-
      Indien de in [artikel 4, derde lid][ref1], [artikel 7, tweede lid][ref2], of [artikel 8, eerste lid][ref3],
      bedoelde algemene maatregel van bestuur niet is vastgesteld bij inwerkingtreding van deze wet, kan in de
      onderwerpen van die algemene maatregel van bestuur worden voorzien bij ministeriële regeling, gedurende een
      periode van ten hoogste zes maanden gerekend vanaf de datum van uitgifte van het Staatsblad waarin deze wet wordt
      geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011469#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0011469#Artikel8
