  - number: '5'
    text: |-
      Het instellingsbestuur van een instelling voor hoger onderwijs die werkzaamheden als bedoeld in
      [artikel 7, eerste lid, onder d en e][ref1], uitvoert, het bevoegd gezag dat betrokkene benoemt, en betrokkene
      zelf, sluiten een overeenkomst die hun wederzijdse rechten en plichten omvat met betrekking tot het uitvoeren
      van de noodzakelijk geachte scholing en begeleiding, met inachtneming van de beoordeling, bedoeld in
      [artikel 4, tweede lid, onder c][ref2]. Indien na het sluiten van de overeenkomst blijkt dat de scholing of
      begeleiding niet volgens de overeenkomst kan worden uitgevoerd, treft het instellingsbestuur respectievelijk het
      bevoegd gezag tijdig een toereikende vervangende voorziening. Indien het bevoegd gezag betrokkene tewerkstelt
      zonder benoeming, is de werkgever waarbij betrokkene in dienst is, mede partij bij de in de eerste volzin bedoelde
      overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011469#Artikel4
