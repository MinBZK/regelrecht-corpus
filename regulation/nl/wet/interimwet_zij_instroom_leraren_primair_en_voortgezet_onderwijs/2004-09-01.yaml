  - number: '3'
    text: |-
      1 Aan degene die blijkens een geschiktheidsonderzoek voldoende geschikt wordt geacht voor het beroep van leraar
      en in staat moet worden geacht binnen twee jaar na benoeming of tewerkstelling zonder benoeming tot leraar met
      goed gevolg deel te nemen aan het bekwaamheidsonderzoek, wordt een geschiktheidsverklaring afgegeven door het
      instellingsbestuur onder verantwoordelijkheid waarvan het geschiktheidsonderzoek wordt uitgevoerd.

      2 Bij ministeriële regeling wordt een model voor de geschiktheidsverklaring vastgesteld.
    url: https://wetten.overheid.nl/BWBR0011469/2004-09-01#Artikel3
  - number: '4'
    text: |-
      1 Het geschiktheidsonderzoek wordt op aanvraag van het bevoegd gezag dat voornemens is betrokkene te benoemen
      of tewerk te stellen, of op aanvraag van betrokkene zelf, uitgevoerd onder verantwoordelijkheid van een
      instellingsbestuur. Het instellingsbestuur betrekt bij het geschiktheidsonderzoek het bevoegd gezag dat voornemens
      is betrokkene te benoemen of tewerk te stellen, of indien de aanvraag wordt ingediend door betrokkene zelf, een
      daartoe in overeenstemming met deze laatste uitgenodigd bevoegd gezag.

      2 Het geschiktheidsonderzoek omvat:

      a. de beoordeling of de gevolgde opleiding en de maatschappelijke of beroepservaring van betrokkene, in onderlinge
      samenhang bezien, van voldoende belang zijn in verhouding tot de door deze beoogde werkzaamheden aan een school, en
      indien dat het geval is

      b. het onderzoek naar de geschiktheid van betrokkene voor die werkzaamheden, waartoe in ieder geval wordt gerekend
      de beoordeling of betrokkene in de feitelijke klassituatie tot verantwoord lesgeven in staat is, alsmede

      c. de beoordeling, welke scholing en begeleiding voor betrokkene noodzakelijk moeten worden geacht om met goed
      gevolg deel te kunnen nemen aan het bekwaamheidsonderzoek.

      3 Uit de aanvraag voor het geschiktheidsonderzoek blijkt dat betrokkene in het bezit is van:

      a. een getuigschrift van met goed gevolg afgelegd afsluitend examen van een opleiding
      in het wetenschappelijk onderwijs of in het hoger beroepsonderwijs als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1], dan wel van een EG-verklaring als bedoeld in de
      [Algemene wet erkenning EG-hoger-onderwijsdiploma's][ref2],

      b. een diploma van een middenkaderopleiding of van een specialistenopleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onder d respectievelijk e, van de Wet educatie en beroepsonderwijs][ref3], of van
      een vakopleiding als bedoeld in [artikel 7.2.2, eerste lid, onder c, van die wet][ref4], aangewezen op grond
      van [artikel 7.24, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5], voorzover
      betrokkene voornemens is onderwijs te geven in bij algemene maatregel van bestuur aangewezen beroepsgerichte
      vakken als bedoeld in de [Wet op het voortgezet onderwijs][ref6], dan wel van een EG-verklaring als bedoeld in de
      [Algemene wet erkenning EG-beroepsopleidingen][ref7] voor overeenkomstig onderwijs, of

      c. een buitenlands getuigschrift dat naar het oordeel van het instellingsbestuur gelijkwaardig is aan een onder a
      of b bedoeld getuigschrift of diploma.

      4 Het in het tweede lid, onder b, bedoelde onderzoek is erop gericht, vast te stellen of betrokkene in voldoende
      mate beschikt over kennis, inzicht en vaardigheden om te kunnen worden belast met het geven van onderwijs dat
      voldoet aan de daaraan gestelde kwaliteitseisen, in aanmerking nemend dat betrokkene in de benoemingsperiode of
      tewerkstellingsperiode begeleid en verder geschoold zal worden om met goed gevolg deel te kunnen nemen aan het
      bekwaamheidsonderzoek. De in de eerste volzin bedoelde kennis en vaardigheden en het in die volzin bedoelde inzicht
      zijn afgeleid van de in [artikel 6][ref8] bedoelde bekwaamheidseisen en omvatten in het bijzonder beroepsmatige
      vaardigheden.

      5 Het geschiktheidsonderzoek is zodanig ingericht dat daarbij in gelijke mate zijn betrokken, personeel
      van de desbetreffende instelling voor hoger onderwijs voorzover belast met het geven van onderwijs in een
      lerarenopleiding, alsmede vertegenwoordigers van leraren in het desbetreffende vak of vakgebied, niet zijnde
      personeelsleden van het bevoegd gezag dat is betrokken bij het geschiktheidsonderzoek.

      6 De algemene maatregel van bestuur, bedoeld in het derde lid, onder b, wordt aan de beide Kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat vier weken na de overlegging zijn verstreken
      en niet door of namens een van beide Kamers de wens wordt te kennen gegeven dat het in die maatregel geregelde
      onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.


