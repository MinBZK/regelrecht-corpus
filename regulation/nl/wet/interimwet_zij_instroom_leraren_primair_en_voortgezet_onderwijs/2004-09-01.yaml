    text: |-
      1 In afwijking van de [artikelen 3][ref1], [32][ref2] en [186 van de Wet op het primair onderwijs][ref3],
      de [artikelen 3][ref4], [32][ref5] en [171 van de Wet op de expertisecentra][ref6] en de
      [artikelen 33 tot en met 37f van de Wet op het voortgezet onderwijs][ref7], kan onderwijs worden gegeven door, en
      kan het bevoegd gezag van een school tot leraar of directeur benoemen of zonder benoeming tewerkstellen degene die:

      a. voldoet aan het bij of krachtens die artikelen bepaalde ten aanzien van het bezit van een verklaring omtrent het
      gedrag, afgegeven volgens de [Wet justitiële en strafvorderlijke gegevens][ref8],

      b. in het bezit is van een geschiktheidsverklaring, en

      c. niet krachtens rechterlijke uitspraak van het geven van onderwijs is uitgesloten.

      2 Benoeming of tewerkstelling zonder benoeming ingevolge het eerste lid geschiedt voor een periode van ten hoogste
      twee aaneengesloten schooljaren. De inspectie van het onderwijs kan op aanvraag van het bevoegd gezag toestaan
      dat het bevoegd gezag de benoemingsperiode of tewerkstellingsperiode met ten hoogste de helft verlengt indien
      bijzondere omstandigheden daartoe naar zijn oordeel aanleiding geven. Het bevoegd gezag dat betrokkene voor de
      eerste maal na afgifte van de geschiktheidsverklaring benoemt, tekent het feit en de datum van benoeming aan op
      die verklaring.


