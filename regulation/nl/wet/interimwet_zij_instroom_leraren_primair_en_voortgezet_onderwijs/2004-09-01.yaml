  - number: '9'
    text: |-
      Het bepaalde bij en krachtens de [artikelen 2][ref1] tot en met [5][ref2] voorzover die voorschriften
      afwijken van de [Wet op het primair onderwijs][ref3], de [Wet op de expertisecentra][ref4] en de
      [Wet op het voortgezet onderwijs][ref5], wordt voor de toepassing van die onderscheiden wetten aangemerkt als deel
      uitmakend van de voorschriften bij en krachtens die wetten met betrekking tot het geven van onderwijs door, en
      benoeming van leraren of directeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0011469#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011469#Artikel5
