  - number: 7a
    text: |-
      1 Met betrekking tot het wijzigen en intrekken van een vergunning is [afdeling 8.1.2 van de Wet milieubeheer][ref1]
      van overeenkomstige toepassing.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat
      [artikel 8.25, achtste lid, van de Wet milieubeheer][ref2] van toepassing is in plaats van
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] en [afdeling 13.2 van de Wet milieubeheer][ref4].

      3 De krachtens [artikel 7, vierde lid][ref5], aangewezen bestuursorganen worden in de gelegenheid gesteld advies
      uit te brengen met betrekking tot het wijzigen en intrekken van een vergunning.

      4 Met betrekking tot het wijzigen en intrekken van een vergunning is [artikel 8.27 van de Wet milieubeheer][ref6]
      van overeenkomstige toepassing, met dien verstande dat voor die toepassing onder "Onze Minister" wordt verstaan:
      Onze Minister van Verkeer en Waterstaat.


