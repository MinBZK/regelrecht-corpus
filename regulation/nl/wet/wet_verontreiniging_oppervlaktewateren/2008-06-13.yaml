preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat regelen dienen te worden gesteld tot het tegengaan en tot het voorkomen
    van verontreiniging van oppervlaktewateren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het is verboden zonder vergunning met behulp van een werk afvalstoffen, verontreinigende of schadelijke stoffen,
      in welke vorm ook, te brengen in oppervlaktewateren.

      2 Het verbod, bedoeld in het eerste lid, geldt niet voor een lozing met behulp van een werk dat op een ander
      werk is aangesloten. Deze uitzondering geldt niet voor lozingen waarbij door Ons bij algemene maatregel
      van bestuur aan te wijzen stoffen in oppervlaktewateren worden gebracht en voor lozingen vanuit door Ons
      bij algemene maatregel van bestuur aan te wijzen soorten van inrichtingen, voor lozingen van ten minste
      een door Ons bij algemene maatregel van bestuur vast te stellen hoeveelheid verontreinigende stoffen of
      afvalwater, alsmede voor lozingen met behulp van een werk, niet zijnde een voorziening als bedoeld in
      [artikel 10.30, eerste lid, van de Wet milieubeheer][ref1], dat is aangesloten op een inrichting voor het zuiveren
      van afvalwater, in beheer bij een waterschap of gemeente of in exploitatie bij een rechtspersoon die door het
      bestuur van een waterschap is belast met de zuivering van stedelijk afvalwater als bedoeld in [artikel 15a][ref2].

      3 Wij kunnen bij algemene maatregel van bestuur bepalen dat het zonder vergunning verboden is de in het eerste
      lid bedoelde stoffen op andere wijze dan met behulp van een werk in oppervlaktewateren te brengen. Bij algemene
      maatregel van bestuur kunnen Wij mede bepalen dat ten aanzien van alle of van bepaalde oppervlaktewateren
      het brengen op welke wijze ook van daarbij aan te geven soorten van stoffen als bedoeld in het eerste lid in
      oppervlaktewateren is verboden. Voorzover hierin door Ons niet bij algemene maatregel van bestuur is voorzien,
      kunnen provinciale staten bij verordening bepalen dat het zonder vergunning verboden is de in het eerste lid
      bedoelde stoffen op andere wijze dan met behulp van een werk te brengen in oppervlaktewateren, als bedoeld in
      [artikel 3, tweede lid][ref3].

      4 Het is verboden zonder vergunning van of vanwege Onze Minister van Verkeer en Waterstaat stoffen als bedoeld in
      het eerste lid met behulp van een werk vanaf of over het grondgebied van Nederland in het water van de volle zee
      te brengen.

      5 Aan een vergunning worden voorschriften verbonden tot bescherming van de belangen, waarvoor het vereiste van
      vergunning is gesteld. De voorschriften kunnen mede strekken tot bescherming van het belang van een doelmatige
      werking van het betrokken zuiveringstechnische werk. Bij het stellen van de voorschriften worden de op grond van
      [artikel 1][ref4] van toepassing zijnde grenswaarden in acht genomen.

      6 Bij het verlenen, wijzigen of intrekken van een vergunning, als bedoeld in het eerste en derde lid, wordt
      rekening gehouden met de in de [artikelen 5 en 9 van de Wet op de waterhuishouding][ref5] bedoelde beheersplannen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.30
