        artikel: '1'
        hoofdstuk: I
  - number: 31c
    text: |-
      Het bestuursorgaan dat bevoegd is een vergunning krachtens [artikel 1][ref1] te verlenen draagt er zorg voor
      dat vergunningen, verleend voor lozingen vanuit inrichtingen waartoe gpbv-installaties als bedoeld in de
      [Wet milieubeheer][ref2] behoren, voorzover die niet in overeenstemming zijn met de regels die voor 31 oktober
      2007 ter uitvoering van de [richtlijn (EG) nr. 96/61](31996L0061) van de Raad van de Europese Unie van 24 september
      1996 inzake geïntegreerde preventie en bestrijding van verontreiniging (PbEG L 257) bij of krachtens deze wet zijn
      gesteld, uiterlijk met ingang van die datum daarmee in overeenstemming zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel31c
