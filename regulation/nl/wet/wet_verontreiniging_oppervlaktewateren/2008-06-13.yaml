        bwb_id: BWBR0003245
  - number: '32'
    text: |-
      1 Er is het Rijksinstituut voor Integraal Zoetwaterbeheer en Afvalwaterbehandeling, belast met het
      wetenschappelijke en praktische onderzoek van de hoedanigheid van oppervlaktewateren en van de wijze waarop deze
      kunnen worden beschermd tegen verontreiniging in welke vorm ook en voorts met het geven van adviezen betreffende de
      met het oog op die bescherming te treffen voorzieningen.

      2 Aan het hoofd van dit instituut staat een hoofdingenieur-directeur. De algemene leiding van het instituut berust
      bij de directeur-generaal van de Rijkswaterstaat.

      3 Onze Minister van Verkeer en Waterstaat geeft regelen omtrent de inrichting en werkwijze van het instituut en
      omtrent de aan dit instituut te betalen vergoedingen voor bewezen diensten.
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel32
  - number: '33'
    text: |-
      Het ontwerp van een ministeriële regeling, vast te stellen krachtens of met overeenkomstige toepassing van
      [artikel 2][ref1], wordt ten minste een maand voor de regeling wordt vastgesteld, toegezonden aan de Staten-
      Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 2a
        hoofdstuk: I
  - number: 33a
    text: |-
      1 De voordracht voor een algemene maatregel van bestuur krachtens [artikel 1, tweede of derde lid][ref1], 1*a*,
      2*a*, 2*d*, 4, 14, 15, 19, zesde, zevende of achtste lid, of 31, vierde lid, wordt Ons gedaan door Onze Ministers
      van Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      2 Het ontwerp van een algemene maatregel van bestuur krachtens [artikel 1, tweede of derde lid][ref2], 1*a*, 2*a*,
      2*d* of 4 wordt overgelegd aan de beide kamers der Staten-Generaal en in de *Staatscourant* bekendgemaakt. Aan een
      ieder wordt de gelegenheid geboden binnen een bij die bekendmaking te stellen termijn van ten minste vier weken
      opmerkingen over het ontwerp schriftelijk ter kennis van Onze genoemde Ministers te brengen.

      3 Een algemene maatregel van bestuur als bedoeld in het tweede lid wordt, nadat hij is vastgesteld, toegezonden aan
      beide Kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier weken na de datum van uitgifte van het
      *Staatsblad* waarin hij is geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel33a
