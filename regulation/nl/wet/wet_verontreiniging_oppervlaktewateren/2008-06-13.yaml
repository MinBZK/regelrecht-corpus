  - number: '14'
    text: |-
      1 Voor de oppervlaktewateren met betrekking tot welke Onze Minister van Verkeer en Waterstaat ingevolge
      [artikel 3, eerste lid][ref1], het bevoegde gezag is, stelt deze een inventarisatie op van het brengen in
      oppervlaktewateren van bij algemene maatregel van bestuur aan te wijzen stoffen, een en ander volgens bij die
      maatregel te stellen regels. Deze inventarisatie wordt tenminste eens in de drie jaar herzien.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van oppervlaktewateren voor welke besturen van
      waterschappen het bevoegde gezag zijn, met dien verstande dat gedeputeerde staten de inventarisatie doen opstellen
      door die besturen en de uitkomst van die inventarisatie ter beschikking stellen van Onze Minister van Verkeer en
      Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel3
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel14
