  - number: 30a
    text: Een gedraging in strijd met een aan een vergunning verbonden voorschrift, is verboden.
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel30a
  - number: '31'
    text: |-
      1 Bepalingen in verordeningen van provinciën, in reglementen voor en in verordeningen van waterschappen,
      veenschappen en veenpolders en in verordeningen van gemeenten betreffende het onderwerp dezer wet, bij
      de inwerkingtreding dezer wet van kracht, blijven in stand totdat deswege op de wijze in deze wet bepaald
      voorzieningen zullen zijn getroffen en zulks uiterlijk vier jaren na de dag van inwerkingtreding.

      2 Een vergunning vóór de inwerkingtreding dezer wet verleend op grond van enige wettelijke bepaling voor lozingen
      met behulp van werken als bedoeld in [artikel 1, eerste lid][ref1], wordt voor de toepassing van deze wet beschouwd
      als een vergunning als bedoeld in dat artikel.

      3 Voor lozingen welke vóór het tijdstip van inwerkingtreding dezer wet onafgebroken rechtmatig hebben plaats
      gevonden, wordt voor de toepassing van deze wet een vergunning als bedoeld in [artikel 1, eerste lid][ref2],
      geacht te zijn verleend, voorzover die lozingen althans naar hun aard niet aanmerkelijk verschillen van of niet van
      aanmerkelijk grotere omvang zijn dan lozingen die plaats vonden vóór het tijdstip van inwerkingtreding dezer wet.

      4 Door Ons worden bij algemene maatregel van bestuur stoffen of soorten van inrichtingen aangewezen voor de lozing
      waarvan onderscheidenlijk voor de lozingen vanwaaruit het derde lid niet meer geldt na het verstrijken van één jaar
      na afloop van de maand waarin die algemene maatregel van bestuur in het *Staatsblad* is geplaatst, tenzij binnen
      die termijn een vergunning, als bedoeld in [artikel 1, eerste lid][ref3], is aangevraagd, in welk geval het derde
      lid nog geldt gedurende één jaar nadat de op die aanvraag genomen beschikking onherroepelijk is geworden. Artikel
      9, is van overeenkomstige toepassing in geval van gehele of gedeeltelijke weigering van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel31
    references:
      - id: ref1
