  - number: '24'
    text: |-
      1 Het tarief voor de heffing ter zake van lozen op een oppervlaktewater in beheer bij het Rijk bedraagt € 25,00
      per vervuilingseenheid.

      2 Het tarief per vervuilingseenheid voor de verontreinigingsheffing rijkswateren ter zake van de stoffen die vanuit
      een zuiveringstechnisch werk voor het biologisch zuiveren van huishoudelijk afvalwater dat bij een waterschap in
      beheer is of in opdracht van een waterschap wordt geëxploiteerd, in rijkswater worden gebracht, bedraagt 50% van
      het in het eerste lid genoemde bedrag.

      3 Het tarief voor de heffing ter zake van lozen op een oppervlaktewater in beheer bij een kwaliteitsbeheerder niet
      zijnde Rijk, wordt bij verordening van die kwaliteitsbeheerder vastgesteld.

      4 Het tarief, bedoeld in het derde lid, bedraagt ten minste 50% en ten hoogste 100% van het voor
      een belastingjaar door het waterschap vastgestelde tarief voor de zuiveringsheffing bedoeld in
      [artikel 122d van de Waterschapswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel122d
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel24
