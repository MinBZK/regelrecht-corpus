  - number: '3'
    text: |-
      1 Ten aanzien van oppervlaktewateren in beheer bij het Rijk, de territoriale wateren hieronder begrepen, wordt
      voorzover die oppervlaktewateren niet bij of krachtens een algemene maatregel van bestuur als in het tweede lid
      bedoeld zijn aangewezen, een vergunning als in [artikel 1, eerste en derde lid][ref1] bedoeld verleend, geweigerd,
      gewijzigd of ingetrokken door of vanwege Onze Minister van Verkeer en Waterstaat. Voor de toepassing van het
      bij of krachtens deze wet bepaalde worden tot de oppervlaktewateren in beheer bij het Rijk mede gerekend de
      bij of krachtens algemene maatregel van bestuur aangewezen door anderen beheerde oppervlaktewateren die met de
      oppervlaktewateren in beheer bij het Rijk in open verbinding staan. Over een voordracht voor een zodanige algemene
      maatregel van bestuur stelt Onze Minister de besturen van de waterschappen die het bevoegde gezag zijn voor de
      betrokken oppervlaktewateren in de gelegenheid hun oordeel te geven.

      2 Ten aanzien van andere dan de in het eerste lid bedoelde oppervlaktewateren, alsmede ten aanzien van de in het
      eerste lid bedoelde oppervlaktewateren welke daartoe na overleg met gedeputeerde staten bij algemene maatregel
      van bestuur zijn aangewezen, wordt een vergunning als bedoeld in [artikel 1, eerste en derde lid][ref2], verleend,
      geweigerd, gewijzigd of ingetrokken door de besturen van de waterschappen waarbij die oppervlaktewateren in beheer
      zijn onderscheidenlijk door de besturen van de waterschappen in het gebied waarvan de bij die algemene maatregel
      van bestuur aangewezen oppervlaktewateren zijn gelegen.

      3 Ten aanzien van een lozing in de zin van [artikel 1, tweede lid][ref3], waarvoor een vergunning als bedoeld in
      [artikel 1, eerste lid][ref4], is vereist, wordt die vergunning verleend, geweigerd, gewijzigd of ingetrokken:

        - indien de lozing plaats vindt na zuivering in een inrichting in beheer bij een waterschap: door het bestuur van
      dat waterschap dan wel , indien dat waterschap door een ander waterschap met die zuivering is belast, door het
      bestuur van dat andere waterschap na overleg met het bestuur van eerstbedoeld waterschap
        - indien de lozing plaats vindt na zuivering in een inrichting in exploitatie bij een rechtspersoon, die door het
      bestuur van een waterschap met die zuivering is belast: door het bestuur van dat waterschap
        - indien de lozing plaats vindt na zuivering in een inrichting buiten de hiervoor bedoelde gevallen: door Onze
      Minister van Verkeer en Waterstaat onderscheidenlijk het bestuur van het waterschap als het ingevolge het eerste
      onderscheidenlijk tweede lid voor het ontvangende oppervlaktewater bevoegde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
