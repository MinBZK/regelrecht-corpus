  - number: 2b
    text: |-
      1 Bij een algemene maatregel van bestuur krachtens [artikel 2a, eerste lid][ref1], waarbij toepassing is gegeven
      aan [artikel 2a, tweede lid][ref2], kan de verplichting worden opgelegd het betrokken brengen van stoffen in het
      oppervlaktewater of het brengen van verandering daarin te melden. Bij die maatregel kan worden bepaald dat de
      verplichting slechts geldt in daarbij aangegeven categorieën van gevallen.

      2 In gevallen als bedoeld in het eerste lid wordt bij de maatregel aangegeven:

      a. het bestuursorgaan waaraan de melding wordt gericht;

      b. het tijdstip, voorafgaand aan het betrokken brengen van stoffen in het oppervlaktewater of het brengen van
      verandering daarin, waarop de melding uiterlijk moet zijn gedaan;

      c. de gegevens die bij de melding moeten worden verstrekt.

      3 Onze Minister van Verkeer en Waterstaat kan nadere regels stellen met betrekking tot de in het tweede lid, onder
      *c*, bedoelde gegevens en de wijze waarop zij moeten worden verstrekt.

      4 Bij de maatregel kan worden bepaald dat van de melding openbaar wordt kennisgegeven op de daarbij aangegeven
      wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel2b
