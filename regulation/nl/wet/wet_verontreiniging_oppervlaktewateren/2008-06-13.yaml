  - number: '15'
    text: |-
      Wij stellen bij algemene maatregel van bestuur regelen omtrent het verrichten van metingen van de waterkwaliteit
      in oppervlaktewateren.
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel15
  - number: 15a
    text: |-
      1 Zuivering van stedelijk afvalwater geschiedt in een inrichting voor de zuivering van rioolwater in beheer bij een
      waterschap dan wel in exploitatie bij een rechtspersoon die door het bestuur van het waterschap met die zuivering
      is belast.

      2 Voor het in dit artikel bepaalde wordt onder stedelijk afvalwater verstaan huishoudelijk afvalwater,
      bedrijfsafvalwater en afvloeiend hemelwater, gebracht in een voorziening voor inzameling en transport van
      afvalwater, als bedoeld in [artikel 10.15, eerste lid, van de Wet milieubeheer][ref1], in beheer van een gemeente.

      3 In afwijking van het eerste lid kunnen het bestuur van het betrokken waterschap en het bestuur van een betrokken
      gemeente op voorstel van één van beide besturen besluiten, dat de zuivering van daarbij aangewezen stedelijk
      afvalwater in die gemeente, vanaf een daarbij te bepalen tijdstip, geschiedt in een inrichting voor de zuivering
      van rioolwater in beheer bij die gemeente. Een besluit als bedoeld in de vorige volzin kan slechts worden genomen
      op grond dat zulks aantoonbaar doelmatiger is voor de zuivering van stedelijk afvalwater.

      4 Het bestuur van het waterschap en het bestuur van de betrokken gemeente beslissen op een voorstel als bedoeld
      in het derde lid, binnen één jaar na de dag waarop het door het bestuur van de betrokken gemeente dan wel door het
      bestuur van het waterschap is ontvangen. Bij gebreke van overeenstemming binnen die termijn beslissen, de beide
      besturen gehoord, gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.15
