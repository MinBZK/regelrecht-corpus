      1 Nadere regels met betrekking tot de verontreinigingsheffing rijkswateren worden gesteld bij algemene maatregel
      van bestuur.

      2 Nadere regels met betrekking tot de heffing worden gesteld bij belastingverordening van de kwaliteitsbeheerder.
