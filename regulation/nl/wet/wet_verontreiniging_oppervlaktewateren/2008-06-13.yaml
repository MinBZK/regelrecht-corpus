        artikel: 122d
  - number: '25'
    text: |-
      1 De verontreinigingsheffing rijkswateren wordt door Onze Minister van Verkeer en Waterstaat geheven.

      2 De verontreinigingsheffing rijkswateren wordt geheven over het kalenderjaar.

      3 Onverminderd het overigens in dit hoofdstuk bepaalde, wordt de verontreinigingsheffing rijkswateren geheven
      met overeenkomstige toepassing van de [Algemene wet][ref1], met dien verstande dat van [die wet][ref2] buiten
      toepassing blijven de [artikelen 2, vierde lid][ref3], [37 tot en met 39][ref4], [47a][ref5], [48][ref6],
      [52][ref7], [53][ref8], [54][ref9], [76][ref10], [80, tweede, derde en vierde lid][ref11], [82][ref12],
      [84][ref13], [86][ref14] en [87][ref15].

      4 Voor de toepassing van de [Algemene wet][ref16] en artikel 19, eerste lid en 25a, eerste lid, van de Wet
      administratieve rechtspraak belastingzaken treedt Onze Minister van Verkeer en Waterstaat in de plaats van Onze
      Minister van Financiën.

      5 Voor de toepassing van de [Algemene wet][ref17] treden in de plaats:

      a. voor het bestuur van 's Rijksbelastingen en de inspecteur: het hoofd;

      b. voor de ambtenaren van de rijksbelastingdienst: de ambtenaren van het Bureau verontreinigingsheffing
      rijkswateren, de ambtenaren van het Rijksinstituut voor Integraal Zoetwaterbeheer en Afvalwaterbehandeling en de
      door Onze Minister van Verkeer en Waterstaat aangewezen ambtenaren van de regionale en specialistische directies
      van de Rijkswaterstaat.

      Een aanwijzing als vorenbedoeld wordt bekend gemaakt in de Nederlandse Staatscourant.

      6 Een ambtenaar als bedoeld in het vijfde lid, onderdeel b, is voor zover dit voor de heffing van de
      verontreinigingsheffing rijkswateren redelijkerwijs nodig is, bevoegd:

      a. elke plaats met medeneming van de benodigde apparatuur, zo nodig met behulp van de sterke arm, met uitzondering
      van een woonruimte zonder toestemming van de gebruiker of de gebruikers, te betreden;

      b. monsters te nemen ter zake van lozingen op rijkswater.

      7 De verontreinigingsheffing rijkswateren wordt geheven bij wege van aanslag.

      8 Indien een bedrijfs- of woonruimte of een zuiveringtechnisch werk bij meer dan één persoon in gebruik
      onderscheidenlijk in beheer is, kan het hoofd een belastingaanslag inzake de verontreinigingsheffing rijkswateren
      ter zake van die ruimte of van dat zuiveringtechnisch werk ten name van één van die personen stellen.

      9 Het hoofd is bevoegd voor eenzelfde in [artikel 23, vierde lid][ref18], bedoelde heffingplichtige, bestemde
      belastingaanslagen van dezelfde soort op één aanslagbiljet te verenigen.

      10 [Artikel 55 van de Algemene wet][ref19] is met betrekking tot de omvang van de geleverde hoeveelheid drinkwater
      van overeenkomstige toepassing op waterleidingbedrijven.

      11 Het hoofd neemt ten aanzien van de verontreinigingsheffing rijkswateren het besluit, bedoeld in
      [artikel 20, vierde lid][ref20].


