  - number: '34'
    text: |-
      De bevoegdheid tot het maken van verordeningen door gemeenten en waterschappen, veenschappen en veenpolders blijft
      ten aanzien van het onderwerp waarin deze wet voorziet gehandhaafd voor zover deze verordeningen niet met deze wet
      in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel34
  - number: '35'
    text: |-
      Geen vergunning als bedoeld in deze wet is vereist voor het brengen in oppervlaktewateren en voor het brengen
      vanuit of over het grondgebied van Nederland in het water van de volle zee van splijtstoffen, ertsen of
      radioactieve andere stoffen, voorzover het brengen van die stoffen in oppervlaktewateren en in het water van de
      volle zee aan een vergunning krachtens [artikel 15][ref1] of [artikel 29 van de Kernenergiewet][ref2], dan wel aan
      krachtens artikel 21 of artikel 32 van die wet gestelde regelen gebonden is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
