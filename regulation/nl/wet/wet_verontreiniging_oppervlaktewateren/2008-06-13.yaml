  - number: 7b
    text: |-
      1 De aanvrage om verlening of wijziging van een vergunning krachtens [artikel 1, eerste, derde of vierde lid][ref1],
      wordt in een geval als bedoeld in [artikel 8.28 van de Wet milieubeheer][ref2] dan wel in de [Kernenergiewet][ref3]
      juncto dat artikel, ingediend tegelijk met de aanvraag om een vergunning krachtens de betrokken wet.

      2 In een geval als bedoeld in het eerste lid wordt de aanvrage overeenkomstig
      [hoofdstuk 14 van de Wet milieubeheer][ref4] gecoördineerd voorbereid en behandeld met de betrokken aanvraag
      om een vergunning krachtens die wet of de [Kernenergiewet][ref5]. Daarbij worden in ieder geval de in
      [artikel 14.3, tweede lid, van de Wet milieubeheer][ref6] genoemde handelingen gelijktijdig verricht.

      3 In een geval als bedoeld in het eerste lid wordt de aanvraag in ieder geval buiten behandeling gelaten, indien:

      a. de aanvraag om verlening of wijziging van een vergunning krachtens de [Wet milieubeheer][ref7] of de
      [Kernenergiewet][ref8] niet is ingediend binnen zes weken na het tijdstip waarop de aanvrage om verlening of
      wijziging van de vergunning krachtens deze wet is ingediend;

      b. de aanvraag om verlening of wijziging van de vergunning krachtens de [Wet milieubeheer][ref9] of de
      [Kernenergiewet][ref10] buiten behandeling wordt gelaten.

      4 In een geval als bedoeld in het eerste lid brengt het orgaan dat krachtens de betrokken wet bevoegd is op de
      aanvraag om vergunning te beslissen, binnen acht weken na ontvangst van de aanvrage krachtens deze wet advies uit
      met het oog op de samenhang tussen de beschikkingen op de onderscheidene aanvragen om een vergunning. Dat orgaan
      wordt voorts in de gelegenheid gesteld advies uit te brengen over het ontwerp van de beschikking op de aanvrage.
      In een geval als bedoeld in [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref11] kan het orgaan,
      dat krachtens deze wet bevoegd is de beschikking op de aanvrage te geven, besluiten de in de eerste volzin bedoelde
      termijn met een bij zijn besluit te bepalen redelijke termijn te verlengen.

      5 Indien in een geval als bedoeld in het eerste lid in de vergunning krachtens de [Wet milieubeheer][ref12]
      overeenkomstig artikel 8.17 van die wet een bepaling is opgenomen over de termijn waarvoor zij geldt, wordt een
      gelijke bepaling opgenomen in de vergunning krachtens deze wet.


