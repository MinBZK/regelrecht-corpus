  - number: '18'
    text: |-
      1 Een kwaliteitsbeheerder niet zijnde het Rijk is bevoegd onder de naam verontreinigingsheffing een heffing in te
      stellen ter zake van lozen.

      2 Aan de heffing kunnen onderworpen worden:

      a. ter zake van het lozen van stoffen vanuit een bedrijfsruimte of woonruimte: degene die het gebruik heeft van
      die ruimte;

      b. ter zake van het lozen van stoffen met behulp van een riolering of van een zuiveringtechnisch werk: degene bij
      wie die riolering of dat zuiveringtechnisch werk in beheer is;

      c. ter zake van het lozen van stoffen anders dan bedoeld onder a of b: degene die de stoffen loost.

      3 Voor de toepassing van het tweede lid, onderdeel a, wordt:

      a. gebruik van een woonruimte door de leden van een huishouden aangemerkt als gebruik door het door de
      kwaliteitsbeheerder aangewezen lid van dat huishouden;

      b. gebruik door degene aan wie een deel van een bedrijfsruimte in gebruik is gegeven, aangemerkt als gebruik door
      degene die dat deel in gebruik heeft gegeven; degene die het deel in gebruik heeft gegeven is bevoegd de heffing
      als zodanig te verhalen op degene aan wie dat deel in gebruik is gegeven;

      c. het ter beschikking stellen van een woonruimte of bedrijfsruimte voor volgtijdig gebruik aangemerkt als gebruik
      door degene die die ruimte ter beschikking heeft gesteld; degene die de ruimte ter beschikking heeft gesteld is
      bevoegd de heffing als zodanig te verhalen op degene aan wie de ruimte ter beschikking is gesteld.

      4 De opbrengst van de verontreinigingsheffing komt ten goede aan de bekostiging van het beheer van het watersysteem
      van de beheerder.

      5 Van de heffing is vrijgesteld een lozing van een kwaliteitsbeheerder met behulp van een werk voor het zuiveren
      van afvalwater op oppervlaktewater dat bij die kwaliteitsbeheerder in beheer is.
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel18
  - number: '19'
    text: |-
      1 Voor de heffing geldt als grondslag de hoeveelheid en de hoedanigheid van de stoffen die in een kalenderjaar
      worden geloosd.

      2 Voor de heffing geldt als heffingsmaatstaf de vervuilingswaarde van de stoffen die in een kalenderjaar worden
      afgevoerd.

      3 De vervuilingswaarde wordt uitgedrukt in vervuilingseenheden.

      4 Eén vervuilingseenheid vertegenwoordigt met betrekking tot:

      a. het zuurstofverbruik het jaarlijks verbruik van 54,8 kilogram zuurstof;

      b. de gewichtshoeveelheden van de groep van stoffen chroom, koper, lood, nikkel, zilver en zink 1,00 kilogram;

      c. de gewichtshoeveelheden van de groep van stoffen arseen, kwik en cadmium 0,100 kilogram;

      d. de gewichtshoeveelheden van de stof chloride 650 kilogram;

      e. de gewichtshoeveelheden van de stof sulfaat 650 kilogram;

      f. de gewichtshoeveelheden van de stof fosfor 20,0 kilogram.

      5 Een kwaliteitsbeheerder kan bepalen dat:

      a. de gewichtshoeveelheden met betrekking tot één of meer van de in het vierde lid, onderdelen b tot en met f
      bedoelde stoffen niet worden onderworpen aan de heffing;

      b. het aantal vervuilingseenheden met betrekking tot de gewichtshoeveelheden van één of meer van de in het vierde
      lid, onderdelen b tot en met f bedoelde stoffen tot minimaal nihil wordt verminderd op een door hem vast te stellen
      wijze;

      c. het aantal vervuilingseenheden met betrekking tot de gewichtshoeveelheden van één of meer van de in het
      vierde lid, onderdelen b tot en met f bedoelde stoffen op nihil wordt gesteld indien dit aantal, na toepassing
      van het bepaalde krachtens de onderdelen a en b, niet uitgaat boven een door hem vast te stellen aantal
      vervuilingseenheden.
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel19
  - number: '20'
    text: |-
      1 Het aantal vervuilingseenheden wordt berekend met behulp van door meting, bemonstering en analyse verkregen
      gegevens.

      2 Meting, bemonstering en analyse geschieden door de heffingplichtige gedurende elk etmaal van het kalenderjaar
      overeenkomstig het door de kwaliteitsbeheerder krachtens het derde lid bepaalde.

      3 Nadere regels omtrent meting, bemonstering, analyse en berekening worden gegeven bij belastingverordening van
      de kwaliteitsbeheerder.

      4 Op aanvraag van de gebruiker staat de kwaliteitsbeheerder onder nader te stellen voorwaarden toe dat voor het
      aantal etmalen dat meting, bemonstering en analyse geschieden, wordt afgeweken van het tweede lid indien door
      de gebruiker aannemelijk wordt gemaakt dat voor de berekening van de vervuilingswaarde met gegevens over meting,
      bemonstering en analyse van een beperkt aantal etmalen kan worden volstaan.

      5 Het in het vierde lid bedoelde besluit wordt genomen bij voor bezwaar vatbare beschikking.

      6 De bepaling van het zuurstofverbruik van de stoffen welke in een kalenderjaar worden afgevoerd, geschiedt op
      basis van de som van het chemisch zuurstofverbruik en het zuurstofverbruik door omzetting van stikstofverbindingen.

      7 Indien de uitkomst van de methode tot bepaling van het chemisch zuurstofverbruik in belangrijke mate is beïnvloed
      door biologisch niet of nagenoeg niet afbreekbare stoffen, wordt op die uitkomst een correctie toegepast. De
      kwaliteitsbeheerder geeft omtrent die correctie nadere regels bij belastingverordening.

      8 De kwaliteitsbeheerder kan het aantal vervuilingseenheden in een kalenderjaar geheel of gedeeltelijk door middel
      van schatting vaststellen indien door de heffingplichtige:

      a. zonder de in het vierde lid bedoelde toestemming niet is voldaan aan de in het tweede lid genoemde verplichting;

      b. niet is voldaan aan de in het eerste lid bedoelde verplichting en de bepaling op basis van artikel 21, eerste,
      derde of zesde lid of van artikel 22, eerste of vierde lid, van de vervuilingswaarde niet mogelijk is dan wel
      bepaling van de vervuilingswaarde op basis van artikel 22, vierde lid, van de vervuilingswaarde wel mogelijk is
      en door de heffingplichtige gedurende het heffingsjaar geen verzoek als bedoeld in [artikel 22, vierde lid][ref1],
      is gedaan;

      c. niet of niet geheel is voldaan aan de voorwaarden, verbonden aan de in het vierde lid bedoelde toestemming;

      d. meting, bemonstering en analyse niet of niet geheel zijn geschied in overeenstemming met het daaromtrent door de
      kwaliteitsbeheerder krachtens het derde lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel22
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '22'
        hoofdstuk: IV
  - number: '21'
    text: |-
      1 In afwijking van [artikel 20, eerste lid][ref1], wordt de vervuilingswaarde van de stoffen die vanuit een
      woonruimte worden geloosd gesteld op drie vervuilingseenheden. De vervuilingswaarde van de stoffen die vanuit een
      door één persoon gebruikte woonruimte worden afgevoerd bedraagt één vervuilingseenheid.

      2 Het eerste lid is niet van toepassing op de voor recreatiedoeleinden bestemde woonruimten die zich bevinden op
      een voor verblijfsrecreatie bestemd terrein dat als zodanig wordt geëxploiteerd. De in de vorige volzin bedoelde
      woonruimten worden tezamen aangemerkt als één bedrijfsruimte dan wel als onderdeel van een bedrijfsruimte.

      3 In afwijking van [artikel 20, eerste lid][ref2], wordt de vervuilingswaarde van de stoffen, die vanuit een
      bedrijfsruimte of vanuit een zuiveringtechnisch werk voor het zuiveren van afvalwater worden geloosd, gesteld op
      drie vervuilingseenheden indien door de heffingplichtige aannemelijk is gemaakt dat die vervuilingswaarde minder
      dan vijf vervuilingseenheden bedraagt en op één vervuilingseenheid indien door de heffingplichtige aannemelijk is
      gemaakt dat die één vervuilingseenheid of minder bedraagt.

      4 Indien in de loop van een kalenderjaar het gebruik van een woonruimte door een gebruiker aanvangt of eindigt
      wordt deze voor een evenredig gedeelte van het op basis van het eerste lid bepaalde aantal vervuilingseenheden aan
      een heffing onderworpen.

      5 In afwijking van [artikel 20, eerste lid][ref3], wordt de vervuilingswaarde van de stoffen die vanuit een
      bedrijfsruimte of een onderdeel van een bedrijfsruimte bestemd om in het kader van de uitoefening van een beroep
      of een bedrijf onder een permanente opstand van glas of kunststof gewassen te telen, bepaald op basis van het zesde
      lid.

      6 De vervuilingswaarde bedraagt drie vervuilingseenheden per hectare vloeroppervlak waarop onder glas of kunststof
      wordt geteeld en per deel van een hectare vloeroppervlak een evenredig deel van drie vervuilingseenheden.

      7 Indien in de loop van het kalenderjaar het gebruik van een in het vijfde lid bedoelde bedrijfsruimte of onderdeel
      van een bedrijfsruimte dan wel van een deel daarvan door de gebruiker aanvangt of eindigt wordt hij in dat
      kalenderjaar voor die bedrijfsruimte, voor dat onderdeel of voor dat deel voor een evenredig gedeelte van het op
      basis van het zesde lid bepaald aantal vervuilingseenheden aan een heffing onderworpen.

      8 Een vervuilingswaarde voor de bedrijfsruimte of het onderdeel van een bedrijfsruimte, berekend op basis van
      het zesde of zevende lid van minder dan vijf vervuilingseenheden wordt op drie vervuilingseenheden, en van één of
      minder dan één vervuilingseenheid op één vervuilingseenheid gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel20
