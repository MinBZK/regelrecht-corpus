      1 Beroep op de administratieve rechter staat open overeenkomstig [hoofdstuk 20 van de Wet milieubeheer][ref1].

      2 Indien in een geval als bedoeld in [artikel 8.28 van de Wet milieubeheer][ref2], dan wel in de
      [Kernenergiewet][ref3] juncto dat artikel, beroep is ingesteld tegen een beschikking inzake een vergunning
      krachtens een van die wetten, en krachtens artikel 7 of 7*a* van deze wet een daarmee samenhangende beschikking is
      gegeven, kan de uitspraak in beroep ook op de laatstbedoelde beschikking betrekking hebben.


