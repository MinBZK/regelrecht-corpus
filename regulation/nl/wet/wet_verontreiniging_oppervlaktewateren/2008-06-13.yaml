  - number: '17'
    text: |-
      Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:

      a. de Algemene wet: [de Algemene wet inzake rijksbelastingen][ref1];

      b. het hoofd: het hoofd van het Bureau verontreinigingsheffing rijkswateren;

      c. woonruimte: een ruimte die blijkens zijn inrichting bestemd is om als een afzonderlijk geheel te voorzien in
      woongelegenheid en waarvan de delen blijkens de inrichting van die ruimte niet bestemd zijn om afzonderlijk in
      gebruik te worden gegeven;

      d. bedrijfsruimte: een naar zijn aard en inrichting als afzonderlijk geheel te beschouwen ruimte of terrein, niet
      zijnde een woonruimte, een zuiveringtechnisch werk of een riolering;

      e. riolering: een voorziening voor de inzameling en het transport van afvalwater die bij een gemeente in beheer is;

      f. zuiveringtechnisch werk: een werk voor het zuiveren van afvalwater of het transport van afvalwater, niet zijnde
      een riolering;

      g. kwaliteitsbeheerder: het openbaar lichaam waarvan een orgaan bevoegd is tot vergunningverlening ingevolge deze
      wet;

      h. rijkswater: oppervlaktewater ten aanzien waarvan het Rijk kwaliteitsbeheerder is;

      i. lozen: het brengen van stoffen in een oppervlaktewater in beheer bij een beheerder zoals bedoeld onder g;

      j. ingenomen water: geleverd drink- en industriewater, onttrokken grond- en oppervlaktewater en opgevangen
      hemelwater;

      k. stoffen: afvalstoffen, verontreinigende of schadelijke stoffen in welke vorm dan ook als bedoeld in
      [artikel 1, eerste lid][ref2];

      l. drinkwater: water als bedoeld in [artikel 1, eerste lid, onderdeel b, van de Waterleidingwet][ref3];

      m. waterleidingbedrijf: een bedrijf als bedoeld in
      [artikel 1, eerste lid, onderdeel c, van de Waterleidingwet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002246#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002246#Artikel1
