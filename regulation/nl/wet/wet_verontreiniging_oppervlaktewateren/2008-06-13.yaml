  - number: 7d
    text: |-
      1 In een geval als bedoeld in [artikel 7b, eerste lid][ref1], waarin gedeputeerde staten of een van Onze
      Ministers bevoegd zijn de krachtens de betrokken wet vereiste vergunning te verlenen, kunnen gedeputeerde staten,
      onderscheidenlijk Onze betrokken Minister, indien dat met het oog op de samenhang tussen de beschikkingen op de
      onderscheidene aanvragen in het belang van de bescherming van het milieu geboden is, en zo nodig in afwijking
      van regels, gesteld krachtens [artikel 2e, eerste lid][ref2], aan het orgaan dat krachtens deze wet bevoegd is de
      beschikking op de aanvrage te geven, een bindende aanwijzing geven ter zake van de inhoud van die beschikking.

      2 Een aanwijzing wordt gegeven binnen acht weken na de dag waarop het ontwerp van de beschikking op de aanvrage
      overeenkomstig [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref3] ter inzage is gelegd. Zij wordt
      niet gegeven dan na overleg met het bevoegd gezag.

      3 In een geval als bedoeld in [artikel 7c, eerste lid][ref4], zijn het eerste en het tweede lid van overeenkomstige
      toepassing.

      4 De aanwijzing wordt vermeld in de beschikking van het bevoegd gezag, ter zake waarvan zij is gegeven. Een
      exemplaar ervan wordt gevoegd bij ieder exemplaar van die beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7b
