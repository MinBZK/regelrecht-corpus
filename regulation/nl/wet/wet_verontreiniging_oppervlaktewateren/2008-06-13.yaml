      1 Niet vatbaar voor afzonderlijk beroep is een beschikking houdende een aanwijzing als bedoeld in
      [artikel 7][ref1].

      2 In afwijking van het eerste lid kan tegen een beschikking als daar bedoeld beroep worden ingesteld door het
      ten aanzien van de beschikking waarop de aanwijzing betrekking heeft, bevoegde gezag. Het beroep kan eerst worden
      ingesteld nadat de beschikking waarop de aanwijzing betrekking heeft, is gegeven.


