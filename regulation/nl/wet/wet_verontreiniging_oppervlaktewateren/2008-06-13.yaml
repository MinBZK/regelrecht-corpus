  - number: '29'
    text: |-
      Het bestuursorgaan dat bevoegd is of zou zijn een vergunning krachtens [artikel 1][ref1] te verlenen, heeft tot
      taak:

      a. zorg te dragen voor de bestuursrechtelijke handhaving van het bij of krachtens deze wet, van het bij of
      krachtens de [titels 12.1][ref2] en [12.3 van de Wet milieubeheer][ref3] en van het bij of krachtens verordening
      (EG) nr. 166/2006 van het Europees Parlement en de Raad van de Europese Unie van 18 januari 2006 betreffende
      de instelling van een Europees register inzake de uitstoot en overbrenging van verontreinigende stoffen en tot
      wijziging van de Richtlijnen 91/689/EEG en 96/61/EG van de Raad (PbEU L 33) bepaalde met betrekking tot het
      betrokken brengen van stoffen in oppervlaktewater;

      b. andere gegevens, dan die bedoeld in de [artikelen 8.12, vierde lid][ref4], [8.12a, tweede lid][ref5],
      [8.13, eerste lid, onder c][ref6], en [8.14, eerste lid, onder a, van de Wet milieubeheer][ref7], die eveneens van
      belang zijn met het oog op de onder a bedoelde taak, te verzamelen en te registreren;

      c. klachten, die betrekking hebben op de naleving van het bij of krachtens deze wet bepaalde, te behandelen.


