  - number: '26'
    text: |-
      1 De verontreinigingsheffing rijkswateren wordt ingevorderd met toepassing van de [Invorderingswet 1990][ref1]
      en de [Kostenwet invordering rijksbelastingen][ref2] als was deze heffing een rijksbelasting in de zin van
      [artikel 2, eerste lid, onderdeel a, van de Invorderingswet 1990][ref3] en geschiedt door de zorg van de ontvanger,
      bedoeld in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref4], alsmede door de overige in die
      wet genoemde functionarissen.

      2 Een voorlopige aanslag in de verontreinigingsheffing rijkswateren waarvan het aanslagbiljet een dagtekening heeft
      die ligt in het jaar waarover deze is vastgesteld, is invorderbaar in zoveel gelijke termijnen als er na de maand,
      die in de dagtekening van het aanslagbiljet is vermeld, nog maanden van het jaar overblijven. De eerste termijn
      vervalt één maand na de dagtekening van het aanslagbiljet en elk van de volgende termijnen telkens een maand later.
      Indien de toepassing van de eerste volzin niet leidt tot meer dan twee maandelijkse termijnen, is de in de eerste
      volzin bedoelde belastingaanslag twee maanden na de dagtekening van het aanslagbiljet invorderbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
