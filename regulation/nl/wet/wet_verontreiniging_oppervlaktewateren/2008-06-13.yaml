  - number: 1d
    text: |-
      Het is verboden afvalstoffen waarop de verordening (EG) nr. 1013/2006 van het Europees Parlement en de Raad van
      de Europese Unie van 14 juni 2006 betreffende de overbrenging van afvalstoffen (PbEU L 190) van toepassing is,
      binnen Nederlands grondgebied te brengen, indien dat naar het oordeel van Onze Minister, in overeenstemming met
      Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, in strijd zou zijn met het belang van de
      bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel1d
  - number: 2a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen met betrekking tot het brengen in oppervlaktewater
      van daarbij aangewezen afvalstoffen, verontreinigende of schadelijke stoffen met behulp van een werk of op een
      andere daarbij aangegeven wijze, regels worden gesteld, die nodig zijn ter bescherming van het oppervlaktewater
      tegen verontreiniging, dan wel met het oog op een doelmatige werking van de betrokken zuiveringstechnische
      werken. Bij of krachtens de maatregel kan worden bepaald dat daarbij gestelde regels slechts gelden in
      daarbij aangegeven categorieën van gevallen. [Artikel 8.40, tweede lid, van de Wet milieubeheer][ref1]
      is van overeenkomstige toepassing. Ten aanzien van bij de regels te stellen voorschriften zijn
      de [artikelen 8.11, derde lid][ref2], [8.12][ref3], [8.13][ref4], [8.15][ref5], [8.16][ref6] en
      [8.22, eerste en tweede lid, van de Wet milieubeheer][ref7] van overeenkomstige toepassing.

      2 Bij een algemene maatregel van bestuur krachtens het eerste lid kan worden bepaald dat de bij of krachtens
      [artikel 1][ref8] gestelde verboden niet gelden met betrekking tot het brengen van stoffen als bedoeld in
      [artikel 1, eerste lid][ref9], in het oppervlaktewater in gevallen, behorende tot een bij die maatregel aangewezen
      categorie, behoudens voor zover het betreft lozingen vanuit inrichtingen die behoren tot een categorie als bedoeld
      in bijlage I van de [richtlijn (EG) nr. 96/61](31996L0061) van de Raad van de Europese Unie van 24 september 1996
      inzake geïntegreerde preventie en bestrijding van verontreiniging (PbEG L 257).

      3 In afwijking van het eerste lid stellen Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer tezamen, regels als bedoeld in het eerste lid vast bij ministeriële
      regeling indien zij uitsluitend strekken ter uitvoering van een voor Nederland verbindend besluit van een
      volkenrechtelijke organisatie, tenzij voor een juiste uitvoering wijziging van een algemene maatregel van bestuur
      of de wet noodzakelijk is. Indien wijziging van een algemene maatregel van bestuur noodzakelijk is, wordt daarvan,
      gelijktijdig met de voordracht aan Ons, gemotiveerd kennis gegeven aan de Staten-Generaal, onder vermelding van de
      korte inhoud van de voorgenomen algemene maatregel van bestuur.


