  - number: '23'
    text: |-
      1 Onder de naam verontreinigingsheffing rijkswateren vindt een heffing plaats ter zake van lozen op rijkswater.

      2 De [artikelen 17][ref1], [19][ref2], [20][ref3], [21 derde, vijfde, zesde, zevende en achtste lid][ref4] en
      [22][ref5] zijn van overeenkomstige toepassing op de verontreinigingsheffing rijkswateren.

      3 Aan de verontreinigingsheffing rijkswateren zijn onderworpen:

      a. ter zake van lozen in rijkswater vanuit een bedrijfs-, of woonruimte: degene die het gebruik heeft van die
      ruimte;

      b. ter zake van lozen in rijkswater met behulp van een riolering of van een zuiveringtechnisch werk: degene bij wie
      die riolering onderscheidenlijk dat zuiveringtechnisch werk in beheer is.

      c. ter zake van lozen in rijkswater anders dan bedoeld onder a of b: degene die de stoffen in rijkswater heeft
      gebracht.

      4 Voor de toepassing van het derde lid, onderdeel a, wordt:

      a. gebruik van een woonruimte door de leden van een huishouden aangemerkt als gebruik door het door het hoofd
      aangewezen lid van dat huishouden;

      b. gebruik door degene aan wie een deel van een bedrijfsruimte in gebruik is gegeven, aangemerkt als gebruik
      door degene die dat deel in gebruik heeft gegeven; degene die het deel in gebruik heeft gegeven is bevoegd de
      verontreinigingsheffing rijkswateren als zodanig te verhalen op degene aan wie dat deel in gebruik is gegeven;

      c. het ter beschikking stellen van een woonruimte of bedrijfsruimte voor volgtijdig gebruik aangemerkt als gebruik
      door degene die die ruimte ter beschikking heeft gesteld; degene die de ruimte ter beschikking heeft gesteld is
      bevoegd de verontreinigingsheffing rijkswateren als zodanig te verhalen op degene aan wie de ruimte ter beschikking
      is gesteld.

      5 De verontreinigingsheffing rijkswateren wordt niet geheven ter zake van de gewichtshoeveelheden van de in
      [artikel 19, vierde lid, onderdelen d, e en f][ref6], bedoelde stoffen en van de stof zilver.

      6 Het aantal vervuilingseenheden, met betrekking tot de gewichtshoeveelheden van de onderstaande groepen van
      stoffen, die in een kalenderjaar in rijkswater worden gebracht, wordt per bedrijfsruimte, riolering en per
      zuiveringtechnisch werk tot minimaal nihil verminderd met het produkt van het aantal vervuilingseenheden met
      betrekking tot het zuurstofverbruik van de in dat kalenderjaar vanuit die bedrijfsruimte, riolering of dat
      zuiveringtechnisch werk in rijkswater gebrachte stoffen, en:

      a. voor de groep van stoffen chroom, koper, lood, nikkel, en zink: 0,04;

      b. voor de groep van stoffen kwik, cadmium en arseen: 0,006.

      7 Het aantal vervuilingseenheden, berekend na toepassing van het zesde lid, wordt voor elk van de in het zesde lid
      bedoelde groepen van stoffen op nihil gesteld indien dat aantal minder bedraagt dan 10.

      8 De vervuilingswaarde ten aanzien van de stoffen, die vanuit een woonruimte, op rijkswater worden geloosd
      wordt gesteld op drie vervuilingseenheden en op één vervuilingseenheid indien de woonruimte op 1 januari van het
      desbetreffende kalenderjaar wordt gebruikt door één persoon.

      9 Het achtste lid lid vindt geen toepassing met betrekking tot de voor recreatiedoeleinden bestemde woonruimten
      die zich bevinden op een voor verblijfsrecreatie bestemd terrein dat als zodanig wordt geëxploiteerd. De in de
      vorige volzin bedoelde woonruimten worden tezamen aangemerkt als één bedrijfsruimte dan wel als onderdeel van een
      bedrijfsruimte.

      10 Indien in de loop van het kalenderjaar het gebruik van een woonruimte door een gebruiker aanvangt of eindigt,
      is deze voor een evenredig gedeelte van het op basis van het elfde lid bepaald aantal vervuilingseenheden aan de
      verontreinigingsheffing rijkswateren onderworpen.

      11 Nadere regels met betrekking tot meting, bemonstering, analyse en berekening en de in
      [artikel 20, zevende lid][ref7], bedoelde correctie worden voor de verontreinigingsheffing rijkswateren gegeven bij
      algemene maatregel van bestuur.


