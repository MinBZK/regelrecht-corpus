  - number: 7e
    text: |-
      In een geval als bedoeld in [artikel 7][ref1], waarin burgemeester en wethouders bevoegd zijn de krachtens de
      betrokken wet vereiste vergunning te verlenen, is [artikel 7][ref2] van overeenkomstige toepassing, met dien
      verstande dat gedeputeerde staten op een daartoe strekkend verzoek van burgemeester en wethouders een bindende
      aanwijzing kunnen geven aan het orgaan dat krachtens deze wet bevoegd is de beschikking op de aanvrage te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel7d
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel7e
