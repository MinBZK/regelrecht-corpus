  - number: '7'
    text: |-
      1 Op de voorbereiding van een beschikking op een aanvraag om verlening van een vergunning krachtens
      [artikel 1, eerste of vierde lid][ref1], of krachtens een algemene maatregel van bestuur als bedoeld
      in [artikel 1, derde lid, eerste volzin][ref2], voorzover dit bij die maatregel is bepaald, zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] en [afdeling 13.2 van de Wet milieubeheer][ref4] van
      toepassing.

      2 In afwijking van het eerste lid zijn [afdeling 3.4 van de Algemene wet bestuursrecht][ref5] en
      [afdeling 13.2 van de Wet milieubeheer][ref6] niet van toepassing, indien de beschikking betrekking heeft op
      afvalwater van huishoudelijke aard, waarvan met betrekking tot de vervuiling met zuurstofbindende stoffen de
      vervuilingswaarde geringer is dan honderd vervuilingseenheden, tenzij dat afvalwater wordt gebracht in bij of
      krachtens algemene maatregel van bestuur aangewezen oppervlaktewateren.

      3 Een vervuilingseenheid vertegenwoordigt het verbruik van 150 gram zuurstof per etmaal.

      4 Het orgaan dat bevoegd is de beschikking op de aanvrage te geven, stelt de bij algemene maatregel van bestuur
      aangewezen bestuursorganen in de gelegenheid hem van advies te dienen omtrent het ontwerp van de beschikking.

      5 De [artikelen 8.8 tot en met 8.13][ref7], [8.15 tot en met 8.20][ref8], [8.21][ref9], voor zover het
      gevallen betreft waarop [artikel 31a ][ref10] niet van toepassing is, [8.22][ref11], [8.27][ref12] en
      [21.1 van de Wet milieubeheer][ref13] zijn van overeenkomstige toepassing met betrekking tot een vergunning als
      bedoeld in het eerste lid, met dien verstande dat voor die toepassing onder "Onze Minister" wordt verstaan: Onze
      Minister van Verkeer en Waterstaat.

      6 In gevallen waarin een vergunning krachtens deze wet wordt aangevraagd voor het brengen in het oppervlaktewater
      van stoffen als bedoeld in [artikel 1][ref14], vanuit een inrichting met betrekking waartoe een algemene maatregel
      van bestuur geldt, vastgesteld krachtens [artikel 8.40 van de Wet milieubeheer][ref15], draagt het bevoegd gezag er
      bij de beslissing op de aanvrage zorg voor dat er geen strijd ontstaat met bij die maatregel gestelde regels.


