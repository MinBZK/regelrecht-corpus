  - number: 38b
    text: |-
      1 Voor zover de bevoegdheid van een bestuur van een waterschap tot verlening, weigering, wijziging of
      intrekking van een vergunning als bedoeld in [artikel 1, eerste en derde lid][ref1], met betrekking tot een
      oppervlaktewater in beheer bij het Rijk van rechtswege is vervallen als gevolg van inwerkingtreding van de
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _______________ (Stb. 2002, 202), wordt die bevoegdheid hersteld tot het tijdstip waarop met betrekking tot dat
      oppervlaktewater een algemene maatregel van bestuur als bedoeld in [artikel 3, tweede lid][ref3], van kracht wordt.

      2 In afwijking van het eerste lid wordt de bevoegdheid ten aanzien van de navolgende oppervlaktewateren in beheer
      bij het Rijk, voor zover gelegen binnen het gebied van de provincie Limburg, hersteld tot en met 31 maart 2003:

      a. het Peelkanaal;

      b. het Afleidingskanaal gelegen tussen het Peelkanaal en de rivier de Maas;

      c. het winterbed van de rivier de Maas, met uitzondering van de met de rivier de Maas in open verbinding staande
      handel- en industriehavens te Wessem, Roermond, Venlo, Meerlo-Wanssum, Gennep en de Plemhavens te Maasbracht en
      Buggenum;

      d. de met de rivier de Maas in open verbinding staande jachthavens voor zover gelegen buiten het winterbed;

      e. de Oude Maas te Maasbracht en Horn en

      f. de afgesneden Maasarmen te Asselt en Beesel.


