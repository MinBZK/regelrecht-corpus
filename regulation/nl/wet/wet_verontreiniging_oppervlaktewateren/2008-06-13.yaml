  - number: 7c
    text: |-
      1 Ten aanzien van een wijziging van een vergunning overeenkomstig [artikel 7a, eerste lid][ref1], is
      [artikel 7b, tweede lid, vierde lid, eerste en tweede volzin, en vijfde lid][ref2], van overeenkomstige toepassing.

      2 In een geval als bedoeld in het eerste lid zijn de [artikelen 14.3][ref3], eerste lid, en
      [14.4 van de Wet milieubeheer][ref4] van overeenkomstige toepassing.

      3 In een geval als bedoeld in het eerste lid, dragen gedeputeerde staten er ten minste zorg voor dat de betrokken
      beschikkingen gezamenlijk worden bekendgemaakt en daarvan gezamenlijk mededeling wordt gedaan.

      4 Indien in een geval als bedoeld in [artikel 7][ref5], de betrokken andere vergunning wordt ingetrokken, kan de
      vergunning krachtens deze wet eveneens worden ingetrokken. Met betrekking tot de totstandkoming van de beschikking
      is [artikel 8.25, achtste lid, van de Wet milieubeheer][ref6] van overeenkomstige toepassing.


