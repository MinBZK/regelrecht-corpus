  - number: 31b
    text: |-
      Een voor het tijdstip van inwerkingtreding van artikel V van de wet tot invoering van de Wet
      algemene bepalingen milieuhygiëne ingevolge [artikel 7][ref1] van deze wet, zoals dit luidde tot dat
      tijdstip, gegeven beschikking, wordt na die inwerkingtreding beschouwd als een vergunning krachtens
      [artikel 1, eerste, derde of vierde lid][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
