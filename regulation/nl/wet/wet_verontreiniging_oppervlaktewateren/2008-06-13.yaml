  - number: 2c
    text: |-
      1 Bij een algemene maatregel van bestuur krachtens [artikel 2a][ref1] kan - behoudens in gevallen waarin toepassing
      is gegeven aan [artikel 2a, tweede lid][ref2] - worden bepaald dat het orgaan dat bevoegd is een vergunning
      krachtens [artikel 1][ref3] te verlenen, bij het verlenen of wijzigen van de vergunning met betrekking tot daarbij
      aangegeven onderwerpen in de beperkingen waaronder de vergunning wordt verleend, of in de daaraan verbonden
      voorschriften van bij de maatregel gestelde regels kan afwijken. In dat geval wordt aangegeven in hoeverre het
      bevoegd gezag van de regels kan afwijken. Bij de maatregel kan tevens worden bepaald dat de bevoegdheid tot
      afwijken slechts geldt in daarbij aangegeven categorieën van gevallen.

      2 Bij een algemene maatregel van bestuur krachtens [artikel 2a][ref4] kan de verplichting worden opgelegd te
      voldoen aan nadere eisen met betrekking tot daarbij aangegeven onderwerpen. Daarbij kan worden bepaald dat de
      bevoegdheid tot het stellen van nadere eisen slechts geldt in daarbij aangegeven categorieën van gevallen. Bij de
      maatregel wordt het bestuursorgaan aangegeven, dat die eisen kan stellen. Een nadere eis kan worden gesteld als
      beperking waaronder de vergunning wordt verleend, of als voorschrift dat daaraan wordt verbonden. Bij de maatregel
      worden de categorieën van gevallen aangegeven, waarin - voor zover dat niet gebeurt - van de beschikking waarbij de
      nadere eis wordt gesteld, mededeling wordt gedaan in één of meer dag-, nieuws- of huis-aan-huisbladen.

      3 Op een algemene maatregel van bestuur krachtens [artikel 2a][ref5] met betrekking tot het in oppervlaktewater
      brengen van grond en baggerspecie is [artikel 12a, tweede tot en met vijfde lid, van de Wet bodembescherming][ref6]
      van overeenkomstige toepassing.

      4 Op een algemene maatregel van bestuur krachtens [artikel 2a][ref7] is
      [artikel 8.42 van de Wet milieubeheer][ref8] van overeenkomstige toepassing.

      5 Bij een algemene maatregel van bestuur krachtens [artikel 2a][ref9] worden regels gesteld met betrekking tot
      hetgeen in verband met het gaan gelden van de maatregel regeling behoeft.


