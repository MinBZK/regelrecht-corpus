        artikel: '1'
        hoofdstuk: I
  - number: 31a
    text: |-
      1 Voor lozingen, waarop de in [artikel 1, tweede lid][ref1], bedoelde algemene maatregel van bestuur betrekking
      heeft en die op het tijdstip van het in werking treden van die algemene maatregel van bestuur plaatsvinden, dient
      binnen één jaar na dat tijdstip een vergunning te worden aangevraagd.

      Deze lozingen kunnen voor de duur van de hiervoor bedoelde termijn op dezelfde wijze en in dezelfde mate worden
      voortgezet, en, indien binnen die termijn een aanvraag voor een vergunning is ingediend, gedurende een jaar nadat
      de op die aanvraag genomen beschikking onherroepelijk is geworden. Artikel 9, is van overeenkomstige toepassing in
      geval van gehele of gedeeltelijke weigering van de vergunning.

      2 In afwijking van het eerste lid wordt een op grond van een gemeentelijke lozingsverordening verleende vergunning
      voor de toepassing van deze wet aangemerkt als een vergunning als bedoeld in [artikel 1, eerste lid][ref2], mits
      die gemeentelijke vergunning daartoe aan het bevoegde gezag is overgelegd binnen één jaar na de inwerkingtreding
      van de algemene maatregel van bestuur, bedoeld in [artikel 1, tweede lid][ref3], waarbij de desbetreffende stof of
      soort van inrichting voor de eerste maal is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel31a
