        artikel: 7d
        hoofdstuk: II
  - number: '8'
    text: |-
      1 Indien een vergunning wordt gevraagd of indien wordt overwogen een verleende vergunning te wijzigen of in
      te trekken en het orgaan dat bevoegd is terzake te beslissen, het wenselijk acht, dat de handeling waartoe de
      vergunning is vereist of is verleend, verricht wordt in een oppervlaktewater ten aanzien waarvan een orgaan van
      een ander openbaar lichaam bevoegd is, wordt zij verleend, geweigerd, gewijzigd of ingetrokken na overleg tussen
      beide organen.

      2 Indien het in het eerste lid bedoelde overleg niet tot overeenstemming leidt, wordt de aanvrage om vergunning
      geacht mede te zijn ingediend bij het andere daarbij betrokken openbaar lichaam. Het orgaan van dat andere openbaar
      lichaam beslist eveneens op de aanvrage.
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel8
  - number: '9'
    text: |-
      Indien en voorzover blijkt dat een houder van een vergunning door wijziging of intrekking van zijn vergunning
      schade lijdt, die redelijkerwijs niet of niet geheel te zijnen laste behoort te komen, zal hem een naar billijkheid
      te bepalen schadevergoeding worden toegekend ten laste van het openbaar lichaam, dat die beschikking in eerste
      aanleg heeft gegeven. Het besluit inzake de toekenning van schadevergoeding wordt genomen bij afzonderlijke
      beschikking.
    url: https://wetten.overheid.nl/BWBR0002682/2008-06-13#Artikel9
  - number: 9a
    text: |-
      1 De houder van een vergunning als bedoeld in [artikel 1, eerste lid][ref1], aan wie gevaarlijke afvalstoffen in
      de zin van de [Wet milieubeheer][ref2] worden afgegeven, meldt met betrekking tot elke aan hem verrichte afgifte de
      in [artikel 10.40, eerste lid, van de Wet milieubeheer][ref3] bedoelde gegevens aan de krachtens dat lid aangewezen
      instantie.

      2 Het is een persoon als bedoeld in het eerste lid, verboden gevaarlijke afvalstoffen in
      ontvangst te nemen zonder dat hem daarbij een omschrijving en een begeleidingsbrief als bedoeld in
      [artikel 10.39 van de Wet milieubeheer][ref4] worden verstrekt.

      3 De houder van een vergunning als bedoeld in [artikel 1, eerste lid][ref5], aan wie bedrijfsafvalstoffen in de
      zin van de [Wet milieubeheer][ref6] worden afgegeven, meldt met betrekking tot elke aan hem verrichte afgifte de in
      [artikel 10.40 van de Wet milieubeheer][ref7] bedoelde gegevens aan de krachtens dat lid aangewezen instantie.

      4 De verplichtingen bedoeld in het eerste en het vierde lid, zijn niet van toepassing op gevaarlijke afvalstoffen,
      onderscheidenlijk bedrijfsafvalstoffen als bedoeld in de [Wet milieubeheer][ref8], die worden afgegeven
      aan een beheerder van een voorziening voor de inzameling en het transport van afvalwater als bedoeld in
      [artikel 10.30, eerste lid, van de Wet milieubeheer][ref9], of vanuit een zodanige voorziening worden afgegeven
      aan een beheerder van een zuiveringstechnisch werk. Het verbod bedoeld in het derde lid, is niet van toepassing op
      gevaarlijke afvalstoffen die in ontvangst worden genomen door een beheerder van een voorziening voor de inzameling
      en het transport van afvalwater, of vanuit een zodanige voorziening door een beheerder van een zuiveringstechnisch
      werk.


