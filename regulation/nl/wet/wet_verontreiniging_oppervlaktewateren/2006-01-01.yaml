  - number: '22.4'
    text: |-
      Indien het aantal vervuilingseenheden met betrekking tot het zuurstofverbruik in een kalenderjaar voor de
      bedrijfsruimte of onderdeel van een bedrijfsruimte meer dan 1000 bedraagt en door de heffingplichtige aannemelijk
      is gemaakt dat de berekening van dit aantal overeenkomstig het eerste lid niet resulteert in een lager aantal
      vervuilingseenheden dan de berekening van dit aantal overeenkomstig [artikel 20, eerste lid][ref1], is het eerste
      lid op verzoek van de heffingplichtige van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel20
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '20'
        hoofdstuk: IV
  - number: '23.1'
    text: |-
      Onder de naam verontreinigingsheffing rijkswateren vindt een heffing plaats ter bestrijding van de kosten van het
      Rijk van maatregelen tot het tegengaan en voorkomen van verontreiniging van rijkswater.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: '23.2'
    text: |-
      De [artikelen 17][ref1], [19][ref2], [20][ref3], [21 derde, vijfde, zesde, zevende en achtste lid][ref4] en
      [22][ref5] zijn van overeenkomstige toepassing op de verontreinigingsheffing rijkswateren.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel20
      [ref4]: https://wetten.overheid.nl/BWBR0002682#Artikel21
      [ref5]: https://wetten.overheid.nl/BWBR0002682#Artikel22
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '17'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '19'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002682
        artikel: '20'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0002682
        artikel: '21'
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0002682
        artikel: '22'
        hoofdstuk: IV
  - number: '23.3'
    text: |-
      De verontreinigingsheffing rijkswateren wordt geheven ter zake van het direct of indirect brengen van stoffen in
      rijkswater.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: '23.4'
    text: 'Aan de verontreinigingsheffing rijkswateren zijn onderworpen:'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: 23.4.a
    text: |-
      ter zake van het direct of indirect brengen van stoffen in rijkswater vanuit een bedrijfs-, of woonruimte: degene
      die het gebruik heeft van die ruimte;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: 23.4.b
    text: |-
      ter zake van het direct of indirect brengen van stoffen in rijkswater met behulp van een riolering of van een
      zuiveringtechnisch werk: degene bij wie die riolering onderscheidenlijk dat zuiveringtechnisch werk in beheer is.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: 23.4.c
    text: |-
      ter zake van het direct of indirect brengen van stoffen in rijkswater anders dan bedoeld onder a of b: degene die
      de stoffen in rijkswater heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: '23.5'
    text: 'Voor de toepassing van het vierde lid, onderdeel a, wordt:'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: 23.5.a
    text: |-
      gebruik van een woonruimte door de leden van een huishouden aangemerkt als gebruik door het door het hoofd
      aangewezen lid van dat huishouden;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: 23.5.b
    text: |-
      gebruik door degene aan wie een deel van een bedrijfsruimte in gebruik is gegeven, aangemerkt als gebruik
      door degene die dat deel in gebruik heeft gegeven; degene die het deel in gebruik heeft gegeven is bevoegd de
      verontreinigingsheffing rijkswateren als zodanig te verhalen op degene aan wie dat deel in gebruik is gegeven;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: 23.5.c
    text: |-
      het ter beschikking stellen van een woonruimte of bedrijfsruimte voor volgtijdig gebruik aangemerkt als gebruik
      door degene die die ruimte ter beschikking heeft gesteld; degene die de ruimte ter beschikking heeft gesteld is
      bevoegd de verontreinigingsheffing rijkswateren als zodanig te verhalen op degene aan wie de ruimte ter beschikking
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: '23.6'
    text: |-
      Degene bij wie een zuiveringtechnisch werk waarop geen voorafgaande zuivering plaatsvindt in beheer is is
      slechts voor de met behulp daarvan in rijkswater gebrachte stoffen aan de verontreinigingsheffing rijkswateren
      onderworpen voorzover hij die zelf op dat zuiveringtechnisch werk heeft gebracht. Indien stoffen met behulp van een
      zuiveringtechnisch werk waar voorafgaande zuivering plaatsvindt in rijkswater worden gebracht is degene bij wie dat
      zuiveringtechnisch werk in beheer is voor al die stoffen aan de verontreinigingsheffing rijkswateren onderworpen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: '23.7'
    text: |-
      Indien stoffen met behulp van een riolering of van een zuiveringtechnisch werk, dat bij een openbaar lichaam
      in beheer is, in rijkswater worden gebracht is, in afwijking van het zesde lid, degene bij wie die riolering
      onderscheidenlijk dat zuiveringtechnisch werk in beheer is, voor die stoffen aan de verontreinigingsheffing
      rijkswateren onderworpen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: '23.8'
    text: |-
      De verontreinigingsheffing rijkswateren wordt niet geheven ter zake van de gewichtshoeveelheden van de in
      [artikel 19, vierde lid, onderdelen d, e en f][ref1], bedoelde stoffen en van de stof zilver.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel19
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '19'
        hoofdstuk: IV
  - number: '23.9'
    text: |-
      Het aantal vervuilingseenheden, met betrekking tot de gewichtshoeveelheden van de onderstaande groepen van
      stoffen, die in een kalenderjaar in rijkswater worden gebracht, wordt per bedrijfsruimte, riolering en per
      zuiveringtechnisch werk tot minimaal nihil verminderd met het produkt van het aantal vervuilingseenheden met
      betrekking tot het zuurstofverbruik van de in dat kalenderjaar vanuit die bedrijfsruimte, riolering of dat
      zuiveringtechnisch werk in rijkswater gebrachte stoffen, en:
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: 23.9.a
    text: 'voor de groep van stoffen chroom, koper, lood, nikkel, en zink: 0,04;'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: 23.9.b
    text: 'voor de groep van stoffen kwik, cadmium en arseen: 0,006.'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: '23.10'
    text: |-
      Het aantal vervuilingseenheden, berekend na toepassing van het negende lid, wordt voor elk van de in het negende
      lid bedoelde groepen van stoffen op nihil gesteld indien dat aantal minder bedraagt dan 10.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: '23.11'
    text: |-
      De vervuilingswaarde ten aanzien van de stoffen, die vanuit een woonruimte, op rijkswater worden gebracht wordt
      gesteld op drie vervuilingseenheden en op één vervuilingseenheid indien de woonruimte op 1 januari van het
      desbetreffende kalenderjaar wordt gebruikt door één persoon.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: '23.12'
    text: |-
      Het elfde lid vindt geen toepassing met betrekking tot de voor recreatiedoeleinden bestemde woonruimten die zich
      bevinden op een voor verblijfsrecreatie bestemd terrein dat als zodanig wordt geëxploiteerd. De in de vorige volzin
      bedoelde woonruimten worden tezamen aangemerkt als één bedrijfsruimte dan wel als onderdeel van een bedrijfsruimte.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: '23.13'
    text: |-
      Indien in de loop van het kalenderjaar het gebruik van een woonruimte door een gebruiker aanvangt of eindigt,
      is deze voor een evenredig gedeelte van het op basis van het elfde lid bepaald aantal vervuilingseenheden aan de
      verontreinigingsheffing rijkswateren onderworpen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
  - number: '23.14'
    text: |-
      Nadere regels met betrekking tot meting, bemonstering, analyse en berekening en de in
      [artikel 20, zevende lid][ref1], bedoelde correctie worden voor de verontreinigingsheffing rijkswateren gegeven bij
      algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel20
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '20'
        hoofdstuk: IV
  - number: '24.1'
    text: Het tarief voor de verontreinigingsheffing rijkswateren bedraagt € 31,76 per vervuilingseenheid.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel24
  - number: '24.2'
    text: |-
      Het tarief per vervuilingseenheid voor de verontreinigingsheffing rijkswateren ter zake van de stoffen, die vanuit
      een zuiveringtechnisch werk, voor het biologisch zuiveren van huishoudelijk afvalwater, dat bij een provincie, een
      gemeente, een waterschap of bij een ander openbaar lichaam in beheer is, in rijkswater worden gebracht, bedraagt
      50% van het in het eerste lid genoemde bedrag.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel24
  - number: '25.1'
    text: De verontreinigingsheffing rijkswateren wordt door Onze Minister van Verkeer en Waterstaat geheven.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
  - number: '25.2'
    text: De verontreinigingsheffing rijkswateren wordt geheven over het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
  - number: '25.3'
    text: |-
      Onverminderd het overigens in dit hoofdstuk bepaalde, wordt de verontreinigingsheffing rijkswateren geheven met
      overeenkomstige toepassing van [de Algemene wet][ref1], met dien verstande dat van die wet buiten toepassing
      blijven [de artikelen 2, vierde lid][ref2], [37][ref3] tot en met [39][ref4], 47a, 48, 52, 53, 54, 76, 80, tweede,
      derde en vierde lid, 82, 84, 86 en 87.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0002682#Artikel39
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '2'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002682
        artikel: '37'
        hoofdstuk: VII
      - id: ref4
        bwb_id: BWBR0002682
        artikel: '39'
        hoofdstuk: VII
  - number: '25.4'
    text: |-
      Voor de toepassing van [de Algemene wet][ref1] en artikel 19, eerste lid en 25a, eerste lid, van de Wet
      administratieve rechtspraak belastingzaken treedt Onze Minister van Verkeer en Waterstaat in de plaats van Onze
      Minister van Financiën.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: '25.5'
    text: |-
      Voor de toepassing van [de Algemene wet][ref1] treden in de plaats:


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 25.5.a
    text: 'voor het bestuur van ''s Rijksbelastingen en de inspecteur: het hoofd;'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
  - number: 25.5.b
    text: |-
      voor de ambtenaren van de rijksbelastingdienst: de ambtenaren van het Bureau verontreinigingsheffing rijkswateren,
      de ambtenaren van het Rijksinstituut voor Integraal Zoetwaterbeheer en Afvalwaterbehandeling en de door Onze
      Minister van Verkeer en Waterstaat aangewezen ambtenaren van de regionale en specialistische directies van de
      Rijkswaterstaat.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
  - number: '25.6'
    text: |-
      Een ambtenaar als bedoeld in het vijfde lid, onderdeel b, is voor zover dit voor de heffing van de
      verontreinigingsheffing rijkswateren redelijkerwijs nodig is, bevoegd:
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
  - number: 25.6.a
    text: |-
      elke plaats met medeneming van de benodigde apparatuur, zo nodig met behulp van de sterke arm, met uitzondering van
      een woonruimte zonder toestemming van de gebruiker of de gebruikers, te betreden;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
  - number: 25.6.b
    text: monsters te nemen van het afvalwater dat direct of indirect in rijkswater wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
  - number: '25.7'
    text: De verontreinigingsheffing rijkswateren wordt geheven bij wege van aanslag.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
  - number: '25.8'
    text: |-
      Indien een bedrijfs- of woonruimte of een zuiveringtechnisch werk bij meer dan één persoon in gebruik
      onderscheidenlijk in beheer is, kan het hoofd een belastingaanslag inzake de verontreinigingsheffing rijkswateren
      ter zake van die ruimte of van dat zuiveringtechnisch werk ten name van één van die personen stellen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
  - number: '25.9'
    text: |-
      Het hoofd is bevoegd voor eenzelfde in [artikel 23, vierde lid][ref1], bedoelde heffingplichtige, bestemde
      belastingaanslagen van dezelfde soort op één aanslagbiljet te verenigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel23
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '23'
        hoofdstuk: IV
  - number: '25.10'
    text: |-
      [Artikel 55 van de Algemene wet][ref1] is met betrekking tot de omvang van de geleverde hoeveelheid drinkwater van
      overeenkomstige toepassing op waterleidingbedrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel55
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '55'
  - number: '25.11'
    text: |-
      Het hoofd neemt ten aanzien van de verontreinigingsheffing rijkswateren het besluit, bedoeld in
      [artikel 20, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel20
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '20'
        hoofdstuk: IV
  - number: '26.1'
    text: |-
      De verontreinigingsheffing rijkswateren wordt ingevorderd met toepassing van de [Invorderingswet 1990][ref1]
      en de [Kostenwet invordering rijksbelastingen][ref2] als was deze heffing een rijksbelasting in de zin van
      [artikel 2, eerste lid, onderdeel a, van de Invorderingswet 1990][ref3] en geschiedt door de zorg van de ontvanger,
      bedoeld in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref4], alsmede door de overige in die
      wet genoemde functionarissen.


      [ref1]: https://wetten.overheid.nl/BWBR0004770
      [ref2]: https://wetten.overheid.nl/BWBR0002645
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel2
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004770
      - id: ref2
        bwb_id: BWBR0002645
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '2'
  - number: '26.2'
    text: |-
      Een voorlopige aanslag in de verontreinigingsheffing rijkswateren waarvan het aanslagbiljet een dagtekening heeft
      die ligt in het jaar waarover deze is vastgesteld, is invorderbaar in zoveel gelijke termijnen als er na de maand,
      die in de dagtekening van het aanslagbiljet is vermeld, nog maanden van het jaar overblijven. De eerste termijn
      vervalt één maand na de dagtekening van het aanslagbiljet en elk van de volgende termijnen telkens een maand later.
      Indien de toepassing van de eerste volzin niet leidt tot meer dan twee maandelijkse termijnen, is de in de eerste
      volzin bedoelde belastingaanslag twee maanden na de dagtekening van het aanslagbiljet invorderbaar.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel26
  - number: '27.1'
    text: 'De kwaliteitsbeheerder besteedt de opbrengsten van de heffing slechts:'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel27
  - number: 27.1.a
    text: voor de bestrijding van verontreiniging van oppervlaktewateren ten aanzien waarvan hij bevoegd is;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel27
  - number: 27.1.b
    text: |-
      ter betaling van door andere kwaliteitsbeheerders opgelegde heffingen en van de door de kwaliteitsbeheerder
      verschuldigde verontreinigingsheffing rijkswateren;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel27
  - number: 27.1.c
    text: |-
      voor het eventueel verstrekken van subsidies ter tegemoetkoming in de kosten van maatregelen tot het tegengaan en
      het voorkomen van verontreiniging van oppervlaktewateren aan diegenen die tot het treffen van die maatregelen zijn
      gehouden;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel27
  - number: 27.1.d
    text: |-
      voor het verstrekken van subsidies aan heffingplichtigen tot behoud van het gebruik van de bij de
      kwaliteitsbeheerder in beheer zijnde zuiveringtechnische werken teneinde een stijging van het tarief van de heffing
      zoveel mogelijk te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel27
  - number: '27.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de besteding door het Rijk van de opbrengsten van de
      verontreinigingsheffing rijkswateren.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel27
  - number: '28.1'
    text: |-
      Nadere regels met betrekking tot de verontreinigingsheffing rijkswateren worden gesteld bij algemene maatregel
      van bestuur.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel28
  - number: '28.2'
    text: Nadere regels met betrekking tot de heffing worden gesteld bij belastingverordening van de kwaliteitsbeheerder.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel28
  - number: '29'
    text: |-
      Het bestuursorgaan dat bevoegd is een vergunning krachtens [artikel 1][ref1] te verlenen, dan wel ingevolge
      [artikel 2b, tweede lid, onder a][ref2], het orgaan is waaraan de melding wordt gericht, heeft tot taak:


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel2b
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002682
        artikel: 2b
        hoofdstuk: I
  - number: 29.a
    text: |-
      zorg te dragen voor de bestuursrechtelijke handhaving van het bij of krachtens deze wet en van het bij of krachtens
      [titel 12.1 van de Wet milieubeheer][ref1] bepaalde met betrekking tot het betrokken brengen van stoffen in
      oppervlaktewater;


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 29.b
    text: |-
      andere gegevens, dan die bedoeld in de [artikelen 8.12, vierde lid][ref1], [8.12a, tweede lid][ref2],
      [8.13, eerste lid, onder c][ref3], en [8.14, eerste lid, onder a, van de Wet milieubeheer][ref4], die eveneens van
      belang zijn met het oog op de onder a bedoelde taak, te verzamelen en te registreren;


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 29.c
    text: klachten, die betrekking hebben op de naleving van het bij of krachtens deze wet bepaalde, te behandelen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel29
  - number: '30'
    text: |-
      Met betrekking tot de handhaving van het bij of krachtens deze wet bepaalde zijn de [artikelen 18.3][ref1] tot en
      met [18.16 van de Wet milieubeheer][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel18
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '18'
  - number: 30a
    text: Een gedraging in strijd met een aan een vergunning verbonden voorschrift, is verboden.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel30a
  - number: '31.1'
    text: |-
      Bepalingen in verordeningen van provinciën, in reglementen voor en in verordeningen van waterschappen, veenschappen
      en veenpolders en in verordeningen van gemeenten betreffende het onderwerp dezer wet, bij de inwerkingtreding dezer
      wet van kracht, blijven in stand totdat deswege op de wijze in deze wet bepaald voorzieningen zullen zijn getroffen
      en zulks uiterlijk vier jaren na de dag van inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel31
  - number: '31.2'
    text: |-
      Een vergunning vóór de inwerkingtreding dezer wet verleend op grond van enige wettelijke bepaling voor lozingen met
      behulp van werken als bedoeld in [artikel 1, eerste lid][ref1], wordt voor de toepassing van deze wet beschouwd als
      een vergunning als bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: '31.3'
    text: |-
      Voor lozingen welke vóór het tijdstip van inwerkingtreding dezer wet onafgebroken rechtmatig hebben plaats
      gevonden, wordt voor de toepassing van deze wet een vergunning als bedoeld in [artikel 1, eerste lid][ref1],
      geacht te zijn verleend, voorzover die lozingen althans naar hun aard niet aanmerkelijk verschillen van of niet van
      aanmerkelijk grotere omvang zijn dan lozingen die plaats vonden vóór het tijdstip van inwerkingtreding dezer wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: '31.4'
    text: |-
      Door Ons worden bij algemene maatregel van bestuur stoffen of soorten van inrichtingen aangewezen voor de lozing
      waarvan onderscheidenlijk voor de lozingen vanwaaruit het derde lid niet meer geldt na het verstrijken van één jaar
      na afloop van de maand waarin die algemene maatregel van bestuur in het *Staatsblad* is geplaatst, tenzij binnen
      die termijn een vergunning, als bedoeld in [artikel 1, eerste lid][ref1], is aangevraagd, in welk geval het derde
      lid nog geldt gedurende één jaar nadat de op die aanvraag genomen beschikking onherroepelijk is geworden. Artikel
      9, is van overeenkomstige toepassing in geval van gehele of gedeeltelijke weigering van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: 31a.1
    text: |-
      Voor lozingen, waarop de in [artikel 1, tweede lid][ref1], bedoelde algemene maatregel van bestuur betrekking
      heeft en die op het tijdstip van het in werking treden van die algemene maatregel van bestuur plaatsvinden, dient
      binnen één jaar na dat tijdstip een vergunning te worden aangevraagd. Deze lozingen kunnen voor de duur van de
      hiervoor bedoelde termijn op dezelfde wijze en in dezelfde mate worden voortgezet, en, indien binnen die termijn
      een aanvraag voor een vergunning is ingediend, gedurende een jaar nadat de op die aanvraag genomen beschikking
      onherroepelijk is geworden. Artikel 9, is van overeenkomstige toepassing in geval van gehele of gedeeltelijke
      weigering van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: 31a.2
    text: |-
      In afwijking van het eerste lid wordt een op grond van een gemeentelijke lozingsverordening verleende vergunning
      voor de toepassing van deze wet aangemerkt als een vergunning als bedoeld in [artikel 1, eerste lid][ref1], mits
      die gemeentelijke vergunning daartoe aan het bevoegde gezag is overgelegd binnen één jaar na de inwerkingtreding
      van de algemene maatregel van bestuur, bedoeld in [artikel 1, tweede lid][ref2], waarbij de desbetreffende stof of
      soort van inrichting voor de eerste maal is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: 31b
    text: |-
      Een voor het tijdstip van inwerkingtreding van artikel V van de wet tot invoering van de Wet
      algemene bepalingen milieuhygiëne ingevolge [artikel 7][ref1] van deze wet, zoals dit luidde tot dat
      tijdstip, gegeven beschikking, wordt na die inwerkingtreding beschouwd als een vergunning krachtens
      [artikel 1, eerste, derde of vierde lid][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: 31c
    text: |-
      Het bestuursorgaan dat bevoegd is een vergunning krachtens [artikel 1][ref1] te verlenen draagt er zorg voor
      dat vergunningen, verleend voor lozingen vanuit inrichtingen waartoe gpbv-installaties als bedoeld in de
      [Wet milieubeheer][ref2] behoren, voorzover die niet in overeenstemming zijn met de regels die voor 31 oktober
      2007 ter uitvoering van de [richtlijn (EG) nr. 96/61](31996L0061) van de Raad van de Europese Unie van 24 september
      1996 inzake geïntegreerde preventie en bestrijding van verontreiniging (PbEG L 257) bij of krachtens deze wet zijn
      gesteld, uiterlijk met ingang van die datum daarmee in overeenstemming zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel31c
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003245
  - number: '32.1'
    text: |-
      Er is het Rijksinstituut voor Integraal Zoetwaterbeheer en Afvalwaterbehandeling, belast met het wetenschappelijke
      en praktische onderzoek van de hoedanigheid van oppervlaktewateren en van de wijze waarop deze kunnen worden
      beschermd tegen verontreiniging in welke vorm ook en voorts met het geven van adviezen betreffende de met het oog
      op die bescherming te treffen voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel32
  - number: '32.2'
    text: |-
      Aan het hoofd van dit instituut staat een hoofdingenieur-directeur. De algemene leiding van het instituut berust
      bij de directeur-generaal van de Rijkswaterstaat.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel32
  - number: '32.3'
    text: |-
      Onze Minister van Verkeer en Waterstaat geeft regelen omtrent de inrichting en werkwijze van het instituut en
      omtrent de aan dit instituut te betalen vergoedingen voor bewezen diensten.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel32
  - number: '33'
    text: |-
      Het ontwerp van een ministeriële regeling, vast te stellen krachtens of met overeenkomstige toepassing van
      [artikel 2][ref1], wordt ten minste een maand voor de regeling wordt vastgesteld, toegezonden aan de Staten-
      Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 2a
        hoofdstuk: I
  - number: 33a.1
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens [artikel 1, tweede of derde lid][ref1], 1*a*, 2*a*,
      2*d*, 4, 14, 15, 19, zesde, zevende of achtste lid, of 31, vierde lid, wordt Ons gedaan door Onze Ministers van
      Verkeer en Waterstaat en van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: 33a.2
    text: |-
      Het ontwerp van een algemene maatregel van bestuur krachtens [artikel 1, tweede of derde lid][ref1], 1*a*, 2*a*,
      2*d* of 4 wordt overgelegd aan de beide kamers der Staten-Generaal en in de *Staatscourant* bekendgemaakt. Aan een
      ieder wordt de gelegenheid geboden binnen een bij die bekendmaking te stellen termijn van ten minste vier weken
      opmerkingen over het ontwerp schriftelijk ter kennis van Onze genoemde Ministers te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: 33a.3
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het tweede lid wordt, nadat hij is vastgesteld, toegezonden aan
      beide Kamers der Staten-Generaal. Hij treedt niet eerder in werking dan vier weken na de datum van uitgifte van het
      *Staatsblad* waarin hij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel33a
  - number: '34'
    text: |-
      De bevoegdheid tot het maken van verordeningen door gemeenten en waterschappen, veenschappen en veenpolders blijft
      ten aanzien van het onderwerp waarin deze wet voorziet gehandhaafd voor zover deze verordeningen niet met deze wet
      in strijd zijn.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel34
  - number: '35'
    text: |-
      Geen vergunning als bedoeld in deze wet is vereist voor het brengen in oppervlaktewateren en voor het brengen
      vanuit of over het grondgebied van Nederland in het water van de volle zee van splijtstoffen, ertsen of
      radioactieve andere stoffen, voorzover het brengen van die stoffen in oppervlaktewateren en in het water van de
      volle zee aan een vergunning krachtens [artikel 15][ref1] of [artikel 29 van de Kernenergiewet][ref2], dan wel aan
      krachtens artikel 21 of artikel 32 van die wet gestelde regelen gebonden is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel29
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '29'
  - number: 38a
    text: |-
      De vaststelling van regelen bij algemene maatregel van bestuur, bedoeld in de
      [artikelen 1, tweede en derde lid][ref1], [1][ref2], [2][ref3], [2][ref4], [13][ref5], [14][ref6], [15][ref7]
      en [31, vierde lid][ref8], geschiedt mede ter uitvoering van door de Raad van Ministers der Europese Gemeenschappen
      vastgestelde richtlijnen en de ter uitvoering daarvan door die Raad genomen besluiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
      [ref4]: https://wetten.overheid.nl/BWBR0002682#Artikel2d
      [ref5]: https://wetten.overheid.nl/BWBR0002682#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0002682#Artikel14
      [ref7]: https://wetten.overheid.nl/BWBR0002682#Artikel15
      [ref8]: https://wetten.overheid.nl/BWBR0002682#Artikel31
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002682
        artikel: 1a
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002682
        artikel: 2a
        hoofdstuk: I
      - id: ref4
        bwb_id: BWBR0002682
        artikel: 2d
        hoofdstuk: I
      - id: ref5
        bwb_id: BWBR0002682
        artikel: '13'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0002682
        artikel: '14'
        hoofdstuk: IIb
      - id: ref7
        bwb_id: BWBR0002682
        artikel: '15'
        hoofdstuk: IIb
      - id: ref8
        bwb_id: BWBR0002682
        artikel: '31'
        hoofdstuk: VI
  - number: 38b.1
    text: |-
      Voor zover de bevoegdheid van een bestuur van een waterschap tot verlening, weigering, wijziging of
      intrekking van een vergunning als bedoeld in [artikel 1, eerste en derde lid][ref1], met betrekking tot een
      oppervlaktewater in beheer bij het Rijk van rechtswege is vervallen als gevolg van inwerkingtreding van de
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _______________ (Stb. 2002, 202), wordt die bevoegdheid hersteld tot het tijdstip waarop met betrekking tot dat
      oppervlaktewater een algemene maatregel van bestuur als bedoeld in [artikel 3, tweede lid][ref3], van kracht wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013385
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel3
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0013385
      - id: ref3
        bwb_id: BWBR0002682
        artikel: '3'
        hoofdstuk: II
  - number: 38b.2
    text: |-
      In afwijking van het eerste lid wordt de bevoegdheid ten aanzien van de navolgende oppervlaktewateren in beheer bij
      het Rijk, voor zover gelegen binnen het gebied van de provincie Limburg, hersteld tot en met 31 maart 2003:
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel38b
  - number: 38b.2.a
    text: het Peelkanaal;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel38b
  - number: 38b.2.b
    text: het Afleidingskanaal gelegen tussen het Peelkanaal en de rivier de Maas;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel38b
  - number: 38b.2.c
    text: |-
      het winterbed van de rivier de Maas, met uitzondering van de met de rivier de Maas in open verbinding staande
      handel- en industriehavens te Wessem, Roermond, Venlo, Meerlo-Wanssum, Gennep en de Plemhavens te Maasbracht en
      Buggenum;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel38b
  - number: 38b.2.d
    text: de met de rivier de Maas in open verbinding staande jachthavens voor zover gelegen buiten het winterbed;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel38b
  - number: 38b.2.e
    text: de Oude Maas te Maasbracht en Horn en
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel38b
  - number: 38b.2.f
    text: de afgesneden Maasarmen te Asselt en Beesel.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel38b
  - number: '39'
    text: Deze wet kan worden aangehaald als Wet verontreiniging oppervlaktewateren.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel39
  - number: '40'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel40
