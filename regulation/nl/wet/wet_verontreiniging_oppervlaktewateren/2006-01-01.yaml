preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat regelen dienen te worden gesteld tot het tegengaan en tot het voorkomen
    van verontreiniging van oppervlaktewateren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het is verboden zonder vergunning met behulp van een werk afvalstoffen, verontreinigende of schadelijke stoffen, in
      welke vorm ook, te brengen in oppervlaktewateren.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1
  - number: '1.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt niet voor een lozing met behulp van een werk dat op een ander
      werk is aangesloten. Deze uitzondering geldt niet voor lozingen waarbij door Ons bij algemene maatregel
      van bestuur aan te wijzen stoffen in oppervlaktewateren worden gebracht en voor lozingen vanuit door Ons
      bij algemene maatregel van bestuur aan te wijzen soorten van inrichtingen, voor lozingen van ten minste
      een door Ons bij algemene maatregel van bestuur vast te stellen hoeveelheid verontreinigende stoffen of
      afvalwater, alsmede voor lozingen met behulp van een werk, niet zijnde een voorziening als bedoeld in
      [artikel 10.30, eerste lid, van de Wet milieubeheer][ref1], dat is aangesloten op een inrichting voor het zuiveren
      van afvalwater, in beheer bij een waterschap of gemeente of in exploitatie bij een rechtspersoon die door het
      bestuur van een waterschap is belast met de zuivering van stedelijk afvalwater als bedoeld in [artikel 15a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel15a
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002682
        artikel: 15a
        hoofdstuk: IIc
  - number: '1.3'
    text: |-
      Wij kunnen bij algemene maatregel van bestuur bepalen dat het zonder vergunning verboden is de in het eerste
      lid bedoelde stoffen op andere wijze dan met behulp van een werk in oppervlaktewateren te brengen. Bij algemene
      maatregel van bestuur kunnen Wij mede bepalen dat ten aanzien van alle of van bepaalde oppervlaktewateren
      het brengen op welke wijze ook van daarbij aan te geven soorten van stoffen als bedoeld in het eerste lid
      in oppervlaktewateren is verboden. Voorzover hierin door Ons niet bij algemene maatregel van bestuur is
      voorzien, kunnen provinciale staten bepalen dat het zonder vergunning verboden is de in het eerste lid
      bedoelde stoffen op andere wijze dan met behulp van een werk te brengen in oppervlaktewateren, als bedoeld in
      [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel3
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '3'
        hoofdstuk: II
  - number: '1.4'
    text: |-
      Het is verboden zonder vergunning van of vanwege Onze Minister van Verkeer en Waterstaat stoffen als bedoeld in
      het eerste lid met behulp van een werk vanaf of over het grondgebied van Nederland in het water van de volle zee
      te brengen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1
  - number: '1.5'
    text: |-
      Aan een vergunning worden voorschriften verbonden tot bescherming van de belangen, waarvoor het vereiste van
      vergunning is gesteld. De voorschriften kunnen mede strekken tot bescherming van het belang van een doelmatige
      werking van het betrokken zuiveringstechnische werk. Bij het stellen van de voorschriften worden de op grond van
      [artikel 1][ref1] van toepassing zijnde grenswaarden in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 1a
        hoofdstuk: I
  - number: '1.6'
    text: |-
      Bij het verlenen, wijzigen of intrekken van een vergunning, als bedoeld in het eerste en derde lid, wordt rekening
      gehouden met de in de [artikelen 5 en 9 van de Wet op de waterhuishouding][ref1] bedoelde beheersplannen.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel5
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '5'
  - number: 1a.1
    text: |-
      Wij kunnen bij algemene maatregel van bestuur ten aanzien van daarbij aan te wijzen stoffen grenswaarden
      vaststellen voor het brengen van die stoffen in oppervlaktewateren, alsmede regels vaststellen ten aanzien van de
      wijze van meten van die stoffen. Deze grenswaarden kunnen met name betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1a
  - number: 1a.1.a
    text: de hoogst toelaatbare concentratie van die stoffen, en
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1a
  - number: 1a.1.b
    text: |-
      de hoogst toelaatbare gewichtshoeveelheid van die stoffen per in die algemene maatregel van bestuur aan te geven
      eenheid.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Bij de in het eerste lid bedoelde algemene maatregel van bestuur wordt ten aanzien van iedere grenswaarde
      een termijn vastgesteld na het verstrijken waarvan die grenswaarde van toepassing is op het brengen in
      oppervlaktewateren van stoffen, waarvoor op het tijdstip van het in werking treden van die maatregel een vergunning
      van kracht is.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1a
  - number: 1a.3
    text: |-
      In afwijking van het eerste en het tweede lid geschiedt de vaststelling van grenswaarden, regels inzake metingen
      van stoffen en termijnen ter uitvoering van een voor Nederland verbindend verdrag of een voor Nederland verbindend
      regeling van een volkenrechtelijke organisatie door Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer bij in het *Staatsblad* bekend te maken regeling.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1a
  - number: 1a.4
    text: |-
      Op de voorbereiding van een algemene maatregel van bestuur als bedoeld in het eerste lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing. De terinzagelegging van de stukken geschiedt
      op het ministerie van elk van beide ministers. Van de kennisgeving, bedoeld in [artikel 3:12, eerste lid][ref2],
      van genoemde wet, wordt onverwijld mededeling gedaan aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 1b
    text: |-
      Het is verboden bij het in oppervlaktewateren brengen van de in [artikel 1, eerste lid][ref1], bedoelde stoffen een
      op grond van [artikel 1][ref2] van toepassing zijnde grenswaarde te overschrijden.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002682
        artikel: 1a
        hoofdstuk: I
  - number: 1c
    text: |-
      Wij kunnen bij algemene maatregel van bestuur ter bescherming van bijzondere levensgemeenschappen of soorten
      voor daarbij aan te wijzen typen watersystemen bijzondere eisen stellen ten aanzien van de kwaliteit van die
      watersystemen vanaf een daarbij te bepalen tijdstip. De artikelen 5.1, tweede tot en met vijfde lid, en 5.2 tot en
      met 5.4, alsmede [artikel 21.6, tweede en vierde tot en met zevende lid, van de Wet milieubeheer][ref1] zijn van
      overeenkomstige toepassing. Voor de toepassing van artikel 21.6, zesde lid, van die wet wordt een maatregel als
      bedoeld in de eerste volzin, gelijkgesteld met een algemene maatregel van bestuur krachtens artikel 5.1, eerste
      lid, van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '21'
  - number: 1d
    text: |-
      Het is verboden afvalstoffen waarop de EEG-verordening overbrenging van afvalstoffen van toepassing is, binnen
      Nederlands grondgebied te brengen, indien dat naar het oordeel van Onze Minister, in overeenstemming met Onze
      Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, in strijd zou zijn met het belang van de
      bescherming van het milieu.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel1d
  - number: 2a.1
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot het brengen in oppervlaktewater van daarbij aangewezen
      afvalstoffen, verontreinigende of schadelijke stoffen met behulp van een werk of op een andere daarbij aangegeven
      wijze, regels worden gesteld, die nodig zijn ter bescherming van het oppervlaktewater tegen verontreiniging,
      dan wel met het oog op een doelmatige werking van de betrokken zuiveringstechnische werken. Bij de maatregel
      kan worden bepaald dat daarbij gestelde regels slechts gelden in daarbij aangegeven categorieën van gevallen.
      [Artikel 8.40, tweede lid, van de Wet milieubeheer][ref1] is van overeenkomstige toepassing. Ten aanzien van
      bij de regels te stellen voorschriften zijn de [artikelen 8.11, derde lid][ref2], [8.12][ref3], [8.13][ref4],
      [8.15][ref5], [8.16][ref6] en [8.22, eerste en tweede lid, van de Wet milieubeheer][ref7] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref7
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 2a.2
    text: |-
      Bij een algemene maatregel van bestuur krachtens het eerste lid kan worden bepaald dat de bij of krachtens
      [artikel 1][ref1] gestelde verboden niet gelden met betrekking tot het brengen van stoffen als bedoeld in
      [artikel 1, eerste lid][ref2], in het oppervlaktewater in gevallen, behorende tot een bij die maatregel aangewezen
      categorie, behoudens voor zover het betreft lozingen vanuit inrichtingen die behoren tot een categorie als bedoeld
      in bijlage I van de [richtlijn (EG) nr. 96/61](31996L0061) van de Raad van de Europese Unie van 24 september 1996
      inzake geïntegreerde preventie en bestrijding van verontreiniging (PbEG L 257).


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: 2a.3
    text: |-
      In afwijking van het eerste lid stellen Onze Ministers van Verkeer en Waterstaat en van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer tezamen, regels als bedoeld in het eerste lid vast bij ministeriële
      regeling indien zij uitsluitend strekken ter uitvoering van een voor Nederland verbindend besluit van een
      volkenrechtelijke organisatie, tenzij voor een juiste uitvoering wijziging van een algemene maatregel van bestuur
      of de wet noodzakelijk is. Indien wijziging van een algemene maatregel van bestuur noodzakelijk is, wordt daarvan,
      gelijktijdig met de voordracht aan Ons, gemotiveerd kennis gegeven aan de Staten-Generaal, onder vermelding van de
      korte inhoud van de voorgenomen algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2a
  - number: 2b.1
    text: |-
      Bij een algemene maatregel van bestuur krachtens [artikel 2][ref1], waarbij toepassing is gegeven aan
      [artikel 2][ref2], wordt de verplichting opgelegd het betrokken brengen van stoffen in het oppervlaktewater of het
      brengen van verandering daarin te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 2a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002682
        artikel: 2a
        hoofdstuk: I
  - number: 2b.2
    text: 'In gevallen als bedoeld in het eerste lid wordt bij de maatregel aangegeven:'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2b
  - number: 2b.2.a
    text: het bestuursorgaan waaraan de melding wordt gericht;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2b
  - number: 2b.2.b
    text: |-
      het tijdstip, voorafgaand aan het betrokken brengen van stoffen in het oppervlaktewater of het brengen van
      verandering daarin, waarop de melding uiterlijk moet zijn gedaan;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2b
  - number: 2b.2.c
    text: de gegevens die bij de melding moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2b
  - number: 2b.3
    text: |-
      Onze Minister van Verkeer en Waterstaat kan nadere regels stellen met betrekking tot de in het tweede lid, onder
      *c*, bedoelde gegevens en de wijze waarop zij moeten worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2b
  - number: 2b.4
    text: |-
      De melding wordt - behoudens in gevallen als bedoeld in [artikel 7, tweede lid][ref1], waarin
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] en [afdeling 13.2 van de Wet milieubeheer][ref3] niet van
      toepassing zouden zijn - openbaar gemaakt in één of meer dag-, nieuws- of huis-aan-huisbladen. Indien op grond van
      een algemene maatregel van bestuur krachtens [artikel 2][ref4], ook anderszins gegevens moeten worden verstrekt,
      kunnen bij de maatregel regels over het bekend maken daarvan worden gesteld. Bij algemene maatregel van bestuur
      kunnen bestuursorganen worden aangewezen, waaraan een exemplaar van de melding of de anderszins verstrekte gegevens
      moet worden gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
      [ref4]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0003245
        afdeling: '13.2'
      - id: ref4
        bwb_id: BWBR0002682
        artikel: 2a
        hoofdstuk: I
  - number: 2c.1
    text: |-
      Bij een algemene maatregel van bestuur krachtens [artikel 2][ref1] kan - behoudens in gevallen waarin toepassing
      is gegeven aan [artikel 2][ref2] - worden bepaald dat het orgaan dat bevoegd is een vergunning krachtens
      [artikel 1][ref3] te verlenen, bij het verlenen of wijzigen van de vergunning met betrekking tot daarbij aangegeven
      onderwerpen in de beperkingen waaronder de vergunning wordt verleend, of in de daaraan verbonden voorschriften van
      bij de maatregel gestelde regels kan afwijken. In dat geval wordt aangegeven in hoeverre het bevoegd gezag van de
      regels kan afwijken. Bij de maatregel kan tevens worden bepaald dat de bevoegdheid tot afwijken slechts geldt in
      daarbij aangegeven categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 2a
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002682
        artikel: 2a
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: 2c.2
    text: |-
      Bij een algemene maatregel van bestuur krachtens [artikel 2][ref1] kan de verplichting worden opgelegd te voldoen
      aan nadere eisen met betrekking tot daarbij aangegeven onderwerpen. Daarbij kan worden bepaald dat de bevoegdheid
      tot het stellen van nadere eisen slechts geldt in daarbij aangegeven categorieën van gevallen. Bij de maatregel
      wordt het bestuursorgaan aangegeven, dat die eisen kan stellen. Een nadere eis kan worden gesteld als beperking
      waaronder de vergunning wordt verleend, of als voorschrift dat daaraan wordt verbonden. Bij de maatregel worden de
      categorieën van gevallen aangegeven, waarin - voor zover dat niet gebeurt - van de beschikking waarbij de nadere
      eis wordt gesteld, mededeling wordt gedaan in één of meer dag-, nieuws- of huis-aan-huisbladen.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 2a
        hoofdstuk: I
  - number: 2c.3
    text: |-
      Bij een algemene maatregel van bestuur krachtens [artikel 2][ref1] worden regels gesteld met betrekking tot hetgeen
      in verband met het gaan gelden van de maatregel regeling behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 2a
        hoofdstuk: I
  - number: 2d.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld, inhoudende de verplichting voor het orgaan
      dat bevoegd is een vergunning krachtens [artikel 1][ref1] te verlenen, beperkingen of voorschriften, die nodig
      zijn ter bescherming van het oppervlaktewater tegen verontreiniging, dan wel met het oog op een doelmatige
      werking van de betrokken zuiveringstechnische werken, en waarvan de inhoud in die maatregel is aangegeven,
      aan te brengen onderscheidenlijk te verbinden aan de vergunningen voor het brengen van bij de maatregel
      aangewezen afvalstoffen, verontreinigende of schadelijke stoffen in het oppervlaktewater. Bij de maatregel kan
      worden bepaald dat de daarbij gestelde regels slechts gelden in daarbij aangegeven categorieën van gevallen.
      [Artikel 8.40, tweede lid, van de Wet milieubeheer][ref2] is van overeenkomstige toepassing. Ten aanzien van
      bij de regels te stellen voorschriften zijn de [artikelen 8.11][ref3], derde lid, [8.12][ref4], [8.13][ref5],
      [8.15][ref6], [8.16][ref7] en [8.22, eerste en tweede lid, van de Wet milieubeheer][ref8] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
