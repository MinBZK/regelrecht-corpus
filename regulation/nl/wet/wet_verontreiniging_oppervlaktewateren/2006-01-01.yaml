  - number: 2d.2
    text: |-
      Bij een algemene maatregel van bestuur krachtens het eerste lid wordt bepaald in hoeverre het in het eerste lid
      bedoelde orgaan met betrekking tot daarbij aangegeven onderwerpen van bij de maatregel gestelde regels kan afwijken
      of nadere eisen kan stellen. Daarbij kan worden bepaald dat de bevoegdheid tot afwijken of tot het stellen van
      nadere eisen slechts geldt in bij de maatregel aangegeven categorieën van gevallen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2d
  - number: 2d.3
    text: |-
      Bij de maatregel wordt voor de daarbij opgelegde verplichtingen het tijdstip aangegeven, waarop zij met betrekking
      tot de al verleende vergunningen moeten zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2d
  - number: 2d.4
    text: |-
      [Artikel 2][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel2a
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2d
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 2a
        hoofdstuk: I
  - number: 2e.1
    text: |-
      Bij de provinciale milieuverordening, bedoeld in [artikel 1.2 van de Wet milieubeheer][ref1], kunnen regels worden
      gesteld inhoudende de verplichting voor het orgaan dat bevoegd is een vergunning krachtens [artikel 1][ref2]
      te verlenen, beperkingen of voorschriften, die nodig zijn ter bescherming van het oppervlaktewater tegen
      verontreiniging, dan wel met het oog op een doelmatige werking van de betrokken zuiveringstechnische werken,
      en waarvan de inhoud in die verordening is aangegeven, aan te brengen onderscheidenlijk te verbinden aan de
      vergunningen voor het brengen van bij de verordening aangewezen afvalstoffen, verontreinigende of schadelijke
      stoffen in het oppervlaktewater. Bij de verordening kan worden bepaald dat de daarbij gestelde regels slechts
      gelden in daarbij aangewezen categorieën van gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: 2e.2
    text: |-
      Regels als bedoeld in het eerste lid kunnen niet betrekking hebben op beslissingen inzake vergunningen ten aanzien
      waarvan Onze Minister van Verkeer en Waterstaat het bevoegd gezag is.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2e
  - number: 2e.3
    text: |-
      [Artikel 2][ref1], laatste volzin, en tweede tot en met vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel2d
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel2e
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 2d
        hoofdstuk: I
  - number: '3.1'
    text: |-
      Ten aanzien van oppervlaktewateren in beheer bij het Rijk, de territoriale wateren hieronder begrepen, wordt
      voorzover die oppervlaktewateren niet bij of krachtens een algemene maatregel van bestuur als in het tweede lid
      bedoeld zijn aangewezen, een vergunning als in [artikel 1, eerste en derde lid][ref1] bedoeld verleend, geweigerd,
      gewijzigd of ingetrokken door of vanwege Onze Minister van Verkeer en Waterstaat. Voor de toepassing van het
      bij of krachtens deze wet bepaalde worden tot de oppervlaktewateren in beheer bij het Rijk mede gerekend de
      bij of krachtens algemene maatregel van bestuur aangewezen door anderen beheerde oppervlaktewateren die met de
      oppervlaktewateren in beheer bij het Rijk in open verbinding staan. Over een voordracht voor een zodanige algemene
      maatregel van bestuur stelt Onze Minister de besturen van de waterschappen die het bevoegde gezag zijn voor de
      betrokken oppervlaktewateren in de gelegenheid hun oordeel te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: '3.2'
    text: |-
      Ten aanzien van andere dan de in het eerste lid bedoelde oppervlaktewateren, alsmede ten aanzien van de in het
      eerste lid bedoelde oppervlaktewateren welke daartoe na overleg met gedeputeerde staten bij algemene maatregel
      van bestuur zijn aangewezen, wordt een vergunning als bedoeld in [artikel 1, eerste en derde lid][ref1], verleend,
      geweigerd, gewijzigd of ingetrokken door de besturen van de waterschappen waarbij die oppervlaktewateren in beheer
      zijn onderscheidenlijk door de besturen van de waterschappen in het gebied waarvan de bij die algemene maatregel
      van bestuur aangewezen oppervlaktewateren zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: '3.3'
    text: |-
      Ten aanzien van een lozing in de zin van [artikel 1, tweede lid][ref1], waarvoor een vergunning als bedoeld in
      [artikel 1, eerste lid][ref2], is vereist, wordt die vergunning verleend, geweigerd, gewijzigd of ingetrokken: -
      indien de lozing plaats vindt na zuivering in een inrichting in beheer bij een waterschap: door het bestuur van dat
      waterschap dan wel , indien dat waterschap door een ander waterschap met die zuivering is belast, door het bestuur
      van dat andere waterschap na overleg met het bestuur van eerstbedoeld waterschap
        - indien de lozing plaats vindt na zuivering in een inrichting in exploitatie bij een rechtspersoon, die door het
      bestuur van een waterschap met die zuivering is belast: door het bestuur van dat waterschap
        - indien de lozing plaats vindt na zuivering in een inrichting buiten de hiervoor bedoelde gevallen: door Onze
      Minister van Verkeer en Waterstaat onderscheidenlijk het bestuur van het waterschap als het ingevolge het eerste
      onderscheidenlijk tweede lid voor het ontvangende oppervlaktewater bevoegde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regelen vastgesteld met betrekking tot het onderwerp dezer wet
      voor de in [artikel 3, eerste lid][ref1], bedoelde oppervlaktewateren, alsmede voor de volle zee.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel3
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '3'
        hoofdstuk: II
  - number: '5.1'
    text: |-
      Provinciale staten stellen met betrekking tot het onderwerp dezer wet verordeningen vast voor de in
      [artikel 3, tweede lid][ref1] bedoelde oppervlaktewateren. In die verordeningen geven provinciale staten onder
      meer regelen met betrekking tot de doelmatige samenwerking op chemisch en technisch gebied. Daarbij wordt
      rekening gehouden met de mogelijkheid tot inschakeling van het Rijksinstituut voor Integraal Zoetwaterbeheer en
      Afvalwaterbehandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel3
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '3'
        hoofdstuk: II
  - number: '5.2'
    text: |-
      Op de voorbereiding van een verordening als bedoeld in het eerste lid, is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '5.3'
    text: |-
      De verordeningen bedoeld in het eerste lid behoeven de goedkeuring van Onze Minister van Verkeer en Waterstaat.
      De beslissing omtrent de goedkeuring wordt genomen in overeenstemming met Onze Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel5
  - number: '7.1'
    text: |-
      Op de voorbereiding van een beschikking op een aanvraag om verlening van een vergunning krachtens
      [artikel 1, eerste of vierde lid][ref1], of krachtens een algemene maatregel van bestuur als bedoeld
      in [artikel 1, derde lid, eerste volzin][ref2], voorzover dit bij die maatregel is bepaald, zijn
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref3] en [afdeling 13.2 van de Wet milieubeheer][ref4] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref4]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref4
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid zijn [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] en
      [afdeling 13.2 van de Wet milieubeheer][ref2] niet van toepassing, indien de beschikking betrekking heeft op
      afvalwater van huishoudelijke aard, waarvan met betrekking tot de vervuiling met zuurstofbindende stoffen de
      vervuilingswaarde geringer is dan honderd inwonerequivalenten, tenzij dat afvalwater wordt gebracht in bij of
      krachtens algemene maatregel van bestuur aangewezen oppervlaktewateren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref2
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: '7.3'
    text: Een inwonerequivalent vertegenwoordigt het verbruik van 136 gram zuurstof per etmaal.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7
  - number: '7.4'
    text: |-
      Het orgaan dat bevoegd is de beschikking op de aanvrage te geven, stelt de bij algemene maatregel van bestuur
      aangewezen bestuursorganen in de gelegenheid hem van advies te dienen omtrent het ontwerp van de beschikking.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7
  - number: '7.5'
    text: |-
      De [artikelen 8.8 tot en met 8.13][ref1], [8.15 tot en met 8.20][ref2], [8.21][ref3], voor zover
      het gevallen betreft waarop [artikel 31][ref4] niet van toepassing is, [8.22][ref5], [8.27][ref6] en
      [21.1 van de Wet milieubeheer][ref7] zijn van overeenkomstige toepassing met betrekking tot een vergunning als
      bedoeld in het eerste lid, met dien verstande dat voor die toepassing onder "Onze Minister" wordt verstaan: Onze
      Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002682#Artikel31a
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002682
        artikel: 31a
        hoofdstuk: VI
      - id: ref5
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref6
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref7
        bwb_id: BWBR0003245
        artikel: '21'
  - number: '7.6'
    text: |-
      In gevallen waarin een vergunning krachtens deze wet wordt aangevraagd voor het brengen in het oppervlaktewater van
      stoffen als bedoeld in [artikel 1][ref1], vanuit een inrichting met betrekking waartoe een algemene maatregel van
      bestuur geldt, vastgesteld krachtens [artikel 8.40 van de Wet milieubeheer][ref2], draagt het bevoegd gezag er bij
      de beslissing op de aanvrage zorg voor dat er geen strijd ontstaat met bij die maatregel gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 7a.1
    text: |-
      Met betrekking tot het wijzigen en intrekken van een vergunning is [afdeling 8.1.2 van de Wet milieubeheer][ref1]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Afdeling8.1.2
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        afdeling: 8.1.2
  - number: 7a.2
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat [artikel 8.25, achtste lid, van de Wet milieubeheer][ref1]
      van toepassing is in plaats van [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] en
      [afdeling 13.2 van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Afdeling13.2
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
      - id: ref3
        bwb_id: BWBR0003245
        afdeling: '13.2'
  - number: 7a.3
    text: |-
      De krachtens [artikel 7, vierde lid][ref1], aangewezen bestuursorganen worden in de gelegenheid gesteld advies uit
      te brengen met betrekking tot het wijzigen en intrekken van een vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '7'
        hoofdstuk: II
  - number: 7a.4
    text: |-
      Met betrekking tot het wijzigen en intrekken van een vergunning is [artikel 8.27 van de Wet milieubeheer][ref1] van
      overeenkomstige toepassing, met dien verstande dat voor die toepassing onder "Onze Minister" wordt verstaan: Onze
      Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 7b.1
    text: |-
      De aanvrage om verlening of wijziging van een vergunning krachtens [artikel 1, eerste, derde of vierde lid][ref1],
      wordt in een geval als bedoeld in [artikel 8.28 van de Wet milieubeheer][ref2] dan wel in de [Kernenergiewet][ref3]
      juncto dat artikel, ingediend tegelijk met de aanvraag om een vergunning krachtens de betrokken wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002402
  - number: 7b.2
    text: |-
      In een geval als bedoeld in het eerste lid wordt de aanvrage overeenkomstig
      [hoofdstuk 14 van de Wet milieubeheer][ref1] gecoördineerd voorbereid en behandeld met de betrokken aanvraag
      om een vergunning krachtens die wet of de [Kernenergiewet][ref2]. Daarbij worden in ieder geval de in
      [artikel 14.3, tweede lid, van de Wet milieubeheer][ref3] genoemde handelingen gelijktijdig verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk14
      [ref2]: https://wetten.overheid.nl/BWBR0002402
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0002402
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '14'
  - number: 7b.3
    text: 'In een geval als bedoeld in het eerste lid wordt de aanvraag in ieder geval buiten behandeling gelaten, indien:'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7b
  - number: 7b.3.a
    text: |-
      de aanvraag om verlening of wijziging van een vergunning krachtens de [Wet milieubeheer][ref1] of de
      [Kernenergiewet][ref2] niet is ingediend binnen zes weken na het tijdstip waarop de aanvrage om verlening of
      wijziging van de vergunning krachtens deze wet is ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0002402
  - number: 7b.3.b
    text: |-
      de aanvraag om verlening of wijziging van de vergunning krachtens de [Wet milieubeheer][ref1] of de
      [Kernenergiewet][ref2] buiten behandeling wordt gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0002402
  - number: 7b.4
    text: |-
      In een geval als bedoeld in het eerste lid brengt het orgaan dat krachtens de betrokken wet bevoegd is op de
      aanvraag om vergunning te beslissen, binnen acht weken na ontvangst van de aanvrage krachtens deze wet advies uit
      met het oog op de samenhang tussen de beschikkingen op de onderscheidene aanvragen om een vergunning. Dat orgaan
      wordt voorts in de gelegenheid gesteld advies uit te brengen over het ontwerp van de beschikking op de aanvrage.
      In een geval als bedoeld in [artikel 3:18, tweede lid, van de Algemene wet bestuursrecht][ref1] kan het orgaan,
      dat krachtens deze wet bevoegd is de beschikking op de aanvrage te geven, besluiten de in de eerste volzin bedoelde
      termijn met een bij zijn besluit te bepalen redelijke termijn te verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 7b.5
    text: |-
      Indien in een geval als bedoeld in het eerste lid in de vergunning krachtens de [Wet milieubeheer][ref1]
      overeenkomstig artikel 8.17 van die wet een bepaling is opgenomen over de termijn waarvoor zij geldt, wordt een
      gelijke bepaling opgenomen in de vergunning krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0003245
  - number: 7c.1
    text: |-
      Ten aanzien van een wijziging van een vergunning overeenkomstig [artikel 7a, eerste lid][ref1], is
      [artikel 7b, tweede lid, vierde lid, eerste en tweede volzin, en vijfde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel7b
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 7a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002682
        artikel: 7b
        hoofdstuk: II
  - number: 7c.2
    text: |-
      In een geval als bedoeld in het eerste lid zijn de [artikelen 14.3][ref1], eerste lid, en
      [14.4 van de Wet milieubeheer][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel14
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '14'
  - number: 7c.3
    text: |-
      In een geval als bedoeld in het eerste lid, dragen gedeputeerde staten er ten minste zorg voor dat de betrokken
      beschikkingen gezamenlijk worden bekendgemaakt en daarvan gezamenlijk mededeling wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7c
  - number: 7c.4
    text: |-
      Indien in een geval als bedoeld in [artikel 7][ref1], de betrokken andere vergunning wordt ingetrokken, kan de
      vergunning krachtens deze wet eveneens worden ingetrokken. Met betrekking tot de totstandkoming van de beschikking
      is [artikel 8.25, achtste lid, van de Wet milieubeheer][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7c
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 7b
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
  - number: 7d.1
    text: |-
      In een geval als bedoeld in [artikel 7b, eerste lid][ref1], waarin gedeputeerde staten of een van Onze Ministers
      bevoegd zijn de krachtens de betrokken wet vereiste vergunning te verlenen, kunnen gedeputeerde staten,
      onderscheidenlijk Onze betrokken Minister, indien dat met het oog op de samenhang tussen de beschikkingen op de
      onderscheidene aanvragen in het belang van de bescherming van het milieu geboden is, en zo nodig in afwijking
      van regels, gesteld krachtens [artikel 2e, eerste lid][ref2], aan het orgaan dat krachtens deze wet bevoegd is de
      beschikking op de aanvrage te geven, een bindende aanwijzing geven ter zake van de inhoud van die beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel2e
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 7b
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002682
        artikel: 2e
        hoofdstuk: I
  - number: 7d.2
    text: |-
      Een aanwijzing wordt gegeven binnen acht weken na de dag waarop het ontwerp van de beschikking op de aanvrage
      overeenkomstig [artikel 3:11, eerste lid, van de Algemene wet bestuursrecht][ref1] ter inzage is gelegd. Zij wordt
      niet gegeven dan na overleg met het bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 7d.3
    text: |-
      In een geval als bedoeld in [artikel 7c, eerste lid][ref1], zijn het eerste en het tweede lid van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7c
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7d
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 7c
        hoofdstuk: II
  - number: 7d.4
    text: |-
      De aanwijzing wordt vermeld in de beschikking van het bevoegd gezag, ter zake waarvan zij is gegeven. Een exemplaar
      ervan wordt gevoegd bij ieder exemplaar van die beschikking.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7d
  - number: 7e
    text: |-
      In een geval als bedoeld in [artikel 7][ref1], waarin burgemeester en wethouders bevoegd zijn de krachtens de
      betrokken wet vereiste vergunning te verlenen, is [artikel 7][ref2] van overeenkomstige toepassing, met dien
      verstande dat gedeputeerde staten op een daartoe strekkend verzoek van burgemeester en wethouders een bindende
      aanwijzing kunnen geven aan het orgaan dat krachtens deze wet bevoegd is de beschikking op de aanvrage te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel7d
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel7e
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 7b
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002682
        artikel: 7d
        hoofdstuk: II
  - number: '8.1'
    text: |-
      Indien een vergunning wordt gevraagd of indien wordt overwogen een verleende vergunning te wijzigen of in te
      trekken en het orgaan dat bevoegd is terzake te beslissen, het wenselijk acht, dat de handeling waartoe de
      vergunning is vereist of is verleend, verricht wordt in een oppervlaktewater ten aanzien waarvan een orgaan van
      een ander openbaar lichaam bevoegd is, wordt zij verleend, geweigerd, gewijzigd of ingetrokken na overleg tussen
      beide organen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel8
  - number: '8.2'
    text: |-
      Indien het in het eerste lid bedoelde overleg niet tot overeenstemming leidt, wordt de aanvrage om vergunning
      geacht mede te zijn ingediend bij het andere daarbij betrokken openbaar lichaam. Het orgaan van dat andere openbaar
      lichaam beslist eveneens op de aanvrage.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel8
  - number: '9'
    text: |-
      Indien en voorzover blijkt dat een houder van een vergunning door wijziging of intrekking van zijn vergunning
      schade lijdt, die redelijkerwijs niet of niet geheel te zijnen laste behoort te komen, zal hem een naar billijkheid
      te bepalen schadevergoeding worden toegekend ten laste van het openbaar lichaam, dat die beschikking in eerste
      aanleg heeft gegeven. Het besluit inzake de toekenning van schadevergoeding wordt genomen bij afzonderlijke
      beschikking.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel9
  - number: 9a.1
    text: |-
      De houder van een vergunning als bedoeld in [artikel 1, eerste lid][ref1], aan wie gevaarlijke afvalstoffen in
      de zin van de Wet milieubeheer worden afgegeven, meldt met betrekking tot elke aan hem verrichte afgifte de in
      [artikel 10.40, eerste lid, van de Wet milieubeheer][ref2] bedoelde gegevens aan de krachtens dat lid aangewezen
      instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 9a.2
    text: |-
      Het is een persoon als bedoeld in het eerste lid, verboden gevaarlijke afvalstoffen in ontvangst
      te nemen zonder dat hem daarbij een omschrijving en een begeleidingsbrief als bedoeld in
      [artikel 10.39 van de Wet milieubeheer][ref1] worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 9a.3
    text: |-
      De houder van een vergunning als bedoeld in [artikel 1, eerste lid][ref1], aan wie bedrijfsafvalstoffen in de zin
      van de [Wet milieubeheer][ref2] worden afgegeven, meldt met betrekking tot elke aan hem verrichte afgifte de in
      [artikel 10.40 van de Wet milieubeheer][ref3] bedoelde gegevens aan de krachtens dat lid aangewezen instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003245
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003245
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 9a.4
    text: |-
      De verplichtingen bedoeld in het eerste en het vierde lid, zijn niet van toepassing op gevaarlijke afvalstoffen,
      onderscheidenlijk bedrijfsafvalstoffen als bedoeld in de [Wet milieubeheer][ref1], die worden afgegeven
      aan een beheerder van een voorziening voor de inzameling en het transport van afvalwater als bedoeld in
      [artikel 10.30, eerste lid, van de Wet milieubeheer][ref2], of vanuit een zodanige voorziening worden afgegeven
      aan een beheerder van een zuiveringstechnisch werk. Het verbod bedoeld in het derde lid, is niet van toepassing op
      gevaarlijke afvalstoffen die in ontvangst worden genomen door een beheerder van een voorziening voor de inzameling
      en het transport van afvalwater, of vanuit een zodanige voorziening door een beheerder van een zuiveringstechnisch
      werk.


      [ref1]: https://wetten.overheid.nl/BWBR0003245
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0003245
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '10'
  - number: '14.1'
    text: |-
      Voor de oppervlaktewateren met betrekking tot welke Onze Minister van Verkeer en Waterstaat ingevolge
      [artikel 3, eerste lid][ref1], het bevoegde gezag is, stelt deze een inventarisatie op van het brengen in
      oppervlaktewateren van bij algemene maatregel van bestuur aan te wijzen stoffen, een en ander volgens bij die
      maatregel te stellen regels. Deze inventarisatie wordt tenminste eens in de drie jaar herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel3
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '3'
        hoofdstuk: II
  - number: '14.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van oppervlaktewateren voor welke besturen van
      waterschappen het bevoegde gezag zijn, met dien verstande dat gedeputeerde staten de inventarisatie doen opstellen
      door die besturen en de uitkomst van die inventarisatie ter beschikking stellen van Onze Minister van Verkeer en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel14
  - number: 14a.1
    text: |-
      Onze Minister stelt iedere twee jaar een rapport op, waarin de stand van zaken wordt beschreven met betrekking tot
      lozingen als bedoeld in [artikel 1, eerste lid][ref1], vanuit een inrichting voor het zuiveren van afvalwater, in
      beheer bij een waterschap of gemeente dan wel in exploitatie bij een rechtspersoon die door het bestuur van een
      waterschap is belast met de zuivering van stedelijk afvalwater als bedoeld in [artikel 15a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002682#Artikel15a
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002682
        artikel: 15a
        hoofdstuk: IIc
  - number: 14a.2
    text: Van de vaststelling van het rapport wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel14a
  - number: 14a.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de toepassing
      van het eerste lid. Deze regels kunnen voor openbare lichamen de verplichting inhouden jaarlijks op een daarbij
      aangegeven wijze gegevens te verstrekken, die voor de opstelling van het rapport nodig zijn.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel14a
  - number: '15'
    text: |-
      Wij stellen bij algemene maatregel van bestuur regelen omtrent het verrichten van metingen van de waterkwaliteit
      in oppervlaktewateren.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel15
  - number: 15a.1
    text: |-
      Zuivering van stedelijk afvalwater geschiedt in een inrichting voor de zuivering van rioolwater in beheer bij een
      waterschap dan wel in exploitatie bij een rechtspersoon die door het bestuur van het waterschap met die zuivering
      is belast.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel15a
  - number: 15a.2
    text: |-
      Voor het in dit artikel bepaalde wordt onder stedelijk afvalwater verstaan huishoudelijk afvalwater,
      bedrijfsafvalwater en afvloeiend hemelwater, gebracht in een voorziening voor inzameling en transport van
      afvalwater, als bedoeld in [artikel 10.15, eerste lid, van de Wet milieubeheer][ref1], in beheer van een gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10'
  - number: 15a.3
    text: |-
      In afwijking van het eerste lid kunnen het bestuur van het betrokken waterschap en het bestuur van een betrokken
      gemeente op voorstel van één van beide besturen besluiten, dat de zuivering van daarbij aangewezen stedelijk
      afvalwater in die gemeente, vanaf een daarbij te bepalen tijdstip, geschiedt in een inrichting voor de zuivering
      van rioolwater in beheer bij die gemeente. Een besluit als bedoeld in de vorige volzin kan slechts worden genomen
      op grond dat zulks aantoonbaar doelmatiger is voor de zuivering van stedelijk afvalwater.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel15a
  - number: 15a.4
    text: |-
      Het bestuur van het waterschap en het bestuur van de betrokken gemeente beslissen op een voorstel als bedoeld in
      het derde lid, binnen één jaar na de dag waarop het door het bestuur van de betrokken gemeente dan wel door het
      bestuur van het waterschap is ontvangen. Bij gebreke van overeenstemming binnen die termijn beslissen, de beide
      besturen gehoord, gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel15a
  - number: '16.1'
    text: |-
      Beroep op de administratieve rechter staat open overeenkomstig [hoofdstuk 20 van de Wet milieubeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Hoofdstuk20
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        hoofdstuk: '20'
  - number: '16.2'
    text: |-
      Indien in een geval als bedoeld in [artikel 8.28 van de Wet milieubeheer][ref1], dan wel in de
      [Kernenergiewet][ref2] juncto dat artikel, beroep is ingesteld tegen een beschikking inzake een vergunning
      krachtens een van die wetten, en krachtens artikel 7 of 7*a* van deze wet een daarmee samenhangende beschikking is
      gegeven, kan de uitspraak in beroep ook op de laatstbedoelde beschikking betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002402
  - number: 16c.1
    text: |-
      Niet vatbaar voor afzonderlijk beroep is een beschikking houdende een aanwijzing als bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel7e
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: 7e
        hoofdstuk: II
  - number: 16c.2
    text: |-
      In afwijking van het eerste lid kan tegen een beschikking als daar bedoeld beroep worden ingesteld door het ten
      aanzien van de beschikking waarop de aanwijzing betrekking heeft, bevoegde gezag. Het beroep kan eerst worden
      ingesteld nadat de beschikking waarop de aanwijzing betrekking heeft, is gegeven.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel16c
  - number: '17'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
  - number: 17.a
    text: |-
      de Algemene wet: [de Algemene wet inzake rijksbelastingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002320
  - number: 17.b
    text: 'het hoofd: het hoofd van het Bureau verontreinigingsheffing rijkswateren;'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
  - number: 17.c
    text: |-
      woonruimte: een ruimte die blijkens zijn inrichting bestemd is om als een afzonderlijk geheel te voorzien in
      woongelegenheid en waarvan de delen blijkens de inrichting van die ruimte niet bestemd zijn om afzonderlijk in
      gebruik te worden gegeven;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
  - number: 17.d
    text: |-
      bedrijfsruimte: een naar zijn aard en inrichting als afzonderlijk geheel te beschouwen ruimte of terrein, niet
      zijnde een woonruimte, een zuiveringtechnisch werk of een riolering;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
  - number: 17.e
    text: 'riolering: een voorziening voor de inzameling en het transport van afvalwater die bij een gemeente in beheer is;'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
  - number: 17.f
    text: |-
      zuiveringtechnisch werk: een werk voor het zuiveren van afvalwater of het transport van afvalwater, niet zijnde
      een riolering;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
  - number: 17.g
    text: 'kwaliteitsbeheerder: het openbaar lichaam waarvan een orgaan bevoegd is tot vergunningverlening ingevolge deze wet;'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
  - number: 17.h
    text: 'rijkswater: oppervlaktewater ten aanzien waarvan het Rijk kwaliteitsbeheerder is;'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
  - number: 17.i
    text: |-
      afvoeren: direct of indirect brengen als bedoeld in [artikel 18, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel18
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '18'
        hoofdstuk: IV
  - number: 17.j
    text: 'ingenomen water: geleverd drink- en industriewater, onttrokken grond- en oppervlaktewater en opgevangen hemelwater;'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
  - number: 17.k
    text: |-
      stoffen: afvalstoffen, verontreinigende of schadelijke stoffen in welke vorm dan ook als bedoeld in
      [artikel 1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '1'
        hoofdstuk: I
  - number: 17.l
    text: |-
      drinkwater: water als bedoeld in [artikel 1, eerste lid, onderdeel b, van de Waterleidingwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002246#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002246
        artikel: '1'
  - number: 17.m
    text: |-
      waterleidingbedrijf: een bedrijf als bedoeld in [artikel 1, eerste lid, onderdeel c, van de Waterleidingwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002246#Artikel1
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002246
        artikel: '1'
  - number: '18.1'
    text: |-
      Een kwaliteitsbeheerder niet zijnde het Rijk, is bevoegd ter bestrijding van zijn kosten van maatregelen tot
      het tegengaan en voorkomen van verontreiniging van oppervlaktewateren een heffing in te stellen ter zake van het
      direct of indirect brengen van stoffen in oppervlaktewater waarvoor de kwaliteitsbeheerder bevoegd is, of op een
      zuiveringtechnisch werk dat bij die kwaliteitsbeheerder in beheer is.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: '18.2'
    text: |-
      Onder de kosten van maatregelen tot het tegengaan en voorkomen van verontreiniging van oppervlaktewateren worden
      mede geacht te zijn begrepen, de verschuldigde heffingen en de verschuldigde verontreinigingsheffing rijkswateren.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: '18.3'
    text: 'Aan een heffing kunnen onderworpen worden:'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: 18.3.a
    text: |-
      ter zake van het afvoeren van stoffen vanuit een bedrijfsruimte of woonruimte: degene die het gebruik heeft van
      die ruimte;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: 18.3.b
    text: |-
      ter zake van het afvoeren van stoffen met behulp van een riolering of van een zuiveringtechnisch werk: degene bij
      wie die riolering of dat zuiveringtechnisch werk in beheer is;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: 18.3.c
    text: 'ter zake van het afvoeren van stoffen anders dan bedoeld onder a of b: degene die de stoffen afvoert.'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: '18.4'
    text: 'Voor de toepassing van het derde lid, onderdeel a, wordt:'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: 18.4.a
    text: |-
      gebruik van een woonruimte door de leden van een huishouden aangemerkt als gebruik door het door de
      kwaliteitsbeheerder aangewezen lid van dat huishouden;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: 18.4.b
    text: |-
      gebruik door degene aan wie een deel van een bedrijfsruimte in gebruik is gegeven, aangemerkt als gebruik door
      degene die dat deel in gebruik heeft gegeven; degene die het deel in gebruik heeft gegeven is bevoegd de heffing
      als zodanig te verhalen op degene aan wie dat deel in gebruik is gegeven;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: 18.4.c
    text: |-
      het ter beschikking stellen van een woonruimte of bedrijfsruimte voor volgtijdig gebruik aangemerkt als gebruik
      door degene die die ruimte ter beschikking heeft gesteld; degene die de ruimte ter beschikking heeft gesteld is
      bevoegd de heffing als zodanig te verhalen op degene aan wie de ruimte ter beschikking is gesteld.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: '18.5'
    text: |-
      Indien stoffen door middel van een zuiveringtechnisch werk waarop geen voorafgaande zuivering plaatsvindt of door
      middel van een riolering worden afgevoerd kan de kwaliteitsbeheerder de beheerder van dat werk slechts voor de
      stoffen die de beheerder zelf op dat werk heeft gebracht aan een heffing onderwerpen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: '18.6'
    text: |-
      De kwaliteitsbeheerder kan voor de stoffen die door middel van een zuiveringtechnisch werk worden afgevoerd slechts
      de beheerder van dat werk aan een heffing onderwerpen indien:
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: 18.6.a
    text: op dat werk voorafgaande zuivering plaatsvindt; of
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: 18.6.b
    text: dat werk in beheer is bij een andere kwaliteitsbeheerder.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel18
  - number: '19.1'
    text: |-
      Voor een heffing geldt als grondslag de hoeveelheid en de hoedanigheid van de stoffen die in een kalenderjaar
      worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: '19.2'
    text: |-
      Voor een heffing geldt als heffingsmaatstaf de vervuilingswaarde van de stoffen die in een kalenderjaar worden
      afgevoerd.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: '19.3'
    text: De vervuilingswaarde wordt uitgedrukt in vervuilingseenheden.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: '19.4'
    text: 'Eén vervuilingseenheid vertegenwoordigt met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: 19.4.a
    text: het zuurstofverbruik het jaarlijks verbruik van 49,6 kilogram zuurstof;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: 19.4.b
    text: de gewichtshoeveelheden van de groep van stoffen chroom, koper, lood, nikkel, zilver en zink 1,00 kilogram;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: 19.4.c
    text: de gewichtshoeveelheden van de groep van stoffen arseen, kwik en cadmium 0,100 kilogram;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: 19.4.d
    text: de gewichtshoeveelheden van de stof chloride 650 kilogram;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: 19.4.e
    text: de gewichtshoeveelheden van de stof sulfaat 650 kilogram;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: 19.4.f
    text: de gewichtshoeveelheden van de stof fosfor 20,0 kilogram.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: '19.5'
    text: 'Een kwaliteitsbeheerder kan bepalen dat:'
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: 19.5.a
    text: |-
      de gewichtshoeveelheden met betrekking tot één of meer van de in het vierde lid, onderdelen b tot en met f bedoelde
      stoffen niet worden onderworpen aan de heffing;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: 19.5.b
    text: |-
      het aantal vervuilingseenheden met betrekking tot de gewichtshoeveelheden van één of meer van de in het vierde
      lid, onderdelen b tot en met f bedoelde stoffen tot minimaal nihil wordt verminderd op een door hem vast te stellen
      wijze;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: 19.5.c
    text: |-
      het aantal vervuilingseenheden met betrekking tot de gewichtshoeveelheden van één of meer van de in het vierde lid,
      onderdelen b tot en met f bedoelde stoffen op nihil wordt gesteld indien dit aantal, na toepassing van het bepaalde
      krachtens de onderdelen a en b, niet uitgaat boven een door hem vast te stellen aantal vervuilingseenheden.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel19
  - number: '20.1'
    text: |-
      Het aantal vervuilingseenheden wordt berekend met behulp van door meting, bemonstering en analyse verkregen
      gegevens.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
  - number: '20.2'
    text: |-
      Meting, bemonstering en analyse geschieden door de heffingplichtige gedurende elk etmaal van het kalenderjaar
      overeenkomstig het door de kwaliteitsbeheerder krachtens het derde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
  - number: '20.3'
    text: |-
      Nadere regels omtrent meting, bemonstering, analyse en berekening worden gegeven bij belastingverordening van de
      kwaliteitsbeheerder.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
  - number: '20.4'
    text: |-
      Op aanvraag van de gebruiker staat de kwaliteitsbeheerder onder nader te stellen voorwaarden toe dat voor het
      aantal etmalen dat meting, bemonstering en analyse geschieden, wordt afgeweken van het tweede lid indien door
      de gebruiker aannemelijk wordt gemaakt dat voor de berekening van de vervuilingswaarde met gegevens over meting,
      bemonstering en analyse van een beperkt aantal etmalen kan worden volstaan.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
  - number: '20.5'
    text: Het in het vierde lid bedoelde besluit wordt genomen bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
  - number: '20.6'
    text: |-
      De bepaling van het zuurstofverbruik van de stoffen welke in een kalenderjaar worden afgevoerd, geschiedt op basis
      van de som van het chemisch zuurstofverbruik en het zuurstofverbruik door omzetting van stikstofverbindingen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
  - number: '20.7'
    text: |-
      Indien de uitkomst van de methode tot bepaling van het chemisch zuurstofverbruik in belangrijke mate is beïnvloed
      door biologisch niet of nagenoeg niet afbreekbare stoffen, wordt op die uitkomst een correctie toegepast. De
      kwaliteitsbeheerder geeft omtrent die correctie nadere regels bij belastingverordening.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
  - number: '20.8'
    text: |-
      De kwaliteitsbeheerder kan het aantal vervuilingseenheden in een kalenderjaar geheel of gedeeltelijk door middel
      van schatting vaststellen indien door de heffingplichtige:
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
  - number: 20.8.a
    text: zonder de in het vierde lid bedoelde toestemming niet is voldaan aan de in het tweede lid genoemde verplichting;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
  - number: 20.8.b
    text: |-
      niet is voldaan aan de in het eerste lid bedoelde verplichting en de bepaling op basis van artikel 21, eerste,
      derde of zesde lid of van artikel 22, eerste of vierde lid, van de vervuilingswaarde niet mogelijk is dan wel
      bepaling van de vervuilingswaarde op basis van artikel 22, vierde lid, van de vervuilingswaarde wel mogelijk is
      en door de heffingplichtige gedurende het heffingsjaar geen verzoek als bedoeld in [artikel 22, vierde lid][ref1],
      is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel22
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '22'
        hoofdstuk: IV
  - number: 20.8.c
    text: niet of niet geheel is voldaan aan de voorwaarden, verbonden aan de in het vierde lid bedoelde toestemming;
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
  - number: 20.8.d
    text: |-
      meting, bemonstering en analyse niet of niet geheel zijn geschied in overeenstemming met het daaromtrent door de
      kwaliteitsbeheerder krachtens het derde lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel20
  - number: '21.1'
    text: |-
      In afwijking van [artikel 20, eerste lid][ref1], wordt de vervuilingswaarde van de stoffen die vanuit een
      woonruimte worden afgevoerd gesteld op een gelijk aantal vervuilingseenheden per woonruimte, met dien verstande dat
      dit aantal ten hoogste drie bedraagt. De vervuilingswaarde van de stoffen die vanuit een door één persoon gebruikte
      woonruimte worden afgevoerd bedraagt één vervuilingseenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel20
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '20'
        hoofdstuk: IV
  - number: '21.2'
    text: |-
      Het eerste lid is niet van toepassing op de voor recreatiedoeleinden bestemde woonruimten die zich bevinden op
      een voor verblijfsrecreatie bestemd terrein dat als zodanig wordt geëxploiteerd. De in de vorige volzin bedoelde
      woonruimten worden tezamen aangemerkt als één bedrijfsruimte dan wel als onderdeel van een bedrijfsruimte.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel21
  - number: '21.3'
    text: |-
      In afwijking van [artikel 20, eerste lid][ref1], wordt de vervuilingswaarde van de stoffen, die vanuit een
      bedrijfsruimte of vanuit een zuiveringtechnisch werk voor het zuiveren van afvalwater worden afgevoerd, gesteld op
      drie vervuilingseenheden indien door de heffingplichtige aannemelijk is gemaakt dat die vervuilingswaarde minder
      dan vijf vervuilingseenheden bedraagt en op één vervuilingseenheid indien door de heffingplichtige aannemelijk is
      gemaakt dat die één vervuilingseenheid of minder bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel20
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '20'
        hoofdstuk: IV
  - number: '21.4'
    text: |-
      Indien in de loop van een kalenderjaar het gebruik van een woonruimte door een gebruiker aanvangt of eindigt wordt
      deze voor een evenredig gedeelte van het op basis van het eerste lid bepaalde aantal vervuilingseenheden aan een
      heffing onderworpen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel21
  - number: '21.5'
    text: |-
      In afwijking van [artikel 20, eerste lid][ref1], wordt de vervuilingswaarde van de stoffen die vanuit een
      bedrijfsruimte of een onderdeel van een bedrijfsruimte bestemd om in het kader van de uitoefening van een beroep
      of een bedrijf onder een permanente opstand van glas of kunststof gewassen te telen, bepaald op basis van het zesde
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel20
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '20'
        hoofdstuk: IV
  - number: '21.6'
    text: |-
      De vervuilingswaarde bedraagt drie vervuilingseenheden per hectare vloeroppervlak waarop onder glas of kunststof
      wordt geteeld en per deel van een hectare vloeroppervlak een evenredig deel van drie vervuilingseenheden.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel21
  - number: '21.7'
    text: |-
      Indien in de loop van het kalenderjaar het gebruik van een in het vijfde lid bedoelde bedrijfsruimte of onderdeel
      van een bedrijfsruimte dan wel van een deel daarvan door de gebruiker aanvangt of eindigt wordt hij in dat
      kalenderjaar voor die bedrijfsruimte, voor dat onderdeel of voor dat deel voor een evenredig gedeelte van het op
      basis van het zesde lid bepaald aantal vervuilingseenheden aan een heffing onderworpen.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel21
  - number: '21.8'
    text: |-
      Een vervuilingswaarde voor de bedrijfsruimte of het onderdeel van een bedrijfsruimte, berekend op basis van het
      zesde of zevende lid van minder dan vijf vervuilingseenheden wordt op drie vervuilingseenheden, en van één of
      minder dan één vervuilingseenheid op één vervuilingseenheid gesteld.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel21
  - number: '22.1'
    text: |-
      Indien door de heffingplichtige aannemelijk is gemaakt dat het aantal vervuilingseenheden met betrekking tot
      het zuurstofverbruik in een kalenderjaar voor een bedrijfsruimte of een onderdeel daarvan, die hij gebruikt,
      1000 of minder bedraagt, en dat dit aantal aan de hand van de hoeveelheid ten behoeve van die bedrijfsruimte
      of dat onderdeel van die bedrijfsruimte ingenomen water bepaald kan worden, wordt dat aantal in afwijking
      van [artikel 20, eerste lid][ref1], vastgesteld volgens de formule: A X B, waarbij, A = het aantal m3 in het
      kalenderjaar ten behoeve van de bedrijfsruimte of het onderdeel van de bedrijfsruimte ingenomen water; B =
      de afvalwatercoëfficiënt behorende bij de klasse van de in het derde lid opgenomen tabel met de klassegrenzen
      waarbinnen de vervuilingswaarde met betrekking tot het zuurstofverbruik per m3 ten behoeve van de bedrijfsruimte of
      van het onderdeel van de bedrijfsruimte ingenomen water is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002682#Artikel20
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002682
        artikel: '20'
        hoofdstuk: IV
  - number: '22.2'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld voor de bepaling van de vervuilingswaarde met
      betrekking tot het zuurstofverbruik per m3 ten behoeve van de bedrijfsruimte of het onderdeel van de bedrijfsruimte
      ingenomen water.
    url: https://wetten.overheid.nl/BWBR0002682/2006-01-01#Artikel22
