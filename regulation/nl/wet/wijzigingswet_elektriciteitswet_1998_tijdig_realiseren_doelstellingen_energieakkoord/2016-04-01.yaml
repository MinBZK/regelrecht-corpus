  - number: V
    text: |-
      In [afwijking van artikel 21, tweede lid, van de Elektriciteitswet 1998][ref1] dient degene die op grond
      van [artikel III][ref2] in samenhang met de [artikelen 15a](onbekend), [10, tweede en derde lid][ref3] en
      [10a, vierde lid][ref4], wenst te worden aangewezen als netbeheerder van het net op zee, het document, bedoeld in
      artikel 21, tweede lid, van de Elektriciteitswet 1998 voor de eerste keer in binnen één maand na het indienen van
      het verzoek op grond van artikel 15a, tweede lid, in samenhang met artikel 10, derde lid, van de Elektriciteitswet
      1998.


