  - number: IV.2
    text: |-
      [Artikel 41ba van de Elektriciteitswet 1998][ref1] zoals dit luidde voor de inwerkingtreding van
      [artikel I, onderdeel P][ref2], blijft tot het tijdstip, bedoeld in het eerste lid, van toepassing,
      met dien verstande dat het tweede lid van dat artikel van toepassing is op de geschatte kosten die
      de netbeheerder van het landelijk hoogspanningsnet na 31 december 2016 maakt voor het uitvoeren van
      [artikel 16, tweede lid, onderdeel n, van de Elektriciteitswet 1998][ref3] zoals dit luidde voor de
      inwerkingtreding van artikel I, onderdeel F.


