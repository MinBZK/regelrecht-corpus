    text: |-
      [Artikel 16, tweede lid, onderdeel n, van de Elektriciteitswet 1998][ref1] zoals dit luidde voor de
      inwerkingtreding van [artikel I, onderdeel F][ref2], blijft van toepassing tot het tijdstip waarop Onze Minister
      op grond van [artikel 10, tweede lid, van de Elektriciteitswet 1998][ref3] de netbeheerder van het net op zee heeft
      aangewezen.


