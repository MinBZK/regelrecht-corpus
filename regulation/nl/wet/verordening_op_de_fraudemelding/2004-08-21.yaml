articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze verordening wordt verstaan onder:

        - accountant: de Accountant-Administratieconsulent die optreedt als openbaar accountant in de zin van
      [artikel 2, lid 2 GBAA][ref1];
        - fraude: het opzettelijk door een of meer personen vervalsen, weglaten, toevoegen of verwijderen van gegevens
      teneinde waarden aan een huishouding op onrechtmatige wijze te onttrekken of te doen toevloeien;
        - directiefraude: fraude, gepleegd door of op last van de hoogste leiding (bij meerhoofdige leiding door of op last
      van een of meer leden van de leiding) van een huishouding;
        - toezichthoudend orgaan: het orgaan van de huishouding, dat belast is met het toezicht op de hoogste leiding van
      die huishouding;
        - materieel belang: (de mogelijke afwijking van) een post of een som van posten die van niet te verwaarlozen
      betekenis is voor het inzicht in de financiële verantwoording;
        - financiële verantwoording: de jaarrekening of de bescheiden die bij andere huishoudingen daarvoor in de plaats
      treden;
        - wettelijk verplichte controle: het deskundigenonderzoek ingevolge
      [boek 2 van het burgerlijk Wetboek, Titel 9][ref2], dan wel ingevolge enig ander wettelijk voorschrift;
        - centraal meldpunt: de Forensische Accountantsgroep van het Korps landelijke politiediensten te Driebergen.


      [ref1]: https://wetten.overheid.nl/BWBR0007117#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0006754/2004-08-21#Artikel1
