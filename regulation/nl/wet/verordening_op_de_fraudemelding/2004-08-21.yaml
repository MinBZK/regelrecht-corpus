  - number: '5'
    text: |-
      Indien een andere accountant een opdracht aanvaardt die door zijn voorganger na beëindiging van diens opdracht door
      hem overeenkomstig [artikel 3][ref1] is gemeld, geeft hij daarvan onverwijld schriftelijk kennis aan het centraal
      meldpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0006754#Artikel3
    url: https://wetten.overheid.nl/BWBR0006754/2004-08-21#Artikel5
    references:
