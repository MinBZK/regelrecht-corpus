        bwb_id: BWBR0006754
        artikel: '3'
  - number: '6'
    text: |-
      De accountant is met betrekking tot de melding als bedoeld in [artikel 3][ref1] aan het centraal meldpunt ontheven
      van zijn plicht tot geheimhouding zoals is geregeld in [artikel 10 GBAA][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006754#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007117#Artikel10
