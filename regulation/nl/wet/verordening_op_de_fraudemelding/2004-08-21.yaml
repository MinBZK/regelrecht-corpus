  - number: 6A
    text: |-
      Deze verordening maakt deel uit van de gedrags- en beroepsregels voor Accountants-Administratieconsulenten als
      bedoeld in [artikel 24, lid 2, van de Wet op de Accountants-Administratieconsulenten][ref1].


