        bwb_id: BWBR0003045
  - number: '2'
    text: |-
      1 De accountant die bij de uitvoering van zijn controle-opdracht aanwijzingen van fraude heeft verkregen, richt
      zijn verder onderzoek zodanig in dat hij een hoge mate van zekerheid verkrijgt over het al dan niet aanwezig zijn
      van fraude, ongeacht de mogelijke omvang en aard van de fraude. De accountant stelt de leiding van de huishouding
      schriftelijk op de hoogte van zijn aanwijzingen, voor zover hij dit niet strijdig acht met het doel van zijn
      onderzoek. Indien de accountant aanwijzingen heeft van directiefraude, stelt hij het toezichthoudend orgaan
      schriftelijk op de hoogte.

      2 De accountant die in redelijkheid een vermoeden van fraude heeft stelt de leiding van de huishouding hiervan
      schriftelijk op de hoogte. Het toezichthoudend orgaan wordt door hem schriftelijk ingelicht indien:

        - het directiefraude betreft, of
        - de leiding van de huishouding geen toereikende maatregelen treft om de gevolgen van fraude voor zover mogelijk
      ongedaan te maken en om herhaling daarvan te voorkomen, of
        - de fraude van materieel belang voor de financiële verantwoording is.

      3 De accountant geeft zijn opdracht terug indien de leiding respectievelijk het toezichthoudend orgaan van de
      huishouding, waarbij hij optreedt, niet binnen redelijke termijn nadat hij de leiding of het toezichthoudend orgaan
      daarop heeft gewezen, toereikende maatregelen neemt om de gevolgen van fraude van materieel belang voor zover
      mogelijk ongedaan te maken en om herhaling daarvan te voorkomen.
    url: https://wetten.overheid.nl/BWBR0006754/2004-08-21#Artikel2
  - number: '3'
    text: |-
      1 Indien het teruggeven van de opdracht, wegens een reden als bedoeld in [artikel 2, derde lid][ref1], een
      wettelijk verplichte controle van een financiële verantwoording betreft, stelt de accountant het centraal meldpunt
      hiervan onverwijld schriftelijk in kennis.

      2 De accountant stelt het centraal meldpunt eveneens onverwijld schriftelijk in kennis, indien zijn opdrachtgever
      de opdracht tot wettelijke verplichte controle van de financiële verantwoording beëindigt, nadat de leiding of het
      toezichthoudend orgaan van de huishouding, waarbij hij optrad, in gebreke is gebleven toereikende maatregelen te
      nemen om de gevolgen van fraude van materieel belang, voor zover mogelijk ongedaan te maken en om herhaling daarvan
      te voorkomen.

      3 De melding, bedoeld in dit artikel, geschiedt met opgave van de aard van de vermoede fraude.


      [ref1]: https://wetten.overheid.nl/BWBR0006754#Artikel2
    url: https://wetten.overheid.nl/BWBR0006754/2004-08-21#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006754
        artikel: '2'
  - number: '4'
    text: |-
      1 In het collegiaal overleg als bedoeld in [artikel 31 GBAA][ref1] maakt de accountant onder de plicht tot
      geheimhouding de reden bekend van het beëindigen van de opdracht.

      2 Ingeval de opdracht op grond van [artikel 2, derde lid][ref2], of [artikel 3, tweede lid][ref3], is beëindigd
      deelt de accountant de kennisgeving, als bedoeld in [artikel 3][ref4], zo deze is gedaan, aan zijn eventuele
      opvolger mee.

      3 Een andere accountant mag de opdracht tot controle van de financiële verantwoording slechts aanvaarden indien
      de gevolgen van de fraude voor zover mogelijk ongedaan zijn gemaakt, deze gevolgen op toereikende wijze in de
      financiële verantwoording zijn verwerkt en toereikende maatregelen zijn genomen om herhaling te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007117#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0006754#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006754#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0006754#Artikel3
    url: https://wetten.overheid.nl/BWBR0006754/2004-08-21#Artikel4
