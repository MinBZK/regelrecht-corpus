  - number: '5'
    text: |-
      Indien een ander openbaar accountant een opdracht aanvaardt die door zijn voorganger na beëindiging van diens
      opdracht door hem overeenkomstig [artikel 3][ref1] is gemeld, geeft hij daarvan onverwijld schriftelijk kennis aan
      het centraal meldpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0006758#Artikel3
    url: https://wetten.overheid.nl/BWBR0006758/1995-03-08#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006758
        artikel: '3'
  - number: '6'
    text: |-
      De openbaar accountant is met betrekking tot de melding als bedoeld in [artikel 3][ref1] aan het centraal meldpunt
      ontheven van zijn plicht tot geheimhouding zoals is geregeld in [artikel 10 GBR-1994][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006758#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007194#Artikel10
