        artikel: '10'
  - number: '7'
    text: |-
      Deze verordening maakt deel uit van de gedrags- en beroepsregels voor registeraccountants als bedoeld in
      [artikel 19, lid 2, van de Wet op de Registeraccountants][ref1].


