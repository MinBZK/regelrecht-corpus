$id: regeling_verlenging_en_digitalisering_landelijke_commerciele_radio_omroep
regulatory_layer: WET
publication_date: '2013-02-15'
valid_from: '2011-03-23'
bwb_id: BWBR0029751
url: https://wetten.overheid.nl/BWBR0029751/2011-03-23
preamble:
  text: |-
    Gelet op artikel 3.3, tweede lid, van de Telecommunicatiewet en de artikelen 9, eerste en vierde lid, 11, derde
    lid, 12 en 13 van het Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
  - number: 1.1.a
    text: '*minister:* Minister van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
  - number: 1.1.b
    text: |-
      *commerciële radio-omroep:* radio-omroep als bedoeld in [artikel 1.1, eerste lid, van de Mediawet 2008][ref1] die
      wordt verzorgd door een commerciële media-instelling als bedoeld in artikel 1.1, eerste lid, van die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 1.1.c
    text: |-
      *ongeclausuleerde landelijke commerciële radio-omroep:* landelijke
      commerciële radio-omroep waarvoor geen gebruiksvoorschriften op grond van de
      [Regeling aanwijzing en gebruik frequentieruimte commerciële radio-omroep 2003][ref1] gelden;


      [ref1]: https://wetten.overheid.nl/BWBR0014740
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014740
  - number: 1.1.d
    text: |-
      *geclausuleerde landelijke commerciële radio-omroep:* landelijke
      commerciële radio-omroep waarvoor gebruiksvoorschriften op grond van de
      __REF000___________________________________________________________________________________________________________
      ___ gelden;


      [ref1]: https://wetten.overheid.nl/BWBR0014740#Artikel2
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014740
        artikel: '2'
  - number: 1.1.e
    text: '*kavel:* frequentie of samenstel van frequenties voor het gebruik waarvan een vergunning kan worden verleend;'
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
  - number: 1.1.f
    text: |-
      *vergunning voor kavel A1:* de vergunning voor kavel A1 die verleend is op grond van de
      Regeling[ aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
  - number: 1.1.g
    text: |-
      *vergunning voor kavel A2:* de vergunning voor kavel A2 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
  - number: 1.1.h
    text: |-
      *vergunning voor kavel A3:* de vergunning voor kavel A3 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
  - number: 1.1.i
    text: |-
      *vergunning voor kavel A4:* de vergunning voor kavel A4 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
  - number: 1.1.j
    text: |-
      *vergunning voor kavel A5:* de vergunning voor kavel A5 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
  - number: 1.1.k
    text: |-
      *vergunning voor kavel A6:* de vergunning voor kavel A6 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
  - number: 1.1.l
    text: |-
      *vergunning voor kavel A9:* de vergunning voor kavel A9 die verleend is op grond van de
      [Regeling aanvraag en vergelijkende toets vergunningen commerciële radio-omroep 2003][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014741
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014741
  - number: 1.1.m
    text: |-
      *vergunning voor digitale radio-omroep:* een vergunning voor het gebruik van 1/9 deel van de capaciteit van de
      frequentieruimte binnen het frequentiebereik 219,584 - 221,120 MHz;
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
  - number: 1.1.n
    text: |-
      *FM-vergunning:* een vergunning voor commerciële radio-omroep voor één van de kavels A1, A2, A3, A4, A5, A6 of A9
      met een looptijd tot 1 september 2011;
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
  - number: 1.1.o
    text: |-
      *radioprogramma:* radioprogramma als bedoeld in [artikel 1.1, eerste lid, van de Mediawet 2008][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: '1.2'
    text: |-
      De vergunning voor kavel A2 wordt geacht mede te omvatten de vergunning inzake de steunzender 95,5 MHz te
      Hilversum.
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel1
  - number: '2.1'
    text: |-
      Een aanvraag om verlenging van de looptijd van een FM-vergunning tot 1 september 2017 wordt ingediend bij de
      minister.
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel2
  - number: '2.2'
    text: |-
      De aanvraag wordt na inwerkingtreding van deze regeling en uiterlijk 15 april 2011 om 14.00 uur per post ontvangen
      dan wel door middel van persoonlijke overhandiging ingediend op het volgende adres: Agentschap Telecom, Emmasingel
      1, 9726 AH Groningen.
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel2
  - number: '2.3'
    text: |-
      Bij persoonlijke overhandiging van de aanvraag wordt een bewijs van ontvangst afgegeven dat is voorzien van datum
      en tijdstip van ontvangst en ondertekening.
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel2
  - number: '2.4'
    text: |-
      De aanvrager dient slechts één aanvraag in, ook indien hij als houder van meer dan een FM-vergunning
      aanspraak wenst te maken op verlenging van zijn vergunningen. Met elkaar verbonden instellingen als bedoeld in
      [artikel 6.24, tweede lid, van de Mediawet 2008][ref1] dienen eveneens slechts één aanvraag in.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel6
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '6'
  - number: '2.5'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van het in [bijlage 1][ref1] opgenomen model en gaat vergezeld van de
      in dit model genoemde gegevens en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0029751
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029751
  - number: '2.6'
    text: |-
      Teneinde te kunnen voldoen aan het Nationaal Frequentieplan 2005, doet de aanvrager zijn aanvraag vergezeld gaan
      van een aanvraag voor een vergunning voor digitale radio-omroep dan wel, in het geval de eerstgenoemde aanvraag
      betrekking heeft op twee FM-vergunningen, een aanvraag voor twee vergunningen voor digitale radio-omroep.
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel2
  - number: '3.1'
    text: |-
      Indien de aanvrager een eenmalig bedrag is verschuldigd op grond van
      [artikel 2 van de Regeling vaststelling eenmalig bedrag landelijke commerciële radio-omroep 2011][ref1], verstrekt
      de aanvrager een waarborgsom of een bankgarantie ter grootte van een zesde deel van het verschuldigde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0029752#Artikel2
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029752
        artikel: '2'
  - number: '3.2'
    text: |-
      Bij de verstrekking van een waarborgsom wordt deze uiterlijk 15 april 2011 om 14.00 uur ontvangen op
      bankrekeningnummer 56.99.94.039, ten name van Ministerie van Economische Zaken, Landbouw en Innovatie; Agentschap
      Telecom, onder vermelding van de desbetreffende kavel in de FM-band en van ‘vergunning voor digitale radio-omroep’.
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel3
  - number: '3.3'
    text: |-
      Bij de verstrekking van een bankgarantie wordt gebruik gemaakt van de modelbankgarantie , opgenomen in
      [bijlage 2][ref1], en is [artikel 2, tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029751
      [ref2]: https://wetten.overheid.nl/BWBR0029751#Artikel2
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029751
      - id: ref2
        bwb_id: BWBR0029751
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      Indien niet is voldaan aan [artikel 2, tweede of zesde lid][ref1], weigert de Minister van Economische Zaken,
      Landbouw en Innovatie de verlenging van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0029751#Artikel2
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029751
        artikel: '2'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Indien de aanvrager niet heeft voldaan aan een van de in [artikel 2, vierde en vijfde lid][ref1], of
      [artikel 3][ref2] gestelde eisen, deelt de minister dit de aanvrager mee en stelt de minister de aanvrager in de
      gelegenheid het verzuim te herstellen.


      [ref1]: https://wetten.overheid.nl/BWBR0029751#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029751#Artikel3
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0029751
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029751
        artikel: '3'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      De aanvrager heeft gedurende vijf werkdagen te rekenen vanaf de dag na dagtekening van de mededeling, bedoeld in
      het eerste lid, de gelegenheid het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel5
  - number: '5.3'
    text: |-
      De gegevens of bescheiden ten behoeve van het verzuimherstel worden per post ontvangen op dan wel door middel
      van persoonlijke overhandiging ingediend op het adres, genoemd in [artikel 2, tweede lid][ref1], binnen de in het
      tweede lid bedoelde termijn, met dien verstande dat de ontvangst geschiedt vóór 17.00 uur. Verzuimherstel aangaande
      de waarborgsom geschiedt binnen dezelfde termijn, en met gebruikmaking van het bankrekeningnummer, genoemd in
      [artikel 3, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029751#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029751#Artikel3
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0029751
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029751
        artikel: '3'
        paragraaf: '2'
  - number: '5.4'
    text: |-
      Indien het verzuim niet binnen de termijn, bedoeld in het tweede en het derde lid, en op de wijze,
      vermeld in het derde lid, is hersteld of de aanvrager na herstel niet heeft voldaan aan de in
      [artikel 2, vierde en vijfde lid][ref1], en [artikel 3][ref2] gestelde eisen, kan de aanvraag buiten behandeling
      worden gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0029751#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029751#Artikel3
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0029751
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029751
        artikel: '3'
        paragraaf: '2'
  - number: '6'
    text: |-
      Indien de aanvraag niet is afgewezen of buiten behandeling is gesteld op grond van [artikel 4][ref1]
      onderscheidenlijk [artikel 5, vierde lid][ref2], zijn de [artikelen 3.6][ref3] en [3.7 van de wet][ref4] van
      overeenkomstige toepassing bij het nemen van een besluit op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0029751#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0029751#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029751
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029751
        artikel: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '7.1'
    text: |-
      Een aanvraag van een houder van een FM-vergunning voor een vergunning voor digitale radio-omroep wordt ingediend
      bij de minister.
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel7
  - number: '7.2'
    text: |-
      De [artikelen 2, tweede tot en met vijfde lid][ref1], [3][ref2], [4][ref3] en [5][ref4] zijn van overeenkomstige
      toepassing, met dien verstande dat de in artikel 4 bedoelde weigering ten aanzien van de aanvraag voor een
      vergunning voor digitale radio-omroep betrekking heeft op de verlening van die vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0029751#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0029751#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0029751#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0029751#Artikel5
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0029751
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0029751
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0029751
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0029751
        artikel: '5'
        paragraaf: '2'
  - number: '8'
    text: |-
      Indien de aanvraag, bedoeld in [artikel 2, eerste lid][ref1], wordt toegewezen, verleent de minister gelijktijdig
      een vergunning voor digitale radio-omroep.


      [ref1]: https://wetten.overheid.nl/BWBR0029751#Artikel2
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029751
        artikel: '2'
        paragraaf: '2'
  - number: '11'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling verlenging en digitalisering landelijke commerciële radio-omroep.'
    url: https://wetten.overheid.nl/BWBR0029751/2011-03-23#Artikel12
