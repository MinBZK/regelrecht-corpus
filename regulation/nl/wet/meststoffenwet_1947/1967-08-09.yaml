preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is, maatregelen te nemen tot het tegengaan van bedrog
    in den handel in middelen ter bestrijding van verwekkers van plantenziekten, van uit landbouwoogpunt schadelijke
    dieren en van onkruiden en daarbij tevens nieuwe, gelijksoortige regelen te stellen ter bestrijding van bedrog in
    den handel in meststoffen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002028/1967-08-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze Wet verstaat onder:

      "Onzen Minister": Onzen Minister, belast met de zaken van den landbouw.

      "Meststof": een stof, bestemd om aan den bodem of aan den grond te worden toegevoegd ter instandhouding of
      vermeerdering van hun productievermogen.

      "Verkoopen": ten verkoop in voorraad hebben, te koop aanbieden, te koop doen aanbieden, verkopen, doen verkopen,
      afleveren en doen afleveren, alsmede leveren als onderdeel van een dienstverrichting.

      "Vervoeren": vervoeren en doen vervoeren.
    url: https://wetten.overheid.nl/BWBR0002028/1967-08-09#Artikel1
  - number: '2'
    text: Bij Algemeenen Maatregel van Bestuur kan het vervoeren en verkoopen van meststoffen worden verboden.
    url: https://wetten.overheid.nl/BWBR0002028/1967-08-09#Artikel2
  - number: '3'
    text: |-
      1 Bij Algemeenen Maatregel van Bestuur kan worden bepaald, dat van een krachtens [artikel 2][ref1] uitgevaardigd
      verbod ontheffing kan worden verleend en door wien de ontheffing wordt verleend.

      2 Een zoodanige ontheffing wordt als regel eerst verleend, nadat een onderzoek heeft plaats gehad naar de kwaliteit
      en de werking van het product. De kosten van het onderzoek komen ten laste van dengene, die de ontheffing heeft
      aangevraagd.

      3 Bij of krachtens Algemeenen Maatregel van Bestuur kunnen regelen worden gesteld betreffende de wijze, waarop
      ontheffing moet worden aangevraagd, de behandeling der aanvrage, de voldoening van de kosten van het onderzoek en
      de wijze, waarop ontheffing wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002028#Artikel2
    url: https://wetten.overheid.nl/BWBR0002028/1967-08-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002028
        artikel: '2'
  - number: '4'
    text: |-
      Bij of krachtens Algemeenen Maatregel van Bestuur kunnen voorschriften worden gegeven, betreffende de aanduiding
      van de stoffen en mengsels van stoffen, die overeenkomstig de bepalingen krachtens deze wet worden vervoerd of
      verkocht, alsmede betreffende garantievermelding, toegestane speling en vergoedingsberekening.
    url: https://wetten.overheid.nl/BWBR0002028/1967-08-09#Artikel4
  - number: '5'
    text: |-
      1 Een ieder is verplicht tot geheimhouding van hetgeen hem bij het verrichten van zijn taak ingevolge deze wet
      bekend is geworden omtrent de bereidingswijze of de samenstelling van eenige meststof, voorzoover die geheimhouding
      niet in strijd is met de bepalingen, bij of krachtens deze wet of een andere wet of besluit, gesteld.

      2 Deze verplichting tot geheimhouding geldt niet ten aanzien van die bestanddeelen van het product, welke giftig
      zijn voor menschen of warmbloedige dieren. De opsporingsambtenaren zijn voorts verplicht tot geheimhouding van de
      namen der personen, door wie aangifte is gedaan van een overtreding van het bepaalde krachtens deze wet, behoudens
      tegenover hen, aan wier bevelen zij uit kracht van hun ambt zijn onderworpen, alsmede wanneer de personen, die
      aangifte hebben gedaan, hun uitdrukkelijk verklaard hebben, tegen de mededeeling van hun namen geen bezwaar te
      hebben.
    url: https://wetten.overheid.nl/BWBR0002028/1967-08-09#Artikel5
  - number: '7'
    text: |-
      1 De opsporingsambtenaar die een monster heeft genomen, verpakt en verzegelt dit.

      2 Op verlangen van hem, in wiens bezit de waar zich tijdens de monsterneming bevindt, neemt de opsporingsambtenaar
      een tweede monster, hetwelk hij verpakt en verzegeld in diens bezit laat.

      3 De ambtenaar behoeft aan dit verlangen slechts te voldoen, indien hem een voorwerp, geschikt om het monster te
      verpakken en om te worden verzegeld, wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0002028/1967-08-09#Artikel7
  - number: '8'
    text: |-
      1 De ambtenaar, die het monster, bedoeld in het eerste lid van het vorige artikel, heeft genomen, zendt dit aan het
      voor het onderzoek bestemde Rijkslandbouwproefstation.

      2 Het monster wordt zo spoedig mogelijk door of vanwege het Rijkslandbouwproefstation onderzocht.
    url: https://wetten.overheid.nl/BWBR0002028/1967-08-09#Artikel8
  - number: '10'
    text: |-
      Indien het onderzoek aan de directeur van het Rijkslandbouwproefstation aanleiding geeft tot het uitlokken ener
      strafvervolging, doet hij hiervan, alsmede van de uitkomsten van het onderzoek, mededeling aan de ambtenaar, die
      het monster heeft genomen, en aan de bevoegde officier van justitie.
    url: https://wetten.overheid.nl/BWBR0002028/1967-08-09#Artikel10
  - number: '11'
    text: |-
      Onze Minister kan voorschriften geven betreffende de wijze van monsterneming, de verpakking, de verzegeling, de
      verzending en het onderzoek der in [artikel 7, eerste lid][ref1], bedoelde monsters en betreffende de wijze van
      monsterneming, de verpakking en de verzegeling der in [artikel 7, tweede lid][ref2], bedoelde monsters.


      [ref1]: https://wetten.overheid.nl/BWBR0002028#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002028#Artikel7
    url: https://wetten.overheid.nl/BWBR0002028/1967-08-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002028
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002028
        artikel: '7'
  - number: '12'
    text: |-
      De ondernemer van een openbaar middel van vervoer wordt als zoodanig niet vervolgd, indien de naam en de woonplaats
      van den afzender van de voorwerpen, met betrekking tot welke de overtreding is gepleegd, bekend zijn of door den
      ondernemer aan den Officier van Justitie op diens aanmaning en binnen een door hem te bepalen termijn worden bekend
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002028/1967-08-09#Artikel12
  - number: '13'
    text: |-
      Op het tijdstip, waarop een Algemeene Maatregel van Bestuur betreffende de meststoffen, als bedoeld in
      [artikel 2][ref1], in werking treedt, wordt ingetrokken No. 7 van artikel 1 van Ons besluit van 5 September 1945
      (*Staatsblad* No. F 162), vervalt het besluit van de Secretarissen-Generaal van de Departementen van Landbouw
      en Visscherij en van Justitie betreffende den handel in meststoffen (Meststoffenbesluit) van 24 Augustus 1942
      (*Nederlandsche Staatscourant* van 24 Augustus 1942, No. 163) en treden in werking de navolgende wijzigingen van
      de wet van 31 December 1920 (*Staatsblad* No. 957), houdende bepalingen tot bestrijding van bedrog in den handel in
      meststoffen, zaaizaden en veevoeder:

      a. in de [artikelen 1][ref2] en [6][ref3] vervalt het woord "meststoffen";

      b. in [artikel 2][ref4] vervalt het woord "meststof";

      c. [artikel 3][ref5] vervalt en de [artikelen 4][ref6] tot en met 25 worden vernummerd tot: 3 tot en met 24;

      d. in het oorspronkelijke [artikel 5][ref7] wordt in plaats van de woorden "de vorige twee artikelen" gelezen: "het
      vorig artikel".


