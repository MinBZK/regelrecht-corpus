preamble:
  text: |-
    Gelet op beschikking nr. 2000/532/EG van de Commissie van de Europese Gemeenschappen van 3 mei 2000 tot vervanging
    van beschikking 94/3/EG houdende vaststelling van een lijst van afvalstoffen overeenkomstig artikel 1, onder a),
    van Richtlijn 75/442/EEG van de Raad van de Europese Gemeenschappen betreffende afvalstoffen en Beschikking 94/904/
    EG van de Raad van de Europese Unie tot vaststelling van een lijst van gevaarlijke afvalstoffen overeenkomstig
    artikel 1, lid 4, van Richtlijn 91/689/EEG van de Raad van de Europese Gemeenschappen betreffende gevaarlijke
    afvalstoffen (PbEG L 226/3), zoals laatstelijk gewijzigd bij beschikking nr. 2001/573/EG van de Raad van de
    Europese Unie van 23 juli 2001 tot wijziging van Beschikking 2000/532/EG van de Commissie wat de lijst van
    afvalstoffen betreft (PbEG L 203/18) en op artikel 1.1, eerste, zesde en tiende lid, en 10.15 tot en met 10.17 jo.
    21.6 van de Wet milieubeheer, artikel 3, eerste lid, van de Bestrijdingsmiddelenwet 1962 en artikel 2, tweede lid,
    van het Bestrijdingsmiddelenbesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013546/2011-03-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:




                *afvalstoffenlijst:*


                bijlage bij beschikking nr. 2000/532/EG van de Commissie van de Europese Gemeenschappen van 3 mei
      2000 tot vervanging van Beschikking 94/3/EG houdende vaststelling van een lijst van afvalstoffen overeenkomstig
      artikel 1, onder a), van [Richtlijn 75/442/EEG](31975L0442) van de Raad van de Europese Gemeenschappen betreffende
      afvalstoffen en Beschikking 94/904/EG van de Raad van de Europese Unie tot vaststelling van een lijst van
      gevaarlijke afvalstoffen overeenkomstig artikel 1, lid 4, van [Richtlijn 91/689/EEG](31991L0689) van de Raad van de
      Europese Gemeenschappen betreffende gevaarlijke afvalstoffen (PbEG L 226/3);




                *complementaire categorieën:*


                indeling van een afvalstof in de afvalstoffenlijst in twee of meer categorieën waarbij aan de hand van de
      samenstelling of de fysische eigenschappen wordt bepaald of een afvalstof gevaarlijk dan wel niet-gevaarlijk is.




      2 De tekst van de afvalstoffenlijst alsmede de tekst van de wijzigingen daarvan worden in de Staatscourant
      geplaatst.

      3 Een wijziging in de bijlage bij de beschikking, genoemd in het eerste lid, gaat voor de toepassing van het eerste
      lid gelden met ingang van de dag waarop aan die wijziging uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0013546/2011-03-05#Artikel1
  - number: '2'
    text: |-
      Als afvalstoffen in de zin van [artikel 1.1, zesde lid, van de Wet milieubeheer][ref1], worden aangewezen de
      stoffen, preparaten of voorwerpen, genoemd in de afvalstoffenlijst.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0013546/2011-03-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1.1'
  - number: '4'
    text: |-
      1 Een afvalstof die in de afvalstoffenlijst is ingedeeld in complementaire categorieën wordt gerubriceerd onder de
      met een asterisk aangeduide categorie indien wordt vastgesteld dat de afvalstof een of meer eigenschappen bezit als
      bedoeld in bijlage III bij de kaderrichtlijn afvalstoffen.

      2 Een afvalstof bezit de eigenschappen, bedoeld in de onderdelen H3 tot en met H8, H10 en H11 van de bijlage,
      bedoeld in het eerste lid, indien deze een of meer van de volgende eigenschappen bezit:

      a. een vlampunt ≤ 55 °C,

      b. een of meer als zeer vergiftig ingedeelde stoffen met een totale concentratie ≥ 0,1%,

      c. een of meer als vergiftig ingedeelde stoffen met een totale concentratie ≥ 3%,

      d. een of meer als schadelijk ingedeelde stoffen met een totale concentratie ≥ 25%,

      e. een of meer als R 35 ingedeelde bijtende stoffen met een totale concentratie ≥ 1%,

      f. een of meer als R 34 ingedeelde bijten de stoffen met een totale concentratie ≥ 5%,

      g. een of meer als R 41 ingedeelde irriterende stoffen met een totale concentratie ≥ 10%,

      h. een of meer als R 36, R 37 of R 38 ingedeelde irriterende stoffen met een totale concentratie ≥ 20%,

      i. een stof waarvan bekend is dat ze kankerverwekkend is (categorie 1 of 2) met een concentratie ≥ 0,1%,

      j. een stof waarvan bekend is dat ze kankerverwekkend is (categorie 3) met een concentratie ≥ 1%,

      k. een als R60 of R61 ingedeelde voor de voortplanting vergiftige stof (categorie 1 of 2) met een concentratie
      ≥ 0,5%,

      l. een als R62 of R63 ingedeelde voor de voortplanting vergiftige stof (categorie 3) met een concentratie ≥ 5%,

      m. een als R 46 ingedeelde mutagene stof (categorie 1 of 2) met een concentratie ≥ 0,1%,

      n. een als R 40 ingedeelde mutagene stof (categorie 3) met een concentratie ≥ 1%.

      3 Bij het bepalen van de concentraties, bedoeld in het tweede lid, worden de gevolgen van het verdampen van een
      gevaarlijke stof of het verdunnen, vermengen of uitlogen van een afvalstof, niet in aanmerking genomen.

      4 Het derde lid is niet van toepassing indien een omgevingsvergunning voor een inrichting of een ontheffing als
      bedoeld in [artikel 10.63 van de Wet milieubeheer][ref1] is verleend die mede betrekking heeft op het verdampen van
      een gevaarlijke stof of het verdunnen, vermengen of uitlogen van afvalstoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel10.63
    url: https://wetten.overheid.nl/BWBR0013546/2011-03-05#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '10.63'
  - number: '5'
    text: |-
      1 Bij het vaststellen of een afvalstof de in [artikel 4][ref1] bedoelde eigenschappen bezit, wordt het tweede tot
      en met het vierde lid in acht genomen.

      2 Afvalstoffen worden als volgt bemonsterd:

      a. afgewerkte olie volgens NEN-EN-ISO 3170: uitgave 1998,

      b. olie uit elektrische toestellen volgens NEN 10567: uitgave 1993,

      c. bitumen en teerproducten volgens NEN 3940: uitgave 1982,

      d. asbest in afval en puingranulaat volgens ontwerp NEN 5897: uitgave 1999,

      e. de overige afvalstoffen volgens NVN 5860: uitgave 1999.

      3 De voorbehandeling van monsters geschiedt als volgt:

      a. monsters die worden ontsloten voor de bepaling van elementen worden behandeld volgens ontwerp NEN-EN 13657:
      uitgave 1999,

      b. monsters ter bepaling van overige organische en anorganische stoffen worden behandeld volgens NVN 5870: uitgave
      1998.

      4 De analyse van:

      a. asbest in afval en puingranulaat geschiedt volgens ontwerp NEN 5897: uitgave 1999,

      b. het totaal PCB-gehalte in afgewerkte olie geschiedt volgens EN 12766-1: uitgave 2000 en wordt berekend volgens
      EN 12766-2: uitgave 2001,

      c. het EOX-gehalte in afgewerkte olie geschiedt volgens NEN 7425: uitgave 1999,

      d. overige stoffen geschiedt volgens ontwerp NEN 5878: uitgave 2001.

      5 Met de methoden, bedoeld in het eerste tot en met vierde lid, worden gelijkgesteld de methoden die volgens een
      wettelijk voorschrift zijn voorgeschreven in een andere lidstaat van de Europese Unie dan wel in een staat die
      partij is bij de overeenkomst inzake de Europese Economische Ruimte, en die ten minste gelijkwaardig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0013546#Artikel4
    url: https://wetten.overheid.nl/BWBR0013546/2011-03-05#Artikel5
