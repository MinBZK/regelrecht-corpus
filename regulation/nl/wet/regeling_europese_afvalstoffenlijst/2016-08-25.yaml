  - number: '7'
    text: De Regeling aanwijzing gevaarlijke afvalstoffen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013546/2016-08-25#Artikel7
  - number: '8'
    text: De Regeling aanvulling aanwijzing gevaarlijke afvalstoffen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0013546/2016-08-25#Artikel8
  - number: '11'
    text: |-
      1 Voor de toepassing van het begrip `gevaarlijke afvalstoffen' in voorschriften die zijn verbonden aan een
      vergunning als bedoeld in het tweede lid, dan wel in beperkingen of voorwaarden waaronder een zodanige vergunning
      is verleend, worden tot 1 januari 2003 of, zoveel eerder als de wijziging van de vergunning of de beschikking
      op de aanvraag in werking is getreden, als gevaarlijke afvalstoffen aangemerkt, de afvalstoffen die onmiddellijk
      voorafgaand aan het tijdstip van inwerkingtreding van deze regeling als zodanig waren aangewezen.

      2 Het eerste lid is van toepassing op vergunningen als bedoeld in [artikel 8.1 van de Wet milieubeheer][ref1] die
      onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van deze regeling golden en waarvoor het bevoegd
      gezag voor dat tijdstip in verband met de aanpassing van die vergunning aan de bepalingen van deze regeling:

      a. een kennisgeving als bedoeld in [artikel 3:30 van de Algemene wet bestuursrecht][ref2] heeft gedaan;

      b. een ontvankelijke aanvraag heeft ontvangen.

      3 Indien als gevolg van de inwerkingtreding van deze regeling ingevolge [artikel 8.23 van de Wet milieubeheer][ref3]
      of [hoofdstuk 3 van het Inrichtingen- en vergunningenbesluit milieubeheer][ref4] een ander orgaan dan voorheen
      bevoegd is tot aanpassing als bedoeld in het tweede lid, is het eerste lid van toepassing indien dit orgaan
      de kennisgeving of de aanvraag, bedoeld in het tweede lid, onder a of b, binnen vier weken na het tijdstip van
      inwerkingtreding van deze regeling heeft gedaan, respectievelijk heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel330
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel8.23
      [ref4]: https://wetten.overheid.nl/BWBR0005829#Hoofdstuk3
