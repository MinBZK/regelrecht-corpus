  - number: '30'
    text: |-
      1 Een ieder die krachtens deze wet de beschikking krijgt over gegevens met betrekking tot een derde, is verplicht
      tot geheimhouding daarvan, behoudens voor zover een bij of krachtens deze wet gegeven voorschrift mededelingen
      toelaat, dan wel de uitvoering van de taak met het oog waarop de gegevens zijn verstrekt tot het ter kennis brengen
      daarvan noodzaakt.

      2 [Artikel 272, tweede lid, van het Wetboek van Strafrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel272
