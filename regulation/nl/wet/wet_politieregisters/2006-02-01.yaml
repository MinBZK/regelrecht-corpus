  - number: '2'
    text: |-
      Deze wet is niet van toepassing op verzamelingen van persoonsgegevens

        - die zijn aangelegd voor de uitvoering van de taken ten dienste van de justitie, bedoeld in
      [artikel 1, eerste lid, onder g, onderdelen 1 en 2, van de Politiewet 1993][ref1];
        - die naar hun aard voor persoonlijk gebruik zijn bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel1
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel2
    references:
