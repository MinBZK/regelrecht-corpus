  - number: '31'
    text: |-
      1 De artikelen 1 tot en met 3 en 26 tot en met 30 van deze wet treden in werking met ingang van de dag na de datum
      van uitgifte van het Staatsblad waarin zij wordt geplaatst.

      2 De overige artikelen van deze wet treden zes maanden later in werking.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel31
  - number: '32'
    text: |-
      1 Het reglement voor een politieregister bestaande op het in artikel 31, tweede lid, bedoelde tijdstip, wordt
      binnen zes maanden na dat tijdstip vastgesteld.

      2 Binnen dezelfde termijn wordt de inhoud van het register met het reglement en het bij of krachtens deze wet
      bepaalde in overeenstemming gebracht. Onze Ministers, het College bescherming persoonsgegevens gehoord, kunnen ten
      aanzien van het register deze termijn eenmaal met dezelfde termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel32
  - number: '33'
    text: 'Deze wet kan worden aangehaald als: Wet politieregisters.'
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel33
