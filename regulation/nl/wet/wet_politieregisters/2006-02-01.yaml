  - number: 13d
    text: |-
      1 Onverminderd [artikel 13c][ref1] worden registers als bedoeld in de [artikelen 13a][ref2] en [13b][ref3]
      slechts aangelegd bij de daartoe krachtens de [Politiewet 1993][ref4] aangewezen organisatorische eenheden van de
      politie, alsmede bij de daartoe door Onze Minister van Defensie, in overeenstemming met Onze Ministers, aangewezen
      organisatorische eenheid van de Koninklijke marechaussee.

      2 Uit een tijdelijk register en uit een voorlopig register worden gegevens verstrekt:

      a. ingevolge de [artikelen 7][ref5], [15, eerste lid, onder a, en tweede lid][ref6],
      [18, vierde en vijfde lid][ref7], en [27][ref8] of

      b. wanneer uit de gegevens zelf een redelijk vermoeden voortvloeit dat een bepaalde persoon een strafbaar feit
      heeft begaan.

      3 Uit een tijdelijk register kunnen verder gegevens worden verstrekt:

      a. ter voorkoming van een onmiddellijke en ernstige bedreiging van de openbare veiligheid, of

      b. indien dat is overeengekomen bij de instelling van een gemeenschappelijk onderzoeksteam als bedoeld in
      [artikel 552qa van het Wetboek van Strafvordering][ref9] dat in Nederland is gevestigd.

      4 Persoonsgegevens die worden vastgelegd voor de doeleinden, bedoeld in deze paragraaf, worden slechts vastgelegd
      en gebruikt overeenkomstig het bij of krachtens deze paragraaf bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel13c
