  - number: 13a
    text: |-
      1 Opneming van persoonsgegevens in een register zware criminaliteit vindt slechts plaats omtrent:

      a. verdachten van misdrijven, waarvoor het register is aangelegd;

      b. personen, ten aanzien van wie een redelijk vermoeden bestaat dat zij betrokken zijn bij het beramen of plegen
      van misdrijven als bedoeld onder a;

      c. personen die in een bepaalde relatie staan tot degenen, bedoeld onder a en b, en

      d. ambtenaren van politie, van de Koninklijke marechaussee of van een publiekrechtelijk lichaam als bedoeld in
      [artikel 13c][ref1], voor zover dit van belang is voor het gebruik van de gegevens, bedoeld onder a tot en met c,
      alsmede voor de verantwoording van de verrichtingen naar aanleiding van de opgenomen gegevens.

      2 Uit een register zware criminaliteit worden omtrent personen als bedoeld in het eerste lid, onder c, slechts
      gegevens verstrekt overeenkomstig [artikel 13b, tweede tot en met het vierde lid][ref2]. Omtrent personen als
      bedoeld in het eerste lid, onder a en b, worden geen gegevens verstrekt krachtens [artikel 18, derde lid][ref3].

      3 Indien dit noodzakelijk is voor een goede uitvoering van de politietaak, kan de verstrekking ingevolge de
      [artikelen 14][ref4] en [15, eerste lid, onder b, c en d en f][ref5], uit een register zware criminaliteit worden
      geweigerd dan wel aan beperkende voorwaarden wat betreft het verdere gebruik worden onderworpen.

      4 Het derde lid is niet van toepassing op de verstrekking aan het meldpunt, bedoeld in
      [artikel 2 van de Wet melding ongebruikelijke transacties][ref6], die noodzakelijk is om te kunnen vaststellen of
      een persoon geregistreerd staat in het register zware criminaliteit.

      5 Bij algemene maatregel van bestuur kunnen personen of instanties met een publieke taak belast, indien een
      zwaarwegend algemeen belang dit vordert, worden aangewezen aan wie in bij die algemene maatregel van bestuur
      aan te geven gevallen, voor daarbij aan te geven doeleinden en te bepalen categorieën, onder daarbij te stellen
      voorwaarden gegevens uit een register zware criminaliteit kunnen worden verstrekt. Tevens kunnen nadere regels
      omtrent de verstrekking worden gesteld.

      6 Een verstrekking uit een register zware criminaliteit anders dan krachtens [artikel 15, tweede lid][ref7], wordt
      vastgelegd, tenzij overeenkomstig het doel van het register is verstrekt aan personen die door de beheerder zijn
      aangewezen als vaste gebruikers.

      7 Persoonsgegevens uit een register zware criminaliteit kunnen met het oog op een bijzondere opdracht voor de wijze
      van uitvoering van de politietaak voor het geval de betrokkene op enige plaats wordt waargenomen, in samenhang met
      gegevens over de inhoud van deze opdracht en voor zover noodzakelijk voor het uitvoeren van die opdracht, worden
      vastgelegd in een ander politieregister. Elke verstrekking voor dat doel wordt vastgelegd.

      8 Gegevens als bedoeld in het eerste lid worden uit het register zware criminaliteit verwijderd en vernietigd
      indien zij niet langer noodzakelijk zijn voor het doel van het register dan wel na verloop van vijf jaar na datum
      van de laatste opname van gegevens die blijk geven van de noodzaak tot registratie van betrokkene met het oog op
      het doel van het register.


