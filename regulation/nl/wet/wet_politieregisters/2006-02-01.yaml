        artikel: '1'
  - number: '3'
    text: Voordrachten tot een algemene maatregel van bestuur krachtens deze wet worden gedaan door Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel3
  - number: '4'
    text: |-
      1 Het aanleggen van een politieregister vindt slechts plaats voor een bepaald doel en voor zover dit noodzakelijk
      is voor een goede uitvoering van de politietaak.

      2 Het bevat slechts persoonsgegevens die rechtmatig zijn verkregen en die noodzakelijk zijn voor het doel waarvoor
      het is aangelegd. Bij de in een bijzonder politieregister opgenomen persoonsgegevens wordt de herkomst van de
      gegevens vermeld en op welke wijze de gegevens zijn verkregen.

      3 De beheerder treft de nodige voorzieningen ter bevordering van de juistheid en de volledigheid van de opgenomen
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel4
  - number: '5'
    text: |-
      1 Registratie van personen wegens hun godsdienst of levensovertuiging, ras, politieke gezindheid, seksualiteit,
      intiem levensgedrag, of op grond van medische of psychologische kenmerken, vindt niet plaats.

      2 Opneming in een register van persoonsgegevens die betrekking hebben op de in het eerste lid genoemde kenmerken,
      vindt slechts plaats in aanvulling op andere persoonsgegevens en voor zover dit voor het doel van het register
      onvermijdelijk is. Bij algemene maatregel van bestuur kunnen daaromtrent nadere regels worden gesteld.

      3 Over bepalingen in een reglement omtrent de opneming van persoonsgegevens bedoeld in het tweede lid, wordt het
      College bescherming persoonsgegevens vooraf gehoord.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel5
  - number: 5a
    text: |-
      1 Omtrent onverdachte personen worden in een politieregister, aangelegd voor de strafrechtelijke handhaving van de
      rechtsorde, slechts gegevens opgenomen:

      a. overeenkomstig paragraaf 3a van deze wet,

      b. in het register, bedoeld in [artikel 4 van de Wet melding ongebruikelijke transacties][ref1] dan wel

      c. gedurende een termijn die niet langer is dan vier maanden.

      2 In het geval, bedoeld in het eerste lid, onder c, worden geen gegevens verstrekt overeenkomstig artikel 18, derde
      lid, van deze wet. De gegevens kunnen na verloop van de termijn slechts worden opgenomen en gebruikt voor:

      a. de afhandeling van klachten,

      b. de verantwoording van de verrichtingen naar aanleiding van de opgenomen gegevens, of

      c. niet tot individuele natuurlijke personen herleidbare beleidsinformatie.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel4
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '4'
  - number: '6'
    text: |-
      1 Een politieregister kan slechts worden gekoppeld met een ander politieregister of met een andere verzameling van
      persoonsgegevens indien dit noodzakelijk is voor een goede uitvoering van de politietaak.

      2 Een koppeling als bedoeld in het eerste lid, vindt slechts plaats overeenkomstig het voor het register geldende
      reglement. Over bepalingen in een reglement omtrent koppeling wordt het College bescherming persoonsgegevens vooraf
      gehoord.

      3 Bij algemene maatregel van bestuur worden omtrent koppeling nadere regels gesteld ter bescherming van de
      persoonlijke levenssfeer.

      4 Onze Minister van Justitie kan in bijzondere gevallen toestemming geven tot een koppeling, in afwijking van het
      bepaalde krachtens het tweede en derde lid, indien dit noodzakelijk is voor de opsporing van een misdrijf waardoor
      de rechtsorde ernstig is geschokt. Aan de toestemming kunnen beperkingen en voorschriften worden verbonden. Het
      College bescherming persoonsgegevens wordt hierover zo mogelijk vooraf gehoord. De toestemming wordt in ieder geval
      zo spoedig mogelijk aan het College bescherming persoonsgegevens medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel6
  - number: '7'
    text: |-
      1 De beheerder draagt zorg voor de juiste werking van het register. Aan hem worden alle inlichtingen verstrekt die
      hij voor dit doel nodig heeft.

      2 Hij draagt zorg voor de nodige voorzieningen van technische en organisatorische aard ter beveiliging van het
      register tegen verlies of aantasting van de gegevens en tegen onbevoegde kennisneming, wijziging of verstrekking
      daarvan. Bij algemene maatregel van bestuur worden regels gesteld omtrent gevallen waarin het in het kader van
      technische werkzaamheden noodzakelijk is van gegevens kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel7
  - number: '8'
    text: |-
      [Artikel 49, eerste tot en met derde lid][ref1], en
      [artikel 50, eerste lid, van de Wet bescherming persoonsgegevens][ref2] zijn van overeenkomstige toepassing met
      dien verstande dat de beheerder voor de toepassing van deze artikelen wordt aangemerkt als de verantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel50
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '50'
  - number: '9'
    text: |-
      1 De beheerder van een politieregister stelt voor het register een reglement vast.

      2 De vaststelling geschiedt na overleg met het gezag dat verantwoordelijk is voor de uitvoering van de politietaak
      ten dienste waarvan het register wordt aangelegd.

      3 Het reglement wordt bekendgemaakt en voor een ieder ter inzage gelegd overeenkomstig regels bij algemene
      maatregel van bestuur te stellen.

      4 De beheerder zendt een exemplaar van het reglement aan het College bescherming persoonsgegevens.

      5 Het register wordt niet in werking gesteld dan nadat aan het eerste tot en met vierde lid is voldaan.

      6 Het tweede tot en met vijfde lid is van overeenkomstige toepassing bij wijziging of intrekking van het reglement.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel9
  - number: '10'
    text: |-
      1 In het reglement moet de werking van het register zijn beschreven.

      2 Het reglement bevat ten minste een duidelijke regeling van de volgende onderwerpen:

      a. het doel van het register;

      b. de categorieën van personen over wie gegevens worden opgenomen, en de soorten van de over hen op te nemen
      gegevens;

      c. de gevallen waarin opgenomen gegevens worden verwijderd;

      d. de vernietiging, zodra dit mogelijk is, van verwijderde gegevens;

      e. eventuele verbanden tussen het register en enige andere gegevensverzameling;

      f. de wijze waarop geregistreerde personen of hun wettelijke vertegenwoordigers kennisneming en verbetering van de
      over hen opgenomen gegevens kunnen verkrijgen;

      g. de bevoegdheid tot het invoeren en wijzigen van gegevens in, alsmede het verwijderen van gegevens uit het
      register;

      h. de aanwijzing van degene, onder verantwoordelijkheid van de beheerder belast met de zeggenschap over het
      register, en de omschrijving van de daaruit voortvoeiende bevoegdheden;

      i. de aanwijzing van degene of degenen, belast met de dagelijkse leiding van het register.

      3 Indien het reglement een politieregister betreft als bedoeld in artikel 1, onder *f*, sub 4 of sub 5, wordt in
      het reglement tevens vermeld wie beheerder van dat register is.

      4 Het reglement regelt de verstrekking van gegevens uit het register, daaronder begrepen de rechtstreekse toegang
      met het oog op raadpleging van persoonsgegevens, met inachtneming van het bij of krachtens de artikelen 14 tot en
      met 19 en 27 bepaalde.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel10
  - number: '11'
    text: |-
      De beheerder en al degenen die verder bij de werking van het register zijn betrokken, zijn verplicht het reglement
      dat voor het register geldt, na te leven.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel11
  - number: '12'
    text: |-
      1 Degene die een model van een reglement heeft vastgesteld, kan het College bescherming persoonsgegevens verzoeken
      te verklaren dat het model naar haar oordeel in overeenstemming is met het bepaalde bij of krachtens deze wet.
      Indien de Kamer een zodanige verklaring afgeeft, wordt het model in de *Staatscourant* geplaatst.

      2 Bij vaststelling van een reglement overeenkomstig een model ten aanzien waarvan is voldaan aan het gestelde in
      het eerste lid, zijn de artikelen 5, derde lid, 6, tweede lid, tweede volzin, 9, vierde lid, en 21, derde lid,
      tweede volzin, niet van toepassing. De beheerder deelt aan het College mede overeenkomstig welk model het reglement
      is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel12
  - number: '13'
    text: |-
      1 Opneming van persoonsgegevens in een tijdelijk register vindt slechts plaats met het oog op het doel waarvoor het
      register is aangelegd.

      2 Onverminderd het zevende lid en [artikel 13d, tweede lid][ref1], worden uit een tijdelijk register slechts
      gegevens verstrekt voor het doel waarvoor het register is aangelegd, tenzij verstrekking plaats vindt ten behoeve
      van de opneming in een register zware criminaliteit of een voorlopig register.

      3 Op een tijdelijk register zijn de [artikelen 6, tweede lid][ref2], en [9, eerste lid][ref3], niet van toepassing
      gedurende een bij algemene maatregel van bestuur te bepalen termijn.

      4 Na afloop van deze termijn is [artikel 9, vijfde lid][ref4], van overeenkomstige toepassing.

      5 De beheerder stelt binnen een week nadat is begonnen met het aanleggen van het register het College bescherming
      persoonsgegevens daarvan in kennis, tenzij dit inmiddels is vernietigd.

      6 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ter bescherming van de persoonlijke
      levenssfeer met betrekking tot tijdelijke registers.

      7 Indien er concrete aanleiding bestaat te vermoeden dat gegevens als bedoeld in
      [artikel 151c, zevende lid, van de Gemeentewet][ref5] noodzakelijk zijn voor de opsporing van een gepleegd
      strafbaar feit, kunnen die gegevens worden verstrekt ten behoeve van de opsporing van dat strafbare feit.


