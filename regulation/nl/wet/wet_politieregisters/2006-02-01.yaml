        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0002155
  - number: '17'
    text: |-
      Bij algemene maatregel van bestuur kan ten aanzien van bepaalde categorieën van gegevens de verplichting ingevolge
      de artikelen 14, 15, eerste lid, en 16, eerste lid, om deze gegevens te verstrekken, worden beperkt. Daarbij kan
      verder de bevoegdheid worden beperkt om ingevolge deze bepalingen uit een politieregister:

      a. bepaalde gegevens te verstrekken of

      b. aan bepaalde personen gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel17
  - number: '18'
    text: |-
      1 Bij algemene maatregel van bestuur worden regels gesteld omtrent de verstrekking van gegevens uit een
      politieregister - hetzij door tussenkomst van Interpol, hetzij anderszins - aan politie-autoriteiten in andere
      landen, alsmede omtrent de daarbij te stellen voorwaarden aan het gebruik daarvan door die politie-autoriteiten.

      2 Bij algemene maatregel van bestuur worden regels gesteld omtrent de verstrekking van gegevens uit het register
      van het meldpunt bedoeld in [artikel 2 van de Wet melding ongebruikelijke transacties][ref1] aan van overheidswege
      aangewezen niet-politiële instanties in het buitenland die een vergelijkbare taak hebben als het meldpunt, alsmede
      omtrent de daarbij te stellen voorwaarden aan het gebruik daarvan door die autoriteiten.

      3 Bij algemene maatregel van bestuur kunnen personen of instanties met een publieke taak belast, indien het
      openbaar belang dit vordert, worden aangewezen aan wie in bij die algemene maatregel aan te geven gevallen gegevens
      uit een politieregister mogen worden of dienen te worden verstrekt. Daarbij kunnen nadere regels omtrent de
      verstrekking worden gesteld.

      4 Bij algemene maatregel van bestuur worden regels gesteld omtrent het verstrekken van gegevens uit een
      politieregister ten behoeve van wetenschappelijk onderzoek en statistiek, met dien verstande dat de resultaten
      daarvan geen persoonsgegevens mogen bevatten.

      5 Onze Minister van Justitie of Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan in bijzondere
      gevallen toestemming of opdracht geven tot het verstrekken van daartoe omschreven gegevens uit een politieregister.
      Hij doet van de desbetreffende beschikking mededeling aan het College bescherming persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel2
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '2'
  - number: '19'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de voor verzoeken tot verstrekking
      van gegevens uit een politieregister en de verstrekking daarvan in acht te nemen procedure en de vastlegging van
      verstrekkingen uit het register.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel19
  - number: '20'
    text: |-
      1 De beheerder deelt een ieder op diens verzoek binnen vier weken mede of en zo ja welke deze persoon betreffende
      persoonsgegevens in een register zijn opgenomen. Hij verstrekt daarbij tevens desgevraagd inlichtingen over
      de herkomst van de gegevens en over degenen aan wie deze zijn verstrekt. Hij doet daarbij geen mededelingen in
      schriftelijke vorm.

      2 De beheerder draagt zorg voor een deugdelijke vaststelling van de identiteit van de verzoeker.

      3 Het verzoek, bedoeld in het eerste lid, wordt ten aanzien van minderjarigen die de leeftijd van zestien jaren nog
      niet hebben bereikt, en ten aanzien van onder curatele gestelden gedaan door hun wettelijke vertegenwoordigers. De
      betrokken mededeling geschiedt eveneens aan de wettelijke vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel20
  - number: '21'
    text: |-
      1 Een mededeling als bedoeld in artikel 20, eerste lid, blijft achterwege voor zover dit noodzakelijk is voor de
      goede uitvoering van de politietaak dan wel indien gewichtige belangen van derden daartoe noodzaken.

      2 Het eerste lid is niet van toepassing op antecedenten of op persoonsgegevens die op verzoek van de geregistreerde
      zijn opgenomen.

      3 In het reglement wordt bepaald in hoeverre toepassing wordt gegeven aan het bepaalde bij het eerste lid. Omtrent
      dergelijke bepalingen wordt het College bescherming persoonsgegevens vooraf gehoord.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel21
  - number: '22'
    text: |-
      1 Degene aan wie overeenkomstig artikel 20 mededeling is gedaan van hem betreffende persoonsgegevens, kan de
      beheerder schriftelijk verzoeken deze te verbeteren, aan te vullen, te verwijderen of af te schermen, indien deze
      feitelijk onjuist, voor het doel van het register onvolledig of niet ter zake dienend zijn dan wel in strijd met
      een wettelijk voorschrift in het register voorkomen. Het verzoek behelst de aan te brengen wijzigingen.

      2 De beheerder bericht de verzoeker binnen vier weken na ontvangst van het verzoek schriftelijk of dan wel
      in hoeverre hij daaraan voldoet. [Artikel 37 Wet bescherming persoonsgegevens][ref1] is van overeenkomstige
      toepassing. Een weigering is met redenen omkleed.

      3 De beheerder draagt zorg dat een beslissing tot verbetering, aanvulling, verwijdering of afscherming zo spoedig
      mogelijk wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel37
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '37'
  - number: '23'
    text: |-
      1 Indien de beheerder niet aan een verzoek als bedoeld in de [artikelen 20][ref1] of [22][ref2] voldoet, kan
      de betrokkene zich tot de rechtbank wenden met het schriftelijk verzoek, de beheerder te bevelen alsnog aan dat
      verzoek te voldoen.

      2 Het verzoekschrift moet worden ingediend binnen vier weken na ontvangst van het antwoord van de beheerder. Indien
      de beheerder niet binnen de gestelde termijn heeft geantwoord, moet het verzoekschrift worden ingediend binnen vier
      weken na afloop van die termijn.

      3 De betrokkene kan zich ook binnen de in het tweede lid gestelde termijn tot het College bescherming
      persoonsgegevens wenden met het verzoek te bemiddelen of te adviseren in zijn geschil met de beheerder. In dat
      geval kan het verzoekschrift als bedoeld in het eerste lid, nog worden ingediend nadat de betrokkene van het
      College bescherming persoonsgegevens bericht heeft ontvangen dat zij de behandeling van de zaak heeft gestaakt,
      doch uiterlijk tot vier weken na dat tijdstip.

      4 Over een verzoekschrift kan de rechtbank het advies van het College bescherming persoonsgegevens inwinnen.

      5 De rechtbank wijst het verzoek toe, voor zover zij dit gegrond oordeelt.

      6 Indiening van een verzoekschrift als bedoeld in het tweede en derde lid behoeft niet door een procureur te
      geschieden.

      7 De [derde afdeling van de vijfde titel van het Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref3]
      is van overeenkomstige toepassing.

      8 De griffier zendt afschrift van de uitspraak aan het College bescherming persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004798#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0001827#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004798
        artikel: '20'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0004798
        artikel: '22'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0001827
        afdeling: Derde
  - number: '24'
    text: |-
      De beheerder die in een register persoonsgegevens heeft verbeterd, aangevuld of daaruit heeft verwijderd naar
      aanleiding van een verzoek van een belanghebbende ingevolge artikel 22, een bevel van de rechter ingevolge artikel
      23 of een daartoe strekkende aanbeveling van het College bescherming persoonsgegevens, is verplicht om aan hen aan
      wie hij naar zijn weten in het jaar voorafgaand aan het verzoek en in de sinds dat verzoek verstreken periode de
      betrokken gegevens heeft verstrekt, mededeling te doen van deze wijziging.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel24
  - number: '25'
    text: |-
      1 Een verzoek ingevolge artikel 20, is slechts ontvankelijk na betaling van een kostenvergoeding. Het bedrag van de
      vergoeding en de wijze van betaling worden geregeld bij algemene maatregel van bestuur.

      2 De vergoeding wordt teruggegeven wanneer het verzoek leidt tot verbetering, aanvulling of verwijdering van de
      persoonsgegevens van de betrokkene, of wanneer het verzoek moet worden geweigerd ingevolge artikel 21, eerste lid.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel25
  - number: '26'
    text: |-
      1 Het College bescherming persoonsgegevens ziet toe op de werking van de politieregisters overeenkomstig het bij en
      krachtens deze wet bepaalde en in het belang van de bescherming van de persoonlijke levenssfeer in het algemeen.

      2 Voor de behandeling en afdoening van de aangelegenheden voortvloeiend uit het eerste lid, wordt bij het College
      een meervoudige afdeling ingesteld.

      3 Met het toezicht op de naleving van het bij enig wettelijk voorschriftten aanzien van de werking van
      politieregisters bepaalde, zijn belast de leden, plaatsvervangende leden en buitengewone leden van het College en
      de ambtenaren van het secretariaat van het College.
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel26
  - number: '27'
    text: |-
      De [artikelen 51, tweede lid][ref1], en [60 tot en met 64 van de Wet bescherming persoonsgegevens][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel60
