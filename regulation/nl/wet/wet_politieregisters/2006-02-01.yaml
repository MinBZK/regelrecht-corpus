  - number: 13b
    text: |-
      1 Opneming van persoonsgegevens in een voorlopig register vindt slechts plaats met het oog op het doel waarvoor het
      register is aangelegd.

      2 Onverminderd artikel 13d, tweede lid, worden uit een voorlopig register slechts voor identificatie benodigde
      gegevens verstrekt voor het doel waarvoor het register is aangelegd. Voorts worden gegevens verstrekt ten
      behoeve van de opneming in een ander bijzonder politieregister of ten behoeve van het meldpunt, bedoeld in
      [artikel 2 van de Wet melding ongebruikelijke transacties][ref1].

      3 Een verstrekking op grond van het tweede lid, eerste volzin, wordt niet vastgelegd in enig ander register.

      4 Behoudens de verstrekking op grond van artikel 15, tweede lid, wordt elke verstrekking uit een voorlopig register
      vastgelegd en gedurende ten minste drie jaren bewaard.

      5 Gegevens als bedoeld in het eerste lid worden uit het voorlopig register verwijderd en vernietigd indien zij niet
      langer noodzakelijk zijn voor het doel van het register dan wel na verloop van zes maanden na datum eerste opname.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel2
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '2'
  - number: 13c
    text: |-
      1 Voor zover dit noodzakelijk is met het oog op de bestrijding van de misdrijven, bedoeld in
      [artikel 1, onder l][ref1], kan bij algemene maatregel van bestuur, op voordracht van Onze Ministers en Onze
      Minister wie het mede aangaat, het bepaalde bij of krachtens deze wet betreffende de bijzondere politieregisters
      van toepassing worden verklaard op de daarbij aan te wijzen registers van een dienst van een publiekrechtelijk
      lichaam dat met de opsporing van strafbare feiten is belast.

      2 Een verklaring als bedoeld in het eerste lid kan slechts plaatsvinden indien op die dienst de
      beheersvoorschriften van overeenkomstige toepassing zijn welke bij of krachtens de [Politiewet 1993][ref2] zijn
      vastgesteld voor de eenheden, bedoeld in [artikel 13d][ref3].

      3 Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties treedt voor de toepassing van de bepalingen van deze
      wet op als beheerder van de bij die dienst aangelegde registers.

      4 In een register als bedoeld in het eerste lid worden geen gegevens opgenomen die zijn verkregen bij de
      uitoefening van een toezichthoudende bevoegdheid, tenzij in individuele gevallen op grond van een verzoek en de
      persoonlijke levenssfeer van de betrokkene daardoor niet onevenredig wordt geschaad. In dat geval wordt de herkomst
      van de gegevens vastgelegd.

      5 Onze Minister van Justitie wijst schriftelijk, op voordracht van de leiding van het desbetreffende
      publiekrechtelijke lichaam, de opsporingsambtenaren in dienst van het publiekrechtelijk lichaam aan die toegang
      hebben tot de registers van die dienst.

      6 Bij of krachtens een algemene maatregel van bestuur als bedoeld in het eerste lid worden de eisen vastgelegd
      waaraan de krachtens het vijfde lid aan te wijzen ambtenaren uit een oogpunt van beveiliging en opleiding moeten
      voldoen.

      7 Onverminderd [artikel 14, onder c][ref4], kunnen uit een register als bedoeld in het eerste lid aan andere
      opsporingsambtenaren gegevens worden verstrekt indien uit deze gegevens zelf het redelijk vermoeden voortvloeit dat
      een bepaalde persoon een strafbaar feit heeft begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006299
      [ref3]: https://wetten.overheid.nl/BWBR0004798#Artikel13d
      [ref4]: https://wetten.overheid.nl/BWBR0004798#Artikel14
