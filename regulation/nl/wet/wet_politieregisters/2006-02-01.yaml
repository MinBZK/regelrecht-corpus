preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ter bescherming van de persoonlijke levenssfeer met betrekking tot
    politieregisters uitvoering dient te worden gegeven aan artikel 10, tweede en derde lid, van de Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Ministers: Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties gezamenlijk;

      b. politietaak: de taak van de politie, omschreven in [artikel 2 van de Politiewet 1993][ref1];

      c. politieregister of register: een samenhangende verzameling van op verschillende personen betrekking hebbende
      persoonsgegevens

        - die langs geautomatiseerde weg wordt gevoerd of met het oog op een doeltreffende raadpleging van die gegevens
      systematisch is aangelegd, en
        - die is aangelegd ten dienste van de uitvoering van de politietaak;

      d. koppeling: het treffen van technische of organisatorische voorzieningen, waardoor verschillende verzamelingen
      van persoonsgegevens systematisch met elkaar kunnen worden vergeleken;

      e. antecedenten: bij algemene maatregel van bestuur te omschrijven persoonsgegevens betreffende de toepassing van
      het strafrecht of de strafvordering;

      f. beheerder met betrekking tot een register:

      1°. bij een regionaal politiekorps: de ingevolge de [Politiewet][ref2] als korpsbeheerder aangewezen burgemeester;

      2°. bij het Korps landelijke politiediensten: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;

      3°. bij de bijzondere ambtenaren van politie, bedoeld in [artikel 43 van de Politiewet 1993][ref3]: Onze Minister
      van Justitie;

      4°. bij de Koninklijke marechaussee: Onze Minister van Defensie;

      5°. gemeenschappelijk aan twee of meer politiekorpsen: de beheerder van het politiekorps die is belast met de
      feitelijke zorg voor het goed functioneren van dat register;

      6°. mede gemeenschappelijk aan de Koninklijke marechaussee: het door Onze Ministers in overeenstemming met Onze
      Minister van Defensie aan te wijzen gezag;

      g. reglement: het reglement, bedoeld in artikel 9;

      h. verstrekken van gegevens uit een politieregister: het bekend maken of ter beschikking stellen van
      persoonsgegevens, voor zover zulks geheel of grotendeels steunt op gegevens die in dat politieregister zijn
      opgenomen, of die door verwerking daarvan, al dan niet in verband met andere gegevens, zijn verkregen;

      i. persoonsgegevens: hetgeen daaronder wordt verstaan in de [Wet bescherming persoonsgegevens][ref4];

      j. tijdelijk register: een politieregister dat is aangelegd met het oog op de uitvoering van
      de politietaak in een bepaald geval of in het kader van een verkennend onderzoek als bedoeld in
      [artikel 126gg van het Wetboek van Strafvordering][ref5];

      k. het College bescherming persoonsgegevens of het College: het College als bedoeld in
      [artikel 51 van de Wet bescherming persoonsgegevens][ref6].

      l. register zware criminaliteit: een politieregister dat is aangelegd met het oog op de uitvoering van de
      politietaak, voor zover het betreft:

      1°. misdrijven als omschreven in [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref7], die in
      georganiseerd verband worden beraamd of gepleegd en gezien hun aard of de samenhang met andere misdrijven die in
      het georganiseerd verband worden beraamd of gepleegd, een ernstige inbreuk op de rechtsorde opleveren of

      2°. misdrijven waarop naar de wettelijke omschrijving een gevangenisstraf van acht jaar of meer is gesteld;

      3°. bij algemene maatregel van bestuur te omschrijven misdrijven als omschreven in
      [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref8], die gezien hun aard of de samenhang met andere
      door betrokkene begane misdrijven een ernstige inbreuk op de rechtsorde opleveren;

      m. voorlopig register: een politieregister dat is aangelegd met het oog op de uitvoering van de politietaak, voor
      zover het betreft de vaststelling of de geregistreerde in samenhang met andere gegevens opgenomen kan worden in een
      register zware criminaliteit;

      n. bijzondere politieregisters: registers als bedoeld in [§ 3a][ref9].

      2 De voordracht voor een krachtens het eerste lid, onder l, onderdeel 3°, vast te stellen algemene maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is
      overgelegd.


