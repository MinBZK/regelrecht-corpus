  - number: '16'
    text: |-
      1 Uit een politieregister worden op hun verzoek antecedenten verstrekt aan:

      a. Onze Minister van Justitie;

      b. Nederlandse rechterlijke ambtenaren, met rechtspraak belast, voor zover zij deze behoeven voor de uitoefening
      van hun taak;

      c. bij algemene maatregel van bestuur aan te wijzen reclasseringswerkers en ambtenaren van de kinderbescherming,
      voor zover zij deze behoeven voor de uitoefening van hun taak;

      d. korpschefs van een regionaal politiekorps, voor zover zij deze behoeven voor de uitoefening van bevoegdheden hun
      bij of krachtens de [Vreemdelingenwet 2000][ref1] en de [Jachtwet][ref2] (*Stb.* 1954, 523) toegekend.

      2 Uit een politieregister kunnen op hun verzoek antecedenten worden verstrekt aan benadeelden van strafbare feiten,
      daaronder begrepen de personen die in verband met die feiten in hun rechten zijn getreden of ingevolge enige
      wettelijke bepaling ter zake van die rechten een recht van verhaal hebben gekregen, voor zover zij deze behoeven om
      in rechte voor hun belangen op te kunnen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0002155
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel16
    references:
