  - number: '14'
    text: |-
      Uit een politieregister worden gegevens verstrekt aan:

      a. ambtenaren van politie, voor zover zij deze behoeven voor de vervulling van de politietaak en zij niet zijn
      aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van de politie en aan
      ambtenaren die krachtens artikel 13c, vijfde lid, zijn aangewezen, voor zover zij deze behoeven ter opsporing van
      strafbare feiten;

      b. krachtens [artikel 141, onder c, van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren van de
      Koninklijke marechaussee, voor zover zij deze behoeven voor de vervulling van de hun opgedragen politietaak;

      c. andere opsporingsambtenaren in dienst van een publiekrechtelijk lichaam, voor zover zij deze behoeven ter
      opsporing van strafbare feiten bij het onderzoek waarvan zij zijn betrokken;

      d. andere opsporingsambtenaren dan begrepen onder a, b en c, voor zover zij deze behoeven ter opsporing van
      strafbare feiten bij het onderzoek waarvan zij zijn betrokken, en mits daartoe in afzonderlijke gevallen door de
      officier van justitie of in het algemeen door Onze Minister van Justitie voorafgaand toestemming is verleend;

      e. bij of krachtens algemene maatregel van bestuur aan te wijzen andere ambtenaren dan die begrepen onder a en b,
      voor zover zij deze behoeven ter uitvoering van opdrachten voortvloeiende uit de signalering van personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0004798/2006-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '15'
    text: |-
      1 Uit een politieregister worden op hun verzoek gegevens verstrekt aan:

      a. leden van het openbaar ministerie, voor zover zij deze behoeven

      1. in verband met hun gezag en zeggenschap over de politie, dan wel over andere personen of instanties die met de
      opsporing van strafbare feiten zijn belast, of

      2. voor de uitvoering van andere bij of krachtens wet opgedragen taken;

      b. burgemeesters, voor zover zij deze behoeven

      1. in verband met hun gezag en zeggenschap over de politie,

      of

      2. in het kader van de handhaving van de openbare orde.

      c. korpschefs van een regionaal politiekorps en de commandant van de Koninklijke marechaussee, voor zover zij deze
      behoeven voor de uitoefening van bevoegdheden hun bij of krachtens de [Wet wapens en munitie][ref1] (*Stb.* 1997,
      674) of de [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref2] verleend;

      d. de Commandant van de Koninklijke marechaussee, voorzover hij deze behoeft voor de uitoefening van de
      bevoegdheid, bedoeld in [artikel 37s van de Luchtvaartwet][ref3];

      e. ambtenaren van het Bureau bevordering integriteitsbeoordelingen door het openbaar bestuur, bedoeld in
      [artikel 8 van de Wet bevordering integriteitsbeoordelingen door het openbaar bestuur][ref4], voorzover zij deze
      behoeven voor de uitoefening van hun wettelijk omschreven taak;

      f. Onze Minister van Justitie, voorzover hij deze behoeft voor de afgifte van de verklaringen omtrent het gedrag;

      e. Onze Minister van Justitie, voorzover hij deze behoeft voor de uitvoering van de
      [Wet documentatie vennootschappen][ref5].

      2 Voorts kunnen uit een politieregister gegevens worden verstrekt voor zover dit voortvloeit uit de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref6].

      3 Voorts kunnen uit een politieregister gegevens worden verstrekt voor zover dit voortvloeit uit wettelijke
      bepalingen met betrekking tot de samenwerking met en bijstand aan een internationaal strafgerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0008804
      [ref2]: https://wetten.overheid.nl/BWBR0008973
      [ref3]: https://wetten.overheid.nl/BWBR0002267#Artikel37s
      [ref4]: https://wetten.overheid.nl/BWBR0013798#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0015049
      [ref6]: https://wetten.overheid.nl/BWBR0013409
