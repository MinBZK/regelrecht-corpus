  - number: 30a
    text: |-
      Onze Ministers zenden binnen vier jaar na de inwerkingtreding van [paragraaf 3a van deze wet][ref1], en vervolgens
      telkens na vier jaar, aan de Staten-Generaal, gehoord het College bescherming persoonsgegevens, een verslag over de
      doeltreffendheid en effecten van deze paragraaf in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0004798#Paragraaf3a
