---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_politieregisters
regulatory_layer: WET
publication_date: '2008-04-08'
valid_from: '2002-08-08'
bwb_id: BWBR0004798
url: https://wetten.overheid.nl/BWBR0004798/2002-08-08
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat ter bescherming van de persoonlijke levenssfeer met betrekking tot
    politieregisters uitvoering dient te worden gegeven aan artikel 10, tweede en derde lid, van de Grondwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.a
    text: 'Onze Ministers: Onze Ministers van Justitie en van Binnenlandse Zaken en Koninkrijksrelaties gezamenlijk;'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.b
    text: |-
      politietaak: de taak van de politie, omschreven in [artikel 2 van de Politiewet 1993][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel2
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '2'
  - number: 1.1.c
    text: |-
      politieregister of register: een samenhangende verzameling van op verschillende personen betrekking hebbende
      persoonsgegevens - die langs geautomatiseerde weg wordt gevoerd of met het oog op een doeltreffende raadpleging van
      die gegevens systematisch is aangelegd, en
        - die is aangelegd ten dienste van de uitvoering van de politietaak;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.d
    text: |-
      koppeling: het treffen van technische of organisatorische voorzieningen, waardoor verschillende verzamelingen van
      persoonsgegevens systematisch met elkaar kunnen worden vergeleken;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.e
    text: |-
      antecedenten: bij algemene maatregel van bestuur te omschrijven persoonsgegevens betreffende de toepassing van het
      strafrecht of de strafvordering;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.f
    text: 'beheerder met betrekking tot een register:'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.f.1°
    text: |-
      bij een regionaal politiekorps: de ingevolge de [Politiewet][ref1] als korpsbeheerder aangewezen burgemeester;


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: 1.1.f.2°
    text: 'bij het Korps landelijke politiediensten: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.f.3°
    text: |-
      bij de bijzondere ambtenaren van politie, bedoeld in [artikel 43 van de Politiewet 1993][ref1]: Onze Minister van
      Justitie;


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel43
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '43'
  - number: 1.1.f.4°
    text: 'bij de Koninklijke marechaussee: Onze Minister van Defensie;'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.f.5°
    text: |-
      gemeenschappelijk aan twee of meer politiekorpsen: de beheerder van het politiekorps die is belast met de
      feitelijke zorg voor het goed functioneren van dat register;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.f.6°
    text: |-
      mede gemeenschappelijk aan de Koninklijke marechaussee: het door Onze Ministers in overeenstemming met Onze
      Minister van Defensie aan te wijzen gezag;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.g
    text: 'reglement: het reglement, bedoeld in artikel 9;'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.h
    text: |-
      verstrekken van gegevens uit een politieregister: het bekend maken of ter beschikking stellen van persoonsgegevens,
      voor zover zulks geheel of grotendeels steunt op gegevens die in dat politieregister zijn opgenomen, of die door
      verwerking daarvan, al dan niet in verband met andere gegevens, zijn verkregen;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.i
    text: |-
      persoonsgegevens: hetgeen daaronder wordt verstaan in de [Wet bescherming persoonsgegevens][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 1.1.j
    text: |-
      tijdelijk register: een politieregister dat is aangelegd met het oog op de uitvoering van de
      politietaak in een bepaald geval of in het kader van een verkennend onderzoek als bedoeld in
      [artikel 126gg van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel126gg
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 126gg
  - number: 1.1.j
    text: |-
      het College bescherming persoonsgegevens of het College: het College als bedoeld in
      [artikel 51 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '51'
  - number: 1.1.k
    text: |-
      register zware criminaliteit: een politieregister dat is aangelegd met het oog op de uitvoering van de politietaak,
      voor zover het betreft:
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.k.1°
    text: |-
      misdrijven als omschreven in [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref1], die in
      georganiseerd verband worden beraamd of gepleegd en gezien hun aard of de samenhang met andere misdrijven die in
      het georganiseerd verband worden beraamd of gepleegd, een ernstige inbreuk op de rechtsorde opleveren of


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 1.1.k.2°
    text: misdrijven waarop naar de wettelijke omschrijving een gevangenisstraf van acht jaar of meer is gesteld;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.k.3°
    text: |-
      bij algemene maatregel van bestuur te omschrijven misdrijven als omschreven in
      [artikel 67, eerste lid, van het Wetboek van Strafvordering][ref1], die gezien hun aard of de samenhang met andere
      door betrokkene begane misdrijven een ernstige inbreuk op de rechtsorde opleveren;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel67
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '67'
  - number: 1.1.l
    text: |-
      voorlopig register: een politieregister dat is aangelegd met het oog op de uitvoering van de politietaak, voor
      zover het betreft de vaststelling of de geregistreerde in samenhang met andere gegevens opgenomen kan worden in een
      register zware criminaliteit;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: 1.1.m
    text: 'bijzondere politieregisters: registers als bedoeld in § 3a.'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: '1.2'
    text: |-
      De voordracht voor een krachtens het eerste lid, onder k, onderdeel 3°, vast te stellen algemene maatregel van
      bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan de beide kamers der Staten-Generaal is
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel1
  - number: '2'
    text: |-
      Deze wet is niet van toepassing op verzamelingen van persoonsgegevens - die zijn
      aangelegd voor de uitvoering van de taken ten dienste van de justitie, bedoeld in
      [artikel 1, eerste lid, onder g, onderdelen 1 en 2, van de Politiewet 1993][ref1];
        - die naar hun aard voor persoonlijk gebruik zijn bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel1
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '1'
  - number: '3'
    text: Voordrachten tot een algemene maatregel van bestuur krachtens deze wet worden gedaan door Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel3
  - number: '4.1'
    text: |-
      Het aanleggen van een politieregister vindt slechts plaats voor een bepaald doel en voor zover dit noodzakelijk is
      voor een goede uitvoering van de politietaak.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel4
  - number: '4.2'
    text: |-
      Het bevat slechts persoonsgegevens die rechtmatig zijn verkregen en die noodzakelijk zijn voor het doel waarvoor
      het is aangelegd. Bij de in een bijzonder politieregister opgenomen persoonsgegevens wordt de herkomst van de
      gegevens vermeld en op welke wijze de gegevens zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel4
  - number: '4.3'
    text: |-
      De beheerder treft de nodige voorzieningen ter bevordering van de juistheid en de volledigheid van de opgenomen
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel4
  - number: '5.1'
    text: |-
      Registratie van personen wegens hun godsdienst of levensovertuiging, ras, politieke gezindheid, seksualiteit,
      intiem levensgedrag, of op grond van medische of psychologische kenmerken, vindt niet plaats.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel5
  - number: '5.2'
    text: |-
      Opneming in een register van persoonsgegevens die betrekking hebben op de in het eerste lid genoemde kenmerken,
      vindt slechts plaats in aanvulling op andere persoonsgegevens en voor zover dit voor het doel van het register
      onvermijdelijk is. Bij algemene maatregel van bestuur kunnen daaromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel5
  - number: '5.3'
    text: |-
      Over bepalingen in een reglement omtrent de opneming van persoonsgegevens bedoeld in het tweede lid, wordt het
      College bescherming persoonsgegevens vooraf gehoord.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel5
  - number: 5a.1
    text: |-
      Omtrent onverdachte personen worden in een politieregister, aangelegd voor de strafrechtelijke handhaving van de
      rechtsorde, slechts gegevens opgenomen:
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel5a
  - number: 5a.1.a
    text: overeenkomstig paragraaf 3a van deze wet,
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel5a
  - number: 5a.1.b
    text: |-
      in het register, bedoeld in [artikel 4 van de Wet melding ongebruikelijke transacties][ref1] dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel4
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '4'
  - number: 5a.1.c
    text: gedurende een termijn die niet langer is dan vier maanden.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel5a
  - number: 5a.2
    text: |-
      In het geval, bedoeld in het eerste lid, onder c, worden geen gegevens verstrekt overeenkomstig artikel 18, derde
      lid, van deze wet. De gegevens kunnen na verloop van de termijn slechts worden opgenomen en gebruikt voor:
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel5a
  - number: 5a.2.a
    text: de afhandeling van klachten,
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel5a
  - number: 5a.2.b
    text: de verantwoording van de verrichtingen naar aanleiding van de opgenomen gegevens, of
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel5a
  - number: 5a.2.c
    text: niet tot individuele natuurlijke personen herleidbare beleidsinformatie.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel5a
  - number: '6.1'
    text: |-
      Een politieregister kan slechts worden gekoppeld met een ander politieregister of met een andere verzameling van
      persoonsgegevens indien dit noodzakelijk is voor een goede uitvoering van de politietaak.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel6
  - number: '6.2'
    text: |-
      Een koppeling als bedoeld in het eerste lid, vindt slechts plaats overeenkomstig het voor het register geldende
      reglement. Over bepalingen in een reglement omtrent koppeling wordt het College bescherming persoonsgegevens vooraf
      gehoord.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel6
  - number: '6.3'
    text: |-
      Bij algemene maatregel van bestuur worden omtrent koppeling nadere regels gesteld ter bescherming van de
      persoonlijke levenssfeer.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel6
  - number: '6.4'
    text: |-
      Onze Minister van Justitie kan in bijzondere gevallen toestemming geven tot een koppeling, in afwijking van het
      bepaalde krachtens het tweede en derde lid, indien dit noodzakelijk is voor de opsporing van een misdrijf waardoor
      de rechtsorde ernstig is geschokt. Aan de toestemming kunnen beperkingen en voorschriften worden verbonden. Het
      College bescherming persoonsgegevens wordt hierover zo mogelijk vooraf gehoord. De toestemming wordt in ieder geval
      zo spoedig mogelijk aan het College bescherming persoonsgegevens medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel6
  - number: '7.1'
    text: |-
      De beheerder draagt zorg voor de juiste werking van het register. Aan hem worden alle inlichtingen verstrekt die
      hij voor dit doel nodig heeft.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel7
  - number: '7.2'
    text: |-
      Hij draagt zorg voor de nodige voorzieningen van technische en organisatorische aard ter beveiliging van het
      register tegen verlies of aantasting van de gegevens en tegen onbevoegde kennisneming, wijziging of verstrekking
      daarvan. Bij algemene maatregel van bestuur worden regels gesteld omtrent gevallen waarin het in het kader van
      technische werkzaamheden noodzakelijk is van gegevens kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel7
  - number: '8'
    text: |-
      [Artikel 49, eerste tot en met derde lid][ref1], en
      [artikel 50, eerste lid, van de Wet bescherming persoonsgegevens][ref2] zijn van overeenkomstige toepassing met
      dien verstande dat de beheerder voor de toepassing van deze artikelen wordt aangemerkt als de verantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel50
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '50'
  - number: '9.1'
    text: De beheerder van een politieregister stelt voor het register een reglement vast.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel9
  - number: '9.2'
    text: |-
      De vaststelling geschiedt na overleg met het gezag dat verantwoordelijk is voor de uitvoering van de politietaak
      ten dienste waarvan het register wordt aangelegd.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel9
  - number: '9.3'
    text: |-
      Het reglement wordt bekendgemaakt en voor een ieder ter inzage gelegd overeenkomstig regels bij algemene maatregel
      van bestuur te stellen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel9
  - number: '9.4'
    text: De beheerder zendt een exemplaar van het reglement aan het College bescherming persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel9
  - number: '9.5'
    text: Het register wordt niet in werking gesteld dan nadat aan het eerste tot en met vierde lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel9
  - number: '9.6'
    text: Het tweede tot en met vijfde lid is van overeenkomstige toepassing bij wijziging of intrekking van het reglement.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel9
  - number: '10.1'
    text: In het reglement moet de werking van het register zijn beschreven.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: '10.2'
    text: 'Het reglement bevat ten minste een duidelijke regeling van de volgende onderwerpen:'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: 10.2.a
    text: het doel van het register;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: 10.2.b
    text: de categorieën van personen over wie gegevens worden opgenomen, en de soorten van de over hen op te nemen gegevens;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: 10.2.c
    text: de gevallen waarin opgenomen gegevens worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: 10.2.d
    text: de vernietiging, zodra dit mogelijk is, van verwijderde gegevens;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: 10.2.e
    text: eventuele verbanden tussen het register en enige andere gegevensverzameling;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: 10.2.f
    text: |-
      de wijze waarop geregistreerde personen of hun wettelijke vertegenwoordigers kennisneming en verbetering van de
      over hen opgenomen gegevens kunnen verkrijgen;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: 10.2.g
    text: de bevoegdheid tot het invoeren en wijzigen van gegevens in, alsmede het verwijderen van gegevens uit het register;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: 10.2.h
    text: |-
      de aanwijzing van degene, onder verantwoordelijkheid van de beheerder belast met de zeggenschap over het register,
      en de omschrijving van de daaruit voortvoeiende bevoegdheden;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: 10.2.i
    text: de aanwijzing van degene of degenen, belast met de dagelijkse leiding van het register.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: '10.3'
    text: |-
      Indien het reglement een politieregister betreft als bedoeld in artikel 1, onder *f*, sub 4 of sub 5, wordt in het
      reglement tevens vermeld wie beheerder van dat register is.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: '10.4'
    text: |-
      Het reglement regelt de verstrekking van gegevens uit het register, daaronder begrepen de rechtstreekse toegang met
      het oog op raadpleging van persoonsgegevens, met inachtneming van het bij of krachtens de artikelen 14 tot en met
      19 en 27 bepaalde.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel10
  - number: '11'
    text: |-
      De beheerder en al degenen die verder bij de werking van het register zijn betrokken, zijn verplicht het reglement
      dat voor het register geldt, na te leven.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel11
  - number: '12.1'
    text: |-
      Degene die een model van een reglement heeft vastgesteld, kan het College bescherming persoonsgegevens verzoeken te
      verklaren dat het model naar haar oordeel in overeenstemming is met het bepaalde bij of krachtens deze wet. Indien
      de Kamer een zodanige verklaring afgeeft, wordt het model in de *Staatscourant* geplaatst.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel12
  - number: '12.2'
    text: |-
      Bij vaststelling van een reglement overeenkomstig een model ten aanzien waarvan is voldaan aan het gestelde in het
      eerste lid, zijn de artikelen 5, derde lid, 6, tweede lid, tweede volzin, 9, vierde lid, en 21, derde lid, tweede
      volzin, niet van toepassing. De beheerder deelt aan het College mede overeenkomstig welk model het reglement is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel12
  - number: '13.1'
    text: |-
      Opneming van persoonsgegevens in een tijdelijk register vindt slechts plaats met het oog op het doel waarvoor het
      register is aangelegd.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13
  - number: '13.2'
    text: |-
      Onverminderd artikel 13d, tweede lid, worden uit een tijdelijk register slechts gegevens verstrekt voor het doel
      waarvoor het register is aangelegd, tenzij verstrekking plaatsvindt ten behoeve van de opneming in een register
      zware criminaliteit of een voorlopig register.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13
  - number: '13.3'
    text: |-
      Op een tijdelijk register zijn de artikelen 6, tweede lid, en 9, eerste lid, niet van toepassing gedurende een bij
      algemene maatregel van bestuur te bepalen termijn.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13
  - number: '13.4'
    text: Na afloop van deze termijn is artikel 9, vijfde lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13
  - number: '13.5'
    text: |-
      De beheerder stelt binnen een week nadat is begonnen met het aanleggen van het register het College bescherming
      persoonsgegevens daarvan in kennis, tenzij dit inmiddels is vernietigd.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13
  - number: '13.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ter bescherming van de persoonlijke
      levenssfeer met betrekking tot tijdelijke registers.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13
  - number: 13a.1
    text: 'Opneming van persoonsgegevens in een register zware criminaliteit vindt slechts plaats omtrent:'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
  - number: 13a.1.a
    text: verdachten van misdrijven, waarvoor het register is aangelegd;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
  - number: 13a.1.b
    text: |-
      personen, ten aanzien van wie een redelijk vermoeden bestaat dat zij betrokken zijn bij het beramen of plegen van
      misdrijven als bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
  - number: 13a.1.c
    text: personen die in een bepaalde relatie staan tot degenen, bedoeld onder a en b, en
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
  - number: 13a.1.d
    text: |-
      ambtenaren van politie, van de Koninklijke marechaussee of van een publiekrechtelijk lichaam als bedoeld in artikel
      13c, voor zover dit van belang is voor het gebruik van de gegevens, bedoeld onder a tot en met c, alsmede voor de
      verantwoording van de verrichtingen naar aanleiding van de opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
  - number: 13a.2
    text: |-
      Uit een register zware criminaliteit worden omtrent personen als bedoeld in het eerste lid, onder c, slechts
      gegevens verstrekt overeenkomstig artikel 13b, tweede tot en met het vierde lid. Omtrent personen als bedoeld in
      het eerste lid, onder a en b, worden geen gegevens verstrekt krachtens artikel 18, derde lid.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
  - number: 13a.3
    text: |-
      Indien dit noodzakelijk is voor een goede uitvoering van de politietaak, kan de verstrekking ingevolge de artikelen
      14 en 15, eerste lid, onder b en c, uit een register zware criminaliteit worden geweigerd dan wel aan beperkende
      voorwaarden wat betreft het verdere gebruik worden onderworpen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
  - number: 13a.4
    text: |-
      Het derde lid is niet van toepassing op de verstrekking aan het meldpunt, bedoeld in
      [artikel 2 van de Wet melding ongebruikelijke transacties][ref1], die noodzakelijk is om te kunnen vaststellen of
      een persoon geregistreerd staat in het register zware criminaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel2
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '2'
  - number: 13a.5
    text: |-
      Bij algemene maatregel van bestuur kunnen personen of instanties met een publieke taak belast, indien een
      zwaarwegend algemeen belang dit vordert, worden aangewezen aan wie in bij die algemene maatregel van bestuur
      aan te geven gevallen, voor daarbij aan te geven doeleinden en te bepalen categorieën, onder daarbij te stellen
      voorwaarden gegevens uit een register zware criminaliteit kunnen worden verstrekt. Tevens kunnen nadere regels
      omtrent de verstrekking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
  - number: 13a.6
    text: |-
      Een verstrekking uit een register zware criminaliteit anders dan krachtens artikel 15, tweede lid, wordt
      vastgelegd, tenzij overeenkomstig het doel van het register is verstrekt aan personen die door de beheerder zijn
      aangewezen als vaste gebruikers.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
  - number: 13a.7
    text: |-
      Persoonsgegevens uit een register zware criminaliteit kunnen met het oog op een bijzondere opdracht voor de wijze
      van uitvoering van de politietaak voor het geval de betrokkene op enige plaats wordt waargenomen, in samenhang met
      gegevens over de inhoud van deze opdracht en voor zover noodzakelijk voor het uitvoeren van die opdracht, worden
      vastgelegd in een ander politieregister. Elke verstrekking voor dat doel wordt vastgelegd.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
  - number: 13a.8
    text: |-
      Gegevens als bedoeld in het eerste lid worden uit het register zware criminaliteit verwijderd en vernietigd indien
      zij niet langer noodzakelijk zijn voor het doel van het register dan wel na verloop van vijf jaar na datum van de
      laatste opname van gegevens die blijk geven van de noodzaak tot registratie van betrokkene met het oog op het doel
      van het register.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13a
  - number: 13b.1
    text: |-
      Opneming van persoonsgegevens in een voorlopig register vindt slechts plaats met het oog op het doel waarvoor het
      register is aangelegd.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13b
  - number: 13b.2
    text: |-
      Onverminderd artikel 13d, tweede lid, worden uit een voorlopig register slechts voor identificatie benodigde
      gegevens verstrekt voor het doel waarvoor het register is aangelegd. Voorts worden gegevens verstrekt ten
      behoeve van de opneming in een ander bijzonder politieregister of ten behoeve van het meldpunt, bedoeld in
      [artikel 2 van de Wet melding ongebruikelijke transacties][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel2
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '2'
  - number: 13b.3
    text: Een verstrekking op grond van het tweede lid, eerste volzin, wordt niet vastgelegd in enig ander register.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13b
  - number: 13b.4
    text: |-
      Behoudens de verstrekking op grond van artikel 15, tweede lid, wordt elke verstrekking uit een voorlopig register
      vastgelegd en gedurende ten minste drie jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13b
  - number: 13b.5
    text: |-
      Gegevens als bedoeld in het eerste lid worden uit het voorlopig register verwijderd en vernietigd indien zij niet
      langer noodzakelijk zijn voor het doel van het register dan wel na verloop van zes maanden na datum eerste opname.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13b
  - number: 13c.1
    text: |-
      Voor zover dit noodzakelijk is met het oog op de bestrijding van de misdrijven, bedoeld in artikel 1, onder k, kan
      bij algemene maatregel van bestuur, op voordracht van Onze Ministers en Onze Minister wie het mede aangaat, het
      bepaalde bij of krachtens deze wet betreffende de bijzondere politieregisters van toepassing worden verklaard op de
      daarbij aan te wijzen registers van een dienst van een publiekrechtelijk lichaam dat met de opsporing van strafbare
      feiten is belast.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13c
  - number: 13c.2
    text: |-
      Een verklaring als bedoeld in het eerste lid kan slechts plaatsvinden indien op die dienst de beheersvoorschriften
      van overeenkomstige toepassing zijn welke bij of krachtens de [Politiewet 1993][ref1] zijn vastgesteld voor de
      eenheden, bedoeld in artikel 13d.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: 13c.3
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties treedt voor de toepassing van de bepalingen van deze
      wet op als beheerder van de bij die dienst aangelegde registers.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13c
  - number: 13c.4
    text: |-
      In een register als bedoeld in het eerste lid worden geen gegevens opgenomen die zijn verkregen bij de uitoefening
      van een toezichthoudende bevoegdheid, tenzij in individuele gevallen op grond van een verzoek en de persoonlijke
      levenssfeer van de betrokkene daardoor niet onevenredig wordt geschaad. In dat geval wordt de herkomst van de
      gegevens vastgelegd.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13c
  - number: 13c.5
    text: |-
      Onze Minister van Justitie wijst schriftelijk, op voordracht van de leiding van het desbetreffende
      publiekrechtelijke lichaam, de opsporingsambtenaren in dienst van het publiekrechtelijk lichaam aan die toegang
      hebben tot de registers van die dienst.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13c
  - number: 13c.6
    text: |-
      Bij of krachtens een algemene maatregel van bestuur als bedoeld in het eerste lid worden de eisen vastgelegd
      waaraan de krachtens het vijfde lid aan te wijzen ambtenaren uit een oogpunt van beveiliging en opleiding moeten
      voldoen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13c
  - number: 13c.7
    text: |-
      Onverminderd artikel 14, onder c, kunnen uit een register als bedoeld in het eerste lid aan andere
      opsporingsambtenaren gegevens worden verstrekt indien uit deze gegevens zelf het redelijk vermoeden voortvloeit dat
      een bepaalde persoon een strafbaar feit heeft begaan.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13c
  - number: 13d.1
    text: |-
      Onverminderd artikel 13c worden registers als bedoeld in de artikelen 13a en 13b slechts aangelegd bij de daartoe
      krachtens de [Politiewet 1993][ref1] aangewezen organisatorische eenheden van de politie, alsmede bij de daartoe
      door Onze Minister van Defensie, in overeenstemming met Onze Ministers, aangewezen organisatorische eenheid van de
      Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: 13d.2
    text: 'Uit een tijdelijk register en uit een voorlopig register worden gegevens verstrekt:'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13d
  - number: 13d.2.a
    text: ingevolge de artikelen 7, 15, eerste lid, onder a, en tweede lid, 18, vierde en vijfde lid, en 27 of
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13d
  - number: 13d.2.b
    text: |-
      wanneer uit de gegevens zelf een redelijk vermoeden voortvloeit dat een bepaalde persoon een strafbaar feit heeft
      begaan.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13d
  - number: 13d.3
    text: |-
      Persoonsgegevens die worden vastgelegd voor de doeleinden, bedoeld in deze paragraaf, worden slechts vastgelegd en
      gebruikt overeenkomstig het bij of krachtens deze paragraaf bepaalde.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel13d
  - number: '14'
    text: 'Uit een politieregister worden gegevens verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel14
  - number: 14.a
    text: |-
      ambtenaren van politie, voor zover zij deze behoeven voor de vervulling van de politietaak en zij niet zijn
      aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van de politie en aan
      ambtenaren die krachtens artikel 13c, vijfde lid, zijn aangewezen, voor zover zij deze behoeven ter opsporing van
      strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel14
  - number: 14.b
    text: |-
      krachtens [artikel 141, onder c, van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren van de Koninklijke
      marechaussee, voor zover zij deze behoeven voor de vervulling van de hun opgedragen politietaak;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 14.c
    text: |-
      andere opsporingsambtenaren in dienst van een publiekrechtelijk lichaam, voor zover zij deze behoeven ter opsporing
      van strafbare feiten bij het onderzoek waarvan zij zijn betrokken;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel14
  - number: 14.d
    text: |-
      andere opsporingsambtenaren dan begrepen onder a, b en c, voor zover zij deze behoeven ter opsporing van strafbare
      feiten bij het onderzoek waarvan zij zijn betrokken, en mits daartoe in afzonderlijke gevallen door de officier van
      justitie of in het algemeen door Onze Minister van Justitie voorafgaand toestemming is verleend;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel14
  - number: 14.e
    text: |-
      bij of krachtens algemene maatregel van bestuur aan te wijzen andere ambtenaren dan die begrepen onder a en b, voor
      zover zij deze behoeven ter uitvoering van opdrachten voortvloeiende uit de signalering van personen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel14
  - number: '15.1'
    text: 'Uit een politieregister worden op hun verzoek gegevens verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel15
  - number: 15.1.a
    text: leden van het openbaar ministerie, voor zover zij deze behoeven
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel15
  - number: 15.1.a.1
    text: |-
      in verband met hun gezag en zeggenschap over de politie, dan wel over andere personen of instanties die met de
      opsporing van strafbare feiten zijn belast, of
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel15
  - number: 15.1.a.2
    text: voor de uitvoering van andere bij of krachtens wet opgedragen taken;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel15
  - number: 15.1.b
    text: burgemeesters, voor zover zij deze behoeven
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel15
  - number: 15.1.b.1
    text: voor de afgifte omtrent de verklaringen omtrent het gedrag,
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel15
  - number: 15.1.b.2
    text: in verband met hun gezag en zeggenschap over de politie, of
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel15
  - number: 15.1.b.3
    text: in het kader van de handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel15
  - number: 15.1.c
    text: |-
      korpschefs van een regionaal politiekorps en de commandant van de Koninklijke marechaussee, voor zover zij deze
      behoeven voor de uitoefening van bevoegdheden hun bij of krachtens de [Wet wapens en munitie][ref1] (*Stb.* 1997,
      674) of de [Wet particuliere beveiligingsorganisaties en recherchebureaus][ref2] verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0008804
      [ref2]: https://wetten.overheid.nl/BWBR0008973
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008804
      - id: ref2
        bwb_id: BWBR0008973
  - number: '15.2'
    text: |-
      Voorts kunnen uit een politieregister gegevens worden verstrekt voor zover dit voortvloeit uit de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013409
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0013409
  - number: '15.3'
    text: |-
      Voorts kunnen uit een politieregister gegevens worden verstrekt voor zover dit voortvloeit uit wettelijke
      bepalingen met betrekking tot de samenwerking met en bijstand aan een internationaal strafgerecht.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel15
  - number: '16.1'
    text: 'Uit een politieregister worden op hun verzoek antecedenten verstrekt aan:'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel16
  - number: 16.1.a
    text: Onze Minister van Justitie;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel16
  - number: 16.1.b
    text: |-
      Nederlandse rechterlijke ambtenaren, met rechtspraak belast, voor zover zij deze behoeven voor de uitoefening van
      hun taak;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel16
  - number: 16.1.c
    text: |-
      bij algemene maatregel van bestuur aan te wijzen reclasseringswerkers en ambtenaren van de kinderbescherming, voor
      zover zij deze behoeven voor de uitoefening van hun taak;
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel16
  - number: 16.1.d
    text: |-
      korpschefs van een regionaal politiekorps, voor zover zij deze behoeven voor de uitoefening van bevoegdheden hun
      bij of krachtens de [Vreemdelingenwet 2000][ref1] en de [Jachtwet][ref2] (*Stb.* 1954, 523) toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0002155
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0002155
  - number: '16.2'
    text: |-
      Uit een politieregister kunnen op hun verzoek antecedenten worden verstrekt aan benadeelden van strafbare feiten,
      daaronder begrepen de personen die in verband met die feiten in hun rechten zijn getreden of ingevolge enige
      wettelijke bepaling ter zake van die rechten een recht van verhaal hebben gekregen, voor zover zij deze behoeven om
      in rechte voor hun belangen op te kunnen komen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel16
  - number: '17'
    text: |-
      Bij algemene maatregel van bestuur kan ten aanzien van bepaalde categorieën van gegevens de verplichting ingevolge
      de artikelen 14, 15, eerste lid, en 16, eerste lid, om deze gegevens te verstrekken, worden beperkt. Daarbij kan
      verder de bevoegdheid worden beperkt om ingevolge deze bepalingen uit een politieregister:
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel17
  - number: 17.a
    text: bepaalde gegevens te verstrekken of
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel17
  - number: 17.b
    text: aan bepaalde personen gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel17
  - number: '18.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de verstrekking van gegevens uit een
      politieregister - hetzij door tussenkomst van Interpol, hetzij anderszins - aan politie-autoriteiten in andere
      landen, alsmede omtrent de daarbij te stellen voorwaarden aan het gebruik daarvan door die politie-autoriteiten.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel18
  - number: '18.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de verstrekking van gegevens uit het register
      van het meldpunt bedoeld in [artikel 2 van de Wet melding ongebruikelijke transacties][ref1] aan van overheidswege
      aangewezen niet-politiële instanties in het buitenland die een vergelijkbare taak hebben als het meldpunt, alsmede
      omtrent de daarbij te stellen voorwaarden aan het gebruik daarvan door die autoriteiten.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel2
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '2'
  - number: '18.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen personen of instanties met een publieke taak belast, indien het openbaar
      belang dit vordert, worden aangewezen aan wie in bij die algemene maatregel aan te geven gevallen gegevens uit een
      politieregister mogen worden of dienen te worden verstrekt. Daarbij kunnen nadere regels omtrent de verstrekking
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel18
  - number: '18.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent het verstrekken van gegevens uit een
      politieregister ten behoeve van wetenschappelijk onderzoek en statistiek, met dien verstande dat de resultaten
      daarvan geen persoonsgegevens mogen bevatten.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel18
  - number: '18.5'
    text: |-
      Onze Minister van Justitie of Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan in bijzondere
      gevallen toestemming of opdracht geven tot het verstrekken van daartoe omschreven gegevens uit een politieregister.
      Hij doet van de desbetreffende beschikking mededeling aan het College bescherming persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel18
  - number: '19'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de voor verzoeken tot verstrekking
      van gegevens uit een politieregister en de verstrekking daarvan in acht te nemen procedure en de vastlegging van
      verstrekkingen uit het register.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel19
  - number: '20.1'
    text: |-
      De beheerder deelt een ieder op diens verzoek binnen vier weken mede of en zo ja welke deze persoon betreffende
      persoonsgegevens in een register zijn opgenomen. Hij verstrekt daarbij tevens desgevraagd inlichtingen over
      de herkomst van de gegevens en over degenen aan wie deze zijn verstrekt. Hij doet daarbij geen mededelingen in
      schriftelijke vorm.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel20
  - number: '20.2'
    text: De beheerder draagt zorg voor een deugdelijke vaststelling van de identiteit van de verzoeker.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel20
  - number: '20.3'
    text: |-
      Het verzoek, bedoeld in het eerste lid, wordt ten aanzien van minderjarigen die de leeftijd van zestien jaren nog
      niet hebben bereikt, en ten aanzien van onder curatele gestelden gedaan door hun wettelijke vertegenwoordigers. De
      betrokken mededeling geschiedt eveneens aan de wettelijke vertegenwoordigers.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel20
  - number: '21.1'
    text: |-
      Een mededeling als bedoeld in artikel 20, eerste lid, blijft achterwege voor zover dit noodzakelijk is voor de
      goede uitvoering van de politietaak dan wel indien gewichtige belangen van derden daartoe noodzaken.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel21
  - number: '21.2'
    text: |-
      Het eerste lid is niet van toepassing op antecedenten of op persoonsgegevens die op verzoek van de geregistreerde
      zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel21
  - number: '21.3'
    text: |-
      In het reglement wordt bepaald in hoeverre toepassing wordt gegeven aan het bepaalde bij het eerste lid. Omtrent
      dergelijke bepalingen wordt het College bescherming persoonsgegevens vooraf gehoord.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel21
  - number: '22.1'
    text: |-
      Degene aan wie overeenkomstig artikel 20 mededeling is gedaan van hem betreffende persoonsgegevens, kan de
      beheerder schriftelijk verzoeken deze te verbeteren, aan te vullen, te verwijderen of af te schermen, indien deze
      feitelijk onjuist, voor het doel van het register onvolledig of niet ter zake dienend zijn dan wel in strijd met
      een wettelijk voorschrift in het register voorkomen. Het verzoek behelst de aan te brengen wijzigingen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel22
  - number: '22.2'
    text: |-
      De beheerder bericht de verzoeker binnen vier weken na ontvangst van het verzoek schriftelijk of dan wel
      in hoeverre hij daaraan voldoet. [Artikel 37 Wet bescherming persoonsgegevens][ref1] is van overeenkomstige
      toepassing. Een weigering is met redenen omkleed.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel37
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '37'
  - number: '22.3'
    text: |-
      De beheerder draagt zorg dat een beslissing tot verbetering, aanvulling, verwijdering of afscherming zo spoedig
      mogelijk wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel22
  - number: '23.1'
    text: |-
      Indien de beheerder niet aan een verzoek als bedoeld in de artikelen 20 of 22 voldoet, kan de betrokkene zich tot
      de arrondissementsrechtbank wenden met het schriftelijk verzoek, de beheerder te bevelen alsnog aan dat verzoek
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel23
  - number: '23.2'
    text: |-
      Het verzoekschrift moet worden ingediend binnen vier weken na ontvangst van het antwoord van de beheerder. Indien
      de beheerder niet binnen de gestelde termijn heeft geantwoord, moet het verzoekschrift worden ingediend binnen vier
      weken na afloop van die termijn.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel23
  - number: '23.3'
    text: |-
      De betrokkene kan zich ook binnen de in het tweede lid gestelde termijn tot het College bescherming
      persoonsgegevens wenden met het verzoek te bemiddelen of te adviseren in zijn geschil met de beheerder. In dat
      geval kan het verzoekschrift als bedoeld in het eerste lid, nog worden ingediend nadat de betrokkene van het
      College bescherming persoonsgegevens bericht heeft ontvangen dat zij de behandeling van de zaak heeft gestaakt,
      doch uiterlijk tot vier weken na dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel23
  - number: '23.4'
    text: Over een verzoekschrift kan de rechtbank het advies van het College bescherming persoonsgegevens inwinnen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel23
  - number: '23.5'
    text: De rechtbank wijst het verzoek toe, voor zover zij dit gegrond oordeelt.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel23
  - number: '23.6'
    text: |-
      De [twaalfde titel van het Eerste Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend) met uitzondering
      van [artikel 429d, derde lid][ref1], treedt voor procedures als bedoeld in het eerste tot en met het vijfde lid, in
      werking op hetzelfde tijdstip als dit artikel. [Artikel 345 van dat wetboek][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel429d
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel345
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 429d
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '345'
  - number: '23.7'
    text: |-
      De [derde afdeling van de vijfde titel van het Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering]
      (onbekend) is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel23
  - number: '23.8'
    text: De griffier zendt afschrift van de uitspraak aan het College bescherming persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel23
  - number: '24'
    text: |-
      De beheerder die in een register persoonsgegevens heeft verbeterd, aangevuld of daaruit heeft verwijderd naar
      aanleiding van een verzoek van een belanghebbende ingevolge artikel 22, een bevel van de rechter ingevolge artikel
      23 of een daartoe strekkende aanbeveling van het College bescherming persoonsgegevens, is verplicht om aan hen aan
      wie hij naar zijn weten in het jaar voorafgaand aan het verzoek en in de sinds dat verzoek verstreken periode de
      betrokken gegevens heeft verstrekt, mededeling te doen van deze wijziging.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel24
  - number: '25.1'
    text: |-
      Een verzoek ingevolge artikel 20, is slechts ontvankelijk na betaling van een kostenvergoeding. Het bedrag van de
      vergoeding en de wijze van betaling worden geregeld bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel25
  - number: '25.2'
    text: |-
      De vergoeding wordt teruggegeven wanneer het verzoek leidt tot verbetering, aanvulling of verwijdering van de
      persoonsgegevens van de betrokkene, of wanneer het verzoek moet worden geweigerd ingevolge artikel 21, eerste lid.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel25
  - number: '26.1'
    text: |-
      Het College bescherming persoonsgegevens ziet toe op de werking van de politieregisters overeenkomstig het bij en
      krachtens deze wet bepaalde en in het belang van de bescherming van de persoonlijke levenssfeer in het algemeen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel26
  - number: '26.2'
    text: |-
      Voor de behandeling en afdoening van de aangelegenheden voortvloeiend uit het eerste lid, wordt bij het College een
      meervoudige afdeling ingesteld.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel26
  - number: '26.3'
    text: |-
      Met het toezicht op de naleving van het bij enig wettelijk voorschriftten aanzien van de werking van
      politieregisters bepaalde, zijn belast de leden, plaatsvervangende leden en buitengewone leden van het College en
      de ambtenaren van het secretariaat van het College.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel26
  - number: '27'
    text: |-
      De [artikelen 51, tweede lid][ref1], en [60 tot en met 64 van de Wet bescherming persoonsgegevens][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel60
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '60'
  - number: '30.1'
    text: |-
      Een ieder die krachtens deze wet de beschikking krijgt over gegevens met betrekking tot een derde, is verplicht tot
      geheimhouding daarvan, behoudens voor zover een bij of krachtens deze wet gegeven voorschrift mededelingen toelaat,
      dan wel de uitvoering van de taak met het oog waarop de gegevens zijn verstrekt tot het ter kennis brengen daarvan
      noodzaakt.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel30
  - number: '30.2'
    text: |-
      [Artikel 272, tweede lid, van het Wetboek van Strafrecht][ref1] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel272
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '272'
  - number: 30a
    text: |-
      Onze Ministers zenden binnen vier jaar na de inwerkingtreding van paragraaf 3a van deze wet, en vervolgens telkens
      na vier jaar, aan de Staten-Generaal, gehoord de Registratiekamer, een verslag over de doeltreffendheid en effecten
      van deze paragraaf in de praktijk.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel30a
  - number: '31.1'
    text: |-
      De artikelen 1 tot en met 3 en 26 tot en met 30 van deze wet treden in werking met ingang van de dag na de datum
      van uitgifte van het Staatsblad waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel31
  - number: '31.2'
    text: De overige artikelen van deze wet treden zes maanden later in werking.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel31
  - number: '32.1'
    text: |-
      Het reglement voor een politieregister bestaande op het in artikel 31, tweede lid, bedoelde tijdstip, wordt binnen
      zes maanden na dat tijdstip vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel32
  - number: '32.2'
    text: |-
      Binnen dezelfde termijn wordt de inhoud van het register met het reglement en het bij of krachtens deze wet
      bepaalde in overeenstemming gebracht. Onze Ministers, het College bescherming persoonsgegevens gehoord, kunnen ten
      aanzien van het register deze termijn eenmaal met dezelfde termijn verlengen.
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel32
  - number: '33'
    text: 'Deze wet kan worden aangehaald als: Wet politieregisters.'
    url: https://wetten.overheid.nl/BWBR0004798/2002-08-08#Artikel33
