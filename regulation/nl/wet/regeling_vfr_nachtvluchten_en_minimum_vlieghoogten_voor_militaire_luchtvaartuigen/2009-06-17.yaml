  - number: '13'
    text: |-
      De besluiten van de Chef van de Marinestaf en van de Chef van de Luchtmachtstaf van 1 juli 1987, nr.
      094.385/070.039 en van 27 september 1988, nr. 099.295/070.039 worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel13
  - number: '14'
    text: Deze regeling treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel14
  - number: '15'
    text: |-
      Deze regeling wordt aangehaald als: Regeling VFR-nachtvluchten en minimum vlieghoogten voor militaire
      luchtvaartuigen. Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel15
