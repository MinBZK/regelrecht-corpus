preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Verkeer en Waterstaat;

    Gelet op de artikelen 44, 45 en 56 van het Luchtverkeersreglement;
  url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Aan gezagvoerders van militaire luchtvaartuigen behorend tot de Nederlandse strijdkrachten en aan door de
      Staatssecretaris van Defensie aan te wijzen luchtvaartuigen behorend tot bondgenootschappelijke strijdkrachten
      wordt, onverminderd het bepaalde in de [artikelen 2][ref1] en [12][ref2], vrijstelling verleend van het gestelde
      in [artikel 44, eerste lid, onder a, van het Luchtverkeersreglement][ref3] mits de volgende voorschriften en
      bepalingen in acht worden genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007141#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0005775#Artikel44
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007141
        artikel: '12'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005775
        artikel: '44'
  - number: 1.a
    text: |-
      De vluchten worden uitgevoerd conform de regels die gelden voor een gecontroleerde vlucht, met dien verstande dat
      voor vluchten met hefschroefvliegtuigen waarbij gebruik wordt gemaakt van nachtzichtapparatuur door de Chef van het
      militaire luchtverkeersleidingscentrum Nieuw Milligen een afwijking van deze voorwaarde kan worden toegestaan in
      een gebied dat horizontaal en verticaal is begrensd.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel1
  - number: 1.b
    text: |-
      Tijdens de vlucht worden gebieden met aaneengesloten bebouwing, industrie- en havengebieden daaronder begrepen, dan
      wel mensenverzamelingen, zoveel mogelijk vermeden.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel1
  - number: 1.c
    text: |-
      De vluchten worden uitgevoerd met inachtneming van de in de [artikelen 2][ref1] en [12][ref2] vermelde
      zichtweersomstandigheden en minimum vlieghoogten.


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007141#Artikel12
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007141
        artikel: '12'
        paragraaf: '2'
  - number: '2.1'
    text: |-
      De in [artikel 1][ref1] bedoelde vrijstelling wordt verleend indien de volgende zichtweersomstandigheden in acht
      worden genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel1
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '1'
        paragraaf: '1'
  - number: 2.1.a
    text: Het vliegzicht is gelijk aan of groter dan 5 kilometer.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.1.b
    text: De horizontale afstand van het luchtvaartuig tot de wolken is gelijk aan of groter dan 600 meter.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.1.c
    text: De verticale afstand van het luchtvaartuig tot de wolken is gelijk aan of groter dan 150 meter (500 voet).
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid wordt voor vluchten met luchtvaartuigen ingedeeld bij de Koninklijke Luchtmacht,
      in ten behoeve van luchtverkenning vastgestelde routes, aan gezagvoerders de in [artikel 1][ref1] genoemde
      vrijstelling verleend, indien de volgende zichtweersomstandigheden in acht worden genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel1
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '1'
        paragraaf: '1'
  - number: 2.2.a
    text: Het vliegzicht is gelijk aan of groter dan 5 kilometer.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.2.b
    text: De wolkenbasis bevindt zich op ten minste 450 meter (1500 voet).
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid wordt voor vluchten met militaire hefschroefvliegtuigen aan gezagvoerders de
      in [artikel 1][ref1] genoemde vrijstelling verleend indien de volgende zichtweersomstandigheden in acht worden
      genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel1
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '1'
        paragraaf: '1'
  - number: 2.3.a
    text: 'Binnen plaatselijke luchtverkeersleidingsgebieden van militaire luchtvaartterreinen:'
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.3.a.1º
    text: |-
      Het vliegzicht is gelijk aan of groter dan 3 kilometer; voor vluchten die zich beperken tot het
      luchtverkeerscircuit, is het vliegzicht gelijk aan of groter dan 2 kilometer.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.3.a.2º
    text: |-
      De wolkenbasis bevindt zich op ten minste 300 meter (1000 voet) respectievelijk voor vluchten in het
      luchtverkeerscircuit op ten minste 250 meter (800 voet).
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.3.a.3º
    text: Het luchtvaartuig is vrij van wolken met zicht op grond of water.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.3.b
    text: 'Buiten plaatselijke luchtverkeersleidingsgebieden:'
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.3.b.1º
    text: |-
      Het vliegzicht is gelijk aan of groter dan 5 kilometer voor vluchten met hefschroefvliegtuigen die niet voldoen aan
      de eisen voor het uitoefenen van IFR-vluchten; voor vluchten met militaire hefschroefvliegtuigen die voldoen aan de
      eisen voor het uitoefenen van IFR-vluchten is het vliegzicht minimaal 3 kilometer;
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.3.b.2º
    text: |-
      De wolkenbasis bevindt zich op ten minste 300 meter (1000 voet); voor patiëntenvervoer van en naar de
      Waddeneilanden, alsmede voor de hiervoor benodigde oefenvluchten, met militaire hefschroefvliegtuigen die voldoen
      aan de eisen voor het uitoefenen van IFR-vluchten, bevindt de wolkenbasis zich op ten minste 210 meter (700 voet).
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.3.b.3º
    text: Het luchtvaartuig is vrij van wolken met zicht op grond of water.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.3.c
    text: |-
      In afwijking van onderdeel a en b geldt ten behoeve van training voor en daadwerkelijke inzet bij search and rescue
      of onderzeebootbestrijding boven zee het volgende:
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.3.c.1°
    text: |-
      Het vliegzicht is gelijk aan of groter dan 2 kilometer; voor vluchten vanaf schepen is het vliegzicht gelijk aan of
      groter dan 1 kilometer;
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.3.c.2°
    text: |-
      De wolkenbasis bevindt zich op ten minste 150 meter (500 voet); voor vluchten vanaf schepen bevindt de wolkenbasis
      zich op ten minste 60 meter (200 voet).
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: '2.4'
    text: |-
      Voor vluchten met militaire hefschroefvliegtuigen waarbij gebruik wordt gemaakt van nachtzichtapparatuur wordt aan
      gezagvoerders de in [artikel 1][ref1] genoemde vrijstelling verleend indien het vliegzicht bij dergelijke vluchten
      gelijk is aan of groter is dan 1,5 kilometer met zicht op grond of water.


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel1
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
