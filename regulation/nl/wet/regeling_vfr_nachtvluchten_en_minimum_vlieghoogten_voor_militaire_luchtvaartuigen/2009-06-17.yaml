  - number: '5.2'
    text: 'Tijdens de in het eerste lid bedoelde vluchten nemen de gezagvoerders de volgende nadere voorwaarden in acht:'
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel5
  - number: 5.2.a
    text: |-
      De minimum vlieghoogte is ten minste 30 meter (100 voet) boven hindernissen of zoveel lager als door het doel van
      de vlucht is vereist.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel5
  - number: 5.2.b
    text: Aaneengesloten bebouwing, ziekenhuizen, sanatoria en dergelijke worden vermeden.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel5
  - number: 5.2.c
    text: |-
      De gezagvoerder die meer dan 926 meter (½ NM) van de route is afgeraakt of buiten het gebied is gekomen, begeeft
      zich eerst naar de voor hem geldende minimum vlieghoogte alvorens de vlucht op de route of binnen het gebied mag
      worden voortgezet.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel5
  - number: 5.2.d
    text: De gebieden EHR-3 (Oldebroek) en EHR-9 (Harskamp) worden vermeden behoudens in geval van toestemming.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel5
  - number: 5.2.e
    text: |-
      Voor vluchten binnen een van de in het eerste lid, onder a tot en met h genoemde gebieden is vooraf toestemming
      vereist van de Commandant Groep Helicopters van de Koninklijke Luchtmacht.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel5
  - number: 5.2.f
    text: |-
      Voor vluchten binnen een van de in het eerste lid, onder i en j, vermelde gebieden en de onder 1 genoemde route is
      vooraf toestemming vereist van de Commandant Koninklijke Militaire School Luchtmacht/Vliegbasis Woensdrecht.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel5
  - number: 5.2.g
    text: |-
      Voor vluchten binnen het gebied genoemd in het eerste lid, onder k is vooraf toestemming vereist van de Commandant
      van de Groep Helicopters van de Koninklijke Marine.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel5
  - number: 5.2.h
    text: |-
      Voor vluchten binnen het gebied genoemd in het eerste lid, onder e, is tevens vooraf een klaring van de
      luchtverkeersleidingdienst van de Vliegbasis Eindhoven vereist.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel5
  - number: '5.3'
    text: |-
      Aan gezagvoerders van hefschroefvliegtuigen of voor opleidingsdoeleinden bestemde propellervliegtuigen van de
      bondgenootschappelijke strijdkrachten wordt per oefening, uitgezonderd voor gezamenlijke oefeningen met Nederlandse
      eenheden, door de Staatssecretaris van Defensie toestemming verleend onder nader te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel5
  - number: '6'
    text: |-
      Gezagvoerders van militaire luchtvaartuigen wordt vrijstelling verleend van het verbod bedoeld in
      [artikel 45, eerste lid van het LVR][ref1] en [artikel 3][ref2] van deze regeling onder de voorwaarde dat de
      voorschriften, bedoeld in de[ artikelen 7 tot en met 12][ref3], worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0007141#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007141#Artikel7
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '45'
      - id: ref2
        bwb_id: BWBR0007141
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007141
        artikel: '7'
        paragraaf: '2'
  - number: '7'
    text: |-
      De in [artikel 6][ref1] bedoelde vrijstelling geldt boven zee, hieronder niet begrepen het Waddenzee-gebied, met
      inachtneming van een minimum vlieghoogte van 30 meter (100 voet), of zoveel lager als door het doel van de vlucht
      wordt vereist, en de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel6
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '6'
        paragraaf: '2'
  - number: 7.a
    text: De vlucht wordt uitgevoerd ten minste 1852 meter (1 NM) uit de kustlijn.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel7
  - number: 7.b
    text: Hindernissen worden vermeden.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel7
  - number: '8'
    text: |-
      De in [artikel 6][ref1] bedoelde vrijstelling wordt aan gezagvoerders van militaire hefschroefvliegtuigen behorende
      tot of in gebruik bij de Nederlandse of bondgenootschappelijke strijdkrachten verleend voor het uitvoeren van een
      VFR-vlucht waarbij de volgende minimum vlieghoogten in acht worden genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel6
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '6'
        paragraaf: '2'
  - number: 8.a
    text: |-
      Boven gebieden met aaneengesloten bebouwing, industrie- en havengebieden daaronder begrepen dan wel boven
      mensenverzamelingen: tenminste 210 meter (700 voet) boven de hoogste hindernis gelegen binnen een afstand van 600
      meter van het luchtvaartuig, voor zover het doel van de vlucht dit vereist.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel8
  - number: 8.b
    text: 'Elders dan onder a aangegeven: ten minste 50 meter (150 voet) boven grond of water.'
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel8
  - number: '9.1'
    text: |-
      De in [artikel 6][ref1] bedoelde vrijstelling geldt voor gezagvoerders van militaire straalvliegtuigen behorende
      tot de Nederlandse en bondgenootschappelijke strijdkrachten als zij oefenen in het kader van operaties met
      niet vliegende eenheden en binnen de grenzen van het oefengebied VFR-vluchten uitvoeren en daarbij de volgende
      voorwaarden in acht nemen:


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel6
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '6'
        paragraaf: '2'
  - number: 9.1.a
    text: |-
      Slechts indien het doel van de vlucht daartoe noodzaakt, is afwijken van de minimum vlieghoogte toegestaan tot een
      minimum vlieghoogte van 75 meter (250 voet) boven hindernissen.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel9
  - number: 9.1.b
    text: Met betrekking tot het vliegzicht en de wolkenbasis gelden de eisen voor VFR-vluchten.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel9
  - number: 9.1.c
    text: |-
      Voor vluchten binnen een plaatselijk luchtverkeersleidingsgebied, een bijzonder luchtverkeersgebied of in de
      omgeving van een burgerluchtvaartterrein is vooraf toestemming vereist van het ter plaatse op basis van het
      [Luchtverkeersreglement][ref1] bevoegde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005775
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005775
  - number: 9.1.d
    text: |-
      Voor vluchten binnen een van de in [artikel 5, eerste lid, onder a tot en met h][ref1] genoemde gebieden is vooraf
      toestemming vereist van de Commandant Groep Helikopters van de Koninklijke Luchtmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel5
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '5'
        paragraaf: '2'
  - number: 9.1.e
    text: |-
      Voor vluchten binnen een van de in [artikel 5, eerste lid, onder i en j][ref1], genoemde gebieden en de onder 1
      genoemde route is vooraf toestemming vereist van de Commandant Koninklijke Militaire School Luchtmacht/Vliegbasis
      Woensdrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel5
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '5'
        paragraaf: '2'
  - number: 9.1.f
    text: |-
      Voor vluchten binnen het gebied genoemd in [artikel 5, eerste lid, onder][ref1] k is vooraf toestemming vereist van
      de Commandant van de Groep Helikopters van de Koninklijke Marine.


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel5
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '5'
        paragraaf: '2'
  - number: 9.1.g
    text: Aaneengesloten bebouwing, ziekenhuizen, sanatoria en dergelijke worden vermeden.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel9
  - number: '9.2'
    text: |-
      Aan gezagvoerders van straalvliegtuigen van bondgenootschappelijke strijdkrachten wordt per oefening door
      de Staatssecretaris van Defensie de in het eerste lid bedoelde vrijstelling verleend onder nader te stellen
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel9
  - number: '10'
    text: |-
      De in [artikel 6][ref1] bedoelde vrijstelling wordt aan gezagvoerders van voor opleidingsdoeleinden bestemde
      propellervliegtuigen behorende tot of gebruikt voor de Nederlandse strijdkrachten verleend voor het uitvoeren van
      een VFR-vlucht boven de in [artikel 8, onder b][ref2], bedoelde gebieden waarbij een minimum vlieghoogte van 150
      meter (500 voet) boven grond of water in acht wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007141#Artikel8
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007141
        artikel: '8'
        paragraaf: '2'
  - number: '11.1'
    text: |-
      In afwijking van [artikel 8 onder b][ref1], en [artikel 10][ref2] gelden voor gezagvoerders van militaire
      hefschroefvliegtuigen behorende tot of in gebruik bij de Nederlandse en bondgenootschappelijke strijdkrachten,
      respectievelijk voor gezagvoerders van voor opleidingsdoeleinden bestemde propellervliegtuigen behorende tot of
      gebruikt voor de Nederlandse strijdkrachten, indien zij oefenen in het kader van operaties met niet-vliegende
      eenheden en binnen de grenzen van het oefengebied VFR-vluchten uitvoeren de volgende regels:


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007141#Artikel10
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007141
        artikel: '10'
        paragraaf: '2'
  - number: 11.1.a
    text: |-
      De minimum vlieghoogte is 30 meter (100 voet) boven hindernissen of zoveel lager als voor het doel van de vlucht
      noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel11
  - number: 11.1.b
    text: Aaneengesloten bebouwing, ziekenhuizen, sanatoria en dergelijke moeten worden vermeden.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel11
  - number: 11.1.c
    text: |-
      Voor vluchten binnen een plaatselijk luchtverkeersleidingsgebied, een bijzonder luchtverkeersgebied of in de
      omgeving van een burgerluchtvaartterrein is vooraf toestemming vereist van het ter plaatse op basis van het
      [Luchtverkeersreglement][ref1] bevoegde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0005775
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005775
  - number: 11.1.d
    text: |-
      Voor vluchten binnen een van de in [artikel 5, eerste lid, onder a tot en met h][ref1] genoemde gebieden is vooraf
      toestemming vereist van de Commandant Groep Helicopters van de Koninklijke Luchtmacht.


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel5
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '5'
        paragraaf: '2'
  - number: 11.1.e
    text: |-
      Voor vluchten binnen een van de in [artikel 5, eerste lid, onder i en j][ref1], genoemde gebieden en de onder 1
      genoemde route is vooraf toestemming vereist van de Commandant Koninklijke Militaire School Luchtmacht/Vliegbasis
      Woensdrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel5
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '5'
        paragraaf: '2'
  - number: 11.1.f
    text: |-
      Voor vluchten binnen het gebied genoemd in [artikel 5, eerste lid, onder][ref1] k is vooraf toestemming vereist van
      de commandant van de Groep Helicopters van de Koninklijke Marine.


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel5
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '5'
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Aan gezagvoerders van hefschroefvliegtuigen van de bondgenootschappelijke strijdkrachten wordt per oefening door de
      Staatssecretaris van Defensie toestemming verleend onder nader te stellen voorwaarden.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel11
  - number: '12'
    text: |-
      De in [artikel 6][ref1] bedoelde vrijstelling geldt voor gezagvoerders van militaire luchtvaartuigen behorend
      tot de Nederlandse strijdkrachten en aan door de Staatssecretaris van Defensie aan te wijzen luchtvaartuigen
      behorend tot bondgenootschappelijke strijdkrachten voor de in [artikel 1][ref2] bedoelde VFR-nachtvluchten
      indien de volgende minimum vlieghoogte in acht wordt genomen: a. Boven gebieden met aaneengesloten bebouwing,
      industrie- en havengebieden daaronder begrepen, danwel mensenverzamelingen: ten minste 300 meter (1000 voet),
      voor hefschroefvliegtuigen 210 meter (700 voet), boven de hoogste hindernissen binnen een afstand van 600 meter
      van het luchtvaartuig, b. Elders dan onder a aangegeven: 1º. Voor vastvleugelige luchtvaartuigen: a. ten minste
      300 meter (1000 voet) boven grond of water; b. ten minste 150 meter (500 voet) boven grond of water voor vluchten
      bedoeld in [artikel 2, tweede lid][ref3]; c. ten minste 100 meter (300 voet) boven water of zoveel lager als
      door het doel van de vlucht is vereist. 2º. Voor hefschroefvliegtuigen: a. ten minste 30 meter (100 voet) boven
      grond of water of zoveel lager als door het doel van de vlucht wordt vereist, voor vluchten als bedoeld in
      [artikel 2, vijfde lid][ref4]; b. ten minste 75 meter (250 voet) boven hindernissen op de routes van en naar de in
      [artikel 2, vijfde lid][ref5] genoemde oefengebieden; c. ten minste 100 meter (300 voet) boven grond of water of
      zoveel lager als door het doel van de vlucht wordt vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0007141#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007141#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0007141#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0007141#Artikel2
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '6'
        paragraaf: '2'
