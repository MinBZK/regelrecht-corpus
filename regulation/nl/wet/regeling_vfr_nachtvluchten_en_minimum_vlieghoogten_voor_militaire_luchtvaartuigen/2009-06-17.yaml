  - number: '2.6'
    text: |-
      Van de in het vijfde lid genoemde oefengebieden mag alleen gebruik worden gemaakt indien aan de volgende
      voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.6.a
    text: |-
      De vliegoefeningen worden met ontstoken navigatie-lichten uitgevoerd. Indien de intensiteit van de navigatielichten
      de taakuitvoering van de vlieger nadelig beïnvloedt, is het toegestaan de navigatie-lichten te dimmen of te doven.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.6.b
    text: Gedurende de genoemde vluchten worden de opgedragen Secundary Surveillance Radar Transponder mode en code gevoerd.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.6.c
    text: |-
      Er wordt voor zover als mogelijk is in verband met de vlieghoogte, radiocontact onderhouden met het Military Air
      Traffic Control Centre Nieuw Milligen.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
  - number: 2.6.d
    text: |-
      Onverminderd het gestelde in [Hoofdstuk III, Afdeling 2, paragraaf 2 van het Luchtverkeersreglement][ref1]
      betreffende het vermijden van botsingen, wordt te allen tijde voor ander luchtverkeer uitgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005775
        paragraaf: '2'
  - number: '3'
    text: |-
      De minimum vlieghoogte, bedoeld in [artikel 45, eerste lid, onder b, van het Luchtverkeersreglement][ref1]
      bedraagt 300 meter (1000 voet) voor militaire vliegtuigen, met uitzondering van het Waddenzee-gebied waarvoor een
      minimum vlieghoogte geldt van 450 meter (1500 voet) en met uitzondering van militaire straalvliegtuigen in het
      luchtverkeersdienstverleningsgebied met klasse G, waarvoor een minimum vlieghoogte geldt van 365 meter (1200 voet).


      [ref1]: https://wetten.overheid.nl/BWBR0005775#Artikel45
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005775
        artikel: '45'
  - number: '4.1'
    text: |-
      Het gestelde in [artikel 3][ref1] geldt, behoudens op vrijdagen, niet voor gezagvoerders van Nederlandse en
      bondgenootschappelijke militaire straalvliegtuigen en voor gezagvoerders van militaire transportvliegtuigen
      behorende tot of in gebruik bij de Nederlandse en de bondgenootschappelijke strijdkrachten, indien zij een VFR-
      vlucht uitvoeren langs de volgende routes:


      [ref1]: https://wetten.overheid.nl/BWBR0007141#Artikel3
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007141
        artikel: '3'
        paragraaf: '2'
  - number: 4.1.a
    text: |-
      Linkroute 10: - 52 04 30 N - 006 44 00 E;
        - 52 14 40 N - 006 39 30 E;
        - 52 17 30 N - 006 38 30 E;
        - 52 25 00 N - 006 36 30 E;
        - 52 36 40 N - 006 33 00 E;
        - 53 03 00 N - 007 13 30 E, waarbij de minimum vlieghoogte op het route gedeelte van de positie 52 17 30 N - 006
      38 30 E naar de positie 52 25 00 N -006 36 30 E tenminste 300 meter boven hindernissen is, of zoveel lager als door
      het doel van de vlucht is vereist.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel4
  - number: 4.1.b
    text: |-
      Linkroute 10A. 53 24 00 N – 006 05 00 E; 53 09 00 N – 006 10 00 E; 52 33 00 N – 006 09 30 E; 52 17 00 N – 006 13 30
      E; 52 02 30 N – 006 25 40 E; 52 01 15 N – 006 46 30 E.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel4
  - number: '4.2'
    text: 'Tijdens de in het eerste lid genoemde vluchten nemen de gezagvoerders de volgende nadere voorwaarden in acht:'
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel4
  - number: 4.2.a
    text: |-
      De minimum vlieghoogte is ten minste 75 meter (250 voet) boven hindernissen of zoveel lager als door het doel van
      de vlucht is vereist.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel4
  - number: 4.2.b
    text: |-
      Met betrekking tot het vliegzicht en de wolkenbasis gelden de eisen voor VFR-vluchten, tenzij het doel van de
      vlucht het noodzakelijk maakt van deze eisen af te wijken.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel4
  - number: 4.2.c
    text: Iedere route wordt gevlogen in de richting als in het eerste lid onder a en b is aangegeven.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel4
  - number: 4.2.d
    text: |-
      De gezagvoerder, die meer dan 1852 meter (1 NM) van de route is afgeraakt, klimt eerst naar de voor hem geldende
      minimum vlieghoogte en zet de vliegoefening pas voort als hij op de route is teruggekeerd. Wordt tijdens de
      manoeuvre gevlogen binnen een luchtverkeersleidingsgebied dan worden de voor dat gebied geldende voorschriften in
      acht genomen.
    url: https://wetten.overheid.nl/BWBR0007141/2009-06-17#Artikel4
  - number: '5.1'
    text: |-
      Het gestelde in [artikel 3][ref1] geldt niet voor gezagvoerders van militaire hefschroefvliegtuigen respectievelijk
      van voor opleidingsdoeleinden bestemde propellervliegtuigen behorende tot of gebruikt voor de Nederlandse of
      bondgenootschappelijke strijdkrachten indien zij, met inachtneming van de regels gesteld in het tweede lid, VFR-
