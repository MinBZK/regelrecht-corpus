preamble:
  text: |-
    Overwegende dat uitvoering moet worden gegeven aan de richtlijn van de Raad van de Europese Gemeenschappen van 8
    maart 1984, betreffende grenswaarden en kwaliteitsdoelstellingen voor kwiklozingen afkomstig van andere sectoren
    dan de elektrolyse van alkalichloriden (84/156/EEG) (Pb EG 1984, L 74/49);

    dat het gewenst is de uitvoering van die richtlijn te doen geschieden in een regeling die mede strekt ter
    uitvoering van de richtlijn van de Raad van de Europese Gemeenschappen van 22 maart 1982, betreffende grenswaarden
    en kwaliteitsdoelstellingen voor kwiklozingen afkomstig van de sector elektrolyse van alkalichloriden (82/176/
    EEG) (Pb EG 1982, L 81/29) en van de aanvulling van bijlage IV van de Overeenkomst inzake bescherming van de
    Rijn tegen chemische verontreiniging, betreffende kwiklozingen van installaties voor elektrolyse van alkalische
    chloorverbindingen (Trb. 1983, 53);

    dat daartoe de beschikking van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 16 juni
    1983, Stb. 294, ter uitvoering van de laatstgenoemde richtlijn en van die aanvulling dient te worden vervangen door
    een regeling ter uitvoering van de drie genoemde volkenrechtelijke besluiten;

    Gelet op artikel 1a, eerste, tweede en derde lid, van de Wet verontreiniging oppervlaktewateren (Stb. 1981, 573);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel1
  - number: 1.a
    text: |-
      *verwerken van kwik:* elk industrieel proces waarbij kwik of kwikbevattende stoffen worden vervaardigd of gebruikt,
      of waarbij kwik of kwikbevattende stoffen vrijkomen;
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel1
  - number: 1.b
    text: '*lozen:* brengen van:'
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel1
  - number: 1.b.1°
    text: stoffen in een oppervlaktewaterlichaam;
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel1
  - number: 1.b.2°
    text: |-
      afvalwater of andere afvalstoffen in een openbaar hemelwaterstelsel, een openbaar ontwateringstelsel, een openbaar
      vuilwaterriool of een andere voorziening voor de inzameling en het transport van afvalwater, of
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel1
  - number: 1.b.3°
    text: |-
      stoffen op een zuiveringtechnisch werk met behulp van een werk niet zijnde een voorziening voor de inzameling en
      het transport van afvalwater.
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust op [artikel 6.3 van het Waterbesluit][ref1] en [artikel 8.40, eerste lid][ref2], in samenhang
      met [artikel 21.6, zesde lid, van de Wet milieubeheer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0026872#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003245#Artikel21
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0026872
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003245
        artikel: '21'
  - number: '2'
    text: |-
      Ten aanzien van een bedrijf dat kwik verwerkt, geldt voor het lozen van kwik als ten hoogste toelaatbare
      gewichtshoeveelheid de grenswaarde die overeenkomt met de waarde die het resultaat is van de toepassing van de
      beste bestaande technieken. Daarbij geldt ten aanzien van een bedrijf, behorende tot een van de in de bij dit
      besluit behorende [bijlage I][ref1] vermelde bedrijfstakken de in die bijlage voor die bedrijfstak aangegeven
      grenswaarde, bepaald op de in de bij dit besluit behorende [bijlage II][ref2] aangegeven wijze, als ten hoogste
      toelaatbare gewichtshoeveelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003958
      [ref2]: https://wetten.overheid.nl/BWBR0003958
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003958
      - id: ref2
        bwb_id: BWBR0003958
  - number: '3'
    text: |-
      In afwijking van [artikel 2][ref1] gelden voor het lozen van kwik als ten hoogste toelaatbare gewichtshoeveelheden
      ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0003958#Artikel2
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003958
        artikel: '2'
  - number: 3.a
    text: |-
      een bedrijf, behorende tot de in [bijlage I][ref1], onder 1, genoemde bedrijfstak, dat vóór 22 maart 1982
      in werking is gebracht en waarin na die datum de capaciteit voor het verwerken van kwik niet aanzienlijk is
      uitgebreid: de in bijlage I, onder 1, voor zodanige bedrijven aangegeven waarde, bepaald op de in bijlage II
      aangegeven wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0003958
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003958
  - number: 3.b
    text: |-
      een bedrijf, behorende tot één of meer der in [bijlage I][ref1], onder 2 tot en met 5, genoemde bedrijfstakken,
      dat vóór 12 maart 1984 in werking is gebracht en waarin na die datum de capaciteit voor het verwerken van kwik
      niet aanzienlijk is uitgebreid: tot 1 juli 1989: de voor zodanige bedrijven in bijlage I, onder 2 tot en met 5, per
      bedrijfstak aangegeven grenswaarde, bepaald op de in [bijlage II][ref2] aangegeven wijze;


      [ref1]: https://wetten.overheid.nl/BWBR0003958
      [ref2]: https://wetten.overheid.nl/BWBR0003958
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003958
      - id: ref2
        bwb_id: BWBR0003958
  - number: 3.c
    text: |-
      een bedrijf, behorende tot een andere dan de in [bijlage I][ref1] genoemde bedrijfstakken, dat vóór 12 maart
      1984 in werking is gebracht en waarin na die datum de capaciteit voor het verwerken van kwik niet aanzienlijk is
      uitgebreid: de grenswaarde die op 1 juli 1986 overeenkomt met de waarde die het resultaat is van de toepassing van
      de beste bestaande technieken.


      [ref1]: https://wetten.overheid.nl/BWBR0003958
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003958
  - number: '4'
    text: |-
      De beschikking van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer van 16 juni 1983, *Stb.*
      294, houdende regelen met betrekking tot grenswaarden voor kwik, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel4
  - number: '5.1'
    text: Deze regeling treedt in werking met ingang van 1 juli 1986.
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel5
  - number: '5.2'
    text: Zij wordt in het *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0003958/2009-12-22#Artikel5
