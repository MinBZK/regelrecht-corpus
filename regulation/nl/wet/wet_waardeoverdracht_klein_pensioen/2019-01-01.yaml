  - number: V
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0040435/2019-01-01#ArtikelV
  - number: VI
    text: 'Deze wet wordt aangehaald als: Wet waardeoverdracht klein pensioen.'
    url: https://wetten.overheid.nl/BWBR0040435/2019-01-01#ArtikelVI
