preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is afkoop van kleine pensioenaanspraken te vervangen door
    waardeoverdracht zodat de pensioenbestemming behouden blijft en enige andere wijzigingen inzake waardeoverdracht
    door te voeren;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040435/2019-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen vier jaar na de inwerkingtreding van
      [artikel I, onderdeel I][ref1], en [artikel II, onderdeel J][ref2], van deze wet aan de Staten-Generaal een verslag
      over de doeltreffendheid en de effecten van deze wet in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0040435#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0040435#ArtikelII
    url: https://wetten.overheid.nl/BWBR0040435/2019-01-01#ArtikelIV
