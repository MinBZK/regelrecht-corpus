  - number: '6.4'
    text: |-
      Een beschikking tot toekenning van een tegemoetkoming aan een kind als bedoeld in [artikel 2.10][ref1], een
      tegemoetkoming aan een pleegkind als bedoeld in [artikel 2.11, eerste lid][ref2], of een tegemoetkoming aan een
      voormalig pleegkind als bedoeld in artikel 2.11, tweede lid, wordt door de Dienst Toeslagen vastgesteld:

      a. op of na de datum waarop de [artikelen 2.10 tot en met 2.13][ref3] in werking zijn getreden, indien de
      Dienst Toeslagen het recht op toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref4] voor de
      inwerkingtreding van de [artikelen 2.10 tot en met 2.13][ref5] heeft vastgesteld; of

      b. na de dagtekening van de beschikking waarin door de Dienst Toeslagen het recht op toepassing van een
      herstelmaatregel als bedoeld in [artikel 2.7][ref6] is vastgesteld.


