  - number: 2.14g
    text: |-
      1 Voor de toepassing van deze afdeling wordt onder ex-partner verstaan degene die:

      a. partner was van een aanvrager van een kinderopvangtoeslag die in aanmerking komt voor toepassing van een
      herstelmaatregel als bedoeld in [artikel 2.7][ref1] op:

      1°. enig moment in een berekeningsjaar indien de beschikking vanwege institutionele vooringenomenheid of hardheid
      betrekking heeft op de kinderopvangtoeslag voor dat berekeningsjaar en geheel of gedeeltelijk betrekking heeft op
      de kinderopvang van het kind of het toenmalige pleegkind van die partner;

      2°. enig moment in een berekeningsjaar indien het terug te betalen bedrag aan kinderopvangtoeslag waarvoor op grond
      van de beschikking vanwege een onterechte kwalificatie opzet of grove schuld geen persoonlijke betalingsregeling
      is toegekend of een buitengerechtelijke betalingsregeling is geweigerd, betrekking heeft op dat berekeningsjaar
      en geheel of gedeeltelijk betrekking heeft op de kinderopvang van het kind of het toenmalige pleegkind van die
      partner; of

      3°. de datum van de dagtekening van de beschikking vanwege institutionele vooringenomenheid of hardheid of de
      beschikking vanwege een onterechte kwalificatie opzet of grove schuld en gedurende ten minste een jaar daarna;

      b. zelf niet in aanmerking komt voor toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref2]; en

      c. geen partner meer was van die aanvrager op de peildatum als gevolg van een omstandigheid anders dan het
      overlijden van die aanvrager.

      2 Voor de toepassing van het eerste lid wordt onder een aanvrager van een kinderopvangtoeslag die in aanmerking
      komt voor toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref3] mede verstaan de overleden
      aanvrager.

      3 De peildatum, bedoeld in het eerste lid, onderdeel c, is:

      a. de peildatum, bedoeld in [artikel 3.1, tweede lid][ref4]; of

      b. de eerste dag van de maand die volgt op de dag van overlijden van de aanvrager van een kinderopvangtoeslag,
      bedoeld in het eerste lid, indien de peildatum, bedoeld in onderdeel a, in verband met dat overlijden, niet kan
      worden vastgesteld op de in dit onderdeel eerstgenoemde dag.

      4 Voor de toepassing van deze afdeling wordt onder beschikking vanwege institutionele vooringenomenheid of hardheid
      verstaan: aan de aanvrager van een kinderopvangtoeslag, bedoeld in het eerste lid, gerichte beschikking tot
      het verminderen of niet toekennen van een kinderopvangtoeslag of het beëindigen van voorschotverlening voor een
      kinderopvangtoeslag welke beschikking een direct gevolg is van institutionele vooringenomenheid als bedoeld in
      [artikel 2.1, eerste lid][ref5], onderdeel a, of hardheid als bedoeld in artikel 2.1, eerste lid, onderdeel b.

      5 Voor de toepassing van deze afdeling wordt onder beschikking vanwege een onterechte kwalificatie opzet of grove
      schuld verstaan: aan de aanvrager van een kinderopvangtoeslag, bedoeld in het eerste lid, gerichte beschikking
      waarin staat dat geen persoonlijke betalingsregeling wordt toegekend of een buitengerechtelijke schuldregeling
      is geweigerd welke beschikking een direct gevolg is van een onterechte kwalificatie van opzet of grove schuld van
      de aanvrager van een kinderopvangtoeslag of diens huidige of gewezen partner ten aanzien van het ontstaan van de
      terugvordering van de kinderopvangtoeslag.

      6 In afwijking van [artikel 1.1][ref6] wordt voor de toepassing van dit artikel het begrip partner bij de
      beoordeling of sprake is van het al dan niet zijn van partner op het in dit artikel bedoelde tijdstip of in de dit
      artikel bedoelde periode om in aanmerking te komen voor compensatie als bedoeld in het eerste lid, beoordeeld op
      basis van [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref7] zoals dat artikel luidde in die
      periode of op dat tijdstip.


