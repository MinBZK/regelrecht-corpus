  - number: '2.11'
    text: |-
      1 Aan een pleegkind van een aanvrager van een kinderopvangtoeslag die in aanmerking komt voor toepassing van een
      herstelmaatregel als bedoeld in [artikel 2.7][ref1] of van diens partner, indien die tevens diens partner was op
      26 januari 2021, kent de Dienst Toeslagen ambtshalve een tegemoetkoming als bedoeld in [artikel 2.12][ref2] toe,
      indien het pleegkind:

      a. uiterlijk op de dag waarop dit artikel in werking is getreden, pleegkind is geworden van de aanvrager van een
      kinderopvangtoeslag of diens partner; en

      b. op 1 januari 2005 jonger was dan 21 jaar of in de periode van 1 januari 2005 tot en met de dag waarop dit
      artikel in werking is getreden, is geboren.

      2 Aan een voormalig pleegkind van een aanvrager van een kinderopvangtoeslag die in aanmerking komt voor toepassing
      van een herstelmaatregel als bedoeld in [artikel 2.7][ref3], of van diens partner, indien die tevens diens partner
      was op 26 januari 2021, kent de Dienst Toeslagen ambtshalve een tegemoetkoming als bedoeld in [artikel 2.12][ref4]
      toe, indien het voormalige pleegkind:

      a. onderdeel van het huishouden is geweest van de aanvrager van de kinderopvangtoeslag in de periode tussen de
      eerste beschikking van de Dienst Toeslagen waarvoor herstel wordt geboden door middel van de herstelmaatregel tot
      en met de dag waarop dit artikel in werking is getreden; en

      b. op 1 januari 2005 jonger was dan 21 jaar of in de periode van 1 januari 2005 tot en met de dag waarop dit
      artikel in werking is getreden, is geboren.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0047436#Artikel2.12
      [ref3]: https://wetten.overheid.nl/BWBR0047436#Artikel2.7
      [ref4]: https://wetten.overheid.nl/BWBR0047436#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel2.11
