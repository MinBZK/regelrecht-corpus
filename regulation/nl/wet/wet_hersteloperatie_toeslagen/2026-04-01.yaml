      1 Onze Minister kent op aanvraag een forfaitaire kostenvergoeding toe aan de curator onderscheidenlijk
      bewindvoerder van degene, bedoeld in [artikel 4.1, eerste lid][ref1], of [artikel 4.3, eerste lid][ref2],
      die onder curatele staat als bedoeld in [artikel 378 van Boek 1 van het Burgerlijk Wetboek][ref3] of voor
      al de hem toebehorende onderscheidenlijk gaan toebehorende goederen onder bewind is gesteld als bedoeld in
      [artikel 431 van die wet][ref4].

      2 De vergoeding bedraagt vier uren tegen het door Onze Minister van Justitie en Veiligheid vastgestelde uurtarief.

      3 De aanvraag tot toekenning van de forfaitaire kostenvergoeding wordt door de curator of bewindvoerder ingediend
      bij de aanvraag, bedoeld in [artikel 4.1, eerste lid][ref5], of [artikel 4.3, eerste lid][ref6].


