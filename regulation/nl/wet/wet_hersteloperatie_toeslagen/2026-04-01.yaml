  - number: 2.9a
    text: |-
      1 Aan degene die partner was van een overleden aanvrager op de dag van overlijden wordt een of meer van de
      onderstaande voorzieningen toegekend:

      a. op aanvraag door de Dienst Toeslagen:

      1°. compensatie die op grond van [artikel 2.1, eerste lid][ref1], aan een overleden aanvrager op aanvraag zou zijn
      toegekend indien deze niet was overleden;

      2°. tegemoetkoming die op grond van [artikel 2.6, eerste lid][ref2], aan een overleden aanvrager op aanvraag zou
      zijn toegekend indien deze niet was overleden;

      3°. het forfaitaire bedrag dat op grond van [artikel 2.7][ref3] aan een overleden aanvrager op aanvraag zou zijn
      toegekend indien deze niet was overleden;

      b. op aanvraag door Onze Minister: overeenkomstige toepassing van [afdeling 4.1][ref4] op de daar bedoelde
      geldschulden van een overleden aanvrager voor zover deze ten laste van de partner zijn gekomen, en op de daar
      bedoelde schulden van die partner;

      c. ambtshalve door de publieke schuldeisers, genoemd in de [artikelen 3.1 tot en met 3.12][ref5]:

      overeenkomstige toepassing van [hoofdstuk 3][ref6] op de geldschulden, bedoeld in de
      [artikelen 3.1 tot en met 3.12][ref7], van een overleden aanvrager voor zover deze ten laste van de partner zijn
      gekomen, en de daar bedoelde schulden van die partner.

      2 Aan degene die partner was van een overleden aanvrager op de dag van overlijden wordt door de Dienst Toeslagen
      op aanvraag aanvullende compensatie voor de werkelijke schade als bedoeld in [artikel 2.1, derde lid][ref8], of een
      aanvullende O/GS-tegemoetkoming voor de werkelijke schade als bedoeld in [artikel 2.6, derde lid][ref9], toegekend
      die aan de overleden aanvrager op aanvraag zou zijn toegekend indien deze niet was overleden.

      3 Het eerste en tweede lid zijn niet van toepassing indien degene die partner was van de overleden aanvrager op
      de dag van overlijden, dit niet meer was op de eerste dag van de maand die volgt op de dag van overlijden van de
      aanvrager als gevolg van een omstandigheid anders dan het overlijden van de aanvrager.


