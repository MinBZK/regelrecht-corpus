  - number: '6.1'
    text: |-
      1 Een aanvraag als bedoeld in [artikel 2.1, eerste lid][ref1], [2.6, eerste lid][ref2], [3.13, eerste lid][ref3],
      [4.1, eerste lid][ref4], [4.2][ref5], [4.3, eerste lid][ref6], [4.4, eerste lid][ref7], [4.6, eerste lid][ref8], of
      [4.7, eerste lid][ref9], wordt ingediend voor 1 januari 2024. Een aanvraag als bedoeld in artikel 2.1, derde lid,
      of 2.6, derde lid, wordt ingediend voor een bij koninklijk besluit te bepalen tijdstip .

      2 Een aanvraag als bedoeld in [artikel 2.13][ref10], [2.14][ref11] of [2.14a][ref12] wordt ingediend bij de Dienst
      Toeslagen binnen een jaar na de uiterste datum voor het doen van een aanvraag van een herstelmaatregel als bedoeld
      in [artikel 2.7][ref13]. In afwijking van de eerste zin wordt een aanvraag als bedoeld in artikel 2.13 ingediend
      tot een jaar na de dagtekening van de beschikking tot het toepassen van een herstelmaatregel als bedoeld in
      artikel 2.7, indien die beschikking een dagtekening heeft van na 31 december 2023.

      3 In afwijking van het eerste lid, eerste zin, wordt een aanvraag als bedoeld in [artikel 3.13, eerste lid][ref14],
      of [4.3, eerste lid][ref15], indien een beschikking tot toekenning van compensatie als bedoeld in artikel 2.1,
      eerste lid, of van een O/GS-tegemoetkoming als bedoeld in artikel 2.6, eerste lid, na 1 juli 2023 onherroepelijk
      vast komt te staan, uiterlijk zes maanden na de datum waarop die beschikking onherroepelijk vast komt te staan,
      ingediend.

      3a In afwijking van het eerste lid, tweede zin, wordt een aanvraag als bedoeld in [artikel 2.1, derde lid][ref16],
      of [2.6, derde lid][ref17], indien een beschikking tot toekenning van compensatie als bedoeld in artikel 2.1,
      eerste lid, of van een O/GS-tegemoetkoming als bedoeld in artikel 2.6, eerste lid, na een bij koninklijk besluit
      te bepalen tijdstip  onherroepelijk vast komt te staan, uiterlijk zes maanden na de datum waarop die beschikking
      onherroepelijk vast komt te staan, ingediend.

      4 In afwijking van het eerste lid wordt een aanvraag als bedoeld in [4.1, eerste lid][ref18], [4.2][ref19],
      [4.4, eerste lid][ref20], [4.6, eerste lid][ref21], of [4.7, eerste lid][ref22], indien de eerste beschikking
      tot toekenning van compensatie als bedoeld in [artikel 2.1, eerste lid][ref23], of van een O/GS-tegemoetkoming
      als bedoeld in [artikel 2.6, eerste lid][ref24], na 1 juli 2023 onherroepelijk vast komt te staan, uiterlijk zes
      maanden na de datum waarop die beschikking onherroepelijk vast komt te staan, ingediend.

      5 Een aanvraag als bedoeld in [artikel 2.13a][ref25] wordt ingediend uiterlijk 31 december 2024, of indien de
      beschikking tot toekenning van een compensatie als bedoeld in [artikel 2.14h, eerste lid][ref26], een dagtekening
      heeft van na 31 december 2023, tot en met een jaar na de datum van de dagtekening van die beschikking.

      6 Een aanvraag als bedoeld in [artikel 2.14h, eerste lid][ref27], wordt ingediend:

      a. voor 1 juli 2024; of

      b. binnen zes maanden na de datum waarop die aanvraag voor het eerst gedaan kan worden, indien deze termijn van zes
      maanden verstrijkt op of na 1 juli 2024.

      7 Indien de ex-partner een brief heeft ontvangen van de Dienst Toeslagen met een uitnodiging tot het
      aanvragen van compensatie met dagtekening van na 31 december 2023, wordt een aanvraag als bedoeld in
      [artikel 2.14h, eerste lid][ref28], in afwijking van het zesde lid ingediend binnen zes maanden na dagtekening van
      die brief.

      8 In afwijking van het eerste lid wordt een aanvraag als bedoeld in [artikel 4.1, eerste lid][ref29],
      [4.4, eerste lid][ref30], [4.6, eerste lid][ref31], of [4.7, eerste lid][ref32], van of met betrekking tot een ex-
      partner die in aanmerking komt voor de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref33], en aan wie deze
      is toegekend, ingediend binnen zes maanden na dagtekening van de beschikking tot toekenning van de compensatie,
      bedoeld in artikel 2.14h, eerste lid.


