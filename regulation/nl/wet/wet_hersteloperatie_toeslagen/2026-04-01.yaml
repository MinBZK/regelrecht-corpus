      1 Het college van burgemeester en wethouders scheldt ambtshalve schulden
      kwijt die verband houden met de uitvoering van de [Participatiewet][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] en
      __REF003___________________________________________________________________________________________________________
      ___________________________________________________________________________________________ (Stb. 2012,
      430), voor zover die op 31 december 2020 niet voldaan waren of voor zover die betrekking hebben op de
      periode tot en met 31 december 2020 en de schuld na die datum is vastgesteld, van een persoon als bedoeld in
      [artikel 3.1, eerste lid][ref5].

      2 Het eerste lid is van overeenkomstige toepassing op de met de schuld verband houdende verhogingen.

      3 Indien de schuld, bedoeld in het eerste lid, na 31 december 2020 is verminderd als gevolg van een aflossing of
      verrekening restitueert het college van burgemeester en wethouders het bedrag waarmee de schuld is verminderd.

      4 In afwijking van het eerste lid en derde lid scheldt het college van burgemeester en wethouders niet kwijt en
      restitueert niet indien de schuld is ontstaan door:

      a. een besluit van het college van burgemeester en wethouders jegens de persoon, bedoeld in het eerste lid,
      handelend in de hoedanigheid van werkgever;

      b. een terugvordering of een bestuurlijke boete in verband met het opzettelijk of door grove schuld niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in:

      1°. [artikel 17, eerste lid, van de Participatiewet][ref6];

      2°. __REF000___________________________________________________________________________________________________________
      __________;

      3°. __REF000___________________________________________________________________________________________________________
      ____________;

      4°. [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref9];

      c. naar het oordeel van het college van burgemeester en wethouders misbruik van sociale zekerheid of frauduleus
      of anderszins wederrechtelijk handelen of nalaten, van dien aard dat kwijtschelding of restitutie achterwege dient
      te blijven.

      5 In afwijking van het eerste en derde lid scheldt het college van burgemeester en wethouders een
      lening verstrekt als bijstand ter voorziening in de behoefte aan bedrijfskapitaal als bedoeld in
      [artikel 78f van de Participatiewet][ref10] slechts kwijt of restitueert deze slechts voor zover het betreft:

      a. achterstallige betalingen; of

      b. de hoofdsom, welke op grond van [artikel 58, tweede lid, onderdeel b, van de Participatiewet][ref11] voor
      1 januari 2021 is teruggevorderd.

      6 [Artikel 3.6, zesde lid][ref12], [artikel 8c van de Participatiewet][ref13],
      [artikel 40 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref14], en
      [artikel 40 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref15]
      zijn van overeenkomstige toepassing.


