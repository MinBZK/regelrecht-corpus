  - number: '8.6'
    text: |-
      Beschikkingen ter zake van compensatie, aanvullende compensatie voor de werkelijke schade, O/GS-tegemoetkomingen,
      aanvullende O/GS-tegemoetkomingen voor de werkelijke schade of andere tegemoetkomingen of vergoedingen, ter zake
      van brede ondersteuning op de vijf leefgebieden financiën, gezin, werk, wonen en zorg aan gedupeerde aanvragers
      van een kinderopvangtoeslag, hun partners, kinderen en pleegkinderen van een van hen die woonachtig zijn buiten
      Nederland, kwijtschelding van bestuursrechtelijke schulden en betaling of overneming van privaatrechtelijke
      schulden die in het kader van de hersteloperatie toeslagen zijn gegeven voor het tijdstip van inwerkingtreding van
      de artikelen van [afdeling 2.1][ref1], [2.4][ref2], 3.1, [4.1][ref3] onderscheidenlijk [4.2][ref4], worden vanaf
      dat tijdstip aangemerkt als beschikkingen die zijn gegeven krachtens het artikel van afdeling 2.1, 2.4, 3.1, 4.1 of
      4.2 waarin de desbetreffende herstelregeling is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Hoofdstuk2
