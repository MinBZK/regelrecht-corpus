  - number: '4.3'
    text: |-
      1 Aan een aanvrager van een kinderopvangtoeslag die in aanmerking komt voor toepassing van een herstelmaatregel
      als bedoeld in [artikel 2.7][ref1] of aan een ex-partner, die in aanmerking komt voor de compensatie, bedoeld in
      [artikel 2.14h, eerste lid][ref2], en aan wie deze is toegekend, verleent Onze Minister op aanvraag compensatie
      voor een afgeloste geldschuld die op grond van [artikel 4.1][ref3] voor overneming in aanmerking zou komen als
      deze niet voldaan was.

      2 In afwijking van het eerste lid kan een aanvraag worden ingediend door degene, bedoeld in
      [artikel 3.1, eerste lid, onderdeel b of c][ref4], indien hij geen partner meer is op het tijdstip waarop die
      aanvraag wordt ingediend.

      3 De compensatie wordt verleend voor een geldschuld en kosten die zijn voldaan door een aanvrager als bedoeld in
      het eerste lid, diens partner, bedoeld in [artikel 3.1, eerste lid, onderdelen b of c][ref5] of de ex-partner,
      die in aanmerking komt voor de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref6], en aan wie deze is
      toegekend:

      a. na het moment van het ontvangen van een bedrag op grond van een herstelmaatregel als bedoeld in
      [artikel 2.7][ref7] dan wel de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref8]; of

      b. tussen het moment van de dagtekening van de beschikking van de Dienst Toeslagen waarin staat dat de Dienst
      Toeslagen vooralsnog geen reden ziet voor uitbetaling van een forfaitair bedrag en het moment van de dagtekening
      van de beschikking waarin toch recht op een forfaitair bedrag als bedoeld in de [artikelen 2.7, eerste lid][ref9],
      of [artikel 2.14h, eerste lid][ref10], is vastgesteld.

      4 De compensatie wordt niet verleend indien [artikel 4.6][ref11] of [4.7][ref12] wordt toegepast.

      5 De hoogte van de compensatie voor een afgeloste geldschuld en kosten is gelijk aan het bedrag dat de aanvrager
      van de compensatie in de periode, bedoeld in het derde lid, onderdeel a of b, heeft afgelost aan opeisbare
      geldschulden en kosten, met een maximum van het bedrag dat hij ontvangen heeft op grond van een herstelmaatregel.
      [Artikel 3.13, derde lid][ref13], is van toepassing.


