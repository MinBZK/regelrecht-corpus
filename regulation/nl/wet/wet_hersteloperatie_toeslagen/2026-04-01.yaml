  - number: 4a.1
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *betrokkene:* a. de partner van een overleden aanvrager die in aanmerking kan komen voor toekenning van een
      voorziening, aanvullende compensatie of een aanvullende O/GS-tegemoetkoming op grond van [artikel 2.9a][ref1]; b.
      het kind van een overleden aanvrager dat in aanmerking kan komen voor toekenning van een voorziening, aanvullende
      compensatie of een aanvullende O/GS-tegemoetkoming op grond van [artikel 2.9b][ref2];
        - *persoonlijke bijstand:* bijstand door de Dienst Toeslagen bij aanvragen en regelingen waar de betrokkene op
      grond van deze wet aanspraak kan maken.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.9a
      [ref2]: https://wetten.overheid.nl/BWBR0047436#Artikel2.9b
