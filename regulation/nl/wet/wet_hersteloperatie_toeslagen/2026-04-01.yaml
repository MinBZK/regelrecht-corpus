  - number: '8.9'
    text: |-
      De [artikelen 6.10a, eerste lid][ref1], en [6.10aa][ref2] zijn niet van toepassing ter zake van een beschikking
      die is gegeven voor de dag van inwerkingtreding van [artikel I, onderdeel Y][ref3], onderscheidenlijk artikel
      I, onderdeel Z, van de Wet aanpassing termijnen en nabestaandenregeling hersteloperatie toeslagen en een bezwaar
      gericht tegen die beschikking.


