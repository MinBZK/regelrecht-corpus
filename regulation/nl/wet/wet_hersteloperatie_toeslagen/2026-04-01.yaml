  - number: 2.14f
    text: |-
      1 De tegemoetkoming, bedoeld in [artikel 2.14c][ref1], [artikel 2.14d][ref2] of [artikel 2.14e][ref3], is gelijk
      aan het bedrag dat ingevolge [artikel 2.12][ref4] bij leven aan het overleden kind zou zijn toegekend, met dien
      verstande dat bij de vaststelling van dat bedrag wordt uitgegaan van de leeftijd van het overleden kind op 1 juli
      2023, dan wel op de dag van overlijden indien deze dag ligt voor 1 juli 2023.

      2 Indien meerdere personen binnen de aanvraagtermijn, bedoeld in [artikel 6.1a][ref5], een aanvraag indienen voor
      de tegemoetkoming, bedoeld in [artikel 2.14d][ref6] of [artikel 2.14e][ref7], wordt het bedrag, bedoeld in het
      eerste lid, verminderd naar evenredigheid met het aantal personen dat in aanmerking komt voor de tegemoetkoming.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.14c
      [ref2]: https://wetten.overheid.nl/BWBR0047436#Artikel2.14d
      [ref3]: https://wetten.overheid.nl/BWBR0047436#Artikel2.14e
