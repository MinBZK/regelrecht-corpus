  - number: 2.11a
    text: |-
      1 Aan een kind van een ex-partner, die in aanmerking komt voor de compensatie, bedoeld in
      [artikel 2.14h, eerste lid][ref1], en aan wie deze is toegekend, kent de Dienst Toeslagen ambtshalve een
      tegemoetkoming als bedoeld in [artikel 2.12][ref2] toe, indien het kind:

      a. is geboren voordat de ex-partner de partner werd van de aanvrager van een kinderopvangtoeslag; en

      b. op 1 januari 2005 jonger was dan 21 jaar of in de periode van 1 januari 2005 tot en met de dag voordat het
      toeslagpartnerschap met de aanvrager van een kinderopvangtoeslag begon, is geboren.

      2 [Artikel 2.14g, zesde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.14h
