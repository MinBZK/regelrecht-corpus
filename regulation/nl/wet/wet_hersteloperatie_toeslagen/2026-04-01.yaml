  - number: '8.7'
    text: |-
      Op een beschikking die is gebaseerd op [artikel 49g van de Algemene wet inkomensafhankelijke regelingen][ref1] en
      op 26 januari 2021 nog niet onherroepelijk vaststond, blijft artikel 49g van de Algemene wet inkomensafhankelijke
      regelingen, zoals dat luidde op 25 januari 2021, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel49g
