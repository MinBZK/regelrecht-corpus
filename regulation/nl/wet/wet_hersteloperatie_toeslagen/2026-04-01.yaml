  - number: '2.7'
    text: |-
      1 Aan een aanvrager van een kinderopvangtoeslag die in aanmerking komt voor toepassing van een herstelmaatregel
      en daarvoor voor 1 januari 2024 een aanvraag heeft ingediend, kent de Dienst Toeslagen ambtshalve eenmalig een
      forfaitair bedrag toe van € 30.000, met dien verstande dat dit bedrag wordt verminderd, maar niet verder dan tot
      nihil, met de bedragen die de aanvrager op het moment van toekenning van het forfaitaire bedrag al op grond van een
      herstelmaatregel heeft ontvangen. Bij vermindering tot nihil vindt geen toekenning plaats.

      2 Indien een aanvrager van een kinderopvangtoeslag gedurende een periode een partner had, zij beiden in
      aanmerking komen voor toepassing van een herstelmaatregel en ten minste een van hen in aanmerking komt voor een
      herstelmaatregel over een deel van die periode, wordt het forfaitaire bedrag alleen toegekend aan degene van wie
      de Dienst Toeslagen het recht op het forfaitaire bedrag het eerst heeft vastgesteld. Aan de ander wordt een bedrag
      van € 10.000 toegekend als diegene op het moment van het toekennen van het forfaitaire bedrag niet de partner is
      van degene aan wie het forfaitaire bedrag wordt toegekend, met dien verstande dat het bedrag van € 10.000 wordt
      verminderd, maar niet verder dan tot nihil, met de bedragen die deze persoon op het moment van toekenning van
      dit bedrag al op grond van een herstelmaatregel heeft ontvangen. Bij vermindering tot nihil vindt geen toekenning
      plaats.

      3 Indien een aanvrager van een kinderopvangtoeslag of de partner, bedoeld in het tweede lid, in aanmerking komt
      voor toepassing van een herstelmaatregel over een deel van de periode, bedoeld in het tweede lid, en zij elkaars
      partners waren op het moment van het toekennen van het forfaitaire bedrag aan een van hen, wordt voor de toepassing
      van de [artikelen 2.1, vijfde lid][ref1], en [2.6, vierde lid][ref2], aan ieder van hen een percentage van
      € 30.000 toegerekend, met een maximum van het uitbetaalde bedrag van de forfaitaire tegemoetkoming. Dit percentage
      wordt voor ieder van hen berekend door de som van de aan hem op grond van herstelmaatregelen toegekende bedragen,
      vóór toepassing van de in die artikelleden bedoelde verminderingen, te delen door de som van de aan hen beiden
      op grond van herstelregelmaatregelen toegekende bedragen, vóór toepassing van de in die artikelleden bedoelde
      verminderingen, met dien verstande dat bij de berekening van het percentage toegekende bedragen die compensatie of
      tegemoetkoming voor hogere werkelijke schade bieden, buiten beschouwing worden gelaten.

      4 Een herstelmaatregel is:

      a. toekenning van een hardheidstegemoetkoming als bedoeld in
      [artikel 49 van de Algemene wet inkomensafhankelijke regelingen][ref3], zoals dat luidde op 25 januari 2021;

      b. toekenning van compensatie als bedoeld in
      [artikel 49b van de Algemene wet inkomensafhankelijke regelingen][ref4], zoals dat luidde op 25 januari 2021, of
      als bedoeld in [artikel 2.1][ref5];

      c. toekenning van een O/GS-tegemoetkoming als bedoeld in
      [artikel 49c van de Algemene wet inkomensafhankelijke regelingen][ref6], zoals dat luidde ten tijde van de
      aanvraag van de O/GS-tegemoetkoming, of als bedoeld in [artikel 2.6][ref7];

      d. het verlagen of op nihil vaststellen van een terug te vorderen bedrag kinderopvangtoeslag in bijzondere
      omstandigheden vanwege de onevenredigheid van de nadelige gevolgen van een beschikking tot vaststelling of tot
      terugvordering kinderopvangtoeslag in verhouding tot de met die beschikking te dienen doelen;

      e. het vaststellen van het recht op kinderopvangtoeslag naar rato van het bedrag van de kosten van kinderopvang
      waarvan aannemelijk is dat het tijdig is betaald;

      f. herziening van een op 23 oktober 2019 onherroepelijk vaststaande beschikking tot terugvordering
      kinderopvangtoeslag, in bijzondere omstandigheden vanwege de onevenredigheid van de nadelige gevolgen van deze
      beschikking in verhouding tot de met de beschikking te dienen doelen; of

      g. herziening van een op 23 oktober 2019 onherroepelijk vaststaande beschikking tot toekenning kinderopvangtoeslag
      waarbij het recht op kinderopvangtoeslag wordt vastgesteld naar rato van het bedrag van de kosten van kinderopvang
      waarvan aannemelijk is dat het tijdig is betaald.

      5 In afwijking van het vierde lid is geen sprake van een herstelmaatregel indien:

      a. een toekenning, verlaging of vaststelling op nihil, naar rato vaststelling of herziening als bedoeld in het
      vierde lid, onderdelen c tot en met g, betrekking heeft op een berekeningsjaar waarover minder dan € 1.500 aan
      kinderopvangtoeslag is teruggevorderd of het recht op kinderopvangtoeslag met minder dan € 1.500 is verlaagd; of

      b. een verlaging, vaststelling op nihil of naar rato vaststelling als bedoeld in het vierde lid, onderdelen d en e,
      van toepassing is op een beschikking met een oorspronkelijke dagtekening van na 22 oktober 2019.


