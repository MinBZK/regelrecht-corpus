  - number: '2.14'
    text: |-
      1 De Dienst Toeslagen kent op aanvraag een tegemoetkoming als bedoeld in [artikel 2.12][ref1] toe aan een kind
      van een overleden aanvrager, dat op 1 januari 2005 jonger was dan 21 jaar of is geboren in de periode van 1 januari
      2005 tot en met de dag waarop de [artikelen 2.10][ref2] en [2.11][ref3] in werking zijn getreden.

      2 Het eerste lid is van overeenkomstige toepassing op een pleegkind als bedoeld in
      [artikel 2.11, eerste lid, onderdeel a][ref4], en een voormalig pleegkind als bedoeld in artikel 2.11, tweede
      lid, onderdeel a, van de aanvrager van een kinderopvangtoeslag en op een kind, een pleegkind als bedoeld in
      artikel 2.11, eerste lid, onderdeel a, en een voormalig pleegkind als bedoeld in artikel 2.11, tweede lid,
      onderdeel a, van de partner van de aanvrager van een kinderopvangtoeslag, indien hij tevens diens partner was op
      26 januari 2021.


