      1 Onze Minister van Sociale Zaken en Werkgelegenheid scheldt ambtshalve schulden kwijt die verband houden met de
      uitvoering van de [Wet inburgering][ref1], zoals die wet luidde op de dag voorafgaand aan de inwerkingtreding van
      de Wet inburgering 2021, voor zover die op 31 december 2020 niet voldaan waren, of voor zover die betrekking hebben
      op de periode tot en met 31 december 2020 en de schuld na die datum is vastgesteld, van een persoon als bedoeld in
      [artikel 3.1, eerste lid][ref2].

      2 Het eerste lid is van overeenkomstige toepassing op de met de schuld verband houdende verhogingen.

      3 Indien de schuld, bedoeld in het eerste lid, na 31 december 2020 is verminderd als gevolg van een aflossing
      of verrekening restitueert Onze Minister van Sociale Zaken en Werkgelegenheid het bedrag waarmee de schuld is
      verminderd.

      4 In afwijking van het eerste en derde lid scheldt Onze Minister van Sociale Zaken en Werkgelegenheid niet kwijt
      en restitueert niet indien de schuld is ontstaan door naar het oordeel van Onze Minister van Sociale Zaken misbruik
      van het stelsel van inburgering of frauduleus of anderszins wederrechtelijk handelen of nalaten, van dien aard dat
      kwijtschelding of restitutie achterwege dient te blijven.

      5 [Artikel 3.6, zesde lid][ref3], is van overeenkomstige toepassing.


