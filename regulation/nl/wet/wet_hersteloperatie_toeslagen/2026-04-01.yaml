preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is nieuwe maatregelen te treffen in het kader van de
    hersteloperatie toeslagen en deze samen met de bestaande maatregelen onder te brengen in één wet en enige andere
    wetten in verband daarmee te wijzigen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *berekeningsjaar:* kalenderjaar waarop de toeslag betrekking heeft;
        - *huurtoeslag:* huurtoeslag als bedoeld in [artikel 1, onderdeel e, van de Wet op de huurtoeslag][ref1];
        - *inspecteur:* de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref2];
        - *kind:* eigen kind als bedoeld in [artikel 4, tweede lid, van de Algemene Kinderbijslagwet][ref3];
        - *kinderopvangtoeslag:* kinderopvangtoeslag als bedoeld in
      [artikel 1.1, eerste lid, van de Wet kinderopvang][ref4];
        - *kindgebonden budget:* kindgebonden budget als bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet op het kindgebonden budget][ref5];
        - *ontvanger:* de ontvanger, bedoeld in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref6];
        - *Onze Minister:* Onze Minister van Financiën;
        - *overleden aanvrager:* aanvrager van een kinderopvangtoeslag die is overleden en ten aanzien van wie een
      herstelmaatregel als bedoeld in [artikel 2.7][ref7] is toegepast of ten aanzien van wie aannemelijk is dat
      deze zou zijn toegepast, indien diegene: a. nog in leven zou zijn geweest op het moment van toepassing van de
      herstelmaatregel naar aanleiding van diens aanvraag daartoe; of b. daartoe een aanvraag zou hebben gedaan en is
      overleden voor 1 januari 2024;
        - *overleden kind:* een kind, pleegkind of voormalig pleegkind dat is overleden voordat aan hem een tegemoetkoming
      als bedoeld in [afdeling 2.2][ref8] is toegekend en van wie aannemelijk is dat aan hem die tegemoetkoming zou
      zijn toegekend indien: a. hij nog in leven zou zijn geweest op het moment dat de tegemoetkoming ambtshalve zou
      zijn toegekend; b. hij nog in leven zou zijn geweest op het moment dat de tegemoetkoming zou zijn toegekend naar
      aanleiding van diens aanvraag daartoe; of c. hij daartoe een aanvraag zou hebben gedaan en hij is overleden voordat
      de aanvraagtermijn, bedoeld in [artikel 6.1, tweede lid][ref9], is verlopen;
        - *partner:* partner als bedoeld in [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref10], met
      overeenkomstige toepassing van [artikel 5 van die wet][ref11];
        - *pleegkind:* pleegkind als bedoeld in [artikel 4, derde lid, van de Algemene Kinderbijslagwet][ref12] of een
      kind dat met een pleegkind wordt gelijkgesteld krachtens artikel 4, vierde lid, van die wet;
        - *toeslag:* kinderopvangtoeslag, huurtoeslag, zorgtoeslag of kindgebonden budget;
        - *zorgtoeslag:* zorgtoeslag als bedoeld in
      [artikel 1, eerste lid, onderdeel e, van de Wet op de zorgtoeslag][ref13].


