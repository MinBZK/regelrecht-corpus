  - number: 2.13a
    text: |-
      Een kind als bedoeld in [artikel 2.11a][ref1], een pleegkind als bedoeld in [artikel 2.11b, eerste lid][ref2],
      of een voormalig pleegkind als bedoeld in artikel 2.11b, tweede lid, kan een aanvraag doen tot toekenning van een
      tegemoetkoming als bedoeld in [artikel 2.12][ref3] indien:

      a. de Dienst Toeslagen de beschikking tot toekenning van de compensatie, bedoeld in
      [artikel 2.14h, eerste lid][ref4], heeft bekendgemaakt; en

      b. de beschikking tot toekenning van de tegemoetkoming, bedoeld in [artikel 2.12][ref5], niet ambtshalve is
      gegeven binnen zes maanden na de datum van dagtekening van de beschikking, bedoeld in [artikel 6.4a][ref6].


