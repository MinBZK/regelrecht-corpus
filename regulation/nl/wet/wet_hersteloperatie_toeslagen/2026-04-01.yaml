      1 Het CAK, bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref1], scheldt ambtshalve schulden
      kwijt die verband houden met de uitvoering van de wettelijke taken op het terrein van Onze Minister van
      Volksgezondheid, Welzijn en Sport en Onze Minister voor Langdurige Zorg en Sport, die betrekking hebben op
      de periode tot en met 31 december 2020 voor zover deze niet zijn voldaan, van een persoon als bedoeld in
      [artikel 3.1, eerste lid][ref2].

      2 De kwijtschelding is tevens van toepassing op de met de schuld verband houdende verhogingen.

      3 Indien de schuld na 31 december 2020 is verminderd als gevolg van een aflossing of verrekening restitueert het
      CAK het bedrag waarmee de schuld is verminderd.

      4 Het CAK kan dit artikel buiten toepassing laten indien het CAK ten aanzien van een persoon als bedoeld in
      [artikel 3.1, eerste lid, onderdeel a, b, of c][ref3], aangifte heeft gedaan van een misdrijf waarop naar de
      wettelijke omschrijving een gevangenisstraf van vier jaren of meer is gesteld en diens schuld, bedoeld in het
      eerste lid, direct voortvloeit uit dat misdrijf of die persoon onherroepelijk is veroordeeld voor een zodanig
      misdrijf.

      5 Bij ministeriële regeling kunnen door Onze Minister van Volksgezondheid, Welzijn en Sport regels worden gesteld
      voor de uitvoering van dit artikel.

      6 De kwijtschelding van schulden die zien op de eigen bijdrage, bedoeld in
      [artikel 3.2.5 van de Wet langdurige zorg][ref4], komt ten laste van het Fonds langdurige zorg als bedoeld
      in [artikel 1, onderdeel i, van de Wet financiering sociale verzekeringen][ref5]. De kwijtschelding van
      schulden die zien op de eigen bijdrage als bedoeld in [artikel 2 van het Bijdragebesluit zorg][ref6], zoals
      dat artikel luidde op de dag voor de datum van intrekking van dat besluit, komt tot de datum bedoeld in
      [artikel 11.2.10 van de Wet langdurige zorg][ref7], ten laste van het Algemeen Fonds Bijzondere Ziektekosten en
      daarna ten laste van het Fonds langdurige zorg.


