  - number: 2.14c
    text: |-
      1 De Dienst Toeslagen kent aan degene die partner was van het overleden kind op de dag van overlijden, op aanvraag
      een tegemoetkoming toe.

      2 Het eerste lid is niet van toepassing indien degene die partner was van het overleden kind op de dag van
      overlijden, dit niet meer was op de eerste dag van de maand die volgt op de dag van overlijden van het kind, als
      gevolg van een omstandigheid anders dan het overlijden van het kind.
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel2.14c
  - number: 2.14d
    text: |-
      Indien het overleden kind geen partner had op de dag van overlijden of indien de situatie, bedoeld in
      [artikel 2.14c, tweede lid][ref1], zich voordoet, kent de Dienst Toeslagen aan het kind van een overleden kind op
      aanvraag een tegemoetkoming toe.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.14c
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel2.14d
