  - number: '2.20'
    text: |-
      1 Op het moment waarop aan een aanvrager van een kinderopvangtoeslag in de vorm van een forfaitair bedrag als
      bedoeld in [artikel 2.7, eerste lid][ref1], een bedrag wordt uitgekeerd, gaat van rechtswege een afkoelingsperiode
      in voor een periode van een jaar.

      2 Ten aanzien van een aanvrager van een kinderopvangtoeslag die voor 12 februari 2021 een aanvraag heeft
      ingediend om toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref2] geldt van rechtswege een
      afkoelingsperiode van 12 februari 2021 tot en met 1 mei 2021.

      3 Tijdens de afkoelingsperiode kan elke bevoegdheid van een schuldeiser tot verhaal op de goederen van de aanvrager
      van een kinderopvangtoeslag of diens partner en tot opeising van goederen die zich in de macht van de aanvrager van
      een kinderopvangtoeslag of diens partner bevinden niet worden uitgeoefend, voor zover die bevoegdheid betrekking
      heeft op vorderingen die zijn ontstaan door een verzuim in de nakoming van een verbintenis door de aanvrager van
      een kinderopvangtoeslag of diens partner dat heeft plaatsgevonden vóór de afkoelingsperiode.

      4 Tijdens de afkoelingsperiode is een tekortkoming in de nakoming van een verbintenis door de aanvrager van een
      kinderopvangtoeslag of diens partner die heeft plaatsgevonden vóór de afkoelingsperiode geen grond voor wijziging
      van verbintenissen of verplichtingen jegens de schuldenaar, voor opschorting van de nakoming van een verbintenis
      jegens de schuldenaar of voor ontbinding van een met de schuldenaar gesloten overeenkomst.

      5 Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op een betalingsverplichting die voortvloeit
      uit een bestuursrechtelijke geldschuld als bedoeld in [artikel 4:85 van de Algemene wet bestuursrecht][ref3],
      een administratiefrechtelijke afdoening op grond van de [Wet administratieve handhaving verkeersvoorschriften]
      (onbekend), een publiekrechtelijke rechtshandeling of een uitspraak van een gerecht als bedoeld in
      [artikel 2 van de Wet op de rechterlijke organisatie][ref4], de Afdeling bestuursrechtspraak van de Raad van
      State, het College van Beroep voor het bedrijfsleven of de Centrale Raad van Beroep.


