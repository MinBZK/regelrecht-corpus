  - number: 2.14a
    text: |-
      1 De Dienst Toeslagen kent op aanvraag een tegemoetkoming als bedoeld in [artikel 2.12][ref1] toe aan een kind van
      een ex-partner van een aanvrager van een kinderopvangtoeslag indien:

      a. het kind is geboren voordat de ex-partner de partner werd van de aanvrager van een kinderopvangtoeslag;

      b. het kind op 1 januari 2005 jonger was dan 21 jaar of is geboren in de periode van 1 januari 2005 tot en met de
      dag voordat het toeslagpartnerschap met de aanvrager van een kinderopvangtoeslag begon; en

      c. de ex-partner is overleden en ten aanzien van hem aannemelijk is dat een compensatie als bedoeld in
      [artikel 2.14h, eerste lid][ref2], zou zijn toegekend, indien diegene:

      1°. nog in leven zou zijn geweest op het moment van toepassing van de herstelmaatregel naar aanleiding van diens
      aanvraag daartoe; of

      2°. diegene daartoe een aanvraag zou hebben gedaan en is overleden voor 1 januari 2024.

      2 Het eerste lid is van overeenkomstige toepassing op een pleegkind van de ex-partner als bedoeld in
      [artikel 2.11b, eerste lid][ref3], en op een voormalig pleegkind van de ex-partner als bedoeld in artikel 2.11b,
      tweede lid.

      3 [Artikel 2.14g, zesde lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0047436#Artikel2.14h
      [ref3]: https://wetten.overheid.nl/BWBR0047436#Artikel2.11b
      [ref4]: https://wetten.overheid.nl/BWBR0047436#Artikel2.14g
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel2.14a
