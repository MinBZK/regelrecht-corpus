  - number: '6.14'
    text: |-
      Een registratie in een stelsel van kredietregistratie als bedoeld in
      [artikel 4:32 van de Wet op het financieel toezicht][ref1] in verband met een betalingsachterstand
      aangaande een overeenkomst met een aanvrager van een kinderopvangtoeslag die in aanmerking komt voor
      toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref2], diens partner, bedoeld in
      [artikel 3.1, eerste lid, onderdelen b of c][ref3], of een ex-partner die in aanmerking komt voor de compensatie,
      bedoeld in [artikel 2.14h, eerste lid][ref4], en aan wie deze is toegekend wordt door degene die deze heeft
      geregistreerd per omgaande verwijderd uit het stelsel van kredietregistratie, indien de betalingsachterstand is
      komen te vervallen.


