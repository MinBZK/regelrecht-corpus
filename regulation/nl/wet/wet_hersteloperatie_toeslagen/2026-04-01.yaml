  - number: '2.16'
    text: |-
      1 De Dienst Toeslagen kent ambtshalve een tegemoetkoming toe aan een aanvrager van een huurtoeslag, zorgtoeslag of
      kindgebonden budget, indien:

      a. ten aanzien van hem voor 23 oktober 2019 bij de uitvoering van de huurtoeslag, zorgtoeslag of het kindgebonden
      budget sprake is geweest van institutionele vooringenomenheid van de Dienst Toeslagen;

      b. hij hierdoor schade heeft geleden; en

      c. hij betrokken is geweest bij een onderzoek van het Combiteam Aanpak Facilitators.

      2 De tegemoetkoming wordt niet toegekend indien de door de aanvrager van een huurtoeslag, zorgtoeslag of
      kindgebonden budget geleden schade is te wijten aan een ernstige onregelmatigheid die aan hem toerekenbaar is.

      3 De tegemoetkoming bedraagt 130 procent van het bedrag van de huurtoeslag, zorgtoeslag of het kindgebonden
      budget dat is teruggevorderd, niet is toegekend of niet is uitbetaald als voorschot, als een direct gevolg van
      institutionele vooringenomenheid.

      4 De tegemoetkoming wordt verminderd met:

      a. een nog niet betaald bedrag van een terugvordering als bedoeld in het derde lid;

      b. een alsnog toegekende verhoging van de huurtoeslag, zorgtoeslag of het kindgebonden budget over het
      berekeningsjaar waarop de tegemoetkoming betrekking heeft, met dien verstande dat de vermindering niet meer
      bedraagt dan het niet toegekende bedrag, bedoeld in het derde lid; of

      c. het bedrag van een tegemoetkoming die toegekend is op grond van [artikel 2.17][ref1].

      5 De tegemoetkoming blijft achterwege voor zover op een andere wijze in een vergoeding of tegemoetkoming ter zake
      is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.17
