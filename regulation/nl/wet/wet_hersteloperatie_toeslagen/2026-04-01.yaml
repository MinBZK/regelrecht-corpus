        afdeling: 2.2a
  - number: 2.14e
    text: |-
      1 Indien het overleden kind geen partner of kind had op de dag van overlijden of indien de situatie, bedoeld in
      [artikel 2.14c, tweede lid][ref1], zich voordoet, kent de Dienst Toeslagen aan de ouder van een overleden kind op
      aanvraag een tegemoetkoming toe.

      2 Als ouder wordt aangemerkt de persoon van wie het overleden kind op de dag van overlijden kind was in de zin
      van [artikel 1.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.14c
      [ref2]: https://wetten.overheid.nl/BWBR0047436#Artikel1.1
