  - number: '7.2'
    text: |-
      Bij regeling van Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kunnen regels worden gesteld over
      een specifieke uitkering aan gemeenten ter bekostiging van verleende kwijtschelding en restitutie op grond van
      [artikel 26a van de Invorderingswet 1990](onbekend) van verschuldigde gemeentelijke belastingen als bedoeld in
      [Hoofdstuk XV, paragrafen 2 en 3, van de Gemeentewet][ref1] alsmede belastingen waarvan de heffing krachtens andere
      wetten door de gemeente geschiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukXV
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel7.2
