  - number: 6.1b
    text: |-
      1 Een aanvraag als bedoeld in de [artikelen 2.9a, eerste lid, onderdelen a en b, of tweede lid][ref1], of
      [2.9b, eerste lid, onderdelen a en b, of tweede lid][ref2], wordt ingediend:

      a. binnen zes maanden na de datum van inwerkingtreding van de [artikelen 2.9a][ref3], onderscheidenlijk
      [artikel 2.9b][ref4], indien de overleden aanvrager is overleden voor of op de datum van inwerkingtreding van die
      artikelen; of

      b. bij overlijden na de inwerkingtreding van [artikel 2.9a][ref5], onderscheidenlijk [artikel 2.9b][ref6], binnen
      zes maanden na de datum van overlijden van de overleden aanvrager.

      2 Indien voorafgaand aan het overlijden van de overleden aanvrager aan die overleden aanvrager geen
      toekenning heeft plaatsgevonden van compensatie als bedoeld in [artikel 2.1, eerste lid][ref7], of van een
      O/GS-tegemoetkoming als bedoeld in [artikel 2.6, eerste lid][ref8], wordt een aanvraag als bedoeld in de
      [artikelen 2.9a, tweede lid][ref9], of [2.9b, tweede lid][ref10], in afwijking van het eerste lid ingediend:

      a. niet eerder dan na toekenning van een voorziening als bedoeld in de
      [artikelen 2.9a, eerste lid, onderdeel a, onder 1° of 2°][ref11], of
      [2.9b, eerste lid, onderdeel a, onder 1° of 2°][ref12], aan de nabestaande; en

      b. uiterlijk zes maanden na de datum waarop:

      1°. de beschikking tot toekenning van een voorziening als bedoeld in onderdeel a onherroepelijk vast komt te staan
      indien het een aanvraag betreft als bedoeld in [artikel 2.9a, tweede lid][ref13]; of

      2°. de beschikking tot toekenning van een voorziening als bedoeld in onderdeel a onherroepelijk is geworden voor
      alle kinderen van de overleden aanvrager die tijdig een aanvraag tot toekenning daarvan hebben ingediend indien het
      een aanvraag betreft als bedoeld in [artikel 2.9b, tweede lid][ref14].


