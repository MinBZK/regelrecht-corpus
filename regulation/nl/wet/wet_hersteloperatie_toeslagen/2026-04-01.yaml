  - number: '7.1'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld over een specifieke uitkering aan gemeenten ter
      bekostiging van door gemeenten te verlenen brede ondersteuning als bedoeld in [artikel 2.21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.21
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel7.1
