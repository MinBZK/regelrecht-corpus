  - number: 6.2ter
    text: |-
      1 Op een aanvraag als bedoeld in [artikel 2.9a, eerste lid, onderdeel a][ref1], besluit de Dienst Toeslagen binnen
      een termijn van zes maanden na ontvangst van de aanvraag. Deze termijn kan eenmaal met maximaal zes maanden worden
      verlengd.

      2 In afwijking van het eerste lid besluit de Dienst Toeslagen op een aanvraag als bedoeld in het eerste lid, die
      is gedaan voor inwerkingtreding van [artikel 2.9a, eerste lid, onderdeel a][ref2], binnen een termijn van zes
      maanden na de datum van inwerkingtreding van dat artikel. Deze termijn kan eenmaal met maximaal zes maanden worden
      verlengd.

      3 Op een aanvraag als bedoeld in [artikel 2.9a, eerste lid, onderdeel b][ref3], besluit Onze Minister binnen
      een termijn van zes maanden na ontvangst van de aanvraag, met dien verstande dat de beslistermijn niet eerder
      verstrijkt dan zes maanden nadat de gedupeerdheid van de aanvrager kinderopvangtoeslag die is overleden, is
      vastgesteld indien die gedupeerdheid nog niet is vastgesteld voordat de aanvraag is ingediend. Deze termijn kan
      eenmaal met maximaal zes maanden worden verlengd.

      4 Op een aanvraag als bedoeld in [artikel 2.9a, tweede lid][ref4], waarop de in [artikel 6.1b, eerste lid][ref5],
      bedoelde aanvraagtermijn van toepassing is, besluit de Dienst Toeslagen binnen een termijn van zes maanden na
      ontvangst van de aanvraag. Deze termijn kan eenmaal met maximaal zes maanden worden verlengd.

      5 In afwijking van het vierde lid besluit de Dienst Toeslagen op een aanvraag als bedoeld in het vierde lid, die is
      gedaan voor inwerkingtreding van [artikel 2.9a, tweede lid][ref6], binnen een termijn van zes maanden na de datum
      van inwerkingtreding van dat artikel. Deze termijn kan eenmaal met maximaal zes maanden worden verlengd.

      6 Op een aanvraag als bedoeld in [artikel 2.9a, tweede lid][ref7], waarop [artikel 6.1b, tweede lid][ref8], van
      toepassing is, besluit de Dienst Toeslagen binnen een termijn van zes maanden na ontvangst van de aanvraag, met
      dien verstande dat de beslistermijn niet eerder verstrijkt dan zes maanden nadat de beschikking tot toekenning van
      een voorziening als bedoeld in artikel 2.9a, eerste lid, onderdeel a, onder 1° of 2°, onherroepelijk is geworden.
      Deze termijn kan eenmaal met maximaal zes maanden worden verlengd.

      7 Op een aanvraag als bedoeld in [artikel 2.9b, eerste lid, onderdeel a][ref9], besluit de Dienst Toeslagen
      binnen een termijn van zes maanden na het verstrijken van de op grond van [artikel 6.1b][ref10] geldende
      aanvraagtermijn. Deze termijn kan eenmaal met maximaal zes maanden worden verlengd.

      8 Op een aanvraag als bedoeld in [artikel 2.9b, eerste lid, onderdeel b][ref11], besluit Onze Minister binnen een
      termijn van zes maanden na het verstrijken van de op grond van [artikel 6.1b][ref12] geldende aanvraagtermijn, met
      dien verstande dat de beslistermijn niet eerder verstrijkt dan zes maanden nadat de gedupeerdheid van de aanvrager
      kinderopvangtoeslag die is overleden, is vastgesteld indien die gedupeerdheid nog niet is vastgesteld voordat de
      aanvraag is ingediend. Deze termijn kan eenmaal met maximaal zes maanden worden verlengd.

      9 Op een aanvraag als bedoeld in [artikel 2.9b, tweede lid][ref13], waarop de in [artikel 6.1b, eerste lid][ref14],
      bedoelde aanvraagtermijn van toepassing is, besluit de Dienst Toeslagen binnen een termijn van zes maanden na het
      verstrijken van de op grond van artikel 6.1b, eerste lid, geldende aanvraagtermijn. Deze termijn kan eenmaal met
      maximaal zes maanden worden verlengd.

      10 Op een aanvraag als bedoeld in [artikel 2.9b, tweede lid][ref15], waarop de in
      [artikel 6.1b, tweede lid][ref16], bedoelde aanvraagtermijn van toepassing is, besluit de Dienst Toeslagen binnen
      een termijn van zes maanden na ontvangst van de aanvraag, met dien verstande dat de beslistermijn niet eerder
      verstrijkt dan zes maanden nadat de beschikking tot toekenning van een voorziening als bedoeld in artikel 2.9b,
      eerste lid, onderdeel a, onder 1° of 2°, onherroepelijk is geworden voor alle kinderen van de overleden aanvrager
      die tijdig een aanvraag tot toekenning daarvan hebben ingediend. Deze termijn kan eenmaal met maximaal zes maanden
      worden verlengd.


