  - number: '6.13'
    text: |-
      1 De Dienst Toeslagen verwerkt gegevens en inlichtingen die betrekking hebben op bijzondere categorieën van
      persoonsgegevens en persoonsgegevens van strafrechtelijke aard, indien dat noodzakelijk is voor het vaststellen
      van een recht op compensatie, een tegemoetkoming, kwijtschelding of overneming van schulden als bedoeld in de
      [hoofdstukken 2][ref1], [3][ref2] en [4][ref3] van deze wet of voor de uitvoering daarvan.

      2 Het college van burgemeester en wethouders verwerkt gegevens en inlichtingen die betrekking hebben op bijzondere
      categorieën van persoonsgegevens en persoonsgegevens van strafrechtelijke aard, indien dat noodzakelijk is voor de
      uitvoering van [artikel 2.21][ref4].

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de voorwaarden waaronder
      verwerking van gegevens en inlichtingen als bedoeld in het eerste en tweede lid kan plaatsvinden.

      4 Indien de verwerking van gegevens en inlichtingen betrekking heeft op een of meer bijzondere categorieën van
      persoonsgegevens of persoonsgegevens van strafrechtelijke aard, wordt voorzien in zodanige waarborgen dat de
      persoonlijke levenssfeer van de betrokkene niet onevenredig wordt geschaad.


