  - number: '2.3'
    text: |-
      1 Het bedrag, bedoeld in [artikel 2.2, onderdeel a][ref1], is gelijk aan het bedrag dat als gevolg van de
      beschikking niet is toegekend of is teruggevorderd, vermeerderd met het bedrag van de rente die is begrepen in een
      beschikking tot terugvordering en verminderd, maar niet verder dan tot nihil, met:

      a. een nog niet betaald bedrag van de terugvordering en van de rente; of

      b. een alsnog toegekende kinderopvangtoeslag of een verhoging daarvan met betrekking tot het berekeningsjaar waarop
      de compensatie betrekking heeft.

      2 Het bedrag, bedoeld in [artikel 2.2, onderdeel b][ref2], is gelijk aan het bedrag van de bestuurlijke boete dat
      is betaald.

      3 Het bedrag, bedoeld in [artikel 2.2, onderdeel c][ref3], is gelijk aan de som van 25% van het bedrag, bedoeld
      in het eerste lid, zonder de verminderingen, en 25% van het bedrag van een bestuurlijke boete als bedoeld in
      artikel 2.2, onderdeel b.

      4 Het bedrag, bedoeld in [artikel 2.2, onderdeel d][ref4], is ongeacht het aantal berekeningsjaren waarop de
      compensatie betrekking heeft, gelijk aan € 500 voor ieder half jaar dat is verstreken tussen de dagtekening van
      een eerste beschikking als bedoeld in artikel 2.2, onderdeel a, en de dagtekening van de eerste beschikking tot
      toekenning van compensatie, waarbij een deel van een half jaar naar boven wordt afgerond op een half jaar, met
      dien verstande dat het bedrag niet hoger is dan de som van de bedragen die overeenkomstig het eerste lid voor de
      berekeningsjaren zijn vastgesteld, zonder de verminderingen.

      5 Het bedrag, bedoeld in [artikel 2.2, onderdeel e][ref5], is gelijk aan de kosten die door de Dienst Toeslagen
      in rekening zijn gebracht en zijn betaald voor invorderingshandelingen in verband met de beschikking, bedoeld in
      artikel 2.2, onderdeel a, met inbegrip van betaalde invorderingsrente.

      6 Het bedrag, bedoeld in [artikel 2.2, onderdeel f][ref6], is een forfaitair bedrag voor de kosten van de door
      een derde beroepsmatig verleende en aan de belanghebbende in rekening gebrachte rechtsbijstand met betrekking tot
      een beschikking als bedoeld in artikel 2.2, onderdeel a, dat is vastgesteld overeenkomstig het Besluit proceskosten
      bestuursrecht, met wegingsfactor 2, waarbij wordt aangenomen dat er geen sprake is van samenhangende zaken,
      verminderd met een reeds toegekende of nog te toe te kennen proceskostenvergoeding.

      7 Het bedrag, bedoeld in [artikel 2.2, onderdeel g][ref7], wordt berekend over het bedrag,
      bedoeld in het eerste lid, zonder de verminderingen, met overeenkomstige toepassing van
      [artikel 27 van de Algemene wet inkomensafhankelijke regelingen][ref8] en de daarop berustende bepalingen, zoals
      dat artikel en die bepalingen luidden op 31 december 2025, en verminderd met rente die is vergoed op grond van een
      alsnog toegekende kinderopvangtoeslag of een verhoging daarvan.

      8 De bedragen, bedoeld in het eerste tot en met zevende lid, worden vermeerderd met 1%.

      9 Het bedrag van de aanvullende compensatie voor de werkelijke schade is de aanvullende werkelijke schade, bedoeld
      in [artikel 2.1, derde lid][ref9], vermeerderd met 1%.


