        hoofdstuk: XV
  - number: '7.3'
    text: |-
      Bij regeling van Onze Minister van Sociale Zaken en werkgelegenheid kunnen regels worden gesteld over een
      specifieke uitkering aan gemeenten ter bekostiging van de door het college van burgemeester en wethouders verleende
      kwijtschelding en restitutie op grond van [artikel 3.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel3.8
