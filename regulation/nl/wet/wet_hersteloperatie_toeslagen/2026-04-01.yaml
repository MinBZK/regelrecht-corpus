  - number: '3.14'
    text: |-
      1 Bij de toepassing van de [artikelen 3.6, vijfde lid][ref1], [3.8, vijfde lid][ref2], en [3.13][ref3] wordt
      de kwijt te schelden schuld of restitutie van de lening, bedoeld in de artikelen 3.6, vijfde lid, en 3.8, vijfde
      lid, en de compensatie voor afgeloste zakelijke bestuursrechtelijke schulden, bedoeld in artikel 3.13, vastgesteld
      op maximaal het bedrag dat de aanvrager nog kan ontvangen als de-minimissteun als bedoeld in artikel 3 van
      [Verordening (EU) nr. 1407/2013](32013R1407) van de Commissie van 18 december 2013 betreffende de toepassing van
      de artikelen 107 en 108 van het Verdrag betreffende de werking van de Europese Unie op de-minimissteun (PbEU 2013,
      L 352), indien degene wiens schulden het betreft, wordt aangemerkt als ondernemer of, indien hij in staat van
      faillissement verkeert en voorafgaand aan het faillissement zou zijn aangemerkt als ondernemer.

      2 De persoon, bedoeld in [artikel 3.8, eerste lid][ref4], verstrekt op verzoek van het college van burgemeester en
      wethouders de gegevens, inlichtingen en documenten die noodzakelijk zijn voor de uitvoering van dit artikel.


