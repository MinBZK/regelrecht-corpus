      1 De Wlz-uitvoerder, bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref1], scheldt ambtshalve schulden
      kwijt die verband houden met de uitvoering van de wettelijke taken op het terrein van Onze Minister van
