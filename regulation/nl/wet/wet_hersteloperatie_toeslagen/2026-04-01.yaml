  - number: '2.21'
    text: |-
      1 Het college van burgemeester en wethouders van een gemeente kan brede ondersteuning bieden op de vijf
      leefgebieden financiën, gezin, werk, wonen en zorg aan een ingezetene van die gemeente die:

      a. een aanvrager van een kinderopvangtoeslag is en een aanvraag heeft ingediend tot toekenning van een
      herstelmaatregel als bedoeld in [artikel 2.7][ref1];

      b. een kind, een pleegkind of een voormalig pleegkind is dat in aanmerking komt voor een tegemoetkoming als bedoeld
      in [artikel 2.12][ref2];

      c. een ex-partner is die in aanmerking komt voor de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref3], en
      aan wie deze is toegekend;

      d. een partner is die in aanmerking komt voor een compensatie of tegemoetkoming, kwijtschelding van
      bestuursrechtelijke schulden of overneming en betaling van privaatrechtelijke schulden van de gedupeerde aanvrager
      kinderopvangtoeslag als bedoeld in [artikel 2.9a][ref4];

      e. een kind is dat in aanmerking komt voor een compensatie of tegemoetkoming, kwijtschelding van
      bestuursrechtelijke schulden of overneming en betaling van privaatrechtelijke schulden van de gedupeerde aanvrager
      kinderopvangtoeslag als bedoeld in [artikel 2.9b][ref5].

      2 Brede ondersteuning als bedoeld in het eerste lid wordt verleend ten behoeve van de personen,
      bedoeld in het eerste lid, onderdelen a tot en met e, alsmede hun gezin als bedoeld in
      [artikel 4, eerste lid, onder c, van de Participatiewet][ref6] en het thuiswonende kind of pleegkind van 18 jaar
      of ouder van de personen, bedoeld in het eerste lid, of van hun partner.

      3 Het eerste en tweede lid zijn in bijzondere omstandigheden van toepassing op een ingezetene van een andere
      gemeente, zo nodig in overleg met het college van die andere gemeente.

      4 Het college van burgemeester en wethouders van een gemeente verleent de brede ondersteuning op basis van een
      plan van aanpak dat ziet op het kunnen maken van een nieuwe start in het kader van herstel dat is opgesteld met
      de persoon die op basis van het eerste lid in aanmerking komt voor brede ondersteuning. Het plan van aanpak wordt
      opgesteld binnen acht weken na het eerste gesprek waarin de hulpvraag voor brede ondersteuning is vastgesteld,
      tussen die persoon en het college van burgemeester en wethouders.

      4a Indien de hulpvraag een of meer materiële voorzieningen betreft, worden die voorzieningen uitsluitend toegekend
      indien die naar het oordeel van het college van burgemeester en wethouders noodzakelijk zijn voor het maken van een
      nieuwe start in het kader van herstel. De toekenning van die voorzieningen vindt plaats binnen zes maanden na het
      eerste gesprek.

      4b Het college van burgemeester en wethouders beëindigt de brede ondersteuning ten behoeve van een persoon als
      bedoeld in het eerste of tweede lid, indien die persoon naar het oordeel van dat college een nieuwe start in het
      kader van herstel heeft kunnen maken, maar uiterlijk twee jaar na het eerste gesprek.

      5 Het college van burgemeester en wethouders van een gemeente kan de uitvoering van dit artikel, behoudens de
      vaststelling van de rechten en plichten van de persoon die op basis van het eerste of tweede lid in aanmerking
      komt voor brede ondersteuning en de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden laten
      verrichten.

      6 Indien de aanvraag tot toekenning van een herstelmaatregel als bedoeld in [artikel 2.7][ref7] wordt
      afgewezen, beëindigt het college van burgemeester en wethouders de brede ondersteuning van de personen die op
      grond van het eerste of tweede lid in aanmerking komen voor brede ondersteuning binnen 30 dagen nadat de Dienst
      Toeslagen het college van burgemeester en wethouders heeft geïnformeerd dat ten aanzien van de aanvrager van de
      kinderopvangtoeslag een afwijzende beschikking is gegeven.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.


