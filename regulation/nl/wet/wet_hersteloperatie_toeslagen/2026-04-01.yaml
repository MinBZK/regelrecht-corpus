  - number: '2.17'
    text: |-
      1 De Dienst Toeslagen kent aan een aanvrager van een huurtoeslag, zorgtoeslag of kindgebonden budget ambtshalve
      een tegemoetkoming toe indien de toepassing van de [Algemene wet inkomensafhankelijke regelingen][ref1], de
      [Wet op de huurtoeslag][ref2], de [Wet op de zorgtoeslag][ref3], de [Wet op het kindgebonden budget][ref4] of
      op die wetten berustende bepalingen bij de uitvoering van de huurtoeslag, zorgtoeslag of het kindgebonden budget
      heeft geleid tot onbillijkheden van overwegende aard omdat aan de aanvrager geen persoonlijke betalingsregeling
      is toegekend of een buitengerechtelijke schuldregeling is geweigerd vanwege de onterechte kwalificatie van opzet
      of grove schuld van de aanvrager of diens partner ten aanzien van het ontstaan van de terugvordering van de
      huurtoeslag, zorgtoeslag of het kindgebonden budget.

      2 De tegemoetkoming bedraagt 30 procent van het bedrag van de terugvordering.

      3 De tegemoetkoming blijft achterwege voor zover op andere wijze in een vergoeding of tegemoetkoming ter zake is
      voorzien.


