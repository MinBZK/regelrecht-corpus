  - number: '4.6'
    text: |-
      1 De Dienst Toeslagen betaalt op aanvraag de schulden van degene die in aanmerking komt voor
      toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref1] en diens partner, bedoeld in
      [artikel 3.1, eerste lid, onderdelen b of c][ref2], op wie de schuldsaneringsregeling, bedoeld in
      [titel III van de Faillissementswet][ref3], toepassing vindt die is ingegaan voor de dag waarop dit
      artikel in werking is getreden of een ex-partner die in aanmerking komt voor de compensatie, bedoeld in
      [artikel 2.14h, eerste lid][ref4], en aan wie deze is toegekend, op wie deze schuldsaneringsregeling toepassing
      vindt en die is ingegaan voor de dag waarop de [Wet aanvullende regelingen hersteloperatie toeslagen][ref5] in
      werking is getreden.

      2 Het bedrag van de te betalen schulden is gelijk aan de som van het bedrag van de vorderingen op de lijst van
      erkende schuldeisers welke zijn geverifieerd overeenkomstig [artikel 328 van de Faillissementswet][ref6].

      3 Een schuld die voortvloeit uit een strafrechtelijke veroordeling ter zake van een misdrijf als bedoeld in
      [artikel 326 van het Wetboek van Strafrecht][ref7] dat in kracht van gewijsde is gegaan binnen vijf jaren voor de
      aanvang van de schuldsaneringsregeling, wordt niet betaald.

      4 De aanvraag tot het geven van een beschikking tot betaling van de schulden geschiedt door de bewindvoerder,
      bedoeld in [artikel 287, derde lid, van de Faillissementswet][ref8], bij de Dienst Toeslagen. De beschikking wordt
      bekendgemaakt aan de bewindvoerder en aan de belanghebbende.

      5 De aanvraag bevat in ieder geval:

      a. het bedrag van de som van de vorderingen op de lijst van erkende schuldeisers, of het bedrag van de som van de
      vorderingen van alle bij de bewindvoerder bekende schuldeisers;

      b. een berekening van de vergoeding, bedoeld in het zesde lid; en

      c. de afschriften van de boedelrekening.

      6 De Dienst Toeslagen betaalt aan de bewindvoerder een vergoeding ter grootte van het salaris vermeerderd
      met de door hem betaalde verschotten en kosten van publicaties, verminderd met eventueel verstrekte
      voorschotten of genoten vergoedingen. Het salaris wordt berekend overeenkomstig het bepaalde bij en
      krachtens [artikel 320, zesde lid, van de Faillissementswet][ref9] waarbij ervan wordt uitgegaan dat de
      schuldsaneringsregeling ten minste drie jaren heeft geduurd. Het salaris wordt verhoogd met € 543 en de daarover
      verschuldigde omzetbelasting.

      7 Nadat uitbetaling van de bedragen, bedoeld in het tweede en zesde lid, heeft plaatsgevonden, gaat de
      bewindvoerder niet over tot vereffening van de boedel als bedoeld in titel III, zevende afdeling, van de
      Faillissementswet en verzoekt hij de rechtbank de toepassing van de schuldsaneringsregeling te beëindigen als
      bedoeld in [artikel 350 van die wet][ref10]. Deze beëindiging wordt aangemerkt als een beëindiging op grond van
      artikel 350, derde lid, onder a, van die wet. [Artikel 320, derde lid, van die wet][ref11] is niet van toepassing.

      8 De voorgaande leden zijn van overeenkomstige toepassing indien op een aanvrager van een kinderopvangtoeslag,
      diens partner of een ex-partner als bedoeld in het eerste lid door heropening op grond van
      [artikel 356, vierde lid, van de Faillissementswet][ref12], van de schuldsaneringsregeling, welke initieel
      is aangevangen voor de dag waarop dit artikel in werking is getreden, opnieuw de schuldsaneringsregeling van
      toepassing is.


