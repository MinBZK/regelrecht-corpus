  - number: '2.8'
    text: |-
      1 De Dienst Toeslagen kan een incidentele noodvoorziening toekennen aan een aanvrager van een kinderopvangtoeslag
      die zich in een acute financiële noodsituatie bevindt waardoor hij noodzakelijke uitgaven niet kan doen, indien hij
      een aanvraag heeft gedaan om toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref1] en de Dienst
      Toeslagen het forfaitaire bedrag, bedoeld in artikel 2.7, eerste lid, of de herstelmaatregel of een eerste betaling
      daarvan, niet op korte termijn aan de aanvrager kan toekennen.

      2 Een aanvrager van een kinderopvangtoeslag komt niet in aanmerking voor een incidentele noodvoorziening indien hij
      geen recht had op een kinderopvangtoeslag en hij dit wist of redelijkerwijze behoorde te weten.


