  - number: 6.10a
    text: |-
      1 In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen
      van een bezwaarschrift dat is gericht tegen een beschikking van de Dienst Toeslagen die op grond van deze wet is
      gegeven zestien weken.

      2 In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref2] vangt de termijn voor het maken van
      bezwaar tegen een beschikking van de Dienst Toeslagen die op grond van deze wet is gegeven aan met ingang van
      de dag na die van dagtekening van de beschikking, tenzij de dag van dagtekening gelegen is vóór de dag van de
      bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel67
