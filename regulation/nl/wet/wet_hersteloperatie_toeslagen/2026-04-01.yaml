  - number: '2.2'
    text: |-
      De compensatie bestaat uit:

      a. een bedrag vanwege een beschikking tot het verminderen of niet toekennen van een kinderopvangtoeslag of
      het beëindigen van voorschotverlening voor een kinderopvangtoeslag die een direct gevolg is van institutionele
      vooringenomenheid als bedoeld in [artikel 2.1, eerste lid, onderdeel a][ref1], of de hardheid, bedoeld in
      artikel 2.1, eerste lid, onderdeel b, vermeerderd met een bedrag voor de rente die is begrepen in een beschikking
      tot terugvordering;

      b. een bedrag voor een bestuurlijke boete die is opgelegd op grond van [artikel 40][ref2] of
      [41 van de Algemene wet inkomensafhankelijke regelingen][ref3] voor een verzuim of vergrijp betreffende de
      kinderopvangtoeslag;

      c. een bedrag voor materiële schade;

      d. een bedrag voor immateriële schade;

      e. een bedrag voor invorderingskosten;

      f. een bedrag voor proceskosten;

      g. een rentevergoeding voor het niet uitgekeerde bedrag vanwege het verminderen of niet toekennen van de
      kinderopvangtoeslag of het beëindigen van de voorschotverlening kinderopvangtoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0018472#Artikel41
