  - number: '2.1'
    text: |-
      1 De Dienst Toeslagen kent op aanvraag compensatie toe aan een aanvrager van een kinderopvangtoeslag, die schade
      heeft geleden, doordat ten aanzien van hem:

      a. voor 23 oktober 2019 bij de uitvoering van de kinderopvangtoeslag sprake is geweest van institutionele
      vooringenomenheid van de Dienst Toeslagen; of

      b. de toepassing van de [Algemene wet inkomensafhankelijke regelingen][ref1], de [Wet kinderopvang][ref2] of de op
      die wetten berustende bepalingen bij de uitvoering van de kinderopvangtoeslag heeft geleid tot onbillijkheden van
      overwegende aard die voortkomen uit de hardheid van de toepassing die voor 23 oktober 2019 werd gegeven aan het
      wettelijke systeem.

      2 De compensatie wordt niet toegekend indien de door de aanvrager van een kinderopvangtoeslag geleden schade is te
      wijten aan ernstige onregelmatigheden die aan hem toerekenbaar zijn.

      3 Aan een aanvrager van compensatie die aannemelijk maakt dat en in welke mate de door hem werkelijk
      geleden schade overeenkomstig het civiele schadevergoedingsrecht hoger is dan een bedrag als bedoeld in
      [artikel 2.3, eerste tot en met zevende lid][ref3], wordt door de Dienst Toeslagen op aanvraag aanvullende
      compensatie voor de werkelijke schade toegekend.

      4 Een aanvrager van een kinderopvangtoeslag als bedoeld in het eerste lid, aanhef en onderdeel b, komt niet in
      aanmerking voor compensatie van schade met betrekking tot een berekeningsjaar waarover minder dan € 1.500 aan
      kinderopvangtoeslag is teruggevorderd of het recht op kinderopvangtoeslag met minder dan € 1.500 is verlaagd.

      5 De compensatie en de aanvullende compensatie voor de werkelijke schade blijven achterwege voor zover op een
      andere wijze in een vergoeding of tegemoetkoming ter zake is voorzien of voor zover aan de aanvrager een O/GS-
      tegemoetkoming als bedoeld in [artikel 49c van de Algemene wet inkomensafhankelijke regelingen][ref4], zoals dit
      luidde ten tijde van de aanvraag van de O/GS-tegemoetkoming, of als bedoeld in [artikel 2.6][ref5] is toegekend.


