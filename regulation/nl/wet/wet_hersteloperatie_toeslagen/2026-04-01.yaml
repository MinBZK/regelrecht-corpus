  - number: '2.4'
    text: |-
      1 De Dienst Toeslagen kan een toegekende compensatie herzien indien de beschikking tot toekenning of herziening van
      de kinderopvangtoeslag alsnog op een hoger bedrag wordt vastgesteld dan waarvan is uitgegaan bij de berekening van
      de hoogte van de compensatie. De herziening bedraagt het hieruit voortvloeiende verschil, doch maximaal het bedrag,
      bedoeld in [artikel 2.2, onderdeel a][ref1].

      2 Indien de compensatie een bedrag omvat voor in rekening gebrachte en betaalde of verrekende invorderingsrente
      of voor rente als bedoeld in [artikel 2.2, onderdeel g][ref2], wordt het bedrag van de compensatie verminderd
      met de rente die op basis van [artikel 27 van de Algemene wet inkomensafhankelijke regelingen][ref3] en de daarop
      berustende bepalingen, zoals dat artikel en die bepalingen luidden op 31 december 2025, wordt vergoed over de
      verhoging, bedoeld in het eerste lid, doch maximaal met het bedrag dat in de compensatie ter zake van de genoemde
      rentecomponenten is begrepen.

      3 Indien de compensatie wordt herzien, kan het daaruit voortvloeiende terug te vorderen bedrag worden verrekend
      met het aan de aanvrager van kinderopvangtoeslag uit te betalen bedrag van de verhoging, bedoeld in het eerste lid,
      eerste zin.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op de beschikking tot terugvordering of
      beschikking tot herziening van de terugvordering.


