  - number: '3.1'
    text: |-
      1 In afwijking van [artikel 31bis van de Algemene wet inkomensafhankelijke regelingen][ref1] scheldt de Dienst
      Toeslagen ambtshalve kwijt het voor 1 januari 2021 nog niet betaalde bedrag van de terugvordering van een toeslag
      die betrekking heeft op een berekeningsjaar van voor 2021, de met die terugvordering samenhangende rente, de
      met die terugvordering samenhangende kosten van invordering alsmede het bedrag van een met die terugvordering
      samenhangende bestuurlijke boete van:

      a. degene die in aanmerking komt voor toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref2];

      b. degene die op de peildatum de partner was van degene, bedoeld in onderdeel a;

      c. degene die op 31 december 2020 de partner was van degene, bedoeld in onderdeel a, mits degene, bedoeld in
      onderdeel a, uiterlijk op 1 juni 2021 heeft verzocht om toepassing van de herstelmaatregel; en

      d. een ex-partner die in aanmerking komt voor de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref3], en aan
      wie deze is toegekend.

      2 De peildatum is de datum waarop het forfaitaire bedrag, bedoeld in [artikel 2.7, eerste lid][ref4], is
      uitbetaald aan degene, bedoeld in het eerste lid, onderdeel a. Indien dit forfaitaire bedrag is verminderd tot
      nihil, is de peildatum de datum waarop aan diegene voor het eerst een bedrag is uitbetaald op grond van een
      herstelmaatregel als bedoeld in artikel 2.7. Indien aan degene, bedoeld in het eerste lid, onderdeel a, slechts
      geen forfaitair bedrag is uitgekeerd vanwege de toepassing van artikel 2.7, tweede lid, eerste zin, en artikel 2.7,
      tweede lid, tweede zin, niet op diegene van toepassing is, is de peildatum de datum waarop het forfaitaire
      bedrag is uitbetaald aan degene aan wie het forfaitaire bedrag op grond van die zin wel is uitbetaald. Indien dit
      forfaitaire bedrag is verminderd tot nihil, is de peildatum de datum waarop aan de laatstbedoelde persoon voor het
      eerst een bedrag is uitbetaald op grond van een herstelmaatregel als bedoeld in artikel 2.7. Indien aan degene,
      bedoeld in het eerste lid, onderdeel a, geen forfaitair bedrag is uitgekeerd vanwege de toepassing van artikel 2.7,
      tweede lid, eerste zin, en artikel 2.7, tweede lid, tweede zin, op diegene van toepassing is, is de peildatum de
      datum waarop het bedrag dat op grond daarvan is toegekend, is uitbetaald aan diegene. Indien het bedrag, bedoeld
      in de vorige zin, is verminderd tot nihil, is de peildatum de datum waarop aan diegene voor het eerst een bedrag is
      uitbetaald op grond van een herstelmaatregel als bedoeld in artikel 2.7.

      3 In afwijking van het eerste lid wordt het voor 1 januari 2021 nog niet betaalde bedrag van de terugvordering
      van een toeslag, die het gevolg is van een herzien voorschot, niet kwijtgescholden voor zover een over hetzelfde
      berekeningsjaar toegekend bedrag van die toeslag op enig moment:

      a. wordt verrekend met die terugvordering; of

      b. kon worden verrekend met die terugvordering indien in 2021 of later geen aflossing van die terugvordering had
      plaatsgevonden.

      4 Indien het nog niet betaalde bedrag, bedoeld in het eerste lid, na 31 december 2020 is verminderd als gevolg van
      een aflossing of verrekening, niet zijnde een verrekening als bedoeld in het derde lid, onderdeel a, betaalt de
      Dienst Toeslagen het bedrag van die vermindering, na aftrek van het bedrag dat op grond van het derde lid, aanhef
      en onderdeel b, niet in aanmerking komt voor kwijtschelding, uit aan degene, bedoeld in het eerste lid, onderdeel
      a, b of c.

      5 Geen kwijtschelding wordt verleend wanneer het ontstaan of niet voldoen van de toeslagschuld het gevolg is van
      ernstig verwijtbaar handelen of nalaten van degene, bedoeld in het eerste lid, onderdeel a, b, of c.


