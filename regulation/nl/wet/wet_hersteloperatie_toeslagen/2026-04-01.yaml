    text: |-
      1 Onze Minister neemt op aanvraag de geldschulden en kosten over op grond van
      [artikel 155 van Boek 6 van het Burgerlijk Wetboek][ref1] van een aanvrager van een kinderopvangtoeslag die in
      aanmerking komt voor toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref2] of diens partner,
      bedoeld in [artikel 3.1, eerste lid, onderdelen b of c][ref3], of een ex-partner die in aanmerking komt voor de
      compensatie, bedoeld in [artikel 2.14h, eerste lid][ref4], en aan wie deze is toegekend, tenzij op die aanvrager,
      die partner of die ex-partner [artikel 4.6][ref5] of [4.7][ref6] van toepassing is.

      2 De geldschulden die worden overgenomen:

      a. zijn ontstaan na 31 december 2005;

      b. waren voor 1 juni 2021 opeisbaar; en

      c. zijn niet voldaan op het tijdstip waarop de aanvraag wordt gedaan.

      3 Geldschulden en kosten die worden overgenomen, zijn:

      a. een geldschuld die is ontstaan door een in de normale uitoefening van een beroep of bedrijf verrichte
      rechtshandeling van de schuldeiser;

      b. een geldschuld die niet is ontstaan door een in de normale uitoefening van een beroep of bedrijf verrichte
      rechtshandeling van de schuldeiser indien deze is vastgelegd in een notariële akte die is verleden in de periode
      tussen 1 januari 2006 en 1 juni 2021 of blijkt uit een rechterlijke uitspraak indien de daaraan voorafgaande
      ingebrekestelling of dagvaarding of het daaraan voorafgaande verzoekschrift dateert van voor 1 juni 2021, waarbij
      geldt dat de zaak bij de rechtbank binnen een redelijke termijn na de dagtekening van de ingebrekestelling
      aanhangig moet zijn gemaakt;

      c. een geldschuld die voortvloeit uit alimentatieverplichtingen;

      d. de bij een overgenomen of over te nemen opeisbare geldschuld bijkomende kosten;

      e. een geldschuld bij een krachtens publiekrecht ingesteld orgaan van een rechtspersoon in het buitenland; en

      f. bestuursrechtelijke geldschulden die niet voor kwijtschelding in aanmerking komen op grond van
      [hoofdstuk 3][ref7].

      4 Geldschulden en kosten die niet worden overgenomen zijn:

      a. de resterende hoofdsom van een hypothecaire lening, ook als die vanwege betalingsachterstanden opeisbaar is
      geworden, tenzij het een restschuld betreft na verkoop van of verhaal op de verhypothekeerde zaak;

      b. de resterende hoofdsommen van andere leningen, tenzij die vanwege betalingsachterstanden opeisbaar zijn
      geworden;

      c. een geldschuld die voortvloeit uit een onrechtmatige daad;

      d. een percentage van de geldschuld aan een rechtspersoon, vennootschap onder firma, commanditaire vennootschap of
      maatschap waarin de aanvrager van de schuldoverneming een belang heeft, dat gelijk is aan het percentage van dat
      belang van de aanvrager van de schuldoverneming;

      e. een geldschuld waarvoor aan de aanvrager van de schuldoverneming reeds compensatie of aanvullende compensatie
      als bedoeld in [artikel 2.1][ref8] of een andere niet-forfaitaire vergoeding is toegekend; of

      f. een geldschuld die al is overgenomen van een aanvrager of diens partner of van een ex-partner.

      5 Indien een schuldeiser geen toestemming geeft tot overneming van een geldschuld, voldoet
      Onze Minister de geldschuld en is de betreffende verbintenis nagekomen als bedoeld in
      [artikel 30 van Boek 6 van het Burgerlijk Wetboek][ref9].


