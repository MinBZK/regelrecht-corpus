  - number: 2.11b
    text: |-
      1 Aan een pleegkind van een ex-partner, die in aanmerking komt voor de compensatie, bedoeld in
      [artikel 2.14h, eerste lid][ref1], en aan wie deze is toegekend, kent de Dienst Toeslagen ambtshalve een
      tegemoetkoming als bedoeld in [artikel 2.12][ref2] toe, indien het pleegkind:

      a. pleegkind van de ex-partner is geworden voordat de ex-partner de partner werd van de aanvrager van een
      kinderopvangtoeslag; en

      b. op 1 januari 2005 jonger was dan 21 jaar of in de periode van 1 januari 2005 tot en met de dag voordat het
      toeslagpartnerschap met de aanvrager van een kinderopvangtoeslag begon, is geboren.

      2 Aan een voormalig pleegkind van een ex-partner, die in aanmerking komt voor de compensatie, bedoeld in
      [artikel 2.14h, eerste lid][ref3], en aan wie deze is toegekend, kent de Dienst Toeslagen ambtshalve een
      tegemoetkoming als bedoeld in [artikel 2.12][ref4] toe, indien het voormalige pleegkind:

      a. pleegkind van de ex-partner is geworden voordat de ex-partner de partner werd van de aanvrager van een
      kinderopvangtoeslag;

      b. onderdeel van het huishouden is geweest van de aanvrager van de kinderopvangtoeslag en diens ex-partner in de
      periode tussen de eerste beschikking van de Dienst Toeslagen waarvoor herstel wordt geboden door middel van de
      herstelmaatregel, tot en met de dag voordat het toeslagpartnerschap tussen de aanvrager van de kinderopvangtoeslag
      en diens ex-partner is geëindigd; en

      c. op 1 januari 2005 jonger was dan 21 jaar of in de periode van 1 januari 2005 tot en met de dag voordat het
      toeslagpartnerschap met de aanvrager van een kinderopvangtoeslag begon, is geboren.

      3 [Artikel 2.14g, zesde lid][ref5], is van overeenkomstige toepassing.


