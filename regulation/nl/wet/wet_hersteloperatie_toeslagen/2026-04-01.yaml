  - number: '2.15'
    text: |-
      1 Onze Minister kan ambtshalve brede ondersteuning in het buitenland aanbieden op de vijf leefgebieden financiën,
      gezin, werk, wonen en zorg aan een aanvrager van een kinderopvangtoeslag die in aanmerking komt voor toepassing van
      een herstelmaatregel als bedoeld in [artikel 2.7][ref1], ten behoeve van die aanvrager, diens partner en het kind,
      pleegkind of voormalig pleegkind van een van beiden, indien:

      a. die aanvrager op 31 december 2021 niet in Nederland woonde;

      b. die aanvrager, die partner en dat kind, pleegkind of voormalig pleegkind van een van beiden op het moment van
      ambtshalve toetsing door Onze Minister niet in Nederland woont.

      2 Voor zover de brede ondersteuning wordt geboden in de vorm van een financiële tegemoetkoming, wordt deze
      tegemoetkoming verstrekt ter vergoeding van redelijke kosten die worden gemaakt in het kader van de brede
      ondersteuning.

      3 In geval van een wens tot remigratie naar Nederland van de aanvrager, diens partner of een kind of pleegkind van
      een van hen, die binnen drie maanden na het ambtshalve aanbod, bedoeld in het eerste lid, kenbaar is gemaakt aan
      Onze Minister kan Onze Minister op verzoek eenmalig:

      a. de redelijke reiskosten van remigratie van ieder van hen vergoeden of voor zijn rekening nemen, mits de partner
      of het kind of pleegkind voor de remigratie naar Nederland op hetzelfde adres buiten Nederland wonen als de
      aanvrager; en

      b. de redelijke kosten van de verhuizing naar Nederland voor zijn rekening nemen.

      4 Onze Minister verleent de ondersteuning, bedoeld in het eerste, tweede of derde lid, op basis van een plan van
      aanpak dat in overleg met de aanvrager van de kinderopvangtoeslag is opgesteld.

      5 Onze Minister vergoedt of neemt voor zijn rekening de kosten, bedoeld in het derde lid, indien het plan van
      aanpak is vastgesteld voor 1 juli 2025 en indien de remigratie naar Nederland plaatsvindt uiterlijk een jaar nadat
      het plan van aanpak is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.7
