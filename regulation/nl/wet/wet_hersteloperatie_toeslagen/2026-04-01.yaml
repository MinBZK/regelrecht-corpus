  - number: 2.15b
    text: |-
      1 Onze Minister kan ambtshalve brede ondersteuning in het buitenland aanbieden:

      a. op de vijf leefgebieden financiën, gezin, werk, wonen en zorg aan een partner van een overleden aanvrager
      die in aanmerking komt voor een compensatie of tegemoetkoming, kwijtschelding van bestuursrechtelijke schulden
      of overneming en betaling van privaatrechtelijke schulden van de gedupeerde aanvrager kinderopvangtoeslag
      als bedoeld in [artikel 2.9a][ref1], ten behoeve van die partner van een overleden aanvrager, diens partner,
      diens kind, pleegkind of voormalig pleegkind dat in aanmerking komt voor een tegemoetkoming als bedoeld in
      [artikel 2.12][ref2], en het thuiswonende kind of pleegkind van hemzelf of van diens partner, indien:

      1°. die partner van een overleden aanvrager op 31 december 2021 niet in Nederland woonde;

      2°. die partner van een overleden aanvrager, diens partner, diens kind, pleegkind of voormalig pleegkind dat in
      aanmerking komt voor een tegemoetkoming als bedoeld in [artikel 2.12][ref3], en het thuiswonende kind of pleegkind
      van hemzelf of van diens partner op het moment van ambtshalve toetsing door Onze Minister niet in Nederland woont;

      b. op de vier leefgebieden financiën, werk, wonen en zorg aan een kind van een overleden aanvrager dat in
      aanmerking komt voor een compensatie of tegemoetkoming, kwijtschelding van bestuursrechtelijke schulden of
      overneming en betaling van privaatrechtelijke schulden van de gedupeerde aanvrager kinderopvangtoeslag als bedoeld
      in [artikel 2.9b][ref4], indien dat kind op 7 juli 2020 niet in Nederland woonde en op het moment van ambtshalve
      toetsing door Onze Minister niet in Nederland woont.

      2 Voor zover de brede ondersteuning wordt geboden in de vorm van een financiële tegemoetkoming, wordt deze
      tegemoetkoming verstrekt ter vergoeding van redelijke kosten die worden gemaakt in het kader van de brede
      ondersteuning.

      3 In geval van een wens tot remigratie naar Nederland die binnen drie maanden na het ambtshalve aanbod, bedoeld in
      het eerste lid, kenbaar is gemaakt aan Onze Minister kan Onze Minister op verzoek van:

      a. de partner van een overleden aanvrager, diens partner, diens kind, pleegkind of voormalig pleegkind dat in
      aanmerking komt voor een tegemoetkoming als bedoeld in [artikel 2.12][ref5], en het thuiswonende kind of pleegkind
      van hemzelf of van diens partner eenmalig de redelijke reiskosten van remigratie van ieder van hen vergoeden of
      voor zijn rekening nemen, mits voornoemde gezinsleden voor de remigratie naar Nederland op hetzelfde adres buiten
      Nederland wonen als die partner van een overleden aanvrager en eenmalig de redelijke kosten van de verhuizing naar
      Nederland voor zijn rekening nemen; of

      b. het kind van een overleden aanvrager eenmalig de redelijke reiskosten van remigratie vergoeden of voor zijn
      rekening nemen en eenmalig de redelijke kosten van de verhuizing naar Nederland voor zijn rekening nemen.

      4 Onze Minister verleent de ondersteuning, bedoeld in het eerste, tweede of derde lid, op basis van een plan
      van aanpak dat in overleg met de partner of het kind van een overleden aanvrager van een kinderopvangtoeslag is
      opgesteld.

      5 Onze Minister vergoedt of neemt voor zijn rekening de kosten, bedoeld in het derde lid, indien het plan van
      aanpak is vastgesteld binnen drie maanden nadat de wens tot remigratie kenbaar is gemaakt en indien de remigratie
      naar Nederland plaatsvindt uiterlijk een jaar nadat het plan van aanpak is vastgesteld.


