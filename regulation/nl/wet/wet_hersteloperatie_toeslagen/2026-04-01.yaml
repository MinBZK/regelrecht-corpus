  - number: '6.8'
    text: |-
      1 Uitbetaling van compensatie of aanvullende compensatie voor de werkelijke schade als bedoeld in
      [artikel 2.1][ref1] of [artikel 2.14h][ref2], een O/GS-tegemoetkoming of een aanvullende O/GS-
      tegemoetkoming voor de werkelijke schade als bedoeld in [artikel 2.6][ref3], het forfaitaire bedrag,
      bedoeld in [artikel 2.7, eerste lid][ref4], het bedrag van maximaal € 10.000, bedoeld in artikel 2.7,
      tweede lid, een incidentele noodvoorziening als bedoeld in [artikel 2.8][ref5], [artikel 2.14i][ref6] of
      [2.18][ref7], een tegemoetkoming of vergoeding als bedoeld in [artikel 2.15, tweede of derde lid][ref8],
      [artikel 2.15a, tweede of derde lid][ref9], of [artikel 2.15b, tweede en derde lid][ref10], een tegemoetkoming
      als bedoeld in [artikel 2.16][ref11] of [2.17][ref12], compensatie voor afgeloste bestuursrechtelijke schulden
      als bedoeld in [artikel 3.13][ref13] of compensatie voor afgeloste privaatrechtelijke geldschulden en kosten als
      bedoeld in [artikel 4.3][ref14] vindt plaats op een daartoe door de rechthebbende bestemde bankrekening die op
      diens naam staat.

      2 Uitbetaling van een tegemoetkoming als bedoeld in [artikel 2.12][ref15] vindt indien het kind, pleegkind of
      voormalige pleegkind meerderjarig is, plaats op een daartoe door hem bestemde bankrekening die op diens naam staat.

      3 Uitbetaling van een tegemoetkoming als bedoeld in [artikel 2.12][ref16] vindt indien het kind, pleegkind of
      voormalige pleegkind minderjarig is, plaats op een bankrekening die daartoe is bestemd door diens wettelijke
      vertegenwoordiger en op naam staat van het kind, pleegkind of voormalige pleegkind.

      4 Uitbetaling van een kostenvergoeding als bedoeld in [artikel 4.4][ref17] vindt plaats op een daartoe door de
      curator of de bewindvoerder, bedoeld in artikel 4.4, eerste lid, bestemde bankrekening.

      5 Uitbetaling van een vergoeding als bedoeld in [artikel 4.6, zesde lid][ref18], en betaling van de schulden,
      bedoeld in artikel 4.6, tweede lid, vindt plaats op een daartoe door de bewindvoerder, bedoeld in artikel 4.6,
      vierde lid, bestemde bankrekening.

      6 Uitbetaling van een vergoeding als bedoeld in [artikel 4.7, vijfde lid][ref19], en betaling van de schulden,
      bedoeld in 4.7, tweede lid, vindt plaats op een daartoe door de werkgever, de persoon, de instelling of de
      gemeentelijke kredietbank, bedoeld in artikel 4.7, eerste lid, bestemde bankrekening.

      7 Een rechthebbende als bedoeld in het eerste lid, een kind, pleegkind of voormalig pleegkind als bedoeld in
      het tweede lid, een wettelijke vertegenwoordiger als bedoeld in het derde lid, een curator of bewindvoerder als
      bedoeld in het vierde lid, een bewindvoerder als bedoeld in het vijfde lid, een werkgever, persoon, instelling of
      gemeentelijke kredietbank als bedoeld in het zesde lid, of een rechthebbende of een wettelijke vertegenwoordiger
      als bedoeld in het negende lid kan niet meer dan één bankrekening bestemmen voor de uitbetaling.

      8 Indien een rechthebbende als bedoeld in het eerste lid, een kind, pleegkind of voormalig pleegkind als bedoeld
      in het tweede lid, een wettelijke vertegenwoordiger als bedoeld in het derde lid, een curator of bewindvoerder
      als bedoeld in het vierde lid, een bewindvoerder als bedoeld in het vijfde lid, een werkgever, persoon,
      instelling of gemeentelijke kredietbank als bedoeld in het zesde lid, of een rechthebbende of een wettelijke
      vertegenwoordiger als bedoeld in het negende lid niet binnen een redelijke termijn een bankrekening heeft bestemd
      voor de uitbetaling, vindt de uitbetaling plaats op een bankrekening die op naam staat van de rechthebbende,
      het kind, pleegkind of voormalige pleegkind, de wettelijke vertegenwoordiger, de curator, de bewindvoerder, de
      werkgever, persoon, instelling of gemeentelijke kredietbank, onderscheidenlijk de rechthebbende of de wettelijke
      vertegenwoordiger, bedoeld in het negende lid.

      9 Uitbetaling van een voorziening, aanvullende compensatie of een aanvullende O/GS-tegemoetkoming als bedoeld in
      de [artikelen 2.9a][ref20] of [2.9b][ref21] of van een tegemoetkoming als bedoeld in [artikel 2.14f][ref22] vindt
      plaats op een daartoe door de rechthebbende bestemde bankrekening die op diens naam staat. Indien de rechthebbende
      minderjarig is, vindt de uitbetaling plaats op een bankrekening die daartoe is bestemd door diens wettelijke
      vertegenwoordiger en die op naam staat van de rechthebbende.


