  - number: 2.14h
    text: |-
      1 De Dienst Toeslagen kent op aanvraag een compensatie van € 10.000 toe aan een ex-partner, met dien verstande dat
      de compensatie nihil bedraagt indien een ex-partner eerder compensatie heeft ontvangen op grond van dit lid.

      2 De ex-partner doet de aanvraag, bedoeld in het eerste lid, via een daartoe door de Dienst Toeslagen ter
      beschikking gesteld formulier.

      3 Compensatie blijft achterwege voor zover op een andere wijze in een vergoeding of tegemoetkoming is voorzien
      ter zake van geleden schade als gevolg van een beschikking vanwege institutionele vooringenomenheid of hardheid
      of een beschikking vanwege een onterechte kwalificatie opzet of grove schuld. Onder vergoeding of tegemoetkoming
      als bedoeld in de eerste zin wordt niet verstaan een bedrag dat de ex-partner heeft ontvangen van de aanvrager van
      een kinderopvangtoeslag vanwege het met de ex-partner delen van een tegemoetkoming of compensatie die de aanvrager
      heeft ontvangen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel2.14h
  - number: 2.14i
    text: |-
      Indien de Dienst Toeslagen niet op korte termijn overgaat tot uitbetaling van compensatie als bedoeld in
      [artikel 2.14h, eerste lid][ref1], kan de Dienst Toeslagen een incidentele noodvoorziening toekennen aan een
      ex-partner, aan wie de compensatie, bedoeld in artikel 2.14h, eerste lid, is toegekend en die zich in een acute
      financiële noodsituatie bevindt waardoor noodzakelijke uitgaven niet mogelijk zijn.


