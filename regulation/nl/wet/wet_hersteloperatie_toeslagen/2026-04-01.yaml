  - number: '2.18'
    text: |-
      1 De Dienst Toeslagen kan een incidentele noodvoorziening toekennen aan een aanvrager van een huurtoeslag,
      zorgtoeslag of kindgebonden budget die zich in een acute financiële noodsituatie bevindt waardoor hij noodzakelijke
      uitgaven niet kan doen, indien:

      a. aannemelijk is dat de acute financiële noodsituatie mogelijk een gevolg is van:

      1°. institutionele vooringenomenheid van de Dienst Toeslagen die voor 23 oktober 2019 heeft plaatsgevonden tijdens
      een onderzoek van het Combiteam Aanpak Facilitators bij de uitvoering van de huurtoeslag, zorgtoeslag of het
      kindgebonden budget; of

      2°. het niet toekennen van een persoonlijke betalingsregeling of het weigeren van een buitengerechtelijke
      schuldregeling vanwege de onterechte kwalificatie van opzet of grove schuld van hemzelf of zijn partner ten aanzien
      van het ontstaan van de terugvordering van de huurtoeslag, zorgtoeslag of het kindgebonden budget; en

      b. hij zich kenbaar heeft gemaakt bij de Dienst Toeslagen als iemand die mogelijk aanspraak maakt op een
      tegemoetkoming als gevolg van een situatie als bedoeld in onderdeel a, onder 1° of 2°.

      2. Een aanvrager komt niet in aanmerking voor een incidentele noodvoorziening, indien hij geen recht heeft op de
      huurtoeslag, zorgtoeslag of het kindgebonden budget en hij dit wist of redelijkerwijze behoorde te weten.
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel2.18
  - number: '2.19'
    text: |-
      1 In bij algemene maatregel van bestuur aan te wijzen gevallen kan een bijzondere tegemoetkoming
      worden toegekend indien sprake is van een schrijnend geval waarin de toepassing van de
      [Algemene wet inkomensafhankelijke regelingen][ref1], de [Wet op de huurtoeslag][ref2], de
      [Wet op de zorgtoeslag][ref3], de [Wet op het kindgebonden budget][ref4] of een op een van die wetten berustende
      bepaling bij de uitvoering van de huurtoeslag, zorgtoeslag of het kindgebonden budget heeft geleid tot ernstige
      onbillijkheden van overwegende aard, die zich hebben voorgedaan bij een beschikking tot vaststelling of tot
      terugvordering inzake de huurtoeslag, de zorgtoeslag en het kindgebonden budget, dan wel bij het niet toekennen van
      een persoonlijke betalingsregeling of het weigeren van een buitengerechtelijke schuldregeling vanwege de onterechte
      kwalificatie opzet of grove schuld van de aanvrager of van diens partner ten aanzien van het ontstaan van de
      terugvordering inzake de huurtoeslag, zorgtoeslag of het kindgebonden budget, welke onbillijkheden zodanig zijn dat
      het overduidelijk onredelijk is deze voor rekening van de aanvrager te laten.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan twee weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd. Indien binnen die
      termijn door of namens een van de Kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een
      van de Kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt
      geregeld, wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.


