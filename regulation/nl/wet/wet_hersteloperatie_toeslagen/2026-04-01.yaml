  - number: '6.10'
    text: |-
      1 De Dienst Toeslagen kan compensatie als bedoeld in [artikel 2.1, eerste lid][ref1], of
      [artikel 2.14h, eerste lid][ref2], aanvullende compensatie voor de werkelijke schade als bedoeld in artikel 2.1,
      derde lid, een O/GS-tegemoetkoming als bedoeld in [artikel 2.6, eerste lid][ref3], of een aanvullende O/GS-
      tegemoetkoming voor de werkelijke schade als bedoeld in artikel 2.6, derde lid, terugvorderen van de aanvrager,
      indien hij de aanvraag heeft ingediend nadat dit artikel in werking is getreden en hij bij de aanvraag opzettelijk
      onjuiste informatie heeft verstrekt of geen recht had op toekenning van de compensatie, de aanvullende compensatie
      voor de werkelijke schade, de O/GS-tegemoetkoming of de aanvullende O/GS-tegemoetkoming voor de werkelijke schade
      en hij dit wist of redelijkerwijze behoorde te weten.

      2 De Dienst Toeslagen kan het forfaitaire bedrag, bedoeld in [artikel 2.7, eerste lid][ref4], terugvorderen van de
      aanvrager van een herstelmaatregel als bedoeld in artikel 2.7 indien hij de aanvraag van de herstelmaatregel heeft
      ingediend na 19 maart 2021 en bij de aanvraag opzettelijk onjuiste informatie heeft verstrekt of geen recht had op
      toekenning van een herstelmaatregel en hij dit wist of redelijkerwijze behoorde te weten.

      3 Onze Minister kan een financiële tegemoetkoming als bedoeld in [artikel 2.15, tweede lid][ref5], of
      [artikel 2.15a, tweede lid][ref6], terugvorderen, indien degene die een aanvraag heeft ingediend om toepassing van
      een herstelmaatregel als bedoeld in [artikel 2.7][ref7] onderscheidenlijk een aanvraag heeft ingediend als bedoeld
      in [artikel 2.14h, eerste lid][ref8], bij het opstellen van het plan van aanpak, bedoeld in artikel 2.15, vierde
      lid, onderscheidenlijk artikel 2.15a, vierde lid, opzettelijk onjuiste informatie heeft verstrekt of geen recht had
      op toekenning van een herstelmaatregel als bedoeld in artikel 2.7, onderscheidenlijk op toekenning van compensatie
      als bedoeld in artikel 2.14h, eerste lid, en de aanvrager dit wist of redelijkerwijze behoorde te weten.

      4 Onze Minister kan compensatie voor afgeloste bestuursrechtelijke schulden als bedoeld in
      [artikel 3.13, eerste lid][ref9], of compensatie voor afgeloste privaatrechtelijke schulden als bedoeld in
      [artikel 4.3, eerste lid][ref10], terugvorderen van de aanvrager, indien hij de aanvraag heeft ingediend nadat
      dit artikel in werking is getreden en hij bij de aanvraag opzettelijk onjuiste informatie heeft verstrekt of geen
      recht had op compensatie voor afgeloste bestuursrechtelijke schulden respectievelijk compensatie voor afgeloste
      privaatrechtelijke schulden en hij dit wist of redelijkerwijze behoorde te weten.

      5 De Dienst Toeslagen kan compensatie of tegemoetkoming die is verstrekt op grond van de artikelen 2.9a of 2.9b
      terugvorderen van de aanvrager, indien deze aanvrager opzettelijk onjuiste informatie heeft verstrekt of geen recht
      had op die compensatie of tegemoetkoming en de aanvrager dit wist of redelijkerwijze behoorde te weten.

      6 Onze Minister kan een financiële tegemoetkoming als bedoeld in artikel 2.15b, tweede lid, terugvorderen,
      indien de partner of het kind van een overleden aanvrager bij het opstellen van het plan van aanpak, bedoeld in
      artikel 2.15b, vierde lid, opzettelijk onjuiste informatie heeft verstrekt of geen recht had op toekenning van een
      voorziening als bedoeld in artikel 2.9a onderscheidenlijk artikel 2.9b en hij dit wist of redelijkerwijze behoorde
      te weten.


