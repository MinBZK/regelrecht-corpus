  - number: '2.12'
    text: |-
      1 De tegemoetkoming bedraagt voor een kind, pleegkind of voormalig pleegkind dat op 1 juli 2023:

      a. jonger is dan zes jaar: € 2.000;

      b. ten minste zes jaar is, maar jonger is dan twaalf jaar: € 4.000;

      c. ten minste twaalf jaar is, maar jonger is dan vijftien jaar: € 6.000;

      d. ten minste vijftien jaar is, maar jonger is dan achttien jaar: € 8.000;

      e. ten minste achttien jaar is: € 10.000.

      2 Een kind, pleegkind of voormalig pleegkind komt eenmaal in aanmerking voor de tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel2.12
  - number: '2.13'
    text: |-
      Een kind als bedoeld in [artikel 2.10][ref1], een pleegkind als bedoeld in [artikel 2.11, eerste lid][ref2],
      of een voormalig pleegkind als bedoeld in artikel 2.11, tweede lid, kan een aanvraag doen tot toekenning van een
      tegemoetkoming als bedoeld in [artikel 2.12][ref3] indien:

      a. de Dienst Toeslagen de beschikking tot het toepassen van een herstelmaatregel als bedoeld in
      [artikel 2.7][ref4] heeft bekendgemaakt; en

      b. de Dienst Toeslagen de beschikking tot toekenning van de tegemoetkoming niet ambtshalve binnen zes maanden na de
      datum, bedoeld in [artikel 6.4, onderdeel a of b][ref5], heeft vastgesteld.


