      1 Onze Minister verleent op aanvraag compensatie voor afgeloste bestuursrechtelijke schulden aan degene die voor
      1 januari 2021 een bedrag heeft ontvangen op grond van een herstelmaatregel als bedoeld in [artikel 2.7][ref1],
      als diegene tussen het moment van het ontvangen van dat bedrag en 1 januari 2021 een bedrag heeft afgelost
      aan bestuursrechtelijke schulden of aan een ex-partner, die in aanmerking komt voor de compensatie, bedoeld in
      [artikel 2.14h, eerste lid][ref2], en aan wie deze is toegekend, als die ex-partner tussen het moment van het
      ontvangen van dat bedrag en de kwijtschelding van de bestuursrechtelijke schulden op grond van dit hoofdstuk een
      bedrag heeft afgelost aan bestuursrechtelijke schulden.

      2 Het bedrag van de compensatie voor afgeloste bestuursrechtelijke schulden is gelijk aan het bedrag dat de
      aanvrager van kinderopvangtoeslag dan wel de ex-partner in de respectievelijke perioden, bedoeld in het eerste lid,
      heeft afgelost aan bestuursrechtelijke schulden.

      3 De som van de compensatie voor afgeloste bestuursrechtelijke schulden en de compensatie voor afgeloste
      geldschulden en kosten als bedoeld in [artikel 4.3][ref3] is maximaal het bedrag dat de aanvrager van
      kinderopvangtoeslag ontvangen heeft op grond van een herstelmaatregel dan wel de ex-partner heeft ontvangen op
      grond van [artikel 2.14h, eerste lid][ref4].

      4 Voor de toepassing van dit artikel wordt onder een bestuursrechtelijke schuld verstaan een schuld die door een
      overheidsorganisatie zou zijn kwijtgescholden in het kader van de hersteloperatie kinderopvangtoeslag indien deze
      schuld niet voor 1 januari 2021 zou zijn afgelost.


