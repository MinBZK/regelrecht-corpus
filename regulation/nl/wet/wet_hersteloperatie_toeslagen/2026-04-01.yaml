  - number: '6.9'
    text: |-
      1 Uitbetaling van het voorlopige bedrag van de compensatie, bedoeld in [artikel 6.7, eerste lid][ref1], vindt
      plaats door de Dienst Toeslagen bij de bekendmaking van de vooraankondiging.

      2 Uitbetaling van het bedrag van de compensatie, bedoeld in [artikel 6.7, vierde lid][ref2], vindt plaats door de
      Dienst Toeslagen bij de vaststelling dit bedrag, onder aftrek van het bedrag dat reeds bij de bekendmaking van de
      vooraankondiging is uitbetaald.

      3 Uitbetaling van het forfaitaire bedrag, bedoeld in [artikel 2.7, eerste lid][ref3], vindt plaats door de Dienst
      Toeslagen binnen zes maanden na ontvangst van de aanvraag van een herstelmaatregel als bedoeld in artikel 2.7.

      4 Uitbetaling van het bedrag van maximaal € 10.000, bedoeld in [artikel 2.7, tweede lid][ref4], vindt plaats door
      de Dienst Toeslagen binnen zes maanden na inwerkingtreding van dit lid of, indien dit later is, binnen zes maanden
      na ontvangst van de aanvraag van een herstelmaatregel als bedoeld in artikel 2.7.

      5 Uitbetaling van een tegemoetkoming als bedoeld in [artikel 2.12][ref5] vindt plaats door de Dienst Toeslagen
      binnen vier weken nadat de beschikking tot toekenning is bekendgemaakt of, indien het kind, pleegkind of voormalig
      pleegkind dan wel, als hij minderjarig is, diens wettelijke vertegenwoordiger daarom heeft verzocht, op een latere
      datum, doch niet later dan 31 december 2025. In afwijking van de eerste zin kan een kind, pleegkind of voormalig
      pleegkind, dan wel als hij minderjarig is, diens wettelijk vertegenwoordiger, verzoeken om uitstel van uitbetaling
      tot een jaar na dagtekening van de beschikking tot toekenning van een tegemoetkoming indien die beschikking na
      31 december 2024 is bekendgemaakt.

      6 Uitbetaling van een tegemoetkoming als bedoeld in [artikel 2.16][ref6] of [2.17][ref7] vindt plaats door de
      Dienst Toeslagen binnen vier weken nadat de beschikking tot toekenning is bekendgemaakt of, indien de rechthebbende
      daarom heeft verzocht, op een latere datum, doch niet later dan een jaar na dagtekening van de beschikking tot
      toekenning van die tegemoetkoming.

      7 Uitbetaling van een tegemoetkoming of vergoeding als bedoeld in [artikel 2.15, tweede of derde lid][ref8],
      [artikel 2.15a, tweede of derde lid][ref9], of [artikel 2.15b, tweede of derde lid][ref10], door Onze Minister
      en uitbetaling door de Dienst Toeslagen van een vergoeding als bedoeld in [artikel 4.6, zesde lid][ref11], of
      [artikel 4.7, vijfde lid][ref12], en betaling van schulden als bedoeld in artikel 4.6, tweede lid, of 4.7, tweede
      lid, vindt plaats binnen vier weken nadat de beschikking tot toekenning is bekendgemaakt.

      8 Een tegemoetkoming als bedoeld in [artikel 2.16][ref13] of [2.17][ref14] wordt niet betaald indien zij minder
      dan € 24 bedraagt.

      9 Uitbetaling van de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref15], vindt plaats door de Dienst
      Toeslagen binnen zes weken nadat de beschikking tot toekenning is bekendgemaakt of op een later moment indien de
      ex-partner daarom heeft verzocht, doch niet later dan een jaar na dagtekening van de beschikking tot toekenning van
      die compensatie.

      10 Uitbetaling van een voorziening, aanvullende compensatie of een aanvullende O/GS-tegemoetkoming als bedoeld in
      de [artikelen 2.9a][ref16] of [2.9b][ref17] of van een tegemoetkoming als bedoeld in [artikel 2.14f][ref18] vindt
      plaats door de Dienst Toeslagen binnen zes weken nadat de beschikking tot toekenning daarvan is bekendgemaakt of
      op een later moment indien de rechthebbende daarom heeft verzocht, doch niet later dan een jaar na dagtekening van
      die beschikking.


