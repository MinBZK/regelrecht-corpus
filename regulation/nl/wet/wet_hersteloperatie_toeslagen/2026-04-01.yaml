  - number: '2.6'
    text: |-
      1 De Dienst Toeslagen kent aan een aanvrager van een kinderopvangtoeslag op aanvraag een O/GS-tegemoetkoming toe
      indien de toepassing van de [Algemene wet inkomensafhankelijke regelingen][ref1], de daarop berustende bepalingen
      of de [Wet kinderopvang][ref2] bij de uitvoering van de kinderopvangtoeslag heeft geleid tot onbillijkheden
      van overwegende aard, omdat aan hem geen persoonlijke betalingsregeling is toegekend of een buitengerechtelijke
      schuldregeling is geweigerd vanwege de onterechte kwalificatie van opzet of grove schuld van hemzelf of zijn
      partner ten aanzien van het ontstaan van de terugvordering van de kinderopvangtoeslag.

      2 De O/GS-tegemoetkoming bedraagt 30 procent van het bedrag van de terugvordering.

      3 Aan een aanvrager van een O/GS-tegemoetkoming die aannemelijk maakt dat en in welke mate de door hem werkelijk
      geleden schade als gevolg van de onbillijkheden van overwegende aard, bedoeld in het eerste lid, overeenkomstig het
      civiele schadevergoedingsrecht hoger is dan de O/GS-tegemoetkoming, wordt door de Dienst Toeslagen op aanvraag een
      aanvullende O/GS-tegemoetkoming voor de werkelijke schade toegekend.

      4 De O/GS-tegemoetkoming en de aanvullende O/GS-tegemoetkoming voor de werkelijke schade blijven achterwege indien
      ten aanzien van de terugvordering recht bestaat op compensatie als bedoeld in [artikel 2.1][ref3] over hetzelfde
      berekeningsjaar of voor zover op andere wijze in een vergoeding of tegemoetkoming ter zake is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0017017
      [ref3]: https://wetten.overheid.nl/BWBR0047436#Artikel2.1
