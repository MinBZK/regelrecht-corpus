  - number: 4a.6
    text: |-
      Op verzoek van de betrokkene voegt de Dienst Toeslagen voor zover mogelijk alle beschikkingen op grond van deze wet
      die de betrokkene betreffen samen tot één beschikking, die bestaat uit één of meer besluitonderdelen.
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel4a.6
  - number: '5.1'
    text: |-
      1 Bij ministeriële regeling stelt Onze Minister een commissie in bestaande uit gedupeerde aanvragers van een
      kinderopvangtoeslag of hun partners.

      2 De commissie heeft tot taak het gevraagd en ongevraagd adviseren van Onze Minister over de uitvoering, de
      juridische aspecten en het beleid van en de communicatie over de hersteloperatie, gericht op het herstellen
      van de problemen met betrekking tot de kinderopvangtoeslag, mede naar aanleiding van het eindrapport van de
      Adviescommissie uitvoering Toeslagen.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de commissie.
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 Bij ministeriële regeling stelt Onze Minister commissies in met het oog op de uitvoering van de
      [artikelen 2.1 tot en met 2.6][ref1], [2.9, eerste lid][ref2], [2.9a][ref3] en [2.9b][ref4].

      2 De commissies hebben tot taak het dossier van een aanvrager van een kinderopvangtoeslag of de partner of het
      kind van een overleden aanvrager dat door de Dienst Toeslagen aan hen is voorgelegd te voorzien van een advies
      over de toepassing van de [artikelen 2.1 tot en met 2.6][ref5] en [2.9, eerste lid][ref6], onderscheidenlijk
      de [artikelen 2.9a][ref7] en [2.9b][ref8]. De Dienst Toeslagen verstrekt daartoe aan de betrokken commissie een
      afschrift van de op de zaak betrekking hebbende gegevens, waaronder mede wordt begrepen de informatie die niet aan
      het dossier is toegevoegd, maar wel van invloed is geweest op de beoordeling of behandeling ervan.

      3 De Dienst Toeslagen zendt de beschikking omtrent de toepassing van de [artikelen 2.1 tot en met 2.6][ref9] en
      [2.9, eerste lid][ref10], onderscheidenlijk de [artikelen 2.9a][ref11] en [2.9b][ref12], aan de aanvrager van een
      kinderopvangtoeslag, onderscheidenlijk de partner of het kind van een overleden aanvrager, tezamen met het advies
      van de betrokken commissie en de gegevens die direct ten grondslag liggen aan de beschikking. Indien de beschikking
      in het nadeel van de aanvrager van een kinderopvangtoeslag, onderscheidenlijk de partner of het kind van een
      overleden aanvrager, afwijkt van het advies van de commissie, wordt in de beschikking de reden voor die afwijking
      vermeld.

      4 De Dienst Toeslagen verstrekt desgevraagd tevens het onderzoekdossier, inclusief die informatie die niet aan
      het dossier is toegevoegd, maar wel van invloed is geweest bij de beoordeling ervan, aan de aanvrager van een
      kinderopvangtoeslag, onderscheidenlijk de partner of het kind van een overleden aanvrager.

      5 Bij ministeriële regeling kunnen nadere regels worden gesteld over de commissies.


