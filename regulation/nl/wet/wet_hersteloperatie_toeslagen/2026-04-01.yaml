  - number: 6.1a
    text: |-
      1 Een aanvraag als bedoeld in de [artikelen 2.14c][ref1], [2.14d][ref2] of [2.14e][ref3], wordt ingediend:

      a. binnen zes maanden na de datum van inwerkingtreding van [artikel 2.14c][ref4], [artikel 2.14d][ref5],
      onderscheidenlijk [artikel 2.14e][ref6], indien het overleden kind is overleden voor of op de datum van
      inwerkingtreding van die artikelen; of

      b. binnen zes maanden na de datum van overlijden van het overleden kind, indien het overleden kind is overleden na
      de datum van inwerkingtreding van [afdeling 2.2a][ref7].

      2 In afwijking van het eerste lid wordt een aanvraag als bedoeld in de [artikelen 2.14c][ref8], [2.14d][ref9]
      of [2.14e][ref10] ingediend tot zes maanden na de dagtekening van de beschikking tot het toepassen van een
      herstelmaatregel als bedoeld in [artikel 2.7][ref11] door de partner, het kind, onderscheidenlijk de ouder van een
      overleden kind van wie aannemelijk is dat het in aanmerking gekomen zou zijn voor toekenning van een tegemoetkoming
      op grond van de [artikelen 2.10][ref12] of [2.11][ref13], indien:

      a. die beschikking een dagtekening heeft van na 22 april 2024; en

      b. het overleden kind is overleden voorafgaand aan de datum van dagtekening van die beschikking.

      3 In afwijking van het eerste lid wordt een aanvraag als bedoeld in de [artikelen 2.14c][ref14], [2.14d][ref15]
      of [2.14e][ref16] ingediend tot zes maanden na de dagtekening van de beschikking tot het toekennen van compensatie
      als bedoeld in [artikel 2.14h, eerste lid][ref17], door de partner, het kind, onderscheidenlijk de ouder van een
      overleden kind van wie aannemelijk is dat het in aanmerking gekomen zou zijn voor toekenning van een tegemoetkoming
      op grond van de [artikelen 2.11a][ref18] of [2.11b][ref19], indien:

      a. die beschikking een dagtekening heeft van na 22 april 2024; en

      b. het overleden kind is overleden voorafgaand aan de datum van dagtekening van die beschikking.


