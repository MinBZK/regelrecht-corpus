      1 Het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [Hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], scheldt ambtshalve schulden
      kwijt die verband houden met de uitvoering van de taak, bedoeld in [artikelen 30, eerste lid][ref2], en
      [32d, eerste en tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], voor zover die op
      31 december 2020 niet voldaan waren, of voor zover die betrekking hebben op de periode tot en met 31 december 2020
      en de schuld na die datum is vastgesteld, van een persoon als bedoeld in [artikel 3.1, eerste lid][ref4].

      2 De kwijtschelding, bedoeld in het eerste lid, is tevens van toepassing op de met de schuld verband houdende
      verhogingen.

      3 Indien de schuld na 31 december 2020 is verminderd als gevolg van een aflossing of verrekening restitueert het
      Uitvoeringsinstituut werknemersverzekeringen het bedrag waarmee de schuld is verminderd.

      4 In afwijking van het eerste en derde lid scheldt het Uitvoeringsinstituut werknemersverzekeringen niet kwijt en
      restitueert het niet indien de schuld is ontstaan door:

      a. een besluit van het Uitvoeringsinstituut werknemersverzekeringen jegens de persoon, bedoeld in het eerste lid,
      handelend in de hoedanigheid van werkgever;

      b. een terugvordering of bestuurlijke boete in verband met het opzettelijk of door grove schuld niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in:

      1°. [artikel 12 van de Toeslagenwet][ref5];

      2°. [artikel 25 van de Werkloosheidswet][ref6];

      3°. [artikel 70 van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref7];

      4°. de [artikelen 2:7, eerste lid][ref8], en
      [3:74, eerste lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref9];

      5°. [artikel 12, eerste lid, van de Wet inkomensvoorziening oudere werklozen][ref10];

      6°. [artikel 80 van de Wet op de arbeidsongeschiktheidsverzekering][ref11];

      7°. [artikel 27, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref12];

      8°. de [artikelen 31, eerste lid][ref13], en [49 van de Ziektewet][ref14];

      c. naar het oordeel van het Uitvoeringsinstituut werknemersverzekeringen misbruik van sociale zekerheid of
      frauduleus of anderszins wederrechtelijk handelen of nalaten, van dien aard dat kwijtschelding of restitutie
      achterwege dient te blijven.

      5 In afwijking van het eerste en derde lid scheldt het Uitvoeringsinstituut
      werknemersverzekeringen een lening ter voorziening in de behoefte aan bedrijfskapitaal verstrekt
      als voorziening ter bevordering en ondersteuning van arbeid als zelfstandige als bedoeld
      in [artikel 2:23 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref15] of
      [artikel 34a van de Wet werk en inkomen naar arbeidsvermogen][ref16] slechts kwijt of restitueert deze slechts
      voor zover het betreft:

      a. achterstallige betalingen; of

      b. de hoofdsom, welke voor 1 januari 2021 is teruggevorderd omdat de uit de geldlening voortvloeiende
      verplichtingen niet of niet behoorlijk zijn nagekomen.

      6 Bij ministeriële regeling van Onze Minister van Sociale Zaken en Werkgelegenheid kunnen regels worden gesteld
      voor de uitvoering van dit artikel.


