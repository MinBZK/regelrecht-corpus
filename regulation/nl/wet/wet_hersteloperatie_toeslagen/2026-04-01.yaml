  - number: 6.2bis
    text: |-
      1 Op een aanvraag als bedoeld in [artikel 2.14c, eerste lid][ref1], besluit de Dienst Toeslagen binnen een termijn
      van zes maanden na ontvangst van de aanvraag. Deze termijn kan eenmaal met maximaal zes maanden worden verlengd.

      2 In afwijking van het eerste lid besluit de Dienst Toeslagen op een aanvraag als bedoeld in het eerste lid, die is
      gedaan voor inwerkingtreding van [artikel 2.14c, eerste lid][ref2], binnen een termijn van zes maanden na de datum
      van inwerkingtreding van dat artikel. Deze termijn kan eenmaal met maximaal zes maanden worden verlengd.

      3 In afwijking van het eerste en tweede lid besluit de Dienst Toeslagen op een aanvraag als bedoeld in
      [artikel 2.14c, eerste lid][ref3], binnen een termijn van zes maanden na dagtekening van de beschikking tot het
      toepassen van een herstelmaatregel als bedoeld in [artikel 2.7][ref4], indien het een aanvraag betreft van de
      partner van een overleden kind van wie aannemelijk is dat het in aanmerking gekomen zou zijn voor toekenning van
      een tegemoetkoming op grond van de [artikelen 2.10][ref5] of [2.11][ref6], indien:

      a. die aanvraag is gedaan voorafgaand aan de datum van dagtekening van die beschikking; en

      b. die beschikking een dagtekening heeft van na 22 april 2024.

      4 In afwijking van het eerste en tweede lid besluit de Dienst Toeslagen op een aanvraag als bedoeld in
      [artikel 2.14c, eerste lid][ref7], binnen een termijn van zes maanden na dagtekening van de beschikking tot het
      toekennen van compensatie als bedoeld in [artikel 2.14h, eerste lid][ref8], indien het een aanvraag betreft van de
      partner van een overleden kind van wie aannemelijk is dat het in aanmerking gekomen zou zijn voor toekenning van
      een tegemoetkoming op grond van de [artikelen 2.11a][ref9] of [2.11b][ref10], indien:

      a. die aanvraag is gedaan voorafgaand aan de datum van dagtekening van die beschikking; en

      b. die beschikking een dagtekening heeft van na 22 april 2024.

      5 Op een aanvraag als bedoeld in de [artikelen 2.14d][ref11] of [2.14e, eerste lid][ref12], besluit de Dienst
      Toeslagen binnen een termijn van zes maanden na het verstrijken van de op grond van [artikel 6.1a][ref13] geldende
      aanvraagtermijnen. Deze termijn kan eenmaal met maximaal zes maanden worden verlengd.


