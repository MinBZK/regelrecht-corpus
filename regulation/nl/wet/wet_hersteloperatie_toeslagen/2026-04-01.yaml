  - number: '6.5'
    text: |-
      Een beschikking tot toekenning van ondersteuning als bedoeld in [artikel 2.15, eerste, tweede of derde lid][ref1],
      [artikel 2.15a, eerste, tweede of derde lid][ref2], of [artikel 2.15b, eerste, tweede en derde lid][ref3], wordt
      door Onze Minister vastgesteld binnen zes weken nadat het plan van aanpak, bedoeld in artikel 2.15, vierde lid,
      artikel 2.15a, vierde lid, of artikel 2.15b, vierde lid, is vastgesteld. Het plan van aanpak is vastgesteld op het
      moment dat het is ondertekend door de aanvrager, bedoeld in artikel 2.15, eerste lid, de ex-partner, bedoeld in
      artikel 2.15a, eerste lid, of de partner of het kind van een overleden aanvrager, bedoeld in artikel 2.15b, eerste
      lid.


