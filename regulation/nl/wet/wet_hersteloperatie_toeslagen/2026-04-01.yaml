  - number: '2.5'
    text: |-
      Indien aan een aanvrager van een kinderopvangtoeslag voor 26 januari 2021 bij beschikking een bedrag is toegekend
      op grond van [artikel 49, eerste lid, van de Algemene wet inkomensafhankelijke regelingen][ref1] of een
      herstelmaatregel als bedoeld in [artikel 2.7][ref2] onderzoekt de Dienst Toeslagen ambtshalve of compensatie als
      bedoeld in [artikel 2.1, eerste lid][ref3], na toepassing van artikel 2.1, vijfde lid, zou leiden tot toekenning
      van een aanvullend bedrag. Indien dit het geval is, wordt dit bedrag door de Dienst Toeslagen bij beschikking
      vastgesteld en uitbetaald.


