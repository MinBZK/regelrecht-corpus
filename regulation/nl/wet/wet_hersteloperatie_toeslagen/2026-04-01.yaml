  - number: '2.10'
    text: |-
      Aan een kind van een aanvrager van een kinderopvangtoeslag die in aanmerking komt voor toepassing van een
      herstelmaatregel als bedoeld in [artikel 2.7][ref1] of van diens partner, indien die tevens diens partner was op
      26 januari 2021, kent de Dienst Toeslagen ambtshalve een tegemoetkoming als bedoeld in [artikel 2.12][ref2] toe,
      indien het kind op 1 januari 2005 jonger was dan 21 jaar of in de periode van 1 januari 2005 tot en met de dag
      waarop dit artikel in werking is getreden, is geboren.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0047436#Artikel2.12
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel2.10
