  - number: '9.1'
    text: |-
      1 De Dienst Toeslagen kan bij een besluit over toekenning van compensatie, een tegemoetkoming of vergoeding,
      kwijtschelding van bestuursrechtelijke schulden of betaling van bestuursrechtelijke en privaatrechtelijke schulden
      afwijken van [2.1][ref1], [2.6][ref2], [2.7][ref3], [2.10][ref4], [2.11][ref5], [2.11a][ref6], [2.11b][ref7],
      [2.14][ref8], [2.14a][ref9], [2.16][ref10], [2.17][ref11], [3.1][ref12], [4.6][ref13], [4.7][ref14] of [6.1][ref15]
      voor zover toepassing van het desbetreffende artikel gelet op doel of strekking ervan zal leiden tot een
      onbillijkheid van overwegende aard voor degene die aanspraak wil maken op de toekenning.

      2 Voor zover toepassing gelet op het belang dat de bepaling beoogt te beschermen, zal leiden tot een onbillijkheid
      van overwegende aard kan:

      a. Onze Minister afwijken van [artikel 2.15][ref16], [2.15a][ref17], [2.15b][ref18], [3.13][ref19], [4.1][ref20],
      [4.2][ref21] of [4.3][ref22];

      b. het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [Hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref23], afwijken van
      [artikel 3.6][ref24];

      c. de Sociale verzekeringsbank, genoemd in
      [Hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref25], afwijken van
      [artikel 3.7][ref26];

      d. het college van burgemeester en wethouders afwijken van [artikel 3.8][ref27] of [2.21][ref28];

      e. Onze Minister van Sociale Zaken en Werkgelegenheid afwijken van artikel 3.9;

      f. het CAK, bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref29], van [artikel 3.10][ref30] afwijken;

      g. de Wlz-uitvoerder, bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref31], van [artikel 3.11][ref32]
      afwijken; en

      h. het college, bedoeld in de [artikelen 1.1 van de Jeugdwet][ref33] en
      [1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref34], van [artikel 3.12][ref35] afwijken.


