  - number: '6.11'
    text: |-
      1 Bij algemene maatregel van bestuur worden de lichamen, instellingen, diensten, rechtspersonen of personen
      aangewezen die gehouden zijn aan de Dienst Toeslagen desgevraagd kosteloos de gegevens en inlichtingen te
      verstrekken die van belang kunnen zijn voor de uitvoering van de artikelen van de [hoofdstukken 2][ref1],
      [3][ref2] en [4][ref3].

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de verstrekking van het
      burgerservicenummer van degene op wie de gegevens en inlichtingen betrekking hebben.

      3 Aan een lichaam dat of een instelling, dienst, rechtspersoon of persoon die gegevens en inlichtingen heeft
      verstrekt, maar van oordeel is dat de verplichting daartoe onrechtmatig is opgelegd, kan op verzoek een vergoeding
      worden toegekend voor de kosten die rechtstreeks verband houden met de nakoming van de verplichting. De Dienst
      Toeslagen kent bij beschikking een redelijke kostenvergoeding toe in geval van een onrechtmatig opgelegde
      verplichting. Voor de toepassing van de wettelijke voorschriften over bezwaar en beroep wordt de rechtmatigheid van
      de opgelegde verplichting, bedoeld in het eerste lid, geacht deel uit te maken van het geschil in bezwaar en beroep
      tegen de beschikking tot toekenning van een kostenvergoeding.

      4 Een schuldeiser met een opeisbare vordering of diegene die optreedt namens die schuldeiser kan de naam, de
      geboortedatum, de adresgegevens en, indien de schuldeiser het burgerservicenummer rechtmatig mag verwerken,
      het burgerservicenummer van een schuldenaar op wie de opeisbare vordering betrekking heeft en op wie de
      afkoelingsperiode als bedoeld in [artikel 2.20][ref4] mogelijk van toepassing is verstrekken aan de Dienst
      Toeslagen, zodat de Dienst Toeslagen aan de schuldeiser of degene die namens hem optreedt kan bevestigen of ten
      aanzien van die schuldenaar de afkoelingsperiode van toepassing is. De Dienst Toeslagen kan na de verstrekking
      van die gegevens de bevestiging van de afkoelingsperiode en de datum waarop de afkoelingsperiode is ingegaan
      verstrekken aan de schuldeiser of diegene die optreedt namens de schuldeiser.

      5 Het vierde lid is van overeenkomstige toepassing ten aanzien van gegevensverstrekking door een
      gerechtsdeurwaarder, een gerecht als bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref5], de
      Afdeling bestuursrechtspraak van de Raad van State, het College van Beroep voor het bedrijfsleven en de Centrale
      Raad van Beroep.

      6 Het vierde lid is van overeenkomstige toepassing op gegevensverstrekking met betrekking tot
      een betalingsverplichting die voortvloeit uit een bestuursrechtelijke geldschuld als bedoeld in
      [artikel 4:85 van de Algemene wet bestuursrecht][ref6], een administratiefrechtelijke afdoening op grond van
      de Wet administratieve handhaving verkeersvoorschriften, een publiekrechtelijke rechtshandeling of een uitspraak
      van een gerecht als bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref7], de Afdeling
      bestuursrechtspraak van de Raad van State, het College van Beroep voor het bedrijfsleven of de Centrale Raad van
      Beroep.

      7 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het vierde lid.

      8 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan twee weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd. Als binnen die twee
      weken door of namens een der Kamers of door ten minste een vijfde van het grondwettelijk aantal leden van een
      der Kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur bij wet wordt
      geregeld, wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.

      9 De inspecteur of ontvanger verstrekken desgevraagd aan de Dienst Toeslagen de gegevens en inlichtingen, die nodig
      zijn voor de uitvoering van deze wet, onder vermelding van het burgerservicenummer van degene op wie de gegevens of
      inlichtingen betrekking hebben.

      10 Een gerechtsdeurwaarder die optreedt namens een schuldeiser met een opeisbare vordering van degene die in
      aanmerking komt voor toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref8], of diens partner,
      bedoeld in [artikel 3.1, eerste lid, onderdelen b of c][ref9], en voor wie de afkoelingsperiode, bedoeld in
      [artikel 2.20][ref10], meer dan zes maanden geleden aangevangen is of van de ex-partner die in aanmerking komt
      voor de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref11], en aan wie deze is toegekend, kan de naam,
      de geboortedatum, de adresgegevens, het bedrag aan schulden en bijkomende kosten en het burgerservicenummer van
      de schuldenaar op wie de opeisbare vordering betrekking heeft, verstrekken aan de Dienst Toeslagen, om de Dienst
      Toeslagen in staat te stellen die schuldenaar te benaderen om voor de opeisbare vordering tot een oplossing te
      komen.


