  - number: '6.12'
    text: |-
      1 Indien een aanvrager van een kinderopvangtoeslag heeft verzocht om toepassing van een herstelmaatregel als
      bedoeld in [artikel 2.7][ref1] en kenbaar heeft gemaakt in aanmerking te willen komen voor ondersteuning
      als bedoeld in [artikel 2.21][ref2] door het college van burgemeester en wethouders van de gemeente
      waarvan die aanvrager ingezetene is of indien een partner of kind van een overleden aanvrager als bedoeld in
      [artikel 2.9a][ref3], onderscheidenlijk [artikel 2.9b][ref4], kenbaar heeft gemaakt in aanmerking te willen
      komen voor ondersteuning door het college van burgemeester en wethouders van de gemeente waarvan die partner
      of dat kind ingezetene is, kan de Dienst Toeslagen op verzoek van deze aanvrager, deze partner of dit kind,
      het burgerservicenummer en de contactgegevens verstrekken aan dat college van burgemeester en wethouders om dat
      college in staat te stellen die aanvrager, die partner, of dat kind een aanbod van ondersteuning te doen op de vijf
      leefgebieden financiën, gezin, werk, wonen en zorg.

      2 Indien een aanvrager van een kinderopvangtoeslag heeft verzocht om compensatie of een tegemoetkoming als
      bedoeld in deze wet en kenbaar heeft gemaakt in aanmerking te willen komen voor hulpverlening van Stichting
      Slachtofferhulp Nederland, kan de Dienst Toeslagen op verzoek van die belanghebbende zijn burgerservicenummer, en
      contactgegevens verstrekken aan die stichting, om die stichting in staat te stellen die belanghebbende een aanbod
      voor hulpverlening te doen bij emotionele en psychische problematiek.

      3 Bij de uitvoering van de artikelen in [afdeling 2.2][ref5] verwerkt de Dienst Toeslagen gegevens van de ouder,
      diens partner of voormalige partner, en de pleegouder.

      4 De Dienst Toeslagen verstrekt aan Onze Minister het burgerservicenummer en de contactgegevens van een aanvrager
      van een kinderopvangtoeslag die in aanmerking komt voor toepassing van een herstelmaatregel als bedoeld in
      [artikel 2.7][ref6], een partner of kind van een overleden aanvrager als bedoeld in [artikel 2.9a][ref7]
      onderscheidenlijk [artikel 2.9b][ref8], of een ex-partner die in aanmerking komt voor de compensatie, bedoeld
      in [artikel 2.14h, eerste lid][ref9], en aan wie deze is toegekend, ten behoeve van de uitvoering van de
      [artikelen 2.15][ref10], [2.15a][ref11] en [2.15b][ref12].

      5 De Dienst Toeslagen verstrekt aan Onze Minister de gegevens en inlichtingen die van belang kunnen zijn voor de
      uitvoering van de [artikelen 3.13][ref13], [4.1][ref14] en [4.3][ref15].

      6 Voor de toepassing van de [artikelen 2.20][ref16], [3.1 tot en met 3.12][ref17], [4.1][ref18] en
      [4.7, vierde lid][ref19], kan de Dienst Toeslagen aan het Uitvoeringsinstituut werknemersverzekeringen, het
      Centraal Administratie Kantoor, de Dienst Uitvoering Onderwijs, de Sociale Verzekeringsbank, het Centraal
      Justitieel Incassobureau, het Landelijk Bureau Inning Onderhoudsbijdragen, de inspecteur, bedoeld in
      [artikel 2, derde lid, onderdeel b, van de Algemene wet inzake rijksbelastingen][ref20], de ontvanger, bedoeld
      in [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref21], gemeenten en waterschappen uit eigen
      beweging voor zover nodig, de naam, de geboortedatum, de adresgegevens, het burgerservicenummer en indien van
      toepassing de datum waarop een bedrag van in totaal ten minste € 30.000 in de vorm van een forfaitair bedrag als
      bedoeld in [artikel 2.7, eerste lid][ref22], of op grond van een herstelmaatregel als bedoeld in artikel 2.7 is
      uitgekeerd, verstrekken:

      a. van degenen aan wie dit bedrag wordt uitgekeerd;

      b. van degenen op wie de afkoelingsperiode als bedoeld in [artikel 2.20][ref23] van toepassing is;

      c. van een ex-partner die in aanmerking komt voor de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref24],
      en aan wie deze is toegekend.

      7 Indien een schuldeiser aan de Dienst Toeslagen bevestigt dat er in redelijkheid wordt gezocht naar een voor
      alle betrokken partijen passende oplossing voor de financiële situatie van degenen, bedoeld in het zesde lid,
      onderdelen a, b en c, kan de Dienst Toeslagen op verzoek van die schuldeiser gegevens verstrekken die noodzakelijk
      worden geacht voor de totstandkoming van die passende oplossing. De schuldeiser kan bij zijn verzoek aan de Dienst
      Toeslagen gegevens verstrekken die noodzakelijk worden geacht voor de totstandkoming van de passende oplossing.

      8 De Dienst Toeslagen registreert welke gegevens van degenen, bedoeld in het zesde lid, onderdelen a, b en c,
      zijn verstrekt aan een schuldeiser, aan iemand die optreedt namens een schuldeiser, aan gerechtsdeurwaarders,
      aan een gerecht als bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref25], aan de Afdeling
      bestuursrechtspraak van de Raad van State, aan het College van Beroep voor het bedrijfsleven of aan de Centrale
      Raad van Beroep.

      9 De Dienst Toeslagen kan op diens verzoek en indien noodzakelijk ter ondersteuning van de uitvoering van
      [artikel 6.14][ref26] aan het stelsel van kredietregistratie de naam, de geboortedatum en de adresgegevens
      verstrekken van een aanvrager van een kinderopvangtoeslag die in aanmerking komt voor een herstelmaatregel als
      bedoeld in [artikel 2.7][ref27], diens partner, of een ex-partner die in aanmerking komt voor de compensatie,
      bedoeld in [artikel 2.14h, eerste lid][ref28], en aan wie deze is toegekend.

      10 Het zesde tot en met achtste lid zijn van overeenkomstige toepassing op gegevensverstrekking met
      betrekking tot een betalingsverplichting die voortvloeit uit een bestuursrechtelijke geldschuld als bedoeld in
      [artikel 4:85 van de Algemene wet bestuursrecht][ref29], een administratiefrechtelijke afdoening op grond van
      de [Wet administratieve handhaving verkeersvoorschriften][ref30], een publiekrechtelijke rechtshandeling of een
      uitspraak van een gerecht als bedoeld in [artikel 2 van de Wet op de rechterlijke organisatie][ref31], de Afdeling
      bestuursrechtspraak van de Raad van State, het College van Beroep voor het bedrijfsleven of de Centrale Raad van
      Beroep.

      11 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van het eerste, en zesde tot en met
      achtste lid.

      12 Indien een ex-partner die in aanmerking komt voor de compensatie, bedoeld in
      [artikel 2.14h, eerste lid][ref32], en aan wie deze is toegekend, bij de Dienst Toeslagen kenbaar heeft gemaakt
      in aanmerking te willen komen voor ondersteuning als bedoeld in [artikel 2.21][ref33] door het college van
      burgemeester en wethouders van de gemeente waarvan die ex-partner ingezetene is, kan de Dienst Toeslagen op verzoek
      van die ex-partner het burgerservicenummer en de contactgegevens verstrekken aan dat college van burgemeester
      en wethouders om dat college in staat te stellen die ex-partner een aanbod van ondersteuning te doen op de vijf
      leefgebieden financiën, gezin, werk, wonen en zorg.

      13 Ten behoeve van de uitvoering van [artikel 2.21, zesde lid][ref34], verstrekt de Dienst Toeslagen het
      burgerservicenummer en informatie over de status van het verzoek om toepassing van een herstelmaatregel of
      informatie over een wijziging in de status van de gedupeerdheid van een aanvrager van een kinderopvangtoeslag,
      een ex-partner die in aanmerking komt voor de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref35], en
      aan wie deze is toegekend, of het kind, het pleegkind of het voormalige pleegkind dat in aanmerking komt voor
      de tegemoetkoming, bedoeld in [artikel 2.12][ref36], aan het college van burgemeester en wethouders dat aan die
      aanvrager, die ex-partner of dat kind, pleegkind of het voormalige pleegkind brede ondersteuning biedt.

      14 Het tweede lid is van overeenkomstige toepassing ten aanzien van een ex-partner die in aanmerking komt voor
      de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref37], en aan wie deze is toegekend en die bij de Dienst
      Toeslagen kenbaar heeft gemaakt in aanmerking te willen komen voor hulpverlening van Stichting Slachtofferhulp
      Nederland.

      15 Bij de uitvoering van [afdeling 2.3][ref38] verwerkt de Dienst Toeslagen gegevens van kinderen en voormalige
      partners van degene die een brief van de Dienst Toeslagen heeft ontvangen met een uitnodiging tot het aanvragen van
      compensatie of van degene die, zonder daartoe bij brief van de Dienst Toeslagen te zijn uitgenodigd, een aanvraag
      doet voor de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref39].

      16 Bij de uitvoering van [artikel 4.1][ref40] verstrekt Onze Minister gegevens met betrekking tot de bij
      een aanvraag als bedoeld in artikel 4.1, eerste lid, ingediende schulden, de persoonsgegevens en, indien
      noodzakelijk, het burgerservicenummer van een aanvrager van een kinderopvangtoeslag die in aanmerking komt
      voor toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref41], diens partner, bedoeld in
      [artikel 3.1, eerste lid, onderdelen b of c][ref42], of van een ex-partner die in aanmerking komt voor de
      compensatie, bedoeld in [artikel 2.14h, eerste lid][ref43], en aan wie deze is toegekend, aan diens schuldeisers
      of kredietbank.

      17 Bij een wens tot remigratie verstrekt Onze Minister aan het college van burgemeester en wethouders het
      burgerservicenummer en de contactgegevens van een aanvrager van een kinderopvangtoeslag die in aanmerking komt voor
      toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref44], de partner van een overleden aanvrager
      die in aanmerking komt voor een compensatie als bedoeld in [artikel 2.9a][ref45], een kind van een overleden
      aanvrager die in aanmerking komt voor een compensatie als bedoeld in [artikel 2.9b][ref46], of van een ex-partner
      die in aanmerking komt voor de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref47], en aan wie deze is
      toegekend, indien die aanvrager, partner, kind of ex-partner kenbaar heeft gemaakt in aanmerking te willen komen
      voor ondersteuning door het college van burgemeester en wethouders van de gemeente waarvan die aanvrager of ex-
      partner ingezetene wordt.


