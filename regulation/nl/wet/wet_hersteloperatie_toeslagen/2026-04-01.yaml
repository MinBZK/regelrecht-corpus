      1 De Sociale verzekeringsbank, genoemd in
      [Hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], scheldt ambtshalve
      schulden kwijt die verband houden met de uitvoering van de taak, bedoeld in de [artikelen 34][ref2] en
      [34a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], voor zover die op 31 december 2020 niet
      voldaan waren, of voor zover die betrekking hebben op de periode tot en met 31 december 2020 en de schuld na die
      datum is vastgesteld, van een persoon als bedoeld in [artikel 3.1, eerste lid][ref4].

      2 De kwijtschelding, bedoeld in het eerste lid, is tevens van toepassing op de met de schuld verband houdende
      verhogingen.

      3 Indien de schuld, bedoeld in het eerste lid, na 31 december 2020 is verminderd als gevolg van een aflossing of
      verrekening restitueert de Sociale verzekeringsbank het bedrag waarmee de schuld is verminderd.

      4 In afwijking van het eerste en derde lid scheldt de Sociale verzekeringsbank niet kwijt en restitueert niet
      indien de schuld is ontstaan door:

      a. een terugvordering of bestuurlijke boete in verband met het opzettelijk of door grove schuld niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in:

      1°. [artikel 15 van de Algemene Kinderbijslagwet][ref5];

      2°. [artikel 35 van de Algemene nabestaandenwet][ref6];

      3°. [artikel 49 van de Algemene Ouderdomswet][ref7];

      4°. [artikel 17, eerste lid, van de Participatiewet][ref8];

      5°. [artikel 5a van de Remigratiewet][ref9];

      b. naar het oordeel van de Sociale verzekeringsbank misbruik van sociale zekerheid of frauduleus of anderszins
      wederrechtelijk handelen of nalaten, van dien aard dat kwijtschelding of restitutie achterwege dient te blijven.

      5 [Artikel 3.6, zesde lid][ref10], is van overeenkomstige toepassing.


