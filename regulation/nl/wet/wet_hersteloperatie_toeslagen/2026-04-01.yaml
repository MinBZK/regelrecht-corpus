      Onze Minister voldoet op aanvraag van een zorgverzekeraar als bedoeld in
      [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref1], of het Landelijk Bureau Invordering Ouderbijdragen de
      opeisbare schulden:

      a. die een aanvrager van een kinderopvangtoeslag die in aanmerking komt voor toepassing
      van een herstelmaatregel als bedoeld in [artikel 2.7][ref2] of diens partner, bedoeld in
      [artikel 3.1, eerste lid, onderdelen b of c][ref3], op wie op 1 juni 2021 de wanbetalersregeling, bedoeld in
      [artikel 18d][ref4] of [18e van de Zorgverzekeringswet][ref5], van toepassing is, heeft bij een zorgverzekeraar;
      of

      b. die voortvloeien uit alimentatieverplichtingen van de persoon, bedoeld in [artikel 4.1, eerste lid][ref6], en
      waarvoor het Landelijk Bureau Invordering Ouderbijdragen de gemachtigde invorderaar is.


