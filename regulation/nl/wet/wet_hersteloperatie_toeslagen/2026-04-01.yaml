  - number: '9.2'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      en onderdelen daarvan verschillend kan worden vastgesteld en werkt terug ten aanzien van:

      a. [artikel 8.1, onderdelen B en C][ref1], tot en met 2 oktober 2020;

      b. [artikel 8.1, onderdeel A][ref2], tot en met 4 december 2020;

      c. [artikel 8.1, onderdeel D][ref3], tot en met 16 december 2020;

      d. [artikel 7.1][ref4] tot en met 1 januari 2021;

      e. de [artikelen 2.1 tot en met 2.6][ref5], [2.7, met uitzondering van het tweede lid, tweede en derde zin][ref6],
      [2.8][ref7], [2.9][ref8], [2.18][ref9], [2.21][ref10], [5.1][ref11], [5.2][ref12], [6.1, eerste lid][ref13],
      met betrekking tot aanvragen als bedoeld in de [artikelen 2.1, eerste en derde lid][ref14], en
      [2.6, eerste en derde lid][ref15], [6.2, eerste lid][ref16], met betrekking tot aanvragen als bedoeld in
      artikel 2.1, eerste lid, aanhef en onderdeel b, en [artikel 2.6, eerste lid][ref17], [6.3][ref18], [6.7][ref19],
      [6.8, eerste lid, en zevende en achtste lid][ref20] juncto eerste lid, met betrekking tot uitbetalingen op
      basis van de artikelen 2.1, 2.6, 2.7, eerste lid, 2.8 en 2.18, [6.9, eerste tot en met derde lid][ref21],
      [6.12, eerste lid][ref22], en elfde lid, met betrekking tot nadere regels ter uitvoering van het eerste lid,
      [8.2, onderdeel A][ref23], [8.5][ref24] en [8.6][ref25] tot en met 26 januari 2021;

      f. de [artikelen 2.20][ref26], [6.11, vierde tot en met zevende lid][ref27],
      [6.12, zesde tot en met tiende lid en elfde lid][ref28], met betrekking tot nadere regels ter uitvoering van het
      zesde tot en met achtste lid, [6.14][ref29] en [8.2, onderdeel B][ref30], tot en met 12 februari 2021;

      g. de [artikelen 3.10 tot en met 3.12][ref31] tot en met 1 juni 2021;

      h. de [artikelen 3.1 tot en met 3.5][ref32], [3.13][ref33], [3.14][ref34], [4.6][ref35], [4.7][ref36],
      [6.1, eerste lid][ref37], met betrekking tot aanvragen als bedoeld in artikel 3.13, eerste lid, 6.1, eerste
      en vierde lid, met betrekking tot aanvragen als bedoeld in de [artikelen 4.6, eerste lid][ref38], en
      [4.7, eerste lid][ref39], [6.2, tweede lid][ref40], met betrekking tot aanvragen als bedoeld in artikel 3.13,
      eerste lid, 6.2, derde lid, met betrekking tot aanvragen als bedoeld in de artikelen 4.6, eerste lid, en 4.7,
      eerste lid, [6.8, eerste lid, en zevende en achtste lid][ref41] juncto eerste lid, met betrekking tot uitbetalingen
      op basis van artikel 3.13, 6.8, vijfde lid, en zevende en achtste lid juncto vijfde lid, met betrekking tot
      uitbetalingen op basis van artikel 4.6, 6.8, zesde lid, en zevende en achtste lid juncto zesde lid, met betrekking
      tot uitbetalingen op basis van artikel 4.7 en [6.9, zevende lid][ref42], met betrekking tot uitbetalingen op
      basis van de artikelen 4.6 en 4.7, en 6.12, vijfde lid, met betrekking tot de gegevensverstrekking ten behoeve van
      artikel 3.13, tot en met 2 juni 2021;

      i. de [artikelen 3.6 tot en met 3.9][ref43], [7.2][ref44], [7.3][ref45] en [8.3][ref46] tot en met 1 juli 2021;

      j. de [artikelen 4.1 tot en met 4.5][ref47], [6.1, eerste en derde lid][ref48], met betrekking tot aanvragen als
      bedoeld in [artikel 4.3, eerste lid][ref49], 6.1, eerste en vierde lid, met betrekking tot aanvragen als bedoeld
      in de [artikelen 4.1, eerste lid][ref50], [4.2][ref51] en [4.4, eerste lid][ref52], [6.2, tweede lid][ref53],
      met betrekking tot aanvragen als bedoeld in de artikelen 4.1, eerste lid, 4.2, [4.3, eerste lid][ref54], en 4.4,
      eerste lid, 6.8, eerste lid, en zevende en achtste lid juncto eerste lid, met betrekking tot uitbetalingen op
      basis van artikel 4.3, en [6.8, vierde lid, en zevende en achtste lid][ref55] juncto vierde lid, met betrekking
      tot uitbetalingen op basis van artikel 4.4, en [artikel 6.12, vijfde lid][ref56], met betrekking tot de
      gegevensverstrekking ten behoeve van de uitvoering van de artikelen 4.1 en 4.3, tot en met 29 oktober 2021; en

      k. [artikel 8.4, onderdelen A en B][ref57], tot en met 24 februari 2022;

      l. de [artikelen 2.15][ref58], [6.5][ref59], [6.8, eerste lid][ref60], en [6.9, zevende lid][ref61], met betrekking
      tot uitbetalingen op basis van [artikel 2.15, tweede of derde lid][ref62], en [6.10, derde lid][ref63], tot en met
      24 juni 2022.

      2 In afwijking van het eerste lid:

      a. treedt [artikel 8.7][ref64] in werking met ingang van 1 januari 2024 en werkt terug tot en met 26 januari 2021;

      b. treedt [artikel 8.4, onderdelen C en D][ref65], in werking met ingang van een bij koninklijk besluit te bepalen
      tijdstip;

      c. treedt [artikel 8.4, onderdeel E][ref66], in werking op het tijdstip waarop
      [artikel IV, onderdeel H, van de Wet verbetering uitvoerbaarheid toeslagen][ref67] in werking treedt; en

      d. treedt [artikel 8.4, onderdeel G][ref68], in werking op een bij koninklijk besluit te bepalen tijdstip dat niet
      ligt voor 1 januari 2024;

      e. treedt [artikel 8.4, onderdeel F][ref69], in werking met ingang van een bij koninklijk besluit te bepalen
      tijdstip.

      3 De [artikelen 6.8, negende lid][ref70], en [6.9, tiende lid][ref71], zoals deze luiden direct na inwerkingtreding
      van [artikel I, onderdelen SSa, onder 3, en TTa, van de Wet aanvullende regelingen hersteloperatie toeslagen][ref72],
      werken terug tot en met 22 april 2024 met betrekking tot een tegemoetkoming op grond van [afdeling 2.2A][ref73].


