  - number: '6.3'
    text: |-
      1 Alleen ten aanzien van de voorbereiding van een beschikking tot toekenning van compensatie als bedoeld in
      [artikel 2.1, eerste lid][ref1], of een O/GS-tegemoetkoming als bedoeld in [artikel 2.6, eerste lid][ref2], wordt
      een aanvraag tot toepassing van artikel 2.1 of 2.6 geacht te zijn gericht op de toepassing van beide artikelen
      tenzij uit de aanvraag het tegendeel blijkt.

      2 Indien een aanvraag tot toepassing van [artikel 49][ref3], [49b][ref4] of
      [49c van de Algemene wet inkomensafhankelijke regelingen][ref5], zoals dat luidde op 25 januari 2021
      of van [artikel 2.1][ref6] of [2.6][ref7] wordt gevolgd door een aanvraag tot toepassing van een
      ander van deze artikelen, wordt de beslistermijn inzake laatstgenoemde aanvraag, in afwijking van
      [artikel 6.2, eerste lid][ref8], verkort met het reeds verstreken deel van de voor eerstgenoemde aanvraag
      geldende beslistermijn. De aldus resterende beslistermijn bedraagt minimaal de beslistermijn, bedoeld in
      [artikel 4:13 van de Algemene wet bestuursrecht][ref9].

      3 Het tweede lid is niet van toepassing op een aanvraag van aanvullende compensatie voor de werkelijke schade als
      bedoeld in [artikel 2.1, derde lid][ref10], of van een aanvullende O/GS-tegemoetkoming voor de werkelijke schade
      als bedoeld in [artikel 2.6, derde lid][ref11].


