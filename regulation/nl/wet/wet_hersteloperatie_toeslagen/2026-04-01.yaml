  - number: '4.7'
    text: |-
      1 De Dienst Toeslagen betaalt op aanvraag een bedrag ter grootte van de schulden, bedoeld in het tweede lid, van
      degene die in aanmerking komt voor toepassing van een herstelmaatregel als bedoeld in [artikel 2.7][ref1] en diens
      partner, bedoeld in [artikel 3.1, eerste lid, onderdelen b of c][ref2], en die:

      a. zich bevindt in een buitengerechtelijke schuldregeling die voor de dag waarop dit artikel in
      werking is getreden, is aangevangen in de vorm van schuldbemiddeling om niet als bedoeld in
      [artikel 48, eerste lid, onderdeel a, van de Wet op het consumentenkrediet][ref3] door de werkgever waarmee hij
      een individuele of collectieve arbeidsovereenkomst heeft afgesloten, waarbij een buitengerechtelijk akkoord is
      getroffen met zijn schuldeisers; of

      b. zich bevindt in een buitengerechtelijke schuldregeling die voor de dag waarop dit artikel in werking
      is getreden, is aangevangen in de vorm van schuldbemiddeling door een persoon of instelling als bedoeld
      in [artikel 48, eerste lid, onderdeel b of c, van de Wet op het consumentenkrediet][ref4], waarbij een
      buitengerechtelijk akkoord is getroffen met zijn schuldeisers; of

      c. zich bevindt in een buitengerechtelijke schuldregeling die voor de dag waarop dit artikel in werking is
      getreden, is aangevangen waarbij een saneringskrediet is verstrekt door een gemeentelijke kredietbank en waarbij
      een buitengerechtelijk akkoord is getroffen met zijn schuldeisers.

      1a Het eerste lid is van overeenkomstige toepassing op de ex-partner die in aanmerking komt voor de compensatie,
      bedoeld in [artikel 2.14h, eerste lid][ref5], en aan wie deze is toegekend, met dien verstande dat een
      buitenrechtelijke schuldregeling als bedoeld in het eerste lid, onderdeel a, b of c, is aangevangen voor de dag
      waarop de [Wet aanvullende regelingen hersteloperatie toeslagen][ref6] in werking is getreden.

      2 Het bedrag van de te betalen schulden is gelijk aan de som van de openstaande vorderingen, die onderdeel zijn van
      een buitengerechtelijke schuldregeling.

      3 Een schuld die voortvloeit uit een strafrechtelijke veroordeling ter zake van een misdrijf als bedoeld
      in [artikel 326 van het Wetboek van Strafrecht][ref7] dat in kracht van gewijsde is gegaan binnen
      vijf jaren voor de aanvang van de buitengerechtelijke schuldregeling, of een veroordeling als bedoeld
      in [artikel 358, vierde lid, van de Faillissementswet][ref8] binnen vijf jaar voor de aanvang van de
      buitengerechtelijke schuldregeling wordt niet betaald.

      4 De aanvraag tot het geven van een beschikking tot betaling van het bedrag aan te betalen schulden geschiedt
      door de werkgever of de persoon of instelling, bedoeld in het eerste lid, of de gemeentelijke kredietbank bij de
      Dienst Toeslagen. De beschikking wordt bekendgemaakt aan die werkgever, die persoon, die gemeentelijke kredietbank
      of die instelling en degene die in aanmerking komt voor toepassing van een herstelmaatregel als bedoeld in
      [artikel 2.7][ref9], diens partner, bedoeld in [artikel 3.1, eerste lid, onderdelen b en c][ref10], of een ex-
      partner die in aanmerking komt voor de compensatie, bedoeld in [artikel 2.14h, eerste lid][ref11], en aan wie deze
      is toegekend.

      5 De Dienst Toeslagen betaalt aan de werkgever of de persoon of instelling, bedoeld in het vierde lid,
      een vergoeding voor het opzetten en uitvoeren van de buitengerechtelijke schuldregeling en voor eventueel
      financieel beheer. De vergoeding bedraagt nooit meer dan het salaris van de bewindvoerder, bedoeld in
      [artikel 4.6, zesde lid][ref12].

      6 De aanvraag bevat in ieder geval:

      a. het bedrag van de vorderingen binnen de buitengerechtelijke schuldregeling; en

      b. een berekening van de vergoeding, bedoeld in het vijfde lid.

      7 De werkgever, de persoon of de instelling gebruikt het aan hem uitbetaalde bedrag ter uitdeling aan de
      schuldeisers met wie het buitengerechtelijke akkoord is getroffen.

      8 De gemeentelijke kredietbank gebruikt het aan hem uitbetaalde bedrag ter aflossing van het saneringskrediet.

      9 Nadat het zevende of achtste lid is toegepast, is
      [artikel 3, tweede lid, van de Wet gemeentelijke schuldhulpverlening][ref13] niet van toepassing.


