  - number: 2.9b
    text: |-
      1 Indien een overleden aanvrager geen partner had op de dag van overlijden, indien degene die partner was van een
      overleden aanvrager op de dag waarop laatstgenoemde is overleden, is overleden voor de dag van inwerkingtreding van
      [artikel 2.9a][ref1], of indien de situatie, bedoeld in artikel 2.9a, derde lid, zich voordoet, worden aan het kind
      van de overleden aanvrager een of meer van de onderstaande voorzieningen toegekend:

      a. op aanvraag door de Dienst Toeslagen:

      1°. compensatie die op grond van [artikel 2.1, eerste lid][ref2], aan de overleden aanvrager op aanvraag zou zijn
      toegekend indien deze niet was overleden;

      2°. tegemoetkoming die op grond van [artikel 2.6, eerste lid][ref3], aan de overleden aanvrager op aanvraag zou
      zijn toegekend indien deze niet was overleden;

      3°. het forfaitaire bedrag dat op grond van [artikel 2.7][ref4] aan de overleden aanvrager op aanvraag zou zijn
      toegekend indien deze niet was overleden;

      b. op aanvraag door Onze Minister: overeenkomstige toepassing van [afdeling 4.1][ref5] op de daar bedoelde
      geldschulden van de overleden aanvrager voor zover deze ten laste van het kind zijn gekomen;

      c. ambtshalve door de publieke schuldeisers, genoemd in de [artikelen 3.1 tot en met 3.12][ref6]:

      overeenkomstige toepassing van [hoofdstuk 3][ref7] op de geldschulden, bedoeld in de
      [artikelen 3.1 tot en met 3.12][ref8], van de overleden aanvrager voor zover deze ten laste van het kind zijn
      gekomen.

      2 Aan het kind van een overleden aanvrager wordt door de Dienst Toeslagen op aanvraag aanvullende compensatie voor
      de werkelijke schade als bedoeld in [artikel 2.1, derde lid][ref9], of een aanvullende O/GS-tegemoetkoming voor
      de werkelijke schade als bedoeld in [artikel 2.6, derde lid][ref10], toegekend die aan de overleden aanvrager op
      aanvraag zou zijn toegekend indien deze niet was overleden, in het geval dat:

      a. de overleden aanvrager geen partner had op de dag van overlijden;

      b. degene die partner was van de overleden aanvrager op de dag waarop laatstgenoemde is overleden, is overleden
      voor de dag van inwerkingtreding van [artikel 2.9a][ref11]; of

      c. de situatie, bedoeld in [artikel 2.9a, derde lid][ref12], zich voordoet.

      3 Indien meerdere kinderen binnen de aanvraagtermijn, bedoeld in [artikel 6.1b, eerste lid][ref13], een aanvraag
      indienen voor de compensatie of tegemoetkoming, bedoeld in het eerste lid, onderdeel a, wordt het bedrag van de
      compensatie of tegemoetkoming, bedoeld in het eerste lid, onderdeel a, verminderd naar evenredigheid van het aantal
      kinderen dat in aanmerking komt voor die compensatie of tegemoetkoming.

      4 Het derde lid is van overeenkomstige toepassing bij de toekenning van aanvullende compensatie of een aanvullende
      O/GS-tegemoetkoming op grond van het tweede lid, indien meerdere kinderen binnen de aanvraagtermijn die op grond
      van [artikel 6.1b][ref14] op hen van toepassing is, een aanvraag daartoe indienen.

      5 Het eerste tot en met vierde lid alsmede [hoofdstuk 4a][ref15], [artikel 5.2][ref16] en de daarop berustende
      bepalingen en [hoofdstuk 6][ref17] voor zover die betrekking hebben op aanvragen als bedoeld in het eerste of
      tweede lid, zijn van overeenkomstige toepassing met betrekking tot een kind van een overleden aanvrager:

      a. indien degene die partner was van de overleden aanvrager op de dag waarop laatstgenoemde is overleden, overlijdt
      op of na de dag van inwerkingtreding van [artikel 2.9a][ref18];

      b. voor zover die partner is overleden voordat toekenning heeft plaatsgevonden van de voorzieningen, de aanvullende
      compensatie of de aanvullende O/GS-tegemoetkoming die aan die partner zouden zijn toegekend op grond van
      [artikel 2.9a][ref19] indien deze niet was overleden;

      c. met dien verstande dat:

      1°. voor de toepassing van [artikel 6.1b, eerste lid][ref20], de aanvraagtermijn aanvangt op de dag van overlijden
      van de partner in plaats van op de dag van overlijden van de overleden aanvrager;

      2°. [artikel 6.1b, tweede lid][ref21], van toepassing is als geen toekenning heeft
      plaatsgevonden aan de partner van de overleden aanvrager van een voorziening als bedoeld in
      [artikel 2.9a, eerste lid, onderdeel a, onder 1° of 2°][ref22].


