  - number: '6.6'
    text: |-
      De Dienst Toeslagen verleent de kwijtschelding, bedoeld in [artikel 3.1][ref1], uiterlijk drie maanden na het
      tijdstip waarop dit artikel in werking is getreden of, indien dit later is, uiterlijk binnen drie maanden na het
      toekennen, afwijzen op grond van [artikel 2.7, tweede lid][ref2], of verminderen tot nihil van het forfaitaire
      bedrag, bedoeld in artikel 2.7, eerste lid, of indien dit nog later is, uiterlijk binnen drie maanden nadat de
      toekenning van de toeslag, waarop de terugvordering, bedoeld in artikel 3.1, eerste lid, betrekking heeft, over
      het berekeningsjaar waarop die terugvordering betrekking heeft, onherroepelijk is geworden. Deze termijn kan door
      de Dienst Toeslagen eenmaal met maximaal drie maanden worden verlengd. De Dienst Toeslagen stelt de belanghebbende
      hiervan uiterlijk op de laatste dag van deze termijn in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel3.1
      [ref2]: https://wetten.overheid.nl/BWBR0047436#Artikel2.7
