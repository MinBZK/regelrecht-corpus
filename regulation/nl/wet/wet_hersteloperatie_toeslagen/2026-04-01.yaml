  - number: 4a.4
    text: |-
      De Dienst Toeslagen draagt zorg voor een goede afhandeling van de persoonlijke bijstand en zorgt dat hierover
      afstemming plaatsvindt met andere personen of organen, voor zover de verantwoordelijkheid voor de uitvoering
      hiervan bij die personen of organen ligt en voor zover afstemming het belang van de betrokkene dient.
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel4a.4
  - number: 4a.5
    text: |-
      Onze Minister verleent mandaat aan de Dienst Toeslagen om een beschikking als bedoeld in
      [artikelen 2.9a, tweede lid][ref1], of [2.9b, tweede lid][ref2], te nemen, indien de betrokkene een verzoek als
      bedoeld in [artikel 4a.2, derde lid][ref3], heeft gedaan dat ook betrekking heeft op een dergelijke beschikking.


