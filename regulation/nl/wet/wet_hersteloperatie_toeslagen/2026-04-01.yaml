  - number: 4a.2
    text: |-
      1 De betrokkene krijgt persoonlijke bijstand.

      2 Tijdens de persoonlijke bijstand coördineert een persoonlijk zaakbehandelaar regeling nabestaanden overleden
      aanvragers van de Dienst Toeslagen de procedure en fungeert voor de betrokkene tevens als aanspreekpunt.
    url: https://wetten.overheid.nl/BWBR0047436/2026-04-01#Artikel4a.2
  - number: 4a.3
    text: |-
      1 In het kader van de persoonlijke bijstand vinden tussen de betrokkene en de Dienst Toeslagen een of meerdere
      persoonlijke gesprekken plaats, waarbij de persoonlijk zaakbehandelaar regeling nabestaanden overleden aanvragers
      eveneens aanwezig is.

      2 Een persoonlijk gesprek ziet desgewenst in ieder geval op:

      a. uitleg over de regelingen waarop de persoonlijke bijstand betrekking heeft;

      b. uitleg over de mogelijkheden voor persoonlijke bijstand;

      c. informatie over het gebruik van de regelingen waar de betrokkene recht op heeft;

      d. het door de betrokkene overleggen van informatie met betrekking tot een aanvraag op grond van de
      [artikelen 2.9a][ref1] of [2.9b][ref2];

      e. het ondersteunen bij het doen van een aanvraag op grond van de [artikelen 2.9a][ref3] of [2.9b][ref4].


