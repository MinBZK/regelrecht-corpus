  - number: '8.10'
    text: |-
      1 Indien voor de datum van inwerkingtreding van
      [artikel I, onderdeel Ga, van de Wet aanpassing termijnen en nabestaandenregeling hersteloperatie toeslagen][ref1]
      het eerste gesprek waarin de hulpvraag voor brede ondersteuning is vastgesteld tussen een persoon als bedoeld in
      [artikel 2.21, eerste lid][ref2], en het college van burgemeester en wethouders heeft plaatsgevonden, maar nog geen
      plan van aanpak is opgesteld, geldt, in afwijking van artikel 2.21, vierde lid, tweede zin, lid 4a en lid 4b, dat:

      a. het plan van aanpak wordt opgesteld binnen acht weken na die datum;

      b. materiële voorzieningen worden toegekend binnen zes maanden na die datum;

      c. het college van burgemeester en wethouders de brede ondersteuning beëindigt uiterlijk twee jaar na die datum.

      2 Indien voor de datum van inwerkingtreding van
      [artikel I, onderdeel Ga, van de Wet aanpassing termijnen en nabestaandenregeling hersteloperatie toeslagen][ref3],
      een plan van aanpak als bedoeld in [artikel 2.21, vierde lid][ref4], is opgesteld, geldt, in afwijking van artikel
      2.21, lid 4a en lid 4b, dat:

      a. materiële voorzieningen worden toegekend binnen zes maanden na die datum;

      b. het college van burgemeester en wethouders de brede ondersteuning beëindigt uiterlijk twee jaar na die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0050567#ArtikelI
