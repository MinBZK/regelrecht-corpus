  - number: 6.10aa
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] vangt de beslistermijn op een
      bezwaar gericht tegen een beschikking van de Dienst Toeslagen op grond van deze wet aan op de dag na ontvangst van
      het bezwaarschrift, met dien verstande dat de beslistermijn niet eerder aanvangt dan zes weken nadat de termijn
      voor het indienen van een bezwaarschrift is aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel710
