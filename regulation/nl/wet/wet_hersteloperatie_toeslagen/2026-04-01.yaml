  - number: '6.2'
    text: |-
      1 Op een aanvraag als bedoeld in [artikel 2.1, eerste of derde lid][ref1], [2.6, eerste of derde lid][ref2],
      [2.13][ref3], [2.13a][ref4], [2.14][ref5], [2.14a][ref6] of [2.14h, eerste lid][ref7], besluit de Dienst Toeslagen
      binnen een termijn van zes maanden na ontvangst van de aanvraag. Deze termijn kan eenmaal met maximaal zes maanden
      worden verlengd.

      2 Op een aanvraag als bedoeld in [artikel 3.13, eerste lid][ref8], [4.1, eerste lid][ref9], [4.2][ref10],
      [4.3, eerste lid][ref11], of [4.4, eerste lid][ref12], besluit Onze Minister binnen een termijn van zes maanden na
      ontvangst van de aanvraag. Deze termijn kan eenmaal met maximaal zes maanden worden verlengd.

      3 Op een aanvraag als bedoeld in [artikel 4.6, eerste lid][ref13], of [artikel 4.7, eerste lid][ref14], besluit
      de Dienst Toeslagen binnen vier weken na ontvangst van de aanvraag.

      4 In afwijking van het eerste lid besluit de Dienst Toeslagen op een aanvraag als bedoeld in
      [artikel 2.14h, eerste lid][ref15], binnen een termijn van zes maanden na de dag van inwerkingtreding van
      artikel I, onderdeel M, onder 2, van de Wet aanvullende regelingen hersteloperatie toeslagen, indien die aanvraag
      is gedaan voor ontvangst van een brief van de Dienst Toeslagen met een uitnodiging een aanvraag te doen en voor
      inwerkingtreding van laatstgenoemd artikel. Deze termijn kan eenmaal met maximaal zes maanden worden verlengd.

      5 In afwijking van het eerste en vierde lid besluit de Dienst Toeslagen op een aanvraag als bedoeld in
      [artikel 2.14h, eerste lid][ref16], binnen een termijn van zes maanden na de dagtekening van de beschikking waarin
      voor de aanvrager van een kinderopvangtoeslag, bedoeld in [artikel 2.14g, eerste lid][ref17], het recht op het
      forfaitaire bedrag, bedoeld in [artikel 2.7, eerste lid][ref18], het recht op het bedrag van € 10.000, bedoeld
      in artikel 2.7, tweede lid, of het recht op toepassing van een herstelmaatregel als bedoeld in artikel 2.7 wordt
      vastgesteld, indien:

      a. die aanvrager voor een kinderopvangtoeslag diens aanvraag als bedoeld in [artikel 2.1, eerste lid][ref19], of
      als bedoeld in [artikel 2.6, eerste lid][ref20], heeft ingediend voor 1 januari 2024; en

      b. nog geen beschikking is gegeven op de aanvraag, bedoeld in onderdeel a, op:

      1°. de dag van ontvangst van de aanvraag, bedoeld in [artikel 2.14h, eerste lid][ref21]; of

      2°. de dag van inwerkingtreding van
      [artikel I, onderdeel M, onder 2, van de Wet aanvullende regelingen hersteloperatie toeslagen][ref22] in de
      situatie dat de aanvraag, bedoeld in [artikel 2.14h, eerste lid][ref23], is gedaan voor ontvangst van een brief
      van de Dienst Toeslagen met een uitnodiging een aanvraag te doen. Deze termijn kan eenmaal met maximaal zes maanden
      worden verlengd.


