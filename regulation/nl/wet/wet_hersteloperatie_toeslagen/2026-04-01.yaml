  - number: 6.10b
    text: |-
      In afwijking van [artikel 6:8 van de Algemene wet bestuursrecht][ref1] vangt de termijn voor het instellen van
      beroep tegen een beslissing op bezwaar die door de Dienst Toeslagen is gedaan op een beschikking die op grond van
      deze wet is gegeven aan met ingang van de dag na die van dagtekening van de beslissing op bezwaar, tenzij de dag
      van dagtekening is gelegen vóór de dag van de bekendmaking.


