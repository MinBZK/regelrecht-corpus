  - number: '6.7'
    text: |-
      1 Voorafgaande aan de beslissing op een aanvraag als bedoeld in [artikel 2.1, eerste lid][ref1], informeert de
      Dienst Toeslagen de aanvrager schriftelijk over deze beslissing door middel van een vooraankondiging. Bij een
      voorgenomen toekenning van de aanvraag berekent de Dienst Toeslagen het voorlopige bedrag van de compensatie en
      wordt de aanvrager hierover in de vooraankondiging geïnformeerd.

      2 De aanvrager kan binnen twee weken na de dagtekening van de vooraankondiging zijn zienswijze hierover naar voren
      brengen.

      3 De termijn, bedoeld in het tweede lid, wordt op verzoek van de aanvrager eenmalig verlengd tot ten hoogste zes
      weken vanaf de dagtekening van de vooraankondiging.

      4 In het geval van toekenning van een aanvraag als bedoeld in [artikel 2.1, eerste lid][ref2], stelt de Dienst
      Toeslagen het bedrag van de compensatie vast na afloop van de termijn, bedoeld in het tweede of derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0047436#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0047436#Artikel2.1
