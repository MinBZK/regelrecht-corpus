  - number: '2.9'
    text: |-
      1 In bij algemene maatregel van bestuur aan te wijzen gevallen kan onder bij of krachtens die algemene
      maatregel van bestuur te stellen regels op een voor 1 januari 2024 aan de Dienst Toeslagen gedaan verzoek van de
      belanghebbende een bijzondere tegemoetkoming worden toegekend indien sprake is van een schrijnend geval waarin
      toepassing van [Algemene wet inkomensafhankelijke regelingen][ref1], de daarop berustende bepalingen of de
      [Wet kinderopvang][ref2] bij de uitvoering van de kinderopvangtoeslag heeft geleid tot ernstige onbillijkheden
      van overwegende aard, die zich hebben voorgedaan bij een beschikking tot vaststelling of tot terugvordering
      inzake de kinderopvangtoeslag, dan wel bij het niet toekennen van een persoonlijke betalingsregeling vanwege de
      onterechte kwalificatie opzet of grove schuld van de belanghebbende of diens partner ten aanzien van het ontstaan
      van de terugvordering inzake de kinderopvangtoeslag, welke onbillijkheden zodanig zijn dat het overduidelijk
      onredelijk is deze voor rekening van de belanghebbende te laten en waarvoor andere compensaties, herzieningen,
      hardheidstegemoetkomingen, O/GS-tegemoetkomingen als bedoeld in [artikel 2.6][ref3] of vergoedingen ter zake van
      die onbillijkheden niet voldoende zijn.

      2 In bij algemene maatregel van bestuur aan te wijzen gevallen kan onder bij of krachtens die algemene maatregel
      van bestuur te stellen regels op een aan de Dienst Toeslagen gedaan verzoek van de partner of het kind van een
      overleden aanvrager, het kind, pleegkind en voormalig pleegkind, de partner, het kind of de ouder van een overleden
      kind of de ex-partner een bijzondere tegemoetkoming worden toegekend indien sprake is van een schrijnend geval
      waarin toepassing van deze wet leidt tot ernstige onbillijkheden van overwegende aard, welke onbillijkheden
      zodanig zijn dat het overduidelijk onredelijk is deze voor rekening van die partner of dat kind van de overleden
      aanvrager, dat kind, pleegkind of voormalig pleegkind, die partner, dat kind of die ouder van het overleden kind
      onderscheidenlijk die ex-partner, te laten en waarvoor de voorzieningen ter zake van die onbillijkheden niet
      voldoende zijn.

      3 De voordracht voor een krachtens het eerste en tweede lid vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan twee weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd. Indien
      binnen die termijn door of namens een van de Kamers of door ten minste een vijfde van het grondwettelijk aantal
      leden van een van de Kamers de wens te kennen wordt gegeven dat het onderwerp van de algemene maatregel van bestuur
      bij wet wordt geregeld, wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend.


