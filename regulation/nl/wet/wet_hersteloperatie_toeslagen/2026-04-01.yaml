  - number: 2.15a
    text: |-
      1 Onze Minister kan ambtshalve brede ondersteuning in het buitenland aanbieden op de vijf leefgebieden
      financiën, gezin, werk, wonen en zorg aan een ex-partner die in aanmerking komt voor de compensatie, bedoeld
      in [artikel 2.14h, eerste lid][ref1], en aan wie deze is toegekend, ten behoeve van die ex-partner en diens
      partner, diens kind, pleegkind of voormalig pleegkind dat in aanmerking komt voor een tegemoetkoming als bedoeld in
      [artikel 2.12][ref2], en het thuiswonende kind of pleegkind van hemzelf of van diens partner, indien:

      a. die ex-partner op 31 december 2021 niet in Nederland woonde;

      b. die ex-partner, diens partner, diens kind, pleegkind of voormalig pleegkind dat in aanmerking komt voor een
      tegemoetkoming als bedoeld in [artikel 2.12][ref3], en het thuiswonende kind of pleegkind van hemzelf of van diens
      partner op het moment van ambtshalve toetsing door Onze Minister niet in Nederland woont.

      2 Voor zover de brede ondersteuning wordt geboden in de vorm van een financiële tegemoetkoming, wordt deze
      tegemoetkoming verstrekt ter vergoeding van redelijke kosten die worden gemaakt in het kader van de brede
      ondersteuning.

      3 In geval van een wens tot remigratie naar Nederland van de ex-partner, diens partner, diens kind, pleegkind of
      voormalig pleegkind dat in aanmerking komt voor een tegemoetkoming als bedoeld in [artikel 2.12][ref4], en het
      thuiswonende kind of pleegkind van hemzelf of van diens partner, die binnen drie maanden na het ambtshalve aanbod,
      bedoeld in het eerste lid, kenbaar is gemaakt aan Onze Minister kan Onze Minister op verzoek eenmalig:

      a. de redelijke reiskosten van remigratie van ieder van hen vergoeden of voor zijn rekening nemen, mits voornoemde
      gezinsleden voor de remigratie naar Nederland op hetzelfde adres buiten Nederland wonen als de ex-partner;

      b. de redelijke kosten van de verhuizing naar Nederland voor zijn rekening nemen.

      4 Onze Minister verleent de ondersteuning, bedoeld in het eerste, tweede of derde lid, op basis van een plan van
      aanpak dat in overleg met de ex-partner is opgesteld.

      5 Onze Minister vergoedt of neemt voor zijn rekening de kosten, bedoeld in het derde lid, indien het plan van
      aanpak is vastgesteld binnen drie maanden nadat de wens tot remigratie kenbaar is gemaakt en indien de remigratie
      naar Nederland plaatsvindt uiterlijk een jaar nadat het plan van aanpak is vastgesteld.


