  - number: '7'
    text: |-
      Met betrekking tot de verhoging van het loon, bedoeld in de [artikelen 3][ref1] en [4][ref2], zijn van
      overeenkomstige toepassing de bij of krachtens de wet vastgestelde voorschriften omtrent de opgave en uitbetaling
      van loon en omtrent de rechtsvorderingen tot uitbetaling van loon.


      [ref1]: https://wetten.overheid.nl/BWBR0006353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006353#Artikel4
    url: https://wetten.overheid.nl/BWBR0006353/2015-01-01#Artikel7
