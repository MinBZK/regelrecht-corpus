    text: |-
      1 Deze wet treedt in werking met ingang van 1 januari 1994.

      2 De Wet overhevelingstoeslag opslagpremies, de Wet aanpassing uitkeringsregelingen overheveling opslagpremies en
      deze wet vervallen met ingang van 1 januari van een bij koninklijk besluit te bepalen jaar.
