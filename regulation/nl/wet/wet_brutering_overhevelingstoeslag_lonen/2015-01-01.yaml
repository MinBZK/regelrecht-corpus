preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen met betrekking tot verhoging van het
    loon ter compensatie van het vervallen van de overhevelingstoeslag;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006353/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. overhevelingstoeslag: De overhevelingstoeslag, bedoeld in artikel 1 van de Wet overhevelingstoeslag
      opslagpremies en in artikel 3 van de Wet aanpassing uitkeringsregelingen overheveling opslagpremies;

      c. vervaljaar: het krachtens [artikel 9][ref1] vastgestelde jaar met ingang waarvan de verplichting tot betaling
      van een overhevelingstoeslag komt te vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006353#Artikel9
    url: https://wetten.overheid.nl/BWBR0006353/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006353
        artikel: '9'
  - number: '2'
    text: |-
      1 De voor de berekening van de overhevelingstoeslag voor het jaar 1995 geldende premiepercentages worden in
      afwijking van artikel 2 van de Wet aanpassing uitkeringsregelingen overheveling opslagpremies afgeleid van en
      tegelijkertijd vastgesteld met de voor het jaar 1994 geldende premiepercentages.

      2 Het voor de berekening van de overhevelingstoeslag geldende percentage wordt, in afwijking van artikel 1, tweede
      lid, van de Wet overhevelingstoeslag opslagpremies en van artikel 2 van de Wet aanpassing uitkeringsregelingen
      overheveling opslagpremies, voor de jaren 1996 en volgend vastgesteld bij algemene maatregel van bestuur,
      overeenkomstig de navolgende leden. Daarbij kan dit percentage voor verschillende categorieën inhoudingsplichtigen
      of personen verschillend worden vastgesteld.

      3 Uitgaande van de voorafgaande vaststelling van het percentage van de overhevelingstoeslag, worden in dat
      percentage wijzigingen aangebracht overeenkomstig de lastenontwikkeling uit hoofde van de verzekering langdurige
      zorg en de algemene arbeidsongeschiktheidsverzekering in het jaar 1995 en de daaropvolgende jaren.

      4 Voorts kunnen in dat percentage wijzigingen worden aangebracht:

      a. teneinde te voorkomen dat andere wettelijke maatregelen leiden tot een verschuiving van financiële lasten tussen
      werkgevers en werknemers;

      b. teneinde te bewerkstelligen dat een uit andere wettelijke maatregelen voortvloeiende wijziging van financiële
      lasten evenwichtig wordt gespreid over werkgevers en werknemers;

      c. ter beperking van de financiële lasten voor werkgevers, te financieren uit de ruimte beschikbaar in het kader
      van het beleid gericht op lastenverlichting.

      5 Alvorens een voordracht tot een algemene maatregel van bestuur, als bedoeld in het tweede lid, te doen deelt
      Onze Minister de zakelijke inhoud van het voorgenomen besluit mede aan de beide Kamers der Staten-Generaal. De
      voordracht tot de maatregel kan eerst worden gedaan nadat tien dagen zijn verstreken na die mededeling.

      6 Een maatregel als bedoeld in het tweede lid treedt in werking met ingang van 1 januari. Een besluit tot
      vaststelling van de overhevelingstoeslag per 1 januari van het vervaljaar wordt bij voorkeur vastgesteld
      gelijktijdig met de vaststelling van de overhevelingstoeslag voor het jaar dat aan het vervaljaar voorafgaat,
      rekening houdende met de lastenverschuivingen en -wijzigingen zoals die naar redelijke verwachting voortvloeien uit
      wettelijke maatregelen die uiterlijk op 1 januari van het vervaljaar in werking zullen treden. Latere vaststelling
      kan evenwel plaatsvinden indien daarvoor bijzondere redenen zijn.
    url: https://wetten.overheid.nl/BWBR0006353/2015-01-01#Artikel2
  - number: '3'
    text: |-
      1 Degene op wiens loon in het jaar, voorafgaande aan het vervaljaar door een inhoudingsplichtige ingevolge
      [Hoofdstuk II van de Wet financiering volksverzekeringen][ref1] premie voor de volksverzekeringen dan wel
      premievervangende loonbelasting is ingehouden, heeft met ingang van 1 januari van het vervaljaar jegens deze
      inhoudingsplichtige recht op een verhoging van zijn per betalingstermijn uit te betalen loon. Dit recht vervalt
      zodra te zijnen aanzien overeenkomstig artikel 8 van dit artikel is afgeweken.

      2 Het bedrag van de verhoging is gelijk aan een bij ministeriële regeling vast te stellen percentage over het
      loon betreffende de betalingstermijn waarbinnen 1 januari van het vervaljaar valt, doch bedraagt op jaarbasis
      ten hoogste een bij die regeling bepaald bedrag. Bedoeld maximumbedrag wordt naar evenredigheid verminderd bij
      een arbeidsduur welke korter is dan de arbeidsduur die in overeenkomstige arbeidsverhoudingen in de regel geacht
      wordt een volledige dienstbetrekking te vormen. Bedoeld percentage en maximumbedrag worden afgeleid van, en
      tegelijkertijd vastgesteld met, de vaststelling van de overhevelingstoeslag voor het jaar dat voorafgaat aan het
      vervaljaar, dan wel de vaststelling van de overhevelingstoeslag per 1 januari van het vervaljaar, zo deze heeft
      plaatsgevonden.

      3 Bij de berekening van het bedrag van de verhoging worden bestanddelen van het loon, waarvan de hoogte afhankelijk
      is gesteld van het per betalingstermijn uit te betalen loon, buiten beschouwing gelaten.

      4 Het recht, bedoeld in het eerste lid, geldt niet met betrekking tot loon in de vorm van uitkeringen en
      verstrekkingen:

      a. uit hoofde van de [Algemene Ouderdomswet][ref2], de [Algemene nabestaandenwet][ref3],
      de Algemene Arbeidsongeschiktheidswet, de [Ziektewet][ref4],
      de[ Wet arbeid en zorg][ref5], de [Wet op de arbeidsongeschiktheidsverzekering][ref6],
      de [Werkloosheidswet][ref7], de [Toeslagenwet][ref8], de [Participatiewet][ref9], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref10], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref11];

      b. uit hoofde van de krachtens artikel 1, eerste lid, tweede volzin, onderdeel *b*, van de Wet overhevelingstoeslag
      opslagpremies aangewezen regelingen;

      c. die zijn aangewezen bij ministeriële regeling.


