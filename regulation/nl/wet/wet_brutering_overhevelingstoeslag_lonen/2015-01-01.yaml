  - number: '6'
    text: |-
      1 Deze wet leidt niet tot andere, voorafgaande aan 1 januari van het vervaljaar verworven of aangegane, in
      geld uitgedrukte aanspraken, rechten en verplichtingen voor een belanghebbende bij een pensioenregeling van een
      pensioenfonds of van een werkgever dan wanneer deze wet niet tot stand zou zijn gekomen.

      2 Ingaande 1 januari van het vervaljaar wordt gedurende een periode van vier jaren voor de berekening van
      aanspraken, rechten en verplichtingen voor een belanghebbende bij een pensioenregeling van een pensioenfonds of
      van een werkgever het loon verminderd met het krachtens [artikel 3, tweede lid][ref1], vastgestelde percentage en
      maximumbedrag overeenkomstig bij ministeriële regeling vast te stellen voorschriften.

      3 Het ingaande 1 januari van het vervaljaar niet meer van kracht zijn van de artikelen 81 en 82 van de Wet
      aanpassing uitkeringsregelingen overheveling opslagpremies zal gedurende een periode van vier jaren met
      betrekking tot uitkeringen ingevolge de [Algemene Ouderdomswet][ref2] of de [Algemene nabestaandenwet][ref3] niet
      leiden tot andere in guldens uitgedrukte aanspraken, rechten en verplichtingen voor een belanghebbende bij een
      pensioenregeling van een pensioenfonds of van een werkgever dan wanneer deze artikelen van kracht zouden zijn
      gebleven.

      4 Onze Minister van Sociale Zaken en Werkgelegenheid kan voor een goede toepassing van het derde lid bij
      ministeriële regeling regels vaststellen, alsmede bedragen op grond van de [Algemene Ouderdomswet][ref4] en de
      [Algemene nabestaandenwet][ref5] die met inachtneming van die regels worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0007795
