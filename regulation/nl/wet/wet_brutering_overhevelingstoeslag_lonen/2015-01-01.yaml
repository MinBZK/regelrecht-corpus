        artikel: '3'
  - number: '5'
    text: |-
      De laatstelijk voor het jaar dat voorafgaat aan het vervaljaar vastgestelde bedragen, genoemd in
      [artikel 8, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], worden verhoogd met een van de
      overhevelingstoeslag afgeleid bij ministeriële regeling vast te stellen percentage. De herziene bedragen treden
      in de plaats van de bedragen, genoemd in artikel 8, eerste lid, van die wet en gelden ingaande 1 januari van het
      vervaljaar als basis voor de toepassing van artikel 14 van die wet. Bij deze toepassing blijft de ontwikkeling van
      de contractlonen als gevolg van de [artikelen 3][ref2] en [8][ref3] buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0006353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006353#Artikel8
    url: https://wetten.overheid.nl/BWBR0006353/2015-01-01#Artikel5
