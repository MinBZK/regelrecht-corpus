  - number: '4'
    text: |-
      1 Ter zake van loon, waarop vóór het vervaljaar aanspraak dan wel recht is ontstaan, doch waarvan eerst in of na
      het vervaljaar premie voor de volksverzekeringen dan wel premievervangende loonbelasting wordt ingehouden, bestaat
      op het tijdstip waarop de betreffende inhouding plaatsvindt jegens de inhoudingsplichtige recht op een verhoging.
      [Artikel 3, tweede lid][ref1], is van overeenkomstige toepassing.

      2 Dit artikel is niet van toepassing op de in [artikel 3, vierde lid][ref2], bedoelde uitkeringen en
      verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006353#Artikel3
    url: https://wetten.overheid.nl/BWBR0006353/2015-01-01#Artikel4
