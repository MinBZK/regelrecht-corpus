preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de totstandkoming van de derde tranche van de Algemene wet bestuursrecht
    het wenselijk maakt een wettelijk kader te scheppen voor de verstrekking van subsidies door de Minister van Sociale
    Zaken en Werkgelegenheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister: Onze Minister van Sociale
      Zaken en Werkgelegenheid of Onze Minister die belast is met de zorg voor een of meer onderdelen van het beleid,
      genoemd in [artikel 2][ref1].

      2 Deze wet is van toepassing op de verstrekking van subsidie door Onze Minister, behoudens indien die subsidie
      wordt verstrekt krachtens een andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008754#Artikel2
    url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008754
        artikel: '2'
  - number: '2'
    text: |-
      Onze Minister kan subsidies verstrekken voor activiteiten welke passen in:

      a. het werkgelegenheidsbeleid en het arbeidsmarktbeleid;

      b. het arbeidsomstandighedenbeleid;

      c. het arbeidsverhoudingenbeleid;

      d. het inkomensbeleid;

      e. het sociale zekerheidsbeleid;

      f. het kinderopvangbeleid;

      g. het inburgeringsbeleid en het integratiebeleid.
    url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onverminderd [hoofdstuk 3 van de Financiële-verhoudingswet][ref1] kunnen bij of krachtens algemene maatregel
      van bestuur of bij regeling van Onze Minister terzake van de verstrekking van subsidie regels worden gesteld met
      betrekking tot:

      a. de activiteiten waarvoor subsidie kan worden verstrekt en wie daarvoor in aanmerking komt;

      b. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;

      c. de aanvraag van een subsidie en de besluitvorming daarover;

      d. de voorwaarden waaronder de subsidie wordt verleend;

      e. de verplichtingen van de subsidie-ontvanger;

      f. de vaststelling van de subsidie;

      g. intrekking en wijziging van de subsidieverlening of -vaststelling;

      h. de betaling van de subsidie en het verlenen van voorschotten;

      i. andere criteria voor de verstrekking van subsidie.

      2 In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref2] is titel 4.2 van die wet van
      toepassing op subsidies die worden verstrekt op grond van een algemene maatregel van bestuur of een ministeriële
      regeling als bedoeld in het eerste lid, die uitsluitend voorziet in verstrekking aan rechtspersonen die krachtens
      publiekrecht zijn ingesteld.

      3 Onze Minister kan bij het verwerken van persoonsgegevens in het kader van subsidieverstrekking op grond van deze
      wet gebruik maken van het burgerservicenummer, bedoeld in artikel 1, onderdeel b, van de Wet algemene bepalingen
      burgerservicenummer met het oog op rapportage over en evaluatie van de besteding van subsidie.

      4 De subsidie-ontvanger vermeldt bij het verstrekken van persoonsgegevens aan Onze Minister in verband met de
      besteding van subsidie het burgerservicenummer van de persoon op wie de persoonsgegevens betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel421
    url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008290
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:21
  - number: '4'
    text: |-
      Onze Minister verstrekt slechts subsidie op grond van een algemene maatregel van bestuur of een ministeriële
      regeling als bedoeld in [artikel 3][ref1], tenzij het een subsidie betreft:

      a. als bedoeld in [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref2] of

      b. waarvan de voorgenomen verstrekking tevoren is meegedeeld aan de beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008754#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel423
    url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008754
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:23
  - number: '5'
    text: |-
      Onze Minister stelt een subsidieplafond vast voor de verschillende activiteiten waarvoor op grond van deze wet
      subsidie kan worden verstrekt en bepaalt daarbij hoe het beschikbare bedrag wordt verdeeld, tenzij Onze Minister
      van Financiën heeft ingestemd met het achterwege laten daarvan.
    url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#Artikel5
  - number: '6'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '7'
    text: |-
      1 Een aanvraag kan worden afgewezen en een beschikking tot subsidieverstrekking op grond van deze wet kan worden
      ingetrokken of gewijzigd voorzover subsidieverstrekking in strijd zou zijn respectievelijk in strijd is met
      ingevolge een verdrag voor de staat geldende verplichtingen.

      2 Bij de intrekking of wijziging kan worden bepaald, dat over onverschuldigd betaalde subsidiebedragen een
      rentevergoeding verschuldigd is.

      3 De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt, tenzij bij de
      intrekking of wijziging anders is bepaald.

      4 De [artikelen 4:49][ref1], derde lid, en [4:57, vierde lid, van de Algemene wet bestuursrecht][ref2] zijn niet
      van toepassing op de intrekking of wijziging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel457
    url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:49
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:57
  - number: '8'
    text: |-
      1 Met het toezicht op de naleving van de bij of krachtens deze wet aan de subsidieontvanger opgelegde
      verplichtingen zijn belast de bij besluit van Onze Minister aangewezen personen. Van dat besluit wordt mededeling
      gedaan door plaatsing in de *Staatscourant*.

      2 Aan subsidies op grond van deze wet is de verplichting verbonden dat de subsidieontvanger aan een toezichthouder
      alle medewerking verleent die deze redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#Artikel8
  - number: '9'
    text: |-
      Deze wet is, met uitzondering van [artikel 3, tweede lid][ref1], van overeenkomstige toepassing op spoedeisende,
      tijdelijke verstrekking door Onze Minister van aanspraken op financiële middelen, niet zijnde subsidies, behoudens
      indien die aanspraak wordt verstrekt krachtens een andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008754#Artikel3
    url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008754
        artikel: '3'
  - number: '10'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#Artikel10
  - number: '11'
    text: 'Deze wet wordt aangehaald als: Kaderwet SZW-subsidies.'
    url: https://wetten.overheid.nl/BWBR0008754/2016-01-01#Artikel11
