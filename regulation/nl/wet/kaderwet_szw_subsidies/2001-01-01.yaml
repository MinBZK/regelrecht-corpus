---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: kaderwet_szw_subsidies
regulatory_layer: WET
publication_date: '2015-12-10'
valid_from: '2001-01-01'
bwb_id: BWBR0008754
url: https://wetten.overheid.nl/BWBR0008754/2001-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat de totstandkoming van de derde tranche van de Algemene wet bestuursrecht
    het wenselijk maakt een wettelijk kader te scheppen voor de verstrekking van subsidies door de Minister van Sociale
    Zaken en Werkgelegenheid;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze wet is van toepassing op de verstrekking van subsidies door Onze Minister van Sociale Zaken en
      Werkgelegenheid, hierna te noemen Onze Minister, behoudens indien die subsidie wordt verstrekt krachtens een andere
      wet.
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel1
  - number: '2'
    text: 'Onze Minister kan subsidies verstrekken voor activiteiten welke passen in:'
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel2
  - number: 2.a
    text: het werkgelegenheidsbeleid en het arbeidsmarktbeleid;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel2
  - number: 2.b
    text: het arbeidsomstandighedenbeleid;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel2
  - number: 2.c
    text: het arbeidsverhoudingenbeleid;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel2
  - number: 2.d
    text: het inkomensbeleid;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel2
  - number: 2.e
    text: het sociale zekerheidsbeleid;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel2
  - number: 2.f
    text: het emancipatiebeleid.
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel2
  - number: '3.1'
    text: |-
      Onverminderd [hoofdstuk 3 van de Financiële-verhoudingswet][ref1] kunnen bij of krachtens algemene maatregel
      van bestuur of bij regeling van Onze Minister terzake van de verstrekking van subsidie regels worden gesteld met
      betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008290
        hoofdstuk: '3'
  - number: 3.1.a
    text: de activiteiten waarvoor subsidie kan worden verstrekt en wie daarvoor in aanmerking komt;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
  - number: 3.1.b
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
  - number: 3.1.c
    text: de aanvraag van een subsidie en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
  - number: 3.1.d
    text: de voorwaarden waaronder de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
  - number: 3.1.e
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
  - number: 3.1.f
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
  - number: 3.1.g
    text: intrekking en wijziging van de subsidieverlening of -vaststelling;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
  - number: 3.1.h
    text: de betaling van de subsidie en het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
  - number: 3.1.i
    text: andere criteria voor de verstrekking van subsidie.
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
  - number: '3.2'
    text: |-
      Verplichtingen als bedoeld in [artikel 4:39 van de Algemene wet bestuursrecht][ref1] kunnen slechts bij algemene
      maatregel van bestuur aan de subsidie worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '3.3'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is titel 4.2 van die wet van
      toepassing op subsidies die worden verstrekt op grond van een algemene maatregel van bestuur of een ministeriële
      regeling als bedoeld in het eerste lid, die uitsluitend voorziet in verstrekking aan rechtspersonen die krachtens
      publiekrecht zijn ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '4'
    text: |-
      Onze Minister verstrekt slechts subsidie op grond van een algemene maatregel van bestuur of een ministeriële
      regeling als bedoeld in [artikel 3][ref1], tenzij het een subsidie betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0008754#Artikel3
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008754
        artikel: '3'
  - number: 4.a
    text: |-
      als bedoeld in [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.b
    text: waarvan de voorgenomen verstrekking tevoren is meegedeeld aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel4
  - number: '5'
    text: |-
      Onze Minister stelt een subsidieplafond vast voor de verschillende activiteiten waarvoor op grond van deze wet
      subsidie kan worden verstrekt en bepaalt daarbij hoe het beschikbare bedrag wordt verdeeld, tenzij Onze Minister
      van Financiën heeft ingestemd met het achterwege laten daarvan.
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel5
  - number: '6'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '7.1'
    text: |-
      Een aanvraag kan worden afgewezen en een beschikking tot subsidieverstrekking op grond van deze wet kan worden
      ingetrokken of gewijzigd voorzover subsidieverstrekking in strijd zou zijn respectievelijk in strijd is met
      ingevolge een verdrag voor de staat geldende verplichtingen.
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel7
  - number: '7.2'
    text: |-
      Bij de intrekking of wijziging kan worden bepaald, dat over onverschuldigd betaalde subsidiebedragen een
      rentevergoeding verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel7
  - number: '7.3'
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt, tenzij bij de
      intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel7
  - number: '7.4'
    text: |-
      De [artikelen 4:49][ref1], derde lid, en [4:57 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing op
      de intrekking of wijziging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '8.1'
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet aan de subsidieontvanger opgelegde verplichtingen
      zijn belast de bij besluit van Onze Minister aangewezen personen. Van dat besluit wordt mededeling gedaan door
      plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel8
  - number: '8.2'
    text: |-
      Aan subsidies op grond van deze wet is de verplichting verbonden dat de subsidieontvanger aan een toezichthouder
      alle medewerking verleent die deze redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel8
  - number: '9'
    text: |-
      Deze wet is, met uitzondering van [artikel 3, derde lid][ref1], van overeenkomstige toepassing op spoedeisende,
      tijdelijke verstrekking door Onze Minister van aanspraken op financiële middelen, niet zijnde subsidies, behoudens
      indien die aanspraak wordt verstrekt krachtens een andere wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008754#Artikel3
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008754
        artikel: '3'
  - number: '10'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel10
  - number: '11'
    text: 'Deze wet wordt aangehaald als: Kaderwet SZW-subsidies.'
    url: https://wetten.overheid.nl/BWBR0008754/2001-01-01#Artikel11
