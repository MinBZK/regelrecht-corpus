    text: |-
      1 In deze regeling wordt verstaan onder de Stimuleringsregeling: de
      [Tijdelijke stimuleringsregeling regulier maken 10.000 ID-banen][ref1].

      2 [Artikel 1][ref2] van de Stimuleringsregeling is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014717
      [ref2]: https://wetten.overheid.nl/BWBR0014997#Artikel1
    url: https://wetten.overheid.nl/BWBR0014997/2004-02-15#Artikel1
