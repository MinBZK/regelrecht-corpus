        artikel: '1'
  - number: '2'
    text: |-
      1 De minister verstrekt een subsidie aan een werkgever indien:

      a. aan die werkgever een subsidie wordt verstrekt op grond van de Stimuleringsregeling;

      b. die werkgever of de ID-dienstbetrekking bij die werkgever blijkens de in de door hem ingediende
      aanvraag, bedoeld in [artikel 4][ref1], opgegeven sector gerekend wordt tot een van de sectoren, genoemd in
      [artikel 3, eerste en tweede lid][ref2], en

      c. de opgave van die sector niet kennelijk onjuist is.

      2 De subsidie wordt verleend onder de voorwaarde dat de in het eerste lid bedoelde sector dezelfde is als de
      door burgemeester en wethouders in de verklaring, bedoeld in [artikel 6, eerste lid, onderdeel b][ref3], van de
      Stimuleringsregeling op te geven sector.

      3 Indien niet is voldaan aan de voorwaarde, bedoeld in het eerste lid, onderdeel c, of de voorwaarde, bedoeld
      in het tweede lid, wordt de werkgever in de gelegenheid gesteld aan te tonen tot welke sector de werkgever of
      de ID-dienstbetrekking gerekend moet worden. Indien de werkgever dit niet binnen drie weken na ontvangst van een
      schriftelijk verzoek daartoe aantoont wordt geen subsidie verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0014997#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0014997#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0014997#Artikel6
    url: https://wetten.overheid.nl/BWBR0014997/2004-02-15#Artikel2
    references:
