        artikel: '6'
  - number: '3'
    text: |-
      1 Subsidies als bedoeld in [artikel 2, eerste lid][ref1], worden verstrekt voor ten hoogste:

      a. 2554 aanvragen uit de sector zorg;

      b. 907 aanvragen uit de sector welzijn;

      c. 32 aanvragen uit de sector jeugdhulpverlening.

      2 Voor de verstrekking van de subsidies, bedoeld in [artikel 2, eerste lid][ref2], voor aanvragen uit de volgende
      sectoren is beschikbaar:

      a. cultuur: € 3.375.000, waarvan € 500.000,– in het jaar 2004;

      b. kinderopvang: € 1.800.000.

      3 De ingevolge het eerste en tweede lid beschikbare subsidies worden verdeeld in volgorde van ontvangst van de
      volledige aanvragen, bedoeld in [artikel 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014997#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014997#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0014997#Artikel4
    url: https://wetten.overheid.nl/BWBR0014997/2004-02-15#Artikel3
