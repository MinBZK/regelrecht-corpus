        artikel: '4'
  - number: '4'
    text: |-
      De door de werkgever ingediende aanvraag voor subsidie op grond van de Stimuleringsregeling wordt aangemerkt als
      een aanvraag voor een subsidie als bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014997#Artikel2
    url: https://wetten.overheid.nl/BWBR0014997/2004-02-15#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014997
        artikel: '2'
  - number: '5'
    text: |-
      1 De subsidie, bedoeld in [artikel 2, eerste lid][ref1], bedraagt in geval van een reguliere dienstbetrekking met
      een arbeidsduur van 32 uren of meer per week:

      a. voor de sector zorg € 3500;

      b. voor de sector welzijn € 4000;

      c. voor de sector jeugdhulpverlening € 3500;

      d. voor de sector cultuur € 9000;

      e. voor de sector kinderopvang € 2500.

      2 De subsidie, bedoeld in het eerste lid, wordt naar rato van 32 uren verminderd wanneer de arbeidsduur van de
      reguliere dienstbetrekking minder dan 32 uren per week bedraagt.

      3 De subsidie wordt verleend voor een tijdvak dat eindigt op de datum waarop het tijdvak eindigt waarvoor de
      subsidie op grond van de [Stimuleringsregeling][ref2] wordt verleend.

      4 De subsidies worden bij wijze van voorschot betaalbaar gesteld op het tijdstip, bedoeld in
      [artikel 7, vierde lid, van de Stimuleringsregeling][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0014997#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014717
      [ref3]: https://wetten.overheid.nl/BWBR0014717#Artikel7
