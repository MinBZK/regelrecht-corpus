  - number: '37.2'
    text: |-
      Het in het eerste lid bedoelde bevel wordt op vordering van de Officier van Justitie gegeven door de rechter voor
      wie de zaak wordt of zal worden vervolgd. De kapitein wordt vooraf gehoord of althans behoorlijk opgeroepen. Het
      bevel is dadelijk uitvoerbaar en wordt onverwijld aan de kapitein betekend.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37
  - number: '37.3'
    text: |-
      Van het bevel of de beschikking tot afwijzing van de vordering kan de verdachte binnen veertien dagen na de
      betekening en het Openbaar Ministerie binnen veertien dagen in beroep komen bij het gerechtshof. Het hof beslist zo
      spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37
  - number: '37.4'
    text: |-
      Zodra het in de strafzaak gewezen vonnis onherroepelijk is geworden, wordt de gestorte geldsom wederom ter
      beschikking van de rechthebbende gesteld, nadat daarop een bij dat vonnis opgelegde boete in mindering is gebracht.
      Tot dat tijdstip en te rekenen van de dag dat de geldsom werd gestort, wordt over die som de wettelijke rente
      vergoed.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37
  - number: '37.5'
    text: |-
      Het eerste lid is ook van toepassing op buitenlandse schepen, voorzover de in dat lid bedoelde voorschriften zich
      mede richten tot buitenlandse schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37
  - number: 37a.1
    text: 'Ten aanzien van handelingen door schepen als bedoeld in artikel 2 van de Vaartuigenwet 1930 BES geldt het volgende:'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37a
  - number: 37a.1.a
    text: |-
      Handelingen in strijd met de voorschriften gesteld krachtens de [artikelen 5, eerste lid][ref1], en
      [12, eerste, zesde, zevende en achtste lid][ref2], van deze wet, voor zover opzettelijk begaan, zijn misdrijven en
      worden gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel12
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '12'
        hoofdstuk: III
        paragraaf: '3'
  - number: 37a.1.b
    text: |-
      Handelingen als bedoeld in onderdeel a, die geen misdrijven zijn, zijn overtredingen en worden gestraft met
      hechtenis van ten hoogste een jaar of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37a
  - number: 37a.1.c
    text: |-
      Handelingen in strijd met de voorschriften gesteld krachtens de [artikelen 10, eerste lid][ref1], en
      [11, eerste lid][ref2], en de voorschriften gesteld bij of krachtens artikel 11, tweede lid, van deze wet, voor
      zover opzettelijk begaan, zijn misdrijven en worden gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel11
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '11'
        hoofdstuk: III
        paragraaf: '3'
  - number: 37a.1.d
    text: |-
      Handelingen als bedoeld in onderdeel b, die geen misdrijven zijn, zijn overtredingen en worden gestraft met
      hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37a
  - number: 37a.2
    text: 'Als bijkomende straf kan worden opgelegd:'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37a
  - number: 37a.2.a
    text: |-
      gehele of gedeeltelijke stillegging van de onderneming van de veroordeelde, waarin de overtreding is begaan voor
      een tijd van ten hoogste een jaar; of,
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37a
  - number: 37a.2.b
    text: verbeurdverklaring van de voorwerpen, genoemd in artikel 35 van het Wetboek van Strafvordering BES.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37a
  - number: 37a.3
    text: |-
      Met het opsporen van de in het eerste en tweede lid strafbaar gestelde feiten zijn, onverminderd de bij of
      krachtens artikel 184 van het Wetboek van Strafvordering BES aangewezen ambtenaren, belast de door Onze Minister
      van Justitie, in overeenstemming met Onze Minister, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37a
  - number: 37b
    text: |-
      Ingeval bij of krachtens deze wet wordt verwezen naar in het kader van de Internationale Maritieme Organisatie van
      de Verenigde Naties tot stand gekomen besluiten die betrekking hebben op de voorkoming van verontreiniging door
      schepen, kan overtreding van deze besluiten ook als strafbaar feit worden aangemerkt indien deze besluiten in de
      Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel37b
  - number: '38'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van verdragen of besluiten van
      volkenrechtelijke organisaties die betrekking hebben op de voorkoming van verontreiniging door schepen, nadere
      regels worden gesteld met betrekking tot de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel38
  - number: '39.1'
    text: Een voordracht voor een algemene maatregel van bestuur krachtens deze wet wordt gedaan door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel39
  - number: '39.2'
    text: |-
      Voorzover een algemene maatregel van bestuur bepalingen bevat krachtens de [artikelen 1, onderdeel h][ref1],
      [5][ref2], [6][ref3] of [6a][ref4], wordt de voordracht ten aanzien van die bepalingen gedaan door Onze Minister,
      mede namens Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003642#Artikel6a
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '1'
        hoofdstuk: I
      - id: ref2
