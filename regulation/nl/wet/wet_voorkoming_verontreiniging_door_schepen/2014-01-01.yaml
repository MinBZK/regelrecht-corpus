$id: wet_voorkoming_verontreiniging_door_schepen
regulatory_layer: WET
publication_date: '2023-05-10'
valid_from: '2014-01-01'
bwb_id: BWBR0003642
url: https://wetten.overheid.nl/BWBR0003642/2014-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de bekrachtiging van het op 2
    november 1973 te Londen tot stand gekomen Internationaal Verdrag ter voorkoming van verontreiniging door schepen
    met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147 en 1978, 187), zoals gewijzigd en aangevuld bij het
    op 17 februari 1978 te Londen tot stand gekomen Protocol bij dat Verdrag met Bijlage en Aanhangsels (Trb. 1978,
    188), regelen vast te stellen teneinde uitvoering te kunnen geven aan de bepalingen van dit Verdrag en Protocol
    voor Nederland;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.b
    text: 'inspecteur-generaal: inspecteur-generaal van de Inspectie Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.c
    text: |-
      de ambtenaren van de Inspectie Verkeer en Waterstaat: de door Onze Minister aangewezen ambtenaar van de Inspectie
      Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.d
    text: |-
      Verdrag: het op 2 november 1973 te Londen tot stand gekomen Internationaal Verdrag ter voorkoming van
      verontreiniging door schepen, met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147), en met het op
      17 februari 1978 te Londen tot stand gekomen Protocol bij dat Verdrag met Bijlage en Aanhangsels (Trb. 1978, 188);
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.e
    text: |-
      VN-Zeerechtverdrag: het op 10 december 1982 te Montego-Bay totstandgekomen Verdrag van de Verenigde Naties inzake
      het recht van de zee (Trb. 1983, 83);
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.f
    text: |-
      SOLAS-verdrag: het op 1 november 1974 te Londen totstandgekomen Verdrag inzake de beveiliging van mensenlevens op
      zee (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.g
    text: 'richtlijn havenontvangstvoorzieningen: de bij regeling van Onze Minister aangewezen richtlijn;'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.h
    text: 'schadelijke stof: stof die valt onder het toepassingsbereik van Bijlage I, II, III, IV of V van het Verdrag.'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.i
    text: |-
      ballastwater: water met daarin zwevende deeltjes dat aan boord wordt genomen teneinde de trim, helling, diepgang,
      stabiliteit van of krachten op het schip te beheersen;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.j
    text: 'sedimenten: alle bezinksels uit het ballastwater van een schip;'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.k
    text: |-
      schip: elk vaartuig, van welk type ook, dat op zee wordt gebruikt waaronder begrepen draagvleugelboten,
      luchtkussenvoertuigen, afzinkbare vaartuigen en drijvend materieel, alsmede installaties gedurende de tijd dat zij
      drijven, behoudens wanneer het schip als hierboven bedoeld boven de zeebodem is geplaatst voor het instellen van
      een onderzoek naar de aanwezigheid van delfstoffen of voor het winnen daarvan;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.l
    text: |-
      Nederlands schip: een schip dat op grond van Nederlandse rechtsregels gerechtigd is de vlag van het Koninkrijk
      te voeren;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.m
    text: |-
      buitenlands schip: een schip, niet zijnde een Nederlands schip en een schip als bedoeld in
      [artikel 2 van de Vaartuigenwet 1930 BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: 1.n
    text: |-
      pleziervaartuig: schip, bestemd of gebruikt voor sport of vrijetijdsbesteding, ongeacht het type en de wijze van
      voortstuwing;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.o
    text: |-
      vissersvaartuig: schip, uitgerust of met commercieel oogmerk gebruikt voor het vangen van vis of andere levende
      rijkdommen van de zee;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.p
    text: |-
      scheepsafval: afval, met inbegrip van residuen, niet zijnde ladingresiduen, en sanitair afval, dat ontstaat tijdens
      de bedrijfsvoering van een schip en valt onder de reikwijdte van de Bijlagen I, IV en V van het Verdrag, alsmede
      ladinggebonden afval, zijnde al het materiaal dat aan boord bij de stuwage en verwerking van lading als afval
      overblijft, met inbegrip van stuwmateriaal, schoorpalen, laadborden, verpakkingsmateriaal, houten platen, papier,
      karton, draad en stalen banden;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.q
    text: |-
      ladingresiduen: de restanten van lading in ruimen of tanks aan boord die na het lossen en schoonmaken
      achterblijven, met inbegrip van restanten na lading of lossing en morsingen;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.r
    text: |-
      lozen: elk vrijkomen van een schip van schadelijke stoffen, ballastwater of sedimenten, hoe ook veroorzaakt,
      waaronder begrepen ontsnappen, overboord zetten, wegvloeien, weglekken, pompen of ledigen;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.s
    text: 'voorval: een gebeurtenis die er daadwerkelijk toe leidt of er vermoedelijk toe zal leiden dat in zee wordt geloosd;'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.t
    text: |-
      haven: een rede, pier of steiger en in het algemeen iedere plaats, al of niet in zee, waar schepen ligplaats kunnen
      hebben of waar opvarenden en zaken ingescheept of ontscheept kunnen worden;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.u
    text: 'exploitant: de eigenaar, rompbevrachter of ieder ander die de zeggenschap heeft over het gebruik van een schip;'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.v
    text: 'kapitein: de gezagvoerder of schipper van een schip dan wel degene die deze vervangt;'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: 1.w
    text: |-
      havenontvangstvoorziening: de voorziening, bedoeld in [artikel 6, eerste lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 1.x
    text: |-
      havenbeheerder: de beheerder, bedoeld in [artikel 6, eerste lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 1.y
    text: |-
      havenafvalplan: het plan, bedoeld in [artikel 6, derde lid, eerste volzin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 1.z
    text: |-
      richtlijn monitoring- en informatiesysteem zeescheepvaart: de bij regeling van Onze Minister aangewezen richtlijn
      inzake communautaire monitoring- en informatiesystemen voor de zeescheepvaart.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel1
  - number: '2.1'
    text: |-
      Deze wet is van toepassing op Nederlandse en, in de gevallen bij of krachtens deze wet bepaald, buitenlandse
      schepen en schepen als bedoeld in artikel 2 van de Vaartuigenwet 1930 BES.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de krachtens deze wet gestelde regels ook van toepassing
      worden verklaard op schepen als bedoeld in artikel 2 van de Vaartuigenwet 1930 BES.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel2
  - number: '3'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel3
  - number: 3.a
    text: |-
      oorlogsschepen, marinehulpschepen en andere schepen die in gebruik zijn voor de uitvoering van de militaire taak,
      ongeacht hun nationaliteit;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel3
  - number: 3.b
    text: |-
      schepen in eigendom of beheer bij een vreemde staat, niet zijnde schepen als bedoeld in onderdeel a, gedurende de
      tijd dat zij uitsluitend worden gebruikt voor andere dan handelsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel3
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van schepen geheel of gedeeltelijk van de toepassing van een
      of meer krachtens deze wet gegeven regels en voorschriften worden uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel4
  - number: '5.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter bescherming en behoud van het milieu regels gesteld met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel5
  - number: 5.1.a
    text: verboden lozingen van schadelijke stoffen in zee vanaf schepen;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel5
  - number: 5.1.b
    text: verboden lozingen van ballastwater en sedimenten vanaf schepen;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel5
  - number: 5.1.c
    text: overige verboden gedragingen vanaf of aan boord van schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel5
  - number: '5.2'
    text: |-
      De bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur te geven regelen kunnen onder meer
      verschillen al naar gelang deze regelen verschillende categorieën van schepen, te bevaren zeegebieden, te maken
      reizen of te vervoeren schadelijke stoffen betreffen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel5
  - number: '5.3'
    text: 'De krachtens het eerste lid gestelde regels zijn ook van toepassing op buitenlandse schepen:'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel5
  - number: 5.3.a
    text: |-
      in de Nederlandse territoriale zee of, voorzover het in dat lid bedoelde verbod betrekking heeft op de
      voorschriften van het Verdrag of voorzover met dat verbod toepassing wordt gegeven aan artikel 220 van het VN-
      Zeerechtverdrag, in de Nederlandse exclusieve economische zone;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel5
  - number: 5.3.b
    text: |-
      in de territoriale zee of de exclusieve economische zone van een vreemde staat dan wel op volle zee, voorzover
      het in dat lid bedoelde verbod betrekking heeft op de voorschriften van het Verdrag of voorzover met dat verbod
      toepassing wordt gegeven aan artikel 218 van het VN-Zeerechtverdrag.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel5
  - number: '5.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de krachtens het eerste lid, onderdeel c, gestelde regels
      ook van toepassing worden verklaard op buitenlandse schepen gedurende de tijd dat deze zich bevinden op de
      Nederlandse binnenwateren.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel5
  - number: '6.1'
    text: |-
      De beheerder van een bij of krachtens algemene maatregel van bestuur aangewezen haven draagt zorg voor een
      toereikende voorziening, geschikt voor het in ontvangst nemen van:
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: 6.1.a
    text: |-
      scheepsafval en overige schadelijke stoffen dan wel restanten van schadelijke stoffen, afkomstig van schepen die de
      desbetreffende haven gewoonlijk aandoen;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: 6.1.b
    text: |-
      bij of krachtens algemene maatregel van bestuur aangewezen stoffen of uitrusting die deze stoffen bevat en die van
      schepen worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: 6.1.c
    text: bij of krachtens algemene maatregel van bestuur aangewezen stoffen, afkomstig van schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: '6.2'
    text: |-
      De afgifte van scheepsafval en de in het eerste lid, onderdelen a en c, bedoelde stoffen en de stoffen
      en uitrusting die deze stoffen bevat als bedoeld in het eerste lid, onderdeel b bij een houder van een
      havenontvangstvoorziening geschiedt uitsluitend op de bij of krachtens algemene maatregel van bestuur ten aanzien
      van het scheepsafval of de desbetreffende stof of de uitrusting die de desbetreffende stof bevat bepaalde wijze.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: '6.3'
    text: |-
      De havenbeheerder stelt, na overleg met de betrokken partijen, in het bijzonder de havengebruikers, voor een
      termijn van ten hoogste drie jaar, een passend plan voor ontvangst en verwerking van scheepsafval en de in het
      eerste lid, onderdeel a bedoelde andere stoffen vast. Bij of krachtens algemene maatregel van bestuur worden nadere
      regels gegeven met betrekking tot de inhoud, de wijze van vaststelling, de aanbieding aan het met de goedkeuring
      belaste bestuursorgaan en de bekendmaking van het havenafvalplan.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: '6.4'
    text: |-
      Twee of meer havenbeheerders kunnen gezamenlijk een havenafvalplan als bedoeld in het derde lid vaststellen, mits
      daarin de behoefte aan en de beschikbaarheid van havenontvangstvoorzieningen voor elke haven apart worden vermeld,
      onverminderd het bepaalde bij en krachtens het derde lid.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: '6.5'
    text: |-
      Het havenafvalplan behoeft de goedkeuring van Onze Minister. Bij algemene maatregel van bestuur kan worden
      bepaald dat aan het plan goedkeuring wordt verleend dan wel onthouden door een bij die maatregel aangewezen ander
      bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: '6.6'
    text: |-
      De havenbeheerder houdt een registratie bij van de in zijn haven afgegeven hoeveelheden scheepsafval en andere
      stoffen als bedoeld in het eerste lid, onderdeel a. Hij bewaart de geregistreerde gegevens gedurende vijf jaar na
      ontvangst van de gegevens en verstrekt gegevens uit deze registratie, dan wel inlichtingen omtrent deze gegevens
      aan Onze Minister op diens verzoek.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: '6.7'
    text: |-
      De houder van een havenontvangstvoorziening verschaft de havenbeheerder desgevraagd alle inlichtingen met
      betrekking tot de in de desbetreffende haven afgegeven hoeveelheden scheepsafval en andere stoffen als bedoeld in
      het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: '6.8'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld met betrekking tot de aard, de registratie en de verstrekking
      van de gegevens en de inlichtingen bedoeld in het zesde en zevende lid.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: '6.9'
    text: |-
      De havenbeheerder is ter uitvoering van de in het eerste lid opgelegde verplichting bevoegd degene die een bepaalde
      los- of laadplaats of scheepsreparatiewerf in zijn haven in bedrijf heeft, te verplichten zorg te dragen voor een
      voldoende havenontvangstvoorziening, geschikt voor het in ontvangst nemen van scheepsafval en andere stoffen als
      bedoeld in het eerste lid, onderdelen a en c, en stoffen en uitrusting die deze stoffen bevat als bedoeld in het
      eerste lid, onderdeel b, van schepen die gebruik maken van die los- of laadplaats of scheepsreparatiewerf.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: '6.10'
    text: Dit artikel is ook van toepassing op buitenlandse schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6
  - number: 6a.1
    text: |-
      De havenbeheerder heft van de exploitant van een schip dat zijn haven aandoet, niet zijnde een pleziervaartuig
      waarmee niet meer dan twaalf passagiers mogen worden vervoerd of vissersvaartuig, bij iedere aanloop van dat schip
      een bijdrage in de kosten van het in die haven in ontvangst nemen, opslaan en verwerken van scheepsafval.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6a
  - number: 6a.2
    text: |-
      De hoogte van de bijdrage wordt door de havenbeheerder vastgesteld. Hij doet dit zodanig dat de som van de
      jaarlijks geheven bijdragen tenminste gelijk is aan het bij regeling van Onze Minister te bepalen percentage van
      de totale jaarlijkse kosten van het in ontvangst nemen, opslaan en verwerken van scheepsafval in de desbetreffende
      haven. De havenbeheerder maakt de bijdragen alsmede de grondslagen ervan bekend in het havenafvalplan. Bij of
      krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de hoogte van de bijdrage
      van schepen die door hun milieuzorgsysteem, het ontwerp, de uitrusting of de exploitatie aantoonbaar minder
      scheepsafval produceren.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6a
  - number: 6a.3
    text: |-
      Het voldoen van de bijdrage geeft de kapitein van het schip het niet overdraagbare recht gedurende het verblijf
      van het schip in de desbetreffende haven scheepsafval af te geven bij een houder van een havenontvangstvoorziening
      zonder daarvoor een afzonderlijke vergoeding verschuldigd te zijn. De havenbeheerder kan de hoeveelheid, de
      eigenschappen en de wijze van afgifte van het desbetreffende scheepsafval bepalen, indien het krachtens het tweede
      lid bepaalde percentage minder bedraagt dan 100%.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6a
  - number: 6a.4
    text: |-
      De havenbeheerder gaat met de desbetreffende houder van een havenontvangstvoorziening een overeenkomst aan met
      betrekking tot het overeenkomstig het derde lid af te geven scheepsafval.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6a
  - number: 6a.5
    text: |-
      De havenbeheerder betaalt de kosten met betrekking tot de verwerking van het scheepsafval niet eerder dan na
      ontvangst van een verklaring van verwerking. Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld
      met betrekking tot deze verificatie.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6a
  - number: 6a.6
    text: |-
      De exploitant van een schip vergoedt aan de houder van de havenontvangstvoorziening de kosten van het in
      ontvangst nemen, opslaan en verwerken van het door de kapitein van dat schip bij de houder afgegeven scheepsafval,
      schadelijke stoffen of restanten van schadelijke stoffen, voor zover het niet het krachtens het derde lid afgegeven
      scheepsafval betreft.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6a
  - number: 6a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van de pleziervaartuigen of vissersvaartuigen,
      bedoeld in het eerste lid, regels worden gesteld, waarbij de exploitant van een schip aan de beheerder of
      beheerders van één of meer van de in [artikel 6, eerste lid][ref1], bedoelde havens een periodieke vergoeding is
      verschuldigd, ongeacht het aantal malen dat het schip één of meer van die havens aandoet.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 6a.8
    text: Dit artikel is ook van toepassing op buitenlandse schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6a
  - number: 6b
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de ontvangst en de
      behandeling van klachten over vermeende ontoereikendheid van havenontvangstvoorzieningen. Bij of krachtens deze
      maatregel kunnen taken aan de havenbeheerder en aan de inspecteur-generaal worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel6b
  - number: '7.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden eisen vastgesteld waaraan een schip dient te voldoen ter
      bescherming en behoud van het milieu.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel7
  - number: '7.2'
    text: |-
      De in het eerste lid bedoelde eisen kunnen onder meer verschillen naar gelang zij verschillende categorieën van
      schepen, te bevaren zeegebieden, te maken reizen of te vervoeren schadelijke stoffen betreffen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel7
  - number: '7.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende de voorwaarden voor
      toelating van uitrusting aan boord van schepen, het gebruik van die uitrusting en de documenten waarvan zij in bij
      of krachtens die maatregel te bepalen gevallen vergezeld gaat.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel7
  - number: '7.4'
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van een besluit van een of meer instellingen van de Europese Unie
      alleen of gezamenlijk, de krachtens het eerste lid gestelde regels ook op buitenlandse schepen in Europese wateren
      onder Nederlandse jurisdictie van toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister geeft aan een schip, behorende tot een bij of krachtens algemene maatregel van bestuur aan te
      wijzen categorie schepen, een certificaat af, indien na onderzoek blijkt dat het schip voldoet aan de krachtens
      [artikel 7][ref1] gestelde eisen. In bijzondere gevallen kan Onze Minister de bevoegde autoriteit van een staat
      die partij is bij het Verdrag of een ander bij of krachtens algemene maatregel van bestuur aangewezen verdrag ter
      uitvoering waarvan krachtens deze wet regels worden gesteld, verzoeken een certificaat af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel7
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
  - number: '8.2'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8
  - number: 8.2.a
    text: |-
      de onderzoeken waaraan schepen zijn onderworpen ter verkrijging van een certificaat of tijdens de geldigheidsduur
      daarvan, alsmede de inhoud van die onderzoeken en de wijze waarop zij worden verricht;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8
  - number: 8.2.b
    text: de geldigheid van het certificaat en de verlenging van de geldigheidsduur daarvan.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8
  - number: '8.3'
    text: |-
      De ambtenaren van de Inspectie Verkeer en Waterstaat zijn belast met het verrichten van onderzoeken als bedoeld in
      het tweede lid, onderdeel a. Deze onderzoeken kunnen tevens geheel of ten dele worden verricht door daartoe door
      Onze Minister aangewezen natuurlijke personen of rechtspersonen of in bijzondere gevallen, op verzoek van Onze
      Minister, door de bevoegde autoriteit van een staat die partij is bij het Verdrag of een ander bij of krachtens
      algemene maatregel van bestuur aangewezen verdrag ter uitvoering waarvan krachtens deze wet regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8
  - number: '8.4'
    text: Aan een aanwijzing als bedoeld in het derde lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8
  - number: '8.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de bij de aanvraag van een certificaat te
      verstrekken gegevens en te overleggen bescheiden en modellen van certificaten, alsmede nadere regels met betrekking
      tot de bij de aanvraag van een certificaat te verstrekken gegevens en te overleggen bescheiden en de aanwijzing van
      natuurlijke personen of rechtspersonen krachtens het derde lid.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8
  - number: '8.6'
    text: |-
      Dit artikel is ook van toepassing op schepen als bedoeld in [artikel 2 van de Vaartuigenwet 1930 BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: 8a
    text: |-
      Onze Minister kan, op verzoek van de bevoegde autoriteit van een staat die partij is bij het Verdrag of een ander
      bij of krachtens algemene maatregel van bestuur aangewezen verdrag ter uitvoering waarvan krachtens deze wet regels
      worden gesteld, een certificaat afgeven aan een buitenlands schip of dat schip aan een ter verkrijging van een
      certificaat vereist onderzoek onderwerpen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8a
  - number: 8b.1
    text: |-
      Bij ministeriële regeling kan ter uitvoering van een besluit van een of meer van de instellingen van de Europese
      Unie alleen of gezamenlijk ten aanzien van buitenlandse schepen worden bepaald dat het voldoen aan de in
      [artikel 7, vierde lid][ref1], bedoelde regels blijkt uit:


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel7
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
  - number: 8b.1.a
    text: |-
      een certificaat of document afgegeven door of namens de bevoegde autoriteiten van de Staat wiens vlag het schip
      gerechtigd is te voeren, of door of namens andere buitenlandse autoriteiten;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8b
  - number: 8b.1.b
    text: een door Onze Minister af te geven certificaat of document.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8b
  - number: 8b.2
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van een besluit van een of meer van de instellingen van de Europese
      Unie alleen of gezamenlijk, regels worden gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8b
  - number: 8b.2.a
    text: |-
      onderzoeken waaraan buitenlandse schepen worden onderworpen ter verkrijging van een certificaat of document
      of tijdens de geldingsduur daarvan, alsmede de inhoud van die onderzoeken en de wijze waarop ze moeten worden
      verricht;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8b
  - number: 8b.2.b
    text: |-
      de aanvraag voor het verkrijgen van een certificaat of document als bedoeld in het eerste lid, onderdeel b, en de
      daarbij over te leggen bescheiden;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8b
  - number: 8b.2.c
    text: de geldigheid van het certificaat of document en de verlenging van de geldigheidsduur daarvan.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8b
  - number: 8b.3
    text: |-
      Met het verrichten van onderzoeken als bedoeld in het tweede lid, onderdeel a, zijn belast de ambtenaren van de
      Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel8b
  - number: '9.1'
    text: 'Een certificaat vervalt, indien:'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel9
  - number: 9.1.a
    text: het schip ophoudt te behoren tot de categorie schepen waaraan een dergelijk certificaat wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel9
  - number: 9.1.b
    text: |-
      het schip wordt verbouwd of in de inrichting of de uitrusting van het schip ingrijpende wijzigingen worden
      aangebracht;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel9
  - number: 9.1.c
    text: het schip een buitenlands schip wordt;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel9
  - number: 9.1.d
    text: het tijdvak waarvoor het certificaat geldt, is verstreken;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel9
  - number: 9.1.e
    text: |-
      de tijdens de geldigheidsduur van het certificaat verplicht gestelde onderzoeken niet of niet tijdig hebben
      plaatsgevonden, behoudens in bij algemene maatregel van bestuur omschreven bijzondere gevallen;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel9
  - number: 9.1.f
    text: |-
      het schip van naam verandert of een ander letterteken of nummer krijgt, in welk geval op aanvraag een nieuw
      certificaat wordt afgegeven voor het nog niet verstreken gedeelte van het tijdvak waarvoor het vervallen
      certificaat zou hebben gegolden.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel9
  - number: '9.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat certificaten in bij die maatregel te bepalen gevallen
      bovendien vervallen, wanneer het schip aan zijn oorspronkelijke bestemming wordt onttrokken.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel9
  - number: '9.3'
    text: |-
      Onze Minister kan een certificaat intrekken, wanneer blijkt dat de bouw, de inrichting of de uitrusting van het
      schip in belangrijke mate afwijkt van de gegevens van het certificaat.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel9
  - number: '9.4'
    text: De exploitant zendt een vervallen of ingetrokken certificaat zo spoedig mogelijk aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel9
  - number: '9.5'
    text: |-
      Dit artikel is ook van toepassing op schepen als bedoeld in [artikel 2 van de Vaartuigenwet 1930 BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: '10.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter bescherming en behoud van het milieu regels gesteld ten
      aanzien van:
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel10
  - number: 10.1.a
    text: |-
      het vervoer van schadelijke stoffen en andere stoffen ten aanzien waarvan krachtens [artikel 5, eerste lid][ref1],
      regels zijn gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: 10.1.b
    text: de verplichtingen van de kapitein aan boord van schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel10
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde regelen kunnen onder meer verschillen naar gelang deze regelen verschillende
      categorieën van schepen, te bevaren zeegebieden, te maken reizen of te vervoeren schadelijke stoffen betreffen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel10
  - number: '10.3'
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van een besluit van een of meer van de instellingen van de Europese
      Unie alleen of gezamenlijk, de krachtens het eerste lid gestelde regels ook op buitenlandse schepen in Europese
      wateren onder Nederlandse jurisdictie van toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel10
  - number: 10a
    text: |-
      Indien noodzakelijk voor de goede toepassing van een rechtstreeks in al zijn onderdelen verbindend besluit van
      een of meer van de instellingen van de Europese Unie alleen of gezamenlijk met betrekking tot de voorkoming van
      verontreiniging door schepen, kunnen bij ministeriële regeling regels worden gesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel10a
  - number: 10a.a
    text: het aanwijzen van een instantie die met de uitvoering van het desbetreffende besluit is belast;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel10a
  - number: 10a.b
    text: |-
      het verrichten van onderzoeken ter verkrijging van een certificaat of document of tijdens de geldingsduur daarvan,
      alsmede de inhoud van die onderzoeken en de wijze waarop ze moeten worden verricht of van andere werkzaamheden ten
      behoeve van een schip;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel10a
  - number: 10a.c
    text: |-
      de afgifte van certificaten of documenten, alsmede duplicaten of gewaarmerkte afschriften van die documenten, met
      inbegrip van procedures voor de afgifte van die certificaten of documenten;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel10a
  - number: 10a.d
    text: |-
      de eisen die van toepassing zijn nadat een schip aan een onderzoek is onderworpen dan wel een certificaat heeft
      verkregen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel10a
  - number: '11.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de zorgplicht van de kapitein van een
      bij of krachtens die maatregel aangewezen categorie schip ten aanzien van het aan boord bijhouden van een journaal
      waarin handelingen met betrekking tot het vervoer van schadelijke stoffen, andere stoffen en gedragingen als
      bedoeld in [artikel 5, eerste lid][ref1], worden aangetekend, en de daarbij in acht te nemen regels ten aanzien van
      onder meer de gegevens die moeten worden vermeld, de wijze van vermelding, alsmede de plaats waarop en de periode
      gedurende welke het journaal dient te worden bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: '11.2'
    text: |-
      De kapitein van een schip aan boord waarvan een journaal dient te worden bijgehouden is verplicht de bevoegde
      autoriteiten op hun verzoek inzage in het journaal te verlenen en dient hun toe te staan van elke in het journaal
      geplaatste aantekening een eensluidend afschrift te maken. Desgevraagd dient de kapitein het afschrift voor
      eensluidend te waarmerken.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel11
  - number: '11.3'
    text: |-
      Elk aldus vervaardigd en voor eensluidend gewaarmerkt afschrift van een aantekening in het journaal zal in een
      gerechtelijke procedure in Nederland als bewijs van de feiten, vermeld in de aantekening, worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel11
  - number: '11.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen de krachtens het eerste lid gestelde regels ook van
      toepassing worden verklaard op schepen als bedoeld in [artikel 2 van de Vaartuigenwet 1930 BES][ref1] en
      buitenlandse schepen gedurende de tijd dat deze zich in een Nederlandse haven bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: '11.5'
    text: |-
      Het bepaalde in het tweede lid is van overeenkomstige toepassing op schepen als bedoeld in
      [artikel 2 van de Vaartuigenwet 1930 BES][ref1] en buitenlandse schepen die zich in een Nederlandse haven bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: '12.1'
    text: |-
      De kapitein van een schip dat is betrokken bij een voorval, of bij een gebeurtenis waarbij gevaarlijke stoffen als
      bedoeld in hoofdstuk VII van het SOLAS-verdrag of andere bij ministeriële regeling aan te wijzen stoffen vrijkomen,
      meldt dat voorval of die gebeurtenis onverwijld aan de bevoegde autoriteit van de dichtstbijzijnde kuststaat.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
  - number: '12.2'
    text: |-
      De kapitein van een schip met een bruto-tonnage van 300 of meer als bedoeld in de [Meetbrievenwet 1981][ref1],
      dat zich in de Nederlandse territoriale zee of de Nederlandse exclusieve economische zone bevindt, doet onverwijld
      melding van:


      [ref1]: https://wetten.overheid.nl/BWBR0003378
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003378
  - number: 12.2.a
    text: |-
      ieder incident of ongeval, bedoeld in artikel 17, eerste lid, onderdelen a en b, van de richtlijn monitoring- en
      informatiesysteem zeescheepvaart;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
  - number: 12.2.b
    text: iedere situatie die tot verontreiniging van de in de aanhef bedoelde wateren en de Nederlandse kust kan leiden;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
  - number: 12.2.c
    text: |-
      iedere vlek van schadelijke stoffen die vallen onder de reikwijdte van de Bijlagen I, II en III van het Verdrag, in
      zee drijvende containers of stukgoederen die worden waargenomen, tenzij het een schip is als bedoeld in artikel 2,
      tweede lid, onderdeel b, van de richtlijn monitoring- en informatiesysteem zeescheepvaart.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
  - number: '12.3'
    text: |-
      De verplichting, bedoeld in het tweede lid, onderdeel b, geldt niet indien die situatie reeds op grond van het
      eerste lid is gemeld aan de bevoegde Nederlandse autoriteit.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
  - number: '12.4'
    text: |-
      De exploitant, de kapitein en de eigenaar van gevaarlijke of schadelijke stoffen aan boord, verlenen aan de
      door Onze Minister aangewezen instantie, desgevraagd hun volledige medewerking om de gevolgen van een incident
      of ongeval als bedoeld in het tweede lid, onderdeel a, zoveel mogelijk te beperken en verstrekken de informatie
      over het vervoer van gevaarlijke of verontreinigende stoffen, genoemd in artikel 12, eerste lid, van de richtlijn
      monitoring- en informatiesysteem zeescheepvaart.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
  - number: '12.5'
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet indien het uitsluitend een lozing in zee betreft
      overeenkomstig de regels waaronder lozingen in zee zijn toegestaan bij of krachtens algemene maatregel van bestuur,
      bedoeld in [artikel 5, eerste lid][ref1], tenzij het een lozing betreft die het gevolg is van schade aan het schip
      of aan de uitrusting of die noodzakelijk is om de veiligheid van het schip zeker te stellen of mensenlevens op zee
      te redden.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: '12.6'
    text: |-
      De kapitein voldoet onverwijld aan verzoeken van de bevoegde autoriteit tot het verstrekken van informatie over
      voorvallen of gebeurtenissen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
  - number: '12.7'
    text: |-
      Indien het schip is verlaten of indien de in het eerste lid bedoelde melding of de in het zesde lid bedoelde
      informatie onvolledig of niet verkrijgbaar is, rust een gelijke verplichting als bedoeld in het eerste en zesde lid
      op de exploitant van het schip.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
  - number: '12.8'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de inhoud van de melding, bedoeld in het eerste
      en tweede lid, en de informatie, bedoeld in het zesde lid, alsmede met betrekking tot de bevoegde autoriteit aan
      welke en de wijze waarop moet worden gemeld in Nederland.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
  - number: '12.9'
    text: |-
      Het eerste, vijfde, zesde, zevende en achtste lid zijn van toepassing op schepen als bedoeld in artikel 2 van de
      Vaartuigenwet 1930 BES en, indien het voorval of de gebeurtenis zich voordoet in de Nederlandse territoriale zee of
      de Nederlandse exclusieve economische zone, buitenlandse schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
  - number: '12.10'
    text: Het tweede, derde, vierde en achtste lid zijn eveneens van toepassing op buitenlandse schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12
  - number: 12a.1
    text: |-
      De kapitein van een schip dat op weg is naar een haven die is aangewezen krachtens [artikel 6, eerste lid][ref1],
      verstrekt ten minste 24 uur voor aankomst de havenbeheerder waarheidsgetrouw de bij regeling van Onze Minister in
      het belang van de doelmatigheid van havenontvangstvoorzieningen en de doeltreffende planning van het afvalbeheer
      aan te wijzen gegevens. Bij die regeling worden nadere regels gesteld met betrekking tot de wijze van verstrekking
      van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12a.2
    text: |-
      Voor zover de bestemming niet ten minste 24 uur voor aankomst bekend is, verstrekt de kapitein van dat schip de in
      het eerste lid bedoelde gegevens, zodra de bestemming bekend is, doch uiterlijk bij vertrek uit de vorige haven,
      indien de duur van de reis minder dan 24 uur bedraagt.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12a
  - number: 12a.3
    text: |-
      De kapitein bewaart de in het eerste lid bedoelde gegevens in ieder geval tot de volgende aanloophaven aan boord
      en geeft die desgevraagd ter inzage aan de bevoegde autoriteiten van de lidstaat van de Europese Unie, waarin die
      volgende aanloophaven is gelegen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12a
  - number: 12a.4
    text: |-
      De kapitein van een schip dat vanuit een haven van een lidstaat van de Europese Unie, op weg is naar een haven
      die is aangewezen krachtens [artikel 6, eerste lid][ref1], bewaart aan boord de gegevens die ter uitvoering van de
      richtlijn havenontvangstvoorzieningen, al dan niet door tussenkomst van de houder van een havenontvangstvoorziening
      zijn gemeld aan de daartoe aangewezen bevoegde autoriteit en geeft deze desgevraagd aan Onze Minister ter inzage.
      De kapitein bewaart deze gegevens in ieder geval tot de eerstvolgende buiten Nederland gelegen aanloophaven aan
      boord.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12a.5
    text: |-
      De havenbeheerder bewaart de aan hem verstrekte gegevens. [Artikel 6, zesde lid][ref1], is van overeenkomstige
      toepassing. De havenbeheerder informeert Onze Minister onverwijld omtrent de gevallen waarin een kapitein van een
      schip na daartoe strekkend verzoek geen gegevens verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12a.6
    text: Het eerste, tweede, vierde en vijfde lid zijn ook van toepassing op buitenlandse schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12a
  - number: 12a.7
    text: |-
      Dit artikel is niet van toepassing op pleziervaartuigen waarmee niet meer dan 12 passagiers mogen worden vervoerd
      en vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12a
  - number: 12b.1
    text: |-
      De kapitein van een schip dat een haven aandoet die is aangewezen krachtens [artikel 6, eerste lid][ref1], geeft
      voor vertrek van het schip al het scheepsafval af bij een havenontvangstvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12b.2
    text: |-
      In afwijking van het eerste lid kan de kapitein van afgifte afzien, indien mede uit de op grond van
      [artikel 12a, eerste of tweede lid][ref1], gemelde gegevens blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel12a
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 12a
        hoofdstuk: III
        paragraaf: '3'
  - number: 12b.2.a
    text: |-
      in de volgende aanloophaven een voldoende havenontvangstvoorziening geschikt voor het in ontvangst nemen van al het
      scheepsafval beschikbaar is, en,
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12b
  - number: 12b.2.b
    text: |-
      er aan boord van het schip voldoende afzonderlijke opslagcapaciteit beschikbaar is voor al het scheepsafval dat
      reeds aan boord is en nog tijdens de voorgenomen reis van het schip naar deze haven zal ontstaan.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12b
  - number: 12b.3
    text: Dit artikel is ook van toepassing op buitenlandse schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12b
  - number: 12c.1
    text: |-
      De kapitein van een schip dat een haven aandoet die is aangewezen krachtens [artikel 6, eerste lid][ref1], geeft de
      bij of krachtens algemene maatregel van bestuur aan te wijzen schadelijke stoffen dan wel restanten van schadelijke
      stoffen af bij een havenontvangstvoorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12c.2
    text: |-
      De kapitein van een schip als bedoeld in het eerste lid, voldoet aan de bij of krachtens algemene maatregel van
      bestuur te stellen regels ten aanzien van het voorwassen van een tank waaruit schadelijke stoffen zijn gelost.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12c
  - number: 12c.3
    text: |-
      Dit artikel is ook van toepassing op buitenlandse schepen en schepen als bedoeld in
      [artikel 2 van de Vaartuigenwet 1930 BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12c
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: 12d.1
    text: |-
      De kapitein van een schip dat een haven aandoet waar overwegend gelegenheid wordt geboden voor het
      aanleggen, afmeren of afgemeerd houden van zeegaande pleziervaartuigen en die niet is aangewezen krachtens
      [artikel 6, eerste lid][ref1], geeft voor vertrek van het schip al het scheepsafval af bij de daartoe bestemde
      voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12d.2
    text: |-
      In afwijking van het eerste lid kan de kapitein van afgifte afzien, indien aan boord van het schip voldoende
      afzonderlijke opslagcapaciteit beschikbaar is voor al het scheepsafval dat reeds aan boord is en nog tijdens de
      voorgenomen reis van het schip zal ontstaan.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12d
  - number: 12d.3
    text: |-
      Dit artikel is ook van toepassing op buitenlandse schepen en schepen als bedoeld in artikel 2 van de Vaartuigenwet
      1930 BES.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12d
  - number: 12e.1
    text: |-
      De kapitein van een schip dat een haven aandoet die is aangewezen krachtens [artikel 6, eerste lid][ref1], geeft:


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12e.1.a
    text: |-
      bij of krachtens algemene maatregel van bestuur aan te wijzen stoffen of uitrusting die deze stoffen bevat af bij
      een havenontvangstvoorziening wanneer zij worden verwijderd van het schip;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12e
  - number: 12e.1.b
    text: |-
      bij of krachtens algemene maatregel van bestuur aangewezen stoffen, in bij die maatregel aangegeven gevallen, af
      bij een havenontvangstvoorziening.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12e
  - number: 12e.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de kapitein van een schip dat een haven aandoet waar overwegend
      gelegenheid wordt geboden voor het aanleggen, afmeren of afgemeerd houden van zeegaande pleziervaartuigen en die
      niet is aangewezen krachtens [artikel 6][ref1], met dien verstande dat in een dergelijke haven de afgifte geschiedt
      bij de daartoe bestemde voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12e
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
  - number: 12e.3
    text: |-
      Dit artikel is ook van toepassing op buitenlandse schepen en schepen als bedoeld in artikel 2 van de Vaartuigenwet
      1930 BES.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel12e
  - number: '13.1'
    text: |-
      Het is verboden met een schip, als bedoeld in [artikel 8, eerste lid][ref1] een haven te verlaten indien het schip
      niet is voorzien van een geldig certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel8
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '8'
        hoofdstuk: III
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Het is verboden met een buitenlands schip als bedoeld in [artikel 8b][ref1] een haven te verlaten indien het schip
      niet voorzien is van een geldig certificaat of document als bedoeld in [artikel 8b, eerste of tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel8b
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel8b
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 8b
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: 8b
        hoofdstuk: III
        paragraaf: '2'
  - number: '13.3'
    text: |-
      Het is verboden om met een schip of een buitenlands schip een haven te verlaten indien dat schip niet is voorzien
      van alle geldige certificaten of documenten die zijn vereist op grond van een bij ministeriële regeling aangewezen
      rechtstreeks in al zijn onderdelen verbindend besluit van een of meer van de instellingen van de Europese Unie
      alleen of gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel13
  - number: 13a.1
    text: |-
      Alvorens schadelijke stoffen, of gevaarlijke stoffen als bedoeld in hoofdstuk VII van het SOLAS-verdrag, aan een
      schip worden aangeboden voor vervoer of aan boord worden genomen van een schip, verstrekt degene die deze stoffen
      aanbiedt aan de kapitein, de exploitant of de agent van het schip een verklaring met de informatie, genoemd in
      artikel 12, eerste lid, van de richtlijn monitoring- en informatiesysteem zeescheepvaart.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel13a
  - number: 13a.2
    text: |-
      Degene die schadelijke stoffen, of gevaarlijke stoffen als bedoeld in het eerste lid, aan de kapitein, de
      exploitant of de agent aanbiedt voor vervoer per schip, is verplicht ervoor te zorgen dat de voor vervoer
      aangeboden stoffen werkelijk die zijn welke overeenkomstig het eerste lid zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel13a
  - number: 13a.3
    text: |-
      Indien de in het eerste lid bedoelde gegevens zijn verstrekt aan de kapitein, is deze verplicht ervoor te
      zorgen dat deze gegevens voor het vertrek van het schip uit de haven ook bij de exploitant of de agent op de wal
      beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel13a
  - number: 13a.4
    text: |-
      Indien de in het eerste lid bedoelde gegevens zijn verstrekt aan de exploitant of de agent, is deze verplicht
      ervoor te zorgen dat deze gegevens voor het vertrek van het schip uit de haven ook bij de kapitein aan boord
      beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel13a
  - number: 13a.5
    text: |-
      De verplichtingen, gesteld bij dit artikel, zijn mede van toepassing op buitenlandse schepen in een Nederlandse
      haven.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel13a
  - number: '14.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie Verkeer en Waterstaat. Zij oefenen ten aanzien van Nederlandse schepen en schepen als bedoeld in
      [artikel 2 van de Vaartuigenwet 1930 BES][ref1] hun taak overal ter wereld uit.


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: '14.2'
    text: |-
      Met het toezicht op de naleving, bedoeld in het eerste lid, zijn voorts belast andere bij regeling van Onze
      Minister voor bepaalde taken aangewezen personen. Indien dit personen betreft die niet werkzaam zijn onder
      verantwoordelijkheid van de minister van Verkeer en Waterstaat, behoeft de aanwijzing de instemming van degene
      onder wiens verantwoordelijkheid zij werken.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel14
  - number: '14.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel14
  - number: '14.4'
    text: Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot het toezicht op de naleving.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel14
  - number: '15'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, woongedeelten van schepen binnen te
      treden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel15
  - number: '16'
    text: |-
      De toezichthouder en de inspecteur, bedoeld in
      [artikel 1:3, eerste lid, onderdeel c, van de Algemene douanewet][ref1], nemen bij het toezicht onderscheidenlijk
      de douanecontrole op de naleving van artikel 5, derde lid, de artikelen 218 en 220 en afdeling 7 van Deel XII van
      het VN-Zeerechtverdrag in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0023746#Artikel1
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0023746
        artikel: '1'
  - number: '18.1'
    text: |-
      Bij regeling van Onze Minister wordt het aantal jaarlijks door de ambtenaren van de Inspectie Verkeer en Waterstaat
      op de naleving van de [artikelen 12b][ref1] en [12c][ref2] te inspecteren schepen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel12c
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 12b
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: 12c
        hoofdstuk: III
        paragraaf: '3'
  - number: '18.2'
    text: |-
      Bij de vaststelling van het in het eerste lid bedoelde aantal schepen, blijven pleziervaartuigen waarmee ten
      hoogste 12 passagiers mogen worden vervoerd en vissersvaartuigen buiten beschouwing.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel18
  - number: '20.1'
    text: 'Een ambtenaar van de Inspectie Verkeer en Waterstaat is bevoegd een schip aan te houden:'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
  - number: 20.1.a
    text: |-
      indien het schip niet is voorzien van alle, krachtens [artikel 13, eerste of derde lid][ref1], vereiste geldige
      certificaten of documenten;


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel13
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '13'
        hoofdstuk: III
        paragraaf: '4'
  - number: 20.1.b
    text: |-
      indien de ambtenaar constateert dat het schip niet voldoet aan de voor de verkrijging van die certificaten gestelde
      eisen;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
  - number: 20.1.c
    text: indien het schip zodanig is gebouwd, ingericht of uitgerust dat het een gevaar vormt voor het milieu;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
  - number: 20.1.d
    text: |-
      indien aan boord van het schip niet wordt voldaan aan de krachtens [artikel 10, eerste lid][ref1], gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel10
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: 20.1.e
    text: |-
      indien hij gegronde redenen heeft om aan te nemen dat de kapitein in strijd met [artikel 12b][ref1], [12c][ref2],
      [12d][ref3], dan wel [12e][ref4] handelt dan wel zal handelen;


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel12b
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel12c
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel12d
      [ref4]: https://wetten.overheid.nl/BWBR0003642#Artikel12e
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 12b
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: 12c
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003642
        artikel: 12d
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003642
        artikel: 12e
        hoofdstuk: III
        paragraaf: '3'
  - number: 20.1.f
    text: |-
      indien met betrekking tot het schip door de bevoegde autoriteiten van de betreffende staat is gemeld dat het aldaar
      vermoedelijk is uitgevaren, zonder dat was voldaan aan de in die staat ter uitvoering van de artikelen 7 en 10 van
      de richtlijn havenontvangstvoorzieningen gestelde regels;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
  - number: 20.1.g
    text: |-
      indien het schip niet is voorzien van alle geldige certificaten of documenten die zijn vereist op grond van een
      bij ministeriële regeling aangewezen rechtstreeks in al zijn onderdelen verbindend besluit van een of meer van de
      instellingen van de Europese Unie alleen of gezamenlijk met betrekking tot de voorkoming van verontreiniging door
      schepen;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
  - number: 20.1.h
    text: |-
      in bij ministeriële regeling te bepalen gevallen en voorzover het een buitenlands schip betreft dat zich
      in een Nederlandse haven bevindt: wegens het niet voldoen aan krachtens de [artikelen 7, vierde lid][ref1],
      [8b, eerste of tweede lid, onder a][ref2], of [10, derde lid][ref3], gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel8b
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel10
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: 8b
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003642
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: 20.1.i
    text: indien de ambtenaar wordt belemmerd in de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het eerste lid, onderdelen e, f, g en i, is van overeenkomstige toepassing op een buitenlands schip, dat zich in
      een Nederlandse haven bevindt.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
  - number: '20.3'
    text: |-
      Dit artikel is van overeenkomstige toepassing op schepen als bedoeld in
      [artikel 2 van de Vaartuigenwet 1930 BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: '21'
    text: |-
      Een ambtenaar van de Inspectie Verkeer en Waterstaat is bevoegd een buitenlands schip, dat zich in een Nederlandse
      haven bevindt en dat de vlag voert van een staat die partij is het Verdrag of een ander bij of krachtens algemene
      maatregel van bestuur aangewezen verdrag ter uitvoering waarvan krachtens deze wet regels worden gesteld, aan
      te houden indien daartoe een verzoek wordt gedaan door de bevoegde autoriteiten van de vlaggestaat van dit schip
      wegens een overtreding van de in die staat ter uitvoering van het desbetreffende verdrag gestelde wettelijke
      regels.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel21
  - number: 21a
    text: |-
      [Afdeling 5.3.1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de in de[ artikelen 20][ref2] en
      [21][ref3] bedoelde bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel21
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 5.3.1
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '20'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003642
        artikel: '21'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '22.1'
    text: |-
      In afwijking van [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht][ref1] geschiedt de bekendmaking van
      een besluit tot aanhouding door uitreiking van dit besluit aan de kapitein.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '22.2'
    text: |-
      Indien uitreiking aan de kapitein niet mogelijk is, geschiedt de bekendmaking van een besluit tot aanhouding door
      uitreiking van dit besluit aan de naar het oordeel van de ambtenaar van de Inspectie Verkeer en Waterstaat daarvoor
      meest gerede persoon, zo spoedig mogelijk gevolgd door kennisgeving van het besluit aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel22
  - number: '22.3'
    text: |-
      De ambtenaar van de Inspectie Verkeer en Waterstaat stelt de havenbeheerder en de naar zijn oordeel daarvoor in
      aanmerking komende diensten onverwijld in kennis van de aanhouding en van de omstandigheden die tot de aanhouding
      hebben geleid.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel22
  - number: '23.1'
    text: |-
      De kapitein van een aangehouden schip is verplicht zijn schip na de aanhouding ligplaats te doen nemen op de door
      een ambtenaar van de Inspectie Verkeer en Waterstaat in overeenstemming met de havenbeheerder aan te wijzen plaats.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel23
  - number: '23.2'
    text: |-
      Zolang de aanhouding voortduurt is het de kapitein verboden het schip te doen verplaatsen zonder voorafgaande
      toestemming van een ambtenaar van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel23
  - number: '23.3'
    text: |-
      Zonder deze toestemming weigeren alle betrokken ambtenaren hun medewerking bij het verplaatsen en het uitklaren van
      het schip.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel23
  - number: '23.4'
    text: |-
      Indien een schip in een buitenlandse haven door een bevoegde autoriteit is aangehouden ingevolge de bepalingen van
      het Verdrag of een ander bij of krachtens algemene maatregel van bestuur aangewezen verdrag ter uitvoering waarvan
      krachtens deze wet regels worden gesteld, is het de kapitein verboden met dat schip de haven te verlaten.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel23
  - number: '23.5'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op een buitenlands schip, dat zich in een
      Nederlandse haven bevindt.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel23
  - number: '23.6'
    text: |-
      Dit artikel is van overeenkomstige toepassing op schepen als bedoeld in
      [artikel 2 van de Vaartuigenwet 1930 BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: '24'
    text: |-
      De ambtenaren van de Inspectie Verkeer en Waterstaat zijn bevoegd ter uitvoering en handhaving van de aanhouding de
      nodige maatregelen te nemen en de nodige aanwijzingen te geven.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel24
  - number: '25.1'
    text: |-
      Zodra er geen reden is de aanhouding langer te laten voortduren, heft de ambtenaar van de Inspectie Verkeer en
      Waterstaat de aanhouding op.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel25
  - number: '25.2'
    text: |-
      Op de opheffing van een aanhouding is [artikel 22][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel22
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '22'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '26'
    text: |-
      De[ artikelen 22][ref1], [24][ref2] en [25][ref3] zijn van overeenkomstige toepassing op een buitenlands schip dat
      zich in een Nederlandse haven bevindt, met dien verstande, dat van de aanhouding en de opheffing daarvan tevens de
      consul of de diplomatieke vertegenwoordiger en, bij diens afwezigheid, de regering van de Staat waarvan het schip
      de vlag voert, onverwijld op de hoogte wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel25
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '22'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003642
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '27.1'
    text: |-
      Tegen besluiten van een ambtenaar als bedoeld in [artikel 14][ref1], kan iedere belanghebbende beroep instellen bij
      Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel14
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '27.2'
    text: |-
      [Artikel 6:5, derde lid, van de Algemene wet bestuursrecht][ref1] is niet van toepassing op beroepschriften in de
      Engelse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '27.3'
    text: |-
      Een beroepschrift, gericht tegen een besluit van een ambtenaar als bedoeld in het eerste lid, niet zijnde de
      inspecteur-generaal, wordt ingediend door tussenkomst van de inspecteur-generaal. Deze zendt het beroepschrift
      onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel27
  - number: '27.4'
    text: |-
      Indien het beroepschrift telegrafisch of per telex wordt ingediend, kan de ondertekening, in afwijking van
      [artikel 6:5 van de Algemene wet bestuursrecht][ref1], achterwege blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '27.5'
    text: Onze Minister kan bepalen dat het beroep de werking schorst van het besluit waartegen het is gericht.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel27
  - number: '29.1'
    text: |-
      Onze Minister stelt een onderzoek in naar voorvallen van betekenis, overkomen aan schepen, teneinde na te gaan of
      hieruit lessen kunnen worden geput, dan wel of het wenselijk is regelen te stellen ter voorkoming van voorvallen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel29
  - number: '29.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld ten aanzien van de wijze waarop een
      onderzoek naar een in het eerste lid bedoeld voorval wordt ingesteld.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel29
  - number: '30.1'
    text: |-
      Onze Minister kan organisaties of personen machtigen bepaalde door hem aangewezen werkzaamheden ten behoeve van de
      Inspectie Verkeer en Waterstaat te verrichten.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel30
  - number: '30.2'
    text: Een krachtens het eerste lid vastgesteld besluit wordt in de *Nederlandse Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel30
  - number: '34'
    text: |-
      In bijzondere gevallen kan Onze Minister aan een schip, dat niet is voorzien van een geldig certificaat, als
      bedoeld in [artikel 13][ref1], ontheffing verlenen van het in dat artikel genoemde verbod:


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel13
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '13'
        hoofdstuk: III
        paragraaf: '4'
  - number: 34.a
    text: |-
      indien hem genoegzaam is gebleken dat het schip voldoet aan de voor de verkrijging van dat certificaat gestelde
      eisen;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel34
  - number: 34.b
    text: |-
      indien het schip niet voldoet aan de voor de verkrijging van dat certificaat gestelde eisen, teneinde het in staat
      te stellen zich naar de dichtstbijzijnde geschikte reparatiehaven te begeven met het doel aldaar in het ontbrekende
      te voorzien.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel34
  - number: '35.1'
    text: |-
      Bij regeling van Onze Minister kan voor schepen van een bepaalde categorie, met inachtneming van hetgeen
      dienaangaande in het Verdrag of een ander bij of krachtens algemene maatregel van bestuur aangewezen
      verdrag ter uitvoering waarvan krachtens deze wet regels worden gesteld is bepaald, zonodig onder het geven
      van voorschriften en beperkingen, vrijstelling worden verleend van één of meer van de bij of krachtens de
      [artikelen 5, eerste lid, onderdeel b of c][ref1], [7][ref2] of [10][ref3] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel10
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003642
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
  - number: '35.2'
    text: |-
      Onze Minister is bevoegd om in bijzondere gevallen, met inachtneming van hetgeen dienaangaande in het Verdrag of
      een ander bij of krachtens algemene maatregel van bestuur aangewezen verdrag ter uitvoering waarvan krachtens deze
      wet regels worden gesteld is bepaald, zo nodig onder het geven van voorschriften en beperkingen, een ontheffing te
      verlenen van de bij of krachtens de [artikelen 5, eerste lid, onderdeel b of c][ref1], [7][ref2], [10][ref3] of
      [12c, tweede lid][ref4], gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003642#Artikel12c
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003642
        artikel: '10'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0003642
        artikel: 12c
        hoofdstuk: III
        paragraaf: '3'
  - number: '35.3'
    text: Een gedraging in strijd met de in het eerste of tweede lid bedoelde voorschriften en beperkingen is verboden.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35
  - number: 35a.1
    text: |-
      Onze Minister kan op verzoek van de exploitant geheel of gedeeltelijk ontheffing verlenen van het bepaalde bij of
      krachtens de [artikelen 6a][ref1], [12a][ref2] of [12b][ref3], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel12a
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel12b
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 6a
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: 12a
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0003642
        artikel: 12b
        hoofdstuk: III
        paragraaf: '3'
  - number: 35a.1.a
    text: het een schip betreft dat volgens een dienstregeling veelvuldig en regelmatig bepaalde havens aandoet;
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35a
  - number: 35a.1.b
    text: |-
      genoegzaam is aangetoond dat er een regeling is getroffen voor de afgifte van scheepsafval in een volgens die
      dienstregeling aan te lopen haven, en
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35a
  - number: 35a.1.b
    text: voor die afgifte voldoende bijdragen zijn verschuldigd.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35a
  - number: 35a.2
    text: |-
      Een ontheffing als bedoeld in het eerste lid kan onder beperkingen worden verleend. Aan een ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35a
  - number: 35a.3
    text: Een gedraging in strijd met de in het tweede lid bedoelde beperkingen en voorschriften is verboden.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35a
  - number: 35a.4
    text: Dit artikel is ook van toepassing op buitenlandse schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35a
  - number: 35b.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de aantekeningen die Onze Minister in
      een bij of krachtens die maatregel aangewezen journaal maakt.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35b
  - number: 35b.2
    text: De krachtens het eerste lid gestelde regels zijn ook van toepassing op buitenlandse schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel35b
  - number: '36.1'
    text: |-
      De Nederlandse strafwet is, met inachtneming van de artikelen 218 en 220 en afdeling 7 van Deel XII van het VN-
      Zeerechtverdrag en onverminderd het recht van andere staten om overeenkomstig het VN-Zeerechtverdrag of het Verdrag
      tot rechtsvervolging over te gaan, toepasselijk op ieder die zich buiten Nederland schuldig maakt aan overtreding
      van de bij of krachtens [artikel 5][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: '36.2'
    text: |-
      De Nederlandse strafwet is van toepassing op ieder die zich in de Nederlandse exclusieve economische zone schuldig
      maakt aan overtreding van de bij of krachtens [artikel 12][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel12
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '12'
        hoofdstuk: III
        paragraaf: '3'
  - number: 36a.1
    text: |-
      Het is verboden te handelen in strijd met bij regeling van Onze Minister, in overeenstemming met Onze Minister van
      Justitie, aan te wijzen bepalingen van een rechtstreeks in al zijn onderdelen verbindend besluit van een of meer
      van de instellingen van de Europese Unie alleen of gezamenlijk met betrekking tot de voorkoming van verontreiniging
      door schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel36a
  - number: 36a.2
    text: |-
      Het verbod, bedoeld in het eerste lid, is ook van toepassing op buitenlandse schepen in Europese wateren onder
      Nederlandse jurisdictie, voorzover het desbetreffende besluit van toepassing is in die wateren.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel36a
  - number: 36a.3
    text: |-
      Bij ministeriële regeling kunnen regels ter uitvoering van een besluit als bedoeld in het eerste lid worden gesteld
      met betrekking tot het verlenen van ontheffing of vrijstelling.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel36a
  - number: 36a.4
    text: |-
      Een regeling als bedoeld in het eerste lid treedt niet eerder in werking dan twee weken nadat het ontwerp aan beide
      kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel36a
  - number: '37.1'
    text: |-
      Bij vermoeden van overtreding van een voorschrift, gesteld bij of krachtens de [artikelen 5, eerste lid][ref1],
      [6, tweede lid][ref2], [10, eerste lid][ref3], [11, eerste en tweede lid][ref4],
      [12, eerste, tweede, vierde, zesde, zevende en achtste lid][ref5], [12a, eerste, tweede, derde en vierde lid][ref6],
      [12b, eerste lid][ref7], [12c, eerste lid][ref8], [12d, eerste lid][ref9], [12e, eerste en tweede lid][ref10],
      [13][ref11], [23, eerste en tweede lid][ref12], [35, derde lid][ref13], [35a, derde lid][ref14], en
      [36a, eerste lid][ref15], kan aan de kapitein bevel worden gegeven dat hij zich begeeft naar een Nederlandse haven
      of dat het schip een Nederlandse haven of een Nederlands binnenwater niet zal verlaten dan nadat op een bij dat
      bevel aan te wijzen plaats een daarbij te bepalen geldsom is gestort, waarop een ter zake van dat strafbare feit op
      te leggen geldboete zal kunnen worden verhaald. Het bevel wordt zonodig met behulp van de sterke arm gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
