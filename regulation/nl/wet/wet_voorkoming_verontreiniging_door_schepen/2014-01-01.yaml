  - number: '40.1'
    text: |-
      De kosten die samenhangen met de behandeling van de aanvraag en de afgifte van certificaten, ontheffingen
      als bedoeld in [artikel 35a][ref1] en de overige documenten die bij of krachtens deze wet worden afgegeven,
      alsmede duplicaten en gewaarmerkte afschriften van deze documenten, alsmede de kosten van onderzoeken en andere
      werkzaamheden ten behoeve van schepen voorzover verricht door ambtenaren van de Inspectie Verkeer en Waterstaat,
      worden ten laste gebracht van de aanvrager van het document.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel35a
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 35a
        hoofdstuk: V
        paragraaf: '4'
  - number: '40.2'
    text: De tarieven ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel40
  - number: '40.3'
    text: |-
      In de regeling, bedoeld in het tweede lid, kan worden bepaald dat de vergoeding van kosten voorafgaand aan de
      behandeling van de aanvraag en de afgifte van certificaten, ontheffingen als bedoeld in [artikel 35a][ref1] en de
      overige documenten die bij of krachtens deze wet worden afgegeven, alsmede duplicaten en gewaarmerkte afschriften
      van deze documenten, of in termijnen wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel35a
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: 35a
        hoofdstuk: V
        paragraaf: '4'
  - number: '41'
    text: |-
      Voor zover op grond van de Overeenkomst inzake de Europese Economische Ruimte de richtlijn
      havenontvangstvoorzieningen ook verbindend is voor een staat, niet zijnde een lidstaat van de Europese Unie, wordt
      deze staat voor de toepassing van deze wet gelijkgesteld met een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel41
  - number: '42'
    text: |-
      Deze wet is niet van toepassing op het lozen en overige gedragingen vanaf of aan boord van schepen als bedoeld in
      [artikel 5, eerste lid, onderdeel b][ref1], voorzover daaromtrent voorschriften zijn gesteld bij of krachtens de
      [artikel 6.6][ref2] juncto [artikel 6.3 van de Waterwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0025458#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025458
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0025458
        artikel: '6'
  - number: '43'
    text: |-
      Deze wet is niet van toepassing voorzover het bij of krachtens de [Kernenergiewet][ref1] (*Stb.* 1963, 82) bepaalde
      van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002402
  - number: 43a.1
    text: |-
      Een wijziging van het Verdrag gaat voor de toepassing van deze wet gelden, met ingang van de dag waarop die
      wijziging voor Nederland in werking treedt, tenzij bij besluit van Onze Minister anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel43a
  - number: 43a.2
    text: Een besluit als bedoeld in het eerste lid wordt in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel43a
  - number: 43a.3
    text: |-
      Een wijziging van de richtlijn havenontvangstvoorzieningen of van de richtlijn monitoring- en informatiesysteem
      zeescheepvaart gaat voor de toepassing van deze wet of de daarop berustende bepalingen gelden met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel43a
  - number: 43b
    text: |-
      Met betrekking tot sanitair afval is artikel 1, onderdeel n, eerst van toepassing twaalf maanden na de datum van
      inwerkingtreding van Bijlage IV bij het Verdrag voor de desbetreffende categorie van schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel43b
  - number: '44'
    text: 'Deze wet kan worden aangehaald als: "Wet voorkoming verontreiniging door schepen".'
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel44
  - number: '45'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003642/2014-01-01#Artikel45
