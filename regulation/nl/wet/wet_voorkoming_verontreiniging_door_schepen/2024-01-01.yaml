        hoofdstuk: VI
  - number: '37.2'
    text: |-
      Het in het eerste lid bedoelde bevel wordt op vordering van de Officier van Justitie gegeven door de rechter voor
      wie de zaak wordt of zal worden vervolgd. De kapitein wordt vooraf gehoord of althans behoorlijk opgeroepen. Het
      bevel is dadelijk uitvoerbaar en wordt onverwijld aan de kapitein betekend.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37
  - number: '37.3'
    text: |-
      Van het bevel of de beschikking tot afwijzing van de vordering kan de verdachte binnen veertien dagen na de
      betekening en het Openbaar Ministerie binnen veertien dagen in beroep komen bij het gerechtshof. Het hof beslist zo
      spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37
  - number: '37.4'
    text: |-
      Zodra het in de strafzaak gewezen vonnis onherroepelijk is geworden, wordt de gestorte geldsom wederom ter
      beschikking van de rechthebbende gesteld, nadat daarop een bij dat vonnis opgelegde boete in mindering is gebracht.
      Tot dat tijdstip en te rekenen van de dag dat de geldsom werd gestort, wordt over die som de wettelijke rente
      vergoed.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37
  - number: '37.5'
    text: |-
      Het eerste lid is ook van toepassing op buitenlandse schepen, voorzover de in dat lid bedoelde voorschriften zich
      mede richten tot buitenlandse schepen.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37
  - number: 37a.1
    text: |-
      Ten aanzien van handelingen door schepen als bedoeld in [artikel 2 van de Vaartuigenwet 1930 BES][ref1] geldt het
      volgende:


      [ref1]: https://wetten.overheid.nl/BWBR0028292#Artikel2
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0028292
        artikel: '2'
  - number: 37a.1.a
    text: |-
      Handelingen in strijd met de voorschriften gesteld krachtens de [artikelen 5, eerste lid][ref1], en
      [12, eerste, zesde, zevende en achtste lid][ref2], van deze wet, voor zover opzettelijk begaan, zijn misdrijven en
      worden gestraft met gevangenisstraf van ten hoogste zes jaren of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel12
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '12'
        hoofdstuk: III
        paragraaf: '4'
  - number: 37a.1.b
    text: |-
      Handelingen als bedoeld in onderdeel a, die geen misdrijven zijn, zijn overtredingen en worden gestraft met
      hechtenis van ten hoogste een jaar of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37a
  - number: 37a.1.c
    text: |-
      Handelingen in strijd met de voorschriften gesteld krachtens de [artikelen 10, eerste lid][ref1], en
      [11, eerste lid][ref2], en de voorschriften gesteld bij of krachtens artikel 11, tweede lid, van deze wet, voor
      zover opzettelijk begaan, zijn misdrijven en worden gestraft met gevangenisstraf van ten hoogste twee jaren of
      geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel11
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '10'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '11'
        hoofdstuk: III
        paragraaf: '4'
  - number: 37a.1.d
    text: |-
      Handelingen als bedoeld in onderdeel b, die geen misdrijven zijn, zijn overtredingen en worden gestraft met
      hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37a
  - number: 37a.2
    text: 'Als bijkomende straf kan worden opgelegd:'
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37a
  - number: 37a.2.a
    text: |-
      gehele of gedeeltelijke stillegging van de onderneming van de veroordeelde, waarin de overtreding is begaan voor
      een tijd van ten hoogste een jaar; of,
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37a
  - number: 37a.2.b
    text: |-
      verbeurdverklaring van de voorwerpen, genoemd in [artikel 35 van het Wetboek van Strafvordering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel35
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '35'
  - number: 37a.3
    text: |-
      Met het opsporen van de in het eerste en tweede lid strafbaar gestelde feiten zijn, onverminderd de bij of
      krachtens [artikel 184 van het Wetboek van Strafvordering BES][ref1] aangewezen ambtenaren, belast de door Onze
      Minister van Justitie en Veiligheid, in overeenstemming met Onze Minister, aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 37b
    text: |-
      Ingeval bij of krachtens deze wet wordt verwezen naar in het kader van de Internationale Maritieme Organisatie van
      de Verenigde Naties tot stand gekomen besluiten die betrekking hebben op de voorkoming van verontreiniging door
      schepen, kan overtreding van deze besluiten ook als strafbaar feit worden aangemerkt indien deze besluiten in de
      Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel37b
  - number: '38'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter uitvoering van verdragen of besluiten van
      volkenrechtelijke organisaties die betrekking hebben op de voorkoming van verontreiniging door schepen, nadere
      regels worden gesteld met betrekking tot de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel38
  - number: '40.1'
    text: |-
      De kosten die samenhangen met de behandeling van de aanvraag en de afgifte van certificaten, ontheffingen en de
      overige documenten die bij of krachtens deze wet worden afgegeven, alsmede duplicaten en gewaarmerkte afschriften
      van deze documenten, alsmede de kosten van onderzoeken en andere werkzaamheden ten behoeve van schepen voorzover
      verricht door ambtenaren van de Inspectie Leefomgeving en Transport, worden ten laste gebracht van de aanvrager van
      het document.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel40
  - number: '40.2'
    text: De tarieven ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel40
  - number: '40.3'
    text: |-
      In de regeling, bedoeld in het tweede lid, kan worden bepaald dat de vergoeding van kosten voorafgaand aan de
      behandeling van de aanvraag en de afgifte van certificaten, ontheffingen en de overige documenten die bij of
      krachtens deze wet worden afgegeven, alsmede duplicaten en gewaarmerkte afschriften van deze documenten, of in
      termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel40
  - number: '41'
    text: |-
      Voor zover op grond van de Overeenkomst inzake de Europese Economische Ruimte de richtlijn
      havenontvangstvoorzieningen ook verbindend is voor een staat, niet zijnde een lidstaat van de Europese Unie, wordt
      deze staat voor de toepassing van deze wet gelijkgesteld met een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel41
  - number: '42'
    text: |-
      Deze wet is niet van toepassing op het lozen en overige gedragingen vanaf of aan boord van schepen als bedoeld
      in [artikel 5, eerste lid, onderdeel c][ref1], voor zover daaromtrent voorschriften zijn gesteld bij of
      krachtens [artikel 4.3, derde lid, aanhef en onder b, van de Omgevingswet][ref2] of voor zover daarvoor een
      omgevingsvergunning is vereist op grond van [artikel 5.1, eerste lid, aanhef en onder d, van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037885#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0037885#Artikel5
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037885
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0037885
        artikel: '5'
  - number: '43'
    text: |-
      Deze wet is niet van toepassing voorzover het bij of krachtens de [Kernenergiewet][ref1] (*Stb.* 1963, 82) bepaalde
      van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002402
  - number: 43a.1
    text: |-
      Een wijziging van het Verdrag gaat voor de toepassing van deze wet of de daarop berustende bepalingen gelden met
      ingang van de dag waarop die wijziging voor Nederland in werking treedt, tenzij bij besluit van Onze Minister
      anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel43a
  - number: 43a.2
    text: Een besluit als bedoeld in het eerste lid wordt in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel43a
  - number: 43a.3
    text: |-
      Een wijziging van de richtlijn havenontvangstvoorzieningen of van de richtlijn monitoring- en informatiesysteem
      zeescheepvaart gaat voor de toepassing van deze wet of de daarop berustende bepalingen gelden met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel43a
  - number: '44'
    text: 'Deze wet kan worden aangehaald als: "Wet voorkoming verontreiniging door schepen".'
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel44
  - number: '45'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#Artikel45
