preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de bekrachtiging van het op 2
    november 1973 te Londen tot stand gekomen Internationaal Verdrag ter voorkoming van verontreiniging door schepen
    met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147 en 1978, 187), zoals gewijzigd en aangevuld bij het
    op 17 februari 1978 te Londen tot stand gekomen Protocol bij dat Verdrag met Bijlage en Aanhangsels (Trb. 1978,
    188), regelen vast te stellen teneinde uitvoering te kunnen geven aan de bepalingen van dit Verdrag en Protocol
    voor Nederland;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003642/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *ambtenaren van de Inspectie Leefomgeving en
      Transport:* de door Onze Minister aangewezen ambtenaar van de Inspectie Leefomgeving en Transport;
        - *ballastwater:* water met daarin zwevende deeltjes dat aan boord wordt genomen teneinde de trim, helling,
      diepgang, stabiliteit van of krachten op het schip te beheersen;
        - *buitenlands schip:* een schip, niet zijnde een Nederlands schip en een schip als bedoeld in
      [artikel 2 van de Vaartuigenwet 1930 BES][ref1];
        - *exploitant:* de eigenaar, rompbevrachter of ieder ander die de zeggenschap heeft over het gebruik van een schip;
        - *haven:* een rede, pier of steiger en in het algemeen iedere plaats, al of niet in zee, waar schepen ligplaats
      kunnen hebben of waar opvarenden en zaken ingescheept of ontscheept kunnen worden;
        - *havenafvalplan:* het plan, bedoeld in [artikel 6a, eerste lid, eerste volzin][ref2];
        - *havenontvangstvoorziening:* een vaste, drijvende of mobiele voorziening die in staat is om als dienstverlening
      de stoffen, bedoeld in [artikel 6, eerste lid][ref3], in ontvangst te nemen;
        - *indirecte bijdrage:* bijdrage die wordt betaald voor het verlenen van diensten van havenontvangstvoorzieningen,
      ongeacht of al dan niet werkelijk scheepsafvalstoffen worden afgegeven;
        - *inspecteur-generaal:* inspecteur-generaal van de Inspectie Leefomgeving en Transport;
        - *kapitein:* de gezagvoerder of schipper van een schip dan wel degene die deze vervangt;
        - *ladingresiduen:* de restanten van lading aan boord die na het laden en lossen op het dek of in ruimen of tanks
      achterblijven, met inbegrip van overschotten of restanten die het gevolg zijn van morsen bij het laden en lossen,
      in natte of droge toestand of meegevoerd in waswater, en exclusief ladingstof dat na vegen op het dek achterblijft
      of stof op de buitenoppervlakken van het schip;
        - *lozen:* elk vrijkomen van een schip van schadelijke stoffen, ballastwater of sedimenten, hoe ook veroorzaakt,
      waaronder begrepen ontsnappen, overboord zetten, wegvloeien, weglekken, pompen of ledigen;
        - *Nederlands schip:* een schip dat op grond van voor Nederland geldende rechtsregels gerechtigd is de vlag van het
      Koninkrijk te voeren;
        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat;
        - *passief opgevist afval:* afval dat tijdens visserijactiviteiten in netten terechtkomt;
        - *pleziervaartuig:* elk zeegaand schip met een romplengte van 2,5 meter of meer, ongeacht het type of de
      aandrijving, dat bestemd is voor sport- of vrijetijdsdoeleinden en niet voor handelsdoeleinden wordt gebruikt;
        - *richtlijn havenontvangstvoorzieningen:* [Richtlijn (EU) 2019/883](32019L0883) van het Europees Parlement en de
      Raad van de Europese Unie van 17 april 2019 inzake havenontvangstvoorzieningen voor de afvalafgifte van schepen,
      tot wijziging van [Richtlijn 2010/65](32010L0065)/EU en tot intrekking van [Richtlijn 2000/59/EG](32000L0059) (PbEU
      2019, L 151/116);
        - *richtlijn monitoring- en informatiesysteem zeescheepvaart:* Richtlijn nr. 2002/59/EG van het Europees Parlement
      en de Raad van 27 juni 2002 betreffende de invoering van een communautair monitoring- en informatiesysteem voor de
      zeescheepvaart en tot intrekking van [Richtlijn 93/75/EEG](31993L0075) van de Raad (PbEG 2002, L 208);
        - *SafeSeaNet:* het communautaire systeem voor de uitwisseling van maritieme informatie, bedoeld in de richtlijn
      monitoring- en informatiesysteem zeescheepvaart;
        - *schadelijke stof:* stof die valt onder het toepassingsbereik van Bijlage I, II, III, IV of V van het Verdrag;
        - *scheepsafvalstoffen:* al het afval van het schip, met inbegrip van ladingresiduen, dat tijdens de exploitatie
      van een schip of tijdens laad-, los en schoonmaakactiviteiten ontstaat en binnen het toepassingsgebied van de
      bijlagen I, II, IV, V en VI bij het Verdrag valt, evenals passief opgevist afval;
        - *schepen die havendiensten verlenen:* schepen die havendiensten verrichten in de zin van artikel 1, tweede
      lid, van [Verordening (EU) 2017/352](32252R2017) van het Europees Parlement en de Raad van 15 februari 2017 tot
      vaststelling van een kader voor het verrichten van havendiensten en gemeenschappelijke regels inzake de financiële
      transparantie van havens;
        - *schip:* elk zeegaand vaartuig, van welk type ook, dat in het mariene milieu opereert, waaronder
      vissersvaartuigen, pleziervaartuigen, draagvleugelboten, luchtkussenvoertuigen, onderwatervaartuigen en drijvende
      vaartuigen, alsmede installaties gedurende de tijd dat zij drijven, behoudens wanneer het schip als hierboven
      bedoeld boven de zeebodem is geplaatst voor het instellen van een onderzoek naar de aanwezigheid van delfstoffen of
      voor het winnen daarvan;
        - *sedimenten:* alle bezinksels uit het ballastwater van een schip;
        - *SOLAS-verdrag:* het op 1 november 1974 te Londen tot stand gekomen Verdrag voor de beveiliging van mensenlevens
      op zee (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;
        - *Verdrag:* het op 2 november 1973 te Londen tot stand gekomen Internationaal Verdrag ter voorkoming van
      verontreiniging door schepen, met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147), en met het op
      17 februari 1978 te Londen tot stand gekomen Protocol bij dat Verdrag met Bijlage en Aanhangsels (Trb. 1978, 188);
        - *verwerken van persoonsgegevens, onderscheidenlijk verwerkingsverantwoordelijke:* hetgeen daaronder wordt
      verstaan in artikel 4 van de Algemene verordening gegevensbescherming;
        - *verwerking:* nuttige toepassing of verwijdering van afval, met inbegrip van de daaraan voorafgaande
      voorbereidende handelingen;
        - *vissersvaartuig:* elk schip dat is uitgerust of met commercieel oogmerk wordt gebruikt voor het vangen van vis
      of andere levende rijkdommen van de zee;
        - *VN-Zeerechtverdrag:* het op 10 december 1982 te Montego-Bay tot stand gekomen Verdrag van de Verenigde Naties
      inzake het recht van de zee (Trb. 1983, 83);
        - *voorval:* een gebeurtenis die er daadwerkelijk toe leidt of er vermoedelijk toe zal leiden dat in zee wordt
      geloosd.


