---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_voorkoming_verontreiniging_door_schepen
regulatory_layer: WET
publication_date: '2023-05-10'
valid_from: '2000-10-18'
bwb_id: BWBR0003642
url: https://wetten.overheid.nl/BWBR0003642/2000-10-18
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is in verband met de bekrachtiging van het op 2
    november 1973 te Londen tot stand gekomen Internationaal Verdrag ter voorkoming van verontreiniging door schepen
    met Protocollen en Bijlagen met Aanhangsels (Trb. 1975, 147 en 1978, 187), zoals gewijzigd en aangevuld bij het
    op 17 februari 1978 te Londen tot stand gekomen Protocol bij dat Verdrag met Bijlage en Aanhangsels (Trb. 1978,
    188), regelen vast te stellen teneinde uitvoering te kunnen geven aan de bepalingen van dit Verdrag en Protocol
    voor Nederland;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bepaalde bij of krachtens deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel1
  - number: 1.a
    text: '"Onze Minister": Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel1
  - number: 1.b
    text: |-
      "Verdrag": het op 2 november 1973 te Londen tot stand gekomen Internationaal Verdrag ter voorkoming van
      verontreiniging door schepen, met Protocollen en Bijlagen met Aanhangsels (*Trb.* 1975, 147 en 1978, 187),
      gewijzigd en aangevuld bij het op 17 februari 1978 te Londen tot stand gekomen Protocol bij dat Verdrag met Bijlage
      en Aanhangsels (*Trb.* 1978, 188);
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel1
  - number: 1.c
    text: |-
      "schip": elk vaartuig, van welk type ook, dat op zee wordt gebruikt waaronder begrepen draagvleugelboten,
      luchtkussenvoertuigen, afzinkbare vaartuigen en drijvend materieel, alsmede installaties gedurende de tijd dat zij
      drijven, behoudens wanneer het schip als hierboven bedoeld boven de zeebodem is geplaatst voor het instellen van
      een onderzoek naar de aanwezigheid van delfstoffen of voor het winnen daarvan;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel1
  - number: 1.d
    text: '"buitenlands schip": een schip dat, daartoe gerechtigd, een andere vlag dan de Nederlandse voert;'
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel1
  - number: 1.e
    text: |-
      "schadelijke stof": een stof die, indien zij in zee terecht komt, gevaar kan opleveren voor de gezondheid van
      de mens, schade kan toebrengen aan het mariene milieu, de recreatiemogelijkheden die de zee biedt kan schaden
      of storend kan werken op enig ander rechtmatig gebruik van de zee en die bij of krachtens algemene maatregel van
      bestuur is aangewezen;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel1
  - number: 1.f
    text: |-
      "lozen": elk vrijkomen van schadelijke stoffen van een schip, hoe ook veroorzaakt, waaronder begrepen ontsnappen,
      overboord zetten, wegvloeien, weglekken, pompen of ledigen;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel1
  - number: 1.g
    text: |-
      "voorval": een gebeurtenis die er daadwerkelijk toe leidt of er vermoedelijk toe zal leiden dat in zee wordt
      geloosd;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel1
  - number: 1.h
    text: |-
      "haven": een rede, pier, steiger en in het algemeen iedere plaats, al of niet in zee, waar schepen ligplaats kunnen
      hebben of waar opvarenden en zaken ingescheept of ontscheept kunnen worden;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel1
  - number: 1.i
    text: 'exploitant: de eigenaar, rompbevrachter of ieder ander die de zeggenschap heeft over het gebruik van een schip.'
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel1
  - number: '2'
    text: |-
      Het bij of krachtens deze wet bepaalde is, tenzij in artikelen van deze wet uitdrukkelijk anders is bepaald, van
      toepassing op schepen die gerechtigd zijn de Nederlandse vlag te voeren.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel2
  - number: '3'
    text: |-
      Het bij of krachtens deze wet bepaalde is niet van toepassing op oorlogsschepen, schepen in gebruik als
      marinehulpschepen of andere schepen in eigendom van of in beheer bij een Staat ten tijde dat zij uitsluitend worden
      gebruikt in dienst van de overheid voor andere dan handelsdoeleinden.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel3
  - number: '4'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van schepen geheel of gedeeltelijk van de toepassing van een
      of meer krachtens deze wet gegeven regels en voorschriften worden uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel4
  - number: '5.1'
    text: |-
      Het is verboden vanaf een schip een schadelijke stof in zee te lozen behoudens in de gevallen en op de wijze vast
      te stellen bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel5
  - number: '5.2'
    text: |-
      De bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur te geven regelen kunnen onder meer
      verschillen al naar gelang deze regelen verschillende categorieën van schepen, te bevaren zeegebieden, te maken
      reizen of te vervoeren schadelijke stoffen betreffen.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel5
  - number: '5.3'
    text: |-
      Het eerste lid is ook van toepassing op buitenlandse schepen gedurende de tijd dat deze zich in de Nederlandse
      territoriale zee bevinden.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel5
  - number: '6.1'
    text: |-
      De beheerders van bij of krachtens algemene maatregel van bestuur aan te wijzen havens zijn verplicht zorg te
      dragen voor voldoende voorzieningen, geschikt voor het in ontvangst nemen van restanten van schadelijke stoffen
      afkomstig van schepen waarop het lozingsverbod als bedoeld in [artikel 5][ref1] van toepassing is, zonder aan deze
      schepen onnodig oponthoud te veroorzaken.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
  - number: '6.2'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden voorschriften ter uitvoering
      van het bepaalde in het eerste lid vastgesteld. In ieder geval wordt daarbij bepaald dat de afgifte niet anders mag
      geschieden dan op een wijze, aangegeven bij of krachtens die algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel6
  - number: '6.3'
    text: |-
      De havenbeheerders zijn ter uitvoering van de hun in het eerste lid opgelegde verplichting bevoegd regelen te
      stellen krachtens welke de beheerders van bepaalde los- en laadplaatsen en scheepsreparatiewerven in hun haven
      worden verplicht zorg te dragen voor voldoende voorzieningen, geschikt voor het in ontvangst nemen van restanten
      van schadelijke stoffen, afkomstig van schepen, als bedoeld in het eerste lid, welke gebruik maken van die los- en
      laadplaatsen of scheepsreparatiewerven.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel6
  - number: '6.4'
    text: |-
      De kosten verbonden aan het in ontvangst nemen, opslaan en verwerken van restanten van schadelijke stoffen,
      afgegeven door schepen als bedoeld in het eerste lid, worden verhaald op diegenen die deze restanten afgeven.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel6
  - number: '6.5'
    text: |-
      Indien en voorzover de kosten als bedoeld in het vierde lid niet geheel verhaald kunnen worden, worden bij algemene
      maatregel van bestuur regels vastgesteld met betrekking tot het verlenen van een Rijksbijdrage in bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel6
  - number: '7.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden eisen vastgesteld waaraan de bouw, de inrichting en de
      uitrusting van een schip dienen te voldoen ter voorkoming dan wel beperking van het lozen van schadelijke stoffen.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel7
  - number: '7.2'
    text: |-
      De in het eerste lid bedoelde eisen kunnen onder meer verschillen naar gelang zij verschillende categorieën van
      schepen, te bevaren zeegebieden, te maken reizen of te vervoeren schadelijke stoffen betreffen.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel7
  - number: '7.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld betreffende de voorwaarden voor
      toelating van uitrusting aan boord van schepen, het gebruik van die uitrusting en de documenten waarvan zij in bij
      of krachtens die maatregel te bepalen gevallen vergezeld gaat.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel7
  - number: '8.1'
    text: |-
      Aan een schip, behorende tot een bij algemene maatregel van bestuur aan te wijzen categorie van schepen, wordt,
      indien na een onderzoek genoegzaam blijkt dat het schip voldoet aan de in [artikel 7][ref1] bedoelde eisen, ten
      blijke daarvan een certificaat afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel7
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '7'
        hoofdstuk: III
        paragraaf: '2'
  - number: '8.2'
    text: Onze Minister stelt het model van het certificaat vast.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel8
  - number: '8.3'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regelen gegeven onder meer met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel8
  - number: 8.3.a
    text: de aanvrage ter verkrijging van een certificaat alsmede de daarbij over te leggen bescheiden;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel8
  - number: 8.3.b
    text: de autoriteiten die het certificaat afgeven;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel8
  - number: 8.3.c
    text: de geldigheidsduur van het certificaat alsmede de verlenging daarvan;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel8
  - number: 8.3.d
    text: de vergoeding van kosten in verband met het onderzoek en de afgifte van een certificaat.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel8
  - number: '9.1'
    text: Certificaten vervallen, wanneer
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel9
  - number: 9.1.a
    text: het schip ophoudt te behoren tot de categorie van schepen waaraan een dergelijk certificaat wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel9
  - number: 9.1.b
    text: |-
      het schip wordt verbouwd dan wel in de inrichting of de uitrusting van het schip ingrijpende wijzigingen worden
      aangebracht;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel9
  - number: 9.1.c
    text: het schip een buitenlands schip wordt.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel9
  - number: '9.2'
    text: |-
      Certificaten kunnen door de bevoegde ambtenaar van de Scheepvaartinspectie worden ingetrokken, wanneer blijkt
      dat de bouw, de inrichting of de uitrusting van het schip in belangrijke mate afwijkt van de gegevens van het
      certificaat.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel9
  - number: '9.3'
    text: |-
      Het vervallen of ingetrokken certificaat dient door de eigenaar zo spoedig mogelijk aan het Hoofd van de
      Scheepvaartinspectie te worden ingezonden.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel9
  - number: '10.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter voorkoming van verontreiniging door schepen regelen
      worden gesteld onder meer ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel10
  - number: 10.1.a
    text: de aan boord vereiste aanwezigheid van instructies, gebruiksaanwijzingen en waarschuwingen;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel10
  - number: 10.1.b
    text: |-
      de stuwage, de wijze van verpakking en de etikettering van schadelijke stoffen, alsmede de daarop betrekking
      hebbende ladingdocumenten;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel10
  - number: 10.1.c
    text: |-
      de aan boord vereiste aanwezigheid en hoedanigheid van meet- en registratie-apparatuur, alsmede het gebruik
      daarvan;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel10
  - number: 10.1.d
    text: |-
      het aan boord verrichten van handelingen met betrekking tot schadelijke stoffen en restanten daarvan alsmede de
      daarmee verband houdende bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel10
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde regelen kunnen onder meer verschillen naar gelang deze regelen verschillende
      categorieën van schepen, te bevaren zeegebieden, te maken reizen of te vervoeren schadelijke stoffen betreffen.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel10
  - number: '11.1'
    text: |-
      De kapitein van een schip, behorend tot een bij algemene maatregel van bestuur aan te wijzen categorie, zorgt
      dat aan boord een journaal wordt bijgehouden waarin handelingen met betrekking tot het vervoer en de lozing van
      schadelijke stoffen worden aangetekend, met inachtneming van de krachtens het tweede lid gestelde regelen.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel11
  - number: '11.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld, onder meer ten aanzien van het model van
      het journaal, de gegevens die in het journaal moeten worden vermeld, de wijze van vermelding, alsmede de plaats
      waarop en de periode gedurende welke het journaal dient te worden bewaard.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel11
  - number: '11.3'
    text: |-
      De kapitein van een schip aan boord waarvan een journaal dient te worden bijgehouden is verplicht de bevoegde
      autoriteiten op hun verzoek inzage in het journaal te verlenen en dient hun toe te staan van elke in het journaal
      geplaatste aantekening een eensluidend afschrift te maken. Desgevraagd dient de kapitein het afschrift voor
      eensluidend te waarmerken.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel11
  - number: '11.4'
    text: |-
      Elk aldus vervaardigd en voor eensluidend gewaarmerkt afschrift van een aantekening in het journaal zal in een
      gerechtelijke procedure in Nederland als bewijs van de feiten, vermeld in de aantekening, worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel11
  - number: '11.5'
    text: |-
      Het bepaalde in het derde lid is van overeenkomstige toepassing op buitenlandse schepen, die zich in een
      Nederlandse haven bevinden.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel11
  - number: '12.1'
    text: |-
      In de gevallen als omschreven bij of krachtens algemene maatregel van bestuur, is de kapitein verplicht een voorval
      waarbij het schip is betrokken onverwijld te melden.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel12
  - number: '12.2'
    text: |-
      Indien het schip is verlaten of indien de in het eerste lid bedoelde melding onvolledig dan wel niet verkrijgbaar
      is, rust een gelijke verplichting, als bedoeld in het eerste lid, op de eigenaar van het schip. Met de eigenaar van
      een schip wordt gelijkgesteld de gebruiker van het schip, niet zijnde een reis- of tijdbevrachter.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel12
  - number: '12.3'
    text: |-
      Bij of krachtens de in het eerste lid bedoelde algemene maatregel van bestuur worden regelen gesteld onder meer
      ten aanzien van de inhoud van de melding, alsmede de wijze waarop en de autoriteiten aan wie deze melding dient
      te geschieden.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel12
  - number: '12.4'
    text: |-
      De verplichting bedoeld in het eerste en tweede lid geldt ook ten aanzien van een buitenlands schip, indien het
      voorval plaatsvindt in de Nederlandse territoriale zee.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel12
  - number: '13'
    text: |-
      Het is verboden met een schip, als bedoeld in [artikel 8, eerste lid][ref1] een haven te verlaten indien het schip
      niet is voorzien van een geldig certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel8
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '8'
        hoofdstuk: III
        paragraaf: '2'
  - number: 13a.1
    text: |-
      Alvorens schadelijke stoffen, of gevaarlijke stoffen als bedoeld in [artikel 130 van het Schepenbesluit 1965][ref1],
      aan een schip worden aangeboden voor vervoer of aan boord worden genomen van een schip, verstrekt degene die
      deze stoffen aanbiedt aan de kapitein, de exploitant of de agent van het schip een aangifte met de correcte
      technische benamingen van de stoffen, de identificatienummers van de Verenigde Naties voor zover van toepassing, de
      indeling in gevarenklassen, genoemd in [artikel 130 van het Schepenbesluit 1965][ref2] voor zover van toepassing,
      de hoeveelheden van die stoffen en, wanneer zij in transporttanks of vrachtcontainers worden vervoerd, de
      identificatiemerktekens daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002501#Artikel130
      [ref2]: https://wetten.overheid.nl/BWBR0002501#Artikel130
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0002501
        artikel: '130'
      - id: ref2
        bwb_id: BWBR0002501
        artikel: '130'
  - number: 13a.2
    text: |-
      Degene die schadelijke stoffen, of gevaarlijke stoffen als bedoeld in het eerste lid, aan de kapitein, de
      exploitant of de agent aanbiedt voor vervoer per schip, is verplicht ervoor te zorgen dat de voor vervoer
      aangeboden stoffen werkelijk die zijn welke overeenkomstig het eerste lid zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel13a
  - number: 13a.3
    text: |-
      Indien de in het eerste lid bedoelde gegevens zijn verstrekt aan de kapitein, is deze verplicht ervoor te
      zorgen dat deze gegevens voor het vertrek van het schip uit de haven ook bij de exploitant of de agent op de wal
      beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel13a
  - number: 13a.4
    text: |-
      Indien de in het eerste lid bedoelde gegevens zijn verstrekt aan de exploitant of de agent, is deze verplicht
      ervoor te zorgen dat deze gegevens voor het vertrek van het schip uit de haven ook bij de kapitein aan boord
      beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel13a
  - number: 13a.5
    text: |-
      De verplichtingen, gesteld bij dit artikel, zijn mede van toepassing op buitenlandse schepen in een Nederlandse
      haven.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel13a
  - number: '14.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Scheepvaartinspectie. Zij oefenen hun taak overal ter wereld uit.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel14
  - number: '14.2'
    text: |-
      Met het toezicht op de naleving, bedoeld in het eerste lid, zijn tevens belast de bij besluit van Onze Minister
      voor bepaalde taken aangewezen ambtenaren van andere diensttakken. Indien deze ambtenaren ressorteren onder een
      ander ministerie dan dat van Onze Minister, wordt het desbetreffende besluit genomen door Onze Minister en de
      Minister van het andere ministerie tezamen.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel14
  - number: '14.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel14
  - number: '14.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de wijze waarop de in dit artikel bedoelde
      ambtenaren hun taak uitoefenen.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel14
  - number: '15'
    text: |-
      De toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, woongedeelten van schepen binnen te
      treden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel15
  - number: '17'
    text: |-
      De [artikelen 5:13][ref1] en [5:15][ref2] tot en met [5:20 van de Algemene wet bestuursrecht][ref3] en
      [artikel 15][ref4] zijn eveneens van toepassing ten aanzien van een buitenlands schip dat zich bevindt:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003642#Artikel15
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0003642
        artikel: '15'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 17.a
    text: in een Nederlandse haven, of
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel17
  - number: 17.b
    text: in de Nederlandse territoriale zee, op weg naar of komende vanuit een Nederlandse haven.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel17
  - number: '19.1'
    text: |-
      Een buitenlands schip kan in een Nederlandse haven worden onderworpen aan een onderzoek door een ambtenaar van de
      Scheepvaartinspectie, teneinde na te gaan of: in strijd met de voorschriften van het Verdrag schadelijke stoffen
      zijn geloosd buiten de Nederlandse territoriale zee.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel19
  - number: '19.2'
    text: |-
      De [artikelen 5:13][ref1] en [5:15][ref2] tot en met [5:20 van de Algemene wet bestuursrecht][ref3] zijn van
      overeenkomstige toepassing op het onderzoek bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '20'
    text: 'Een ambtenaar van de Scheepvaartinspectie is bevoegd een schip aan te houden:'
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel20
  - number: 20.a
    text: |-
      indien het schip niet is voorzien van alle, krachtens [artikel 13, eerste lid][ref1], vereiste geldige
      certificaten;


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel13
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '13'
        hoofdstuk: III
        paragraaf: '4'
  - number: 20.b
    text: |-
      indien de ambtenaar constateert dat het schip niet voldoet aan de voor de verkrijging van die certificaten gestelde
      eisen;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel20
  - number: 20.c
    text: |-
      waar het een schip betreft dat niet behoort tot een in [artikel 8, eerste lid][ref1], bedoelde categorie, indien
      het schip zodanig is gebouwd, ingericht of uitgerust dat het een gevaar vormt voor verontreiniging van het mariene
      milieu;


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel8
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '8'
        hoofdstuk: III
        paragraaf: '2'
  - number: 20.d
    text: indien de ambtenaar wordt belemmerd in de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel20
  - number: '21'
    text: |-
      Een ambtenaar van de Scheepvaartinspectie is bevoegd een buitenlands schip, dat zich in een Nederlandse haven
      bevindt en dat de vlag voert van een staat die partij is bij het Verdrag, aan te houden indien daartoe een verzoek
      wordt gedaan door de bevoegde autoriteiten van de vlaggestaat van dit schip wegens een overtreding van de in die
      staat ter uitvoering van het Verdrag gestelde wettelijke regels.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel21
  - number: 21a
    text: |-
      [Afdeling 5.3 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de in de[ artikelen 20][ref2] en
      [21][ref3] bedoelde bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel21
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.3'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '20'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003642
        artikel: '21'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '22.1'
    text: |-
      De aanhouding geschiedt door een ambtenaar van de Scheepvaartinspectie door middel van een overhandiging aan
      de kapitein van een ondertekende en gedagtekende kennisgeving, waarin de reden van de aanhouding staat vermeld.
      Wanneer naar het oordeel van de ambtenaar overhandiging niet mogelijk is, geschiedt de aanhouding mondeling
      door een kennisgeving aan de naar zijn oordeel daarvoor meest gerede persoon, zo spoedig mogelijk gevolgd door
      overhandiging van de schriftelijke kennisgeving aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel22
  - number: '22.2'
    text: |-
      De havenbeheerder alsmede de naar het oordeel van de ambtenaar in aanmerking komende diensten worden onverwijld van
      de aanhouding in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel22
  - number: '23.1'
    text: |-
      De kapitein van een aangehouden schip is verplicht zijn schip na de aanhouding ligplaats te doen nemen op de door
      een ambtenaar van de Scheepvaartinspectie in overeenstemming met de havenbeheerder aan te wijzen plaats.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel23
  - number: '23.2'
    text: |-
      Zolang de aanhouding voortduurt is het de kapitein verboden het schip te doen verplaatsen zonder voorafgaande
      toestemming van een ambtenaar van de Scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel23
  - number: '23.3'
    text: |-
      Zonder deze toestemming weigeren alle betrokken ambtenaren hun medewerking bij het verplaatsen en het uitklaren van
      het schip.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel23
  - number: '23.4'
    text: |-
      Indien een schip in een buitenlandse haven door een bevoegde autoriteit ingevolge de bepalingen van het Verdrag is
      aangehouden, is het de kapitein verboden de haven te verlaten.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel23
  - number: '23.5'
    text: |-
      Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op een buitenlands schip, dat zich in een
      Nederlandse haven bevindt.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel23
  - number: '24'
    text: |-
      De ambtenaren van de Scheepvaartinspectie zijn bevoegd ter uitvoering en handhaving van de aanhouding de nodige
      maatregelen te nemen en de nodige aanwijzingen te geven.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel24
  - number: '25.1'
    text: |-
      Zodra er geen reden is de aanhouding langer te laten voortduren, heft de ambtenaar van de Scheepvaartinspectie de
      aanhouding op.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel25
  - number: '25.2'
    text: Opheffing geschiedt door overhandiging van een ondertekende en gedagtekende kennisgeving aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel25
  - number: '25.3'
    text: |-
      Op deze opheffing en kennisgeving is [artikel 22][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel22
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '22'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '26'
    text: |-
      De[ artikelen 22][ref1], [24][ref2] en [25][ref3] zijn van overeenkomstige toepassing op een buitenlands schip dat
      zich in een Nederlandse haven bevindt, met dien verstande, dat van de aanhouding en de opheffing daarvan tevens de
      consul of de diplomatieke vertegenwoordiger en, bij diens afwezigheid, de regering van de Staat waarvan het schip
      de vlag voert, onverwijld op de hoogte wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel25
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '22'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '24'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0003642
        artikel: '25'
        hoofdstuk: IV
        paragraaf: '2'
  - number: '27.1'
    text: |-
      Tegen beslissingen van een ambtenaar als bedoeld in [artikel 14][ref1], kan iedere belanghebbende beroep instellen
      bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel14
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '14'
        hoofdstuk: IV
        paragraaf: '1'
  - number: '27.2'
    text: Het beroepschrift moet zijn gesteld in de Nederlandse of de Engelse taal.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel27
  - number: '27.3'
    text: |-
      Een beroepschrift, gericht tegen een beslissing van een ambtenaar als bedoeld in het eerste lid, niet zijnde het
      Hoofd van de Scheepvaartinspectie, wordt ingediend door tussenkomst van het Hoofd van de Scheepvaartinspectie. Deze
      zendt het beroepschrift onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel27
  - number: '27.4'
    text: |-
      Indien het beroepschrift telegrafisch of per telex wordt ingediend, kan de ondertekening, in afwijking van
      [artikel 6:5 van de Algemene wet bestuursrecht][ref1], achterwege blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '27.5'
    text: Onze Minister kan bepalen dat het beroep de werking schorst van de beslissing waartegen het is gericht.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel27
  - number: '28'
    text: |-
      Alvorens Onze Minister een beslissing geeft kan hij advies inwinnen bij de Raad voor de Scheepvaart als bedoeld
      in [artikel 23 van de Schepenwet][ref1] (*Stb.* 1909, 219). Wat betreft de samenstelling, de bevoegdheden en de
      werkwijze van de Raad bij de uitvoering van deze taak, alsmede de schadeloosstelling van door de Raad gehoorde
      getuigen en deskundigen en van leden van de Raad zelve, zijn de desbetreffende bepalingen van de [Schepenwet][ref2]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001876
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0001876
  - number: '29.1'
    text: |-
      Het Hoofd van de Scheepvaartinspectie stelt een onderzoek in naar voorvallen van betekenis, overkomen aan schepen,
      teneinde na te gaan of hieruit lessen kunnen worden geput, dan wel of het wenselijk is regelen te stellen ter
      voorkoming van voorvallen.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel29
  - number: '29.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld ten aanzien van de wijze waarop een
      onderzoek naar een in het eerste lid bedoeld voorval wordt ingesteld.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel29
  - number: '30.1'
    text: |-
      Onze Minister kan organisaties of personen machtigen bepaalde door hem aangewezen werkzaamheden ten behoeve van de
      Dienst van de Scheepvaartinspectie te verrichten.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel30
  - number: '30.2'
    text: Een krachtens het eerste lid vastgesteld besluit wordt in de *Nederlandse Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel30
  - number: '34.1'
    text: |-
      In bijzondere gevallen kan het Hoofd van de Scheepvaartinspectie aan een schip, dat niet is voorzien van een geldig
      certificaat, als bedoeld in [artikel 13][ref1], ontheffing verlenen van het in dat artikel genoemde verbod:


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel13
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '13'
        hoofdstuk: III
        paragraaf: '4'
  - number: 34.1.a
    text: |-
      indien hem genoegzaam is gebleken dat het schip voldoet aan de voor de verkrijging van dat certificaat gestelde
      eisen;
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel34
  - number: 34.1.b
    text: |-
      indien het schip niet voldoet aan de voor de verkrijging van dat certificaat gestelde eisen, teneinde het in staat
      te stellen zich naar de dichtstbijzijnde geschikte reparatiehaven te begeven met het doel aldaar in het ontbrekende
      te voorzien.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel34
  - number: '35.1'
    text: |-
      In een krachtens deze wet uitgevaardigde algemene maatregel van bestuur kan worden bepaald dat het Hoofd van de
      Scheepvaartinspectie, indien bijzondere omstandigheden daartoe nopen, bevoegd is ontheffing te verlenen van de
      bij of krachtens die algemene maatregel van bestuur gestelde regelen met betrekking tot de bouw, inrichting of
      uitrusting van een schip.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel35
  - number: '35.2'
    text: |-
      Een ontheffing als bedoeld in het vorige lid kan onder beperkingen worden verleend. Aan een ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel35
  - number: '35.3'
    text: Een gedraging in strijd met de in het tweede lid bedoelde beperkingen en voorschriften is verboden.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel35
  - number: '37.1'
    text: |-
      Bij vermoeden van overtreding van een voorschrift, gesteld bij of krachtens de [artikelen 5][ref1],
      [6, tweede lid][ref2], [11, eerste, derde en vijfde lid][ref3], [12, eerste, tweede, derde en vierde lid][ref4],
      [13][ref5], [16][ref6], [17][ref7], [23, eerste, tweede en vijfde lid][ref8], en [35, derde lid][ref9], kan aan
      de kapitein bevel worden gegeven dat het schip een Nederlandse haven of binnenwater niet zal verlaten dan nadat
      op een bij dat bevel aan te wijzen plaats een daarbij te bepalen geldsom is gestort, waarop een terzake van dat
      strafbare feit op te leggen geldboete zal kunnen worden verhaald. Het bevel wordt zonodig met behulp van de sterke
      arm gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0003642#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0003642#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0003642#Artikel16
      [ref7]: https://wetten.overheid.nl/BWBR0003642#Artikel17
      [ref8]: https://wetten.overheid.nl/BWBR0003642#Artikel23
      [ref9]: https://wetten.overheid.nl/BWBR0003642#Artikel35
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003642
        artikel: '5'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003642
        artikel: '6'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003642
        artikel: '11'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0003642
        artikel: '12'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref5
        bwb_id: BWBR0003642
        artikel: '13'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0003642
        artikel: '16'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref7
        bwb_id: BWBR0003642
        artikel: '17'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref8
        bwb_id: BWBR0003642
        artikel: '23'
        hoofdstuk: IV
        paragraaf: '2'
      - id: ref9
        bwb_id: BWBR0003642
        artikel: '35'
        hoofdstuk: V
        paragraaf: '4'
  - number: '37.2'
    text: |-
      Het in het eerste lid bedoelde bevel wordt op vordering van de Officier van Justitie gegeven door de rechter voor
      wie de zaak wordt of zal worden vervolgd. De kapitein wordt vooraf gehoord of althans behoorlijk opgeroepen. Het
      bevel is dadelijk uitvoerbaar en wordt onverwijld aan de kapitein betekend.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel37
  - number: '37.3'
    text: |-
      Van het bevel of de beschikking tot afwijzing van de vordering kan de verdachte binnen veertien dagen na de
      betekening en het Openbaar Ministerie binnen veertien dagen in beroep komen bij het gerechtshof. Het hof beslist zo
      spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel37
  - number: '37.4'
    text: |-
      Zodra het in de strafzaak gewezen vonnis onherroepelijk is geworden, wordt de gestorte geldsom wederom ter
      beschikking van de rechthebbende gesteld, nadat daarop een bij dat vonnis opgelegde boete in mindering is gebracht.
      Tot dat tijdstip en te rekenen van de dag dat de geldsom werd gestort, wordt over die som de wettelijke rente
      vergoed.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel37
  - number: '38'
    text: |-
      Indien in deze wet gestelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling behoeven
      kan deze geschieden bij of krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel38
  - number: '39.1'
    text: Een voordracht voor een algemene maatregel van bestuur krachtens deze wet wordt Ons gedaan door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel39
  - number: '39.2'
    text: |-
      Voorzover een algemene maatregel van bestuur bepalingen bevat krachtens de [artikelen 1, onder ][ref1], [5][ref2],
      [6][ref3], [12][ref4] of [38][ref5] wordt de voordracht ten aanzien van die bepalingen Ons gedaan door Onze
      Minister en Onze Minister van Volksgezondheid en Milieuhygiëne.


      [ref1]: https://wetten.overheid.nl/BWBR0003642#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003642#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003642#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0003642#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0003642#Artikel38
