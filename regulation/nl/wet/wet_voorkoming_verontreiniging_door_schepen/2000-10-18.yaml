  - number: '41.1'
    text: De Wet olieverontreiniging zeewater (*Stb.* 1958, 344) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel41
  - number: '41.2'
    text: |-
      Op feiten, strafbaar gesteld bij of krachtens de Wet olieverontreiniging zeewater welke zijn begaan voor de
      intrekking daarvan, blijft die wet van toepassing.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel41
  - number: '42'
    text: |-
      Deze wet is niet van toepassing op het lozen voorzover daaromtrent voorschriften zijn gesteld bij of krachtens de
      [Wet verontreiniging zeewater][ref1] (*Stb.* 1975, 352).


      [ref1]: https://wetten.overheid.nl/BWBR0002975
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002975
  - number: '43'
    text: |-
      Deze wet is niet van toepassing voorzover het bij of krachtens de [Kernenergiewet][ref1] (*Stb.* 1963, 82) bepaalde
      van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002402
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002402
  - number: '44'
    text: 'Deze wet kan worden aangehaald als: "Wet voorkoming verontreiniging door schepen".'
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel44
  - number: '45'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003642/2000-10-18#Artikel45
