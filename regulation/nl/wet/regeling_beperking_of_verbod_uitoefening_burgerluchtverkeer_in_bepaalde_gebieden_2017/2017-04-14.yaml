  - number: '4'
    text: |-
      1 Om redenen van openbare orde en veiligheid en ongewenste beïnvloeding van gebeurtenissen op de grond is het
      uitoefenen van het burgerluchtverkeer jaarlijks op 15 augustus verboden binnen het gebied EHR 20 (Den Haag/
      Indisch monument), begrensd door de lijn die de cirkel vormt met een straal van 2 nautische mijlen vanuit positie
      52°55'49.00"N 004°17'33.00"E tot 3000 ft AMSL, van 12.00 tot en met 16.00 uur plaatselijke tijd.

      2 Het verbod, genoemd in het eerste lid, is niet van toepassing op ceremoniële langsvluchten op initiatief van de
      Stichting Herdenking 15 Augustus 1945 binnen het gebied en binnen de periode, genoemd in dat lid.

      3 De ceremoniële langsvluchten, bedoeld in het tweede lid, worden voorafgaand aangemeld door de Stichting
      Herdenking 15 Augustus 1945 bij de Inspectie Leefomgeving en Transport en uitgevoerd overeenkomstig de
      zichtvliegvoorschriften, bedoeld in deel 5 van de bijlage bij verordening (EU) nr. 923/2012.

      4 De routering en uitvoering van ceremoniële langsvluchten vinden plaats met inachtneming van beperking van
      geluidshinder.
    url: https://wetten.overheid.nl/BWBR0039451/2017-04-14#Artikel4
