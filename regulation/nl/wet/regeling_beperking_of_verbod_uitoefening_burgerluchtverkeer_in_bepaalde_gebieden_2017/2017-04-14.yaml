      c. EHR 18 (Bloemendaal/Overveen)

      het gebied, begrensd door de lijn die de cirkel vormt met een straal van 2 nautische mijlen vanuit positie
      52°24'00.00"N 004°37'00.00"E tot FL 055, van 19.30 tot 20.30 uur plaatselijke tijd;

      d. d. EHR 19 (Rhenen/Grebbeberg)

