  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *AMC:* Airspace Management Cell, organisatie die het civiel en militair gebruik van het luchtruim op elkaar
      afstemt;
        - *AMC-Manageable Area:* luchtruim dat enerzijds voor militaire en anderzijds voor civiele activiteiten kan worden
      gebruikt;
        - *AMSL:* above mean sea level, boven gemiddeld zeeniveau;
        - *burgerluchtverkeer:* alle luchtvaartactiviteiten van burgerluchtvaartuigen;
        - *AOCS NM:* Air Operations Control Station Nieuw Milligen, belast met de bewaking van het Nederlandse deel van het
      NAVO-luchtruim en de coördinatie van het militaire luchtverkeer en delen van het burgerluchtverkeer;
        - *CBA:* cross border area, een tijdelijk gedefinieerd stuk luchtruim dat zich over internationale grenzen
      uitstrekt;
        - *militair luchtverkeer:* vluchten uitgevoerd onder militair gezag;
        - *EHD:* danger area (in de Amsterdam FIR), gedefinieerd stuk luchtruim in de Amsterdam FIR waarbinnen op
      aangekondigde tijden activiteiten voorkomen die een gevaar kunnen vormen voor vluchten in dit gebied;
        - *EHP:* prohibited area (in de Amsterdam FIR), gedefinieerd stuk luchtruim in de Amsterdam FIR waarbinnen vluchten
      niet zijn toegestaan;
        - *EHR:* restricted area (in de Amsterdam FIR), gedefinieerd stuk luchtruim in de Amsterdam FIR waarbinnen vluchten
      alleen voorwaardelijk zijn toegestaan;
        - *FIR:* flight information region, vluchtinformatiegebied;
        - *FL:* flight level, vliegniveau;
        - *ft:* feet, voet;
        - *NOTAM:* Notice to Airmen, een bericht aan luchtvarenden gedistribueerd via een communicatienetwerk voor
      luchtverkeersdiensten met inlichtingen over de instelling, toestand, of verandering van enige luchtvaartfaciliteit,
      -dienstverlening, -procedure of -gevaar, waarvan het noodzakelijk is dat personen die betrokken zijn bij de
      vluchtvoorbereiding en -uitvoering daarvan tijdig kennis nemen;
        - *RPAS:* remotely piloted aircraft system, op afstand bestuurd luchtvaartuig (remotely piloted aircraft, RPA),
      onbemand, niet zijnde een modelluchtvaartuig, het daarbij horend grondstation, het vereiste besturingssysteem en
      andere in het type-ontwerp gespecificeerde componenten;
        - *TRA:* temporary reserved airspace, gedefinieerd stuk luchtruim waarbinnen op aangekondigde tijden (militaire)
      vliegactiviteiten plaatsvinden die een gevaar kunnen vormen voor civiele vluchten;
        - *TSA:* temporary segregated area, luchtruimte met vastgestelde begrenzingen, waarvoor reserveren van luchtruimte
      is vereist, voor het exclusief gebruik door specifieke gebruikers gedurende een vastgestelde tijdsperiode.
