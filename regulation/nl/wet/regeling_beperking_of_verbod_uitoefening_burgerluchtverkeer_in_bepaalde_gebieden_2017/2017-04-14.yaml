  - number: '6'
    text: |-
      1 Het verbod, genoemd in [artikel 2, eerste lid][ref1] (gebied EHR 3), is niet van toepassing op:

      a. luchtvaartuigen van de Dienst Infrastructuur van de Landelijke eenheid;

      b. helikopters die worden gebruikt voor spoedeisende hulpverlening door traumateams en het vervoer van slachtoffers
      of voor zoek- en reddingsacties.

      2 De verboden, genoemd in de [artikelen 3][ref2] en [4][ref3], zijn niet van toepassing op:

      a. luchtvaartuigen van de Dienst Infrastructuur van de Landelijke eenheid;

      b. helikopters die worden gebruikt voor spoedeisende hulpverlening door traumateams en het vervoer van slachtoffers
      of voor zoek- en reddingsacties.

      3 Het verbod, genoemd in [artikel 5, onderdeel a][ref4] (gebied EHP 25), is niet van toepassing op:

      a. luchtvaartuigen van de Dienst Infrastructuur van de Landelijke eenheid;

      b. luchtvaartuigen die worden gebruikt ten behoeve van het vervoer van leden van het Koninklijk Huis, staatshoofden
      en ministers;

      c. helikopters die worden gebruikt voor spoedeisende hulpverlening door traumateams en het vervoer van slachtoffers
      of voor zoek- en reddingsacties.

      4 Het verbod, genoemd in [artikel 5, onderdelen b][ref5] (gebied EHP 26) en c (gebied EHP 26A), is niet van
      toepassing op:

      a. luchtvaartuigen van de Dienst Infrastructuur van de Landelijke eenheid;

      b. luchtvaartuigen die worden gebruikt ten behoeve van het vervoer van leden van het Koninklijk Huis, staatshoofden
      en ministers;

      c. helikopters die worden gebruikt voor spoedeisende hulpverlening door traumateams en het vervoer van slachtoffers
      of voor zoek- en reddingsacties;

      d. ambulancevluchten voor het Medisch Centrum Haaglanden Westeinde in Den Haag.

      5 Aan de gezagvoerders van luchtvaartuigen die ondersteuning leveren aan Defensie, kan door de autoriteiten,
      genoemd in [artikel 7, eerste lid][ref6], toestemming worden gegeven gebruik te maken van de gebieden, genoemd
      in [artikel 2, eerste tot en met vierde lid][ref7]. Aan de toestemming kunnen voorschriften of beperkingen worden
      verbonden.


