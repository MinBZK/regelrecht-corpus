  - number: '2'
    text: |-
      1 In de [bijlagen A tot en met G][ref1] zijn de commandanten aangewezen.

      2 Een aangewezen commandant oefent een bevoegdheid slechts uit ten aanzien van onder hem ressorterend personeel
      voor zover dit personeel niet ressorteert onder een tevens in de betreffende bijlage opgenomen commandant.

      3 Indien een te nemen rechtspositioneel besluit betrekking heeft op een militair en een werking heeft die
      de periode buiten het zendend operationeel commando overschrijdt, dient afstemming plaats te vinden met de
      personeelsdienst van het zendend operationeel commando alvorens het besluit wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0038363
    url: https://wetten.overheid.nl/BWBR0038363/2016-09-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0038363
  - number: '3'
    text: |-
      1 [Bijlage 1][ref1] bevat een overzicht van de personele bevoegdheden die binnen het Commando Zeestrijdkrachten in
      mandaat zijn verleend.

      2 Bijlage 2 bevat een overzicht van de personele bevoegdheden die binnen het Commando Landstrijdkrachten in mandaat
      zijn verleend.

      3 Bijlage 3 bevat een overzicht van de personele bevoegdheden die binnen het Commando Luchtstrijdkrachten in
      mandaat zijn verleend.

      4 Bijlage 4 bevat een overzicht van de personele bevoegdheden die binnen de Koninklijke Marechaussee in mandaat
      zijn verleend.

      5 Bijlage 5 bevat een overzicht van de personele bevoegdheden die binnen de Defensie Materieel Organisatie in
      mandaat zijn verleend.

      6 Bijlage 6 bevat een overzicht van de personele bevoegdheden die binnen het Commando Dienstencentra in mandaat
      zijn verleend.

      7 Bijlage 7 bevat een overzicht van de personele bevoegdheden die binnen de Bestuursstaf in mandaat zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0038363
    url: https://wetten.overheid.nl/BWBR0038363/2016-09-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0038363
  - number: '4'
    text: Bij afwezigheid van de gemandateerde treedt diens plaatsvervanger voor de duur van de afwezigheid in diens plaats.
    url: https://wetten.overheid.nl/BWBR0038363/2016-09-01#Artikel4
  - number: '5'
    text: |-
      Ondermandaat van de bevoegdheden is enkel toegestaan voor zover dit volgt uit de bijlagen genoemd in
      [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0038363#Artikel3
    url: https://wetten.overheid.nl/BWBR0038363/2016-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0038363
        artikel: '3'
  - number: '6'
    text: >-
      De gemandateerde maakt geen gebruik van het aan hem verleende mandaat in de gevallen waarin hij van mening is dat
      het naasthogere niveau een beslissing dient te nemen of een document dient te ondertekenen.
    url: https://wetten.overheid.nl/BWBR0038363/2016-09-01#Artikel6
  - number: '7'
    text: |-
      1 Besluiten over bezwaarschriften neemt de gemandateerde één niveau hoger dan de gemandateerde die het besluit in
      eerste aanleg heeft genomen of een daartoe aangewezen autoriteit.

      2 Aan de Hoofddirecteur Personeel wordt mandaat verleend met betrekking tot het beslissen op bezwaarschriften
      gericht tegen besluiten die zijn genomen door hoofd defensieonderdeel of commandant operationeel commando.

      3 In besluiten die op grond van [artikel 3][ref1] zijn genomen, dient de mogelijkheid van het maken van bezwaar als
      volgt te worden vermeld:

      Indien u zich met het genomen besluit niet kunt verenigen, kunt u binnen 6 weken na de bekendmaking van het besluit
      (binnen 13 weken voor de militair die zich om dienstredenen in het buitenland bevindt) bij mij bezwaar maken. Het
      bezwaarschrift dient te worden gericht aan het Dienstencentrum Juridische Dienstverlening (JDV), MPC 55A, Postbus
      90004, 3509 AA Utrecht. Het bezwaarschrift moet worden gedateerd en ondertekend en dient tenminste de volgende
      gegevens te bevatten: de aanduiding ´bezwaarschrift´, naam en adres van de indiener, een omschrijving van het
      besluit waartegen het bezwaar zich richt en de gronden van het bezwaar. Het is wenselijk om een afschrift van het
      besluit en afschriften van andere relevante stukken mee te zenden en uw werknemer-ID te vermelden.


      [ref1]: https://wetten.overheid.nl/BWBR0038363#Artikel3
    url: https://wetten.overheid.nl/BWBR0038363/2016-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0038363
        artikel: '3'
  - number: '8'
    text: >-
      De gemandateerde oefent een aan hem gemandateerde bevoegdheid niet uit in die gevallen, waarin hij die bevoegdheid
      jegens zichzelf zou moeten uitoefenen. In dat geval wordt de bevoegdheid uitgeoefend door het naasthogere niveau.
    url: https://wetten.overheid.nl/BWBR0038363/2016-09-01#Artikel8
  - number: '9'
    text: >-
      De gemandateerde is gehouden het mandaat in de te nemen beschikking tot uitdrukking te laten komen door opneming
      van het volgende ondertekeningsblok:


      Mandaatgever (geattribueerde)


      voor deze


      Functie van de betrokken gemandateerde


      handtekening


      Naam van de gemandateerde
    url: https://wetten.overheid.nl/BWBR0038363/2016-09-01#Artikel9
  - number: '10'
    text: |-
      Met dit mandaatbesluit vervallen de mandaatbesluiten genoemd in [bijlage H][ref1], evenals de Regeling aanwijzing
      commandanten defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0038363
