  - number: '1'
    text: |-
      - *Minister:* de Minister van Defensie;
      - *Secretaris-Generaal:* de Secretaris-Generaal van het ministerie, waaronder mede begrepen de functionaris die
      door de Secretaris-Generaal schriftelijk is aangewezen om bij afwezigheid van de Secretaris-Generaal diens functie
      waar te nemen;
      - *Commandant operationeel commando:* de Commandant Zeestrijdkrachten, de Commandant Landstrijdkrachten, de
      Commandant Luchtstrijdkrachten, de Commandant Koninklijke Marechaussee, voor het desbetreffende commando;
      - *Hoofd defensieonderdeel:* zoals bedoeld in [artikel 1, eerste lid onderdeel i van het AMAR][ref1]
      respectievelijk [artikel 3, eerste lid onderdeel b van het BARD][ref2];
      - *Commandant:* voor de uitvoering van het [AMAR][ref3], [BARD][ref4], het [BDD][ref5], het [IBBAD][ref6], het
      [IBM][ref7] en de Verplaatsingskostenregeling defensie wordt onder commandant verstaan de commandant in de bijlagen
      bij deze regeling, ieder voor de militairen en ambtenaren van zijn bevoegdhedenressort. In afwijking hiervan
      wordt onder commandant verstaan: • de Commandant van het dienstencentrum Internationale Ondersteuning Defensie
      voor: 1° defensiepersoneel geplaatst op een arbeidsplaats behorend tot het internationaal functiebestand; 2°
      defensiepersoneel geplaatst op een arbeidsplaats behorende tot de Homogene Groep Internationale Samenwerking; 3°
      defensiepersoneel, niet genoemd in de onderdelen 1° en 2°, dat voor meer dan 30 dagen in het buitenland werkzaam
      is voor zover tussen het defensieonderdeel en de Commandant van het dienstencentrum Internationale Ondersteuning
      Defensie is overeengekomen dat het administratief commando wordt uitgevoerd door dienstencentrum Internationale
      Ondersteuning Defensie; • de Commandant der Zeemacht in het Caribisch gebied voor defensiepersoneel geplaatst in
      Aruba, Curaçao, Sint Maarten, Bonaire, Sint Eustatius en Saba met uitzondering van defensiepersoneel geplaatst bij
      het District Landelijke en Buitenlandse Eenheden van de Koninklijke Marechaussee.
      - *Tweede beoordelaar:* de functionele chef van de eerste beoordelaar;
      - *Functionele chef:* de functionaris die is geplaatst op een arbeidsplaats, zoals vastgelegd in het
      personeelsinformatiesysteem, waaraan leidinggevende bevoegdheden zijn verbonden. Wanneer deze bevoegdheden
      zelfstandig worden uitgeoefend door de functionele chef is dit, in de bijlagen als benoemd in [artikel 3][ref8],
      verwerkt in de kolom ‘Attributie’. Wanneer de functionele chef een handeling verricht in de selfservice namens de
      commandant is dit, in de bijlagen als benoemd in artikel 3, verwerkt in de kolom ‘Opmerkingen’.
      - *Defensiepersoneel:* de militair in werkelijke dienst als bedoeld in
      [artikel 1, eerste lid onderdeel c van het AMAR][ref9] en de ambtenaar als bedoeld in
      [artikel 1 van het BARD][ref10];
      - *Geplaatst bij:* het als gevolg van het toewijzen of opdragen van een andere functie deel uitmaken van een
      bepaalde eenheid onder de verantwoordelijkheid van een van de defensieonderdelen;
      - *Attributie:* de rechtstreekse toekenning van een bevoegdheid aan het bevoegd gezag;
      - *Mandaat:* de bevoegdheid om in naam van het bevoegd gezag besluiten te nemen;
      - *Mandaatgever:* de functionaris die de aan hem toegekende bevoegdheid mandateert;
      - *Gemandateerde:* de functionaris aan wie een bevoegdheid is gemandateerd.


