        artikel: '17'
        paragraaf: '3'
  - number: '19'
    text: |-
      1 De houder van een vergunning kan zijn vergunning geheel of gedeeltelijk aan een ander overdragen, nadat hij
      daartoe van Onze Minister schriftelijk toestemming heeft verkregen.

      2 De toestemming voor de overdracht van een opsporings- of winningsvergunning kan slechts worden geweigerd op grond
      van de technische of financiële mogelijkheden van de ander of op grond van de manier waarop de ander voornemens is
      het opsporingsonderzoek of de winning in het over te dragen gebied te verrichten. Met betrekking tot opsporings- en
      winningsvergunningen voor koolwaterstoffen is [artikel 6][ref1], van overeenkomstige toepassing.

      3 Onze Minister beslist op een aanvrage om toestemming niet dan nadat hij de Mijnraad heeft gehoord.

      4 [Artikel 17][ref2] is van overeenkomstige toepassing ten aanzien van een beschikking houdende verlening of
      weigering van toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0002504#Artikel17
