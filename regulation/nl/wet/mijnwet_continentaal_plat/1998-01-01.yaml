      1 Onze Minister kan hetgeen ingevolge een vergunning verschuldigd is, verhoogd met de op de invordering vallende
      kosten, bij dwangbevel invorderen.

      2 Geen invordering geschiedt dan nadat de schuldenaar schriftelijk is aangemaand binnen een bij de aanmaning
      te stellen termijn van ten minste tien dagen alsnog aan zijn verplichting te voldoen. De aanmaning bevat
      de aanzegging, dat het verschuldigde bedrag, voor zover dit binnen de gestelde termijn niet wordt betaald,
      overeenkomstig het eerste lid zal worden ingevorderd.

      3 Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] kan worden tenuitvoergelegd.

      4 Verzet tegen de tenuitvoerlegging van een dwangbevel wordt ingesteld door dagvaarding van de Staat.

      5 Het verzet stuit de aanvang of de voortzetting van de tenuitvoerlegging niet, behoudens de bevoegdheid van de
      geëxecuteerde of derde, die het verzet heeft gedaan, om hieromtrent een voorziening bij voorraad uit te lokken.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
