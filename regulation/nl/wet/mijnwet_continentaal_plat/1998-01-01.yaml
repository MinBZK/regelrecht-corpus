  - number: '41'
    text: |-
      Voor de toepassing van het bij of krachtens de [In- en uitvoerwet][ref1] (*Stb.* 1962, 295) bepaalde worden
      delfstoffen, welke zich bevinden in de inrichting, waarmede zij in of op het continentaal plat zijn gewonnen,
      geacht in het vrije verkeer in Nederland te zijn en gedurende het rechtstreeks vervoer naar Nederland in het vrije
      verkeer in Nederland te blijven.


