preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen ten aanzien van het onderzoek naar
    en de winning van delfstoffen in of op het onder de Noordzee gelegen deel van het continentaal plat waarop het
    Koninkrijk soevereine rechten heeft;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      continentaal plat: het onder de Noordzee gelegen deel van de zeebodem en de ondergrond daarvan, waarop het
      Koninkrijk mede overeenkomstig het op 29 april 1958 te Genève gesloten Verdrag inzake het continentale plateau
      (*Trb.* 1959, 126) soevereine rechten heeft en hetwelk is gelegen aan de zeezijde van de krachtens het tweede lid
      vastgestelde lijn;

      delfstoffen: een natuurlijke concentratie of afzetting in of op het continentaal plat van ertsen, mineralen of
      substanties van organische oorsprong, in vaste, vloeibare of gasvormige toestand, met uitzondering van water en van
      op de zeebodem of onmiddellijk onder de oppervlakte daarvan aanwezige schelpen, grind, zand en klei;

      verkenningsonderzoek: een onderzoek van het continentaal plat naar de aanwezigheid van delfstoffen, zonder
      gebruikmaking van boringen;

      opsporingsonderzoek: een onderzoek van het continentaal plat naar de aanwezigheid van delfstoffen, met
      gebruikmaking van boringen;

      winnen van delfstoffen: het, anders dan in de vorm van monsters of beproevingen, door middel van boringen of andere
      ondergrondse werken onttrekken van delfstoffen aan het continentaal plat;

      Onze Minister: Onze Minister van Economische Zaken;

      verkenningsvergunning: een vergunning voor het instellen van een verkenningsonderzoek;

      opsporingsvergunning: een vergunning voor het instellen van een opsporingsonderzoek naar daarin vermelde
      delfstoffen, alsmede voor het instellen van een verkenningsonderzoek;

      winningsvergunning: een vergunning voor het winnen van daarin vermelde delfstoffen, alsmede voor het instellen van
      een opsporingsonderzoek naar die delfstoffen en het instellen van een verkenningsonderzoek;

      inspectie-ambtenaren: de ambtenaren aangewezen krachtens [artikel 31][ref1].

      2 Wij stellen de lijn vast, welke voor de toepassing van het bij of krachtens deze wet, de wet van 21 april
      1810 (*Bulletin des Lois* 285) of de [Mijnwet 1903][ref2] (*Stb.* 1904, 73) bepaalde geldt als grens tussen de
      territoriale zee en de zee, waaronder zich het continentaal plat bevindt.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001870
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel1
