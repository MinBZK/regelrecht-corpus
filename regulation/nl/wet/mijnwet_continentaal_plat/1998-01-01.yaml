  - number: '13'
    text: |-
      1 Indien de houder van een opsporingsvergunning voor een delfstof met gebruikmaking van die vergunning die
      delfstof in een economisch winbare hoeveelheid heeft aangetoond, wordt hem op zijn aanvrage, ingediend gedurende de
      geldingsduur van die vergunning, een vergunning voor het winnen van die delfstof verleend met inachtneming van:

      a. de in [artikel 12, eerste lid][ref1], bedoelde algemene maatregel van bestuur, zoals deze luidde op het
      tijdstip, waarop de opsporingsvergunning is verleend;

      b. het in de opsporingsvergunning bepaalde omtrent de begrenzing van het gebied, waarvoor zodanige
      winningsvergunning kan gelden.

      2 Het eerste lid geldt niet indien weigering van de winningsvergunning gerechtvaardigd wordt door een wijziging
      in de technische of financiële mogelijkheden van de houder van de opsporingsvergunning of door de manier waarop de
      aanvrager voornemens is de winning in het gebied, waarvoor de winningsvergunning wordt aangevraagd, te verrichten.
      Met betrekking tot winningsvergunningen voor koolwaterstoffen is [artikel 6][ref2], van overeenkomstige toepassing.

      3 Indien een aanvrage als in het eerste lid bedoeld is ingediend, wordt de geldingsduur van de opsporingsvergunning
      geacht te zijn verlengd tot het tijdstip, waarop de beslissing op de aanvrage van kracht wordt.

      4 Nadat een winningsvergunning op grond van het tweede lid is geweigerd en deze weigering onherroepelijk is
      geworden,:

      a. wordt aan de aanvrager zo spoedig mogelijk van het bedrag, dat hij als houder van de in het eerste
      lid bedoelde opsporingsvergunning ingevolge een aan die vergunning verbonden voorschrift als bedoeld in
      [artikel 10, derde lid, onder ][ref3], aan de Staat heeft betaald, een gedeelte evenredig aan het in dit artikel,
      eerste lid, onder *b*, bedoelde gebied terugbetaald;

      b. kan ten aanzien van het betrokken gebied aan een ander een winningsvergunning voor de delfstof worden verleend.

      5 Indien binnen tien jaren na zodanige weigering een winningsvergunning krachtens het vierde lid wordt verleend,
      wordt in die vergunning bepaald, welk bedrag de houder aan de in het eerste lid bedoelde vergunninghouder wegens
      vinderspremie en ter vergoeding van de door deze gemaakte kosten zal betalen.

      6 Op het tijdstip, waarop een krachtens het eerste of vierde lid genomen besluit tot verlening van een
      winningsvergunning van kracht wordt, vervalt voor het betrokken gebied de opsporingsvergunning voor de delfstof.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel12
