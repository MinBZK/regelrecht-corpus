        artikel: '26'
        paragraaf: '4'
  - number: 21a
    text: |-
      1 Onze Minister zendt aan de Commissie van de Europese Gemeenschappen ieder jaar een verslag met gegevens over:

      a. de gebieden die voor de verkenning, opsporing en winning van koolwaterstoffen zijn vrijgegeven;

      b. de verleende opsporings- en winningsvergunningen voor koolwaterstoffen;

      c. de houders van de verleende opsporings- en winningsvergunningen voor koolwaterstoffen;

      d. de samenstelling van de houders, bedoeld onder *c*;

      e. de geraamde reserves aan koolwaterstoffen in het continentaal plat.

      2 Onze Minister legt het verslag voor een ieder ter inzage. Hij doet hiervan mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel21a
  - number: '22'
    text: |-
      1 De in of op het continentaal plat aanwezige delfstoffen zijn eigendom van de Staat.

      2 De Staat wordt voor alle met de eigendom dezer delfstoffen verband houdende handelingen vertegenwoordigd door
      Onze Minister.

      3 Het tweede lid is niet van toepassing ten aanzien van de overdracht van de eigendom van delfstoffen die, anders
      dan door winning, blijvend aan het continentaal plat worden onttrokken met gebruikmaking van een vergunning
      krachtens de [Ontgrondingenwet][ref1], aan de houder van die vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0002505
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002505
  - number: '23'
    text: |-
      De eigendom van de delfstoffen, welke met gebruikmaking van een winningsvergunning worden gewonnen, gaat door de
      winning over op de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel23
  - number: 23a
    text: |-
      1 Indien een vergunning is verleend of overgedragen aan twee of meer natuurlijke personen of rechtspersonen
      gezamenlijk, is ieder van hen hoofdelijk aansprakelijk voor hetgeen ingevolge de vergunning verschuldigd is.

      2 Het eerste lid geldt niet ten aanzien van een bedrag als bedoeld in [artikel 11, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel11
