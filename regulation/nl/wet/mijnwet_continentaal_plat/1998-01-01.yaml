  - number: 16a
    text: |-
      1 Indien een aanvraag om een opsporings- of winningsvergunning wordt ingediend, worden anderen in de gelegenheid
      gesteld om aanvragen om een soortgelijke vergunning in te dienen voor dezelfde delfstof voor hetzelfde gebied. Onze
      Minister plaatst hiertoe een uitnodiging in de Staatscourant.

      2 Anderen kunnen aanvragen indienen gedurende dertien weken nadat de uitnodiging in de Staatscourant is geplaatst.

      3 Indien het een aanvraag om een opsporings- of winningsvergunning voor koolwaterstoffen betreft, wordt de
      uitnodiging tevens geplaatst in het Publikatieblad van de Europese Gemeenschappen. In dat geval wordt de in het
      tweede lid bedoelde termijn gerekend vanaf deze plaatsing.

      4 Op de aanvragen wordt tegelijk beslist. De uitnodiging maakt melding van het bepaalde in [artikel 16][ref1].

      5 Het eerste tot en met het vierde lid gelden niet ingeval een aanvraag betrekking heeft op een winningsvergunning,
      ten aanzien waarvan [artikel 13, eerste lid][ref2], van toepassing is.

      6 Het eerste tot en met het vierde lid gelden mede niet ingeval een aanvraag om een winningsvergunning wordt
      ingediend door de houder van een opsporings- of winningsvergunning voor een aangrenzend gebied en deze aanvraag
      is ingediend naar aanleiding van de aantoning van een zich gedeeltelijk in het aangrenzende en gedeeltelijk in het
      aangevraagde gebied bevindend economisch winbaar voorkomen. Onze Minister stelt de houders van een opsporings- of
      winningsvergunning voor eventuele andere aangrenzende gebieden gedurende dertien weken in de gelegenheid om een
      aanvraag om een winningsvergunning voor dezelfde delfstof voor hetzelfde gebied in te dienen.

      7 Het eerste tot en met het vierde lid gelden voorts niet ingeval een aanvraag wordt ingediend binnen twee jaar na
      de indiening van een aanvraag om een soortgelijke vergunning voor dezelfde delfstof voor hetzelfde gebied, zonder
      dat op die aanvraag of op aanvragen van anderen als bedoeld in het tweede lid een vergunning is verleend. Onze
      Minister deelt in het Publikatieblad van de Europese Gemeenschappen mede op welke gebieden de eerste volzin met
      betrekking tot vergunningen voor koolwaterstoffen van toepassing is.

      8 Ten aanzien van overeenkomstig het tweede lid ingediende aanvragen wordt niet opnieuw toepassing gegeven aan het
      eerste tot en met het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0002504#Artikel13
