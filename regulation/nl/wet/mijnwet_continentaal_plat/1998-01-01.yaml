  - number: '2'
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister in, op of boven het continentaal plat onderzoekingen te
      verrichten, welke kunnen leiden tot het aantonen van de aanwezigheid van delfstoffen, of delfstoffen te winnen.

      2 Onze Minister kan, in overeenstemming met Onze Minister van Onderwijs en Wetenschappen, ten behoeve van het
      instellen van een zuiver wetenschappelijk onderzoek op daartoe strekkend verzoek ontheffing verlenen van het in het
      eerste lid bepaalde.

      3 Onze Minister kan ten behoeve van onderzoekingen als in het eerste lid bedoeld, welke geen verkennings- of
      opsporingsonderzoek zijn, op daartoe strekkend verzoek ontheffing verlenen van het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel2
  - number: '3'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat voor daarbij aangewezen delen van het continentaal plat
      geen vergunningen of ontheffingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel3
  - number: '4'
    text: |-
      Ieder opsporingsonderzoek, behoudens dat bedoeld in [artikel 2, lid 2][ref1], door of vanwege de Staat of een
      rechtspersoon, waarin de Staat een aanmerkelijk belang heeft, vereist een voorafgaande machtiging bij de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002504
        artikel: '2'
        paragraaf: '2'
  - number: '5'
    text: |-
      Wij kunnen bepalen dat gedurende een tijdvak van ten hoogste drie jaren voor daarbij aangewezen delen van het
      continentaal plat geen aanvragen om een opsporings- of winningsvergunning van een daarbij aangegeven strekking
      kunnen worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel5
  - number: '6'
    text: De toepasselijkheid van deze wet wordt beperkt door de in het volkenrecht erkende uitzonderingen.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel6
  - number: 6a
    text: |-
      1 Onverminderd de [artikelen 3][ref1], [5][ref2] en [9][ref3] kan een opsporings- of winningsvergunning slechts
      worden geweigerd:

      a. op grond van de technische of financiële mogelijkheden van de aanvrager,

      b. op grond van de manier waarop de aanvrager voornemens is het opsporingsonderzoek of de winning in het gebied,
      waarvoor de vergunning wordt aangevraagd, te verrichten, of

      c. in het belang van een doelmatige en voortvarende opsporing en winning, indien een keuze moet worden gemaakt uit
      twee of meer aanvragen die bij een beoordeling op grond van de onderdelen *a* en *b* gelijkwaardig zijn gebleken.

      2 Onze Minister stelt met het oog op de toepassing van het eerste lid nadere regels vast, die hij bij zijn
      beslissing op een aanvraag om een opsporings- of winningsvergunning voor koolwaterstoffen in acht zal nemen.

      3 Van de plaatsing in de Staatscourant van een besluit tot vaststelling van nadere regels als bedoeld in het tweede
      lid wordt mededeling gedaan in het Publikatieblad van de Europese Gemeenschappen. Een besluit tot wijziging van
      zodanige regels wordt mede bekendgemaakt in het Publikatieblad van de Europese Gemeenschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002504#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0002504#Artikel9
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel6a
