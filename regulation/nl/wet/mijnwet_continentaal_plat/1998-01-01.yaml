  - number: '26'
    text: |-
      1 Met betrekking tot het instellen van een verkennings- of opsporingsonderzoek en het winnen van delfstoffen kunnen
      bij algemene maatregel van bestuur voorschriften worden vastgesteld:

      a. ten behoeve van de scheepvaart, de visserij, het instandhouden van de levende rijkdommen van de zee, het zuiver
      wetenschappelijk onderzoek, het leggen en onderhouden van onderzeese kabels en pijpleidingen;

      b. in het belang van de veiligheid en de gezondheid van de personen, die bij het onderzoek of de winning werkzaam
      zijn;

      c. omtrent de arbeid van personen beneden de 18 jaar;

      d. ter bescherming van delfstoffen en andere natuurlijke rijkdommen van het continentaal plat;

      e. ter voorkoming van verontreiniging van de zee of van de zeebodem of de ondergrond daarvan;

      f. ter bescherming van historische, oudheidkundige en andere wetenschappelijke vondsten;

      g. omtrent het gebruik van elektromagnetische golven;

      h. ten behoeve van andere in het volkenrecht erkende belangen.

      2 Bij de maatregel kan worden bepaald, dat Onze Minister daarbij omschreven bevoegdheden heeft ter uitvoering van
      daarbij aangewezen voorschriften.

      3 Bij de maatregel kan voorts aan Onze Minister de bevoegdheid worden toegekend, in gevallen, waarin ernstige
      aantasting van de in het eerste lid genoemde belangen ontstaat of dreigt te ontstaan:

      a. maatregelen voor te schrijven ten aanzien van het instellen van een verkennings- of opsporingsonderzoek en het
      winnen van delfstoffen;

      b. bestuursdwang toe te passen ter handhaving van de onder *a* bedoelde maatregelen.

      4 Voor zover bij krachtens het eerste lid vastgestelde voorschriften is bepaald, dat ten aanzien daarvan
      vergunning of ontheffing kan worden verleend, gelden die voorschriften voor de houder van een bij hun
      inwerkingtreding bestaande, krachtens [artikel 2][ref1] verleende vergunning of ontheffing eerst na een maand na
      de inwerkingtreding, en, voor zover de houder binnen die termijn vergunning onderscheidenlijk ontheffing heeft
      verzocht, eerst nadat de beslissing op dat verzoek onherroepelijk is geworden.

      5 De voordracht tot vaststelling, wijziging of intrekking van een maatregel krachtens het eerste lid wordt Ons
      gedaan door Onze Minister, in overeenstemming met Onze Ministers, wie het mede aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel2
