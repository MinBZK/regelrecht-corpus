      1 Onze Minister kan, in overeenstemming met Onze Ministers van Verkeer en Waterstaat en van Defensie, rond
      een mijnbouwinstallatie een veiligheidszone van een door hem daarbij te bepalen omvang instellen. Zodanige
      veiligheidszone kan zich niet verder uitstrekken dan tot een afstand van 500 meter, gemeten van elk punt van de
      buitenzijde van de installatie.

      2 Onze Minister maakt de aanwezigheid en de verwijdering van een mijnbouwinstallatie, alsmede een krachtens het
      eerste lid vastgesteld besluit zo spoedig mogelijk in de *Staatscourant* bekend.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel27
  - number: '28'
    text: |-
      1 Het is verboden een vaartuig, luchtvaartuig of ander voorwerp binnen een krachtens
      [artikel 27, eerste lid][ref1], vastgestelde veiligheidszone anders dan ten behoeve van opsporings- of
      winningswerkzaamheden van de houder van de vergunning of de krachtens [artikel 2, tweede lid][ref2], verleende
      ontheffing aanwezig te doen zijn zonder toestemming van Onze Minister.

      2 Onze Minister kan, in overeenstemming met Onze Minister van Verkeer en Waterstaat, ter bescherming van
      mijnbouwinstallaties, rond welke een veiligheidszone is ingesteld, voorschriften vaststellen ten aanzien van de
      aanwezigheid van luchtvaartuigen boven veiligheidszones.

      3 Een krachtens het tweede lid vastgestelde beschikking wordt in de *Staatscourant* bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel27
