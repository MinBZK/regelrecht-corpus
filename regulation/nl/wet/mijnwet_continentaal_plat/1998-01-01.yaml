  - number: '7'
    text: |-
      1 In een vergunning of ontheffing wordt bepaald, voor welk tijdvak en voor welk deel van het continentaal plat
      zij geldt.

      2 Een vergunning of ontheffing kan tevens onder andere beperkingen worden verleend. Aan een vergunning of
      ontheffing kunnen voorschriften worden verbonden.

      3 In een vergunning of ontheffing kan worden bepaald, dat Onze Minister daarbij omschreven bevoegdheden heeft ter
      uitvoering van daarbij aangewezen voorschriften.

      4 In een vergunning of ontheffing kan voorts worden bepaald, dat overtreding van daarbij aangewezen voorschriften
      een grond is voor het intrekken van de vergunning of ontheffing.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel7
  - number: 7a
    text: |-
      1 In een opsporings- of winningsvergunning voor koolwaterstoffen wordt het tijdvak waarvoor zij geldt, zodanig
      bepaald dat dit niet langer is dan noodzakelijk om de activiteiten, waarvoor de vergunning wordt verleend, te
      verrichten.

      2 Indien de afbakening van het deel van het continentaal plat, waarvoor de opsporings- of winningsvergunning geldt,
      geen gevolg is van een voorafgaande geometrische verdeling, wordt het deel zodanig bepaald dat de uitoefening van
      de activiteiten uit technisch en economisch oogpunt op zo goed mogelijke wijze kan plaatsvinden. Onze Minister
      stelt nadere regels vast met het oog op de toepassing van de vorige volzin.

      3 Een opsporings- of winningsvergunning voor koolwaterstoffen kan slechts onder andere beperkingen dan die
      bedoeld in het eerste en tweede lid worden verleend, indien deze gerechtvaardigd worden door de veiligheid, de
      landsverdediging, de milieubescherming of een planmatig beheer van voorkomens van koolwaterstoffen.

      4 Aan een opsporings- of winningsvergunning voor koolwaterstoffen kunnen slechts voorschriften worden verbonden
      indien zij:

      a. gericht zijn op de betaling van een bijdrage in geld of in koolwaterstoffen dan wel op het veilig stellen van
      belastinginkomsten of

      b. gerechtvaardigd worden door de veiligheid, de landsverdediging, de milieubescherming of een planmatig beheer van
      voorkomens van koolwaterstoffen.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel7a
  - number: '8'
    text: |-
      Aan een vergunning kan het voorschrift worden verbonden, dat de houder aan de Staat op daarin bepaalde tijdstippen
      een daarin vastgesteld oppervlakterecht verschuldigd wordt.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel8
  - number: '9'
    text: |-
      Een opsporings- en een winningsvergunning voor een delfstof kunnen niet worden verleend voor het deel van het
      continentaal plat, waarvoor reeds een opsporings- of winningsvergunning voor die delfstof geldt.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel9
  - number: '10'
    text: |-
      1 In een opsporings- of winningsvergunning kan worden bepaald, dat het deel van het continentaal plat, waarvoor zij
      geldt, door Onze Minister op daarbij aangegeven wijze kan worden beperkt.

      2 Aan een opsporings- of winningsvergunning kan het voorschrift worden verbonden, dat de houder aan de Staat
      op door Onze Minister van Verkeer en Waterstaat te bepalen tijdstippen door hem vast te stellen bedragen
      verschuldigd wordt ter vergoeding van de kosten, die als gevolg van het krachtens de vergunning instellen van een
      opsporingsonderzoek of winnen van delfstoffen voor betonningen zijn gemaakt ter beveiliging van de scheepvaart of
      van voor genoemde werkzaamheden dienende mijnbouwinstallaties.

      3 Aan een opsporings- of winningsvergunning kunnen voorts de voorschriften worden verbonden:

      a. dat de houder aan de Staat bij het van kracht worden der vergunning een daarin vastgesteld bedrag verschuldigd
      wordt;

      b. dat daarin aangeduide inrichtingen, welke bij het gebruik maken van de vergunning worden gebezigd, aan de houder
      toebehoren;

      c. dat de houder een daarin bepaalde zekerheid zal stellen en gesteld houden voor de betaling van hetgeen hij
      ingevolge deze wet als houder van de vergunning dan wel door het gebruik maken daarvan aan de Staat verschuldigd
      zal worden; zodanig voorschrift blijft, ook nadat de vergunning haar kracht heeft verloren, gedurende een daarbij
      bepaalde termijn van kracht.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel10
  - number: '11'
    text: |-
      1 Aan een winningsvergunning kunnen de voorschriften worden verbonden, dat de houder aan de Staat:

      a. telkens op in de vergunning bepaalde tijdstippen een daarin vastgesteld bedrag, berekend naar de waarde der
      gewonnen delfstoffen, verschuldigd wordt;

      b. telkens op in de vergunning bepaalde tijdstippen een daarin vastgesteld bedrag, berekend naar de met de winning
      behaalde winst, verschuldigd wordt.

      2 Aan een winningsvergunning voor een delfstof kunnen voorts de voorschriften worden verbonden, dat de houder,
      indien hij met gebruikmaking van die vergunning of een opsporingsvergunning die delfstof in een economisch winbare
      hoeveelheid heeft aangetoond,:

      a. de door Onze Minister verlangde medewerking zal verlenen aan de oprichting van een naamloze vennootschap of een
      besloten vennootschap met beperkte aansprakelijkheid voor de winning van die delfstof, waarin de houder en de Staat
      op een in de vergunning bepaalde wijze belang nemen, en aan de totstandkoming van een overeenkomst tussen de houder
      en die vennootschap, krachtens welke de houder slechts voor rekening dier vennootschap zal winnen;

      b. zo die delfstof zich bevindt in een voorkomen, dat naar het oordeel van Onze Minister de grens van het betrokken
      deel van het continentaal plat overschrijdt, de door Onze Minister verlangde medewerking zal verlenen aan de
      totstandkoming van een overeenkomst tussen de houder en de voor een aangrenzend gebied tot winning van die delfstof
      gerechtigde, krachtens welke de winning in onderling overleg zal geschieden.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel11
  - number: '12'
    text: |-
      1 Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de aan een opsporings- of
      winningsvergunning voor koolwaterstoffen te verbinden voorschriften, bedoeld in [artikel 7][ref1].

      2 Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn verstreken
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat de
      inwerkingtreding van de algemene maatregel van bestuur bij wet wordt geregeld. In dat geval wordt een daartoe
      strekkend voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van wet wordt ingetrokken of indien
      een van de beide kamers van de Staten-Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel
      van bestuur ingetrokken.

      3 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de beperkingen, bedoeld in
      [artikel 7][ref2], waaronder een opsporings- of winningsvergunning voor koolwaterstoffen kan worden verleend, en
      met betrekking tot de voorschriften, bedoeld in [artikel 7][ref3], die aan een dergelijke vergunning kunnen worden
      verbonden.

      4 Een opsporings- of winningsvergunning voor koolwaterstoffen kan niet onder andere beperkingen als bedoeld in
      [artikel 7][ref4], en niet met andere voorschriften als bedoeld in [artikel 7][ref5], worden verleend dan die welke
      voortvloeien uit de algemene maatregel van bestuur, bedoeld in het eerste lid, of de ministeriële regeling, bedoeld
      in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel7a
