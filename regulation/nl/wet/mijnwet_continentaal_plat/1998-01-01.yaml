    text: |-
      1 Een beschikking tot verlening van zodanige vergunning wordt eerst van kracht nadat de houder aan Onze Minister
      schriftelijk heeft doen blijken, dat hij de vergunning met de beperkingen en voorschriften zonder voorbehoud
      aanvaardt en de daarin voorgeschreven zekerheid heeft gesteld. Is dit niet geschied binnen vier weken nadat de
      beschikking onherroepelijk is geworden, dan vervalt de beschikking.

      2 Nadat zodanige vergunning van kracht is geworden, wordt de beschikking tot verlening met vermelding van het
      tijdstip, waarop zij van kracht is geworden, in de *Staatscourant* geplaatst.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel17
  - number: '18'
    text: |-
      1 Indien de houder van een vergunning of ontheffing schriftelijk om wijziging daarvan verzoekt, geeft Onze Minister
      met inachtneming van het bij of krachtens deze wet bepaalde daaraan gevolg, voor zover dit naar zijn oordeel, al
      dan niet onder daardoor nodige verdere wijzigingen, met het algemeen belang is te verenigen.

      2 [Artikel 17][ref1] is van overeenkomstige toepassing ten aanzien van een beschikking, houdende wijziging of
      weigering van een wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel17
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel18
