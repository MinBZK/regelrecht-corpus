  - number: '14'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld betreffende de wijze waarop de aanvrage om
      een vergunning of ontheffing dient te geschieden, en de gegevens, welke daarnevens van de aanvrager kunnen worden
      verlangd.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel14
  - number: '15'
    text: |-
      Onverminderd de toepasselijkheid van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] ten aanzien van
      andere belanghebbenden, wordt een verkenningsvergunning of ontheffing welke zal gelden voor een deel van het
      continentaal plat, waarvoor een of meer opsporings- of winningsvergunningen gelden, niet verleend dan nadat de
      houders van die vergunningen zijn gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
  - number: '16'
    text: |-
      1 Op de voorbereiding van de beslissing op een aanvraag om een opsporings- of winningsvergunning is
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing, met dien verstande dat bij de
      terinzagelegging van de aanvraag kan worden volstaan met het vermelden van de zakelijke inhoud.

      2 Indien [artikel 16][ref2], toepassing heeft gevonden, geschiedt de terinzagelegging zo spoedig mogelijk na de op
      grond van [artikel 16][ref3], geldende termijn.

      3 Onze Minister beslist op de aanvraag niet dan nadat hij de Mijnraad heeft gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0002504#Artikel16a
      [ref3]: https://wetten.overheid.nl/BWBR0002504#Artikel16a
