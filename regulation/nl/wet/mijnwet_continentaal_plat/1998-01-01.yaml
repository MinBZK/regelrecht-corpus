      daarvan dan wel, indien toepassing is gegeven aan [artikel 16][ref1], binnen zes maanden na afloop van de termijn,
      bedoeld in [artikel 16][ref2].

      2 Onze Minister kan de termijn, waarbinnen hij op een aanvraag dient te beslissen, eenmaal met ten hoogste drie
      maanden verlengen.


