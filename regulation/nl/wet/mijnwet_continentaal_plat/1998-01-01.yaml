  - number: '20'
    text: |-
      Een vergunning of ontheffing vervalt met ingang van de dag, volgende op die, waarop Onze Minister een schriftelijke
      verklaring van de houder heeft ontvangen, waarbij deze van de vergunning of ontheffing afstand doet. Van het
      vervallen van een vergunning of ontheffing wordt in de *Staatscourant* mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel20
  - number: '21'
    text: |-
      1 Een vergunning of ontheffing wordt ingetrokken, indien de te harer verkrijging verstrekte gegevens of bescheiden
      zodanig onjuist of onvolledig blijken, dat op de aanvrage een andere beslissing zou zijn genomen, als bij de
      beoordeling daarvan de juiste omstandigheden volledig bekend waren geweest.

      2 Een opsporings- of winningsvergunning kan worden ingetrokken, indien de vergunning niet langer nodig is voor
      de goede uitvoering van de activiteiten waarvoor zij geldt. Een opsporings- of winningsvergunning wordt onder de
      genoemde omstandigheden in elk geval ingetrokken, indien het een vergunning voor koolwaterstoffen betreft.

      3 Een vergunning of ontheffing kan worden ingetrokken:

      a. indien de houder een aan de vergunning of ontheffing verbonden voorschrift, waarbij is bepaald, dat overtreding
      daarvan een grond is voor het intrekken van de vergunning of ontheffing, heeft overtreden en, nadat Onze Minister
      hem schriftelijk heeft gewaarschuwd, zich voortdurend of opnieuw aan overtreding van dat voorschrift schuldig maakt
      of, zo het voorschrift een verplichting om te doen inhoudt, deze verplichting niet alsnog nakomt;

      b. indien de houder herhaaldelijk, bij in kracht van gewijsde gegaan vonnis, is veroordeeld wegens overtreding van
      een krachtens [artikel 26][ref1] vastgesteld voorschrift.

      4 Een winningsvergunning kan worden ingetrokken, indien dit wordt gerechtvaardigd door een wijziging in de
      technische of financiële mogelijkheden van de houder.

      5 Een krachtens dit artikel gegeven beschikking wordt eerst van kracht zodra zij onherroepelijk is geworden.
      Van een beschikking tot intrekking van een opsporings- of winningsvergunning wordt een kennisgeving in de
      *Staatscourant* geplaatst zodra zij van kracht is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002504#Artikel26
    url: https://wetten.overheid.nl/BWBR0002504/1998-01-01#Artikel21
