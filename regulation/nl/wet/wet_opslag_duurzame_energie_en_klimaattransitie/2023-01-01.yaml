preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is een heffing in te voeren op het verbruik van
    elektriciteit en aardgas om het stimuleren van de productie van duurzame energie te financieren;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0032660/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Onder de naam opslag duurzame energie- en klimaattransitie wordt een heffing geheven op aardgas en elektriciteit.

      2 De opslag duurzame energie- en klimaattransitie wordt door de rijksbelastingdienst geheven en ingevorderd.

      3 De opslag duurzame energie- en klimaattransitie wordt geheven met overeenkomstige toepassing van het bepaalde
      bij of krachtens de [hoofdstukken I][ref1], [VI][ref2] en IX van de Wet belastingen op milieugrondslag, met dien
      verstande dat:

      a. de tariefsverlaging, bedoeld in [artikel 59a, eerste lid][ref3], en de belastingvermindering, bedoeld in
      [artikel 63, eerste lid][ref4], niet gelden;

      b. de op grond van [artikel 90][ref5] toe te passen indexatie niet geldt;

      c. de in die hoofdstukken opgenomen verwijzingen naar [artikel 59, eerste lid, onderdeel a][ref6], worden
      gelezen als verwijzingen naar [artikel 2, eerste lid, onderdeel a][ref7], verwijzingen naar artikel 59,
      eerste lid, onderdeel c, worden gelezen als verwijzingen naar [artikel 3][ref8], verwijzingen naar artikel
      59, derde lid, worden gelezen als verwijzingen naar artikel 2, eerste lid, onderdeel b, en verwijzingen naar
      [artikel 60, eerste lid][ref9], worden gelezen als verwijzingen naar artikel 2, eerste lid, onderdeel c.

      4 De heffing en de invordering van de opslag duurzame energie- en klimaattransitie geschiedt met overeenkomstige
      toepassing van het bepaalde bij of krachtens de [Algemene wet inzake rijksbelastingen][ref10], de
      [Invorderingswet 1990][ref11] en de [Kostenwet invordering rijksbelastingen][ref12].


