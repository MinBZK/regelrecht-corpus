      1 Het tarief voor de opslag duurzame energie- en klimaattransitie bedraagt voor:

      a. aardgas, met uitzondering van aardgas als bedoeld in de onderdelen b en c en het tweede lid, met een bovenste
      verbrandingswaarde van 35,17 megajoule per Nm3 voor dat gedeelte van de geleverde hoeveelheid per verbruiksperiode
      van twaalf maanden per aansluiting dat:

      1°. niet hoger is dan 170 000 kubieke meter, per kubieke meter € 0,0023 in 2013, € 0,0046 in 2014, € 0,0074
      in 2015, € 0,0113 in 2016, € 0,0159 in 2017, € 0,0285 in 2018, € 0,0524 in 2019, € 0,0775 in 2020, € 0,0851 in
      2021, € 0,0865 in 2022 en € 0 in 2023;

      2°. hoger is dan 170 000 kubieke meter, maar niet hoger dan 1 000 000 kubieke meter, per kubieke meter € 0,0009
      in 2013, € 0,0017 in 2014, € 0,0028 in 2015, € 0,0042 in 2016, € 0,0074 in 2017, € 0,0106 in 2018, € 0,0161 in
      2019, € 0,0214 in 2020, € 0,0235 in 2021, € 0,0239 in 2022 en € 0 in 2023;

      3°. hoger is dan 1 000 000 kubieke meter, maar niet hoger dan 10 000 000 kubieke meter, per kubieke meter € 0,0003
      in 2013, € 0,0005 in 2014 en € 0,0008 in 2015, € 0,0013 in 2016, € 0,0027 in 2017, € 0,0039 in 2018, € 0,0059 in
      2019, € 0,0212 in 2020, € 0,0232 in 2021, € 0,0236 in 2022 en € 0 in 2023;

      4°. hoger is dan 10 000 000 kubieke meter, per kubieke meter € 0,0002 in 2013, € 0,0004 in 2014 en, € 0,0006
      in 2015, € 0,0009 in 2016, € 0,0013 in 2017, € 0,0021 in 2018, € 0,0031 in 2019, € 0,0212 in 2020, € 0,0232 in
      2021, € 0,0236 in 2022 en € 0 in 2023;

      b. aardgas met een bovenste verbrandingswaarde van 35,17 megajoule per Nm3 dat wordt geleverd aan een verbruiker
      die dat aardgas gebruikt voor een installatie voor blokverwarming, niet zijnde een installatie voor stadsverwarming
      waarbij grotendeels gebruik wordt gemaakt van restwarmte, per kubieke meter € 0,0023 in 2013, € 0,0046 in 2014,
      € 0,0074 in 2015, € 0,0113 in 2016, € 0,0159 in 2017, € 0,0285 in 2018, € 0,0524 in 2019, € 0,0775 in 2020,
      € 0,0851 in 2021, € 0,0865 in 2022 en € 0 in 2023;

      c. aardgas met een bovenste verbrandingswaarde van 35,17 megajoule per Nm3 voor verwarming ter bevordering van het
      groeiproces van tuinbouwproducten als bedoeld in [artikel 60 van de Wet belastingen op milieugrondslag][ref1] voor
      dat gedeelte van de geleverde hoeveelheid per verbruiksperiode van twaalf maanden per aansluiting dat:

      1°. niet hoger is dan 170 000 kubieke meter, per kubieke meter € 0,0004 in 2013, € 0,0007 in 2014, € 0,0012
      in 2015, € 0,0018 in 2016, € 0,0026 in 2017, € 0,0046 in 2018, € 0,0084 in 2019, € 0,0124 in 2020, € 0,0137 in
      2021, € 0,0139 in 2022 en € 0 in 2023;

      2°. hoger is dan 170 000 kubieke meter, maar niet hoger dan 1 000 000 kubieke meter, per kubieke meter € 0,0004
      in 2013, € 0,0009 in 2014, € 0,0014 in 2015, € 0,0021 in 2016, € 0,0025 in 2017, € 0,0040 in 2018, € 0,0061 in
      2019, € 0,0081 in 2020, € 0,0089 in 2021, € 0,0090 in 2022 en € 0 in 2023;

      3°. hoger is dan 1 000 000 kubieke meter, maar niet hoger dan 10 000 000 kubieke meter, per kubieke meter € 0,0003
      in 2013, € 0,0005 in 2014, € 0,0008 in 2015, € 0,0013 in 2016, € 0,0027 in 2017, € 0,0039 in 2018, € 0,0059 in
      2019, € 0,0212 in 2020, € 0,0232 in 2021, € 0,0236 in 2022 en € 0 in 2023;

      4°. hoger is dan 10 000 000 kubieke meter, per kubieke meter € 0,0002 in 2013, € 0,0004 in 2014, € 0,0006 in 2015,
      € 0,0009 in 2016, € 0,0013 in 2017, € 0,0021 in 2018, € 0,0031 in 2019, 0,0212 in 2020, € 0,0232 in 2021, € 0,0236
      in 2022 en € 0 in 2023.

      2 Voor aardgas dat wordt geleverd aan een CNG-vulstation wordt geen tarief vastgesteld.


