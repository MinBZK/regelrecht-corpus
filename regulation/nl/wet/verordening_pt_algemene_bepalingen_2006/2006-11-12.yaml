preamble:
  text: |-
    gelet op de artikelen 77, 83, 93, 95, 104, eerste en derde lid, en 106 van de Wet op de bedrijfsorganisatie;

    gelet op de artikelen 12 tot en met 14 van het Instellingsbesluit Productschap Tuinbouw;

    gehoord:

    de Commissie voor bollen, knollen en wortelstokken van bolgewassen, d.d. 31 januari 2006,

    de Commissie voor energie d.d. 1 juni 2006,

    de Commissie voor groenten en fruit, d.d. 9 februari 2006,

    de Commissie voor bloemkwekerijproducten, d.d. 17 mei 2006,

    de Commissie voor hovenierswerkzaamheden, d.d. 12 april 2006, en

    de Commissie voor boomkwekerijproducten, d.d. 8 februari 2006,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#ArtikelAanhef
articles:
  - number: 1:1.1
    text: In deze verordening worden de begripsbepalingen van het Instellingsbesluit Productschap Tuinbouw overgenomen.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel11
  - number: 1:1.2
    text: |-
      In de verordeningen van het Productschap Tuinbouw wordt verstaan onder:







                    a.


                    bestuur:


                    het bestuur van het productschap;




                    b.


                    dagelijks bestuur:


                    uit het midden van het bestuur samengesteld bestuur als bedoeld in
      [artikel 84 van de Wet op de bedrijfsorganisatie][ref1];




                    c.


                    de voorzitter:


                    de voorzitter van het productschap;




                    d.


                    secretaris:


                    de secretaris van het productschap;




                    e.


                    functionaris:


                    eenieder werkzaam bij het productschap




                    f.


                    onderneming:


                    onderneming waarvoor het productschap is ingesteld;




                    g.


                    de ondernemer:


                    de natuurlijke of rechtspersoon die een onderneming drijft waarvoor het productschap is ingesteld;




                    h.


                    de wet:


                    de [Wet op de bedrijfsorganisatie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0002058
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '84'
      - id: ref2
        bwb_id: BWBR0002058
  - number: 2:1
    text: |-
      De ondernemer als bedoeld in [artikel 1:1, tweede lid, onder g][ref1], is verplicht binnen 30 dagen na de aanvang
      van de onderneming als bedoeld in [artikel 1:1, tweede lid, onder f][ref2], hiervan schriftelijke mededeling te
      doen bij het productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020002#Artikel1
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0020002
        artikel: '1'
        hoofdstuk: '1'
  - number: 2:2.1
    text: Het productschap stuurt de ondernemer een bericht van registratie en een registratienummer.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel22
  - number: 2:2.2
    text: Het in het eerste lid bedoelde kan worden vergezeld van een aantal nog nader te beantwoorden vragen.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel22
  - number: 2:3
    text: |-
      De ondernemer is verplicht een wijziging in de gegevens als bedoeld in het [voorgaande artikel][ref1] schriftelijk
      en binnen 30 dagen aan het productschap te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel2
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '2'
        hoofdstuk: '2'
  - number: 2:4
    text: Het productschap houdt in beheer een register van ondernemingen.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel24
  - number: 2:5
    text: |-
      Het bestuur van het productschap is bevoegd bij besluit nadere voorschriften vast te stellen ter uitvoering van het
      in dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel25
  - number: 3:1
    text: |-
      In dit hoofdstuk wordt verstaan onder:







                  a.


                  ambtshalve schatting:


                  nota op basis van door het productschap geraamde omvang van de grondslag die voor de onderneming
      ingevolge heffingsverordeningen van toepassing is, met een minimum;




                  b.


                  aangifteformulier:


                  door het productschap opgesteld formulier voor het verkrijgen van gegevens die nodig zijn om de omvang
      van de grondslag voor de verschillende heffingsverordeningen te bepalen;




                  c.


                  boekencontrole:


                  controle van de in de onderneming of bij diens accountant aanwezige boeken en/of bescheiden, zomede dat
      zij de in de onderneming aanwezige voorraden, alsmede bedrijfsmiddelen, bezichtigen en opnemen en zij daartoe de
      vrije gelegenheid geven noodzakelijk voor de vaststelling van een juiste en volledige omvang van die grondslagen
      die leiden tot, de over de te controleren periode, op te leggen heffingen.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel31
  - number: 3:2
    text: 'Iedere ondernemer is verplicht:'
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel32
  - number: 3:2.1
    text: |-
      in de administratie van zijn onderneming volledig en naar waarheid de transacties en/of andere feiten te
      registreren;
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel32
  - number: 3:2.2
    text: |-
      prompt en volledig en naar waarheid de vragen beantwoorden welke hem door of vanwege het productschap betreffende
      zijn onderneming worden gesteld, zomede op eerste aanvraag de door het productschap verlangde bescheiden tegen
      ontvangstbewijs in te leveren of in te zenden;
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel32
  - number: 3:2.3
    text: |-
      aan het productschap, hetzij rechtstreeks, hetzij door tussenkomst van enig(e) orgaan, instelling of persoon,
      gegevens, inlichtingen, opgaven of andere mededelingen te verstrekken, waaruit voor hemzelf of voor een derde enig
      recht of enig voordeel ontstaat of voortvloeit, respectievelijk kan ontstaan of voortvloeien, zulks volledig en
      naar waarheid te doen.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel32
  - number: 3:3
    text: De ondernemer is jaarlijks aan het productschap een heffing verschuldigd.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel33
  - number: 3:4.1
    text: Aan de onderneming wordt een aangifteformulier toegezonden.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:4.2
    text: |-
      Het aangifteformulier dient binnen 30 dagen ingevuld met de juiste gegevens en ondertekend aan het productschap te
      worden geretourneerd.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:4.3
    text: De verstrekte gegevens worden door het productschap gecontroleerd op correcte invulling.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:4.4
    text: De gegevens worden vervolgens verwerkt in het heffingenbestand.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:4.5
    text: Hierna wordt de berekening van de heffing opgestart.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:4.6
    text: Het opmaken van de nota vindt vervolgens plaats.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:4.7
    text: Indien niet is voldaan aan het gestelde onder het tweede lid, wordt een herinneringsbrief toegezonden.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:4.8
    text: Binnen 14 dagen dienen dan alsnog de gevraagde gegevens te zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:4.9
    text: |-
      Indien de gegevens als bedoeld in het tweede lid dan wel het achtste lid, niet, niet tijdig, of niet volledig zijn
      verstrekt, dan:
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:4.9.a
    text: |-
      wordt de heffing berekend over de dan door de voorzitter te ramen omvang van de grondslag die op de
      heffingsplichtige van toepassing is (de zogenaamde Ambtshalve Schatting), en
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:4.9.b
    text: wordt de heffing verhoogd met € 40,– administratiekosten.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:4.10
    text: |-
      Wordt de ambtshalve schatting, met medewerking van de heffingsplichtige, alsnog omgezet in een normale aangifte,
      dan blijft de € 40,– administratiekosten verschuldigd.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel34
  - number: 3:5
    text: |-
      In afwijking van het bepaalde in het [voorgaande artikel][ref1] kan de heffingsplichtge een voorlopige heffing
      worden opgelegd tot het bedrag waarop de heffing vermoedelijk zal worden vastgesteld. De voorlopige heffing wordt
      verrekend met de krachtens de van toepassing zijnde heffingsverordening verschuldigde heffing.


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel3
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:6
    text: 'De heffingsnota bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel36
  - number: 3:6.a
    text: de naam van de onderneming;
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel36
  - number: 3:6.b
    text: het adres van de onderneming
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel36
  - number: 3:6.c
    text: een specificatie of toelichting omtrent de wijze waarop de heffing is berekend;
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel36
  - number: 3:6.d
    text: het totaal van de heffing, en
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel36
  - number: 3:6.e
    text: een dagtekening.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel36
  - number: 3:7.1
    text: Het productschap is gerechtigd ten behoeve van een richtige heffing een boekencontrole uit te voeren.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel37
  - number: 3:7.2
    text: |-
      Deze boekencontrole wordt uitgevoerd door een functionaris van het productschap, die in het bezit is van een
      schriftelijke machtiging van de voorzitter
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel37
  - number: 3:7.3
    text: |-
      Indien bij de boekencontrole blijkt dat een onjuiste opgave is gedaan als bedoeld in
      [artikel 3:4, tweede lid][ref1], wordt ingeval een navordering verhoogd met maximaal 10%.


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel3
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:7.4
    text: |-
      Indien er bij een boekencontrole sprake is van een opgelegde ambtshalve schatting als bedoeld in
      [artikel 3:4, negende lid][ref1], wordt de na de boekencontrole opgestelde nota met 10% verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel3
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:7.5
    text: |-
      De termijn waarover de boekencontrole zich uitstrekt is maximaal acht jaar, waarbij niet meer dan de vijf meest
      recente aangiftejaren worden gecontroleerd
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel37
  - number: 3:8.1
    text: De betaling geschiedt binnen 30 dagen na dagtekening van de nota.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel38
  - number: 3:8.2
    text: 'In afwijking van het eerste lid is de nota is terstond invorderbaar zodra:'
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel38
  - number: 3:8.2.a
    text: het faillissement van de heffingsplichtige is aangevraagd;
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel38
  - number: 3:8.2.b
    text: degene die de onderneming drijft de onderneming beëindigt, of van het voornemen daartoe blijkt, of
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel38
  - number: 3:8.2.c
    text: |-
      degene die de onderneming drijft zich metterwoon in het buitenland heeft gevestigd of van het voornemen daartoe
      blijkt.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel38
  - number: 3:9
    text: |-
      De heffingsplichtige, die niet of niet geheel binnen de in [artikel 3:8][ref1] bedoelde termijn heeft betaald,
      worden de daaruit voortvloeiende extra kosten van € 22,50 in rekening gebracht, alsmede de wettelijke interest
      over het niet betaalde bedrag, te berekenen vanaf de dag waarop de betaling diende te zijn verricht, ingevolge de
      aanmaning als bedoeld in [artikel 127, tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel127
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '127'
  - number: 3:10
    text: |-
      De invorderingskosten voortvloeiend uit het niet betalen binnen de termijn als bedoeld in [artikel 3:8][ref1] en
      [3:9.][ref2] zijn voor rekening en risico van de ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020002#Artikel3
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel310
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0020002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 3:11
    text: |-
      De voorzitter is belast met de oplegging en inning van de heffing en de daarmee samenhangende kosten als bedoeld in
      de [artikelen 3:8 tot en met 3:10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel3
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel311
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 4:1
    text: |-
      ledere ondernemer is verplicht de voor de afnemer bestemde facturen op de dag van uitvoer, onderscheidenlijk het
      brengen buiten het verzendgebied, aan het productschap toe te zenden.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel41
  - number: 4:2
    text: |-
      In afwijking van het bepaalde in [artikel 4:1][ref1] zendt iedere ondernemer die bloemkwekerijproducten verhandelt
      de facturen aan het Hoofdbedrijfschap Agrarische Groothandel/bloemen en planten.


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel4
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '4'
        hoofdstuk: '4'
  - number: 4:3
    text: |-
      De ondernemer die bloemkwekerijproducten uitvoert of buiten het verzendgebied brengt, is verplicht om, zodra
      de buitenlandse afnemer een zending bloemkwekerijproducten heeft betaald, het Hoofdbedrijfschap Agrarische
      Groothandel/Bloem en Planten van deze betaling in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel43
  - number: 4:4
    text: |-
      Het bestuur van het productschap en kan, bij besluit, omtrent de uitvoering van het bepaalde in dit hoofdstuk
      nadere voorschriften stellen.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel44
  - number: 5:1
    text: |-
      De [artikelen 26][ref1] en [27 van de wet][ref2] zijn van overeenkomstige toepassing op het (dagelijks)
      bestuur, de artikel 88/88a-commissies, overige commissies en werkverbanden, behoudens het bepaalde in
      [artikel 90 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002058#Artikel90
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '27'
      - id: ref3
        bwb_id: BWBR0002058
        artikel: '90'
  - number: 5:2
    text: |-
      De [artikelen 10][ref1] en [77 van de wet][ref2] zijn ten aanzien van (dagelijks)bestuur, de artikel
      88/88acommissies, overige commissies en werkverbanden van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel77
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '77'
  - number: 6:1
    text: |-
      De voorzitter is belast met de uitvoering van verordeningen en besluiten van het (dagelijks) bestuur en oefent
      de daarmee verband houdende bevoegdheden uit, tenzij deze bevoegdheden uitdrukkelijk aan het (dagelijks) bestuur
      zijn voorbehouden en met dien verstande, dat het (dagelijks) bestuur, ingeval het zulks nodig oordeelt, een andere
      voorziening kan treffen.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel61
  - number: 6:2
    text: |-
      De voorzitter is bevoegd de tekst van ontwerp-verordeningen als bedoeld in [artikel 100 van de wet][ref1], vast te
      stellen. Het bestuur kan, ingeval het zulks nodig oordeelt, een andere voorziening treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel100
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '100'
  - number: 6:3
    text: |-
      De voorzitter is bevoegd tot het nemen van beslissingen, welke betrekking hebben op, voortvloeien uit of verband
      houden met het dagelijks beheer als bedoeld in [artikel 123, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel123
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '123'
  - number: 6:4.1
    text: 'De voorzitter kan een functionaris van het secretariaat machtigen, de hem krachtens:'
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel64
  - number: 6:4.1.a
    text: |-
      [artikel 27 van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel27
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '27'
  - number: 6:4.1.b
    text: |-
      [artikel 49 van de Landbouwwet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel49
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0002252
        artikel: '49'
  - number: 6:4.2
    text: |-
      De voorzitter is bevoegd de afdoening en ondertekening van namens hem en onder zijn verantwoordelijkheid uitgaande
      stukken, alsmede verrichten van bepaalde rechtshandelingen over te laten aan één of meer functionarissen van het
      productschap.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel64
  - number: 6:5
    text: |-
      De voorzitter oefent de krachtens [artikel 11, van de In- en Uitvoerwet][ref1], en
      [artikel 23, van de Landbouwwet][ref2] aan het bestuur overgedragen bevoegdheden – andere dan verordenende – uit.
      Het bestuur kan ingeval het zulks nodig acht, een andere voorziening treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0002376#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002252#Artikel23
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0002376
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002252
        artikel: '23'
  - number: 6:6.1
    text: |-
      De voorzitter is bevoegd te beslissen over het voeren van verweer door het productschap voor het College van Beroep
      voor het bedrijfsleven, alsmede te beslissen op bij het productschap ingediende bezwaarschriften.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel66
  - number: 6:6.2
    text: |-
      De voorzitter kan functionarissen van het secretariaat machtigen, de in het eerste lid bedoelde bevoegdheden uit
      te oefenen.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel66
  - number: 7:1.1
    text: |-
      De voorzitter geniet een maandelijkse vergoeding, welke gelijk is aan het hoogste bedrag van schaal 16, opgenomen
      in de bijlage III, behorende bij de collectieve arbeidsovereenkomst voor de Publiekrechtelijke Bedrijfsorganisatie
      (CAO-PBO), verhoogd met 16,5% en afgerond op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel71
  - number: 7:1.2
    text: Voor het overige zijn op hem van toepassing de bepalingen zoals opgenomen in de CAO-PBO.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel71
  - number: 7:2.1
    text: |-
      Ten aanzien van de voorzitter, die één of meer ambtsperioden, als bedoeld in
      [artikel 78, tweede lid, van de wet][ref1] vervuld hebbende, niet wordt herbenoemd, is het bepaalde in bijlage XVI
      van de CAO-PBO van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel78
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '78'
  - number: 7:2.2
    text: |-
      Ten aanzien van de voorzitter die wordt ontslagen ingevolge het bepaalde in
      [artikel 78, eerste lid, van de wet][ref1], is, tenzij naar het oordeel van het dagelijks bestuur van het
      productschap ernstige redenen zich daartegen verzetten, het bepaalde in bijlage XVI van de CAO-PBO van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel78
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '78'
  - number: 7:2.3
    text: |-
      De uitkering als bedoeld in het eerste lid, onderscheidenlijk het tweede lid, zal worden berekend op basis van de
      som van de in [artikel 7:1, eerste lid][ref1] bedoelde bedragen, en overeenkomstig het bepaalde in bijlage XVI van
      de CAO-PBO.


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel7
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '7'
        hoofdstuk: '7'
  - number: 8:1
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel81
  - number: 8:1.a
    text: |-
      commissies: commissies als bedoeld in [artikel 88][ref1] en [88a van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: 88a
  - number: 8:1.b
    text: 'overige commissies: andere door het bestuur van het productschap ingestelde permanente commissies;'
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel81
  - number: 8:1.c
    text: |-
      werkverbanden: door het productschap ingestelde tijdelijke commissies, stuurgroepen, werkgroepen,
      begeleidingscommissies, dan wel anderszins genoemd;
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel81
  - number: 8:1.d
    text: |-
      dagdeel: het deel van een dag waarvan het eerste aanvangt op het tijdstip van aanvang van de eerste bijgewoonde
      vergadering en het tweede en derde aanvangen nadat sedert dat tijdstip vijf respectievelijk tien uren zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel81
  - number: 8:2.1
    text: |-
      De leden van het (dagelijks) bestuur en van de commissies als bedoeld in [artikel 88][ref1] en
      [88a, van de wet][ref2], genieten voor elke door hen bijgewoonde vergadering, in relatie tot een dagdeel, een
      vergoeding bestaande uit:







                    a


                    een vacatiegeld:


                    € 207,00




                    b


                    een onkostenvergoeding:


                    € 16,00




                    c


                    een kilometervergoeding:


                    € 0,28 per kilometer


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel88a
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '88'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: 88a
  - number: 8:2.2
    text: |-
      Als afstand geldt de afstand heen en terug tussen de woonplaats en de plaats waarin de vergadering wordt gehouden;
      de afstand wordt vastgesteld door het secretariaat van het productschap op basis van de meest gebruikelijke
      reisroute over de weg.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel82
  - number: 8:2.3
    text: Deze bepaling is van overeenkomstige toepassing op plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel82
  - number: 8:2.4
    text: Deze bepaling is van overeenkomstige toepassing op de Normen en prijzencommissie.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel82
  - number: 8:3.1
    text: |-
      De leden van andere commissies genieten voor elke door hen bijgewoonde vergadering, in relatie tot een dagdeel, een
      vergoeding bestaande uit:







                    a


                    een vacatiegeld:


                    € 120,00




                    b


                    een onkostenvergoeding:


                    € 16,00




                    c


                    een kilometervergoeding:


                    € 0,28 per kilometer
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel83
  - number: 8:3.2
    text: |-
      Als afstand geldt de afstand heen en terug tussen de woonplaats en de plaats waarin de vergadering wordt gehouden;
      de afstand wordt vastgesteld door het secretariaat van het productschap op basis van de meest gebruikelijke
      reisroute over de weg.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel83
  - number: 8:3.3
    text: Deze bepaling is van overeenkomstige toepassing op plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel83
  - number: 8:4
    text: |-
      De leden van door het productschap ingestelde werkverbanden die diensten verrichten in het algemeen belang, dan wel
      werkzaamheden te velde verrichtten, genieten voor de geleverde dienst/werkzaamheid een vergoeding bestaande uit:
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel84
  - number: 8:4.2
    text: |-
      Als afstand geldt de afstand heen en terug tussen de woonplaats en de plaats waarin de vergadering wordt gehouden;
      de afstand wordt vastgesteld door het secretariaat van het productschap op basis van de meest gebruikelijke
      reisroute over de weg.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel84
  - number: 8:4.3
    text: Deze bepaling is van overeenkomstige toepassing op plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel84
  - number: 8:5.1
    text: |-
      Bij elke afzonderlijke vergadering wordt een presentielijst uitgedeeld, die strekt tot het uitsluitend bewijs dat
      een lid van een commissie als bedoeld in [artikel 8:2 tot en met 8:4][ref1], die vergadering daadwerkelijk heeft
      bijgewoond.


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel8
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:5.2
    text: |-
      Indien een lid van een van de onder [artikel 8:2 tot en met 8:4][ref1] bedoelde commissies en werkverbanden in
      één etmaal, in welke hoedanigheid ook, meer dan één vergadering heeft bijgewoond op dezelfde locatie, wordt per
      vergadering de vergoeding als bedoeld genoten, maar slechts éénmaal de reiskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel8
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:6
    text: Vacatiegelden en kilometervergoedingen zijn inclusief de eventueel verschuldigde omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel86
  - number: 8:7
    text: |-
      De voorzitter kan ingeval [artikel 8:3 tot en met 8:4][ref1] afwijken van de aldaar genoemde vergoedingen voor de
      aldaar bedoelden.


      [ref1]: https://wetten.overheid.nl/BWBR0020002#Artikel8
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0020002
        artikel: '8'
        hoofdstuk: '8'
  - number: 8:9
    text: Het bedrag wordt op kwartaalbasis betaalbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel89
  - number: 9:1
    text: |-
      De bepalingen uit [hoofdstuk 6][ref1] en [7 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige
      toepassing


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: 10:1.1
    text: |-
      De gegevens verkregen uit hoofde van het bepaalde in deze verordening dienen in handen van de voorzitter of door
      deze aan te wijzen functionarissen van het secretariaat van het productschap te worden gesteld, tenzij in deze
      verordening anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel101
  - number: 10:1.2
    text: Deze gegevens mogen slechts worden gebezigd voor de vervulling van de taak van het productschap.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel101
  - number: 11:1
    text: |-
      De [Verordening PT algemene bepalingen 2003][ref1] wordt ingetrokken


      [ref1]: https://wetten.overheid.nl/BWBR0016684
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0016684
  - number: 11:2
    text: Deze verordening treedt in werking de tweede dag na plaatsing in het Verordeningblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel112
  - number: 11:3
    text: 'Deze verordening wordt aangehaald als: Verordening PT algemene bepalingen 2006.'
    url: https://wetten.overheid.nl/BWBR0020002/2006-11-12#Artikel113
