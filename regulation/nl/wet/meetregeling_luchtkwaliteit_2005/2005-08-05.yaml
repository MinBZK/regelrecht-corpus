        bwb_id: BWBR0018458
        artikel: '20'
  - number: '8'
    text: |-
      Monsterneming bij de in de [artikelen 6][ref1] en [7][ref2] bedoelde meetpunten gebeurt, voor zover mogelijk, op
      zodanige wijze dat:

      a. de lucht rond de inlaatbuis vrij kan stromen en er geen voorwerpen zijn die de luchtstroom in de omgeving van de
      monsternemer beïnvloeden;

      b. de hoogte van de inlaatbuis tussen anderhalf en vier meter boven de grond ligt;

      c. door situering van de inlaatbuis wordt voorkomen dat de uitstoot van bronnen rechtstreeks en zonder menging met
      de buitenlucht in de inlaatbuis terechtkomt;

      d. de uitlaatbuis op een zodanige plaats is gesitueerd dat de lucht daaruit niet opnieuw in de inlaatbuis kan
      komen.


      [ref1]: https://wetten.overheid.nl/BWBR0018590#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018590#Artikel7
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018590
        artikel: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018590
        artikel: '7'
        paragraaf: '4'
  - number: '9'
    text: |-
      Monsterneming bij de in [artikel 7][ref1] bedoelde meetpunten op plaatsen die sterk door het verkeer worden
      beïnvloed, gebeurt, voor zover mogelijk, op zodanige wijze dat:

      a. de inlaatbuizen voor stikstofdioxide en koolmonoxide zijn gesitueerd binnen vijf meter van de wegrand;

      b. de inlaatbuizen voor zwevende deeltjes (PM), lood en benzeen zijn gesitueerd op een plaats die representatief is
      voor de luchtkwaliteit in de nabijheid van de rooilijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018590#Artikel7
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018590
        artikel: '7'
        paragraaf: '4'
  - number: '10'
    text: |-
      1 Per meetpunt voor de meting van zwaveldioxide worden uurgemiddelde en vierentwintig-uurgemiddelde concentraties
      bepaald.

      2 Indien per etmaal minder dan dertien uurgemiddelde concentraties beschikbaar zijn, wordt geen vierentwintig-
      uurgemiddelde concentratie bepaald, tenzij op grond van de beschikbare uurgemiddelde concentraties overschrijding
      van de in [artikel 12, onder b, van het besluit][ref1] genoemde vierentwintig-uurgemiddelde concentratie kan worden
      aangetoond.

      3 Het aantal gevalideerde uurwaarden per kalenderjaar bedraagt ten minste 90 procent.

      4 Indien minder dan 90 procent gevalideerde uurwaarden per kalenderjaar beschikbaar zijn, wordt op grond van de
      beschikbare uurgemiddelde concentraties nagegaan of de in de [artikelen 12][ref2] en [13 van het besluit][ref3]
      genoemde waarden zijn overschreden.

      5 Uurgemiddelde concentraties waarvan moet worden aangenomen dat de afwijking ten opzichte van de werkelijke
      concentratie groter is dan bepaald in [artikel 25, tweede, onderscheidenlijk derde lid, van het besluit][ref4],
      worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0018458#Artikel25
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel10
