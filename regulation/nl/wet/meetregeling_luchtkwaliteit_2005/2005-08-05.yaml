preamble:
  text: |-
    Gelet op richtlijn nr. 2000/69/EG van het Europees Parlement en de Raad van de Europese Unie van 16 november
    2000, betreffende grenswaarden voor benzeen en koolmonoxide in de lucht (PbEG L 313), richtlijn nr. 1999/30/EG
    van de Raad van de Europese Unie van 22 april 1999, betreffende grenswaarden voor zwaveldioxide, stikstofdioxide
    en stikstofoxiden, zwevende deeltjes en lood in de lucht (PbEG L 163), richtlijn nr. 96/62/EG van de Raad van de
    Europese Unie van 27 september 1996, inzake de beoordeling en het beheer van de luchtkwaliteit (PbEG L 296), en de
    artikelen 3, eerste lid, en 6, van het Besluit luchtkwaliteit 2005;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder besluit: [Besluit luchtkwaliteit 2005][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018458
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018458
  - number: '2'
    text: |-
      Voor de toepassing van het [besluit][ref1] worden als agglomeraties aangewezen:

      a. agglomeratie Amsterdam/Haarlem, omvattend de gemeenten Amsterdam, Aalsmeer, Amstelveen, Uithoorn, Ouder-
      Amstel, Diemen, Zaanstad, Heemskerk, Beverwijk, Velsen, Haarlem, Bloemendaal, Zandvoort, Heemstede, Bennebroek,
      Haarlemmerliede, Spaarnwoude en Haarlemmermeer;

      b. agglomeratie Den Haag/Leiden, omvattend de gemeenten Den Haag, Westland, Midden-Delfland, Delft, Rijswijk,
      Leidschendam-Voorburg, Wassenaar, Voorschoten, Leiden, Oegstgeest, Katwijk, Valkenburg, Rijnsburg en Leiderdorp;

      c. agglomeratie Rotterdam/Dordrecht, omvattend de gemeenten Rotterdam, Schiedam, Vlaardingen, Maassluis, Rozenburg,
      Spijkenisse, Albrandswaard, Capelle aan de IJssel, Ridderkerk, Barendrecht, Zwijndrecht, Hendrik-Ido-Ambacht,
      Dordrecht, Papendrecht en Sliedrecht;

      d. agglomeratie Utrecht, omvattend de gemeenten Utrecht, Houten, Nieuwegein, IJsselstein en Maarssen;

      e. agglomeratie Eindhoven, omvattend de gemeenten Eindhoven, Best, Veldhoven, Geldrop-Mierlo, Nuenen en Helmond;

      f. agglomeratie Heerlen/Kerkrade, omvattend de gemeenten Heerlen, Kerkrade, Landgraaf, Brunssum, Voerendaal en
      Nuth.


      [ref1]: https://wetten.overheid.nl/BWBR0018458
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018458
  - number: '3'
    text: |-
      Voor de toepassing van het [besluit][ref1] worden als zones aangewezen:

      a. zone noord, omvattend de provincies Groningen, Friesland, Drenthe, Overijssel en Flevoland;

      b. zone midden, omvattend de provincies Noord-Holland, Zuid-Holland, Utrecht en Gelderland, met uitzondering van de
      zich in dit gebied bevindende agglomeraties;

      c. zone zuid, omvattend de provincies Zeeland, Noord-Brabant en Limburg, met uitzondering van de zich in dit gebied
      bevindende agglomeraties.


      [ref1]: https://wetten.overheid.nl/BWBR0018458
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0018458
  - number: '4'
    text: |-
      1 De agglomeratie Amsterdam/Haarlem bevat ten minste:

      a. twee vaste meetpunten voor zwaveldioxide;

      b. vier vaste meetpunten voor stikstofdioxide;

      c. vier vaste meetpunten voor zwevende deeltjes (PM);

      d. vijf vaste meetpunten voor koolmonoxide;

      e. vijf vaste meetpunten voor benzeen.

      2 De agglomeratie Den Haag/Leiden bevat ten minste:

      a. twee vaste meetpunten voor zwaveldioxide;

      b. vier vaste meetpunten voor stikstofdioxide;

      c. vier vaste meetpunten voor zwevende deeltjes (PM);

      d. twee vaste meetpunten voor koolmonoxide;

      e. twee vaste meetpunten voor benzeen.

      3 De agglomeratie Rotterdam/Dordrecht bevat ten minste:

      a. twee vaste meetpunten voor zwaveldioxide;

      b. vier vaste meetpunten voor stikstofdioxide;

      c. vier vaste meetpunten voor zwevende deeltjes (PM);

      d. één vast meetpunt voor lood;

      e. twee vaste meetpunten voor koolmonoxide;

      f. twee vaste meetpunten voor benzeen.

      4 De agglomeratie Utrecht bevat ten minste:

      a. twee vaste meetpunten voor zwaveldioxide;

      b. twee vaste meetpunten voor stikstofdioxide;

      c. twee vaste meetpunten voor zwevende deeltjes (PM);

      d. één vast meetpunt voor koolmonoxide;

      e. één vast meetpunt voor benzeen.

      5 De agglomeratie Eindhoven bevat ten minste:

      a. twee vaste meetpunten voor zwaveldioxide;

      b. twee vaste meetpunten voor stikstofdioxide;

      c. twee vaste meetpunten voor zwevende deeltjes (PM);

      d. één vast meetpunt voor koolmonoxide;

      e. één vast meetpunt voor benzeen.

      6 De agglomeratie Heerlen/Kerkrade bevat ten minste:

      a. twee vaste meetpunten voor zwaveldioxide;

      b. twee vaste meetpunten voor stikstofdioxide;

      c. twee vaste meetpunten voor zwevende deeltjes (PM);

      d. één vast meetpunt voor koolmonoxide;

      e. één vast meetpunt voor benzeen.
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel4
  - number: '5'
    text: |-
      1 De zone noord bevat ten minste:

      a. twee vaste meetpunten voor zwaveldioxide;

      b. twee vaste meetpunten voor stikstofdioxide, waarvan er één tevens als meetpunt voor stikstofoxiden wordt
      gebruikt;

      c. zeven vaste meetpunten voor zwevende deeltjes (PM);

      d. één vast meetpunt voor lood;

      e. één vast meetpunt voor koolmonoxide;

      f. één vast meetpunt voor benzeen.

      2 De zone midden bevat ten minste:

      a. twee vaste meetpunten voor zwaveldioxide;

      b. acht vaste meetpunten voor stikstofdioxide;

      c. acht vaste meetpunten voor zwevende deeltjes (PM);

      d. één vast meetpunt voor lood;

      e. één vast meetpunt voor koolmonoxide;

      f. vier vaste meetpunten voor benzeen.

      3 De zone zuid bevat ten minste:

      a. twee vaste meetpunten voor zwaveldioxide;

      b. drie vaste meetpunten voor stikstofdioxide;

      c. zeven vaste meetpunten voor zwevende deeltjes (PM);

      d. één vast meetpunt voor lood;

      e. drie vaste meetpunten voor koolmonoxide;

      f. drie vaste meetpunten voor benzeen.
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel5
  - number: '6'
    text: |-
      Meetpunten voor de meting van concentraties zwaveldioxide en stikstofoxiden ter beoordeling van de luchtkwaliteit
      voor stoffen waarvoor de grenswaarden, bedoeld in [artikel 13][ref1], onderscheidenlijk [19, van het besluit][ref2]
      gelden, worden geplaatst op een zodanig punt dat door middel van metingen op dat punt gegevens worden verkregen
      over concentraties van de betreffende luchtverontreinigende stof die representatief zijn voor gebieden met een
      oppervlakte van ten minste 1000 km2, die geheel gelegen zijn op een afstand van ten minste 20 kilometer van
      agglomeraties of op een afstand van ten minste 5 kilometer van andere gebieden met bebouwing, van inrichtingen of
      van autosnelwegen.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel19
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0018458
        artikel: '19'
  - number: '7'
    text: |-
      1 Meetpunten voor de meting van concentraties zwaveldioxide, stikstofdioxide, zwevende deeltjes (PM),
      lood, koolmonoxide en benzeen ter beoordeling van de luchtkwaliteit voor stoffen waarvoor de grenswaarden,
      plandrempels en alarmdrempels, bedoeld in de [artikelen 12][ref1], [14 tot en met 18][ref2] en
      [20 tot en met 24 van het besluit][ref3] gelden, worden geplaatst op een zodanig punt, dat door middel van metingen
      op dat punt gegevens worden verkregen over concentraties van de betreffende luchtverontreinigende stof:

      a. in gebieden binnen zones en agglomeraties waar de hoogste concentraties voorkomen waaraan de bevolking direct of
      indirect, gedurende een periode die ten opzichte van de middelingstijd van de betreffende grenswaarde significant
      is, aan die concentraties kan worden blootgesteld;

      b. in andere gebieden binnen zones en agglomeraties dan bedoeld onder a, die representatief zijn voor de
      blootstelling van de bevolking als geheel;

      c. op plaatsen die sterk door het verkeer worden beïnvloed, waarbij aannemelijk is dat die gegevens representatief
      zijn voor de luchtkwaliteit in een gebied van ten minste 200 m2; de afstand van het meetpunt tot grote kruispunten
      bedraagt ten minste 25 meter en de afstand tot het midden van de dichtstbij gelegen rijbaan bedraagt ten minste
      4 meter;

      d. op plaatsen die beïnvloed worden door een stedelijke achtergrondconcentratie, waarbij aannemelijk is dat die
      gegevens representatief zijn voor een gebied van verscheidene vierkante kilometers;

      2 De in het eerste lid bedoelde meetpunten zijn zo mogelijk ook representatief voor soortgelijke plaatsen buiten
      hun onmiddellijke omgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel20
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel7
    references:
      - id: ref1
