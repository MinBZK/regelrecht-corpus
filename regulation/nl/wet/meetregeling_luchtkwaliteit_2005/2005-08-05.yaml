        artikel: '25'
  - number: '11'
    text: |-
      1 Per meetpunt voor de meting van stikstofdioxide en stikstofoxiden worden uurgemiddelde concentraties bepaald.

      2 Het aantal gevalideerde uurwaarden per kalenderjaar bedraagt ten minste 90 procent.

      3 Indien minder dan 90 procent gevalideerde uurwaarden per kalenderjaar beschikbaar zijn, wordt op grond
      van de beschikbare uurgemiddelde concentraties nagegaan of de in de [artikelen 15 tot en met 17][ref1] en
      [19 van het besluit][ref2] genoemde waarden zijn overschreden.

      4 Uurgemiddelde concentraties waarvan moet worden aangenomen dat de afwijking ten opzichte van de werkelijke
      concentratie groter is dan bepaald in [artikel 25, vierde, onderscheidenlijk vijfde lid, van het besluit][ref3],
      worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel25
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel11
