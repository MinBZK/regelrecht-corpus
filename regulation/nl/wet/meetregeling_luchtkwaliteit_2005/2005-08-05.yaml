        artikel: '25'
  - number: '12'
    text: |-
      1 Per meetpunt voor de meting van zwevende deeltjes (PM) worden vierentwintig-uurgemiddelde concentraties bepaald.

      2 Indien per etmaal minder dan dertien uur bemonsterd is, wordt geen vierentwintig-uurgemiddelde
      concentratie bepaald, tenzij op grond van de over dat etmaal beschikbare meetwaarden overschrijding van de
      in [artikel 20, onder b, van het besluit][ref1] genoemde vierentwintig-uurgemiddelde concentraties kan worden
      aangetoond.

      3 Het aantal gevalideerde vierentwintig-uurgemiddelde concentraties per kalenderjaar bedraagt ten minste 90
      procent.

      4 Indien minder dan 90 procent gevalideerde vierentwintig-uurgemiddelde concentraties beschikbaar
      zijn wordt op grond van de beschikbare vierentwintig-uurgemiddelde concentraties nagegaan of de in
      [artikel 20 van het besluit][ref2] genoemde waarden zijn overschreden.

      5 Vierentwintig-uurgemiddelde concentraties waarvan moet worden aangenomen dat de afwijking ten opzichte van
      de werkelijke concentratie groter is dan bepaald in [artikel 25, zesde lid, van het besluit][ref3] worden niet
      gebruikt.

      6 Voor de toepassing van [artikel 5, eerste lid, van het besluit][ref4], wordt ten aanzien van zeezout gebruik
      gemaakt van de procedure zoals beschreven in de bij deze regeling behorende bijlage.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0018458#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0018458#Artikel5
