  - number: '13'
    text: |-
      1 Per meetpunt voor de meting van lood worden gedurende ten minste 14 procent van de tijd in een kalenderjaar
      concentraties bepaald. De metingen vinden gelijkmatig over het kalenderjaar gespreid plaats.

      2 Het aantal gevalideerde meetwaarden per kalenderjaar bedraagt ten minste 90 procent.

      3 Meetresultaten waarvan moet worden aangenomen dat de afwijking ten opzichte van de werkelijke concentratie groter
      is dan bepaald in [artikel 25, zevende lid, van het besluit][ref1] worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel25
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '25'
  - number: '14'
    text: |-
      1 Per meetpunt voor de meting van koolmonoxide worden uurgemiddelde en acht-uurgemiddelde concentraties bepaald.

      2 Indien in een periode van acht uur minder dan vijf uurgemiddelde concentraties beschikbaar zijn, wordt uit de
      uurgemiddelde concentraties geen acht-uurgemiddelde concentratie berekend.

      3 Uurgemiddelde concentraties waarvan moet worden aangenomen dat de afwijking ten opzichte van de werkelijke
      concentraties groter is dan bepaald in [artikel 25, achtste lid, van het besluit][ref1], worden niet gebruikt.

      4 Acht-uurgemiddelde concentraties worden voortschrijdend berekend uit acht achtereenvolgende uurgemiddelde
      concentraties. Het eerste acht-uurgemiddelde op een dag betreft de periode van 17.00 uur op de voorgaande dag tot
      01.00 uur; het laatste acht-uurgemiddelde op een dag betreft de periode van 16.00 uur tot 24.00 uur.

      5 Het aantal gevalideerde uurwaarden per kalenderjaar bedraagt ten minste 90 procent.

      6 Indien minder dan 90 procent gevalideerde uurwaarden per kalenderjaar beschikbaar zijn wordt op grond van de
      beschikbare uurgemiddelde concentraties nagegaan of de in [artikel 22 van het besluit][ref2] genoemde waarde is
      overschreden.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0018458#Artikel22
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0018458
        artikel: '22'
  - number: '15'
    text: |-
      1 Per meetpunt voor de meting van benzeen worden uurgemiddelde, vierentwintig-uurgemiddelde dan wel week-gemiddelde
      concentraties bepaald

      a. in stedelijk gebied: gedurende ten minste 35 procent van de tijd in een kalenderjaar en

      b. in de nabijheid van inrichtingen: gedurende ten minste 90 procent van de tijd in een kalenderjaar.

      2 De metingen worden continu dan wel steekproefsgewijs verricht.

      3 Steekproefsgewijze metingen vinden gelijkmatig over het kalenderjaar gespreid plaats, met dien verstande dat
      gedurende één dag per week, gelijkmatig over het jaar gespreid, één meting plaatsvindt dan wel dat één meting per
      dag plaatsvindt gedurende acht gelijkmatig over het jaar gespreide weken.

      4 Het aantal gevalideerde meetwaarden per kalenderjaar bedraagt ten minste 90 procent.

      5 Meetresultaten waarvan moet worden aangenomen dat de afwijking ten opzichte van de werkelijke concentratie groter
      is dan bepaald in [artikel 25, negende lid, van het besluit][ref1], worden niet gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018458#Artikel25
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018458
        artikel: '25'
  - number: '16'
    text: |-
      Voor de analyse van zwaveldioxide wordt gebruik gemaakt van

      a. de methode beschreven in ISO/FDIS 10498, Bepaling van zwaveldioxide, UV-fluorescentiemethode, dan wel van

      b. een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de met
      gebruikmaking van de onder a. genoemde methode verkregen resultaten.
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel16
  - number: '17'
    text: |-
      Voor de analyse van stikstofdioxide en stikstofoxiden wordt gebruik gemaakt van

      a. de methode beschreven in ISO 7996: 1985 Lucht, Bepaling van massaconcentraties van stikstofoxiden,
      chemoluminescentiemethode, dan wel van

      b. een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de met
      gebruikmaking van de onder a. genoemde methode verkregen resultaten.
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel17
  - number: '18'
    text: |-
      Voor de monsterneming en meting van PM wordt gebruik gemaakt van

      a. de methode beschreven in prEN 12341, Air Quality – Field Test Procedure to Demonstrate Reference Equivalence of
      Sampling Methods for the PM fraction of particulate matter, dan wel van

      b. een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de met
      gebruikmaking van de onder a. genoemde methode verkregen resultaten, dan wel van

      c. een andere methode die een constante samenhang heeft met de onder a. genoemde methode. Op de met deze methode
      verkregen resultaten wordt een correctiefactor toegepast, teneinde resultaten te verkrijgen die gelijkwaardig zijn
      aan de met gebruikmaking van de onder a. genoemde methode, verkregen resultaten.
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel18
  - number: '19'
    text: |-
      Voor de monsterneming van lood wordt gebruik gemaakt van

      a. de methode beschreven in prEN 12341, Air Quality – Field Test Procedure to Demonstrate Reference Equivalence of
      Sampling Methods for the PM fraction of particulate matter, dan wel van

      b. een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de met
      gebruikmaking van de onder a. genoemde methode verkregen resultaten.
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel19
  - number: '20'
    text: |-
      Voor de analyse van lood wordt gebruik gemaakt van

      a. de methode beschreven in ISO 9855: 1993 Lucht, Bepaling van het gehalte aan zwevende looddeeltjes in in filters
      opgevangen aërosolen, Methode van atomaire absorbtiespectrometrie, dan wel

      b. een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de met
      gebruikmaking van de onder a. genoemde methode verkregen resultaten.
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel20
  - number: '21'
    text: |-
      Voor de analyse van koolmonoxide wordt gebruik gemaakt van

      a. een methode van niet-dispersieve infrarood-spectrometrie (NDIR), dan wel van

      b. een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de met
      gebruikmaking van de onder a. genoemde methode verkregen resultaten.
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel21
  - number: '22'
    text: |-
      Voor de monsterneming en analyse van benzeen wordt gebruik gemaakt van

      a. een methode van pompbemonstering met een absorptiepatroon, gevolgd door bepaling met behulp van
      gaschromatografie, dan wel van

      b. een andere methode met behulp waarvan resultaten kunnen worden verkregen die gelijkwaardig zijn aan de met
      gebruikmaking van de onder a. genoemde methode verkregen resultaten.
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel22
  - number: '23'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het [Besluit luchtkwaliteit 2005][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0018458
    url: https://wetten.overheid.nl/BWBR0018590/2005-08-05#Artikel23
