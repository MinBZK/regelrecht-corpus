preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, vooruitlopend op verder gaande wijzigingen in
    wettelijke regelingen met betrekking tot de structuur en financiering van de gezondheidszorg, de contracteerplicht
    in de ziekenfondsverzekering en de bijzondere ziektekostenverzekering te beperken, de mogelijkheid te openen
    een lager tarief in rekening te brengen dan het overeenkomstig de Wet tarieven gezondheidszorg goedgekeurde of
    vastgestelde tarief, alsmede enige andere wijzigingen in de Ziekenfondswet, de Algemene Wet Bijzondere Ziektekosten
    en de Wet tarieven gezondheidszorg aan te brengen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005281/1992-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      A 1. De ingevolge [artikel 44, eerste lid, van de Ziekenfondswet][ref1] dan wel
      [artikel 42, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref2] met personen voor de inwerkingtreding
      van deze wet gesloten overeenkomsten vervallen, behoudens indien deze voordien zijn herzien, uiterlijk met ingang
      van 1 januari 1994.

      2. De ingevolge [artikel 44a van de Ziekenfondswet][ref3] of
      [artikel 42a van de Algemene Wet Bijzondere Ziektekosten][ref4] voor de inwerkingtreding van deze wet door de
      Ziekenfondsraad vastgestelde modelovereenkomsten en goedgekeurde uitkomsten vervallen, behoudens indien deze
      voordien zijn herzien, uiterlijk met ingang van 1 januari 1994. Tot het tijdstip genoemd in de eerste volzin
      blijven bepalingen van modelovereenkomsten en onderdelen van uitkomsten, welke niet met het bepaalde in artikel 45,
      eerste lid, onderscheidenlijk artikel 43, eerste lid, van de in de eerste volzin genoemde wetten in overeenstemming
      zijn, buiten toepassing.

      3. Indien binnen drie maanden na de datum van inwerkingtreding van deze wet geen
      regeling als bedoeld in [artikel 46a van de Ziekenfondswet][ref5] onderscheidenlijk
      [artikel 44a van de Algemene Wet Bijzondere Ziektekosten][ref6] aan de Ziekenfondsraad is medegedeeld, stelt de
      Ziekenfondsraad binnen twee maanden zodanige regeling vast.

      B

      C

      D Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip en werkt voor wat betreft
      [artikel II, onderdeel A en onderdeel E][ref7], voor zover het betreft artikel 45, vierde lid, terug tot en met 1
      januari 1989.


