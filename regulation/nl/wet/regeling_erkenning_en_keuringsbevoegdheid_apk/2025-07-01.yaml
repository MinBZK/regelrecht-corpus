      1 De erkenninghouder neemt in verband met de periodieke keuring van motorrijtuigen en aanhangwagens het bij en
      krachtens de [wet](onbekend) bepaalde in acht.

      2 Keuringen worden slechts verricht in een keuringsplaats waarvoor de erkenning geldt.

      3 In de keuringsplaats worden slechts keuringen verricht van voertuigen waarvoor de erkenning voor de betrokken
      keuringsplaats geldt.

      4

      5 Het boekwerk ‘Regelgeving APK’ wordt door de erkenninghouder beschikbaar gesteld aan de keurmeester; de
      erkenninghouder draagt er tevens zorg voor dat de voorgeschreven boekwerken tot en met de laatste wijziging zijn
      bijgewerkt.

      6 Aan een bevoegdheid voertuigen aan een keuring te onderwerpen worden de in de [artikelen 25 tot en met 32][ref1]
      opgenomen voorschriften verbonden.

      7 Aan een erkenning worden de in de [artikelen 15 tot en met 19][ref2] en [24 tot en met 33][ref3] opgenomen
      voorschriften verbonden.


