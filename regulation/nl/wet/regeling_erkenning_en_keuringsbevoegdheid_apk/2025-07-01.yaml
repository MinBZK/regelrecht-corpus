  - number: '12'
    text: |-
      Naast de in [artikel 11][ref1] genoemde apparatuur is, afhankelijk van de groep voertuigen waarvoor de erkenning
      voor de betrokken keuringsplaats wordt aangevraagd, tevens de volgende apparatuur aanwezig die voldoet aan de in
      [artikel 13][ref2] gestelde eisen:

      a. in geval van een aanvraag voor een erkenning voor motorrijtuigen, niet zijnde landbouw- of bosbouwtrekkers:

      1° een koplamptestapparaat;

      2° een pedaalkrachtmeter; deze is niet verplicht in geval van een vóór 1 maart 2000 afgegeven erkenning voor
      het eigen wagenpark en in geval van een erkenning die uitsluitend geldt voor het keuren van voertuigen die zijn
      voorzien van een druklucht-remsysteem;

      3° een universele toerenteller;

      4° een hulpstuk waarmee de speling op de sluiting van 2 inch koppelingsschotels meetbaar gemaakt kan worden;

      b. in geval van een aanvraag voor een erkenning voor voertuigen waarvan de toegestane maximummassa meer bedraagt
      dan 3500 kg:

      1°. twee manometers met slangen en aansluitstukken voor drukmeetpunten alsmede aansluitkoppen voor
      aanhangwagenremsystemen, waarmee de druk in drukluchtremsystemen en in gasveersystemen kan worden gemeten;

      2°. een stalen rei met een lengte van ten minste 0,90 m;

      3°. een hulpstuk waarmee de speling op de sluiting van 2 inch koppelingsschotels meetbaar gemaakt kan worden;

      4°. Een apparaat om LPG-, CNG- of LNG-lekkages op te sporen;

      5°. Een inrichting om de wielophanging te controleren zonder de as op te tillen (spelingsdetector);

      c. in geval van een aanvraag voor een erkenning voor motorrijtuigen met een verbrandingsmotor met compressie-
      ontsteking die niet is voorzien van een roetfilter, niet zijnde landbouw- of bosbouwtrekkers: een roetmeter en
      olietemperatuurmeter;

      d. in geval van een aanvraag voor een erkenning voor motorrijtuigen met een verbrandingsmotor met compressie-
      ontsteking die is voorzien van een roetfilter, niet zijnde landbouw- of bosbouwtrekkers: een deeltjesteller;

      e. in geval van een aanvraag voor een erkenning voor motorrijtuigen die zijn voorzien van een verbrandingsmotor met
      elektrische ontsteking, niet zijnde landbouw- of bosbouwtrekkers: een uitlaatgastester met lambda-bepaling;

      f. in geval van een aanvraag voor een erkenning voor landbouw- en bosbouwtrekkers:

      1°. de apparatuur genoemd in onderdeel a, onder 1° en 2°;

      2°. de apparatuur genoemd in onderdeel b, onder 1°, 2° en 5°;

      3°. een hydraulische manometer met slangen en aansluitstukken voor drukmeetpunten alsmede aansluitkoppen voor
      hydraulische aanhangwagenremsystemen, waarmee de druk in hydraulische remsystemen kan worden gemeten;

      g. in geval van een aanvraag voor een erkenning voor motorrijtuigen waarvan de toegestane maximummassa niet meer
      bedraagt dan 3500 kg: een uitleesapparaat ten behoeve van het uitlezen van het emissiegerelateerd diagnostisch
      boordsysteem;

      h. in geval van een aanvraag voor een erkenning voor motorrijtuigen waarvan de toegestane maximummassa niet meer
      bedraagt dan 3.500 kg: een apparaat om verbinding te maken met de elektronische voertuiginterface, ten behoeve van
      het uitlezen van de werkelijke gegevens en het voertuigidentificatienummer.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel13
