  - number: 17b
    text: |-
      1 Het voertuigidentificatienummer en de werkelijke gegevens van voor de verbruiksmonitoring uit te lezen
      personenauto’s en lichte bedrijfsvoertuigen worden uitgelezen en verstrekt aan de Dienst Wegverkeer, tenzij:

      1°. de eigenaar of houder van het voertuig uitdrukkelijk heeft geweigerd deze gegevens beschikbaar te stellen; of

      2°. het beschikbaar stellen van deze gegevens niet mogelijk is vanwege een technische reden.

      2 Het uitlezen en verstrekken van het voertuigidentificatienummer en de werkelijke gegevens vindt plaats gedurende
      een periode van maximaal 15 jaar en vangt aan vanaf de datum waarop de werkelijke gegevens voor het eerst aan het
      Europees Milieuagentschap worden gerapporteerd.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel17b
  - number: '18'
    text: |-
      1 Van het steekproefcontrolerapport wordt ten minste gedurende twee jaar een afschrift bewaard. Op dit afschrift
      worden geen wijzigingen aangebracht.

      2 Gedurende de in het eerste lid bedoelde termijn worden de genoemde bescheiden en de controlelijsten desgevraagd
      onverwijld aan een functionaris van de Dienst Wegverkeer ter inzage gegeven of ter inzage opgestuurd.

      3 De erkenninghouder draagt er zorg voor dat de aan hem ten behoeve van datacommunicatie verstrekte code niet
      toegankelijk is voor onbevoegden.

      4 Het boekwerk ‘Regelgeving APK’ alsmede de vereiste certificaten en handleidingen zijn goed geordend aanwezig.

      5 De erkenninghouder vermeldt op de factuur bij afgifte van een keuringsrapport het door hem in gevolge van
      [artikel 86, zesde lid, van de wet][ref1] aan de Dienst Wegverkeer verschuldigde tarief.

      6 Foutief ingevulde of onbruikbaar geworden afdrukken van keuringsrapporten worden vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel86
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '86'
  - number: '19'
    text: |-
      1 Indien zich wijzigingen voordoen in de samenstelling van de economische eenheid als bedoeld in [artikel 6][ref1]
      worden deze door de erkenninghouder schriftelijk aan de Dienst Wegverkeer gemeld.

      2 Indien zich een wijziging voordoet van de natuurlijke persoon, de rechtspersoon of de rechtsvorm, zijn zowel
      de natuurlijke persoon of rechtspersoon aan wie de erkenning oorspronkelijk was verleend, als degene die de
      bedrijfsvoering voortzet, verplicht de Dienst Wegverkeer hiervan zo spoedig mogelijk schriftelijk in kennis te
      stellen.

      3 Indien als gevolg van een wijziging als bedoeld in het voorgaande lid de bedrijfsvoering van de natuurlijke
      persoon, de rechtspersoon of de rechtsvorm waaraan een erkenning APK, is verleend, wordt voortgezet door een andere
      natuurlijke persoon of rechtspersoon, worden de toegekende bonus- en strafpunten van het systeem als bedoeld in
      [artikel 37][ref2] beschouwd als te zijn toegekend aan deze natuurlijke persoon of rechtspersoon.

      4 Indien als gevolg van een wijziging als bedoeld in het tweede lid de bedrijfsvoering van de natuurlijke
      persoon, de rechtspersoon of de rechtsvorm waaraan een erkenning APK is verleend, wordt voortgezet door een
      andere natuurlijke persoon of rechtspersoon, worden de opgelegde sancties beschouwd als te zijn toegekend aan deze
      natuurlijke persoon of rechtspersoon.

      5 Wijziging en uitbreiding van een erkenning is niet mogelijk indien de erkenning op grond van
      [artikel 87, tweede lid, van de wet][ref3] is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel87
