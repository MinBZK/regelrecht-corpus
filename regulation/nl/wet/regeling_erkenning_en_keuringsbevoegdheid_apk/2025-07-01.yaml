        artikel: '30'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '22'
    text: |-
      1 Nadat de bevoegdheid voertuigen aan een keuring te onderwerpen is verleend, wordt onverminderd het bepaalde in
      het derde lid en in de [artikelen 44 tot en met 46][ref1] door de keurmeester iedere twee jaar een toets bij de in
      [artikel 20][ref2] genoemde instelling afgelegd.

      2 De toets wordt afgenomen overeenkomstig een door de in het eerste lid bedoelde instelling vastgesteld en een door
      de Dienst Wegverkeer goedgekeurd reglement.

      3 Afhankelijk van het resultaat van de toets bedoeld in het eerste lid, wordt de bevoegdheid voertuigen aan een
      keuring te onderwerpen met twee jaar verlengd of niet verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel20
