  - number: '13'
    text: |-
      1 Ten aanzien van roetmeters, deeltjestellers, manometers, pedaalkrachtmeters, rollenremtestbanken,
      platenremtestbanken, remvertragingsmeters en uitlaatgastesters met lambda-bepaling, beschikt de aanvrager van een
      erkenning over:

      a. een geldig certificaat van eerste keuring als bedoeld in [artikel 8.1.1 van de Regeling voertuigen][ref1]
      dan wel, in geval van uitlaatgasters met lambda-bepaling, de documenten als bedoeld in
      [artikel 8.1.4, onder b, van de Regeling voertuigen][ref2]; of

      b. een geldig certificaat van herkeuring als bedoeld in [artikel 8.1.1 van de Regeling voertuigen][ref3]
      dan wel, in geval van uitlaatgasters met lambda-bepaling, een geldig certificaat van herkeuring
      als bedoeld in artikel 8.1.1 van de Regeling voertuigen indien de documenten als bedoeld in
      [artikel 8.1.4, onder b, van de Regeling voertuigen][ref4] langer dan twaalf maanden geleden zijn afgegeven.

      2 Het certificaat van eerste keuring en het certificaat van herkeuring zijn afgegeven door een keuringsinstelling
      dan wel een onderzoeksgerechtigde.

      3 Ten aanzien van de in het eerste lid genoemde meetmiddelen beschikt de aanvrager van een erkenning over een
      handleiding in de Nederlandse taal als bedoeld in [artikel 8.3.6 van de Regeling voertuigen][ref5].

      4 Een koplamptestapparaat voldoet aan artikel [8.4.110 van de Regeling voertuigen][ref6] en is voorzien van
      een handleiding in de Nederlandse taal, waarin ten minste vermeld is een procedure voor het gebruik van het
      koplamptestapparaat.

      5 De in [artikel 8, derde lid, onderdeel a][ref7], bedoelde afzuiginstallatie ten behoeve van de roetmeting is
      voorzien van een goedkeuring, afgegeven door een keuringsinstelling.

      6 Een niet in de roetmeter geïntegreerde toerenteller voldoet aan [artikelen 8.4.15][ref8] en
      [8.4.16 van de Regeling voertuigen][ref9] en is voorzien van:

      a. een CE-markering met een aanvullende metrologische markering, en

      b. een handleiding in de Nederlandse taal, waarin tenminste vermeld is een procedure voor het gebruik van de
      toerenteller.

      7 Een olietemperatuurmeter voldoet aan [artikelen 8.4.20][ref10], [8.4.21][ref11] en
      [8.4.22 van de Regeling voertuigen][ref12] en is voorzien van:

      a. een CE-markering met een aanvullende metrologische markering, voor zover het een elektronische
      olietemperatuurmeter betreft, en

      b. een handleiding in de Nederlandse taal, waarin tenminste vermeld is een procedure voor het gebruik van de
      olietemperatuurmeter.

      8 Een uitleesapparaat ten behoeve van het uitlezen van het emissiegerelateerd diagnostisch boordsysteem moet:

      a. over een ISO-15031-3 connector (16-polige stekker) beschikken;

      b. kunnen communiceren met het in het voertuig aanwezige emissiegerelateerd diagnostisch boordsysteem en minimaal
      de modus 03 ondersteunen;

      c. de volgende protocollen ondersteunen:

        - ISO 9141-2,
        - ISO/DIS 11519-4 PWM dan wel SAE J1850 PWM,
        - ISO/DIS 11519-4 VPW dan wel SAE J1850 VPW,
        - ISO/DIS 14230-4, en
        - ISO/DIS 15765-4;

      d. de status van de in het voertuig aanwezige waarschuwingsinrichting (MIL) kunnen weergeven;

      e. de status van de readiness-test kunnen weergeven;

      f. de aanwezige fouten in de in ISO 15031-6 vastgestelde codering kunnen weergeven;

      g. voorzien zijn van CE-markering;

      h. voorzien zijn van een handleiding in de Nederlandse taal waarin ook de ondersteunde communicatieprotocollen zijn
      beschreven. Indien de communicatieprotocollen niet zijn beschreven in de handleiding mogen deze zijn beschreven in
      een bij het uitleesapparaat behorende fabrikantenverklaring.

      9 Een spelingsdetector is uitgerust met twee elektrisch bediende platen, die in tegenovergestelde richting kunnen
      bewegen, zowel in de lengte- als in de dwarsrichting, waarvan:

      1°. de beweging door de bediener vanuit de controlepositie kan worden beheerst,

      2°. de bewegingsruimte in de lengte- en in de dwarsrichting ten minste 95 mm is,

      3°. bewegingssnelheid in de lengte- en in de dwarsrichting 5 tot 15 cm/s bedraagt.

      10 Een apparaat om verbinding te maken met de elektronische voertuiginterface zoals bedoeld in
      [artikel 12, onderdeel h][ref13]:

      a. beschikt over een ISO-15031-3 connector (16-polige stekker);

      b. is voorzien van CE-markering;

      c. is voorzien van een handleiding in de Nederlandse taal;

      d. kan verbinding maken met het door de Dienst Wegverkeer opgegeven protocol benodigd voor de overdracht van de
      uitgelezen werkelijke gegevens en het voertuigidentificatienummer.


