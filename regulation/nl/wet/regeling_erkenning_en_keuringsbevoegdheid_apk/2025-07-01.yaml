  - number: '35'
    text: |-
      1 Nadat een erkenning is verleend, wordt in het kader van het toezicht onderzocht of de erkenninghouder en de
      keuringsplaats nog voldoen aan de erkenningseisen en of de erkenningsvoorschriften worden nageleefd.

      2 Het in het eerste lid bedoelde toezicht kan tevens plaatsvinden in het kader van een steekproef van het voertuig.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel35
  - number: '36'
    text: |-
      Onverminderd het bepaalde in [artikel 31][ref1], wordt in het kader van het toezicht alle medewerking aan de
      daartoe aangewezen functionarissen van de Dienst Wegverkeer verleend. Hieronder wordt in ieder geval verstaan:

      a. het verlenen van toegang tot de keuringsplaats;

      b. het verstrekken van inlichtingen;

      c. het overleggen van bescheiden;

      d. het gebruik maken van de benodigde apparatuur;

      e. het in acht nemen van door de betreffende functionaris van de Dienst Wegverkeer aangegeven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel31
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '37'
    text: |-
      1 De Dienst Wegverkeer kan in het kader van het toezicht op de erkenninghouder of de keurmeester een systeem van
      bonus- en strafpunten vaststellen, dat wordt bekendgemaakt in de Staatscourant.

      2 Indien een systeem als bedoeld in het eerste lid is vastgesteld, wordt aan de hand daarvan, afhankelijk van de
      resultaten van het uitgeoefende toezicht, beoordeeld of het toezicht wordt verminderd of verscherpt dan wel of een
      erkenning of een keuringsbevoegdheid wordt gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel37
  - number: '38'
    text: |-
      De in deze paragraaf bepaalde eisen zijn, voor zover niet anders bepaald, tevens van toepassing op het toezicht
      op mobiele keuringseenheden en de inrichtingen waar met behulp van deze mobiele keuringseenheden keuringen worden
      verricht.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel38
  - number: '39'
    text: |-
      1 Deze paragraaf laat onverlet de bevoegdheid tot wijziging, schorsing of intrekking van de erkenning als
      omschreven in [artikel 87, van de wet][ref1], in andere gevallen dan die in deze paragraaf zijn beschreven.

      2 Een wijziging, schorsing of intrekking van een erkenning als bedoeld in
      [artikel 87, tweede lid, van de wet][ref2], geldt in beginsel uitsluitend voor de betrokken keuringsplaats.

      3 In afwijking van het tweede lid kan de Dienst Wegverkeer, als omstandigheden daartoe aanleiding geven, bepalen
      dat een wijziging, schorsing of intrekking alle keuringsplaatsen betreft waarvoor de erkenning geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel87
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '87'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '87'
  - number: '40'
    text: |-
      Bij schorsing van een erkenning kan worden bepaald dat, indien niet binnen een termijn van ten hoogste 12 weken
      wordt aangetoond dat weer aan de erkenningseisen of erkenningsvoorschriften wordt voldaan, alsnog wijziging of
      intrekking van de erkenning volgt.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel40
  - number: '41'
    text: |-
      Indien de in de [artikelen 25 tot en met 32][ref1] neergelegde verplichtingen of voorschriften niet worden
      nageleefd, wordt terstond begonnen met een procedure voor intrekking van de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel25
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '42'
    text: |-
      De in [artikel 87 van de wet][ref1], bedoelde wijziging, schorsing of intrekking van de erkenning kan, indien de
      erkenningseis of het erkenningsvoorschrift waaraan niet wordt voldaan slechts betrekking heeft op het keuren van
      een bepaalde groep voertuigen, beperkt blijven tot het keuren van die desbetreffende groep voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '87'
  - number: '44'
    text: |-
      De in [artikel 87a van de wet][ref1] bedoelde intrekking van de bevoegdheid voertuigen aan een keuring te
      onderwerpen kan, indien de keuringsbevoegdheidseis, het keuringsbevoegdheidsvoorschrift of het keuringsvoorschrift
      waaraan niet wordt voldaan slechts betrekking heeft op het keuren van een bepaalde groep voertuigen, beperkt worden
      tot het keuren van die desbetreffende groep voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87a
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 87a
  - number: '45'
    text: |-
      1 Indien er sprake is van een situatie waarin aan een of meer keuringsbevoegdheidseisen,
      keuringsbevoegdheidsvoorschriften of keuringsvoorschriften niet wordt voldaan, terwijl die situatie op korte
      termijn kan worden hersteld, kan, in plaats van intrekking van de bevoegdheid voertuigen aan een keuring te
      onderwerpen, overgegaan worden tot schorsing van de bevoegdheid voertuigen aan een keuring te onderwerpen voor een
      termijn van ten hoogste twaalf weken.

      2 Wordt binnen de in het eerste lid genoemde termijn niet aangetoond dat wederom aan de keuringsbevoegdheidseisen,
      keuringsbevoegdheidsvoorschriften of keuringsvoorschriften wordt voldaan, dan volgt alsnog intrekking van de
      bevoegdheid voertuigen aan een keuring te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel45
  - number: '46'
    text: |-
      Indien door de keurmeester de in de [artikelen 25 tot en met 32][ref1] neergelegde verplichtingen of voorschriften
      niet worden nageleefd, wordt terstond begonnen met een procedure voor intrekking van de bevoegdheid voertuigen aan
      een keuring te onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel25
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '47'
    text: |-
      Erkenningen en bevoegdheden die zijn verleend krachtens de [Erkenningsregeling APK][ref1], zoals die regeling
      luidde voor de inwerkingtreding van deze regeling, worden gelijkgesteld met erkenningen en bevoegdheden die zijn
      verleend krachtens deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011158
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011158
  - number: '48'
    text: |-
      Deze regeling treedt in werking op het tijdstip dat het
      [Besluit voertuigen][ref1] in werking treedt, met uitzondering van
      __REF001___________________________________________________________________________________________________________
      ________________________________________, dat in werking treedt op 1 januari 2010.


