  - number: '17'
    text: |-
      1 Ten aanzien van roetmeters, deeltjestellers, toerentellers, olietemperatuurmeters, manometers,
      pedaalkrachtmeters, rollenremtestbanken, platenremtestbanken, remvertragingsmeters, uitlaatgastesters met lambda-
      bepaling en uitleesapparaten ten behoeve van het uitlezen van het emissiegerelateerd diagnostisch boordsysteem zijn
      steeds aanwezig de documenten en markeringen als bedoeld in [artikel 13][ref1] van deze regeling.

      2 Ten aanzien van de in [artikel 8, derde lid, onderdeel a][ref2], bedoelde afzuiginstallatie ten behoeve van de
      roetmeting is steeds een geldig certificaat van goedkeuring aanwezig.

      3 Na verwijdering van de rollenremtestbank of de platenremtestbank van zijn fundering waaraan hij was bevestigd
      teneinde te worden herplaatst op dezelfde plaats of een andere plaats, wordt wederom een certificaat van eerste
      keuring dan wel herkeuring afgegeven en is de verzegeling aan de fundering aangebracht.

      4 Na verplaatsing van de nulemissie-eenheid naar een andere keuringsplaats, moet wederom een certificaat van eerste
      keuring, dan wel herkeuring worden afgegeven.

      5 Wijzigingen ten aanzien van de in het eerste en tweede lid genoemde apparatuur en ten aanzien van de afgifte
      van een certificaat van herkeuring of goedkeuring worden via de datacommunicatie terstond gemeld aan de Dienst
      Wegverkeer.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel8
