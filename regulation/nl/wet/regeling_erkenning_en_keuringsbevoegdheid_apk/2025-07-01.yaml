      1 De keuring wordt verricht in een keuringsruimte met apparatuur die aan de in de [artikelen 7][ref1],
      [9][ref2], [9a][ref3], [11][ref4], [12][ref5], [13][ref6] en indien van toepassing
      [artikel 27, zesde, zevende en achtste lid][ref7] gestelde eisen voldoet. Van deze eis kan worden afgeweken indien
      volgens de wijze van keuren zoals vermeld in [hoofdstuk 5 van de Regeling voertuigen][ref8] een rij- of remproef
      buiten de keuringsruimte wordt uitgevoerd, mits de buitentemperatuur binnen het temperatuurgebied van de verplichte
      apparatuur ligt.

      2 Bij de keuring wordt het voertuig tevens gecontroleerd aan de hand van de in [bijlage 1][ref9] opgenomen
      reparatieadviespunten.

      3 De keuring wordt verricht door een keurmeester.


