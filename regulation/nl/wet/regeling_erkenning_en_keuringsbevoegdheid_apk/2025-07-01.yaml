        artikel: '27'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '32'
    text: |-
      1 Indien de eigenaar of houder van het voertuig dat aan een steekproef wordt onderworpen met het voertuig wegrijdt,
      wordt dit onverwijld door de keurmeester aan de Dienst Wegverkeer gemeld. De eventuele goedkeuring wordt door de
      Dienst Wegverkeer ingetrokken en het voertuig kan niet meer worden afgemeld.

      2 De erkenninghouder draagt er zorg voor dat de eigenaar of houder van een weggereden voertuig op de hoogte is
      gesteld van de verplichting om een nieuwe aanvraag van een keuringsrapport bij de Dienst Wegverkeer in te dienen.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel32
  - number: '33'
    text: |-
      De Dienst Wegverkeer voert steekproefsgewijs anonieme keuringen uit door middel van het ter keuring aanbieden van
      een voertuig in het kader van het toezicht op de erkenning en het verrichten van keuringen. Wanneer blijkt dat:

      a. de keuring niet in de keuringsplaats wordt uitgevoerd;

      b. de keuring niet met de vereiste apparatuur wordt uitgevoerd;

      c. de keuring niet door een persoon die bevoegd is voertuigen aan een keuring te onderwerpen wordt uitgevoerd, of

      d. het resultaat van de keuring niet aan de Dienst Wegverkeer wordt gemeld;

      wordt terstond begonnen met een procedure tot intrekking van de erkenning en keuringsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel33
  - number: '34'
    text: |-
      1 Het in [artikel 86 van de wet][ref1] bedoelde toezicht geschiedt met inachtneming van de in [paragraaf 2][ref2]
      daaromtrent gegeven voorschriften.

      2 Het in [artikel 86a van de wet][ref3] bedoelde toezicht geschiedt met inachtneming van de in [paragraaf 3][ref4]
      daaromtrent gegeven voorschriften.


