  - number: '23'
    text: |-
      De aanvrager van de bevoegdheid voertuigen aan een keuring te onderwerpen overlegt de volgende bescheiden:

      a. een afschrift van de in de [artikel 20][ref1] genoemde diploma’s;

      b. indien van toepassing een afschrift van het resultaat van de toets als bedoeld in [artikel 22][ref2].


