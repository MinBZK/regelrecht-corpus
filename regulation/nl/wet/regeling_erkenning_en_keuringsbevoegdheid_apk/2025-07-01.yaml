  - number: '26'
    text: |-
      1 Op verzoek van de aanvrager van een keuringsrapport wordt de bevoegdheidspas ter inzage gegeven.

      2 De keurmeester draagt er zorg voor dat de aan hem ten behoeve van datacommunicatie verstrekte pincode niet
      toegankelijk is voor anderen.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel26
  - number: '27'
    text: |-
      1 Indien bij de erkenninghouder een keuringsrapport wordt aangevraagd, stelt deze, na overleg met de aanvrager,
      onverwijld het tijdstip voor de keuring vast. De keuring vindt zo spoedig mogelijk na de aanvraag plaats.

      2 Er wordt geen keuring verricht dan nadat door de aanvrager het goedkeuringsdocument als bedoeld in
      [artikel 3.15, tweede en derde lid, van de Regeling voertuigen][ref1] is overgelegd, indien in het kentekenregister
      of op het kentekenbewijs bij bijzonderheden is vermeld ‘Taxi, zie goedkeuringsdocument’ of ’OV-auto, zie
      goedkeuringsdocument’.

      3 Er wordt geen keuring verricht dan nadat het kentekenregister is geraadpleegd ten aanzien van:

      a. het voor het voertuig opgegeven kenteken;

      b. het identificatienummer van het ter keuring aangeboden voertuig, en

      c. de datum eerste toelating van het voertuig.

      4 Er wordt geen keuring verricht en de aanvrager van een keuringsrapport wordt naar de Dienst Wegverkeer
      doorverwezen indien:

      a. het raadplegen van het kentekenregister niet mogelijk is door een onjuiste combinatie van het kenteken
      en de laatste vier posities van het voertuigidentificatienummer of indien de laatste vier posities van het
      voertuigidentificatienummer niet bekend zijn;

      b. het voertuigidentificatienummer van het voertuig niet in overeenstemming is met het kentekenregister;

      c. blijkens het kentekenregister de beperkte inschrijvingsduur van de tenaamstelling verstreken is, waardoor de
      tenaamstelling ingevolge [artikel 51a, vijfde lid, van de wet][ref2], is vervallen.

      5 Er wordt geen keuring verricht dan nadat door de aanvrager de voor het voertuig afgegeven kentekencard, dan wel
      het kentekenbewijs is overgelegd, indien het voertuig is voorzien van een kenteken bevattende de lettergroep AA,
      CD, CDJ dan wel de lettergroep BN of GN en twee groepen van twee cijfers.

      6 In geval van een aanvraag voor een keuringsrapport voor voertuigen waarbij het om technische redenen als
      bedoeld in artikel 57, vijfde lid, van [bijlage VIII van de Regeling voertuigen][ref3], niet mogelijk is het
      voertuig op een rollenremtestbank of platenremtestbank te remmen, dient een deugdelijke, goed functionerende
      remvertragingsmeter in de keuringsruimte aanwezig te zijn, waarvoor een geldig certificaat van eerste keuring of
      herkeuring als bedoeld in [artikel 8.1.1 van de Regeling voertuigen][ref4] is afgegeven.

      7 Indien het te keuren motorrijtuig een bedrijfsauto is waarvan de toegestane maximummassa niet meer bedraagt
      dan 3.500 kg die is voorzien van een drukluchtremsysteem en een vangmuilkoppeling ten behoeve van een
      aanhangwagen dienen twee manometers met slangen en aansluitstukken voor drukmeetpunten alsmede aansluitkoppen
      voor aanhangwagenremsystemen in de keuringsruimte aanwezig te zijn, waarmee de druk in drukluchtremsystemen en
      in gasveersystemen kan worden gemeten, voorzien van een geldig certificaat van eerste keuring of herkeuring als
      bedoeld in [artikel 8.1.1 van de Regeling voertuigen][ref5].

      8 Indien het te keuren motorrijtuig een bedrijfsauto is waarvan de toegestane maximummassa niet meer bedraagt
      dan 3.500 kg die is voorzien van een drukluchtremsysteem en een schotelkoppeling ten behoeve van een aanhangwagen
      dienen in de keuringsruimte aanwezig te zijn:

      1°. twee manometers met slangen en aansluitstukken voor drukmeetpunten alsmede aansluitkoppen
      voor aanhangwagenremsystemen, waarmee de druk in drukluchtremsystemen en in gasveersystemen kan
      worden gemeten, voorzien van een geldig certificaat van eerste keuring of herkeuring als bedoeld in
      [artikel 8.1.1 van de Regeling voertuigen][ref6];

      2°. een stalen rei met een lengte van ten minste 0,90 m; en

      3°. een hulpstuk waarmee de speling op de sluiting van 2 inch koppelingsschotels meetbaar gemaakt kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel3.15
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0025798
