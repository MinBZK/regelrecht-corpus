  - number: 19a
    text: Als exameninstantie wordt aangewezen de Stichting VAM (IBKI) te Nieuwegein.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel19a
  - number: 19b
    text: |-
      De exameninstantie voldoet aan de volgende eisen:

      a. de exameninstantie is onafhankelijk en onpartijdig en neemt bij de uitvoering van de werkzaamheden het
      examenreglement in acht;

      b. de exameninstantie neemt afdoende maatregelen om fraude, voor, tijdens en na het examen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel19b
  - number: 19c
    text: |-
      1 De exameninstantie is belast met:

      a. het afnemen van het examen voor het diploma keurmeester periodieke keuring zware (bedrijfs)voertuigen;

      b. het afnemen van het examen voor het diploma keurmeester periodieke keuring lichte voertuigen;

      c. het afnemen van het examen voor het diploma keurmeester periodieke keuring landbouw- en bosbouwtrekkers;

      d. het afnemen van het examen ter verlenging van de bevoegdheid tot keuren van zware (bedrijfs)voertuigen;

      e. het afnemen van het examen ter verlenging van de bevoegdheid tot keuren van lichte voertuigen;

      f. het afnemen van het examen ter verlenging van de bevoegdheid tot keuren van landbouw- en bosbouwtrekkers;

      g. het afnemen van het examen ter verlenging van de bevoegdheid in de gevallen genoemd in de
      [artikelen 44 tot en met 46][ref1];

      h. de vaststelling van de tarieven voor de activiteiten, bedoeld in de onderdelen a tot en met g.

      2 De exameninstantie is verder met betrekking tot het organiseren en afnemen van de examens, bedoeld in het eerste
      lid, belast met:

      a. het geven van voorlichting en bekendheid aan het examen;

      b. het vaststellen van de examendatum, het tijdstip en de plaats;

      c. het toezenden van de uitnodiging voor de deelname aan het examen;

      d. het factureren van de tarieven, bedoeld in het eerste lid, onderdeel h, aan een deelnemer, en

      e. het registreren van individuele en algemene resultaten van de examens als bedoeld in het eerste lid, onderdelen
      a tot en met g.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel44
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '44'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '20'
    text: |-
      1 De bevoegdheid voertuigen met een toegestane maximummassa hoger dan 3.500 kg, voertuigen met een toegestane
      maximummassa niet hoger dan 3.500 kg of landbouw- en bosbouwtrekkers aan een keuring te onderwerpen kan worden
      verleend aan een natuurlijk persoon die in het bezit is van een, mede door een door de Dienst Wegverkeer
      aangewezen gecommitteerde ondertekend, diploma keurmeester periodieke keuring zware (bedrijfs)voertuigen, diploma
      keurmeester periodieke keuring lichte voertuigen respectievelijk diploma keurmeester periodieke keuring landbouw-
      en bosbouwtrekkers dat is afgegeven door de Stichting VAM, nadat het examen met goed gevolg bij deze instelling
      is afgelegd.

      2 De Dienst Wegverkeer bepaalt aan welke voorwaarden wordt voldaan alvorens deelgenomen kan worden aan het examen
      keurmeester periodieke keuring zware (bedrijfs)voertuigen, het examen keurmeester periodieke keuring lichte
      voertuigen of het examen keurmeester periodieke keuring landbouw- en bosbouwtrekkers. Deze voorwaarden worden in de
      Staatscourant bekendgemaakt.

      3 Het examen wordt afgenomen overeenkomstig een door de Stichting VAM vastgesteld en door de Dienst Wegverkeer
      goedgekeurd reglement.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel20
  - number: '21'
    text: |-
      1 Ten bewijze van de bevoegdheid voertuigen aan een keuring te onderwerpen wordt aan de keurmeester een
      bevoegdheidspas overeenkomstig een door de Dienst Wegverkeer vastgesteld model verstrekt. Op de bevoegdheidspas
      worden ten minste het pasnummer, het diplomanummer en de groep van voertuigen genoemd waarvoor de bevoegdheid
      voertuigen aan een keuring te onderwerpen geldt alsmede de geldigheidsduur van de pas.

      2 Ten behoeve van het afmelden van een voertuig als bedoeld in [artikel 30][ref1] door middel van datacommunicatie,
      wordt aan de keurmeester een pincode verstrekt. Deze pincode is strikt persoonlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel30
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel21
