  - number: '3'
    text: |-
      De aanvraag van een erkenning wordt met inachtneming van de door de Dienst Wegverkeer vastgestelde voorschriften
      ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel3
  - number: '4'
    text: |-
      1 Een erkenning APK kan worden verleend aan een natuurlijk persoon of rechtspersoon voor één of meer in Nederland
      gevestigde keuringsplaatsen.

      2 Een erkenning APK kan op aanvraag worden verleend indien wordt voldaan aan de in [hoofdstuk 3][ref1] gestelde
      erkenningseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025735
        hoofdstuk: '3'
  - number: '6'
    text: |-
      1 Indien de aanvrager van een erkenning APK exploitant is van een keurings- of onderhoudsdienst voor het eigen
      wagenpark, kan de erkenning op verzoek van de aanvrager worden beperkt tot dat eigen wagenpark.

      2 Indien de erkenning wordt verleend voor het eigen wagenpark en een andere rechtspersoon of andere rechtspersonen
      in een zodanig verband tot de erkenninghouder staan dat er sprake is van één economische eenheid, kunnen alle
      voertuigen van de desbetreffende economische eenheid worden beschouwd als voertuigen van het eigen wagenpark.

      3 Indien de erkenning wordt verleend voor het eigen wagenpark en een andere rechtspersoon of andere rechtspersonen
      in een zodanig verband tot de erkenninghouder staat of staan dat er sprake is van één economische eenheid, doet de
      exploitant onder opgave van de naam en het adres van die rechtspersoon of rechtspersonen, terstond na de verlening
      van de erkenning schriftelijk opgave hiervan aan de Dienst Wegverkeer. Het verband moet ten genoege van de Dienst
      Wegverkeer worden aangetoond door middel van een uittreksel uit het register van de Kamer van Koophandel of een
      accountantsverklaring.

      4 Gezamenlijk gebruik van een keuringsplaats door meerdere erkenninghouders is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel6
  - number: '7'
    text: |-
      Indien de erkenning voor de betrokken keuringsplaats wordt aangevraagd, is in deze keuringsplaats tenminste één
      keurmeester werkzaam die bevoegd is de voertuigen aan een keuring te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel7
  - number: '8'
    text: |-
      1 De keuringsruimte is overdekt, behoorlijk af te sluiten, goed verlicht en voorzien van een vlakke vloer en
      verwarming.

      2 De keuringsruimte heeft zodanige afmetingen en is zodanig ingericht dat de voertuigen die behoren tot de groep
      waarvoor de erkenning voor de betrokken keuringsplaats wordt aangevraagd, in deze ruimte zodanig kunnen worden
      opgesteld dat zij van alle zijden goed toegankelijk zijn.

      3 In de keuringsruimte:

      a. bestemd voor het keuren van motorrijtuigen met een verbrandingsmotor met een elektrische ontsteking en
      motorrijtuigen met een verbrandingsmotor met een compressie-ontsteking die is voorzien van een roetfilter, is
      een voorziening aanwezig waarmee uitlaatgassen direct door een daartoe bestemde opening naar buiten kunnen worden
      gevoerd;

      b. bestemd voor het keuren van motorrijtuigen met een verbrandingsmotor met compressie-ontsteking die niet is
      voorzien van een roetfilter, is een voorziening aanwezig die bestaat uit:

      1°. een afzuigventilator met voldoende capaciteit voor de te keuren voertuigen;

      2°. een afvoersysteem dat voorkomt dat uitlaatgassen in de werkplaats terecht kunnen komen;

      3°. een systeem dat ervoor zorgt dat de uitlaatgassen die door de roetmeter gaan eveneens worden afgevoerd, en

      4°. afvoerkanalen die bovenstaande onderdelen met elkaar verbinden waardoor de uitlaatgassen direct naar buiten
      worden afgevoerd.

      4 In afwijking van het derde lid, onderdeel b, is in de keuringsruimte die uitsluitend is bestemd voor de keuring
      van landbouw- of bosbouwtrekkers een voorziening aanwezig waarmee uitlaatgassen direct door een daartoe bestemde
      opening naar buiten kunnen worden gevoerd.

      5 In de keuringsruimte kan de administratie van de keuringen behoorlijk worden uitgevoerd.

      6 In de keuringsruimte is een voorziening aanwezig, geschikt voor het gebruik van datacommunicatie ten
      behoeve van het raadplegen van het kentekenregister, het afmelden van voertuigen en het bewaren van
      steekproefcontrolerapporten. Deze voorziening bestaat uit een computer of terminal met een modem, geschikt voor
      de toegangsstructuur van door de Dienst Wegverkeer geaccepteerde netwerken. Tevens is een voorziening aanwezig,
      geschikt voor aansluiting op de datacommunicatie, ten behoeve van het afdrukken van keuringsrapporten.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel8
  - number: '9'
    text: |-
      1 In de keuringsruimte is een doelmatige inspectieput of hefinrichting aanwezig die geschikt is voor de groep
      voertuigen waarvoor de erkenning voor de betrokken keuringsplaats wordt aangevraagd en die is voorzien van een
      doelmatige verlichting. Wanneer niet duidelijk blijkt wat het draagvermogen van een hefinrichting is, wordt
      hiervoor door de fabrikant of een onafhankelijk instituut een verklaring overgelegd. Het draagvermogen wordt
      zichtbaar op de hefinrichting aangebracht.

      2 De inspectieput en de hefinrichting zijn zodanig uitgevoerd dat de keurmeester in staat is de onderkant van een
      voertuig nagenoeg over de hele lengte rechtopstaand te inspecteren, hetgeen betekent dat wanneer de erkenning wordt
      aangevraagd voor:

      a. voertuigen waarvan de toegestane maximummassa meer bedraagt dan 3500 kg, de hefinrichting een hefhoogte heeft
      van ten minste 1,35 m;

      b. voertuigen waarvan de toegestane maximummassa meer bedraagt dan 3500 kg, de inspectieput een diepte heeft van
      ten minste 1,35 m;

      c. voertuigen waarvan de toegestane maximummassa niet meer bedraagt dan 3500 kg, de hefinrichting een hefhoogte
      heeft van ten minste 1,65 m;

      d. voertuigen waarvan de toegestane maximummassa niet meer bedraagt dan 3500 kg, de inspectieput een diepte heeft
      van ten minste 1,55 m.

      3 De hefinrichting kan ten minste vier wielen van het voertuig ondersteunen. Een met steunpoten gecombineerde
      hefinrichting voldoet niet aan deze eis.

      4 De hefinrichting moet deugdelijk zijn en in een goede staat van onderhoud verkeren.

      5 In geval van een aanvraag van een erkenning voor de keuring van motorrijtuigen is ten behoeve van de controle van
      de afstelling van dimlichten en mistvoorlichten een aangewezen plaats aanwezig, waarbij het volgende van toepassing
      is:

      a. de locatie waar de afstelling van de lichten gecontroleerd wordt, moet duidelijk gemarkeerd zijn in de
      keuringsruimte. Deze locatie moe t voldoen aan de volgende voorschriften:

      1°. een horizontale vlakke vloer van voldoende afmetingen waarop gelijktijdig zowel het te keuren voertuig als het
      koplamptestapparaat kan worden geplaatst; of

      2°. een horizontaal geplaatste hefinrichting waarop gelijktijdig het koplamptestapparaat en het te keuren voertuig
      kan worden geplaatst; of

      3°. een horizontaal geplaatste hefinrichting waarop het te keuren voertuig kan worden geplaatst met voor de
      hefinrichting een horizontale vlakke vloer of rails. De vloer of de rails moeten zich in hetzelfde horizontale vlak
      als de hefinrichting bevinden. De rails moeten zich haaks op de rijplaten van de hefinrichting bevinden.

      b. Indien het koplamptestapparaat ontworpen is voor uitsluitend gebruik op rails moeten deze rails aanwezig zijn en
      zich in hetzelfde horizontale vlak als de vloer of hefinrichting bevinden.

      6 In afwijking van het eerste lid, eerste zin, hoeft geen inspectieput of hefinrichting aanwezig te zijn in
      de keuringsruimte die uitsluitend wordt gebruikt voor de keuring van landbouw- of bosbouwtrekkers. Indien een
      inspectieput of hefinrichting aanwezig is, zijn het eerste tot en met derde en vijfde lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel9
  - number: 9a
    text: |-
      De keuringsruimte voor de keuring van landbouw- of bosbouwtrekkers is geschikt voor de controle van de afstelling
      van de dimlichten, bedoeld in artikel 113 van [bijlage VIII bij de Regeling voertuigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025798
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0025798
  - number: '11'
    text: |-
      In de keuringsruimte is de volgende apparatuur aanwezig:

      a. een doelmatige krik die voldoende draagvermogen heeft om van de voertuigen van de groep waarvoor de erkenning
      voor de betrokken keuringsplaats wordt aangevraagd, de wielen van de voorste as gelijktijdig en de wielen van de
      achterste as afzonderlijk op zodanige wijze te kunnen heffen, dat deze vrij kunnen draaien;

      b. een dubbel geïsoleerde veiligheidslooplamp dan wel een zaklantaarn, al dan niet voorzien van een oplaadbare
      accu, die enerzijds een zodanige lichtsterkte heeft dat ook moeilijk bereikbare onderdelen van een voertuig
      voldoende helder kunnen worden verlicht om een nauwkeurige inspectie van een voertuig mogelijk te maken en die
      anderzijds zodanig is afgeschermd dat degene die de keuring uitvoert niet door het uitgestraalde licht wordt
      verblind;

      c. een meetband met een minimale nauwkeurigheidsklasse III van ten minste 12,00 m, indien de erkenning wordt
      aangevraagd voor voertuigen waarvan de toegestane maximummassa niet meer bedraagt dan 3500 kg. Indien het een
      erkenning betreft voor voertuigen waarvan de toegestane maximummassa meer bedraagt dan 3.500 kg of voor landbouw-
      of bosbouwtrekkers is de meetband ten minste 20,00 m. Bij erkenningen met een beperking voor de voertuiglengte
      heeft de meetband tenminste dezelfde lengte als de toegestane voertuiglengte;

      d. een doelmatige schuifmaat die is voorzien van een meetstift voor dieptemeting;

      e. basisgereedschap voor de controle op het vastzitten van nagels en bouten en andere verbindingen, te weten
      een set steek- en ringsleutels, schroevendraaiers en een hamer, alsmede een bolkophamertje voor de controle op
      corrosie;

      f. een doelmatige bandenspanningsmeter en een doelmatige bandenpomp;

      g. hulpmiddelen om speling in voertuigonderdelen zichtbaar te maken, zoals een bandijzer, wielbewegingsapparaat of
      een koevoet;

      h. een rollenremtestbank of platenremtestbank, die voldoet aan de in [artikel 13][ref1] gestelde eisen. Indien een
      erkenning wordt aangevraagd voor landbouw- of bosbouwtrekkers is een rollenrembanktest of een zelfregistrerende
      remvertragingsmeter aanwezig. Indien een erkenning wordt aangevraagd voor voertuigen met een toegestane
      maximummassa van meer dan 3500 kg is in elk geval een rollenremtestbank aanwezig. Het draagvermogen van een
      rollenremtestbank of platenremtestbank is voldoende voor de groep voertuigen waarvoor de erkenning voor de
      betrokken keuringsplaats wordt aangevraagd;

      i. een doelmatige bandenprofieldieptemeter, met verende meetstift en een meetnauwkeurigheid van 0,1 mm.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel13
    url: https://wetten.overheid.nl/BWBR0025735/2025-07-01#Artikel11
