  - number: '2'
    text: |-
      De eisen en voorschriften genoemd in deze regeling zijn van toepassing op een vaste keuringsplaats dan wel een
      mobiele keuringseenheid, tenzij anders bepaald.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel2
  - number: '3'
    text: |-
      De aanvraag van een erkenning wordt met inachtneming van de door de Dienst Wegverkeer vastgestelde voorschriften
      ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel3
  - number: '4.1'
    text: |-
      Een erkenning APK kan worden verleend aan een natuurlijk persoon of rechtspersoon voor één of meer in Nederland
      gevestigde keuringsplaatsen.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel4
  - number: '4.2'
    text: |-
      Een erkenning APK kan op aanvraag worden verleend indien wordt voldaan aan de in [hoofdstuk 3][ref1] gestelde
      erkenningseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0025735
        hoofdstuk: '3'
  - number: '6.1'
    text: |-
      Indien de aanvrager van een erkenning APK exploitant is van een keurings- of onderhoudsdienst voor het eigen
      wagenpark, kan de erkenning op verzoek van de aanvrager worden beperkt tot dat eigen wagenpark.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien de erkenning wordt verleend voor het eigen wagenpark en een andere rechtspersoon of andere rechtspersonen
      in een zodanig verband tot de erkenninghouder staan dat er sprake is van één economische eenheid, kunnen alle
      voertuigen van de desbetreffende economische eenheid worden beschouwd als voertuigen van het eigen wagenpark.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel6
  - number: '6.3'
    text: |-
      Indien de erkenning wordt verleend voor het eigen wagenpark en een andere rechtspersoon of andere rechtspersonen
      in een zodanig verband tot de erkenninghouder staat of staan dat er sprake is van één economische eenheid, doet de
      exploitant onder opgave van de naam en het adres van die rechtspersoon of rechtspersonen, terstond na de verlening
      van de erkenning schriftelijk opgave hiervan aan de Dienst Wegverkeer. Het verband moet ten genoege van de Dienst
      Wegverkeer worden aangetoond door middel van een uittreksel uit het register van de Kamer van Koophandel of een
      accountantsverklaring.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel6
  - number: '6.4'
    text: |-
      Gezamenlijk gebruik van een keuringsplaats, een mobiele keuringseenheid of een inrichting door meerdere
      erkenninghouders is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel6
  - number: '7'
    text: |-
      Indien de erkenning voor de betrokken keuringsplaats wordt aangevraagd, is in deze keuringsplaats tenminste één
      keurmeester werkzaam die bevoegd is de voertuigen aan een keuring te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel7
  - number: '8.1'
    text: |-
      De keuringsruimte is overdekt, behoorlijk af te sluiten, goed verlicht en voorzien van een vlakke vloer en
      verwarming.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel8
  - number: '8.2'
    text: |-
      De keuringsruimte heeft zodanige afmetingen en is zodanig ingericht dat de voertuigen die behoren tot de groep
      waarvoor de erkenning voor de betrokken keuringsplaats wordt aangevraagd, in deze ruimte zodanig kunnen worden
      opgesteld dat zij van alle zijden goed toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel8
  - number: '8.3'
    text: 'In de keuringsruimte:'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel8
  - number: 8.3.a
    text: |-
      bestemd voor het keuren van motorrijtuigen met een verbrandingsmotor met een elektrische ontsteking, is een
      voorziening aanwezig waarmee uitlaatgassen direct door een daartoe bestemde opening naar buiten kunnen worden
      gevoerd;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel8
  - number: 8.3.b
    text: |-
      bestemd voor het keuren van motorrijtuigen met een verbrandingsmotor met compressie-ontsteking, is een voorziening
      aanwezig die bestaat uit:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel8
  - number: 8.3.b.1°
    text: een afzuigventilator met voldoende capaciteit voor de te keuren voertuigen;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel8
  - number: 8.3.b.2°
    text: een afvoersysteem dat voorkomt dat uitlaatgassen in de werkplaats terecht kunnen komen;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel8
  - number: 8.3.b.3°
    text: een systeem dat ervoor zorgt dat de uitlaatgassen die door de roetmeter gaan eveneens worden afgevoerd, en
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel8
  - number: 8.3.b.4°
    text: |-
      afvoerkanalen die bovenstaande onderdelen met elkaar verbinden waardoor de uitlaatgassen direct naar buiten worden
      afgevoerd.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel8
  - number: '8.4'
    text: In de keuringsruimte kan de administratie van de keuringen behoorlijk worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel8
  - number: '8.5'
    text: |-
      In de keuringsruimte is een voorziening aanwezig, geschikt voor het gebruik van datacommunicatie ten
      behoeve van het raadplegen van het kentekenregister, het afmelden van voertuigen en het bewaren van
      steekproefcontrolerapporten. Deze voorziening bestaat uit een computer of terminal met een modem, geschikt voor
      de toegangsstructuur van door de Dienst Wegverkeer geaccepteerde netwerken. Tevens is een voorziening aanwezig,
      geschikt voor aansluiting op de datacommunicatie, ten behoeve van het afdrukken van keuringsrapporten.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel8
  - number: '9.1'
    text: |-
      In de keuringsruimte is een doelmatige inspectieput of hefinrichting aanwezig die geschikt is voor de groep
      voertuigen waarvoor de erkenning voor de betrokken keuringsplaats wordt aangevraagd en die is voorzien van een
      doelmatige verlichting. Wanneer niet duidelijk blijkt wat het draagvermogen van een hefinrichting is, wordt
      hiervoor door de fabrikant of een onafhankelijk instituut een verklaring overgelegd. Het draagvermogen wordt
      zichtbaar op de hefinrichting aangebracht.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel9
  - number: '9.2'
    text: |-
      De inspectieput en de hefinrichting zijn zodanig uitgevoerd dat de keurmeester in staat is de onderkant van een
      voertuig nagenoeg over de hele lengte rechtopstaand te inspecteren, hetgeen betekent dat wanneer de erkenning wordt
      aangevraagd voor:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel9
  - number: 9.2.a
    text: |-
      voertuigen waarvan de toegestane maximummassa meer bedraagt dan 3500 kg, de hefinrichting een hefhoogte heeft van
      ten minste 1,35 m;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel9
  - number: 9.2.b
    text: |-
      voertuigen waarvan de toegestane maximummassa meer bedraagt dan 3500 kg, de inspectieput een diepte heeft van ten
      minste 1,35 m;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel9
  - number: 9.2.c
    text: |-
      voertuigen waarvan de toegestane maximummassa niet meer bedraagt dan 3500 kg, de hefinrichting een hefhoogte heeft
      van ten minste 1,65 m;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel9
  - number: 9.2.d
    text: |-
      voertuigen waarvan de toegestane maximummassa niet meer bedraagt dan 3500 kg, de inspectieput een diepte heeft van
      ten minste 1,55 m.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel9
  - number: '9.3'
    text: |-
      De hefinrichting kan ten minste vier wielen van het voertuig ondersteunen. Een met steunpoten gecombineerde
      hefinrichting voldoet niet aan deze eis.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel9
  - number: '9.4'
    text: |-
      In geval van een aanvraag van een erkenning voor de keuring van motorrijtuigen is ten behoeve van de controle van
      de afstelling van de koplampen met behulp van een koplamptestapparaat een voorziening aanwezig die bestaat uit:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel9
  - number: 9.4.a
    text: |-
      een vlakke vloer van voldoende afmetingen of een hefinrichting, waarop gelijktijdig zowel het te keuren voertuig
      als het koplamptestapparaat kan worden geplaatst, of
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel9
  - number: 9.4.b
    text: |-
      een vlakke vloer of rails, gelegen voor de hefinrichting, waarop het koplamptestapparaat kan worden geplaatst,
      waarbij deze vloer of rails in een vlak moet zijn gelegen gelijk of evenwijdig aan de rijplaten van de
      hefinrichting.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel9
  - number: '9.5'
    text: De hefinrichting moet deugdelijk zijn en in een goede staat van onderhoud verkeren.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel9
  - number: '10.1'
    text: |-
      Met de mobiele keuringseenheden mogen keuringen worden verricht in afzonderlijke inrichtingen, indien die aan de
      desbetreffende eisen van de [artikelen 8][ref1] en [9][ref2] voldoen en mits deze op het erkenningsbesluit van de
      betrokken mobiele keuringseenheid zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel9
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025735
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10.2'
    text: |-
      Indien de ruimte, bedoeld in [artikel 8, vierde lid][ref1], niet aanwezig is, mag de administratie van de keuringen
      in de mobiele keuringseenheid worden uitgevoerd. Tevens is er in de mobiele keuringseenheid een afsluitbare kast of
      bureaulade dan wel een gelijkwaardige voorziening aanwezig, waarin de bescheiden, bedoeld in [artikel 18][ref2] en
      de documentatie kunnen worden opgeborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel18
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025735
        artikel: '18'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '10.3'
    text: |-
      In de mobiele keuringseenheid is de voorziening voor het afvoeren van uitlaatgassen, bedoeld in
      [artikel 8, derde lid][ref1], aanwezig, wanneer deze in de in het eerste lid bedoelde keuringsplaats of inrichting
      niet beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11'
    text: 'In de keuringsruimte is de volgende apparatuur aanwezig:'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel11
  - number: 11.a
    text: |-
      een doelmatige krik die voldoende draagvermogen heeft om van de voertuigen van de groep waarvoor de erkenning
      voor de betrokken keuringsplaats wordt aangevraagd, de wielen van de voorste as gelijktijdig en de wielen van de
      achterste as afzonderlijk op zodanige wijze te kunnen heffen, dat deze vrij kunnen draaien;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel11
  - number: 11.b
    text: |-
      een dubbel geïsoleerde veiligheidslooplamp dan wel een zaklantaarn, al dan niet voorzien van een oplaadbare accu,
      die enerzijds een zodanige lichtsterkte heeft dat ook moeilijk bereikbare onderdelen van een voertuig voldoende
      helder kunnen worden verlicht om een nauwkeurige inspectie van een voertuig mogelijk te maken en die anderzijds
      zodanig is afgeschermd dat degene die de keuring uitvoert niet door het uitgestraalde licht wordt verblind;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel11
  - number: 11.c
    text: |-
      een meetband met een minimale nauwkeurigheidsklasse III van ten minste 12,00 m, indien de erkenning wordt
      aangevraagd voor voertuigen waarvan de toegestane maximummassa niet meer bedraagt dan 3500 kg. Indien het een
      erkenning betreft voor voertuigen waarvan de toegestane maximummassa meer bedraagt dan 3500 kg is de meetband
      ten minste 20,00 m. Bij erkenningen met een beperking voor de voertuiglengte heeft de meetband tenminste dezelfde
      lengte als de toegestane voertuiglengte;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel11
  - number: 11.d
    text: een doelmatige schuifmaat die is voorzien van een meetstift voor dieptemeting;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel11
  - number: 11.e
    text: |-
      basisgereedschap voor de controle op het vastzitten van nagels en bouten en andere verbindingen, te weten een set
      steek- en ringsleutels, schroevendraaiers en een hamer, alsmede een bolkophamertje voor de controle op corrosie;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel11
  - number: 11.f
    text: een doelmatige bandenspanningsmeter en een doelmatige bandenpomp;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel11
  - number: 11.g
    text: |-
      hulpmiddelen om speling in voertuigonderdelen zichtbaar te maken, zoals een bandijzer, wielbewegingsapparaat of
      een koevoet;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel11
  - number: 11.h
    text: |-
      een rollenremtestbank of platenremtestbank, die voldoet aan de in [artikel 13][ref1] gestelde eisen. Indien een
      erkenning wordt aangevraagd voor voertuigen met een toegestane maximummassa van meer dan 3500 kg is in elk geval
      een rollenremtestbank aanwezig. Het draagvermogen van een rollenremtestbank of platenremtestbank is voldoende voor
      de groep voertuigen waarvoor de erkenning voor de betrokken keuringsplaats wordt aangevraagd;


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel13
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 11.i
    text: een doelmatige bandenprofieldieptemeter, met verende meetstift en een meetnauwkeurigheid van 0,1 mm.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel11
  - number: '12'
    text: |-
      Naast de in [artikel 11][ref1] genoemde apparatuur is, afhankelijk van de groep voertuigen waarvoor de erkenning
      voor de betrokken keuringsplaats wordt aangevraagd, tevens de volgende apparatuur aanwezig die voldoet aan de in
      [artikel 13][ref2] gestelde eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel13
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025735
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 12.a
    text: 'in geval van een aanvraag voor een erkenning voor motorrijtuigen:'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.a.1
    text: een koplamptestapparaat;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.a.2
    text: |-
      een pedaalkrachtmeter; deze is niet verplicht in geval van een vóór 1 maart 2000 afgegeven erkenning voor het eigen
      wagenpark en in geval van een erkenning die uitsluitend geldt voor het keuren van voertuigen die zijn voorzien van
      een druklucht-remsysteem;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.a.3
    text: een universele toerenteller;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.a.4
    text: een hulpstuk waarmee de speling op de sluiting van 2 inch koppelingsschotels meetbaar gemaakt kan worden;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.b
    text: |-
      in geval van een aanvraag voor een erkenning voor voertuigen waarvan de toegestane maximummassa meer bedraagt dan
      3500 kg:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.b.1°
    text: |-
      twee manometers met slangen en aansluitstukken voor drukmeetpunten alsmede aansluitkoppen voor
      aanhangwagenremsystemen, waarmee de druk in drukluchtremsystemen en in gasveersystemen kan worden gemeten;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.b.2°
    text: een stalen rei met een lengte van ten minste 0,90 m;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.b.3°
    text: een hulpstuk waarmee de speling op de sluiting van 2 inch koppelingsschotels meetbaar gemaakt kan worden;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.b.4°
    text: Een apparaat om LPG-, CNG- of LNG-lekkages op te sporen;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.c
    text: |-
      in geval van een aanvraag voor een erkenning voor motorrijtuigen met een verbrandingsmotor met compressie-
      ontsteking: een roetmeter en olietemperatuurmeter;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.d
    text: |-
      in geval van een aanvraag voor een erkenning voor motorrijtuigen die zijn voorzien van een verbrandingsmotor met
      elektrische ontsteking: een uitlaatgastester met lambda-bepaling;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: 12.e
    text: |-
      in geval van een aanvraag voor een erkenning voor motorrijtuigen waarvan de toegestane maximummassa niet meer
      bedraagt dan 3500 kg: een uitleesapparaat ten behoeve van het uitlezen van het emissiegerelateerd diagnostisch
      boordsysteem.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel12
  - number: '13.1'
    text: |-
      Ten aanzien van roetmeters, manometers, pedaalkrachtmeters, rollenremtestbanken, platenremtestbanken en
      uitlaatgastesters met lambda-bepaling, beschikt de aanvrager van een erkenning over:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: 13.1.a
    text: |-
      een geldig certificaat van eerste keuring als bedoeld in [artikel 8.1.1 van de Regeling voertuigen][ref1]
      dan wel, in geval van uitlaatgasters met lambda-bepaling, de documenten als bedoeld in
      [artikel 8.1.4, onder b, van de Regeling voertuigen][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '8'
  - number: 13.1.b
    text: |-
      een geldig certificaat van herkeuring als bedoeld in [artikel 8.1.1 van de Regeling voertuigen][ref1]
      dan wel, in geval van uitlaatgasters met lambda-bepaling, een geldig certificaat van herkeuring
      als bedoeld in artikel 8.1.1 van de Regeling voertuigen indien de documenten als bedoeld in
      [artikel 8.1.4, onder b, van de Regeling voertuigen][ref2] langer dan twaalf maanden geleden zijn afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '8'
  - number: '13.2'
    text: |-
      Het certificaat van eerste keuring en het certificaat van herkeuring zijn afgegeven door een keuringsinstelling dan
      wel een onderzoeksgerechtigde.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: '13.3'
    text: |-
      Ten aanzien van de in het eerste lid genoemde meetmiddelen beschikt de aanvrager van een erkenning over een
      handleiding in de Nederlandse taal als bedoeld in [artikel 8.3.6 van de Regeling voertuigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
  - number: '13.4'
    text: |-
      Een koplamptestapparaat voldoet aan artikel [8.4.110 van de Regeling voertuigen][ref1] en is voorzien van
      een handleiding in de Nederlandse taal, waarin ten minste vermeld is een procedure voor het gebruik van het
      koplamptestapparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
  - number: '13.5'
    text: |-
      De in [artikel 8, derde lid, onderdeel a][ref1], bedoelde afzuiginstallatie ten behoeve van de roetmeting is
      voorzien van een goedkeuring, afgegeven door een keuringsinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13.6'
    text: |-
      Een niet in de roetmeter geïntegreerde toerenteller voldoet aan [artikelen 8.4.15][ref1] en
      [8.4.16 van de Regeling voertuigen][ref2] en is voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '8'
  - number: 13.6.a
    text: een CE-markering met een aanvullende metrologische markering, en
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: 13.6.b
    text: |-
      een handleiding in de Nederlandse taal, waarin tenminste vermeld is een procedure voor het gebruik van de
      toerenteller.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: '13.7'
    text: |-
      Een olietemperatuurmeter voldoet aan [artikelen 8.4.20][ref1], [8.4.21][ref2] en
      [8.4.22 van de Regeling voertuigen][ref3] en is voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0025798
        artikel: '8'
  - number: 13.7.a
    text: |-
      een CE-markering met een aanvullende metrologische markering, voor zover het een elektronische olietemperatuurmeter
      betreft, en
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: 13.7.b
    text: |-
      een handleiding in de Nederlandse taal, waarin tenminste vermeld is een procedure voor het gebruik van de
      olietemperatuurmeter.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: '13.8'
    text: 'Een uitleesapparaat ten behoeve van het uitlezen van het emissiegerelateerd diagnostisch boordsysteem moet:'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: 13.8.a
    text: over een ISO-15031-3 connector (16-polige stekker) beschikken;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: 13.8.b
    text: |-
      kunnen communiceren met het in het voertuig aanwezige emissiegerelateerd diagnostisch boordsysteem en minimaal de
      modus 03 ondersteunen;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: 13.8.c
    text: |-
      de volgende protocollen ondersteunen: - ISO 9141-2,
        - ISO/DIS 11519-4 PWM dan wel SAE J1850 PWM,
        - ISO/DIS 11519-4 VPW dan wel SAE J1850 VPW,
        - ISO/DIS 14230-4, en
        - ISO/DIS 15765-4;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: 13.8.d
    text: de status van de in het voertuig aanwezige waarschuwingsinrichting (MIL) kunnen weergeven;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: 13.8.e
    text: de status van de readiness-test kunnen weergeven;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: 13.8.f
    text: de aanwezige fouten in de in ISO 15031-6 vastgestelde codering kunnen weergeven;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: 13.8.g
    text: voorzien zijn van CE-markering;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: 13.8.h
    text: |-
      voorzien zijn van een handleiding in de Nederlandse taal waarin ook de ondersteunde communicatieprotocollen zijn
      beschreven. Indien de communicatieprotocollen niet zijn beschreven in de handleiding mogen deze zijn beschreven in
      een bij het uitleesapparaat behorende fabrikantenverklaring.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel13
  - number: '14'
    text: |-
      De apparatuur, bedoeld in de [artikelen 11][ref1] en [12][ref2], is deugdelijk en verkeert in een goede staat van
      onderhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel12
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025735
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '15.1'
    text: |-
      Vanaf de buitenkant van elke keuringsplaats waarvoor de erkenning geldt, is op een door de Dienst Wegverkeer
      vastgestelde en in de Staatscourant bekendgemaakte wijze zichtbaar dat de erkenning is verleend. Deze eis geldt
      niet voor keuringsplaatsen waarvan in het erkenningsbesluit is vastgelegd dat de erkenning alleen geldt voor
      voertuigen die behoren tot het eigen wagenpark.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel15
  - number: '15.2'
    text: |-
      In elke keuringsplaats waarvoor de erkenning geldt, is het door de Dienst Wegverkeer afgegeven bewijs aanwezig
      waaruit blijkt dat voor de keuringsplaats een erkenning is verleend en voor welke groep voertuigen de erkenning
      voor de keuringsplaats geldt.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel15
  - number: '15.3'
    text: |-
      Bij elke mobiele keuringseenheid waarvoor de erkenning geldt, is het door de Dienst Wegverkeer afgegeven bewijs
      aanwezig waaruit blijkt dat voor de eenheid een erkenning is verleend, voor welke groep voertuigen de erkenning
      voor de eenheid geldt en in welke inrichtingen de keuringen mogen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel15
  - number: '15.4'
    text: |-
      Op verzoek van de aanvrager van een keuringsrapport wordt het in het tweede en derde lid bedoelde bewijs ter inzage
      gegeven.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel15
  - number: '16.1'
    text: |-
      De keuringsplaatsen blijven voortdurend voldoen aan de eisen, gesteld in de artikelen [artikel 8][ref1],
      [9][ref2], [11][ref3], [12][ref4], [13][ref5] en [14][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0025735#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0025735#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0025735#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0025735#Artikel14
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025735
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0025735
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0025735
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0025735
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0025735
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '16.2'
    text: |-
      De mobiele keuringseenheden, alsmede de inrichtingen of keuringsplaatsen waarin met een mobiele keuringseenheid
      keuringen mogen worden verricht blijven voortdurend voldoen aan de eisen, gesteld in de [artikelen 9][ref1],
      [10][ref2], [11][ref3], [12][ref4], [13][ref5] en [14][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0025735#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0025735#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0025735#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0025735#Artikel14
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025735
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0025735
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0025735
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0025735
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0025735
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '17.1'
    text: |-
      Ten aanzien van roetmeters, toerentellers, olietemperatuurmeters, manometers, pedaalkrachtmeters,
      rollenremtestbanken, platenremtestbanken, uitlaatgastesters met lambda-bepaling en uitleesapparaten ten behoeve van
      het uitlezen van het emissiegerelateerd diagnostisch boordsysteem zijn steeds aanwezig de documenten en markeringen
      als bedoeld in [artikel 13][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel13
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '17.2'
    text: |-
      Ten aanzien van de in [artikel 8, derde lid, onderdeel a][ref1], bedoelde afzuiginstallatie ten behoeve van de
      roetmeting is steeds een geldig certificaat van goedkeuring aanwezig.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '17.3'
    text: |-
      Na verwijdering van de rollenremtestbank of de platenremtestbank van zijn fundering waaraan hij was bevestigd
      teneinde te worden herplaatst op dezelfde plaats of een andere plaats, wordt wederom een certificaat van eerste
      keuring dan wel herkeuring afgegeven en is de verzegeling aan de fundering aangebracht.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel17
  - number: '17.4'
    text: |-
      Na verplaatsing van de nulemissie-eenheid naar een andere keuringsplaats, moet wederom een certificaat van eerste
      keuring, dan wel herkeuring worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel17
  - number: '17.5'
    text: |-
      Wijzigingen ten aanzien van de in het eerste en tweede lid genoemde apparatuur en ten aanzien van de afgifte
      van een certificaat van herkeuring of goedkeuring worden via de datacommunicatie terstond gemeld aan de Dienst
      Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel17
  - number: 17a
    text: |-
      Aan een op grond van [artikel 23k van het Besluit voertuigen][ref1] bestaande verplichting wordt gevolg gegeven
      door de tellerstand van een motorrijtuig te verstrekken aan de Dienst Wegverkeer door middel van de voorziening,
      bedoeld in [artikel 8, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel23k
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: 23k
      - id: ref2
        bwb_id: BWBR0025735
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '18.1'
    text: |-
      Van het steekproefcontrolerapport wordt ten minste gedurende twee jaar een afschrift bewaard. Op dit afschrift
      worden geen wijzigingen aangebracht.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel18
  - number: '18.2'
    text: |-
      Gedurende de in het eerste lid bedoelde termijn worden de genoemde bescheiden en de controlelijsten desgevraagd
      onverwijld aan een functionaris van de Dienst Wegverkeer ter inzage gegeven of ter inzage opgestuurd.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel18
  - number: '18.3'
    text: |-
      De erkenninghouder draagt er zorg voor dat de aan hem ten behoeve van datacommunicatie verstrekte code niet
      toegankelijk is voor onbevoegden.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel18
  - number: '18.4'
    text: Het boekwerk ‘Regelgeving APK’ alsmede de vereiste certificaten en handleidingen zijn goed geordend aanwezig.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel18
  - number: '18.5'
    text: |-
      De erkenninghouder vermeldt op de factuur bij afgifte van een keuringsrapport het door hem in gevolge van
      [artikel 86, zesde lid, van de wet][ref1] aan de Dienst Wegverkeer verschuldigde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel86
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '86'
  - number: '18.6'
    text: Foutief ingevulde of onbruikbaar geworden afdrukken van keuringsrapporten worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel18
  - number: '19.1'
    text: |-
      Indien zich wijzigingen voordoen in de samenstelling van de economische eenheid als bedoeld in [artikel 6][ref1]
      worden deze door de erkenninghouder schriftelijk aan de Dienst Wegverkeer gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel6
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '6'
        hoofdstuk: '2'
  - number: '19.2'
    text: |-
      Indien zich een wijziging voordoet van de natuurlijke persoon, de rechtspersoon of de rechtsvorm, zijn zowel
      de natuurlijke persoon of rechtspersoon aan wie de erkenning oorspronkelijk was verleend, als degene die de
      bedrijfsvoering voortzet, verplicht de Dienst Wegverkeer hiervan zo spoedig mogelijk schriftelijk in kennis te
      stellen.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19
  - number: '19.3'
    text: |-
      Indien als gevolg van een wijziging als bedoeld in het voorgaande lid de bedrijfsvoering van de natuurlijke
      persoon, de rechtspersoon of de rechtsvorm waaraan een erkenning APK, is verleend, wordt voortgezet door een andere
      natuurlijke persoon of rechtspersoon, worden de toegekende bonus- en strafpunten van het systeem als bedoeld in
      [artikel 37][ref1] beschouwd als te zijn toegekend aan deze natuurlijke persoon of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel37
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '37'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: '19.4'
    text: |-
      Indien als gevolg van een wijziging als bedoeld in het tweede lid de bedrijfsvoering van de natuurlijke persoon, de
      rechtspersoon of de rechtsvorm waaraan een erkenning APK is verleend, wordt voortgezet door een andere natuurlijke
      persoon of rechtspersoon, worden de opgelegde sancties beschouwd als te zijn toegekend aan deze natuurlijke persoon
      of rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19
  - number: '19.5'
    text: |-
      Wijziging en uitbreiding van een erkenning is niet mogelijk indien de erkenning op grond van
      [artikel 87, tweede lid, van de wet][ref1] is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '87'
  - number: '19.6'
    text: |-
      Uitbreiding van een erkenning is niet mogelijk indien de erkenning is verleend aan één of meer in Nederland op naam
      van de erkenninghouder geregistreerde mobiele keuringseenheden.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19
  - number: 19a
    text: Als exameninstantie wordt aangewezen de Stichting VAM (IBKI) te Nieuwegein.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19a
  - number: 19b
    text: 'De exameninstantie voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19b
  - number: 19b.a
    text: |-
      de exameninstantie is onafhankelijk en onpartijdig en neemt bij de uitvoering van de werkzaamheden het
      examenreglement in acht;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19b
  - number: 19b.b
    text: de exameninstantie neemt afdoende maatregelen om fraude, voor, tijdens en na het examen te voorkomen.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19b
  - number: 19c.1
    text: 'De exameninstantie is belast met:'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: 19c.1.a
    text: het afnemen van het examen voor het diploma keurmeester periodieke keuring zware (bedrijfs)voertuigen;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: 19c.1.b
    text: het afnemen van het examen voor het diploma keurmeester periodieke keuring lichte voertuigen;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: 19c.1.c
    text: het afnemen van het examen ter verlenging van de bevoegdheid tot keuren van zware (bedrijfs)voertuigen;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: 19c.1.d
    text: het afnemen van het examen ter verlenging van de bevoegdheid tot keuren van lichte voertuigen;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: 19c.1.e
    text: |-
      het afnemen van het examen ter verlenging van de bevoegdheid in de gevallen genoemd in de
      [artikelen 44 tot en met 46][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel44
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '44'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 19c.1.f
    text: de vaststelling van de tarieven voor de activiteiten, bedoeld in de onderdelen a tot en met e.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: 19c.2
    text: |-
      De exameninstantie is verder met betrekking tot het organiseren en afnemen van de examens, bedoeld in het eerste
      lid, belast met:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: 19c.2.a
    text: het geven van voorlichting en bekendheid aan het examen;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: 19c.2.b
    text: het vaststellen van de examendatum, het tijdstip en de plaats;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: 19c.2.c
    text: het toezenden van de uitnodiging voor de deelname aan het examen;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: 19c.2.d
    text: het factureren van de tarieven, bedoeld in het eerste lid onder c, aan een deelnemer, en
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: 19c.2.e
    text: |-
      het registreren van individuele en algemene resultaten van de examens als bedoeld in het eerste lid onder a tot en
      met e.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel19c
  - number: '20.1'
    text: |-
      De bevoegdheid voertuigen met een toegestane maximummassa hoger dan 3.500 kg dan wel voertuigen met een toegestane
      maximummassa niet hoger dan 3.500 kg aan een keuring te onderwerpen kan worden verleend aan een natuurlijk persoon
      die in het bezit is van een, mede door een door de Dienst Wegverkeer aangewezen gecommitteerde ondertekend, diploma
      keurmeester periodieke keuring zware (bedrijfs)voertuigen respectievelijk diploma keurmeester periodieke keuring
      lichte voertuigen dat is afgegeven door de Stichting VAM, nadat het examen met goed gevolg bij deze instelling
      is afgelegd.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel20
  - number: '20.2'
    text: |-
      De Dienst Wegverkeer bepaalt aan welke voorwaarden wordt voldaan alvorens deelgenomen kan worden aan het examen
      keurmeester periodieke keuring zware (bedrijfs)voertuigen of examen keurmeester periodieke keuring lichte
      voertuigen. Deze voorwaarden worden in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel20
  - number: '20.3'
    text: |-
      Het examen wordt afgenomen overeenkomstig een door de Stichting VAM vastgesteld en door de Dienst Wegverkeer
      goedgekeurd reglement.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel20
  - number: '21.1'
    text: |-
      Ten bewijze van de bevoegdheid voertuigen aan een keuring te onderwerpen wordt aan de keurmeester een
      bevoegdheidspas overeenkomstig een door de Dienst Wegverkeer vastgesteld model verstrekt. Op de bevoegdheidspas
      worden ten minste het pasnummer, het diplomanummer en de groep van voertuigen genoemd waarvoor de bevoegdheid
      voertuigen aan een keuring te onderwerpen geldt alsmede de geldigheidsduur van de pas.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel21
  - number: '21.2'
    text: |-
      Ten behoeve van het afmelden van een voertuig als bedoeld in [artikel 30][ref1] door middel van datacommunicatie,
      wordt aan de keurmeester een pincode verstrekt. Deze pincode is strikt persoonlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel30
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '30'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '22.1'
    text: |-
      Nadat de bevoegdheid voertuigen aan een keuring te onderwerpen is verleend, wordt onverminderd het bepaalde in
      het derde lid en in de [artikelen 44 tot en met 46][ref1] door de keurmeester iedere twee jaar een toets bij de in
      [artikel 20][ref2] genoemde instelling afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel20
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '44'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0025735
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '22.2'
    text: |-
      De toets wordt afgenomen overeenkomstig een door de in het eerste lid bedoelde instelling vastgesteld en een door
      de Dienst Wegverkeer goedgekeurd reglement.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel22
  - number: '22.3'
    text: |-
      Afhankelijk van het resultaat van de toets bedoeld in het eerste lid, wordt de bevoegdheid voertuigen aan een
      keuring te onderwerpen met twee jaar verlengd of niet verlengd.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel22
  - number: '23'
    text: 'De aanvrager van de bevoegdheid voertuigen aan een keuring te onderwerpen overlegt de volgende bescheiden:'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel23
  - number: 23.a
    text: |-
      een afschrift van de in de [artikel 20][ref1] genoemde diploma’s;


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel20
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '20'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 23.b
    text: |-
      indien van toepassing een afschrift van het resultaat van de toets als bedoeld in [artikel 22][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel22
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '22'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '24.1'
    text: |-
      De erkenninghouder neemt in verband met de periodieke keuring van motorrijtuigen en aanhangwagens het bij en
      krachtens de [wet][ref1] bepaalde in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '24.2'
    text: Keuringen worden slechts verricht in een keuringsplaats waarvoor de erkenning geldt.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel24
  - number: '24.3'
    text: |-
      In de keuringsplaats worden slechts keuringen verricht van voertuigen waarvoor de erkenning voor de betrokken
      keuringsplaats geldt.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel24
  - number: '24.4'
    text: |-
      Met de mobiele keuringseenheid worden in een keuringsplaats of inrichting slechts keuringen verricht van voertuigen
      waarvoor de erkenning voor de betrokken keuringseenheid geldt.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel24
  - number: '24.5'
    text: |-
      Het boekwerk ‘Regelgeving APK’ wordt door de erkenninghouder beschikbaar gesteld aan de keurmeester; de
      erkenninghouder draagt er tevens zorg voor dat de voorgeschreven boekwerken tot en met de laatste wijziging zijn
      bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel24
  - number: '24.6'
    text: |-
      Aan een bevoegdheid voertuigen aan een keuring te onderwerpen worden de in de [artikelen 25 tot en met 32][ref1]
      opgenomen voorschriften verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel25
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '24.7'
    text: |-
      Aan een erkenning worden de in de [artikelen 15 tot en met 19][ref1] en [24 tot en met 33][ref2] opgenomen
      voorschriften verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel24
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '15'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0025735
        artikel: '24'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '25.1'
    text: |-
      De keurmeester neemt in verband met de periodieke keuring van motorrijtuigen en aanhangwagens het bij en krachtens
      de [wet][ref1] bepaalde in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '25.2'
    text: |-
      De keurmeester controleert of hij de beschikking heeft over het boekwerk ‘Regelgeving APK’ voordat hij een keuring
      gaat verrichten.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel25
  - number: '26.1'
    text: Op verzoek van de aanvrager van een keuringsrapport wordt de bevoegdheidspas ter inzage gegeven.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel26
  - number: '26.2'
    text: |-
      De keurmeester draagt er zorg voor dat de aan hem ten behoeve van datacommunicatie verstrekte pincode niet
      toegankelijk is voor anderen.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel26
  - number: '27.1'
    text: |-
      Indien bij de erkenninghouder een keuringsrapport wordt aangevraagd, stelt deze, na overleg met de aanvrager,
      onverwijld het tijdstip voor de keuring vast. De keuring vindt zo spoedig mogelijk na de aanvraag plaats.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: '27.2'
    text: |-
      Er wordt geen keuring verricht dan nadat door de aanvrager het goedkeuringsdocument als bedoeld in
      [artikel 3.15, tweede en derde lid, van de Regeling voertuigen][ref1] is overgelegd, indien in het kentekenregister
      of op het kentekenbewijs bij bijzonderheden is vermeld ‘Taxi, zie goedkeuringsdocument’ of ’OV-auto, zie
      goedkeuringsdocument’.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel3
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '3'
  - number: '27.3'
    text: 'Er wordt geen keuring verricht dan nadat het kentekenregister is geraadpleegd ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: 27.3.a
    text: het voor het voertuig opgegeven kenteken;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: 27.3.b
    text: het identificatienummer van het ter keuring aangeboden voertuig, en
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: 27.3.c
    text: de datum eerste toelating van het voertuig.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: '27.4'
    text: |-
      Er wordt geen keuring verricht en de aanvrager van een keuringsrapport wordt naar de Dienst Wegverkeer doorverwezen
      indien:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: 27.4.a
    text: |-
      het raadplegen van het kentekenregister niet mogelijk is door een onjuiste combinatie van het kenteken en
      de laatste vier posities van het voertuigidentificatienummer of indien de laatste vier posities van het
      voertuigidentificatienummer niet bekend zijn;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: 27.4.b
    text: het voertuigidentificatienummer van het voertuig niet in overeenstemming is met het kentekenregister;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: 27.4.c
    text: |-
      blijkens het kentekenregister de beperkte inschrijvingsduur van de tenaamstelling verstreken is, waardoor de
      tenaamstelling ingevolge [artikel 51a, vijfde lid, van de wet][ref1], is vervallen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel51
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '51'
  - number: '27.5'
    text: |-
      Er wordt geen keuring verricht dan nadat door de aanvrager de voor het voertuig afgegeven kentekencard, dan wel het
      kentekenbewijs is overgelegd, indien het voertuig is voorzien van een kenteken bevattende de lettergroep AA, CD,
      CDJ dan wel de lettergroep BN of GN en twee groepen van twee cijfers.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: '27.6'
    text: |-
      In geval van een aanvraag voor een keuringsrapport voor voertuigen waarbij het om technische redenen als bedoeld in
      artikel 57, vijfde lid, van [bijlage VIII van de Regeling voertuigen][ref1], niet mogelijk is het voertuig op een
      rollenremtestbank of platenremtestbank te remmen, dient een deugdelijke, goed functionerende remvertragingsmeter in
      de keuringsruimte aanwezig te zijn, waarvoor een geldig certificaat van eerste keuring of herkeuring als bedoeld in
      [artikel 8.1.1 van de Regeling voertuigen][ref2] is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025798
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025798
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '8'
  - number: '27.7'
    text: |-
      Indien het te keuren motorrijtuig een bedrijfsauto is waarvan de toegestane maximummassa niet meer bedraagt dan
      3.500 kg die is voorzien van een drukluchtremsysteem en een vangmuilkoppeling ten behoeve van een aanhangwagen
      dienen twee manometers met slangen en aansluitstukken voor drukmeetpunten alsmede aansluitkoppen voor
      aanhangwagenremsystemen in de keuringsruimte aanwezig te zijn, waarmee de druk in drukluchtremsystemen en in
      gasveersystemen kan worden gemeten, voorzien van een geldig certificaat van eerste keuring of herkeuring als
      bedoeld in [artikel 8.1.1 van de Regeling voertuigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
  - number: '27.8'
    text: |-
      Indien het te keuren motorrijtuig een bedrijfsauto is waarvan de toegestane maximummassa niet meer bedraagt dan
      3.500 kg die is voorzien van een drukluchtremsysteem en een schotelkoppeling ten behoeve van een aanhangwagen
      dienen in de keuringsruimte aanwezig te zijn:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: 27.8.1°
    text: |-
      twee manometers met slangen en aansluitstukken voor drukmeetpunten alsmede aansluitkoppen voor
      aanhangwagenremsystemen, waarmee de druk in drukluchtremsystemen en in gasveersystemen kan worden
      gemeten, voorzien van een geldig certificaat van eerste keuring of herkeuring als bedoeld in
      [artikel 8.1.1 van de Regeling voertuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
  - number: 27.8.2°
    text: een stalen rei met een lengte van ten minste 0,90 m; en
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: 27.8.3°
    text: een hulpstuk waarmee de speling op de sluiting van 2 inch koppelingsschotels meetbaar gemaakt kan worden.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel27
  - number: '28.1'
    text: |-
      De keuring wordt verricht in een keuringsruimte met apparatuur die aan de in de [artikelen 7][ref1], [9][ref2],
      [11][ref3], [12][ref4], [13][ref5] en indien van toepassing [artikel 27, zesde, zevende en achtste lid][ref6]
      gestelde eisen voldoet. Van deze eis kan worden afgeweken indien volgens de wijze van keuren zoals vermeld in
      [hoofdstuk 5 van de Regeling voertuigen][ref7] een rij- of remproef buiten de keuringsruimte wordt uitgevoerd, mits
      de buitentemperatuur binnen het temperatuurgebied van de verplichte apparatuur ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0025735#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0025735#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0025735#Artikel13
      [ref6]: https://wetten.overheid.nl/BWBR0025735#Artikel27
      [ref7]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '7'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025735
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0025735
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0025735
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0025735
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0025735
        artikel: '27'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0025798
        hoofdstuk: '5'
  - number: '28.2'
    text: |-
      Bij de keuring wordt het voertuig tevens gecontroleerd aan de hand van de in [bijlage 1][ref1] opgenomen
      reparatieadviespunten.


      [ref1]: https://wetten.overheid.nl/BWBR0025735
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0025735
  - number: '28.3'
    text: De keuring wordt verricht door een keurmeester.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel28
  - number: '29.1'
    text: Het resultaat van elke keuring wordt door de keurmeester schriftelijk vastgelegd op het keuringsrapport.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel29
  - number: '29.2'
    text: |-
      Voor dit keuringsrapport wordt gebruikgemaakt van het door de Dienst Wegverkeer vastgestelde model keuringsrapport,
      dat bekend is gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel29
  - number: '30.1'
    text: |-
      Na afloop van elke keuring wordt het bepaalde in het tweede lid tot en met het vijfde lid in acht genomen alvorens
      het keuringsrapport af te geven aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: '30.2'
    text: |-
      Alvorens tot het afmelden van een voertuig als bedoeld in het derde lid wordt overgegaan, wordt door de keurmeester
      die het voertuig afmeldt aan de hand van het kentekenregister nagegaan of de keuring van dat voertuig heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: '30.3'
    text: |-
      Het voertuig wordt door middel van datacommunicatie bij de Dienst Wegverkeer afgemeld onder verstrekking van de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.3.a
    text: het pasnummer en de pincode van de keurmeester;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.3.b
    text: het kenteken van het voertuig;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.3.c
    text: |-
      de meldcode, gevormd door de laatste vier cijfers van het voertuigidentificatienummer, letters en leestekens buiten
      beschouwing gelaten;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.3.d
    text: |-
      indien het een voertuig betreft dat is voorzien van een kilometerteller, de afgelezen kilometerstand van het
      voertuig;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.3.e
    text: het resultaat van de keuring;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.3.f
    text: |-
      de bevestiging dat de in het tweede lid voorgeschreven controleverplichting is nagekomen, waarna acceptatie van de
      afmelding wordt weergegeven:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.3.f.1°
    text: de transactiecode en het tijdstip van de afmelding;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.3.f.2°
    text: 'indien het voertuig is goedgekeurd: tevens een nieuwe vervaldatum;'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.3.f.3°
    text: 'indien het voertuig aan een steekproef moet worden onderworpen: tevens de einde wachttijd van de steekproef.'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: '30.4'
    text: 'Op het keuringsrapport moet schriftelijk worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.4.a
    text: het pasnummer als bedoeld in het derde lid, onderdeel a, en het bepaalde in de onderdelen b en c;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.4.b
    text: de afgelezen kilometerstand indien het voertuig is voorzien van een kilometerteller;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.4.c
    text: het resultaat van de keuring;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.4.d
    text: |-
      de transactiecode, en uitsluitend indien de schriftelijke invulling rechtstreeks plaatsvindt uit het door de Dienst
      Wegverkeer bijgehouden kentekenregister de tekst ‘afdruk RDW’;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.4.e
    text: |-
      indien het voertuig is goedgekeurd de vervaldatum, waarbij de maand van de vervaldatum voluit in letters is
      geschreven;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.4.f
    text: indien het voertuig aan een steekproef wordt onderworpen de einde wachttijd van de steekproef;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: 30.4.g
    text: de naam, adresgegevens en het keuringsinstantienummer van de erkenninghouder.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: '30.5'
    text: |-
      Alvorens het keuringsrapport wordt ondertekend, wordt door de keurmeester nagegaan of het rapport volledig is
      ingevuld.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: '30.6'
    text: Door een keurmeester worden niet meer dan vier voertuigen per zestig minuten afgemeld.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: '30.7'
    text: |-
      Het keuringsrapport wordt onverwijld aan de aanvrager afgegeven indien het voertuig niet aan een steekproef wordt
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: '30.8'
    text: |-
      Indien het voertuig aan een steekproef wordt onderworpen, deelt de erkenninghouder dit aan de aanvrager mede en
      houdt de erkenninghouder het keuringsrapport onder zich voor een periode van ten hoogste negentig minuten, vanaf
      het tijdstip van afmelding.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel30
  - number: '31.1'
    text: |-
      Indien het voertuig blijkens mededeling van de Dienst Wegverkeer aan een steekproef wordt onderworpen, gelden de in
      het tweede tot en met zesde lid genoemde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel31
  - number: '31.2'
    text: |-
      In de staat van het voertuig dat aan een steekproef wordt onderworpen, worden gedurende negentig minuten na
      het tijdstip van afmelding geen wijzigingen aangebracht en worden geen metingen met betrekking tot het voertuig
      verricht.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel31
  - number: '31.3'
    text: |-
      De erkenninghouder wijst de eigenaar of houder van het voertuig dat aan een steekproef wordt onderworpen er op dat
      deze verplicht is het voertuig voor de uitvoering van de steekproef beschikbaar te houden.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel31
  - number: '31.4'
    text: |-
      Voorafgaande aan de steekproefherkeuring wordt het keuringsrapport door de erkenninghouder of de keurmeester
      aan de daartoe aangewezen functionaris van de Dienst Wegverkeer overhandigd. Door de erkenninghouder of de
      keurmeester wordt indien [artikel 27, tweede lid][ref1], van toepassing is, tevens het in dat artikel bedoelde
      goedkeuringsdocument overhandigd.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel27
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '27'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '31.5'
    text: |-
      Aan een steekproef wordt alle medewerking verleend en de terzake door de Dienst Wegverkeer gegeven aanwijzingen
      worden in acht genomen. Onder alle medewerking wordt in ieder geval verstaan dat:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel31
  - number: 31.5.a
    text: |-
      bij uitsluiting de keurmeester die het voertuig aan een keuring heeft onderworpen, aanwezig is vanaf het moment dat
      de mededeling, bedoeld in het eerste lid, is gedaan en zelf feitelijke assistentie verleent bij het uitvoeren van
      de steekproef;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel31
  - number: 31.5.b
    text: |-
      indien de keuring verricht is door een mobiele keuringseenheid tevens het voertuig, van waaruit door de mobiele
      keuringseenheid de keuringen zijn verricht, bij de steekproef aanwezig is;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel31
  - number: 31.5.c
    text: het voertuig niet uit de keuringsplaats wordt verwijderd gedurende de steekproef;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel31
  - number: 31.5.d
    text: de desbetreffende ruimte en apparatuur gedurende de steekproef beschikbaar worden gesteld.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel31
  - number: '31.6'
    text: |-
      Indien bij de steekproef wordt vastgesteld dat het voertuig niet voldoet aan de keuringseisen, het voertuig
      onterecht is af- of goedgekeurd, het keuringsrapport onjuist of onvolledig is ingevuld of indien wordt
      geconstateerd dat de voorschriften met betrekking tot de steekproef niet in acht zijn genomen, wordt door de
      daartoe aangewezen functionaris van de Dienst Wegverkeer een steekproefcontrolerapport opgemaakt dat door deze
      wordt ondertekend alsmede door de keurmeester.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel31
  - number: '32.1'
    text: |-
      Indien de eigenaar of houder van het voertuig dat aan een steekproef wordt onderworpen met het voertuig wegrijdt,
      wordt dit onverwijld door de keurmeester aan de Dienst Wegverkeer gemeld. De eventuele goedkeuring wordt door de
      Dienst Wegverkeer ingetrokken en het voertuig kan niet meer worden afgemeld.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel32
  - number: '32.2'
    text: |-
      De erkenninghouder draagt er zorg voor dat de eigenaar of houder van een weggereden voertuig op de hoogte is
      gesteld van de verplichting om een nieuwe aanvraag van een keuringsrapport bij de Dienst Wegverkeer in te dienen.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel32
  - number: '33'
    text: |-
      De Dienst Wegverkeer voert steekproefsgewijs anonieme keuringen uit door middel van het ter keuring aanbieden van
      een voertuig in het kader van het toezicht op de erkenning en het verrichten van keuringen. Wanneer blijkt dat:
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel33
  - number: 33.a
    text: de keuring niet in de keuringsplaats wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel33
  - number: 33.b
    text: de mobiele keuringseenheid niet aanwezig is;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel33
  - number: 33.c
    text: de keuring niet met de vereiste apparatuur wordt uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel33
  - number: 33.d
    text: de keuring niet door een persoon die bevoegd is voertuigen aan een keuring te onderwerpen wordt uitgevoerd, of
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel33
  - number: 33.e
    text: het resultaat van de keuring niet aan de Dienst Wegverkeer wordt gemeld;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel33
  - number: '34.1'
    text: |-
      Het in [artikel 86 van de wet][ref1] bedoelde toezicht geschiedt met inachtneming van de in [paragraaf 2][ref2]
      daaromtrent gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '86'
      - id: ref2
        bwb_id: BWBR0025735
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '34.2'
    text: |-
      Het in [artikel 86a van de wet][ref1] bedoelde toezicht geschiedt met inachtneming van de in [paragraaf 3][ref2]
      daaromtrent gegeven voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel86a
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 86a
      - id: ref2
        bwb_id: BWBR0025735
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '35.1'
    text: |-
      Nadat een erkenning is verleend, wordt in het kader van het toezicht onderzocht of de erkenninghouder en de
      keuringsplaats nog voldoen aan de erkenningseisen en of de erkenningsvoorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel35
  - number: '35.2'
    text: Het in het eerste lid bedoelde toezicht kan tevens plaatsvinden in het kader van een steekproef van het voertuig.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel35
  - number: '36'
    text: |-
      Onverminderd het bepaalde in [artikel 31][ref1], wordt in het kader van het toezicht alle medewerking aan de
      daartoe aangewezen functionarissen van de Dienst Wegverkeer verleend. Hieronder wordt in ieder geval verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel31
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '31'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 36.a
    text: het verlenen van toegang tot de keuringsplaats, inrichting of mobiele keuringseenheid;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel36
  - number: 36.b
    text: het verstrekken van inlichtingen;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel36
  - number: 36.c
    text: het overleggen van bescheiden;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel36
  - number: 36.d
    text: het gebruik maken van de benodigde apparatuur;
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel36
  - number: 36.e
    text: het in acht nemen van door de betreffende functionaris van de Dienst Wegverkeer aangegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel36
  - number: '37.1'
    text: |-
      De Dienst Wegverkeer kan in het kader van het toezicht op de erkenninghouder of de keurmeester een systeem van
      bonus- en strafpunten vaststellen, dat wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel37
  - number: '37.2'
    text: |-
      Indien een systeem als bedoeld in het eerste lid is vastgesteld, wordt aan de hand daarvan, afhankelijk van de
      resultaten van het uitgeoefende toezicht, beoordeeld of het toezicht wordt verminderd of verscherpt dan wel of een
      erkenning of een keuringsbevoegdheid wordt gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel37
  - number: '38'
    text: |-
      De in deze paragraaf bepaalde eisen zijn, voor zover niet anders bepaald, tevens van toepassing op het toezicht
      op mobiele keuringseenheden en de inrichtingen waar met behulp van deze mobiele keuringseenheden keuringen worden
      verricht.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel38
  - number: '39.1'
    text: |-
      Deze paragraaf laat onverlet de bevoegdheid tot wijziging, schorsing of intrekking van de erkenning als omschreven
      in [artikel 87, van de wet][ref1], in andere gevallen dan die in deze paragraaf zijn beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '87'
  - number: '39.2'
    text: |-
      Een wijziging, schorsing of intrekking van een erkenning als bedoeld in [artikel 87, tweede lid, van de wet][ref1],
      geldt in beginsel uitsluitend voor de betrokken keuringsplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '87'
  - number: '39.3'
    text: |-
      In afwijking van het tweede lid kan de Dienst Wegverkeer, als omstandigheden daartoe aanleiding geven, bepalen
      dat een wijziging, schorsing of intrekking alle keuringsplaatsen of mobiele eenheden betreft waarvoor de erkenning
      geldt.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel39
  - number: '40'
    text: |-
      Bij schorsing van een erkenning kan worden bepaald dat, indien niet binnen een termijn van ten hoogste 12 weken
      wordt aangetoond dat weer aan de erkenningseisen of erkenningsvoorschriften wordt voldaan, alsnog wijziging of
      intrekking van de erkenning volgt.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel40
  - number: '41'
    text: |-
      Indien de in de [artikelen 25 tot en met 32][ref1] neergelegde verplichtingen of voorschriften niet worden
      nageleefd, wordt terstond begonnen met een procedure voor intrekking van de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel25
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: '42'
    text: |-
      De in [artikel 87 van de wet][ref1], bedoelde wijziging, schorsing of intrekking van de erkenning kan, indien de
      erkenningseis of het erkenningsvoorschrift waaraan niet wordt voldaan slechts betrekking heeft op het keuren van
      een bepaalde groep voertuigen, beperkt blijven tot het keuren van die desbetreffende groep voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '87'
  - number: '44'
    text: |-
      De in [artikel 87a van de wet][ref1] bedoelde intrekking van de bevoegdheid voertuigen aan een keuring te
      onderwerpen kan, indien de keuringsbevoegdheidseis, het keuringsbevoegdheidsvoorschrift of het keuringsvoorschrift
      waaraan niet wordt voldaan slechts betrekking heeft op het keuren van een bepaalde groep voertuigen, beperkt worden
      tot het keuren van die desbetreffende groep voertuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel87a
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 87a
  - number: '45.1'
    text: |-
      Indien er sprake is van een situatie waarin aan een of meer keuringsbevoegdheidseisen,
      keuringsbevoegdheidsvoorschriften of keuringsvoorschriften niet wordt voldaan, terwijl die situatie op korte
      termijn kan worden hersteld, kan, in plaats van intrekking van de bevoegdheid voertuigen aan een keuring te
      onderwerpen, overgegaan worden tot schorsing van de bevoegdheid voertuigen aan een keuring te onderwerpen voor een
      termijn van ten hoogste twaalf weken.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel45
  - number: '45.2'
    text: |-
      Wordt binnen de in het eerste lid genoemde termijn niet aangetoond dat wederom aan de keuringsbevoegdheidseisen,
      keuringsbevoegdheidsvoorschriften of keuringsvoorschriften wordt voldaan, dan volgt alsnog intrekking van de
      bevoegdheid voertuigen aan een keuring te onderwerpen.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel45
  - number: '46'
    text: |-
      Indien door de keurmeester de in de [artikelen 25 tot en met 32][ref1] neergelegde verplichtingen of voorschriften
      niet worden nageleefd, wordt terstond begonnen met een procedure voor intrekking van de bevoegdheid voertuigen aan
      een keuring te onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0025735#Artikel25
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0025735
        artikel: '25'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 46a
    text: |-
      Voor erkenningen verleend aan een natuurlijke of rechtspersoon voor één of meer in Nederland op naam van de
      erkenninghouder geregistreerde mobiele keuringseenheden afgegeven vóór 1 juli 2014, geldt dat hiervan tot 1 juli
      2025 gebruik kan worden gemaakt, mits wordt voldaan aan de eisen en voorschriften opgenomen in deze regeling.
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel46a
  - number: '47'
    text: |-
      Erkenningen en bevoegdheden die zijn verleend krachtens de [Erkenningsregeling APK][ref1], zoals die regeling
      luidde voor de inwerkingtreding van deze regeling, worden gelijkgesteld met erkenningen en bevoegdheden die zijn
      verleend krachtens deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0011158
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0011158
  - number: '48'
    text: |-
      Deze regeling treedt in werking op het tijdstip dat het
      [Besluit voertuigen][ref1] in werking treedt, met uitzondering van
      __REF001___________________________________________________________________________________________________________
      ________________________________________, dat in werking treedt op 1 januari 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0025554
      [ref2]: https://wetten.overheid.nl/BWBR0025735#Artikel30
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0025554
      - id: ref2
        bwb_id: BWBR0025735
        artikel: '30'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '49'
    text: 'Deze regeling wordt aangehaald als: Regeling erkenning en keuringsbevoegdheid APK.'
    url: https://wetten.overheid.nl/BWBR0025735/2021-01-01#Artikel49
