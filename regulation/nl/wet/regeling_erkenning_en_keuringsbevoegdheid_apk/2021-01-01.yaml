  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *adviespunt:* in het kader van een keuring geconstateerd te verwachten
      gebrek;
        - *afkeurpunt:* in het kader van een keuring geconstateerd gebrek;
        - *anonieme keuring:* keuring als bedoeld in [artikel 86a van de wet][ref1];
        - *bevoegdheidspas:* pas als bedoeld in [artikel 85a van de wet][ref2];
        - *boekwerk ‘Regelgeving APK’:* editie van het boekwerk ‘Regelgeving Algemene Periodieke Keuring’ of de via de
      website van de Dienst Wegverkeer bekendgemaakte ‘Regelgeving Algemene Periodieke Keuring’ die door de Dienst
      Wegverkeer is vastgesteld en geldig is op het moment van de keuring;
        - *erkenning APK:* een erkenning om keuringsrapporten af te geven voor motorrijtuigen en aanhangwagens, als bedoeld
      in [artikel 83 van de wet][ref3];
        - *erkenninghouder:* houder van een erkenning als bedoeld in [artikel 83 van de wet][ref4];
        - *exameninstantie:* door de Minister aangewezen instantie als bedoeld in
      [artikel 85a, derde lid, van de Wegenverkeerswet 1994][ref5];
        - *inrichting:* een bedrijf of bedrijven waarin een mobiele keuringseenheid gerechtigd is keuringen uit te voeren;
        - *kalibreren:* verrichten van handelingen die nodig zijn voor het bepalen van de waarden van de afwijking van
      een meetmiddel ten opzichte van een overeengekomen standaard, alsmede justeren indien de afwijking groter is dan
      is toegestaan;
        - *keuring:* periodieke keuring als bedoeld in [artikel 75 van de wet][ref6];
        - *keuringseisen:* op de desbetreffende voertuigcategorie toepasselijke permanente eisen in de
      [Regeling voertuigen][ref7];
        - *keuringsinstelling:* keuringsinstelling als bedoeld in [artikel 8.1.1 van de Regeling voertuigen][ref8];
        - *keuringsplaats:* een perceel of enkele kadastraal aangrenzende percelen waarop een erkenninghouder als bedoeld
      in [artikel 83 van de wet][ref9] de keuring verricht en waarbij de keuringsruimte kan bestaan uit één of meer
      besloten ruimten gelegen in één gebouw, dan wel in verscheidene belendende of nagenoeg belendende gebouwen, bedoeld
      om deel uit te maken van een keuringsplaats;
        - *keurmeester:* degene aan wie de bevoegdheid is verleend voertuigen aan een keuring te onderwerpen als bedoeld in
      [artikel 85a van de wet][ref10];
        - *mobiele keuringseenheid:* een keuringseenheid waarmee een erkenninghouder niet steeds in dezelfde inrichting,
      maar afwisselend in ten minste drie verschillende inrichtingen handelingen in het kader van periodieke keuringen
      mag verrichten;
        - *onderzoeksgerechtigde:* erkende onderneming of instelling als bedoeld in
      [artikel 8.1.1 van de Regeling voertuigen][ref11];
        - *reparatiepunt:* in het kader van een keuring gerepareerd gebrek;
        - *reparatieadviespunt:* in het kader van een keuring geconstateerd gebrek ten aanzien van de controlepunten
      opgenomen in [bijlage 1][ref12];
        - *resultaat van de keuring:* goedkeuring dan wel afkeuring, alsmede eventuele adviespunten, reparatieadviespunten,
      reparatiepunten, afkeurpunten en opmerkingen inzake de uitvoering van de keuring.
        - *steekproef:* de steekproefsgewijze herkeuring als bedoeld in [artikel 86 van de wet][ref13];
        - *wet:* [Wegenverkeerswet 1994](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel86a
