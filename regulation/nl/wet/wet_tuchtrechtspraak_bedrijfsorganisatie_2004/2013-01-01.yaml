  - number: '46'
    text: |-
      Voorzover in enig jaar de ontvangsten uit geldboeten de kosten van de tuchtrechtspraak overtreffen, geeft het
      bestuur van het betrokken bedrijfslichaam aan het saldo een bijzondere bestemming, welke de instemming behoeft van
      de Sociaal-Economische Raad.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel46
  - number: '47'
    text: |-
      1 Op de behandeling van op het tijdstip van inwerkingtreding van deze wet aanhangige tuchtzaken blijft de
      [Wet tuchtrechtspraak bedrijfsorganisatie][ref1] van toepassing.

      2 Naar aanleiding van overtredingen die zijn begaan voor de inwerkingtreding van deze wet, kunnen slechts de
      tuchtrechtelijke maatregelen bepaald in de [Wet tuchtrechtspraak bedrijfsorganisatie][ref2] worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002145
      [ref2]: https://wetten.overheid.nl/BWBR0002145
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0002145
      - id: ref2
        bwb_id: BWBR0002145
  - number: '48'
    text: |-
      De [Wet tuchtrechtspraak bedrijfsorganisatie][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002145
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002145
  - number: '53'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 [Artikel 7, eerste lid][ref1], treedt voor een bedrijfslichaam in werking

      a. zodra in een verordening van het bedrijfslichaam, dan wel, indien het een hoofdproductschap of hoofdbedrijfschap
      betreft, van een bedrijfslichaam dat van dat hoofdproductschap of hoofdbedrijfschap onderdeel uitmaakt, feiten
      zijn aangewezen waarop een tuchtrechtelijke maatregel is gesteld, tenzij bij die verordening overeenkomstig
      [artikel 7, tweede lid, onderdeel b][ref2], een ander tuchtgerecht is aangewezen, dan wel

      b. zodra het bedrijfslichaam dan wel een daarbij aangesloten bedrijfslichaam bij of krachtens de wet wordt belast
      met de handhaving van bepalingen, op de overtreding waarvan een tuchtrechtelijke maatregel is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0016341#Artikel7
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel53
