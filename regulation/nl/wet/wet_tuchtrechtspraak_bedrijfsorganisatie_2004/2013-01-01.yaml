      - id: ref3
        bwb_id: BWBR0016341
        artikel: '24'
        hoofdstuk: IV
  - number: '15'
    text: |-
      1 De voorzitter van het bedrijfslichaam, dat de desbetreffende verordening heeft vastgesteld, maakt de zaak binnen
      een redelijke termijn na de constatering van de overtreding bij het tuchtgerecht aanhangig door middel van een
      schriftelijke verklaring.

      2 De verklaring vermeldt de feiten waarvoor een tuchtrechtelijke maatregel wordt gevraagd. Bij de verklaring worden
      alle op de zaak betrekking hebbende stukken aan het tuchtgerecht overgelegd.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel15
  - number: '16'
    text: |-
      1 De betrokkene wordt binnen een termijn van ten hoogste acht weken nadat de zaak bij het tuchtgerecht aanhangig is
      gemaakt opgeroepen om op een door de voorzitter te bepalen dag en uur ter zitting te verschijnen.

      2 De oproeping wordt ten minste twee weken voor de dag van de zitting aan de betrokkene gezonden en vermeldt de
      plaats van de zitting.

      3 De oproeping gaat vergezeld van een afschrift van de in [artikel 15][ref1] bedoelde verklaring en van alle op de
      zaak betrekking hebbende stukken.

      4 De oproeping houdt in:

      a. de namen, het beroep en de woonplaats van de ter zitting opgeroepen getuigen en deskundigen;

      b. de mededeling, dat de betrokkene bevoegd is getuigen en deskundigen ter zitting mede te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel15
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '15'
        hoofdstuk: IV
  - number: '17'
    text: |-
      1 Het tuchtgerecht kan bevelen dat de betrokkene, dan wel, in het geval bedoeld in [artikel 6, derde lid][ref1],
      een bestuurder in persoon verschijnt.

      2 Indien de betrokkene, dan wel de bestuurder, wiens persoonlijke verschijning is bevolen, niet op de oproeping
      verschijnt, kan het tuchtgerecht de officier van justitie in het arrondissement waarin het tuchtgerecht zitting
      houdt, verzoeken de betrokkene, dan wel de bestuurder ter terechtzitting van het tuchtgerecht te dagvaarden en
      daarbij te voegen een bevel tot medebrenging.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel6
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '6'
        hoofdstuk: II
  - number: '18'
    text: |-
      1 De zitting is openbaar.

      2 Het tuchtgerecht kan bepalen dat de behandeling van de zaak geheel of gedeeltelijk met gesloten deuren
      plaatsvindt indien een openbare behandeling een goede rechtspleging of de belangen van de betrokkene ernstig zou
      schaden.

      3 Het tuchtgerecht houdt zitting met drie of vijf leden, onder wie de voorzitter of een plaatsvervangend
      voorzitter.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel18
  - number: '19'
    text: |-
      1 De voorzitter heeft de leiding van de zitting.

      2 De secretaris houdt aantekening van het verhandelde ter zitting.

      3 De secretaris maakt een proces-verbaal op van de zitting, indien het tuchtgerecht dit ambtshalve dan wel op
      verzoek van de betrokkene of de voorzitter van het betrokken bedrijfslichaam bepaalt en indien hoger beroep wordt
      ingesteld.

      4 Het proces-verbaal bevat de namen van de voorzitter en de leden die de zaak behandelen, die van partijen en van
      hun vertegenwoordigers of gemachtigden die op de zitting zijn verschenen en van degenen die hen hebben bijgestaan,
      en die van de getuigen, deskundigen en tolken die op de zitting zijn verschenen.

      5 Het proces-verbaal houdt een vermelding in van hetgeen op de zitting met betrekking tot de zaak is voorgevallen.

      6 Het proces-verbaal wordt door de voorzitter en de secretaris ondertekend.

      7 Aan het proces-verbaal kunnen overgelegde pleitnotities worden gehecht.

      8 Het tuchtgerecht kan bepalen dat de verklaring van een partij, getuige of deskundige geheel in het proces-verbaal
      zal worden opgenomen. In dat geval wordt de verklaring onverwijld op schrift gesteld en aan de partij, getuige of
      deskundige voorgelezen. Deze mag daarin wijzigingen aanbrengen, die op schrift worden gesteld en aan de partij,
      getuige of deskundige worden voorgelezen. De verklaring wordt door de partij, getuige of deskundige ondertekend.
      Heeft ondertekening niet plaats, dan wordt de reden daarvan in het proces-verbaal vermeld.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel19
  - number: '20'
    text: |-
      1 Het tuchtgerecht kan de behandeling ter zitting schorsen.

      2 In dat geval bepaalt het tuchtgerecht zo spoedig mogelijk het tijdstip waarop de behandeling wordt hervat en
      stelt de secretaris de betrokkene en de voorzitter van het bedrijfslichaam hiervan op de hoogte. Het tweede tot en
      met het vierde lid van [artikel 16][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel16
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '16'
        hoofdstuk: IV
  - number: '21'
    text: |-
      1 Het tuchtgerecht sluit het onderzoek ter zitting, wanneer het van oordeel is dat het is voltooid.

      2 Voordat het onderzoek ter zitting wordt gesloten, hebben de betrokkene en de voorzitter van het bedrijfslichaam
      het recht voor het laatst het woord te voeren.

      3 Zodra het onderzoek ter zitting is gesloten, deelt de voorzitter mee wanneer uitspraak zal worden gedaan.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel21
  - number: '22'
    text: |-
      1 De betrokkene kan, tenzij het tuchtgerecht beveelt, dat hij in persoon zal verschijnen, zich op de terechtzitting
      doen vertegenwoordigen door een advocaat, indien deze aldaar verklaart daartoe bepaaldelijk gevolmachtigd te zijn,
      of wel door een daartoe bij bijzondere volmacht schriftelijk gemachtigde.

      2 Het tuchtgerecht kan weigeren bepaalde personen, die niet zijn advocaat, als gemachtigde toe te laten. Bij
      zodanige weigering houdt het tuchtgerecht de zaak tot de volgende zitting aan.

      3 Het tuchtgerecht stelt de betrokkene van de aanhouding en de reden daarvan in kennis en roept hem tevens op om op
      de voor de zaak bepaalde nadere zitting in persoon of bij een andere gemachtigde tegenwoordig te zijn.

      4 De betrokkene kan zich te allen tijde door een raadsman doen bijstaan.

      5 Het tuchtgerecht kan weigeren bepaalde personen, die niet zijn advocaat, als raadsman toe te laten. Bij zodanige
      weigering houdt het tuchtgerecht op verzoek van de betrokkene de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel22
  - number: '23'
    text: |-
      Op verzoek van de betrokkene kan de voorzitter of elk van de leden die een zaak behandelen, worden gewraakt op
      grond van feiten en omstandigheden waardoor de onpartijdigheid van het tuchtgerecht schade zou kunnen lijden. De
      [artikelen 513 tot en met 515 van het Wetboek van Strafvordering][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel513
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '513'
  - number: '24'
    text: |-
      Op grond van feiten en omstandigheden als bedoeld in [artikel 23][ref1] kan de
      voorzitter of een lid die een zaak behandelt, verzoeken zich te mogen verschonen. De
      [artikelen 517, tweede en derde lid, tot en met 518 van het Wetboek van Strafvordering][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel517
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '23'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '517'
  - number: '25'
    text: |-
      1 Het tuchtgerecht kan ambtshalve of op verzoek van de betrokkene of de voorzitter van het bedrijfslichaam getuigen
      oproepen.

      2 Ieder, die als getuige is opgeroepen, is verplicht voor het tuchtgerecht te verschijnen.
      [Artikel 17, tweede lid][ref1], is van overeenkomstige toepassing.

      3 Met betrekking tot het horen van de getuigen en hun recht van verschoning zijn de
      [artikelen 217 tot en met 220 van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing.

      4 De voorzitter van het tuchtgerecht kan bepalen dat getuigen niet zullen worden gehoord dan na het afleggen van
      de eed of de belofte. Zij leggen in dat geval de eed of de belofte af dat zij zullen zeggen de gehele waarheid en
      niets dan de waarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '17'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '26'
    text: |-
      1 Het tuchtgerecht kan ambtshalve of op verzoek van de betrokkene of de voorzitter van het bedrijfslichaam
      deskundigen benoemen, teneinde het gerecht voor te lichten, zo nodig, met opdracht een onderzoek in te stellen en
      het gerecht een verslag uit te brengen.

      2 De deskundige is verplicht zijn taak onpartijdig en naar beste weten te verrichten. Ten aanzien van deskundigen
      en hun verhoor zijn de [artikelen 217 tot en met 220 van het Wetboek van Strafvordering][ref1] van overeenkomstige
      toepassing.

      3 Het tuchtgerecht kan de deskundige geheimhouding opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '27'
    text: |-
      1 Het tuchtgerecht doet schriftelijk uitspraak.

      2 De uitspraak houdt in de beslissing omtrent het opleggen van de tuchtrechtelijke maatregel, de gronden en de
      voorschriften waarop zij berust.

      3 Het tuchtgerecht spreekt de beslissing, bedoeld in het tweede lid, in het openbaar uit.

      4 In afwijking van het eerste lid kan het tuchtgerecht na sluiting van het onderzoek ter zitting onmiddellijk
      mondeling uitspraak doen.

      5 Van de mondelinge uitspraak wordt door de secretaris een proces-verbaal opgemaakt.

      6 De uitspraak wordt onverwijld aan de betrokkene en de voorzitter van het bedrijfslichaam gezonden.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel27
  - number: '28'
    text: |-
      1 Indien naar het oordeel van de voorzitter van het tuchtgerecht geen tuchtmaatregel of geen andere tuchtmaatregel
      dan een berisping of een geldboete van ten hoogste € 225 dient te worden opgelegd, kan de voorzitter de zaak zonder
      zitting afdoen. [Artikel 27][ref1] is van overeenkomstige toepassing.

      2 Tegen de uitspraak, bedoeld in het eerste lid, kan de betrokkene of de voorzitter van het bedrijfslichaam binnen
      zes weken na verzending van de uitspraak verzet doen. In dat geval vervalt de uitspraak en wordt de zaak verder
      overeenkomstig de [artikelen 16 tot en met 27][ref2] behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0016341#Artikel16
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '27'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0016341
        artikel: '16'
        hoofdstuk: IV
  - number: '29'
    text: |-
      1 Tegen de betrokkene die ter zitting niet is verschenen of, ingeval zijn persoonlijke verschijning niet is
      bevolen, zich niet heeft laten vertegenwoordigen, wordt verstek verleend.

      2 Tegen de bij verstek gegeven uitspraak kan de betrokkene binnen zes weken na verzending van de uitspraak
      verzet doen. In dat geval wordt de zaak overeenkomstig de [artikelen 16 tot en met 27][ref1] behandeld. Indien
      de betrokkene opnieuw niet ter zitting verschijnt, wordt in afwijking van het eerste lid niet opnieuw verstek
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel16
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '16'
        hoofdstuk: IV
  - number: '30'
    text: |-
      1 Op gezamenlijk verzoek van de voorzitter van het bedrijfslichaam en de eigenaar van het bedrijf waar de maatregel
      is opgelegd, kan het tuchtgerecht besluiten om de sanctie van het verscherpt toezicht op te heffen.

      2 De [artikelen 16][ref1], [18 tot en met 27][ref2] zijn van overeenkomstige toepassing, met dien verstande dat de
      beslissing van [artikel 27, tweede lid][ref3] ziet op het toe- of afwijzen van het verzoek.

      3 Tegen de uitspraak op het verzoek staat geen hoger beroep open.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0016341#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0016341#Artikel27
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '16'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0016341
        artikel: '18'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0016341
        artikel: '27'
        hoofdstuk: IV
  - number: '31'
    text: |-
      1 De betrokkene dan wel de voorzitter van het bedrijfslichaam kan binnen zes weken na de verzending van de
      uitspraak van het tuchtgerecht hoger beroep instellen bij het College, tenzij tegen die uitspraak verzet kan of kon
      worden gedaan.

      2 De voorzitter van het bedrijfslichaam kan voorts hoger beroep instellen tegen een uitspraak bij verstek, tenzij
      de betrokkene verzet doet. Het hoger beroep kan worden ingesteld binnen zes weken nadat de termijn voor het doen
      van verzet ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel31
  - number: '32'
    text: |-
      1 Het hoger beroep wordt ingesteld door het indienen van een beroepschrift bij het College.

      2 Het beroepschrift is ondertekend en bevat de gronden van het beroep.

      3 De griffier zendt binnen een week na ontvangst van het beroepschrift een afschrift daarvan aan het tuchtgerecht
      en aan de betrokkene, dan wel de voorzitter van het bedrijfslichaam.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel32
  - number: '33'
    text: |-
      Het tuchtgerecht doet binnen drie weken na ontvangst van het afschrift van het beroepschrift, bedoeld in het
      [derde lid van het voorgaande artikel][ref1], de stukken toekomen aan de griffier van het College.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel32
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '32'
        hoofdstuk: V
  - number: '34'
    text: |-
      1 Als het beroep kennelijk niet-ontvankelijk of kennelijk ongegrond is, kan het College of de president zonder
      nader onderzoek door het College uitspraak doen. De uitspraak wordt onverwijld aan de betrokkene, het tuchtgerecht
      en de voorzitter van het bedrijfslichaam gezonden.

      2 Tegen de uitspraak, bedoeld in het eerste lid, kan de betrokkene dan wel de voorzitter van het bedrijfslichaam
      binnen zes weken na de verzending van de uitspraak verzet doen bij het College. [Artikel 32][ref1] is van
      overeenkomstige toepassing.

      3 Het College verklaart het verzet niet-ontvankelijk, ongegrond of gegrond. Indien het verzet gegrond wordt
      verklaard, vervalt de uitspraak. De laatste zin van het eerste lid is van toepassing.

      4 Als het beroep kennelijk niet-ontvankelijk of ongegrond is, kan het College het verzet niet-ontvankelijk
      of ongegrond verklaren, echter niet dan na de betrokkene dan wel de voorzitter van het bedrijfslichaam in de
      gelegenheid te hebben gesteld te worden gehoord.

      5 De uitspraak op het verzet wordt onverwijld aan de betrokkene, het tuchtgerecht en de voorzitter van het
      bedrijfslichaam gezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel32
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '32'
        hoofdstuk: V
  - number: '35'
    text: |-
      1 Tenzij [artikel 34, eerste lid][ref1] wordt toegepast, bepaalt de president de dag voor de behandeling van
      de zaak. Betrokkene en de voorzitter van het bedrijfslichaam worden uitgenodigd om op een in de uitnodiging te
      vermelden plaats en tijdstip op een zittting van het College te verschijnen.

      2 Voor de behandeling ter terechtzitting worden de processtukken gedurende ten minste een week ter griffie
      of elders ter kosteloze inzage voor de betrokkene en de voorzitter van het bedrijfslichaam danwel voor hun
      gemachtigden nedergelegd. De nederlegging wordt door de griffier tijdig ter kennis van de betrokkene en van de
      voorzitter van het bedrijfslichaam gebracht.

      3 De in het vorige lid bedoelde termijn kan met toestemming van de betrokkene en de voorzitter van het
      bedrijfslichaam worden verkort.

      4 Is de termijn niet in acht genomen, dan bepaalt het College een nieuwe rechtsdag, tenzij de betrokkene in persoon
      of bij gemachtigde is verschenen. In dit laatste geval kan op zijn verzoek uitstel worden verleend.

      5 In de gevallen, waarin op de terechtzitting de behandeling van de zaak voor een bepaalde tijd wordt uitgesteld of
      geschorst, wordt geen nieuwe kennisgeving gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel34
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '34'
        hoofdstuk: V
  - number: '36'
    text: |-
      Op het rechtsgeding zijn de [artikelen 18 tot en met 26][ref1] van overeenkomstige toepassing, met dien verstande
      dat voor de «de betrokkene» telkens wordt gelezen: de betrokkene of de voorzitter van het bedrijfslichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel18
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '18'
        hoofdstuk: IV
  - number: '37'
    text: |-
      Aan de betrokkene of de voorzitter van het bedrijfslichaam dan wel aan hun gemachtigden en aan de raadsman wordt de
      gelegenheid gegeven het woord te voeren en de gronden van het beroep toe te lichten.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel37
  - number: '38'
    text: |-
      Na de behandeling van de zaak ter terechtzitting bepaalt de voorzitter de dag voor de uitspraak, tenzij het College
      onmiddellijk mondeling uitspraak doet.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel38
  - number: '39'
    text: |-
      1 Het College verklaart het beroep niet-ontvankelijk, ongegrond of gegrond.

      2 Indien het College niet voldoende is ingelicht, kan het bevelen, dat de behandeling der zaak op een nader te
      bepalen datum zal worden hervat.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel39
  - number: '40'
    text: |-
      1 Indien het College het beroep gegrond verklaart, vernietigt het de uitspraak van het tuchtgerecht. In dat
      geval doet het College de zaak zelf af of verwijst haar naar het betrokken tuchtgerecht om haar af te doen met
      inachtneming van de beslissing van het College.

      2 Indien een nader onderzoek noodzakelijk is en het College de zaak zelf afdoet, geschiedt de oproeping
      overeenkomstig [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel16
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0016341
        artikel: '16'
        hoofdstuk: IV
  - number: '41'
    text: |-
      1 Het College doet schriftelijk uitspraak.

      2 De uitspraak houdt in de beslissing omtrent het opleggen van de tuchtrechtelijke maatregel, de gronden en de
      voorschriften waarop zij berust.

      3 Het College spreekt de beslissing, bedoeld in het tweede lid, in het openbaar uit.

      4 In afwijking van het eerste lid kan het College na sluiting van het onderzoek ter zitting onmiddellijk mondeling
      uitspraak doen.

      5 Van de mondelinge uitspraak wordt door de griffier een proces-verbaal opgemaakt.

      6 De uitspraak wordt onverwijld aan de betrokkene, de voorzitter van het bedrijfslichaam en het tuchtgerecht
      gezonden.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel41
  - number: '42'
    text: |-
      De tenuitvoerlegging van uitspraken van een tuchtgerecht en van het College geschiedt op last van de voorzitter
      van het bedrijfslichaam. De voorzitter van het bedrijfslichaam kan niet van tenuitvoerlegging afzien, tenzij met
      goedkeuring van de voorzitter van het College.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel42
  - number: '43'
    text: Een uitspraak wordt niet ten uitvoer gelegd voordat zij onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel43
  - number: '44'
    text: |-
      1 De voorzitter van het bedrijfslichaam brengt binnen twee weken na het onherroepelijk worden van de uitspraak van
      het tuchtgerecht of van het College ter kennis van de betrokkene, binnen welke termijn hij de opgelegde geldboete,
      of de kosten van openbaarmaking van de uitspraak moet voldoen. Deze termijn kan op ten hoogste twee maanden worden
      gesteld en kan telkens worden verlengd, maar mag ook na verlenging niet langer zijn dan twee jaren.

      2 Bij gebreke van volledige betaling binnen de in het eerste lid bedoelde termijn wordt
      het niet betaalde bedrag ingevorderd op dezelfde wijze als de heffingen, bedoeld in
      [artikel 126, eerste lid van de Wet op de bedrijfsorganisatie][ref1]. [Artikel 127 van die wet][ref2] is van
      overeenkomstige toepassing.

      3 Het eerste en het tweede lid zijn van overeenkomstige toepassing op de kosten van de verscherpte controle,
      bedoeld in [artikel 2, eerste lid, onderdeel d][ref3], met dien verstande dat de termijn voor de kennisgeving van
      de betalingstermijn eerst aanvangt nadat de kosten zijn gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel127
      [ref3]: https://wetten.overheid.nl/BWBR0016341#Artikel2
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel44
    references:
