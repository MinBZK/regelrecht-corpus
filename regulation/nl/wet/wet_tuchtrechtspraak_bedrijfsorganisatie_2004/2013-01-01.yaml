        artikel: 46m
  - number: '13'
    text: |-
      1 De voorzitter, de leden en de secretaris ontvangen een bezoldiging van het betrokken bedrijfslichaam.

      2 De opgeroepen getuigen en deskundigen ontvangen ten laste van het betrokken bedrijfslichaam een vergoeding
      overeenkomstig het bepaalde bij of krachtens de [Wet tarieven in strafzaken][ref1].

      3 De Sociaal-Economische Raad stelt de bezoldiging, bedoeld in het eerste lid, bij verordening vast. Zodanige
      verordening behoeft de goedkeuring van de betrokken Ministers. De goedkeuring kan worden onthouden wegens strijd
      met het recht of het algemeen belang.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '14'
    text: |-
      1 De [artikelen 8 tot en met 13][ref1] zijn van overeenkomstige toepassing op de plaatsvervangers van de
      voorzitter, de leden en de secretaris.

      2 De [artikelen 23][ref2] en [24][ref3] zijn van overeenkomstige toepassing op de plaatsvervangers van de
      voorzitter en de leden.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0016341#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0016341#Artikel24
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel14
