  - number: '45'
    text: |-
      Indien in strijd met [artikel 42][ref1] van tenuitvoerlegging wordt afgezien of
      indien de in [artikel 44][ref2] gestelde termijnen niet in acht worden genomen, is
      [artikel 99, eerste lid, aanhef en onderdeel b, en tweede lid, van Wet op de bedrijfsorganisatie][ref3] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016341#Artikel42
