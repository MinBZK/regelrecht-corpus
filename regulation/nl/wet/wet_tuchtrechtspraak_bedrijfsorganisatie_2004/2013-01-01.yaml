preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met de verbreding van de toepassing van het tuchtrecht in
    de publiekrechtelijke bedrijfsorganisatie wenselijk is het tuchtprocesrecht te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. bedrijfslichaam: een bedrijfslichaam als bedoeld in
      [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref1];

      b. het College: het College van Beroep voor het bedrijfsleven.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
  - number: '2'
    text: |-
      1 De tuchtrechtelijke maatregelen in de zin van [artikel 104 van de Wet op de bedrijfsorganisatie][ref1], die op
      overtreding van verordeningen van een bedrijfslichaam kunnen worden gesteld, zijn:

      a. berisping;

      b. geldboete;

      c. openbaarmaking van de uitspraak op kosten van de betrokkene;

      d. het onder verscherpte controle stellen van het bedrijf van de betrokkene op zijn kosten voor ten hoogste twee
      jaren.

      2 De maatregel, bedoeld in het eerste lid, onderdeel d, kan slechts worden opgelegd op vordering van de voorzitter
      van het bedrijfslichaam die de zaak aanhangig heeft gemaakt. De vordering omschrijft de in het kader van de
      verscherpte controle te nemen maatregelen en bevat een raming van de kosten daarvan.

      3 De kosten van de verscherpte controle worden in de uitspraak op een bepaald bedrag geschat.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel104
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '104'
  - number: '3'
    text: |-
      De tuchtrechtelijke maatregel van berisping bestaat uit een schriftelijke of mondelinge vermaning tot de betrokkene
      in verband met het begane feit.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel3
  - number: '4'
    text: |-
      1 De geldboete bedraagt ten minste € 3 en ten hoogste een bedrag van de derde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1].

      2 Indien de waarde van de goederen, met betrekking tot welke een overtreding is begaan, of de waarde van het
      wederrechtelijk genoten voordeel dat geheel of gedeeltelijk door middel van de overtreding is verkregen, hoger is
      dan een kwart van de geldboete van de derde categorie, kan een geldboete worden opgelegd van ten hoogste de vierde
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].

      3 De geldboete kan geheel of gedeeltelijk voorwaardelijk worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '5'
    text: |-
      1 In de gevallen, waarin het tuchtgerecht de openbaarmaking van zijn uitspraak gelast, bepaalt het tevens de wijze,
      waarop aan die last uitvoering wordt gegeven.

      2 De kosten van openbaarmaking worden in de uitspraak op een bepaald bedrag geschat.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel5
  - number: '6'
    text: |-
      1 Indien een feit, dat tuchtrechtelijk kan worden afgedaan, wordt begaan door of vanwege een rechtspersoon of een
      vennootschap, wordt de tuchtrechtelijke vervolging ingesteld en worden maatregelen genomen tegen:

      a. die rechtspersoon of die vennootschap,

      b. hen, die tot het feit opdracht hebben gegeven of die feitelijk leiding hebben gehad bij het verboden handelen of
      nalaten, of

      c. beiden.

      2 Een feit wordt onder meer begaan door of vanwege een rechtspersoon of een vennootschap, indien het begaan wordt
      door personen, die hetzij uit hoofde van een dienstbetrekking, hetzij uit anderen hoofde handelen in de sfeer van
      de rechtspersoon of de vennootschap, ongeacht of deze personen ieder afzonderlijk het feit hebben begaan, dan wel
      bij hen gezamenlijk de elementen van dat feit aanwezig zijn.

      3 Indien een tuchtrechtelijke vervolging wordt ingesteld tegen een rechtspersoon of een vennootschap, wordt deze
      tijdens de vervolging vertegenwoordigd door de bestuurder en, indien er meer bestuurders zijn, door één dezer.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel6
  - number: '7'
    text: |-
      1 Een hoofdproductschap, een hoofdbedrijfschap en een product- of bedrijfschap dat geen onderdeel uitmaakt van een
      hoofdproduct- of hoofdbedrijfschap hebben een tuchtgerecht.

      2 Het tuchtgerecht oordeelt over feiten waarop een tuchtrechtelijke maatregel is gesteld:

      a. bij verordening van het bedrijfslichaam waarvoor het is ingesteld dan wel, indien het een hoofdproductschap of
      hoofdbedrijfschap betreft, van een bedrijfslichaam dat van dat hoofdproductschap of hoofdbedrijfschap onderdeel
      uitmaakt, voor zover in die verordening die bevoegdheid niet aan een ander tuchtgerecht is toebedeeld;

      b. bij verordening van een ander bedrijfslichaam, voor zover bij die verordening het tuchtgerecht daartoe is
      aangewezen;

      c. bij of krachtens de wet.

      3 De aanwijzing van een tuchtgerecht als bedoeld in het tweede lid, onderdeel b, behoeft de instemming van het
      bedrijfslichaam waarvoor dat tuchtgerecht is ingesteld.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel7
  - number: '8'
    text: Een tuchtgerecht heeft een voorzitter, leden en een secretaris.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel8
  - number: '9'
    text: |-
      1 De voorzitter en de secretaris voldoen aan de vereisten voor benoeming zoals vermeld in
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1].

      2 De voorzitter wordt voor de tijd van zes jaren op voordracht van het bestuur van het betrokken bedrijfslichaam
      bij koninklijk besluit benoemd.

      3 De leden en de secretaris worden voor de tijd van zes jaren door het bestuur van het betrokken bedrijfslichaam
      benoemd.

      4 De secretaris en de leden zijn voor hun werkzaamheden voor het tuchtgerecht uitsluitend verantwoording schuldig
      aan het tuchtgerecht.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel5
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '5'
  - number: '10'
    text: |-
      1 De voorzitter, de leden en de secretaris zijn geen lid van het bestuur van of werknemer bij enig bedrijfslichaam
      of lichaam als bedoeld in [artikel 110 van de Wet op de bedrijforganisatie][ref1].

      2 Tussen de voorzitter, de leden en de secretaris mag niet bestaan een duurzaam samenwerkingsverband terzake van
      ondernemingen die onder het betrokken bedrijfslichaam ressorteren of een verhouding van werkgever tot werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel110
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '110'
  - number: '11'
    text: |-
      De voorzitter, de leden en de secretaris zijn verplicht tot geheimhouding van de gegevens waarover zij bij de
      uitoefening van hun taak de beschikking krijgen en waarvan zij het vertrouwelijke karakter kennen of redelijkerwijs
      moeten vermoeden, behoudens voor zover enig wettelijk voorschrift hen tot mededeling verplicht of uit hun taak de
      noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel11
  - number: '12'
    text: |-
      1 De voorzitter, de leden en de secretaris wordt in ieder geval ontslag verleend met ingang van de eerste dag van
      de maand volgende op die waarin zij de leeftijd van zeventig jaren hebben bereikt. Zij kunnen op eigen verzoek
      tussentijds worden ontslagen.

      2 De voorzitter, de leden en de secretaris kunnen worden ontslagen op de gronden aangegeven in de
      [artikelen 46c, tweede lid][ref1], [46d, tweede lid][ref2], [46l, eerste en derde lid][ref3], en
      [46m van de Wet rechtspositie rechterlijke ambtenaren][ref4] en indien zij wegens ziekte ongeschikt zijn voor hun
      taak, mits de ongeschiktheid twee jaar onafgebroken heeft geduurd en herstel binnen zes maanden na de termijn van
      twee jaar redelijkerwijs niet is te verwachten.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
    url: https://wetten.overheid.nl/BWBR0016341/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
