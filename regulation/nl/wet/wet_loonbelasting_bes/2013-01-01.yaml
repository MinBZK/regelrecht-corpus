articles:
  - number: A
    text: |-
      De [hoofdstukken I][ref1] en [VIII van de Belastingwet BES][ref2] zijn van overeenkomstige toepassing op deze wet
      en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#HoofdstukI
      [ref2]: https://wetten.overheid.nl/BWBR0029244#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#ArtikelA
    references:
      - id: ref1
        bwb_id: BWBR0029244
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0029244
        hoofdstuk: VIII
  - number: '1'
    text: Onder de naam «loonbelasting» wordt een belasting van de werknemers geheven.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel1
  - number: '2.1'
    text: |-
      Werknemer is de natuurlijke persoon die tot een inhoudingsplichtige in dienstbetrekking staat of van een
      inhoudingsplichtige loon geniet uit een vroegere dienstbetrekking van hemzelf of van een ander.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel2
  - number: '2.2'
    text: 'Wie niet op de BES eilanden woont, wordt slechts als werknemer beschouwd voor zover hij:'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel2
  - number: 2.2.a
    text: |-
      zijn dienstbetrekking op de BES eilanden vervult, dan wel loon geniet uit een vroeger op de BES eilanden vervulde
      dienstbetrekking;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel2
  - number: 2.2.b
    text: |-
      in dienstbetrekking staat tot een publiekrechtelijk rechtspersoon naar het op de BES eilanden geldende recht, dan
      wel uit andere hoofde loon geniet van een zodanige rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel2
  - number: 2.2.c
    text: |-
      loon geniet uit een bestaande of vroegere functie door hemzelf of door een ander vervuld
      als bestuurder of commissaris van een op de BES eilanden gevestigd lichaam als bedoeld in
      [artikel 1.3, onderdeel c, van de Belastingwet BES][ref1], ook in geval van beperking van de bevoegdheid tot niet
      op de BES eilanden gelegen gedeelten van de onderneming van dat lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
  - number: '2.3'
    text: Krachtens wettelijk vruchtgenot aan een kind ontleent loon wordt geacht door het kind te zijn genoten.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel2
  - number: '2.4'
    text: |-
      Indien de dienstbetrekking als bedoeld in letter a van het tweede lid slechts tijdelijk geschiedt en korter
      dan drie maanden achtereen duurt, kan bij algemene maatregel van bestuur gehele of gedeeltelijke ontheffing van
      loonbelasting worden verleend.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel2
  - number: '2.5'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel2
  - number: '3.1'
    text: |-
      Als dienstbetrekking wordt beschouwd elke arbeidsverhouding, waarbij een gezagsverhouding bestaat tussen degene die
      werk opdraagt en degene die het uitvoert.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
  - number: '3.2'
    text: 'Onder dienstbetrekking wordt tevens verstaan de arbeidsverhouding van:'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
  - number: 3.2.a
    text: |-
      de bestuurder of commissaris van een op de BES eilanden gevestigd lichaam als bedoeld in
      [artikel 1.3, onderdeel c, van de Belastingwet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel1
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '1'
  - number: 3.2.b
    text: |-
      het kind van 14 jaar of ouder dat werkzaam is in de onderneming van zijn ouder, tenzij die onderneming mede voor
      zijn rekening wordt gedreven;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
  - number: 3.2.c
    text: personen die niet anders dan op provisiebasis werken;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
  - number: 3.2.d
    text: degene, die als artiest of beroepssportbeoefenaar optreedt en zijn woonplaats niet op de BES eilanden heeft;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
  - number: 3.2.e
    text: degene, wiens functie op een benoeming berust;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
  - number: 3.2.f
    text: |-
      degene die, anders dan in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een beroep, zich
      verbindt om persoonlijk een werk van stoffelijke aard uit te voeren tegen een te betalen prijs;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
  - number: 3.2.g
    text: degene die de in onderdeel f bedoelde persoon bij het tot stand brengen van dat werk bijstaat;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
  - number: 3.2.h
    text: |-
      degene die arbeid verricht ten behoeve van een lichaam waarin hij een aanmerkelijk belang als bedoeld in
      [artikel 11, derde lid, van de Wet inkomstenbelasting BES][ref1] heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel11
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '11'
  - number: '3.3'
    text: |-
      Het tweede lid, onderdelen f en g, vindt geen toepassing indien de in onderdeel f bedoelde verbintenis rechtstreeks
      is aangegaan met een natuurlijk persoon ten behoeve van diens persoonlijke aangelegenheden dan wel met het Rijk,
      Bonaire, Sint Eustatius of Saba.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
  - number: '3.4'
    text: |-
      Bij algemene maatregel van bestuur, kunnen bedrijfssectoren en -takken worden aangewezen ten aanzien waarvan het
      tweede lid, onderdelen f en g, niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
  - number: '3.5'
    text: |-
      Als loon van de in het tweede lid, onder f, bedoelde uitvoerder wordt aangemerkt het gehele door de aanbesteder
      verstrekte loon, verminderd met het loon van de hulpen. Deze vermindering is slechts van toepassing voor zover de
      uitvoerder aan de aanbesteder een door hem en zijn hulpen ondertekende verklaring doet toekomen waaruit het loon
      van ieder van de hulpen blijkt.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel3
  - number: '4.1'
    text: 'Inhoudingsplichtige is:'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: 4.1.a
    text: degene, tot wie één of meer personen in dienstbetrekking staan;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: 4.1.b
    text: degene, die aan één of meer personen loon uit vroegere dienstbetrekking tot hemzelf of tot een ander verstrekt.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: '4.2'
    text: |-
      Als degene, tot wie de dienstbetrekking bestaat, wordt beschouwd in de gevallen bedoeld in
      [artikel 3, tweede lid][ref1]. onder


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel3
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '3'
        hoofdstuk: I
  - number: 4.2.a
    text: het lichaam;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: 4.2.b
    text: de ouder;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: 4.2.c
    text: degene, van wie provisie genoten wordt;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: 4.2.d
    text: degene, met wie het optreden is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: 4.2.e
    text: degene, te wiens laste de betaling komt;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: 4.2.f
    text: de aanbesteder;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: 4.2.g
    text: de aanbesteder.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: '4.3'
    text: |-
      Degene tot wie een werknemer in dienstbetrekking staat wordt geacht aan de werknemer het loon te verstrekken dat
      deze uit hoofde van zijn dienstbetrekking geniet van een niet-inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: '4.4'
    text: |-
      Wie niet op de BES eilanden woont of gevestigd is, wordt slechts als inhoudingsplichtige beschouwd indien hij
      op de BES eilanden een vaste inrichting of vaste vertegenwoordiger heeft, dan wel op de BES eilanden één of meer
      personen in dienst heeft en door de Inspecteur als inhoudingsplichtige is aangewezen. Onverminderd het bepaalde in
      de vorige volzin worden ten aanzien van een niet op de BES eilanden wonende of gevestigde aannemer of onderaannemer
      als bedoeld in [artikel 8.68 van de Belastingwet BES][ref1] de werkzaamheden ten behoeve van het werk geacht
      te zijn verricht met behulp van een vaste inrichting op de BES eilanden indien de uitvoering van het werk langer
      duurt dan 30 dagen. Voor de toepassing van de eerste volzin worden organen of organisatieonderdelen van de Staat
      der Nederlanden geacht op de BES eilanden inhoudingsplichtig te zijn ten aanzien van personen die deze organen of
      organisatieonderdelen op de BES eilanden in dienst hebben en ter zake van het loon uit vroegere dienstbetrekking
      dat deze organen of organisatieonderdelen verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
  - number: '4.5'
    text: |-
      Diplomatieke, consulaire en andere vertegenwoordigers van vreemde mogendheden en hun toegevoegde ambtenaren,
      alsmede door Onze Minister aan te wijzen internationale organisaties en vertegenwoordigers en functionarissen
      daarvan, worden niet als inhoudingsplichtigen beschouwd. De consulaire vertegenwoordiger is evenwel
      inhoudingsplichtig, indien en voor zover hij naast het consulaire ambt een bedrijf of beroep uitoefent.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: '4.6'
    text: |-
      Ter vergemakkelijking van de heffing van de inkomstenbelasting kunnen bij algemene maatregel van bestuur, regels
      worden gegeven ingevolge welke loonbelasting mede wordt geheven van natuurlijke personen die:
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: 4.6.a
    text: termijnen van lijfrente of andere periodieke uitkeringen of verstrekkingen genieten;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: 4.6.b
    text: uitkeringen genieten ter vervanging van gederfde of te derven periodieke uitkeringen.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel4
  - number: '5'
    text: |-
      De belasting wordt geheven naar het zuiver voljaarsloon, bedoeld in [artikel 7, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel7
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '7'
        hoofdstuk: III
  - number: '6.1'
    text: Loon is al hetgeen onder welke naam of vorm ook uit een bestaande of vroegere dienstbetrekking wordt verkregen.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
  - number: '6.2'
    text: |-
      Degene, tot wie een werknemer in dienstbetrekking staat, wordt geacht de uitkeringen van ongevallengelden en
      ziekengelden ingevolge de [Wet ongevallenverzekering BES][ref1] en de [Wet ziekteverzekering BES][ref2], welke door
      zijn tussenkomst worden uitbetaald, als loon uit de dienstbetrekking te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0028497
      [ref2]: https://wetten.overheid.nl/BWBR0028728
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028497
      - id: ref2
        bwb_id: BWBR0028728
  - number: '6.3'
    text: 'Tot het loon worden niet gerekend:'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
  - number: 6.3.a
    text: |-
      de premies door de werkgevers betaald ingevolge de [Wet ongevallenverzekering BES][ref1] en de
      [Wet ziekteverzekering BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0028497
      [ref2]: https://wetten.overheid.nl/BWBR0028728
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028497
      - id: ref2
        bwb_id: BWBR0028728
  - number: 6.3.b
    text: |-
      eenmalige uitkeringen en verstrekkingen ter zake van het overlijden van de werknemer voor zover deze uitkeringen en
      verstrekkingen driemaal het loon over een maand niet overtreffen;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
  - number: 6.3.c
    text: |-
      de verplichte bijdragen voor pensioenen en aan pensioenfondsen die worden verrekend met de aan de werknemer,
      gewezen werknemer, zijn echtgenoot, zijn gewezen echtgenoot, zijn kinderen of pleegkinderen als bedoeld in
      [artikel 6a, eerste lid, onderdeel a][ref1], toekomende pensioenuitkeringen;


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6a
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: 6a
        hoofdstuk: II
  - number: 6.3.d
    text: de verplichte bijdragen van de werkgever voor pensioenen en aan pensioenfondsen;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
  - number: 6.3.e
    text: |-
      de door de werkgever ten behoeve van de werknemer gemaakte kosten in verband met geneeskundige behandeling
      en verpleging, alsmede de aanspraken van de werknemer op vrije geneeskundige behandeling en verpleging en op
      tegemoetkoming in ziektekosten;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
  - number: 6.3.f
    text: |-
      vergoedingen voor zover zij geacht kunnen worden te strekken tot bestrijding van kosten tot verwerving van het
      loon, behoudens ter zake van:
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
  - number: 6.3.f.1°
    text: |-
      posten als bedoeld in
      [artikel 9C, eerste lid, met uitzondering van onderdeel h, van de Wet inkomstenbelasting BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel9c
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: 9c
  - number: 6.3.f.2°
    text: |-
      vervoerskosten als bedoeld in [artikel 9C, derde lid, van de Wet inkomstenbelasting BES][ref1] voor zover meer
      wordt vergoed dan de aldaar genoemde prijs per kilometer;


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel9c
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: 9c
  - number: 6.3.f.3°
    text: vaste vergoedingen voor zover niet is voldaan aan door Onze Minister nader te stellen regels;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
  - number: 6.3.g
    text: |-
      uitkeringen en verstrekkingen tot vergoeding van door de werknemer in verband met zijn dienstbetrekking geleden
      schade aan of verlies van persoonlijke goederen;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
  - number: 6.3.h
    text: |-
      uitkeringen tot dekking van op de werknemer drukkende kosten van zijn opleiding of studie voor een beroep, alsmede
      verstrekkingen met betrekking tot zodanige opleiding of studie.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6
  - number: 6a.1
    text: 'Onder pensioenregeling wordt verstaan een regeling die uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6a
  - number: 6a.1.a
    text: |-
      ten doel heeft de verzorging van werknemers en gewezen werknemers bij invaliditeit of ouderdom en de verzorging van
      hun echtgenoten en gewezen echtgenoten en van hun kinderen en pleegkinderen die de leeftijd van 27 jaar nog niet
      hebben bereikt en niet gehuwd zijn of gehuwd zijn geweest; en
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6a
  - number: 6a.1.b
    text: |-
      een pensioen inhoudt dat niet uitgaat boven hetgeen naar maatschappelijke opvattingen, mede in verband met
      diensttijd en genoten beloningen redelijk moet worden geacht en waarvan het lichaam dat als verzekeraar van een
      pensioen optreedt de pensioenverplichting rekent tot het binnenlandse ondernemingsvermogen.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6a
  - number: 6a.2
    text: 'Onze Minister is bevoegd om:'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6a
  - number: 6a.2.a
    text: nadere regels te geven ten aanzien van het bepaalde in het eerste lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6a
  - number: 6a.2.b
    text: |-
      onder door hem te stellen voorwaarden, bepaalde regelingen of groepen van regelingen die afwijken van het in het
      eerste lid bepaalde, als pensioenregeling in de zin van dit artikel aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6a
  - number: 6b.1
    text: |-
      Ingeval van een gebeurtenis als hierna bedoeld, wordt op het onmiddellijk daaraan voorafgaande tijdstip de
      aanspraak aangemerkt als loon uit een vroegere dienstbetrekking van de werknemer of de gewezen werknemer dan wel,
      indien deze is overleden, van de gerechtigde tot de aanspraak:
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6b
  - number: 6b.1.a
    text: een aanspraak ingevolge een pensioenregeling is niet langer als zodanig aan te merken;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6b
  - number: 6b.1.b
    text: |-
      een aanspraak ingevolge een pensioenregeling wordt afgekocht of vervreemd dan wel formeel of feitelijk voorwerp
      van zekerheid;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6b
  - number: 6b.1.c
    text: |-
      een op de BES eilanden gevestigd lichaam dat als verzekeraar van een pensioen optreedt, houdt op op de BES
      eilanden te zijn gevestigd dan wel rekent de pensioenverplichting niet langer geheel tot het binnenlandse
      ondernemingsvermogen;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6b
  - number: 6b.1.d
    text: |-
      een aanspraak ingevolge een pensioenregeling wordt prijsgegeven, behoudens voor zover de aanspraak niet voor
      verwezenlijking vatbaar is.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6b
  - number: 6b.2
    text: |-
      Ingeval een verplichting ingevolge een pensioenregeling geheel of gedeeltelijk overgaat op een andere verzekeraar
      wordt de aanspraak ingevolge die regeling geacht te worden afgekocht. De eerste volzin is niet van toepassing voor
      zover deze verplichting geheel of gedeeltelijk overgaat naar een op de BES eilanden gevestigde verzekeraar die de
      pensioenverplichting rekent tot zijn binnenlands ondernemingsvermogen.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6b
  - number: 6b.3
    text: |-
      Onze Minister is bevoegd om, onder daarvoor te stellen voorwaarden, het tweede lid, laatste volzin, ook van
      toepassing te verklaren op een pensioenverplichting welke geheel of gedeeltelijk overgaat op een in Nederland,
      Aruba, Curaçao, Sint Maarten dan wel een verdragsland gevestigde verzekeraar.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6b
  - number: 6c.1
    text: |-
      Niet in geld genoten loon wordt in aanmerking genomen naar de waarde welke daaraan in het economische verkeer
      kan worden toegekend met dien verstande dat voor zover de verwerving van het loon het gebruik of verbruik daarvan
      meebrengt, de waarde wordt gesteld op ten hoogste het bedrag van de besparing.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6c
  - number: 6c.2
    text: |-
      In afwijking van het eerste lid wordt, ingeval aan een werknemer in verband met het verrichten van arbeid een
      personenauto ter beschikking is gesteld, tot de inkomsten uit arbeid gerekend ten minste het bedrag waarmee 15% van
      de nieuwwaarde, met inbegrip van de algemene bestedingsbelasting en invoerrechten, van de auto de vergoeding welke
      de werknemer ter zake van het gebruik, anders dan ten behoeve van het verrichten van arbeid, verschuldigd is, te
      boven gaat.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6c
  - number: 6c.3
    text: |-
      Een door de werknemer aan de inhoudingsplichtige betaalde vergoeding ter zake van het gebruik van de personenauto
      komt in mindering op de in de vorige volzin bedoelde bijtelling tot ten hoogste het bedrag van die bijtelling.
      Andere vergoedingen of gemaakte onkosten kunnen niet in mindering worden gebracht.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6c
  - number: 6c.4
    text: |-
      Voor de toepassing van dit artikel wordt met betrekking tot personenauto’s die voorafgaand aan de inwerkingtreding
      van de [Belastingwet BES][ref1] in het kentekenregister zijn geregistreerd onder algemene bestedingsbelasting mede
      verstaan: omzetbelasting en invoerheffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0029244
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0029244
  - number: 6c.5
    text: |-
      Onze Minister kan nadere regels geven met betrekking tot de waardering van aanspraken en van ander niet in geld
      genoten loon.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6c
  - number: 6c.6
    text: |-
      Onze Minister kan in bepaalde gevallen of groepen van gevallen regels geven met betrekking tot het bedrag aan
      fooien en dergelijke prestaties van derden dat geacht wordt te zijn genoten. Hij kan ook bepalen dat een bedrag ter
      zake niet tot het loon behoort.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel6c
  - number: '7.1'
    text: |-
      Het loon genoten over een ander loontijdvak dan een jaar wordt tot een voljaarsloon herleid. Loontijdvak is het
      tijdvak waarover het loon wordt verkregen. Bij die herleiding wordt voor:
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: 7.1.a
    text: halve-dagloners een jaar op 520 halve dagen gesteld;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: 7.1.b
    text: dagloners een jaar op 260 dagen gesteld;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: 7.1.c
    text: weekloners een jaar op 52 weken gesteld;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: 7.1.d
    text: twee weken (quincena)-loners een jaar op 26 quincena’s gesteld;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: 7.1.e
    text: maandloners een jaar op 12 maanden gesteld;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: 7.1.f
    text: kwartaalloners een jaar op 4 kwartalen gesteld;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: '7.2'
    text: Een loontijdvak van niet meer dan 4 uren wordt op een halve dag gesteld.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      Als voljaarsloon geldt voor de toepassing van deze wet het in het kalenderjaar te verkrijgen loon, indien over het
      gehele jaar van de inhoudingsplichtige loon zou worden verkregen. Hierbij wordt uitgegaan van het loon over het
      tijdvak, hetwelk bij de aanvang van het kalenderjaar wordt verkregen of zo de dienstbetrekking in de loop van het
      kalenderjaar is ontstaan, het loon over het tijdvak, bij de aanvang van de dienstbetrekking.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: '7.4'
    text: |-
      Het zuiver voljaarsloon wordt verkregen door het voljaarsloon te verminderen, indien het een dienstbetrekking
      betreft van:
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: 7.4.a
    text: |-
      een op de BES eilanden wonende werknemer: - met USD 280 ingeval van een bestaande dienstbetrekking, met dien
      verstande dat de aftrek niet meer bedraagt dan dat voljaarsloon;
        - met aan het loon verbonden verplichte bijdragen van de werknemer voor pensioen en pensioenfondsen;
        - met 5% tot een maximum bedrag van USD 470 voor de aan het loon verbonden verplichte bijdragen in spaar- en
      voorzieningsfondsen.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: 7.4.b
    text: |-
      een niet op de BES eilanden wonende werknemer: met USD 280 ingeval van een bestaande dienstbetrekking, met dien
      verstande dat de aftrek niet meer bedraagt dan dat voljaarsloon.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het bedrag van de verschuldigde belasting over een loontijdvak van een jaar wordt bepaald overeenkomstig de
      [artikelen 24][ref1] en [24A van de Wet inkomstenbelasting BES][ref2], met dien verstande dat in afwijking van
      artikel 24A, eerste lid, het bedrag van de over de belastbare som, bedoeld in artikel 24, verschuldigde belasting
      wordt bepaald door de belastbare som te vermenigvuldigen met een tarief van 30,4%, en dat geen vermindering
      plaatsvindt met het zuivere bedrag van de voordelen, bedoeld in [artikel 11, eerste lid, onder 3°][ref3], en met
      de opbrengst, bedoeld in [artikel 17, eerste lid, aanhef en onderdelen e en f, van die wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0029281#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0029281#Artikel17
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0029281
        artikel: 24a
      - id: ref3
        bwb_id: BWBR0029281
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0029281
        artikel: '17'
  - number: '8.2'
    text: |-
      Indien de werknemer over loontijdvakken die geheel of gedeeltelijk samenvallen loon geniet uit meer dan één
      dienstbetrekking of vroegere dienstbetrekking dan wel van meer dan één inhoudingsplichtige en dit loon voor de
      berekening van de belasting niet wordt samengevoegd, kan de werknemer de belastingvrije som, de kindertoeslag en de
      ouderentoeslag slechts in één dienstbetrekking dan wel tegenover één inhoudingsplichtige geldend maken.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel8
  - number: '8.3'
    text: |-
      Onze Minister is bevoegd met het oog op de uitvoering van deze wet ter nadere uitwerking van de tabel, bedoeld
      in [artikel 24A van de Wet inkomstenbelasting BES][ref1], loonbelastingtabellen, waaronder begrepen de tabel voor
      bijzondere beloningen, bedoeld in het vierde lid, vast te stellen voor loontijdvakken waarvoor bij deze nodig acht.
      Bij het opstellen van deze tabellen kunnen loonklassen en afrondingen worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24a
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: 24a
  - number: '8.4'
    text: |-
      Tantièmes, gratificaties, overwerkloon en andere beloningen welke gewoonlijk slechts éénmaal of éénmaal
      per jaar worden genoten worden belast volgens de tabel voor bijzondere beloningen. In deze tabel worden
      jaarlonen en belastingpercentages opgenomen. Bij elk jaarloon komt het belastingpercentage overeen met het
      percentage dat verschuldigd is van de laatste duizend dollar van 90% van het zuiver voljaarsloon, bedoeld in
      [artikel 7, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel7
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '7'
        hoofdstuk: III
  - number: '8.5'
    text: |-
      Indien dit niet tot een hoger belastingbedrag leidt mogen de in het vierde lid bedoelde beloningen worden beschouwd
      als een toevoeging aan het loon over het loontijdvak waarin zij worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel8
  - number: '8.6'
    text: 'In afwijking van het bepaalde in het derde lid wordt als jaarloon in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel8
  - number: 8.6.a
    text: |-
      het in dat jaar genoten loon ingeval de werknemer over het gehele voorafgaande kalenderjaar van de
      inhoudingsplichtige loon heeft genoten; of
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel8
  - number: 8.6.b
    text: |-
      het tot een jaarloon herleide bedrag van het in dat jaar genoten loon ingeval de werknemer over een gedeelte van
      het voorafgaande jaar van de inhoudingsplichtige loon heeft genoten.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      In afwijking van het in [artikel 8][ref1] bepaalde bedraagt de belasting 35,4% van het loon ingeval de werknemer
      zijn naam, adres of woonplaats niet aan de inhoudingsplichtige heeft verstrekt alsmede ingeval de werknemer ter
      zake onjuiste gegevens heeft verstrekt en de inhoudingsplichtige dit wist of redelijkerwijs had moeten weten.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel8
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '8'
        hoofdstuk: III
  - number: '9.2'
    text: |-
      In afwijking van het in [artikel 8][ref1] bepaalde bedraagt de belasting ten aanzien van de niet op de BES eilanden
      wonende artiest die een overeenkomst van korte duur om als musicus of anderszins als artiest op te treden is
      aangegaan, 10% van de som van het loon verminderd met de in [artikel 6, derde lid, onderdeel f][ref2], bedoelde
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029283#Artikel6
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '8'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0029283
        artikel: '6'
        hoofdstuk: II
  - number: 9a.1
    text: |-
      Ten aanzien van de werknemer die arbeid verricht ten behoeve van een lichaam waarin hij een aanmerkelijk
      belang heeft als bedoeld in [artikel 11, derde lid, van de Wet inkomstenbelasting BES][ref1], wordt het in
      een kalenderjaar genoten loon ten minste gesteld op USD 14 000 dan wel, indien aannemelijk is dat ter zake van
      soortgelijke dienstbetrekkingen waarbij een aanmerkelijk belang geen rol speelt, in het economische verkeer
      een lager loon gebruikelijk is, gesteld op dat lagere loon. Indien aannemelijk is dat ter zake van soortgelijke
      dienstbetrekkingen waarbij een aanmerkelijk belang geen rol speelt, in het economische verkeer een hoger loon
      gebruikelijk is, wordt het loon gesteld op een zodanig bedrag dat het niet meer in belangrijke mate afwijkt van
      hetgeen gebruikelijk is, met dien verstande dat – indien bij het lichaam of daarmee verbonden lichamen ook andere
      werknemers in dienst zijn – het niet lager wordt gesteld dan het hoogste loon van de overige werknemers. Ingeval
      aannemelijk is dat het loon, gelet op wat gebruikelijk is in het economische verkeer waarbij een aanmerkelijk
      belang geen rol speelt, op een lager bedrag behoort te worden gesteld dan het hoogste loon van de overige
      werknemers wordt het, in afwijking in zoverre van de vorige volzin, op een zodanig bedrag gesteld dat het niet meer
      in belangrijke mate afwijkt van hetgeen gebruikelijk is. Het loon wordt nimmer op een lager bedrag gesteld dan het
      bedrag ingevolge de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel11
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0029281
        artikel: '11'
  - number: 9a.2
    text: |-
      In afwijking in zoverre van het eerste lid wordt het in een kalenderjaar genoten loon in het jaar van oprichting
      van het lichaam en de drie daaropvolgende kalenderjaren op verzoek van de werknemer gesteld op het bedrag van de
      commerciële winst van het lichaam, doch niet op een lager bedrag dan nihil.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel9a
  - number: '10.1'
    text: De belasting wordt geheven door inhouding op het loon.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel10
  - number: '10.2'
    text: 'De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop het loon:'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel10
  - number: 10.2.a
    text: betaald of verrekend wordt, ter beschikking van de werknemer wordt gesteld of rentedragend wordt; dan wel
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel10
  - number: 10.2.b
    text: vorderbaar en tevens inbaar wordt.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel10
  - number: '10.3'
    text: |-
      Ingeval op grond van een verdrag of andere regeling ter voorkoming van dubbele belasting geen loonbelasting behoort
      te worden ingehouden, mag de inhoudingsplichtige de inhouding slechts achterwege laten, indien de werknemer hem een
      daartoe strekkende verklaring van de Inspecteur heeft doen toekomen.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel10
  - number: '10.4'
    text: |-
      Indien is overeengekomen dat het loon op een ongebruikelijk tijdstip zal worden genoten, wordt daarmee voor de
      toepassing van het tweede lid geen rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel10
  - number: '10.5'
    text: |-
      Voor zover ingevolge [artikel 9A][ref1] het loon hoger is dan het werkelijk genoten loon, wordt het meerdere geacht
      te zijn genoten bij het einde van het kalenderjaar of het einde van de dienstbetrekking zo deze in de loop van het
      kalenderjaar eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel9a
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: 9a
        hoofdstuk: III
  - number: '11'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel11
  - number: '12'
    text: |-
      Overtreft de belasting het van de inhoudingsplichtige genoten loon in geld, dan wordt het ontbrekende geacht te
      zijn ingehouden op het tijdstip omschreven in [artikel 10][ref1], met dien verstande dat de inhoudingsplichtige
      bevoegd is dat ontbrekende te verhalen op de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel10
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '10'
        hoofdstuk: III
  - number: 12a.1
    text: |-
      Indien de werknemer ook premieplichtig is voor de algemene ouderdomsverzekering BES en de algemene weduwen- en
      wezenverzekering BES, geschiedt de heffing van de belasting en de premies voor deze volksverzekeringen in één
      bedrag dan wel in één percentage, met overeenkomstige toepassing van de regels die gelden voor de heffing en de
      invordering van de loonbelasting.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel12a
  - number: 12a.2
    text: |-
      Voor gevallen waarin het eerste lid toepassing vindt, worden, met overeenkomstige toepassing van
      [artikel 8, derde lid][ref1], bij ministeriële regeling tabellen vastgesteld waarin telkens de belasting en de
      premies voor de algemene ouderdomsverzekering BES en de algemene weduwen- en wezenverzekering BES in één bedrag dan
      wel in één percentage worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel8
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '8'
        hoofdstuk: III
  - number: 12a.3
    text: |-
      Bij ministeriële regeling worden voor daarbij aan te wijzen gevallen berekeningsvoorschriften vastgesteld aan de
      hand waarvan uit de in het tweede lid bedoelde tabellen het bedrag van de belasting wordt afgeleid.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel12a
  - number: 12b.1
    text: |-
      Indien ten aanzien van de werknemer ook premieplicht voor de werknemersverzekeringen bestaat, geschiedt de heffing
      van de premies voor de werknemersverzekeringen gelijktijdig met die van de belasting en geschiedt de afdracht van
      die premies en de belasting op één aangifte, een en ander met overeenkomstige toepassing van de regels die gelden
      voor de heffing en de invordering van de loonbelasting.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel12b
  - number: 12b.2
    text: |-
      Toerekening van een betaling op de aangifte, bedoeld in het eerste lid, geschiedt naar evenredigheid aan de
      belasting en aan de premies voor de werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel12b
  - number: 12c.1
    text: |-
      Indien de werknemer ook verzekeringsplichtig is in de zin van het Besluit zorgverzekering BES, geschiedt de
      heffing van de premie die verschuldigd is ingevolge het Besluit zorgverzekering BES gelijktijdig met die van de
      belasting en geschiedt de afdracht van die premie en de belasting op één aangifte, een en ander met overeenkomstige
      toepassing van de regels die gelden voor de heffing en de invordering van de loonbelasting.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel12c
  - number: 12c.2
    text: |-
      Toerekening van een betaling op de aangifte, bedoeld in het eerste lid, geschiedt naar evenredigheid aan de
      belasting en aan de ingevolge het Besluit Zorgverzekering BES verschuldigde premie.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel12c
  - number: 12d
    text: |-
      Voor zover de belasting en de premies voor de volksverzekeringen, de premies voor de werknemersverzekeringen of de
      ingevolge het Besluit zorgverzekering BES verschuldigde premie gelijktijdig worden geheven en [artikel 8.22][ref1],
      [8.23][ref2] of [8.26 van de Belastingwet BES][ref3] toepassing vindt, wordt dat artikel slechts eenmaal toegepast,
      met dien verstande dat alsdan voor de toepassing van artikel 8.26, tweede lid, van Belastingwet BES wordt uitgegaan
      van het gezamenlijk gelijktijdig geheven bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8'
  - number: '19.1'
    text: 'De inhoudingsplichtige is gehouden:'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19
  - number: 19.1.a
    text: |-
      een loonboekhouding te voeren, waaruit duidelijk blijkt aan de hand waarvan en de wijze waarop de belasting werd
      berekend en ingehouden;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19
  - number: 19.1.b
    text: |-
      van de werknemer opgave te vragen van gegevens waarvan de kennisneming voor de heffing van de belasting van belang
      kan zijn;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19
  - number: 19.1.c
    text: |-
      aan de Inspecteur opgave te verstrekken van het in een kalenderjaar door de werknemer genoten loon, van de
      ingehouden belasting en van andere gegevens welke van belang kunnen zijn voor de heffing van de inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19
  - number: 19.1.d
    text: |-
      aan de werknemer opgave te verstrekken van het in een kalenderjaar genoten loon, van de ingehouden belasting en
      van andere gegevens welke van belang kunnen zijn voor de heffing van de inkomstenbelasting. Bij beëindiging van de
      dienstbetrekking in de loop van een kalenderjaar moet de verklaring desgevraagd worden gegeven over de tijd, waarin
      de werknemer in dat kalenderjaar bij hem in dienstbetrekking was. De verklaring wordt binnen tien dagen na het
      verzoek van de werknemer afgegeven.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19
  - number: '19.2'
    text: |-
      Om de gegevens bedoeld in het eerste lid, onderdeel b, te verkrijgen, reikt de inhoudingsplichtige aan de werknemer
      een loonbelastingverklaring uit:
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19
  - number: 19.2.a
    text: zodra hij ten aanzien van de werknemer inhoudingsplichtige wordt;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19
  - number: 19.2.b
    text: op verzoek van de werknemer;
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19
  - number: 19.2.c
    text: |-
      zodra hij weet dat zich een wijziging heeft voorgedaan in de gegevens die de werknemer in de laatst ingeleverde
      loonbelastingverklaring heeft verstrekt en die wijziging tot gevolg heeft dat de werknemer een hoger bedrag aan
      belasting wordt verschuldigd.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19
  - number: '19.3'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19
  - number: 19a.1
    text: |-
      De werknemer is verplicht aan de inhoudingsplichtige opgave te verstrekken van gegevens waarvan de kennisneming
      voor de heffing van de belasting van belang kan zijn.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19a
  - number: 19a.2
    text: |-
      De werknemer verzoekt de inhoudingsplichtige om uitreiking van een loonbelasting-verklaring indien zich een
      wijziging voordoet met betrekking tot de omstandigheden die voor de heffing van belang zijn.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19a
  - number: 19a.3
    text: |-
      De werknemer aan wie een loonbelastingverklaring is uitgereikt, is verplicht de daarbij gevraagde gegevens te
      verstrekken door de loonbelastingverklaring duidelijk, stellig en zonder voorbehoud ingevuld en ondertekend in te
      leveren bij de inhoudingsplichtige vóór de eerste loonverstrekking waarbij de te verstrekken gegevens van belang
      zijn voor de inhouding van belasting.
    url: https://wetten.overheid.nl/BWBR0029283/2013-01-01#Artikel19a
