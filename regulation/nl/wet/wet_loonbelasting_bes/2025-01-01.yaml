  - number: '1'
    text: Onder de naam «loonbelasting» wordt een belasting van de werknemer of diens inhoudingsplichtige geheven.
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel1
  - number: '2'
    text: |-
      1 Werknemer is de natuurlijke persoon die tot een inhoudingsplichtige in dienstbetrekking staat of van een
      inhoudingsplichtige loon geniet uit een vroegere dienstbetrekking van hemzelf of van een ander.

      2 Wie niet op de BES eilanden woont, wordt slechts als werknemer beschouwd voor zover hij:

      a. zijn dienstbetrekking op de BES eilanden vervult, dan wel loon geniet uit een vroeger op de BES eilanden
      vervulde dienstbetrekking;

      b. in dienstbetrekking staat tot een publiekrechtelijk rechtspersoon naar het op de BES eilanden geldende recht,
      dan wel uit andere hoofde loon geniet van een zodanige rechtspersoon;

      c. loon geniet uit een bestaande of vroegere functie door hemzelf of door een ander vervuld
      als bestuurder of commissaris van een op de BES eilanden gevestigd lichaam als bedoeld in
      [artikel 1.3, onderdeel c, van de Belastingwet BES][ref1], ook in geval van beperking van de bevoegdheid tot niet
      op de BES eilanden gelegen gedeelten van de onderneming van dat lichaam.

      3 Krachtens wettelijk vruchtgenot aan een kind ontleent loon wordt geacht door het kind te zijn genoten.

      4 Indien de dienstbetrekking als bedoeld in letter a van het tweede lid slechts tijdelijk geschiedt en korter
      dan drie maanden achtereen duurt, kan bij algemene maatregel van bestuur gehele of gedeeltelijke ontheffing van
      loonbelasting worden verleend.

      5 [vervallen]


