        artikel: 8a
        hoofdstuk: III
  - number: '9'
    text: |-
      1 In afwijking van de [artikelen 5][ref1], [8][ref2], [8a][ref3] en [8b][ref4] bedraagt de belasting het loon
      vermenigvuldigd met het hoogste in [artikel 24a, eerste lid, van de Wet inkomstenbelasting BES][ref5] in kolom IV
      vermelde percentage ingeval:

      a. de werknemer zijn naam, adres, woonplaats of het aan hem toegekende identificatienummer, bedoeld in
      [artikel 8.86, negende lid, van de Belastingwet BES][ref6], niet aan de inhoudingsplichtige heeft verstrekt;

      b. de werknemer ter zake van de inlichtingen, bedoeld in onderdeel a, onjuiste gegevens heeft verstrekt en de
      inhoudingsplichtige dit weet of redelijkerwijs moet weten.

      2 Indien de belasting ingevolge de [artikelen 12a][ref7] en [12c][ref8] in één bedrag met de premies voor
      de volksverzekeringen en de premie die verschuldigd is ingevolge het [Besluit zorgverzekering BES][ref9]
      wordt geheven, wordt in afwijking van het eerste lid het bedrag van de verschuldigde belasting tezamen
      met het bedrag van de verschuldigde premies voor de volksverzekeringen en de premie die verschuldigd
      is ingevolge het Besluit zorgverzekering BES gesteld op het loon vermenigvuldigd met het hoogste in
      [artikel 24a, eerste lid, van de Wet inkomstenbelasting BES][ref10] in kolom IV vermelde percentage.

      3 In afwijking van het in [artikel 8][ref11] bepaalde bedraagt de belasting ten aanzien van de niet op de BES
      eilanden wonende artiest die een overeenkomst van korte duur om als musicus of anderszins als artiest op te treden
      is aangegaan, 10% van de som van het loon.


