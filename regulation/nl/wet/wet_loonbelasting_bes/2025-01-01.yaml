  - number: 6e
    text: |-
      1 In geval van een bestaande dienstbetrekking heeft de werknemer recht op de vaste kostenaftrek.

      2 De vaste kostenaftrek over een loontijdvak van een jaar bedraagt USD 280, met dien verstande dat de vaste
      kostenaftrek niet meer bedraagt dan het in het loontijdvak genoten loon.

      3 Loontijdvak is het tijdvak waarover het loon wordt genoten.

      4 Indien het loon wordt genoten over een ander loontijdvak dan een jaar, wordt het bedrag, bedoeld in het tweede
      lid, herleid tot een bedrag voor het toepasselijke loontijdvak. Daarbij wordt een jaar op 260 dagen, een maand op
      65/3 dag, een week op 5 dagen en een tijdvak dat korter is dan een halve dag op een halve dag gesteld.
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel6e
  - number: '8'
    text: |-
      1 Het bedrag van de verschuldigde belasting over een loontijdvak van een jaar wordt bepaald overeenkomstig
      de [artikelen 24][ref1] en [24A van de Wet inkomstenbelasting BES][ref2], met dien verstande dat
      in afwijking van artikel 24A, eerste lid, geen vermindering plaatsvindt met het zuivere bedrag van
      de voordelen, bedoeld in [artikel 11, eerste lid, onder 3°][ref3], en met de opbrengst, bedoeld in
      [artikel 17, eerste lid, aanhef en onderdelen e en f, van die wet][ref4].

      2 Indien de werknemer over loontijdvakken die geheel of gedeeltelijk samenvallen loon geniet uit meer dan één
      dienstbetrekking of vroegere dienstbetrekking dan wel van meer dan één inhoudingsplichtige en dit loon voor de
      berekening van de belasting niet wordt samengevoegd, kan de werknemer de belastingvrije som en de ouderentoeslag
      slechts in één dienstbetrekking dan wel tegenover één inhoudingsplichtige geldend maken.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0029281#Artikel24a
      [ref3]: https://wetten.overheid.nl/BWBR0029281#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0029281#Artikel17
