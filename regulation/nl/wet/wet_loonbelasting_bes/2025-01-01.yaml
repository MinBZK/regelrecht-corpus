  - number: 8a
    text: |-
      1 Het bedrag van de belasting over een ander loontijdvak dan een jaar wordt door herleiding bepaald met
      overeenkomstige toepassing van [artikel 6e, vierde lid][ref1].

      2 Bij ministeriële regeling kunnen ter nadere uitvoering van deze wet loonbelastingtabellen worden vastgesteld voor
      loontijdvakken waarvoor Onze Minister dit nodig acht. In deze tabellen:

      a. wordt de belastingvrije som voor de loonbelasting op zodanige wijze verwerkt dat naast het bedrag aan loon het
      belastingbedrag of belastingpercentage is vermeld;

      b. kan de verwerking van de belastingvrije som geheel of ten dele achterwege worden gelaten;

      c. kan bij de verwerking van de belastingvrije som rekening worden gehouden met algemeen voorkomende beloningen die
      worden belast volgens een tabel voor bijzondere beloningen als bedoeld in [artikel 8b][ref2];

      d. kunnen loonklassen en afrondingen worden aangebracht.

      3 De loonbelastingtabellen worden vastgesteld op basis van de daarvoor benodigde gegevens zoals die vermoedelijk
      zullen luiden op het tijdstip van inwerkingtreding van de tabellen.

      4 Voor zover de bij vaststelling van de tabellen toegepaste gegevens zodanig afwijken van de gegevens zoals die
      luiden op het tijdstip van inwerkingtreding dat bij toepassing van laatstbedoelde gegevens andere tabellen zouden
      zijn vastgesteld, kunnen bij ministeriële regeling nieuwe tabellen worden vastgesteld, ingaande ten hoogste zes
      maanden na het tijdstip van inwerkingtreding, bedoeld in het derde lid, waarin de in de verstreken loontijdvakken
      ontstane afwijking zoveel mogelijk in de nog niet verstreken loontijdvakken van het kalenderjaar ongedaan wordt
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6e
      [ref2]: https://wetten.overheid.nl/BWBR0029283#Artikel8b
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel8a
