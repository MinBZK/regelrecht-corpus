  - number: '6'
    text: |-
      1 Loon is al hetgeen onder welke naam of vorm ook uit een bestaande of vroegere dienstbetrekking wordt verkregen.

      2 Tot het loon behoren aanspraken om na verloop van tijd of onder een voorwaarde een of meer uitkeringen of
      verstrekkingen te ontvangen, waaronder rechten van werknemers op een of meer uitkeringen uit een spaar- en
      voorzieningsfonds.

      3 Tot het loon behoren uitkeringen en verstrekkingen ingevolge een tot het loon behorende aanspraak voor zover
      de aanspraak in afwijking van hetgeen bij of krachtens deze wet is bepaald, bij de bepaling van de verschuldigde
      belasting niet als loon in aanmerking is genomen.

      4 Degene, tot wie een werknemer in dienstbetrekking staat, wordt geacht de uitkeringen van ongevallengelden en
      ziekengelden ingevolge de [Wet ongevallenverzekering BES][ref1] en de [Wet ziekteverzekering BES][ref2], welke door
      zijn tussenkomst worden uitbetaald, als loon uit de dienstbetrekking te verstrekken.

      5 Tot het loon behoren niet:

      a. aanspraken ingevolge de [Wet ziekteverzekering BES][ref3], de [Wet ongevallenverzekering BES][ref4] en de
      [Cessantiawet BES][ref5];

      b. aanspraken die naar aard en strekking overeenkomen met aanspraken als bedoeld in onderdeel a;

      c. aanspraken ingevolge een pensioenregeling;

      d. aanspraken op uitkeringen wegens overlijden of invaliditeit ten gevolge van een ongeval;

      e. eenmalige uitkeringen en verstrekkingen ter zake van het overlijden van de werknemer voor zover deze uitkeringen
      en verstrekkingen driemaal het loon over een maand niet overtreffen, alsmede aanspraken op de hiervoor bedoelde
      uitkeringen en verstrekkingen;

      f. de door de werkgever ten behoeve van de werknemer gemaakte kosten in verband met geneeskundige behandeling
      en verpleging, alsmede de aanspraken van de werknemer op vrije geneeskundige behandeling en verpleging en op
      tegemoetkoming in ziektekosten;

      g. vergoedingen voor zover zij geacht kunnen worden te strekken tot bestrijding van kosten tot verwerving van het
      loon, behoudens ter zake van:

      1°. posten als bedoeld in [artikel 9c, eerste lid, van de Wet inkomstenbelasting BES][ref6], met uitzondering van
      onderdeel h daarvan;

      2°. vervoerskosten als bedoeld in [artikel 9c, derde lid, van de Wet inkomstenbelasting BES][ref7] voor zover meer
      wordt vergoed dan de aldaar genoemde prijs per kilometer;

      3°. vaste vergoedingen voor zover niet is voldaan aan door Onze Minister nader te stellen regels;

      h. uitkeringen en verstrekkingen tot vergoeding van door de werknemer in verband met zijn dienstbetrekking geleden
      schade aan of verlies van persoonlijke goederen;

      i. uitkeringen tot dekking van op de werknemer drukkende kosten van zijn opleiding of studie voor een beroep,
      alsmede verstrekkingen met betrekking tot zodanige opleiding of studie;

      j. bedragen die worden ingehouden:

      1°. als bijdrage ingevolge een pensioenregeling;

      2°. als bijdrage voor aanspraken die ingevolge de onderdelen b en d niet tot het loon behoren.

      6 Bij ministeriële regeling kan worden bepaald dat eveneens niet tot het loon behoren andere aanspraken dan bedoeld
      in het vijfde lid.


