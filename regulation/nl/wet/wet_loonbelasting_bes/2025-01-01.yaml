      1 De belasting wordt geheven over het belastbaar loon.

      2 Belastbaar loon is het loon verminderd met de vaste kostenaftrek, bedoeld in [artikel 6e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6e
