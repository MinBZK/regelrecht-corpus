  - number: '4'
    text: |-
      1 Inhoudingsplichtige is:

      a. degene, tot wie één of meer personen in dienstbetrekking staan;

      b. degene, die aan één of meer personen loon uit vroegere dienstbetrekking tot hemzelf of tot een ander verstrekt.

      2 Als degene, tot wie de dienstbetrekking bestaat, wordt beschouwd in de gevallen bedoeld in
      [artikel 3, tweede lid][ref1]. onder

      a. het lichaam;

      b. de ouder;

      c. degene, van wie provisie genoten wordt;

      d. degene, met wie het optreden is overeengekomen;

      e. degene, te wiens laste de betaling komt;

      f. de aanbesteder;

      g. de aanbesteder;

      h. het lichaam.

      3 Degene tot wie een werknemer in dienstbetrekking staat wordt geacht aan de werknemer het loon te verstrekken dat
      deze uit hoofde van zijn dienstbetrekking geniet van een niet-inhoudingsplichtige;

      4 Wie niet op de BES eilanden woont of gevestigd is, wordt slechts als inhoudingsplichtige beschouwd indien hij
      op de BES eilanden een vaste inrichting of vaste vertegenwoordiger heeft, dan wel op de BES eilanden één of meer
      personen in dienst heeft en door de Inspecteur als inhoudingsplichtige is aangewezen. Onverminderd het bepaalde in
      de vorige volzin worden ten aanzien van een niet op de BES eilanden wonende of gevestigde aannemer of onderaannemer
      als bedoeld in [artikel 8.68 van de Belastingwet BES][ref2] de werkzaamheden ten behoeve van het werk geacht
      te zijn verricht met behulp van een vaste inrichting op de BES eilanden indien de uitvoering van het werk langer
      duurt dan 30 dagen. Voor de toepassing van de eerste volzin worden organen of organisatieonderdelen van de Staat
      der Nederlanden geacht op de BES eilanden inhoudingsplichtig te zijn ten aanzien van personen die deze organen of
      organisatieonderdelen op de BES eilanden in dienst hebben en ter zake van het loon uit vroegere dienstbetrekking
      dat deze organen of organisatieonderdelen verstrekken.

      5 Diplomatieke, consulaire en andere vertegenwoordigers van vreemde mogendheden en hun toegevoegde ambtenaren,
      alsmede door Onze Minister aan te wijzen internationale organisaties en vertegenwoordigers en functionarissen
      daarvan, worden niet als inhoudingsplichtigen beschouwd. De consulaire vertegenwoordiger is evenwel
      inhoudingsplichtig, indien en voor zover hij naast het consulaire ambt een bedrijf of beroep uitoefent.

      6 Ter vergemakkelijking van de heffing van de inkomstenbelasting kunnen bij algemene maatregel van bestuur, regels
      worden gegeven ingevolge welke loonbelasting mede wordt geheven van natuurlijke personen die:

      a. termijnen van lijfrente of andere periodieke uitkeringen of verstrekkingen genieten;

      b. uitkeringen genieten ter vervanging van gederfde of te derven periodieke uitkeringen.


