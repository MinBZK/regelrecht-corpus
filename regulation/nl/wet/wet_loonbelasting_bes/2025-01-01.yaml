  - number: '3'
    text: |-
      1 Als dienstbetrekking wordt beschouwd elke arbeidsverhouding, waarbij een gezagsverhouding bestaat tussen degene
      die werk opdraagt en degene die het uitvoert.

      2 Onder dienstbetrekking wordt tevens verstaan de arbeidsverhouding van:

      a. de bestuurder of commissaris van een op de BES eilanden gevestigd lichaam als bedoeld in
      [artikel 1.3, onderdeel c, van de Belastingwet BES][ref1];

      b. het kind van 14 jaar of ouder dat werkzaam is in de onderneming van zijn ouder, tenzij die onderneming mede voor
      zijn rekening wordt gedreven;

      c. personen die niet anders dan op provisiebasis werken;

      d. degene, die als artiest of beroepssportbeoefenaar optreedt en zijn woonplaats niet op de BES eilanden heeft;

      e. degene, wiens functie op een benoeming berust;

      f. degene die, anders dan in de uitoefening van een bedrijf of in de zelfstandige uitoefening van een beroep, zich
      verbindt om persoonlijk een werk van stoffelijke aard uit te voeren tegen een te betalen prijs;

      g. degene die de in onderdeel f bedoelde persoon bij het tot stand brengen van dat werk bijstaat;

      h. degene die arbeid verricht ten behoeve van een lichaam waarin hij of zijn partner als
      bedoeld in [artikel 6d, vijfde lid, onderdeel a][ref2], een aanmerkelijk belang als bedoeld in
      [artikel 11, derde lid, van de Wet inkomstenbelasting BES][ref3] heeft.

      3 Het tweede lid, onderdelen f en g, vindt geen toepassing indien de in onderdeel f bedoelde verbintenis
      rechtstreeks is aangegaan met een natuurlijk persoon ten behoeve van diens persoonlijke aangelegenheden dan wel met
      het Rijk, Bonaire, Sint Eustatius of Saba.

      4 Bij algemene maatregel van bestuur, kunnen bedrijfssectoren en -takken worden aangewezen ten aanzien waarvan het
      tweede lid, onderdelen f en g, niet van toepassing is.

      5 Als loon van de in het tweede lid, onder f, bedoelde uitvoerder wordt aangemerkt het gehele door de aanbesteder
      verstrekte loon, verminderd met het loon van de hulpen. Deze vermindering is slechts van toepassing voor zover de
      uitvoerder aan de aanbesteder een door hem en zijn hulpen ondertekende verklaring doet toekomen waaruit het loon
      van ieder van de hulpen blijkt.


