        bwb_id: BWBR0029283
        artikel: 6d
        hoofdstuk: II
  - number: '11'
    text: |-
      1 De belasting wordt geheven door inhouding op het loon.

      2 De inhoudingsplichtige is verplicht de belasting in te houden op het tijdstip waarop het loon geacht wordt te
      zijn genoten.

      3 De inhouding vindt plaats volgens de op het tijdstip van inhouding voor de werknemer geldende loonbelastingtabel.

      4 De inhoudingsplichtige is verplicht de in een tijdvak ingehouden belasting op aangifte af te dragen.
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel11
  - number: '12'
    text: |-
      Overtreft de belasting het van de inhoudingsplichtige genoten loon in geld, dan wordt het ontbrekende geacht
      te zijn ingehouden op het tijdstip omschreven in [artikel 11, tweede lid][ref1], met dien verstande dat de
      inhoudingsplichtige bevoegd is dat ontbrekende te verhalen op de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel11
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '11'
        hoofdstuk: IV
  - number: 12a
    text: |-
      1 Indien de werknemer ook premieplichtig is voor de algemene ouderdomsverzekering BES en de algemene weduwen-
      en wezenverzekering BES, geschiedt de heffing van de belasting en de premies voor deze volksverzekeringen in één
      bedrag dan wel in één percentage, met overeenkomstige toepassing van de regels die gelden voor de heffing en de
      invordering van de loonbelasting.

      2 Voor gevallen waarin het eerste lid toepassing vindt, worden, met overeenkomstige toepassing van
      [artikel 8a, tweede tot en met vierde lid][ref1], en [artikel 8b, eerste lid][ref2], bij ministeriële regeling
      tabellen vastgesteld waarin telkens de belasting en de premies voor de volksverzekeringen in één bedrag dan wel in
      één percentage worden opgenomen.

      3 Bij ministeriële regeling worden voor daarbij aan te wijzen gevallen berekeningsvoorschriften vastgesteld aan de
      hand waarvan uit de in het tweede lid bedoelde tabellen het bedrag van de belasting wordt afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel8a
      [ref2]: https://wetten.overheid.nl/BWBR0029283#Artikel8b
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: 8a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0029283
        artikel: 8b
        hoofdstuk: III
  - number: 12b
    text: |-
      1 Indien ten aanzien van de werknemer ook premieplicht voor de werknemersverzekeringen bestaat, geschiedt de
      heffing van de premies voor de werknemersverzekeringen gelijktijdig met die van de belasting en geschiedt de
      afdracht van die premies en de belasting op één aangifte, een en ander met overeenkomstige toepassing van de regels
      die gelden voor de heffing en de invordering van de loonbelasting.

      2 Toerekening van een betaling op de aangifte, bedoeld in het eerste lid, geschiedt naar evenredigheid aan de
      belasting en aan de premies voor de werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel12b
  - number: 12c
    text: |-
      1 Indien de werknemer ook verzekeringsplichtig is in de zin van het Besluit zorgverzekering BES, geschiedt de
      heffing van de premie die verschuldigd is ingevolge het Besluit zorgverzekering BES gelijktijdig met die van de
      belasting en geschiedt de afdracht van die premie en de belasting op één aangifte, een en ander met overeenkomstige
      toepassing van de regels die gelden voor de heffing en de invordering van de loonbelasting.

      2 Toerekening van een betaling op de aangifte, bedoeld in het eerste lid, geschiedt naar evenredigheid aan de
      belasting en aan de ingevolge het Besluit Zorgverzekering BES verschuldigde premie.
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel12c
  - number: 12d
    text: |-
      Voor zover de belasting en de premies voor de volksverzekeringen, de premies voor de werknemersverzekeringen of de
      ingevolge het Besluit zorgverzekering BES verschuldigde premie gelijktijdig worden geheven en [artikel 8.22][ref1],
      [8.23][ref2] of [8.26 van de Belastingwet BES][ref3] toepassing vindt, wordt dat artikel slechts eenmaal toegepast,
      met dien verstande dat alsdan voor de toepassing van artikel 8.26, tweede lid, van Belastingwet BES wordt uitgegaan
      van het gezamenlijk gelijktijdig geheven bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8.22
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8.23
      [ref3]: https://wetten.overheid.nl/BWBR0029244#Artikel8.26
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel12d
    references:
      - id: ref1
        bwb_id: BWBR0029244
        artikel: '8.22'
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8.23'
      - id: ref3
        bwb_id: BWBR0029244
        artikel: '8.26'
  - number: '19'
    text: |-
      1 De inhoudingsplichtige is gehouden volgens bij ministeriële regeling te stellen regels:

      a. een loonadministratie te voeren en daarbij de gegevens te administreren met betrekking tot de door bij
      ministeriële regeling aan te wijzen uitkeringen en verstrekkingen welke ingevolge [artikel 6, vijfde lid][ref1],
      niet tot het loon behoren;

      b. van de werknemer opgave te vragen van gegevens waarvan de kennisneming voor de heffing van de belasting van
      belang kan zijn;

      c. aan de Inspecteur opgave te verstrekken van het in een kalenderjaar door de werknemer genoten loon, van de
      ingehouden belasting en van andere gegevens welke van belang kunnen zijn voor de heffing van de inkomstenbelasting;

      d. aan de werknemer opgave te verstrekken van het in een kalenderjaar genoten loon, van de ingehouden belasting en
      van andere gegevens welke van belang kunnen zijn voor de heffing van de inkomstenbelasting. Bij beëindiging van de
      dienstbetrekking in de loop van een kalenderjaar moet de verklaring desgevraagd worden gegeven over de tijd, waarin
      de werknemer in dat kalenderjaar bij hem in dienstbetrekking was. De verklaring wordt binnen tien dagen na het
      verzoek van de werknemer afgegeven;

      e. aan de inspecteur mededeling te doen omtrent het einde van zijn inhoudingsplicht.

      2 Het eerste lid is niet van toepassing ten aanzien van de werknemer die niet op de BES eilanden woont en die
      werkzaamheden verricht of heeft verricht in een geheel buiten de BES eilanden vervulde dienstbetrekking, indien
      het heffingsrecht over het loon uit die dienstbetrekking op grond van een verdrag of regeling ter voorkoming
      van dubbele belasting niet aan de BES eilanden is toegewezen en de werknemer niet premieplichtig is voor de
      volksverzekeringen en de zorgverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel6
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '6'
        hoofdstuk: II
  - number: 19a
    text: |-
      1 De werknemer is verplicht volgens bij ministeriële regeling te stellen regels:

      a. opgave te verstrekken van gegevens waarvan de kennisneming voor de heffing van de belasting van belang kan zijn;

      b. de inhoudingsplichtige om uitreiking van een loonbelastingverklaring te verzoeken indien zich een wijziging
      voordoet met betrekking tot de omstandigheden die voor de heffing van belang zijn.

      2 Tot de gegevens, bedoeld in het eerste lid, en in [artikel 19, eerste lid, onderdeel b][ref1],
      wordt mede gerekend het aan de werknemer toegekende identificatienummer, bedoeld in
      [artikel 8.86, negende lid, van de Belastingwet BES][ref2].

      3 Het eerste en tweede lid zijn niet van toepassing ten aanzien van de werknemer die niet op de BES eilanden woont
      en die werkzaamheden verricht of heeft verricht in een geheel buiten de BES eilanden vervulde dienstbetrekking,
      indien het heffingsrecht over het loon uit die dienstbetrekking op grond van een verdrag of regeling ter voorkoming
      van dubbele belasting niet aan de BES eilanden is toegewezen en de werknemer niet premieplichtig is voor de
      volksverzekeringen en de zorgverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0029244#Artikel8.86
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '19'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0029244
        artikel: '8.86'
  - number: '20'
    text: |-
      Eindheffingsbestanddelen zijn bestanddelen van het loon waarover de verschuldigde belasting niet is geheven, in
      verband waarmee aan de inhoudingsplichtige een naheffingsaanslag wordt opgelegd, behoudens:

      a. voor zover de inhoudingsplichtige verzoekt, onder verstrekking van de daartoe noodzakelijke gegevens, dat loon
      niet als eindheffingsbestanddeel aan te merken;

      b. voor zover de inspecteur bij voor bezwaar vatbare beschikking besluit, mede gelet op het aantal werknemers
      waarop de naheffingsaanslag betrekking heeft, dat loon niet als eindheffingsbestanddeel aan te merken omdat het
      wel toepassen daarvan zou kunnen leiden tot een zodanig grote afwijking van het belastbare inkomen in de zin van
      de inkomstenbelasting van een of meer werknemers dat voor hen aanzienlijke voordelen zouden kunnen ontstaan in het
      kader van de heffing van die belasting, van andere belastingen of in het kader van andere wettelijke regelingen.
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel20
  - number: '21'
    text: |-
      In afwijking van het bij of krachtens deze wet bepaalde wordt de belasting over eindheffingsbestanddelen als
      bedoeld in [artikel 20][ref1] geheven van de inhoudingsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel20
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0029283
        artikel: '20'
        hoofdstuk: V
  - number: 21a
    text: |-
      1 Met betrekking tot eindheffingsbestanddelen wordt het bedrag van de verschuldigde belasting bepaald aan de hand
      van het gebruteerde tarief.

      2 Bij de toepassing van het gebruteerde tarief wordt het bedrag van de verschuldigde
      belasting bepaald aan de hand van de voor het tijdvak waarin het loon is genoten geldende in
      [artikel 24a, eerste lid, van de Wet inkomstenbelasting BES][ref1] opgenomen tabel. Daarbij wordt aangenomen
      dat de inhoudingsplichtige de belasting en de bij reguliere betaling van het loon verschuldigde premies voor de
      volksverzekeringen en premie die verschuldigd is ingevolge het [Besluit zorgverzekering BES][ref2] aanstonds voor
      zijn rekening heeft genomen.

      3 Voor zover aannemelijk is dat de inhoudingsplichtige de belasting, de premies voor de volksverzekeringen en
      de premie die verschuldigd is ingevolge het [Besluit zorgverzekering BES][ref3] pas later voor zijn rekening
      heeft genomen, wordt het voordeel dat voor de werknemer ontstaat door toepassing van de eindheffing in de
      eindheffing betrokken naar de situatie op het moment dat de inhoudingsplichtige de belasting, de premies voor de
      volksverzekeringen en de premie die verschuldigd is ingevolge het Besluit zorgverzekering BES voor zijn rekening
      heeft genomen. Het in de eerste zin bedoelde voordeel wordt niet later in de eindheffing betrokken dan op het
      moment van de naheffing naar de dan geldende situatie.

      4 De volgens dit artikel verschuldigde belasting kan globaal worden vastgesteld, zodanig dat deze redelijkerwijs
      overeenkomt met de verschuldigde belasting die op de voet van het eerste tot en met derde lid zou zijn bepaald,
      indien:

      a. een of meer werknemers in hetzelfde loontijdvak of in meerdere loontijdvakken als eindheffingsbestanddelen aan
      te merken loonvoordelen hebben genoten; en

      b. dat leidt tot een vereenvoudiging van de vaststelling van de verschuldigde belasting.


      [ref1]: https://wetten.overheid.nl/BWBR0029281#Artikel24a
      [ref2]: https://wetten.overheid.nl/BWBR0029404
