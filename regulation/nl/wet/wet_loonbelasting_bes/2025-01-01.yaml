  - number: 8b
    text: |-
      1 Tantièmes, gratificaties en ander loon dat in de regel slechts eenmaal of eenmaal per jaar wordt toegekend,
      worden belast volgens de loonbelastingtabel voor bijzondere beloningen die bij ministeriële regeling wordt
      vastgesteld met overeenkomstige toepassing van [artikel 8a, tweede tot en met vierde lid][ref1], met dien verstande
      dat in deze tabel jaarlonen en belastingpercentages worden opgenomen.

      2 Indien dit niet tot een hoger belastingbedrag leidt mag het loon, bedoeld in het eerste lid, worden beschouwd als
      een toevoeging aan het loon over het loontijdvak waarin het wordt uitbetaald.

      3 Overwerkloon mag worden belast naar het percentage dat wordt aangewezen door de loonbelastingtabel voor
      bijzondere beloningen.

      4 Als jaarloon geldt voor de toepassing van dit artikel:

      a. ingeval de werknemer over het gehele voorafgaande kalenderjaar van de inhoudingsplichtige loon heeft genoten:
      het in dat jaar genoten loon;

      b. ingeval de werknemer over een gedeelte van het voorafgaande kalenderjaar van de inhoudingsplichtige loon heeft
      genoten: het tot een jaarloon herleide bedrag van het in dat jaar genoten loon;

      c. in andere gevallen: het tot een jaarloon te herleiden in het kalenderjaar te genieten loon.

      5 Als overwerkloon geldt voor de toepassing van dit artikel het loon ter zake van arbeid die wordt verricht
      gedurende de tijd die uitgaat boven de voor de werknemer geldende normale arbeidsduur.


      [ref1]: https://wetten.overheid.nl/BWBR0029283#Artikel8a
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel8b
