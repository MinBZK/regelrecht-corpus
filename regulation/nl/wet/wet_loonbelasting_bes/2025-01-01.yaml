  - number: 6a
    text: |-
      1 Onder pensioenregeling wordt verstaan een regeling die uitsluitend:

      a. ten doel heeft de verzorging van werknemers en gewezen werknemers bij invaliditeit of ouderdom en de verzorging
      van hun echtgenoten en gewezen echtgenoten en van hun kinderen en pleegkinderen die de leeftijd van 27 jaar nog
      niet hebben bereikt en niet gehuwd zijn of gehuwd zijn geweest; en

      b. een pensioen inhoudt dat niet uitgaat boven hetgeen naar maatschappelijke opvattingen, mede in verband met
      diensttijd en genoten beloningen redelijk moet worden geacht en waarvan het lichaam dat als verzekeraar van een
      pensioen optreedt de pensioenverplichting rekent tot het binnenlandse ondernemingsvermogen.

      2 Onze Minister is bevoegd om:

      a. nadere regels te geven ten aanzien van het bepaalde in het eerste lid, onderdeel b;

      b. onder door hem te stellen voorwaarden, bepaalde regelingen of groepen van regelingen die afwijken van het in het
      eerste lid bepaalde, als pensioenregeling in de zin van dit artikel aan te wijzen.
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel6a
  - number: 6b
    text: |-
      1 Ingeval van een gebeurtenis als hierna bedoeld, wordt op het onmiddellijk daaraan voorafgaande tijdstip de
      aanspraak aangemerkt als loon uit een vroegere dienstbetrekking van de werknemer of de gewezen werknemer dan wel,
      indien deze is overleden, van de gerechtigde tot de aanspraak:

      a. een aanspraak ingevolge een pensioenregeling is niet langer als zodanig aan te merken;

      b. een aanspraak ingevolge een pensioenregeling wordt afgekocht of vervreemd dan wel formeel of feitelijk voorwerp
      van zekerheid;

      c. een op de BES eilanden gevestigd lichaam dat als verzekeraar van een pensioen optreedt, houdt op op de
      BES eilanden te zijn gevestigd dan wel rekent de pensioenverplichting niet langer geheel tot het binnenlandse
      ondernemingsvermogen;

      d. een aanspraak ingevolge een pensioenregeling wordt prijsgegeven, behoudens voor zover de aanspraak niet voor
      verwezenlijking vatbaar is.

      2 Ingeval een verplichting ingevolge een pensioenregeling geheel of gedeeltelijk overgaat op een andere verzekeraar
      wordt de aanspraak ingevolge die regeling geacht te worden afgekocht. De eerste volzin is niet van toepassing voor
      zover deze verplichting geheel of gedeeltelijk overgaat naar een op de BES eilanden gevestigde verzekeraar die de
      pensioenverplichting rekent tot zijn binnenlands ondernemingsvermogen.

      3 Onze Minister is bevoegd om, onder daarvoor te stellen voorwaarden, het tweede lid, laatste volzin, ook van
      toepassing te verklaren op een pensioenverplichting welke geheel of gedeeltelijk overgaat op een in Nederland,
      Aruba, Curaçao, Sint Maarten dan wel een verdragsland gevestigde verzekeraar.
    url: https://wetten.overheid.nl/BWBR0029283/2025-01-01#Artikel6b
  - number: 6c
    text: |-
      1 Niet in geld genoten loon wordt in aanmerking genomen naar de waarde welke daaraan in het economische verkeer
      kan worden toegekend met dien verstande dat voor zover de verwerving van het loon het gebruik of verbruik daarvan
      meebrengt, de waarde wordt gesteld op ten hoogste het bedrag van de besparing.

      2 De ingevolge het eerste lid in aanmerking te nemen waarde wordt verminderd met het bedrag dat de werknemer ter
      zake in rekening wordt gebracht, met dien verstande dat de aldus verminderde waarde ten minste op nihil wordt
      gesteld.

      3 In afwijking van het eerste en tweede lid wordt, ingeval aan een werknemer in verband met het verrichten
      van arbeid een bestelauto of een personenauto ter beschikking is gesteld, tot de inkomsten uit arbeid gerekend
      ten minste het bedrag waarmee 15% van de nieuwwaarde, met inbegrip van de algemene bestedingsbelasting en de
      invoerrechten, van de bestelauto of personenauto de vergoeding die de werknemer ter zake van het gebruik, anders
      dan ten behoeve van het verrichten van arbeid, verschuldigd is, te boven gaat, tenzij de werknemer doet blijken
      dat die auto niet voor privédoeleinden, waaronder woon-werkverkeer, wordt gebruikt. Voor de toepassing van dit
      lid en de daarop berustende bepalingen wordt een bestelauto die door aard of inrichting uitsluitend of nagenoeg
      uitsluitend geschikt blijkt te zijn voor vervoer van goederen niet als bestelauto aangemerkt.

      4 Voor de toepassing van dit artikel wordt met betrekking tot de personenauto, onderscheidenlijk de bestelauto, die
      voorafgaand aan de inwerkingtreding van de [Belastingwet BES][ref1] in het kentekenregister is geregistreerd onder
      algemene bestedingsbelasting mede verstaan: omzetbelasting en invoerheffingen.

      5 Onze Minister kan nadere regels geven met betrekking tot de waardering van aanspraken en van ander niet in geld
      genoten loon.

      6 Onze Minister kan in bepaalde gevallen of groepen van gevallen regels geven met betrekking tot het bedrag aan
      fooien en dergelijke prestaties van derden dat geacht wordt te zijn genoten. Hij kan ook bepalen dat een bedrag ter
      zake niet tot het loon behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0029244
