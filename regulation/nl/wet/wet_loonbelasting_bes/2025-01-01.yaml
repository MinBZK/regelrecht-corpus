  - number: 21b
    text: |-
      1 Voor de toepassing van [artikel 21a][ref1] kunnen bij ministeriële regeling tabellen worden vastgesteld voor
      het bepalen van het op de eindheffingsbestanddelen toe te passen tarief. Daarbij kunnen de gevolgen van het
      passeren van tariefschijfgrenzen en maximumpremielonen buiten beschouwing blijven en kunnen voorts de noodzakelijke
      afrondingen en vereenvoudigingen worden toegepast.

      2 Voor gevallen waarin [artikel 12a, eerste lid][ref2], of [artikel 12c, eerste lid][ref3], van toepassing
      is, kunnen, met overeenkomstige toepassing van [artikel 21a][ref4], bij ministeriële regeling tabellen worden
      vastgesteld waarin telkens de belasting en de premies voor de volksverzekeringen, onderscheidenlijk de premie die
      verschuldigd is ingevolge het [Besluit zorgverzekering BES][ref5], in één bedrag dan wel in één percentage worden
      opgenomen.


