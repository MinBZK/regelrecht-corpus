  - number: 6d
    text: |-
      1 Ten aanzien van de werknemer die arbeid verricht ten behoeve van een lichaam waarin hij of zijn partner een
      aanmerkelijk belang heeft, wordt het in het kalenderjaar van dat lichaam genoten loon ten minste gesteld op het
      hoogste van de volgende bedragen:

      a. 90% van het loon uit de meest vergelijkbare dienstbetrekking;

      b. het hoogste loon van de werknemers die in dienst zijn van het lichaam of met het lichaam verbonden lichamen,
      met dien verstande dat indien tot het lichaam of met het lichaam verbonden lichamen geen andere werknemers dan de
      werknemer in dienstbetrekking staan, dit loon wordt gesteld op 90% van de netto-omzet van het lichaam;

      c. tweemaal de belastingvrije som, bedoeld in [artikel 24, tweede lid, van de Wet inkomstenbelasting BES][ref1].

      2 Indien de inhoudingsplichtige aannemelijk maakt dat het hoogste bedrag, bedoeld in het eerste lid, hoger is
      dan 90% van het loon uit de meest vergelijkbare dienstbetrekking, wordt het loon in afwijking van het eerste lid
      gesteld op 90% van het loon uit de meest vergelijkbare dienstbetrekking met dien verstande dat het loon ten minste
      wordt gesteld op het bedrag, bedoeld in het eerste lid, onderdeel c, of, indien het loon uit de meest vergelijkbare
      dienstbetrekking lager is dan dat bedrag, op het loon uit de meest vergelijkbare dienstbetrekking.

      3 Voor de toepassing van het eerste lid, onderdeel b:

      a. wordt onder netto-omzet verstaan: de totale omzet van het lichaam na aftrek van de verschuldigde algemene
      bestedingsbelasting en alle op deze omzet betrekking hebbende kosten, lasten en afschrijvingen;

      b. worden de partner van de werknemer en de bloed- of aanverwanten van de werknemer tot en met de derde graad niet
      als werknemer aangemerkt, met dien verstande dat ingeval deze personen loon genieten, dit loon ter bepaling van de
      netto-omzet als kosten in aanmerking wordt genomen.

      4 In afwijking van het eerste en tweede lid mag het in een kalenderjaar genoten loon in het jaar van oprichting van
      het lichaam en de drie daaropvolgende kalenderjaren ook worden gesteld op het bedrag van de commerciële winst van
      het lichaam, doch niet op een lager bedrag dan nihil.

      5 Voor de toepassing van dit artikel wordt verstaan onder:

      a. *partner:* de echtgenoot, alsmede de ongehuwde meerderjarige persoon waarmee de ongehuwde meerderjarige
      belastingplichtige een notarieel samenlevingscontract is aangegaan en met wie hij staat ingeschreven op hetzelfde
      adres in de basisadministratie personen op de BES eilanden of een daarmee naar aard en strekking overeenkomstige
      basisadministratie buiten de BES eilanden;

      b. *aanmerkelijk belang:* een aanmerkelijk belang als bedoeld in
      [artikel 11, derde lid, van de Wet inkomstenbelasting BES][ref2];

      c. *meest vergelijkbare dienstbetrekking:* de dienstbetrekking die van alle dienstbetrekkingen:

      1°. waarbij een aanmerkelijk belang geen rol speelt;

      2°. die bekend zijn bij de inhoudingsplichtige en de inspecteur;

      3°. waarvan het loon bekend is of in redelijkheid geschat kan worden; en

      4°. waarvan het loon niet op een ander bedrag is vastgesteld dan in het economische verkeer gebruikelijk is;

      het meest vergelijkbaar is met de dienstbetrekking van de werknemer;

      d. *met het lichaam verbonden lichaam:*

      1°. een lichaam waarin de inhoudingsplichtige voor ten minste een derde gedeelte belang heeft;

      2°. een lichaam dat voor ten minste een derde gedeelte belang heeft in de inhoudingsplichtige;

      3°. een lichaam waarin een derde voor ten minste een derde gedeelte belang heeft, terwijl deze derde tevens voor
      ten minste een derde gedeelte belang heeft in de inhoudingsplichtige.


