---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_waterhuishouding
regulatory_layer: WET
publication_date: '2010-05-04'
valid_from: '2002-09-01'
bwb_id: BWBR0004575
url: https://wetten.overheid.nl/BWBR0004575/2002-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen in het belang van een samenhangend
    en doelmatig beleid en beheer met betrekking tot de waterhuishouding in haar geheel alsmede nadere regelen met
    betrekking tot het kwantiteitsbeheer over het oppervlaktewater;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In het bij of krachtens deze wet bepaalde wordt verstaan onder: "Onze Minister": Onze Minister van Verkeer
      en Waterstaat; "Onze Ministers": Onze Minister van Verkeer en Waterstaat tezamen met Onze Minister van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, voor zover het aangelegenheden betreft die mede tot zijn
      verantwoordelijkheid behoren; "waterhuishouding": de overheidszorg die zich richt op het op en in de bodem vrij
      aanwezige water, met het oog op de daarbij betrokken belangen; "waterhuishoudkundig systeem": een samenhangend
      geheel van oppervlaktewateren en grondwatervoorkomens; "kwantiteitsbeheerder": het openbaar gezag dat belast
      is met kwantiteitsbeheer van oppervlaktewater; "kwaliteitsbeheerder": het openbaar gezag dat bevoegd is tot
      vergunningverlening ingevolge de [Wet verontreiniging oppervlaktewateren][ref1] (*Stb.* 1981, 573).


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002682
  - number: '2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden tot de oppervlaktewateren onder beheer
      van het Rijk mede gerekend de bij of krachtens algemene maatregel van bestuur aangewezen door anderen beheerde
      oppervlaktewateren die met de oppervlaktewateren onder beheer van het Rijk in open verbinding staan. Over een
      voordracht voor een zodanige algemene maatregel van bestuur stelt Onze Minister de kwantiteitsbeheerders van de
      betrokken oppervlaktewateren in de gelegenheid hun oordeel te geven.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel2
  - number: '3.1'
    text: |-
      Onze Ministers stellen een nota vast, waarin de hoofdlijnen van het ten aanzien van de landelijke waterhuishouding
      te voeren beleid zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel3
  - number: '3.2'
    text: 'De hoofdlijnen omvatten:'
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel3
  - number: 3.2.a
    text: |-
      een aanduiding van de belangrijkste functies van de oppervlaktewateren behorend tot het waterhuishoudkundig
      hoofdsysteem en, voorzover nationale belangen dat nodig maken, van de regionale waterhuishoudkundige systemen;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel3
  - number: 3.2.b
    text: aanwijzingen voor de verdere bepaling van functies van waterhuishoudkundige systemen of onderdelen daarvan;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel3
  - number: 3.2.c
    text: |-
      een aanduiding, in samenhang met de onder *a* en *b* bedoelde functies, van de gewenste ontwikkeling, werking en
      bescherming van de waterhuishoudkundige systemen of onderdelen daarvan, alsmede van de termijnen die daarbij worden
      nagestreefd;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel3
  - number: 3.2.d
    text: |-
      een uiteenzetting van de algemene aard en omvang van de maatregelen en voorzieningen, die met het oog op die
      ontwikkeling, en werking en bescherming nodig zijn;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel3
  - number: 3.2.e
    text: |-
      een aanduiding van de redelijkerwijze te verwachten financiële, economische en ruimtelijke gevolgen van het te
      voeren beleid.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel3
  - number: '3.3'
    text: |-
      De nota geeft aan in hoeverre de hoofdlijnen zijn afgestemd op dan wel leiden tot aanpassing van het nationale
      milieubeleid en in hoeverre en binnen welke termijn Onze Ministers voornemens zijn het geldende nationale
      milieubeleidsplan te herzien.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel3
  - number: '3.4'
    text: |-
      De nota wordt eenmaal in de vier jaren herzien. Onze Ministers kunnen besluiten die termijn met ten hoogste vier
      jaren te verlengen.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel3
  - number: '3.5'
    text: Onze Minister doet de nota aan de Tweede Kamer der Staten-Generaal toekomen.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel3
  - number: '4'
    text: |-
      Met betrekking tot grensvormende of grensoverschrijdende wateren raadplegen Onze Ministers de ten aanzien van die
      wateren bevoegde Duitse en Belgische autoriteiten.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel4
  - number: '5.1'
    text: |-
      Onze Ministers stellen ten aanzien van de oppervlaktewateren onder beheer van het Rijk een beheersplan vast.
      Het plan kan bestaan uit afzonderlijke delen. Bij de vaststelling van het plan wordt rekening gehouden met
      de in [artikel 3][ref1] bedoelde nota en, voor zover het krachtens [artikel 7, tweede lid][ref2], aangewezen
      oppervlaktewateren betreft, met het provinciaal plan voor de waterhuishouding.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel7
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '7'
        hoofdstuk: II
        afdeling: '3'
  - number: '5.2'
    text: 'Het plan geeft aan:'
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel5
  - number: 5.2.a
    text: de functies van de oppervlaktewateren;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel5
  - number: 5.2.b
    text: |-
      het programma van maatregelen en voorzieningen, die met het oog op de ontwikkeling, werking en bescherming van de
      waterhuishoudkundige systemen of onderdelen daarvan en de bescherming van het milieu nodig zijn, onder vermelding
      van de termijnen die daarbij worden nagestreefd;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel5
  - number: 5.2.c
    text: de wijze waarop het beheer bij normale en bij afwijkende omstandigheden wordt gevoerd;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel5
  - number: 5.2.d
    text: de financiële middelen, die voor de uitvoering van het programma en het te voeren beheer nodig zijn.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel5
  - number: '5.3'
    text: Het plan gaat vergezeld van een toelichting.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel5
  - number: '5.4'
    text: |-
      Het plan wordt tenminste eenmaal in de vier jaren herzien. Onze Ministers kunnen die termijn met ten hoogste vier
      jaren verlengen.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel5
  - number: '5.5'
    text: |-
      Van een besluit tot vaststelling of herziening van het plan en van de verlenging van de herzieningstermijn wordt
      mededeling gedaan in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister geeft met betrekking tot het plan toepassing aan de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '6.2'
    text: |-
      Onverminderd [artikel 3:11, vierde lid, van de Algemene wet bestuursrecht][ref1] worden de stukken ter inzage
      gelegd ter griffie van de betrokken provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '6.3'
    text: |-
      Met betrekking tot grensvormende of grensoverschrijdende wateren raadplegen Onze Ministers de ten aanzien van die
      wateren bevoegde Duitse en Belgische autoriteiten.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel6
  - number: '7.1'
    text: |-
      Provinciale staten stellen een provinciaal plan vast, waarin de hoofdlijnen van het ten aanzien van de
      waterhuishouding in de provincie te voeren beleid zijn aangegeven. Daarbij wordt rekening gehouden met de in
      [artikel 3][ref1] bedoelde nota.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel3
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '3'
        hoofdstuk: II
        afdeling: '1'
  - number: '7.2'
    text: |-
      Het plan heeft mede betrekking op bij of krachtens algemene maatregel van bestuur aangewezen oppervlaktewateren
      onder beheer van het Rijk.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel7
  - number: '7.3'
    text: 'De hoofdlijnen van het plan omvatten:'
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel7
  - number: 7.3.a
    text: de vastlegging van de belangrijkste functies van de regionale waterhuishoudkundige systemen of onderdelen daarvan;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel7
  - number: 7.3.b
    text: |-
      een aanduiding, in samenhang met de onder *a* bedoelde functies, van de gewenste ontwikkeling, werking en
      bescherming van de regionale waterhuishoudkundige systemen of onderdelen daarvan alsmede van de termijnen die
      daarbij worden nagestreefd;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel7
  - number: 7.3.c
    text: |-
      een uiteenzetting van het ingevolge de [Grondwaterwet][ref1] (*Stb.* 1981, 392) te voeren grondwaterbeheer, alsmede
      een overzicht van de financiële middelen die voor de uitvoering van het beheer nodig zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003406
  - number: 7.3.d
    text: |-
      een uiteenzetting van de algemene aard en omvang van de overige maatregelen en voorzieningen die met het oog op de
      onder *b* bedoelde ontwikkeling, werking en bescherming nodig zijn;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel7
  - number: 7.3.e
    text: een aanduiding van de redelijkerwijze te verwachten financiële en economische gevolgen van het te voeren beleid.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel7
  - number: '7.4'
    text: |-
      In het plan geven provinciale staten aan in hoeverre de hoofdlijnen zijn afgestemd op dan wel leiden tot aanpassing
      van het provinciale milieubeleid, het provinciale ruimtelijk beleid of het provinciale verkeers- en vervoerbeleid,
      en in hoeverre en binnen welke termijn zij voornemens zijn het geldende provinciale milieubeleidsplan, een of meer
      geldende streekplannen of het geldende provinciale verkeers- en vervoerplan te herzien. Het plan gaat vergezeld van
      een toelichting.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel7
  - number: '7.5'
    text: |-
      Het plan wordt tenminste eenmaal in de vier jaren herzien. Provinciale staten kunnen die termijn met ten hoogste
      vier jaren verlengen.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel7
  - number: '7.6'
    text: |-
      Van een besluit tot vaststelling of herziening van een plan en van de verlenging van de herzieningstermijn wordt
      mededeling gedaan in de *Nederlandse Staatscourant*. Het besluit tot vaststelling of herziening van het plan wordt
      met het plan toegezonden aan Onze Ministers.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel7
  - number: '8.1'
    text: |-
      Provinciale staten stellen bij verordening nadere regelen met betrekking tot het plan. Zij geven in die verordening
      onder meer regelen met betrekking tot de wijze waarop het ontwerp van het plan in gemeenschappelijk overleg met
      de besturen van de openbare lichamen, die een beheersplan als bedoeld in [artikel 9][ref1] vaststellen, wordt
      voorbereid.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel9
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '9'
        hoofdstuk: II
        afdeling: '4'
  - number: '8.2'
    text: |-
      Tevens regelen zij de instelling, samenstelling, taak en werkwijze van een commissie, die door gedeputeerde staten
      vooraf wordt gehoord over maatregelen en plannen die van betekenis zijn voor het provinciale beleid inzake de
      waterhuishouding.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel8
  - number: '8.3'
    text: Provinciale Staten zenden het besluit waarbij de verordening is vastgesteld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel8
  - number: '8.4'
    text: |-
      Gedeputeerde staten plegen bij de voorbereiding van het plan overleg met gedeputeerde staten van de aangrenzende
      provincies en raadplegen, indien het plan betrekking heeft op grensvormende of grensoverschrijdende wateren de ten
      aanzien van die wateren bevoegde Duitse en Belgische autoriteiten.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel8
  - number: '9.1'
    text: |-
      Een kwantiteitsbeheerder of kwaliteitsbeheerder, niet zijnde het Rijk, stelt met betrekking tot oppervlaktewateren
      onder zijn beheer een beheersplan vast. Bij die vaststelling wordt rekening gehouden met het provinciaal plan voor
      de waterhuishouding.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel9
  - number: '9.2'
    text: Een beheersplan geeft aan hetgeen de beheerder ter vervulling van zijn taak verricht.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel9
  - number: '9.3'
    text: Een niet door het provinciaal bestuur vastgesteld beheersplan behoeft de goedkeuring van gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel9
  - number: '9.4'
    text: |-
      Provinciale staten stellen bij verordening nadere regelen vast met betrekking tot de inrichting, voorbereiding
      en vaststelling van het beheersplan. Zij geven daarin aan welke beheerders zijn uitgezonderd van de verplichting
      tot vaststelling van een beheersplan. Tevens geven zij daarin regelen ten aanzien van de wijze waarop
      kwantiteitsbeheerders en kwaliteitsbeheerders bij de voorbereiding en vaststelling van een plan samenwerken.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel9
  - number: '9.5'
    text: |-
      Provinciale Staten zenden het besluit waarbij de verordening bedoeld in het vorige lid, is vastgesteld aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Ministers kunnen aan provinciale staten omtrent de vaststelling of herziening en de inhoud van een provinciaal
      plan voor de waterhuishouding aanwijzingen geven, indien een samenhangend en doelmatig beleid en beheer met
      betrekking tot de waterhuishouding zulks vorderen.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel10
  - number: '10.2'
    text: |-
      Bij een aanwijzing kan een termijn worden gesteld binnen welke het plan dient te zijn vastgesteld dan wel, indien
      het een vastgesteld plan betreft, de herziening dient te hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel10
  - number: '10.3'
    text: |-
      Onze Ministers gaan niet over tot het geven van een aanwijzing dan nadat zij gedeputeerde staten in de gelegenheid
      hebben gesteld van hun gevoelen omtrent hun voornemen te doen blijken.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel10
  - number: '10.4'
    text: Provinciale staten stellen het plan vast of herzien het plan in overeenstemming met de gegeven aanwijzing.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel10
  - number: '10.5'
    text: Van het besluit houdende de aanwijzing wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel10
  - number: '11'
    text: |-
      Onze Minister kan aan provinciale staten omtrent de vaststelling of wijziging en de inhoud van een verordening
      als bedoeld in de [artikelen 8, eerste lid][ref1] en [9, vierde lid][ref2], aanwijzingen geven indien
      een samenhangend en doelmatig beleid en beheer met betrekking tot de waterhuishoudings zulks vorderen.
      [Artikel 10, tweede, derde, vierde en vijfde lid][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004575#Artikel10
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '8'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '9'
        hoofdstuk: II
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0004575
        artikel: '10'
        hoofdstuk: II
        afdeling: '5'
  - number: '12.1'
    text: |-
      Degene die water afvoert naar, aanvoert uit, loost in of onttrekt aan oppervlaktewateren waarover hij niet het
      beheer voert, is in daartoe aan te wijzen gevallen verplicht de wijze van afvoer, aanvoer, lozing of onttrekking
      te melden en - eventueel - de afgevoerde, aangevoerde, geloosde of onttrokken waterhoeveelheden te meten, daarvan
      aantekening te houden en van de verkregen gegevens opgave te doen.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel12
  - number: '12.2'
    text: |-
      De in het eerste lid bedoelde melding en opgave worden in de gevallen welke geheel of gedeeltelijk betrekking
      hebben op de oppervlaktewateren onder beheer van het Rijk, gedaan aan Onze Minister en in de overige gevallen aan
      de kwantiteitsbeheerder van het desbetreffende oppervlaktewater.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel12
  - number: '12.3'
    text: |-
      Een overzicht van de ontvangen gegevens wordt jaarlijks, vóór 1 juli van het jaar dat volgt op het kalenderjaar
      waarop de gegevens betrekking hebben, door Onze Minister toegezonden aan gedeputeerde staten van de desbetreffende
      provincie of provincies en door de beheerder, bedoeld in het tweede lid, aan Onze Minister en aan gedeputeerde
      staten van de desbetreffende provincie of provincies.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel12
  - number: '12.4'
    text: |-
      Ter provinciale griffie liggen de in het derde lid bedoelde overzichten kosteloos ter inzage tot drie jaren na het
      einde van het kalenderjaar waarop zij betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel12
  - number: '12.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regelen gesteld met betrekking tot de in het eerste lid bedoelde
      melding, meting, het houden van aantekening daarvan en het doen van opgave van de verkregen gegevens.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel12
  - number: '13.1'
    text: |-
      De in [artikel 12, eerste lid][ref1], bedoelde aanwijzing van gevallen welke geheel of gedeeltelijk betrekking
      hebben op de oppervlaktewateren onder beheer van het Rijk, vindt plaats bij of krachtens algemene maatregel van
      bestuur en van de overige gevallen bij door provinciale staten vast te stellen verordening. Provinciale staten
      zenden het besluit waarbij de verordening is vastgesteld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel12
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: '13.2'
    text: |-
      Een voordracht tot de in het eerste lid bedoelde algemene maatregel van bestuur wordt Ons gedaan door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel13
  - number: '14'
    text: |-
      In afwijking van het bepaalde in [artikel 13, eerste lid][ref1], kunnen provinciale staten bij verordening de
      kwantiteitsbeheerder de bevoegdheid geven de aanwijzing ingevolge [artikel 12, eerste lid][ref2], uit te breiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel12
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: '15'
    text: |-
      Onze Minister kan aan provinciale staten omtrent de vaststelling of wijziging en de inhoud van een verordening als
      bedoeld in [artikel 13, eerste lid][ref1], aanwijzingen geven indien een samenhangend en doelmatig beleid en beheer
      met betrekking tot de waterhuishouding zulks vorderen. [Artikel 10, tweede, derde, vierde en vijfde lid][ref2], is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel10
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '10'
        hoofdstuk: II
        afdeling: '5'
  - number: '16.1'
    text: |-
      Een kwantiteitsbeheerder is in daartoe aan te wijzen gevallen verplicht voor oppervlatewateren onder zijn beheer
      één of meer peilbesluiten vast te stellen. De kwantiteitsbeheerder draagt er zorg voor dat de in het peilbesluit
      aangegeven waterstanden gedurende daarbij aangegeven perioden zoveel mogelijk worden gehandhaafd. Bij het
      vaststellen van het peilbesluit wordt rekening gehouden met de in de [artikelen 5][ref1] en [9][ref2] bedoelde
      beheersplannen, die van toepassing zijn op de oppervlaktewateren waarop het peilbesluit betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel9
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '5'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '9'
        hoofdstuk: II
        afdeling: '4'
  - number: '16.2'
    text: |-
      Ten aanzien van oppervlaktewateren onder beheer van het Rijk worden bij algemene maatregel van bestuur nadere
      regelen gesteld met betrekking tot het peilbesluit.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel16
  - number: '16.3'
    text: |-
      Ten aanzien van de overige oppervlaktewateren stellen provinciale staten bij verordening nadere regelen met
      betrekking tot het peilbesluit.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel16
  - number: '16.4'
    text: |-
      Met betrekking tot de aanwijzing van de in het eerste lid bedoelde gevallen zijn de [artikelen 13][ref1] en
      [15][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel15
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '15'
        hoofdstuk: III
        afdeling: '1'
  - number: '17.1'
    text: |-
      Een kwantiteitsbeheerder die water afvoert naar of aanvoert uit oppervlaktewateren in beheer bij een andere
      kwantiteitsbeheerder, alsmede die andere beheerder zijn in daartoe aan te wijzen gevallen verplicht gezamenlijk
      een waterakkoord vast te stellen. Voor zover deze verplichting rust op het Rijk, wordt zij door of vanwege
      Onze Minister nagekomen. Indien een kwantiteitsbeheerder niet tevens kwaliteitsbeheerder is, neemt ook de
      kwaliteitsbeheerder aan het waterakkoord deel. Een kwantiteitsbeheerder kan voorts een ander openbaar gezag
      uitnodigen aan het waterakkoord deel te nemen, indien dat openbaar gezag een waterstaatkundige taak vervult die
      niet door de kwantiteitsbeheerder wordt vervuld.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel17
  - number: '17.2'
    text: |-
      Een waterakkoord bevat bepalingen omtrent de wijze waarop de beheerders de af- en aanvoer van water ten opzichte
      van elkaar in het belang van de waterhuishouding regelen. Bij het stellen van deze bepalingen wordt rekening
      gehouden met de in de [artikelen 5][ref1] en [9][ref2] bedoelde beheersplannen welke op de oppervlaktewateren
      waarop het waterakkoord betrekking heeft, van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel9
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '5'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '9'
        hoofdstuk: II
        afdeling: '4'
  - number: '17.3'
    text: |-
      Met betrekking tot de aanwijzing van de in het eerste lid bedoelde gevallen zijn de [artikelen 13][ref1] en
      [15][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel15
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '15'
        hoofdstuk: III
        afdeling: '1'
  - number: '18.1'
    text: |-
      De deelnemers stellen zo spoedig mogelijk, doch uiterlijk binnen een termijn van acht maanden na het van kracht
      worden van de in [artikel 17, eerste lid][ref1], bedoelde verplichting een ontwerp van het waterakkoord op.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel17
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '3'
  - number: '18.2'
    text: 'Een exemplaar van het ontwerp wordt uiterlijk twee weken na het opstellen ervan toegezonden aan:'
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel18
  - number: 18.2.a
    text: gedeputeerde staten van de desbetreffende provincie of provincies;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel18
  - number: 18.2.b
    text: |-
      de besturen van andere openbare lichamen alsmede andere bestuursorganen of instellingen welke naar het oordeel van
      de deelnemers geacht kunnen worden bij het ontwerp belang te hebben.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel18
  - number: '18.3'
    text: |-
      Gedurende een termijn van vier weken vanaf de datum van verzending kunnen degenen aan wie het ontwerp is
      toegezonden, hun zienswijze omtrent het ontwerp aan de deelnemers kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel18
  - number: '19.1'
    text: |-
      De deelnemers stellen zo spoedig mogelijk, doch uiterlijk binnen acht weken na verloop van de in
      [artikel 18, derde lid][ref1], bedoelde termijn het waterakkoord vast.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel18
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '19.2'
    text: |-
      Een exemplaar van het waterakkoord wordt uiterlijk twee weken na de vaststelling ervan toegezonden aan degenen
      aan wie ingevolge [artikel 18, tweede lid][ref1], toezending van het ontwerp heeft plaatsgevonden, en aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel18
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '20.1'
    text: |-
      Uiterlijk twee weken na de in [artikel 19, tweede lid][ref1], bedoelde toezending wordt een exemplaar van het
      waterakkoord gedurende een maand ter inzage gelegd ten kantore van de deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel19
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '20.2'
    text: |-
      Van de terinzagelegging wordt tevoren kennis gegeven in de *Nederlandse Staatscourant* en in één of meer dag-,
      nieuws of advertentiebladen.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel20
  - number: '21.1'
    text: |-
      Een deelnemer die wijziging van een waterakkoord aan de vaststelling waarvan hij heeft meegewerkt, nodig acht,
      richt een schriftelijk verzoek daartoe aan de andere deelnemers.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel21
  - number: '21.2'
    text: |-
      Binnen een termijn van drie maanden na het in het eerste lid bedoelde verzoek wordt een aanvang gemaakt met de
      voorbereiding van de wijziging van het waterakkoord. Bij de wijziging van het waterakkoord wordt rekening gehouden
      met de in de [artikelen 5][ref1] en [9][ref2] bedoelde beheersplannen, welke op de oppervlaktewateren waarop
      het waterakkoord betrekking heeft van toepassing zijn. De [artikelen 18][ref3], [19][ref4] en [20][ref5] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004575#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0004575#Artikel19
      [ref5]: https://wetten.overheid.nl/BWBR0004575#Artikel20
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '5'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '9'
        hoofdstuk: II
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0004575
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0004575
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0004575
        artikel: '20'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '22.1'
    text: |-
      Indien een waterakkoord niet binnen een termijn van een jaar is vastgesteld of gewijzigd, nadat de in
      [artikel 17, eerste lid][ref1], bedoelde verplichting van kracht is geworden onderscheidenlijk de in
      [artikel 21, tweede lid][ref2], bedoelde termijn is verlopen, doen de deelnemers daarvan mededeling aan het in het
      tweede lid bedoelde gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel21
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
        afdeling: '3'
  - number: '22.2'
    text: |-
      De in het eerste lid bedoelde mededeling wordt, indien het Rijk of een provincie aan het waterakkoord deelneemt,
      gedaan aan Onze Minister en in de overige gevallen aan gedeputeerde staten van de desbetreffende provincie of
      provincies.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel22
  - number: '23.1'
    text: |-
      Het in [artikel 22, tweede lid][ref1], bedoelde gezag kan in het geval, bedoeld in het eerste lid van dat artikel,
      of indien een samenhangend beleid en beheer met betrekking tot de waterhuishouding zulks vordert, aan de deelnemers
      aanwijzingen geven omtrent de vaststelling of wijziging en de inhoud van een waterakkoord.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel22
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '22'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: '3'
  - number: '23.2'
    text: |-
      Bij een aanwijzing kan een termijn worden gesteld binnen welke het waterakkoord dient te zijn vastgesteld dan wel,
      indien het een vastgesteld waterakkoord betreft, de wijziging dient te hebben plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel23
  - number: '23.3'
    text: |-
      Een aanwijzing wordt niet gegeven dan nadat de deelnemers in de gelegenheid zijn gesteld van hun gevoelen omtrent
      het voornemen tot het geven van de aanwijzing te doen blijken. Indien Onze Minister het voornemen heeft een
      aanwijzing te geven, stelt hij, indien de provincie niet tot de deelnemers behoort, ook gedeputeerde staten in de
      gelegenheid hun gevoelen daaromtrent te laten blijken.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel23
  - number: '23.4'
    text: |-
      De deelnemers stellen het waterakkoord vast of wijzigen het waterakkoord in overeenstemming met de gegeven
      aanwijzing.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel23
  - number: '23.5'
    text: Van de beschikking, houdende de aanwijzing, wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel23
  - number: '24.1'
    text: |-
      Het is in daartoe aan te wijzen gevallen verboden water te lozen in of te onttrekken aan oppervlaktewateren zonder
      vergunning. Het verbod geldt eveneens ingeval door anderen dan kwantiteitsbeheerders water wordt afgevoerd naar of
      aangevoerd uit oppervlaktewateren. Het verbod geldt niet voor kwantiteitsbeheerders voor zover zij water lozen in
      of onttrekken aan oppervlaktewateren waarover zij zelf het beheer voeren.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel24
  - number: '24.2'
    text: |-
      De aanwijzing ingevolge het eerste lid kan enkel betreffen de lozing of onttrekking van waterhoeveelheden
      die, zelfstandig of in samenhang met andere lozingen of onttrekkingen, van nadelige invloed kunnen zijn op
      de peilregeling, de grondwaterstand of de waterbeweging, dan wel de kwantiteitsbeheerder kunnen noodzaken tot
      bijzondere beheersmaatregelen. De [artikelen 13][ref1] en [15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel15
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '15'
        hoofdstuk: III
        afdeling: '1'
  - number: '24.3'
    text: |-
      In afwijking van het bepaalde in [artikel 13, eerste lid][ref1], kunnen provinciale staten bij verordening de
      kwantiteitsbeheerder de bevoegdheid geven de aanwijzing ingevolge het eerste lid uit te breiden.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel13
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
  - number: '24.4'
    text: |-
      Een vergunning wordt verleend door de kwantiteitsbeheerder van het desbetreffende oppervlaktewater. Is het Rijk
      kwantiteitsbeheerder, dan geschiedt de vergunningverlening door of vanwege Onze Minister. Bij het verlenen van de
      vergunning wordt rekening gehouden met de in de [artikelen 5][ref1] en [9][ref2] bedoelde beheersplannen, die van
      toepassing zijn op het oppervlaktewater waarop de vergunning betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel9
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '5'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '9'
        hoofdstuk: II
        afdeling: '4'
  - number: '24.5'
    text: |-
      Aan de vergunning kunnen voorschriften worden verbonden ter bescherming van het belang van de waterhuishouding voor
      zover het bij of krachtens de [Wet verontreiniging oppervlaktewateren][ref1] of de [Grondwaterwet][ref2] bepaalde
      daarin niet voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
      [ref2]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002682
      - id: ref2
        bwb_id: BWBR0003406
  - number: '24.6'
    text: |-
      In de vergunning worden ten minste de waterhoeveelheden vermeld die per één of meer tijdseenheden mogen
      onderscheidenlijk moeten worden afgevoerd, aangevoerd, geloosd of onttrokken, alsmede, voor zover het aanvoeren
      of onttrekken betreft, het doel waarvoor de waterhoeveelheden zijn bestemd. De vorige volzin geldt niet voor
      zover de vergunning wordt verleend voor een lozing in een geval waarin ingevolge het eerste lid een aanwijzing
      van toepassing is in verband met de nadelige invloed van de lozing van de desbetreffende waterhoeveelheden op de
      grondwaterstand of de grondwaterbeweging.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel24
  - number: '24.7'
    text: |-
      De vergunning geldt ook voor de rechtsopvolgers van de houder, met dien verstande dat zij met ingang van de
      vierde maand na de dag van de rechtsopvolging vervalt, tenzij vóór dat tijdstip de wijziging van de tenaamstelling
      schriftelijk is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel24
  - number: '25.1'
    text: De aanvraag tot verlening van een vergunning wordt ingediend bij de kwantiteitsbeheerder.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel25
  - number: '25.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regelen worden gesteld met betrekking tot de gegevens
      en bescheiden welke de aanvrager moet overleggen teneinde een beoordeling van de aanvraag mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel25
  - number: '26'
    text: |-
      De kwantiteitsbeheerder zendt zo spoedig mogelijk een exemplaar van de aanvraag aan de kwaliteitsbeheerder, onder
      mededeling dat hij van advies kan dienen, alsmede aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel26
  - number: '27'
    text: |-
      Ten aanzien van de oppervlaktewateren onder beheer van het Rijk onderscheidenlijk ten aanzien van de overige
      oppervlaktewateren kunnen bij algemene maatregel van bestuur onderscheidenlijk bij provinciale verordening
      gevallen worden aangewezen, waarin [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is op de
      voorbereiding van de beschikking op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '29'
    text: |-
      De kwantiteitsbeheerder doet van een beslissing tot verlening van een vergunning of tot weigering daarvan
      mededeling door toezending van een afschrift aan de kwaliteitsbeheerder en aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel29
  - number: '30.1'
    text: |-
      De kwantiteitsbeheerder kan uit eigen beweging of op schriftelijk verzoek van een belanghebbende een vergunning
      wijzigen, dan wel geheel of gedeeltelijk intrekken.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel30
  - number: '30.2'
    text: |-
      Behoudens ingeval de houder van de vergunning om de wijziging verzoekt, kan een vergunning slechts
      worden gewijzigd indien de bescherming van het belang van de waterhuishouding voor zover de
      [Wet verontreiniging oppervlaktewateren][ref1] of de [Grondwaterwet][ref2] daarin niet voorziet, zulks vordert.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
      [ref2]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002682
      - id: ref2
        bwb_id: BWBR0003406
  - number: '30.3'
    text: 'Een vergunning kan slechts geheel of gedeeltelijk worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel30
  - number: 30.3.a
    text: |-
      de houder van de vergunning schriftelijk verklaart daarvan in het geheel onderscheidenlijk voor een gedeelte geen
      gebruik meer te zullen maken;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel30
  - number: 30.3.b
    text: |-
      de ter verkrijging van de vergunning verstrekte gegevens zodanig onjuist of onvolledig blijken dat op de aanvraag
      een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de juiste gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel30
  - number: 30.3.c
    text: |-
      van de vergunning gedurende vier achtereenvolgende jaren in het geheel onderscheidenlijk voor een gedeelte geen
      gebruik is gemaakt;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel30
  - number: 30.3.d
    text: wordt gehandeld in strijd met de vergunning;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel30
  - number: 30.3.e
    text: |-
      blijkt van feiten of omstandigheden waardoor, in verband met het belang van de waterhuishouding voor zover dit
      niet door de [Wet verontreiniging oppervlaktewateren][ref1] of de [Grondwaterwet][ref2] wordt beschermd, de lozing,
      onttrekking, afvoer of aanvoer in het geheel onderscheidenlijk voor een gedeelte niet langer toelaatbaar wordt
      geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
      [ref2]: https://wetten.overheid.nl/BWBR0003406
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002682
      - id: ref2
        bwb_id: BWBR0003406
  - number: '30.4'
    text: |-
      Bij de wijziging of intrekking van een vergunning wordt rekening gehouden met de in de [artikelen 5][ref1] en
      [9][ref2] bedoelde beheersplannen, die van toepassing zijn op het oppervlaktewater waarop de vergunning betrekking
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel9
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '5'
        hoofdstuk: II
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '9'
        hoofdstuk: II
        afdeling: '4'
  - number: '31.1'
    text: 'Van een voornemen tot wijziging geeft de kwantiteitsbeheerder zo spoedig mogelijk kennis aan:'
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel31
  - number: 31.1.a
    text: de houder van de vergunning;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel31
  - number: 31.1.b
    text: de kwaliteitsbeheerder;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel31
  - number: 31.1.c
    text: gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel31
  - number: 31.1.d
    text: de belanghebbende, voor zover niet genoemd onder *a*, *b* of *c*, die een verzoek tot wijziging heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel31
  - number: '31.2'
    text: |-
      Behoudens in het geval, bedoeld in [artikel 30, derde lid onder a][ref1], geeft de kwantiteitsbeheerder van een
      voornemen tot gehele of gedeeltelijke intrekking zo spoedig mogelijk kennis aan de houder van de vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel30
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '30'
        hoofdstuk: III
        paragraaf: '4'
        afdeling: '4'
  - number: '31.3'
    text: |-
      De kennisgeving bevat de redenen waarop het voornemen tot wijziging dan wel gehele of gedeeltelijke intrekking is
      gegrond, en, indien het een voornemen tot wijziging betreft, de zakelijke inhoud van de wijziging.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel31
  - number: '31.4'
    text: |-
      Ten aanzien van de oppervlaktewateren onder beheer van het Rijk onderscheidenlijk ten aanzien van de overige
      oppervlaktewateren kunnen bij algemene maatregel van bestuur onderscheidenlijk bij provinciale verordening gevallen
      worden aangewezen, waarin [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is op een voornemen
      als bedoeld in het eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '33'
    text: |-
      De kwantiteitsbeheerder doet van een beslissing tot wijziging of tot weigering daarvan mededeling door toezending
      van een afschrift aan de kwaliteitsbeheerder en aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel33
  - number: '40'
    text: |-
      Aan degene die ten gevolge van het vaststellen of wijzigen van een peilbesluit, het vaststellen of wijzigen van
      een waterakkoord, het verlenen, weigeren, wijzigen of intrekken van een vergunning, schade lijdt of zal lijden,
      welke redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven en waarvan de vergoeding niet of niet
      op andere wijze voldoende is verzekerd, wordt door het gezag dat het desbetreffende besluit heeft genomen, op zijn
      verzoek een naar billijkheid te bepalen schadevergoeding toegekend. De schadevergoeding kan worden bepaald in geld
      of op andere wijze.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel40
  - number: '41'
    text: |-
      Indien het in [artikel 40][ref1] bedoelde gezag, niet zijnde het Rijk, een vergoeding als bedoeld in dat artikel
      geheel of gedeeltelijk toekent in verband met de noodzakelijke behartiging van een openbaar belang waarvan de
      behartiging niet of niet geheel tot zijn taak behoort, kan Onze Minister op verzoek van dit gezag aan het openbaar
      lichaam welks belang geheel of gedeeltelijk wordt behartigd, de verplichting opleggen de met toepassing van
      [artikel 40][ref2] gemoeide kosten die het gevolg zijn van die belangenbehartiging, geheel of gedeeltelijk te
      vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel40
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '40'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '40'
        hoofdstuk: V
  - number: '42'
    text: |-
      Een belanghebbende kan tegen een peilbesluit voor oppervlaktewateren onder beheer van het Rijk of een provincie
      beroep instellen bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel42
  - number: '43'
    text: |-
      In het geval dat een ander dan het Rijk of een provincie aan het waterakkoord deelneemt kan een belanghebbende
      beroep instellen bij gedeputeerde staten tegen een besluit als bedoeld in [artikel 19, eerste lid][ref1]. Voor
      de gevallen waarin gedeputeerde staten van meer dan één provincie van het beroep zouden moeten kennisnemen,
      wijzen provinciale staten van de desbetreffende provincies gedeputeerde staten van één van de provincies als
      beroepsinstantie aan. Deze aanwijzing geschiedt bij verordening, vastgesteld bij gemeenschappelijk besluit van
      provinciale staten van de desbetreffende provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel19
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '44'
    text: |-
      Tegen een beschikking ter zake van een vergunning als bedoeld in [artikel 24][ref1] of de aanvrage daarvan staat,
      ingeval het een beschikking betreft van een beheerder, niet zijnde het Rijk of een provincie, voor belanghebbenden
      beroep open op gedeputeerde staten van de provincie waarbinnen het gebied van de beheerder is gelegen. Indien
      gedeputeerde staten van meer dan één provincie van het beroep zouden moeten kennis nemen, staat het beroep open op
      gedeputeerde staten van de provincie op het grondgebied waarvan het besluit betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel24
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '24'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '4'
  - number: '51'
    text: |-
      Indien een beslissing van gedeputeerde staten op een krachtens dit hoofdstuk ingesteld beroep strekt tot gehele
      of gedeeltelijke vernietiging van een reeds in werking getreden besluit, kan, zo daartoe termen aanwezig zijn, bij
      die beslissing worden bepaald dat een vergoeding zal worden toegekend ten laste van het lichaam dat het geheel of
      gedeeltelijk vernietigde besluit heeft genomen, onverminderd het recht van degene die het beroep heeft ingesteld,
      om op grond van andere wettelijke bepalingen schadevergoeding te vragen.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel51
  - number: '52'
    text: |-
      Geschillen omtrent de naleving van een in werking getreden waterakkoord als bedoeld in
      [artikel 17, eerste lid][ref1], tussen de deelnemers worden beslist door de Afdeling bestuursrechtspraak van de
      Raad van State, voor zover zij niet behoren tot die, vermeld in [artikel 112, eerste lid, van de Grondwet][ref2].
      [Artikel 18][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel112
      [ref3]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '17'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '112'
      - id: ref3
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '53.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet, zijn belast de bij besluit van
      Onze Minister of van het bestuur van een openbaar lichaam aan welk enige taak bij de uitvoering van deze wet is
      opgedragen, aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel53
  - number: '53.2'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de ambtenaren, aangewezen bij besluit van Onze
      Minister en Onze Minister van Justitie. Deze ambtenaren zijn tevens belast met de opsporing van de feiten,
      strafbaar gesteld in de [artikelen 179 tot en met 182][ref2] en [184 van het Wetboek van Strafrecht][ref3], voor
      zover deze feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '53.3'
    text: |-
      Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel53
  - number: '58'
    text: |-
      Onze Minister is, voor zover het de hem bij of krachtens deze wet toegekende bevoegdheden betreft, bevoegd tot
      toepassing van bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel58
  - number: '59.1'
    text: |-
      Handelen in strijd met het in [artikel 24, eerste lid][ref1], omschreven verbod dan wel krachtens
      [artikel 24, vijfde lid][ref2], aan een vergunning verbonden voorschrift, wordt gestraft met hechtenis van ten
      hoogste drie maanden of geldboete van ten hoogste vijfentwintig duizend gulden.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel24
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '24'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '24'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '4'
  - number: '59.2'
    text: |-
      Handelen in strijd met bij of krachtens [artikel 12][ref1] vastgestelde verplichtingen wordt gestraft met hechtenis
      van ten hoogste drie weken of een geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel12
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
  - number: '59.3'
    text: De in het eerste en tweede lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel59
  - number: '60.1'
    text: |-
      Bepalingen in algemene maatregelen van bestuur en verordeningen van provincies, waterschappen, gemeenten en
      andere openbare lichamen ter zake van het afvoeren, aanvoeren, lozen of onttrekken van water, alsmede ter zake
      van het vaststellen van peilbesluiten blijven na de inwerkingtreding van deze wet van kracht, totdat daaromtrent
      op de wijze in deze wet bepaald voorzieningen zijn getroffen en zulks uiterlijk tot drie jaren na de dag van
      inwerkingtreding van deze bepaling.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel60
  - number: '60.2'
    text: |-
      Een peilbesluit onderscheidenlijk een besluit ter zake van het afvoeren of aanvoeren van water, genomen vóór de
      inwerkingtreding van de in het eerste lid bedoelde voorzieningen, behoudt zijn geldigheid totdat het is vervangen
      door een waterakkoord of een peilbesluit op grond van deze wet, behoudens eerdere beëindiging van de werking ervan.
      Een vóór de inwerkingtreding van de in het eerste lid bedoelde voorzieningen genomen besluit ter zake van het
      afvoeren of aanvoeren van water, dat is tot stand gekomen op de wijze van de [artikelen 18 tot en met 20][ref1] van
      deze wet, wordt beschouwd als een waterakkoord in de zin van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel18
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '60.3'
    text: |-
      Een vergunning, vóór de inwerkingtreding van de in het eerste lid bedoelde voorzieningen verleend op grond van
      enige wettelijke bepaling ter zake van het afvoeren, aanvoeren, lozen of onttrekken van water, wordt, voor zover
      niet verleend aan een kwantiteitsbeheerder voor het afvoeren of aanvoeren van water, voor de toepassing van deze
      wet beschouwd als een vergunning verleend op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel60
  - number: '61'
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van de landsverdediging worden bepaald dat de in
      [artikel 12, eerste lid][ref1], gestelde verplichting en het in [artikel 24, eerste lid][ref2], gestelde verbod
      niet van toepassing zijn. Daarbij kunnen voorschriften worden gegeven welke naar ons oordeel in het belang van de
      waterhuishouding nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel24
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '12'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '24'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '4'
  - number: '62'
    text: |-
      De bevoegdheid tot het maken van verordeningen door waterschappen en gemeenten blijft ten aanzien van het onderwerp
      van deze wet gehandhaafd voor zover deze verordeningen niet met het bij of krachtens deze wet bepaalde in strijd
      zijn.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel62
  - number: '66.1'
    text: |-
      Het provinciale plan bedoeld in [artikel 7][ref1] en de verordeningen bedoeld in [artikel 8, eerste lid][ref2],
      [artikel 9, vierde lid][ref3], [artikel 13, eerste lid][ref4], en [artikel 16, derde lid][ref5] worden niet eerder
      vastgesteld dan nadat belanghebbenden in de gelegenheid zijn gesteld van de inhoud hiervan kennis te nemen en hun
      zienswijze bij provinciale staten kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004575#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0004575#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0004575#Artikel16
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '7'
        hoofdstuk: II
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '8'
        hoofdstuk: II
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0004575
        artikel: '9'
        hoofdstuk: II
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0004575
        artikel: '13'
        hoofdstuk: III
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0004575
        artikel: '16'
        hoofdstuk: III
        afdeling: '2'
  - number: '66.2'
    text: Het bepaalde in het eerste lid vervalt zodra in de provincie een inspraakverordening van kracht is.
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel66
  - number: '69'
    text: 'Deze wet kan worden aangehaald als: Wet op de waterhuishouding.'
    url: https://wetten.overheid.nl/BWBR0004575/2002-09-01#Artikel69
  - number: '70'
    text: |-
      De artikelen van deze wet treden in werking op een door Ons te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden gesteld.
