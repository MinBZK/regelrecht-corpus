        afdeling: '1'
  - number: '60'
    text: |-
      1 Bepalingen in algemene maatregelen van bestuur en verordeningen van provincies, waterschappen, gemeenten en
      andere openbare lichamen ter zake van het afvoeren, aanvoeren, lozen of onttrekken van water, alsmede ter zake
      van het vaststellen van peilbesluiten blijven na de inwerkingtreding van deze wet van kracht, totdat daaromtrent
      op de wijze in deze wet bepaald voorzieningen zijn getroffen en zulks uiterlijk tot drie jaren na de dag van
      inwerkingtreding van deze bepaling.

      2 Een peilbesluit onderscheidenlijk een besluit ter zake van het afvoeren of aanvoeren van water, genomen vóór de
      inwerkingtreding van de in het eerste lid bedoelde voorzieningen, behoudt zijn geldigheid totdat het is vervangen
      door een waterakkoord of een peilbesluit op grond van deze wet, behoudens eerdere beëindiging van de werking ervan.
      Een vóór de inwerkingtreding van de in het eerste lid bedoelde voorzieningen genomen besluit ter zake van het
      afvoeren of aanvoeren van water, dat is tot stand gekomen op de wijze van de [artikelen 18 tot en met 20][ref1] van
      deze wet, wordt beschouwd als een waterakkoord in de zin van deze wet.

      3 Een vergunning, vóór de inwerkingtreding van de in het eerste lid bedoelde voorzieningen verleend op grond van
      enige wettelijke bepaling ter zake van het afvoeren, aanvoeren, lozen of onttrekken van water, wordt, voor zover
      niet verleend aan een kwantiteitsbeheerder voor het afvoeren of aanvoeren van water, voor de toepassing van deze
      wet beschouwd als een vergunning verleend op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel18
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '18'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '61'
    text: |-
      Bij algemene maatregel van bestuur kan in het belang van de landsverdediging worden bepaald dat de in
      [artikel 12, eerste lid][ref1], gestelde verplichting en het in [artikel 24, eerste lid][ref2], gestelde verbod
      niet van toepassing zijn. Daarbij kunnen voorschriften worden gegeven welke naar ons oordeel in het belang van de
      waterhuishouding nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel24
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel61
    references:
