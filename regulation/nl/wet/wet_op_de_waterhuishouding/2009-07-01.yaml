      1 Degene die water afvoert naar, aanvoert uit, loost in of onttrekt aan oppervlaktewateren waarover hij niet het
      beheer voert, is in daartoe aan te wijzen gevallen verplicht de wijze van afvoer, aanvoer, lozing of onttrekking
      te melden en - eventueel - de afgevoerde, aangevoerde, geloosde of onttrokken waterhoeveelheden te meten, daarvan
      aantekening te houden en van de verkregen gegevens opgave te doen.

      2 De in het eerste lid bedoelde melding en opgave worden in de gevallen welke geheel of gedeeltelijk betrekking
      hebben op de oppervlaktewateren onder beheer van het Rijk, gedaan aan Onze Minister en in de overige gevallen aan
      de kwantiteitsbeheerder van het desbetreffende oppervlaktewater.

      3 Een overzicht van de ontvangen gegevens wordt jaarlijks, vóór 1 juli van het jaar dat volgt op het kalenderjaar
      waarop de gegevens betrekking hebben, door Onze Minister toegezonden aan gedeputeerde staten van de desbetreffende
      provincie of provincies en door de beheerder, bedoeld in het tweede lid, aan Onze Minister en aan gedeputeerde
      staten van de desbetreffende provincie of provincies.

      4 Ter provinciale griffie liggen de in het derde lid bedoelde overzichten kosteloos ter inzage tot drie jaren na
      het einde van het kalenderjaar waarop zij betrekking hebben.

      5 Bij algemene maatregel van bestuur worden nadere regelen gesteld met betrekking tot de in het eerste lid bedoelde
      melding, meting, het houden van aantekening daarvan en het doen van opgave van de verkregen gegevens.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel12
  - number: '13'
    text: |-
      1 De in [artikel 12, eerste lid][ref1], bedoelde aanwijzing van gevallen welke geheel of gedeeltelijk betrekking
      hebben op de oppervlaktewateren onder beheer van het Rijk vindt plaats bij of krachtens algemene maatregel van
      bestuur en van de overige gevallen bij door de kwantiteitsbeheerder vast te stellen verordening. Bij de aanwijzing
      wordt rekening gehouden met het in [artikel 5][ref2] respectievelijk [artikel 9][ref3] bedoelde beheersplan. De
      kwantiteitsbeheerder zendt het besluit waarbij de verordening is vastgesteld aan Onze Minister.

      2 Een voordracht tot de in het eerste lid bedoelde algemene maatregel van bestuur wordt Ons gedaan door Onze
      Minister.


