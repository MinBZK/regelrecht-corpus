  - number: '58'
    text: |-
      Onze Minister is, voor zover het de hem bij of krachtens deze wet toegekende bevoegdheden betreft, bevoegd tot
      oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel58
  - number: '59'
    text: |-
      1 Handelen in strijd met het in [artikel 24, eerste lid][ref1], omschreven verbod, een krachtens
      [artikel 24, vierde lid][ref2], aan een vergunning verbonden voorschrift, dan wel een krachtens [artikel 33a][ref3]
      gestelde algemene regel, wordt gestraft met hechtenis van ten hoogste drie maanden of een geldboete van de vierde
      categorie.

      2 Handelen in strijd met bij of krachtens [artikel 12][ref4] vastgestelde verplichtingen wordt gestraft met
      hechtenis van ten hoogste drie weken of een geldboete van de eerste categorie.

      3 De in het eerste en tweede lid strafbaar gestelde feiten zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel24
