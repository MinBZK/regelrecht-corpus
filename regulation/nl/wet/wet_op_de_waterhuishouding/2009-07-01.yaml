  - number: '67'
    text: |-
      1 De bepalingen van deze wet zoals die luiden tot het tijdstip van inwerkingtreding van de Implementatiewet EG-
      kaderrichtlijn water blijven tot 22 december 2009 van toepassing op een voor dat tijdstip vastgestelde nota
      waterhuishouding en op een voor dat tijdstip vastgesteld plan als bedoeld in [artikel 5][ref1], [7][ref2]
      of [9][ref3] van deze wet. Indien voor een zodanige nota of een zodanig plan de termijn, bedoeld in
      [artikel 3, vierde lid][ref4], [5, vierde lid][ref5], of [7, vijfde lid][ref6], eindigt op een tijdstip, liggende
      tussen 21 december 2006 en 22 december 2009, kan die termijn worden verlengd tot 22 december 2009.

      2 Voor een waterhuishoudkundig systeem of onderdeel daarvan dat wordt gebruikt voor de onttrekking van voor
      menselijke consumptie bestemd water en van waaruit dagelijks meer dan 10 m3 water wordt onttrokken dan wel van
      waaruit water wordt ontrokken ten behoeve van meer dan 50 personen, wordt uiterlijk op 22 december 2004 een op
      dat gebruik betrekking hebbende functie vastgelegd in het desbetreffende plan als bedoeld in artikel [5][ref7],
      [7][ref8] of [9][ref9] van deze wet.


