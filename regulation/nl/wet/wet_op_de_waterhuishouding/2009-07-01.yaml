  - number: '5'
    text: |-
      1 Onze Ministers stellen ten aanzien van de oppervlaktewateren onder beheer van het Rijk een beheersplan vast.
      Het plan kan bestaan uit afzonderlijke delen. Bij de vaststelling van het plan wordt rekening gehouden met
      de in [artikel 3][ref1] bedoelde nota en, voor zover het krachtens [artikel 7, tweede lid][ref2], aangewezen
      oppervlaktewateren betreft, met het provinciaal plan voor de waterhuishouding.

      2 Het plan geeft aan:

      a. de functies van de oppervlaktewateren;

      b. het programma van maatregelen en voorzieningen, die met het oog op de ontwikkeling, werking en bescherming
      van de waterhuishoudkundige systemen of onderdelen daarvan en de bescherming van het milieu nodig zijn, onder
      vermelding van de termijnen die daarbij worden nagestreefd;

      c. de wijze waarop het beheer bij normale en bij afwijkende omstandigheden wordt gevoerd;

      d. de financiële middelen, die voor de uitvoering van het programma en het te voeren beheer nodig zijn.

      3 Tot de maatregelen en voorzieningen, bedoeld in het tweede lid, onderdeel b, behoren mede, gerangschikt naar
      stroomgebieddistrict:

      a. de aanwijzing van oppervlaktewateren of onderdelen daarvan als kunstmatige of sterk veranderde
      oppervlaktewaterlichamen, overeenkomstig artikel 4, derde lid, van de kaderrichtlijn water, dan wel als natuurlijk
      oppervlaktewaterlichaam, en

      b. de maatregelen, bedoeld in artikel 11 van de kaderrichtlijn water.

      4 Het plan gaat vergezeld van een toelichting.

      5 Het plan wordt ten minste eenmaal in de zes jaren herzien. Nieuwe of herziene maatregelen treden uiterlijk drie
      jaren na de opneming in het plan in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel7
