      1 Een kwantiteitsbeheerder is in daartoe aan te wijzen gevallen verplicht voor oppervlatewateren onder zijn beheer
      één of meer peilbesluiten vast te stellen. De kwantiteitsbeheerder draagt er zorg voor dat de in het peilbesluit
      aangegeven waterstanden gedurende daarbij aangegeven perioden zoveel mogelijk worden gehandhaafd. Bij het
      vaststellen van het peilbesluit wordt rekening gehouden met de in de [artikelen 5][ref1] en [9][ref2] bedoelde
      beheersplannen, die van toepassing zijn op de oppervlaktewateren waarop het peilbesluit betrekking heeft.

      2 Ten aanzien van oppervlaktewateren onder beheer van het Rijk worden bij algemene maatregel van bestuur nadere
      regelen gesteld met betrekking tot het peilbesluit.

      3 Ten aanzien van de overige oppervlaktewateren stellen provinciale staten bij verordening nadere regelen met
      betrekking tot het peilbesluit.

      4 De in het eerste lid bedoelde aanwijzing van gevallen welke geheel of gedeeltelijk betrekking hebben op de
      oppervlaktewateren onder beheer van het Rijk vindt plaats bij of krachtens algemene maatregel van bestuur en van
      de overige gevallen bij door provinciale staten vast te stellen verordening. Provinciale staten zenden het besluit
      waarbij de verordening is vastgesteld aan Onze Minister.

      5 Een voordracht tot de in het vierde lid bedoelde algemene maatregel van bestuur wordt Ons gedaan door Onze
      Minister.

      6 Onze Minister kan aan provinciale staten omtrent de vaststelling of wijziging en de inhoud van een verordening
      als bedoeld in het vierde lid aanwijzingen geven indien een samenhangend en doelmatig beleid en beheer met
      betrekking tot de waterhuishouding zulks vorderen. [Artikel 10, tweede tot en met vijfde lid][ref3], is van
      overeenkomstige toepassing.


