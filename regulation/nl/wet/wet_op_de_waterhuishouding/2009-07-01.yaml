  - number: '40'
    text: |-
      Aan degene die ten gevolge van het vaststellen of wijzigen van een peilbesluit, het vaststellen of wijzigen van een
      waterakkoord, het verlenen, weigeren, wijzigen of intrekken van een vergunning of het vaststellen of wijzigen van
      een algemene regel als bedoeld in [artikel 33a][ref1], schade lijdt of zal lijden, welke redelijkerwijze niet of
      niet geheel te zijnen laste behoort te blijven en waarvan de vergoeding niet of niet op andere wijze voldoende is
      verzekerd, wordt door het gezag dat het desbetreffende besluit heeft genomen, op zijn verzoek een naar billijkheid
      te bepalen schadevergoeding toegekend. De schadevergoeding kan worden bepaald in geld of op andere wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel33a
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: 33a
        hoofdstuk: III
        afdeling: '5'
  - number: '41'
    text: |-
      Indien het in [artikel 40][ref1] bedoelde gezag, niet zijnde het Rijk, een vergoeding als bedoeld in dat artikel
      geheel of gedeeltelijk toekent in verband met de noodzakelijke behartiging van een openbaar belang waarvan de
      behartiging niet of niet geheel tot zijn taak behoort, kan Onze Minister op verzoek van dit gezag aan het openbaar
      lichaam welks belang geheel of gedeeltelijk wordt behartigd, de verplichting opleggen de met toepassing van
      [artikel 40][ref2] gemoeide kosten die het gevolg zijn van die belangenbehartiging, geheel of gedeeltelijk te
      vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel40
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel41
