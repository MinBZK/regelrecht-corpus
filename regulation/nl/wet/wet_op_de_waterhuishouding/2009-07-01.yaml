        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003748
        artikel: '2'
  - number: 2b
    text: |-
      1 Provinciale besturen, kwaliteitsbeheerders, kwantiteitsbeheerders en gemeentebesturen:

      a. verrichten de analyses en beoordelingen, bedoeld in artikel 5 van de kaderrichtlijn water, en

      b. verstrekken aan Onze Minister de resultaten daarvan, alsmede de overige gegevens, bedoeld in bijlage VII van de
      kaderrichtlijn water,

      voor zover die betrekking hebben op hun onderscheiden aandeel in de waterhuishouding in een stroomgebieddistrict,
      onverminderd het bepaalde in [hoofdstuk II van deze wet][ref1].

      2 Op initiatief van Onze Minister vindt per stroomgebieddistrict overleg van de betrokken bestuursorganen plaats
      ten behoeve van een goede uitvoering van het eerste lid.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld aangaande de gegevensverstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel2b
