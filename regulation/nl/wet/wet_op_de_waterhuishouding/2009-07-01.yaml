  - number: '4'
    text: |-
      1 Op de voorbereiding van de nota is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      2 Onze Ministers leggen ter inzage:

      a. een tijdschema en een werkprogramma voor de opstelling of een herziening van het internationale
      stroomgebiedbeheersplan of het stroomgebiedbeheersplan, tenminste drie jaren voor het begin van de periode waarop
      het plan betrekking heeft,

      b. een tussentijds overzicht van belangrijke waterbeheerkwesties die zijn vastgesteld in het stroomgebieddistrict
      of het in [artikel 2a][ref2] bedoelde deel daarvan, tenminste twee jaren voor het begin van de periode waarop het
      plan of een herziening betrekking heeft, en

      c. het ontwerp voor het stroomgebiedbeheersplan of voor het internationaal stroomgebiedbeheersplan of een
      herziening voor zover betrekking of mede betrekking hebbend op het op Nederlands grondgebied gelegen deel van
      het desbetreffende stroomgebieddistrict, tenminste een jaar voor het begin van de periode waarop het plan of de
      herziening betrekking heeft.

      3 Zienswijzen kunnen naar voren worden gebracht door een ieder.

      4 De termijn voor het naar voren brengen van zienswijzen over de in het tweede lid bedoelde stukken bedraagt zes
      maanden en vangt aan met ingang van de dag waarop het stuk ter inzage is gelegd.

      5 Met betrekking tot grensvormende of grensoverschrijdende wateren raadplegen Onze Ministers de ten aanzien van
      die wateren bevoegde Duitse of Belgische autoriteiten. Met betrekking tot stroomgebiedbeheersplannen en de inbreng
      voor de internationale stroomgebiedbeheersplannen raadplegen Onze Ministers de regeringen van de andere staten in
      het stroomgebieddistrict.

      6 Onze Ministers raadplegen ten aanzien van de maatregelen bedoeld in artikel 11 van de kaderrichtlijn gedeputeerde
      staten van de betrokken provincies en de kwantiteitsbeheerders en kwaliteitsbeheerders van het op Nederlands
      grondgebied gelegen deel van het stroomgebieddistrict.

      7 Onze Ministers brengen de ontvangen zienswijzen over het ontwerp voor een internationaal stroomgebiedbeheersplan
      of een herziening, voor zover die zienswijzen niet uitsluitend betrekking hebben op het op Nederlands grondgebied
      gelegen deel van het desbetreffende stroomgebieddistrict, ter kennis van de regeringen van de andere staten in
      het stroomgebieddistrict.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel2a
