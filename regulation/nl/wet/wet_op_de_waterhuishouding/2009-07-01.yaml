preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen in het belang van een samenhangend
    en doelmatig beleid en beheer met betrekking tot de waterhuishouding in haar geheel alsmede nadere regelen met
    betrekking tot het kwantiteitsbeheer over het oppervlaktewater;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In het bij of krachtens deze wet bepaalde wordt verstaan onder:

      "Onze Minister": Onze Minister van Verkeer en Waterstaat;

      "Onze Ministers": Onze Minister van Verkeer en Waterstaat tezamen met Onze Ministers van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer en van Landbouw, Natuur en Voedselkwaliteit, ieder voor zover het
      aangelegenheden betreft die mede tot zijn verantwoordelijkheid behoren;

      "waterhuishouding": de overheidszorg die zich richt op het op en in de bodem vrij aanwezige water, met het oog op
      de daarbij betrokken belangen;

      "waterhuishoudkundig systeem": een samenhangend geheel van oppervlaktewateren en grondwatervoorkomens;

      "kwantiteitsbeheerder": het openbaar gezag dat belast is met kwantiteitsbeheer van oppervlaktewater;

      "kwaliteitsbeheerder": het openbaar gezag dat bevoegd is tot vergunningverlening ingevolge de
      [Wet verontreiniging oppervlaktewateren][ref1] (*Stb.* 1981, 573);

      "kaderrichtlijn water": [richtlijn nr. 2000/60/EG](32000L0060) van het Europees Parlement en de Raad van de
      Europese Unie van 23 oktober 2000 tot vaststelling van een kader voor communautaire maatregelen betreffende het
      waterbeleid (PbEG L 327), zoals deze is gewijzigd bij beschikking nr. 2455/2001/EG van het Europees Parlement en de
      Raad van 20 november 2001 tot vaststelling van de lijst van prioritaire stoffen op het gebied van het waterbeleid
      en tot wijziging van [richtlijn 2000/60/EG](32000L0060) (PbEG L 331) en met inbegrip van wijzigingen uit hoofde
      van artikel 20, eerste lid, van de richtlijn, doch voor het overige naar de tekst zoals deze bij de richtlijn is
      vastgesteld;

      "stroomgebied": een gebied vanwaar al het over het oppervlak lopende water via een reeks stromen, rivieren en
      eventueel meren door één riviermond, estuarium of delta in zee stroomt;

      "stroomgebieddistrict": het gebied van land en zee, gevormd door een of meer aan elkaar grenzende stroomgebieden
      met de bijbehorende grond- en kustwateren;

      "stroomgebiedbeheersplan": plan als bedoeld in artikel 13 van de kaderrichtlijn water, dat betrekking heeft op het
      op Nederlands grondgebied gelegen deel van een stroomgebieddistrict;

      "internationaal stroomgebiedbeheersplan": plan als bedoeld in artikel 13 van de kaderrichtlijn water, dat
      betrekking heeft op zowel het op Nederlands grondgebied gelegen deel van een stroomgebieddistrict als het buiten
      Nederlands grondgebied gelegen deel van een stroomgebieddistrict;

      natuurlijk oppervlaktewaterlichaam: oppervlaktewaterlichaam dat niet wordt aangewezen als kunstmatig dan wel sterk
      veranderd oppervlaktewaterlichaam, een en ander in de zin van de kaderrichtlijn water.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel1
