  - number: '24'
    text: |-
      1 Het is in daartoe aan te wijzen gevallen verboden water te lozen in of te onttrekken aan oppervlaktewateren
      zonder vergunning. Het verbod geldt eveneens ingeval door anderen dan kwantiteitsbeheerders water wordt afgevoerd
      naar of aangevoerd uit oppervlaktewateren. Het verbod geldt niet voor kwantiteitsbeheerders voor zover zij water
      lozen in of onttrekken aan oppervlaktewateren waarover zij zelf het beheer voeren.

      2 De aanwijzing ingevolge het eerste lid kan enkel betreffen de lozing of onttrekking van waterhoeveelheden
      die, zelfstandig of in samenhang met andere lozingen of onttrekkingen, van nadelige invloed kunnen zijn op
      de peilregeling, de grondwaterstand of de waterbeweging, dan wel de kwantiteitsbeheerder kunnen noodzaken tot
      bijzondere beheersmaatregelen. De [artikelen 13][ref1] en [15][ref2] zijn van overeenkomstige toepassing.

      3 Een vergunning wordt verleend door de kwantiteitsbeheerder van het desbetreffende oppervlaktewater. Is het Rijk
      kwantiteitsbeheerder, dan geschiedt de vergunningverlening door of vanwege Onze Minister. Bij het verlenen van de
      vergunning wordt rekening gehouden met de in de [artikelen 5][ref3] en [9][ref4] bedoelde beheersplannen, die van
      toepassing zijn op het oppervlaktewater waarop de vergunning betrekking heeft.

      4 Aan de vergunning kunnen voorschriften worden verbonden ter bescherming van het belang van de waterhuishouding
      voor zover het bij of krachtens de [Wet verontreiniging oppervlaktewateren][ref5] of de [Grondwaterwet][ref6]
      bepaalde daarin niet voorziet.

      5 In de vergunning worden ten minste de waterhoeveelheden vermeld die per één of meer tijdseenheden mogen
      onderscheidenlijk moeten worden afgevoerd, aangevoerd, geloosd of onttrokken, alsmede, voor zover het aanvoeren
      of onttrekken betreft, het doel waarvoor de waterhoeveelheden zijn bestemd. De vorige volzin geldt niet voor
      zover de vergunning wordt verleend voor een lozing in een geval waarin ingevolge het eerste lid een aanwijzing
      van toepassing is in verband met de nadelige invloed van de lozing van de desbetreffende waterhoeveelheden op de
      grondwaterstand of de grondwaterbeweging.

      6 De vergunning geldt ook voor de rechtsopvolgers van de houder, met dien verstande dat zij met ingang van de
      vierde maand na de dag van de rechtsopvolging vervalt, tenzij vóór dat tijdstip de wijziging van de tenaamstelling
      schriftelijk is aangevraagd.


