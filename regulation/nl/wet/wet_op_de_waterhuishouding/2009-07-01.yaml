        artikel: '24'
        hoofdstuk: III
        paragraaf: '1'
        afdeling: '4'
  - number: '62'
    text: |-
      De bevoegdheid tot het maken van verordeningen door waterschappen en gemeenten blijft ten aanzien van het onderwerp
      van deze wet gehandhaafd voor zover deze verordeningen niet met het bij of krachtens deze wet bepaalde in strijd
      zijn.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel62
  - number: '63'
    text: |-
      Bepalingen in verordeningen van provincies ter zake van de aanwijzing van registratie- of vergunningplichtige
      gevallen, vastgesteld op grond van de artikelen 13, eerste lid, 14 of 24, tweede of derde lid, zoals deze luidden
      voor de inwerkingtreding van de Wet van 23 februari 2004, Stb. 191, blijven na de inwerkingtreding van die wet
      van kracht tot het tijdstip waarop met betrekking tot de in die verordeningen genoemde gevallen voorschriften
      van de kwantiteitsbeheerder als bedoeld in de [artikelen 13, eerste lid][ref1], [24, eerste lid][ref2],
      of [33a, eerste lid][ref3], van kracht worden.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004575#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004575#Artikel33a
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel63
