      1 De deelnemers stellen zo spoedig mogelijk, doch uiterlijk binnen een termijn van acht maanden na het van kracht
      worden van de in [artikel 17, eerste lid][ref1], bedoelde verplichting een ontwerp van het waterakkoord op.

      2 Een exemplaar van het ontwerp wordt uiterlijk twee weken na het opstellen ervan toegezonden aan:

      a. gedeputeerde staten van de desbetreffende provincie of provincies;

      b. de besturen van andere openbare lichamen alsmede andere bestuursorganen of instellingen welke naar het oordeel
      van de deelnemers geacht kunnen worden bij het ontwerp belang te hebben.

      3 Gedurende een termijn van vier weken vanaf de datum van verzending kunnen degenen aan wie het ontwerp is
      toegezonden, hun zienswijze omtrent het ontwerp aan de deelnemers kenbaar maken.


