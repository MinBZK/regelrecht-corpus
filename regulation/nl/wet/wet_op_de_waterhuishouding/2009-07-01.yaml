  - number: 1a
    text: |-
      Een wijziging uit hoofde van artikel 20, eerste lid, van de kaderrichtlijn water gaat voor de toepassing van deze
      wet gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij
      bij ministerieel besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel1a
  - number: '2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden tot de oppervlaktewateren onder beheer
      van het Rijk mede gerekend de bij of krachtens algemene maatregel van bestuur aangewezen door anderen beheerde
      oppervlaktewateren die met de oppervlaktewateren onder beheer van het Rijk in open verbinding staan. Over een
      voordracht voor een zodanige algemene maatregel van bestuur stelt Onze Minister de kwantiteitsbeheerders van de
      betrokken oppervlaktewateren in de gelegenheid hun oordeel te geven.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel2
  - number: 2a
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt het Nederlandse grondgebied
      ingedeeld in de op Nederlands grondgebied gelegen delen van de stroomgebieddistricten Eems, Rijn, Maas
      en Schelde. Onder het Nederlandse grondgebied wordt mede verstaan de territoriale zee, voor zover die is
      gelegen aan de landzijde van de lijn waarvan elk punt zich bevindt op een afstand van een internationale
      zeemijl, zijnde achttienhonderd en twee en vijftig meter, gemeten zeewaarts vanaf de laagwaterlijn,
      bedoeld in [artikel 1 van de Wet grenzen Nederlandse territoriale zee][ref1] of de basislijn, bedoeld in
      [artikel 2 van die wet][ref2].

      2 De onderlinge grenzen van de Nederlandse delen van de stroomgebieddistricten worden vastgesteld bij algemene
      maatregel van bestuur. Daarbij wordt tevens voorzien in de toedeling van grondwatervoorkomens aan één van de
      stroomgebieddistricten.

      3 Bij de voorbereiding van de maatregel raadplegen Onze Ministers per stroomgebieddistrict gedeputeerde staten van
      de betrokken provincies, de kwaliteitsbeheerders en de kwantiteitsbeheerders, alsmede de regeringen van de andere
      staten in het stroomgebieddistrict.


      [ref1]: https://wetten.overheid.nl/BWBR0003748#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003748#Artikel2
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel2a
    references:
