      Onze Minister kan aan provinciale staten omtrent de vaststelling of wijziging en de inhoud van een verordening als
      bedoeld in de [artikelen 8, eerste lid][ref1] en [9, vierde lid][ref2], aanwijzingen geven indien een samenhangend
      en doelmatig beleid en beheer met betrekking tot de waterhuishouding, nationaal dan wel per stroomgebieddistrict,
      zulks vorderen. [Artikel 10, tweede, derde, vierde en vijfde lid][ref3] is van overeenkomstige toepassing.


