        artikel: '40'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004575
        artikel: '40'
        hoofdstuk: V
  - number: '42'
    text: |-
      Een belanghebbende kan tegen een peilbesluit voor oppervlaktewateren onder beheer van het Rijk of een provincie
      beroep instellen bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel42
  - number: '43'
    text: |-
      In het geval dat een ander dan het Rijk of een provincie aan het waterakkoord deelneemt kan een belanghebbende
      beroep instellen bij gedeputeerde staten tegen een besluit als bedoeld in [artikel 19, eerste lid][ref1]. Voor
      de gevallen waarin gedeputeerde staten van meer dan één provincie van het beroep zouden moeten kennisnemen,
      wijzen provinciale staten van de desbetreffende provincies gedeputeerde staten van één van de provincies als
      beroepsinstantie aan. Deze aanwijzing geschiedt bij verordening, vastgesteld bij gemeenschappelijk besluit van
      provinciale staten van de desbetreffende provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel19
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004575
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
        afdeling: '3'
  - number: '51'
    text: |-
      Indien een beslissing van gedeputeerde staten op een krachtens dit hoofdstuk ingesteld beroep strekt tot gehele
      of gedeeltelijke vernietiging van een reeds in werking getreden besluit, kan, zo daartoe termen aanwezig zijn, bij
      die beslissing worden bepaald dat een vergoeding zal worden toegekend ten laste van het lichaam dat het geheel of
      gedeeltelijk vernietigde besluit heeft genomen, onverminderd het recht van degene die het beroep heeft ingesteld,
      om op grond van andere wettelijke bepalingen schadevergoeding te vragen.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel51
  - number: '52'
    text: |-
      Geschillen omtrent de naleving van een in werking getreden waterakkoord als bedoeld in
      [artikel 17, eerste lid][ref1], tussen de deelnemers worden beslist door de Afdeling bestuursrechtspraak van de
      Raad van State, voor zover zij niet behoren tot die, vermeld in [artikel 112, eerste lid, van de Grondwet][ref2].
      [Artikel 18][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel112
      [ref3]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel52
