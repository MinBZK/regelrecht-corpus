        afdeling: '3.4'
  - number: '29'
    text: |-
      De kwantiteitsbeheerder doet van een beslissing tot verlening van een vergunning of tot weigering daarvan
      mededeling door toezending van een afschrift aan de kwaliteitsbeheerder en aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel29
  - number: '30'
    text: |-
      1 De kwantiteitsbeheerder kan uit eigen beweging of op schriftelijk verzoek van een belanghebbende een vergunning
      wijzigen, dan wel geheel of gedeeltelijk intrekken.

      2 Behoudens ingeval de houder van de vergunning om de wijziging verzoekt, kan een vergunning
      slechts worden gewijzigd indien de bescherming van het belang van de waterhuishouding voor zover de
      [Wet verontreiniging oppervlaktewateren][ref1] of de [Grondwaterwet][ref2] daarin niet voorziet, zulks vordert.

      3 Een vergunning kan slechts geheel of gedeeltelijk worden ingetrokken indien:

      a. de houder van de vergunning schriftelijk verklaart daarvan in het geheel onderscheidenlijk voor een gedeelte
      geen gebruik meer te zullen maken;

      b. de ter verkrijging van de vergunning verstrekte gegevens zodanig onjuist of onvolledig blijken dat op de
      aanvraag een andere beslissing zou zijn genomen indien bij de beoordeling daarvan de juiste gegevens bekend waren
      geweest;

      c. van de vergunning gedurende vier achtereenvolgende jaren in het geheel onderscheidenlijk voor een gedeelte geen
      gebruik is gemaakt;

      d. wordt gehandeld in strijd met de vergunning;

      e. blijkt van feiten of omstandigheden waardoor, in verband met het belang van de waterhuishouding voor zover dit
      niet door de [Wet verontreiniging oppervlaktewateren][ref3] of de [Grondwaterwet][ref4] wordt beschermd, de lozing,
      onttrekking, afvoer of aanvoer in het geheel onderscheidenlijk voor een gedeelte niet langer toelaatbaar wordt
      geacht.

      4 Bij de wijziging of intrekking van een vergunning wordt rekening gehouden met de in de [artikelen 5][ref5] en
      [9][ref6] bedoelde beheersplannen, die van toepassing zijn op het oppervlaktewater waarop de vergunning betrekking
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002682
