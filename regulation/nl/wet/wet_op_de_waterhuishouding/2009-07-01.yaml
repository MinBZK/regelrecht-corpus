      2 Binnen een termijn van drie maanden na het in het eerste lid bedoelde verzoek wordt een aanvang gemaakt met de
      voorbereiding van de wijziging van het waterakkoord. Bij de wijziging van het waterakkoord wordt rekening gehouden
      met de in de [artikelen 5][ref1] en [9][ref2] bedoelde beheersplannen, welke op de oppervlaktewateren waarop
      het waterakkoord betrekking heeft van toepassing zijn. De [artikelen 18][ref3], [19][ref4] en [20][ref5] zijn van
      overeenkomstige toepassing.


