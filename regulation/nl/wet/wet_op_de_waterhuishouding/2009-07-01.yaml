  - number: '64'
    text: |-
      Ten aanzien van de behandeling van beroep dat voor de datum van inwerkingtreding van de Wet van 23 februari 2004,
      Stb. 191 is ingesteld tegen een beschikking ter zake van een vergunning als bedoeld in [artikel 24][ref1], of ter
      zake van de aanvraag daarvan, blijft het recht zoals dat gold voor die datum van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel24
