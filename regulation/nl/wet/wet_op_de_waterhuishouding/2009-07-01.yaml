  - number: '33'
    text: |-
      De kwantiteitsbeheerder doet van een beslissing tot wijziging of tot weigering daarvan mededeling door toezending
      van een afschrift aan de kwaliteitsbeheerder en aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel33
  - number: 33a
    text: |-
      1 De kwantiteitsbeheerder kan algemene regels stellen ten aanzien van het lozen van water in, het onttrekken van
      water aan, het afvoeren van water naar of het aanvoeren van water uit oppervlaktewateren waarover hij het beheer
      voert.

      2 De regels kunnen enkel betreffen de lozing, onttrekking, aanvoer of afvoer van waterhoeveelheden die, niet
      zelfstandig maar wel in samenhang met andere lozingen, onttrekkingen, aanvoer of afvoer, van nadelige invloed
      kunnen zijn op de peilregeling, de grondwaterstand of de waterbeweging, dan wel de kwantiteitsbeheerder kunnen
      nopen tot bijzondere beheersmaatregelen.

      3 De regels kunnen het belang van de waterhuishouding beschermen voor zover het bij of krachtens de
      [Wet verontreiniging oppervlaktewateren][ref1] of de [Grondwaterwet][ref2] bepaalde daarin niet voorziet.

      4 De regels kunnen een algeheel verbod of een bepaalde beperking inhouden van het met behulp van daarbij aan te
      geven categorieën van werken afvoeren, aanvoeren, lozen of onttrekken van waterhoeveelheden. De regels kunnen
      betrekking hebben op alle of op bepaalde oppervlaktewateren ten aanzien waarvan de in het eerste lid bedoelde
      bevoegdheid kan worden uitgeoefend.

      5 De regels kunnen geen betrekking hebben op gevallen waarin ingevolge [artikel 24, eerste lid][ref3], een
      vergunning is vereist.

      6 Het vijfde lid geldt niet voor zover de regels overgangsvoorzieningen betreffen voor gevallen waarvoor
      onmiddellijk voorafgaand aan de inwerkingtreding van die regels een vergunning was vereist ingevolge
      [artikel 24, eerste lid][ref4].

      7 [Artikel 13][ref5] is van overeenkomstige toepassing met betrekking tot de wijze van vaststelling van de regels.
      [Artikel 15][ref6] is van overeenkomstige toepassing met betrekking tot de aanwijzingen van Onze Minister omtrent
      de vaststelling of wijziging en de inhoud van een verordening als bedoeld in [artikel 13, eerste lid][ref7].


