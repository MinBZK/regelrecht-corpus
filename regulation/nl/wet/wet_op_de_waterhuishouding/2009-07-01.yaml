  - number: '25'
    text: |-
      1 De aanvraag tot verlening van een vergunning wordt ingediend bij de kwantiteitsbeheerder.

      2 Bij of krachtens algemene maatregel van bestuur kunnen nadere regelen worden gesteld met betrekking tot de
      gegevens en bescheiden welke de aanvrager moet overleggen teneinde een beoordeling van de aanvraag mogelijk te
      maken.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel25
  - number: '26'
    text: |-
      De kwantiteitsbeheerder zendt zo spoedig mogelijk een exemplaar van de aanvraag aan de kwaliteitsbeheerder, onder
      mededeling dat hij van advies kan dienen, alsmede aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel26
  - number: '27'
    text: |-
      Ten aanzien van de oppervlaktewateren onder beheer van het Rijk onderscheidenlijk ten aanzien van de overige
      oppervlaktewateren kunnen bij algemene maatregel van bestuur onderscheidenlijk bij provinciale verordening
      gevallen worden aangewezen, waarin [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing is op de
      voorbereiding van de beschikking op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel27
