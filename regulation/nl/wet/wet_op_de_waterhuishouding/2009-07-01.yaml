  - number: '31'
    text: |-
      1 Van een voornemen tot wijziging geeft de kwantiteitsbeheerder zo spoedig mogelijk kennis aan:

      a. de houder van de vergunning;

      b. de kwaliteitsbeheerder;

      c. gedeputeerde staten;

      d. de belanghebbende, voor zover niet genoemd onder *a*, *b* of *c*, die een verzoek tot wijziging heeft gedaan.

      2 Behoudens in het geval, bedoeld in [artikel 30, derde lid onder a][ref1], geeft de kwantiteitsbeheerder van een
      voornemen tot gehele of gedeeltelijke intrekking zo spoedig mogelijk kennis aan de houder van de vergunning.

      3 De kennisgeving bevat de redenen waarop het voornemen tot wijziging dan wel gehele of gedeeltelijke intrekking is
      gegrond, en, indien het een voornemen tot wijziging betreft, de zakelijke inhoud van de wijziging.

      4 Ten aanzien van de oppervlaktewateren onder beheer van het Rijk onderscheidenlijk ten aanzien van de overige
      oppervlaktewateren kunnen bij algemene maatregel van bestuur onderscheidenlijk bij provinciale verordening gevallen
      worden aangewezen, waarin [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing is op een voornemen
      als bedoeld in het eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
