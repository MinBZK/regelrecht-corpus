      1 Het in [artikel 22, tweede lid][ref1], bedoelde gezag kan in het geval, bedoeld in het eerste lid van dat
      artikel, of indien een samenhangend beleid en beheer met betrekking tot de waterhuishouding zulks vordert, aan de
      deelnemers aanwijzingen geven omtrent de vaststelling of wijziging en de inhoud van een waterakkoord.

      2 Bij een aanwijzing kan een termijn worden gesteld binnen welke het waterakkoord dient te zijn vastgesteld dan
      wel, indien het een vastgesteld waterakkoord betreft, de wijziging dient te hebben plaatsgevonden.

      3 Een aanwijzing wordt niet gegeven dan nadat de deelnemers in de gelegenheid zijn gesteld van hun gevoelen
      omtrent het voornemen tot het geven van de aanwijzing te doen blijken. Indien Onze Minister het voornemen heeft een
      aanwijzing te geven, stelt hij, indien de provincie niet tot de deelnemers behoort, ook gedeputeerde staten in de
      gelegenheid hun gevoelen daaromtrent te laten blijken.

      4 De deelnemers stellen het waterakkoord vast of wijzigen het waterakkoord in overeenstemming met de gegeven
      aanwijzing.

      5 Van de beschikking, houdende de aanwijzing, wordt mededeling gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel22
