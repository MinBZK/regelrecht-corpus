  - number: '3'
    text: |-
      1 Onze Ministers stellen een nota vast waarin:

      a. de hoofdlijnen van het ten aanzien van de landelijke waterhuishouding te voeren beleid zijn aangegeven, en

      b. de stroomgebiedbeheersplannen of de inbreng voor de internationale stroomgebiedbeheersplannen met betrekking tot
      de in [artikel 2a][ref1] bedoelde delen van de stroomgebieddistricten zijn opgenomen.

      Bij het vaststellen van de nota wordt voor elk van de in [artikel 2a][ref2] bedoelde delen van de
      stroomgebieddistricten rekening gehouden met het desbetreffende internationale stroomgebiedbeheersplan, dan wel
      wordt dat plan in acht genomen voor zover dat uit het plan voortvloeit.

      2 De hoofdlijnen omvatten:

      a. een aanduiding van de belangrijkste functies van de oppervlaktewateren behorend tot het waterhuishoudkundig
      hoofdsysteem en, voorzover nationale belangen dat nodig maken, van de regionale waterhuishoudkundige systemen;

      b. aanwijzingen voor de verdere bepaling van functies van waterhuishoudkundige systemen of onderdelen daarvan;

      c. een aanduiding, in samenhang met de onder *a* en *b* bedoelde functies, van de gewenste ontwikkeling, werking
      en bescherming van de waterhuishoudkundige systemen of onderdelen daarvan, alsmede van de termijnen die daarbij
      worden nagestreefd;

      d. een uiteenzetting van de algemene aard en omvang van de maatregelen en voorzieningen, die met het oog op
      die ontwikkeling, en werking en bescherming nodig zijn, met inbegrip van de maatregelen, bedoeld in artikel
      11 van de kaderrichtlijn water, voor zover die op elk van de in [artikel 2a][ref3] bedoelde delen van de
      stroomgebieddistricten van toepassing zijn;

      e. een aanduiding van de redelijkerwijze te verwachten financiële, economische en ruimtelijke gevolgen van het te
      voeren beleid.

      3 De nota geeft aan in hoeverre de hoofdlijnen zijn afgestemd op dan wel leiden tot aanpassing van het nationale
      milieubeleid en het nationale beleid inzake natuur en landschap en in hoeverre en binnen welke termijn Onze
      Ministers voornemens zijn het geldende nationale milieubeleidsplan en het geldende natuurbeleidsplan te herzien.

      4 Een stroomgebiedbeheersplan omvat de informatie die ingevolge bijlage VII bij de kaderrichtlijn water daarin moet
      worden opgenomen.

      5 Het vierde lid is van overeenkomstige toepassing op de in het eerste lid, onderdeel b, bedoelde inbreng, met dien
      verstande dat slechts de gegevens worden opgenomen die betrekking of mede betrekking hebben op het Nederlandse deel
      van een stroomgebieddistrict.

      6 De nota wordt tenminste eenmaal in de zes jaren herzien. Nieuwe of herziene maatregelen treden uiterlijk drie
      jaren na de opneming in de nota in werking.

      7 Onze Minister doet de nota aan de Tweede Kamer der Staten-Generaal toekomen.


