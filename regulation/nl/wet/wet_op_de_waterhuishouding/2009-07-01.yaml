  - number: '7'
    text: |-
      1 Provinciale staten stellen een provinciaal plan vast, waarin de hoofdlijnen van het ten aanzien van de
      waterhuishouding in de provincie te voeren beleid zijn aangegeven. Daarbij wordt rekening gehouden met de in
      [artikel 3][ref1] bedoelde nota.

      2 Het plan heeft mede betrekking op bij of krachtens algemene maatregel van bestuur aangewezen oppervlaktewateren
      onder beheer van het Rijk.

      3 De hoofdlijnen van het plan omvatten:

      a. de vastlegging van de belangrijkste functies van de regionale waterhuishoudkundige systemen of onderdelen
      daarvan;

      b. een aanduiding, in samenhang met de onder a bedoelde functies, van de gewenste ontwikkeling, werking en
      bescherming van de regionale waterhuishoudkundige systemen of onderdelen daarvan alsmede van de termijnen die
      daarbij worden nagestreefd;

      c. een uiteenzetting van het ingevolge de [Grondwaterwet][ref2] (Stb. 1981, 392) te voeren grondwaterbeheer,
      alsmede een overzicht van de financiële middelen die voor de uitvoering van het beheer nodig zijn;

      d. een uiteenzetting van de algemene aard en omvang van de overige maatregelen en voorzieningen die met het oog op
      de onder b bedoelde ontwikkeling, werking en bescherming nodig zijn;

      e. een aanduiding van de redelijkerwijze te verwachten financiële en economische gevolgen van het te voeren beleid.

      4 Tot de maatregelen en voorzieningen, bedoeld in het derde lid, onderdelen b, c en d, behoren mede, gerangschikt
      naar stroomgebieddistrict:

      a. de aanwijzing van regionale oppervlaktewateren of onderdelen daarvan als kunstmatige of sterk veranderde
      oppervlaktewaterlichamen, overeenkomstig artikel 4, derde lid, van de kaderrichtlijn water, dan wel als natuurlijk
      oppervlaktewaterlichaam, en

      b. de maatregelen, bedoeld in artikel 11 van de kaderrichtlijn water, die in alle in de provincie gelegen delen van
      stroomgebieddistricten van toepassing zijn dan wel het te voeren grondwaterbeheer betreffen.

      5 In het plan geven provinciale staten aan in hoeverre de hoofdlijnen zijn afgestemd op dan wel leiden tot
      aanpassing van het provinciale milieubeleid, het provinciale ruimtelijk beleid of het provinciale verkeers-
      en vervoerbeleid, en in hoeverre en binnen welke termijn zij voornemens zijn het geldende provinciale
      milieubeleidsplan, een of meer geldende streekplannen of het geldende provinciale verkeers- en vervoerplan te
      herzien. Het plan gaat vergezeld van een toelichting.

      6 Het plan wordt ten minste een maal in de zes jaren herzien. Nieuwe of herziene maatregelen treden uiterlijk drie
      jaren na de opneming in het plan in werking.

      7 Het besluit tot vaststelling of herziening van het plan wordt met het plan toegezonden aan Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0004575#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003406
