    text: |-
      1 Op de voorbereiding van het plan is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.

      2 De terinzagelegging geschiedt tevens ter secretarie van de betrokken provincies.

      3 Zienswijzen kunnen naar voren worden gebracht door een ieder.

      4 Met betrekking tot grensvormende of grensoverschrijdende wateren raadplegen Onze Ministers de ten aanzien van die
      wateren bevoegde Duitse of Belgische autoriteiten.

      5 Onze Ministers stemmen de in [artikel 5, derde lid][ref2], bedoelde maatregelen en voorzieningen per
      stroomgebieddistrict af met gedeputeerde staten van de betrokken provincies en de kwantiteitsbeheerders en
      kwaliteitsbeheerders van het stroomgebieddistrict.


