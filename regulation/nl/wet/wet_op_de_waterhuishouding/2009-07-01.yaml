  - number: '8'
    text: |-
      1 Provinciale staten stellen bij verordening nadere regelen met betrekking tot de voorbereiding van het plan. Zij
      stellen daarbij in elk geval regels met betrekking tot:

      a. de wijze waarop het ontwerp van het plan in gemeenschappelijk overleg met de kwaliteitsbeheerders en
      kwantiteitsbeheerders die een beheersplan als bedoeld in [artikel 9][ref1] vaststellen, alsmede de gemeentebesturen
      wordt voorbereid;

      b. de raadpleging van Onze Minister, gedeputeerde staten van de aangrenzende provincies en, indien het plan
      betrekking heeft op grensvormende of grensoverschrijdende wateren, de ten aanzien van die wateren bevoegde Duitse
      of Belgische autoriteiten;

      c. de wijze waarop ingezetenen en belanghebbenden worden betrokken bij de voorbereiding van het plan, op de wijze
      voorzien in de krachtens [artikel 147 van de Provinciewet][ref2] vastgestelde verordening.

      2 Provinciale staten en gedeputeerde staten regelen overeenkomstig [artikel 82 van de Provinciewet][ref3]
      gezamenlijk de instelling, samenstelling, taak en werkwijze van een commissie, die door provinciale staten en
      gedeputeerde staten vooraf worden gehoord over maatregelen en plannen die van betekenis zijn voor het provinciale
      beleid inzake de waterhuishouding. Provinciale staten en gedeputeerde staten benoemen elk een gelijk aantal leden.

      3 Provinciale Staten zenden het besluit waarbij de verordening is vastgesteld aan Onze Minister.


