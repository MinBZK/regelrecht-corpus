  - number: '10'
    text: |-
      1 Onze Ministers kunnen aan provinciale staten omtrent de vaststelling of herziening en de inhoud van een
      provinciaal plan voor de waterhuishouding aanwijzingen geven, indien een samenhangend en doelmatig beleid en beheer
      met betrekking tot de waterhuishouding, nationaal dan wel per stroomgebieddistrict, zulks vorderen.

      2 Bij een aanwijzing kan een termijn worden gesteld binnen welke het plan dient te zijn vastgesteld dan wel, indien
      het een vastgesteld plan betreft, de herziening dient te hebben plaatsgevonden.

      3 Onze Ministers gaan niet over tot het geven van een aanwijzing dan nadat zij gedeputeerde staten in de
      gelegenheid hebben gesteld van hun gevoelen omtrent hun voornemen te doen blijken.

      4 Provinciale staten stellen het plan vast of herzien het plan in overeenstemming met de gegeven aanwijzing.

      5 Van het besluit houdende de aanwijzing wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004575/2009-07-01#Artikel10
