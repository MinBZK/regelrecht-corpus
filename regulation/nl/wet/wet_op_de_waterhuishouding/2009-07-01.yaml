  - number: '9'
    text: |-
      1 Een kwantiteitsbeheerder of kwaliteitsbeheerder, niet zijnde het Rijk, stelt met betrekking tot
      oppervlaktewateren onder zijn beheer een beheersplan vast. Bij die vaststelling wordt rekening gehouden met het
      provinciaal plan voor de waterhuishouding.

      2 Een beheersplan geeft aan hetgeen de beheerder ter vervulling van zijn taak verricht.

      3 Door een kwaliteitsbeheerder worden mede opgenomen, gerangschikt naar stroomgebieddistrict en voor zover niet
      opgenomen in het provinciale plan:

      a. de aanwijzing van regionale oppervlaktewateren of onderdelen daarvan als kunstmatige of sterk veranderde
      oppervlaktewaterlichamen overeenkomstig artikel 4, derde lid, van de kaderrichtlijn water, dan wel als natuurlijk
      oppervlaktewaterlichaam, en

      b. de maatregelen, bedoeld in artikel 11 van de kaderrichtlijn water, met uitzondering van maatregelen die het
      kwantiteitsbeheer betreffen.

      4 Het derde lid, onderdeel b, is van overeenkomstige toepassing ten aanzien van een kwantiteitsbeheerder, voor
      zover de maatregelen van artikel 11 van de kaderrichtlijn water het kwantiteitsbeheer van oppervlaktewateren
      betreffen.

      5 Een niet door provinciale staten vastgesteld beheersplan behoeft de goedkeuring van gedeputeerde staten.

      6 Het plan wordt tenminste een maal in de zes jaren herzien. Nieuwe of herziene maatregelen treden uiterlijk drie
      jaren na de opneming in het plan in werking.

      7 Provinciale staten stellen bij verordening nadere regels vast met betrekking tot de inrichting, voorbereiding en
      vaststelling van het beheersplan. Zij geven daarin aan welke beheerders zijn uitgezonderd van de verplichting tot
      vaststelling van een beheersplan. Tevens geven zij daarin regels met betrekking tot:

      a. de wijze waarop kwantiteitsbeheerders en kwaliteitsbeheerders bij de voorbereiding en vaststelling van een plan
      samenwerken;

      b. het betrekken van de in het beheersgebied woonachtige personen en in het beheersgebied
      belanghebbenden bij de voorbereiding van het plan, op overeenkomstige wijze als voorzien in de krachtens
      [artikel 147 van de Provinciewet][ref1] vastgestelde verordening en

      c. de raadpleging, indien het plan betrekking heeft op grensvormende of grensoverschrijdende wateren, van de ten
      aanzien van die wateren bevoegde Duitse of Belgische autoriteiten.

      8 Provinciale Staten zenden het besluit waarbij de verordening, bedoeld in het vorige lid, is vastgesteld aan Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel147
