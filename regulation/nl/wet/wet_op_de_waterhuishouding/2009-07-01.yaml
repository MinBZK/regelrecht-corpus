  - number: 9b
    text: |-
      1 De gemeenteraad of het college van burgemeester en wethouders dragen zorg voor het in het openbaar gemeentelijke
      gebied treffen van maatregelen teneinde structureel nadelige gevolgen van de grondwaterstand voor de aan de
      grond gegeven bestemming zoveel mogelijk te voorkomen of te beperken, voor zover het treffen van die maatregelen
      doelmatig is en niet tot de zorg van het waterschap of de provincie behoort.

      2 De maatregelen, bedoeld in het eerste lid, omvatten mede de verwerking van het ingezamelde grondwater, waaronder
      in ieder geval worden begrepen de berging, het transport, de nuttige toepassing en het, al dan niet na zuivering,
      op of in de bodem of in het oppervlaktewater brengen van ingezameld grondwater, en het afvoeren naar een inrichting
      als bedoeld in [artikel 15a van de Wet verontreiniging oppervlaktewateren][ref1].


