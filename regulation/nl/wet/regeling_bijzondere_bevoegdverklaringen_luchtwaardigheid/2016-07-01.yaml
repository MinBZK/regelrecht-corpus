        artikel: '4'
  - number: '2.3'
    text: |-
      1 Een bijzondere bevoegdverklaring AML als bedoeld in [artikel 2.1, eerste lid][ref1], wordt afgegeven, nadat de
      aanvrager heeft aangetoond te voldoen aan de navolgende eisen inzake basiskennis en ervaring voor afgifte van de
      bijzondere bevoegdverklaring:

      a. de aanvrager toont aan dat het examen voor de bijzondere bevoegdverklaring niet langer dan drie jaren
      voorafgaand aan de datum van de aanvraag met voldoende resultaat is afgelegd;

      b. de aanvrager toont aan:

      1°. dat in de drie jaren, onmiddellijk voorafgaand aan de datum van aanvraag tenminste twee jaren ervaring is
      verkregen met betrekking tot de werkzaamheden waarvoor de bijzondere bevoegdverklaring is vereist;

      2°. dat de werkzaamheden, bedoeld onder 1°, zijn verricht onder toezicht van een
      houder van een AML of Part-66 AML of een erkende onderhoudsorganisatie als bedoeld in
      [artikel 29a, eerste lid, onder a, van de Regeling erkenningen luchtwaardigheid 2008][ref2].

      2 De werkzaamheden, bedoeld in [artikel 2.1, tweede lid][ref3], worden op de AML vermeld nadat de aanvrager
      heeft aangetoond een training voor het calibreren en compenseren van direct afleesbare magnetische kompassen met
      voldoende resultaat te hebben gevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0038065#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0024682#Artikel29a
      [ref3]: https://wetten.overheid.nl/BWBR0038065#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0038065/2016-07-01#Artikel2.3
