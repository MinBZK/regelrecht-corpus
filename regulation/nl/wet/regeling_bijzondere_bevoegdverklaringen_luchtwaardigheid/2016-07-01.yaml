articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *AR:* beoordeling van de luchtwaardigheid van een luchtvaartuig overeenkomstig Part M, subpart I (Airworthiness
      Review);
        - *ELA 1-luchtvaartuig:* luchtvaartuig als bedoeld in artikel 2, onder k, van verordening (EU) nr. 1321/2014
      (European Light Aircraft);
        - *minister:* Minister van Infrastructuur en Milieu;
        - *Part 66:* deel betreffende onderhoudstechnici en de bevoegdheid tot vrijgave na onderhoud van EASA-
      luchtvaartuigen (bijlage III bij verordening (EU) 1321/2014);
        - *Part-66 AML:* bewijs van bevoegdheid voor onderhoudstechnicus als bedoeld in Part 66 van verordening (EU) nr.
      1321/2014;
        - *verordening (EU) nr. 1321/2014:* verordening (EU) nr. 1321/2014 van de Commissie van 26 november 2014
      betreffende de permanente luchtwaardigheid van luchtvaartuigen en luchtvaartproducten, -onderdelen en
      -uitrustingsstukken, en betreffende de goedkeuring van bij voornoemde taken betrokken organisaties en personen
      (PbEU 2014, L 362).
    url: https://wetten.overheid.nl/BWBR0038065/2016-07-01#Artikel1
  - number: '2.1'
    text: |-
      1 De minister kan op aanvraag de volgende bijzondere bevoegdverklaringen afgeven voor onderhoud aan
      zweefvliegtuigen en motorzweefvliegtuigen:

      a. A voor werkzaamheden aan zweefvliegtuigen en motorzweefvliegtuigen, met uitzondering van de werkzaamheden
      waarvoor een bijzondere bevoegdverklaring B of C vereist is, maar inclusief de werkzaamheden die op de AML zijn
      vermeld;

      b. B voor werkzaamheden aan de voortstuwingsinstallatie;

      c. C voor werkzaamheden aan elektrische en elektronische installaties.

      2 De werkzaamheden, die bij de bijzondere bevoegdverklaring A op de AML kunnen worden vermeld zijn het controleren
      en compenseren van direct afleesbare magnetische kompassen.
    url: https://wetten.overheid.nl/BWBR0038065/2016-07-01#Artikel2.1
  - number: '2.2'
    text: |-
      De houder van een AML met de bijzondere bevoegdverklaringen A en B, bedoeld in
      [artikel 2.1, eerste lid][ref1], is bevoegd tot het mede ondertekenen van de verklaring als bedoeld in
      [artikel 4, derde lid, van de Regeling MLA’s, MLH’s en schermvliegtuigen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038065#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0015237#Artikel4
    url: https://wetten.overheid.nl/BWBR0038065/2016-07-01#Artikel2.2
    references:
