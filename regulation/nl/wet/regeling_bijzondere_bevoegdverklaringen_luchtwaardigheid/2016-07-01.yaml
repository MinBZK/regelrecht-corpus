  - number: '2.4'
    text: |-
      1 De geldigheidsduur van een bijzondere bevoegdverklaring, bedoeld in [artikel 2.1][ref1], bedraagt ten hoogste
      twee jaren en kan telkens met twee jaren worden verlengd.

      2 De geldigheidsduur van een bijzondere bevoegdverklaring wordt op aanvraag van de houder verlengd nadat is
      aangetoond dat de aanvrager in de twee jaren onmiddellijk voorafgaand aan de datum van aanvraag ten minste zes
      maanden ervaring heeft verkregen met het onderhoud waarvoor de bijzondere bevoegdverklaring is vereist.

      3 Een aanvraag voor verlenging wordt niet eerder dan twee maanden voor de vervaldatum van de bijzondere bevoegdheid
      ingediend.

      4 Een bijzondere bevoegdverklaring waarvan de geldigheidsduur langer dan twee maanden is verstreken, wordt op
      aanvraag wederafgegeven nadat de aanvrager heeft aangetoond in de twee jaren onmiddellijk voorafgaand aan de
      datum van aanvraag, ten minste zes maanden ervaring te hebben verkregen met het onderhoud waarvoor de bijzondere
      bevoegdverklaring vereist is en waarbij de ervaring die na de vervaldatum van de bijzondere bevoegdverklaring is
      verkregen, is opgedaan onder toezicht van een houder van een AML of Part-66 AML of een erkende onderhoudsorganisatie
      als bedoeld in [artikel 29a, eerste lid, onder a, van de Regeling erkenningen luchtwaardigheid 2008][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038065#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0024682#Artikel29a
    url: https://wetten.overheid.nl/BWBR0038065/2016-07-01#Artikel2.4
