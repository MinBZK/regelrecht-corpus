  - number: '3.1'
    text: |-
      1 De minister zet op verzoek van de aanvrager de reeds afgegeven nog geldige bijzondere bevoegdverklaringen om naar
      een Part-66 AML voor vliegtuigen en helikopters met een maximum startmassa van 5.700 kg of minder.

      2 Op de in het eerste lid bedoelde Part-66 AML worden de bijzondere bevoegdverklaringen en bijbehorende beperkingen
      zodanig vermeld dat deze overeenkomen met de eerder afgegeven bevoegdheden om namens een volgens Part-145 van
      verordening (EU) 1321/2014, of Part M, subpart F, erkende onderhoudsorganisatie werkzaamheden te mogen vrijgeven.
    url: https://wetten.overheid.nl/BWBR0038065/2016-07-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 De houder van een Part-66 AML met de bijzondere bevoegdverklaring B1.2 of B3, is tevens bevoegd werkzaamheden te
      verrichten waarvoor de bijzondere bevoegdverklaring A of B overeenkomstig [artikel 2.1, eerste lid][ref1], vereist
      is.

      2 De houder van een Part-66 AML met de bijzondere bevoegdverklaring in een categorie of subcategorie voor
      werkzaamheden aan luchtvaartuigen met een maximum startmassa van 5.700 kg of minder, is bevoegd dezelfde
      werkzaamheden als waartoe de desbetreffende Part-66 AML strekt, te verrichten en vrij te geven aan:

      a. luchtvaartuigen van dezelfde categorie of subcategorie met een maximum startmassa van 5.700 kg of minder als
      genoemd in onderdeel a van Bijlage II bij de basisverordening;

      b. amateurbouwluchtvaartuigen;

      c. MLA’s;

      d. MLH’s of

      e. gemotoriseerde schermvliegtuigen.

      3 De minister kan op aanvraag aan de houder van een Part-66 AML met de bijzondere bevoegdverklaring in een
      categorie of subcategorie voor werkzaamheden aan luchtvaartuigen met een maximum startmassa van 5.700 kg of meer,
      een bijzondere bevoegdverklaring voor werkzaamheden aan luchtvaartuigen met een maximum startmassa van 5.700 kg of
      meer als bedoeld in onderdeel a van Bijlage II bij de basisverordening afgeven, indien deze houder met goed gevolg
      een door de minister goedgekeurde training met betrekking tot dit type luchtvaartuig heeft afgesloten.

      4 Nadat het type luchtvaartuig is bijgeschreven in blok XIV ‘NATIONALE BEVOEGDHEDEN’ van de Part-66 AML, kan de
      houder van deze bijzondere type bevoegdverklaring door een nationaal erkend onderhoudsbedrijf worden gemachtigd om
      namens dat bedrijf werkzaamheden uit te voeren en vrij te geven aan het desbetreffende type luchtvaartuig.

      5 De houder van een Part-66 AML met de bijzondere bevoegdverklaring B1.2 of B3 voor werkzaamheden aan
      luchtvaartuigen met een maximum startmassa van 5.700 kg of minder is bevoegd tot het mede ondertekenen van de
      verklaring als bedoeld in [artikel 4, derde lid, van de Regeling MLA’s, MLH’s en schermvliegtuigen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0038065#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0015237#Artikel4
    url: https://wetten.overheid.nl/BWBR0038065/2016-07-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0038065
        artikel: '2.1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0015237
        artikel: '4'
  - number: '3.3'
    text: |-
      De minister kan op aanvraag van een houder van een Part-66 AML toestemming verlenen tot het uitvoeren van een
      AR voor ELA 1-luchtvaartuigen die vallen binnen zijn bevoegdheden zoals vermeld op de Part-66 AML indien aan de
      voorwaarden van Part M wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0038065/2016-07-01#Artikel3.3
  - number: '4.1'
    text: |-
      1 Vanaf het tijdstip van schorsing mag de houder die bevoegdheden, waarop de schorsing van de AML of de Part-66 AML
      betrekking heeft, niet uitoefenen.

      2 Om een schorsing op te heffen toont de houder aan dat de redenen, die tot schorsing hebben geleid, zijn
      vervallen.
    url: https://wetten.overheid.nl/BWBR0038065/2016-07-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 Vanaf het tijdstip van intrekking mag de houder die bevoegdheden waarop de intrekking van de AML of de Part-66
      AML betrekking heeft, niet uitoefenen.

      2 De minister neemt het bewijs van bevoegdheid in en geeft, voor zover het een gedeeltelijke intrekking betreft,
      een nieuw bewijs van bevoegdheid af.
    url: https://wetten.overheid.nl/BWBR0038065/2016-07-01#Artikel4.2
  - number: '6.1'
    text: |-
      De [Regeling bijzondere bevoegdverklaringen AML en Part-66 AML][ref1] wordt ingetrokken.


