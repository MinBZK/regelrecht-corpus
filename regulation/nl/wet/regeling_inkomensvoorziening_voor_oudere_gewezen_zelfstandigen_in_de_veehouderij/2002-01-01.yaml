    text: |-
      1 Op het vaststellen van het inkomen uit of in verband met arbeid in het bedrijfs- of beroepsleven,
      bedoeld in [artikel 9, eerste lid, onderdelen d en e][ref1], zijn de [artikelen 2][ref2] en
      [3 van het Inkomensbesluit IOAZ][ref3] van overeenkomstige toepassing, met dien verstande dat voor de toepassing
      van [artikel 3, vijfde lid, van het Inkomensbesluit IOAZ][ref4] de minister in de plaats treedt van burgemeester
      en wethouders.

      2 Op de waardering van het vermogen, bedoeld in [artikel 9, onderdeel f][ref5], is het Besluit van de Minister van
      Sociale Zaken en Werkgelegenheid van 13 december 2000, houdende nadere regels met betrekking tot de waardering van
      het vermogen van de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref6]
      (Stcrt. 244), van overeenkomstige toepassing, met dien verstande dat voor de toepassing van de artikelen 11 en 12
      van het Besluit de minister in plaats treedt van burgemeester en wethouders.


