  - number: '5'
    text: |-
      De bij of krachtens de [artikelen 3][ref1], [4][ref2], [5, vierde lid][ref3], [8, eerste en tweede lid][ref4],
      [9, tweede lid][ref5], [10, eerste lid][ref6], [14][ref7], [20, tweede tot en met vierde lid en zesde lid][ref8],
      [23][ref9], [24][ref10], [35, eerste tot en met derde lid en vijfde lid][ref11], [36][ref12],
      [37, eerste lid][ref13], [38][ref14], [47][ref15] en [48 van de wet][ref16] gestelde regels zijn
      van overeenkomstige toepassing, met dien verstande dat een vermogensvrijlating geldt die gelijk is
      aan het bedrag, bedoeld in [artikel 8, tweede lid, van de wet][ref17], vermenigvuldigd met de factor
      1,5 en met dien verstande dat voor de toepassing van bij of krachtens de [artikelen 14][ref18],
      [20, tweede tot en met vierde lid en zesde lid][ref19], [36][ref20], [38][ref21], [47][ref22] en
      [48 van de wet][ref23] gestelde regels de minister in de plaats treedt van burgemeester en wethouders.


