    text: |-
      1 In deze regeling wordt verstaan onder:



              a

                *minister:*


                Minister van Landbouw, Natuurbeheer en Visserij;



              b

                *wet:*


                [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref1];



              c

                *veehouderijtak:*


                productie van dierlijke meststoffen afkomstig van hetzij de dieren van de diersoort varkens, hetzij
      de dieren van de diersoorten kippen en kalkoenen, hetzij de dieren van de diersoort rundvee behorende tot de
      diercategorieën die in [bijlage A bij de Meststoffenwet][ref2] worden aangeduid met de nummers 110, 111, 112, 120,
      121, 122, 123, 124 en 125 afzonderlijk;



              d

                *Nederlandse grootte-eenheden:*


                Nederlandse grootte-eenheden als bedoeld in [artikel 4 van de Regeling landbouwtelling 2000][ref3];



              e

                *zelfstandige:*


                persoon die voor de voorziening in het bestaan is aangewezen op arbeid in het eigen bedrijf;



              f

                *bijdrage:*


                bijdrage als bedoeld in [artikel 6][ref4];



              g

                *Laser:*


                Agentschap Landelijke service bij regelingen van het Ministerie van Landbouw, Natuurbeheer en Visserij;



              h

                *MKZ-geruimde:*


                zelfstandige op wiens bedrijf op of na 21 maart 2001 de evenhoevigen zijn gedood op grond van
      [artikel 22, eerste lid, onderdeel f, van de Gezondheids- en welzijnswet voor dieren][ref5], vanwege besmetting
      danwel een verdenking van besmetting met mond- en klauwzeer;



              i

                *MKZ-getroffene:*


                zelfstandige die ter genoegdoening van Laser aannemelijk maakt dat hij een inkomensderving van meer dan €
      4.537,80 heeft geleden als gevolg van vervoersbeperkingen danwel import- en exportrestricties die van kracht waren
      in de periode van 13 maart tot en met 25 juni 2001 op grond van de [artikelen 17][ref6], [18][ref7], [22][ref8],
      [25][ref9], [30][ref10], en [80 van de Gezondheids- en welzijnswet voor dieren][ref11] wegens de uitbraak van mond-
      en klauwzeer.




      2 Voor de toepassing van het eerste lid, onderdeel e, is een persoon aangewezen op arbeid in het eigen bedrijf
      indien is voldaan aan het urencriterium, bedoeld in [artikel 3.6 van de Wet inkomstenbelasting 2001][ref12].


