  - number: '6'
    text: De minister kan een bijdrage verstrekken aan een zelfstandige voor het beëindigen van het bedrijf.
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel6
  - number: '7'
    text: |-
      1 De bijdrage bedraagt het verschil tussen de van toepassing zijnde grondslag en het inkomen, als bedoeld in
      [artikel 8, eerste en tweede lid, van de wet][ref1].

      2 De grondslag, bedoeld in het eerste lid, is voor:

      a. de gewezen zelfstandige en de echtgenoot tezamen netto gelijk aan € 1.067,74;

      b. de alleenstaande gewezen zelfstandige met een of meer kinderen netto gelijk aan € 960,90;

      c. de alleenstaande gewezen zelfstandige zonder kinderen netto gelijk aan € 747,36.

      3 Indien de in [artikel 5, vijfde lid, van de wet][ref2] voor de onderscheiden situaties geldende grondslagen
      wijzigen, treden deze grondslagen in de plaats van de in het tweede lid onderscheiden grondslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0004163#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel5
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004163
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '5'
  - number: '8'
    text: |-
      Op grond van deze regeling kan een bijdrage worden verstrekt tot en met 31 december 2003, dan wel, indien dit
      eerder is, tot de eerste dag van de maand waarin de gewezen zelfstandige de leeftijd van 65 jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel8
  - number: '9'
    text: |-
      1 De zelfstandige voldoet aan elk van de volgende voorwaarden:

      a. de zelfstandige is op het tijdstip van de indiening van de aanvraag nog geen 65 jaar en is op 1 januari 2004 ten
      minste 55 jaar;

      b. de zelfstandige oefent één of meer bedrijven uit met tezamen, blijkens de opgave gedaan overeenkomstig
      [artikel 3 van de Regeling landbouwtelling 2000][ref1], een productieomvang van ten minste 15 Nederlandse grootte-
      eenheden van de in [bijlage A][ref2] bij deze regeling aangegeven diersoorten, onderscheidenlijk diercategorieën;

      c. de zelfstandige heeft gedurende drie jaar voorafgaand aan de aanvraag onafgebroken rechtmatig in Nederland of in
      een andere lidstaat van de Europese Unie een bedrijf uitgeoefend, en heeft gedurende zeven jaar voorafgaand aan de
      bedoelde drie jaar rechtmatig een bedrijf of een beroep in Nederland of in een andere lidstaat van de Europese Unie
      uitgeoefend of arbeid in dienstverband verricht;

      d. de zelfstandige heeft gedurende de laatste drie boekjaren voorafgaand aan het jaar waarin de aanvraag wordt
      ingediend gemiddeld per jaar een inkomen uit of in verband met arbeid in het bedrijfs- of beroepsleven genoten dat
      minder is dan € 30.017,56;

      e. de zelfstandige zou bij voortzetting van het bedrijf een inkomen uit of in verband met arbeid in het bedrijfs-
      of beroepsleven hebben dat naar het oordeel van de minister duurzaam minder is dan € 20.011,71;

      f. de zelfstandige komt niet in aanmerking voor een uitkering op grond van de [wet][ref3] of komt in aanmerking
      voor een uitkering op grond van de [wet][ref4] maar heeft een vermogen dat groter is dan € 102.554,33;

      g. de zelfstandige heeft uiterlijk tegelijk met de aanvraag tot verlening van een bijdrage op grond
      van deze regeling bij de Directeur Laser een aanvraag ingediend tot subsidieverlening op grond van
      [artikel 5 van de Regeling beëindiging veehouderijtakken][ref5] voor alle veehouderijtakken op elk van zijn
      bedrijven.

      2 Geen bijdrage wordt verleend indien:

      a. de zelfstandige een subsidie op grond van [artikel 5 van de Regeling beëindiging veehouderijtakken][ref6] is
      geweigerd;

      b. de zelfstandige zelf of de echtgenoot de arbeid in bedrijf of beroep hervat of aanvangt;

      c. de zelfstandige buiten Nederland woont of aldaar anders dan tijdelijk verblijf houdt;

      d. de zelfstandige niet rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref7].

      e. de zelfstandige rechtens zijn vrijheid is ontnomen.

      3 Indien zich ten aanzien van de echtgenoot een omstandigheid voordoet als bedoeld in het tweede lid, onderdeel c,
      d of e, wordt de zelfstandige voor de toepassing van [artikel 7][ref8] aangemerkt als alleenstaande.


      [ref1]: https://wetten.overheid.nl/BWBR0011274#Artikel3
