  - number: '2'
    text: |-
      In deze regeling wordt met de zelfstandige gelijkgesteld de meewerkende echtgenoot, die gedurende het kalenderjaar
      ten minste 525 uren arbeid verricht in het voor eigen rekening feitelijk uitgeoefende bedrijf en voldoet aan de
      voorwaarde genoemd in [artikel 9, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011391#Artikel9
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011391
        artikel: '9'
        paragraaf: '3'
  - number: '3'
    text: |-
      In deze regeling wordt mede als zelfstandige aangemerkt de persoon die voldoet aan [artikel 1, tweede lid][ref1],
      en aan de voorwaarden genoemd in [artikel 9][ref2] en die:

      a. met anderen een bedrijf uitoefent in de vorm van een maatschap, een vennootschap onder firma of een
      commanditaire vennootschap, indien:

      1º. de volledige zeggenschap in het bedrijf alleen of met die anderen wordt uitgeoefend en

      2º. de financiële risico’s van het bedrijf alleen of met die anderen worden gedragen, of

      b. anders dan als werknemer als bedoeld in de [Werkloosheidswet][ref3], een bedrijf uitoefent in de vorm van een
      besloten vennootschap of naamloze vennootschap.


      [ref1]: https://wetten.overheid.nl/BWBR0011391#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011391#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004045
