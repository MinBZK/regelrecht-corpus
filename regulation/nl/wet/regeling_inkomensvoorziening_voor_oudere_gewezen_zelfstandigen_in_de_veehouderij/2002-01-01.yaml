  - number: '15'
    text: |-
      Indien de beschikking tot vaststelling van de bijdrage is ingetrokken of ten nadele van de gewezen zelfstandige is
      gewijzigd, betaalt de gewezen zelfstandige de door hem ontvangen bedragen terug op eerste vordering van de minister
      vermeerderd met de wettelijke rente over de periode van de datum van intrekking tot het tijdstip van algehele
      voldoening.
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel15
  - number: '16'
    text: |-
      Met het toezicht op de naleving van deze regeling zijn belast medewerkers van Laser en van de Algemene
      Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel16
  - number: '18'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel18
  - number: '19'
    text: |-
      Deze regeling wordt aangehaald als: Regeling inkomensvoorziening voor oudere gewezen zelfstandigen in de
      veehouderij.
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel19
