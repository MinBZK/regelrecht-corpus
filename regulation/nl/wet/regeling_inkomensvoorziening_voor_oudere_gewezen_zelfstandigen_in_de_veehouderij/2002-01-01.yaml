  - number: 9a
    text: |-
      1 In afwijking van [artikel 9, eerste lid, onderdeel b][ref1], geldt ten aanzien van de MKZ-geruimde als
      voorwaarde dat hij één of meer bedrijven uitoefent met tezamen, blijkens de opgave gedaan overeenkomstig
      [artikel 3 van de Regeling landbouwtelling 2000][ref2], een productieomvang van ten minste 15 Nederlandse grootte-
      eenheden van de in [bijlage B][ref3] bij deze regeling aangegeven diersoorten, onderscheidenlijk diercategorieën.

      2 In afwijking van [artikel 9, eerste lid, onderdeel b][ref4], geldt ten aanzien van de MKZ-getroffene als
      voorwaarde dat hij één of meer bedrijven uitoefent met tezamen, blijkens de opgave gedaan overeenkomstig
      [artikel 3 van de Regeling landbouwtelling 2000][ref5], een productieomvang van ten minste 15 Nederlandse grootte-
      eenheden van de in [bijlage C][ref6] bij deze regeling aangegeven diersoorten, onderscheidenlijk diercategorieën.

      3 [Artikel 9, eerste lid, onderdeel g, en tweede lid, onderdeel a][ref7], is niet van toepassing op de MKZ-geruimde
      of de MKZ-getroffene.


