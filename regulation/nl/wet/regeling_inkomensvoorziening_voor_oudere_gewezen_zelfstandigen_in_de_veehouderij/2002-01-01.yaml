  - number: '10'
    text: |-
      1 De aanvraag voor een bijdrage wordt ingediend bij de Directeur Laser, te Diemen.

      2 De aanvraag wordt ingediend met gebruikmaking van een daartoe door de Directeur Laser ter beschikking gesteld
      formulier.

      3 De aanvraag kan worden ingediend door de zelfstandige met ingang van 1 augustus 2001 om 9.00 uur tot uiterlijk 20
      december 2001 om 17.00 uur.

      4 De aanvragen worden in behandeling genomen in volgorde van ontvangst van de volledig ingediende aanvragen. Bij
      gelijktijdige ontvangst wordt de volgorde van behandeling door loting bepaald.
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel10
  - number: '11'
    text: Op grond van deze regeling wordt aan ten hoogste 300 zelfstandigen een bijdrage verleend.
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel11
  - number: '12'
    text: |-
      De zelfstandige of gewezen zelfstandige is verplicht aan de Directeur Laser:

      a. onverwijld uit eigener beweging mededeling te doen van al hetgeen van belang is voor de verstrekking of
      voortzetting van de bijdrage, zo mogelijk onder overlegging van bewijsstukken;

      b. alle medewerking te verlenen die nodig is voor de uitvoering van deze regeling;

      c. toestemming te verlenen voor inzage en gebruik van de voor de verstrekking van de bijdrage noodzakelijke
      belastinggegevens.
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel12
  - number: '13'
    text: |-
      1 De bijdrage wordt vastgesteld nadat de zelfstandige het bedrijf heeft beëindigd. De daartoe dienende
      bewijsstukken worden bij de Directeur Laser ingediend.

      2 De verlening van de bijdrage wordt ingetrokken indien de zelfstandige niet binnen een periode van 18 maanden na
      verlening van de bijdrage het bedrijf heeft beëindigd.
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel13
  - number: '14'
    text: |-
      1 Een beschikking tot verlening of vaststelling van de bijdrage wordt ingetrokken of ten nadele van de ontvanger
      gewijzigd, indien:

      a. de beschikking tot subsidieverlening of -vaststelling op grond van
      [artikel 5 van de Regeling beëindiging veehouderijtakken][ref1] is ingetrokken,

      b. één van de in [artikel 9, tweede lid, onderdelen b tot en met e][ref2], bedoelde omstandigheden zich voordoet.

      2 Het eerste lid, onderdeel a, is niet van toepassing op de MKZ-geruimde of MKZ-getroffene.

      3 Indien de beschikking tot verlening of vaststelling van de bijdrage vanwege één van de in
      [artikel 9, tweede lid, onderdelen b tot en met e][ref3], bedoelde omstandigheden is ingetrokken en deze
      omstandigheid zich niet langer voordoet, herleeft het recht op de bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0011234#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011391#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0011391#Artikel9
    url: https://wetten.overheid.nl/BWBR0011391/2002-01-01#Artikel14
