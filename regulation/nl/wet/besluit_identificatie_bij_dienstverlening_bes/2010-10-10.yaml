    text: |-
      1 Als dienst, bedoeld in [artikel 1, onderdeel b, onder 9°, van de Wet identificatie bij dienstverlening BES][ref1]
      wordt aangewezen:

      a. het aangaan van een verplichting tot betaling ten behoeve van de houder van een creditcard aan degene die het
      vertoon van die creditcard bij wijze van betaling heeft aanvaard, het uitgeven van creditcards of het beheer van
      creditcards waaronder in elk geval wordt verstaan de uitvoering van betalingstransacties via creditcards;

      b. het in het kader van een geldelijke overmaking in ontvangst nemen van gelden of geldswaarden, ten einde deze
      gelden of geldswaarden al dan niet in dezelfde vorm elders betaalbaar te stellen of te doen stellen, dan wel het in
      het kader van een geldelijke overmaking betalen of betaalbaar stellen van gelden of geldswaarden, nadat deze gelden
      of geldswaarden elders al dan niet in dezelfde vorm ter beschikking zijn gesteld;

      c. het gelegenheid bieden mee te dingen naar prijzen en premies in het kader van de exploitatie van hazardspelen
      waaronder speelcasino’s, voorzover daarbij een transactie wordt verricht boven USD 3.000;

      d. het verlenen van fiduciaire diensten waaronder worden verstaan: diensten als bedoeld in [artikel 3][ref2].

      e. het als tussenpersoon optreden ter zake van overeenkomsten inzake onroerende zaken en rechten waaraan onroerende
      zaken zijn onderworpen;

      f. het handelen in voertuigen, edelstenen, edele metalen, sieraden, juwelen dan wel andere bij ministeriële
      regeling aan te wijzen zaken van grote waarde dan wel het bemiddelen daarbij boven een door Onze Minister van
      Financiën te bepalen bedrag, dat voor de onderscheiden soorten zaken verschillend kan zijn;

      g. het geven van advies, het verlenen van bijstand of het optreden in naam en voor rekening van een cliënt door
      de natuurlijke persoon, rechtspersoon of vennootschap, die als advocaat, notaris of kandidaat-notaris, accountant,
      belastingadviseur, dan wel als deskundige op juridisch, fiscaal of administratief gebied, dan wel in de uitvoering
      van een gelijksoortig juridisch beroep of bedrijf zelfstandig onafhankelijk beroeps- of bedrijfsmatig werkzaamheden
      verricht, bij:

      1°. het aan- of verkopen van onroerende zaken;

      2°. het beheren van geld, effecten, munten, muntbiljetten, edele metalen, edelstenen of andere waarden;

      3°. het oprichten of beheren van vennootschappen, rechtspersonen of soortgelijke lichamen;

      4°. het aan- of verkopen dan wel overnemen van ondernemingen.

      h. het verrichten van kredietuitzettingen;

      i. het verlenen van krediet in de vorm van financiële lease;

      j. het verlenen van garanties en het stellen van borgtochten;

      k. het handelen in

      1°. geldmarktinstrumenten waaronder cheques, wissels, depositocertificaten;

      2°. valuta's;

      3°. financiële futures en opties;

      4°. swaps en soortgelijke financieringsinstrumenten;

      5°. effecten.

      l. het deelnemen aan effectenemissies en het verrichten van diensten in verband daarmee;

      m. het optreden als beleggingsinstelling in de zin van de
      [Wet toezicht beleggingsinstellingen en administrateurs BES][ref3]

      n. het verlenen van een beleggingsdienst waaronder wordt verstaan:

      1°. in de uitoefening van een beroep of bedrijf ontvangen en doorgeven van orders van cliënten met betrekking tot
      financiële instrumenten;

      2°. in de uitoefening van beroep of bedrijf voor rekening van die cliënten uitvoeren van orders met betrekking tot
      financiële instrumenten;

      3°. beheren van een individueel vermogen;

      o. het wisselen van lokale of vreemde valuta;

      2 Als dienst, bedoeld in het eerste lid, onderdeel b, wordt niet aangemerkt:

      a. het in het kader van een premiebetaling uit hoofde van een verzekeringsovereenkomst in ontvangst
      nemen van gelden of geldswaarden, ten einde deze gelden of geldswaarden al dan niet in dezelfde
      vorm elders betaalbaar te stellen of te doen stellen aan een instelling waaraan het op grond van de
      [Wet toezicht verzekeringsbedrijf BES][ref4] is toegestaan het verzekeringsbedrijf in Bonaire, Sint Eustatius en
      Saba uit te oefenen;

      b. het in het kader van een uitkering uit hoofde van een verzekeringsovereenkomst betalen of betaalbaar stellen van
      gelden of geldswaarden, nadat deze gelden of geldswaarden elders al dan niet in dezelfde vorm ter beschikking zijn
      gesteld door een instelling waaraan het op grond van de [Wet toezicht verzekeringsbedrijf BES][ref5] is toegestaan
      het verzekeringsbedrijf in Bonaire, Sint Eustatius en Saba uit te oefenen.

      3 Als dienst, bedoeld in het eerste lid, onderdeel g, wordt niet aangemerkt werkzaamheden die verband houden met
      de bepaling van de rechtspositie van een cliënt, diens vertegenwoordiging in rechte, het geven van advies voor,
      tijdens en na een rechtsgeding, of het geven van advies over het instellen of vermijden van een rechtsgeding, voor
      zover verricht door een advocaat, notaris of kandidaat-notaris dan wel een accountant, optredende als onafhankelijk
      juridisch adviseur.

      4 Voor de toepassing van dit artikel wordt onder creditcard niet verstaan een creditcard die alleen gebruikt kan
      worden bij de onderneming of instelling die deze creditcard uitgeeft of bij een onderneming of instelling die
      behoort tot dezelfde economische eenheid waarin rechtspersonen en vennootschappen organisatorisch zijn verbonden
      als de uitgevende onderneming of instelling.


