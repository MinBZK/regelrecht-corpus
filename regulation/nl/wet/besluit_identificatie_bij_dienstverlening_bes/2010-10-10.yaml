  - number: '2'
    text: |-
      Als gegevens, bedoeld in [artikel 6, onderdeel d, onder 8, van de Wet identificatie bij dienstverlening BES][ref1],
      worden aangewezen:

      a. in het geval van een dienst als bedoeld in [artikel 1, eerste lid, onder a en b][ref2]: het creditcard- of
      debitcardnummer met vervaldatum, dan wel het chequenummer tezamen met het corresponderende bankrekeningnummer;

      b. in het geval van een dienst als bedoeld in [artikel 1, eerste lid, onderdeel f][ref3]: een omschrijving van de
      desbetreffende zaken van grote waarde en de hoogte van het contante gedeelte van de betaling;

      c. in het geval van een dienst als bedoeld in [artikel 1, eerste lid, onderdeel g][ref4]: de identiteit van de
      betrokken vennootschappen, rechtspersonen of soortgelijke lichamen dan wel, voorzover toepasselijk, de omvang,
      aard, herkomst, bestemming en andere unieke kenmerken van de betrokken waarden of zaken.


