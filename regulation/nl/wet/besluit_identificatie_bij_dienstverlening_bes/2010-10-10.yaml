  - number: '4'
    text: |-
      1 Het boetebedrag voor het niet of niet tijdig voldoen aan de verplichtingen bedoeld
      in, dan wel voortvloeiende uit [artikel 2][ref1], [5][ref2], [5a][ref3], [6][ref4] of
      [8, eerste en tweede lid, van de Wet identificatie bij dienstverlening BES][ref5] bedraagt USD 250.000.

      2 Het boetebedrag voor overtreding van [artikel 1a][ref6], [3][ref7], [7][ref8] of
      [8, derde lid, van de Wet identificatie bij dienstverlening BES][ref9] bedraagt USD 50.000.

      3 De toezichthouder kan het boetebedrag matigen.


