  - number: '3'
    text: |-
      De bij of krachtens de [artikelen 12 tot en met 14 van de Wet toezicht trustwezen BES][ref1] gestelde regels
      zijn van overeenkomstige toepassing op personen die beroeps- of bedrijfsmatig in opdracht van een rechtspersoon,
      vennootschap of natuurlijke persoon die niet behoort tot dezelfde groep als waarvan de dienstverlener deel uitmaakt
      een of meer van de volgende diensten verlenen:

      a. optreden als directeur, vertegenwoordiger of andere functionaris of natuurlijke of rechtspersonen daarvoor
      beschikbaar stellen;

      b. rechtspersonen oprichten of doen oprichten of liquideren of doen liquideren;

      c. trustee zijn in de zin van het Verdrag inzake het recht dat toepasselijk is op trusts en inzake de erkenning
      van trusts;

      d. domicilie of kantoorfaciliteiten verlenen aan een rechtspersoon of vennootschap in combinatie met
      administratieve of adviserende werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel12
