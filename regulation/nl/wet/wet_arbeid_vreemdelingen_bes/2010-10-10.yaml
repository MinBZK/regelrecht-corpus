---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_arbeid_vreemdelingen_bes
regulatory_layer: WET
publication_date: '2010-10-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028437
url: https://wetten.overheid.nl/BWBR0028437/2010-10-10
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel1
  - number: 1.a
    text: '*Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel1
  - number: 1.b
    text: '*werkgever:*'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel1
  - number: 1.b.1
    text: degene die in de uitoefening van een beroep of bedrijf een ander arbeid laat verrichten; of
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel1
  - number: 1.b.2
    text: de natuurlijke persoon die een ander huishoudelijke of persoonlijke diensten laat verrichten;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel1
  - number: 1.c
    text: |-
      *tewerkstellingsvergunning:* de vergunning welke de werkgever moet aanvragen bij Onze Minister voor het laten
      verrichten van arbeid door een vreemdeling;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel1
  - number: 1.d
    text: |-
      *verblijfsvergunning:* de verblijfsvergunning voor bepaalde tijd of voor onbepaalde tijd, bedoeld in
      [artikel 6, eerste lid, van de Wet toelating en uitzetting BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel6
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '6'
  - number: 1.e
    text: |-
      *vreemdeling:* een persoon die op grond van de bepalingen van de [Wet toelating en uitzetting BES][ref1] hetzij
      van rechtswege toelating heeft tot verblijf in de openbare lichamen Bonaire, Sint Eustatius en Saba, hetzij voor
      toelating een verblijfsvergunning behoeft;


      [ref1]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028571
  - number: 1.f
    text: '*lokale arbeidsmarkt:* de arbeidsmarkten van de openbare lichamen Bonaire, Sint Eustatius en Saba samen.'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel1
  - number: '2.1'
    text: Het is een werkgever verboden een vreemdeling arbeid te laten verrichten zonder tewerkstellingsvergunning.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      Het verbod, bedoeld in het eerste lid, is niet van toepassing met betrekking tot een vreemdeling ten aanzien van
      wie tevens een ander als werkgever optreedt, indien die ander beschikt over een voor de desbetreffende arbeid
      geldige tewerkstellingsvergunning.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel2
  - number: '3'
    text: |-
      Het verbod, bedoeld in [artikel 2, eerste lid][ref1], is niet van toepassing met betrekking tot een vreemdeling:


      [ref1]: https://wetten.overheid.nl/BWBR0028437#Artikel2
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028437
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: 3.a
    text: |-
      die ingevolge [artikel 3 van de Wet toelating en uitzetting BES][ref1] van rechtswege toelating tot verblijf in de
      openbare lichamen Bonaire, Sint Eustatius en Saba heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel3
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '3'
  - number: 3.b
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel3
  - number: 3.c
    text: |-
      ten aanzien van wie, ingevolge bepalingen vastgesteld bij overeenkomsten met andere mogendheden dan wel bij een
      voor de openbare lichamen Bonaire, Sint Eustatius en Saba verbindend besluit van een volkenrechtelijke organisatie,
      een tewerkstellingsvergunning niet mag worden verlangd;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel3
  - number: 3.d
    text: |-
      die beschikt over een door of namens Onze Minister van Justitie afgegeven verblijfsvergunning voor het verrichten
      van arbeid als zelfstandige in het desbetreffende eilandgebied, voor zover deze vreemdeling arbeid verricht als
      zelfstandige;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel3
  - number: 3.e
    text: |-
      die behoort tot een bij algemene maatregel van bestuur aangewezen categorie, die per openbaar lichaam kan
      verschillen, dan wel bij een algemene maatregel van bestuur aangewezen categorie van werkzaamheden verricht, welke
      categorie per openbaar lichaam kan verschillen.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel3
  - number: '4'
    text: Onze Minister is bevoegd tot het verlenen, verlengen en intrekken van tewerkstellingsvergunningen.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel4
  - number: '5.1'
    text: Een tewerkstellingsvergunning wordt aangevraagd door de werkgever.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: '5.2'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: '5.3'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald welke gegevens bij de aanvraag van een tewerkstellingsvergunning
      moeten worden verstrekt en welke bewijsstukken daarbij moeten worden overgelegd. Tot deze gegevens dan wel
      bewijsstukken behoort in ieder geval de overeenkomst tot het verrichten van arbeid die met betrokken vreemdeling
      zal worden aangegaan.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: '5.4'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: '5.5'
    text: 'Een aanvraag wordt niet in behandeling genomen:'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: 5.5.a
    text: |-
      zolang de krachtens het derde lid vereiste gegevens of bewijsstukken niet of niet volledig zijn verstrekt
      onderscheidenlijk overgelegd;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: 5.5.b
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: 5.5.c
    text: |-
      indien het een arbeidsplaats betreft waarvan de beschikbaarheid niet ten minste vijf weken vóór het indienen
      van de aanvraag is gemeld bij het bestuurscollege van het bestuursorgaan van het openbaar lichaam waar de arbeid
      uitsluitend of in hoofdzaak wordt of zal worden verricht.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: '5.6'
    text: |-
      Indien het vijfde lid van toepassing is, wordt het aanvraagformulier en de daarbij overgelegde bescheiden aan de
      aanvrager teruggezonden onder schriftelijke mededeling van de reden waarom de aanvraag niet in behandeling wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: '5.7'
    text: |-
      In afwijking van het vijfde lid, aanhef en onderdeel c, wordt een aanvraag onmiddellijk in behandeling genomen,
      indien Onze Minister van oordeel is:
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: 5.7.a
    text: |-
      dat sprake is van buitengewone omstandigheden die een spoedige vervulling van de arbeidsplaats noodzakelijk maken
      en deze omstandigheden niet door de werkgever waren te voorzien of door hem waren te beïnvloeden; of
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: 5.7.b
    text: |-
      dat het vanwege het specifieke karakter van de werkzaamheden op voorhand duidelijk is dat voor de desbetreffende
      arbeidsplaats geen arbeidskrachten beschikbaar zijn op de lokale arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: '5.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld die per openbaar lichaam kunnen verschillen,
      waarbij kan worden afgeweken van het vijfde lid, aanhef en onderdeel c:
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: 5.8.a
    text: ten behoeve van de bevordering van internationale handelscontacten;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: 5.8.b
    text: in het kader van scholing en opleiding;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: 5.8.c
    text: vanwege de aard van de te verrichten werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: 5.8.d
    text: ten behoeve van vreemdelingen die beschikken over een voor het verrichten van arbeid geldige verblijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: 5.8.e
    text: |-
      ten behoeve van vreemdelingen die een aanvraag hebben ingediend tot het verlenen van een verblijfsvergunning voor
      bepaalde tijd onder een beperking verband houdend met internationale bescherming.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: '5.9'
    text: |-
      De tewerkstellingsvergunning vermeldt de naam en de plaats van vestiging van de werkgever, de persoonsgegevens van
      de vreemdeling, de geldigheidsduur van de tewerkstellingsvergunning, alsmede een omschrijving van de aard en de
      plaats van de door de vreemdeling te verrichten arbeid.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: '5.10'
    text: Op een aanvraag wordt uiterlijk binnen vijf weken na ontvangst beslist.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel5
  - number: '6.1'
    text: Een tewerkstellingsvergunning kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel6
  - number: '6.2'
    text: 'Aan een tewerkstellingsvergunning kunnen voorschriften worden verbonden. De voorschriften strekken ertoe dat:'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel6
  - number: 6.2.a
    text: |-
      de werkgever inspanningen pleegt arbeidsplaatsen te doen vervullen door arbeidskrachten die op de lokale
      arbeidsmarkt beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel6
  - number: 6.2.b
    text: |-
      door de werkgever in de arbeidsvoorwaarden, arbeidsverhoudingen of arbeidsomstandigheden voor de vervulling van
      arbeidsplaatsen door arbeidskrachten die op de lokale arbeidsmarkt beschikbaar zijn, gelegen beletselen worden
      opgeheven.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel6
  - number: '6.3'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel6
  - number: '7.1'
    text: Een tewerkstellingsvergunning wordt voor ten hoogste drie jaar verleend.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      Een tewerkstellingsvergunning kan worden verlengd, waarbij de gehele duur van de tewerkstellingsvergunning en de
      verlenging de termijn van drie jaar niet overschrijdt.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel7
  - number: '7.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat voor de daarbij aangewezen categorieën
      van vreemdelingen of categorieën van werkzaamheden een tewerkstellingsvergunning die voor minder dan drie jaar is
      verleend, niet wordt verlengd.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel7
  - number: '8.1'
    text: 'Een tewerkstellingsvergunning wordt geweigerd:'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: 8.1.a
    text: |-
      indien naar het oordeel van het bestuurscollege van het openbaar lichaam waar de arbeid uitsluitend of in hoofdzaak
      wordt of zal worden verricht, voor het doen verrichten van de arbeid waarop de tewerkstellingsvergunning betrekking
      heeft arbeidskrachten op de lokale arbeidsmarkt beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: 8.1.b
    text: |-
      indien in de overeenkomst tot het verrichten van arbeid waarop de tewerkstellingsvergunning betrekking heeft een
      beding is opgenomen dat in strijd is met een wet of een algemene maatregel van bestuur;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: 8.1.c
    text: |-
      indien het een arbeidsplaats betreft die behoort tot een bij algemene maatregel van bestuur aangewezen categorie
      van arbeid, waarvan het niet in het belang van de openbare lichamen Bonaire, Sint Eustatius en Saba is deze door
      vreemdelingen te laten verrichten;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: 8.1.d
    text: |-
      indien deze een vreemdeling betreft die gehandeld heeft in strijd met de bij of krachtens de
      [Wet toelating en uitzetting BES][ref1] gegeven regels;


      [ref1]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028571
  - number: 8.1.e
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: 8.1.f
    text: op andere bij algemene maatregel van bestuur vast te stellen gronden, die per openbaar lichaam kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid, aanhef en onderdeel a, wordt een tewerkstellingsvergunning toegekend, indien
      Onze Minister van oordeel is, dat sprake is van buitengewone omstandigheden die een spoedige vervulling van de
      arbeidsplaats noodzakelijk maken en deze omstandigheden niet door de werkgever waren te voorzien of door hem waren
      te beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: '8.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld die per openbaar lichaam kunnen verschillen,
      waarbij kan worden afgeweken van het eerste lid, aanhef en onderdeel a:
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: 8.3.a
    text: ten behoeve van de bevordering van internationale handelscontacten;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: 8.3.b
    text: in het kader van scholing en opleiding;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: 8.3.c
    text: vanwege de aard van de te verrichten werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: 8.3.d
    text: ten behoeve van vreemdelingen die beschikken over een voor het verrichten van arbeid geldige verblijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: 8.3.e
    text: |-
      ten behoeve van vreemdelingen die een aanvraag hebben ingediend tot het verlenen van een verblijfsvergunning voor
      bepaalde tijd onder een beperking verband houdend met internationale bescherming.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel8
  - number: '9'
    text: 'Een tewerkstellingsvergunning kan worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel9
  - number: 9.a
    text: |-
      indien de werkgever niet kan aantonen voldoende inspanningen te hebben verricht de arbeidsplaats te doen vervullen
      door arbeidskrachten die op de lokale arbeidsmarkt beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel9
  - number: 9.b
    text: |-
      indien er in de arbeidsvoorwaarden, arbeidsverhoudingen of arbeidsomstandigheden beletselen zijn gelegen voor
      vervulling van de arbeidsplaats door arbeidskrachten die op de lokale arbeidsmarkt beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel9
  - number: 9.c
    text: |-
      indien voorzienbaar is dat binnen een redelijke termijn voor de desbetreffende arbeidsplaats lokale arbeidkrachten
      beschikbaar zullen komen;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel9
  - number: 9.d
    text: |-
      wegens het niet in acht nemen van een beperking waaronder een eerdere vergunning is verleend of wegens het niet
      naleven van een daaraan verbonden voorschrift;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel9
  - number: 9.e
    text: op andere bij algemene maatregel van bestuur vast te stellen gronden die per openbaar lichaam kunnen verschillen.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel9
  - number: '10'
    text: 'Een tewerkstellingsvergunning wordt ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel10
  - number: 10.a
    text: |-
      indien de voor verkrijging verstrekte gegevens zodanig onjuist of onvolledig zijn geweest, dat op de aanvraag een
      andere beslissing zou zijn genomen als bij de beoordeling daarvan de juiste omstandigheden volledig bekend waren
      geweest;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel10
  - number: 10.b
    text: |-
      indien blijkt dat aan de vreemdeling verder verblijf in de openbare lichamen Bonaire, Sint Eustatius en Saba is
      geweigerd;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel10
  - number: 10.c
    text: indien de vreemdeling wordt ontslagen;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel10
  - number: 10.d
    text: indien de werkgever in staat van faillissement wordt verklaard.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel10
  - number: '11'
    text: |-
      Onverminderd het bepaalde in [artikel 10][ref1] kan intrekking van een tewerkstellingsvergunning slechts geschieden
      wegens het niet in acht nemen van een beperking waaronder de vergunning is verleend, of wegens het niet naleven van
      een daaraan verbonden voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0028437#Artikel10
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028437
        artikel: '10'
        hoofdstuk: II
        paragraaf: '6'
  - number: '12'
    text: |-
      Degene die rechtstreeks in zijn belang is getroffen door een beschikking ter zake van een
      tewerkstellingsvergunning kan hiertegen binnen vier weken na de dag waarop deze is gegeven bezwaar indienen
      bij Onze Minister. Onder beschikking wordt mede begrepen het niet beslissen door Onze Minister binnen de in
      [artikel vijf, tiende lid][ref1], genoemde termijn. Het bezwaar heeft schorsende werking.


      [ref1]: https://wetten.overheid.nl/BWBR0028437#Artikel5
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028437
        artikel: '5'
        hoofdstuk: II
        paragraaf: '2'
  - number: 12a
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel12a
  - number: '13.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de door Onze Minister
      aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel13
  - number: '13.2'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel13
  - number: '14.1'
    text: Bij de uitoefening van hun taak dragen de toezichthoudende ambtenaren een legitimatiebewijs bij zich.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel14
  - number: '14.2'
    text: Desgevraagd tonen zij hun legitimatiebewijs aanstonds.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel14
  - number: '14.3'
    text: |-
      Het legitimatiebewijs bevat een foto van de toezichthoudende ambtenaar en vermeldt in ieder geval diens naam en
      hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      De toezichthoudende ambtenaren hebben op vertoon van hun legitimatiebewijs, te allen tijde en ongehinderd toegang
      tot elke plaats, voor zover dat voor de vervulling van hun taak redelijkerwijs noodzakelijk is. Zonodig verschaffen
      zij zich toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      Indien de plaats, bedoeld in het eerste lid, een woning is, betreedt een toezichthoudende ambtenaar de woning
      niet tegen de wil van de bewoner tenzij met een schriftelijke last van de rechter-commissaris of de officier van
      justitie dan wel in aanwezigheid één hunner of van een hulpofficier van justitie.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel15
  - number: '15.3'
    text: |-
      Van dit binnentreden wordt binnen tweemaal vierentwintig uur proces-verbaal opgemaakt, hetwelk wordt ingezonden bij
      de officier van justitie. Daarin wordt mede van het tijdstip van het binnentreden en van het beoogde doel melding
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel15
  - number: '16.1'
    text: |-
      Voor zover zulks voor de vervulling van hun taak redelijkerwijs noodzakelijk is, zijn de toezichthoudende
      ambtenaren bevoegd:
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel16
  - number: 16.1.a
    text: inlichtingen te verlangen;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel16
  - number: 16.1.b
    text: inzage te verlangen van zakelijke gegevens en bescheiden;
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel16
  - number: 16.1.c
    text: kopieën te maken van de in onderdeel b bedoelde gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel16
  - number: '16.2'
    text: |-
      Indien het maken van kopieën niet ter plaatse kan geschieden zijn de toezichthoudende ambtenaren bevoegd de in het
      eerste lid, onderdeel b, bedoelde gegevens en bescheiden voor dat doel voor korte tijd mee te nemen tegen een door
      hen afgegeven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      Een ieder is verplicht aan toezichthoudende ambtenaren alle medewerking te verlenen die deze redelijkerwijs kunnen
      verlangen ter uitoefening van hun bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel17
  - number: '17.2'
    text: |-
      Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het verlenen
      van medewerking weigeren, voor zover hun geheimhoudingsplicht zich daartoe uitstrekt.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel17
  - number: '18'
    text: |-
      Met het opsporen van de in deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 184 van het Wetboek van Strafvordering BES][ref1], belast de door Onze Minister van Justitie, in
      overeenstemming met Onze Minister aangewezen ambtenaren. [Artikel 185 van het Wetboek van Strafvordering BES][ref2]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel185
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '185'
  - number: '19.1'
    text: |-
      De werkgever, die het in [artikel 2, eerste lid][ref1], neergelegde verbod overtreedt, wordt gestraft met een
      hechtenis van ten hoogste drie maanden of een geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028437#Artikel2
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028437
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
  - number: '19.2'
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel19
  - number: '20'
    text: |-
      Indien een werkgever een vreemdeling arbeid doet verrichten in strijd met het bepaalde in
      [artikel 2, eerste lid][ref1], wordt de vreemdeling vermoed gedurende tenminste zes maanden werkzaam te zijn voor
      die werkgever tegen een beloning en een arbeidsduur die in de betreffende bedrijfstak gebruikelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0028437#Artikel2
    url: https://wetten.overheid.nl/BWBR0028437/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028437
        artikel: '2'
        hoofdstuk: II
        paragraaf: '1'
