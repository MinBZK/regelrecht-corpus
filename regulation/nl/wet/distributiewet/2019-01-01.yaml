  - number: '24'
    text: |-
      Deze wet treedt in werking, voor wat betreft de [artikelen 1][ref1], [11][ref2] en [12][ref3], met ingang van den
      dag na dien harer afkondiging. De overige artikelen treden in werking op een bij koninklijk besluit te bepalen
      tijdstip.


