preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is regelen te stellen teneinde in geval van oorlog,
    oorlogsgevaar of andere buitengewone omstandigheden een doelmatige distributie van goederen in het belang van
    volkshuishouding, landsverdediging en veiligheid van niet-militaire personen of lichamen mogelijk te maken;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001997/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van deze wet wordt verstaan onder «Onze Minister»: Onze Minister van Economische Zaken en
      Klimaat.

      2 In deze wet en de daarop berustende bepalingen wordt mede verstaan onder goederen: elektriciteit.
    url: https://wetten.overheid.nl/BWBR0001997/2019-01-01#Artikel1
  - number: '4'
    text: |-
      De soorten van goederen, welke worden beschouwd als distributiegoederen in den zin dezer wet, worden door Onzen
      Minister aangewezen. Ten aanzien van deze soorten van goederen stelt hij een distributieregeling vast, waarbij aan
      de voorziening in de behoefte van de landsverdediging voorrang verleend wordt.
    url: https://wetten.overheid.nl/BWBR0001997/2019-01-01#Artikel4
  - number: '5'
    text: |-
      1 Onze Minister kan bepalen, dat distributiegoederen niet mogen worden gekocht, verkocht, te koop aangeboden,
      afgeleverd, of voorhanden of in voorraad gehouden dan met inachtneming van de door hem vastgestelde
      distributieregeling.

      2 Hij kan daarbij bepalen, dat de in lid 1 genoemde handelingen niet zullen mogen geschieden zonder schriftelijke
      vergunning, door of namens hem verleend; aan deze vergunning kunnen voorwaarden worden verbonden. In spoedeischende
      gevallen kan zij ook anders dan schriftelijk worden verleend.
    url: https://wetten.overheid.nl/BWBR0001997/2019-01-01#Artikel5
  - number: '6'
    text: |-
      1 Onze Minister is bevoegd, regelen te stellen met betrekking tot het gebruik, het verbruik, de bewerking of de
      verwerking van distributiegoederen.

      2 Hij kan daarbij het gebruik, het verbruik, de bewerking of de verwerking dier goederen tot bepaalde doeleinden
      verbieden, dan wel uitsluitend tot bepaalde doeleinden, al dan niet voorwaardelijk, toestaan.
    url: https://wetten.overheid.nl/BWBR0001997/2019-01-01#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister kan regelen stellen met betrekking tot het vervoer van distributiegoederen.

      2 Hij kan dat vervoer in door hem aan te wijzen gebieden geheel of gedeeltelijk verbieden, of niet dan
      voorwaardelijk toestaan.
    url: https://wetten.overheid.nl/BWBR0001997/2019-01-01#Artikel7
  - number: '8'
    text: |-
      1 Onze Minister kan, hetzij voor het Rijk in Europa, hetzij voor door hem aan te wijzen gedeelten daarvan, bepalen,
      dat ieder, die distributiegoederen voorhanden of in voorraad heeft, verplicht is, van aard, hoeveelheid en plaats
      dier goederen opgave te doen, hetzij aan den Minister, hetzij aan de door dezen aangewezen instanties of personen.

      2 De opgave geschiedt op tijdstippen, te bepalen door Onzen Minister en overeenkomstig regelen door hem te stellen.

      3 De in lid 1 bedoelde verplichting kan door of namens den Minister ook aan bepaalde personen of lichamen worden
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0001997/2019-01-01#Artikel8
  - number: 10a
    text: |-
      1 In buitengewone omstandigheden kan Onze Minister soorten van goederen als distributiegoederen aanwijzen. Ten
      aanzien van deze soorten van goederen geeft hij, in afwijking van [artikel 4][ref1], aan een onderneming of een
      vrije-beroepsbeoefenaar een aanwijzing die deze ertoe verplicht om binnen een bij de aanwijzing gestelde termijn
      een daarbij aangegeven hoeveelheid distributiegoederen te winnen, te vervaardigen, te bewerken, te verwerken, of te
      herstellen, alsmede te leveren aan de staat, dan wel aan een andere rechtspersoon of natuurlijke persoon.

      2 In buitengewone omstandigheden kan Onze Minister aan een onderneming of een vrije-beroepsbeoefenaar een
      aanwijzing geven die deze ertoe verplicht om binnen een daarbij aan te geven termijn ten behoeve van de staat
      of een daarbij aan te geven andere rechtspersoon of natuurlijke persoon andere handelingen te verrichten dan die
      bedoeld in het eerste lid. In de aanwijzing worden de opgedragen handelingen zo nauwkeurig mogelijk omschreven.

      3 De aanwijzing wordt zo mogelijk schriftelijk gegeven. Een op een andere wijze gegeven aanwijzing wordt zo spoedig
      mogelijk door een schriftelijke aanwijzing gevolgd.

      4 Met betrekking tot het in het eerste lid bedoelde winnen, vervaardigen, bewerken, verwerken, herstellen en
      leveren van distributiegoederen en de in het tweede lid bedoelde andere handelingen gelden tussen de onderneming
      of vrijeberoepsbeoefenaar en degene aan wie de distributiegoederen worden geleverd of ten behoeve van wie de andere
      handelingen worden verricht de voor soortgelijke handelingen rechtens geldende dan wel gebruikelijke tarieven en
      voorwaarden. Onze Minister kan bij ministeriële regeling nadere regels stellen ter aanvulling of ter vervanging van
      de rechtens geldende dan wel gebruikelijke tarieven en voorwaarden.

      5 Onze Minister kan aan de onderneming of vrijeberoepsbeoefenaar aan wie een aanwijzing is gegeven krachtens het
      tweede lid, een naar billijkheid te bepalen vergoeding toekennen ter zake van buitengewone kosten door betrokkene
      gemaakt vanwege de naleving van de aanwijzing.

      6 Bij algemene maatregel van bestuur kunnen op voordracht van Onze Minister regels worden gesteld ter zake van de
      toepassing van het vijfde lid.


