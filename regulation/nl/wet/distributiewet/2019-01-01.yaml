  - number: '11'
    text: |-
      1 Voor de toepassing van deze wet wordt het Rijk verdeeld in distributiekringen.

      2 Elke gemeente vormt een kring.

      3 Wij kunnen bepalen:

      a. dat twee of meer gemeenten tezamen één kring zullen vormen;

      b. dat, met inachtneming van door Onzen Minister te bepalen grenzen, een gemeente in twee of meer kringen zal
      worden verdeeld.
    url: https://wetten.overheid.nl/BWBR0001997/2019-01-01#Artikel11
  - number: '12'
    text: |-
      1 In elken kring is een distributiedienst.

      2 De burgemeester is het hoofd van den dienst en als zoodanig met de leiding daarvan belast. Hij kan, onder
      goedkeuring van Onzen Minister, een ander aanwijzen, die namens hem met de dagelijksche leiding van den dienst is
      belast. Hij stelt voor dezen een instructie vast.

      3 De burgemeester draagt er zorg voor, dat zodanige voorbereidingen getroffen worden, dat in geval van
      inwerkingtreding van een of meer van de in [artikel 24, tweede lid][ref1], bedoelde artikelen, de distributiedienst
      tijdig de noodzakelijke handelingen ter uitvoering van het bij of krachtens die artikelen bepaalde kan verrichten.

      4 In het geval, bedoeld in lid 3, onder *a* van het vorig artikel, regelen de burgemeesters onder Onze goedkeuring
      de inrichting van den distributiedienst in den kring. Zij kunnen daarbij één der gemeenten als centrale gemeente
      aanwijzen. Bij de door de burgemeesters te treffen gemeenschappelijke regeling kan geen openbaar lichaam
      als bedoeld in [artikel 8, eerste lid, van de Wet gemeenschappelijke regelingen][ref2] worden ingesteld. De
      [artikelen 99 tot en met 103l van die wet][ref3] zijn niet van toepassing.

      5 Indien binnen een door Onzen Minister te bepalen termijn een regeling niet aan Onze goedkeuring is onderworpen of
      Wij die niet goedkeuren, wordt de regeling door Ons vastgesteld.

      6 Het bepaalde in de leden 4 en 5 vindt overeenkomstige toepassing ten aanzien van wijziging en opheffing van een
      gemeenschappelijke regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0001997#Artikel24
