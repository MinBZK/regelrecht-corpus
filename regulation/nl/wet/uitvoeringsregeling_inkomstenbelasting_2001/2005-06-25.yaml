    text: |-
      Aan het in [artikel 8.14, eerste lid, onderdeel b, onder 2°, van de wet][ref1] opgenomen vereiste behoeft niet te
      worden voldaan gedurende de periode van het kalenderjaar dat het kind, bedoeld in het eerste lid, onderdeel b, van
      dat artikel, tegelijkertijd tot het huishouden van beide ouders heeft behoord en het kind op hetzelfde woonadres
      als een van die ouders staat ingeschreven in de basisadministratie persoonsgegevens.

      Voor de toepassing van de eerste volzin behoort het kind tegelijkertijd tot het huishouden van beide ouders indien
      het kind doorgaans tenminste drie gehele dagen per week tot het huishouden van de belastingplichtige en voor de
      overige tijd doorgaans tot het huishouden van de andere ouder behoort.


