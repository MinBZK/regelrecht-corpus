      1 De afschrijving op een eigen monumentenwoning wordt gesteld op 15 percent van het bruto eigenwoningforfait.

      2 Het bruto eigenwoningforfait wordt berekend door de som van het voor de monumentenwoning
      geldende forfaitpercentage, bedoeld in [artikel 3.112, eerste lid, van de wet][ref1] en het in
      [artikel 6.31, eerste lid, onderdeel a, van de wet][ref2] vermelde percentage, te vermenigvuldigen met
      de eigenwoningwaarde van de monumentenwoning, met dien verstande dat hierbij als eigenwoningwaarde van de
      monumentenwoning ten hoogste € 1 000 000 in aanmerking wordt genomen.

      3 In afwijking van het eerste lid wordt voor monumentenwoningen waarvan het bruto eigenwoningforfait in
      aanmerkelijke mate de invloed ondergaat van ongebouwde en gebouwde aanhorigheden de afschrijving beperkt tot
      15 percent van het aan het monumentale gedeelte van de monumentenwoning toe te rekenen deel van het bruto
      eigenwoningforfait.


