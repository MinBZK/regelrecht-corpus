    text: |-
      1 [Artikel 6.14, eerste lid, onderdeel a, van de wet][ref1] geldt niet voor:

      a. de belastingplichtige aan wie wegens gemoedsbezwaren tegen één of meer volksverzekeringen
      door de Sociale verzekeringsbank een ontheffing is verleend als bedoeld in
      [artikel 19 van de Wet financiering volksverzekeringen][ref2] , ingeval noch hij, noch zijn echtgenoot het recht op
      kinderbijslag ingevolge de [Algemene Kinderbijslagwet][ref3] geldend maakt;

      b. de belastingplichtige die op grond van de regelen ter voorkoming van samenloop van kinderbijslag ingevolge de
      [Kinderbijslagwet][ref4] zijn recht op kinderbijslag voor dat kind niet geldend kan maken en geen huishouden vormt
      met degene die het recht op kinderbijslag voor dat kind wel geldend kan maken.

      2 Voor de toepassing van het eerste lid, onderdeel b, geldt dat:

      a. de in [artikel 5a van het Samenloopbesluit kinderbijslag][ref5] bedoelde persoon wiens recht op kinderbijslag
      niet wordt uitbetaald, zijn recht op kinderbijslag niet geldend maakt, en

      b. de in [artikel 5a van het Samenloopbesluit kinderbijslag][ref6] bedoelde persoon wiens recht op kinderbijslag
      aan hem geheel of gedeeltelijk wordt uitbetaald, zijn recht op kinderbijslag geheel geldend maakt.

      3 Het eerste lid, onderdeel b, is van overeenkomstige toepassing indien de belastingplichtige recht heeft op
      een tegemoetkoming volgens een naar aard en strekking met de [Algemene Kinderbijslagwet][ref7] overeenkomende
      buitenlandse regeling.


