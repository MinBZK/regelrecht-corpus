        artikel: '3.124'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3.125'
  - number: '5'
    text: |-
      Bij het bepalen van de winst van het eerste kalenderjaar als ondernemer komt mede in aftrek het totale bedrag van
      de kosten en lasten die zijn gemaakt in de vijf daaraan voorafgaande kalenderjaren en die verband houden met het
      starten van de onderneming, voorzover:

      a. er in die periode geen opbrengsten tegenover hebben gestaan en

      b. zij niet ten laste van het belastbaar inkomen uit werk en woning kunnen of konden worden gebracht.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel5
  - number: '6'
    text: |-
      1 Als regelingen ten behoeve van de ontwikkeling en instandhouding van bos en natuur en als overeenkomsten
      die op die regelingen vooruitlopen, als bedoeld in [artikel 3.13, eerste lid, onderdeel h, van de wet][ref1]
      worden aangewezen: de Tijdelijke regeling particulier natuurbeheer respectievelijk de in het tweede lid genoemde
      overeenkomsten.

      2 De in het eerste lid bedoelde overeenkomsten betreffen:

      a. de overeenkomsten met het Bureau Beheer Landbouwgronden

      1°. met het door de Dienst Landelijk Gebied toegekende nummer: 005/9001 van 29 mei 1996;

      2°. met het door de Dienst Landelijk Gebied toegekende nummer: 008/9001 van 30 mei 1996;

      3°. met het door de Dienst Landelijk Gebied toegekende nummer: 004/9001 van 27 oktober 1997;

      4°. met het door de Dienst Landelijk Gebied toegekende nummer: 003/9001 van 15 december 1997;

      b. de beschikkingen van de minister van Landbouw, Natuurbeheer en Visserij van 18 april 1998 met de
      beschikkingnummers kaderwet/pnb/01, kaderwet/pnb/02 en kaderwet/pnb/03.

      3 Van de voordelen die worden genoten op grond van de in het eerste lid bedoelde regelingen en overeenkomsten
      behoort 90% niet tot de winst.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.13
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3.13'
  - number: '7'
    text: |-
      Voor de toepassing van [artikel 3.16, tweede lid, onderdeel c, van de wet][ref1] wordt kleding die niet uitsluitend
      of nagenoeg uitsluitend geschikt is om bij het behalen van de winst te dragen, slechts als werkkleding aangemerkt
      indien zij is voorzien van een of meer duidelijk zichtbare, aan de onderneming gebonden beeldmerken met een
      oppervlakte van tezamen ten minste 70 cm2.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.16
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3.16'
  - number: '8'
    text: |-
      1 Voor de toepassing van [artikel 3.17, eerste lid, onderdeel a, onder 1° van de wet][ref1], verhuist de
      ondernemer in ieder geval in het kader van de onderneming ingeval hij binnen twee jaar na de verplaatsing van de
      onderneming:

      a. verhuist naar een woning binnen een afstand van 10 kilometer van de nieuwe vestigingsplaats van de onderneming
      terwijl hij op een afstand groter dan 10 kilometer van deze vestigingsplaats woonde;

      b. door verhuizing de afstand tussen zijn woning en de vestigingsplaats van de onderneming met ten minste 50
      percent en ten minste 10 kilometer bekort.

      2 Onder afstand als bedoeld in het eerste lid wordt verstaan de afstand gemeten langs de meest gebruikelijke weg.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.17
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3.17'
  - number: '9'
    text: |-
      De rittenregistratie als bedoeld in [artikel 3.20 van de wet][ref1] bevat ten minste de volgende gegevens:

      a. merk, type en kenteken van de auto;

      b. periode van terbeschikkingstelling van de auto;

      c. per rit:

      10. datum;

      20. beginstand en eindstand van de kilometerteller;

      30. beginadres en eindadres;

      40. de gereden route indien deze afwijkt van de meest gebruikelijke;

      50. het karakter van de rit.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.20
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel9
    references:
