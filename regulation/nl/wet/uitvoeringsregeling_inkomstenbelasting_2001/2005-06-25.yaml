      Met betrekking tot een kalenderjaar wordt als beginnende ondernemer als bedoeld in
      [artikel 5.17, derde lid, onderdeel a, van de wet][ref1] aangemerkt de natuurlijke persoon die naar verwachting
      met betrekking tot dat jaar of het daaropvolgende jaar in aanmerking komt voor zelfstandigenaftrek en ten aanzien
      van wie deze aftrek over nog niet meer dan zeven jaren is toegepast, dan wel, ingeval hij in het kalenderjaar een
      onderneming of een gedeelte van een onderneming overneemt, over nog niet meer dan veertien jaren is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.17
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel30
