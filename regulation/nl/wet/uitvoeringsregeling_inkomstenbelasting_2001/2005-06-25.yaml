      1 De in [artikel 6.15 van de wet][ref1] bedoelde uitgaven voor levensonderhoud van een kind worden, indien de
      kosten van dat onderhoud in belangrijke mate op de belastingplichtige drukken, in aanmerking genomen tot een bedrag
      van:

      a. € 270 per kalenderkwartaal indien het kind jonger dan 6 jaar is;

      b. € 330 per kalenderkwartaal indien het kind 6 jaar of ouder doch jonger dan 12 jaar is;

      c. € 399 per kalenderkwartaal indien het kind 12 jaar of ouder doch jonger dan 18 jaar is;

      d. € 330 per kalenderkwartaal indien het kind 18 jaar of ouder is.

      2 Het in het eerste lid, onderdeel d, vermelde bedrag wordt verhoogd tot:

      a. € 660, indien de op de ouder drukkende bijdrage in de kosten van het onderhoud van het kind ten minste € 660 per
      kwartaal belopen en de kosten van het onderhoud van het kind tevens grotendeels op de belastingplichtige drukken;

      b. € 990, indien het kind niet tot het huishouden van de belastingplichtige behoort, de op de ouder drukkende
      bijdrage in de kosten van het onderhoud van het kind ten minste € 990 per kwartaal belopen en de kosten van het
      onderhoud van het kind tevens geheel of nagenoeg geheel op de belastingplichtige drukken.

      3 Indien zowel de belastingplichtige als zijn partner uitgaven voor levensonderhoud van kinderen in aanmerking
      nemen, worden de in aanmerking te nemen bedragen gesteld op de helft van de bedragen vermeld in het eerste en
      tweede lid, zonodig naar boven af te ronden op een geheel getal.

      4 Voor de toepassing van de vorige leden is beslissend de toestand bij het begin van het kalenderkwartaal.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6.15
