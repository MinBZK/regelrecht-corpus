      1 Als kredietinstelling als bedoeld in [artikel 5.18a, tweede lid, van de wet][ref1]
      wordt aangewezen de kredietinstelling die is ingeschreven in het register, bedoeld in
      [artikel 52 van de Wet toezicht kredietwezen 1992][ref2], en op verzoek van de instelling door de inspecteur, onder
      door hem te stellen voorwaarden, als zodanig is aangemerkt.

      2 Als beleggingsinstelling als bedoeld in [artikel 5.18a, tweede lid, van de wet][ref3]
      wordt aangewezen de beleggingsinstelling die is ingeschreven in het register, bedoeld in
      [artikel 18 van de Wet toezicht beleggingsinstellingen][ref4], en op verzoek van de instelling door de inspecteur,
      onder door hem te stellen voorwaarden, als zodanig is aangemerkt.

      3 Een bestaande kredietinstelling of beleggingsinstelling kan slechts worden aangewezen indien op het tijdstip
      van inwerkingtreding van de aanwijzing in de kredietinstelling onderscheidenlijk beleggingsinstelling geen zuivere
      winst aanwezig is.

      4 Indien de aangewezen kredietinstelling of beleggingsinstelling niet langer voldoet aan de omschrijving, bedoeld
      in [artikel 5.18a, tweede lid, van de wet][ref5], of aan de in het eerste lid onderscheidenlijk tweede lid bedoelde
      voorwaarden, doet de kredietinstelling onderscheidenlijk de beleggingsinstelling daarvan onverwijld schriftelijk
      mededeling aan de inspecteur.

      5 De aanwijzing wordt door de inspecteur ingetrokken indien de kredietinstelling of beleggingsinstelling daarom
      verzoekt dan wel indien de kredietinstelling of beleggingsinstelling niet langer voldoet aan de omschrijving,
      bedoeld in [artikel 5.18a, tweede lid, van de wet][ref6] of aan de in het eerste lid onderscheidenlijk tweede lid
      bedoelde voorwaarden. Indien de kredietinstelling of beleggingsinstelling de in het vierde lid bedoelde mededeling
      onverwijld heeft gedaan en aannemelijk maakt dat het niet voldoen aan de omschrijving of de voorwaarden van
      tijdelijke aard is, een incidenteel karakter heeft en niet in strijd is met doel en strekking van de regeling ziet
      de inspecteur af van intrekking van de aanwijzing.

      6 De aanwijzing, de intrekking van de aanwijzing alsmede de afwijzing van een verzoek om aanwijzing geschieden bij
      voor bezwaar vatbare beschikking.

      7 De inspecteur bepaalt in de beschikking het tijdstip waarop de aanwijzing of de intrekking in werking treedt,
      welk tijdstip kan zijn gelegen voor de datum van dagtekening van de beschikking.


