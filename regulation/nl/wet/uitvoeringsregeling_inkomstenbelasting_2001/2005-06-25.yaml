        bwb_id: BWBR0011353
        artikel: '5.17'
  - number: '31'
    text: |-
      De beginnende ondernemer als bedoeld in [artikel 5.17, derde lid, onderdeel b, van de wet][ref1], is een
      rechtspersoon die ten tijde van het verstrekken van de achtergestelde lening aan hem, onderscheidenlijk het nemen
      van een deelneming in hem moet voldoen aan de volgende voorwaarden:

      a. de rechtspersoon is een besloten vennootschap met beperkte aansprakelijkheid die niet langer dan acht jaren
      geleden tot stand is gekomen;

      b. voor rekening van de rechtspersoon wordt in Nederland een onderneming gedreven van een zodanige omvang dat de
      bij hem in dienst zijnde personen te zamen naar verwachting daaraan jaarlijks ten minste 1225 uren besteden;

      c. de voor rekening van de rechtspersoon gedreven onderneming is geen voortzetting van een onderneming die, of een
      gedeelte van een onderneming, dat meer dan acht jaren geleden direct of indirect is gedreven voor rekening van een
      persoon die thans onmiddellijk of middellijk aandeelhouder is in de rechtspersoon;

      d. de rechtspersoon voldoet aan ten minste twee van de in
      [artikel 396, eerste lid, onderdelen a, b, en c, van Boek 2 van het Burgerlijk Wetboek][ref2] vermelde vereisten;

      e. de feitelijke werkzaamheid van de rechtspersoon bestaat niet in het, onmiddellijk of middellijk, beleggen van
      vermogen of daarmee overeenkomende werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.17
