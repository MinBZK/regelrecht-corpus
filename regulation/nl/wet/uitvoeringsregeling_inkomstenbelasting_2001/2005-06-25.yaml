    text: |-
      1 Als uitgaven wegens adoptie van een kind dat in een ander land woonde dan de adoptanten voordat het kind
      door de adoptanten feitelijk werd verzorgd en opgevoed, worden in aanvulling op de uitgaven bedoeld in
      [artikel 6.23, eerste lid, van de wet][ref1] uitsluitend aangemerkt de uitgaven:

      a. voor de algemene voorlichting, bedoeld in
      [artikel 5, tweede lid, van de Wet opneming buitenlandse kinderen ter adoptie][ref2] dan wel daarmee overeenkomende
      uitgaven indien laatstgenoemde wet op deze adoptie niet van toepassing is;

      b. voor bemiddeling als bedoeld in [artikel 1van de Wet opneming buitenlandse kinderen ter adoptie][ref3] tot een
      bedrag van ten hoogste € 681 dan wel daarmee overeenkomende uitgaven tot ten hoogste het eerder genoemde bedrag
      indien laatstgenoemde wet op deze adoptie niet van toepassing is;

      c. verband houdende met de indiening en de behandeling van een verzoek tot het uitspreken van adoptie volgens het
      recht van het land van herkomst van het kind;

      d. voor vervoer en begeleiding van het kind naar de woning of verblijfplaats van de adoptanten, met dien verstande
      dat als reis- en verblijfkosten van de adoptanten in totaal niet meer dan de reis- en verblijfkosten met betrekking
      tot een heen- en terugreis per persoon in aanmerking worden genomen.

      2 De in het eerste lid bedoelde reis- en verblijfkosten worden niet eerder in aanmerking genomen dan nadat het ter
      zake van de adoptie bevoegde gezag de beginseltoestemming of toestemming heeft verleend tot het opnemen van het
      kind in het gezin dan wel, zo deze beginseltoestemming of toestemming ontbreekt, nadat de uitspraak van de rechter
      waarbij het verzoek om adoptie is toegewezen, kracht van gewijsde heeft gekregen.

      3 Indien de adoptanten partner zijn en beiden uitgaven voor bemiddeling ter adoptie van een kind als bedoeld in het
      eerste lid, onderdeel b, in aanmerking nemen, wordt het door hen beiden tezamen voor die uitgaven in aanmerking te
      nemen bedrag gesteld op ten hoogste het in het eerste lid, onderdeel b, vermelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6.23
