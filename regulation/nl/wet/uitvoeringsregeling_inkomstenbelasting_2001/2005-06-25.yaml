  - number: '1.2'
    text: 'Deze regeling verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel1
  - number: 1.2.a
    text: |-
      wet: [Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 1.2.b
    text: |-
      inhoudingsplichtige: de inhoudingsplichtige als bedoeld in de [Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 1.2.c
    text: |-
      openbaar vervoer: voor een ieder openstaand personenvervoer volgens een dienstregeling met een auto, bus, trein,
      tram, metro, veerpont of een via een geleidesysteem voortbewogen voertuig.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel1
  - number: '2'
    text: |-
      Een kind wordt in belangrijke mate op kosten van de ouder onderhouden indien de op de ouder drukkende bijdrage
      in de kosten van het onderhoud van het kind ten minste € 386 per kwartaal beloopt. De ouder wordt geacht een
      kind in belangrijke mate op zijn kosten te onderhouden indien hij voor het kind recht heeft op kinderbijslag
      ingevolge de [Algemene Kinderbijslagwet][ref1] of op een tegemoetkoming volgens een naar aard en strekking met de
      [Algemene Kinderbijslagwet][ref2] overeenkomende buitenlandse regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0002368
  - number: 2a.1
    text: |-
      Een aanspraak op periodieke uitkeringen waarvan de uitkeringen zijn ingegaan en waarvan de hoogte van
      de uitkeringen niet voor de gehele uitkeringsperiode in geldeenheden is vastgesteld, wordt op grond van
      [artikel 1.7, derde lid, van de wet][ref1] gelijkgesteld met een aanspraak op vaste en gelijkmatige periodieke
      uitkeringen indien wordt voldaan aan de hierna opgenomen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 2a.2
    text: 'Met betrekking tot de uitkeringen en de administratieve vormgeving daarvan gelden de volgende regels:'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.2.a
    text: |-
      de termijnen van een oudedagslijfrente, een overbruggingslijfrente of een tijdelijke oudedagslijfrente als bedoeld
      in [artikel 3.125, eerste lid, onderdeel a, onderdeel c, respectievelijk onderdeel d, van de wet][ref1] worden op
      de ingangsdatum uitgedrukt in een vast aantal beleggingseenheden (units) per jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 2a.2.b
    text: |-
      indien bij een of meer van de onder a genoemde lijfrenten een nabestaandenlijfrente als bedoeld in
      [artikel 3.125, onderdeel b, van de wet][ref1] is meeverzekerd, dient deze op de ingangsdatum van de lijfrente
      waarbij deze is meeverzekerd te worden uitgedrukt in een vast aantal beleggingseenheden per jaar; in plaats daarvan
      kan op die ingangsdatum voor de nabestaandenlijfrente een kapitaal worden bepaald dat dient als rekengrootheid voor
      de vaststelling van de hoogte van de termijnen van de nabestaandenlijfrente in beleggingseenheden of euro’s; indien
      de nabestaandenlijfrente niet een lijfrente in beleggingseenheden of een gerichte lijfrente is, maar is verzekerd
      als een recht op uitkeringen in euro’s, wordt de nabestaandenlijfrente geadministreerd als een zelfstandig recht
      ten opzichte van de in onderdeel a genoemde lijfrenten;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 2a.2.c
    text: |-
      de hoogte van de uiteindelijk in euro’s uit te keren termijnen van lijfrente dient uitsluitend te worden
      beïnvloed door het verschil tussen het feitelijk behaalde beleggingsrendement en de rekenrente die ten tijde van
      het ingaan van de lijfrente als rekenrendement is gehanteerd. Daartoe wordt de contante waarde van de termijnen
      in beleggingseenheden actuarieel bijgehouden overeenkomstig de wijze waarop dat geschiedt voor termijnen van
      lijfrenten in euro’s.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.3
    text: 'Met betrekking tot de tariefgrondslagen voor het berekenen van de uitkeringen gelden de volgende regels:'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.3.a
    text: |-
      de verzekeraar van de lijfrente gaat op de ingangsdatum van de lijfrente uit van sterftegrondslagen die passen bij
      de sterfterisico’s van de verzekerde rechten;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.3.b
    text: |-
      de verzekeraar van de lijfrente gaat ter berekening van het op jaarbasis uit te keren vaste aantal
      beleggingseenheden uit van ten hoogste het netto rekenrendement dat hij op de ingangsdatum hanteert voor
      soortgelijke lijfrenten in euro’s of van het op de ingangsdatum van de lijfrente geldende u-rendement zoals
      dat periodiek wordt gepubliceerd door het Centrum voor Verzekeringstatistiek van het Verbond van Verzekeraars;
      gedurende de looptijd vindt geen herberekening plaats van het aantal jaarlijks uit te keren beleggingseenheden;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.3.c
    text: in de hoogte van de termijnen van lijfrente in beleggingseenheden wordt geen inflatie-element verdisconteerd.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.4
    text: |-
      Jaarlijks verwerkt de verzekeraar, overeenkomstig de bij lijfrenteverzekeringen met uitkeringen in euro’s te
      hanteren handelwijze, de actuariële gevolgen van de op de ingangsdatum veronderstelde tariefgrondslagen in de
      administratie van de contante waarde van de uitkeringen in beleggingseenheden en in de administratie van de
      beleggingswaarde zelf.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.5
    text: |-
      Met betrekking tot de peildatum en de periode van vaststellen van de uitkeringen in euro’s gelden de volgende
      regels:
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.5.a
    text: |-
      bij de berekening van de per vervallen termijn verschuldigde uitkering in euro’s kan worden uitgegaan van de waarde
      van de beleggingseenheid op een vaste peildatum in de kalendermaand van betaling of in de daaraan voorafgaande
      kalendermaand;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.5.b
    text: |-
      gedurende een periode van ten hoogste 12 maanden (herrekenperiode) kunnen de in de herrekenperiode uit te keren
      termijnen bij aanvang daarvan in euro’s worden vastgesteld; de hoogte van de uitkeringen in euro’s dient daarbij
      te worden bepaald op basis van de werkelijke waarde van de beleggingseenheid per een vaste peildatum gelegen in de
      kalendermaand waarin de herrekenperiode ingaat of in een van de twee daaraan voorafgaande kalendermaanden; slechts
      eenmalig kan worden gekozen voor een datum van ingang van de herrekenperiode.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.6
    text: |-
      Met betrekking tot meeverzekerde nabestaandenlijfrenten en tot de wijze van rekening houden met het overlijden van
      verzekerden gelden de volgende regels:
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.6.a
    text: |-
      in de in het tweede lid, onderdeel b, genoemde gevallen waarin een of meer nabestaandenlijfrenten zijn
      meeverzekerd, dient bij de vaststelling van de hoogte van de termijnen van de lijfrenten als bedoeld in het tweede
      lid, onderdeel a, voor iedere meeverzekerde nabestaandenlijfrente op actuarieel verantwoorde wijze rekening te
      worden gehouden met het feit dat die nabestaandenlijfrente is meeverzekerd;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: 2a.6.b
    text: |-
      indien een meeverzekerde nabestaandenlijfrente op de ingangsdatum van een van de in het tweede lid, onderdeel
      a, genoemde lijfrenten is uitgedrukt in een jaarlijks vast aantal beleggingseenheden, wordt bij overlijden van
      een verzekerde zowel de contante waarde van de beleggingseenheden als de totale beleggingswaarde herrekend.
      Het overlijden dient daarbij geen invloed te hebben op de waarde per beleggingseenheid. Een vrijval van de
      beleggingswaarde bij overlijden komt, overeenkomstig de bij uitkeringen in euro’s te hanteren handelwijze, ten
      goede aan de verzekeraar in verband met het door deze gelopen langlevenrisico.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel2a
  - number: '3'
    text: |-
      Voor de toepassing van artikelen 2.2, eerste lid, en 2.5, eerste lid van de wet, worden, voorzover het niet gaat om
      lidstaten van de Europese Unie, als de in die bepalingen bedoelde mogendheden aangewezen alle mogendheden waarmee
      Nederland een regeling ter voorkoming van dubbele belasting is overeengekomen, waarvan de bepalingen van toepassing
      zijn, met uitzondering van Zwitserland.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel3
  - number: '4.1'
    text: |-
      Voor gevallen waarin een premie voor een lijfrente of een andere periodieke uitkering of verstrekking uit een
      inkomensvoorziening niet geheel als uitgave voor een inkomensvoorziening in aanmerking is genomen, worden voor de
      vaststelling van het gedeelte van het recht dat in aanmerking wordt genomen bij het belastbare inkomen uit werk en
      woning en het gedeelte dat in aanmerking wordt genomen bij het belastbare inkomen uit sparen en beleggen de eerste
      kosten, de toekomstige kosten en het rendement evenredig aan die gedeelten toegerekend naar de mate waarin de
      premie bij het belastbare inkomen uit werk en woning en het belastbare inkomen uit sparen en beleggen in aanmerking
      is genomen.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel4
  - number: '4.2'
    text: |-
      Voorzover een premie voor aanspraken op periodieke uitkeringen of verstrekkingen ter zake van invaliditeit,
      ziekte of ongeval als bedoeld in [artikel 3.124, onderdeel c, van de wet][ref1] en een premie voor lijfrenten
      als bedoeld in [artikel 3.125, eerste lid, onderdeel b, van de wet][ref2] in enig jaar niet als uitgave voor
      een inkomensvoorziening in aanmerking is genomen, wordt het desbetreffende recht in aanmerking genomen bij het
      belastbare inkomen uit sparen en beleggen naar de mate waarin die premie in verhouding staat tot de overige voor
      dit recht betaalde premies die wel als uitgaven voor inkomensvoorzieningen in aanmerking zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '5'
    text: |-
      Bij het bepalen van de winst van het eerste kalenderjaar als ondernemer komt mede in aftrek het totale bedrag van
      de kosten en lasten die zijn gemaakt in de vijf daaraan voorafgaande kalenderjaren en die verband houden met het
      starten van de onderneming, voorzover:
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel5
  - number: 5.a
    text: er in die periode geen opbrengsten tegenover hebben gestaan en
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel5
  - number: 5.b
    text: zij niet ten laste van het belastbaar inkomen uit werk en woning kunnen of konden worden gebracht.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel5
  - number: '6.1'
    text: |-
      Als regelingen ten behoeve van de ontwikkeling en instandhouding van bos en natuur en als overeenkomsten die
      op die regelingen vooruitlopen, als bedoeld in [artikel 3.13, eerste lid, onderdeel h, van de wet][ref1] worden
      aangewezen: de Tijdelijke regeling particulier natuurbeheer respectievelijk de in het tweede lid genoemde
      overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '6.2'
    text: 'De in het eerste lid bedoelde overeenkomsten betreffen:'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel6
  - number: 6.2.a
    text: de overeenkomsten met het Bureau Beheer Landbouwgronden
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel6
  - number: 6.2.a.1°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 005/9001 van 29 mei 1996;'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel6
  - number: 6.2.a.2°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 008/9001 van 30 mei 1996;'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel6
  - number: 6.2.a.3°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 004/9001 van 27 oktober 1997;'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel6
  - number: 6.2.a.4°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 003/9001 van 15 december 1997;'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel6
  - number: 6.2.b
    text: |-
      de beschikkingen van de minister van Landbouw, Natuurbeheer en Visserij van 18 april 1998 met de beschikkingnummers
      kaderwet/pnb/01, kaderwet/pnb/02 en kaderwet/pnb/03.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel6
  - number: '6.3'
    text: |-
      Van de voordelen die worden genoten op grond van de in het eerste lid bedoelde regelingen en overeenkomsten behoort
      90% niet tot de winst.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel6
  - number: '7'
    text: |-
      Voor de toepassing van [artikel 3.16, tweede lid, onderdeel c, van de wet][ref1] wordt kleding die niet uitsluitend
      of nagenoeg uitsluitend geschikt is om bij het behalen van de winst te dragen, slechts als werkkleding aangemerkt
      indien zij is voorzien van een of meer duidelijk zichtbare, aan de onderneming gebonden beeldmerken met een
      oppervlakte van tezamen ten minste 70 cm2.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '8.1'
    text: |-
      Voor de toepassing van [artikel 3.17, eerste lid, onderdeel a, onder 1° van de wet][ref1], verhuist de ondernemer
      in ieder geval in het kader van de onderneming ingeval hij binnen twee jaar na de verplaatsing van de onderneming:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 8.1.a
    text: |-
      verhuist naar een woning binnen een afstand van 10 kilometer van de nieuwe vestigingsplaats van de onderneming
      terwijl hij op een afstand groter dan 10 kilometer van deze vestigingsplaats woonde;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel8
  - number: 8.1.b
    text: |-
      door verhuizing de afstand tussen zijn woning en de vestigingsplaats van de onderneming met ten minste 50 percent
      en ten minste 10 kilometer bekort.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel8
  - number: '8.2'
    text: Onder afstand als bedoeld in het eerste lid wordt verstaan de afstand gemeten langs de meest gebruikelijke weg.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel8
  - number: '9'
    text: |-
      De rittenregistratie als bedoeld in [artikel 3.20 van de wet][ref1] bevat ten minste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9.a
    text: merk, type en kenteken van de auto;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel9
  - number: 9.b
    text: periode van terbeschikkingstelling van de auto;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel9
  - number: 9.c
    text: |-
      per rit: 10. datum; 20. beginstand en eindstand van de kilometerteller; 30. beginadres en eindadres; 40. de gereden
      route indien deze afwijkt van de meest gebruikelijke; 50. het karakter van de rit.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel9
  - number: '10.1'
    text: |-
      In afwijking van [artikel 3.27, tweede lid, van de wet][ref1] is het eerste lid van dat artikel mede van toepassing
      op de betaling van premies voor risicoverzekeringen voor weduwen- en wezenpensioenen, voorzover het in de premies
      begrepen bestanddeel voor toekomstige wijzigingen in de hoogte van lonen of prijzen niet meer bedraagt dan nodig is
      voor een aanpassing aan een zodanige wijziging van 4% per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '10.2'
    text: |-
      In afwijking van [artikel 3.27, derde lid, van de wet][ref1] is het eerste lid van dat artikel mede van toepassing
      op de betaling van premies of koopsommen aan een pensioenlichaam waarvan het doel en de feitelijke werkzaamheden
      overeenkomen met die van een pensioenfonds als bedoeld in de [Pensioen- en spaarfondsenwet][ref2] en waarvan de
      winst uitsluitend kan worden aangewend ten bate van de verzekerden, een ander pensioenfonds met overeenkomstige
      doelstelling, of een algemeen maatschappelijk belang.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002089
  - number: '10.3'
    text: |-
      Het eerste en tweede lid zijn slechts van toepassing voorzover de betalingen het vermogen van de onderneming
      onherroepelijk hebben verlaten.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel10
  - number: 13a.1
    text: |-
      Aan de in [artikel 3.63, vierde lid en vijfde lid, van de wet][ref1] bedoelde termijn van 36 maanden wordt geacht
      te zijn voldaan indien zich na het aangaan van het samenwerkingsverband respectievelijk de dienstbetrekking een
      omstandigheid voordoet als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 13a.2
    text: 'Het eerste lid is van toepassing indien de belastingplichtige:'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel13a
  - number: 13a.2.a
    text: |-
      door ziekte of gebreken gedurende ten minste één jaar niet in staat is, of vermoedelijk niet in staat zal zijn,
      om ten minste 55% te verdienen van wat lichamelijk en geestelijk gezonde personen die overigens in gelijke
      omstandigheden verkeren, kunnen verdienen;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel13a
  - number: 13a.2.b
    text: in staat van faillissement wordt verklaard;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel13a
  - number: 13a.2.c
    text: surséance van betaling heeft aangevraagd;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel13a
  - number: 13a.2.d
    text: onder curatele wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel13a
  - number: 13a.2.e
    text: |-
      vóór het aangaan van het samenwerkingsverband respectievelijk de dienstbetrekking met degene die de onderneming
      gaat voortzetten nog wel, maar vanaf enig moment daarna niet meer kan kiezen voor kwalificatie als partner van de
      voortzetter, of
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel13a
  - number: 13a.2.f
    text: |-
      overlijdt en de onderneming spoedig daarna aan de in
      [artikel 3.63, vierde lid respectievelijk vijfde lid, van de wet][ref1], bedoelde voortzetter wordt overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '14'
    text: (GERESERVEERD)
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel14
  - number: '16.1'
    text: |-
      De openbaar-vervoerverklaring, bedoeld in [artikel 3.87, negende lid van de wet][ref1], is gedagtekend en bevat ten
      minste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 16.1.a
    text: naam en adres van de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel16
  - number: 16.1.b
    text: de route waarvoor de plaatsbewijzen geldig zijn;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel16
  - number: 16.1.c
    text: het tijdvak van geldigheid van de plaatsbewijzen.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel16
  - number: '16.2'
    text: |-
      De verklaring, bedoeld in [artikel 3.87, elfde lid, van de wet][ref1] (de reisverklaring) bevat ten minste de
      volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 16.2.a
    text: naam en adres van de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel16
  - number: 16.2.b
    text: naam en adres van de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel16
  - number: 16.2.c
    text: |-
      een door de inhoudingsplichtige ondertekende verklaring, die vermeldt het aantal dagen per week dat de
      belastingplichtige met het openbaar vervoer naar de plaats of plaatsen van werkzaamheden heeft gereisd.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel16
  - number: '16.3'
    text: |-
      Op verzoek van de inspecteur doet de belastingplichtige de reisverklaring, alsmede de plaatsbewijzen, aan hem
      toekomen.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel16
  - number: '17.1'
    text: |-
      Als uitkeringen welke niet tot de inkomsten in de vorm van bepaalde periodieke uitkeringen en verstrekkingen
      behoren, bedoeld in [artikel 3.104, onderdeel h, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 17.1.a
    text: |-
      uitkeringen ingevolge de [Huursubsidiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008659
  - number: 17.1.b
    text: |-
      uitkeringen ingevolge de [Wet bevordering eigenwoningbezit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011919
  - number: 17.1.c
    text: |-
      uitkeringen ingevolge de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012438
  - number: 17.1.d
    text: |-
      uitkeringen en verstrekkingen ingevolge de [Regeling opvang asielzoekers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005366
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005366
  - number: 17.1.e
    text: |-
      uitkeringen en verstrekkingen ingevolge de
      [Regelingen verstrekkingen asielzoekers en andere categorieën vreemdelingen 1997][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009205
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009205
  - number: 17.1.f
    text: |-
      uitkeringen en verstrekkingen ingevolge de Wet gemeentelijke zorg voor houders van een voorwaardelijke vergunning
      tot verblijf;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17
  - number: 17.1.g
    text: uitkeringen als bedoeld in artikel 5 van het Besluit taakverlichting alleenstaande werkenden/AAW;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17
  - number: 17.1.h
    text: |-
      inkomensondersteunende uitkeringen ingevolge [artikel 108, eerste lid, van de Gemeentewet][ref1], die overeenkomen
      met bijstand ter bestrijding van bepaalde noodzakelijke kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel108
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '108'
  - number: '17.2'
    text: |-
      Als uitkeringen tot bestrijding van onderhoudskosten van thuiswonende gehandicapte kinderen, bedoeld
      in [artikel 3.104, onderdeel i, van de wet][ref1], worden aangewezen: uitkeringen ingevolge de
      [Regeling tegemoetkoming onderhoudskosten thuiswonende gehandicapte kinderen 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010997
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0010997
  - number: 17a.1
    text: |-
      Voor de toepassing van [artikel 3.119a van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 17a.1.a
    text: |-
      wordt de eigenwoningreserve die is gevormd voor het ontstaan van een algehele huwelijksgemeenschap bij ontbinding
      van die gemeenschap op gezamenlijk verzoek van de belastingplichtige en zijn echtgenoot of gewezen echtgenoot
      verdeeld in de onderlinge verhouding waarin zij tot de gemeenschap gerechtigd zijn. Het verzoek wordt uiterlijk
      gedaan bij de aangifte over het jaar waarin de algehele huwelijksgemeenschap wordt ontbonden. Op dit verzoek kan
      niet worden teruggekomen;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17a
  - number: 17a.1.b
    text: |-
      wordt een woning zolang deze ten aanzien van de echtgenoot van de belastingplichtige als eigen woning wordt
      aangemerkt ten aanzien van de belastingplichtige mede als eigen woning aangemerkt indien de woning tot een
      huwelijksgemeenschap behoort of gaat behoren.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17a
  - number: 17a.2
    text: |-
      Indien in de overeenkomst ter zake van de verwerving van een eigen woning, ten behoeve van de uitvoering van het
      woonbeleid van het Rijk of een gemeente, een clausule is opgenomen op grond waarvan bij niet nakoming van die
      clausule een bedrag verschuldigd is, kan bij de vervreemding van die woning het bedrag dat terzake van het niet
      nakomen van de clausule is betaald in mindering worden gebracht op het vervreemdingssaldo eigen woning.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel17a
  - number: '18'
    text: (GERESERVEERD)
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel18
  - number: '22'
    text: |-
      De rittenregistratie als bedoeld in [artikel 3.145 van de wet][ref1] bevat ten minste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 22.a
    text: merk, type en kenteken van de auto;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel22
  - number: 22.b
    text: periode van terbeschikkingstelling van de auto;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel22
  - number: 22.c
    text: 'per rit:'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel22
  - number: 22.c.1°
    text: datum;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel22
  - number: 22.c.2°
    text: beginstand en eindstand van de kilometerteller;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel22
  - number: 22.c.3°
    text: beginadres en eindadres;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel22
  - number: 22.c.4°
    text: de gereden route indien deze afwijkt van de meest gebruikelijke;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel22
  - number: 22.c.5°
    text: het karakter van de rit.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel22
  - number: '23.1'
    text: |-
      Een voorlopige verliesverrekening als bedoeld in [artikel 3.152, vijfde lid, van de wet][ref1] kan worden verleend
      indien het verlies over een kalenderjaar wordt aangegeven door de in de uitnodiging tot het doen van aangifte
      gevraagde gegevens en bescheiden en andere gegevensdragers of de inhoud daarvan duidelijk, stellig en zonder
      voorbehoud in te vullen en te ondertekenen en de gevraagde bescheiden of andere gegevensdragers in te leveren of
      toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '23.2'
    text: |-
      Een voorlopige verliesverrekening wordt niet eerder verleend dan zes maanden na de kalendermaand waarin de aangifte
      is gedaan.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel23
  - number: '23.3'
    text: |-
      Bij de berekening van de voorlopige verliesverrekening wordt het vermoedelijke verlies voor 80 percent in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel23
  - number: '24'
    text: |-
      Bij het in [artikel 3.154, eerste lid, van de wet][ref1] bedoelde verzoek om middeling wordt een berekening gevoegd
      van de middelingsteruggaaf.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '25'
    text: |-
      Ten aanzien van de belastingplichtige die geen andere aandelen in een vennootschap houdt
      dan die welke hij heeft verkregen in het kader van een spaarloonregeling als bedoeld in
      [artikel 32 van de Wet op de loonbelasting 1964][ref1], worden die aandelen voor de toepassing van
      [artikel 4.7 van de wet][ref2] aangemerkt als aandelen van dezelfde soort als die waarin het grootste gedeelte van
      het geplaatste kapitaal van de vennootschap is uitgedrukt.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '26'
    text: |-
      De ingevolge [artikel 4.14, achtste lid, onderdeel a, van de wet][ref1] aan te wijzen effectenbeurzen zijn de
      effectenbeurzen in de lidstaten van de Europese Gemeenschappen, alsmede de effectenbeurzen te Zürich, New York
      en Tokio.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '27.1'
    text: |-
      Een voorlopige verliesverrekening als bedoeld in [artikel 4.51, vijfde lid, van de wet][ref1] kan worden verleend
      indien het verlies over een kalenderjaar wordt aangegeven door de in de uitnodiging tot het doen van aangifte
      gevraagde gegevens en bescheiden en andere gegevensdragers of de inhoud daarvan duidelijk, stellig en zonder
      voorbehoud in te vullen en te ondertekenen en de gevraagde bescheiden of andere gegevensdragers in te leveren of
      toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '27.2'
    text: |-
      Een voorlopige verliesverrekening wordt niet eerder verleend dan zes maanden na de kalendermaand waarin de aangifte
      is gedaan.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel27
  - number: '27.3'
    text: |-
      Bij de berekening van de voorlopige verliesverrekening wordt het vermoedelijke verlies voor 80 percent in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel27
  - number: '28.1'
    text: |-
      Als kredietinstelling als bedoeld in [artikel 5.14, tweede lid, van de wet ][ref1]wordt
      aangewezen de kredietinstelling die is ingeschreven in het register, bedoeld in
      [artikel 52 van de Wet toezicht kredietwezen 1992 ][ref2]die op verzoek van de instelling door de inspecteur, onder
      door hem te stellen voorwaarden, als zodanig is aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
  - number: '28.2'
    text: |-
      Als beleggingsinstelling als bedoeld in [artikel 5.14, tweede lid, van de wet ][ref1]wordt
      aangewezen de beleggingsinstelling die is ingeschreven in het register, bedoeld in
      [artikel 18 van de Wet toezicht beleggingsinstellingen][ref2] die op verzoek van de instelling door de inspecteur,
      onder door hem te stellen voorwaarden, als zodanig is aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel18
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '18'
  - number: '28.3'
    text: |-
      Een bestaande kredietinstelling of beleggingsinstelling kan slechts worden aangewezen indien op het tijdstip van
      inwerkingtreding van de aanwijzing in de kredietinstelling onderscheidenlijk de beleggingsinstelling geen zuivere
      winst aanwezig is.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel28
  - number: '28.4'
    text: |-
      Indien de aangewezen kredietinstelling of beleggingsinstelling niet langer voldoet aan de omschrijving, bedoeld
      in [artikel 5.14, tweede lid, van de wet][ref1], of aan de in het eerste lid onderscheidenlijk tweede lid bedoelde
      voorwaarden, doet de kredietinstelling onderscheidenlijk de beleggingsinstelling daarvan onverwijld schriftelijk
      mededeling aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '28.5'
    text: |-
      De aanwijzing wordt door de inspecteur ingetrokken indien de kredietinstelling of beleggingsinstelling daarom
      verzoekt dan wel indien de kredietinstelling of beleggingsinstelling niet langer voldoet aan de omschrijving,
      bedoeld in [artikel 5.14, tweede lid, van de wet][ref1], of aan de in het eerste lid onderscheidenlijk tweede lid
      bedoelde voorwaarden. Indien de kredietinstelling of beleggingsinstelling de in het vierde lid bedoelde mededeling
      onverwijld heeft gedaan en aannemelijk maakt dat het niet voldoen aan de omschrijving of de voorwaarden van
      tijdelijke aard is, een incidenteel karakter heeft en niet in strijd is met doel en strekking van de regeling ziet
      de inspecteur af van intrekking van de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '28.6'
    text: |-
      De aanwijzing, de intrekking van de aanwijzing alsmede de afwijzing van een verzoek om aanwijzing geschieden bij
      voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel28
  - number: '28.7'
    text: |-
      De inspecteur bepaalt in de beschikking het tijdstip waarop de aanwijzing of de intrekking in werking treedt, welk
      tijdstip kan zijn gelegen voor de datum van dagtekening van de beschikking.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel28
  - number: '29.1'
    text: |-
      Als kredietinstelling als bedoeld in [artikel 5.15, tweede lid, van de wet ][ref1]wordt
      aangewezen de kredietinstelling die is ingeschreven in het register, bedoeld in
      [artikel 52 van de Wet toezicht kredietwezen 1992][ref2] die op verzoek van de instelling door de inspecteur, onder
      door hem te stellen voorwaarden, als zodanig is aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
  - number: '29.2'
    text: |-
      Als beleggingsinstelling als bedoeld in [artikel 5.15, tweede lid, van de wet][ref1]
      wordt aangewezen de beleggingsinstelling die is ingeschreven in het register, bedoeld in
      [artikel 18 van de Wet toezicht beleggingsinstellingen][ref2] die op verzoek van de instelling door de inspecteur,
      onder door hem te stellen voorwaarden, als zodanig is aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel18
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '18'
  - number: '29.3'
    text: |-
      Een bestaande kredietinstelling of beleggingsinstelling kan slechts worden aangewezen indien op het tijdstip van
      inwerkingtreding van de aanwijzing in de kredietinstelling onderscheidenlijk de beleggingsinstelling geen zuivere
      winst aanwezig is.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel29
  - number: '29.4'
    text: |-
      Indien de aangewezen kredietinstelling of beleggingsinstelling niet langer voldoet aan de omschrijving, bedoeld
      in [artikel 5.15, tweede lid, van de wet][ref1], of aan de in het eerste lid onderscheidenlijk tweede lid bedoelde
      voorwaarden, doet de kredietinstelling onderscheidenlijk de beleggingsinstelling daarvan onverwijld schriftelijk
      mededeling aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '29.5'
    text: |-
      De aanwijzing wordt door de inspecteur ingetrokken indien de kredietinstelling of beleggingsinstelling daarom
      verzoekt dan wel indien de kredietinstelling of beleggingsinstelling niet langer voldoet aan de omschrijving,
      bedoeld in [artikel 5.15, tweede lid, van de wet][ref1], of aan de in het eerste lid onderscheidenlijk tweede lid
      bedoelde voorwaarden. Indien de kredietinstelling of beleggingsinstelling de in het vierde lid bedoelde mededeling
      onverwijld heeft gedaan en aannemelijk maakt dat het niet voldoen aan de omschrijving of de voorwaarden van
      tijdelijke aard is, een incidenteel karakter heeft en niet in strijd is met doel en strekking van de regeling ziet
      de inspecteur af van intrekking van de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '29.6'
    text: |-
      De aanwijzing, de intrekking van de aanwijzing alsmede de afwijzing van een verzoek om aanwijzing geschieden bij
      voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel29
  - number: '29.7'
    text: |-
      De inspecteur bepaalt in de beschikking het tijdstip waarop de aanwijzing of de intrekking in werking treedt, welk
      tijdstip kan zijn gelegen voor de datum van dagtekening van de beschikking.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel29
  - number: '30'
    text: |-
      Met betrekking tot een kalenderjaar wordt als beginnende ondernemer als bedoeld in
      [artikel 5.17, derde lid, onderdeel a, van de wet][ref1] aangemerkt de natuurlijke persoon die naar verwachting
      met betrekking tot dat jaar of het daaropvolgende jaar in aanmerking komt voor zelfstandigenaftrek en ten aanzien
      van wie deze aftrek over nog niet meer dan zeven jaren is toegepast, dan wel, ingeval hij in het kalenderjaar een
      onderneming of een gedeelte van een onderneming overneemt, over nog niet meer dan veertien jaren is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '31'
    text: |-
      De beginnende ondernemer als bedoeld in [artikel 5.17, derde lid, onderdeel b, van de wet][ref1], is een
      rechtspersoon die ten tijde van het verstrekken van de achtergestelde lening aan hem, onderscheidenlijk het nemen
      van een deelneming in hem moet voldoen aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 31.a
    text: |-
      de rechtspersoon is een besloten vennootschap met beperkte aansprakelijkheid die niet langer dan acht jaren geleden
      tot stand is gekomen;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel31
  - number: 31.b
    text: |-
      voor rekening van de rechtspersoon wordt in Nederland een onderneming gedreven van een zodanige omvang dat de bij
      hem in dienst zijnde personen te zamen naar verwachting daaraan jaarlijks ten minste 1225 uren besteden;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel31
  - number: 31.c
    text: |-
      de voor rekening van de rechtspersoon gedreven onderneming is geen voortzetting van een onderneming die, of een
      gedeelte van een onderneming, dat meer dan acht jaren geleden direct of indirect is gedreven voor rekening van een
      persoon die thans onmiddellijk of middellijk aandeelhouder is in de rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel31
  - number: 31.d
    text: |-
      de rechtspersoon voldoet aan ten minste twee van de in
      [artikel 396, eerste lid, onderdelen a, b, en c, van Boek 2 van het Burgerlijk Wetboek][ref1] vermelde vereisten;


      [ref1]: https://wetten.overheid.nl/BWBR0003045
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0003045
  - number: 31.e
    text: |-
      de feitelijke werkzaamheid van de rechtspersoon bestaat niet in het, onmiddellijk of middellijk, beleggen van
      vermogen of daarmee overeenkomende werkzaamheid.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel31
  - number: '32'
    text: |-
      Onder een geregistreerde, achtergestelde geldlening als bedoeld in
      [artikel 5.17, eerste lid juncto artikel 5.17 vierde lid, van de wet][ref1] wordt verstaan een geldlening:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 32.a
    text: |-
      met een hoofdsom van ten minste € 2269 ter zake waarvan een rente wordt vergoed welke niet uitgaat boven de
      wettelijke rente, bedoeld in [artikel 120, eerste lid, van Boek 6 van het Burgerlijk Wetboek;][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel120
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '120'
  - number: 32.b
    text: 'ter zake waarvan in de overeenkomst is vermeld:'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
  - number: 32.b.1°
    text: |-
      indien de beginnende ondernemer een natuurlijk persoon is: het sociaal-fiscaal nummer van de beginnende ondernemer
      en het sociaal-fiscaal nummer van degene die de geldlening verstrekt;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
  - number: 32.b.2°
    text: |-
      indien de beginnende ondernemer een rechtspersoon is als bedoeld in
      [artikel 5.17, derde lid, onderdeel b, van de wet][ref1]: het omzetbelastingnummer van de beginnende ondernemer en
      het sociaal-fiscaal nummer van degene die de geldlening verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 32.c
    text: 'ter zake waarvan in de overeenkomst is opgenomen dat:'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
  - number: 32.c.1°
    text: |-
      de lening jegens andere schuldeisers, gedurende ten minste de eerste acht jaren
      na het overeenkomen van de geldlening, een lagere rang inneemt dan is bepaald in
      [artikel 277, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005291
  - number: 32.c.2°
    text: |-
      indien de beginnende ondernemer een natuurlijk persoon is, de lening dient ter financiering van bestanddelen
      die behoren tot het verplichte ondernemingsvermogen van de beginnende ondernemer, dan wel, indien de beginnende
      ondernemer een rechtspersoon is, de lening dient ter financiering van bestanddelen die tot het verplichte
      ondernemingsvermogen zouden behoren zo de onderneming van de rechtspersoon voor rekening van een natuurlijk persoon
      zou worden gedreven;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
  - number: 32.c.3°
    text: de lening door degene die de geldlening verstrekt niet is gefinancierd met geleend geld, en
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
  - number: 32.c.4°
    text: |-
      de lening is verstrekt met het oog op het bepaalde in de[ artikelen 6.8][ref1] en [5.17, van de wet][ref2], waarvan
      melding wordt gemaakt in het opschrift van de overeenkomst;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 32.d
    text: |-
      waarvan de overeenkomst daartoe is ondertekend door de beginnende ondernemer en degene die de geldlening verstrekt,
      en
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
  - number: 32.e
    text: |-
      welke binnen vier weken na het overeenkomen daarvan is geregistreerd op de voet van de [Registratiewet 1970][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002739
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002739
  - number: '33.1'
    text: |-
      Als participatiemaatschapij als bedoeld in [artikel 5.18, eerste lid, van de wet ][ref1]wordt aangewezen de
      rechtspersoon die op zijn verzoek door de inspecteur, onder door deze te stellen voorwaarden, als zodanig is
      aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '33.2'
    text: |-
      Het in een participatiemaatschappij gestorte kapitaal en het door die maatschappij aangetrokken vreemd vermogen
      dienen te zamen ten minste € 4.537.802 te bedragen.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
  - number: '33.3'
    text: |-
      De door een participatiemaatschappij verstrekte, achtergestelde geldlening, bedoeld in
      [artikel 5.18, tweede lid, onderdeel a, van de wet][ref1] en de door haar gehouden deelneming bedoeld
      in het tweede lid, onderdeel a, van dat artikel bedragen te zamen ten hoogste € 226.890 per beginnende
      ondernemer. De in de eerste volzin bedoelde leningen en deelnemingen kunnen voor geen langere periode dan
      voor de duur van acht jaren, te rekenen vanaf het tijdstip van verstrekking van de lening, onderscheidenlijk
      de verwerving van de deelneming, worden aangemerkt als achtergestelde geldlening als bedoeld in
      [artikel 5.18, tweede lid, onderdeel a, van de wet][ref2], onderscheidenlijk als deelneming als bedoeld in
      [artikel 5.18, tweede lid, onderdeel a, van de wet.][ref3]


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '33.4'
    text: |-
      Als een achtergestelde geldlening als bedoeld in [artikel 5.18, tweede lid, onderdeel a, van de wet][ref1] wordt
      aangemerkt de geldlening ter zake waarvan in de overeenkomst is opgenomen dat de lening jegens andere schuldeisers,
      gedurende ten minste de eerste acht jaren na het overeenkomen van de geldlening, een lagere rang inneemt dan is
      bepaald in [artikel 277, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2], en die, in geval de beginnende
      ondernemer een natuurlijk persoon is, dient ter financiering van bestanddelen die bij de beginnende ondernemer
      behoren tot het verplichte ondernemingsvermogen van die onderneming en, in geval de beginnende ondernemer
      een rechtspersoon is, bij de rechtspersoon dient ter financiering van bestanddelen die tot het verplichte
      ondernemingsvermogen zouden behoren zo de onderneming van de rechtspersoon voor rekening van een natuurlijk persoon
      zou worden gedreven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel277
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '277'
  - number: '33.5'
    text: |-
      Als een achtergestelde geldlening als bedoeld in [artikel 5.18, tweede lid, onderdeel a, van de wet][ref1]
      wordt niet aangemerkt de geldlening die na 31 december 1995 wordt verstrekt aan een natuurlijke persoon of een
      rechtspersoon die voor 1 januari 1996 voor zijn rekening reeds een onderneming dreef, tenzij de inspecteur op
      verzoek bij voor bezwaar vatbare beschikking heeft verklaard dat de beginnende ondernemer heeft doen blijken dat de
      geldlening niet kan worden beschouwd als vervanging van een voor 1 januari 1996 verstrekte geldlening.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '33.6'
    text: |-
      Als een deelneming als bedoeld in [artikel 5.18, tweede lid, onderdeel a, van de wet][ref1] wordt aangemerkt de
      deelneming waarbij het in de rechtspersoon te storten kapitaal dient ter financiering van bestanddelen die tot
      het verplichte ondernemingsvermogen zouden behoren zo de onderneming van de rechtspersoon voor rekening van een
      natuurlijk persoon zou worden gedreven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '33.7'
    text: |-
      Een bestaande rechtspersoon kan slechts als participatiemaatschappij worden aangewezen indien op het tijdstip van
      inwerkingtreding van de aanwijzing:
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
  - number: 33.7.a
    text: in de rechtspersoon geen zuivere winst aanwezig is;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
  - number: 33.7.b
    text: de rechtspersoon geen schulden heeft jegens natuurlijke personen;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
  - number: 33.7.c
    text: |-
      door de rechtspersoon geen geldleningen zijn verstrekt aan beginnende ondernemers, als bedoeld in
      [artikel 5.17, derde lid, van de wet;][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 33.7.d
    text: |-
      door de rechtspersoon geen deelnemingen worden gehouden, als bedoeld in
      [artikel 5.18, tweede lid, onderdeel a, van de wet.][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '33.8'
    text: |-
      Indien de aangewezen participatiemaatschappij niet langer voldoet aan de omschrijving in
      [artikel 5.18 van de wet][ref1] , of aan de in het eerste tot en met vijfde lid bedoelde voorwaarden, doet de
      participatiemaatschappij daarvan onverwijld schriftelijk mededeling aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '33.9'
    text: |-
      De aanwijzing wordt door de inspecteur ingetrokken indien de participatiemaatschappij daarom verzoekt dan wel
      indien de participatiemaatschappij niet langer voldoet aan de omschrijving in [artikel 5.18 van de wet][ref1] ,
      of aan de in het eerste tot en met vijfde lid bedoelde voorwaarden. Indien de participatiemaatschappij de in
      het zevende lid bedoelde mededeling onverwijld heeft gedaan en aannemelijk maakt dat het niet voldoen aan de
      omschrijving of de voorwaarden van tijdelijke aard is, een incidenteel karakter heeft en niet in strijd is met doel
      en strekking van de regeling, ziet de inspecteur af van intrekking van de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '33.10'
    text: |-
      De aanwijzing, de intrekking van de aanwijzing alsmede de afwijzing van een verzoek om aanwijzing geschieden bij
      voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
  - number: '33.11'
    text: |-
      De inspecteur bepaalt in de beschikking het tijdstip waarop de aanwijzing of de intrekking in werking treedt, welk
      tijdstip kan zijn gelegen voor de datum van dagtekening van de beschikking.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33
  - number: 33a.1
    text: |-
      Als kredietinstelling als bedoeld in [artikel 5.18a, tweede lid, van de wet][ref1]
      wordt aangewezen de kredietinstelling die is ingeschreven in het register, bedoeld in
      [artikel 52 van de Wet toezicht kredietwezen 1992][ref2], en op verzoek van de instelling door de inspecteur, onder
      door hem te stellen voorwaarden, als zodanig is aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
  - number: 33a.2
    text: |-
      Als beleggingsinstelling als bedoeld in [artikel 5.18a, tweede lid, van de wet][ref1]
      wordt aangewezen de beleggingsinstelling die is ingeschreven in het register, bedoeld in
      [artikel 18 van de Wet toezicht beleggingsinstellingen][ref2], en op verzoek van de instelling door de inspecteur,
      onder door hem te stellen voorwaarden, als zodanig is aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel18
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004809
        artikel: '18'
  - number: 33a.3
    text: |-
      Een bestaande kredietinstelling of beleggingsinstelling kan slechts worden aangewezen indien op het tijdstip van
      inwerkingtreding van de aanwijzing in de kredietinstelling onderscheidenlijk beleggingsinstelling geen zuivere
      winst aanwezig is.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33a
  - number: 33a.4
    text: |-
      Indien de aangewezen kredietinstelling of beleggingsinstelling niet langer voldoet aan de omschrijving, bedoeld in
      [artikel 5.18a, tweede lid, van de wet][ref1], of aan de in het eerste lid onderscheidenlijk tweede lid bedoelde
      voorwaarden, doet de kredietinstelling onderscheidenlijk de beleggingsinstelling daarvan onverwijld schriftelijk
      mededeling aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 33a.5
    text: |-
      De aanwijzing wordt door de inspecteur ingetrokken indien de kredietinstelling of beleggingsinstelling daarom
      verzoekt dan wel indien de kredietinstelling of beleggingsinstelling niet langer voldoet aan de omschrijving,
      bedoeld in [artikel 5.18a, tweede lid, van de wet][ref1] of aan de in het eerste lid onderscheidenlijk tweede lid
      bedoelde voorwaarden. Indien de kredietinstelling of beleggingsinstelling de in het vierde lid bedoelde mededeling
      onverwijld heeft gedaan en aannemelijk maakt dat het niet voldoen aan de omschrijving of de voorwaarden van
      tijdelijke aard is, een incidenteel karakter heeft en niet in strijd is met doel en strekking van de regeling ziet
      de inspecteur af van intrekking van de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 33a.6
    text: |-
      De aanwijzing, de intrekking van de aanwijzing alsmede de afwijzing van een verzoek om aanwijzing geschieden bij
      voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33a
  - number: 33a.7
    text: |-
      De inspecteur bepaalt in de beschikking het tijdstip waarop de aanwijzing of de intrekking in werking treedt, welk
      tijdstip kan zijn gelegen voor de datum van dagtekening van de beschikking.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33a
  - number: 33b
    text: |-
      Als prijscourant als bedoeld in [artikel 5.21 van de wet][ref1] wordt aangewezen de Officiële Prijscourant
      uitgegeven door Euronext Amsterdam N.V.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '34'
    text: |-
      Ingeval een beginnende ondernemer binnen de eerste acht jaren na het verstrekken van een geregistreerde,
      achtergestelde geldlening in staat van faillissement is verklaard of ingeval aan hem binnen die periode
      surséance van betaling is verleend, kan op verzoek van degene die de lening heeft verstrekt door de inspecteur
      bij voor bezwaar vatbare beschikking met betrekking tot die lening de periode van acht jaren, bedoeld in
      [artikel 6.8, tweede lid, van de wet][ref1], worden verlengd tot twaalf weken na beëindiging van bedoeld
      faillissement, onderscheidenlijk tot twaalf weken na beëindiging van de surséance van betaling dan wel, indien de
      beginnende ondernemer na beëindiging van de surséance van betaling in staat van faillissement is verklaard, tot
      twaalf weken na beëindiging van dat faillissement.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: '35.1'
    text: |-
      [Artikel 6.14, eerste lid, onderdeel a, van de wet][ref1] geldt niet voor:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 35.1.a
    text: |-
      de belastingplichtige aan wie wegens gemoedsbezwaren tegen één of meer volksverzekeringen
      door de Sociale verzekeringsbank een ontheffing is verleend als bedoeld in
      [artikel 19 van de Wet financiering volksverzekeringen][ref1] , ingeval noch hij, noch zijn echtgenoot het recht op
      kinderbijslag ingevolge de [Algemene Kinderbijslagwet][ref2] geldend maakt;


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002368
  - number: 35.1.b
    text: |-
      de belastingplichtige die op grond van de regelen ter voorkoming van samenloop van kinderbijslag ingevolge de
      [Kinderbijslagwet][ref1] zijn recht op kinderbijslag voor dat kind niet geldend kan maken en geen huishouden vormt
      met degene die het recht op kinderbijslag voor dat kind wel geldend kan maken.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '35.2'
    text: 'Voor de toepassing van het eerste lid, onderdeel b, geldt dat:'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel35
  - number: 35.2.a
    text: |-
      de in [artikel 5a van het Samenloopbesluit kinderbijslag][ref1] bedoelde persoon wiens recht op kinderbijslag niet
      wordt uitbetaald, zijn recht op kinderbijslag niet geldend maakt, en


      [ref1]: https://wetten.overheid.nl/BWBR0005361#Artikel5a
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005361
        artikel: 5a
  - number: 35.2.b
    text: |-
      de in [artikel 5a van het Samenloopbesluit kinderbijslag][ref1] bedoelde persoon wiens recht op kinderbijslag aan
      hem geheel of gedeeltelijk wordt uitbetaald, zijn recht op kinderbijslag geheel geldend maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005361#Artikel5a
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0005361
        artikel: 5a
  - number: '35.3'
    text: |-
      Het eerste lid, onderdeel b, is van overeenkomstige toepassing indien de belastingplichtige recht heeft op
      een tegemoetkoming volgens een naar aard en strekking met de [Algemene Kinderbijslagwet][ref1] overeenkomende
      buitenlandse regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: '36.1'
    text: |-
      De in [artikel 6.15 van de wet][ref1] bedoelde uitgaven voor levensonderhoud van een kind worden, indien de kosten
      van dat onderhoud in belangrijke mate op de belastingplichtige drukken, in aanmerking genomen tot een bedrag van:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 36.1.a
    text: € 270 per kalenderkwartaal indien het kind jonger dan 6 jaar is;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel36
  - number: 36.1.b
    text: € 330 per kalenderkwartaal indien het kind 6 jaar of ouder doch jonger dan 12 jaar is;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel36
  - number: 36.1.c
    text: € 399 per kalenderkwartaal indien het kind 12 jaar of ouder doch jonger dan 18 jaar is;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel36
  - number: 36.1.d
    text: € 330 per kalenderkwartaal indien het kind 18 jaar of ouder is.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel36
  - number: '36.2'
    text: 'Het in het eerste lid, onderdeel d, vermelde bedrag wordt verhoogd tot:'
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel36
  - number: 36.2.a
    text: |-
      € 660, indien de op de ouder drukkende bijdrage in de kosten van het onderhoud van het kind ten minste € 660 per
      kwartaal belopen en de kosten van het onderhoud van het kind tevens grotendeels op de belastingplichtige drukken;
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel36
  - number: 36.2.b
    text: |-
      € 990, indien het kind niet tot het huishouden van de belastingplichtige behoort, de op de ouder drukkende bijdrage
      in de kosten van het onderhoud van het kind ten minste € 990 per kwartaal belopen en de kosten van het onderhoud
      van het kind tevens geheel of nagenoeg geheel op de belastingplichtige drukken.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel36
  - number: '36.3'
    text: |-
      Indien zowel de belastingplichtige als zijn partner uitgaven voor levensonderhoud van kinderen in aanmerking nemen,
      worden de in aanmerking te nemen bedragen gesteld op de helft van de bedragen vermeld in het eerste en tweede lid,
      zonodig naar boven af te ronden op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel36
  - number: '36.4'
    text: Voor de toepassing van de vorige leden is beslissend de toestand bij het begin van het kalenderkwartaal.
    url: https://wetten.overheid.nl/BWBR0012031/2005-06-25#Artikel36
  - number: '37.1'
