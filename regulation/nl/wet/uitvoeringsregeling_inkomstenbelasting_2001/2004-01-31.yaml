                    koemelkeiwitvrij in combinatie met kippenei-eiwitvrij en soja-eiwitvrij


                    € 1253






                    koemelkeiwitvrij in combinatie met kippeneieiwitvrij, soja-eiwit en tarwevrij


                    € 1670






                    koemelkeiwitvrij in combinatie met glutenvrij


                    € 1250





                    brandwonden


                    energieverrijkt in combinatie met eiwitverrijkt


                    € 1142




           Voor overige diëten worden de extra uitgaven gesteld op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: '37.2'
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.a
    text: 'referentievoeding: de voeding conform het voedingspatroon van de Nederlandse bevolking;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.b
    text: 'eiwitverrijkt: een voorgeschreven hoeveelheid eiwit van ten minste 120% ten opzichte van de referentievoeding;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.c
    text: 'energieverrijkt: een voorgeschreven energiebehoefte van ten minste 125% ten opzichte van de referentievoeding;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.d
    text: 'lactosebeperkt: een voorgeschreven lactosebeperking tot 5 gram per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.e
    text: 'matig vetbeperkt: een voorgeschreven hoeveelheid vet die voorziet in niet meer dan 30% van de hoeveelheid energie;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.f
    text: 'MCT of ander preparaat: een voorgeschreven hoeveelheid MCT of vergelijkbaar preparaat van 50 gram per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.g
    text: 'vloeibaar: voeding in de vorm van vloeistoffen die door een sonde kunnen worden toegediend;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.h
    text: |-
      polysacharidenverrijkt: een voorgeschreven hoeveelheid polysachariden die voorziet in ten minste 60 procent van de
      hoeveelheid energie;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.i
    text: 'fructosebeperkt: een voorgeschreven fructosebeperking tot 10 gram per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.j
    text: 'sterk fructosebeperkt: een voorgeschreven fructosebeperking tot 5 gram per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.k
    text: |-
      meervoudig onverzadigde-vetzurenverrijkt: een voorgeschreven verhouding tussen de hoeveelheid verzadigde vetzuren
      en de hoeveelheid meervoudig onverzadigde vetzuren van een staat tot twee;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.l
    text: 'natriumbeperkt: een voorgeschreven beperking tot 1500 milligram natrium per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.m
    text: |-
      sterk vetbeperkt: een voorgeschreven hoeveelheid vet die voorziet in niet meer dan 15 procent van de hoeveelheid
      energie;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.n
    text: 'sterk natriumbeperkt: een voorgeschreven beperking tot 1000 milligram natrium per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.o
    text: |-
      verzadigd-vetbeperkt: een voorgeschreven hoeveelheid verzadigd vet die voorziet in niet meer dan 10% van de
      hoeveelheid energie;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.p
    text: 'cholesterolbeperkt: een voorschreven beperking tot 300 milligram cholesterol per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.q
    text: 'natuurlijk-eiwitbeperkt: een voorgeschreven beperking tot 11 gram natuurlijk eiwit per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.r
    text: 'eiwitaangewezen: een voorgeschreven hoeveelheid eiwit van 1,2 gram per kilogram ideaal lichaamsgewicht per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.s
    text: 'visverrijkt: een voorgeschreven gebruik van vis van ten minste twee maal per week;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.t
    text: 'groentenverrijkt: een voorgeschreven hoeveelheid groenten van ten minste 200 gram per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.u
    text: 'fruitverrijkt: een voorgeschreven hoeveelheid fruit van ten minste 200 gram per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: 37.2.v
    text: |-
      fyto/plantensterolen: een voorgeschreven hoeveelheid plantaardige stanolen van ten minste 36 gram per etmaal of van
      plantaardige sterolen van ten minste 25 gram per etmaal.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: '37.3'
    text: |-
      Voor de toepassing van het eerste lid geldt voor een dieet waarvoor meer dan één bedrag in aanmerking zou komen,
      alleen het hoogste van de voor het van toepassing zijnde ziektebeeld geldende bedragen.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: '37.4'
    text: |-
      Ingeval extra uitgaven voor een op medisch voorschrift gehouden dieet niet gedurende het gehele kalenderjaar worden
      gedaan, worden de in het eerste lid genoemde bedragen naar tijdsgelang in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel37
  - number: '38.1'
    text: |-
      Extra uitgaven voor kleding en beddengoed worden tot een bedrag van € 320 dan wel, indien blijkt dat die uitgaven €
      640 te boven gaan, tot een bedrag van € 800 aangemerkt als uitgaven ter zake van ziekte en invaliditeit indien:
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel38
  - number: 38.1.a
    text: |-
      uit ziekte of invaliditeit van een persoon als bedoeld in [artikel 6.16, onderdelen a en g, van de wet][ref1] extra
      uitgaven voor kleding en beddengoed voortvloeien;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 38.1.b
    text: de ziekte of invaliditeit ten minste een jaar heeft geduurd of vermoedelijk zal duren; en
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel38
  - number: 38.1.c
    text: de zieke of invalide tot het huishouden van de belastingplichtige behoort.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel38
  - number: '38.2'
    text: |-
      Ingeval aan de in het eerste lid gestelde voorwaarden niet gedurende het gehele kalenderjaar is voldaan, wordt dat
      lid naar tijdsgelang toegepast.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel38
  - number: '39.1'
    text: |-
      Als uitgaven wegens adoptie van een kind dat in een ander land woonde dan de adoptanten voordat het kind
      door de adoptanten feitelijk werd verzorgd en opgevoed, worden in aanvulling op de uitgaven bedoeld in
      [artikel 6.23, eerste lid, van de wet][ref1] uitsluitend aangemerkt de uitgaven:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 39.1.a
    text: |-
      voor de algemene voorlichting, bedoeld in
      [artikel 5, tweede lid, van de Wet opneming buitenlandse kinderen ter adoptie][ref1] dan wel daarmee overeenkomende
      uitgaven indien laatstgenoemde wet op deze adoptie niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '5'
  - number: 39.1.b
    text: |-
      voor bemiddeling als bedoeld in [artikel 1van de Wet opneming buitenlandse kinderen ter adoptie][ref1] tot een
      bedrag van ten hoogste € 681 dan wel daarmee overeenkomende uitgaven tot ten hoogste het eerder genoemde bedrag
      indien laatstgenoemde wet op deze adoptie niet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel1
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '1'
  - number: 39.1.c
    text: |-
      verband houdende met de indiening en de behandeling van een verzoek tot het uitspreken van adoptie volgens het
      recht van het land van herkomst van het kind;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel39
  - number: 39.1.d
    text: |-
      voor vervoer en begeleiding van het kind naar de woning of verblijfplaats van de adoptanten, met dien verstande dat
      als reis- en verblijfkosten van de adoptanten in totaal niet meer dan de reis- en verblijfkosten met betrekking tot
      een heen- en terugreis per persoon in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel39
  - number: '39.2'
    text: |-
      De in het eerste lid bedoelde reis- en verblijfkosten worden niet eerder in aanmerking genomen dan nadat het ter
      zake van de adoptie bevoegde gezag de beginseltoestemming of toestemming heeft verleend tot het opnemen van het
      kind in het gezin dan wel, zo deze beginseltoestemming of toestemming ontbreekt, nadat de uitspraak van de rechter
      waarbij het verzoek om adoptie is toegewezen, kracht van gewijsde heeft gekregen.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel39
  - number: '39.3'
    text: |-
      Indien de adoptanten partner zijn en beiden uitgaven voor bemiddeling ter adoptie van een kind als bedoeld in het
      eerste lid, onderdeel b, in aanmerking nemen, wordt het door hen beiden tezamen voor die uitgaven in aanmerking te
      nemen bedrag gesteld op ten hoogste het in het eerste lid, onderdeel b, vermelde bedrag.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel39
  - number: '40.1'
    text: |-
      De ingevolge [artikel 6.26 van de wet][ref1] bedoelde weekenduitgaven voor gehandicapte kinderen worden gesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 40.1.a
    text: € 9 per dag van verzorging van het kind door de belastingplichtige, alsmede
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel40
  - number: 40.1.b
    text: |-
      het in [artikel 6.18, zesde lid, onderdeel a, van de wet][ref1] genoemde bedrag per kilometer voor het vervoer per
      auto van het kind door de belastingplichtige over de reisafstand tussen de plaats waar het kind doorgaans verblijft
      en de plaats waar de belastingplichtige doorgaans verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: '40.2'
    text: |-
      Indien zowel de belastingplichtige als zijn partner weekenduitgaven voor een gehandicapt kind in aanmerking
      nemen, wordt het voor dat kind in aanmerking te nemen bedrag gesteld op de helft van het volgens het eerste lid,
      onderdelen a en b, berekende bedrag, zonodig naar boven af te ronden op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel40
  - number: '41.1'
    text: De afschrijving op een eigen monumentenwoning wordt gesteld op 15 percent van het bruto eigenwoningforfait.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel41
  - number: '41.2'
    text: |-
      Het bruto eigenwoningforfait wordt berekend door de som van het voor de monumentenwoning
      geldende forfaitpercentage, bedoeld in [artikel 3.112, eerste lid, van de wet][ref1] en het in
      [artikel 6.31, eerste lid, onderdeel a, van de wet][ref2] vermelde percentage, te vermenigvuldigen met
      de eigenwoningwaarde van de monumentenwoning, met dien verstande dat hierbij als eigenwoningwaarde van de
      monumentenwoning ten hoogste € 1 000 000 in aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '6'
  - number: '41.3'
    text: |-
      In afwijking van het eerste lid wordt voor monumentenwoningen waarvan het bruto eigenwoningforfait in aanmerkelijke
      mate de invloed ondergaat van ongebouwde en gebouwde aanhorigheden de afschrijving beperkt tot 15 percent van het
      aan het monumentale gedeelte van de monumentenwoning toe te rekenen deel van het bruto eigenwoningforfait.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel41
  - number: '42'
    text: (GERESERVEERD)
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel42
  - number: '43'
    text: (GERESERVEERD)
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel43
  - number: '44'
    text: (GERESERVEERD)
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel44
  - number: 44a
    text: |-
      Aan het in [artikel 8.14, eerste lid, onderdeel b, onder 2°, van de wet][ref1] opgenomen vereiste behoeft niet
      te worden voldaan gedurende de periode van het kalenderjaar dat het kind, bedoeld in het eerste lid, onderdeel
      b, van dat artikel, tegelijkertijd tot het huishouden van beide ouders heeft behoord en het kind op hetzelfde
      woonadres als een van die ouders staat ingeschreven in de basisadministratie persoonsgegevens. Voor de toepassing
      van de eerste volzin behoort het kind tegelijkertijd tot het huishouden van beide ouders indien het kind doorgaans
      tenminste drie gehele dagen per week tot het huishouden van de belastingplichtige en voor de overige tijd doorgaans
      tot het huishouden van de andere ouder behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
  - number: '45.1'
    text: |-
      De aangifte, bedoeld in [artikel 9.4, eerste lid, onderdeel c, van de wet][ref1], wordt gedaan binnen drie jaren na
      afloop van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
  - number: '45.2'
    text: |-
      Indien binnen de in het eerste lid bedoelde termijn een uitnodiging tot het doen van aangifte
      is uitgereikt of toegezonden, hetzij de inspecteur is verzocht om een uitnodiging tot het doen
      van aangifte, wordt die termijn verlengd tot het einde van de door de inspecteur ingevolge
      [artikel 9, eerste tot en met derde lid, van de Algemene wet inzake rijksbelastingen][ref1] gestelde of verleende
      termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '9'
  - number: 45a.1
    text: |-
      Indien de belastingplichtige een partner heeft ten aanzien van wie in het kalenderjaar de in
      [artikel 8.8 van de wet][ref1] bedoelde maximering van de gecombineerde heffingskorting toepassing vindt, wordt
      bij de berekening van hetgeen ingevolge artikel 27, paragraaf 1, van het in artikel [9.2 van de wet][ref2] genoemde
      verdrag wordt aangemerkt als ingehouden Nederlandse loonbelasting, het bedrag aan Nederlandse inkomstenbelasting
      en premie als bedoeld in de [Wet financiering volksverzekeringen][ref3] dat de belastingplichtige verschuldigd
      zou zijn geweest indien hij de in artikel 27, paragraaf 1, van dat verdrag bedoelde beloningen uit Nederland zou
      hebben verkregen, verminderd met de verhoging, bedoeld in artikel [8.9 van de wet][ref4], van de gecombineerde
      heffingskorting waarop zijn partner recht zou hebben gehad, indien hij bedoelde beloningen daadwerkelijk uit
      Nederland zou hebben verkregen en Nederland daarover belasting en premie zou hebben geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0004538
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0004538
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 45a.2
    text: |-
      Indien de belastingplichtige een partner heeft ten aanzien van wie in het kalenderjaar de in
      [artikel 8.8 van de wet][ref1] bedoelde maximering van de gecombineerde heffingskorting toepassing vindt, wordt
      bij de berekening van hetgeen ingevolge artikel 27, paragraaf 2, van het in het eerste lid bedoelde verdrag
      wordt aangemerkt als ingehouden Nederlandse loonbelasting, het bedrag aan Nederlandse inkomstenbelasting dat
      de belastingplichtige verschuldigd zou zijn geweest indien de in artikel 27, paragraaf 2, van dat verdrag
      bedoelde beloningen uitsluitend in Nederland zouden zijn belast, verminderd met de verhoging, bedoeld in
      [artikel 8.9 van de wet][ref2], van de gecombineerde heffingskorting, waarop zijn partner recht zou hebben gehad
      indien uitsluitend in Nederland over de bedoelde beloningen belasting zou zijn geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 45a.3
    text: |-
      De in het eerste en het tweede lid bedoelde verminderingen zijn niet van toepassing voorzover de partner van de
      belastingplichtige:
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel45a
  - number: 45a.3.a
    text: |-
      uit hoofde van [hoofdstuk 8 van de wet][ref1] recht heeft op verhoging van de gecombineerde heffingskorting; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: 45a.3.b
    text: |-
      recht zou hebben gehad op de gecombineerde heffingskorting als bedoeld in
      [hoofdstuk 8 van de wet][ref1] indien beloningen die hij heeft genoten krachtens regelen als bedoeld in
      [hoofdstuk VII van de Algemene wet inzake rijksbelastingen][ref2] niet zouden zijn vrijgesteld van de heffing van
      inkomstenbelasting of premie als bedoeld in de [Wet financiering volksverzekeringen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVII
      [ref3]: https://wetten.overheid.nl/BWBR0004538
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0004538
  - number: '47'
    text: Deze regeling treedt in werking met ingang van 1 januari 2001.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel47
  - number: '48'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling inkomstenbelasting 2001.'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel48
