           Onder buitenschoolse opvang wordt verstaan kinderopvang die zowel voor als na schooltijd en tijdens de
      schoolvakanties plaatsvindt. Onder naschoolse opvang wordt verstaan kinderopvang die zowel na schooltijd als
      tijdens de schoolvakanties plaatsvindt.


