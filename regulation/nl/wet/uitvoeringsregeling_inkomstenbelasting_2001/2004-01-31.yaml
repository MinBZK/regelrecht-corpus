  - number: '1.2'
    text: 'Deze regeling verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel1
  - number: 1.2.a
    text: |-
      wet: [Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 1.2.b
    text: |-
      inhoudingsplichtige: de inhoudingsplichtige als bedoeld in de [Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 1.2.c
    text: |-
      openbaar vervoer: voor een ieder openstaand personenvervoer volgens een dienstregeling met een auto, bus, trein,
      tram, metro, veerpont of een via een geleidesysteem voortbewogen voertuig.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel1
  - number: '2'
    text: |-
      Een kind wordt in belangrijke mate op kosten van de ouder onderhouden indien de op de ouder drukkende bijdrage
      in de kosten van het onderhoud van het kind ten minste € 386 per kwartaal beloopt. De ouder wordt geacht een
      kind in belangrijke mate op zijn kosten te onderhouden indien hij voor het kind recht heeft op kinderbijslag
      ingevolge de [Algemene Kinderbijslagwet][ref1] of op een tegemoetkoming volgens een naar aard en strekking met de
      [Algemene Kinderbijslagwet][ref2] overeenkomende buitenlandse regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0002368
  - number: '3'
    text: |-
      Voor de toepassing van artikelen 2.2, eerste lid, en 2.5, eerste lid van de wet, worden, voorzover het niet gaat om
      lidstaten van de Europese Unie, als de in die bepalingen bedoelde mogendheden aangewezen alle mogendheden waarmee
      Nederland een regeling ter voorkoming van dubbele belasting is overeengekomen, waarvan de bepalingen van toepassing
      zijn, met uitzondering van Zwitserland.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel3
  - number: '4.1'
    text: |-
      Voor gevallen waarin een premie voor een lijfrente of een andere periodieke uitkering of verstrekking uit een
      inkomensvoorziening niet geheel als uitgave voor een inkomensvoorziening in aanmerking is genomen, worden voor de
      vaststelling van het gedeelte van het recht dat in aanmerking wordt genomen bij het belastbare inkomen uit werk en
      woning en het gedeelte dat in aanmerking wordt genomen bij het belastbare inkomen uit sparen en beleggen de eerste
      kosten, de toekomstige kosten en het rendement evenredig aan die gedeelten toegerekend naar de mate waarin de
      premie bij het belastbare inkomen uit werk en woning en het belastbare inkomen uit sparen en beleggen in aanmerking
      is genomen.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel4
  - number: '4.2'
    text: |-
      Voorzover een premie voor aanspraken op periodieke uitkeringen of verstrekkingen ter zake van invaliditeit,
      ziekte of ongeval als bedoeld in [artikel 3.124, onderdeel c, van de wet][ref1] en een premie voor lijfrenten
      als bedoeld in [artikel 3.125, eerste lid, onderdeel b, van de wet][ref2] in enig jaar niet als uitgave voor
      een inkomensvoorziening in aanmerking is genomen, wordt het desbetreffende recht in aanmerking genomen bij het
      belastbare inkomen uit sparen en beleggen naar de mate waarin die premie in verhouding staat tot de overige voor
      dit recht betaalde premies die wel als uitgaven voor inkomensvoorzieningen in aanmerking zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '5'
    text: |-
      Bij het bepalen van de winst van het eerste kalenderjaar als ondernemer komt mede in aftrek het totale bedrag van
      de kosten en lasten die zijn gemaakt in de vijf daaraan voorafgaande kalenderjaren en die verband houden met het
      starten van de onderneming, voorzover:
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel5
  - number: 5.a
    text: er in die periode geen opbrengsten tegenover hebben gestaan en
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel5
  - number: 5.b
    text: zij niet ten laste van het belastbaar inkomen uit werk en woning kunnen of konden worden gebracht.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel5
  - number: '6.1'
    text: |-
      Als regelingen ten behoeve van de ontwikkeling en instandhouding van bos en natuur en als overeenkomsten die
      op die regelingen vooruitlopen, als bedoeld in [artikel 3.13, eerste lid, onderdeel h, van de wet][ref1] worden
      aangewezen: de Tijdelijke regeling particulier natuurbeheer respectievelijk de in het tweede lid genoemde
      overeenkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '6.2'
    text: 'De in het eerste lid bedoelde overeenkomsten betreffen:'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel6
  - number: 6.2.a
    text: de overeenkomsten met het Bureau Beheer Landbouwgronden
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel6
  - number: 6.2.a.1°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 005/9001 van 29 mei 1996;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel6
  - number: 6.2.a.2°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 008/9001 van 30 mei 1996;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel6
  - number: 6.2.a.3°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 004/9001 van 27 oktober 1997;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel6
  - number: 6.2.a.4°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 003/9001 van 15 december 1997;'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel6
  - number: 6.2.b
    text: |-
      de beschikkingen van de minister van Landbouw, Natuurbeheer en Visserij van 18 april 1998 met de beschikkingnummers
      kaderwet/pnb/01, kaderwet/pnb/02 en kaderwet/pnb/03.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel6
  - number: '6.3'
    text: |-
      Van de voordelen die worden genoten op grond van de in het eerste lid bedoelde regelingen en overeenkomsten behoort
      90% niet tot de winst.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel6
  - number: '7'
    text: |-
      Voor de toepassing van [artikel 3.16, tweede lid, onderdeel c, van de wet][ref1] wordt kleding die niet uitsluitend
      of nagenoeg uitsluitend geschikt is om bij het behalen van de winst te dragen, slechts als werkkleding aangemerkt
      indien zij is voorzien van een of meer duidelijk zichtbare, aan de onderneming gebonden beeldmerken met een
      oppervlakte van tezamen ten minste 70 cm2.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '8.1'
    text: |-
      Voor de toepassing van [artikel 3.17, eerste lid, onderdeel a, onder 1° van de wet][ref1], verhuist de ondernemer
      in ieder geval in het kader van de onderneming ingeval hij binnen twee jaar na de verplaatsing van de onderneming:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 8.1.a
    text: |-
      verhuist naar een woning binnen een afstand van 10 kilometer van de nieuwe vestigingsplaats van de onderneming
      terwijl hij op een afstand groter dan 10 kilometer van deze vestigingsplaats woonde;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel8
  - number: 8.1.b
    text: |-
      door verhuizing de afstand tussen zijn woning en de vestigingsplaats van de onderneming met ten minste 50 percent
      en ten minste 10 kilometer bekort.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel8
  - number: '8.2'
    text: Onder afstand als bedoeld in het eerste lid wordt verstaan de afstand gemeten langs de meest gebruikelijke weg.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel8
  - number: '9'
    text: |-
      De rittenregistratie als bedoeld in [artikel 3.20 van de wet][ref1] bevat ten minste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9.a
    text: merk, type en kenteken van de auto;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel9
  - number: 9.b
    text: periode van terbeschikkingstelling van de auto;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel9
  - number: 9.c
    text: |-
      per rit: 10. datum; 20. beginstand en eindstand van de kilometerteller; 30. beginadres en eindadres; 40. de gereden
      route indien deze afwijkt van de meest gebruikelijke; 50. het karakter van de rit.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel9
  - number: '10.1'
    text: |-
      In afwijking van [artikel 3.27, tweede lid, van de wet][ref1] is het eerste lid van dat artikel mede van toepassing
      op de betaling van premies voor risicoverzekeringen voor weduwen- en wezenpensioenen, voorzover het in de premies
      begrepen bestanddeel voor toekomstige wijzigingen in de hoogte van lonen of prijzen niet meer bedraagt dan nodig is
      voor een aanpassing aan een zodanige wijziging van 4% per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '10.2'
    text: |-
      In afwijking van [artikel 3.27, derde lid, van de wet][ref1] is het eerste lid van dat artikel mede van toepassing
      op de betaling van premies of koopsommen aan een pensioenlichaam waarvan het doel en de feitelijke werkzaamheden
      overeenkomen met die van een pensioenfonds als bedoeld in de [Pensioen- en spaarfondsenwet][ref2] en waarvan de
      winst uitsluitend kan worden aangewend ten bate van de verzekerden, een ander pensioenfonds met overeenkomstige
      doelstelling, of een algemeen maatschappelijk belang.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0002089
  - number: '10.3'
    text: |-
      Het eerste en tweede lid zijn slechts van toepassing voorzover de betalingen het vermogen van de onderneming
      onherroepelijk hebben verlaten.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel10
  - number: 13a.1
    text: |-
      Aan de in [artikel 3.63, vierde lid en vijfde lid, van de wet][ref1] bedoelde termijn van 36 maanden wordt geacht
      te zijn voldaan indien zich na het aangaan van het samenwerkingsverband respectievelijk de dienstbetrekking een
      omstandigheid voordoet als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 13a.2
    text: 'Het eerste lid is van toepassing indien de belastingplichtige:'
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel13a
  - number: 13a.2.a
    text: |-
      door ziekte of gebreken gedurende ten minste één jaar niet in staat is, of vermoedelijk niet in staat zal zijn,
      om ten minste 55% te verdienen van wat lichamelijk en geestelijk gezonde personen die overigens in gelijke
      omstandigheden verkeren, kunnen verdienen;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel13a
  - number: 13a.2.b
    text: in staat van faillissement wordt verklaard;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel13a
  - number: 13a.2.c
    text: surséance van betaling heeft aangevraagd;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel13a
  - number: 13a.2.d
    text: onder curatele wordt gesteld;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel13a
  - number: 13a.2.e
    text: |-
      vóór het aangaan van het samenwerkingsverband respectievelijk de dienstbetrekking met degene die de onderneming
      gaat voortzetten nog wel, maar vanaf enig moment daarna niet meer kan kiezen voor kwalificatie als partner van de
      voortzetter, of
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel13a
  - number: 13a.2.f
    text: |-
      overlijdt en de onderneming spoedig daarna aan de in
      [artikel 3.63, vierde lid respectievelijk vijfde lid, van de wet][ref1], bedoelde voortzetter wordt overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '14'
    text: (GERESERVEERD)
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel14
  - number: '16.1'
    text: |-
      De openbaar-vervoerverklaring, bedoeld in [artikel 3.87, negende lid van de wet][ref1], is gedagtekend en bevat ten
      minste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 16.1.a
    text: naam en adres van de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel16
  - number: 16.1.b
    text: de route waarvoor de plaatsbewijzen geldig zijn;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel16
  - number: 16.1.c
    text: het tijdvak van geldigheid van de plaatsbewijzen.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel16
  - number: '16.2'
    text: |-
      De verklaring, bedoeld in [artikel 3.87, elfde lid, van de wet][ref1] (de reisverklaring) bevat ten minste de
      volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 16.2.a
    text: naam en adres van de inhoudingsplichtige;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel16
  - number: 16.2.b
    text: naam en adres van de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel16
  - number: 16.2.c
    text: |-
      een door de inhoudingsplichtige ondertekende verklaring, die vermeldt het aantal dagen per week dat de
      belastingplichtige met het openbaar vervoer naar de plaats of plaatsen van werkzaamheden heeft gereisd.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel16
  - number: '16.3'
    text: |-
      Op verzoek van de inspecteur doet de belastingplichtige de reisverklaring, alsmede de plaatsbewijzen, aan hem
      toekomen.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel16
  - number: '17.1'
    text: |-
      Als uitkeringen welke niet tot de inkomsten in de vorm van bepaalde periodieke uitkeringen en verstrekkingen
      behoren, bedoeld in [artikel 3.104, onderdeel g, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 17.1.a
    text: |-
      uitkeringen ingevolge de [Huursubsidiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008659
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008659
  - number: 17.1.b
    text: |-
      uitkeringen ingevolge de [Wet bevordering eigenwoningbezit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011919
  - number: 17.1.c
    text: |-
      uitkeringen ingevolge de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0012438
  - number: 17.1.d
    text: uitkeringen en verstrekkingen ingevolge de Regeling opvang asielzoekers;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17
  - number: 17.1.e
    text: |-
      uitkeringen en verstrekkingen ingevolge de Regelingen verstrekkingen asielzoekers en andere categorieën
      vreemdelingen 1997;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17
  - number: 17.1.f
    text: |-
      uitkeringen en verstrekkingen ingevolge de Wet gemeentelijke zorg voor houders van een voorwaardelijke vergunning
      tot verblijf;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17
  - number: 17.1.g
    text: uitkeringen als bedoeld in artikel 5 van het Besluit taakverlichting alleenstaande werkenden/AAW;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17
  - number: 17.1.h
    text: |-
      uitkeringen en verstrekkingen ter zake van kinderopvang in verband waarmee aan de gemeenten subsidie wordt verleend
      ingevolge de op [artikel 3, eerste lid, van de Kaderwet SZW-subsidies][ref1] gebaseerde regeling kinderopvang en
      buitenschoolse opvang alleenstaande ouders;


      [ref1]: https://wetten.overheid.nl/BWBR0008754#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008754
        artikel: '3'
  - number: 17.1.i
    text: |-
      inkomensondersteunende uitkeringen ingevolge artikel 108, eerste lid, van de Gemeentewet, die overeenkomen met
      bijstand ter bestrijding van bepaalde noodzakelijke kosten.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17
  - number: '17.2'
    text: |-
      Als uitkeringen tot bestrijding van onderhoudskosten van thuiswonende gehandicapte kinderen, bedoeld in
      [artikel 3.104, onderdeel h, van de wet][ref1], worden aangewezen: uitkeringen ingevolge de Regeling tegemoetkoming
      onderhoudskosten thuiswonende gehandicapte kinderen 2000.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 17a.1
    text: |-
      Voor de toepassing van [artikel 3.119a van de wet][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 17a.1.a
    text: |-
      wordt de eigenwoningreserve die is gevormd voor het ontstaan van een algehele huwelijksgemeenschap bij ontbinding
      van die gemeenschap op gezamenlijk verzoek van de belastingplichtige en zijn echtgenoot of gewezen echtgenoot
      verdeeld in de onderlinge verhouding waarin zij tot de gemeenschap gerechtigd zijn. Het verzoek wordt uiterlijk
      gedaan bij de aangifte over het jaar waarin de algehele huwelijksgemeenschap wordt ontbonden. Op dit verzoek kan
      niet worden teruggekomen;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17a
  - number: 17a.1.b
    text: |-
      wordt een woning zolang deze ten aanzien van de echtgenoot van de belastingplichtige als eigen woning wordt
      aangemerkt ten aanzien van de belastingplichtige mede als eigen woning aangemerkt indien de woning tot een
      huwelijksgemeenschap behoort of gaat behoren.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17a
  - number: 17a.2
    text: |-
      Indien in de overeenkomst ter zake van de verwerving van een eigen woning, ten behoeve van de uitvoering van het
      woonbeleid van het Rijk of een gemeente, een clausule is opgenomen op grond waarvan bij niet nakoming van die
      clausule een bedrag verschuldigd is, kan bij de vervreemding van die woning het bedrag dat terzake van het niet
      nakomen van de clausule is betaald in mindering worden gebracht op het vervreemdingssaldo eigen woning.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel17a
  - number: '18'
    text: (GERESERVEERD)
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel18
  - number: '19'
    text: |-
      De in [artikel 3.140 van de wet][ref1] bedoelde regelingen zijn de regelingen die voldoen aan overeenkomstige eisen
      als gesteld in het [Tijdelijk besluit kwaliteitsregels kinderopvang][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007668
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007668
  - number: '20.1'
    text: |-
      De uitgaven ter zake van kinderopvang worden slechts in aanmerking genomen voor zover zij blijken uit gedagtekende
      facturen waarin op duidelijke en overzichtelijke wijze is vermeld:
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel20
  - number: 20.1.a
    text: de instelling jegens welke of de natuurlijke persoon jegens wie de uitgaven zijn gedaan;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel20
  - number: 20.1.b
    text: |-
      de instelling of de natuurlijke persoon die de kinderopvang heeft verricht indien deze een andere is dan bedoeld in
      onderdeel a;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel20
  - number: 20.1.c
    text: naam en leeftijd van de kinderen voor wie kinderopvang pleegt te worden genoten;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel20
  - number: 20.1.d
    text: |-
      de perioden waarin en het aantal uren gedurende welke of het aantal dagen waarop gedurende meer dan vijf uur
      onderscheidenlijk vijf uur of minder, dan wel in de vorm van buitenschoolse opvang onderscheidenlijk naschoolse
      opvang per kind kinderopvang pleegt te worden genoten;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel20
  - number: 20.1.e
    text: het adres waar de kinderopvang pleegt plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel20
  - number: '20.2'
    text: |-
      De uitgaven ter zake van kinderopvang worden slechts in aanmerking genomen indien de belastingplichtige beschikt
      over een afschrift van:
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel20
  - number: 20.2.a
    text: |-
      de vergunning of de verklaring die door de gemeente aan de instelling of de natuurlijke persoon die de kinderopvang
      verzorgt is afgegeven, inhoudende dat de instelling of de natuurlijke persoon voldoet aan door de gemeente gestelde
      regels met betrekking tot de kwaliteit;
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel20
  - number: 20.2.b
    text: |-
      de overeenkomst met de instelling of de natuurlijke persoon die de kinderopvang verzorgt, waarin is opgenomen het
      adres waar de kinderopvang pleegt plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0012031/2004-01-31#Artikel20
  - number: '21.1'
    text: |-
      De in [artikel 3.143 van de wet][ref1] bedoelde uitgaven ter zake van kinderopvang worden voor de
      belastingplichtige die op vijf of meer dagen per week beroepsmatige kinderopvang voor één of meer kinderen pleegt
      te genieten, slechts in aanmerking genomen voorzover de aldus in de wet begrensde uitgaven meer belopen dan het
      op basis van zijn verzamelinkomen, vóór de vermindering met de uitgaven voor kinderopvang en de persoonsgebonden
      aftrek, bepaalde - in de navolgende tabel aangegeven - drempelbedrag. Indien de belastingplichtige gedurende
      het gehele kalenderjaar een partner heeft of gedurende het gehele kalenderjaar een gezamenlijke huishouding
      voert met een belastingplichtige die samen met de belastingplichtige de keuze van kwalificatie als partner
      kan maken, wordt het drempelbedrag berekend op basis van hun gezamenlijk verzamelinkomen. De tweede volzin
      is van overeenkomstige toepassing indien de belastingplichtige gedurende een deel van het kalenderjaar een
      partner heeft en zij bij een verzoek om voorlopige teruggave of bij een aangifte een keuze als bedoeld in
      [artikel 2.17, zevende lid, van de wet][ref2] hebben gemaakt.


















