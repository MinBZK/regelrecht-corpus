  - number: 44b
    text: |-
      Voor de toepassing van [artikel 8.14a, eerste lid, onderdeel b, van de wet][ref1], wordt een kind dat niet op
      hetzelfde woonadres als de belastingplichtige staat ingeschreven in de basisregistratie personen, beschouwd toch
      op hetzelfde woonadres als de belastingplichtige te staan ingeschreven in de basisregistratie personen gedurende
      de periode van het kalenderjaar dat het kind tegelijkertijd tot het huishouden van diens beide ouders behoort en
      het kind op hetzelfde woonadres als diens andere ouder staat ingeschreven in de basisregistratie personen. Voor de
      toepassing van de eerste volzin behoort een kind tegelijkertijd tot het huishouden van diens beide ouders indien
      hij doorgaans ten minste drie gehele dagen per week in elk van beide huishoudens verblijft.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.14a
    url: https://wetten.overheid.nl/BWBR0012031/2019-01-01#Artikel44b
