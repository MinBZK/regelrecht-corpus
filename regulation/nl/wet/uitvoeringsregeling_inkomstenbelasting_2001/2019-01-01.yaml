      1 Als gegevens als bedoeld in [artikel 3.119g van de wet][ref1] worden aangewezen:

      a. de datum van aangaan van de schuld;

      b. het startbedrag van de schuld;

      c. de maandelijkse rentevoet;

      d. de contractueel vastgelegde looptijd in maanden;

      e. de contractueel vastgelegde wijze van aflossing;

      f. indien de leningverstrekker een natuurlijk persoon is: de naam, het adres en het burgerservicenummer of, bij
      het ontbreken van het burgerservicenummer, een hiermee vergelijkbaar door de fiscale woonstaat toegekend fiscaal
      identificatienummer van de leningverstrekker;

      g. indien de leningverstrekker een rechtspersoon is: de naam, het adres en een uniek nummer als bedoeld in de
      [Handelsregisterwet 2007][ref2] of, bij het ontbreken van een dergelijk nummer en indien dat bestaat, een hiermee
      vergelijkbaar door de fiscale woonstaat toegekend fiscaal identificatienummer van de leningverstrekker.

      2 Als gegevens als bedoeld in [artikel 3.119g van de wet][ref3] worden mede aangewezen de wijzigingen die zich in
      het kalenderjaar hebben voorgedaan met betrekking tot de in het eerste lid bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.119g
      [ref2]: https://wetten.overheid.nl/BWBR0021777
