  - number: 29a
    text: |-
      1 Een aangewezen fonds overlegt binnen vier maanden na afloop van ieder boekjaar aan de inspecteur een overzicht
      van zijn bezittingen en schulden naar de waarde in het economische verkeer aan het einde van het boekjaar.

      2 Ingeval het fonds is aangewezen met een aanloopperiode, verstrekt het fonds onmiddellijk na afloop van die
      periode aan de inspecteur een overzicht van zijn bezittingen en schulden naar de actuele waarde in het economische
      verkeer.

      3 Ingeval het fonds is aangewezen met een ingroeiperiode, verstrekt het fonds in die periode elk half jaar aan de
      inspecteur een overzicht van zijn bezittingen en schulden naar de actuele waarde in het economische verkeer.

      4 Indien een fonds indirect een krediet verstrekt ten behoeve van een project, blijkt uit de administratie van de
      inlenende rechtspersoon ten behoeve van welk project het krediet is verstrekt.

      5 Indien een fonds een krediet verstrekt ten behoeve van een project door tussenkomst van een ander fonds,
      elimineert het inlenende fonds het kredietbedrag uit het overzicht van zijn bezittingen en schulden, bedoeld in het
      eerste lid.

      6 Indien een aangewezen fonds niet meer voldoet aan de voorwaarden voor aanwijzing, doet het fonds daarvan
      onverwijld schriftelijk mededeling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0012031/2019-01-01#Artikel29a
  - number: 29b
    text: |-
      1 De inspecteur trekt de aanwijzing in:

      a. op verzoek van het fonds;

      b. indien het fonds niet meer voldoet aan de voorwaarden voor aanwijzing; dan wel

      c. indien het fonds de in dit hoofdstuk opgenomen informatieverplichtingen jegens de inspecteur niet nakomt.

      2 De intrekking van de aanwijzing geschiedt bij voor bezwaar vatbare beschikking.

      3 De inspecteur bepaalt in de beschikking het tijdstip waarop de intrekking van de aanwijzing in werking treedt,
      met dien verstande dat de intrekking terugwerkende kracht heeft tot en met de dag waarop het eerste lid, onderdeel
      b of c, van toepassing is.

      4 Ingeval het fonds is aangewezen met een aanloopperiode en na afloop van die periode niet wordt voldaan aan het
      hoofdzakelijkheidscriterium, heeft de intrekking terugwerkende kracht tot en met de eerste dag na het aflopen van
      die periode.

      5 Ingeval het fonds is aangewezen met een ingroeiperiode en na afloop van die periode niet wordt voldaan aan het
      hoofdzakelijkheidscriterium, heeft de intrekking terugwerkende kracht tot en met de eerste dag na het aflopen van
      die periode.

      6 Indien het fonds de in [artikel 29a, zesde lid][ref1], bedoelde mededeling onverwijld heeft gedaan, heeft de
      intrekking geen terugwerkende kracht.

      7 Indien het fonds de in [artikel 29a, zesde lid][ref2], bedoelde mededeling onverwijld heeft gedaan en voorts
      aannemelijk maakt dat het niet meer voldoen aan de voorwaarden niet langer dan drie maanden zal voortduren, een
      incidenteel karakter heeft en niet in strijd is met doel en strekking van de regeling, trekt de inspecteur de
      aanwijzing niet in. Het besluit de aanwijzing niet in te trekken, neemt de inspecteur bij voor bezwaar vatbare
      beschikking; daarbij kan hij nadere voorwaarden stellen.

      8 Indien de inspecteur een aanwijzing intrekt, maakt hij die intrekking op een daartoe geschikte wijze publiek
      bekend.


