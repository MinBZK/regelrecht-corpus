      Voor overige diëten worden de extra kosten gesteld op nihil.

      2 Voor de toepassing van dit artikel wordt verstaan onder:

      a. referentievoeding: een gezonde voeding conform een Nederlands voedingspatroon, gebaseerd op de Richtlijnen Goede
      Voeding en Richtlijnen Voedselkeuze;

      b. energieverrijkt in combinatie met eiwitverrijkt: een voorgeschreven energiebehoefte van ten minste 150% ten
      opzichte van de referentievoeding en een voorgeschreven hoeveelheid eiwit van ten minste 16% van de hoeveelheid
      energie;

      c. energieverrijkt: een voorgeschreven energiebehoefte van ten minste 150% ten opzichte van de referentievoeding;

      d. natriumbeperkt: een voorgeschreven beperking tot 2400 milligram natrium per etmaal;

      e. lactosebeperkt/lactosevrij: een voorgeschreven lactosebeperking tot 5 gram per etmaal;

      f. glutenvrij in combinatie met lactosebeperkt/lactosevrij: glutenvrij en een voorgeschreven lactosebeperking tot 5
      gram per etmaal;

      g. energieverrijkt in combinatie met MCT-vetverrijkt: een voorgeschreven energiebehoefte van ten minste 150% ten
      opzichte van de referentievoeding en een voorgeschreven hoeveelheid MCT-vet van ten minste 12% van de hoeveelheid
      energie per etmaal;

      h. energieverrijkt in combinatie met eiwitverrijkt en lactosebeperkt/lactosevrij: een voorgeschreven
      energiebehoefte van ten minste 150% ten opzichte van de referentievoeding, een voorgeschreven hoeveelheid eiwit van
      ten minste 16% van de hoeveelheid energie en een voorgeschreven lactosebeperking tot 5 gram per etmaal;

      i. verzadigd vetbeperkt in combinatie met fyto/plantensterolenverrijkt: een voorgeschreven hoeveelheid verzadigd
      vet die voorziet in niet meer dan 10% van de hoeveelheid energie en een voorgeschreven hoeveelheid plantaardige
      stanolen of van plantaardige sterolen van ten minste 2 gram per etmaal;

      j. vetbeperkt in combinatie met MCT-vetverrijkt: een voeding uitgaande van een zo laag mogelijke hoeveelheid vet en
      een voorgeschreven hoeveelheid MCT-vet van ten minste 18% van de hoeveelheid energie per etmaal;

      k. fructosebeperkt: een voorgeschreven fructosebeperking tot 5 gram per etmaal;

      l. sterk eiwitbeperkt: een voorgeschreven beperking tot 20 gram eiwit per etmaal;

      m. eiwitverrijkt in combinatie met natriumbeperkt: een voorgeschreven hoeveelheid eiwit van ten minste 16% van de
      hoeveelheid energie en een voorgeschreven beperking tot 2000 milligram natrium per etmaal;

      n. eiwitverrijkt in combinatie met sterk (LCT-)vetbeperkt en MCT-vetverrijkt: een voorgeschreven hoeveelheid
      eiwit van ten minste 16% van de hoeveelheid energie, uitgaande van een zo laag mogelijke hoeveelheid vet en een
      voorgeschreven hoeveelheid MCT-vet van ten minste 18% van de hoeveelheid energie per etmaal;

      o. fermenteerbare oligosachariden, disachariden, monosachariden en polyolen beperkt dieet: vrij van
      voedingsmiddelen die rijk zijn aan fermenteerbare oligosachariden, disachariden, monosachariden en polyolen;

      p. galactosebeperkt/galactosevrij: een voorgeschreven lactosebeperking tot 5 gram per etmaal;

      q. sacharosebeperkt, fructosebeperkt, lactosebeperkt en vetbeperkt: een voorgeschreven hoeveelheid koolhydraten van
      ten minste 21 gram koolhydraten per 2 uur gedurende de dag en ten minste 16 gram koolhydraten per 2 uur gedurende
      de nacht en sacharosebeperkt, fructosebeperkt, lactosebeperkt en vetbeperkt;

      r. sterk koolhydraatbeperkt zonder energiebeperking: een voorgeschreven hoeveelheid koolhydraten van maximaal 30
      energieprocent bij een volwaardige voeding in energie;

      s. sterk sacharosebeperkt in combinatie met (iso)maltose beperkt: een voorgeschreven hoeveelheid koolhydraten tot
      maximaal 30 energieprocent in combinatie met enzymsuppletie;

      t. sterk koolhydraatbeperkt in combinatie met eiwitbeperkt en vetverrijkt: een voorgeschreven hoeveelheid
      koolhydraten die voorziet in niet meer dan 4% van de hoeveelheid energie, een voorgeschreven hoeveelheid eiwit die
      voorziet in niet meer dan 6% van de hoeveelheid energie en een voorgeschreven hoeveelheid vet van ten minste 90%
      van de hoeveelheid energie ten opzichte van de referentievoeding.

      3 Voor de toepassing van het eerste lid geldt voor:

      a. eenzelfde dieettypering die meerdere keren in aanmerking zou komen éénmaal het bedrag behorende bij die
      dieettypering;

      b. verschillende dieettyperingen die in aanmerking zouden komen bij eenzelfde ziektebeeld en aandoening elk van de
      bij die dieettyperingen behorende bedragen;

      c. deels overeenkomende dieettyperingen bij eenzelfde ziektebeeld en aandoening, alleen het hoogste van de voor het
      van toepassing zijnde ziektebeeld en aandoening geldende bedragen.

      4 Ingeval extra uitgaven voor een op voorschrift van een arts of diëtist gehouden dieet niet gedurende het
      gehele kalenderjaar worden gedaan, worden de met toepassing van het eerste lid bepaalde bedragen naar tijdsgelang
      herrekend.

      5 Een voorschrift als bedoeld in [artikel 6.17, achtste lid, van de wet][ref2] bevat ten minste:

      a. gegevens waaruit blijkt dat degene die het voorschrift afgeeft medicus of diëtist is;

      b. naam, praktijkadres, telefoonnummer en handtekening van de medicus of diëtist die het voorschrift afgeeft;

      c. naam, adres en burgerservicenummer van de persoon aan wie het dieet is voorgeschreven;

      d. het ziektebeeld en de aandoening van de persoon, bedoeld in onderdeel c, en de dieettypering van het
      voorgeschreven dieet;

      e. de dagtekening van het voorschrift, de ingangsdatum van het te volgen dieet en indien van toepassing de
      einddatum van het te volgen dieet.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6.17
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6.17
