  - number: '18'
    text: |-
      Van langdurige arbeidsongeschiktheid als bedoeld in [artikel 3.133, negende lid, onderdeel a, van de wet][ref1] is
      sprake indien:

      a. uit een recente verklaring van een arts blijkt dat de belastingplichtige door ziekte of gebreken op het moment
      waarop de verklaring is afgegeven niet in staat is volledig de werkzaamheden te verrichten waarmee vóór het
      ontstaan van de arbeidsongeschiktheid het inkomen hoofdzakelijk werd verdiend en hiertoe vermoedelijk in de twaalf
      maanden na de afgifte van de verklaring ook niet in staat zal zijn, of

      b. aannemelijk is dat de belastingplichtige periodieke uitkeringen van privaat- of publiekrechtelijke aard wegens
      arbeidsongeschiktheid ontvangt of gaat ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.133
    url: https://wetten.overheid.nl/BWBR0012031/2019-01-01#Artikel18
