        artikel: '2.2'
  - number: '4'
    text: |-
      Bij de tijdsevenredige vermindering, bedoeld in [artikel 2.7, tweede lid, van de wet][ref1], van de heffingskorting
      voor de inkomstenbelasting wordt:

      a. een kalenderjaar op 360 dagen gesteld;

      b. een kalendermaand op 30 dagen gesteld;

      c. de dag waarop het tijdvak aanvangt als een gehele dag in aanmerking genomen;

      d. de dag waarop het tijdvak eindigt niet in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2.7
    url: https://wetten.overheid.nl/BWBR0012031/2019-01-01#Artikel4
