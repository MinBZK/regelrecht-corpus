    text: |-
      1 Indien de over een kalendermaand verschuldigde aflossing van een tot de eigenwoningschuld behorende schuld
      in de eerste vijf werkdagen van de daaropvolgende kalendermaand wordt gedaan, wordt voor de toepassing van
      de [artikelen 3.119c][ref1] en [3.119e van de wet][ref2] het bedrag van deze schuld op de laatste dag van de
      kalendermaand waarover de aflossing verschuldigd was, verminderd met die aflossing.

      2 Onder werkdagen als bedoeld in het eerste lid worden verstaan alle dagen van het jaar
      met uitzondering van zaterdagen, zondagen, algemeen erkende feestdagen als bedoeld in
      [artikel 3, eerste lid, van de Algemene termijnenwet][ref3], de Goede Vrijdag en 1 mei.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.119c
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.119e
      [ref3]: https://wetten.overheid.nl/BWBR0002448#Artikel3
