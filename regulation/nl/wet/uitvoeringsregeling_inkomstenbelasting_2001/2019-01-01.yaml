      1 Uitgaven voor extra kleding en beddengoed alsmede daarmee samenhangende extra uitgaven als bedoeld in
      [artikel 6.17, eerste lid, onderdeel g, van de wet][ref1] worden in aanmerking genomen voor een bedrag van € 300
      dan wel, indien blijkt dat die uitgaven € 600 te boven gaan, voor een bedrag van € 750, indien:

      a. de genoemde uitgaven voortvloeien uit ziekte of invaliditeit van een persoon als bedoeld in
      [artikel 6.16 van de wet][ref2] die tot het huishouden van de belastingplichtige behoort; en

      b. de ziekte of invaliditeit ten minste een jaar heeft geduurd of vermoedelijk zal duren.

      2 Ingeval aan de in het eerste lid gestelde voorwaarden niet gedurende het gehele kalenderjaar is voldaan, wordt
      dat lid naar tijdsgelang toegepast.


