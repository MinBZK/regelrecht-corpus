    text: |-
      1 Voor de toepassing van [artikel 3.17, eerste lid, onderdeel a, onder 1°, van de wet][ref1] verhuist de
      ondernemer in ieder geval in het kader van de onderneming ingeval hij binnen twee jaar na de verplaatsing van de
      onderneming door verhuizing de afstand tussen zijn woning en de vestigingsplaats van de onderneming met ten minste
      60% verkleint terwijl tot die verhuizing de afstand tussen zijn woning en de vestigingsplaats van de onderneming
      ten minste 25 kilometer bedroeg.

      2 Onder afstand als bedoeld in het eerste lid wordt verstaan de afstand gemeten langs de meest gebruikelijke weg.


