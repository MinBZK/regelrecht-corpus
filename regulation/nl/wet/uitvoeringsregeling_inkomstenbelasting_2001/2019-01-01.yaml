  - number: 45aa
    text: |-
      De inspecteur vermindert ambtshalve een belastingaanslag die op een te hoog bedrag is vastgesteld zodra hem dat is
      gebleken, tenzij:

      a. vijf jaren zijn verlopen na het einde van het kalenderjaar waarop de belastingaanslag betrekking heeft;

      b. de onjuistheid van de belastingaanslag voortvloeit uit jurisprudentie die eerst is gewezen nadat die
      belastingaanslag onherroepelijk vast is komen te staan, tenzij de Minister van Financiën anders heeft bepaald;

      c. de onjuistheid van de belastingaanslag voortvloeit uit beleidsregels van de Minister van Financiën die eerst
      zijn uitgevaardigd nadat die belastingaanslag onherroepelijk vast is komen te staan, tenzij de Minister van
      Financiën anders heeft bepaald;

      d. de onjuistheid van de belastingaanslag voortvloeit uit de omstandigheid dat eerst nadat die belastingaanslag
      onherroepelijk vast is komen te staan een beroep wordt gedaan op een fiscale faciliteit, waarop een beroep moet
      worden gedaan bij de aangifte of op een ander wettelijk voorgeschreven moment; of

      e. sprake is van enig feit waardoor ten onrechte inkomstenbelasting is geheven en als gevolg van die heffing een
      andere belasting, al dan niet van dezelfde belastingplichtige, ter zake van datzelfde feit niet is geheven en ook
      niet meer kan worden geheven, met dien verstande dat in dat geval wel ambtshalve vermindering plaatsvindt voor
      zover het bedrag van de eerstgenoemde belasting het bedrag van de andere belasting te boven gaat.
    url: https://wetten.overheid.nl/BWBR0012031/2019-01-01#Artikel45aa
  - number: 45b
    text: |-
      Vóór 1 januari 2005 vastgestelde lijfrenten die niet in geldeenheden luiden:

      1. Op een lijfrente waarvan vóór 1 januari 2005 de hoogte van de termijnen in beleggingseenheden (units) met de
      verzekeraar is overeengekomen, blijft [artikel 2a][ref1] buiten toepassing en kan de lijfrente-overeenkomst worden
      tenuitvoergelegd zoals is overeengekomen.

      2. Indien ter zake van een lijfrente als bedoeld in het eerste lid op of na 1 januari 2005 met de verzekeraar een
      wijziging van methode van berekening van de termijnen in units of in euro’s wordt overeengekomen, is met ingang van
      de datum van die wijziging [art. 2a][ref2] wel van toepassing.

      3. Indien een lijfrente als bedoeld in het eerste lid op of na 1 januari 2005 wordt omgezet in een andere
      lijfrente, is [artikel 2a][ref3] van toepassing op de laatstgenoemde lijfrente.


