      1 De ingevolge [artikel 6.26 van de wet][ref1] bedoelde weekenduitgaven voor gehandicapten worden gesteld op:

      a. € 10 per dag van verzorging van de gehandicapte door de belastingplichtige, alsmede

      b. € 0,19 per kilometer voor het vervoer per auto van de gehandicapte door de belastingplichtige over de
      reisafstand tussen de plaats waar de gehandicapte doorgaans verblijft en de plaats waar de belastingplichtige
      doorgaans verblijft.

      Dagen van verzorging van de gehandicapte door de belastingplichtige zijn de dagen waarop de gehandicapte bij de
      belastingplichtige verblijft, met inbegrip van de dagen waarop de gehandicapte wordt gehaald of gebracht.

      2 Indien zowel de belastingplichtige als zijn partner weekenduitgaven voor een gehandicapte in aanmerking nemen,
      wordt het voor die gehandicapte in aanmerking te nemen bedrag gesteld op de helft van het volgens het eerste lid,
      onderdelen a en b, berekende bedrag, zonodig naar boven af te ronden op een geheel getal.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6.26
