  - number: 26d
    text: |-
      Aan de in [artikel 4.17c, eerste lid, onderdeel d, van de wet][ref1] bedoelde voorwaarde wordt geacht ook te zijn
      voldaan indien:

      a. de vennootschap waarop de aandelen of winstbewijzen betrekking hebben, een belang heeft in een ander lichaam;

      b. dat andere lichaam een onderneming drijft of een medegerechtigdheid houdt, een en ander als bedoeld in
      [artikel 4.17c, eerste lid, onderdeel a, van de wet][ref2], en

      c. de verkrijger reeds gedurende de 36 maanden die onmiddellijk voorafgaan aan het tijdstip van de vervreemding in
      dienstbetrekking is van dat andere lichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4.17c
