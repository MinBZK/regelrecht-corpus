      1 In de onderhandse akte van schenking, bedoeld in [artikel 6.38 van de wet][ref1], worden ten minste de volgende
      gegevens vermeld:

      a. de naam, het adres en het burgerservicenummer van de belastingplichtige;

      b. de naam en het nummer, bedoeld in
      [artikel 1a, zevende lid, onderdeel b, van de Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994][ref2],
      van de begiftigde instelling of vereniging, dan wel, ingeval het een buitenlandse vereniging is, een door de
      vestigingsstaat aan de begiftigde vereniging toegekend identificatienummer dat vergelijkbaar is met het nummer,
      bedoeld in [artikel 12, onderdeel a, van de Handelsregisterwet 2007][ref3];

      c. het startjaar en de looptijd van de uitkeringen of verstrekkingen;

      d. de jaarlijkse hoogte van de uitkeringen of een omschrijving van de verstrekkingen; en

      e. een door de instelling of vereniging aan de schenking toe te kennen uniek transactienummer van ten hoogste
      vijftien cijfers.


