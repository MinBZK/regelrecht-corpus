      1 Aan de in [artikel 3.63, vierde lid en vijfde lid, van de wet][ref1] bedoelde termijn van 36 maanden wordt geacht
      te zijn voldaan indien zich na het aangaan van het samenwerkingsverband respectievelijk de dienstbetrekking een
      omstandigheid voordoet als bedoeld in het tweede lid.

      2 Het eerste lid is van toepassing indien de belastingplichtige:

      a. door ziekte of gebreken gedurende ten minste één jaar niet in staat is, of vermoedelijk niet in staat zal
      zijn, om ten minste 55% te verdienen van wat lichamelijk en geestelijk gezonde personen die overigens in gelijke
      omstandigheden verkeren, kunnen verdienen;

      b. in staat van faillissement wordt verklaard;

      c. surséance van betaling heeft aangevraagd;

      d. onder curatele wordt gesteld;

      e. vóór het aangaan van het samenwerkingsverband respectievelijk de dienstbetrekking met degene die de onderneming
      gaat voortzetten nog wel, maar vanaf enig moment daarna niet meer kan kiezen voor kwalificatie als partner van de
      voortzetter, of

      f. overlijdt en de onderneming spoedig daarna aan de in
      [artikel 3.63, vierde lid respectievelijk vijfde lid, van de wet][ref2], bedoelde voortzetter wordt overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.63
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.63
