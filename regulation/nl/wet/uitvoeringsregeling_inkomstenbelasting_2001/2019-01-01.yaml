      1 Aan de in [artikel 4.17c, eerste lid, onderdeel d, van de wet][ref1] bedoelde termijn van 36 maanden wordt geacht
      te zijn voldaan indien zich na het aangaan van de aldaar bedoelde dienstbetrekking een omstandigheid voordoet als
      bedoeld in het tweede lid.

      2 Het eerste lid is van toepassing indien de vervreemder:

      a. door ziekte of gebreken gedurende ten minste één jaar niet in staat is, of vermoedelijk niet in staat zal
      zijn, om ten minste 55% te verdienen van wat lichamelijk en geestelijk gezonde personen die overigens in gelijke
      omstandigheden verkeren, kunnen verdienen;

      b. in staat van faillissement is verklaard;

      c. surséance van betaling heeft aangevraagd, of

      d. onder curatele is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4.17c
    url: https://wetten.overheid.nl/BWBR0012031/2019-01-01#Artikel26c
