  - number: '5'
    text: |-
      Bij het bepalen van de winst van het eerste kalenderjaar als ondernemer komt mede in aftrek het totale bedrag van
      de kosten en lasten die zijn gemaakt in de vijf daaraan voorafgaande kalenderjaren en die verband houden met het
      starten van de onderneming, voorzover:

      a. er in die periode geen opbrengsten tegenover hebben gestaan en

      b. zij niet ten laste van het belastbaar inkomen uit werk en woning kunnen of konden worden gebracht.
    url: https://wetten.overheid.nl/BWBR0012031/2019-01-01#Artikel5
  - number: '6'
    text: |-
      1 Als regelingen ten behoeve van de ontwikkeling en instandhouding van bos en natuur of overeenkomsten die op die
      regelingen vooruitlopen als bedoeld in [artikel 3.13, eerste lid, onderdeel g, van de wet][ref1] worden aangewezen:

      a. de Tijdelijke regeling particulier natuurbeheer zoals die luidde tot 1 januari 2000;

      b. de [Subsidieregeling natuurbeheer 2000][ref2] zoals die luidde tot 1 januari 2007;

      c. de Subsidieregeling natuurbeheer van de onderscheiden provincies;

      d. de [Subsidieregeling agrarisch natuurbeheer][ref3] zoals die luidde tot 1 januari 2007, voor zover betrekking
      hebbende op de landschapssubsidie, bedoeld in [artikel 2, aanhef en onderdeel b, van die regeling][ref4];

      e. de Subsidieregeling agrarisch natuurbeheer van de onderscheiden provincies, voor zover betrekking hebbende op de
      landschapssubsidie, bedoeld in artikel 2, eerste lid, aanhef en onderdeel b, van die regeling;

      f. de Subsidieverordening natuur- en landschapsbeheer van de onderscheiden provincies, voor zover betrekking
      hebbende op de subsidie natuurbeheer, bedoeld in artikel 3.1 van die verordening, en de subsidie landschapsbeheer,
      bedoeld in artikel 5.1.1.1 van die verordening;

      g. de Subsidieregeling kwaliteitsimpuls natuur en landschap van de onderscheiden provincies, voor zover betrekking
      hebbende op de investeringssubsidie, bedoeld in artikel 8, eerste, derde en vierde lid, van die regeling, en de
      subsidie functieverandering, bedoeld in artikel 15 van die regeling;

      h. de Subsidieregeling natuur- en landschapsbeheer 2016 van de onderscheiden provincies, voor zover betrekking
      hebbende op de subsidie natuur- en landschapsbeheer, bedoeld in artikel 2.2 van die regeling;

      i. de overeenkomsten met het Bureau Beheer Landbouwgronden:

      1°. met het door de Dienst Landelijk Gebied toegekende nummer: 005/9001 van 29 mei 1996;

      2°. met het door de Dienst Landelijk Gebied toegekende nummer: 008/9001 van 30 mei 1996;

      3°. met het door de Dienst Landelijk Gebied toegekende nummer: 004/9001 van 27 oktober 1997;

      4°. met het door de Dienst Landelijk Gebied toegekende nummer: 003/9001 van 15 december 1997;

      j. de beschikkingen van de Minister van Economische Zaken van 18 april 1998 met de beschikkingnummers kaderwet/
      pnb/01, kaderwet/pnb/02 en kaderwet/pnb/03.

      2 Van de voordelen die worden genoten op grond van de in het eerste lid, onderdelen a, i en j, bedoelde regelingen
      en overeenkomsten behoort 90% niet tot de winst. Van de voordelen die worden genoten op grond van de in het eerste
      lid, onderdelen b tot en met h, bedoelde regelingen en overeenkomsten behoort 100% niet tot de winst.


