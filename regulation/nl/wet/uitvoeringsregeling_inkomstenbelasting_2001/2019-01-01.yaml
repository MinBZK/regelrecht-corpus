      De voorwaarden, bedoeld in [artikel 3.13, eerste lid, onderdeel i, onder 2°, van de wet][ref1], zijn dat:

      a. deelnemers ten hoogste één periode van ten hoogste twaalf maanden kunnen deelnemen aan het project;

      b. de beloningen die een deelnemer kan krijgen uit het project een gezamenlijke waarde hebben van ten hoogste € 200
      per maand en € 1.200 per deelnameperiode.


