  - number: 45f
    text: |-
      Onder een starterslening als bedoeld in [artikel 10bis.1, tweede lid, onderdeel f, van de wet][ref1] wordt verstaan
      een lening ter verwerving van een eigen woning als bedoeld in [artikel 3.111 van de wet][ref2], mits aan de
      volgende voorwaarden wordt voldaan:

      a. de belastingplichtige koopt voor de eerste maal een eigen woning;

      b. de belastingplichtige heeft tegenover de Stichting Stimuleringsfonds Volkshuisvesting Nederlandse gemeenten
      aannemelijk gemaakt dat hij op het moment van aangaan van de lening volgens de toen geldende normen van de
      Nationale Hypotheek Garantie het geleende bedrag niet anders kon financieren dan door middel van een lening van de
      Stichting Stimuleringsfonds Volkshuisvesting Nederlandse gemeenten;

      c. de looptijd van de lening is ten hoogste 360 maanden;

      d. op zowel deze lening als op de lening die naast deze lening wordt afgesloten is de Nationale Hypotheek Garantie
      van toepassing;

      e. de lening is bij authentieke notariële akte verstrekt;

      f. gedurende de eerste drie jaar na het aangaan van de lening bestaat geen verplichting tot aflossing of
      rentebetaling;

      g. na de periode van drie jaar, bedoeld in onderdeel f, dient de lening door de belastingplichtige volgens een ten
      minste annuïtair schema in maximaal 324 maanden te worden afgelost en dient de over de lening verschuldigde rente
      te worden betaald, tenzij uit een hertoetsing van het inkomen door de Stichting Stimuleringsfonds Volkshuisvesting
      Nederlandse gemeenten blijkt dat de belastingplichtige deze lasten niet kan dragen, in welk geval aan de hand
      van de hertoetsing een aangepaste door de leningnemer te betalen maandlast met betrekking tot de lening wordt
      vastgesteld; en,

      h. de hertoetsing, bedoeld in onderdeel g, vindt volgens het contract in ieder geval plaats na drie, zes, tien en
      vijftien jaar na het moment van aangaan van de lening voor zover niet reeds is gebleken dat de leningnemer de bij
      de lening behorende rente- en aflossingslasten kan dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10bis.1
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.111
    url: https://wetten.overheid.nl/BWBR0012031/2019-01-01#Artikel45f
