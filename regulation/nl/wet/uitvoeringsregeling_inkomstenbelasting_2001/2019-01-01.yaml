  - number: 45g
    text: |-
      1 Ingeval een spaarrekening eigen woning meer dan één rekeninghouder heeft, wordt het tegoed van de rekening in
      gelijke delen toegerekend aan die rekeninghouders.

      2 Ingeval een beleggingsrecht eigen woning meer dan één eigenaar heeft, wordt de waarde van het recht in gelijke
      delen toegerekend aan die eigenaren.
    url: https://wetten.overheid.nl/BWBR0012031/2019-01-01#Artikel45g
