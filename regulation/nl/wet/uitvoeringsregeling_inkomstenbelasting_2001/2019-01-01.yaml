  - number: 45a
    text: |-
      1 Indien de belastingplichtige een partner heeft ten aanzien van wie in het kalenderjaar de
      in [artikel 8.8 van de wet][ref1] bedoelde maximering van de gecombineerde heffingskorting
      toepassing vindt, wordt bij de berekening van hetgeen ingevolge artikel 27, paragraaf 1, van het in
      [artikel 9.2, negende lid, onderdeel a, van de wet][ref2] genoemde verdrag wordt aangemerkt als ingehouden
      Nederlandse loonbelasting, het bedrag aan Nederlandse inkomstenbelasting en premie voor de volksverzekeringen
      als bedoeld in de [Wet financiering sociale verzekeringen][ref3] dat de belastingplichtige verschuldigd zou
      zijn geweest indien hij de in artikel 27, paragraaf 1, van dat verdrag bedoelde beloningen uit Nederland zou
      hebben verkregen, verminderd met de verhoging, bedoeld in artikel [8.9 van de wet][ref4], van de gecombineerde
      heffingskorting waarop zijn partner recht zou hebben gehad, indien hij bedoelde beloningen daadwerkelijk uit
      Nederland zou hebben verkregen en Nederland daarover belasting en premie zou hebben geheven.

      2 Indien de belastingplichtige een partner heeft ten aanzien van wie in het kalenderjaar de in
      [artikel 8.8 van de wet][ref5] bedoelde maximering van de gecombineerde heffingskorting toepassing
      vindt, wordt bij de berekening van hetgeen ingevolge artikel XII van het protocol bij het in
      [artikel 9.2, negende lid, onderdeel b, van de wet][ref6] genoemde verdrag wordt aangemerkt als ingehouden
      Nederlandse loonbelasting, het bedrag aan Nederlandse inkomstenbelasting en premie voor de volksverzekeringen
      als bedoeld in de [Wet financiering sociale verzekeringen][ref7] dat de belastingplichtige verschuldigd zou zijn
      geweest indien hij de in artikel XII van dat protocol bedoelde beloningen uit Nederland zou hebben verkregen,
      verminderd met de verhoging, bedoeld in [artikel 8.9 van de wet][ref8], van de gecombineerde heffingskorting
      waarop zijn partner recht zou hebben gehad, indien hij bedoelde beloningen daadwerkelijk uit Nederland zou hebben
      verkregen en Nederland daarover belasting en premie zou hebben geheven.

      3 Indien de belastingplichtige een partner heeft ten aanzien van wie in het kalenderjaar de in
      [artikel 8.8 van de wet][ref9] bedoelde maximering van de gecombineerde heffingskorting toepassing vindt, wordt
      bij de berekening van hetgeen ingevolge artikel 27, paragraaf 2, van het in het eerste lid bedoelde verdrag
      wordt aangemerkt als ingehouden Nederlandse loonbelasting, het bedrag aan Nederlandse inkomstenbelasting dat
      de belastingplichtige verschuldigd zou zijn geweest indien de in artikel 27, paragraaf 2, van dat verdrag
      bedoelde beloningen uitsluitend in Nederland zouden zijn belast, verminderd met de verhoging, bedoeld in
      [artikel 8.9 van de wet][ref10], van de gecombineerde heffingskorting, waarop zijn partner recht zou hebben gehad
      indien uitsluitend in Nederland over de bedoelde beloningen belasting zou zijn geheven.

      4 De in het eerste, tweede en derde lid bedoelde verminderingen zijn niet van toepassing voorzover de partner van
      de belastingplichtige:

      a. uit hoofde van [hoofdstuk 8 van de wet][ref11] recht heeft op verhoging van de gecombineerde heffingskorting; of

      b. recht zou hebben gehad op de gecombineerde heffingskorting als bedoeld in
      [hoofdstuk 8 van de wet][ref12] indien beloningen die hij heeft genoten krachtens regelen als bedoeld
      in [hoofdstuk VII van de Algemene wet inzake rijksbelastingen][ref13] niet zouden zijn vrijgesteld
      van de heffing van inkomstenbelasting of premie voor de volksverzekeringen als bedoeld in de
      [Wet financiering sociale verzekeringen][ref14].


