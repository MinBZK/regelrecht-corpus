    text: |-
      1 De aangifte, bedoeld in [artikel 9.4, eerste lid, onderdeel b, van de wet][ref1], wordt gedaan binnen vijf jaren
      na afloop van het kalenderjaar.

      2 Indien binnen de in het eerste lid bedoelde termijn een uitnodiging tot het doen van aangifte
      is uitgereikt of toegezonden, hetzij de inspecteur is verzocht om een uitnodiging tot het doen
      van aangifte, wordt die termijn verlengd tot het einde van de door de inspecteur ingevolge
      [artikel 9, eerste tot en met derde lid, van de Algemene wet inzake rijksbelastingen][ref2] gestelde of verleende
      termijn.


