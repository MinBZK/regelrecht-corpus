    text: |-
      1 Onder een omzetting van gewone aandelen in preferente aandelen als bedoeld in
      [artikel 4.17a, derde lid, onderdeel a, van de wet][ref1] wordt ook begrepen een uitgifte van preferente aandelen
      in het kader van een aandelenfusie als bedoeld in [artikel 3.55 van de wet][ref2], een juridische splitsing als
      bedoeld in [artikel 3.56 van de wet][ref3] of een juridische fusie als bedoeld in [artikel 3.57 van de wet][ref4].

      2 Aan het gestelde in [artikel 4.17a, derde lid, onderdeel a, van de wet][ref5] wordt ook geacht te zijn
      voldaan indien de daar bedoelde preferente aandelen worden verkregen van een rechtsopvolger krachtens erfrecht of
      huwelijksvermogensrecht van degene die de aandelen heeft omgezet als bedoeld in genoemd onderdeel.

      3 Indirect gehouden preferente aandelen zijn uitgegeven in het kader van een bedrijfsoverdracht als bedoeld in
      [artikel 4.17a, vijfde lid, laatste volzin, van de wet][ref6] indien:

      a. de preferente aandelen een omzetting vormen van een eerder door de erflater gehouden indirect belang van gewone
      aandelen als bedoeld in [artikel 4.17a, vijfde lid, onderdelen a en b, van de wet][ref7];

      b. de omzetting in preferente aandelen gepaard is gegaan met het toekennen van gewone aandelen aan een ander;

      c. ten tijde van de omzetting in preferente aandelen de vennootschap waarop de omgezette aandelen betrekking
      hadden een onderneming dreef als bedoeld in [artikel 4.17a, eerste lid, onderdeel a, van de wet][ref8], of een
      medegerechtigdheid hield als bedoeld in artikel 4.17a, eerste lid, onderdeel b, van de wet, en

      d. de verkrijger van de indirect gehouden preferente aandelen reeds voor ten minste 5% van het geplaatste kapitaal
      direct of indirect aandeelhouder is van gewone aandelen als bedoeld in onderdeel b.

      Voor de toepassing van dit lid wordt onder een omzetting van gewone aandelen in preferente aandelen
      als bedoeld in de eerste volzin ook begrepen een uitgifte van preferente aandelen in het kader van een
      aandelenfusie als bedoeld in [artikel 3.55 van de wet][ref9], een juridische splitsing als bedoeld in
      [artikel 3.56 van de wet][ref10] of een juridische fusie als bedoeld in [artikel 3.57 van de wet][ref11]. Voorts
      wordt daaronder ook begrepen een uitgifte van preferente aandelen in het kader van een bedrijfsfusie als bedoeld in
      [artikel 14 van de Wet op de vennootschapsbelasting 1969][ref12].

      4 Indien preferente aandelen zijn ontstaan in het kader van een gefaseerde bedrijfsoverdracht als bedoeld in
      [artikel 4.17a, derde lid of vijfde lid, van de wet][ref13], dan behouden deze aandelen het karakter dat zij in
      aanmerking worden genomen voor de toepassing van artikel 4.17a, eerste lid, onderdeel c, van die wet voor zover
      de houder van deze preferente aandelen ook houder is van de gewone aandelen die bij het ontstaan van de preferente
      aandelen zijn toegekend aan de bedrijfsopvolger.

      5 Voor de bepaling of de verkrijger van de preferente aandelen voldoet aan de voorwaarde van
      [artikel 4.17a, derde lid, onderdeel d, van de wet][ref14] worden de preferente aandelen niet gerekend tot het
      geplaatste kapitaal. De eerste volzin is van overeenkomstige toepassing voor de toepassing van het derde lid,
      eerste volzin, onderdeel d.


