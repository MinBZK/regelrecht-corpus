  - number: '28'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder:

      a. *project:* groenproject, zijnde een project waarvoor ingevolge de [Regeling
      groenprojecten 2016](onbekend), de [Regeling groenprojecten buitenland 2002][ref1] dan wel de
      [Regeling groenprojecten Nederlandse Antillen en Aruba 2002][ref2] een verklaring als bedoeld in
      [artikel 5.14, derde lid, van de wet][ref3] is afgegeven;

      b. *fonds:* groenfonds, zijnde een bank of beleggingsinstelling die voldoet aan de voorwaarden
      van [artikel 5.14, tweede lid, van de wet][ref4] en die door de inspecteur ingevolge
      [artikel 5.14, eerste lid, van de wet][ref5] is aangewezen;

      c. *hoofdzakelijkheidscriterium:* de voorwaarde inzake hoofdzakelijk als bedoeld in
      [artikel 5.14, tweede lid, van de wet][ref6];

      d. *aanloopperiode:* de periode, bedoeld in [artikel 5.14, vierde lid, van de wet][ref7];

      e. *ingroeiperiode:* de periode, bedoeld in [artikel 5.14, vijfde lid, van de wet][ref8].


