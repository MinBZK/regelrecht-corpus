  - number: 39a
    text: |-
      Als uitgaven als bedoeld in [artikel 6.18, eerste lid, onderdeel h, van de wet][ref1] worden aangewezen:

      a. uitgaven voor in-vitrofertilisatie voor een vrouw die ten tijde van de behandeling 43 jaar of ouder is;

      b. uitgaven voor de eerste twee in-vitrofertilisatiebehandelingen indien meer dan één embryo per poging wordt
      teruggeplaatst en de vrouw ten tijde van de behandeling jonger is dan 38 jaar;

      c. uitgaven voor een elleboogkruk, een gipssteun, een looprek, een okselkruk, een onderarmschaalkruk, een rollator
      of een loophulp met drie of vier poten;

      d. uitgaven voor geestelijke gezondheidszorg voor een persoon die de leeftijd van 18 jaar nog niet heeft bereikt;

      e. uitgaven voor dyslexiezorg voor een persoon die de leeftijd van 18 jaar nog niet heeft bereikt;

      f. uitgaven voor een combinatietest in het kader van prenatale screening indien geen sprake is van een medische
      indicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6.18
