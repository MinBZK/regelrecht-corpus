    text: |-
      1 Als uitkeringen welke niet tot de inkomsten in de vorm van bepaalde periodieke uitkeringen en verstrekkingen
      behoren, bedoeld in [artikel 3.104, onderdeel h, van de wet][ref1] worden aangewezen:

      a. uitkeringen ingevolge de [Wet op de huurtoeslag][ref2];

      b. uitkeringen ingevolge de [Wet bevordering eigenwoningbezit][ref3];

      c. uitkeringen ingevolge de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref4];

      d. uitkeringen en verstrekkingen ingevolge de [Regeling opvang asielzoekers][ref5];

      e. uitkeringen en verstrekkingen ingevolge de
      [Regeling verstrekkingen asielzoekers en andere categorieën vreemdelingen 2005][ref6];

      f. inkomensondersteunende uitkeringen ingevolge [artikel 108, eerste lid, van de Gemeentewet][ref7], die
      overeenkomen met bijstand ter bestrijding van bepaalde noodzakelijke kosten.

      2 Als uitkeringen tot bestrijding van onderhoudskosten van thuiswonende gehandicapte kinderen,
      bedoeld in [artikel 3.104, onderdeel i, van de wet][ref8], worden aangewezen: uitkeringen ingevolge de
      [Regeling tegemoetkoming ouders van thuiswonende gehandicapte kinderen][ref9], zoals deze luidde op 31 december
      2014.

      3 Als voorzieningen voor militaire oorlogs- of dienstslachtoffers die verband houden met invaliditeit als
      bedoeld in [artikel 3.104, onderdeel o, van de wet][ref10] worden aangewezen: voorzieningen in de zin van de
      [Voorzieningenregeling voor militaire oorlogs- en dienstslachtoffers][ref11].

      4 Als publiekrechtelijke uitkeringen en verstrekkingen die zijn gericht op het verbeteren of behouden van de
      positie van de belastingplichtige op de arbeidsmarkt en daarmee samenhangende vervoersvoorzieningen voor het
      bereiken van de werkplek of opleidingslocatie als bedoeld in [artikel 3.104, onderdeel p, van de wet][ref12] worden
      aangewezen:

      a. voorzieningen als bedoeld in [artikel 35, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref13];

      b. voorzieningen als bedoeld in
      [artikel 2:22, tweede lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref14];

      c. vergoedingen als bedoeld in [artikel 15, tweede lid, van het Reïntegratiebesluit][ref15] alsmede
      voorzieningen als bedoeld in de [artikelen 13, eerste lid][ref16], [14, eerste lid][ref17], en
      [15a, eerste lid, van dat besluit][ref18];

      d. voorzieningen als bedoeld in de [artikelen 5, eerste lid][ref19], en
      [8 van het Uitvoeringsbesluit onderwijsvoorzieningen voor jongeren met een handicap][ref20];

      e. subsidies voor scholing als bedoeld in
      [artikel 2 van de Regeling subsidie scholing en plaatsing oudere werklozen][ref21];

      f. voorzieningen als bedoeld in
      [artikel 30a, vierde tot en met negende lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref22],
      [artikel 26, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref23] en
      [artikel 2:18 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref24].


