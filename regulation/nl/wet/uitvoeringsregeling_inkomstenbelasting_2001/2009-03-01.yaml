    text: |-
      1 De openbaar-vervoerverklaring, bedoeld in [artikel 3.87, negende lid van de wet][ref1], is gedagtekend en bevat
      ten minste de volgende gegevens:

      a. naam en adres van de belastingplichtige;

      b. de route waarvoor de plaatsbewijzen geldig zijn;

      c. het tijdvak van geldigheid van de plaatsbewijzen.

      2 De verklaring, bedoeld in [artikel 3.87, elfde lid, van de wet][ref2] (de reisverklaring) bevat ten minste de
      volgende gegevens:

      a. naam en adres van de inhoudingsplichtige;

      b. naam en adres van de belastingplichtige;

      c. een door de inhoudingsplichtige ondertekende verklaring, die vermeldt het aantal dagen per week dat de
      belastingplichtige met het openbaar vervoer naar de plaats of plaatsen van werkzaamheden heeft gereisd.

      3 Op verzoek van de inspecteur doet de belastingplichtige de reisverklaring, alsmede de plaatsbewijzen, aan hem
      toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.87
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.87
