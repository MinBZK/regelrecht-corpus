      1 Een fonds dat voor 1 januari 2008 is aangewezen als fonds als bedoeld in [artikel 5.14][ref1], onderscheidenlijk
      [artikel 5.15][ref2] of [artikel 5.18a van de wet][ref3], zoals de wet toen luidde, wordt geacht met ingang van
      1 januari 2008 door de inspecteur bij beschikking te zijn aangewezen op de voet van de wet zoals die thans luidt.

      2 Een participatiemaatschappij die voor 1 januari 2008 is aangewezen als participatiemaatschappij als bedoeld
      in [artikel 5.18 van de wet][ref4], zoals de wet toen luidde, wordt geacht met ingang van 1 januari 2008 door de
      inspecteur bij beschikking te zijn aangewezen op de voet van de wet zoals die thans luidt.


