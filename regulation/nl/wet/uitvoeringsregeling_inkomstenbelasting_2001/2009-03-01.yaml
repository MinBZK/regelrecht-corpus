  - number: 41b
    text: |-
      1 Een instelling als bedoeld in [artikel 6.33, eerste lid, onderdeel b, van de wet][ref1] houdt niet meer vermogen
      aan dan redelijkerwijs nodig is voor de continuïteit van de voorziene werkzaamheden ten behoeve van de doelstelling
      van de instelling.

      2 Onder vermogen dat nodig is voor de continuïteit van de voorziene werkzaamheden als bedoeld in het eerste lid
      wordt begrepen:

      1°. vermogen of bestanddelen daarvan welke krachtens uiterste wilsbeschikking of schenking door de instelling zijn
      verkregen, al dan niet in reële termen in stand te houden, voor zover die instandhouding voortvloeit uit de aan die
      uiterste wilsbeschikking of schenking verbonden voorwaarden;

      2°. vermogensbestanddelen aan te houden voor zover de instandhouding daarvan voortvloeit uit de doelstelling van
      de instelling;

      3°. activa aan te houden en vermogen voor de voorziene aanschaf van die activa op te bouwen, voor zover een
      instelling die activa ten behoeve van de doelstelling van de instelling redelijkerwijs nodig heeft.

      3 Een instelling als bedoeld in [artikel 6.33, eerste lid, onderdeel b, van de wet][ref2] vermeldt in haar
      financiële administratie het doel waarvoor het vermogen wordt aangehouden, alsmede een motivering voor de omvang
      van dat vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6.33
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6.33
