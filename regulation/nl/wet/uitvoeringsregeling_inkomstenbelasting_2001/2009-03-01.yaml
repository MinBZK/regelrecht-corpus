    text: |-
      1 In afwijking van [artikel 3.27, tweede lid, van de wet][ref1] is het eerste lid van dat artikel mede van
      toepassing op de betaling van premies voor risicoverzekeringen voor weduwen- en wezenpensioenen, voorzover het in
      de premies begrepen bestanddeel voor toekomstige wijzigingen in de hoogte van lonen of prijzen niet meer bedraagt
      dan nodig is voor een aanpassing aan een zodanige wijziging van 4% per jaar.

      2 In afwijking van [artikel 3.27, derde lid, van de wet][ref2] is het eerste lid van dat artikel mede van
      toepassing op de betaling van premies of koopsommen aan een pensioenlichaam waarvan het doel en de feitelijke
      werkzaamheden overeenkomen met die van een pensioenfonds als bedoeld in de [Pensioenwet][ref3] en waarvan de
      winst uitsluitend kan worden aangewend ten bate van de verzekerden, een ander pensioenfonds met overeenkomstige
      doelstelling, of een algemeen maatschappelijk belang.

      3 Het eerste en tweede lid zijn slechts van toepassing voorzover de betalingen het vermogen van de onderneming
      onherroepelijk hebben verlaten.


