        artikel: 8.14b
  - number: 44d
    text: |-
      1 Voor de toepassing van de ouderschapsverlofkorting beschikt de werknemer over een door de werkgever ondertekende
      verklaring dat ouderschapsverlof als bedoeld in [hoofdstuk 6 van de Wet arbeid en zorg][ref1] is opgenomen.

      2 Deze verklaring bevat ten minste:

      a. naam, adres en woonplaats van de werkgever;

      b. het loonheffingennummer van de werkgever;

      c. naam en sociaal-fiscaalnummer van de belastingplichtige;

      d. de periode in het kalenderjaar waarin de belastingplichtige gebruik heeft gemaakt van zijn recht op
      ouderschapsverlof;

      e. het totaal aantal uren in het kalenderjaar waarin de belastingplichtige gebruik heeft gemaakt van zijn recht
      op ouderschapsverlof.


      [ref1]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0012031/2009-03-01#Artikel44d
