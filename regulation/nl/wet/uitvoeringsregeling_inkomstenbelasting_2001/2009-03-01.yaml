  - number: '32'
    text: |-
      Onder een geregistreerde, achtergestelde geldlening als bedoeld in
      [artikel 5.17, eerste lid juncto artikel 5.17 vierde lid, van de wet][ref1] wordt verstaan een geldlening:

      a. met een hoofdsom van ten minste € 2269 ter zake waarvan een rente wordt vergoed welke niet uitgaat boven de
      wettelijke rente, bedoeld in [artikel 120, eerste lid, van Boek 6 van het Burgerlijk Wetboek;][ref2]

      b. ter zake waarvan in de overeenkomst is vermeld:

      1°. indien de beginnende ondernemer een natuurlijk persoon is: het sociaal-fiscaal nummer van de beginnende
      ondernemer en het sociaal-fiscaal nummer van degene die de geldlening verstrekt;

      2°. indien de beginnende ondernemer een rechtspersoon is als bedoeld in
      [artikel 5.17, derde lid, onderdeel b, van de wet][ref3]: het omzetbelastingnummer van de beginnende ondernemer en
      het sociaal-fiscaal nummer van degene die de geldlening verstrekt;

      c. ter zake waarvan in de overeenkomst is opgenomen dat:

      1°. de lening jegens andere schuldeisers, gedurende ten minste de eerste acht jaren
      na het overeenkomen van de geldlening, een lagere rang inneemt dan is bepaald in
      [artikel 277, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref4];

      2°. indien de beginnende ondernemer een natuurlijk persoon is, de lening dient ter financiering van bestanddelen
      die behoren tot het verplichte ondernemingsvermogen van de beginnende ondernemer, dan wel, indien de beginnende
      ondernemer een rechtspersoon is, de lening dient ter financiering van bestanddelen die tot het verplichte
      ondernemingsvermogen zouden behoren zo de onderneming van de rechtspersoon voor rekening van een natuurlijk persoon
      zou worden gedreven;

      3°. de lening door degene die de geldlening verstrekt niet is gefinancierd met geleend geld, en

      4°. de lening is verstrekt met het oog op het bepaalde in de[ artikelen 6.8][ref5] en [5.17, van de wet][ref6],
      waarvan melding wordt gemaakt in het opschrift van de overeenkomst;

      d. waarvan de overeenkomst daartoe is ondertekend door de beginnende ondernemer en degene die de geldlening
      verstrekt, en

      e. welke binnen vier weken na het overeenkomen daarvan is geregistreerd op de voet van de
      [Registratiewet 1970][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.17
