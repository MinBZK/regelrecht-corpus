  - number: 41a
    text: |-
      1 Een kerkelijke, levensbeschouwelijke, charitatieve, culturele, wetenschappelijke of algemeen
      nut beogende instelling wordt door de inspecteur aangemerkt als een instelling als bedoeld in
      [artikel 6.33, eerste lid, onderdeel b, van de wet][ref1], indien en zolang:

      a. uit de regelgeving van de instelling en de feitelijke werkzaamheid blijkt dat de instelling geen winstoogmerk
      heeft;

      b. uit de regelgeving van de instelling en de feitelijke werkzaamheid blijkt dat de instelling het algemeen belang
      dient;

      c. uit de regelgeving van de instelling en de feiten blijkt dat een natuurlijk persoon noch een rechtspersoon over
      het vermogen van de instelling kan beschikken als ware het zijn eigen vermogen; de inspecteur kan, zonodig onder
      door hem te stellen voorwaarden, toestaan dat een steunstichting en de instelling of instellingen welke door deze
      stichting worden ondersteund, over en weer kunnen beschikken over elkaars vermogen als ware het eigen vermogen;

      d. de instelling niet meer vermogen aanhoudt dan is aangegeven in [artikel 41b][ref2];

      e. de leden van het orgaan van de instelling dat het beleid bepaalt, ter zake van de door hen voor de instelling
      verrichte werkzaamheden geen andere beloning ontvangen dan een vergoeding voor gemaakte onkosten en een niet
      bovenmatig vacatiegeld;

      f. de instelling beschikt over een actueel beleidsplan dat inzicht geeft in de door de instelling te verrichten
      werkzaamheden, de wijze van werving van gelden, het beheer van het vermogen van de instelling en de besteding
      daarvan;

      g. de kosten van werving van gelden en de beheerkosten van de instelling in redelijke verhouding staan tot de
      bestedingen ten behoeve van het doel van de instelling;

      h. uit de regelgeving van de instelling blijkt dat bij opheffing van de instelling een
      batig liquidatiesaldo moet worden besteed ten behoeve van een instelling als bedoeld in
      [artikel 6.33, eerste lid, onderdeel b, van de wet][ref3], dan wel op enigerlei andere wijze waarmee het algemeen
      belang wordt gediend, en

      i. de administratie van de instelling zodanig is ingericht dat daaruit duidelijk blijkt:

      1°. de aard en omvang van de aan de afzonderlijke leden van het orgaan van de instelling dat het beleid bepaalt,
      toekomende onkostenvergoedingen en vacatiegelden;

      2°. de aard en omvang van de kosten die door de instelling zijn gemaakt ten behoeve van de werving van gelden en
      het beheer van de instelling, alsmede de aard en omvang van de andere uitgaven van de instelling;

      3°. de aard en omvang van de inkomsten van de instelling;

      4°. de aard en omvang van het vermogen van de instelling.

      2 Het tijdstip van aanmerken van een instelling als een instelling als bedoeld in
      [artikel 6.33, eerste lid, onderdeel b, van de wet][ref4] kan zijn gelegen voor de dagtekening van de beschikking
      van dat aanmerken.

      3 De inspecteur maakt het aanmerken van een instelling als een instelling als bedoeld in
      [artikel 6.33, eerste lid, onderdeel b, van de wet][ref5] op een daartoe geschikte wijze publiek bekend. Het niet
      meer als zodanig aanmerken wordt ook op een daartoe geschikte wijze publiek bekend gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6.33
      [ref2]: https://wetten.overheid.nl/BWBR0012031#Artikel41b
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel6.33
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel6.33
      [ref5]: https://wetten.overheid.nl/BWBR0011353#Artikel6.33
