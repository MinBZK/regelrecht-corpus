      1 Het in een participatiemaatschappij gestorte kapitaal en het door die maatschappij aangetrokken vreemd vermogen
      dienen te zamen ten minste € 4 537 802 te bedragen.

      2 De door een participatiemaatschappij verstrekte, achtergestelde geldlening, bedoeld in
      [artikel 5.18, tweede lid, onderdeel a, van de wet][ref1] en de door haar gehouden deelneming, bedoeld
      in het [tweede lid, onderdeel a, van dat artikel][ref2], bedragen te zamen ten hoogste € 226 890 per
      beginnende ondernemer. De in de eerste volzin bedoelde leningen en deelnemingen kunnen voor geen langere
      periode dan voor de duur van acht jaren, te rekenen vanaf het tijdstip van verstrekking van de lening,
      onderscheidenlijk de verwerving van de deelneming, worden aangemerkt als achtergestelde geldlening als bedoeld
      in [artikel 5.18, tweede lid, onderdeel a, van de wet][ref3], onderscheidenlijk als deelneming als bedoeld in
      [artikel 5.18, tweede lid, onderdeel a, van de wet][ref4].

      3 Als een achtergestelde geldlening als bedoeld in [artikel 5.18, tweede lid, onderdeel a, van de wet][ref5] wordt
      aangemerkt de geldlening ter zake waarvan in de overeenkomst is opgenomen dat de lening jegens andere schuldeisers,
      gedurende ten minste de eerste acht jaren na het overeenkomen van de geldlening, een lagere rang inneemt dan is
      bepaald in [artikel 277, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref6], en die, in geval de beginnende
      ondernemer een natuurlijk persoon is, dient ter financiering van bestanddelen die bij de beginnende ondernemer
      behoren tot het verplichte ondernemingsvermogen van die onderneming en, in geval de beginnende ondernemer
      een rechtspersoon is, bij de rechtspersoon dient ter financiering van bestanddelen die tot het verplichte
      ondernemingsvermogen zouden behoren indien de onderneming van de rechtspersoon voor rekening van een natuurlijk
      persoon zou worden gedreven.

      4 Als een deelneming als bedoeld in [artikel 5.18, tweede lid, onderdeel a, van de wet][ref7] wordt aangemerkt de
      deelneming waarbij het in de rechtspersoon te storten kapitaal dient ter financiering van bestanddelen die tot het
      verplichte ondernemingsvermogen zouden behoren indien de onderneming van de rechtspersoon voor rekening van een
      natuurlijk persoon zou worden gedreven.

      5 Met betrekking tot het verzoek om aanwijzing als participatiemaatschappij, de afhandeling van dat verzoek, de
      informatieverstrekking , de intrekking, alsmede het publiek bekend maken van de aanwijzing en intrekking van de
      aanwijzing zijn de [artikelen 29 tot en met 29b][ref8] van overeenkomstige toepassing.


