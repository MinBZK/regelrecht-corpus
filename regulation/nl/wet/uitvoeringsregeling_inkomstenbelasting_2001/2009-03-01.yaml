        artikel: '3.125'
  - number: '5'
    text: |-
      Bij het bepalen van de winst van het eerste kalenderjaar als ondernemer komt mede in aftrek het totale bedrag van
      de kosten en lasten die zijn gemaakt in de vijf daaraan voorafgaande kalenderjaren en die verband houden met het
      starten van de onderneming, voorzover:

      a. er in die periode geen opbrengsten tegenover hebben gestaan en

      b. zij niet ten laste van het belastbaar inkomen uit werk en woning kunnen of konden worden gebracht.
    url: https://wetten.overheid.nl/BWBR0012031/2009-03-01#Artikel5
  - number: '6'
    text: |-
      1 Als regelingen ten behoeve van de ontwikkeling en instandhouding van bos en natuur en als overeenkomsten
      die op die regelingen vooruitlopen, als bedoeld in [artikel 3.13, eerste lid, onderdeel g, van de wet][ref1]
      worden aangewezen: de Tijdelijke regeling particulier natuurbeheer zoals die luidde tot 1 januari 2000,
      de [Subsidieregeling natuurbeheer 2000][ref2] zoals die luidde tot 1 januari 2007, de Subsidieregeling
      natuurbeheer van de onderscheiden provincies, de [Subsidieregeling agrarisch natuurbeheer][ref3]
      zoals die luidde tot 1 januari 2007, voor zover betrekking hebbend op de landschapssubsidie bedoeld in
      [artikel 2, aanhef en onderdeel b, van die regeling][ref4], de Subsidieregeling agrarisch natuurbeheer van de
      onderscheiden provincies voor zover betrekking hebbend op de landschapssubsidie bedoeld in artikel 2, eerste lid,
      aanhef en onderdeel b, van die regeling, respectievelijk de in het tweede lid genoemde overeenkomsten.

      2 De in het eerste lid bedoelde overeenkomsten betreffen:

      a. de overeenkomsten met het Bureau Beheer Landbouwgronden

      1°. met het door de Dienst Landelijk Gebied toegekende nummer: 005/9001 van 29 mei 1996;

      2°. met het door de Dienst Landelijk Gebied toegekende nummer: 008/9001 van 30 mei 1996;

      3°. met het door de Dienst Landelijk Gebied toegekende nummer: 004/9001 van 27 oktober 1997;

      4°. met het door de Dienst Landelijk Gebied toegekende nummer: 003/9001 van 15 december 1997;

      b. de beschikkingen van de minister van Landbouw, Natuurbeheer en Visserij van 18 april 1998 met de
      beschikkingnummers kaderwet/pnb/01, kaderwet/pnb/02 en kaderwet/pnb/03.

      3 Van de voordelen die worden genoten op grond van de in het eerste lid bedoelde regelingen en overeenkomsten
      behoort 90% niet tot de winst. In afwijking van de eerste volzin behoort van de voordelen die worden
      genoten op grond van de [Subsidieregeling natuurbeheer 2000][ref5] zoals die luidde tot 1 januari 2007, de
      Subsidieregeling natuurbeheer van de onderscheiden provincies, de [Subsidieregeling agrarisch natuurbeheer][ref6]
      zoals die luidde tot 1 januari 2007, voor zover betrekking hebbend op de landschapssubsidie bedoeld in
      [artikel 2, aanhef en onderdeel b, van die regeling][ref7] respectievelijk de Subsidieregeling agrarisch
      natuurbeheer van de onderscheiden provincies voor zover betrekking hebbend op de landschapssubsidie bedoeld in
      [artikel 2, eerste lid, aanhef en onderdeel b, van die regeling][ref8], 100% niet tot de winst.


