  - number: '30'
    text: |-
      Met betrekking tot een kalenderjaar wordt als beginnende ondernemer als bedoeld in
      [artikel 5.17, derde lid, onderdeel a, van de wet][ref1] aangemerkt de natuurlijke persoon die naar verwachting
      met betrekking tot dat jaar of het daaropvolgende jaar in aanmerking komt voor zelfstandigenaftrek en ten aanzien
      van wie deze aftrek over nog niet meer dan zeven jaren is toegepast, dan wel, ingeval hij in het kalenderjaar een
      onderneming of een gedeelte van een onderneming overneemt, over nog niet meer dan veertien jaren is toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.17
    url: https://wetten.overheid.nl/BWBR0012031/2009-03-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5.17'
  - number: '31'
    text: |-
      De beginnende ondernemer als bedoeld in [artikel 5.17, derde lid, onderdeel b, van de wet][ref1], is een
      rechtspersoon die ten tijde van het verstrekken van de achtergestelde lening aan hem, onderscheidenlijk het nemen
      van een deelneming in hem moet voldoen aan de volgende voorwaarden:

      a. de rechtspersoon is een besloten vennootschap met beperkte aansprakelijkheid of naamloze vennootschap, die niet
      langer dan acht jaren geleden tot stand is gekomen, dan wel een rechtspersoon met een in aandelen verdeeld kapitaal
      die:

      1°. is opgericht naar het recht van de Nederlandse Antillen, Aruba, een lidstaat van de Europese Unie of een staat
      in de relatie waarmee een met Nederland gesloten verdrag ter voorkoming van dubbele belasting van toepassing is
      waarin een bepaling is opgenomen die discriminatie naar nationaliteit verbiedt voor rechtspersonen die overigens
      in dezelfde omstandigheden verkeren als een naar Nederlands recht opgerichte besloten vennootschap met beperkte
      aansprakelijkheid of naamloze vennootschap;

      2°. naar aard en inrichting vergelijkbaar is met de besloten vennootschap met beperkte aansprakelijkheid of
      naamloze vennootschap; en

      3°. niet langer dan acht jaren geleden tot stand is gekomen;

      b. voor rekening van de rechtspersoon wordt in Nederland een onderneming gedreven van een zodanige omvang dat de
      bij hem in dienst zijnde personen te zamen naar verwachting daaraan jaarlijks ten minste 1225 uren besteden;

      c. de voor rekening van de rechtspersoon gedreven onderneming is geen voortzetting van een onderneming die, of een
      gedeelte van een onderneming, dat meer dan acht jaren geleden direct of indirect is gedreven voor rekening van een
      persoon die thans onmiddellijk of middellijk aandeelhouder is in de rechtspersoon;

      d. de rechtspersoon voldoet aan ten minste twee van de in
      [artikel 396, eerste lid, onderdelen a, b, en c, van Boek 2 van het Burgerlijk Wetboek][ref2] vermelde vereisten;

      e. de feitelijke werkzaamheid van de rechtspersoon bestaat niet in het, onmiddellijk of middellijk, beleggen van
      vermogen of daarmee overeenkomende werkzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5.17
      [ref2]: https://wetten.overheid.nl/BWBR0003045
