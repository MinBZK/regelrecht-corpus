    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt verstaan onder:

      a. inspecteur: de voorzitter van het managementteam van de Belastingdienst/Amsterdam;

      b. groenproject: een project waarvoor ingevolge de [Regeling groenprojecten 2005][ref1],
      de [Regeling groenprojecten buitenland 2002][ref2] dan wel de
      [Regeling groenprojecten Nederlandse Antillen en Aruba 2002][ref3] een verklaring als bedoeld in
      [artikel 5.14, derde lid, van de wet][ref4] is afgegeven;

      c. sociaal-ethisch project: een project waarvoor ingevolge de [Regeling sociaal-ethische projecten 2005][ref5] een
      verklaring als bedoeld in [artikel 5.15, derde lid, van de wet][ref6] is afgegeven;

      d. cultureel project: een project waarvoor ingevolge de [Regeling cultuurprojecten 2004][ref7] een verklaring als
      bedoeld in [artikel 5.18a, derde lid, van de wet][ref8] is afgegeven;

      e. project: groenproject, sociaal-ethisch project of cultureel project;

      f. groenfonds: bank of beleggingsinstelling die voldoet aan de voorwaarden van
      [artikel 5.14, tweede lid, van de wet][ref9] en die door de inspecteur ingevolge
      [artikel 5.14, eerste lid, van de wet][ref10] is aangewezen;

      g. sociaal-ethisch fonds: bank of beleggingsinstelling die voldoet aan de voorwaarden
      van [artikel 5.15, tweede lid, van de wet][ref11] en die door de inspecteur ingevolge
      [artikel 5.15, eerste lid, van de wet][ref12] is aangewezen;

      h. cultuurfonds: bank of beleggingsinstelling die voldoet aan de voorwaarden van
      [artikel 5.18a, tweede lid, van de wet][ref13] en die door de inspecteur ingevolge
      [artikel 5.18a, eerste lid, van de wet][ref14] is aangewezen;

      i. fonds: een groenfonds, een sociaal-ethisch fonds of een cultuurfonds;

      j. participatiemaatschappij: een rechtspersoon die voldoet aan de voorwaarden van
      [artikel 5.18, tweede lid, van de wet][ref15] en die door de inspecteur ingevolge
      [artikel 5.18, eerste lid, van de wet][ref16] is aangewezen;

      k. hoofdzakelijkheidscriterium: de voorwaarde inzake hoofdzakelijk als bedoeld in
      [artikel 5.14, tweede lid][ref17], onderscheidenlijk [artikel 5.15, tweede lid][ref18],
      [artikel 5.18, tweede lid][ref19], of [artikel 5.18a, tweede lid, van de wet][ref20];

      l. aanloopperiode: de periode, bedoeld in [artikel 5.14, vierde lid][ref21],
      onderscheidenlijk [artikel 5.15, vierde lid][ref22], [artikel 5.18, vierde lid][ref23], of
      [artikel 5.18a, vierde lid, van de wet][ref24];

      m. ingroeiperiode: de periode, bedoeld in [artikel 5.14, vijfde lid][ref25],
      onderscheidenlijk [artikel 5.15, vijfde lid][ref26], [artikel 5,18, vierde lid][ref27], of
      [artikel 5.18a, vijfde lid, van de wet][ref28].


