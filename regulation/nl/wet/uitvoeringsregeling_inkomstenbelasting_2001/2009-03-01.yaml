      1 Ingeval een spaarrekening eigen woning meer dan één rekeninghouder heeft, wordt het tegoed van de rekening in
      gelijke delen toegerekend aan die rekeninghouders.

      2 Ingeval een beleggingsrecht eigen woning meer dan één eigenaar heeft, wordt de waarde van het recht in gelijke
      delen toegerekend aan die eigenaren.
    url: https://wetten.overheid.nl/BWBR0012031/2009-03-01#Artikel17bis
  - number: 17a
    text: |-
      1 Voor de toepassing van [artikel 3.119a van de wet][ref1]:

      a. wordt de eigenwoningreserve die is gevormd voor het ontstaan van een algehele huwelijksgemeenschap bij
      ontbinding van die gemeenschap op gezamenlijk verzoek van de belastingplichtige en zijn echtgenoot of gewezen
      echtgenoot verdeeld in de onderlinge verhouding waarin zij tot de gemeenschap gerechtigd zijn. Het verzoek wordt
      uiterlijk gedaan bij de aangifte over het jaar waarin de algehele huwelijksgemeenschap wordt ontbonden. Op dit
      verzoek kan niet worden teruggekomen;

      b. wordt een woning zolang deze ten aanzien van de echtgenoot van de belastingplichtige als eigen woning wordt
      aangemerkt ten aanzien van de belastingplichtige mede als eigen woning aangemerkt indien de woning tot een
      huwelijksgemeenschap behoort of gaat behoren.

      2 Indien in de overeenkomst ter zake van de verwerving van een eigen woning, ten behoeve van de uitvoering van
      het woonbeleid van het Rijk of een gemeente, een clausule is opgenomen op grond waarvan bij niet nakoming van die
      clausule een bedrag verschuldigd is, kan bij de vervreemding van die woning het bedrag dat terzake van het niet
      nakomen van de clausule is betaald in mindering worden gebracht op het vervreemdingssaldo eigen woning.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.119a
    url: https://wetten.overheid.nl/BWBR0012031/2009-03-01#Artikel17a
