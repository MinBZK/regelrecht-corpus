  - number: 41d
    text: |-
      Als mogendheid als bedoeld in [artikel 6.33, eerste lid, onderdeel b en onderdeel c, van de wet][ref1]
      wordt aangewezen elke mogendheid waarmee in de relatie met Nederland voor de heffing van inkomstenbelasting,
      vennootschapsbelasting, successie- en schenkingsrecht zonder beperkingen of voorbehouden de uitwisseling is
      geregeld van gegevens, inlichtingen en gegevensdragers.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6.33
    url: https://wetten.overheid.nl/BWBR0012031/2009-03-01#Artikel41d
    references:
