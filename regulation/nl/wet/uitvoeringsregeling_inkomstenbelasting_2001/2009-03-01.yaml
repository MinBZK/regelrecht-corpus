  - number: '44'
    text: (GERESERVEERD)
    url: https://wetten.overheid.nl/BWBR0012031/2009-03-01#Artikel44
  - number: 44a
    text: |-
      Voor de toepassing van [artikel 8.9a van de wet][ref1] worden, voorzover het niet gaat om lidstaten van de Europese
      Unie, als de in die bepalingen bedoelde mogendheden aangewezen alle mogendheden waarmee Nederland een regeling ter
      voorkoming van dubbele belasting is overeengekomen, waarvan de bepalingen van toepassing zijn, met uitzondering
      van Zwitserland.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.9a
    url: https://wetten.overheid.nl/BWBR0012031/2009-03-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 8.9a
  - number: 44b
    text: |-
      Aan het in [artikel 8.14a, eerste lid, onderdeel b, onder 2°, van de wet][ref1] opgenomen vereiste behoeft niet te
      worden voldaan gedurende de periode van het kalenderjaar dat het kind, bedoeld in het eerste lid, onderdeel b, van
      dat artikel, tegelijkertijd tot het huishouden van beide ouders heeft behoord en het kind op hetzelfde woonadres
      als een van die ouders staat ingeschreven in de basisadministratie persoonsgegevens.

      Voor de toepassing van de eerste volzin behoort het kind tegelijkertijd tot het huishouden van beide ouders indien
      het kind doorgaans tenminste drie gehele dagen per week tot het huishouden van de belastingplichtige en voor de
      overige tijd doorgaans tot het huishouden van de andere ouder behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8.14a
    url: https://wetten.overheid.nl/BWBR0012031/2009-03-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 8.14a
  - number: 44c
    text: |-
      1 De ouderschapsverlofkorting bedraagt per uur ouderschapsverlof 1/8 van 50% van het wettelijke minimumloon per
      werkdag, zoals bepaald bij of krachtens [artikel 8 van de Wet minimumloon en minimumvakantiebijslag][ref1]. Eerst
      nadat voor het totaal aantal uren ouderschapsverlof in het kalenderjaar aldus het bedrag aan korting is bepaald,
      wordt de regel toegepast dat de korting niet meer kan bedragen dan het in het voorafgaande kalenderjaar genoten
      belastbare loon verminderd met het in het kalenderjaar genoten belastbare loon.

      2 Voor de toepassing van de wet en het eerste lid wordt uitgegaan van het wettelijke minimumloon zoals dat per
      1 januari van het kalenderjaar waarin de ouderschapsverlofkorting geldt, is vastgesteld.

      3 Indien de belastingplichtige in het voorafgaande kalenderjaar eveneens gebruik heeft gemaakt van zijn recht
      op ouderschapsverlof als bedoeld in [hoofdstuk 6 van de Wet arbeid en zorg][ref2], kan voor de toepassing van
      [artikel 8.14b, tweede lid, van de wet][ref3] in plaats van het in het voorafgaande kalenderjaar genoten belastbare
      loon worden uitgegaan van het in het kalenderjaar voorafgaand aan het ouderschapsverlof genoten belastbare loon.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel8.14b
    url: https://wetten.overheid.nl/BWBR0012031/2009-03-01#Artikel44c
