        artikel: '6.33'
  - number: 41c
    text: |-
      1 Bij een verzoek een categorie instellingen dan wel een groep van met elkaar verbonden
      instellingen bij één voor bezwaar vatbare beschikking aan te merken als instellingen als bedoeld in
      [artikel 6.33, eerste lid, onderdeel b, van de wet][ref1] (gemeenschappelijke aanwijzing), wordt in het verzoek
      aangegeven op welke instellingen het verzoek betrekking heeft.

      2 Een instelling waarop een verzoek voor een gemeenschappelijke aanwijzing betrekking heeft
      doch die niet voldoet aan de voorwaarden voor aanmerking als een instelling als bedoeld in
      [artikel 6.33, eerste lid, onderdeel b, van de wet][ref2], wordt niet in de gemeenschappelijke aanwijzing
      opgenomen.

      3 Een beschikking inzake een gemeenschappelijk aanwijzing kan ten aanzien van ieder van de aldus
      aangemerkte instellingen afzonderlijk worden ingetrokken, met ingang van het tijdstip waarop die
      instelling niet meer voldoet aan de voorwaarden voor aanmerking als een instelling als bedoeld in
      [artikel 6.33, eerste lid, onderdeel b, van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6.33
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6.33
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel6.33
    url: https://wetten.overheid.nl/BWBR0012031/2009-03-01#Artikel41c
