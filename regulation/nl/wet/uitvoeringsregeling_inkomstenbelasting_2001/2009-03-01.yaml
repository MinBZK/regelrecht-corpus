      1 Een voorlopige verliesverrekening als bedoeld in [artikel 3.152, vijfde lid, van de wet][ref1] kan worden
      verleend indien het verlies over een kalenderjaar wordt aangegeven door de in de uitnodiging tot het doen van
      aangifte gevraagde gegevens en bescheiden en andere gegevensdragers of de inhoud daarvan duidelijk, stellig en
      zonder voorbehoud in te vullen en te ondertekenen en de gevraagde bescheiden of andere gegevensdragers in te
      leveren of toe te zenden.

      2 Bij de berekening van de voorlopige verliesverrekening wordt het vermoedelijke verlies voor 80 percent in
      aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.152
