  - number: '29'
    text: |-
      1 Een verzoek om aanwijzing als fonds wordt schriftelijk gedaan bij de inspecteur onder overlegging van:

      a. de statuten van het fonds;

      b. een afschrift van de inschrijving in het register, bedoeld in
      [artikel 1:107 van de Wet op het financieel toezicht][ref1]; en

      c. een opgave van de feitelijke werkzaamheden en voorgenomen werkzaamheden van het fonds.

      2 Bij een verzoek om aanwijzing als fonds met een ingroeiperiode worden tevens overgelegd:

      a. een ingroeiplan op grond waarvan het aannemelijk is dat binnen drie maanden na de aanwijzing ten minste 30
      percent van het vermogen van het fonds is belegd in projecten dan wel bestaat uit kredieten ten behoeve van
      projecten;

      b. een ingroeischema op grond waarvan het aannemelijk is dat uiterlijk twee jaren na de aanwijzing ten minste
      70 percent van het vermogen van het fonds is belegd in projecten dan wel bestaat uit kredieten ten behoeve van
      projecten.

      3 De inspecteur beslist op het verzoek tot aanwijzing bij voor bezwaar vatbare beschikking.

      4 De aanwijzing vindt plaats met ingang van de datum waarop het verzoek is ingediend, dan wel met ingang van een
      latere datum indien daarom is verzocht.

      5 De inspecteur maakt het aanwijzen als een fonds als bedoeld in [artikel 28, onderdeel i][ref2], op een daartoe
      geschikte wijze publiek bekend. Indien de inspecteur een aanwijzing intrekt, maakt hij die intrekking ook op een
      daartoe geschikte wijze publiek bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1107
      [ref2]: https://wetten.overheid.nl/BWBR0012031#Artikel28
