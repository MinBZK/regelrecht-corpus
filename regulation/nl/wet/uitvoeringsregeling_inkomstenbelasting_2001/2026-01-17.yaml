  - number: '1.2'
    text: 'Deze regeling verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel1
  - number: 1.2.a
    text: |-
      wet: [Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 1.2.b
    text: |-
      inhoudingsplichtige: de inhoudingsplichtige als bedoeld in de [Wet op de loonbelasting 1964][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: 1.2.c
    text: |-
      openbaar vervoer: voor een ieder openstaand personenvervoer volgens een dienstregeling met een auto, bus, trein,
      tram, metro, veerpont of een via een geleidesysteem voortbewogen voertuig.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel1
  - number: '2'
    text: |-
      Een kind wordt in belangrijke mate op kosten van de ouder onderhouden indien de op de ouder drukkende bijdrage
      in de kosten van het onderhoud van het kind ten minste € 547 per kwartaal beloopt. De ouder wordt geacht een
      kind in belangrijke mate op zijn kosten te onderhouden indien hij voor het kind recht heeft op kinderbijslag
      ingevolge de [Algemene Kinderbijslagwet][ref1] of op een tegemoetkoming volgens een naar aard en strekking met de
      [Algemene Kinderbijslagwet][ref2] overeenkomende buitenlandse regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002368
      - id: ref2
        bwb_id: BWBR0002368
  - number: 2a.1
    text: |-
      Een aanspraak op periodieke uitkeringen waarvan de uitkeringen zijn ingegaan en waarvan de hoogte van
      de uitkeringen niet voor de gehele uitkeringsperiode in geldeenheden is vastgesteld, wordt op grond van
      [artikel 1.7, derde lid, van de wet][ref1] gelijkgesteld met een aanspraak op vaste en gelijkmatige periodieke
      uitkeringen indien wordt voldaan aan de hierna opgenomen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0002368
  - number: 2a.2
    text: 'Met betrekking tot de uitkeringen en de administratieve vormgeving daarvan gelden de volgende regels:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.2.a
    text: |-
      de termijnen van een oudedagslijfrente of een tijdelijke oudedagslijfrente als bedoeld in
      [artikel 3.125, eerste lid, onderdeel a, respectievelijk onderdeel c, van de wet][ref1] worden op de ingangsdatum
      uitgedrukt in een vast aantal beleggingseenheden (units) per jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 2a.2.b
    text: |-
      indien bij een of meer van de onder a genoemde lijfrenten een nabestaandenlijfrente als bedoeld in
      [artikel 3.125, onderdeel b, van de wet][ref1] is meeverzekerd, dient deze op de ingangsdatum van de lijfrente
      waarbij deze is meeverzekerd te worden uitgedrukt in een vast aantal beleggingseenheden per jaar; in plaats daarvan
      kan op die ingangsdatum voor de nabestaandenlijfrente een kapitaal worden bepaald dat dient als rekengrootheid voor
      de vaststelling van de hoogte van de termijnen van de nabestaandenlijfrente in beleggingseenheden of euro’s; indien
      de nabestaandenlijfrente niet een lijfrente in beleggingseenheden of een gerichte lijfrente is, maar is verzekerd
      als een recht op uitkeringen in euro’s, wordt de nabestaandenlijfrente geadministreerd als een zelfstandig recht
      ten opzichte van de in onderdeel a genoemde lijfrenten;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 2a.2.c
    text: |-
      de hoogte van de uiteindelijk in euro’s uit te keren termijnen van lijfrente dient uitsluitend te worden
      beïnvloed door het verschil tussen het feitelijk behaalde beleggingsrendement en de rekenrente die ten tijde van
      het ingaan van de lijfrente als rekenrendement is gehanteerd. Daartoe wordt de contante waarde van de termijnen
      in beleggingseenheden actuarieel bijgehouden overeenkomstig de wijze waarop dat geschiedt voor termijnen van
      lijfrenten in euro’s.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.3
    text: 'Met betrekking tot de tariefgrondslagen voor het berekenen van de uitkeringen gelden de volgende regels:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.3.a
    text: |-
      de verzekeraar van de lijfrente gaat op de ingangsdatum van de lijfrente uit van sterftegrondslagen die passen bij
      de sterfterisico’s van de verzekerde rechten;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.3.b
    text: |-
      de verzekeraar van de lijfrente gaat ter berekening van het op jaarbasis uit te keren vaste aantal
      beleggingseenheden uit van ten hoogste het netto rekenrendement dat hij op de ingangsdatum hanteert voor
      soortgelijke lijfrenten in euro’s of van het op de ingangsdatum van de lijfrente geldende u-rendement zoals
      dat periodiek wordt gepubliceerd door het Centrum voor Verzekeringstatistiek van het Verbond van Verzekeraars;
      gedurende de looptijd vindt geen herberekening plaats van het aantal jaarlijks uit te keren beleggingseenheden;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.3.c
    text: in de hoogte van de termijnen van lijfrente in beleggingseenheden wordt geen inflatie-element verdisconteerd.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.4
    text: |-
      Jaarlijks verwerkt de verzekeraar, overeenkomstig de bij lijfrenteverzekeringen met uitkeringen in euro’s te
      hanteren handelwijze, de actuariële gevolgen van de op de ingangsdatum veronderstelde tariefgrondslagen in de
      administratie van de contante waarde van de uitkeringen in beleggingseenheden en in de administratie van de
      beleggingswaarde zelf.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.5
    text: |-
      Met betrekking tot de peildatum en de periode van vaststellen van de uitkeringen in euro’s gelden de volgende
      regels:
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.5.a
    text: |-
      bij de berekening van de per vervallen termijn verschuldigde uitkering in euro’s kan worden uitgegaan van de waarde
      van de beleggingseenheid op een vaste peildatum in de kalendermaand van betaling of in de daaraan voorafgaande
      kalendermaand;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.5.b
    text: |-
      gedurende een periode van ten hoogste 12 maanden (herrekenperiode) kunnen de in de herrekenperiode uit te keren
      termijnen bij aanvang daarvan in euro’s worden vastgesteld; de hoogte van de uitkeringen in euro’s dient daarbij
      te worden bepaald op basis van de werkelijke waarde van de beleggingseenheid per een vaste peildatum gelegen in de
      kalendermaand waarin de herrekenperiode ingaat of in een van de twee daaraan voorafgaande kalendermaanden; slechts
      eenmalig kan worden gekozen voor een datum van ingang van de herrekenperiode.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.6
    text: |-
      Met betrekking tot meeverzekerde nabestaandenlijfrenten en tot de wijze van rekening houden met het overlijden van
      verzekerden gelden de volgende regels:
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.6.a
    text: |-
      in de in het tweede lid, onderdeel b, genoemde gevallen waarin een of meer nabestaandenlijfrenten zijn
      meeverzekerd, dient bij de vaststelling van de hoogte van de termijnen van de lijfrenten als bedoeld in het tweede
      lid, onderdeel a, voor iedere meeverzekerde nabestaandenlijfrente op actuarieel verantwoorde wijze rekening te
      worden gehouden met het feit dat die nabestaandenlijfrente is meeverzekerd;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2a.6.b
    text: |-
      indien een meeverzekerde nabestaandenlijfrente op de ingangsdatum van een van de in het tweede lid, onderdeel
      a, genoemde lijfrenten is uitgedrukt in een jaarlijks vast aantal beleggingseenheden, wordt bij overlijden van
      een verzekerde zowel de contante waarde van de beleggingseenheden als de totale beleggingswaarde herrekend.
      Het overlijden dient daarbij geen invloed te hebben op de waarde per beleggingseenheid. Een vrijval van de
      beleggingswaarde bij overlijden komt, overeenkomstig de bij uitkeringen in euro’s te hanteren handelwijze, ten
      goede aan de verzekeraar in verband met het door deze gelopen langlevenrisico.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2a
  - number: 2b.1
    text: |-
      Een aanspraak op termijnen als bedoeld in [artikel 3.126a, vierde en zesde lid, van de wet][ref1] waarvan
      de termijnen zijn ingegaan en waarvan de hoogte van de termijnen niet voor de gehele uitkeringsperiode
      in geldeenheden is vastgesteld, wordt op grond van artikel 3.126a, zevende lid, in verbinding met
      [artikel 1.7, derde lid, van de wet][ref2] gelijkgesteld met een aanspraak op vaste en gelijkmatige termijnen
      indien wordt voldaan aan de hierna opgenomen regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel1
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '1'
  - number: 2b.2
    text: 'Met betrekking tot de termijnen en de administratieve vormgeving daarvan gelden de volgende regels:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2b
  - number: 2b.2.a
    text: de termijnen worden op de ingangsdatum uitgedrukt in een vast aantal beleggingseenheden (units) per jaar;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2b
  - number: 2b.2.b
    text: |-
      de hoogte van de uiteindelijk in euro’s uit te keren termijnen dient uitsluitend te worden beïnvloed door het
      verschil tussen het feitelijk behaalde beleggingsrendement en de rekenrente die ten tijde van het ingaan van de
      termijnen als rekenrendement is gehanteerd.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2b
  - number: 2b.3
    text: 'Met betrekking tot de grondslagen voor het berekenen van de termijnen gelden de volgende regels:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2b
  - number: 2b.3.a
    text: |-
      de bank, beleggingsonderneming of beheerder, bedoeld in [artikel 3.126a, eerste lid, van de wet][ref1], gaat
      ter berekening van het op jaarbasis uit te keren vaste aantal beleggingseenheden uit van ten hoogste het netto
      rekenrendement dat hij op de ingangsdatum hanteert voor soortgelijke termijnen in euro’s of van het op de
      ingangsdatum van de termijnen geldende u-rendement zoals dat periodiek wordt gepubliceerd door het Centrum voor
      Verzekeringstatistiek van het Verbond van Verzekeraars; gedurende de looptijd vindt geen herberekening plaats van
      het aantal jaarlijks uit te keren beleggingseenheden;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 2b.3.b
    text: in de hoogte van de termijnen in beleggingseenheden wordt geen inflatie-element verdisconteerd.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2b
  - number: 2b.4
    text: 'Met betrekking tot de peildatum en de periode van vaststellen van de termijnen in euro’s gelden de volgende regels:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2b
  - number: 2b.4.a
    text: |-
      bij de berekening van de verschuldigde termijn in euro’s kan worden uitgegaan van de waarde van de
      beleggingseenheid op een vaste peildatum in de kalendermaand van betaling of in de daaraan voorafgaande
      kalendermaand;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2b
  - number: 2b.4.b
    text: |-
      gedurende een periode van ten hoogste 12 maanden (herrekenperiode) kunnen de in de herrekenperiode uit te keren
      termijnen bij aanvang daarvan in euro’s worden vastgesteld; de hoogte van de termijnen in euro’s dient daarbij te
      worden bepaald op basis van de werkelijke waarde van de beleggingseenheid per een vaste peildatum gelegen in de
      kalendermaand waarin de herrekenperiode ingaat of in een van de twee daaraan voorafgaande kalendermaanden; slechts
      eenmalig kan worden gekozen voor een datum van ingang van de herrekenperiode.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel2b
  - number: '3'
    text: |-
      Voor de toepassing van [artikel 2.2, eerste lid, van de wet][ref1], worden, voorzover het niet gaat om lidstaten
      van de Europese Unie, als de in die bepaling bedoelde mogendheden aangewezen alle mogendheden waarmee Nederland een
      regeling ter voorkoming van dubbele belasting is overeengekomen, waarvan de bepalingen van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: '4'
    text: |-
      Bij de tijdsevenredige vermindering, bedoeld in [artikel 2.7, tweede lid, van de wet][ref1], van de heffingskorting
      voor de inkomstenbelasting wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 4.a
    text: een kalenderjaar op 360 dagen gesteld;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4
  - number: 4.b
    text: een kalendermaand op 30 dagen gesteld;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4
  - number: 4.c
    text: de dag waarop het tijdvak aanvangt als een gehele dag in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4
  - number: 4.d
    text: de dag waarop het tijdvak eindigt niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4
  - number: 4a.1
    text: |-
      Degene die als begunstigde een juridisch afdwingbaar recht heeft ten laste van een afgezonderd particulier
      vermogen, wordt in zoverre in de belastingheffing betrokken.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
  - number: 4a.2
    text: |-
      Indien aan twee of meer personen de bezittingen en schulden alsmede de opbrengsten en uitgaven van een afgezonderd
      particulier vermogen worden toegerekend, wordt bij deze toerekening aangesloten bij de waarde van hetgeen ten
      tijde van de afzondering door ieder van de bedoelde personen of hun rechtsvoorgangers is afgezonderd in de zin
      van [artikel 2.14a, derde lid, van de wet][ref1]. Met uitkeringen uit het vermogen van het afgezonderd particulier
      vermogen wordt op overeenkomstige wijze rekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 4a.3
    text: |-
      Ingeval bij een afzondering van vermogen in een afgezonderd particulier vermogen niet bekend is welk vermogen door
      iemand is afgezonderd, vindt toerekening van dit vermogen plaats naar rato van het aantal personen dat vermogen
      daarin heeft afgezonderd.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
  - number: 4a.4
    text: |-
      Onder het onder in het maatschappelijk verkeer ongebruikelijke voorwaarden rechtens dan wel in feite,
      direct of indirect, afzonderen van vermogensbestanddelen in een afgezonderd particulier vermogen, bedoeld in
      [artikel 2.14a, derde lid, onderdeel a, van de wet][ref1], wordt mede verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 4a.4.a
    text: |-
      het vervreemden van vermogensbestanddelen aan een afgezonderd particulier vermogen tegen een prijs die afwijkt van
      de waarde in het economische verkeer;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
  - number: 4a.4.b
    text: |-
      het bedingen van voorwaarden bij het vervreemden van vermogensbestanddelen aan een afgezonderd particulier vermogen
      die niet overeenkomen met voorwaarden die in het maatschappelijk verkeer gebruikelijk zijn;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
  - number: 4a.4.c
    text: |-
      het inbrengen van vermogensbestanddelen in een afgezonderd particulier vermogen waarbij de inbreng en daarmee
      samenhangende rechtshandelingen gericht zijn op of direct of indirect verband houden met het ontgaan of uitstellen
      van de toerekening, bedoeld in [artikel 2.14a, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 4a.5
    text: |-
      Bezittingen en schulden van een afgezonderd particulier vermogen worden in aanmerking genomen naar de waarde in het
      economisch verkeer die zou gelden als deze bezittingen en schulden deel zouden uitmaken van het vermogen van degene
      aan wie de bezittingen en schulden van het afgezonderd particulier vermogen worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
  - number: 4a.6
    text: |-
      De erfgenaam die gebruik wil maken van de tegenbewijsregeling, bedoeld in
      [artikel 2.14a, zesde lid, van de wet][ref1], dient ten minste de volgende gegevens aan de inspecteur over te
      leggen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 4a.6.a
    text: een beschrijving van het soort afgezonderd particulier vermogen en land van vestiging;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
  - number: 4a.6.b
    text: |-
      de oprichtingsakte van het afgezonderd particulier vermogen inclusief bijlagen (zoals instructies, reglementen,
      letter of wishes, statuten);
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
  - number: 4a.6.c
    text: de meest actuele jaarstukken van het afgezonderd particulier vermogen over minimaal drie jaren;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
  - number: 4a.6.d
    text: naam- en adresgegevens van de inbrenger van het vermogen en van de overige erfgenamen;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
  - number: 4a.6.e
    text: |-
      alle overige stukken waaruit blijkt dat de bedoelde erfgenaam geen begunstigde is van het afgezonderd particulier
      vermogen en dit in de toekomst ook nooit kan worden.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel4a
  - number: '5'
    text: |-
      Bij het bepalen van de winst van het eerste kalenderjaar als ondernemer komt mede in aftrek het totale bedrag van
      de kosten en lasten die zijn gemaakt in de vijf daaraan voorafgaande kalenderjaren en die verband houden met het
      starten van de onderneming, voorzover:
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel5
  - number: 5.a
    text: er in die periode geen opbrengsten tegenover hebben gestaan en
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel5
  - number: 5.b
    text: zij niet ten laste van het belastbaar inkomen uit werk en woning kunnen of konden worden gebracht.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel5
  - number: '6.1'
    text: |-
      Als regelingen ten behoeve van de ontwikkeling en instandhouding van bos en natuur of overeenkomsten die op die
      regelingen vooruitlopen als bedoeld in [artikel 3.13, eerste lid, onderdeel g, van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 6.1.a
    text: de Tijdelijke regeling particulier natuurbeheer zoals die luidde tot 1 januari 2000;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: 6.1.b
    text: |-
      de [Subsidieregeling natuurbeheer 2000][ref1] zoals die luidde tot 1 januari 2007;


      [ref1]: https://wetten.overheid.nl/BWBR0010999
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0010999
  - number: 6.1.c
    text: de Subsidieregeling natuurbeheer van de onderscheiden provincies;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: 6.1.d
    text: |-
      de Subsidieverordening natuur- en landschapsbeheer van de onderscheiden provincies, voor zover betrekking hebbende
      op de subsidie natuurbeheer, bedoeld in artikel 3.1 van die verordening, en de subsidie landschapsbeheer, bedoeld
      in artikel 5.1.1.1 van die verordening;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: 6.1.e
    text: |-
      de Subsidieregeling kwaliteitsimpuls natuur en landschap van de onderscheiden provincies, voor zover betrekking
      hebbende op de investeringssubsidie, bedoeld in artikel 8, eerste, derde en vierde lid, van die regeling, en de
      subsidie functieverandering, bedoeld in artikel 15 van die regeling;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: 6.1.f
    text: |-
      de Subsidieregeling natuur- en landschapsbeheer 2016 van de onderscheiden provincies, voor zover betrekking
      hebbende op de subsidie natuur- en landschapsbeheer, bedoeld in artikel 2.2 van die regeling;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: 6.1.g
    text: 'de overeenkomsten met het Bureau Beheer Landbouwgronden:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: 6.1.g.1°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 005/9001 van 29 mei 1996;'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: 6.1.g.2°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 008/9001 van 30 mei 1996;'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: 6.1.g.3°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 004/9001 van 27 oktober 1997;'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: 6.1.g.4°
    text: 'met het door de Dienst Landelijk Gebied toegekende nummer: 003/9001 van 15 december 1997;'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: 6.1.h
    text: |-
      de beschikkingen van de Minister van Economische Zaken van 18 april 1998 met de beschikkingnummers kaderwet/pnb/01,
      kaderwet/pnb/02 en kaderwet/pnb/03.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: '6.2'
    text: |-
      Van de voordelen die worden genoten op grond van de in het eerste lid, onderdelen a, g en h, bedoelde regelingen
      en overeenkomsten behoort 90% niet tot de winst. Van de voordelen die worden genoten op grond van de in het eerste
      lid, onderdelen b tot en met f, bedoelde regelingen en overeenkomsten behoort 100% niet tot de winst.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6
  - number: 6a
    text: |-
      De voorwaarden, bedoeld in [artikel 3.13, eerste lid, onderdeel i, onder 2°, van de wet][ref1], zijn dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 6a.a
    text: deelnemers ten hoogste één periode van ten hoogste twaalf maanden kunnen deelnemen aan het project;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6a
  - number: 6a.b
    text: |-
      de beloningen die een deelnemer kan krijgen uit het project een gezamenlijke waarde hebben van ten hoogste € 200
      per maand en € 1.200 per deelnameperiode.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel6a
  - number: '7'
    text: |-
      Voor de toepassing van [artikel 3.16, tweede lid, onderdeel c, van de wet][ref1] wordt kleding die niet uitsluitend
      of nagenoeg uitsluitend geschikt is om bij het behalen van de winst te dragen, slechts als werkkleding aangemerkt
      indien zij is voorzien van een of meer duidelijk zichtbare, aan de onderneming gebonden beeldmerken met een
      oppervlakte van tezamen ten minste 70 cm2.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '8.1'
    text: |-
      Voor de toepassing van [artikel 3.17, eerste lid, onderdeel a, onder 1°, van de wet][ref1] verhuist de ondernemer
      in ieder geval in het kader van de onderneming ingeval hij binnen twee jaar na de verplaatsing van de onderneming
      door verhuizing de afstand tussen zijn woning en de vestigingsplaats van de onderneming met ten minste 60%
      verkleint terwijl tot die verhuizing de afstand tussen zijn woning en de vestigingsplaats van de onderneming ten
      minste 25 kilometer bedroeg.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '8.2'
    text: Onder afstand als bedoeld in het eerste lid wordt verstaan de afstand gemeten langs de meest gebruikelijke weg.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel8
  - number: '9'
    text: |-
      De rittenregistratie, bedoeld in [artikel 3.20 van de wet][ref1], bevat ten minste de volgende gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 9.a
    text: merk, type en kenteken van de auto;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel9
  - number: 9.b
    text: periode van terbeschikkingstelling van de auto;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel9
  - number: 9.c
    text: |-
      per rit: 1°. datum; 2°. beginstand en eindstand van de kilometerteller; 3°. beginadres en eindadres; 4°. de gereden
      route indien deze afwijkt van de meest gebruikelijke; 5°. het karakter van de rit.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel9
  - number: 9a
    text: |-
      Met betrekking tot het kalenderjaar 2026 wordt voor de toepassing van
      [artikel 3.22, zesde lid, onderdeel c, van de wet][ref1] in samenhang met artikel 3.22, tiende lid, van de
      wet vastgesteld dat op landelijk niveau de netto-tonnage van kwalificerende schepen die de vlag voeren van een
      van de lidstaten van de Europese Unie of van een staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte als percentage van de netto-tonnage van kwalificerende schepen in de periode 2022 tot en met
      2024 ten opzichte van de periode 2021 tot en met 2023 niet is afgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '11'
    text: |-
      Voor de toepassing van de [artikelen 3.55, tweede en vijfde lid][ref1], [3.56, tweede lid][ref2],
      [3.57, tweede lid][ref3], en [4.41, tweede en derde lid, van de wet][ref4] en de [artikelen 14, derde lid][ref5],
      en [14a, tweede lid, van het Uitvoeringsbesluit inkomstenbelasting 2001][ref6] worden van de staten die partij zijn
      bij de Overeenkomst betreffende de Europese Economische Ruimte aangewezen: IJsland, Noorwegen en Liechtenstein.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0012066#Artikel14
      [ref6]: https://wetten.overheid.nl/BWBR0012066#Artikel14a
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
