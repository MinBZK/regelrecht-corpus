  - number: 17a
    text: |-
      Indien in de overeenkomst ter zake van de verwerving van een eigen woning, ten behoeve van de uitvoering van het
      woonbeleid van de rijksoverheid of een gemeente, een clausule is opgenomen op grond waarvan bij niet-nakoming
      van die clausule een bedrag verschuldigd is, kan bij de vervreemding van die woning het bedrag dat ter zake van
      het niet nakomen van de clausule is betaald in mindering worden gebracht op het vervreemdingssaldo eigen woning,
      bedoeld in [artikel 3.119aa, eerste lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 17aa.1
    text: |-
      Indien de over een kalendermaand verschuldigde aflossing van een tot de eigenwoningschuld behorende schuld
      in de eerste vijf werkdagen van de daaropvolgende kalendermaand wordt gedaan, wordt voor de toepassing van
      de [artikelen 3.119c][ref1] en [3.119e van de wet][ref2] het bedrag van deze schuld op de laatste dag van de
      kalendermaand waarover de aflossing verschuldigd was, verminderd met die aflossing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17aa
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 17aa.2
    text: |-
      Onder werkdagen als bedoeld in het eerste lid worden verstaan alle dagen van het jaar
      met uitzondering van zaterdagen, zondagen, algemeen erkende feestdagen als bedoeld in
      [artikel 3, eerste lid, van de Algemene termijnenwet][ref1], de Goede Vrijdag en 1 mei.


      [ref1]: https://wetten.overheid.nl/BWBR0002448#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17aa
    references:
      - id: ref1
        bwb_id: BWBR0002448
        artikel: '3'
  - number: 17b.1
    text: |-
      Als gegevens als bedoeld in [artikel 3.119g van de wet][ref1] worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 17b.1.a
    text: de datum van aangaan van de schuld;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17b
  - number: 17b.1.b
    text: het startbedrag van de schuld;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17b
  - number: 17b.1.c
    text: de maandelijkse rentevoet;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17b
  - number: 17b.1.d
    text: de contractueel vastgelegde looptijd in maanden;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17b
  - number: 17b.1.e
    text: de contractueel vastgelegde wijze van aflossing;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17b
  - number: 17b.1.f
    text: |-
      indien de leningverstrekker een natuurlijk persoon is: de naam, het adres en het burgerservicenummer of, bij
      het ontbreken van het burgerservicenummer, een hiermee vergelijkbaar door de fiscale woonstaat toegekend fiscaal
      identificatienummer van de leningverstrekker;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17b
  - number: 17b.1.g
    text: |-
      indien de leningverstrekker een rechtspersoon is: de naam, het adres en een uniek nummer als bedoeld in de
      [Handelsregisterwet 2007][ref1] of, bij het ontbreken van een dergelijk nummer en indien dat bestaat, een hiermee
      vergelijkbaar door de fiscale woonstaat toegekend fiscaal identificatienummer van de leningverstrekker.


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 17b.2
    text: |-
      Als gegevens als bedoeld in [artikel 3.119g van de wet][ref1] worden mede aangewezen de wijzigingen die zich in het
      kalenderjaar hebben voorgedaan met betrekking tot de in het eerste lid bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '18'
    text: |-
      Van langdurige arbeidsongeschiktheid als bedoeld in [artikel 3.133, negende lid, onderdeel a, van de wet][ref1] is
      sprake indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 18.a
    text: |-
      uit een recente verklaring van een arts blijkt dat de belastingplichtige door ziekte of gebreken op het moment
      waarop de verklaring is afgegeven niet in staat is volledig de werkzaamheden te verrichten waarmee vóór het
      ontstaan van de arbeidsongeschiktheid het inkomen hoofdzakelijk werd verdiend en hiertoe vermoedelijk in de twaalf
      maanden na de afgifte van de verklaring ook niet in staat zal zijn, of
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel18
  - number: 18.b
    text: |-
      aannemelijk is dat de belastingplichtige periodieke uitkeringen van privaat- of publiekrechtelijke aard wegens
      arbeidsongeschiktheid ontvangt of gaat ontvangen.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel18
  - number: '23.1'
    text: |-
      Een voorlopige verliesverrekening als bedoeld in [artikel 3.152, vijfde lid, van de wet][ref1] kan worden verleend
      indien het verlies over een kalenderjaar wordt aangegeven door de in de uitnodiging tot het doen van aangifte
      gevraagde gegevens en bescheiden en andere gegevensdragers of de inhoud daarvan duidelijk, stellig en zonder
      voorbehoud in te vullen en te ondertekenen en de gevraagde bescheiden of andere gegevensdragers in te leveren of
      toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '23.2'
    text: |-
      Bij de berekening van de voorlopige verliesverrekening wordt het vermoedelijke verlies voor 80 percent in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel23
  - number: '26'
    text: |-
      De ingevolge [artikel 4.14, achtste lid, onderdeel a, van de wet][ref1] aan te wijzen effectenbeurzen zijn de
      effectenbeurzen in de lidstaten van de Europese Gemeenschappen, alsmede de effectenbeurzen te Zürich, New York
      en Tokio.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 26a.1
    text: |-
      Een verzoek als bedoeld in [artikel 4.17a, eerste lid][ref1], [artikel 4.17b, tweede lid][ref2], of artikel 4.17b,
      derde lid, van de wet wordt schriftelijk gedaan bij de inspecteur die is belast met de aanslagregeling van de
      erflater.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 26a.2
    text: |-
      Een verzoek als bedoeld in [artikel 4.17b, eerste lid][ref1], of [artikel 4.17c, eerste lid, van de wet][ref2]
      wordt schriftelijk gedaan bij de inspecteur die is belast met de aanslagregeling van de vervreemder.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 26b.1
    text: |-
      Onder een omzetting van gewone aandelen in preferente aandelen als bedoeld in
      [artikel 4.17a, derde lid, onderdeel a, van de wet][ref1] wordt ook begrepen een uitgifte van preferente aandelen
      in het kader van een aandelenfusie als bedoeld in [artikel 3.55 van de wet][ref2], een juridische splitsing als
      bedoeld in [artikel 3.56 van de wet][ref3] of een juridische fusie als bedoeld in [artikel 3.57 van de wet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 26b.2
    text: |-
      Aan het gestelde in [artikel 4.17a, derde lid, onderdeel a, van de wet][ref1] wordt ook geacht te zijn voldaan
      indien de daar bedoelde preferente aandelen worden verkregen van een rechtsopvolger krachtens erfrecht of
      huwelijksvermogensrecht van degene die de aandelen heeft omgezet als bedoeld in genoemd onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 26b.3
    text: |-
      Indirect gehouden preferente aandelen zijn uitgegeven in het kader van een bedrijfsoverdracht als bedoeld in
      [artikel 4.17a, vijfde lid, laatste volzin, van de wet][ref1] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 26b.3.a
    text: |-
      de preferente aandelen een omzetting vormen van een eerder door de erflater gehouden indirect belang van gewone
      aandelen als bedoeld in [artikel 4.17a, vijfde lid, onderdelen a en b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 26b.3.b
    text: de omzetting in preferente aandelen gepaard is gegaan met het toekennen van gewone aandelen aan een ander;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26b
  - number: 26b.3.c
    text: |-
      ten tijde van de omzetting in preferente aandelen de vennootschap waarop de omgezette aandelen betrekking
      hadden een onderneming dreef als bedoeld in [artikel 4.17a, eerste lid, onderdeel a, van de wet][ref1], of een
      medegerechtigdheid hield als bedoeld in artikel 4.17a, eerste lid, onderdeel b, van de wet, en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 26b.3.d
    text: |-
      de verkrijger van de indirect gehouden preferente aandelen reeds voor ten minste 5% van het geplaatste kapitaal
      direct of indirect aandeelhouder is van gewone aandelen als bedoeld in onderdeel b.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26b
  - number: 26b.4
    text: |-
      Indien preferente aandelen zijn ontstaan in het kader van een gefaseerde bedrijfsoverdracht als bedoeld in
      [artikel 4.17a, derde lid of vijfde lid, van de wet][ref1], dan behouden deze aandelen het karakter dat zij in
      aanmerking worden genomen voor de toepassing van artikel 4.17a, eerste lid, onderdeel c, van die wet voor zover
      de houder van deze preferente aandelen ook houder is van de gewone aandelen die bij het ontstaan van de preferente
      aandelen zijn toegekend aan de bedrijfsopvolger.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: 26b.5
    text: |-
      Voor de bepaling of de verkrijger van de preferente aandelen voldoet aan de voorwaarde van
      [artikel 4.17a, derde lid, onderdeel d, van de wet][ref1] worden de preferente aandelen niet gerekend tot het
      geplaatste kapitaal. De eerste volzin is van overeenkomstige toepassing voor de toepassing van het derde lid,
      eerste volzin, onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '27.1'
    text: |-
      Een voorlopige verliesverrekening als bedoeld in [artikel 4.51, vijfde lid, van de wet][ref1] kan worden verleend
      indien het verlies over een kalenderjaar wordt aangegeven door de in de uitnodiging tot het doen van aangifte
      gevraagde gegevens en bescheiden en andere gegevensdragers of de inhoud daarvan duidelijk, stellig en zonder
      voorbehoud in te vullen en te ondertekenen en de gevraagde bescheiden of andere gegevensdragers in te leveren of
      toe te zenden.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel4
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '4'
  - number: '27.2'
    text: |-
      Bij de berekening van de voorlopige verliesverrekening wordt het vermoedelijke verlies voor 80 percent in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel27
  - number: '28.1'
    text: 'Voor de toepassing van dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel28
  - number: 28.1.a
    text: |-
      *project:* groenproject, zijnde een project waarvoor ingevolge de
      [Regeling groenprojecten 2016][ref1], de [Regeling groenprojecten buitenland 2002][ref2] dan wel
      de [Regeling groenprojecten Nederlandse Antillen en Aruba 2002][ref3] een verklaring als bedoeld in
      [artikel 5.14, derde lid, van de wet][ref4] is afgegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0037778
      [ref2]: https://wetten.overheid.nl/BWBR0013272
      [ref3]: https://wetten.overheid.nl/BWBR0013273
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0037778
      - id: ref2
        bwb_id: BWBR0013272
      - id: ref3
        bwb_id: BWBR0013273
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 28.1.b
    text: |-
      *fonds:* groenfonds, zijnde een bank, een onderdeel van een bank of een beleggingsinstelling die voldoet
      aan de voorwaarden van [artikel 5.14, tweede lid, van de wet][ref1] en die door de inspecteur ingevolge
      [artikel 5.14, eerste lid, van de wet][ref2] is aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 28.1.c
    text: |-
      *hoofdzakelijkheidscriterium:* de voorwaarde inzake hoofdzakelijk als bedoeld in
      [artikel 5.14, tweede lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 28.1.d
    text: |-
      *aanloopperiode:* de periode, bedoeld in [artikel 5.14, vierde lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 28.1.e
    text: |-
      *ingroeiperiode:* de periode, bedoeld in [artikel 5.14, vijfde lid, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '28.2'
    text: |-
      Voor de toepassing van het eerste lid, onderdeel c, wordt een fonds geacht aan het hoofdzakelijkheidscriterium
      te voldoen:
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel28
  - number: 28.2.a
    text: |-
      indien het fonds een bank of een onderdeel van een bank is: zolang ten minste 70% van de groene beleggingen,
      bedoeld in [artikel 5.14 van de wet][ref1], van het fonds is aangewend voor het direct of indirect verstrekken van
      kredieten ten behoeve van projecten in het belang van de bescherming van het milieu, waaronder natuur en bos, of
      het direct of indirect beleggen van vermogen in dergelijke projecten en de accountant van het fonds jaarlijks een
      goedkeurende verklaring afgeeft dat aan het hoofzakelijkheidscriterium is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 28.2.b
    text: |-
      indien het fonds een beleggingsinstelling is: zolang ten minste 70% van de groene beleggingen, bedoeld in
      [artikel 5.14 van de wet][ref1], van het fonds is aangewend voor het direct of indirect beleggen van vermogen ten
      behoeve van projecten in het belang van de bescherming van het milieu, waaronder natuur en bos, en de accountant
      van het fonds jaarlijks een goedkeurende verklaring afgeeft dat aan het hoofzakelijkheidscriterium is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '29.1'
    text: 'Een verzoek om aanwijzing als fonds wordt schriftelijk gedaan bij de inspecteur onder overlegging van:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29
  - number: 29.1.a
    text: de statuten van het fonds, dan wel productvoorwaarden als sprake is van een onderdeel van een bank;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29
  - number: 29.1.b
    text: |-
      een afschrift van de inschrijving van het fonds, dan wel van de bank als het fonds een onderdeel is van die
      bank in het register, bedoeld in [artikel 1:107 van de Wet op het financieel toezicht][ref1], dan wel, ingeval
      [artikel 3:2, eerste lid, onderdeel c, van die wet][ref2] van toepassing is, een afschrift van de in dat lid
      bedoelde bankgarantie van het fonds, dan wel van de bank als het fonds een onderdeel is van die bank; en


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '3'
  - number: 29.1.c
    text: een opgave van de feitelijke werkzaamheden en voorgenomen werkzaamheden van het fonds.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29
  - number: '29.2'
    text: 'Bij een verzoek om aanwijzing als fonds met een ingroeiperiode worden tevens overgelegd:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29
  - number: 29.2.a
    text: |-
      een ingroeiplan op grond waarvan het aannemelijk is dat binnen drie maanden na de aanwijzing ten minste 30 percent
      van het vermogen van het fonds is belegd in projecten dan wel bestaat uit kredieten ten behoeve van projecten;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29
  - number: 29.2.b
    text: |-
      een ingroeischema op grond waarvan het aannemelijk is dat uiterlijk twee jaren na de aanwijzing ten minste 70
      percent van het vermogen van het fonds is belegd in projecten dan wel bestaat uit kredieten ten behoeve van
      projecten.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29
  - number: '29.3'
    text: De inspecteur beslist op het verzoek tot aanwijzing bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29
  - number: '29.4'
    text: |-
      De aanwijzing vindt plaats met ingang van de datum waarop het verzoek is ingediend, dan wel met ingang van een
      latere datum indien daarom is verzocht.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29
  - number: '29.5'
    text: |-
      De inspecteur maakt het aanwijzen als een fonds op een daartoe geschikte wijze publiek bekend. Indien de inspecteur
      een aanwijzing intrekt, maakt hij die intrekking ook op een daartoe geschikte wijze publiek bekend.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29
  - number: 29a.1
    text: |-
      Een aangewezen fonds overlegt binnen vier maanden na afloop van ieder boekjaar aan de inspecteur een overzicht van
      zijn bezittingen en schulden naar de waarde in het economische verkeer aan het einde van het boekjaar.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29a
  - number: 29a.2
    text: |-
      Ingeval het fonds is aangewezen met een aanloopperiode, verstrekt het fonds onmiddellijk na afloop van die periode
      aan de inspecteur een overzicht van zijn bezittingen en schulden naar de actuele waarde in het economische verkeer.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29a
  - number: 29a.3
    text: |-
      Ingeval het fonds is aangewezen met een ingroeiperiode, verstrekt het fonds in die periode elk half jaar aan de
      inspecteur een overzicht van zijn bezittingen en schulden naar de actuele waarde in het economische verkeer.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29a
  - number: 29a.4
    text: |-
      Indien een fonds indirect een krediet verstrekt ten behoeve van een project, blijkt uit de administratie van de
      inlenende rechtspersoon ten behoeve van welk project het krediet is verstrekt.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29a
  - number: 29a.5
    text: |-
      Indien een fonds een krediet verstrekt ten behoeve van een project door tussenkomst van een ander fonds, elimineert
      het inlenende fonds het kredietbedrag uit het overzicht van zijn bezittingen en schulden, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29a
  - number: 29a.6
    text: |-
      Indien een aangewezen fonds niet meer voldoet aan de voorwaarden voor aanwijzing, doet het fonds daarvan onverwijld
      schriftelijk mededeling aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29a
  - number: 29b.1
    text: 'De inspecteur trekt de aanwijzing in:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29b
  - number: 29b.1.a
    text: op verzoek van het fonds;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29b
  - number: 29b.1.b
    text: indien het fonds niet meer voldoet aan de voorwaarden voor aanwijzing; dan wel
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29b
  - number: 29b.1.c
    text: indien het fonds de in dit hoofdstuk opgenomen informatieverplichtingen jegens de inspecteur niet nakomt.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29b
  - number: 29b.2
    text: De intrekking van de aanwijzing geschiedt bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29b
  - number: 29b.3
    text: |-
      De inspecteur bepaalt in de beschikking het tijdstip waarop de intrekking van de aanwijzing in werking treedt, met
      dien verstande dat de intrekking terugwerkende kracht heeft tot en met de dag waarop het eerste lid, onderdeel b of
      c, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29b
  - number: 29b.4
    text: |-
      Ingeval het fonds is aangewezen met een aanloopperiode en na afloop van die periode niet wordt voldaan aan het
      hoofdzakelijkheidscriterium, heeft de intrekking terugwerkende kracht tot en met de eerste dag na het aflopen van
      die periode.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29b
  - number: 29b.5
    text: |-
      Ingeval het fonds is aangewezen met een ingroeiperiode en na afloop van die periode niet wordt voldaan aan het
      hoofdzakelijkheidscriterium, heeft de intrekking terugwerkende kracht tot en met de eerste dag na het aflopen van
      die periode.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29b
  - number: 29b.6
    text: |-
      Indien het fonds de in [artikel 29a, zesde lid][ref1], bedoelde mededeling onverwijld heeft gedaan, heeft de
      intrekking geen terugwerkende kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0012031#Artikel29a
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0012031
        artikel: 29a
        hoofdstuk: '5'
  - number: 29b.7
    text: |-
      Indien het fonds de in [artikel 29a, zesde lid][ref1], bedoelde mededeling onverwijld heeft gedaan en voorts
      aannemelijk maakt dat het niet meer voldoen aan de voorwaarden niet langer dan drie maanden zal voortduren, een
      incidenteel karakter heeft en niet in strijd is met doel en strekking van de regeling, trekt de inspecteur de
      aanwijzing niet in. Het besluit de aanwijzing niet in te trekken, neemt de inspecteur bij voor bezwaar vatbare
      beschikking; daarbij kan hij nadere voorwaarden stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0012031#Artikel29a
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29b
    references:
      - id: ref1
        bwb_id: BWBR0012031
        artikel: 29a
        hoofdstuk: '5'
  - number: 29b.8
    text: |-
      Indien de inspecteur een aanwijzing intrekt, maakt hij die intrekking op een daartoe geschikte wijze publiek
      bekend.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel29b
  - number: '30.1'
    text: |-
      Voor de bepaling van de perioden die voor de toepassing van [afdeling 5.3B van de wet][ref1]
      en de daarop berustende bepalingen in aanmerking komen als dienstjaren is
      [artikel 10a van het Uitvoeringsbesluit loonbelasting 1965][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.3B
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel10a
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: 5.3B
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 10a
  - number: '30.2'
    text: |-
      Voor de bepaling van de loonbestanddelen die voor de toepassing van [afdeling 5.3B van de wet][ref1]
      en de daarop berustende bepalingen in aanmerking komen als pensioengevend loon is
      [artikel 10b van het Uitvoeringsbesluit loonbelasting 1965][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.3B
      [ref2]: https://wetten.overheid.nl/BWBR0002489#Artikel10b
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0011353
        afdeling: 5.3B
      - id: ref2
        bwb_id: BWBR0002489
        artikel: 10b
  - number: '30.3'
    text: |-
      In afwijking in zoverre van het eerste en tweede lid zijn de [artikelen 1a][ref1] en
      [11c tot en met 11f van het Uitvoeringsbesluit inkomstenbelasting 2001][ref2] van overeenkomstige toepassing
      voor de toepassing van [afdeling 5.3B van de wet][ref3] en de daarop berustende bepalingen ingeval sprake
      is van een pensioenregeling als bedoeld in [artikel 1.7, tweede lid, onderdeel b, van de wet][ref4],
      waaraan een belastingplichtige deelneemt of heeft deelgenomen anders dan als werknemer als bedoeld in de
      [Wet op de loonbelasting 1964][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0012066#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0012066#Artikel11c
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.3B
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0012066
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0012066
        artikel: 11c
      - id: ref3
        bwb_id: BWBR0011353
        afdeling: 5.3B
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '1'
      - id: ref5
        bwb_id: BWBR0002471
  - number: 33b
    text: |-
      Als prijscourant als bedoeld in [artikel 5.21 van de wet][ref1] wordt aangewezen de Officiële Prijscourant
      uitgegeven door Euronext Amsterdam N.V.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel33b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '37.1'
    text: |-
      De extra kosten van een op voorschrift van een arts of een diëtist gehouden dieet als bedoeld in
      [artikel 6.17, eerste lid, onderdeel g, en achtste lid, van de wet][ref1], worden bepaald aan de hand van de
      navolgende tabel:








                    Voor het dieet bij het ziektebeeld en de aandoening


                    op welk dieet de in deze kolom genoemde typering van toepassing is


                    bedragen de extra uitgaven






                    Algemene symptomen


                    groeiachterstand bij kinderen


