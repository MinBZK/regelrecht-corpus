  - number: '37.2'
    text: 'Voor de toepassing van dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.a
    text: |-
      *referentievoeding:* een gezonde voeding conform het advies voor een Nederlands voedingspatroon, gebaseerd op de
      Richtlijnen Goede Voeding;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.b
    text: '*basaalmetabolisme:* het energieverbruik van een persoon in rust;'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.c
    text: |-
      *energieverrijkt in combinatie met eiwitverrijkt:* een voorgeschreven energiebehoefte van ten minste 150% van
      het basaalmetabolisme van de gebruiker en een voorgeschreven hoeveelheid eiwit van ten minste 1,5 gram eiwit per
      kilogram lichaamsgewicht van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.d
    text: |-
      *energieverrijkt:* een voorgeschreven energiebehoefte van ten minste 150% van het basaalmetabolisme van de
      gebruiker;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.e
    text: |-
      *eiwitverrijkt:* een voorgeschreven hoeveelheid eiwit van ten minste 1,5 gram eiwit per kilogram lichaamsgewicht
      van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.f
    text: '*lactosebeperkt/lactosevrij:* een voorgeschreven lactosebeperking tot 5 gram per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.g
    text: |-
      *glutenvrij in combinatie met lactosebeperkt/lactosevrij:* glutenvrij en een voorgeschreven lactosebeperking tot 5
      gram per etmaal;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.h
    text: |-
      *energieverrijkt in combinatie met MCT-vetverrijkt:* een voorgeschreven energiebehoefte van ten minste 150% van het
      basaalmetabolisme van de gebruiker en een voorgeschreven hoeveelheid MCT-vet van ten minste 12% van de hoeveelheid
      energie per etmaal;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.i
    text: |-
      *fermenteerbare oligosachariden, disachariden, monosachariden en polyolen beperkt dieet:* een voorgeschreven
      dieet vrij van voedingsmiddelen die rijk zijn aan fermenteerbare oligosachariden, disachariden, monosachariden
      en polyolen;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.j
    text: |-
      *eiwitverrijkt in combinatie met sterk zoutbeperkt:* een voorgeschreven hoeveelheid eiwit van ten minste 1,5 gram
      eiwit per kilogram lichaamsgewicht van de gebruiker en een voorgeschreven beperking tot 5 gram zout per etmaal;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.k
    text: |-
      *energieverrijkt in combinatie met eiwitverrijkt en lactosebeperkt/lactosevrij:* een voorgeschreven energiebehoefte
      van ten minste 150% van het basaalmetabolisme van de gebruiker, een voorgeschreven hoeveelheid eiwit van ten minste
      1,5 gram eiwit per kilogram lichaamsgewicht van de gebruiker en een voorgeschreven lactosebeperking tot 5 gram
      per etmaal;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.l
    text: |-
      *fyto/plantensterolenverrijkt bij verzadigd vetbeperkt:* een voorgeschreven hoeveelheid plantaardige stanolen of
      plantaardige sterolen van ten minste 2 gram per etmaal en een voorgeschreven hoeveelheid verzadigd vet tot 10% van
      de hoeveelheid energie;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.m
    text: |-
      *vetbeperkt in combinatie met MCT-vetverrijkt:* een voeding uitgaande van een zo laag mogelijke hoeveelheid
      (LCT-)vet en een voorgeschreven hoeveelheid MCT-vet van ten minste 18% van de hoeveelheid energie per etmaal;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.n
    text: '*galactosebeperkt/galactosevrij:* een voorgeschreven lactosebeperking tot 5 gram per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.o
    text: |-
      *sucrosebeperkt in combinatie met (iso)maltosebeperkt:* een voorgeschreven sucrosebeperking en een voorgeschreven
      (iso)maltosebeperking in combinatie met enzymsuppletie afgestemd op de gebruiker;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.p
    text: '*sterk eiwitbeperkt:* een voorgeschreven beperking tot 25 gram eiwit per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.q
    text: |-
      *sucrosebeperkt, fructosebeperkt, lactosebeperkt en vetbeperkt:* een voorgeschreven sucrosebeperking,
      fructosebeperking, lactosebeperking en vetbeperking en een voorgeschreven hoeveelheid koolhydraten berekend aan de
      hand van de endogene glucoseproductie van de gebruiker;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.r
    text: |-
      *sterk koolhydraatbeperkt zonder energiebeperking:* een voorgeschreven hoeveelheid energie uit koolhydraten tot 30%
      bij een volwaardige voeding in energie;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.s
    text: '*sterk zoutbeperkt:* een voorgeschreven beperking tot 5 gram zout per etmaal;'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.t
    text: |-
      *eiwitverrijkt in combinatie met sterk (LCT-)vetbeperkt en MCT-vetverrijkt:* een voorgeschreven hoeveelheid eiwit
      van ten minste 1,5 gram eiwit per kilogram lichaamsgewicht van de gebruiker, uitgaande van een zo laag mogelijke
      hoeveelheid (LCT-)vet en een voorgeschreven hoeveelheid MCT-vet van ten minste 18% van de hoeveelheid energie per
      etmaal;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.2.u
    text: |-
      *sterk koolhydraatbeperkt in combinatie met eiwitbeperkt en vetverrijkt:* een voorgeschreven hoeveelheid
      koolhydraten en eiwitten die samen tot 20% van de hoeveelheid energie leveren en een voorgeschreven hoeveelheid vet
      van ten minste 80% van de hoeveelheid energie per etmaal.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: '37.3'
    text: 'Voor de toepassing van het eerste lid geldt voor:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.3.a
    text: |-
      eenzelfde dieettypering die meerdere keren in aanmerking zou komen éénmaal het bedrag behorende bij die
      dieettypering;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.3.b
    text: |-
      verschillende dieettyperingen die in aanmerking zouden komen bij eenzelfde ziektebeeld en aandoening elk van de bij
      die dieettyperingen behorende bedragen;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.3.c
    text: |-
      deels overeenkomende dieettyperingen alleen het hoogste van de voor de van toepassing zijnde ziektebeelden en
      aandoeningen geldende bedragen bij die dieettypering.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: '37.4'
    text: |-
      Ingeval extra uitgaven voor een op voorschrift van een arts of diëtist gehouden dieet niet gedurende het gehele
      kalenderjaar worden gedaan, worden de met toepassing van het eerste lid bepaalde bedragen naar tijdsgelang
      herrekend.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: '37.5'
    text: |-
      Een voorschrift als bedoeld in [artikel 6.17, negende lid, van de wet][ref1] bevat ten minste:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 37.5.a
    text: gegevens waaruit blijkt dat degene die het voorschrift afgeeft medicus of diëtist is;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.5.b
    text: naam, praktijkadres, telefoonnummer en handtekening van de medicus of diëtist die het voorschrift afgeeft;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.5.c
    text: naam, adres en burgerservicenummer van de persoon aan wie het dieet is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.5.d
    text: |-
      het ziektebeeld en de aandoening van de persoon, bedoeld in onderdeel c, en de dieettypering van het voorgeschreven
      dieet;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: 37.5.e
    text: |-
      de dagtekening van het voorschrift, de ingangsdatum van het te volgen dieet en indien van toepassing de einddatum
      van het te volgen dieet.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel37
  - number: '38.1'
    text: |-
      Uitgaven voor extra kleding en beddengoed alsmede daarmee samenhangende extra uitgaven als bedoeld in
      [artikel 6.17, eerste lid, onderdeel h, van de wet][ref1] worden in aanmerking genomen voor een bedrag van € 330
      dan wel, indien blijkt dat die uitgaven € 660 te boven gaan, voor een bedrag van € 825, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 38.1.a
    text: |-
      de genoemde uitgaven voortvloeien uit ziekte of invaliditeit van een persoon als bedoeld in
      [artikel 6.16 van de wet][ref1] die tot het huishouden van de belastingplichtige behoort; en


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 38.1.b
    text: de ziekte of invaliditeit ten minste een jaar heeft geduurd of vermoedelijk zal duren.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel38
  - number: '38.2'
    text: |-
      Ingeval aan de in het eerste lid gestelde voorwaarden niet gedurende het gehele kalenderjaar is voldaan, wordt dat
      lid naar tijdsgelang toegepast.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel38
