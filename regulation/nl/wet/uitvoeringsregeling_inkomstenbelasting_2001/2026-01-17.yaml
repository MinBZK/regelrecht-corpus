        artikel: '6'
  - number: 40.1.a
    text: € 13 per dag van verzorging van de gehandicapte door de belastingplichtige, alsmede
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel40
  - number: 40.1.b
    text: |-
      € 0,23 per kilometer voor het vervoer per auto van de gehandicapte door de belastingplichtige over de reisafstand
      tussen de plaats waar de gehandicapte doorgaans verblijft en de plaats waar de belastingplichtige doorgaans
      verblijft.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel40
  - number: '40.2'
    text: |-
      Indien zowel de belastingplichtige als zijn partner weekenduitgaven voor een gehandicapte in aanmerking nemen,
      wordt het voor die gehandicapte in aanmerking te nemen bedrag gesteld op de helft van het volgens het eerste lid,
      onderdelen a en b, berekende bedrag, zonodig naar boven af te ronden op een geheel getal.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel40
  - number: 40a
    text: |-
      De verklaring, bedoeld in [artikel 6.27, tweede lid, van de wet][ref1], wordt afgegeven door de door de Stichting
      van de Arbeid in dat kader benoemde uitvoeringsorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel40a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: '41'
    text: |-
      In de akte van schenking, bedoeld in [artikel 6.38 van de wet][ref1], worden ten minste de volgende gegevens
      vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 41.a
    text: de naam, het adres en het burgerservicenummer van de belastingplichtige;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41
  - number: 41.b
    text: |-
      de naam en het nummer, bedoeld in
      [artikel 1a, zevende lid, onderdeel b, van de Uitvoeringsregeling Algemene wet inzake rijksbelastingen 1994][ref1],
      van de begiftigde instelling of vereniging, dan wel, ingeval het een buitenlandse vereniging is, een door de
      vestigingsstaat aan de begiftigde vereniging toegekend identificatienummer dat vergelijkbaar is met het nummer,
      bedoeld in [artikel 12, onderdeel a, van de Handelsregisterwet 2007][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006736#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0021777#Artikel12
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006736
        artikel: 1a
      - id: ref2
        bwb_id: BWBR0021777
        artikel: '12'
  - number: 41.c
    text: het startjaar en de looptijd van de uitkeringen of verstrekkingen;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41
  - number: 41.d
    text: |-
      de jaarlijkse hoogte van de uitkeringen of een omschrijving alsmede de waarde in het economische verkeer van de
      verstrekkingen; en
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41
  - number: 41.e
    text: |-
      een door de instelling of vereniging aan de schenking toe te kennen uniek transactienummer van ten hoogste vijftien
      cijfers.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41
  - number: 41a.1
    text: |-
      Het taxatierapport, bedoeld in de [artikelen 6.38, tweede lid][ref1], en [6.39, tweede lid, van de wet][ref2],
      bevat de uitkomsten van een taxatie die is uitgevoerd door een onafhankelijke taxateur die is ingeschreven in een
      register dat tot doel heeft zijn deskundigheid te waarborgen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 41a.2
    text: |-
      De taxatie heeft niet meer dan drie maanden voor het moment van schenking alsmede niet meer dan zes maanden na het
      moment van schenking plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41a
  - number: 41a.3
    text: 'Het taxatierapport bevat ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41a
  - number: 41a.3.a
    text: |-
      de voorletters, de achternaam, het adres, de woonplaats en het telefoonnummer van de taxateur die de taxatie heeft
      verricht;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41a
  - number: 41a.3.b
    text: de inschrijving van de taxateur in het voor de gift relevante taxatieregister;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41a
  - number: 41a.3.c
    text: |-
      een verklaring van de taxateur dat de in het taxatierapport opgegeven waarde door hem naar waarheid is vastgesteld
      aan de hand van een gedegen fysieke opname, ondersteund door visueel materiaal van het getaxeerde object;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41a
  - number: 41a.3.d
    text: de datum van de fysieke opname;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41a
  - number: 41a.3.e
    text: de getaxeerde waarde in het economische verkeer op het moment van schenking;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41a
  - number: 41a.3.f
    text: een omschrijving van het type en de omvang van het object of het belang en de aard van het gebruik;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41a
  - number: 41a.3.g
    text: de waarderelevante gegevens;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41a
  - number: 41a.3.h
    text: 'indien van toepassing: een motivering van de individuele afwijking ten opzichte van de relevante marktgegevens.'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41a
  - number: 41b.1
    text: |-
      De factuur, bedoeld in de [artikelen 6.38, tweede lid][ref1], en [6.39, tweede lid, van de wet][ref2], is niet
      meer dan drie maanden voorafgaand aan het moment van schenking uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 41b.2
    text: |-
      De factuur bevat de waarde in het economische verkeer zoals die door onafhankelijke partijen is of zou zijn
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41b
  - number: 41b.3
    text: 'De factuur bevat voorts een vermelding van ten minste de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41b
  - number: 41b.3.a
    text: de datum waarop de factuur is uitgereikt;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41b
  - number: 41b.3.b
    text: de volledige naam en adresgegevens van de verkoper en de afnemer;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41b
  - number: 41b.3.c
    text: het type en de omvang van het object of het belang en de aard van het gebruik.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel41b
  - number: '42'
    text: (GERESERVEERD)
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel42
  - number: '43'
    text: (GERESERVEERD)
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel43
  - number: '44'
    text: (GERESERVEERD)
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel44
  - number: '45.1'
    text: |-
      De aangifte, bedoeld in [artikel 9.4, eerste lid, onderdeel b, van de wet][ref1], wordt gedaan binnen vijf jaren na
      afloop van het kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
  - number: '45.2'
    text: |-
      Indien binnen de in het eerste lid bedoelde termijn een uitnodiging tot het doen van aangifte
      is uitgereikt of toegezonden, hetzij de inspecteur is verzocht om een uitnodiging tot het doen
      van aangifte, wordt die termijn verlengd tot het einde van de door de inspecteur ingevolge
      [artikel 9, eerste tot en met derde lid, van de Algemene wet inzake rijksbelastingen][ref1] gestelde of verleende
      termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel9
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '9'
  - number: 45a.1
    text: |-
      Indien de belastingplichtige een partner heeft ten aanzien van wie in het kalenderjaar de in
      [artikel 8.8 van de wet][ref1] bedoelde maximering van de gecombineerde heffingskorting toepassing
      vindt, wordt bij de berekening van hetgeen ingevolge artikel 27, paragraaf 1, van het in
      [artikel 9.2, negende lid, onderdeel a, van de wet][ref2] genoemde verdrag wordt aangemerkt als ingehouden
      Nederlandse loonbelasting, het bedrag aan Nederlandse inkomstenbelasting en premie voor de volksverzekeringen
      als bedoeld in de [Wet financiering sociale verzekeringen][ref3] dat de belastingplichtige verschuldigd zou
      zijn geweest indien hij de in artikel 27, paragraaf 1, van dat verdrag bedoelde beloningen uit Nederland zou
      hebben verkregen, verminderd met de verhoging, bedoeld in artikel [8.9 van de wet][ref4], van de gecombineerde
      heffingskorting waarop zijn partner recht zou hebben gehad, indien hij bedoelde beloningen daadwerkelijk uit
      Nederland zou hebben verkregen en Nederland daarover belasting en premie zou hebben geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0017745
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0017745
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 45a.2
    text: |-
      Indien de belastingplichtige een partner heeft ten aanzien van wie in het kalenderjaar de in
      [artikel 8.8 van de wet][ref1] bedoelde maximering van de gecombineerde heffingskorting toepassing
      vindt, wordt bij de berekening van hetgeen ingevolge artikel XII van het protocol bij het in
      [artikel 9.2, negende lid, onderdeel b, van de wet][ref2] genoemde verdrag wordt aangemerkt als ingehouden
      Nederlandse loonbelasting, het bedrag aan Nederlandse inkomstenbelasting en premie voor de volksverzekeringen
      als bedoeld in de [Wet financiering sociale verzekeringen][ref3] dat de belastingplichtige verschuldigd zou zijn
      geweest indien hij de in artikel XII van dat protocol bedoelde beloningen uit Nederland zou hebben verkregen,
      verminderd met de verhoging, bedoeld in [artikel 8.9 van de wet][ref4], van de gecombineerde heffingskorting
      waarop zijn partner recht zou hebben gehad, indien hij bedoelde beloningen daadwerkelijk uit Nederland zou hebben
      verkregen en Nederland daarover belasting en premie zou hebben geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0017745
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0017745
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 45a.3
    text: |-
      Indien de belastingplichtige een partner heeft ten aanzien van wie in het kalenderjaar de in
      [artikel 8.8 van de wet][ref1] bedoelde maximering van de gecombineerde heffingskorting toepassing vindt, wordt
      bij de berekening van hetgeen ingevolge artikel 27, paragraaf 2, van het in het eerste lid bedoelde verdrag
      wordt aangemerkt als ingehouden Nederlandse loonbelasting, het bedrag aan Nederlandse inkomstenbelasting dat
      de belastingplichtige verschuldigd zou zijn geweest indien de in artikel 27, paragraaf 2, van dat verdrag
      bedoelde beloningen uitsluitend in Nederland zouden zijn belast, verminderd met de verhoging, bedoeld in
      [artikel 8.9 van de wet][ref2], van de gecombineerde heffingskorting, waarop zijn partner recht zou hebben gehad
      indien uitsluitend in Nederland over de bedoelde beloningen belasting zou zijn geheven.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel8
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '8'
  - number: 45a.4
    text: |-
      De in het eerste, tweede en derde lid bedoelde verminderingen zijn niet van toepassing voorzover de partner van
      de belastingplichtige:
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45a
  - number: 45a.4.a
    text: |-
      uit hoofde van [hoofdstuk 8 van de wet][ref1] recht heeft op verhoging van de gecombineerde heffingskorting; of


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: 45a.4.b
    text: |-
      recht zou hebben gehad op de gecombineerde heffingskorting als bedoeld in
      [hoofdstuk 8 van de wet][ref1] indien beloningen die hij heeft genoten krachtens regelen als bedoeld
      in [hoofdstuk VII van de Algemene wet inzake rijksbelastingen][ref2] niet zouden zijn vrijgesteld
      van de heffing van inkomstenbelasting of premie voor de volksverzekeringen als bedoeld in de
      [Wet financiering sociale verzekeringen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVII
      [ref3]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: VII
      - id: ref3
        bwb_id: BWBR0017745
  - number: 45abis
    text: |-
      Voor de toepassing van [artikel 9.5a van de wet][ref1] wordt voor het kalenderjaar 2026:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel9
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45abis
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '9'
  - number: 45abis.a
    text: het percentage voor banktegoeden vastgesteld op 1,28%;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45abis
  - number: 45abis.b
    text: het percentage voor schulden vastgesteld op 2,70%.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45abis
  - number: 45aa
    text: |-
      De inspecteur vermindert ambtshalve een belastingaanslag die op een te hoog bedrag is vastgesteld zodra hem dat is
      gebleken, tenzij:
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45aa
  - number: 45aa.a
    text: vijf jaren zijn verlopen na het einde van het kalenderjaar waarop de belastingaanslag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45aa
  - number: 45aa.b
    text: |-
      de onjuistheid van de belastingaanslag voortvloeit uit jurisprudentie die eerst is gewezen nadat die
      belastingaanslag onherroepelijk vast is komen te staan, tenzij de Minister van Financiën anders heeft bepaald;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45aa
  - number: 45aa.c
    text: |-
      de onjuistheid van de belastingaanslag voortvloeit uit beleidsregels van de Minister van Financiën die eerst zijn
      uitgevaardigd nadat die belastingaanslag onherroepelijk vast is komen te staan, tenzij de Minister van Financiën
      anders heeft bepaald;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45aa
  - number: 45aa.d
    text: |-
      de onjuistheid van de belastingaanslag voortvloeit uit de omstandigheid dat eerst nadat die belastingaanslag
      onherroepelijk vast is komen te staan een beroep wordt gedaan op een fiscale faciliteit, waarop een beroep moet
      worden gedaan bij de aangifte of op een ander wettelijk voorgeschreven moment; of
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45aa
  - number: 45aa.e
    text: |-
      sprake is van enig feit waardoor ten onrechte inkomstenbelasting is geheven en als gevolg van die heffing een
      andere belasting, al dan niet van dezelfde belastingplichtige, ter zake van datzelfde feit niet is geheven en ook
      niet meer kan worden geheven, met dien verstande dat in dat geval wel ambtshalve vermindering plaatsvindt voor
      zover het bedrag van de eerstgenoemde belasting het bedrag van de andere belasting te boven gaat.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45aa
  - number: 45b
    text: 'Vóór 1 januari 2005 vastgestelde lijfrenten die niet in geldeenheden luiden:'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45b
  - number: 45b.1
    text: |-
      Op een lijfrente waarvan vóór 1 januari 2005 de hoogte van de termijnen in beleggingseenheden (units) met de
      verzekeraar is overeengekomen, blijft [artikel 2a][ref1] buiten toepassing en kan de lijfrente-overeenkomst worden
      tenuitvoergelegd zoals is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0012031#Artikel2a
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0012031
        artikel: 2a
        hoofdstuk: '1'
  - number: 45b.2
    text: |-
      Indien ter zake van een lijfrente als bedoeld in het eerste lid op of na 1 januari 2005 met de verzekeraar een
      wijziging van methode van berekening van de termijnen in units of in euro’s wordt overeengekomen, is met ingang van
      de datum van die wijziging [art. 2a][ref1] wel van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012031#Artikel2a
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0012031
        artikel: 2a
        hoofdstuk: '1'
  - number: 45b.3
    text: |-
      Indien een lijfrente als bedoeld in het eerste lid op of na 1 januari 2005 wordt omgezet in een andere lijfrente,
      is [artikel 2a][ref1] van toepassing op de laatstgenoemde lijfrente.


      [ref1]: https://wetten.overheid.nl/BWBR0012031#Artikel2a
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0012031
        artikel: 2a
        hoofdstuk: '1'
  - number: 45c
    text: |-
      Een fonds dat voor 1 januari 2008 is aangewezen als fonds als bedoeld in [artikel 5.14 van de wet][ref1], zoals de
      wet toen luidde, wordt geacht met ingang van 1 januari 2008 door de inspecteur bij beschikking te zijn aangewezen
      op de voet van de wet zoals die thans luidt.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 45e
    text: |-
      [Artikel 34][ref1], zoals dat artikel op 31 december 2010 luidde, blijft van toepassing op verliezen op vóór
      1 januari 2011 verstrekte geldleningen als bedoeld in [artikel 6.8, eerste lid][ref2], van de wet, zoals dat lid op
      31 december 2010 luidde.


      [ref1]: https://wetten.overheid.nl/BWBR0012031#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel6
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45e
    references:
      - id: ref1
        bwb_id: BWBR0012031
        artikel: '34'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '6'
  - number: 45f
    text: |-
      Onder een starterslening als bedoeld in [artikel 10bis.1, tweede lid, onderdeel f, van de wet][ref1] wordt verstaan
      een lening ter verwerving van een eigen woning als bedoeld in [artikel 3.111 van de wet][ref2], mits aan de
      volgende voorwaarden wordt voldaan:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel10bis
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45f
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: 10bis
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 45f.a
    text: de belastingplichtige koopt voor de eerste maal een eigen woning;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45f
  - number: 45f.b
    text: |-
      de belastingplichtige heeft tegenover de Stichting Stimuleringsfonds Volkshuisvesting Nederlandse gemeenten
      aannemelijk gemaakt dat hij op het moment van aangaan van de lening volgens de toen geldende normen van de
      Nationale Hypotheek Garantie het geleende bedrag niet anders kon financieren dan door middel van een lening van de
      Stichting Stimuleringsfonds Volkshuisvesting Nederlandse gemeenten;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45f
  - number: 45f.c
    text: de looptijd van de lening is ten hoogste 360 maanden;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45f
  - number: 45f.d
    text: |-
      op zowel deze lening als op de lening die naast deze lening wordt afgesloten is de Nationale Hypotheek Garantie
      van toepassing;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45f
  - number: 45f.e
    text: de lening is bij authentieke notariële akte verstrekt;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45f
  - number: 45f.f
    text: |-
      gedurende de eerste drie jaar na het aangaan van de lening bestaat geen verplichting tot aflossing of
      rentebetaling;
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45f
  - number: 45f.g
    text: |-
      na de periode van drie jaar, bedoeld in onderdeel f, dient de lening door de belastingplichtige volgens een ten
      minste annuïtair schema in maximaal 324 maanden te worden afgelost en dient de over de lening verschuldigde rente
      te worden betaald, tenzij uit een hertoetsing van het inkomen door de Stichting Stimuleringsfonds Volkshuisvesting
      Nederlandse gemeenten blijkt dat de belastingplichtige deze lasten niet kan dragen, in welk geval aan de hand
      van de hertoetsing een aangepaste door de leningnemer te betalen maandlast met betrekking tot de lening wordt
      vastgesteld; en,
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45f
  - number: 45f.h
    text: |-
      de hertoetsing, bedoeld in onderdeel g, vindt volgens het contract in ieder geval plaats na drie, zes, tien en
      vijftien jaar na het moment van aangaan van de lening voor zover niet reeds is gebleken dat de leningnemer de bij
      de lening behorende rente- en aflossingslasten kan dragen.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45f
  - number: 45g.1
    text: |-
      Ingeval een spaarrekening eigen woning meer dan één rekeninghouder heeft, wordt het tegoed van de rekening in
      gelijke delen toegerekend aan die rekeninghouders.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45g
  - number: 45g.2
    text: |-
      Ingeval een beleggingsrecht eigen woning meer dan één eigenaar heeft, wordt de waarde van het recht in gelijke
      delen toegerekend aan die eigenaren.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel45g
  - number: '47'
    text: Deze regeling treedt in werking met ingang van 1 januari 2001.
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel47
  - number: '48'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling inkomstenbelasting 2001.'
    url: https://wetten.overheid.nl/BWBR0012031/2026-01-17#Artikel48
