  - number: '4.9'
    text: |-
      1 Indien het loon niet onderhevig is aan heffing op grond van de Nederlandse belastingwetgeving wordt aan de
      werknemer een nettoloon uitbetaald. Dit nettoloon wordt berekend door het in [artikel 4.8, eerste lid][ref1],
      bedoelde loon te verminderen met de in [artikel 4.8, tweede lid][ref2], bedoelde premies dan wel bedragen en het
      bedrag dat de werknemer lokaal over zijn loon aan belasting verschuldigd is, dan wel het bedrag dat de werknemer
      lokaal over zijn loon aan belasting verschuldigd zou zijn indien de lokale belastingautoriteiten de lokaal
      gebruikelijke belasting over zijn loon zouden heffen.

      2 De lokaal verschuldigde belasting over het loon wordt rechtstreeks door de werkgever afgedragen.

      3 Indien naar het oordeel van HDPO, al dan niet op voorstel van de CdP, de lokale omstandigheden het noodzakelijk
      maken de verantwoordelijkheid voor het inhouden en afdragen van de lokaal verschuldigde belasting over het loon
      bij de werknemer te leggen, wordt dit in de postuitwerking opgenomen. In dat geval is de werknemer verantwoordelijk
      voor de afdracht van de lokaal verschuldigde belasting over dat loon en wordt, in afwijking van het eerste lid, het
      loon bruto uitbetaald. De werknemer is verplicht op verzoek van de CdP aan te tonen dat hij de lokaal verschuldigde
      belasting heeft afgedragen.

      4 Indien de werknemer verantwoordelijk is voor de afdracht van de lokaal verschuldigde belasting over het loon,
      maar afdracht achterwege blijft, kan, in afwijking van het derde lid, de CdP besluiten dat het loon netto wordt
      uitbetaald. In dat geval wordt het in het derde lid bedoelde loon verminderd met de belasting die de werknemer
      lokaal over het loon verschuldigd is.

      5 Indien op grond van het vierde lid het loon netto is uitbetaald en de werknemer aantoont dat hij alsnog belasting
      heeft afgedragen, wordt de werknemer een bedrag nabetaald ter hoogte van de alsnog afgedragen belasting.

      6 De CdP kan aan de ter zake bevoegde lokale autoriteiten een opgave verstrekken van het door de werknemer
      verdiende loon.


