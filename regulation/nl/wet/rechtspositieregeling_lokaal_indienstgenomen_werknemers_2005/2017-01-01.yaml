      1 Een opdracht tot het maken van een dienstreis of scholingsreis wordt gegeven door de CdP.

      2 Op een dienstreis of scholingsreis is de [Regeling buitenlandse reizen BZ 2017](onbekend) van toepassing.

      3 Indien de CdP aan de werknemer toestemming verleent om voor de dienstreis of scholingsreis gebruik te maken
      van eigen vervoer ontvangt de werknemer daarvoor een vergoeding. De hoogte van die vergoeding wordt opgenomen in
      de postuitwerking.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel4.12
  - number: '4.16'
    text: |-
      1 Indien de werknemer op verzoek van de CdP representatieve activiteiten heeft verricht en hiervoor kosten heeft
      gemaakt, worden deze kosten geheel of gedeeltelijk vergoed overeenkomstig de op de post voor het vergoeden van
      actieve representatie geldende regels. Deze kosten komen ten laste van het daarvoor aan de betreffende post
      toegekende budget voor representatieve activiteiten.

      2 Indien het lokaal voorgeschreven of gebruikelijk is wordt aan de werknemer een niet in deze regeling genoemde
      vergoeding of tegemoetkoming toegekend.

      3 De in het tweede lid bedoelde vergoeding of tegemoetkoming wordt in de postuitwerking opgenomen, met vermelding
      van de hoogte en duur daarvan, alsmede van de voorwaarden voor toekenning.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel4.16
  - number: '4.17'
    text: |-
      1 De CdP kan naar billijkheid de werknemer schadeloosstellen behalve in gevallen als bedoeld in het tweede lid.

      2 Indien de werknemer tijdens de uitoefening van zijn werkzaamheden op de post of tijdens een dienstreis als gevolg
      van een beroepsziekte of een dienstongeval als bedoeld in [artikel 5.10, derde lid][ref1], blijvend invalide raakt
      of overlijdt, wordt desgevraagd aan hem respectievelijk zijn achterblijvende partner of afhankelijke kinderen door
      HDPO een eenmalige uitkering toegekend overeenkomstig het tweede tot en met zevende lid.

      3 De uitkering bedraagt bij overlijden 1,5 maal en bij blijvende invaliditeit ten hoogste 3 maal het voor
      de desbetreffende post geldende bruto loonbedrag behorende bij het maximum loonnummer van loonschaal 7,
      vermenigvuldigd met 12.

      4 De uitkering is inclusief eventuele uitkeringen op grond van door de werkgever gesloten of vergoede
      verzekeringen.

      5 De uitkering wordt netto uitgekeerd en daartoe gebruteerd voor de toepassing van de van toepassing zijnde lokale
      of Nederlandse belastingwetgeving. [Hoofdstuk 4, paragraaf 4][ref2], is van overeenkomstige toepassing.

      6 De hoogte van een bij blijvende invaliditeit toe te kennen uitkering is afhankelijk van de mate van invaliditeit
      en wordt, met inachtneming van het genoemde maximale bedrag, bepaald overeenkomstig de criteria welke ingevolge de
      polisvoorwaarden gelden voor de door het Ministerie van Buitenlandse Zaken gecontracteerde reisorganisatie geboekte
      reizen.

      7 Bij overlijden kan de in het derde lid genoemde uitkering door HDPO naar redelijkheid en billijkheid worden
      verhoogd indien een op het leven van de werknemer afgesloten levensverzekering niet tot uitkering komt omdat het
      overlijden het gevolg is van molest die direct samenhangt met de uitoefening van de dienst voor de werkgever. Er is
      sprake van molest indien de gebeurtenis die leidde tot het ongeval normaliter onverzekerbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel5.10
      [ref2]: https://wetten.overheid.nl/BWBR0017230#Hoofdstuk4
