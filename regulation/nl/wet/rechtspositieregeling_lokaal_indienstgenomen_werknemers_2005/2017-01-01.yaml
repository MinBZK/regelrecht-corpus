        paragraaf: '5'
  - number: '2.4'
    text: |-
      1 De CdP kan, met uitzondering van de in het tweede en vierde lid bedoelde gevallen, van een kandidaat-werknemer
      vergen dat deze een verklaring omtrent het gedrag als bedoeld in de [Wet justitiële gegevens][ref1] overlegt, dan
      wel een gelijkwaardige verklaring, afgegeven door de autoriteiten van een ander land dan Nederland.

      2 Indien een functie, niet zijnde een vertrouwensfunctie als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet veiligheidsonderzoeken][ref2], bijzondere eisen stelt aan de
      integriteit of de verantwoordelijkheid van degene die deze functie vervult en indien een zwaarwegend algemeen
      belang dit vordert, kunnen door de directeur Veiligheidsdienst Buitenlandse Zaken van het Ministerie van
      Buitenlandse Zaken of een door hem aangewezen persoon bij de Minister van Justitie justitiële gegevens worden
      opgevraagd voor het verrichten van een onderzoek naar de betrouwbaarheid en de geschiktheid van een kandidaat
      voor die functie. Benoeming in een zodanige functie is slechts mogelijk, nadat op grond van het onderzoek tegen de
      vervulling door betrokkene van de desbetreffende functie geen bezwaar blijkt te bestaan. Bij de uitvoering van het
      in de vorige volzin bedoelde onderzoek wordt gezorgd voor voldoende bescherming van de persoonlijke levenssfeer van
      de betrokkene.

      3 Benoeming in een vertrouwensfunctie als bedoeld in
      [artikel 1, eerste lid, onderdeel a, van de Wet veiligheidsonderzoeken][ref3] is slechts mogelijk indien ten
      aanzien van de betrokkene een verklaring als bedoeld in [artikel 1, eerste lid, onderdeel b, van die wet][ref4]
      is afgegeven.

      4 Een onderzoek als bedoeld in het tweede of derde lid wordt slechts ingesteld indien naar het oordeel van de CdP
      de betrokkene bekwaam en geschikt is voor de desbetreffende functie.

      5 De kosten voor het verkrijgen van een verklaring als bedoeld in het eerste lid komen voor rekening van de
      werkgever.


