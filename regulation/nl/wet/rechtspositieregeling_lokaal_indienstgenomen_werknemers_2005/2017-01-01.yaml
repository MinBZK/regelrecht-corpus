  - number: '5.13'
    text: |-
      1 De vrouwelijke werknemer heeft in verband met haar bevalling recht op zwangerschaps- en bevallingsverlof met
      behoud van loon.

      2 Op het in het eerste lid bedoelde recht worden in mindering gebracht de voorzieningen waarop de vrouwelijke
      werknemer vanwege haar zwangerschaps- en bevallingsverlof recht heeft op grond van het voor haar geldende sociale
      zekerheidsstelsel.

      3 Indien de werknemer een wisselend aantal uren per week werkt, wordt onder het in het eerste lid bedoelde loon
      verstaan het loon dat de werknemer gemiddeld heeft genoten in de dertien kalenderweken voorafgaande aan de dag dat
      het zwangerschapsverlof is ingegaan.

      4 De vrouwelijke werknemer meldt aan de CdP:

      a. de dag met ingang waarvan zij het zwangerschapsverlof opneemt uiterlijk vier weken voor die dag onder
      overlegging van een verklaring van een geneeskundige of van een verloskundige waarin de vermoedelijke datum van
      bevalling is aangegeven;

      b. haar bevalling uiterlijk op de zevende dag volgend op die van de bevalling.

      5 De duur van het zwangerschaps- en bevallingsverlof en de perioden dat het kan worden genoten, worden vastgesteld
      rekening houdend met lokaal voorschrift of gebruik, en zijn opgenomen in de postuitwerking, maar bedragen in totaal
      ten minste zestien weken.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.13
  - number: '5.14'
    text: |-
      1 Een vrouwelijke werknemer die een borstkind voedt en hiervan de CdP op de hoogte heeft gesteld, wordt gedurende
      de eerste negen levensmaanden van dat kind in de gelegenheid gesteld haar werkzaamheden te onderbreken om haar kind
      te zogen dan wel de borstvoeding te kolven gedurende maximaal een uur per dag. Bij een deeltijdarbeidsovereenkomst
      bedraagt de maximale duur van de onderbrekingen een evenredig deel van de onderbrekingen bij een
      voltijdarbeidsovereenkomst.

      2 De vaststelling van het tijdstip en de duur van de in het eerste lid bedoelde onderbrekingen vindt plaats door de
      betrokken vrouwelijke werknemer na overleg met de CdP.

      3 De duur van de in het eerste lid bedoelde onderbrekingen geldt als werktijd, waarover de vrouwelijke werknemer
      haar recht op loon behoudt.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.14
  - number: '5.15'
    text: |-
      1 De CdP kan de arbeidsovereenkomst met een vrouwelijke werknemer niet opzeggen gedurende haar zwangerschaps- en
      bevallingsverlof noch, na werkhervatting, gedurende een periode van zes weken volgend op dat verlof, behalve als de
      opzegging niet in verband staat met de zwangerschap of de geboorte van het kind en de consequenties daarvan dan wel
      het voeden van het kind. De bewijslast dat een opzegging niets te maken heeft met de zwangerschap of de geboorte
      van het kind en de consequenties daarvan dan wel het voeden van het kind ligt bij de werkgever.

      2 Indien de CdP de arbeidsovereenkomst in strijd met het eerste lid opzegt kan de werknemer:

      a. gedurende twee maanden na de opzegging van de arbeidsovereenkomst de opzegging vernietigen door middel van het
      zenden van een schriftelijke kennisgeving met die strekking aan de CdP; of

      b. een beroep doen op [artikel 8.9][ref1].

      3 Een rechtsvordering in verband met de in het tweede lid, onderdeel a, bedoelde vernietiging verjaart door verloop
      van zes maanden na de dag waartegen is opgezegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel8.9
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0017230
        artikel: '8.9'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '6.1'
    text: |-
      De werknemer is gehouden de uit diens arbeidsovereenkomst voortvloeiende plichten nauwgezet en ijverig te vervullen
      en zich te gedragen zoals een goed werknemer betaamt. De werknemer dient zich er daarbij voortdurend bewust van te
      zijn dat hij werkzaam is bij een vertegenwoordiging van het Koninkrijk in het buitenland.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.1
  - number: '6.2'
    text: |-
      1 Indien de werknemer door ziekte of anderszins verhinderd is dienst te verrichten, is deze verplicht daarvan onder
      opgave van redenen, zo tijdig mogelijk mededeling te doen op de in de postuitwerking bekend gestelde wijze.

      2 Indien zich omstandigheden of wijzigingen voordoen die van invloed zijn of kunnen zijn op de rechten of plichten
      op grond van deze regeling of op grond van de postuitwerking, stelt de werknemer de CdP daarvan onverwijld,
      uiterlijk binnen zeven dagen gerekend vanaf de dag waarop de omstandigheid of wijziging zich voordoet, schriftelijk
      in kennis.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      1 De werknemer is verplicht aan de CdP, op een door de CdP te bepalen wijze, opgave te doen van de
      nevenwerkzaamheden die hij verricht of voornemens is te gaan verrichten, die de belangen van de dienst voor zover
      deze in verband staan met zijn functievervulling, kunnen raken.

      2 De CdP voert een registratie op basis van de in het eerste lid bedoelde opgaven.

      3 Het is de werknemer verboden nevenwerkzaamheden te verrichten waardoor, ter beoordeling van de CdP, de goede
      vervulling van zijn functie of de goede functionering van de post, voor zover deze in verband staat met zijn
      functievervulling, niet redelijk zou zijn verzekerd.

      4 Het is de werknemer verboden, middellijk of onmiddellijk deel te nemen aan aannemingen en leveringen ten behoeve
      van openbare diensten, tenzij daarvoor toestemming door de CdP is verleend. Voor aannemingen en leveringen ten
      behoeve van anderen kan de CdP aanwijzingen geven.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      Het is de werknemer in diens functie verboden anders dan met goedvinden van de CdP, beloningen, giften of beloften
      van derden te vorderen of te verzoeken. Voor het aannemen van geschenken geldt de Regeling aannemen geschenken DBZ.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.4
  - number: '6.5'
    text: |-
      1 De werknemer is verplicht de dienstkleding en onderscheidingstekenen te dragen indien, en op de wijze waarop, dit
      door de CdP is voorgeschreven.

      2 De dienstkleding wordt na gebleken slijtage door de werkgever vervangen.

      3 De werknemer is verantwoordelijk voor het onderhouden en reinigen van de dienstkleding en draagt de kosten
      daarvan, tenzij die kosten overeenkomstig lokaal voorschrift of lokaal gebruik geheel of gedeeltelijk voor rekening
      van de werkgever komen.

      4 De dienstkleding blijft eigendom van de werkgever. De werknemer is verplicht de dienstkleding bij beëindiging van
      de arbeidsovereenkomst of indien de CdP daarom vraagt, in te leveren bij de werkgever.

      5 Het is de werknemer verboden bij gekleed gaan in dienstkleding insignes of andere onderscheidingstekenen te
      dragen, tenzij deze door de Nederlandse regering zijn verstrekt of voorgeschreven of tot het dragen daarvan door de
      CdP toestemming is verleend.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.5
  - number: '6.6'
    text: |-
      De werknemer is verplicht te gaan wonen of te blijven wonen in of nabij de vestigingsplaats van de post indien dit
      naar het oordeel van de CdP noodzakelijk is in verband met de goede vervulling van zijn functie.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      De werknemer kan door de CdP worden verplicht tijdelijk andere werkzaamheden te verrichten dan hij gewoonlijk
      verricht, mits die werkzaamheden hem redelijkerwijze kunnen worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.7
  - number: '6.8'
    text: |-
      1 De CdP laat zich bijstaan door een of meer werknemers die door hem zijn aangewezen als bedrijfshulpverleners
      teneinde doeltreffende maatregelen te nemen die het mogelijk maken dat de werknemers, indien een toestand ontstaat
      waarin direct gevaar voor de veiligheid of gezondheid aanwezig is, zich snel in veiligheid kunnen stellen dan wel
      andere passende maatregelen kunnen nemen en teneinde te verzekeren dat de schade aan de gezondheid zoveel mogelijk
      beperkt wordt.

      2 Het verlenen van de bijstand houdt in elk geval in:

      a. het verlenen van eerste hulp bij ongevallen;

      b. het beperken en bestrijden van brand en het voorkomen van ongevallen;

      c. het in noodsituaties alarmeren en evacueren van alle werknemers en andere personen op de post.

      3 De werknemer die is aangewezen als bedrijfshulpverlener heeft recht op een toelage bedrijfshulpverlening als
      bedoeld in [artikel 4.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel4.7
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0017230
        artikel: '4.7'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '6.9'
    text: |-
      Indien aan de werknemer een woning beschikbaar wordt gesteld, worden de voorwaarden waaronder dat geschiedt,
      waaronder de verdeling van de onderhoudskosten en de wijze van beëindiging van de beschikbaarstelling, opgenomen in
      de postuitwerking.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.9
  - number: '6.10'
    text: |-
      1 Na overlijden van de werknemer behouden de achterblijvende gezinsleden het gebruik van de dienstwoning waarin
      zij met de werknemer woonden gedurende de maand van het overlijden en de volgende drie maanden. Deze periode kan
      worden ingekort indien de CdP dat in het belang van de dienst noodzakelijk acht. In dat geval wordt aan bedoelde
      gezinsleden naar billijkheid een vergoeding verstrekt.

      2 Indien door de werknemer voor het gebruik van de dienstwoning een vergoeding verschuldigd was, voldoen
      de achtergebleven gezinsleden 50% van deze vergoeding over de tijd, gedurende welke zij het gebruik over de
      dienstwoning behouden.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.10
  - number: '6.11'
    text: |-
      1 De werknemer kan in het belang van de dienst worden verplicht om scholing te volgen, voor zover dat
      redelijkerwijs van hem kan worden gevergd.

      2 Aan de werknemer, die op grond van het eerste lid scholing volgt, wordt een volledige vergoeding van de
      noodzakelijk te maken scholingskosten toegekend.

      3 Aan de werknemer die op grond van het eerste lid scholing volgt, kan scholingsverlof met behoud van loon worden
      verleend.

      4 De werknemer die op grond van het eerste lid scholing volgt, is verplicht de aan hem toegekende vergoeding van
      de scholingskosten terug te betalen bij onvoldoende resultaat in de scholing en bij tussentijds afbreken van de
      scholing, indien dit aan eigen schuld of toedoen is te wijten.

      5 Bij ontslag tijdens de scholing kan de vergoeding van de scholingskosten worden teruggevorderd en bij ontslag
      binnen een termijn van twee jaren na het met voldoende resultaat afronden van de scholing kan voor iedere maand
      vóór afloop van die twee jaren, 1/24e deel van de vergoeding worden teruggevorderd, tenzij:

      a. het ontslag niet aan eigen schuld of toedoen van de werknemer is wijten;

      b. de werknemer binnen een maand na zijn ontslag elders in dienst treedt bij de Nederlandse Rijksoverheid; of

      c. de werknemer aansluitend aan zijn ontslag recht heeft op een voorziening als bedoeld in [hoofdstuk 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.11
    references:
      - id: ref1
        bwb_id: BWBR0017230
        hoofdstuk: '9'
  - number: '6.12'
    text: |-
      1 Aan de werknemer die op eigen initiatief scholing gaat volgen, kan op zijn aanvraag een gehele of gedeeltelijke
      vergoeding van de noodzakelijk te maken scholingskosten worden toegekend of scholingsverlof met behoud van loon
      worden verleend, indien het belang van de dienst bij het volgen van de scholing is gebaat.

      2 [Artikel 6.11, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel6.11
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.12
    references:
      - id: ref1
        bwb_id: BWBR0017230
        artikel: '6.11'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '6.13'
    text: |-
      1 Binnen een maand na indiensttreding van de werknemer of na plaatsing van de werknemer in een andere functie, dan
      wel binnen een maand nadat een nieuwe lijnchef met zijn werkzaamheden is aangevangen, vindt een startgesprek plaats
      tussen de werknemer en de lijnchef.

      2 In het startgesprek worden duidelijke afspraken gemaakt over de werkzaamheden die van de werknemer worden
      verwacht en over de samenwerking tussen de werknemer en de lijnchef.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.13
  - number: '6.14'
    text: |-
      1 Een functioneringsgesprek tussen de werknemer en de lijnchef vindt minimaal eenmaal per jaar plaats.

      2 In het functioneringsgesprek worden in ieder geval besproken:

      a. het functioneren van de werknemer over de afgelopen periode;

      b. de begeleiding die de werknemer bij zijn functioneren van zijn lijnchef heeft gehad;

      c. de in het kader van het functioneren van de werknemer te maken afspraken voor de komende periode.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.14
  - number: '6.15'
    text: |-
      Indien de CdP dat gewenst acht of de werknemer daarom heeft verzocht, wordt het functioneren van de werknemer
      beoordeeld overeenkomstig het Beoordelingsvoorschrift BZ.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.15
  - number: '6.16'
    text: |-
      1 Indien sprake is van een wijziging van de organisatiestructuur van een post die rechtspositionele gevolgen heeft
      voor vijf of meer werknemers, of indien er sprake is van een voorgenomen sluiting van de post, stelt de CdP een
      plan van aanpak op dat betrekking heeft op de diverse fasen van het reorganisatieproces.

      2 Het plan van aanpak geeft ten minste inzicht in:

      a. de inhoud van en de reden voor de voorgenomen reorganisatie;

      b. de bestaande en de voorgenomen organisatiestructuur van de post;

      c. de bestaande en de voorgenomen personeelsformatie;

      d. een overzicht van de functies die worden opgeheven, de functies die ongewijzigd blijven bestaan, de functies die
      worden gewijzigd en de nieuwe functies;

      e. de belangrijkste beleidsmatige, financiële en personele gevolgen van de voorgenomen reorganisatie;

      f. de voorgenomen maatregelen ter beperking van de personele gevolgen vastgelegd in een sociaal plan;

      g. de eventueel te verwachten bijzonderheden in het reorganisatieproces;

      h. de planning van de momenten waarop het medezeggenschapsorgaan van de post en de betrokken werknemers worden
      geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.16
  - number: '6.17'
    text: |-
      HDPO stelt na overleg met de CdP het plan van aanpak vast nadat overleg is gevoerd door:

      a. de CdP met het medezeggenschapsorgaan van de post overeenkomstig de artikelen 22, 23 en 32, vierde lid, van de
      Medezeggenschapsregeling posten BZ; en

      b. HDPO met de in [artikel 142 van het RDBZ][ref1] bedoelde centrales van verenigingen van ambtenaren over de
      personele gevolgen van de reorganisatie en de voorgenomen maatregelen ter beperking van de personele gevolgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel142
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel6.17
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '142'
  - number: '7.1'
    text: |-
      Aan de werknemer kan door de CdP de toegang tot dienstlokalen, dienstgebouwen of het werk dan wel het verblijf
      aldaar, worden ontzegd.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      1 De werknemer is van rechtswege geschorst wanneer hij krachtens wettelijke maatregel van zijn vrijheid is beroofd,
      tenzij de vrijheidsbeneming het gevolg is van een maatregel genomen in het belang van de volksgezondheid.

      2 De CdP kan de werknemer schorsen indien een strafrechtelijke vervolging tegen hem is ingesteld of als anderszins
      naar het oordeel van de CdP het belang van de dienst dit vordert.

      3 De CdP bepaalt of de schorsing plaatsvindt met behoud van loon, dan wel met gehele of gedeeltelijke inhouding
      van loon.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel7.2
  - number: '7.3'
    text: |-
      De werknemer kan worden verplicht tot gehele of gedeeltelijke vergoeding van de door de werkgever geleden schade
      voor zover de werknemer de schade ernstig kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel7.3
  - number: '7.4'
    text: |-
      1 De werknemer die de hem opgelegde verplichtingen niet nakomt of zich overigens aan plichtsverzuim schuldig maakt,
      kan door de CdP worden gestraft.

      2 Plichtsverzuim omvat zowel het overtreden van enig voorschrift als het doen of nalaten van iets dat een goed
      werknemer in gelijke omstandigheden behoort na te laten of te doen.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel7.4
  - number: '7.5'
    text: |-
      Bij plichtsverzuim kunnen de volgende straffen worden toegepast:

      a. schriftelijke berisping;

      b. beperking van het recht op vakantie, voor ten hoogste een derde deel van het aantal uren waarop de werknemer per
      kalenderjaar recht heeft;

      c. gehele of gedeeltelijke inhouding van loon tot een bedrag van ten hoogste het loon over een halve maand;

      d. vaststelling van het loon in de voor de werknemer geldende loonschaal, op het bedrag behorend bij een loonnummer
      dat maximaal twee loonnummers lager is dan voor de werknemer geldt, voor de tijd van ten hoogste twee jaren;

      e. het niet toekennen van een hoger loonnummer gedurende ten hoogste vier jaren;

      f. schorsing voor een bepaalde tijd met gehele of gedeeltelijke inhouding van loon;

      g. ontslag overeenkomstig [hoofdstuk 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0017230
        hoofdstuk: '8'
  - number: '8.1'
    text: |-
      1 Indien de arbeidsovereenkomst voor bepaalde tijd is aangegaan eindigt zij van rechtswege wanneer deze tijd is
      verstreken. Voorafgaande opzegging is in dat geval niet nodig.

      2 Indien de arbeidsovereenkomst na het verstrijken van de in het eerste lid bedoelde tijd door partijen zonder
      tegenspraak wordt voortgezet, wordt zij geacht voor dezelfde tijd, maar telkens ten hoogste voor een jaar, op de
      vroegere voorwaarden opnieuw te zijn aangegaan.

      3 Onverminderd het eerste lid kan een arbeidsovereenkomst voor bepaalde tijd ook tussentijds worden beëindigd
      overeenkomstig [artikel 8.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel8.2
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0017230
        artikel: '8.2'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '8.2'
    text: |-
      1 De arbeidsovereenkomst die voor onbepaalde tijd is aangegaan kan door opzegging worden beëindigd.

      2 De door de werknemer in acht te nemen termijn van opzegging bedraagt een maand.

      3 De door de werkgever in acht te nemen termijn van opzegging bedraagt bij een arbeidsovereenkomst die op de dag
      van opzegging:

      a. korter dan vijf jaren heeft geduurd: een maand;

      b. vijf jaren of langer heeft geduurd: twee maanden.

      4 Voor de toepassing van het derde lid geldt voor het bepalen van de duur van de arbeidsovereenkomst de
      periode waarop één of verschillende arbeidsovereenkomsten met de werknemer betrekking hebben, voor zover deze
      arbeidsovereenkomsten zijn aangegaan voor werkzaamheden op één post en elkaar met tussenpozen van niet meer dan 31
      dagen zijn opgevolgd.

      5 Alvorens over te gaan tot opzegging van de arbeidsovereenkomst zonder instemming van de werknemer, wint de CdP
      bij 3W advies in.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel8.2
  - number: '8.3'
    text: |-
      1 De werknemer heeft bij het eindigen van een arbeidsovereenkomst recht op een eenmalige ontslaguitkering, tenzij:

      a. het betreft het van rechtswege aflopen van één of verschillende direct aansluitende arbeidsovereenkomsten voor
      bepaalde tijd die korter heeft respectievelijk hebben geduurd dan vijf jaren;

      b. de werknemer de arbeidsovereenkomst heeft opgezegd;

      c. de werkgever de arbeidsovereenkomst heeft opgezegd wegens aan de werknemer te verwijten redenen;

      d. de arbeidsovereenkomst wordt beëindigd wegens het bereiken van de pensioenleeftijd; of

      e. de arbeidsovereenkomst na de in [artikel 8.4, eerste lid][ref1], bedoelde termijn wordt beëindigd wegens ziekte.

      2 De in het eerste lid bedoelde uitkering bedraagt ten minste een bedrag ter grootte van een half maandloon
      voor elk jaar dat de arbeidsovereenkomst heeft geduurd of de direct aansluitende arbeidsovereenkomsten hebben
      geduurd. Bij een gedeelte van een jaar wordt de uitkering naar evenredigheid vastgesteld. Voor het berekenen van
      de duur van de arbeidsovereenkomst is [artikel 8.2, vierde lid][ref2], van overeenkomstige toepassing. Indien
      de arbeidsovereenkomst door de werkgever gedeeltelijk wordt opgezegd, bestaat voor het aantal uren waarvoor de
      arbeidsovereenkomst is opgezegd recht op de uitkering.

      3 Het aantal maandlonen dat meetelt bij de bepaling van het in het tweede lid bedoelde bedrag,
      bedraagt ten hoogste het aantal volle kalendermaanden gelegen tussen de ontslagdatum en de in
      [artikel 9.1, eerste lid, onderdeel d][ref3], bedoelde pensioendatum van de werknemer.

      4 Indien reeds over een periode van de arbeidsovereenkomst of direct aansluitende arbeidsovereenkomsten een
      ontslaguitkering is verstrekt, telt deze periode niet mee bij de berekening van het in het tweede lid bedoelde
      bedrag.

      5 Voor de toepassing van dit artikel wordt in afwijking van [artikel 1.1, onderdeel n][ref4], onder maandloon
      verstaan: het in artikel 1.1, onderdeel n, bedoelde maandloon zoals dat gemiddeld is uitbetaald over het tijdvak
      van 12 maanden direct voorafgaande aan de ingangsdatum van het ontslag.

      6 Op de vaststelling en uitbetaling van de ontslaguitkering zijn de [artikelen 4.8 tot en met 4.11][ref5] van
      overeenkomstige toepassing.


