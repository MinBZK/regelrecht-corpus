  - number: '5.1'
    text: |-
      De van toepassing zijnde voorgeschreven en gebruikelijke sociale voorzieningen worden in de postuitwerking
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.1
  - number: '5.2'
    text: |-
      1 Indien deelname van de werknemer aan het lokale sociale zekerheidsstelsel verplicht is dan wel dat mogelijk
      is en het naar het oordeel van HDPO in de rede ligt van die mogelijkheid gebruik te maken, zorgt de CdP voor de
      aanmelding van de werknemer bij de desbetreffende lokale instanties.

      2 Indien het lokaal voorgeschreven of gebruikelijk is dat de in het eerste lid bedoelde aanmelding niet door de
      werkgever, maar door de werknemer geschiedt, zorgt de werknemer voor zijn aanmelding.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.2
  - number: '5.3'
    text: |-
      1 De op grond van het lokale sociale zekerheidsstelsel verschuldigde premies komen voor rekening van de werknemer
      dan wel de werkgever, overeenkomstig lokaal voorschrift of gebruik.

      2 De verschuldigde premies worden door de CdP aan de desbetreffende lokale instanties afgedragen, tenzij het lokaal
      voorgeschreven of gebruikelijk is dat deze premies door de werknemer worden afgedragen in welk geval de werknemer
      voor de afdracht zorgt.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.3
  - number: '5.4'
    text: |-
      Indien op de werknemer het Nederlandse sociale zekerheidsstelsel van toepassing is, zorgt 3W voor de aanmelding van
      de werknemer bij de desbetreffende instanties in Nederland.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.4
  - number: '5.5'
    text: |-
      1 De verschuldigde werkgevers- en werknemerspremies, alsmede de verschuldigde premies volksverzekeringen worden
      door 3W afgedragen aan de desbetreffende instanties in Nederland.

      2 Op het loon van de werknemer wordt het bedrag ingehouden dat de werknemer aan premies sociale verzekeringen zou
      hebben betaald als het lokale sociale zekerheidsstelsel van toepassing zou zijn.

      3 De in het tweede lid bedoelde bedragen worden op de datum van indiensttreding vastgesteld en worden voorts
      jaarlijks per 1 januari opnieuw vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.5
  - number: '5.6'
    text: |-
      1 Indien de werknemer niet kan deelnemen aan het lokale of Nederlandse sociale zekerheidsstelsel wordt op het loon
      van de werknemer het bedrag ingehouden dat de werknemer aan premies sociale verzekeringen zou hebben betaald als
      het lokale sociale zekerheidsstelsel van toepassing zou zijn geweest.

      2 Indien de in het eerste lid bedoelde situatie zich voordoet kan in de postuitwerking worden bepaald dat:

      a. in afwijking van het eerste lid op het loon van de werknemer het bedrag aan premies sociale verzekeringen dat de
      werknemer zou hebben betaald als het lokale sociale zekerheidsstelsel op hem van toepassing zou zijn geweest niet
      of slechts gedeeltelijk wordt ingehouden;

      b. het bedrag aan premies sociale verzekeringen dat de werkgever zou hebben betaald als het lokale sociale
      zekerheidsstelsel op de werknemer van toepassing zou zijn geweest geheel of gedeeltelijk aan de werknemer wordt
      uitbetaald.

      Daarbij wordt bepaald in hoeverre de werknemer en zijn nabestaanden nog aanspraak kunnen maken op oudedags-,
      nabestaanden- en arbeidsongeschiktheidsvoorzieningen op grond van [hoofdstuk 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0017230
        hoofdstuk: '9'
  - number: '5.7'
    text: |-
      1 De CdP is verantwoordelijk voor de bedrijfsgeneeskundige begeleiding van de werknemer. Voor de uitvoering van de
      bedrijfsgeneeskundige begeleiding laat de CdP zich bijstaan door de bedrijfsgeneeskundige dienst.

      2 De CdP wijst, na overleg met het medezeggenschapsorgaan van de post, de bedrijfsgeneeskundige dienst aan en stelt
      de werknemer daarvan op de hoogte.

      3 Door of namens de bedrijfsgeneeskundige dienst kunnen aan werknemers individueel of gezamenlijk aanwijzingen
      worden gegeven tot het behoud, het herstel of de bevordering van hun arbeidsgeschiktheid. De werknemer is verplicht
      die aanwijzingen op te volgen, met uitzondering van aanwijzingen tot het ondergaan van een ingreep van heelkundige
      aard.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.7
  - number: '5.8'
    text: |-
      1 De werknemer kan de bedrijfsgeneeskundige dienst rechtstreeks consulteren over met de arbeidssituatie
      samenhangende gezondheidsproblemen. De werknemer kan tevens de CdP verzoeken hem in verband met dergelijke
      gezondheidsproblemen aan een onderzoek door of namens de bedrijfsgeneeskundige dienst te onderwerpen. Het
      consulteren en het onderzoek komen voor rekening van de werkgever.

      2 De CdP kan de werknemer opdragen zich te onderwerpen aan een geneeskundig onderzoek door of namens de
      bedrijfsgeneeskundige dienst:

      a. indien naar zijn oordeel gegronde redenen bestaan voor twijfel aan een goede gezondheidstoestand van de
      werknemer;

      b. indien de werknemer niet langer volledig geschikt is gebleken voor het verrichten van zijn werkzaamheden,
      teneinde na te gaan of hiervoor medische oorzaken aanwezig zijn en, zo ja, of de werknemer geschikt kan worden
      geacht voor het vervullen van een andere functie; of

      c. ter beantwoording van de vraag of zich een omstandigheid voordoet als bedoeld in
      [artikel 5.12, onderdeel a, b, c of d, onder 2° of 3°][ref1].

      De werknemer is verplicht om aan dit geneeskundig onderzoek medewerking te verlenen.

      3 De CdP stelt de werknemer buiten dienst indien na een onderzoek als bedoeld in het eerste of tweede lid blijkt
      dat sprake is van een zodanige lichamelijke of geestelijke toestand dat de belangen van de werknemer, van de dienst
      of van bij het verrichten van de werkzaamheden betrokken derden, zich er tegen verzetten dat de werknemer zijn
      werkzaamheden blijft verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel5.12
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0017230
        artikel: '5.12'
        hoofdstuk: '5'
        paragraaf: '7'
  - number: '5.9'
    text: |-
      1 Indien de toepasselijke sociale zekerheid naar het oordeel van HDPO geen of onvoldoende dekking biedt voor
      noodzakelijk in het land van de post te maken ziektekosten, wordt, overeenkomstig lokaal voorschrift of gebruik:

      a. indien de werknemer lokaal een ziektekostenverzekering afsluit: aan de werknemer een tegemoetkoming in de premie
      verstrekt; of

      b. indien de werkgever lokaal een ziektekostenverzekering afsluit: op het loon van de werknemer de premie van
      de ziektekostenverzekering in mindering gebracht, met uitzondering van een aan de werknemer te verstrekken
      tegemoetkoming ziektekosten.

      De hoogte van de tegemoetkoming ziektekosten en eventuele nadere voorwaarden worden opgenomen in de postuitwerking.

      2 De in het eerste lid bedoelde ziektekostenverzekering betreft een verzekering die uitsluitend dekking biedt
      tegen ziektekosten die zijn gemaakt in het land waar de post is gevestigd en eventueel tegen ziektekosten die zijn
      gemaakt in een ander land waarbij de vergoeding niet hoger is dan wanneer de kosten waren gemaakt in het land waar
      de post is gevestigd. De keuze voor de in de vorige volzin bedoelde verzekering geschiedt op de voor het Rijk meest
      economische wijze waarbij in redelijkheid rekening wordt gehouden met het belang dat de werknemer heeft bij een
      adequate verzekering, de lokale omstandigheden en lokaal gebruik.

      3 Kosten waarvoor niet op grond van de in het eerste lid bedoelde ziektekostenverzekering een vergoeding wordt
      ontvangen, komen niet voor vergoeding door de werkgever in aanmerking.

      4 Indien de toepasselijke sociale zekerheid naar het oordeel van HDPO geen of onvoldoende dekking biedt voor
      noodzakelijk in het land van de post te maken ziektekosten en de lokale situatie het naar het oordeel van HDPO
      in redelijkheid niet mogelijk maakt een verzekering af te sluiten als bedoeld in het eerste lid, wordt aan de
      werknemer een tegemoetkoming toegekend in noodzakelijk in het land van de post gemaakte ziektekosten overeenkomstig
      lokaal voorschrift of gebruik, indien er geen recht bestaat op een vergoeding van deze kosten uit anderen hoofde.
      Indien deze situatie zich voordoet, worden hierover in de postuitwerking nadere voorwaarden en voorschriften
      opgenomen. Daarbij kan worden bepaald dat aan de werknemer een premie inzake ziektekosten op het loon in mindering
      wordt gebracht.

      5 De werknemer heeft recht op een tegemoetkoming overeenkomstig het eerste of het vierde lid voor zijn gezinsleden
      indien deze in het desbetreffende kalenderjaar geen inkomsten hebben die hoger zijn dan het loon van de werknemer.

      6 De werknemer dient een verzoek om een tegemoetkoming op grond van het vierde lid in binnen zes maanden na het
      einde van het kalenderjaar waarop het verzoek betrekking heeft, bij gebreke waarvan het recht op tegemoetkoming
      vervalt.

      7 De CdP kan bepalen dat aan de werknemer een voorschot op de in het vierde lid bedoelde tegemoetkoming wordt
      verstrekt.

      8 Ten aanzien van de werknemer die in deeltijd werkt, bedraagt de in het eerste, vierde en vijfde lid bedoelde
      tegemoetkoming een evenredig deel van de tegemoetkoming bij een volledige werktijd.

      9 De CdP kan de werknemer toestaan om aansluitend aan de afloop van zijn arbeidsovereenkomst voor eigen kosten te
      blijven deelnemen aan de door de werkgever afgesloten ziektekostenverzekering mits de verzekeraar dat toestaat.
      De vorige volzin is van overeenkomstige toepassing op de gezinsleden van de werknemer. De CdP kan aan die deelname
      voorwaarden stellen.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.9
  - number: '5.10'
    text: |-
      1 Indien de ziekte, uit hoofde waarvan de werknemer ongeschikt is zijn werkzaamheden te verrichten, voortvloeit uit
      een dienstongeval of een beroepsziekte, vergoedt de werkgever alle naar het oordeel van de CdP noodzakelijk in het
      land van de post gemaakte ziektekosten die voor rekening van de werknemer blijven.

      2 Indien een dienstongeval plaatsvindt tijdens een dienstreis buiten het land van de post waar de werknemer werkt,
      vergoedt de werkgever tevens de noodzakelijk buiten het land van de post gemaakte ziektekosten.

      3 In dit artikel wordt verstaan onder:

      a. beroepsziekte: een ziekte die in overwegende mate haar oorzaak vindt in de aard van de aan de werknemer
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en niet in
      belangrijke mate aan zijn schuld of onvoorzichtigheid is te wijten;

      b. dienstongeval: een ongeval dat in overwegende mate zijn oorzaak vindt in de aard van de aan de werknemer
      opgedragen werkzaamheden of in de bijzondere omstandigheden, waaronder deze moesten worden verricht, en niet in
      belangrijke mate aan zijn schuld of onvoorzichtigheid is te wijten.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.10
  - number: '5.11'
    text: |-
      1 De werknemer die ongeschikt is tot het verrichten van zijn werkzaamheden wegens ziekte geniet vanaf de dag waarop
      deze ongeschiktheid aanvangt gedurende een bepaalde termijn zijn volledige loon, dan wel een percentage van zijn
      loon, overeenkomstig lokaal voorschrift of gebruik.

      2 Of de werknemer bij ziekte zijn volledige loon, dan wel een percentage van zijn loon ontvangt en gedurende welke
      termijn wordt opgenomen in de postuitwerking.

      3 Indien de werknemer een wisselend aantal uren per week werkt, wordt onder het in het eerste lid bedoelde loon
      verstaan het loon dat de werknemer gemiddeld heeft genoten in de dertien kalenderweken voorafgaande aan het
      ontstaan van zijn ongeschiktheid tot het verrichten van zijn werkzaamheden wegens ziekte.

      4 Voor het vaststellen van de in het eerste lid bedoelde termijn worden perioden van ongeschiktheid tot het
      verrichten van werkzaamheden wegens ziekte samengeteld indien zij elkaar met een onderbreking van minder dan 31
      kalenderdagen opvolgen.

      5 De werknemer die tijdens zijn ziekte in staat is zijn werkzaamheden gedeeltelijk te verrichten of beschikbare
      passende andere werkzaamheden geheel of gedeeltelijk te verrichten, ontvangt zijn volledige loon over het aantal
      uren dat hij die werkzaamheden verricht of aanbiedt te verrichten.

      6 Op de in het eerste lid bedoelde aanspraak, worden in mindering gebracht de voorzieningen waarop de werknemer
      vanwege zijn ziekte recht heeft op grond van het voor hem geldende sociale zekerheidsstelsel.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.11
  - number: '5.12'
    text: |-
      Geen recht op betaling van het in [artikel 5.11][ref1] bedoelde loon bestaat:

      a. indien de ziekte is voorgewend, althans zodanig overdreven wordt voorgesteld, dat ongeschiktheid tot het
      verrichten van werkzaamheden wegens ziekte niet kan worden aangenomen;

      b. indien de werknemer de ongeschiktheid tot het verrichten van werkzaamheden wegens ziekte door zijn grove
      nalatigheid of zijn opzet heeft veroorzaakt, tenzij hem daarvan op grond van zijn psychische toestand geen verwijt
      kan worden gemaakt;

      c. indien de ongeschiktheid tot het verrichten van werkzaamheden wegens ziekte zich voordoet binnen een half jaar
      na het in [artikel 2.2][ref2] bedoelde geneeskundig onderzoek en tevens blijkt dat de werknemer onjuiste informatie
      omtrent zijn gezondheidstoestand heeft verstrekt of gegevens heeft verzwegen, ten gevolge waarvan de verklaring van
      geschiktheid om de aan de desbetreffende functie verbonden werkzaamheden te verrichten, ten onrechte is afgegeven,
      tenzij de werknemer aannemelijk maakt dat hij te goeder trouw heeft gehandeld;

      d. gedurende de tijd dat de werknemer:

      1°. weigert zich te onderwerpen aan een geneeskundig onderzoek door of namens de bedrijfsgeneeskundige dienst of,
      na voor een dergelijk onderzoek te zijn opgeroepen, zonder geldige reden niet verschijnt;

      2°. zonder voldoende gronden nalaat zich onder geneeskundige behandeling te stellen of te blijven stellen, dan
      wel zich niet houdt aan de voorschriften die hem door de behandelende geneeskundige gegeven zijn, anders dan
      voorschriften tot het verlenen van medewerking aan een ingreep van heelkundige aard;

      3°. zich zodanig gedraagt dat zijn genezing wordt belemmerd of vertraagd;

      4°. tijdens de ongeschiktheid tot het verrichten van zijn werkzaamheden wegens ziekte werkzaamheden voor zichzelf
      of voor derden verricht, tenzij de bedrijfsgeneeskundige dienst dit in het belang van zijn genezing wenselijk wordt
      acht;

      5°. in gebreke blijft op het door de bedrijfsgeneeskundige dienst bepaalde tijdstip en in de door deze dienst
      bepaalde mate zijn werkzaamheden te hervatten, tenzij hij daarvoor een door deze dienst of door de CdP als geldig
      erkende reden heeft opgegeven; of

      6°. zonder deugdelijke grond weigert hem aangeboden passende arbeid, waartoe de bedrijfsgeneeskundige dienst hem in
      staat acht, te aanvaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel5.11
      [ref2]: https://wetten.overheid.nl/BWBR0017230#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel5.12
