  - number: '10.3'
    text: De Rechtspositieregeling lokaal indienstgenomen werknemers wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel10.3
  - number: '10.4'
    text: |-
      Voor de werknemer die op 31 december 2004 recht had op een vergoeding omdat hij een kind had dat op
      grond van artikel 1.1, onderdeel h, van de Rechtspositieregeling lokaal indienstgenomen werknemers j°
      [artikel 2 van het RDBZ][ref1] werd aangemerkt als afhankelijk kind, terwijl op grond van deze regeling dat
      kind niet wordt aangemerkt als afhankelijk kind, geldt met betrekking tot de desbetreffende vergoeding voor dat
      afhankelijke kind de volgende overgangsregeling:

      a. tot 1 januari 2006 wordt de vergoeding toegekend overeenkomstig de regeling zoals deze luidde op 31 december
      2004;

      b. over de periode van 1 januari 2006 tot 1 januari 2007 wordt de helft van de vergoeding toegekend overeenkomstig
      de regeling zoals deze luidde op 31 december 2004.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#Artikel2
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0004052
        artikel: '2'
  - number: '10.5'
    text: |-
      1 Indien een bepaling in deze regeling strijdig is met een bepaling in een postuitwerking, kan deze strijdigheid
      opgeheven worden door middel van aanpassing van de desbetreffende bepaling in de postuitwerking, behoudens ingeval
      die bepaling in de postuitwerking is opgenomen vanwege lokaal voorschrift of gebruik.

      2 Zolang en voor zover er sprake is van strijdigheid van een bepaling van deze regeling met een bepaling in een
      postuitwerking is de desbetreffende bepaling in deze regeling op de arbeidsovereenkomst van de werknemer van de
      desbetreffende post niet van toepassing.

      3 De in de postuitwerkingen voorkomende aanhalingen van artikelen van de Rechtspositieregeling lokaal
      indienstgenomen werknemers worden gewijzigd in aanhalingen van artikelen van deze regeling, overeenkomstig de in
      [bijlage 2][ref1] opgenomen transponeringstabel.


      [ref1]: https://wetten.overheid.nl/BWBR0017230
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel10.5
