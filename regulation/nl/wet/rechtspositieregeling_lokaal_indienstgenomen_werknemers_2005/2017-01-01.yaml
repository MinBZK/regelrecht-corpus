  - number: '8.4'
    text: |-
      1 De CdP kan de arbeidsovereenkomst met een werknemer die geheel of gedeeltelijk ongeschikt is om zijn
      werkzaamheden te verrichten wegens ziekte niet opzeggen gedurende een in de postuitwerking opgenomen termijn,
      behalve als de opzegging niet in verband staat met de ziekte en de consequenties daarvan. De in de vorige volzin
      bedoelde termijn wordt vastgesteld overeenkomstig lokaal voorschrift of gebruik. De bewijslast dat een opzegging
      niets te maken heeft met de ziekte en de consequenties daarvan ligt bij de werkgever.

      2 De in het eerste lid bedoelde opzegging kan slechts plaatsvinden indien de ziekte blijkt uit een geneeskundig
      onderzoek door of namens de bedrijfsgeneeskundige dienst.

      3 Voor het vaststellen van het tijdstip waarop overeenkomstig het eerste lid de arbeidsovereenkomst kan worden
      opgezegd, worden perioden van ongeschiktheid tot het geheel of gedeeltelijk verrichten van werkzaamheden wegens
      ziekte samengeteld, indien zij elkaar met een onderbreking van minder dan 31 dagen opvolgen.

      4 Indien de CdP de arbeidsovereenkomst in strijd met het eerste lid opzegt kan de werknemer:

      gedurende twee maanden na de opzegging van de arbeidsovereenkomst de opzegging vernietigen door middel van het
      zenden van een schriftelijke kennisgeving met die strekking aan de CdP; of

      een beroep doen op [artikel 8.9][ref1].

      5 Het eerste lid is niet van toepassing bij een opzegging gedurende de proeftijd.

      6 Een rechtsvordering in verband met de in het vierde lid, onderdeel a, bedoelde vernietiging verjaart door verloop
      van zes maanden na de dag waartegen is opgezegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel8.9
