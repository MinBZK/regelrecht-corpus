        hoofdstuk: '4'
        paragraaf: '5'
  - number: '2.3'
    text: |-
      1 Een kandidaat-werknemer kan worden onderworpen aan een psychologisch onderzoek indien de aard van de te vervullen
      functie dat naar het oordeel van de CdP wenselijk maakt.

      2 De kosten van het psychologisch onderzoek komen voor rekening van de werkgever. De door de kandidaat-werknemer
      gemaakte noodzakelijke reis- en verblijfkosten worden vergoed overeenkomstig [hoofdstuk 4, paragraaf 5][ref1].

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de werknemer die op een andere functie binnen de
      post solliciteert.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel2.3
