  - number: '9.5'
    text: |-
      1 Indien een werknemer dan wel voormalig werknemer die in het genot was van een suppletie op
      arbeidsongeschiktheidsvoorzieningen als bedoeld in [artikel 9.8][ref1] of een suppletie op oudedagsvoorzieningen
      als bedoeld in [artikel 9.4][ref2] overlijdt en er geen verzekering die voorziet in een dekking van de risico’s
      van overlijden als bedoeld in [artikel 9.3, eerste lid][ref3], is afgesloten, hebben de partner en het kind dat
      op het moment van het overlijden een afhankelijk kind was recht op een suppletie op nabestaandenvoorzieningen. Dit
      recht vervalt indien de partner, respectievelijk het afhankelijke kind, verwijtbaar is aan het overlijden van de
      werknemer dan wel voormalig werknemer.

      2 Voor rechten op grond van [artikel 9.7][ref4], dan wel de [artikelen 9.6][ref5] en [9.7][ref6] tezamen,
      geldt dat het totale suppletieplafond niet hoger is dan het in het [tweede lid van artikel 9.4][ref7] bedoelde
      suppletieplafond dat op de werknemer van toepassing was, dan wel dat voor de voormalig werknemer op de
      pensioendatum, bij ongewijzigde voortzetting van de arbeidsovereenkomst, van toepassing zou zijn geweest. Zo nodig
      worden de rechten op grond van [artikel 9.7][ref8] naar evenredigheid verlaagd.

      3 Rechten op suppletie op grond van deze paragraaf bestaan uitsluitend voor de partner met wie de werknemer
      op de laatste dag van zijn arbeidsovereenkomst ten minste een jaar gehuwd is dan wel ten minste een jaar een
      geregistreerd partnerschap of een samenlevingsrelatie heeft als bedoeld in [artikel 1.1, onderdeel h][ref9].

      4 Indien het in het derde lid bedoelde huwelijk, geregistreerd partnerschap, dan wel samenlevingsrelatie van de
      werknemer dan wel voormalig werknemer eindigt, anders dan door diens overlijden, vervallen voor de partner alle
      aanspraken uit hoofde van deze paragraaf.


