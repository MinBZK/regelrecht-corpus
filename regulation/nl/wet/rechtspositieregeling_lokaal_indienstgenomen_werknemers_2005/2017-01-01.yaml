  - number: '9.10'
    text: |-
      1 Op de vaststelling en uitbetaling van de suppletie zijn de [artikelen 4.8 tot en met 4.11][ref1] en [4.20][ref2]
      van overeenkomstige toepassing. HDPO kan in individuele gevallen van [artikel 4.20, vijfde lid][ref3], afwijken.

      2 Een periodiek uit te betalen suppletie als bedoeld in de [artikelen 9.4, eerste lid][ref4],
      [9.6, eerste lid][ref5], [9.7, eerste lid][ref6], en [9.8, eerste lid][ref7], wordt door HDPO vastgesteld als een
      vast bedrag dat gedurende een periode van ten hoogste twaalf maanden ongewijzigd zal gelden. Tussentijdse wijziging
      van dat bedrag is mogelijk indien bijzondere omstandigheden dat naar de mening van HDPO noodzakelijk maken.

      3 De suppletie wordt door de werkgever maandelijks aan de gerechtigde uitbetaald. Indien bijzondere omstandigheden
      daartoe aanleiding geven, kan HDPO de betalingsfrequentie van de suppletie wijzigen, zonodig met inachtneming van
      [artikel 9.1, tweede lid][ref8].

      4 In afwijking van het derde lid kan 3W de aanspraak op suppletie van de werknemer en de voormalig werknemer
      die nog niet in het genot is van een suppletie en van wie de arbeidsovereenkomst respectievelijk de aansluitende
      arbeidsovereenkomsten 15 jaar of korter heeft respectievelijk hebben geduurd, in een eenmalig bedrag vaststellen
      en uitbetalen indien de post waar betrokkene in dienst is of laatstelijk in dienst was, is gesloten of binnen
      een termijn van zes maanden zal sluiten en er na die sluiting in dat land geen werknemers meer werkzaam zijn
      respectievelijk zullen zijn.

      5 De berekening van de hoogte van het eenmalige bedrag geschiedt onder gebruikmaking van de door HDPO terzake
      vastgestelde berekeningsformules waarin onder meer rekening wordt gehouden met:

        - het voor betrokkene geldende suppletieplafond;
        - de in dit hoofdstuk bedoelde voorzieningen waarop betrokkene uit anderen hoofde recht heeft en op het
      suppletieplafond in mindering zullen worden gebracht;
        - de leeftijd van betrokkene;
        - de burgerlijke staat van betrokkene;
        - de in de postuitwerking vermelde pensioendatum;
        - een sterftetabel die de gemiddelde levensverwachting bevat voor het desbetreffende land of de desbetreffende
      regio.

      6 Het vierde lid kan door 3W bij of na beëindiging van de arbeidsovereenkomst overeenkomstig worden toegepast op
      schriftelijk verzoek van de werknemer of van de voormalig werknemer die al dan niet reeds in het genot is van een
      in [hoofdstuk 9][ref9] bedoelde suppletie mits de arbeidsovereenkomst dan wel de aansluitende arbeidsovereenkomsten
      15 jaar of korter heeft geduurd respectievelijk hebben geduurd. Het verzoek om afkoop van de in de vorige volzin
      bedoelde persoon wordt ingewilligd tenzij een zwaarwegend dienstbelang zich, naar het oordeel van HDPO, daartegen
      verzet.

      7 In afwijking van [artikel 9.1, eerste lid, onderdeel e][ref10], wordt de suppletiegrondslag voor de werknemer en
      voormalig werknemer op wie het vierde dan wel het zesde lid niet van toepassing is, als volgt vastgesteld. Vanaf 1
      januari van het jaar volgende op het jaar waarvoor voor de gesloten post laatstelijk loonschalen zijn vastgesteld,
      wordt het in artikel 9.1, eerste lid, onderdeel e, bedoelde loonbedrag door 3W telkens aangepast aan de inflatie
      in het land waar de post was gevestigd, met een maximum van 15 procent. Ingeval de inflatie meer dan 15 procent
      bedraagt, kan HDPO besluiten het percentage van de aanpassing op meer dan 15 procent vast te stellen. Voor het
      bepalen van het inflatiepercentage wordt uitgegaan van de gegevens van de Economist Intelligent Unit (EIU).

      8 Indien uit de betaling van een suppletie bijzondere kosten voortvloeien, kunnen deze op de suppletie in mindering
      worden gebracht.


