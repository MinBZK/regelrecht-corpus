  - number: '2.5'
    text: |-
      1 De indienstneming van de werknemer geschiedt voor bepaalde of onbepaalde tijd.

      2 De indienstneming van de werknemer voor onbepaalde tijd behoeft de toestemming van 3W.

      3 Bij de indienstneming kan schriftelijk een proeftijd worden overeengekomen.

      4 Indien een proeftijd is overeengekomen, is ieder der partijen, zolang die tijd niet is verstreken, bevoegd de
      arbeidsovereenkomst met onmiddellijke ingang op te zeggen.

      5 De proeftijd is voor de werkgever en de werknemer gelijk en bedraagt ten hoogste twee maanden.

      6 Elk beding waarbij de proeftijd niet voor beide partijen gelijk is of op langer dan twee maanden wordt gesteld,
      alsmede elk beding waarbij door het aangaan van een nieuwe proeftijd de gezamenlijke proeftijden langer dan twee
      maanden worden, is nietig.

      7 Met de kandidaat-werknemer kan slechts een arbeidsovereenkomst worden aangegaan indien hem door de lokale
      autoriteiten wordt toegestaan in het desbetreffende land te verblijven en de werkzaamheden voor de post te
      verrichten.

      8 De kosten voor het verkrijgen van een verblijfs- of werkvergunning dan wel daarmee vergelijkbaar document komen
      voor rekening van de kandidaat-werknemer tenzij die kosten overeenkomstig lokaal voorschrift of lokaal gebruik
      geheel of gedeeltelijk voor rekening van de werkgever komen.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel2.5
  - number: '3.1'
    text: |-
      In de postuitwerking wordt, met inachtneming van lokaal voorschrift of gebruik, opgenomen:

      a. een werktijdregeling die ten minste omvat:

      1°. het voor de werknemers per week geldende aantal arbeidsuren;

      2°. een schema van aanvang en einde van de dagelijkse werktijden en, tenzij lokaal niet voorgeschreven en lokaal
      niet gebruikelijk, de rusttijden waarmee deze worden onderbroken;

      3°. het aantal rust- en feestdagen waarop, behoudens bijzondere redenen van dienstbelang, geen dienst wordt geëist;

      b. een regeling betreffende de vaststelling van de vergoeding die de werknemer ontvangt indien hij dienst verricht
      buiten de voor hem geldende werktijdregeling.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 De werknemer die ten minste een jaar werkzaam is bij de post kan de CdP verzoeken om aanpassing van de uit zijn
      arbeidsovereenkomst voortvloeiende arbeidsduur.

      2 Het verzoek wordt ten minste vier maanden vóór het beoogde tijdstip van ingang van de aanpassing van de
      arbeidsduur schriftelijk bij de CdP ingediend. Het verzoek bevat een opgave van het gewenste tijdstip van ingang
      en de gewenste omvang van de aanpassing van de arbeidsduur per week alsmede de gewenste spreiding van de uren over
      de week.

      3 De CdP willigt het verzoek in voor zover het dienstbelang zich daartegen niet verzet.

      4 De werknemer kan een nieuw verzoek indienen na twee jaren nadat de CdP een verzoek om aanpassing van de
      arbeidsduur heeft ingewilligd of afgewezen.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      1 De werknemer heeft recht op een aantal vakantie-uren overeenkomstig lokaal voorschrift en lokaal gebruik. Het
      aantal vakantie-uren per jaar wordt opgenomen in de postuitwerking.

      2 Over kalendermaanden gedurende welke de werknemer in afwijking van de voor hem geldende werktijdregeling in
      het geheel geen werkzaamheden verricht, bouwt hij geen vakantie-uren op. Over kalendermaanden gedurende welke
      hij in afwijking van de voor hem geldende werktijdregeling gedeeltelijk werkzaamheden verricht, bouwt hij slechts
      vakantie-uren op naar evenredigheid van het gedeelte van zijn taak dat hij feitelijk vervult.

      3 Het tweede lid is niet van toepassing ingeval:

      a. de werknemer als gevolg van ziekte zijn werkzaamheden niet of slechts gedeeltelijk verricht zolang de
      verhindering tot het verrichten van werkzaamheden korter duurt dan 13 weken, waarbij tijdvakken van ziekte worden
      samengeteld indien zij elkaar met een onderbreking van minder dan 31 aaneengesloten kalenderdagen opvolgen;

      b. van genoten zwangerschaps- en bevallingsverlof, voor zover dat verlof de duur van 16 weken niet overschrijdt;

      c. van genoten vakantie.

      4 De CdP stelt de tijdstippen van aanvang en einde van de vakantie vast na overleg met de werknemer. Dit overleg
      en deze vaststelling vinden, tenzij bijzondere omstandigheden dit verhinderen, zo tijdig plaats, dat de werknemer
      gelegenheid heeft tot het treffen van voorbereidingen voor de besteding van de vakantie.

      5 De CdP kan, indien daartoe gewichtige redenen aanwezig zijn, na overleg met de werknemer, het door hem
      vastgestelde tijdvak van de vakantie wijzigen. De schade die de werknemer tengevolge van die wijziging lijdt, wordt
      door de werkgever vergoed.

      6 Indien de werknemer bij het einde van de arbeidsovereenkomst nog recht op vakantie-uren heeft, heeft hij voor
      elk vakantie-uur recht op een vergoeding ten bedrage van het uurloon dat hij direct voorafgaand aan zijn ontslag
      genoot.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      1 De werknemer heeft recht op verlof tijdens feestdagen en buitengewoon verlof overeenkomstig lokaal voorschrift en
      lokaal gebruik.

      2 In bijzondere gevallen kan door HDPO worden besloten meer verlof tijdens feestdagen toe te kennen dan lokaal
      voorgeschreven of gebruikelijk, onder evenredige verlaging van het loon of het aantal vakantie-uren.

      3 De CdP stelt jaarlijks, na overleg met het medezeggenschapsorgaan van de post, overeenkomstig lokaal voorschrift
      en lokaal gebruik de feestdagen vast waarop met behoud van loon geen dienst wordt geëist.

      4 De ten aanzien van buitengewoon verlof geldende regels zijn opgenomen in de postuitwerking.

      5 Indien de post op een lokale of Nederlandse feestdag is gesloten en de CdP die feestdag in dat kalenderjaar niet
      met toepassing van het derde lid heeft aangewezen als feestdag waarop met behoud van loon van de werknemer geen
      dienst wordt geëist, worden de uren van die dag naar de keuze van de werknemer op zijn vakantie-tegoed in mindering
      gebracht dan wel op een ander moment door hem ingehaald.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel3.4
  - number: '4.1'
    text: |-
      1 HDPO deelt de op de post aanwezige functies in de in [bijlage 1][ref1] genoemde loonschalen in.

      2 Iedere loonschaal bestaat uit zestien loonnummers.

      3 Aan ieder loonnummer is een bedrag verbonden, genoemd het loonbedrag.

      4 De loonbedragen vormen een betrouwbare afspiegeling van het lokaal gebruikelijke loon. Bij het vaststellen van
      de loonbedragen wordt rekening gehouden met aard en niveau van de te verrichten werkzaamheden, de diensttijd,
      de ervaring, de overige arbeidsvoorwaarden en andere factoren die lokaal voor het vaststellen van het loon
      gebruikelijk zijn.

      5 De loonbedragen, behorende bij het minimum en maximum loonnummer per loonschaal, worden vastgesteld met
      gebruikmaking van het door HDPO vastgestelde loonvaststellingsinstrumentarium.

      6 De loonbedragen, behorende bij de tussengelegen loonnummers per loonschaal, worden vastgesteld door het verschil
      tussen de in het vijfde lid bedoelde minimum- en maximumbedragen gelijk te verdelen over de zestien loonnummers
      binnen de desbetreffende loonschaal.

      7 De vaststelling van de loonbedragen geschiedt zodra daartoe naar het oordeel van HDPO aanleiding is, maar in
      beginsel eenmaal per jaar.

      8 De in dit artikel bedoelde loonbedragen worden opgenomen in de postuitwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0017230
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0017230
  - number: '4.2'
    text: |-
      1 Indien de loonbedragen in een andere dan de lokale valuta zijn vastgesteld, kan HDPO, na overleg met de CdP, het
      loonbedrag per de eerste dag van de volgende maand aanpassen indien hij van oordeel is dat devaluaties, revaluaties
      of andere ontwikkelingen een ongewenste wijziging van het loonbedrag ten opzichte van het lokaal gebruikelijke
      loonpeil met zich brengen.

      2 Indien de in het eerste lid bedoelde situatie zich voordoet, wordt de postuitwerking zo spoedig mogelijk
      gewijzigd met terugwerkende kracht tot de in het eerste lid bedoelde dag.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      1 Voor de werknemer geldt de loonschaal die, overeenkomstig [bijlage 1][ref1], behoort bij de door hem te vervullen
      functie.

      2 Het voor de werknemer geldende loonbedrag wordt bepaald door het loonnummer dat op hem binnen zijn loonschaal
      van toepassing is. Bij indiensttreding wordt het laagste loonnummer toegekend, tenzij bijzondere omstandigheden
      een hoger loonnummer rechtvaardigen. Bij een deeltijdarbeidovereenkomst wordt het loonbedrag naar evenredigheid
      verlaagd.

      3 Aan de werknemer aan wie nog niet het hoogste loonnummer in zijn loonschaal is toegekend, kan ten hoogste eenmaal
      per jaar het naasthogere loonnummer in zijn loonschaal worden toegekend indien hij naar het oordeel van de CdP zijn
      werkzaamheden op een goede wijze verricht.

      4 In afwijking van het derde lid kan de CdP in bijzondere gevallen besluiten dat de werknemer een hoger loonnummer
      in zijn loonschaal wordt toegekend dan het naasthogere loonnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0017230
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0017230
  - number: '4.4'
    text: |-
      1 Indien de omstandigheden op de lokale arbeidsmarkt, gezien de specifieke functievereisten, dit wenselijk maken,
      kan HDPO, na overleg met de CdP, als aanvulling op het loonbedrag een individuele arbeidsmarkttoeslag aan een
      werknemer toekennen.

      2 Toekenning van de arbeidsmarkttoeslag geschiedt voor een periode van ten hoogste drie jaren. Indien daarvoor naar
      het oordeel van HDPO, na overleg met de CdP, redenen aanwezig zijn, kan HDPO besluiten tot verlenging met telkens
      een periode van ten hoogste drie jaren.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel4.4
  - number: 4.4a
    text: |-
      1 Aan de werknemer die zich om redenen van dienstbelang buiten de voor hem vastgestelde werktijden ingevolge
      een schriftelijke aanwijzing van de CdP regelmatig of vrij regelmatig bereikbaar en beschikbaar dient te houden
      teneinde bij eerste oproep arbeid te gaan verrichten, wordt voor ieder uur bereikbaarheid en beschikbaarheid een
      toeslag toegekend.

      2 De toeslag bedraagt per uur bereikbaarheid en beschikbaarheid een percentage van het voor de werknemer geldende
      loon per uur en wel:

      a. 5% op de doordeweekse uren, en

      b. 10% op de uren in het weekend of op een feestdag,

      met dien verstande dat genoemde percentages worden berekend over ten hoogste het loon per uur, behorende bij
      loonnummer 15 van loonschaal 7.

      3 In afwijking van het eerste en tweede lid kan de CdP, na overleg met de werknemer, ervoor kiezen de dienst met
      vrije tijd te compenseren, waarbij een beschikbaarheidsdienst van 24 uur op een doordeweekse dag gecompenseerd
      wordt met 1,5 uur verlof en in het weekend of op een feestdag met 2,5 uur verlof. Een dienst van minder dan 24 uur
      wordt naar evenredigheid gecompenseerd.

      4 De in het derde lid bedoelde vrije tijd kan worden opgenomen binnen een periode van 6 maanden nadat de CdP de
      vrije tijd heeft toegekend. Niet opgenomen vrije tijd vervalt na afloop van die periode, tenzij die vrije tijd
      vanwege dienstredenen niet kon worden opgenomen, in welk geval de niet opgenomen tijd alsnog wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel4.4a
  - number: '4.5'
    text: |-
      1 Indien het lokaal voorgeschreven of gebruikelijk is, worden aan de werknemer, als aanvulling op het loonbedrag,
      toeslagen toegekend.

      2 De in het eerste lid bedoelde toeslagen worden in de postuitwerking opgenomen, met vermelding van de hoogte en
      duur daarvan, alsmede de voorwaarden voor toekenning.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel4.5
  - number: '4.6'
    text: |-
      1 De CdP kan de werknemer een extra beloning verlenen wegens buitengewone toewijding of zeer goede vervulling van
      de functie. De beloningen zijn:

      a. een attentie;

      b. extra verlof;

      c. een gratificatie van ten hoogste één bruto maandloon per kalenderjaar. In bijzondere gevallen kan in een
      kalenderjaar een hoger bedrag worden toegekend met mededeling daarvan aan HDPO;

      d. toekenning van een hoger loonnummer in de loonschaal indien aan de werknemer nog niet het hoogste loonnummer in
      zijn loonschaal was toegekend.

      2 Indien het lokaal voorgeschreven of gebruikelijk is wordt aan de werknemer een diensttijdgratificatie toegekend.
      Deze diensttijdgratificatie wordt in de postuitwerking opgenomen, met vermelding van de hoogte en duur daarvan,
      alsmede de voorwaarden voor toekenning.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 De werknemer die is aangewezen als bedrijfshulpverlener als bedoeld in [artikel 6.8][ref1], heeft indien hij de
      taken in verband met bedrijfshulpverlening in voldoende omvang verricht direct na afloop van ieder kalenderjaar,
      recht op een toelage bedrijfshulpverlening. Deze toelage bedraagt een percentage van het op de desbetreffende
      post op het moment van uitbetaling geldende maandloon dat behoort bij het hoogste loonnummer van loonschaal 5, ter
      hoogte van:

      a. 8% voor de bedrijfshulpverlener zonder specialisatie;

      b. 16% voor de gespecialiseerde bedrijfshulpverlener die zich heeft bekwaamd in eerste hulp bij ongevallen.

      2 De bedrijfshulpverlener aan wie leidinggevende taken zijn opgedragen ten behoeve van de uitvoering van de
      bedrijfshulpverlening door een groep bedrijfshulpverleners, ontvangt naast de in het eerste lid bedoelde toelage,
      direct na afloop van ieder kalenderjaar dat hij deze leidinggevende taken heeft verricht een extra toelage van
      10% van het op de desbetreffende post op het moment van uitbetaling geldende maandloon dat behoort bij het hoogste
      loonnummer van loonschaal 5.

      3 Bij het vervullen van de in het eerste en tweede lid bedoelde taken voor een kortere periode dan twaalf maanden,
      wordt een evenredig gedeelte van de daarbij behorende toelage toegekend.

      4 Bij werkzaamheden als bedrijfshulpverlener buiten de voor de werknemer geldende werktijdregeling wordt
      een overwerkvergoeding toegekend ter hoogte van 125% van het uurloon behorende bij het hoogste loonnummer
      van loonschaal 5. De krachtens de postuitwerking geldende overwerkregeling is op deze werkzaamheden niet van
      toepassing.

      5 Nadat de werknemer een aantal jaren de taken van bedrijfshulpverlener heeft verricht, heeft hij recht op een
      jubileumgratificatie bedrijfshulpverlening. Deze gratificatie bedraagt een percentage van het op de desbetreffende
      post op het moment van uitbetaling geldende maandloon dat behoort bij het hoogste loonnummer van loonschaal 5, ter
      hoogte van:

      a. 13% na vijf jaren;

      b. 16% na tien jaren;

      c. 19% na vijftien jaren en daarna iedere vijf jaren.


