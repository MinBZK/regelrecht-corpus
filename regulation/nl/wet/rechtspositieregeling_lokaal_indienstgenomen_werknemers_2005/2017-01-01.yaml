  - number: '8.8'
    text: |-
      1 Zowel de werkgever als de werknemer kan de arbeidsovereenkomst onverwijld opzeggen om een dringende reden, onder
      gelijktijdige mededeling van die reden aan de wederpartij.

      2 De partij die de arbeidsovereenkomst onverwijld opzegt zonder een dringende reden of zonder gelijktijdige
      mededeling van de dringende reden is verplicht tot betaling van een schadevergoeding.

      3 De in het tweede lid bedoelde schadevergoeding is gelijk aan het bedrag van het in geld vastgesteld loon voor
      de tijd, dat de arbeidsovereenkomst bij inachtneming van de voor opzegging geldende bepalingen had behoren voort
      te duren.

      4 Als dringende redenen in de zin van het eerste lid worden beschouwd omstandigheden die ten gevolge hebben dat
      redelijkerwijze niet gevergd kan worden de arbeidsovereenkomst te laten voortduren. Dringende redenen zullen
      onder andere aanwezig geacht kunnen worden als een van de partijen grovelijk de plichten veronachtzaamt, die de
      arbeidsovereenkomst hem oplegt.

      5 Een rechtsvordering op grond van dit artikel verjaart door verloop van zes maanden na de dag waartegen is
      opgezegd.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel8.8
  - number: '8.9'
    text: |-
      1 Indien de werkgever de arbeidsovereenkomst, al of niet met inachtneming van de voor de opzegging geldende
      bepalingen, kennelijk onredelijk opzegt, is deze verplicht aan de werknemer naar billijkheid een schadevergoeding
      toe te kennen.

      2 Opzegging van de arbeidsovereenkomst door de werkgever zal onder andere kennelijk onredelijk geacht kunnen worden
      wanneer deze geschiedt:

      a. zonder opgave van redenen of onder opgave van een voorgewende of valse reden;

      b. terwijl, mede in aanmerking genomen de voor de werknemer getroffen voorzieningen en de voor hem bestaande
      mogelijkheden om ander passend werk te vinden, de gevolgen van de opzegging voor hem te ernstig zijn in
      vergelijking met het belang van de werkgever bij de opzegging;

      c. wegens het enkele feit dat de werknemer met een beroep op een ernstig gewetensbezwaar weigert de bedongen
      werkzaamheden te verrichten;

      d. in strijd met [artikel 5.15][ref1] of [8.4][ref2].

      3 Het eerste lid is niet van toepassing bij een opzegging gedurende de proeftijd, of bij een rechtmatige opzegging
      wegens een dringende reden of wegens ernstig plichtsverzuim.

      4 Een rechtsvordering op grond van dit artikel verjaart door verloop van zes maanden na de dag waartegen is
      opgezegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel5.15
      [ref2]: https://wetten.overheid.nl/BWBR0017230#Artikel8.4
