  - number: '9.6'
    text: |-
      1 Voor de suppletie op de in [artikel 9.5, eerste lid][ref1], bedoelde nabestaandenvoorzieningen voor de partner
      geldt als suppletieplafond het bedrag, gelijk aan 70% van het in [artikel 9.4, tweede lid][ref2], bedoelde
      suppletieplafond, met dien verstande dat in dit geval wordt uitgegaan van de suppletiediensttijd die voor de
      werknemer, dan wel voormalig werknemer, op zijn pensioendatum zou hebben gegolden indien zijn arbeidsovereenkomst
      tot die datum voortgezet was.

      2 De suppletie op het nabestaandenpensioen wordt verminderd met 2,5% voor elk vol jaar dat het leeftijdsverschil
      meer dan tien jaar bedraagt indien de partner meer dan tien jaar jonger was dan de werknemer dan wel voormalig
      werknemer. Deze vermindering vindt niet plaats indien op het moment van overlijden van de werknemer dan wel
      voormalig werknemer, de nabestaande gedurende ten minste vijf jaren de partner van de werknemer of voormalig
      werknemer is geweest.

      3 Voor de toepassing van dit artikel worden onder de in [artikel 9.1, eerste lid, onderdeel a, onder 2°][ref3],
      bedoelde voorzieningen in elk geval verstaan:

      a. nabestaandenvoorzieningen waarop recht bestaat op grond van het van toepassing zijnde sociale zekerheidsstelsel;

      b. overige nabestaandenvoorzieningen waaraan de werkgever op enigerlei wijze heeft meebetaald.

      4 De in het eerste lid bedoelde suppletie wordt aan de nabestaande toegekend met ingang van de eerste dag van de
      maand van overlijden van de werknemer dan wel voormalig werknemer. De toekenning van de suppletie eindigt:

      a. op de eerste van de maand, volgende op de maand waarin de periode gedurende welke de suppletie werd toegekend,
      gelijk is aan de duur van de arbeidsovereenkomst, maar niet eerder dan vijf jaren na het overlijden van de
      werknemer dan wel voormalig werknemer. [Artikel 9.4, eerste lid, tweede volzin][ref4], is van overeenkomstige
      toepassing;

      b. op de eerste dag van de maand, volgend op de maand waarin de nabestaande overlijdt;

      c. op de eerste dag van de maand, volgend op de maand waarin de nabestaande is hertrouwd, een geregistreerd
      partnerschap is aangegaan, dan wel een samenlevingsrelatie is aangegaan met een levenspartner als bedoeld in
      [artikel 1.1, onderdeel h][ref5].


