  - number: '9.2'
    text: |-
      1 De werknemer, voormalig werknemer dan wel nabestaande is verplicht tijdig de werkgever alle informatie te
      verstrekken die van belang is voor een goede uitvoering van dit hoofdstuk. Indien hij zich hier niet aan houdt,
      vervallen alle rechten op grond van dit hoofdstuk en is hij aansprakelijk voor door de werkgever hierdoor geleden
      schade.

      2 De voormalig werknemer dan wel de nabestaande is verplicht bij de werkgever jaarlijks in de maand januari een
      schriftelijk bewijs van in leven zijn in te dienen. Indien en voor zolang de in de eerste volzin bedoelde persoon
      geen bewijs van in leven indient, kan de CdP de uitbetaling van de suppletie opschorten totdat een dergelijk bewijs
      is ontvangen.

      3 De werkgever is niet aansprakelijk indien een oudedags-, nabestaanden- of arbeidsongeschiktheidsvoorziening dan
      wel suppletie niet of niet juist is vastgesteld, doordat de werknemer, voormalig werknemer dan wel nabestaande
      niet, niet juist of niet tijdig aan de voor hem uit dit hoofdstuk voortvloeiende verplichtingen heeft voldaan.

      4 Indien door het zich niet houden aan een voorschrift dat voor het verkrijgen van een uitkering voor de oudedag,
      wegens overlijden of wegens ziekte of arbeidsongeschiktheid op grond van het voor de werknemer, voormalig werknemer
      dan wel nabestaande van toepassing zijnde stelsel van sociale zekerheid gevolgd dient te worden geen sociale
      zekerheidsuitkering wordt toegekend, bestaat geen recht op suppletie op grond van dit hoofdstuk.

      5 Indien door het zich niet houden aan een voorschrift als bedoeld in het derde lid, een lagere sociale
      zekerheidsuitkering wordt toegekend of de sociale zekerheidsuitkering later wordt toegekend, wordt het hierdoor
      niet toegekende uitkeringsbedrag op het suppletieplafond in mindering gebracht.

      6 Het derde en vierde lid zijn niet van toepassing indien het zich niet houden aan het voorschrift de werknemer,
      voormalig werknemer dan wel nabestaande redelijkerwijs niet kan worden verweten.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel9.2
  - number: '9.3'
    text: |-
      1 Voor zover dit lokaal voorgeschreven of lokaal gebruikelijk is, sluit de werkgever ten behoeve van de
      werknemer lokaal een verzekering af dan wel treft een vergelijkbare voorziening die voorziet in de opbouw van een
      oudedagsvoorziening en een dekking van de risico’s van overlijden. In dat geval houdt de werkgever de premie geheel
      of gedeeltelijk op het loon van de werknemer in overeenkomstig lokaal voorschrift of lokaal gebruik. De verzekering
      of voorziening en het percentage van de premie dat op het loon van de werknemer wordt ingehouden, worden opgenomen
      in de postuitwerking.

      2 De werkgever sluit ten behoeve van de werknemer lokaal een verzekering af die voorziet in een dekking van de
      risico’s van arbeidsongeschiktheid indien dit lokaal voorgeschreven of gebruikelijk is. Het eerste lid, tweede en
      vierde volzin, is in dat geval van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel9.3
  - number: '9.4'
    text: |-
      1 Indien er gedurende een periode van de arbeidsovereenkomst geen verzekering of vergelijkbare voorziening die
      voorziet in de opbouw van een oudedagsvoorziening, als bedoeld in [artikel 9.3, eerste lid][ref1], is afgesloten,
      heeft de voormalig werknemer recht op een suppletie op oudedagsvoorzieningen indien zijn arbeidsovereenkomst
      ten minste zeven jaren heeft geduurd. Voor de toepassing van dit artikel wordt onder arbeidsovereenkomst tevens
      verstaan:

      a. voor de periode vóór 1 januari 2005: de verschillende arbeidsovereenkomsten die elkaar met tussenpozen van niet
      meer dan 31 dagen zijn opgevolgd;

      b. voor de periode vanaf 1 januari 2005: de verschillende arbeidsovereenkomsten die elkaar met tussenpozen van niet
      meer dan zes maanden zijn opgevolgd.

      2 Voor de in het eerste lid bedoelde suppletie geldt als suppletieplafond het bedrag, gelijk aan:

      a. voor de periode van de arbeidsovereenkomst vóór 1 januari 2005: 1,75% van de suppletiegrondslag vermenigvuldigd
      met de suppletiediensttijd;

      b. voor de periode van de arbeidsovereenkomst vanaf 1 januari 2005: 1,5% van de suppletiegrondslag vermenigvuldigd
      met de suppletiediensttijd.

      3 Voor de toepassing van dit artikel wordt onder de in [artikel 9.1, eerste lid, onderdeel a, onder 2°][ref2],
      bedoelde voorzieningen in ieder geval verstaan alle voorzieningen uit de socialeverzekeringswetgeving waarop
      de werknemer recht heeft of recht gehad zou hebben indien de werknemer tot aan de pensioendatum zoals die
      overeenkomstig lokaal voorschrift voor hem geldt, zijn werkzaamheden bij de post zou hebben voorgezet:

      a. tenzij hij daarvoor op uitsluitend vrijwillige basis premie heeft betaald zonder enige bijdrage van de
      werkgever;

      b. tenzij en voor zover dit recht is opgebouwd gedurende een periode liggende buiten de periode van de
      arbeidsovereenkomst.

      4 De in het eerste lid bedoelde suppletie wordt aan de voormalig werknemer toegekend met ingang van de
      pensioendatum dan wel, indien aansluitend aan de pensioendatum de arbeidsovereenkomst wordt voortgezet, met ingang
      van de dag dat die arbeidsovereenkomst is geëindigd, echter niet op een leeftijd die lager is dan 60 jaar. De
      toekenning eindigt met ingang van de eerste dag van de maand, volgende op de maand van overlijden van de voormalig
      werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel9.3
      [ref2]: https://wetten.overheid.nl/BWBR0017230#Artikel9.1
