  - number: '10.6'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2005, met uitzondering van de [artikelen 1.7][ref1],
      [2.4][ref2], [2.5, tweede tot en met vijfde lid][ref3], [8.6, eerste lid][ref4], [8.8][ref5] en [8.9][ref6].
      De in de vorige volzin genoemde artikelen treden in werking met ingang van de dag van inwerkingtreding van de
      eerstvolgende wijziging van de [artikelen 119][ref7] en [120 van het RDBZ][ref8] na vaststelling van deze regeling.


