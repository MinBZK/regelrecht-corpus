  - number: '9.9'
    text: |-
      1 Ter vaststelling van het al dan niet voortduren van de arbeidsongeschiktheid wordt de voormalig werknemer die
      een suppletie op arbeidsongeschiktheidsvoorzieningen geniet eenmaal per twee jaren aan een geneeskundig onderzoek
      onderworpen, uitgevoerd door of namens de bedrijfsgeneeskundige dienst. De CdP kan bepalen dat het in de vorige
      volzin bedoelde onderzoek vaker of minder vaak dan eenmaal per twee jaren plaats zal vinden.

      2 De CdP kan de voormalig werknemer met een suppletie op arbeidsongeschiktheidsvoorzieningen opdragen zich aan een
      geneeskundig onderzoek te onderwerpen op het moment dat, naar het oordeel van de CdP, gegronde redenen bestaan voor
      twijfel aan voortduring van de arbeidsongeschiktheid.

      3 Gedurende de periode dat de werknemer niet meewerkt aan het in het eerste en tweede lid bedoelde geneeskundig
      onderzoek, bestaat geen recht op suppletie, tenzij het niet meewerken aan het geneeskundig onderzoek de werknemer
      redelijkerwijs niet verweten kan worden.

      4 De kosten van het in het eerste en tweede lid bedoelde geneeskundig onderzoek komen voor rekening van de
      werkgever. De door de voormalig werknemer op grond van dit artikel gemaakte noodzakelijke reiskosten worden vergoed
      overeenkomstig de [artikelen 4.12, vierde lid][ref1], en [4.13][ref2], met dien verstande dat, indien de werknemer
      na de eerste dag van de ziekte die tot ontslag heeft geleid verhuisd is naar een plaats buiten de plaats van
      vestiging van de post, geen hogere vergoeding wordt betaald dan de vergoeding die zou worden betaald als hij niet
      verhuisd was.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel4.12
      [ref2]: https://wetten.overheid.nl/BWBR0017230#Artikel4.13
