  - number: '1.3'
    text: |-
      1 Bepalingen in of krachtens deze regeling zijn slechts van toepassing dan wel van overeenkomstige toepassing voor
      zover zij niet strijdig zijn met dwingende bepalingen van lokaal geldend arbeidsrecht.

      2 Bepalingen in of krachtens deze regeling die strijdig zijn met lokaal gebruik kunnen in de postuitwerking geheel
      of ten dele buiten toepassing worden verklaard.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel1.3
  - number: '1.4'
    text: |-
      1 De werkgever maakt geen onderscheid tussen werknemers op grond van godsdienst, levensovertuiging, politieke
      gezindheid, ras, geslacht, nationaliteit, seksuele geaardheid, burgerlijke staat, een verschil in arbeidsduur, of
      op welke grond dan ook, tenzij een dergelijk onderscheid objectief gerechtvaardigd is.

      2 Een rechtsvordering op grond van dit artikel verjaart na verloop van zes maanden.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel1.4
  - number: '1.5'
    text: |-
      1 De CdP van een ambassade stelt, in samenwerking met 3W en na overleg met de CdP’s van eventuele andere posten
      binnen zijn ambtsgebied, voor zijn post en de eventuele andere posten binnen zijn ambtsgebied een postuitwerking
      op.

      2 In de postuitwerking worden zodanige arbeidsvoorwaarden en daarmee verbandhoudende voorzieningen opgenomen, dat
      deze, tezamen met de op grond van deze regeling en [hoofdstuk XVIII van het RDBZ][ref1] geldende arbeidsvoorwaarden
      en voorzieningen, een geheel opleveren van arbeidsvoorwaarden en daarmee verbandhoudende voorzieningen
      overeenkomstig lokaal gebruik.

      3 De CdP van een ambassade kan, na overleg met de CdP’s van eventuele andere posten binnen zijn ambtsgebied, aan 3W
      een wijzigingsvoorstel voor de postuitwerking doen zodra de omstandigheden daartoe aanleiding geven.

      4 Vaststelling van de postuitwerking of van een wijziging van de postuitwerking geschiedt door HDPO. HDPO stelt de
      postuitwerking of wijziging pas vast nadat:

      a. het medezeggenschapsorgaan van de post dan wel posten door de desbetreffende CdP dan wel CdP’s in de gelegenheid
      is gesteld een advies uit te brengen; en

      b. er overeenstemming is bereikt met de in [artikel 142 van het RDBZ][ref2] bedoelde centrales van verenigingen
      van ambtenaren.

      5 HDPO kan de CdP van een ambassade omtrent het opstellen van de postuitwerking of een wijziging daarvan
      aanwijzingen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0004052#HoofdstukXVIII
      [ref2]: https://wetten.overheid.nl/BWBR0004052#Artikel142
