  - number: '8.10'
    text: |-
      1 Aan de werknemer wordt bij het eindigen van de arbeidsovereenkomst op diens aanvraag een getuigschrift
      uitgereikt. Het getuigschrift bevat een opgave omtrent de aard van de verrichte werkzaamheden en de duur van de
      arbeidsovereenkomst.

      2 Op uitdrukkelijk verzoek van de werknemer bevat het getuigschrift tevens een opgave van de wijze, waarop de
      werknemer aan zijn verplichtingen heeft voldaan en de wijze waarop de arbeidsovereenkomst geëindigd is.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel8.10
  - number: '9.1'
    text: |-
      1 Voor de toepassing van dit hoofdstuk wordt verstaan onder:

      a. suppletie: het bedrag, bestaande uit het verschil tussen:

      1°. het suppletieplafond en

      2°. het bedrag van de in dit hoofdstuk bedoelde voorzieningen waarop de werknemer uit anderen hoofde recht heeft;

      b. suppletieplafond: het maximale bedrag dat aan suppletie kan worden toegekend op grond van
      [artikel 9.4, tweede lid][ref1], [artikel 9.6, eerste lid][ref2], [artikel 9.7, eerste lid][ref3], en
      [artikel 9.8, tweede lid][ref4];

      c. suppletiediensttijd: de periode gedurende welke de werknemer recht had op loon van de werkgever, alsmede de
      periode gedurende welke recht bestond op toekenning van een suppletie op arbeidsongeschiktheidsvoorzieningen
      als bedoeld in [artikel 9.8][ref5], met uitzondering van de periode dat er een verzekering was als bedoeld
      in [artikel 9.3][ref6]. Een gedeelte van een maand wordt naar boven afgerond op een gehele maand. De periode
      dat de werknemer recht had op loon op basis van een deeltijdarbeidovereenkomst, wordt voor een evenredig deel
      meegerekend. De periode dat de werknemer loon ontving op basis van een arbeidsovereenkomst die meer dan een maand
      na de pensioendatum aanving, wordt niet meegerekend. De suppletiediensttijd bedraagt maximaal 40 jaren tenzij
      in de postuitwerking een pensioenleeftijd is opgenomen van 66 of 67 jaar in welk geval het maximaal 41 jaren
      respectievelijk 42 jaren bedraagt;

      d. pensioendatum: de eerste dag van de maand volgend op de dag waarop de werknemer dan wel voormalig werknemer de
      in [artikel 8.5][ref7] bedoelde pensioenleeftijd heeft bereikt;

      e. suppletiegrondslag: het loonbedrag, berekend over een tijdvak van een jaar, behorende bij de loonschaal en
      het loonnummer die laatstelijk voor de werknemer golden, met toepassing van het loonbedrag zoals dat voor die
      loonschaal en dat loonnummer op het moment van betaling geldt, met dien verstande dat als laatstbedoeld loonbedrag
      lager is dan het daarvoor geldende loonbedrag, dit laatste loonbedrag als suppletiegrondslag wordt gehanteerd
      totdat het loonbedrag op het moment van betaling gelijk is aan of hoger is dan het daarvoor geldende loonbedrag.
      Dit bedrag wordt vermeerderd met de in de [artikelen 4.4][ref8] en [4.5][ref9] bedoelde toeslagen, zoals die op het
      moment van betaling gelden, berekend over een tijdvak van een jaar, voor zover deze toeslagen zijn toegekend voor
      onbepaalde tijd, dan wel gedurende een aaneengesloten periode van ten minste vijf jaren direct voorafgaande aan de
      beëindiging van de arbeidsovereenkomst. Voor zover op het moment van uitbetaling van de suppletie de systematiek
      van loonschaal en loonnummer die laatstelijk voor de werknemer golden ingrijpend is gewijzigd, wordt door 3W
      het loonbedrag dat laatstelijk voor de werknemer gold ten behoeve van berekening van de suppletiegrondslag naar
      redelijkheid en billijkheid in de dan geldende loonsystematiek ingedeeld.

      2 Voor de bepaling van het in het eerste lid, onderdeel a, onder 2°, bedoelde bedrag van de in dit hoofdstuk
      bedoelde voorzieningen waarop de werknemer uit anderen hoofde recht heeft, wordt gebruik gemaakt van de door
      de Secretaris-Generaal van het Ministerie van Buitenlandse Zaken vastgestelde berekeningsformules indien het
      noodzakelijk is dat:

      a. een eenmalige betaling wordt omgerekend naar een periodiek bedrag;

      b. een periodieke betaling wordt omgerekend naar een periodieke betaling met een andere betalingsfrequentie of naar
      een eenmalig bedrag.

      Bij deze berekening zal zo nodig tevens rekening worden gehouden met de sterftetabel, welke de gemiddelde
      levensverwachting bevat voor het desbetreffende land of de desbetreffende regio, opgenomen in de laatst beschikbare
      versie van het Demografisch Jaarboek, uitgegeven door de Verenigde Naties. Bij de berekening wordt tevens rekening
      gehouden met de door De Nederlandsche Bank N.V. gepubliceerde wettelijke rente voor niet-handelstransacties.


