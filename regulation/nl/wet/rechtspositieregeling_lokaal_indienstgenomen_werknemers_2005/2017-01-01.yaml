preamble:
  text: |-
    Gelet op artikel 121, eerste lid, van het Reglement Dienst Buitenlandse Zaken;

    In overeenstemming met de centrales van verenigingen van ambtenaren bij het Ministerie van Buitenlandse Zaken;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. RDBZ: het [Reglement Dienst Buitenlandse Zaken][ref1];

      b. post: een vertegenwoordiging van het Koninkrijk in het buitenland als bedoeld in [artikel 7 van het RDBZ][ref2];

      c. CdP: het hoofd van de post;

      d. HDPO: de Hoofddirecteur Personeel en Organisatie van het Ministerie van Buitenlandse Zaken;

      e. werkgever: de Staat der Nederlanden;

      f. werknemer: degene die krachtens [artikel 114 van het RDBZ][ref3] voor werkzaamheden bij een post op
      arbeidsovereenkomst naar burgerlijk recht in dienst is genomen;

      g. gezinsleden: de partner en afhankelijke kinderen van de werknemer, voor zover zij een gezamenlijke huishouding
      voeren met de werknemer;

      h. partner:

      1°. de huwelijkspartner;

      2°. de geregistreerde partner; of

      3°. de levenspartner met wie de niet-gehuwde werknemer samenwoont en, met het oogmerk duurzaam samen te leven,
      een gemeenschappelijke huishouding voert op basis van een notarieel verleden samenlevingscontract bevattende de
      wederzijdse rechten en verplichtingen betreffende die samenwoning en gemeenschappelijke huishouding.

      Tegelijkertijd kan slechts één persoon als partner worden aangemerkt. Een persoon die als partner is aangemerkt,
      verliest het partnerschap slechts met ingang van de dag dat hij geen partner meer is in de zin van dit
      artikelonderdeel;

      i. afhankelijke kinderen: kinderen, adoptief- of stiefkinderen jonger dan 18 jaar van de werknemer of van diens
      partner die financieel geheel of voor meer dan de helft ten laste van de werknemer komen;

      j. postuitwerking: de in [artikel 123, eerste lid, van het RDBZ][ref4] bedoelde nadere uitwerking van
      [hoofdstuk XVIII van het RDBZ][ref5] dan wel van deze regeling;

      k. bedrijfsgeneeskundige dienst: de geneeskundige of geneeskundige dienst die door de CdP is aangewezen teneinde
      hem bij te staan bij de uitvoering van de bedrijfsgeneeskundige begeleiding van de werknemer;

      l. functie: het samenstel van werkzaamheden, door de werknemer te verrichten krachtens en overeenkomstig hetgeen
      door de CdP aan betrokkene is opgedragen;

      m. loon: het in [hoofdstuk 4, paragraaf 1][ref6], bedoelde loonbedrag, vermeerderd met de in
      [paragraaf 2 van dat hoofdstuk][ref7] bedoelde toeslagen;

      n. maandloon: het in [artikel 4.3, tweede lid][ref8], bedoelde loonbedrag, betrekking hebbend op een periode van
      een maand, vermeerderd met de in de [artikelen 4.4][ref9] en [4.5][ref10] bedoelde toeslagen, betrekking hebbend
      op een periode van een maand, voor zover deze toeslagen zijn toegekend voor onbepaalde tijd dan wel gedurende een
      aaneengesloten periode van ten minste vijf jaren direct voorafgaande aan de beëindiging van de arbeidsovereenkomst;

      o. lokaal: in de plaats waar de post gevestigd is;

      p. lokaal voorschrift: de dwingende bepaling van lokaal geldend arbeidsrecht, die van toepassing is op de
      werknemer;

      q. lokaal gebruik: hetgeen lokaal gebruikelijk is bij de buitenlandse vertegenwoordigingen van de Verenigde
      Staten, het Verenigd Koninkrijk, Duitsland, Canada en de Europese Unie. Indien lokaal minder dan drie van de in
      de vorige volzin bedoelde vertegenwoordigingen zijn gevestigd, wijst HDPO na overleg met de CdP één of meer lokale
      buitenlandse vertegenwoordigingen van andere staten aan;

      r. bedrijfshulpverlener: een bij de post werkzame werknemer die door de CdP is aangewezen om naast zijn normale
      werkzaamheden de in [artikel 6.8][ref11] bedoelde bedrijfshulpverleningstaken te verrichten;

      s. 3W: de directeur WereldWijdWerken van het Ministerie van Buitenlandse Zaken.


