  - number: '4.10'
    text: |-
      1 Indien het loon onderhevig is aan heffing op grond van de Nederlandse belastingwetgeving wordt aan de werknemer
      een nettoloon uitbetaald. Dit nettoloon wordt berekend door het in [artikel 4.8, eerste lid][ref1], bedoelde loon
      te verminderen met de in [artikel 4.8, tweede lid][ref2], bedoelde premies dan wel bedragen en het bedrag dat de
      werknemer lokaal over zijn loon aan belasting verschuldigd zou zijn als hij lokaal belastingplichtig zou zijn.

      2 De in Nederland verschuldigde loonbelasting wordt rechtstreeks door de werkgever afgedragen. Bij de berekening
      van de hoogte van de verschuldigde loonbelasting wordt door de werkgever, tenzij de werknemer schriftelijk verzoekt
      om dat niet te doen, rekening gehouden met de in de [Wet op de loonbelasting][ref3] voorgeschreven algemene
      heffingskorting en arbeidskorting of vergelijkbare kortingen onder welke benaming dan ook.

      3 Indien de werkgever teveel loonbelasting aan de Nederlandse belastingdienst heeft afgedragen, is de werknemer
      verplicht mee te werken aan het door de werkgever bij de Nederlandse belastingdienst terugvorderen van de teveel
      betaalde loonbelasting. Indien de werknemer hier niet aan meewerkt, wordt een bedrag, gelijk aan de teveel
      afgedragen loonbelasting, op het loon van de werknemer ingehouden.

      4 Indien de werkgever op schriftelijk verzoek van de werknemer bij de berekening van de hoogte van de in
      Nederland verschuldigde loonbelasting geen rekening houdt met de in het tweede lid bedoelde kortingen, wordt het
      in [artikel 4.8, eerste lid][ref4], bedoelde loon van de werknemer, behalve met het in het eerste lid bedoelde
      bedrag ook verminderd met een bedrag ter grootte van het verschil tussen het vastgestelde bedrag aan Nederlandse
      loonbelasting en het lagere bedrag aan Nederlandse loonbelasting dat zou zijn vastgesteld indien de werknemer niet
      had verzocht om geen rekening te houden met de in het tweede lid bedoelde kortingen.


