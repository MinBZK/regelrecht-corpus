  - number: '1.7'
    text: |-
      Een rechtsvordering voortvloeiende uit de arbeidsovereenkomst tussen de werknemer en de werkgever verjaart door
      verloop van vijf jaren na de dag dat de rechtsvordering is ontstaan, voor zover in deze regeling niet anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel1.7
  - number: '1.8'
    text: |-
      1 Regelingen waarin de rechtspositie van de werknemer is neergelegd en andere regelingen en instructies welke hij
      bij de vervulling van zijn functie heeft na te leven, alsmede wijzigingen daarin, worden de werknemer ter kennis
      gebracht en zijn op een voor de werknemer toegankelijke plaats ter inzage gelegd. Van deze regelingen kan de
      werknemer kosteloos afschriften maken voor zover dat redelijkerwijs nodig is.

      2 Indien de werknemer de Nederlandse taal niet machtig is, worden ten minste de hoofdlijnen van de in het eerste
      lid bedoelde regelingen en instructies in een taal gesteld die in het internationale verkeer lokaal gebruikelijk
      is.

      3 Ingeval regelingen en instructies niet schriftelijk zijn vastgelegd, wordt de werknemer behoorlijk over deze
      regelingen en instructies geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel1.8
  - number: '1.9'
    text: |-
      HDPO kan, al dan niet op voorstel van de CdP, ten gunste van de werknemer artikelen van deze regeling buiten
      toepassing laten of daarvan afwijken voor zover toepassing zal leiden tot een onbillijkheid van overwegende aard
      gelet op het belang van de werknemer bij een goede rechtspositie en goede arbeidsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel1.9
  - number: '2.1'
    text: |-
      1 De CdP stelt de werknemers van zijn post, de partners van de uitgezonden ambtenaren van zijn post en,
      indien aanwezig, de werknemers en de partners van uitgezonden ambtenaren van de andere posten binnen hetzelfde
      ambtsgebied, in kennis van een vacature binnen zijn post betreffende een arbeidsovereenkomst en biedt hen twee
      weken om te solliciteren. De termijn van twee weken kan verkort worden indien, ter beoordeling van de CdP,
      voorziening in de vacature spoedeisend is.

      2 Bij bekendmaking van de vacature worden in ieder geval inlichtingen verschaft over de omvang en de inhoud
      van de functie en de eisen ten aanzien van opleiding en ervaring, alsmede over het loon, eventuele bijzondere
      arbeidsvoorwaarden en de uiterlijke datum van inzending van de sollicitatie. Wanneer een medisch onderzoek, een
      psychologisch onderzoek, een veiligheidsonderzoek of een ander onderzoek naar de betrouwbaarheid of de geschiktheid
      deel uitmaakt van de selectieprocedure wordt dit eveneens vermeld.

      3 De vacature kan buiten de in het eerste lid bedoelde post dan wel posten bekend worden gemaakt nadat is
      vastgesteld dat:

      a. binnen de in het eerste lid bedoelde termijn geen personen als bedoeld in het eerste lid hebben gesolliciteerd;
      of

      b. de in het eerste lid bedoelde personen die binnen de in het eerste lid bedoelde termijn hebben gesolliciteerd
      niet geschikt zijn voor de vacature of hun sollicitatie hebben ingetrokken.

      4 Bij gelijke geschiktheid van een werknemer en een partner van een uitgezonden ambtenaar, geniet de werknemer
      voorrang.

      5 In afwijking van het eerste en derde lid, kan de CdP in bijzondere gevallen waarin haast geboden is en de
      verwachting bestaat dat er geen geschikte kandidaat aanwezig is onder de in het eerste lid bedoelde personen,
      een vacature gelijktijdig zowel binnen als ook buiten de in het eerste lid bedoelde post dan wel posten bekend
      maken. Bij gelijke geschiktheid van een persoon als bedoeld in het eerste lid en een andere sollicitant geniet dan
      eerstgenoemde voorrang onverminderd het bepaalde in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 De CdP kan van een kandidaat-werknemer vergen dat hij zich onderwerpt aan een geneeskundig onderzoek indien naar
      het oordeel van de CdP aan de vervulling van de functie waarop de arbeidsovereenkomst betrekking heeft, bijzondere
      eisen op het punt van de medische geschiktheid moeten worden gesteld, waaronder wordt begrepen de bescherming van
      de gezondheid en de veiligheid van de kandidaat en van derden bij de uitvoering van de desbetreffende arbeid.

      2 De kosten van het geneeskundig onderzoek komen voor rekening van de werkgever. De door de kandidaat-werknemer
      gemaakte noodzakelijke reis- en verblijfkosten worden vergoed overeenkomstig [hoofdstuk 4, paragraaf 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel2.2
    references:
      - id: ref1
