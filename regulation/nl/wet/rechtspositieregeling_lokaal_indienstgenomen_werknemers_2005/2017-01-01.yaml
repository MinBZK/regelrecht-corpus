        bwb_id: BWBR0017230
        artikel: '8.3'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '8.7'
    text: |-
      1 Bij vermissing van de werknemer wordt, indien alle omstandigheden in aanmerking genomen het overlijden als zeker
      kan worden beschouwd, de werknemer geacht te zijn overleden op een door de CdP te bepalen dag. [Artikel 8.6][ref1]
      is in dat geval van overeenkomstige toepassing.

      2 Indien gegronde vermoedens bestaan dat de vermissing het gevolg is van ongeoorloofde afwezigheid, vindt
      [artikel 8.6, tweede lid][ref2], geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel8.6
