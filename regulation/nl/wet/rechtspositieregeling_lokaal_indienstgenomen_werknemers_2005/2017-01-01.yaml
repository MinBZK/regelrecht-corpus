      1 Indien het loon zowel onderhevig is aan de lokale belastingheffing als aan heffing op grond van de Nederlandse
      belastingwetgeving, is [artikel 4.9][ref1] van overeenkomstige toepassing.

      2 De in Nederland verschuldigde loonbelasting komt voor rekening van de werkgever en wordt rechtstreeks door de
      werkgever afgedragen.

      3 Het [derde lid van artikel 4.10][ref2] is van overeenkomstige toepassing.


