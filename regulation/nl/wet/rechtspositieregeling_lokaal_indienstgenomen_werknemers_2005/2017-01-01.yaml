  - number: '4.18'
    text: |-
      Met de door de werkgever aan de werknemer verschuldigde bedragen kan worden verrekend hetgeen de werknemer aan de
      werkgever verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel4.18
  - number: '4.19'
    text: |-
      Geen loon of andere betalingen zijn verschuldigd over de tijd dat de werknemer de bedongen arbeid niet heeft
      verricht voor zover in deze regeling of in de postuitwerking niet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel4.19
  - number: '4.20'
    text: |-
      1 Financiële rechten van de werknemer op grond van deze regeling, worden in de lokaal gebruikelijke valuta
      vastgesteld en uitbetaald.

      2 In afwijking van het eerste lid kunnen, indien daartoe naar het oordeel van HDPO redenen aanwezig zijn,
      financiële rechten geheel of gedeeltelijk in een andere valuta worden vastgesteld of uitbetaald.

      3 In afwijking van het eerste lid worden financiële rechten op grond van de [artikelen 4.14][ref1]
      en [4.15][ref2] vastgesteld in de in [artikel 5 van de Reisregeling binnenland][ref3] respectievelijk
      [bijlage I van de Reisregeling buitenland][ref4] opgenomen munteenheden. De uitbetaling vindt plaats in de
      munteenheid waarin het loon wordt uitbetaald.

      4 Indien de vaststelling plaatsvindt in een andere valuta dan die waarin de uitbetaling geschiedt, vindt de
      omrekening plaats op basis van de op het moment van uitbetaling door de directeur Financieel Economische Zaken van
      het Ministerie van Buitenlandse Zaken gehanteerde koers voor betalingen aan derden.

      5 Betalingen op grond van deze regeling vinden plaats in het land van vestiging van de post.

      6 Betaling van het in [artikel 4.3, tweede lid][ref5], bedoelde loonbedrag vindt per maand plaats. De frequentie en
      tijdstippen van de overige betalingen, zoals toeslagen, worden in de postuitwerking opgenomen.


