  - number: '9.7'
    text: |-
      1 Voor de suppletie op de in [artikel 9.5, eerste lid][ref1], bedoelde nabestaandenvoorzieningen voor afhankelijke
      kinderen geldt, onverminderd [artikel 9.5, tweede lid][ref2], per kind als suppletieplafond het bedrag, gelijk aan
      14% van het in [artikel 9.4, tweede lid][ref3], bedoelde suppletieplafond. Indien de werknemer op de datum van zijn
      overlijden geen partner nalaat, bedraagt het in de vorige volzin genoemde percentage 28.

      2 Voor de toepassing van dit artikel wordt onder de in [artikel 9.1, eerste lid, onderdeel a, onder 2°][ref4],
      bedoelde voorzieningen in elk geval verstaan:

      a. wezenpensioen waarop recht bestaat op grond van het van toepassing zijnde sociale zekerheidsstelsel;

      b. overige wezenpensioenen waaraan de werkgever op enigerlei wijze heeft meebetaald.

      3 De in het eerste lid bedoelde suppletie wordt aan het in het eerste lid bedoelde kind toegekend met ingang van de
      eerste dag van de maand van overlijden van de werknemer dan wel voormalig werknemer. De toekenning van de suppletie
      eindigt:

      a. op de eerste dag van de maand, volgende op de maand waarin het kind de leeftijd van achttien jaar bereikt;

      b. op de eerste dag van de maand, volgend op de maand waarin het kind overlijdt.


