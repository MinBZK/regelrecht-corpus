    text: |-
      1 Het loon van de werknemer wordt bruto vastgesteld.

      2 Het bruto vastgestelde loon wordt in ieder geval verminderd met de op grond van [artikel 5.3][ref1]
      door de werkgever af te dragen premies die voor rekening van de werknemer komen, dan wel de op grond van
      [artikel 5.5, tweede lid][ref2], of [5.6, eerste lid, en tweede lid, onderdeel a][ref3], in te houden bedragen.


