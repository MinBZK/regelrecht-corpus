  - number: '1.6'
    text: |-
      1 De werknemer kan tegen een mondelinge of schriftelijke beslissing van de werkgever, voortvloeiende uit
      de arbeidsovereenkomst, binnen een termijn van zes weken na de dag dat de beslissing aan de werknemer
      is verzonden, uitgereikt of meegedeeld, schriftelijk bezwaar maken. De [hoofdstukken 6][ref1] en
      [7 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.

      2 De beslissing op een bezwaarschrift als bedoeld in het eerste lid wordt genomen door de Secretaris-Generaal
      van het Ministerie van Buitenlandse Zaken. Hij laat zich terzake adviseren door de Commissie van Bezwaar Dienst
      Buitenlandse Zaken, overeenkomstig de [artikelen 144 tot en met 146 van het RDBZ][ref3].

      3 Voor de toepassing van het eerste lid wordt onder een beslissing van de werkgever niet verstaan het vaststellen,
      wijzigen of intrekken van een beleidsregel dan wel een postuitwerking of een andere regeling vastgesteld door Onze
      Minister of een ander publiekrechtelijk orgaan.

      4 Voor de kennisneming van geschillen tussen de werknemer en de werkgever, voortvloeiende uit de
      arbeidsovereenkomst, is met uitsluiting van enige buitenlandse rechter de Nederlandse rechter bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0004052#Artikel144
