  - number: '1.2'
    text: |-
      1 Tenzij in deze regeling anders is bepaald, wordt aan de CdP, voor zover het op zijn post werkzame werknemers
      betreft, volmacht en machtiging verleend tot het verrichten van handelingen op grond van het [RDBZ][ref1], deze
      regeling en de postuitwerking.

      2 De CdP kan voor het verrichten van de in het eerste lid bedoelde handelingen schriftelijk volmacht en machtiging
      verlenen aan onder zijn gezag werkzame functionarissen. Deze volmacht en machtiging kunnen te allen tijde worden
      ingetrokken.

      3 HDPO kan de CdP omtrent het verrichten van de in het eerste lid bedoelde privaatrechtelijke rechtshandelingen
      aanwijzingen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0004052
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel1.2
