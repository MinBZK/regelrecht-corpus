  - number: '9.8'
    text: |-
      1 Indien een werknemer wegens ziekte wordt ontslagen en hij op dat moment niet verzekerd is op basis van een
      verzekering als bedoeld in [artikel 9.3, tweede lid][ref1], die voorziet in een dekking van de risico’s van
      arbeidsongeschiktheid en hij na het ontslag nog ongeschikt is een andere passende betrekking te vervullen, heeft
      hij recht op een suppletie op arbeidsongeschiktheidsvoorzieningen.

      2 Voor de in het eerste lid bedoelde suppletie geldt als suppletieplafond het bedrag, gelijk aan de
      suppletiegrondslag vermenigvuldigd met het percentage van het loon dat aan de werknemer op grond van
      [artikel 5.11, tweede lid][ref2], vlak voor zijn ontslag wordt betaald, maar ten hoogste met:

      a. 70% indien het in het eerste lid bedoelde ontslag is ingegaan vóór 1 januari 2005;

      b. 60% indien het in het eerste lid bedoelde ontslag is ingegaan op of na 1 januari 2005.

      3 Voor de toepassing van dit artikel wordt onder de in [artikel 9.1, eerste lid, onderdeel a, onder 2°][ref3],
      bedoelde voorzieningen in elk geval verstaan:

      a. alle voorzieningen waarop de werknemer uit hoofde van het verleende ontslag recht heeft waaronder in ieder geval
      die op grond van het van toepassing zijnde sociale zekerheidsstelstel;

      b. overige arbeidsongeschiktheidsvoorzieningen waaraan de werkgever op enigerlei wijze heeft meebetaald;

      c. de eventuele aanspraken van de voormalig werknemer op inkomsten uit of in verband met arbeid of bedrijf.

      4 De in het eerste lid bedoelde suppletie wordt aan de voormalig werknemer toegekend met ingang van de dag nadat
      het in het eerste lid bedoelde ontslag is ingegaan. De toekenning eindigt op de dag waarop:

      a. de voormalig werknemer geacht wordt een andere passende betrekking te kunnen vervullen;

      b. de arbeidsovereenkomst van de voormalig werknemer bij voortzetting van de arbeidsovereenkomst zou zijn geëindigd
      wegens het bereiken van de pensioenleeftijd;

      c. de voormalig werknemer overlijdt; of

      d. de suppletie is toegekend gedurende een periode, gelijk aan de arbeidsovereenkomst, met dien
      verstande dat de suppletie ten minste gedurende een periode van vijf jaren wordt toegekend.
      [Artikel 9.4, eerste lid, tweede volzin][ref4], is van overeenkomstige toepassing.

      5 Het vierde lid, onderdeel d, is niet van toepassing, indien naar het oordeel van HDPO de arbeidsongeschiktheid in
      overwegende mate haar oorzaak vindt in de aard van de aan de werknemer opgedragen werkzaamheden of in de bijzondere
      omstandigheden waaronder deze moesten worden verricht en niet aan zijn schuld of toedoen is te wijten.

      6 Voor de toepassing van dit artikel is van een passende betrekking sprake indien:

      a. naar het oordeel van de CdP van de voormalig werknemer, gelet op zijn gezondheid en zijn omstandigheden,
      redelijkerwijs kan worden verwacht dat hij tracht deze betrekking te verkrijgen en, indien hij daartoe in de
      gelegenheid wordt gesteld, deze betrekking te aanvaarden; en

      b. het met deze betrekking te verwerven salaris ten minste gelijk is aan de in het eerste lid bedoelde suppletie.


