  - number: '8.5'
    text: |-
      De arbeidsovereenkomst eindigt met ingang van de eerste dag volgend op de dag waarop de werknemer de in de
      postuitwerking opgenomen pensioenleeftijd bereikt. Deze pensioenleeftijd wordt vastgesteld overeenkomstig lokaal
      gebruik, echter op een leeftijd die niet lager is dan 60 jaar en niet hoger dan 67 jaar.
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel8.5
  - number: '8.6'
    text: |-
      1 De arbeidsovereenkomst eindigt door het overlijden van de werknemer. Met ingang van de dag na overlijden van de
      werknemer wordt geen loon meer uitbetaald.

      2 Bij het overlijden van de werknemer wordt zo spoedig mogelijk aan de achterblijvende partner een bedrag
      uitgekeerd gelijk aan het in [artikel 8.3, vijfde lid][ref1], bedoelde maandloon. Bij het ontbreken van een
      achterblijvende partner wordt het bedrag uitgekeerd aan zijn afhankelijke kinderen.

      3 Indien de overledene geen partner of afhankelijke kinderen nalaat, kan het in het tweede lid bedoelde bedrag
      geheel of ten dele worden uitgekeerd voor de betaling van de kosten van de laatste ziekte en van de lijkbezorging,
      indien de nalatenschap van de overledene voor de betaling van die kosten ontoereikend is.


      [ref1]: https://wetten.overheid.nl/BWBR0017230#Artikel8.3
    url: https://wetten.overheid.nl/BWBR0017230/2017-01-01#Artikel8.6
    references:
