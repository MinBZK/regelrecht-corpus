---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_vervoer_gevaarlijke_stoffen_door_de_lucht_1988
regulatory_layer: WET
publication_date: '2009-10-06'
valid_from: '1998-04-01'
bwb_id: BWBR0009493
url: https://wetten.overheid.nl/BWBR0009493/1998-04-01
preamble:
  text: |-
    Gelet op artikel 19 van de Wet persoonsregistratie en de artikelen 5, 22, tweede lid, 26, eerste lid, 54, 77,
    eerste lid, onderdeel b, 88, tweede en vierde lid, 89, eerste lid, 93, eerste lid, 97, eerste lid, onderdeel c, en
    tweede lid, 105 en 132, eerste lid van de Regeling Toezicht Luchtvaart;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

              a

                *Bijlage 18:*


                de op grond van de artikelen 37, 54 en 90 van het Verdrag inzake de Internationale Luchtvaart (Stb. 1947,
      H 165) vastgestelde Bijlage 18 (The Safe Transport of Dangerous Goods by Air);



              b

                *Technische Voorschriften:*


                in de nieuwste van kracht zijnde editie (Technical instructions for the Safe Transport of Dangerous Goods
      by Air).
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel1
  - number: '1.2'
    text: Van deze regeling maken deel uit de Bijlage 18 en de Technische Voorschriften.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel1
  - number: '1.3'
    text: 'Op deze regeling zijn van toepassing:'
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel1
  - number: 1.3.a
    text: de begripsbepalingen zoals neergelegd in Bijlage 18 en in de daarbij behorende Technische Voorschriften;
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel1
  - number: 1.3.b
    text: |-
      de in de van kracht zijnde editie van de Technische Voorschriften opgenomen beschrijvingen van de verschillende
      gevarenklassen en -rubrieken, alsmede de indeling en benaming van gevaarlijke stoffen in deze gevarenklassen en
      -rubrieken.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel1
  - number: '2'
    text: 'Deze regeling is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel2
  - number: 2.a
    text: |-
      gevaarlijke stoffen welke zich bevinden op een luchtvaartterrein, waaronder begrepen de aldaar aanwezige opstallen,
      of in een luchtvaartuig voorzover deze stoffen bestemd zijn om door de lucht te worden vervoerd, daadwerkelijk door
      de lucht worden vervoerd of door de lucht zijn vervoerd;
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel2
  - number: 2.b
    text: iedere natuurlijke persoon of rechtspersoon, die gevaarlijke stoffen aanbiedt voor vervoer door de lucht;
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel2
  - number: 2.c
    text: |-
      iedere natuurlijke persoon of rechtspersoon, die gevaarlijke stoffen door de lucht doet vervoeren of daadwerkelijk
      door de lucht vervoert;
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel2
  - number: 2.d
    text: |-
      iedere natuurlijke persoon of rechtspersoon, die direct betrokken is bij het vervoer van gevaarlijke stoffen door
      de lucht.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel2
  - number: '3'
    text: |-
      Gevaarlijke stoffen moeten worden verpakt in overeenstemming met de voorschriften, neergelegd in de Technische
      Voorschriften.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel3
  - number: '4.1'
    text: |-
      Elke verpakking die voldoet aan de omschrijving, eisen en beproevingen, zoals genoemd in de Technische
      Voorschriften, moet dienovereenkomstig zijn gemerkt.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel4
  - number: '4.2'
    text: |-
      Elk collo met gevaarlijke stoffen moet zijn gemerkt zoals voorgeschreven in de Technische Voorschriften met de
      stofnaam, het nummer voorzover toegekend door de Verenigde Naties, alsmede andere voorgeschreven aanduidingen.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel4
  - number: '4.3'
    text: |-
      Elk collo met gevaarlijke stoffen moet zijn voorzien van de gevaarsetiketten en etiketten ten behoeve van de
      ladingbehandeling als voorgeschreven in de Technische Voorschriften.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel4
  - number: '5'
    text: |-
      Het is verboden op enigerlei verpakking andere dan de in de Technische Voorschriften voorgeschreven etiketten
      aan te brengen, indien daardoor verwarring kan ontstaan ten opzichte van de gevaarsetiketten ten behoeve van de
      ladingbehandeling.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel5
  - number: '6'
    text: |-
      Op de verpakking moeten alle in de Technische Voorschriften voorgeschreven aanduidingen ten minste in het Engels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel6
  - number: '7.1'
    text: |-
      In de luchtvrachtbrief moet duidelijk zijn aangegeven dat de zending gevaarlijke stoffen bevat. De luchtvrachtbrief
      moet hiertoe ten minste de informatie bevatten voorgeschreven in de Technische Voorschriften.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel7
  - number: '7.2'
    text: |-
      Een zending gevaarlijke stoffen moet bij het aanbieden voor vervoer door de lucht vergezeld zijn van een
      schriftelijke verklaring, ten minste in tweevoud, met betrekking tot de gevaarlijke stoffen, tenzij hieromtrent
      in de Technische Voorschriften een uitzonderingsbepaling is opgenomen. Alle exemplaren van deze verklaring moeten
      de in de Technische Voorschriften voorgeschreven informatie bevatten en ondertekend zijn door degene die d,
      gevaarlijke stoffen ten aanvoer aanbiedt.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel7
  - number: '7.3'
    text: De in dit artikel genoemde documenten en verklaringen moeten ten minste in het Engels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel7
  - number: '8'
    text: |-
      Belading en samenlading van gevaarlijke stoffen dienen te geschieden overeenkomstig de voorschriften neergelegd in
      de Technische Voorschriften.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel8
  - number: '9'
    text: |-
      Bij overdracht van gevaarlijke stoffen en daarop betrekking hebbende documenten aan de eigenaar of houder van
      een luchtvaartuig dienen partijen een adequate inspectie hiervan te waarborgen, overeenkomstig de voorschriften,
      neergelegd in de Technische Voorschriften.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel9
  - number: '10.1'
    text: |-
      De eigenaar of houder van een luchtvaartuig, waarin gevaarlijke stoffen door de lucht zullen worden vervoerd,
      is verplicht vóór het vertrek van het desbetreffende luchtvaartuig de gezagvoerder te voorzien van schriftelijke
      informatie zoals terzake is vastgelegd in de Technische Voorschriften.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel10
  - number: '10.2'
    text: |-
      Passagiers moeten vóór de aanvang van de vlucht worden geïnformeerd over de in de Technische Voorschriften
      gestelde regelen met betrekking tot het meevoeren van gevaarlijke stoffen in hand- en ruimbagage aan boord van
      een luchtvaartuig.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel10
  - number: '11'
    text: |-
      Voorvallen en ongevallen met gevaarlijke stoffen voor, tijdens of na de vlucht moeten onmiddellijk aan de Minister
      van Verkeer en Waterstaat worden gemeld.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel11
  - number: '12'
    text: |-
      Natuurlijke personen of rechtspersonen die werkzaamheden verrichten, verband houdend met het aanbieden ten vervoer,
      het doen vervoeren of het daadwerkelijk vervoer van gevaarlijke stoffen door de lucht mogen deze werkzaamheden
      slechts uitoefenen, indien zij door de Minister van Verkeer en Waterstaat hiervoor zijn erkend.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel12
  - number: '13'
    text: |-
      De in het vorige artikel bedoelde personen kunnen erkenning aanvragen door indiening bij de Minister van Verkeer
      en Waterstaat van een behoorlijk ingevuld en ondertekend formulier, waarvan exemplaren bij deze dienst verkrijgbaar
      zijn.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel13
  - number: '14.1'
    text: |-
      Een persoon die een aanvraag voor erkenning heeft ingediend wordt erkend nadat ten genoegen van de Minister van
      Verkeer en Waterstaat is aangetoond dat voldoende waarborgen bestaan voor een goede uitvoering van de werkzaamheden
      waarvoor erkenning is aangevraagd. Hieronder wordt verstaan, dat
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel14
  - number: 14.1.a
    text: |-
      de aanvrager dient te beschikken over voldoende kennis, hetgeen moet blijken uit het in zijn bezit zijn van
      een geldig bewijs, dat een door de Commissie van Advies, als bedoeld in [artikel 17][ref1] van deze regeling,
      vastgesteld examen met gunstig gevolg is afgelegd. Indien de aanvrager een rechtspersoon is, dient deze te
      beschikken over voldoende personeel dat in het bezit is van een geldig bewijs als bedoeld in de vorige volzin;


      [ref1]: https://wetten.overheid.nl/BWBR0009493#Artikel17
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009493
        artikel: '17'
        hoofdstuk: X
  - number: 14.1.b
    text: |-
      de aanvrager dient ervoor zorg te dragen dat elk ander dan onder a genoemd personeelslid, dat direct is belast met
      het toezicht op of uitvoering van werkzaamheden betrekking hebbende op het ten vervoer aanbieden, het doen of laten
      vervoeren of het daadwerkelijk vervoer van gevaarlijke stoffen door de lucht, zodanig is geïnstrueerd dat hij zijn
      werkzaamheden naar behoren kan uitvoeren; hiertoe dient het personeel te worden opgeleid in overeenstemming met het
      bepaalde in deze regeling en de Technische Voorschriften.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel14
  - number: '14.2'
    text: |-
      Het in het eerste lid, onder a bedoelde examen wordt afgenomen door de Minister van Verkeer en Waterstaat
      aangewezen instituten.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel14
  - number: '14.3'
    text: |-
      De opleidingsprogramma's van de in het vorige lid bedoelde instituten behoeven de instemming van de Minister van
      Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel14
  - number: '15.1'
    text: |-
      Aan natuurlijke personen of rechtspersonen die ingevolge deze regeling zijn erkend, wordt door de Minister van
      Verkeer en Waterstaat een bewijs van erkenning afgegeven.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel15
  - number: '15.2'
    text: Op het bewijs van erkenning wordt aangegeven waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel15
  - number: '15.3'
    text: |-
      Het model van het bewijs van erkenning is overeenkomstig de bij deze regeling behorende [Bijlage A][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009493
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009493
  - number: '16.1'
    text: 'In de volgende gevallen moet de houder van een erkenning een verzoek tot wijziging van de erkenning indienen:'
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: 16.1.a
    text: bij een verplaatsing van zijn bedrijf;
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: 16.1.b
    text: bij een naamsverandering van zijn bedrijf;
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: 16.1.c
    text: bij een wijziging van de werkzaamheden waarvoor zijn bedrijf is erkend;
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: '16.2'
    text: 'De erkenning kan door de Minister van Verkeer en Waterstaat worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: 16.2.a
    text: |-
      de bepalingen van de [artikelen 9][ref1] en [14][ref2] niet worden nagekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0009493#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0009493#Artikel14
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0009493
        artikel: '9'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0009493
        artikel: '14'
        hoofdstuk: IX
  - number: 16.2.b
    text: niet is voldaan aan het gestelde in het eerste lid van dit artikel;
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: 16.2.c
    text: |-
      met betrekking tot de werkzaamheden waarvoor de houder van de erkenning is erkend, ernstige tekortkomingen zijn
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: 16.2.d
    text: het bedrijf van de houder is opgeheven;
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: 16.2.e
    text: het bedrijf van de houder in staat van faillissement verkeert;
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: 16.2.f
    text: |-
      de houder hiertoe een verzoek heeft ingediend of heeft verklaard dat van de erkenning geen gebruik meer wordt of
      zal worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: '16.3'
    text: |-
      De termijn van geldigheid van de erkenning wordt geacht te verstrijken op het tijdstip waarop de erkenning wordt
      ingetrokken of, in de gevallen genoemd in het eerste lid onder d, e en f, het bedrijf van de houder is opgeheven,
      in staat van faillissement verkeert, hiertoe een verzoek heeft ingediend of een verklaring heeft afgelegd als
      bedoeld in het derde lid onder f.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: '16.4'
    text: |-
      Indien een erkenning is ingetrokken kan slechts een nieuwe aanvraag voor erkenning in behandeling worden genomen,
      nadat ten genoegen van de Minister van Verkeer en Waterstaat is aangetoond, dat de redenen die hebben geleid tot de
      intrekking zijn weggenomen.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel16
  - number: '17'
    text: |-
      De geldigheidstermijn van het bewijs als bedoeld in [artikel 14, eerste lid, onder a][ref1] bedraagt ten hoogste
      18 kalendermaanden.


      [ref1]: https://wetten.overheid.nl/BWBR0009493#Artikel14
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0009493
        artikel: '14'
        hoofdstuk: IX
  - number: '18.1'
    text: |-
      Door de Minister van Verkeer en Waterstaat wordt een Commissie van Advies inzake opleidingen en examens betreffende
      het vervoer van gevaarlijke stoffen door de lucht ingesteld.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel18
  - number: '18.2'
    text: |-
      De samenstelling, taken en werkwijze van de in het eerste lid bedoelde commissie worden nader door de Minister van
      Verkeer en Waterstaat vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel18
  - number: '19.1'
    text: |-
      De verpakkingen vervaardigd in overeenstemming met het terzake bepaalde in Bijlage 18 en de Technische
      Voorschriften, editie 1983, mogen nog tot 31 december 1990 worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel19
  - number: '19.2'
    text: |-
      De verpakkingen, die door de International Air Transport Association of het Amerikaanse Department of
      transportation onmiddellijk voorafgaande aan 1 januari 1983 waren toegelaten voor het vervoer van gevaarlijke
      stoffen door de lucht mogen tot 31 december 1990 worden gebruikt, met dien verstande dat, waar discrepantie bestaat
      tussen de Technische Voorschriften en voornoemde voorschriften met betrekking tot het maximum van de te vervoeren
      hoeveelheid van een gevaarlijke stof, slechts de kleinste hoeveelheid is toegestaan.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel19
  - number: '19.3'
    text: |-
      De bewijzen van erkenning als bedoeld in [artikel 14][ref1] van deze regeling, afgegeven onder de tot dusver
      geldende regeling, behouden met het in werking treden van deze regeling hun geldigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0009493#Artikel14
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0009493
        artikel: '14'
        hoofdstuk: IX
  - number: '20'
    text: |-
      Het bepaalde in deze regeling geldt niet indien door de Minister van Verkeer en Waterstaat vrijstelling of
      ontheffing is verleend: aan vrijstellingen en ontheffingen kunnen voorwaarden worden verbonden.
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel20
  - number: '22'
    text: |-
      Deze regeling kan worden aangehaald onder de titel:
      [Regeling vervoer gevaarlijke stoffen door de lucht – 1988][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009493
    url: https://wetten.overheid.nl/BWBR0009493/1998-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009493
