        bwb_id: BWBR0002460
  - number: XVI
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005282/2004-01-01#ArtikelXVI
  - number: XVII
    text: Deze wet kan worden aangehaald als Wet stelselwijziging ziektekostenverzekering tweede fase.
    url: https://wetten.overheid.nl/BWBR0005282/2004-01-01#ArtikelXVII
