preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het kader van de geleidelijke wijziging van het stelsel van
    ziektekostenverzekering in de richting van een algemene zorgverzekering met een risicodragende uitvoeringsstructuur
    wenselijk is wijzigingen aan te brengen in de Algemene Wet Bijzondere Ziektekosten en de Ziekenfondswet, alsmede in
    samenhang daarmee wijzigingen aan te brengen in enige andere wetten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005282/2004-01-01#ArtikelAanhef
articles:
  - number: XIV
    text: |-
      Overeenkomsten als bedoeld in [artikel 44 van de Ziekenfondswet][ref1] met betrekking tot vormen van zorg
      die op of na het tijdstip van inwerkingtreding van deze wet gaan behoren tot de vormen van zorg, bedoeld in
      [artikel 6, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref2] worden vanaf dat tijdstip beschouwd als
      overeenkomsten, bedoeld in artikel 42 van laatstgenoemde wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0005282/2004-01-01#ArtikelXIV
    references:
      - id: ref1
