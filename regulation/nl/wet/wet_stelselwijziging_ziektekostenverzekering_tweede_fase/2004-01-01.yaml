        artikel: '44'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
  - number: XV
    text: |-
      De tekst van de [Algemene Wet Bijzondere Ziektekosten][ref1] en de tekst van de [Ziekenfondswet][ref2] worden door
      Onze Minister van Justitie in het *Staatsblad* geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0005282/2004-01-01#ArtikelXV
    references:
