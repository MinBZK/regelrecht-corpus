$id: wet_hazardspelen_bes_ii
regulatory_layer: WET
publication_date: '2010-10-01'
valid_from: '2010-10-10'
bwb_id: BWBR0028244
url: https://wetten.overheid.nl/BWBR0028244/2010-10-10
articles:
  - number: '1'
    text: |-
      Het bestuurscollege is bevoegd om, onder door hem te stellen voorschriften en waarborgen aan verenigingen met
      volledige rechtsbevoegdheid, verenigingen zonder volledige rechtsbevoegdheid doch die wel aangesloten zijn bij een
      overkoepelende organisatie die rechtspersoon met volledige rechtsbevoegdheid is en stichtingen met een sociaal of
      cultureel doel vergunning te verlenen tot het organiseren van hazardspelen.
    url: https://wetten.overheid.nl/BWBR0028244/2010-10-10#Artikel1
  - number: '2'
    text: |-
      De in [artikel 1][ref1] bedoelde vergunning is persoonlijk en niet voor overdracht vatbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028244#Artikel1
    url: https://wetten.overheid.nl/BWBR0028244/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028244
        artikel: '1'
  - number: '3'
    text: |-
      Het bestuurscollege is bevoegd een vergunning in te trekken indien hij van oordeel is, dat de bij de vergunning
      gestelde voorschriften en waarborgen niet worden nagekomen.
    url: https://wetten.overheid.nl/BWBR0028244/2010-10-10#Artikel3
  - number: '4'
    text: |-
      De vergunninghouder, die de in [artikel 1][ref1] bedoelde voorschriften of waarborgen niet nakomt, wordt geacht
      zonder vergunning te hebben gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0028244#Artikel1
    url: https://wetten.overheid.nl/BWBR0028244/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028244
        artikel: '1'
  - number: '5'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028244/2010-10-10#Artikel5
  - number: '6'
    text: 'Deze wet wordt aangehaald als: Wet hazardspelen BES II.'
    url: https://wetten.overheid.nl/BWBR0028244/2010-10-10#Artikel6
