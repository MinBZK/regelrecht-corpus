---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: uitvoeringsregeling_strategische_goederen
regulatory_layer: WET
publication_date: '2011-11-08'
valid_from: '2010-07-01'
bwb_id: BWBR0024269
url: https://wetten.overheid.nl/BWBR0024269/2010-07-01
preamble:
  text: |-
    Gelet op de artikelen 5, onder a, 6, vierde lid, 7, en 8, derde lid, van het Besluit strategische goederen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel1
  - number: 1.a
    text: 'de Minister: de Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel1
  - number: 1.b
    text: |-
      besluit: het [Besluit strategische goederen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0024139
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0024139
  - number: 1.c
    text: |-
      Joint Force Command Brunssum: het te Brunssum gevestigde hoofdkwartier, bedoeld in de Overeenkomst tussen het
      Koninkrijk der Nederlanden en het Algemeen Hoofdkwartier van de Geallieerde Mogendheden in Europa inzake de
      bijzondere voorwaarden, die toepasselijk zijn op de vestiging en het functioneren van internationale militaire
      hoofdkwartieren binnen het Europese grondgebied van het Koninkrijk der Nederlanden (Trb. 1964, 131);
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel1
  - number: 1.d
    text: |-
      beschikkingsbevoegde: een exporteur als bedoeld in artikel 2, derde lid, van verordening 428/2009 met dien
      verstande dat voor een bestemming buiten het douanegebied van de Gemeenschap een bestemming buiten Nederland wordt
      gelezen;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel1
  - number: 1.e
    text: 'de inspecteur: de Algemeen Directeur Belastingdienst/Douane;'
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel1
  - number: 1.f
    text: |-
      ERA: het Europees Ruimte Agentschap in Noordwijk, opgericht bij het Verdrag tot oprichting van het Europees Ruimte
      Agentschap (Trb. 1990, 43);
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel1
  - number: 1.g
    text: |-
      N.A.V.O.-krijgsmacht: de krijgsmacht van een vreemde mogendheid, die partij is bij het Noord-Atlantisch Verdrag
      (Stb. J 355).
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel1
  - number: '2'
    text: |-
      Als militaire goederen worden aangewezen de goederen, opgenomen in de Gemeenschappelijke EU-lijst van militaire
      goederen, door de Raad aangenomen op 15 februari 2010 (PB EU nr. C 69).
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel2
  - number: '3'
    text: |-
      [Artikel 6 van het besluit][ref1] is niet van toepassing op de uitvoer en de doorvoer van :


      [ref1]: https://wetten.overheid.nl/BWBR0024139#Artikel6
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024139
        artikel: '6'
  - number: 3.a
    text: militaire goederen, bestemd voor gebruik door de Nederlandse krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel3
  - number: 3.b
    text: |-
      militaire goederen, eigendom van en bestemd voor gebruik door NAVO-strijdkrachten, of het Joint Force Command in
      Brunssum;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel3
  - number: 3.c
    text: militaire goederen, eigendom van het ERA;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel3
  - number: 3.d
    text: |-
      militaire voertuigen, die worden gebruikt door vreemde strijdkrachten bij gelegenheden als staats- of
      beleefdheidsbezoeken, vlootschouwen of luchtvaartmanifestaties.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel3
  - number: '4.1'
    text: |-
      De melding inzake de uitvoer uit Nederland of de doorvoer door Nederland van militaire goederen, waarvoor
      geen vergunning is vereist op grond van het bij of krachtens het [besluit][ref1] bepaalde, vindt plaats bij de
      inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0024139
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0024139
  - number: '4.2'
    text: |-
      De melding wordt schriftelijk gedaan door de beschikkingsbevoegde, door degene die voor hem de douaneformaliteiten
      bij de uitvoer of de doorvoer verricht, of, indien geen douaneformaliteiten worden verricht, door de persoon die de
      goederen vervoert.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel4
  - number: '4.3'
    text: 'De melding bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel4
  - number: 4.3.a
    text: het land van bestemming;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel4
  - number: 4.3.b
    text: de naam van de ontvanger van de goederen;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel4
  - number: 4.3.c
    text: |-
      de omschrijving van de goederen waarop de melding betrekking heeft overeenkomstig de Gemeenschappelijke lijst
      van militaire goederen, de merken en nummers, het aantal en de soort van de colli vermelden, of voor onverpakte
      goederen het aantal voorwerpen;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel4
  - number: 4.3.d
    text: |-
      een nauwkeurige vermelding van de plaats, bestaande uit de naam van de plaats en de postcode aangevuld met
      huisnummer, waar de goederen kunnen worden onderzocht.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel4
  - number: '4.4'
    text: |-
      De inspecteur kan een persoon, die gehouden is om meldingen te doen, schriftelijk toestemming geven de melding
      anders dan schriftelijk te doen.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel4
  - number: '4.5'
    text: |-
      De melding wordt gedaan voor inlading in het uitgaande vervoermiddel of, indien het doorvoer betreft uiterlijk op
      het moment van binnenkomst op het grondgebied van Nederland.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel4
  - number: '4.6'
    text: |-
      Een aanvraag ter verkrijging van een consent tot binnenkomen, bedoeld in
      [artikel 14 van de Wet wapens en munitie][ref1], de summiere aangifte voor tijdelijke opslag bedoeld in artikel
      186 van de toepassingsverordening Communautair douanewetboek, mits zij is voorzien van de bij artikel 4, derde lid,
      letter c en d bedoelde gegevens en de aangifte ten (weder)uitvoer bedoeld in artikel 182bis van het Communautair
      douanewetboek, mits zij is voorzien van de bij artikel 4, derde lid, letter c en d bedoelde gegevens gelden als
      melding inzake de doorvoer door Nederland als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
  - number: '5'
    text: 'Geen melding is vereist van:'
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel5
  - number: 5.a
    text: |-
      de doorvoer van goederen die zonder aanlanding worden vervoerd door de territoriale wateren, of door het luchtruim
      van Nederland, en
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel5
  - number: 5.b
    text: |-
      de militaire goederen, bedoeld in [artikel 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024269#Artikel3
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024269
        artikel: '3'
        paragraaf: '2'
  - number: '6.1'
    text: Vergunningen worden schriftelijk aangevraagd bij de inspecteur met gebruikmaking van daartoe bestemde formulieren.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel6
  - number: '6.2'
    text: |-
      Vergunningen worden aangevraagd door of namens de beschikkingsbevoegde, door degene die voor hem de
      douaneformaliteiten bij de uitvoer of de doorvoer verricht, of, indien geen douaneformaliteiten worden verricht,
      door de persoon die de goederen vervoert.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel6
  - number: '6.3'
    text: |-
      In Nederland gevestigde exporteurs dienen aanvragen ter verkrijging van een vergunning, bedoeld in artikel 3 van
      verordening 428/2009, in bij de inspecteur ook al bevinden de goederen zich op het grondgebied van een andere
      lidstaat.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel6
  - number: '6.4'
    text: |-
      Een vergunning voor militaire goederen kan betrekking hebben op meegeleverde reserveonderdelen en toebehoren,
      voor zover deze worden geleverd uit hoofde van dezelfde overeenkomst die betrekking heeft op de levering van de
      militaire goederen waarvoor de vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel6
  - number: '6.5'
    text: De gegevens in de aanvraag worden juist, volledig en zonder voorbehoud verstrekt.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel6
  - number: '7.1'
    text: 'Aan een vergunning kunnen ten minste de volgende voorschriften worden verbonden:'
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: 7.1.a
    text: |-
      de goederen, waarop de vergunning betrekking heeft, worden binnen een bij de vergunning te bepalen termijn
      wederingevoerd, welke wederinvoer wordt aangetoond binnen een maand na de wederinvoer;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: 7.1.b
    text: |-
      bij elke uitvoer of doorvoer die met de vergunning wordt verricht wordt een factuur ingezonden aan de inspecteur.
      Deze factuur bevat de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: 7.1.b.1°
    text: het nummer van de vergunning;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: 7.1.b.2°
    text: naam en adres van de ontvanger;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: 7.1.b.3°
    text: |-
      een omschrijving van de uit- of door te voeren goederen, met inbegrip van het postnummer waarmee de desbetreffende
      goederen zijn aangeduid in de bijlage bij deze regeling;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: 7.1.b.4°
    text: de hoeveelheid en de waarde;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: 7.1.c
    text: |-
      door middel van een bewijsstuk, zoals een bewijs van ontvangst, een ambtelijk gewaarmerkte kopie van een
      invoerdocument, of een eindgebruikersverklaring bij de inspecteur wordt aangetoond dat de goederen de bestemming
      waarvoor de vergunning is verleend, hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: '7.2'
    text: |-
      Een vergunning waarvan geen gebruik zal of kan worden gemaakt wordt onder opgave van redenen terstond ingezonden
      aan de inspecteur.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: '7.3'
    text: 'De inspecteur kan bij de vergunningaanvraag verzoeken om:'
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: 7.3.a
    text: de overeenkomst die ten grondslag ligt aan de betreffende uit- of doorvoer;
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: 7.3.b
    text: een verklaring betreffende het eindgebruik.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: '7.4'
    text: |-
      De minister kan een namens hem afgegeven vergunning, indien deze nog niet is gebruikt, in ieder geval intrekken
      indien:
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: 7.4.a
    text: de vergunning werd verstrekt op grond van onjuiste of onvolledige gegevens, en
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: 7.4.b
    text: de aanvrager van de onjuistheid of de onvolledigheid kennis droeg of redelijkerwijze kennis had moeten dragen.
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel7
  - number: '8'
    text: 'Deze regeling wordt aangehaald als: Uitvoeringsregeling strategische goederen.'
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel8
  - number: '9'
    text: |-
      Deze regeling treedt in werking op het moment dat de [wet][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0023746
    url: https://wetten.overheid.nl/BWBR0024269/2010-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0023746
