preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te voorzien in een wettelijke regeling teneinde de
    aanspraak van vreemdelingen jegens bestuursorganen op verstrekkingen, voorzieningen, uitkeringen, ontheffingen en
    vergunningen te koppelen aan het rechtmatig verblijf van de vreemdeling in Nederland;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009511/1998-08-01#ArtikelAanhef
articles:
  - number: XXIII
    text: |-
      1 In afwijking van [artikel VII][ref1] wordt als huurder als bedoeld in artikel 1 van de Wet individuele
      huursubsidie tevens aangemerkt: de vreemdeling die rechtmatig verblijf houdt als bedoeld in artikel 1b, aanhef,
      en onder 5, van de Vreemdelingenwet, mits hem een bijdrage als bedoeld in artikel 2, eerste lid, van de Wet
      individuele huursubsidie is of wordt verstrekt voor het laatste tijdvak, bedoeld in artikel 2, vijfde lid, van die
      wet voor het tijdstip van inwerkingtreding van [artikel VII][ref2].

      2 Bijstandsverlening krachtens de [Algemene bijstandswet][ref3], welke op het tijdstip van inwerkingtreding
      van deze wet plaatsvindt, kan, ten aanzien van een vreemdeling die rechtmatig verblijf houdt, als
      bedoeld in artikel 1b, aanhef, en onder 5, van de Vreemdelingenwet, worden voortgezet; in zodanig geval
      kan ten aanzien van deze vreemdeling, voor zover woonachtig in Nederland, eveneens worden afgeweken van
      [artikel 2, tweede lid, van de Ziekenfondswet][ref4].


