      stoornissen van lichamelijke, geestelijke, sociale of pedagogische aard die hun ontwikkeling naar volwassenheid
      ongunstig kunnen beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel1
  - number: 1.1.d
    text: 'voorziening: een aanbod van jeugdhulpverlening;'
