  - number: 1.1.v
    text: |-
      cliëntenvertrouwenspersoon: persoon die bij een voorziening of instelling werkzaam is om, onafhankelijk van
      het bestuur en van personen in dienst van de uitvoerder of de instelling aan jeugdigen op hun verzoek advies en
      bijstand te verlenen in aangelegenheden samenhangend met de aan hen geboden hulpverlening.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel1
  - number: '1.2'
    text: 'De jeugdhulpverlening wordt onderscheiden in de volgende typen:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel1
  - number: 1.2.a
    text: |-
      pleegzorg: hulpverlening bestaande uit het bieden van opneming in een pleeggezin en de daarmee verband houdende
      begeleiding van pleegkinderen, pleegouders, ouders en stiefouders;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel1
  - number: 1.2.b
    text: |-
      residentiële hulpverlening: hulpverlening waarbij een jeugdige wordt opgenomen in een tehuis waarin dag en nacht
      hulp wordt geboden;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel1
  - number: 1.2.c
    text: |-
      semi-residentiële hulpverlening: hulpverlening waarbij een jeugdige regelmatig gedurende een deel van een etmaal in
      een daartoe bestemde inrichting verblijft;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel1
  - number: 1.2.d
    text: 'ambulante hulpverlening: hulpverlening, anders dan bedoeld onder *a*, *b* of *c*.'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel1
  - number: '1.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven met betrekking tot de taak en de bevoegdheid van de
      cliëntenvertrouwenspersoon.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel1
  - number: '2.1'
    text: |-
      Deze wet is van toepassing op de beleidsvorming en de uitvoering en subsidiëring van voorzieningen, behorende tot
      een van de in de bijlage bij deze wet opgenomen categorieën, alsmede op steunfuncties.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel2
  - number: '2.2'
    text: |-
      De voorzieningen behoren, overeenkomstig het bepaalde in de bijlage, tot de primaire, secundaire of tertiaire
      hulpverlening.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel2
  - number: '3.1'
    text: |-
      De steunfuncties, alsmede de voorzieningen van tertiaire hulpverlening en de voorzieningen van secundaire
      hulpverlening, die in verband met de spreiding van de doelgroep gericht zijn op jeugdigen uit het hele land of
      grote delen daarvan, verder te noemen: landelijke voorzieningen, behoren tot de bemoeiing van het Rijk.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel3
  - number: '3.2'
    text: |-
      De overige voorzieningen, verder te noemen: regionale voorzieningen, behoren onverminderd het derde lid, tot de
      bemoeiing van de provincies.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel3
  - number: '3.3'
    text: |-
      Een regionale voorziening die voldoet aan het bepaalde bij of krachtens deze wet, kan, mits de overheid tot wier
      bemoeiing de voorziening behoort, heeft verklaard dat de voorziening past in het plan, worden gesubsidieerd door
      een gemeente.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel3
  - number: 3a.1
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan aan landelijke voorzieningen en steunfuncties subsidie
      verstrekken in de kosten van jeugdhulpverlening en subsidie ter bestrijding van de financiële gevolgen van een
      vermindering van de subsidie of de capaciteit dan wel de beëindiging van de subsidiëring.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel3a
  - number: 3a.2
    text: |-
      Provinciale Staten kunnen aan regionale voorzieningen en aan samenwerkingsverbanden subsidie verstrekken in de
      kosten van jeugdhulpverlening en subsidie ter bestrijding van de financiële gevolgen van een vermindering van de
      subsidie of de capaciteit dan wel de beëindiging van de subsidiëring.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel3a
  - number: '4.1'
    text: |-
      De provinciale besturen wijzen gebieden aan die voor de toepassing van deze wet als regio
      worden aangemerkt en die samenvallen met één of meer samenwerkingsgebieden als bedoeld in
      [artikel 2 van de Wet gemeenschappelijke regelingen][ref1] (*Stb.* 1984, 699).


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel2
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '2'
  - number: '4.2'
    text: |-
      Indien de desbetreffende provinciale besturen de bevoegdheden inzake de uitvoering van hun taken in het kader van
      de jeugdhulpverlening op grond van [artikel 20 van de Kaderwet bestuur in verandering][ref1] hebben overgedragen
      aan het bestuur van een regionaal openbaar lichaam van het samenwerkingsgebied waarvan de gemeente Amsterdam,
      Rotterdam onderscheidenlijk 's-Gravenhage deel uitmaakt, wordt dat samenwerkingsgebied voor de toepassing van deze
      wet gelijkgesteld met een provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel20
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '20'
