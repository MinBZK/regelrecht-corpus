  - number: '5.3'
    text: |-
      De voordracht voor een algemene maatregel van bestuur op grond van deze wet, behoudens die, bedoeld in
      de[ artikelen 61][ref1], [65][ref2] en [84][ref3], wordt niet gedaan dan nadat het ontwerp in de *Staatscourant*
      is geplaatst en aan ieder de gelegenheid is geboden om binnen vier weken na de dag waarop de plaatsing is geschied,
      wensen en bedenkingen ter kennis van Onze Ministers te brengen. Gelijktijdig met de plaatsing wordt het ontwerp aan
      beide Kamers der Staten-Generaal overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel65
