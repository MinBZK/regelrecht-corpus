      voortzetting van jeugdhulpverlening, die was aangevangen vóór het bereiken van de meerderjarigheidsleeftijd,
      noodzakelijk is, voor wie, na beëindiging van jeugdhulpverlening die was aangevangen vóór het bereiken van de
      meerderjarigheidsleeftijd, binnen een termijn van een half jaar hervatting van jeugdhulpverlening noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel1
  - number: 1.1.b.4°
