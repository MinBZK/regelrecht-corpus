  - number: '6'
    text: |-
      Bij de beleidsvorming wordt zoveel mogelijk rekening gehouden met de pluriformiteit van de samenleving en worden
      met inachtneming van waarborgen voor deugdelijkheid, doelmatigheid en democratisch functioneren eigen initiatief en
      verantwoordelijkheid van de burgers bevorderd.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel6
  - number: '7.1'
    text: |-
      Onze ministers brengen jaarlijks, uiterlijk tegelijk met de indiening van de voorstellen van wet houdende
      vaststelling van de hoofdstukken van de begroting van de uitgaven van het Rijk, aan de Tweede Kamer der Staten-
      Generaal verslag uit van de ontwikkelingen op het terrein van de jeugdhulpverlening. Eenmaal in de vijf jaren wordt
      het verslag, bedoeld in [artikel 4:24 van de Algemene wet bestuursrecht][ref1], hierin opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '7.2'
    text: Het verslag bevat in ieder geval
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel7
  - number: 7.2.a
    text: gegevens inzake de uitvoering van het plan;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel7
  - number: 7.2.b
    text: |-
      een overzicht van de kosten van de jeugdhulpverlening in het afgelopen kalenderjaar en van de bronnen waaruit deze
      zijn bestreden.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel7
  - number: '7.3'
    text: |-
      Het verslag bevat bovendien voor de onderscheiden regio’s een overzicht van de kosten van de Riagg’s voor zover het
      hun werkzaamheden voor jeugdigen betreft.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel7
  - number: '8.1'
    text: |-
      Onze ministers stellen jaarlijks telkens voor vier jaren een plan vast ten aanzien van de jeugdhulpverlening.
      Het plan voorziet in een patroon van steunfuncties en landelijke voorzieningen dat zo goed mogelijk aansluit
      bij de behoeften. Het plan voorziet in ieder geval in een genoegzaam aanbod van jeugdhulpverlening ten behoeve
      van jeugdigen ten aanzien van wie een maatregel van justitiële kinderbescherming is toegepast. Het bepaalde
      in de voorgaande volzin geldt eveneens ten aanzien van jeugdigen voor wie voortzetting van hulp als bedoeld
      in [artikel 1, eerste lid, onder ][ref1], noodzakelijk is. Voor zover het plan de voorzieningen, bedoeld in
      [hoofdstuk XIV][ref2], betreft, wordt dit vastgesteld door Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004608#HoofdstukXIV
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004608
        hoofdstuk: XIV
  - number: '8.2'
    text: 'In het plan worden voor het eerste jaar waarop het betrekking heeft, opgenomen:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel8
  - number: 8.2.a
    text: |-
      de steunfuncties en landelijke voorzieningen die in dat jaar voor subsidiëring in aanmerking komen dan wel door
      het Rijk in stand zullen worden gehouden, wie een steunfunctie of landelijke voorziening zal uitvoeren, alsmede het
      subsidiebedrag dat ten hoogste verstrekt kan worden en in voorkomende gevallen de maximale capaciteit;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel8
  - number: 8.2.b
    text: |-
      het subsidieplafond of de subsidieplafonds voor de uitvoering van experimenten dan wel het bedrag ten laste waarvan
      een of meerdere subsidieplafonds kunnen worden vastgesteld alsmede de subsidiebedragen voor de onderscheiden
      experimenten die in dat jaar worden uitgevoerd en waarvoor reeds subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel8
  - number: '8.3'
    text: |-
      In het plan worden de bedragen aangegeven die voor het tweede jaar waarop het plan betrekking heeft aan de
      provincies beschikbaar zullen worden gesteld voor de subsidiëring van regionale voorzieningen, de provinciale
      klachtencommissie, bedoeld in [artikel 49][ref1], en cliëntenvertrouwenspersonen, alsmede de bedragen voor de
      subsidiëring van samenwerkingsverbanden een en ander voor zover de wetgever de nodige gelden beschikbaar stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel49
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '49'
        hoofdstuk: IX
  - number: '8.4'
    text: 'Het plan vermeldt bovendien:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel8
  - number: 8.4.a
    text: |-
      de wijzigingen die het Rijk in het tweede, derde en vierde jaar voornemens is aan te brengen in het beleid
      met betrekking tot de steunfuncties en met betrekking tot de functies, capaciteit, samenhang en spreiding van
      landelijke voorzieningen, onder vermelding van de financiële gevolgen ervan;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel8
  - number: 8.4.b
    text: |-
      de bedragen die het Rijk voornemens is voor het derde en vierde jaar aan de provincies beschikbaar te stellen
      voor de subsidiëring van de regionale voorzieningen, samenwerkingsverbanden, de provinciale klachtencommissie en
      cliëntenvertrouwenspersonen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel8
  - number: '9.1'
    text: |-
      Het plan wordt niet vastgesteld dan nadat over de onderdelen van het plan, bedoeld in
      [artikel 8, vierde lid, onder ][ref1], met de provincies en over het onderdeel van het plan, bedoeld
      in [artikel 8, vierde lid, onder ][ref2], met de naar het oordeel van Onze ministers representatieve
      vertegenwoordigers van steunfuncties en landelijke voorzieningen overleg is gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel8
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '9.2'
    text: |-
      De bekendmaking van het plan geschiedt door plaatsing in de *Staatscourant*. Van het plan wordt mededeling gedaan
      door toezending van een afschrift aan de beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel9
  - number: '10.1'
    text: |-
      Provinciale staten stellen jaarlijks telkens voor vier jaren een plan vast ten aanzien van de regionale
      voorzieningen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel10
  - number: '10.2'
    text: |-
      Het plan voorziet voor elke regio in een patroon van voorzieningen, dat zo goed mogelijk aansluit bij de behoeften
      en dat evenwichtig is opgebouwd uit hulpverlening van de typen, genoemd in [artikel 1, tweede lid][ref1].
      Het plan voorziet in ieder geval in een genoegzaam aanbod van jeugdhulpverlening ten behoeve van jeugdigen
      ten aanzien van wie een maatregel van justitiële kinderbescherming is toegepast. Het bepaalde in de
      voorgaande volzin geldt eveneens ten aanzien van jeugdigen voor wie voortzetting van hulp als bedoeld in
      [artikel 1, eerste lid, onder ][ref2], noodzakelijk is. Voorts voorziet het plan er in ieder geval in dat in de
      provincie één of meer advies- en meldpunten kindermishandeling, als bedoeld in [artikel 34a][ref3], werkzaam zijn.
      Onze ministers kunnen in verband met de tweede, derde en vierde volzin richtlijnen geven omtrent de inhoud van het
      provinciale plan.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0004608#Artikel34a
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '1'
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0004608
        artikel: 34a
        hoofdstuk: IVA
  - number: '10.3'
    text: 'In het plan worden voor het eerste jaar waarop het betrekking heeft voor de onderscheiden regio’s opgenomen:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel10
  - number: 10.3.a
    text: |-
      de regionale voorzieningen die in dat jaar voor subsidiëring in aanmerking komen dan wel door de provincie in stand
      zullen worden gehouden, wie een voorziening zal uitvoeren, alsmede het subsidiebedrag dat ten hoogste verstrekt kan
      worden en in voorkomende gevallen de maximale capaciteit;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel10
  - number: 10.3.b
    text: de subsidies die dat jaar verstrekt zullen worden aan de onderscheiden samenwerkingsverbanden.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel10
  - number: '10.4'
    text: |-
      In het plan wordt voorts voor het eerste jaar waarop het betrekking heeft het bedrag opgenomen dat in dat jaar
      beschikbaar zal worden gesteld aan de provinciale klachtencommissie, bedoeld in [artikel 49][ref1] en het bedrag
      dat beschikbaar zal worden gesteld voor cliëntenvertrouwenspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel49
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '49'
        hoofdstuk: IX
  - number: '10.5'
    text: |-
      Het plan vermeldt bovendien voor het tweede, derde en vierde jaar de wijzigingen die de provincie voornemens is
      aan te brengen in het beleid met betrekking tot de functies, capaciteit, samenhang en spreiding van de regionale
      voorzieningen, onder vermelding van de financiële gevolgen ervan.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel10
  - number: '11.1'
    text: |-
      Provinciale staten stellen een verordening vast, waarin regels worden gesteld met betrekking tot de wijze waarop
      ingezetenen en in de provincie werkzame uitvoerders worden betrokken bij de voorbereiding van het beleid ten
      aanzien van de regionale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel11
  - number: '11.2'
    text: 'In deze verordening worden tenminste geregeld:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel11
  - number: 11.2.a
    text: de wijze waarop beleidsvoornemens worden openbaar gemaakt;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel11
  - number: 11.2.b
    text: |-
      de wijze waarop ingezetenen en in de provincie werkzame uitvoerders in staat worden gesteld hun mening over de
      beleidsvoornemens kenbaar te maken;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel11
  - number: 11.2.c
    text: de wijze waarop met in de provincie werkzame uitvoerders overleg wordt gevoerd over de beleidsvoornemens;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel11
  - number: 11.2.d
    text: de rapportering over de onder *b* bedoelde inspraak en het onder *c* bedoelde overleg en de uitkomsten daarvan;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel11
  - number: 11.2.e
    text: |-
      de wijze waarop ingezetenen en in de provincie werkzame uitvoerders in de gelegenheid worden gesteld hun beklag te
      doen over de uitvoering van de verordening.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel11
  - number: '12'
    text: |-
      Gedeputeerde staten zenden jaarlijks vóór 1 juli aan Onze ministers een overzicht van de kosten van de regionale
      voorzieningen en de samenwerkingsverbanden in de onderscheiden regio’s over het afgelopen kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel12
  - number: '13.1'
    text: |-
      Onze ministers verstrekken jaarlijks een uitkering aan de provincies ter bestrijding van de kosten, bedoeld in
      [artikel 10, derde en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel10
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '13.2'
    text: |-
      De uitkering bedraagt de som van de in [artikel 8, derde lid][ref1], bedoelde voor de provincie vastgestelde
      bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel8
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '13.3'
    text: |-
      Indien de provinciale jaarrekening met bijbehorende accountantsverslag blijk geeft van onzekerheden omtrent de
      besteding van de uitkering dan wel van onrechtmatigheden in de besteding van de uitkering, stelt het provinciaal
      bestuur Onze Ministers zo spoedig mogelijk schriftelijk daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel13
  - number: '13.4'
    text: |-
      Het provinciaal bestuur geeft in het geval, bedoeld in het derde lid, aan op welke wijze het voornemens is de
      onzekerheden op te heffen dan wel in een rechtmatige besteding van de uitkering te voorzien. Onze Ministers kunnen
      in verband daarmee tot verrekening overgaan.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel13
  - number: '14.1'
    text: |-
      In elke regio is er een samenwerkingsverband waarin de in de regio werkzame, rechtspersoonlijkheid bezittende
      uitvoerders, alsmede Riagg's, voor zover het hun werkzaamheden voor jeugdigen betreft, samenwerken.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel14
  - number: '14.2'
    text: |-
      Het samenwerkingsverband is rechtspersoon. Per categorie van voorzieningen benoemen de uitvoerders één bestuurslid
      en diens plaatsvervanger. De Riagg’s benoemen eveneens een bestuurslid en diens plaatsvervanger. Bestuursleden
      hebben gedurende ten hoogste vier jaren zitting en zijn vervolgens één maal herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel14
  - number: '14.3'
    text: |-
      De bestuursleden genieten als zodanig geen bezoldiging en verkrijgen voor het bijwonen van vergaderingen geen
      vacatiegelden.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel14
  - number: '14.4'
    text: |-
      Het samenwerkingsverband regelt bij reglement zijn zetel, zijn werkwijze waaronder de besluitvorming, alsmede de
      toerekening aan de onderscheiden deelnemers van de kosten van het samenwerkingsverband. Voor de vaststelling van
      het reglement is een volstrekte meerderheid van stemmen vereist.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel14
  - number: '14.5'
    text: De raad voor de kinderbescherming neemt aan de werkzaamheden van het samenwerkingsverband deel.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel14
  - number: '15'
    text: 'Het samenwerkingsverband heeft de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel15
  - number: 15.a
    text: de uitwisseling van informatie omtrent de inhoud van de door de deelnemende uitvoerders geboden voorzieningen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel15
  - number: 15.b
    text: het aanleggen en bijhouden van een overzicht van de in de regio aanwezige voorzieningen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel15
  - number: 15.c
    text: het informeren van derden over de in de regio aanwezige voorzieningen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel15
  - number: 15.d
    text: |-
      het op elkaar afstemmen van de werkzaamheden van de deelnemende uitvoerders, alsmede het maken van afspraken over
      de bijdrage die de Riagg’s aan de jeugdhulpverlening in de regio zullen leveren;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel15
  - number: 15.e
    text: |-
      het maken van afspraken over de ondersteuning van voorzieningen en derden in de regio door wie een probleem of
      stoornis bij een jeugdige wordt onderkend of gesignaleerd;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel15
  - number: 15.f
    text: |-
      het, rekening houdende met de in onderdeel *d* bedoelde bijdrage van de Riagg's, geven van adviezen aan het
      provinciale bestuur met betrekking tot de planning ten aanzien van regionale voorzieningen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel15
  - number: 15.g
    text: het in stand houden van een jeugdhulpadviesteam.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel15
  - number: '16.1'
    text: |-
      Het bestuur van het samenwerkingsverband stelt een commissie in voor de voorzieningen, behorende tot de primaire,
      de secundaire of de tertiaire hulpverlening, indien een of meer uitvoerders van tot die hulpverlening behorende
      voorzieningen zulks verzoeken.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel16
  - number: '16.2'
    text: |-
      Een advies als bedoeld in [artikel 15, onder ][ref1], wordt niet uitgebracht dan nadat een commissie als bedoeld in
      het eerste lid in de gelegenheid is gesteld haar standpunt terzake daaraan toe te voegen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel15
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '15'
        hoofdstuk: III
        paragraaf: '1'
  - number: '17.1'
    text: |-
      Een jeugdhulpadviesteam is evenwichtig samengesteld uit in ieder geval een kinder- of jeugdarts, een kinder- of
      jeugdpsychiater, een orthopedagoog, een psycholoog en een maatschappelijk werker.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel17
  - number: '17.2'
    text: |-
      De leden van het jeugdhulpadviesteam beschikken ieder over ruime ervaring op hun werkgebied, terwijl zij
      gezamenlijk over genoegzame ervaring beschikken terzake van onderkenning en behandeling van problemen en
      stoornissen van jeugdigen. Zij hebben voorts inzicht in het aanbod van jeugdhulpverlening in de regio.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel17
  - number: '18.1'
    text: |-
      De leden van het jeugdhulpadviesteam worden door het bestuur van het samenwerkingsverband aangewezen uit de
      deskundigen verbonden aan de deelnemers.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel18
  - number: '18.2'
    text: |-
      De leden vervullen hun functie zonder last van degene tot wie zij in dienstbetrekking staan. De uitvoerder waaraan
      de deskundige is verbonden, draagt er zorg voor dat deze wegens zijn lidmaatschap van het jeugdhulpadviesteam niet
      wordt benadeeld in zijn positie.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel18
  - number: '19'
    text: |-
      Het jeugdhulpadviesteam heeft in zijn regio, onverminderd het overigens bij deze wet bepaalde, in ieder geval de
      volgende taken:
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel19
  - number: 19.a
    text: |-
      het op verzoek van een uitvoerder stellen of doen stellen van een diagnose en het geven van een oordeel
      over de meest aangewezen behandeling in gevallen waarin sprake is van een zo ingewikkelde problematiek dat
      multidisciplinaire oordeelsvorming wenselijk is en de tot dusver geboden hulp onvoldoende resultaat heeft gehad;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel19
  - number: 19.b
    text: |-
      het op verzoek van een plaatsende instantie uitbrengen van advies over de vraag welke hulpverlening voor een
      jeugdige de meest aangewezene is te achten;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel19
  - number: 19.c
    text: |-
      het op verzoek van de rechter, bij de toepassing van [artikel 261 van Boek 1 van het Burgerlijk Wetboek][ref1] of
      van [titel VIIIA van het eerste boek van het Wetboek van Strafrecht](onbekend), uitbrengen van advies over de vraag
      welke hulpverlening voor een jeugdige de meest aangewezene is te achten;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
  - number: 19.d
    text: |-
      het registreren van de gegevens, bedoeld in [artikel 32][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel32
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '32'
        hoofdstuk: IV
  - number: '20'
    text: |-
      De deelnemers aan het samenwerkingsverband stellen aan het jeugdhulpadviesteam op diens verzoek de deskundigen ter
      beschikking die nodig zijn voor de uitvoering van de in [artikel 19, onder ][ref1], bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel19
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '19'
        hoofdstuk: III
        paragraaf: '2'
  - number: '21.1'
    text: Het samenwerkingsverband voegt aan het jeugdhulpadviesteam een secretariaat toe.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel21
  - number: '21.2'
    text: |-
      Het bestuur van het samenwerkingsverband stelt bij reglement regelen omtrent de werkwijze van het
      jeugdhulpadviesteam. Het reglement kan een nadere regeling bevatten omtrent de samenstelling en de taak van het
      jeugdhulpadviesteam.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel21
  - number: '22.1'
    text: |-
      Uitvoerders van regionale semi-residentiële of residentiële voorzieningen op het terrein van de secundaire
      hulpverlening in een regio stellen ten aanzien van iedere jeugdige die op een voorziening in de regio is aangewezen
      gezamenlijk vast in welke voorziening de jeugdige zal verblijven, welke specifieke deskundigheid daarnaast aan de
      jeugdige zal worden geboden en door wie deze deskundigheid beschikbaar zal worden gesteld. De jeugdige en degene
      die het ouderlijk gezag of de voogdij over hem uitoefent worden bij de vaststelling betrokken.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel22
  - number: '22.2'
    text: |-
      De in het eerste lid bedoelde uitvoerders kunnen met het oog op een doelmatige hulpverlening in de regio werkzame
      uitvoerders van ambulante voorzieningen bij hun samenwerking betrekken.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel22
  - number: '22.3'
    text: |-
      Indien ingevolge een rechterlijke uitspraak vaststaat in welke voorziening een jeugdige zal verblijven, is het
      eerste lid in zoverre niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel22
  - number: '23'
    text: |-
      Hulpverlening vindt plaats in de minst ingrijpende vorm, zo dicht mogelijk bij de plaats waar de jeugdige duurzaam
      verblijft en gedurende een zo kort mogelijke periode en voldoet ook overigens aan de eis dat zij voor de jeugdige
      de meest aangewezene is te achten.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel23
  - number: '24.1'
    text: |-
      Een uitvoerder van een voorziening van pleegzorg of van een voorziening van semi-residentiële of residentiële
      hulpverlening verleent op verzoek van degene die voor plaatsing verantwoordelijk is, aan een jeugdige ten aanzien
      van wie een maatregel van justitiële kinderbescherming is getroffen die tot een zodanige plaatsing strekt of haar
      noodzakelijk maakt de desbetreffende hulp, tenzij hij voor de jeugdige geen plaats heeft.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel24
  - number: '24.2'
    text: |-
      Indien een maatregel van justitiële kinderbescherming die strekt tot plaatsing in een voorziening van residentiële
      hulpverlening of deze noodzakelijk maakt na toepassing van het eerste lid niet kan worden gerealiseerd, meldt
      degene die verantwoordelijk is voor de plaatsing dit aan Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel24
  - number: '24.3'
    text: |-
      Een uitvoerder van een voorziening van residentiële hulpverlening verleent aan een jeugdige ten aanzien van wie
      geen maatregel van justitiële kinderbescherming als bedoeld in het eerste lid is getroffen slechts hulp, nadat hij
      zich er van heeft vergewist, dat geen jeugdige ten aanzien van wie een melding als bedoeld in het tweede lid is
      gedaan, in aanmerking moet komen voor die hulpverlening.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel24
  - number: '24.4'
    text: |-
      Voor zover een maatregel van justitiële kinderbescherming die strekt tot plaatsing in een pleeggezin of deze
      noodzakelijk maakt na toepassing van het eerste lid niet kan worden gerealiseerd, wordt de jeugdige, ongeacht
      het aan de voorziening van pleegzorg beschikbaar gestelde maximale subsidie of de maximale capaciteit, in een
      pleeggezin geplaatst.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel24
  - number: '24.5'
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing ten aanzien van jeugdigen voor wie
      voortzetting van hulp als bedoeld in [artikel 1, eerste lid, onder ][ref1], noodzakelijk is, met dien verstande
      dat degene die voor de plaatsing verantwoordelijk is een melding als bedoeld in het tweede lid, aan Onze Ministers
      doet.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel1
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '1'
        hoofdstuk: I
  - number: '25.1'
    text: |-
      Secundaire hulpverlening van een type, genoemd in [artikel 1, tweede lid, onder ][ref1], vangt slechts aan en
      wordt slechts hervat als bedoeld in [artikel 1, eerste lid, onder ][ref2], indien een bevoegde plaatsende instantie
      overeenkomstig deze wet niet langer dan twee maanden tevoren heeft vastgesteld dat die hulpverlening voor de
      betrokken jeugdige aangewezen is te achten. De hulpverlening geschiedt slechts gedurende de door de plaatsende
      instantie aangegeven termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel1
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '1'
        hoofdstuk: I
  - number: '25.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op voortzetting van de hulpverlening aan de jeugdige na het
      verstrijken van de door de plaatsende instantie aangegeven termijn.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel25
  - number: '25.3'
    text: |-
      Secundaire hulpverlening van een type, genoemd in [artikel 1, tweede lid, onder ][ref1], wordt slechts voortgezet
      als bedoeld in [artikel 1, eerste lid, onder ][ref2], indien de plaatsende instantie die laatstelijk als zodanig is
      opgetreden of degene die laatstelijk voor de plaatsing verantwoordelijk is geweest, de in het eerste lid bedoelde
      vaststelling heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel1
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '1'
        hoofdstuk: I
  - number: '25.4'
    text: |-
      Hulpverlening door een residentiële of een semi-residentiële voorziening, niet zijnde een voorziening voor
      crisisopvang als bedoeld onder II, onderdeel 1, van de bijlage behorende bij deze wet, aan een jeugdige als bedoeld
      in [artikel 1, onder ][ref1], vangt, onverminderd het bepaalde in het eerste en tweede lid, slechts aan nadat
      een bevoegde plaatsende instantie een daartoe strekkend advies van het desbetreffende jeugdhulpadviesteam heeft
      ontvangen en toestemming van Onze Ministers, indien het hulpverlening in een landelijke voorziening betreft, of
      van het desbetreffende provinciaal bestuur, indien het hulpverlening in een regionale voorziening betreft, heeft
      verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel1
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '1'
        hoofdstuk: I
  - number: '26.1'
    text: |-
      [Artikel 25][ref1] is niet van toepassing, indien het betreft hulpverlening aan een jeugdige ten aanzien van wie
      recht is gedaan overeenkomstig [titel VIIIA van het eerste boek van het Wetboek van Strafrecht](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel25
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '25'
        hoofdstuk: IV
  - number: '26.2'
    text: |-
      In acute noodsituaties is [artikel 25, eerste lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel25
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '25'
        hoofdstuk: IV
  - number: '26.3'
    text: |-
      Hulpverlening in gevallen als bedoeld in het tweede lid geschiedt voor ten hoogste twee weken. Van de aanvang van
      de hulpverlening wordt, indien deze niet plaatsvond door tussenkomst van een plaatsende instantie, onverwijld onder
      opgave van redenen mededeling gedaan aan een plaatsende instantie.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel26
  - number: '26.4'
    text: |-
      Bij toepassing van het tweede lid deelt de plaatsende instantie onverwijld aan degene die het ouderlijk gezag of de
      voogdij over een minderjarige uitoefent mee dat hulp aan deze minderjarige wordt verleend.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel26
  - number: '26.5'
    text: |-
      Indien ten aanzien van een minderjarige een maatregel van ondertoezichtstelling als bedoeld in
      [artikel 254 van Boek 1 van het Burgerlijk Wetboek][ref1] van toepassing is, worden de mededelingen bedoeld in het
      vierde lid, tevens gedaan aan degene die toezicht op de minderjarige houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
  - number: '27.1'
    text: |-
      Het provinciale bestuur erkent een uitvoerder van ambulante hulpverlening of een Riagg als plaatsende instantie,
      voor een daarbij aan te wijzen werkgebied, indien:
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel27
  - number: 27.1.a
    text: naar het oordeel van het provinciale bestuur aan diens activiteiten als plaatsende instantie behoefte bestaat;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel27
  - number: 27.1.b
    text: |-
      een zodanige werkwijze wordt toegepast dat is gewaarborgd dat de taken, bedoeld in [artikel 29][ref1],
      onafhankelijk van de overige werkzaamheden worden uitgevoerd en dat één deskundige met de verantwoordelijkheid voor
      deze taken is belast;


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel29
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '29'
        hoofdstuk: IV
  - number: 27.1.c
    text: |-
      de taken, bedoeld in [artikel 29][ref1], worden uitgevoerd door personen die voldoen aan bij algemene maatregel van
      bestuur te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel29
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '29'
        hoofdstuk: IV
  - number: '27.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van instellingen of instanties, niet zijnde uitvoerders,
      worden aangewezen, die overeenkomstig het eerste lid voor erkenning in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel27
  - number: '27.3'
    text: 'Als plaatsende instantie zijn erkend:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel27
  - number: 27.3.a
    text: voogdij-instellingen, ten aanzien van jeugdigen, waarover zij de voogdij dan wel de voorlopige voogdij uitoefenen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel27
  - number: 27.3.b
    text: |-
      de raad voor de kinderbescherming ten behoeve van een onderzoek naar de noodzaak van een maatregel tot beperking of
      ontneming van het ouderlijk gezag of de voogdij.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel27
  - number: 27.3.c
    text: gezinsvoogdij-instellingen, ten aanzien van jeugdigen die onder hun toezicht staan.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel27
  - number: '27.4'
    text: |-
      Een erkende plaatsende instantie is bevoegd in de gevallen waarin deze wet zulks vereist, ten aanzien van een
      jeugdige die duurzaam verblijft in zijn werkgebied vast te stellen welke hulpverlening voor die jeugdige aangewezen
      is te achten.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel27
  - number: '27.5'
    text: Van erkenningen als bedoeld in dit artikel wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel27
  - number: '28'
    text: Provinciale staten stellen regels omtrent de indiening en de wijze van behandeling van verzoeken om erkenning.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel28
  - number: '29.1'
    text: 'Een plaatsende instantie:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel29
  - number: 29.1.a
    text: |-
      draagt er, met het oog op de vaststelling, bedoeld in [artikel 25, eerste lid][ref1], zorg voor dat een onderzoek
      wordt verricht naar de problemen en stoornissen van de betrokken jeugdige en stelt, met inachtneming van de eisen,
      genoemd in [artikel 23][ref2], vast welke vorm of vormen van hulpverlening in verband daarmee voor de jeugdige de
      meest aangewezene is of zijn te achten;


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel23
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '25'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '23'
        hoofdstuk: IV
  - number: 29.1.b
    text: |-
      draagt, met het oog op de toepassing van [artikel 25, tweede lid][ref1], zorg voor een evaluatie van de
      hulpverlening en stelt vast of, de omstandigheden in aanmerking genomen, voortzetting van de hulpverlening voor de
      jeugdige aangewezen is te achten;


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel25
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '25'
        hoofdstuk: IV
  - number: 29.1.c
    text: |-
      stelt telkens de termijn vast gedurende welke de hulpverlening nodig is te achten, welke termijn ten hoogste zes
      maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel29
  - number: '29.2'
    text: |-
      De jeugdige, degene die het ouderlijk gezag of de voogdij uitoefent, alsmede de daarvoor in aanmerking komende
      uitvoerder worden bij de werkzaamheden, bedoeld in het eerste lid, betrokken.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel29
  - number: '29.3'
    text: De in het eerste lid bedoelde werkzaamheden worden telkens in een rapport schriftelijk verantwoord.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel29
  - number: '30'
    text: |-
      De plaatsende instantie draagt er zorg voor dat de hulpverlening die voor de jeugdige overeenkomstig
      [artikel 29, eerste lid][ref1], aangewezen wordt geacht, wordt gerealiseerd. De hulpverlening vindt plaats in de
      regio waarin de jeugdige duurzaam verblijft, tenzij hulpverlening buiten de regio het meest aangewezen is te achten
      of in de regio geen plaats voor de jeugdige beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel29
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '29'
        hoofdstuk: IV
  - number: '31.1'
    text: |-
      Beëindiging van secundaire hulpverlening van een type, genoemd in [artikel 1, tweede lid, onder ][ref1], vindt
      plaats, indien een bevoegde plaatsende instantie heeft vastgesteld dat, de omstandigheden in aanmerking genomen,
      voortzetting van de hulpverlening voor de jeugdige niet aangewezen is. De vaststelling geschiedt op basis van een
      beschrijving van de verleende hulp, onder vermelding van de resultaten ervan. De plaatsende instantie stelt tevens
      vast of andere dan in de eerste zin bedoelde hulpverlening aangewezen is te achten en legt dit schriftelijk vast.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel1
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '1'
        hoofdstuk: I
  - number: '31.2'
    text: |-
      Een uitvoerder van een voorziening van secundaire semi-residentiële of residentiële hulpverlening of van een
      voorziening voor pleegzorg zendt vóór het verstrijken van de door de plaatsende instantie vastgestelde termijn,
      alsmede indien hij voornemens is de hulpverlening binnen die termijn te beëindigen, aan de plaatsende instantie
      door wiens tussenkomst de jeugdige is opgenomen, tijdig een beschrijving als bedoeld in de tweede zin van het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel31
  - number: '31.3'
    text: |-
      Een uitvoerder van een voorziening als bedoeld in het tweede lid beëindigt de hulpverlening niet dan nadat hij
      tot overeenstemming is gekomen met de voogdij-instelling voor zover het betreft de uitoefening van de voorlopige
      voogdij of met de gezinsvoogdij-instelling.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel31
  - number: '32'
    text: |-
      De plaatsende instantie doet aan het jeugdhulpadviesteam van de regio van zijn werkgebied en aan Onze ministers
      schriftelijk mededeling van de aanvang en beëindiging van secundaire hulpverlening van een type, genoemd in
      [artikel 1, tweede lid, onder ][ref1] Deze mededeling aan Onze ministers bevat gegevens, welke benodigd zijn voor
      de uitvoering van [hoofdstuk VII][ref2] en geschiedt onmiddellijk en door middel van een door hen vastgesteld
      formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004608#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004608
        hoofdstuk: VII
  - number: '33.1'
    text: |-
      Een plaatsende instantie stelt binnen vier maanden na afloop van een kalenderjaar een verslag op van zijn
      plaatsingsbeleid in het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel33
  - number: '33.2'
    text: |-
      Het verslag bevat een overzicht van de rapporten, bedoeld in [artikel 29, derde lid][ref1], ontdaan van tot
      personen herleidbare gegevens. Daarbij wordt aangegeven in welke gevallen de aangewezen geachte hulpverlening is
      gerealiseerd en indien zulks niet het geval is, de redenen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel29
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '29'
        hoofdstuk: IV
  - number: '33.3'
    text: |-
      Het verslag wordt zo spoedig mogelijk gezonden aan het jeugdhulpadviesteam van de regio van het werkgebied van de
      plaatsende instantie.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel33
  - number: '33.4'
    text: |-
      Indien het jeugdhulpadviesteam op grond van een verslag als bedoeld in het eerste lid van oordeel is dat het
      plaatsingsbeleid van een plaatsende instantie niet in overeenstemming is met de[ artikelen 29][ref1], [30][ref2]
      en [31][ref3] dan wel dat de plaatsende instantie anderszins handelt in strijd met deze wet, doet hij daarvan
      schriftelijk mededeling aan het desbetreffende provinciale bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0004608#Artikel31
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '29'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '30'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0004608
        artikel: '31'
        hoofdstuk: IV
  - number: '34.1'
    text: |-
      Indien een plaatsende instantie niet voldoet aan het bepaalde bij of krachtens deze wet kan de erkenning worden
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34
  - number: '34.2'
    text: Van een intrekking wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34
  - number: 34a.1
    text: |-
      Een advies- en meldpunt kindermishandeling heeft, onverminderd de taken van de raad voor de kinderbescherming, tot
      taak: '- het naar aanleiding van een melding van kindermishandeling of een vermoeden daarvan onderzoeken of sprake'
      is van kindermishandeling;
        - het beoordelen van de vraag of en zo ja tot welke stappen de melding van kindermishandeling of een vermoeden
      daarvan aanleiding geeft;
        - het initiatief nemen tot de voor de minderjarige meest aangewezen hulpverlening;
        - het, na overleg met de raad voor de kinderbescherming, aan deze overdragen van een geval van kindermishandeling
      of een ernstig vermoeden daarvan, indien een maatregel met betrekking tot het gezag over de minderjarige overwogen
      dient te worden;
        - het in kennis stellen van andere justitiële autoriteiten van kindermishandeling of een vermoeden daarvan,
      indien het belang van de minderjarige dan wel de ernst van de situatie waarop de melding betrekking heeft, daartoe
      aanleiding geeft;
        - het op de hoogte stellen van degene die een melding heeft gedaan, van de stappen die door het advies- en meldpunt
      kindermishandeling zijn ondernomen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34a
  - number: 34a.2
    text: |-
      Een advies- en meldpunt kindermishandeling heeft bovendien tot taak het verstrekken van advies aan een persoon die
      een vermoeden van kindermishandeling heeft over de stappen die door hem in verband hiermee kunnen worden ondernomen
      en het zonodig ondersteunen daarbij.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34a
  - number: 34a.3
    text: |-
      Onder kindermishandeling wordt in dit hoofdstuk verstaan: elke vorm van voor een minderjarige bedreigende of
      gewelddadige interactie van fysieke, psychische of seksuele aard, die de ouders of andere personen ten opzichte
      van wie de minderjarige in een relatie van afhankelijkheid of van onvrijheid staat, actief of passief opdringen,
      waardoor ernstige schade wordt berokkend of dreigt te worden berokkend aan de minderjarige in de vorm van fysiek of
      psychisch letsel.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34a
  - number: 34a.4
    text: |-
      Een advies- en meldpunt kindermishandeling wordt in stand gehouden door een rechtspersoon die, indien hij ook
      andere taken heeft, voor de uitoefening van de taken, genoemd in het eerste en tweede lid, een afzonderlijke
      organisatorische eenheid inricht.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34a
  - number: 34b
    text: |-
      Een advies- en meldpunt kindermishandeling werkt, onverminderd [artikel 35, eerste lid][ref1], volgens een bij
      of krachtens algemene maatregel van bestuur vastgestelde werkwijze, waarbij nadere regels kunnen worden gesteld
      omtrent de in [artikel 34a][ref2] genoemde taken. Bij of krachtens deze maatregel worden voorts regels gesteld
      omtrent de samenwerking met de raad voor de kinderbescherming, alsmede omtrent de gevallen waarin het bekendmaken
      van de identiteit van de persoon die de kindermishandeling of een vermoeden daarvan heeft gemeld of van de persoon
      van wie informatie in het kader van het onderzoek is verkregen, achterwege kan blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel34a
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34b
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '35'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004608
        artikel: 34a
        hoofdstuk: IVA
  - number: 34c.1
    text: |-
      Een advies- en meldpunt kindermishandeling kan zonder toestemming van degene die het betreft persoonsgegevens
      verwerken indien dit voor de uitoefening van de taken, genoemd in [artikel 34a, eerste lid][ref1], noodzakelijk is
      te achten.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel34a
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 34a
        hoofdstuk: IVA
  - number: 34c.2
    text: |-
      Een advies- en meldpunt kindermishandeling kan zonder toestemming van degene die het betreft slechts bijzondere
      gegevens als bedoeld in [artikel 16 van de Wet bescherming persoonsgegevens][ref1] verwerken indien uit een melding
      redelijkerwijs een vermoeden van kindermishandeling kan worden afgeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: 34c.3
    text: |-
      Degene die op grond van een wettelijk voorschrift of op grond van zijn ambt of beroep tot geheimhouding is
      verplicht kan, zonder toestemming van degene die het betreft, aan een advies- en meldpunt kindermishandeling
      inlichtingen verstrekken, indien dit noodzakelijk kan worden geacht om een situatie van kindermishandeling te
      beëindigen of een redelijk vermoeden van kindermishandeling te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34c
  - number: 34c.4
    text: |-
      Het college van burgemeester en wethouders verstrekt een advies- en meldpunt kindermishandeling
      uit de gemeentelijke basisadministratie terstond de algemene gegevens, bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________, die noodzakelijk zijn voor de vervulling van de taken van het advies- en meldpunt ingevolge
      [artikel 34a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel34a
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0004608
        artikel: 34a
        hoofdstuk: IVA
  - number: 34c.5
    text: |-
      In afwijking van
      [artikel 103, eerste en tweede lid, van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] doet het
      college van burgemeester en wethouders geen mededeling aan de betrokkene of degene die namens deze daarom verzoekt,
      over de verstrekking van hem betreffende gegevens uit de gemeentelijke basisadministratie aan een advies- en
      meldpunt kindermishandeling, voor zover dit noodzakelijk kan worden geacht om een situatie van kindermishandeling
      te beëindigen of een redelijk vermoeden van kindermishandeling te onderzoeken. Voor wat betreft de toepassing
      van [artikel 110 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref2] heeft achterwege blijven
      van een mededeling als hier bedoeld dezelfde gevolgen als het achterwege blijven van een mededeling ingevolge
      [artikel 103, derde lid, van de Wet gemeentelijke basisadministratie persoonsgegevens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel110
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel103
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34c
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '103'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '110'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '103'
  - number: 34d.1
    text: |-
      Indien persoonsgegevens worden verkregen bij een ander dan degene die het betreft brengt een advies- en meldpunt
      kindermishandeling hem hiervan zo spoedig mogelijk, doch in ieder geval binnen vier weken na het moment van
      vastlegging van de hem betreffende gegevens, op de hoogte.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34d
  - number: 34d.2
    text: |-
      De in het eerste lid genoemde termijn kan telkens met ten hoogste twee weken worden verlengd, voor zover
      dit noodzakelijk is voor de uitoefening van de taken, genoemd in [artikel 34a, eerste lid][ref1], en dit
      noodzakelijk kan worden geacht om een situatie van kindermishandeling te beëindigen of een redelijk vermoeden van
      kindermishandeling te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel34a
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 34a
        hoofdstuk: IVA
  - number: 34d.3
    text: |-
      In afwijking van [artikel 35 van de Wet bescherming persoonsgegevens][ref1] kan een advies- en meldpunt
      kindermishandeling de mededeling aan degene die het betreft dat ten aanzien van hem persoonsgegevens worden
      verwerkt achterwege laten voor zover dit noodzakelijk kan worden geacht om een situatie van kindermishandeling te
      beëindigen of een redelijk vermoeden van kindermishandeling te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel35
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34d
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '35'
  - number: 34e.1
    text: |-
      Indien het aan het bestuur van een voorziening of instelling bekend is geworden dat een persoon die werkzaam is
      bij de voorziening of de instelling zich mogelijk schuldig maakt of heeft gemaakt aan kindermishandeling, doet
      het bestuur van de desbetreffende voorziening of instelling hiervan onverwijld melding aan het advies- en meldpunt
      kindermishandeling.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34e
  - number: 34e.2
    text: |-
      Indien een persoon die werkzaam is in een voorziening of instelling op enigerlei wijze bekend is geworden dat
      een bij die voorziening of instelling werkzame andere persoon zich mogelijk schuldig maakt of heeft gemaakt aan
      kindermishandeling, stelt hij het bestuur daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel34e
  - number: '35.1'
    text: |-
      Bij algemene maatregel van bestuur worden met het oog op een goede kwaliteit van de hulpverlening ten aanzien van
      daarbij aan te geven categorieën van voorzieningen regels gesteld. De regels kunnen betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: 35.1.a
    text: het aantal beroepskrachten, hun functies en de eisen waaraan beroepskrachten en pleeggezinnen moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: 35.1.b
    text: de eisen waaraan vrijwilligers, anders dan bestuurders, moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: 35.1.c
    text: de openingstijden en de aanwezigheid van beroepskrachten en vrijwilligers gedurende de openingstijden;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: 35.1.d
    text: de groepsgrootte;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: 35.1.e
    text: de omvang en de indeling van de accommodatie, alsmede de inrichting daarvan;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: 35.1.f
    text: de inhoud en de wijze van totstandkoming van een hulpverleningsplan;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: 35.1.g
    text: de maximale verblijfsduur van jeugdigen en de maximum leeftijd van de in een voorziening verblijvende jeugdigen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: 35.1.h
    text: de vaststelling van werkplannen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: 35.1.i
    text: de samenwerking met anderen dan uitvoerders;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: 35.1.j
    text: de verzorging en opvoeding van jeugdigen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: 35.1.k
    text: het voor jeugdigen geldende regiem.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: '35.2'
    text: |-
      In de algemene maatregel van bestuur, bedoeld in het eerste lid, kunnen ten aanzien van steunfuncties regels worden
      gesteld omtrent de onderwerpen, bedoeld in het eerste lid, onder *a* en h.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel35
  - number: '36'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld, wordt verleend onder de voorwaarde, bedoeld
      in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 36a.1
    text: |-
      De subsidieverlening wordt in ieder geval geweigerd in de gevallen, bedoeld in
      [artikel 4:35 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel36a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 36a.2
    text: |-
      De subsidieverlening wordt voorts in ieder geval geweigerd indien: a. de uitvoerder of degene die een steunfunctie
      uitvoert direct of indirect winst beoogt te maken, of b. het samenwerkingsverband niet voldoet aan, danwel ten
      aanzien van de voorziening of de steunfunctie niet wordt voldaan aan het bij of krachtens de wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel36a
  - number: 36a.3
    text: |-
      De subsidie wordt slechts verleend, indien de uitvoerder een rechtspersoon is met volledige rechtsbevoegdheid en
      zijn zetel heeft in Nederland.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel36a
  - number: '37.1'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van de subsidiëring van de steunfuncties en
      de landelijke voorzieningen. In de maatregel kan worden bepaald dat Onze Ministers nadere regels kunnen stellen met
      betrekking tot daarbij aangewezen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel37
  - number: '37.2'
    text: 'De regels, bedoeld in het eerste lid, hebben in ieder geval betrekking op:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel37
  - number: 37.2.a
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel37
  - number: 37.2.b
    text: de aanvraag van een subsidie en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel37
  - number: 37.2.c
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel37
  - number: 37.2.d
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel37
  - number: 37.2.e
    text: de betaling en terugvordering en het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel37
  - number: 37.2.f
    text: |-
      de gevallen waarin subsidie zal worden verstrekt voor de bestrijding van de financiële gevolgen van een
      vermindering van de subsidie of de capaciteit dan wel de beëindiging van de subsidiëring.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel37
  - number: '38.1'
    text: |-
      Provinciale staten stellen bij verordening regels vast omtrent de subsidiëring van de regionale voorzieningen en de
      in de provincie werkzame samenwerkingsverbanden.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel38
  - number: '38.2'
    text: |-
      De verordening bevat in ieder geval regels met betrekking tot de in [artikel 37, tweede lid][ref1], genoemde
      onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel37
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '39'
    text: |-
      Een uitvoerder van een voorziening voor pleegzorg verstrekt overeenkomstig [artikel 40][ref1], aan een pleeggezin
      subsidie voor de verzorging en opvoeding van een jeugdige, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel40
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '40'
        hoofdstuk: VI
        paragraaf: '4'
  - number: 39.a
    text: |-
      de jeugdige daadwerkelijk in het pleeggezin wordt verzorgd en opgevoed op basis van een pleegcontract,
      overeenkomstig een door Onze ministers vast te stellen model;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel39
  - number: 39.b
    text: ook overigens wordt voldaan aan het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel39
  - number: '40.1'
    text: |-
      De subsidie bedraagt voor elke jeugdige een door Onze ministers vast te stellen basisbedrag, dat voor te
      onderscheiden leeftijdscategorieën verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel40
  - number: '40.2'
    text: 'Onze ministers stellen regels omtrent:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel40
  - number: 40.2.a
    text: op het basisbedrag te verlenen toelagen en de omstandigheden waaronder deze kunnen worden verleend;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel40
  - number: 40.2.b
    text: de dagen waarover de subsidie en de toelage wordt verleend;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel40
  - number: 40.2.c
    text: op het basisbedrag toe te passen kortingen in verband met het inkomen van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel40
  - number: '41'
    text: 'Voor de toepassing van dit hoofdstuk en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41
  - number: 41.a
    text: |-
      ouderbijdrage: de bijdrage, bedoeld in [artikel 41][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel41a
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 41a
        hoofdstuk: VII
  - number: 41.b
    text: |-
      eigen bijdrage: de bijdrage bedoeld in [artikel 41][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel41b
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 41b
        hoofdstuk: VII
  - number: 41a.1
    text: |-
      De onderhoudsplichtige ouders, degene tegen wie een op [artikel 394 van Boek 1 van het Burgerlijk Wetboek][ref1]
      gegronde vordering is toegewezen daaronder begrepen, de onderhoudsplichtige stiefouder en degene die anders dan als
      ouder samen met de ouder het gezag uitoefent van een jeugdige, zijn aan het Rijk een bijdrage verschuldigd in de
      kosten van verzorging en verblijf:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '394'
  - number: 41a.1.a
    text: |-
      in een op grond van deze wet voor bekostiging in aanmerking gebrachte voorziening niet zijnde een voorziening van
      ambulante hulpverlening;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41a
  - number: 41a.1.b
    text: |-
      elders dan in een zodanige voorziening, indien de jeugdige daar is geplaatst met toepassing van [artikel 261][ref1]
      of [326 van Boek 1 van het Burgerlijk Wetboek][ref2], dan wel daar is geplaatst door een voogdij-instelling of de
      raad voor de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel326
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '326'
  - number: 41a.2
    text: |-
      De ouderbijdrage wordt vastgesteld naar de leeftijd van de jeugdige en de aard van de verzorging en het verblijf,
      bedoeld in het eerste lid. Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de hoogte
      van de bijdrage.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41a
  - number: 41a.3
    text: |-
      Indien ten aanzien van een jeugdige meer dan één persoon de ouderbijdrage verschuldigd is, is ieder der
      bijdrageplichtigen de ouderbijdrage verschuldigd met dien verstande dat, indien de een heeft betaald, de ander
      is bevrijd.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41a
  - number: 41b.1
    text: |-
      Een jeugdige aan wie hulpverlening wordt geboden in een op grond van deze wet voor bekostiging in aanmerking
      gebrachte voorziening van residentiële hulpverlening, is aan de uitvoerder van de desbetreffende voorziening een
      bijdrage verschuldigd in de kosten van verzorging en verblijf.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41b
  - number: 41b.2
    text: |-
      In de gevallen, bedoeld in [artikel 41][ref1], is de jeugdige aan het Rijk een bijdrage verschuldigd in de kosten
      van verzorging en verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel41a
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41b
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 41a
        hoofdstuk: VII
  - number: 41b.3
    text: |-
      De eigen bijdrage wordt vastgesteld naar het inkomen van de jeugdige. Bij of krachtens algemene maatregel van
      bestuur worden regels gesteld omtrent het inkomen dat bij de vaststelling van de bijdrage in aanmerking wordt
      genomen en omtrent de hoogte van de bijdrage.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41b
  - number: 41c.1
    text: |-
      Geen bijdrage ingevolge dit hoofdstuk is verschuldigd indien de jeugdige voorlopige
      hechtenis ondergaat dan wel indien aan de jeugdige een straf of maatregel als bedoeld in
      [artikel 77h, eerste en vierde lid, van het Wetboek van Strafrecht][ref1] is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
  - number: 41c.2
    text: 'Geen ouderbijdrage is verschuldigd indien:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41c
  - number: 41c.2.a
    text: de jeugdige met het oog op adoptie niet meer door zijn ouders wordt verzorgd en opgevoed;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41c
  - number: 41c.2.b
    text: de ouders van het gezag over de jeugdige zijn ontheven of ontzet;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41c
  - number: 41c.2.c
    text: |-
      het verblijf en de verzorging worden geboden in een acute noodsituatie, zulks voor de duur van ten hoogste zes
      weken;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41c
  - number: 41c.2.d
    text: |-
      aan een minderjarige jeugdige nog hulpverlening als bedoeld in [artikel 41][ref1] wordt geboden na schriftelijk aan
      Onze Minister van Welzijn, Volksgezondheid en Cultuur of, indien een aanwijzing als bedoeld in [artikel 41][ref2],
      is geschied, aan de in naam van Onze Minister optredende instantie kenbaar gemaakt bezwaar door degene die het
      ouderlijk gezag of de voogdij uitoefent, tenzij het een jeugdige betreft ten aanzien van wie een maatregel van
      justitiële kinderbescherming is getroffen die tot zodanige hulpverlening strekt of haar noodzakelijk maakt;


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel41f
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 41a
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0004608
        artikel: 41f
        hoofdstuk: VII
  - number: 41c.2.e
    text: het bij algemene maatregel van bestuur aan te geven inkomen van de jeugdige € 226,89 of meer per maand bedraagt.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41c
  - number: 41c.3
    text: |-
      Geen ouderbijdrage is verschuldigd door de ouder of stiefouder ten aanzien van wie de rechter op
      de voet van de [artikelen 406][ref1] en [407 van Boek 1 van het Burgerlijk Wetboek][ref2] of van
      [artikel 822, eerste lid, onder ][ref3] een bedrag heeft bepaald dat hij periodiek moet betalen ter voorziening in
      de kosten van verzorging en opvoeding van zijn kind of stiefkind.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel406
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel407
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel822
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '406'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '407'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '822'
  - number: 41d
    text: |-
      Wonen bijdrageplichtige ouders of stiefouders gescheiden en is geen bedrag bepaald op de
      voet van de [artikelen 406][ref1] of [407 van Boek 1 van het Burgerlijk Wetboek][ref2] of van
      [artikel 822, eerste lid, onder c, van het Wetboek van Burgerlijke Rechtsvordering][ref3], dan is de ouder of
      stiefouder die ingevolge de [Algemene Kinderbijslagwet][ref4] onmiddellijk voorafgaande aan het verblijf bedoeld in
      [artikel 41a, eerste lid][ref5], recht op kinderbijslag heeft de ouderbijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel406
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel407
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel822
      [ref4]: https://wetten.overheid.nl/BWBR0002368
      [ref5]: https://wetten.overheid.nl/BWBR0004608#Artikel41a
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '406'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '407'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '822'
      - id: ref4
        bwb_id: BWBR0002368
      - id: ref5
        bwb_id: BWBR0004608
        artikel: 41a
        hoofdstuk: VII
  - number: 41f.1
    text: De ouderbijdrage wordt vastgesteld en geïnd door het Landelijk Bureau Inning Onderhoudsbijdragen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41f
  - number: 41f.2
    text: |-
      De eigen bijdrage, bedoeld in [artikel 41][ref1], wordt vastgesteld door de uitvoerder van de desbetreffende
      voorziening. Deze is tevens met de inning belast.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel41b
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41f
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 41b
        hoofdstuk: VII
  - number: 41f.3
    text: |-
      De eigen bijdrage, bedoeld in [artikel 41][ref1], wordt vastgesteld en geïnd door het Landelijk Bureau Inning
      Onderhoudsbijdragen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel41b
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41f
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 41b
        hoofdstuk: VII
  - number: 41g.1
    text: |-
      De bijdrageplichtige is verplicht aan degene die belast is met de vaststelling en de inning van de bijdrage
      desgevraagd alle inlichtingen te geven ten behoeve van de uitvoering van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41g
  - number: 41g.2
    text: |-
      De inlichtingen moeten, indien dit wordt verzocht, schriftelijk worden verstrekt binnen een door degene die belast
      is met de vaststelling en de inning van de bijdrage schriftelijk te stellen, redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41g
  - number: 41g.3
    text: |-
      De uitvoerder van een voorziening als bedoeld in [artikel 41][ref1], doet, indien een geval als bedoeld in
      [artikel 41][ref2], zich voordoet, daarvan mededeling aan degene die belast is met de vaststelling van de
      ouderbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel41b
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel41c
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41g
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 41b
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0004608
        artikel: 41c
        hoofdstuk: VII
  - number: 41h
    text: |-
      Degene die belast is met de vaststelling van de bijdrage deelt de bijdrageplichtige schriftelijk mede welke
      bijdrage is verschuldigd en binnen welke termijn het verschuldigde bedrag telkens moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41h
  - number: 41i.1
    text: |-
      Indien de bijdrage voor het geheel of voor een deel niet tijdig is betaald, kan degene die belast is met de inning,
      van een bijdrageplichtige de verschuldigde bedragen, vermeerderd met de aan de invordering verbonden kosten van
      aanmaning, betekening en executie, invorderen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41i
  - number: 41i.2
    text: |-
      Geen invordering geschiedt dan nadat de bijdrageplichtige schriftelijk is aangemaand om alsnog binnen veertien
      dagen na dagtekening van de aanmaning te betalen, onder kennisgeving dat de bijdrageplichtige anders door de
      middelen bij wet bepaald tot betaling zal worden gedwongen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41i
  - number: 41i.3
    text: |-
      Indien de bijdrageplichtige na de aanmaning in gebreke blijft, kan de invordering geschieden bij een door het
      Landelijk Bureau Inning Onderhoudsbijdragen uit te vaardigen dwangbevel, dat meebrengt het recht de roerende en
      onroerende goederen van de bijdrageplichtige zonder vonnis aan te tasten.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41i
  - number: 41i.4
    text: |-
      De betekenis van het dwangbevel geschiedt overeenkomstig de regels van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] met betrekking tot de betekening van dagvaardingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41i
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 41i.5
    text: |-
      Het dwangbevel wordt ten uitvoer gelegd overeenkomstig de regels van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] met betrekking tot de tenuitvoerlegging van vonnissen en
      authentieke akten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41i
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: 41i.6
    text: |-
      De bijdrageplichtige kan tegen de tenuitvoerlegging van een dwangbevel in verzet komen bij de rechtbank. Het verzet
      vangt aan met een dagvaarding door de bijdrageplichtige als eiser aan degene die het dwangbevel heeft uitgevaardigd
      als gedaagde. Het verzet schorst de tenuitvoerlegging van het dwangbevel voor zover deze door het verzet wordt
      bestreden. Het verzet kan niet zijn gegrond op de stelling dat de mededeling bedoeld in [artikel 41][ref1] of de
      aanmaning niet is ontvangen. Bovendien kan het verzet niet zijn gegrond op de stelling dat de bijdrage ten onrechte
      of tot een te hoog bedrag is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel41h
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41i
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 41h
        hoofdstuk: VII
  - number: 41i.7
    text: |-
      Voor de toepassing van deze wet kan degene die belast is met de inning executoriaal beslag onder derden leggen
      door van het dwangbevel in afschrift mededeling te doen aan de derde beslagene. [Artikel 479 ][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel41i
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
  - number: '42'
    text: |-
      Een uitvoerder en een plaatsende instantie verstrekken aan de jeugdige desgevraagd zo spoedig mogelijk inzage in en
      afschrift van de bescheiden die deze met betrekking tot de jeugdige onder zich hebben.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel42
  - number: 42a
    text: De bepalingen van dit hoofdstuk zijn niet van toepassing op jeugdigen die verblijven in een inrichting.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel42a
  - number: '43.1'
    text: |-
      Inzage in of afschrift van de bescheiden wordt aan de jeugdige geweigerd, indien deze: - jonger dan twaalf jaren
      is, of
        - de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke waardering van
      zijn belangen terzake.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel43
  - number: '43.2'
    text: |-
      In de gevallen, bedoeld in het eerste lid, worden desgevraagd aan de wettelijke vertegenwoordiger inlichtingen,
      dan wel inzage in of afschrift van de bescheiden verstrekt, tenzij het belang van de jeugdige daardoor kan worden
      geschaad.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel43
  - number: '43.3'
    text: |-
      Inlichtingen over, inzage in of afschrift van bescheiden kan eveneens worden geweigerd, indien de persoonlijke
      levenssfeer van een ander dan de jeugdige daardoor zou worden geschaad.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel43
  - number: '43.4'
    text: |-
      Voor de verstrekking van een afschrift kan een vergoeding worden gevraagd overeenkomstig de krachtens
      [artikel 36 van de Wet bescherming persoonsgegevens][ref1] gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel36
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '36'
  - number: '44.1'
    text: |-
      Onverminderd het bij of krachtens de wet bepaalde, verstrekken de uitvoerder en de plaatsende instantie aan anderen
      dan de jeugdige geen inlichtingen over de jeugdige, dan wel inzage in of afschrift van de bescheiden dan met
      toestemming van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel44
  - number: '44.2'
    text: |-
      Indien de jeugdige minderjarig is, is in plaats van diens toestemming de toestemming van zijn wettelijke
      vertegenwoordiger vereist, indien hij: - jonger is dan twaalf jaren, of
        - de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke waardering van
      zijn belangen terzake.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel44
  - number: '44.3'
    text: |-
      Onder anderen dan de jeugdige zijn niet begrepen degenen van wie beroepshalve de medewerking bij de hulpverlening
      noodzakelijk is en degenen die zijn betrokken bij de voorbereiding of uitvoering van een maatregel van
      kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel44
  - number: '44.4'
    text: |-
      Onder anderen dan de jeugdige zijn evenmin begrepen diens wettelijke vertegenwoordigers, indien hij de leeftijd van
      zestien jaren nog niet heeft bereikt, alsmede indien hij deze leeftijd heeft bereikt, doch niet in staat kan worden
      geacht tot een redelijke waardering van zijn belangen terzake, tenzij door het verstrekken van inlichtingen over de
      jeugdige, danwel van inzage in of afschrift van bescheiden, het belang van de jeugdige kan worden geschaad.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel44
  - number: 44a.1
    text: |-
      Onverminderd het tweede lid en [artikel 44b][ref1] bewaren een uitvoerder en een plaatsende instantie bescheiden
      die deze met betrekking tot de jeugdige onder zich hebben gedurende tien jaren, te rekenen van het tijdstip waarop
      zij zijn vervaardigd, of zoveel langer als redelijkerwijs in verband met een zorgvuldige hulpverlening noodzakelijk
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel44b
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 44b
        hoofdstuk: VIII
  - number: 44a.2
    text: |-
      Een advies- en meldpunt kindermishandeling en een instelling bewaren de bescheiden tot het jongste kind van
      het gezin waartoe de minderjarige behoort en met welk gezin het advies- en meldpunt kindermishandeling of de
      instelling bemoeienis heeft gehad, meerderjarig is geworden, een en ander voor zover aannemelijk gemaakt kan
      worden dat het bewaren van de bescheiden een bijdrage kan leveren aan het beëindigen van een mogelijke situatie van
      kindermishandeling of van belang kan zijn voor een situatie waarin een maatregel met betrekking tot het gezag over
      een minderjarige overwogen dient te worden.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel44a
  - number: 44b.1
    text: |-
      Een uitvoerder en een plaatsende instantie vernietigen de door hen bewaarde bescheiden binnen drie maanden na een
      daartoe strekkend verzoek van degene op wie de bescheiden betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel44b
  - number: 44b.2
    text: |-
      Het eerste lid geldt niet voor zover het verzoek bescheiden betreft waarvan redelijkerwijs aannemelijk is dat
      de bewaring van aanmerkelijk belang is voor een ander dan de verzoeker, alsmede voor zover het bepaalde bij of
      krachtens de wet zich tegen vernietiging verzet.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel44b
  - number: 44b.3
    text: |-
      Het verzoek van een jeugdige wordt niet ingewilligd indien deze: - jonger dan twaalf jaren, of
        - minderjarig is en de leeftijd van twaalf jaren heeft bereikt en niet in staat kan worden geacht tot een redelijke
      waardering van zijn belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel44b
  - number: 44b.4
    text: In de gevallen bedoeld in het derde lid, kan het verzoek door een wettelijke vertegenwoordiger worden gedaan.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel44b
  - number: '45.1'
    text: |-
      De uitvoerder en de plaatsende instantie treffen een schriftelijke regeling waarin het recht op inzage in en
      afschrift van gegevens, alsmede de beperkingen aan het verstrekken van inlichtingen en inzage worden geregeld
      overeenkomstig de [artikelen 42 tot en met 44b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel42
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '42'
        hoofdstuk: VIII
  - number: '45.2'
    text: Deze regeling wordt aan de belanghebbenden beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45
  - number: 45a.1
    text: |-
      Uitvoerders en voogdij- en gezinsvoogdij-instellingen stellen een cliëntenraad in, die binnen het kader van de
      doelstellingen van de voorziening of instelling de gemeenschappelijke belangen van de cliënten behartigt. De
      verplichting tot het instellen van een cliëntenraad geldt voor een uitvoerder ten aanzien van elke door hem in
      stand gehouden voorziening.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
  - number: 45a.2
    text: 'De uitvoerder en de voogdij- en gezinsvoogdij-instelling regelen schriftelijk:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
  - number: 45a.2.a
    text: |-
      het aantal leden van de cliëntenraad, de wijze van benoeming, welke personen tot lid kunnen worden benoemd en de
      zittingsduur van de leden;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
  - number: 45a.2.b
    text: |-
      de materiële middelen van de voorziening of instelling, waarover de cliëntenraad ten behoeve van zijn werkzaamheden
      kan beschikken;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
  - number: 45a.3
    text: 'De in het tweede lid bedoelde regeling is zodanig dat de cliëntenraad:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
  - number: 45a.3.a
    text: redelijkerwijze representatief kan worden geacht voor cliënten en
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
  - number: 45a.3.b
    text: redelijkerwijze in staat kan worden geacht hun gemeenschappelijke belangen te behartigen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
  - number: 45a.4
    text: |-
      In de cliëntenraad wordt voorzien in ten minste twee plaatsen voor jeugdigen, tenzij de uitvoerder of de voogdij-
      of gezinsvoogdij-instelling aantoont dat dit niet aangewezen is.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
  - number: 45a.5
    text: |-
      Onder cliënt wordt in dit hoofdstuk in ieder geval verstaan: de jeugdige, de ouder, de voogd, de stiefouder, de
      pleegouder en degene die anders dan als ouder samen met de ouder het gezag uitoefent.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
  - number: 45a.6
    text: De cliëntenraad regelt schriftelijk zijn werkwijze met inbegrip van zijn vertegenwoordiging in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
  - number: 45a.7
    text: |-
      De kosten van het voeren van rechtsgedingen door de cliëntenraad, zoals bedoeld in [artikel 45][ref1], komen
      slechts ten laste van de uitvoerder of de voogdij- en gezinsvoogdij-instelling indien deze van de te maken kosten
      vooraf in kennis is gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel45j
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 45j
        hoofdstuk: VIII_A
  - number: 45a.8
    text: |-
      Na vaststelling van de in het tweede lid bedoelde regeling treft de uitvoerder of de voogdij- en gezinsvoogdij-
      instelling de voorzieningen die op grond van die regeling noodzakelijk zijn voor de benoeming van de leden
      van de cliëntenraad. De uitvoerder en de instelling treffen de bedoelde voorzieningen opnieuw telkens wanneer
      de cliëntenraad gedurende twee jaren niet heeft gefunctioneerd wegens het ontbreken van het in de regeling
      vastgestelde aantal leden.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45a
  - number: 45b
    text: |-
      De bepalingen van dit hoofdstuk gelden niet voor de inrichtingen voor justitiële kinderbescherming, bedoeld in
      [hoofdstuk XIV][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#HoofdstukXIV
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0004608
        hoofdstuk: XIV
  - number: 45c.1
    text: |-
      De uitvoerder en de voogdij- en gezinsvoogdij-instelling stellen de cliëntenraad in ieder geval in de gelegenheid
      advies uit te brengen over elk voorgenomen besluit dat de voorziening of de instelling betreft, inzake:
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.a
    text: een wijziging van de doelstelling of de grondslag;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.b
    text: |-
      het overdragen van de zeggenschap of fusie of het aangaan of verbreken van een duurzame samenwerking met een andere
      voorziening of instelling;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.c
    text: een gehele of gedeeltelijke opheffing, verhuizing of ingrijpende verbouwing van de voorziening of de instelling;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.d
    text: een belangrijke wijziging in de organisatie;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.e
    text: een belangrijke inkrimping, uitbreiding of andere wijziging van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.f
    text: |-
      het benoemen van personen die rechtstreeks de hoogste zeggenschap zullen uitoefenen bij de leiding van arbeid in de
      voorziening of de instelling;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.g
    text: de begroting en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.h
    text: het algemeen beleid inzake de toelating van cliënten en de beëindiging van de hulpverlening aan cliënten;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.i
    text: |-
      voedingsaangelegenheden van algemene aard en het algemeen beleid op het gebied van de veiligheid, de gezondheid of
      de hygiëne en de geestelijke verzorging van en maatschappelijke bijstand aan cliënten;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.j
    text: |-
      de systematische bewaking, beheersing of verbetering van de kwaliteit met betrekking tot de aspecten
      hulpverleningsmethodieken, organisatie, professionaliteit en materiële voorzieningen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.k
    text: |-
      de vaststelling of wijziging van een regeling inzake de behandeling van klachten van cliënten en het aanwijzen van
      personen die belast worden met de behandeling van klachten van cliënten;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.l
    text: |-
      wijziging van de regeling, bedoeld in [artikel 45][ref1], en de vaststelling of wijziging van andere voor cliënten
      geldende regelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel45a
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 45a
        hoofdstuk: VIII_A
  - number: 45c.1.m
    text: recreatiemogelijkheden en ontspanningsactiviteiten voor cliënten;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.1.n
    text: |-
      wijziging van het op grond van de[ artikelen 35, eerste lid, onder ][ref1], en [60, vierde lid][ref2], door de
      uitvoerder en de voogdij- en gezinsvoogdij-instelling vastgestelde werkplan, voor zover het aangelegenheden betreft
      die niet reeds zijn begrepen in het bepaalde onder *a* tot en met*k*, *m* en *o* van dit lid;


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel60
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '35'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '60'
        hoofdstuk: XIII
  - number: 45c.1.o
    text: |-
      het belasten van personen met de leiding van een onderdeel van de voorziening, waarin gedurende het etmaal zorg
      wordt verleend aan jeugdigen die in de regel langdurig in die voorziening verblijven.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.2
    text: Het advies wordt op een zodanig tijdstip gevraagd, dat het van wezenlijke invloed kan zijn op het te nemen besluit.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45c.3
    text: |-
      De cliëntenraad is bevoegd de uitvoerder of de voogdij- en gezinsvoogdij-instelling ook ongevraagd te adviseren
      inzake de in het eerste lid genoemde en andere onderwerpen, die voor de cliënten van belang zijn.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45c
  - number: 45d.1
    text: |-
      De uitvoerder en de voogdij- en gezinsvoogdij-instelling nemen geen van een schriftelijk door de cliëntenraad
      uitgebracht advies afwijkend besluit dan nadat daarover, voor zover dat redelijkerwijs mogelijk is, ten minste
      eenmaal met de cliëntenraad overleg is gepleegd.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45d
  - number: 45d.2
    text: |-
      De uitvoerder en de voogdij- en gezinsvoogdij-instelling doen van een besluit inzake een onderwerp waarover de
      cliëntenraad schriftelijk advies heeft uitgebracht, schriftelijk, en voor zover zij van het advies afwijken onder
      opgave van redenen, mededeling aan de cliëntenraad.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45d
  - number: 45e.1
    text: |-
      De uitvoerder en de voogdij- en gezinsvoogdij-instelling verstrekken de cliëntenraad tijdig en, desgevraagd,
      schriftelijk alle inlichtingen en gegevens die deze voor de vervulling van zijn taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45e
  - number: 45e.2
    text: |-
      De uitvoerder en de voogdij- en gezinsvoogdij-instelling verstrekken de cliëntenraad voorts ten minste eenmaal per
      jaar mondeling of schriftelijk algemene gegevens omtrent het beleid dat in het verstreken tijdvak is gevoerd en in
      het komende jaar zal worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45e
  - number: 45f.1
    text: |-
      De uitvoerder en de voogdij- en gezinsvoogdij-instelling kunnen aan de cliëntenraad schriftelijk verdergaande
      bevoegdheden dan de in dit hoofdstuk genoemde toekennen. Een zodanig besluit wordt schriftelijk aan de cliëntenraad
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45f
  - number: 45f.2
    text: |-
      De uitvoerder en de voogdij- en gezinsvoogdij-instelling stellen de cliëntenraad in de gelegenheid advies uit te
      brengen over een voornemen een besluit te nemen als bedoeld in het eerste lid en over het voornemen een zodanig
      besluit te wijzigen. [Artikel 45][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel45d
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45f
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 45d
        hoofdstuk: VIII_A
  - number: 45g.1
    text: |-
      Indien de voorziening of de voogdij- of gezinsvoogdij-instelling een rechtspersoon is als bedoeld in
      [artikel 3 van Boek 2 van het Burgerlijk Wetboek][ref1], voorzien de statuten in een regeling die waarborgt dat de
      cliënten invloed kunnen uitoefenen op de samenstelling van het bestuur. De bedoelde regeling houdt ten minste in
      dat één bestuurslid wordt benoemd op bindende voordracht van de cliëntenraad of cliëntenraden, tenzij deze van de
      mogelijkheid een voordracht te doen, geen gebruik heeft onderscheidenlijk hebben gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel3
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45g
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '3'
  - number: 45g.2
    text: |-
      Het eerste lid is niet van toepassing indien het bestuur van een voorziening of een voogdij- en gezinsvoogdij-
      instelling bestaat uit één of meer personen die deze functie uitoefent of uitoefenen op grond van een
      arbeidsrelatie waaraan een geldelijke beloning is verbonden. In dat geval is het eerste lid van overeenkomstige
      toepassing op de samenstelling van het orgaan dat is belast met het toezicht op of goedkeuring van besluiten van
      het bestuur.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45g
  - number: 45h
    text: |-
      De uitvoerder en de voogdij- en gezinsvoogdij-instelling stellen jaarlijks een schriftelijk verslag op over de
      wijze waarop door hen dit hoofdstuk is toegepast.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45h
  - number: 45i.1
    text: 'De uitvoerder en de voogdij- en gezinsvoogdij-instelling maken binnen tien dagen na de vaststelling openbaar:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45i
  - number: 45i.1.a
    text: het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45i
  - number: 45i.1.b
    text: |-
      op schrift gestelde uitgangspunten voor het beleid, waaronder begrepen de algemene criteria, welke bij de
      hulpverlening worden gehanteerd;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45i
  - number: 45i.1.c
    text: |-
      de notulen dan wel de besluitenlijst van de vergaderingen van het bestuur, voor zover deze algemene beleidszaken
      betreffen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45i
  - number: 45i.1.d
    text: |-
      een regeling inzake de behandeling van klachten van cliënten en andere voor cliënten geldende regelingen, alsmede
      een regeling als bedoeld in [artikel 45][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel45a
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45i
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 45a
        hoofdstuk: VIII_A
  - number: 45i.1.e
    text: |-
      het verslag, bedoeld in [artikel 45][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel45h
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45i
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 45h
        hoofdstuk: VIII_A
  - number: 45i.2
    text: |-
      De openbaarmaking geschiedt door de stukken voor cliënten ter inzage te leggen en hun op verzoek daarvan
      afschriften te verstrekken.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45i
  - number: 45i.3
    text: |-
      Van de terinzagelegging wordt mededeling gedaan op de in de voorziening of de instelling voor het doen van
      mededelingen aan cliënten gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45i
  - number: 45i.4
    text: |-
      Voor het op verzoek verstrekken van afschriften kan een tarief in rekening worden gebracht, ten hoogste gelijk aan
      de kostprijs, tenzij ten aanzien van de instelling de [Wet openbaarheid van bestuur][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45i
    references:
      - id: ref1
        bwb_id: BWBR0005252
  - number: 45j.1
    text: |-
      De uitvoerder en de voogdij- en gezinsvoogdij-instelling stellen in overeenstemming met de cliëntenraad of
      cliëntenraden een uit drie leden bestaande commissie van vertrouwenslieden in, waarvan een lid door hen wordt
      aangewezen, een lid door de cliëntenraad of cliëntenraden kan worden aangewezen en een lid door de beide andere
      leden wordt aangewezen, of wijzen een door een of meer cliëntenorganisaties en een of meer organisaties van
      voorzieningen of voogdij- en gezinsvoogdij-instellingen ingestelde commissie van vertrouwenslieden aan, die
      tot taak heeft te bemiddelen en zonodig een bindende uitspraak te doen op verzoek van de cliëntenraad, indien
      de uitvoerder of de instelling ten aanzien van een onderwerp, genoemd in [artikel 45][ref1], waarover door de
      cliëntenraad een schriftelijk advies is uitgebracht, een van dat advies afwijkend besluit wenst te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel45c
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45j
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 45c
        hoofdstuk: VIII_A
  - number: 45j.2
    text: |-
      De cliëntenraad en iedere cliënt van de voorziening of de voogdij- en gezinsvoogdij-instelling kan de kantonrechter
      van de rechtbank van het arrondissement waarin de woonplaats van de uitvoerder of de instelling is gelegen
      schriftelijk verzoeken de uitvoerder of de instelling te bevelen de[ artikelen 45][ref1], [45][ref2], [45][ref3],
      en [45][ref4] en het eerste lid van dit artikel na te leven. Een verzoeker die niet vooraf schriftelijk aan de
      uitvoerder of de instelling heeft verzocht te handelen overeenkomstig hetgeen in het verzoekschrift is verzocht
      en deze daarbij niet een redelijke termijn heeft gegeven om aan dat verzoek te voldoen, wordt niet-ontvankelijk
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel45e
      [ref3]: https://wetten.overheid.nl/BWBR0004608#Artikel45g
      [ref4]: https://wetten.overheid.nl/BWBR0004608#Artikel45h
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45j
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 45a
        hoofdstuk: VIII_A
      - id: ref2
        bwb_id: BWBR0004608
        artikel: 45e
        hoofdstuk: VIII_A
      - id: ref3
        bwb_id: BWBR0004608
        artikel: 45g
        hoofdstuk: VIII_A
      - id: ref4
        bwb_id: BWBR0004608
        artikel: 45h
        hoofdstuk: VIII_A
  - number: 45j.3
    text: |-
      De kantonrechter kan in zijn beschikking aan de uitvoerder of de voogdij- en gezinsvoogdij-instelling de
      verplichting opleggen bepaalde handelingen te verrichten of na te laten.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45j
  - number: 45j.4
    text: |-
      De bepalingen van de [derde afdeling van de vijfde titel van het tweede boek van het Wetboek van Burgerlijke
      Rechtsvordering](onbekend) zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel45j
  - number: '46'
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel46
  - number: 46.a
    text: |-
      klager: degene die als zodanig is aangewezen in de regeling bedoeld in [artikel 48 eerste lid][ref1], doch in ieder
      geval de jeugdige, diens ouders, voogd, stiefouder, pleegouders en degenen die anders dan als ouder samen met de
      ouder het gezag uitoefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel48
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '48'
        hoofdstuk: IX
  - number: 46.b
    text: |-
      gedraging: enig handelen of nalaten alsmede het nemen van een besluit dat gevolgen heeft voor een jeugdige, diens
      ouders, voogd, stiefouder, pleegouders of degenen die anders dan als ouder samen met de ouder het gezag uitoefenen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel46
  - number: '47'
    text: De bepalingen van dit hoofdstuk gelden niet voor de behandeling van klachten betrekking hebbende op een inrichting.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel47
  - number: '48.1'
    text: |-
      Uitvoerders en instellingen treffen een regeling voor de behandeling van klachten over gedragingen van hen of van
      voor hen werkzame personen jegens jeugdigen alsmede jegens hun ouders, voogden, stiefouders, pleegouders of degenen
      die anders dan als ouder samen met de ouder het gezag uitoefenen. Zij brengen de getroffen regeling op passende
      wijze onder de aandacht van in ieder geval de in [artikel 46, eerste lid, onder ][ref1], bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel46
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '46'
        hoofdstuk: IX
  - number: '48.2'
    text: 'De in het eerste lid bedoelde regeling:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
  - number: 48.2.a
    text: |-
      voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit tenminste drie leden,
      waaronder een voorzitter die niet werkzaam is voor of bij de uitvoerder of de instelling;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
  - number: 48.2.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
  - number: 48.2.c
    text: |-
      waarborgt dat de klachtencommissie binnen zes weken na ontvangst van de klacht de klager, degene over wie
      is geklaagd en, indien dit niet dezelfde persoon is, de uitvoerder of de instelling, schriftelijk en met
      redenen omkleed in kennis stelt van haar oordeel over de gegrondheid van de klacht, al dan niet vergezeld van
      aanbevelingen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
  - number: 48.2.d
    text: |-
      waarborgt dat bij afwijking van de onder *c* bedoelde termijn de klachtencommissie daarvan met redenen omkleed
      mededeling doet aan de klager, degene over wie is geklaagd en, indien dit niet dezelfde persoon is, de uitvoerder
      of de instelling, onder vermelding van de termijn waarbinnen de klachtencommissie haar oordeel over de klacht zal
      uitbrengen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
  - number: 48.2.e
    text: |-
      waarborgt dat de klager en degene over wie is geklaagd, door de klachtencommissie in de gelegenheid worden gesteld
      mondeling of schriftelijk een toelichting te geven op de gedraging waarover is geklaagd;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
  - number: 48.2.f
    text: |-
      waarborgt dat de klager en degene over wie is geklaagd, zich bij de behandeling van de klacht kunnen laten
      bijstaan.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
  - number: '48.3'
    text: |-
      De uitvoerder en de instelling zien erop toe dat de klachtencommissie, bedoeld in het tweede lid, onder *a*, haar
      werkzaamheden verricht volgens een door deze commissie op te stellen reglement.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
  - number: '48.4'
    text: |-
      Door of namens een klager kan bij de klachtencommissie, bedoeld in het tweede lid, onder *a*, een klacht tegen
      een uitvoerder of instelling worden ingediend over een gedraging van hen of van voor hen werkzame personen jegens
      de klager.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
  - number: '48.5'
    text: |-
      De uitvoerder of instelling deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onder *a*,
      binnen vier weken na ontvangst van het in het tweede lid, onder *c*, bedoelde oordeel van de klachtencommissie
      schriftelijk mede of hij het oordeel van de commissie over de gegrondheid van de klacht deelt en of hij naar
      aanleiding van dat oordeel maatregelen zal nemen en zo ja welke. Bij afwijking van de in de eerste volzin
      bedoelde termijn, doet de uitvoerder of de instelling daarvan met redenen omkleed mededeling aan de klager en de
      klachtencommissie onder vermelding van de termijn waarbinnen de uitvoerder of instelling zijn standpunt aan hen
      kenbaar zal maken, met dien verstande dat dit uitstel ten hoogste vier weken is.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
  - number: '48.6'
    text: |-
      In afwijking van het vierde lid, kan bij de klachtencommissie, bedoeld in het tweede lid, onder *a*, eveneens een
      klacht tegen een uitvoerder, een instelling worden ingediend over een gedraging van hen of van voor hen werkzame
      personen, jegens een persoon, als bedoeld in [artikel 46, onder ][ref1], die inmiddels is overleden.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel46
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '46'
        hoofdstuk: IX
  - number: '48.7'
    text: |-
      De uitvoerder en de instelling dragen er zorg voor dat over elk kalenderjaar een openbaar verslag wordt
      opgesteld, waarin het aantal en de aard van de door de klachtencommissie behandelde klachten worden aangegeven. De
      uitvoerder en de instelling zenden het verslag voor 1 april van het daaropvolgende kalenderjaar aan de Inspectie
      jeugdhulpverlening en jeugdbescherming.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel48
  - number: '49.1'
    text: |-
      Er is voor elke provincie en voor de samenwerkingsgebieden die ingevolge [artikel 4, tweede lid][ref1], van
      deze wet worden gelijkgesteld met een provincie, een provinciale klachtencommissie, belast met de behandeling
      van de in [artikel 50][ref2] bedoelde klachten tegen uitvoerders en instellingen die in de betrokken provincie
      onderscheidenlijk samenwerkingsgebieden zijn gevestigd. De provinciale klachtencommissies voor de provincies
      waarin de samenwerkingsgebieden die worden gelijkgesteld met een provincie zijn gelegen, zijn niet bevoegd
      klachten in behandeling te nemen met betrekking tot een voorziening of instelling die is gevestigd in een dergelijk
      samenwerkingsgebied.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel50
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '4'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '50'
        hoofdstuk: IX
  - number: '49.2'
    text: |-
      De voorzitter en de overige leden van de provinciale klachtencommissies worden door gedeputeerde staten van de
      betrokken provincie onderscheidenlijk de in de gemeenschappelijke regeling van de betrokken samenwerkingsgebieden
      daartoe aangewezen bestuursorganen benoemd. De bij de in [artikel 51, eerste lid][ref1], bedoelde verordening
      aangewezen organisaties die zich in het bijzonder de behartiging van de belangen van de in [artikel 46][ref2]
      genoemde personen hebben aangetrokken en de organisaties van voorzieningen en instellingen, beide gezamenlijk, zijn
      bevoegd elk voor een derde deel van het vastgestelde aantal leden van de provinciale klachtencommissie personen als
      kandidaat voor benoeming aan te bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel46
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '51'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '46'
        hoofdstuk: IX
  - number: '50'
    text: |-
      Door of namens een klager die op grond van [artikel 48, vierde lid][ref1], een klacht heeft ingediend kan bij de
      bevoegde provinciale klachtencommissie een klacht worden ingediend over:


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel48
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '48'
        hoofdstuk: IX
  - number: 50.a
    text: |-
      de inhoud van de mededeling, bedoeld in [artikel 48, vijfde lid][ref1], of het ontbreken van de mededeling;


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel48
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '48'
        hoofdstuk: IX
  - number: 50.b
    text: |-
      het bij de behandeling van een klacht handelen in strijd met de klachtenregeling, bedoeld in [artikel 48][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel48
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '48'
        hoofdstuk: IX
  - number: '51.1'
    text: |-
      Bij verordening worden regels gesteld betreffende de werkwijze van de provinciale klachtencommissie, waaronder
      de voorziening in een secretariaat en de vergoeding van de kosten, alsmede betreffende het aanhangig maken van
      klachten.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel51
  - number: '51.2'
    text: |-
      De provinciale klachtencommissie doet na de behandeling van een klacht schriftelijk aan de klager en de betrokken
      uitvoerder of instelling mededeling van haar oordeel over de gegrondheid van de klacht, al dan niet vergezeld van
      aanbevelingen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel51
  - number: '51.3'
    text: |-
      De uitvoerder of instelling deelt de klager en de provinciale klachtencommissie zo spoedig mogelijk na ontvangst
      van het in het tweede lid bedoelde oordeel schriftelijk mede of en zo ja welke maatregelen naar aanleiding van dat
      oordeel zullen worden genomen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel51
  - number: '51.4'
    text: |-
      De provinciale klachtencommissie kan na gehele of ten dele gegrondbevinding van een klacht, indien naar haar
      oordeel niet binnen een redelijke termijn een mededeling als bedoeld in het derde lid is gedaan of indien de
      mededeling daartoe aanleiding geeft, haar oordeel over de klacht met de ontvangen mededeling, met uitzondering voor
      zover mogelijk van de gegevens omtrent de persoon van de klager, openbaar maken.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel51
  - number: '51.5'
    text: |-
      De provinciale klachtencommissie stelt jaarlijks een openbaar verslag op, waarin het aantal en de aard van de door
      haar behandelde klachten, de categorieën van instanties waarop de klachten betrekking hadden, alsmede de resultaten
      van de klachtenbehandeling worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel51
  - number: '52.1'
    text: |-
      Iedere klager, alsmede de voor een voorziening of instelling ingestelde cliëntenraad kan de kantonrechter van de
      rechtbank van het arrondissement waar de uitvoerder of de instelling is gevestigd, schriftelijk verzoeken deze te
      bevelen het bepaalde in [artikel 48, eerste lid][ref1], na te leven.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel48
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '48'
        hoofdstuk: IX
  - number: '52.2'
    text: |-
      Een verzoeker die niet vooraf schriftelijk aan de uitvoerder of de instelling heeft verzocht te handelen
      overeenkomstig hetgeen in het verzoekschrift is verzocht en deze daarbij niet een redelijke termijn heeft gegeven
      om aan dat verzoek te voldoen, wordt niet-ontvankelijk verklaard.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel52
  - number: '52.3'
    text: |-
      De kantonrechter kan in zijn beschikking aan de uitvoerder of de instelling de verplichting opleggen bepaalde
      handelingen te verrichten of na te laten.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel52
  - number: '52.4'
    text: |-
      De bepalingen van de derde afdeling van de vijfde titel van het [tweede boek van het Wetboek van Burgerlijke
      Rechtsvordering](onbekend) zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel52
  - number: '53.1'
    text: |-
      Onze ministers kunnen aan een uitvoerder of plaatsende instantie subsidie verstrekken in de kosten van uitvoering
      van een experiment voor een daarbij aan te geven periode van ten hoogste vier jaren.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel53
  - number: '53.2'
    text: |-
      De[ artikelen 36][ref1], [36][ref2] en [37][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel36a
      [ref3]: https://wetten.overheid.nl/BWBR0004608#Artikel37
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '36'
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0004608
        artikel: 36a
        hoofdstuk: VI
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0004608
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '53.3'
    text: |-
      Bij de algemene maatregel van bestuur of de ministeriële regeling, bedoeld in [artikel 37, eerste lid][ref1], kan
      worden voorzien in de vaststelling van subsidieplafonds voor het verstrekken van subsidies bedoeld in het eerste
      lid en in de regeling van de wijze van verdeling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel37
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '54.1'
    text: 'Er is een Inspectie jeugdhulpverlening en jeugdbescherming die tot taak heeft:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel54
  - number: 54.1.a
    text: |-
      het verrichten van onderzoeken naar de kwaliteit in algemene zin van de jeugdhulpverlening en de jeugdbescherming
      alsmede, waar nodig, het aangeven en bevorderen van middelen tot verbetering daarvan;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel54
  - number: 54.1.b
    text: |-
      het toezicht op de naleving van het bepaalde bij of krachtens de wet omtrent de kwaliteit van de jeugdhulpverlening
      en de jeugdbescherming.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel54
  - number: '54.2'
    text: |-
      Met de taken, bedoeld in het eerste lid, onder *a* en *b*, zijn belast de ambtenaren van de Inspectie
      jeugdhulpverlening en jeugdbescherming.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel54
  - number: '54.3'
    text: |-
      De toezichthouders beschikken niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2]. De [artikelen 5:12][ref3], [5:13][ref4], [5:15][ref5],
      [5:16][ref6], [5:17][ref7] en [5:20 van de Algemene wet bestuursrecht][ref8] zijn van overeenkomstige toepassing
      ten aanzien van de ambtenaren, belast met de taak, bedoeld in het eerste lid, onder *a*.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref8
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '54.4'
    text: |-
      De ambtenaren van de Inspectie jeugdhulpverlening en jeugdbescherming nemen bij de vervulling van hun taak de
      aanwijzingen van Onze Ministers, en indien het betreft instellingen of inrichtingen de aanwijzingen van Onze
      Minister van Justitie, in acht.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel54
  - number: '54.5'
    text: |-
      De inspectie verricht onderzoeken uit eigen beweging of op verzoek van Onze Minister van Justitie indien het
      instellingen of inrichtingen betreft, en van Onze Ministers indien het andere voorzieningen, plaatsende instanties,
      samenwerkingsverbanden of experimenten betreft. De inspectie kan onderzoeken verrichten op verzoek van een
      provinciaal bestuur, indien het een regionale voorziening, samenwerkingsverband of erkende plaatsende instantie
      betreft.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel54
  - number: '54.6'
    text: |-
      De inspectie brengt van haar bevindingen verslag uit aan degene bij wie het onderzoek is uitgevoerd en doet daarbij
      voorstellen tot verbetering van de kwaliteit van de werkzaamheden. De inspectie stelt het overheidsorgaan dat
      verantwoordelijk is voor het beleid ten aanzien van degene bij wie het onderzoek is uitgevoerd op de hoogte van
      haar bevindingen, indien zulks voor dat overheidsorgaan van belang is.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel54
  - number: '54.7'
    text: |-
      De inspectie stelt jaarlijks een verslag op van haar werkzaamheden. In het verslag doet zij voorstellen die zij
      in het belang van de jeugdhulpverlening en de jeugdbescherming nodig acht. Het verslag wordt toegezonden aan Onze
      ministers, de provinciale besturen en de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel54
  - number: '54.8'
    text: Onze ministers kunnen regels stellen omtrent de organisatie van de inspectie.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel54
  - number: '55.1'
    text: |-
      Uitvoerders, instellingen, rechtspersonen die een steunfunctie verzorgen, samenwerkingsverbanden en plaatsende
      instanties verstrekken desgevraagd alle inlichtingen en leggen desgevraagd alle bescheiden die voor een juiste
      uitoefening van hun taak noodzakelijk zijn te achten over aan:
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel55
  - number: 55.1.a
    text: |-
      de door Onze Ministers aan te wijzen ambtenaren, belast met de controle op de rechtmatige en doelmatige besteding
      van door Onze Ministers verleende subsidies;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel55
  - number: 55.1.b
    text: |-
      de door gedeputeerde staten of door het bestuur van het samenwerkingsgebied dat ingevolge
      [artikel 4, tweede lid][ref1], gelijkgesteld is met een provincie, aangewezen ambtenaren, belast met de controle op
      de rechtmatige en doelmatige besteding van door gedeputeerde staten of door het bestuur van het samenwerkingsgebied
      verleende subsidies.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel4
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '4'
        hoofdstuk: I
  - number: '55.2'
    text: |-
      Uitvoerders, instellingen, rechtspersonen die een steunfunctie verzorgen, samenwerkingsverbanden en plaatsende
      instanties verlenen de in het eerste lid bedoelde ambtenaren desgevraagd toegang tot de gebouwen waarin zij hun
      werkzaamheden verrichten.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel55
  - number: '55.3'
    text: |-
      Zij die uit hoofde van hun stand, beroep of ambt tot geheimhouding verplicht zijn, kunnen zich van het geven van
      inlichtingen of verlenen van inzage van bescheiden verschonen, voor zover hun geheimhoudingsplicht zich daartoe
      uitstrekt.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel55
  - number: '56.1'
    text: |-
      Tot het aan Onze ministers verstrekken van gegevens die nodig zijn voor een goede uitvoering van deze wet, zijn,
      voor zover zij betrokken zijn bij de uitvoering van deze wet, verplicht:
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: 56.1.a
    text: |-
      uitvoerders, met uitzondering van uitvoerders die een inrichting in stand houden, en rechtspersonen die een
      steunfunctie verzorgen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: 56.1.b
    text: samenwerkingsverbanden;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: 56.1.c
    text: plaatsende instanties.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: '56.2'
    text: |-
      Eenzelfde verplichting geldt ten aanzien van Onze Minister van Justitie voor instellingen en uitvoerders van
      inrichtingen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: '56.3'
    text: 'Bij algemene maatregel van bestuur worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: 56.3.a
    text: de doeleinden waarvoor gegevens worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: 56.3.b
    text: de aard van de gegevens die worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: 56.3.c
    text: de instanties die voor een goede uitvoering van de wet de beschikking over verstrekte gegevens krijgen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: 56.3.d
    text: de tijdvakken waarop de gegevens betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: 56.3.e
    text: de termijnen waarbinnen de gegevens worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: '56.4'
    text: |-
      De gegevens worden alleen in een zodanige vorm opgevraagd en verstrekt dat zij niet tot individuele jeugdigen
      herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: '56.5'
    text: Onze ministers stellen regelen vast omtrent het beheer van de verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: '56.6'
    text: |-
      Onze ministers kunnen regelen vaststellen over de wijze waarop en de vorm waarin gegevens worden verstrekt, alsmede
      over de wijze waarop de verstrekte gegevens worden verwerkt. Tevens kunnen Onze ministers organen aanwijzen waar de
      verwerking plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: '56.7'
    text: |-
      Met betrekking tot instellingen en inrichtingen worden de in het vijfde en zesde lid bedoelde regelen en de in het
      zesde lid bedoelde aanwijzing vastgesteld door Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: '56.8'
    text: |-
      De in het vijfde en zesde lid bedoelde regelen worden vastgesteld in overeenstemming met Onze minister wie het
      mede aangaat.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel56
  - number: '60.1'
    text: |-
      Onze Minister van Justitie aanvaardt, indien naar zijn oordeel aan diens activiteiten behoefte bestaat, een
      rechtspersoon als instelling die:
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel60
  - number: 60.1.a
    text: |-
      als voogdij-instelling op grond van [artikel 302 van Boek 1 van het Burgerlijk Wetboek][ref1] voogdij alsmede de
      maatregel van voorlopige voogdij kan uitoefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '302'
  - number: 60.1.b
    text: |-
      als gezinsvoogdij-instelling kan worden aangewezen op grond van
      [artikel 254 van Boek 1 van het Burgerlijk Wetboek][ref1], aan patroons leiding en bijstand kan verlenen, en hulp
      en steun kan verlenen aan voorwaardelijk veroordeelde, in vrijheid gestelde of ontslagen minderjarigen, alsmede
      nazorg biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
  - number: '60.2'
    text: 'Een rechtspersoon komt slechts voor aanvaarding in aanmerking, indien hij:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel60
  - number: 60.2.a
    text: volledige rechtsbevoegdheid bezit, zijn zetel heeft in Nederland en direct noch indirect beoogt winst te maken;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel60
  - number: 60.2.b
    text: zich blijkens zijn statuten ten doel stelt de in het eerste lid, onder *a* of *b*, bedoelde taken te vervullen;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel60
  - number: 60.2.c
    text: 'aannemelijk heeft gemaakt dat hij:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel60
  - number: 60.2.c.1°
    text: |-
      een zodanige werkwijze zal toepassen dat redelijkerwijze mag worden verwacht dat de beoogde doelen kunnen worden
      bereikt;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel60
  - number: 60.2.c.2°
    text: zal voldoen aan het bij of krachtens de wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel60
  - number: '60.3'
    text: |-
      Een op grond van het eerste lid aanvaarde rechtspersoon neemt op gelijke voet als een uitvoerder deel aan het
      samenwerkingsverband. [Hoofdstuk VIII][ref1] is ten aanzien van deze rechtspersoon van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004608
        hoofdstuk: VIII
  - number: '60.4'
    text: |-
      Een rechtspersoon, die op grond van het eerste lid is aanvaard, voldoet aan bij algemene maatregel van bestuur
      te stellen regels, omtrent de onderwerpen, bedoeld in [artikel 35][ref1]. In die maatregel worden nadere regels
      gesteld omtrent de taken van voogdij- en gezinsvoogdij-instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel35
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '35'
        hoofdstuk: V
  - number: '61.1'
    text: |-
      Onze Minister van Justitie verstrekt aan een instelling een subsidie in de kosten van de uitoefening van zijn
      taak, bijzondere door Onze Minister van Justitie aan te geven kosten daaronder begrepen. Onze Minister kan tevens
      subsidie verstrekken voor bijzondere projecten en doeleinden.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel61
  - number: '61.2'
    text: |-
      Tot de kosten, bedoeld in het eerste lid, worden niet gerekend de kosten, verbonden aan hulpverlening in een
      voorziening behorende tot een categorie, genoemd in de bij deze wet behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel61
  - number: '61.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent het verstrekken van subsidie als bedoeld in het
      eerste lid. De regels kunnen betrekking hebben op de onderwerpen, genoemd in [artikel 37, tweede lid][ref1]. Voorts
      kan in de maatregel worden voorzien in de vaststelling van een subsidieplafond voor het verstrekken van subsidies
      voor bijzondere projecten en doeleinden en in de regeling van de wijze van verdeling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel37
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 61a
    text: Een voogdij-instelling zorgt voor de minderjarige ten aanzien van wie zij met de voorlopige voogdij is belast.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel61a
  - number: '62'
    text: 'Onze Minister van Justitie kan regels of nadere regels stellen ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel62
  - number: 62.a
    text: de indiening van en de beslissing op een verzoek om aanvaarding;
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel62
  - number: 62.b
    text: |-
      de onderwerpen, genoemd in [artikel 37, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel37
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '2'
  - number: '64'
    text: |-
      Indien een instelling niet meer voldoet aan het bij of krachtens de wet bepaalde, dan wel indien aan haar
      activiteiten naar het oordeel van Onze Minister van Justitie geen behoefte meer bestaat, kan Onze Minister van
      Justitie de aanvaarding intrekken.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel64
  - number: '65.1'
    text: |-
      Onze Minister van Justitie subsidieert of houdt in stand landelijke voorzieningen van residentiële
      hulpverlening bestemd voor de tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende maatregelen
      als bedoeld in de [artikelen 77h van het Wetboek van Strafrecht][ref1] alsmede de [artikelen 261][ref2] en
      [305, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref3], met inachtneming van het plan, bedoeld in
      [artikel 8][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel305
      [ref4]: https://wetten.overheid.nl/BWBR0004608#Artikel8
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '261'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '305'
      - id: ref4
        bwb_id: BWBR0004608
        artikel: '8'
        hoofdstuk: II
        paragraaf: '1'
  - number: '65.2'
    text: De inrichtingen worden onderscheiden in rijksinrichtingen en particuliere inrichtingen.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel65
  - number: '66.1'
    text: |-
      Particuliere inrichtingen zijn in Nederland gevestigde rechtspersonen met volledige
      rechtsbevoegdheid tot wier doelstelling opvang en behandeling van jeugdigen als bedoeld in
      [artikel 1, onderdeel f, van de Beginselenwet justitiële jeugdinrichtingen][ref1] behoren en die daartoe door Onze
      Minister van Justitie zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '66.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de aanwijzing
      als particuliere inrichting en de daaraan te verbinden voorwaarden. [Artikel 61, derde lid][ref1], en
      [artikel 62, aanhef en onderdeel b][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel62
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '61'
        hoofdstuk: XIII
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '62'
        hoofdstuk: XIII
  - number: '66.3'
    text: |-
      Het beheer van een particuliere inrichting berust bij de directeur, die door het bestuur benoemd wordt. De
      directeur van een particuliere inrichting wijst met machtiging van het bestuur een of meer personen als zijn
      vervanger aan.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel66
  - number: '67.1'
    text: |-
      Rijksinrichtingen worden door Onze Minister van Justitie aangewezen. Het opperbeheer van de rijksinrichtingen
      berust bij Onze Minister van Justitie. Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld
      betreffende de uitvoering hiervan.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel67
  - number: '67.2'
    text: |-
      Het beheer van een rijksinrichting berust bij de directeur, die als zodanig door Onze Minister van Justitie wordt
      aangewezen. Onze Minister van Justitie wijst een of meer personen aan als vervanger van de directeur.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel67
  - number: '67.3'
    text: |-
      Onze Minister van Justitie kan aan het hoofd van de Dienst Justitiële Inrichtingen van het ministerie van Justitie
      mandaat verlenen inzake de uitvoering van het opperbeheer, bedoeld in het eerste lid, alsmede betreffende de hem
      bij of krachtens wet toegekende overige bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel67
  - number: '68'
    text: |-
      Bij algemene maatregel van bestuur worden met het oog op een goede kwaliteit van de voorzieningen, bedoeld in
      [artikel 65][ref1], regelen gesteld, welke voor de onderscheiden categorieën van voorzieningen verschillend kunnen
      zijn. De regelen kunnen betrekking hebben op de onderwerpen, bedoeld in [artikel 35, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel35
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '65'
        hoofdstuk: XIV
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '35'
        hoofdstuk: V
  - number: '69'
    text: |-
      Bij of krachtens de wet worden regels gesteld ten aanzien van de tenuitvoerlegging van vrijheidsstraffen en
      vrijheidsbenemende maatregelen als bedoeld in [artikel 77h van het Wetboek van Strafrecht][ref1] alsmede de
      [artikelen 261][ref2] en [305, derde lid, van Boek 1 van het Burgerlijk Wetboek][ref3] in inrichtingen en de
      rechtspositie van degene die daarin zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77h
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel305
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77h
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '261'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '305'
  - number: '87'
    text: |-
      Een erkenning als Riagg op grond van de [Algemene Wet Bijzondere Ziektekosten][ref1] wordt bij een met redenen
      omkleed besluit ingetrokken indien wordt gehandeld in strijd met deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '88.1'
    text: De Beginselenwet voor de kinderbescherming (*Stb.* 1961, 403) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel88
  - number: '88.2'
    text: |-
      Hetgeen door de Kroon of door Onze Minister van Justitie ter uitvoering van [artikel 2][ref1] respectievelijk 26*g*
      en 26*k* van de Beginselenwet voor de kinderbescherming is verricht, wordt geacht te zijn verricht op grond van
      [Hoofdstuk XVI][ref2] respectievelijk [artikel 76][ref3] en [80][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004608#HoofdstukXVI
      [ref3]: https://wetten.overheid.nl/BWBR0004608#Artikel76
      [ref4]: https://wetten.overheid.nl/BWBR0004608#Artikel80
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004608
        hoofdstuk: XVI
      - id: ref3
        bwb_id: BWBR0004608
        artikel: '76'
        hoofdstuk: XIV
      - id: ref4
        bwb_id: BWBR0004608
        artikel: '80'
        hoofdstuk: XIV
  - number: '92.1'
    text: 'Deze wet treedt in werking met ingang van 1 juli 1989, met dien verstande dat:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel92
  - number: 92.1.a
    text: |-
      het eerste jaar van het plan, bedoeld in [artikel 58][ref1], 1990 is;


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel58
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '58'
        hoofdstuk: XII
  - number: 92.1.b
    text: |-
      zolang de algemene maatregelen van bestuur, bedoeld in de[ artikelen 35][ref1] en [37][ref2], niet in werking zijn
      getreden, doch uiterlijk tot 1 januari 1990, ten aanzien van de desbetreffende voorzieningen de bekostigings- en
      kwaliteitsregelen alsmede de regelen met betrekking tot de voorwaarden voor hulpverlening en de bijdragen in de
      kosten van hulpverlening die op 30 juni 1989 gelden, van kracht blijven;


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel37
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '35'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '37'
        hoofdstuk: VI
        paragraaf: '2'
  - number: 92.1.c
    text: |-
      zolang de algemene maatregelen van bestuur, bedoeld in de[ artikelen 60][ref1], [61][ref2] en [66][ref3], niet
      in werking zijn getreden, doch uiterlijk tot 1 januari 1990, ten aanzien van de desbetreffende instellingen de
      bekostigings- en kwaliteitsregelen die op 30 juni 1989 gelden, van kracht blijven;


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel61
      [ref3]: https://wetten.overheid.nl/BWBR0004608#Artikel66
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '60'
        hoofdstuk: XIII
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '61'
        hoofdstuk: XIII
      - id: ref3
        bwb_id: BWBR0004608
        artikel: '66'
        hoofdstuk: XIV
  - number: 92.1.d
    text: |-
      zolang de algemene maatregelen van bestuur, bedoeld in de[ artikelen 77](onbekend) en [77][ref1] niet tot stand
      zijn gekomen, doch uiterlijk tot 1 januari 1990, de op 30 juni 1989 geldende regelen omtrent de uitvoering van
      de maatregelen van terbeschikkingstelling van de regering, van plaatsing in een inrichting voor buitengewone
      behandeling en omtrent de straffen van arrest en plaatsing in een tuchtschool van kracht blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77ff
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77ff
  - number: '92.2'
    text: |-
      [Artikel 87][ref1] werkt terug tot en met 1 januari 1990.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel87a
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: 87a
        hoofdstuk: XVI
  - number: '93'
    text: Deze wet kan worden aangehaald als Wet op de jeugdhulpverlening.
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel93
