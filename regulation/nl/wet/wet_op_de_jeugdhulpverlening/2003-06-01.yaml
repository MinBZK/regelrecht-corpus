preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is de totstandkoming te bevorderen van een samenhangend
    aanbod van jeugdhulpverlening van goede kwaliteit en afgestemd op de behoefte en daartoe een uniforme regeling
    te treffen inzake de planning en begrotingsfinanciering van voorzieningen van jeugdhulpverlening en de daarop
    betrekking hebbende steunfuncties, de bevoegdheden van de onderscheiden overheden terzake te regelen, alsmede de
    Beginselenwet voor de kinderbescherming in te trekken en enige andere wetten te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop rustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004608/2003-06-01#Artikel1
  - number: 1.1.a
    text: 'Onze ministers: Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van Justitie;'
