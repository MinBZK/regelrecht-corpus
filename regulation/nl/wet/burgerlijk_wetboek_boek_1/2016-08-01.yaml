  - number: '407'
    text: |-
      Gelijktijdig met een door de rechtbank te geven uitspraak betreffende het over de kinderen uit te oefenen gezag
      na ontbinding van het huwelijk na scheiding van tafel en bed kan de rechtbank op verzoek van een ouder het bedrag
      wijzigen van een, in verband met de voorafgegane gezagsvoorziening, bepaalde periodieke uitkering tot voorziening
      in de kosten van verzorging en opvoeding.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel407
  - number: '408.1'
    text: |-
      Een uitkering tot voorziening in de kosten van verzorging en opvoeding of tot voorziening in de kosten van
      levensonderhoud en studie, waarvan het bedrag in een rechterlijke beslissing, daaronder begrepen de beslissing
      op grond van [artikel 822, eerste lid, onder c, van het Wetboek van Burgerlijke Rechtsvordering][ref1], is
      vastgelegd, wordt ten behoeve van de minderjarige aan de ouder die het kind verzorgt en opvoedt of aan de voogd
      onderscheidenlijk aan de meerderjarige betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel822
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '822'
  - number: '408.2'
    text: |-
      Op verzoek van een gerechtigde als bedoeld in het eerste lid, van een onderhoudsplichtige dan wel op gezamenlijk
      verzoek van een gerechtigde en onderhoudsplichtige neemt het Landelijk Bureau Inning Onderhoudsbijdragen de
      invordering van de onderhoudsgelden op zich. De executoriale titel wordt daartoe door de onderhoudsgerechtigde in
      handen gesteld van dit Bureau. De overhandiging daarvan machtigt het Bureau tot het doen van de invordering, zo
      nodig door middel van executie.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
  - number: '408.3'
    text: |-
      Kosten van invordering door het Landelijk Bureau Inning Onderhoudsbijdragen worden verhaald op de
      onderhoudsplichtige, onverminderd de kosten van gerechtelijke vervolging en executie. Het verhaal van kosten vindt
      plaats door wijziging van het bedrag, bedoeld in het eerste lid, volgens bij algemene maatregel van bestuur te
      stellen regels.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
  - number: '408.4'
    text: |-
      Tot invordering op verzoek van een onderhoudsgerechtigde wordt slechts overgegaan, indien de gerechtigde ter
      gelegenheid van de indiening van het verzoek aannemelijk heeft gemaakt dat binnen ten hoogste zes maanden
      voorafgaande aan de indiening van het verzoek de onderhoudsplichtige ten aanzien van ten minste één periodieke
      betaling tekort is geschoten in zijn verplichtingen. In deze gevallen geschiedt de invordering van bedragen die
      verschuldigd zijn vanaf een tijdstip van ten hoogste zes maanden voorafgaande aan de indiening van het verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
  - number: '408.5'
    text: |-
      Alvorens tot invordering met verhaal van kosten over te gaan wordt de onderhoudsplichtige bij brief met bericht
      van ontvangst in kennis gesteld van het voornemen daartoe en de reden daarvoor, alsmede van het bedrag inclusief de
      kosten van invordering. Het Landelijk Bureau Inning Onderhoudsbijdragen wordt bevoegd tot invordering over te gaan
      op de veertiende dag na de verzending van de brief.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
  - number: '408.6'
    text: |-
      De invordering die op verzoek van de onderhoudsgerechtigde geschiedt, eindigt slechts, indien gedurende ten
      minste een half jaar regelmatig is betaald aan het Landelijk Bureau Inning Onderhoudsbijdragen en er geen
      bedragen meer verschuldigd zijn als bedoeld in het vierde lid, tweede volzin. De termijn van een half jaar wordt
      telkens verdubbeld, indien een voorgaande termijn van invordering ook op verzoek van de onderhoudsgerechtigde was
      aangevangen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
  - number: '408.7'
    text: |-
      Een invordering die geldt op het tijdstip van het meerderjarig worden van het kind, wordt ten behoeve van de
      meerderjarige voortgezet, tenzij deze op zijn verzoek wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
  - number: '408.8'
    text: |-
      De tenuitvoerlegging van een executoriale titel betreffende de betaling van de kosten van verzorging en opvoeding
      of levensonderhoud en studie geschiedt met inachtneming van de wijziging, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
  - number: '408.9'
    text: |-
      Invorderingen die tien jaren nadat de minderjarige de leeftijd van een en twintig jaren heeft bereikt, nog
      niet door het Landelijk Bureau Inning Onderhoudsbijdragen zijn verwezenlijkt, mogen worden beëindigd. De
      onderhoudsgerechtigde wordt hiervan schriftelijk op de hoogte gesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
  - number: '408.10'
    text: |-
      Een betaling door de onderhoudsplichtige strekt in de eerste plaats in mindering van de kosten, bedoeld in het
      derde lid, vervolgens in mindering van eventueel verschenen rente en ten slotte in mindering van de verschuldigde
      onderhoudsgelden en de eventueel lopende rente.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
  - number: '408.11'
    text: |-
      Het Landelijk Bureau Inning Onderhoudsbijdragen draagt zorg, dat de gelden die ten behoeve van het onderhoud van
      minderjarigen worden uitgekeerd, aan de daarop rechthebbenden worden uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
  - number: '408.12'
    text: |-
      [Artikel 243, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel243
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '243'
        afdeling: '3'
  - number: '408.13'
    text: |-
      Met uitzondering van de leden 1, 7 en 11, is dit artikel van overeenkomstige toepassing op de ten behoeve van
      een echtgenoot of geregistreerd partner bij rechterlijke uitspraak vastgestelde uitkering tot levensonderhoud,
      daaronder begrepen de beschikking inzake een voorlopige voorziening betreffende een uitkering tot levensonderhoud,
      met dien verstande dat invorderingen die tien jaar na de indiening van het verzoek om invordering nog niet zijn
      verwezenlijkt door het Landelijk Bureau Inning Onderhoudsbijdragen, mogen worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel408
  - number: '409.1'
    text: |-
      Indien iemand die zijn woonplaats heeft verlaten niet voldoende orde op het bestuur van zijn goederen heeft
      gesteld, en er noodzakelijkheid bestaat om daarin geheel of gedeeltelijk te voorzien of de afwezige te doen
      vertegenwoordigen, benoemt de kantonrechter, op verzoek van belanghebbenden of het openbaar ministerie, een
      bewindvoerder, ten einde het bewind over het geheel of een gedeelte van de goederen van de afwezige te voeren en
      diens overige belangen waar te nemen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel409
  - number: '409.2'
    text: |-
      Voor de toepassing van deze afdeling wordt met iemand die zijn woonplaats heeft verlaten, gelijk gesteld hij wiens
      bestaan onzeker is geworden of die onbereikbaar is, ook al staat niet vast dat hij zijn woonplaats heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel409
  - number: '410.1'
    text: |-
      Voor zover de kantonrechter niet anders bepaalt, vinden op het bewind van de bewindvoerder de
      [artikelen 338][ref1], [339][ref2],[340][ref3], [342-357][ref4], [358 lid 1][ref5] en [359-363][ref6] van dit boek
      overeenkomstige toepassing, met dien verstande dat de bewindvoerder verplicht is jaarlijks bij de griffie van de
      rechtbank, een rekening in te dienen van zijn bewind.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel338
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel339
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel340
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel342
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel358
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel359
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel410
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '338'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '340'
        paragraaf: '10'
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '342'
        paragraaf: '10'
        afdeling: '6'
