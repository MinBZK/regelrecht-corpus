articles:
  - number: '1.1'
    text: Allen die zich in Nederland bevinden, zijn vrij en bevoegd tot het genot van de burgerlijke rechten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel1
  - number: '1.2'
    text: Persoonlijke dienstbaarheden, van welke aard of onder welke benaming ook, worden niet geduld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel1
  - number: '2'
    text: |-
      Het kind waarvan een vrouw zwanger is wordt als reeds geboren aangemerkt, zo dikwijls zijn belang dit vordert. Komt
      het dood ter wereld, dan wordt het geacht nooit te hebben bestaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel2
  - number: '3.1'
    text: |-
      De graad van bloedverwantschap wordt bepaald door het getal der geboorten, die de bloedverwantschap hebben
      veroorzaakt. Hierbij telt een erkenning, een gerechtelijke vaststelling van het ouderschap of een adoptie als een
      geboorte.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel3
  - number: '3.2'
    text: |-
      Door huwelijk of door geregistreerd partnerschap ontstaat tussen de ene echtgenoot dan wel de ene geregistreerde
      partner en een bloedverwant van de andere echtgenoot dan wel de andere geregistreerde partner aanverwantschap
      in dezelfde graad als er bloedverwantschap bestaat tussen de andere echtgenoot dan wel de andere geregistreerde
      partner en diens bloedverwant.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel3
  - number: '3.3'
    text: Door het eindigen van het huwelijk of geregistreerd partnerschap wordt de aanverwantschap niet opgeheven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel3
  - number: '4.1'
    text: Een ieder heeft de voornamen die hem in zijn geboorteakte zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel4
  - number: '4.2'
    text: |-
      De ambtenaar van de burgerlijke stand weigert in de geboorteakte voornamen op te nemen die ongepast zijn, of
      overeenstemmen met bestaande geslachtsnamen tenzij deze tevens gebruikelijke voornamen zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel4
  - number: '4.3'
    text: |-
      Geeft de aangever geen voornamen op, of worden deze alle geweigerd zonder dat de aangever ze door een of meer
      andere vervangt, dan geeft de ambtenaar ambtshalve het kind een of meer voornamen, en vermeldt hij uitdrukkelijk in
      de akte dat die voornamen ambtshalve zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel4
  - number: '4.4'
    text: |-
      Wijziging van de voornamen kan op verzoek van de betrokken persoon of zijn wettelijke vertegenwoordiger worden
      gelast door de rechtbank. De wijziging geschiedt doordat van de beschikking een latere vermelding aan de akte
      van geboorte wordt toegevoegd, overeenkomstig [artikel 20a, eerste lid][ref1]. In geval van wijziging van de
      voornamen van een buiten Nederland geboren persoon geeft de rechtbank die de beschikking geeft, voor zoveel nodig
      ambtshalve hetzij een last tot inschrijving van de akte van geboorte dan wel van de akte of de uitspraak, bedoeld
      in [artikel 25g, eerste lid][ref2], hetzij de in [artikel 25c][ref3] bedoelde beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel25g
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 20a
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 25g
        afdeling: '10'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 25c
        afdeling: '10'
  - number: '5.1'
    text: |-
      Indien een kind alleen in familierechtelijke betrekking tot de moeder staat, heeft het haar geslachtsnaam. Indien
      een kind door adoptie alleen in familierechtelijke betrekking tot de vader staat, heeft het zijn geslachtsnaam.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
  - number: '5.2'
    text: |-
      Indien een kind door erkenning in familierechtelijke betrekking tot de vader komt te staan, houdt het de
      geslachtsnaam van de moeder, tenzij de moeder en de erkenner ter gelegenheid van de erkenning gezamenlijk
      verklaren dat het kind de geslachtsnaam van de vader zal hebben. Van deze verklaring wordt melding gemaakt in de
      akte van erkenning. De eerste twee volzinnen zijn van overeenkomstige toepassing bij erkenning van een ongeboren
      kind. De ouders kunnen evenwel ter gelegenheid van de voltrekking van hun huwelijk of van de registratie van hun
      partnerschap alsnog gezamenlijk verklaren, dat hun kind voortaan de geslachtsnaam van de andere ouder zal hebben.
      Van deze verklaring wordt een akte van naamskeuze opgemaakt. Indien een kind door gerechtelijke vaststelling
      van het vaderschap in familierechtelijke betrekking tot de vader komt te staan, houdt het de geslachtsnaam van
      de moeder, tenzij de moeder en de man, wiens vaderschap is vastgesteld, ter gelegenheid van de vaststelling
      gezamenlijk verklaren dat het kind de geslachtsnaam van de vader zal hebben. De rechterlijke uitspraak inzake de
      vaststelling van het vaderschap vermeldt de verklaring van de ouders hieromtrent.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
  - number: '5.3'
    text: |-
      Indien een kind door adoptie in familierechtelijke betrekking komt te staan tot beide adoptanten van verschillend
      geslacht, die met elkaar zijn gehuwd, heeft het kind de geslachtsnaam van de vader, tenzij de adoptanten ter
      gelegenheid van de adoptie gezamenlijk verklaren dat het kind de geslachtsnaam van de moeder zal hebben. Indien
      de adoptanten niet met elkaar gehuwd zijn of indien beide adoptanten van hetzelfde geslacht zijn en met elkaar
      gehuwd zijn, houdt het kind de geslachtsnaam die het heeft, tenzij de adoptanten ter gelegenheid van de adoptie
      gezamenlijk verklaren dat het een van hun beider geslachtsnamen zal hebben. Indien een kind door adoptie in
      familierechtelijke betrekking tot de echtgenoot, geregistreerde partner of andere levensgezel van een ouder komt
      te staan, houdt het zijn geslachtsnaam, tenzij de ouder en diens echtgenoot, geregistreerde partner of andere
      levensgezel gezamenlijk verklaren dat het kind de geslachtsnaam zal hebben van de echtgenoot, geregistreerde
      partner of andere levensgezel, dan wel de geslachtsnaam van die ouder. De rechterlijke uitspraak inzake de adoptie
      vermeldt de verklaring van de adoptanten hieromtrent.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
  - number: '5.4'
    text: |-
      Indien een kind door geboorte in familierechtelijke betrekking tot beide ouders komt te staan, verklaren de ouders
      gezamenlijk voor of ter gelegenheid van de aangifte van de geboorte welke van hun beider geslachtsnamen het kind
      zal hebben. Van de verklaring van de ouders die voor de aangifte van de geboorte wordt afgelegd, wordt een akte
      van naamskeuze opgemaakt. Van de verklaring van de ouders die ter gelegenheid van de aangifte van de geboorte
      wordt afgelegd, wordt melding gemaakt in de akte van geboorte. De eerste drie volzinnen zijn van overeenkomstige
      toepassing indien een ouder en zijn echtgenoot of geregistreerde partner die niet de ouder is, van rechtswege
      gezamenlijk het gezag als bedoeld in [artikel 253sa][ref1] over het kind zullen uitoefenen of uitoefenen. De
      verklaring die niet ter gelegenheid van de aangifte van de geboorte wordt afgelegd, kan ten overstaan van iedere
      ambtenaar van de burgerlijke stand worden afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
        paragraaf: '1'
        afdeling: 3A
  - number: '5.5'
    text: |-
      Wordt een verklaring houdende naamskeuze, bedoeld in het vierde lid, voor of ter gelegenheid van de aangifte van de
      geboorte afgelegd, dan heeft het kind de gekozen naam vanaf de geboorte. Geschiedt de naamskeuze niet uiterlijk ter
      gelegenheid van de aangifte van de geboorte, dan neemt de ambtenaar van de burgerlijke stand als geslachtsnaam van
      het kind in de geboorteakte op:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
  - number: 5.5.a
    text: |-
      de geslachtsnaam van de vader in geval het kind door geboorte in familierechtelijke betrekking tot beide ouders
      komt te staan;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
  - number: 5.5.b
    text: |-
      de geslachtsnaam van de moeder in geval een ouder en zijn echtgenoot of geregistreerde partner die niet de ouder
      is, van rechtswege gezamenlijk het gezag als bedoeld in [artikel 253sa][ref1] over het kind uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
        paragraaf: '1'
        afdeling: 3A
  - number: '5.6'
    text: |-
      Indien de moeder na de geboorte van het kind op grond van [artikel 199, onderdeel b][ref1], het vaderschap
      van de overleden echtgenoot of geregistreerde partner ontkent of op grond van [artikel 198, tweede lid][ref2],
      het moederschap van de overleden echtgenote of geregistreerde parnter ontkent en zij ten tijde van de geboorte
      en van de ontkenning is hertrouwd of een nieuw partnerschap heeft laten registreren, kunnen de moeder en haar
      echtgenoot of geregistreerde partner gezamenlijk ter gelegenheid van de ontkenning verklaren welke van hun beider
      geslachtsnamen het kind zal hebben. Van de verklaring van de ouders wordt een akte van naamskeuze opgemaakt. Bij
      gebreke van een verklaring heeft het kind de geslachtsnaam van de echtgenoot of geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel199
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel198
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '199'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '198'
        afdeling: '1'
  - number: '5.7'
    text: |-
      Indien een kind op het tijdstip van het ontstaan van de familierechtelijke betrekking met beide ouders zestien
      jaar of ouder is, verklaart het zelf ten overstaan van de ambtenaar van de burgerlijke stand of van de notaris
      of, in geval van adoptie of gerechtelijke vaststelling van het vaderschap, ten overstaan van de rechter of het de
      geslachtsnaam van de ene of de andere ouder zal hebben. Van deze verklaring wordt melding gemaakt in de akte van
      erkenning of in de rechterlijke uitspraak inzake adoptie of gerechtelijke vaststelling van het vaderschap.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
  - number: '5.8'
    text: |-
      Een verklaring van de ouders als bedoeld in het tweede, derde, vierde of zesde lid, kan slechts ten aanzien van de
      geslachtsnaam van hun eerste kind worden afgelegd. De eerste volzin is van overeenkomstige toepassing ten aanzien
      van het eerste kind over wie de ouder en zijn echtgenoot of geregistreerde partner die niet de ouder is, van
      rechtswege gezamenlijk het gezag als bedoeld in [artikel 253sa][ref1] zullen uitoefenen of uitoefenen. Onverminderd
      het zevende lid, hebben volgende kinderen van dezelfde ouders dan wel kinderen over wie dezelfde ouder en dezelfde
      echtgenoot of geregistreerde partner die niet de ouder is, van rechtswege het gezag gezamenlijk zullen uitoefenen,
      dezelfde geslachtsnaam als het eerste kind, met dien verstande dat in het geval dat volgende kinderen blijkens de
      geboorteakte of krachtens toepasselijk recht een naam hebben die afwijkt van de naam van het eerste kind, de ouders
      kunnen verklaren dat het desbetreffende kind dezelfde geslachtsnaam zal hebben als het eerste kind. Indien voor de
      geboorte of ter gelegenheid van de aangifte naamskeuze is gedaan ten aanzien van een kind dat levenloos ter wereld
      komt of is gekomen, wordt deze keuze opgenomen in de akte, bedoeld in [artikel 19i, eerste lid][ref2], en geldt zij
      alleen ten aanzien van dit kind.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel19i
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 19i
        afdeling: '4'
  - number: '5.9'
    text: |-
      Is één van de ouders voorafgaand aan het tijdstip waarop de naamskeuze uiterlijk moet zijn gedaan overleden en is
      de naamskeuze niet gedaan, dan legt de andere ouder een verklaring omtrent de naamskeuze af. Hetzelfde geldt indien
      één van de ouders wegens diens lichamelijke of geestelijke toestand onder curatele staat dan wel indien ten aanzien
      van hem of haar een mentorschap bestaat.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
  - number: '5.10'
    text: |-
      Zijn de vader en moeder onbekend, dan neemt de ambtenaar van de burgerlijke stand in de geboorteakte een voorlopige
      voornaam en geslachtsnaam op, in afwachting van het koninklijk besluit waarbij de voornamen en de geslachtsnaam van
      het kind worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
  - number: '5.11'
    text: |-
      Indien op grond van het tweede tot en met negende lid een kind, wiens vader van adel is, niet zijn geslachtsnaam
      verkrijgt, gaat de adeldom niet over op dat kind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
  - number: '5.12'
    text: |-
      De geslachtsnaam van kinderen geboren uit een huwelijk met een lid van het koninklijk huis wordt bij koninklijk
      besluit bepaald.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
  - number: '5.13'
    text: |-
      In het tweede, vijfde en zesde lid wordt onder «moeder» verstaan de vrouw uit wie het kind is geboren. In deze
      leden wordt met «de vader» van het kind en zijn «vaderschap» gelijkgesteld de moeder die niet de vrouw is uit wie
      het kind is geboren onderscheidenlijk haar moederschap.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel5
  - number: '6'
    text: De geslachtsnaam wordt ten aanzien van een ieder dwingend bewezen door de akte van geboorte.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel6
  - number: '7.1'
    text: |-
      De geslachtsnaam van een persoon kan op zijn verzoek, of op verzoek van zijn wettelijke vertegenwoordiger, door de
      Koning worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel7
  - number: '7.2'
    text: |-
      Hij wiens geslachtsnaam of voornamen niet bekend zijn, kan de Koning verzoeken voor hem een geslachtsnaam of
      voornamen vast te stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel7
  - number: '7.3'
    text: |-
      Een wijziging of vaststelling van de geslachtsnaam door de Koning heeft geen invloed op de geslachtsnaam van de
      kinderen van de betrokken persoon die voor de datum van het besluit meerderjarig zijn geworden of die niet onder
      zijn gezag staan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel7
  - number: '7.4'
    text: |-
      Een wijziging of vaststelling van de geslachtsnaam door de Koning blijft in stand niettegenstaande een latere
      erkenning of een gerechtelijke vaststelling van het ouderschap.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel7
  - number: '7.5'
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld betreffende de gronden waarop de geslachtsnaamswijziging
      kan worden verleend, de wijze van indiening en behandeling van verzoeken als in het eerste en het tweede lid
      bedoeld en betreffende het voor wijziging van de geslachtsnaam verschuldigde recht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel7
  - number: '7.6'
    text: |-
      Indien Onze Minister van Justitie voornemens is een voordracht te doen voor een koninklijk besluit strekkende tot
      inwilliging van een verzoek als bedoeld in het eerste of tweede lid, deelt hij dit voornemen schriftelijk mee aan
      de verzoeker en degene wiens geslachtsnaam is verzocht, alsmede, indien het verzoek op de geslachtsnaam van een
      minderjarige betrekking heeft, zijn ouders en degene aan wie de minderjarige de geslachtsnaam, waarvan wijziging is
      verzocht, rechtstreeks ontleent. De schriftelijke mededeling van het voornemen geldt als een beschikking.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel7
  - number: '7.7'
    text: Onze Minister van Justitie doet de schriftelijke mededeling van het voornemen binnen twintig weken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel7
  - number: '8'
    text: |-
      Hij die de naam van een ander zonder diens toestemming voert, handelt jegens die persoon onrechtmatig, wanneer hij
      daardoor de schijn wekt die ander te zijn of tot diens geslacht of gezin te behoren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel8
  - number: '9.1'
    text: |-
      Een vrouw die gehuwd is of die gehuwd is geweest dan wel wier partnerschap geregistreerd is of is geweest en die
      niet is getrouwd na beëindiging van de registratie of is hertrouwd dan wel niet een geregistreerd partnerschap
      is aangegaan na beëindiging van het huwelijk of opnieuw is aangegaan, is steeds bevoegd de geslachtsnaam van haar
      echtgenoot of van haar geregistreerde partner te voeren of aan de hare te doen voorafgaan dan wel die te doen
      volgen op haar eigen geslachtsnaam.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel9
  - number: '9.2'
    text: |-
      Indien het huwelijk door echtscheiding is ontbonden en daaruit geen afstammelingen in leven zijn dan wel indien
      het geregistreerd partnerschap op de wijze bedoeld in [artikel 80c, onder c of d][ref1], is beëindigd, kan
      de rechtbank, wanneer daartoe gegronde redenen bestaan, op verzoek van de gewezen echtgenoot of de gewezen
      geregistreerde partner aan de vrouw de haar in het eerste lid toegekende bevoegdheid ontnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
  - number: '9.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van de man die gehuwd is of gehuwd is
      geweest dan wel wiens partnerschap geregistreerd is of is geweest en die niet is getrouwd na beëindiging van
      de registratie of is hertrouwd dan wel niet een geregistreerd partnerschap is aangegaan na beëindiging van het
      huwelijk of opnieuw is aangegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel9
  - number: '10.1'
    text: |-
      De woonplaats van een natuurlijk persoon bevindt zich te zijner woonstede, en bij gebreke van woonstede ter plaatse
      van zijn werkelijk verblijf.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel10
  - number: '10.2'
    text: |-
      Een rechtspersoon heeft zijn woonplaats ter plaatse waar hij volgens wettelijk voorschrift of volgens zijn statuten
      of reglementen zijn zetel heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel10
  - number: '11.1'
    text: Een natuurlijk persoon verliest zijn woonstede door daden, waaruit zijn wil blijkt om haar prijs te geven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel11
  - number: '11.2'
    text: |-
      Een natuurlijk persoon wordt vermoed zijn woonstede te hebben verplaatst, wanneer hij daarvan op de wettelijk
      voorgeschreven wijze aan de betrokken colleges van burgemeester en wethouders heeft kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel11
  - number: '12.1'
    text: |-
      Een minderjarige volgt de woonplaats van hem die het gezag over hem uitoefent, de onder curatele gestelde die van
      zijn curator. Oefenen beide ouders tezamen het gezag over hun minderjarige kind uit, doch hebben zij niet dezelfde
      woonplaats, dan volgt het kind de woonplaats van de ouder bij wie het feitelijk verblijft dan wel laatstelijk heeft
      verbleven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel12
  - number: '12.2'
    text: |-
      Wanneer iemands goederen onder bewind staan, volgt hij voor alles wat de uitoefening van dit bewind betreft, de
      woonplaats van de bewindvoerder.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel12
  - number: '12.3'
    text: |-
      Wanneer ten behoeve van een persoon een mentorschap is ingesteld, volgt hij voor alles wat de uitoefening van dit
      mentorschap betreft, de woonplaats van de mentor.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel12
  - number: '12.4'
    text: |-
      Het eerste, tweede en derde lid zijn niet van toepassing voor zover het betreft de relatieve bevoegdheid van de
      rechter gedurende een curatele, een bewind als bedoeld in [titel 19][ref1] en een mentorschap. Hetzelfde geldt
      indien ten aanzien van een persoon een curatele, een mentorschap of een bewind als bedoeld in [titel 19][ref2]
      en tevens een bewind als bedoeld in [afdeling 7 van titel 5 van Boek 4][ref3] of een bewind als bedoeld in
      [artikel 182 van Boek 7][ref4] van kracht zijn en de bevoegde kantonrechter de andere kantonrechter als uitsluitend
      bevoegde heeft aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Afdeling7
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel182
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002761
        afdeling: '7'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '182'
  - number: '12.5'
    text: |-
      Wanneer de persoon, van wie de woonplaats wordt afgeleid, overlijdt of zijn gezag of zijn hoedanigheid verliest,
      duurt de afgeleide woonplaats voort, totdat een nieuwe woonplaats is verkregen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel12
  - number: '13'
    text: Het sterfhuis van een overledene is daar, waar hij zijn laatste woonplaats heeft gehad.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel13
  - number: '14'
    text: |-
      Een persoon die een kantoor of een filiaal houdt, heeft ten aanzien van aangelegenheden die dit kantoor of dit
      filiaal betreffen mede aldaar woonplaats.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel14
  - number: '15'
    text: |-
      Een persoon kan een andere woonplaats dan zijn werkelijke slechts kiezen, wanneer de wet hem daartoe
      verplicht, of wanneer de keuze bij schriftelijk of langs elektronische weg aangegane overeenkomst voor
      een of meer bepaalde rechtshandelingen of rechtsbetrekkingen geschiedt en voor de gekozen woonplaats een
      redelijk belang aanwezig is. Indien de keuze bij langs elektronische weg aangegane overeenkomst geschiedt, is
      [artikel 227a lid 1 van Boek 6][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel227a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 227a
  - number: '16.1'
    text: |-
      In elke gemeente zijn twee, of, naar goedvinden van burgemeester en wethouders, meer ambtenaren van de burgerlijke
      stand. Daarenboven kunnen een of meer ambtenaren van de burgerlijke stand worden belast met het verrichten van
      bepaalde taken. Deze dragen de titel van buitengewoon ambtenaar van de burgerlijke stand. Een ambtenaar van de
      burgerlijke stand, die niet voldoet aan het in het tweede lid bedoelde benoembaarheidsvereiste, wordt niet in
      aanmerking genomen voor de berekening van het in de eerste zin genoemde aantal.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel16
  - number: '16.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren worden door burgemeester en wethouders benoemd, geschorst of ontslagen.
      Een benoeming kan voor een bepaalde tijdsduur geschieden. Als ambtenaar of buitengewoon ambtenaar van de
      burgerlijke stand is slechts benoembaar de persoon die in de uitoefening van zijn ambt geen onderscheid maakt als
      bedoeld in [artikel 1 van de Algemene wet gelijke behandeling][ref1], tenzij het onderscheid is gebaseerd op een
      wettelijk voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '1'
  - number: '16.3'
    text: |-
      Ambtenaar van de burgerlijke stand van een gemeente kan slechts zijn een ambtenaar in dienst van die gemeente of
      een andere gemeente. Buitengewoon ambtenaar van de burgerlijke stand kan mede zijn een persoon die geen ambtenaar
      in gemeentelijke dienst is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel16
  - number: '16.4'
    text: |-
      De ambtenaar of buitengewoon ambtenaar van de burgerlijke stand wordt tot zijn betrekking niet toegelaten dan na
      voor de rechtbank tot wier rechtsgebied de gemeente behoort waar hij voor het eerst wordt benoemd de navolgende
      eed dan wel belofte te hebben afgelegd: "Ik zweer (beloof) dat ik de betrekking van ambtenaar van de burgerlijke
      stand met eerlijkheid en nauwkeurigheid zal vervullen en dat ik de wettelijke voorschriften, de burgerlijke stand
      betreffende, met de meeste nauwgezetheid zal opvolgen; dat ik voorts, tot het verkrijgen van mijn aanstelling,
      middellijk noch onmiddellijk, onder enige naam of voorwendsel, aan iemand iets heb gegeven of beloofd, en dat ik,
      om iets in deze betrekking te doen of te laten, van niemand enige beloften of geschenken zal aannemen, middellijk
      of onmiddellijk. Zo waarlijk helpe mij God almachtig". ("Dat verklaar en beloof ik").
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel16
  - number: '16.5'
    text: |-
      Wanneer de eed dan wel belofte, bedoeld in het vierde lid, in de Friese taal wordt afgelegd, luidt de tekst van
      de eed dan wel belofte als volgt: «Ik swar (ûnthjit) dat ik de funksje fan amtner fan de boargerlike stân mei
      earlikheid en soarchfâldichheid útoefenje sil en dat ik de wetlike foarskriften oangeande de boargerlike stân op
      ’en sekuersten neikomme sil; dat ik fierders, foar it krijen fan myn oanstelling, streekrjocht noch midlik, ûnder
      hokker namme of útwynsel dan ek, oan immen eat jûn of tasein haw, en dat ik, om eat yn dizze funksje te dwaan of te
      litten, fan gjinien tasizzingen of geskinken, likefolle hokker, oannimme sil, midlik of streekrjocht. Sa wier helpe
      my God almachtich». («Dat ferklearje en ûnthjit ik»).
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel16
  - number: 16a.1
    text: |-
      De ambtenaar van de burgerlijke stand is belast met het opnemen in de onder hem berustende registers van
      de burgerlijke stand van akten en de daaraan toe te voegen latere vermeldingen, alsmede al datgene wat de
      instandhouding van de registers en de zorg voor de toegankelijkheid van de daarin neergelegde gegevens betreft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel16a
  - number: 16a.2
    text: |-
      De buitengewoon ambtenaar van de burgerlijke stand kan uitsluitend worden belast met de taken omschreven
      in de [artikelen 45][ref1], [45a][ref2], [58][ref3], [63][ref4], [64][ref5], [65][ref6], [67][ref7],
      [80a, derde lid][ref8], en [80g][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel45a
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel58
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel63
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel64
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel65
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel67
      [ref8]: https://wetten.overheid.nl/BWBR0002656#Artikel80a
      [ref9]: https://wetten.overheid.nl/BWBR0002656#Artikel80g
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '45'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 45a
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '58'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '63'
        afdeling: '4'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '64'
        afdeling: '4'
      - id: ref6
        bwb_id: BWBR0002656
        artikel: '65'
        afdeling: '4'
      - id: ref7
        bwb_id: BWBR0002656
        artikel: '67'
        afdeling: '4'
      - id: ref8
        bwb_id: BWBR0002656
        artikel: 80a
      - id: ref9
        bwb_id: BWBR0002656
        artikel: 80g
  - number: 16b
    text: |-
      Wanneer de ambtenaar van de burgerlijke stand in de uitoefening van zijn ambt op grond van enige bepaling van deze
      titel of van enige andere titel van dit boek in rechte optreedt, kan hij dit zonder advocaat doen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel16b
  - number: 16c
    text: |-
      Burgemeester en wethouders bepalen de uren, waarop elk bureau van de burgerlijke stand dagelijks voor het publiek
      geopend zal zijn. Daarbij wordt, ten einde de werkzaamheden van de ambtenaren van de burgerlijke stand op die
      dagen zoveel mogelijk te beperken, een afzonderlijke regeling getroffen voor de zaterdag, de zondag, de algemeen
      erkende feestdagen en de overige daarvoor door burgemeester en wethouders aan te wijzen dagen, waarop gemeentelijke
      diensten niet of slechts gedeeltelijk zijn geopend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel16c
  - number: 16d
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van de door het college van burgemeester en
      wethouders te treffen voorzieningen ten behoeve van de taakuitoefening door de ambtenaar van de burgerlijke stand,
      en voorts ten aanzien van al wat verder de taak van de ambtenaar van de burgerlijke stand betreft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel16d
  - number: '17.1'
    text: |-
      Er bestaan voor iedere gemeente registers van geboorten, van huwelijken, van geregistreerde partnerschappen en
      van overlijden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel17
  - number: '17.2'
    text: |-
      Er bestaat in de gemeente 's-Gravenhage, naast de in het eerste lid genoemde registers, een register voor de
      inschrijving van de in [afdeling 6][ref1] bedoelde rechterlijke uitspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling6
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '6'
  - number: 17a.1
    text: |-
      De registers van de burgerlijke stand worden in het gemeentehuis bewaard totdat zij naar een gemeentelijke
      archiefbewaarplaats in de zin van de [Archiefwet 1995][ref1] (*Stb.* 276) worden overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: 17a.2
    text: |-
      De overbrenging naar de gemeentelijke archiefbewaarplaats van de in het gemeentehuis berustende registers
      van geboorten, van huwelijken dan wel geregistreerde partnerschappen en van overlijden vindt eerst plaats
      onderscheidenlijk honderd jaar, vijfenzeventig jaar en vijftig jaar na de afsluiting van deze registers.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel17a
  - number: 17b
    text: |-
      De beheerder van een archiefbewaarplaats als bedoeld in [artikel 17a][ref1] is belast met het bewaren van de onder
      hem berustende registers, met het toevoegen van latere vermeldingen aan de daarin opgenomen akten en met de afgifte
      van afschriften en uittreksels van deze akten.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 17a
        afdeling: '2'
  - number: 17c
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld alles wat verder betreft de inrichting van de registers, alsmede
      de in [artikel 17b][ref1] genoemde handelingen ten aanzien van die registers.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 17b
        afdeling: '2'
  - number: '18.1'
    text: |-
      De ambtenaar van de burgerlijke stand mag in de akten alleen opnemen hetgeen ingevolge het bij of krachtens de wet
      bepaalde moet worden verklaard of opgenomen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18
  - number: '18.2'
    text: |-
      Alvorens tot het opmaken van een akte over te gaan, verifieert de ambtenaar van de burgerlijke stand de door
      partijen bij de akte verstrekte gegevens door raadpleging van de basisregistratie personen en, zonodig, andere
      daartoe bestemde registers of bevoegde autoriteiten, zonder daarvoor leges verschuldigd te zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18
  - number: '18.3'
    text: |-
      De ambtenaar van de burgerlijke stand is voorts bevoegd zich, al dan niet in persoon, alle bescheiden te doen
      vertonen die hij voor het opmaken van de akte of voor de vaststelling van de in de akte op te nemen gegevens
      noodzakelijk acht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18
  - number: '18.5'
    text: Bij algemene maatregel van bestuur wordt geregeld al hetgeen het opmaken van de akten betreft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18
  - number: 18a.1
    text: |-
      Partijen bij een akte van de burgerlijke stand zijn degenen die aan de ambtenaar van de burgerlijke stand een
      aangifte doen of te zijnen overstaan een verklaring afleggen betreffende een feit, waarvan de akte bestemd is te
      doen blijken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18a
  - number: 18a.2
    text: |-
      Belanghebbende partijen zijn partijen die met hun verklaring enig rechtsgevolg teweeg brengen voor henzelf of voor
      medepartijen, dan wel voor henzelf en medepartijen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18a
  - number: 18a.3
    text: De belanghebbende partijen kunnen zich door een daartoe bij authentieke akte gevolmachtigde doen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18a
  - number: 18a.4
    text: |-
      Wanneer een gevolmachtigde een verklaring aflegt, geldt hij zowel als de door hem vertegenwoordigde persoon als
      partij bij de akte.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18a
  - number: 18a.5
    text: |-
      De ambtenaar van de burgerlijke stand mag geen akte verlijden waarin hijzelf als partij of belanghebbende partij
      voorkomt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18a
  - number: 18b.1
    text: |-
      Voor de betrouwbaarheid en vertrouwelijkheid van de elektronische aangifte alsmede het opmaken en de opslag van een
      akte in elektronische vorm wordt een systeem van gegevensverwerking gebruikt dat:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18b
  - number: 18b.1.a
    text: |-
      de ambtenaar van de burgerlijke stand in staat stelt de juistheid van de identiteit van de aangever vast te
      stellen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18b
  - number: 18b.1.b
    text: de vertrouwelijkheid van de door de aangever verstrekte gegevens waarborgt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18b
  - number: 18b.1.c
    text: |-
      waarborgt dat elektronische akten als bedoeld in [artikel 18, vierde lid][ref1], zodanig blijven opgeslagen dat
      de inhoud toegankelijk is voor toekomstig gebruik en een ongewijzigde reproductie van de inhoud van de akten
      gewaarborgd is;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel18
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '18'
        afdeling: '3'
  - number: 18b.1.d
    text: |-
      waarborgt dat een bericht, elektronisch afschrift of uittreksel volledig is en niet onbevoegdelijk is of kan worden
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18b
  - number: 18b.2
    text: Bij algemene maatregel van bestuur kunnen over het in het eerste lid bepaalde nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18b
  - number: 18c.1
    text: |-
      Blijft een partij bij een akte van de burgerlijke stand of een belanghebbende partij in gebreke de in
      [artikel 18, derde lid][ref1], bedoelde bescheiden over te leggen, of acht de ambtenaar van de burgerlijke stand de
      overgelegde bescheiden ongenoegzaam, dan weigert deze tot het opmaken van de akte over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel18
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '18'
        afdeling: '3'
  - number: 18c.2
    text: |-
      De ambtenaar van de burgerlijke stand weigert eveneens tot het opmaken van de akte over te gaan, indien hij van
      oordeel is dat de Nederlandse openbare orde zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18c
  - number: 18c.3
    text: |-
      Van een weigering als bedoeld in het eerste of het tweede lid doet de ambtenaar van de burgerlijke stand een
      schriftelijke, met redenen omklede mededeling aan de partijen bij de akte en de belanghebbende partijen toekomen,
      onder vermelding van de tegen die weigering openstaande voorziening van [afdeling 12][ref1] van deze titel. Een
      afschrift van deze mededeling doet hij aan de Immigratie- en Naturalisatiedienst toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling12
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '12'
  - number: 18d.1
    text: |-
      Van alle in registers opgenomen akten van de burgerlijke stand wordt een dubbel of een afschrift gehouden, volgens
      regels, bij algemene maatregel van bestuur te stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18d
  - number: 18d.2
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld alles wat betreft de bewaring van de dubbelen of de afschriften
      alsmede van de daarop betrekking hebbende latere vermeldingen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18d
  - number: 18d.3
    text: |-
      Wanneer akten van de burgerlijke stand verloren zijn gegaan of verminkt zijn, wordt ter vervanging van deze akten
      van de dubbelen van de akten een afschrift gemaakt door een of meer door Onze Minister van Justitie aan te wijzen
      Centrale Bewaarplaatsen waar de dubbelen bewaard worden. De afschriften treden in de plaats van de verloren gegane
      of verminkte akten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18d
  - number: 18d.4
    text: Er wordt een lijst opgesteld van de akten die vervangen worden, die in de Staatscourant wordt gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18d
  - number: 18d.5
    text: |-
      De kosten voor de vervanging van akten van de burgerlijke stand komen ten laste van de Staat, tenzij het de
      vervanging van akten betreft die bewaard worden door een gemeente. In het laatstgenoemde geval komen de kosten van
      vervanging voor rekening van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18d
  - number: 18d.6
    text: |-
      Onze Minister van Justitie kan nadere regels stellen omtrent de wijze waarop de vervanging van de akten dient te
      worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel18d
  - number: '19.1'
    text: |-
      Een akte van geboorte wordt opgemaakt door de ambtenaar van de burgerlijke stand van de gemeente waar het kind
      is geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19
  - number: '19.2'
    text: |-
      Indien de plaats van de geboorte van het kind niet bekend is, wordt de akte opgemaakt door de ambtenaar van de
      burgerlijke stand van de gemeente waar het kind is aangetroffen. Die gemeente geldt als gemeente waar het kind
      is geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19
  - number: 19a.1
    text: |-
      In geval van geboorte op Nederlands grondgebied in een rijdend voertuig of op een varend schip of tijdens een
      binnenlandse luchtreis met een luchtvaartuig, wordt de akte van geboorte opgemaakt door de ambtenaar van de
      burgerlijke stand van de gemeente waar dat kind het voertuig, het schip of het luchtvaartuig verlaat, dan wel waar
      het schip ligplaats kiest. Die gemeente geldt als gemeente waar het kind is geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19a
  - number: 19a.2
    text: |-
      In geval van geboorte tijdens een zeereis met een in Nederland geregistreerd vaartuig, dan wel tijdens een
      internationale luchtreis met een in Nederland geregistreerd luchtvaartuig, is de gezagvoerder van het vaartuig
      of het luchtvaartuig verplicht een voorlopige akte van geboorte binnen vierentwintig uur in het journaal in te
      schrijven in tegenwoordigheid van twee getuigen en zo mogelijk van de vader. De gezagvoerder zendt een afschrift
      van die akte zo spoedig mogelijk aan de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage. Deze
      maakt de akte van geboorte op aan de hand van het ontvangen afschrift, met dien verstande dat hij gegevens die
      ontbreken of hem blijken onjuist te zijn, zoveel mogelijk aanvult of verbetert. Aan de personen op wie de akte
      betrekking heeft, wordt een uittreksel van de akte toegezonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19a
  - number: 19b
    text: |-
      Indien de plaats of de dag van de geboorte van het kind niet bekend is dan wel indien de naam, met inbegrip van
      de voornamen, van de moeder uit wie het kind is geboren niet bekend is, wordt de geboorteakte ten aanzien van deze
      punten opgemaakt krachtens een bevel en overeenkomstig de aanwijzingen van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19b
  - number: 19c
    text: |-
      Zijn krachtens [artikel 5, tiende lid, van dit boek][ref1] in de akte een voorlopige voornaam en geslachtsnaam
      opgenomen, dan zendt de ambtenaar van de burgerlijke stand onverwijld een volledig afschrift van de akte aan Onze
      Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel5
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '5'
  - number: 19d.1
    text: |-
      Indien het geslacht van het kind twijfelachtig is, wordt een geboorteakte opgemaakt, waarin wordt vermeld dat het
      geslacht van het kind niet is kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19d
  - number: 19d.2
    text: |-
      Binnen drie maanden na de geboorte, of, bij overlijden binnen die termijn, ter gelegenheid van de aangifte van het
      overlijden, wordt onder doorhaling van de in het eerste lid bedoelde akte een nieuwe geboorteakte opgemaakt, waarin
      het geslacht, indien dit inmiddels is vastgesteld, wordt vermeld aan de hand van een ter zake overgelegde medische
      verklaring.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19d
  - number: 19d.3
    text: |-
      Is binnen de in het tweede lid genoemde termijn geen medische verklaring overgelegd, of blijkt uit de overgelegde
      medische verklaring dat het geslacht niet is kunnen worden vastgesteld, dan vermeldt de nieuwe geboorteakte dat het
      geslacht van het kind niet is kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19d
  - number: 19e.1
    text: Tot de aangifte van een geboorte is bevoegd de moeder uit wie het kind is geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19e
  - number: 19e.2
    text: Tot de aangifte is verplicht de vader of de moeder uit wie het kind niet is geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19e
  - number: 19e.3
    text: |-
      Wanneer de persoon genoemd in het tweede lid ontbreekt of verhinderd is de aangifte te doen, is tot aangifte
      verplicht:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19e
  - number: 19e.3.a
    text: ieder die bij het ter wereld komen van het kind tegenwoordig is geweest;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19e
  - number: 19e.3.b
    text: |-
      de bewoner van het huis waar de geboorte heeft plaats gehad, of indien zulks is geschied in een inrichting tot
      verpleging of verzorging bestemd, in een gevangenis of in een soortgelijke inrichting, het hoofd van die inrichting
      of een door hem bij onderhandse akte bijzonderlijk tot het doen van de aangifte aangewezen ondergeschikte.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19e
  - number: 19e.4
    text: |-
      Voor een in het derde lid, onder *b*, genoemde persoon bestaat de verplichting alleen indien een onder *a* genoemde
      persoon ontbreekt of verhinderd is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19e
  - number: 19e.5
    text: |-
      Wanneer tot de aangifte bevoegde of verplichte personen ontbreken of nalaten de aangifte te doen, geschiedt deze
      door of vanwege de burgemeester van de gemeente alwaar de geboorteakte moet worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19e
  - number: 19e.6
    text: |-
      De verplichting tot aangifte moet worden vervuld binnen drie dagen na de dag der bevalling. Van een aangifte later
      dan de derde dag, bedoeld in de eerste zin van dit lid, wordt door de ambtenaar van de burgerlijke stand mededeling
      gedaan aan het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19e
  - number: 19e.7
    text: |-
      De ambtenaar van de burgerlijke stand stelt de identiteit van de aangever vast aan de hand van een document als
      bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 19e.8
    text: |-
      Bij de aangifte kan de ambtenaar van de burgerlijke stand zich doen overleggen een door de arts of de verloskundige
      die bij het ter wereld komen van het kind tegenwoordig was, opgemaakte verklaring dat het kind uit de als moeder
      opgegeven persoon is geboren. Is het kind buiten de tegenwoordigheid van een arts of verloskundige ter wereld
      gekomen, dan kan hij zich een door een zodanige hulpverlener nadien opgemaakte verklaring doen overleggen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19e
  - number: 19e.9
    text: |-
      Wordt geen gevolg gegeven aan het verzoek van de ambtenaar van de burgerlijke stand om overlegging van een
      verklaring als bedoeld in het achtste lid of is in de verklaring vermeld dat de identiteit van de moeder uit wie
      het kind is geboren onbekend is, dan is [artikel 19b][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19b
        afdeling: '4'
  - number: 19f.1
    text: |-
      Een akte van overlijden wordt opgemaakt door de ambtenaar van de burgerlijke stand van de gemeente waar het
      overlijden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19f
  - number: 19f.2
    text: |-
      Indien een lijk is gevonden en de plaats of de dag van overlijden niet met voldoende nauwkeurigheid kan worden
      vastgesteld, wordt de akte van overlijden opgemaakt door de ambtenaar van de burgerlijke stand van de gemeente
      waarin het lijk is gevonden of aan land gebracht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19f
  - number: 19f.3
    text: |-
      Ongeacht het in het eerste lid bepaalde is het tweede lid van overeenkomstige toepassing indien het overlijden
      heeft plaatsgevonden op een op zee gestationeerde installatie en het lijk in Nederland aan land wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19f
  - number: 19g.1
    text: |-
      In geval van overlijden op Nederlands grondgebied in een rijdend voertuig of op een varend schip of tijdens een
      binnenlandse luchtreis met een luchtvaartuig, wordt de akte van overlijden opgemaakt door de ambtenaar van de
      burgerlijke stand van de gemeente waar het lijk het voertuig, het schip of het luchtvaartuig verlaat, dan wel waar
      het schip ligplaats kiest. Die gemeente geldt als gemeente waar het overlijden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19g
  - number: 19g.2
    text: |-
      In geval van overlijden tijdens een zeereis met een in Nederland geregistreerd voertuig, dan wel tijdens een
      internationale luchtreis met een in Nederland geregistreerd luchtvaartuig, is de gezagvoerder van het vaartuig
      of het luchtvaartuig verplicht een voorlopige akte van overlijden binnen vierentwintig uur in het journaal in
      te schrijven in tegenwoordigheid van twee getuigen. De gezagvoerder zendt een afschrift van die akte zo spoedig
      mogelijk naar de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage. Deze maakt de akte van
      overlijden op aan de hand van het ontvangen afschrift, met dien verstande dat hij gegevens die ontbreken of hem
      blijken onjuist te zijn, zoveel mogelijk aanvult of verbetert. Aan de personen op wie de akte betrekking heeft,
      wordt een uittreksel van de akte toegezonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19g
  - number: 19h.1
    text: Tot de aangifte van een overlijden is bevoegd wie daarvan uit eigen wetenschap kennis draagt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19h
  - number: 19h.2
    text: |-
      Binnen de in [artikel 16 van de Wet op de lijkbezorging][ref1] gestelde termijn voor de begraving of crematie, kan
      de persoon die in de lijkbezorging voorziet, door een in het eerste lid bedoelde persoon worden gemachtigd tot het
      doen van de aangifte. In dit geval kan de aangifte door de gemachtigde ook elektronisch worden gedaan, als deze weg
      is geopend.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel16
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '16'
  - number: 19h.3
    text: |-
      De identiteit van de aangever wordt vastgesteld aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1], dan wel op bij algemene maatregel van bestuur te bepalen
      andere wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 19h.4
    text: 'De aangever verstrekt ten minste de volgende gegevens van de overledene:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19h
  - number: 19h.4.a
    text: geslachtsnaam, voornamen en geslacht van de overledene;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19h
  - number: 19h.4.b
    text: voor zover bekend, plaats en dag van geboorte;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19h
  - number: 19h.4.c
    text: plaats, dag en, zo mogelijk, het tijdstip van overlijden en
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19h
  - number: 19h.4.d
    text: diens burgerlijke staat en
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19h
  - number: 19h.4.e
    text: diens laatst bekende woonadres of woonplaats.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19h
  - number: 19h.5
    text: |-
      Wanneer tot de aangifte bevoegde personen ontbreken of nalaten binnen de in de [Wet op de lijkbezorging][ref1]
      gestelde termijn voor de begraving of crematie de aangifte te doen, geschiedt deze door of vanwege de burgemeester
      van de gemeente alwaar de akte van overlijden moet worden opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005009
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0005009
  - number: 19h.6
    text: |-
      In de gevallen bedoeld in [artikel 19][ref1], geschiedt de aangifte door de hulpofficier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19f
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19f
        afdeling: '4'
  - number: 19i.1
    text: |-
      Wanneer een kind levenloos ter wereld is gekomen, wordt een akte opgemaakt, die in het register van overlijden
      wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19i
  - number: 19i.2
    text: |-
      Wanneer een kind binnen de in [artikel 19e, zesde lid][ref1], bepaalde termijn is overleden voordat aangifte van de
      geboorte is geschied, wordt zowel een akte van geboorte als een akte van overlijden opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19e
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19i
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19e
        afdeling: '4'
  - number: 19i.3
    text: |-
      In de in de vorige leden bedoelde gevallen is ten aanzien van de aangifte het bepaalde in [artikel 19h][ref1] van
      overeenkomstige toepassing. In het in het tweede lid bedoelde geval blijft [artikel 19e][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19h
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel19e
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19i
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19h
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 19e
        afdeling: '4'
  - number: 19i.4
    text: |-
      In het geval, bedoeld in het eerste lid, verstrekt de ambtenaar van de burgerlijke stand aan het Centraal Bureau
      voor de Statistiek zo spoedig mogelijk de gegevens betreffende dat kind, die zijn vermeld in het daartoe door hem
      te gebruiken formulier dat door Onze Minister van Veiligheid en Justitie is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19i
  - number: 19j.1
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al wat betreft de aan de ambtenaar over te leggen stukken, het
      opmaken van de akten, onderscheidenlijk de voorlopige akten van geboorte en van overlijden, en de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19j
  - number: 19j.2
    text: 'Bij algemene maatregel van bestuur wordt tevens geregeld:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19j
  - number: 19j.2.a
    text: |-
      op welke wijze en waar de akten van geboorte en van overlijden zullen worden opgemaakt en ingeschreven wanneer
      dit ten gevolge van een verbod van verkeer of ten gevolge van andere buitengewone omstandigheden niet op de gewone
      wijze kan geschieden; en
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19j
  - number: 19j.2.b
    text: |-
      op welke wijze en waar overlijdensakten zullen worden opgemaakt van militairen en van andere personen, die tot de
      krijgsmacht behoren en die te velde, in de slag, of in ’s Rijks dienst buiten Nederland zijn overleden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19j
  - number: 19k.1
    text: |-
      Een ieder die zijn gewone verblijfplaats in Nederland heeft, kan de ambtenaar van de burgerlijke stand van
      zijn woonplaats verzoeken om afgifte van een attestatie de vita opgesteld overeenkomstig bijlage 1 van de op
      10 september 1998 te Parijs tot stand gekomen Overeenkomst betreffende de afgifte van een attestatie de vita
      (Trb. 2004, 283).
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19k
  - number: 19k.2
    text: |-
      De verzoeker verschijnt in persoon voor de ambtenaar van de burgerlijke stand van zijn woonplaats,
      dan wel voor de daartoe in Nederland bevoegde diplomatieke of consulaire autoriteit, tenzij hij in de
      onmogelijkheid hiertoe verkeert. Hij toont zijn identiteit aan aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19k
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 19k.3
    text: |-
      De attestatie de vita is gedurende zes maanden geldig, te rekenen vanaf de datum van afgifte. Zij is vrijgesteld
      van de vereisten van vertaling en van legalisatie dan wel van enig soortgelijk formeel vereiste.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19k
  - number: 19k.4
    text: |-
      De attestatie de vita wordt afgegeven in de Nederlandse taal en in de Franse taal. Op verzoek wordt daarbij tevens
      afgegeven:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19k
  - number: 19k.4.a
    text: |-
      de lijst van coderingen en de vertaling ervan in de officiële taal of in één van de officiële talen van het land
      waar de attestatie overgelegd zal worden, of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19k
  - number: 19k.4.b
    text: |-
      de vertaling in de officiële taal of in één van de officiële talen van de landen die bij de in het eerste
      lid genoemde Overeenkomst partij zijn. De vertaling wordt uitgevoerd overeenkomstig de in de bijlage bij de
      Overeenkomst vastgestelde termen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19k
  - number: 19k.5
    text: |-
      Iedere belanghebbende kan met betrekking tot een attestatie de vita die is afgegeven in een ander land dat partij
      is bij de in het eerste lid genoemde Overeenkomst, de ambtenaar van de burgerlijke stand in zijn woonplaats dan wel
      de daartoe in Nederland bevoegde diplomatieke of consulaire autoriteit verzoeken om afgifte van:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19k
  - number: 19k.5.a
    text: een vertaling van de coderingen in het Nederlands, of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19k
  - number: 19k.5.b
    text: een vertaling van de attestatie de vita in het Nederlands.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel19k
  - number: '20.1'
    text: |-
      De ambtenaar van de burgerlijke stand voegt aan de onder hem berustende akten van de burgerlijke stand latere
      vermeldingen toe van akten van de burgerlijke stand en andere authentieke akten houdende naamskeuze, erkenning,
      ontkenning van het vaderschap of moederschap door de moeder, van besluiten houdende wijziging of vaststelling van
      namen, van bevestigingen van opties mede houdende vaststelling van namen en naturalisatiebesluiten mede houdende
      wijziging of vaststelling van namen alsmede van besluiten tot intrekking van zulke bevestigingen of besluiten,
      van de opgave van afwijkende namen die een persoon die meer dan één nationaliteit bezit, voert in overeenstemming
      met het recht van het land waarvan hij mede de nationaliteit bezit, van akten houdende beëindiging van een
      geregistreerd partnerschap, van akten van omzetting van een geregistreerd partnerschap, wijziging van de vermelding
      van het geslacht na een aangifte als bedoeld in [artikel 28][ref1], alsmede van rechterlijke uitspraken waarvan de
      dagtekening ten minste drie maanden oud is en die inhouden:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel28
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '28'
        afdeling: '13'
  - number: 20.1.a
    text: |-
      een last tot wijziging van de voornamen of van de geslachtsnaam, een adoptie, een herroeping van een adoptie, een
      vernietiging van een erkenning, een gerechtelijke vaststelling van het ouderschap, een gegrondverklaring van een
      ontkenning van het vaderschap of moederschap of, of een vernietiging van zulk een uitspraak;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20
  - number: 20.1.b
    text: |-
      de nietigverklaring van een huwelijk of van een geregistreerd partnerschap of de vernietiging van zulk een
      uitspraak tussen echtelieden of geregistreerde partners wier huwelijksakte onderscheidenlijk akte van een
      geregistreerd partnerschap, dan wel akte van omzetting van een geregistreerd partnerschap of huwelijk in de
      Nederlandse registers van de burgerlijke stand is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20
  - number: '20.2'
    text: |-
      De ambtenaar van de burgerlijke stand voegt eveneens aan de onder hem berustende akten van de burgerlijke stand
      latere vermeldingen toe van in kracht van gewijsde gegane rechterlijke uitspraken die een echtscheiding of een
      ontbinding van een geregistreerd partnerschap, een ontbinding van een huwelijk na scheiding van tafel en bed
      of de vernietiging van zulk een uitspraak tussen echtelieden wier huwelijksakte, akte van registratie van een
      partnerschap of akte van omzetting van een geregistreerd partnerschap of huwelijk in de Nederlandse registers van
      de burgerlijke stand is opgenomen, inhouden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20
  - number: 20a.1
    text: |-
      De in [artikel 20][ref1] bedoelde latere vermeldingen, met uitzondering van de vermeldingen bedoeld in het
      eerste lid, onder b, alsmede van de vermeldingen houdende beëindiging van een geregistreerd partnerschap en van
      de vermeldingen van een omzetting van een geregistreerd partnerschap, worden toegevoegd aan de geboorteakte van
      de betrokken persoon. Van een wijziging of vaststelling van de geslachtsnaam wordt tevens een latere vermelding
      toegevoegd aan de geboorteakten van de kinderen van de betrokken persoon, voor zover de wijziging of vaststelling
      zich tot hen uitstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '20'
        afdeling: '5'
  - number: 20a.2
    text: |-
      De in [artikel 20, eerste lid, onder b, en tweede lid][ref1], bedoelde latere vermeldingen alsmede de in de
      [aanhef van artikel 20, eerste lid,][ref2] bedoelde beëindiging van een geregistreerd partnerschap en de daar
      bedoelde omzetting, worden toegevoegd aan de huwelijksakte dan wel aan de akte van registratie van een partnerschap
      van de betrokken persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel20
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '20'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '20'
        afdeling: '5'
  - number: 20a.3
    text: |-
      Wanneer als gevolg van het huwelijk of van de echtscheiding een verandering intreedt in de geslachtsnaam van een
      persoon, wordt hiervan, voorzover zij niet in de huwelijksakte is vermeld, aan deze akte een latere vermelding
      toegevoegd. Tevens wordt daarvan een latere vermelding toegevoegd aan de geboorteakte van de betrokkene en de
      geboortenakten van diens kinderen, voor zover hun naam eveneens verandert.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20a
  - number: 20b.1
    text: |-
      Van akten en uitspraken die buiten Nederland overeenkomstig de plaatselijke voorschriften door een bevoegde
      instantie zijn opgemaakt of gedaan en een overeenkomstige uitwerking hebben als de akten en rechterlijke
      uitspraken, bedoeld in [artikel 20][ref1], wordt, tenzij de Nederlandse openbare orde zich hiertegen verzet, op
      verzoek van een belanghebbende dan wel ambtshalve, door de ambtenaar van de burgerlijke stand een latere vermelding
      toegevoegd aan de desbetreffende in de registers van de burgerlijke stand hier te lande voorkomende huwelijksakte,
      akte van registratie van een partnerschap, akte van omzetting van een geregistreerd partnerschap of huwelijk of
      geboorteakte. Van een verandering van de geslachtsnaam wordt op verzoek van een belanghebbende tevens een latere
      vermelding gevoegd bij de geboorteakte van de kinderen van de betrokken persoon, voor zover hun naam eveneens
      verandert.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '20'
        afdeling: '5'
  - number: 20b.2
    text: |-
      Indien een latere vermelding ambtshalve aan een akte is toegevoegd, zendt de ambtenaar van de burgerlijke stand een
      afschrift van de akte en de latere vermelding aan de persoon of personen op wie de akte betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20b
  - number: 20c
    text: |-
      De [artikelen 18][ref1] en [18c][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel18c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '18'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 18c
        afdeling: '3'
  - number: 20d
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al wat betreft de aan de ambtenaar over te leggen stukken, het
      opmaken van de latere vermeldingen en de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20d
  - number: 20e.1
    text: |-
      Van de in [artikel 20, eerste lid][ref1], genoemde uitspraken zendt de griffier van het college waarvoor de zaak
      laatstelijk aanhangig was niet eerder dan drie maanden na de dag van de beschikking een afschrift aan de ambtenaar
      van de burgerlijke stand.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '20'
        afdeling: '5'
  - number: 20e.2
    text: |-
      Van besluiten houdende wijziging of vaststelling van namen en van naturalisatiebesluiten mede houdende wijziging
      of vaststelling van namen zendt Onze Minister van Justitie onverwijld een afschrift aan de ambtenaar van de
      burgerlijke stand onder wie de akte van geboorte van de betrokken persoon berust.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20e
  - number: 20e.3
    text: |-
      De notaris die een akte van erkenning heeft opgemaakt, zendt onverwijld een afschrift of een uittreksel daarvan aan
      de ambtenaar van de burgerlijke stand onder wie de akte van geboorte van het kind berust.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20e
  - number: 20f.1
    text: |-
      De ambtenaar van de burgerlijke stand die de gegevens van een akte van naamskeuze opneemt in de akte van geboorte
      van het kind, zendt een afschrift van die akte aan de ambtenaar van de burgerlijke stand die de akte van naamskeuze
      heeft opgemaakt. Deze akte wordt bewaard totdat achttien maanden zijn verstreken na de ontvangst van dat afschrift.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20f
  - number: 20f.2
    text: |-
      De ambtenaar van de burgerlijke stand die een latere vermelding van de naamskeuze, de erkenning toevoegt aan
      de akte van geboorte van het kind, zendt een afschrift van die akte en de latere vermelding aan de personen
      op wie de akte betrekking heeft. Hij zendt een afschrift aan de ambtenaar van de burgerlijke stand die de akte
      van naamskeuze, van erkenning heeft opgemaakt. Laatstgenoemde akte wordt bewaard totdat achttien maanden zijn
      verstreken na de ontvangst van laatstgenoemd afschrift dan wel, indien geen zodanig afschrift wordt ontvangen,
      totdat achttien maanden zijn verstreken na het opmaken van de akte.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20f
  - number: 20g
    text: |-
      De ambtenaar van de burgerlijke stand die aan de geboorteakte van een minderjarige een latere vermelding toevoegt,
      waaruit blijkt dat de minderjarige is erkend, of dat een naam van hem is gewijzigd, geeft van dit feit kennis aan
      de bewaarder van het in [artikel 244 van dit boek][ref1] bedoelde openbare register waarin rechtsfeiten omtrent die
      minderjarige zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel244
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel20g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '244'
        afdeling: '4'
  - number: '21.1'
    text: |-
      De ambtenaar van de burgerlijke stand te 's-Gravenhage maakt akten van inschrijving op van in kracht
      van gewijsde gegane rechterlijke uitspraken betreffende huwelijken of registraties van een partnerschap,
      waarvan de akten niet in de Nederlandse registers van de burgerlijke stand zijn opgenomen, welke inhouden de
      nietigverklaring van een huwelijk of van een geregistreerd partnerschap, een echtscheiding, de ontbinding van
      een geregistreerd partnerschap, de ontbinding van een huwelijk na scheiding van tafel en bed of de vernietiging
      van zulk een ingeschreven uitspraak, dan wel de beëindiging van een geregistreerd partnerschap, bedoeld in
      [artikel 80c, onder c][ref1], of de vernietiging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
  - number: '21.2'
    text: |-
      De in het eerste lid bedoelde akten worden ingeschreven in het daartoe bestemde register van de burgerlijke stand
      te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel21
  - number: '21.3'
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al wat betreft de aan de ambtenaar over te leggen stukken, het
      opmaken van de akten van inschrijving en de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel21
  - number: '22.1'
    text: |-
      De akte van geboorte bewijst ten aanzien van een ieder dat op de in de akte vermelde plaats, dag en uur uit de
      daarin genoemde moeder een kind van het daarin vermelde geslacht is geboren. Vermeldt de akte dat de plaats van de
      geboorte van het kind niet bekend is, dan komt dezelfde bewijskracht toe aan de vermelding van de plaats waar het
      is aangetroffen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel22
  - number: '22.2'
    text: |-
      De akte van overlijden bewijst ten aanzien van een ieder, dat op de plaats, de dag en het uur, in de akte vermeld,
      de daarin genoemde persoon is overleden of, indien de akte krachtens [artikel 19f, tweede lid, van dit boek][ref1]
      is opgemaakt, dat het lijk van de daarin genoemde persoon op de plaats, de dag en het uur, in de akte vermeld,
      is gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19f
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19f
        afdeling: '4'
  - number: '22.3'
    text: Voor het overige hebben akten van de burgerlijke stand dezelfde bewijskracht als andere authentieke akten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel22
  - number: 22a
    text: |-
      Authentieke afschriften of uittreksels, in de wettige vorm opgemaakt en afgegeven door de daartoe bevoegde
      bewaarder van het register, hebben dezelfde bewijskracht als het origineel, tenzij bewezen wordt dat zij daarmede
      niet overeenstemmen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel22a
  - number: '23'
    text: |-
      De akten van de burgerlijke stand, daaronder begrepen de dubbelen van deze akten, zijn openbaar voor zover te dien
      aanzien in deze afdeling geen nadere voorziening is gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel23
  - number: 23a
    text: |-
      Van de akten van de burgerlijke stand mogen slechts de bewaarders en het openbaar ministerie inzage nemen. Voorts
      kunnen de rechter en het openbaar ministerie overlegging van akten bevelen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel23a
  - number: 23b.1
    text: |-
      Een ieder is bevoegd zich door de ambtenaar die met de afgifte van afschriften en uittreksels van akten van
      de burgerlijke stand is belast, een uittreksel van een onder deze ambtenaar berustende akte van geboorte,
      van huwelijk, van registratie van een partnerschap, van omzetting van een huwelijk in een registratie van een
      partnerschap, van omzetting van een registratie van een partnerschap in een huwelijk of van overlijden te doen
      afgeven. Het uittreksel bevat de bij algemene maatregel van bestuur te vermelden gegevens, waaruit de afstamming
      van de persoon of personen op wie de akte betrekking heeft, niet blijkt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel23b
  - number: 23b.2
    text: |-
      Van de in het eerste lid bedoelde akten alsmede van de akten van erkenning of ontkenning van het vaderschap of
      moederschap door de moeder wordt een afschrift slechts afgegeven indien de verzoeker aantoont dat hij bij de
      verkrijging een gerechtvaardigd belang heeft. Van andere akten die de in het eerste lid bedoelde ambtenaar onder
      zijn berusting heeft, wordt steeds een afschrift afgegeven. Dit afschrift bevat de bij algemene maatregel van
      bestuur te vermelden gegevens.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel23b
  - number: 23b.3
    text: |-
      Een verzoek om afgifte van een uittreksel of een afschrift dient op een bepaalde persoon of bepaalde personen
      betrekking te hebben.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel23b
  - number: 23b.4
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al hetgeen overigens het opmaken en het verstrekken van
      afschriften en uittreksels betreft. Daarbij worden tevens regels gegeven voor het opmaken van uittreksels van akten
      die voor de inwerkingtreding van deze wet zijn opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel23b
  - number: 23b.5
    text: |-
      Weigert de in het eerste lid bedoelde ambtenaar een afschrift of een uittreksel af te geven, dan verstrekt hij aan
      de aanvrager een schriftelijke opgave van de gronden voor zijn weigering.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel23b
  - number: 23c
    text: |-
      De dubbelen van de akten van de burgerlijke stand zijn openbaar zolang zij onder de ambtenaar van de burgerlijke
      stand berusten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel23c
  - number: '24.1'
    text: |-
      Aanvulling van een register van de burgerlijke stand met een daarin ontbrekende akte of latere vermelding,
      doorhaling van een daarin ten onrechte voorkomende akte of latere vermelding, of verbetering van een daarin
      voorkomende akte of latere vermelding die onvolledig is of een misslag bevat, kan op verzoek van belanghebbenden of
      van het openbaar ministerie worden gelast door de rechtbank. De rechtbank kan bij haar beschikking tot verbetering
      van een akte of latere vermelding die onvolledig is of een misslag bevat, eveneens dezelfde verbetering gelasten
      ten aanzien van een akte of latere vermelding betreffende dezelfde persoon of zijn afstammelingen, die buiten
      haar rechtsgebied in de registers van de burgerlijke stand is opgenomen. De in de tweede zin bedoelde bevoegdheid
      kan mede worden uitgeoefend ten aanzien van een akte of latere vermelding betreffende dezelfde persoon of zijn
      afstammelingen die in de registers van de burgerlijke stand van de openbare lichamen Bonaire, Sint Eustatius en
      Saba is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel24
  - number: '24.2'
    text: |-
      De griffier van het college waarvoor de zaak laatstelijk aanhangig was, zendt niet eerder dan drie maanden na de
      dag van de beschikking een afschrift daarvan aan de ambtenaar van de burgerlijke stand van de gemeente, in welker
      registers de akte of latere vermelding is of had moeten zijn opgenomen. Is deze gemeente opgeheven, dan zendt
      hij het afschrift aan de ambtenaar van de gemeente in wier archieven de registers van de burgerlijk stand van de
      opgeheven gemeente berusten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel24
  - number: 24a
    text: |-
      Kennelijke schrijf- of spelfouten en kennelijke misslagen kunnen ambtshalve door de ambtenaar van de burgerlijke
      stand worden verbeterd. Indien in een andere gemeente een akte betreffende dezelfde persoon of diens afstammelingen
      wordt gehouden, die eveneens verbetering behoeft, stelt de ambtenaar van de burgerlijke stand die de verbetering in
      de akte heeft aangebracht de ambtenaar van de burgerlijke stand in de andere gemeente daarvan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel24a
  - number: 24b.1
    text: |-
      Aanvulling van een register van de burgerlijke stand op grond van [artikel 24][ref1] geschiedt door het opmaken van
      een nieuwe akte in dat register.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel24
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '24'
        afdeling: '9'
  - number: 24b.2
    text: |-
      Van een verbetering of een doorhaling op grond van deze afdeling wordt een latere vermelding toegevoegd aan de
      desbetreffende akte, volgens regels, bij algemene maatregel van bestuur te stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel24b
  - number: '25.1'
    text: |-
      Buiten Nederland overeenkomstig de plaatselijke voorschriften door een bevoegde instantie opgemaakte akten van
      geboorte, huwelijksakten, akten van registratie van een partnerschap en akten van overlijden worden op bevel van
      het openbaar ministerie of op verzoek van een belanghebbende ingeschreven in de registers onderscheidenlijk van
      geboorten, van huwelijken, van geregistreerde partnerschappen en van overlijden van de gemeente 's-Gravenhage,
      indien:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
  - number: 25.1.a
    text: |-
      de akte een persoon betreft die op het ogenblik van het verzoek Nederlander is of te eniger tijd Nederlander dan
      wel Nederlands onderdaan niet-Nederlander is geweest;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
  - number: 25.1.b
    text: |-
      de akte een persoon betreft die rechtmatig verblijft op grond van
      [artikel 8, onder c en d, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '25.2'
    text: |-
      Buiten Nederland overeenkomstig de plaatselijke voorschriften door een bevoegde instantie opgemaakte akten van
      geboorte worden op bevel van het openbaar ministerie of op verzoek van een belanghebbende ingeschreven in het
      register van geboorten van de gemeente 's-Gravenhage, indien de akte een persoon van vreemde nationaliteit betreft
      en op grond van enige bepaling van dit boek een latere vermelding aan de akte van geboorte moet worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
  - number: '25.3'
    text: |-
      De ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage kan ook ambtshalve de in de vorige leden
      bedoelde akten inschrijven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
  - number: '25.4'
    text: |-
      Indien de inschrijving van een huwelijksakte of van een akte van registratie van een partnerschap op grond van
      het eerste lid wordt verzocht door een belanghebbende en betrekking heeft op een huwelijk of een geregistreerd
      partnerschap tussen personen van wie er een niet de Nederlandse nationaliteit bezit of rechtmatig in Nederland
      verblijft als bedoeld in [artikel 8, onder b, d of e, van de Vreemdelingenwet 2000][ref1], dienen de echtgenoten
      of geregistreerde partners ten behoeve van de ambtenaar van de burgerlijke stand van de gemeente ’s-Gravenhage
      een verklaring af te leggen inzake het verblijfsrecht van de echtgenoot of geregistreerde partner die niet de
      Nederlandse nationaliteit bezit alsmede inhoudende dat hun huwelijk of geregistreerd partnerschap niet is aangegaan
      met het oogmerk om verblijfsrecht in Nederland te verkrijgen. De verklaring is niet vereist indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 25.4.a
    text: |-
      sinds de voltrekking van het huwelijk of de registratie van het partnerschap ten minste tien jaren zijn verstreken,
      of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
  - number: 25.4.b
    text: het huwelijk of geregistreerd partnerschap inmiddels is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
  - number: '25.5'
    text: |-
      In geval van adoptie gelast de rechtbank, die de adoptie uitspreekt, ambtshalve afzonderlijk de inschrijving van de
      in het eerste en het tweede lid bedoelde akte van geboorte.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
  - number: '25.6'
    text: De akte van inschrijving vermeldt de bij algemene maatregel van bestuur vast te stellen gegevens.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
  - number: '25.7'
    text: |-
      Kennelijke misslagen of schrijf- of spelfouten, die de ambtenaar van de burgerlijke stand in de in te schrijven
      akte vaststelt op grond van een hier te lande in de registers van de burgerlijke stand opgenomen akte of op grond
      van een rechterlijke uitspraak, kunnen ambtshalve door hem worden verbeterd. De verbeteringen worden afzonderlijk
      in de akte vermeld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
  - number: '25.8'
    text: |-
      Indien een akte ambtshalve is ingeschreven, wordt een afschrift van de akte van inschrijving toegezonden aan de
      persoon of de personen op wie de akte betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25
  - number: 25a.1
    text: |-
      Indien na de inschrijving kennelijke misslagen in de buiten Nederland opgemaakte akte overeenkomstig de
      plaatselijke voorschriften door een bevoegde instantie zijn verbeterd, wordt de verbetering in de akte van
      inschrijving aangebracht doordat de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage, aan wie een
      afschrift van de beslissing tot verbetering en een afschrift van de verbeterde akte zijn overgelegd, een latere
      vermelding van de verbetering aan de akte van inschrijving toevoegt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25a
  - number: 25a.2
    text: |-
      Kennelijke schrijf- en spelfouten, die in de buiten Nederland opgemaakte akte overeenkomstig de plaatselijke
      voorschriften door een bevoegde instantie zijn verbeterd, kunnen ook zonder toestemming van de officier van
      justitie, ambtshalve door de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage aan de hand van een
      afschrift van de verbeterde akte worden verbeterd op de in het eerste lid aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25a
  - number: 25b
    text: |-
      Aan de akte van inschrijving, bedoeld in [artikel 25][ref1], worden de latere vermeldingen toegevoegd die op grond
      van dit boek aan een in Nederland opgemaakte akte van geboorte, huwelijksakte of akte van overlijden moeten worden
      toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '25'
        afdeling: '10'
  - number: 25c.1
    text: |-
      Indien ten aanzien van een buiten Nederland geboren persoon geen akte van geboorte overeenkomstig de plaatselijke
      voorschriften door een bevoegde instantie is opgemaakt of kan worden overgelegd, kan op verzoek van het openbaar
      ministerie, van een belanghebbende of van de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage de
      rechtbank Den Haag de voor het opmaken van een geboorteakte noodzakelijke gegevens vaststellen, indien:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25c
  - number: 25c.1.a
    text: die persoon Nederlander is of te eniger tijd Nederlander dan wel Nederlands onderdaan niet-Nederlander is geweest;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25c
  - number: 25c.1.b
    text: |-
      die persoon rechtmatig verblijft op grond van [artikel 8, onder c en d, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 25c.1.c
    text: op grond van dit boek een latere vermelding aan de akte van geboorte moet worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25c
  - number: 25c.2
    text: |-
      De rechtbank houdt rekening met alle bewijzen en aanwijzingen omtrent de omstandigheden waaronder, en het tijdstip
      waarop de geboorte moet hebben plaatsgehad. De geslachtsnaam, de voornamen, alsmede de plaats en de dag van de
      geboorte van de vader en van de moeder worden vastgesteld, voor zover daarvoor aanwijzingen zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25c
  - number: 25c.3
    text: |-
      In geval van adoptie geeft de rechtbank die de adoptie uitspreekt, ambtshalve afzonderlijk de in het eerste lid
      bedoelde beschikking.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25c
  - number: 25d
    text: |-
      De rechtbank Den Haag kan op verzoek van het openbaar ministerie, van een belanghebbende of van de ambtenaar van
      de burgerlijke stand van de gemeente 's-Gravenhage de krachtens [artikel 25c][ref1] gegeven beschikking wijzigen op
      grond dat de vastgestelde gegevens onjuist of onvolledig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 25c
        afdeling: '10'
  - number: 25f.1
    text: |-
      De griffier van het college waarvoor de zaak laatstelijk aanhangig was, zendt niet eerder dan drie maanden na
      de dag van de beschikking een afschrift daarvan, aan de ambtenaar van de burgerlijke stand van de gemeente 's-
      Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25f
  - number: 25f.2
    text: |-
      Deze ambtenaar maakt van de beschikking, bedoeld in [artikel 25c][ref1] een akte van inschrijving op, die geldt
      als een akte van geboorte in de zin van [artikel 19][ref2] van dit boek. Deze akte is in overeenstemming met de
      beschikking en vermeldt dit uitdrukkelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel19
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 25c
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '19'
        afdeling: '4'
  - number: 25f.3
    text: |-
      Van de beschikking, bedoeld in [artikel 25d][ref1], wordt een latere vermelding toegevoegd aan de akte als bedoeld
      in het vorige lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25d
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 25d
        afdeling: '10'
  - number: 25g.1
    text: |-
      Op akten en uitspraken die buiten Nederland overeenkomstig de plaatselijke voorschriften door een bevoegde
      instantie zijn opgemaakt of gedaan en een overeenkomstige uitwerking hebben als de in [artikel 25c][ref1] van
      dit boek bedoelde beschikkingen, zijn de [artikelen 25 tot en met 25b][ref2] van overeenkomstige toepassing. De
      inschrijving als bedoeld in [artikel 25][ref3] vindt niet plaats indien de Nederlandse openbare orde zich hiertegen
      verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel25
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 25c
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '25'
        afdeling: '10'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '25'
        afdeling: '10'
  - number: 25g.2
    text: |-
      In geval van adoptie van een buiten Nederland geboren kind ten aanzien waarvan een akte of uitspraak als bedoeld in
      het vorige lid is opgemaakt of gedaan, geeft de rechtbank die de adoptie uitspreekt, ambtshalve afzonderlijk last
      tot inschrijving van die akte of uitspraak.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel25g
  - number: '26.1'
    text: |-
      Een ieder die daarbij een gerechtvaardigd belang heeft, kan de rechtbank verzoeken een verklaring voor recht af
      te geven dat een op hem betrekking hebbende, buiten Nederland opgemaakte akte of gedane uitspraak overeenkomstig
      de plaatselijke voorschriften door een bevoegde instantie is opgemaakt of gedaan en naar zijn aard vatbaar is voor
      opneming in een Nederlands register van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel26
  - number: '26.2'
    text: |-
      De in het eerste lid bedoelde verklaring voor recht kan eveneens op verzoek van de ambtenaar van de burgerlijke
      stand of van het openbaar ministerie worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel26
  - number: 26a
    text: |-
      De rechtbank kan, op verzoek of ambtshalve, bij de in het [eerste lid van artikel 26][ref1] bedoelde verklaring
      voor recht tevens de toevoeging van een latere vermelding, op grond van [artikel 24, eerste lid][ref2], aan een in
      de Nederlandse registers van de burgerlijke stand voorkomende akte gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel24
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '26'
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '24'
        afdeling: '9'
  - number: 26b
    text: |-
      Is met betrekking tot de verzoeker geen akte in de Nederlandse registers van de burgerlijke stand opgenomen, dan
      kan de rechtbank Den Haag, op verzoek of ambtshalve, bij haar beschikking tevens de inschrijving, overeenkomstig
      [artikel 25][ref1], van een daarvoor in aanmerking komende in het buitenland opgemaakte akte in de registers van
      de burgerlijke stand te 's-Gravenhage gelasten, alsmede de verbetering van de akte van inschrijving op grond van
      [artikel 24, eerste lid][ref2]. Ook kan zij bij haar beschikking een last als bedoeld in [artikel 25c][ref3] geven
      alsmede een last tot verbetering, overeenkomstig [artikel 24, eerste lid][ref4], van de door de ambtenaar van de
      burgerlijke stand te 's-Gravenhage op te maken akte.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel24
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '25'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '24'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 25c
        afdeling: '10'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '24'
        afdeling: '9'
  - number: 26d
    text: |-
      De overlegging van een authentiek afschrift van de buitenlandse akte of uitspraak waarop het verzoek betrekking
      heeft, kan worden verlangd. [Artikel 986, derde en vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel986
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel26d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '986'
  - number: 26e
    text: |-
      De griffier van het college, waarbij de zaak laatstelijk aanhangig was, zendt een afschrift van de beschikking
      aan de ambtenaar van de burgerlijke stand in wiens registers een op de belanghebbende betrekking hebbende akte is
      opgenomen, waaraan een latere vermelding van de beschikking moet worden toegevoegd. Is bij de beschikking een last
      tot inschrijving van een in het buitenland opgemaakte akte gegeven, dan zendt de griffier een afschrift van de
      beschikking aan de ambtenaar van de burgerlijke stand te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel26e
  - number: '27'
    text: |-
      Naar aanleiding van een besluit van een ambtenaar van de burgerlijke stand om op grond van [artikel 18c][ref1] of
      [20c][ref2] te weigeren een akte van de burgerlijke stand op te maken, een latere vermelding aan een akte toe te
      voegen of, buiten het geval van stuiting van het huwelijk of het geregistreerd partnerschap en dat van afgifte van
      een afschrift of een uittreksel, aan een verrichting mee te werken, hebben belanghebbende partijen de bevoegdheid
      zich binnen zes weken na de verzending van dat besluit bij verzoekschrift te wenden tot de rechtbank binnen welker
      rechtsgebied de standplaats van de ambtenaar van de burgerlijke stand is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel18c
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel20c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 18c
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 20c
        afdeling: '5'
  - number: 27a
    text: |-
      De rechtbank kan, op verzoek van een belanghebbende partij of ambtshalve, bij haar beschikking tevens een
      verklaring als bedoeld in [artikel 26][ref1] afgeven, alsmede een last als bedoeld in [artikel 26a][ref2],
      onderscheidenlijk [artikel 26b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel26a
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '26'
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 26a
        afdeling: '11'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 26b
        afdeling: '11'
  - number: 27b
    text: |-
      De griffier zendt een afschrift van de beschikking aan de belanghebbende partijen en aan de ambtenaar van de
      burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel27b
  - number: '28.1'
    text: |-
      Iedere Nederlander van zestien jaar of ouder die de overtuiging heeft tot het andere geslacht te behoren dan is
      vermeld in de akte van geboorte, kan van die overtuiging aangifte doen bij de ambtenaar van de burgerlijke stand
      onder wie de desbetreffende akte berust. Indien de akte van geboorte niet hier te lande in de registers van de
      burgerlijke stand is ingeschreven, geschiedt de aangifte bij de ambtenaar van de burgerlijke stand van de gemeente
      ’s-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28
  - number: '28.2'
    text: |-
      Voor de toepassing van het eerste lid en het derde lid alsmede de [artikelen 28a][ref1] en [28b][ref2] wordt onder
      akte van geboorte mede verstaan een akte van inschrijving van een buiten Nederland opgemaakte akte van geboorte of
      van een beschikking als bedoeld in [artikel 25c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel28a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 28a
        afdeling: '13'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 28b
        afdeling: '13'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 25c
        afdeling: '10'
  - number: '28.3'
    text: |-
      Degene die de Nederlandse nationaliteit niet bezit kan een aangifte als bedoeld in het eerste lid doen, indien hij
      gedurende een tijdvak van ten minste één jaar, onmiddellijk voorafgaande aan de aangifte, woonplaats in Nederland
      heeft en een rechtsgeldige verblijfstitel heeft. In dat geval wordt tevens een afschrift van de akte van geboorte
      overgelegd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28
  - number: '28.4'
    text: |-
      De minderjarige van zestien jaar of ouder is bekwaam tot het doen van de in het eerste lid bedoelde aangifte ten
      behoeve van zichzelf, alsmede om ter zake in en buiten rechte op te treden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28
  - number: 28a.1
    text: |-
      Bij de aangifte wordt overgelegd een verklaring van een bij of krachtens algemene maatregel van bestuur aangewezen
      deskundige, afgegeven ten hoogste zes maanden voor de datum van de aangifte.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28a
  - number: 28a.2
    text: |-
      De deskundigenverklaring vermeldt dat degene op wie de aangifte betrekking heeft jegens de deskundige heeft
      verklaard de overtuiging te hebben tot het andere geslacht te behoren dan is vermeld in zijn akte van geboorte en
      jegens de deskundige er blijk van heeft gegeven diens voorlichting omtrent de reikwijdte en de betekenis van deze
      staat te hebben begrepen en de wijziging van de vermelding van het geslacht in de akte van geboorte weloverwogen te
      blijven wensen. De deskundige geeft de verklaring niet af indien hij gegronde reden heeft om aan de gegrondheid van
      bedoelde overtuiging te twijfelen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28a
  - number: 28b.1
    text: |-
      Indien aan [artikel 28a][ref1] is voldaan voegt de ambtenaar van de burgerlijke stand aan de akte van geboorte een
      latere vermelding toe van wijziging van het geslacht. [Artikel 27][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel28a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel27
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 28a
        afdeling: '13'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '27'
        afdeling: '12'
  - number: 28b.2
    text: |-
      In het in de eerste zin van het eerste lid bedoelde geval kan de ambtenaar van de burgerlijke stand desverzocht
      tevens overgaan tot wijziging van de voornamen van degene op wie de aangifte betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28b
  - number: 28b.3
    text: |-
      In het geval bedoeld in [artikel 28, eerste lid, tweede zin][ref1], schrijft de ambtenaar van de burgerlijke stand
      van de gemeente ’s-Gravenhage de akte van geboorte tevens in het register van geboorten van die gemeente in.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel28
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '28'
        afdeling: '13'
  - number: 28c.1
    text: |-
      De wijziging van de vermelding van het geslacht in de akte van geboorte heeft haar gevolgen, die uit dit boek
      voortvloeien, vanaf de dag waarop de ambtenaar van de burgerlijke stand aan de akte van geboorte een latere
      vermelding van wijziging van het geslacht toevoegt. Dit tijdstip geldt eveneens voor de wijziging van de voornamen,
      bedoeld in [artikel 28b, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel28b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 28b
        afdeling: '13'
  - number: 28c.2
    text: |-
      De wijziging van de vermelding van het geslacht laat de op het in het eerste lid genoemde tijdstip bestaande
      familierechtelijke betrekkingen en de daaruit voortvloeiende op dit boek gegronde rechten, bevoegdheden en
      verplichtingen onverlet.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28c
  - number: 28c.3
    text: |-
      Indien de betrokkene na de wijziging van de vermelding van het geslacht een kind baart, wordt voor de toepassing
      van [titel 11][ref1] en hetgeen daaruit voortvloeit uitgegaan van het geslacht dat deze voor de wijziging had. In
      geval van adoptie van een kind op verzoek van degene die dit na de wijziging van de vermelding van het geslacht
      heeft verwekt of heeft ingestemd met een daad die de verwekking van het kind met eigen zaad tot gevolg heeft gehad,
      en het kind is of wordt geboren binnen de relatie van de adoptant en de ouder, is de maatstaf van het vierde lid
      van [artikel 227][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel227
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '227'
  - number: '29'
    text: Er is een Commissie van advies voor de zaken betreffende de burgerlijke staat en de nationaliteit.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel29
  - number: 29a.1
    text: De Commissie bestaat uit ten minste negen en ten hoogste vijftien leden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel29a
  - number: 29a.2
    text: |-
      De Commissie bestaat uit ten minste een lid van de rechterlijke macht, ten minste een lid uit de kring van het
      wetenschappelijk onderzoek, ten minste twee leden uit de kring van de ambtenaren van de burgerlijke stand en ten
      minste twee leden uit de kring van de basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel29a
  - number: 29a.3
    text: |-
      Onze Minister van Justitie benoemt en ontslaat de in het voorgaande lid bedoelde leden in overeenstemming met Onze
      Minister van Binnenlandse Zaken. Voorts wijst hij een voorzitter en een secretaris aan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel29a
  - number: 29b.1
    text: |-
      De Commissie brengt op verzoek van een ambtenaar van de burgerlijke stand of een ander bestuursorgaan advies uit
      over vragen betreffende de rechtstoepassing in zaken van burgerlijke staat of nationaliteit.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel29b
  - number: 29b.2
    text: |-
      Indien een advies van algemeen belang is, wordt het openbaar gemaakt. De Commissie bepaalt de wijze van
      openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel29b
  - number: 29c
    text: |-
      Indien een ambtenaar van de burgerlijke stand gerede twijfel heeft over de vraag of een aan een buiten Nederland
      opgemaakte akte van de burgerlijke stand of ander geschrift te ontlenen gegeven in aanmerking komt om in een akte
      van de burgerlijke stand te worden opgenomen, is hij gehouden het advies van de Commissie in te winnen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel29c
  - number: 29d
    text: |-
      Indien een ambtenaar van de burgerlijke stand een door de Commissie gegeven advies niet opvolgt, stelt hij de
      Commissie en de officier van justitie hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel29d
  - number: 29e
    text: Onze Minister van Justitie kan nadere regels stellen omtrent de taak en de werkwijze van de Commissie.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel29e
  - number: 29f
    text: |-
      Telkens binnen een termijn van vier jaren brengt de Commissie een rapport uit aan Onze Minister van Justitie,
      waarin de taakvervulling van de Commissie aan een onderzoek wordt onderworpen en voorstellen kunnen worden gedaan
      voor gewenste veranderingen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel29f
  - number: '30.1'
    text: Een huwelijk kan worden aangegaan door twee personen van verschillend of van gelijk geslacht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel30
  - number: '30.2'
    text: De wet beschouwt het huwelijk alleen in zijn burgerlijke betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel30
  - number: '31'
    text: Om een huwelijk te mogen aangaan moeten een man en een vrouw de leeftijd van achttien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel31
  - number: '32'
    text: |-
      Een huwelijk mag niet worden aangegaan, wanneer de geestvermogens van een partij zodanig zijn gestoord, dat deze
      niet in staat is haar wil te bepalen of de betekenis van haar verklaring te begrijpen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel32
  - number: '33'
    text: Een persoon kan tegelijkertijd slechts met één andere persoon door het huwelijk verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel33
  - number: '37.1'
    text: |-
      Hij die wegens gewoonte van drank- of drugsmisbruik onder curatele staat, mag geen huwelijk aangaan zonder de
      toestemming van zijn curator.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel37
  - number: '37.2'
    text: |-
      Voor zover die toestemming niet wordt verkregen, kan zij op verzoek van de onder curatele gestelde door toestemming
      van de kantonrechter worden vervangen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel37
  - number: '38'
    text: |-
      Hij die wegens een zijn lichamelijke of geestelijke toestand onder curatele staat, mag geen huwelijk aangaan zonder
      toestemming van de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel38
  - number: '39.1'
    text: |-
      Heeft de rechter de toestemming verleend, dan is de termijn van beroep veertien dagen en kan gedurende die termijn
      de beschikking niet worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel39
  - number: '39.2'
    text: |-
      Hij die tegen een verleende toestemming opkomt, is verplicht dit binnen de termijn van beroep bij
      deurwaardersexploit te doen aanzeggen aan de ambtenaar of ambtenaren van de burgerlijke stand ten overstaan van
      wie het huwelijk kan worden voltrokken. Door dit te verzuimen verliest hij het recht om de nietigverklaring van
      het huwelijk op grond van het ontbreken van zijn toestemming te vragen, indien het gerechtshof de in het eerste lid
      bedoelde beschikking vernietigt en het huwelijk reeds is voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel39
  - number: '41.1'
    text: |-
      Een huwelijk mag niet worden gesloten tussen hen die elkander, hetzij van nature hetzij familierechtelijk, bestaan
      in de opgaande en in de nederdalende lijn of als broeders, zusters of broeder en zuster.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel41
  - number: '41.2'
    text: |-
      Onze Minister van Justitie kan om gewichtige redenen ontheffing van het verbod verlenen aan hen die broeders,
      zusters of broeder en zuster door adoptie zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel41
  - number: 41a
    text: |-
      Een huwelijk mag niet worden gesloten tussen hen die elkander, hetzij van nature hetzij familierechtelijk,
      als bloedverwanten bestaan in de derde of vierde graad in de zijlinie, tenzij de aanstaande echtgenoten bij de
      ambtenaar van de burgerlijke stand ieder een beëdigde verklaring hebben afgelegd, inhoudende dat zij hun vrije
      toestemming tot het huwelijk geven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel41a
  - number: '42'
    text: |-
      Zij die met elkander een huwelijk willen aangaan, mogen niet tegelijkertijd een geregistreerd partnerschap zijn
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel42
  - number: '44.1'
    text: |-
      Ten behoeve van het kenbaar maken van hun voornemen om in het huwelijk te treden verstrekken de aanstaande
      echtgenoten van wie ten minste één uitsluitend of mede de Nederlandse nationaliteit bezit of in Nederland zijn
      gewone verblijfplaats heeft aan de ambtenaar van de burgerlijke stand:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
  - number: 44.1.a
    text: |-
      hun geslachtsnaam, voornamen, woonplaats en geboortegegevens, alsmede een verklaring dat zij elkaar niet als
      bloedverwanten bestaan in de derde of vierde graad in de zijlinie, dan wel een beëdigde verklaring als bedoeld
      in [artikel 41a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel41a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 41a
        afdeling: '1'
  - number: 44.1.b
    text: |-
      indien toestemming tot het aangaan van een huwelijk is vereist, de gegevens van degenen wier toestemming
      noodzakelijk is, dan wel het bewijs dat deze hun toestemming hebben verleend. De toestemming kan ook ter
      gelegenheid van de huwelijksvoltrekking worden gegeven. Is de toestemming door de rechter verleend, dan verifieert
      de ambtenaar het bestaan daarvan bij de betrokken griffie;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
  - number: 44.1.c
    text: de overlijdensgegevens van allen wier toestemming voor het huwelijk was vereist, als zij in leven waren geweest;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
  - number: 44.1.d
    text: de gegevens inzake ontbinding van eventuele eerdere huwelijken of geregistreerde partnerschappen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
  - number: 44.1.e
    text: in geval van stuiting, de gegevens inzake de opheffing daarvan;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
  - number: 44.1.f
    text: de ontheffing of de vergunning van Onze Minister van Justitie, ingeval deze is vereist;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
  - number: 44.1.g
    text: |-
      een vrijstelling krachtens [artikel 62][ref1], indien deze is verkregen;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel62
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '62'
        afdeling: '4'
  - number: 44.1.h
    text: de namen en adressen van de personen die als getuigen bij de voltrekking van het huwelijk aanwezig zullen zijn;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
  - number: 44.1.i
    text: |-
      ingeval een aanstaande echtgenoot niet de Nederlandse nationaliteit bezit of rechtmatig in Nederland verblijft als
      bedoeld in [artikel 8, onder b, d of e, van de Vreemdelingenwet 2000][ref1], een verklaring dat het voornemen om in
      het huwelijk te treden niet wordt aangegaan met het oogmerk om verblijfsrecht in Nederland te verkrijgen, alsmede
      een verklaring omtrent het verblijfsrecht van de aanstaande echtgenoot die niet de Nederlandse nationaliteit bezit;


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 44.1.j
    text: de naam van de gemeente in Nederland waar het huwelijk zal worden voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
  - number: '44.2'
    text: |-
      Wanneer de aanstaande echtgenoten, van wie ten minste één de Nederlandse nationaliteit bezit, buiten Nederland hun
      woonplaats hebben, kunnen zij zich ten behoeve van hun voornemen om in het huwelijk te treden uitsluitend tot de
      ambtenaar van de burgerlijke stand van de gemeente ’s-Gravenhage wenden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel44
  - number: '45.1'
    text: |-
      Indien de geboortegegevens van een aanstaande echtgenoot niet kunnen worden geverifieerd en deze niet in staat is
      om een geboorteakte over te leggen, kan de betrokkene jegens de ambtenaar van de burgerlijke stand ten overstaan
      van wie het huwelijk zal worden voltrokken een beëdigde verklaring afleggen inhoudende: het geslacht, de plaats,
      het land en, zo nauwkeurig mogelijk, de datum van geboorte alsmede de persoonsgegevens van de ouders.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel45
  - number: '45.2'
    text: In de huwelijksakte wordt van de afgelegde verklaring melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel45
  - number: 45a
    text: |-
      Indien de gegevens betreffende overlijden als bedoeld in [artikel 44, eerste lid, onder c][ref1], niet kunnen
      worden geverifieerd en de aanstaande echtgenoten niet in staat zijn om de akte of akten van overlijden over te
      leggen, kunnen zij terzake een beëdigde verklaring afleggen jegens de ambtenaar van de burgerlijke stand ten
      overstaan van wie het huwelijk zal worden voltrokken. Deze maakt daarvan melding in de huwelijksakte.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel44
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '44'
        afdeling: '2'
  - number: '46'
    text: |-
      Wanneer het huwelijk binnen een jaar, te rekenen vanaf de datum waarop het voornemen daartoe is kenbaar gemaakt,
      niet is voltrokken, mag het niet worden voltrokken dan nadat het voornemen daartoe opnieuw kenbaar is gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel46
  - number: '48'
    text: |-
      Indien hij die wil hertrouwen het gezag heeft over kinderen uit een vorig huwelijk, geeft de ambtenaar van de
      burgerlijke stand van dit voornemen onverwijld kennis aan de rechtbank van de woonplaats van de bedoelde ouder.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel48
  - number: '49.1'
    text: |-
      Trouwbeloften geven geen rechtsvordering tot het aangaan van een huwelijk, noch tot schadevergoeding wegens de
      niet-vervulling van de beloften; alle afwijkende bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel49
  - number: '49.2'
    text: |-
      Indien het voornemen tot het aangaan van een huwelijk aan een ambtenaar van de burgerlijke stand kenbaar is
      gemaakt, kan dit grond opleveren tot een vordering tot vergoeding der werkelijke vermogensverliezen, zonder dat
      daarbij enige winstderving in aanmerking komt. De vordering vervalt door verloop van achttien maanden, te rekenen
      vanaf de datum waarop het voornemen kenbaar is gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel49
  - number: 49a.1
    text: |-
      Indien een Nederlander buiten Nederland een huwelijk wenst aan te gaan, wordt op zijn verzoek aan hem een
      verklaring van huwelijksbevoegdheid overeenkomstig de bijlage van de Overeenkomst van München van 5 september 1980
      (Trb. 1981, 71, en 1982, 116) afgegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel49a
  - number: 49a.2
    text: 'Deze verklaring wordt afgegeven:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel49a
  - number: 49a.2.a
    text: aan degene die binnen Nederland woonplaats heeft, door de ambtenaar van de burgerlijke stand van zijn woonplaats;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel49a
  - number: 49a.2.b
    text: |-
      aan degene die binnen Nederland geen woonplaats heeft, maar wel heeft gehad, door de ambtenaar van de burgerlijke
      stand van de laatste woonplaats aldaar;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel49a
  - number: 49a.2.c
    text: |-
      aan degene die binnen Nederland geen woonplaats heeft of heeft gehad, door het hoofd van de diplomatieke of
      consulaire vertegenwoordiging van het Koninkrijk der Nederlanden in het ressort waar het huwelijk wordt voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel49a
  - number: 49a.3
    text: |-
      De verklaring wordt door de bevoegde autoriteit niet afgegeven alvorens deze, door verificatie van de
      gegevens, vermeld in [artikel 44, eerste lid, onder a, b, c, d en f][ref1], en zo nodig van die, vermeld in de
      [artikelen 45][ref2] en [45a][ref3], alsmede in [artikel 27b][ref4], zich ervan heeft overtuigd dat naar Nederlands
      recht geen beletselen tegen het huwelijk bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel45a
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '44'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '45'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 45a
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: 27b
        afdeling: '12'
  - number: 49a.4
    text: De verklaring van huwelijksbevoegdheid is, te rekenen van het tijdstip van afgifte, gedurende zes maanden geldig.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel49a
  - number: '50'
    text: |-
      Een huwelijk kan worden gestuit, wanneer partijen niet de vereisten in zich verenigen om een huwelijk aan te gaan,
      of wanneer partijen niet beiden hun vrije toestemming tot het huwelijk zullen geven dan wel wanneer het oogmerk
      van de aanstaande echtgenoten, of één hunner, niet is gericht op de vervulling van de door de wet aan de huwelijkse
      staat verbonden plichten, doch op het verkrijgen van toelating tot Nederland.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel50
  - number: '51.1'
    text: |-
      Bevoegd tot stuiting, wanneer partijen niet de vereisten in zich verenigen om een huwelijk aan te gaan, zijn
      bloedverwanten in de rechte lijn, broeders, zusters, voogden en curatoren van een der aanstaande echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel51
  - number: '51.2'
    text: |-
      De in het vorige lid genoemde personen zijn ook bevoegd een huwelijk te stuiten, wanneer de andere aanstaande
      echtgenoot onder curatele staat, en het huwelijk klaarblijkelijk het ongeluk zou veroorzaken van de partij, waarvan
      zij bloedverwant, voogd of curator zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel51
  - number: '52'
    text: |-
      Hij die met een der partijen door huwelijk verbonden is dan wel met een der partijen een geregistreerd partnerschap
      is aangegaan, kan op grond van het bestaan van dat huwelijk of dat geregistreerd partnerschap een nieuw aan te gaan
      huwelijk stuiten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel52
  - number: '53.1'
    text: |-
      Het openbaar ministerie is verplicht een voorgenomen huwelijk te stuiten, indien het met een der in de
      [artikelen 31 tot en met 33][ref1], [41][ref2] en [42][ref3] omschreven huwelijksbeletselen bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel42
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '31'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '42'
        afdeling: '1'
  - number: '53.2'
    text: |-
      Het openbaar ministerie is bevoegd het huwelijk als schijnhandeling wegens strijd met de Nederlandse openbare orde
      te stuiten indien het oogmerk van de aanstaande echtgenoten, of één hunner, niet is gericht op de vervulling van de
      door de wet aan de huwelijkse staat verbonden plichten, doch op het verkrijgen van toelating tot Nederland.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel53
  - number: '53.3'
    text: |-
      Het openbaar ministerie is voorts bevoegd het huwelijk te stuiten indien genoegzaam is gebleken dat de aanstaande
      echtgenoten, of één hunner, het huwelijk onder invloed van dwang zullen aangaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel53
  - number: '53.4'
    text: |-
      Voor de uitoefening van de in de leden 2 en 3 bedoelde bevoegdheid door het openbaar ministerie is voorafgaande
      machtiging van de rechtbank vereist.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel53
  - number: '54.1'
    text: |-
      De stuiting geschiedt door betekening van een akte aan de ambtenaar van de burgerlijke stand van de gemeente waar
      het huwelijk zal worden voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel54
  - number: '54.2'
    text: |-
      De akte houdt de keus van een woonplaats in die gemeente en de gronden van de stuiting in en vermeldt de
      hoedanigheid die aan de opposant de bevoegdheid geeft om het huwelijk te stuiten; alles op straffe van nietigheid.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel54
  - number: '54.3'
    text: |-
      De opposant zal afschrift der akte van stuiting onverwijld doen betekenen aan de partij, tegen welke de stuiting
      is gericht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel54
  - number: '55'
    text: 'Een stuiting kan worden opgeheven:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel55
  - number: 55.a
    text: op dezelfde wijze als waarop zij is geschied;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel55
  - number: 55.b
    text: |-
      door een verklaring, in persoon afgelegd ten overstaan van de ambtenaar van de burgerlijke stand, genoemd in het
      vorige artikel;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel55
  - number: 55.c
    text: door een verklaring, afgelegd ten overstaan van een notaris;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel55
  - number: 55.d
    text: door een in kracht van gewijsde gegane beschikking, gegeven op verzoek van een belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel55
  - number: '56'
    text: |-
      Het huwelijk mag niet worden voltrokken, voordat de stuiting is opgeheven. Mocht het desniettemin voltrokken
      zijn hangende een geding tot opheffing van de stuiting, dan kan dit geding op verlangen van de opposant worden
      voortgezet en wordt het huwelijk nietig verklaard, indien de rechter de gegrondheid der stuiting aanvaardt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel56
  - number: '57'
    text: |-
      Een ambtenaar van de burgerlijke stand aan wie het bestaan van een der in de [artikelen 31 tot en met 33][ref1],
      [41][ref2], [41a][ref3] en [42][ref4] omschreven huwelijksbeletselen bekend is, mag geen medewerking verlenen aan
      een huwelijksvoltrekking of aan de vervulling van daaraan voorafgaande formaliteiten, ook al zou geen stuiting
      hebben plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel41a
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel42
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '31'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 41a
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '42'
        afdeling: '1'
  - number: '58.1'
    text: |-
      De ambtenaar van de burgerlijke stand verifieert, alvorens tot de voltrekking van het huwelijk over te gaan,
      opnieuw de rechtmatigheid van het verblijf in Nederland van de aanstaande echtgenoot die niet de Nederlandse
      nationaliteit bezit.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel58
  - number: '58.2'
    text: |-
      Is de ambtenaar van de burgerlijke stand, in het geval geen rechtmatig verblijf bestaat op grond van
      [artikel 8, onder b, d of e van de Vreemdelingenwet 2000][ref1], van oordeel dat het oogmerk van de aanstaande
      echtgenoten, of één hunner, niet is gericht op de vervulling van de door de wet aan de huwelijkse staat verbonden
      plichten, maar op het verkrijgen van toelating tot Nederland, dan weigert hij de huwelijksakte op te maken
      overeenkomstig [artikel 18c, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel18c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 18c
        afdeling: '3'
  - number: '62.1'
    text: |-
      Het huwelijk mag niet worden voltrokken vóór de veertiende dag na de datum waarop het voornemen om in het huwelijk
      te treden aan de ambtenaar van de burgerlijke stand kenbaar is gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel62
  - number: '62.2'
    text: |-
      Het openbaar ministerie bij de rechtbank, binnen wier rechtsgebied de het voornemen om in het huwelijk te treden
      kenbaar is gemaakt, is bevoegd uit hoofde van gewichtige redenen vrijstelling te verlenen van de voorgeschreven
      wachttijd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel62
  - number: '63.1'
    text: |-
      Een huwelijk wordt in het openbaar in het gemeentehuis voltrokken ten overstaan van de ambtenaar van de burgerlijke
      stand van de door de aanstaande echtgenoten aangewezen gemeente in tegenwoordigheid van ten minste twee en ten
      hoogste vier meerderjarige getuigen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel63
  - number: '63.2'
    text: |-
      In het geval dat de melding van een voornemen om in het huwelijk te treden op elektronische
      wijze heeft plaatsgevonden, dienen de aanstaande echtgenoten uiterlijk ter gelegenheid van de
      huwelijksvoltrekking hun identiteit aan te tonen door overlegging van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '64'
    text: |-
      Indien een der partijen uit hoofde van een behoorlijk bewezen wettig beletsel verhinderd wordt zich naar het
      gemeentehuis te begeven, kan het huwelijk worden voltrokken in een bijzonder huis binnen dezelfde gemeente, mits
      dit in tegenwoordigheid van zes meerderjarige getuigen geschiedt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel64
  - number: '65'
    text: |-
      De aanstaande echtgenoten zijn verplicht bij de voltrekking van hun huwelijk in persoon voor de ambtenaar van de
      burgerlijke stand te verschijnen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel65
  - number: '66'
    text: |-
      Het staat Onze Minister van Justitie vrij, uit hoofde van gewichtige redenen aan partijen te vergunnen het huwelijk
      door een bijzondere bij authentieke akte gevolmachtigde te voltrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel66
  - number: '67.1'
    text: |-
      De aanstaande echtgenoten moeten ten overstaan van de ambtenaar van de burgerlijke stand en in tegenwoordigheid van
      de getuigen verklaren, dat zij elkander aannemen tot echtgenoten en dat zij getrouw alle plichten zullen vervullen,
      die door de wet aan de huwelijkse staat worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel67
  - number: '67.2'
    text: |-
      Terstond nadat deze verklaring is afgelegd, verklaart de ambtenaar van de burgerlijke stand, dat partijen door de
      echt aan elkander zijn verbonden, en maakt hij daarvan in het daartoe bestemde register een akte op.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel67
  - number: '68'
    text: |-
      Geen godsdienstige plechtigheden zullen mogen plaats hebben, voordat de partijen aan de bedienaar van de eredienst
      zullen hebben doen blijken, dat het huwelijk ten overstaan van de ambtenaar van de burgerlijke stand is voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel68
  - number: '69.1'
    text: |-
      Voor zover hieronder niet anders is bepaald, kan op grond dat de echtgenoten niet de vereisten in zich verenigden
      om tezamen een huwelijk aan te gaan, de nietigverklaring van het huwelijk worden verzocht door:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel69
  - number: 69.1.a
    text: de bloedverwanten in de rechte lijn van een der echtgenoten;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel69
  - number: 69.1.b
    text: ieder der echtgenoten;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel69
  - number: 69.1.c
    text: |-
      alle overige personen, die daarbij een onmiddellijk rechtsbelang hebben, echter deze alleen na de ontbinding van
      het huwelijk;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel69
  - number: 69.1.d
    text: het openbaar ministerie, echter alleen zolang het huwelijk niet is ontbonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel69
  - number: '69.2'
    text: |-
      Hij die met een der echtgenoten nog door een vroeger huwelijk dan wel door een eerder geregistreerd partnerschap is
      verbonden, is eveneens bevoegd op grond van het bestaan van dat huwelijk of die registratie de nietigverklaring van
      het daarna gesloten huwelijk te verzoeken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel69
  - number: '70.1'
    text: |-
      Op verzoek van de ouders, de echtgenoten en het openbaar ministerie kan een huwelijk worden nietig verklaard,
      wanneer het ten overstaan van een niet bevoegde ambtenaar van de burgerlijke stand of niet in tegenwoordigheid van
      het vereiste aantal getuigen is voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel70
  - number: '70.2'
    text: |-
      De bevoegdheid van een echtgenoot om uit dien hoofde de nietigverklaring van het huwelijk te verzoeken vervalt,
      indien er uiterlijk bezit van de huwelijkse staat en een akte van huwelijksvoltrekking ten overstaan van een
      ambtenaar van de burgerlijke stand verleden, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel70
  - number: '71.1'
    text: |-
      Een echtgenoot kan de nietigverklaring van zijn huwelijk verzoeken, wanneer hij dit onder invloed van dwang heeft
      gesloten. Tevens is het openbaar ministerie, na de echtgenoten in de gelegenheid te hebben gesteld hun mening
      omtrent de wenselijkheid van het indienen van het verzoek tot nietigverklaring kenbaar te maken, althans na deze
      daartoe behoorlijk te hebben opgeroepen, bevoegd tot het doen van het verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel71
  - number: '71.2'
    text: |-
      Voorts kan de echtgenoot, die bij de huwelijksvoltrekking gedwaald heeft hetzij in de persoon van de andere
      echtgenoot, hetzij omtrent de betekenis van de door hem afgelegde verklaring de nietigverklaring van zijn huwelijk
      verzoeken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel71
  - number: '71.3'
    text: |-
      De bevoegdheid de nietigverklaring wegens dwaling te verzoeken vervalt, wanneer de echtgenoten zes maanden
      hebben samengewoond sedert de ontdekking van de dwaling zonder dat het verzoek is gedaan. De bevoegdheid de
      nietigverklaring wegens dwang te verzoeken vervalt, wanneer de echtgenoten drie jaar hebben samengewoond zonder
      dwang gericht op instandhouding van het huwelijk, zonder dat het verzoek is gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel71
  - number: 71a
    text: |-
      Op verzoek van het openbaar ministerie kan een huwelijk als schijnhandeling wegens strijd met de Nederlandse
      openbare orde worden nietig verklaard indien het oogmerk van de echtgenoten, of één hunner, niet was gericht op
      de vervulling van de door de wet aan de huwelijkse staat verbonden plichten, doch op het verkrijgen van toelating
      tot Nederland.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel71a
  - number: '72'
    text: |-
      Een huwelijk kan niet nietig worden verklaard uit hoofde dat op het tijdstip van de huwelijksvoltrekking een
      der echtgenoten onder curatele stond, en het huwelijk klaarblijkelijk het ongeluk van de andere echtgenoot zou
      veroorzaken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel72
  - number: '73'
    text: |-
      De nietigverklaring van een huwelijk uit hoofde van een geestelijke stoornis kan na het ophouden van de stoornis
      alleen worden verzocht door de echtgenoot die geestelijk gestoord was. Het verzoek vervalt door een samenwoning van
      ten minste zes maanden na het ophouden van de stoornis.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel73
  - number: '74'
    text: |-
      De nietigverklaring van een huwelijk, dat aangegaan is door iemand die de vereiste leeftijd miste, kan niet worden
      verzocht wanneer deze op de dag van het verzoek de vereiste ouderdom heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel74
  - number: '75.1'
    text: |-
      Wegens het ontbreken van een vereiste toestemming van een derde kan de nietigverklaring van het huwelijk alleen
      door die derde of, in het geval van [artikel 38 van dit boek][ref1], door de curator worden verzocht. Dit verzoek
      vervalt, wanneer hij die bevoegd is de nietigverklaring te verzoeken, het huwelijk uitdrukkelijk of stilzwijgend
      heeft goedgekeurd, of wanneer drie maanden verlopen zijn nadat hij met de huwelijksvoltrekking bekend is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel38
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '38'
        afdeling: '1'
  - number: '75.2'
    text: |-
      Hij die bevoegd is de nietigverklaring te verzoeken, wordt vermoed met het huwelijk bekend te zijn geworden,
      wanneer het hier te lande is voltrokken, of wanneer het, buiten Nederland aangegaan, hier te lande in de registers
      van de burgerlijke stand is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel75
  - number: '76'
    text: |-
      Behoudens het in [artikel 56 van dit boek][ref1] bepaalde, verklaart de rechter een huwelijk alleen nietig op grond
      van een verzoek overeenkomstig de bepalingen van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel56
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '56'
        afdeling: '3'
  - number: '77.1'
    text: |-
      De nietigverklaring van het huwelijk werkt, zodra de beschikking in kracht van gewijsde is gegaan; zij werkt terug
      tot het tijdstip van de huwelijksvoltrekking.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel77
  - number: '77.2'
    text: 'Nochtans mist de beschikking terugwerkende kracht en heeft zij hetzelfde gevolg als een echtscheiding:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel77
  - number: 77.2.a
    text: ten aanzien van de kinderen der echtgenoten;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel77
  - number: 77.2.b
    text: |-
      ten aanzien van de te goeder trouw zijnde echtgenoot; deze kan echter niet op een gemeenschap van goederen
      aanspraak maken, wanneer het huwelijk wegens het bestaan van een vroeger huwelijk of een eerder geregistreerd
      partnerschap is nietig verklaard;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel77
  - number: 77.2.c
    text: |-
      ten aanzien van andere personen dan de echtgenoten en hun kinderen, voor zover zij te goeder trouw vóór de
      inschrijving der nietigverklaring rechten hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel77
  - number: '78'
    text: |-
      Het bestaan van een in Nederland gesloten huwelijk kan niet anders worden bewezen dan door de huwelijksakte dan
      wel door de akte van omzetting, bedoeld in [artikel 80g][ref1], behoudens in de gevallen bij de volgende artikelen
      voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80g
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80g
  - number: '79'
    text: |-
      Heeft het huwelijksregister niet bestaan of is het verloren gegaan of ontbreekt daaraan de huwelijksakte, dan wel
      de akte van omzetting, bedoeld in [artikel 80g][ref1], dan kan het huwelijk door getuigen of bescheiden worden
      bewezen, mits er een uiterlijk bezit van de huwelijkse staat aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80g
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80g
  - number: '80'
    text: |-
      Wordt in een geding betwist dat een kind, dat uiterlijk bezit van staat heeft, uit een huwelijk is geboren, dan
      levert het feit dat de ouders openlijk als man en vrouw hebben geleefd, voldoende bewijs op.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80
  - number: 80a.1
    text: |-
      Een persoon kan tegelijkertijd slechts met één andere persoon van hetzelfde of andere geslacht een geregistreerd
      partnerschap aangaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80a
  - number: 80a.2
    text: Zij die een geregistreerd partnerschap aangaan, mogen niet tegelijkertijd gehuwd zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80a
  - number: 80a.3
    text: |-
      Registratie van partnerschap geschiedt bij een akte van registratie van partnerschap opgemaakt door een ambtenaar
      van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80a
  - number: 80a.4
    text: |-
      Een partnerschapsregistratie kan worden gestuit, indien partijen niet de vereisten in zich verenigen om de
      registratie aan te gaan, of wanneer partijen niet beiden hun toestemming tot het geregistreerd partnerschap
      vrijelijk zullen geven, dan wel wanneer het oogmerk van de aanstaande geregistreerde partners, of één hunner,
      niet is gericht op de vervulling van de door de wet aan de partnerschapsregistratie verbonden plichten, doch
      op het verkrijgen van toelating tot Nederland. Op een stuiting zijn de [artikelen 51][ref1], [52][ref2],
      [53, tweede tot en met vierde lid][ref3], en [54 tot en met 56][ref4] van overeenkomstige toepassing. Het
      openbaar ministerie is verplicht een partnerschapsregistratie te stuiten, indien het met een van de in de
      [artikelen 31][ref5], [32][ref6], [41][ref7] en in het eerste en tweede lid van dit artikel omschreven beletselen
      bekend is. Indien aan de ambtenaar van de burgerlijke stand een van de in de vorige zin genoemde beletselen bekend
      is, of wanneer partijen niet beiden hun toestemming tot het geregistreerd partnerschap vrijelijk zullen geven, mag
      hij niet meewerken aan een registratie of daaraan voorafgaande formaliteiten verrichten, ook al zou geen stuiting
      hebben plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel32
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel41
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '51'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '52'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '53'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '54'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '31'
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0002656
        artikel: '32'
        afdeling: '1'
      - id: ref7
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
  - number: 80a.5
    text: |-
      Ter zake van de partnerschapsregistratie zijn de [artikelen 31][ref1], [32][ref2], [37 tot en met 39][ref3],
      [41][ref4], [41a][ref5], [44 tot en met 49][ref6], [58][ref7], en [62 tot en met 66][ref8] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel32
