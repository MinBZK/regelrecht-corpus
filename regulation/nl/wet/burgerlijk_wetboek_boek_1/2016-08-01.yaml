  - number: '420.3'
    text: |-
      De bewindvoerder heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling van Onze
      Minister van Veiligheid en Justitie zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel420
  - number: '420.4'
    text: De kantonrechter kan te allen tijde de bewindvoerder ontslaan en door een ander vervangen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel420
  - number: '421'
    text: |-
      Hetgeen in de vorige drie artikelen is bepaald omtrent erfgenamen, die goederen uit de nalatenschap ontvangen, is
      van overeenkomstige toepassing op de echtgenoot of geregistreerde partner, die goederen ontvangt ten gevolge van
      de ontbinding van enige gemeenschap van goederen of de afrekening uit hoofde van een verrekenbeding. Voor het uit
      dezen hoofde ontvangene behoeft echter geen zekerheid te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel421
  - number: '422.1'
    text: |-
      Wanneer de vermiste terugkeert, of wanneer blijkt dat de dag van overlijden in de akte van overlijden onjuist is
      vermeld, is ieder die enige goederen van de vermiste ingevolge de vorige artikelen in zijn bezit of onder zijn
      bewind heeft, aan de teruggekeerde of aan hen die alsdan blijken tot de goederen gerechtigd te zijn, rekening,
      verantwoording en afgifte schuldig.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel422
  - number: '422.2'
    text: |-
      Rechten door derden te goeder trouw verkregen worden geëerbiedigd. In geval echter goederen om niet zijn
      vervreemd, kan de rechter aan de rechthebbenden, en ten laste van hem die daardoor voordeel heeft genoten, een naar
      billijkheid te bepalen vergoeding toekennen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel422
  - number: '422.3'
    text: |-
      Is het leven van de vermiste ten behoeve van derden verzekerd geweest, dan behouden dezen hun recht op hetgeen aan
      hen op het tijdstip van de terugkeer van de verzekerde is uitbetaald of als reeds opeisbaar was verschuldigd; in
      dat geval kunnen aan de verzekering geen andere rechten op de uitkering worden ontleend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel422
  - number: '423.1'
    text: |-
      Indien binnen vijf jaar na de dag waarop de akte van overlijden overeenkomstig [artikel 417 van dit boek][ref1]
      is opgemaakt, wordt bewezen dat deze akte onjuist is, zijn zij die te goeder trouw de vruchten van de nalatenschap
      hebben genoten, slechts verplicht daarvan de helft terug te geven; wordt de onjuistheid later bewezen, dan behoeven
      zij geen vruchten terug te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel417
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel423
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '417'
        afdeling: '2'
  - number: '423.2'
    text: |-
      Indien eerst meer dan tien jaar na de dag waarop de akte is opgemaakt, wordt bewezen dat de akte onjuist is, zijn
      zij die de goederen te goeder trouw in bezit hebben genomen, slechts verplicht de alsdan nog aanwezige goederen
      in de staat waarin zij zich bevinden, af te geven, benevens de prijs van de vervreemde goederen of de goederen die
      daarvoor in de plaats zijn getreden; alles zonder enige vruchten of vergoeding voor niet meer aanwezige goederen en
      zonder verplichting van rekening en verantwoording.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel423
  - number: '423.3'
    text: |-
      Iedere verbintenis tot teruggave vervalt, wanneer twintig jaar na de dag waarop de akte is opgemaakt, zijn
      verlopen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel423
  - number: '425.1'
    text: |-
      Indien de achtergebleven echtgenote van een vermiste een nieuw huwelijk is aangegaan, doch de vermiste nog in
      leven was na de dag die als datum van overlijden was vermeld in de overeenkomstig [artikel 417 van dit boek][ref1]
      opgemaakte akte, zoals deze bij de voltrekking van het nieuwe huwelijk luidde, wordt niettemin voor de bepaling van
      de staat van haar kinderen die voor het nieuwe huwelijk zijn geboren, het huwelijk met de vermiste geacht te zijn
      ontbonden op de in die akte vermelde dag.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel417
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel425
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '417'
        afdeling: '2'
  - number: '425.2'
    text: |-
      De vermoedelijk overleden verklaarde voor wie bij diens terugkeer het gezag over zijn minderjarige kind niet is
      herleefd, kan de rechtbank verzoeken hem daarmede te belasten. Wanneer deze tezamen met de andere ouder verzoekt
      in het belang van hun kind hen gezamenlijk met het gezag te belasten, dan wel niet in het gezag is voorzien of een
      voogd het gezag uitoefent, wordt het verzoek slechts afgewezen indien gegronde vrees bestaat dat bij inwilliging
      de belangen van het kind zouden worden verwaarloosd. In de overige gevallen wordt het verzoek slechts ingewilligd
      indien de rechtbank dit in het belang van het kind wenselijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel425
  - number: '426.1'
    text: |-
      Indien het lichaam van een vermist persoon niet is kunnen worden teruggevonden doch, alle omstandigheden in
      aanmerking genomen, zijn overlijden als zeker kan worden beschouwd, kan op verzoek van het openbaar ministerie of
      van iedere belanghebbende de rechtbank verklaren dat de vermiste is overleden:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel426
  - number: 426.1.A
    text: indien de vermissing heeft plaatsgevonden in Nederland;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel426
  - number: 426.1.B
    text: |-
      indien de vermissing heeft plaatsgevonden tijdens een reis met een in Nederland thuisbehorend schip of
      luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel426
  - number: 426.1.C
    text: indien de vermiste Nederlander was;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel426
  - number: 426.1.D
    text: indien de vermiste zijn woon- of verblijfplaats had in Nederland.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel426
  - number: '426.2'
    text: |-
      Indien een persoon buiten Nederland is overleden en geen overlijdensakte is opgemaakt of kan worden overgelegd,
      kan op verzoek van het openbaar ministerie of van iedere belanghebbende de rechtbank verklaren dat die persoon
      is overleden:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel426
  - number: 426.2.A
    text: |-
      indien het overlijden heeft plaatsgevonden tijdens een reis met een in Nederland thuisbehorend schip of
      luchtvaartuig;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel426
  - number: 426.2.B
    text: indien de overledene Nederlander was;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel426
  - number: 426.2.C
    text: indien de overledene zijn woon- of verblijfplaats had in Nederland.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel426
  - number: '426.3'
    text: |-
      Voor zover mogelijk bevat het verzoek bedoeld in het eerste en tweede lid, of daarmee vergezeld gaande bescheiden
      de in [artikel 427 van dit boek][ref1] genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel427
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel426
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '427'
        afdeling: '3'
  - number: '427.1'
    text: |-
      De beschikking, houdende verklaring dat de in [artikel 426][ref1] bedoelde persoon is overleden, noemt de dag en
      zo mogelijk het uur van het overlijden. Indien de dag van overlijden niet bekend is, wordt deze door de rechtbank
      vastgesteld en in de beschikking vermeld. De rechtbank houdt hierbij rekening met alle bewijzen en aanwijzingen
      omtrent de omstandigheden waaronder, of het tijdstip waarop het overlijden moet hebben plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel426
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel427
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '426'
        afdeling: '3'
  - number: '427.2'
    text: |-
      Voorts vermeldt de beschikking de geslachtsnaam, de voornamen, de kunne en, zo mogelijk, de plaats van het
      overlijden, de woonplaats van de overledene, de plaats en de dag van geboorte van de overledene en de geslachtsnaam
      en de voornamen van de persoon of van de personen, met wie de overledene gehuwd is geweest of met wie de overledene
      een geregistreerd partnerschap was aangegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel427
  - number: '429'
    text: |-
      De griffier van het college waarvoor de zaak laatstelijk aanhangig was, zendt een afschrift van de beschikking,
      zodra deze in kracht van gewijsde is gegaan, aan de ambtenaar van de burgerlijke stand van de gemeente 's-
      Gravenhage. Deze maakt van de beschikking een akte van inschrijving op, die hij in het register van overlijden
      opneemt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel429
  - number: '430.1'
    text: |-
      De akten, opgemaakt volgens [artikel 429][ref1], gelden als akten van overlijden in de zin van
      [artikel 19f, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel429
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel19f
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel430
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '429'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 19f
        afdeling: '4'
  - number: '430.2'
    text: |-
      De [artikelen 422][ref1], [423][ref2] en [425][ref3] zijn van overeenkomstige toepassing, indien een persoon die
      met toepassing van [artikel 426][ref4] overleden is verklaard terugkeert alsmede indien bewezen wordt dat de dag
      van overlijden in de in [artikel 429][ref5] bedoelde akte onjuist is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel422
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel423
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel425
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel426
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel429
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel430
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '422'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '423'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '425'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '426'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '429'
        afdeling: '3'
  - number: '431.1'
    text: |-
      Indien een meerderjarige tijdelijk of duurzaam niet in staat is ten volle zijn vermogensrechtelijke belangen
      behoorlijk waar te nemen, als gevolg van
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel431
  - number: 431.1.a
    text: zijn lichamelijke of geestelijke toestand, dan wel
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel431
  - number: 431.1.b
    text: verkwisting of het hebben van problematische schulden,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel431
  - number: '431.2'
    text: |-
      Indien te verwachten is dat een minderjarige op het tijdstip waarop hij meerderjarig zal worden, in de in het
      vorige lid bedoelde toestand zal verkeren, kan het bewind reeds voor de meerderjarigheid worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel431
  - number: '431.3'
    text: |-
      Het bewind kan eveneens worden ingesteld indien te verwachten is dat de rechthebbende binnen afzienbare tijd in de
      in het eerste lid bedoelde toestand zal verkeren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel431
  - number: '431.4'
    text: |-
      De rechter bij wie een verzoek tot het verlenen van een voorlopige of voorwaardelijke
      machtiging, een observatiemachtiging of een machtiging tot voortgezet verblijf als bedoeld in de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], dan wel een machtiging als bedoeld in
      [artikel 33, eerste lid, van die wet][ref2] aanhangig is, is tevens bevoegd tot de kennisneming van een verzoek tot
      instelling van het bewind.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel33
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel431
    references:
      - id: ref1
        bwb_id: BWBR0005700
      - id: ref2
        bwb_id: BWBR0005700
        artikel: '33'
  - number: '432.1'
    text: |-
      Instelling van het bewind kan worden verzocht door de rechthebbende, zijn echtgenoot, zijn geregistreerde partner
      dan wel andere levensgezel, zijn bloedverwanten in de rechte lijn en in de zijlijn tot en met de vierde graad,
      degene die ingevolge [artikel 253sa][ref1] of [253t][ref2] het gezag over de rechthebbende uitoefent, zijn
      voogd, zijn curator als bedoeld in [titel 16][ref3] en zijn mentor als bedoeld in [titel 20][ref4]. In het in
      [artikel 431, derde lid][ref5], bedoelde geval kan het bewind uitsluitend worden verzocht door de rechthebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel431
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel432
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253t
        paragraaf: '2'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0002656
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '431'
  - number: '432.2'
    text: |-
      Instelling van het bewind kan voorts worden verzocht door het openbaar ministerie en door de instelling waar
      de rechthebbende wordt verzorgd of die aan de rechthebbende begeleiding biedt. Instelling van een bewind wegens
      verkwisting of het hebben van problematische schulden kan tevens worden verzocht door het college van burgemeester
      en wethouders van de gemeente waar de rechthebbende woonplaats heeft. In beide laatste gevallen vermeldt het
      verzoekschrift tevens waarom de in het eerste lid genoemde personen – bloedverwanten in de zijlijn in de derde en
      vierde graad daaronder niet begrepen – niet tot indiening van een verzoek zijn overgegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel432
  - number: '432.3'
    text: |-
      De rechter voor wie een verzoek tot ondercuratelestelling of tot opheffing van de curatele aanhangig is, kan bij
      afwijzing onderscheidenlijk bij inwilliging daarvan ambtshalve overgaan tot instelling van het bewind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel432
  - number: '432.4'
    text: |-
      Een verzoek tot instelling van een bewind ten behoeve van een rechthebbende die onder curatele is gesteld, wordt
      aanhangig gemaakt bij de rechter die bevoegd is over opheffing van de curatele te beslissen. Deze rechter kan, bij
      opheffing van een curatele, ook ambtshalve overgaan tot instelling van het bewind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel432
  - number: '432.5'
    text: |-
      In geval van een bestuursopdracht, of een verzoek daartoe, als bedoeld in [artikel 91][ref1] van dit boek, zijn het
      tweede en het derde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel91
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel432
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '91'
  - number: '433.1'
    text: |-
      Tenzij bij de onderbewindstelling anders is bepaald, omvat het bewind ook de goederen die geacht moeten worden in
      de plaats van een aan het bewind onderworpen goed te treden, benevens de vruchten en andere voordelen die een onder
      bewind staand goed oplevert.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel433
  - number: '433.2'
    text: |-
      De kantonrechter kan, hetzij op verzoek van degene die gerechtigd is onderbewindstelling te verzoeken als
      bedoeld in [artikel 432, eerste en tweede lid][ref1], hetzij ambtshalve, het ingestelde bewind tot een of
      meer andere goederen van de rechthebbende uitbreiden of een of meer goederen uit het bewind ontslaan en
      ook alsnog bepalen dat de regel van het eerste lid voor een of meer goederen niet zal gelden, in welk geval
      [artikel 434, eerste lid][ref2], van overeenkomstige toepassing is. De kantonrechter kan tevens handelingen als
      bedoeld in [artikel 441, tweede lid, onder f][ref3] aanwijzen en de aanwijzing van zulke handelingen intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel434
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel441
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel433
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '432'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '434'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '441'
  - number: '434.1'
    text: |-
      In beschikkingen als bedoeld in de [artikelen 432][ref1] en [433, tweede lid, van dit boek][ref2] bepaalt de
      rechter ambtshalve welke goederen onder bewind worden gesteld, onderscheidenlijk uit het bewind worden ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel433
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel434
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '432'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '433'
  - number: '434.2'
    text: |-
      Onderbewindstelling van een goed en het ontslag van een goed uit het bewind treden in werking daags nadat de
      beschikking is verstrekt of verzonden, tenzij de beschikking een later tijdstip van ingang vermeldt. In het geval,
      bedoeld in [artikel 431, tweede lid][ref1], treedt de onderbewindstelling in werking op het tijdstip waarop de
      rechthebbende meerderjarig wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel431
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel434
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '431'
  - number: '435.1'
    text: |-
      De rechter die het bewind instelt, benoemt daarbij of zo spoedig mogelijk daarna een bewindvoerder. Hij vergewist
      zich van de bereidheid en vormt zich een oordeel over de geschiktheid van de te benoemen persoon.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: '435.2'
    text: Zo nodig kan een tijdelijke bewindvoerder worden benoemd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: '435.3'
    text: |-
      De rechter volgt bij de benoeming van de bewindvoerder de uitdrukkelijke voorkeur van de rechthebbende, tenzij
      gegronde redenen zich tegen zodanige benoeming verzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: '435.4'
    text: |-
      Tenzij het vorige lid is toegepast, wordt, indien de rechthebbende is gehuwd, een geregistreerd partnerschap is
      aangegaan of anderszins een levensgezel heeft, bij voorkeur de echtgenoot, de geregistreerde partner dan wel andere
      levensgezel tot bewindvoerder benoemd. Is de vorige zin niet van toepassing dan wordt bij voorkeur een van zijn
      ouders, kinderen, broers of zusters tot bewindvoerder benoemd. Huwt de rechthebbende, gaat hij een geregistreerd
      partnerschap aan of verkrijgt hij een andere levensgezel, dan kan ieder van hen verzoeken dat de echtgenoot,
      de geregistreerde partner dan wel de andere levensgezel van de rechthebbende in de plaats van de tegenwoordige
      bewindvoerder wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: '435.5'
    text: Rechtspersonen met volledige rechtsbevoegdheid kunnen tot bewindvoerder worden benoemd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: '435.6'
    text: 'De volgende personen kunnen niet tot bewindvoerder worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.6.a
    text: handelingsonbekwamen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.6.b
    text: zij ten behoeve van wie een mentorschap is ingesteld;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.6.c
    text: |-
      zij van wie één of meer goederen onder een bewind als bedoeld in [titel 19][ref1] staan;


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 435.6.d
    text: zij die in staat van faillissement verkeren;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.6.e
    text: zij ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing is;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.6.f
    text: |-
      de bewindvoerder van de rechthebbende in de zin [artikel 287, derde lid, van de Faillissementswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel287
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '287'
  - number: 435.6.g
    text: een direct betrokken of behandelend hulpverlener;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.6.h
    text: |-
      personen behorende tot de leiding of tot het personeel van de instelling waar de rechthebbende wordt verzorgd of
      die aan de rechthebbende begeleiding biedt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.6.i
    text: |-
      personen verbonden met de instelling waar de rechthebbende wordt verzorgd of die aan de rechthebbende begeleiding
      biedt, doordat:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.6.i.1
    text: |-
      de instelling of personen behorende tot de leiding van de instelling, alleen of samen meer dan de helft van de
      stemrechten in de algemene vergadering van de rechtspersoon kunnen uitoefenen, dan wel meer dan de helft van de
      bestuurders of van de commissarissen van de rechtspersoon kunnen benoemen of ontslaan,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.6.i.2
    text: |-
      de persoon en de instelling deel uitmaken van een groep in de zin van [artikel 24b van boek 2][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 435.6.i.3
    text: de bestuurder van de rechtspersoon tevens behoort tot de leiding of het personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: '435.7'
    text: |-
      Een andere persoon dan in het vierde lid bedoeld, die ten behoeve van drie of meer personen bewindvoerder,
      curator of mentor is, komt alleen dan voor benoeming in aanmerking indien deze wat zijn bedrijfsvoering en
      scholing betreft, alsmede, voor zover van toepassing, de werving, de scholing en begeleiding van en het toezicht
      op de personen door wie hij de taken van een bewindvoerder uitoefent, voldoet aan bij algemene maatregel van
      bestuur te stellen kwaliteitseisen, alsmede aan de verplichtingen bedoeld in [artikel 436, vierde lid][ref1], en
      [artikel 15i van boek 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel436
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '436'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15i
  - number: '435.8'
    text: 'De persoon, bedoeld in het zevende lid, legt aan de rechter die hem benoemt, over:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.8.a
    text: zijn verklaring dat hij aan de in het zevende lid bedoelde kwaliteitseisen en verplichtingen voldoet,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.8.b
    text: |-
      een verslag van een accountant als bedoeld in [artikel 393, eerste lid, van boek 2][ref1], van diens bevindingen
      over de wijze waarop aan de eisen en verplichtingen wordt voldaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 435.8.c
    text: |-
      een verklaring van de accountant omtrent de balans en staat van baten en lasten, bedoeld in
      [artikel 10 van boek 2][ref1], dan wel, voor zover van toepassing, omtrent de jaarrekening overeenkomstig
      [titel 9 van boek 2][ref2]. [Artikel 396, zevende lid, van boek 2][ref3] is ten aanzien van
      [artikel 393 lid 1][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel396
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel393
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003045
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '396'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '393'
        afdeling: '1'
  - number: '435.9'
    text: 'Van de overlegging van de in het achtste lid bedoelde verklaring van de accountant zijn vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.9.a
    text: |-
      zij die een financiële onderneming zijn die ingevolge de [Wet op het financieel toezicht][ref1] het bedrijf van
      bank mogen uitoefenen,


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 435.9.b
    text: notarissen,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.9.c
    text: gerechtsdeurwaarders,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: 435.9.d
    text: accountants.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: '435.10'
    text: |-
      De benoemde wordt bewindvoerder daags nadat de beschikking is verstrekt of verzonden, tenzij de beschikking een
      later tijdstip vermeldt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel435
  - number: '436.1'
    text: |-
      De bewindvoerder is verplicht zo spoedig mogelijk een beschrijving van de aan het bewind
      onderworpen goederen op te maken en een afschrift daarvan in te leveren ter griffie van de ingevolge
      [artikel 266 van het Wetboek van Burgerlijke Rechtsvordering][ref1] bevoegde rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel266
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel436
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '266'
  - number: '436.2'
    text: |-
      De [artikelen 339][ref1], [363][ref2] en [364][ref3] van dit boek zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel339
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel363
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel364
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel436
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '363'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '364'
        paragraaf: '10'
        afdeling: '6'
  - number: '436.3'
    text: |-
      Indien tot het bewind registergoederen behoren, is de bewindvoerder verplicht zo spoedig mogelijk
      de desbetreffende rechterlijke beschikkingen en zijn benoeming in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3][ref1], te doen inschrijven. Is een onderneming of een aandeel in
      een vennootschap onder firma onder bewind gesteld, dan is de bewindvoerder verplicht de desbetreffende
      rechterlijke beschikkingen en zijn benoeming in het handelsregister te doen inschrijven. De kantonrechter
      kan, hetzij op verzoek van degene die gerechtigd is onderbewindstelling te verzoeken als bedoeld in
      [artikel 432, eerste en tweede lid][ref2], of van de bewindvoerder, hetzij ambtshalve bepalen dat een beschikking
      tot onderbewindstelling wegens een lichamelijke of geestelijke toestand, voor zover het bewind alle goederen
      betreft, die de rechthebbende toebehoren of zullen toebehoren, en een beschikking houdende benoeming, schorsing
      of ontslag van de bewindvoerder vanwege de griffier in het register, bedoeld in [artikel 391][ref3], worden
      ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel432
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel391
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel436
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '432'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '391'
  - number: '436.4'
    text: |-
      Tenzij de kantonrechter anders bepaalt, is de bewindvoerder verplicht zo spoedig mogelijk een rekening te openen
      bij een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf
      van bank mag uitoefenen; de bewindvoerder is voorts verplicht om uitsluitend voor de betalingen die hij bij de
      vervulling van zijn taak verricht of ontvangt zoveel mogelijk van deze rekening gebruik te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel436
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '436.5'
    text: |-
      De kantonrechter kan te allen tijde de bewindvoerder ten verhore doen oproepen. Deze is verplicht alle door de
      kantonrechter gewenste inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel436
  - number: '436.6'
    text: |-
      De kantonrechter kan van de bewindvoerder verlangen dat hij inzage geeft van zijn boeken, bescheiden en andere
      gegevensdragers. Hij kan voorts een afschrift daarvan verlangen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel436
  - number: '437.1'
    text: De rechter kan twee bewindvoerders benoemen, tenzij gegronde redenen zich tegen zodanige benoeming verzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel437
  - number: '437.2'
    text: |-
      Zijn er twee bewindvoerders, dan kan, tenzij de rechter anders bepaalt, ieder van hen alle werkzaamheden die tot
      het bewind behoren, alleen verrichten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel437
  - number: '437.3'
    text: |-
      Bij verschil van mening tussen de bewindvoerders beslist op verzoek van één van hen of van een instelling als
      bedoeld in [artikel 432, tweede lid][ref1], de kantonrechter. Deze kan ook een verdeling van het loon vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel432
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel437
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '432'
  - number: '438.1'
    text: |-
      Tijdens het bewind komt het beheer over de onder bewind staande goederen niet toe aan de rechthebbende maar aan
      de bewindvoerder.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel438
  - number: '438.2'
    text: |-
      Tijdens het bewind kan de rechthebbende slechts met medewerking van de bewindvoerder of, indien deze weigerachtig
      is, met machtiging van de kantonrechter over de onder het bewind staande goederen beschikken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel438
  - number: '439.1'
    text: |-
      Indien een rechtshandeling ongeldig is, omdat zij ondanks het bewind werd verricht door of gericht tot de
      rechthebbende, kan deze ongeldigheid aan de wederpartij slechts worden tegengeworpen, zo deze het bewind kende of
      had behoren te kennen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel439
  - number: '439.2'
    text: |-
      Indien een goed is vervreemd of bezwaard door iemand die daartoe ingevolge het bewind niet bevoegd was, kan deze
      onbevoegdheid aan een verkrijger van het goed of een beperkt recht daarop slechts worden tegengeworpen, zo deze het
      bewind kende of had behoren te kennen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel439
  - number: '440.1'
    text: |-
      Schulden die voortspruiten uit een handeling, tijdens het bewind met of jegens de rechthebbende, anders dan in
      overeenstemming met [artikel 438, tweede lid][ref1], verricht door een schuldeiser die het bewind kende of had
      behoren te kennen, kunnen niet op de onder het bewind staande goederen worden verhaald. Het einde van het bewind
      brengt hierin geen wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel438
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '438'
  - number: '440.2'
    text: |-
      Indien het bewind alle goederen betreft die daarvoor krachtens [artikel 431, eerste lid][ref1], in aanmerking
      komen, is het eerste lid van overeenkomstige toepassing ten aanzien van ten tijde van de handeling niet onder het
      bewind staande goederen waarop verhaal mogelijk zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel431
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel440
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '431'
  - number: '441.1'
    text: |-
      Tijdens het bewind vertegenwoordigt de bewindvoerder bij de vervulling van zijn taak de rechthebbende in en
      buiten rechte. De bewindvoerder draagt zorg voor een doelmatige belegging van het vermogen van de rechthebbende,
      voor zover dit onder het bewind staat en niet besteed behoort te worden voor een voldoende verzorging van de
      rechthebbende. De bewindvoerder kan voorts voor de rechthebbende alle handelingen verrichten die aan een goed
      bewind bijdragen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel441
  - number: '441.2'
    text: |-
      Hij behoeft echter toestemming van de rechthebbende of, indien deze daartoe niet in staat of weigerachtig is,
      machtiging van de kantonrechter voor de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel441
  - number: 441.2.a
    text: |-
      beschikken en aangaan van overeenkomsten tot beschikking over een onder het bewind staand goed, tenzij de handeling
      als een gewone beheersdaad kan worden beschouwd of krachtens rechterlijk bevel geschiedt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel441
  - number: 441.2.b
    text: een making of gift waaraan lasten of voorwaarden zijn verbonden, aannemen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel441
  - number: 441.2.c
    text: geld lenen of de rechthebbende als borg of hoofdelijke medeschuldenaar verbinden;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel441
  - number: 441.2.d
    text: |-
      overeenkomen dat een boedel, waartoe de rechthebbende gerechtigd is, voor een bepaalde tijd onverdeeld wordt
      gelaten;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel441
  - number: 441.2.e
    text: |-
      het aangaan, buiten het geval van [artikel 87 van het Wetboek van Burgerlijke Rechtsvordering][ref1], van een
      overeenkomst tot het beëindigen van een geschil, tenzij het voorwerp van het geschil een waarde van € 700 niet te
      boven gaat;


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel87
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel441
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '87'
  - number: 441.2.f
    text: andere bij de instelling van het bewind of nadien aangewezen handelingen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel441
  - number: '441.3'
    text: |-
      De kantonrechter kan ook aan de bewindvoerder een doorlopende machtiging met zodanige voorwaarden als hij geraden
      acht, verlenen om handelingen als in het vorige lid bedoeld te verrichten en een verleende machtiging te allen
      tijde wijzigen of intrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel441
  - number: '441.4'
    text: |-
      De bewindvoerder is, met uitsluiting van de rechthebbende, bevoegd de verdeling te vorderen van goederen, waarvan
      een onverdeeld aandeel tot zijn bewind behoort. Tot een verdeling, ook al geschiedt zij krachtens rechterlijk
      bevel, behoeft de bewindvoerder toestemming of machtiging overeenkomstig het tweede lid. De kantonrechter kan, in
      stede van machtiging te verlenen, met overeenkomstige toepassing van [artikel 181 van Boek 3][ref1] een onzijdig
      persoon benoemen, die in plaats van de bewindvoerder de rechthebbende bij de verdeling vertegenwoordigt.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel181
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel441
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '181'
  - number: '441.5'
    text: |-
      De bewindvoerder is, met uitsluiting van de rechthebbende, bevoegd een aan de rechthebbende opgekomen nalatenschap
      te aanvaarden. Tenzij de aanvaarding geschiedt met toestemming van de rechthebbende, kan de bewindvoerder niet
      anders aanvaarden dan onder het voorrecht van boedelbeschrijving.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel441
  - number: '442.1'
    text: |-
      Heeft iemand als bewindvoerder een rechtshandeling verricht, dan richten de rechten en verplichtingen van de
      wederpartij zich naar hetgeen dienaangaande is bepaald in [titel 3 van Boek 3][ref1]. Regels die de bevoegdheid van
      een bewindvoerder betreffen en feiten die voor een oordeel omtrent zijn bevoegdheid van belang zijn, kunnen niet
      aan de wederpartij worden tegengeworpen, indien deze daarmee niet bekend was of had behoren te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0005291
  - number: '442.2'
    text: |-
      De rechthebbende is, onverminderd het bepaalde in [artikel 172 van Boek 6][ref1], aansprakelijk voor alle schulden
      die voortspruiten uit rechtshandelingen die de bewindvoerder in zijn hoedanigheid in naam van de rechthebbende
      verricht. Wanneer hij onder bewind staande goederen aanwijst die voor de schuld voldoende verhaal bieden, is hij
      niet verplicht de schuld ten laste van zijn overige vermogen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel172
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel442
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '172'
  - number: '443'
    text: |-
      De bewindvoerder kan alvorens in rechte op te treden zich te zijner verantwoording doen machtigen door de
      rechthebbende of, indien deze daartoe niet in staat of weigerachtig is, door de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel443
  - number: '444'
    text: |-
      Een bewindvoerder is jegens de rechthebbende aansprakelijk, indien hij in de zorg van een goed bewindvoerder te
      kort schiet, tenzij de tekortkoming hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel444
  - number: '445.1'
    text: |-
      De bewindvoerder legt, tenzij andere tijdstippen zijn bepaald, jaarlijks en aan het einde van het bewind rekening
      en verantwoording af aan de rechthebbende, alsmede aan het einde van zijn taak aan zijn opvolger. De rekening en
      verantwoording wordt afgelegd ten overstaan van de kantonrechter. Onze Minister van Veiligheid en Justitie kan een
      model vaststellen volgens hetwelk de rekening en verantwoording moet worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel445
  - number: '445.2'
    text: |-
      Indien de rechthebbende niet in staat is de rekening op te nemen, of het onzeker is wie de rechthebbende is, wordt
      de rekening en verantwoording afgelegd aan de kantonrechter. Goedkeuring van deze rekening en verantwoording door
      de kantonrechter belet niet dat de rechthebbende na het einde van het bewind nogmaals over dezelfde tijdsruimte
      rekening en verantwoording vraagt, voor zover dit niet onredelijk is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel445
  - number: '445.3'
    text: |-
      De kantonrechter kan de bewindvoerder - hetzij op diens verzoek, hetzij ambtshalve - vrijstellen van de
      verplichting om de periodieke rekening en verantwoording te zijnen overstaan af te leggen; hij kan ook bepalen
      dat deze wijze van aflegging der rekening en verantwoording slechts om een door hem te bepalen aantal jaren zal
      geschieden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel445
  - number: '445.4'
    text: |-
      De bewindvoerder, bedoeld in [artikel 435, zevende lid][ref1], legt jaarlijks de verklaringen en het verslag over,
      bedoeld in artikel 435, achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel435
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel445
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '435'
  - number: '445.5'
    text: |-
      Voor het overige vindt het aangaande de voogdijrekening in de [paragrafen 10][ref1] en
      [11 van afdeling 6 van titel 14][ref2] bepaalde overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling6
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling6
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel445
    references:
      - id: ref1
        bwb_id: BWBR0002656
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        paragraaf: '11'
        afdeling: '6'
  - number: '446.1'
    text: |-
      Voor zover de kantonrechter niet anders bepaalt, wordt bij het afleggen van de periodieke rekening en
      verantwoording hetgeen de goederen netto aan vruchten hebben opgebracht, onder aftrek van de verschuldigde
      beloning, aan de rechthebbende uitgekeerd. Op verzoek van de rechthebbende kan de kantonrechter andere tijdstippen
      voor de uitkering vaststellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel446
  - number: '446.2'
    text: |-
      Bij zijn eindrekening en verantwoording draagt de bewindvoerder alle goederen af aan hem die na hem tot het beheer
      der goederen bevoegd is. De bewindvoerder is bevoegd de afdracht op te schorten tot de voldoening van een hem
      toekomend saldo.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel446
  - number: '446.3'
    text: |-
      Wordt de rekening en verantwoording aan de kantonrechter afgelegd, dan blijven, tenzij de kantonrechter anders
      bepaalt, de netto-opbrengst of de af te dragen goederen onder het bewind van de bewindvoerder, totdat de
      rechthebbende tot de ontvangst in staat is of de onzekerheid, wie rechthebbende is, is opgeheven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel446
  - number: 446a
    text: |-
      De bewindvoerder doet telkens na verloop van vijf jaren, of zo veel eerder als de kantonrechter bepaalt, aan deze
      verslag van het verloop van het bewind. Hij laat zich daarbij met name uit over de vraag of het bewind dient voort
      te duren dan wel of een minder ver, of een verder strekkende voorziening aangewezen is. Feiten die voor het bewind
      en het voortduren daarvan van betekenis zijn, deelt hij terstond aan de kantonrechter mede.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel446a
  - number: '447.1'
    text: |-
      De bewindvoerder heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling van Onze
      Minister van Veiligheid en Justitie zijn vastgesteld. Op grond van bijzondere omstandigheden kan de kantonrechter,
      hetzij ambtshalve, hetzij op verzoek van de bewindvoerder of van de rechthebbende, voor bepaalde of onbepaalde tijd
      de beloning anders regelen dan bij de instelling of door de wet is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel447
  - number: '447.2'
    text: |-
      Zijn er twee of meer bewindvoerders, dan wordt het loon dat hun gezamenlijk toekomt, tussen hen verdeeld in
      evenredigheid met de betekenis van de door ieder van hen verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel447
  - number: '448.1'
    text: 'De taak van de bewindvoerder eindigt:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel448
  - number: 448.1.a
    text: bij het einde van het bewind;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel448
  - number: 448.1.b
    text: door tijdsverloop, indien hij voor een bepaalde tijd was benoemd;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel448
  - number: 448.1.c
    text: |-
      door zijn dood, het ten aanzien van hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen, zijn faillietverklaring of zijn ondercuratelestelling;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel448
  - number: 448.1.d
    text: door de instelling van een bewind als bedoeld in deze titel over één of meer van zijn goederen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel448
  - number: 448.1.e
    text: door ontslag dat hem door de kantonrechter met ingang van een door deze bepaalde dag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel448
  - number: '448.2'
    text: |-
      Het ontslag wordt hem verleend hetzij op eigen verzoek, hetzij wegens gewichtige redenen of omdat hij niet meer
      voldoet aan de eisen om bewindvoerder te kunnen worden, zulks op verzoek van de medebewindvoerder of degene die
      gerechtigd is onderbewindstelling te verzoeken als bedoeld in [artikel 432, eerste en tweede lid][ref1], dan
      wel ambtshalve. Hangende het onderzoek kan de kantonrechter voorlopige voorzieningen in het bewind treffen en de
      bewindvoerder schorsen. De kantonrechter kan hiertoe zo nodig ook zonder de bewindvoerder tevoren te hebben gehoord
      overgaan. In dat geval verliest de beschikking haar kracht na verloop van twee weken, tenzij de bewindvoerder
      binnen deze termijn in de gelegenheid is gesteld om te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel432
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel448
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '432'
  - number: '448.3'
    text: |-
      Een gewezen bewindvoerder blijft verplicht al datgene te doen, wat niet zonder nadeel voor de rechthebbende kan
      worden uitgesteld, totdat degene die na hem tot het beheer van de goederen bevoegd is, dit heeft aanvaard. In
      de gevallen genoemd in het eerste lid onder *c*, rust deze verplichting op zijn erfgenamen, onderscheidenlijk
      de bewindvoerder in de schuldsaneringsregeling natuurlijke personen of de curator, indien zij van het bewind
      kennisdragen; in het geval genoemd in het eerste lid onder *d*, geldt dit voor de bewindvoerder, belast met het
      daar bedoelde bewind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel448
  - number: '448.4'
    text: |-
      [Artikel 384 van dit boek][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel384
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel448
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '384'
  - number: '448.5'
    text: |-
      In geval van ontslag wegens gewichtige redenen of omdat de bewindvoerder niet meer voldoet aan de eisen om
      bewindvoerder te kunnen worden, kan de kantonrechter bepalen dat geen verdere rekening en verantwoording behoeft te
      worden afgelegd. Tevens kan de kantonrechter de boeken, bescheiden en andere gegevensdragers van de bewindvoerder,
      en alle aan de rechthebbende toekomende goederen in beslag nemen. Daartoe kan hij elke plaats betreden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel448
  - number: '449.1'
    text: |-
      Het bewind eindigt door het verstrijken van de tijdsduur waarvoor het is ingesteld en door de dood of
      ondercuratelestelling van de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel449
  - number: '449.2'
    text: |-
      De kantonrechter kan, indien de noodzaak daartoe niet meer bestaat of voortzetting van het bewind niet zinvol
      is gebleken, het bewind opheffen, zulks op verzoek van de bewindvoerder of van degene die gerechtigd is
      onderbewindstelling te verzoeken als bedoeld in [artikel 432, eerste en tweede lid][ref1], dan wel ambtshalve. De
      beschikking treedt in werking zodra zij in kracht van gewijsde is gegaan, tenzij zij een eerder tijdstip van ingang
      aanwijst.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel432
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel449
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '432'
  - number: '449.3'
    text: |-
      Degene die gerechtigd is de instelling van het bewind te verzoeken als bedoeld in
      [artikel 432, eerste en tweede lid][ref1], alsmede de bewindvoerder, kan verzoeken om verlenging van het bewind
      dat voor een bepaalde tijdsduur is ingesteld. De kantonrechter beslist binnen twee maanden na het indienen van
      het verzoekschrift. [Artikel 384][ref2] is van overeenkomstige toepassing. Tegen de afwijzing van een verzoek tot
      verlenging staat geen hogere voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel384
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel449
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '432'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '384'
  - number: '450.1'
    text: |-
      Indien een meerderjarige als gevolg van zijn geestelijke of lichamelijke toestand tijdelijk of duurzaam niet in
      staat is of bemoeilijkt wordt zijn belangen van niet-vermogensrechtelijke aard zelf behoorlijk waar te nemen, kan
      de kantonrechter te zijnen behoeve een mentorschap instellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel450
  - number: '450.2'
    text: |-
      Indien te verwachten is dat een minderjarige op het tijdstip waarop hij meerderjarig zal worden, in de in het
      eerste lid bedoelde toestand zal verkeren, kan het mentorschap reeds voor de meerderjarigheid worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel450
  - number: '450.3'
    text: |-
      Het mentorschap kan eveneens worden ingesteld, indien te verwachten is dat een meerderjarige binnen afzienbare tijd
      in de in het eerste lid bedoelde toestand zal verkeren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel450
  - number: '450.4'
    text: |-
      De rechter bij wie een verzoek tot het verlenen van een voorlopige of voorwaardelijke
      machtiging, een observatiemachtiging of een machtiging tot voortgezet verblijf als bedoeld in de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], dan wel een machtiging als bedoeld in
      [artikel 33, eerste lid, van die wet][ref2] aanhangig is, is tevens bevoegd tot kennisneming van een verzoek tot
      instelling van een mentorschap.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel33
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel450
    references:
      - id: ref1
        bwb_id: BWBR0005700
      - id: ref2
        bwb_id: BWBR0005700
        artikel: '33'
  - number: '451.1'
    text: |-
      Het mentorschap kan worden verzocht door de betrokken persoon, zijn echtgenoot, zijn geregistreerde partner
      dan wel andere levensgezel, zijn bloedverwanten in de rechte lijn en die in de zijlijn tot en met de vierde
      graad, degene die ingevolge [artikel 253sa][ref1] of [253t][ref2] het gezag over de betrokken persoon uitoefent,
      zijn voogd, zijn curator of zijn bewindvoerder als bedoeld in [titel 19][ref3] van dit boek. In het in
      [artikel 450, derde lid][ref4], van dit boek bedoelde geval kan het mentorschap uitsluitend worden verzocht door
      de betrokkene.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel450
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel451
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253t
        paragraaf: '2'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '450'
  - number: '451.2'
    text: |-
      Het mentorschap kan, behoudens in het in [artikel 450, derde lid][ref1], bedoelde geval, voorts worden verzocht
      door het openbaar ministerie en door de instelling waar de betrokkene wordt verzorgd of die aan de betrokkene
      begeleiding biedt. In het laatste geval wordt in het verzoekschrift tevens vermeld waarom de in het eerste lid
      genoemde personen - bloedverwanten in de zijlijn in de derde en vierde graad daaronder niet begrepen - niet tot
      indiening van een verzoek zijn overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel450
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel451
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '450'
  - number: '451.3'
    text: |-
      De rechter bij wie een verzoek tot ondercuratelestelling of tot opheffing van de curatele aanhangig is, kan bij
      afwijzing onderscheidenlijk bij inwilliging daarvan ambtshalve overgaan tot instelling van het mentorschap.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel451
  - number: '451.4'
    text: |-
      Een verzoek tot omzetting van curatele in mentorschap ten behoeve van een persoon die onder curatele is gesteld,
      wordt aanhangig gemaakt bij de rechter die bevoegd is over opheffing van de curatele te beslissen. Deze rechter
      kan, bij opheffing van de curatele, ook ambtshalve overgaan tot instelling van het mentorschap.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel451
  - number: '451.5'
    text: |-
      Het mentorschap treedt in werking daags nadat de beschikking is verstrekt of verzonden, tenzij de beschikking een
      later tijdstip van ingang vermeldt. In het geval, bedoeld in [artikel 450, tweede lid][ref1], van dit boek treedt
      het mentorschap in werking op het tijdstip waarop de betrokken persoon meerderjarig wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel450
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel451
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '450'
  - number: '452.1'
    text: |-
      De rechter die het mentorschap instelt, benoemt daarbij of zo spoedig mogelijk daarna een mentor. Hij vergewist
      zich van de bereidheid en vormt zich een oordeel over de geschiktheid van de te benoemen persoon.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: '452.2'
    text: Zo nodig kan een tijdelijke mentor worden benoemd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: '452.3'
    text: |-
      De rechter volgt bij de benoeming van de mentor de uitdrukkelijke voorkeur van de betrokkene, tenzij gegronde
      redenen zich tegen zodanige benoeming verzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: '452.4'
    text: |-
      Tenzij het vorige lid is toegepast, wordt, indien de betrokkene is gehuwd, een geregistreerd partnerschap is
      aangegaan of anderszins een levensgezel heeft, bij voorkeur de echtgenoot, de geregistreerde partner dan wel andere
      levensgezel tot mentor benoemd. Is de vorige zin niet van toepassing dan wordt bij voorkeur een van zijn ouders,
      kinderen, broers of zusters tot mentor benoemd. Huwt de betrokkene, gaat hij een geregistreerd partnerschap aan of
      verkrijgt hij een andere levensgezel, dan kan ieder van hen verzoeken, dat de echtgenoot, de geregistreerde partner
      dan wel de andere levensgezel van de betrokkene in de plaats van de tegenwoordige mentor wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: '452.5'
    text: Een rechtspersoon met volledige rechtsbevoegdheid komt voor benoeming tot mentor in aanmerking.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: '452.6'
    text: 'De volgende personen kunnen niet tot mentor worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: 452.6.a
    text: handelingsonbekwamen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: 452.6.b
    text: zij ten behoeve van wie een mentorschap is ingesteld;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: 452.6.c
    text: de direct betrokken of behandelend hulpverlener;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: 452.6.d
    text: |-
      personen behorende tot de leiding of tot het personeel van de instelling waar de betrokkene wordt verzorgd of die
      aan de betrokkene begeleiding biedt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: 452.6.e
    text: |-
      personen verbonden met de instelling waar de betrokkene wordt verzorgd of die aan de betrokkene begeleiding biedt,
      doordat:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: 452.6.e.1
    text: |-
      de instelling of personen behorende tot de leiding van de instelling, alleen of samen meer dan de helft van de
      stemrechten in de algemene vergadering van de rechtspersoon kunnen uitoefenen, dan wel meer dan de helft van de
      bestuurders of van de commissarissen van de rechtspersoon kunnen benoemen of ontslaan,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: 452.6.e.2
    text: |-
      de persoon en de instelling deel uitmaken van een groep in de zin van [artikel 24b van boek 2][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 452.6.e.3
    text: de bestuurder van de rechtspersoon tevens behoort tot de leiding of het personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: '452.7'
    text: |-
      Een andere persoon dan in het vierde lid bedoeld, die ten behoeve van drie of meer personen mentor, curator of
      bewindvoerder is, komt alleen dan voor benoeming in aanmerking indien deze wat zijn bedrijfsvoering en scholing
      betreft, alsmede, voor zover van toepassing, de werving, de scholing en begeleiding van en het toezicht op de
      personen door wie hij de taken van een mentor uitoefent, voldoet aan bij algemene maatregel van bestuur te stellen
      kwaliteitseisen, alsmede aan de verplichtingen bedoeld in [artikel 15i van boek 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15i
  - number: '452.8'
    text: 'De persoon, bedoeld in het zevende lid, legt aan de rechter die hem benoemt, over:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: 452.8.a
    text: zijn verklaring dat hij aan de in het zevende lid bedoelde kwaliteitseisen en verplichtingen voldoet,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: 452.8.b
    text: |-
      een verslag van een accountant als bedoeld in [artikel 393, eerste lid, van boek 2][ref1], dan wel van een door de
      kantonrechter benoemde deskundige, van diens bevindingen over de wijze waarop aan de eisen wordt voldaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 452.8.c
    text: |-
      een verklaring van de accountant omtrent de balans en staat van baten en lasten, bedoeld in
      [artikel 10 van boek 2][ref1], dan wel, voor zover van toepassing, omtrent de jaarrekening overeenkomstig
      [titel 9 van boek 2][ref2]. [Artikel 396, zevende lid, van boek 2][ref3] is ten aanzien van
      [artikel 393 lid 1][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel396
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel393
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003045
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '396'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '393'
        afdeling: '1'
  - number: '452.9'
    text: |-
      De rechter kan twee mentoren benoemen, tenzij gegronde redenen zich tegen zodanige benoeming verzetten. Zijn
      er twee mentoren, dan kan ieder van hen de taken die aan een mentor toekomen, alleen verrichten. De rechter kan
      zo nodig een taakverdeling tussen de mentoren vaststellen. Bij verschil van mening tussen de mentoren beslist
      op verzoek van een van hen of op verzoek van een instelling als bedoeld in [artikel 451, tweede lid][ref1], de
      kantonrechter. Deze kan ook een verdeling van de beloning vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel451
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '451'
  - number: '452.10'
    text: |-
      De taak van de mentor vangt aan daags nadat de beschikking, houdende de benoeming, is verstrekt of verzonden,
      tenzij de beschikking een later tijdstip vermeldt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel452
  - number: '453.1'
    text: |-
      Tenzij uit wet of verdrag anders voortvloeit, is de betrokkene tijdens het mentorschap onbevoegd rechtshandelingen
      te verrichten in aangelegenheden betreffende zijn verzorging, verpleging, behandeling en begeleiding.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel453
  - number: '453.2'
    text: |-
      Met betrekking tot de in het eerste lid bedoelde rechtshandelingen vertegenwoordigt de mentor de betrokkene in en
      buiten rechte, tenzij op grond van wet of verdrag vertegenwoordiging uitgesloten is. De mentor kan de betrokkene
      toestemming verlenen deze rechtshandelingen zelf te verrichten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel453
  - number: '453.3'
    text: |-
      Ten aanzien van andere handelingen dan rechtshandelingen betreffende de in het eerste lid genoemde aangelegenheden
      treedt de mentor, voor zover de aard van de desbetreffende handeling dit toelaat, in plaats van de betrokkene op.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel453
  - number: '453.4'
    text: |-
      De mentor geeft aan de betrokkene raad in hem betreffende aangelegenheden van niet-vermogensrechtelijke aard en
      waakt over diens belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel453
  - number: '453.5'
    text: |-
      Verzet de betrokkene zich tegen een handeling van ingrijpende aard in aangelegenheden als in het tweede en derde
      lid bedoeld, dan kan die handeling slechts plaatsvinden indien zij kennelijk nodig is teneinde ernstig nadeel voor
      de betrokkene te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel453
  - number: 453a.1
    text: |-
      Indien de rechter dit noodzakelijk acht, beslist hij tevens dat [artikel 246, van dit boek][ref1] van
      overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel453a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
  - number: 453a.2
    text: |-
      Tijdens het mentorschap kan de rechter een beslissing nemen als in het eerste lid bedoeld, hetzij op verzoek van
      een persoon als bedoeld in [artikel 451, eerste en tweede lid][ref1], van de mentor of van het openbaar ministerie,
      hetzij ambtshalve.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel451
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel453a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '451'
  - number: '454.1'
    text: |-
      De mentor is gehouden degene ten behoeve van wie het mentorschap is ingesteld zo veel mogelijk bij de vervulling
      van zijn taak te betrekken. De mentor bevordert dat de betrokkene rechtshandelingen en andere handelingen zelf
      verricht, indien deze tot een redelijke waardering van zijn belangen ter zake in staat kan worden geacht. Hij
      betracht de zorg van een goed mentor.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel454
  - number: '454.2'
    text: |-
      De mentor is jegens de betrokkene aansprakelijk, indien hij in de zorg van een goed mentor te kort schiet, tenzij
      de tekortkoming hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel454
  - number: '455'
    text: |-
      Degene ten behoeve van wie het mentorschap is ingesteld, is, onverminderd het bepaalde in
      [artikel 172 van Boek 6][ref1], aansprakelijk voor alle schulden die voortspruiten uit rechtshandelingen die de
      mentor in zijn hoedanigheid in naam van de betrokkene verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel172
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel455
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '172'
  - number: '456'
    text: |-
      De mentor kan alvorens in rechte op te treden zich te zijner verantwoording doen machtigen door de betrokkene of,
      indien deze daartoe niet in staat of weigerachtig is, door de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel456
  - number: '457.1'
    text: |-
      Een rechtshandeling verricht in strijd met [artikel 453 van dit boek][ref1] is overeenkomstig het tweede en derde
      lid vernietigbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel453
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel457
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '453'
  - number: '457.2'
    text: |-
      Indien de rechtshandeling is verricht door of gericht tot de betrokkene, kan een beroep op de vernietigbaarheid
      slechts worden gedaan jegens een persoon die het mentorschap kende of had behoren te kennen; jegens een zodanige
      persoon wordt de betrokkene vermoed onbevoegd te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel457
  - number: '457.3'
    text: |-
      Indien de rechtshandeling is verricht door of gericht tot de mentor, kan een beroep op de vernietigbaarheid slechts
      worden gedaan jegens een persoon die de onbevoegdheid van de mentor kende of had behoren te kennen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel457
  - number: '458'
    text: |-
      Voor zover een of meer van de goederen van de betrokkene onder een bewind als bedoeld in
      [titel 19 van dit boek][ref1] staan, is de bewindvoerder, indien hij niet tevens mentor is, niet tot optreden
      bevoegd ten aanzien van aangelegenheden als in [artikel 453, eerste lid, van dit boek][ref2] bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel453
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel458
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '453'
  - number: '459.1'
    text: |-
      De mentor doet desgevraagd van zijn werkzaamheden verslag aan de kantonrechter. De kantonrechter kan te allen tijde
      verschijning van de mentor in persoon gelasten. Deze is verplicht alle door de kantonrechter gewenste inlichtingen
      te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel459
  - number: '459.2'
    text: |-
      De mentor, bedoeld in [artikel 452, zevende lid][ref1], legt jaarlijks de verklaring en het verslag over, bedoeld
      in artikel 452, achtste lid, onderdelen a en b. De mentor legt tweejaarlijks de verklaring over, bedoeld in artikel
      452, achtste lid, onderdeel c. De kantonrechter kan ten aanzien van de verschillende onderdelen van het verslag een
      ander tijdstip van overlegging bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel452
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel459
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '452'
  - number: '459.3'
    text: |-
      De mentor doet telkens na verloop van vijf jaren, of zo veel eerder als de kantonrechter bepaalt, aan deze verslag
      van het verloop van het mentorschap. Hij laat zich daarbij met name uit over de vraag of het mentorschap dient
      voort te duren dan wel of een minder ver, of een verder strekkende voorziening aangewezen is. Feiten die voor het
      mentorschap en het voortduren daarvan van betekenis zijn, deelt hij terstond aan de kantonrechter mede.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel459
  - number: '459.4'
    text: |-
      Aan het einde van zijn mentorschap doet de mentor van zijn werkzaamheden schriftelijk verslag aan zijn opvolger,
      aan de kantonrechter alsmede aan de betrokkene, indien het mentorschap door het verstrijken van de tijdsduur
      waarvoor het is ingesteld of door opheffing eindigt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel459
  - number: '460.1'
    text: |-
      De mentor mag de bij de vervulling van zijn taak noodzakelijk gemaakte kosten aan de betrokkene in rekening
      brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel460
  - number: '460.2'
    text: |-
      De mentor heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling van Onze Minister van
      Veiligheid en Justitie zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel460
  - number: '461.1'
    text: 'De taak van de mentor eindigt:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel461
  - number: 461.1.a
    text: bij het einde van het mentorschap;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel461
  - number: 461.1.b
    text: door tijdsverloop, indien hij voor een bepaalde tijd was benoemd;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel461
  - number: 461.1.c
    text: door zijn dood;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel461
  - number: 461.1.d
    text: door zijn ondercuratelestelling of door instelling van een mentorschap te zijnen behoeve;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel461
  - number: 461.1.e
    text: door ontslag dat hem door de kantonrechter met ingang van een door deze bepaalde dag wordt verleend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel461
  - number: '461.2'
    text: |-
      Het ontslag wordt hem verleend hetzij op eigen verzoek, hetzij wegens gewichtige redenen of omdat hij niet meer
      voldoet aan de eisen om mentor te kunnen worden, zulks op verzoek van de medementor of degene die gerechtigd is
      mentorschap te verzoeken als bedoeld in [artikel 451, eerste en tweede lid][ref1], dan wel ambtshalve. Hangende
      het onderzoek kan de kantonrechter voorlopige voorzieningen in het mentorschap treffen en de mentor schorsen. De
      kantonrechter kan hiertoe zo nodig ook zonder de mentor tevoren te hebben gehoord overgaan. In dat geval verliest
      de beschikking haar kracht na verloop van twee weken, tenzij de mentor binnen deze termijn in de gelegenheid is
      gesteld om te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel451
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel461
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '451'
  - number: '461.3'
    text: |-
      Een gewezen mentor blijft verplicht al datgene te doen, wat niet zonder nadeel voor de betrokkene kan
      worden uitgesteld, totdat wederom een persoon bevoegd is ten aanzien van de aangelegenheden bedoeld in
      [artikel 453, eerste lid][ref1], van dit boek. In de gevallen genoemd in het eerste lid, onder *d*, rust deze
      verplichting op diens curator of mentor, indien deze van het mentorschap kennisdraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel453
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel461
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '453'
  - number: '461.4'
    text: |-
      [Artikel 384][ref1] van dit boek is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel384
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel461
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '384'
  - number: '462.1'
    text: |-
      Het mentorschap eindigt door het verstrijken van de tijdsduur waarvoor het is ingesteld en door de dood of
      ondercuratelestelling van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel462
  - number: '462.2'
    text: |-
      De kantonrechter kan, indien de noodzaak daartoe niet meer bestaat of voortzetting van het mentorschap niet zinvol
      is gebleken, het mentorschap opheffen, zulks op verzoek van de mentor of van degene die gerechtigd is mentorschap
      te verzoeken als bedoeld in [artikel 451, eerste en tweede lid][ref1], dan wel ambtshalve. De beschikking treedt in
      werking zodra zij in kracht van gewijsde is gegaan, tenzij zij een eerder tijdstip van ingang aanwijst.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel451
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel462
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '451'
  - number: '462.3'
    text: |-
      Degene die gerechtigd is de instelling van het mentorschap te verzoeken als bedoeld in
      [artikel 451, eerste en tweede lid][ref1], alsmede de mentor, kan verzoeken om verlenging van het mentorschap
      dat voor een bepaalde tijdsduur is ingesteld. De kantonrechter beslist binnen twee maanden na het indienen van
      het verzoekschrift. [Artikel 384][ref2] is van overeenkomstige toepassing. Tegen de afwijzing van een verzoek tot
      verlenging staat geen hogere voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel451
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel384
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel462
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '451'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '384'
