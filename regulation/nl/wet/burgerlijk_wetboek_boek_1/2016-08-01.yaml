      - id: ref6
        bwb_id: BWBR0002656
        artikel: '359'
        paragraaf: '10'
        afdeling: '6'
  - number: '410.2'
    text: |-
      De bewindvoerder heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling van Onze
      Minister van Veiligheid en Justitie zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel410
  - number: '410.3'
    text: |-
      Goedkeuring van een ingediende rekening door de kantonrechter brengt geen nadeel toe aan de bevoegdheid van de
      rechthebbenden om na het einde van het bewind over dezelfde tijdruimte rekening en verantwoording te vragen, voor
      zover dit niet onredelijk is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel410
  - number: '410.4'
    text: |-
      De bewindvoerder kan ook voor andere dan vermogensbelangen van de afwezige opkomen, behoudens voor zover de
      kantonrechter zulks heeft uitgesloten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel410
  - number: '410.5'
    text: De kantonrechter kan te allen tijde de bewindvoerder ontslaan en door een ander vervangen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel410
  - number: '411'
    text: 'Het bewind eindigt:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel411
  - number: 411.a
    text: door een gezamenlijk besluit van de rechthebbende en de bewindvoerder;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel411
  - number: 411.b
    text: door opzegging door de rechthebbende aan de bewindvoerder met inachtneming van een termijn van een maand;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel411
  - number: 411.c
    text: wanneer de dood van de rechthebbende komt vast te staan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel411
  - number: '412.1'
    text: |-
      Wanneer aan een persoon wiens bestaan onzeker is een erfdeel of een legaat opkomt, waartoe, indien hij niet in
      leven mocht zijn, anderen zouden gerechtigd zijn, verleent de rechtbank aan die anderen op hun verzoek machtiging
      tot de uitoefening van het recht van erfgenaam of legataris.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel412
  - number: '412.2'
    text: |-
      De rechtbank kan zo nodig, openbare oproepingen bevelen en behoedmiddelen ten behoeve van de belanghebbenden
      voorschrijven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel412
  - number: '412.3'
    text: |-
      Indien na het verlenen van de machtiging mocht blijken, dat de vermiste op de dag van het openvallen der
      nalatenschap heeft bestaan, kan de teruggave van de in bezit gekomen goederen en van de vruchten worden gevorderd,
      op de voet en onder de beperkingen als hierna bij de verklaring van vermoedelijk overlijden is aangegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel412
  - number: '412.4'
    text: |-
      Het eerste tot en met derde lid is van overeenkomstige toepassing op een uitkering uit levensverzekering, waartoe
      de persoon wiens bestaan onzeker is de eerstgeroepen begunstigde is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel412
  - number: '413.1'
    text: |-
      Is het bestaan van een persoon onzeker en is de in het volgende lid aangegeven tijdruimte verlopen, dan kunnen
      belanghebbenden de rechtbank verzoeken dat zij hun zal gelasten de vermiste op te roepen ten einde van zijn in
      leven zijn te doen blijken, en dat zij, zo hiervan niet blijkt, zal verklaren dat er rechtsvermoeden van overlijden
      van de vermiste bestaat.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel413
  - number: 413.2.a
    text: |-
      De in het vorige lid bedoelde tijdruimte beloopt vijf jaren, te rekenen van het vertrek van de vermiste of de
      laatste tijding van zijn leven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel413
  - number: 413.2.b
    text: |-
      De termijn wordt verkort tot een jaar, indien de betrokkene gedurende die periode wordt vermist en de
      omstandigheden zijn dood waarschijnlijk maken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel413
  - number: '413.3'
    text: |-
      Het gelasten van de oproeping van de vermiste en de verklaring van rechtsvermoeden van overlijden, bedoeld in het
      eerste lid, kunnen ook worden verzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel413
  - number: '414.1'
    text: |-
      De rechtbank stelt dag en uur vast, waartegen de vermiste moet worden opgeroepen. De oproep loopt op een termijn
      van een maand of zoveel langer als de rechtbank mocht bevelen. De oproeping geschiedt overeenkomstig de [derde
      afdeling van de derde titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel414
  - number: '414.2'
    text: |-
      Indien de vermiste niet verschijnt, noch iemand voor hem opkomt die behoorlijk van het in leven zijn van de
      vermiste doet blijken, verklaart de rechtbank dat er rechtsvermoeden van overlijden bestaat, onverminderd
      haar bevoegdheid de beschikking, bedoeld in het eerste lid, eerst nog eenmaal te herhalen alsmede het horen
      van getuigen en de overlegging van bewijsstukken te gelasten, ten bewijze dat is voldaan aan de vereisten die
      [artikel 413][ref1] stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel413
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '413'
        afdeling: '2'
  - number: '414.3'
    text: |-
      De beschikking, houdende verklaring dat er rechtsvermoeden van overlijden bestaat, noemt de dag waarop de vermiste
      wordt vermoed te zijn overleden; als zodanig geldt de dag volgende op die van de laatste tijding van zijn leven,
      tenzij voldoende vermoedens bestaan, dat hij daarna nog enige tijd in leven was.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel414
  - number: '414.4'
    text: |-
      De rechtbank kan tevens bepalen, dat de kosten die een verzoeker als bedoeld in [artikel 413 lid 1][ref1] heeft
      gemaakt, ten laste van het vermogen van de vermiste worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel413
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel414
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '413'
        afdeling: '2'
  - number: '416'
    text: Geen hogere voorziening is toegelaten tegen beschikkingen, houdende bevel tot oproeping van de vermiste.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel416
  - number: '417.1'
    text: |-
      Zodra de beschikking, houdende verklaring dat er rechtsvermoeden van overlijden bestaat, in kracht van gewijsde
      is gegaan, zendt de griffier van het college waarvoor de zaak laatstelijk aanhangig was, een afschrift van de
      beschikking aan de ambtenaar van de burgerlijke stand van de verlaten woonplaats of, bij gebreke van verlaten
      woonplaats in Nederland, van de gemeente 's-Gravenhage. Deze ambtenaar maakt van de beschikking een akte van
      inschrijving op, welke in overeenstemming is met de beschikking en dit uitdrukkelijk vermeldt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel417
  - number: '417.2'
    text: |-
      Deze akte van overlijden bewijst ten aanzien van een ieder dwingend, dat de vermiste op de in de akte vermelde dag
      is overleden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel417
  - number: '418.1'
    text: |-
      Erfgenamen en legatarissen van hem, die vermoedelijk overleden is verklaard, zijn verplicht alvorens zij de
      goederen der nalatenschap in bezit nemen, ten genoegen van de kantonrechter zekerheid te stellen voor hetgeen zij
      aan de vermoedelijk overleden verklaarde, mocht deze terugkeren, of aan erfgenamen of legatarissen die een beter
      recht mochten hebben, moeten afdragen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel418
  - number: '418.2'
    text: De erfgenamen zijn verplicht na de inbezitneming een behoorlijke boedelbeschrijving op te maken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel418
  - number: '418.3'
    text: |-
      Registergoederen mogen niet vervreemd of bezwaard worden, tenzij om gewichtige redenen en met verlof van de
      kantonrechter. Kunnen zij bij een boedelscheiding niet zonder verkoop worden verdeeld, dan worden zij onder bewind
      van een derde gesteld, die de inkomsten van die goederen overeenkomstig hetgeen dienaangaande bij de verdeling is
      vastgesteld zal uitkeren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel418
  - number: '418.4'
    text: |-
      De verdeling geschiedt bij authentieke akte, waaruit tevens moet blijken wat aan legatarissen of andere
      gerechtigden is uitgekeerd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel418
  - number: '418.5'
    text: De goederen der nalatenschap mogen niet worden verkwist en daaruit mogen niet bovenmatige giften worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel418
  - number: '418.6'
    text: Erfgenamen en legatarissen zijn verplicht desgevraagd aan de kantonrechter de nodige inlichtingen te geven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel418
  - number: '418.7'
    text: |-
      De in dit artikel genoemde verplichtingen vervallen op het door de kantonrechter bepaalde tijdstip, en uiterlijk
      na verloop van vijf jaren na de dag waarop de akte van overlijden overeenkomstig [artikel 417][ref1] is opgemaakt.
      De rechtbank die de beschikking, houdende verklaring dat er rechtsvermoeden van overlijden bestaat, geeft kan,
      gelet op de omstandigheden van het geval, daarbij tevens bepalen dat een of meer der in dit artikel genoemde
      verplichtingen niet zullen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel417
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel418
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '417'
        afdeling: '2'
  - number: '419'
    text: |-
      De akte waarbij zekerheid is gesteld, de boedelbeschrijving en de akte van verdeling moeten in origineel of in
      authentiek afschrift worden neergelegd ter griffie van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel419
  - number: '420.1'
    text: |-
      Wanneer het aan de kantonrechter blijkt, dat een erfgenaam of legataris de hem in de twee voorgaande artikelen
      opgelegde verplichtingen niet is nagekomen, kan hij voor de goederen die aan die erfgenaam of legataris uit de
      nalatenschap toekomen, een bewindvoerder benoemen, wiens bewind eindigt, wanneer de kantonrechter beslist dat de
      betrokkene alsnog zijn wettelijke verplichtingen heeft nageleefd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel420
  - number: '420.2'
    text: |-
      Voor zover de kantonrechter niet anders bepaalt, vinden op het bewind van de bewindvoerder de
      [artikelen 338][ref1], [339][ref2], [340][ref3], [342-357][ref4], [358 lid 1][ref5] en [359-363 van dit boek][ref6]
      overeenkomstige toepassing, met dien verstande dat de bewindvoerder verplicht is jaarlijks ter griffie van de
      rechtbank een rekening in te dienen van zijn bewind.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel338
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel339
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel340
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel342
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel358
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel359
