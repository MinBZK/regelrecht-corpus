      - id: ref2
        bwb_id: BWBR0002656
        artikel: '74'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '75'
        afdeling: '5'
  - number: 80a.7
    text: |-
      Op het bewijs van het bestaan van de partnerschapsregistratie zijn de[ artikelen 78][ref1] en [79][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel79
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80a
    references:
      - id: ref1
