  - number: 253x.1
    text: |-
      Na de dood van de ouder die tezamen met de ander het gezag uitoefende, oefent die ander van rechtswege de voogdij
      over de kinderen uit.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253x
  - number: 253x.2
    text: |-
      De rechtbank kan op verzoek van de overlevende ouder te allen tijde bepalen dat deze, mits daartoe bevoegd, alsnog
      met het gezag wordt belast.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253x
  - number: 253x.3
    text: |-
      De [artikelen 253][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253g
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253x
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253g
        paragraaf: '2'
        afdeling: '2'
  - number: 253y.1
    text: |-
      Het gezamenlijk gezag, bedoeld in de [artikelen 253sa][ref1] en [253t][ref2], eindigt op de dag waarop in kracht
      van gewijsde is gegaan de beschikking waarbij aan de ouders gezamenlijk gezag is toegekend of het gezamenlijk gezag
      van de ouder en de ander is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253y
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253t
        paragraaf: '2'
        afdeling: 3A
  - number: 253y.2
    text: |-
      Is de beschikking, bedoeld in het eerste lid, uitvoerbaar bij voorraad verklaard, dan eindigt het gezamenlijk gezag
      van de ouder en de ander daags nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253y
  - number: '254'
    text: |-
      In deze afdeling wordt verstaan onder gecertificeerde instelling: gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '255.1'
    text: |-
      De kinderrechter kan een minderjarige onder toezicht stellen van een gecertificeerde instelling indien een
      minderjarige zodanig opgroeit dat hij in zijn ontwikkeling ernstig wordt bedreigd, en:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel255
  - number: 255.1.a
    text: |-
      de zorg die in verband met het wegnemen van de bedreiging noodzakelijk is voor de minderjarige of voor zijn ouders
      of de ouder die het gezag uitoefenen, door dezen niet of onvoldoende wordt geaccepteerd, en
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel255
  - number: 255.1.b
    text: |-
      de verwachting gerechtvaardigd is dat de ouders of de ouder die het gezag uitoefenen binnen een gelet op de persoon
      en de ontwikkeling van de minderjarige aanvaardbaar te achten termijn, de verantwoordelijkheid voor de verzorging
      en opvoeding, bedoeld in [artikel 247, tweede lid][ref1], in staat zijn te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '247'
        afdeling: '1'
  - number: '255.2'
    text: |-
      De kinderrechter kan een minderjarige onder toezicht stellen op verzoek van de raad voor de kinderbescherming of
      het openbaar ministerie. Tevens zijn een ouder en degene die niet de ouder is en de minderjarige als behorende tot
      zijn gezin verzorgt en opvoedt bevoegd tot het doen van het verzoek indien de raad voor de kinderbescherming niet
      tot indiening van het verzoek overgaat.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel255
  - number: '255.3'
    text: |-
      Indien de raad niet tot indiening van een verzoek tot ondertoezichtstelling overgaat nadat hij een verzoek
      tot onderzoek als bedoeld in [artikel 2.4, eerste lid, van de Jeugdwet][ref1] heeft ontvangen, deelt hij dit
      schriftelijk mee aan het college van burgemeester en wethouders dat het verzoek heeft gedaan. De burgemeester kan
      na ontvangst van die mededeling de raad voor de kinderbescherming verzoeken het oordeel van de kinderrechter te
      vragen of het noodzakelijk is de minderjarige onder toezicht te stellen van een gecertificeerde instelling. De
      raad voor de kinderbescherming die van de burgemeester zodanig verzoek ontvangt, vraagt binnen twee weken na de
      dagtekening van dat verzoek het oordeel van de kinderrechter of een ondertoezichtstelling van de minderjarige moet
      volgen. In dat geval kan de kinderrechter de ondertoezichtstelling ambtshalve uitspreken.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel255
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
  - number: '255.4'
    text: |-
      De kinderrechter vermeldt in de beschikking de concrete bedreigingen in de ontwikkeling van de minderjarige alsmede
      de daarop afgestemde duur waarvoor de ondertoezichtstelling zal gelden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel255
  - number: '255.5'
    text: |-
      Indien het verzoek, bedoeld in het tweede lid, niet alle minderjarigen betreft over wie de ouders of de ouder
      het gezag uitoefenen, kan de kinderrechter dit op verzoek van de raad voor de kinderbescherming of ambtshalve
      aanvullen, en deze minderjarigen, mits aan de grond van het eerste lid is voldaan, eveneens onder toezicht stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel255
  - number: '256.1'
    text: |-
      De kinderrechter kan een minderjarige door of voor wie een aanvraag tot het verlenen van een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref1] is ingediend en die in verband
      daarmee in een centrum als bedoeld in [artikel 1, onder d, van de Wet Centraal Orgaan opvang asielzoekers][ref2]
      verblijft, onder toezicht stellen van een daartoe door Onze Minister van Justitie aanvaarde rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0006685#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel256
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0006685
        artikel: '1'
  - number: '256.2'
    text: |-
      Onze Minister van Justitie kan voorwaarden stellen bij of voorschriften verbinden aan de aanvaarding, bedoeld in
      het eerste lid, en de rechtspersoon voor een bepaalde tijd aanvaarden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel256
  - number: '256.3'
    text: |-
      Op de ondertoezichtstelling en een rechtspersoon als bedoeld in het eerste lid zijn de bepalingen van de
      [afdelingen 4][ref1] en [5][ref2] alsmede [artikel 326][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling4
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling5
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel326
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel256
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '326'
        paragraaf: '7'
        afdeling: '6'
  - number: '256.4'
    text: |-
      In geval van vervanging van de rechtspersoon op grond van [artikel 259][ref1], wordt een gecertificeerde instelling
      benoemd die een contract of een subsidierelatie heeft met de gemeente waar de minderjarige zijn woonplaats als
      bedoeld in de [Jeugdwet][ref2] heeft. Hetzelfde geldt indien de rechtspersoon niet meer voldoet aan de eisen voor
      benoeming, bedoeld in het eerste lid, in welk geval de kinderrechter ambtshalve tot vervanging overgaat, tenzij
      voortzetting van de taken door bedoelde rechtspersoon om reden van continuïteit noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel259
      [ref2]: https://wetten.overheid.nl/BWBR0034925
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel256
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '259'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0034925
  - number: '257.1'
    text: |-
      De kinderrechter kan de minderjarige voorlopig onder toezicht stellen van een gecertificeerde instelling indien
      een ernstig vermoeden bestaat dat de grond, bedoeld in [artikel 255, eerste lid][ref1], is vervuld en de maatregel
      noodzakelijk is om een acute en ernstige bedreiging voor de minderjarige weg te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '255'
        afdeling: '4'
  - number: '257.2'
    text: |-
      Het tweede lid van [artikel 255][ref1] is van overeenkomstige toepassing. De kinderrechter bepaalt de duur van dit
      toezicht op ten hoogste drie maanden en kan de beslissing te allen tijde herroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel257
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '255'
        afdeling: '4'
  - number: '258'
    text: |-
      De duur van de ondertoezichtstelling is, behoudens verlenging als bedoeld in [artikel 260][ref1], ten hoogste een
      jaar. De duur van de voorlopige ondertoezichtstelling komt hierop niet in mindering.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel260
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel258
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '260'
        afdeling: '4'
  - number: '259'
    text: |-
      De kinderrechter kan de gecertificeerde instelling die het toezicht heeft, vervangen door een andere
      gecertificeerde instelling, op verzoek van de gecertificeerde instelling die het toezicht heeft, de raad voor de
      kinderbescherming, een met het gezag belaste ouder of de minderjarige van twaalf jaar of ouder.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel259
  - number: '260.1'
    text: |-
      De kinderrechter kan, mits aan de grond, bedoeld in [artikel 255, eerste lid][ref1], is voldaan, de duur van de
      ondertoezichtstelling telkens verlengen met ten hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '255'
        afdeling: '4'
  - number: '260.2'
    text: |-
      De kinderrechter kan de ondertoezichtstelling verlengen op verzoek van de gecertificeerde instelling die het
      toezicht heeft. Indien deze gecertificeerde instelling niet tot een verzoek overgaat, zijn de raad voor de
      kinderbescherming, een ouder, degene die niet de ouder is en de minderjarige als behorende tot zijn gezin verzorgt
      en opvoedt en het openbaar ministerie bevoegd tot het doen van het verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel260
  - number: '261.1'
    text: |-
      De kinderrechter kan de ondertoezichtstelling opheffen indien de grond, bedoeld in [artikel 255, eerste lid][ref1],
      niet langer is vervuld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel261
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '255'
        afdeling: '4'
  - number: '261.2'
    text: |-
      Hij kan dit doen op verzoek van de gecertificeerde instelling die het toezicht heeft. Indien deze gecertificeerde
      instelling niet tot een verzoek overgaat, zijn de raad voor de kinderbescherming, een met het gezag belaste ouder
      of de minderjarige van twaalf jaar of ouder bevoegd tot het doen van het verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel261
  - number: '262.1'
    text: |-
      De gecertificeerde instelling houdt toezicht op de minderjarige en zorgt dat aan de minderjarige en de met het
      gezag belaste ouders of ouder hulp en steun worden geboden opdat de concrete bedreigingen in de ontwikkeling van
      de minderjarige, bedoeld in [artikel 255, vijfde lid][ref1], binnen de duur van de ondertoezichtstelling worden
      weggenomen. De inspanningen van de gecertificeerde instelling zijn erop gericht de ouders of de ouder zoveel
      mogelijk de verantwoordelijkheid voor de verzorging en opvoeding van hun kinderen te laten dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel262
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '255'
        afdeling: '4'
  - number: '262.2'
    text: |-
      Indien het ontwikkelingsniveau van de minderjarige en diens bekwaamheid en behoefte zelfstandig te handelen en
      zijn leven naar eigen inzicht in te richten daartoe aanleiding geven, zijn de inspanningen van de gecertificeerde
      instelling dienovereenkomstig mede gericht op het vergroten van de zelfstandigheid van de minderjarige.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel262
  - number: '262.3'
    text: |-
      De gecertificeerde instelling bevordert de gezinsband tussen de met het gezag belaste ouders of ouder en de
      minderjarige.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel262
  - number: 262a.1
    text: |-
      De stichting stelt ter uitvoering van haar taak als eerste de ouder of ouders met gezag in de gelegenheid om samen
      met bloedverwanten, aanverwanten of anderen die tot de sociale omgeving behoren binnen zes weken een plan van
      aanpak op te stellen of een bestaand plan aan te passen. Slechts indien de concrete bedreigingen in de ontwikkeling
      van het kind hiertoe aanleiding geven of de belangen van het kind anderszins geschaad worden, kan de stichting
      hiervan afzien.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel262a
  - number: 262a.2
    text: |-
      Indien het plan van aanpak geschikt is om binnen de duur van de ondertoezichtstelling de concrete
      bedreigingen, bedoeld in [artikel 255, vijfde lid][ref1], weg te nemen, geldt het als het plan, bedoeld in
      [artikel 13, derde lid, van de Wet op de jeugdzorg][ref2]. Indien het plan van aanpak naar het oordeel van de
      stichting niet geschikt is om de concrete bedreigingen weg te nemen, deelt de stichting dit binnen vijf werkdagen
      na de aanbieding van het plan van aanpak gemotiveerd aan de ouder of ouders met gezag mede, en stelt zij hen in de
      gelegenheid om het plan van aanpak binnen twee weken aan te passen. Indien de stichting binnen deze termijn geen
      aangepast plan van aanpak ontvangt of een plan van aanpak ontvangt dat naar haar oordeel evenmin geschikt is om de
      concrete bedreigingen weg te nemen, stelt zij alsnog zelf een plan als bedoeld in artikel 13, derde lid, van de Wet
      op de jeugdzorg op.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel255
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel13
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel262a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '255'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '13'
  - number: 262a.3
    text: |-
      Op verzoek van een met het gezag belaste ouder of de minderjarige van twaalf jaar of ouder kan de kinderrechter het
      plan van aanpak laten gelden als het plan, bedoeld in [artikel 13, derde lid, van de Wet op de jeugdzorg][ref1].
      [Artikel 264, tweede en derde lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel264
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel262a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '264'
        afdeling: '4'
  - number: 262b
    text: |-
      Geschillen die de uitvoering van de ondertoezichtstelling betreffen, die omtrent gedragingen als bedoeld
      in [artikel 4.2.1 van de Jeugdwet][ref1], uitgezonderd, kunnen aan de kinderrechter worden voorgelegd. De
      kinderrechter neemt op verzoek van een met het gezag belaste ouder, de minderjarige van twaalf jaar of ouder,
      de gecertificeerde instelling, degene die de minderjarige als behorende tot zijn gezin verzorgt en opvoedt, of
      de zorgaanbieder of de aanbieder van de jeugdhulp als bedoeld in [artikel 1.1 van de Jeugdwet][ref2], waar de
      minderjarige is geplaatst, een zodanige beslissing als hem in het belang van de minderjarige wenselijk voorkomt.
      Hij beproeft alvorens te beslissen een vergelijk tussen de betrokkenen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel262b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '263.1'
    text: |-
      De gecertificeerde instelling kan ter uitvoering van haar taak schriftelijke aanwijzingen geven betreffende
      de verzorging en opvoeding van de minderjarige. Zij kan dit doen indien de met het gezag belaste ouder of de
      minderjarige niet instemmen met, dan wel niet of onvoldoende medewerking verlenen aan de uitvoering van het plan,
      bedoeld in [artikel 4.1.3, eerste lid, van de Jeugdwet][ref1] of indien dit noodzakelijk is teneinde de concrete
      bedreigingen in de ontwikkeling van de minderjarige weg te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel263
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
  - number: '263.2'
    text: De met het gezag belaste ouders of ouder en de minderjarige volgen een schriftelijke aanwijzing op.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel263
  - number: '263.3'
    text: |-
      De gecertificeerde instelling kan de kinderrechter verzoeken een schriftelijke aanwijzing te bekrachtigen.
      Tegelijkertijd kan een door de wet toegelaten dwangmiddel worden verzocht bij niet nakoming van deze aanwijzing
      tenzij het belang van het kind zich tegen oplegging daarvan verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel263
  - number: '264.1'
    text: |-
      Op verzoek van een met het gezag belaste ouder of de minderjarige van twaalf jaar of ouder kan de kinderrechter
      een schriftelijke aanwijzing geheel of gedeeltelijk vervallen verklaren. Het verzoek heeft geen schorsende kracht,
      tenzij de kinderrechter het tegendeel bepaalt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel264
  - number: '264.2'
    text: Bij de indiening van het verzoek wordt de beslissing van de gecertificeerde instelling overgelegd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel264
  - number: '264.3'
    text: |-
      De termijn voor het indienen van het verzoek bedraagt twee weken en vangt aan met ingang van de dag na die waarop
      de beslissing is verzonden of uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel264
  - number: '264.4'
    text: |-
      Ten aanzien van een na afloop van deze termijn ingediend verzoek blijft niet-ontvankelijkverklaring achterwege
      indien de verzoeker redelijkerwijs niet geoordeeld kan worden in verzuim te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel264
  - number: '265.1'
    text: |-
      Op verzoek van degene aan wie de aanwijzing is gericht, kan de gecertificeerde instelling een schriftelijke
      aanwijzing wegens gewijzigde omstandigheden geheel of gedeeltelijk intrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265
  - number: '265.2'
    text: De gecertificeerde instelling geeft haar beslissing schriftelijk en binnen twee weken na ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265
  - number: '265.3'
    text: |-
      [Artikel 264][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel264
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '264'
        afdeling: '4'
  - number: '265.4'
    text: |-
      Het niet of niet tijdig nemen van een beslissing door de gecertificeerde instelling staat gelijk met afwijzing van
      het verzoek. De termijn voor het indienen van het verzoek aan de kinderrechter loopt in dat geval door zolang de
      gecertificeerde instelling niet heeft beslist en eindigt, indien de gecertificeerde instelling alsnog beslist, na
      verloop van twee weken te rekenen met ingang van de dag waarop de beslissing is verzonden of uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265
  - number: 265a
    text: |-
      Plaatsing van de minderjarige gedurende dag en nacht buiten het gezin geschiedt uitsluitend met een machtiging
      tot uithuisplaatsing.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265a
  - number: 265b.1
    text: |-
      Indien dit noodzakelijk is in het belang van de verzorging en opvoeding van de minderjarige of tot onderzoek van
      diens geestelijke of lichamelijke gesteldheid, kan de kinderrechter de gecertificeerde instelling, bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1], die belast is met de uitvoering van de ondertoezichtstelling op haar verzoek
      machtigen de minderjarige gedurende dag en nacht uit huis te plaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 265b.2
    text: |-
      De machtiging kan eveneens worden verleend op verzoek van de raad voor de kinderbescherming of op verzoek
      van het openbaar ministerie. De raad voor de kinderbescherming of het openbaar ministerie legt bij het
      verzoek, bedoeld in het eerste lid, het besluit van het college van burgemeester en wethouders, bedoeld in
      [artikel 2.3, eerste lid, van de Jeugdwet][ref1] over.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
  - number: 265b.3
    text: |-
      De kinderrechter kan in afwijking van het tweede lid een machtiging tot uithuisplaatsing verlenen zonder dat het
      college van burgemeester en wethouders een daartoe strekkend besluit heeft genomen, indien het belang van het kind
      dit vergt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265b
  - number: 265b.4
    text: |-
      Voor opneming en verblijf als bedoeld in [artikel 6.1.2, eerste lid][ref1], of
      [6.1.3, eerste lid, van de Jeugdwet][ref2] is geen machtiging als bedoeld in het eerste lid vereist, doch een
      machtiging als bedoeld in genoemde artikelleden. Deze machtiging geldt voor de toepassing van [artikel 265a][ref3]
      als een machtiging als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel265a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 265a
        afdeling: '4'
  - number: 265c.1
    text: |-
      De duur van de machtiging tot uithuisplaatsing is, behoudens verlenging als bedoeld in het tweede lid, ten
      hoogste een jaar. Indien een minderjarige voorlopig onder toezicht is gesteld en gelijktijdig een machtiging tot
      uithuisplaatsing is verleend, komt de duur hiervan niet in mindering op de termijn van ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265c
  - number: 265c.2
    text: |-
      Op verzoek van de gecertificeerde instelling kan de kinderrechter de duur telkens met ten hoogste een jaar
      verlengen. Indien de gecertificeerde instelling niet overgaat tot een verzoek, kan verlenging plaatsvinden op
      verzoek van de raad voor de kinderbescherming of het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265c
  - number: 265c.3
    text: Een machtiging vervalt indien deze na verloop van drie maanden niet ten uitvoer is gelegd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265c
  - number: 265d.1
    text: |-
      Een uithuisplaatsing kan door de gecertificeerde instelling worden beëindigd indien deze niet langer noodzakelijk
      is in het belang van de verzorging en opvoeding van de minderjarige of tot het verrichten van het onderzoek,
      bedoeld in [artikel 265b, eerste lid][ref1], en het belang van de minderjarige zich tegen beëindiging niet verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel265b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 265b
        afdeling: '4'
  - number: 265d.2
    text: |-
      De met het gezag belaste ouder, de minderjarige van twaalf jaar of ouder of een ander die de minderjarige als
      behorende tot zijn gezin verzorgt en opvoedt kunnen wegens gewijzigde omstandigheden de gecertificeerde instelling
      verzoeken:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265d
  - number: 265d.2.a
    text: de uithuisplaatsing te beëindigen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265d
  - number: 265d.2.b
    text: de duur ervan te bekorten;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265d
  - number: 265d.2.c
    text: |-
      af te zien van een krachtens de machtiging toegestane wijziging van de verblijfplaats van de minderjarige, tenzij
      de toestemming reeds met toepassing van [artikel 265i][ref1] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel265i
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 265i
        afdeling: '4'
  - number: 265d.3
    text: De gecertificeerde instelling geeft een schriftelijke beslissing binnen twee weken na ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265d
  - number: 265d.4
    text: |-
      Op verzoek van een in het tweede lid genoemde persoon kan de kinderrechter de machtiging geheel of gedeeltelijk
      intrekken of de duur ervan bekorten. [Artikel 264, eerste lid, tweede volzin, tweede tot en met vierde lid][ref1],
      alsmede [artikel 265, vierde lid][ref2], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel264
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel265
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '264'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '265'
        afdeling: '4'
  - number: 265e.1
    text: |-
      De kinderrechter kan bij de verlening van de machtiging tot uithuisplaatsing en ook nadat deze machtiging is
      verleend, op verzoek bepalen dat het gezag gedeeltelijk wordt uitgeoefend door de gecertificeerde instelling die
      het toezicht uitoefent, voor zover dit noodzakelijk is in verband met de uitvoering van de ondertoezichtstelling.
      Hij kan dit doen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265e
  - number: 265e.1.a
    text: de aanmelding van de minderjarige bij een onderwijsinstelling,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265e
  - number: 265e.1.b
    text: |-
      het geven van toestemming voor een medische behandeling van de minderjarige jonger dan twaalf jaar of van de
      minderjarige van twaalf jaar of ouder die niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen terzake, of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265e
  - number: 265e.1.c
    text: |-
      het doen van een aanvraag tot het verlenen van een verblijfsvergunning ten behoeve van de minderjarige als bedoeld
      in de [artikelen 14][ref1] of [28 van de Vreemdelingenwet 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265e
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '28'
  - number: 265e.2
    text: |-
      De duur van de gedeeltelijke uitoefening van het gezag is niet langer dan die van de verleende machtiging tot
      uithuisplaatsing.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265e
  - number: 265e.3
    text: |-
      De kinderrechter kan de duur van de gedeeltelijke uitoefening van het gezag telkens met ten hoogste een jaar
      verlengen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265e
  - number: 265e.4
    text: |-
      Op verzoek kan een beslissing als bedoeld in het eerste of derde lid wegens gewijzigde omstandigheden worden
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265e
  - number: 265e.5
    text: |-
      De verzoeken, bedoeld in het eerste, derde en vierde lid, kunnen worden gedaan door de gecertificeerde instelling
      die het toezicht uitoefent. Indien deze gecertificeerde instelling niet tot een verzoek overgaat, zijn de raad voor
      de kinderbescherming of degene die niet de ouder is en de minderjarige als behorende tot zijn gezin verzorgt en
      opvoedt bevoegd tot het doen van het verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265e
  - number: 265f.1
    text: |-
      Voor zover noodzakelijk in verband met de uithuisplaatsing van de minderjarige, kan de gecertificeerde instelling
      voor de duur daarvan de contacten tussen een met het gezag belaste ouder en de minderjarige beperken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265f
  - number: 265f.2
    text: |-
      De beslissing van de gecertificeerde instelling geldt als een schriftelijke aanwijzing. [Artikel 264][ref1] en
      [artikel 265][ref2] zijn van overeenkomstige toepassing, met dien verstande dat de kinderrechter een zodanige
      regeling kan vaststellen als hem in het belang van de minderjarige wenselijk voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel264
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel265
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265f
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '264'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '265'
        afdeling: '4'
  - number: 265g.1
    text: |-
      Voor de duur van de ondertoezichtstelling kan de kinderrechter op verzoek van de gecertificeerde instelling een
      verdeling van de zorg- en opvoedingstaken of een regeling inzake de uitoefening van het recht op omgang vaststellen
      of wijzigen voor zover dit in het belang van de minderjarige noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265g
  - number: 265g.2
    text: |-
      Op het verzoek van een met het gezag belaste ouder, een omgangsgerechtigde, de minderjarige van twaalf jaar of
      ouder en de gecertificeerde instelling kan de kinderrechter de in het eerste lid genoemde beslissing wijzigen
      op grond dat nadien de omstandigheden zijn gewijzigd, of dat bij het nemen van de beslissing van onjuiste of
      onvolledige gegevens is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265g
  - number: 265g.3
    text: |-
      Zodra de ondertoezichtstelling is geëindigd, geldt de op grond van het eerste lid vastgestelde regeling als een
      regeling als bedoeld in [artikel 253a, tweede lid, onder a][ref1], dan wel [artikel 377a, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 377a
  - number: 265h.1
    text: |-
      Indien een medische behandeling van een minderjarige jonger dan twaalf jaar noodzakelijk is om ernstig gevaar
      voor diens gezondheid af te wenden en de ouder die het gezag uitoefent zijn toestemming daarvoor weigert, kan deze
      toestemming op verzoek van de gecertificeerde instelling worden vervangen door die van de kinderrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265h
  - number: 265h.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van een medische behandeling van een minderjarige van
      twaalf jaar of ouder die niet in staat kan worden geacht tot een redelijke waardering van zijn belangen terzake.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265h
  - number: 265i.1
    text: |-
      De gecertificeerde instelling behoeft de toestemming van de kinderrechter voor wijziging in het verblijf van een
      minderjarige die ten minste een jaar door een ander als de ouder is opgevoed en verzorgd als behorende tot zijn
      gezin.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265i
  - number: 265i.2
    text: |-
      De toestemming wordt door de kinderrechter op verzoek van de gecertificeerde instelling verleend en slechts
      afgewezen indien de kinderrechter dit in het belang van de minderjarige noodzakelijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265i
  - number: 265i.3
    text: |-
      Indien de kinderrechter het verzoek, bedoeld in het tweede lid, afwijst, kan hij tevens bepalen dat de
      ondertoezichtstelling en de machtiging tot uithuisplaatsing van kracht blijven voor ten hoogste een jaar. De
      gecertificeerde instelling is gehouden de machtiging tot uithuisplaatsing ten uitvoer te leggen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265i
  - number: 265j.1
    text: |-
      Indien de gecertificeerde instelling oordeelt dat niet-verlenging van de ondertoezichtstelling, bedoeld
      in [artikel 260, tweede lid][ref1], of niet-verlenging van de machtiging tot uithuisplaatsing, bedoeld in
      [artikel 265c, tweede lid][ref2], aangewezen is, doet zij hiervan tijdig doch uiterlijk twee maanden voor het
      verstrijken van de duur van de ondertoezichtstelling of machtiging tot uithuisplaatsing en onder overlegging van
      een verslag van het verloop van de ondertoezichtstelling of de uithuisplaatsing mededeling aan de raad voor de
      kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel260
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel265c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265j
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '260'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 265c
        afdeling: '4'
  - number: 265j.2
    text: |-
      De gecertificeerde instelling kan een uithuisplaatsing gedurende de termijn waarvoor zij is toegestaan beëindigen.
      De gecertificeerde instelling doet van het voornemen daartoe tijdig doch uiterlijk een maand voor het voorgenomen
      tijdstip van beëindiging en onder overlegging van een verslag van het verloop van de uithuisplaatsing, mededeling
      aan de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265j
  - number: 265j.3
    text: |-
      Indien een ondertoezichtstelling met uithuisplaatsing twee jaar of langer heeft geduurd, gaat het verzoek tot
      verlenging van de ondertoezichtstelling en uithuisplaatsing van de gecertificeerde instelling vergezeld van een
      advies van de raad voor de kinderbescherming met betrekking tot de verlenging van die ondertoezichtstelling. De
      gecertificeerde instelling doet van het voornemen tot een voornoemd verzoek tijdig doch uiterlijk twee maanden voor
      het verstrijken van de ondertoezichtstelling mededeling aan de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265j
  - number: 265k.1
    text: |-
      Verzoeken op grond van deze afdeling worden schriftelijk gedaan. Voor zover zij aan de kinderrechter zijn gericht,
      kunnen zij worden ingediend zonder advocaat met uitzondering van het verzoek bedoeld in [artikel 262b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel262b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265k
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 262b
        afdeling: '4'
  - number: 265k.2
    text: |-
      De gecertificeerde instelling die een verzoek indient of ter terechtzitting wordt opgeroepen, zendt bij het
      verzoekschrift of onverwijld na de oproep, het plan, bedoeld in [artikel 4.1.3, eerste lid, van de Jeugdwet][ref1],
      en een verslag van het verloop van de ondertoezichtstelling aan de kinderrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265k
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
  - number: 265k.3
    text: Het plan en het verslag, bedoeld in het tweede lid, worden eveneens gezonden aan de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265k
  - number: 265k.4
    text: |-
      De verzoeken die de gecertificeerde instelling ter uitvoering van haar taak tot de rechter richt, kunnen worden
      ingediend zonder advocaat en worden kosteloos behandeld; de grossen, afschriften en uittreksels, die zij tot dat
      doel aanvraagt, worden haar door de griffiers vrij van alle kosten uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel265k
  - number: '266.1'
    text: 'De rechtbank kan het gezag van een ouder beëindigen indien:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel266
  - number: 266.1.a
    text: |-
      een minderjarige zodanig opgroeit dat hij in zijn ontwikkeling ernstig wordt bedreigd, en de ouder niet de
      verantwoordelijkheid voor de verzorging en opvoeding, bedoeld in [artikel 247, tweede lid][ref1], in staat is te
      dragen binnen een voor de persoon en de ontwikkeling van de minderjarige aanvaardbaar te achten termijn, of


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel266
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '247'
        afdeling: '1'
  - number: 266.1.b
    text: de ouder het gezag misbruikt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel266
  - number: '266.2'
    text: Het gezag van de ouder kan ook worden beëindigd indien het gezag is geschorst, mits aan het eerste lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel266
  - number: '267.1'
    text: |-
      Beëindiging van het gezag kan worden uitgesproken op verzoek van de raad voor de kinderbescherming of het openbaar
      ministerie. Tevens is degene die niet de ouder is en de minderjarige gedurende ten minste een jaar als behorende
      tot zijn gezin verzorgt en opvoedt bevoegd tot het doen van het verzoek indien de raad voor de kinderbescherming
      niet tot een verzoek overgaat.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel267
  - number: '267.2'
    text: |-
      Indien de raad niet tot een verzoek als bedoeld in het eerste lid overgaat nadat hij een verzoek tot onderzoek
      hiertoe van de gecertificeerde instelling die de ondertoezichtstelling over de minderjarige uitvoert, heeft
      ontvangen, deelt hij dit schriftelijk mee aan die gecertificeerde instelling. De gecertificeerde instelling kan
      na ontvangst van die mededeling de raad voor de kinderbescherming verzoeken het oordeel van de rechtbank te vragen
      of beëindiging van het gezag het noodzakelijk is. De raad voor de kinderbescherming die van de gecertificeerde
      instelling zodanig verzoek ontvangt, vraagt binnen twee weken na de dagtekening van dat verzoek het oordeel van de
      rechtbank of een beëindiging van het gezag moet volgen. In dat geval kan de rechtbank de beëindiging van het gezag
      ambtshalve uitspreken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel267
  - number: '268.1'
    text: 'De rechtbank kan een ouder geheel of gedeeltelijk in de uitoefening van het gezag schorsen indien:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel268
  - number: 268.1.a
    text: |-
      een ernstig vermoeden bestaat dat de grond, bedoeld in [artikel 266, eerste lid, aanhef en onder a of b][ref1] is
      vervuld en de maatregel noodzakelijk is om een acute en ernstige bedreiging voor de minderjarige weg te nemen, of


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel266
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '266'
        afdeling: '5'
  - number: 268.1.b
    text: |-
      een medische behandeling van een minderjarige jonger dan twaalf jaar of van de minderjarige van twaalf jaar of
      ouder die niet in staat kan worden geacht tot een redelijke waardering van zijn belangen terzake, noodzakelijk
      is om ernstig gevaar voor diens gezondheid af te wenden en een ouder die het gezag uitoefent toestemming daarvoor
      weigert.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel268
  - number: '268.2'
    text: |-
      Indien de ouders gezamenlijk het gezag uitoefenen, wordt gedurende de schorsing van het gezag van één van hen het
      gezag door de andere ouder alleen uitgeoefend, tenzij de kinderrechter een gecertificeerde instelling als bedoeld
      in [artikel 1.1 van de Jeugdwet][ref1], met de voorlopige voogdij over de minderjarige belast. In dat geval is ook
      het gezag van deze ouder geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '268.3'
    text: |-
      Betreft de schorsing beide ouders of een ouder die alleen het gezag uitoefent, dan belast de rechtbank een
      gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1], met de voorlopige voogdij over de
      minderjarige. De gecertificeerde instelling heeft de bevoegdheden van een voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '268.4'
    text: |-
      [Artikel 267][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel267
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '267'
        afdeling: '5'
  - number: '268.5'
    text: |-
      De schorsing in de uitoefening van het gezag vervalt na verloop van drie maanden na de dag van de beschikking,
      tenzij voor het einde van deze termijn beëindiging van het gezag is verzocht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel268
  - number: '269'
    text: |-
      In plaats van schorsing van beide ouders of van een ouder in de uitoefening van het gezag als bedoeld in
      [artikel 268][ref1], kan de rechtbank een kind onder toezicht stellen als bedoeld in [artikel 255][ref2] mits aan
      de grond hiervoor is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '268'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '255'
        afdeling: '4'
  - number: '274.1'
    text: |-
      Indien de ouders gezamenlijk het gezag uitoefenen, wordt na de beëindiging van het gezag van een van hen voortaan
      het gezag door de andere ouder alleen uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel274
  - number: '274.2'
    text: |-
      In geval van beëindiging van het gezag van een ouder, die het gezag alleen uitoefent, kan de andere ouder de
      rechtbank te allen tijde verzoeken met de uitoefening van het gezag te worden belast. Dit verzoek wordt ingewilligd
      indien de rechtbank dit in het belang van de minderjarige noodzakelijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel274
  - number: '274.3'
    text: |-
      De rechtbank die het verzoek bedoeld bij het vorige lid heeft afgewezen, kan deze beschikking steeds wijzigen. Zij
      doet dit echter slechts op verzoek van de betrokken ouder, en niet dan op grond van omstandigheden, waarmede de
      rechter bij het geven van de beschikking geen rekening heeft kunnen houden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel274
  - number: '275.1'
    text: |-
      Indien de andere ouder het gezag niet voortaan alleen uitoefent, benoemt de rechtbank een voogd over de
      minderjarigen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel275
  - number: '275.2'
    text: |-
      Ieder die tot uitoefening van de voogdij bevoegd is, kan tijdens het onderzoek schriftelijk aan de rechtbank
      verzoeken met de voogdij te worden belast.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel275
  - number: '275.3'
    text: |-
      In geval van beëindiging van het gezag op verzoek van de pleegouders benoemt de rechtbank bij voorkeur tot voogd
      degenen, dan wel degene, die op het tijdstip van het verzoek de minderjarige ten minste een jaar als behorende tot
      hun gezin hebben verzorgd en opgevoed, mits dezen bevoegd zijn tot de voogdij.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel275
  - number: '276.1'
    text: |-
      Indien de ouder wiens gezag is beëindigd het bewind over het vermogen van zijn kinderen voerde, wordt hij tevens
      veroordeeld tot het afleggen van rekening en verantwoording aan zijn opvolger in dit bewind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel276
  - number: '276.2'
    text: |-
      Hebben de kinderen goederen gemeen, maar komen zij onder het gezag van verschillende personen, dan kan de rechtbank
      een van dezen of een derde aanwijzen om over deze goederen tot de verdeling het bewind te voeren. De aangewezen
      bewindvoerder stelt de waarborgen die de rechtbank van hem verlangt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel276
  - number: '276.3'
    text: |-
      Op het bewind krachtens het vorige lid is [artikel 253k][ref1] van toepassing, indien een der ouders als
      bewindvoerder is aangewezen, en anders [paragraaf 10 van afdeling 6][ref2] van deze titel. De bewindvoerder is bij
      uitsluiting bevoegd tot vernietiging van rechtshandelingen van minderjarige deelgenoten, strekkend tot beheer of
      beschikking met betrekking tot de onder bewind staande goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253k
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling6
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel276
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253k
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        paragraaf: '10'
        afdeling: '6'
  - number: '277.1'
    text: 'De rechtbank kan de ouder wiens gezag is beëindigd, op zijn verzoek in het gezag herstellen indien:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel277
  - number: 277.1.a
    text: herstel in het gezag in het belang van de minderjarige is, en
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel277
  - number: 277.1.b
    text: |-
      de ouder duurzaam de verantwoordelijkheid voor de verzorging en opvoeding van de minderjarige, bedoeld in
      [artikel 247, tweede lid][ref1], in staat is te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel277
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '247'
        afdeling: '1'
  - number: '277.2'
    text: |-
      Indien ter gelegenheid van de beëindiging van het gezag het gezag aan de andere ouder is opgedragen, belast de
      rechtbank de ouder wiens gezag was beëindigd en deze alleen het in het eerste lid bedoelde verzoek doet, niet met
      het gezag, tenzij de omstandigheden na het nemen van de beschikking waarbij het gezag aan de andere ouder werd
      opgedragen, zijn gewijzigd of bij het nemen van de beschikking van onjuiste of onvolledige gegevens is uitgegaan.
      [Artikel 253e][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253e
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel277
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253e
        paragraaf: '2'
        afdeling: '2'
  - number: '278.1'
    text: |-
      Een verzoek als bedoeld in [artikel 277 van dit boek][ref1] kan ook worden gedaan door de raad voor de
      kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel277
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel278
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '277'
        afdeling: '5'
  - number: '278.2'
    text: |-
      Hangende het onderzoek kan zowel de raad voor de kinderbescherming als de te herstellen ouder de rechtbank
      verzoeken de beslissing aan te houden tot het einde van een door haar te bepalen proeftijd van ten hoogste zes
      maanden; gedurende die tijd zal het kind bij de in het gezag te herstellen ouder verblijven. De rechtbank is te
      allen tijde bevoegd de proeftijd te beëindigen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel278
  - number: '280'
    text: 'De voogdij begint:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel280
  - number: 280.a
    text: |-
      voor de voogd die door een ouder is benoemd: op het tijdstip waarop hij zich na het overlijden van deze ouder
      bereid verklaart de voogdij te aanvaarden. De verklaring moet door de betrokkene in persoon of bij bijzondere
      gevolmachtigde worden afgelegd ter griffie van de rechtbank die overeenkomstig de [ tweede afdeling van de
      derde titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend) in zaken betreffende
      minderjarigen bevoegd is. De verklaring moet worden afgelegd binnen veertien dagen, of - indien de persoon, die de
      verklaring moet afleggen, zich buiten Nederland bevindt - binnen twee maanden, nadat de benoeming is betekend. Tot
      betekening kan iedere belanghebbende, alsmede de raad voor de kinderbescherming opdracht geven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel280
  - number: 280.b
    text: |-
      voor de voogd die - nadat hij zich bereid heeft verklaard de voogdij te aanvaarden - door de rechter is benoemd: op
      de dag, waarop de beslissing die de benoeming inhoudt, in kracht van gewijsde is gegaan, of - zo deze uitvoerbaar
      bij voorraad is verklaard - daags nadat de beslissing die de benoeming inhoudt, is verstrekt of verzonden. Een
      mondelinge bereidverklaring geschiedt ten overstaan van de rechter die benoemt; een schriftelijke bereidverklaring
      wordt neergelegd ter griffie waar de benoeming zal geschieden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel280
  - number: '281.1'
    text: 'De voogdij eindigt op de dag, waarop in kracht van gewijsde is gegaan de beschikking waarbij:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel281
  - number: 281.1.a
    text: de voogd is ontslagen of de voogdij is beëindigd;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel281
  - number: 281.1.b
    text: het gezag over de onder zijn voogdij staande minderjarige aan een of beide ouders is opgedragen; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel281
  - number: 281.1.c
    text: |-
      de voogdij overeenkomstig [artikel 299a][ref1] van dit boek aan een andere voogd is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel299a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel281
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 299a
        paragraaf: '3'
        afdeling: '6'
  - number: '281.2'
    text: |-
      Is een beschikking als in het eerste lid bedoeld, uitvoerbaar verklaard bij voorraad, dan eindigt de voogdij daags
      nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel281
  - number: '282.1'
    text: |-
      Op eensluidend verzoek van de voogd en een ander die in een nauwe persoonlijke betrekking tot het kind staat, kan
      de rechter bepalen dat de voogdij door hen gezamenlijk wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282
  - number: '282.2'
    text: |-
      Voor de duur van de gezamenlijke uitoefening van de voogdij worden beide in het eerste lid bedoelde personen als
      voogd aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282
  - number: '282.3'
    text: |-
      Het verzoek wordt afgewezen indien gegronde vrees bestaat dat bij inwilliging de belangen van het kind zouden
      worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282
  - number: '282.4'
    text: |-
      Gezamenlijke uitoefening van de voogdij is niet mogelijk ten aanzien van tijdelijke voogdij als bedoeld in de
      [artikelen 296][ref1] en [297][ref2]. Zij staat niet open voor rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel296
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel297
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '296'
        paragraaf: '3'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '297'
        paragraaf: '3'
        afdeling: '6'
  - number: '282.5'
    text: |-
      [Artikel 253a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: '282.6'
    text: |-
      In afwijking van [artikel 336][ref1] hebben twee voogden die gezamenlijk de voogdij uitoefenen, de plicht en het
      recht het minderjarige kind te verzorgen en op te voeden. [Artikel 253w][ref2] is, zolang de gezamenlijke voogdij
      voortduurt, ten aanzien van hen beiden van overeenkomstige toepassing, tenzij het betreft pleegouders die zijn
      belast met de gezamenlijke voogdij en die met een zorgaanbieder een pleegcontract hebben gesloten als bedoeld in
      [artikel 5.2 van de Jeugdwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel336
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253w
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel5
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '336'
        paragraaf: '9'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253w
        paragraaf: '3'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '5'
  - number: '282.7'
    text: |-
      Een verzoek als bedoeld in het eerste lid kan vergezeld gaan van een verzoek tot wijziging van de geslachtsnaam van
      het kind in de geslachtsnaam van een van de voogden. Een zodanig verzoek wordt afgewezen, indien:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282
  - number: 282.7.a
    text: het kind van twaalf jaar of ouder ter gelegenheid van zijn verhoor niet heeft ingestemd met het verzoek;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282
  - number: 282.7.b
    text: het verzoek tot gezamenlijke voogdij wordt afgewezen; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282
  - number: 282.7.c
    text: het belang van het kind zich tegen toewijzing verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282
  - number: 282a
    text: |-
      De gezamenlijke uitoefening van de voogdij eindigt op de dag waarop in kracht van gewijsde is gegaan de beschikking
      waarbij de gezamenlijke uitoefening van de voogdij is beëindigd of waarbij de voogdij is geëindigd ingevolge
      [artikel 281][ref1], alsmede na het overlijden van een van de voogden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel281
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '281'
        paragraaf: '1'
        afdeling: '6'
  - number: 282b
    text: |-
      Na de dood van een voogd die de voogdij samen met een ander uitoefende, oefent de andere voogd voortaan alleen de
      voogdij over de kinderen uit.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel282b
  - number: '283'
    text: |-
      De verzoeken die de gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref1], dan wel de
      rechtspersoon, bedoeld in [artikel 302, tweede lid][ref2], in verband met de uitoefening van de voogdij tot de
      rechter richt, kunnen worden ingediend zonder advocaat en worden kosteloos behandeld. De grossen, afschriften, en
      uittreksels, die zij tot dit doel aanvragen, worden hun door de griffiers vrij van alle kosten uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel283
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '302'
        paragraaf: '4'
        afdeling: '6'
  - number: '292.1'
    text: |-
      Een ouder kan bij uiterste wilsbeschikking of door hiervan aantekening te laten opnemen in het register, bedoeld
      in [artikel 244][ref1], bepalen welke persoon dan wel welke twee personen na zijn dood voortaan als voogd
      onderscheidenlijk als gezamenlijke voogden het gezag over zijn kinderen zullen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel244
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel292
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '244'
        afdeling: '4'
  - number: '292.2'
    text: Hij kan geen rechtspersoon als voogd aanwijzen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel292
  - number: '292.3'
    text: |-
      Hebben beide ouders van deze bevoegdheid gebruik gemaakt, en sterven zij, zonder dat men kan weten wie het eerst
      overleden is, dan bepaalt de rechtbank ambtshalve wiens beschikking of aantekening gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel292
  - number: '292.4'
    text: |-
      Heeft een ouder bij beschikking en bij aantekening verschillende voogden aangewezen, dan heeft de laatst gedane
      aanwijzing gevolg.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel292
  - number: '293'
    text: 'De door de ouder getroffen regeling heeft geen gevolg of vervalt:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel293
  - number: 293.a
    text: |-
      indien na zijn overlijden de andere ouder van rechtswege of krachtens rechterlijke beschikking het gezag over zijn
      kinderen uitoefent;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel293
  - number: 293.b
    text: indien en voor zover hij op het tijdstip van zijn overlijden het gezag over zijn kinderen niet heeft;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel293
  - number: 293.c
    text: indien de ander die met de ouder gezamenlijk het gezag uitoefent van rechtswege de voogd over de kinderen wordt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel293
  - number: '295'
    text: |-
      De rechtbank benoemt een voogd over alle minderjarigen, die niet onder ouderlijk gezag staan en in wier voogdij
      niet op wettige wijze is voorzien.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel295
  - number: '296.1'
    text: |-
      Is voorziening nodig in afwachting van het begin der voogdij overeenkomstig [artikel 280][ref1] van dit boek, dan
      benoemt de rechtbank een voogd voor de duur van deze omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel280
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel296
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '280'
        paragraaf: '1'
        afdeling: '6'
  - number: '296.2'
    text: |-
      Zodra bedoelde omstandigheden zijn vervallen, wordt deze voogd op verzoek van hem die hij vervangt, door de
      rechtbank ontslagen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel296
  - number: '297.1'
    text: 'De rechtbank benoemt insgelijks een voogd, wanneer voorziening nodig is wegens:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel297
  - number: 297.1.a
    text: tijdelijke onmogelijkheid, waarin een voogd zich bevindt, het gezag uit te oefenen; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel297
  - number: 297.1.b
    text: onbekendheid van bestaan of verblijfplaats van de voogd; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel297
  - number: 297.1.c
    text: in gebreke blijven van de voogd, het gezag uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel297
  - number: '297.2'
    text: |-
      Is de benoeming op het eerste lid onder *c* gegrond, dan kan de rechtbank de benoemde voogd een beloning
      toekennen en is de in gebreke gebleven voogd jegens de minderjarige aansprakelijk voor de kosten die de vervanging
      veroorzaakt, alsmede, behoudens zijn verhaal op de benoemde voogd, voor diens verrichtingen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel297
  - number: '297.3'
    text: |-
      Indien de in het eerste lid genoemde omstandigheden zijn vervallen, kan de voogd op eigen verzoek of op verzoek van
      degene die hij vervangt, door de rechtbank worden ontslagen tenzij de rechtbank dit niet in het belang van het kind
      noodzakelijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel297
  - number: '297.4'
    text: |-
      Indien in geval van gezamenlijke uitoefening van de voogdij een van de in het eerste lid bedoelde omstandigheden
      zich voordoet ten aanzien van een van beide voogden, oefent de andere voogd het gezag over de kinderen alleen uit.
      Zodra deze omstandigheid is vervallen, herleeft de gezamenlijke voogdij. Het tweede lid is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel297
  - number: '298'
    text: |-
      Gedurende de in de beide voorgaande artikelen bedoelde voogdij is de uitoefening van de voogdij geschorst ten
      aanzien van de voogd die het betreft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel298
  - number: '299'
    text: |-
      De rechtbank benoemt de voogd op verzoek van bloed- of aanverwanten van de minderjarige, de raad voor de
      kinderbescherming, schuldeisers of andere belanghebbenden, of ambtshalve, behoudens [artikel 282a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel282a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel299
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 282a
        paragraaf: '1'
        afdeling: '6'
  - number: 299a.1
    text: |-
      Degene die met instemming van de voogd een minderjarige in zijn gezin - anders dan uit hoofde van een
      ondertoezichtstelling of een plaatsing onder voorlopige voogdij - ten minste een jaar heeft verzorgd en opgevoed,
      kan de kinderrechter verzoeken hem, dan wel een rechtspersoon als bedoeld in [artikel 302 van dit boek][ref1], tot
      voogd te benoemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel299a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '302'
        paragraaf: '4'
        afdeling: '6'
  - number: 299a.2
    text: |-
      Indien de minderjarige door meer dan een persoon als behorende tot het gezin wordt verzorgd en opgevoed, kan het
      verzoek slechts door dezen gemeenschappelijk worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel299a
  - number: 299a.3
    text: Het verzoek kan ook worden gedaan door de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel299a
  - number: 299a.4
    text: |-
      De kinderrechter willigt het verzoek slechts in, indien hij dit in het belang van de minderjarige acht en hem
      genoegzaam is gebleken, dat de voogd niet bereid is zich van zijn bediening te doen ontslaan. Alsdan benoemt hij
      bij voorkeur degene wiens benoeming wordt verzocht tot voogd, mits deze bevoegd is tot uitoefening van de voogdij.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel299a
  - number: 299a.5
    text: |-
      Is het bij het eerste lid bedoelde verzoek gedaan, dan blijft het [tweede lid van artikel 336][ref1] buiten
      toepassing, totdat op het verzoek bij gewijsde is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel336a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel299a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 336a
        paragraaf: '9'
        afdeling: '6'
  - number: 299a.6
    text: |-
      In geval van gezamenlijke uitoefening van de voogdij wordt de in het eerste lid bedoelde instemming door beide
      voogden gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel299a
  - number: '301.1'
    text: 'De ambtenaar van de burgerlijke stand geeft de rechtbank onverwijld kennis:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel301
  - number: 301.1.a
    text: van het overlijden van ieder die minderjarige kinderen achterlaat;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel301
  - number: 301.1.b
    text: |-
      van de aangifte van geboorte van ieder kind, over wie de moeder uit wie het kind is geboren niet van rechtswege het
      gezag uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel301
  - number: '301.2'
    text: |-
      Indien het huwelijk van de overledene die minderjarige kinderen nalaat, gerechtelijk was ontbonden, of de
      overledene van tafel en bed gescheiden was, bericht de ambtenaar van de burgerlijke stand - zo de andere ouder nog
      leeft - deze omstandigheden tevens aan de rechtbank. De rechtbank zendt, indien deze een andere is, de door haar
      ontvangen kennisgeving door aan de rechtbank die over het verzoek tot ontbinding van het huwelijk of tot scheiding
      van tafel en bed heeft beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel301
  - number: '302.1'
    text: |-
      De rechter kan de voogdij opdragen aan een gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel302
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '302.2'
    text: |-
      Onverminderd diens bevoegdheid een natuurlijke persoon tot voogd te benoemen, kan de rechter de voogdij over
      een minderjarige door of voor wie een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd
      als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref1] is ingediend, en in verband daarmee in Nederland
      verblijft, alsmede over door Onze Minister van Justitie aan te wijzen categorieën andere minderjarigen, uitsluitend
      opdragen aan een daartoe door Onze Minister van Justitie aanvaarde rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel302
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
  - number: '302.3'
    text: |-
      Onze Minister van Justitie kan voorwaarden stellen bij of voorschriften verbinden aan de aanvaarding, bedoeld in
      het tweede lid, en de rechtspersoon voor een bepaalde tijd aanvaarden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel302
  - number: '302.4'
    text: |-
      Op een rechtspersoon als bedoeld in het tweede lid, zijn de [artikelen 303][ref1], [304][ref2], [305][ref3] en
      [328][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel303
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel304
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel305
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel328
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel302
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '303'
        paragraaf: '4'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '304'
        paragraaf: '4'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '305'
        paragraaf: '4'
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '328'
        paragraaf: '8'
        afdeling: '6'
  - number: '303'
    text: |-
      Voor zover de wet niet anders bepaalt, heeft de gecertificeerde instelling, bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1], die met de voogdij is belast, dezelfde bevoegdheden en verplichtingen als
      andere voogden.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel303
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '304.1'
    text: |-
      Met de gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref1] zijn de bestuurders hoofdelijk en
      persoonlijk aansprakelijk voor iedere schade, die te wijten is aan een niet-behoorlijke uitoefening van de voogdij.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '304.2'
    text: |-
      Iedere bestuurder zal zich echter van zijn aansprakelijkheid kunnen bevrijden door te bewijzen, dat hij geen schuld
      heeft aan de schade.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel304
  - number: '306.1'
    text: |-
      Zonder toestemming van de rechtbank mag een gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1] een hem toevertrouwde minderjarige niet buiten Nederland plaatsen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel306
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '306.2'
    text: De rechter verleent deze toestemming slechts, indien hij de plaatsing voor de minderjarige wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel306
  - number: 306a
    text: |-
      De [zesde afdeling][ref1] van deze titel is niet van toepassing op de uitoefening van de voorlopige voogdij als
      bedoeld in de [artikelen 241][ref2], [268][ref3] en [331][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling6
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel241
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel268
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel331
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel306a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '241'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '268'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '331'
        paragraaf: '8'
        afdeling: '6'
  - number: '322.1'
    text: 'Iedere voogd kan zich van zijn bediening doen ontslaan, indien:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel322
  - number: 322.1.a
    text: |-
      hij aantoont, dat hij tengevolge van een sedert de aanvang van zijn bediening opgekomen geestelijk of lichamelijk
      gebrek niet meer in staat is deze waar te nemen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel322
  - number: 322.1.b
    text: |-
      hij de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft
      bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel322
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 322.1.c
    text: |-
      een daartoe bevoegd persoon zich schriftelijk heeft bereid verklaard de voogdij over te nemen, en de rechtbank deze
      overneming in het belang van de minderjarigen acht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel322
  - number: '322.2'
    text: |-
      Bij gezamenlijke uitoefening van de voogdij is het eerste lid slechts van toepassing indien beide voogden zich van
      hun bediening willen doen ontslaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel322
  - number: '323'
    text: |-
      Op verzoek van de voogden gezamenlijk of van een van hen beëindigt de rechter de gezamenlijke uitoefening van de
      voogdij. Alsdan bepaalt de rechter aan wie van beide voortaan het gezag over ieder der minderjarige kinderen alleen
      zal toekomen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel323
  - number: '324.1'
    text: |-
      Wanneer een voogd op een der in [artikel 246][ref1] van dit boek genoemde gronden onbevoegd is tot de voogdij,
      ontslaat de rechtbank hem en vervangt hem door een andere voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel324
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
  - number: '324.2'
    text: |-
      Zij doet dit op verzoek van de voogd, bloed- of aanverwanten van de minderjarige, de raad voor de
      kinderbescherming, schuldeisers of andere belanghebbenden, of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel324
  - number: '324.3'
    text: |-
      Indien in geval van gezamenlijke uitoefening van de voogdij een van de in het eerste lid genoemde gronden zich
      voordoet ten aanzien van een van beide voogden, oefent de andere voogd het gezag over de kinderen alleen uit.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel324
  - number: '324.4'
    text: Zodra de grond van de onbevoegdheid is vervallen, herleeft de gezamenlijke voogdij.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel324
  - number: '326.1'
    text: Kinderen die onder voogdij staan van natuurlijke personen, kunnen onder toezicht worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel326
  - number: '326.2'
    text: |-
      Op deze ondertoezichtstelling is [afdeling 4 van titel 14][ref1] van overeenkomstige toepassing, met dien verstande
      nochtans, dat de ondertoezichtstelling en de verlenging daarvan ook door de voogd kunnen worden verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling4
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel326
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '4'
  - number: '327'
    text: 'De rechtbank kan de voogdij van een natuurlijk persoon beëindigen indien:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel327
  - number: 327.a
    text: |-
      een minderjarige zodanig opgroeit dat hij in zijn ontwikkeling ernstig wordt bedreigd, en de voogd niet de
      verantwoordelijkheid voor de verzorging en opvoeding, bedoeld in [artikel 247, tweede lid][ref1], in staat is te
      dragen binnen een voor de persoon en de ontwikkeling van de minderjarige aanvaardbaar te achten termijn, of


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '247'
        afdeling: '1'
  - number: 327.b
    text: de voogd het gezag misbruikt , of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel327
  - number: 327.c
    text: |-
      niet beschikt over de ingevolge [artikel 2 van de Wet opneming buitenlandse kinderen ter adoptie][ref1] vereiste
      beginseltoestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel2
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '2'
  - number: '328'
    text: |-
      De rechtbank kan de voogdij van een gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1]
      of van een rechtspersoon als bedoeld in [artikel 302, tweede lid][ref2], beëindigen indien een minderjarige zodanig
      opgroeit dat hij in zijn ontwikkeling ernstig wordt bedreigd, en:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel328
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '302'
        paragraaf: '4'
        afdeling: '6'
  - number: 328.a
    text: |-
      zij haar taken op een niet verantwoorde wijze uitoefent als bedoeld in
      [artikel 4.1.1, tweede lid, van de Jeugdwet][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel328
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
  - number: 328.b
    text: |-
      zij nalaat overeenkomstig [artikel 305][ref1] de raad voor de kinderbescherming op de hoogte te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel305
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel328
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '305'
        paragraaf: '4'
        afdeling: '6'
  - number: '329.1'
    text: |-
      Beëindiging van de voogdij kan worden uitgesproken op verzoek van de raad voor de kinderbescherming, het openbaar
      ministerie of een der bloed- of aanverwanten van de minderjarige tot en met de vierde graad.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel329
  - number: '329.2'
    text: |-
      Ingeval [artikel 336a][ref1] toepassing heeft gevonden, kan de beëindiging bovendien worden verzocht door degene of
      degenen die de minderjarige als behorende tot hun gezin verzorgen en opvoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel336a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 336a
        paragraaf: '9'
        afdeling: '6'
  - number: '329.3'
    text: |-
      In het geval, bedoeld in [artikel 367][ref1], kan de rechtbank de voogdij ambtshalve beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel367
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '367'
        paragraaf: '10'
        afdeling: '6'
  - number: '331.1'
    text: |-
      De rechtbank kan een met de voogdij belaste natuurlijke persoon geheel of gedeeltelijk in de uitoefening van het
      gezag schorsen indien:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel331
  - number: 331.1.a
    text: |-
      een ernstig vermoeden bestaat dat de grond, bedoeld in [artikel 266, eerste lid, aanhef en onder a of b][ref1] is
      vervuld en de maatregel noodzakelijk is om een acute en ernstige bedreiging voor de minderjarige weg te nemen, of


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel266
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel331
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '266'
        afdeling: '5'
  - number: 331.1.b
    text: |-
      een medische behandeling van een minderjarige jonger dan twaalf jaar of van de minderjarige van twaalf jaar of
      ouder die niet in staat kan worden geacht tot een redelijke waardering van zijn belangen terzake, noodzakelijk is
      om ernstig gevaar voor diens gezondheid af te wenden en de voogd toestemming daarvoor weigert.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel331
  - number: '331.2'
    text: |-
      Indien de voogdij gezamenlijk wordt uitgeoefend, wordt na schorsing van de voogdij van één van hen de voogdij
      door de andere voogd alleen uitgeoefend, tenzij de kinderrechter een gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1], met de voorlopige voogdij over het kind belast. In dat geval is ook het gezag
      van deze andere voogd geschorst.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel331
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '331.3'
    text: |-
      [Artikel 329, eerste en tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel329
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel331
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '329'
        paragraaf: '8'
        afdeling: '6'
  - number: '331.4'
    text: |-
      De schorsing in de uitoefening van het gezag vervalt na verloop van drie maanden na de dag van de beschikking,
      tenzij voor het einde van deze termijn om een beëindiging van de voogdij is verzocht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel331
  - number: 331a
    text: |-
      In plaats van schorsing van de voogd in de uitoefening van de voogdij en voorziening in de voorlopige voogdij
      als bedoeld in [artikel 331][ref1], kan de rechtbank de minderjarige onder toezicht stellen als bedoeld in
      [artikel 254 van dit Boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel331
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel254
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel331a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '331'
        paragraaf: '8'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '254'
        afdeling: '4'
  - number: 332a
    text: |-
      De rechtbank die een verzoek tot beëindiging van de voogdij afwijst, is bevoegd een minderjarige onder toezicht te
      stellen als bedoeld in [artikel 255][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel332a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '255'
        afdeling: '4'
  - number: '334.1'
    text: |-
      Indien de rechtbank de beëindiging van de voogdij uitspreekt, voorziet zij tevens in het gezag, behoudens het
      bepaalde in het derde lid.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel334
  - number: '334.2'
    text: |-
      Ieder die tot de uitoefening van het gezag bevoegd is, kan tijdens het onderzoek schriftelijk aan de rechtbank
      verzoeken daarmede te worden belast.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel334
  - number: '334.3'
    text: |-
      Indien sprake is van gezamenlijke uitoefening van de voogdij en de beëindiging van de voogdij slechts een van de
      voogden betreft, wordt de voogdij voortaan door de andere voogd alleen uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel334
  - number: '335'
    text: |-
      Degene van wie de voogdij is beëindigd op grond van [artikel 327, eerste lid, aanhef en onder a, b of c][ref1] kan
      niet wederom tot voogd over die minderjarige worden benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel327
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel335
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '327'
        paragraaf: '8'
        afdeling: '6'
  - number: '336'
    text: De voogd draagt zorg, dat de minderjarige overeenkomstig diens vermogen wordt verzorgd en opgevoed.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel336
  - number: 336a.1
    text: |-
      Indien de minderjarige door een ander of anderen dan zijn voogd, als behorende tot het gezin met instemming van de
      voogd ten minste een jaar is verzorgd en opgevoed geworden, kan de voogd niet dan met toestemming van degenen die
      de verzorging en opvoeding op zich hebben genomen, wijziging in het verblijf van de minderjarige brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel336a
  - number: 336a.2
    text: |-
      Voor zover de volgens het vorige lid vereiste toestemmingen niet worden verkregen, kunnen zij op verzoek van de
      voogd door die van de rechtbank worden vervangen. Dit verzoek wordt slechts ingewilligd indien de rechtbank dit in
      het belang van de minderjarige noodzakelijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel336a
  - number: 336a.3
    text: |-
      In geval van afwijzing van het verzoek is de beschikking van kracht gedurende een door de rechtbank te bepalen
      termijn, welke de duur van zes maanden niet te boven mag gaan. Is echter voor het einde van deze termijn een
      verzoek tot ondertoezichtstelling van het kind, tot beëindiging van de voogdij, dan wel een verzoek als bedoeld in
      [artikel 299a, van dit boek][ref1] aanhangig gemaakt, dan blijft de beschikking gelden, totdat op het verzoek bij
      gewijsde is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel299a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel336a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 299a
        paragraaf: '3'
        afdeling: '6'
  - number: 336a.4
    text: |-
      In geval van gezamenlijke uitoefening van de voogdij, wordt de in het eerste lid bedoelde instemming door beide
      voogden gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel336a
  - number: '337.1'
    text: De voogd vertegenwoordigt de minderjarige in burgerlijke handelingen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel337
  - number: '337.2'
    text: |-
      De voogd moet het bewind over het vermogen van de minderjarige als een goed voogd voeren. Bij slecht bewind is hij
      voor de daardoor veroorzaakte schade aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel337
  - number: '337.3'
    text: |-
      Indien goederen die de minderjarige geschonken of vermaakt zijn, onder bewind zijn gesteld, is de voogd bevoegd van
      de bewindvoerder rekening en verantwoording te vorderen. Vervalt dit bewind, dan komen de goederen onder het bewind
      van de voogd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel337
  - number: 337a.1
    text: |-
      In geval van gezamenlijke uitoefening van de voogdij worden de bevoegdheden die de voogd ingevolge de paragrafen
      10 en 11 heeft, gezamenlijk door de voogden uitgeoefend, met dien verstande dat de bevoegdheden ook aan een voogd
      alleen toekomen tenzij van bezwaren van de andere voogd is gebleken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel337a
  - number: 337a.2
    text: De in bedoelde paragrafen genoemde verplichtingen rusten op ieder van de voogden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel337a
  - number: '338.1'
    text: |-
      De voogd zorgt dat het vermogen van de minderjarige, zoals dit bij het begin van zijn voogdij is samengesteld, zo
      spoedig mogelijk wordt geïnventariseerd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel338
  - number: '338.2'
    text: |-
      Binnen acht weken na het begin van zijn voogdij doet de voogd ter griffie van de rechtbank van het arrondissement
      waarin de woonplaats van de minderjarige is gelegen schriftelijk opgave van de bij dat begin aanwezige gerede
      gelden, effecten aan toonder en spaarbankboekjes.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel338
  - number: '338.3'
    text: |-
      Binnen acht maanden na het begin van zijn voogdij levert de voogd een ter bevestiging van haar deugdelijkheid door
      hem ondertekende boedelbeschrijving in ter griffie van de rechtbank van het arrondissement waarin de woonplaats van
      de minderjarige is gelegen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel338
  - number: '338.4'
    text: |-
      In de boedelbeschrijving is begrepen een opgave van de wijzigingen in de samenstelling van het vermogen tot het
      ogenblik dat zij wordt opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel338
  - number: '339.1'
    text: |-
      Wanneer de goederen van de minderjarigen een waarde van € 11 250 niet te boven gaan, kan de voogd een door hem
      ondertekende, volgens een door Onze Minister van Justitie vastgesteld model opgemaakte, verklaring daaromtrent
      in plaats van de boedelbeschrijving inleveren. De voogd van twee of meer kinderen van dezelfde ouders kan met een
      zodanige verklaring slechts volstaan, wanneer bovendien de goederen der minderjarigen tezamen een waarde van € 22
      500 niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel339
  - number: '339.2'
    text: |-
      De kantonrechter kan te allen tijde bepalen dat alsnog een beschrijving van het vermogen van de minderjarige, zoals
      dit op de datum van zijn beschikking is samengesteld, met overeenkomstige toepassing van het vorige artikel moet
      worden opgemaakt en ingeleverd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel339
  - number: '340.1'
    text: |-
      De kantonrechter kan bij gebleken noodzakelijkheid een langere termijn voor de inlevering van een
      boedelbeschrijving of een verklaring, als bedoeld in het vorige artikel, stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel340
  - number: '340.2'
    text: |-
      Indien binnen de daarvoor gestelde termijn geen boedelbeschrijving, noch een verklaring als bedoeld in het vorige
      artikel is ingeleverd, doet de kantonrechter binnen tien dagen na het einde van die termijn de voogd ten verhore
      oproepen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel340
  - number: '341.1'
    text: |-
      In de boedelbeschrijving of in de verklaring, bedoeld in [artikel 339 van dit boek][ref1], moet de voogd opgeven
      wat hij van de minderjarige heeft te vorderen. Bij gebreke hiervan zal hij zijn vorderingsrecht niet voor diens
      meerderjarigheid kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel339
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel341
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
  - number: '341.2'
    text: Zolang de voogd zijn vorderingsrecht niet kan uitoefenen, draagt de hoofdsom van zijn vordering geen rente.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel341
  - number: '342.1'
    text: |-
      De vier vorige artikelen zijn van overeenkomstige toepassing, wanneer de minderjarige gedurende de voogdij door
      schenking, erfopvolging of making vermogen krijgt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel342
  - number: '342.2'
    text: |-
      De inspecteur bij wie de aangifte voor het recht van successie, van overgang of van schenking moet worden
      ingediend, en aan wie ambtshalve bekend is dat de minderjarige vermogen heeft verkregen, is verplicht de
      kantonrechter van diens woonplaats hiervan te verwittigen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel342
  - number: '343'
    text: |-
      De voogd kan, onverminderd zijn aansprakelijkheid voor de door zijn slecht bewind veroorzaakte schade, voor de
      minderjarige alle handelingen verrichten, die hij in diens belang noodzakelijk, nuttig of wenselijk acht, behoudens
      het bepaalde bij de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel343
  - number: '344.1'
    text: |-
      Voorzover de kantonrechter niet anders bepaalt, geeft de voogd de effecten aan toonder van de minderjarige in
      bewaring bij:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel344
  - number: 344.1.a
    text: de Nederlandsche Bank N.V.;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel344
  - number: 344.1.b
    text: |-
      een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van
      bank mag uitoefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel344
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '344.2'
    text: |-
      De kantonrechter kan aanwijzingen geven omtrent de wijze, waarop spaarbankboekjes en gelden van de minderjarige
      moeten worden bewaard. De kantonrechter onder wiens goedkeuring een verdeling tot stand komt, kan ter
      gelegenheid daarvan aanwijzingen als hier bedoeld geven. Overigens is de kantonrechter, aangewezen in de
      [tweede afdeling van de derde titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#AfdelingTweede
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel344
    references:
      - id: ref1
        bwb_id: BWBR0001827
        afdeling: Tweede
  - number: '344.3'
    text: |-
      Voor effecten aan toonder, spaarbankboekjes en gelden, die de minderjarige tezamen met een of meer andere personen
      toekomen, geldt het bepaalde in de vorige leden, wanneer de voogd die onder zijn berusting heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel344
  - number: '345.1'
    text: |-
      De voogd behoeft machtiging van de kantonrechter om de navolgende handelingen voor rekening van de minderjarige
      te verrichten:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel345
  - number: 345.1.a
    text: |-
      aangaan van overeenkomsten strekkende tot beschikking over goederen van de minderjarige, tenzij de handeling geld
      betreft, als een gewone beheersdaad kan worden beschouwd, of krachtens rechterlijk bevel geschiedt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel345
  - number: 345.1.b
    text: giften doen, andere dan gebruikelijke, niet bovenmatige;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel345
  - number: 345.1.c
    text: een making of gift, waaraan lasten of voorwaarden zijn verbonden, aannemen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel345
  - number: 345.1.d
    text: geld lenen of de minderjarige als borg of hoofdelijke medeschuldenaar verbinden;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel345
  - number: 345.1.e
    text: |-
      overeenkomen dat een boedel, waartoe de minderjarige gerechtigd is, voor een bepaalde tijd onverdeeld wordt
      gelaten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel345
  - number: '345.2'
    text: |-
      De kantonrechter kan bepalen dat de voogd zijn machtiging behoeft voor het innen van
      vorderingen van de minderjarige, het disponeren over saldi bij een bank als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] daaronder begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel345
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '345.3'
    text: |-
      Voor het aangaan van een overeenkomst tot beëindiging van een geschil waarbij de minderjarige is betrokken, behoeft
      de voogd geen machtiging in het geval van [artikel 87 van het Wetboek van Burgerlijke Rechtsvordering][ref1] of
      indien het voorwerp van de onzekerheid of het geschil een waarde van € 700 niet te boven gaat, noch indien de
      overeenkomst als een beheersdaad is te beschouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel87
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel345
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '87'
  - number: '346.1'
    text: |-
      De voogd kan geen goederen van de minderjarige kopen, huren of pachten, zonder dat de kantonrechter de te sluiten
      overeenkomst goedkeurt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel346
  - number: '346.2'
    text: In geval van openbare verkoop, verhuur of verpachting moet de goedkeuring binnen een maand daarna zijn aangevraagd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel346
  - number: '347.1'
    text: |-
      Een in strijd met [artikel 345][ref1] of [346][ref2] verrichte rechtshandeling ten name van de minderjarige is
      vernietigbaar; op de vernietigingsgrond kan slechts een beroep worden gedaan van de zijde van de minderjarige.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel345
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel346
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '345'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '346'
        paragraaf: '10'
        afdeling: '6'
  - number: '347.2'
    text: |-
      Het vorige lid geldt niet voor een rechtshandeling anders dan om niet indien de wederpartij te goeder trouw was en
      voor een rechtshandeling die de minderjarige geen nadeel heeft berokkend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel347
  - number: '348.1'
    text: |-
      De voogd kan, zonder dat de kantonrechter de te sluiten overeenkomst goedkeurt, geen inschuld ten laste van de
      minderjarige, noch enig beperkt recht op diens goederen van een derde verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel348
  - number: '348.2'
    text: Ontbreekt deze goedkeuring, dan is de overeenkomst nietig.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel348
  - number: '349.1'
    text: |-
      Een voogd die zonder machtiging van de kantonrechter voor de minderjarige als eiser in rechte optreedt of tegen een
      uitspraak beroep instelt, wordt niet-ontvankelijk verklaard.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel349
  - number: '349.2'
    text: |-
      De voogd mag niet zonder machtiging van de kantonrechter in een tegen de minderjarige ingestelde eis of in een
      gedane uitspraak berusten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel349
  - number: '349.3'
    text: |-
      Hij kan, alvorens voor de minderjarige in rechte verweer te voeren of tegen een bij verstek gedane uitspraak verzet
      te doen, zich te zijner verantwoording doen machtigen door de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel349
  - number: '350.1'
    text: De voogd draagt zorg voor een doelmatige belegging van het vermogen van de minderjarige.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel350
  - number: '350.2'
    text: |-
      Hij behoeft voor elke belegging van gelden van de minderjarige machtiging van de kantonrechter. Nochtans mag
      hij, voor zover de kantonrechter niet anders bepaalt, zonder diens machtiging gelden ten name van de minderjarige
      beleggen bij een financiële onderneming als bedoeld in [artikel 344, eerste lid, onderdeel b][ref1] op rekeningen
      bestemd voor de belegging van gelden van minderjarigen, met het beding dat de gelden alleen worden terugbetaald met
      machtiging van de kantonrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel344
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel350
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '344'
        paragraaf: '10'
        afdeling: '6'
  - number: '351.1'
    text: |-
      Wanneer het vermogen van de minderjarige of een gedeelte daarvan in een onderneming van handel, landbouw of
      nijverheid is geplaatst, mag de voogd de zaken voor rekening, hetzij van de minderjarige alleen, hetzij van deze
      met anderen, niet voortzetten dan met machtiging van de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel351
  - number: '351.2'
    text: |-
      Zonder machtiging van de kantonrechter mag de voogd een boedel, waartoe de minderjarige gerechtigd is, niet
      onverdeeld laten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel351
  - number: '352'
    text: |-
      Ondanks het ontbreken der vereiste machtiging zijn handelingen, door de voogd verricht in strijd met
      [artikel 350][ref1] of [artikel 351][ref2], geldig.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel350
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel351
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel352
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '350'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '351'
        paragraaf: '10'
        afdeling: '6'
  - number: '353'
    text: |-
      De voogd kan niet zonder machtiging van de kantonrechter van een de minderjarige toekomend aandeel in een ontbonden
      huwelijksgemeenschap afstand doen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel353
  - number: '354'
    text: |-
      De kantonrechter kan te allen tijde de voogd ten verhore doen oproepen. Deze is verplicht alle door de
      kantonrechter gewenste inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel354
  - number: '355.1'
    text: |-
      Aan een met het gezag belaste ouder of aan een ouder die alleen het bewind over het vermogen heeft en die aangifte
      heeft gedaan van zijn voornemen een huwelijk of een geregistreerd partnerschap aan te gaan, kan de kantonrechter
      opdragen binnen een bepaalde termijn een beschrijving van het vermogen van de kinderen op te maken en deze
      beschrijving of een afschrift daarvan ter griffie van de rechtbank in te leveren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel355
  - number: '355.2'
    text: |-
      De [artikelen 339][ref1], [340][ref2] en [341 van dit boek][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel339
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel340
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel341
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel355
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '340'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '341'
        paragraaf: '10'
        afdeling: '6'
  - number: '356.1'
    text: |-
      Aanwijzingen en machtigingen, als in deze paragraaf bedoeld, geeft de kantonrechter slechts, indien dit hem in het
      belang van de minderjarige noodzakelijk, nuttig of wenselijk blijkt te zijn. Hij kan een bijzondere of een algemene
      machtiging geven en daaraan zodanige voorwaarden verbinden, als hij dienstig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel356
  - number: '356.2'
    text: Hij kan een gegeven aanwijzing of machtiging te allen tijde intrekken of de daaraan verbonden voorwaarden wijzigen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel356
  - number: '357'
    text: |-
      Indien de kosten van een ten behoeve van een minderjarige bevolen maatregel bij rechterlijke beschikking te diens
      laste zijn gebracht, treedt - ingeval dientengevolge het vermogen van de minderjarige moet worden aangesproken -
      in de plaats van de bij [artikel 345 van dit boek][ref1] bedoelde machtiging van de kantonrechter, diens aanwijzing
      van de goederen die verkocht of bezwaard zullen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel345
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel357
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '345'
        paragraaf: '10'
        afdeling: '6'
  - number: '358.1'
    text: |-
      De voogd mag alle noodzakelijke, betamelijke en behoorlijk gerechtvaardigde uitgaven aan de minderjarige in
      rekening brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel358
  - number: '358.2'
    text: |-
      Indien de kantonrechter een bedrag bepaalt, hetwelk jaarlijks mag worden besteed voor de verzorging en opvoeding
      van de minderjarige of voor de kosten van het beheer van diens vermogen, behoeft de voogd de besteding van dat
      bedrag niet gespecificeerd te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel358
  - number: '358.3'
    text: |-
      De kantonrechter kan de voogd een beloning ten laste van de minderjarige toekennen, indien hij dit gezien de
      zwaarte van de last van het bewind redelijk acht. Buiten dit geval mag de voogd voor zichzelf geen loon berekenen,
      tenzij hem dat is toegekend bij de akte, waarbij hij door een ouder benoemd is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel358
  - number: '359.1'
    text: |-
      De kantonrechter kan te allen tijde op verzoek van de andere voogd of ambtshalve aan de voogd de verplichting
      opleggen jaarlijks of eens in de twee of drie jaren ter griffie van de rechtbank een rekening in te dienen van zijn
      bewind over de goederen van de minderjarige.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel359
  - number: '359.2'
    text: De datum voor de indiening van de rekening wordt door de kantonrechter bepaald.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel359
  - number: '359.3'
    text: |-
      Indien in het geval van gezamenlijke uitoefening van de voogdij een van de voogden de rekening alleen heeft
      ingediend, moet hij gelijktijdig een afschrift van de rekening aan de andere voogd doen toekomen. Deze kan binnen
      twee maanden bezwaren tegen de rekening bij de rechter indienen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel359
  - number: '360.1'
    text: Bij verschil van mening omtrent de rekening kan de kantonrechter verbetering daarvan gelasten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel360
  - number: '360.2'
    text: Hij kan een of meer deskundigen benoemen, ten einde de ingediende rekening te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel360
  - number: '360.3'
    text: |-
      De kantonrechter kan de kosten van dit onderzoek, indien slecht bewind aan het licht is gekomen, geheel of ten dele
      ten laste van de voogd brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel360
  - number: '360.4'
    text: De voogd ontvangt een afschrift van het door de deskundigen in te dienen schriftelijk bericht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel360
  - number: '360.5'
    text: |-
      In geval van gezamenlijke uitoefening van de voogdij ontvangen beide voogden het in het vierde lid bedoelde
      afschrift en kan de rechter de in het derde lid bedoelde kosten ook ten laste van de voogden gezamenlijk brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel360
  - number: '361'
    text: |-
      De periodiek door de voogd gedane rekening of een eensluidend afschrift daarvan blijft berusten ter griffie van
      de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel361
  - number: '362'
    text: |-
      De kantonrechter kan op verzoek van de andere voogd of ambtshalve de schade vaststellen, die blijkens de rekening
      de minderjarige door slecht bewind van de voogd geleden heeft, en deze laatste tot vergoeding daarvan veroordelen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel362
  - number: '363.1'
    text: |-
      De kantonrechter kan te allen tijde bevelen dat de voogd voor zijn bewind zekerheid stelt. Hij stelt het bedrag en
      de aard van de zekerheid vast. Inpandgeving van effecten aan toonder van de voogd geschiedt door hun inbewaargeving
      bij de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel363
  - number: '363.2'
    text: |-
      De kantonrechter bepaalt een redelijke termijn, binnen welke de voogd hem te zijnen genoegen moet aantonen dat hij
      de van hem verlangde zekerheid gesteld heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel363
  - number: '363.3'
    text: |-
      De kantonrechter kan de voogd toestaan een gestelde zekerheid door een andere te vervangen. Indien het belang
      van de voogd het vervallen van een gestelde zekerheid volstrekt eist of handhaving daarvan niet nodig is, kan de
      kantonrechter hem machtigen daarvan namens de minderjarige afstand te doen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel363
  - number: '364.1'
    text: |-
      De door de voogd gestelde zekerheid houdt op, zodra zijn rekening en verantwoording is goedgekeurd, of zodra de
      rechtsvorderingen die zijn bewind betreffen overeenkomstig [artikel 377 van dit boek][ref1] verjaard zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel364
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '377'
        paragraaf: '11'
        afdeling: '6'
  - number: '364.2'
    text: |-
      Alsdan worden op kosten van de minderjarige hypothecaire inschrijvingen doorgehaald en pandrechten op
      inschrijvingen in de schuldregisters voor geldleningen ten laste van het Rijk opgeheven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel364
  - number: '365'
    text: 'Indien de voogd in gebreke blijft:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel365
  - number: 365.a
    text: gehoor te geven aan een oproeping van de kantonrechter om voor hem te verschijnen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel365
  - number: 365.b
    text: |-
      een boedelbeschrijving of een verklaring als bedoeld in [artikel 339 van dit boek][ref1] in te leveren;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel339
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel365
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
  - number: 365.c
    text: op de door de kantonrechter bepaalde datum zijn periodieke rekening in te dienen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel365
  - number: 365.d
    text: |-
      aan de minderjarige toebehorende spaarbankboekjes, gelden, of toondereffecten die hij niet te diens name heeft doen
      stellen, op de voorgeschreven wijze te bewaren;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel365
  - number: 365.e
    text: de kantonrechter het bewijs te leveren, dat hij een van hem verlangde zekerheid gesteld heeft; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel365
  - number: 365.f
    text: |-
      de schadevergoeding te betalen, waartoe de kantonrechter hem ingevolge [artikel 362 van dit boek][ref1] veroordeeld
      heeft,


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel362
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel365
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '362'
        paragraaf: '10'
        afdeling: '6'
  - number: '366'
    text: 'Insgelijks kan de kantonrechter de raad voor de kinderbescherming ermede in kennis stellen, dat:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel366
  - number: 366.a
    text: de voogd in gevallen, waarin hij machtiging van de kantonrechter behoeft, zijn bewind eigenmachtig voert;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel366
  - number: 366.b
    text: hij zich in zijn bewind aan ontrouw, plichtsverzuim of misbruik van bevoegdheid blijkt te hebben schuldig gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel366
  - number: '367'
    text: |-
      De raad voor de kinderbescherming die van de kantonrechter zodanige mededeling ontvangt, onderwerpt, na
      onderzoek van de overige gedragingen van de voogd jegens de minderjarige, binnen zes weken na de dagtekening
      van die mededeling aan het oordeel van de rechtbank de vraag, of beëindiging van de voogdij op grond van
      [artikel 327][ref1] van dit boek moet volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel327
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel367
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '327'
        paragraaf: '8'
        afdeling: '6'
  - number: '369.1'
    text: |-
      Indien minderjarigen die onder voogdij van verschillende voogden staan, goederen gemeen hebben, kan de
      kantonrechter van de woonplaats van een der minderjarigen een van de voogden of een derde aanwijzen om over deze
      goederen tot de verdeling het bewind te voeren. De aangewezen bewindvoerder stelt de door de rechter van hem
      verlangde waarborgen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel369
  - number: '369.2'
    text: |-
      Komt de in het eerste lid omschreven bevoegdheid aan verschillende rechters toe, dan vervalt deze, nadat een van
      hen daarvan heeft gebruik gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel369
  - number: '369.3'
    text: |-
      Op het bewind zijn de bepalingen omtrent het bewind van een voogd van overeenkomstige toepassing. De bewindvoerder
      is bij uitsluiting bevoegd tot vernietiging van rechtshandelingen van de minderjarige, strekkend tot beheer of
      beschikking met betrekking tot de onder bewind staande goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel369
  - number: '370.1'
    text: |-
      De kantonrechter kan op verzoek van de voogd of ambtshalve, het vermogen van de minderjarige of een deel daarvan,
      met inbegrip van de vruchten, voor de duur van diens minderjarigheid onder bewind stellen, indien hij dit in
      het belang van de minderjarige nodig oordeelt. In geval van gezamenlijke uitoefening van de voogdij wordt tot
      onderbewindstelling slechts beslist indien het verzoek door beide voogden gezamenlijk wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel370
  - number: '370.2'
    text: |-
      De kantonrechter benoemt de bewindvoerder en bepaalt het aan deze toekomende loon. Hij kan bij de instelling
      van het bewind bepalen dat de voogd de door de onderbewindstelling veroorzaakte kosten, met inbegrip van het
      loon, geheel of gedeeltelijk aan de minderjarige moet vergoeden, alsmede dat de voogd, behoudens zijn verhaal
      op de bewindvoerder, voor diens verrichtingen aansprakelijk is jegens de minderjarige. In geval van gezamenlijke
      uitoefening van de voogdij worden deze verplichtingen opgelegd aan beide voogden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel370
  - number: '370.3'
    text: |-
      Op het bewind zijn de bepalingen omtrent het bewind van een voogd van overeenkomstige toepassing. De bewindvoerder
      is bij uitsluiting bevoegd tot vernietiging van rechtshandelingen van de minderjarige, strekkend tot beheer of
      beschikking met betrekking tot de onder bewind staande goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel370
  - number: '370.4'
    text: |-
      De kantonrechter bepaalt welke uitkeringen de bewindvoerder uit de onder het bewind gestelde goederen en de
      vruchten daarvan aan de voogd en bij gezamenlijke uitoefening van de voogdij aan de voogden, moet doen ten behoeve
      van de verzorging en opvoeding van de minderjarige of ten behoeve van het beheer van diens niet onder het bewind
      gestelde goederen. Hij kan deze beschikkingen te allen tijde op verzoek van een voogd of de bewindvoerder, of
      ambtshalve wijzigen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel370
  - number: '370.5'
    text: |-
      De bewindvoerder is verplicht aan de kantonrechter te allen tijde alle door deze gewenste inlichtingen te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel370
  - number: '370.6'
    text: |-
      Hij is voorts verplicht jaarlijks en aan het einde van zijn bewind aan de voogd, en bij gezamenlijke uitoefening
      van de voogdij aan de voogden, de meerderjarig gewordene of de erfgenamen van de minderjarige, wanneer deze
      overleden is, ten overstaan van de kantonrechter rekening en verantwoording af te leggen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel370
  - number: '370.7'
    text: Geschillen die bij de rekening en verantwoording rijzen, beslist de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel370
  - number: '370.8'
    text: |-
      Blijft een der partijen in gebreke tot deze aflegging van rekening en verantwoording mede te werken, dan zijn de
      [artikelen 771 en volgende van het Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel771
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel370
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '771'
  - number: '370.9'
    text: |-
      De kantonrechter kan te allen tijde op verzoek van de bewindvoerder, een voogd of ambtshalve het bewind opheffen of
      de bewindvoerder ontslaan en door een ander vervangen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel370
  - number: '371'
    text: De voogd is verplicht ter griffie van de rechtbank kennis te geven van elke verandering in zijn woonplaats.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel371
  - number: 371a.1
    text: |-
      De griffier van het gerecht dat een voogd benoemt, doet daarvan onverwijld mededeling aan de kantonrechter van de
      rechtbank van het arrondissement waarin de woonplaats van de voogd is gelegen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel371a
  - number: 371a.2
    text: |-
      Woont de voogd niet meer in het arrondissement of is hij opgevolgd door een voogd in een ander arrondissement,
      dan zendt de griffier onverwijld de voogdijbescheiden naar de griffier van het arrondissement waar de voogd of
      opvolgende voogd woonplaats heeft, onder opgave van diens adres.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel371a
  - number: '372'
    text: |-
      Na het einde van zijn bewind doet de voogd daarvan onverwijld rekening en verantwoording. De kosten worden door de
      voogd betaald. Zij komen echter ten laste van de minderjarige. Voor zover de kosten niet op de minderjarige kunnen
      worden verhaald, komen zij ten laste van de ouders, en, zo zij ook op hen niet kunnen worden verhaald, ten laste
      van de Staat.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel372
  - number: '373.1'
    text: |-
      Deze rekening en verantwoording doet de voogd hetzij aan de meerderjarig gewordene, hetzij aan de erfgenamen van de
      minderjarige, wanneer deze overleden is, hetzij aan zijn opvolger in het bewind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel373
  - number: '373.2'
    text: |-
      Indien de gezamenlijke uitoefening van de voogdij is geëindigd en als gevolg daarvan het gezag wordt uitgeoefend
      door een van de voogden alleen, doet degene wiens voogdij geëindigd is rekening en verantwoording aan degene die de
      voogdij alleen uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel373
  - number: '374.1'
    text: |-
      Bedoelde rekening en verantwoording wordt afgelegd ten overstaan van de kantonrechter, binnen wiens rechtsgebied de
      voogd wiens bewind eindigt woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel374
  - number: '374.2'
    text: Geschillen, die bij de aflegging van de rekening en verantwoording mochten rijzen, beslist de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel374
  - number: '374.3'
    text: |-
      Blijft een der partijen in gebreke tot deze aflegging van rekening en verantwoording mede te werken, dan zijn de
      [artikelen 771 en volgende van het Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel771
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel374
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '771'
  - number: '375'
    text: |-
      Een rechtshandeling die de meerderjarig gewordene betreffende de voogdij of de voogdijrekening richt tot of
      verricht met de voogd, is vernietigbaar, indien zij geschiedt vóór het afleggen van de rekening en verantwoording;
      alleen van de zijde van de meerderjarig gewordene kan een beroep op de vernietigingsgrond worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel375
  - number: '376'
    text: |-
      Wat de minderjarige aan de voogd schuldig blijft, draagt geen rente, zolang hij niet - na het sluiten der rekening
        - met de voldoening van het verschuldigde in verzuim is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel376
  - number: '377'
    text: |-
      Elke rechtsvordering op grond van het gevoerde voogdijbewind - zowel van de zijde van de minderjarige als van die
      van de voogd - verjaart door verloop van vijf jaren na de dag, waarop de voogdij van laatstgenoemde is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377
  - number: 377a.1
    text: |-
      Het kind heeft het recht op omgang met zijn ouders en met degene die in een nauwe persoonlijke betrekking tot hem
      staat. De niet met het gezag belaste ouder heeft het recht op en de verplichting tot omgang met zijn kind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377a
  - number: 377a.2
    text: |-
      De rechter stelt op verzoek van de ouders of van een van hen of degene die in een nauwe persoonlijke betrekking
      staat tot het kind, al dan niet voor bepaalde tijd, een regeling inzake de uitoefening van het omgangsrecht vast
      dan wel ontzegt, al dan niet voor bepaalde tijd, het recht op omgang.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377a
  - number: 377a.3
    text: 'De rechter ontzegt het recht op omgang slechts, indien:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377a
  - number: 377a.3.a
    text: omgang ernstig nadeel zou opleveren voor de geestelijke of lichamelijke ontwikkeling van het kind, of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377a
  - number: 377a.3.b
    text: |-
      de ouder of degene die in een nauwe persoonlijke betrekking staat tot het kind kennelijk ongeschikt of kennelijk
      niet in staat moet worden geacht tot omgang, of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377a
  - number: 377a.3.c
    text: |-
      het kind dat twaalf jaren of ouder is, bij zijn verhoor van ernstige bezwaren tegen omgang met zijn ouder of met
      degene met wie hij in een nauwe persoonlijke betrekking staat heeft doen blijken, of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377a
  - number: 377a.3.d
    text: omgang anderszins in strijd is met zwaarwegende belangen van het kind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377a
  - number: 377b.1
    text: |-
      De ouder die met het gezag is belast, is gehouden de niet met het gezag belaste ouder op de hoogte te stellen
      omtrent gewichtige aangelegenheden met betrekking tot de persoon en het vermogen van het kind en deze te raadplegen
        - zo nodig door tussenkomst van derden - over daaromtrent te nemen beslissingen. Op verzoek van een ouder kan de
      rechter ter zake een regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377b
  - number: 377b.2
    text: |-
      Indien het belang van het kind zulks vereist kan de rechter zowel op verzoek van de met het gezag belaste ouder als
      ambtshalve bepalen dat het eerste lid van dit artikel buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377b
  - number: 377b.3
    text: |-
      [Artikel 377e][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377e
  - number: 377c.1
    text: |-
      Onverminderd het bepaalde in [artikel 377b][ref1] van dit boek wordt de niet met het gezag belaste ouder
      desgevraagd door derden die beroepshalve beschikken over informatie inzake belangrijke feiten en omstandigheden
      die de persoon van het kind of diens verzorging en opvoeding betreffen, daarvan op de hoogte gesteld, tenzij die
      derde de informatie niet op gelijke wijze zou verschaffen aan degene die met het gezag over het kind is belast dan
      wel bij wie het kind zijn gewone verblijfplaats heeft, of het belang van het kind zich tegen het verschaffen van
      informatie verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377b
  - number: 377c.2
    text: |-
      Indien de informatie is geweigerd, kan de rechter op verzoek van de in het eerste lid van dit artikel bedoelde
      ouder bepalen dat de informatie op de door hem aan te geven wijze moet worden verstrekt. De rechter wijst het
      verzoek in ieder geval af, indien het belang van het kind zich tegen het verschaffen van de informatie verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377c
  - number: 377d.1
    text: |-
      Onverminderd het bepaalde in het tweede lid van dit artikel, begint de uitoefening van het recht op omgang zodra de
      desbetreffende beschikking in kracht van gewijsde is gegaan of, indien zij uitvoerbaar bij voorraad is verklaard,
      daags nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377d
  - number: 377d.2
    text: |-
      De uitoefening van het recht op omgang begint, indien tevens een beschikking inzake het gezag is of wordt gegeven,
      niet eerder dan op het tijdstip waarop voor de andere ouder of voor de voogd het gezag is begonnen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377d
  - number: 377e
    text: |-
      De rechtbank kan op verzoek van de ouders of van een van hen of van degene die in een nauwe persoonlijke betrekking
      staat tot het kind een beslissing inzake de omgang alsmede een door de ouders onderling getroffen omgangsregeling
      wijzigen op grond dat nadien de omstandigheden zijn gewijzigd, of dat bij het nemen van de beslissing van onjuiste
      of onvolledige gegevens is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377e
  - number: 377g
    text: |-
      De rechter kan, indien haar blijkt dat de minderjarige van twaalf jaar of ouder hierop prijs stelt, ambtshalve een
      beslissing geven op de voet van de [artikelen 377a][ref1] of [377b][ref2], dan wel zodanige beslissing op de voet
      van [artikel 377e][ref3] van dit boek wijzigen. Hetzelfde geldt indien de minderjarige de leeftijd van twaalf jaren
      nog niet heeft bereikt, maar in staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377b
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel377g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377a
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 377b
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 377e
  - number: '378.1'
    text: |-
      Een meerderjarige kan door de kantonrechter onder curatele worden gesteld, wanneer hij tijdelijk of duurzaam zijn
      belangen niet behoorlijk waarneemt of zijn veiligheid of die van anderen in gevaar brengt, als gevolg van
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel378
  - number: 378.1.a
    text: zijn lichamelijke of geestelijke toestand, dan wel
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel378
  - number: 378.1.b
    text: gewoonte van drank- of drugsmisbruik,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel378
  - number: '378.2'
    text: |-
      Indien te verwachten is dat ten aanzien van een minderjarige op het tijdstip waarop hij meerderjarig zal worden,
      van een der in het vorige lid genoemde gronden voor curatele sprake zal zijn, kan de curatele reeds voor de
      meerderjarigheid worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel378
  - number: '378.3'
    text: |-
      De rechter bij wie een verzoek tot het verlenen van een voorlopige of voorwaardelijke
      machtiging, een observatiemachtiging of een machtiging tot voortgezet verblijf als bedoeld in de
      [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1], dan wel een machtiging als bedoeld in
      [artikel 33, eerste lid van die wet][ref2] aanhangig is, is tevens bevoegd tot de kennisneming van een verzoek
      tot ondercuratelestelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005700
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel33
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel378
    references:
      - id: ref1
        bwb_id: BWBR0005700
      - id: ref2
        bwb_id: BWBR0005700
        artikel: '33'
  - number: '379.1'
    text: |-
      De curatele kan worden verzocht door de betrokken persoon, zijn echtgenoot, zijn geregistreerde partner dan wel
      andere levensgezel, zijn bloedverwanten in de rechte lijn en in de zijlijn tot en met de vierde graad, degene die
      ingevolge [artikel 253sa][ref1] of [253t][ref2] het gezag over de betrokken persoon uitoefent, zijn voogd, zijn
      bewindvoerder als bedoeld in [titel 19][ref3] en zijn mentor als bedoeld in [titel 20][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel379
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253t
        paragraaf: '2'
        afdeling: 3A
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0002656
  - number: '379.2'
    text: |-
      De curatele kan voorts worden verzocht door het openbaar ministerie en door de instelling waar de betrokkene
      wordt verzorgd of die aan de betrokkene begeleiding biedt. In het laatste geval wordt in het verzoekschrift tevens
      vermeld waarom de in het eerste lid genoemde personen – bloedverwanten in de zijlijn in de derde en vierde graad
      daaronder niet begrepen – niet tot indiening van een verzoek zijn overgegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel379
  - number: '380.1'
    text: |-
      De rechter voor wie het verzoek tot ondercuratelestelling aanhangig is of laatstelijk aanhangig was, kan,
      desverzocht of ambtshalve, een provisionele bewindvoerder benoemen; de beschikking vermeldt het tijdstip waarop zij
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel380
  - number: '380.2'
    text: |-
      Hij regelt in deze beschikking de bevoegdheden van de bewindvoerder. Hij kan de bewindvoerder het bewind over
      bepaalde of alle goederen opdragen. Aan de bewindvoerder kan de rechter ook andere bevoegdheden toekennen, doch
      niet die welke een curator niet heeft. Voor zover de rechter niet anders bepaalt, kan degene wiens curatele is
      verzocht, met betrekking tot die goederen niet zonder medewerking van de bewindvoerder daden van beheer en van
      beschikking verrichten, noch overeenkomsten aangaan strekkende tot beschikking over die goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel380
  - number: '380.3'
    text: |-
      In de beschikking kan tevens worden bepaald dat schulden die degene wiens curatele is verzocht, na de bekendmaking
      van de benoeming maakt, op de onder bewind gestelde goederen gedurende dit bewind en de curatele, indien deze
      volgt, niet kunnen worden verhaald.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel380
  - number: '380.4'
    text: |-
      De beschikking kan te allen tijde worden gewijzigd of ingetrokken door de rechter voor wie het verzoek tot
      ondercuratelestelling aanhangig is of laatstelijk aanhangig was.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel380
  - number: '380.5'
    text: |-
      De bewindvoerder heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling van Onze
      Minister van Veiligheid en Justitie zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel380
  - number: '381.1'
    text: |-
      De curatele werkt met ingang van de dag waarop zij is uitgesproken. In het geval, bedoeld in
      [artikel 378, tweede lid][ref1], werkt de curatele met ingang van het tijdstip waarop de onder curatele gestelde
      meerderjarig wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel378
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel381
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '378'
  - number: '381.2'
    text: |-
      Van deze tijdstippen is de onder curatele gestelde onbekwaam rechtshandelingen te verrichten voor zover de wet niet
      anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel381
  - number: '381.3'
    text: |-
      Een onder curatele gestelde is bekwaam rechtshandelingen te verrichten met toestemming van zijn curator, voor zover
      deze bevoegd is die rechtshandelingen voor de onder curatele gestelde te verrichten. De toestemming kan slechts
      worden verleend voor een bepaalde rechtshandeling of voor een bepaald doel. De toestemming voor een bepaald doel
      moet schriftelijk worden verleend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel381
  - number: '381.4'
    text: |-
      Met betrekking tot aangelegenheden betreffende verzorging, verpleging, behandeling en begeleiding van een onder
      curatele gestelde zijn de [artikelen 453 en 454 van dit boek][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel453
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel381
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '453'
  - number: '381.5'
    text: |-
      Hij is bekwaam over gelden die zijn curator voor levensonderhoud te zijner beschikking heeft gesteld,
      overeenkomstig deze bestemming te beschikken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel381
  - number: '381.6'
    text: |-
      In zaken van curatele is degene wiens curatele het betreft bekwaam in rechte op te treden en tegen een uitspraak
      beroep in te stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel381
  - number: '382'
    text: |-
      Hij die uit hoofde van gewoonte van drank- of drugsmisbruik onder curatele is gesteld, blijft bekwaam tot het
      verrichten van familierechtelijke handelingen voor zover de wet niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel382
  - number: '383.1'
    text: |-
      De rechter die de curatele instelt, benoemt daarbij of zo spoedig mogelijk daarna een curator. Hij vergewist zich
      van de bereidheid en vormt zich een oordeel omtrent de geschiktheid van de te benoemen persoon.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: '383.2'
    text: |-
      De rechter volgt bij de benoeming van de curator de uitdrukkelijke voorkeur van de betrokkene, tenzij gegronde
      redenen zich tegen zodanige benoeming verzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: '383.3'
    text: |-
      Tenzij het vorige lid is toegepast, wordt, indien de onder curatele gestelde persoon gehuwd is, een geregistreerd
      partnerschap is aangegaan of anderszins een levensgezel heeft, bij voorkeur de echtgenoot, de geregistreerde
      partner dan wel andere levensgezel tot curator benoemd. Is de vorige zin niet van toepassing dan wordt bij voorkeur
      een van zijn ouders, kinderen, broers of zusters tot curator benoemd. Huwt de onder curatele gestelde, gaat hij
      een geregistreerd partnerschap aan of verkrijgt hij een andere levensgezel, dan kan ieder van hen verzoeken, dat de
      niet onder curatele staande echtgenoot, de geregistreerde partner dan wel de andere levensgezel in de plaats van de
      tegenwoordige curator wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: '383.4'
    text: Rechtspersonen met volledige rechtsbevoegdheid kunnen tot curator worden benoemd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: '383.5'
    text: 'De volgende personen kunnen niet tot curator worden benoemd:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.5.a
    text: handelingsonbekwamen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.5.b
    text: zij ten behoeve van wie een mentorschap is ingesteld;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.5.c
    text: |-
      de bewindvoerder van de onder curatele gestelde in de zin [artikel 287, derde lid, van de Faillissementswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel287
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '287'
  - number: 383.5.d
    text: een direct betrokken of behandelend hulpverlener;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.5.e
    text: |-
      personen behorende tot de leiding of tot het personeel van de instelling waar de onder curatele gestelde wordt
      verzorgd of die aan de onder curatele gestelde begeleiding biedt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.5.f
    text: |-
      personen verbonden met de instelling waar de onder curatele gestelde wordt verzorgd of die aan de onder curatele
      gestelde begeleiding biedt, doordat:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.5.f.1
    text: |-
      de instelling of personen behorende tot de leiding van de instelling, alleen of samen meer dan de helft van de
      stemrechten in de algemene vergadering van de rechtspersoon kunnen uitoefenen, dan wel meer dan de helft van de
      bestuurders of van de commissarissen van de rechtspersoon kunnen benoemen of ontslaan,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.5.f.2
    text: |-
      de persoon en de instelling deel uitmaken van een groep in de zin van [artikel 24b van boek 2][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 383.5.f.3
    text: de bestuurder van de rechtspersoon tevens behoort tot de leiding of het personeel van de instelling.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: '383.6'
    text: |-
      Zij van wie één of meer goederen onder een bewind als bedoeld in [titel 19][ref1] staan, zij die in staat van
      faillissement verkeren en zij ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing
      is, kunnen niet tot curator worden benoemd, tenzij het gaat om een persoon als bedoeld in het derde lid en het
      bewind over het vermogen van de onder curatele gestelde door de medecurator wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: '383.7'
    text: |-
      Een andere persoon dan in het derde lid bedoeld, die ten behoeve van drie of meer personen curator, bewindvoerder
      of mentor is, komt alleen dan voor benoeming in aanmerking indien deze wat zijn bedrijfsvoering en scholing
      betreft, alsmede, voor zover van toepassing, de werving, de scholing en begeleiding van en het toezicht op
      de personen door wie hij de taken van een curator uitoefent, voldoet aan bij algemene maatregel van bestuur
      te stellen kwaliteitseisen, alsmede aan de verplichtingen bedoeld in [artikel 386, derde lid][ref1], en in
      [artikel 15i van boek 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel386
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15i
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '386'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15i
  - number: '383.8'
    text: 'De persoon, bedoeld in het zevende lid, legt aan de rechter die hem benoemt, over:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.8.a
    text: zijn verklaring dat hij aan de in het zevende lid bedoelde kwaliteitseisen en verplichtingen voldoet,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.8.b
    text: |-
      een verslag van een accountant als bedoeld in [artikel 393, eerste lid, van boek 2][ref1], van diens bevindingen
      over de wijze waarop aan de eisen en verplichtingen wordt voldaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 383.8.c
    text: |-
      een verklaring van de accountant omtrent de balans en staat van baten en lasten, bedoeld in
      [artikel 10 van boek 2][ref1], dan wel, voor zover van toepassing, omtrent de jaarrekening overeenkomstig
      [titel 9 van boek 2][ref2]. [Artikel 396, zevende lid, van boek 2][ref3] is ten aanzien van
      [artikel 393 lid 1][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003045
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel396
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel393
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003045
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '396'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '393'
        afdeling: '1'
  - number: '383.9'
    text: 'Van de overlegging van de in het achtste lid bedoelde verklaring van de accountant zijn vrijgesteld:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.9.a
    text: |-
      zij die een financiële onderneming zijn die ingevolge de [Wet op het financieel toezicht][ref1] het bedrijf van
      bank mogen uitoefenen,


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 383.9.b
    text: notarissen,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.9.c
    text: gerechtsdeurwaarders,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: 383.9.d
    text: accountants.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: '383.10'
    text: |-
      De rechter kan twee curatoren benoemen, tenzij gegronde redenen zich tegen zodanige benoeming verzetten. Zijn er
      twee curatoren, dan kan ieder van hen de taken die aan een curator toekomen, alleen verrichten. De rechter kan
      zo nodig een taakverdeling tussen de curatoren vaststellen. Bij verschil van mening tussen de curatoren beslist
      op verzoek van een van hen of op verzoek van een instelling als bedoeld in [artikel 379, tweede lid][ref1], de
      kantonrechter. Deze kan ook een verdeling van de beloning vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel379
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '379'
  - number: '383.11'
    text: |-
      De taak van de curator vangt aan daags nadat de beslissing, houdende de benoeming, is verstrekt of verzonden.
      Met die dag eindigt het provisioneel bewind. De provisionele bewindvoerder is verplicht ten overstaan van de
      kantonrechter aan de curator rekening en verantwoording van zijn bemoeienissen af te leggen; wordt hij zelf tot
      curator benoemd, dan wordt de rekening en verantwoording aan de kantonrechter afgelegd. Indien de curator vóór de
      meerderjarigheid van de onder curatele gestelde is benoemd, vangt zijn taak aan op het tijdstip waarop de curatele
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: '383.12'
    text: |-
      Indien het verzoek tot ondercuratelestelling wordt afgewezen, eindigt het bewind van de provisionele bewindvoerder
      daags na die uitspraak, tenzij de rechter anders bepaalt, en in ieder geval uiterlijk daags nadat de afwijzing in
      kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel383
  - number: '384'
    text: |-
      Indien een beschikking, waarbij curatele is uitgesproken, in hoger beroep of cassatie wordt vernietigd en het
      verzoek tot ondercuratelestelling alsnog wordt afgewezen, neemt de taak van de curator daags na deze uitspraak een
      einde. De inmiddels door de curator of met zijn toestemming verrichte handelingen blijven voor de onder curatele
      gestelde verbindend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel384
  - number: '385.1'
    text: |-
      Behoudens het in de [artikelen 383][ref1] en [384][ref2] bepaalde vinden de [artikelen 250][ref3] en
      [280, onder b][ref4], [281 lid 1 onder a en lid 2][ref5], [322, eerste lid, onder a en c][ref6], [324][ref7],
      [336][ref8] en [372-377][ref9] bij curatele overeenkomstige toepassing, met dien verstande dat


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel383
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel384
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel250
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel280
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel281
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel322
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel324
      [ref8]: https://wetten.overheid.nl/BWBR0002656#Artikel336
      [ref9]: https://wetten.overheid.nl/BWBR0002656#Artikel372
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel385
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '383'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '384'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '250'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '280'
        paragraaf: '1'
        afdeling: '6'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '281'
        paragraaf: '1'
        afdeling: '6'
      - id: ref6
        bwb_id: BWBR0002656
        artikel: '322'
        paragraaf: '5'
        afdeling: '6'
      - id: ref7
        bwb_id: BWBR0002656
        artikel: '324'
        paragraaf: '6'
        afdeling: '6'
      - id: ref8
        bwb_id: BWBR0002656
        artikel: '336'
        paragraaf: '9'
        afdeling: '6'
      - id: ref9
        bwb_id: BWBR0002656
        artikel: '372'
        paragraaf: '11'
        afdeling: '6'
  - number: 385.1.a
    text: |-
      in geval van benoeming van een ouder tot curator een bereidverklaring als bedoeld in [artikel 280 onder b][ref1]
      niet is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel280
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel385
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '280'
        paragraaf: '1'
        afdeling: '6'
  - number: 385.1.b
    text: voor rechtbank of rechter wordt gelezen kantonrechter;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel385
  - number: 385.1.c
    text: aan de raad voor de kinderbescherming terzake geen bevoegdheden toekomen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel385
  - number: 385.1.d
    text: |-
      de curator te allen tijde hetzij op eigen verzoek, hetzij wegens gewichtige redenen of omdat hij niet meer voldoet
      aan de eisen om curator te kunnen worden, door de kantonrechter kan worden ontslagen, zulks op verzoek van de
      medecurator of degene die gerechtigd is de curatele te verzoeken als bedoeld in [artikel 379][ref1], dan wel
      ambtshalve. [Artikel 448, tweede lid, derde lid en vijfde lid][ref2], is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel379
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel448
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel385
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '379'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '448'
  - number: 385.1.e
    text: |-
      de curator de rekening en verantwoording, bedoeld in [artikel 374][ref1], aflegt ten overstaan van de bij het einde
      van zijn bewind ter zake bevoegde kantonrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel374
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel385
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '374'
        paragraaf: '11'
        afdeling: '6'
  - number: '385.2'
    text: |-
      De curator doet telkens na verloop van vijf jaren, of zoveel eerder als de kantonrechter bepaalt, aan deze verslag
      van het verloop van de curatele. Hij laat zich daarbij met name uit over de vraag of de curatele dient voort
      te duren of door een minder ver strekkende voorziening kan worden vervangen. Feiten die voor de curatele en het
      voortduren daarvan van betekenis zijn deelt hij terstond aan de kantonrechter mede.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel385
  - number: '386.1'
    text: |-
      Op het bewind van de curator zijn de omtrent het bewind van de voogd gegeven voorschriften van overeenkomstige
      toepassing. De rekening en verantwoording van zijn bewind gedurende de curatele wordt evenwel door de curator
      jaarlijks ingediend, behoudens indien de kantonrechter heeft bepaald dat dit op een ander tijdstip kan geschieden.
      Onze Minister van Veiligheid en Justitie kan een model vaststellen volgens hetwelk de rekening en verantwoording
      moet worden opgemaakt. De curator, bedoeld in [artikel 383, zevende lid][ref1], legt jaarlijks de verklaringen en
      het verslag over, bedoeld in artikel 383, achtste lid. De curator doet desgevraagd van zijn werkzaamheden verslag
      aan de kantonrechter. De curator heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling
      van Onze Minister van Veiligheid en Justitie zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel383
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel386
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '383'
  - number: '386.2'
    text: |-
      De curator draagt zorg voor een doelmatige belegging van het vermogen van de onder curatele gestelde, voor zover
      dit niet besteed behoort te worden voor een voldoende verzorging van de onder curatele gestelde.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel386
  - number: '386.3'
    text: |-
      Tenzij de kantonrechter anders bepaalt, is de curator verplicht zo spoedig mogelijk een rekening te openen bij een
      financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van bank
      mag uitoefenen; de curator is voorts verplicht om uitsluitend voor de betalingen die hij bij de vervulling van zijn
      taak verricht of ontvangt, zoveel mogelijk van deze rekening gebruik te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel386
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '386.4'
    text: |-
      Voor de toepassing van de [artikelen 365 tot en met 367][ref1] treedt de officier van justitie in de plaats van
      de raad voor de kinderbescherming en het ontslag bedoeld in [artikel 385, lid 1 onder d][ref2] in de plaats van de
      ontzetting van de voogd op grond van [artikel 327 lid 1 onder b][ref3]. Mededelingen en zendingen als bedoeld in
      [artikel 371a][ref4], geschieden alleen dan indien [artikel 12, vierde lid][ref5], op de desbetreffende curatele
      niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel365
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel385
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel327
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel371a
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel12
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel386
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '365'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '385'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '327'
        paragraaf: '8'
        afdeling: '6'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: 371a
        paragraaf: '10'
        afdeling: '6'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '12'
  - number: '386.5'
    text: |-
      Indien een gehuwde of een geregistreerde partner onder curatele wordt gesteld, en tussen de echtgenoten of de
      geregistreerde partners het bestuur over hun goederen en de goederen der gemeenschap anders is verdeeld dan volgens
      de regels van de wet en van huwelijkse voorwaarden, bepaalt de rechter bij het uitspreken van de curatele, of en in
      hoeverre die verdeling ook voor de curator zal gelden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel386
  - number: '386.6'
    text: |-
      De kantonrechter kan van de curator verlangen dat hij inzage geeft van zijn boeken, bescheiden en andere
      gegevensdragers. Hij kan voorts een afschrift daarvan verlangen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel386
  - number: '389.1'
    text: 'De curatele eindigt:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel389
  - number: 389.1.a
    text: door het verstrijken van de tijdsduur waarvoor zij is ingesteld,
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel389
  - number: 389.1.b
    text: door de dood van de betrokken persoon, of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel389
  - number: 389.1.c
    text: |-
      indien ten behoeve van hem bij in kracht van gewijsde gegane rechterlijke uitspraak ter vervanging van curatele een
      bewind als bedoeld in [titel 19][ref1] dan wel een mentorschap als bedoeld in [titel 20][ref2] is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel389
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
  - number: '389.2'
    text: |-
      De kantonrechter kan, indien de noodzaak daartoe niet meer bestaat of voortzetting van de curatele niet zinvol
      is gebleken, de curatele opheffen, zulks op verzoek van de curator of degene die gerechtigd is de curatele te
      verzoeken als bedoeld in [artikel 379][ref1], alsmede ambtshalve. De beschikking treedt in werking zodra zij in
      kracht van gewijsde is gegaan, tenzij zij een eerder tijdstip van ingang aanwijst.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel379
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel389
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '379'
  - number: '389.3'
    text: |-
      Degene die gerechtigd is de curatele te verzoeken als bedoeld in [artikel 379][ref1], alsmede de curator, kan
      verzoeken om verlenging van een curatele die voor een bepaalde tijdsduur is ingesteld. De kantonrechter beslist
      binnen twee maanden na het indienen van het verzoekschrift. [Artikel 384][ref2] is van overeenkomstige toepassing.
      Tegen de afwijzing van een verzoek tot verlenging staat geen hogere voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel379
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel384
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel389
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '379'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '384'
  - number: '390'
    text: |-
      Alle uitspraken waarbij een curatele wordt verleend of opgeheven of waarbij een uitspraak tot ondercuratelestelling
      wordt vernietigd, alsmede beschikkingen als in [artikel 380][ref1] bedoeld, worden binnen tien dagen nadat zij
      kunnen worden ten uitvoer gelegd, vanwege de griffier in de Staatscourant bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel380
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel390
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '380'
  - number: '391.1'
    text: |-
      Door een bij algemene maatregel van bestuur aan te wijzen orgaan wordt een openbaar register gehouden, waarin
      rechtsfeiten worden aangetekend die betrekking hebben op curatele en op bewind als bedoeld in [titel 19][ref1].
      In het register worden, voor iedere curatele en ieder in te schrijven bewind afzonderlijk, met vermelding van de
      dagtekening, ingeschreven:


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel391
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 391.1.1
    text: de naam en geboortedatum van de onder curatele gestelde en de rechthebbende;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel391
  - number: 391.1.2
    text: |-
      een uittreksel van de rechterlijke beslissingen, waarbij de curatele of het bewind wegens verkwisting dan wel het
      hebben van problematische schulden wordt ingesteld, verlengd of opgeheven;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel391
  - number: 391.1.3
    text: |-
      een uittreksel van de rechterlijke beslissingen, waarbij, voor zover de rechter zulks overeenkomstig
      [artikel 436, derde lid, derde volzin][ref1], heeft bepaald, het bewind wegens een lichamelijke of geestelijke
      toestand wordt ingesteld, verlengd of opgeheven;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel436
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel391
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '436'
  - number: 391.1.4
    text: de grond waarop de curatele is ingesteld;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel391
  - number: 391.1.5
    text: voor zover van toepassing, de datum waarop de curatele of het bewind eindigt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel391
  - number: 391.1.6
    text: |-
      een uittreksel van de rechterlijke beslissingen, waarbij een curator of bewindvoerder wordt benoemd, geschorst
      of ontslagen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel391
  - number: 391.1.7
    text: |-
      de naam en woonplaats van de curator of curatoren en de bewindvoerder of bewindvoerders en de taakverdeling, voor
      zover de rechter deze heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel391
  - number: '391.2'
    text: |-
      Een ieder heeft kosteloze inzage in het register en kan tegen betaling een uittreksel daaruit verkrijgen, met
      inachtneming van het bij of krachtens de [Wet griffierechten burgerlijke zaken][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0028899
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel391
    references:
      - id: ref1
        bwb_id: BWBR0028899
  - number: '391.3'
    text: |-
      De griffier van de rechtbank geeft de in het eerste lid, onder 1° tot en met 7° genoemde gegevens, alsmede het
      bericht van het overlijden van de onder curatele gestelde dan wel rechthebbende, door aan het in het eerste lid
      bedoelde orgaan ten behoeve van het in het eerste lid genoemde register.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel391
  - number: '391.4'
    text: |-
      Het einde van de curatele en het bewind door het verstrijken van de tijdsduur waarvoor de maatregel is ingesteld,
      leidt tot doorhaling van de inschrijving in het openbaar register op de dag na het verstrijken van de tijdsduur.
      Een beschikking tot opheffing van de curatele of het bewind leidt tot doorhaling van de inschrijving in het
      openbaar register op het tijdstip waarop de beschikking in kracht van gewijsde is gegaan. Het overlijden van de
      onder curatele gestelde of de rechthebbende leidt tot doorhaling van de inschrijving in het openbaar register,
      nadat de griffie van de rechtbank het bericht van het overlijden heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel391
  - number: '392.1'
    text: 'Tot het verstrekken van levensonderhoud zijn op grond van bloed- of aanverwantschap gehouden:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel392
  - number: 392.1.a
    text: de ouders;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel392
  - number: 392.1.b
    text: de kinderen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel392
  - number: 392.1.c
    text: behuwdkinderen, schoonouders en stiefouders.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel392
  - number: '392.2'
    text: |-
      Deze verplichting bestaat, behalve wat betreft ouders en stiefouders jegens hun minderjarige kinderen en
      stiefkinderen en jegens hun kinderen bedoeld in [artikel 395a van dit boek][ref1], slechts in geval van
      behoeftigheid van de tot levensonderhoud gerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel392
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 395a
        afdeling: '1'
  - number: '392.3'
    text: |-
      De in het eerste lid genoemde personen zijn niet verplicht levensonderhoud te verstrekken, voor
      zover dit van de echtgenoot of een vroegere echtgenoot dan wel de geregistreerde partner of vroegere
      geregistreerde partner overeenkomstig het in de [vijfde titel a][ref1], [zesde][ref2], [negende][ref3] of
      [tiende titel van dit boek][ref4] bepaalde kan worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel392
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0002656
  - number: '394'
    text: |-
      De verwekker van een kind dat alleen een moeder heeft, alsmede de persoon die als levensgezel van de moeder
      ingestemd heeft met een daad die de verwekking van het kind tot gevolg kan hebben gehad, is als ware hij ouder
      verplicht tot het voorzien in de kosten van verzorging en opvoeding van het kind dan wel, na het bereiken van
      de meerderjarigheid van het kind, tot het voorzien in de kosten van levensonderhoud en studie overeenkomstig de
      [artikelen 395a][ref1] en [395b][ref2]. Nadien bestaat deze verplichting slechts in geval van behoeftigheid van
      het kind.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel395b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel394
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 395a
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 395b
        afdeling: '1'
  - number: '395'
    text: |-
      Een stiefouder is, onverminderd het bepaalde in [artikel 395a van dit boek][ref1], alleen verplicht gedurende
      zijn huwelijk of zijn geregistreerd partnerschap levensonderhoud te verstrekken aan de tot zijn gezin behorende
      minderjarige kinderen van zijn echtgenoot of geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel395
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 395a
        afdeling: '1'
  - number: 395a.1
    text: |-
      Ouders zijn verplicht te voorzien in de kosten van levensonderhoud en studie van hun meerderjarige kinderen die de
      leeftijd van een en twintig jaren niet hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel395a
  - number: 395a.2
    text: |-
      Een stiefouder is gedurende zijn huwelijk of zijn geregistreerd partnerschap jegens de tot zijn gezin behorende
      meerderjarige kinderen van zijn echtgenoot of geregistreerde partner die de leeftijd van een en twintig jaren niet
      hebben bereikt, verplicht te voorzien in de bij het vorige lid bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel395a
  - number: 395b.1
    text: |-
      Heeft de rechter het bedrag bepaald, dat een ouder of stiefouder dan wel, overeenkomstig [artikel 394][ref1],
      de verwekker of de persoon die in [artikel 394][ref2] daarmee gelijk is gesteld ter zake van de verzorging en
      opvoeding van zijn minderjarig kind of stiefkind moet betalen en is deze verplichting tot aan het meerderjarig
      worden van het kind van kracht geweest, dan geldt met ingang van dit tijdstip de rechterlijke beslissing als een
      tot bepaling van het bedrag ter zake van levensonderhoud en studie als in [artikel 395][ref3] van dit boek bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel395b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '394'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '394'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 395a
        afdeling: '1'
  - number: 395b.2
    text: |-
      Hetzelfde geldt, indien met toepassing van [paragraaf 8.2 van de Jeugdwet][ref1] een ouderbijdrage is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Paragraaf8.2
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel395b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        paragraaf: '8.2'
  - number: '396.1'
    text: |-
      De verplichting van behuwdkinderen en van schoonouders tot het verstrekken van onderhoud vervalt, wanneer het
      huwelijk van het behuwdkind is ontbonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel396
  - number: '396.2'
    text: |-
      De verplichting bestaat niet jegens een behuwdkind, dat is gescheiden van tafel en bed en jegens een schoonouder,
      nadat deze is hertrouwd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel396
  - number: '397.1'
    text: |-
      Bij de bepaling van het volgens de wet door bloed- en aanverwanten verschuldigde bedrag voor levensonderhoud wordt
      enerzijds rekening gehouden met de behoeften van de tot onderhoud gerechtigde en anderzijds met de draagkracht van
      de tot uitkering verplichte persoon.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel397
  - number: '397.2'
    text: |-
      Zijn meerdere bloed- of aanverwanten tot het verstrekken van levensonderhoud aan dezelfde persoon verplicht, dan
      is ieder van hen gehouden een deel van het bedrag te voldoen, dat de tot onderhoud gerechtigde behoeft. Bij de
      bepaling van dit deel wordt rekening gehouden met ieders draagkracht en de verhouding, waarin een ieder tot de
      gerechtigde staat.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel397
  - number: '398.1'
    text: |-
      Wanneer hij die tot levensonderhoud verplicht is, buiten staat is het daartoe vereiste geld op te brengen, kan de
      rechtbank bevelen, dat hij de bloed- of aanverwant, aan wie hij levensonderhoud verschuldigd is, bij zich in huis
      zal nemen en aldaar van het nodige voorzien.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel398
  - number: '398.2'
    text: |-
      Ouders zijn steeds bevoegd de rechter te verzoeken hun toe te staan zich van hun onderhoudsplicht jegens hun
      behoeftig meerderjarig kind op de in het eerste lid omschreven wijze te kwijten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel398
  - number: '399'
    text: |-
      De rechter kan de verplichting van bloed- en aanverwanten tot levensonderhoud matigen op grond van zodanige
      gedragingen van de tot onderhoud gerechtigde, dat verstrekking van levensonderhoud naar redelijkheid niet of niet
      ten volle kan worden gevergd; onverminderd hetgeen in de volgende afdeling is bepaald omtrent de voorziening in de
      kosten van de verzorging en opvoeding van minderjarige kinderen en stiefkinderen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel399
  - number: '400.1'
    text: |-
      Indien een persoon verplicht is levensonderhoud te verstrekken aan twee of meer personen en zijn draagkracht
      onvoldoende is om dit volledig aan allen te verschaffen, hebben zijn kinderen en stiefkinderen die de leeftijd
      van een en twintig jaren nog niet hebben bereikt voorrang boven alle andere onderhoudsgerechtigden en hebben zijn
      echtgenoot, zijn vroegere echtgenoot, zijn geregistreerde partner, zijn vroegere geregistreerde partner, zijn
      ouders en zijn kinderen en stiefkinderen die de leeftijd van een en twintig jaren hebben bereikt voorrang boven
      zijn behuwdkinderen en zijn schoonouders.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel400
  - number: '400.2'
    text: Overeenkomsten waarbij van het volgens de wet verschuldigde levensonderhoud wordt afgezien, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel400
  - number: '401.1'
    text: |-
      Een rechterlijke uitspraak of een overeenkomst betreffende levensonderhoud kan bij latere rechterlijke uitspraak
      worden gewijzigd of ingetrokken, wanneer zij nadien door wijziging van omstandigheden ophoudt aan de wettelijke
      maatstaven te voldoen. De voorafgaande zin is niet van toepassing op een verzoek tot wijziging van een termijn die
      de rechter heeft vastgesteld op grond van [artikel 157][ref1] of die is opgenomen in een overeenkomst als bedoeld
      in [artikel 158][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel158
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel401
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '158'
        afdeling: '2'
  - number: '401.2'
    text: |-
      De termijn die de rechter heeft vastgesteld op grond van het derde of vijfde lid dan wel
      [zesde lid, tweede zin van artikel 157][ref1] of die is opgenomen in een overeenkomst als bedoeld in
      [artikel 158][ref2], kan op verzoek van een van de gewezen echtgenoten worden gewijzigd in geval van zo
      ingrijpende wijziging van omstandigheden dat ongewijzigde handhaving van de termijn naar maatstaven van
      redelijkheid en billijkheid niet van de verzoeker kan worden gevergd. Verlenging is niet mogelijk indien
      de rechter zulks ingevolge [artikel 157, vijfde lid][ref3], heeft bepaald. Op een verzoek tot verlenging is
      [het vijfde lid, tweede en derde zin, van artikel 157][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel158
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel157
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel401
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '158'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
  - number: '401.3'
    text: |-
      Partijen kunnen schriftelijk overeenkomen dat het eerste lid, eerste zin, van toepassing is op een verzoek tot
      wijziging van een termijn die is opgenomen in een overeenkomst als bedoeld in [artikel 158][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel158
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel401
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '158'
        afdeling: '2'
  - number: '401.4'
    text: |-
      Een rechterlijke uitspraak betreffende levensonderhoud kan ook worden gewijzigd of ingetrokken, indien zij van de
      aanvang af niet aan de wettelijke maatstaven heeft beantwoord doordat bij die uitspraak van onjuiste of onvolledige
      gegevens is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel401
  - number: '401.5'
    text: |-
      Een overeenkomst betreffende levensonderhoud kan ook worden gewijzigd of ingetrokken, indien zij is aangegaan met
      grove miskenning van de wettelijke maatstaven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel401
  - number: '402.1'
    text: |-
      De rechter, die het bedrag van een uitkering tot levensonderhoud bepaalt, wijzigt of intrekt, stelt tevens de dag
      vast, van welke dit bedrag verschuldigd is of ophoudt verschuldigd te zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel402
  - number: '402.2'
    text: |-
      Bij de vaststelling van een bedrag bepaalt de rechter tevens of dit wekelijks, maandelijks of driemaandelijks moet
      worden voldaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel402
  - number: '402.3'
    text: |-
      Zouden op de dag, dat de uitspraak ten uitvoer kan worden gelegd, reeds meer dan één termijn verschenen zijn
      of meer dan één termijn terugbetaald moeten worden, dan kan de rechter ook daarvoor een betaling in termijnen
      toestaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel402
  - number: 402a.1
    text: |-
      De bij rechterlijke uitspraak of bij overeenkomst vastgestelde bedragen voor levensonderhoud worden jaarlijks
      van rechtswege gewijzigd met een door Onze Minister van Justitie vast te stellen percentage, dat, behoudens het
      bepaalde in het derde en vierde lid, overeenkomt met het procentuele verschil tussen het indexcijfer der lonen per
      30 september van enig jaar en het overeenkomstige indexcijfer in het voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel402a
  - number: 402a.2
    text: |-
      De wijziging gaat in op 1 januari volgende op de in het eerste lid genoemde datum. De beschikking waarin het
      percentage is vastgesteld, wordt bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel402a
  - number: 402a.3
    text: Bij algemene maatregel van bestuur wordt bepaald wat onder indexcijfer der lonen wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel402a
  - number: 402a.4
    text: |-
      Het percentage van de wijziging van de bedragen voor levensonderhoud kan worden afgerond op tienden van een
      procent. Daarbij vindt, indien van het in het eerste lid bedoelde procentuele verschil het tweede of een volgend
      cijfer achter de komma vijf bedraagt, voor wat betreft die cijfers afronding naar beneden plaats.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel402a
  - number: 402a.5
    text: |-
      De wijziging van rechtswege kan bij rechterlijke uitspraak of bij overeenkomst geheel of voor een bepaalde
      tijdsduur worden uitgesloten. Daarbij kan tevens worden bepaald dat en op welke wijze het bedrag voor
      levensonderhoud anders dan van rechtswege periodiek zal worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel402a
  - number: 402a.6
    text: |-
      Bij de uitspraak, waarbij de tweede zin van het vorige lid toepassing heeft gevonden, en ook nadien, kan de
      rechter een regeling geven omtrent de wijze en de tijdstippen waarop de tot uitkering verplichte persoon aan de tot
      uitkering gerechtigde persoon gegevens dient te verschaffen ten behoeve van de vaststelling van de wijziging van
      het bedrag voor levensonderhoud. Deze beslissingen kunnen worden gegeven en nadien worden gewijzigd op verzoek van
      de tot uitkering verplichte of gerechtigde persoon.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel402a
  - number: 402a.7
    text: |-
      De uitsluiting van de wijziging van rechtswege kan bij rechterlijke uitspraak worden ingetrokken. Voor zover
      het een uitsluiting betreft waarbij de tweede zin van het vijfde lid niet is toegepast, kan de intrekking alleen
      geschieden in de gevallen bedoeld in [artikel 401 van dit boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel401
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel402a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '401'
        afdeling: '1'
  - number: 402a.8
    text: |-
      De tenuitvoerlegging van een executoriale titel betreffende de betaling van levensonderhoud geschiedt met
      inachtneming van de op het tijdstip van de tenuitvoerlegging ingegane wijzigingen van rechtswege dan wel met
      inachtneming van de wijzigingen overeenkomstig de tweede zin van het vijfde lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel402a
  - number: '403'
    text: |-
      Geen uitkering is verschuldigd over de tijd, die op het tijdstip van het indienen van het verzoek reeds meer dan
      vijf jaren is verstreken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel403
  - number: '404.1'
    text: |-
      Ouders zijn verplicht naar draagkracht te voorzien in de kosten van verzorging en opvoeding van hun minderjarige
      kinderen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel404
  - number: '404.2'
    text: |-
      Gelijke verplichting bestaat voor een stiefouder in het geval van [artikel 395 van dit boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel395
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel404
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '395'
        afdeling: '1'
  - number: '406.1'
    text: |-
      Komt een ouder of stiefouder zijn verplichting tot voorziening in de kosten van verzorging en opvoeding niet of
      niet behoorlijk na, dan kan de andere ouder of voogd de rechtbank verzoeken het bedrag te bepalen dat deze ouder of
      stiefouder ten behoeve van het kind zal moeten uitkeren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel406
  - number: '406.2'
    text: |-
      De rechtbank kan het in het vorige lid bedoelde bedrag reeds bepalen gelijktijdig met een door haar te geven
      beslissing omtrent het gezag.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel406
  - number: 406a
    text: |-
      Een op [artikel 394][ref1] gegrond verzoek kan ten behoeve van een minderjarig kind door hem die het gezag over het
      kind heeft, worden gedaan. De ouder of voogd van het kind behoeft de in [artikel 349, eerste en tweede lid][ref2],
      bedoelde machtiging niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel349
