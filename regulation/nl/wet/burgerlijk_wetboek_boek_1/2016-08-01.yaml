  - number: 80a.6
    text: |-
      Op de nietigverklaring van een partnerschapsregistratie zijn van overeenkomstige toepassing de
      [artikelen 69 tot en met 73][ref1], [74][ref2], [75 tot en met 77][ref3], eerste lid en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel75
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '69'
