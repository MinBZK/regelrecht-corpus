        artikel: '78'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '79'
        afdeling: '6'
  - number: 80b
    text: |-
      Op een geregistreerd partnerschap zijn de [titels 6][ref1], [7][ref2] en [8][ref3] van overeenkomstige toepassing
      met uitzondering van het omtrent scheiding van tafel en bed bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002656
  - number: 80c.1
    text: 'Het geregistreerd partnerschap eindigt:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80c
  - number: 80c.1.a
    text: door de dood;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80c
  - number: 80c.1.b
    text: |-
      indien de vermiste, die overeenkomstig de bepalingen van de [tweede][ref1] of
      [derde afdeling van de achttiende titel van dit boek][ref2] vermoedelijk overleden dan wel overleden is verklaard,
      nog in leven is op de dag waarop de achtergebleven geregistreerde partner een nieuw geregistreerd partnerschap of
      huwelijk is aangegaan: door de voltrekking van dit geregistreerd partnerschap of huwelijk;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling3
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        afdeling: '3'
  - number: 80c.1.c
    text: |-
      met wederzijds goedvinden door inschrijving door de ambtenaar van de burgerlijke stand van een door beide partners
      en een of meer advocaten of notarissen ondertekende en gedateerde verklaring waaruit blijkt dat en op welk tijdstip
      de partners omtrent de beëindiging van het geregistreerd partnerschap een overeenkomst hebben gesloten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80c
  - number: 80c.1.d
    text: door ontbinding op verzoek van de partners of een van hen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80c
  - number: 80c.1.e
    text: door omzetting van een geregistreerd partnerschap in een huwelijk.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80c
  - number: 80c.2
    text: |-
      Tot inschrijving van verklaringen als bedoeld in het eerste lid, onder c, is de ambtenaar van de
      burgerlijke stand steeds bevoegd indien het geregistreerd partnerschap in Nederland is aangegaan. Indien
      het partnerschap buiten Nederland is aangegaan, is de ambtenaar van de burgerlijke stand tot inschrijving
      van verklaringen als bedoeld in het eerste lid, onder c, bevoegd indien voldaan is aan de voorwaarden van
      [artikel 4, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] voor de bevoegdheid van de rechter
      in geval van de ontbinding van het geregistreerd partnerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel4
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80c
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '4'
  - number: 80c.3
    text: |-
      Een geregistreerd partnerschap kan niet met wederzijds goedvinden als bedoeld in het eerste lid, onder c, worden
      beëindigd indien de partners:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80c
  - number: 80c.3.a
    text: al dan niet gezamenlijk het gezag uitoefenen over een of meer van hun gezamenlijke kinderen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80c
  - number: 80c.3.b
    text: |-
      ingevolge [artikel 253sa][ref1] of [253t][ref2] het gezag gezamenlijk uitoefenen over een of meer kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253t
        paragraaf: '2'
        afdeling: 3A
  - number: 80d.1
    text: |-
      De in [artikel 80c, onder c][ref1], bedoelde overeenkomst betreft ten minste de verklaring van beide partners
      dat hun geregistreerd partnerschap duurzaam ontwricht is en dat zij het willen beëindigen. Voorts betreft de
      overeenkomst, evenwel niet op straffe van nietigheid:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
  - number: 80d.1.a
    text: |-
      de uitkering tot levensonderhoud ten behoeve van de geregistreerde partner die niet voldoende inkomsten tot zijn
      levensonderhoud heeft, noch zich in redelijkheid kan verwerven;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80d
  - number: 80d.1.b
    text: |-
      wie van de geregistreerde partners huurder van de woonruimte die hen tot hoofdverblijf dient, zal zijn of wie
      van de geregistreerde partners gedurende een bij de overeenkomst te bepalen termijn het gebruik zal hebben van de
      woning en de inboedel die een van hen of hen beiden toebehoren dan wel ten gebruike toekomen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80d
  - number: 80d.1.c
    text: |-
      de verdeling van enige gemeenschap waarin de partners de registratie zijn aangegaan dan wel de verrekening die bij
      voorwaarden als bedoeld in [titel 8][ref1] is overeengekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 80d.1.d
    text: de verevening of verrekening van pensioenrechten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80d
  - number: 80d.2
    text: |-
      Op een beëindiging van het geregistreerd partnerschap met wederzijds goedvinden zijn de [artikelen 155][ref1],
      [157, vierde en zesde lid][ref2], [158][ref3], [159, eerste en derde lid][ref4], [159a][ref5], [160][ref6] en
      [164][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel158
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel159
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel159a
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel160
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel164
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '155'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '158'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '159'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: 159a
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0002656
        artikel: '160'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0002656
        artikel: '164'
        afdeling: '2'
  - number: 80d.3
    text: |-
      De verklaring, bedoeld in [artikel 80c, onder c][ref1], wordt slechts ingeschreven in de registers van de
      burgerlijke stand, indien zij de ambtenaar van de burgerlijke stand uiterlijk drie maanden na het sluiten van de
      overeenkomst heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
  - number: 80e.1
    text: |-
      Op een ontbinding van een geregistreerd partnerschap als bedoeld in [artikel 80c, onder d][ref1], zijn de
      [artikelen 151][ref2], [153][ref3], [155][ref4], [157 tot en met 160][ref5], [164][ref6] en [165][ref7] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel151
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel153
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel155
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel164
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel165
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '151'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '153'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '155'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0002656
        artikel: '164'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0002656
        artikel: '165'
        afdeling: '2'
  - number: 80e.2
    text: |-
      De ontbinding komt tot stand door inschrijving van een rechterlijke uitspraak op verzoek van partijen of van
      één van hen in de registers van de burgerlijke stand. [Artikel 163, derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel163
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '163'
        afdeling: '2'
  - number: 80f
    text: |-
      Indien de partijen wier geregistreerd partnerschap is beëindigd, opnieuw een geregistreerd partnerschap met elkaar
      aangaan dan wel met elkaar in het huwelijk treden, herleven alle gevolgen van het geregistreerd partnerschap van
      rechtswege alsof er geen beëindiging heeft plaats gehad. Nochtans wordt de geldigheid van rechtshandelingen die
      tussen de inschrijving van de beëindiging en de nieuwe registratie of het huwelijk zijn verricht, beoordeeld naar
      het tijdstip van de handeling.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80f
  - number: 80g.1
    text: |-
      Indien twee personen aan de ambtenaar van de burgerlijke stand kenbaar maken dat zij het geregistreerd partnerschap
      dat zij zijn aangegaan, omgezet wensen te zien in een huwelijk, kan de ambtenaar van de burgerlijke stand ter
      zake een akte van omzetting opmaken. Indien de geregistreerde partners van wie ten minste één de Nederlandse
      nationaliteit bezit, buiten Nederland woonplaats hebben en in Nederland hun geregistreerd partnerschap in een
      huwelijk willen omzetten, geschiedt de omzetting bij de ambtenaar van de burgerlijke stand te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80g
  - number: 80g.2
    text: |-
      De [artikelen 65][ref1] en [66][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel66
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '65'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '66'
        afdeling: '4'
  - number: 80g.3
    text: |-
      Een omzetting doet het geregistreerd partnerschap eindigen en het huwelijk aanvangen op het tijdstip dat de akte
      van omzetting in het register van huwelijken is opgemaakt. De omzetting brengt geen wijziging in de al dan niet
      bestaande familierechtelijke betrekkingen met kinderen die voor de omzetting zijn geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel80g
  - number: '81'
    text: |-
      Echtgenoten zijn elkander getrouwheid, hulp en bijstand verschuldigd. Zij zijn verplicht elkander het nodige te
      verschaffen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel81
  - number: '82'
    text: |-
      Echtgenoten zijn jegens elkaar verplicht de tot het gezin behorende minderjarige kinderen te verzorgen en op te
      voeden en de kosten van die verzorging en opvoeding te dragen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel82
  - number: '83'
    text: |-
      Echtgenoten verschaffen elkaar desgevraagd inlichtingen over het door hen gevoerde bestuur alsmede over de stand
      van hun goederen en schulden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel83
  - number: '84.1'
    text: |-
      De kosten der huishouding, daaronder begrepen de kosten van verzorging en opvoeding van de kinderen, komen ten
      laste van het gemene inkomen van de echtgenoten en, voor zover dit ontoereikend is, ten laste van hun eigen
      inkomens in evenredigheid daarvan; voor zover de inkomens ontoereikend zijn, komen deze kosten ten laste van
      het gemene vermogen en, voor zover ook dit ontoereikend is, ten laste van de eigen vermogens naar evenredigheid
      daarvan. Een en ander geldt niet voor zover bijzondere omstandigheden zich er tegen verzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel84
  - number: '84.2'
    text: |-
      De echtgenoten zijn jegens elkaar verplicht dienovereenkomstig tot de bestrijding van de in het eerste lid
      bedoelde uitgaven voldoende gelden ter beschikking te stellen uit de onder hun bestuur staande goederen, voor zover
      bijzondere omstandigheden zich daartegen niet verzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel84
  - number: '84.3'
    text: Bij schriftelijke overeenkomst kan een van het eerste en tweede lid afwijkende regeling worden getroffen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel84
  - number: '84.4'
    text: |-
      Geschillen tussen de echtgenoten omtrent de toepassing van het eerste tot en met derde lid worden door de rechtbank
      op verzoek van beiden of een van hen beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel84
  - number: '84.5'
    text: |-
      Op verzoek van beide of van een van de echtgenoten kan de rechtbank een gegeven beschikking of een onderling
      getroffen regeling wijzigen op grond van veranderde omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel84
  - number: '85'
    text: |-
      De ene echtgenoot is naast de andere voor het geheel aansprakelijk voor de door deze ten behoeve van de gewone gang
      van de huishouding aangegane verbintenissen, met inbegrip van die welke voortvloeien uit de door hem als werkgever
      ten behoeve van de huishouding aangegane arbeidsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel85
  - number: '86.1'
    text: |-
      De rechtbank kan, wanneer daartoe gegronde redenen bestaan, op verzoek van een echtgenoot bepalen dat deze niet
      aansprakelijk zal zijn voor de door de andere echtgenoot in het vervolg aangegane verbintenissen als bedoeld in het
      vorige artikel.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel86
  - number: '86.2'
    text: |-
      Een overeenkomstig dit artikel gegeven rechterlijke beschikking kan bij veranderde omstandigheden op gelijke wijze
      als zij is tot stand gekomen, worden gewijzigd of opgeheven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel86
  - number: '86.3'
    text: |-
      De beschikking kan aan derden die van haar bestaan onkundig waren, slechts worden tegengeworpen, indien zij
      ingeschreven was in het huwelijksgoederenregister, aangewezen in [artikel 116 van dit boek][ref1], en na de
      inschrijving veertien dagen waren verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '86.4'
    text: |-
      In de beschikking kan worden bepaald dat zij bovendien moet worden bekend gemaakt in een of meer door de rechter
      aangewezen dagbladen. In dat geval werkt de beschikking ten nadele van derden die daarvan onkundig waren, ook niet
      vóór deze bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel86
  - number: '87.1'
    text: |-
      Indien een echtgenoot ten laste van het vermogen van de andere echtgenoot een goed dat tot zijn eigen vermogen zal
      behoren, verkrijgt of indien ten laste van het vermogen van de andere echtgenoot een schuld ter zake van een tot
      zijn eigen vermogen behorend goed wordt voldaan of afgelost, ontstaat voor de eerstgenoemde echtgenoot een plicht
      tot vergoeding.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel87
  - number: '87.2'
    text: |-
      De vergoeding beloopt een gedeelte van de waarde van het goed op het tijdstip waarop de vergoeding wordt voldaan.
      Dit gedeelte:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel87
  - number: 87.2.a
    text: |-
      is in het geval van een verkrijging ten laste van het vermogen van de andere echtgenoot evenredig aan het uit diens
      vermogen afkomstige aandeel in de tegenprestatie voor het goed;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel87
  - number: 87.2.b
    text: |-
      komt in het geval van een voldoening of aflossing ten laste van het vermogen van de andere echtgenoot overeen met
      de verhouding tussen het uit diens vermogen voldane of afgeloste bedrag ten opzichte van de waarde van het goed op
      het tijdstip van die voldoening of aflossing.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel87
  - number: '87.3'
    text: 'Ten aanzien van de vergoeding gelden voorts de volgende regels:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel87
  - number: 87.3.a
    text: |-
      tenzij de echtgenoot het vermogen van de andere echtgenoot met diens toestemming heeft aangewend op de wijze als
      bedoeld in het eerste lid, beloopt de vergoeding ten minste het nominale bedrag dat ten laste van het vermogen van
      de andere echtgenoot is gekomen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel87
  - number: 87.3.b
    text: |-
      ter zake van goederen die naar hun aard bestemd zijn om te worden verbruikt, beloopt de vergoeding steeds het
      nominale bedrag dat ten laste van het vermogen van de andere echtgenoot is gekomen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel87
  - number: 87.3.c
    text: |-
      ter zake van goederen die inmiddels zijn vervreemd zonder dat daarvoor andere goederen in de plaats zijn gekomen,
      wordt in plaats van de waarde, bedoeld in de aanhef van het tweede lid, uitgegaan van de waarde ten tijde van
      de vervreemding. Met een vervreemding wordt gelijkgesteld het onherroepelijk worden van een begunstiging bij een
      sommenverzekering of een andere begunstiging bij een beding ten behoeve van een derde.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel87
  - number: '87.4'
    text: |-
      Echtgenoten kunnen bij overeenkomst afwijken van het eerste lid tot en met het derde lid. Geen vergoeding is
      verschuldigd voorzover door de verkrijging, voldoening of aflossing ten laste van het vermogen van de andere
      echtgenoot wordt voldaan aan een op die echtgenoot rustende verbintenis.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel87
  - number: '87.5'
    text: |-
      Kan de vergoeding overeenkomstig het eerste tot en met het vierde lid niet nauwkeurig worden vastgesteld, dan wordt
      zij geschat.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel87
  - number: '88.1'
    text: 'Een echtgenoot behoeft de toestemming van de andere echtgenoot voor de volgende rechtshandelingen:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel88
  - number: 88.1.a
    text: |-
      overeenkomsten strekkende tot vervreemding, bezwaring of ingebruikgeving en rechtshandelingen strekkende tot
      beëindiging van het gebruik van een door de echtgenoten tezamen of door de andere echtgenoot alleen bewoonde woning
      of van zaken die bij een zodanige woning of tot de inboedel daarvan behoren;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel88
  - number: 88.1.b
    text: giften, met uitzondering van de gebruikelijke, niet bovenmatige;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel88
  - number: 88.1.c
    text: |-
      overeenkomsten die ertoe strekken dat hij, anders dan in de normale uitoefening van zijn beroep of bedrijf, zich
      als borg of hoofdelijk medeschuldenaar verbindt, zich voor een derde sterk maakt, of zich tot zekerheidstelling
      voor een schuld van de derde verbindt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel88
  - number: 88.1.d
    text: |-
      overeenkomsten van koop op afbetaling, behalve van zaken welke kennelijk uitsluitend of hoofdzakelijk ten behoeve
      van de normale uitoefening van zijn beroep of bedrijf strekken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel88
  - number: '88.2'
    text: |-
      De echtgenoot behoeft de toestemming niet, indien hij tot het verrichten der rechtshandeling is verplicht op
      grond van de wet of op grond van een voorafgaande rechtshandeling waarvoor die toestemming is verleend of niet
      was vereist.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel88
  - number: '88.3'
    text: |-
      De toestemming moet schriftelijk of langs elektronische weg worden verleend, indien de wet voor het verrichten van
      de rechtshandeling een vorm voorschrijft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel88
  - number: '88.4'
    text: |-
      In afwijking van lid 1, onder b, is geen toestemming vereist voor giften welke de strekking hebben dat zij pas
      zullen worden uitgevoerd na het overlijden van degene die de gift doet, en niet reeds tijdens diens leven worden
      uitgevoerd. Bestaat de gift in de aanwijzing van een begunstigde bij een sommenverzekering die tijdens het leven
      van de verzekeringnemer is aanvaard of kan worden aanvaard, dan is daarvoor wel toestemming vereist.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel88
  - number: '88.5'
    text: |-
      Toestemming voor een rechtshandeling als bedoeld in lid 1 onder *c*, is niet vereist, indien zij wordt verricht
      door een bestuurder van een naamloze vennootschap of van een besloten vennootschap met beperkte aansprakelijkheid,
      die daarvan alleen of met zijn medebestuurders de meerderheid der aandelen houdt en mits zij geschiedt ten behoeve
      van de normale uitoefening van het bedrijf van die vennootschap.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel88
  - number: '88.6'
    text: |-
      Indien de andere echtgenoot door afwezigheid of een andere oorzaak in de onmogelijkheid verkeert zijn wil te
      verklaren of zijn toestemming niet verleent, kan de beslissing van de rechtbank worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel88
  - number: '89.1'
    text: |-
      Een rechtshandeling die een echtgenoot in strijd met het vorige artikel heeft verricht, is vernietigbaar; slechts
      de andere echtgenoot kan een beroep op de vernietigingsgrond doen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel89
  - number: '89.2'
    text: Het vorige lid geldt niet voor een andere handeling dan een gift, indien de wederpartij te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel89
  - number: '89.3'
    text: |-
      Het einde van het huwelijk en scheiding van tafel en bed hebben geen invloed op de bevoegdheid om ter
      vernietiging van een rechtshandeling van een echtgenoot een beroep op de vernietigingsgrond te doen, die voordien
      was ontstaan. Indien de andere echtgenoot dientengevolge schuldenaar uit die rechtshandeling wordt, geldt
      [artikel 51 lid 3 van Boek 3][ref1] voor hem slechts, zolang de termijn van [artikel 52 lid 1 van Boek 3][ref2]
      niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel52
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '52'
  - number: '89.4'
    text: |-
      De verklaring of rechtsvordering tot vernietiging behoeft in afwijking van de [artikelen 50 lid 1][ref1] en
      [51 lid 2 van Boek 3][ref2] niet mede te worden gericht tot de echtgenoot die de handeling heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel51
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '51'
  - number: '89.5'
    text: |-
      De echtgenoot die een beroep op de vernietigingsgrond heeft gedaan, kan tevens alle uit de nietigheid
      voortvloeiende rechtsvorderingen instellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel89
  - number: '90.1'
    text: |-
      Een echtgenoot is bevoegd tot het bestuur van zijn eigen goederen en, volgens de regels van [artikel 97][ref1], tot
      het bestuur van goederen van een gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel97
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '97'
        afdeling: '2'
  - number: '90.2'
    text: |-
      Het bestuur van een echtgenoot over een goed omvat de uitoefening van de daaraan verbonden bevoegdheden, daaronder
      begrepen de bevoegdheid tot beschikking en tot beheer en de bevoegdheid om ten aanzien van dat goed feitelijke
      handelingen te verrichten en toe te laten, onverminderd de bevoegdheden tot genot en gebruik die de andere
      echtgenoot overeenkomstig de huwelijksverhouding toekomen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel90
  - number: '90.3'
    text: |-
      Tussen de echtgenoot die het hem toekomend bestuur overlaat aan de andere echtgenoot, en deze laatste zijn de
      bepalingen omtrent opdracht van overeenkomstige toepassing, met inachtneming van de aard van de huwelijksverhouding
      en de aard der goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel90
  - number: '90.4'
    text: |-
      De echtgenoot die een goed bestuurt, kan als partij naast de andere echtgenoot toetreden tot een rechtshandeling
      die deze laatste met betrekking tot dat goed heeft verricht. De verklaring van toetreding wordt gericht tot hen
      die partij bij de rechtshandeling zijn; [artikel 56 van Boek 3][ref1] is van overeenkomstige toepassing. Is voor
      het verrichten van de rechtshandeling een bepaalde vorm voorgeschreven, dan geldt voor de toetreding hetzelfde
      vereiste. De echtgenoot kan toetreding tot bijkomstige en tot reeds opeisbare rechten en verplichtingen uitsluiten;
      hij wordt geacht zich slechts te hebben verbonden onder eerbiediging van tevoren aan derden verleende rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel56
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '56'
  - number: '91.1'
    text: |-
      Indien een echtgenoot door afwezigheid of een andere oorzaak in de onmogelijkheid verkeert zijn goederen of
      de goederen der gemeenschap te besturen, of in ernstige mate tekortschiet in het bestuur van de goederen der
      gemeenschap, kan de rechtbank op verzoek van de andere echtgenoot aan deze het bestuur over die goederen of een
      deel daarvan met uitsluiting van de eerstgenoemde echtgenoot opdragen. De rechter kan bij de opdracht nadere
      regelen stellen omtrent het bestuur en de vertegenwoordiging in de zin van lid 4.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel91
  - number: '91.2'
    text: |-
      De [artikelen 86 leden 2-4][ref1] en [90 lid 3][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel90
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '86'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '90'
  - number: '91.3'
    text: |-
      De rechter gelast de oproeping van beide echtgenoten en, zo de in lid 1 eerstgenoemde echtgenoot een
      vertegenwoordiger heeft aangesteld, ook deze.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel91
  - number: '91.4'
    text: |-
      De echtgenoot aan wie het bestuur over goederen wordt opgedragen, is bevoegd tot vertegenwoordiging van de
      echtgenoot aan wie het wordt onttrokken, bij andere dan bestuurshandelingen met betrekking tot die goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel91
  - number: '92.1'
    text: |-
      Is aan een derde niet kenbaar wie van de echtgenoten bevoegd is tot het bestuur over een roerende zaak die geen
      registergoed is, of een recht aan toonder, dan mag hij de echtgenoot die de zaak of het papier aan toonder onder
      zich heeft, bevoegd achten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel92
  - number: '92.2'
    text: |-
      De echtgenoot die ten gevolge van een rechtshandeling van de andere echtgenoot door een derde te goeder trouw in
      het bestuur van een goed is gestoord, verliest het recht tot beëindiging van de stoornis, indien hij zich tegen
      de stoornis niet heeft verzet binnen een redelijke termijn nadat zij te zijner kennis is gekomen. De bevoegdheid
      van de echtgenoot tot beëindiging van de stoornis vervalt eveneens indien de derde hem een redelijke termijn heeft
      gesteld ter uitoefening van die bevoegdheid en hij daarvan geen gebruik heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel92
  - number: '92.3'
    text: |-
      Aan een derde kan niet worden tegengeworpen dat een vordering tot vergoeding welke tijdens het huwelijk is ontstaan
      wegens vermogensverschuiving tussen de echtgenoten onderling of tussen een der echtgenoten en een tussen hen
      bestaande gemeenschap, niet opeisbaar is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel92
  - number: 92a
    text: Deze titel is niet van toepassing op van tafel en bed gescheiden echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel92a
  - number: '93'
    text: |-
      Bij huwelijkse voorwaarden kan uitdrukkelijk of door de aard der bedingen worden afgeweken van bepalingen van deze
      titel, behalve voorzover bepalingen zich uitdrukkelijk of naar hun aard tegen afwijking verzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel93
  - number: '94.1'
    text: |-
      Van het ogenblik der voltrekking van het huwelijk bestaat tussen de echtgenoten van rechtswege een gemeenschap
      van goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel94
  - number: '94.2'
    text: |-
      De gemeenschap omvat, wat haar baten betreft, alle goederen der echtgenoten, bij aanvang van de gemeenschap
      aanwezig of nadien, zolang de gemeenschap niet is ontbonden, verkregen, met uitzondering van:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel94
  - number: 94.2.a
    text: |-
      goederen ten aanzien waarvan bij uiterste wilsbeschikking van de erflater of bij de gift is bepaald dat zij buiten
      de gemeenschap vallen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel94
  - number: 94.2.b
    text: |-
      pensioenrechten waarop de [Wet verevening pensioenrechten bij scheiding][ref1] van toepassing is alsmede met die
      pensioenrechten verband houdende rechten op nabestaandenpensioen;


      [ref1]: https://wetten.overheid.nl/BWBR0006641
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0006641
  - number: 94.2.c
    text: |-
      rechten op het vestigen van vruchtgebruik als bedoeld in de [artikelen 29][ref1] en [30 van Boek 4][ref2],
      vruchtgebruik dat op grond van die bepalingen is gevestigd, alsmede hetgeen wordt verkregen ingevolge
      [artikel 34 van Boek 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel34
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '34'
  - number: '94.3'
    text: |-
      Goederen en schulden die aan een der echtgenoten op enigerlei bijzondere wijze verknocht zijn, vallen slechts in de
      gemeenschap voor zover die verknochtheid zich hiertegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel94
  - number: '94.4'
    text: |-
      Vruchten van goederen die niet in de gemeenschap vallen, vallen evenmin in de gemeenschap. Buiten de gemeenschap
      valt hetgeen wordt geïnd op een vordering die buiten de gemeenschap valt, alsmede een vordering tot vergoeding
      die in de plaats van een eigen goed van een echtgenoot treedt, waaronder begrepen een vordering ter zake van
      waardevermindering van zulk een goed.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel94
  - number: '94.5'
    text: |-
      De gemeenschap omvat, wat haar lasten betreft, alle schulden van ieder der echtgenoten, met uitzondering van
      schulden:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel94
  - number: 94.5.a
    text: betreffende van de gemeenschap uitgezonderde goederen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel94
  - number: 94.5.b
    text: |-
      uit door een der echtgenoten gedane giften, gemaakte bedingen en aangegane omzettingen als bedoeld in
      [artikel 126, eerste lid, en tweede lid, onder a en c, van Boek 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel126
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '126'
  - number: '94.6'
    text: |-
      Bestaat tussen echtgenoten een geschil aan wie van hen beiden een goed toebehoort en kan geen van beiden zijn recht
      op dit goed bewijzen, dan wordt dat goed als gemeenschapsgoed aangemerkt. Het vermoeden werkt niet ten nadele van
      de schuldeisers der echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel94
  - number: '95.1'
    text: |-
      Een goed dat een echtgenoot anders dan om niet verkrijgt, blijft buiten de gemeenschap indien de tegenprestatie
      bij de verkrijging van dit goed voor meer dan de helft ten laste komt van zijn eigen vermogen. Voor zover de
      tegenprestatie ten laste van de gemeenschap komt, is de echtgenoot gehouden tot een vergoeding aan de gemeenschap.
      Het beloop van de vergoeding wordt bepaald overeenkomstig [artikel 87, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel87
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '87'
  - number: '95.2'
    text: |-
      Indien een goed tot de gemeenschap gaat behoren en een echtgenoot bij de verkrijging uit zijn eigen vermogen
      aan de tegenprestatie heeft bijgedragen, komt deze echtgenoot een vergoedingsvordering toe, waarvan het beloop
      overeenkomstig [artikel 87, tweede en derde lid][ref1], wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel87
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '87'
  - number: '96.1'
    text: |-
      Voor een schuld van een echtgenoot kunnen, ongeacht of deze in de gemeenschap is gevallen, zowel de goederen der
      gemeenschap als zijn eigen goederen worden uitgewonnen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel96
  - number: '96.2'
    text: |-
      Voor een niet in de gemeenschap gevallen schuld van een echtgenoot kunnen de goederen van de gemeenschap niet
      worden uitgewonnen, indien de andere echtgenoot eigen goederen van eerstgenoemde aanwijst, die voldoende verhaal
      bieden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel96
  - number: '96.3'
    text: |-
      De echtgenoot uit wiens eigen goederen een schuld der gemeenschap is voldaan, heeft deswege recht op vergoeding uit
      de goederen der gemeenschap. Betreft het een schuld ter zake van een tot de gemeenschap behorend goed, dan wordt
      het beloop van de vergoeding bepaald overeenkomstig [artikel 87, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel87
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '87'
  - number: '96.4'
    text: |-
      De echtgenoot wiens niet in de gemeenschap gevallen schuld uit goederen der gemeenschap is voldaan,
      is deswege gehouden tot vergoeding aan de gemeenschap. Betreft het een schuld ter zake van een tot
      zijn eigen vermogen behorend goed, dan wordt het beloop van de vergoeding bepaald overeenkomstig
      [artikel 87, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel87
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '87'
  - number: '96.5'
    text: |-
      De echtgenoot die een schuldeiser tegenwerpt dat een goed waarop deze verhaal zoekt niet behoort tot de
      gemeenschap, draagt daarvan de bewijslast.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel96
  - number: 96a
    text: |-
      Indien een echtgenoot door een begunstiging bij een door zijn overlijden tot uitkering komende sommenverzekering
      een gift aan een derde heeft gedaan en ten laste van de gemeenschap premies voor die verzekering zijn gekomen, is
      de echtgenoot deswege gehouden tot vergoeding aan de gemeenschap. De vergoeding beloopt een gedeelte van de waarde
      van de uitkering, evenredig aan het uit de gemeenschap afkomstige aandeel in de premies.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel96a
  - number: 96b
    text: |-
      Echtgenoten kunnen bij overeenkomst het beloop van vergoedingen ingevolge de [artikelen 95][ref1], [96][ref2] en
      [96a][ref3] anders bepalen. [Artikel 87, vierde lid, tweede zin][ref4], is van overeenkomstige toepassing. Kan de
      vergoeding niet nauwkeurig worden vastgesteld, dan wordt zij geschat.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel96
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel96a
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel87
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel96b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '95'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '96'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 96a
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '87'
  - number: '97.1'
    text: |-
      Een goed dat op naam van een echtgenoot staat of dat hij krachtens erfopvolging bij versterf, making,
      lastbevoordeling of gift heeft verkregen, staat onder diens bestuur. Voor het overige is ieder der echtgenoten
      bevoegd tot het bestuur over de goederen van de gemeenschap. [Artikel 170, eerste lid, van Boek 3][ref1] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel170
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '170'
  - number: '97.2'
    text: |-
      Is een goed der gemeenschap met toestemming, verleend door de echtgenoot onder wiens bestuur dat goed alleen of
      mede stond, dienstbaar aan een beroep of bedrijf van de andere echtgenoot, dan berust het bestuur van dat goed,
      voor zover het handelingen betreft die als normale uitoefening van dat beroep of bedrijf zijn te beschouwen,
      uitsluitend bij laatstbedoelde echtgenoot en voor het overige bij de echtgenoten gezamenlijk. Een verleende
      toestemming geldt voor de gehele duur van het beroep of bedrijf, tenzij de echtgenoten anders overeenkomen, doch de
      rechtbank kan de dienstbaarheid op verzoek van een echtgenoot te allen tijde wegens gegronde redenen beëindigen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel97
  - number: '97.3'
    text: |-
      Geschillen tussen de echtgenoten over het bestuur ten aanzien van tot de gemeenschap behorende goederen, kunnen op
      verzoek van de echtgenoten of van een van hen aan de rechtbank worden voorgelegd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel97
  - number: '99.1'
    text: 'De gemeenschap wordt van rechtswege ontbonden:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel99
  - number: 99.1.a
    text: |-
      in geval van het eindigen van het huwelijk of het geregistreerd partnerschap door overlijden: op het tijdstip van
      overlijden;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel99
  - number: 99.1.b
    text: |-
      in geval van beëindiging van het huwelijk door echtscheiding of ontbinding van het geregistreerd partnerschap door
      de rechter: op het tijdstip van indiening van het verzoek tot echtscheiding onderscheidenlijk indiening van het
      verzoek tot ontbinding van het geregistreerd partnerschap;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel99
  - number: 99.1.c
    text: |-
      in geval van scheiding van tafel en bed: op het tijdstip van indiening van het verzoek tot scheiding van tafel
      en bed;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel99
  - number: 99.1.d
    text: |-
      in geval van opheffing van de gemeenschap door een beschikking: op het tijdstip van indiening van het verzoek tot
      opheffing van de gemeenschap;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel99
  - number: 99.1.e
    text: |-
      in geval van beëindiging van het geregistreerd partnerschap met wederzijds goedvinden: op het tijdstip waarop de
      overeenkomst tot beëindiging wordt gesloten;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel99
  - number: 99.1.f
    text: |-
      in geval van vermissing en een daarop gevolgd huwelijk of geregistreerd partnerschap: op het tijdstip waarop de
      beschikking, bedoeld in [artikel 417, eerste lid][ref1], in kracht van gewijsde is gegaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel417
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '417'
        afdeling: '2'
  - number: 99.1.g
    text: |-
      in geval van opheffing bij latere huwelijkse voorwaarden: op het tijdstip, bedoeld in
      [artikel 120, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel120
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '120'
        afdeling: '1'
  - number: '99.2'
    text: |-
      De ontbinding van de gemeenschap door indiening van een verzoek als bedoeld in het eerste lid, onder b, c en
      d, alsmede door sluiting van een overeenkomst als bedoeld onder e, kan aan derden die daarvan onkundig waren
      slechts worden tegengeworpen, indien het desbetreffende verzoek dan wel de overeenkomst ingeschreven was in het
      huwelijksgoederenregister, bedoeld in [artikel 116][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '99.3'
    text: |-
      Indien vast komt te staan dat een verzoek als bedoeld in het eerste lid, onder b, c en d, dan wel een overeenkomst
      als bedoeld in het eerste lid, onder e, niet meer kan leiden tot echtscheiding, ontbinding van het geregistreerd
      partnerschap, scheiding van tafel en bed, opheffing van de gemeenschap door een beschikking, onderscheidenlijk
      beëindiging van het geregistreerd partnerschap met wederzijds goedvinden, herleven van rechtswege alle gevolgen van
      de gemeenschap, alsof er geen verzoek was ingediend of overeenkomst was gesloten, tenzij zich inmiddels een andere
      grond voor ontbinding heeft voorgedaan. Nochtans wordt de geldigheid van rechtshandelingen die zijn verricht tussen
      het tijdstip van indiening van het verzoek of sluiting van de overeenkomst en het tijdstip waarop komt vast te
      staan dat het verzoek of de overeenkomst niet meer tot het in de eerste zin bedoelde gevolg kan leiden, beoordeeld
      naar het tijdstip van de handeling.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel99
  - number: '99.4'
    text: |-
      Tezamen met een verzoek als bedoeld in het eerste lid, onder b, c of d kan reeds overeenkomstig
      [titel 7 van Boek 3][ref1] een vordering worden ingesteld tot verdeling van de gemeenschap, tot gelasten van de
      wijze van verdeling en tot vaststelling van de verdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0005291
  - number: '100.1'
    text: |-
      De echtgenoten hebben een gelijk aandeel in de ontbonden gemeenschap, tenzij anders is bepaald bij huwelijkse
      voorwaarden of bij een overeenkomst die tussen de echtgenoten bij geschrift is gesloten met het oog op de
      aanstaande ontbinding der gemeenschap anders dan door de dood of ten gevolge van opheffing bij huwelijkse
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel100
  - number: '100.2'
    text: |-
      Zij die bij de ontbinding van de gemeenschap schuldeiser zijn, behouden het hun toekomende recht van verhaal op de
      goederen der gemeenschap, zolang deze niet verdeeld zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel100
  - number: '101'
    text: |-
      Na de ontbinding der gemeenschap heeft ieder der echtgenoten de bevoegdheid de te zijnen gebruike strekkende
      kleren en kleinodiën, alsmede zijn beroeps- en bedrijfsmiddelen en de papieren en gedenkstukken tot zijn familie
      behorende, tegen de geschatte prijs over te nemen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel101
  - number: '102'
    text: |-
      Na ontbinding van de gemeenschap blijft ieder der echtgenoten voor het geheel aansprakelijk voor de
      gemeenschapsschulden waarvoor hij voordien aansprakelijk was. Voor andere gemeenschapsschulden is hij hoofdelijk
      met de andere echtgenoot verbonden, met dien verstande evenwel dat daarvoor slechts kan worden uitgewonnen hetgeen
      hij uit hoofde van verdeling van de gemeenschap heeft verkregen, onverminderd de [artikelen 190, eerste lid][ref1],
      en [191, eerste lid, van Boek 3][ref2]. De rechtsvordering tot voldoening van de in de tweede volzin bedoelde
      schuld verjaart tegelijkertijd met de rechtsvordering tegen de echtgenoot, in wiens persoon de in die volzin
      bedoelde gemeenschapsschuld is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel191
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '190'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '191'
  - number: '103.1'
    text: |-
      Ieder der echtgenoten heeft het recht van de gemeenschap afstand te doen; alle daarmede strijdige overeenkomsten
      zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel103
  - number: '103.2'
    text: Het deel der gemeenschap waarvan afstand wordt gedaan, wast aan bij het deel van de andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel103
  - number: '103.3'
    text: |-
      De echtgenoot die afstand heeft gedaan, kan uit de gemeenschap niets terugvorderen dan alleen zijn bed met
      bijbehorend beddegoed en de kleren die hij voor zijn persoonlijk gebruik nodig heeft. Hij kan de papieren en
      gedenkstukken, tot zijn familie behorende, tegen de geschatte prijs overnemen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel103
  - number: '103.4'
    text: |-
      Door deze afstand wordt hij ontheven van de aansprakelijkheid en de draagplicht voor schulden der gemeenschap,
      waarvoor hij vóór de ontbinding der gemeenschap niet aansprakelijk was.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel103
  - number: '103.5'
    text: |-
      Hij blijft aansprakelijk voor de schulden der gemeenschap, waarvoor hij vóór de ontbinding der gemeenschap
      aansprakelijk was. Indien hij een schuld, waarvoor beide echtgenoten vóór de ontbinding der gemeenschap voor het
      geheel aansprakelijk waren, voor meer dan de helft heeft voldaan, heeft hij voor het meerdere verhaal tegen de
      andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel103
  - number: '103.6'
    text: |-
      Indien de andere echtgenoot een schuld der gemeenschap, waarvoor hij vóór de ontbinding der gemeenschap niet
      aansprakelijk was, geheel of ten dele heeft voldaan, heeft hij deswege verhaal tegen de echtgenoot die de afstand
      heeft gedaan. Heeft hij een schuld, waarvoor beide echtgenoten vóór de ontbinding der gemeenschap voor het geheel
      aansprakelijk waren, voor meer dan de helft voldaan, dan heeft hij voor het meerdere verhaal tegen de echtgenoot
      die de afstand heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel103
  - number: '104.1'
    text: |-
      De echtgenoot die van het bij het vorige artikel omschreven voorrecht wil gebruik maken, is verplicht binnen drie
      maanden na de ontbinding der gemeenschap een akte van afstand te doen inschrijven in het huwelijksgoederenregister,
      aangewezen in [artikel 116 van dit boek][ref1], op verbeurte van dit voorrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '104.2'
    text: |-
      Indien de gemeenschap door de dood van de andere echtgenoot wordt ontbonden, begint de termijn van
      drie maanden te lopen op de dag waarop de echtgenoot die van het voorrecht wil gebruik maken, van
      dat overlijden kennis heeft genomen. Indien de gemeenschap is ontbonden op de wijze als bedoeld in
      [artikel 99, eerste lid, onder c en d][ref1], eindigt de termijn drie maanden nadat het verzoek tot opheffing van
      de gemeenschap of tot scheiding van tafel en bed bij de rechtbank is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel99
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '99'
        afdeling: '3'
  - number: '105.1'
    text: |-
      De erfgenamen van een echtgenoot, door wiens overlijden de gemeenschap is ontbonden, of die binnen de in het vorige
      artikel gestelde termijn is overleden zonder afstand te hebben gedaan, zijn ieder voor hun aandeel bevoegd op de
      in het vorige artikel omschreven wijze afstand te doen binnen drie maanden nadat zij met het overlijden bekend
      zijn geworden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel105
  - number: '105.2'
    text: |-
      De aanspraak van de echtgenoot tot terugvordering van zijn bed, beddegoed, en kleren uit de gemeenschap kan niet
      worden overgedragen en gaat ook niet over op zijn erfgenamen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel105
  - number: '106'
    text: |-
      De rechtbank van de plaats waar de akte van afstand moet worden ingeschreven, kan de voor de inschrijving gestelde
      termijn voor de afloop daarvan een of meer malen op grond van bijzondere omstandigheden verlengen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel106
  - number: '107.1'
    text: |-
      De echtgenoot of zijn erfgenaam, die zich de goederen der gemeenschap heeft aangetrokken of goederen daarvan heeft
      weggemaakt of verduisterd, kan geen afstand meer doen. Daden van dagelijks bestuur of tot behoud van de goederen
      brengen dit gevolg niet teweeg.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel107
  - number: '107.2'
    text: |-
      Hij die na gedane afstand goederen der gemeenschap wegmaakt of verduistert, verliest de bevoegdheid
      [artikel 103 lid 4 van dit boek][ref1] in te roepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel103
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '103'
        afdeling: '3'
  - number: '108.1'
    text: |-
      Afstand van de gemeenschap, door een echtgenoot of een erfgenaam van een echtgenoot gedaan nadat door de andere
      echtgenoot of een of meer van diens erfgenamen afstand werd gedaan, heeft niet de gevolgen, omschreven in
      [artikel 103 leden 2 en 3 van dit boek][ref1], en verplicht hen die tot de gemeenschap gerechtigd zijn, haar te
      vereffenen. [Afdeling 3 van titel 6 van Boek 4][ref2] betreffende de vereffening van nalatenschappen is zoveel
      mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Afdeling3
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '103'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002761
        afdeling: '3'
  - number: '108.2'
    text: |-
      Indien hij die tot vereffening van de gemeenschap gehouden is, na tot het afleggen van de rekening en
      verantwoording te zijn aangemaand, in gebreke blijft aan deze verplichting te voldoen, verliest hij de bevoegdheid
      [artikel 103 lid 4 van dit boek][ref1] in te roepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel103
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '103'
        afdeling: '3'
  - number: '109'
    text: |-
      Een echtgenoot kan opheffing van de gemeenschap verzoeken, wanneer de andere echtgenoot op lichtvaardige wijze
      schulden maakt, de goederen der gemeenschap verspilt, handelingen verricht, die kennelijk indruisen tegen het
      bestuur van de andere echtgenoot over goederen der gemeenschap, of weigert de nodige inlichtingen te geven omtrent
      de stand van de goederen der gemeenschap en van de daarop verhaalbare schulden en het over die goederen gevoerde
      bestuur.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel109
  - number: '110'
    text: |-
      De echtgenoot die de opheffing van de gemeenschap verzoekt, kan tot behoud van zijn recht de maatregelen nemen, die
      in het [Wetboek van Burgerlijke Rechtsvordering][ref1] nader zijn aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '111.1'
    text: |-
      Indien de echtgenoot tegen wie het verzoek is toegewezen, de gemeenschap heeft benadeeld doordat hij na de aanvang
      van het geding of binnen zes maanden daarvóór lichtvaardig schulden heeft gemaakt, goederen der gemeenschap heeft
      verspild, of een rechtshandeling als bedoeld in [artikel 88 van dit boek][ref1] zonder de vereiste toestemming of
      beslissing van de rechtbank heeft verricht, is hij gehouden de aangerichte schade aan de gemeenschap te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel88
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '88'
  - number: '111.2'
    text: |-
      Een op het vorige lid gegronde vordering kan niet later worden ingesteld dan drie jaren nadat het verzoek tot
      opheffing van de gemeenschap bij de rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel111
  - number: '113'
    text: |-
      Is de gemeenschap door opheffing ontbonden, dan kunnen de echtgenoten daarna, echter alleen bij huwelijkse
      voorwaarden, wederom een gemeenschap overeenkomen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel113
  - number: '114'
    text: |-
      Huwelijkse voorwaarden kunnen zowel door aanstaande echtgenoten vóór het sluiten van het huwelijk als door
      echtgenoten tijdens het huwelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel114
  - number: '115.1'
    text: Huwelijkse voorwaarden moeten op straffe van nietigheid bij notariële akte worden aangegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel115
  - number: '115.2'
    text: |-
      Een volmacht tot het aangaan van huwelijkse voorwaarden moet schriftelijk worden verleend en moet de in de
      huwelijkse voorwaarden op te nemen bepalingen bevatten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel115
  - number: '116.1'
    text: |-
      Bepalingen in huwelijkse voorwaarden kunnen aan derden die daarvan onkundig waren, slechts worden tegengeworpen,
      indien die bepalingen ingeschreven waren in het openbaar huwelijksgoederenregister, gehouden ter griffie der
      rechtbank binnen welker rechtsgebied het huwelijk is voltrokken, of, indien het huwelijk buiten Nederland is
      aangegaan, ter griffie van de rechtbank Den Haag.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel116
  - number: '116.2'
    text: De wijze van inrichting en raadpleging van het register wordt nader bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel116
  - number: '116.3'
    text: |-
      In afwijking van het eerste lid kan bij algemene maatregel van bestuur worden bepaald dat het register elders dan
      ter griffie der rechtbank wordt gehouden. Bij algemene maatregel van bestuur kan eveneens worden bepaald dat de
      verstrekking van gegevens ter inschrijving in het register uitsluitend op een in die maatregel aan te geven wijze
      plaats vindt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel116
  - number: '117.1'
    text: |-
      Huwelijkse voorwaarden vóór het huwelijk gemaakt of gewijzigd, zijn slechts geldig, indien zij wier toestemming
      tot het huwelijk noodzakelijk is, bij de akte hun toestemming tot de huwelijkse voorwaarden of de wijziging hebben
      gegeven; is de toestemming van de rechter nodig, dan kan worden volstaan met vasthechting van zijn beschikking aan
      de minuut van de akte. Op het verzoek tot toestemming van de rechter is [artikel 39 lid 1][ref1] van dit boek van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel39
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '39'
        afdeling: '1'
  - number: '117.2'
    text: |-
      Vóór het huwelijk gemaakte huwelijkse voorwaarden beginnen te werken van het tijdstip der voltrekking van het
      huwelijk; geen ander tijdstip kan daarvoor worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel117
  - number: '118'
    text: |-
      De echtgenoot die onder curatele staat, kan na de huwelijksvoltrekking slechts met toestemming van zijn curator
      huwelijkse voorwaarden maken of wijzigen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel118
  - number: '120.1'
    text: |-
      Tijdens het huwelijk gemaakte of gewijzigde huwelijkse voorwaarden beginnen te werken op de dag, volgende op die
      waarop de akte is verleden, tenzij in de akte een later tijdstip is aangewezen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel120
  - number: '120.2'
    text: |-
      Bepalingen in deze huwelijkse voorwaarden kunnen aan derden die daarvan onkundig waren, slechts worden
      tegengeworpen, indien zij ten minste veertien dagen in het huwelijksgoederenregister ingeschreven waren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel120
  - number: '121.1'
    text: |-
      Partijen kunnen bij huwelijkse voorwaarden afwijken van de regels der wettelijke gemeenschap, mits die voorwaarden
      niet met dwingende wetsbepalingen, de goede zeden, of de openbare orde strijden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel121
  - number: '121.2'
    text: |-
      Zij kunnen niet bepalen dat een hunner tot een groter aandeel in de schulden zal zijn gehouden, dan zijn aandeel in
      de goederen der gemeenschap beloopt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel121
  - number: '121.3'
    text: |-
      Zij kunnen niet afwijken van de rechten die uit het ouderlijk gezag voortspruiten, noch van de rechten die de wet
      aan een langstlevende echtgenoot toekent.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel121
  - number: '130'
    text: |-
      Een echtgenoot kan tegen derden zijn aanbreng van bij huwelijkse voorwaarden buiten de gemeenschap gehouden
      goederen, voor wat betreft rechten aan toonder en zaken die geen registergoederen zijn, slechts bewijzen door hun
      vermelding in de akte van huwelijkse voorwaarden of in een door de partijen en de notaris ondertekende, aan de
      minuut van die akte vastgehechte beschrijving. Indien de vermelding van een goed geen afdoende omschrijving daarvan
      biedt, kan aanvullend bewijs door alle middelen worden geleverd; ten aanzien van goederen die een echtgenoot buiten
      diens weten opgekomen waren, kan het bewijs door alle middelen worden geleverd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel130
  - number: '131.1'
    text: |-
      Bestaat tussen niet in gemeenschap van goederen gehuwde echtgenoten een geschil aan wie van hen beiden een
      recht aan toonder of een zaak die geen registergoed is, toebehoort en kan geen van beiden zijn recht op dit goed
      bewijzen, dan wordt het goed geacht aan ieder der echtgenoten voor de helft toe te behoren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel131
  - number: '131.2'
    text: Het vermoeden werkt niet ten nadele van de schuldeisers der echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel131
  - number: '132.1'
    text: |-
      Deze afdeling is van toepassing op huwelijkse voorwaarden die een of meer verplichtingen inhouden tot verrekening
      van inkomsten of van vermogen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel132
  - number: '132.2'
    text: |-
      Tenzij anders is bepaald, kan van deze afdeling bij huwelijkse voorwaarden uitdrukkelijk of door de aard der
      bedingen worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel132
  - number: '133.1'
    text: De verplichting tot verrekening van inkomsten of van vermogen is wederkerig.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel133
  - number: '133.2'
    text: |-
      De verplichting tot verrekening heeft uitsluitend betrekking op inkomsten die of op vermogen dat de echtgenoten
      tijdens het bestaan van deze verplichting hebben verkregen. De verplichting tot verrekening heeft geen betrekking
      op vermogen dat krachtens erfopvolging bij versterf, making, lastbevoordeling of gift wordt verkregen en ook niet
      op de vruchten daaruit of de voor dat vermogen of voor die vruchten in de plaats getreden goederen. Evenmin heeft
      de verplichting tot verrekening betrekking op vermogen dat bestaat uit rechten op het vestigen van vruchtgebruik
      als bedoeld in de [artikelen 29][ref1] en [30 van Boek 4][ref2], vruchtgebruik dat op grond van die bepalingen is
      gevestigd, alsmede hetgeen wordt verkregen ingevolge de [artikelen 34][ref3], [35][ref4], [36][ref5], [38][ref6] en
      [126, tweede lid, onder a en c, van Boek 4][ref7], en [afdeling 3 van titel 4 van Boek 4][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0002761#Artikel38
      [ref7]: https://wetten.overheid.nl/BWBR0002761#Artikel126
      [ref8]: https://wetten.overheid.nl/BWBR0002761#Afdeling3
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0002761
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0002761
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0002761
        artikel: '34'
      - id: ref4
        bwb_id: BWBR0002761
        artikel: '35'
      - id: ref5
        bwb_id: BWBR0002761
        artikel: '36'
      - id: ref6
        bwb_id: BWBR0002761
        artikel: '38'
      - id: ref7
        bwb_id: BWBR0002761
        artikel: '126'
      - id: ref8
        bwb_id: BWBR0002761
        afdeling: '3'
  - number: '134'
    text: |-
      Bij uiterste wilsbeschikking of bij de gift kan worden bepaald dat geen verrekening van krachtens erfopvolging
      bij versterf, making, lastbevoordeling of gift verkregen vermogen en van de vruchten daarvan plaatsvindt, indien
      verrekening daarvan ingevolge huwelijkse voorwaarden zou behoren plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel134
  - number: '135.1'
    text: De verrekening van inkomsten of van vermogen geschiedt bij helfte.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel135
  - number: '135.2'
    text: |-
      Op de verrekening zijn de [artikelen 181][ref1], [183][ref2] en
      [195 tot en met 200 van Boek 3 van dit wetboek][ref3] van overeenkomstige toepassing, met dien verstande dat
      voor de beoordeling van de vraag of benadeling als bedoeld in [artikel 196 van Boek 3 van dit wetboek][ref4]
      heeft plaatsgevonden, de in [artikel 142][ref5] genoemde tijdstippen bepalend zijn. De
      [artikelen 677 tot en met 680 van het Wetboek van Burgerlijke Rechtsvordering][ref6] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel181
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel183
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel195
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel196
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel142
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel677
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '181'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '183'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '195'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '196'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '142'
        paragraaf: '3'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '677'
  - number: '135.3'
    text: |-
      Een echtgenoot die opzettelijk een tot het te verrekenen vermogen behorend goed verzwijgt, zoek maakt of verborgen
      houdt waardoor de waarde daarvan niet in de verrekening is betrokken, dient de waarde daarvan niet te verrekenen,
      maar geheel aan de andere echtgenoot te vergoeden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel135
  - number: '136.1'
    text: |-
      Indien een goed onder aanwending van te verrekenen vermogen is verkregen, wordt het verkregen goed tot het te
      verrekenen vermogen gerekend voor het aandeel dat overeenkomt met het bij de verkrijging uit het te verrekenen
      vermogen aangewende gedeelte van de tegenprestatie gedeeld door de totale tegenprestatie. Indien een echtgenoot in
      verband met de verwerving van een goed een schuld is aangegaan, wordt het goed op de voet van de eerste volzin tot
      het te verrekenen vermogen gerekend voor zover de schuld daartoe wordt gerekend of daaruit is afgelost of betaald.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel136
  - number: '136.2'
    text: |-
      Bestaat tussen de echtgenoten een geschil omtrent de vraag of een goed tot het te verrekenen vermogen wordt
      gerekend en kan geen van beiden bewijzen dat het goed tot het niet te verrekenen vermogen wordt gerekend, dan
      wordt dat goed aangemerkt als te rekenen tot het te verrekenen vermogen. Het vermoeden werkt niet ten nadele van de
      schuldeisers der echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel136
  - number: '137.1'
    text: Onverminderd het derde lid, geschiedt een verrekening in geld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel137
  - number: '137.2'
    text: |-
      Indien op grond van een verrekenbeding over en weer opeisbare vorderingen ontstaan, worden beide vorderingen van
      rechtswege met elkaar verrekend tot aan hun gemeenschappelijk beloop.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel137
  - number: '137.3'
    text: |-
      Een echtgenoot is slechts gehouden een inbetalinggeving van goederen te aanvaarden dan wel kan deze slechts
      verlangen in plaats van een verrekening in geld, voor zover de verrekening in geld naar maatstaven van redelijkheid
      en billijkheid onaanvaardbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel137
  - number: '138.1'
    text: |-
      De ene echtgenoot is aan de andere geen verantwoording over het bestuur van zijn goederen schuldig. Slecht bestuur
      over die goederen verplicht niet tot schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel138
  - number: '138.2'
    text: |-
      De ene echtgenoot kan jaarlijks van de andere echtgenoot een gespecificeerde, schriftelijke en ondertekende opgave
      verzoeken van de te verrekenen inkomsten en van het te verrekenen vermogen. Van deze bepaling kan niet worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel138
  - number: '138.3'
    text: Geschillen tussen de echtgenoten betreffende de opgave worden op verzoek van een van hen door de rechtbank beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel138
  - number: '139.1'
    text: |-
      Een echtgenoot kan de opheffing van de wederzijdse verplichting tot verrekening verzoeken, wanneer
      de andere echtgenoot op lichtvaardige wijze schulden maakt, zijn goederen verspilt of weigert de in
      [artikel 138, tweede lid][ref1], bedoelde verplichte opgave omtrent zijn te verrekenen inkomsten of vermogen te
      verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel138
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '138'
        paragraaf: '1'
        afdeling: '2'
  - number: '139.2'
    text: |-
      Indien de echtgenoot tegen wie het verzoek zich richt, het te verrekenen vermogen benadeelt doordat hij na de
      aanvang van het geding of binnen zes maanden daarvoor lichtvaardig schulden heeft gemaakt, te verrekenen goederen
      heeft verspild, of een rechtshandeling als bedoeld in [artikel 88][ref1] zonder de vereiste toestemming of
      beslissing van de rechtbank heeft verricht, is hij gehouden de aangerichte schade te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel88
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '88'
  - number: '139.3'
    text: Van het eerste en tweede lid kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel139
  - number: '140.1'
    text: |-
      Op verzoek van de verrekenplichtige echtgenoot kan de rechter wegens gewichtige redenen bepalen dat een
      verschuldigde geldsom, al dan niet vermeerderd met een in de beschikking te bepalen rente, in termijnen of eerst
      na verloop van zekere tijd, hetzij ineens, hetzij in termijnen behoeft te worden voldaan. Hierbij let de rechter op
      de belangen van beide partijen. De rechter kan de verrekenplichtige echtgenoot verplichten binnen een bepaalde tijd
      zakelijke of persoonlijke zekerheid te stellen voor de voldoening van de verschuldigde geldsom.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel140
  - number: '140.2'
    text: |-
      Hetgeen in het eerste lid omtrent een echtgenoot is bepaald, geldt op overeenkomstige wijze na zijn overlijden voor
      zijn rechtverkrijgenden onder algemene titel.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel140
  - number: '140.3'
    text: Van het eerste en tweede lid kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel140
  - number: '141.1'
    text: |-
      Indien een verrekenplicht betrekking heeft op een in de huwelijkse voorwaarden omschreven tijdvak van het huwelijk
      en over dat tijdvak niet is afgerekend, blijft de verplichting tot verrekening over dat tijdvak in stand en strekt
      deze zich uit over het saldo, ontstaan door belegging en herbelegging van hetgeen niet verrekend is, alsmede over
      de vruchten daarvan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel141
  - number: '141.2'
    text: |-
      Indien een verrekenplicht betrekking heeft op een in de huwelijkse voorwaarden omschreven tijdvak van het huwelijk,
      dan eindigt die verrekenplicht op het tijdstip zoals in [artikel 142][ref1] bepaald, als dat tijdvak nog loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel142
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '142'
        paragraaf: '3'
        afdeling: '2'
  - number: '141.3'
    text: |-
      Indien bij het einde van het huwelijk aan een bij huwelijkse voorwaarden overeengekomen periodieke verrekenplicht
      als bedoeld in het eerste lid niet is voldaan, wordt het alsdan aanwezige vermogen vermoed te zijn gevormd uit
      hetgeen verrekend had moeten worden, tenzij uit de eisen van redelijkheid en billijkheid in het licht van de aard
      en omvang van de verrekenplicht anders voortvloeit. [Artikel 143][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel143
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '143'
        paragraaf: '3'
        afdeling: '2'
  - number: '141.4'
    text: |-
      Indien een echtgenoot in overwegende mate bij machte is te bepalen dat de winsten van een niet op zijn eigen naam
      uitgeoefende onderneming hem rechtstreeks of middellijk ten goede komen, en een verrekenbeding is overeengekomen
      dat ook ondernemingswinsten omvat, worden de niet uitgekeerde winsten uit zodanige onderneming, voor zover in
      het maatschappelijk verkeer als redelijk beschouwd, eveneens in aanmerking genomen bij de vaststelling van de
      verrekenplicht van die echtgenoot, onverminderd het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel141
  - number: '141.5'
    text: Het vierde lid is van overeenkomstige toepassing, indien een echtgenoot op eigen naam een onderneming uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel141
  - number: '141.6'
    text: |-
      De rechtsvordering tot verrekening, bedoeld in het eerste lid, verjaart niet eerder dan drie jaren na de
      beëindiging van het huwelijk dan wel na de inschrijving van de beschikking tot scheiding van tafel en bed in het
      register, bedoeld in [artikel 116][ref1]. Deze termijn kan niet worden verkort.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '142.1'
    text: 'Als tijdstip waarop de samenstelling en de omvang van het te verrekenen vermogen worden bepaald, geldt:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel142
  - number: 142.1.a
    text: |-
      in geval van het eindigen van het huwelijk of het geregistreerd partnerschap door overlijden: het tijdstip van
      overlijden;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel142
  - number: 142.1.b
    text: |-
      in geval van beëindiging van het huwelijk door echtscheiding: het tijdstip van indiening van het verzoek tot
      echtscheiding;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel142
  - number: 142.1.c
    text: 'in geval van scheiding van tafel en bed: het tijdstip van indiening van het verzoek tot scheiding van tafel en bed;'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel142
  - number: 142.1.d
    text: |-
      in geval van opheffing van de wederzijdse verplichting tot verrekening als bedoeld in [artikel 139][ref1]: het
      tijdstip van indiening van het verzoek tot opheffing van die verplichting;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel139
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '139'
        paragraaf: '1'
        afdeling: '2'
  - number: 142.1.e
    text: |-
      in geval van beëindiging van het geregistreerd partnerschap met wederzijds goedvinden: het tijdstip waarop de
      overeenkomst tot beëindiging wordt gesloten;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel142
  - number: 142.1.f
    text: 'in geval van ontbinding van het geregistreerd partnerschap op verzoek: het tijdstip van indiening van het verzoek;'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel142
  - number: 142.1.g
    text: |-
      in geval van vermissing en een daarop gevolgd huwelijk of geregistreerd partnerschap: het tijdstip waarop de
      beschikking, bedoeld in [artikel 417][ref1], eerste lid, in kracht van gewijsde is gegaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel417
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '417'
        afdeling: '2'
  - number: 142.1.h
    text: |-
      in geval van opheffing van de wederzijdse verplichting tot verrekening bij huwelijkse voorwaarden: het tijdstip,
      bedoeld in [artikel 120, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel120
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '120'
        afdeling: '1'
  - number: '142.2'
    text: Van het eerste lid, aanhef en onder b tot en met f, kan bij op schrift gestelde overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel142
  - number: '143.1'
    text: |-
      Vanaf de in het [eerste lid van artikel 142][ref1] vermelde tijdstippen kan ieder der echtgenoten verzoeken dat het
      te verrekenen vermogen van de andere echtgenoot wordt beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel142
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '142'
        paragraaf: '3'
        afdeling: '2'
  - number: '143.2'
    text: |-
      De [artikelen 671 tot en met 676][ref1] en [679 van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel671
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel679
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '671'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '679'
  - number: '143.3'
    text: |-
      Hetgeen in de vorige leden omtrent een echtgenoot is bepaald, geldt op overeenkomstige wijze na zijn overlijden
      voor zijn rechtverkrijgenden onder algemene titel.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel143
  - number: '143.4'
    text: Van het eerste tot en met het derde lid kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel143
  - number: '149'
    text: 'Het huwelijk eindigt:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel149
  - number: 149.a
    text: door de dood;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel149
  - number: 149.b
    text: |-
      indien de vermiste, die overeenkomstig de bepalingen van de [tweede][ref1] of
      [derde afdeling van de achttiende titel van dit boek][ref2] vermoedelijk overleden dan wel overleden is verklaard,
      nog in leven is op de dag waarop de achtergebleven echtgenoot een nieuw huwelijk of geregistreerd partnerschap is
      aangegaan: door de voltrekking van dit huwelijk of geregistreerd partnerschap;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling3
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        afdeling: '3'
  - number: 149.c
    text: |-
      door echtscheiding, overeenkomstig de bepalingen van de [tweede afdeling][ref1] van deze titel;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '2'
  - number: 149.d
    text: |-
      door ontbinding van het huwelijk na scheiding van tafel en bed, overeenkomstig de bepalingen van de
      [tweede afdeling van de tiende titel van dit boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '2'
  - number: '150'
    text: |-
      Echtscheiding tussen echtgenoten die niet van tafel en bed gescheiden zijn, wordt uitgesproken op verzoek van één
      der echtgenoten of op hun gemeenschappelijk verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel150
  - number: '151'
    text: Echtscheiding wordt op verzoek van één der echtgenoten uitgesproken, indien het huwelijk duurzaam ontwricht is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel151
  - number: '153.1'
    text: |-
      Indien als gevolg van de verzochte echtscheiding een bestaand vooruitzicht op uitkeringen aan de andere
      echtgenoot na vooroverlijden van de echtgenoot die het verzoek heeft gedaan zou teloorgaan of in ernstige mate
      zou verminderen, en de andere echtgenoot deswege tegen dat verzoek verweer voert, kan deze niet worden toegewezen
      voordat daaromtrent een voorziening is getroffen die, gelet op de omstandigheden van het geval, ten opzichte van
      beide echtgenoten billijk is te achten. De rechter kan daartoe een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel153
  - number: '153.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel153
  - number: 153.2.a
    text: |-
      indien redelijkerwijs te verwachten is dat de andere echtgenoot zelf voor dat geval voldoende voorzieningen kan
      treffen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel153
  - number: 153.2.b
    text: indien de duurzame ontwrichting van het huwelijk in overwegende mate te wijten is aan de andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel153
  - number: '154.1'
    text: |-
      Echtscheiding wordt op gemeenschappelijk verzoek van de echtgenoten uitgesproken indien het verzoek is gegrond op
      hun beider oordeel dat het huwelijk duurzaam ontwricht is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel154
  - number: '154.2'
    text: Ieder der echtgenoten is tot op het tijdstip der uitspraak bevoegd het verzoek in te trekken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel154
  - number: '155'
    text: |-
      In geval van echtscheiding en voor zover de ene echtgenoot na de huwelijkssluiting en voor de echtscheiding
      pensioenaanspraken heeft opgebouwd, heeft de andere echtgenoot overeenkomstig het bepaalde bij of krachtens de
      [Wet verevening pensioenrechten bij scheiding][ref1] recht op pensioenverevening, tenzij de echtgenoten op de wijze
      voorzien in deze Wet toepasselijkheid daarvan hebben uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0006641
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0006641
  - number: '157.1'
    text: |-
      De rechter kan bij de echtscheidingsbeschikking of bij latere uitspraak aan de echtgenoot die niet voldoende
      inkomsten tot zijn levensonderhoud heeft, noch zich in redelijkheid kan verwerven, op diens verzoek ten laste van
      de andere echtgenoot een uitkering tot levensonderhoud toekennen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel157
  - number: '157.2'
    text: |-
      Bij de vaststelling van de uitkering kan de rechter rekening houden met de behoefte aan een voorziening in het
      levensonderhoud voor het geval van overlijden van degene die tot de uitkering is gehouden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel157
  - number: '157.3'
    text: |-
      De rechter kan op verzoek van één van de echtgenoten de uitkering toekennen onder vaststelling van voorwaarden en
      van een termijn. Deze vaststelling kan niet ten gevolge hebben dat de uitkering later eindigt dan twaalf jaren na
      de datum van inschrijving van de beschikking in de registers van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel157
  - number: '157.4'
    text: |-
      Indien de rechter geen termijn heeft vastgesteld, eindigt de verplichting tot levensonderhoud van rechtswege na het
      verstrijken van een termijn van twaalf jaren, die aanvangt op de datum van inschrijving van de beschikking in de
      registers van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel157
  - number: '157.5'
    text: |-
      Indien de beëindiging van de uitkering ten gevolge van het verstrijken van de in het vierde lid bedoelde termijn
      van zo ingrijpende aard is dat ongewijzigde handhaving van die termijn naar maatstaven van redelijkheid en
      billijkheid van degene die tot de uitkering gerechtigd is niet kan worden gevergd, kan de rechter op diens verzoek
      alsnog een termijn vaststellen. Het verzoek daartoe dient te worden ingediend voordat drie maanden sinds de
      beëindiging zijn verstreken. De rechter bepaalt bij de uitspraak of verlenging van de termijn na ommekomst daarvan
      al dan niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel157
  - number: '157.6'
    text: |-
      Indien de duur van het huwelijk niet meer bedraagt dan vijf jaren en uit dit huwelijk geen kinderen zijn geboren,
      eindigt de verplichting tot levensonderhoud van rechtswege na het verstrijken van een termijn die gelijk is aan
      de duur van het huwelijk en die aanvangt op de datum van inschrijving van de beschikking in de registers van de
      burgerlijke stand. Indien de rechter een termijn vaststelt, kan deze vaststelling niet ten gevolge hebben dat
      de uitkering op een later tijdstip eindigt dan ingevolge de vorige zin het geval zou zijn. Het vijfde lid is van
      overeenkomstige toepassing met dien verstande dat in de eerste zin in plaats van "de in het vierde lid bedoelde
      termijn" wordt gelezen: de in de eerste zin bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel157
  - number: '158'
    text: |-
      Vóór of na de beschikking tot echtscheiding kunnen de echtgenoten bij overeenkomst bepalen of, en zo ja tot
      welk bedrag, na de echtscheiding de één tegenover de ander tot een uitkering tot diens levensonderhoud zal zijn
      gehouden. Indien in de overeenkomst geen termijn is opgenomen, is [artikel 157, vierde tot en met zesde lid][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel157
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
  - number: '159.1'
    text: |-
      Bij de overeenkomst kan worden bedongen dat zij niet bij rechterlijke uitspraak zal kunnen worden gewijzigd op
      grond van een wijziging van omstandigheden. Een zodanig beding kan slechts schriftelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel159
  - number: '159.2'
    text: |-
      Het beding vervalt, indien de overeenkomst is aangegaan vóór de indiening van het verzoek tot echtscheiding, tenzij
      dit binnen drie maanden na de overeenkomst is ingediend. Het voorgaande is van overeenkomstige toepassing bij een
      gemeenschappelijk verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel159
  - number: '159.3'
    text: |-
      Ondanks een zodanig beding kan op verzoek van een der partijen de overeenkomst door de rechter bij de
      echtscheidingsbeschikking of bij latere beschikking worden gewijzigd op grond van een zo ingrijpende wijziging van
      omstandigheden, dat de verzoeker naar maatstaven van redelijkheid en billijkheid niet langer aan het beding mag
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel159
  - number: 159a
    text: |-
      Een overeenkomst als bedoeld in de [artikelen 158][ref1] en [159 van dit boek][ref2] staat niet in de weg aan
      verhaal op grond van [paragraaf 6.5 van de Participatiewet][ref3] en laat de vaststelling van het te verhalen
      bedrag onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel159
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Paragraaf6.5
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel159a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '158'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '159'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0015703
        paragraaf: '6.5'
  - number: '160'
    text: |-
      Een verplichting van een gewezen echtgenoot om uit hoofde van echtscheiding levensonderhoud te verschaffen aan de
      wederpartij, eindigt wanneer deze opnieuw in het huwelijk treedt, een geregistreerd partnerschap aangaat dan wel is
      gaan samenleven met een ander als waren zij gehuwd of als hadden zij hun partnerschap laten registreren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel160
  - number: '163.1'
    text: De echtscheiding komt tot stand door de inschrijving van de beschikking in de registers van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel163
  - number: '163.2'
    text: De inschrijving geschiedt op verzoek van partijen of van één van hen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel163
  - number: '163.3'
    text: |-
      Indien het verzoek tot inschrijving niet is gedaan uiterlijk zes maanden na de dag waarop de beschikking in kracht
      van gewijsde is gegaan, verliest de beschikking haar kracht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel163
  - number: '164.1'
    text: |-
      Indien een tussen de echtgenoten bestaande gemeenschap van goederen door één van hen is benadeeld doordat hij na de
      aanvang van het geding of binnen zes maanden daarvóór lichtvaardig schulden heeft gemaakt, goederen der gemeenschap
      heeft verspild, of rechtshandelingen als bedoeld in [artikel 88 van dit boek][ref1] zonder de vereiste toestemming
      of beslissing van de rechtbank heeft verricht, is hij gehouden na de inschrijving van de beschikking waarbij de
      echtscheiding is uitgesproken, de aangerichte schade aan de gemeenschap te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel88
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '88'
  - number: '164.2'
    text: |-
      Een op het vorige lid gegronde rechtsvordering kan niet later worden ingesteld dan drie jaren na de inschrijving
      van de beschikking.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel164
  - number: '165.1'
    text: |-
      Op verzoek van een echtgenoot kan de rechter bij de echtscheidingsbeschikking of bij latere uitspraak bepalen
      dat, als die echtgenoot ten tijde van de inschrijving van de beschikking een woning bewoont die aan de andere
      echtgenoot uitsluitend of mede toebehoort of ten gebruike toekomt, hij jegens de andere echtgenoot bevoegd is de
      bewoning en het gebruik van de bij de woning en tot de inboedel daarvan behorende zaken gedurende zes maanden na de
      inschrijving van de beschikking tegen een redelijke vergoeding voort te zetten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel165
  - number: '165.2'
    text: |-
      Tegen hem kan een in dat tijdvak zonder zijn toestemming door de andere echtgenoot verrichte rechtshandeling niet
      worden tegengeworpen ten nadele van zijn in het vorige lid omschreven bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel165
  - number: '165.3'
    text: |-
      Weigert hij zijn toestemming of is hij niet in staat zijn wil te verklaren, dan kan de rechtbank die in eerste
      aanleg over het verzoek tot echtscheiding heeft beslist, op verzoek van de andere gewezen echtgenoot, bepalen dat
      het vorige lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel165
  - number: '166'
    text: |-
      Indien de gescheiden echtgenoten met elkander hertrouwen of een geregistreerd partnerschap aangaan, herleven
      alle gevolgen van het huwelijk van rechtswege, alsof er geen echtscheiding had plaats gehad. Nochtans wordt
      de geldigheid van rechtshandelingen die tussen de ontbinding van het huwelijk en het nieuwe huwelijk of het
      geregistreerd partnerschap zijn verricht, beoordeeld naar het tijdstip der handeling.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel166
  - number: '169.1'
    text: Scheiding van tafel en bed kan worden verzocht op dezelfde grond en op dezelfde wijze als echtscheiding.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel169
  - number: '169.2'
    text: |-
      De [artikelen 151][ref1], [154 tot en met 159a][ref2] zijn van overeenkomstige toepassing, met dien verstande dat
      de termijnen, bedoeld in [artikel 157, derde tot en met zesde lid][ref3], aanvangen op de dag waarop de beschikking
      tot scheiding van tafel en bed is ingeschreven in het huwelijksgoederenregister, aangewezen in [artikel 116][ref4],
      en dat de duur van het huwelijk wordt berekend tot die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel154
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '151'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '154'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '169.3'
    text: |-
      Een verplichting van een echtgenoot om uit hoofde van scheiding van tafel en bed levensonderhoud te verschaffen aan
      de andere echtgenoot, eindigt bij ontbinding van het huwelijk.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel169
  - number: '173.1'
    text: |-
      De scheiding van tafel en bed komt tot stand door de inschrijving van de beschikking in het
      huwelijksgoederenregister, aangewezen in [artikel 116][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '173.2'
    text: De inschrijving geschiedt op verzoek van de echtgenoten of van één van hen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel173
  - number: '173.3'
    text: |-
      Indien het verzoek niet is gedaan uiterlijk zes maanden na de dag waarop de beschikking in kracht van gewijsde is
      gegaan, verliest de beschikking haar kracht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel173
  - number: '174.1'
    text: |-
      Indien een tussen de echtgenoten bestaande gemeenschap van goederen door één van hen is benadeeld doordat hij na de
      aanvang van het geding of binnen zes maanden daarvóór lichtvaardig schulden heeft gemaakt, goederen der gemeenschap
      heeft verspild, of rechtshandelingen als bedoeld in [artikel 88 van dit boek][ref1] zonder de vereiste toestemming
      of beslissing van de rechtbank heeft verricht, is hij gehouden, nadat de beschikking waarbij de scheiding van tafel
      en bed is uitgesproken, is ingeschreven, de aangerichte schade aan de gemeenschap te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel88
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '88'
  - number: '174.2'
    text: |-
      Een op het eerste lid gegronde rechtsvordering kan niet later worden ingesteld dan drie jaren na de inschrijving
      van de beschikking van scheiding van tafel en bed.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel174
  - number: '175.1'
    text: |-
      Op verzoek van een echtgenoot kan de rechter bij de beschikking houdende scheiding van tafel en bed of bij latere
      uitspraak bepalen dat, als die echtgenoot ten tijde van de inschrijving van de beschikking een woning bewoont die
      aan de andere echtgenoot uitsluitend of mede toebehoort of ten gebruike toekomt, hij jegens de andere echtgenoot
      bevoegd is de bewoning en het gebruik van de bij de woning en tot de inboedel daarvan behorende zaken gedurende zes
      maanden na de inschrijving van de beschikking, tegen een redelijke vergoeding voort te zetten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel175
  - number: '175.2'
    text: |-
      Tegen hem kan een in dat tijdvak zonder zijn toestemming door de andere echtgenoot verrichte rechtshandeling niet
      worden tegengeworpen ten nadele van zijn in het vorige lid omschreven bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel175
  - number: '175.3'
    text: |-
      Weigert hij zijn toestemming of is hij niet in staat zijn wil te verklaren, dan kan de rechtbank die in eerste
      aanleg over het verzoek tot scheiding van tafel en bed heeft beslist, op verzoek van de andere echtgenoot bepalen
      dat het vorige lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel175
  - number: '176.1'
    text: |-
      Een scheiding van tafel en bed eindigt door de verzoening van de echtgenoten, op het tijdstip dat zij op hun
      eensluidend verzoek in het huwelijksgoederenregister, aangewezen in [artikel 116][ref1], hebben doen inschrijven
      dat de scheiding heeft opgehouden te bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '176.2'
    text: |-
      De inschrijving doet alle gevolgen van het huwelijk van rechtswege herleven, alsof er geen scheiding van tafel en
      bed had plaatsgehad. Nochtans wordt de geldigheid van rechtshandelingen die tussen de scheiding van tafel en bed en
      de verzoening zijn verricht, beoordeeld naar het tijdstip van de handeling.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel176
  - number: '179.1'
    text: |-
      Ontbinding van het huwelijk van echtgenoten die van tafel en bed gescheiden zijn, wordt op verzoek van een der
      echtgenoten uitgesproken, indien de scheiding tenminste drie jaren heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel179
  - number: '179.2'
    text: |-
      De termijn van drie jaren kan op verzoek van een echtgenoot worden bekort tot ten minste een jaar, indien de andere
      echtgenoot zich gedurig schuldig maakt aan wangedrag in zodanige mate dat van de echtgenoot, die het verzoek heeft
      gedaan, niet kan worden gevergd het huwelijk te doen voortbestaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel179
  - number: '180.1'
    text: |-
      Indien als gevolg van de gevraagde ontbinding van het huwelijk een bestaand vooruitzicht op uitkeringen aan de
      andere echtgenoot na vooroverlijden van de echtgenoot die het verzoek heeft gedaan zou teloorgaan of in ernstige
      mate zou verminderen, en de andere echtgenoot deswege tegen het verzoek verweer voert, kan het verzoek niet worden
      toegewezen voordat daaromtrent een voorziening is getroffen die, gelet op de omstandigheden van het geval, ten
      opzichte van beide echtgenoten billijk is te achten. De rechter kan daartoe een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel180
  - number: '180.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel180
  - number: 180.2.a
    text: |-
      indien redelijkerwijs te verwachten is dat de andere echtgenoot zelf voor dat geval voldoende voorzieningen kan
      treffen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel180
  - number: 180.2.b
    text: |-
      indien de andere echtgenoot zich gedurig schuldig maakt aan wangedrag in zodanige mate dat van de echtgenoot die
      het verzoek heeft gedaan naar redelijkheid generlei verstrekking van levensonderhoud zou kunnen worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel180
  - number: '181'
    text: |-
      Ontbinding van het huwelijk van echtgenoten die van tafel en bed gescheiden zijn, wordt op hun gemeenschappelijk
      verzoek uitgesproken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel181
  - number: '182'
    text: |-
      De [artikelen 154, tweede lid][ref1], en [157 tot en met 160 van dit boek][ref2] zijn van overeenkomstige
      toepassing, met dien verstande dat de in [artikel 157, derde tot en met zesde lid][ref3], bedoelde termijnen worden
      verminderd met de tijd gedurende welke tijdens de scheiding van tafel en bed een verplichting tot levensonderhoud
      jegens de andere echtgenoot bestond en dat de duur van het huwelijk wordt berekend tot de dag waarop de beschikking
      tot scheiding van tafel en bed is ingeschreven in het huwelijksgoederenregister, aangewezen in [artikel 116][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '154'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '183.1'
    text: |-
      De ontbinding van het huwelijk komt tot stand door de inschrijving van de beschikking in de registers van de
      burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel183
  - number: '183.2'
    text: |-
      De [artikelen 163, tweede en derde lid][ref1], en [166 van dit boek][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel166
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '163'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '166'
        afdeling: '2'
  - number: '197'
    text: Een kind, zijn ouders en hun bloedverwanten staan in familierechtelijke betrekking tot elkaar.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel197
  - number: '198.1'
    text: 'Moeder van een kind is de vrouw:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel198
  - number: 198.1.a
    text: uit wie het kind is geboren;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel198
  - number: 198.1.b
    text: |-
      die op het tijdstip van de geboorte van het kind is gehuwd of door een geregistreerd partnerschap is verbonden met
      de vrouw uit wie het kind is geboren, indien dit kind is verwekt door kunstmatige donorbevruchting als bedoeld in
      [artikel 1, onder c, sub 1, van de Wet donorgegevens kunstmatige bevruchting][ref1] en een door de stichting,
      bedoeld in die wet, ter bevestiging hiervan afgegeven verklaring is overgelegd, waaruit blijkt dat de identiteit
      van de donor aan de vrouw bij wie de kunstmatige donorbevruchting heeft plaatsgevonden onbekend is, tenzij de
      laatste zin van dit onderdeel of de eerste zin van [artikel 199, onder b][ref2], geldt. De verklaring dient bij
      de aangifte van de geboorte te worden overgelegd aan de ambtenaar van de burgerlijke stand en werkt terug tot aan
      de geboorte van het kind. Indien het huwelijk of geregistreerd partnerschap na de kunstmatige donorbevruchting en
      voor de geboorte van het kind is ontbonden door de dood van de echtgenote of geregistreerde partner van de vrouw
      uit wie het kind is geboren, is de overleden echtgenote of geregistreerde partner eveneens moeder van het kind als
      de voornoemde verklaring wordt overgelegd bij de aangifte van de geboorte van het kind, zelfs indien de vrouw uit
      wie het kind is geboren was hertrouwd of een nieuw partnerschap had laten registreren;


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '199'
        afdeling: '1'
  - number: 198.1.c
    text: die het kind heeft erkend;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel198
  - number: 198.1.d
    text: wier ouderschap gerechtelijk is vastgesteld; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel198
  - number: 198.1.e
    text: die het kind heeft geadopteerd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel198
  - number: '198.2'
    text: |-
      De vrouw uit wie het kind is geboren kan, indien zij op het tijdstip van de kunstmatige donorbevruchting was
      gescheiden van tafel en bed of zij en haar echtgenote of geregistreerde partner sedert dat tijdstip gescheiden
      hebben geleefd, binnen een jaar na de geboorte van het kind ten overstaan van de ambtenaar van de burgerlijke stand
      verklaren dat haar overleden echtgenote of geregistreerde partner niet de moeder is van het kind, bedoeld in het
      eerste lid, onder b, van welke verklaring een akte wordt opgemaakt; was de vrouw uit wie het kind is geboren op
      het tijdstip van de geboorte hertrouwd of had zij een nieuw partnerschap laten registreren dan is in dat geval de
      huidige echtgenoot of geregistreerd partner de ouder van het kind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel198
  - number: '199'
    text: 'Vader van een kind is de man:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel199
  - number: 199.a
    text: |-
      die op het tijdstip van de geboorte van het kind met de vrouw uit wie het kind is geboren, is
      gehuwd of een geregistreerd partnerschap is aangegaan, tenzij onderdeel b of de slotzin van
      [artikel 198, eerste lid, onder b][ref1], geldt;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
        afdeling: '1'
  - number: 199.b
    text: |-
      wiens huwelijk of geregistreerd partnerschap met de vrouw uit wie het kind is geboren, binnen 306 dagen voor de
      geboorte van het kind door zijn dood is ontbonden, zelfs indien de moeder was hertrouwd of een nieuw partnerschap
      had laten registreren; indien echter de vrouw sedert de 306de dag voor de geboorte van het kind was gescheiden van
      tafel en bed of zij en haar echtgenoot of geregistreerde partner sedert dat tijdstip gescheiden hebben geleefd,
      kan de vrouw binnen een jaar na de geboorte van het kind ten overstaan van de ambtenaar van de burgerlijke
      stand verklaren dat haar overleden echtgenoot of geregistreerde partner niet de vader is van het kind, van welke
      verklaring een akte wordt opgemaakt; was de moeder op het tijdstip van de geboorte hertrouwd of had zij een nieuw
      partnerschap laten registreren dan is in dat geval de huidige echtgenoot of geregistreerde partner de vader of, in
      het geval, genoemd in [artikel 198, eerste lid, onder b][ref1], de huidige echtgenote of geregistreerde partner
      de moeder van het kind;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
        afdeling: '1'
  - number: 199.c
    text: die het kind heeft erkend;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel199
  - number: 199.d
    text: wiens vaderschap gerechtelijk is vastgesteld; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel199
  - number: 199.e
    text: die het kind heeft geadopteerd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel199
  - number: '200.1'
    text: |-
      Het in [artikel 199, onder a en b][ref1], bedoelde vaderschap kan, op de grond dat de man niet de biologische vader
      van het kind is, worden ontkend:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '199'
        afdeling: '1'
  - number: 200.1.a
    text: door de vader of de moeder van het kind;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel200
  - number: 200.1.b
    text: door het kind zelf.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel200
  - number: '200.2'
    text: |-
      De vader of moeder kan het in [artikel 199, onder a en b][ref1], bedoelde vaderschap niet ontkennen, indien de man
      vóór het huwelijk of geregistreerd partnerschap heeft kennis gedragen van de zwangerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '199'
        afdeling: '1'
  - number: '200.3'
    text: |-
      De vader of moeder kan het in [artikel 199, onder a en b][ref1], bedoelde vaderschap evenmin ontkennen, indien de
      man heeft ingestemd met een daad die de verwekking van het kind tot gevolg kan hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '199'
        afdeling: '1'
  - number: '200.4'
    text: |-
      Het tweede en derde lid zijn niet van toepassing ten aanzien van de vader, indien de moeder hem heeft bedrogen
      omtrent de verwekker.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel200
  - number: '200.5'
    text: |-
      Het verzoek tot gegrondverklaring van de ontkenning wordt door de moeder bij de rechtbank ingediend binnen een jaar
      na de geboorte van het kind. Een zodanig verzoek wordt door de vader ingediend binnen een jaar nadat hij bekend is
      geworden met het feit dat hij vermoedelijk niet de biologische vader is van het kind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel200
  - number: '200.6'
    text: |-
      Het verzoek tot gegrondverklaring van de ontkenning wordt door het kind bij de rechtbank ingediend binnen drie
      jaren nadat het kind bekend is geworden met het feit dat de man vermoedelijk niet zijn biologische vader is. Indien
      het kind evenwel gedurende zijn minderjarigheid bekend is geworden met dit feit, kan het verzoek tot uiterlijk drie
      jaren nadat het kind meerderjarig is geworden, worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel200
  - number: '201.1'
    text: |-
      Overlijdt de vader of de moeder voor de afloop van de in [artikel 200, vijfde lid][ref1], gestelde termijn, dan
      kan een afstammeling van deze echtgenoot of geregistreerde partner in de eerste graad of, bij gebreke van zodanige
      afstammeling, een ouder van deze echtgenoot of geregistreerde partner, de rechtbank verzoeken de ontkenning van
      het vaderschap gegrond te verklaren. Het verzoek wordt gedaan binnen een jaar na de dag van overlijden of nadat het
      overlijden ter kennis van de verzoeker is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel200
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '200'
        afdeling: '2'
  - number: '201.2'
    text: |-
      Overlijdt het kind voor de afloop van de in [artikel 200, zesde lid][ref1], gestelde termijn, dan kan een
      afstammeling in de eerste graad van het kind de rechtbank verzoeken de ontkenning van het vaderschap gegrond te
      verklaren. Indien het kind meerderjarig was ten tijde van het overlijden, wordt het verzoek gedaan binnen een jaar
      na de dag van overlijden of binnen een jaar nadat het overlijden ter kennis van de verzoeker is gekomen. Overleed
      het kind gedurende de minderjarigheid, dan dient het verzoek te worden gedaan binnen een jaar nadat het kind, in
      leven zijnde, zelfstandig het verzoek had kunnen doen, dan wel, indien het overlijden op een later tijdstip ter
      kennis is gekomen van de verzoeker binnen een jaar na die kennisneming.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel200
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '200'
        afdeling: '2'
  - number: '202.1'
    text: |-
      Nadat de beschikking houdende gegrondverklaring van een ontkenning van een door huwelijk of geregistreerd
      partnerschap ontstaan vaderschap in kracht van gewijsde is gegaan, wordt het door huwelijk of geregistreerd
      partnerschap ontstane vaderschap geacht nimmer gevolg te hebben gehad.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202
  - number: '202.2'
    text: Te goeder trouw door derden verkregen rechten worden hierdoor nochtans niet geschaad.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202
  - number: '202.3'
    text: |-
      Door de gegrondverklaring van de ontkenning ontstaat geen vordering tot teruggave van kosten van verzorging en
      opvoeding of van kosten van levensonderhoud en studie noch tot teruggave van het krachtens vruchtgenot genotene.
      Voorts ontstaat geen verplichting tot teruggave van genoten vermogensrechtelijke voordelen, voor zover degene die
      hen heeft genoten ten tijde van het doen van het verzoek daardoor niet was gebaat.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202
  - number: 202a.1
    text: |-
      Het in [artikel 198, eerste lid, onder b][ref1], bedoelde moederschap kan, op de grond dat de moeder niet de
      biologische moeder van het kind is, worden ontkend:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
        afdeling: '1'
  - number: 202a.1.a
    text: |-
      door de moeder, bedoeld in [artikel 198, eerste lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
        afdeling: '1'
  - number: 202a.1.b
    text: |-
      door de moeder, bedoeld in [artikel 198, eerste lid, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
        afdeling: '1'
  - number: 202a.1.c
    text: door het kind zelf.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202a
  - number: 202a.2
    text: |-
      De moeder, bedoeld in [artikel 198, eerste lid, onder a of onder b][ref1], kan het in artikel 198, eerste lid,
      onder b, bedoelde moederschap niet ontkennen, indien de moeder, bedoeld in het eerste lid, onder b, vóór het
      huwelijk of geregistreerd partnerschap heeft kennis gedragen van de zwangerschap of heeft ingestemd met de
      kunstmatige donorbevruchting, bedoeld in artikel 198, eerste lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
        afdeling: '1'
  - number: 202a.3
    text: |-
      Het verzoek tot gegrondverklaring van de ontkenning wordt door de moeder, bedoeld in
      [artikel 198, eerste lid, onder a of onder b][ref1], bij de rechtbank ingediend binnen een jaar na de geboorte van
      het kind.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
        afdeling: '1'
  - number: 202a.4
    text: |-
      Het verzoek tot gegrondverklaring van de ontkenning wordt door het kind bij de rechtbank ingediend uiterlijk binnen
      drie jaren nadat het kind meerderjarig is geworden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202a
  - number: 202b.1
    text: |-
      Overlijdt de moeder, bedoeld in [artikel 198, eerste lid, onder a of onder b][ref1], voor de afloop van de in
      [artikel 202a, derde lid][ref2], gestelde termijn, dan kan een afstammeling van deze moeder in de eerste graad
      of, bij gebreke van zodanige afstammeling, een ouder van deze moeder, de rechtbank verzoeken de ontkenning van het
      moederschap gegrond te verklaren. Het verzoek wordt gedaan binnen een jaar na de dag van overlijden of nadat het
      overlijden ter kennis van verzoeker is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel202a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '198'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 202a
        afdeling: 2a
  - number: 202b.2
    text: |-
      Op de ontkenning van het moederschap zijn de [artikelen 201, tweede lid][ref1], en [202][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel201
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel202
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel202b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '201'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '202'
        afdeling: '2'
  - number: '203.1'
    text: 'Erkenning kan geschieden:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel203
  - number: 203.1.a
    text: bij een akte van erkenning, opgemaakt door een ambtenaar van de burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel203
  - number: 203.1.b
    text: bij notariële akte.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel203
  - number: '203.2'
    text: De erkenning heeft gevolg vanaf het tijdstip waarop zij is gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel203
  - number: '204.1'
    text: 'De erkenning is nietig, indien zij is gedaan:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
  - number: 204.1.a
    text: |-
      door een persoon die krachtens [artikel 41][ref1] geen huwelijk met de moeder mag sluiten of krachtens artikel 80a,
      zesde lid, geen geregistreerd partnerschap met de moeder mag aangaan;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel41
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
  - number: 204.1.b
    text: door een minderjarige die de leeftijd van zestien jaren nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
  - number: 204.1.c
    text: |-
      indien het kind de leeftijd van zestien jaar nog niet heeft bereikt, zonder voorafgaande schriftelijke toestemming
      van de moeder of de vader;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
  - number: 204.1.d
    text: zonder voorafgaande schriftelijke toestemming van het kind van twaalf jaren of ouder;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
  - number: 204.1.e
    text: terwijl er twee ouders zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
  - number: '204.2'
    text: |-
      De in het vorige lid onder c en d vereiste toestemming kan ook geschieden ter gelegenheid van het opmaken van de
      akte van erkenning.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
  - number: '204.3'
    text: |-
      De toestemming van de moeder wier kind de leeftijd van zestien jaren nog niet heeft bereikt, dan wel de toestemming
      van het kind van twaalf jaren of ouder, kan op verzoek van de persoon die het kind wil erkennen, door de
      toestemming van de rechtbank worden vervangen, tenzij dit de belangen van de moeder bij een ongestoorde verhouding
      met het kind schaadt of een evenwichtige sociaalpsychologische en emotionele ontwikkeling van het kind in het
      gedrang komt, mits deze persoon:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
  - number: 204.3.a
    text: de verwekker van het kind is; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
  - number: 204.3.b
    text: |-
      de biologische vader van het kind, die niet de verwekker is en in een nauwe persoonlijke betrekking staat tot het
      kind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
  - number: '204.4'
    text: |-
      De toestemming van de moeder wier kind de leeftijd van zestien jaren nog niet heeft bereikt, dan wel de toestemming
      van het kind van twaalf jaren of ouder, kan op verzoek van de persoon die als levensgezel van de moeder ingestemd
      heeft met een daad die de verwekking van het kind tot gevolg kan hebben gehad, door de toestemming van de rechtbank
      worden vervangen als dit in het belang is van het kind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
  - number: '204.5'
    text: |-
      Een persoon die wegens zijn lichamelijke of geestelijke toestand onder curatele staat, mag slechts erkennen nadat
      daartoe toestemming is verkregen van de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel204
  - number: '205.1'
    text: |-
      Een verzoek tot vernietiging van de erkenning kan, op de grond dat de erkenner niet de biologische vader van het
      kind is, bij de rechtbank worden ingediend:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205
  - number: 205.1.a
    text: door het kind zelf, tenzij de erkenning tijdens zijn meerderjarigheid heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205
  - number: 205.1.b
    text: |-
      door de erkenner, indien hij door bedreiging, dwaling, bedrog of, tijdens zijn minderjarigheid, door misbruik van
      omstandigheden daartoe is bewogen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205
  - number: 205.1.c
    text: |-
      door de moeder, indien zij door bedreiging, dwaling, bedrog, of tijdens haar minderjarigheid, door misbruik van
      omstandigheden bewogen is toestemming tot de erkenning te geven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205
  - number: '205.2'
    text: |-
      Het openbaar ministerie kan wegens strijd met de Nederlandse openbare orde, indien de erkenner niet de biologische
      vader van het kind is, vernietiging van de erkenning verzoeken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205
  - number: '205.3'
    text: |-
      In geval van bedreiging of misbruik van omstandigheden, wordt het verzoek door de erkenner of door de moeder niet
      later ingediend dan een jaar nadat deze invloed heeft opgehouden te werken en, in geval van bedrog of dwaling,
      binnen een jaar nadat de verzoeker het bedrog of de dwaling heeft ontdekt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205
  - number: '205.4'
    text: |-
      Het verzoek wordt door het kind ingediend binnen drie jaren nadat het kind bekend is geworden met het feit dat
      de man vermoedelijk niet zijn biologische vader is. Indien het kind evenwel gedurende zijn minderjarigheid bekend
      is geworden met dit feit kan het verzoek tot uiterlijk drie jaren nadat het kind meerderjarig is geworden, worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205
  - number: '205.5'
    text: |-
      Voor het geval de erkenner of de moeder overlijdt voor de afloop van de in het derde lid gestelde termijn, is
      [artikel 201, eerste lid][ref1], van overeenkomstige toepassing. Voor het geval het kind overlijdt voor de afloop
      van de in het vierde lid gestelde termijn, is [artikel 201, tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel201
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel201
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '201'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '201'
        afdeling: '2'
  - number: 205a.1
    text: |-
      Een verzoek tot vernietiging van de door de moeder gedane erkenning kan, op de grond dat de moeder niet de
      biologische moeder van het kind is, bij de rechtbank worden ingediend:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205a
  - number: 205a.1.a
    text: door het kind zelf, tenzij de erkenning tijdens zijn meerderjarigheid heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205a
  - number: 205a.1.b
    text: |-
      door de erkenner, indien zij door bedreiging, dwaling, bedrog of, tijdens haar minderjarigheid, door misbruik van
      omstandigheden daartoe is bewogen;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205a
  - number: 205a.1.c
    text: |-
      door de andere moeder, indien zij door bedreiging, dwaling, bedrog of, tijdens haar minderjarigheid, door misbruik
      van omstandigheden bewogen is toestemming tot de erkenning te geven.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205a
  - number: 205a.2
    text: |-
      Op de vernietiging van de erkenning is [artikel 205, tweede tot en met vijfde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel205
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel205a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '205'
        afdeling: '3'
  - number: '206.1'
    text: |-
      Nadat de beschikking houdende vernietiging van de erkenning in kracht van gewijsde is gegaan, wordt de erkenning
      geacht nimmer gevolg te hebben gehad.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel206
  - number: '206.2'
    text: Te goeder trouw door derden verkregen rechten worden hierdoor nochtans niet geschaad.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel206
  - number: '206.3'
    text: |-
      Door de vernietiging ontstaat geen vordering tot teruggave van de kosten van verzorging en opvoeding of van
      levensonderhoud en studie noch tot teruggave van het krachtens vruchtgenot genotene. Voorts ontstaat geen
      verplichting tot teruggave van genoten vermogensrechtelijke voordelen die uit de erkenning zijn voortgevloeid, voor
      zover degene die hen heeft genoten ten tijde van het instellen van het verzoek daardoor niet was gebaat.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel206
  - number: '207.1'
    text: |-
      Het ouderschap van een persoon kan, ook indien deze is overleden, op de grond dat deze de verwekker is van het kind
      of op de grond dat deze als levensgezel van de moeder ingestemd heeft met een daad die de verwekking van het kind
      tot gevolg kan hebben gehad, door de rechtbank worden vastgesteld op verzoek van:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel207
  - number: 207.1.a
    text: de moeder, tenzij het kind de leeftijd van zestien jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel207
  - number: 207.1.b
    text: het kind.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel207
  - number: '207.2'
    text: 'Vaststelling van het ouderschap kan niet geschieden, indien:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel207
  - number: 207.2.a
    text: het kind twee ouders heeft;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel207
  - number: 207.2.b
    text: |-
      tussen de in de aanhef van het eerste lid bedoelde persoon en de moeder van het kind krachtens [artikel 41][ref1]
      geen huwelijk zou mogen worden gesloten of krachtens [artikel 80a, zesde lid][ref2], geen partnerschap zou mogen
      worden geregistreerd;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel80a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 80a
  - number: 207.2.c
    text: |-
      de in de aanhef van het eerste lid bedoelde persoon een minderjarige is die de leeftijd van zestien jaren nog niet
      heeft bereikt, tenzij hij voordat hij deze leeftijd heeft bereikt is overleden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel207
  - number: '207.3'
    text: |-
      Het verzoek wordt door de moeder ingediend binnen vijf jaren na de geboorte van het kind of, in geval van
      onbekendheid met de identiteit van de vermoedelijke verwekker dan wel van onbekendheid met zijn verblijfplaats,
      binnen vijf jaren na de dag waarop de identiteit en de verblijfplaats aan de moeder bekend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel207
  - number: '207.4'
    text: |-
      Overlijdt het kind voordat vaststelling van het ouderschap heeft kunnen plaatsvinden, dan kan een afstammeling van
      het kind in de eerste graad de vaststelling van het ouderschap aan de rechtbank verzoeken, mits de in de aanhef van
      het eerste lid bedoelde persoon, nog in leven is. Het verzoek wordt gedaan binnen een jaar na de dag van overlijden
      of binnen een jaar nadat het overlijden ter kennis van de verzoeker is gekomen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel207
  - number: '207.5'
    text: |-
      De vaststelling van het ouderschap, mits de beschikking daartoe in kracht van gewijsde is gegaan, werkt terug tot
      het moment van de geboorte van het kind. Te goeder trouw door derden verkregen rechten worden hierdoor nochtans
      niet geschaad. Voorts ontstaat geen verplichting tot teruggave van vermogensrechtelijke voordelen, voor zover
      degene die hen heeft genoten ten tijde van het doen van het verzoek daardoor niet was gebaat.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel207
  - number: '208'
    text: |-
      Bij de uitspraak waarbij het ouderschap wordt vastgesteld, kan de rechter op een daartoe strekkend verzoek
      ten behoeve van het kind een bijdrage toekennen in de kosten van verzorging en opvoeding als bedoeld in
      [artikel 404][ref1] of in de kosten van levensonderhoud en studie als bedoeld in [artikel 395a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel404
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '404'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 395a
        afdeling: '1'
  - number: '209'
    text: |-
      Iemands afstamming volgens zijn geboorteakte kan door een ander niet worden betwist, indien hij een staat
      overeenkomstig die akte heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel209
  - number: '210'
    text: Een verzoek tot gegrondverklaring van de inroeping of betwisting van staat is niet aan verjaring onderworpen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel210
  - number: '211.1'
    text: 'Een verzoek tot gegrondverklaring van de inroeping van staat kan worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel211
  - number: 211.1.a
    text: door het kind zelf;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel211
  - number: 211.1.b
    text: |-
      door de erfgenamen van het kind, indien het kind gedurende zijn minderjarigheid of binnen drie jaren nadien is
      overleden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel211
  - number: '211.2'
    text: |-
      Indien het kind een verzoek als bedoeld in het eerste lid had ingediend, kunnen zijn erfgenamen de procedure
      voortzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel211
  - number: '212'
    text: |-
      In zaken van afstamming wordt het minderjarige kind, optredende als verzoeker of belanghebbende, vertegenwoordigd
      door een bijzondere curator daartoe benoemd door de rechtbank die over de zaak beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel212
  - number: '227.1'
    text: |-
      Adoptie geschiedt door een uitspraak van de rechtbank op verzoek van twee personen tezamen of op verzoek
      van één persoon alleen. Twee personen tezamen kunnen geen verzoek tot adoptie doen, indien zij krachtens
      [artikel 41][ref1] geen huwelijk zouden mogen aangaan of krachtens [artikel 80a, zesde lid][ref2], geen
      partnerschap zouden mogen aangaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel80a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 80a
  - number: '227.2'
    text: |-
      Het verzoek door twee personen tezamen kan slechts worden gedaan, indien zij ten minste drie aaneengesloten jaren
      onmiddellijk voorafgaande aan de indiening van het verzoek met elkaar hebben samengeleefd. Het verzoek door de
      adoptant die echtgenoot, geregistreerde partner of andere levensgezel van de ouder is, kan slechts worden gedaan,
      indien hij ten minste drie aaneengesloten jaren onmiddellijk voorafgaande aan de indiening van het verzoek met die
      ouder heeft samengeleefd. De in de tweede zin bedoelde voorwaarde geldt evenwel niet indien het kind is of wordt
      geboren binnen de relatie van de adoptant en die ouder.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel227
  - number: '227.3'
    text: |-
      Het verzoek kan alleen worden toegewezen, indien de adoptie in het kennelijk belang van het kind is, op het
      tijdstip van het verzoek tot adoptie vaststaat en voor de toekomst redelijkerwijs te voorzien is dat het kind niets
      meer van zijn ouder of ouders in de hoedanigheid van ouder te verwachten heeft, en aan de voorwaarden, genoemd in
      [artikel 228][ref1], wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel228
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '228'
  - number: '227.4'
    text: |-
      Indien het kind is of wordt geboren binnen de relatie van de adoptant en de ouder,
      en het kind door en tengevolge van kunstmatige donorbevruchting als bedoeld in
      [artikel 1, onder c, van de Wet donorgegevens kunstmatige bevruchting][ref1] is verwekt en een door de stichting,
      bedoeld in [die wet][ref2], ter bevestiging hiervan afgegeven verklaring wordt overgelegd waaruit blijkt dat de
      identiteit van de donor aan de vrouw bij wie de kunstmatige donorbevruchting heeft plaatsgevonden onbekend is,
      wordt het verzoek toegewezen, tenzij de adoptie kennelijk niet in het belang van het kind is of niet is voldaan aan
      de voorwaarden, genoemd in [artikel 228][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013642#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013642
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel228
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0013642
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013642
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '228'
  - number: '227.5'
    text: |-
      Zijn de voornamen van het kind niet bekend, dan stelt de rechter, nadat hij de adoptant of adoptanten en het kind,
      indien dat twaalf jaren of ouder is, heeft gehoord, bij de adoptiebeschikking tevens een of meer voornamen vast.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel227
  - number: '227.6'
    text: In zaken van adoptie is de minderjarige ouder bekwaam in rechte op te treden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel227
  - number: '228.1'
    text: 'Voorwaarden voor adoptie zijn:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: 228.1.a
    text: |-
      dat het kind op de dag van het eerste verzoek minderjarig is, en dat het kind, indien het op de dag van het verzoek
      twaalf jaren of ouder is, ter gelegenheid van zijn verhoor niet van bezwaren tegen toewijzing van het verzoek heeft
      doen blijken; hetzelfde geldt, indien de rechter is gebleken van bezwaren tegen toewijzing van het verzoek van een
      minderjarige die op de dag van het verzoek de leeftijd van twaalf jaren nog niet heeft bereikt, maar in staat kan
      worden geacht tot een redelijke waardering van zijn belangen ter zake;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: 228.1.b
    text: dat het kind niet is een kleinkind van een adoptant;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: 228.1.c
    text: dat de adoptant of ieder der adoptanten ten minste achttien jaren ouder dan het kind is;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: 228.1.d
    text: dat geen der ouders het verzoek tegenspreekt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: 228.1.e
    text: dat de minderjarige moeder van het kind op de dag van het verzoek de leeftijd van zestien jaren heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: 228.1.f
    text: |-
      dat de adoptant of de adoptanten het kind gedurende ten minste een jaar heeft of hebben verzorgd en opgevoed;
      indien de echtgenoot, geregistreerde partner of andere levensgezel van de ouder of adoptiefouder het kind adopteert
      en zij gezamenlijk het kind gedurende ten minste een jaar hebben verzorgd en opgevoed wordt de periode van een
      jaar voor de echtgenoot, geregistreerde partner of andere levensgezel gerekend vanaf het moment van feitelijk
      gezamenlijk verzorgen en opvoeden;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: 228.1.g
    text: |-
      dat de ouder of ouders niet of niet langer het gezag over het kind hebben. Indien evenwel de echtgenoot,
      geregistreerde partner of andere levensgezel van de ouder het kind adopteert, geldt dat deze ouder alleen of samen
      met voornoemde echtgenoot, geregistreerde partner of andere levensgezel het gezag heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: '228.2'
    text: 'Aan de tegenspraak van een ouder als bedoeld in het eerste lid, onder d, kan worden voorbijgegaan:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: 228.2.a
    text: indien het kind en de ouder niet of nauwelijks in gezinsverband hebben samengeleefd; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: 228.2.b
    text: |-
      indien de ouder het gezag over het kind heeft misbruikt of de verzorging en opvoeding van het kind op grove wijze
      heeft verwaarloosd; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: 228.2.c
    text: |-
      indien de ouder onherroepelijk is veroordeeld wegens het plegen tegen de minderjarige
      van een van de misdrijven, omschreven in de [titels XIII tot en met XV][ref1] en
      [XVIII tot en met XX van het tweede boek van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
  - number: '228.3'
    text: |-
      De voorwaarde, bedoeld in het eerste lid, onder f, geldt niet indien het kind wordt geboren binnen de relatie van
      de moeder met een levensgezel van gelijk geslacht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel228
  - number: '229.1'
    text: |-
      Door adoptie komen de geadopteerde, de adoptiefouder en zijn bloedverwanten of de adoptiefouders en hun
      bloedverwanten in familierechtelijke betrekking tot elkaar te staan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel229
  - number: '229.2'
    text: |-
      Tegelijkertijd houdt de familierechtelijke betrekking tussen de geadopteerde, zijn oorspronkelijke ouders en hun
      bloedverwanten op te bestaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel229
  - number: '229.3'
    text: |-
      In afwijking van het tweede lid blijft de familierechtelijke betrekking tussen de geadopteerde en zijn ouder en
      diens bloedverwanten bestaan, indien de echtgenoot, geregistreerde partner of andere levensgezel van die ouder het
      kind adopteert.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel229
  - number: '229.4'
    text: |-
      De adoptiefouders die niet met elkaar zijn gehuwd of door een geregistreerd partnerschap zijn verbonden oefenen
      door adoptie het gezag over de geadopteerde gezamenlijk uit.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel229
  - number: '229.5'
    text: |-
      Indien het kind op het tijdstip van de adoptie omgang heeft met een ouder ten aanzien van wie de familierechtelijke
      betrekking ophoudt te bestaan, kan de rechtbank bepalen dat zij gerechtigd blijven tot omgang met elkaar. De
      [artikelen 377a, tweede en derde lid][ref1], [377e][ref2] en [377g][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel377g
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377a
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 377e
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 377g
  - number: '230.1'
    text: De adoptie heeft haar gevolgen van de dag, waarop de uitspraak in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel230
  - number: '230.2'
    text: |-
      Indien het kind is geboren binnen de relatie van de ouder en de adoptant en de adoptie voor de geboorte van het
      kind is verzocht, werkt deze terug tot het tijdstip van geboorte van het kind; indien de adoptie uiterlijk zes
      maanden na de geboorte van het kind is verzocht, werkt deze terug tot het tijdstip van indiening van het verzoek.
      Het bepaalde in de eerste volzin is niet van toepassing indien voor de adoptie familierechtelijke betrekkingen
      waren gevestigd tussen het kind en een andere ouder en deze door de adoptie zijn verbroken. De adoptie kan in
      het geval, bedoeld in de eerste volzin, ook worden uitgesproken indien de adoptant na indiening van het verzoek
      is overleden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel230
  - number: '230.3'
    text: |-
      De adoptie blijft haar gevolgen behouden, ook al zou blijken, dat de rechter de door
      [artikel 228 van dit boek][ref1] gestelde voorwaarden ten onrechte als vervuld zou hebben aangenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel228
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '228'
  - number: '231.1'
    text: De adoptie kan door een uitspraak van de rechtbank op verzoek van de geadopteerde worden herroepen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel231
  - number: '231.2'
    text: |-
      Het verzoek kan alleen worden toegewezen, indien de herroeping in het kennelijk belang van de geadopteerde is, de
      rechter van de redelijkheid der herroeping in gemoede overtuigd is, en het verzoek is ingediend niet eerder dan
      twee jaren en niet later dan vijf jaren na de dag, waarop de geadopteerde meerderjarig is geworden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel231
  - number: '232.1'
    text: |-
      Door herroeping van de adoptie houdt de familierechtelijke betrekking tussen de geadopteerde en zijn kinderen
      enerzijds en de adoptiefouder of adoptiefouders en zijn bloedverwanten anderzijds op te bestaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel232
  - number: '232.2'
    text: De familierechtelijke betrekking die door de adoptie opgehouden had te bestaan, herleeft door de herroeping.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel232
  - number: '232.3'
    text: |-
      [Artikel 230][ref1] vindt ten aanzien van de herroeping overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel230
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '230'
  - number: '233'
    text: |-
      Minderjarigen zijn zij die de leeftijd van achttien jaren niet hebben bereikt en evenmin met toepassing van
      [artikel 253ha][ref1] meerderjarig zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253ha
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253ha
        paragraaf: 2a
        afdeling: '2'
  - number: '234.1'
    text: |-
      Een minderjarige is, mits hij met toestemming van zijn wettelijke vertegenwoordiger handelt, bekwaam
      rechtshandelingen te verrichten, voor zover de wet niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel234
  - number: '234.2'
    text: De toestemming kan slechts worden verleend voor een bepaalde rechtshandeling of voor een bepaald doel.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel234
  - number: '234.3'
    text: |-
      De toestemming wordt aan de minderjarige verondersteld te zijn verleend, indien het een rechtshandeling betreft ten
      aanzien waarvan in het maatschappelijk verkeer gebruikelijk is dat minderjarigen van zijn leeftijd deze zelfstandig
      verrichten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel234
  - number: '235.1'
    text: |-
      Handlichting waarbij aan een minderjarige bepaalde bevoegdheden van een meerderjarige worden toegekend, kan wanneer
      de minderjarige de leeftijd van zestien jaren heeft bereikt, op zijn verzoek door de kantonrechter worden verleend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel235
  - number: '235.2'
    text: |-
      Zij wordt niet verleend tegen de wil van de ouders voor zover deze het gezag over de minderjarige uitoefenen, met
      inachtneming nochtans van [artikel 253a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: '235.3'
    text: |-
      Bij het verlenen van handlichting bepaalt de kantonrechter uitdrukkelijk, welke bevoegdheden van een meerderjarige
      aan de minderjarige worden toegekend. Deze bevoegdheden mogen zich niet verder uitstrekken dan tot de gedeeltelijke
      of de gehele ontvangst van zijn inkomsten en de beschikking daarover, het sluiten van verhuringen en verpachtingen,
      het in een vennootschap deelnemen en het uitoefenen van een beroep of bedrijf. De minderjarige wordt echter
      door handlichting niet bekwaam tot het beschikken over registergoederen, effecten, of door hypotheek gedekte
      vorderingen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel235
  - number: '235.4'
    text: |-
      Hij kan ter zake van de handlichting zelf en van handelingen, waartoe hij krachtens de verkregen handlichting
      bekwaam is, eisende of verwerende in rechte optreden. [Artikel 12 lid 1 van dit boek][ref1] geldt voor die
      handelingen niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel12
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '12'
  - number: '236.1'
    text: |-
      Een verleende handlichting kan door de kantonrechter worden ingetrokken, indien de minderjarige daarvan misbruik
      maakt of er gegronde vrees bestaat dat hij dit zal doen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel236
  - number: '236.2'
    text: |-
      De intrekking geschiedt op verzoek van een van de ouders van de minderjarige, voor zover deze het gezag over hem
      uitoefenen en met inachtneming van [artikel 253a, eerste lid][ref1], of op verzoek van de voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: '237.1'
    text: |-
      Een beschikking waarbij handlichting is verleend of ingetrokken, moet worden bekend gemaakt in de Staatscourant en
      in twee in de beschikking aan te wijzen dagbladen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel237
  - number: '237.2'
    text: |-
      In de bekendmaking moet nauwkeurig worden vermeld hoedanig, en tot welk einde zij is verleend. Vóór de bekendmaking
      werkt zomin de handlichting als haar intrekking tegen derden die hiervan onkundig waren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel237
  - number: '238.1'
    text: Er is één raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel238
  - number: '238.2'
    text: |-
      De wet bepaalt de taken en bevoegdheden van de raad voor de kinderbescherming. Deze worden door de raad voor de
      kinderbescherming namens onze Minister van Justitie uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel238
  - number: '238.3'
    text: |-
      Ten behoeve van de vervulling van zijn taak houdt de raad zich in ieder geval op de hoogte van de ontwikkeling van
      de kinderbescherming, bevordert hij de samenwerking met de instellingen van kinderbescherming en jeugdhulpverlening
      en dient hij op verzoek of uit eigen beweging autoriteiten en instellingen van advies.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel238
  - number: '238.4'
    text: |-
      Zijn bemoeiingen laten de godsdienstige of levensbeschouwelijke grondslag van de instellingen van kinderbescherming
      onverlet.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel238
  - number: '238.5'
    text: |-
      Bij algemene maatregel van bestuur worden de zetel, de werkwijze, voor zover het de samenwerking met de
      gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref1], betreft en de organisatie van de raad
      geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '239.1'
    text: |-
      De raad voor de kinderbescherming kan optreden ten behoeve van minderjarigen die in Nederland hetzij hun woonplaats
      of laatste woonplaats, hetzij hun werkelijk verblijf hebben. Eveneens kan de raad optreden ten behoeve van
      Nederlandse minderjarigen die in Nederland noch woonplaats, noch laatste woonplaats, noch werkelijk verblijf
      hebben.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel239
  - number: '239.2'
    text: |-
      Ten behoeve van de minderjarigen die binnen een arrondissement hetzij hun woonplaats of laatste woonplaats, hetzij
      hun werkelijk verblijf hebben, treden voor de raad voor de kinderbescherming de in dat arrondissement aanwezige
      werkeenheden van de raad op.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel239
  - number: '239.3'
    text: |-
      Indien op grond van het vorige lid meer werkeenheden in verschillende arrondissementen bevoegd zouden zijn ten
      behoeve van een zelfde minderjarige op te treden, doet het optreden van een van deze werkeenheden de bevoegdheid
      van de ander eindigen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel239
  - number: '239.4'
    text: |-
      Ten behoeve van Nederlandse minderjarigen, die in Nederland noch woonplaats, noch laatste woonplaats, noch
      werkelijk verblijf hebben, treden de werkeenheden van de raad in het arrondissement Amsterdam op voor de raad voor
      de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel239
  - number: '239.5'
    text: |-
      Bij algemene maatregel van bestuur wordt de behandeling van klachten ter zake van een bij de raad in behandeling
      zijnde of geweest zijnde aangelegenheid van kinderbescherming geregeld.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel239
  - number: '240'
    text: |-
      Degene die op grond van een wettelijk voorschrift of op grond van zijn ambt of beroep tot geheimhouding is
      verplicht kan, zonder toestemming van degene die het betreft, aan de raad voor de kinderbescherming inlichtingen
      verstrekken, indien dit noodzakelijk kan worden geacht voor de uitoefening van de taken van de raad.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel240
  - number: '241.1'
    text: |-
      Indien de raad voor de kinderbescherming blijkt, dat een minderjarige niet onder het wettelijk vereiste gezag
      staat, of dat dit gezag niet over hem wordt uitgeoefend, verzoekt hij de rechter in de gezagsuitoefening over deze
      minderjarige te voorzien.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel241
  - number: '241.2'
    text: |-
      De kinderrechter kan op verzoek van de raad voor de kinderbescherming of het openbaar ministerie een
      gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1], belasten met de voorlopige
      voogdij over de minderjarige indien het dringend en onverwijld noodzakelijk is om in de gezagsuitoefening over de
      minderjarige te voorzien teneinde de belangen van de minderjarige te kunnen behartigen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: '241.3'
    text: |-
      De in het tweede lid bedoelde maatregel kan eveneens worden getroffen indien een minderjarige, die de leeftijd
      van zes maanden nog niet bereikt heeft en niet staat onder voogdij van een rechtspersoon, zonder voorafgaande
      schriftelijke toestemming van de raad voor de kinderbescherming als pleegkind is opgenomen. Onder pleegkind wordt
      in dit verband verstaan: een minderjarige die bij anderen dan zijn ouders, voogd of bloed- en aanverwanten tot en
      met de derde graad wordt verzorgd en opgevoed, met dien verstande, dat daaronder niet is begrepen:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel241
  - number: 241.3.a
    text: |-
      een minderjarige, op wiens verzorging en opvoeding krachtens de bepalingen van een andere wet toezicht wordt
      uitgeoefend door anderen dan zijn ouders of voogd;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel241
  - number: 241.3.b
    text: |-
      een minderjarige, die verzorgd en opgevoed wordt in een inrichting, welke, wat betreft de verzorging en opvoeding
      van de daarin verblijvende minderjarigen, aan toezicht krachtens de bepalingen van een andere wet is onderworpen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel241
  - number: '241.4'
    text: |-
      De maatregel vervalt na verloop van drie maanden na de dag van de beschikking, tenzij voor het einde van deze
      termijn om een voorziening in het gezag over de minderjarige is verzocht.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel241
  - number: '241.5'
    text: |-
      De maatregel kan worden ingetrokken of gewijzigd door de kinderrechter die haar heeft bevolen tenzij een verzoek
      als bedoeld in het vierde lid is ingediend. In dat geval beslist de rechter bij wie dit verzoek aanhangig is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel241
  - number: '241.6'
    text: |-
      In afwijking van het tweede lid kan de kinderrechter de voorlopige voogdij over een minderjarige door
      of voor wie een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref1] is ingediend, en in verband daarmee in Nederland verblijft, alsmede
      over door Onze Minister van Veiligheid en Justitie aan te wijzen categorieën andere minderjarigen, opdragen aan een
      rechtspersoon als bedoeld in [artikel 302, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '302'
        paragraaf: '4'
        afdeling: '6'
  - number: '241.7'
    text: |-
      De raad voor de kinderbescherming kan een onderzoek instellen naar de leefsituatie van een minderjarige die
      duurzaam wordt verzorgd en opgevoed bij anderen dan degenen die het ouderlijke gezag of de voogdij over hem
      uitoefenen, het gezin waarin hij wordt verzorgd en opgevoed of de wijze waarop het gezag of de voogdij over
      hem wordt uitgeoefend, indien er een redelijk vermoeden bestaat dat de minderjarige in strijd met een wettelijk
      voorschrift in dat gezin is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel241
  - number: 241a
    text: |-
      Op de uitoefening van de voorlopige voogdij door een gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1] is [artikel 243][ref2] van dit Boek van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel243
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel241a
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '243'
        afdeling: '3'
  - number: '242'
    text: |-
      De raad voor de kinderbescherming stelt zich op de hoogte van alle gevallen, waarin maatregelen met betrekking tot
      het gezag over minderjarigen overwogen dienen te worden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel242
  - number: '243.1'
    text: |-
      De colleges van burgemeester en wethouders en ambtenaren van de burgerlijke stand verschaffen de raad voor de
      kinderbescherming kosteloos alle inlichtingen, en verstrekken de raad kosteloos alle afschriften en uittreksels uit
      hun registers, die de raad ter uitvoering van zijn taak van hen vraagt. Wanneer de raad voor de kinderbescherming
      een taak vervult of een bevoegdheid uitoefent op grond van een van de bepalingen van deze titel of van de
      [titels 9][ref1], [10][ref2], [14][ref3], [15][ref4] en [17 van dit boek][ref5], alsmede op grond van de daarmee
      verband houdende bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref6], verschaffen de bij algemene
      maatregel van bestuur aan te wijzen instanties of personen de raad kosteloos die inlichtingen die voor een goede
      uitoefening van hun taak noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656
      [ref5]: https://wetten.overheid.nl/BWBR0002656
      [ref6]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0002656
      - id: ref5
        bwb_id: BWBR0002656
      - id: ref6
        bwb_id: BWBR0001827
  - number: '243.2'
    text: |-
      Alle verzoeken die de raad voor de kinderbescherming ter uitvoering van zijn taak tot de rechter richt, worden
      kosteloos behandeld; de grossen, afschriften en uittreksels, die hij tot dat doel aanvraagt, worden hem door de
      griffiers vrij van alle kosten uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel243
  - number: '243.3'
    text: |-
      Exploiten door de deurwaarders ten verzoeke van de raad voor de kinderbescherming uitgebracht, worden volgens het
      gewone tarief vergoed. Advocaten kunnen voor hun aan de raad voor de kinderbescherming bewezen diensten salaris in
      rekening brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel243
  - number: '243.4'
    text: |-
      Wanneer de raad voor de kinderbescherming op grond van een van de bepalingen van deze titel, of van de
      [titels 9][ref1], [10][ref2], [12][ref3], [14][ref4], [15][ref5] en [17 van dit boek][ref6] in rechte optreedt, kan
      hij dit zonder advocaat doen, behalve in gedingen die met een dagvaarding aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656
      [ref5]: https://wetten.overheid.nl/BWBR0002656
      [ref6]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0002656
      - id: ref5
        bwb_id: BWBR0002656
      - id: ref6
        bwb_id: BWBR0002656
  - number: '244'
    text: |-
      Bij de rechtbanken, dan wel op een andere bij algemene maatregel van bestuur aan te wijzen plaats of plaatsen,
      berusten openbare registers, waarin aantekening gehouden wordt van rechtsfeiten die op het over minderjarigen
      uitgeoefende gezag betrekking hebben. Bij algemene maatregel van bestuur wordt bepaald welke rechtsfeiten
      aangetekend worden, op welke wijze deze aantekening geschiedt en op welke wijze verstrekking van aangetekende
      gegevens plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel244
  - number: '245.1'
    text: Minderjarigen staan onder gezag.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel245
  - number: '245.2'
    text: Onder gezag wordt verstaan ouderlijk gezag dan wel voogdij.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel245
  - number: '245.3'
    text: |-
      Ouderlijk gezag wordt door de ouders gezamenlijk of door één ouder uitgeoefend. Voogdij wordt door een ander dan
      een ouder uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel245
  - number: '245.4'
    text: |-
      Het gezag heeft betrekking op de persoon van de minderjarige, het bewind over zijn vermogen en zijn
      vertegenwoordiging in burgerlijke handelingen, zowel in als buiten rechte.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel245
  - number: '245.5'
    text: |-
      Het gezag van de ouder die dit krachtens [artikel 253sa][ref1] of krachtens een rechterlijke beslissing
      overeenkomstig [artikel 253t][ref2] samen met een ander dan een ouder uitoefent, wordt aangemerkt als ouderlijk
      gezag dat door ouders gezamenlijk wordt uitgeoefend, tenzij uit een wettelijke bepaling het tegendeel voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel245
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253t
        paragraaf: '2'
        afdeling: 3A
  - number: '246'
    text: |-
      Onbevoegd tot het gezag zijn minderjarigen, zij die onder curatele zijn gesteld en zij wier geestvermogens zodanig
      zijn gestoord, dat zij in de onmogelijkheid verkeren het gezag uit te oefenen, tenzij deze stoornis van tijdelijke
      aard is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel246
  - number: '247.1'
    text: Het ouderlijk gezag omvat de plicht en het recht van de ouder zijn minderjarig kind te verzorgen en op te voeden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel247
  - number: '247.2'
    text: |-
      Onder verzorging en opvoeding worden mede verstaan de zorg en de verantwoordelijkheid voor het geestelijk
      en lichamelijk welzijn en de veiligheid van het kind alsmede het bevorderen van de ontwikkeling van zijn
      persoonlijkheid. In de verzorging en opvoeding van het kind passen de ouders geen geestelijk of lichamelijk geweld
      of enige andere vernederende behandeling toe.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel247
  - number: '247.3'
    text: |-
      Het ouderlijk gezag omvat mede de verplichting van de ouder om de ontwikkeling van de banden van zijn kind met de
      andere ouder te bevorderen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel247
  - number: '247.4'
    text: |-
      Een kind over wie de ouders gezamenlijk het gezag uitoefenen, behoudt na ontbinding van het huwelijk anders
      dan door de dood of na scheiding van tafel en bed, na de ontbinding van het geregistreerd partnerschap
      anders dan door de dood, of na het beëindigen van de samenleving indien een aantekening als bedoeld in
      [artikel 252, eerste lid][ref1], is geplaatst, recht op een gelijkwaardige verzorging en opvoeding door beide
      ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel252
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel247
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '252'
        paragraaf: '1'
        afdeling: '2'
  - number: '247.5'
    text: |-
      Ouders kunnen ter uitvoering van het vierde lid in een overeenkomst of ouderschapsplan rekening houden met
      praktische belemmeringen die ontstaan in verband met de ontbinding van het huwelijk anders dan door de dood of
      na scheiding van tafel en bed, de ontbinding van het geregistreerd partnerschap anders dan door de dood, of het
      beëindigen van de samenleving indien een aantekening als bedoeld in [artikel 252, eerste lid][ref1], is geplaatst,
      echter uitsluitend voor zover en zolang de desbetreffende belemmeringen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel252
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel247
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '252'
        paragraaf: '1'
        afdeling: '2'
  - number: 247a
    text: |-
      Indien een aantekening als bedoeld in [artikel 252, eerste lid][ref1], is geplaatst en
      de ouders hun samenleving beëindigen, stellen zij een ouderschapsplan op als bedoeld in
      [artikel 815, tweede en derde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel252
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel815
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel247a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '252'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '815'
  - number: '248'
    text: |-
      Het [tweede lid van artikel 247 van dit boek][ref1] is van overeenkomstige toepassing op de voogd en op degene die
      een minderjarige verzorgt en opvoedt zonder dat hem het gezag over die minderjarige toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel248
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '247'
        afdeling: '1'
  - number: '249'
    text: |-
      De minderjarige dient rekening te houden met de aan de ouder of voogd in het kader van de uitoefening van het gezag
      toekomende bevoegdheden, alsmede met de belangen van de overige leden van het gezin waarvan hij deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel249
  - number: '250'
    text: |-
      Wanneer in aangelegenheden betreffende diens verzorging en opvoeding, dan wel het vermogen van de minderjarige,
      de belangen van de met het gezag belaste ouders of een van hen dan wel van de voogd of de beide voogden in strijd
      zijn met die van de minderjarige, benoemt de rechtbank, danwel, indien het een aangelegenheid inzake het vermogen
      van de minderjarige betreft, de kantonrechter, of, indien de zaak reeds aanhangig is, de desbetreffende rechter,
      indien hij dit in het belang van de minderjarige noodzakelijk acht, daarbij in het bijzonder de aard van deze
      belangenstrijd in aanmerking genomen, op verzoek van een belanghebbende of ambtshalve een bijzondere curator om de
      minderjarige ter zake, zowel in als buiten rechte, te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel250
  - number: '251.1'
    text: Gedurende hun huwelijk oefenen de ouders het gezag gezamenlijk uit.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel251
  - number: '251.2'
    text: |-
      Na ontbinding van het huwelijk anders dan door de dood of na scheiding van tafel en bed blijven de ouders die
      gezamenlijk het gezag hebben, dit gezag gezamenlijk uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel251
  - number: 251a.1
    text: |-
      De rechter kan na ontbinding van het huwelijk anders dan door de dood of na scheiding van tafel en bed op verzoek
      van de ouders of van één van hen bepalen dat het gezag over een kind aan één ouder toekomt indien:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel251a
  - number: 251a.1.a
    text: |-
      er een onaanvaardbaar risico is dat het kind klem of verloren zou raken tussen de ouders en niet te verwachten is
      dat hierin binnen afzienbare tijd voldoende verbetering zou komen, of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel251a
  - number: 251a.1.b
    text: wijziging van het gezag anderszins in het belang van het kind noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel251a
  - number: 251a.2
    text: |-
      De beslissing op grond van het eerste lid wordt gegeven bij de beschikking houdende scheiding van tafel en bed,
      echtscheiding dan wel ontbinding van het huwelijk na scheiding van tafel en bed of bij latere beschikking.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel251a
  - number: 251a.3
    text: |-
      Indien een beslissing op grond van het eerste lid niet alle kinderen der echtgenoten betrof, vult de rechtbank haar
      aan op verzoek van een van de ouders, van de raad voor de kinderbescherming of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel251a
  - number: 251a.4
    text: |-
      De rechter kan, indien hem blijkt dat de minderjarige van twaalf jaar of ouder hierop prijs stelt, ambtshalve een
      beslissing geven op de voet van het eerste lid. Hetzelfde geldt indien de minderjarige de leeftijd van twaalf jaren
      nog niet heeft bereikt, maar in staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel251a
  - number: '252.1'
    text: |-
      De ouders die niet met elkaar zijn gehuwd of een geregistreerd partnerschap zijn aangegaan oefenen het gezag
      over hun minderjarige kinderen gezamenlijk uit, indien dit op hun beider verzoek in het register, bedoeld in
      [artikel 244][ref1], is aangetekend. Een verzoek als bedoeld in de eerste volzin kan niet worden gedaan ten aanzien
      van de kinderen over wie zij het gezag gezamenlijk hebben uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel244
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel252
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '244'
        afdeling: '4'
  - number: '252.2'
    text: 'De aantekening wordt door de griffier geweigerd, indien op het tijdstip van het verzoek:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel252
  - number: 252.2.a
    text: één of beide ouders onbevoegd is tot het gezag; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel252
  - number: 252.2.b
    text: het gezag van één van beide ouders is beëindigd en de andere ouder het gezag uitoefent; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel252
  - number: 252.2.c
    text: een voogd met het gezag over het kind is belast; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel252
  - number: 252.2.d
    text: de voorziening in het gezag over het kind is komen te ontbreken; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel252
  - number: 252.2.e
    text: de ouder die het gezag heeft, dit gezamenlijk met een ander dan een ouder uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel252
  - number: '252.3'
    text: |-
      Tegen de weigering van de aantekening is alleen beroep mogelijk, indien zij heeft plaatsgevonden op grond van
      onbevoegdheid van één of beide ouders tot het gezag anders dan vanwege minderjarigheid of ondercuratelestelling.
      Alsdan kan de rechtbank worden verzocht de aantekening te gelasten. Zij wijst het verzoek af, indien gegronde vrees
      bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel252
  - number: '253.1'
    text: |-
      Indien gewezen echtgenoten met elkaar hertrouwen dan wel een geregistreerd partnerschap aangegaan en onmiddellijk
      daaraan voorafgaande één der echtgenoten het gezag over de minderjarige kinderen uitoefende, herleeft van
      rechtswege het gezamenlijk gezag, tenzij een der echtgenoten onbevoegd is tot dit gezag of dat gezag is beëindigd
      dan wel het gezag gezamenlijk met een ander dan de ouder uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253
  - number: '253.2'
    text: |-
      De echtgenoot voor wie het gezag niet is herleefd, kan de rechtbank verzoeken hem daarmede te belasten. Dit verzoek
      wordt slechts afgewezen, indien gegronde vrees bestaat dat bij inwilliging de belangen van de kinderen zouden
      worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253
  - number: '253.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing, indien door verzoening van de echtgenoten een
      scheiding van tafel en bed eindigt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253
  - number: '253.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien gewezen geregistreerde partners die gezamenlijk
      gezag uitoefenden over het kind, opnieuw met elkaar een geregistreerd partnerschap aangaan dan wel met elkaar
      huwen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253
  - number: 253a.1
    text: |-
      In geval van gezamenlijke uitoefening van het gezag kunnen geschillen hieromtrent op verzoek van de ouders of van
      een van hen aan de rechtbank worden voorgelegd. De rechtbank neemt een zodanige beslissing als haar in het belang
      van het kind wenselijk voorkomt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253a
  - number: 253a.2
    text: |-
      De rechtbank kan eveneens op verzoek van de ouders of een van hen een regeling vaststellen inzake de uitoefening
      van het ouderlijk gezag. Deze regeling kan omvatten:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253a
  - number: 253a.2.a
    text: |-
      een toedeling aan ieder der ouders van de zorg- en opvoedingstaken, alsmede met overeenkomstige toepassing van
      [artikel 377a, derde lid][ref1], een tijdelijk verbod aan een ouder om met het kind contact te hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377a
  - number: 253a.2.b
    text: de beslissing bij welke ouder het kind zijn hoofdverblijfplaats heeft;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253a
  - number: 253a.2.c
    text: |-
      de wijze waarop informatie omtrent gewichtige aangelegenheden met betrekking tot de persoon en het vermogen van het
      kind wordt verschaft aan de ouder bij wie het kind niet zijn hoofdverblijfplaats heeft dan wel de wijze waarop deze
      ouder wordt geraadpleegd;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253a
  - number: 253a.2.d
    text: |-
      de wijze waarop informatie door derden overeenkomstig [artikel 377c, eerste en tweede lid][ref1], wordt verschaft.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377c
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377c
  - number: 253a.3
    text: |-
      Indien op de ouders de verplichting van [artikel 247a][ref1] rust en zij daaraan niet hebben voldaan, houdt de
      rechter de beslissing op een in het tweede lid bedoeld verzoek ambtshalve aan, totdat aan die verplichting is
      voldaan. Aanhouding blijft achterwege indien het belang van het kind dit vergt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 247a
        afdeling: '1'
  - number: 253a.4
    text: |-
      De [artikelen 377e][ref1] en [377g][ref2] zijn van overeenkomstige toepassing. Daar waar in deze bepalingen
      gesproken wordt over omgang of een omgangsregeling wordt in plaats daarvan gelezen: een verdeling van de zorg-
      en opvoedingstaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377g
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377e
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 377g
  - number: 253a.5
    text: |-
      De rechtbank beproeft alvorens te beslissen op een verzoek als in het eerste of tweede lid bedoeld,
      een vergelijk tussen de ouders en kan desverzocht en ook ambtshalve, zulks indien geen vergelijk
      tot stand komt en het belang van het kind zich daartegen niet verzet, een door de wet toegelaten
      dwangmiddel opleggen, dan wel bepalen dat de beschikking of onderdelen daarvan met toepassing van
      [artikel 812, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] ten uitvoer kunnen worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel812
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253a
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '812'
  - number: 253a.6
    text: De rechtbank behandelt het verzoek binnen zes weken.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253a
  - number: 253aa.1
    text: Gedurende hun geregistreerd partnerschap oefenen de ouders het gezag gezamenlijk uit.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253aa
  - number: 253aa.2
    text: |-
      De bepalingen met betrekking tot het gezamenlijk gezag zijn hierop van toepassing, met uitzondering van de
      [artikelen 251, tweede lid][ref1], en [251a, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel251a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253aa
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '251'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 251a
        paragraaf: '1'
        afdeling: '2'
  - number: 253b.1
    text: |-
      Indien ten aanzien van een kind alleen het moederschap vaststaat van de vrouw uit wie het kind is geboren of indien
      de ouders van een kind niet met elkaar gehuwd zijn dan wel gehuwd zijn geweest en zij het gezag niet gezamenlijk
      uitoefenen, oefent de moeder uit wie het kind is geboren van rechtswege het gezag over het kind alleen uit, tenzij
      zij bij haar bevalling onbevoegd tot het gezag was.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253b
  - number: 253b.2
    text: |-
      De in het eerste lid bedoelde moeder die ten tijde van haar bevalling onbevoegd was tot het gezag, verkrijgt dit
      van rechtswege op het tijdstip waarop zij daartoe bevoegd wordt, tenzij op dat tijdstip een ander met het gezag
      is belast.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253b
  - number: 253b.3
    text: |-
      Indien op bedoeld tijdstip een ander het gezag heeft, kan de tot het gezag bevoegde ouder de rechtbank verzoeken
      hem met het gezag over het kind te belasten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253b
  - number: 253b.4
    text: |-
      Wanneer de andere ouder het gezag over het kind uitoefent, wordt dit verzoek slechts ingewilligd, indien de rechter
      dit in het belang van het kind wenselijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253b
  - number: 253b.5
    text: |-
      Wanneer een voogd het gezag over het kind uitoefent, wordt het verzoek slechts afgewezen, indien gegronde vrees
      bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253b
  - number: 253c.1
    text: |-
      De tot het gezag bevoegde ouder van het kind, die nimmer het gezag gezamenlijk met de moeder uit wie het kind is
      geboren heeft uitgeoefend, kan de rechtbank verzoeken de ouders met het gezamenlijk gezag dan wel hem alleen met
      het gezag over het kind te belasten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253c
  - number: 253c.2
    text: |-
      Indien het verzoek ertoe strekt de ouders met het gezamenlijk gezag te belasten en de andere ouder met gezamenlijk
      gezag niet instemt, wordt het verzoek slechts afgewezen indien:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253c
  - number: 253c.2.a
    text: |-
      er een onaanvaardbaar risico is dat het kind klem of verloren zou raken tussen de ouders en niet te verwachten is
      dat hierin binnen afzienbare tijd voldoende verbetering zou komen, of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253c
  - number: 253c.2.b
    text: afwijzing anderszins in het belang van het kind noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253c
  - number: 253c.3
    text: |-
      Wanneer de andere ouder het gezag over het kind uitoefent, wordt het verzoek om de tot het gezag bevoegde ouder,
      bedoeld in het eerste lid, alleen met het gezag te belasten slechts ingewilligd, indien de rechtbank dit in het
      belang van het kind wenselijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253c
  - number: 253c.4
    text: |-
      Wanneer niet in het gezag is voorzien of wanneer een voogd het gezag uitoefent, wordt het verzoek om de tot
      het gezag bevoegde ouder, bedoeld in het eerste lid, alleen met het gezag te belasten slechts afgewezen, indien
      gegronde vrees bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253c
  - number: 253c.5
    text: |-
      Een verzoek om de ouders met het gezamenlijk gezag te belasten als bedoeld in het eerste lid, kan ook door de
      moeder uit wie het kind is geboren worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253c
  - number: 253d.1
    text: |-
      Indien de voorziening in het gezag over een kind, bedoeld in [artikel 253b, eerste lid][ref1], komt te
      ontbreken, kunnen beide ouders voor zover zij tot het gezag bevoegd zijn – de rechtbank verzoeken met het gezag
      onderscheidenlijk gezamenlijk gezag te worden belast.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253b
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253b
        paragraaf: '2'
        afdeling: '2'
  - number: 253d.2
    text: |-
      Het in het eerste lid bedoelde verzoek wordt slechts afgewezen, indien gegronde vrees bestaat dat bij inwilliging
      de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253d
  - number: 253d.3
    text: |-
      Hebben beiden een verzoek ingediend anders dan tot gezamenlijke gezagsuitoefening, dan willigt de rechter het
      verzoek in van degene wiens gezag over het kind hij het meeste in het belang van het kind oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253d
  - number: 253d.4
    text: |-
      Indien, voordat over het verzoek van één ouder is beslist, de andere ouder van rechtswege het gezag over het kind
      verkrijgt, willigt de rechter het verzoek slechts in, indien hij dit in het belang van het kind wenselijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253d
  - number: 253e
    text: |-
      Inwilliging van het verzoek van een der ouders als bedoeld in de [artikelen 253b][ref1], [253c][ref2] en
      [253d van dit boek][ref3] heeft, indien de ander het gezag tot dusverre uitoefende, tot gevolg dat de laatste
      het gezag verliest. Dit gevolg treedt niet in indien de ouders als gevolg van de rechterlijke beslissing met het
      gezamenlijk gezag zijn belast.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253b
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253c
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel253d
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253b
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253c
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 253d
        paragraaf: '2'
        afdeling: '2'
  - number: 253f
    text: |-
      Na de dood van een der ouders oefent de overlevende ouder van rechtswege het gezag over de kinderen uit, indien en
      voor zover hij op het tijdstip van overlijden het gezag uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253f
  - number: 253g.1
    text: |-
      Indien van de ouders diegene overlijdt die het gezag over hun minderjarige kinderen alleen uitoefent, bepaalt de
      rechter dat de overlevende ouder of een derde met het gezag over deze kinderen wordt belast.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253g
  - number: 253g.2
    text: De rechter doet dit op verzoek van de raad voor de kinderbescherming, de overlevende ouder of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253g
  - number: 253g.3
    text: |-
      Het verzoek om de overlevende ouder met het gezag te belasten wordt slechts afgewezen, indien de rechter oordeelt
      dat het belang van de minderjarige zich tegen inwilliging verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253g
  - number: 253g.4
    text: |-
      De bepaling van het voorgaande lid is mede van toepassing indien de overleden ouder een voogd had aangewezen
      overeenkomstig [artikel 292][ref1] van dit boek.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel292
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '292'
        paragraaf: '2'
        afdeling: '6'
  - number: 253h.1
    text: |-
      Indien na het overlijden van één der ouders een voogd is benoemd, kan de rechter deze beslissing te allen tijde in
      dier voege wijzigen, dat de overlevende ouder mits deze daartoe bevoegd is, alsnog met het gezag wordt belast.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253h
  - number: 253h.2
    text: |-
      Hij gaat hiertoe slechts over op verzoek van de overlevende ouder, en niet dan op grond dat nadien de
      omstandigheden zijn gewijzigd, of dat bij het nemen van de beslissing van onjuiste of onvolledige gegevens is
      uitgegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253h
  - number: 253h.3
    text: |-
      Wanneer de andere ouder een voogd had aangewezen overeenkomstig [artikel 292][ref1] van dit boek en deze inmiddels
      is opgetreden, is dit artikel van overeenkomstige toepassing met dien verstande dat, mits het verzoek van de
      overlevende ouder binnen één jaar na het begin van de voogdij wordt gedaan, dit verzoek slechts wordt afgewezen
      indien de rechter oordeelt dat het belang van de minderjarige zich tegen inwilliging verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel292
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253h
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '292'
        paragraaf: '2'
        afdeling: '6'
  - number: 253ha.1
    text: |-
      De minderjarige vrouw die als degene die het gezag heeft, haar kind wenst te verzorgen en op te voeden kan, indien
      zij de leeftijd van zestien jaren heeft bereikt, de kinderrechter verzoeken haar meerderjarig te verklaren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253ha
  - number: 253ha.2
    text: |-
      Het verzoek kan ten behoeve van de vrouw ook worden gedaan door de raad voor de kinderbescherming. Deze behoeft
      hiertoe haar schriftelijke toestemming. Het verzoek vervalt, indien de vrouw haar toestemming intrekt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253ha
  - number: 253ha.3
    text: |-
      Het verzoek kan ook voor de bevalling door of ten behoeve van de vrouw worden gedaan, alsmede indien de vrouw eerst
      omstreeks het tijdstip van haar bevalling de leeftijd van zestien jaren zal hebben bereikt. In dat geval wordt op
      het verzoek niet eerder dan na de bevalling of, indien de vrouw op dat tijdstip nog geen zestien jaar is, nadat zij
      die leeftijd heeft bereikt, beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253ha
  - number: 253ha.4
    text: |-
      De kinderrechter willigt het verzoek slechts in, indien hij dit in het belang van de moeder en haar kind wenselijk
      oordeelt. Indien een ander met het gezag is belast, wordt de moeder daarmee belast.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253ha
  - number: 253ha.5
    text: De minderjarige vrouw is bekwaam in rechte op te treden en tegen een uitspraak beroep in te stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253ha
  - number: 253i.1
    text: |-
      Ingeval van gezamenlijke gezagsuitoefening voeren de ouders gezamenlijk het bewind over het vermogen van het kind
      en vertegenwoordigen zij gezamenlijk het kind in burgerlijke handelingen, met dien verstande dat een ouder alleen,
      mits niet van bezwaren van de andere ouder is gebleken, hiertoe ook bevoegd is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253i
  - number: 253i.2
    text: |-
      [Artikel 253][ref1] is van overeenkomstige toepassing met dien verstande dat in plaats van "de rechtbank" wordt
      gelezen "de kantonrechter".


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253i
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: 253i.3
    text: |-
      Oefent een ouder het gezag alleen uit, dan wordt door die ouder het bewind over het vermogen van het kind gevoerd
      en het kind in burgerlijke handelingen vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253i
  - number: 253i.4
    text: 'Van het bepaalde in het eerste en derde lid kan worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253i
  - number: 253i.4.a
    text: |-
      indien de rechter bij de beschikking waarbij de uitoefening van het gezag over het kind aan een van de ouders wordt
      opgedragen op eensluidend verzoek van de ouders of op verzoek van één van hen, mits de ander zich daartegen niet
      verzet, heeft bepaald dat de ouder die niet het gezag over het kind zal uitoefenen, het bewind over het vermogen
      van het kind zal voeren;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253i
  - number: 253i.4.b
    text: |-
      ingevolge [artikel 276, tweede lid, van dit boek][ref1], bij beëindiging van het gezag;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel276
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253i
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '276'
        afdeling: '5'
  - number: 253i.4.c
    text: |-
      indien hij die een minderjarige goederen schenkt of vermaakt, bij de gift, onderscheidenlijk bij de uiterste
      wilsbeschikking, heeft bepaald dat een ander het bewind over die goederen zal voeren.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253i
  - number: 253i.5
    text: |-
      In het laatstbedoelde geval zijn de ouders, of - indien een ouder het gezag alleen uitoefent - die ouder, bevoegd
      van de bewindvoerder rekening en verantwoording te vragen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253i
  - number: 253i.6
    text: |-
      Bij het vervallen van het door de schenker of erflater ingesteld bewind zijn het eerste en tweede lid,
      onderscheidenlijk het derde lid, van toepassing.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253i
  - number: 253j
    text: |-
      De ouders of een ouder moeten het bewind over het vermogen van hun kind als goede bewindvoerders voeren. Bij slecht
      bewind zijn zij voor de daaraan te wijten schade aansprakelijk, behoudens voor de vruchten van dat vermogen voor
      zover de wet hun het genot daarvan toekent.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253j
  - number: 253k
    text: |-
      Op het bewind van de ouders of een ouder zijn de [artikelen 342, tweede lid][ref1], [344 tot en met 357][ref2] en
      [370 van dit boek][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel342
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel344
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel370
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253k
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '342'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '344'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '370'
        paragraaf: '10'
        afdeling: '6'
  - number: 253l.1
    text: |-
      Elke ouder die het gezag over zijn kind uitoefent, heeft het vruchtgenot van diens vermogen. Indien het kind bij de
      ouder inwoont en anders dan incidenteel inkomen uit arbeid geniet, is het verplicht naar draagkracht bij te dragen
      in de kosten van de huishouding van het gezin.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253l
  - number: 253l.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing in geval het gezag van de ouder is beëindigd, tenzij de andere
      ouder het gezag uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253l
  - number: 253l.3
    text: Aan bedoeld vruchtgenot zijn de lasten verbonden, die op vruchtgebruikers rusten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253l
  - number: 253m
    text: |-
      De ouder heeft geen vruchtgenot van het vermogen, ten aanzien waarvan bij uiterste wilsbeschikking van de erflater
      of bij de gift is bepaald dat de ouders daarvan het vruchtgenot niet zullen hebben.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253m
  - number: 253n.1
    text: |-
      Op verzoek van de niet met elkaar gehuwde ouders of een van hen kan de rechtbank het gezamenlijk gezag,
      bedoeld in de [artikelen 251, tweede lid][ref1], [252, eerste lid][ref2], [253q, vijfde lid][ref3], of
      [277, eerste lid][ref4], beëindigen, indien nadien de omstandigheden zijn gewijzigd of bij het nemen van de
      beslissing van onjuiste of onvolledige gegevens is uitgegaan. Alsdan bepaalt de rechtbank aan wie van de ouders
      voortaan het gezag over ieder der minderjarige kinderen toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel277
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253n
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '251'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '252'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 253q
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '277'
        afdeling: '5'
  - number: 253n.2
    text: |-
      Het [eerste en derde lid van artikel 251a][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253n
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 251a
        paragraaf: '1'
        afdeling: '2'
  - number: 253o.1
    text: |-
      Beslissingen waarbij een ouder alleen met het gezag is belast, gegeven ingevolge het bepaalde in de
      [paragrafen 1][ref1], [2][ref2] en [2a][ref3] van deze titel en het bepaalde in [artikel 253n][ref4] van dit
      boek kunnen op verzoek van de ouders of van een van hen door de rechtbank worden gewijzigd op grond dat nadien
      de omstandigheden zijn gewijzigd, of dat bij het nemen van de beslissing van onjuiste of onvolledige gegevens is
      uitgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel253n
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253o
    references:
      - id: ref1
        bwb_id: BWBR0002656
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        paragraaf: 2a
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: 253n
        afdeling: '3'
  - number: 253p.1
    text: |-
      In de gevallen waarin door de rechter het gezag wordt opgedragen aan beide ouders of aan een ouder alleen, neemt
      dit een aanvang zodra de desbetreffende beschikking in kracht van gewijsde is gegaan, of, indien zij uitvoerbaar
      bij voorraad is verklaard, daags nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253p
  - number: 253p.2
    text: |-
      Na de gerechtelijke ontbinding van het huwelijk of na scheiding van tafel en bed begint het gezag nochtans
      niet voordat de beschikking houdende ontbinding van het huwelijk is ingeschreven in de registers van de
      burgerlijke stand of voordat de beschikking houdende scheiding van tafel en bed is ingeschreven in het
      huwelijksgoederenregister, aangewezen in [artikel 116][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253p
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: 253p.3
    text: |-
      Indien een aantekening was gedaan als bedoeld in [artikel 252, eerste lid, van dit boek][ref1], begint het aan
      één der ouders opgedragen gezag nochtans niet, dan nadat deze aantekening door de griffier is doorgehaald. Van de
      doorhaling doet de griffier schriftelijk mededeling aan beide ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel252
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253p
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '252'
        paragraaf: '1'
        afdeling: '2'
  - number: 253q.1
    text: |-
      Wanneer een van de ouders die gezamenlijk het gezag over hun minderjarige kinderen uitoefenen, op een der in
      [artikel 246][ref1] genoemde gronden daartoe onbevoegd is, oefent de andere ouder alleen het gezag over de kinderen
      uit. Wanneer de grond van de onbevoegdheid is weggevallen, herleeft van rechtswege het gezamenlijke gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253q
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
  - number: 253q.2
    text: |-
      Wanneer beide ouders die gezamenlijk het gezag over hun minderjarige kinderen uitoefenen, daartoe op een der in
      [artikel 246][ref1] genoemde gronden onbevoegd zijn, benoemt de rechtbank een voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253q
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
  - number: 253q.3
    text: |-
      Wanneer een ouder die alleen het gezag uitoefent, op een der in [artikel 246][ref1] genoemde gronden daartoe
      onbevoegd is, belast de rechtbank de andere ouder met het gezag, tenzij de rechter oordeelt dat het belang van de
      minderjarige zich hiertegen verzet. Alsdan benoemt zij een voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253q
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
  - number: 253q.4
    text: |-
      De in het tweede en derde lid bedoelde beslissingen worden gegeven op verzoek van een ouder, bloed- of
      aanverwanten van de minderjarige, de raad voor de kinderbescherming, de gecertificeerde instelling, bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1], een rechtspersoon een daartoe door Onze Minister van Veiligheid en Justitie
      aanvaarde rechtspersoon als bedoeld in [artikel 256, eerste lid][ref2], en [artikel 302, tweede lid][ref3], of
      ambtshalve.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel256
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253q
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '256'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '302'
        paragraaf: '4'
        afdeling: '6'
  - number: 253q.5
    text: |-
      Wanneer de grond van de onbevoegdheid ten aanzien van de ouder die het gezag alleen uitoefende, is vervallen,
      belast de rechtbank deze ouder op zijn verzoek wederom met het gezag tenzij de rechtbank oordeelt dat het belang
      van de minderjarige zich hiertegen verzet. Op verzoek van de ouders of een van hen kan hij de ouders gezamenlijk
      met het gezag belasten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253q
  - number: 253r.1
    text: |-
      [Artikel 253q][ref1] is van overeenkomstige toepassing, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253r
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253q
        afdeling: '3'
  - number: 253r.1.a
    text: |-
      de ouders of de ouder die het gezag uitoefenen al dan niet tijdelijk in de onmogelijkheid verkeren het gezag uit te
      oefenen; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253r
  - number: 253r.1.b
    text: het bestaan of de verblijfplaats van de ouders of van één van hen die het gezag uitoefenen, onbekend is.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253r
  - number: 253r.2
    text: |-
      In het geval een der ouders het gezag alleen uitoefent overeenkomstig [artikel 253q, eerste lid][ref1], is
      gedurende de tijd waarin een van de in het eerste lid bedoelde omstandigheden zich voordoet het gezag van de andere
      ouder geschorst. In de overige gevallen is het gezag geschorst totdat de rechter de ouders of een van hen wederom
      met het gezag belast. In afwijking van artikel 253q kan de rechter dit slechts doen indien aan de vereisten gesteld
      in [artikel 277, eerste lid][ref2], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel277
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253r
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253q
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '277'
        afdeling: '5'
  - number: 253s.1
    text: |-
      Indien het kind met instemming van zijn ouders die het gezag over hem uitoefenen, gedurende ten minste een
      jaar door een of meer anderen als behorende tot het gezin is verzorgd en opgevoed, kunnen de ouders slechts met
      toestemming van degenen die de verzorging en opvoeding op zich hebben genomen, wijziging in het verblijf van het
      kind brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253s
  - number: 253s.2
    text: |-
      Voor zover de volgens het vorige lid vereiste toestemmingen niet worden verkregen, kunnen zij op verzoek van de
      ouders door die van de rechtbank worden vervangen. Dit verzoek wordt slechts afgewezen indien de kinderrechter dit
      in het belang van de minderjarige noodzakelijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253s
  - number: 253s.3
    text: |-
      In geval van afwijzing van het verzoek is de beschikking van kracht gedurende een door de rechtbank te bepalen
      termijn, welke de duur van zes maanden niet te boven mag gaan. Is echter voor het einde van deze termijn een
      verzoek tot ondertoezichtstelling van het kind, dan wel tot beëindiging van het gezag van een of beide ouders
      aanhangig gemaakt, dan blijft de beschikking gelden, totdat op het verzoek bij gewijsde is beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253s
  - number: 253sa.1
    text: |-
      Over het staande hun huwelijk of geregistreerd partnerschap geboren kind oefenen een ouder en zijn echtgenoot
      of geregistreerde partner die niet de ouder is, gezamenlijk het gezag uit, tenzij het kind tevens in
      familierechtelijke betrekking staat tot een andere ouder.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253sa
  - number: 253sa.2
    text: |-
      De bepalingen met betrekking tot het gezamenlijk gezag zijn hierop van toepassing, met uitzondering van de
      [artikelen 251, tweede lid][ref1], en [251a, tweede en derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel251a
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253sa
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '251'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 251a
        paragraaf: '1'
        afdeling: '2'
  - number: 253t.1
    text: |-
      Indien het gezag over een kind bij één ouder berust, kan de rechtbank op gezamenlijk verzoek van de met het
      gezag belaste ouder en een ander dan de ouder die in een nauwe persoonlijke betrekking tot het kind staat, hen
      gezamenlijk met het gezag over het kind belasten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253t
  - number: 253t.2
    text: |-
      In het geval dat het kind tevens in familierechtelijke betrekking staat tot een andere ouder wordt het verzoek
      slechts toegewezen, indien:
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253t
  - number: 253t.2.a
    text: |-
      de ouder en de ander op de dag van het verzoek gedurende ten minste een aaneengesloten periode van een jaar
      onmiddellijk voorafgaande aan het verzoek gezamenlijk de zorg voor het kind hebben gehad; en
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253t
  - number: 253t.2.b
    text: |-
      de ouder die het verzoek doet op de dag van het verzoek gedurende ten minste een aaneengesloten periode van drie
      jaren alleen met het gezag belast is geweest.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253t
  - number: 253t.3
    text: |-
      Het verzoek wordt afgewezen indien, mede in het licht van de belangen van een andere ouder, gegronde vrees bestaat
      dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253t
  - number: 253t.4
    text: |-
      Het gezamenlijk gezag, bedoeld in het eerste lid, kan niet worden toegekend in de gevallen, bedoeld in
      [artikel 253q, eerste lid][ref1], en [artikel 253r][ref2]. Het staat niet open voor rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253r
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253t
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253q
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253r
        afdeling: '3'
  - number: 253t.5
    text: |-
      Een verzoek als bedoeld in het eerste lid kan vergezeld gaan van een verzoek tot wijziging van de geslachtsnaam van
      het kind in de geslachtsnaam van de met het gezag belaste ouder of de ander. Een zodanig verzoek wordt afgewezen,
      indien
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253t
  - number: 253t.5.a
    text: het kind van twaalf jaar of ouder ter gelegenheid van zijn verhoor niet heeft ingestemd met het verzoek;
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253t
  - number: 253t.5.b
    text: het verzoek, bedoeld in het eerste lid, wordt afgewezen; of
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253t
  - number: 253t.5.c
    text: het belang van het kind zich tegen toewijzing verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253t
  - number: 253u
    text: |-
      Het gezamenlijk gezag begint op de dag waarop de beslissing die de benoeming inhoudt, in kracht van gewijsde is
      gegaan, of, indien zij uitvoerbaar bij voorraad is verklaard, daags nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253u
  - number: 253v.1
    text: |-
      Op de gezamenlijke gezagsuitoefening door de ouder en de ander zijn de [artikelen 246][ref1], [247][ref2],
      [249][ref3], [250][ref4], [253a][ref5], [253j tot en met 253m][ref6], [253q, eerste lid][ref7], [253r][ref8]
      alsmede [253s][ref9] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel247
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel249
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel250
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel253j
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
      [ref8]: https://wetten.overheid.nl/BWBR0002656#Artikel253r
      [ref9]: https://wetten.overheid.nl/BWBR0002656#Artikel253s
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253v
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '247'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '249'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '250'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0002656
        artikel: 253j
        paragraaf: '3'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0002656
        artikel: 253q
        afdeling: '3'
      - id: ref8
        bwb_id: BWBR0002656
        artikel: 253r
        afdeling: '3'
      - id: ref9
        bwb_id: BWBR0002656
        artikel: 253s
        afdeling: '3'
  - number: 253v.2
    text: |-
      [Artikel 253i][ref1] is van overeenkomstige toepassing, tenzij de met het gezag belaste ouder het bewind niet voert
      ingevolge [artikel 253i, vierde lid, onder a of c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253i
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253i
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253v
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253i
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253i
        paragraaf: '3'
        afdeling: '2'
  - number: 253v.3
    text: |-
      [Artikel 253n][ref1] is van overeenkomstige toepassing. De rechtbank geeft geen beslissing tot beëindiging van het
      gezamenlijk gezag, bedoeld in [artikel 253t][ref2], dan nadat zij de ouders of de niet met het gezag belaste ouder
      in de gelegenheid heeft gesteld te verzoeken in het belang van het kind de ouders gezamenlijk met het gezag over
      het kind te belasten of de niet met het gezag belaste ouder daarmee te belasten.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253n
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253v
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253n
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253t
        paragraaf: '2'
        afdeling: 3A
  - number: 253v.4
    text: |-
      Indien de rechtbank na beëindiging van het gezamenlijk gezag van de ouder en de ander, deze ander met de voogdij
      heeft belast, kan zij te allen tijde wegens wijziging van omstandigheden op verzoek van de ouders of van één van
      hen in het belang van het kind één ouder met het gezag of de ouders met het gezamenlijk gezag belasten.
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253v
  - number: 253v.5
    text: |-
      [Artikel 253q, tweede lid][ref1], is van overeenkomstige toepassing met dien verstande dat de rechtbank
      geen voogd benoemt dan nadat zij de niet met het gezag belaste ouder in de gelegenheid heeft gesteld te
      verzoeken in het belang van het kind hem met het gezag over het kind te belasten. Het verzoek, bedoeld in
      [artikel 253q, tweede lid][ref2], kan tevens door de ander dan de ouder worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253v
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253q
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253q
        afdeling: '3'
  - number: 253v.6
    text: |-
      De [afdelingen 4][ref1] en [5][ref2] van deze titel zijn van overeenkomstige toepassing op het gezamenlijk
      gezag van de ouder en de ander, met dien verstande dat in geval van beëindiging van het gezag van de ouder
      die gezamenlijk met de ander het gezag uitoefent, de ander niet alleen met het gezag wordt belast dan nadat de
      rechtbank de niet met het gezag belaste ouder in de gelegenheid heeft gesteld te verzoeken hem met het gezag over
      het kind te belasten.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling4
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling5
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253v
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        afdeling: '5'
  - number: 253w
    text: |-
      De ander die met de ouder gezamenlijk het gezag uitoefent, is verplicht tot het verstrekken van levensonderhoud
      jegens het kind dat onder zijn gezag staat. Indien het gezamenlijk gezag door de meerderjarigheid van het
      kind is geëindigd, duurt de onderhoudsplicht voort totdat het kind de leeftijd van eenentwintig jaren heeft
      bereikt. Nadat een rechterlijke beslissing tot beëindiging van het gezamenlijk gezag in kracht van gewijsde
      is gegaan of na het overlijden van de ouder met wie tot het tijdstip van overlijden het gezag gezamenlijk
      werd uitgeoefend, blijft deze onderhoudsplicht gedurende de termijn dat het gezamenlijk gezag heeft geduurd,
      bestaan, tenzij de rechter in bijzondere omstandigheden op verzoek van de ouder of de ander een langere
      termijn bepaalt. Zij eindigt uiterlijk op het tijdstip dat het kind de leeftijd van eenentwintig jaren heeft
      bereikt. De [artikelen 392, derde lid][ref1], [395a, eerste lid][ref2], [395b][ref3], [397][ref4], [398][ref5],
      [399][ref6], [400][ref7], [401, eerste, vierde en vijfde lid][ref8], [402][ref9], [402a][ref10], [403][ref11],
      [404, eerste lid][ref12], [406][ref13] en [408][ref14] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel392
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel395b
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel397
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel398
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel399
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel400
      [ref8]: https://wetten.overheid.nl/BWBR0002656#Artikel401
      [ref9]: https://wetten.overheid.nl/BWBR0002656#Artikel402
      [ref10]: https://wetten.overheid.nl/BWBR0002656#Artikel402a
      [ref11]: https://wetten.overheid.nl/BWBR0002656#Artikel403
      [ref12]: https://wetten.overheid.nl/BWBR0002656#Artikel404
      [ref13]: https://wetten.overheid.nl/BWBR0002656#Artikel406
      [ref14]: https://wetten.overheid.nl/BWBR0002656#Artikel408
    url: https://wetten.overheid.nl/BWBR0002656/2016-08-01#Artikel253w
