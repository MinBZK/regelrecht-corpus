        bwb_id: BWBR0002656
        artikel: '18'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        afdeling: '12'
  - number: 18d
    text: |-
      1 Van alle in registers opgenomen akten van de burgerlijke stand wordt een dubbel of een afschrift gehouden,
      volgens regels, bij algemene maatregel van bestuur te stellen.

      2 Bij algemene maatregel van bestuur wordt geregeld alles wat betreft de bewaring van de dubbelen of de afschriften
      alsmede van de daarop betrekking hebbende latere vermeldingen.

      3 Wanneer akten van de burgerlijke stand verloren zijn gegaan of verminkt zijn, wordt ter vervanging van deze akten
      van de dubbelen van de akten een afschrift gemaakt door een of meer door Onze Minister van Justitie aan te wijzen
      Centrale Bewaarplaatsen waar de dubbelen bewaard worden. De afschriften treden in de plaats van de verloren gegane
      of verminkte akten.

      4 Er wordt een lijst opgesteld van de akten die vervangen worden, die in de Staatscourant wordt gepubliceerd.

      5 De kosten voor de vervanging van akten van de burgerlijke stand komen ten laste van de Staat, tenzij het de
      vervanging van akten betreft die bewaard worden door een gemeente. In het laatstgenoemde geval komen de kosten van
      vervanging voor rekening van de gemeente.

      6 Onze Minister van Justitie kan nadere regels stellen omtrent de wijze waarop de vervanging van de akten dient te
      worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel18d
  - number: '19'
    text: |-
      1 Een akte van geboorte wordt opgemaakt door de ambtenaar van de burgerlijke stand van de gemeente waar het kind
      is geboren.

      2 Indien de plaats van de geboorte van het kind niet bekend is, wordt de akte opgemaakt door de ambtenaar van de
      burgerlijke stand van de gemeente waar het kind is aangetroffen. Die gemeente geldt als gemeente waar het kind
      is geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel19
  - number: 19a
    text: |-
      1 In geval van geboorte op Nederlands grondgebied in een rijdend voertuig of op een varend schip of tijdens
      een binnenlandse luchtreis met een luchtvaartuig, wordt de akte van geboorte opgemaakt door de ambtenaar van de
      burgerlijke stand van de gemeente waar dat kind het voertuig, het schip of het luchtvaartuig verlaat, dan wel waar
      het schip ligplaats kiest. Die gemeente geldt als gemeente waar het kind is geboren.

      2 In geval van geboorte tijdens een zeereis met een in Nederland geregistreerd vaartuig, dan wel tijdens een
      internationale luchtreis met een in Nederland geregistreerd luchtvaartuig, is de gezagvoerder van het vaartuig
      of het luchtvaartuig verplicht een voorlopige akte van geboorte binnen vierentwintig uur in het journaal in te
      schrijven in tegenwoordigheid van twee getuigen en zo mogelijk van de vader. De gezagvoerder zendt een afschrift
      van die akte zo spoedig mogelijk aan de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage. Deze
      maakt de akte van geboorte op aan de hand van het ontvangen afschrift, met dien verstande dat hij gegevens die
      ontbreken of hem blijken onjuist te zijn, zoveel mogelijk aanvult of verbetert. Aan de personen op wie de akte
      betrekking heeft, wordt een uittreksel van de akte toegezonden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel19a
  - number: 19b
    text: |-
      Indien de plaats of de dag van de geboorte van het kind niet bekend is dan wel indien de naam, met inbegrip van
      de voornamen, van de moeder uit wie het kind is geboren niet bekend is, wordt de geboorteakte ten aanzien van deze
      punten opgemaakt krachtens een bevel en overeenkomstig de aanwijzingen van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel19b
  - number: 19c
    text: |-
      Zijn krachtens [artikel 5, tiende lid, van dit boek][ref1] in de akte een voorlopige voornaam en geslachtsnaam
      opgenomen, dan zendt de ambtenaar van de burgerlijke stand onverwijld een volledig afschrift van de akte aan Onze
      Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel5
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '5'
  - number: 19d
    text: |-
      1 Indien het geslacht van het kind twijfelachtig is, wordt een geboorteakte opgemaakt, waarin wordt vermeld dat het
      geslacht van het kind niet is kunnen worden vastgesteld.

      2 Binnen drie maanden na de geboorte, of, bij overlijden binnen die termijn, ter gelegenheid van de aangifte van
      het overlijden, wordt onder doorhaling van de in het eerste lid bedoelde akte een nieuwe geboorteakte opgemaakt,
      waarin het geslacht, indien dit inmiddels is vastgesteld, wordt vermeld aan de hand van een ter zake overgelegde
      medische verklaring.

      3 Is binnen de in het tweede lid genoemde termijn geen medische verklaring overgelegd, of blijkt uit de overgelegde
      medische verklaring dat het geslacht niet is kunnen worden vastgesteld, dan vermeldt de nieuwe geboorteakte dat het
      geslacht van het kind niet is kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel19d
  - number: 19e
    text: |-
      1 De aangifte van een geboorte kan in persoon of, als deze weg is geopend, elektronisch worden gedaan. Tot
      elektronische aangifte zijn uitsluitend bevoegd de moeder uit wie het kind is geboren en de vader van het kind.

      2 Tot de aangifte in persoon van een geboorte is bevoegd de moeder uit wie het kind is geboren.

      3 Tot de aangifte in persoon is verplicht de vader of de moeder uit wie het kind niet is geboren.

      4 Wanneer de persoon genoemd in het derde lid ontbreekt of verhinderd is de aangifte te doen, is tot aangifte
      verplicht:

      a. ieder die bij het ter wereld komen van het kind tegenwoordig is geweest;

      b. de bewoner van het huis waar de geboorte heeft plaats gehad, of indien zulks is geschied in een inrichting tot
      verpleging of verzorging bestemd, in een gevangenis of in een soortgelijke inrichting, het hoofd van die inrichting
      of een door hem bij onderhandse akte bijzonderlijk tot het doen van de aangifte aangewezen ondergeschikte.

      5 Voor een in het vierde lid, onder b, genoemde persoon bestaat de verplichting alleen indien een onder a genoemde
      persoon ontbreekt of verhinderd is.

      6 Wanneer tot de aangifte bevoegde of verplichte personen ontbreken of nalaten de aangifte te doen, geschiedt deze
      door of vanwege de burgemeester van de gemeente alwaar de geboorteakte moet worden opgemaakt.

      7 De verplichting tot aangifte moet worden vervuld binnen drie dagen na de dag der bevalling. Van een aangifte
      later dan de derde dag, bedoeld in de eerste zin van dit lid, wordt door de ambtenaar van de burgerlijke stand
      mededeling gedaan aan het openbaar ministerie.

      8 De ambtenaar van de burgerlijke stand stelt de identiteit van de aangever vast aan de hand van een document als
      bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1], dan wel op bij algemene maatregel van bestuur te
      bepalen andere wijze.

      9 De aangever verstrekt in ieder geval de volgende gegevens:

      a. de dag, de plaats en het tijdstip van de geboorte;

      b. het geslacht van het kind;

      c. de voornamen van het kind;

      d. de geslachtsnaam, de voornamen, de dag van geboorte, de woonplaats, het woonadres en

      e. zo mogelijk, het burgerservicenummer van de moeder uit wie het kind is geboren.

      10 Bij elektronische aangifte dient de moeder uit wie het kind is geboren haar burgerservicenummer op te geven en
      dient de vader zowel zijn burgerservicenummer als dat van de moeder uit wie het kind is geboren op te geven. Tevens
      dient de moeder uit wie het kind is geboren of de vader de juistheid van de in het negende lid, onder a, b en d
      genoemde gegevens te laten bevestigen door de betrokken arts of verloskundige.

      11 Bij de aangifte kan de ambtenaar van de burgerlijke stand zich doen overleggen een door de arts of de
      verloskundige die bij het ter wereld komen van het kind tegenwoordig was, opgemaakte verklaring dat het kind uit de
      als moeder opgegeven persoon is geboren. Is het kind buiten de tegenwoordigheid van een arts of verloskundige ter
      wereld gekomen, dan kan hij zich een door een zodanige hulpverlener nadien opgemaakte verklaring doen overleggen.

      12 Wordt geen gevolg gegeven aan het verzoek van de ambtenaar van de burgerlijke stand om overlegging van een
      verklaring als bedoeld in het elfde lid of is in de verklaring vermeld dat de identiteit van de moeder uit wie het
      kind is geboren onbekend is, dan is [artikel 19b][ref2] van toepassing.

      13 Voor de elektronische aangifte, geregeld in het eerste en tiende lid, wordt met «de vader» gelijkgesteld de
      moeder die niet de vrouw is uit wie het kind is geboren.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel19b
