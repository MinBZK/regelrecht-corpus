      1 Tenzij bij de onderbewindstelling anders is bepaald, omvat het bewind ook de goederen die geacht moeten worden in
      de plaats van een aan het bewind onderworpen goed te treden, benevens de vruchten en andere voordelen die een onder
      bewind staand goed oplevert.

      2 De kantonrechter kan, hetzij op verzoek van degene die gerechtigd is onderbewindstelling te verzoeken
      als bedoeld in [artikel 432, eerste en tweede lid][ref1], hetzij ambtshalve, het ingestelde bewind tot een
      of meer andere goederen van de rechthebbende uitbreiden of een of meer goederen uit het bewind ontslaan en
      ook alsnog bepalen dat de regel van het eerste lid voor een of meer goederen niet zal gelden, in welk geval
      [artikel 434, eerste lid][ref2], van overeenkomstige toepassing is. De kantonrechter kan tevens handelingen als
      bedoeld in [artikel 441, tweede lid, onder f][ref3] aanwijzen en de aanwijzing van zulke handelingen intrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel434
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel441
