  - number: '277'
    text: |-
      1 De rechtbank kan de ouder wiens gezag is beëindigd, op zijn verzoek in het gezag herstellen indien:

      a. herstel in het gezag in het belang van de minderjarige is, en

      b. de ouder duurzaam de verantwoordelijkheid voor de verzorging en opvoeding van de minderjarige, bedoeld in
      [artikel 247, tweede lid][ref1], in staat is te dragen.

      2 Indien ter gelegenheid van de beëindiging van het gezag het gezag aan de andere ouder is opgedragen, belast de
      rechtbank de ouder wiens gezag was beëindigd en deze alleen het in het eerste lid bedoelde verzoek doet, niet met
      het gezag, tenzij de omstandigheden na het nemen van de beschikking waarbij het gezag aan de andere ouder werd
      opgedragen, zijn gewijzigd of bij het nemen van de beschikking van onjuiste of onvolledige gegevens is uitgegaan.
      [Artikel 253e][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253e
