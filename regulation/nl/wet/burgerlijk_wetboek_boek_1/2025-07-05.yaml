      1 Indien een onderneming buiten de gemeenschap valt, komt ten bate van de gemeenschap een redelijke vergoeding voor
      de kennis, vaardigheden en arbeid die een echtgenoot ten behoeve van die onderneming heeft aangewend, voor zover
      een dergelijke vergoeding niet al op andere wijze ten bate van beide echtgenoten komt of is gekomen.

      2 Ook indien een onderneming op naam en voor rekening van een personenvennootschap of een rechtspersoon wordt
      uitgeoefend, de gerechtigdheid tot die personenvennootschap of die rechtspersoon buiten de gemeenschap valt
      en de echtgenoot die daartoe is gerechtigd, in overwegende mate bij machte is te bepalen dat de winsten van
      die onderneming hem rechtstreeks of middellijk ten goede komen, komt ten bate van de gemeenschap een redelijke
      vergoeding voor de kennis, vaardigheden en arbeid die een echtgenoot ten behoeve van die onderneming heeft
      aangewend, voor zover een dergelijke vergoeding niet al op andere wijze ten bate van beide echtgenoten komt of
      is gekomen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel95a
  - number: '96'
    text: |-
      1 Voor een schuld van een echtgenoot kunnen, ongeacht of deze in de gemeenschap is gevallen, zowel de goederen van
      de gemeenschap als zijn eigen goederen worden uitgewonnen.

      2 Voor een niet in de gemeenschap gevallen schuld van een echtgenoot kunnen de goederen van de gemeenschap niet
      worden uitgewonnen, indien de andere echtgenoot eigen goederen van eerstgenoemde aanwijst, die voldoende verhaal
      bieden. Voor een in de gemeenschap gevallen schuld van een echtgenoot kunnen de eigen goederen van deze echtgenoot
      niet worden uitgewonnen, indien hij goederen van de gemeenschap aanwijst, die voldoende verhaal bieden.

      3 Het verhaal op de goederen van de gemeenschap voor een niet tot de gemeenschap behorende schuld van een
      echtgenoot is beperkt tot de helft van de opbrengst van het uitgewonnen goed. De andere helft komt de andere
      echtgenoot toe en valt voortaan buiten de gemeenschap. De andere echtgenoot is bevoegd, indien een schuldeiser
      verhaal op een goed van de gemeenschap zoekt ter zake van een niet tot de gemeenschap behorende schuld, het goed
      waarop de schuldeiser verhaal zoekt, over te nemen tegen betaling van de helft van de waarde van dat goed uit zijn
      eigen vermogen. Vanaf het tijdstip van de overneming is dit een eigen goed van deze echtgenoot, dat niet in de
      gemeenschap valt.

      4 De echtgenoot uit wiens eigen goederen een schuld van de gemeenschap is voldaan, heeft deswege recht op
      vergoeding uit de goederen van de gemeenschap. Betreft het een schuld ter zake van een tot de gemeenschap behorend
      goed, dan wordt het beloop van de vergoeding bepaald overeenkomstig [artikel 87, tweede en derde lid][ref1].

      5 De echtgenoot wiens niet in de gemeenschap gevallen schuld uit goederen van de gemeenschap is
      voldaan, is deswege gehouden tot vergoeding aan de gemeenschap. Betreft het een schuld ter zake van een
      tot zijn eigen vermogen behorend goed, dan wordt het beloop van de vergoeding bepaald overeenkomstig
      [artikel 87, tweede en derde lid][ref2].

      6 De echtgenoot die een schuldeiser tegenwerpt dat een goed waarop deze verhaal zoekt niet behoort tot de
      gemeenschap, draagt daarvan de bewijslast.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel87
