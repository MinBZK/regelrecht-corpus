  - number: 28c
    text: |-
      1 De wijziging van de vermelding van het geslacht in de akte van geboorte heeft haar gevolgen, die uit dit boek
      voortvloeien, vanaf de dag waarop de ambtenaar van de burgerlijke stand aan de akte van geboorte een latere
      vermelding van wijziging van het geslacht toevoegt. Dit tijdstip geldt eveneens voor de wijziging van de voornamen,
      bedoeld in [artikel 28b, tweede lid][ref1].

      2 De wijziging van de vermelding van het geslacht laat de op het in het eerste lid genoemde tijdstip bestaande
      familierechtelijke betrekkingen en de daaruit voortvloeiende op dit boek gegronde rechten, bevoegdheden en
      verplichtingen onverlet.

      3 Indien de betrokkene na de wijziging van de vermelding van het geslacht een kind baart, wordt voor de toepassing
      van [titel 11][ref2] en hetgeen daaruit voortvloeit uitgegaan van het geslacht dat deze voor de wijziging had. In
      geval van adoptie van een kind op verzoek van degene die dit na de wijziging van de vermelding van het geslacht
      heeft verwekt of heeft ingestemd met een daad die de verwekking van het kind met eigen zaad tot gevolg heeft gehad,
      en het kind is of wordt geboren binnen de relatie van de adoptant en de ouder, is de maatstaf van het vierde lid
      van [artikel 227][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel28b
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel227
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel28c
