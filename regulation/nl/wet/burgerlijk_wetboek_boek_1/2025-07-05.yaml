        artikel: 80c
  - number: 253b
    text: |-
      1 Indien ten aanzien van een kind alleen het moederschap vaststaat van de vrouw uit wie het kind is geboren
      of indien de ouders van een kind niet met elkaar gehuwd zijn dan wel gehuwd zijn geweest en zij het gezag niet
      gezamenlijk uitoefenen, oefent de moeder uit wie het kind is geboren van rechtswege het gezag over het kind alleen
      uit, tenzij zij bij haar bevalling onbevoegd tot het gezag was.

      2 De in het eerste lid bedoelde moeder die ten tijde van haar bevalling onbevoegd was tot het gezag, verkrijgt dit
      van rechtswege op het tijdstip waarop zij daartoe bevoegd wordt, tenzij op dat tijdstip een ander met het gezag
      is belast.

      3 Indien op bedoeld tijdstip een ander het gezag heeft, kan de tot het gezag bevoegde ouder de rechtbank verzoeken
      hem met het gezag over het kind te belasten.

      4 Wanneer de andere ouder het gezag over het kind uitoefent, wordt dit verzoek slechts ingewilligd, indien de
      rechter dit in het belang van het kind wenselijk oordeelt.

      5 Wanneer een voogd het gezag over het kind uitoefent, wordt het verzoek slechts afgewezen, indien gegronde vrees
      bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253b
  - number: 253c
    text: |-
      1 De tot het gezag bevoegde ouder van het kind, die nimmer het gezag gezamenlijk met de moeder uit wie het kind is
      geboren heeft uitgeoefend, kan de rechtbank verzoeken de ouders met het gezamenlijk gezag dan wel hem alleen met
      het gezag over het kind te belasten.

      2 Indien het verzoek ertoe strekt de ouders met het gezamenlijk gezag te belasten en de andere ouder met
      gezamenlijk gezag niet instemt, wordt het verzoek slechts afgewezen indien:

      a. er een onaanvaardbaar risico is dat het kind klem of verloren zou raken tussen de ouders en niet te verwachten
      is dat hierin binnen afzienbare tijd voldoende verbetering zou komen, of

      b. afwijzing anderszins in het belang van het kind noodzakelijk is.

      3 Wanneer de andere ouder het gezag over het kind uitoefent, wordt het verzoek om de tot het gezag bevoegde ouder,
      bedoeld in het eerste lid, alleen met het gezag te belasten slechts ingewilligd, indien de rechtbank dit in het
      belang van het kind wenselijk oordeelt.

      4 Wanneer niet in het gezag is voorzien of wanneer een voogd het gezag uitoefent, wordt het verzoek om de tot
      het gezag bevoegde ouder, bedoeld in het eerste lid, alleen met het gezag te belasten slechts afgewezen, indien
      gegronde vrees bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.

      5 Een verzoek om de ouders met het gezamenlijk gezag te belasten als bedoeld in het eerste lid, kan ook door de
      moeder uit wie het kind is geboren worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253c
  - number: 253d
    text: |-
      1 Indien de voorziening in het gezag over een kind, bedoeld in [artikel 253b, eerste lid][ref1], komt te
      ontbreken, kunnen beide ouders voor zover zij tot het gezag bevoegd zijn – de rechtbank verzoeken met het gezag
      onderscheidenlijk gezamenlijk gezag te worden belast.

      2 Het in het eerste lid bedoelde verzoek wordt slechts afgewezen, indien gegronde vrees bestaat dat bij inwilliging
      de belangen van het kind zouden worden verwaarloosd.

      3 Hebben beiden een verzoek ingediend anders dan tot gezamenlijke gezagsuitoefening, dan willigt de rechter het
      verzoek in van degene wiens gezag over het kind hij het meeste in het belang van het kind oordeelt.

      4 Indien, voordat over het verzoek van één ouder is beslist, de andere ouder van rechtswege het gezag over het kind
      verkrijgt, willigt de rechter het verzoek slechts in, indien hij dit in het belang van het kind wenselijk oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253b
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253d
