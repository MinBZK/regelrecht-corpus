  - number: '451'
    text: |-
      1 Het mentorschap kan worden verzocht door de betrokken persoon, zijn echtgenoot, zijn geregistreerde partner
      dan wel andere levensgezel, zijn bloedverwanten in de rechte lijn en die in de zijlijn tot en met de vierde
      graad, degene die ingevolge [artikel 253sa][ref1] of [253t][ref2] het gezag over de betrokken persoon uitoefent,
      zijn voogd, zijn curator of zijn bewindvoerder als bedoeld in [titel 19][ref3] van dit boek. In het in
      [artikel 450, derde lid][ref4], van dit boek bedoelde geval kan het mentorschap uitsluitend worden verzocht door
      de betrokkene.

      2 Het mentorschap kan, behoudens in het in [artikel 450, derde lid][ref5], bedoelde geval, voorts worden verzocht
      door het openbaar ministerie en door de instelling waar de betrokkene wordt verzorgd of die aan de betrokkene
      begeleiding biedt. In het laatste geval wordt in het verzoekschrift tevens vermeld waarom de in het eerste lid
      genoemde personen - bloedverwanten in de zijlijn in de derde en vierde graad daaronder niet begrepen - niet tot
      indiening van een verzoek zijn overgegaan.

      3 De rechter bij wie een verzoek tot ondercuratelestelling of tot opheffing van de curatele aanhangig is, kan bij
      afwijzing onderscheidenlijk bij inwilliging daarvan ambtshalve overgaan tot instelling van het mentorschap.

      4 Een verzoek tot omzetting van curatele in mentorschap ten behoeve van een persoon die onder curatele is gesteld,
      wordt aanhangig gemaakt bij de rechter die bevoegd is over opheffing van de curatele te beslissen. Deze rechter
      kan, bij opheffing van de curatele, ook ambtshalve overgaan tot instelling van het mentorschap.

      5 Het mentorschap treedt in werking daags nadat de beschikking is verstrekt of verzonden, tenzij de beschikking een
      later tijdstip van ingang vermeldt. In het geval, bedoeld in [artikel 450, tweede lid][ref6], van dit boek treedt
      het mentorschap in werking op het tijdstip waarop de betrokken persoon meerderjarig wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
      [ref3]: https://wetten.overheid.nl/BWBR0002656
