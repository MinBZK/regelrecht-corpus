        bwb_id: BWBR0034925
        artikel: 4.1.3
  - number: '266'
    text: |-
      1 De rechtbank kan het gezag van een ouder beëindigen indien:

      a. een minderjarige zodanig opgroeit dat hij in zijn ontwikkeling ernstig wordt bedreigd, en de ouder niet de
      verantwoordelijkheid voor de verzorging en opvoeding, bedoeld in [artikel 247, tweede lid][ref1], in staat is te
      dragen binnen een voor de persoon en de ontwikkeling van de minderjarige aanvaardbaar te achten termijn, of

      b. de ouder het gezag misbruikt.

      2 Het gezag van de ouder kan ook worden beëindigd indien het gezag is geschorst, mits aan het eerste lid is
      voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel266
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '247'
        afdeling: '1'
  - number: '267'
    text: |-
      1 Beëindiging van het gezag kan worden uitgesproken op verzoek van de raad voor de kinderbescherming of het
      openbaar ministerie. Tevens is degene die niet de ouder is en de minderjarige gedurende ten minste een jaar
      als behorende tot zijn gezin verzorgt en opvoedt bevoegd tot het doen van het verzoek indien de raad voor de
      kinderbescherming niet tot een verzoek overgaat.

      2 Indien de raad niet tot een verzoek als bedoeld in het eerste lid overgaat nadat hij een verzoek tot onderzoek
      hiertoe van de gecertificeerde instelling die de ondertoezichtstelling over de minderjarige uitvoert, heeft
      ontvangen, deelt hij dit schriftelijk mee aan die gecertificeerde instelling. De gecertificeerde instelling kan
      na ontvangst van die mededeling de raad voor de kinderbescherming verzoeken het oordeel van de rechtbank te vragen
      of beëindiging van het gezag het noodzakelijk is. De raad voor de kinderbescherming die van de gecertificeerde
      instelling zodanig verzoek ontvangt, vraagt binnen twee weken na de dagtekening van dat verzoek het oordeel van de
      rechtbank of een beëindiging van het gezag moet volgen. In dat geval kan de rechtbank de beëindiging van het gezag
      ambtshalve uitspreken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel267
  - number: 267a
    text: |-
      De rechtbank die een verzoek tot beëindiging van het gezag afwijst, kan een minderjarige onder toezicht te stellen
      als bedoeld in [artikel 255][ref1] mits aan de grond hiervoor is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel267a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '255'
        afdeling: '4'
  - number: '268'
    text: |-
      1 De rechtbank kan een ouder geheel of gedeeltelijk in de uitoefening van het gezag schorsen indien:

      a. een ernstig vermoeden bestaat dat de grond, bedoeld in [artikel 266, eerste lid, aanhef en onder a of b][ref1]
      is vervuld en de maatregel noodzakelijk is om een acute en ernstige bedreiging voor de minderjarige weg te nemen,
      of

      b. een medische behandeling van een minderjarige jonger dan twaalf jaar of van de minderjarige van twaalf jaar of
      ouder die niet in staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake, noodzakelijk
      is om ernstig gevaar voor diens gezondheid af te wenden en een ouder die het gezag uitoefent toestemming daarvoor
      weigert.

      2 Indien de ouders gezamenlijk het gezag uitoefenen, wordt gedurende de schorsing van het gezag van één van hen het
      gezag door de andere ouder alleen uitgeoefend, tenzij de kinderrechter een gecertificeerde instelling als bedoeld
      in [artikel 1.1 van de Jeugdwet][ref2], met de voorlopige voogdij over de minderjarige belast. In dat geval is ook
      het gezag van deze ouder geschorst.

      3 Betreft de schorsing beide ouders of een ouder die alleen het gezag uitoefent, dan belast de rechtbank een
      gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref3], met de voorlopige voogdij over de
      minderjarige. De gecertificeerde instelling heeft de bevoegdheden van een voogd.

      4 [Artikel 267][ref4] is van overeenkomstige toepassing.

      5 De schorsing in de uitoefening van het gezag vervalt na verloop van drie maanden na de dag van de beschikking,
      tenzij voor het einde van deze termijn beëindiging van het gezag is verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel267
