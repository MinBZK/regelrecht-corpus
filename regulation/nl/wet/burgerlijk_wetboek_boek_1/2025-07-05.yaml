  - number: 253f
    text: |-
      Na de dood van een der ouders oefent de overlevende ouder van rechtswege het gezag over de kinderen uit, indien en
      voor zover hij op het tijdstip van overlijden het gezag uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253f
  - number: 253g
    text: |-
      1 Indien van de ouders diegene overlijdt die het gezag over hun minderjarige kinderen alleen uitoefent, bepaalt de
      rechter dat de overlevende ouder of een derde met het gezag over deze kinderen wordt belast.

      2 De rechter doet dit op verzoek van de raad voor de kinderbescherming, de overlevende ouder of ambtshalve.

      3 Het verzoek om de overlevende ouder met het gezag te belasten wordt slechts afgewezen, indien de rechter oordeelt
      dat het belang van de minderjarige zich tegen inwilliging verzet.

      4 Het derde lid is mede van toepassing indien de overleden ouder een voogd had aangewezen overeenkomstig
      [artikel 292][ref1] van dit boek.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel292
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253g
