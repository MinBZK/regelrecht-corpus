        artikel: 377a
  - number: 265h
    text: |-
      1 Indien een medische behandeling van een minderjarige jonger dan twaalf jaar noodzakelijk is om ernstig gevaar
      voor diens gezondheid af te wenden en de ouder die het gezag uitoefent zijn toestemming daarvoor weigert, kan deze
      toestemming op verzoek van de gecertificeerde instelling worden vervangen door die van de kinderrechter.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van een medische behandeling van een minderjarige
      van twaalf jaar of ouder die niet in staat kan worden geacht tot een redelijke waardering van zijn belangen ter
      zake.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel265h
  - number: 265i
    text: |-
      1 De gecertificeerde instelling behoeft de toestemming van de kinderrechter voor wijziging in het verblijf van een
      minderjarige die ten minste een jaar door een ander dan de ouder is opgevoed en verzorgd als behorende tot zijn
      gezin.

      2 De toestemming wordt door de kinderrechter op verzoek van de gecertificeerde instelling verleend en slechts
      afgewezen indien de kinderrechter dit in het belang van de minderjarige noodzakelijk oordeelt.

      3 Indien de kinderrechter het verzoek, bedoeld in het tweede lid, afwijst, kan hij tevens bepalen dat de
      ondertoezichtstelling en de machtiging tot uithuisplaatsing van kracht blijven voor ten hoogste een jaar. De
      gecertificeerde instelling is gehouden de machtiging tot uithuisplaatsing ten uitvoer te leggen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel265i
  - number: 265j
    text: |-
      1 Indien de gecertificeerde instelling oordeelt dat niet-verlenging van de ondertoezichtstelling, bedoeld
      in [artikel 260, tweede lid][ref1], of niet-verlenging van de machtiging tot uithuisplaatsing, bedoeld in
      [artikel 265c, tweede lid][ref2], aangewezen is, doet zij hiervan tijdig doch uiterlijk twee maanden voor het
      verstrijken van de duur van de ondertoezichtstelling of machtiging tot uithuisplaatsing en onder overlegging van
      een verslag van het verloop van de ondertoezichtstelling of de uithuisplaatsing mededeling aan de raad voor de
      kinderbescherming.

      2 De gecertificeerde instelling kan een uithuisplaatsing gedurende de termijn waarvoor zij is toegestaan
      beëindigen. De gecertificeerde instelling doet van het voornemen daartoe tijdig doch uiterlijk een maand voor het
      voorgenomen tijdstip van beëindiging en onder overlegging van een verslag van het verloop van de uithuisplaatsing,
      mededeling aan de raad voor de kinderbescherming.

      3 Indien een ondertoezichtstelling met uithuisplaatsing twee jaar of langer heeft geduurd, gaat het verzoek tot
      verlenging van de ondertoezichtstelling en uithuisplaatsing van de gecertificeerde instelling vergezeld van een
      advies van de raad voor de kinderbescherming met betrekking tot de verlenging van die ondertoezichtstelling. De
      gecertificeerde instelling doet van het voornemen tot een voornoemd verzoek tijdig doch uiterlijk twee maanden voor
      het verstrijken van de ondertoezichtstelling mededeling aan de raad voor de kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel260
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel265c
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel265j
