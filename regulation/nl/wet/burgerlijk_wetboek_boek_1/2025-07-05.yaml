  - number: 19i
    text: |-
      1 Wanneer een kind levenloos ter wereld is gekomen, wordt een akte opgemaakt, die in het register van overlijden
      wordt opgenomen.

      2 Wanneer een kind binnen de in [artikel 19e, zevende lid][ref1], bepaalde termijn is overleden voordat aangifte
      van de geboorte is geschied, wordt zowel een akte van geboorte als een akte van overlijden opgemaakt.

      3 In de in de vorige leden bedoelde gevallen is ten aanzien van de aangifte het bepaalde in [artikel 19h][ref2] van
      overeenkomstige toepassing. In het in het tweede lid bedoelde geval blijft [artikel 19e][ref3] buiten toepassing.

      4 In het geval, bedoeld in het eerste lid, verstrekt de ambtenaar van de burgerlijke stand aan het Centraal Bureau
      voor de Statistiek zo spoedig mogelijk de gegevens betreffende dat kind, die zijn vermeld in het daartoe door hem
      te gebruiken formulier dat door Onze Minister van Veiligheid en Justitie is vastgesteld.


