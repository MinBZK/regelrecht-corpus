  - number: '256'
    text: |-
      1 De kinderrechter kan een minderjarige door of voor wie een aanvraag tot het verlenen van een verblijfsvergunning
      voor bepaalde tijd als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref1] is ingediend en die in verband
      daarmee in een centrum als bedoeld in [artikel 1, onder d, van de Wet Centraal Orgaan opvang asielzoekers][ref2]
      verblijft, onder toezicht stellen van een daartoe door Onze Minister van Justitie aanvaarde rechtspersoon.

      2 Onze Minister van Justitie kan voorwaarden stellen bij of voorschriften verbinden aan de aanvaarding, bedoeld in
      het eerste lid, en de rechtspersoon voor een bepaalde tijd aanvaarden.

      3 Op de ondertoezichtstelling en een rechtspersoon als bedoeld in het eerste lid zijn de bepalingen van de
      [afdelingen 4][ref3] en [5][ref4] alsmede [artikel 326][ref5] van overeenkomstige toepassing.

      4 In geval van vervanging van de rechtspersoon op grond van [artikel 259][ref6], wordt een gecertificeerde
      instelling benoemd die een contract of een subsidierelatie heeft met de gemeente waar de minderjarige zijn
      woonplaats als bedoeld in de [Jeugdwet][ref7] heeft. Hetzelfde geldt indien de rechtspersoon niet meer voldoet
      aan de eisen voor benoeming, bedoeld in het eerste lid, in welk geval de kinderrechter ambtshalve tot vervanging
      overgaat, tenzij voortzetting van de taken door bedoelde rechtspersoon om reden van continuïteit noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0006685#Artikel1
