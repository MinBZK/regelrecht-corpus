        afdeling: '5'
  - number: '280'
    text: |-
      De voogdij begint:

      a. voor de voogd die door een ouder is benoemd: op het tijdstip waarop hij zich na het overlijden van
      deze ouder bereid verklaart de voogdij te aanvaarden. De verklaring moet door de betrokkene in persoon
      of bij bijzondere gevolmachtigde worden afgelegd ter griffie van de rechtbank die overeenkomstig de
      [tweede afdeling van de derde titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      in zaken betreffende minderjarigen bevoegd is. De verklaring moet worden afgelegd binnen veertien dagen, of -
      indien de persoon, die de verklaring moet afleggen, zich buiten Nederland bevindt - binnen twee maanden, nadat de
      benoeming is betekend. Tot betekening kan iedere belanghebbende, alsmede de raad voor de kinderbescherming opdracht
      geven.

      b. voor de voogd die - nadat hij zich bereid heeft verklaard de voogdij te aanvaarden - door de rechter is
      benoemd: op de dag, waarop de beslissing die de benoeming inhoudt, in kracht van gewijsde is gegaan, of - zo
      deze uitvoerbaar bij voorraad is verklaard - daags nadat de beslissing die de benoeming inhoudt, is verstrekt of
      verzonden. Een mondelinge bereidverklaring geschiedt ten overstaan van de rechter die benoemt; een schriftelijke
      bereidverklaring wordt ingediend ter griffie waar de benoeming zal geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#AfdelingTweede
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel280
    references:
      - id: ref1
        bwb_id: BWBR0001827
        afdeling: Tweede
  - number: '281'
    text: |-
      1 De voogdij eindigt op de dag, waarop in kracht van gewijsde is gegaan de beschikking waarbij:

      a. de voogd is ontslagen of de voogdij is beëindigd;

      b. het gezag over de onder zijn voogdij staande minderjarige aan een of beide ouders is opgedragen; of

      c. de voogdij overeenkomstig [artikel 299a][ref1] van dit boek aan een andere voogd is opgedragen.

      2 Is een beschikking als in het eerste lid bedoeld, uitvoerbaar verklaard bij voorraad, dan eindigt de voogdij
      daags nadat de beschikking is verstrekt of verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel299a
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel281
