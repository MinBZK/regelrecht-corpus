  - number: '242'
    text: |-
      De raad voor de kinderbescherming stelt zich op de hoogte van alle gevallen, waarin maatregelen met betrekking tot
      het gezag over minderjarigen overwogen dienen te worden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel242
  - number: 242a
    text: |-
      Indien de ene ouder wordt verdacht van het doden van de andere ouder, of indien de ene ouder is veroordeeld wegens
      het doden van de andere ouder, stelt de raad voor de kinderbescherming een onderzoek in naar de wenselijkheid van
      een contact- of omgangsregeling van het kind met de ouder die wordt verdacht van of is veroordeeld wegens het doden
      van de andere ouder, zodra hij van de verdenking of veroordeling in kennis is gesteld. Op basis van dit onderzoek
      verzoekt de raad voor de kinderbescherming de kinderrechter om een contact- of omgangsregeling vast te stellen of
      om het contact of de omgang te ontzeggen. Een verzoek om het contact of de omgang te ontzeggen vermeldt tevens de
      duur van de verzochte ontzegging.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel242a
  - number: '243'
    text: |-
      1 De colleges van burgemeester en wethouders en ambtenaren van de burgerlijke stand verschaffen de raad voor de
      kinderbescherming kosteloos alle inlichtingen, en verstrekken de raad kosteloos alle afschriften en uittreksels uit
      hun registers, die de raad ter uitvoering van zijn taak van hen vraagt. Wanneer de raad voor de kinderbescherming
      een taak vervult of een bevoegdheid uitoefent op grond van een van de bepalingen van deze titel of van de
      [titels 9][ref1], [10][ref2], [14][ref3], [15][ref4] en [17 van dit boek][ref5], alsmede op grond van de daarmee
      verband houdende bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref6], verschaffen de bij algemene
      maatregel van bestuur aan te wijzen instanties of personen de raad kosteloos die inlichtingen die voor een goede
      uitoefening van hun taak noodzakelijk zijn.

      2 Alle verzoeken die de raad voor de kinderbescherming ter uitvoering van zijn taak tot de rechter richt, worden
      kosteloos behandeld; de grossen, afschriften en uittreksels, die hij tot dat doel aanvraagt, worden hem door de
      griffiers vrij van alle kosten uitgereikt.

      3 Exploten door de deurwaarders ten verzoeke van de raad voor de kinderbescherming uitgebracht, worden volgens het
      gewone tarief vergoed. Advocaten kunnen voor hun aan de raad voor de kinderbescherming bewezen diensten salaris in
      rekening brengen.

      4 Wanneer de raad voor de kinderbescherming op grond van een van de bepalingen van deze titel, of van de
      [titels 9][ref7], [10][ref8], [12][ref9], [14][ref10], [15][ref11] en [17 van dit boek][ref12] in rechte optreedt,
      kan hij dit zonder advocaat doen, behalve in zaken waarbij een vordering wordt ingesteld.


