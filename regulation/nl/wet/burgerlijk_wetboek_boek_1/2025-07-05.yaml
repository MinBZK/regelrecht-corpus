        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: '237'
    text: |-
      1 Een beschikking waarbij handlichting is verleend of ingetrokken, moet worden bekend gemaakt in de Staatscourant.

      2 In de bekendmaking moet nauwkeurig worden vermeld hoedanig, en tot welk einde zij is verleend. Vóór de
      bekendmaking werkt zomin de handlichting als haar intrekking tegen derden die hiervan onkundig waren.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel237
  - number: '238'
    text: |-
      1 Er is één raad voor de kinderbescherming.

      2 De wet bepaalt de taken en bevoegdheden van de raad voor de kinderbescherming. Deze worden door de raad voor de
      kinderbescherming namens onze Minister van Justitie uitgevoerd.

      3 Ten behoeve van de vervulling van zijn taak houdt de raad zich in ieder geval op de hoogte van de ontwikkeling
      van de kinderbescherming, bevordert hij de samenwerking met de instellingen van kinderbescherming en
      jeugdhulpverlening en dient hij op verzoek of uit eigen beweging autoriteiten en instellingen van advies.

      4 Zijn bemoeiingen laten de godsdienstige of levensbeschouwelijke grondslag van de instellingen van
      kinderbescherming onverlet.

      5 Bij algemene maatregel van bestuur worden de zetel, de werkwijze, voor zover het de samenwerking met de
      gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref1], betreft en de organisatie van de raad
      geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1.1'
  - number: '239'
    text: |-
      1 De raad voor de kinderbescherming kan optreden ten behoeve van minderjarigen die in Nederland hetzij hun
      woonplaats of laatste woonplaats, hetzij hun werkelijk verblijf hebben. Eveneens kan de raad optreden ten behoeve
      van Nederlandse minderjarigen die in Nederland noch woonplaats, noch laatste woonplaats, noch werkelijk verblijf
      hebben.

      2 Ten behoeve van de minderjarigen die binnen een arrondissement hetzij hun woonplaats of laatste woonplaats,
      hetzij hun werkelijk verblijf hebben, treden voor de raad voor de kinderbescherming de in dat arrondissement
      aanwezige werkeenheden van de raad op.

      3 Indien op grond van het vorige lid meer werkeenheden in verschillende arrondissementen bevoegd zouden zijn ten
      behoeve van een zelfde minderjarige op te treden, doet het optreden van een van deze werkeenheden de bevoegdheid
      van de ander eindigen.

      4 Ten behoeve van Nederlandse minderjarigen, die in Nederland noch woonplaats, noch laatste woonplaats, noch
      werkelijk verblijf hebben, treden de werkeenheden van de raad in het arrondissement Amsterdam op voor de raad voor
      de kinderbescherming.

      5 Bij algemene maatregel van bestuur wordt de behandeling van klachten ter zake van een bij de raad in behandeling
      zijnde of geweest zijnde aangelegenheid van kinderbescherming geregeld.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel239
  - number: '240'
    text: |-
      Degene die op grond van een wettelijk voorschrift of op grond van zijn ambt of beroep tot geheimhouding is
      verplicht kan, zonder toestemming van degene die het betreft, aan de raad voor de kinderbescherming inlichtingen
      verstrekken, indien dit noodzakelijk kan worden geacht voor de uitoefening van de taken van de raad.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel240
  - number: '241'
    text: |-
      1 Indien de raad voor de kinderbescherming blijkt, dat een minderjarige niet onder het wettelijk vereiste gezag
      staat, of dat dit gezag niet over hem wordt uitgeoefend, verzoekt hij de rechter in de gezagsuitoefening over deze
      minderjarige te voorzien.

      2 De kinderrechter kan op verzoek van de raad voor de kinderbescherming of het openbaar ministerie een
      gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1], belasten met de voorlopige
      voogdij over de minderjarige indien het dringend en onverwijld noodzakelijk is om in de gezagsuitoefening over de
      minderjarige te voorzien teneinde de belangen van de minderjarige te kunnen behartigen.

      3 De in het tweede lid bedoelde maatregel kan eveneens worden getroffen indien een minderjarige, die de leeftijd
      van zes maanden nog niet bereikt heeft en niet staat onder voogdij van een rechtspersoon, zonder voorafgaande
      schriftelijke toestemming van de raad voor de kinderbescherming als pleegkind is opgenomen. Onder pleegkind wordt
      in dit verband verstaan: een minderjarige die bij anderen dan zijn ouders, voogd of bloed- en aanverwanten tot en
      met de derde graad wordt verzorgd en opgevoed, met dien verstande, dat daaronder niet is begrepen:

      a. een minderjarige, op wiens verzorging en opvoeding krachtens de bepalingen van een andere wet toezicht wordt
      uitgeoefend door anderen dan zijn ouders of voogd;

      b. een minderjarige, die verzorgd en opgevoed wordt in een inrichting, welke, wat betreft de verzorging en
      opvoeding van de daarin verblijvende minderjarigen, aan toezicht krachtens de bepalingen van een andere wet is
      onderworpen.

      4 De maatregel vervalt na verloop van drie maanden na de dag van de beschikking, tenzij voor het einde van deze
      termijn om een voorziening in het gezag over de minderjarige is verzocht.

      5 De maatregel kan worden ingetrokken of gewijzigd door de kinderrechter die haar heeft bevolen tenzij een verzoek
      als bedoeld in het vierde lid is ingediend. In dat geval beslist de rechter bij wie dit verzoek aanhangig is.

      6 In afwijking van het tweede lid kan de kinderrechter de voorlopige voogdij over een minderjarige door
      of voor wie een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref2] is ingediend, en in verband daarmee in Nederland verblijft, alsmede
      over door Onze Minister van Veiligheid en Justitie aan te wijzen categorieën andere minderjarigen, opdragen aan een
      rechtspersoon als bedoeld in [artikel 302, tweede lid][ref3].

      7 De raad voor de kinderbescherming kan een onderzoek instellen naar de leefsituatie van een minderjarige die
      duurzaam wordt verzorgd en opgevoed bij anderen dan degenen die het ouderlijke gezag of de voogdij over hem
      uitoefenen, het gezin waarin hij wordt verzorgd en opgevoed of de wijze waarop het gezag of de voogdij over
      hem wordt uitgeoefend, indien er een redelijk vermoeden bestaat dat de minderjarige in strijd met een wettelijk
      voorschrift in dat gezin is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel302
