  - number: '6'
    text: De geslachtsnaam wordt ten aanzien van een ieder dwingend bewezen door de akte van geboorte.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel6
  - number: '7'
    text: |-
      1 De geslachtsnaam van een persoon kan op zijn verzoek, of op verzoek van zijn wettelijke vertegenwoordiger, door
      de Koning worden gewijzigd.

      2 Hij wiens geslachtsnaam of voornamen niet bekend zijn, kan de Koning verzoeken voor hem een geslachtsnaam of
      voornamen vast te stellen.

      3 Een wijziging of vaststelling van de geslachtsnaam door de Koning heeft geen invloed op de geslachtsnaam van de
      kinderen van de betrokken persoon die voor de datum van het besluit meerderjarig zijn geworden of die niet onder
      zijn gezag staan.

      4 Een wijziging of vaststelling van de geslachtsnaam door de Koning blijft in stand niettegenstaande een latere
      erkenning of een gerechtelijke vaststelling van het ouderschap.

      5 Bij algemene maatregel van bestuur worden regelen gesteld betreffende de gronden waarop de
      geslachtsnaamswijziging kan worden verleend, de wijze van indiening en behandeling van verzoeken als in het eerste
      en het tweede lid bedoeld en betreffende het voor wijziging van de geslachtsnaam verschuldigde recht.

      6 Indien Onze Minister van Justitie voornemens is een voordracht te doen voor een koninklijk besluit strekkende
      tot inwilliging van een verzoek als bedoeld in het eerste of tweede lid, deelt hij dit voornemen schriftelijk mee
      aan de verzoeker en degene wiens geslachtsnaam is verzocht, alsmede, indien het verzoek op de geslachtsnaam van een
      minderjarige betrekking heeft, zijn ouders en degene aan wie de minderjarige de geslachtsnaam, waarvan wijziging is
      verzocht, rechtstreeks ontleent. De schriftelijke mededeling van het voornemen geldt als een beschikking.

      7 Onze Minister van Justitie doet de schriftelijke mededeling van het voornemen binnen twintig weken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel7
  - number: '8'
    text: |-
      Hij die de naam van een ander zonder diens toestemming voert, handelt jegens die persoon onrechtmatig, wanneer hij
      daardoor de schijn wekt die ander te zijn of tot diens geslacht of gezin te behoren.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel8
  - number: '9'
    text: |-
      1 Een vrouw die gehuwd is of die gehuwd is geweest dan wel wier partnerschap geregistreerd is of is geweest en
      die niet is getrouwd na beëindiging van de registratie of is hertrouwd dan wel niet een geregistreerd partnerschap
      is aangegaan na beëindiging van het huwelijk of opnieuw is aangegaan, is steeds bevoegd de geslachtsnaam van haar
      echtgenoot of van haar geregistreerde partner te voeren of aan de hare te doen voorafgaan dan wel die te doen
      volgen op haar eigen geslachtsnaam.

      2 Indien het huwelijk door echtscheiding is ontbonden en daaruit geen afstammelingen in leven zijn dan wel
      indien het geregistreerd partnerschap op de wijze bedoeld in [artikel 80c, onder c of d][ref1], is beëindigd,
      kan de rechtbank, wanneer daartoe gegronde redenen bestaan, op verzoek van de gewezen echtgenoot of de gewezen
      geregistreerde partner aan de vrouw de haar in het eerste lid toegekende bevoegdheid ontnemen.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing ten aanzien van de man die gehuwd is of gehuwd
      is geweest dan wel wiens partnerschap geregistreerd is of is geweest en die niet is getrouwd na beëindiging van
      de registratie of is hertrouwd dan wel niet een geregistreerd partnerschap is aangegaan na beëindiging van het
      huwelijk of opnieuw is aangegaan.


