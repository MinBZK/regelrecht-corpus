  - number: '206'
    text: |-
      1 Nadat de beschikking houdende vernietiging van de erkenning in kracht van gewijsde is gegaan, wordt de erkenning
      geacht nimmer gevolg te hebben gehad.

      2 Te goeder trouw door derden verkregen rechten worden hierdoor nochtans niet geschaad.

      3 Door de vernietiging ontstaat geen vordering tot teruggave van de kosten van verzorging en opvoeding of
      van levensonderhoud en studie noch tot teruggave van het krachtens vruchtgenot genotene. Voorts ontstaat geen
      verplichting tot teruggave van genoten vermogensrechtelijke voordelen die uit de erkenning zijn voortgevloeid, voor
      zover degene die hen heeft genoten ten tijde van het instellen van het verzoek daardoor niet was gebaat.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel206
  - number: '207'
    text: |-
      1 Het ouderschap van een persoon kan, ook indien deze is overleden, op de grond dat deze de verwekker is van het
      kind of op de grond dat deze als levensgezel van de moeder ingestemd heeft met een daad die de verwekking van het
      kind tot gevolg kan hebben gehad, door de rechtbank worden vastgesteld op verzoek van:

      a. de moeder, tenzij het kind de leeftijd van zestien jaar heeft bereikt;

      b. het kind.

      2 Vaststelling van het ouderschap kan niet geschieden, indien:

      a. het kind twee ouders heeft;

      b. tussen de in de aanhef van het eerste lid bedoelde persoon en de moeder van het kind krachtens
      [artikel 41][ref1] geen huwelijk zou mogen worden gesloten;

      c. de in de aanhef van het eerste lid bedoelde persoon een minderjarige is die de leeftijd van zestien jaren nog
      niet heeft bereikt, tenzij hij voordat hij deze leeftijd heeft bereikt is overleden.

      3 Het verzoek wordt door de moeder ingediend binnen vijf jaren na de geboorte van het kind of, in geval van
      onbekendheid met de identiteit van de vermoedelijke verwekker dan wel van onbekendheid met zijn verblijfplaats,
      binnen vijf jaren na de dag waarop de identiteit en de verblijfplaats aan de moeder bekend zijn geworden.

      4 Overlijdt het kind voordat vaststelling van het ouderschap heeft kunnen plaatsvinden, dan kan een afstammeling
      van het kind in de eerste graad de vaststelling van het ouderschap aan de rechtbank verzoeken, mits de in de
      aanhef van het eerste lid bedoelde persoon, nog in leven is. Het verzoek wordt gedaan binnen een jaar na de dag van
      overlijden of binnen een jaar nadat het overlijden ter kennis van de verzoeker is gekomen.

      5 De vaststelling van het ouderschap, mits de beschikking daartoe in kracht van gewijsde is gegaan, werkt terug
      tot het moment van de geboorte van het kind. Te goeder trouw door derden verkregen rechten worden hierdoor nochtans
      niet geschaad. Voorts ontstaat geen verplichting tot teruggave van vermogensrechtelijke voordelen, voor zover
      degene die hen heeft genoten ten tijde van het doen van het verzoek daardoor niet was gebaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel41
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel207
