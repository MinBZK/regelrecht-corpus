  - number: '143'
    text: |-
      1 Vanaf de in het [eerste lid van artikel 142][ref1] vermelde tijdstippen kan ieder der echtgenoten verzoeken dat
      het te verrekenen vermogen van de andere echtgenoot wordt beschreven.

      2 De [artikelen 671 tot en met 676][ref2] en [679 van het Wetboek van Burgerlijke Rechtsvordering][ref3] zijn van
      overeenkomstige toepassing.

      3 Hetgeen in de vorige leden omtrent een echtgenoot is bepaald, geldt op overeenkomstige wijze na zijn overlijden
      voor zijn rechtverkrijgenden onder algemene titel.

      4 Van het eerste tot en met het derde lid kan niet worden afgeweken.


