  - number: '438'
    text: |-
      1 Tijdens het bewind komt het beheer over de onder bewind staande goederen niet toe aan de rechthebbende maar aan
      de bewindvoerder.

      2 Tijdens het bewind kan de rechthebbende slechts met medewerking van de bewindvoerder of, indien deze weigerachtig
      is, met machtiging van de kantonrechter over de onder het bewind staande goederen beschikken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel438
  - number: '439'
    text: |-
      1 Indien een rechtshandeling ongeldig is, omdat zij ondanks het bewind werd verricht door of gericht tot de
      rechthebbende, kan deze ongeldigheid aan de wederpartij slechts worden tegengeworpen, zo deze het bewind kende of
      had behoren te kennen.

      2 Indien een goed is vervreemd of bezwaard door iemand die daartoe ingevolge het bewind niet bevoegd was, kan deze
      onbevoegdheid aan een verkrijger van het goed of een beperkt recht daarop slechts worden tegengeworpen, zo deze het
      bewind kende of had behoren te kennen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel439
  - number: '440'
    text: |-
      1 Schulden die voortspruiten uit een handeling, tijdens het bewind met of jegens de rechthebbende, anders dan in
      overeenstemming met [artikel 438, tweede lid][ref1], verricht door een schuldeiser die het bewind kende of had
      behoren te kennen, kunnen niet op de onder het bewind staande goederen worden verhaald. Het einde van het bewind
      brengt hierin geen wijziging.

      2 Indien het bewind alle goederen betreft die daarvoor krachtens [artikel 431, eerste lid][ref2], in aanmerking
      komen, is het eerste lid van overeenkomstige toepassing ten aanzien van ten tijde van de handeling niet onder het
      bewind staande goederen waarop verhaal mogelijk zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel438
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel431
