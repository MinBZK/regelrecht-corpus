        artikel: '182'
  - number: '13'
    text: Het sterfhuis van een overledene is daar, waar hij zijn laatste woonplaats heeft gehad.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel13
  - number: '14'
    text: |-
      Een persoon die een kantoor of een filiaal houdt, heeft ten aanzien van aangelegenheden die dit kantoor of dit
      filiaal betreffen mede aldaar woonplaats.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel14
  - number: '15'
    text: |-
      Een persoon kan een andere woonplaats dan zijn werkelijke slechts kiezen, wanneer de wet hem daartoe
      verplicht, of wanneer de keuze bij schriftelijk of langs elektronische weg aangegane overeenkomst voor
      een of meer bepaalde rechtshandelingen of rechtsbetrekkingen geschiedt en voor de gekozen woonplaats een
      redelijk belang aanwezig is. Indien de keuze bij langs elektronische weg aangegane overeenkomst geschiedt, is
      [artikel 227a lid 1 van Boek 6][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel227a
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 227a
  - number: '16'
    text: |-
      1 In elke gemeente zijn twee, of, naar goedvinden van burgemeester en wethouders, meer ambtenaren van de
      burgerlijke stand. Daarenboven kunnen een of meer ambtenaren van de burgerlijke stand worden belast met het
      verrichten van bepaalde taken. Deze dragen de titel van buitengewoon ambtenaar van de burgerlijke stand.
      Een ambtenaar van de burgerlijke stand, die niet voldoet aan het in het tweede lid bedoelde vereiste van
      aanwijsbaarheid, wordt niet in aanmerking genomen voor de berekening van het in de eerste zin genoemde aantal.

      2 De in het eerste lid bedoelde ambtenaren worden door burgemeester en wethouders aangewezen. Een aanwijzing
      kan voor een bepaalde tijdsduur geschieden. De aanwijzing eindigt van rechtswege met ingang van de datum
      waarop de uitoefening van de functie van ambtenaar van de burgerlijke stand of buitengewoon ambtenaar
      van de burgerlijke stand eindigt. Als ambtenaar of buitengewoon ambtenaar van de burgerlijke stand is
      slechts aanwijsbaar de persoon die in de uitoefening van zijn ambt geen onderscheid maakt als bedoeld in
      [artikel 1 van de Algemene wet gelijke behandeling][ref1], tenzij het onderscheid is gebaseerd op een wettelijk
      voorschrift.

      3 Ambtenaar van de burgerlijke stand van een gemeente kan slechts zijn een ambtenaar in dienst van die
      gemeente, een andere gemeente of een openbaar lichaam of bedrijfsvoeringsorganisatie als bedoeld in
      [artikel 8 van de Wet gemeenschappelijke regelingen][ref2]. Buitengewoon ambtenaar van de burgerlijke stand kan
      mede zijn een persoon die geen ambtenaar in gemeentelijke dienst is.

      4 De ambtenaar of buitengewoon ambtenaar van de burgerlijke stand wordt tot zijn betrekking niet toegelaten dan na
      voor de rechtbank tot wier rechtsgebied de gemeente behoort waar hij voor het eerst wordt benoemd de navolgende eed
      dan wel belofte te hebben afgelegd:

      "Ik zweer (beloof) dat ik de betrekking van ambtenaar van de burgerlijke stand met eerlijkheid en nauwkeurigheid
      zal vervullen en dat ik de wettelijke voorschriften, de burgerlijke stand betreffende, met de meeste nauwgezetheid
      zal opvolgen; dat ik voorts, tot het verkrijgen van mijn aanstelling, middellijk noch onmiddellijk, onder enige
      naam of voorwendsel, aan iemand iets heb gegeven of beloofd, en dat ik, om iets in deze betrekking te doen of te
      laten, van niemand enige beloften of geschenken zal aannemen, middellijk of onmiddellijk. Zo waarlijk helpe mij God
      almachtig". ("Dat verklaar en beloof ik").

      5 Wanneer de eed dan wel belofte, bedoeld in het vierde lid, in de Friese taal wordt afgelegd, luidt de tekst van
      de eed dan wel belofte als volgt:

      «Ik swar (ûnthjit) dat ik de funksje fan amtner fan de boargerlike stân mei earlikheid en soarchfâldichheid
      útoefenje sil en dat ik de wetlike foarskriften oangeande de boargerlike stân op ’en sekuersten neikomme sil; dat
      ik fierders, foar it krijen fan myn oanstelling, streekrjocht noch midlik, ûnder hokker namme of útwynsel dan ek,
      oan immen eat jûn of tasein haw, en dat ik, om eat yn dizze funksje te dwaan of te litten, fan gjinien tasizzingen
      of geskinken, likefolle hokker, oannimme sil, midlik of streekrjocht. Sa wier helpe my God almachtich». («Dat
      ferklearje en ûnthjit ik»).


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
