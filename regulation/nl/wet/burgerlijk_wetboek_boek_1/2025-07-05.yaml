  - number: '322'
    text: |-
      1 Iedere voogd kan zich van zijn bediening doen ontslaan, indien:

      a. hij aantoont dat hij ten gevolge van een sedert de aanvang van zijn bediening opgekomen geestelijk of
      lichamelijk gebrek niet meer in staat is deze waar te nemen;

      b. hij de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1],
      heeft bereikt;

      c. een daartoe bevoegd persoon zich schriftelijk heeft bereid verklaard de voogdij over te nemen, en de rechtbank
      deze overneming in het belang van de minderjarigen acht.

      2 Bij gezamenlijke uitoefening van de voogdij is het eerste lid slechts van toepassing indien beide voogden zich
      van hun bediening willen doen ontslaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel322
    references:
