  - number: '229'
    text: |-
      1 Door adoptie komen de geadopteerde, de adoptiefouder en zijn bloedverwanten of de adoptiefouders en hun
      bloedverwanten in familierechtelijke betrekking tot elkaar te staan.

      2 Tegelijkertijd houdt de familierechtelijke betrekking tussen de geadopteerde, zijn oorspronkelijke ouders en hun
      bloedverwanten op te bestaan.

      3 In afwijking van het tweede lid blijft de familierechtelijke betrekking tussen de geadopteerde en zijn ouder en
      diens bloedverwanten bestaan, indien de echtgenoot, geregistreerde partner of andere levensgezel van die ouder het
      kind adopteert.

      4 De adoptiefouders die niet met elkaar zijn gehuwd of door een geregistreerd partnerschap zijn verbonden oefenen
      door adoptie het gezag over de geadopteerde gezamenlijk uit.

      5 Indien het kind op het tijdstip van de adoptie omgang heeft met een ouder ten aanzien van wie de
      familierechtelijke betrekking ophoudt te bestaan, kan de rechtbank bepalen dat zij gerechtigd blijven tot omgang
      met elkaar. De [artikelen 377a, tweede en derde lid][ref1], [377e][ref2] en [377g][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel377g
