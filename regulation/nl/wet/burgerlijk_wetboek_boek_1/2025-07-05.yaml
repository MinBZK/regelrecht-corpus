  - number: '371'
    text: De voogd is verplicht ter griffie van de rechtbank kennis te geven van elke verandering in zijn woonplaats.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel371
  - number: 371a
    text: |-
      1 De griffier van het gerecht dat een voogd benoemt, doet daarvan onverwijld mededeling aan de kantonrechter van de
      rechtbank van het arrondissement waarin de woonplaats van de voogd is gelegen.

      2 Woont de voogd niet meer in het arrondissement of is hij opgevolgd door een voogd in een ander arrondissement,
      dan zendt de griffier onverwijld de voogdijbescheiden naar de griffier van het arrondissement waar de voogd of
      opvolgende voogd woonplaats heeft, onder opgave van diens adres.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel371a
  - number: '372'
    text: |-
      Na het einde van zijn bewind doet de voogd daarvan onverwijld rekening en verantwoording. De kosten worden door de
      voogd betaald. Zij komen echter ten laste van de minderjarige. Voor zover de kosten niet op de minderjarige kunnen
      worden verhaald, komen zij ten laste van de ouders, en, zo zij ook op hen niet kunnen worden verhaald, ten laste
      van de Staat.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel372
  - number: '373'
    text: |-
      1 Deze rekening en verantwoording doet de voogd hetzij aan de meerderjarig gewordene, hetzij aan de erfgenamen van
      de minderjarige, wanneer deze overleden is, hetzij aan zijn opvolger in het bewind.

      2 Indien de gezamenlijke uitoefening van de voogdij is geëindigd en als gevolg daarvan het gezag wordt uitgeoefend
      door een van de voogden alleen, doet degene wiens voogdij geëindigd is rekening en verantwoording aan degene die de
      voogdij alleen uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel373
  - number: '374'
    text: |-
      1 Bedoelde rekening en verantwoording wordt afgelegd ten overstaan van de kantonrechter, binnen wiens rechtsgebied
      de voogd wiens bewind eindigt woonplaats heeft.

      2 Geschillen, die bij de aflegging van de rekening en verantwoording mochten rijzen, beslist de kantonrechter.

      3 Blijft een der partijen in gebreke tot deze aflegging van rekening en verantwoording mede te werken, dan zijn de
      [artikelen 771 en volgende van het Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel771
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel374
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '771'
  - number: '375'
    text: |-
      Een rechtshandeling die de meerderjarig gewordene betreffende de voogdij of de voogdijrekening richt tot of
      verricht met de voogd, is vernietigbaar, indien zij geschiedt vóór het afleggen van de rekening en verantwoording;
      alleen van de zijde van de meerderjarig gewordene kan een beroep op de vernietigingsgrond worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel375
  - number: '376'
    text: |-
      Wat de minderjarige aan de voogd schuldig blijft, draagt geen rente, zolang hij niet - na het sluiten der rekening
        - met de voldoening van het verschuldigde in verzuim is.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel376
  - number: '377'
    text: |-
      Elke rechtsvordering op grond van het gevoerde voogdijbewind - zowel van de zijde van de minderjarige als van die
      van de voogd - verjaart door verloop van vijf jaren na de dag, waarop de voogdij van laatstgenoemde is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel377
  - number: 377a
    text: |-
      1 Het kind heeft het recht op omgang met zijn ouders en met degene die in een nauwe persoonlijke betrekking tot hem
      staat. De niet met het gezag belaste ouder heeft het recht op en de verplichting tot omgang met zijn kind.

      2 De rechter stelt op verzoek van de ouders of van een van hen of degene die in een nauwe persoonlijke betrekking
      staat tot het kind, al dan niet voor bepaalde tijd, een regeling inzake de uitoefening van het omgangsrecht vast
      dan wel ontzegt, al dan niet voor bepaalde tijd, het recht op omgang.

      3 De rechter ontzegt het recht op omgang slechts, indien:

      a. omgang ernstig nadeel zou opleveren voor de geestelijke of lichamelijke ontwikkeling van het kind, of

      b. de ouder of degene die in een nauwe persoonlijke betrekking staat tot het kind kennelijk ongeschikt of kennelijk
      niet in staat moet worden geacht tot omgang, of

      c. het kind dat twaalf jaren of ouder is, bij zijn verhoor van ernstige bezwaren tegen omgang met zijn ouder of met
      degene met wie hij in een nauwe persoonlijke betrekking staat heeft doen blijken, of

      d. omgang anderszins in strijd is met zwaarwegende belangen van het kind.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel377a
  - number: 377b
    text: |-
      1 De ouder die met het gezag is belast, is gehouden de niet met het gezag belaste ouder op de hoogte te stellen
      omtrent gewichtige aangelegenheden met betrekking tot de persoon en het vermogen van het kind en deze te raadplegen
        - zo nodig door tussenkomst van derden - over daaromtrent te nemen beslissingen. Op verzoek van een ouder kan de
      rechter ter zake een regeling vaststellen.

      2 Indien het belang van het kind zulks vereist kan de rechter zowel op verzoek van de met het gezag belaste ouder
      als ambtshalve bepalen dat het eerste lid van dit artikel buiten toepassing blijft.

      3 [Artikel 377e][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel377b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377e
  - number: 377c
    text: |-
      1 Onverminderd het bepaalde in [artikel 377b][ref1] van dit boek wordt de niet met het gezag belaste ouder
      desgevraagd door derden die beroepshalve beschikken over informatie inzake belangrijke feiten en omstandigheden
      die de persoon van het kind of diens verzorging en opvoeding betreffen, daarvan op de hoogte gesteld, tenzij die
      derde de informatie niet op gelijke wijze zou verschaffen aan degene die met het gezag over het kind is belast dan
      wel bij wie het kind zijn gewone verblijfplaats heeft, of het belang van het kind zich tegen het verschaffen van
      informatie verzet.

      2 Indien de informatie is geweigerd, kan de rechter op verzoek van de in het eerste lid van dit artikel bedoelde
      ouder bepalen dat de informatie op de door hem aan te geven wijze moet worden verstrekt. De rechter wijst het
      verzoek in ieder geval af, indien het belang van het kind zich tegen het verschaffen van de informatie verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377b
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel377c
