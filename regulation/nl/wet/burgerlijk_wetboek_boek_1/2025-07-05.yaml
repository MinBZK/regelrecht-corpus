        artikel: 377b
  - number: 377d
    text: |-
      1 Onverminderd het bepaalde in het tweede lid van dit artikel, begint de uitoefening van het recht op omgang
      zodra de desbetreffende beschikking in kracht van gewijsde is gegaan of, indien zij uitvoerbaar bij voorraad is
      verklaard, daags nadat de beschikking is verstrekt of verzonden.

      2 De uitoefening van het recht op omgang begint, indien tevens een beschikking inzake het gezag is of wordt
      gegeven, niet eerder dan op het tijdstip waarop voor de andere ouder of voor de voogd het gezag is begonnen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel377d
  - number: 377e
    text: |-
      1 De rechtbank kan op verzoek van de ouders of van een van hen of van degene die in een nauwe persoonlijke
      betrekking staat tot het kind een beslissing inzake de omgang alsmede een door de ouders onderling getroffen
      omgangsregeling wijzigen op grond dat nadien de omstandigheden zijn gewijzigd, of dat bij het nemen van de
      beslissing van onjuiste of onvolledige gegevens is uitgegaan.

      2 De rechtbank kan op verzoek van een ouder, of van een biologische ouder die in een nauwe persoonlijke betrekking
      staat tot het kind, een beslissing waarbij de omgang is ontzegd tevens wijzigen na verloop van een periode van een
      jaar nadat de eerdere beschikking in kracht van gewijsde is gegaan.

      3 Indien de ene ouder wordt verdacht van het doden van de andere ouder, of indien de ene ouder is veroordeeld
      wegens het doden van de andere ouder, en de rechter heeft de omgang ontzegd voor een duur van twee jaar of meer,
      dan kan de rechter, in afwijking van het tweede lid, de beslissing waarbij de omgang is ontzegd, onverminderd het
      eerste lid, niet eerder wijzigen op verzoek van de ouder dan na verloop van een periode van twee jaar nadat de
      eerdere beschikking in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel377e
  - number: 377g
    text: |-
      De rechter kan, indien haar blijkt dat de minderjarige van twaalf jaar of ouder hierop prijs stelt, ambtshalve een
      beslissing geven op de voet van de [artikelen 377a][ref1] of [377b][ref2], dan wel zodanige beslissing op de voet
      van [artikel 377e][ref3] van dit boek wijzigen. Hetzelfde geldt indien de minderjarige de leeftijd van twaalf jaren
      nog niet heeft bereikt, maar in staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake.


