  - number: 331a
    text: |-
      In plaats van schorsing van de voogd in de uitoefening van de voogdij en voorziening in de voorlopige voogdij
      als bedoeld in [artikel 331][ref1], kan de rechtbank de minderjarige onder toezicht stellen als bedoeld in
      [artikel 255][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel331
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel331a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '331'
        paragraaf: '8'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '255'
        afdeling: '4'
  - number: 332a
    text: |-
      De rechtbank die een verzoek tot beëindiging van de voogdij afwijst, is bevoegd een minderjarige onder toezicht te
      stellen als bedoeld in [artikel 255][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel332a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '255'
        afdeling: '4'
  - number: '334'
    text: |-
      1 Indien de rechtbank de beëindiging van de voogdij uitspreekt, voorziet zij tevens in het gezag, behoudens het
      bepaalde in het derde lid.

      2 Ieder die tot de uitoefening van het gezag bevoegd is, kan tijdens het onderzoek schriftelijk aan de rechtbank
      verzoeken daarmede te worden belast.

      3 Indien sprake is van gezamenlijke uitoefening van de voogdij en de beëindiging van de voogdij slechts een van de
      voogden betreft, wordt de voogdij voortaan door de andere voogd alleen uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel334
  - number: '335'
    text: |-
      Degene van wie de voogdij is beëindigd op grond van [artikel 327, eerste lid, aanhef en onder a, b of c][ref1] kan
      niet wederom tot voogd over die minderjarige worden benoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel327
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel335
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '327'
        paragraaf: '8'
        afdeling: '6'
  - number: '336'
    text: De voogd draagt zorg, dat de minderjarige overeenkomstig diens vermogen wordt verzorgd en opgevoed.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel336
  - number: 336a
    text: |-
      1 Indien de minderjarige door een ander of anderen dan zijn voogd, als behorende tot het gezin met instemming van
      de voogd ten minste een jaar is verzorgd en opgevoed geworden, kan de voogd niet dan met toestemming van degenen
      die de verzorging en opvoeding op zich hebben genomen, wijziging in het verblijf van de minderjarige brengen.

      2 Voor zover de volgens het vorige lid vereiste toestemmingen niet worden verkregen, kunnen zij op verzoek van de
      voogd door die van de rechtbank worden vervangen. Dit verzoek wordt slechts ingewilligd indien de rechtbank dit in
      het belang van de minderjarige noodzakelijk oordeelt.

      3 In geval van afwijzing van het verzoek is de beschikking van kracht gedurende een door de rechtbank te bepalen
      termijn, welke de duur van zes maanden niet te boven mag gaan. Is echter voor het einde van deze termijn een
      verzoek tot ondertoezichtstelling van het kind, tot beëindiging van de voogdij, dan wel een verzoek als bedoeld in
      [artikel 299a, van dit boek][ref1] aanhangig gemaakt, dan blijft de beschikking gelden, totdat op het verzoek bij
      gewijsde is beslist.

      4 In geval van gezamenlijke uitoefening van de voogdij, wordt de in het eerste lid bedoelde instemming door beide
      voogden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel299a
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel336a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 299a
        paragraaf: '3'
        afdeling: '6'
  - number: '337'
    text: |-
      1 De voogd vertegenwoordigt de minderjarige in burgerlijke handelingen.

      2 De voogd moet het bewind over het vermogen van de minderjarige als een goed voogd voeren. Bij slecht bewind is
      hij voor de daardoor veroorzaakte schade aansprakelijk.

      3 Indien goederen die de minderjarige geschonken of vermaakt zijn, onder bewind zijn gesteld, is de voogd bevoegd
      van de bewindvoerder rekening en verantwoording te vorderen. Vervalt dit bewind, dan komen de goederen onder het
      bewind van de voogd.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel337
  - number: 337a
    text: |-
      1 In geval van gezamenlijke uitoefening van de voogdij worden de bevoegdheden die de voogd ingevolge de paragrafen
      10 en 11 heeft, gezamenlijk door de voogden uitgeoefend, met dien verstande dat de bevoegdheden ook aan een voogd
      alleen toekomen tenzij van bezwaren van de andere voogd is gebleken.

      2 De in bedoelde paragrafen genoemde verplichtingen rusten op ieder van de voogden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel337a
  - number: '338'
    text: |-
      1 De voogd zorgt dat het vermogen van de minderjarige, zoals dit bij het begin van zijn voogdij is samengesteld, zo
      spoedig mogelijk wordt geïnventariseerd.

      2 Binnen acht weken na het begin van zijn voogdij doet de voogd ter griffie van de rechtbank van het arrondissement
      waarin de woonplaats van de minderjarige is gelegen schriftelijk opgave van de bij dat begin aanwezige gerede
      gelden, effecten aan toonder en spaarbankboekjes.

      3 Binnen acht maanden na het begin van zijn voogdij levert de voogd een ter bevestiging van haar deugdelijkheid
      door hem ondertekende boedelbeschrijving in ter griffie van de rechtbank van het arrondissement waarin de
      woonplaats van de minderjarige is gelegen.

      4 In de boedelbeschrijving is begrepen een opgave van de wijzigingen in de samenstelling van het vermogen tot het
      ogenblik dat zij wordt opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel338
  - number: '339'
    text: |-
      1 Wanneer de goederen van de minderjarigen een waarde van € 11 250 niet te boven gaan, kan de voogd een door hem
      ondertekende, volgens een door Onze Minister van Justitie vastgesteld model opgemaakte, verklaring daaromtrent
      in plaats van de boedelbeschrijving inleveren. De voogd van twee of meer kinderen van dezelfde ouders kan met een
      zodanige verklaring slechts volstaan, wanneer bovendien de goederen der minderjarigen tezamen een waarde van € 22
      500 niet te boven gaan.

      2 De kantonrechter kan te allen tijde bepalen dat alsnog een beschrijving van het vermogen van de minderjarige,
      zoals dit op de datum van zijn beschikking is samengesteld, met overeenkomstige toepassing van het vorige artikel
      moet worden opgemaakt en ingeleverd.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel339
  - number: '340'
    text: |-
      1 De kantonrechter kan bij gebleken noodzakelijkheid een langere termijn voor de inlevering van een
      boedelbeschrijving of een verklaring, als bedoeld in het vorige artikel, stellen.

      2 Indien binnen de daarvoor gestelde termijn geen boedelbeschrijving, noch een verklaring als bedoeld in het vorige
      artikel is ingeleverd, doet de kantonrechter binnen tien dagen na het einde van die termijn de voogd ten verhore
      oproepen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel340
  - number: '341'
    text: |-
      1 In de boedelbeschrijving of in de verklaring, bedoeld in [artikel 339 van dit boek][ref1], moet de voogd opgeven
      wat hij van de minderjarige heeft te vorderen. Bij gebreke hiervan zal hij zijn vorderingsrecht niet voor diens
      meerderjarigheid kunnen uitoefenen.

      2 Zolang de voogd zijn vorderingsrecht niet kan uitoefenen, draagt de hoofdsom van zijn vordering geen rente.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel339
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel341
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
  - number: '342'
    text: |-
      1 De [artikelen 338 tot en met 341][ref1] zijn van overeenkomstige toepassing, wanneer de minderjarige gedurende de
      voogdij door schenking, erfopvolging of making vermogen krijgt.

      2 De inspecteur bij wie de aangifte voor het recht van successie, van overgang of van schenking moet worden
      ingediend, en aan wie ambtshalve bekend is dat de minderjarige vermogen heeft verkregen, is verplicht de
      kantonrechter van diens woonplaats hiervan te verwittigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel338
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel342
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '338'
        paragraaf: '10'
        afdeling: '6'
  - number: '343'
    text: |-
      De voogd kan, onverminderd zijn aansprakelijkheid voor de door zijn slecht bewind veroorzaakte schade, voor de
      minderjarige alle handelingen verrichten, die hij in diens belang noodzakelijk, nuttig of wenselijk acht, behoudens
      het bepaalde bij de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel343
  - number: '344'
    text: |-
      1 Voor zover de kantonrechter niet anders bepaalt, geeft de voogd de effecten aan toonder van de minderjarige in
      bewaring bij:

      a. de Nederlandsche Bank N.V.;

      b. een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van
      bank mag uitoefenen;

      2 De kantonrechter kan aanwijzingen geven omtrent de wijze, waarop spaarbankboekjes en gelden van de
      minderjarige moeten worden bewaard. De kantonrechter onder wiens goedkeuring een verdeling tot stand komt, kan
      ter gelegenheid daarvan aanwijzingen als hier bedoeld geven. Overigens is de kantonrechter, aangewezen in de
      [tweede afdeling van de derde titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering][ref2]
      bevoegd.

      3 Voor effecten aan toonder, spaarbankboekjes en gelden, die de minderjarige tezamen met een of meer andere
      personen toekomen, geldt het bepaalde in de vorige leden, wanneer de voogd die onder zijn berusting heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0001827#AfdelingTweede
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel344
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0001827
        afdeling: Tweede
  - number: '345'
    text: |-
      1 De voogd behoeft machtiging van de kantonrechter om de navolgende handelingen voor rekening van de minderjarige
      te verrichten:

      a. aangaan van overeenkomsten strekkende tot beschikking over goederen van de minderjarige, tenzij de handeling
      geld betreft, als een gewone beheersdaad kan worden beschouwd, of krachtens rechterlijk bevel geschiedt;

      b. giften doen, andere dan gebruikelijke, niet bovenmatige;

      c. een making of gift, waaraan lasten of voorwaarden zijn verbonden, aannemen;

      d. geld lenen of de minderjarige als borg of hoofdelijke medeschuldenaar verbinden;

      e. overeenkomen dat een boedel, waartoe de minderjarige gerechtigd is, voor een bepaalde tijd onverdeeld wordt
      gelaten.

      2 De kantonrechter kan bepalen dat de voogd zijn machtiging behoeft voor het innen van
      vorderingen van de minderjarige, het disponeren over saldi bij een bank als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1] daaronder begrepen.

      3 Voor het aangaan van een overeenkomst tot beëindiging van een geschil waarbij de minderjarige is betrokken,
      behoeft de voogd geen machtiging in het geval van [artikel 87 van het Wetboek van Burgerlijke Rechtsvordering][ref2]
      of indien het voorwerp van de onzekerheid of het geschil een waarde van € 700 niet te boven gaat, noch indien de
      overeenkomst als een beheersdaad is te beschouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel87
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel345
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 1:1
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '87'
  - number: '346'
    text: |-
      1 De voogd kan geen goederen van de minderjarige kopen, huren of pachten, zonder dat de kantonrechter de te sluiten
      overeenkomst goedkeurt.

      2 In geval van openbare verkoop, verhuur of verpachting moet de goedkeuring binnen een maand daarna zijn
      aangevraagd.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel346
  - number: '347'
    text: |-
      1 Een in strijd met [artikel 345][ref1] of [346][ref2] verrichte rechtshandeling ten name van de minderjarige is
      vernietigbaar; op de vernietigingsgrond kan slechts een beroep worden gedaan van de zijde van de minderjarige.

      2 Het vorige lid geldt niet voor een rechtshandeling anders dan om niet indien de wederpartij te goeder trouw was
      en voor een rechtshandeling die de minderjarige geen nadeel heeft berokkend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel345
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel346
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '345'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '346'
        paragraaf: '10'
        afdeling: '6'
  - number: '348'
    text: |-
      1 De voogd kan, zonder dat de kantonrechter de te sluiten overeenkomst goedkeurt, geen inschuld ten laste van de
      minderjarige, noch enig beperkt recht op diens goederen van een derde verkrijgen.

      2 Ontbreekt deze goedkeuring, dan is de overeenkomst nietig.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel348
  - number: '349'
    text: |-
      1 Een voogd die zonder machtiging van de kantonrechter voor de minderjarige als eiser in rechte optreedt of tegen
      een uitspraak beroep instelt, wordt niet-ontvankelijk verklaard.

      2 De voogd mag niet zonder machtiging van de kantonrechter in een tegen de minderjarige ingestelde eis of in een
      gedane uitspraak berusten.

      3 Hij kan, alvorens voor de minderjarige in rechte verweer te voeren of tegen een bij verstek gedane uitspraak
      verzet te doen, zich te zijner verantwoording doen machtigen door de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel349
  - number: '350'
    text: |-
      1 De voogd draagt zorg voor een doelmatige belegging van het vermogen van de minderjarige.

      2 Hij behoeft voor elke belegging van gelden van de minderjarige machtiging van de kantonrechter. Nochtans mag
      hij, voor zover de kantonrechter niet anders bepaalt, zonder diens machtiging gelden ten name van de minderjarige
      beleggen bij een financiële onderneming als bedoeld in [artikel 344, eerste lid, onderdeel b][ref1] op rekeningen
      bestemd voor de belegging van gelden van minderjarigen, met het beding dat de gelden alleen worden terugbetaald met
      machtiging van de kantonrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel344
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel350
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '344'
        paragraaf: '10'
        afdeling: '6'
  - number: '351'
    text: |-
      1 Wanneer het vermogen van de minderjarige of een gedeelte daarvan in een onderneming van handel, landbouw of
      nijverheid is geplaatst, mag de voogd de zaken voor rekening, hetzij van de minderjarige alleen, hetzij van deze
      met anderen, niet voortzetten dan met machtiging van de kantonrechter.

      2 Zonder machtiging van de kantonrechter mag de voogd een boedel, waartoe de minderjarige gerechtigd is, niet
      onverdeeld laten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel351
  - number: '352'
    text: |-
      Ondanks het ontbreken der vereiste machtiging zijn handelingen, door de voogd verricht in strijd met
      [artikel 350][ref1] of [artikel 351][ref2], geldig.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel350
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel351
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel352
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '350'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '351'
        paragraaf: '10'
        afdeling: '6'
  - number: '353'
    text: |-
      De voogd kan niet zonder machtiging van de kantonrechter van een de minderjarige toekomend aandeel in een ontbonden
      huwelijksgemeenschap afstand doen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel353
  - number: '354'
    text: |-
      De kantonrechter kan te allen tijde de voogd ten verhore doen oproepen. Deze is verplicht alle door de
      kantonrechter gewenste inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel354
  - number: '355'
    text: |-
      1 Aan een met het gezag belaste ouder of aan een ouder die alleen het bewind over het vermogen heeft en die
      aangifte heeft gedaan van zijn voornemen een huwelijk of een geregistreerd partnerschap aan te gaan, kan de
      kantonrechter opdragen binnen een bepaalde termijn een beschrijving van het vermogen van de kinderen op te maken en
      deze beschrijving of een afschrift daarvan ter griffie van de rechtbank in te leveren.

      2 De [artikelen 339][ref1], [340][ref2] en [341 van dit boek][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel339
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel340
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel341
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel355
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '340'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '341'
        paragraaf: '10'
        afdeling: '6'
  - number: '356'
    text: |-
      1 Aanwijzingen en machtigingen, als in deze paragraaf bedoeld, geeft de kantonrechter slechts, indien dit hem in
      het belang van de minderjarige noodzakelijk, nuttig of wenselijk blijkt te zijn. Hij kan een bijzondere of een
      algemene machtiging geven en daaraan zodanige voorwaarden verbinden, als hij dienstig oordeelt.

      2 Hij kan een gegeven aanwijzing of machtiging te allen tijde intrekken of de daaraan verbonden voorwaarden
      wijzigen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel356
  - number: '357'
    text: |-
      Indien de kosten van een ten behoeve van een minderjarige bevolen maatregel bij rechterlijke beschikking te diens
      laste zijn gebracht, treedt - ingeval dientengevolge het vermogen van de minderjarige moet worden aangesproken -
      in de plaats van de bij [artikel 345 van dit boek][ref1] bedoelde machtiging van de kantonrechter, diens aanwijzing
      van de goederen die verkocht of bezwaard zullen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel345
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel357
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '345'
        paragraaf: '10'
        afdeling: '6'
  - number: '358'
    text: |-
      1 De voogd mag alle noodzakelijke, betamelijke en behoorlijk gerechtvaardigde uitgaven aan de minderjarige in
      rekening brengen.

      2 Indien de kantonrechter een bedrag bepaalt, hetwelk jaarlijks mag worden besteed voor de verzorging en opvoeding
      van de minderjarige of voor de kosten van het beheer van diens vermogen, behoeft de voogd de besteding van dat
      bedrag niet gespecificeerd te verantwoorden.

      3 De kantonrechter kan de voogd een beloning ten laste van de minderjarige toekennen, indien hij dit gezien de
      zwaarte van de last van het bewind redelijk acht. Buiten dit geval mag de voogd voor zichzelf geen loon berekenen,
      tenzij hem dat is toegekend bij de akte, waarbij hij door een ouder benoemd is.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel358
  - number: '359'
    text: |-
      1 De kantonrechter kan te allen tijde op verzoek van de andere voogd of ambtshalve aan de voogd de verplichting
      opleggen jaarlijks of eens in de twee of drie jaren ter griffie van de rechtbank een rekening in te dienen van zijn
      bewind over de goederen van de minderjarige.

      2 De datum voor de indiening van de rekening wordt door de kantonrechter bepaald.

      3 Indien in het geval van gezamenlijke uitoefening van de voogdij een van de voogden de rekening alleen heeft
      ingediend, moet hij gelijktijdig een afschrift van de rekening aan de andere voogd doen toekomen. Deze kan binnen
      twee maanden bezwaren tegen de rekening bij de rechter indienen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel359
  - number: '360'
    text: |-
      1 Bij verschil van mening omtrent de rekening kan de kantonrechter verbetering daarvan gelasten.

      2 Hij kan een of meer deskundigen benoemen, ten einde de ingediende rekening te onderzoeken.

      3 De kantonrechter kan de kosten van dit onderzoek, indien slecht bewind aan het licht is gekomen, geheel of ten
      dele ten laste van de voogd brengen.

      4 De voogd ontvangt een afschrift van het door de deskundigen in te dienen schriftelijk bericht.

      5 In geval van gezamenlijke uitoefening van de voogdij ontvangen beide voogden het in het vierde lid bedoelde
      afschrift en kan de rechter de in het derde lid bedoelde kosten ook ten laste van de voogden gezamenlijk brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel360
  - number: '361'
    text: |-
      De periodiek door de voogd gedane rekening of een eensluidend afschrift daarvan blijft berusten ter griffie van
      de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel361
  - number: '362'
    text: |-
      De kantonrechter kan op verzoek van de andere voogd of ambtshalve de schade vaststellen, die blijkens de rekening
      de minderjarige door slecht bewind van de voogd geleden heeft, en deze laatste tot vergoeding daarvan veroordelen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel362
  - number: '363'
    text: |-
      1 De kantonrechter kan te allen tijde bevelen dat de voogd voor zijn bewind zekerheid stelt. Hij stelt het
      bedrag en de aard van de zekerheid vast. Inpandgeving van effecten aan toonder van de voogd geschiedt door hun
      inbewaargeving bij de Nederlandsche Bank.

      2 De kantonrechter bepaalt een redelijke termijn, binnen welke de voogd hem te zijnen genoegen moet aantonen dat
      hij de van hem verlangde zekerheid gesteld heeft.

      3 De kantonrechter kan de voogd toestaan een gestelde zekerheid door een andere te vervangen. Indien het belang
      van de voogd het vervallen van een gestelde zekerheid volstrekt eist of handhaving daarvan niet nodig is, kan de
      kantonrechter hem machtigen daarvan namens de minderjarige afstand te doen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel363
  - number: '364'
    text: |-
      1 De door de voogd gestelde zekerheid houdt op, zodra zijn rekening en verantwoording is goedgekeurd, of zodra de
      rechtsvorderingen die zijn bewind betreffen overeenkomstig [artikel 377 van dit boek][ref1] verjaard zijn.

      2 Alsdan worden op kosten van de minderjarige hypothecaire inschrijvingen doorgehaald en pandrechten op
      inschrijvingen in de schuldregisters voor geldleningen ten laste van het Rijk opgeheven.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel364
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '377'
        paragraaf: '11'
        afdeling: '6'
  - number: '365'
    text: |-
      Indien de voogd in gebreke blijft:

      a. gehoor te geven aan een oproeping van de kantonrechter om voor hem te verschijnen;

      b. een boedelbeschrijving of een verklaring als bedoeld in [artikel 339 van dit boek][ref1] in te leveren;

      c. op de door de kantonrechter bepaalde datum zijn periodieke rekening in te dienen;

      d. aan de minderjarige toebehorende spaarbankboekjes, gelden, of toondereffecten die hij niet te diens name heeft
      doen stellen, op de voorgeschreven wijze te bewaren;

      e. de kantonrechter het bewijs te leveren, dat hij een van hem verlangde zekerheid gesteld heeft; of

      f. de schadevergoeding te betalen, waartoe de kantonrechter hem ingevolge [artikel 362 van dit boek][ref2]
      veroordeeld heeft,

      kan de kantonrechter de raad voor de kinderbescherming hiermede in kennis stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel339
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel362
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel365
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '362'
        paragraaf: '10'
        afdeling: '6'
  - number: '366'
    text: |-
      Insgelijks kan de kantonrechter de raad voor de kinderbescherming ermede in kennis stellen, dat:

      a. de voogd in gevallen, waarin hij machtiging van de kantonrechter behoeft, zijn bewind eigenmachtig voert;

      b. hij zich in zijn bewind aan ontrouw, plichtsverzuim of misbruik van bevoegdheid blijkt te hebben schuldig
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel366
  - number: '367'
    text: |-
      De raad voor de kinderbescherming die van de kantonrechter zodanige mededeling ontvangt, onderwerpt, na
      onderzoek van de overige gedragingen van de voogd jegens de minderjarige, binnen zes weken na de dagtekening
      van die mededeling aan het oordeel van de rechtbank de vraag, of beëindiging van de voogdij op grond van
      [artikel 327][ref1] van dit boek moet volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel327
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel367
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '327'
        paragraaf: '8'
        afdeling: '6'
  - number: '369'
    text: |-
      1 Indien minderjarigen die onder voogdij van verschillende voogden staan, goederen gemeen hebben, kan de
      kantonrechter van de woonplaats van een der minderjarigen een van de voogden of een derde aanwijzen om over deze
      goederen tot de verdeling het bewind te voeren. De aangewezen bewindvoerder stelt de door de rechter van hem
      verlangde waarborgen.

      2 Komt de in het eerste lid omschreven bevoegdheid aan verschillende rechters toe, dan vervalt deze, nadat een van
      hen daarvan heeft gebruik gemaakt.

      3 Op het bewind zijn de bepalingen omtrent het bewind van een voogd van overeenkomstige toepassing. De
      bewindvoerder is bij uitsluiting bevoegd tot vernietiging van rechtshandelingen van de minderjarige, strekkend tot
      beheer of beschikking met betrekking tot de onder bewind staande goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel369
  - number: '370'
    text: |-
      1 De kantonrechter kan op verzoek van de voogd of ambtshalve, het vermogen van de minderjarige of een deel daarvan,
      met inbegrip van de vruchten, voor de duur van diens minderjarigheid onder bewind stellen, indien hij dit in
      het belang van de minderjarige nodig oordeelt. In geval van gezamenlijke uitoefening van de voogdij wordt tot
      onderbewindstelling slechts beslist indien het verzoek door beide voogden gezamenlijk wordt gedaan.

      2 De kantonrechter benoemt de bewindvoerder en bepaalt het aan deze toekomende loon. Hij kan bij de instelling
      van het bewind bepalen dat de voogd de door de onderbewindstelling veroorzaakte kosten, met inbegrip van het
      loon, geheel of gedeeltelijk aan de minderjarige moet vergoeden, alsmede dat de voogd, behoudens zijn verhaal
      op de bewindvoerder, voor diens verrichtingen aansprakelijk is jegens de minderjarige. In geval van gezamenlijke
      uitoefening van de voogdij worden deze verplichtingen opgelegd aan beide voogden.

      3 Op het bewind zijn de bepalingen omtrent het bewind van een voogd van overeenkomstige toepassing. De
      bewindvoerder is bij uitsluiting bevoegd tot vernietiging van rechtshandelingen van de minderjarige, strekkend tot
      beheer of beschikking met betrekking tot de onder bewind staande goederen.

      4 De kantonrechter bepaalt welke uitkeringen de bewindvoerder uit de onder het bewind gestelde goederen en de
      vruchten daarvan aan de voogd en bij gezamenlijke uitoefening van de voogdij aan de voogden, moet doen ten behoeve
      van de verzorging en opvoeding van de minderjarige of ten behoeve van het beheer van diens niet onder het bewind
      gestelde goederen. Hij kan deze beschikkingen te allen tijde op verzoek van een voogd of de bewindvoerder, of
      ambtshalve wijzigen.

      5 De bewindvoerder is verplicht aan de kantonrechter te allen tijde alle door deze gewenste inlichtingen te
      verstrekken.

      6 Hij is voorts verplicht jaarlijks en aan het einde van zijn bewind aan de voogd, en bij gezamenlijke uitoefening
      van de voogdij aan de voogden, de meerderjarig gewordene of de erfgenamen van de minderjarige, wanneer deze
      overleden is, ten overstaan van de kantonrechter rekening en verantwoording af te leggen.

      7 Geschillen die bij de rekening en verantwoording rijzen, beslist de kantonrechter.

      8 Blijft een der partijen in gebreke tot deze aflegging van rekening en verantwoording mede te werken, dan zijn de
      [artikelen 771 en volgende van het Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing.

      9 De kantonrechter kan te allen tijde op verzoek van de bewindvoerder, een voogd of ambtshalve het bewind opheffen
      of de bewindvoerder ontslaan en door een ander vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel771
