  - number: '179'
    text: |-
      1 Ontbinding van het huwelijk van echtgenoten die van tafel en bed gescheiden zijn, wordt op verzoek van een der
      echtgenoten uitgesproken, indien de scheiding ten minste drie jaren heeft geduurd.

      2 De termijn van drie jaren kan op verzoek van een echtgenoot worden bekort tot ten minste een jaar, indien de
      andere echtgenoot zich gedurig schuldig maakt aan wangedrag in zodanige mate dat van de echtgenoot, die het verzoek
      heeft gedaan, niet kan worden gevergd het huwelijk te doen voortbestaan.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel179
  - number: '180'
    text: |-
      1 Indien als gevolg van de gevraagde ontbinding van het huwelijk een bestaand vooruitzicht op uitkeringen aan de
      andere echtgenoot na vooroverlijden van de echtgenoot die het verzoek heeft gedaan zou teloorgaan of in ernstige
      mate zou verminderen, en de andere echtgenoot deswege tegen het verzoek verweer voert, kan het verzoek niet worden
      toegewezen voordat daaromtrent een voorziening is getroffen die, gelet op de omstandigheden van het geval, ten
      opzichte van beide echtgenoten billijk is te achten.

      De rechter kan daartoe een termijn stellen.

      2 Het eerste lid is niet van toepassing:

      a. indien redelijkerwijs te verwachten is dat de andere echtgenoot zelf voor dat geval voldoende voorzieningen
      kan treffen;

      b. indien de andere echtgenoot zich gedurig schuldig maakt aan wangedrag in zodanige mate dat van de echtgenoot die
      het verzoek heeft gedaan naar redelijkheid generlei verstrekking van levensonderhoud zou kunnen worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel180
  - number: '181'
    text: |-
      Ontbinding van het huwelijk van echtgenoten die van tafel en bed gescheiden zijn, wordt op hun gemeenschappelijk
      verzoek uitgesproken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel181
  - number: '182'
    text: |-
      De [artikelen 154, tweede lid][ref1], en [156 tot en met 160][ref2] van dit boek zijn van
      overeenkomstige toepassing, met dien verstande dat de in de [artikelen 156, derde lid][ref3], en
      [157, eerste tot en met vijfde lid en zevende lid][ref4], bedoelde termijnen worden verminderd met de tijd
      gedurende welke tijdens de scheiding van tafel en bed een verplichting tot levensonderhoud jegens de andere
      echtgenoot bestond en dat de duur van het huwelijk wordt berekend tot de dag waarop de beschikking tot scheiding
      van tafel en bed is ingeschreven in het huwelijksgoederenregister, aangewezen in [artikel 116][ref5].


