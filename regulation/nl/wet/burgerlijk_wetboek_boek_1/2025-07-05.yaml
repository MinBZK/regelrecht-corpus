      1 De rechter kan twee bewindvoerders benoemen, tenzij gegronde redenen zich tegen zodanige benoeming verzetten.

      2 Zijn er twee bewindvoerders, dan kan, tenzij de rechter anders bepaalt, ieder van hen alle werkzaamheden die tot
      het bewind behoren, alleen verrichten.

      3 Bij verschil van mening tussen de bewindvoerders beslist op verzoek van één van hen of van een instelling als
      bedoeld in [artikel 432, tweede lid][ref1], de kantonrechter. Deze kan ook een verdeling van het loon vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel432
