        artikel: '452'
  - number: '460'
    text: |-
      1 De mentor mag de bij de vervulling van zijn taak noodzakelijk gemaakte kosten aan de betrokkene in rekening
      brengen.

      2 De mentor heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling van Onze Minister van
      Veiligheid en Justitie zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel460
  - number: '461'
    text: |-
      1 De taak van de mentor eindigt:

      a. bij het einde van het mentorschap;

      b. door tijdsverloop, indien hij voor een bepaalde tijd was benoemd;

      c. door zijn dood;

      d. door zijn ondercuratelestelling of door instelling van een mentorschap te zijnen behoeve;

      e. door ontslag dat hem door de kantonrechter met ingang van een door deze bepaalde dag wordt verleend.

      2 Het ontslag wordt hem verleend hetzij op eigen verzoek, hetzij wegens gewichtige redenen of omdat hij niet meer
      voldoet aan de eisen om mentor te kunnen worden, zulks op verzoek van de medementor of degene die gerechtigd is
      mentorschap te verzoeken als bedoeld in [artikel 451, eerste en tweede lid][ref1], dan wel ambtshalve. Hangende
      het onderzoek kan de kantonrechter voorlopige voorzieningen in het mentorschap treffen en de mentor schorsen. De
      kantonrechter kan hiertoe zo nodig ook zonder de mentor tevoren te hebben gehoord overgaan. In dat geval verliest
      de beschikking haar kracht na verloop van twee weken, tenzij de mentor binnen deze termijn in de gelegenheid is
      gesteld om te worden gehoord.

      3 Een gewezen mentor blijft verplicht al datgene te doen, wat niet zonder nadeel voor de betrokkene kan
      worden uitgesteld, totdat wederom een persoon bevoegd is ten aanzien van de aangelegenheden bedoeld in
      [artikel 453, eerste lid][ref2], van dit boek. In de gevallen genoemd in het eerste lid, onder *d*, rust deze
      verplichting op diens curator of mentor, indien deze van het mentorschap kennis draagt.

      4 [Artikel 384][ref3] van dit boek is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel451
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel453
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel384
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel461
