  - number: '54'
    text: |-
      1 De stuiting geschiedt door betekening van een akte aan de ambtenaar van de burgerlijke stand van de gemeente waar
      het huwelijk zal worden voltrokken.

      2 De akte houdt de keus van een woonplaats in die gemeente en de gronden van de stuiting in en vermeldt de
      hoedanigheid die aan de opposant de bevoegdheid geeft om het huwelijk te stuiten; alles op straffe van nietigheid.

      3 De opposant zal afschrift der akte van stuiting onverwijld doen betekenen aan de partij, tegen welke de stuiting
      is gericht.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel54
  - number: '55'
    text: |-
      Een stuiting kan worden opgeheven:

      a. op dezelfde wijze als waarop zij is geschied;

      b. door een verklaring, in persoon afgelegd ten overstaan van de ambtenaar van de burgerlijke stand, genoemd in het
      vorige artikel;

      c. door een verklaring, afgelegd ten overstaan van een notaris;

      d. door een in kracht van gewijsde gegane beschikking, gegeven op verzoek van een belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel55
  - number: '56'
    text: |-
      Het huwelijk mag niet worden voltrokken, voordat de stuiting is opgeheven. Mocht het desniettemin voltrokken
      zijn hangende een geding tot opheffing van de stuiting, dan kan dit geding op verlangen van de opposant worden
      voortgezet en wordt het huwelijk nietig verklaard, indien de rechter de gegrondheid der stuiting aanvaardt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel56
  - number: '57'
    text: |-
      Een ambtenaar van de burgerlijke stand aan wie het bestaan van een der in de [artikelen 31 tot en met 33][ref1],
      [41][ref2], [41a][ref3] en [42][ref4] omschreven huwelijksbeletselen bekend is, mag geen medewerking verlenen aan
      een huwelijksvoltrekking of aan de vervulling van daaraan voorafgaande formaliteiten, ook al zou geen stuiting
      hebben plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel41a
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel42
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel57
