  - number: '425'
    text: |-
      1 Indien de achtergebleven echtgenote van een vermiste een nieuw huwelijk is aangegaan, doch de vermiste nog in
      leven was na de dag die als datum van overlijden was vermeld in de overeenkomstig [artikel 417 van dit boek][ref1]
      opgemaakte akte, zoals deze bij de voltrekking van het nieuwe huwelijk luidde, wordt niettemin voor de bepaling
      van de staat van haar kinderen die voor het nieuwe huwelijk zijn geboren, het huwelijk met de vermiste geacht
      te zijn ontbonden op de in die akte vermelde dag. Dit lid is van overeenkomstige toepassing op de achtergebleven
      geregistreerde partner en het aangaan van een nieuw geregistreerd partnerschap.

      2 Degene ten aanzien van wie de vermissing is vastgesteld voor wie bij diens terugkeer het gezag over zijn
      minderjarige kind niet is herleefd, kan de rechtbank verzoeken hem daarmede te belasten. Wanneer deze tezamen met
      de andere ouder verzoekt in het belang van hun kind hen gezamenlijk met het gezag te belasten, dan wel niet in
      het gezag is voorzien of een voogd het gezag uitoefent, wordt het verzoek slechts afgewezen indien gegronde vrees
      bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd. In de overige gevallen wordt het
      verzoek slechts ingewilligd indien de rechtbank dit in het belang van het kind wenselijk oordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel417
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel425
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '417'
        afdeling: '2'
  - number: '426'
    text: |-
      1 Indien het lichaam van een vermist persoon niet is kunnen worden teruggevonden doch, alle omstandigheden in
      aanmerking genomen, zijn overlijden als zeker kan worden beschouwd, kan op verzoek van het openbaar ministerie of
      van iedere belanghebbende de rechtbank verklaren dat de vermiste is overleden:

      A. indien de vermissing heeft plaatsgevonden in Nederland;

      B. indien de vermissing heeft plaatsgevonden tijdens een reis met een in Nederland thuisbehorend schip of
      luchtvaartuig;

      C. indien de vermiste Nederlander was;

      D. indien de vermiste zijn woon- of verblijfplaats had in Nederland.

      2 Indien een persoon buiten Nederland is overleden en geen overlijdensakte is opgemaakt of kan worden overgelegd,
      kan op verzoek van het openbaar ministerie of van iedere belanghebbende de rechtbank verklaren dat die persoon
      is overleden:

      A. indien het overlijden heeft plaatsgevonden tijdens een reis met een in Nederland thuisbehorend schip of
      luchtvaartuig;

      B. indien de overledene Nederlander was;

      C. indien de overledene zijn woon- of verblijfplaats had in Nederland.

      3 Voor zover mogelijk bevat het verzoek bedoeld in het eerste en tweede lid, of daarmee vergezeld gaande bescheiden
      de in [artikel 427 van dit boek][ref1] genoemde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel427
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel426
    references:
