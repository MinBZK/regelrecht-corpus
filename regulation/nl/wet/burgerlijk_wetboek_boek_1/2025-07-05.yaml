        artikel: 395b
        afdeling: '1'
  - number: '395'
    text: |-
      Een stiefouder is, onverminderd het bepaalde in [artikel 395a van dit boek][ref1], alleen verplicht gedurende
      zijn huwelijk of zijn geregistreerd partnerschap levensonderhoud te verstrekken aan de tot zijn gezin behorende
      minderjarige kinderen van zijn echtgenoot of geregistreerde partner.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel395
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 395a
        afdeling: '1'
  - number: 395a
    text: |-
      1 Ouders zijn verplicht te voorzien in de kosten van levensonderhoud en studie van hun meerderjarige kinderen die
      de leeftijd van een en twintig jaren niet hebben bereikt.

      2 Een stiefouder is gedurende zijn huwelijk of zijn geregistreerd partnerschap jegens de tot zijn gezin behorende
      meerderjarige kinderen van zijn echtgenoot of geregistreerde partner die de leeftijd van een en twintig jaren niet
      hebben bereikt, verplicht te voorzien in de bij het vorige lid bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel395a
  - number: 395b
    text: |-
      Heeft de rechter het bedrag bepaald, dat een ouder of stiefouder dan wel, overeenkomstig [artikel 394][ref1], de
      verwekker of de persoon die in artikel 394 daarmee gelijk is gesteld ter zake van de verzorging en opvoeding van
      zijn minderjarig kind of stiefkind moet betalen en is deze verplichting tot aan het meerderjarig worden van het
      kind van kracht geweest, dan geldt met ingang van dit tijdstip de rechterlijke beslissing als een tot bepaling van
      het bedrag ter zake van levensonderhoud en studie als in [artikel 395a][ref2] van dit boek bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
