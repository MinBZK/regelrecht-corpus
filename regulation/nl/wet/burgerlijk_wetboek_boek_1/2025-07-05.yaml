  - number: 20e
    text: |-
      1 Van de in [artikel 20, eerste lid][ref1], genoemde uitspraken zendt de griffier van het college waarvoor de zaak
      laatstelijk aanhangig was niet eerder dan drie maanden na de dag van de beschikking een afschrift aan de ambtenaar
      van de burgerlijke stand.

      2 Van besluiten houdende wijziging of vaststelling van namen en van naturalisatiebesluiten mede houdende wijziging
      of vaststelling van namen zendt Onze Minister van Justitie onverwijld een afschrift aan de ambtenaar van de
      burgerlijke stand onder wie de akte van geboorte van de betrokken persoon berust.

      3 De notaris die een akte van erkenning heeft opgemaakt, zendt onverwijld een afschrift of een uittreksel daarvan
      aan de ambtenaar van de burgerlijke stand onder wie de akte van geboorte van het kind berust.


