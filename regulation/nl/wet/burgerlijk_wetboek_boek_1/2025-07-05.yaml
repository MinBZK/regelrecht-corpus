  - number: '384'
    text: |-
      Indien een beschikking, waarbij curatele is uitgesproken, in hoger beroep of cassatie wordt vernietigd en het
      verzoek tot ondercuratelestelling alsnog wordt afgewezen, neemt de taak van de curator daags na deze uitspraak een
      einde. De inmiddels door de curator of met zijn toestemming verrichte handelingen blijven voor de onder curatele
      gestelde verbindend.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel384
  - number: '385'
    text: |-
      1 Behoudens het in de [artikelen 383][ref1] en [384][ref2] bepaalde vinden de [artikelen 250][ref3] en
      [280, onder b][ref4], [281 lid 1 onder a en lid 2][ref5], [322, eerste lid, onder a en c][ref6], [324][ref7],
      [336][ref8] en [372-377][ref9] bij curatele overeenkomstige toepassing, met dien verstande dat

      a. in geval van benoeming van een ouder tot curator een bereidverklaring als bedoeld in
      [artikel 280 onder b][ref10] niet is vereist;

      b. voor rechtbank of rechter wordt gelezen kantonrechter;

      c. aan de raad voor de kinderbescherming ter zake geen bevoegdheden toekomen;

      d. de curator te allen tijde hetzij op eigen verzoek, hetzij wegens gewichtige redenen of omdat hij niet meer
      voldoet aan de eisen om curator te kunnen worden, door de kantonrechter kan worden ontslagen, zulks op verzoek van
      de medecurator of degene die gerechtigd is de curatele te verzoeken als bedoeld in [artikel 379][ref11], dan wel
      ambtshalve. [Artikel 448, tweede lid, derde lid en vijfde lid][ref12], is van overeenkomstige toepassing;

      e. de curator de rekening en verantwoording, bedoeld in [artikel 374][ref13], aflegt ten overstaan van de bij het
      einde van zijn bewind ter zake bevoegde kantonrechter.

      2 De curator doet telkens na verloop van vijf jaren, of zoveel eerder als de kantonrechter bepaalt, aan deze
      verslag van het verloop van de curatele. Hij laat zich daarbij met name uit over de vraag of de curatele dient
      voort te duren of door een minder ver strekkende voorziening kan worden vervangen. Feiten die voor de curatele en
      het voortduren daarvan van betekenis zijn deelt hij terstond aan de kantonrechter mede.


