  - number: '378'
    text: |-
      1 Een meerderjarige kan door de kantonrechter onder curatele worden gesteld, wanneer hij tijdelijk of duurzaam zijn
      belangen niet behoorlijk waarneemt of zijn veiligheid of die van anderen in gevaar brengt, als gevolg van

      a. zijn lichamelijke of geestelijke toestand, dan wel

      b. gewoonte van drank- of drugsmisbruik,

      en een voldoende behartiging van die belangen niet met een meer passende en minder verstrekkende voorziening kan
      worden bewerkstelligd.

      2 Indien te verwachten is dat ten aanzien van een minderjarige op het tijdstip waarop hij meerderjarig zal worden,
      van een der in het vorige lid genoemde gronden voor curatele sprake zal zijn, kan de curatele reeds voor de
      meerderjarigheid worden uitgesproken.

      3 De rechter bij wie een verzoek tot het verlenen van een rechterlijke machtiging als bedoeld in
      de [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref1] dan wel
      een zorgmachtiging of een machtiging tot voorzetting van de crisismaatregel als bedoeld in de
      [Wet verplichte geestelijke gezondheidszorg][ref2] aanhangig is, is tevens bevoegd tot de kennisneming van een
      verzoek tot ondercuratelestelling.


      [ref1]: https://wetten.overheid.nl/BWBR0040632
      [ref2]: https://wetten.overheid.nl/BWBR0040635
