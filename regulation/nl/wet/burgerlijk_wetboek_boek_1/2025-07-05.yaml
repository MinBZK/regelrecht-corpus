  - number: '382'
    text: |-
      Hij die uit hoofde van gewoonte van drank- of drugsmisbruik onder curatele is gesteld, blijft bekwaam tot het
      verrichten van familierechtelijke handelingen voor zover de wet niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel382
  - number: '383'
    text: |-
      1 De rechter die de curatele instelt, benoemt daarbij of zo spoedig mogelijk daarna een curator. Hij vergewist zich
      van de bereidheid en vormt zich een oordeel omtrent de geschiktheid van de te benoemen persoon.

      2 De rechter volgt bij de benoeming van de curator de uitdrukkelijke voorkeur van de betrokkene, tenzij gegronde
      redenen zich tegen zodanige benoeming verzetten.

      3 Tenzij het vorige lid is toegepast, wordt, indien de onder curatele gestelde persoon gehuwd is, een geregistreerd
      partnerschap is aangegaan of anderszins een levensgezel heeft, bij voorkeur de echtgenoot, de geregistreerde
      partner dan wel andere levensgezel tot curator benoemd. Is de vorige zin niet van toepassing dan wordt bij voorkeur
      een van zijn ouders, kinderen, broers of zusters tot curator benoemd. Huwt de onder curatele gestelde, gaat hij
      een geregistreerd partnerschap aan of verkrijgt hij een andere levensgezel, dan kan ieder van hen verzoeken, dat de
      niet onder curatele staande echtgenoot, de geregistreerde partner dan wel de andere levensgezel in de plaats van de
      tegenwoordige curator wordt benoemd.

      4 Rechtspersonen met volledige rechtsbevoegdheid kunnen tot curator worden benoemd.

      5 De volgende personen kunnen niet tot curator worden benoemd:

      a. handelingsonbekwamen;

      b. zij ten behoeve van wie een mentorschap is ingesteld;

      c. de bewindvoerder van de onder curatele gestelde in de zin
      [artikel 287, derde lid, van de Faillissementswet][ref1];

      d. een direct betrokken of behandelend hulpverlener;

      e. personen behorende tot de leiding of tot het personeel van de instelling waar de onder curatele gestelde wordt
      verzorgd of die aan de onder curatele gestelde begeleiding biedt;

      f. personen verbonden met de instelling waar de onder curatele gestelde wordt verzorgd of die aan de onder curatele
      gestelde begeleiding biedt, doordat:

      1° de instelling of personen behorende tot de leiding van de instelling, alleen of samen meer dan de helft van de
      stemrechten in de algemene vergadering van de rechtspersoon kunnen uitoefenen, dan wel meer dan de helft van de
      bestuurders of van de commissarissen van de rechtspersoon kunnen benoemen of ontslaan,

      2° de persoon en de instelling deel uitmaken van een groep in de zin van [artikel 24b van boek 2][ref2], of

      3° de bestuurder van de rechtspersoon tevens behoort tot de leiding of het personeel van de instelling.

      6 Zij van wie één of meer goederen onder een bewind als bedoeld in [titel 19][ref3] staan, zij die in staat van
      faillissement verkeren en zij ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing
      is, kunnen niet tot curator worden benoemd, tenzij het gaat om een persoon als bedoeld in het derde lid en het
      bewind over het vermogen van de onder curatele gestelde door de medecurator wordt gevoerd.

      7 Een andere persoon dan in het derde lid bedoeld, die ten behoeve van drie of meer personen curator, bewindvoerder
      of mentor is, komt alleen dan voor benoeming in aanmerking indien deze wat zijn bedrijfsvoering en scholing
      betreft, alsmede, voor zover van toepassing, de werving, de scholing en begeleiding van en het toezicht op
      de personen door wie hij de taken van een curator uitoefent, voldoet aan bij algemene maatregel van bestuur
      te stellen kwaliteitseisen, alsmede aan de verplichtingen bedoeld in [artikel 386, derde lid][ref4], en in
      [artikel 15i van boek 3][ref5].

      8 De persoon, bedoeld in het zevende lid, legt aan de rechter die hem benoemt, over:

      a. zijn verklaring dat hij aan de in het zevende lid bedoelde kwaliteitseisen en verplichtingen voldoet,

      b. een verslag van een accountant als bedoeld in [artikel 393, eerste lid, van boek 2][ref6], van diens bevindingen
      over de wijze waarop aan de eisen en verplichtingen wordt voldaan, en

      c. een verklaring van de accountant omtrent de balans en staat van baten en lasten, bedoeld in
      [artikel 10 van boek 2][ref7], dan wel, voor zover van toepassing, omtrent de jaarrekening overeenkomstig
      [titel 9 van boek 2][ref8]. [Artikel 396, zevende lid, van boek 2][ref9] is ten aanzien van
      [artikel 393 lid 1][ref10] niet van toepassing.

      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de vorm en de inhoud van de
      verklaringen en het verslag, alsmede de wijze van overlegging. Toont de persoon aan dat hij in de twaalf maanden
      voorafgaande aan zijn benoeming de verklaringen en het verslag reeds aan de rechter heeft overgelegd, dan is hij
      van de overlegging vrijgesteld.

      9 Van de overlegging van de in het achtste lid bedoelde verklaring van de accountant zijn vrijgesteld:

      a. zij die een financiële onderneming zijn die ingevolge de [Wet op het financieel toezicht][ref11] het bedrijf van
      bank mogen uitoefenen,

      b. notarissen,

      c. gerechtsdeurwaarders,

      d. accountants.

      Bij algemene maatregel van bestuur kunnen de in de vorige zin bedoelde ondernemingen en beroepsbeoefenaren
      geheel of gedeeltelijk worden vrijgesteld van de in het zevende lid bedoelde eisen inzake de werving, scholing
      en bedrijfsvoering.

      10 De rechter kan twee curatoren benoemen, tenzij gegronde redenen zich tegen zodanige benoeming verzetten. Zijn
      er twee curatoren, dan kan ieder van hen de taken die aan een curator toekomen, alleen verrichten. De rechter kan
      zo nodig een taakverdeling tussen de curatoren vaststellen. Bij verschil van mening tussen de curatoren beslist
      op verzoek van een van hen of op verzoek van een instelling als bedoeld in [artikel 379, tweede lid][ref12], de
      kantonrechter. Deze kan ook een verdeling van de beloning vaststellen.

      11 De taak van de curator vangt aan daags nadat de beslissing, houdende de benoeming, is verstrekt of verzonden.
      Met die dag eindigt het provisioneel bewind. De provisionele bewindvoerder is verplicht ten overstaan van de
      kantonrechter aan de curator rekening en verantwoording van zijn bemoeienissen af te leggen; wordt hij zelf tot
      curator benoemd, dan wordt de rekening en verantwoording aan de kantonrechter afgelegd. Indien de curator vóór de
      meerderjarigheid van de onder curatele gestelde is benoemd, vangt zijn taak aan op het tijdstip waarop de curatele
      in werking treedt.

      12 Indien het verzoek tot ondercuratelestelling wordt afgewezen, eindigt het bewind van de provisionele
      bewindvoerder daags na die uitspraak, tenzij de rechter anders bepaalt, en in ieder geval uiterlijk daags nadat de
      afwijzing in kracht van gewijsde is gegaan.


