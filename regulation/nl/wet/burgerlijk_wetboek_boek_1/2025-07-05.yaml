  - number: '253'
    text: |-
      1 Indien gewezen echtgenoten met elkaar hertrouwen dan wel een geregistreerd partnerschap aangegaan en onmiddellijk
      daaraan voorafgaande één der echtgenoten het gezag over de minderjarige kinderen uitoefende, herleeft van
      rechtswege het gezamenlijk gezag, tenzij een der echtgenoten onbevoegd is tot dit gezag of dat gezag is beëindigd
      dan wel het gezag gezamenlijk met een ander dan de ouder uitoefent.

      2 De echtgenoot voor wie het gezag niet is herleefd, kan de rechtbank verzoeken hem daarmede te belasten. Dit
      verzoek wordt slechts afgewezen, indien gegronde vrees bestaat dat bij inwilliging de belangen van de kinderen
      zouden worden verwaarloosd.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing, indien door verzoening van de echtgenoten een
      scheiding van tafel en bed eindigt.

      4 Het eerste en tweede lid zijn van overeenkomstige toepassing indien gewezen geregistreerde partners die
      gezamenlijk gezag uitoefenden over het kind, opnieuw met elkaar een geregistreerd partnerschap aangaan dan wel met
      elkaar huwen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253
  - number: 253a
    text: |-
      1 In geval van gezamenlijke uitoefening van het gezag kunnen geschillen hieromtrent op verzoek van de ouders of van
      een van hen aan de rechtbank worden voorgelegd. De rechtbank neemt een zodanige beslissing als haar in het belang
      van het kind wenselijk voorkomt.

      2 De rechtbank kan eveneens op verzoek van de ouders of een van hen een regeling vaststellen inzake de uitoefening
      van het ouderlijk gezag. Deze regeling kan omvatten:

      a. een toedeling aan ieder der ouders van de zorg- en opvoedingstaken, alsmede met overeenkomstige toepassing van
      [artikel 377a, derde lid][ref1], een tijdelijk verbod aan een ouder om met het kind contact te hebben;

      b. de beslissing bij welke ouder het kind zijn hoofdverblijfplaats heeft;

      c. de wijze waarop informatie omtrent gewichtige aangelegenheden met betrekking tot de persoon en het vermogen van
      het kind wordt verschaft aan de ouder bij wie het kind niet zijn hoofdverblijfplaats heeft dan wel de wijze waarop
      deze ouder wordt geraadpleegd;

      d. de wijze waarop informatie door derden overeenkomstig [artikel 377c, eerste en tweede lid][ref2], wordt
      verschaft.

      3 Indien op de ouders de verplichting van [artikel 247a][ref3] rust en zij daaraan niet hebben voldaan, houdt
      de rechter de beslissing op een in het tweede lid bedoeld verzoek ambtshalve aan, totdat aan die verplichting is
      voldaan. Aanhouding blijft achterwege indien het belang van het kind dit vergt.

      4 De [artikelen 377e][ref4] en [377g][ref5] zijn van overeenkomstige toepassing. Daar waar in deze bepalingen
      gesproken wordt over omgang of een omgangsregeling wordt in plaats daarvan gelezen: een verdeling van de zorg-
      en opvoedingstaken.

      5 De rechtbank beproeft alvorens te beslissen op een verzoek als in het eerste of tweede lid bedoeld,
      een vergelijk tussen de ouders en kan desverzocht en ook ambtshalve, zulks indien geen vergelijk
      tot stand komt en het belang van het kind zich daartegen niet verzet, een door de wet toegelaten
      dwangmiddel opleggen, dan wel bepalen dat de beschikking of onderdelen daarvan met toepassing van
      [artikel 812, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref6] ten uitvoer kunnen worden gelegd.

      6 De rechtbank behandelt het verzoek binnen zes weken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377c
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel247a
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
