  - number: '150'
    text: |-
      Echtscheiding tussen echtgenoten die niet van tafel en bed gescheiden zijn, wordt uitgesproken op verzoek van één
      der echtgenoten of op hun gemeenschappelijk verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel150
  - number: '151'
    text: Echtscheiding wordt op verzoek van één der echtgenoten uitgesproken, indien het huwelijk duurzaam ontwricht is.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel151
  - number: '153'
    text: |-
      1 Indien als gevolg van de verzochte echtscheiding een bestaand vooruitzicht op uitkeringen aan de andere
      echtgenoot na vooroverlijden van de echtgenoot die het verzoek heeft gedaan zou teloorgaan of in ernstige mate
      zou verminderen, en de andere echtgenoot deswege tegen dat verzoek verweer voert, kan deze niet worden toegewezen
      voordat daaromtrent een voorziening is getroffen die, gelet op de omstandigheden van het geval, ten opzichte van
      beide echtgenoten billijk is te achten. De rechter kan daartoe een termijn stellen.

      2 Het eerste lid is niet van toepassing:

      a. indien redelijkerwijs te verwachten is dat de andere echtgenoot zelf voor dat geval voldoende voorzieningen
      kan treffen;

      b. indien de duurzame ontwrichting van het huwelijk in overwegende mate te wijten is aan de andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel153
  - number: '154'
    text: |-
      1 Echtscheiding wordt op gemeenschappelijk verzoek van de echtgenoten uitgesproken indien het verzoek is gegrond op
      hun beider oordeel dat het huwelijk duurzaam ontwricht is.

      2 Ieder der echtgenoten is tot op het tijdstip der uitspraak bevoegd het verzoek in te trekken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel154
  - number: '155'
    text: |-
      In geval van echtscheiding en voor zover de ene echtgenoot na de huwelijkssluiting en voor de echtscheiding
      pensioenaanspraken heeft opgebouwd, heeft de andere echtgenoot overeenkomstig het bepaalde bij of krachtens de
      [Wet verevening pensioenrechten bij scheiding][ref1] recht op pensioenverevening, tenzij de echtgenoten op de wijze
      voorzien in deze Wet toepasselijkheid daarvan hebben uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0006641
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0006641
  - number: '156'
    text: |-
      1 De rechter kan bij de echtscheidingsbeschikking of bij latere uitspraak aan de echtgenoot die niet voldoende
      inkomsten tot zijn levensonderhoud heeft, noch zich in redelijkheid kan verwerven op diens verzoek ten laste van de
      andere echtgenoot een uitkering tot levensonderhoud toekennen.

      2 Bij de vaststelling van de uitkering kan de rechter rekening houden met de behoefte aan een voorziening in het
      levensonderhoud voor het geval van overlijden van degene die tot de uitkering is gehouden.

      3 De rechter kan op verzoek van een van de echtgenoten de uitkering toekennen onder de vaststelling van voorwaarden
      en van een termijn. Deze vaststelling kan niet tot gevolg hebben dat de uitkering later eindigt dan op grond van de
      toepasselijke termijn, bedoeld in [artikel 157][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel157
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel156
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
  - number: '157'
    text: |-
      1 Indien de rechter geen termijn heeft vastgesteld, eindigt de verplichting tot het verstrekken van levensonderhoud
      van rechtswege na het verstrijken van een termijn die gelijk is aan de helft van de duur van het huwelijk met een
      maximum van vijf jaren.

      2 Indien op het tijdstip van indiening van het verzoek tot echtscheiding de duur van het huwelijk langer is
      dan vijftien jaren en de leeftijd van de echtgenoot die recht heeft op een uitkering tot levensonderhoud, ten
      hoogste tien jaren lager is dan de leeftijd, bedoeld in [artikel 7a van de Algemene Ouderdomswet][ref1], eindigt
      de verplichting tot het verstrekken van levensonderhoud, in afwijking van het eerste lid, niet eerder dan op het
      tijdstip, waarop die echtgenoot deze leeftijd heeft bereikt.

      3 Indien op het tijdstip van indiening van het verzoek tot echtscheiding de duur van het huwelijk langer
      is dan vijftien jaren en de echtgenoot die recht heeft op een uitkering tot levensonderhoud geboren
      is op of voor 1 januari 1970 en diens leeftijd meer dan tien jaren lager is dan de leeftijd bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref2], eindigt de verplichting tot het verstrekken van levensonderhoud,
      in afwijking van het eerste lid, na tien jaren.

      4 In afwijking van het eerste tot en met derde lid eindigt de verplichting tot het verstrekken van levensonderhoud
      niet eerder dan op het tijdstip waarop de uit het huwelijk van de echtgenoten geboren kinderen de leeftijd van
      twaalf jaren hebben bereikt.

      5 Bij samenloop van de omstandigheden, bedoeld in het eerste tot en met vierde lid, geldt de langste termijn.

      6 De termijn voor het verstrekken van levensonderhoud vangt aan op de datum van inschrijving van de
      echtscheidingsbeschikking in de registers van de burgerlijke stand.

      7 Indien ongewijzigde handhaving van de beëindiging van de uitkering ten gevolge van het verstrijken van de in
      het eerste tot en met vierde lid bedoelde termijn, gelet op alle omstandigheden van het geval, naar maatstaven van
      redelijkheid en billijkheid niet kan worden gevergd van degene die recht heeft op die uitkering, kan de rechter
      op diens verzoek alsnog een termijn vaststellen. Het verzoek daartoe wordt ingediend voordat drie maanden sinds de
      beëindiging van de uitkering zijn verstreken. De rechter bepaalt bij de uitspraak of verlenging van de termijn na
      ommekomst daarvan al dan niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel157
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '158'
    text: |-
      Vóór of na de beschikking tot echtscheiding kunnen de echtgenoten bij overeenkomst bepalen of,
      en zo ja tot welk bedrag, na de echtscheiding de één tegenover de ander tot een uitkering tot
      diens levensonderhoud zal zijn gehouden. Indien in de overeenkomst geen termijn is opgenomen, is
      [artikel 157, eerste tot en met vijfde lid en zevende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel157
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
  - number: '159'
    text: |-
      1 Bij de overeenkomst kan worden bedongen dat zij niet bij rechterlijke uitspraak zal kunnen worden gewijzigd op
      grond van een wijziging van omstandigheden. Een zodanig beding kan slechts schriftelijk worden gemaakt.

      2 Het beding vervalt, indien de overeenkomst is aangegaan vóór de indiening van het verzoek tot echtscheiding,
      tenzij dit binnen drie maanden na de overeenkomst is ingediend. Het voorgaande is van overeenkomstige toepassing
      bij een gemeenschappelijk verzoek.

      3 Ondanks een zodanig beding kan op verzoek van een der partijen de overeenkomst door de rechter bij de
      echtscheidingsbeschikking of bij latere beschikking worden gewijzigd op grond van een zo ingrijpende wijziging van
      omstandigheden, dat de verzoeker naar maatstaven van redelijkheid en billijkheid niet langer aan het beding mag
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel159
  - number: 159a
    text: |-
      Een overeenkomst als bedoeld in de [artikelen 158][ref1] en [159 van dit boek][ref2] staat niet in de weg aan
      verhaal op grond van [paragraaf 6.5 van de Participatiewet][ref3] en laat de vaststelling van het te verhalen
      bedrag onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel159
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Paragraaf6.5
