        artikel: '427'
        afdeling: '3'
  - number: '427'
    text: |-
      1 De beschikking, houdende verklaring dat de in [artikel 426][ref1] bedoelde persoon is overleden, noemt de dag en
      zo mogelijk het uur van het overlijden. Indien de dag van overlijden niet bekend is, wordt deze door de rechtbank
      vastgesteld en in de beschikking vermeld. De rechtbank houdt hierbij rekening met alle bewijzen en aanwijzingen
      omtrent de omstandigheden waaronder, of het tijdstip waarop het overlijden moet hebben plaatsgehad.

      2 Voorts vermeldt de beschikking de geslachtsnaam, de voornamen, de kunne en, zo mogelijk, de plaats van het
      overlijden, de woonplaats van de overledene, de plaats en de dag van geboorte van de overledene en de geslachtsnaam
      en de voornamen van de persoon of van de personen, met wie de overledene gehuwd is geweest of met wie de overledene
      een geregistreerd partnerschap was aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel426
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel427
