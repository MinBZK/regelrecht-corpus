  - number: '269'
    text: |-
      In plaats van schorsing van beide ouders of van een ouder in de uitoefening van het gezag als bedoeld in
      [artikel 268][ref1], kan de rechtbank een kind onder toezicht stellen als bedoeld in [artikel 255][ref2] mits aan
      de grond hiervoor is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel255
