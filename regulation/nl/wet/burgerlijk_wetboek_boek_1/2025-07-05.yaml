  - number: '432'
    text: |-
      1 Instelling van het bewind kan worden verzocht door de rechthebbende, zijn echtgenoot, zijn geregistreerde
      partner dan wel andere levensgezel, zijn bloedverwanten in de rechte lijn en in de zijlijn tot en met de vierde
      graad, degene die ingevolge [artikel 253sa][ref1] of [253t][ref2] het gezag over de rechthebbende uitoefent, zijn
      voogd, zijn curator als bedoeld in [titel 16][ref3] en zijn mentor als bedoeld in [titel 20][ref4]. In het in
      [artikel 431, derde lid][ref5], bedoelde geval kan het bewind uitsluitend worden verzocht door de rechthebbende.

      2 Instelling van het bewind kan voorts worden verzocht door het openbaar ministerie en door de instelling waar
      de rechthebbende wordt verzorgd of die aan de rechthebbende begeleiding biedt. Instelling van een bewind wegens
      verkwisting of het hebben van problematische schulden kan tevens worden verzocht door het college van burgemeester
      en wethouders van de gemeente waar de rechthebbende woonplaats heeft. In beide laatste gevallen vermeldt het
      verzoekschrift tevens waarom de in het eerste lid genoemde personen – bloedverwanten in de zijlijn in de derde en
      vierde graad daaronder niet begrepen – niet tot indiening van een verzoek zijn overgegaan.

      3 De rechter voor wie een verzoek tot ondercuratelestelling of tot opheffing van de curatele aanhangig is, kan bij
      afwijzing onderscheidenlijk bij inwilliging daarvan ambtshalve overgaan tot instelling van het bewind.

      4 Een verzoek tot instelling van een bewind ten behoeve van een rechthebbende die onder curatele is gesteld, wordt
      aanhangig gemaakt bij de rechter die bevoegd is over opheffing van de curatele te beslissen. Deze rechter kan, bij
      opheffing van een curatele, ook ambtshalve overgaan tot instelling van het bewind.

      5 In geval van een bestuursopdracht, of een verzoek daartoe, als bedoeld in [artikel 91][ref6] van dit boek, zijn
      het derde en het vierde lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
