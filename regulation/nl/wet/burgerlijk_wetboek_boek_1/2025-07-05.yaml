        artikel: '384'
  - number: '462'
    text: |-
      1 Het mentorschap eindigt door het verstrijken van de tijdsduur waarvoor het is ingesteld en door de dood of
      ondercuratelestelling van de betrokkene.

      2 De kantonrechter kan, indien de noodzaak daartoe niet meer bestaat of voortzetting van het mentorschap niet
      zinvol is gebleken, het mentorschap opheffen, zulks op verzoek van de mentor of van degene die gerechtigd
      is mentorschap te verzoeken als bedoeld in [artikel 451, eerste en tweede lid][ref1], dan wel ambtshalve. De
      beschikking treedt in werking zodra zij in kracht van gewijsde is gegaan, tenzij zij een eerder tijdstip van ingang
      aanwijst.

      3 Degene die gerechtigd is de instelling van het mentorschap te verzoeken als bedoeld in
      [artikel 451, eerste en tweede lid][ref2], alsmede de mentor, kan verzoeken om verlenging van het mentorschap
      dat voor een bepaalde tijdsduur is ingesteld. De kantonrechter beslist binnen twee maanden na het indienen van
      het verzoekschrift. [Artikel 384][ref3] is van overeenkomstige toepassing. Tegen de afwijzing van een verzoek tot
      verlenging staat geen hogere voorziening open.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel451
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel451
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel384
