  - number: '389'
    text: |-
      1 De curatele eindigt:

      a. door het verstrijken van de tijdsduur waarvoor zij is ingesteld,

      b. door de dood van de betrokken persoon, of

      c. indien ten behoeve van hem bij in kracht van gewijsde gegane rechterlijke uitspraak ter vervanging van curatele
      een bewind als bedoeld in [titel 19][ref1] dan wel een mentorschap als bedoeld in [titel 20][ref2] is ingesteld.

      2 De kantonrechter kan, indien de noodzaak daartoe niet meer bestaat of voortzetting van de curatele niet zinvol
      is gebleken, de curatele opheffen, zulks op verzoek van de curator of degene die gerechtigd is de curatele te
      verzoeken als bedoeld in [artikel 379][ref3], alsmede ambtshalve. De beschikking treedt in werking zodra zij in
      kracht van gewijsde is gegaan, tenzij zij een eerder tijdstip van ingang aanwijst.

      3 Degene die gerechtigd is de curatele te verzoeken als bedoeld in [artikel 379][ref4], alsmede de curator, kan
      verzoeken om verlenging van een curatele die voor een bepaalde tijdsduur is ingesteld. De kantonrechter beslist
      binnen twee maanden na het indienen van het verzoekschrift. [Artikel 384][ref5] is van overeenkomstige toepassing.
      Tegen de afwijzing van een verzoek tot verlenging staat geen hogere voorziening open.


