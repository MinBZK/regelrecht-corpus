  - number: '252'
    text: |-
      1 De ouders die niet met elkaar zijn gehuwd of een geregistreerd partnerschap zijn aangegaan en niet het
      gezamenlijk gezag uitoefenen op grond van [artikel 251b, eerste lid][ref1], oefenen het gezag over hun minderjarige
      kinderen gezamenlijk uit, indien dit op hun beider verzoek in het register, bedoeld in [artikel 244][ref2], is
      aangetekend. Een verzoek als bedoeld in de eerste volzin kan niet worden gedaan ten aanzien van de kinderen over
      wie zij het gezag gezamenlijk hebben uitgeoefend.

      2 De aantekening wordt door de griffier geweigerd, indien op het tijdstip van het verzoek:

      a. één of beide ouders onbevoegd is tot het gezag; of

      b. het gezag van één van beide ouders is beëindigd en de andere ouder het gezag uitoefent; of

      c. een voogd met het gezag over het kind is belast; of

      d. de voorziening in het gezag over het kind is komen te ontbreken; of

      e. de ouder die het gezag heeft, dit gezamenlijk met een ander dan een ouder uitoefent.

      3 Tegen de weigering van de aantekening is alleen beroep mogelijk, indien zij heeft plaatsgevonden op grond van
      onbevoegdheid van één of beide ouders tot het gezag anders dan vanwege minderjarigheid of ondercuratelestelling.
      Alsdan kan de rechtbank worden verzocht de aantekening te gelasten. Zij wijst het verzoek af, indien gegronde vrees
      bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251b
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel244
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel252
