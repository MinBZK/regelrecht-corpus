  - number: 80f
    text: |-
      Indien de partijen wier geregistreerd partnerschap is beëindigd, opnieuw een geregistreerd partnerschap met
      elkaar aangaan dan wel met elkaar in het huwelijk treden, worden alle gevolgen van het geregistreerd partnerschap
      geacht steeds te hebben bestaan alsof er geen beëindiging heeft plaats gehad. Nochtans wordt de geldigheid van
      rechtshandelingen die tussen de inschrijving van de beëindiging en de nieuwe registratie of het huwelijk zijn
      verricht, beoordeeld naar het tijdstip van de handeling.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel80f
  - number: 80g
    text: |-
      1 Indien twee personen aan de ambtenaar van de burgerlijke stand kenbaar maken dat zij het geregistreerd
      partnerschap dat zij zijn aangegaan, omgezet wensen te zien in een huwelijk, kan de ambtenaar van de burgerlijke
      stand ter zake een akte van omzetting opmaken. Indien de geregistreerde partners van wie ten minste één de
      Nederlandse nationaliteit bezit, buiten Nederland woonplaats hebben en in Nederland hun geregistreerd partnerschap
      in een huwelijk willen omzetten, geschiedt de omzetting bij de ambtenaar van de burgerlijke stand te 's-Gravenhage.

      2 De [artikelen 65][ref1] en [66][ref2] zijn van overeenkomstige toepassing.

      3 Een omzetting doet het geregistreerd partnerschap eindigen en het huwelijk aanvangen op het tijdstip dat de akte
      van omzetting in het register van huwelijken is opgemaakt. De omzetting brengt geen wijziging in de al dan niet
      bestaande familierechtelijke betrekkingen met kinderen die voor de omzetting zijn geboren.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel66
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel80g
