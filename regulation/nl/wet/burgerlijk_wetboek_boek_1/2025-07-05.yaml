  - number: '136'
    text: |-
      1 Indien een goed onder aanwending van te verrekenen vermogen is verkregen, wordt het verkregen goed tot het te
      verrekenen vermogen gerekend voor het aandeel dat overeenkomt met het bij de verkrijging uit het te verrekenen
      vermogen aangewende gedeelte van de tegenprestatie gedeeld door de totale tegenprestatie. Indien een echtgenoot in
      verband met de verwerving van een goed een schuld is aangegaan, wordt het goed op de voet van de eerste volzin tot
      het te verrekenen vermogen gerekend voor zover de schuld daartoe wordt gerekend of daaruit is afgelost of betaald.

      2 Bestaat tussen de echtgenoten een geschil omtrent de vraag of een goed tot het te verrekenen vermogen wordt
      gerekend en kan geen van beiden bewijzen dat het goed tot het niet te verrekenen vermogen wordt gerekend, dan
      wordt dat goed aangemerkt als te rekenen tot het te verrekenen vermogen. Het vermoeden werkt niet ten nadele van de
      schuldeisers der echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel136
  - number: '137'
    text: |-
      1 Onverminderd het derde lid, geschiedt een verrekening in geld.

      2 Indien op grond van een verrekenbeding over en weer opeisbare vorderingen ontstaan, worden beide vorderingen van
      rechtswege met elkaar verrekend tot aan hun gemeenschappelijk beloop.

      3 Een echtgenoot is slechts gehouden een inbetalinggeving van goederen te aanvaarden dan wel kan deze slechts
      verlangen in plaats van een verrekening in geld, voor zover de verrekening in geld naar maatstaven van redelijkheid
      en billijkheid onaanvaardbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel137
  - number: '138'
    text: |-
      1 De ene echtgenoot is aan de andere geen verantwoording over het bestuur van zijn goederen schuldig. Slecht
      bestuur over die goederen verplicht niet tot schadevergoeding.

      2 De ene echtgenoot kan jaarlijks van de andere echtgenoot een gespecificeerde, schriftelijke en ondertekende
      opgave verzoeken van de te verrekenen inkomsten en van het te verrekenen vermogen. Van deze bepaling kan niet
      worden afgeweken.

      3 Geschillen tussen de echtgenoten betreffende de opgave worden op verzoek van een van hen door de rechtbank
      beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel138
  - number: '139'
    text: |-
      1 Een echtgenoot kan de opheffing van de wederzijdse verplichting tot verrekening verzoeken, wanneer
      de andere echtgenoot op lichtvaardige wijze schulden maakt, zijn goederen verspilt of weigert de in
      [artikel 138, tweede lid][ref1], bedoelde verplichte opgave omtrent zijn te verrekenen inkomsten of vermogen te
      verstrekken.

      2 Indien de echtgenoot tegen wie het verzoek zich richt, het te verrekenen vermogen benadeelt doordat hij na de
      aanvang van het geding of binnen zes maanden daarvoor lichtvaardig schulden heeft gemaakt, te verrekenen goederen
      heeft verspild, of een rechtshandeling als bedoeld in [artikel 88][ref2] zonder de vereiste toestemming of
      beslissing van de rechtbank heeft verricht, is hij gehouden de aangerichte schade te vergoeden.

      3 Van het eerste en tweede lid kan niet worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel138
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel88
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel139
