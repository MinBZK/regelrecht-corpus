        artikel: '986'
  - number: 26e
    text: |-
      De griffier van het college, waarbij de zaak laatstelijk aanhangig was, zendt een afschrift van de beschikking
      aan de ambtenaar van de burgerlijke stand in wiens registers een op de belanghebbende betrekking hebbende akte is
      opgenomen, waaraan een latere vermelding van de beschikking moet worden toegevoegd. Is bij de beschikking een last
      tot inschrijving van een in het buitenland opgemaakte akte gegeven, dan zendt de griffier een afschrift van de
      beschikking aan de ambtenaar van de burgerlijke stand te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel26e
  - number: '27'
    text: |-
      Naar aanleiding van een besluit van een ambtenaar van de burgerlijke stand om op grond van [artikel 18c][ref1] of
      [20c][ref2] te weigeren een akte van de burgerlijke stand op te maken, een latere vermelding aan een akte toe te
      voegen of, buiten het geval van stuiting van het huwelijk of het geregistreerd partnerschap en dat van afgifte van
      een afschrift of een uittreksel, aan een verrichting mee te werken, kunnen belanghebbende partijen binnen zes weken
      na de verzending van dat besluit een verzoek indienen bij de rechtbank binnen het rechtsgebied waar de standplaats
      van de ambtenaar van de burgerlijke stand is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel18c
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel20c
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 18c
        afdeling: '3'
