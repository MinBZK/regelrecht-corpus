  - number: '446'
    text: |-
      1 Voor zover de kantonrechter niet anders bepaalt, wordt bij het afleggen van de periodieke rekening en
      verantwoording hetgeen de goederen netto aan vruchten hebben opgebracht, onder aftrek van de verschuldigde
      beloning, aan de rechthebbende uitgekeerd. Op verzoek van de rechthebbende kan de kantonrechter andere tijdstippen
      voor de uitkering vaststellen.

      2 Bij zijn eindrekening en verantwoording draagt de bewindvoerder alle goederen af aan hem die na hem tot het
      beheer der goederen bevoegd is. De bewindvoerder is bevoegd de afdracht op te schorten tot de voldoening van een
      hem toekomend saldo.

      3 Wordt de rekening en verantwoording aan de kantonrechter afgelegd, dan blijven, tenzij de kantonrechter
      anders bepaalt, de netto-opbrengst of de af te dragen goederen onder het bewind van de bewindvoerder, totdat de
      rechthebbende tot de ontvangst in staat is of de onzekerheid, wie rechthebbende is, is opgeheven.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel446
  - number: 446a
    text: |-
      De bewindvoerder doet telkens na verloop van vijf jaren, of zo veel eerder als de kantonrechter bepaalt, aan deze
      verslag van het verloop van het bewind. Hij laat zich daarbij met name uit over de vraag of het bewind dient voort
      te duren dan wel of een minder ver, of een verder strekkende voorziening aangewezen is. Feiten die voor het bewind
      en het voortduren daarvan van betekenis zijn, deelt hij terstond aan de kantonrechter mede.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel446a
  - number: '447'
    text: |-
      1 De bewindvoerder heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling van Onze
      Minister van Veiligheid en Justitie zijn vastgesteld.

      2 Zijn er twee of meer bewindvoerders, dan wordt het loon dat hun gezamenlijk toekomt, tussen hen verdeeld in
      evenredigheid met de betekenis van de door ieder van hen verrichte werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel447
  - number: '448'
    text: |-
      1 De taak van de bewindvoerder eindigt:

      a. bij het einde van het bewind;

      b. door tijdsverloop, indien hij voor een bepaalde tijd was benoemd;

      c. door zijn dood, het ten aanzien van hem van toepassing verklaren van de schuldsaneringsregeling natuurlijke
      personen, zijn faillietverklaring of zijn ondercuratelestelling;

      d. door de instelling van een bewind als bedoeld in deze titel over één of meer van zijn goederen;

      e. door ontslag dat hem door de kantonrechter met ingang van een door deze bepaalde dag wordt verleend.

      2 Het ontslag wordt hem verleend hetzij op eigen verzoek, hetzij wegens gewichtige redenen of omdat hij niet
      meer voldoet aan de eisen om bewindvoerder te kunnen worden, zulks op verzoek van de medebewindvoerder of degene
      die gerechtigd is onderbewindstelling te verzoeken als bedoeld in [artikel 432, eerste en tweede lid][ref1], dan
      wel ambtshalve. Hangende het onderzoek kan de kantonrechter voorlopige voorzieningen in het bewind treffen en de
      bewindvoerder schorsen. De kantonrechter kan hiertoe zo nodig ook zonder de bewindvoerder tevoren te hebben gehoord
      overgaan. In dat geval verliest de beschikking haar kracht na verloop van twee weken, tenzij de bewindvoerder
      binnen deze termijn in de gelegenheid is gesteld om te worden gehoord.

      3 Een gewezen bewindvoerder blijft verplicht al datgene te doen, wat niet zonder nadeel voor de rechthebbende
      kan worden uitgesteld, totdat degene die na hem tot het beheer van de goederen bevoegd is, dit heeft aanvaard.
      In de gevallen genoemd in het eerste lid onder *c*, rust deze verplichting op zijn erfgenamen, onderscheidenlijk
      de bewindvoerder in de schuldsaneringsregeling natuurlijke personen of de curator, indien zij van het bewind
      kennisdragen; in het geval genoemd in het eerste lid onder *d*, geldt dit voor de bewindvoerder, belast met het
      daar bedoelde bewind.

      4 [Artikel 384 van dit boek][ref2] is van overeenkomstige toepassing.

      5 In geval van ontslag wegens gewichtige redenen of omdat de bewindvoerder niet meer voldoet aan de eisen om
      bewindvoerder te kunnen worden, kan de kantonrechter bepalen dat geen verdere rekening en verantwoording behoeft te
      worden afgelegd. Tevens kan de kantonrechter de boeken, bescheiden en andere gegevensdragers van de bewindvoerder,
      en alle aan de rechthebbende toekomende goederen in beslag nemen. Daartoe kan hij elke plaats betreden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel384
