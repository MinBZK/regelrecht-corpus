        artikel: 299a
        paragraaf: '3'
        afdeling: '6'
  - number: '282'
    text: |-
      1 Op eensluidend verzoek van de voogd en een ander die in een nauwe persoonlijke betrekking tot het kind staat, kan
      de rechter bepalen dat de voogdij door hen gezamenlijk wordt uitgeoefend.

      2 Voor de duur van de gezamenlijke uitoefening van de voogdij worden beide in het eerste lid bedoelde personen als
      voogd aangemerkt.

      3 Het verzoek wordt afgewezen indien gegronde vrees bestaat dat bij inwilliging de belangen van het kind zouden
      worden verwaarloosd.

      4 Gezamenlijke uitoefening van de voogdij is niet mogelijk ten aanzien van tijdelijke voogdij als bedoeld in de
      [artikelen 296][ref1] en [297][ref2]. Zij staat niet open voor rechtspersonen.

      5 [Artikel 253a][ref3] is van overeenkomstige toepassing.

      6 In afwijking van [artikel 336][ref4] hebben twee voogden die gezamenlijk de voogdij uitoefenen, de plicht en het
      recht het minderjarige kind te verzorgen en op te voeden. [Artikel 253w][ref5] is, zolang de gezamenlijke voogdij
      voortduurt, ten aanzien van hen beiden van overeenkomstige toepassing, tenzij het betreft pleegouders die zijn
      belast met de gezamenlijke voogdij en die met een zorgaanbieder een pleegcontract hebben gesloten als bedoeld in
      [artikel 5.2 van de Jeugdwet][ref6].

      7 Een verzoek als bedoeld in het eerste lid kan vergezeld gaan van een verzoek tot wijziging van de geslachtsnaam
      van het kind in de geslachtsnaam van een van de voogden, van beide voogden of van een voogd en de oorspronkelijke
      geslachtsnaam van het kind, in een vrij te bepalen volgorde. [Artikel 5, veertiende lid][ref7], is van
      overeenkomstige toepassing. Een zodanig verzoek wordt afgewezen, indien:

      a. het kind van twaalf jaar of ouder ter gelegenheid van zijn verhoor niet heeft ingestemd met het verzoek;

      b. het verzoek tot gezamenlijke voogdij wordt afgewezen; of

      c. het belang van het kind zich tegen toewijzing verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel296
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel297
