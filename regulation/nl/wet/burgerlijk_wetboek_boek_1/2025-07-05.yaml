  - number: '431'
    text: |-
      1 De kantonrechter kan een bewind instellen over één of meer van de goederen die een meerderjarige als
      rechthebbende toebehoren of zullen toebehoren

      a. voor een bepaalde of onbepaalde tijdsduur indien de meerderjarige tijdelijk of duurzaam niet in staat is ten
      volle zijn vermogensrechtelijke belangen behoorlijk waar te nemen als gevolg van zijn lichamelijke of geestelijke
      toestand, dan wel

      b. voor een bepaalde tijdsduur indien de meerderjarige tijdelijk niet in staat is ten volle zijn
      vermogensrechtelijke belangen behoorlijk waar te nemen als gevolg van verkwisting of het hebben van problematische
      schulden.

      2 Indien te verwachten is dat een minderjarige op het tijdstip waarop hij meerderjarig zal worden, in de in het
      vorige lid bedoelde toestand zal verkeren, kan het bewind reeds voor de meerderjarigheid worden ingesteld.

      3 Het bewind kan eveneens worden ingesteld indien te verwachten is dat de rechthebbende binnen afzienbare tijd in
      de in het eerste lid bedoelde toestand zal verkeren.

      4 De rechter bij wie een verzoek tot het verlenen van een rechterlijke machtiging als bedoeld in
      de [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref1] dan wel
      een zorgmachtiging of een machtiging tot voorzetting van de crisismaatregel als bedoeld in de
      [Wet verplichte geestelijke gezondheidszorg][ref2] aanhangig is, is tevens bevoegd tot de kennisneming van een
      verzoek tot instelling van het bewind.

      5 Onder aan de meerderjarige toebehorende goederen zijn in deze titel begrepen goederen die behoren tot zijn
      huwelijksgemeenschap of gemeenschap van geregistreerd partnerschap en die niet uitsluitend onder het bestuur van
      zijn echtgenoot dan wel geregistreerd partner staan.


      [ref1]: https://wetten.overheid.nl/BWBR0040632
      [ref2]: https://wetten.overheid.nl/BWBR0040635
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel431
    references:
