  - number: 205a
    text: |-
      1 Een verzoek tot vernietiging van de door de moeder gedane erkenning kan, op de grond dat de moeder niet de
      biologische moeder van het kind is, bij de rechtbank worden ingediend:

      a. door het kind zelf, tenzij de erkenning tijdens zijn meerderjarigheid heeft plaatsgevonden;

      b. door de erkenner, indien zij door bedreiging, dwaling, bedrog of, tijdens haar minderjarigheid, door misbruik
      van omstandigheden daartoe is bewogen;

      c. door de andere moeder, indien zij door bedreiging, dwaling, bedrog of, tijdens haar minderjarigheid, door
      misbruik van omstandigheden bewogen is toestemming tot de erkenning te geven.

      2 Op de vernietiging van de erkenning is [artikel 205, tweede tot en met vijfde lid][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel205
