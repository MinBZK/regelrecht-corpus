      1 De rechter die het bewind instelt, benoemt daarbij of zo spoedig mogelijk daarna een bewindvoerder. Hij vergewist
      zich van de bereidheid en vormt zich een oordeel over de geschiktheid van de te benoemen persoon.

      2 Zo nodig kan een tijdelijke bewindvoerder worden benoemd.

      3 De rechter volgt bij de benoeming van de bewindvoerder de uitdrukkelijke voorkeur van de rechthebbende, tenzij
      gegronde redenen zich tegen zodanige benoeming verzetten.

      4 Tenzij het vorige lid is toegepast, wordt, indien de rechthebbende is gehuwd, een geregistreerd partnerschap is
      aangegaan of anderszins een levensgezel heeft, bij voorkeur de echtgenoot, de geregistreerde partner dan wel andere
      levensgezel tot bewindvoerder benoemd. Is de vorige zin niet van toepassing dan wordt bij voorkeur een van zijn
      ouders, kinderen, broers of zusters tot bewindvoerder benoemd. Huwt de rechthebbende, gaat hij een geregistreerd
      partnerschap aan of verkrijgt hij een andere levensgezel, dan kan ieder van hen verzoeken dat de echtgenoot,
      de geregistreerde partner dan wel de andere levensgezel van de rechthebbende in de plaats van de tegenwoordige
      bewindvoerder wordt benoemd.

      5 Rechtspersonen met volledige rechtsbevoegdheid kunnen tot bewindvoerder worden benoemd.

      6 De volgende personen kunnen niet tot bewindvoerder worden benoemd:

      a. handelingsonbekwamen;

      b. zij ten behoeve van wie een mentorschap is ingesteld;

      c. zij van wie één of meer goederen onder een bewind als bedoeld in [titel 19][ref1] staan;

      d. zij die in staat van faillissement verkeren;

      e. zij ten aanzien van wie de schuldsaneringsregeling natuurlijke personen van toepassing is;

      f. de bewindvoerder van de rechthebbende in de zin [artikel 287, derde lid, van de Faillissementswet][ref2];

      g. een direct betrokken of behandelend hulpverlener;

      h. personen behorende tot de leiding of tot het personeel van de instelling waar de rechthebbende wordt verzorgd of
      die aan de rechthebbende begeleiding biedt;

      i. personen verbonden met de instelling waar de rechthebbende wordt verzorgd of die aan de rechthebbende
      begeleiding biedt, doordat:

      1° de instelling of personen behorende tot de leiding van de instelling, alleen of samen meer dan de helft van de
      stemrechten in de algemene vergadering van de rechtspersoon kunnen uitoefenen, dan wel meer dan de helft van de
      bestuurders of van de commissarissen van de rechtspersoon kunnen benoemen of ontslaan,

      2° de persoon en de instelling deel uitmaken van een groep in de zin van [artikel 24b van boek 2][ref3], of

      3° de bestuurder van de rechtspersoon tevens behoort tot de leiding of het personeel van de instelling.

      7 Een andere persoon dan in het vierde lid bedoeld, die ten behoeve van drie of meer personen bewindvoerder,
      curator of mentor is, komt alleen dan voor benoeming in aanmerking indien deze wat zijn bedrijfsvoering en
      scholing betreft, alsmede, voor zover van toepassing, de werving, de scholing en begeleiding van en het toezicht
      op de personen door wie hij de taken van een bewindvoerder uitoefent, voldoet aan bij algemene maatregel van
      bestuur te stellen kwaliteitseisen, alsmede aan de verplichtingen bedoeld in [artikel 436, vierde lid][ref4], en
      [artikel 15i van boek 3][ref5].

      8 De persoon, bedoeld in het zevende lid, legt aan de rechter die hem benoemt, over:

      a. zijn verklaring dat hij aan de in het zevende lid bedoelde kwaliteitseisen en verplichtingen voldoet,

      b. een verslag van een accountant als bedoeld in [artikel 393, eerste lid, van boek 2][ref6], van diens bevindingen
      over de wijze waarop aan de eisen en verplichtingen wordt voldaan, en

      c. een verklaring van de accountant omtrent de balans en staat van baten en lasten, bedoeld in
      [artikel 10 van boek 2][ref7], dan wel, voor zover van toepassing, omtrent de jaarrekening overeenkomstig
      [titel 9 van boek 2][ref8]. [Artikel 396, zevende lid, van boek 2][ref9] is ten aanzien van
      [artikel 393 lid 1][ref10] niet van toepassing.

      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de vorm en de inhoud van de
      verklaringen en het verslag, alsmede de wijze van overlegging. Toont de persoon aan dat hij in de twaalf maanden
      voorafgaande aan zijn benoeming de verklaringen en het verslag reeds aan de rechter heeft overgelegd, dan is hij
      van de overlegging vrijgesteld.

      9 Van de overlegging van de in het achtste lid bedoelde verklaring van de accountant zijn vrijgesteld:

      a. zij die een financiële onderneming zijn die ingevolge de [Wet op het financieel toezicht][ref11] het bedrijf van
      bank mogen uitoefenen,

      b. notarissen,

      c. gerechtsdeurwaarders,

      d. accountants.

      Bij algemene maatregel van bestuur kunnen de in de vorige zin bedoelde ondernemingen en beroepsbeoefenaren
      geheel of gedeeltelijk worden vrijgesteld van de in het zevende lid bedoelde eisen inzake de werving, scholing
      en bedrijfsvoering

      10 De benoemde wordt bewindvoerder daags nadat de beschikking is verstrekt of verzonden, tenzij de beschikking een
      later tijdstip vermeldt.


