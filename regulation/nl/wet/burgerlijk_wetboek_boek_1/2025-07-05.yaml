        artikel: 26b
        afdeling: '11'
  - number: 27b
    text: |-
      De griffier zendt een afschrift van de beschikking aan de belanghebbende partijen en aan de ambtenaar van de
      burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel27b
  - number: '28'
    text: |-
      1 Iedere Nederlander van zestien jaar of ouder die de overtuiging heeft tot het andere geslacht te behoren dan is
      vermeld in de akte van geboorte, kan van die overtuiging aangifte doen bij de ambtenaar van de burgerlijke stand
      onder wie de desbetreffende akte berust. Indien de akte van geboorte niet hier te lande in de registers van de
      burgerlijke stand is ingeschreven, geschiedt de aangifte bij de ambtenaar van de burgerlijke stand van de gemeente
      ’s-Gravenhage.

      2 Voor de toepassing van het eerste lid en het derde lid alsmede de [artikelen 28a][ref1] en [28b][ref2] wordt
      onder akte van geboorte mede verstaan een akte van inschrijving van een buiten Nederland opgemaakte akte van
      geboorte of van een beschikking als bedoeld in [artikel 25c][ref3].

      3 Degene die de Nederlandse nationaliteit niet bezit kan een aangifte als bedoeld in het eerste lid doen, indien
      hij gedurende een tijdvak van ten minste één jaar, onmiddellijk voorafgaande aan de aangifte, woonplaats in
      Nederland heeft en een rechtsgeldige verblijfstitel heeft. In dat geval wordt tevens een afschrift van de akte van
      geboorte overgelegd.

      4 De minderjarige van zestien jaar of ouder is bekwaam tot het doen van de in het eerste lid bedoelde aangifte ten
      behoeve van zichzelf, alsmede om ter zake in en buiten rechte op te treden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel28a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 28a
