  - number: 432a
    text: |-
      1 Dit artikel is van toepassing indien het college van burgemeester en wethouders van de
      gemeente waar de rechthebbende woonplaats heeft, schriftelijk aan de griffier van de ingevolge
      [artikel 266 van het Wetboek van Burgerlijke Rechtsvordering][ref1] bevoegde rechtbank kenbaar heeft gemaakt dat
      het advies wenst uit te brengen over de vraag of een voldoende behartiging van de belangen van rechthebbenden kan
      worden bewerkstelligd met een meer passende en minder verstrekkende voorziening dan met de voortzetting van bewind,
      totdat het college deze verklaring schriftelijk intrekt.

      2 De rechter verplicht de bewindvoerder binnen drie maanden na de instelling van een bewind wegens
      verkwisting of het hebben van problematische schulden afschrift van de boedelbeschrijving, bedoeld in
      [artikel 436, eerste lid][ref2], en een plan van aanpak te zenden aan het college.

      3 De rechter kan de bewindvoerder verplichten binnen drie maanden na de instelling van een bewind wegens een
      lichamelijke of geestelijke toestand afschrift van de bescheiden, bedoeld in het tweede lid, te zenden aan het
      college indien tevens sprake is van problematische schulden.

      4 Indien de rechter de bewindvoerder verplicht de bescheiden, bedoeld in het tweede lid, te zenden aan het college,
      kan het college aan de rechter een advies als bedoeld in het eerste lid uitbrengen. De bewindvoerder bericht het
      college binnen twee weken na de instelling van het bewind over de instelling.

      5 Het college verstrekt het advies aan de griffier, de rechthebbende en de bewindvoerder binnen vier weken na
      ontvangst van de bescheiden, bedoeld in het tweede lid.

      6 Indien het college adviseert dat een voldoende behartiging van de belangen van de rechthebbende kan worden
      bewerkstelligd met een meer passende en minder verstrekkende voorziening, beslist de rechter of het bewind wordt
      voortgezet dan wel beëindigd. De griffier zendt afschrift van de beschikking aan het college. In afwijking van
      [artikel 806, eerste lid, onderdeel a, van het Wetboek van Burgerlijke Rechtsvordering][ref3] staat voor het
      college geen hoger beroep open tegen de beschikking.

      7 Gelet op artikel 9, tweede lid, onderdeel b, van de Algemene verordening gegevensverwerking is het verbod om
      gegevens over de gezondheid van de rechthebbende te verwerken niet van toepassing indien de verwerking noodzakelijk
      is in het kader van het verstrekken van een advies als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel436
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel806
