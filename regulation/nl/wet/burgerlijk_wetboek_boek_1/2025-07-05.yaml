  - number: '254'
    text: |-
      In deze afdeling wordt verstaan onder gecertificeerde instelling: gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1.1'
  - number: '255'
    text: |-
      1 De kinderrechter kan een minderjarige onder toezicht stellen van een gecertificeerde instelling indien een
      minderjarige zodanig opgroeit dat hij in zijn ontwikkeling ernstig wordt bedreigd, en:

      a. de zorg die in verband met het wegnemen van de bedreiging noodzakelijk is voor de minderjarige of voor zijn
      ouders of de ouder die het gezag uitoefenen, door dezen niet of onvoldoende wordt geaccepteerd, en

      b. de verwachting gerechtvaardigd is dat de ouders of de ouder die het gezag uitoefenen binnen een gelet op de
      persoon en de ontwikkeling van de minderjarige aanvaardbaar te achten termijn, de verantwoordelijkheid voor de
      verzorging en opvoeding, bedoeld in [artikel 247, tweede lid][ref1], in staat zijn te dragen.

      2 De kinderrechter kan een minderjarige onder toezicht stellen op verzoek van de raad voor de kinderbescherming of
      het openbaar ministerie. Tevens zijn een ouder en degene die niet de ouder is en de minderjarige als behorende tot
      zijn gezin verzorgt en opvoedt bevoegd tot het doen van het verzoek indien de raad voor de kinderbescherming niet
      tot indiening van het verzoek overgaat.

      3 Indien de raad niet tot indiening van een verzoek tot ondertoezichtstelling overgaat nadat hij een verzoek
      tot onderzoek als bedoeld in [artikel 2.4, eerste lid, van de Jeugdwet][ref2] heeft ontvangen, deelt hij dit
      schriftelijk mee aan het college van burgemeester en wethouders dat het verzoek heeft gedaan. De burgemeester kan
      na ontvangst van die mededeling de raad voor de kinderbescherming verzoeken het oordeel van de kinderrechter te
      vragen of het noodzakelijk is de minderjarige onder toezicht te stellen van een gecertificeerde instelling. De
      raad voor de kinderbescherming die van de burgemeester zodanig verzoek ontvangt, vraagt binnen twee weken na de
      dagtekening van dat verzoek het oordeel van de kinderrechter of een ondertoezichtstelling van de minderjarige moet
      volgen. In dat geval kan de kinderrechter de ondertoezichtstelling ambtshalve uitspreken.

      4 De kinderrechter vermeldt in de beschikking de concrete bedreigingen in de ontwikkeling van de minderjarige
      alsmede de daarop afgestemde duur waarvoor de ondertoezichtstelling zal gelden.

      5 Indien het verzoek, bedoeld in het tweede lid, niet alle minderjarigen betreft over wie de ouders of de ouder
      het gezag uitoefenen, kan de kinderrechter dit op verzoek van de raad voor de kinderbescherming of ambtshalve
      aanvullen, en deze minderjarigen, mits aan de grond van het eerste lid is voldaan, eveneens onder toezicht stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel255
