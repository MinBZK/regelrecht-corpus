      1 [Artikel 253q][ref1] is van overeenkomstige toepassing, indien:

      a. de ouders of de ouder die het gezag uitoefenen al dan niet tijdelijk in de onmogelijkheid verkeren het gezag uit
      te oefenen; of

      b. het bestaan of de verblijfplaats van de ouders of van één van hen die het gezag uitoefenen, onbekend is.

      2 In het geval een der ouders het gezag alleen uitoefent overeenkomstig [artikel 253q, eerste lid][ref2], is
      gedurende de tijd waarin een van de in het eerste lid bedoelde omstandigheden zich voordoet het gezag van de andere
      ouder geschorst. In de overige gevallen is het gezag geschorst totdat de rechter de ouders of een van hen wederom
      met het gezag belast. In afwijking van artikel 253q kan de rechter dit slechts doen indien aan de vereisten gesteld
      in [artikel 277, eerste lid][ref3], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel277
