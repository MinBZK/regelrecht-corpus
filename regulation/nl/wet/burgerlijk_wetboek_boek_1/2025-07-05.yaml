  - number: '403'
    text: |-
      Geen uitkering is verschuldigd over de tijd, die op het tijdstip van het indienen van het verzoek reeds meer dan
      vijf jaren is verstreken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel403
  - number: '404'
    text: |-
      1 Ouders zijn verplicht naar draagkracht te voorzien in de kosten van verzorging en opvoeding van hun minderjarige
      kinderen.

      2 Gelijke verplichting bestaat voor een stiefouder in het geval van [artikel 395 van dit boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel395
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel404
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '395'
        afdeling: '1'
  - number: '406'
    text: |-
      1 Komt een ouder of stiefouder zijn verplichting tot voorziening in de kosten van verzorging en opvoeding niet of
      niet behoorlijk na, dan kan de andere ouder of voogd de rechtbank verzoeken het bedrag te bepalen dat deze ouder of
      stiefouder ten behoeve van het kind zal moeten uitkeren.

      2 De rechtbank kan het in het vorige lid bedoelde bedrag reeds bepalen gelijktijdig met een door haar te geven
      beslissing omtrent het gezag.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel406
  - number: 406a
    text: |-
      Een op [artikel 394][ref1] gegrond verzoek kan ten behoeve van een minderjarig kind door hem die het gezag over het
      kind heeft, worden gedaan. De ouder of voogd van het kind behoeft de in [artikel 349, eerste en tweede lid][ref2],
      bedoelde machtiging niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel349
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel406a
