  - number: '29'
    text: Er is een Commissie van advies voor de zaken betreffende de burgerlijke staat en de nationaliteit.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel29
  - number: 29a
    text: |-
      1 De Commissie bestaat uit ten minste negen en ten hoogste vijftien leden.

      2 De Commissie bestaat uit ten minste een lid van de rechterlijke macht, ten minste een lid uit de kring van het
      wetenschappelijk onderzoek, ten minste twee leden uit de kring van de ambtenaren van de burgerlijke stand en ten
      minste twee leden uit de kring van de basisregistratie personen.

      3 Onze Minister van Justitie benoemt en ontslaat de in het voorgaande lid bedoelde leden in overeenstemming met
      Onze Minister van Binnenlandse Zaken. Voorts wijst hij een voorzitter en een secretaris aan.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel29a
  - number: 29b
    text: |-
      1 De Commissie brengt op verzoek van een ambtenaar van de burgerlijke stand of een ander bestuursorgaan advies uit
      over vragen betreffende de rechtstoepassing in zaken van burgerlijke staat of nationaliteit.

      2 Indien een advies van algemeen belang is, wordt het openbaar gemaakt. De Commissie bepaalt de wijze van
      openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel29b
  - number: 29c
    text: |-
      Indien een ambtenaar van de burgerlijke stand gerede twijfel heeft over de vraag of een aan een buiten Nederland
      opgemaakte akte van de burgerlijke stand of ander geschrift te ontlenen gegeven in aanmerking komt om in een akte
      van de burgerlijke stand te worden opgenomen, is hij gehouden het advies van de Commissie in te winnen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel29c
  - number: 29d
    text: |-
      Indien een ambtenaar van de burgerlijke stand een door de Commissie gegeven advies niet opvolgt, stelt hij de
      Commissie en de officier van justitie hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel29d
  - number: 29e
    text: Onze Minister van Justitie kan nadere regels stellen omtrent de taak en de werkwijze van de Commissie.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel29e
  - number: 29f
    text: |-
      Telkens binnen een termijn van vier jaren brengt de Commissie een rapport uit aan Onze Minister van Justitie,
      waarin de taakvervulling van de Commissie aan een onderzoek wordt onderworpen en voorstellen kunnen worden gedaan
      voor gewenste veranderingen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel29f
  - number: '30'
    text: |-
      1 Een huwelijk kan worden aangegaan door twee personen van verschillend of van gelijk geslacht.

      2 De wet beschouwt het huwelijk alleen in zijn burgerlijke betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel30
  - number: '31'
    text: Om een huwelijk te mogen aangaan moeten een man en een vrouw de leeftijd van achttien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel31
  - number: '32'
    text: |-
      Een huwelijk mag niet worden aangegaan, wanneer de geestvermogens van een partij zodanig zijn gestoord, dat deze
      niet in staat is haar wil te bepalen of de betekenis van haar verklaring te begrijpen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel32
  - number: '33'
    text: Een persoon kan tegelijkertijd slechts met één andere persoon door het huwelijk verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel33
  - number: '37'
    text: |-
      1 Hij die wegens gewoonte van drank- of drugsmisbruik onder curatele staat, mag geen huwelijk aangaan zonder de
      toestemming van zijn curator.

      2 Voor zover die toestemming niet wordt verkregen, kan zij op verzoek van de onder curatele gestelde door
      toestemming van de kantonrechter worden vervangen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel37
  - number: '38'
    text: |-
      Hij die wegens zijn lichamelijke of geestelijke toestand onder curatele staat, mag geen huwelijk aangaan zonder
      toestemming van de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel38
  - number: '39'
    text: |-
      1 Heeft de rechter de toestemming verleend, dan is de termijn van beroep veertien dagen en kan gedurende die
      termijn de beschikking niet worden ten uitvoer gelegd.

      2 Hij die tegen een verleende toestemming opkomt, is verplicht dit binnen de termijn van beroep bij
      deurwaardersexploit te doen aanzeggen aan de ambtenaar of ambtenaren van de burgerlijke stand ten overstaan van
      wie het huwelijk kan worden voltrokken. Door dit te verzuimen verliest hij het recht om de nietigverklaring van
      het huwelijk op grond van het ontbreken van zijn toestemming te vragen, indien het gerechtshof de in het eerste lid
      bedoelde beschikking vernietigt en het huwelijk reeds is voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel39
  - number: '41'
    text: |-
      1 Een huwelijk mag niet worden gesloten tussen hen die elkander, hetzij van nature hetzij familierechtelijk,
      bestaan in de opgaande en in de nederdalende lijn of als broeders, zusters of broeder en zuster.

      2 Onze Minister van Justitie kan om gewichtige redenen ontheffing van het verbod verlenen aan hen die broeders,
      zusters of broeder en zuster door adoptie zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel41
  - number: 41a
    text: |-
      Een huwelijk mag niet worden gesloten tussen hen die elkander, hetzij van nature hetzij familierechtelijk,
      als bloedverwanten bestaan in de derde of vierde graad in de zijlinie, tenzij de aanstaande echtgenoten bij de
      ambtenaar van de burgerlijke stand ieder een beëdigde verklaring hebben afgelegd, inhoudende dat zij hun vrije
      toestemming tot het huwelijk geven.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel41a
  - number: '42'
    text: |-
      Zij die met elkander een huwelijk willen aangaan, mogen niet tegelijkertijd een geregistreerd partnerschap zijn
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel42
  - number: '44'
    text: |-
      1 Ten behoeve van het kenbaar maken van hun voornemen om in het huwelijk te treden verstrekken de aanstaande
      echtgenoten van wie ten minste één uitsluitend of mede de Nederlandse nationaliteit bezit of in Nederland zijn
      gewone verblijfplaats heeft aan de ambtenaar van de burgerlijke stand:

      a. hun geslachtsnaam, voornamen, woonplaats en geboortegegevens, alsmede een verklaring dat zij elkaar niet als
      bloedverwanten bestaan in de derde of vierde graad in de zijlinie, dan wel een beëdigde verklaring als bedoeld
      in [artikel 41a][ref1];

      b. indien toestemming tot het aangaan van een huwelijk is vereist, de gegevens van degenen wier toestemming
      noodzakelijk is, dan wel het bewijs dat deze hun toestemming hebben verleend. De toestemming kan ook ter
      gelegenheid van de huwelijksvoltrekking worden gegeven. Is de toestemming door de rechter verleend, dan verifieert
      de ambtenaar het bestaan daarvan bij de betrokken griffie;

      c. de overlijdensgegevens van allen wier toestemming voor het huwelijk was vereist, als zij in leven waren geweest;

      d. de gegevens inzake ontbinding van eventuele eerdere huwelijken of geregistreerde partnerschappen;

      e. in geval van stuiting, de gegevens inzake de opheffing daarvan;

      f. de ontheffing of de vergunning van Onze Minister van Justitie, ingeval deze is vereist;

      g. een vrijstelling krachtens [artikel 62][ref2], indien deze is verkregen;

      h. de namen en adressen van de personen die als getuigen bij de voltrekking van het huwelijk aanwezig zullen zijn;

      i. ingeval een aanstaande echtgenoot niet de Nederlandse nationaliteit bezit of rechtmatig in Nederland
      verblijft als bedoeld in [artikel 8, onder b, d of e, van de Vreemdelingenwet 2000][ref3], een verklaring dat
      het voornemen om in het huwelijk te treden niet wordt aangegaan met het oogmerk om verblijfsrecht in Nederland te
      verkrijgen, alsmede een verklaring omtrent het verblijfsrecht van de aanstaande echtgenoot die niet de Nederlandse
      nationaliteit bezit;

      j. de naam van de gemeente in Nederland waar het huwelijk zal worden voltrokken.

      2 Wanneer de aanstaande echtgenoten, van wie ten minste één de Nederlandse nationaliteit bezit, buiten Nederland
      hun woonplaats hebben, kunnen zij zich ten behoeve van hun voornemen om in het huwelijk te treden uitsluitend tot
      de ambtenaar van de burgerlijke stand van de gemeente ’s-Gravenhage wenden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel41a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel44
    references:
      - id: ref1
