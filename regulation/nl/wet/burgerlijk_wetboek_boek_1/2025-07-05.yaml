  - number: 253q
    text: |-
      1 Wanneer een van de ouders die gezamenlijk het gezag over hun minderjarige kinderen uitoefenen, op een der in
      [artikel 246][ref1] genoemde gronden daartoe onbevoegd is, oefent de andere ouder alleen het gezag over de kinderen
      uit. Wanneer de grond van de onbevoegdheid is weggevallen, herleeft van rechtswege het gezamenlijke gezag.

      2 Wanneer beide ouders die gezamenlijk het gezag over hun minderjarige kinderen uitoefenen, daartoe op een der in
      [artikel 246][ref2] genoemde gronden onbevoegd zijn, benoemt de rechtbank een voogd.

      3 Wanneer een ouder die alleen het gezag uitoefent, op een der in [artikel 246][ref3] genoemde gronden daartoe
      onbevoegd is, belast de rechtbank de andere ouder met het gezag, tenzij de rechter oordeelt dat het belang van de
      minderjarige zich hiertegen verzet. Alsdan benoemt zij een voogd.

      4 De in het tweede en derde lid bedoelde beslissingen worden gegeven op verzoek van een ouder, bloed- of
      aanverwanten van de minderjarige, de raad voor de kinderbescherming, de gecertificeerde instelling, bedoeld in
      [artikel 1.1 van de Jeugdwet][ref4], een rechtspersoon een daartoe door Onze Minister van Veiligheid en Justitie
      aanvaarde rechtspersoon als bedoeld in [artikel 256, eerste lid][ref5], en [artikel 302, tweede lid][ref6], of
      ambtshalve.

      5 Wanneer de grond van de onbevoegdheid ten aanzien van de ouder die het gezag alleen uitoefende, is vervallen,
      belast de rechtbank deze ouder op zijn verzoek wederom met het gezag tenzij de rechtbank oordeelt dat het belang
      van de minderjarige zich hiertegen verzet. Op verzoek van de ouders of een van hen kan hij de ouders gezamenlijk
      met het gezag belasten.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
