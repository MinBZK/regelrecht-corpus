  - number: 247a
    text: |-
      Indien de ouders het gezag gezamenlijk uitoefenen op grond van [artikel 251b, eerste lid][ref1],
      of een aantekening als bedoeld in [artikel 252, eerste lid][ref2], is geplaatst en de
      ouders hun samenleving beëindigen, stellen zij een ouderschapsplan op als bedoeld in
      [artikel 815, tweede en derde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251b
