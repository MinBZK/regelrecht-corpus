        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
  - number: '326'
    text: |-
      1 Kinderen die onder voogdij staan van natuurlijke personen, kunnen onder toezicht worden gesteld.

      2 Op deze ondertoezichtstelling is [afdeling 4 van titel 14][ref1] van overeenkomstige toepassing, met dien
      verstande nochtans, dat de ondertoezichtstelling en de verlenging daarvan ook door de voogd kunnen worden verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling4
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel326
    references:
