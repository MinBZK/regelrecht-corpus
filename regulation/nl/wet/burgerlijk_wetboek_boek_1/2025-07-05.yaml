  - number: '416'
    text: Geen hogere voorziening is toegelaten tegen beschikkingen, houdende bevel tot oproeping van de vermiste.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel416
  - number: '417'
    text: |-
      1 Zodra de beschikking, houdende vaststelling van vermissing, in kracht van gewijsde is gegaan, zendt de griffier
      van het college waarvoor de zaak laatstelijk aanhangig was, een afschrift van de beschikking aan de ambtenaar
      van de burgerlijke stand van de verlaten woonplaats of, bij gebreke van verlaten woonplaats in Nederland,
      van de gemeente 's-Gravenhage. Deze ambtenaar maakt van de beschikking een akte van inschrijving op, welke in
      overeenstemming is met de beschikking en dit uitdrukkelijk vermeldt.

      2 Deze akte van overlijden bewijst ten aanzien van een ieder dwingend, dat de vermiste op de in de akte vermelde
      dag is overleden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel417
  - number: '418'
    text: |-
      1 Erfgenamen en legatarissen van degene ten aanzien van wie de vermissing is vastgesteld, zijn verplicht alvorens
      zij de goederen van de nalatenschap in bezit nemen, ten genoegen van de kantonrechter zekerheid te stellen voor
      hetgeen zij aan degene wiens vermissing is vastgesteld, mocht deze terugkeren, of aan erfgenamen of legatarissen
      die een beter recht mochten hebben, moeten afdragen.

      2 De erfgenamen zijn verplicht na de inbezitneming een behoorlijke boedelbeschrijving op te maken.

      3 Registergoederen mogen niet vervreemd of bezwaard worden, tenzij om gewichtige redenen en met verlof van de
      kantonrechter. Kunnen zij bij een boedelscheiding niet zonder verkoop worden verdeeld, dan worden zij onder bewind
      van een derde gesteld, die de inkomsten van die goederen overeenkomstig hetgeen dienaangaande bij de verdeling is
      vastgesteld zal uitkeren.

      4 De verdeling geschiedt bij authentieke akte, waaruit tevens moet blijken wat aan legatarissen of andere
      gerechtigden is uitgekeerd.

      5 De goederen der nalatenschap mogen niet worden verkwist en daaruit mogen niet bovenmatige giften worden gedaan.

      6 Erfgenamen en legatarissen zijn verplicht desgevraagd aan de kantonrechter de nodige inlichtingen te geven.

      7 De in dit artikel genoemde verplichtingen vervallen op het door de kantonrechter bepaalde tijdstip, en uiterlijk
      na verloop van vijf jaren na de dag waarop de akte van overlijden overeenkomstig [artikel 417][ref1] is opgemaakt.
      De rechtbank die de beschikking, houdende vaststelling van vermissing geeft kan, gelet op de omstandigheden van het
      geval, daarbij tevens bepalen dat een of meer der in dit artikel genoemde verplichtingen niet zullen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel417
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel418
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '417'
        afdeling: '2'
  - number: '419'
    text: |-
      De akte waarbij zekerheid is gesteld, de boedelbeschrijving en de akte van verdeling moeten in origineel of in
      authentiek afschrift worden neergelegd ter griffie van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel419
  - number: '420'
    text: |-
      1 Wanneer het aan de kantonrechter blijkt, dat een erfgenaam of legataris de hem in de twee voorgaande artikelen
      opgelegde verplichtingen niet is nagekomen, kan hij voor de goederen die aan die erfgenaam of legataris uit de
      nalatenschap toekomen, een bewindvoerder benoemen, wiens bewind eindigt, wanneer de kantonrechter beslist dat de
      betrokkene alsnog zijn wettelijke verplichtingen heeft nageleefd.

      2 Voor zover de kantonrechter niet anders bepaalt, vinden op het bewind van de bewindvoerder de
      [artikelen 338][ref1], [339][ref2], [340][ref3], [342-357][ref4], [358 lid 1][ref5] en [359-363 van dit boek][ref6]
      overeenkomstige toepassing, met dien verstande dat de bewindvoerder verplicht is jaarlijks ter griffie van de
      rechtbank een rekening in te dienen van zijn bewind.

      3 De bewindvoerder heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling van Onze
      Minister van Veiligheid en Justitie zijn vastgesteld.

      4 De kantonrechter kan te allen tijde de bewindvoerder ontslaan en door een ander vervangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel338
