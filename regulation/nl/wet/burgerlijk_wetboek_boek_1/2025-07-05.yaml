  - number: 253l
    text: |-
      1 Elke ouder die het gezag over zijn kind uitoefent, heeft het vruchtgenot van diens vermogen. Indien het kind
      bij de ouder inwoont en anders dan incidenteel inkomen uit arbeid geniet, is het verplicht naar draagkracht bij te
      dragen in de kosten van de huishouding van het gezin.

      2 Het eerste lid is van overeenkomstige toepassing in geval het gezag van de ouder is beëindigd, tenzij de andere
      ouder het gezag uitoefent.

      3 Aan bedoeld vruchtgenot zijn de lasten verbonden, die op vruchtgebruikers rusten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253l
  - number: 253m
    text: |-
      De ouder heeft geen vruchtgenot van het vermogen, ten aanzien waarvan bij uiterste wilsbeschikking van de erflater
      of bij de gift is bepaald dat de ouders daarvan het vruchtgenot niet zullen hebben.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253m
  - number: 253n
    text: |-
      1 Op verzoek van de niet met elkaar gehuwde ouders of een van hen kan de rechtbank het gezamenlijk gezag,
      bedoeld in de [artikelen 251, tweede lid][ref1], [251b, eerste lid][ref2], [252, eerste lid][ref3],
      [253q, vijfde lid][ref4], of [277, eerste lid][ref5], beëindigen, indien nadien de omstandigheden zijn gewijzigd of
      bij het nemen van de beslissing van onjuiste of onvolledige gegevens is uitgegaan. Alsdan bepaalt de rechtbank aan
      wie van de ouders voortaan het gezag over ieder der minderjarige kinderen toekomt.

      2 Het [eerste en derde lid van artikel 251a][ref6] zijn van overeenkomstige toepassing.


