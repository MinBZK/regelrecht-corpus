  - number: '5'
    text: |-
      1 Indien een kind alleen in familierechtelijke betrekking tot de moeder staat, heeft het haar geslachtsnaam.

      2 Indien een kind door erkenning in familierechtelijke betrekking tot de vader komt te staan, houdt het de
      geslachtsnaam van de moeder, tenzij de moeder en de erkenner ter gelegenheid van de erkenning gezamenlijk verklaren
      dat het kind de geslachtsnaam van de vader zal hebben of van beide ouders in een vrij te bepalen volgorde. Van
      deze verklaring wordt melding gemaakt in de akte van erkenning. De eerste twee volzinnen zijn van overeenkomstige
      toepassing bij erkenning van een ongeboren kind. De ouders kunnen evenwel ter gelegenheid van de voltrekking
      van hun huwelijk of van de registratie van hun partnerschap alsnog gezamenlijk verklaren, dat hun kind voortaan
      de geslachtsnaam van de andere ouder zal hebben of van beide ouders in een vrij te bepalen volgorde. Van deze
      verklaring wordt een akte van naamskeuze opgemaakt. Indien een kind door gerechtelijke vaststelling van het
      vaderschap in familierechtelijke betrekking tot de vader komt te staan, houdt het de geslachtsnaam van de moeder,
      tenzij de moeder en de man, wiens vaderschap is vastgesteld, ter gelegenheid van de vaststelling gezamenlijk
      verklaren dat het kind de geslachtsnaam van de vader zal hebben of van beide ouders in een vrij te bepalen
      volgorde. De rechterlijke uitspraak inzake de vaststelling van het vaderschap vermeldt de verklaring van de ouders
      omtrent de geslachtsnaamkeuze.

      3 Indien een kind door adoptie in familierechtelijke betrekking komt te staan tot beide adoptanten van verschillend
      geslacht, die met elkaar zijn gehuwd, heeft het kind de geslachtsnaam van de vader, tenzij de adoptanten ter
      gelegenheid van de adoptie gezamenlijk verklaren dat het kind de geslachtsnaam van de moeder, de oorspronkelijke
      geslachtsnaam of de geslachtsnaam van beide adoptanten in een vrij te bepalen volgorde of van één van hen in
      combinatie met de oorspronkelijke geslachtsnaam van het kind in een vrij te bepalen volgorde zal hebben. Indien
      de adoptanten niet met elkaar gehuwd zijn of indien beide adoptanten van hetzelfde geslacht zijn en met elkaar
      gehuwd zijn, houdt het kind de geslachtsnaam die het heeft, tenzij de adoptanten ter gelegenheid van de adoptie
      gezamenlijk verklaren dat het een van hun beider geslachtsnamen zal hebben of van hen beiden in een vrij te bepalen
      volgorde of van één van hen in combinatie met de oorspronkelijke geslachtsnaam van het kind in een vrij te bepalen
      volgorde. Indien een kind door adoptie in familierechtelijke betrekking tot één adoptant komt te staan, heeft het
      kind de geslachtsnaam van de adoptant, tenzij de adoptant ter gelegenheid van de adoptie verklaart dat het kind de
      oorspronkelijke geslachtsnaam dan wel de naam van de adoptant in combinatie met de oorspronkelijke geslachtsnaam
      van het kind in een vrij te bepalen volgorde zal hebben. Indien een kind door adoptie in familierechtelijke
      betrekking tot de echtgenoot, geregistreerde partner of andere levensgezel van een ouder komt te staan, houdt het
      zijn geslachtsnaam, tenzij de ouder en diens echtgenoot, geregistreerde partner of andere levensgezel gezamenlijk
      verklaren dat het kind de geslachtsnaam zal hebben van die ouder dan wel de geslachtsnaam van de echtgenoot,
      geregistreerde partner of andere levensgezel of van hen beiden in een vrij te bepalen volgorde of van één van hen
      in combinatie met de oorspronkelijke geslachtsnaam van het kind in een vrij te bepalen volgorde. De rechterlijke
      uitspraak inzake de adoptie vermeldt de verklaring van de adoptanten omtrent de geslachtsnaamkeuze.

      4 Indien een kind door geboorte in familierechtelijke betrekking tot beide ouders komt te staan, verklaren de
      ouders gezamenlijk voor of ter gelegenheid van de aangifte van de geboorte welke geslachtsnaam het kind zal hebben.
      Dat kan de geslachtsnaam zijn van één van de ouders of de geslachtsnamen van beide ouders in een vrij te bepalen
      volgorde. Van de verklaring van de ouders die voor de aangifte van de geboorte wordt afgelegd, wordt een akte
      van naamskeuze opgemaakt. Van de verklaring van de ouders die ter gelegenheid van de aangifte van de geboorte
      wordt afgelegd, wordt melding gemaakt in de akte van geboorte. Het voorgaande is van overeenkomstige toepassing
      indien een ouder en zijn echtgenoot of geregistreerde partner die niet de ouder is, van rechtswege gezamenlijk
      het gezag als bedoeld in [artikel 253sa][ref1] over het kind zullen uitoefenen of uitoefenen. De verklaring die
      niet ter gelegenheid van de aangifte van de geboorte wordt afgelegd, kan ten overstaan van iedere ambtenaar van de
      burgerlijke stand worden afgelegd.

      5 Wordt een verklaring houdende naamskeuze, bedoeld in het vierde lid, voor of ter gelegenheid van de aangifte van
      de geboorte afgelegd, dan heeft het kind de gekozen naam vanaf de geboorte. Geschiedt de naamskeuze niet uiterlijk
      ter gelegenheid van de aangifte van de geboorte, dan neemt de ambtenaar van de burgerlijke stand als geslachtsnaam
      van het kind in de geboorteakte op:

      a. de geslachtsnaam van de vader in geval het kind door geboorte in familierechtelijke betrekking tot beide ouders
      komt te staan;

      b. de geslachtsnaam van de moeder in geval een ouder en zijn echtgenoot of geregistreerde partner die niet de ouder
      is, van rechtswege gezamenlijk het gezag als bedoeld in [artikel 253sa][ref2] over het kind uitoefenen.

      6 Indien de moeder na de geboorte van het kind op grond van [artikel 199, onderdeel b][ref3], het vaderschap van
      de overleden echtgenoot of geregistreerde partner ontkent of op grond van [artikel 198, tweede lid][ref4], het
      moederschap van de overleden echtgenote of geregistreerde parnter ontkent en zij ten tijde van de geboorte en van
      de ontkenning is hertrouwd of een nieuw partnerschap heeft laten registreren, kunnen de moeder en haar echtgenoot
      of geregistreerde partner gezamenlijk ter gelegenheid van de ontkenning verklaren welke geslachtsnaam het kind
      zal hebben. Dat kan de geslachtsnaam zijn van de moeder of de echtgenoot of echtgenote of geregistreerde partner,
      of van beiden in een vrij te bepalen volgorde. Van deze verklaring wordt een akte van naamskeuze opgemaakt. Bij
      gebreke van een verklaring heeft het kind de geslachtsnaam van de echtgenoot of geregistreerde partner.

      7 Indien een kind op het tijdstip van het ontstaan van de familierechtelijke betrekking met beide ouders zestien
      jaar of ouder is, verklaart het zelf ten overstaan van de ambtenaar van de burgerlijke stand of van de notaris
      of, in geval van adoptie of gerechtelijke vaststelling van het vaderschap, ten overstaan van de rechter of het de
      geslachtsnaam van de ene of de andere ouder zal hebben of van beide ouders in een vrij te bepalen volgorde of bij
      adoptie, een geslachtsnaam die is gekozen overeenkomstig het derde lid. Van deze verklaring wordt melding gemaakt
      in de akte van erkenning of in de rechterlijke uitspraak inzake adoptie of gerechtelijke vaststelling van het
      vaderschap.

      8 Een verklaring van de ouders als bedoeld in het tweede, vierde of zesde lid, kan slechts ten aanzien van de
      geslachtsnaam van hun eerste kind worden afgelegd. De eerste volzin is van overeenkomstige toepassing ten aanzien
      van het eerste kind over wie de ouder en zijn echtgenoot of geregistreerde partner die niet de ouder is, van
      rechtswege gezamenlijk het gezag als bedoeld in [artikel 253sa][ref5] zullen uitoefenen of uitoefenen. Onverminderd
      het zevende lid, hebben volgende kinderen van dezelfde ouders dan wel kinderen over wie dezelfde ouder en dezelfde
      echtgenoot of geregistreerde partner die niet de ouder is, van rechtswege het gezag gezamenlijk zullen uitoefenen,
      dezelfde geslachtsnaam als het eerste kind, met dien verstande dat in het geval dat volgende kinderen blijkens de
      geboorteakte of krachtens toepasselijk recht een naam hebben die afwijkt van de naam van het eerste kind, de ouders
      kunnen verklaren dat het desbetreffende kind dezelfde geslachtsnaam zal hebben als het eerste kind. Indien een kind
      door adoptie in familierechtelijke betrekking komt te staan tot zijn adoptanten kan in afwijking van het voorgaande
      steeds worden gekozen voor de oorspronkelijke geslachtsnaam van het kind of een combinatie van de oorspronkelijke
      geslachtsnaam met de geslachtsnaam van een der adoptanten, waarbij alle kinderen van die adoptanten met een
      combinatie van geslachtsnamen tenminste een zelfde geslachtsnaam van de adoptant hebben en alle kinderen die niet
      door adoptie in familierechtelijke betrekking tot de ouders komen te staan dezelfde geslachtsnaam of gecombineerde
      geslachtsnaam hebben. De gekozen oorspronkelijke geslachtsnaam van het kind werkt niet door voor volgende kinderen
      van die adoptanten. Indien voor de geboorte of ter gelegenheid van de aangifte naamskeuze is gedaan ten aanzien
      van een kind dat levenloos ter wereld komt of is gekomen, wordt deze keuze opgenomen in de akte, bedoeld in
      [artikel 19i, eerste lid][ref6], en geldt zij alleen ten aanzien van dit kind.

      9 Is één van de ouders voorafgaand aan het tijdstip waarop de naamskeuze uiterlijk moet zijn gedaan overleden en is
      de naamskeuze niet gedaan, dan legt de andere ouder een verklaring omtrent de naamskeuze af. Hetzelfde geldt indien
      één van de ouders wegens diens lichamelijke of geestelijke toestand onder curatele staat dan wel indien ten aanzien
      van hem of haar een mentorschap bestaat.

      10 Zijn de vader en moeder onbekend, dan neemt de ambtenaar van de burgerlijke stand in de geboorteakte een
      voorlopige voornaam en geslachtsnaam op, in afwachting van het koninklijk besluit waarbij de voornamen en de
      geslachtsnaam van het kind worden vastgesteld.

      11 Indien op grond van het tweede tot en met negende lid een kind, wiens vader van adel is, niet zijn geslachtsnaam
      verkrijgt, gaat de adeldom niet over op dat kind.

      12 De geslachtsnaam van kinderen geboren uit een huwelijk met een lid van het koninklijk huis wordt bij koninklijk
      besluit bepaald.

      13 In het tweede, vijfde en zesde lid wordt onder «moeder» verstaan de vrouw uit wie het kind is geboren. In deze
      leden wordt met «de vader» van het kind en zijn «vaderschap» gelijkgesteld de moeder die niet de vrouw is uit wie
      het kind is geboren onderscheidenlijk haar moederschap.

      14 Wordt voor het kind gekozen voor een combinatie van geslachtsnamen van de ouders, en een ouder heeft een
      geslachtsnaam die een combinatie is van twee geslachtsnamen van ouders, dan kan maximaal één geslachtsnaam uit
      de combinatie worden doorgegeven. Dat geldt ook als op grond van het derde lid bij adoptie wordt gekozen voor een
      geslachtsnaam van één van de ouders in combinatie met de oorspronkelijke geslachtsnaam van het kind, of als die uit
      een combinatie van twee geslachtsnamen bestaat, één geslachtsnaam uit de combinatie.


