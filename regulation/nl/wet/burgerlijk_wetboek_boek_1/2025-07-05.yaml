  - number: 253x
    text: |-
      1 Na de dood van de ouder die tezamen met de ander het gezag uitoefende, oefent die ander van rechtswege de voogdij
      over de kinderen uit.

      2 De rechtbank kan op verzoek van de overlevende ouder te allen tijde bepalen dat deze, mits daartoe bevoegd,
      alsnog met het gezag wordt belast.

      3 De [artikelen 253][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253g
