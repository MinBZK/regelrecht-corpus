  - number: '248'
    text: |-
      Het [tweede lid van artikel 247 van dit boek][ref1] is van overeenkomstige toepassing op de voogd en op degene die
      een minderjarige verzorgt en opvoedt zonder dat hem het gezag over die minderjarige toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel248
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '247'
        afdeling: '1'
  - number: '249'
    text: |-
      De minderjarige dient rekening te houden met de aan de ouder of voogd in het kader van de uitoefening van het gezag
      toekomende bevoegdheden, alsmede met de belangen van de overige leden van het gezin waarvan hij deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel249
  - number: '250'
    text: |-
      1 Wanneer in aangelegenheden betreffende diens verzorging en opvoeding, dan wel het vermogen van de minderjarige,
      de belangen van de met het gezag belaste ouders of een van hen dan wel van de voogd of de beide voogden in strijd
      zijn met die van de minderjarige, benoemt de rechtbank, danwel, indien het een aangelegenheid inzake het vermogen
      van de minderjarige betreft, de kantonrechter, of, indien de zaak reeds aanhangig is, de desbetreffende rechter,
      indien hij dit in het belang van de minderjarige noodzakelijk acht, daarbij in het bijzonder de aard van deze
      belangenstrijd in aanmerking genomen, op verzoek van een belanghebbende of ambtshalve een bijzondere curator om de
      minderjarige ter zake, zowel in als buiten rechte, te vertegenwoordigen.

      2 In geval van een verzoek van de raad voor de kinderbescherming als bedoeld in [artikel 242a][ref1] benoemt de
      kinderrechter bij de aanvang van het geding een bijzondere curator om de minderjarige, zowel in als buiten rechte,
      te vertegenwoordigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel242a
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel250
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 242a
        afdeling: '3'
  - number: '251'
    text: |-
      1 Gedurende hun huwelijk oefenen de ouders het gezag gezamenlijk uit.

      2 Na ontbinding van het huwelijk anders dan door de dood of na scheiding van tafel en bed blijven de ouders die
      gezamenlijk het gezag hebben, dit gezag gezamenlijk uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel251
  - number: 251a
    text: |-
      1 De rechter kan na ontbinding van het huwelijk anders dan door de dood of na scheiding van tafel en bed op verzoek
      van de ouders of van één van hen bepalen dat het gezag over een kind aan één ouder toekomt indien:

      a. er een onaanvaardbaar risico is dat het kind klem of verloren zou raken tussen de ouders en niet te verwachten
      is dat hierin binnen afzienbare tijd voldoende verbetering zou komen, of

      b. wijziging van het gezag anderszins in het belang van het kind noodzakelijk is.

      2 De beslissing op grond van het eerste lid wordt gegeven bij de beschikking houdende scheiding van tafel en bed,
      echtscheiding dan wel ontbinding van het huwelijk na scheiding van tafel en bed of bij latere beschikking.

      3 Indien een beslissing op grond van het eerste lid niet alle kinderen der echtgenoten betrof, vult de rechtbank
      haar aan op verzoek van een van de ouders, van de raad voor de kinderbescherming of ambtshalve.

      4 De rechter kan, indien hem blijkt dat de minderjarige van twaalf jaar of ouder hierop prijs stelt, ambtshalve een
      beslissing geven op de voet van het eerste lid. Hetzelfde geldt indien de minderjarige de leeftijd van twaalf jaren
      nog niet heeft bereikt, maar in staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel251a
  - number: 251b
    text: |-
      1 De moeder en de persoon die een kind heeft erkend oefenen het gezag over hun kind gezamenlijk uit, tenzij:

      a. een voogd met de voogdij over het kind is belast;

      b. de voorziening in het gezag over het kind is komen te ontbreken;

      c. de ouder die het gezag heeft, dit gezamenlijk met een ander dan een ouder uitoefent; of

      d. de erkenner eerder het gezag over het kind heeft uitgeoefend.

      2 De moeder oefent het gezag over haar kind alleen uit, indien uit de akte, bedoeld in
      [artikel 203, eerste lid, onderdeel a of b][ref1], blijkt dat:

      a. de moeder en de erkenner hebben verklaard dat het gezag alleen door de moeder wordt uitgeoefend; of

      b. de rechtbank vervangende toestemming voor de erkenning heeft verleend als bedoeld in
      [artikel 204, derde en vierde lid][ref2].

      De ambtenaar van de burgerlijke stand doet onverwijld na de erkenning of, in geval van een erkenning voor de
      geboorte van het kind, na de aangifte van de geboorte, mededeling aan de griffier van de verklaring, bedoeld
      onder a, of de erkenning met vervangende toestemming, bedoeld onder b, ter aantekening in het register, bedoeld
      in [artikel 244][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel203
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel204
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel244
