  - number: 253ha
    text: |-
      1 De minderjarige vrouw die als degene die het gezag heeft, haar kind wenst te verzorgen en op te voeden kan,
      indien zij de leeftijd van zestien jaren heeft bereikt, de kinderrechter verzoeken haar meerderjarig te verklaren.

      2 Het verzoek kan ten behoeve van de vrouw ook worden gedaan door de raad voor de kinderbescherming. Deze behoeft
      hiertoe haar schriftelijke toestemming. Het verzoek vervalt, indien de vrouw haar toestemming intrekt.

      3 Het verzoek kan ook voor de bevalling door of ten behoeve van de vrouw worden gedaan, alsmede indien de vrouw
      eerst omstreeks het tijdstip van haar bevalling de leeftijd van zestien jaren zal hebben bereikt. In dat geval
      wordt op het verzoek niet eerder dan na de bevalling of, indien de vrouw op dat tijdstip nog geen zestien jaar is,
      nadat zij die leeftijd heeft bereikt, beslist.

      4 De kinderrechter willigt het verzoek slechts in, indien hij dit in het belang van de moeder en haar kind
      wenselijk oordeelt. Indien een ander met het gezag is belast, wordt de moeder daarmee belast.

      5 De minderjarige vrouw is bekwaam in rechte op te treden en tegen een uitspraak beroep in te stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253ha
  - number: 253i
    text: |-
      1 Ingeval van gezamenlijke gezagsuitoefening voeren de ouders gezamenlijk het bewind over het vermogen van het kind
      en vertegenwoordigen zij gezamenlijk het kind in burgerlijke handelingen, met dien verstande dat een ouder alleen,
      mits niet van bezwaren van de andere ouder is gebleken, hiertoe ook bevoegd is.

      2 [Artikel 253][ref1] is van overeenkomstige toepassing met dien verstande dat in plaats van "de rechtbank" wordt
      gelezen "de kantonrechter".

      3 Oefent een ouder het gezag alleen uit, dan wordt door die ouder het bewind over het vermogen van het kind gevoerd
      en het kind in burgerlijke handelingen vertegenwoordigd.

      4 Van het bepaalde in het eerste en derde lid kan worden afgeweken:

      a. indien de rechter bij de beschikking waarbij de uitoefening van het gezag over het kind aan een van de ouders
      wordt opgedragen op eensluidend verzoek van de ouders of op verzoek van één van hen, mits de ander zich daartegen
      niet verzet, heeft bepaald dat de ouder die niet het gezag over het kind zal uitoefenen, het bewind over het
      vermogen van het kind zal voeren;

      b. ingevolge [artikel 276, tweede lid, van dit boek][ref2], bij beëindiging van het gezag;

      c. indien hij die een minderjarige goederen schenkt of vermaakt, bij de gift, onderscheidenlijk bij de uiterste
      wilsbeschikking, heeft bepaald dat een ander het bewind over die goederen zal voeren.

      5 In het laatstbedoelde geval zijn de ouders, of - indien een ouder het gezag alleen uitoefent - die ouder, bevoegd
      van de bewindvoerder rekening en verantwoording te vragen.

      6 Bij het vervallen van het door de schenker of erflater ingesteld bewind zijn het eerste en tweede lid,
      onderscheidenlijk het derde lid, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel276
