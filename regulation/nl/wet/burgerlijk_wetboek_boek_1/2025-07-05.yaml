  - number: 265k
    text: |-
      1 Verzoeken op grond van deze afdeling worden schriftelijk gedaan. Voor zover zij aan de kinderrechter
      zijn gericht, kunnen zij worden ingediend zonder advocaat met uitzondering van het verzoek bedoeld in
      [artikel 262b][ref1].

      2 De gecertificeerde instelling die een verzoek indient of ter terechtzitting wordt opgeroepen, zendt bij het
      verzoekschrift of onverwijld na de oproep, het plan, bedoeld in [artikel 4.1.3, eerste lid, van de Jeugdwet][ref2],
      en een verslag van het verloop van de ondertoezichtstelling aan de kinderrechter.

      3 Het plan en het verslag, bedoeld in het tweede lid, worden eveneens gezonden aan de raad voor de
      kinderbescherming.

      4 De verzoeken die de gecertificeerde instelling ter uitvoering van haar taak tot de rechter richt, kunnen worden
      ingediend zonder advocaat en worden kosteloos behandeld; de grossen, afschriften en uittreksels, die zij tot dat
      doel aanvraagt, worden haar door de griffiers vrij van alle kosten uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel262b
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4.1.3
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel265k
