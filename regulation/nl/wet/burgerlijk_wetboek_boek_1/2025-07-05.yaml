        artikel: '2'
  - number: '328'
    text: |-
      De rechtbank kan de voogdij van een gecertificeerde instelling als bedoeld in [artikel 1.1 van de Jeugdwet][ref1]
      of van een rechtspersoon als bedoeld in [artikel 302, tweede lid][ref2], beëindigen indien een minderjarige zodanig
      opgroeit dat hij in zijn ontwikkeling ernstig wordt bedreigd, en:

      a. zij haar taken op een niet verantwoorde wijze uitoefent als bedoeld in
      [artikel 4.1.1, tweede lid, van de Jeugdwet][ref3], of

      b. zij nalaat overeenkomstig [artikel 305][ref4] de raad voor de kinderbescherming op de hoogte te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel4.1.1
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel305
