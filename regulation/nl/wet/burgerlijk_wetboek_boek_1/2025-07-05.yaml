  - number: 265e
    text: |-
      1 De kinderrechter kan bij de verlening van de machtiging tot uithuisplaatsing en ook nadat deze machtiging is
      verleend, op verzoek bepalen dat het gezag gedeeltelijk wordt uitgeoefend door de gecertificeerde instelling die
      het toezicht uitoefent, voor zover dit noodzakelijk is in verband met de uitvoering van de ondertoezichtstelling.
      Hij kan dit doen met betrekking tot:

      a. de aanmelding van de minderjarige bij een onderwijsinstelling,

      b. het geven van toestemming voor een medische behandeling van de minderjarige jonger dan twaalf jaar of van de
      minderjarige van twaalf jaar of ouder die niet in staat kan worden geacht tot een redelijke waardering van zijn
      belangen ter zake, of

      c. het doen van een aanvraag tot het verlenen van een verblijfsvergunning ten behoeve van de minderjarige als
      bedoeld in de [artikelen 14][ref1] of [28 van de Vreemdelingenwet 2000][ref2].

      2 De duur van de gedeeltelijke uitoefening van het gezag is niet langer dan die van de verleende machtiging tot
      uithuisplaatsing.

      3 De kinderrechter kan de duur van de gedeeltelijke uitoefening van het gezag telkens met ten hoogste een jaar
      verlengen.

      4 Op verzoek kan een beslissing als bedoeld in het eerste of derde lid wegens gewijzigde omstandigheden worden
      gewijzigd.

      5 De verzoeken, bedoeld in het eerste, derde en vierde lid, kunnen worden gedaan door de gecertificeerde instelling
      die het toezicht uitoefent. Indien deze gecertificeerde instelling niet tot een verzoek overgaat, zijn de raad voor
      de kinderbescherming of degene die niet de ouder is en de minderjarige als behorende tot zijn gezin verzorgt en
      opvoedt bevoegd tot het doen van het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
