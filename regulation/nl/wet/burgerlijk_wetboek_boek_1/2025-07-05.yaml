  - number: '81'
    text: |-
      Echtgenoten zijn elkander getrouwheid, hulp en bijstand verschuldigd. Zij zijn verplicht elkander het nodige te
      verschaffen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel81
  - number: '82'
    text: |-
      Echtgenoten zijn jegens elkaar verplicht de tot het gezin behorende minderjarige kinderen te verzorgen en op te
      voeden en de kosten van die verzorging en opvoeding te dragen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel82
  - number: '83'
    text: |-
      Echtgenoten verschaffen elkaar desgevraagd inlichtingen over het door hen gevoerde bestuur alsmede over de stand
      van hun goederen en schulden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel83
  - number: '84'
    text: |-
      1 De kosten der huishouding, daaronder begrepen de kosten van verzorging en opvoeding van de kinderen, komen
      ten laste van het gemene inkomen van de echtgenoten en, voor zover dit ontoereikend is, ten laste van hun eigen
      inkomens in evenredigheid daarvan; voor zover de inkomens ontoereikend zijn, komen deze kosten ten laste van
      het gemene vermogen en, voor zover ook dit ontoereikend is, ten laste van de eigen vermogens naar evenredigheid
      daarvan. Een en ander geldt niet voor zover bijzondere omstandigheden zich er tegen verzetten.

      2 De echtgenoten zijn jegens elkaar verplicht dienovereenkomstig tot de bestrijding van de in het eerste lid
      bedoelde uitgaven voldoende gelden ter beschikking te stellen uit de onder hun bestuur staande goederen, voor zover
      bijzondere omstandigheden zich daartegen niet verzetten.

      3 Bij schriftelijke overeenkomst kan een van het eerste en tweede lid afwijkende regeling worden getroffen.

      4 Geschillen tussen de echtgenoten omtrent de toepassing van het eerste tot en met derde lid worden door de
      rechtbank op verzoek van beiden of een van hen beslist.

      5 Op verzoek van beide of van een van de echtgenoten kan de rechtbank een gegeven beschikking of een onderling
      getroffen regeling wijzigen op grond van veranderde omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel84
  - number: '85'
    text: |-
      De ene echtgenoot is naast de andere voor het geheel aansprakelijk voor de door deze ten behoeve van de gewone gang
      van de huishouding aangegane verbintenissen, met inbegrip van die welke voortvloeien uit de door hem als werkgever
      ten behoeve van de huishouding aangegane arbeidsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel85
  - number: '86'
    text: |-
      1 De rechtbank kan, wanneer daartoe gegronde redenen bestaan, op verzoek van een echtgenoot bepalen dat deze niet
      aansprakelijk zal zijn voor de door de andere echtgenoot in het vervolg aangegane verbintenissen als bedoeld in het
      vorige artikel.

      2 Een overeenkomstig dit artikel gegeven rechterlijke beschikking kan bij veranderde omstandigheden op gelijke
      wijze als zij is tot stand gekomen, worden gewijzigd of opgeheven.

      3 De beschikking kan aan derden die van haar bestaan onkundig waren, slechts worden tegengeworpen, indien zij
      ingeschreven was in het huwelijksgoederenregister, aangewezen in [artikel 116 van dit boek][ref1], en na de
      inschrijving veertien dagen waren verlopen.

      4 In de beschikking kan worden bepaald dat zij bovendien moet worden bekend gemaakt in een of meer door de rechter
      aangewezen dagbladen. In dat geval werkt de beschikking ten nadele van derden die daarvan onkundig waren, ook niet
      vóór deze bekendmaking.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '87'
    text: |-
      1 Indien een echtgenoot ten laste van het vermogen van de andere echtgenoot een goed dat tot zijn eigen vermogen
      zal behoren, verkrijgt of indien ten laste van het vermogen van de andere echtgenoot een schuld ter zake van een
      tot zijn eigen vermogen behorend goed wordt voldaan of afgelost, ontstaat voor de eerstgenoemde echtgenoot een
      plicht tot vergoeding.

      2 De vergoeding beloopt een gedeelte van de waarde van het goed op het tijdstip waarop de vergoeding wordt voldaan.
      Dit gedeelte:

      a. is in het geval van een verkrijging ten laste van het vermogen van de andere echtgenoot evenredig aan het uit
      diens vermogen afkomstige aandeel in de tegenprestatie voor het goed;

      b. komt in het geval van een voldoening of aflossing ten laste van het vermogen van de andere echtgenoot overeen
      met de verhouding tussen het uit diens vermogen voldane of afgeloste bedrag ten opzichte van de waarde van het goed
      op het tijdstip van die voldoening of aflossing.

      3 Ten aanzien van de vergoeding gelden voorts de volgende regels:

      a. tenzij de echtgenoot het vermogen van de andere echtgenoot met diens toestemming heeft aangewend op de wijze als
      bedoeld in het eerste lid, beloopt de vergoeding ten minste het nominale bedrag dat ten laste van het vermogen van
      de andere echtgenoot is gekomen;

      b. ter zake van goederen die naar hun aard bestemd zijn om te worden verbruikt, beloopt de vergoeding steeds het
      nominale bedrag dat ten laste van het vermogen van de andere echtgenoot is gekomen;

      c. ter zake van goederen die inmiddels zijn vervreemd zonder dat daarvoor andere goederen in de plaats zijn
      gekomen, wordt in plaats van de waarde, bedoeld in de aanhef van het tweede lid, uitgegaan van de waarde ten tijde
      van de vervreemding. Met een vervreemding wordt gelijkgesteld het onherroepelijk worden van een begunstiging bij
      een sommenverzekering of een andere begunstiging bij een beding ten behoeve van een derde.

      4 Echtgenoten kunnen bij overeenkomst afwijken van het eerste lid tot en met het derde lid. Geen vergoeding is
      verschuldigd voor zover door de verkrijging, voldoening of aflossing ten laste van het vermogen van de andere
      echtgenoot wordt voldaan aan een op die echtgenoot rustende verbintenis.

      5 Kan de vergoeding overeenkomstig het eerste tot en met het vierde lid niet nauwkeurig worden vastgesteld, dan
      wordt zij geschat.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel87
  - number: '88'
    text: |-
      1 Een echtgenoot behoeft de toestemming van de andere echtgenoot voor de volgende rechtshandelingen:

      a. overeenkomsten strekkende tot vervreemding, bezwaring of ingebruikgeving en rechtshandelingen strekkende tot
      beëindiging van het gebruik van een door de echtgenoten tezamen of door de andere echtgenoot alleen bewoonde woning
      of van zaken die bij een zodanige woning of tot de inboedel daarvan behoren;

      b. giften, met uitzondering van de gebruikelijke, niet bovenmatige;

      c. overeenkomsten die ertoe strekken dat hij, anders dan in de normale uitoefening van zijn beroep of bedrijf, zich
      als borg of hoofdelijk medeschuldenaar verbindt, zich voor een derde sterk maakt, of zich tot zekerheidstelling
      voor een schuld van de derde verbindt;

      d. overeenkomsten van goederenkrediet als bedoeld in [artikel 84 van Boek 7][ref1], behalve indien zij zaken
      betreffen die kennelijk uitsluitend of hoofdzakelijk ten behoeve van de normale uitoefening van zijn beroep of
      bedrijf strekken.

      2 De echtgenoot behoeft de toestemming niet, indien hij tot het verrichten der rechtshandeling is verplicht op
      grond van de wet of op grond van een voorafgaande rechtshandeling waarvoor die toestemming is verleend of niet
      was vereist.

      3 De toestemming moet schriftelijk of langs elektronische weg worden verleend, indien de wet voor het verrichten
      van de rechtshandeling een vorm voorschrijft.

      4 In afwijking van lid 1, onder b, is geen toestemming vereist voor giften welke de strekking hebben dat zij pas
      zullen worden uitgevoerd na het overlijden van degene die de gift doet, en niet reeds tijdens diens leven worden
      uitgevoerd. Bestaat de gift in de aanwijzing van een begunstigde bij een sommenverzekering die tijdens het leven
      van de verzekeringnemer is aanvaard of kan worden aanvaard, dan is daarvoor wel toestemming vereist.

      5 Toestemming voor een rechtshandeling als bedoeld in lid 1 onder *c*, is niet vereist, indien zij wordt verricht
      door een bestuurder van een naamloze vennootschap of van een besloten vennootschap met beperkte aansprakelijkheid,
      die daarvan alleen of met zijn medebestuurders de meerderheid der aandelen houdt en mits zij geschiedt ten behoeve
      van de normale uitoefening van het bedrijf van die vennootschap.

      6 Indien de andere echtgenoot door afwezigheid of een andere oorzaak in de onmogelijkheid verkeert zijn wil te
      verklaren of zijn toestemming niet verleent, kan de beslissing van de rechtbank worden ingeroepen.

      7 Dit artikel is van toepassing ongeacht het recht dat van toepassing is op het huwelijksvermogensstelsel van de
      echtgenoten, indien de andere echtgenoot zijn gewone verblijfplaats heeft in Nederland ten tijde van het verrichten
      van een rechtshandeling, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel84
