  - number: '228'
    text: |-
      1 Voorwaarden voor adoptie zijn:

      a. dat het kind op de dag van het eerste verzoek minderjarig is, en dat het kind, indien het op de dag van het
      verzoek twaalf jaren of ouder is, ter gelegenheid van zijn verhoor niet van bezwaren tegen toewijzing van het
      verzoek heeft doen blijken; hetzelfde geldt, indien de rechter is gebleken van bezwaren tegen toewijzing van het
      verzoek van een minderjarige die op de dag van het verzoek de leeftijd van twaalf jaren nog niet heeft bereikt,
      maar in staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake;

      b. dat het kind niet is een kleinkind van een adoptant;

      c. dat de adoptant of ieder der adoptanten ten minste achttien jaren ouder dan het kind is;

      d. dat geen der ouders het verzoek tegenspreekt;

      e. dat de minderjarige moeder van het kind op de dag van het verzoek de leeftijd van zestien jaren heeft bereikt;

      f. dat de adoptant of de adoptanten het kind gedurende ten minste een jaar heeft of hebben verzorgd en opgevoed;
      indien de echtgenoot, geregistreerde partner of andere levensgezel van de ouder of adoptiefouder het kind adopteert
      en zij gezamenlijk het kind gedurende ten minste een jaar hebben verzorgd en opgevoed wordt de periode van een
      jaar voor de echtgenoot, geregistreerde partner of andere levensgezel gerekend vanaf het moment van feitelijk
      gezamenlijk verzorgen en opvoeden;

      g. dat de ouder of ouders niet of niet langer het gezag over het kind hebben. Indien evenwel de echtgenoot,
      geregistreerde partner of andere levensgezel van de ouder het kind adopteert, geldt dat deze ouder alleen of samen
      met voornoemde echtgenoot, geregistreerde partner of andere levensgezel het gezag heeft.

      2 Aan de tegenspraak van een ouder als bedoeld in het eerste lid, onder d, kan worden voorbijgegaan:

      a. indien het kind en de ouder niet of nauwelijks in gezinsverband hebben samengeleefd; of

      b. indien de ouder het gezag over het kind heeft misbruikt of de verzorging en opvoeding van het kind op grove
      wijze heeft verwaarloosd; of

      c. indien de ouder onherroepelijk is veroordeeld wegens het plegen tegen de minderjarige
      van een van de misdrijven, omschreven in de [titels XIII tot en met XV][ref1] en
      [XVIII tot en met XX van het tweede boek van het Wetboek van Strafrecht][ref2].

      3 De voorwaarde, bedoeld in het eerste lid, onder f, geldt niet indien het kind wordt geboren binnen de relatie van
      de moeder met een levensgezel van gelijk geslacht.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854
