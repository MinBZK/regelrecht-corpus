  - number: '434'
    text: |-
      1 In beschikkingen als bedoeld in de [artikelen 432][ref1] en [433, tweede lid, van dit boek][ref2] bepaalt de
      rechter ambtshalve welke goederen onder bewind worden gesteld, onderscheidenlijk uit het bewind worden ontslagen.

      2 Onderbewindstelling van een goed en het ontslag van een goed uit het bewind treden in werking daags nadat de
      beschikking is verstrekt of verzonden, tenzij de beschikking een later tijdstip van ingang vermeldt. In het geval,
      bedoeld in [artikel 431, tweede lid][ref3], treedt de onderbewindstelling in werking op het tijdstip waarop de
      rechthebbende meerderjarig wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel432
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel433
