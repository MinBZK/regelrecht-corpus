        bwb_id: BWBR0002221
        artikel: 7a
  - number: '323'
    text: |-
      Op verzoek van de voogden gezamenlijk of van een van hen beëindigt de rechter de gezamenlijke uitoefening van de
      voogdij. Alsdan bepaalt de rechter aan wie van beide voortaan het gezag over ieder der minderjarige kinderen alleen
      zal toekomen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel323
  - number: '324'
    text: |-
      1 Wanneer een voogd op een der in [artikel 246][ref1] van dit boek genoemde gronden onbevoegd is tot de voogdij,
      ontslaat de rechtbank hem en vervangt hem door een andere voogd.

      2 Zij doet dit op verzoek van de voogd, bloed- of aanverwanten van de minderjarige, de raad voor de
      kinderbescherming, schuldeisers of andere belanghebbenden, of ambtshalve.

      3 Indien in geval van gezamenlijke uitoefening van de voogdij een van de in het eerste lid genoemde gronden zich
      voordoet ten aanzien van een van beide voogden, oefent de andere voogd het gezag over de kinderen alleen uit.

      4 Zodra de grond van de onbevoegdheid is vervallen, herleeft de gezamenlijke voogdij.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel324
    references:
