  - number: 19f
    text: |-
      1 Een akte van overlijden wordt opgemaakt door de ambtenaar van de burgerlijke stand van de gemeente waar het
      overlijden heeft plaatsgevonden.

      2 Indien een lijk is gevonden en de plaats of de dag van overlijden niet met voldoende nauwkeurigheid kan worden
      vastgesteld, wordt de akte van overlijden opgemaakt door de ambtenaar van de burgerlijke stand van de gemeente
      waarin het lijk is gevonden of aan land gebracht.

      3 Ongeacht het in het eerste lid bepaalde is het tweede lid van overeenkomstige toepassing indien het overlijden
      heeft plaatsgevonden op een op zee gestationeerde installatie en het lijk in Nederland aan land wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel19f
  - number: 19g
    text: |-
      1 In geval van overlijden op Nederlands grondgebied in een rijdend voertuig of op een varend schip of tijdens
      een binnenlandse luchtreis met een luchtvaartuig, wordt de akte van overlijden opgemaakt door de ambtenaar van de
      burgerlijke stand van de gemeente waar het lijk het voertuig, het schip of het luchtvaartuig verlaat, dan wel waar
      het schip ligplaats kiest. Die gemeente geldt als gemeente waar het overlijden heeft plaatsgevonden.

      2 In geval van overlijden tijdens een zeereis met een in Nederland geregistreerd voertuig, dan wel tijdens een
      internationale luchtreis met een in Nederland geregistreerd luchtvaartuig, is de gezagvoerder van het vaartuig
      of het luchtvaartuig verplicht een voorlopige akte van overlijden binnen vierentwintig uur in het journaal in
      te schrijven in tegenwoordigheid van twee getuigen. De gezagvoerder zendt een afschrift van die akte zo spoedig
      mogelijk naar de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage. Deze maakt de akte van
      overlijden op aan de hand van het ontvangen afschrift, met dien verstande dat hij gegevens die ontbreken of hem
      blijken onjuist te zijn, zoveel mogelijk aanvult of verbetert. Aan de personen op wie de akte betrekking heeft,
      wordt een uittreksel van de akte toegezonden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel19g
  - number: 19h
    text: |-
      1 Tot de aangifte van een overlijden is bevoegd wie daarvan uit eigen wetenschap kennis draagt.

      2 Binnen de in [artikel 16 van de Wet op de lijkbezorging][ref1] gestelde termijn voor de begraving of crematie,
      kan de persoon die in de lijkbezorging voorziet, door een in het eerste lid bedoelde persoon worden gemachtigd tot
      het doen van de aangifte. In dit geval kan de aangifte door de gemachtigde ook elektronisch worden gedaan, als deze
      weg is geopend.

      3 De identiteit van de aangever wordt vastgesteld aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2], dan wel op bij algemene maatregel van bestuur te bepalen
      andere wijze.

      4 De aangever verstrekt ten minste de volgende gegevens van de overledene:

      a. geslachtsnaam, voornamen en geslacht van de overledene;

      b. voor zover bekend, plaats en dag van geboorte;

      c. plaats, dag en, zo mogelijk, het tijdstip van overlijden en

      d. diens burgerlijke staat en

      e. diens laatst bekende woonadres of woonplaats.

      5 Wanneer tot de aangifte bevoegde personen ontbreken of nalaten binnen de in de [Wet op de lijkbezorging][ref3]
      gestelde termijn voor de begraving of crematie de aangifte te doen, geschiedt deze door of vanwege de burgemeester
      van de gemeente alwaar de akte van overlijden moet worden opgemaakt.

      6 In de gevallen bedoeld in [artikel 19][ref4], geschiedt de aangifte door de hulpofficier van justitie.


