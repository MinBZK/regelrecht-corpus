  - number: '257'
    text: |-
      1 De kinderrechter kan de minderjarige voorlopig onder toezicht stellen van een gecertificeerde instelling indien
      een ernstig vermoeden bestaat dat de grond, bedoeld in [artikel 255, eerste lid][ref1], is vervuld en de maatregel
      noodzakelijk is om een acute en ernstige bedreiging voor de minderjarige weg te nemen.

      2 Het tweede lid van [artikel 255][ref2] is van overeenkomstige toepassing. De kinderrechter bepaalt de duur van
      dit toezicht op ten hoogste drie maanden en kan de beslissing te allen tijde herroepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel255
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel255
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel257
