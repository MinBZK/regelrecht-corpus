  - number: '450'
    text: |-
      1 Indien een meerderjarige als gevolg van zijn geestelijke of lichamelijke toestand tijdelijk of duurzaam niet in
      staat is of bemoeilijkt wordt zijn belangen van niet-vermogensrechtelijke aard zelf behoorlijk waar te nemen, kan
      de kantonrechter te zijnen behoeve een mentorschap instellen.

      2 Indien te verwachten is dat een minderjarige op het tijdstip waarop hij meerderjarig zal worden, in de in het
      eerste lid bedoelde toestand zal verkeren, kan het mentorschap reeds voor de meerderjarigheid worden ingesteld.

      3 Het mentorschap kan eveneens worden ingesteld, indien te verwachten is dat een meerderjarige binnen afzienbare
      tijd in de in het eerste lid bedoelde toestand zal verkeren.

      4 De rechter bij wie een verzoek tot het verlenen van een rechterlijke machtiging als bedoeld in
      de [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref1] dan wel
      een zorgmachtiging of een machtiging tot voorzetting van de crisismaatregel als bedoeld in de
      [Wet verplichte geestelijke gezondheidszorg][ref2] aanhangig is, is tevens bevoegd tot kennisneming van een verzoek
      tot instelling van een mentorschap.


      [ref1]: https://wetten.overheid.nl/BWBR0040632
      [ref2]: https://wetten.overheid.nl/BWBR0040635
