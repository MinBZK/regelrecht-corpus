  - number: '94'
    text: |-
      1 Van het ogenblik van de voltrekking van het huwelijk bestaat tussen de echtgenoten van rechtswege een gemeenschap
      van goederen.

      2 De gemeenschap omvat, wat haar baten betreft, alle goederen die reeds vóór de aanvang van de gemeenschap aan de
      echtgenoten gezamenlijk toebehoorden, en alle overige goederen van de echtgenoten, door ieder van hen afzonderlijk
      of door hen tezamen vanaf de aanvang van de gemeenschap tot haar ontbinding verkregen, met uitzondering van:

      a. krachtens erfopvolging bij versterf, making, lastbevoordeling of gift verkregen goederen;

      b. pensioenrechten waarop de Wet verevening pensioenrechten bij scheiding van toepassing is, alsmede met die
      pensioenrechten verband houdende rechten op nabestaandenpensioen;

      c. rechten op het vestigen van vruchtgebruik als bedoeld in de [artikelen 29][ref1] en [30 van Boek 4][ref2],
      vruchtgebruik dat op grond van die bepalingen is gevestigd, alsmede hetgeen wordt verkregen
      ingevolge de [artikelen 34][ref3], [35][ref4], [36][ref5], [38][ref6], [63 tot en met 92][ref7] en
      [126, eerste lid en tweede lid, onderdelen a en c, van Boek 4][ref8].

      3 Het tweede lid, aanhef en onderdeel a, is niet van toepassing op:

      a. giften van tot de gemeenschap behorende goederen aan de andere echtgenoot;

      b. goederen, alsmede de vruchten van die goederen, ten aanzien waarvan bij uiterste wilsbeschikking of bij de gift
      is bepaald dat zij in de gemeenschap vallen.

      4 Goederen, alsmede de vruchten van die goederen, ten aanzien waarvan bij uiterste wilsbeschikking of bij de
      gift is bepaald dat zij buiten de gemeenschap vallen, blijven buiten de gemeenschap, ook al zijn echtgenoten bij
      huwelijkse voorwaarden overeengekomen dat krachtens erfopvolging bij versterf, making, lastbevoordeling of gift
      verkregen goederen dan wel de vruchten daarvan in de gemeenschap vallen.

      5 Goederen en schulden die aan een van de echtgenoten op enigerlei bijzondere wijze verknocht zijn, vallen slechts
      in de gemeenschap voor zover die verknochtheid zich hiertegen niet verzet.

      6 Vruchten van goederen die niet in de gemeenschap vallen, vallen evenmin in de gemeenschap. Buiten de gemeenschap
      valt hetgeen wordt geïnd op een vordering die buiten de gemeenschap valt, alsmede een vordering tot vergoeding
      die in de plaats van een eigen goed van een echtgenoot treedt, waaronder begrepen een vordering ter zake van
      waardevermindering van zulk een goed.

      7 De gemeenschap omvat, wat haar lasten betreft, alle vóór het bestaan van de gemeenschap ontstane
      gemeenschappelijke schulden, alle schulden betreffende goederen die reeds vóór de aanvang van de gemeenschap aan
      de echtgenoten gezamenlijk toebehoorden, en alle tijdens het bestaan van de gemeenschap ontstane schulden van ieder
      van de echtgenoten, met uitzondering van schulden:

      a. betreffende van de gemeenschap uitgezonderde goederen;

      b. die behoren tot een nalatenschap waartoe een echtgenoot is gerechtigd;

      c. uit door een van de echtgenoten gedane giften, gemaakte bedingen en aangegane omzettingen als bedoeld in
      [artikel 126, eerste lid en tweede lid, onderdelen a en c, van Boek 4][ref9].

      8 Bestaat tussen echtgenoten een geschil aan wie van hen beiden een goed toebehoort en kan geen van beiden zijn
      recht op dit goed bewijzen, dan wordt dit goed als gemeenschapsgoed aangemerkt. Het vermoeden werkt niet ten nadele
      van de schuldeisers van de echtgenoten.


