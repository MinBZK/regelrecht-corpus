  - number: '203'
    text: |-
      1 Erkenning kan geschieden:

      a. bij een akte van erkenning, opgemaakt door een ambtenaar van de burgerlijke stand;

      b. bij notariële akte.

      2 De erkenning heeft gevolg vanaf het tijdstip waarop zij is gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel203
  - number: '204'
    text: |-
      1 De erkenning is nietig, indien zij is gedaan:

      a. door een persoon die krachtens [artikel 41][ref1] geen huwelijk met de moeder mag sluiten;

      b. door een minderjarige die de leeftijd van zestien jaren nog niet heeft bereikt;

      c. indien het kind de leeftijd van zestien jaar nog niet heeft bereikt, zonder voorafgaande schriftelijke
      toestemming van de moeder of de vader;

      d. zonder voorafgaande schriftelijke toestemming van het kind van twaalf jaren of ouder;

      e. terwijl er twee ouders zijn.

      2 De in het vorige lid onder c en d vereiste toestemming kan ook geschieden ter gelegenheid van het opmaken van de
      akte van erkenning.

      3 De toestemming van de moeder wier kind de leeftijd van zestien jaren nog niet heeft bereikt, dan wel de
      toestemming van het kind van twaalf jaren of ouder, kan op verzoek van de persoon die het kind wil erkennen,
      door de toestemming van de rechtbank worden vervangen, tenzij dit de belangen van de moeder bij een ongestoorde
      verhouding met het kind schaadt of een evenwichtige sociaalpsychologische en emotionele ontwikkeling van het kind
      in het gedrang komt, mits deze persoon:

      a. de verwekker van het kind is; of

      b. de biologische vader van het kind, die niet de verwekker is en in een nauwe persoonlijke betrekking staat tot
      het kind.

      4 De toestemming van de moeder wier kind de leeftijd van zestien jaren nog niet heeft bereikt, dan wel de
      toestemming van het kind van twaalf jaren of ouder, kan op verzoek van de persoon die als levensgezel van de moeder
      ingestemd heeft met een daad die de verwekking van het kind tot gevolg kan hebben gehad, door de toestemming van de
      rechtbank worden vervangen als dit in het belang is van het kind.

      5 Een persoon die wegens zijn lichamelijke of geestelijke toestand onder curatele staat, mag slechts erkennen of
      toestemming verlenen voor erkenning nadat daartoe toestemming is verkregen van de kantonrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel41
