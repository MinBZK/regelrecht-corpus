  - number: '263'
    text: |-
      1 De gecertificeerde instelling kan ter uitvoering van haar taak schriftelijke aanwijzingen geven betreffende
      de verzorging en opvoeding van de minderjarige. Zij kan dit doen indien de met het gezag belaste ouder of de
      minderjarige niet instemmen met, dan wel niet of onvoldoende medewerking verlenen aan de uitvoering van het plan,
      bedoeld in [artikel 4.1.3, eerste lid, van de Jeugdwet][ref1] of indien dit noodzakelijk is teneinde de concrete
      bedreigingen in de ontwikkeling van de minderjarige weg te nemen.

      2 De met het gezag belaste ouders of ouder en de minderjarige volgen een schriftelijke aanwijzing op.

      3 De gecertificeerde instelling kan de kinderrechter verzoeken een schriftelijke aanwijzing te bekrachtigen.
      Tegelijkertijd kan een door de wet toegelaten dwangmiddel worden verzocht bij niet nakoming van deze aanwijzing
      tenzij het belang van het kind zich tegen oplegging daarvan verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4.1.3
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel263
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 4.1.3
  - number: '264'
    text: |-
      1 Op verzoek van een met het gezag belaste ouder of de minderjarige van twaalf jaar of ouder kan de kinderrechter
      een schriftelijke aanwijzing geheel of gedeeltelijk vervallen verklaren. Het verzoek heeft geen schorsende kracht,
      tenzij de kinderrechter het tegendeel bepaalt.

      2 Bij de indiening van het verzoek wordt de beslissing van de gecertificeerde instelling overgelegd.

      3 De termijn voor het indienen van het verzoek bedraagt twee weken en vangt aan met ingang van de dag na die waarop
      de beslissing is verzonden of uitgereikt.

      4 Ten aanzien van een na afloop van deze termijn ingediend verzoek blijft niet-ontvankelijkverklaring achterwege
      indien de verzoeker redelijkerwijs niet geoordeeld kan worden in verzuim te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel264
  - number: '265'
    text: |-
      1 Op verzoek van degene aan wie de aanwijzing is gericht, kan de gecertificeerde instelling een schriftelijke
      aanwijzing wegens gewijzigde omstandigheden geheel of gedeeltelijk intrekken.

      2 De gecertificeerde instelling geeft haar beslissing schriftelijk en binnen twee weken na ontvangst van het
      verzoek.

      3 [Artikel 264][ref1] is van overeenkomstige toepassing.

      4 Het niet of niet tijdig nemen van een beslissing door de gecertificeerde instelling staat gelijk met afwijzing
      van het verzoek. De termijn voor het indienen van het verzoek aan de kinderrechter loopt in dat geval door zolang
      de gecertificeerde instelling niet heeft beslist en eindigt, indien de gecertificeerde instelling alsnog beslist,
      na verloop van twee weken te rekenen met ingang van de dag waarop de beslissing is verzonden of uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel264
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel265
