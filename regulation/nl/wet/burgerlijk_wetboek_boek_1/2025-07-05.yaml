  - number: '244'
    text: |-
      Bij de rechtbanken, dan wel op een andere bij algemene maatregel van bestuur aan te wijzen plaats of plaatsen,
      berusten openbare registers, waarin aantekening gehouden wordt van rechtsfeiten die op het over minderjarigen
      uitgeoefende gezag betrekking hebben.

      Bij algemene maatregel van bestuur wordt bepaald welke rechtsfeiten aangetekend worden, op welke wijze deze
      aantekening geschiedt en op welke wijze verstrekking van aangetekende gegevens plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel244
  - number: '245'
    text: |-
      1 Minderjarigen staan onder gezag.

      2 Onder gezag wordt verstaan ouderlijk gezag dan wel voogdij.

      3 Ouderlijk gezag wordt door de ouders gezamenlijk of door één ouder uitgeoefend. Voogdij wordt door een ander dan
      een ouder uitgeoefend.

      4 Het gezag heeft betrekking op de persoon van de minderjarige, het bewind over zijn vermogen en zijn
      vertegenwoordiging in burgerlijke handelingen, zowel in als buiten rechte.

      5 Het gezag van de ouder die dit krachtens [artikel 253sa][ref1] of krachtens een rechterlijke beslissing
      overeenkomstig [artikel 253t][ref2] samen met een ander dan een ouder uitoefent, wordt aangemerkt als ouderlijk
      gezag dat door ouders gezamenlijk wordt uitgeoefend, tenzij uit een wettelijke bepaling het tegendeel voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel245
    references:
