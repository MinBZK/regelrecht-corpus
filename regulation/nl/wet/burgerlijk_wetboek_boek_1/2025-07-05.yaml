  - number: '452'
    text: |-
      1 De rechter die het mentorschap instelt, benoemt daarbij of zo spoedig mogelijk daarna een mentor. Hij vergewist
      zich van de bereidheid en vormt zich een oordeel over de geschiktheid van de te benoemen persoon.

      2 Zo nodig kan een tijdelijke mentor worden benoemd.

      3 De rechter volgt bij de benoeming van de mentor de uitdrukkelijke voorkeur van de betrokkene, tenzij gegronde
      redenen zich tegen zodanige benoeming verzetten.

      4 Tenzij het vorige lid is toegepast, wordt, indien de betrokkene is gehuwd, een geregistreerd partnerschap is
      aangegaan of anderszins een levensgezel heeft, bij voorkeur de echtgenoot, de geregistreerde partner dan wel andere
      levensgezel tot mentor benoemd. Is de vorige zin niet van toepassing dan wordt bij voorkeur een van zijn ouders,
      kinderen, broers of zusters tot mentor benoemd. Huwt de betrokkene, gaat hij een geregistreerd partnerschap aan of
      verkrijgt hij een andere levensgezel, dan kan ieder van hen verzoeken, dat de echtgenoot, de geregistreerde partner
      dan wel de andere levensgezel van de betrokkene in de plaats van de tegenwoordige mentor wordt benoemd.

      5 Een rechtspersoon met volledige rechtsbevoegdheid komt voor benoeming tot mentor in aanmerking.

      6 De volgende personen kunnen niet tot mentor worden benoemd:

      a. handelingsonbekwamen;

      b. zij ten behoeve van wie een mentorschap is ingesteld;

      c. de direct betrokken of behandelend hulpverlener;

      d. personen behorende tot de leiding of tot het personeel van de instelling waar de betrokkene wordt verzorgd of
      die aan de betrokkene begeleiding biedt;

      e. personen verbonden met de instelling waar de betrokkene wordt verzorgd of die aan de betrokkene begeleiding
      biedt, doordat:

      1° de instelling of personen behorende tot de leiding van de instelling, alleen of samen meer dan de helft van de
      stemrechten in de algemene vergadering van de rechtspersoon kunnen uitoefenen, dan wel meer dan de helft van de
      bestuurders of van de commissarissen van de rechtspersoon kunnen benoemen of ontslaan,

      2° de persoon en de instelling deel uitmaken van een groep in de zin van [artikel 24b van boek 2][ref1], of

      3° de bestuurder van de rechtspersoon tevens behoort tot de leiding of het personeel van de instelling.

      7 Een andere persoon dan in het vierde lid bedoeld, die ten behoeve van drie of meer personen mentor, curator of
      bewindvoerder is, komt alleen dan voor benoeming in aanmerking indien deze wat zijn bedrijfsvoering en scholing
      betreft, alsmede, voor zover van toepassing, de werving, de scholing en begeleiding van en het toezicht op de
      personen door wie hij de taken van een mentor uitoefent, voldoet aan bij algemene maatregel van bestuur te stellen
      kwaliteitseisen, alsmede aan de verplichtingen bedoeld in [artikel 15i van boek 3][ref2].

      8 De persoon, bedoeld in het zevende lid, legt aan de rechter die hem benoemt, over:

      a. zijn verklaring dat hij aan de in het zevende lid bedoelde kwaliteitseisen en verplichtingen voldoet,

      b. een verslag van een accountant als bedoeld in [artikel 393, eerste lid, van boek 2][ref3], dan wel van een door
      de kantonrechter benoemde deskundige, van diens bevindingen over de wijze waarop aan de eisen wordt voldaan, en

      c. een verklaring van de accountant omtrent de balans en staat van baten en lasten, bedoeld in
      [artikel 10 van boek 2][ref4], dan wel, voor zover van toepassing, omtrent de jaarrekening overeenkomstig
      [titel 9 van boek 2][ref5]. [Artikel 396, zevende lid, van boek 2][ref6] is ten aanzien van
      [artikel 393 lid 1][ref7] niet van toepassing.

      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de vorm en de inhoud van de
      verklaringen en het verslag, de benoeming van de deskundige, alsmede de wijze van overlegging. Toont de persoon aan
      dat hij in de twaalf maanden voorafgaande aan zijn benoeming de verklaring en het verslag, bedoeld in het zevende
      lid, onderdelen a en b, reeds aan de rechter heeft overgelegd, dan is hij van de overlegging van de verklaring
      en het verslag vrijgesteld. Toont de persoon aan dat hij in de 24 maanden voorafgaande aan zijn benoeming de
      verklaring, bedoeld in het zevende lid, onderdeel c, reeds aan de rechter heeft overgelegd, dan is hij van de
      overlegging van deze verklaring vrijgesteld.

      9 De rechter kan twee mentoren benoemen, tenzij gegronde redenen zich tegen zodanige benoeming verzetten. Zijn
      er twee mentoren, dan kan ieder van hen de taken die aan een mentor toekomen, alleen verrichten. De rechter kan
      zo nodig een taakverdeling tussen de mentoren vaststellen. Bij verschil van mening tussen de mentoren beslist
      op verzoek van een van hen of op verzoek van een instelling als bedoeld in [artikel 451, tweede lid][ref8], de
      kantonrechter. Deze kan ook een verdeling van de beloning vaststellen.

      10 De taak van de mentor vangt aan daags nadat de beschikking, houdende de benoeming, is verstrekt of verzonden,
      tenzij de beschikking een later tijdstip vermeldt.


