  - number: 253s
    text: |-
      1 Indien het kind met instemming van zijn ouders die het gezag over hem uitoefenen, gedurende ten minste een
      jaar door een of meer anderen als behorende tot het gezin is verzorgd en opgevoed, kunnen de ouders slechts met
      toestemming van degenen die de verzorging en opvoeding op zich hebben genomen, wijziging in het verblijf van het
      kind brengen.

      2 Voor zover de volgens het vorige lid vereiste toestemmingen niet worden verkregen, kunnen zij op verzoek van de
      ouders door die van de rechtbank worden vervangen. Dit verzoek wordt slechts afgewezen indien de rechtbank dit in
      het belang van de minderjarige noodzakelijk oordeelt.

      3 In geval van afwijzing van het verzoek is de beschikking van kracht gedurende een door de rechtbank te bepalen
      termijn, welke de duur van zes maanden niet te boven mag gaan. Is echter voor het einde van deze termijn een
      verzoek tot ondertoezichtstelling van het kind, dan wel tot beëindiging van het gezag van een of beide ouders
      aanhangig gemaakt, dan blijft de beschikking gelden, totdat op het verzoek bij gewijsde is beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253s
  - number: 253sa
    text: |-
      1 Over het staande hun huwelijk of geregistreerd partnerschap geboren kind oefenen een ouder en zijn
      echtgenoot of geregistreerde partner die niet de ouder is, gezamenlijk het gezag uit, tenzij het kind tevens in
      familierechtelijke betrekking staat tot een andere ouder.

      2 De bepalingen met betrekking tot het gezamenlijk gezag van gehuwde en gehuwd geweest zijnde ouders
      zijn van overeenkomstige toepassing, voor wat betreft het in het vorige lid bedoeld geregistreerd
      partnerschap met uitzondering van het omtrent scheiding van tafel en bed en ontbinding van het huwelijk
      na scheiding van tafel en bed bepaalde. Na ontbinding van het geregistreerd partnerschap als bedoeld in
      [artikel 80c, eerste lid, onder d][ref1], blijven de ouder en zijn geregistreerde partner die niet de ouder is, dit
      gezag gezamenlijk uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253sa
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
  - number: 253t
    text: |-
      1 Indien het gezag over een kind bij één ouder berust, kan de rechtbank op gezamenlijk verzoek van de met het
      gezag belaste ouder en een ander dan de ouder die in een nauwe persoonlijke betrekking tot het kind staat, hen
      gezamenlijk met het gezag over het kind belasten.

      2 In het geval dat het kind tevens in familierechtelijke betrekking staat tot een andere ouder wordt het verzoek
      slechts toegewezen, indien:

      a. de ouder en de ander op de dag van het verzoek gedurende ten minste een aaneengesloten periode van een jaar
      onmiddellijk voorafgaande aan het verzoek gezamenlijk de zorg voor het kind hebben gehad; en

      b. de ouder die het verzoek doet op de dag van het verzoek gedurende ten minste een aaneengesloten periode van drie
      jaren alleen met het gezag belast is geweest.

      3 Het verzoek wordt afgewezen indien, mede in het licht van de belangen van een andere ouder, gegronde vrees
      bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.

      4 Het gezamenlijk gezag, bedoeld in het eerste lid, kan niet worden toegekend in de gevallen, bedoeld in
      [artikel 253q, eerste lid][ref1], en [artikel 253r][ref2]. Het staat niet open voor rechtspersonen.

      5 Een verzoek als bedoeld in het eerste lid kan vergezeld gaan van een verzoek tot wijziging van de geslachtsnaam
      van het kind in de geslachtsnaam van de met het gezag belaste ouder of de ander, of van een ouder en de ander in
      een vrij te bepalen volgorde. [Artikel 5, veertiende lid][ref3], is van overeenkomstige toepassing. Een zodanig
      verzoek wordt afgewezen, indien

      a. het kind van twaalf jaar of ouder ter gelegenheid van zijn verhoor niet heeft ingestemd met het verzoek;

      b. het verzoek, bedoeld in het eerste lid, wordt afgewezen; of

      c. het belang van het kind zich tegen toewijzing verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253r
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel5
