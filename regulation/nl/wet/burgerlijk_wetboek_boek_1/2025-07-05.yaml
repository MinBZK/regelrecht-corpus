  - number: '89'
    text: |-
      1 Een rechtshandeling die een echtgenoot in strijd met het vorige artikel heeft verricht, is vernietigbaar; slechts
      de andere echtgenoot kan een beroep op de vernietigingsgrond doen.

      2 Het vorige lid geldt niet voor een andere handeling dan een gift, indien de wederpartij te goeder trouw was.

      3 Het einde van het huwelijk en scheiding van tafel en bed hebben geen invloed op de bevoegdheid om ter
      vernietiging van een rechtshandeling van een echtgenoot een beroep op de vernietigingsgrond te doen, die voordien
      was ontstaan. Indien de andere echtgenoot dientengevolge schuldenaar uit die rechtshandeling wordt, geldt
      [artikel 51 lid 3 van Boek 3][ref1] voor hem slechts, zolang de termijn van [artikel 52 lid 1 van Boek 3][ref2]
      niet is verstreken.

      4 De verklaring of rechtsvordering tot vernietiging behoeft in afwijking van de [artikelen 50 lid 1][ref3] en
      [51 lid 2 van Boek 3][ref4] niet mede te worden gericht tot de echtgenoot die de handeling heeft verricht.

      5 De echtgenoot die een beroep op de vernietigingsgrond heeft gedaan, kan tevens alle uit de nietigheid
      voortvloeiende rechtsvorderingen instellen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel51
