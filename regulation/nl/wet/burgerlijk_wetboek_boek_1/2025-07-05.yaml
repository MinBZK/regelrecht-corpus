  - number: 28a
    text: |-
      1 Bij de aangifte wordt overgelegd een verklaring van een bij of krachtens algemene maatregel van bestuur
      aangewezen deskundige, afgegeven ten hoogste zes maanden voor de datum van de aangifte.

      2 De deskundigenverklaring vermeldt dat degene op wie de aangifte betrekking heeft jegens de deskundige heeft
      verklaard de overtuiging te hebben tot het andere geslacht te behoren dan is vermeld in zijn akte van geboorte en
      jegens de deskundige er blijk van heeft gegeven diens voorlichting omtrent de reikwijdte en de betekenis van deze
      staat te hebben begrepen en de wijziging van de vermelding van het geslacht in de akte van geboorte weloverwogen te
      blijven wensen. De deskundige geeft de verklaring niet af indien hij gegronde reden heeft om aan de gegrondheid van
      bedoelde overtuiging te twijfelen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel28a
  - number: 28b
    text: |-
      1 Indien aan [artikel 28a][ref1] is voldaan voegt de ambtenaar van de burgerlijke stand aan de akte van geboorte
      een latere vermelding toe van wijziging van het geslacht. [Artikel 27][ref2] is van overeenkomstige toepassing.

      2 In het in de eerste zin van het eerste lid bedoelde geval kan de ambtenaar van de burgerlijke stand desverzocht
      tevens overgaan tot wijziging van de voornamen van degene op wie de aangifte betrekking heeft.

      3 In het geval bedoeld in [artikel 28, eerste lid, tweede zin][ref3], schrijft de ambtenaar van de burgerlijke
      stand van de gemeente ’s-Gravenhage de akte van geboorte tevens in het register van geboorten van die gemeente in.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel28a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel28
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel28b
