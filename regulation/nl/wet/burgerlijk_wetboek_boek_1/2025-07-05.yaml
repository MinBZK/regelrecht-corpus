  - number: '173'
    text: |-
      1 De scheiding van tafel en bed komt tot stand door de inschrijving van de beschikking in het
      huwelijksgoederenregister, aangewezen in [artikel 116][ref1].

      2 De inschrijving geschiedt op verzoek van de echtgenoten of van één van hen.

      3 Indien het verzoek niet is gedaan uiterlijk zes maanden na de dag waarop de beschikking in kracht van gewijsde is
      gegaan, verliest de beschikking haar kracht.


