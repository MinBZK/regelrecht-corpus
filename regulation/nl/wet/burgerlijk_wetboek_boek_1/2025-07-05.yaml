  - number: '99'
    text: |-
      1 De gemeenschap wordt van rechtswege ontbonden:

      a. in geval van het eindigen van het huwelijk of het geregistreerd partnerschap door overlijden: op het tijdstip
      van overlijden;

      b. in geval van beëindiging van het huwelijk door echtscheiding of ontbinding van het geregistreerd partnerschap
      door de rechter: op het tijdstip van indiening van het verzoek tot echtscheiding onderscheidenlijk indiening van
      het verzoek tot ontbinding van het geregistreerd partnerschap;

      c. in geval van scheiding van tafel en bed: op het tijdstip van indiening van het verzoek tot scheiding van tafel
      en bed;

      d. in geval van opheffing van de gemeenschap door een beschikking: op het tijdstip van indiening van het verzoek
      tot opheffing van de gemeenschap;

      e. in geval van beëindiging van het geregistreerd partnerschap met wederzijds goedvinden: op het tijdstip waarop de
      overeenkomst tot beëindiging wordt gesloten;

      f. in geval van vermissing en een daarop gevolgd huwelijk of geregistreerd partnerschap: op het tijdstip waarop de
      beschikking, bedoeld in [artikel 417, eerste lid][ref1], in kracht van gewijsde is gegaan;

      g. in geval van opheffing bij latere huwelijkse voorwaarden: op het tijdstip, bedoeld in
      [artikel 120, eerste lid][ref2].

      2 De ontbinding van de gemeenschap door indiening van een verzoek als bedoeld in het eerste lid, onder b, c en
      d, alsmede door sluiting van een overeenkomst als bedoeld onder e, kan aan derden die daarvan onkundig waren
      slechts worden tegengeworpen, indien het desbetreffende verzoek dan wel de overeenkomst ingeschreven was in het
      huwelijksgoederenregister, bedoeld in [artikel 116][ref3].

      3 Indien vast komt te staan dat een verzoek als bedoeld in het eerste lid, onder b, c en d, dan wel een
      overeenkomst als bedoeld in het eerste lid, onder e, niet meer kan leiden tot echtscheiding, ontbinding van
      het geregistreerd partnerschap, scheiding van tafel en bed, opheffing van de gemeenschap door een beschikking,
      onderscheidenlijk beëindiging van het geregistreerd partnerschap met wederzijds goedvinden, worden alle gevolgen
      van de gemeenschap geacht steeds te hebben bestaan, alsof er geen verzoek was ingediend of overeenkomst was
      gesloten, tenzij zich inmiddels een andere grond voor ontbinding heeft voorgedaan. Nochtans wordt de geldigheid
      van rechtshandelingen die zijn verricht tussen het tijdstip van indiening van het verzoek of sluiting van de
      overeenkomst en het tijdstip waarop komt vast te staan dat het verzoek of de overeenkomst niet meer tot het in de
      eerste zin bedoelde gevolg kan leiden, beoordeeld naar het tijdstip van de handeling.

      4 Tezamen met een verzoek als bedoeld in het eerste lid, onder b, c of d kan reeds overeenkomstig
      [titel 7 van Boek 3][ref4] een vordering worden ingesteld tot verdeling van de gemeenschap, tot gelasten van de
      wijze van verdeling en tot vaststelling van de verdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel417
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel120
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel116
      [ref4]: https://wetten.overheid.nl/BWBR0005291
