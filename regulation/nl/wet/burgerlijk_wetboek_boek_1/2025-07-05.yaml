  - number: '453'
    text: |-
      1 Tenzij uit wet of verdrag anders voortvloeit, is de betrokkene tijdens het mentorschap onbevoegd
      rechtshandelingen te verrichten in aangelegenheden betreffende zijn verzorging, verpleging, behandeling en
      begeleiding.

      2 Met betrekking tot de in het eerste lid bedoelde rechtshandelingen vertegenwoordigt de mentor de betrokkene in
      en buiten rechte, tenzij op grond van wet of verdrag vertegenwoordiging uitgesloten is. De mentor kan de betrokkene
      toestemming verlenen deze rechtshandelingen zelf te verrichten.

      3 Ten aanzien van andere handelingen dan rechtshandelingen betreffende de in het eerste lid genoemde
      aangelegenheden treedt de mentor, voor zover de aard van de desbetreffende handeling dit toelaat, in plaats van de
      betrokkene op.

      4 De mentor geeft aan de betrokkene raad in hem betreffende aangelegenheden van niet-vermogensrechtelijke aard en
      waakt over diens belangen ter zake.

      5 Verzet de betrokkene zich tegen een handeling van ingrijpende aard in aangelegenheden als in het tweede en derde
      lid bedoeld, dan kan die handeling slechts plaatsvinden indien zij kennelijk nodig is teneinde ernstig nadeel voor
      de betrokkene te voorkomen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel453
  - number: 453a
    text: |-
      1 Indien de rechter dit noodzakelijk acht, beslist hij tevens dat [artikel 246, van dit boek][ref1] van
      overeenkomstige toepassing is.

      2 Tijdens het mentorschap kan de rechter een beslissing nemen als in het eerste lid bedoeld, hetzij op verzoek van
      een persoon als bedoeld in [artikel 451, eerste en tweede lid][ref2], van de mentor of van het openbaar ministerie,
      hetzij ambtshalve.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel451
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel453a
