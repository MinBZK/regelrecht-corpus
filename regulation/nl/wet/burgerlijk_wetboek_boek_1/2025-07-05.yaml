  - number: 80c
    text: |-
      1 Het geregistreerd partnerschap eindigt:

      a. door de dood;

      b. indien degene ten aanzien van wie, overeenkomstig de bepalingen van de
      [tweede afdeling van de achttiende titel][ref1] van dit boek de vermissing is vastgesteld, dan wel overeenkomstig
      de bepalingen van de derde afdeling van de achttiende titel van dit boek het overlijden is vastgesteld, nog in
      leven is op de dag waarop de achtergebleven geregistreerde partner een nieuw geregistreerd partnerschap of huwelijk
      is aangegaan: door de voltrekking van dit geregistreerd partnerschap of huwelijk;

      c. met wederzijds goedvinden door inschrijving door de ambtenaar van de burgerlijke stand van een door beide
      partners en een of meer advocaten of notarissen ondertekende en gedateerde verklaring waaruit blijkt dat en op welk
      tijdstip de partners omtrent de beëindiging van het geregistreerd partnerschap een overeenkomst hebben gesloten.

      d. door ontbinding op verzoek van de partners of een van hen;

      e. door omzetting van een geregistreerd partnerschap in een huwelijk.

      2 Tot inschrijving van verklaringen als bedoeld in het eerste lid, onder c, is de ambtenaar van de
      burgerlijke stand steeds bevoegd indien het geregistreerd partnerschap in Nederland is aangegaan. Indien
      het partnerschap buiten Nederland is aangegaan, is de ambtenaar van de burgerlijke stand tot inschrijving
      van verklaringen als bedoeld in het eerste lid, onder c, bevoegd indien voldaan is aan de voorwaarden van
      [artikel 4, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] voor de bevoegdheid van de rechter
      in geval van de ontbinding van het geregistreerd partnerschap.

      3 Een geregistreerd partnerschap kan niet met wederzijds goedvinden als bedoeld in het eerste lid, onder c, worden
      beëindigd indien de partners:

      a. al dan niet gezamenlijk het gezag uitoefenen over een of meer van hun gezamenlijke kinderen;

      b. ingevolge [artikel 253sa][ref3] of [253t][ref4] het gezag gezamenlijk uitoefenen over een of meer kinderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
