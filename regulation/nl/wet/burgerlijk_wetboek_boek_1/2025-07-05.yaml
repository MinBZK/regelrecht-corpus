  - number: 80d
    text: |-
      1 De in [artikel 80c, eerste lid, onder c][ref1], bedoelde overeenkomst betreft ten minste de verklaring van beide
      partners dat hun geregistreerd partnerschap duurzaam ontwricht is en dat zij het willen beëindigen. Voorts betreft
      de overeenkomst, evenwel niet op straffe van nietigheid:

      a. de uitkering tot levensonderhoud ten behoeve van de geregistreerde partner die niet voldoende inkomsten tot zijn
      levensonderhoud heeft, noch zich in redelijkheid kan verwerven;

      b. wie van de geregistreerde partners huurder van de woonruimte die hun tot hoofdverblijf dient, zal zijn of wie
      van de geregistreerde partners gedurende een bij de overeenkomst te bepalen termijn het gebruik zal hebben van de
      woning en de inboedel die een van hen of hun beiden toebehoren dan wel ten gebruike toekomen;

      c. de verdeling van enige gemeenschap waarin de partners de registratie zijn aangegaan dan wel de verrekening die
      bij voorwaarden als bedoeld in [titel 8][ref2] is overeengekomen;

      d. de verevening of verrekening van pensioenrechten.

      2 Op een beëindiging van het geregistreerd partnerschap met wederzijds goedvinden zijn de [artikelen 155][ref3],
      [157, eerste tot en met zesde lid][ref4], [158][ref5], [159, eerste en derde lid][ref6], [159a][ref7], [160][ref8]
      en [164][ref9] van overeenkomstige toepassing.

      3 De verklaring, bedoeld in [artikel 80c, eerste lid, onder c][ref10], wordt slechts ingeschreven in de registers
      van de burgerlijke stand, indien zij de ambtenaar van de burgerlijke stand uiterlijk drie maanden na het sluiten
      van de overeenkomst heeft bereikt.


