        artikel: '172'
  - number: '443'
    text: |-
      De bewindvoerder kan alvorens in rechte op te treden zich te zijner verantwoording doen machtigen door de
      rechthebbende of, indien deze daartoe niet in staat of weigerachtig is, door de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel443
  - number: '444'
    text: |-
      Een bewindvoerder is jegens de rechthebbende aansprakelijk, indien hij in de zorg van een goed bewindvoerder te
      kort schiet, tenzij de tekortkoming hem niet kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel444
  - number: '445'
    text: |-
      1 De bewindvoerder legt, tenzij andere tijdstippen zijn bepaald, jaarlijks en aan het einde van het bewind rekening
      en verantwoording af aan de rechthebbende, alsmede aan het einde van zijn taak aan zijn opvolger. De rekening en
      verantwoording wordt afgelegd ten overstaan van de kantonrechter. Onze Minister van Veiligheid en Justitie kan een
      model vaststellen volgens hetwelk de rekening en verantwoording moet worden opgemaakt.

      2 Indien de rechthebbende niet in staat is de rekening op te nemen, of het onzeker is wie de rechthebbende is,
      wordt de rekening en verantwoording afgelegd aan de kantonrechter. Goedkeuring van deze rekening en verantwoording
      door de kantonrechter belet niet dat de rechthebbende na het einde van het bewind nogmaals over dezelfde
      tijdsruimte rekening en verantwoording vraagt, voor zover dit niet onredelijk is.

      3 De kantonrechter kan de bewindvoerder - hetzij op diens verzoek, hetzij ambtshalve - vrijstellen van de
      verplichting om de periodieke rekening en verantwoording te zijnen overstaan af te leggen; hij kan ook bepalen
      dat deze wijze van aflegging der rekening en verantwoording slechts om een door hem te bepalen aantal jaren zal
      geschieden.

      4 De bewindvoerder, bedoeld in [artikel 435, zevende lid][ref1], legt jaarlijks de verklaringen en het verslag
      over, bedoeld in artikel 435, achtste lid.

      5 Voor het overige vindt het aangaande de voogdijrekening in de [paragrafen 10][ref2] en
      [11 van afdeling 6 van titel 14][ref3] bepaalde overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel435
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling6
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Afdeling6
