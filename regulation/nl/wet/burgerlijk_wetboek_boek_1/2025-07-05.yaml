  - number: '140'
    text: |-
      1 Op verzoek van de verrekenplichtige echtgenoot kan de rechter wegens gewichtige redenen bepalen dat een
      verschuldigde geldsom, al dan niet vermeerderd met een in de beschikking te bepalen rente, in termijnen of eerst
      na verloop van zekere tijd, hetzij ineens, hetzij in termijnen behoeft te worden voldaan. Hierbij let de rechter op
      de belangen van beide partijen. De rechter kan de verrekenplichtige echtgenoot verplichten binnen een bepaalde tijd
      zakelijke of persoonlijke zekerheid te stellen voor de voldoening van de verschuldigde geldsom.

      2 Hetgeen in het eerste lid omtrent een echtgenoot is bepaald, geldt op overeenkomstige wijze na zijn overlijden
      voor zijn rechtverkrijgenden onder algemene titel.

      3 Van het eerste en tweede lid kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel140
  - number: '141'
    text: |-
      1 Indien een verrekenplicht betrekking heeft op een in de huwelijkse voorwaarden omschreven tijdvak van het
      huwelijk en over dat tijdvak niet is afgerekend, blijft de verplichting tot verrekening over dat tijdvak in stand
      en strekt deze zich uit over het saldo, ontstaan door belegging en herbelegging van hetgeen niet verrekend is,
      alsmede over de vruchten daarvan.

      2 Indien een verrekenplicht betrekking heeft op een in de huwelijkse voorwaarden omschreven tijdvak van het
      huwelijk, dan eindigt die verrekenplicht op het tijdstip zoals in [artikel 142][ref1] bepaald, als dat tijdvak
      nog loopt.

      3 Indien bij het einde van het huwelijk aan een bij huwelijkse voorwaarden overeengekomen periodieke verrekenplicht
      als bedoeld in het eerste lid niet is voldaan, wordt het alsdan aanwezige vermogen vermoed te zijn gevormd uit
      hetgeen verrekend had moeten worden, tenzij uit de eisen van redelijkheid en billijkheid in het licht van de aard
      en omvang van de verrekenplicht anders voortvloeit. [Artikel 143][ref2] is van overeenkomstige toepassing.

      4 Indien een echtgenoot in overwegende mate bij machte is te bepalen dat de winsten van een niet op zijn eigen naam
      uitgeoefende onderneming hem rechtstreeks of middellijk ten goede komen, en een verrekenbeding is overeengekomen
      dat ook ondernemingswinsten omvat, worden de niet uitgekeerde winsten uit zodanige onderneming, voor zover in
      het maatschappelijk verkeer als redelijk beschouwd, eveneens in aanmerking genomen bij de vaststelling van de
      verrekenplicht van die echtgenoot, onverminderd het eerste lid.

      5 Het vierde lid is van overeenkomstige toepassing, indien een echtgenoot op eigen naam een onderneming uitoefent.

      6 De rechtsvordering tot verrekening, bedoeld in het eerste lid, verjaart niet eerder dan drie jaren na de
      beëindiging van het huwelijk dan wel na de inschrijving van de beschikking tot scheiding van tafel en bed in het
      register, bedoeld in [artikel 116][ref3]. Deze termijn kan niet worden verkort.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel143
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel116
