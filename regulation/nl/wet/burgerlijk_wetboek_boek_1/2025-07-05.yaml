        afdeling: '6'
  - number: '292'
    text: |-
      1 Een ouder kan bij uiterste wilsbeschikking of door hiervan aantekening te laten opnemen in het register,
      bedoeld in [artikel 244][ref1], bepalen welke persoon dan wel welke twee personen na zijn dood voortaan als voogd
      onderscheidenlijk als gezamenlijke voogden het gezag over zijn kinderen zullen uitoefenen.

      2 Hij kan geen rechtspersoon als voogd aanwijzen.

      3 Hebben beide ouders van deze bevoegdheid gebruik gemaakt, en sterven zij, zonder dat men kan weten wie het eerst
      overleden is, dan bepaalt de rechtbank ambtshalve wiens beschikking of aantekening gevolg heeft.

      4 Heeft een ouder bij beschikking en bij aantekening verschillende voogden aangewezen, dan heeft de laatst gedane
      aanwijzing gevolg.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel244
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel292
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '244'
        afdeling: '4'
  - number: '293'
    text: |-
      De door de ouder getroffen regeling heeft geen gevolg of vervalt:

      a. indien na zijn overlijden de andere ouder van rechtswege of krachtens rechterlijke beschikking het gezag over
      zijn kinderen uitoefent;

      b. indien en voor zover hij op het tijdstip van zijn overlijden het gezag over zijn kinderen niet heeft;

      c. indien de ander die met de ouder gezamenlijk het gezag uitoefent van rechtswege de voogd over de kinderen wordt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel293
  - number: '295'
    text: |-
      De rechtbank benoemt een voogd over alle minderjarigen, die niet onder ouderlijk gezag staan en in wier voogdij
      niet op wettige wijze is voorzien.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel295
  - number: '296'
    text: |-
      1 Is voorziening nodig in afwachting van het begin der voogdij overeenkomstig [artikel 280][ref1] van dit boek, dan
      benoemt de rechtbank een voogd voor de duur van deze omstandigheden.

      2 Zodra bedoelde omstandigheden zijn vervallen, wordt deze voogd op verzoek van hem die hij vervangt, door de
      rechtbank ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel280
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel296
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '280'
        paragraaf: '1'
        afdeling: '6'
  - number: '297'
    text: |-
      1 De rechtbank benoemt insgelijks een voogd, wanneer voorziening nodig is wegens:

      a. tijdelijke onmogelijkheid, waarin een voogd zich bevindt, het gezag uit te oefenen; of

      b. onbekendheid van bestaan of verblijfplaats van de voogd; of

      c. in gebreke blijven van de voogd, het gezag uit te oefenen.

      2 Is de benoeming op het eerste lid onder *c* gegrond, dan kan de rechtbank de benoemde voogd een beloning
      toekennen en is de in gebreke gebleven voogd jegens de minderjarige aansprakelijk voor de kosten die de vervanging
      veroorzaakt, alsmede, behoudens zijn verhaal op de benoemde voogd, voor diens verrichtingen.

      3 Indien de in het eerste lid genoemde omstandigheden zijn vervallen, kan de voogd op eigen verzoek of op verzoek
      van degene die hij vervangt, door de rechtbank worden ontslagen tenzij de rechtbank dit niet in het belang van het
      kind noodzakelijk oordeelt.

      4 Indien in geval van gezamenlijke uitoefening van de voogdij een van de in het eerste lid bedoelde omstandigheden
      zich voordoet ten aanzien van een van beide voogden, oefent de andere voogd het gezag over de kinderen alleen uit.
      Zodra deze omstandigheid is vervallen, herleeft de gezamenlijke voogdij. Het tweede lid is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel297
  - number: '298'
    text: |-
      Gedurende de in de [artikelen 296][ref1] en [297][ref2] bedoelde voogdij is de uitoefening van de voogdij geschorst
      ten aanzien van de voogd die het betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel296
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel297
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel298
