  - number: '436'
    text: |-
      1 De bewindvoerder is verplicht zo spoedig mogelijk een beschrijving van de aan het bewind
      onderworpen goederen op te maken en een afschrift daarvan in te leveren ter griffie van de ingevolge
      [artikel 266 van het Wetboek van Burgerlijke Rechtsvordering][ref1] bevoegde rechtbank.

      2 De [artikelen 339][ref2], [363][ref3] en [364][ref4] van dit boek zijn van overeenkomstige toepassing.

      3 Indien tot het bewind registergoederen behoren, is de bewindvoerder verplicht zo spoedig mogelijk
      de desbetreffende rechterlijke beschikkingen en zijn benoeming in de openbare registers, bedoeld in
      [afdeling 2 van titel 1 van Boek 3][ref5], te doen inschrijven. Is een onderneming of een aandeel in
      een vennootschap onder firma onder bewind gesteld, dan is de bewindvoerder verplicht de desbetreffende
      rechterlijke beschikkingen en zijn benoeming in het handelsregister te doen inschrijven. De kantonrechter
      kan, hetzij op verzoek van degene die gerechtigd is onderbewindstelling te verzoeken als bedoeld in
      [artikel 432, eerste en tweede lid][ref6], of van de bewindvoerder, hetzij ambtshalve bepalen dat een beschikking
      tot onderbewindstelling wegens een lichamelijke of geestelijke toestand, voor zover het bewind alle goederen
      betreft, die de rechthebbende toebehoren of zullen toebehoren, en een beschikking houdende benoeming, schorsing
      of ontslag van de bewindvoerder vanwege de griffier in het register, bedoeld in [artikel 391][ref7], worden
      ingeschreven.

      4 Tenzij de kantonrechter anders bepaalt, is de bewindvoerder verplicht zo spoedig mogelijk een rekening te openen
      bij een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref8] in Nederland het bedrijf
      van bank mag uitoefenen; de bewindvoerder is voorts verplicht om uitsluitend voor de betalingen die hij bij de
      vervulling van zijn taak verricht of ontvangt zoveel mogelijk van deze rekening gebruik te maken.

      5 De kantonrechter kan te allen tijde de bewindvoerder ten verhore doen oproepen. Deze is verplicht alle door de
      kantonrechter gewenste inlichtingen te verstrekken.

      6 De kantonrechter kan van de bewindvoerder verlangen dat hij inzage geeft van zijn boeken, bescheiden en andere
      gegevensdragers. Hij kan voorts een afschrift daarvan verlangen.


