  - number: 241a
    text: |-
      Op de uitoefening van de voorlopige voogdij door een gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1] is [artikel 243][ref2] van dit Boek van overeenkomstige toepassing.


