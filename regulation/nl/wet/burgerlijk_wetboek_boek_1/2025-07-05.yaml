  - number: '402'
    text: |-
      1 De rechter, die het bedrag van een uitkering tot levensonderhoud bepaalt, wijzigt of intrekt, stelt tevens de dag
      vast, van welke dit bedrag verschuldigd is of ophoudt verschuldigd te zijn.

      2 Bij de vaststelling van een bedrag bepaalt de rechter tevens of dit wekelijks, maandelijks of driemaandelijks
      moet worden voldaan.

      3 Zouden op de dag, dat de uitspraak ten uitvoer kan worden gelegd, reeds meer dan één termijn verschenen zijn
      of meer dan één termijn terugbetaald moeten worden, dan kan de rechter ook daarvoor een betaling in termijnen
      toestaan.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel402
  - number: 402a
    text: |-
      1 De bij rechterlijke uitspraak of bij overeenkomst vastgestelde bedragen voor levensonderhoud worden jaarlijks
      van rechtswege gewijzigd met een door Onze Minister van Justitie vast te stellen percentage, dat, behoudens het
      bepaalde in het derde en vierde lid, overeenkomt met het procentuele verschil tussen het indexcijfer der lonen per
      30 september van enig jaar en het overeenkomstige indexcijfer in het voorafgaande jaar.

      2 De wijziging gaat in op 1 januari volgende op de in het eerste lid genoemde datum. De beschikking waarin het
      percentage is vastgesteld, wordt bekend gemaakt in de Staatscourant.

      3 Bij algemene maatregel van bestuur wordt bepaald wat onder indexcijfer der lonen wordt verstaan.

      4 Het percentage van de wijziging van de bedragen voor levensonderhoud kan worden afgerond op tienden van een
      procent. Daarbij vindt, indien van het in het eerste lid bedoelde procentuele verschil het tweede of een volgend
      cijfer achter de komma vijf bedraagt, voor wat betreft die cijfers afronding naar beneden plaats.

      5 De wijziging van rechtswege kan bij rechterlijke uitspraak of bij overeenkomst geheel of voor een bepaalde
      tijdsduur worden uitgesloten. Daarbij kan tevens worden bepaald dat en op welke wijze het bedrag voor
      levensonderhoud anders dan van rechtswege periodiek zal worden gewijzigd.

      6 Bij de uitspraak, waarbij de tweede zin van het vorige lid toepassing heeft gevonden, en ook nadien, kan de
      rechter een regeling geven omtrent de wijze en de tijdstippen waarop de tot uitkering verplichte persoon aan de tot
      uitkering gerechtigde persoon gegevens dient te verschaffen ten behoeve van de vaststelling van de wijziging van
      het bedrag voor levensonderhoud. Deze beslissingen kunnen worden gegeven en nadien worden gewijzigd op verzoek van
      de tot uitkering verplichte of gerechtigde persoon.

      7 De uitsluiting van de wijziging van rechtswege kan bij rechterlijke uitspraak worden ingetrokken. Voor zover
      het een uitsluiting betreft waarbij de tweede zin van het vijfde lid niet is toegepast, kan de intrekking alleen
      geschieden in de gevallen bedoeld in [artikel 401 van dit boek][ref1].

      8 De tenuitvoerlegging van een executoriale titel betreffende de betaling van levensonderhoud geschiedt met
      inachtneming van de op het tijdstip van de tenuitvoerlegging ingegane wijzigingen van rechtswege dan wel met
      inachtneming van de wijzigingen overeenkomstig de tweede zin van het vijfde lid van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel401
