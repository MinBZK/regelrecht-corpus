  - number: 282b
    text: |-
      Na de dood van een voogd die de voogdij samen met een ander uitoefende, oefent de andere voogd voortaan alleen de
      voogdij over de kinderen uit.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel282b
  - number: '283'
    text: |-
      De verzoeken die de gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref1], dan wel de
      rechtspersoon, bedoeld in [artikel 302, tweede lid][ref2], in verband met de uitoefening van de voogdij tot de
      rechter richt, kunnen worden ingediend zonder advocaat en worden kosteloos behandeld. De grossen, afschriften, en
      uittreksels, die zij tot dit doel aanvragen, worden hun door de griffiers vrij van alle kosten uitgereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
