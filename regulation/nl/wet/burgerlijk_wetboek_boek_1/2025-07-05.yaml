  - number: '202'
    text: |-
      1 Nadat de beschikking houdende gegrondverklaring van een ontkenning van een door huwelijk of geregistreerd
      partnerschap ontstaan vaderschap in kracht van gewijsde is gegaan, wordt het door huwelijk of geregistreerd
      partnerschap ontstane vaderschap geacht nimmer gevolg te hebben gehad.

      2 Te goeder trouw door derden verkregen rechten worden hierdoor nochtans niet geschaad.

      3 Door de gegrondverklaring van de ontkenning ontstaat geen vordering tot teruggave van kosten van verzorging en
      opvoeding of van kosten van levensonderhoud en studie noch tot teruggave van het krachtens vruchtgenot genotene.
      Voorts ontstaat geen verplichting tot teruggave van genoten vermogensrechtelijke voordelen, voor zover degene die
      hen heeft genoten ten tijde van het doen van het verzoek daardoor niet was gebaat.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel202
  - number: 202a
    text: |-
      1 Het in [artikel 198, eerste lid, onder b][ref1], bedoelde moederschap kan, op de grond dat de moeder niet de
      biologische moeder van het kind is, worden ontkend:

      a. door de moeder, bedoeld in [artikel 198, eerste lid, onder a][ref2];

      b. door de moeder, bedoeld in [artikel 198, eerste lid, onder b][ref3];

      c. door het kind zelf.

      2 De moeder, bedoeld in [artikel 198, eerste lid, onder a of onder b][ref4], kan het in artikel 198, eerste
      lid, onder b, bedoelde moederschap niet ontkennen, indien de moeder, bedoeld in het eerste lid, onder b, vóór
      het huwelijk of geregistreerd partnerschap heeft kennis gedragen van de zwangerschap of heeft ingestemd met de
      kunstmatige donorbevruchting, bedoeld in artikel 198, eerste lid, onder b.

      3 Het verzoek tot gegrondverklaring van de ontkenning wordt door de moeder, bedoeld in
      [artikel 198, eerste lid, onder a of onder b][ref5], bij de rechtbank ingediend binnen een jaar na de geboorte van
      het kind.

      4 Het verzoek tot gegrondverklaring van de ontkenning wordt door het kind bij de rechtbank ingediend uiterlijk
      binnen drie jaren nadat het kind meerderjarig is geworden.


