  - number: '100'
    text: |-
      1 De echtgenoten hebben een gelijk aandeel in de ontbonden gemeenschap, tenzij anders is bepaald bij huwelijkse
      voorwaarden of bij een overeenkomst die tussen de echtgenoten bij geschrift is gesloten met het oog op de
      aanstaande ontbinding der gemeenschap anders dan door de dood of ten gevolge van opheffing bij huwelijkse
      voorwaarden.

      2 Voor zover bij de ontbinding van de gemeenschap de goederen van de gemeenschap niet toereikend zijn om de
      schulden van de gemeenschap te voldoen, worden deze gedragen door beide echtgenoten ieder voor een gelijk deel,
      tenzij uit de eisen van redelijkheid en billijkheid, mede in verband met de aard van de schulden, een andere
      draagplicht voortvloeit.

      3 Zij die bij de ontbinding van de gemeenschap schuldeiser zijn, behouden het hun toekomende recht van verhaal op
      de goederen der gemeenschap, zolang deze niet verdeeld zijn. [Artikel 96, derde lid][ref1], blijft van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel96
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '96'
        afdeling: '1'
  - number: '101'
    text: |-
      Na de ontbinding der gemeenschap heeft ieder der echtgenoten de bevoegdheid de te zijnen gebruike strekkende
      kleren en kleinodiën, alsmede zijn beroeps- en bedrijfsmiddelen en de papieren en gedenkstukken tot zijn familie
      behorende, tegen de geschatte prijs over te nemen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel101
  - number: '102'
    text: |-
      Na ontbinding van de gemeenschap blijft ieder der echtgenoten voor het geheel aansprakelijk voor de
      gemeenschapsschulden waarvoor hij voordien aansprakelijk was. Voor andere gemeenschapsschulden is hij hoofdelijk
      met de andere echtgenoot verbonden, met dien verstande evenwel dat daarvoor slechts kan worden uitgewonnen hetgeen
      hij uit hoofde van verdeling van de gemeenschap heeft verkregen, onverminderd de [artikelen 190, eerste lid][ref1],
      en [191, eerste lid, van Boek 3][ref2]. De rechtsvordering tot voldoening van de in de tweede volzin bedoelde
      schuld verjaart tegelijkertijd met de rechtsvordering tegen de echtgenoot, in wiens persoon de in die volzin
      bedoelde gemeenschapsschuld is ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel190
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel191
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '190'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '191'
  - number: '103'
    text: |-
      1 Ieder der echtgenoten heeft het recht van de gemeenschap afstand te doen; alle daarmede strijdige overeenkomsten
      zijn nietig.

      2 Het deel der gemeenschap waarvan afstand wordt gedaan, wast aan bij het deel van de andere echtgenoot.

      3 De echtgenoot die afstand heeft gedaan, kan uit de gemeenschap niets terugvorderen dan alleen zijn bed met
      bijbehorend beddegoed en de kleren die hij voor zijn persoonlijk gebruik nodig heeft. Hij kan de papieren en
      gedenkstukken, tot zijn familie behorende, tegen de geschatte prijs overnemen.

      4 Door deze afstand wordt hij ontheven van de aansprakelijkheid en de draagplicht voor schulden der gemeenschap,
      waarvoor hij vóór de ontbinding der gemeenschap niet aansprakelijk was.

      5 Hij blijft aansprakelijk voor de schulden der gemeenschap, waarvoor hij vóór de ontbinding der gemeenschap
      aansprakelijk was. Indien hij een schuld, waarvoor beide echtgenoten vóór de ontbinding der gemeenschap voor het
      geheel aansprakelijk waren, voor meer dan de helft heeft voldaan, heeft hij voor het meerdere verhaal tegen de
      andere echtgenoot.

      6 Indien de andere echtgenoot een schuld der gemeenschap, waarvoor hij vóór de ontbinding der gemeenschap niet
      aansprakelijk was, geheel of ten dele heeft voldaan, heeft hij deswege verhaal tegen de echtgenoot die de afstand
      heeft gedaan. Heeft hij een schuld, waarvoor beide echtgenoten vóór de ontbinding der gemeenschap voor het geheel
      aansprakelijk waren, voor meer dan de helft voldaan, dan heeft hij voor het meerdere verhaal tegen de echtgenoot
      die de afstand heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel103
  - number: '104'
    text: |-
      1 De echtgenoot die van het bij het vorige artikel omschreven voorrecht wil gebruik maken, is verplicht binnen drie
      maanden na de ontbinding der gemeenschap een akte van afstand te doen inschrijven in het huwelijksgoederenregister,
      aangewezen in [artikel 116 van dit boek][ref1], op verbeurte van dit voorrecht.

      2 Indien de gemeenschap door de dood van de andere echtgenoot wordt ontbonden, begint de termijn van
      drie maanden te lopen op de dag waarop de echtgenoot die van het voorrecht wil gebruik maken, van
      dat overlijden kennis heeft genomen. Indien de gemeenschap is ontbonden op de wijze als bedoeld in
      [artikel 99, eerste lid, onder c en d][ref2], eindigt de termijn drie maanden nadat het verzoek tot opheffing van
      de gemeenschap of tot scheiding van tafel en bed bij de rechtbank is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel99
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '99'
        afdeling: '3'
  - number: '105'
    text: |-
      1 De erfgenamen van een echtgenoot, door wiens overlijden de gemeenschap is ontbonden, of die binnen de in het
      vorige artikel gestelde termijn is overleden zonder afstand te hebben gedaan, zijn ieder voor hun aandeel bevoegd
      op de in het vorige artikel omschreven wijze afstand te doen binnen drie maanden nadat zij met het overlijden
      bekend zijn geworden.

      2 De aanspraak van de echtgenoot tot terugvordering van zijn bed, beddegoed, en kleren uit de gemeenschap kan niet
      worden overgedragen en gaat ook niet over op zijn erfgenamen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel105
  - number: '106'
    text: |-
      De rechtbank van de plaats waar de akte van afstand moet worden ingeschreven, kan de voor de inschrijving gestelde
      termijn voor de afloop daarvan een of meer malen op grond van bijzondere omstandigheden verlengen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel106
  - number: '107'
    text: |-
      1 De echtgenoot of zijn erfgenaam, die zich de goederen der gemeenschap heeft aangetrokken of goederen daarvan
      heeft weggemaakt of verduisterd, kan geen afstand meer doen. Daden van dagelijks bestuur of tot behoud van de
      goederen brengen dit gevolg niet teweeg.

      2 Hij die na gedane afstand goederen der gemeenschap wegmaakt of verduistert, verliest de bevoegdheid
      [artikel 103 lid 4 van dit boek][ref1] in te roepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel103
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '103'
        afdeling: '3'
  - number: '108'
    text: |-
      1 Afstand van de gemeenschap, door een echtgenoot of een erfgenaam van een echtgenoot gedaan nadat door de
      andere echtgenoot of een of meer van diens erfgenamen afstand werd gedaan, heeft niet de gevolgen, omschreven in
      [artikel 103 leden 2 en 3 van dit boek][ref1], en verplicht hen die tot de gemeenschap gerechtigd zijn, haar te
      vereffenen. [Afdeling 3 van titel 6 van Boek 4][ref2] betreffende de vereffening van nalatenschappen is zoveel
      mogelijk van overeenkomstige toepassing.

      2 Indien hij die tot vereffening van de gemeenschap gehouden is, na tot het afleggen van de rekening en
      verantwoording te zijn aangemaand, in gebreke blijft aan deze verplichting te voldoen, verliest hij de bevoegdheid
      [artikel 103 lid 4 van dit boek][ref3] in te roepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Afdeling3
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel103
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '103'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002761
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '103'
        afdeling: '3'
  - number: '109'
    text: |-
      Een echtgenoot kan opheffing van de gemeenschap verzoeken, wanneer de andere echtgenoot op lichtvaardige wijze
      schulden maakt, de goederen der gemeenschap verspilt, handelingen verricht, die kennelijk indruisen tegen het
      bestuur van de andere echtgenoot over goederen der gemeenschap, of weigert de nodige inlichtingen te geven omtrent
      de stand van de goederen der gemeenschap en van de daarop verhaalbare schulden en het over die goederen gevoerde
      bestuur.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel109
  - number: '110'
    text: |-
      De echtgenoot die de opheffing van de gemeenschap verzoekt, kan tot behoud van zijn recht de maatregelen nemen, die
      in het [Wetboek van Burgerlijke Rechtsvordering][ref1] nader zijn aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '111'
    text: |-
      1 Indien de echtgenoot tegen wie het verzoek is toegewezen, de gemeenschap heeft benadeeld doordat hij na de
      aanvang van het geding of binnen zes maanden daarvóór lichtvaardig schulden heeft gemaakt, goederen der gemeenschap
      heeft verspild, of een rechtshandeling als bedoeld in [artikel 88 van dit boek][ref1] zonder de vereiste
      toestemming of beslissing van de rechtbank heeft verricht, is hij gehouden de aangerichte schade aan de gemeenschap
      te vergoeden.

      2 Een op het vorige lid gegronde vordering kan niet later worden ingesteld dan drie jaren nadat het verzoek tot
      opheffing van de gemeenschap bij de rechtbank is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel88
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '88'
  - number: '113'
    text: |-
      Is de gemeenschap door opheffing ontbonden, dan kunnen de echtgenoten daarna, echter alleen bij huwelijkse
      voorwaarden, wederom een gemeenschap overeenkomen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel113
  - number: '114'
    text: |-
      Huwelijkse voorwaarden kunnen zowel door aanstaande echtgenoten vóór het sluiten van het huwelijk als door
      echtgenoten tijdens het huwelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel114
  - number: '115'
    text: |-
      1 Huwelijkse voorwaarden moeten op straffe van nietigheid bij notariële akte worden aangegaan.

      2 Een volmacht tot het aangaan van huwelijkse voorwaarden moet schriftelijk worden verleend en moet de in de
      huwelijkse voorwaarden op te nemen bepalingen bevatten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel115
  - number: '116'
    text: |-
      1 Bepalingen in huwelijkse voorwaarden kunnen aan derden die daarvan onkundig waren, slechts worden tegengeworpen,
      indien die bepalingen ingeschreven waren in het openbaar huwelijksgoederenregister, gehouden ter griffie der
      rechtbank binnen welker rechtsgebied het huwelijk is voltrokken, of, indien het huwelijk buiten Nederland is
      aangegaan, ter griffie van de rechtbank Den Haag.

      2 De wijze van inrichting en raadpleging van het register wordt nader bij algemene maatregel van bestuur geregeld.

      3 In afwijking van het eerste lid kan bij algemene maatregel van bestuur worden bepaald dat het register elders
      dan ter griffie der rechtbank wordt gehouden. Bij algemene maatregel van bestuur kan eveneens worden bepaald dat de
      verstrekking van gegevens ter inschrijving in het register uitsluitend op een in die maatregel aan te geven wijze
      plaats vindt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel116
  - number: '117'
    text: |-
      1 Huwelijkse voorwaarden vóór het huwelijk gemaakt of gewijzigd, zijn slechts geldig, indien zij wier toestemming
      tot het huwelijk noodzakelijk is, bij de akte hun toestemming tot de huwelijkse voorwaarden of de wijziging hebben
      gegeven; is de toestemming van de rechter nodig, dan kan worden volstaan met vasthechting van zijn beschikking aan
      de minuut van de akte. Op het verzoek tot toestemming van de rechter is [artikel 39 lid 1][ref1] van dit boek van
      overeenkomstige toepassing.

      2 Vóór het huwelijk gemaakte huwelijkse voorwaarden beginnen te werken van het tijdstip der voltrekking van het
      huwelijk; geen ander tijdstip kan daarvoor worden aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel39
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '39'
        afdeling: '1'
  - number: '118'
    text: |-
      De echtgenoot die onder curatele staat, kan na de huwelijksvoltrekking slechts met toestemming van zijn curator
      huwelijkse voorwaarden maken of wijzigen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel118
  - number: '120'
    text: |-
      1 Tijdens het huwelijk gemaakte of gewijzigde huwelijkse voorwaarden beginnen te werken op de dag, volgende op die
      waarop de akte is verleden, tenzij in de akte een later tijdstip is aangewezen.

      2 Bepalingen in deze huwelijkse voorwaarden kunnen aan derden die daarvan onkundig waren, slechts worden
      tegengeworpen, indien zij ten minste veertien dagen in het huwelijksgoederenregister ingeschreven waren.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel120
  - number: '121'
    text: |-
      1 Partijen kunnen bij huwelijkse voorwaarden afwijken van de regels der wettelijke gemeenschap, mits die
      voorwaarden niet met dwingende wetsbepalingen, de goede zeden, of de openbare orde strijden.

      2 Zij kunnen niet bepalen dat een hunner tot een groter aandeel in de schulden zal zijn gehouden, dan zijn aandeel
      in de goederen der gemeenschap beloopt.

      3 Zij kunnen niet afwijken van de rechten die uit het ouderlijk gezag voortspruiten, noch van de rechten die de wet
      aan een langstlevende echtgenoot toekent.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel121
  - number: '131'
    text: |-
      1 Bestaat tussen niet in gemeenschap van goederen gehuwde echtgenoten een geschil aan wie van hen beiden een
      recht aan toonder of een zaak die geen registergoed is, toebehoort en kan geen van beiden zijn recht op dit goed
      bewijzen, dan wordt het goed geacht aan ieder der echtgenoten voor de helft toe te behoren.

      2 Het vermoeden werkt niet ten nadele van de schuldeisers der echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel131
  - number: '132'
    text: |-
      1 Deze afdeling is van toepassing op huwelijkse voorwaarden die een of meer verplichtingen inhouden tot verrekening
      van inkomsten of van vermogen.

      2 Tenzij anders is bepaald, kan van deze afdeling bij huwelijkse voorwaarden uitdrukkelijk of door de aard der
      bedingen worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel132
  - number: '133'
    text: |-
      1 De verplichting tot verrekening van inkomsten of van vermogen is wederkerig.

      2 De verplichting tot verrekening heeft uitsluitend betrekking op inkomsten die of op vermogen dat de echtgenoten
      tijdens het bestaan van deze verplichting hebben verkregen. De verplichting tot verrekening heeft geen betrekking
      op vermogen dat krachtens erfopvolging bij versterf, making, lastbevoordeling of gift wordt verkregen en ook niet
      op de vruchten daaruit of de voor dat vermogen of voor die vruchten in de plaats getreden goederen. Evenmin heeft
      de verplichting tot verrekening betrekking op vermogen dat bestaat uit rechten op het vestigen van vruchtgebruik
      als bedoeld in de [artikelen 29][ref1] en [30 van Boek 4][ref2], vruchtgebruik dat op grond van die bepalingen is
      gevestigd, alsmede hetgeen wordt verkregen ingevolge de [artikelen 34][ref3], [35][ref4], [36][ref5], [38][ref6],
      [63 tot en met 92][ref7] en [126, eerste lid en tweede lid, onderdelen a en c, van Boek 4][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0002761#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0002761#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0002761#Artikel35
      [ref5]: https://wetten.overheid.nl/BWBR0002761#Artikel36
      [ref6]: https://wetten.overheid.nl/BWBR0002761#Artikel36
      [ref7]: https://wetten.overheid.nl/BWBR0002761#Artikel63
      [ref8]: https://wetten.overheid.nl/BWBR0002761#Artikel126
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel133
