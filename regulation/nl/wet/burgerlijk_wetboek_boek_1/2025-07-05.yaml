  - number: 265a
    text: |-
      Plaatsing van de minderjarige gedurende dag en nacht buiten het gezin geschiedt uitsluitend met een machtiging
      tot uithuisplaatsing.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel265a
  - number: 265b
    text: |-
      1 Indien dit noodzakelijk is in het belang van de verzorging en opvoeding van de minderjarige of tot onderzoek
      van diens geestelijke of lichamelijke gesteldheid, kan de kinderrechter de gecertificeerde instelling, bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1], die belast is met de uitvoering van de ondertoezichtstelling op haar verzoek
      machtigen de minderjarige gedurende dag en nacht uit huis te plaatsen.

      2 De machtiging kan eveneens worden verleend op verzoek van de raad voor de kinderbescherming of op verzoek van het
      openbaar ministerie.

      3 Voor opneming en verblijf als bedoeld in [artikel 6.1.2, eerste lid][ref2], of
      [6.1.3, eerste lid, van de Jeugdwet][ref3] is geen machtiging als bedoeld in het eerste lid vereist, doch een
      machtiging als bedoeld in genoemde artikelleden. Deze machtiging geldt voor de toepassing van [artikel 265a][ref4]
      als een machtiging als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6.1.2
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6.1.3
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel265a
