  - number: '409'
    text: |-
      1 Indien iemand die zijn woonplaats heeft verlaten niet voldoende orde op het bestuur van zijn goederen heeft
      gesteld, en er noodzakelijkheid bestaat om daarin geheel of gedeeltelijk te voorzien of de afwezige te doen
      vertegenwoordigen, benoemt de kantonrechter, op verzoek van belanghebbenden of het openbaar ministerie, een
      bewindvoerder, ten einde het bewind over het geheel of een gedeelte van de goederen van de afwezige te voeren en
      diens overige belangen waar te nemen.

      2 Voor de toepassing van deze afdeling wordt met iemand die zijn woonplaats heeft verlaten, gelijk gesteld hij
      wiens bestaan onzeker is geworden of die onbereikbaar is, ook al staat niet vast dat hij zijn woonplaats heeft
      verlaten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel409
  - number: '410'
    text: |-
      1 Voor zover de kantonrechter niet anders bepaalt, vinden op het bewind van de bewindvoerder de
      [artikelen 338][ref1], [339][ref2],[340][ref3], [342-357][ref4], [358 lid 1][ref5] en [359-363][ref6] van dit boek
      overeenkomstige toepassing, met dien verstande dat de bewindvoerder verplicht is jaarlijks bij de griffie van de
      rechtbank, een rekening in te dienen van zijn bewind.

      2 De bewindvoerder heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling van Onze
      Minister van Veiligheid en Justitie zijn vastgesteld.

      3 Goedkeuring van een ingediende rekening door de kantonrechter brengt geen nadeel toe aan de bevoegdheid van de
      rechthebbenden om na het einde van het bewind over dezelfde tijdruimte rekening en verantwoording te vragen, voor
      zover dit niet onredelijk is.

      4 De bewindvoerder kan ook voor andere dan vermogensbelangen van de afwezige opkomen, behoudens voor zover de
      kantonrechter zulks heeft uitgesloten.

      5 De kantonrechter kan te allen tijde de bewindvoerder ontslaan en door een ander vervangen.


