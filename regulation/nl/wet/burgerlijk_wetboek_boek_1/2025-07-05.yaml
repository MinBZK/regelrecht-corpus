      1 Bij algemene maatregel van bestuur wordt geregeld al wat betreft de aan de ambtenaar over te leggen stukken, het
      opmaken van de akten, onderscheidenlijk de voorlopige akten van geboorte en van overlijden, en de inhoud daarvan.

      2 Bij algemene maatregel van bestuur wordt tevens geregeld:

      a. op welke wijze en waar de akten van geboorte en van overlijden zullen worden opgemaakt en ingeschreven wanneer
      dit ten gevolge van een verbod van verkeer of ten gevolge van andere buitengewone omstandigheden niet op de gewone
      wijze kan geschieden; en

      b. op welke wijze en waar overlijdensakten zullen worden opgemaakt van militairen en van andere personen, die tot
      de krijgsmacht behoren en die te velde, in de slag, of in ’s Rijks dienst buiten Nederland zijn overleden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel19j
  - number: 19k
    text: |-
      1 Een ieder die zijn gewone verblijfplaats in Nederland heeft, kan de ambtenaar van de burgerlijke stand van
      zijn woonplaats verzoeken om afgifte van een attestatie de vita opgesteld overeenkomstig bijlage 1 van de op
      10 september 1998 te Parijs tot stand gekomen Overeenkomst betreffende de afgifte van een attestatie de vita
      (Trb. 2004, 283).

      2 De verzoeker verschijnt in persoon voor de ambtenaar van de burgerlijke stand van zijn woonplaats,
      dan wel voor de daartoe in Nederland bevoegde diplomatieke of consulaire autoriteit, tenzij hij in de
      onmogelijkheid hiertoe verkeert. Hij toont zijn identiteit aan aan de hand van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].

      3 De attestatie de vita is gedurende zes maanden geldig, te rekenen vanaf de datum van afgifte. Zij is vrijgesteld
      van de vereisten van vertaling en van legalisatie dan wel van enig soortgelijk formeel vereiste.

      4 De attestatie de vita wordt afgegeven in de Nederlandse taal en in de Franse taal. Op verzoek wordt daarbij
      tevens afgegeven:

      a. de lijst van coderingen en de vertaling ervan in de officiële taal of in één van de officiële talen van het land
      waar de attestatie overgelegd zal worden, of

      b. de vertaling in de officiële taal of in één van de officiële talen van de landen die bij de in het eerste
      lid genoemde Overeenkomst partij zijn. De vertaling wordt uitgevoerd overeenkomstig de in de bijlage bij de
      Overeenkomst vastgestelde termen.

      5 Iedere belanghebbende kan met betrekking tot een attestatie de vita die is afgegeven in een ander land dat partij
      is bij de in het eerste lid genoemde Overeenkomst, de ambtenaar van de burgerlijke stand in zijn woonplaats dan wel
      de daartoe in Nederland bevoegde diplomatieke of consulaire autoriteit verzoeken om afgifte van:

      a. een vertaling van de coderingen in het Nederlands, of

      b. een vertaling van de attestatie de vita in het Nederlands.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
