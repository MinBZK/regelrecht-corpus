  - number: 282a
    text: |-
      1 De gezamenlijke uitoefening van de voogdij eindigt op de dag waarop in kracht van gewijsde is gegaan de
      beschikking waarbij de gezamenlijke uitoefening van de voogdij is beëindigd of waarbij de voogdij is geëindigd
      ingevolge [artikel 281][ref1], alsmede na het overlijden van een van de voogden.

      2 Is de beschikking, bedoeld in het eerste lid, uitvoerbaar bij voorraad verklaard, dan eindigt de gezamenlijke
      uitoefening van de voogdij daags nadat de beschikking is verstrekt of verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel281
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel282a
