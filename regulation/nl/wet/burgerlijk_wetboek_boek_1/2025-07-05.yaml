  - number: '380'
    text: |-
      1 De rechter voor wie het verzoek tot ondercuratelestelling aanhangig is of laatstelijk aanhangig was, kan,
      desverzocht of ambtshalve, een provisionele bewindvoerder benoemen; de beschikking vermeldt het tijdstip waarop zij
      in werking treedt.

      2 Hij regelt in deze beschikking de bevoegdheden van de bewindvoerder. Hij kan de bewindvoerder het bewind over
      bepaalde of alle goederen opdragen. Aan de bewindvoerder kan de rechter ook andere bevoegdheden toekennen, doch
      niet die welke een curator niet heeft. Voor zover de rechter niet anders bepaalt, kan degene wiens curatele is
      verzocht, met betrekking tot die goederen niet zonder medewerking van de bewindvoerder daden van beheer en van
      beschikking verrichten, noch overeenkomsten aangaan strekkende tot beschikking over die goederen.

      3 In de beschikking kan tevens worden bepaald dat schulden die degene wiens curatele is verzocht, na de
      bekendmaking van de benoeming maakt, op de onder bewind gestelde goederen gedurende dit bewind en de curatele,
      indien deze volgt, niet kunnen worden verhaald.

      4 De beschikking kan te allen tijde worden gewijzigd of ingetrokken door de rechter voor wie het verzoek tot
      ondercuratelestelling aanhangig is of laatstelijk aanhangig was.

      5 De bewindvoerder heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling van Onze
      Minister van Veiligheid en Justitie zijn vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel380
  - number: '381'
    text: |-
      1 De curatele werkt met ingang van de dag waarop zij is uitgesproken. In het geval, bedoeld in
      [artikel 378, tweede lid][ref1], werkt de curatele met ingang van het tijdstip waarop de onder curatele gestelde
      meerderjarig wordt.

      2 Van deze tijdstippen is de onder curatele gestelde onbekwaam rechtshandelingen te verrichten voor zover de wet
      niet anders bepaalt.

      3 Een onder curatele gestelde is bekwaam rechtshandelingen te verrichten met toestemming van zijn curator, voor
      zover deze bevoegd is die rechtshandelingen voor de onder curatele gestelde te verrichten. De toestemming kan
      slechts worden verleend voor een bepaalde rechtshandeling of voor een bepaald doel. De toestemming voor een bepaald
      doel moet schriftelijk worden verleend.

      4 Met betrekking tot aangelegenheden betreffende verzorging, verpleging, behandeling en begeleiding van een onder
      curatele gestelde zijn de [artikelen 453 en 454 van dit boek][ref2] van overeenkomstige toepassing.

      5 Hij is bekwaam over gelden die zijn curator voor levensonderhoud te zijner beschikking heeft gesteld,
      overeenkomstig deze bestemming te beschikken.

      6 In zaken van curatele is degene wiens curatele het betreft bekwaam in rechte op te treden en tegen een uitspraak
      beroep in te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel378
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel453
