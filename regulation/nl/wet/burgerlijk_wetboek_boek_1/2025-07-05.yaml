  - number: '209'
    text: |-
      Iemands afstamming volgens zijn geboorteakte kan door een ander niet worden betwist, indien hij een staat
      overeenkomstig die akte heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel209
  - number: '210'
    text: Een verzoek tot gegrondverklaring van de inroeping of betwisting van staat is niet aan verjaring onderworpen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel210
  - number: '211'
    text: |-
      1 Een verzoek tot gegrondverklaring van de inroeping van staat kan worden ingediend:

      a. door het kind zelf;

      b. door de erfgenamen van het kind, indien het kind gedurende zijn minderjarigheid of binnen drie jaren nadien
      is overleden.

      2 Indien het kind een verzoek als bedoeld in het eerste lid had ingediend, kunnen zijn erfgenamen de procedure
      voortzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel211
  - number: '212'
    text: |-
      In zaken van afstamming wordt het minderjarige kind, optredende als verzoeker of belanghebbende, vertegenwoordigd
      door een bijzondere curator daartoe benoemd door de rechtbank die over de zaak beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel212
  - number: '227'
    text: |-
      1 Adoptie geschiedt door een uitspraak van de rechtbank op verzoek van twee personen tezamen of op verzoek
      van één persoon alleen. Twee personen tezamen kunnen geen verzoek tot adoptie doen, indien zij krachtens
      [artikel 41][ref1] geen huwelijk zouden mogen aangaan.

      2 Het verzoek door twee personen tezamen kan slechts worden gedaan, indien zij ten minste drie aaneengesloten jaren
      onmiddellijk voorafgaande aan de indiening van het verzoek met elkaar hebben samengeleefd. Het verzoek door de
      adoptant die echtgenoot, geregistreerde partner of andere levensgezel van de ouder is, kan slechts worden gedaan,
      indien hij ten minste drie aaneengesloten jaren onmiddellijk voorafgaande aan de indiening van het verzoek met die
      ouder heeft samengeleefd. De in de tweede zin bedoelde voorwaarde geldt evenwel niet indien het kind is of wordt
      geboren binnen de relatie van de adoptant en die ouder.

      3 Het verzoek kan alleen worden toegewezen, indien de adoptie in het kennelijk belang van het kind is, op het
      tijdstip van het verzoek tot adoptie vaststaat en voor de toekomst redelijkerwijs te voorzien is dat het kind niets
      meer van zijn ouder of ouders in de hoedanigheid van ouder te verwachten heeft, en aan de voorwaarden, genoemd in
      [artikel 228][ref2], wordt voldaan.

      4 Indien het kind is of wordt geboren binnen de relatie van de adoptant en de ouder,
      en het kind door en ten gevolge van kunstmatige donorbevruchting als bedoeld in
      [artikel 1, onder c, van de Wet donorgegevens kunstmatige bevruchting][ref3] is verwekt en een door het College,
      bedoeld in [die wet][ref4], ter bevestiging hiervan afgegeven verklaring wordt overgelegd waaruit blijkt dat de
      identiteit van de donor aan de vrouw bij wie de kunstmatige donorbevruchting heeft plaatsgevonden onbekend is,
      wordt het verzoek toegewezen, tenzij de adoptie kennelijk niet in het belang van het kind is of niet is voldaan aan
      de voorwaarden, genoemd in [artikel 228][ref5].

      5 Zijn de voornamen van het kind niet bekend, dan stelt de rechter, nadat hij de adoptant of adoptanten en het
      kind, indien dat twaalf jaren of ouder is, heeft gehoord, bij de adoptiebeschikking tevens een of meer voornamen
      vast.

      6 In zaken van adoptie is de minderjarige ouder bekwaam in rechte op te treden.


