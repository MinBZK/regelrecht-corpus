  - number: 265c
    text: |-
      1 De duur van de machtiging tot uithuisplaatsing is, behoudens verlenging als bedoeld in het tweede lid, ten
      hoogste een jaar. Indien een minderjarige voorlopig onder toezicht is gesteld en gelijktijdig een machtiging tot
      uithuisplaatsing is verleend, komt de duur hiervan niet in mindering op de termijn van ten hoogste een jaar.

      2 Op verzoek van de gecertificeerde instelling kan de kinderrechter de duur telkens met ten hoogste een jaar
      verlengen. Indien de gecertificeerde instelling niet overgaat tot een verzoek, kan verlenging plaatsvinden op
      verzoek van de raad voor de kinderbescherming of het openbaar ministerie.

      3 Een machtiging vervalt indien deze na verloop van drie maanden niet ten uitvoer is gelegd.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel265c
  - number: 265d
    text: |-
      1 Een uithuisplaatsing kan door de gecertificeerde instelling worden beëindigd indien deze niet langer noodzakelijk
      is in het belang van de verzorging en opvoeding van de minderjarige of tot het verrichten van het onderzoek,
      bedoeld in [artikel 265b, eerste lid][ref1], en het belang van de minderjarige zich tegen beëindiging niet verzet.

      2 De met het gezag belaste ouder, de minderjarige van twaalf jaar of ouder of een ander die de minderjarige als
      behorende tot zijn gezin verzorgt en opvoedt kunnen wegens gewijzigde omstandigheden de gecertificeerde instelling
      verzoeken:

      a. de uithuisplaatsing te beëindigen;

      b. de duur ervan te bekorten;

      c. af te zien van een krachtens de machtiging toegestane wijziging van de verblijfplaats van de minderjarige,
      tenzij de toestemming reeds met toepassing van [artikel 265i][ref2] is verleend.

      3 De gecertificeerde instelling geeft een schriftelijke beslissing binnen twee weken na ontvangst van het verzoek.

      4 Op verzoek van een in het tweede lid genoemde persoon kan de kinderrechter de machtiging geheel of gedeeltelijk
      intrekken of de duur ervan bekorten. [Artikel 264, eerste lid, tweede volzin, tweede tot en met vierde lid][ref3],
      alsmede [artikel 265, vierde lid][ref4], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel265b
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel265i
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel264
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel265
