  - number: '160'
    text: |-
      Een verplichting van een gewezen echtgenoot om uit hoofde van echtscheiding levensonderhoud te verschaffen aan de
      wederpartij, eindigt wanneer deze opnieuw in het huwelijk treedt, een geregistreerd partnerschap aangaat dan wel is
      gaan samenleven met een ander als waren zij gehuwd of als hadden zij hun partnerschap laten registreren.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel160
  - number: '163'
    text: |-
      1 De echtscheiding komt tot stand door de inschrijving van de beschikking in de registers van de burgerlijke stand.

      2 De inschrijving geschiedt op verzoek van partijen of van één van hen.

      3 Indien het verzoek tot inschrijving niet is gedaan uiterlijk zes maanden na de dag waarop de beschikking in
      kracht van gewijsde is gegaan, verliest de beschikking haar kracht.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel163
  - number: '164'
    text: |-
      1 Indien een tussen de echtgenoten bestaande gemeenschap van goederen door één van hen is benadeeld doordat hij
      na de aanvang van het geding of binnen zes maanden daarvóór lichtvaardig schulden heeft gemaakt, goederen der
      gemeenschap heeft verspild, of rechtshandelingen als bedoeld in [artikel 88 van dit boek][ref1] zonder de vereiste
      toestemming of beslissing van de rechtbank heeft verricht, is hij gehouden na de inschrijving van de beschikking
      waarbij de echtscheiding is uitgesproken, de aangerichte schade aan de gemeenschap te vergoeden.

      2 Een op het vorige lid gegronde rechtsvordering kan niet later worden ingesteld dan drie jaren na de inschrijving
      van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel88
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '88'
  - number: '165'
    text: |-
      1 Op verzoek van een echtgenoot kan de rechter bij de echtscheidingsbeschikking of bij latere uitspraak bepalen
      dat, als die echtgenoot ten tijde van de inschrijving van de beschikking een woning bewoont die aan de andere
      echtgenoot uitsluitend of mede toebehoort of ten gebruike toekomt, hij jegens de andere echtgenoot bevoegd is de
      bewoning en het gebruik van de bij de woning en tot de inboedel daarvan behorende zaken gedurende zes maanden na de
      inschrijving van de beschikking tegen een redelijke vergoeding voort te zetten.

      2 Tegen hem kan een in dat tijdvak zonder zijn toestemming door de andere echtgenoot verrichte rechtshandeling niet
      worden tegengeworpen ten nadele van zijn in het vorige lid omschreven bevoegdheid.

      3 Weigert hij zijn toestemming of is hij niet in staat zijn wil te verklaren, dan kan de rechtbank die in eerste
      aanleg over het verzoek tot echtscheiding heeft beslist, op verzoek van de andere gewezen echtgenoot, bepalen dat
      het vorige lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel165
  - number: '166'
    text: |-
      Indien de gescheiden echtgenoten met elkander hertrouwen of een geregistreerd partnerschap aangaan, herleven
      alle gevolgen van het huwelijk van rechtswege, alsof er geen echtscheiding had plaats gehad. Nochtans wordt
      de geldigheid van rechtshandelingen die tussen de ontbinding van het huwelijk en het nieuwe huwelijk of het
      geregistreerd partnerschap zijn verricht, beoordeeld naar het tijdstip der handeling.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel166
  - number: '169'
    text: |-
      1 Scheiding van tafel en bed kan worden verzocht op dezelfde grond en op dezelfde wijze als echtscheiding.

      2 De [artikelen 151][ref1], [154 tot en met 159a][ref2] zijn van overeenkomstige toepassing, met dien verstande
      dat de termijnen, bedoeld in [artikel 156, derde lid][ref3], en [artikel 157, eerste tot en met vijfde lid][ref4],
      aanvangen op de dag waarop de beschikking tot scheiding van tafel en bed is ingeschreven in het
      huwelijksgoederenregister, aangewezen in [artikel 116][ref5], en dat de duur van het huwelijk wordt berekend tot
      die dag.

      3 Een verplichting van een echtgenoot om uit hoofde van scheiding van tafel en bed levensonderhoud te verschaffen
      aan de andere echtgenoot, eindigt bij ontbinding van het huwelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel154
