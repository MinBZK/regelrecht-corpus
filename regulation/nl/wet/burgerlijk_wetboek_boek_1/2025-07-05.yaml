  - number: '421'
    text: |-
      Hetgeen in de vorige drie artikelen is bepaald omtrent erfgenamen, die goederen uit de nalatenschap ontvangen, is
      van overeenkomstige toepassing op de echtgenoot of geregistreerde partner, die goederen ontvangt ten gevolge van
      de ontbinding van enige gemeenschap van goederen of de afrekening uit hoofde van een verrekenbeding. Voor het uit
      dezen hoofde ontvangene behoeft echter geen zekerheid te worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel421
  - number: '422'
    text: |-
      1 Wanneer de vermiste terugkeert, of wanneer blijkt dat de dag van overlijden in de akte van overlijden onjuist
      is vermeld, is ieder die enige goederen van de vermiste ingevolge de vorige artikelen in zijn bezit of onder zijn
      bewind heeft, aan de teruggekeerde of aan hen die alsdan blijken tot de goederen gerechtigd te zijn, rekening,
      verantwoording en afgifte schuldig.

      2 Rechten door derden te goeder trouw verkregen worden geëerbiedigd. In geval echter goederen om niet zijn
      vervreemd, kan de rechter aan de rechthebbenden, en ten laste van hem die daardoor voordeel heeft genoten, een naar
      billijkheid te bepalen vergoeding toekennen.

      3 Is het leven van de vermiste ten behoeve van derden verzekerd geweest, dan behouden dezen hun recht op hetgeen
      aan hen op het tijdstip van de terugkeer van de verzekerde is uitbetaald of als reeds opeisbaar was verschuldigd;
      in dat geval kunnen aan de verzekering geen andere rechten op de uitkering worden ontleend.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel422
  - number: '423'
    text: |-
      1 Indien binnen vijf jaar na de dag waarop de akte van overlijden overeenkomstig [artikel 417 van dit boek][ref1]
      is opgemaakt, wordt bewezen dat deze akte onjuist is, zijn zij die te goeder trouw de vruchten van de nalatenschap
      hebben genoten, slechts verplicht daarvan de helft terug te geven; wordt de onjuistheid later bewezen, dan behoeven
      zij geen vruchten terug te geven.

      2 Indien eerst meer dan tien jaar na de dag waarop de akte is opgemaakt, wordt bewezen dat de akte onjuist is, zijn
      zij die de goederen te goeder trouw in bezit hebben genomen, slechts verplicht de alsdan nog aanwezige goederen
      in de staat waarin zij zich bevinden, af te geven, benevens de prijs van de vervreemde goederen of de goederen die
      daarvoor in de plaats zijn getreden; alles zonder enige vruchten of vergoeding voor niet meer aanwezige goederen en
      zonder verplichting van rekening en verantwoording.

      3 Iedere verbintenis tot teruggave vervalt, wanneer twintig jaar na de dag waarop de akte is opgemaakt, zijn
      verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel417
