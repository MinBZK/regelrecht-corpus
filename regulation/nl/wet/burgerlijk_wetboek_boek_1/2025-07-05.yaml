  - number: '142'
    text: |-
      1 Als tijdstip waarop de samenstelling en de omvang van het te verrekenen vermogen worden bepaald, geldt:

      a. in geval van het eindigen van het huwelijk of het geregistreerd partnerschap door overlijden: het tijdstip van
      overlijden;

      b. in geval van beëindiging van het huwelijk door echtscheiding: het tijdstip van indiening van het verzoek tot
      echtscheiding;

      c. in geval van scheiding van tafel en bed: het tijdstip van indiening van het verzoek tot scheiding van tafel
      en bed;

      d. in geval van opheffing van de wederzijdse verplichting tot verrekening als bedoeld in [artikel 139][ref1]: het
      tijdstip van indiening van het verzoek tot opheffing van die verplichting;

      e. in geval van beëindiging van het geregistreerd partnerschap met wederzijds goedvinden: het tijdstip waarop de
      overeenkomst tot beëindiging wordt gesloten;

      f. in geval van ontbinding van het geregistreerd partnerschap op verzoek: het tijdstip van indiening van het
      verzoek;

      g. in geval van vermissing en een daarop gevolgd huwelijk of geregistreerd partnerschap: het tijdstip waarop de
      beschikking, bedoeld in [artikel 417][ref2], eerste lid, in kracht van gewijsde is gegaan;

      h. in geval van opheffing van de wederzijdse verplichting tot verrekening bij huwelijkse voorwaarden: het tijdstip,
      bedoeld in [artikel 120, eerste lid][ref3].

      2 Van het eerste lid, aanhef en onder b tot en met f, kan bij op schrift gestelde overeenkomst worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel417
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel120
