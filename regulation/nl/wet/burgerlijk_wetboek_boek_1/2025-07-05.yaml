  - number: 253p
    text: |-
      1 In de gevallen waarin door de rechter het gezag wordt opgedragen aan beide ouders of aan een ouder alleen, neemt
      dit een aanvang zodra de desbetreffende beschikking in kracht van gewijsde is gegaan, of, indien zij uitvoerbaar
      bij voorraad is verklaard, daags nadat de beschikking is verstrekt of verzonden.

      2 Na de gerechtelijke ontbinding van het huwelijk of van het geregistreerd partnerschap of na scheiding van
      tafel en bed begint het gezag nochtans niet voordat de beschikking houdende ontbinding van het huwelijk of
      van het geregistreerd partnerschap is ingeschreven in de registers van de burgerlijke stand of voordat de
      beschikking houdende scheiding van tafel en bed is ingeschreven in het huwelijksgoederenregister, aangewezen in
      [artikel 116][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
