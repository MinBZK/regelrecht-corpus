  - number: '442'
    text: |-
      1 Heeft iemand als bewindvoerder een rechtshandeling verricht, dan richten de rechten en verplichtingen van de
      wederpartij zich naar hetgeen dienaangaande is bepaald in [titel 3 van Boek 3][ref1]. Regels die de bevoegdheid van
      een bewindvoerder betreffen en feiten die voor een oordeel omtrent zijn bevoegdheid van belang zijn, kunnen niet
      aan de wederpartij worden tegengeworpen, indien deze daarmee niet bekend was of had behoren te zijn.

      2 De rechthebbende is, onverminderd het bepaalde in [artikel 172 van Boek 6][ref2], aansprakelijk voor alle
      schulden die voortspruiten uit rechtshandelingen die de bewindvoerder in zijn hoedanigheid in naam van de
      rechthebbende verricht. Wanneer hij onder bewind staande goederen aanwijst die voor de schuld voldoende verhaal
      bieden, is hij niet verplicht de schuld ten laste van zijn overige vermogen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel172
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel442
    references:
