  - number: 253aa
    text: |-
      1 Gedurende hun geregistreerd partnerschap oefenen de ouders het gezag gezamenlijk uit.

      2 De bepalingen met betrekking tot het gezamenlijk gezag van gehuwde en gehuwd geweest zijnde ouders zijn van
      overeenkomstige toepassing, met uitzondering van het omtrent scheiding van tafel en bed en ontbinding van het
      huwelijk na scheiding van tafel en bed bepaalde. Na ontbinding van het geregistreerd partnerschap als bedoeld
      in [artikel 80c, eerste lid, onderdeel d][ref1], blijven de ouders die gezamenlijk het gezag hebben, dit gezag
      gezamenlijk uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel253aa
