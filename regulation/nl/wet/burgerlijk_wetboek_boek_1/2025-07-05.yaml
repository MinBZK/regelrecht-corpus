        bwb_id: BWBR0002656
        afdeling: '4'
  - number: '327'
    text: |-
      De rechtbank kan de voogdij van een natuurlijk persoon beëindigen indien:

      a. een minderjarige zodanig opgroeit dat hij in zijn ontwikkeling ernstig wordt bedreigd, en de voogd niet de
      verantwoordelijkheid voor de verzorging en opvoeding, bedoeld in [artikel 247, tweede lid][ref1], in staat is te
      dragen binnen een voor de persoon en de ontwikkeling van de minderjarige aanvaardbaar te achten termijn, of

      b. de voogd het gezag misbruikt , of

      c. niet beschikt over de ingevolge [artikel 2 van de Wet opneming buitenlandse kinderen ter adoptie][ref2] vereiste
      beginseltoestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247
      [ref2]: https://wetten.overheid.nl/BWBR0004447#Artikel2
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel327
