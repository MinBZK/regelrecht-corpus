  - number: '396'
    text: |-
      1 De verplichting van behuwdkinderen en van schoonouders tot het verstrekken van onderhoud vervalt, wanneer het
      huwelijk van het behuwdkind is ontbonden.

      2 De verplichting bestaat niet jegens een behuwdkind, dat is gescheiden van tafel en bed en jegens een schoonouder,
      nadat deze is hertrouwd.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel396
  - number: '397'
    text: |-
      1 Bij de bepaling van het volgens de wet door bloed- en aanverwanten verschuldigde bedrag voor levensonderhoud
      wordt enerzijds rekening gehouden met de behoeften van de tot onderhoud gerechtigde en anderzijds met de
      draagkracht van de tot uitkering verplichte persoon.

      2 Zijn meerdere bloed- of aanverwanten tot het verstrekken van levensonderhoud aan dezelfde persoon verplicht,
      dan is ieder van hen gehouden een deel van het bedrag te voldoen, dat de tot onderhoud gerechtigde behoeft. Bij
      de bepaling van dit deel wordt rekening gehouden met ieders draagkracht en de verhouding, waarin een ieder tot de
      gerechtigde staat.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel397
  - number: '398'
    text: |-
      1 Wanneer hij die tot levensonderhoud verplicht is, buiten staat is het daartoe vereiste geld op te brengen, kan de
      rechtbank bevelen, dat hij de bloed- of aanverwant, aan wie hij levensonderhoud verschuldigd is, bij zich in huis
      zal nemen en aldaar van het nodige voorzien.

      2 Ouders zijn steeds bevoegd de rechter te verzoeken hun toe te staan zich van hun onderhoudsplicht jegens hun
      behoeftig meerderjarig kind op de in het eerste lid omschreven wijze te kwijten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel398
  - number: '399'
    text: |-
      De rechter kan de verplichting van bloed- en aanverwanten tot levensonderhoud matigen op grond van zodanige
      gedragingen van de tot onderhoud gerechtigde, dat verstrekking van levensonderhoud naar redelijkheid niet of niet
      ten volle kan worden gevergd; onverminderd hetgeen in de volgende afdeling is bepaald omtrent de voorziening in de
      kosten van de verzorging en opvoeding van minderjarige kinderen en stiefkinderen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel399
  - number: '400'
    text: |-
      1 Indien een persoon verplicht is levensonderhoud te verstrekken aan twee of meer personen en zijn draagkracht
      onvoldoende is om dit volledig aan allen te verschaffen, hebben zijn kinderen en stiefkinderen die de leeftijd
      van een en twintig jaren nog niet hebben bereikt voorrang boven alle andere onderhoudsgerechtigden en hebben zijn
      echtgenoot, zijn vroegere echtgenoot, zijn geregistreerde partner, zijn vroegere geregistreerde partner, zijn
      ouders en zijn kinderen en stiefkinderen die de leeftijd van een en twintig jaren hebben bereikt voorrang boven
      zijn behuwdkinderen en zijn schoonouders.

      2 Overeenkomsten waarbij van het volgens de wet verschuldigde levensonderhoud wordt afgezien, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel400
  - number: '401'
    text: |-
      1 Een rechterlijke uitspraak of een overeenkomst betreffende levensonderhoud kan bij latere rechterlijke uitspraak
      worden gewijzigd of ingetrokken, wanneer zij nadien door wijziging van omstandigheden ophoudt aan de wettelijke
      maatstaven te voldoen. De voorgaande zin is niet van toepassing op een verzoek tot wijziging van een termijn die de
      rechter heeft vastgesteld op grond van [artikel 156, derde lid][ref1], of [artikel 157, zevende lid][ref2], of die
      is opgenomen in een overeenkomst als bedoeld in [artikel 158][ref3].

      2 De termijn die de rechter heeft vastgesteld op grond van [artikel 156, derde lid][ref4], of
      [artikel 157, zevende lid][ref5], of die is opgenomen in een overeenkomst als bedoeld in [artikel 158][ref6],
      kan op verzoek van een van de gewezen echtgenoten of gewezen geregistreerde partners worden gewijzigd in geval
      van zo ingrijpende wijziging van omstandigheden dat ongewijzigde handhaving van de termijn naar maatstaven van
      redelijkheid en billijkheid niet van de verzoeker kan worden gevergd.

      Verlenging is niet mogelijk indien de rechter zulks ingevolge [artikel 157, zevende lid][ref7], heeft bepaald.
      Op een verzoek tot verlenging is [artikel 157, zevende lid, tweede en derde zin][ref8], van overeenkomstige
      toepassing.

      3 Partijen kunnen schriftelijk overeenkomen dat het eerste lid, eerste zin, van toepassing is op een verzoek tot
      wijziging van een termijn die is opgenomen in een overeenkomst als bedoeld in [artikel 158][ref9].

      4 Een rechterlijke uitspraak betreffende levensonderhoud kan ook worden gewijzigd of ingetrokken, indien zij van de
      aanvang af niet aan de wettelijke maatstaven heeft beantwoord doordat bij die uitspraak van onjuiste of onvolledige
      gegevens is uitgegaan.

      5 Een overeenkomst betreffende levensonderhoud kan ook worden gewijzigd of ingetrokken, indien zij is aangegaan met
      grove miskenning van de wettelijke maatstaven.


