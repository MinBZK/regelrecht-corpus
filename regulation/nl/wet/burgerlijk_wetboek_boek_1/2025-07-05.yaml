        artikel: '8'
  - number: 25a
    text: |-
      1 Indien na de inschrijving kennelijke misslagen in de buiten Nederland opgemaakte akte overeenkomstig de
      plaatselijke voorschriften door een bevoegde instantie zijn verbeterd, wordt de verbetering in de akte van
      inschrijving aangebracht doordat de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage, aan wie een
      afschrift van de beslissing tot verbetering en een afschrift van de verbeterde akte zijn overgelegd, een latere
      vermelding van de verbetering aan de akte van inschrijving toevoegt.

      2 Kennelijke schrijf- en spelfouten, die in de buiten Nederland opgemaakte akte overeenkomstig de plaatselijke
      voorschriften door een bevoegde instantie zijn verbeterd, kunnen ambtshalve door de ambtenaar van de burgerlijke
      stand van de gemeente 's-Gravenhage aan de hand van een afschrift van de verbeterde akte worden verbeterd op de in
      het eerste lid aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel25a
  - number: 25b
    text: |-
      Aan de akte van inschrijving, bedoeld in [artikel 25][ref1], worden de latere vermeldingen toegevoegd die op grond
      van dit boek aan een in Nederland opgemaakte akte van geboorte, huwelijksakte of akte van overlijden moeten worden
      toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '25'
        afdeling: '10'
  - number: 25c
    text: |-
      1 Indien ten aanzien van een buiten Nederland geboren persoon geen akte van geboorte overeenkomstig de plaatselijke
      voorschriften door een bevoegde instantie is opgemaakt of kan worden overgelegd, kan op verzoek van het openbaar
      ministerie, van een belanghebbende of van de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage de
      rechtbank Den Haag de voor het opmaken van een geboorteakte noodzakelijke gegevens vaststellen, indien:

      a. die persoon Nederlander is of te eniger tijd Nederlander dan wel Nederlands onderdaan niet-Nederlander is
      geweest;

      b. die persoon rechtmatig verblijft op grond van [artikel 8, onder c en d, van de Vreemdelingenwet 2000][ref1];

      c. op grond van dit boek een latere vermelding aan de akte van geboorte moet worden toegevoegd.

      2 De rechtbank houdt rekening met alle bewijzen en aanwijzingen omtrent de omstandigheden waaronder, en het
      tijdstip waarop de geboorte moet hebben plaatsgehad. De geslachtsnaam, de voornamen, alsmede de plaats en de dag
      van de geboorte van de vader en van de moeder worden vastgesteld, voor zover daarvoor aanwijzingen zijn verkregen.

      3 In geval van adoptie geeft de rechtbank die de adoptie uitspreekt, ambtshalve afzonderlijk de in het eerste lid
      bedoelde beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 25d
    text: |-
      De rechtbank Den Haag kan op verzoek van het openbaar ministerie, van een belanghebbende of van de ambtenaar van
      de burgerlijke stand van de gemeente 's-Gravenhage de krachtens [artikel 25c][ref1] gegeven beschikking wijzigen op
      grond dat de vastgestelde gegevens onjuist of onvolledig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel25d
