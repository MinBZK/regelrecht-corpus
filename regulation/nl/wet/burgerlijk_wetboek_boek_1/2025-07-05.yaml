        artikel: '13'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '264'
        afdeling: '4'
  - number: 262b
    text: |-
      Geschillen die de uitvoering van de ondertoezichtstelling betreffen, die omtrent gedragingen als bedoeld
      in [artikel 4.2.1 van de Jeugdwet][ref1], uitgezonderd, kunnen aan de kinderrechter worden voorgelegd. De
      kinderrechter neemt op verzoek van een met het gezag belaste ouder, de minderjarige van twaalf jaar of ouder,
      de gecertificeerde instelling, degene die de minderjarige als behorende tot zijn gezin verzorgt en opvoedt, of
      de zorgaanbieder of de aanbieder van de jeugdhulp als bedoeld in [artikel 1.1 van de Jeugdwet][ref2], waar de
      minderjarige is geplaatst, een zodanige beslissing als hem in het belang van de minderjarige wenselijk voorkomt.
      Hij beproeft alvorens te beslissen een vergelijk tussen de betrokkenen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
