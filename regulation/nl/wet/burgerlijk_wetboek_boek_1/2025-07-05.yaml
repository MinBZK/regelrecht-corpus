      1 Het gezamenlijk gezag, bedoeld in de [artikelen 253sa][ref1] en [253t][ref2], eindigt op de dag waarop in kracht
      van gewijsde is gegaan de beschikking waarbij aan de ouders gezamenlijk gezag is toegekend of het gezamenlijk gezag
      van de ouder en de ander is beëindigd.

      2 Is de beschikking, bedoeld in het eerste lid, uitvoerbaar bij voorraad verklaard, dan eindigt het gezamenlijk
      gezag van de ouder en de ander daags nadat de beschikking is verstrekt of verzonden.


