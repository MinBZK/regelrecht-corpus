  - number: '205'
    text: |-
      1 Een verzoek tot vernietiging van de erkenning kan, op de grond dat de erkenner niet de biologische vader van het
      kind is, bij de rechtbank worden ingediend:

      a. door het kind zelf, tenzij de erkenning tijdens zijn meerderjarigheid heeft plaatsgevonden;

      b. door de erkenner, indien hij door bedreiging, dwaling, bedrog of, tijdens zijn minderjarigheid, door misbruik
      van omstandigheden daartoe is bewogen;

      c. door de moeder, indien zij door bedreiging, dwaling, bedrog, of tijdens haar minderjarigheid, door misbruik van
      omstandigheden bewogen is toestemming tot de erkenning te geven.

      2 Het openbaar ministerie kan wegens strijd met de Nederlandse openbare orde, indien de erkenner niet de
      biologische vader van het kind is, vernietiging van de erkenning verzoeken.

      3 In geval van bedreiging of misbruik van omstandigheden, wordt het verzoek door de erkenner of door de moeder
      niet later ingediend dan een jaar nadat deze invloed heeft opgehouden te werken en, in geval van bedrog of dwaling,
      binnen een jaar nadat de verzoeker het bedrog of de dwaling heeft ontdekt.

      4 Het verzoek wordt door het kind ingediend binnen drie jaren nadat het kind bekend is geworden met het feit dat
      de man vermoedelijk niet zijn biologische vader is. Indien het kind evenwel gedurende zijn minderjarigheid bekend
      is geworden met dit feit kan het verzoek tot uiterlijk drie jaren nadat het kind meerderjarig is geworden, worden
      ingediend.

      5 Voor het geval de erkenner of de moeder overlijdt voor de afloop van de in het derde lid gestelde termijn, is
      [artikel 201, eerste lid][ref1], van overeenkomstige toepassing. Voor het geval het kind overlijdt voor de afloop
      van de in het vierde lid gestelde termijn, is [artikel 201, tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel201
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel201
