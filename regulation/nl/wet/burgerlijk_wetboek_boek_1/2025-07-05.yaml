  - number: 265f
    text: |-
      1 Voor zover noodzakelijk in verband met de uithuisplaatsing van de minderjarige, kan de gecertificeerde instelling
      voor de duur daarvan de contacten tussen een met het gezag belaste ouder en de minderjarige beperken.

      2 De beslissing van de gecertificeerde instelling geldt als een schriftelijke aanwijzing. [Artikel 264][ref1]
      en [artikel 265][ref2] zijn van overeenkomstige toepassing, met dien verstande dat de kinderrechter een zodanige
      regeling kan vaststellen als hem in het belang van de minderjarige wenselijk voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel264
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel265
