    text: |-
      Het huwelijk eindigt:

      a. door de dood;

      b. indien degene ten aanzien van wie overeenkomstig de bepalingen van de tweede afdeling van de achttiende
      titel van dit boek de vermissing is vastgesteld, dan wel overeenkomstig de bepalingen van de derde afdeling
      van de [achttiende titel][ref1] van dit boek het overlijden is vastgesteld, nog in leven is op de dag waarop de
      achtergebleven echtgenoot een nieuw huwelijk of geregistreerd partnerschap is aangegaan: door de voltrekking van
      dit huwelijk of geregistreerd partnerschap;

      c. door echtscheiding, overeenkomstig de bepalingen van de [tweede afdeling][ref2] van deze titel;

      d. door ontbinding van het huwelijk na scheiding van tafel en bed, overeenkomstig de bepalingen van de
      [tweede afdeling van de tiende titel van dit boek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
