        artikel: '426'
        afdeling: '3'
  - number: '429'
    text: |-
      De griffier van het college waarvoor de zaak laatstelijk aanhangig was, zendt een afschrift van de beschikking,
      zodra deze in kracht van gewijsde is gegaan, aan de ambtenaar van de burgerlijke stand van de gemeente 's-
      Gravenhage. Deze maakt van de beschikking een akte van inschrijving op, die hij in het register van overlijden
      opneemt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel429
  - number: '430'
    text: |-
      1 De akten, opgemaakt volgens [artikel 429][ref1], gelden als akten van overlijden in de zin van
      [artikel 19f, eerste lid][ref2].

      2 De [artikelen 422][ref3], [423][ref4] en [425][ref5] zijn van overeenkomstige toepassing, indien een persoon die
      met toepassing van [artikel 426][ref6] overleden is verklaard terugkeert alsmede indien bewezen wordt dat de dag
      van overlijden in de in [artikel 429][ref7] bedoelde akte onjuist is vermeld.


