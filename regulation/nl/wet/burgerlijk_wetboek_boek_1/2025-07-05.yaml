  - number: 25f
    text: |-
      1 De griffier van het college waarvoor de zaak laatstelijk aanhangig was, zendt niet eerder dan drie maanden na
      de dag van de beschikking een afschrift daarvan, aan de ambtenaar van de burgerlijke stand van de gemeente 's-
      Gravenhage.

      2 Deze ambtenaar maakt van de beschikking, bedoeld in [artikel 25c][ref1] een akte van inschrijving op, die geldt
      als een akte van geboorte in de zin van [artikel 19][ref2] van dit boek. Deze akte is in overeenstemming met de
      beschikking en vermeldt dit uitdrukkelijk.

      3 Van de beschikking, bedoeld in [artikel 25d][ref3], wordt een latere vermelding toegevoegd aan de akte als
      bedoeld in het vorige lid.


