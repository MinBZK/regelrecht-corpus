        artikel: '453'
  - number: '459'
    text: |-
      1 De mentor doet desgevraagd van zijn werkzaamheden verslag aan de kantonrechter. De kantonrechter kan te allen
      tijde verschijning van de mentor in persoon gelasten. Deze is verplicht alle door de kantonrechter gewenste
      inlichtingen te verstrekken.

      2 De mentor, bedoeld in [artikel 452, zevende lid][ref1], legt jaarlijks de verklaring en het verslag over, bedoeld
      in artikel 452, achtste lid, onderdelen a en b. De mentor legt tweejaarlijks de verklaring over, bedoeld in artikel
      452, achtste lid, onderdeel c. De kantonrechter kan ten aanzien van de verschillende onderdelen van het verslag een
      ander tijdstip van overlegging bepalen.

      3 De mentor doet telkens na verloop van vijf jaren, of zo veel eerder als de kantonrechter bepaalt, aan deze
      verslag van het verloop van het mentorschap. Hij laat zich daarbij met name uit over de vraag of het mentorschap
      dient voort te duren dan wel of een minder ver, of een verder strekkende voorziening aangewezen is. Feiten die voor
      het mentorschap en het voortduren daarvan van betekenis zijn, deelt hij terstond aan de kantonrechter mede.

      4 Aan het einde van zijn mentorschap doet de mentor van zijn werkzaamheden schriftelijk verslag aan zijn opvolger,
      aan de kantonrechter alsmede aan de betrokkene, indien het mentorschap door het verstrijken van de tijdsduur
      waarvoor het is ingesteld of door opheffing eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel452
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel459
    references:
      - id: ref1
