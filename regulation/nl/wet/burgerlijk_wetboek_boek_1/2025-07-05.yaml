  - number: '10'
    text: |-
      1 De woonplaats van een natuurlijk persoon bevindt zich te zijner woonstede, en bij gebreke van woonstede ter
      plaatse van zijn werkelijk verblijf.

      2 Een rechtspersoon heeft zijn woonplaats ter plaatse waar hij volgens wettelijk voorschrift of volgens zijn
      statuten of reglementen zijn zetel heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel10
  - number: '11'
    text: |-
      1 Een natuurlijk persoon verliest zijn woonstede door daden, waaruit zijn wil blijkt om haar prijs te geven.

      2 Een natuurlijk persoon wordt vermoed zijn woonstede te hebben verplaatst, wanneer hij daarvan op de wettelijk
      voorgeschreven wijze aan de betrokken colleges van burgemeester en wethouders heeft kennis gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel11
  - number: '12'
    text: |-
      1 Een minderjarige volgt de woonplaats van hem die het gezag over hem uitoefent, de onder curatele gestelde die van
      zijn curator. Oefenen beide ouders tezamen het gezag over hun minderjarige kind uit, doch hebben zij niet dezelfde
      woonplaats, dan volgt het kind de woonplaats van de ouder bij wie het feitelijk verblijft dan wel laatstelijk heeft
      verbleven.

      2 Wanneer iemands goederen onder bewind staan, volgt hij voor alles wat de uitoefening van dit bewind betreft, de
      woonplaats van de bewindvoerder.

      3 Wanneer ten behoeve van een persoon een mentorschap is ingesteld, volgt hij voor alles wat de uitoefening van dit
      mentorschap betreft, de woonplaats van de mentor.

      4 Het eerste, tweede en derde lid zijn niet van toepassing voor zover het betreft de relatieve bevoegdheid van
      de rechter gedurende een curatele, een bewind als bedoeld in [titel 19][ref1] en een mentorschap. Hetzelfde geldt
      indien ten aanzien van een persoon een curatele, een mentorschap of een bewind als bedoeld in [titel 19][ref2]
      en tevens een bewind als bedoeld in [afdeling 7 van titel 5 van Boek 4][ref3] of een bewind als bedoeld in
      [artikel 182 van Boek 7][ref4] van kracht zijn en de bevoegde kantonrechter de andere kantonrechter als uitsluitend
      bevoegde heeft aangewezen.

      5 Wanneer de persoon, van wie de woonplaats wordt afgeleid, overlijdt of zijn gezag of zijn hoedanigheid verliest,
      duurt de afgeleide woonplaats voort, totdat een nieuwe woonplaats is verkregen.


