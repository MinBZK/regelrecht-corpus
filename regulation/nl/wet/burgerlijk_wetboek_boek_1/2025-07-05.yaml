  - number: '50'
    text: |-
      Een huwelijk kan worden gestuit, wanneer partijen niet de vereisten in zich verenigen om een huwelijk aan te gaan,
      of wanneer partijen niet beiden hun vrije toestemming tot het huwelijk zullen geven dan wel wanneer het oogmerk
      van de aanstaande echtgenoten, of één hunner, niet is gericht op de vervulling van de door de wet aan de huwelijkse
      staat verbonden plichten, doch op het verkrijgen van toelating tot Nederland.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel50
  - number: '51'
    text: |-
      1 Bevoegd tot stuiting, wanneer partijen niet de vereisten in zich verenigen om een huwelijk aan te gaan, zijn
      bloedverwanten in de rechte lijn, broeders, zusters en curatoren van een der aanstaande echtgenoten.

      2 De in het vorige lid genoemde personen zijn ook bevoegd een huwelijk te stuiten, wanneer de andere aanstaande
      echtgenoot onder curatele staat, en het huwelijk klaarblijkelijk het ongeluk zou veroorzaken van de partij, waarvan
      zij bloedverwant of curator zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel51
  - number: '52'
    text: |-
      Hij die met een der partijen door huwelijk verbonden is dan wel met een der partijen een geregistreerd partnerschap
      is aangegaan, kan op grond van het bestaan van dat huwelijk of dat geregistreerd partnerschap een nieuw aan te gaan
      huwelijk stuiten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel52
  - number: '53'
    text: |-
      1 Het openbaar ministerie is verplicht een voorgenomen huwelijk te stuiten, indien het met een der in de
      [artikelen 31 tot en met 33][ref1], [41][ref2] en [42][ref3] omschreven huwelijksbeletselen bekend is.

      2 Het openbaar ministerie is bevoegd het huwelijk als schijnhandeling wegens strijd met de Nederlandse openbare
      orde te stuiten indien het oogmerk van de aanstaande echtgenoten, of één hunner, niet is gericht op de vervulling
      van de door de wet aan de huwelijkse staat verbonden plichten, doch op het verkrijgen van toelating tot Nederland.

      3 Het openbaar ministerie is voorts bevoegd het huwelijk te stuiten indien genoegzaam is gebleken dat de aanstaande
      echtgenoten, of één hunner, het huwelijk onder invloed van dwang zullen aangaan.

      4 Voor de uitoefening van de in de leden 2 en 3 bedoelde bevoegdheid door het openbaar ministerie is voorafgaande
      machtiging van de rechtbank vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel42
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel53
