        paragraaf: '1'
        afdeling: '6'
  - number: 299a
    text: |-
      1 Degene die met instemming van de voogd een minderjarige in zijn gezin - anders dan uit hoofde van een
      ondertoezichtstelling of een plaatsing onder voorlopige voogdij - ten minste een jaar heeft verzorgd en opgevoed,
      kan de kinderrechter verzoeken hem, dan wel een rechtspersoon als bedoeld in [artikel 302 van dit boek][ref1], tot
      voogd te benoemen.

      2 Indien de minderjarige door meer dan een persoon als behorende tot het gezin wordt verzorgd en opgevoed, kan het
      verzoek slechts door dezen gemeenschappelijk worden gedaan.

      3 Het verzoek kan ook worden gedaan door de raad voor de kinderbescherming.

      4 De kinderrechter willigt het verzoek slechts in, indien hij dit in het belang van de minderjarige acht en hem
      genoegzaam is gebleken, dat de voogd niet bereid is zich van zijn bediening te doen ontslaan. Alsdan benoemt hij
      bij voorkeur degene wiens benoeming wordt verzocht tot voogd, mits deze bevoegd is tot uitoefening van de voogdij.

      5 Is het bij het eerste lid bedoelde verzoek gedaan, dan blijft het [tweede lid van artikel 336][ref2] buiten
      toepassing, totdat op het verzoek bij gewijsde is beslist.

      6 In geval van gezamenlijke uitoefening van de voogdij wordt de in het eerste lid bedoelde instemming door beide
      voogden gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel336a
