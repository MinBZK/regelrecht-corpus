      1 Is aan een derde niet kenbaar wie van de echtgenoten bevoegd is tot het bestuur over een roerende zaak die geen
      registergoed is, of een recht aan toonder, dan mag hij de echtgenoot die de zaak of het papier aan toonder onder
      zich heeft, bevoegd achten.

      2 De echtgenoot die ten gevolge van een rechtshandeling van de andere echtgenoot door een derde te goeder trouw
      in het bestuur van een goed is gestoord, verliest het recht tot beëindiging van de stoornis, indien hij zich tegen
      de stoornis niet heeft verzet binnen een redelijke termijn nadat zij te zijner kennis is gekomen. De bevoegdheid
      van de echtgenoot tot beëindiging van de stoornis vervalt eveneens indien de derde hem een redelijke termijn heeft
      gesteld ter uitoefening van die bevoegdheid en hij daarvan geen gebruik heeft gemaakt.

      3 Aan een derde kan niet worden tegengeworpen dat een vordering tot vergoeding welke tijdens het huwelijk is
      ontstaan wegens vermogensverschuiving tussen de echtgenoten onderling of tussen een der echtgenoten en een tussen
      hen bestaande gemeenschap, niet opeisbaar is.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel92
