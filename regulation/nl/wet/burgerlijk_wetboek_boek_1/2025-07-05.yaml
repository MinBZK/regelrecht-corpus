  - number: '274'
    text: |-
      1 Indien de ouders gezamenlijk het gezag uitoefenen, wordt na de beëindiging van het gezag van een van hen voortaan
      het gezag door de andere ouder alleen uitgeoefend.

      2 In geval van beëindiging van het gezag van een ouder, die het gezag alleen uitoefent, kan de andere ouder de
      rechtbank te allen tijde verzoeken met de uitoefening van het gezag te worden belast. Dit verzoek wordt ingewilligd
      indien de rechtbank dit in het belang van de minderjarige noodzakelijk oordeelt.

      3 De rechtbank die het verzoek bedoeld bij het vorige lid heeft afgewezen, kan deze beschikking steeds wijzigen.
      Zij doet dit echter slechts op verzoek van de betrokken ouder, en niet dan op grond van omstandigheden, waarmede de
      rechter bij het geven van de beschikking geen rekening heeft kunnen houden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel274
  - number: '275'
    text: |-
      1 Indien de andere ouder het gezag niet voortaan alleen uitoefent, benoemt de rechtbank een voogd over de
      minderjarigen.

      2 Ieder die tot uitoefening van de voogdij bevoegd is, kan tijdens het onderzoek schriftelijk aan de rechtbank
      verzoeken met de voogdij te worden belast.

      3 In geval van beëindiging van het gezag op verzoek van de pleegouders benoemt de rechtbank bij voorkeur tot voogd
      degenen, dan wel degene, die op het tijdstip van het verzoek de minderjarige ten minste een jaar als behorende tot
      hun gezin hebben verzorgd en opgevoed, mits dezen bevoegd zijn tot de voogdij.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel275
  - number: '276'
    text: |-
      1 Indien de ouder wiens gezag is beëindigd het bewind over het vermogen van zijn kinderen voerde, wordt hij tevens
      veroordeeld tot het afleggen van rekening en verantwoording aan zijn opvolger in dit bewind.

      2 Hebben de kinderen goederen gemeen, maar komen zij onder het gezag van verschillende personen, dan kan de
      rechtbank een van dezen of een derde aanwijzen om over deze goederen tot de verdeling het bewind te voeren. De
      aangewezen bewindvoerder stelt de waarborgen die de rechtbank van hem verlangt.

      3 Op het bewind krachtens het vorige lid is [artikel 253k][ref1] van toepassing, indien een der ouders als
      bewindvoerder is aangewezen, en anders [paragraaf 10 van afdeling 6][ref2] van deze titel. De bewindvoerder is bij
      uitsluiting bevoegd tot vernietiging van rechtshandelingen van minderjarige deelgenoten, strekkend tot beheer of
      beschikking met betrekking tot de onder bewind staande goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253k
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling6
