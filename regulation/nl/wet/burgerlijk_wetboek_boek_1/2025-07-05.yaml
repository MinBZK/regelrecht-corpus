  - number: '392'
    text: |-
      1 Tot het verstrekken van levensonderhoud zijn op grond van bloed- of aanverwantschap gehouden:

      a. de ouders;

      b. de kinderen;

      c. behuwdkinderen, schoonouders en stiefouders.

      2 Deze verplichting bestaat, behalve wat betreft ouders en stiefouders jegens hun minderjarige kinderen
      en stiefkinderen en jegens hun kinderen bedoeld in [artikel 395a van dit boek][ref1], slechts in geval van
      behoeftigheid van de tot levensonderhoud gerechtigde.

      3 De in het eerste lid genoemde personen zijn niet verplicht levensonderhoud te verstrekken, voor
      zover dit van de echtgenoot of een vroegere echtgenoot dan wel de geregistreerde partner of vroegere
      geregistreerde partner overeenkomstig het in de [vijfde titel a][ref2], [zesde][ref3], [negende][ref4] of
      [tiende titel van dit boek][ref5] bepaalde kan worden verkregen.


