  - number: '329'
    text: |-
      1 Beëindiging van de voogdij kan worden uitgesproken op verzoek van de raad voor de kinderbescherming, het openbaar
      ministerie of een der bloed- of aanverwanten van de minderjarige tot en met de vierde graad.

      2 Ingeval [artikel 336a][ref1] toepassing heeft gevonden, kan de beëindiging bovendien worden verzocht door degene
      of degenen die de minderjarige als behorende tot hun gezin verzorgen en opvoeden.

      3 In het geval, bedoeld in [artikel 367][ref2], kan de rechtbank de voogdij ambtshalve beëindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel336a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel367
