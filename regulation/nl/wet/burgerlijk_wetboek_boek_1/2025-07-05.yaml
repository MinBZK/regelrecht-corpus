  - number: '386'
    text: |-
      1 Op het bewind van de curator zijn de omtrent het bewind van de voogd gegeven voorschriften van overeenkomstige
      toepassing. De rekening en verantwoording van zijn bewind gedurende de curatele wordt evenwel door de curator
      jaarlijks ingediend, behoudens indien de kantonrechter heeft bepaald dat dit op een ander tijdstip kan geschieden.
      Onze Minister van Veiligheid en Justitie kan een model vaststellen volgens hetwelk de rekening en verantwoording
      moet worden opgemaakt. De curator, bedoeld in [artikel 383, zevende lid][ref1], legt jaarlijks de verklaringen en
      het verslag over, bedoeld in artikel 383, achtste lid. De curator doet desgevraagd van zijn werkzaamheden verslag
      aan de kantonrechter. De curator heeft aanspraak op beloning overeenkomstig de regels die daaromtrent bij regeling
      van Onze Minister van Veiligheid en Justitie zijn vastgesteld.

      2 De curator draagt zorg voor een doelmatige belegging van het vermogen van de onder curatele gestelde, voor zover
      dit niet besteed behoort te worden voor een voldoende verzorging van de onder curatele gestelde.

      3 Tenzij de kantonrechter anders bepaalt, is de curator verplicht zo spoedig mogelijk een rekening te openen bij
      een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref2] in Nederland het bedrijf van
      bank mag uitoefenen; de curator is voorts verplicht om uitsluitend voor de betalingen die hij bij de vervulling van
      zijn taak verricht of ontvangt, zoveel mogelijk van deze rekening gebruik te maken.

      4 Voor de toepassing van de [artikelen 365 tot en met 367][ref3] treedt de officier van justitie in de plaats van
      de raad voor de kinderbescherming en het ontslag bedoeld in [artikel 385, lid 1 onder d][ref4] in de plaats van de
      ontzetting van de voogd op grond van [artikel 327 lid 1 onder b][ref5]. Mededelingen en zendingen als bedoeld in
      [artikel 371a][ref6], geschieden alleen dan indien [artikel 12, vierde lid][ref7], op de desbetreffende curatele
      niet van toepassing is.

      5 Indien een gehuwde of een geregistreerde partner onder curatele wordt gesteld, en tussen de echtgenoten of de
      geregistreerde partners het bestuur over hun goederen en de goederen der gemeenschap anders is verdeeld dan volgens
      de regels van de wet en van huwelijkse voorwaarden, bepaalt de rechter bij het uitspreken van de curatele, of en in
      hoeverre die verdeling ook voor de curator zal gelden.

      6 De kantonrechter kan van de curator verlangen dat hij inzage geeft van zijn boeken, bescheiden en andere
      gegevensdragers. Hij kan voorts een afschrift daarvan verlangen.


