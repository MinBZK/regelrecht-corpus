  - number: '379'
    text: |-
      1 De curatele kan worden verzocht door de betrokken persoon, zijn echtgenoot, zijn geregistreerde partner dan wel
      andere levensgezel, zijn bloedverwanten in de rechte lijn en in de zijlijn tot en met de vierde graad, degene die
      ingevolge [artikel 253sa][ref1] of [253t][ref2] het gezag over de betrokken persoon uitoefent, zijn voogd, zijn
      bewindvoerder als bedoeld in [titel 19][ref3] en zijn mentor als bedoeld in [titel 20][ref4].

      2 De curatele kan voorts worden verzocht door het openbaar ministerie en door de instelling waar de betrokkene
      wordt verzorgd of die aan de betrokkene begeleiding biedt. In het laatste geval wordt in het verzoekschrift tevens
      vermeld waarom de in het eerste lid genoemde personen – bloedverwanten in de zijlijn in de derde en vierde graad
      daaronder niet begrepen – niet tot indiening van een verzoek zijn overgegaan.


