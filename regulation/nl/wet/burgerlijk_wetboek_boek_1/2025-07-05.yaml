  - number: '303'
    text: |-
      Voor zover de wet niet anders bepaalt, heeft de gecertificeerde instelling, bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1], die met de voogdij is belast, dezelfde bevoegdheden en verplichtingen als
      andere voogden.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel303
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1.1'
  - number: '304'
    text: |-
      1 Met de gecertificeerde instelling, bedoeld in [artikel 1.1 van de Jeugdwet][ref1] zijn de bestuurders hoofdelijk
      en persoonlijk aansprakelijk voor iedere schade, die te wijten is aan een niet-behoorlijke uitoefening van de
      voogdij.

      2 Iedere bestuurder zal zich echter van zijn aansprakelijkheid kunnen bevrijden door te bewijzen, dat hij geen
      schuld heeft aan de schade.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel304
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1.1'
  - number: '306'
    text: |-
      1 Zonder toestemming van de rechtbank mag een gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1] een hem toevertrouwde minderjarige niet buiten Nederland plaatsen.

      2 De rechter verleent deze toestemming slechts, indien hij de plaatsing voor de minderjarige wenselijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel306
