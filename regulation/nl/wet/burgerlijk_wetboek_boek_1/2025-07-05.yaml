  - number: '411'
    text: |-
      Het bewind eindigt:

      a. door een gezamenlijk besluit van de rechthebbende en de bewindvoerder;

      b. door opzegging door de rechthebbende aan de bewindvoerder met inachtneming van een termijn van een maand;

      c. wanneer de dood van de rechthebbende komt vast te staan.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel411
  - number: '412'
    text: |-
      1 Wanneer aan een persoon wiens bestaan onzeker is een erfdeel of een legaat opkomt, waartoe, indien hij niet in
      leven mocht zijn, anderen zouden gerechtigd zijn, verleent de rechtbank aan die anderen op hun verzoek machtiging
      tot de uitoefening van het recht van erfgenaam of legataris.

      2 De rechtbank kan zo nodig, openbare oproepingen bevelen en behoedmiddelen ten behoeve van de belanghebbenden
      voorschrijven.

      3 Indien na het verlenen van de machtiging mocht blijken, dat de vermiste op de dag van het openvallen der
      nalatenschap heeft bestaan, kan de teruggave van de in bezit gekomen goederen en van de vruchten worden gevorderd,
      op de voet en onder de beperkingen als hierna bij de vaststelling van vermissing is aangegeven.

      4 Het eerste tot en met derde lid is van overeenkomstige toepassing op een uitkering uit levensverzekering, waartoe
      de persoon wiens bestaan onzeker is de eerstgeroepen begunstigde is.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel412
  - number: '413'
    text: |-
      1 Is het bestaan van een persoon onzeker en is de in het volgende lid aangegeven tijdruimte verlopen, dan kunnen
      belanghebbenden de rechtbank verzoeken dat zij hun zal gelasten de vermiste op te roepen ten einde van zijn in
      leven zijn te doen blijken, en dat zij, zo hiervan niet blijkt, de vermissing van de betrokkene zal vaststellen.

      2 a. De in het vorige lid bedoelde tijdruimte beloopt vijf jaren, te rekenen van het vertrek van de vermiste of de
      laatste tijding van zijn leven.

      b. De termijn wordt verkort tot een jaar, indien de betrokkene gedurende die periode wordt vermist en de
      omstandigheden zijn dood waarschijnlijk maken.

      3 Het gelasten van de oproeping van de vermiste en de vaststelling van vermissing, bedoeld in het eerste lid,
      kunnen ook worden verzocht door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel413
  - number: '414'
    text: |-
      1 De rechtbank stelt dag en uur vast, waartegen de vermiste moet worden opgeroepen. De oproep loopt op een termijn
      van een maand of zoveel langer als de rechtbank mocht bevelen. De oproeping geschiedt overeenkomstig de [derde
      afdeling van de derde titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).

      2 Indien de vermiste niet verschijnt, noch iemand voor hem opkomt die behoorlijk van het in leven zijn van de
      vermiste doet blijken, stelt de rechtbank de vermissing van de betrokkene vast, onverminderd haar bevoegdheid
      de beschikking, bedoeld in het eerste lid, eerst nog eenmaal te herhalen alsmede het horen van getuigen en de
      overlegging van bewijsstukken te gelasten, ten bewijze dat is voldaan aan de vereisten die [artikel 413][ref1]
      stelt.

      3 De beschikking, houdende de vaststelling van vermissing van de betrokkene, vermeldt de dag vanaf welke de
      vermissing is vastgesteld. Als zodanig geldt de dag volgende op die van het laatste bericht waaruit blijkt dat de
      vermiste in leven was, tenzij er voldoende aanwijzingen zijn dat hij daarna nog enige tijd in leven was.

      4 De rechtbank kan tevens bepalen, dat de kosten die een verzoeker als bedoeld in [artikel 413 lid 1][ref2] heeft
      gemaakt, ten laste van het vermogen van de vermiste worden gebracht.

      5 De vaststelling van vermissing heeft de rechtsgevolgen van een overlijden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel413
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel413
