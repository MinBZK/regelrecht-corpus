  - number: '18'
    text: |-
      1 De ambtenaar van de burgerlijke stand mag in de akten alleen opnemen hetgeen ingevolge het bij of krachtens de
      wet bepaalde moet worden verklaard of opgenomen.

      2 Alvorens tot het opmaken van een akte over te gaan, verifieert de ambtenaar van de burgerlijke stand de door
      partijen bij de akte verstrekte gegevens door raadpleging van de basisregistratie personen en, zonodig, andere
      daartoe bestemde registers of bevoegde autoriteiten, zonder daarvoor leges verschuldigd te zijn.

      3 De ambtenaar van de burgerlijke stand is voorts bevoegd zich, al dan niet in persoon, alle bescheiden te doen
      vertonen die hij voor het opmaken van de akte of voor de vaststelling van de in de akte op te nemen gegevens
      noodzakelijk acht.

      4

      5 Bij algemene maatregel van bestuur wordt geregeld al hetgeen het opmaken van de akten betreft.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel18
  - number: 18a
    text: |-
      1 Partijen bij een akte van de burgerlijke stand zijn degenen die aan de ambtenaar van de burgerlijke stand een
      aangifte doen of te zijnen overstaan een verklaring afleggen betreffende een feit, waarvan de akte bestemd is te
      doen blijken.

      2 Belanghebbende partijen zijn partijen die met hun verklaring enig rechtsgevolg teweeg brengen voor henzelf of
      voor medepartijen, dan wel voor henzelf en medepartijen.

      3 De belanghebbende partijen kunnen zich door een daartoe bij authentieke akte gevolmachtigde doen
      vertegenwoordigen.

      4 Wanneer een gevolmachtigde een verklaring aflegt, geldt hij zowel als de door hem vertegenwoordigde persoon als
      partij bij de akte.

      5 De ambtenaar van de burgerlijke stand mag geen akte verlijden waarin hijzelf als partij of belanghebbende partij
      voorkomt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel18a
  - number: 18b
    text: |-
      1 Voor de betrouwbaarheid en vertrouwelijkheid van de elektronische aangifte alsmede het opmaken en de opslag van
      een akte in elektronische vorm wordt een systeem van gegevensverwerking gebruikt dat:

      a. de ambtenaar van de burgerlijke stand in staat stelt de juistheid van de identiteit van de aangever vast te
      stellen;

      b. de vertrouwelijkheid van de door de aangever verstrekte gegevens waarborgt;

      c. waarborgt dat elektronische akten als bedoeld in [artikel 18, vierde lid][ref1], zodanig blijven opgeslagen
      dat de inhoud toegankelijk is voor toekomstig gebruik en een ongewijzigde reproductie van de inhoud van de akten
      gewaarborgd is;

      d. waarborgt dat een bericht, elektronisch afschrift of uittreksel volledig is en niet onbevoegdelijk is of kan
      worden gewijzigd.

      2 Bij algemene maatregel van bestuur kunnen over het in het eerste lid bepaalde nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel18
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '18'
        afdeling: '3'
  - number: 18c
    text: |-
      1 Blijft een partij bij een akte van de burgerlijke stand of een belanghebbende partij in gebreke de in
      [artikel 18, derde lid][ref1], bedoelde bescheiden over te leggen, of acht de ambtenaar van de burgerlijke stand de
      overgelegde bescheiden ongenoegzaam, dan weigert deze tot het opmaken van de akte over te gaan.

      2 De ambtenaar van de burgerlijke stand weigert eveneens tot het opmaken van de akte over te gaan, indien hij van
      oordeel is dat de Nederlandse openbare orde zich hiertegen verzet.

      3 Van een weigering als bedoeld in het eerste of het tweede lid doet de ambtenaar van de burgerlijke stand een
      schriftelijke, met redenen omklede mededeling aan de partijen bij de akte en de belanghebbende partijen toekomen,
      onder vermelding van de tegen die weigering openstaande voorziening van [afdeling 12][ref2] van deze titel. Een
      afschrift van deze mededeling doet hij aan de Immigratie- en Naturalisatiedienst toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling12
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel18c
    references:
