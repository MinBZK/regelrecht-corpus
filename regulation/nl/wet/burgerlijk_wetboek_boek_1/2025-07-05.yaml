    text: |-
      1 Een echtgenoot is bevoegd tot het bestuur van zijn eigen goederen en, volgens de regels van [artikel 97][ref1],
      tot het bestuur van goederen van een gemeenschap.

      2 Het bestuur van een echtgenoot over een goed omvat de uitoefening van de daaraan verbonden bevoegdheden,
      daaronder begrepen de bevoegdheid tot beschikking en tot beheer en de bevoegdheid om ten aanzien van dat goed
      feitelijke handelingen te verrichten en toe te laten, onverminderd de bevoegdheden tot genot en gebruik die de
      andere echtgenoot overeenkomstig de huwelijksverhouding toekomen.

      3 Tussen de echtgenoot die het hem toekomend bestuur overlaat aan de andere echtgenoot, en deze laatste zijn de
      bepalingen omtrent opdracht van overeenkomstige toepassing, met inachtneming van de aard van de huwelijksverhouding
      en de aard der goederen.

      4 De echtgenoot die een goed bestuurt, kan als partij naast de andere echtgenoot toetreden tot een rechtshandeling
      die deze laatste met betrekking tot dat goed heeft verricht. De verklaring van toetreding wordt gericht tot hen
      die partij bij de rechtshandeling zijn; [artikel 56 van Boek 3][ref2] is van overeenkomstige toepassing. Is voor
      het verrichten van de rechtshandeling een bepaalde vorm voorgeschreven, dan geldt voor de toetreding hetzelfde
      vereiste. De echtgenoot kan toetreding tot bijkomstige en tot reeds opeisbare rechten en verplichtingen uitsluiten;
      hij wordt geacht zich slechts te hebben verbonden onder eerbiediging van tevoren aan derden verleende rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel97
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel56
