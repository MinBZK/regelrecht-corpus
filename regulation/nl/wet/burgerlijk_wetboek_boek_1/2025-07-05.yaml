  - number: '246'
    text: |-
      Onbevoegd tot het gezag zijn minderjarigen, zij die onder curatele zijn gesteld en zij wier geestvermogens zodanig
      zijn gestoord, dat zij in de onmogelijkheid verkeren het gezag uit te oefenen, tenzij deze stoornis van tijdelijke
      aard is.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel246
  - number: '247'
    text: |-
      1 Het ouderlijk gezag omvat de plicht en het recht van de ouder zijn minderjarig kind te verzorgen en op te voeden.

      2 Onder verzorging en opvoeding worden mede verstaan de zorg en de verantwoordelijkheid voor het geestelijk
      en lichamelijk welzijn en de veiligheid van het kind alsmede het bevorderen van de ontwikkeling van zijn
      persoonlijkheid. In de verzorging en opvoeding van het kind passen de ouders geen geestelijk of lichamelijk geweld
      of enige andere vernederende behandeling toe.

      3 Het ouderlijk gezag omvat mede de verplichting van de ouder om de ontwikkeling van de banden van zijn kind met de
      andere ouder te bevorderen.

      4 Een kind over wie de ouders gezamenlijk het gezag uitoefenen, behoudt na ontbinding van het huwelijk anders dan
      door de dood of na scheiding van tafel en bed, na de ontbinding van het geregistreerd partnerschap anders dan door
      de dood, of na het beëindigen van de samenleving indien de ouders het gezag gezamenlijk uitoefenen op grond van
      [artikel 251b, eerste lid][ref1], of een aantekening als bedoeld in [artikel 252, eerste lid][ref2], is geplaatst,
      recht op een gelijkwaardige verzorging en opvoeding door beide ouders.

      5 Ouders kunnen ter uitvoering van het vierde lid in een overeenkomst of ouderschapsplan rekening houden
      met praktische belemmeringen die ontstaan in verband met de ontbinding van het huwelijk anders dan door de
      dood of na scheiding van tafel en bed, de ontbinding van het geregistreerd partnerschap anders dan door de
      dood, of het beëindigen van de samenleving indien de ouders het gezag gezamenlijk uitoefenen op grond van
      [artikel 251b, eerste lid][ref3], of een aantekening als bedoeld in [artikel 252, eerste lid][ref4], is geplaatst,
      echter uitsluitend voor zover en zolang de desbetreffende belemmeringen bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251b
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel251b
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel252
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel247
