        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 18c
        afdeling: '3'
  - number: '62'
    text: |-
      1 Het huwelijk mag niet worden voltrokken vóór de veertiende dag na de datum waarop het voornemen om in het
      huwelijk te treden aan de ambtenaar van de burgerlijke stand kenbaar is gemaakt.

      2 Het openbaar ministerie bij de rechtbank, binnen wier rechtsgebied de het voornemen om in het huwelijk te treden
      kenbaar is gemaakt, is bevoegd uit hoofde van gewichtige redenen vrijstelling te verlenen van de voorgeschreven
      wachttijd.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel62
  - number: '63'
    text: |-
      1 Een huwelijk wordt in het openbaar in het gemeentehuis voltrokken ten overstaan van de ambtenaar van de
      burgerlijke stand van de door de aanstaande echtgenoten aangewezen gemeente in tegenwoordigheid van ten minste twee
      en ten hoogste vier meerderjarige getuigen.

      2 In het geval dat de melding van een voornemen om in het huwelijk te treden op elektronische
      wijze heeft plaatsgevonden, dienen de aanstaande echtgenoten uiterlijk ter gelegenheid van de
      huwelijksvoltrekking hun identiteit aan te tonen door overlegging van een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '64'
    text: |-
      Indien een der partijen uit hoofde van een behoorlijk bewezen wettig beletsel verhinderd wordt zich naar het
      gemeentehuis te begeven, kan het huwelijk worden voltrokken in een bijzonder huis binnen dezelfde gemeente, mits
      dit in tegenwoordigheid van zes meerderjarige getuigen geschiedt.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel64
  - number: '65'
    text: |-
      De aanstaande echtgenoten zijn verplicht bij de voltrekking van hun huwelijk in persoon voor de ambtenaar van de
      burgerlijke stand te verschijnen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel65
  - number: '66'
    text: |-
      Het staat Onze Minister van Justitie vrij, uit hoofde van gewichtige redenen aan partijen te vergunnen het huwelijk
      door een bijzondere bij authentieke akte gevolmachtigde te voltrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel66
  - number: '67'
    text: |-
      1 De aanstaande echtgenoten moeten ten overstaan van de ambtenaar van de burgerlijke stand en in tegenwoordigheid
      van de getuigen verklaren, dat zij elkander aannemen tot echtgenoten en dat zij getrouw alle plichten zullen
      vervullen, die door de wet aan de huwelijkse staat worden verbonden.

      2 Terstond nadat deze verklaring is afgelegd, verklaart de ambtenaar van de burgerlijke stand, dat partijen door de
      echt aan elkander zijn verbonden, en maakt hij daarvan in het daartoe bestemde register een akte op.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel67
  - number: '68'
    text: |-
      1 Geen godsdienstige plechtigheden zullen mogen plaats hebben, voordat de partijen aan de bedienaar van de
      eredienst zullen hebben doen blijken, dat het huwelijk ten overstaan van de ambtenaar van de burgerlijke stand
      is voltrokken.

      2 Een partij bij een religieuze of levensbeschouwelijke verbintenis is gehouden tot het verlenen van medewerking
      aan het teniet doen gaan van die verbintenis indien een andere partij daarom verzoekt, tenzij dit gelet op
      zwaarwegende belangen in redelijkheid niet kan worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel68
  - number: '69'
    text: |-
      1 Voor zover hieronder niet anders is bepaald, kan op grond dat de echtgenoten niet de vereisten in zich verenigden
      om tezamen een huwelijk aan te gaan, de nietigverklaring van het huwelijk worden verzocht door:

      a. de bloedverwanten in de rechte lijn van een der echtgenoten;

      b. ieder der echtgenoten;

      c. alle overige personen, die daarbij een onmiddellijk rechtsbelang hebben, echter deze alleen na de ontbinding van
      het huwelijk;

      d. het openbaar ministerie, echter alleen zolang het huwelijk niet is ontbonden.

      2 Hij die met een der echtgenoten nog door een vroeger huwelijk dan wel door een eerder geregistreerd partnerschap
      is verbonden, is eveneens bevoegd op grond van het bestaan van dat huwelijk of die registratie de nietigverklaring
      van het daarna gesloten huwelijk te verzoeken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel69
  - number: '70'
    text: |-
      1 Op verzoek van de ouders, de echtgenoten en het openbaar ministerie kan een huwelijk worden nietig verklaard,
      wanneer het ten overstaan van een niet bevoegde ambtenaar van de burgerlijke stand of niet in tegenwoordigheid van
      het vereiste aantal getuigen is voltrokken.

      2 De bevoegdheid van een echtgenoot om uit dien hoofde de nietigverklaring van het huwelijk te verzoeken vervalt,
      indien er uiterlijk bezit van de huwelijkse staat en een akte van huwelijksvoltrekking ten overstaan van een
      ambtenaar van de burgerlijke stand verleden, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel70
  - number: '71'
    text: |-
      1 Een echtgenoot kan de nietigverklaring van zijn huwelijk verzoeken, wanneer hij dit onder invloed van dwang
      heeft gesloten. Tevens is het openbaar ministerie, na de echtgenoten in de gelegenheid te hebben gesteld hun mening
      omtrent de wenselijkheid van het indienen van het verzoek tot nietigverklaring kenbaar te maken, althans na deze
      daartoe behoorlijk te hebben opgeroepen, bevoegd tot het doen van het verzoek.

      2 Voorts kan de echtgenoot, die bij de huwelijksvoltrekking gedwaald heeft hetzij in de persoon van de andere
      echtgenoot, hetzij omtrent de betekenis van de door hem afgelegde verklaring de nietigverklaring van zijn huwelijk
      verzoeken.

      3 De bevoegdheid de nietigverklaring wegens dwaling te verzoeken vervalt, wanneer de echtgenoten zes maanden
      hebben samengewoond sedert de ontdekking van de dwaling zonder dat het verzoek is gedaan. De bevoegdheid de
      nietigverklaring wegens dwang te verzoeken vervalt, wanneer de echtgenoten drie jaar hebben samengewoond zonder
      dwang gericht op instandhouding van het huwelijk, zonder dat het verzoek is gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel71
  - number: 71a
    text: |-
      Op verzoek van het openbaar ministerie kan een huwelijk als schijnhandeling wegens strijd met de Nederlandse
      openbare orde worden nietig verklaard indien het oogmerk van de echtgenoten, of één hunner, niet was gericht op
      de vervulling van de door de wet aan de huwelijkse staat verbonden plichten, doch op het verkrijgen van toelating
      tot Nederland.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel71a
  - number: '72'
    text: |-
      Een huwelijk kan niet nietig worden verklaard uit hoofde dat op het tijdstip van de huwelijksvoltrekking een
      der echtgenoten onder curatele stond, en het huwelijk klaarblijkelijk het ongeluk van de andere echtgenoot zou
      veroorzaken.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel72
  - number: '73'
    text: |-
      De nietigverklaring van een huwelijk uit hoofde van een geestelijke stoornis kan na het ophouden van de stoornis
      alleen worden verzocht door de echtgenoot die geestelijk gestoord was. Het verzoek vervalt door een samenwoning van
      ten minste zes maanden na het ophouden van de stoornis.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel73
  - number: '74'
    text: |-
      De nietigverklaring van een huwelijk, dat aangegaan is door iemand die de vereiste leeftijd miste, kan niet worden
      verzocht wanneer deze op de dag van het verzoek de vereiste ouderdom heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel74
  - number: '75'
    text: |-
      1 Wegens het ontbreken van een vereiste toestemming van een derde kan de nietigverklaring van het huwelijk alleen
      door die derde of, in het geval van [artikel 38 van dit boek][ref1], door de curator worden verzocht. Dit verzoek
      vervalt, wanneer hij die bevoegd is de nietigverklaring te verzoeken, het huwelijk uitdrukkelijk of stilzwijgend
      heeft goedgekeurd, of wanneer drie maanden verlopen zijn nadat hij met de huwelijksvoltrekking bekend is geworden.

      2 Hij die bevoegd is de nietigverklaring te verzoeken, wordt vermoed met het huwelijk bekend te zijn geworden,
      wanneer het hier te lande is voltrokken, of wanneer het, buiten Nederland aangegaan, hier te lande in de registers
      van de burgerlijke stand is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel38
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '38'
        afdeling: '1'
  - number: '76'
    text: |-
      Behoudens het in [artikel 56 van dit boek][ref1] bepaalde, verklaart de rechter een huwelijk alleen nietig op grond
      van een verzoek overeenkomstig de bepalingen van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel56
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '56'
        afdeling: '3'
  - number: '77'
    text: |-
      1 De nietigverklaring van het huwelijk werkt, zodra de beschikking in kracht van gewijsde is gegaan; zij werkt
      terug tot het tijdstip van de huwelijksvoltrekking.

      2 Nochtans mist de beschikking terugwerkende kracht en heeft zij hetzelfde gevolg als een echtscheiding:

      a. ten aanzien van de kinderen der echtgenoten;

      b. ten aanzien van de te goeder trouw zijnde echtgenoot; deze kan echter niet op een gemeenschap van goederen
      aanspraak maken, wanneer het huwelijk wegens het bestaan van een vroeger huwelijk of een eerder geregistreerd
      partnerschap is nietig verklaard;

      c. ten aanzien van andere personen dan de echtgenoten en hun kinderen, voor zover zij te goeder trouw vóór de
      inschrijving der nietigverklaring rechten hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel77
  - number: '78'
    text: |-
      Het bestaan van een in Nederland gesloten huwelijk kan niet anders worden bewezen dan door de huwelijksakte dan
      wel door de akte van omzetting, bedoeld in [artikel 80g][ref1], behoudens in de gevallen bij de volgende artikelen
      voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80g
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80g
  - number: '79'
    text: |-
      Heeft het huwelijksregister niet bestaan of is het verloren gegaan of ontbreekt daaraan de huwelijksakte, dan wel
      de akte van omzetting, bedoeld in [artikel 80g][ref1], dan kan het huwelijk door getuigen of bescheiden worden
      bewezen, mits er een uiterlijk bezit van de huwelijkse staat aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80g
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80g
  - number: '80'
    text: |-
      Wordt in een geding betwist dat een kind, dat uiterlijk bezit van staat heeft, uit een huwelijk is geboren, dan
      levert het feit dat de ouders openlijk als man en vrouw hebben geleefd, voldoende bewijs op.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel80
  - number: 80a
    text: |-
      1 Een persoon kan tegelijkertijd slechts met één andere persoon van hetzelfde of andere geslacht een geregistreerd
      partnerschap aangaan.

      2 Zij die een geregistreerd partnerschap aangaan, mogen niet tegelijkertijd gehuwd zijn.

      3 Registratie van partnerschap geschiedt bij een akte van registratie van partnerschap opgemaakt door een ambtenaar
      van de burgerlijke stand.

      4 Een partnerschapsregistratie kan worden gestuit, indien partijen niet de vereisten in zich verenigen om de
      registratie aan te gaan, of wanneer partijen niet beiden hun toestemming tot het geregistreerd partnerschap
      vrijelijk zullen geven, dan wel wanneer het oogmerk van de aanstaande geregistreerde partners, of één hunner,
      niet is gericht op de vervulling van de door de wet aan de partnerschapsregistratie verbonden plichten, doch
      op het verkrijgen van toelating tot Nederland. Op een stuiting zijn de [artikelen 51][ref1], [52][ref2],
      [53, tweede tot en met vierde lid][ref3], en [54 tot en met 56][ref4] van overeenkomstige toepassing. Het
      openbaar ministerie is verplicht een partnerschapsregistratie te stuiten, indien het met een van de in de
      [artikelen 31][ref5], [32][ref6], [41][ref7] en in het eerste en tweede lid van dit artikel omschreven beletselen
      bekend is. Indien aan de ambtenaar van de burgerlijke stand een van de in de vorige zin genoemde beletselen bekend
      is, of wanneer partijen niet beiden hun toestemming tot het geregistreerd partnerschap vrijelijk zullen geven, mag
      hij niet meewerken aan een registratie of daaraan voorafgaande formaliteiten verrichten, ook al zou geen stuiting
      hebben plaatsgehad.

      5 Ter zake van de partnerschapsregistratie zijn de [artikelen 31][ref8], [32][ref9], [37 tot en met 39][ref10],
      [41][ref11], [41a][ref12], [44 tot en met 49][ref13], [58][ref14] en [62 tot en met 66][ref15] van overeenkomstige
      toepassing.

      6 Op de nietigverklaring van een partnerschapsregistratie zijn van overeenkomstige toepassing de
      [artikelen 69 tot en met 77][ref16].

      7 Op het bewijs van het bestaan van de partnerschapsregistratie zijn de [artikelen 78][ref17], [79][ref18] en
      [80][ref19] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel32
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel41
