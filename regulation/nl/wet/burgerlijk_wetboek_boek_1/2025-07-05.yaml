  - number: '200'
    text: |-
      1 Het in [artikel 199, onder a en b][ref1], bedoelde vaderschap kan, op de grond dat de man niet de biologische
      vader van het kind is, worden ontkend:

      a. door de vader of de moeder van het kind;

      b. door het kind zelf.

      2 De vader of moeder kan het in [artikel 199, onder a en b][ref2], bedoelde vaderschap niet ontkennen, indien de
      man vóór het huwelijk of geregistreerd partnerschap heeft kennis gedragen van de zwangerschap.

      3 De vader of moeder kan het in [artikel 199, onder a en b][ref3], bedoelde vaderschap evenmin ontkennen, indien de
      man heeft ingestemd met een daad die de verwekking van het kind tot gevolg kan hebben gehad.

      4 Het tweede en derde lid zijn niet van toepassing ten aanzien van de vader, indien de moeder hem heeft bedrogen
      omtrent de verwekker.

      5 Het verzoek tot gegrondverklaring van de ontkenning wordt door de moeder bij de rechtbank ingediend binnen een
      jaar na de geboorte van het kind. Een zodanig verzoek wordt door de vader ingediend binnen een jaar nadat hij
      bekend is geworden met het feit dat hij vermoedelijk niet de biologische vader is van het kind.

      6 Het verzoek tot gegrondverklaring van de ontkenning wordt door het kind bij de rechtbank ingediend binnen drie
      jaren nadat het kind bekend is geworden met het feit dat de man vermoedelijk niet zijn biologische vader is. Indien
      het kind evenwel gedurende zijn minderjarigheid bekend is geworden met dit feit, kan het verzoek tot uiterlijk drie
      jaren nadat het kind meerderjarig is geworden, worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel199
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel199
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel199
