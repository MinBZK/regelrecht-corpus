  - number: '391'
    text: |-
      1 Door een bij algemene maatregel van bestuur aan te wijzen orgaan wordt een openbaar register gehouden, waarin
      rechtsfeiten worden aangetekend die betrekking hebben op curatele en op bewind als bedoeld in [titel 19][ref1].
      In het register worden, voor iedere curatele en ieder in te schrijven bewind afzonderlijk, met vermelding van de
      dagtekening, ingeschreven:

      1° de naam en geboortedatum van de onder curatele gestelde en de rechthebbende;

      2° een uittreksel van de rechterlijke beslissingen, waarbij de curatele of het bewind wegens verkwisting dan wel
      het hebben van problematische schulden wordt ingesteld, verlengd of opgeheven;

      3° een uittreksel van de rechterlijke beslissingen, waarbij, voor zover de rechter zulks overeenkomstig
      [artikel 436, derde lid, derde volzin][ref2], heeft bepaald, het bewind wegens een lichamelijke of geestelijke
      toestand wordt ingesteld, verlengd of opgeheven;

      4° de grond waarop de curatele is ingesteld;

      5° voor zover van toepassing, de datum waarop de curatele of het bewind eindigt;

      6° een uittreksel van de rechterlijke beslissingen, waarbij een curator of bewindvoerder wordt benoemd, geschorst
      of ontslagen;

      7° de naam en woonplaats van de curator of curatoren en de bewindvoerder of bewindvoerders en de taakverdeling,
      voor zover de rechter deze heeft vastgesteld.

      2 Een ieder heeft kosteloze inzage in het register en kan tegen betaling een uittreksel daaruit verkrijgen, met
      inachtneming van het bij of krachtens de [Wet griffierechten burgerlijke zaken][ref3] bepaalde.

      3 De griffier van de rechtbank geeft de in het eerste lid, onder 1° tot en met 7° genoemde gegevens, alsmede het
      bericht van het overlijden van de onder curatele gestelde dan wel rechthebbende, door aan het in het eerste lid
      bedoelde orgaan ten behoeve van het in het eerste lid genoemde register.

      4 Het einde van de curatele en het bewind door het verstrijken van de tijdsduur waarvoor de maatregel is ingesteld,
      leidt tot doorhaling van de inschrijving in het openbaar register op de dag na het verstrijken van de tijdsduur.
      Een beschikking tot opheffing van de curatele of het bewind leidt tot doorhaling van de inschrijving in het
      openbaar register op het tijdstip waarop de beschikking in kracht van gewijsde is gegaan. Het overlijden van de
      onder curatele gestelde of de rechthebbende leidt tot doorhaling van de inschrijving in het openbaar register,
      nadat de griffie van de rechtbank het bericht van het overlijden heeft ontvangen.


