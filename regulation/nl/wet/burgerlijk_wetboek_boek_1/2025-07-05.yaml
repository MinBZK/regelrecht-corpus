  - number: '331'
    text: |-
      1 De rechtbank kan een met de voogdij belaste natuurlijke persoon geheel of gedeeltelijk in de uitoefening van het
      gezag schorsen indien:

      a. een ernstig vermoeden bestaat dat de grond, bedoeld in [artikel 266, eerste lid, aanhef en onder a of b][ref1]
      is vervuld en de maatregel noodzakelijk is om een acute en ernstige bedreiging voor de minderjarige weg te nemen,
      of

      b. een medische behandeling van een minderjarige jonger dan twaalf jaar of van de minderjarige van twaalf jaar of
      ouder die niet in staat kan worden geacht tot een redelijke waardering van zijn belangen ter zake, noodzakelijk is
      om ernstig gevaar voor diens gezondheid af te wenden en de voogd toestemming daarvoor weigert.

      2 Indien de voogdij gezamenlijk wordt uitgeoefend, wordt na schorsing van de voogdij van één van hen de voogdij
      door de andere voogd alleen uitgeoefend, tenzij de kinderrechter een gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref2], met de voorlopige voogdij over het kind belast. In dat geval is ook het gezag
      van deze andere voogd geschorst.

      3 [Artikel 329, eerste en tweede lid][ref3], is van overeenkomstige toepassing.

      4 De schorsing in de uitoefening van het gezag vervalt na verloop van drie maanden na de dag van de beschikking,
      tenzij voor het einde van deze termijn om een beëindiging van de voogdij is verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel329
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel331
