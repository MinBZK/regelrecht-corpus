  - number: '230'
    text: |-
      1 De adoptie heeft haar gevolgen vanaf de dag, waarop de uitspraak in kracht van gewijsde is gegaan.

      2 Indien het kind is geboren binnen de relatie van de ouder en de adoptant en de adoptie voor de geboorte van het
      kind is verzocht, werkt deze terug tot het tijdstip van geboorte van het kind; indien de adoptie uiterlijk zes
      maanden na de geboorte van het kind is verzocht, werkt deze terug tot het tijdstip van indiening van het verzoek.
      Het bepaalde in de eerste volzin is niet van toepassing indien voor de adoptie familierechtelijke betrekkingen
      waren gevestigd tussen het kind en een andere ouder en deze door de adoptie zijn verbroken. De adoptie kan in
      het geval, bedoeld in de eerste volzin, ook worden uitgesproken indien de adoptant na indiening van het verzoek
      is overleden.

      3 De adoptie blijft haar gevolgen behouden, ook al zou blijken, dat de rechter de door
      [artikel 228 van dit boek][ref1] gestelde voorwaarden ten onrechte als vervuld zou hebben aangenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel228
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '228'
  - number: '231'
    text: |-
      1 De adoptie kan door een uitspraak van de rechtbank op verzoek van de geadopteerde worden herroepen.

      2 Het verzoek kan alleen worden toegewezen, indien de herroeping in het kennelijk belang van de geadopteerde is,
      de rechter van de redelijkheid der herroeping in gemoede overtuigd is, en het verzoek is ingediend niet eerder dan
      twee jaren en niet later dan vijf jaren na de dag, waarop de geadopteerde meerderjarig is geworden.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel231
  - number: '232'
    text: |-
      1 Door herroeping van de adoptie houdt de familierechtelijke betrekking tussen de geadopteerde en zijn kinderen
      enerzijds en de adoptiefouder of adoptiefouders en zijn bloedverwanten anderzijds op te bestaan.

      2 De familierechtelijke betrekking die door de adoptie opgehouden had te bestaan, herleeft door de herroeping.

      3 [Artikel 230][ref1] vindt ten aanzien van de herroeping overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel230
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '230'
  - number: '233'
    text: |-
      Minderjarigen zijn zij die de leeftijd van achttien jaren niet hebben bereikt en evenmin met toepassing van
      [artikel 253ha][ref1] meerderjarig zijn verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253ha
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253ha
        paragraaf: 2a
        afdeling: '2'
  - number: '234'
    text: |-
      1 Een minderjarige is, mits hij met toestemming van zijn wettelijke vertegenwoordiger handelt, bekwaam
      rechtshandelingen te verrichten, voor zover de wet niet anders bepaalt.

      2 De toestemming kan slechts worden verleend voor een bepaalde rechtshandeling of voor een bepaald doel.

      3 De toestemming wordt aan de minderjarige verondersteld te zijn verleend, indien het een rechtshandeling betreft
      ten aanzien waarvan in het maatschappelijk verkeer gebruikelijk is dat minderjarigen van zijn leeftijd deze
      zelfstandig verrichten.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel234
  - number: '235'
    text: |-
      1 Handlichting waarbij aan een minderjarige bepaalde bevoegdheden van een meerderjarige worden toegekend, kan
      wanneer de minderjarige de leeftijd van zestien jaren heeft bereikt, op zijn verzoek door de kantonrechter worden
      verleend.

      2 Zij wordt niet verleend tegen de wil van de ouders voor zover deze het gezag over de minderjarige uitoefenen, met
      inachtneming nochtans van [artikel 253a, eerste lid][ref1].

      3 Bij het verlenen van handlichting bepaalt de kantonrechter uitdrukkelijk, welke bevoegdheden van een
      meerderjarige aan de minderjarige worden toegekend. Deze bevoegdheden mogen zich niet verder uitstrekken dan tot
      de gedeeltelijke of de gehele ontvangst van zijn inkomsten en de beschikking daarover, het sluiten van verhuringen
      en verpachtingen, het in een vennootschap deelnemen en het uitoefenen van een beroep of bedrijf. De minderjarige
      wordt echter door handlichting niet bekwaam tot het beschikken over registergoederen, effecten, of door hypotheek
      gedekte vorderingen.

      4 Hij kan ter zake van de handlichting zelf en van handelingen, waartoe hij krachtens de verkregen handlichting
      bekwaam is, eisende of verwerende in rechte optreden. [Artikel 12 lid 1 van dit boek][ref2] geldt voor die
      handelingen niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel12
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '12'
  - number: '236'
    text: |-
      1 Een verleende handlichting kan door de kantonrechter worden ingetrokken, indien de minderjarige daarvan misbruik
      maakt of er gegronde vrees bestaat dat hij dit zal doen.

      2 De intrekking geschiedt op verzoek van een van de ouders van de minderjarige, voor zover deze het gezag over hem
      uitoefenen en met inachtneming van [artikel 253a, eerste lid][ref1], of op verzoek van de voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel236
    references:
