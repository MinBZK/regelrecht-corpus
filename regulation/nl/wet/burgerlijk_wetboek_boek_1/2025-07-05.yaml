  - number: '301'
    text: |-
      1 De ambtenaar van de burgerlijke stand geeft de rechtbank onverwijld kennis:

      a. van het overlijden van ieder die minderjarige kinderen achterlaat;

      b. van de aangifte van geboorte van ieder kind, over wie de moeder uit wie het kind is geboren niet van rechtswege
      het gezag uitoefent.

      2 Indien het huwelijk van de overledene die minderjarige kinderen nalaat, gerechtelijk was ontbonden, of de
      overledene van tafel en bed gescheiden was, bericht de ambtenaar van de burgerlijke stand - zo de andere ouder nog
      leeft - deze omstandigheden tevens aan de rechtbank. De rechtbank zendt, indien deze een andere is, de door haar
      ontvangen kennisgeving door aan de rechtbank die over het verzoek tot ontbinding van het huwelijk of tot scheiding
      van tafel en bed heeft beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2025-07-05#Artikel301
  - number: '302'
    text: |-
      1 De rechter kan de voogdij opdragen aan een gecertificeerde instelling als bedoeld in
      [artikel 1.1 van de Jeugdwet][ref1].

      2 Onverminderd diens bevoegdheid een natuurlijke persoon tot voogd te benoemen, kan de rechter de voogdij over
      een minderjarige door of voor wie een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd
      als bedoeld in [artikel 28 van de Vreemdelingenwet 2000][ref2] is ingediend, en in verband daarmee in Nederland
      verblijft, alsmede over door Onze Minister van Justitie aan te wijzen categorieën andere minderjarigen, uitsluitend
      opdragen aan een daartoe door Onze Minister van Justitie aanvaarde rechtspersoon.

      3 Onze Minister van Justitie kan voorwaarden stellen bij of voorschriften verbinden aan de aanvaarding, bedoeld in
      het tweede lid, en de rechtspersoon voor een bepaalde tijd aanvaarden.

      4 Op een rechtspersoon als bedoeld in het tweede lid, zijn de [artikelen 303][ref3], [304][ref4], [305][ref5] en
      [328][ref6] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
