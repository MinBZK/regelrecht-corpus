  - number: 253x.1
    text: |-
      Na de dood van de ouder die tezamen met de ander het gezag uitoefende, oefent die ander van rechtswege de voogdij
      over de kinderen uit.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253x
  - number: 253x.2
    text: |-
      De rechtbank kan op verzoek van de overlevende ouder te allen tijde bepalen dat deze, mits daartoe bevoegd, alsnog
      met het gezag wordt belast.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253x
  - number: 253x.3
    text: |-
      De [artikelen 253][ref1] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253g
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253x
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253g
        paragraaf: '2'
        afdeling: '2'
  - number: 253y.1
    text: |-
      Het gezamenlijk gezag, bedoeld in de [artikelen 253sa][ref1] en [253t][ref2], eindigt op de dag waarop in kracht
      van gewijsde is gegaan de beschikking waarbij aan de ouders gezamenlijk gezag is toegekend of het gezamenlijk gezag
      van de ouder en de ander is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253y
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253t
        paragraaf: '2'
        afdeling: 3A
  - number: 253y.2
    text: |-
      Is de beschikking, bedoeld in het eerste lid, uitvoerbaar bij voorraad verklaard, dan eindigt het gezamenlijk gezag
      van de ouder en de ander daags nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253y
  - number: '254.1'
    text: |-
      Indien een minderjarige zodanig opgroeit, dat zijn zedelijke of geestelijke belangen of zijn gezondheid ernstig
      worden bedreigd, en andere middelen ter afwending van deze bedreiging hebben gefaald of, naar is te voorzien,
      zullen falen, kan de kinderrechter hem onder toezicht stellen van een gezinsvoogdij-instelling als bedoeld in
      [artikel 60 van de Wet op de jeugdhulpverlening][ref1] (*Stb.* 1989, 360).


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel60
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '60'
  - number: '254.2'
    text: |-
      Hij kan dit doen op verzoek van een ouder, een ander die de minderjarige als behorende tot zijn gezin verzorgt en
      opvoedt, de raad voor de kinderbescherming of het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel254
  - number: '254.3'
    text: |-
      Bij de toepassing van het eerste lid let de kinderrechter op de godsdienstige gezindheid en de levensovertuiging
      van de minderjarige en van het gezin waartoe deze behoort.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel254
  - number: '254.4'
    text: |-
      Op verzoek van de gezinsvoogdij-instelling, de met het gezag belaste ouder of de minderjarige van twaalf jaren
      of ouder, kan de kinderrechter de gezinsvoogdij-instelling die het toezicht heeft, vervangen door een andere. De
      raad voor de kinderbescherming is bevoegd het in de vorige volzin bedoelde verzoek in te dienen, indien de raad
      van oordeel blijft dat de uithuisplaatsing niet op de voet van [artikel 263, eerste lid][ref1], dient te worden
      beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel263
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel254
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '263'
        afdeling: '4'
  - number: '255'
    text: |-
      De kinderrechter kan hangende het onderzoek de minderjarige voorlopig onder toezicht stellen indien dit dringend en
      onverwijld noodzakelijk is. Hij bepaalt de duur van dit voorlopige toezicht op ten hoogste drie maanden en kan de
      beslissing te allen tijde herroepen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel255
  - number: '256.1'
    text: De kinderrechter bepaalt de duur van de ondertoezichtstelling op ten hoogste een jaar.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel256
  - number: '256.2'
    text: |-
      De kinderrechter kan de duur telkens voor ten hoogste een jaar verlengen. Hij kan dit doen op verzoek van de
      gezinsvoogdij-instelling, een ouder, een ander die de minderjarige als behorende tot zijn gezin verzorgt en
      opvoedt, de raad voor de kinderbescherming of het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel256
  - number: '256.3'
    text: |-
      Indien de gezinsvoogdij-instelling niet overgaat tot een verzoek tot verlenging doet zij hiervan zo spoedig
      mogelijk en onder overlegging van een verslag van het verloop van de ondertoezichtstelling mededeling aan de raad
      voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel256
  - number: '256.4'
    text: |-
      De kinderrechter kan de ondertoezichtstelling opheffen indien de grond daarvoor niet langer bestaat. Hij kan dit
      doen op verzoek van de gezinsvoogdij-instelling, de met het gezag belaste ouder of de minderjarige van twaalf jaren
      of ouder.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel256
  - number: '257.1'
    text: |-
      De gezinsvoogdij-instelling houdt toezicht op de minderjarige en zorgt dat aan de minderjarige en de met het gezag
      belaste ouder hulp en steun worden geboden teneinde de bedreiging van de zedelijke of geestelijke belangen of de
      gezondheid van de minderjarige af te wenden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel257
  - number: '257.2'
    text: |-
      Deze hulp en steun zijn erop gericht de met het gezag belaste ouder de verantwoordelijkheid voor de verzorging en
      opvoeding zoveel mogelijk te doen behouden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel257
  - number: '257.3'
    text: |-
      Indien het leeftijds- en ontwikkelingsniveau van de minderjarige en diens bekwaamheid en behoefte zelfstandig te
      handelen en zijn leven naar eigen inzicht in te richten daartoe noodzaken, zijn de hulp en steun, meer dan op het
      vergroten van de mogelijkheden van de ouders om hun kind te verzorgen en op te voeden, gericht op het vergroten van
      de zelfstandigheid van de minderjarige.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel257
  - number: '257.4'
    text: De gezinsvoogdij-instelling bevordert de gezinsband tussen de met het gezag belaste ouder en de minderjarige.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel257
  - number: '258.1'
    text: |-
      De gezinsvoogdij-instelling kan ter uitvoering van haar taak schriftelijk aanwijzingen geven betreffende de
      verzorging en opvoeding van de minderjarige.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel258
  - number: '258.2'
    text: De met het gezag belaste ouder en de minderjarige dienen deze aanwijzingen op te volgen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel258
  - number: '258.3'
    text: |-
      Plaatsing van de minderjarige gedurende dag en nacht buiten het gezin geschiedt, behoudens in de gevallen dat
      de met het gezag belaste ouder daartoe zonder bezwaar van de gezinsvoogdij-instelling overgaat, alleen krachtens
      [artikel 261][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel258
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
        afdeling: '4'
  - number: '259.1'
    text: |-
      Op verzoek van de met het gezag belaste ouder of de minderjarige van twaalf jaren of ouder kan de kinderrechter
      een aanwijzing geheel of gedeeltelijk vervallen verklaren. Het verzoek heeft geen schorsende kracht, tenzij de
      kinderrechter het tegendeel bepaalt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel259
  - number: '259.2'
    text: Bij de indiening van het verzoek wordt de beslissing van de gezinsvoogdij-instelling overgelegd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel259
  - number: '259.3'
    text: |-
      De termijn voor het indienen van het verzoek bij de kinderrechter bedraagt twee weken en vangt aan met ingang van
      de dag na die waarop de beslissing is toegezonden of uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel259
  - number: '259.4'
    text: |-
      Ten aanzien van een na afloop van de termijn ingediend verzoek blijft niet-ontvankelijkverklaring op grond daarvan
      achterwege indien de verzoeker redelijkerwijs niet geoordeeld kan worden in verzuim te zijn geweest.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel259
  - number: '260.1'
    text: |-
      De met het gezag belaste ouder en de minderjarige van twaalf jaren of ouder kunnen de gezinsvoogdij-instelling
      verzoeken een aanwijzing wegens gewijzigde omstandigheden geheel of gedeeltelijk in te trekken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel260
  - number: '260.2'
    text: De gezinsvoogdij-instelling geeft een schriftelijke beslissing binnen twee weken na ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel260
  - number: '260.3'
    text: |-
      [Artikel 259][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel259
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel260
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '259'
        afdeling: '4'
  - number: '260.4'
    text: |-
      Het niet of niet tijdig nemen van een beslissing door de gezinsvoogdij-instelling wordt voor de toepassing van
      deze bepaling gelijkgesteld met afwijzing van het verzoek. De termijn voor het indienen van het verzoek bij de
      kinderrechter loopt in dat geval door zolang de gezinsvoogdij-instelling niet heeft beslist en eindigt, indien de
      gezinsvoogdij-instelling alsnog beslist, twee weken daarna.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel260
  - number: '261.1'
    text: |-
      Indien dit noodzakelijk is in het belang van de verzorging en opvoeding van de minderjarige of tot onderzoek van
      diens geestelijke of lichamelijke gesteldheid, kan de kinderrechter de gezinsvoogdij-instelling op haar verzoek
      machtigen de minderjarige gedurende dag en nacht uit huis te plaatsen. Bij het verzoek wordt vermeld voor welke
      voorziening, soort voorziening of andere verblijfplaats de machtiging wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel261
  - number: '261.2'
    text: |-
      De machtiging kan eveneens worden verleend op verzoek van de raad voor de kinderbescherming of van het openbaar
      ministerie. Het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel261
  - number: '261.3'
    text: |-
      Voor plaatsing in een gesloten inrichting is een uitdrukkelijk daartoe strekkende machtiging van de kinderrechter
      vereist. Deze machtiging wordt slechts verleend, indien zij vereist is wegens ernstige gedragsproblemen van
      de minderjarige. Zodra een verzoek tot zulk een machtiging of tot verlenging daarvan bij de kinderrechter is
      ingediend, geeft deze aan het bureau rechtsbijstandvoorziening ambtshalve last een raadsman aan de minderjarige toe
      te voegen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel261
  - number: '261.4'
    text: |-
      Onze Minister van Justitie wijst aan welke inrichtingen als gesloten in de zin van dit artikel worden aangemerkt.
      Deze aanwijzing wordt bekend gemaakt in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel261
  - number: '261.5'
    text: |-
      Bij het verlenen en tenuitvoerleggen van de machtiging letten de kinderrechter en gezinsvoogdij-instelling op de
      godsdienstige gezindheid en de levensovertuiging van de minderjarige en van het gezin, waartoe de minderjarige
      behoort.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel261
  - number: '261.6'
    text: |-
      Plaatsing in een tehuis, behorende tot een categorie, genoemd onder [II, onderdeel 1 tot en met 4](onbekend), of
      onder[ III, onderdeel 2, van de bijlage bij de Wet op de jeugdhulpverlening](onbekend), voor zover dit door Onze
      Minister van Justitie in stand wordt gehouden, eindigt mede door een besluit van Onze Minister van Justitie, de
      gezinsvoogdij-instelling gehoord, wanneer Onze Minister van Justitie dit in verband met een juiste verdeling van de
      in die tehuizen beschikbare plaatsruimte noodzakelijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel261
  - number: '262.1'
    text: |-
      De kinderrechter bepaalt de duur van de machtiging tot uithuisplaatsing op ten hoogste een jaar. Op verzoek van
      de gezinsvoogdij-instelling of van de raad voor de kinderbescherming kan hij de duur telkens met ten hoogste een
      jaar verlengen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel262
  - number: '262.2'
    text: |-
      Indien de gezinsvoogdij-instelling niet overgaat tot een verzoek tot verlenging, doet zij hiervan zo spoedig
      mogelijk en onder overlegging van een verslag van het verloop van de uithuisplaatsing mededeling aan de raad voor
      de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel262
  - number: '262.3'
    text: Een machtiging vervalt, indien deze gedurende drie maanden niet ten uitvoer is gelegd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel262
  - number: '263.1'
    text: |-
      Een uithuisplaatsing kan worden beëindigd door de gezinsvoogdij-instelling. Deze doet hiervan zo spoedig mogelijk
      en onder overlegging van een verslag van het verloop van de uithuisplaatsing mededeling aan de raad voor de
      kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263
  - number: '263.2'
    text: |-
      De met het gezag belaste ouder, een ander die de minderjarige als behorende tot zijn gezin verzorgt en opvoedt
      en de minderjarige van twaalf jaren of ouder kunnen wegens gewijzigde omstandigheden de gezinsvoogdij-instelling
      verzoeken:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263
  - number: 263.2.a
    text: de uithuisplaatsing te beëindigen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263
  - number: 263.2.b
    text: de duur ervan te bekorten;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263
  - number: 263.2.c
    text: |-
      af te zien van een krachtens de machtiging toegestane wijziging van de verblijfplaats van de minderjarige. Onder
      wijziging van de verblijfplaats wordt mede verstaan de plaatsing van de minderjarige bij de ouder die het gezag
      heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263
  - number: '263.3'
    text: De gezinsvoogdij-instelling geeft een schriftelijke beslissing binnen twee weken na ontvangst van het verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263
  - number: '263.4'
    text: |-
      Op verzoek van de in het tweede lid genoemde personen kan de kinderrechter de machtiging geheel of gedeeltelijk
      intrekken of de duur ervan bekorten. [Artikel 259, eerste lid, tweede volzin, tweede, derde en vierde lid][ref1],
      alsmede [artikel 260, vierde lid][ref2], zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel259
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel260
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '259'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '260'
        afdeling: '4'
  - number: 263a.1
    text: |-
      Voor zover noodzakelijk met het oog op het doel van de uithuisplaatsing van een minderjarige als bedoeld in
      [artikel 261][ref1], kan de gezinsvoogdij-instelling voor de duur van de uithuisplaatsing de contacten tussen de
      met het gezag belaste ouder en het kind beperken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
        afdeling: '4'
  - number: 263a.2
    text: |-
      De beslissing van de gezinsvoogdij-instelling geldt als een aanwijzing. [Artikel 259][ref1] en [artikel 260][ref2]
      zijn van overeenkomstige toepassing, met dien verstande dat de kinderrechter een zodanige regeling kan vaststellen
      als hem in het belang van het kind wenselijk voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel259
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel260
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '259'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '260'
        afdeling: '4'
  - number: 263b.1
    text: |-
      Voor de duur van de maatregel kan de kinderrechter op verzoek van de gezinsvoogdij-instelling een rechterlijke
      beslissing tot vaststelling van een regeling inzake de uitoefening van het omgangsrecht wijzigen voor zover dat
      noodzakelijk is met het oog op het doel van de ondertoezichtstelling.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263b
  - number: 263b.2
    text: |-
      Op het verzoek van de met het gezag belaste ouder, de omgangsgerechtigde, de minderjarige van twaalf jaren of ouder
      en de gezinsvoogdij-instelling kan de kinderrechter de in het eerste lid genoemde beslissing wijzigen op grond
      dat nadien de omstandigheden zijn gewijzigd, of dat bij het nemen van de beslissing van onjuiste of onvolledige
      gegevens is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263b
  - number: 263b.3
    text: |-
      Zodra de ondertoezichtstelling is geëindigd, geldt een ingevolge deze bepaling vastgestelde regeling als een
      regeling bedoeld in [artikel 377a][ref1] dan wel [377f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377f
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel263b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377a
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 377f
  - number: '264'
    text: |-
      Indien een medische behandeling van een minderjarige jonger dan twaalf jaren noodzakelijk is om ernstig gevaar
      voor diens gezondheid te voorkomen en de ouder die het gezag heeft zijn toestemming daarvoor weigert, kan deze
      toestemming op verzoek van de gezinsvoogdij-instelling worden vervangen door die van de kinderrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel264
  - number: '265.1'
    text: |-
      Verzoeken op grond van [artikel 254, vierde lid][ref1], en de [artikelen 256-264][ref2] moeten schriftelijk worden
      gedaan. Voor zover zij zich tot de kinderrechter richten, kunnen zij worden ingediend zonder procureur.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel256
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel265
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '256'
        afdeling: '4'
  - number: '265.2'
    text: |-
      De gezinsvoogdij-instelling die een verzoek indient of wordt opgeroepen, zendt bij het verzoekschrift of
      onverwijld na de oproep, het hulpverleningsplan en een verslag van het verloop van de ondertoezichtstelling aan
      de kinderrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel265
  - number: '265.3'
    text: Het plan en het verslag, bedoeld in het tweede lid, worden eveneens gezonden aan de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel265
  - number: '265.4'
    text: |-
      De verzoeken die de gezinsvoogdij-instelling ter uitvoering van haar taak tot de rechter richt, kunnen worden
      ingediend zonder procureur en worden kosteloos behandeld; de grossen, afschriften en uittreksels, die zij tot dat
      doel aanvraagt, worden haar door de griffiers vrij van alle kosten uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel265
  - number: '266'
    text: |-
      Mits het belang van de kinderen zich daar niet tegen verzet, kan de rechtbank een ouder van het gezag over een
      of meer van zijn kinderen ontheffen, op grond dat hij ongeschikt of onmachtig is zijn plicht tot verzorging en
      opvoeding te vervullen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel266
  - number: '267.1'
    text: |-
      Ontheffing wordt slechts uitgesproken op verzoek van de raad voor de kinderbescherming of van het openbaar
      ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel267
  - number: '267.2'
    text: |-
      In het geval, bedoeld bij het [tweede lid onder ][ref1], kan, indien de kinderrechter een verzoek van de ouders
      om toestemming tot wijziging in het verblijf van hun kind heeft afgewezen, de ontheffing bovendien verzocht worden
      door degene, die het kind op het tijdstip van het verzoek ten minste een jaar verzorgd en opgevoed heeft. Indien
      het kind door meer dan een persoon wordt verzorgd en opgevoed, kan het verzoek slechts door dezen gemeenschappelijk
      worden gedaan. Is de ontheffing verzocht, dan blijft het [tweede lid van artikel 253][ref2] buiten toepassing,
      totdat op het verzoek bij gewijsde is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253s
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel267
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '268'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253s
        afdeling: '3'
  - number: '268.1'
    text: Ontheffing kan niet worden uitgesproken, indien de ouder zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel268
  - number: '268.2'
    text: 'Deze regel lijdt uitzondering:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel268
  - number: 268.2.a
    text: |-
      indien na een ondertoezichtstelling van ten minste zes maanden blijkt, of na een uithuisplaatsing krachtens het
      bepaalde in [artikel 261 van dit boek][ref1] van meer dan een jaar en zes maanden gegronde vrees bestaat, dat deze
      maatregel - door de ongeschiktheid of onmacht van een ouder om zijn plicht tot verzorging en opvoeding te vervullen
        - onvoldoende is om de dreiging als bedoeld in [artikel 254][ref2] af te wenden;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel254
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel268
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '254'
        afdeling: '4'
  - number: 268.2.b
    text: |-
      indien zonder de ontheffing van de ene ouder, de ontzetting van de andere ouder de kinderen niet aan diens invloed
      zou onttrekken;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel268
  - number: 268.2.c
    text: |-
      indien de geestvermogens van de ouder zodanig zijn gestoord, dat hij niet in staat is zijn wil te bepalen of de
      betekenis van zijn verklaring te begrijpen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel268
  - number: 268.2.d
    text: |-
      indien na een verzorging en opvoeding met instemming van de ouder - anders dan uit hoofde van een
      ondertoezichtstelling of een plaatsing onder voorlopige voogdij - van ten minste een jaar in een ander gezin dan
      het ouderlijke, een voortzetting daarvan noodzakelijk is en van terugkeer naar de ouder ernstig nadeel voor het
      kind moet worden gevreesd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel268
  - number: '269.1'
    text: |-
      Indien de rechtbank dit in het belang van de kinderen noodzakelijk oordeelt, kan zij een ouder van het gezag over
      een of meer van zijn kinderen ontzetten, op grond van:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel269
  - number: 269.1.a
    text: misbruik van het gezag, of grove verwaarlozing van de verzorging of opvoeding van een of meer kinderen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel269
  - number: 269.1.b
    text: slecht levensgedrag;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel269
  - number: 269.1.c
    text: 'onherroepelijke veroordeling:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel269
  - number: 269.1.c.1°
    text: wegens opzettelijke deelneming aan enig misdrijf met een onder zijn gezag staande minderjarige;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel269
  - number: 269.1.c.2°
    text: |-
      wegens het plegen tegen de minderjarige van een van de misdrijven, omschreven in de [titels XIII-XV][ref1]
      en[ XVIII-XX van het tweede boek van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
  - number: 269.1.c.3°
    text: tot een vrijheidsstraf van twee jaar of langer;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel269
  - number: 269.1.d
    text: |-
      het in ernstige mate veronachtzamen van de aanwijzingen van de gezinsvoogdij-instelling of belemmering van een
      uithuisplaatsing krachtens het bepaalde in [artikel 261][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel269
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
        afdeling: '4'
  - number: 269.1.e
    text: |-
      het bestaan van gegronde vrees voor verwaarlozing van de belangen van het kind, doordat de ouder het kind terugeist
      of terugneemt van anderen, die diens verzorging en opvoeding op zich hebben genomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel269
  - number: '269.2'
    text: Onder misdrijf worden in dit artikel begrepen medeplichtigheid aan en poging tot misdrijf.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel269
  - number: '270.1'
    text: |-
      Ontzetting van het gezag wordt slechts uitgesproken op verzoek van de andere ouder, een van de bloed- of
      aanverwanten van de kinderen tot en met de vierde graad, de raad voor de kinderbescherming of van het openbaar
      ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel270
  - number: '270.2'
    text: |-
      In het geval bedoeld bij het eerste lid van het vorig artikel onder *e*, kan de ontzetting bovendien verzocht
      worden door hem, die de verzorging en opvoeding van het kind op zich genomen heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel270
  - number: '271.1'
    text: |-
      Indien dit dringend en onverwijld noodzakelijk is, kan de rechtbank een ouder, wiens ontzetting verzocht is,
      hangende het onderzoek geheel of gedeeltelijk in de uitoefening van het gezag over een of meer van zijn kinderen
      schorsen. Gelijke bevoegdheid komt haar toe ten opzichte van een ouder, wiens ontheffing verzocht is, in de
      gevallen bedoeld in [artikel 268, tweede lid, van dit boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel268
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '268'
        afdeling: '5'
  - number: '271.2'
    text: |-
      Indien de andere ouder mede het gezag uitoefent, wordt gedurende de schorsing het gezag door hem alleen
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel271
  - number: '271.3'
    text: |-
      Acht de rechtbank in dit laatste geval de schorsing van de te ontzetten ouder onvoldoende om de kinderen aan diens
      invloed te onttrekken, dan kan zij ook de andere ouder schorsen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel271
  - number: '271.4'
    text: |-
      Betreft de schorsing beide ouders of een ouder die het gezag alleen uitoefent, dan belast de rechtbank een voogdij-
      instelling als bedoeld in [artikel 60 van de Wet op de jeugdhulpverlening][ref1] met de voorlopige voogdij over het
      kind. Zij stelt vast welke bevoegdheden ten aanzien van persoon en vermogen van dit kind worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel60
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel271
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '60'
  - number: '271.5'
    text: |-
      De in dit artikel bedoelde beschikkingen blijven van kracht, totdat de uitspraak omtrent de ontzetting of de
      ontheffing in kracht van gewijsde is gegaan. De rechtbank kan zodanige beschikking evenwel met ingang van een
      vroeger tijdstip herroepen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel271
  - number: 271a
    text: |-
      In plaats van schorsing van beide ouders of van een ouder in de uitoefening van het gezag en voorziening in de
      voorlopige voogdij als bedoeld in [artikel 271][ref1], kan de rechtbank een kind onder toezicht stellen als bedoeld
      in [artikel 254 van dit Boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel271
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel254
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel271a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '271'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '254'
        afdeling: '4'
  - number: '272.1'
    text: |-
      Op grond van feiten die tot ontzetting of tot de in het [tweede lid van artikel 268 van dit Boek][ref1] bedoelde
      ontheffing van een ouder kunnen leiden, en indien dit dringend en onverwijld noodzakelijk is, kan de kinderrechter
      de ouders geheel of gedeeltelijk in de uitoefening van het gezag over een kind schorsen en een voogdij-instelling
      als bedoeld in [artikel 60 van de Wet op de jeugdhulpverlening][ref2] belasten met de voorlopige voogdij over een
      kind.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel268
      [ref2]: https://wetten.overheid.nl/BWBR0004608#Artikel60
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel272
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '268'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0004608
        artikel: '60'
  - number: '272.2'
    text: |-
      De kinderrechter beschikt op verzoek van de raad voor de kinderbescherming of de officier van justitie. Hij stelt
      vast welke bevoegdheden ten aanzien van persoon en vermogen van dit kind worden toegekend en bepaalt de duur van
      de maatregel.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel272
  - number: '272.3'
    text: |-
      De maatregel vervalt na afloop van zes weken, tenzij voor het einde van de termijn een verzoek tot ontzetting of
      ontheffing aanhangig is gemaakt. In het laatste geval blijft de maatregel van kracht totdat bij gewijsde over de
      ontzetting of de ontheffing is beslist, tenzij de rechter een kortere termijn heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel272
  - number: '272.4'
    text: |-
      De maatregel kan worden ingetrokken of gewijzigd door de kinderrechter die haar heeft bevolen tenzij een verzoek
      als bedoeld in het derde lid is ingediend. In dat geval beslist de rechter bij wie dit verzoek aanhangig is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel272
  - number: 272a
    text: |-
      De rechtbank die een verzoek tot ontheffing of ontzetting afwijst, is bevoegd een minderjarige onder toezicht te
      stellen als bedoeld in [artikel 254 van dit Boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel272a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
        afdeling: '4'
  - number: '274.1'
    text: |-
      Indien de ouders gezamenlijk het gezag uitoefenen, wordt na de ontheffing of ontzetting van een van hen voortaan
      het gezag door de andere ouder alleen uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel274
  - number: '274.2'
    text: |-
      In geval van ontheffing of ontzetting van een ouder, die het gezag alleen uitoefent, kan de andere ouder
      de rechtbank te allen tijde verzoeken met de uitoefening van het gezag te worden belast. Dit verzoek wordt
      slechts afgewezen, indien gegronde vrees bestaat dat bij inwilliging de belangen van de kinderen zouden worden
      verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel274
  - number: '274.3'
    text: |-
      De rechtbank die het verzoek bedoeld bij het vorige lid heeft afgewezen, kan deze beschikking steeds wijzigen. Zij
      doet dit echter slechts op verzoek van de betrokken ouder, en niet dan op grond van omstandigheden, waarmede de
      rechter bij het geven van de beschikking geen rekening heeft kunnen houden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel274
  - number: '275.1'
    text: |-
      Indien de andere ouder het gezag niet voortaan alleen uitoefent, benoemt de rechtbank een voogd over de
      minderjarigen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel275
  - number: '275.2'
    text: |-
      Ieder die tot uitoefening van de voogdij bevoegd is, kan tijdens het onderzoek schriftelijk aan de rechtbank
      verzoeken met de voogdij te worden belast.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel275
  - number: '275.3'
    text: |-
      In geval van ontheffing met toepassing van het [tweede lid onder ][ref1], benoemt de rechtbank bij voorkeur tot
      voogd degene, dan wel een dergenen, die op het tijdstip van het verzoek het kind ten minste een jaar heeft verzorgd
      en opgevoed, mits deze bevoegd is tot uitoefening van de voogdij.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel268
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel275
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '268'
        afdeling: '5'
  - number: '276.1'
    text: |-
      Indien de ontheven of ontzette ouder het bewind over het vermogen van zijn kinderen voerde, wordt hij tevens
      veroordeeld tot het afleggen van rekening en verantwoording aan zijn opvolger in dit bewind.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel276
  - number: '276.2'
    text: |-
      Hebben de kinderen goederen gemeen, maar komen zij onder het gezag van verschillende personen, dan kan de rechtbank
      een van dezen of een derde aanwijzen om over deze goederen tot de verdeling het bewind te voeren. De aangewezen
      bewindvoerder stelt de waarborgen die de rechtbank van hem verlangt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel276
  - number: '276.3'
    text: |-
      Op het bewind krachtens het vorige lid is [artikel 253k][ref1] van toepassing, indien een der ouders als
      bewindvoerder is aangewezen, en anders paragraaf 10 van afdeling 6 van deze titel. De bewindvoerder is bij
      uitsluiting bevoegd tot vernietiging van rechtshandelingen van minderjarige deelgenoten, strekkend tot beheer of
      beschikking met betrekking tot de onder bewind staande goederen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253k
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel276
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253k
        paragraaf: '3'
        afdeling: '2'
  - number: '277.1'
    text: |-
      Indien de rechtbank overtuigd is, dat een minderjarige wederom aan zijn ontheven of ontzette ouder mag worden
      toevertrouwd, kan zij deze ouder op zijn verzoek in het gezag herstellen. Indien de niet met elkaar gehuwde ouders
      gezamenlijk het gezag willen uitoefenen, wordt het verzoek daartoe door hen beiden gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel277
  - number: '277.2'
    text: |-
      Indien bij gelegenheid van de ontzetting of ontheffing het gezag aan de andere ouder was opgedragen, belast
      de rechtbank de ontheven of ontzette ouder die alleen het in het eerste lid bedoelde verzoek doet, niet met
      het gezag, tenzij de omstandigheden na het nemen van de beschikking waarbij het gezag aan de andere ouder werd
      opgedragen, zijn gewijzigd of bij het nemen van de beschikking van onjuiste of onvolledige gegevens is uitgegaan.
      [Artikel 253][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel277
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '253'
        paragraaf: '1'
        afdeling: '2'
  - number: '278.1'
    text: |-
      Een verzoek als bedoeld in [artikel 277 van dit boek][ref1] kan ook worden gedaan door de raad voor de
      kinderbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel277
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel278
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '277'
        afdeling: '5'
  - number: '278.2'
    text: |-
      Hangende het onderzoek kan zowel de raad voor de kinderbescherming als de te herstellen ouder de rechtbank
      verzoeken de beslissing aan te houden tot het einde van een door haar te bepalen proeftijd van ten hoogste zes
      maanden; gedurende die tijd zal het kind bij de in het gezag te herstellen ouder verblijven. De rechtbank is te
      allen tijde bevoegd de proeftijd te beëindigen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel278
  - number: '280'
    text: 'De voogdij begint:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel280
  - number: 280.a
    text: |-
      voor de voogd die door een ouder is benoemd: op het tijdstip waarop hij zich na het overlijden van deze ouder
      bereid verklaart de voogdij te aanvaarden. De verklaring moet door de betrokkene in persoon of bij bijzondere
      gevolmachtigde worden afgelegd ter griffie van de rechtbank die overeenkomstig de [ tweede afdeling van de
      derde titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend) in zaken betreffende
      minderjarigen bevoegd is. De verklaring moet worden afgelegd binnen veertien dagen, of - indien de persoon, die de
      verklaring moet afleggen, zich buiten Nederland bevindt - binnen twee maanden, nadat de benoeming is betekend. Tot
      betekening kan iedere belanghebbende, alsmede de raad voor de kinderbescherming opdracht geven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel280
  - number: 280.b
    text: |-
      voor de voogd die - nadat hij zich bereid heeft verklaard de voogdij te aanvaarden - door de rechter is benoemd: op
      de dag, waarop de beslissing die de benoeming inhoudt, in kracht van gewijsde is gegaan, of - zo deze uitvoerbaar
      bij voorraad is verklaard - daags nadat de beslissing die de benoeming inhoudt, is verstrekt of verzonden. Een
      mondelinge bereidverklaring geschiedt ten overstaan van de rechter die benoemt; een schriftelijke bereidverklaring
      wordt neergelegd ter griffie waar de benoeming zal geschieden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel280
  - number: '281.1'
    text: 'De voogdij eindigt op de dag, waarop in kracht van gewijsde is gegaan de beschikking waarbij:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel281
  - number: 281.1.a
    text: de voogd is ontslagen of ontzet;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel281
  - number: 281.1.b
    text: het gezag over de onder zijn voogdij staande minderjarige aan een of beide ouders is opgedragen; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel281
  - number: 281.1.c
    text: |-
      de voogdij overeenkomstig [artikel 299a][ref1] of [302 lid 4 van dit boek][ref2] aan een andere voogd is
      opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel299a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel281
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 299a
        paragraaf: '3'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '302'
        paragraaf: '4'
        afdeling: '6'
  - number: '281.2'
    text: |-
      Is een beschikking als in het eerste lid bedoeld, uitvoerbaar verklaard bij voorraad, dan eindigt de voogdij daags
      nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel281
  - number: '282.1'
    text: |-
      Op eensluidend verzoek van de voogd en een ander die in een nauwe persoonlijke betrekking tot het kind staat, kan
      de rechter bepalen dat de voogdij door hen gezamenlijk wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282
  - number: '282.2'
    text: |-
      Voor de duur van de gezamenlijke uitoefening van de voogdij worden beide in het eerste lid bedoelde personen als
      voogd aangemerkt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282
  - number: '282.3'
    text: |-
      Het verzoek wordt afgewezen indien gegronde vrees bestaat dat bij inwilliging de belangen van het kind zouden
      worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282
  - number: '282.4'
    text: |-
      Gezamenlijke uitoefening van de voogdij is niet mogelijk ten aanzien van tijdelijke voogdij als bedoeld in de
      [artikelen 296][ref1] en [297][ref2]. Zij staat niet open voor rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel296
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel297
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '296'
        paragraaf: '3'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '297'
        paragraaf: '3'
        afdeling: '6'
  - number: '282.5'
    text: |-
      [Artikel 253a][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: '282.6'
    text: |-
      In afwijking van [artikel 336][ref1] hebben twee voogden die gezamenlijk de voogdij uitoefenen, de plicht en het
      recht het minderjarige kind te verzorgen en op te voeden. [Artikel 253w][ref2] is, zolang de gezamenlijke voogdij
      voortduurt, ten aanzien van hen beiden van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel336
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253w
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '336'
        paragraaf: '9'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253w
        paragraaf: '3'
        afdeling: 3A
  - number: '282.7'
    text: |-
      Een verzoek als bedoeld in het eerste lid kan vergezeld gaan van een verzoek tot wijziging van de geslachtsnaam van
      het kind in de geslachtsnaam van een van de voogden. Een zodanig verzoek wordt afgewezen, indien:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282
  - number: 282.7.a
    text: het kind van twaalf jaar of ouder ter gelegenheid van zijn verhoor niet heeft ingestemd met het verzoek;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282
  - number: 282.7.b
    text: het verzoek tot gezamenlijke voogdij wordt afgewezen; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282
  - number: 282.7.c
    text: het belang van het kind zich tegen toewijzing verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282
  - number: 282a
    text: |-
      De gezamenlijke uitoefening van de voogdij eindigt op de dag waarop in kracht van gewijsde is gegaan de beschikking
      waarbij de gezamenlijke uitoefening van de voogdij is beëindigd of waarbij de voogdij is geëindigd ingevolge
      [artikel 281][ref1], alsmede na het overlijden van een van de voogden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel281
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '281'
        paragraaf: '1'
        afdeling: '6'
  - number: 282b
    text: |-
      Na de dood van een voogd die de voogdij samen met een ander uitoefende, oefent de andere voogd voortaan alleen de
      voogdij over de kinderen uit.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel282b
  - number: '292.1'
    text: |-
      Een ouder kan bij uiterste wilsbeschikking bepalen welke persoon dan wel welke twee personen na zijn dood voortaan
      als voogd onderscheidenlijk als gezamenlijke voogden het gezag over zijn kinderen zal uitoefenen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel292
  - number: '292.2'
    text: Hij kan geen rechtspersoon als voogd aanwijzen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel292
  - number: '292.3'
    text: |-
      Hebben beide ouders van deze bevoegdheid gebruik gemaakt, en sterven zij, zonder dat men kan weten wie het eerst
      overleden is, dan bepaalt de kantonrechter ambtshalve wiens beschikking gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel292
  - number: '293'
    text: 'De door de ouder getroffen regeling heeft geen gevolg of vervalt:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel293
  - number: 293.a
    text: |-
      indien na zijn overlijden de andere ouder van rechtswege of krachtens rechterlijke beschikking het gezag over zijn
      kinderen uitoefent;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel293
  - number: 293.b
    text: indien en voor zover hij op het tijdstip van zijn overlijden het gezag over zijn kinderen niet heeft;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel293
  - number: 293.c
    text: indien de ander die met de ouder gezamenlijk het gezag uitoefent van rechtswege de voogd over de kinderen wordt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel293
  - number: '295'
    text: |-
      De kantonrechter benoemt een voogd over alle minderjarigen, die niet onder ouderlijk gezag staan en in wier voogdij
      niet op wettige wijze is voorzien, tenzij deze benoeming aan de rechtbank is opgedragen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel295
  - number: '296.1'
    text: |-
      Is voorziening nodig in afwachting van het begin der voogdij overeenkomstig [artikel 280 van dit boek][ref1], dan
      benoemt de kantonrechter een voogd voor de duur van deze omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel280
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel296
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '280'
        paragraaf: '1'
        afdeling: '6'
  - number: '296.2'
    text: |-
      Zodra bedoelde omstandigheden zijn vervallen, wordt deze voogd op verzoek van hem die hij vervangt, door de
      kantonrechter ontslagen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel296
  - number: '297.1'
    text: 'De kantonrechter benoemt insgelijks een voogd, wanneer voorziening nodig is wegens:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel297
  - number: 297.1.a
    text: tijdelijke onmogelijkheid, waarin een voogd zich bevindt, het gezag uit te oefenen; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel297
  - number: 297.1.b
    text: onbekendheid van bestaan of verblijfplaats van de voogd; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel297
  - number: 297.1.c
    text: in gebreke blijven van de voogd, het gezag uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel297
  - number: '297.2'
    text: |-
      Is de benoeming op het eerste lid onder *c* gegrond, dan kan de kantonrechter de benoemde voogd een beloning
      toekennen en is de in gebreke gebleven voogd jegens de minderjarige aansprakelijk voor de kosten die de vervanging
      veroorzaakt, alsmede, behoudens zijn verhaal op de benoemde voogd, voor diens verrichtingen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel297
  - number: '297.3'
    text: |-
      Zodra de in het eerste lid genoemde omstandigheden zijn vervallen, wordt de benoemde voogd op eigen verzoek of
      op verzoek van degene die hij vervangt, door de kantonrechter ontslagen, tenzij gegronde vrees bestaat dat bij
      inwilliging de belangen van de kinderen zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel297
  - number: '297.4'
    text: |-
      Indien in geval van gezamenlijke uitoefening van de voogdij een van de in het eerste lid bedoelde omstandigheden
      zich voordoet ten aanzien van een van beide voogden, oefent de andere voogd het gezag over de kinderen alleen uit.
      Zodra deze omstandigheid is vervallen, herleeft de gezamenlijke voogdij. Het tweede lid is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel297
  - number: '298'
    text: |-
      Gedurende de in de beide voorgaande artikelen bedoelde voogdij is de uitoefening van de voogdij geschorst ten
      aanzien van de voogd die het betreft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel298
  - number: '299'
    text: |-
      De kantonrechter benoemt de voogd op verzoek van bloed- of aanverwanten van de minderjarige, de raad voor de
      kinderbescherming, schuldeisers of andere belanghebbenden, of ambtshalve, behoudens [artikel 282a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel282a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel299
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 282a
        paragraaf: '1'
        afdeling: '6'
  - number: 299a.1
    text: |-
      Degene die met instemming van de voogd een minderjarige in zijn gezin - anders dan uit hoofde van een
      ondertoezichtstelling of een plaatsing onder voorlopige voogdij - ten minste een jaar heeft verzorgd en opgevoed,
      kan de kinderrechter verzoeken hem, dan wel een rechtspersoon als bedoeld in [artikel 302 van dit boek][ref1], tot
      voogd te benoemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel299a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '302'
        paragraaf: '4'
        afdeling: '6'
  - number: 299a.2
    text: |-
      Indien de minderjarige door meer dan een persoon als behorende tot het gezin wordt verzorgd en opgevoed, kan het
      verzoek slechts door dezen gemeenschappelijk worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel299a
  - number: 299a.3
    text: Het verzoek kan ook worden gedaan door de raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel299a
  - number: 299a.4
    text: |-
      De kinderrechter willigt het verzoek slechts in, indien hij dit in het belang van de minderjarige acht en hem
      genoegzaam is gebleken, dat de voogd niet bereid is zich van zijn bediening te doen ontslaan. Alsdan benoemt hij
      bij voorkeur degene wiens benoeming wordt verzocht tot voogd, mits deze bevoegd is tot uitoefening van de voogdij.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel299a
  - number: 299a.5
    text: |-
      Is het bij het eerste lid bedoelde verzoek gedaan, dan blijft het [tweede lid van artikel 336][ref1] buiten
      toepassing, totdat op het verzoek bij gewijsde is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel336a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel299a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 336a
        paragraaf: '9'
        afdeling: '6'
  - number: 299a.6
    text: |-
      In geval van gezamenlijke uitoefening van de voogdij wordt de in het eerste lid bedoelde instemming door beide
      voogden gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel299a
  - number: '301.1'
    text: 'De ambtenaar van de burgerlijke stand geeft de kantonrechter onverwijld kennis:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel301
  - number: 301.1.a
    text: van het overlijden van ieder die minderjarige kinderen achterlaat;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel301
  - number: 301.1.b
    text: van de aangifte van geboorte van ieder kind, waarover de moeder niet van rechtswege het gezag uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel301
  - number: '301.2'
    text: |-
      Indien het huwelijk van de overledene die minderjarige kinderen nalaat, gerechtelijk was ontbonden, of de
      overledene van tafel en bed gescheiden was, bericht de ambtenaar van de burgerlijke stand - zo de andere ouder nog
      leeft - deze omstandigheden tevens aan de kantonrechter; deze zendt alsdan de door hem ontvangen kennisgeving door
      aan de rechtbank, die over het verzoek tot ontbinding van het huwelijk of tot scheiding van tafel en bed heeft
      beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel301
  - number: '302.1'
    text: |-
      De rechter kan de voogdij opdragen aan een voogdij-instelling die als zodanig door Onze Minister van Justitie op
      grond van [artikel 60, eerste lid, onder ][ref1] wordt gesubsidieerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel60
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel302
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '60'
  - number: '302.2'
    text: |-
      De rechter die de voogdij aan een rechtspersoon opdraagt, let hierbij op de godsdienstige gezindheid of de
      levensovertuiging van de minderjarige en van het gezin, waartoe deze behoort.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel302
  - number: '302.3'
    text: |-
      Elke voogdij van een rechtspersoon die door fusie of splitsing ophoudt te bestaan, gaat over op de verkrijgende
      rechtspersoon onderscheidenlijk in overeenstemming met het voorstel tot splitsing op een van de verkrijgende
      rechtspersonen, een en ander mits de verkrijgende rechtspersoon een rechtspersoon is waaraan de rechter krachtens
      lid 1 een voogdij kan opdragen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel302
  - number: '302.4'
    text: |-
      Niettemin kan de kantonrechter vervolgens op verzoek van bloed- en aanverwanten van de minderjarige, van de raad
      voor de kinderbescherming, van belanghebbenden of ambtshalve, de voogdij aan een ander opdragen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel302
  - number: '303.1'
    text: |-
      Voor zover de wet niet anders bepaalt, heeft de met voogdij belaste rechtspersoon dezelfde bevoegdheden en
      verplichtingen als andere voogden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel303
  - number: '303.2'
    text: |-
      De uitoefening van de voogdij geschiedt door het bestuur. Dit kan een of meer van zijn leden schriftelijk machtigen
      tot de uitoefening van de voogdij over de minderjarigen die in de machtiging zijn genoemd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel303
  - number: '304.1'
    text: |-
      Met de rechtspersoon zijn de bestuurders hoofdelijk en persoonlijk aansprakelijk voor iedere schade, die te wijten
      is aan een niet-behoorlijke uitoefening van de voogdij.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel304
  - number: '304.2'
    text: |-
      Iedere bestuurder zal zich echter van zijn aansprakelijkheid kunnen bevrijden door te bewijzen, dat hij geen schuld
      heeft aan de schade.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel304
  - number: '304.3'
    text: |-
      Indien het bestuur overeenkomstig het tweede lid van het vorige artikel een of meer van zijn leden in het bijzonder
      tot de uitoefening van de voogdij gemachtigd heeft, wordt vermoed, dat de schade uitsluitend aan de schuld van deze
      leden te wijten is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel304
  - number: '305.1'
    text: |-
      De rechtspersoon, die hem toevertrouwde minderjarigen uit huis plaatst, houdt de raad voor de kinderbescherming
      schriftelijk op de hoogte van de plaatsen waar zij zich bevinden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel305
  - number: '305.2'
    text: |-
      De plaatsen, waar met voogdij belaste rechtspersonen minderjarigen geplaatst hebben, worden door de raad voor de
      kinderbescherming bezocht, zo vaak hij dit ter beoordeling van de toestand der minderjarigen dienstig acht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel305
  - number: '305.3'
    text: |-
      De [artikelen 261, derde tot en met zesde lid][ref1], [262, eerste en derde lid][ref2],
      [263, eerste lid, eerste volzin, en vierde lid, eerste volzin][ref3], en [265, eerste lid][ref4], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel262
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel263
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel265
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel305
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '262'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '263'
        afdeling: '4'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '265'
        afdeling: '4'
  - number: '306.1'
    text: |-
      Zonder toestemming van de kantonrechter mag een rechtspersoon een hem toevertrouwde minderjarige niet buiten
      Nederland plaatsen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel306
  - number: '306.2'
    text: De kantonrechter verleent deze toestemming slechts, indien hij de plaatsing voor de minderjarige wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel306
  - number: 306a
    text: |-
      De [zesde afdeling][ref1] van deze titel is niet van toepassing op de uitoefening van de voorlopige voogdij als
      bedoeld in de [artikelen 241][ref2], [271][ref3], [272][ref4], [331][ref5] en [332 van dit Boek][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling6
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel241
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel271
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel272
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel331
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel332
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel306a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '241'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '271'
        afdeling: '5'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '272'
        afdeling: '5'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '331'
        paragraaf: '8'
        afdeling: '6'
      - id: ref6
        bwb_id: BWBR0002656
        artikel: '332'
        paragraaf: '8'
        afdeling: '6'
  - number: '322.1'
    text: 'Iedere voogd kan zich van zijn bediening doen ontslaan, indien:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel322
  - number: 322.1.a
    text: |-
      hij aantoont, dat hij tengevolge van een sedert de aanvang van zijn bediening opgekomen geestelijk of lichamelijk
      gebrek niet meer in staat is deze waar te nemen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel322
  - number: 322.1.b
    text: hij de vijfenzestigjarige leeftijd bereikt heeft;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel322
  - number: 322.1.c
    text: |-
      een daartoe bevoegd persoon zich schriftelijk heeft bereid verklaard de voogdij over te nemen, en de kantonrechter
      deze overneming in het belang van de minderjarigen acht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel322
  - number: '322.2'
    text: |-
      Bij gezamenlijke uitoefening van de voogdij is het eerste lid slechts van toepassing indien beide voogden zich van
      hun bediening willen doen ontslaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel322
  - number: '323'
    text: |-
      Op verzoek van de voogden gezamenlijk of van een van hen beëindigt de rechter de gezamenlijke uitoefening van de
      voogdij. Alsdan bepaalt de rechter aan wie van beide voortaan het gezag over ieder der minderjarige kinderen alleen
      zal toekomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel323
  - number: '324.1'
    text: |-
      Wanneer een voogd op een der in [artikel 246 van dit boek][ref1] genoemde gronden onbevoegd is tot de voogdij,
      ontslaat de kantonrechter hem en vervangt hem door een andere voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel324
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
  - number: '324.2'
    text: |-
      Hij doet dit op verzoek van de voogd, bloed- of aanverwanten van de minderjarige, de raad voor de
      kinderbescherming, schuldeisers of andere belanghebbenden, of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel324
  - number: '324.3'
    text: |-
      Indien in geval van gezamenlijke uitoefening van de voogdij een van de in het eerste lid genoemde gronden zich
      voordoet ten aanzien van een van beide voogden, oefent de andere voogd het gezag over de kinderen alleen uit.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel324
  - number: '324.4'
    text: Zodra de grond van de onbevoegdheid is vervallen, herleeft de gezamenlijke voogdij.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel324
  - number: '326.1'
    text: Kinderen die onder voogdij staan van natuurlijke personen, kunnen onder toezicht worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel326
  - number: '326.2'
    text: |-
      Op deze ondertoezichtstelling zijn de bepalingen der [artikelen 254-265 van dit boek][ref1] van overeenkomstige
      toepassing, met dien verstande nochtans, dat de ondertoezichtstelling en de verlenging daarvan ook door de voogd
      kunnen worden verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel326
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
        afdeling: '4'
  - number: '327.1'
    text: |-
      Indien de rechtbank dit in het belang van die minderjarigen noodzakelijk oordeelt, kan zij een voogd ten aanzien
      van een of meer tot een zelfde voogdij behorende minderjarigen ontzetten op grond van:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
  - number: 327.1.a
    text: slecht levensgedrag;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
  - number: 327.1.b
    text: |-
      misbruik van zijn bevoegdheid, verwaarlozing van zijn verplichtingen, of de omstandigheid dat hij niet in staat is
      tot een behoorlijke uitoefening van zijn voogdij;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
  - number: 327.1.c
    text: |-
      de omstandigheid, dat hij op een der beide voorgaande gronden van een andere voogdij - of op overeenkomstige
      gronden van het ouderlijk gezag - is ontzet;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
  - number: 327.1.d
    text: |-
      de omstandigheid, dat hij in staat van faillissement verkeert of dat ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
  - number: 327.1.e
    text: |-
      de omstandigheid, dat hij in persoon, of dat zijn ouder, echtgenoot of kind met de minderjarige een proces voert,
      waarbij diens staat of een aanmerkelijk gedeelte van diens vermogen betrokken is;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
  - number: 327.1.f
    text: 'onherroepelijke veroordeling:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
  - number: 327.1.f.1°
    text: wegens opzettelijke deelneming aan enig misdrijf met een onder zijn gezag staande minderjarige;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
  - number: 327.1.f.2°
    text: |-
      wegens het plegen tegen de minderjarige van een der misdrijven, omschreven in de [titels XIII-XV][ref1] en
      [XVIII-XX van het tweede boek van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0001854
      - id: ref2
        bwb_id: BWBR0001854
  - number: 327.1.f.3°
    text: tot een vrijheidsstraf van twee jaar of langer;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
  - number: 327.1.g
    text: |-
      het in ernstige mate veronachtzamen van de aanwijzingen van de gezinsvoogdij-instelling of belemmering van een
      uithuisplaatsing krachtens het bepaalde in [artikel 261][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel261
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '261'
        afdeling: '4'
  - number: 327.1.h
    text: |-
      het bestaan van gegronde vrees voor verwaarlozing van de belangen van een onder zijn gezag staande minderjarige,
      doordat hij de minderjarige terugeist of terugneemt van anderen, die diens verzorging en opvoeding op zich hebben
      genomen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
  - number: 327.1.i
    text: |-
      de omstandigheid dat hij niet beschikt over de ingevolge
      [artikel 2 van de Wet opneming buitenlandse kinderen ter adoptie][ref1] vereiste beginseltoestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004447#Artikel2
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
    references:
      - id: ref1
        bwb_id: BWBR0004447
        artikel: '2'
  - number: '327.2'
    text: Onder misdrijf worden in dit artikel begrepen medeplichtigheid aan en poging tot misdrijf.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel327
  - number: '328'
    text: |-
      Ontzetting van een met voogdij belaste rechtspersoon kan slechts op de in het eerste lid van het vorige artikel
      onder b-e genoemde gronden geschieden. Zijn ontzetting kan echter bovendien plaats hebben, indien hij nalaat
      de raad voor de kinderbescherming overeenkomstig [artikel 305 van dit boek][ref1] op de hoogte te houden van
      de plaatsen, waar de hem toevertrouwde minderjarigen zich bevinden, ofwel indien hij het door de raad voor de
      kinderbescherming uit te oefenen toezicht belemmert of verhindert.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel305
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel328
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '305'
        paragraaf: '4'
        afdeling: '6'
  - number: '329.1'
    text: |-
      Ontzetting van de voogdij kan slechts worden uitgesproken op verzoek van een voogd, een der bloed- of aanverwanten
      van de minderjarige tot en met de vierde graad, de raad voor de kinderbescherming of van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel329
  - number: '329.2'
    text: |-
      In het geval, bedoeld bij het [eerste lid van artikel 327 onder ][ref1], kan de ontzetting bovendien verzocht
      worden door hem, die de verzorging en opvoeding van de minderjarige op zich heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel327
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '327'
        paragraaf: '8'
        afdeling: '6'
  - number: '329.3'
    text: |-
      In het geval, bedoeld bij [artikel 367 van dit boek][ref1] kan de rechtbank de ontzetting uitspreken, ook al had de
      raad voor de kinderbescherming deze niet verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel367
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '367'
        paragraaf: '10'
        afdeling: '6'
  - number: '331.1'
    text: |-
      Indien dit dringend en onverwijld noodzakelijk is, kan de rechtbank een voogd, wiens ontzetting verzocht
      is, hangende haar onderzoek geheel of gedeeltelijk in de uitoefening van zijn voogdij over een of meer der
      minderjarigen schorsen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel331
  - number: '331.2'
    text: |-
      Indien in geval van gezamenlijke uitoefening van de voogdij de rechtbank de schorsing van de te ontzetten voogd
      onvoldoende acht om de kinderen aan diens invloed te onttrekken, dan kan zij ook de andere voogd schorsen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel331
  - number: '331.3'
    text: |-
      Indien in geval van gezamenlijke uitoefening van de voogdij slechts een van de voogden wordt geschorst, wordt
      gedurende de schorsing het gezag door de andere voogd alleen uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel331
  - number: '331.4'
    text: |-
      In de in het eerste en tweede lid bedoelde gevallen vertrouwt de rechtbank een voogdij-instelling als bedoeld in
      [artikel 60 van de Wet op de jeugdhulpverlening][ref1] met de voorlopige voogdij over de minderjarige. Zij stelt
      vast welke bevoegdheden ten aanzien van persoon en vermogen van deze minderjarige worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel60
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel331
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '60'
  - number: '331.5'
    text: |-
      De in dit artikel bedoelde beschikkingen blijven van kracht, totdat de uitspraak omtrent de ontzetting in
      kracht van gewijsde is gegaan. De rechtbank kan zodanige beschikking evenwel met ingang van een vroeger tijdstip
      herroepen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel331
  - number: 331a
    text: |-
      In plaats van schorsing van de voogd in de uitoefening van de voogdij en voorziening in de voorlopige voogdij
      als bedoeld in [artikel 331][ref1], kan de rechtbank de minderjarige onder toezicht stellen als bedoeld in
      [artikel 254 van dit Boek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel331
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel254
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel331a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '331'
        paragraaf: '8'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '254'
        afdeling: '4'
  - number: '332'
    text: |-
      Op grond van feiten die tot ontzetting van de voogdij kunnen leiden, en indien dit dringend en
      onverwijld noodzakelijk is, kan de kinderrechter de voogd of voogden geheel of gedeeltelijk schorsen
      in de uitoefening van het gezag over een minderjarige en een voogdij-instelling als bedoeld in
      [artikel 60 van de Wet op de jeugdhulpverlening][ref1] belasten met de voorlopige voogdij over deze minderjarige.
      [Artikel 272, tweede, derde en vierde lid, van dit Boek][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel272
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel332
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '272'
        afdeling: '5'
  - number: 332a
    text: |-
      De rechtbank die een verzoek tot ontzetting afwijst, is bevoegd een minderjarige onder toezicht te stellen als
      bedoeld in [artikel 254 van dit Boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel332a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
        afdeling: '4'
  - number: '334.1'
    text: |-
      Indien de rechtbank de ontzetting uitspreekt, voorziet zij tevens in het gezag, behoudens het bepaalde in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel334
  - number: '334.2'
    text: |-
      Ieder die tot de uitoefening van het gezag bevoegd is, kan tijdens het onderzoek schriftelijk aan de rechtbank
      verzoeken daarmede te worden belast.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel334
  - number: '334.3'
    text: |-
      Indien sprake is van gezamenlijke uitoefening van de voogdij en de ontzetting slechts een van de voogden betreft,
      wordt de voogdij voortaan door de andere voogd alleen uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel334
  - number: '335'
    text: |-
      Hij die van de voogdij over een bepaalde minderjarige is ontzet, kan niet wederom tot voogd over die minderjarige
      worden benoemd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel335
  - number: '336'
    text: De voogd draagt zorg, dat de minderjarige overeenkomstig diens vermogen wordt verzorgd en opgevoed.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel336
  - number: 336a.1
    text: |-
      Indien de minderjarige door een ander of anderen dan zijn voogd, als behorende tot het gezin met instemming van de
      voogd ten minste een jaar is verzorgd en opgevoed geworden, kan de voogd niet dan met toestemming van degenen die
      de verzorging en opvoeding op zich hebben genomen, wijziging in het verblijf van de minderjarige brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel336a
  - number: 336a.2
    text: |-
      Voor zover de volgens het vorige lid vereiste toestemmingen niet worden verkregen, kunnen zij op verzoek van de
      voogd door die van de rechtbank worden vervangen. Dit verzoek wordt slechts ingewilligd, indien de rechtbank dit in
      het belang van de minderjarige acht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel336a
  - number: 336a.3
    text: |-
      In geval van afwijzing van het verzoek is de beschikking van kracht gedurende een door de rechtbank te bepalen
      termijn, welke de duur van zes maanden niet te boven mag gaan. Is echter voor het einde van deze termijn een
      verzoek tot ondertoezichtstelling van het kind, tot ontzetting van de voogd, dan wel een verzoek als bedoeld in
      [artikel 299][ref1] aanhangig gemaakt, dan blijft de beschikking gelden, totdat op het verzoek bij gewijsde is
      beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel299a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel336a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 299a
        paragraaf: '3'
        afdeling: '6'
  - number: 336a.4
    text: |-
      In geval van gezamenlijke uitoefening van de voogdij, wordt de in het eerste lid bedoelde instemming door beide
      voogden gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel336a
  - number: '337.1'
    text: De voogd vertegenwoordigt de minderjarige in burgerlijke handelingen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel337
  - number: '337.2'
    text: |-
      De voogd moet het bewind over het vermogen van de minderjarige als een goed voogd voeren. Bij slecht bewind is hij
      voor de daardoor veroorzaakte schade aansprakelijk.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel337
  - number: '337.3'
    text: |-
      Indien goederen die de minderjarige geschonken of vermaakt zijn, onder bewind zijn gesteld, is de voogd bevoegd van
      de bewindvoerder rekening en verantwoording te vorderen. Vervalt dit bewind, dan komen de goederen onder het bewind
      van de voogd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel337
  - number: 337a.1
    text: |-
      In geval van gezamenlijke uitoefening van de voogdij worden de bevoegdheden die de voogd ingevolge de paragrafen
      10 en 11 heeft, gezamenlijk door de voogden uitgeoefend, met dien verstande dat de bevoegdheden ook aan een voogd
      alleen toekomen tenzij van bezwaren van de andere voogd is gebleken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel337a
  - number: 337a.2
    text: De in bedoelde paragrafen genoemde verplichtingen rusten op ieder van de voogden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel337a
  - number: '338.1'
    text: |-
      De voogd zorgt dat het vermogen van de minderjarige, zoals dit bij het begin van zijn voogdij is samengesteld, zo
      spoedig mogelijk wordt geïnventariseerd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel338
  - number: '338.2'
    text: |-
      Binnen acht weken na het begin van zijn voogdij doet de voogd ter griffie van de rechtbank van het arrondissement
      waarin de woonplaats van de minderjarige is gelegen schriftelijk opgave van de bij dat begin aanwezige gerede
      gelden, effecten aan toonder en spaarbankboekjes.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel338
  - number: '338.3'
    text: |-
      Binnen acht maanden na het begin van zijn voogdij levert de voogd een ter bevestiging van haar deugdelijkheid door
      hem ondertekende boedelbeschrijving in ter griffie van de rechtbank van het arrondissement waarin de woonplaats van
      de minderjarige is gelegen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel338
  - number: '338.4'
    text: |-
      In de boedelbeschrijving is begrepen een opgave van de wijzigingen in de samenstelling van het vermogen tot het
      ogenblik dat zij wordt opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel338
  - number: '339.1'
    text: |-
      Wanneer de goederen van de minderjarigen een waarde van € 11 250 niet te boven gaan, kan de voogd een door hem
      ondertekende, volgens een door Onze Minister van Justitie vastgesteld model opgemaakte, verklaring daaromtrent
      in plaats van de boedelbeschrijving inleveren. De voogd van twee of meer kinderen van dezelfde ouders kan met een
      zodanige verklaring slechts volstaan, wanneer bovendien de goederen der minderjarigen tezamen een waarde van € 22
      500 niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel339
  - number: '339.2'
    text: |-
      De kantonrechter kan te allen tijde bepalen dat alsnog een beschrijving van het vermogen van de minderjarige, zoals
      dit op de datum van zijn beschikking is samengesteld, met overeenkomstige toepassing van het vorige artikel moet
      worden opgemaakt en ingeleverd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel339
  - number: '340.1'
    text: |-
      De kantonrechter kan bij gebleken noodzakelijkheid een langere termijn voor de inlevering van een
      boedelbeschrijving of een verklaring, als bedoeld in het vorige artikel, stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel340
  - number: '340.2'
    text: |-
      Indien binnen de daarvoor gestelde termijn geen boedelbeschrijving, noch een verklaring als bedoeld in het vorige
      artikel is ingeleverd, doet de kantonrechter binnen tien dagen na het einde van die termijn de voogd ten verhore
      oproepen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel340
  - number: '341.1'
    text: |-
      In de boedelbeschrijving of in de verklaring, bedoeld in [artikel 339 van dit boek][ref1], moet de voogd opgeven
      wat hij van de minderjarige heeft te vorderen. Bij gebreke hiervan zal hij zijn vorderingsrecht niet voor diens
      meerderjarigheid kunnen uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel339
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel341
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
  - number: '341.2'
    text: Zolang de voogd zijn vorderingsrecht niet kan uitoefenen, draagt de hoofdsom van zijn vordering geen rente.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel341
  - number: '342.1'
    text: |-
      De vier vorige artikelen zijn van overeenkomstige toepassing, wanneer de minderjarige gedurende de voogdij door
      schenking, erfopvolging of making vermogen krijgt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel342
  - number: '342.2'
    text: |-
      De inspecteur bij wie de aangifte voor het recht van successie, van overgang of van schenking moet worden
      ingediend, en aan wie ambtshalve bekend is dat de minderjarige vermogen heeft verkregen, is verplicht de
      kantonrechter van diens woonplaats hiervan te verwittigen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel342
  - number: '343'
    text: |-
      De voogd kan, onverminderd zijn aansprakelijkheid voor de door zijn slecht bewind veroorzaakte schade, voor de
      minderjarige alle handelingen verrichten, die hij in diens belang noodzakelijk, nuttig of wenselijk acht, behoudens
      het bepaalde bij de volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel343
  - number: '344.1'
    text: |-
      Voor zover de kantonrechter niet anders bepaalt, geeft de voogd de effecten aan toonder van de minderjarige in
      bewaring bij de Nederlandsche Bank of een ingevolge [artikel 52 van de Wet toezicht kredietwezen 1992][ref1]
      (*Stb.* 1992, 722) geregistreerde kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel344
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
  - number: '344.2'
    text: |-
      De kantonrechter kan aanwijzingen geven omtrent de wijze, waarop spaarbankboekjes en gelden van de minderjarige
      moeten worden bewaard. De kantonrechter onder wiens goedkeuring een verdeling tot stand komt, kan ter gelegenheid
      daarvan aanwijzingen als hier bedoeld geven. Overigens is de kantonrechter, aangewezen in de [tweede afdeling van
      de derde titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend) bevoegd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel344
  - number: '344.3'
    text: |-
      Voor effecten aan toonder, spaarbankboekjes en gelden, die de minderjarige tezamen met een of meer andere personen
      toekomen, geldt het bepaalde in de vorige leden, wanneer de voogd die onder zijn berusting heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel344
  - number: '345.1'
    text: |-
      De voogd behoeft machtiging van de kantonrechter om de navolgende handelingen voor rekening van de minderjarige
      te verrichten:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel345
  - number: 345.1.a
    text: |-
      aangaan van overeenkomsten strekkende tot beschikking over goederen van de minderjarige, tenzij de handeling geld
      betreft, als een gewone beheersdaad kan worden beschouwd, of krachtens rechterlijk bevel geschiedt;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel345
  - number: 345.1.b
    text: giften doen, andere dan gebruikelijke, niet bovenmatige;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel345
  - number: 345.1.c
    text: een making of gift, waaraan lasten of voorwaarden zijn verbonden, aannemen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel345
  - number: 345.1.d
    text: geld lenen of de minderjarige als borg of hoofdelijke medeschuldenaar verbinden;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel345
  - number: 345.1.e
    text: |-
      overeenkomen dat een boedel, waartoe de minderjarige gerechtigd is, voor een bepaalde tijd onverdeeld wordt
      gelaten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel345
  - number: '345.2'
    text: |-
      De kantonrechter kan bepalen dat de voogd zijn machtiging behoeft voor het innen van vorderingen
      van de minderjarige, het disponeren over saldi bij giro- of kredietinstellingen als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1] daaronder begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel345
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
  - number: '345.3'
    text: |-
      Voor het aangaan van een overeenkomst tot beëindiging van een geschil waarbij de minderjarige is betrokken, behoeft
      de voogd geen machtiging in het geval van [artikel 87 van het Wetboek van Burgerlijke Rechtsvordering][ref1] of
      indien het voorwerp van de onzekerheid of het geschil een waarde van € 700 niet te boven gaat, noch indien de
      overeenkomst als een beheersdaad is te beschouwen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel87
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel345
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '87'
  - number: '346.1'
    text: |-
      De voogd kan geen goederen van de minderjarige kopen, huren of pachten, zonder dat de kantonrechter de te sluiten
      overeenkomst goedkeurt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel346
  - number: '346.2'
    text: In geval van openbare verkoop, verhuur of verpachting moet de goedkeuring binnen een maand daarna zijn aangevraagd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel346
  - number: '347.1'
    text: |-
      Een in strijd met [artikel 345][ref1] of [346][ref2] verrichte rechtshandeling ten name van de minderjarige is
      vernietigbaar; op de vernietigingsgrond kan slechts een beroep worden gedaan van de zijde van de minderjarige.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel345
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel346
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel347
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '345'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '346'
        paragraaf: '10'
        afdeling: '6'
  - number: '347.2'
    text: |-
      Het vorige lid geldt niet voor een rechtshandeling anders dan om niet indien de wederpartij te goeder trouw was en
      voor een rechtshandeling die de minderjarige geen nadeel heeft berokkend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel347
  - number: '348.1'
    text: |-
      De voogd kan, zonder dat de kantonrechter de te sluiten overeenkomst goedkeurt, geen inschuld ten laste van de
      minderjarige, noch enig beperkt recht op diens goederen van een derde verkrijgen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel348
  - number: '348.2'
    text: Ontbreekt deze goedkeuring, dan is de overeenkomst nietig.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel348
  - number: '349.1'
    text: |-
      Een voogd die zonder machtiging van de kantonrechter voor de minderjarige als eiser in rechte optreedt of tegen een
      uitspraak beroep instelt, wordt niet-ontvankelijk verklaard.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel349
  - number: '349.2'
    text: |-
      De voogd mag niet zonder machtiging van de kantonrechter in een tegen de minderjarige ingestelde eis of in een
      gedane uitspraak berusten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel349
  - number: '349.3'
    text: |-
      Hij kan, alvorens voor de minderjarige in rechte verweer te voeren of tegen een bij verstek gedane uitspraak verzet
      te doen, zich te zijner verantwoording doen machtigen door de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel349
  - number: '350.1'
    text: De voogd draagt zorg voor een doelmatige belegging van het vermogen van de minderjarige.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel350
  - number: '350.2'
    text: |-
      Hij behoeft voor elke belegging van gelden van de minderjarige machtiging van de kantonrechter. Nochtans
      mag hij, voor zover de kantonrechter niet anders bepaalt, zonder diens machtiging gelden ten name van de
      minderjarige beleggen bij een ingevolge [artikel 52 van de Wet toezicht kredietwezen 1992][ref1] geregistreerde
      kredietinstelling op rekeningen bestemd voor de belegging van gelden van minderjarigen, met het beding dat de
      gelden alleen worden terugbetaald met machtiging van de kantonrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel350
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
  - number: '351.1'
    text: |-
      Wanneer het vermogen van de minderjarige of een gedeelte daarvan in een onderneming van handel, landbouw of
      nijverheid is geplaatst, mag de voogd de zaken voor rekening, hetzij van de minderjarige alleen, hetzij van deze
      met anderen, niet voortzetten dan met machtiging van de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel351
  - number: '351.2'
    text: |-
      Zonder machtiging van de kantonrechter mag de voogd een boedel, waartoe de minderjarige gerechtigd is, niet
      onverdeeld laten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel351
  - number: '352'
    text: |-
      Ondanks het ontbreken der vereiste machtiging zijn handelingen, door de voogd verricht in strijd met
      [artikel 350][ref1] of [artikel 351][ref2], geldig.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel350
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel351
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel352
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '350'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '351'
        paragraaf: '10'
        afdeling: '6'
  - number: '353'
    text: |-
      De voogd kan niet zonder machtiging van de kantonrechter van een de minderjarige toekomend aandeel in een ontbonden
      huwelijksgemeenschap afstand doen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel353
  - number: '354'
    text: |-
      De kantonrechter kan te allen tijde de voogd ten verhore doen oproepen. Deze is verplicht alle door de
      kantonrechter gewenste inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel354
  - number: '355.1'
    text: |-
      Aan een met het gezag belaste ouder of aan een ouder die alleen het bewind over het vermogen heeft en die aangifte
      heeft gedaan van zijn voornemen een huwelijk of een geregistreerd partnerschap aan te gaan, kan de kantonrechter
      opdragen binnen een bepaalde termijn een beschrijving van het vermogen van de kinderen op te maken en deze
      beschrijving of een afschrift daarvan ter griffie van de rechtbank in te leveren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel355
  - number: '355.2'
    text: |-
      De [artikelen 339][ref1], [340][ref2] en [341 van dit boek][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel339
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel340
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel341
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel355
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '340'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '341'
        paragraaf: '10'
        afdeling: '6'
  - number: '356.1'
    text: |-
      Aanwijzingen en machtigingen, als in deze paragraaf bedoeld, geeft de kantonrechter slechts, indien dit hem in het
      belang van de minderjarige noodzakelijk, nuttig of wenselijk blijkt te zijn. Hij kan een bijzondere of een algemene
      machtiging geven en daaraan zodanige voorwaarden verbinden, als hij dienstig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel356
  - number: '356.2'
    text: Hij kan een gegeven aanwijzing of machtiging te allen tijde intrekken of de daaraan verbonden voorwaarden wijzigen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel356
  - number: '357'
    text: |-
      Indien de kosten van een ten behoeve van een minderjarige bevolen maatregel bij rechterlijke beschikking te diens
      laste zijn gebracht, treedt - ingeval dientengevolge het vermogen van de minderjarige moet worden aangesproken -
      in de plaats van de bij [artikel 345 van dit boek][ref1] bedoelde machtiging van de kantonrechter, diens aanwijzing
      van de goederen die verkocht of bezwaard zullen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel345
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel357
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '345'
        paragraaf: '10'
        afdeling: '6'
  - number: '358.1'
    text: |-
      De voogd mag alle noodzakelijke, betamelijke en behoorlijk gerechtvaardigde uitgaven aan de minderjarige in
      rekening brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel358
  - number: '358.2'
    text: |-
      Indien de kantonrechter een bedrag bepaalt, hetwelk jaarlijks mag worden besteed voor de verzorging en opvoeding
      van de minderjarige of voor de kosten van het beheer van diens vermogen, behoeft de voogd de besteding van dat
      bedrag niet gespecificeerd te verantwoorden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel358
  - number: '358.3'
    text: |-
      De kantonrechter kan de voogd een beloning ten laste van de minderjarige toekennen, indien hij dit gezien de
      zwaarte van de last van het bewind redelijk acht. Buiten dit geval mag de voogd voor zichzelf geen loon berekenen,
      tenzij hem dat is toegekend bij de akte, waarbij hij door een ouder benoemd is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel358
  - number: '359.1'
    text: |-
      De kantonrechter kan te allen tijde op verzoek van de andere voogd of ambtshalve aan de voogd de verplichting
      opleggen jaarlijks of eens in de twee of drie jaren ter griffie van de rechtbank een rekening in te dienen van zijn
      bewind over de goederen van de minderjarige.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel359
  - number: '359.2'
    text: De datum voor de indiening van de rekening wordt door de kantonrechter bepaald.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel359
  - number: '359.3'
    text: |-
      Indien in het geval van gezamenlijke uitoefening van de voogdij een van de voogden de rekening alleen heeft
      ingediend, moet hij gelijktijdig een afschrift van de rekening aan de andere voogd doen toekomen. Deze kan binnen
      twee maanden bezwaren tegen de rekening bij de rechter indienen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel359
  - number: '360.1'
    text: Bij verschil van mening omtrent de rekening kan de kantonrechter verbetering daarvan gelasten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel360
  - number: '360.2'
    text: Hij kan een of meer deskundigen benoemen, ten einde de ingediende rekening te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel360
  - number: '360.3'
    text: |-
      De kantonrechter kan de kosten van dit onderzoek, indien slecht bewind aan het licht is gekomen, geheel of ten dele
      ten laste van de voogd brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel360
  - number: '360.4'
    text: De voogd ontvangt een afschrift van het door de deskundigen in te dienen schriftelijk bericht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel360
  - number: '360.5'
    text: |-
      In geval van gezamenlijke uitoefening van de voogdij ontvangen beide voogden het in het vierde lid bedoelde
      afschrift en kan de rechter de in het derde lid bedoelde kosten ook ten laste van de voogden gezamenlijk brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel360
  - number: '361'
    text: |-
      De periodiek door de voogd gedane rekening of een eensluidend afschrift daarvan blijft berusten ter griffie van
      de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel361
  - number: '362'
    text: |-
      De kantonrechter kan op verzoek van de andere voogd of ambtshalve de schade vaststellen, die blijkens de rekening
      de minderjarige door slecht bewind van de voogd geleden heeft, en deze laatste tot vergoeding daarvan veroordelen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel362
  - number: '363.1'
    text: |-
      De kantonrechter kan te allen tijde bevelen dat de voogd voor zijn bewind zekerheid stelt. Hij stelt het bedrag en
      de aard van de zekerheid vast. Inpandgeving van effecten aan toonder van de voogd geschiedt door hun inbewaargeving
      bij de Nederlandsche Bank.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel363
  - number: '363.2'
    text: |-
      De kantonrechter bepaalt een redelijke termijn, binnen welke de voogd hem te zijnen genoegen moet aantonen dat hij
      de van hem verlangde zekerheid gesteld heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel363
  - number: '363.3'
    text: |-
      De kantonrechter kan de voogd toestaan een gestelde zekerheid door een andere te vervangen. Indien het belang
      van de voogd het vervallen van een gestelde zekerheid volstrekt eist of handhaving daarvan niet nodig is, kan de
      kantonrechter hem machtigen daarvan namens de minderjarige afstand te doen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel363
  - number: '364.1'
    text: |-
      De door de voogd gestelde zekerheid houdt op, zodra zijn rekening en verantwoording is goedgekeurd, of zodra de
      rechtsvorderingen die zijn bewind betreffen overeenkomstig [artikel 377 van dit boek][ref1] verjaard zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel364
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '377'
        paragraaf: '11'
        afdeling: '6'
  - number: '364.2'
    text: |-
      Alsdan worden op kosten van de minderjarige hypothecaire inschrijvingen doorgehaald en pandrechten op
      inschrijvingen in de schuldregisters voor geldleningen ten laste van het Rijk opgeheven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel364
  - number: '365'
    text: 'Indien de voogd in gebreke blijft:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel365
  - number: 365.a
    text: gehoor te geven aan een oproeping van de kantonrechter om voor hem te verschijnen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel365
  - number: 365.b
    text: |-
      een boedelbeschrijving of een verklaring als bedoeld in [artikel 339 van dit boek][ref1] in te leveren;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel339
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel365
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '339'
        paragraaf: '10'
        afdeling: '6'
  - number: 365.c
    text: op de door de kantonrechter bepaalde datum zijn periodieke rekening in te dienen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel365
  - number: 365.d
    text: |-
      aan de minderjarige toebehorende spaarbankboekjes, gelden, of toondereffecten die hij niet te diens name heeft doen
      stellen, op de voorgeschreven wijze te bewaren;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel365
  - number: 365.e
    text: de kantonrechter het bewijs te leveren, dat hij een van hem verlangde zekerheid gesteld heeft; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel365
  - number: 365.f
    text: |-
      de schadevergoeding te betalen, waartoe de kantonrechter hem ingevolge [artikel 362 van dit boek][ref1] veroordeeld
      heeft,


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel362
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel365
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '362'
        paragraaf: '10'
        afdeling: '6'
  - number: '366'
    text: 'Insgelijks kan de kantonrechter de raad voor de kinderbescherming ermede in kennis stellen, dat:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel366
  - number: 366.a
    text: de voogd in gevallen, waarin hij machtiging van de kantonrechter behoeft, zijn bewind eigenmachtig voert;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel366
  - number: 366.b
    text: hij zich in zijn bewind aan ontrouw, plichtsverzuim of misbruik van bevoegdheid blijkt te hebben schuldig gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel366
  - number: '367'
    text: |-
      De raad voor de kinderbescherming die van de kantonrechter zodanige mededeling ontvangt, onderwerpt, na
      onderzoek van de overige gedragingen van de voogd jegens de minderjarige, binnen zes weken na de dagtekening
      van die mededeling aan het oordeel van de rechtbank de vraag, of ontzetting van de voogd op grond van
      [artikel 327, eerste lid onder b][ref1], van dit boek moet volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel327
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel367
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '327'
        paragraaf: '8'
        afdeling: '6'
  - number: '369.1'
    text: |-
      Indien minderjarigen die onder voogdij van verschillende voogden staan, goederen gemeen hebben, kan de
      kantonrechter van de woonplaats van een der minderjarigen een van de voogden of een derde aanwijzen om over deze
      goederen tot de verdeling het bewind te voeren. De aangewezen bewindvoerder stelt de door de rechter van hem
      verlangde waarborgen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel369
  - number: '369.2'
    text: |-
      Komt de in het eerste lid omschreven bevoegdheid aan verschillende rechters toe, dan vervalt deze, nadat een van
      hen daarvan heeft gebruik gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel369
  - number: '369.3'
    text: |-
      Op het bewind zijn de bepalingen omtrent het bewind van een voogd van overeenkomstige toepassing. De bewindvoerder
      is bij uitsluiting bevoegd tot vernietiging van rechtshandelingen van de minderjarige, strekkend tot beheer of
      beschikking met betrekking tot de onder bewind staande goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel369
  - number: '370.1'
    text: |-
      De kantonrechter kan op verzoek van de voogd of ambtshalve, het vermogen van de minderjarige of een deel daarvan,
      met inbegrip van de vruchten, voor de duur van diens minderjarigheid onder bewind stellen, indien hij dit in
      het belang van de minderjarige nodig oordeelt. In geval van gezamenlijke uitoefening van de voogdij wordt tot
      onderbewindstelling slechts beslist indien het verzoek door beide voogden gezamenlijk wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel370
  - number: '370.2'
    text: |-
      De kantonrechter benoemt de bewindvoerder en bepaalt het aan deze toekomende loon. Hij kan bij de instelling
      van het bewind bepalen dat de voogd de door de onderbewindstelling veroorzaakte kosten, met inbegrip van het
      loon, geheel of gedeeltelijk aan de minderjarige moet vergoeden, alsmede dat de voogd, behoudens zijn verhaal
      op de bewindvoerder, voor diens verrichtingen aansprakelijk is jegens de minderjarige. In geval van gezamenlijke
      uitoefening van de voogdij worden deze verplichtingen opgelegd aan beide voogden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel370
  - number: '370.3'
    text: |-
      Op het bewind zijn de bepalingen omtrent het bewind van een voogd van overeenkomstige toepassing. De bewindvoerder
      is bij uitsluiting bevoegd tot vernietiging van rechtshandelingen van de minderjarige, strekkend tot beheer of
      beschikking met betrekking tot de onder bewind staande goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel370
  - number: '370.4'
    text: |-
      De kantonrechter bepaalt welke uitkeringen de bewindvoerder uit de onder het bewind gestelde goederen en de
      vruchten daarvan aan de voogd en bij gezamenlijke uitoefening van de voogdij aan de voogden, moet doen ten behoeve
      van de verzorging en opvoeding van de minderjarige of ten behoeve van het beheer van diens niet onder het bewind
      gestelde goederen. Hij kan deze beschikkingen te allen tijde op verzoek van een voogd of de bewindvoerder, of
      ambtshalve wijzigen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel370
  - number: '370.5'
    text: |-
      De bewindvoerder is verplicht aan de kantonrechter te allen tijde alle door deze gewenste inlichtingen te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel370
  - number: '370.6'
    text: |-
      Hij is voorts verplicht jaarlijks en aan het einde van zijn bewind aan de voogd, en bij gezamenlijke uitoefening
      van de voogdij aan de voogden, de meerderjarig gewordene of de erfgenamen van de minderjarige, wanneer deze
      overleden is, ten overstaan van de kantonrechter rekening en verantwoording af te leggen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel370
  - number: '370.7'
    text: Geschillen die bij de rekening en verantwoording rijzen, beslist de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel370
  - number: '370.8'
    text: |-
      Blijft een der partijen in gebreke tot deze aflegging van rekening en verantwoording mede te werken, dan zijn de
      [artikelen 771 en volgende van het Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel771
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel370
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '771'
  - number: '370.9'
    text: |-
      De kantonrechter kan te allen tijde op verzoek van de bewindvoerder, een voogd of ambtshalve het bewind opheffen of
      de bewindvoerder ontslaan en door een ander vervangen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel370
  - number: '371'
    text: De voogd is verplicht ter griffie van de rechtbank kennis te geven van elke verandering in zijn woonplaats.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel371
  - number: 371a.1
    text: |-
      De griffier van het gerecht dat een voogd benoemt, doet daarvan onverwijld mededeling aan de kantonrechter van de
      rechtbank van het arrondissement waarin de woonplaats van de voogd is gelegen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel371a
  - number: 371a.2
    text: |-
      Woont de voogd niet meer in het arrondissement of is hij opgevolgd door een voogd in een ander arrondissement,
      dan zendt de griffier onverwijld de voogdijbescheiden naar de griffier van het arrondissement waar de voogd of
      opvolgende voogd woonplaats heeft, onder opgave van diens adres.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel371a
  - number: '372'
    text: |-
      Na het einde van zijn bewind doet de voogd daarvan onverwijld rekening en verantwoording. De kosten worden door
      de voogd betaald. Zij komen echter ten laste van de minderjarige, tenzij het bewind wegens ontzetting van de voogd
      eindigt. Voor zover de kosten niet op de minderjarige kunnen worden verhaald, komen zij ten laste van de ouders,
      en, zo zij ook op hen niet kunnen worden verhaald, ten laste van de Staat.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel372
  - number: '373.1'
    text: |-
      Deze rekening en verantwoording doet de voogd hetzij aan de meerderjarig gewordene, hetzij aan de erfgenamen van de
      minderjarige, wanneer deze overleden is, hetzij aan zijn opvolger in het bewind.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel373
  - number: '373.2'
    text: |-
      Indien de gezamenlijke uitoefening van de voogdij is geëindigd en als gevolg daarvan het gezag wordt uitgeoefend
      door een van de voogden alleen, doet degene wiens voogdij geëindigd is rekening en verantwoording aan degene die de
      voogdij alleen uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel373
  - number: '374.1'
    text: |-
      Bedoelde rekening en verantwoording wordt afgelegd ten overstaan van de kantonrechter, binnen wiens rechtsgebied de
      voogd wiens bewind eindigt woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel374
  - number: '374.2'
    text: Geschillen, die bij de aflegging van de rekening en verantwoording mochten rijzen, beslist de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel374
  - number: '374.3'
    text: |-
      Blijft een der partijen in gebreke tot deze aflegging van rekening en verantwoording mede te werken, dan zijn de
      [artikelen 771 en volgende van het Wetboek van Burgerlijke Rechtsvordering][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel771
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel374
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '771'
  - number: '375'
    text: |-
      Een rechtshandeling die de meerderjarig gewordene betreffende de voogdij of de voogdijrekening richt tot of
      verricht met de voogd, is vernietigbaar, indien zij geschiedt vóór het afleggen van de rekening en verantwoording;
      alleen van de zijde van de meerderjarig gewordene kan een beroep op de vernietigingsgrond worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel375
  - number: '376'
    text: |-
      Wat de minderjarige aan de voogd schuldig blijft, draagt geen rente, zolang hij niet - na het sluiten der rekening
        - met de voldoening van het verschuldigde in verzuim is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel376
  - number: '377'
    text: |-
      Elke rechtsvordering op grond van het gevoerde voogdijbewind - zowel van de zijde van de minderjarige als van die
      van de voogd - verjaart door verloop van vijf jaren na de dag, waarop de voogdij van laatstgenoemde is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377
  - number: 377a.1
    text: Het kind en de niet met het gezag belaste ouder hebben recht op omgang met elkaar.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377a
  - number: 377a.2
    text: |-
      De rechter stelt op verzoek van de ouders of van één van hen, al dan niet voor bepaalde tijd, een regeling inzake
      de uitoefening van het omgangsrecht vast dan wel ontzegt, al dan niet voor bepaalde tijd, het recht op omgang.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377a
  - number: 377a.3
    text: 'De rechter ontzegt het recht op omgang slechts, indien:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377a
  - number: 377a.3.a
    text: omgang ernstig nadeel zou opleveren voor de geestelijke of lichamelijke ontwikkeling van het kind, of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377a
  - number: 377a.3.b
    text: de ouder kennelijk ongeschikt of kennelijk niet in staat moet worden geacht tot omgang, of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377a
  - number: 377a.3.c
    text: |-
      het kind dat twaalf jaren of ouder is, bij zijn verhoor van ernstige bezwaren tegen omgang met zijn ouder heeft
      doen blijken, of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377a
  - number: 377a.3.d
    text: omgang anderszins in strijd is met zwaarwegende belangen van het kind.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377a
  - number: 377a.4
    text: |-
      Tot kennisneming van de in dit artikel bedoelde verzoeken is de rechtbank bevoegd. Indien evenwel een procedure
      inzake gezagstoewijzing bij de kantonrechter aanhangig is, kan een verzoek tot vaststelling van een omgangsregeling
      in verband daarmee aan de kantonrechter worden gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377a
  - number: 377b.1
    text: |-
      De ouder die met het gezag is belast, is gehouden de niet met het gezag belaste ouder op de hoogte te stellen
      omtrent gewichtige aangelegenheden met betrekking tot de persoon en het vermogen van het kind en deze te raadplegen
        - zo nodig door tussenkomst van derden - over daaromtrent te nemen beslissingen. Op verzoek van een ouder kan de
      rechter ter zake een regeling vaststellen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377b
  - number: 377b.2
    text: |-
      Indien het belang van het kind zulks vereist kan de rechter zowel op verzoek van de met het gezag belaste ouder als
      ambtshalve bepalen dat het eerste lid van dit artikel buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377b
  - number: 377b.3
    text: |-
      De [artikelen 377][ref1], en [377][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377a
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 377e
  - number: 377c.1
    text: |-
      Onverminderd het bepaalde in [artikel 377][ref1] wordt de niet met het gezag belaste ouder desgevraagd door derden
      die beroepshalve beschikken over informatie inzake belangrijke feiten en omstandigheden die de persoon van het kind
      of diens verzorging en opvoeding betreffen, daarvan op de hoogte gesteld, tenzij die derde de informatie niet op
      gelijke wijze zou verschaffen aan degene die met het gezag over het kind is belast dan wel bij wie het kind zijn
      gewone verblijfplaats heeft, of het belang van het kind zich tegen het verschaffen van informatie verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377b
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377b
  - number: 377c.2
    text: |-
      Indien de informatie is geweigerd, kan de rechter op verzoek van de in het eerste lid van dit artikel bedoelde
      ouder bepalen dat de informatie op de door hem aan te geven wijze moet worden verstrekt. De rechter wijst het
      verzoek in ieder geval af, indien het belang van het kind zich tegen het verschaffen van de informatie verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377c
  - number: 377c.3
    text: |-
      Het [vierde lid van artikel 377][ref1] van dit boek is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377a
  - number: 377d.1
    text: |-
      Onverminderd het bepaalde in het tweede lid van dit artikel, begint de uitoefening van het recht op omgang zodra de
      desbetreffende beschikking in kracht van gewijsde is gegaan of, indien zij uitvoerbaar bij voorraad is verklaard,
      daags nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377d
  - number: 377d.2
    text: |-
      De uitoefening van het recht op omgang begint, indien tevens een beschikking inzake het gezag is of wordt gegeven,
      niet eerder dan op het tijdstip waarop voor de andere ouder of voor de voogd het gezag is begonnen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377d
  - number: 377e.1
    text: |-
      De rechtbank kan op verzoek van de ouders of van een van hen een beslissing inzake de omgang alsmede een door de
      ouders onderling getroffen omgangsregeling wijzigen op grond dat nadien de omstandigheden zijn gewijzigd, of dat
      bij het nemen van de beslissing van onjuiste of onvolledige gegevens is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377e
  - number: 377e.2
    text: |-
      Een verzoek tot wijziging van een beslissing inzake de omgang wordt aan de kantonrechter gedaan, indien de te
      wijzigen beslissing door de kantonrechter is gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377e
  - number: 377f.1
    text: |-
      Onverminderd het bepaalde in [artikel 377a][ref1], kan de rechter op verzoek een omgangsregeling vaststellen
      tussen het kind en degene die in een nauwe persoonlijke betrekking staat tot het kind. De rechter kan het verzoek
      afwijzen, indien het belang van het kind zich tegen toewijzing verzet of indien het kind, dat twaalf jaar of ouder
      is, bezwaar maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377f
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377a
  - number: 377f.2
    text: |-
      Het bepaalde in de [artikelen 377a, vierde lid][ref1], [377d][ref2] en [377e van dit boek][ref3] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377d
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377f
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377a
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 377d
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 377e
  - number: 377g
    text: |-
      De rechter kan, indien hem blijkt dat de minderjarige van twaalf jaar of ouder hierop prijs stelt, ambtshalve
      een beslissing geven op de voet van de [artikelen 377a][ref1], [377b][ref2] of [377f][ref3], dan wel zodanige
      beslissing op de voet van [artikel 377e van dit boek][ref4] wijzigen. Hetzelfde geldt indien de minderjarige de
      leeftijd van twaalf jaren nog niet heeft bereikt, maar in staat kan worden geacht tot een redelijke waardering van
      zijn belangen ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377b
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel377f
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377a
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 377b
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 377f
      - id: ref4
        bwb_id: BWBR0002656
        artikel: 377e
  - number: 377h.1
    text: |-
      Ingeval van gezamenlijke gezagsuitoefening kan de rechter op verzoek van de ouders of een van hen een
      regeling vaststellen inzake de omgang tussen het kind en de ouder bij wie het kind zijn gewone verblijfplaats
      niet heeft, of inzake het verschaffen van informatie aan dan wel het raadplegen van die ouder als
      bedoeld in [artikel 377b, eerste lid][ref1], dan wel inzake het verschaffen van informatie als bedoeld in
      [artikel 377c, eerste en tweede lid][ref2], van dit boek.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377b
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377c
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377h
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377b
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 377c
  - number: 377h.2
    text: |-
      De [artikelen 377a, vierde lid][ref1], [377e][ref2] en [377g van dit boek][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel377g
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel377h
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377a
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 377e
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 377g
  - number: '378.1'
    text: 'Een meerderjarige kan door de rechtbank onder curatele worden gesteld:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel378
  - number: 378.1.a
    text: |-
      wegens een geestelijke stoornis, waardoor de gestoorde, al dan niet met tussenpozen, niet in staat is of
      bemoeilijkt wordt zijn belangen behoorlijk waar te nemen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel378
  - number: 378.1.b
    text: wegens verkwisting;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel378
  - number: 378.1.c
    text: 'wegens gewoonte van drankmisbruik, waardoor hij:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel378
  - number: 378.1.c.1°
    text: zijn belangen niet behoorlijk waarneemt;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel378
  - number: 378.1.c.2°
    text: in het openbaar herhaaldelijk aanstoot geeft; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel378
  - number: 378.1.c.3°
    text: eigen veiligheid of die van anderen in gevaar brengt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel378
  - number: '378.2'
    text: |-
      Indien te verwachten is dat ten aanzien van een minderjarige op het tijdstip waarop hij meerderjarig zal worden,
      van een der in het vorige lid genoemde gronden voor curatele sprake zal zijn, kan de curatele reeds voor de
      meerderjarigheid worden uitgesproken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel378
  - number: '379'
    text: |-
      De curatele kan worden verzocht door de betrokken persoon, zijn echtgenoot of andere levensgezel, geregistreerde
      partner, zijn bloedverwanten in de rechte lijn en die in de zijlijn tot de vierde graad ingesloten, voogd of het
      openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel379
  - number: '380.1'
    text: |-
      De rechter voor wie het verzoek tot ondercuratelestelling aanhangig is of laatstelijk aanhangig was, kan,
      desverzocht of ambtshalve, een provisionele bewindvoerder benoemen; de beschikking vermeldt het tijdstip waarop zij
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel380
  - number: '380.2'
    text: |-
      Hij regelt in deze beschikking de bevoegdheden van de bewindvoerder. Hij kan de bewindvoerder het bewind over
      bepaalde of alle goederen opdragen. Aan de bewindvoerder kan de rechter ook andere bevoegdheden toekennen, doch
      niet die welke een curator niet heeft. Voor zover de rechter niet anders bepaalt, kan degene wiens curatele is
      verzocht, met betrekking tot die goederen niet zonder medewerking van de bewindvoerder daden van beheer en van
      beschikking verrichten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel380
  - number: '380.3'
    text: |-
      In de beschikking kan tevens worden bepaald dat schulden die degene wiens curatele is verzocht, na de bekendmaking
      van de benoeming maakt, op de onder bewind gestelde goederen gedurende dit bewind en de curatele, indien deze
      volgt, niet kunnen worden verhaald.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel380
  - number: '380.4'
    text: |-
      De beschikking kan te allen tijde worden gewijzigd of ingetrokken door de rechter voor wie het verzoek tot
      ondercuratelestelling aanhangig is of laatstelijk aanhangig was.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel380
  - number: '380.5'
    text: |-
      De bewindvoerder komt als beloning toe vijf ten honderd van de netto-opbrengst der door hem beheerde goederen,
      tenzij de kantonrechter daarvoor om bijzondere redenen een ander bedrag vaststelt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel380
  - number: '381.1'
    text: |-
      De curatele werkt met ingang van de dag waarop zij is uitgesproken. In het geval, bedoeld in
      [artikel 378, tweede lid][ref1], werkt de curatele met ingang van het tijdstip waarop de onder curatele gestelde
      meerderjarig wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel378
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel381
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '378'
  - number: '381.2'
    text: |-
      Van deze tijdstippen is de onder curatele gestelde onbekwaam rechtshandelingen te verrichten voor zover de wet niet
      anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel381
  - number: '381.3'
    text: |-
      Een onder curatele gestelde is bekwaam rechtshandelingen te verrichten met toestemming van zijn curator, voor zover
      deze bevoegd is die rechtshandelingen voor de onder curatele gestelde te verrichten. De toestemming kan slechts
      worden verleend voor een bepaalde rechtshandeling of voor een bepaald doel. De toestemming voor een bepaald doel
      moet schriftelijk worden verleend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel381
  - number: '381.4'
    text: |-
      Met betrekking tot aangelegenheden betreffende verzorging, verpleging, behandeling en begeleiding van een onder
      curatele gestelde zijn de [artikelen 453 en 454 van dit boek][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel453
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel381
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '453'
  - number: '381.5'
    text: |-
      Hij is bekwaam over gelden die zijn curator voor levensonderhoud te zijner beschikking heeft gesteld,
      overeenkomstig deze bestemming te beschikken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel381
  - number: '381.6'
    text: |-
      In zaken van curatele is degene wiens curatele het betreft bekwaam in rechte op te treden en tegen een uitspraak
      beroep in te stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel381
  - number: '382'
    text: |-
      Hij die uit hoofde van verkwisting of gewoonte van drankmisbruik onder curatele is gesteld, blijft bekwaam tot het
      verrichten van familierechtelijke handelingen voor zover de wet niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel382
  - number: '383.1'
    text: |-
      De rechter benoemt bij het uitspreken van de curatele of, indien hij zich nog niet voldoende voorgelicht acht, zo
      spoedig mogelijk daarna een curator.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel383
  - number: '383.2'
    text: |-
      De rechter volgt bij de benoeming van de curator de uitdrukkelijke voorkeur van de betrokkene, tenzij gegronde
      redenen zich tegen zodanige benoeming verzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel383
  - number: '383.3'
    text: |-
      Tenzij het vorige lid is toegepast, wordt, indien de onder curatele gestelde persoon gehuwd is, een geregistreerd
      partnerschap is aangegaan of anderszins een levensgezel heeft, bij voorkeur de echtgenoot, de geregistreerde
      partner dan wel andere levensgezel tot curator benoemd. Is de vorige zin niet van toepassing dan wordt bij voorkeur
      een van zijn ouders, kinderen, broers of zusters tot curator benoemd. Huwt de onder curatele gestelde, gaat hij
      een geregistreerd partnerschap aan of verkrijgt hij een andere levensgezel, dan kan ieder van hen verzoeken, dat de
      niet onder curatele staande echtgenoot, de geregistreerde partner dan wel de andere levensgezel in de plaats van de
      tegenwoordige curator wordt benoemd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel383
  - number: '383.4'
    text: |-
      De taak van de curator vangt aan daags nadat de beslissing, houdende de benoeming, is verstrekt of verzonden.
      Met die dag eindigt het provisioneel bewind. De provisionele bewindvoerder is verplicht ten overstaan van de
      kantonrechter aan de curator rekening en verantwoording van zijn bemoeienissen af te leggen; wordt hij zelf tot
      curator benoemd, dan wordt de rekening en verantwoording aan de kantonrechter afgelegd. Indien de curator vóór de
      meerderjarigheid van de onder curatele gestelde is benoemd, vangt zijn taak aan op het tijdstip waarop de curatele
      in werking treedt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel383
  - number: '383.5'
    text: |-
      Indien het verzoek tot ondercuratelestelling wordt afgewezen, eindigt het bewind van de provisionele bewindvoerder
      daags na die uitspraak, tenzij de rechter anders bepaalt, en in ieder geval uiterlijk daags nadat de afwijzing in
      kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel383
  - number: '384'
    text: |-
      Indien een beschikking, waarbij curatele is uitgesproken, in hoger beroep of cassatie wordt vernietigd en het
      verzoek tot ondercuratelestelling alsnog wordt afgewezen, neemt de taak van de curator daags na deze uitspraak een
      einde. De inmiddels door de curator of met zijn toestemming verrichte handelingen blijven voor de onder curatele
      gestelde verbindend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel384
  - number: '385.1'
    text: |-
      Behoudens het in de [artikelen 383][ref1] en [384][ref2] bepaalde vinden de [artikelen 250][ref3] en
      [280, onder b][ref4], [281 lid 1 onder a en lid 2][ref5], [297-299][ref6], [322, onder a en c][ref7], [324][ref8],
      [336][ref9] en [372-377][ref10] bij curatele overeenkomstige toepassing, met dien verstande dat


