        artikel: 80g
  - number: 16b
    text: |-
      Wanneer de ambtenaar van de burgerlijke stand in de uitoefening van zijn ambt op grond van enige bepaling van deze
      titel of van enige andere titel van dit boek in rechte optreedt, kan hij dit zonder advocaat of procureur doen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel16b
  - number: 16c
    text: |-
      Burgemeester en wethouders bepalen de uren, waarop elk bureau van de burgerlijke stand dagelijks voor het publiek
      geopend zal zijn. Daarbij wordt, ten einde de werkzaamheden van de ambtenaren van de burgerlijke stand op die
      dagen zoveel mogelijk te beperken, een afzonderlijke regeling getroffen voor de zaterdag, de zondag, de algemeen
      erkende feestdagen en de overige daarvoor door burgemeester en wethouders aan te wijzen dagen, waarop gemeentelijke
      diensten niet of slechts gedeeltelijk zijn geopend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel16c
  - number: 16d
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld ten aanzien van de door het gemeentebestuur te treffen
      voorzieningen ten behoeve van de taakuitoefening door de ambtenaar van de burgerlijke stand, en voorts ten aanzien
      van al wat verder de taak van de ambtenaar van de burgerlijke stand betreft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel16d
  - number: '17.1'
    text: |-
      Er bestaan voor iedere gemeente registers van geboorten, van huwelijken, van geregistreerde partnerschappen en
      van overlijden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel17
  - number: '17.2'
    text: |-
      Er bestaat in de gemeente 's-Gravenhage, naast de in het eerste lid genoemde registers, een register voor de
      inschrijving van de in [afdeling 6][ref1] bedoelde rechterlijke uitspraken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling6
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '6'
  - number: 17a.1
    text: |-
      De registers van de burgerlijke stand worden in het gemeentehuis bewaard totdat zij naar een gemeentelijke
      archiefbewaarplaats in de zin van de [Archiefwet 1995][ref1] (*Stb.* 276) worden overgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: 17a.2
    text: |-
      De overbrenging naar de gemeentelijke archiefbewaarplaats van de in het gemeentehuis berustende registers
      van geboorten, van huwelijken dan wel geregistreerde partnerschappen en van overlijden vindt eerst plaats
      onderscheidenlijk honderd jaar, vijfenzeventig jaar en vijftig jaar na de afsluiting van deze registers.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel17a
  - number: 17b
    text: |-
      De beheerder van een archiefbewaarplaats als bedoeld in [artikel 17a][ref1] is belast met het bewaren van de onder
      hem berustende registers, met het toevoegen van latere vermeldingen aan de daarin opgenomen akten en met de afgifte
      van afschriften en uittreksels van deze akten.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel17a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 17a
        afdeling: '2'
  - number: 17c
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld alles wat verder betreft de inrichting van de registers, alsmede
      de in [artikel 17b][ref1] genoemde handelingen ten aanzien van die registers.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel17b
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 17b
        afdeling: '2'
  - number: '18.1'
    text: |-
      De ambtenaar van de burgerlijke stand mag in de akten alleen opnemen hetgeen ingevolge het bij of krachtens de wet
      bepaalde moet worden verklaard of opgenomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18
  - number: '18.2'
    text: |-
      De ambtenaar van de burgerlijke stand is bevoegd alvorens tot het opmaken van een akte over te gaan zich de door de
      wet vereiste bescheiden te doen vertonen. Hij doet zich ook andere bescheiden vertonen, welke hij voor het opmaken
      van de akte of voor de vaststelling van de in de akte op te nemen gegevens noodzakelijk acht. Hij kan zich te dien
      einde, zonder hiervoor leges verschuldigd te zijn, inlichtingen verschaffen uit de registers van de burgerlijke
      stand en uit andere openbare registers.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18
  - number: '18.3'
    text: Bij algemene maatregel van bestuur wordt geregeld al hetgeen het opmaken van de akten betreft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18
  - number: 18a.1
    text: |-
      Partijen bij een akte van de burgerlijke stand zijn degenen die aan de ambtenaar van de burgerlijke stand een
      aangifte doen of te zijnen overstaan een verklaring afleggen betreffende een feit, waarvan de akte bestemd is te
      doen blijken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18a
  - number: 18a.2
    text: |-
      Belanghebbende partijen zijn partijen die met hun verklaring enig rechtsgevolg teweeg brengen voor henzelf of voor
      medepartijen, dan wel voor henzelf en medepartijen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18a
  - number: 18a.3
    text: De belanghebbende partijen kunnen zich door een daartoe bij authentieke akte gevolmachtigde doen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18a
  - number: 18a.4
    text: |-
      Wanneer een gevolmachtigde een verklaring aflegt, geldt hij zowel als de door hem vertegenwoordigde persoon als
      partij bij de akte.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18a
  - number: 18a.5
    text: |-
      De ambtenaar van de burgerlijke stand mag geen akte verlijden waarin hijzelf als partij of belanghebbende partij
      voorkomt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18a
  - number: 18b.1
    text: |-
      Blijft een partij bij een akte van de burgerlijke stand of een belanghebbende partij in gebreke de in
      [artikel 18, tweede lid][ref1], bedoelde bescheiden over te leggen, of acht de ambtenaar van de burgerlijke stand
      de overgelegde bescheiden ongenoegzaam, dan weigert deze tot het opmaken van de akte over te gaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel18
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '18'
        afdeling: '3'
  - number: 18b.2
    text: |-
      De ambtenaar van de burgerlijke stand weigert eveneens tot het opmaken van de akte over te gaan, indien hij van
      oordeel is dat de Nederlandse openbare orde zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18b
  - number: 18b.3
    text: |-
      Van een weigering als bedoeld in het eerste of het tweede lid doet de ambtenaar van de burgerlijke stand een
      schriftelijke, met redenen omklede mededeling aan de partijen bij de akte en de belanghebbende partijen toekomen,
      onder vermelding van de tegen die weigering openstaande voorziening van [afdeling 12][ref1] van deze titel. Een
      afschrift van deze mededeling doet hij aan de korpschef toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling12
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '12'
  - number: 18c.1
    text: |-
      Van alle in registers opgenomen akten van de burgerlijke stand wordt een dubbel of een afschrift gehouden, volgens
      regels, bij algemene maatregel van bestuur te stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18c
  - number: 18c.2
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld alles wat betreft de bewaring van de dubbelen of de afschriften
      alsmede van de daarop betrekking hebbende latere vermeldingen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18c
  - number: 18c.3
    text: |-
      Wanneer akten van de burgerlijke stand verloren zijn gegaan of verminkt zijn, wordt ter vervanging van deze akten
      van de dubbelen van de akten een afschrift gemaakt door een of meer door Onze Minister van Justitie aan te wijzen
      Centrale Bewaarplaatsen waar de dubbelen bewaard worden. De afschriften treden in de plaats van de verloren gegane
      of verminkte akten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18c
  - number: 18c.4
    text: Er wordt een lijst opgesteld van de akten die vervangen worden, die in de Staatscourant wordt gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18c
  - number: 18c.5
    text: |-
      De kosten voor de vervanging van akten van de burgerlijke stand komen ten laste van de Staat, tenzij het de
      vervanging van akten betreft die bewaard worden door een gemeente. In het laatstgenoemde geval komen de kosten van
      vervanging voor rekening van de gemeente.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18c
  - number: 18c.6
    text: |-
      Onze Minister van Justitie kan nadere regels stellen omtrent de wijze waarop de vervanging van de akten dient te
      worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel18c
  - number: '19.1'
    text: |-
      Een akte van geboorte wordt opgemaakt door de ambtenaar van de burgerlijke stand van de gemeente waar het kind
      is geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19
  - number: '19.2'
    text: |-
      Indien de plaats van de geboorte van het kind niet bekend is, wordt de akte opgemaakt door de ambtenaar van de
      burgerlijke stand van de gemeente waar het kind is aangetroffen. Die gemeente geldt als gemeente waar het kind
      is geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19
  - number: 19a.1
    text: |-
      In geval van geboorte op Nederlands grondgebied in een rijdend voertuig of op een varend schip of tijdens een
      binnenlandse luchtreis met een luchtvaartuig, wordt de akte van geboorte opgemaakt door de ambtenaar van de
      burgerlijke stand van de gemeente waar dat kind het voertuig, het schip of het luchtvaartuig verlaat, dan wel waar
      het schip ligplaats kiest. Die gemeente geldt als gemeente waar het kind is geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19a
  - number: 19a.2
    text: |-
      In geval van geboorte tijdens een zeereis met een in Nederland geregistreerd vaartuig, dan wel tijdens een
      internationale luchtreis met een in Nederland geregistreerd luchtvaartuig, is de gezagvoerder van het vaartuig
      of het luchtvaartuig verplicht een voorlopige akte van geboorte binnen vierentwintig uur in het journaal in te
      schrijven in tegenwoordigheid van twee getuigen en zo mogelijk van de vader. De gezagvoerder zendt een afschrift
      van die akte zo spoedig mogelijk aan de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage. Deze
      maakt de akte van geboorte op aan de hand van het ontvangen afschrift, met dien verstande dat hij gegevens die
      ontbreken of hem blijken onjuist te zijn, zoveel mogelijk aanvult of verbetert. Aan de personen op wie de akte
      betrekking heeft, wordt een uittreksel van de akte toegezonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19a
  - number: 19b
    text: |-
      Indien de plaats of de dag van de geboorte van het kind niet bekend is dan wel indien de naam, met inbegrip van de
      voornamen, van de moeder niet bekend is, wordt de geboorteakte ten aanzien van deze punten opgemaakt krachtens een
      bevel en overeenkomstig de aanwijzingen van het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19b
  - number: 19c
    text: |-
      Zijn krachtens [artikel 5, tiende lid, van dit boek][ref1] in de akte een voorlopige voornaam en geslachtsnaam
      opgenomen, dan zendt de ambtenaar van de burgerlijke stand onverwijld een volledig afschrift van de akte aan Onze
      Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel5
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '5'
  - number: 19d.1
    text: |-
      Indien het geslacht van het kind twijfelachtig is, wordt een geboorteakte opgemaakt, waarin wordt vermeld dat het
      geslacht van het kind niet is kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19d
  - number: 19d.2
    text: |-
      Binnen drie maanden na de geboorte, of, bij overlijden binnen die termijn, ter gelegenheid van de aangifte van het
      overlijden, wordt onder doorhaling van de in het eerste lid bedoelde akte een nieuwe geboorteakte opgemaakt, waarin
      het geslacht, indien dit inmiddels is vastgesteld, wordt vermeld aan de hand van een ter zake overgelegde medische
      verklaring.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19d
  - number: 19d.3
    text: |-
      Is binnen de in het tweede lid genoemde termijn geen medische verklaring overgelegd, of blijkt uit de overgelegde
      medische verklaring dat het geslacht niet is kunnen worden vastgesteld, dan vermeldt de nieuwe geboorteakte dat het
      geslacht van het kind niet is kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19d
  - number: 19e.1
    text: Tot de aangifte van een geboorte is bevoegd de moeder van het kind.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19e
  - number: 19e.2
    text: Tot de aangifte is verplicht de vader.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19e
  - number: 19e.3
    text: 'Wanneer de vader ontbreekt of verhinderd is de aangifte te doen, is tot aangifte verplicht:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19e
  - number: 19e.3.a
    text: ieder die bij het ter wereld komen van het kind tegenwoordig is geweest;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19e
  - number: 19e.3.b
    text: |-
      de bewoner van het huis waar de geboorte heeft plaats gehad, of indien zulks is geschied in een inrichting tot
      verpleging of verzorging bestemd, in een gevangenis of in een soortgelijke inrichting, het hoofd van die inrichting
      of een door hem bij onderhandse akte bijzonderlijk tot het doen van de aangifte aangewezen ondergeschikte.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19e
  - number: 19e.4
    text: |-
      Voor een in het derde lid, onder *b*, genoemde persoon bestaat de verplichting alleen indien een onder *a* genoemde
      persoon ontbreekt of verhinderd is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19e
  - number: 19e.5
    text: |-
      Wanneer tot de aangifte bevoegde of verplichte personen ontbreken of nalaten de aangifte te doen, geschiedt deze
      door of vanwege de burgemeester van de gemeente alwaar de geboorteakte moet worden opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19e
  - number: 19e.6
    text: |-
      De verplichting tot aangifte moet worden vervuld binnen drie dagen na de dag der bevalling. Van een aangifte later
      dan de derde dag, bedoeld in de eerste zin van dit lid, wordt door de ambtenaar van de burgerlijke stand mededeling
      gedaan aan het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19e
  - number: 19e.7
    text: |-
      De ambtenaar van de burgerlijke stand stelt de identiteit van de aangever vast aan de hand van een document als
      bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 19e.8
    text: |-
      Bij de aangifte kan de ambtenaar van de burgerlijke stand zich doen overleggen een door de arts of de verloskundige
      die bij het ter wereld komen van het kind tegenwoordig was, opgemaakte verklaring dat het kind uit de als moeder
      opgegeven persoon is geboren. Is het kind buiten de tegenwoordigheid van een arts of verloskundige ter wereld
      gekomen, dan kan hij zich een door een zodanige hulpverlener nadien opgemaakte verklaring doen overleggen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19e
  - number: 19e.9
    text: |-
      Wordt geen gevolg gegeven aan het verzoek van de ambtenaar van de burgerlijke stand om overlegging van een
      verklaring als bedoeld in het achtste lid of is in de verklaring vermeld dat de identiteit van de moeder onbekend
      is, dan is [artikel 19b][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19b
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19b
        afdeling: '4'
  - number: 19f.1
    text: |-
      Een akte van overlijden wordt opgemaakt door de ambtenaar van de burgerlijke stand van de gemeente waar het
      overlijden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19f
  - number: 19f.2
    text: |-
      Indien een lijk is gevonden en de plaats of de dag van overlijden niet met voldoende nauwkeurigheid kan worden
      vastgesteld, wordt de akte van overlijden opgemaakt door de ambtenaar van de burgerlijke stand van de gemeente
      waarin het lijk is gevonden of aan land gebracht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19f
  - number: 19f.3
    text: |-
      Ongeacht het in het eerste lid bepaalde is het tweede lid van overeenkomstige toepassing indien het overlijden
      heeft plaatsgevonden op een op zee gestationeerde installatie en het lijk in Nederland aan land wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19f
  - number: 19g.1
    text: |-
      In geval van overlijden op Nederlands grondgebied in een rijdend voertuig of op een varend schip of tijdens een
      binnenlandse luchtreis met een luchtvaartuig, wordt de akte van overlijden opgemaakt door de ambtenaar van de
      burgerlijke stand van de gemeente waar het lijk het voertuig, het schip of het luchtvaartuig verlaat, dan wel waar
      het schip ligplaats kiest. Die gemeente geldt als gemeente waar het overlijden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19g
  - number: 19g.2
    text: |-
      In geval van overlijden tijdens een zeereis met een in Nederland geregistreerd voertuig, dan wel tijdens een
      internationale luchtreis met een in Nederland geregistreerd luchtvaartuig, is de gezagvoerder van het vaartuig
      of het luchtvaartuig verplicht een voorlopige akte van overlijden binnen vierentwintig uur in het journaal in
      te schrijven in tegenwoordigheid van twee getuigen. De gezagvoerder zendt een afschrift van die akte zo spoedig
      mogelijk naar de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage. Deze maakt de akte van
      overlijden op aan de hand van het ontvangen afschrift, met dien verstande dat hij gegevens die ontbreken of hem
      blijken onjuist te zijn, zoveel mogelijk aanvult of verbetert. Aan de personen op wie de akte betrekking heeft,
      wordt een uittreksel van de akte toegezonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19g
  - number: 19h.1
    text: Tot de aangifte van een overlijden is bevoegd wie daarvan uit eigen wetenschap kennis draagt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19h
  - number: 19h.2
    text: |-
      Binnen de in de [Wet op de lijkbezorging][ref1] (*Stb.* 1991, 130) gestelde termijn voor de begraving of
      verbranding, kan de persoon die in de lijkbezorging voorziet, door een in het eerste lid bedoelde persoon worden
      gemachtigd tot het doen van de aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0005009
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0005009
  - number: 19h.3
    text: |-
      Wanneer tot de aangifte bevoegde personen ontbreken of nalaten binnen de in de [Wet op de lijkbezorging][ref1]
      gestelde termijn voor de begraving of verbranding de aangifte te doen, geschiedt deze door of vanwege de
      burgemeester van de gemeente alwaar de akte van overlijden moet worden opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005009
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0005009
  - number: 19h.4
    text: |-
      In de gevallen bedoeld in [artikel 19][ref1], geschiedt de aangifte schriftelijk door de hulpofficier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19f
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19h
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19f
        afdeling: '4'
  - number: 19i.1
    text: |-
      Wanneer een kind levenloos ter wereld is gekomen, wordt een akte opgemaakt, die in het register van overlijden
      wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19i
  - number: 19i.2
    text: |-
      Wanneer een kind binnen de in [artikel 19e, zesde lid][ref1], bepaalde termijn is overleden voordat aangifte van de
      geboorte is geschied, wordt zowel een akte van geboorte als een akte van overlijden opgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19e
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19i
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19e
        afdeling: '4'
  - number: 19i.3
    text: |-
      In de in de vorige leden bedoelde gevallen is ten aanzien van de aangifte het bepaalde in [artikel 19h][ref1] van
      overeenkomstige toepassing. In het in het tweede lid bedoelde geval blijft [artikel 19e][ref2] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19h
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel19e
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19i
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19h
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 19e
        afdeling: '4'
  - number: 19j.1
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al wat betreft de aan de ambtenaar over te leggen stukken, het
      opmaken van de akten, onderscheidenlijk de voorlopige akten van geboorte en van overlijden, en de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19j
  - number: 19j.2
    text: 'Bij algemene maatregel van bestuur wordt tevens geregeld:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19j
  - number: 19j.2.a
    text: |-
      op welke wijze en waar de akten van geboorte en van overlijden zullen worden opgemaakt en ingeschreven wanneer
      dit ten gevolge van een verbod van verkeer of ten gevolge van andere buitengewone omstandigheden niet op de gewone
      wijze kan geschieden; en
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19j
  - number: 19j.2.b
    text: |-
      op welke wijze en waar overlijdensakten zullen worden opgemaakt van militairen en van andere personen, die tot de
      krijgsmacht behoren en die te velde, in de slag, of in ’s Rijks dienst buiten Nederland zijn overleden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel19j
  - number: '20.1'
    text: |-
      De ambtenaar van de burgerlijke stand voegt aan de onder hem berustende akten van de burgerlijke stand latere
      vermeldingen toe van akten van de burgerlijke stand en andere authentieke akten houdende naamskeuze, erkenning,
      ontkenning van het vaderschap door de moeder, van besluiten houdende wijziging of vaststelling van namen, van
      bevestigingen van opties mede houdende vaststelling van namen en naturalisatiebesluiten mede houdende wijziging
      of vaststelling van namen alsmede van besluiten tot intrekking van zulke bevestigingen of besluiten, van de
      opgave van afwijkende namen die een persoon die meer dan één nationaliteit bezit, voert in overeenstemming met het
      recht van het land waarvan hij mede de nationaliteit bezit, van akten houdende beëindiging van een geregistreerd
      partnerschap, van akten van omzetting van een geregistreerd partnerschap of van een huwelijk, alsmede van
      rechterlijke uitspraken waarvan de dagtekening ten minste twee maanden oud is en die inhouden:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20
  - number: 20.1.a
    text: |-
      een last tot wijziging van de voornamen of van de geslachtsnaam, een last tot wijziging van de vermelding van
      het geslacht, een adoptie, een herroeping van een adoptie, een vernietiging van een erkenning, een gerechtelijke
      vaststelling van het vaderschap, een gegrondverklaring van een ontkenning van het vaderschap of, of een
      vernietiging van zulk een uitspraak;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20
  - number: 20.1.b
    text: |-
      de nietigverklaring van een huwelijk of van een geregistreerd partnerschap of de vernietiging van zulk een
      uitspraak tussen echtelieden of geregistreerde partners wier huwelijksakte onderscheidenlijk akte van een
      geregistreerd partnerschap, dan wel akte van omzetting van een geregistreerd partnerschap of huwelijk in de
      Nederlandse registers van de burgerlijke stand is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20
  - number: '20.2'
    text: |-
      De ambtenaar van de burgerlijke stand voegt eveneens aan de onder hem berustende akten van de burgerlijke stand
      latere vermeldingen toe van in kracht van gewijsde gegane rechterlijke uitspraken die een echtscheiding of een
      ontbinding van een geregistreerd partnerschap, een ontbinding van een huwelijk na scheiding van tafel en bed
      of de vernietiging van zulk een uitspraak tussen echtelieden wier huwelijksakte, akte van registratie van een
      partnerschap of akte van omzetting van een geregistreerd partnerschap of huwelijk in de Nederlandse registers van
      de burgerlijke stand is opgenomen, inhouden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20
  - number: 20a.1
    text: |-
      De in [artikel 20][ref1] bedoelde latere vermeldingen, met uitzondering van de vermeldingen bedoeld in het eerste
      lid, onder b, alsmede van de vermeldingen houdende beëindiging van een geregistreerd partnerschap en van de
      vermeldingen van een omzetting van een geregistreerd partnerschap of van een huwelijk, worden toegevoegd aan de
      geboorteakte van de betrokken persoon. Van een wijziging of vaststelling van de geslachtsnaam wordt tevens een
      latere vermelding toegevoegd aan de geboorteakten van de kinderen van de betrokken persoon, voor zover de wijziging
      of vaststelling zich tot hen uitstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '20'
        afdeling: '5'
  - number: 20a.2
    text: |-
      De in [artikel 20, eerste lid, onder b, en tweede lid][ref1], bedoelde latere vermeldingen alsmede de in de
      [aanhef van artikel 20, eerste lid,][ref2] bedoelde beëindiging van een geregistreerd partnerschap en de daar
      bedoelde omzetting, worden toegevoegd aan de huwelijksakte dan wel aan de akte van registratie van een partnerschap
      van de betrokken persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel20
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '20'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '20'
        afdeling: '5'
  - number: 20a.3
    text: |-
      Wanneer als gevolg van het huwelijk of van de echtscheiding een verandering intreedt in de geslachtsnaam van een
      persoon, wordt hiervan, voorzover zij niet in de huwelijksakte is vermeld, aan deze akte een latere vermelding
      toegevoegd. Tevens wordt daarvan een latere vermelding toegevoegd aan de geboorteakte van de betrokkene en de
      geboortenakten van diens kinderen, voor zover hun naam eveneens verandert.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20a
  - number: 20a.4
    text: |-
      Van een aan de ambtenaar van de burgerlijke stand betekende akte van stuiting van een huwelijk of van een
      registratie van een partnerschap wordt, evenals van beschikkingen of akten waarbij de stuiting wordt opgeheven, aan
      de akte van aangifte een latere vermelding toegevoegd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20a
  - number: 20b.1
    text: |-
      Van akten en uitspraken die buiten Nederland overeenkomstig de plaatselijke voorschriften door een bevoegde
      instantie zijn opgemaakt of gedaan en een overeenkomstige uitwerking hebben als de akten en rechterlijke
      uitspraken, bedoeld in [artikel 20][ref1], wordt, tenzij de Nederlandse openbare orde zich hiertegen verzet, op
      verzoek van een belanghebbende dan wel ambtshalve, door de ambtenaar van de burgerlijke stand een latere vermelding
      toegevoegd aan de desbetreffende in de registers van de burgerlijke stand hier te lande voorkomende huwelijksakte,
      akte van registratie van een partnerschap, akte van omzetting van een geregistreerd partnerschap of huwelijk of
      geboorteakte. Van een verandering van de geslachtsnaam wordt op verzoek van een belanghebbende tevens een latere
      vermelding gevoegd bij de geboorteakte van de kinderen van de betrokken persoon, voor zover hun naam eveneens
      verandert.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '20'
        afdeling: '5'
  - number: 20b.2
    text: |-
      Indien een latere vermelding ambtshalve aan een akte is toegevoegd, zendt de ambtenaar van de burgerlijke stand een
      afschrift van de akte en de latere vermelding aan de persoon of personen op wie de akte betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20b
  - number: 20c
    text: |-
      De [artikelen 18][ref1] en [18b][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel18b
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '18'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 18b
        afdeling: '3'
  - number: 20d
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al wat betreft de aan de ambtenaar over te leggen stukken, het
      opmaken van de latere vermeldingen en de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20d
  - number: 20e.1
    text: |-
      Van de in [artikel 20, eerste lid][ref1], genoemde uitspraken zendt de griffier van het college waarvoor de zaak
      laatstelijk aanhangig was niet eerder dan twee maanden na de dag van de beschikking een afschrift aan de ambtenaar
      van de burgerlijke stand.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel20
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '20'
        afdeling: '5'
  - number: 20e.2
    text: |-
      Van besluiten houdende wijziging of vaststelling van namen en van naturalisatiebesluiten mede houdende wijziging
      of vaststelling van namen zendt Onze Minister van Justitie onverwijld een afschrift aan de ambtenaar van de
      burgerlijke stand onder wie de akte van geboorte van de betrokken persoon berust.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20e
  - number: 20e.3
    text: |-
      De notaris die een akte van erkenning heeft opgemaakt, zendt onverwijld een afschrift of een uittreksel daarvan aan
      de ambtenaar van de burgerlijke stand onder wie de akte van geboorte van het kind berust.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20e
  - number: 20f.1
    text: |-
      De ambtenaar van de burgerlijke stand die de gegevens van een akte van naamskeuze opneemt in de akte van geboorte
      van het kind, zendt een afschrift van die akte aan de ambtenaar van de burgerlijke stand die de akte van naamskeuze
      heeft opgemaakt. Deze akte wordt bewaard totdat achttien maanden zijn verstreken na de ontvangst van dat afschrift.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20f
  - number: 20f.2
    text: |-
      De ambtenaar van de burgerlijke stand die een latere vermelding van de naamskeuze, de erkenning toevoegt aan
      de akte van geboorte van het kind, zendt een afschrift van die akte en de latere vermelding aan de personen
      op wie de akte betrekking heeft. Hij zendt een afschrift aan de ambtenaar van de burgerlijke stand die de akte
      van naamskeuze, van erkenning heeft opgemaakt. Laatstgenoemde akte wordt bewaard totdat achttien maanden zijn
      verstreken na de ontvangst van laatstgenoemd afschrift dan wel, indien geen zodanig afschrift wordt ontvangen,
      totdat achttien maanden zijn verstreken na het opmaken van de akte.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20f
  - number: 20g
    text: |-
      De ambtenaar van de burgerlijke stand die aan de geboorteakte van een minderjarige een latere vermelding toevoegt,
      waaruit blijkt dat de minderjarige is erkend, of dat een naam van hem is gewijzigd, geeft van dit feit kennis aan
      de bewaarder van het in [artikel 244 van dit boek][ref1] bedoelde openbare register waarin rechtsfeiten omtrent die
      minderjarige zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel244
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel20g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '244'
        afdeling: '4'
  - number: '21.1'
    text: |-
      De ambtenaar van de burgerlijke stand te 's-Gravenhage maakt akten van inschrijving op van in kracht
      van gewijsde gegane rechterlijke uitspraken betreffende huwelijken of registraties van een partnerschap,
      waarvan de akten niet in de Nederlandse registers van de burgerlijke stand zijn opgenomen, welke inhouden de
      nietigverklaring van een huwelijk of van een geregistreerd partnerschap, een echtscheiding, de ontbinding van
      een geregistreerd partnerschap, de ontbinding van een huwelijk na scheiding van tafel en bed of de vernietiging
      van zulk een ingeschreven uitspraak, dan wel de beëindiging van een geregistreerd partnerschap, bedoeld in
      [artikel 80c, onder c][ref1], of de vernietiging daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
  - number: '21.2'
    text: |-
      De in het eerste lid bedoelde akten worden ingeschreven in het daartoe bestemde register van de burgerlijke stand
      te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel21
  - number: '21.3'
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al wat betreft de aan de ambtenaar over te leggen stukken, het
      opmaken van de akten van inschrijving en de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel21
  - number: '22.1'
    text: |-
      De akte van geboorte bewijst ten aanzien van een ieder dat op de in de akte vermelde plaats, dag en uur uit de
      daarin genoemde moeder een kind van het daarin vermelde geslacht is geboren. Vermeldt de akte dat de plaats van de
      geboorte van het kind niet bekend is, dan komt dezelfde bewijskracht toe aan de vermelding van de plaats waar het
      is aangetroffen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel22
  - number: '22.2'
    text: |-
      De akte van overlijden bewijst ten aanzien van een ieder, dat op de plaats, de dag en het uur, in de akte vermeld,
      de daarin genoemde persoon is overleden of, indien de akte krachtens [artikel 19f, tweede lid, van dit boek][ref1]
      is opgemaakt, dat het lijk van de daarin genoemde persoon op de plaats, de dag en het uur, in de akte vermeld,
      is gevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel19f
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 19f
        afdeling: '4'
  - number: '22.3'
    text: Voor het overige hebben akten van de burgerlijke stand dezelfde bewijskracht als andere authentieke akten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel22
  - number: 22a
    text: |-
      Authentieke afschriften of uittreksels, in de wettige vorm opgemaakt en afgegeven door de daartoe bevoegde
      bewaarder van het register, hebben dezelfde bewijskracht als het origineel, tenzij bewezen wordt dat zij daarmede
      niet overeenstemmen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel22a
  - number: '23'
    text: |-
      De akten van de burgerlijke stand, daaronder begrepen de dubbelen van deze akten, zijn openbaar voor zover te dien
      aanzien in deze afdeling geen nadere voorziening is gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel23
  - number: 23a
    text: |-
      Van de akten van de burgerlijke stand mogen slechts de bewaarders en het openbaar ministerie inzage nemen. Voorts
      kunnen de rechter en het openbaar ministerie overlegging van akten bevelen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel23a
  - number: 23b.1
    text: |-
      Een ieder is bevoegd zich door de ambtenaar die met de afgifte van afschriften en uittreksels van akten van
      de burgerlijke stand is belast, een uittreksel van een onder deze ambtenaar berustende akte van geboorte,
      van huwelijk, van registratie van een partnerschap, van omzetting van een huwelijk in een registratie van een
      partnerschap, van omzetting van een registratie van een partnerschap in een huwelijk of van overlijden te doen
      afgeven. Het uittreksel bevat de bij algemene maatregel van bestuur te vermelden gegevens, waaruit de afstamming
      van de persoon of personen waarop de akte betrekking heeft, niet blijkt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel23b
  - number: 23b.2
    text: |-
      Van de in het eerste lid bedoelde akten alsmede van de akten van erkenning of ontkenning van het vaderschap
      door de moeder wordt een afschrift slechts afgegeven indien de verzoeker aantoont dat hij bij de verkrijging een
      gerechtvaardigd belang heeft. Van andere akten die de in het eerste lid bedoelde ambtenaar onder zijn berusting
      heeft, wordt steeds een afschrift afgegeven. Dit afschrift bevat de bij algemene maatregel van bestuur te vermelden
      gegevens.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel23b
  - number: 23b.3
    text: |-
      Een verzoek om afgifte van een uittreksel of een afschrift dient op een bepaalde persoon of bepaalde personen
      betrekking te hebben.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel23b
  - number: 23b.4
    text: |-
      Bij algemene maatregel van bestuur wordt geregeld al hetgeen overigens het opmaken en het verstrekken van
      afschriften en uittreksels betreft. Daarbij worden tevens regels gegeven voor het opmaken van uittreksels van akten
      die voor de inwerkingtreding van deze wet zijn opgemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel23b
  - number: 23b.5
    text: |-
      Weigert de in het eerste lid bedoelde ambtenaar een afschrift of een uittreksel af te geven, dan verstrekt hij aan
      de aanvrager een schriftelijke opgave van de gronden voor zijn weigering.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel23b
  - number: 23c
    text: |-
      De dubbelen van de akten van de burgerlijke stand zijn openbaar zolang zij onder de ambtenaar van de burgerlijke
      stand berusten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel23c
  - number: '24.1'
    text: |-
      Aanvulling van een register van de burgerlijke stand met een daarin ontbrekende akte of latere vermelding,
      doorhaling van een daarin ten onrechte voorkomende akte of latere vermelding, of verbetering van een daarin
      voorkomende akte of latere vermelding die onvolledig is of een misslag bevat, kan op verzoek van belanghebbenden of
      van het openbaar ministerie worden gelast door de rechtbank. De rechtbank kan bij haar beschikking tot verbetering
      van een akte of latere vermelding die onvolledig is of een misslag bevat, eveneens dezelfde verbetering gelasten
      ten aanzien van een akte of latere vermelding betreffende dezelfde persoon of zijn afstammelingen, die buiten haar
      rechtsgebied in de registers van de burgerlijke stand is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel24
  - number: '24.2'
    text: |-
      De griffier van het college waarvoor de zaak laatstelijk aanhangig was, zendt niet eerder dan twee maanden na de
      dag van de beschikking een afschrift daarvan aan de ambtenaar van de burgerlijke stand van de gemeente, in welker
      registers de akte of latere vermelding is of had moeten zijn opgenomen. Is deze gemeente opgeheven, dan zendt
      hij het afschrift aan de ambtenaar van de gemeente in wier archieven de registers van de burgerlijk stand van de
      opgeheven gemeente berusten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel24
  - number: 24a.1
    text: |-
      Kennelijke misslagen kunnen worden verbeterd met toestemming van de officier van justitie binnen wiens rechtsgebied
      de akte in de registers van de burgerlijke stand is opgenomen. De toestemming van de officier van justitie kan
      eveneens betrekking hebben op dezelfde verbetering ten aanzien van een akte betreffende dezelfde persoon of zijn
      afstammelingen, die in een ander arrondissement in de registers van de burgerlijke stand is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel24a
  - number: 24a.2
    text: Kennelijke schrijf- of spelfouten kunnen ambtshalve door de ambtenaar van de burgerlijke stand worden verbeterd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel24a
  - number: 24b.1
    text: |-
      Aanvulling van een register van de burgerlijke stand op grond van [artikel 24][ref1] geschiedt door het opmaken van
      een nieuwe akte in dat register.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel24
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel24b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '24'
        afdeling: '9'
  - number: 24b.2
    text: |-
      Van een verbetering of een doorhaling op grond van deze afdeling wordt een latere vermelding toegevoegd aan de
      desbetreffende akte, volgens regels, bij algemene maatregel van bestuur te stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel24b
  - number: '25.1'
    text: |-
      Buiten Nederland overeenkomstig de plaatselijke voorschriften door een bevoegde instantie opgemaakte akten van
      geboorte, huwelijksakten, akten van registratie van een partnerschap en akten van overlijden worden op bevel van
      het openbaar ministerie of op verzoek van een belanghebbende ingeschreven in de registers onderscheidenlijk van
      geboorten, van huwelijken, van geregistreerde partnerschappen en van overlijden van de gemeente 's-Gravenhage,
      indien:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
  - number: 25.1.a
    text: |-
      de akte een persoon betreft die op het ogenblik van het verzoek Nederlander is of te eniger tijd Nederlander dan
      wel Nederlands onderdaan niet-Nederlander is geweest;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
  - number: 25.1.b
    text: |-
      de akte een persoon betreft die rechtmatig verblijft op grond van
      [artikel 8, onder c en d, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '25.2'
    text: |-
      Buiten Nederland overeenkomstig de plaatselijke voorschriften door een bevoegde instantie opgemaakte akten van
      geboorte worden op bevel van het openbaar ministerie of op verzoek van een belanghebbende ingeschreven in het
      register van geboorten van de gemeente 's-Gravenhage, indien de akte een persoon van vreemde nationaliteit betreft
      en op grond van enige bepaling van dit boek een latere vermelding aan de akte van geboorte moet worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
  - number: '25.3'
    text: |-
      De ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage kan ook ambtshalve de in de vorige leden
      bedoelde akten inschrijven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
  - number: '25.4'
    text: |-
      Alvorens op grond van het eerste of derde lid tot de inschrijving van een huwelijksakte of van een akte van
      registratie van een partnerschap over te gaan, doet de ambtenaar van de burgerlijke stand van de gemeente 's-
      Gravenhage zich een door de korpschef in de zin van de [Vreemdelingenwet 2000][ref1] afgegeven verklaring als
      bedoeld in [artikel 44, eerste lid, onder k][ref2], overleggen. Deze verklaring wordt opgesteld op verzoek van
      de echtgenoot of de geregistreerde partner op wie zij betrekking heeft. Bij het verzoek wordt een gewaarmerkt
      afschrift als bedoeld in artikel 44, eerste lid, onder a, overgelegd. Heeft deze geen woonplaats in Nederland, dan
      wordt zij opgesteld op verzoek van de andere echtgenoot of de andere geregistreerde partner. De verklaring is niet
      vereist indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel44
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '44'
        afdeling: '2'
  - number: 25.4.a
    text: |-
      de echtgenoten of geregistreerde partners aannemelijk kunnen maken dat zij beiden buiten Nederland woonplaats
      hebben;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
  - number: 25.4.b
    text: |-
      de betrokken echtgenoot of geregistreerde partner die niet de Nederlandse nationaliteit bezit, in Nederland
      rechtmatig verblijft op grond van [artikel 8, onder b, d of e, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 25.4.c
    text: het huwelijk of het geregistreerd partnerschap ten minste tien jaren vóór de inschrijving is voltrokken, of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
  - number: 25.4.d
    text: het huwelijk of het geregistreerd partnerschap is geëindigd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
  - number: '25.5'
    text: |-
      In geval van adoptie gelast de rechtbank, die de adoptie uitspreekt, ambtshalve afzonderlijk de inschrijving van de
      in het eerste en het tweede lid bedoelde akte van geboorte.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
  - number: '25.6'
    text: De akte van inschrijving vermeldt de bij algemene maatregel van bestuur vast te stellen gegevens.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
  - number: '25.7'
    text: |-
      Kennelijke misslagen of schrijf- of spelfouten, die de ambtenaar van de burgerlijke stand in de in te schrijven
      akte vaststelt op grond van een hier te lande in de registers van de burgerlijke stand opgenomen akte of op grond
      van een rechterlijke uitspraak, kunnen ambtshalve door hem worden verbeterd. De verbeteringen worden afzonderlijk
      in de akte vermeld.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
  - number: '25.8'
    text: |-
      Indien een akte ambtshalve is ingeschreven, wordt een afschrift van de akte van inschrijving toegezonden aan de
      persoon of de personen op wie de akte betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25
  - number: 25a.1
    text: |-
      Indien na de inschrijving kennelijke misslagen in de buiten Nederland opgemaakte akte overeenkomstig de
      plaatselijke voorschriften door een bevoegde instantie zijn verbeterd, wordt de verbetering in de akte van
      inschrijving aangebracht doordat de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage, aan wie een
      afschrift van de beslissing tot verbetering en een afschrift van de verbeterde akte zijn overgelegd, een latere
      vermelding van de verbetering aan de akte van inschrijving toevoegt, nadat hij daartoe toestemming van de officier
      van justitie heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25a
  - number: 25a.2
    text: |-
      Kennelijke schrijf- en spelfouten, die in de buiten Nederland opgemaakte akte overeenkomstig de plaatselijke
      voorschriften door een bevoegde instantie zijn verbeterd, kunnen ook zonder toestemming van de officier van
      justitie, ambtshalve door de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage aan de hand van een
      afschrift van de verbeterde akte worden verbeterd op de in het eerste lid aangegeven wijze.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25a
  - number: 25b
    text: |-
      Aan de akte van inschrijving, bedoeld in [artikel 25][ref1], worden de latere vermeldingen toegevoegd die op grond
      van dit boek aan een in Nederland opgemaakte akte van geboorte, huwelijksakte of akte van overlijden moeten worden
      toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '25'
        afdeling: '10'
  - number: 25c.1
    text: |-
      Indien ten aanzien van een buiten Nederland geboren persoon geen akte van geboorte overeenkomstig de plaatselijke
      voorschriften door een bevoegde instantie is opgemaakt of kan worden overgelegd, kan op verzoek van het openbaar
      ministerie, van een belanghebbende of van de ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage de
      rechtbank te 's-Gravenhage de voor het opmaken van een geboorteakte noodzakelijke gegevens vaststellen, indien:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25c
  - number: 25c.1.a
    text: die persoon Nederlander is of te eniger tijd Nederlander dan wel Nederlands onderdaan niet-Nederlander is geweest;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25c
  - number: 25c.1.b
    text: |-
      die persoon rechtmatig verblijft op grond van [artikel 8, onder c en d, van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25c
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 25c.1.c
    text: op grond van dit boek een latere vermelding aan de akte van geboorte moet worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25c
  - number: 25c.2
    text: |-
      De rechtbank houdt rekening met alle bewijzen en aanwijzingen omtrent de omstandigheden waaronder, en het tijdstip
      waarop de geboorte moet hebben plaatsgehad. De geslachtsnaam, de voornamen, alsmede de plaats en de dag van de
      geboorte van de vader en van de moeder worden vastgesteld, voor zover daarvoor aanwijzingen zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25c
  - number: 25c.3
    text: |-
      In geval van adoptie geeft de rechtbank die de adoptie uitspreekt, ambtshalve afzonderlijk de in het eerste lid
      bedoelde beschikking.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25c
  - number: 25d
    text: |-
      De rechtbank te 's-Gravenhage kan op verzoek van het openbaar ministerie, van een belanghebbende of van de
      ambtenaar van de burgerlijke stand van de gemeente 's-Gravenhage de krachtens [artikel 25c][ref1] gegeven
      beschikking wijzigen op grond dat de vastgestelde gegevens onjuist of onvolledig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 25c
        afdeling: '10'
  - number: 25f.1
    text: |-
      De griffier van het college waarvoor de zaak laatstelijk aanhangig was, zendt niet eerder dan twee maanden na
      de dag van de beschikking een afschrift daarvan, aan de ambtenaar van de burgerlijke stand van de gemeente 's-
      Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25f
  - number: 25f.2
    text: |-
      Deze ambtenaar maakt van de beschikking, bedoeld in [artikel 25][ref1] een akte van inschrijving op, die geldt
      als een akte van geboorte in de zin van [artikel 19 van dit boek][ref2]. Deze akte is in overeenstemming met de
      beschikking en vermeldt dit uitdrukkelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel19
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 25c
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '19'
        afdeling: '4'
  - number: 25f.3
    text: |-
      Van de beschikking, bedoeld in [artikel 25][ref1], wordt een latere vermelding toegevoegd aan de akte als bedoeld
      in het vorige lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25d
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25f
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 25d
        afdeling: '10'
  - number: 25g.1
    text: |-
      Op akten en uitspraken die buiten Nederland overeenkomstig de plaatselijke voorschriften door een bevoegde
      instantie zijn opgemaakt of gedaan en een overeenkomstige uitwerking hebben als de in [artikel 25c][ref1] van
      dit boek bedoelde beschikkingen, zijn de [artikelen 25 tot en met 25b][ref2] van overeenkomstige toepassing. De
      inschrijving als bedoeld in [artikel 25][ref3] vindt niet plaats indien de Nederlandse openbare orde zich hiertegen
      verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel25
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 25c
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '25'
        afdeling: '10'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '25'
        afdeling: '10'
  - number: 25g.2
    text: |-
      In geval van adoptie van een buiten Nederland geboren kind ten aanzien waarvan een akte of uitspraak als bedoeld in
      het vorige lid is opgemaakt of gedaan, geeft de rechtbank die de adoptie uitspreekt, ambtshalve afzonderlijk last
      tot inschrijving van die akte of uitspraak.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel25g
  - number: '26.1'
    text: |-
      Een ieder die daarbij een gerechtvaardigd belang heeft, kan de rechtbank verzoeken een verklaring voor recht af
      te geven dat een op hem betrekking hebbende, buiten Nederland opgemaakte akte of gedane uitspraak overeenkomstig
      de plaatselijke voorschriften door een bevoegde instantie is opgemaakt of gedaan en naar zijn aard vatbaar is voor
      opneming in een Nederlands register van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel26
  - number: '26.2'
    text: |-
      De in het eerste lid bedoelde verklaring voor recht kan eveneens op verzoek van de ambtenaar van de burgerlijke
      stand of van het openbaar ministerie worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel26
  - number: 26a
    text: |-
      De rechtbank kan, op verzoek of ambtshalve, bij de in het [eerste lid van artikel 26][ref1] bedoelde verklaring
      voor recht tevens de toevoeging van een latere vermelding, op grond van [artikel 24, eerste lid][ref2], aan een in
      de Nederlandse registers van de burgerlijke stand voorkomende akte gelasten.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel24
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '26'
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '24'
        afdeling: '9'
  - number: 26b
    text: |-
      Is met betrekking tot de verzoeker geen akte in de Nederlandse registers van de burgerlijke stand opgenomen,
      dan kan de rechtbank te 's-Gravenhage, op verzoek of ambtshalve, bij haar beschikking tevens de inschrijving,
      overeenkomstig [artikel 25][ref1], van een daarvoor in aanmerking komende in het buitenland opgemaakte akte
      in de registers van de burgerlijke stand te 's-Gravenhage gelasten, alsmede de verbetering van de akte van
      inschrijving op grond van [artikel 24, eerste lid][ref2]. Ook kan zij bij haar beschikking een last als bedoeld in
      [artikel 25c][ref3] geven alsmede een last tot verbetering, overeenkomstig [artikel 24, eerste lid][ref4], van de
      door de ambtenaar van de burgerlijke stand te 's-Gravenhage op te maken akte.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel24
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '25'
        afdeling: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '24'
        afdeling: '9'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 25c
        afdeling: '10'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '24'
        afdeling: '9'
  - number: 26d
    text: |-
      De overlegging van een authentiek afschrift van de buitenlandse akte of uitspraak waarop het verzoek betrekking
      heeft, kan worden verlangd. [Artikel 986, derde en vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel986
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel26d
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '986'
  - number: 26e
    text: |-
      De griffier van het college, waarbij de zaak laatstelijk aanhangig was, zendt een afschrift van de beschikking
      aan de ambtenaar van de burgerlijke stand in wiens registers een op de belanghebbende betrekking hebbende akte is
      opgenomen, waaraan een latere vermelding van de beschikking moet worden toegevoegd. Is bij de beschikking een last
      tot inschrijving van een in het buitenland opgemaakte akte gegeven, dan zendt de griffier een afschrift van de
      beschikking aan de ambtenaar van de burgerlijke stand te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel26e
  - number: '27'
    text: |-
      Naar aanleiding van een besluit van een ambtenaar van de burgerlijke stand om op grond van [artikel 18b][ref1] of
      20*c* te weigeren een akte van de burgerlijke stand op te maken, een latere vermelding aan een akte toe te voegen
      of, buiten het geval van stuiting van het huwelijk of het geregistreerd partnerschap en dat van afgifte van een
      afschrift of een uittreksel, aan een verrichting mee te werken, hebben belanghebbende partijen de bevoegdheid
      zich binnen zes weken na de verzending van dat besluit bij verzoekschrift te wenden tot de rechtbank binnen welker
      rechtsgebied de standplaats van de ambtenaar van de burgerlijke stand is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel18b
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 18b
        afdeling: '3'
  - number: 27a
    text: |-
      De rechtbank kan, op verzoek van een belanghebbende partij of ambtshalve, bij haar beschikking tevens een
      verklaring als bedoeld in [artikel 26][ref1] afgeven, alsmede een last als bedoeld in [artikel 26a][ref2],
      onderscheidenlijk [artikel 26b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel26a
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel26b
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '26'
        afdeling: '11'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 26a
        afdeling: '11'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 26b
        afdeling: '11'
  - number: 27b
    text: |-
      De griffier zendt een afschrift van de beschikking aan de belanghebbende partijen en aan de ambtenaar van de
      burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel27b
  - number: '28.1'
    text: |-
      Iedere Nederlander die de overtuiging heeft tot het andere geslacht te behoren dan is vermeld in de akte van
      geboorte en lichamelijk aan het verlangde geslacht is aangepast voor zover dit uit medisch of psychologisch oogpunt
      mogelijk en verantwoord is, kan de rechtbank verzoeken wijziging van de vermelding van het geslacht in de akte van
      geboorte te gelasten, indien deze persoon als mannelijk in de akte van geboorte vermeld staande, nimmer meer in
      staat zal zijn kinderen te verwekken, dan wel als vrouwelijk in de akte van geboorte vermeld staande, nimmer meer
      in staat zal zijn kinderen te baren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28
  - number: '28.2'
    text: |-
      Voor de toepassing van het bepaalde in het eerste lid en de [artikelen 28a][ref1] en [28b van dit boek][ref2]
      wordt onder akte van geboorte mede verstaan een akte van inschrijving van een buiten Nederland opgemaakte akte van
      geboorte of van een beschikking als bedoeld in [artikel 25c van dit boek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel28a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel28b
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel25c
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 28a
        afdeling: '13'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 28b
        afdeling: '13'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 25c
        afdeling: '10'
  - number: '28.3'
    text: |-
      Degene, die de Nederlandse nationaliteit niet bezit, kan een verzoek als bedoeld in het eerste lid doen, indien
      hij reeds gedurende een tijdvak van ten minste één jaar, onmiddellijk voorafgaande aan het verzoek, woonplaats
      in Nederland heeft en een rechtsgeldige verblijfstitel heeft en voor het overige voldoet aan de in het eerste
      lid gestelde voorwaarden. Indien de akte van geboorte niet hier te lande in de registers van de burgerlijke stand
      is ingeschreven, wordt tevens de rechtbank verzocht de inschrijving te gelasten van de akte van geboorte in het
      register van geboorten van de gemeente 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28
  - number: 28a.1
    text: |-
      Bij het verzoek moeten worden overgelegd een afschrift van de akte van geboorte alsmede een gezamenlijk
      ondertekende verklaring van bij algemene maatregel van bestuur aangewezen deskundigen, afgegeven ten hoogste zes
      maanden voor de datum van indiening van het verzoek, waaruit blijkt:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28a
  - number: 28a.1.a
    text: |-
      de overtuiging van de verzoeker dat hij tot het andere geslacht behoort dan in de akte van geboorte is vermeld en
      waarin is vervat het oordeel van de daartoe bevoegde deskundige dat die overtuiging, gelet op de periode waarin de
      verzoeker als zodanig heeft geleefd en zo mogelijk op andere daarbij te vermelden feiten of omstandigheden, als van
      blijvende aard kan worden beschouwd;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28a
  - number: 28a.1.b
    text: |-
      of en zo ja, in hoeverre de verzoeker lichamelijk aan het verlangde geslacht zodanig is aangepast als uit medisch
      of psychologisch oogpunt mogelijk en verantwoord is;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28a
  - number: 28a.1.c
    text: |-
      dat de verzoeker als mannelijk in de akte van geboorte vermeld staande, nimmer meer in staat zal zijn kinderen te
      verwekken, dan wel als vrouwelijk in de akte van geboorte vermeld staande, nimmer meer in staat zal zijn kinderen
      te baren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28a
  - number: 28a.2
    text: |-
      In de verklaring behoeft het in het eerste lid onder *a* bedoelde onderdeel niet te worden opgenomen indien de
      verzoeker lichamelijk reeds aan het verlangde geslacht is aangepast.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28a
  - number: 28b.1
    text: |-
      Het verzoek wordt toegewezen indien de rechtbank van oordeel is dat voldoende is komen vast te staan dat
      de verzoeker de overtuiging heeft tot het andere geslacht te behoren dan in de akte van geboorte is vermeld
      en dat deze overtuiging als van blijvende aard kan worden beschouwd en de verzoeker voldoet aan de in het
      [eerste lid van artikel 28][ref1] gestelde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel28
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28b
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '28'
        afdeling: '13'
  - number: 28b.2
    text: |-
      Indien de rechtbank het verzoek om wijziging van de vermelding van het geslacht inwilligt, kan zij desverzocht
      tevens de wijziging van de voornamen van de verzoeker gelasten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28b
  - number: 28c.1
    text: |-
      De wijziging van de vermelding van het geslacht heeft haar gevolgen, die uit dit boek voortvloeien, vanaf de dag
      waarop de ambtenaar van de burgerlijke stand aan de akte van geboorte een latere vermelding toevoegt van de last
      tot wijziging.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28c
  - number: 28c.2
    text: |-
      De wijziging van de vermelding van het geslacht laat de op het in het eerste lid genoemde tijdstip
      bestaande familierechtelijke betrekkingen en de daaruit voortvloeiende op dit boek gegronde rechten,
      bevoegdheden en verplichtingen onverlet. De verzoeken in verband met [artikel 157][ref1] en in verband met
      [artikel 394 van dit boek][ref2] kunnen ook worden gedaan na het in het eerste lid genoemde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel394
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel28c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '394'
        afdeling: '1'
  - number: '29'
    text: Er is een Commissie van advies voor de zaken betreffende de burgerlijke staat en de nationaliteit.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel29
  - number: 29a.1
    text: De Commissie bestaat uit ten minste negen en ten hoogste vijftien leden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel29a
  - number: 29a.2
    text: |-
      De Commissie bestaat uit ten minste een lid van de rechterlijke macht, ten minste een lid uit de kring van het
      wetenschappelijk onderzoek, ten minste twee leden uit de kring van de ambtenaren van de burgerlijke stand en ten
      minste twee leden uit de kring van de gemeentelijke basisadministratie.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel29a
  - number: 29a.3
    text: |-
      Onze Minister van Justitie benoemt en ontslaat de in het voorgaande lid bedoelde leden in overeenstemming met Onze
      Minister van Binnenlandse Zaken. Voorts wijst hij een voorzitter en een secretaris aan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel29a
  - number: 29b.1
    text: |-
      De Commissie brengt op verzoek van een ambtenaar van de burgerlijke stand of een ander bestuursorgaan advies uit
      over vragen betreffende de rechtstoepassing in zaken van burgerlijke staat of nationaliteit.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel29b
  - number: 29b.2
    text: |-
      Indien een advies van algemeen belang is, wordt het openbaar gemaakt. De Commissie bepaalt de wijze van
      openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel29b
  - number: 29c
    text: |-
      Indien een ambtenaar van de burgerlijke stand gerede twijfel heeft over de vraag of een aan een buiten Nederland
      opgemaakte akte van de burgerlijke stand of ander geschrift te ontlenen gegeven in aanmerking komt om in een akte
      van de burgerlijke stand te worden opgenomen, is hij gehouden het advies van de Commissie in te winnen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel29c
  - number: 29d
    text: |-
      Indien een ambtenaar van de burgerlijke stand een door de Commissie gegeven advies niet opvolgt, stelt hij de
      Commissie en de officier van justitie hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel29d
  - number: 29e
    text: Onze Minister van Justitie kan nadere regels stellen omtrent de taak en de werkwijze van de Commissie.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel29e
  - number: 29f
    text: |-
      Telkens binnen een termijn van vier jaren brengt de Commissie een rapport uit aan Onze Minister van Justitie,
      waarin de taakvervulling van de Commissie aan een onderzoek wordt onderworpen en voorstellen kunnen worden gedaan
      voor gewenste veranderingen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel29f
  - number: '30.1'
    text: Een huwelijk kan worden aangegaan door twee personen van verschillend of van gelijk geslacht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel30
  - number: '30.2'
    text: De wet beschouwt het huwelijk alleen in zijn burgerlijke betrekkingen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel30
  - number: '31.1'
    text: Om een huwelijk te mogen aangaan moeten een man en een vrouw de leeftijd van achttien jaren hebben bereikt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel31
  - number: '31.2'
    text: |-
      Het in het vorige lid vermelde huwelijksbeletsel bestaat niet wanneer zij die met elkander een huwelijk willen
      aangaan de leeftijd van zestien jaren hebben bereikt en de vrouw een verklaring van een arts overlegt dat zij
      zwanger is, dan wel haar kind reeds ter wereld heeft gebracht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel31
  - number: '31.3'
    text: |-
      Onze Minister van Justitie kan om gewichtige redenen ontheffing verlenen van het in het eerste lid genoemde
      vereiste.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel31
  - number: '32'
    text: |-
      Een huwelijk mag niet worden aangegaan, wanneer de geestvermogens van een partij zodanig zijn gestoord, dat deze
      niet in staat is haar wil te bepalen of de betekenis van haar verklaring te begrijpen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel32
  - number: '33'
    text: Een persoon kan tegelijkertijd slechts met één andere persoon door het huwelijk verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel33
  - number: '35.1'
    text: Een minderjarige mag geen huwelijk aangaan zonder toestemming van zijn ouders.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel35
  - number: '35.2'
    text: |-
      Zijn de geestvermogens van een ouder zodanig gestoord, dat hij niet in staat is zijn wil te bepalen of de betekenis
      van zijn verklaring te begrijpen, dan is zijn toestemming niet vereist.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel35
  - number: '35.3'
    text: Een minderjarige, die onder voogdij staat, heeft bovendien de toestemming van zijn voogd nodig.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel35
  - number: '36'
    text: |-
      Voor zover een volgens het vorige artikel vereiste toestemming niet wordt verkregen, kan zij op verzoek van de
      minderjarige door die van de kantonrechter worden vervangen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel36
  - number: '37.1'
    text: |-
      Hij die wegens verkwisting of drankmisbruik onder curatele staat, mag geen huwelijk aangaan zonder de toestemming
      van zijn curator.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel37
  - number: '37.2'
    text: |-
      Voor zover die toestemming niet wordt verkregen, kan zij op verzoek van de onder curatele gestelde door toestemming
      van de kantonrechter worden vervangen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel37
  - number: '38'
    text: |-
      Hij die wegens een geestelijke stoornis onder curatele staat, mag geen huwelijk aangaan zonder toestemming van
      de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel38
  - number: '39.1'
    text: |-
      Heeft de kantonrechter de toestemming verleend, dan is de termijn van beroep veertien dagen en kan gedurende die
      termijn de beschikking niet worden ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel39
  - number: '39.2'
    text: |-
      Hij die tegen een verleende toestemming opkomt, is verplicht dit binnen de termijn van beroep bij
      deurwaardersexploit te doen aanzeggen aan de ambtenaar of ambtenaren van de burgerlijke stand ten overstaan van
      wie het huwelijk kan worden voltrokken. Door dit te verzuimen verliest hij het recht om de nietigverklaring van het
      huwelijk op grond van het ontbreken van zijn toestemming te vragen, indien het gerechtshof de beschikking van de
      kantonrechter vernietigt en het huwelijk reeds is voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel39
  - number: '41.1'
    text: |-
      Een huwelijk mag niet worden gesloten tussen hen die elkander, hetzij van nature hetzij familierechtelijk, bestaan
      in de opgaande en in de nederdalende lijn of als broeders, zusters of broeder en zuster.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel41
  - number: '41.2'
    text: |-
      Onze Minister van Justitie kan om gewichtige redenen ontheffing van het verbod verlenen aan hen die broeders,
      zusters of broeder en zuster door adoptie zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel41
  - number: '42'
    text: |-
      Zij die met elkander een huwelijk willen aangaan, mogen niet tegelijkertijd een geregistreerd partnerschap zijn
      aangegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel42
  - number: '43.1'
    text: |-
      Zij die met elkaar een huwelijk willen aangaan, moeten daarvan onder overlegging van de in
      [artikel 44 van dit boek][ref1] genoemde bescheiden, aangifte doen bij de ambtenaar van de burgerlijke stand
      van de woonplaats van één der partijen. Wanneer de aanstaande echtgenoten, van wie ten minste één de Nederlandse
      nationaliteit bezit, buiten Nederland woonplaats hebben en in een Nederlandse gemeente een huwelijk met elkaar
      willen aangaan, geschiedt de aangifte bij de ambtenaar van de burgerlijke stand te 's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel44
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '44'
        afdeling: '2'
  - number: '43.2'
    text: |-
      Bij de aangifte kunnen de aanstaande echtgenoten verklaren dat het huwelijk zal worden voltrokken in een andere
      gemeente dan die waarin een van hen op het tijdstip van de huwelijksaangifte woonplaats heeft, dan wel indien de
      tweede zin van het eerste lid van toepassing is, in een andere gemeente dan 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel43
  - number: '43.3'
    text: |-
      De aangifte geschiedt in persoon of bij zodanige geschriften waaruit van het voornemen der aanstaande echtgenoten
      met genoegzame zekerheid kan blijken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel43
  - number: '43.4'
    text: De ambtenaar van de burgerlijke stand maakt van de aangifte een akte op.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel43
  - number: '44.1'
    text: |-
      Voor de aangifte van het huwelijk worden de volgende bescheiden aan de ambtenaar van de burgerlijke stand
      overgelegd:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
  - number: 44.1.a
    text: |-
      de geboorteakte van ieder der aanstaande echtgenoten en van elk van hen een gewaarmerkt afschrift van gegevens uit
      de basisadministratie persoonsgegevens, tenzij zij niet als ingezetene in een basisadministratie persoonsgegevens
      behoeven te zijn ingeschreven;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
  - number: 44.1.b
    text: |-
      een akte van huwelijkstoestemming, gegeven door hen, wier toestemming tot het huwelijk noodzakelijk is. De akte
      van huwelijkstoestemming wordt door een ambtenaar van de burgerlijke stand of door een notaris opgemaakt. De
      toestemming kan ook bij de huwelijksakte worden gegeven. Is de toestemming door de rechter verleend, dan wordt
      diens beschikking overgelegd;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
  - number: 44.1.c
    text: een akte van overlijden van allen, wier toestemming voor het huwelijk was vereist, als zij in leven waren geweest;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
  - number: 44.1.d
    text: |-
      ingeval van tweede of verder huwelijk dan wel huwelijk na registratie, bewijsstukken aantonende dat het vorige
      huwelijk dan wel het eerdere geregistreerd partnerschap geen beletsel voor een nieuw huwelijk oplevert;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
  - number: 44.1.e
    text: de akte van huwelijksaangifte;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
  - number: 44.1.f
    text: indien stuiting heeft plaatsgevonden, het bewijs dat de stuiting is opgeheven;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
  - number: 44.1.g
    text: het bewijs van de ontheffing of de vergunning van Onze Minister van Justitie, ingeval deze is vereist;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
  - number: 44.1.h
    text: |-
      indien een beschikking als bedoeld in [afdeling 12 van Titel 4 van dit boek][ref1] of een vrijstelling krachtens
      [artikel 62 van dit boek][ref2] is verkregen, ook deze;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling12
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel62
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '12'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '62'
        afdeling: '4'
  - number: 44.1.i
    text: |-
      de verklaring, bedoeld in [artikel 31, tweede lid, van dit boek][ref1], ingeval deze vereist is;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel31
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '31'
        afdeling: '1'
  - number: 44.1.j
    text: |-
      een schriftelijke opgave van de namen en de adressen van de personen die zijn uitgenodigd om als getuigen bij de
      voltrekking van het huwelijk aanwezig te zijn;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
  - number: 44.1.k
    text: |-
      een door de korpschef in de zin van de [Vreemdelingenwet 2000][ref1] aan de ambtenaar van de burgerlijke stand
      afgegeven verklaring waaruit blijkt dat de aanstaande echtgenoot die niet de Nederlandse nationaliteit bezit,
      rechtmatig in Nederland verblijft als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref2], dan wel voornemens
      is niet in Nederland te verblijven. De verklaring wordt opgesteld op verzoek van de aanstaande echtgenoot op wie
      zij betrekking heeft. Bij het verzoek wordt een gewaarmerkt afschrift als bedoeld onder a, overgelegd. Heeft deze
      geen woonplaats in Nederland, dan wordt zij opgesteld op verzoek van de andere aanstaande echtgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0011823
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '44.2'
    text: |-
      De verklaring, bedoeld in het eerste lid, onderdeel k, is niet vereist indien de aanstaande echtgenoten aannemelijk
      kunnen maken dat zij beiden buiten Nederland woonplaats hebben. De verklaring is evenmin vereist indien de
      aanstaande echtgenoot die niet de Nederlandse nationaliteit bezit, in Nederland rechtmatig verblijft op grond van
      [artikel 8, onder b, d of e, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '44.3'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de inhoud van het in het eerste
      lid onder *a* bedoelde gewaarmerkt afschrift van gegevens uit de basisadministratie persoonsgegevens, alsmede de in
      hetzelfde lid onder *k* bedoelde verklaring.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel44
  - number: '45.1'
    text: |-
      Een aanstaande echtgenoot die in de onmogelijkheid is, zijn door het vorige artikel vereiste geboorteakte te
      vertonen, kan dit verhelpen door een akte van bekendheid, afgegeven door de kantonrechter van zijn geboorteplaats
      of woonplaats, op verklaring van vier meerderjarige getuigen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel45
  - number: '45.2'
    text: |-
      Deze verklaring houdt de vermelding in van de plaats en, zo na mogelijk, van het tijdstip der geboorte, benevens de
      oorzaken, die beletten een akte daarvan over te leggen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel45
  - number: '45.3'
    text: |-
      Het ontbreken van een geboorteakte kan ook worden verholpen, hetzij door een dergelijke, maar beëdigde verklaring,
      afgelegd door de getuigen, die bij de voltrekking van het huwelijk tegenwoordig zijn, of wel door een bij de
      ambtenaar van de burgerlijke stand afgelegde beëdigde verklaring van de aanstaande echtgenoot, inhoudende dat
      hij zich geen geboorteakte of akte van bekendheid kan verschaffen. In de huwelijksakte wordt van de afgelegde
      verklaring melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel45
  - number: 45a
    text: |-
      Indien partijen niet in staat zijn de akten van overlijden, bij [artikel 44, eerste lid, onder c van dit boek][ref1]
      bedoeld, over te leggen, kan dat gebrek op dezelfde wijze als in het geval van het vorige artikel worden verholpen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel44
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '44'
        afdeling: '2'
  - number: '46'
    text: |-
      Wanneer het huwelijk binnen een jaar, te rekenen van de datum van de akte van huwelijksaangifte, niet is
      voltrokken, mag het niet worden voltrokken dan nadat een nieuwe aangifte is gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel46
  - number: '47.1'
    text: |-
      Indien een minderjarige een huwelijk wenst aan te gaan, onderzoekt de ambtenaar van de burgerlijke stand, van welke
      personen daartoe de toestemming wordt vereist.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel47
  - number: '47.2'
    text: |-
      Voorts onderzoekt die ambtenaar of de minderjarige onder toezicht gesteld is of onder voorlopige voogdij is
      geplaatst. Blijkt dit het geval, dan verwittigt hij bij ondertoezichtstelling de kinderrechter en in het andere
      geval de voogdij-instelling onverwijld van het voorgenomen huwelijk.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel47
  - number: '48'
    text: |-
      Indien hij die wil hertrouwen het gezag heeft over kinderen uit een vorig huwelijk, geeft de ambtenaar van de
      burgerlijke stand van de gedane aangifte onverwijld kennis aan de kantonrechter van de woonplaats van de bedoelde
      ouder.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel48
  - number: '49.1'
    text: |-
      Trouwbeloften geven geen rechtsvordering tot het aangaan van een huwelijk, noch tot schadevergoeding wegens de
      niet-vervulling van de beloften; alle afwijkende bedingen zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel49
  - number: '49.2'
    text: |-
      Indien echter een akte van huwelijksaangifte is opgemaakt, kan dit grond opleveren tot een vordering tot vergoeding
      der werkelijke vermogensverliezen, zonder dat daarbij enige winstderving in aanmerking komt. De vordering vervalt
      door verloop van achttien maanden, te rekenen van de datum van de akte van huwelijksaangifte.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel49
  - number: 49a.1
    text: |-
      Indien een Nederlander buiten Nederland een huwelijk wenst aan te gaan, wordt op zijn verzoek aan hem een
      verklaring van huwelijksbevoegdheid overeenkomstig de bijlage van de Overeenkomst van München van 5 september 1980
      (Trb. 1981, 71, en 1982, 116) afgegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel49a
  - number: 49a.2
    text: 'Deze verklaring wordt afgegeven:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel49a
  - number: 49a.2.a
    text: aan degene die binnen Nederland woonplaats heeft, door de ambtenaar van de burgerlijke stand van zijn woonplaats;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel49a
  - number: 49a.2.b
    text: |-
      aan degene die binnen Nederland geen woonplaats heeft, maar wel heeft gehad, door de ambtenaar van de burgerlijke
      stand van de laatste woonplaats aldaar;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel49a
  - number: 49a.2.c
    text: |-
      aan degene die binnen Nederland geen woonplaats heeft of heeft gehad, door het hoofd van de diplomatieke of
      consulaire vertegenwoordiging van het Koninkrijk der Nederlanden in het ressort waar het huwelijk wordt voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel49a
  - number: 49a.3
    text: |-
      De verklaring wordt door de bevoegde autoriteit niet afgegeven alvorens deze, door kennisneming van de
      bescheiden, vermeld in [artikel 44, eerste lid, onder a, b, c, d en g][ref1], en zo nodig van die, vermeld in de
      [artikelen 45][ref2] en [45a][ref3], alsmede in [artikel 27b][ref4], zich ervan heeft overtuigd dat naar Nederlands
      recht geen beletselen tegen het huwelijk bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel45a
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel27b
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel49a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '44'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '45'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 45a
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: 27b
        afdeling: '12'
  - number: 49a.4
    text: De verklaring van huwelijksbevoegdheid is, te rekenen van het tijdstip van afgifte, gedurende zes maanden geldig.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel49a
  - number: '50'
    text: |-
      Een huwelijk kan worden gestuit, wanneer partijen niet de vereisten in zich verenigen om een huwelijk aan te gaan,
      dan wel wanneer het oogmerk van de aanstaande echtgenoten, of één hunner, niet is gericht op de vervulling van de
      door de wet aan de huwelijkse staat verbonden plichten, doch op het verkrijgen van toelating tot Nederland.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel50
  - number: '51.1'
    text: |-
      Bevoegd tot stuiting, wanneer partijen niet de vereisten in zich verenigen om een huwelijk aan te gaan, zijn
      bloedverwanten in de rechte lijn, broeders, zusters, voogden en curatoren van een der aanstaande echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel51
  - number: '51.2'
    text: |-
      De in het vorige lid genoemde personen zijn ook bevoegd een huwelijk te stuiten, wanneer de andere aanstaande
      echtgenoot onder curatele staat, en het huwelijk klaarblijkelijk het ongeluk zou veroorzaken van de partij, waarvan
      zij bloedverwant, voogd of curator zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel51
  - number: '52'
    text: |-
      Hij die met een der partijen door huwelijk verbonden is dan wel met een der partijen een geregistreerd partnerschap
      is aangegaan, kan op grond van het bestaan van dat huwelijk of dat geregistreerd partnerschap een nieuw aan te gaan
      huwelijk stuiten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel52
  - number: '53.1'
    text: |-
      Het openbaar ministerie is verplicht een voorgenomen huwelijk te stuiten, indien het met een der in de
      [artikelen 31 tot en met 33][ref1], [41][ref2] en [42][ref3] omschreven huwelijksbeletselen bekend is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel42
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '31'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '42'
        afdeling: '1'
  - number: '53.2'
    text: |-
      Het openbaar ministerie is bevoegd het huwelijk te stuiten van een minderjarige, die onder toezicht is gesteld
      of onder voorlopige voogdij is geplaatst, indien het belang van die minderjarige zich tegen het aangaan van het
      huwelijk verzet; daarbij kan het belang dat de wederpartij bij het huwelijk heeft, mede in aanmerking worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel53
  - number: '53.3'
    text: |-
      Het openbaar ministerie is voorts bevoegd het huwelijk als schijnhandeling wegens strijd met de Nederlandse
      openbare orde te stuiten indien het oogmerk van de aanstaande echtgenoten, of één hunner, niet is gericht op de
      vervulling van de door de wet aan de huwelijkse staat verbonden plichten, doch op het verkrijgen van toelating
      tot Nederland.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel53
  - number: '54.1'
    text: |-
      De stuiting geschiedt door betekening van een akte aan de ambtenaar van de burgerlijke stand van één der gemeenten
      waar het huwelijk kan worden voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel54
  - number: '54.2'
    text: |-
      De akte houdt de keus van een woonplaats in die gemeente en de gronden van de stuiting in en vermeldt de
      hoedanigheid die aan de opposant de bevoegdheid geeft om het huwelijk te stuiten; alles op straffe van nietigheid.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel54
  - number: '54.3'
    text: |-
      De ambtenaar, aan wie de akte is betekend, zal van de gedane stuiting onverwijld kennis geven aan de ambtenaar van
      de burgerlijke stand der andere gemeenten, waar het huwelijk kan worden voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel54
  - number: '54.4'
    text: |-
      De opposant zal afschrift der akte van stuiting onverwijld doen betekenen aan de partij, tegen welke de stuiting
      is gericht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel54
  - number: '55'
    text: 'Een stuiting kan worden opgeheven:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel55
  - number: 55.a
    text: op dezelfde wijze als waarop zij is geschied;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel55
  - number: 55.b
    text: |-
      door een verklaring, in persoon afgelegd ten overstaan van een der ambtenaren van de burgerlijke stand, genoemd in
      het vorige artikel;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel55
  - number: 55.c
    text: door een verklaring, afgelegd ten overstaan van een notaris;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel55
  - number: 55.d
    text: door een in kracht van gewijsde gegane beschikking, gegeven op verzoek van een belanghebbende.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel55
  - number: '56'
    text: |-
      Het huwelijk mag niet worden voltrokken, voordat de stuiting is opgeheven. Mocht het desniettemin voltrokken
      zijn hangende een geding tot opheffing van de stuiting, dan kan dit geding op verlangen van de opposant worden
      voortgezet en wordt het huwelijk nietig verklaard, indien de rechter de gegrondheid der stuiting aanvaardt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel56
  - number: '57'
    text: |-
      Een ambtenaar van de burgerlijke stand aan wie het bestaan van een der in de [artikelen 31 tot en met 33][ref1],
      [41][ref2] en [42][ref3] omschreven huwelijksbeletselen bekend is, mag niet tot een huwelijksaangifte of een
      huwelijksvoltrekking meewerken, ook al zou geen stuiting hebben plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel42
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '31'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '42'
        afdeling: '1'
  - number: '58.1'
    text: |-
      Komt vast te staan dat op het tijdstip waarop de voltrekking van het huwelijk zal plaatsvinden meer dan zes maanden
      zullen zijn verstreken sinds de afgifte van een verklaring als bedoeld in [artikel 44, eerste lid, onder k][ref1],
      dan doet de ambtenaar van de burgerlijke stand zich, alvorens tot de voltrekking van het huwelijk over te gaan,
      wederom een zodanige verklaring overleggen, tenzij zulks op grond van het derde lid niet vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel44
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '44'
        afdeling: '2'
  - number: '58.2'
    text: |-
      Indien de overlegging van een verklaring als bedoeld in [artikel 44, eerste lid, onder k][ref1], op het tijdstip
      van de aangifte van het huwelijk niet werd vereist, doet de ambtenaar van de burgerlijke stand zich, alvorens tot
      voltrekking van het huwelijk over te gaan, alsnog een zodanige verklaring overleggen, tenzij zulks op grond van het
      derde lid niet vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel44
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '44'
        afdeling: '2'
  - number: '58.3'
    text: |-
      De verklaring wordt opgesteld op verzoek van de aanstaande echtgenoot op wie zij betrekking heeft.
      Heeft deze geen woonplaats in Nederland, dan wordt zij opgesteld op verzoek van de andere aanstaande
      echtgenoot. De verklaring is niet vereist indien de aanstaande echtgenoten aannemelijk kunnen maken dat
      zij beiden buiten Nederland woonplaats hebben. De verklaring is evenmin vereist indien de aanstaande
      echtgenoot die niet de Nederlandse nationaliteit bezit, in Nederland rechtmatig verblijft op grond van
      [artikel 8, onder b, d of e, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '62.1'
    text: Het huwelijk mag niet worden voltrokken vóór de veertiende dag na de datum van de akte van huwelijksaangifte.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel62
  - number: '62.2'
    text: |-
      Het openbaar ministerie bij de rechtbank, binnen wier rechtsgebied de huwelijksaangifte is geschied, is bevoegd uit
      hoofde van gewichtige redenen vrijstelling te verlenen van de voorgeschreven wachttijd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel62
  - number: '63'
    text: |-
      Een huwelijk wordt in tegenwoordigheid van ten minste twee en ten hoogste vier meerderjarige getuigen in het
      openbaar in het gemeentehuis voltrokken ten overstaan van de ambtenaar van de burgerlijke stand van:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel63
  - number: 63.a
    text: de woonplaats van één der partijen ten tijde van de datum van de akte van huwelijksaangifte, of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel63
  - number: 63.b
    text: |-
      's-Gravenhage, in het geval bedoeld in [artikel 43, eerste lid, tweede zin, van dit boek][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel43
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '43'
        afdeling: '2'
  - number: 63.c
    text: de bij de huwelijksaangifte aangewezen gemeente.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel63
  - number: '64'
    text: |-
      Indien een der partijen uit hoofde van een behoorlijk bewezen wettig beletsel verhinderd wordt zich naar het
      gemeentehuis te begeven, kan het huwelijk worden voltrokken in een bijzonder huis binnen dezelfde gemeente, mits
      dit in tegenwoordigheid van zes meerderjarige getuigen geschiedt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel64
  - number: '65'
    text: |-
      De aanstaande echtgenoten zijn verplicht bij de voltrekking van hun huwelijk in persoon voor de ambtenaar van de
      burgerlijke stand te verschijnen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel65
  - number: '66'
    text: |-
      Het staat Onze Minister van Justitie vrij, uit hoofde van gewichtige redenen aan partijen te vergunnen het huwelijk
      door een bijzondere bij authentieke akte gevolmachtigde te voltrekken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel66
  - number: '67.1'
    text: |-
      De aanstaande echtgenoten moeten ten overstaan van de ambtenaar van de burgerlijke stand en in tegenwoordigheid van
      de getuigen verklaren, dat zij elkander aannemen tot echtgenoten en dat zij getrouw alle plichten zullen vervullen,
      die door de wet aan de huwelijkse staat worden verbonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel67
  - number: '67.2'
    text: |-
      Terstond nadat deze verklaring is afgelegd, verklaart de ambtenaar van de burgerlijke stand, dat partijen door de
      echt aan elkander zijn verbonden, en maakt hij daarvan in het daartoe bestemde register een akte op.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel67
  - number: '68'
    text: |-
      Geen godsdienstige plechtigheden zullen mogen plaats hebben, voordat de partijen aan de bedienaar van de eredienst
      zullen hebben doen blijken, dat het huwelijk ten overstaan van de ambtenaar van de burgerlijke stand is voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel68
  - number: '69.1'
    text: |-
      Voor zover hieronder niet anders is bepaald, kan op grond dat de echtgenoten niet de vereisten in zich verenigden
      om tezamen een huwelijk aan te gaan, de nietigverklaring van het huwelijk worden verzocht door:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel69
  - number: 69.1.a
    text: de bloedverwanten in de opgaande lijn van een der echtgenoten;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel69
  - number: 69.1.b
    text: ieder der echtgenoten;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel69
  - number: 69.1.c
    text: |-
      alle overige personen, die daarbij een onmiddellijk rechtsbelang hebben, echter deze alleen na de ontbinding van
      het huwelijk;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel69
  - number: 69.1.d
    text: het openbaar ministerie, echter alleen zolang het huwelijk niet is ontbonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel69
  - number: '69.2'
    text: |-
      Hij die met een der echtgenoten nog door een vroeger huwelijk dan wel door een eerder geregistreerd partnerschap is
      verbonden, is eveneens bevoegd op grond van het bestaan van dat huwelijk of die registratie de nietigverklaring van
      het daarna gesloten huwelijk te verzoeken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel69
  - number: '70.1'
    text: |-
      Op verzoek van de ouders, de echtgenoten en het openbaar ministerie kan een huwelijk worden nietig verklaard,
      wanneer het ten overstaan van een niet bevoegde ambtenaar van de burgerlijke stand of niet in tegenwoordigheid van
      het vereiste aantal getuigen is voltrokken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel70
  - number: '70.2'
    text: |-
      De bevoegdheid van een echtgenoot om uit dien hoofde de nietigverklaring van het huwelijk te verzoeken vervalt,
      indien er uiterlijk bezit van de huwelijkse staat en een akte van huwelijksvoltrekking ten overstaan van een
      ambtenaar van de burgerlijke stand verleden, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel70
  - number: '71.1'
    text: |-
      Een echtgenoot kan de nietigverklaring van zijn huwelijk verzoeken, wanneer dit onder invloed van een onrechtmatige
      ernstige bedreiging is gesloten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel71
  - number: '71.2'
    text: |-
      Een gelijk verzoek komt de echtgenoot toe, die bij de huwelijksvoltrekking gedwaald heeft hetzij in de persoon van
      de andere echtgenoot, hetzij omtrent de betekenis van de door hem afgelegde verklaring.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel71
  - number: '71.3'
    text: |-
      De bevoegdheid van de echtgenoot de nietigverklaring wegens bedreiging of dwaling te verzoeken vervalt, wanneer de
      echtgenoten zes maanden hebben samengewoond sedert het ophouden van de bedreiging of de ontdekking van de dwaling,
      zonder dat het verzoek is gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel71
  - number: 71a
    text: |-
      Op verzoek van het openbaar ministerie kan een huwelijk als schijnhandeling wegens strijd met de Nederlandse
      openbare orde worden nietig verklaard indien het oogmerk van de echtgenoten, of één hunner, niet was gericht op
      de vervulling van de door de wet aan de huwelijkse staat verbonden plichten, doch op het verkrijgen van toelating
      tot Nederland.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel71a
  - number: '72'
    text: |-
      Een huwelijk kan niet nietig worden verklaard uit hoofde dat op het tijdstip van de huwelijksvoltrekking een
      der echtgenoten onder curatele stond, en het huwelijk klaarblijkelijk het ongeluk van de andere echtgenoot zou
      veroorzaken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel72
  - number: '73'
    text: |-
      De nietigverklaring van een huwelijk uit hoofde van een geestelijke stoornis kan na het ophouden van de stoornis
      alleen worden verzocht door de echtgenoot die geestelijk gestoord was. Het verzoek vervalt door een samenwoning van
      ten minste zes maanden na het ophouden van de stoornis.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel73
  - number: '74'
    text: |-
      De nietigverklaring van een huwelijk, dat aangegaan is door iemand die de vereiste leeftijd miste, kan niet worden
      verzocht wanneer deze op de dag van het verzoek de vereiste ouderdom heeft, noch wanneer de vrouw vóór de dag van
      het verzoek zwanger is geworden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel74
  - number: '75.1'
    text: |-
      Wegens het ontbreken van een vereiste toestemming van een derde kan de nietigverklaring van het huwelijk alleen
      door die derde of, in het geval van [artikel 38 van dit boek][ref1], door de curator worden verzocht. Dit verzoek
      vervalt, wanneer hij die bevoegd is de nietigverklaring te verzoeken, het huwelijk uitdrukkelijk of stilzwijgend
      heeft goedgekeurd, of wanneer drie maanden verlopen zijn nadat hij met de huwelijksvoltrekking bekend is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel38
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '38'
        afdeling: '1'
  - number: '75.2'
    text: |-
      Hij die bevoegd is de nietigverklaring te verzoeken, wordt vermoed met het huwelijk bekend te zijn geworden,
      wanneer het hier te lande is voltrokken, of wanneer het, buiten Nederland aangegaan, hier te lande in de registers
      van de burgerlijke stand is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel75
  - number: '76'
    text: |-
      Behoudens het in [artikel 56 van dit boek][ref1] bepaalde, verklaart de rechter een huwelijk alleen nietig op grond
      van een verzoek overeenkomstig de bepalingen van deze afdeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel56
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '56'
        afdeling: '3'
  - number: '77.1'
    text: |-
      De nietigverklaring van het huwelijk werkt, zodra de beschikking in kracht van gewijsde is gegaan; zij werkt terug
      tot het tijdstip van de huwelijksvoltrekking.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel77
  - number: '77.2'
    text: 'Nochtans mist de beschikking terugwerkende kracht en heeft zij hetzelfde gevolg als een echtscheiding:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel77
  - number: 77.2.a
    text: ten aanzien van de kinderen der echtgenoten;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel77
  - number: 77.2.b
    text: |-
      ten aanzien van de te goeder trouw zijnde echtgenoot; deze kan echter niet op een gemeenschap van goederen
      aanspraak maken, wanneer het huwelijk wegens het bestaan van een vroeger huwelijk of een eerder geregistreerd
      partnerschap is nietig verklaard;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel77
  - number: 77.2.c
    text: |-
      ten aanzien van andere personen dan de echtgenoten en hun kinderen, voor zover zij te goeder trouw vóór de
      inschrijving der nietigverklaring rechten hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel77
  - number: 77a.1
    text: |-
      Indien twee personen aan de ambtenaar van de burgerlijke stand kenbaar maken dat zij het huwelijk dat zij zijn
      aangegaan omgezet wensen te zien in een geregistreerd partnerschap, kan de ambtenaar van de burgerlijke stand van
      de woonplaats van één der partijen ter zake een akte van omzetting opmaken. Indien de echtgenoten, van wie ten
      minste één de Nederlandse nationaliteit bezit, buiten Nederland woonplaats hebben en in Nederland hun huwelijk
      willen omzetten in een geregistreerd partnerschap, geschiedt de omzetting bij de ambtenaar van de burgerlijke stand
      te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel77a
  - number: 77a.2
    text: |-
      De [artikelen 65][ref1] en [66][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel66
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '65'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '66'
        afdeling: '4'
  - number: 77a.3
    text: |-
      Een omzetting doet het huwelijk eindigen en het geregistreerd partnerschap aanvangen op het tijdstip dat de akte
      van omzetting in het register van geregistreerde partnerschappen is opgemaakt. De omzetting brengt geen wijziging
      in de al dan niet bestaande familierechtelijke betrekkingen met kinderen die voor de omzetting zijn geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel77a
  - number: '78'
    text: |-
      Het bestaan van een in Nederland gesloten huwelijk kan niet anders worden bewezen dan door de huwelijksakte dan
      wel door de akte van omzetting, bedoeld in [artikel 80g][ref1], behoudens in de gevallen bij de volgende artikelen
      voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80g
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80g
  - number: '79'
    text: |-
      Heeft het huwelijksregister niet bestaan of is het verloren gegaan of ontbreekt daaraan de huwelijksakte, dan wel
      de akte van omzetting, bedoeld in [artikel 80g][ref1], dan kan het huwelijk door getuigen of bescheiden worden
      bewezen, mits er een uiterlijk bezit van de huwelijkse staat aanwezig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80g
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80g
  - number: '80'
    text: |-
      Wordt in een geding betwist dat een kind, dat uiterlijk bezit van staat heeft, uit een huwelijk is geboren, dan
      levert het feit dat de ouders openlijk als man en vrouw hebben geleefd, voldoende bewijs op.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80
  - number: 80a.1
    text: |-
      Een persoon kan tegelijkertijd slechts met één andere persoon van hetzelfde of andere geslacht een geregistreerd
      partnerschap aangaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80a
  - number: 80a.2
    text: Zij die een geregistreerd partnerschap aangaan, mogen niet tegelijkertijd gehuwd zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80a
  - number: 80a.3
    text: |-
      Registratie van partnerschap geschiedt bij een akte van registratie van partnerschap opgemaakt door een ambtenaar
      van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80a
  - number: 80a.4
    text: |-
      Zij die een geregistreerd partnerschap willen aangaan, moeten daarvan onder overlegging van gegevens omtrent hun
      burgerlijke staat, en indien zij eerder een partnerschap hadden laten registreren of gehuwd zijn geweest, met
      vermelding van de namen van de vroegere partner dan wel van de namen van de vroegere echtgenoot, aangifte doen bij
      de ambtenaar van de burgerlijke stand van de woonplaats van één der partijen. Wanneer de aanstaande geregistreerde
      partners, van wie ten minste één de Nederlandse nationaliteit bezit, buiten Nederland woonplaats hebben en in
      een Nederlandse gemeente een geregistreerd partnerschap met elkaar willen aangaan, geschiedt de aangifte bij de
      ambtenaar van de burgerlijke stand te 's-Gravenhage. De [artikelen 43, tweede tot en met vierde lid][ref1], en
      [46][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel46
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '43'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '46'
        afdeling: '2'
  - number: 80a.5
    text: |-
      Een partnerschapsregistratie kan worden gestuit, indien partijen niet de vereisten in zich verenigen om
      de registratie aan te gaan, dan wel wanneer het oogmerk van de aanstaande geregistreerde partners, of
      één hunner, niet is gericht op de vervulling van de door de wet aan de partnerschapsregistratie verbonden
      plichten, doch op het verkrijgen van toelating tot Nederland. Op een stuiting zijn de [artikelen 51][ref1],
      [52][ref2], [53, tweede en derde lid][ref3], en [54 tot en met 56][ref4] van overeenkomstige toepassing. Het
      openbaar ministerie is verplicht een partnerschapsregistratie te stuiten, indien het met een van de in de
      [artikelen 31][ref5], [32][ref6], [41][ref7] en in het eerste en tweede lid van dit artikel omschreven beletselen
      bekend is. Indien aan de ambtenaar van de burgerlijke stand een van de in de vorige zin genoemde beletselen bekend
      is, mag hij niet tot een aangifte of registratie meewerken, ook al zou geen stuiting hebben plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel54
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel32
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel41
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '51'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '52'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '53'
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '54'
        afdeling: '3'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '31'
        afdeling: '1'
      - id: ref6
        bwb_id: BWBR0002656
        artikel: '32'
        afdeling: '1'
      - id: ref7
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
  - number: 80a.6
    text: |-
      Ter zake van de partnerschapsregistratie zijn de [artikelen 31][ref1], [32][ref2], [35 tot en met 39][ref3],
      [41][ref4], [44 tot en met 49][ref5], [58][ref6], en [62 tot en met 66][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel41
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel44
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel58
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel62
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '31'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '32'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '35'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '44'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0002656
        artikel: '58'
        afdeling: '4'
      - id: ref7
        bwb_id: BWBR0002656
        artikel: '62'
        afdeling: '4'
  - number: 80a.7
    text: |-
      Op de nietigverklaring van een partnerschapsregistratie zijn van
      overeenkomstige toepassing de [artikelen 69 tot en met 73][ref1], [74][ref2],
      [75 tot en met 77, eerste lid en tweede lid, onderdelen b en c][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel75
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '69'
        afdeling: '5'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '74'
        afdeling: '5'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '75'
        afdeling: '5'
  - number: 80a.8
    text: |-
      Op het bewijs van het bestaan van de partnerschapsregistratie zijn de [artikelen 78][ref1] en [79][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel79
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '78'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '79'
        afdeling: '6'
  - number: 80b
    text: |-
      Op een geregistreerd partnerschap zijn de [titels 6][ref1], [7][ref2] en[ 8][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80b
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002656
  - number: 80c
    text: 'Het geregistreerd partnerschap eindigt:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80c
  - number: 80c.a
    text: door de dood;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80c
  - number: 80c.b
    text: |-
      indien de vermiste, die overeenkomstig de bepalingen van de [tweede][ref1] of
      [derde afdeling van de achttiende titel van dit boek][ref2] vermoedelijk overleden dan wel overleden is verklaard,
      nog in leven is op de dag waarop de achtergebleven geregistreerde partner een nieuw geregistreerd partnerschap of
      huwelijk is aangegaan: door de voltrekking van dit geregistreerd partnerschap of huwelijk;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling3
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        afdeling: '3'
  - number: 80c.c
    text: |-
      met wederzijds goedvinden door inschrijving door de ambtenaar van de burgerlijke stand van een door beide partners
      en een of meer advocaten of notarissen ondertekende en gedateerde verklaring waaruit blijkt dat en op welk tijdstip
      de partners omtrent de beëindiging van het geregistreerd partnerschap een overeenkomst hebben gesloten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80c
  - number: 80c.d
    text: door ontbinding op verzoek van één der partners;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80c
  - number: 80c.e
    text: door omzetting van een geregistreerd partnerschap in een huwelijk.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80c
  - number: 80d.1
    text: |-
      De in [artikel 80c, onder c][ref1], bedoelde overeenkomst betreft ten minste de verklaring van beide partners
      dat hun geregistreerd partnerschap duurzaam ontwricht is en dat zij het willen beëindigen. Voorts betreft de
      overeenkomst, evenwel niet op straffe van nietigheid:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
  - number: 80d.1.a
    text: |-
      de uitkering tot levensonderhoud ten behoeve van de geregistreerde partner die niet voldoende inkomsten tot zijn
      levensonderhoud heeft, noch zich in redelijkheid kan verwerven;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80d
  - number: 80d.1.b
    text: |-
      wie van de geregistreerde partners huurder van de woonruimte die hen tot hoofdverblijf dient, zal zijn of wie
      van de geregistreerde partners gedurende een bij de overeenkomst te bepalen termijn het gebruik zal hebben van de
      woning en de inboedel die een van hen of hen beiden toebehoren dan wel ten gebruike toekomen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80d
  - number: 80d.1.c
    text: |-
      de verdeling van enige gemeenschap waarin de partners de registratie zijn aangegaan dan wel de verrekening die bij
      voorwaarden als bedoeld in [titel 8][ref1] is overeengekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 80d.1.d
    text: de verevening of verrekening van pensioenrechten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80d
  - number: 80d.2
    text: |-
      Op een beëindiging van het geregistreerd partnerschap met wederzijds goedvinden zijn de [artikelen 155][ref1],
      [159, eerste en derde lid][ref2], [159a][ref3], [160][ref4] en [164][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel159
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel159a
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel160
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel164
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '155'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '159'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 159a
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '160'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '164'
        afdeling: '2'
  - number: 80d.3
    text: |-
      De verklaring, bedoeld in [artikel 80c, onder c][ref1], wordt slechts ingeschreven in de registers van de
      burgerlijke stand, indien zij de ambtenaar van de burgerlijke stand uiterlijk drie maanden na het sluiten van de
      overeenkomst heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
  - number: 80e.1
    text: |-
      Op een ontbinding van een geregistreerd partnerschap als bedoeld in [artikel 80c, onder d][ref1], zijn de
      [artikelen 151][ref2], [153][ref3], [155][ref4], [157 tot en met 160][ref5], [164][ref6] en [165][ref7] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel80c
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel151
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel153
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel155
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel164
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel165
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 80c
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '151'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '153'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '155'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0002656
        artikel: '164'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0002656
        artikel: '165'
        afdeling: '2'
  - number: 80e.2
    text: |-
      De ontbinding komt tot stand door inschrijving van een rechterlijke uitspraak op verzoek van partijen of van
      één van hen in de registers van de burgerlijke stand. [Artikel 163, derde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel163
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '163'
        afdeling: '2'
  - number: 80f
    text: |-
      Indien de partijen wier geregistreerd partnerschap is beëindigd, opnieuw een geregistreerd partnerschap met elkaar
      aangaan dan wel met elkaar in het huwelijk treden, herleven alle gevolgen van het geregistreerd partnerschap van
      rechtswege alsof er geen beëindiging heeft plaats gehad. Nochtans wordt de geldigheid van rechtshandelingen die
      tussen de inschrijving van de beëindiging en de nieuwe registratie of het huwelijk zijn verricht, beoordeeld naar
      het tijdstip van de handeling. Op het maken of wijzigen van de voorwaarden, bedoeld in [titel 8][ref1], vóór het
      aangaan van de nieuwe registratie of het huwelijk is [artikel 119][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel119
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80f
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '119'
        afdeling: '1'
  - number: 80g.1
    text: |-
      Indien twee personen aan de ambtenaar van de burgerlijke stand kenbaar maken dat zij het geregistreerd partnerschap
      dat zij zijn aangegaan, omgezet wensen te zien in een huwelijk, kan de ambtenaar van de burgerlijke stand van
      de woonplaats van één der partijen ter zake een akte van omzetting opmaken. Indien de geregistreerde partners
      van wie ten minste één de Nederlandse nationaliteit bezit, buiten Nederland woonplaats hebben en in Nederland
      hun geregistreerd partnerschap in een huwelijk willen omzetten, geschiedt de omzetting bij de ambtenaar van de
      burgerlijke stand te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80g
  - number: 80g.2
    text: |-
      De [artikelen 65][ref1] en [66][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel65
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel66
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '65'
        afdeling: '4'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '66'
        afdeling: '4'
  - number: 80g.3
    text: |-
      Een omzetting doet het geregistreerd partnerschap eindigen en het huwelijk aanvangen op het tijdstip dat de akte
      van omzetting in het register van huwelijken is opgemaakt. De omzetting brengt geen wijziging in de al dan niet
      bestaande familierechtelijke betrekkingen met kinderen die voor de omzetting zijn geboren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel80g
  - number: '81'
    text: |-
      Echtgenoten zijn elkander getrouwheid, hulp en bijstand verschuldigd. Zij zijn verplicht elkander het nodige te
      verschaffen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel81
  - number: '82'
    text: |-
      Echtgenoten zijn jegens elkaar verplicht de tot het gezin behorende minderjarige kinderen te verzorgen en op te
      voeden en de kosten van die verzorging en opvoeding te dragen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel82
  - number: '84.1'
    text: |-
      De kosten der huishouding, daaronder begrepen de kosten van verzorging en opvoeding van de kinderen, komen ten
      laste van het gemene inkomen van de echtgenoten en, voor zover dit ontoereikend is, ten laste van hun eigen
      inkomens in evenredigheid daarvan; voor zover de inkomens ontoereikend zijn, komen deze kosten ten laste van
      het gemene vermogen en, voor zover ook dit ontoereikend is, ten laste van de eigen vermogens naar evenredigheid
      daarvan. Een en ander geldt niet voor zover bijzondere omstandigheden zich er tegen verzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel84
  - number: '84.2'
    text: |-
      De echtgenoten zijn jegens elkaar verplicht dienovereenkomstig tot de bestrijding van de in het eerste lid
      bedoelde uitgaven voldoende gelden ter beschikking te stellen uit de onder hun bestuur staande goederen, voor zover
      bijzondere omstandigheden zich daartegen niet verzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel84
  - number: '84.3'
    text: Bij schriftelijke overeenkomst kan een van het eerste en tweede lid afwijkende regeling worden getroffen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel84
  - number: '84.4'
    text: |-
      Geschillen tussen de echtgenoten omtrent de toepassing van het eerste tot en met derde lid worden door de rechtbank
      op verzoek van beiden of een van hen beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel84
  - number: '84.5'
    text: |-
      Op verzoek van beide of van een van de echtgenoten kan de rechtbank een gegeven beschikking of een onderling
      getroffen regeling wijzigen op grond van veranderde omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel84
  - number: '85'
    text: |-
      De ene echtgenoot is naast de andere voor het geheel aansprakelijk voor de door deze ten behoeve van de gewone gang
      van de huishouding aangegane verbintenissen, met inbegrip van die welke voortvloeien uit de door hem als werkgever
      ten behoeve van de huishouding aangegane arbeidsovereenkomsten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel85
  - number: '86.1'
    text: |-
      De rechtbank kan, wanneer daartoe gegronde redenen bestaan, op verzoek van een echtgenoot bepalen dat deze niet
      aansprakelijk zal zijn voor de door de andere echtgenoot in het vervolg aangegane verbintenissen als bedoeld in het
      vorige artikel.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel86
  - number: '86.2'
    text: |-
      Een overeenkomstig dit artikel gegeven rechterlijke beschikking kan bij veranderde omstandigheden op gelijke wijze
      als zij is tot stand gekomen, worden gewijzigd of opgeheven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel86
  - number: '86.3'
    text: |-
      De beschikking kan aan derden die van haar bestaan onkundig waren, slechts worden tegengeworpen, indien zij
      ingeschreven was in het huwelijksgoederenregister, aangewezen in [artikel 116 van dit boek][ref1], en na de
      inschrijving veertien dagen waren verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '86.4'
    text: |-
      In de beschikking kan worden bepaald dat zij bovendien moet worden bekend gemaakt in een of meer door de rechter
      aangewezen dagbladen. In dat geval werkt de beschikking ten nadele van derden die daarvan onkundig waren, ook niet
      vóór deze bekendmaking.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel86
  - number: '88.1'
    text: 'Een echtgenoot behoeft de toestemming van de andere echtgenoot voor de volgende rechtshandelingen:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel88
  - number: 88.1.a
    text: |-
      overeenkomsten strekkende tot vervreemding, bezwaring of ingebruikgeving en rechtshandelingen strekkende tot
      beëindiging van het gebruik van een door de echtgenoten tezamen of door de andere echtgenoot alleen bewoonde woning
      of van zaken die bij een zodanige woning of tot de inboedel daarvan behoren;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel88
  - number: 88.1.b
    text: giften, met uitzondering van de gebruikelijke, niet bovenmatige;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel88
  - number: 88.1.c
    text: |-
      overeenkomsten die ertoe strekken dat hij, anders dan in de normale uitoefening van zijn beroep of bedrijf, zich
      als borg of hoofdelijk medeschuldenaar verbindt, zich voor een derde sterk maakt, of zich tot zekerheidstelling
      voor een schuld van de derde verbindt;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel88
  - number: 88.1.d
    text: |-
      overeenkomsten van koop op afbetaling, behalve van zaken welke kennelijk uitsluitend of hoofdzakelijk ten behoeve
      van de normale uitoefening van zijn beroep of bedrijf strekken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel88
  - number: '88.2'
    text: |-
      De echtgenoot behoeft de toestemming niet, indien hij tot het verrichten der rechtshandeling is verplicht op
      grond van de wet of op grond van een voorafgaande rechtshandeling waarvoor die toestemming is verleend of niet
      was vereist.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel88
  - number: '88.3'
    text: |-
      De toestemming moet schriftelijk worden verleend, indien de wet voor het verrichten van de rechtshandeling een
      vorm voorschrijft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel88
  - number: '88.4'
    text: |-
      In afwijking van lid 1, onder b, is geen toestemming vereist voor giften welke de strekking hebben dat zij pas
      zullen worden uitgevoerd na het overlijden van degene die de gift doet, en niet reeds tijdens diens leven worden
      uitgevoerd. Bestaat de gift in de aanwijzing van een begunstigde bij een sommenverzekering die tijdens het leven
      van de verzekeringnemer is aanvaard of kan worden aanvaard, dan is daarvoor wel toestemming vereist.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel88
  - number: '88.5'
    text: |-
      Toestemming voor een rechtshandeling als bedoeld in lid 1 onder *c*, is niet vereist, indien zij wordt verricht
      door een bestuurder van een naamloze vennootschap of van een besloten vennootschap met beperkte aansprakelijkheid,
      die daarvan alleen of met zijn medebestuurders de meerderheid der aandelen houdt en mits zij geschiedt ten behoeve
      van de normale uitoefening van het bedrijf van die vennootschap.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel88
  - number: '88.6'
    text: |-
      Indien de andere echtgenoot door afwezigheid of een andere oorzaak in de onmogelijkheid verkeert zijn wil te
      verklaren of zijn toestemming niet verleent, kan de beslissing van de kantonrechter worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel88
  - number: '89.1'
    text: |-
      Een rechtshandeling die een echtgenoot in strijd met het vorige artikel heeft verricht, is vernietigbaar; slechts
      de andere echtgenoot kan een beroep op de vernietigingsgrond doen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel89
  - number: '89.2'
    text: Het vorige lid geldt niet voor een andere handeling dan een gift, indien de wederpartij te goeder trouw was.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel89
  - number: '89.3'
    text: |-
      Het einde van het huwelijk en scheiding van tafel en bed hebben geen invloed op de bevoegdheid om ter
      vernietiging van een rechtshandeling van een echtgenoot een beroep op de vernietigingsgrond te doen, die voordien
      was ontstaan. Indien de andere echtgenoot dientengevolge schuldenaar uit die rechtshandeling wordt, geldt
      [artikel 51 lid 3 van Boek 3][ref1] voor hem slechts, zolang de termijn van [artikel 52 lid 1 van Boek 3][ref2]
      niet is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel52
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '52'
  - number: '89.4'
    text: |-
      De verklaring of rechtsvordering tot vernietiging behoeft in afwijking van de [artikelen 50 lid 1][ref1] en
      [51 lid 2 van Boek 3][ref2] niet mede te worden gericht tot de echtgenoot die de handeling heeft verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel51
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel89
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '51'
  - number: '89.5'
    text: |-
      De echtgenoot die een beroep op de vernietigingsgrond heeft gedaan, kan tevens alle uit de nietigheid
      voortvloeiende rechtsvorderingen instellen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel89
  - number: '90.1'
    text: |-
      Een echtgenoot is bevoegd tot het bestuur van zijn eigen goederen en, volgens de regels van [artikel 97][ref1], tot
      het bestuur van goederen van een gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel97
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '97'
        afdeling: '2'
  - number: '90.2'
    text: |-
      Het bestuur van een echtgenoot over een goed omvat de uitoefening, met uitsluiting van de andere echtgenoot, van
      de daaraan verbonden bevoegdheden, daaronder begrepen de bevoegdheid tot beschikking en de bevoegdheid om ten
      aanzien van dat goed feitelijke handelingen te verrichten en toe te laten, onverminderd de bevoegdheden tot genot
      en gebruik die de andere echtgenoot overeenkomstig de huwelijksverhouding toekomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel90
  - number: '90.3'
    text: |-
      Tussen de echtgenoot die het hem toekomend bestuur overlaat aan de andere echtgenoot, en deze laatste zijn de
      bepalingen omtrent opdracht van overeenkomstige toepassing, met inachtneming van de aard van de huwelijksverhouding
      en de aard der goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel90
  - number: '90.4'
    text: |-
      De echtgenoot die een goed bestuurt, kan als partij naast de andere echtgenoot toetreden tot een rechtshandeling
      die deze laatste met betrekking tot dat goed heeft verricht. De verklaring van toetreding wordt gericht tot hen
      die partij bij de rechtshandeling zijn; [artikel 56 van Boek 3][ref1] is van overeenkomstige toepassing. Is voor
      het verrichten van de rechtshandeling een bepaalde vorm voorgeschreven, dan geldt voor de toetreding hetzelfde
      vereiste. De echtgenoot kan toetreding tot bijkomstige en tot reeds opeisbare rechten en verplichtingen uitsluiten;
      hij wordt geacht zich slechts te hebben verbonden onder eerbiediging van tevoren aan derden verleende rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel56
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '56'
  - number: '91.1'
    text: |-
      Indien een echtgenoot door afwezigheid of een andere oorzaak in de onmogelijkheid verkeert zijn goederen of
      de goederen der gemeenschap te besturen, of in ernstige mate tekortschiet in het bestuur van de goederen der
      gemeenschap, kan de rechtbank op verzoek van de andere echtgenoot aan deze het bestuur over die goederen of een
      deel daarvan met uitsluiting van de eerstgenoemde echtgenoot opdragen. De rechter kan bij de opdracht nadere
      regelen stellen omtrent het bestuur en de vertegenwoordiging in de zin van lid 4.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel91
  - number: '91.2'
    text: |-
      De [artikelen 86 leden 2-4][ref1] en [90 lid 3][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel86
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel90
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '86'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '90'
  - number: '91.3'
    text: |-
      De rechter gelast de oproeping van beide echtgenoten en, zo de in lid 1 eerstgenoemde echtgenoot een
      vertegenwoordiger heeft aangesteld, ook deze.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel91
  - number: '91.4'
    text: |-
      De echtgenoot aan wie het bestuur over goederen wordt opgedragen, is bevoegd tot vertegenwoordiging van de
      echtgenoot aan wie het wordt onttrokken, bij andere dan bestuurshandelingen met betrekking tot die goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel91
  - number: '92.1'
    text: |-
      Is aan een derde niet kenbaar wie van de echtgenoten bevoegd is tot het bestuur over een roerende zaak die geen
      registergoed is, of een recht aan toonder, dan mag hij de echtgenoot die de zaak of het papier aan toonder onder
      zich heeft, bevoegd achten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel92
  - number: '92.2'
    text: |-
      De echtgenoot die ten gevolge van een rechtshandeling van de andere echtgenoot door een derde te goeder trouw in
      het bestuur van een goed is gestoord, verliest het recht tot beëindiging van de stoornis, indien hij zich tegen
      de stoornis niet heeft verzet binnen een redelijke termijn nadat zij te zijner kennis is gekomen. De bevoegdheid
      van de echtgenoot tot beëindiging van de stoornis vervalt eveneens indien de derde hem een redelijke termijn heeft
      gesteld ter uitoefening van die bevoegdheid en hij daarvan geen gebruik heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel92
  - number: '92.3'
    text: |-
      Aan een derde kan niet worden tegengeworpen dat een vordering tot vergoeding welke tijdens het huwelijk is ontstaan
      wegens vermogensverschuiving tussen de echtgenoten onderling of tussen een der echtgenoten en een tussen hen
      bestaande gemeenschap, niet opeisbaar is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel92
  - number: 92a
    text: Deze titel is niet van toepassing op van tafel en bed gescheiden echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel92a
  - number: '93'
    text: |-
      Van het ogenblik der voltrekking van het huwelijk bestaat tussen de echtgenoten van rechtswege algehele gemeenschap
      van goederen, voor zover daarvan bij huwelijkse voorwaarden niet is afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel93
  - number: '94.1'
    text: |-
      De gemeenschap omvat, wat haar baten betreft, alle tegenwoordige en toekomstige goederen der echtgenoten, met
      uitzondering van goederen ten aanzien waarvan bij uiterste wilsbeschikking van de erflater of bij de gift is
      bepaald dat zij buiten de gemeenschap vallen, en met uitzondering van het vruchtgebruik, bedoeld in [afdeling 2 van
      titel 3 van Boek 4](onbekend).
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel94
  - number: '94.2'
    text: Zij omvat, wat haar lasten betreft, alle schulden van ieder der echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel94
  - number: '94.3'
    text: |-
      Goederen en schulden die aan een der echtgenoten op enigerlei bijzondere wijze verknocht zijn, vallen slechts in de
      gemeenschap voor zover die verknochtheid zich hiertegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel94
  - number: '94.4'
    text: |-
      Onverminderd het in [artikel 155 van dit boek][ref1] bepaalde vallen pensioenrechten waarop de
      [Wet verevening pensioenrechten bij scheiding][ref2] (*Stb.* 1994, 342) van toepassing is alsmede met die
      pensioenrechten verband houdende rechten op nabestaandenpensioen niet in de gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel155
      [ref2]: https://wetten.overheid.nl/BWBR0006641
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '155'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006641
  - number: '95.1'
    text: |-
      Voor een schuld van een echtgenoot, die in de gemeenschap is gevallen, kunnen zowel de goederen der gemeenschap als
      zijn eigen goederen worden uitgewonnen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel95
  - number: '95.2'
    text: |-
      De echtgenoot uit wiens eigen goederen een schuld der gemeenschap is voldaan, heeft deswege recht op vergoeding uit
      de goederen der gemeenschap.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel95
  - number: '96.1'
    text: |-
      Ook voor een schuld van een echtgenoot, die niet in de gemeenschap is gevallen, kunnen de goederen der gemeenschap
      worden uitgewonnen, tenzij de andere echtgenoot eigen goederen van eerstgenoemde aanwijst, die voldoende verhaal
      bieden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel96
  - number: '96.2'
    text: |-
      De echtgenoot wiens niet in de gemeenschap gevallen schuld uit goederen der gemeenschap is voldaan, is deswege
      gehouden tot vergoeding aan de gemeenschap.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel96
  - number: '97.1'
    text: |-
      Een goed der gemeenschap staat onder het bestuur van de echtgenoot van wiens zijde het in de gemeenschap is
      gevallen, voor zover niet de echtgenoten bij huwelijkse voorwaarden anders zijn overeengekomen of de rechter met
      toepassing van [artikel 91 van dit boek][ref1] anders heeft bepaald. Een goed dat moet worden geacht in de plaats
      te treden van een bepaald ander goed, komt onder het bestuur van de echtgenoot die het vervangen goed bestuurde.
      Een goed dat op naam van een der echtgenoten is gesteld, staat evenwel onder diens bestuur. Elk der echtgenoten is
      bevoegd tot stuiting van verjaring ten behoeve van de gemeenschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel91
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '91'
  - number: '97.2'
    text: |-
      Is een goed der gemeenschap met toestemming, verleend door de echtgenoot onder wiens bestuur het stond, dienstbaar
      aan een beroep of bedrijf van de andere echtgenoot, dan berust het bestuur van dat goed, voor zover het handelingen
      betreft die als normale uitoefening van dat beroep of bedrijf zijn te beschouwen, bij laatstgenoemde echtgenoot en
      voor het overige bij de echtgenoten gezamenlijk. Een verleende toestemming geldt voor de gehele duur van het beroep
      of bedrijf, tenzij de echtgenoten anders overeenkomen, doch de rechtbank kan de dienstbaarheid op verzoek van een
      echtgenoot te allen tijde wegens gegronde redenen beëindigen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel97
  - number: '98'
    text: |-
      De echtgenoten verstrekken elkander desgevraagd inlichtingen over het gevoerde bestuur, alsmede over de stand der
      goederen en schulden van de gemeenschap.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel98
  - number: '99.1'
    text: 'De gemeenschap wordt van rechtswege ontbonden:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel99
  - number: 99.1.a
    text: door het eindigen van het huwelijk;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel99
  - number: 99.1.b
    text: door scheiding van tafel en bed;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel99
  - number: 99.1.c
    text: door een beschikking die de gemeenschap opheft;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel99
  - number: 99.1.d
    text: door opheffing bij latere huwelijkse voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel99
  - number: '99.2'
    text: |-
      Tezamen met een verzoek waarvan toewijzing ontbinding tot gevolg zal hebben kan reeds overeenkomstig
      [titel 7 van Boek 3][ref1] een vordering worden ingesteld tot verdeling van de gemeenschap, tot gelasten van de
      wijze van verdeling en tot vaststelling van de verdeling, telkens voor het geval de gemeenschap wordt ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005291
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0005291
  - number: '100.1'
    text: |-
      De echtgenoten hebben een gelijk aandeel in de ontbonden gemeenschap, tenzij anders is bepaald bij huwelijkse
      voorwaarden of bij een overeenkomst die tussen de echtgenoten bij geschrift is gesloten met het oog op de
      aanstaande ontbinding der gemeenschap anders dan door de dood of ten gevolge van opheffing bij huwelijkse
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel100
  - number: '100.2'
    text: |-
      Zij die bij de ontbinding van de gemeenschap schuldeiser zijn, behouden het hun toekomende recht van verhaal op de
      goederen der gemeenschap, zolang deze niet verdeeld zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel100
  - number: '101'
    text: |-
      Na de ontbinding der gemeenschap heeft ieder der echtgenoten de bevoegdheid de te zijnen gebruike strekkende
      kleren en kleinodiën, alsmede zijn beroeps- en bedrijfsmiddelen en de papieren en gedenkstukken tot zijn familie
      behorende, tegen de geschatte prijs over te nemen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel101
  - number: '102'
    text: |-
      Na ontbinding van de gemeenschap blijft ieder der echtgenoten voor het geheel aansprakelijk voor de
      gemeenschapsschulden, waarvoor hij voordien aansprakelijk was. Voor andere schulden van de gemeenschap is hij voor
      de helft aansprakelijk; voor dat gedeelte der schuld is hij hoofdelijk met de andere echtgenoot verbonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel102
  - number: '103.1'
    text: |-
      Ieder der echtgenoten heeft het recht van de gemeenschap afstand te doen; alle daarmede strijdige overeenkomsten
      zijn nietig.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel103
  - number: '103.2'
    text: Het deel der gemeenschap waarvan afstand wordt gedaan, wast aan bij het deel van de andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel103
  - number: '103.3'
    text: |-
      De echtgenoot die afstand heeft gedaan, kan uit de gemeenschap niets terugvorderen dan alleen zijn bed met
      bijbehorend beddegoed en de kleren die hij voor zijn persoonlijk gebruik nodig heeft. Hij kan de papieren en
      gedenkstukken, tot zijn familie behorende, tegen de geschatte prijs overnemen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel103
  - number: '103.4'
    text: |-
      Door deze afstand wordt hij ontheven van de aansprakelijkheid en de draagplicht voor schulden der gemeenschap,
      waarvoor hij vóór de ontbinding der gemeenschap niet aansprakelijk was.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel103
  - number: '103.5'
    text: |-
      Hij blijft aansprakelijk voor de schulden der gemeenschap, waarvoor hij vóór de ontbinding der gemeenschap
      aansprakelijk was. Indien hij een schuld, waarvoor beide echtgenoten vóór de ontbinding der gemeenschap voor het
      geheel aansprakelijk waren, voor meer dan de helft heeft voldaan, heeft hij voor het meerdere verhaal tegen de
      andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel103
  - number: '103.6'
    text: |-
      Indien de andere echtgenoot een schuld der gemeenschap, waarvoor hij vóór de ontbinding der gemeenschap niet
      aansprakelijk was, geheel of ten dele heeft voldaan, heeft hij deswege verhaal tegen de echtgenoot die de afstand
      heeft gedaan. Heeft hij een schuld, waarvoor beide echtgenoten vóór de ontbinding der gemeenschap voor het geheel
      aansprakelijk waren, voor meer dan de helft voldaan, dan heeft hij voor het meerdere verhaal tegen de echtgenoot
      die de afstand heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel103
  - number: '104.1'
    text: |-
      De echtgenoot die van het bij het vorige artikel omschreven voorrecht wil gebruik maken, is verplicht binnen drie
      maanden na de ontbinding der gemeenschap een akte van afstand te doen inschrijven in het huwelijksgoederenregister,
      aangewezen in [artikel 116 van dit boek][ref1], op verbeurte van dit voorrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '104.2'
    text: |-
      Indien de gemeenschap door de dood van de andere echtgenoot wordt ontbonden, begint de termijn van drie maanden
      te lopen op de dag waarop de echtgenoot die van het voorrecht wil gebruik maken, van dat overlijden kennis heeft
      genomen. Indien de gemeenschap door opheffing of door scheiding van tafel en bed is ontbonden, eindigt de termijn
      drie maanden nadat de beschikking in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel104
  - number: '105.1'
    text: |-
      De erfgenamen van een echtgenoot, door wiens overlijden de gemeenschap is ontbonden, of die binnen de in het vorige
      artikel gestelde termijn is overleden zonder afstand te hebben gedaan, zijn ieder voor hun aandeel bevoegd op de
      in het vorige artikel omschreven wijze afstand te doen binnen drie maanden nadat zij met het overlijden bekend
      zijn geworden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel105
  - number: '105.2'
    text: |-
      De aanspraak van de echtgenoot tot terugvordering van zijn bed, beddegoed, en kleren uit de gemeenschap kan niet
      worden overgedragen en gaat ook niet over op zijn erfgenamen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel105
  - number: '106'
    text: |-
      De rechtbank van de plaats waar de akte van afstand moet worden ingeschreven, kan de voor de inschrijving gestelde
      termijn voor de afloop daarvan een of meer malen op grond van bijzondere omstandigheden verlengen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel106
  - number: '107.1'
    text: |-
      De echtgenoot of zijn erfgenaam, die zich de goederen der gemeenschap heeft aangetrokken of goederen daarvan heeft
      weggemaakt of verduisterd, kan geen afstand meer doen. Daden van dagelijks bestuur of tot behoud van de goederen
      brengen dit gevolg niet teweeg.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel107
  - number: '107.2'
    text: |-
      Hij die na gedane afstand goederen der gemeenschap wegmaakt of verduistert, verliest de bevoegdheid
      [artikel 103 lid 4 van dit boek][ref1] in te roepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel103
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '103'
        afdeling: '3'
  - number: '108.1'
    text: |-
      Afstand van de gemeenschap, door een echtgenoot of een erfgenaam van een echtgenoot gedaan nadat door de andere
      echtgenoot of een of meer van diens erfgenamen afstand werd gedaan, heeft niet de gevolgen, omschreven in
      [artikel 103 leden 2 en 3 van dit boek][ref1], en verplicht hen die tot de gemeenschap gerechtigd zijn, haar te
      vereffenen. [Afdeling 3 van titel 6 van Boek 4][ref2] betreffende de vereffening van nalatenschappen is zoveel
      mogelijk van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0002761#Afdeling3
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '103'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002761
        afdeling: '3'
  - number: '108.2'
    text: |-
      Indien hij die tot vereffening van de gemeenschap gehouden is, na tot het afleggen van de rekening en
      verantwoording te zijn aangemaand, in gebreke blijft aan deze verplichting te voldoen, verliest hij de bevoegdheid
      [artikel 103 lid 4 van dit boek][ref1] in te roepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel103
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '103'
        afdeling: '3'
  - number: '109'
    text: |-
      Een echtgenoot kan opheffing van de gemeenschap verzoeken, wanneer de andere echtgenoot op lichtvaardige wijze
      schulden maakt, de goederen der gemeenschap verspilt, handelingen verricht, die kennelijk indruisen tegen het
      bestuur van de andere echtgenoot over goederen der gemeenschap, of weigert de nodige inlichtingen te geven omtrent
      de stand van de goederen der gemeenschap en van de daarop verhaalbare schulden en het over die goederen gevoerde
      bestuur.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel109
  - number: '110.1'
    text: |-
      Het verzoek moet in het huwelijksgoederenregister, aangewezen in [artikel 116 van dit boek][ref1], worden
      ingeschreven, en moet openlijk worden bekend gemaakt in een landelijk dagblad of in een dagblad verschijnend in de
      streek waar de tot kennisneming van het verzoek bevoegde rechter zitting houdt. De bekendmaking vermeldt de datum
      van het verzoek en de naam, de voornamen, het beroep en de woonplaats van ieder der echtgenoten. De beschikking mag
      niet worden gegeven binnen een maand nadat de bekendmaking heeft plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '110.2'
    text: |-
      De echtgenoot die de opheffing van de gemeenschap vraagt, kan tot behoud van zijn recht de maatregelen nemen, die
      in het [Wetboek van Burgerlijke Rechtsvordering][ref1] nader zijn aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '111.1'
    text: |-
      De beschikking, waarbij het verzoek tot opheffing van de gemeenschap is toegewezen, werkt terug tot de dag, waarop
      aan het eerste lid van het vorige artikel is voldaan, vanaf welke dag de echtgenoten worden geacht te zijn gehuwd
      met uitsluiting van gemeenschap van goederen, onder al zodanige bedingen als de beschikking zal hebben vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel111
  - number: '111.2'
    text: |-
      Indien de echtgenoot tegen wie het verzoek is toegewezen, de gemeenschap heeft benadeeld doordat hij na de aanvang
      van het geding of binnen zes maanden daarvóór lichtvaardig schulden heeft gemaakt, goederen der gemeenschap heeft
      verspild, of een rechtshandeling als bedoeld in [artikel 88 van dit boek][ref1] zonder de vereiste toestemming of
      machtiging heeft verricht, is hij gehouden de aangerichte schade aan de gemeenschap te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel88
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel111
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '88'
  - number: '111.3'
    text: |-
      Een op het vorige lid gegronde vordering kan niet later worden ingesteld dan drie jaren nadat de beschikking in
      kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel111
  - number: '112.1'
    text: |-
      De opheffing van de gemeenschap moet, om tegen derden die daarvan onkundig waren te werken, openlijk
      worden bekend gemaakt en, nadat de beschikking in kracht van gewijsde is gegaan, worden ingeschreven in het
      huwelijksgoederenregister, aangewezen in [artikel 116 van dit boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '112.2'
    text: |-
      De bekendmaking geschiedt door plaatsing van een uittreksel van de beschikking in de *Staatscourant*
      en in een of meer in de beschikking aangewezen dagbladen. Het uittreksel bevat de gegevens, bedoeld in
      [artikel 110, eerste lid][ref1], alsmede de dagtekening van de beschikking en de aanduiding van de rechtbank die
      haar heeft gegeven. De gronden waarop de beschikking berust mogen in het uittreksel niet worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel110
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel112
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '110'
        afdeling: '4'
  - number: '113'
    text: |-
      Is de gemeenschap door opheffing ontbonden, dan kunnen de echtgenoten daarna, echter alleen bij huwelijkse
      voorwaarden, wederom een gemeenschap overeenkomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel113
  - number: '114'
    text: |-
      Huwelijkse voorwaarden kunnen zowel door aanstaande echtgenoten vóór het sluiten van het huwelijk als door
      echtgenoten tijdens het huwelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel114
  - number: '115.1'
    text: Huwelijkse voorwaarden moeten op straffe van nietigheid bij notariële akte worden aangegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel115
  - number: '115.2'
    text: |-
      Een volmacht tot het aangaan van huwelijkse voorwaarden moet schriftelijk worden verleend en moet de in de
      huwelijkse voorwaarden op te nemen bepalingen bevatten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel115
  - number: '116.1'
    text: |-
      Bepalingen in huwelijkse voorwaarden kunnen aan derden die daarvan onkundig waren, slechts worden tegengeworpen,
      indien die bepalingen ingeschreven waren in het openbaar huwelijksgoederenregister, gehouden ter griffie der
      rechtbank binnen welker rechtsgebied het huwelijk is voltrokken, of, indien het huwelijk buiten Nederland is
      aangegaan, ter griffie van de rechtbank te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel116
  - number: '116.2'
    text: De wijze van inrichting en raadpleging van het register wordt nader bij algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel116
  - number: '117.1'
    text: |-
      Huwelijkse voorwaarden vóór het huwelijk gemaakt of gewijzigd, zijn slechts geldig, indien zij wier toestemming
      tot het huwelijk noodzakelijk is, bij de akte hun toestemming tot de huwelijkse voorwaarden of de wijziging
      hebben gegeven; is de toestemming van de kantonrechter nodig, dan kan worden volstaan met vasthechting
      van zijn beschikking aan de minuut van de akte. Op het verzoek tot toestemming van de kantonrechter is
      [artikel 39 lid 1 van dit boek][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel39
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '39'
        afdeling: '1'
  - number: '117.2'
    text: |-
      Vóór het huwelijk gemaakte huwelijkse voorwaarden beginnen te werken van het tijdstip der voltrekking van het
      huwelijk; geen ander tijdstip kan daarvoor worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel117
  - number: '118'
    text: |-
      De echtgenoot die onder curatele staat, kan na de huwelijksvoltrekking slechts met toestemming van zijn curator
      huwelijkse voorwaarden maken of wijzigen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel118
  - number: '119.1'
    text: |-
      Het maken of wijzigen van huwelijkse voorwaarden tijdens het huwelijk behoeft de goedkeuring van de rechtbank.
      Bij het verzoekschrift der echtgenoten wordt een ontwerp van de notariële akte overgelegd. Het verzoekschrift kan
      zonder tussenkomst van een procureur worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel119
  - number: '119.2'
    text: |-
      De gehele of gedeeltelijke goedkeuring wordt slechts geweigerd, indien gevaar voor benadeling van schuldeisers
      bestaat, of indien een of meer voorwaarden strijden met dwingende wetsbepalingen, de goede zeden of de openbare
      orde.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel119
  - number: '119.3'
    text: |-
      Indien de akte niet is verleden binnen drie maanden na het in kracht van gewijsde gaan van de beschikking waarbij
      de goedkeuring is verleend, vervalt deze.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel119
  - number: '120.1'
    text: |-
      Tijdens het huwelijk gemaakte of gewijzigde huwelijkse voorwaarden beginnen te werken op de dag, volgende op die
      waarop de akte is verleden, tenzij in de akte een later tijdstip is aangewezen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel120
  - number: '120.2'
    text: |-
      Bepalingen in deze huwelijkse voorwaarden kunnen aan derden die daarvan onkundig waren, slechts worden
      tegengeworpen, indien zij ten minste veertien dagen in het huwelijksgoederenregister ingeschreven waren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel120
  - number: '121.1'
    text: |-
      Partijen kunnen bij huwelijkse voorwaarden afwijken van de regels der wettelijke gemeenschap, mits die voorwaarden
      niet met dwingende wetsbepalingen, de goede zeden, of de openbare orde strijden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel121
  - number: '121.2'
    text: |-
      Zij kunnen niet bepalen dat een hunner tot een groter aandeel in de schulden zal zijn gehouden, dan zijn aandeel in
      de goederen der gemeenschap beloopt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel121
  - number: '121.3'
    text: |-
      Zij kunnen niet afwijken van de rechten die uit het ouderlijk gezag voortspruiten, noch van de rechten die de wet
      aan een langstlevende echtgenoot toekent.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel121
  - number: '122'
    text: |-
      De bepalingen van de vorige titel zijn van toepassing, voor zover daarvan niet uitdrukkelijk of door de aard der
      bedingen, bij de huwelijkse voorwaarden gemaakt, is afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel122
  - number: '123'
    text: |-
      Wanneer bij huwelijkse voorwaarden een gemeenschap van vruchten en inkomsten is overeengekomen, gelden de
      [artikelen 124-127 van dit boek][ref1], voor zover daarvan niet uitdrukkelijk of door de aard der bedingen is
      afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel124
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '124'
        afdeling: '1'
  - number: '124.1'
    text: |-
      De gemeenschap van vruchten en inkomsten omvat, wat haar baten betreft, alle goederen die de echtgenoten tijdens
      het bestaan van de gemeenschap hebben verkregen anders dan door erfopvolging, making of gift, met uitzondering van
      hetgeen krachtens de volgende leden buiten de gemeenschap valt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel124
  - number: '124.2'
    text: |-
      Een goed dat een echtgenoot anders dan om niet verkrijgt, blijft buiten de gemeenschap, indien het voor meer dan de
      helft van zijn prijs ten laste van hem persoonlijk komt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel124
  - number: '124.3'
    text: |-
      Buiten de gemeenschap valt hetgeen wordt geïnd op een vordering die buiten de gemeenschap valt, alsmede een
      vordering tot vergoeding die in de plaats van een eigen goed van een echtgenoot treedt, waaronder begrepen een
      vordering ter zake van waardevermindering van zulk een goed.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel124
  - number: '125'
    text: |-
      De gemeenschap van vruchten en inkomsten omvat, wat haar lasten betreft, alle schulden van de echtgenoten, met
      uitzondering van die welke hetzij bij de aanvang van de gemeenschap bestonden, hetzij op verkrijgingen door
      erfopvolging, making of gift drukken, hetzij slechts de persoon of eigen goederen van één der echtgenoten betreffen
      en noch geheel noch gedeeltelijk uit inkomsten betaald plegen te worden. Een schuld die een echtgenoot met
      medeweten van de schuldeiser in verband met de verwerving van een eigen goed aangaat, valt niet in de gemeenschap.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel125
  - number: '126.1'
    text: |-
      Buiten de gemeenschap van vruchten en inkomsten vallen de goederen en schulden die behoren tot een door één der
      echtgenoten uitgeoefend bedrijf of vrij beroep. Deze bepaling is niet van toepassing op registergoederen op naam
      van de andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel126
  - number: '126.2'
    text: |-
      Ten bate of ten laste van de gemeenschap komen vergoedingen ten bedrage van de winsten en verliezen van het bedrijf
      of beroep, vast te stellen naar normen die in het maatschappelijk verkeer als redelijk worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel126
  - number: '126.3'
    text: |-
      Voor zover een echtgenoot in overwegende mate bij machte is te bepalen dat de winsten van een niet op zijn eigen
      naam uitgeoefend bedrijf hem rechtstreeks of middellijk ten goede komen, wordt dat bedrijf voor de toepassing van
      het vorige lid aangemerkt als een door die echtgenoot uitgeoefend bedrijf.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel126
  - number: '127'
    text: |-
      Voor zover bij de ontbinding van de gemeenschap van vruchten en inkomsten de goederen der gemeenschap, met
      inachtneming van de in het vorige artikel en de [artikelen 95 lid 2][ref1] en [96 lid 2 van dit boek][ref2]
      bedoelde vergoedingen, niet toereikend zijn om de schulden van de gemeenschap te voldoen, worden deze gedragen door
      de echtgenoot van wiens zijde zij in de gemeenschap zijn gevallen, voor zover de aard der schulden niet tot een
      andere draagplicht leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel96
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel127
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '95'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '96'
        afdeling: '1'
  - number: '128'
    text: |-
      Wanneer bij huwelijkse voorwaarden is overeengekomen dat er gemeenschap van winst en verlies zal bestaan, zijn de
      [artikelen 124-126 van dit boek][ref1] van overeenkomstige toepassing, voor zover daarvan niet uitdrukkelijk of
      door de aard der bedingen is afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel124
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel128
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '124'
        afdeling: '1'
  - number: '130'
    text: |-
      Een echtgenoot kan tegen derden zijn aanbreng van bij huwelijkse voorwaarden buiten de gemeenschap gehouden
      goederen, voor wat betreft rechten aan toonder en zaken die geen registergoederen zijn, slechts bewijzen door hun
      vermelding in de akte van huwelijkse voorwaarden of in een door de partijen en de notaris ondertekende, aan de
      minuut van die akte vastgehechte beschrijving. Indien de vermelding van een goed geen afdoende omschrijving daarvan
      biedt, kan aanvullend bewijs door alle middelen worden geleverd; ten aanzien van goederen die een echtgenoot buiten
      diens weten opgekomen waren, kan het bewijs door alle middelen worden geleverd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel130
  - number: '131.1'
    text: |-
      Bestaat tussen de echtgenoten een geschil aan wie van hen beiden een recht aan toonder of een zaak die geen
      registergoed is, toebehoort en kan geen van beiden zijn recht op dit goed bewijzen, dan wordt dat goed als
      gemeenschapsgoed aangemerkt, wanneer tussen hen een gemeenschap bestaat die dit goed kan omvatten; bestaat er geen
      zodanige gemeenschap, dan wordt het goed geacht aan ieder der echtgenoten voor de helft toe te behoren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel131
  - number: '131.2'
    text: Het vermoeden werkt niet ten nadele van de schuldeisers der echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel131
  - number: '132.1'
    text: |-
      Deze afdeling is van toepassing op huwelijkse voorwaarden die een of meer verplichtingen inhouden tot verrekening
      van inkomsten of van vermogen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel132
  - number: '132.2'
    text: |-
      Tenzij anders is bepaald, kan van deze afdeling bij huwelijkse voorwaarden uitdrukkelijk of door de aard der
      bedingen worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel132
  - number: '133.1'
    text: De verplichting tot verrekening van inkomsten of van vermogen is wederkerig.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel133
  - number: '133.2'
    text: |-
      De verplichting tot verrekening heeft uitsluitend betrekking op inkomsten die of op vermogen dat de echtgenoten
      tijdens het bestaan van deze verplichting hebben verkregen. De verplichting tot verrekening heeft geen betrekking
      op vermogen dat krachtens erfopvolging, making of gift wordt verkregen en ook niet op de vruchten daaruit of de
      voor dat vermogen of voor die vruchten in de plaats getreden goederen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel133
  - number: '134'
    text: |-
      Bij uiterste wilsbeschikking van de erflater of bij de gift kan worden bepaald dat geen verrekening van krachtens
      erfopvolging, making of gift verkregen vermogen en van de vruchten daarvan plaatsvindt, indien verrekening daarvan
      ingevolge huwelijkse voorwaarden zou behoren plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel134
  - number: '135.1'
    text: De verrekening van inkomsten of van vermogen geschiedt bij helfte.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel135
  - number: '135.2'
    text: |-
      Op de verrekening zijn de [artikelen 181][ref1], [183][ref2] en
      [195 tot en met 200 van Boek 3 van dit wetboek][ref3] van overeenkomstige toepassing, met dien verstande dat
      voor de beoordeling van de vraag of benadeling als bedoeld in [artikel 196 van Boek 3 van dit wetboek][ref4]
      heeft plaatsgevonden, de in [artikel 142][ref5] genoemde tijdstippen bepalend zijn. De
      [artikelen 677 tot en met 680 van het Wetboek van Burgerlijke Rechtsvordering][ref6] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel181
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel183
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel195
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel196
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel142
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel677
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '181'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '183'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '195'
      - id: ref4
        bwb_id: BWBR0005291
        artikel: '196'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: '142'
        paragraaf: '3'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '677'
  - number: '135.3'
    text: |-
      Een echtgenoot die opzettelijk een tot het te verrekenen vermogen behorend goed verzwijgt, zoek maakt of verborgen
      houdt waardoor de waarde daarvan niet in de verrekening is betrokken, dient de waarde daarvan niet te verrekenen,
      maar geheel aan de andere echtgenoot te vergoeden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel135
  - number: '136.1'
    text: |-
      Indien een goed onder aanwending van te verrekenen vermogen is verkregen, wordt het verkregen goed tot het te
      verrekenen vermogen gerekend voor het aandeel dat overeenkomt met het bij de verkrijging uit het te verrekenen
      vermogen aangewende gedeelte van de tegenprestatie gedeeld door de totale tegenprestatie. Indien een echtgenoot in
      verband met de verwerving van een goed een schuld is aangegaan, wordt het goed op de voet van de eerste volzin tot
      het te verrekenen vermogen gerekend voor zover de schuld daartoe wordt gerekend of daaruit is afgelost of betaald.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel136
  - number: '136.2'
    text: |-
      Bestaat tussen de echtgenoten een geschil omtrent de vraag of een goed tot het te verrekenen vermogen wordt
      gerekend en kan geen van beiden bewijzen dat het goed tot het niet te verrekenen vermogen wordt gerekend, dan
      wordt dat goed aangemerkt als te rekenen tot het te verrekenen vermogen. Het vermoeden werkt niet ten nadele van de
      schuldeisers der echtgenoten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel136
  - number: '137.1'
    text: Onverminderd het derde lid, geschiedt een verrekening in geld.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel137
  - number: '137.2'
    text: |-
      Indien op grond van een verrekenbeding over en weer opeisbare vorderingen ontstaan, worden beide vorderingen van
      rechtswege met elkaar verrekend tot aan hun gemeenschappelijk beloop.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel137
  - number: '137.3'
    text: |-
      Een echtgenoot is slechts gehouden een inbetalinggeving van goederen te aanvaarden dan wel kan deze slechts
      verlangen in plaats van een verrekening in geld, voor zover de verrekening in geld naar maatstaven van redelijkheid
      en billijkheid onaanvaardbaar zou zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel137
  - number: '138.1'
    text: |-
      De ene echtgenoot is aan de andere geen verantwoording over het bestuur van zijn goederen schuldig. Slecht bestuur
      over die goederen verplicht niet tot schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel138
  - number: '138.2'
    text: |-
      De ene echtgenoot kan jaarlijks van de andere echtgenoot een gespecificeerde, schriftelijke en ondertekende opgave
      verzoeken van de te verrekenen inkomsten en van het te verrekenen vermogen. Van deze bepaling kan niet worden
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel138
  - number: '138.3'
    text: Geschillen tussen de echtgenoten betreffende de opgave worden op verzoek van een van hen door de rechtbank beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel138
  - number: '139.1'
    text: |-
      Een echtgenoot kan de opheffing van de wederzijdse verplichting tot verrekening verzoeken, wanneer
      de andere echtgenoot op lichtvaardige wijze schulden maakt, zijn goederen verspilt of weigert de in
      [artikel 138, tweede lid][ref1], bedoelde verplichte opgave omtrent zijn te verrekenen inkomsten of vermogen te
      verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel138
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '138'
        paragraaf: '1'
        afdeling: '2'
  - number: '139.2'
    text: |-
      Indien de echtgenoot tegen wie het verzoek zich richt, het te verrekenen vermogen benadeelt doordat hij na de
      aanvang van het geding of binnen zes maanden daarvoor lichtvaardig schulden heeft gemaakt, te verrekenen goederen
      heeft verspild, of een rechtshandeling als bedoeld in [artikel 88][ref1] zonder de vereiste toestemming of
      machtiging heeft verricht, is hij gehouden de aangerichte schade te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel88
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '88'
  - number: '139.3'
    text: Van het eerste en tweede lid kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel139
  - number: '140.1'
    text: |-
      Op verzoek van de verrekenplichtige echtgenoot kan de rechter wegens gewichtige redenen bepalen dat een
      verschuldigde geldsom, al dan niet vermeerderd met een in de beschikking te bepalen rente, in termijnen of eerst
      na verloop van zekere tijd, hetzij ineens, hetzij in termijnen behoeft te worden voldaan. Hierbij let de rechter op
      de belangen van beide partijen. De rechter kan de verrekenplichtige echtgenoot verplichten binnen een bepaalde tijd
      zakelijke of persoonlijke zekerheid te stellen voor de voldoening van de verschuldigde geldsom.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel140
  - number: '140.2'
    text: |-
      Hetgeen in het eerste lid omtrent een echtgenoot is bepaald, geldt op overeenkomstige wijze na zijn overlijden voor
      zijn rechtverkrijgenden onder algemene titel.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel140
  - number: '140.3'
    text: Van het eerste en tweede lid kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel140
  - number: '141.1'
    text: |-
      Indien een verrekenplicht betrekking heeft op een in de huwelijkse voorwaarden omschreven tijdvak van het huwelijk
      en over dat tijdvak niet is afgerekend, blijft de verplichting tot verrekening over dat tijdvak in stand en strekt
      deze zich uit over het saldo, ontstaan door belegging en herbelegging van hetgeen niet verrekend is, alsmede over
      de vruchten daarvan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel141
  - number: '141.2'
    text: |-
      Indien een verrekenplicht betrekking heeft op een in de huwelijkse voorwaarden omschreven tijdvak van het huwelijk,
      dan eindigt die verrekenplicht op het tijdstip zoals in [artikel 142][ref1] bepaald, als dat tijdvak nog loopt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel142
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '142'
        paragraaf: '3'
        afdeling: '2'
  - number: '141.3'
    text: |-
      Indien bij het einde van het huwelijk aan een bij huwelijkse voorwaarden overeengekomen periodieke verrekenplicht
      als bedoeld in het eerste lid niet is voldaan, wordt het alsdan aanwezige vermogen vermoed te zijn gevormd uit
      hetgeen verrekend had moeten worden, tenzij uit de eisen van redelijkheid en billijkheid in het licht van de aard
      en omvang van de verrekenplicht anders voortvloeit. [Artikel 143][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel143
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '143'
        paragraaf: '3'
        afdeling: '2'
  - number: '141.4'
    text: |-
      Indien een echtgenoot in overwegende mate bij machte is te bepalen dat de winsten van een niet op zijn eigen naam
      uitgeoefende onderneming hem rechtstreeks of middellijk ten goede komen, en een verrekenbeding is overeengekomen
      dat ook ondernemingswinsten omvat, worden de niet uitgekeerde winsten uit zodanige onderneming, voor zover in
      het maatschappelijk verkeer als redelijk beschouwd, eveneens in aanmerking genomen bij de vaststelling van de
      verrekenplicht van die echtgenoot, onverminderd het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel141
  - number: '141.5'
    text: Het vierde lid is van overeenkomstige toepassing, indien een echtgenoot op eigen naam een onderneming uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel141
  - number: '141.6'
    text: |-
      De vordering tot verrekening, bedoeld in het eerste lid, verjaart niet eerder dan drie jaren na de beëindiging van
      het huwelijk dan wel het onherroepelijk worden van de beschikking tot scheiding van tafel en bed. Deze termijn kan
      niet worden verkort.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel141
  - number: '142.1'
    text: 'Als tijdstip waarop de samenstelling en de omvang van het te verrekenen vermogen worden bepaald, geldt:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel142
  - number: 142.1.a
    text: |-
      in geval van het eindigen van het huwelijk of het geregistreerd partnerschap door overlijden: het tijdstip van
      overlijden;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel142
  - number: 142.1.b
    text: |-
      in geval van beëindiging van het huwelijk door echtscheiding: het tijdstip van indiening van het verzoek tot
      echtscheiding;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel142
  - number: 142.1.c
    text: 'in geval van scheiding van tafel en bed: het tijdstip van indiening van het verzoek tot scheiding van tafel en bed;'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel142
  - number: 142.1.d
    text: |-
      in geval van opheffing van de wederzijdse verplichting tot verrekening als bedoeld in [artikel 139][ref1]: het
      tijdstip van indiening van het verzoek tot opheffing van die verplichting;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel139
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '139'
        paragraaf: '1'
        afdeling: '2'
  - number: 142.1.e
    text: |-
      in geval van beëindiging van het geregistreerd partnerschap met wederzijds goedvinden: het tijdstip waarop de
      overeenkomst tot beëindiging wordt gesloten;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel142
  - number: 142.1.f
    text: 'in geval van ontbinding van het geregistreerd partnerschap op verzoek: het tijdstip van indiening van het verzoek;'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel142
  - number: 142.1.g
    text: |-
      in geval van vermissing en een daarop gevolgd huwelijk of geregistreerd partnerschap: het tijdstip waarop de
      beschikking, bedoeld in [artikel 417][ref1], eerste lid, in kracht van gewijsde is gegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel417
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '417'
        afdeling: '2'
  - number: '142.2'
    text: Van het eerste lid, aanhef en onder b tot en met f, kan bij op schrift gestelde overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel142
  - number: '143.1'
    text: |-
      Vanaf de in het [eerste lid van artikel 142][ref1] vermelde tijdstippen kan ieder der echtgenoten verzoeken dat het
      te verrekenen vermogen van de andere echtgenoot wordt beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel142
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '142'
        paragraaf: '3'
        afdeling: '2'
  - number: '143.2'
    text: |-
      De [artikelen 671 tot en met 676][ref1] en [679 van het Wetboek van Burgerlijke Rechtsvordering][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel671
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel679
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '671'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '679'
  - number: '143.3'
    text: |-
      Hetgeen in de vorige leden omtrent een echtgenoot is bepaald, geldt op overeenkomstige wijze na zijn overlijden
      voor zijn rechtverkrijgenden onder algemene titel.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel143
  - number: '143.4'
    text: Van het eerste tot en met het derde lid kan niet worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel143
  - number: '149'
    text: 'Het huwelijk eindigt:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel149
  - number: 149.a
    text: door de dood;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel149
  - number: 149.b
    text: |-
      indien de vermiste, die overeenkomstig de bepalingen van de [tweede][ref1] of
      [derde afdeling van de achttiende titel van dit boek][ref2] vermoedelijk overleden dan wel overleden is verklaard,
      nog in leven is op de dag waarop de achtergebleven echtgenoot een nieuw huwelijk of geregistreerd partnerschap is
      aangegaan: door de voltrekking van dit huwelijk of geregistreerd partnerschap;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Afdeling3
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        afdeling: '3'
  - number: 149.c
    text: |-
      door echtscheiding, overeenkomstig de bepalingen van de [tweede afdeling][ref1] van deze titel;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '2'
  - number: 149.d
    text: |-
      door ontbinding van het huwelijk na scheiding van tafel en bed, overeenkomstig de bepalingen van de
      [tweede afdeling van de tiende titel van dit boek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Afdeling2
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel149
    references:
      - id: ref1
        bwb_id: BWBR0002656
        afdeling: '2'
  - number: 149.e
    text: door omzetting van een huwelijk in een geregistreerd partnerschap.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel149
  - number: '150'
    text: |-
      Echtscheiding tussen echtgenoten die niet van tafel en bed gescheiden zijn, wordt uitgesproken op verzoek van één
      der echtgenoten of op hun gemeenschappelijk verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel150
  - number: '151'
    text: Echtscheiding wordt op verzoek van één der echtgenoten uitgesproken, indien het huwelijk duurzaam ontwricht is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel151
  - number: '153.1'
    text: |-
      Indien als gevolg van de verzochte echtscheiding een bestaand vooruitzicht op uitkeringen aan de andere
      echtgenoot na vooroverlijden van de echtgenoot die het verzoek heeft gedaan zou teloorgaan of in ernstige mate
      zou verminderen, en de andere echtgenoot deswege tegen dat verzoek verweer voert, kan deze niet worden toegewezen
      voordat daaromtrent een voorziening is getroffen die, gelet op de omstandigheden van het geval, ten opzichte van
      beide echtgenoten billijk is te achten. De rechter kan daartoe een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel153
  - number: '153.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel153
  - number: 153.2.a
    text: |-
      indien redelijkerwijs te verwachten is dat de andere echtgenoot zelf voor dat geval voldoende voorzieningen kan
      treffen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel153
  - number: 153.2.b
    text: indien de duurzame ontwrichting van het huwelijk in overwegende mate te wijten is aan de andere echtgenoot.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel153
  - number: '154.1'
    text: |-
      Echtscheiding wordt op gemeenschappelijk verzoek van de echtgenoten uitgesproken indien het verzoek is gegrond op
      hun beider oordeel dat het huwelijk duurzaam ontwricht is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel154
  - number: '154.2'
    text: Ieder der echtgenoten is tot op het tijdstip der uitspraak bevoegd het verzoek in te trekken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel154
  - number: '155'
    text: |-
      In geval van echtscheiding en voor zover de ene echtgenoot na de huwelijkssluiting en voor de echtscheiding
      pensioenaanspraken heeft opgebouwd, heeft de andere echtgenoot overeenkomstig het bepaalde bij of krachtens de
      [Wet verevening pensioenrechten bij scheiding][ref1] recht op pensioenverevening, tenzij de echtgenoten op de wijze
      voorzien in deze Wet toepasselijkheid daarvan hebben uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0006641
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel155
    references:
      - id: ref1
        bwb_id: BWBR0006641
  - number: '157.1'
    text: |-
      De rechter kan bij de echtscheidingsbeschikking of bij latere uitspraak aan de echtgenoot die niet voldoende
      inkomsten tot zijn levensonderhoud heeft, noch zich in redelijkheid kan verwerven, op diens verzoek ten laste van
      de andere echtgenoot een uitkering tot levensonderhoud toekennen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel157
  - number: '157.2'
    text: |-
      Bij de vaststelling van de uitkering kan de rechter rekening houden met de behoefte aan een voorziening in het
      levensonderhoud voor het geval van overlijden van degene die tot de uitkering is gehouden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel157
  - number: '157.3'
    text: |-
      De rechter kan op verzoek van één van de echtgenoten de uitkering toekennen onder vaststelling van voorwaarden en
      van een termijn. Deze vaststelling kan niet ten gevolge hebben dat de uitkering later eindigt dan twaalf jaren na
      de datum van inschrijving van de beschikking in de registers van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel157
  - number: '157.4'
    text: |-
      Indien de rechter geen termijn heeft vastgesteld, eindigt de verplichting tot levensonderhoud van rechtswege na het
      verstrijken van een termijn van twaalf jaren, die aanvangt op de datum van inschrijving van de beschikking in de
      registers van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel157
  - number: '157.5'
    text: |-
      Indien de beëindiging van de uitkering ten gevolge van het verstrijken van de in het vierde lid bedoelde termijn
      van zo ingrijpende aard is dat ongewijzigde handhaving van die termijn naar maatstaven van redelijkheid en
      billijkheid van degene die tot de uitkering gerechtigd is niet kan worden gevergd, kan de rechter op diens verzoek
      alsnog een termijn vaststellen. Het verzoek daartoe dient te worden ingediend voordat drie maanden sinds de
      beëindiging zijn verstreken. De rechter bepaalt bij de uitspraak of verlenging van de termijn na ommekomst daarvan
      al dan niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel157
  - number: '157.6'
    text: |-
      Indien de duur van het huwelijk niet meer bedraagt dan vijf jaren en uit dit huwelijk geen kinderen zijn geboren,
      eindigt de verplichting tot levensonderhoud van rechtswege na het verstrijken van een termijn die gelijk is aan
      de duur van het huwelijk en die aanvangt op de datum van inschrijving van de beschikking in de registers van de
      burgerlijke stand. Indien de rechter een termijn vaststelt, kan deze vaststelling niet ten gevolge hebben dat
      de uitkering op een later tijdstip eindigt dan ingevolge de vorige zin het geval zou zijn. Het vijfde lid is van
      overeenkomstige toepassing met dien verstande dat in de eerste zin in plaats van "de in het vierde lid bedoelde
      termijn" wordt gelezen: de in de eerste zin bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel157
  - number: '158'
    text: |-
      Vóór of na de beschikking tot echtscheiding kunnen de echtgenoten bij overeenkomst bepalen of, en zo ja tot
      welk bedrag, na de echtscheiding de één tegenover de ander tot een uitkering tot diens levensonderhoud zal zijn
      gehouden. Indien in de overeenkomst geen termijn is opgenomen, is [artikel 157, vierde tot en met zesde lid][ref1],
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel157
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel158
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
  - number: '159.1'
    text: |-
      Bij de overeenkomst kan worden bedongen dat zij niet bij rechterlijke uitspraak zal kunnen worden gewijzigd op
      grond van een wijziging van omstandigheden. Een zodanig beding kan slechts schriftelijk worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel159
  - number: '159.2'
    text: |-
      Het beding vervalt, indien de overeenkomst is aangegaan vóór de indiening van het verzoek tot echtscheiding, tenzij
      dit binnen drie maanden na de overeenkomst is ingediend. Het voorgaande is van overeenkomstige toepassing bij een
      gemeenschappelijk verzoek.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel159
  - number: '159.3'
    text: |-
      Ondanks een zodanig beding kan op verzoek van een der partijen de overeenkomst door de rechter bij de
      echtscheidingsbeschikking of bij latere beschikking worden gewijzigd op grond van een zo ingrijpende wijziging van
      omstandigheden, dat de verzoeker naar maatstaven van redelijkheid en billijkheid niet langer aan het beding mag
      worden gehouden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel159
  - number: 159a
    text: |-
      Een overeenkomst als bedoeld in de [artikelen 158][ref1] en [159 van dit boek][ref2] staat niet in de weg aan
      verhaal op grond van [artikel 13 van de Invoeringswet Wet werk en bijstand][ref3] en laat de vaststelling van het
      te verhalen bedrag onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel158
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel159
      [ref3]: https://wetten.overheid.nl/BWBR0015704#Artikel13
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel159a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '158'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '159'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0015704
        artikel: '13'
  - number: '160'
    text: |-
      Een verplichting van een gewezen echtgenoot om uit hoofde van echtscheiding levensonderhoud te verschaffen aan de
      wederpartij, eindigt wanneer deze opnieuw in het huwelijk treedt, een geregistreerd partnerschap aangaat dan wel is
      gaan samenleven met een ander als waren zij gehuwd of als hadden zij hun partnerschap laten registreren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel160
  - number: '163.1'
    text: De echtscheiding komt tot stand door de inschrijving van de beschikking in de registers van de burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel163
  - number: '163.2'
    text: De inschrijving geschiedt op verzoek van partijen of van één van hen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel163
  - number: '163.3'
    text: |-
      Indien het verzoek tot inschrijving niet is gedaan uiterlijk zes maanden na de dag waarop de beschikking in kracht
      van gewijsde is gegaan, verliest de beschikking haar kracht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel163
  - number: '164.1'
    text: |-
      Indien een tussen de echtgenoten bestaande gemeenschap van goederen door één van hen is benadeeld doordat hij na de
      aanvang van het geding of binnen zes maanden daarvóór lichtvaardig schulden heeft gemaakt, goederen der gemeenschap
      heeft verspild, of rechtshandelingen als bedoeld in [artikel 88 van dit boek][ref1] zonder de vereiste toestemming
      of machtiging heeft verricht, is hij gehouden na de inschrijving van de beschikking waarbij de echtscheiding is
      uitgesproken, de aangerichte schade aan de gemeenschap te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel88
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel164
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '88'
  - number: '164.2'
    text: |-
      Een op het vorige lid gegronde rechtsvordering kan niet later worden ingesteld dan drie jaren na de inschrijving
      van de beschikking.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel164
  - number: '165.1'
    text: |-
      Op verzoek van een echtgenoot kan de rechter bij de echtscheidingsbeschikking of bij latere uitspraak bepalen
      dat, als die echtgenoot ten tijde van de inschrijving van de beschikking een woning bewoont die aan de andere
      echtgenoot uitsluitend of mede toebehoort of ten gebruike toekomt, hij jegens de andere echtgenoot bevoegd is de
      bewoning en het gebruik van de bij de woning en tot de inboedel daarvan behorende zaken gedurende zes maanden na de
      inschrijving van de beschikking tegen een redelijke vergoeding voort te zetten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel165
  - number: '165.2'
    text: |-
      Tegen hem kan een in dat tijdvak zonder zijn toestemming door de andere echtgenoot verrichte rechtshandeling niet
      worden tegengeworpen ten nadele van zijn in het vorige lid omschreven bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel165
  - number: '165.3'
    text: |-
      Weigert hij zijn toestemming of is hij niet in staat zijn wil te verklaren, dan kan de rechtbank die in eerste
      aanleg over het verzoek tot echtscheiding heeft beslist, op verzoek van de andere gewezen echtgenoot, bepalen dat
      het vorige lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel165
  - number: '166'
    text: |-
      Indien de gescheiden echtgenoten met elkander hertrouwen of een geregistreerd partnerschap aangaan, herleven
      alle gevolgen van het huwelijk van rechtswege, alsof er geen echtscheiding had plaats gehad. Nochtans wordt
      de geldigheid van rechtshandelingen die tussen de ontbinding van het huwelijk en het nieuwe huwelijk of het
      geregistreerd partnerschap zijn verricht, beoordeeld naar het tijdstip der handeling. Op het maken of wijzigen
      van de voorwaarden, bedoeld in titel 8, voor het aangaan van het nieuwe huwelijk of de registratie vindt
      [artikel 119][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel119
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel166
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '119'
        afdeling: '1'
  - number: '169.1'
    text: Scheiding van tafel en bed kan worden verzocht op dezelfde grond en op dezelfde wijze als echtscheiding.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel169
  - number: '169.2'
    text: |-
      De [artikelen 151][ref1], [154 tot en met 159a][ref2] zijn van overeenkomstige toepassing, met dien verstande dat
      de termijnen, bedoeld in [artikel 157, derde tot en met zesde lid][ref3], aanvangen op de dag waarop de beschikking
      tot scheiding van tafel en bed is ingeschreven in het huwelijksgoederenregister, aangewezen in [artikel 116][ref4],
      en dat de duur van het huwelijk wordt berekend tot die dag.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel151
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel154
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel169
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '151'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '154'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '169.3'
    text: |-
      Een verplichting van een echtgenoot om uit hoofde van scheiding van tafel en bed levensonderhoud te verschaffen aan
      de andere echtgenoot, eindigt bij ontbinding van het huwelijk.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel169
  - number: '173.1'
    text: |-
      De scheiding van tafel en bed komt tot stand door de inschrijving van de beschikking in het
      huwelijksgoederenregister, aangewezen in [artikel 116][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel173
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '173.2'
    text: De inschrijving geschiedt op verzoek van de echtgenoten of van één van hen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel173
  - number: '173.3'
    text: |-
      Indien het verzoek niet is gedaan uiterlijk zes maanden na de dag waarop de beschikking in kracht van gewijsde is
      gegaan, verliest de beschikking haar kracht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel173
  - number: '174.1'
    text: |-
      Indien een tussen de echtgenoten bestaande gemeenschap van goederen door één van hen is benadeeld doordat hij na de
      aanvang van het geding of binnen zes maanden daarvóór lichtvaardig schulden heeft gemaakt, goederen der gemeenschap
      heeft verspild, of rechtshandelingen als bedoeld in [artikel 88 van dit boek][ref1] zonder de vereiste toestemming
      of machtiging heeft verricht, is hij gehouden, nadat de beschikking waarbij de scheiding van tafel en bed is
      uitgesproken, is ingeschreven, de aangerichte schade aan de gemeenschap te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel88
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel174
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '88'
  - number: '174.2'
    text: |-
      Een op het eerste lid gegronde rechtsvordering kan niet later worden ingesteld dan drie jaren na de inschrijving
      van de beschikking van scheiding van tafel en bed.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel174
  - number: '175.1'
    text: |-
      Op verzoek van een echtgenoot kan de rechter bij de beschikking houdende scheiding van tafel en bed of bij latere
      uitspraak bepalen dat, als die echtgenoot ten tijde van de inschrijving van de beschikking een woning bewoont die
      aan de andere echtgenoot uitsluitend of mede toebehoort of ten gebruike toekomt, hij jegens de andere echtgenoot
      bevoegd is de bewoning en het gebruik van de bij de woning en tot de inboedel daarvan behorende zaken gedurende zes
      maanden na de inschrijving van de beschikking, tegen een redelijke vergoeding voort te zetten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel175
  - number: '175.2'
    text: |-
      Tegen hem kan een in dat tijdvak zonder zijn toestemming door de andere echtgenoot verrichte rechtshandeling niet
      worden tegengeworpen ten nadele van zijn in het vorige lid omschreven bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel175
  - number: '175.3'
    text: |-
      Weigert hij zijn toestemming of is hij niet in staat zijn wil te verklaren, dan kan de rechtbank die in eerste
      aanleg over het verzoek tot scheiding van tafel en bed heeft beslist, op verzoek van de andere echtgenoot bepalen
      dat het vorige lid buiten toepassing blijft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel175
  - number: '176.1'
    text: |-
      Een scheiding van tafel en bed eindigt door de verzoening van de echtgenoten, op het tijdstip dat zij op hun
      eensluidend verzoek in het huwelijksgoederenregister, aangewezen in [artikel 116][ref1], hebben doen inschrijven
      dat de scheiding heeft opgehouden te bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel176
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '176.2'
    text: |-
      De inschrijving doet alle gevolgen van het huwelijk van rechtswege herleven, alsof er geen scheiding van tafel en
      bed had plaatsgehad. Nochtans wordt de geldigheid van rechtshandelingen die tussen de scheiding van tafel en bed en
      de verzoening zijn verricht, beoordeeld naar het tijdstip van de handeling.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel176
  - number: '179.1'
    text: |-
      Ontbinding van het huwelijk van echtgenoten die van tafel en bed gescheiden zijn, wordt op verzoek van een der
      echtgenoten uitgesproken, indien de scheiding tenminste drie jaren heeft geduurd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel179
  - number: '179.2'
    text: |-
      De termijn van drie jaren kan op verzoek van een echtgenoot worden bekort tot ten minste een jaar, indien de andere
      echtgenoot zich gedurig schuldig maakt aan wangedrag in zodanige mate dat van de echtgenoot, die het verzoek heeft
      gedaan, niet kan worden gevergd het huwelijk te doen voortbestaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel179
  - number: '180.1'
    text: |-
      Indien als gevolg van de gevraagde ontbinding van het huwelijk een bestaand vooruitzicht op uitkeringen aan de
      andere echtgenoot na vooroverlijden van de echtgenoot die het verzoek heeft gedaan zou teloorgaan of in ernstige
      mate zou verminderen, en de andere echtgenoot deswege tegen het verzoek verweer voert, kan het verzoek niet worden
      toegewezen voordat daaromtrent een voorziening is getroffen die, gelet op de omstandigheden van het geval, ten
      opzichte van beide echtgenoten billijk is te achten. De rechter kan daartoe een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel180
  - number: '180.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel180
  - number: 180.2.a
    text: |-
      indien redelijkerwijs te verwachten is dat de andere echtgenoot zelf voor dat geval voldoende voorzieningen kan
      treffen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel180
  - number: 180.2.b
    text: |-
      indien de andere echtgenoot zich gedurig schuldig maakt aan wangedrag in zodanige mate dat van de echtgenoot die
      het verzoek heeft gedaan naar redelijkheid generlei verstrekking van levensonderhoud zou kunnen worden gevergd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel180
  - number: '181'
    text: |-
      Ontbinding van het huwelijk van echtgenoten die van tafel en bed gescheiden zijn, wordt op hun gemeenschappelijk
      verzoek uitgesproken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel181
  - number: '182'
    text: |-
      De [artikelen 154, tweede lid][ref1], en [157 tot en met 160 van dit boek][ref2] zijn van overeenkomstige
      toepassing, met dien verstande dat de in [artikel 157, derde tot en met zesde lid][ref3], bedoelde termijnen worden
      verminderd met de tijd gedurende welke tijdens de scheiding van tafel en bed een verplichting tot levensonderhoud
      jegens de andere echtgenoot bestond en dat de duur van het huwelijk wordt berekend tot de dag waarop de beschikking
      tot scheiding van tafel en bed is ingeschreven in het huwelijksgoederenregister, aangewezen in [artikel 116][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel154
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel182
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '154'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '157'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: '183.1'
    text: |-
      De ontbinding van het huwelijk komt tot stand door de inschrijving van de beschikking in de registers van de
      burgerlijke stand.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel183
  - number: '183.2'
    text: |-
      De [artikelen 163, tweede en derde lid][ref1], en [166 van dit boek][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel163
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel166
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '163'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '166'
        afdeling: '2'
  - number: '197'
    text: Een kind, zijn ouders en hun bloedverwanten staan in familierechtelijke betrekking tot elkaar.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel197
  - number: '198'
    text: Moeder van een kind is de vrouw uit wie het kind is geboren of die het kind heeft geadopteerd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel198
  - number: '199'
    text: 'Vader van een kind is de man:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel199
  - number: 199.a
    text: |-
      die op het tijdstip van de geboorte van het kind met de vrouw uit wie het kind is geboren, is gehuwd, tenzij
      onderdeel b geldt;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel199
  - number: 199.b
    text: |-
      wiens huwelijk met de vrouw uit wie het kind is geboren, binnen 306 dagen voor de geboorte van het kind door
      zijn dood is ontbonden, zelfs indien de moeder was hertrouwd; indien echter de vrouw sedert de 306de dag voor de
      geboorte van het kind was gescheiden van tafel en bed of zij en haar echtgenoot sedert dat tijdstip gescheiden
      hebben geleefd, kan de vrouw binnen een jaar na de geboorte van het kind ten overstaan van de ambtenaar van de
      burgerlijke stand verklaren dat haar overleden echtgenoot niet de vader is van het kind, van welke verklaring
      een akte wordt opgemaakt; was de moeder op het tijdstip van de geboorte hertrouwd dan is in dat geval de huidige
      echtgenoot de vader van het kind;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel199
  - number: 199.c
    text: die het kind heeft erkend;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel199
  - number: 199.d
    text: wiens vaderschap gerechtelijk is vastgesteld; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel199
  - number: 199.e
    text: die het kind heeft geadopteerd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel199
  - number: '200.1'
    text: |-
      Het in [artikel 199, onder a en b][ref1], bedoelde vaderschap kan, op de grond dat de man niet de biologische vader
      van het kind is, worden ontkend:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '199'
        afdeling: '1'
  - number: 200.1.a
    text: door de vader of de moeder van het kind;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel200
  - number: 200.1.b
    text: door het kind zelf.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel200
  - number: '200.2'
    text: |-
      De vader of moeder kan het in [artikel 199, onder a en b][ref1], bedoelde vaderschap niet ontkennen, indien de man
      vóór het huwelijk heeft kennis gedragen van de zwangerschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '199'
        afdeling: '1'
  - number: '200.3'
    text: |-
      De vader of moeder kan het in [artikel 199, onder a en b][ref1], bedoelde vaderschap evenmin ontkennen, indien de
      man heeft ingestemd met een daad die de verwekking van het kind tot gevolg kan hebben gehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel199
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '199'
        afdeling: '1'
  - number: '200.4'
    text: |-
      Het tweede en derde lid zijn niet van toepassing ten aanzien van de vader, indien de moeder hem heeft bedrogen
      omtrent de verwekker.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel200
  - number: '200.5'
    text: |-
      Het verzoek tot gegrondverklaring van de ontkenning wordt door de moeder bij de rechtbank ingediend binnen een jaar
      na de geboorte van het kind. Een zodanig verzoek wordt door de vader ingediend binnen een jaar nadat hij bekend is
      geworden met het feit dat hij vermoedelijk niet de biologische vader is van het kind.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel200
  - number: '200.6'
    text: |-
      Het verzoek tot gegrondverklaring van de ontkenning wordt door het kind bij de rechtbank ingediend binnen drie
      jaren nadat het kind bekend is geworden met het feit dat de man vermoedelijk niet zijn biologische vader is. Indien
      het kind evenwel gedurende zijn minderjarigheid bekend is geworden met dit feit, kan het verzoek tot uiterlijk drie
      jaren nadat het kind meerderjarig is geworden, worden ingediend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel200
  - number: '201.1'
    text: |-
      Overlijdt de vader of de moeder voor de afloop van de in [artikel 200, vijfde lid][ref1], gestelde termijn, dan kan
      een afstammeling van deze echtgenoot in de eerste graad of, bij gebreke van zodanige afstammeling, een ouder van
      deze echtgenoot, de rechtbank verzoeken de ontkenning van het vaderschap gegrond te verklaren. Het verzoek wordt
      gedaan binnen een jaar na de dag van overlijden of nadat het overlijden ter kennis van de verzoeker is gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel200
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '200'
        afdeling: '2'
  - number: '201.2'
    text: |-
      Overlijdt het kind voor de afloop van de in [artikel 200, zesde lid][ref1], gestelde termijn, dan kan een
      afstammeling in de eerste graad van het kind de rechtbank verzoeken de ontkenning van het vaderschap gegrond te
      verklaren. Indien het kind meerderjarig was ten tijde van het overlijden, wordt het verzoek gedaan binnen een jaar
      na de dag van overlijden of binnen een jaar nadat het overlijden ter kennis van de verzoeker is gekomen. Overleed
      het kind gedurende de minderjarigheid, dan dient het verzoek te worden gedaan binnen een jaar nadat het kind, in
      leven zijnde, zelfstandig het verzoek had kunnen doen, dan wel, indien het overlijden op een later tijdstip ter
      kennis is gekomen van de verzoeker binnen een jaar na die kennisneming.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel200
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '200'
        afdeling: '2'
  - number: '202.1'
    text: |-
      Nadat de beschikking houdende gegrondverklaring van een ontkenning van een door huwelijk ontstaan vaderschap in
      kracht van gewijsde is gegaan, wordt het door huwelijk ontstane vaderschap geacht nimmer gevolg te hebben gehad.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel202
  - number: '202.2'
    text: Te goeder trouw door derden verkregen rechten worden hierdoor nochtans niet geschaad.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel202
  - number: '202.3'
    text: |-
      Door de gegrondverklaring van de ontkenning ontstaat geen vordering tot teruggave van kosten van verzorging en
      opvoeding of van kosten van levensonderhoud en studie noch tot teruggave van het krachtens vruchtgenot genotene.
      Voorts ontstaat geen verplichting tot teruggave van genoten vermogensrechtelijke voordelen, voor zover degene die
      hen heeft genoten ten tijde van het doen van het verzoek daardoor niet was gebaat.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel202
  - number: '203.1'
    text: 'Erkenning kan geschieden:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel203
  - number: 203.1.a
    text: bij een akte van erkenning, opgemaakt door een ambtenaar van de burgerlijke stand;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel203
  - number: 203.1.b
    text: bij notariële akte.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel203
  - number: '203.2'
    text: De erkenning heeft gevolg vanaf het tijdstip waarop zij is gedaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel203
  - number: '204.1'
    text: 'De erkenning is nietig, indien zij is gedaan:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel204
  - number: 204.1.a
    text: |-
      door een man die krachtens [artikel 41][ref1] geen huwelijk met de moeder mag sluiten;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel41
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel204
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
  - number: 204.1.b
    text: door een minderjarige die de leeftijd van zestien jaren nog niet heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel204
  - number: 204.1.c
    text: |-
      indien het kind de leeftijd van zestien jaar nog niet heeft bereikt, zonder voorafgaande schriftelijke toestemming
      van de moeder;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel204
  - number: 204.1.d
    text: zonder voorafgaande schriftelijke toestemming van het kind van twaalf jaren of ouder;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel204
  - number: 204.1.e
    text: |-
      door een op het tijdstip van de erkenning met een andere vrouw gehuwd man, tenzij de rechtbank heeft vastgesteld
      dat aannemelijk is dat tussen de man en de moeder een band bestaat of heeft bestaan die in voldoende mate met een
      huwelijk op één lijn valt te stellen of dat tussen de man en het kind een nauwe persoonlijke betrekking bestaat;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel204
  - number: 204.1.f
    text: terwijl er twee ouders zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel204
  - number: '204.2'
    text: |-
      De in het vorige lid onder c en d vereiste toestemming kan ook geschieden ter gelegenheid van het opmaken van de
      akte van erkenning.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel204
  - number: '204.3'
    text: |-
      De toestemming van de moeder wier kind de leeftijd van zestien jaren nog niet heeft bereikt, dan wel de toestemming
      van het kind van twaalf jaren of ouder, kan op verzoek van de man die het kind wil erkennen, door de toestemming
      van de rechtbank worden vervangen, indien de erkenning de belangen van de moeder bij een ongestoorde verhouding met
      het kind of de belangen van het kind niet zou schaden, en de man de verwekker is van het kind.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel204
  - number: '204.4'
    text: |-
      Een man die wegens geestelijke stoornis onder curatele staat, mag slechts erkennen nadat daartoe toestemming is
      verkregen van de kantonrechter.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel204
  - number: '205.1'
    text: |-
      Een verzoek tot vernietiging van de erkenning kan, op de grond dat de erkenner niet de biologische vader van het
      kind is, bij de rechtbank worden ingediend:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel205
  - number: 205.1.a
    text: door het kind zelf, tenzij de erkenning tijdens zijn meerderjarigheid heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel205
  - number: 205.1.b
    text: |-
      door de erkenner, indien hij door bedreiging, dwaling, bedrog of, tijdens zijn minderjarigheid, door misbruik van
      omstandigheden daartoe is bewogen;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel205
  - number: 205.1.c
    text: |-
      door de moeder, indien zij door bedreiging, dwaling, bedrog, of tijdens haar minderjarigheid, door misbruik van
      omstandigheden bewogen is toestemming tot de erkenning te geven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel205
  - number: '205.2'
    text: |-
      Het openbaar ministerie kan wegens strijd met de Nederlandse openbare orde, indien de erkenner niet de biologische
      vader van het kind is, vernietiging van de erkenning verzoeken.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel205
  - number: '205.3'
    text: |-
      In geval van bedreiging of misbruik van omstandigheden, wordt het verzoek door de erkenner of door de moeder niet
      later ingediend dan een jaar nadat deze invloed heeft opgehouden te werken en, in geval van bedrog of dwaling,
      binnen een jaar nadat de verzoeker het bedrog of de dwaling heeft ontdekt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel205
  - number: '205.4'
    text: |-
      Het verzoek wordt door het kind ingediend binnen drie jaren nadat het kind bekend is geworden met het feit dat
      de man vermoedelijk niet zijn biologische vader is. Indien het kind evenwel gedurende zijn minderjarigheid bekend
      is geworden met dit feit kan het verzoek tot uiterlijk drie jaren nadat het kind meerderjarig is geworden, worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel205
  - number: '205.5'
    text: |-
      Voor het geval de erkenner of de moeder overlijdt voor de afloop van de in het derde lid gestelde termijn, is
      [artikel 201, eerste lid][ref1], van overeenkomstige toepassing. Voor het geval het kind overlijdt voor de afloop
      van de in het vierde lid gestelde termijn, is [artikel 201, tweede lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel201
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel201
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel205
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '201'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '201'
        afdeling: '2'
  - number: '206.1'
    text: |-
      Nadat de beschikking houdende vernietiging van de erkenning in kracht van gewijsde is gegaan, wordt de erkenning
      geacht nimmer gevolg te hebben gehad.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel206
  - number: '206.2'
    text: Te goeder trouw door derden verkregen rechten worden hierdoor nochtans niet geschaad.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel206
  - number: '206.3'
    text: |-
      Door de vernietiging ontstaat geen vordering tot teruggave van de kosten van verzorging en opvoeding of van
      levensonderhoud en studie noch tot teruggave van het krachtens vruchtgenot genotene. Voorts ontstaat geen
      verplichting tot teruggave van genoten vermogensrechtelijke voordelen die uit de erkenning zijn voortgevloeid, voor
      zover degene die hen heeft genoten ten tijde van het instellen van het verzoek daardoor niet was gebaat.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel206
  - number: '207.1'
    text: |-
      Het vaderschap van een man kan, ook indien deze is overleden, op de grond dat deze de verwekker is van het kind of
      op de grond dat de man als levensgezel van de moeder ingestemd heeft met een daad die de verwekking van het kind
      tot gevolg kan hebben gehad, door de rechtbank worden vastgesteld op verzoek van:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel207
  - number: 207.1.a
    text: de moeder, tenzij het kind de leeftijd van zestien jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel207
  - number: 207.1.b
    text: het kind.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel207
  - number: '207.2'
    text: 'Vaststelling van het vaderschap kan niet geschieden, indien:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel207
  - number: 207.2.a
    text: het kind twee ouders heeft;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel207
  - number: 207.2.b
    text: |-
      tussen de man en de moeder van het kind krachtens [artikel 41][ref1] geen huwelijk zou mogen worden gesloten; of


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel41
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel207
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
  - number: 207.2.c
    text: |-
      de in de aanhef van het eerste lid bedoelde man een minderjarige is die de leeftijd van zestien jaren nog niet
      heeft bereikt, tenzij hij voordat hij deze leeftijd heeft bereikt is overleden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel207
  - number: '207.3'
    text: |-
      Het verzoek wordt door de moeder ingediend binnen vijf jaren na de geboorte van het kind of, in geval van
      onbekendheid met de identiteit van de vermoedelijke verwekker dan wel van onbekendheid met zijn verblijfplaats,
      binnen vijf jaren na de dag waarop de identiteit en de verblijfplaats aan de moeder bekend zijn geworden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel207
  - number: '207.4'
    text: |-
      Overlijdt het kind voordat vaststelling van het vaderschap heeft kunnen plaatsvinden, dan kan een afstammeling van
      het kind in de eerste graad de vaststelling van het vaderschap aan de rechtbank verzoeken, mits de man bedoeld in
      het eerste lid, nog in leven is. Het verzoek wordt gedaan binnen een jaar na de dag van overlijden of binnen een
      jaar nadat het overlijden ter kennis van de verzoeker is gekomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel207
  - number: '207.5'
    text: |-
      De vaststelling van het vaderschap, mits de beschikking daartoe in kracht van gewijsde is gegaan, werkt terug tot
      het moment van de geboorte van het kind. Te goeder trouw door derden verkregen rechten worden hierdoor nochtans
      niet geschaad. Voorts ontstaat geen verplichting tot teruggave van vermogensrechtelijke voordelen, voor zover
      degene die hen heeft genoten ten tijde van het doen van het verzoek daardoor niet was gebaat.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel207
  - number: '208'
    text: |-
      Bij de uitspraak waarbij het vaderschap wordt vastgesteld, kan de rechter op een daartoe strekkend verzoek
      ten behoeve van het kind een bijdrage toekennen in de kosten van verzorging en opvoeding als bedoeld in
      [artikel 404][ref1] of in de kosten van levensonderhoud en studie als bedoeld in [artikel 395a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel404
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '404'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 395a
        afdeling: '1'
  - number: '209'
    text: |-
      Iemands afstamming volgens zijn geboorteakte kan door een ander niet worden betwist, indien hij een staat
      overeenkomstig die akte heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel209
  - number: '210'
    text: Een verzoek tot gegrondverklaring van de inroeping of betwisting van staat is niet aan verjaring onderworpen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel210
  - number: '211.1'
    text: 'Een verzoek tot gegrondverklaring van de inroeping van staat kan worden ingediend:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel211
  - number: 211.1.a
    text: door het kind zelf;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel211
  - number: 211.1.b
    text: |-
      door de erfgenamen van het kind, indien het kind gedurende zijn minderjarigheid of binnen drie jaren nadien is
      overleden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel211
  - number: '211.2'
    text: |-
      Indien het kind een verzoek als bedoeld in het eerste lid had ingediend, kunnen zijn erfgenamen de procedure
      voortzetten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel211
  - number: '212'
    text: |-
      In zaken van afstamming wordt het minderjarige kind, optredende als verzoeker of belanghebbende, vertegenwoordigd
      door een bijzondere curator daartoe benoemd door de rechtbank die over de zaak beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel212
  - number: '227.1'
    text: |-
      Adoptie geschiedt door een uitspraak van de rechtbank op verzoek van twee personen tezamen of op verzoek van één
      persoon alleen. Twee personen tezamen kunnen geen verzoek tot adoptie doen, indien zij krachtens [artikel 41][ref1]
      geen huwelijk met elkaar zouden mogen aangaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel41
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '41'
        afdeling: '1'
  - number: '227.2'
    text: |-
      Het verzoek door twee personen tezamen kan slechts worden gedaan, indien zij ten minste drie aaneengesloten jaren
      onmiddellijk voorafgaande aan de indiening van het verzoek met elkaar hebben samengeleefd. Het verzoek door de
      adoptant die echtgenoot, geregistreerde partner of andere levensgezel van de ouder is, kan slechts worden gedaan,
      indien hij ten minste drie aaneengesloten jaren onmiddellijk voorafgaande aan de indiening van het verzoek met die
      ouder heeft samengeleefd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel227
  - number: '227.3'
    text: |-
      Het verzoek kan alleen worden toegewezen, indien de adoptie in het kennelijk belang van het kind is, op het
      tijdstip van het verzoek tot adoptie vaststaat en voor de toekomst redelijkerwijs te voorzien is dat het kind niets
      meer van zijn ouder of ouders in de hoedanigheid van ouder te verwachten heeft, en aan de voorwaarden, genoemd in
      [artikel 228][ref1], wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel228
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel227
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '228'
  - number: '227.4'
    text: |-
      Zijn de voornamen van het kind niet bekend, dan stelt de rechter, nadat hij de adoptant of adoptanten en het kind,
      indien dat twaalf jaren of ouder is, heeft gehoord, bij de adoptiebeschikking tevens een of meer voornamen vast.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel227
  - number: '227.5'
    text: In zaken van adoptie is de minderjarige ouder bekwaam in rechte op te treden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel227
  - number: '228.1'
    text: 'Voorwaarden voor adoptie zijn:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: 228.1.a
    text: |-
      dat het kind op de dag van het eerste verzoek minderjarig is, en dat het kind, indien het op de dag van het verzoek
      twaalf jaren of ouder is, ter gelegenheid van zijn verhoor niet van bezwaren tegen toewijzing van het verzoek heeft
      doen blijken; hetzelfde geldt, indien de rechter is gebleken van bezwaren tegen toewijzing van het verzoek van een
      minderjarige die op de dag van het verzoek de leeftijd van twaalf jaren nog niet heeft bereikt, maar in staat kan
      worden geacht tot een redelijke waardering van zijn belangen ter zake;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: 228.1.b
    text: dat het kind niet is een kleinkind van een adoptant;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: 228.1.c
    text: dat de adoptant of ieder der adoptanten ten minste achttien jaren ouder dan het kind is;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: 228.1.d
    text: dat geen der ouders het verzoek tegenspreekt;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: 228.1.e
    text: dat de minderjarige moeder van het kind op de dag van het verzoek de leeftijd van zestien jaren heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: 228.1.f
    text: |-
      dat de adoptant het kind gedurende ten minste drie aaneengesloten jaren heeft verzorgd en opgevoed of, in geval
      van adoptie door twee personen tezamen, dat zij het kind gedurende ten minste een jaar hebben verzorgd en opgevoed;
      indien de echtgenoot, geregistreerde partner of andere levensgezel van de ouder het kind adopteert, geldt dat de
      adoptant en die ouder het kind gedurende ten minste een jaar hebben verzorgd en opgevoed, tenzij het kind wordt
      geboren uit de relatie van de moeder met een levensgezel van gelijk geslacht;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: 228.1.g
    text: |-
      dat de ouder of ouders niet of niet langer het gezag over het kind hebben. Indien evenwel de echtgenoot,
      geregistreerde partner of andere levensgezel van de ouder het kind adopteert, geldt dat deze ouder alleen of samen
      met voornoemde echtgenoot, geregistreerde partner of andere levensgezel het gezag heeft.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: '228.2'
    text: 'Aan de tegenspraak van een ouder als bedoeld in het eerste lid, onder d, kan worden voorbijgegaan:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: 228.2.a
    text: indien het kind en de ouder niet of nauwelijks in gezinsverband hebben samengeleefd; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: 228.2.b
    text: |-
      indien de ouder het gezag over het kind heeft misbruikt of de verzorging en opvoeding van het kind op grove wijze
      heeft verwaarloosd; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: 228.2.c
    text: |-
      indien de ouder onherroepelijk is veroordeeld wegens het plegen tegen de minderjarige van een van de misdrijven,
      omschreven in de[ titels XIII tot en met XV](onbekend) en [XVIII tot en met XX van het tweede boek van het Wetboek
      van Strafrecht](onbekend).
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel228
  - number: '229.1'
    text: |-
      Door adoptie komen de geadopteerde, de adoptiefouder en zijn bloedverwanten of de adoptiefouders en hun
      bloedverwanten in familierechtelijke betrekking tot elkaar te staan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel229
  - number: '229.2'
    text: |-
      Tegelijkertijd houdt de familierechtelijke betrekking tussen de geadopteerde, zijn oorspronkelijke ouders en hun
      bloedverwanten op te bestaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel229
  - number: '229.3'
    text: |-
      In afwijking van het tweede lid blijft de familierechtelijke betrekking tussen de geadopteerde en zijn ouder en
      diens bloedverwanten bestaan, indien de echtgenoot, geregistreerde partner of andere levensgezel van die ouder het
      kind adopteert.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel229
  - number: '229.4'
    text: |-
      Indien het kind op het tijdstip van de adoptie omgang heeft met een ouder ten aanzien van wie de familierechtelijke
      betrekking ophoudt te bestaan, kan de rechtbank bepalen dat zij gerechtigd blijven tot omgang met elkaar. De
      [artikelen 377a, tweede en derde lid][ref1], [377e][ref2] en [377g][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel377a
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel377e
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel377g
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel229
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 377a
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 377e
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 377g
  - number: '230.1'
    text: De adoptie heeft haar gevolgen van de dag, waarop de uitspraak in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel230
  - number: '230.2'
    text: |-
      De adoptie blijft haar gevolgen behouden, ook al zou blijken, dat de rechter de door
      [artikel 228 van dit boek][ref1] gestelde voorwaarden ten onrechte als vervuld zou hebben aangenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel228
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel230
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '228'
  - number: '231.1'
    text: De adoptie kan door een uitspraak van de rechtbank op verzoek van de geadopteerde worden herroepen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel231
  - number: '231.2'
    text: |-
      Het verzoek kan alleen worden toegewezen, indien de herroeping in het kennelijk belang van de geadopteerde is, de
      rechter van de redelijkheid der herroeping in gemoede overtuigd is, en het verzoek is ingediend niet eerder dan
      twee jaren en niet later dan vijf jaren na de dag, waarop de geadopteerde meerderjarig is geworden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel231
  - number: '232.1'
    text: |-
      Door herroeping van de adoptie houdt de familierechtelijke betrekking tussen de geadopteerde en zijn kinderen
      enerzijds en de adoptiefouder of adoptiefouders en zijn bloedverwanten anderzijds op te bestaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel232
  - number: '232.2'
    text: De familierechtelijke betrekking die door de adoptie opgehouden had te bestaan, herleeft door de herroeping.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel232
  - number: '232.3'
    text: |-
      [Artikel 230][ref1] vindt ten aanzien van de herroeping overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel230
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel232
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '230'
  - number: '233'
    text: |-
      Minderjarigen zijn zij, die de ouderdom van achttien jaren niet hebben bereikt en niet gehuwd of geregistreerd
      zijn dan wel gehuwd of geregistreerd zijn geweest of met toepassing van [artikel 253ha][ref1] meerderjarig zijn
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253ha
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel233
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253ha
        paragraaf: 2a
        afdeling: '2'
  - number: '234.1'
    text: |-
      Een minderjarige is, mits hij met toestemming van zijn wettelijke vertegenwoordiger handelt, bekwaam
      rechtshandelingen te verrichten, voor zover de wet niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel234
  - number: '234.2'
    text: De toestemming kan slechts worden verleend voor een bepaalde rechtshandeling of voor een bepaald doel.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel234
  - number: '234.3'
    text: |-
      De toestemming wordt aan de minderjarige verondersteld te zijn verleend, indien het een rechtshandeling betreft ten
      aanzien waarvan in het maatschappelijk verkeer gebruikelijk is dat minderjarigen van zijn leeftijd deze zelfstandig
      verrichten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel234
  - number: '235.1'
    text: |-
      Handlichting waarbij aan een minderjarige bepaalde bevoegdheden van een meerderjarige worden toegekend, kan wanneer
      de minderjarige de leeftijd van zestien jaren heeft bereikt, op zijn verzoek door de kantonrechter worden verleend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel235
  - number: '235.2'
    text: |-
      Zij wordt niet verleend tegen de wil van de ouders voor zover deze het gezag over de minderjarige uitoefenen, met
      inachtneming nochtans van [artikel 253a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: '235.3'
    text: |-
      Bij het verlenen van handlichting bepaalt de kantonrechter uitdrukkelijk, welke bevoegdheden van een meerderjarige
      aan de minderjarige worden toegekend. Deze bevoegdheden mogen zich niet verder uitstrekken dan tot de gedeeltelijke
      of de gehele ontvangst van zijn inkomsten en de beschikking daarover, het sluiten van verhuringen en verpachtingen,
      het in een vennootschap deelnemen en het uitoefenen van een beroep of bedrijf. De minderjarige wordt echter
      door handlichting niet bekwaam tot het beschikken over registergoederen, effecten, of door hypotheek gedekte
      vorderingen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel235
  - number: '235.4'
    text: |-
      Hij kan ter zake van de handlichting zelf en van handelingen, waartoe hij krachtens de verkregen handlichting
      bekwaam is, eisende of verwerende in rechte optreden. [Artikel 12 lid 1 van dit boek][ref1] geldt voor die
      handelingen niet.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel12
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel235
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '12'
  - number: '236.1'
    text: |-
      Een verleende handlichting kan door de rechtbank worden ingetrokken, indien de minderjarige daarvan misbruik maakt
      of er gegronde vrees bestaat dat hij dit zal doen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel236
  - number: '236.2'
    text: |-
      De intrekking geschiedt op verzoek van een van de ouders van de minderjarige, voor zover deze het gezag over hem
      uitoefenen en met inachtneming van [artikel 253a][ref1], of op verzoek van de voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel236
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: '237.1'
    text: |-
      Een beschikking waarbij handlichting is verleend of ingetrokken, moet worden bekend gemaakt in de Staatscourant en
      in twee in de beschikking aan te wijzen dagbladen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel237
  - number: '237.2'
    text: |-
      In de bekendmaking moet nauwkeurig worden vermeld hoedanig, en tot welk einde zij is verleend. Vóór de bekendmaking
      werkt zomin de handlichting als haar intrekking tegen derden die hiervan onkundig waren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel237
  - number: '238.1'
    text: Er is één raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel238
  - number: '238.2'
    text: |-
      De wet bepaalt de taken en bevoegdheden van de raad voor de kinderbescherming. Deze worden door de raad voor de
      kinderbescherming namens onze Minister van Justitie uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel238
  - number: '238.3'
    text: |-
      Ten behoeve van de vervulling van zijn taak houdt de raad zich in ieder geval op de hoogte van de ontwikkeling van
      de kinderbescherming, bevordert hij de samenwerking met de instellingen van kinderbescherming en jeugdhulpverlening
      en dient hij op verzoek of uit eigen beweging autoriteiten en instellingen van advies.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel238
  - number: '238.4'
    text: |-
      Zijn bemoeiingen laten de godsdienstige of levensbeschouwelijke grondslag van de instellingen van kinderbescherming
      onverlet.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel238
  - number: '238.5'
    text: |-
      Bij algemene maatregel van bestuur worden de zetel, de werkwijze, voor zover het de samenwerking met de advies- en
      meldpunten kindermishandeling, bedoeld in [hoofdstuk IVA van de Wet op de jeugdhulpverlening][ref1], betreft en de
      organisatie van de raad geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#HoofdstukIVA
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel238
    references:
      - id: ref1
        bwb_id: BWBR0004608
        hoofdstuk: IVA
  - number: '239.1'
    text: |-
      De raad voor de kinderbescherming kan optreden ten behoeve van minderjarigen die in Nederland hetzij hun woonplaats
      of laatste woonplaats, hetzij hun werkelijk verblijf hebben. Eveneens kan de raad optreden ten behoeve van
      Nederlandse minderjarigen die in Nederland noch woonplaats, noch laatste woonplaats, noch werkelijk verblijf
      hebben.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel239
  - number: '239.2'
    text: |-
      Ten behoeve van de minderjarigen die binnen een arrondissement hetzij hun woonplaats of laatste woonplaats, hetzij
      hun werkelijk verblijf hebben, treden voor de raad voor de kinderbescherming de in dat arrondissement aanwezige
      werkeenheden van de raad op.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel239
  - number: '239.3'
    text: |-
      Indien op grond van het vorige lid meer werkeenheden in verschillende arrondissementen bevoegd zouden zijn ten
      behoeve van een zelfde minderjarige op te treden, doet het optreden van een van deze werkeenheden de bevoegdheid
      van de ander eindigen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel239
  - number: '239.4'
    text: |-
      Ten behoeve van Nederlandse minderjarigen, die in Nederland noch woonplaats, noch laatste woonplaats, noch
      werkelijk verblijf hebben, treden de werkeenheden van de raad in het arrondissement Amsterdam op voor de raad voor
      de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel239
  - number: '239.5'
    text: |-
      Bij algemene maatregel van bestuur wordt de behandeling van klachten ter zake van een bij de raad in behandeling
      zijnde of geweest zijnde aangelegenheid van kinderbescherming geregeld.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel239
  - number: '240'
    text: |-
      Degene die op grond van een wettelijk voorschrift of op grond van zijn ambt of beroep tot geheimhouding is
      verplicht kan, zonder toestemming van degene die het betreft, aan de raad voor de kinderbescherming inlichtingen
      verstrekken, indien dit noodzakelijk kan worden geacht voor de uitoefening van de taken van de raad.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel240
  - number: '241.1'
    text: |-
      Indien de raad voor de kinderbescherming blijkt, dat een minderjarige niet onder het wettelijk vereiste gezag
      staat, of dat dit gezag niet over hem wordt uitgeoefend, verzoekt hij de rechter in de gezagsuitoefening over deze
      minderjarige te voorzien.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel241
  - number: '241.2'
    text: |-
      Indien dit ter voorkoming van ernstig gevaar voor de zedelijke of geestelijke belangen of voor de gezondheid van
      zulk een minderjarige dringend en onverwijld noodzakelijk is, kan de kinderrechter een voogdij-instelling als
      bedoeld in [artikel 60 van de Wet op de jeugdhulpverlening][ref1], belasten met de voorlopige voogdij over de
      minderjarige. De raad voor de kinderbescherming wendt zich in dit geval binnen zes weken tot de rechter teneinde
      een voorziening in het gezag over deze minderjarige te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0004608#Artikel60
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel241
    references:
      - id: ref1
        bwb_id: BWBR0004608
        artikel: '60'
  - number: '241.3'
    text: |-
      De in het tweede lid bedoelde maatregel kan eveneens worden getroffen indien een minderjarige, de leeftijd van
      zes maanden nog niet bereikt hebbende en niet staande onder voogdij van een rechtspersoon, zonder voorafgaande
      schriftelijke toestemming van de raad voor de kinderbescherming als pleegkind is opgenomen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel241
  - number: '241.4'
    text: |-
      De kinderrechter beschikt op verzoek van de raad voor de kinderbescherming of van de officier van justitie. Hij
      stelt vast welke bevoegdheden ten aanzien van persoon en vermogen van deze minderjarige worden toegekend en bepaalt
      de duur van de maatregel.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel241
  - number: '241.5'
    text: |-
      De maatregel vervalt na verloop van zes weken, tenzij voor het einde van de termijn aan de rechter een voorziening
      in het gezag over de minderjarige is verzocht.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel241
  - number: '241.6'
    text: |-
      De maatregel kan worden ingetrokken of gewijzigd door de kinderrechter die haar heeft bevolen tenzij een verzoek
      als bedoeld in het vijfde lid is ingediend. In dat geval beslist de rechter bij wie dit verzoek aanhangig is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel241
  - number: 241a
    text: |-
      Op de uitoefening van de voorlopige voogdij door een voogdij-instelling is [artikel 243 van dit Boek][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel243
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel241a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '243'
        afdeling: '3'
  - number: '242'
    text: |-
      De raad voor de kinderbescherming stelt zich op de hoogte van alle gevallen, waarin maatregelen met betrekking tot
      het gezag over minderjarigen overwogen dienen te worden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel242
  - number: '243.1'
    text: |-
      De gemeentebesturen en ambtenaren van de burgerlijke stand verschaffen de raad voor de kinderbescherming kosteloos
      alle inlichtingen, en verstrekken de raad kosteloos alle afschriften en uittreksels uit hun registers, die de raad
      ter uitvoering van zijn taak van hen vraagt. Wanneer de raad voor de kinderbescherming een taak vervult of een
      bevoegdheid uitoefent op grond van een van de bepalingen van deze titel of van de [titels 9][ref1], [10][ref2],
      [14][ref3], [15][ref4] en [17 van dit boek][ref5], alsmede op grond van de daarmee verband houdende bepalingen
      van het [Wetboek van Burgerlijke Rechtsvordering][ref6], verschaffen de bij algemene maatregel van bestuur aan
      te wijzen instanties of personen de raad kosteloos die inlichtingen die voor een goede uitoefening van hun taak
      noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656
      [ref5]: https://wetten.overheid.nl/BWBR0002656
      [ref6]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0002656
      - id: ref5
        bwb_id: BWBR0002656
      - id: ref6
        bwb_id: BWBR0001827
  - number: '243.2'
    text: |-
      Alle verzoeken die de raad voor de kinderbescherming ter uitvoering van zijn taak tot de rechter richt, worden
      kosteloos behandeld; de grossen, afschriften en uittreksels, die hij tot dat doel aanvraagt, worden hem door de
      griffiers vrij van alle kosten uitgereikt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel243
  - number: '243.3'
    text: |-
      Exploiten door de deurwaarders ten verzoeke van de raad voor de kinderbescherming uitgebracht, worden volgens het
      gewone tarief vergoed. Procureurs kunnen voor hun aan de raad voor de kinderbescherming bewezen diensten salaris in
      rekening brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel243
  - number: '243.4'
    text: |-
      Wanneer de raad voor de kinderbescherming op grond van een van de bepalingen van deze titel, of van de
      [titels 9][ref1], [10][ref2], [12][ref3], [14][ref4], [15][ref5] en [17 van dit boek][ref6] in rechte optreedt, kan
      hij dit zonder procureur of advocaat doen, behalve in gedingen die met een dagvaarding aanvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0002656
      [ref5]: https://wetten.overheid.nl/BWBR0002656
      [ref6]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel243
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0002656
      - id: ref5
        bwb_id: BWBR0002656
      - id: ref6
        bwb_id: BWBR0002656
  - number: '244'
    text: |-
      Bij de rechtbanken berusten openbare registers, waarin aantekening gehouden wordt van rechtsfeiten die op het
      over minderjarigen uitgeoefende gezag betrekking hebben. Bij algemene maatregel van bestuur wordt bepaald welke
      rechtsfeiten aangetekend worden, en op welke wijze deze aantekening geschiedt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel244
  - number: '245.1'
    text: Minderjarigen staan onder gezag.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel245
  - number: '245.2'
    text: Onder gezag wordt verstaan ouderlijk gezag dan wel voogdij.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel245
  - number: '245.3'
    text: |-
      Ouderlijk gezag wordt door de ouders gezamenlijk of door één ouder uitgeoefend. Voogdij wordt door een ander dan
      een ouder uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel245
  - number: '245.4'
    text: |-
      Het gezag heeft betrekking op de persoon van de minderjarige, het bewind over zijn vermogen en zijn
      vertegenwoordiging in burgerlijke handelingen, zowel in als buiten rechte.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel245
  - number: '245.5'
    text: |-
      Het gezag van de ouder die dit krachtens [artikel 253sa][ref1] of krachtens een rechterlijke beslissing
      overeenkomstig [artikel 253t][ref2] samen met een ander dan een ouder uitoefent, wordt aangemerkt als ouderlijk
      gezag dat door ouders gezamenlijk wordt uitgeoefend, tenzij uit een wettelijke bepaling het tegendeel voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253sa
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel245
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253sa
        paragraaf: '1'
        afdeling: 3A
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253t
        paragraaf: '2'
        afdeling: 3A
  - number: '246'
    text: |-
      Onbevoegd tot het gezag zijn minderjarigen, zij die onder curatele zijn gesteld en zij wier geestvermogens zodanig
      zijn gestoord, dat zij in de onmogelijkheid verkeren het gezag uit te oefenen, tenzij deze stoornis van tijdelijke
      aard is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel246
  - number: '247.1'
    text: Het ouderlijk gezag omvat de plicht en het recht van de ouder zijn minderjarig kind te verzorgen en op te voeden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel247
  - number: '247.2'
    text: |-
      Onder verzorging en opvoeding worden mede verstaan de zorg en de verantwoordelijkheid voor het geestelijk en
      lichamelijk welzijn van het kind en het bevorderen van de ontwikkeling van zijn persoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel247
  - number: '248'
    text: |-
      Het [tweede lid van artikel 247 van dit boek][ref1] is van overeenkomstige toepassing op de voogd en op degene die
      een minderjarige verzorgt en opvoedt zonder dat hem het gezag over die minderjarige toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel247
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel248
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '247'
        afdeling: '1'
  - number: '249'
    text: |-
      De minderjarige dient rekening te houden met de aan de ouder of voogd in het kader van de uitoefening van het gezag
      toekomende bevoegdheden, alsmede met de belangen van de overige leden van het gezin waarvan hij deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel249
  - number: '250'
    text: |-
      Wanneer in aangelegenheden betreffende diens verzorging en opvoeding, dan wel het vermogen van de minderjarige,
      de belangen van de met het gezag belaste ouders of een van hen dan wel van de voogd of de beide voogden in strijd
      zijn met die van de minderjarige, benoemt de kantonrechter indien hij dit in het belang van de minderjarige
      noodzakelijk acht, daarbij in het bijzonder de aard van deze belangenstrijd in aanmerking genomen, op verzoek van
      een belanghebbende of ambtshalve een bijzondere curator om de minderjarige ter zake, zowel in als buiten rechte,
      te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel250
  - number: '251.1'
    text: Gedurende hun huwelijk oefenen de ouders het gezag gezamenlijk uit.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel251
  - number: '251.2'
    text: |-
      Na ontbinding van het huwelijk anders dan door de dood of na scheiding van tafel en bed blijven de ouders die
      gezamenlijk het gezag hebben, dit gezag gezamenlijk uitoefenen, tenzij de rechter op verzoek van de ouders of
      een van hen in het belang van het kind bepaalt dat het gezag over een kind of de kinderen aan een van hen alleen
      toekomt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel251
  - number: '251.3'
    text: |-
      De beslissing op grond van het tweede lid wordt gegeven bij de beschikking houdende scheiding van tafel en
      bed, echtscheiding dan wel ontbinding van het huwelijk na scheiding van tafel en bed of bij latere beschikking.
      Totdat het gezag van één van beide ouders aanvangt, komt dit toe aan degene die ook tijdens het geding het gezag
      uitoefende, zulks met dezelfde bevoegdheden en onder dezelfde verplichtingen als deze toen had.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel251
  - number: '251.4'
    text: |-
      Indien een beslissing op grond van het tweede lid niet alle kinderen der echtgenoten betrof, vult de rechtbank haar
      aan op verzoek van een der ouders, van de raad voor de kinderbescherming of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel251
  - number: 251a
    text: |-
      De rechter kan, indien hem blijkt dat de minderjarige van twaalf jaar of ouder hierop prijs stelt, ambtshalve een
      beslissing geven op de voet van [artikel 251, tweede lid][ref1]. Hetzelfde geldt indien de minderjarige de leeftijd
      van twaalf jaren nog niet heeft bereikt, maar in staat kan worden geacht tot een redelijke waardering van zijn
      belangen ter zake.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel251a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '251'
        paragraaf: '1'
        afdeling: '2'
  - number: '252.1'
    text: |-
      De ouders die niet met elkaar zijn gehuwd noch met elkaar gehuwd zijn geweest en die nimmer het gezag over hun
      minderjarige kinderen gezamenlijk hebben uitgeoefend, oefenen dit gezamenlijk uit, indien zulks op hun beider
      verzoek in het in [artikel 244 van dit boek][ref1] bedoelde register is aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel244
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel252
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '244'
        afdeling: '4'
  - number: '252.2'
    text: 'De aantekening wordt door de griffier geweigerd, indien op het tijdstip van het verzoek:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel252
  - number: 252.2.a
    text: één of beide ouders onbevoegd is tot het gezag; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel252
  - number: 252.2.b
    text: één van beide ouders is ontheven of ontzet van het gezag en de andere ouder het gezag uitoefent; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel252
  - number: 252.2.c
    text: een voogd met het gezag over het kind is belast; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel252
  - number: 252.2.d
    text: de voorziening in het gezag over het kind is komen te ontbreken; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel252
  - number: 252.2.e
    text: de ouder die het gezag heeft, dit gezamenlijk met een ander dan een ouder uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel252
  - number: '252.3'
    text: |-
      Tegen de weigering van de aantekening is alleen beroep mogelijk, indien zij heeft plaatsgevonden op grond van
      onbevoegdheid van één of beide ouders tot het gezag anders dan vanwege minderjarigheid of ondercuratelestelling.
      Alsdan kan de kantonrechter worden verzocht de aantekening te gelasten. Hij wijst het verzoek af, indien gegronde
      vrees bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel252
  - number: '253.1'
    text: |-
      Indien gewezen echtgenoten met elkaar hertrouwen dan wel een geregistreerd partnerschap aangegaan en onmiddellijk
      daaraan voorafgaande één der echtgenoten het gezag over de minderjarige kinderen uitoefende, herleeft van
      rechtswege het gezamenlijk gezag, tenzij een der echtgenoten onbevoegd is tot dit gezag of daarvan is ontheven of
      ontzet dan wel het gezag gezamenlijk met een ander dan de ouder uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253
  - number: '253.2'
    text: |-
      De echtgenoot voor wie het gezag niet is herleefd, kan de rechtbank verzoeken hem daarmede te belasten. Dit verzoek
      wordt slechts afgewezen, indien gegronde vrees bestaat dat bij inwilliging de belangen van de kinderen zouden
      worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253
  - number: '253.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing, indien door verzoening van de echtgenoten een
      scheiding van tafel en bed eindigt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253
  - number: '253.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing indien gewezen geregistreerde partners die gezamenlijk
      gezag uitoefenden over het kind, opnieuw met elkaar een geregistreerd partnerschap aangaan dan wel met elkaar
      huwen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253
  - number: 253a
    text: |-
      Ingeval van gezamenlijke gezagsuitoefening kunnen geschillen tussen de ouders hieromtrent op verzoek van beiden of
      van een van hen aan de rechtbank worden voorgelegd. Deze beproeft, alvorens te beslissen, een vergelijk tussen de
      ouders. De rechtbank neemt een zodanige beslissing als haar in het belang van het kind wenselijk voorkomt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253a
  - number: 253aa.1
    text: Over een staande een geregistreerd partnerschap geboren kind oefenen de ouders gezamenlijk het gezag uit.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253aa
  - number: 253aa.2
    text: |-
      De bepalingen met betrekking tot het gezamenlijk gezag van ouders zijn hierop van toepassing, met uitzondering van
      de [artikelen 251, tweede, derde en vierde lid][ref1], en [251a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel251a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253aa
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '251'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 251a
        paragraaf: '1'
        afdeling: '2'
  - number: 253b.1
    text: |-
      Indien ten aanzien van een kind alleen het moederschap vaststaat of indien de ouders van een kind niet met
      elkaar gehuwd zijn dan wel gehuwd zijn geweest en zij het gezag niet gezamenlijk uitoefenen, oefent de moeder van
      rechtswege het gezag over het kind alleen uit, tenzij zij bij haar bevalling onbevoegd tot het gezag was.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253b
  - number: 253b.2
    text: |-
      De in het eerste lid bedoelde moeder die ten tijde van haar bevalling onbevoegd was tot het gezag, verkrijgt dit
      van rechtswege op het tijdstip waarop zij daartoe bevoegd wordt, tenzij op dat tijdstip een ander met het gezag
      is belast.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253b
  - number: 253b.3
    text: |-
      Indien op bedoeld tijdstip een ander het gezag heeft, kan de tot het gezag bevoegde ouder de kantonrechter
      verzoeken hem met het gezag over het kind te belasten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253b
  - number: 253b.4
    text: |-
      Wanneer de andere ouder het gezag over het kind uitoefent, wordt dit verzoek slechts ingewilligd, indien de
      kantonrechter dit in het belang van het kind wenselijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253b
  - number: 253b.5
    text: |-
      Wanneer een voogd het gezag over het kind uitoefent, wordt het verzoek slechts afgewezen, indien gegronde vrees
      bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253b
  - number: 253c.1
    text: |-
      De tot het gezag bevoegde vader van het kind, die nimmer het gezag gezamenlijk met de moeder heeft uitgeoefend, kan
      de kantonrechter verzoeken hem met het gezag over het kind te belasten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253c
  - number: 253c.2
    text: |-
      Wanneer de moeder het gezag over het kind uitoefent, wordt dit verzoek slechts ingewilligd, indien de kantonrechter
      dit in het belang van het kind wenselijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253c
  - number: 253c.3
    text: |-
      Wanneer niet in het gezag is voorzien of wanneer een voogd het gezag uitoefent, wordt het verzoek slechts
      afgewezen, indien gegronde vrees bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253c
  - number: 253d.1
    text: |-
      Indien de voorziening in het gezag over een kind als bedoeld in [artikel 253][ref1] komt te ontbreken, kunnen zowel
      zijn moeder als zijn vader dan wel beiden voor zover zij tot het gezag bevoegd zijn - de kantonrechter verzoeken
      met het gezag onderscheidenlijk gezamenlijk gezag te worden belast. Indien de voorziening in het gezag komt te
      ontbreken ten gevolge van ontheffing of ontzetting van het gezag, wordt het verzoek tot de rechtbank gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253b
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253b
        paragraaf: '2'
        afdeling: '2'
  - number: 253d.2
    text: |-
      Het in het eerste lid bedoelde verzoek wordt slechts afgewezen, indien gegronde vrees bestaat dat bij inwilliging
      de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253d
  - number: 253d.3
    text: |-
      Hebben beiden een verzoek ingediend anders dan tot gezamenlijke gezagsuitoefening, dan willigt de rechter het
      verzoek in van degene wiens gezag over het kind hij het meeste in het belang van het kind oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253d
  - number: 253d.4
    text: |-
      Indien, voordat over het verzoek van één ouder is beslist, de andere ouder van rechtswege het gezag over het kind
      verkrijgt, willigt de rechter het verzoek slechts in, indien hij dit in het belang van het kind wenselijk oordeelt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253d
  - number: 253e
    text: |-
      Inwilliging van het verzoek van een der ouders als bedoeld in de [artikelen 253b][ref1], [253c][ref2] en
      [253d van dit boek][ref3] heeft, indien de ander het gezag tot dusverre uitoefende, tot gevolg dat de laatste het
      gezag verliest.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253b
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253c
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel253d
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253b
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253c
        paragraaf: '2'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 253d
        paragraaf: '2'
        afdeling: '2'
  - number: 253f
    text: |-
      Na de dood van een der ouders oefent de overlevende ouder van rechtswege het gezag over de kinderen uit, indien en
      voor zover hij op het tijdstip van overlijden het gezag uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253f
  - number: 253g.1
    text: |-
      Indien van de ouders diegene overlijdt die het gezag over hun minderjarige kinderen alleen uitoefent, bepaalt de
      rechter dat de overlevende ouder of een derde met het gezag over deze kinderen wordt belast.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253g
  - number: 253g.2
    text: De rechter doet dit op verzoek van de raad voor de kinderbescherming, de overlevende ouder of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253g
  - number: 253g.3
    text: |-
      Het verzoek om de overlevende ouder met het gezag te belasten wordt slechts afgewezen, indien gegronde vrees
      bestaat dat bij inwilliging de belangen van de kinderen zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253g
  - number: 253g.4
    text: |-
      De bepaling van het voorgaande lid is mede van toepassing indien de overleden ouder een voogd had aangewezen
      overeenkomstig [artikel 292 van dit boek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel292
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '292'
        paragraaf: '2'
        afdeling: '6'
  - number: 253g.5
    text: 'Tot het geven van de in dit artikel bedoelde beslissingen is de rechtbank bevoegd, indien:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253g
  - number: 253g.5.a
    text: |-
      het betreft het overlijden van de ouder die na de gerechtelijke ontbinding van het huwelijk of na scheiding
      van tafel en bed het gezag alleen uitoefende of die na de uitoefening van het gezamenlijk gezag als bedoeld in
      [artikel 252, eerste lid, van dit boek][ref1] alleen met het gezag was belast;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel252
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253g
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '252'
        paragraaf: '1'
        afdeling: '2'
  - number: 253g.5.b
    text: de overlevende ouder was ontheven of ontzet van het gezag en verzocht wordt deze met het gezag te belasten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253g
  - number: 253h.1
    text: |-
      Indien na het overlijden van één der ouders een voogd is benoemd, kan de rechter deze beslissing te allen tijde in
      dier voege wijzigen, dat de overlevende ouder mits deze daartoe bevoegd is, alsnog met het gezag wordt belast.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253h
  - number: 253h.2
    text: |-
      Hij gaat hiertoe slechts over op verzoek van de overlevende ouder, en niet dan op grond dat nadien de
      omstandigheden zijn gewijzigd, of dat bij het nemen van de beslissing van onjuiste of onvolledige gegevens is
      uitgegaan.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253h
  - number: 253h.3
    text: |-
      Wanneer de andere ouder een voogd had aangewezen overeenkomstig [artikel 292 van dit boek][ref1] en deze inmiddels
      is opgetreden, is dit artikel van overeenkomstige toepassing met dien verstande dat, mits het verzoek van de
      overlevende ouder binnen één jaar na het begin van de voogdij wordt gedaan, dit verzoek slechts wordt afgewezen
      indien gegronde vrees bestaat dat bij inwilliging de belangen van de kinderen zouden worden verwaarloosd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel292
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253h
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '292'
        paragraaf: '2'
        afdeling: '6'
  - number: 253h.4
    text: |-
      Het [vijfde lid van artikel 253][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253g
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253h
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253g
        paragraaf: '2'
        afdeling: '2'
  - number: 253ha.1
    text: |-
      De minderjarige vrouw die als degene die het gezag heeft, haar kind wenst te verzorgen en op te voeden kan, indien
      zij de leeftijd van zestien jaren heeft bereikt, de kinderrechter verzoeken haar meerderjarig te verklaren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253ha
  - number: 253ha.2
    text: |-
      Het verzoek kan ten behoeve van de vrouw ook worden gedaan door de raad voor de kinderbescherming. Deze behoeft
      hiertoe haar schriftelijke toestemming. Het verzoek vervalt, indien de vrouw haar toestemming intrekt.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253ha
  - number: 253ha.3
    text: |-
      Het verzoek kan ook voor de bevalling door of ten behoeve van de vrouw worden gedaan, alsmede indien de vrouw eerst
      omstreeks het tijdstip van haar bevalling de leeftijd van zestien jaren zal hebben bereikt. In dat geval wordt op
      het verzoek niet eerder dan na de bevalling of, indien de vrouw op dat tijdstip nog geen zestien jaar is, nadat zij
      die leeftijd heeft bereikt, beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253ha
  - number: 253ha.4
    text: |-
      De kinderrechter willigt het verzoek slechts in, indien hij dit in het belang van de moeder en haar kind wenselijk
      oordeelt. Indien een ander met het gezag is belast, wordt de moeder daarmee belast.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253ha
  - number: 253ha.5
    text: De minderjarige vrouw is bekwaam in rechte op te treden en tegen een uitspraak beroep in te stellen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253ha
  - number: 253i.1
    text: |-
      Ingeval van gezamenlijke gezagsuitoefening voeren de ouders gezamenlijk het bewind over het vermogen van het kind
      en vertegenwoordigen zij gezamenlijk het kind in burgerlijke handelingen, met dien verstande dat een ouder alleen,
      mits niet van bezwaren van de andere ouder is gebleken, hiertoe ook bevoegd is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253i
  - number: 253i.2
    text: |-
      [Artikel 253][ref1] is van overeenkomstige toepassing met dien verstande dat in plaats van "de rechtbank" wordt
      gelezen "de kantonrechter".


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253i
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
  - number: 253i.3
    text: |-
      Oefent een ouder het gezag alleen uit, dan wordt door die ouder het bewind over het vermogen van het kind gevoerd
      en het kind in burgerlijke handelingen vertegenwoordigd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253i
  - number: 253i.4
    text: 'Van het bepaalde in het eerste en derde lid kan worden afgeweken:'
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253i
  - number: 253i.4.a
    text: |-
      indien de rechter bij de beschikking waarbij de uitoefening van het gezag over het kind aan een van de ouders wordt
      opgedragen op eensluidend verzoek van de ouders of op verzoek van één van hen, mits de ander zich daartegen niet
      verzet, heeft bepaald dat de ouder die niet het gezag over het kind zal uitoefenen, het bewind over het vermogen
      van het kind zal voeren;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253i
  - number: 253i.4.b
    text: |-
      ingevolge [artikel 276, tweede lid, van dit boek][ref1], bij ontheffing of ontzetting van het gezag;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel276
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253i
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '276'
        afdeling: '5'
  - number: 253i.4.c
    text: |-
      indien hij die een minderjarige goederen schenkt of vermaakt, bij de gift, onderscheidenlijk bij de uiterste
      wilsbeschikking, heeft bepaald dat een ander het bewind over die goederen zal voeren.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253i
  - number: 253i.5
    text: |-
      In het laatstbedoelde geval zijn de ouders, of - indien een ouder het gezag alleen uitoefent - die ouder, bevoegd
      van de bewindvoerder rekening en verantwoording te vragen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253i
  - number: 253i.6
    text: |-
      Bij het vervallen van het door de schenker of erflater ingesteld bewind zijn het eerste en tweede lid,
      onderscheidenlijk het derde lid, van toepassing.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253i
  - number: 253j
    text: |-
      De ouders of een ouder moeten het bewind over het vermogen van hun kind als goede bewindvoerders voeren. Bij slecht
      bewind zijn zij voor de daaraan te wijten schade aansprakelijk, behoudens voor de vruchten van dat vermogen voor
      zover de wet hun het genot daarvan toekent.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253j
  - number: 253k
    text: |-
      Op het bewind van de ouders of een ouder zijn de [artikelen 342, tweede lid][ref1], [344 tot en met 357][ref2] en
      [370 van dit boek][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel342
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel344
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel370
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253k
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '342'
        paragraaf: '10'
        afdeling: '6'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '344'
        paragraaf: '10'
        afdeling: '6'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '370'
        paragraaf: '10'
        afdeling: '6'
  - number: 253l.1
    text: |-
      Elke ouder die het gezag over zijn kind uitoefent, heeft het vruchtgenot van diens vermogen. Indien het kind bij de
      ouder inwoont en anders dan incidenteel inkomen uit arbeid geniet, is het verplicht naar draagkracht bij te dragen
      in de kosten van de huishouding van het gezin.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253l
  - number: 253l.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing in geval de ouder van het gezag is ontheven, tenzij de andere
      ouder het gezag uitoefent.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253l
  - number: 253l.3
    text: Aan bedoeld vruchtgenot zijn de lasten verbonden, die op vruchtgebruikers rusten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253l
  - number: 253m
    text: |-
      De ouder heeft geen vruchtgenot van het vermogen, ten aanzien waarvan bij uiterste wilsbeschikking van de erflater
      of bij de gift is bepaald dat de ouders daarvan het vruchtgenot niet zullen hebben.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253m
  - number: 253n.1
    text: |-
      Op verzoek van de niet met elkaar gehuwde ouders of een van hen kan de rechtbank het gezamenlijk gezag,
      bedoeld in de [artikelen 251, tweede lid][ref1], [252, eerste lid][ref2], [253q, vijfde lid][ref3], of
      [277, eerste lid][ref4], beëindigen, indien nadien de omstandigheden zijn gewijzigd of bij het nemen van de
      beslissing van onjuiste of onvolledige gegevens is uitgegaan. Alsdan bepaalt de rechtbank aan wie van de ouders
      voortaan in het belang van het kind het gezag over ieder der minderjarige kinderen toekomt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel252
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel277
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253n
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '251'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '252'
        paragraaf: '1'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 253q
        afdeling: '3'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '277'
        afdeling: '5'
  - number: 253n.2
    text: |-
      Het [vierde lid van artikel 251 van dit boek][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253n
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '251'
        paragraaf: '1'
        afdeling: '2'
  - number: 253o.1
    text: |-
      Beslissingen waarbij een ouder alleen met het gezag is belast, gegeven ingevolge het bepaalde in de paragrafen 1, 2
      en 2 van deze titel en het bepaalde in [artikel 253][ref1] kunnen op verzoek van de ouders of van een van hen door
      de rechtbank worden gewijzigd op grond dat nadien de omstandigheden zijn gewijzigd, of dat bij het nemen van de
      beslissing van onjuiste of onvolledige gegevens is uitgegaan. Een verzoek om alsnog gezamenlijk met het gezag over
      hun minderjarige kinderen te worden belast, kan slechts van beide ouders afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253n
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253o
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253n
        afdeling: '3'
  - number: 253o.2
    text: |-
      De rechtbank is eveneens bevoegd kennis te nemen van verzoeken tot wijziging van beslissingen inzake het gezag
      of samenhangend met gezag die door een buitenlandse autoriteit zijn gegeven na een buiten Nederland tot stand
      gekomen echtscheiding of scheiding van tafel en bed, indien de minderjarige gewoon verblijf heeft in Nederland.
      Deze rechtbank is voorts bevoegd om in het gezag te voorzien of een met het gezag samenhangende beslissing te
      geven, indien de buitenlandse beslissing niet voor erkenning in aanmerking komt, dan wel indien na de echtscheiding
      of scheiding van tafel en bed zodanige beslissing niet is gegeven en de minderjarige gewoon verblijf heeft in
      Nederland.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253o
  - number: 253o.3
    text: |-
      Een verzoek tot wijziging van een gezagsbeslissing wordt aan de kantonrechter gedaan, indien de te wijzigen
      beslissing door de kantonrechter is gegeven.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253o
  - number: 253p.1
    text: |-
      In de gevallen waarin door de rechter het gezag wordt opgedragen aan beide ouders of aan een ouder alleen, neemt
      dit een aanvang zodra de desbetreffende beschikking in kracht van gewijsde is gegaan, of, indien zij uitvoerbaar
      bij voorraad is verklaard, daags nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253p
  - number: 253p.2
    text: |-
      Na de gerechtelijke ontbinding van het huwelijk of na scheiding van tafel en bed begint het gezag nochtans
      niet voordat de beschikking houdende ontbinding van het huwelijk is ingeschreven in de registers van de
      burgerlijke stand of voordat de beschikking houdende scheiding van tafel en bed is ingeschreven in het
      huwelijksgoederenregister, aangewezen in [artikel 116][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel116
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253p
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '116'
        afdeling: '1'
  - number: 253p.3
    text: |-
      Indien een aantekening was gedaan als bedoeld in [artikel 252, eerste lid, van dit boek][ref1], begint het aan
      één der ouders opgedragen gezag nochtans niet, dan nadat deze aantekening door de griffier is doorgehaald. Van de
      doorhaling doet de griffier schriftelijk mededeling aan beide ouders.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel252
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253p
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '252'
        paragraaf: '1'
        afdeling: '2'
  - number: 253q.1
    text: |-
      Wanneer een van de ouders die gezamenlijk het gezag over hun minderjarige kinderen uitoefenen, op een der in
      [artikel 246][ref1] genoemde gronden daartoe onbevoegd is, oefent de andere ouder alleen het gezag over de kinderen
      uit. Wanneer de grond van de onbevoegdheid is weggevallen, herleeft van rechtswege het gezamenlijke gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253q
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
  - number: 253q.2
    text: |-
      Wanneer beide ouders die gezamenlijk het gezag over hun minderjarige kinderen uitoefenen, daartoe op een der in
      [artikel 246][ref1] genoemde gronden onbevoegd zijn, benoemt de kantonrechter een voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253q
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
  - number: 253q.3
    text: |-
      Wanneer een ouder die alleen het gezag uitoefent, op een der in [artikel 246][ref1] genoemde gronden daartoe
      onbevoegd is, belast de kantonrechter de andere ouder met het gezag, tenzij gegronde vrees bestaat dat de belangen
      van de kinderen zouden worden verwaarloosd. Alsdan benoemt hij een voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253q
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
  - number: 253q.4
    text: |-
      De in het tweede en derde lid bedoelde beslissingen worden gegeven op verzoek van een ouder, bloed- of aanverwanten
      van de minderjarige, de raad voor de kinderbescherming of ambtshalve.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253q
  - number: 253q.5
    text: |-
      Wanneer de grond van de onbevoegdheid van de in het derde lid eerstgenoemde ouder is vervallen, wordt hij, op zijn
      verzoek, wederom met het gezag belast, indien de kantonrechter overtuigd is dat het kind wederom aan de ouder mag
      worden toevertrouwd. Indien de ouders gezamenlijk met het gezag wensen te worden belast, dient het verzoek daartoe
      van beiden afkomstig te zijn.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253q
  - number: 253r.1
    text: |-
      Het bepaalde in [artikel 253][ref1] is van overeenkomstige toepassing, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253r
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253q
        afdeling: '3'
  - number: 253r.1.a
    text: één of beide ouders al dan niet tijdelijk in de onmogelijkheid verkeert het gezag uit te oefenen; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253r
  - number: 253r.1.b
    text: het bestaan of de verblijfplaats van één of beide ouders onbekend is.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253r
  - number: 253r.2
    text: |-
      Het gezag dat aan één of beide ouders toekomt, is geschorst gedurende de tijd waarin een van de in het eerste lid
      bedoelde omstandigheden zich voordoet.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253r
  - number: 253s.1
    text: |-
      Indien het kind met instemming van zijn ouders die het gezag over hem uitoefenen, gedurende ten minste een
      jaar door een of meer anderen als behorende tot het gezin is verzorgd en opgevoed, kunnen de ouders slechts met
      toestemming van degenen die de verzorging en opvoeding op zich hebben genomen, wijziging in het verblijf van het
      kind brengen.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253s
  - number: 253s.2
    text: |-
      Voor zover de volgens het vorige lid vereiste toestemmingen niet worden verkregen, kunnen zij op verzoek van de
      ouders door die van de rechtbank worden vervangen. Dit verzoek wordt slechts afgewezen, indien gegronde vrees
      bestaat dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253s
  - number: 253s.3
    text: |-
      In geval van afwijzing van het verzoek is de beschikking van kracht gedurende een door de rechtbank te bepalen
      termijn, welke de duur van zes maanden niet te boven mag gaan. Is echter voor het einde van deze termijn een
      verzoek tot ondertoezichtstelling van het kind, dan wel tot ontheffing of ontzetting van een of beide ouders
      aanhangig gemaakt, dan blijft de beschikking gelden, totdat op het verzoek bij gewijsde is beslist.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253s
  - number: 253sa.1
    text: |-
      Over een staande huwelijk of geregistreerd partnerschap geboren kind oefenen een ouder en zijn echtgenoot
      of geregistreerde partner die niet de ouder is, gezamenlijk het gezag uit, tenzij het kind tevens in
      familierechtelijke betrekking staat tot een andere ouder.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253sa
  - number: 253sa.2
    text: |-
      De bepalingen met betrekking tot het gezamenlijk gezag van ouders zijn hierop van overeenkomstige toepassing, met
      uitzondering van de [artikelen 251, tweede, derde en vierde lid][ref1], en [251a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel251
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel251a
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253sa
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '251'
        paragraaf: '1'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 251a
        paragraaf: '1'
        afdeling: '2'
  - number: 253sa.3
    text: |-
      [Artikel 5, vierde, vijfde en zevende lid][ref1], is van overeenkomstige toepassing ten aanzien van het kind,
      over wie de ouder en zijn geregistreerde partner die niet de ouder is, van rechtswege gezamenlijk het gezag zullen
      uitoefenen of uitoefenen, met dien verstande dat, indien de ouder en zijn partner niet uiterlijk ter gelegenheid
      van de aangifte van de geboorte naamskeuze hebben gedaan, de ambtenaar van de burgerlijke stand als geslachtsnaam
      van het kind de geslachtsnaam van de moeder in de geboorteakte opneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel5
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253sa
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '5'
  - number: 253t.1
    text: |-
      Indien het gezag over een kind bij één ouder berust, kan de rechtbank op gezamenlijk verzoek van de met het
      gezag belaste ouder en een ander dan de ouder die in een nauwe persoonlijke betrekking tot het kind staat, hen
      gezamenlijk met het gezag over het kind belasten.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253t
  - number: 253t.2
    text: |-
      In het geval dat het kind tevens in familierechtelijke betrekking staat tot een andere ouder wordt het verzoek
      slechts toegewezen, indien:
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253t
  - number: 253t.2.a
    text: |-
      de ouder en de ander op de dag van het verzoek gedurende ten minste een aaneengesloten periode van een jaar
      onmiddellijk voorafgaande aan het verzoek gezamenlijk de zorg voor het kind hebben gehad; en
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253t
  - number: 253t.2.b
    text: |-
      de ouder die het verzoek doet op de dag van het verzoek gedurende ten minste een aaneengesloten periode van drie
      jaren alleen met het gezag belast is geweest.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253t
  - number: 253t.3
    text: |-
      Het verzoek wordt afgewezen indien, mede in het licht van de belangen van een andere ouder, gegronde vrees bestaat
      dat bij inwilliging de belangen van het kind zouden worden verwaarloosd.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253t
  - number: 253t.4
    text: |-
      Het gezamenlijk gezag, bedoeld in het eerste lid, kan niet worden toegekend in de gevallen, bedoeld in
      [artikel 253q, eerste lid][ref1], en [artikel 253r][ref2]. Het staat niet open voor rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253r
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253t
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253q
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253r
        afdeling: '3'
  - number: 253t.5
    text: |-
      Een verzoek als bedoeld in het eerste lid kan vergezeld gaan van een verzoek tot wijziging van de geslachtsnaam van
      het kind in de geslachtsnaam van de met het gezag belaste ouder of de ander. Een zodanig verzoek wordt afgewezen,
      indien
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253t
  - number: 253t.5.a
    text: het kind van twaalf jaar of ouder ter gelegenheid van zijn verhoor niet heeft ingestemd met het verzoek;
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253t
  - number: 253t.5.b
    text: het verzoek, bedoeld in het eerste lid, wordt afgewezen; of
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253t
  - number: 253t.5.c
    text: het belang van het kind zich tegen toewijzing verzet.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253t
  - number: 253u
    text: |-
      Het gezamenlijk gezag begint op de dag waarop de beslissing die de benoeming inhoudt, in kracht van gewijsde is
      gegaan, of, indien zij uitvoerbaar bij voorraad is verklaard, daags nadat de beschikking is verstrekt of verzonden.
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253u
  - number: 253v.1
    text: |-
      Op de gezamenlijke gezagsuitoefening door de ouder en de ander zijn de [artikelen 246][ref1], [247][ref2],
      [249][ref3], [250][ref4], [253a][ref5], [253j tot en met 253m][ref6], [253q, eerste lid][ref7], alsmede 253*r* van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel246
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel247
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel249
      [ref4]: https://wetten.overheid.nl/BWBR0002656#Artikel250
      [ref5]: https://wetten.overheid.nl/BWBR0002656#Artikel253a
      [ref6]: https://wetten.overheid.nl/BWBR0002656#Artikel253j
      [ref7]: https://wetten.overheid.nl/BWBR0002656#Artikel253q
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253v
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '246'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '247'
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '249'
        afdeling: '1'
      - id: ref4
        bwb_id: BWBR0002656
        artikel: '250'
        afdeling: '1'
      - id: ref5
        bwb_id: BWBR0002656
        artikel: 253a
        paragraaf: '1'
        afdeling: '2'
      - id: ref6
        bwb_id: BWBR0002656
        artikel: 253j
        paragraaf: '3'
        afdeling: '2'
      - id: ref7
        bwb_id: BWBR0002656
        artikel: 253q
        afdeling: '3'
  - number: 253v.2
    text: |-
      [Artikel 253i][ref1] is van overeenkomstige toepassing, tenzij de met het gezag belaste ouder het bewind niet voert
      ingevolge [artikel 253i, vierde lid, onder a of c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253i
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253i
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253v
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 253i
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 253i
        paragraaf: '3'
        afdeling: '2'
  - number: 253v.3
    text: |-
      [Artikel 253n][ref1] is van overeenkomstige toepassing, met dien verstande dat de rechtbank een beslissing tot
      beëindiging van het gezamenlijk gezag, bedoeld in [artikel 253t][ref2], niet geeft dan nadat zij de niet met het
      gezag belaste ouder dan wel beide ouders tezamen in de gelegenheid heeft gesteld te verzoeken in het belang van het
      kind onderscheidenlijk hem met het gezag over het kind te belasten of hen gezamenlijk daarmee te belasten.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel253n
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel253t
    url: https://wetten.overheid.nl/BWBR0002656/2004-06-30#Artikel253v
    references:
