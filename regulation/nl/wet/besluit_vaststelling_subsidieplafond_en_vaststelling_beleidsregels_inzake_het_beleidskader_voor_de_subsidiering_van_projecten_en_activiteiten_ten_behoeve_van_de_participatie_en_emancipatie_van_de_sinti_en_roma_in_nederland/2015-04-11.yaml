  text: |-
    Gelet op artikel 4:81 van de Algemene wet bestuursrecht en artikel 10 van de Kaderregeling VWS-subsidies,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0036514/2015-04-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het subsidieplafond voor het ‘Beleidskader voor de subsidiering van projecten en activiteiten ten behoeve van
      de participatie en emancipatie van de Sinti en Roma in Nederland’ bedraagt per jaar 500.000 euro. Subsidie voor
      studiebeurzen zijn hiervan uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0036514/2015-04-11#Artikel1
  - number: '2'
    text: |-
      De beleidsregels inzake subsidieverlening krachtens het ‘Beleidskader voor de subsidiering van projecten en
      activiteiten ten behoeve van de participatie en emancipatie van de Sinti en Roma in Nederland’ worden vastgesteld
      als opgenomen in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0036514/2015-04-11#Artikel2
  - number: '3'
    text: Dit besluit treedt in werking op de dag na de datum van uitgifte van de Staatscourant waarin het wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0036514/2015-04-11#Artikel3
  - number: '4'
    text: |-
      Dit besluit wordt aangehaald als: Besluit vaststelling subsidieplafond en vaststelling beleidsregels inzake het
      Beleidskader voor de subsidiering van projecten en activiteiten ten behoeve van de participatie en emancipatie van
      de Sinti en Roma in Nederland.
    url: https://wetten.overheid.nl/BWBR0036514/2015-04-11#Artikel4
