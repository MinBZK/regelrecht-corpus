  - number: '6'
    text: |-
      1 Onze Minister laat de aanvraag tot inschrijving in het register buiten behandeling, indien en voor zolang:

      a. een rechterlijke uitspraak waarbij de aanvrager, een bestuurder of een verrichter of aanbieder van
      buitengerechtelijke incassowerkzaamheden waarbij de aanvrager of een bestuurder van de aanvrager is betrokken,
      onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, hij surseance van betaling heeft verkregen, dan wel wegens
      schulden is gegijzeld, niet onherroepelijk is;

      b. de registratie van de aanvrager of van een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden
      waarbij de aanvrager of een bestuurder van de aanvrager is betrokken, is geschorst;

      c. een krachtens [artikel 10, aanhef en onderdeel c][ref1], of [artikel 17][ref2] genomen besluit tot doorhaling
      van de registratie van de aanvrager of van een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden
      waarbij de aanvrager of een bestuurder van de aanvrager is betrokken, niet onherroepelijk is;

      d. de kosten die krachtens [artikel 20, eerste lid, aanhef en onderdeel b][ref3], ten laste worden gebracht, niet
      zijn voldaan.

      2 De termijn, genoemd in [artikel 5, derde lid][ref4], wordt in ieder geval opgeschort tot de dag waarop een in het
      eerste lid bedoelde omstandigheid zich niet langer voordoet en de aanvrager heeft verzocht de aanvraag verder in
      behandeling te nemen.


