  - number: '2'
    text: |-
      Deze wet heeft uitsluitend betrekking op buitengerechtelijke incassowerkzaamheden:

      a. die worden verricht of aangeboden in de uitoefening van een daarop gericht of mede gericht beroep of bedrijf of
      op een wijze alsof zij daarop beroepsmatig of bedrijfsmatig gericht of mede gericht was;

      b. voor een derde of na overdracht van de vordering; en

      c. met betrekking tot voldoening door een natuurlijke persoon die zijn woonplaats in Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel2
  - number: '3'
    text: |-
      1 Er is een register waarin op hun aanvraag verrichters en aanbieders van buitengerechtelijke incassowerkzaamheden
      worden ingeschreven, die voldoen aan de daarvoor bij en krachtens deze wet gestelde voorwaarden.

      2 Het register bevat, voor zover van toepassing, de volgende gegevens over verrichters en aanbieders van
      buitengerechtelijke incassowerkzaamheden:

      a. de datum van de registratie en een daarbij toegekend registratiekenmerk;

      b. de naam of namen waaronder buitengerechtelijke incassowerkzaamheden worden verricht of aangeboden;

      c. de naam en voornaam of voornamen van de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden,
      het adres waar hij kantoor houdt, een telefoonnummer waarop hij bereikbaar is en overige contactgegevens;

      d. de naam en voornaam of voornamen van de bestuurders;

      e. een wijziging als bedoeld in [artikel 8][ref1];

      f. een bestuurlijke sanctie als bedoeld in de [artikelen 15][ref2] en [16][ref3], met een aanduiding indien een
      besluit hiertoe nog niet onherroepelijk is;

      g. een schorsing en een opheffing van een schorsing als bedoeld in [artikel 9][ref4], met een aanduiding indien een
      besluit hiertoe nog niet onherroepelijk is;

      h. een doorhaling van een registratie als bedoeld in de [artikelen 10][ref5] en [17][ref6], met een aanduiding
      indien een besluit hiertoe nog niet onherroepelijk is;

      i. het vervallen van een registratie, bedoeld in het vijfde lid.

      3 Het register wordt gehouden door Onze Minister. Onze Minister is verwerkingsverantwoordelijke voor het register
      als bedoeld in artikel 4, onderdeel 7, van de Algemene verordening gegevensbescherming. Onze Minister kan een
      verwerker als bedoeld in artikel 4, onderdeel 8, van de Algemene verordening gegevensbescherming aanwijzen.

      4 Ten behoeve van de kwaliteitsborging van de incassodienstverlening, verwerkt Onze Minister persoonsgegevens
      voor zover dat noodzakelijk is voor de uitvoering van zijn uit deze wet en de daarop berustende bepalingen
      voortvloeiende taken en bevoegdheden.

      5 Onze Minister geeft, voor zover van toepassing, aan een ieder in ieder geval via een daartoe geschikte website
      kennis:

      a. van een gegeven als bedoeld in het tweede lid, onderdeel a, b en c;

      b. gedurende een schorsing, van de mededeling dat en de datum waarop in het register is opgenomen dat een
      registratie is geschorst, met een aanduiding indien een besluit hiertoe nog niet onherroepelijk is;

      c. na een doorhaling krachtens een besluit dat nog niet onherroepelijk is, van de mededeling dat en de datum waarop
      in het register is opgenomen dat een registratie is doorgehaald, met de aanduiding dat een besluit hiertoe nog niet
      onherroepelijk is.

      6 Een registratie vervalt, indien de kosten die krachtens [artikel 20, eerste lid, aanhef en onderdeel a][ref7],
      ten laste worden gebracht, niet of niet tijdig zijn voldaan.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste tot en met
      vijfde lid.


