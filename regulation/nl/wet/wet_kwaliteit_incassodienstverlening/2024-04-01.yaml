  - number: '19'
    text: |-
      1 Indien een toezichthouder als bedoeld in [artikel 14][ref1] in de uitoefening van zijn bediening
      kennis krijgt van een gedraging die een overtreding is van het bepaalde bij of krachtens de
      [Wet handhaving consumentenbescherming][ref2] of de [Wet op het financieel toezicht][ref3], brengt hij dit
      onverwijld onder de aandacht van de Autoriteit Consument en Markt, onderscheidenlijk een krachtens besluit van de
      Stichting Autoriteit Financiële Markten met toezicht belaste persoon.

      2 Indien de Autoriteit Consument en Markt of een krachtens besluit van de Stichting Autoriteit Financiële
      Markten met toezicht belaste persoon in de uitoefening van zijn bediening kennis krijgt van een gedraging die een
      overtreding is van het bepaalde bij of krachtens deze wet, brengt hij dit onverwijld onder de aandacht van:

      a. een ambtenaar als bedoeld in [artikel 14, eerste lid][ref4];

      b. een persoon als bedoeld in [artikel 30a van de Gerechtsdeurwaarderswet][ref5], indien de overtreding is begaan
      door een persoon als bedoeld in [artikel 4, tweede lid, onderdeel a][ref6];

      c. de deken, indien de overtreding is begaan door een persoon als bedoeld in
      [artikel 4, tweede lid, onderdeel b][ref7].

      3 Onze Minister, het Bureau Financieel Toezicht, de deken, de Autoriteit Consument en Markt en de Stichting
      Autoriteit Financiële Markten maken afspraken die worden vastgelegd in een samenwerkingsprotocol en die in ieder
      geval betrekking hebben op effectief en doelmatig toezicht op de naleving door verrichters en aanbieders van
      buitengerechtelijke incassowerkzaamheden van de bij of krachtens de onderscheiden wetten gestelde regels en de
      effectieve en doelmatige handhaving daarvan.

      4 Onze Minister doet mededeling van een samenwerkingsprotocol in de Staatscourant.

      5 Er kunnen ten behoeve van een goede vervulling van hun bij of krachtens de wet gegeven taak wederzijds gegevens
      of inlichtingen worden verstrekt, die ten aanzien van een verrichter of aanbieder van buitengerechtelijke
      incassowerkzaamheden zijn verkregen:

      a. bij de uitvoering van een bij of krachtens deze wet gegeven taak, door een toezichthouder als bedoeld in
      [artikel 14][ref8] of door Onze Minister;

      b. bij de uitvoering van een bij of krachtens de [Wet handhaving consumentenbescherming][ref9] gegeven taak, door
      de Autoriteit Consument en Markt, de Stichting Autoriteit Financiële Markten of een krachtens haar besluit met
      toezicht belaste persoon;

      c. bij de uitvoering van een bij of krachtens de [Wet op het financieel toezicht][ref10] gegeven taak, door de
      Stichting Autoriteit Financiële Markten of een krachtens haar besluit met toezicht belaste persoon.

      6 Verstrekking van gegevens of inlichtingen vindt uitsluitend plaats, indien:

      a. de geheimhouding van de gegevens of inlichtingen in voldoende mate is gewaarborgd;

      b. voldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt; en

      c. het geheimhoudingsregime dat op de desbetreffende gegevens of inlichtingen van toepassing is, in acht wordt
      genomen.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste tot en met
      zesde lid.


