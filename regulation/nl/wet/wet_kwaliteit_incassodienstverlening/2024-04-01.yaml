  - number: '10'
    text: |-
      1 Onze Minister haalt een registratie door, indien:

      a. de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden hierom verzoekt;

      b. de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden is overleden;

      c. de gegevens of bescheiden die zijn verstrekt voor de inschrijving in het register of de wijziging van een
      registratie naar zijn oordeel zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing zou
      zijn genomen, als bij de beoordeling daarvan de juiste gegevens of bescheiden volledig bekend waren geweest.

      2 In het geval, bedoeld in het eerste lid, onderdeel a, is [Artikel 5, derde en vierde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel5
