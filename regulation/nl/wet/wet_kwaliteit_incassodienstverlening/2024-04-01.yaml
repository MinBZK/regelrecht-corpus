      1 Onze Minister kan aan de overtreder een bestuurlijke boete opleggen in geval van overtreding van:

      a. het bepaalde bij of krachtens [artikel 11][ref1], [12][ref2] of [13][ref3];

      b. [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref4].

      2 [Artikel 15, tweede lid][ref5], is van overeenkomstige toepassing.

      3 De bestuurlijke boete bedraagt:

      a. in geval van overtreding van [artikel 11][ref6], ten hoogste het bedrag dat is vastgesteld voor de eerste
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref7];

      b. in geval van overtreding van [artikel 12][ref8], ten hoogste het bedrag dat is vastgesteld voor de tweede
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref9];

      c. in geval van overtreding van het bepaalde krachtens artikel 13, ten hoogste het bedrag dat is vastgesteld voor
      de derde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref10];

      d. in geval van overtreding van [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref11],
      ten hoogste het bedrag dat is vastgesteld voor de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref12].

      4 De [artikelen 23, zevende lid, eerste zin, en achtste lid, van het Wetboek van Strafrecht][ref13] en
      [6, eerste lid, laatste zin, van de Wet op de economische delicten][ref14] zijn van overeenkomstige toepassing.

      5 De werking van het besluit tot oplegging van de boete wordt opgeschort totdat:

      a. de bezwaartermijn is verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist, in geval van een boete
      van de derde of vierde categorie;

      b. de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist, in geval van een boete
      van de vierde categorie.

      6 [Artikel 184 van het Wetboek van Strafrecht][ref15] is niet van toepassing op de overtreding, bedoeld in het
      eerste lid, onderdeel b.


