  - number: '7'
    text: |-
      1 Onze Minister weigert de inschrijving in het register, indien:

      a. gelet op de voornemens van de aanvrager en de antecedenten van de aanvrager en, voor zover van toepassing,
      de bestuurders, naar redelijke verwachting niet zal worden voldaan aan een bij of krachtens [artikel 11][ref1],
      [12][ref2] of [13][ref3] gestelde regel of overigens niet zal worden gehandeld in overeenstemming met hetgeen van
      een goede verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden in het maatschappelijk verkeer mag
      worden verwacht;

      b. de aanvrager of een bestuurder ingevolge een onherroepelijke rechterlijke uitspraak onder curatele is gesteld,
      in staat van faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van
      toepassing is verklaard, hij surseance van betaling heeft verkregen, dan wel wegens schulden is gegijzeld;

      c. de aanvrager, een bestuurder of een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden waarbij
      de aanvrager of een bestuurder van de aanvrager is betrokken, binnen de laatste vijf jaar, terug te rekenen vanaf
      de datum van de aanvraag tot inschrijving in het register, ingevolge een onherroepelijke rechterlijke uitspraak
      in staat van faillissement is verklaard of surseance van betaling heeft verkregen, tenzij naar oordeel van Onze
      Minister aannemelijk is gemaakt dat de aanvrager of bestuurder ter zake geen verwijt treft;

      d. de onderneming van de aanvrager of van een bestuurder ingevolge een onherroepelijke rechterlijke uitspraak geheel
      of gedeeltelijk is stilgelegd op grond van [artikel 7, onderdeel c, van de Wet op de economische delicten][ref4];

      e. de aanvrager of een bestuurder ingevolge een onherroepelijke rechterlijke uitspraak is
      ontzet van het recht om buitengerechtelijke incassowerkzaamheden te verrichten of aan te bieden
      op grond van [artikel 28, eerste lid, onderdeel 5°, van het Wetboek van Strafrecht][ref5] of
      [artikel 7, onderdeel a, van de Wet op de economische delicten][ref6];

      f. de registratie van de aanvrager of van een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden
      waarbij de aanvrager of een bestuurder van de aanvrager is betrokken, binnen de laatste vijf jaar, terug te
      rekenen vanaf de datum van de aanvraag tot inschrijving in het register, onherroepelijk is doorgehaald op grond
      van [artikel 10, onderdeel c][ref7], of [artikel 17][ref8], tenzij naar oordeel van Onze Minister aannemelijk is
      gemaakt dat de aanvrager of bestuurder ter zake geen verwijt treft.

      2 Het eerste lid, onderdeel a, is niet van toepassing, indien de aanvrager is ingeschreven in een register of aan
      de aanvrager een vergunning is afgegeven in een andere lidstaat van de Europese Unie dan wel een staat, niet zijnde
      een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat
      Nederland bindt, en die een beschermingsniveau biedt dat ten minste gelijkwaardig is aan het niveau dat met de bij
      en krachtens deze wet gestelde regels wordt nagestreefd.


