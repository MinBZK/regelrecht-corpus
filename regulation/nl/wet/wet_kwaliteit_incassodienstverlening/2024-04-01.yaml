preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om in verband met de kwaliteit van de
    incassodienstverlening ten behoeve van schuldenaren, schuldeisers en incassodienstverleners regels te stellen
    met betrekking tot de private buitengerechtelijke incassodienstverlening en om de cumulatieregeling voor
    buitengerechtelijke incassokosten in Boek 6 van het Burgerlijk Wetboek te wijzigen ter voorkoming van ongewenste
    stapeling van deze kosten;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *bestuurder:* de bestuurder van een
      verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden en degene die het beleid van een verrichter of
      aanbieder van buitengerechtelijke incassowerkzaamheden bepaalt of mede bepaalt;
        - *buitengerechtelijke incassowerkzaamheden:* activiteiten ter verkrijging van voldoening buiten rechte van een
      vordering tot betaling van een geldsom;
        - *Bureau Financieel Toezicht:* het Bureau, genoemd in
      [artikel 1, onderdeel l, van de Wet op het notarisambt][ref1];
        - *deken:* de deken, bedoeld in [artikel 45a, eerste lid, van de Advocatenwet][ref2];
        - *gerechtsdeurwaardersregister:* het gerechtsdeurwaardersregister, genoemd in
      [artikel 1, onderdeel b, van de Gerechtsdeurwaarderswet][ref3];
        - *handelsregister:* het handelsregister, genoemd in [artikel 1, onderdeel h, van de Handelsregisterwet 2007][ref4];
        - *Onze Minister:* Onze Minister voor Rechtsbescherming;
        - *register:* het register, genoemd in [artikel 3, eerste lid][ref5];
        - *tableau:* het tableau, genoemd in [artikel 1 van de Advocatenwet][ref6];
        - *verklaring omtrent het gedrag:* een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet justitiële en strafvorderlijke gegevens][ref7] of, voor zover van toepassing, een met deze verklaring
      overeenkomend document, afgegeven door het daartoe bevoegde gezag in de staat van herkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
      [ref3]: https://wetten.overheid.nl/BWBR0012197#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0021777#Artikel1
      [ref5]: https://wetten.overheid.nl/BWBR0046685#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0002093#Artikel1
      [ref7]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel1
