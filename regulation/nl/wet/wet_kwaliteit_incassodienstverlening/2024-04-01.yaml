  - number: '2'
    text: 'Deze wet heeft uitsluitend betrekking op buitengerechtelijke incassowerkzaamheden:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel2
  - number: 2.a
    text: |-
      die worden verricht of aangeboden in de uitoefening van een daarop gericht of mede gericht beroep of bedrijf of op
      een wijze alsof zij daarop beroepsmatig of bedrijfsmatig gericht of mede gericht was;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel2
  - number: 2.b
    text: voor een derde of na overdracht van de vordering; en
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel2
  - number: 2.c
    text: met betrekking tot voldoening door een natuurlijke persoon die zijn woonplaats in Nederland heeft.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel2
  - number: '3.1'
    text: |-
      Er is een register waarin op hun aanvraag verrichters en aanbieders van buitengerechtelijke incassowerkzaamheden
      worden ingeschreven, die voldoen aan de daarvoor bij en krachtens deze wet gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: '3.2'
    text: |-
      Het register bevat, voor zover van toepassing, de volgende gegevens over verrichters en aanbieders van
      buitengerechtelijke incassowerkzaamheden:
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: 3.2.a
    text: de datum van de registratie en een daarbij toegekend registratiekenmerk;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: 3.2.b
    text: de naam of namen waaronder buitengerechtelijke incassowerkzaamheden worden verricht of aangeboden;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: 3.2.c
    text: |-
      de naam en voornaam of voornamen van de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden, het
      adres waar hij kantoor houdt, een telefoonnummer waarop hij bereikbaar is en overige contactgegevens;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: 3.2.d
    text: de naam en voornaam of voornamen van de bestuurders;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: 3.2.e
    text: |-
      een wijziging als bedoeld in [artikel 8][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel8
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '8'
        hoofdstuk: '2'
  - number: 3.2.f
    text: |-
      een bestuurlijke sanctie als bedoeld in de [artikelen 15][ref1] en [16][ref2], met een aanduiding indien een
      besluit hiertoe nog niet onherroepelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel16
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '15'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '16'
        hoofdstuk: '3'
  - number: 3.2.g
    text: |-
      een schorsing en een opheffing van een schorsing als bedoeld in [artikel 9][ref1], met een aanduiding indien een
      besluit hiertoe nog niet onherroepelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel9
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '9'
        hoofdstuk: '2'
  - number: 3.2.h
    text: |-
      een doorhaling van een registratie als bedoeld in de [artikelen 10][ref1] en [17][ref2], met een aanduiding indien
      een besluit hiertoe nog niet onherroepelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel17
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '17'
        hoofdstuk: '3'
  - number: 3.2.i
    text: het vervallen van een registratie, bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: '3.3'
    text: |-
      Het register wordt gehouden door Onze Minister. Onze Minister is verwerkingsverantwoordelijke voor het register als
      bedoeld in artikel 4, onderdeel 7, van de Algemene verordening gegevensbescherming. Onze Minister kan een verwerker
      als bedoeld in artikel 4, onderdeel 8, van de Algemene verordening gegevensbescherming aanwijzen.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: '3.4'
    text: |-
      Ten behoeve van de kwaliteitsborging van de incassodienstverlening, verwerkt Onze Minister persoonsgegevens
      voor zover dat noodzakelijk is voor de uitvoering van zijn uit deze wet en de daarop berustende bepalingen
      voortvloeiende taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: '3.5'
    text: |-
      Onze Minister geeft, voor zover van toepassing, aan een ieder in ieder geval via een daartoe geschikte website
      kennis:
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: 3.5.a
    text: van een gegeven als bedoeld in het tweede lid, onderdeel a, b en c;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: 3.5.b
    text: |-
      gedurende een schorsing, van de mededeling dat en de datum waarop in het register is opgenomen dat een registratie
      is geschorst, met een aanduiding indien een besluit hiertoe nog niet onherroepelijk is;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: 3.5.c
    text: |-
      na een doorhaling krachtens een besluit dat nog niet onherroepelijk is, van de mededeling dat en de datum waarop
      in het register is opgenomen dat een registratie is doorgehaald, met de aanduiding dat een besluit hiertoe nog niet
      onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: '3.6'
    text: |-
      Een registratie vervalt, indien de kosten die krachtens [artikel 20, eerste lid, aanhef en onderdeel a][ref1], ten
      laste worden gebracht, niet of niet tijdig zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel20
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '20'
        hoofdstuk: '6'
  - number: '3.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste tot en met
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel3
  - number: '4.1'
    text: |-
      Het is verboden zonder registratie, of met een geschorste registratie, buitengerechtelijke incassowerkzaamheden te
      verrichten of aan te bieden.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel4
  - number: '4.2'
    text: 'Het eerste lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel4
  - number: 4.2.a
    text: |-
      een gerechtsdeurwaarder, waarnemend gerechtsdeurwaarder, kandidaat-gerechtsdeurwaarder en toegevoegd
      gerechtsdeurwaarder, die krachtens de [Gerechtsdeurwaarderswet][ref1] bevoegd is ambtshandelingen te verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0012197
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012197
  - number: 4.2.b
    text: |-
      een advocaat die krachtens de [Advocatenwet][ref1] is ingeschreven op het tableau en een advocaat als bedoeld in
      [artikel 16b van de Advocatenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002093
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002093
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 16b
  - number: '5.1'
    text: |-
      Bij de aanvraag tot de inschrijving in het register verstrekt degene die buitengerechtelijke incassowerkzaamheden
      wenst te verrichten of aan te bieden:
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel5
  - number: 5.1.a
    text: |-
      een uiteenzetting hoe ervoor wordt gezorgd dat zal worden voldaan aan de bij of krachtens de [artikelen 11][ref1],
      [12][ref2] en [13][ref3] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0046685#Artikel13
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0046685
        artikel: '13'
        hoofdstuk: '3'
  - number: 5.1.b
    text: |-
      gegevens over de gronden, bedoeld in [artikel 6, eerste lid, onderdelen a tot en met c][ref1], en
      [artikel 7, eerste lid, onderdelen b tot en met f][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel7
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '6'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '7'
        hoofdstuk: '2'
  - number: 5.1.c
    text: |-
      de naam of namen waaronder hij buitengerechtelijke incassowerkzaamheden wenst te verrichten of aan te bieden,
      indien en voor zover deze niet reeds volgen uit het handelsregister;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel5
  - number: 5.1.d
    text: |-
      het adres waar hij kantoor houdt, een telefoonnummer waarop hij bereikbaar is en overige contactgegevens, indien en
      voor zover deze niet reeds volgen uit het handelsregister;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel5
  - number: 5.1.e
    text: |-
      voor zover van toepassing, de naam en voornaam of voornamen van de bestuurders, indien en voor zover deze niet
      reeds volgen uit het handelsregister.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel5
  - number: '5.2'
    text: |-
      Met een uiteenzetting als bedoeld in het eerste lid, onderdeel a, wordt gelijkgesteld een inschrijving in een
      register of een vergunning die is afgegeven in een andere lidstaat van de Europese Unie dan wel een staat, niet
      zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag
      dat Nederland bindt, en die een beschermingsniveau biedt dat ten minste gelijkwaardig is aan het niveau dat met de
      bij en krachtens deze wet gestelde regels wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel5
  - number: '5.3'
    text: |-
      Onze Minister neemt binnen dertien weken een beslissing op de aanvraag. Met
      toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref1] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref2] niet van toepassing op de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0026759#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026759
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '5.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze van indiening van de
      aanvraag.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel5
  - number: '6.1'
    text: 'Onze Minister laat de aanvraag tot inschrijving in het register buiten behandeling, indien en voor zolang:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel6
  - number: 6.1.a
    text: |-
      een rechterlijke uitspraak waarbij de aanvrager, een bestuurder of een verrichter of aanbieder van
      buitengerechtelijke incassowerkzaamheden waarbij de aanvrager of een bestuurder van de aanvrager is betrokken,
      onder curatele is gesteld, in staat van faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, hij surseance van betaling heeft verkregen, dan wel wegens
      schulden is gegijzeld, niet onherroepelijk is;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel6
  - number: 6.1.b
    text: |-
      de registratie van de aanvrager of van een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden
      waarbij de aanvrager of een bestuurder van de aanvrager is betrokken, is geschorst;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel6
  - number: 6.1.c
    text: |-
      een krachtens [artikel 10, aanhef en onderdeel c][ref1], of [artikel 17][ref2] genomen besluit tot doorhaling van
      de registratie van de aanvrager of van een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden
      waarbij de aanvrager of een bestuurder van de aanvrager is betrokken, niet onherroepelijk is;


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel17
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '17'
        hoofdstuk: '3'
  - number: 6.1.d
    text: |-
      de kosten die krachtens [artikel 20, eerste lid, aanhef en onderdeel b][ref1], ten laste worden gebracht, niet
      zijn voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel20
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '20'
        hoofdstuk: '6'
  - number: '6.2'
    text: |-
      De termijn, genoemd in [artikel 5, derde lid][ref1], wordt in ieder geval opgeschort tot de dag waarop een in het
      eerste lid bedoelde omstandigheid zich niet langer voordoet en de aanvrager heeft verzocht de aanvraag verder in
      behandeling te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel5
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '5'
        hoofdstuk: '2'
  - number: '7.1'
    text: 'Onze Minister weigert de inschrijving in het register, indien:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel7
  - number: 7.1.a
    text: |-
      gelet op de voornemens van de aanvrager en de antecedenten van de aanvrager en, voor zover van toepassing, de
      bestuurders, naar redelijke verwachting niet zal worden voldaan aan een bij of krachtens [artikel 11][ref1],
      [12][ref2] of [13][ref3] gestelde regel of overigens niet zal worden gehandeld in overeenstemming met hetgeen van
      een goede verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden in het maatschappelijk verkeer mag
      worden verwacht;


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0046685#Artikel13
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0046685
        artikel: '13'
        hoofdstuk: '3'
  - number: 7.1.b
    text: |-
      de aanvrager of een bestuurder ingevolge een onherroepelijke rechterlijke uitspraak onder curatele is gesteld,
      in staat van faillissement is verklaard, ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van
      toepassing is verklaard, hij surseance van betaling heeft verkregen, dan wel wegens schulden is gegijzeld;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel7
  - number: 7.1.c
    text: |-
      de aanvrager, een bestuurder of een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden waarbij
      de aanvrager of een bestuurder van de aanvrager is betrokken, binnen de laatste vijf jaar, terug te rekenen vanaf
      de datum van de aanvraag tot inschrijving in het register, ingevolge een onherroepelijke rechterlijke uitspraak
      in staat van faillissement is verklaard of surseance van betaling heeft verkregen, tenzij naar oordeel van Onze
      Minister aannemelijk is gemaakt dat de aanvrager of bestuurder ter zake geen verwijt treft;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel7
  - number: 7.1.d
    text: |-
      de onderneming van de aanvrager of van een bestuurder ingevolge een onherroepelijke rechterlijke uitspraak geheel
      of gedeeltelijk is stilgelegd op grond van [artikel 7, onderdeel c, van de Wet op de economische delicten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel7
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '7'
  - number: 7.1.e
    text: |-
      de aanvrager of een bestuurder ingevolge een onherroepelijke rechterlijke uitspraak is ontzet
      van het recht om buitengerechtelijke incassowerkzaamheden te verrichten of aan te bieden op
      grond van [artikel 28, eerste lid, onderdeel 5°, van het Wetboek van Strafrecht][ref1] of
      [artikel 7, onderdeel a, van de Wet op de economische delicten][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel7
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '7'
  - number: 7.1.f
    text: |-
      de registratie van de aanvrager of van een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden
      waarbij de aanvrager of een bestuurder van de aanvrager is betrokken, binnen de laatste vijf jaar, terug te
      rekenen vanaf de datum van de aanvraag tot inschrijving in het register, onherroepelijk is doorgehaald op grond
      van [artikel 10, onderdeel c][ref1], of [artikel 17][ref2], tenzij naar oordeel van Onze Minister aannemelijk is
      gemaakt dat de aanvrager of bestuurder ter zake geen verwijt treft.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel17
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '17'
        hoofdstuk: '3'
  - number: '7.2'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing, indien de aanvrager is ingeschreven in een register of aan de
      aanvrager een vergunning is afgegeven in een andere lidstaat van de Europese Unie dan wel een staat, niet zijnde
      een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag dat
      Nederland bindt, en die een beschermingsniveau biedt dat ten minste gelijkwaardig is aan het niveau dat met de bij
      en krachtens deze wet gestelde regels wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister kan op aanvraag van de verrichter of aanvrager van buitengerechtelijke incassowerkzaamheden een
      registratie wijzigen:
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel8
  - number: 8.1.a
    text: |-
      ter toevoeging of verwijdering van een naam waaronder buitengerechtelijke incassowerkzaamheden worden verricht
      of aangeboden;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel8
  - number: 8.1.b
    text: |-
      met betrekking tot contactgegevens als bedoeld in [artikel 3, tweede lid, onderdeel c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel3
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '3'
        hoofdstuk: '2'
  - number: 8.1.c
    text: ter toevoeging of verwijdering van een bestuurder.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel8
  - number: '8.2'
    text: |-
      [Artikel 5][ref1] is van overeenkomstige toepassing. De
      [artikelen 6, eerste lid, aanhef en onderdelen a tot en met c, en tweede lid][ref2], en [7][ref3] zijn daarnaast
      van overeenkomstige toepassing, indien de aanvraag een registratie te wijzigen, een toevoeging betreft als bedoeld
      in het eerste lid, onderdeel a of c.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0046685#Artikel7
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0046685
        artikel: '7'
        hoofdstuk: '2'
  - number: '9.1'
    text: 'Onze Minister schorst een registratie, indien en voor zolang:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
  - number: 9.1.a
    text: |-
      aan een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden of een bestuurder de vrijheid is
      ontnomen krachtens:
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
  - number: 9.1.a.1°
    text: een rechterlijke uitspraak waarbij hij wegens een misdrijf is veroordeeld; of
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
  - number: 9.1.a.2°
    text: een bevel tot voorlopige hechtenis;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
  - number: 9.1.b
    text: |-
      de onderneming van de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden geheel of gedeeltelijk
      is stilgelegd op grond van [artikel 7, onderdeel c, van de Wet op de economische delicten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel7
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '7'
  - number: 9.1.c
    text: |-
      een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden of een bestuurder
      is ontzet van het recht om buitengerechtelijke incassowerkzaamheden te verrichten of aan
      te bieden op grond van [artikel 28, onderdeel 5°, van het Wetboek van Strafrecht][ref1] of
      [artikel 7, onderdeel a, van de Wet op de economische delicten][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel7
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '7'
  - number: 9.1.d
    text: |-
      een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden of een bestuurder bij rechterlijke
      uitspraak onder curatele staat, in staat van faillissement verkeert, ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is, hij in surseance van betaling verkeert, dan wel wegens schulden is
      gegijzeld.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
  - number: '9.2'
    text: |-
      De griffier van het gerecht dat een in het eerste lid bedoelde beslissing of een beslissing die de opheffing van de
      schorsing tot gevolg heeft, heeft uitgesproken, geeft hiervan onverwijld kennis aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
  - number: '9.3'
    text: 'Onze Minister kan een registratie schorsen, indien en voor zo lang:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
  - number: 9.3.a
    text: |-
      niet is voldaan aan een vordering als bedoeld in [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.3.b
    text: |-
      hij zijn voornemen kenbaar heeft gemaakt een registratie door te halen krachtens [artikel 10, onderdeel c][ref1],
      en dat voornemen niet is ingetrokken of heeft geleid tot een besluit;


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel10
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '10'
        hoofdstuk: '2'
  - number: 9.3.c
    text: |-
      hij zijn voornemen kenbaar heeft gemaakt een registratie door te halen krachtens [artikel 17][ref1] en dat
      voornemen niet is ingetrokken of heeft geleid tot een besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel17
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '17'
        hoofdstuk: '3'
  - number: '9.4'
    text: |-
      Onze Minister kan de schorsing van de registratie opheffen op aanvraag van de verrichter of aanbieder van
      buitengerechtelijke incassowerkzaamheden. [Artikel 5, derde en vierde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel5
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '5'
        hoofdstuk: '2'
  - number: '10.1'
    text: 'Onze Minister haalt een registratie door, indien:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel10
  - number: 10.1.a
    text: de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden hierom verzoekt;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel10
  - number: 10.1.b
    text: de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden is overleden;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel10
  - number: 10.1.c
    text: |-
      de gegevens of bescheiden die zijn verstrekt voor de inschrijving in het register of de wijziging van een
      registratie naar zijn oordeel zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing zou
      zijn genomen, als bij de beoordeling daarvan de juiste gegevens of bescheiden volledig bekend waren geweest.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel10
  - number: '10.2'
    text: |-
      In het geval, bedoeld in het eerste lid, onderdeel a, is [Artikel 5, derde en vierde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel5
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '5'
        hoofdstuk: '2'
  - number: '11.1'
    text: 'Buitengerechtelijke incassowerkzaamheden worden slechts verricht of aangeboden:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel11
  - number: 11.1.a
    text: onder een naam en met vermelding van het registratiekenmerk die staan vermeld in het register;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel11
  - number: 11.1.b
    text: |-
      onder een naam waarmee een persoon als bedoeld in [artikel 4, tweede lid][ref1], staat ingeschreven
      in het gerechtsdeurwaardersregister, onderscheidenlijk op het tableau of, voor zover het een advocaat
      als bedoeld in [artikel 16b van de Advocatenwet][ref2] betreft, met een vermelding als bedoeld in
      [artikel 16c van de Advocatenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel16c
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: 16b
      - id: ref3
        bwb_id: BWBR0002093
        artikel: 16c
  - number: '11.2'
    text: 'Buitengerechtelijke incassowerkzaamheden worden slechts verricht of aangeboden, indien:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel11
  - number: 11.2.a
    text: |-
      de contactgegevens die krachtens [artikel 3, tweede lid, aanhef en onderdeel c][ref1], zijn opgenomen in het
      register, in overeenstemming zijn met de feitelijke situatie;


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel3
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '3'
        hoofdstuk: '2'
  - number: 11.2.b
    text: |-
      de plaats van vestiging die is opgenomen in het gerechtsdeurwaardersregister, onderscheidenlijk de contactgegevens
      die zijn verwerkt op het tableau, in overeenstemming zijn met de feitelijke situatie.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel11
  - number: '11.3'
    text: |-
      Buitengerechtelijke incassowerkzaamheden worden niet verricht door de in het eerste lid bedoelde aanbieders of
      personen zonder dat dit aan schuldenaren wordt gemeld.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel11
  - number: '12.1'
    text: |-
      Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden stelt niemand te werk die zal worden
      belast met contact met een schuldenaar of schuldeiser of met de leiding hierover, dan nadat deze persoon een
      verklaring omtrent het gedrag over heeft gelegd die op het moment van de overlegging niet ouder dan drie maanden
      is.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel12
  - number: '12.2'
    text: |-
      Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden stelt geen bestuurder te werk wiens naam
      en voornaam of voornamen niet staan vermeld in het register.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel12
  - number: '13.1'
    text: |-
      Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden draagt er zorg voor dat de personen die
      zijn belast met het verrichten of aanbieden van buitengerechtelijke incassowerkzaamheden, of aan deze werkzaamheden
      leiding geven, voldoende vakbekwaam zijn en hun vakbekwaamheid periodiek onderhouden.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel13
  - number: '13.2'
    text: |-
      Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden draagt jegens de schuldenaar en
      schuldeiser zorg voor inzicht in de opbouw van de vordering tot betaling van een geldsom en specificeert
      daarbij zo goed mogelijk waar de vordering, of onderdelen daarvan, op gebaseerd is. Hij neemt hierbij alle voor
      buitengerechtelijke incassowerkzaamheden geldende wettelijke voorschriften in acht.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel13
  - number: '13.3'
    text: |-
      Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden draagt zorg voor een correcte omgang met
      schuldenaren en schuldeisers en zorgt daarbij voor een afdoende informatievoorziening jegens hen.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel13
  - number: '13.4'
    text: |-
      Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden draagt zorg voor een deugdelijke
      inrichting van deze werkzaamheden en de administratie daarvan.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel13
  - number: '13.5'
    text: |-
      Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden heeft een klachtenregeling en is
      aangesloten bij een geschillenregeling.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel13
  - number: '13.6'
    text: |-
      Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden legt schriftelijk vast op welke wijze hij
      voldoet aan de eisen genoemd in het eerste tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel13
  - number: '13.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de eisen
      genoemd in het eerste tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel13
  - number: '14.1'
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet gestelde regels zijn belast de bij besluit van
      Onze Minister aangewezen ambtenaren. Van dat besluit wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel14
  - number: '14.2'
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel14
  - number: 14.2.a
    text: |-
      zijn de personen, bedoeld in [artikel 30a van de Gerechtsdeurwaarderswet][ref1], belast met het toezicht
      op de naleving van de bij of krachtens deze wet gestelde regels, indien een persoon als bedoeld in
      [artikel 4, tweede lid, onderdeel a][ref2], van deze wet buitengerechtelijke incassowerkzaamheden verricht of
      aanbiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel4
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '4'
        hoofdstuk: '2'
  - number: 14.2.b
    text: |-
      is de deken belast met het toezicht op de naleving van de bij of krachtens deze wet gestelde regels, indien
      een persoon als bedoeld in [artikel 4, tweede lid, onderdeel b][ref1], buitengerechtelijke incassowerkzaamheden
      verricht of aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel4
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '4'
        hoofdstuk: '2'
  - number: '14.3'
    text: |-
      [Artikel 45a, tweede lid, van de Advocatenwet][ref1] is van overeenkomstige toepassing op het toezicht op de
      naleving door de deken, bedoeld in het tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel45a
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: 45a
  - number: '15.1'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder dwangsom ter handhaving van het bepaalde bij of krachtens
      [artikel 4][ref1], [11][ref2], [12][ref3] of [13][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0046685#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0046685#Artikel13
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0046685
        artikel: '12'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0046685
        artikel: '13'
        hoofdstuk: '3'
  - number: '15.2'
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel15
  - number: 15.2.a
    text: |-
      is het Bureau Financieel Toezicht bevoegd ten aanzien van een persoon als bedoeld in
      [artikel 4, tweede lid, onderdeel a][ref1], die buitengerechtelijke incassowerkzaamheden verricht of aanbiedt;


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel4
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '4'
        hoofdstuk: '2'
  - number: 15.2.b
    text: |-
      is de deken bevoegd ten aanzien van een persoon als bedoeld in artikel 4, tweede lid, onderdeel b, die
      buitengerechtelijke incassowerkzaamheden verricht of aanbiedt.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel15
  - number: '16.1'
    text: 'Onze Minister kan aan de overtreder een bestuurlijke boete opleggen in geval van overtreding van:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
  - number: 16.1.a
    text: |-
      het bepaalde bij of krachtens [artikel 11][ref1], [12][ref2] of [13][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0046685#Artikel13
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0046685
        artikel: '13'
        hoofdstuk: '3'
  - number: 16.1.b
    text: |-
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '16.2'
    text: |-
      [Artikel 15, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel15
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '15'
        hoofdstuk: '3'
  - number: '16.3'
    text: 'De bestuurlijke boete bedraagt:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
  - number: 16.3.a
    text: |-
      in geval van overtreding van [artikel 11][ref1], ten hoogste het bedrag dat is vastgesteld voor de eerste
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 16.3.b
    text: |-
      in geval van overtreding van [artikel 12][ref1], ten hoogste het bedrag dat is vastgesteld voor de tweede
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 16.3.c
    text: |-
      in geval van overtreding van het bepaalde krachtens artikel 13, ten hoogste het bedrag dat is vastgesteld voor de
      derde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 16.3.d
    text: |-
      in geval van overtreding van [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1],
      ten hoogste het bedrag dat is vastgesteld voor de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '16.4'
    text: |-
      De [artikelen 23, zevende lid, eerste zin, en achtste lid, van het Wetboek van Strafrecht][ref1] en
      [6, eerste lid, laatste zin, van de Wet op de economische delicten][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel6
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '6'
  - number: '16.5'
    text: 'De werking van het besluit tot oplegging van de boete wordt opgeschort totdat:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
  - number: 16.5.a
    text: |-
      de bezwaartermijn is verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist, in geval van een boete
      van de derde of vierde categorie;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
  - number: 16.5.b
    text: |-
      de beroepstermijn is verstreken of, indien beroep is ingesteld, op het beroep is beslist, in geval van een boete
      van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
  - number: '16.6'
    text: |-
      [Artikel 184 van het Wetboek van Strafrecht][ref1] is niet van toepassing op de overtreding, bedoeld in het eerste
      lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '17'
    text: 'Onze Minister haalt een registratie door, indien:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel17
  - number: 17.a
    text: |-
      de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden naar het oordeel van Onze Minister in
      ernstige mate niet voldoet aan de bij of krachtens [artikel 11][ref1], [12][ref2] of [13][ref3] gestelde regels;


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0046685#Artikel13
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '12'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0046685
        artikel: '13'
        hoofdstuk: '3'
  - number: 17.b
    text: |-
      zich bij het verrichten of aanbieden van buitengerechtelijke incassowerkzaamheden feiten hebben voorgedaan waardoor
      naar het oordeel van Onze Minister in ernstige mate niet is gehandeld in overeenstemming met hetgeen van een goede
      verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden in het maatschappelijk verkeer mag worden
      verwacht.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel17
  - number: '19.1'
    text: |-
      Indien een toezichthouder als bedoeld in [artikel 14][ref1] in de uitoefening van zijn bediening
      kennis krijgt van een gedraging die een overtreding is van het bepaalde bij of krachtens de
      [Wet handhaving consumentenbescherming][ref2] of de [Wet op het financieel toezicht][ref3], brengt hij dit
      onverwijld onder de aandacht van de Autoriteit Consument en Markt, onderscheidenlijk een krachtens besluit van de
      Stichting Autoriteit Financiële Markten met toezicht belaste persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0020586
      [ref3]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '14'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020586
      - id: ref3
        bwb_id: BWBR0020368
  - number: '19.2'
    text: |-
      Indien de Autoriteit Consument en Markt of een krachtens besluit van de Stichting Autoriteit Financiële Markten met
      toezicht belaste persoon in de uitoefening van zijn bediening kennis krijgt van een gedraging die een overtreding
      is van het bepaalde bij of krachtens deze wet, brengt hij dit onverwijld onder de aandacht van:
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
  - number: 19.2.a
    text: |-
      een ambtenaar als bedoeld in [artikel 14, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel14
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '14'
        hoofdstuk: '3'
  - number: 19.2.b
    text: |-
      een persoon als bedoeld in [artikel 30a van de Gerechtsdeurwaarderswet][ref1], indien de overtreding is begaan door
      een persoon als bedoeld in [artikel 4, tweede lid, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0012197#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel4
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0012197
        artikel: 30a
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '4'
        hoofdstuk: '2'
  - number: 19.2.c
    text: |-
      de deken, indien de overtreding is begaan door een persoon als bedoeld in
      [artikel 4, tweede lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel4
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '4'
        hoofdstuk: '2'
  - number: '19.3'
    text: |-
      Onze Minister, het Bureau Financieel Toezicht, de deken, de Autoriteit Consument en Markt en de Stichting
      Autoriteit Financiële Markten maken afspraken die worden vastgelegd in een samenwerkingsprotocol en die in ieder
      geval betrekking hebben op effectief en doelmatig toezicht op de naleving door verrichters en aanbieders van
      buitengerechtelijke incassowerkzaamheden van de bij of krachtens de onderscheiden wetten gestelde regels en de
      effectieve en doelmatige handhaving daarvan.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
  - number: '19.4'
    text: Onze Minister doet mededeling van een samenwerkingsprotocol in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
  - number: '19.5'
    text: |-
      Er kunnen ten behoeve van een goede vervulling van hun bij of krachtens de wet gegeven taak wederzijds gegevens
      of inlichtingen worden verstrekt, die ten aanzien van een verrichter of aanbieder van buitengerechtelijke
      incassowerkzaamheden zijn verkregen:
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
  - number: 19.5.a
    text: |-
      bij de uitvoering van een bij of krachtens deze wet gegeven taak, door een toezichthouder als bedoeld in
      [artikel 14][ref1] of door Onze Minister;


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel14
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '14'
        hoofdstuk: '3'
  - number: 19.5.b
    text: |-
      bij de uitvoering van een bij of krachtens de [Wet handhaving consumentenbescherming][ref1] gegeven taak, door
      de Autoriteit Consument en Markt, de Stichting Autoriteit Financiële Markten of een krachtens haar besluit met
      toezicht belaste persoon;


      [ref1]: https://wetten.overheid.nl/BWBR0020586
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020586
  - number: 19.5.c
    text: |-
      bij de uitvoering van een bij of krachtens de [Wet op het financieel toezicht][ref1] gegeven taak, door de
      Stichting Autoriteit Financiële Markten of een krachtens haar besluit met toezicht belaste persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '19.6'
    text: 'Verstrekking van gegevens of inlichtingen vindt uitsluitend plaats, indien:'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
  - number: 19.6.a
    text: de geheimhouding van de gegevens of inlichtingen in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
  - number: 19.6.b
    text: |-
      voldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt; en
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
  - number: 19.6.c
    text: |-
      het geheimhoudingsregime dat op de desbetreffende gegevens of inlichtingen van toepassing is, in acht wordt
      genomen.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
  - number: '19.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste tot en met
      zesde lid.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel19
  - number: '20.1'
    text: |-
      De kosten die samenhangen met de uitvoering van deze wet, worden door Onze Minister tegen een door hem vastgesteld
      tarief ten laste gebracht van:
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel20
  - number: 20.1.a
    text: |-
      de in het register ingeschreven verrichters en aanbieders van buitengerechtelijke incassowerkzaamheden, voor
      zover het de uitvoering betreft van de [artikelen 3][ref1], [8 tot en met 10][ref2], [14, eerste lid][ref3],
      [15, eerste lid][ref4], [16, eerste lid][ref5], [17][ref6] en [19][ref7];


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0046685#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0046685#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0046685#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0046685#Artikel17
      [ref7]: https://wetten.overheid.nl/BWBR0046685#Artikel19
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '8'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0046685
        artikel: '14'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0046685
        artikel: '15'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0046685
        artikel: '16'
        hoofdstuk: '3'
      - id: ref6
        bwb_id: BWBR0046685
        artikel: '17'
        hoofdstuk: '3'
      - id: ref7
        bwb_id: BWBR0046685
        artikel: '19'
        hoofdstuk: '5'
  - number: 20.1.b
    text: |-
      de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden die de aanvraag doet, voor zover het de
      uitvoering betreft van de [artikelen 5 tot en met 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel5
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '5'
        hoofdstuk: '2'
  - number: '20.2'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de hoogte van het tarief en de heffing.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel20
  - number: '28.1'
    text: |-
      De [artikelen 4][ref1], [11, eerste lid, aanhef en onderdeel a, en tweede lid, aanhef en onderdeel a][ref2], en
      [12, tweede lid][ref3], zijn gedurende een jaar na inwerkingtreding van deze wet niet van toepassing op degene
      die voor het tijdstip van inwerkingtreding van deze wet buitengerechtelijke incassowerkzaamheden verrichtte
      of aanbood en sindsdien onafgebroken heeft voortgezet. Indien binnen deze periode een aanvraag als bedoeld in
      [artikel 5][ref4] is gedaan, geldt de vorige zin tot het tijdstip waarop op de aanvraag is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0046685#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0046685#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0046685#Artikel5
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0046685
        artikel: '11'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0046685
        artikel: '12'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0046685
        artikel: '5'
        hoofdstuk: '2'
  - number: '28.2'
    text: |-
      Indien gedurende de periode, genoemd in het eerste lid, eerste zin, een beslissing op een aanvraag als bedoeld in
      [artikel 5][ref1] niet binnen de termijn, genoemd in artikel 5, derde lid, eerste zin, kan worden gegeven, deelt
      Onze Minister dit binnen deze termijn aan de aanvrager mede en noemt Onze Minister een termijn van ten hoogste
      dertien weken waarbinnen Onze Minister beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel5
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0046685
        artikel: '5'
        hoofdstuk: '2'
  - number: '29'
    text: |-
      Onze Minister voor Rechtsbescherming zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel29
  - number: '30'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel30
  - number: '31'
    text: 'Deze wet wordt aangehaald als: Wet kwaliteit incassodienstverlening.'
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel31
