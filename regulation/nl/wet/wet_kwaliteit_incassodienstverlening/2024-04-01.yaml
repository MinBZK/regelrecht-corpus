  - number: '11'
    text: |-
      1 Buitengerechtelijke incassowerkzaamheden worden slechts verricht of aangeboden:

      a. onder een naam en met vermelding van het registratiekenmerk die staan vermeld in het register;

      b. onder een naam waarmee een persoon als bedoeld in [artikel 4, tweede lid][ref1], staat ingeschreven
      in het gerechtsdeurwaardersregister, onderscheidenlijk op het tableau of, voor zover het een advocaat
      als bedoeld in [artikel 16b van de Advocatenwet][ref2] betreft, met een vermelding als bedoeld in
      [artikel 16c van de Advocatenwet][ref3].

      2 Buitengerechtelijke incassowerkzaamheden worden slechts verricht of aangeboden, indien:

      a. de contactgegevens die krachtens [artikel 3, tweede lid, aanhef en onderdeel c][ref4], zijn opgenomen in het
      register, in overeenstemming zijn met de feitelijke situatie;

      b. de plaats van vestiging die is opgenomen in het gerechtsdeurwaardersregister, onderscheidenlijk de
      contactgegevens die zijn verwerkt op het tableau, in overeenstemming zijn met de feitelijke situatie.

      3 Buitengerechtelijke incassowerkzaamheden worden niet verricht door de in het eerste lid bedoelde aanbieders of
      personen zonder dat dit aan schuldenaren wordt gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel16c
