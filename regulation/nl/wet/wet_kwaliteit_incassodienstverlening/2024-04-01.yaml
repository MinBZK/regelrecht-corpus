  - number: '28'
    text: |-
      1 De [artikelen 4][ref1], [11, eerste lid, aanhef en onderdeel a, en tweede lid, aanhef en onderdeel a][ref2],
      en [12, tweede lid][ref3], zijn gedurende een jaar na inwerkingtreding van deze wet niet van toepassing op degene
      die voor het tijdstip van inwerkingtreding van deze wet buitengerechtelijke incassowerkzaamheden verrichtte
      of aanbood en sindsdien onafgebroken heeft voortgezet. Indien binnen deze periode een aanvraag als bedoeld in
      [artikel 5][ref4] is gedaan, geldt de vorige zin tot het tijdstip waarop op de aanvraag is beslist.

      2 Indien gedurende de periode, genoemd in het eerste lid, eerste zin, een beslissing op een aanvraag als bedoeld
      in [artikel 5][ref5] niet binnen de termijn, genoemd in artikel 5, derde lid, eerste zin, kan worden gegeven, deelt
      Onze Minister dit binnen deze termijn aan de aanvrager mede en noemt Onze Minister een termijn van ten hoogste
      dertien weken waarbinnen Onze Minister beslist.


