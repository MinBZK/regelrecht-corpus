  - number: '4'
    text: |-
      1 Het is verboden zonder registratie, of met een geschorste registratie, buitengerechtelijke incassowerkzaamheden
      te verrichten of aan te bieden.

      2 Het eerste lid geldt niet voor:

      a. een gerechtsdeurwaarder, waarnemend gerechtsdeurwaarder, kandidaat-gerechtsdeurwaarder en toegevoegd
      gerechtsdeurwaarder, die krachtens de [Gerechtsdeurwaarderswet][ref1] bevoegd is ambtshandelingen te verrichten;

      b. een advocaat die krachtens de [Advocatenwet][ref2] is ingeschreven op het tableau en een advocaat als bedoeld in
      [artikel 16b van de Advocatenwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012197
      [ref2]: https://wetten.overheid.nl/BWBR0002093
      [ref3]: https://wetten.overheid.nl/BWBR0002093#Artikel16b
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel4
