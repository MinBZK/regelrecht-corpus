  - number: '29'
    text: |-
      Onze Minister voor Rechtsbescherming zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-
      Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel29
  - number: '30'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel30
  - number: '31'
    text: 'Deze wet wordt aangehaald als: Wet kwaliteit incassodienstverlening.'
