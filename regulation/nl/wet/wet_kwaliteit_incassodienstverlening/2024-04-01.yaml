  - number: '20'
    text: |-
      1 De kosten die samenhangen met de uitvoering van deze wet, worden door Onze Minister tegen een door hem
      vastgesteld tarief ten laste gebracht van:

      a. de in het register ingeschreven verrichters en aanbieders van buitengerechtelijke incassowerkzaamheden, voor
      zover het de uitvoering betreft van de [artikelen 3][ref1], [8 tot en met 10][ref2], [14, eerste lid][ref3],
      [15, eerste lid][ref4], [16, eerste lid][ref5], [17][ref6] en [19][ref7];

      b. de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden die de aanvraag doet, voor zover het de
      uitvoering betreft van de [artikelen 5 tot en met 7][ref8].

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de hoogte van het tarief en de
      heffing.


