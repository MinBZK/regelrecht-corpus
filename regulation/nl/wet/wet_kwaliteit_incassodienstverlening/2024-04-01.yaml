  - number: '5'
    text: |-
      1 Bij de aanvraag tot de inschrijving in het register verstrekt degene die buitengerechtelijke incassowerkzaamheden
      wenst te verrichten of aan te bieden:

      a. een uiteenzetting hoe ervoor wordt gezorgd dat zal worden voldaan aan de bij of krachtens de
      [artikelen 11][ref1], [12][ref2] en [13][ref3] gestelde regels;

      b. gegevens over de gronden, bedoeld in [artikel 6, eerste lid, onderdelen a tot en met c][ref4], en
      [artikel 7, eerste lid, onderdelen b tot en met f][ref5];

      c. de naam of namen waaronder hij buitengerechtelijke incassowerkzaamheden wenst te verrichten of aan te bieden,
      indien en voor zover deze niet reeds volgen uit het handelsregister;

      d. het adres waar hij kantoor houdt, een telefoonnummer waarop hij bereikbaar is en overige contactgegevens, indien
      en voor zover deze niet reeds volgen uit het handelsregister;

      e. voor zover van toepassing, de naam en voornaam of voornamen van de bestuurders, indien en voor zover deze niet
      reeds volgen uit het handelsregister.

      2 Met een uiteenzetting als bedoeld in het eerste lid, onderdeel a, wordt gelijkgesteld een inschrijving in een
      register of een vergunning die is afgegeven in een andere lidstaat van de Europese Unie dan wel een staat, niet
      zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe strekkend verdrag
      dat Nederland bindt, en die een beschermingsniveau biedt dat ten minste gelijkwaardig is aan het niveau dat met de
      bij en krachtens deze wet gestelde regels wordt nagestreefd.

      3 Onze Minister neemt binnen dertien weken een beslissing op de aanvraag. Met
      toepassing van [artikel 28, eerste lid, laatste zinsnede, van de Dienstenwet][ref6] is
      [paragraaf 4.1.3.3. van de Algemene wet bestuursrecht][ref7] niet van toepassing op de aanvraag.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze van indiening van
      de aanvraag.


