  - number: '9'
    text: |-
      1 Onze Minister schorst een registratie, indien en voor zolang:

      a. aan een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden of een bestuurder de vrijheid is
      ontnomen krachtens:

      1°. een rechterlijke uitspraak waarbij hij wegens een misdrijf is veroordeeld; of

      2°. een bevel tot voorlopige hechtenis;

      b. de onderneming van de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden geheel of
      gedeeltelijk is stilgelegd op grond van [artikel 7, onderdeel c, van de Wet op de economische delicten][ref1];

      c. een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden of een bestuurder
      is ontzet van het recht om buitengerechtelijke incassowerkzaamheden te verrichten of aan
      te bieden op grond van [artikel 28, onderdeel 5°, van het Wetboek van Strafrecht][ref2] of
      [artikel 7, onderdeel a, van de Wet op de economische delicten][ref3];

      d. een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden of een bestuurder bij rechterlijke
      uitspraak onder curatele staat, in staat van faillissement verkeert, ten aanzien van hem de schuldsaneringsregeling
      natuurlijke personen van toepassing is, hij in surseance van betaling verkeert, dan wel wegens schulden is
      gegijzeld.

      2 De griffier van het gerecht dat een in het eerste lid bedoelde beslissing of een beslissing die de opheffing van
      de schorsing tot gevolg heeft, heeft uitgesproken, geeft hiervan onverwijld kennis aan Onze Minister.

      3 Onze Minister kan een registratie schorsen, indien en voor zo lang:

      a. niet is voldaan aan een vordering als bedoeld in
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref4];

      b. hij zijn voornemen kenbaar heeft gemaakt een registratie door te halen krachtens
      [artikel 10, onderdeel c][ref5], en dat voornemen niet is ingetrokken of heeft geleid tot een besluit;

      c. hij zijn voornemen kenbaar heeft gemaakt een registratie door te halen krachtens [artikel 17][ref6] en dat
      voornemen niet is ingetrokken of heeft geleid tot een besluit.

      4 Onze Minister kan de schorsing van de registratie opheffen op aanvraag van de verrichter of aanbieder van
      buitengerechtelijke incassowerkzaamheden. [Artikel 5, derde en vierde lid][ref7], is van overeenkomstige
      toepassing.


