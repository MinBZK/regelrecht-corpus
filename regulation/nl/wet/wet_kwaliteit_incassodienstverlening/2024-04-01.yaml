  - number: '8'
    text: |-
      1 Onze Minister kan op aanvraag van de verrichter of aanvrager van buitengerechtelijke incassowerkzaamheden een
      registratie wijzigen:

      a. ter toevoeging of verwijdering van een naam waaronder buitengerechtelijke incassowerkzaamheden worden verricht
      of aangeboden;

      b. met betrekking tot contactgegevens als bedoeld in [artikel 3, tweede lid, onderdeel c][ref1];

      c. ter toevoeging of verwijdering van een bestuurder.

      2 [Artikel 5][ref2] is van overeenkomstige toepassing. De
      [artikelen 6, eerste lid, aanhef en onderdelen a tot en met c, en tweede lid][ref3], en [7][ref4] zijn daarnaast
      van overeenkomstige toepassing, indien de aanvraag een registratie te wijzigen, een toevoeging betreft als bedoeld
      in het eerste lid, onderdeel a of c.


      [ref1]: https://wetten.overheid.nl/BWBR0046685#Artikel3
