  - number: '17'
    text: |-
      Onze Minister haalt een registratie door, indien:

      a. de verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden naar het oordeel van Onze Minister in
      ernstige mate niet voldoet aan de bij of krachtens [artikel 11][ref1], [12][ref2] of [13][ref3] gestelde regels;

      b. zich bij het verrichten of aanbieden van buitengerechtelijke incassowerkzaamheden feiten hebben voorgedaan
      waardoor naar het oordeel van Onze Minister in ernstige mate niet is gehandeld in overeenstemming met hetgeen van
      een goede verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden in het maatschappelijk verkeer mag
      worden verwacht.


