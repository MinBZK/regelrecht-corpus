  - number: '12'
    text: |-
      1 Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden stelt niemand te werk die zal worden
      belast met contact met een schuldenaar of schuldeiser of met de leiding hierover, dan nadat deze persoon een
      verklaring omtrent het gedrag over heeft gelegd die op het moment van de overlegging niet ouder dan drie maanden
      is.

      2 Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden stelt geen bestuurder te werk wiens naam
      en voornaam of voornamen niet staan vermeld in het register.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel12
  - number: '13'
    text: |-
      1 Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden draagt er zorg voor dat de personen die
      zijn belast met het verrichten of aanbieden van buitengerechtelijke incassowerkzaamheden, of aan deze werkzaamheden
      leiding geven, voldoende vakbekwaam zijn en hun vakbekwaamheid periodiek onderhouden.

      2 Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden draagt jegens de schuldenaar en
      schuldeiser zorg voor inzicht in de opbouw van de vordering tot betaling van een geldsom en specificeert
      daarbij zo goed mogelijk waar de vordering, of onderdelen daarvan, op gebaseerd is. Hij neemt hierbij alle voor
      buitengerechtelijke incassowerkzaamheden geldende wettelijke voorschriften in acht.

      3 Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden draagt zorg voor een correcte omgang met
      schuldenaren en schuldeisers en zorgt daarbij voor een afdoende informatievoorziening jegens hen.

      4 Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden draagt zorg voor een deugdelijke
      inrichting van deze werkzaamheden en de administratie daarvan.

      5 Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden heeft een klachtenregeling en is
      aangesloten bij een geschillenregeling.

      6 Een verrichter of aanbieder van buitengerechtelijke incassowerkzaamheden legt schriftelijk vast op welke wijze
      hij voldoet aan de eisen genoemd in het eerste tot en met vijfde lid.

      7 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de eisen
      genoemd in het eerste tot en met vijfde lid.
    url: https://wetten.overheid.nl/BWBR0046685/2024-04-01#Artikel13
  - number: '14'
    text: |-
      1 Met het toezicht op de naleving van de bij of krachtens deze wet gestelde regels zijn belast de bij besluit van
      Onze Minister aangewezen ambtenaren. Van dat besluit wordt mededeling gedaan door plaatsing in de Staatscourant.

      2 In afwijking van het eerste lid:

      a. zijn de personen, bedoeld in [artikel 30a van de Gerechtsdeurwaarderswet][ref1], belast met het
      toezicht op de naleving van de bij of krachtens deze wet gestelde regels, indien een persoon als bedoeld in
      [artikel 4, tweede lid, onderdeel a][ref2], van deze wet buitengerechtelijke incassowerkzaamheden verricht of
      aanbiedt;

      b. is de deken belast met het toezicht op de naleving van de bij of krachtens deze wet gestelde regels, indien
      een persoon als bedoeld in [artikel 4, tweede lid, onderdeel b][ref3], buitengerechtelijke incassowerkzaamheden
      verricht of aanbiedt.

      3 [Artikel 45a, tweede lid, van de Advocatenwet][ref4] is van overeenkomstige toepassing op het toezicht op de
      naleving door de deken, bedoeld in het tweede lid, onderdeel b.


