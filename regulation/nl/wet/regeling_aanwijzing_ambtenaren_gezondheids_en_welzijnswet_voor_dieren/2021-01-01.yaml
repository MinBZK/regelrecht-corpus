  - number: '2'
    text: |-
      Als ambtenaren als bedoeld in [artikel 114, derde lid, van de Gezondheids- en welzijnswet voor dieren][ref1],
      belast met de opsporing van feiten strafbaar gesteld bij [artikel 121 van die wet][ref2], worden aangewezen de in
      [artikel 1, onderdeel a][ref3], bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel121
