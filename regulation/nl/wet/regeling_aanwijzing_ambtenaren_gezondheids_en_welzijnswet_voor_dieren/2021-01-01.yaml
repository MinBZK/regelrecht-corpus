  - number: 1.l
    text: |-
      ambtenaren van de gemeente Horst aan de Maas, van de gemeente Venray en van het waterschap Peel en Maasvallei, voor
      zover het betreft het grondgebied van de gemeenten Horst aan de Maas en Venray.
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1
  - number: 1a
    text: |-
      Als ambtenaren als bedoeld in [artikel 114, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1],
      belast met het onderzoek naar de aanwezigheid van besmettelijke dierziekten, worden aangewezen de in
      [artikel 1, onderdeel a][ref2], bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0005835#Artikel1
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1a
