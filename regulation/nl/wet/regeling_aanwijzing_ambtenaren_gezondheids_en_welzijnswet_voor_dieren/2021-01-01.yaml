    Gelet op artikel 114 van de Gezondheids- en welzijnswet voor dieren (Stb. 1992, 585);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als ambtenaren als bedoeld in [artikel 114, eerste lid, van de Gezondheids- en welzijnswet voor dieren][ref1],
      belast met het toezicht op de naleving van die wet en de daarop berustende bepalingen worden aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel114
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '114'
  - number: 1.a
    text: de ambtenaren van de Nederlandse Voedsel- en Warenautoriteit;
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1
  - number: 1.b
    text: de ambtenaren van de Dienst Regelingen;
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1
  - number: 1.c
    text: |-
      dierenartsen en andere personen die voor specifieke toezichtswerkzaamheden door de Minister van Landbouw, Natuur en
      Voedselkwaliteit worden ingezet;
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1
  - number: 1.e
    text: |-
      de ambtenaren van politie, bedoeld in [artikel 2, onderdeel a, van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 1.f
    text: militairen van de Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1
  - number: 1.g
    text: de door de Minister van Defensie aangewezen overige militairen van de krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1
  - number: 1.h
    text: |-
      de personen werkzaam als radarwaarnemer of verkeersassistent binnen het team verkeershandhaving van een regionale
      eenheid van de politie;
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1
  - number: 1.i
    text: ambtenaren van de rijksbelastingdienst, bevoegd inzake de douane;
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1
  - number: 1.j
    text: ambtenaren van de Inspectie Leefomgeving en Transport;
    url: https://wetten.overheid.nl/BWBR0005835/2021-01-01#Artikel1
  - number: 1.k
    text: |-
      ten hoogste vier daartoe door het College van Burgemeester en Wethouders van de gemeente Capelle aan den
      IJssel aangewezen ambtenaren van die gemeente, voor zover het betreft het toezicht op de naleving van de
      [artikelen 36][ref1] en [37 van de Gezondheids- en welzijnswet voor dieren][ref2], met uitzondering van de
      bevoegdheid, bedoeld in [artikel 115, tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref3], voor een
      periode tot 15 februari 2016;


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0005662#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0005662#Artikel115
