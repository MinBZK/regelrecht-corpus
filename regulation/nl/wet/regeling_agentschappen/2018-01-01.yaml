articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *agentschap:* een baten-lastenagentschap of een verplichtingen-kasagentschap op basis van
      [artikel 2.20, eerste lid, van de Comptabiliteitswet 2016][ref1];
        - *centrale kas:* de kas die door het Agentschap van de Generale Thesaurie van het Ministerie van Financiën wordt
      beheerd;
        - *doelmatigheid:* verhouding tussen de ingezette middelen en de geleverde prestaties (in kwaliteit en kwantiteit);
        - *eigenaar:* de binnen het betrokken ministerie aangewezen verantwoordelijke voor het toezicht op het beleid van
      de opdrachtnemer en op de algemene gang van zaken in het agentschap;
        - *initiële lening:* lening die wordt afgesloten ten behoeve van de financiering van over te nemen vaste activa van
      een ministerie;
        - *jaarrekening van een verplichtingen-kasagentschap:* verantwoordingsstaat en saldibalans per 31 december met
      inbegrip van de toelichting daarop;
        - *jaarrekening van een baten-lastenagentschap:* balans, staat van baten en lasten en
      kasstroomoverzicht per 31 december met inbegrip van de toelichtingen daarop, als bedoeld in
      [artikel 361, eerste lid van Titel 9 van Boek 2 van het Burgerlijk Wetboek (BW)][ref2];
        - *kasreserve:* een reserve op basis van [artikel 2.20, achtste lid, van de Comptabiliteitswet 2016][ref3], die
      door een verplichtingen-kasagentschap wordt aangehouden om jaarlijkse fluctuaties in de exploitatie op te vangen;
        - *lening:* geldbedrag dat tegen een rentevergoeding gedurende een bepaalde looptijd beschikbaar wordt gesteld aan
      een baten-lastenagentschap vanuit de kas van de schatkist van het Rijk op een leningrekening;
        - *Minister:* de Minister die het aangaat;
        - *opdrachtgever:* degene die het agentschap opdracht geeft tot het leveren van producten of diensten en daarvoor
      een bijdrage toekent en betaalt;
        - *opdrachtnemer:* de eindverantwoordelijke binnen het agentschap;
        - *Rijkshoofdboekhouding:* dienstonderdeel van het Ministerie van Financiën dat belast is met de bankierstaken voor
      de agentschappen ten behoeve van de centrale kas van de schatkist van het Rijk;
        - *termijndeposito:* geldbedrag dat door een agentschap tegen een rentevergoeding gedurende een bepaalde looptijd
      in de centrale kas van de schatkist van het Rijk aanhoudt op een depositorekening.

      2 De begrippen van [artikel 1.1 van de Comptabiliteitswet 2016][ref4] zijn van overeenkomstige toepassing op deze
      regeling.


