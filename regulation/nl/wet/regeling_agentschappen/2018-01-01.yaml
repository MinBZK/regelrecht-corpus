  - number: '28'
    text: |-
      1 Ter dekking van een financieringsbehoefte voor een investering in vaste activa kan een baten-lastenagentschap
      beschikken over een leenfaciliteit bij het Ministerie van Financiën.

      2 De looptijd van iedere lening wordt gekoppeld aan de economische levensduur van de onderliggende vaste activa.

      3 De Minister van Financiën bepaalt de van toepassing zijnde rentepercentages voor leningen. [Artikel 4, derde lid
      van de Regeling schatkistbankieren RWT’s en andere rechtspersonen](onbekend) is van overeenkomstige toepassing, met
      uitzondering van de variabele rentevaste periode.

      4 De leenfaciliteit is begrensd door middel van leenplafonds die het Ministerie van Financiën per baten-
      lastenagentschap en per looptijd op aanvraag toekent. Het baten-lastenagentschap overschrijdt de toegekende
      leenplafonds niet.

      5 De Minister van Financiën bepaalt de procedure voor het aanvragen en toekennen van een leenplafond.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel28
  - number: '29'
    text: |-
      1 Bij het aangaan van een lening opent de Minister van Financiën op naam van het baten-lastenagentschap in de
      centrale administratie van de schatkist van het Rijk een leningrekening.

      2 Door middel van overboeking naar de rekening-courant bij de schatkist van het Rijk kan een baten-lastenagentschap
      beschikken over de gelden op een leningrekening. De overboeking vindt plaats op de overeengekomen opnamedatum.

      3 De in het tweede lid genoemde data liggen niet in het verleden. De datum van de initiële lening is de enige
      uitzondering hierop.

      4 De Rijkshoofdboekhouding int zelfstandig een in rekening te brengen afsluitprovisie op de ingangsdatum van de
      betrokken lening ten laste van de rekening-courant van het baten-lastenagentschap.

      5 De Rijkshoofdboekhouding int zelfstandig de jaarlijkse aflossing van de lening op de overeengekomen
      aflossingsdatum ten laste van de rekening-courant en boekt deze af van de leningrekening van het baten-
      lastenagentschap.

      6 De Rijkshoofdboekhouding int jaarlijks zelfstandig de over een lening verschuldigde rente ten laste van de
      rekening-courant van het baten-lastenagentschap. De rente is verschuldigd vanaf de opnamedatum.

      7 Het geheel of gedeeltelijk vervroegd aflossen van de lening geschiedt door een tijdig verzoek aan de
      Rijkshoofdboekhouding.

      8 Bij vervroegd aflossen is het baten-lastenagentschap een boete verschuldigd. De Rijkshoofdboekhouding int de
      boete zelfstandig ten laste van de rekening-courant van het baten-lastenagentschap.

      9 In afwijking van het achtste lid is vervroegd aflossen boetevrij toegestaan bij verkoop of bij verlies door
      brand, diefstal of vernietiging van de vaste activa waarvoor de lening was afgesloten, en bij het overeenkomstig
      de verslaggevingvoorschriften van [artikelen 26][ref1] en [27][ref2] afwaarderen van de vaste activa waarvoor de
      lening was afgesloten.

      10 De Rijkshoofdboekhouding int het bedrag van de vervroegde aflossing zelfstandig ten laste van de rekening-
      courant en boekt dit af op de leningrekening van het baten-lastenagentschap.

      11 De Minister van Financiën bepaalt de van toepassing zijnde afsluitprovisies en boetes bij vervroegd aflossen en
      kan tevens minimumbedragen vaststellen voor leningen.


      [ref1]: https://wetten.overheid.nl/BWBR0040286#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0040286#Artikel27
