  - number: '30'
    text: |-
      De directie Financieel-economische Zaken van het betrokken ministerie oefent toezicht uit op een agentschap
      overeenkomstig het bepaalde in artikel 4, eerste lid, onder b, van het Besluit FEZ bij het Rijk.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel30
  - number: '31'
    text: |-
      De Minister van Financiën oefent toezicht uit op de inrichting van de agentschappen en de uitvoering van de
      begrotingen.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel31
  - number: '32'
    text: |-
      1 Voor de baten-lastenagenatschappen die voor 1 januari 2013 zijn opgericht wordt per geval beoordeeld of een
      overgangsregime van toepassing kan worden verklaard

      2 Wanneer een agentschap dat vóór de inwerkingtreding van deze regeling reeds is ingesteld overgaat van baten-
      lastenagentschap naar verplichtingen-kasagentschap geldt dat – in afwijking van [artikel 22, eerste lid][ref1] –
      de kasreserve een maximumomvang krijgt van 5% van de gemiddelde jaarontvangsten berekend over de laatste drie jaar.
      Deze overgangsbepaling geldt alsdan voor een periode van drie jaar waarna artikel 22, eerste lid van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0040286#Artikel22
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0040286
        artikel: '22'
        paragraaf: '6'
  - number: '33'
    text: |-
      In bijzondere gevallen kan met voorafgaande schriftelijke instemming van de Minister van Financiën worden afgeweken
      van deze regeling, door middel van een gemotiveerd verzoek van de Minister.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel33
  - number: '34'
    text: Deze regeling treedt in werking met ingang van 1 januari 2018.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel34
  - number: '35'
    text: 'Deze regeling wordt aangehaald als: Regeling agentschappen.'
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel35
