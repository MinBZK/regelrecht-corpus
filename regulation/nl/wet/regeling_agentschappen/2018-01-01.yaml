  - number: '27'
    text: |-
      1 Onder het begrip ‘derden’ in de zin van [Titel 9 van Boek 2 BW][ref1] wordt in het kader van deze regeling ook
      verstaan iedere organisatie of ieder organisatieonderdeel van het Rijk anders dan het baten-lastenagentschap waarop
      de verslaggeving betrekking heeft.

      2 Bij materiële en immateriële activa geldt:

      a. de waardering geschiedt tegen verkrijgings- of vervaardigingsprijs, onder aftrek van cumulatieve afschrijvingen
      en eventuele opgetreden waardeverminderingen;

      b. afschrijving geschiedt volgens de lineaire methode, op basis van de economische levensduur van de vaste activa;

      c. bij het bepalen van de afschrijvingstermijnen worden in beginsel de termijnen gehanteerd zoals opgenomen in de
      artikelsgewijze toelichting. Afwijkingen worden door het agentschap toegelicht in de jaarrekening.

      d. in afwijking van [artikel 365, tweede lid, van Boek 2 BW][ref2], wordt bij de activering van immateriële vaste
      activa geen wettelijke reserve in de jaarrekening opgenomen.

      3 Een baten-lastenagentschap bezit geen financiële vaste activa.

      4 Ten aanzien van het eigen vermogen gelden de volgende bepalingen:

      a. in de balans van een baten-lastenagentschap, niet zijnde de openingsbalans, worden onder de post eigen vermogen
      slechts opgenomen:

        - een exploitatiereserve;
        - het onverdeeld resultaat, zijnde het exploitatieresultaat over het verslagjaar.

      b. het onverdeeld resultaat wordt, na vaststelling van de jaarrekening, in zijn geheel toegevoegd aan de
      exploitatiereserve van een baten-lastenagentschap;

      c. het eigen vermogen van een baten-lastenagentschap is gebonden aan een maximumomvang van 5% van de gemiddelde
      jaaromzet, berekend over de laatste drie jaar. Indien een baten-lastenagentschap korter dan drie jaar bestaat,
      wordt de gemiddelde jaaromzet berekend over deze kortere periode;

      d. onder de omzet van een baten-lastenagentschap wordt verstaan: bijdragen van het betrokken ministerie, bijdragen
      van overige ministeries en bijdragen van derden;

      e. het eigen vermogen van een baten-lastenagentschap is gebonden aan een minimumomvang van nihil;

      f. wanneer de in lid 4c en 4e vermelde grenzen worden overschreden, dan wordt dit overeenkomstig het tweede lid van
      [artikel 25][ref3] hersteld.

      5 Langlopend vreemd vermogen bestaat uitsluitend uit leningen van het Ministerie van Financiën, zoals bedoeld in
      [artikel 28][ref4].

      6 Voorzieningen worden in beginsel opgenomen overeenkomstig [Titel 9 van Boek 2 BW][ref5]. Indien de aldaar
      genoemde voorzieningen niet worden opgenomen, wordt de reden daarvoor toegelicht in de jaarrekening. Dotatie,
      onttrekking en vrijval van voorzieningen worden vermeld en afzonderlijk toegelicht in de jaarrekening.

      7 Vorderingen op en schulden aan het betrokken ministerie en aan andere ministeries worden gespecificeerd en
      toegelicht bij de toelichting op de afzonderlijke posten in de balans van de jaarrekening.

      8 Overeenkomstig de uitgangspunten van het Rijkshuisvestingsstelsel activeert het Rijksvastgoedbedrijf alle panden
      die onderdeel zijn van het Rijkshuisvestingsstelsel, ook indien [Titel 9 van Boek 2 BW][ref6] vereist dat een pand
      geactiveerd wordt bij het baten-lastenagentschap dat het pand in gebruik heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel365
      [ref3]: https://wetten.overheid.nl/BWBR0040286#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0040286#Artikel28
      [ref5]: https://wetten.overheid.nl/BWBR0003045
