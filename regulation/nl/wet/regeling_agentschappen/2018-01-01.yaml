  - number: '2'
    text: |-
      De Minister doet van zijn voornemen om een in de uitvoering werkzaam dienstonderdeel te verzelfstandigen, of om
      diensten te laten fuseren tot één agentschap, mededeling aan de directeur-generaal van de Rijksbegroting van het
      Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel2
  - number: '3'
    text: |-
      De Minister dient op een zelfgekozen tijdstip een aanvraag in bij de Minister van Financiën voor de aanwijzing van
      een dienstonderdeel als een agentschap, mits de Minister en de Minister van Financiën op grond van de jaarlijkse
      rapportages van de Auditdienst Rijk in gezamenlijkheid constateren dat er in het gevoerde financieel beheer
      over het voorafgaande jaar bij het toekomstig agentschap en bij de bestaande agentschappen waarvoor de Minister
      verantwoordelijk is, geen relevante onvolkomenheden zijn geconstateerd. Tussen de aankondiging, bedoeld in
      [artikel 2][ref1], en de aanvraag liggen tenminste zes weken.


      [ref1]: https://wetten.overheid.nl/BWBR0040286#Artikel2
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040286
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      1 Bij de aanvraag, bedoeld in [artikel 3][ref1], worden stukken overlegd waaruit blijkt dat het dienstonderdeel als
      toekomstig agentschap voldoet aan de instellingsvoorwaarden, inhoudende dat het:

      a. een verwachte omzet of verwachte ontvangsten heeft van meer dan € 50 miljoen op jaarbasis;

      b. een resultaatgericht sturingsmodel heeft als bedoeld in de [artikelen 9 tot en met 13][ref2] van deze regeling;

      c. doelmatiger gaat werken dan als een regulier dienstonderdeel van het betrokken ministerie en aangeeft hoe
      het dienstonderdeel als agentschap de doelmatigheid tenminste gedurende de vijf daarna volgende jaren verder zal
      ontwikkelen;

      d. een zodanig verband kan leggen tussen uitgaven, kosten en prestaties, dat bekostiging op basis van prestaties
      mogelijk is;

      e. een voldoende kwaliteitsniveau van de financiële functie en het financieel beheer kan waarborgen.

      2 De Minister van Financiën stelt met betrekking tot de aanvraag vast op welke gebieden bedoeld in het eerste
      lid nog nadere invulling dient plaats te vinden en aan welke zonodig aanvullende voorwaarden op het gebied van de
      doelmatige bedrijfsvoering nog dient te worden voldaan.

      3 Indien naar het oordeel van de Minister van Financiën is voldaan aan de instellingsvoorwaarden, bedoeld in
      het eerste en tweede lid, overlegt de betrokken Minister een door de onderscheidenlijk in [artikel 10][ref3],
      [11][ref4] en [12][ref5] bedoelde eigenaar, opdrachtgever(s) en opdrachtnemer ondertekend convenant waaruit de
      opzet en het verwachte functioneren, overeenkomstig het eerste en tweede lid, van het toekomstig agentschap blijkt.

      4 Na ontvangst van het convenant, bedoeld in het derde lid, legt de Minister, mede namens de Minister van
      Financiën, het voorgenomen besluit tot instelling van het agentschap voor aan de ministerraad.


      [ref1]: https://wetten.overheid.nl/BWBR0040286#Artikel3
