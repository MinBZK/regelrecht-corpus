  - number: '26'
    text: |-
      Onverminderd [artikel 27][ref1] zijn bij het opstellen van de jaarrekening van baten-
      lastenagentschappen en de daarop gebaseerde agentschapsparagraaf in het departementaal jaarverslag de
      [artikelen 361 tot en met 390][ref2], uitgezonderd [artikel 365, tweede lid][ref3], [artikel 383][ref4] en de
      [artikelen 383a t/m artikel 383e van Titel 9 van Boek 2 BW][ref5] en de Richtlijnen voor de Jaarverslaggeving van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0040286#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel361
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel365
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel383
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel383a
