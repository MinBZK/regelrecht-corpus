  - number: '5'
    text: |-
      Voor de instelling van een baten-lastenagentschap geldt de aanvullende instellingsvoorwaarde dat de voorziene
      gemiddelde afschrijvingskosten per jaar ten minste 5% van de totale lasten bedragen, berekend over een periode van
      drie jaar.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel5
  - number: '6'
    text: |-
      1 Indien de ministerraad instemt met de instelling van het agentschap brengt de Minister het voorgenomen besluit
      hiertoe ter kennis van de Tweede Kamer der Staten-Generaal.

      2 Indien de Tweede Kamer der Staten-Generaal zich niet uitspreekt tegen het voorgenomen besluit overeenkomstig de
      procedure vastgelegd in [artikel 2.20, tweede tot en met vierde lid, van de Comptabiliteitswet 2016][ref1], wordt
      het besluit tot instelling van het agentschap ondertekend door de Minister en de Minister van Financiën.

      3 De instelling gaat in op de datum die in het instellingsbesluit wordt genoemd, die niet ligt voor de datum waarop
      het instellingsbesluit is genomen.

      4 De Minister maakt het instellingsbesluit bekend in de Staatscourant.

      5 De Minister zendt een kopie van het instellingsbesluit aan de Algemene Rekenkamer.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2.20
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2.20'
  - number: '7'
    text: |-
      De Minister en de Minister van Financiën beoordelen gezamenlijk tenminste eens in de vijf jaar de doelmatigheid en
      doeltreffendheid van het functioneren van een agentschap. De Minister maakt het hieruit volgend rapport openbaar.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel7
  - number: '8'
    text: |-
      1 De opheffing van een agentschap vindt plaats door een gemotiveerd besluit van de Minister, mede ondertekend door
      de Minister van Financiën. De Minister stuurt een vooraankondiging van dit besluit naar de directeur-generaal van
      de Rijksbegroting van het Ministerie van Financiën.

      2 Voordat een agentschap kan worden opgeheven moet binnen een termijn van zes maanden na beoogde datum van
      opheffing aan de volgende voorwaarden zijn voldaan:

      a. er is een saldibalans of een slotbalans opgesteld;

      b. de saldibalans of de slotbalans is voorzien van een goedkeurende en op zichzelf staande controleverklaring van
      de Auditdienst Rijk;

      c. bij overgang van de taken van een verplichtingen-kasagentschap naar een ander agentschap zijn alle in de
      saldibalans opgenomen financiële saldi overgenomen door het andere agentschap;

      d. bij overgang van de taken van een baten-lastenagentschap naar een ander agentschap zijn de in de slotbalans
      opgenomen activa en passiva alsmede de niet in de balans opgenomen verplichtingen overgenomen door het andere
      agentschap;

      e. in alle andere gevallen zijn alle schulden, bezittingen en aangegane verplichtingen van het agentschap verrekend
      met de rechthebbenden.

      3 De Tweede Kamer der Staten-Generaal wordt over het besluit tot opheffing separaat geïnformeerd door de Minister.

      4 De Minister maakt het besluit tot opheffing bekend in de Staatscourant.

      5 De Minister zendt een kopie van het besluit tot opheffing aan de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel8
  - number: '9'
    text: |-
      1 Een agentschap heeft een sturingsmodel waarin drie rollen worden onderscheiden, te weten die van eigenaar,
      opdrachtgever en opdrachtnemer. Deze rollen worden niet functioneel gecombineerd.

      2 In afwijking van het eerste lid kunnen de rollen van opdrachtgever en eigenaar gecombineerd worden wanneer
      er uitsluitend sprake is van dienstverlening binnen het eigen ministerie, mits gemotiveerd en mits *checks and
      balances* tussen de spelers voldoende zijn geborgd.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel9
  - number: '10'
    text: |-
      De eigenaar, die verantwoordelijk is voor het toezicht op het beleid van de opdrachtnemer en op de algemene gang
      van zaken in het agentschap, draagt zorg voor:

      a. het inrichten van het sturingsmodel op zodanige wijze, dat wordt voldaan aan de vereisten van deze regeling;

      b. de continuïteit van het agentschap op de lange termijn;

      c. het toetsen en goedkeuren van de begroting, de tarieven, het jaarplan, de leenaanvragen, de jaarrekening en
      de afspraken over de wijze waarop de financiële gevolgen van onvoorziene ontwikkelingen worden toebedeeld aan de
      eigenaar, opdrachtgever en opdrachtnemer;

      d. het overeenkomstig de [artikelen 22, derde lid][ref1], respectievelijk [25, tweede lid][ref2], van deze
      regeling zorgdragen dat uiterlijk per eerste suppletoire begrotingswet een eventuele negatieve kasreserve bij
      verplichtingen-kasagentschappen, dan wel een eventueel negatief eigen vermogen bij baten-lastenagentschappen,
      wordt aangevuld tot een kasreserve dan wel een eigen vermogen van minimaal nihil. Een surplus aan kasreserve of een
      surplus aan eigen vermogen vervalt aan de eigenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0040286#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0040286#Artikel25
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0040286
        artikel: '22'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0040286
        artikel: '25'
        paragraaf: '7'
  - number: '11'
    text: |-
      De opdrachtgever is verantwoordelijk voor:

      a. een opdrachtformulering, met een zo concreet mogelijke omschrijving van het gewenste resultaat;

      b. het tijdig betrekken van de opdrachtnemer bij onvoorziene ontwikkelingen die van invloed zijn op de uitvoering
      van de opdracht;

      c. het, in afstemming met de opdrachtnemer, opstellen van prestatie-indicatoren en rapportageafspraken zodat de
      opdrachtgever de uitvoering van de opdracht kan monitoren.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel11
  - number: '12'
    text: |-
      De opdrachtnemer is in ieder geval verantwoordelijk voor:

      a. de bestendigheid van de interne organisatie;

      b. het doelmatig, rechtmatig en professioneel uitvoeren van de afspraken zoals gemaakt met de opdrachtgever(s) en
      eigenaar en het afleggen van verantwoording daarover;

      c. het tijdig betrekken van de opdrachtgever(s) bij onvoorziene ontwikkelingen die van invloed zijn op de
      uitvoering van de opdracht;

      d. het begrotingsbeheer, financieel beheer en de materiële bedrijfsvoering, inclusief het afleggen van
      verantwoording hierover.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel12
  - number: '13'
    text: |-
      In het jaarplan van het agentschap of een daarmee vergelijkbaar document neemt de opdrachtnemer voor het komende
      jaar een overzicht op van in ieder geval:

      a. de financiële kaders van het agentschap en de wijze van financiering zoals afgesproken met de opdrachtgever(s);

      b. de te leveren prestaties op hoofdlijnen en de daarbij behorende wijze van bekostiging;

      c. de rapportageafspraken met de opdrachtgever(s) en eigenaar;

      d. de afspraken over de wijze waarop de financiële gevolgen van onvoorziene ontwikkelingen worden toegedeeld aan de
      eigenaar, opdrachtgever(s) en opdrachtnemer.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel13
  - number: '14'
    text: |-
      Agentschappen ontvangen bijdragen voor de door hen geleverde producten en diensten. Deze bijdragen worden bepaald
      op basis van de met de opdrachtgever(s) van het agentschap gemaakte hoeveelheids-, kwaliteits- en prijsafspraken.
      Hiermee zijn de te ontvangen bijdragen gekoppeld aan prestaties.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel14
  - number: '15'
    text: |-
      Bij het bevoorschotten van een agentschap wordt een zodanige frequentie en hoogte aangehouden dat aangesloten wordt
      bij de noodzakelijke liquiditeitsbehoefte van het agentschap, waarbij de bepalingen in hoofdstuk 3, paragraaf 4 van
      de Regeling financieel beheer van het Rijk van overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel15
  - number: '16'
    text: |-
      1 Het aanhouden van liquide middelen door een agentschap geschiedt in de schatkist van het Rijk in de vorm van een
      rekening-courant. Aan een rekening-courant kan een depositorekening worden gekoppeld.

      2 De Minister van Financiën bepaalt de van toepassing zijnde rentepercentages voor debet- en creditsaldi op
      de rekening-courant en termijndeposito’s. [Artikel 4, eerste, tweede, vijfde en zesde lid, van de Regeling
      schatkistbankieren RWT’s en andere rechtspersonen](onbekend) is van overeenkomstige toepassing.

      3 De renteverrekening tussen het Ministerie van Financiën en het betrokken agentschap over de saldi op de rekening-
      courant vindt eenmaal per jaar plaats met als rentevervaldatum 31 december.

      4 Een agentschap kan beschikken over een krediet in de vorm van een debetstand op de rekening-courant, ter
      voorziening in een liquiditeitsbehoefte voor het doen van lopende uitgaven.

      5 Het rekening-courantkrediet bij de schatkist van het Rijk bedraagt voor een agentschap per 31 december maximaal €
      0,5 miljoen.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel16
  - number: '17'
    text: |-
      1 Een termijndeposito wordt niet met terugwerkende kracht afgesloten.

      2 Een termijndeposito wordt alleen afgesloten indien de rekening-courant van het agentschap een toereikend
      creditsaldo heeft.

      3 De Rijkshoofdboekhouding int een in rekening te brengen afsluitprovisie zelfstandig ten laste van de rekening-
      courant van het agentschap.

      4 De te ontvangen rente over het termijndeposito wordt verrekend op de voor het termijndeposito geldende
      rentevervaldatum. Bij termijndeposito’s met een looptijd van langer dan twaalf maanden schrijft de
      Rijkshoofdboekhouding de te ontvangen rente jaarlijks automatisch bij op de rekening-courant van het agentschap. De
      rente wordt berekend vanaf de ingangsdatum van het termijndeposito.

      5 Het vervroegd opnemen van een termijndeposito geschiedt door een tijdig verzoek van het agentschap aan de
      Rijkshoofdboekhouding.

      6 Bij vervroegde opname is het agentschap een boete verschuldigd. De Rijkshoofdboekhouding int de boete op de
      opnamedatum zelfstandig ten laste van de rekening-courant van het agentschap.

      7 De Minister van Financiën bepaalt de van toepassing zijnde afsluitprovisies en boetes bij vervroegd opnemen en
      kan tevens minimumbedragen vaststellen voor deposito’s.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel17
  - number: '18'
    text: |-
      1 Voor agentschappen geldt de regelgeving omtrent financieel beheer, materiële bedrijfsvoering en verantwoording
      zoals opgenomen in de [Comptabiliteitswet 2016][ref1] en de daaruit voortvloeiende comptabele regelgeving.

      2 Voor de presentatie van de jaarrekening en de agentschapsparagraaf in het jaarverslag van het betrokken
      ministerie zijn de modellen en de toelichtingen daarop van de Regeling rijksbegrotingsvoorschriften van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0039429
  - number: '19'
    text: |-
      1 De indicatieve openings(saldi)balans wordt opgenomen in de agentschapsparagraaf van de eerstvolgende
      begrotingswet van het betrokken ministerie overeenkomstig de Regeling rijksbegrotingsvoorschriften.

      2 Nadat de Tweede Kamer der Staten-Generaal de begrotingswet, bedoeld in het eerste lid, heeft vastgesteld, stelt
      de Minister in overeenstemming met de Minister van Financiën de definitieve openings(saldi)balans vast.

      3 De definitieve openings(saldi)balans dient voorzien te worden van een controleverklaring van de Auditdienst Rijk.

      4 Na ontvangst van de controleverklaring, bedoeld in het derde lid, wordt de definitieve openings(saldi)balans
      opgenomen in de agentschapsparagraaf van de eerste daaropvolgende begrotingswet van het betrokken ministerie in het
      jaar van instelling.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel19
  - number: '20'
    text: |-
      Indien een agentschap een publicitair jaarverslag uitbrengt, maakt het agentschap in dit jaarverslag melding van de
      bijzondere status van dit verslag. Een dergelijk publicitair jaarverslag is geen verplicht verantwoordingsverslag
      van een agentschap uit hoofde van de Regeling rijksbegrotingsvoorschriften.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel20
  - number: '21'
    text: |-
      1 De openings-saldibalans geeft de financiële saldi van het agentschap per instellingsdatum weer.

      2 In de openings-saldibalans kan een kasreserve van maximaal 3% van de verwachte jaarontvangsten, als bedoeld in
      [artikel 22, vijfde lid][ref1], worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0040286#Artikel22
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0040286
        artikel: '22'
        paragraaf: '6'
  - number: '22'
    text: |-
      1 De kasreserve van een verplichtingen-kasagentschap is gebonden aan een maximumomvang van 3% van de gemiddelde
      jaarontvangsten berekend over de laatste drie jaar. Indien het agentschap nog geen drie jaar bestaat worden de
      gemiddelde jaarontvangsten berekend over deze kortere periode.

      2 De kasreserve is gebonden aan een minimumomvang per 31 december van nihil.

      3 Indien er volgens de jaarrekening sprake is van een overschrijding van de in het eerste en tweede lid genoemde
      grenzen, dient deze uiterlijk bij de eerste suppletoire begrotingswet te zijn hersteld. Een surplus aan kasreserve
      wordt door het verplichtingen-kasagentschap uitgekeerd aan de eigenaar.

      4 Financiële transacties die zuiver gericht zijn op het voorkomen van overschrijdingen van de in het eerste en
      tweede lid vermelde grenzen zijn niet toegestaan.

      5 De in het eerste lid bedoelde jaarontvangsten van een verplichtingen-kasagentschap bestaan uit de bijdragen van
      het betrokken ministerie, bijdragen van overige ministeries en bijdragen van derden.

      6 Het verplichtingen-kasagentschap voegt het gerealiseerde exploitatieresultaat per 31 december in zijn geheel toe
      aan de kasreserve.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel22
  - number: '23'
    text: |-
      1 Het baten-lastenagentschap neemt in de openingsbalans met de daarbij behorende toelichting de activa, passiva,
      rechten en verplichtingen op die door het betrokken ministerie en door andere ministeries aan een agentschap in
      economisch beheer worden overgedragen.

      2 Tegenover de langlopende bezittingen wordt in de openingsbalans een initiële lening opgenomen: een langlopende
      schuld aan het Ministerie van Financiën in de vorm van een beroep op de leenfaciliteit. De omvang van de initiële
      lening kan worden verminderd met het langlopende deel van de voorzieningen. Met de uit de initiële lening ontvangen
      gelden betaalt het betrokken baten-lastenagentschap de vergoeding voor de overgenomen vermogensbestanddelen aan
      het (vak)ministerie.

      3 In de openingsbalans wordt het saldo van enerzijds de kortlopende bezittingen en anderzijds de kortlopende
      schulden en het kortlopende deel van de voorzieningen opgenomen als passivum in de post ‘Nog te betalen’ indien dit
      saldo positief is, en opgenomen als activum in de post ‘Nog te ontvangen’ indien dit saldo negatief is.

      4 In de openingsbalans kan slechts een exploitatiereserve als vorm van eigen vermogen worden opgenomen, die
      maximaal 5% van de verwachte omzet bedraagt, als bedoeld in [artikel 27, vierde lid, onder d][ref1], van deze
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0040286#Artikel27
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0040286
        artikel: '27'
        paragraaf: '7'
  - number: '24'
    text: |-
      Indien de kostprijs van een product of een dienst van een baten-lastenagentschap stijgt als gevolg van de rente
      die een baten-lastenagentschap verschuldigd is over de initiële lening en indien die gestegen kostprijs aantoonbaar
      in rekening wordt gebracht aan een ander dienstonderdeel van het Rijk, staat de Minister van Financiën aan die
      andere dienst toe ten laste van de algemene middelen een aanvullend budget ter grootte van de kostenstijging in de
      departementale begroting op te nemen totdat de initiële lening is afgelost.
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel24
  - number: '25'
    text: |-
      1 Bijdragen aan baten-lastenagentschappen anders dan de in [artikel 14][ref1] genoemde bijdragen, zijn directe
      vermogensmutaties en worden door het baten-lastenagentschap verantwoord onder de exploitatiereserve.

      2 Indien er volgens de jaarrekening sprake is van een overschrijding van de in
      [artikel 27 vierde lid onder c en e][ref2] genoemde grenzen, dient deze uiterlijk bij de eerste suppletoire
      begrotingswet te zijn hersteld. Een surplus aan eigen vermogen wordt uitgekeerd aan de eigenaar.

      3 Financiële transacties die zuiver gericht zijn op het voorkomen van overschrijdingen van de in
      [artikel 27 vierde lid onder c en e][ref3] vermelde grenzen zijn niet toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0040286#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0040286#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0040286#Artikel27
    url: https://wetten.overheid.nl/BWBR0040286/2018-01-01#Artikel25
