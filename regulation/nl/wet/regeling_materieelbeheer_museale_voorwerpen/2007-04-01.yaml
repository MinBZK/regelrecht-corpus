---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_materieelbeheer_museale_voorwerpen
regulatory_layer: WET
publication_date: '2006-12-06'
valid_from: '2007-04-01'
bwb_id: BWBR0020583
url: https://wetten.overheid.nl/BWBR0020583/2007-04-01
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Onderwijs, Cultuur en Wetenschap;

    Gelet op artikel 38, eerste lid, van de Comptabiliteitswet 2001;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel1
  - number: 1.a
    text: 'Minister: de Minister wie het aangaat;'
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel1
  - number: 1.b
    text: |-
      college: het college genoemd in [artikel 1, eerste lid, onder e, van de Comptabiliteitswet 2001][ref1], wie het
      aangaat;


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel1
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '1'
  - number: 1.c
    text: 'museaal voorwerp: een zaak van bijzondere artistieke, culturele of wetenschappelijke waarde;'
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel1
  - number: 1.d
    text: 'museale instelling: een instelling als genoemd in de bij deze regeling behorende bijlage.'
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel1
  - number: '2.1'
    text: De Minister of het college bevordert de zichtbaarheid van museale voorwerpen.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel2
  - number: '2.3'
    text: Restauratie van een museaal voorwerp vindt plaats na overleg met de Minister van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel2
  - number: '2.4'
    text: |-
      Indien de Minister of het college het voornemen heeft het beheer van één of meer museale voorwerpen te beëindigen,
      geschiedt die beëindiging in overleg met de Minister van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel2
  - number: '2.5'
    text: |-
      De Minister of het college treft maatregelen ter voorkoming van vermissing, diefstal, verlies of beschadiging van
      museale voorwerpen.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel2
  - number: '3.1'
    text: |-
      De Minister of het college zorgt ervoor dat de verblijfplaatsen van museale voorwerpen worden geregistreerd en dat
      de aanwezigheid van museale voorwerpen op die geregistreerde verblijfplaatsen regelmatig wordt gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel3
  - number: '3.2'
    text: |-
      De Minister of het college zorgt ervoor dat alle voorkomende verwervingen, diefstallen, verliezen, vermissingen of
      beschadigingen van museale voorwerpen worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel3
  - number: '3.3'
    text: |-
      De Minister of het college informeert de Minister van Onderwijs, Cultuur en Wetenschap desgevraagd over de
      mutaties, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel3
  - number: '4.1'
    text: |-
      De Minister of het college zorgt ervoor dat de administratieve organisatie van het beheer van museale voorwerpen
      met inachtneming van deze regeling wordt beschreven en dat de procedures die in die administratieve organisatie
      zijn vastgelegd, worden toegepast.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel4
  - number: '4.2'
    text: |-
      De Minister of het college wijst ten behoeve van de communicatie met de Minister van Onderwijs, Cultuur en
      Wetenschap over het beheer van museale voorwerpen ten minste één functionaris aan.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel4
  - number: '5.1'
    text: |-
      Museale voorwerpen worden zodanig beheerd dat de kans op schade aan derden of aansprakelijkstelling door derden
      zoveel mogelijk wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel5
  - number: '5.2'
    text: |-
      De Minister of het college inventariseert de risico’s dat met de museale voorwerpen aanzienlijke schade aan derden
      kan worden toegebracht, dan wel dat het beheer van die voorwerpen aanleiding kan zijn tot aansprakelijkstelling
      door derden met aanzienlijke financiële gevolgen.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel5
  - number: '5.3'
    text: |-
      Aan de hand van de schatting van de kans dat de geïnventariseerde risico’s, bedoeld in het eerste en tweede lid,
      zich zullen voordoen, wordt besloten of en zo ja welke preventieve maatregelen moeten worden genomen ter voorkoming
      of beperking van de risico’s, dan wel welke maatregelen moeten worden genomen voor het herstel van de schade of de
      opvang van de gevolgen van aansprakelijkstelling.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel5
  - number: '5.4'
    text: |-
      De Minister of het college draagt zorg voor het administreren van gegevens met betrekking tot gevallen van schade
      en aansprakelijkheid die zich hebben voorgedaan.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel5
  - number: '5.5'
    text: |-
      De in het vierde lid bedoelde gegevens worden op verzoek van de Minister van Onderwijs, Cultuur en Wetenschap aan
      hem overgelegd.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel5
  - number: '6.1'
    text: |-
      De risico's van schade voor en aansprakelijkheid van de Staat worden om redenen van doelmatigheid in het algemeen
      niet verzekerd.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel6
  - number: '6.2'
    text: Een besluit tot verzekeren wordt genomen in overeenstemming met de Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel6
  - number: '6.3'
    text: |-
      In overleg tussen de Minister of het college en de Minister van Financiën kan worden besloten, dat de afwikkeling
      van een schade of een aansprakelijkheid namens het Rijk door de Minister van Financiën geschiedt.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel6
  - number: '7.1'
    text: |-
      De Minister of het college zorgt ervoor dat museale instellingen dan wel andere derden die voor hem museale
      voorwerpen beheren, handelen overeenkomstig de [artikelen 2 tot en met 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020583#Artikel2
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020583
        artikel: '2'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      De Minister of het college zorgt ervoor dat museale instellingen dan wel andere derden die voor hem museale
      voorwerpen beheren, medewerking verlenen aan het houden van toezicht op het beheer van de desbetreffende museale
      voorwerpen, bedoeld in de [artikelen 12][ref1] en [13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020583#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0020583#Artikel13
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020583
        artikel: '12'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0020583
        artikel: '13'
        paragraaf: '5'
  - number: '8'
    text: |-
      Desgevraagd of ambtshalve stelt de Minister van Onderwijs, Cultuur en Wetenschap de artistieke, culturele of
      wetenschappelijke waarde vast van de daarvoor in aanmerking komende voorwerpen.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel8
  - number: '9.1'
    text: |-
      De Minister van Onderwijs, Cultuur en Wetenschap adviseert desgevraagd of ambtshalve over het beheer van museale
      voorwerpen, zowel in algemene zin als in geval van een specifiek voorwerp.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel9
  - number: '9.2'
    text: |-
      De Minister van Onderwijs, Cultuur en Wetenschap kan aanwijzingen geven met betrekking tot het beheer of de
      restauratie van museale voorwerpen.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel9
  - number: '10'
    text: |-
      De Minister van Onderwijs, Cultuur en Wetenschap houdt een lijst bij van alle bij de Ministers of colleges
      bestaande registraties van museale voorwerpen.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel10
  - number: '11'
    text: |-
      De Minister van Onderwijs, Cultuur en Wetenschap kan in een specifiek geval het beheer van een museaal voorwerp
      overnemen.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel11
  - number: '12.1'
    text: |-
      Met het toezicht op de naleving van deze regeling zijn belast de inspecteur, bedoeld in
      [artikel 1, eerste lid, onderdeel f, van de Wet tot behoud van cultuurbezit][ref1] en de door de Minister van
      Onderwijs, Cultuur en Wetenschap op grond van [artikel 15 van die wet][ref2] aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003659#Artikel15
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003659
        artikel: '15'
  - number: '12.2'
    text: |-
      De Minister of het college is gehouden desgevraagd de inlichtingen te verstrekken die de toezichthouders, bedoeld
      in het eerste lid, voor de uitoefening van het toezicht nodig hebben.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel12
  - number: '12.3'
    text: |-
      De Minister of het college verleent de toezichthouders, bedoeld in het eerste lid, desgevraagd toegang tot de
      museale voorwerpen die hij beheert en verleent hen desgevraagd inzage in alle daartoe bijgehouden administraties,
      documenten en andere informatiedragers.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel12
  - number: '13.1'
    text: |-
      De toezichthouders, bedoeld in [artikel 12, eerste lid][ref1], melden hun bevindingen aan de Minister of het
      college en geven zo nodig daarbij aan welke voorzieningen naar hun oordeel dienen te worden getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0020583#Artikel12
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0020583
        artikel: '12'
        paragraaf: '5'
  - number: '13.2'
    text: |-
      De inspecteur legt periodiek een samenvatting van de bevindingen, bedoeld in het eerste lid, over aan de Minister
      van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel13
  - number: '15'
    text: 'Deze regeling wordt aangehaald als: Regeling materieelbeheer museale voorwerpen.'
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel15
  - number: '16'
    text: |-
      Deze regeling treedt in werking met ingang van 1 april 2007 met uitzondering van [artikel 2, tweede lid][ref1], dat
      op 1 januari 2009 in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0020583#Artikel2
    url: https://wetten.overheid.nl/BWBR0020583/2007-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0020583
        artikel: '2'
        paragraaf: '2'
