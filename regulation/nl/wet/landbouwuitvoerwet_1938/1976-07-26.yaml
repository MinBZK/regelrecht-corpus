preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is nieuwe bepalingen vast te stellen nopens verbod van
    uitvoer van bepaalde voortbrengselen van het landbouw-, tuinbouw-, veeteelt- en zuivelbedrijf, voor zoover deze
    niet aan bepaalde eischen van herkomst, hoedanigheid en verzorging voldoen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      1°. "Onze Minister": Onze met de zaken van den landbouw belaste Minister;

      2°. "Uitvoercontrôlebesluit": eene algemeene maatregel van bestuur, als bedoeld in [artikel 2][ref1];

      3°. "Algemeene Voorwaarden": de Algemeene Voorwaarden, bedoeld in [artikel 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001990#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001990#Artikel8
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001990
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001990
        artikel: '8'
        paragraaf: '2'
  - number: '2'
    text: |-
      Het is verboden:

      1. boter, 2. kaas, 3. al dan niet gecondenseerde melk, 4. room, 5. karnemelk, 6. al dan niet gecondenseerde
      ondermelk, 7. melkpoeder, 8. blokmelk;

      9. kippeneieren, 10. eendeneieren;

      11. bacon;

      12. karwijzaad, 13. maanzaad, 14. mosterdzaad;

      15. aardappelen, 16. uien;

      17. aardbeien, 18. appelen, 19. bessen, 20. druiven, 21. frambozen, 22. kersen, 23. kruisbessen, 24. peren, 25.
      perziken, 26. pruimen;

      27. andijvie, 28. asperges, 29. augurken, 30. kool, 31. in groenen toestand geoogste boonen, 32. doperwten, 33.
      peulen, 34. komkommers, 35. koolrapen, 36. kroten, 37. meloenen, 38. peen, 39. peterselie, 40. postelein, 41. prei,
      42. raapstelen, 43. rabarber, 44. radijs, 45. schorseneeren, 46. selderij, 47. sla, 48. spinazie, 49. tomaten,
      50. witlof;

      51. bollen van bloemgewassen, 52. knollen van bloemgewassen;

      53. snijbloemen;

      54. boomkweekerijproducten;

      55. geneeskrachtige en aromatische gewassen;

      56. haring, mosselen, alsmede vissen, schaal- en schelpdieren, van de door Onze Minister bij in de *Staatscourant*
      bekend te maken beschikking aangewezen soorten.

      uit te voeren, te pogen uit te voeren of ten uitvoer aan te bieden, indien deze voortbrengselen niet voldoen aan
      bij of krachtens algemeenen maatregel van bestuur te stellen eischen van herkomst, hoedanigheid en verzorging en
      indien hunne verpakking, vorm of afwerking niet voldoen aan bij of krachtens dien algemeenen maatregel van bestuur
      te stellen eischen van hoedanigheid en verzorging, een en ander onverminderd andere met betrekking tot den uitvoer
      van die voortbrengselen geldende wettelijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel2
  - number: '3'
    text: |-
      Het stellen van eischen, als bedoeld in het vorige artikel, geschiedt niet dan na overleg met organisaties van
      daarbij rechtstreeks belanghebbenden. Dat overleg wordt gepleegd door Onzen Minister; deze wijst daartoe de
      organisaties aan.
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel3
  - number: '4'
    text: |-
      In een Uitvoercontrôlebesluit kan worden bepaald, dat de uitvoer der voortbrengselen, waarop het betrekking heeft,
      is verboden langs andere dan de door Onzen Minister in overleg met Onzen Minister van Financiën aangewezen laatste
      kantoren.
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel4
  - number: '5'
    text: |-
      In een Uitvoercontrôlebesluit kan worden bepaald, dat voortbrengselen en hunne verpakking, vorm of afwerking
      slechts dan zullen worden geacht te voldoen aan de bij of krachtens dat besluit gestelde eischen, indien zij
      daartoe aan een keuring zijn onderworpen en daarbij zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel5
  - number: '6'
    text: |-
      Door Onzen Minister kunnen merken, teekenen of bewijsstukken worden vastgesteld of erkend als uitsluitend bestemd
      om door of vanwege den daartoe gerechtigde op voortbrengselen of op hunne verpakking te worden aangebracht of bij
      die voortbrengselen te worden gevoegd ten bewijze, dat zij aan eene keuring, als bedoeld in het vorige artikel,
      zijn onderworpen geweest en daarbij zijn goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel6
  - number: '7'
    text: |-
      Onze Minister kan regelen vast stellen betreffende het vervaardigen, voorhanden hebben en afleveren van merken,
      teekenen of bewijsstukken, als bedoeld in het vorige artikel, en van cliché's, stempels en andere werktuigen tot
      vervaardiging of aanbrenging van die merken, teekenen of bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel7
  - number: '8'
    text: |-
      In een Uitvoercontrôlebesluit kunnen een of meer rechtspersonen met volledige rechtsbevoegdheid, welke aan bij
      algemeenen maatregel van bestuur te stellen Algemeene Voorwaarden voldoen, met het toezicht op de naleving der
      bij of krachtens dat besluit gestelde eischen belast worden, alsmede met de keuring, bedoeld in artikel 5, of
      met het toezicht daarop en kunnen die instellingen, met inachtneming van het te dien aanzien in de Algemeene
      Voorwaarden bepaalde, worden bevoegd verklaard tot het uitreiken van merken, teekenen of bewijsstukken, als bedoeld
      in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001990#Artikel6
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001990
        artikel: '6'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 In een Uitvoercontrôlebesluit kan worden bepaald, dat rechtspersonen, welke daarin krachtens het vorige artikel
      bevoegd zijn verklaard tot het uitreiken van merken, teekenen of bewijsstukken, als bedoeld in [artikel 6][ref1],
      en welke aan daartoe in de Algemeene Voorwaarden te stellen regelen voldoen, die merken, teekenen of bewijsstukken
      slechts mogen uitreiken aan of ten behoeve van bij hen aangeslotenen.

      2 De door Onze Minister aangewezen personen, in dienst van een rechtspersoon, als in het voorgaande lid bedoeld,
      zijn bevoegd, in het belang van de hun opgedragen taak, voertuigen en andere plaatsen, waar voortbrengselen, welke
      aan de bij of krachtens een besluit, als in het voorgaande lid bedoeld, gestelde eisen moeten voldoen, aanwezig
      zijn, aan een onderzoek te onderwerpen en monsters te nemen van die voortbrengselen.

      3 De houder der voortbrengselen is alsdan verplicht de van hem gevorderde medewerking overeenkomstig de
      aanwijzingen van die personen en onder hun toezicht te verlenen en, indien gevorderd, de nodige hulpmiddelen en
      bijstand kosteloos te verstrekken.

      4 Wordt aan de in het voorgaande lid vermelde verplichtingen niet voldaan, dan kunnen de in het voorgaande lid
      bedoelde personen op kosten en risico van de houder in het nodige voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0001990#Artikel6
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0001990
        artikel: '6'
        paragraaf: '2'
  - number: '10'
    text: |-
      De Algemeene Voorwaarden houden mede voorschriften in nopens:

      a. het beroep van beslissingen der in [artikel 8][ref1] bedoelde rechtspersonen;

      b. de berekening en het verhaal van de bij keuring, beroep of anderszins bij de toepassing van deze wet werkelijk
      gemaakte kosten;

      c. het doen stellen van zekerheid voor de richtige nakoming van uit deze wet voortvloeiende verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0001990#Artikel8
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001990
        artikel: '8'
        paragraaf: '2'
  - number: '11'
    text: |-
      Onze Minister regelt de wijze, waarop de keuring, het uitreiken en aanwenden der merken, teekenen of bewijsstukken,
      bedoeld in [artikel 6][ref1], en het toezicht van Rijkswege op deze verrichtingen zullen geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001990#Artikel6
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001990
        artikel: '6'
        paragraaf: '2'
  - number: '12'
    text: |-
      1 Indien in een Uitvoercontrôlebesluit geen rechtspersoon, als bedoeld in [artikel 8][ref1], is bevoegd verklaard
      of indien door Ons tot schorsing of intrekking van zoodanige verklaring is besloten, bepalen Wij in die besluiten,
      welke artikelen der Algemeene Voorwaarden van overeenkomstige toepassing zullen zijn.

      2 In de gevallen, bedoeld in het vorige lid, regelt Onze Minister, met inachtneming van de krachtens dat lid
      toepasselijk verklaarde artikelen der Algemeene Voorwaarden, de verschillende bevoegdheden, welke anders aan een
      rechtspersoon, als bedoeld in [artikel 8][ref2], zouden zijn toevertrouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0001990#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0001990#Artikel8
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001990
        artikel: '8'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001990
        artikel: '8'
        paragraaf: '2'
  - number: '13'
    text: |-
      Het in [artikel 2][ref1] gestelde verbod is niet van toepassing ten aanzien van voortbrengselen, welke:

      1°. zich bevinden in spoorwegrijtuigen, in luchtvaartuigen, op schepen of op vlotten en bestemd zijn voor verbruik
      van de daarin of daarop verblijvende personen;

      2°. in hoeveelheden, welke een door Onzen Minister vast te stellen maximum niet overschrijden, worden uitgevoerd
      ten behoeve van de voorziening in het grensgebied;

      3°. in hoeveelheden, welke een door Onzen Minister vast te stellen maximum niet overschrijden, worden uitgevoerd in
      den vorm van monsters zonder of met geringe handelswaarde;

      4°. uit het buitenland afkomstig zijn en, met inachtneming van de met betrekking tot zoodanigen uitvoer door Onzen
      Minister te stellen voorwaarden, worden ten uitvoer aangeboden of uitgevoerd na hier te lande al dan niet eene
      bewerking te hebben ondergaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001990#Artikel2
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0001990
        artikel: '2'
        paragraaf: '2'
  - number: '14'
    text: |-
      In bijzondere door hem te beoordeelen gevallen of groepen van gevallen kan door Onzen Minister, al dan niet onder
      door hem daarbij vast te stellen voorwaarden, ontheffing worden verleend van het in [artikel 2][ref1] gestelde
      verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0001990#Artikel2
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0001990
        artikel: '2'
        paragraaf: '2'
  - number: '15'
    text: |-
      1 Door Ons kunnen, gehoord de besturen der door Ons ingevolge [artikel 8][ref1] bevoegd verklaarde rechtspersonen,
      een of meer Commissiën van Advies worden benoemd, welke tot taak hebben de Regeering desgevraagd of eigener
      beweging van advies te dienen over maatregelen ter uitvoering van deze wet.

      2 Onze Minister is bevoegd aan deze Commissiën adviseerende leden toe te voegen.

      3 De werkzaamheden dezer Commissiën worden door Ons geregeld.


      [ref1]: https://wetten.overheid.nl/BWBR0001990#Artikel8
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001990
        artikel: '8'
        paragraaf: '2'
  - number: '16'
    text: |-
      [Artikel 5 van de Wet op de economische delicten][ref1] is niet van toepassing op voorzieningen ter zake van
      overtredingen van voorschriften, gesteld bij of krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel5
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '5'
  - number: '18'
    text: |-
      De ondernemer van een openbaar middel van vervoer wordt als zoodanig niet vervolgd, indien de naam en de woonplaats
      van den afzender van de voorwerpen, waarmede de overtreding is gepleegd, bekend zijn of op eerste aanmaning van den
      officier van justitie binnen een door dezen te bepalen termijn door den ondernemer worden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel18
  - number: '22'
    text: |-
      1 De opsporingsambtenaren, die op grond van [artikel 21 van de Wet op de economische delicten][ref1] monsters
      nemen, en de personen, bedoeld in [artikel 9, tweede lid][ref2], die gelijke bevoegdheid uitoefenen, vergoeden de
      marktwaarde van de monsters, indien het verlangen daartoe wordt te kennen gegeven.

      2 Onze Minister kan nadere voorschriften geven met betrekking tot de monsterneming, de verzegeling, de verzending,
      het onderzoek der monsters en het toevoegen van bederfwerende middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0001990#Artikel9
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0001990
        artikel: '9'
        paragraaf: '2'
  - number: '29'
    text: |-
      Met ingang van het tijdstip, waarop een Uitvoercontrôlebesluit in werking treedt ten aanzien van eenig
      voortbrengsel, tot dan toe in een van de navolgende wetten of wetsdeelen of van Onze navolgende besluiten geregeld,
      wordt die wet, dat wetsdeel of dat besluit ten aanzien van dat voortbrengsel buiten werking gesteld:

      de artikelen 1 tot en met 7 der Landbouwuitvoerwet 1929;

      de wet van den 18den Juli 1930, *Staatsblad* no. 294, tot regeling van den uitvoer van uien, zooals zij is
      gewijzigd bij de wet van den 7den Augustus 1933, *Staatsblad* no. 433;

      de artikelen 1 tot en met 6 van de wet van den 29sten November 1930, *Staatsblad* no. 441, tot regeling van
      den uitvoer alsmede wijziging en aanvulling van de bepalingen betreffende den in- en doorvoer van kippen- en
      eendeneieren, zooals zij zijn gewijzigd bij de artikelen I tot en met V van de wet van den 8sten April 1932,
      *Staatsblad* no. 148;

      de wet van den 19den December 1930, *Staatsblad* no. 482, tot regeling van den uitvoer van melkproducten en van
      gepasteuriseerde en gesteriliseerde melk en room;

      de wet van den 31sten December 1931, *Staatsblad* no. 575, houdende regeling van den uitvoer van bloembollen;

      de wet van den 15den December 1932, *Staatsblad* no. 608, tot regeling van den uitvoer van pootaardappelen;

      Ons besluit van den 15den Maart 1934, *Staatsblad* no. 107, tot toepassing van artikel 8 der Landbouwuitvoerwet
      1929 met betrekking tot andere dan gepasteuriseerde en gesteriliseerde melk en room, alsmede ondermelk en
      karnemelk;

      Ons besluit van den 16den September 1936, *Staatsblad* no. 772, tot toepassing van de artikelen 8 en 11 der
      Landbouwuitvoerwet 1929 met betrekking tot groenten en fruit;

      Ons besluit van den 14den Januari 1937, *Staatsblad* no. 741, tot toepassing van de artikelen 8 en 11 der
      Landbouwuitvoerwet 1929 op den uitvoer van tulpenbloemen naar Groot-Britannië en Ierland.
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel29
  - number: '30'
    text: |-
      1 Met ingang van het tijdstip, waarop alle in het vorige artikel genoemde wetten en wetsdeelen en al Onze in dat
      artikel genoemde besluiten ten aanzien van alle voortbrengselen, waarop zij betrekking hebben, buiten werking zijn
      gesteld, vervalt de Landbouwuitvoerwet 1929.

      2 De wijzigingen, bij artikel 24 van de Landbouwuitvoerwet 1929 aangebracht in de [artikelen 66][ref1], [69][ref2]
      en [70 van de Veewet][ref3], behouden kracht van wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001900#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0001900#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0001900#Artikel70
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001900
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0001900
        artikel: '69'
      - id: ref3
        bwb_id: BWBR0001900
        artikel: '70'
  - number: '31'
    text: |-
      Deze wet kan worden aangehaald onder den titel: "Landbouwuitvoerwet", met vermelding van het jaartal van het
      *Staatsblad*, waarin zij is afgekondigd.
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel31
  - number: '32'
    text: |-
      1 [Artikel 2 van deze wet ][ref1]treedt in werking met ingang van een door Ons te bepalen tijdstip, dat voor elk
      der daarin genoemde voortbrengselen of soorten daarvan en voor den uitvoer naar verschillende landen verschillend
      kan worden gesteld.

      2 De overige artikelen van deze wet treden in werking met ingang van den dag na dien harer afkondiging in het
      *Staatsblad*.


      [ref1]: https://wetten.overheid.nl/BWBR0001990#Artikel2
    url: https://wetten.overheid.nl/BWBR0001990/1976-07-26#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001990
        artikel: '2'
        paragraaf: '2'
