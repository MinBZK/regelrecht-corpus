        artikel: '2'
  - number: '4'
    text: De belasting wordt geheven met betrekking tot elk motorrijtuig afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel4
  - number: '5'
    text: De belasting wordt geheven van de houder van het motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel5
  - number: '6'
    text: |-
      Als houder wordt aangemerkt:

      a. van een motorrijtuig waarvoor een kentekenbewijs is afgegeven op basis van de [Wegenverkeerswet 1994][ref1],
      degene op wiens naam het kenteken is gesteld;

      b. van een motorrijtuig waarvoor geen kentekenbewijs is afgegeven, degene die het motorrijtuig feitelijk ter
      beschikking heeft;

      c. van een in het buitenland geregistreerd motorrijtuig, degene die het motorrijtuig in Nederland feitelijk ter
      beschikking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '7'
    text: |-
      1 Indien een motorrijtuig als bedoeld in [artikel 6, onderdeel ][ref1], feitelijk en niet geheel voorbijgaand ter
      beschikking staat van een ander dan degene op wiens naam het opgegeven kenteken is gesteld, kan de inspecteur:

      a. deze op gezamenlijk verzoek aanmerken als degene die het motorrijtuig houdt;

      b. deze ambtshalve aanmerken als degene die het motorrijtuig houdt.

      2 De inspecteur neemt de beslissing op het verzoek, bedoeld in het eerste lid, onderdeel *a*, en de beslissing,
      bedoeld in het eerste lid, onderdeel *b*, bij voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel6
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: '6'
        hoofdstuk: III
  - number: '8'
    text: |-
      Als degene die het motorrijtuig feitelijk ter beschikking heeft, wordt beschouwd degene ten aanzien van wie het
      gebruik van de weg is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel8
  - number: '9'
    text: Het tijdvak waarover de belasting moet worden betaald is een dag, een week, een maand of een jaar.
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel9
  - number: '10'
    text: |-
      1 Het tarief bedraagt voor een tijdvak van één jaar voor motorrijtuigen:

      a. met drie assen of minder en in de categorie:

      1°. NIET-EURO € 960

      2°. EURO I € 850

      3°. EURO II en schoner € 750;

      b. met vier assen of meer en in de categorie:

      1°. NIET-EURO € 1550

      2°. EURO I € 1400

      3°. EURO II en schoner € 1250.

      2 Het tarief bedraagt voor een tijdvak van één maand voor motorrijtuigen:

      a. met drie assen of minder en in de categorie:

      1°. NIET-EURO € 96

      2°. EURO I € 85

      3°. EURO II en schoner € 75;

      b. met vier assen of meer en in de categorie:

      1°. NIET-EURO € 155

      2°. EURO I € 140

      3°. EURO II en schoner € 125.

      3 Het tarief bedraagt voor een tijdvak van één week voor motorrijtuigen:

      a. met drie assen of minder en in de categorie:

      1°. NIET-EURO € 26

      2°. EURO I € 23

      3°. EURO II en schoner € 20;

      b. met vier assen of meer en in de categorie:

      1°. NIET-EURO € 41

      2°. EURO I € 37

      3°. EURO II en schoner € 33.

      4 Het tarief bedraagt voor een tijdvak van één dag: € 8.

      5 Onder het aantal assen van een motorrijtuig wordt verstaan het aantal assen van het motorrijtuig tezamen met het
      aantal assen van een met dat motorrijtuig verbonden voertuig, niet zijnde een motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel10
  - number: '11'
    text: |-
      1 De belasting moet op aangifte worden voldaan.

      2 In afwijking van [artikel 19 van de Algemene wet inzake rijksbelastingen][ref1] moet de belasting worden betaald
      vóór de aanvang van het gebruik van de autosnelweg.

      3 Op bij ministeriële regeling aangewezen aangiftepunten kan door invoering van tijdvak, tarief alsmede identiteit
      en nationaliteit van het motorrijtuig in de op deze aangiftepunten aanwezige betalingsapparatuur aangifte worden
      gedaan, gelijktijdig met de ingevolge het tweede lid te verrichten betaling.

      4 [Hoofdstuk II van de Algemene wet inzake rijksbelastingen][ref2] is, met uitzondering van
      [artikel 8, derde lid, van die wet][ref3], niet van toepassing op de in het derde lid bedoelde aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel8
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '8'
  - number: '13'
    text: |-
      1 Indien wordt geconstateerd dat de verschuldigde belasting niet, niet tijdig of niet geheel is betaald, vormt
      dit een verzuim ter zake waarvan de inspecteur, in afwijking van de [artikelen 67b][ref1], [67c][ref2] en
      [67f van de Algemene wet inzake rijksbelastingen][ref3], een bestuurlijke boete van ten hoogste € 4 920 kan
      opleggen aan de houder.

      2 [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref4] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het eerste lid.

      3 Indien de verschuldigde belasting wordt nageheven, legt de inspecteur de boete op gelijktijdig
      met de vaststelling van de naheffingsaanslag. In andere gevallen vervalt, in afwijking van
      [artikel 5:45, tweede lid, van de Algemene wet bestuursrecht][ref5], de bevoegdheid tot het opleggen van de boete
      door verloop van vijf jaren na het einde van het kalenderjaar waarin het in het eerste of tweede lid bedoelde
      constateren heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67cb
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel545
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel13
    references:
