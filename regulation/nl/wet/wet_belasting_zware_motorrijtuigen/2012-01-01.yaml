preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het op 9 februari 1994 te Brussel tot stand gekomen verdrag inzake
    de heffing van rechten voor het gebruik van bepaalde wegen door zware vrachtwagens ingevolge artikel 91, eerste
    lid, van de Grondwet de goedkeuring van de Staten-Generaal behoeft, alvorens het Koninkrijk daaraan kan worden
    gebonden; alsmede dat het wenselijk is, gelet op dit verdrag en gelet op de richtlijn nr. 93/89/EEG van de Raad
    van de Europese Gemeenschappen van 25 oktober 1993 (PbEG L 279) betreffende de toepassing door de Lid-Staten van
    de belastingen op sommige voor het goederenvervoer over de weg gebruikte voertuigen en van de voor het gebruik van
    sommige infrastructuurvoorzieningen geheven tolgelden en gebruiksrechten, een belasting te heffen met betrekking
    tot zware motorrijtuigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het op 9 februari 1994 te Brussel tot stand gekomen verdrag inzake de heffing van rechten voor het gebruik van
      bepaalde wegen door zware vrachtwagens, waarvan de Nederlandse en Franse tekst is geplaatst in *Tractatenblad*
      1994, 69, wordt goedgekeurd voor Nederland.
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel1
  - number: '2'
    text: |-
      Het gemeenschappelijke gebruiksrecht, bedoeld in het in [artikel 1][ref1] genoemde verdrag, wordt in Nederland
      onder de naam "belasting zware motorrijtuigen" geheven ter zake van het gebruik van de autosnelweg met een zwaar
      motorrijtuig.


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel1
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: '1'
        hoofdstuk: I
  - number: '3'
    text: |-
      In deze wet en in de daarop berustende regelingen wordt verstaan onder:

      a. zwaar motorrijtuig: een motorrijtuig als bedoeld in [artikel 2, onderdeel ][ref1], uitsluitend bestemd voor
      het goederenvervoer over de weg, waarvan de toegestane maximum massa 12 000 kilogram of meer bedraagt dan wel
      waarvan de toegestane maximum massa vermeerderd met de toegestane maximum massa van het voertuig, niet zijnde een
      motorrijtuig, dat door dat motorrijtuig wordt voortbewogen, 12 000 kilogram of meer bedraagt;

      b. toegestane maximum massa: de eigen massa van het voertuig vermeerderd met de voor het voertuig toegestane
      maximum massa aan lading;

      c. weg: elke voor het openbaar rijverkeer of ander verkeer openstaande weg en elk zodanig pad, de in de weg of het
      pad liggende bruggen en duikers alsmede de tot de weg behorende paden en bermen of zijkanten;

      d. autosnelweg: een weg die speciaal is ontworpen en aangelegd voor verkeer met motorrijtuigen, zonder uitwegen
      naar aanliggende percelen, en die:

      1°. behalve op bepaalde plaatsen of tijdelijk is voorzien van gescheiden rijbanen voor beide verkeersrichtingen,
      welke rijbanen van elkaar gescheiden zijn door een strook die niet voor het verkeer is bestemd, hetzij, bij
      uitzondering, op andere wijze;

      2°. geen andere weg, geen spoor- of tramweg of voetpad gelijkvloers kruist; en

      3°. door specifieke verkeerstekens als autosnelweg is aangeduid;

      e. categorie NIET-EURO: motorrijtuigen waarvan de motor niet voldoet aan de eisen, vastgelegd in regel A of regel
      B van de tabel in punt 8.3.1.1 van bijlage I bij [richtlijn nr. 88/77/EEG](31988L0077) van de Raad van 3 december
      1987 inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten met betrekking tot maatregelen tegen de
      emissie van verontreinigende gassen en deeltjes door dieselmotoren bestemd voor het aandrijven van voertuigen (PbEG
      L 36), naar de tekst zoals deze is gewijzigd bij [richtlijn nr. 91/542/EEG](31991L0542) van de Raad van 1 oktober
      1991 (PbEG L 295);

      f. categorie EURO I: motorrijtuigen waarvan de motor voldoet aan de eisen, vastgelegd in regel A van de tabel,
      genoemd onder e;

      g. categorie EURO II en schoner: motorrijtuigen waarvan de motor voldoet aan de eisen, vastgelegd in regel B van de
      tabel, genoemd onder e.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel2
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel3
    references:
      - id: ref1
