      - id: ref5
        bwb_id: BWBR0005537
        artikel: 5:45
  - number: '14'
    text: |-
      1 Op verzoek wordt aan de houder van het motorrijtuig teruggaaf van belasting verleend.

      2 De teruggaaf wordt verleend over het op de datum van indiening van het verzoek nog niet verstreken aantal dagen
      van het tijdvak. [Artikel 14a, zesde lid][ref1], is van overeenkomstige toepassing.

      3 Het verzoek om teruggaaf wordt gedaan bij de inspecteur, die daarop bij voor bezwaar vatbare beschikking beslist.

      4 De ingevolge het tweede lid berekende teruggaaf wordt verminderd met een bedrag van € 25 voor
      administratiekosten. Onder bij ministeriële regeling te stellen voorwaarden wordt geen vermindering toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel14a
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: 14a
        hoofdstuk: VII
        afdeling: '1'
  - number: 14a
    text: |-
      1 Voor motorrijtuigen die worden gebruikt voor gecombineerd vervoer wordt op verzoek teruggaaf verleend van de
      belasting of een gedeelte daarvan.

      2 Onder gecombineerd vervoer wordt verstaan: het goederenvervoer tussen lidstaten van de Europese Unie waarbij de
      vrachtwagen, de aanhangwagen, de oplegger met of zonder trekker, de wissellaadbak of de container van 20 voet en
      meer gebruik maken van de weg voor het eerste of het laatste gedeelte in het traject, en voor het andere gedeelte
      van het spoor of de binnenwateren, of van een zeetraject wanneer dat traject meer bedraagt dan 100 km hemelsbreed
      gemeten, en het begin- of het eindvervoer over de weg verrichten:

      a. hetzij tussen de laadplaats van de goederen en het dichtstbij gelegen geschikte station van inlading, wat het
      beginvervoer betreft, en tussen het dichtstbij gelegen geschikte station van uitlading en de losplaats van de
      goederen, wat het eindvervoer betreft;

      b. hetzij binnen een afstand van ten hoogste 150 km hemelsbreed gemeten, vanaf de rivier- of zeehaven van in- of
      uitlading.

      3 Indien goederen worden vervoerd over zee of per spoor, wordt dat vervoer, in afwijking in zoverre van het tweede
      lid, slechts begrepen onder gecombineerd vervoer indien voor het betreffende traject over zee of per spoor een
      alternatief vervoerstraject over de weg voorhanden is.

      4 De teruggaaf wordt verleend voor iedere dag waarop het motorrijtuig is gebruikt voor een begin- of eindtraject
      over de weg dat deel uitmaakt van een traject van gecombineerd vervoer, waarbij de plaats van in- of uitlading van
      de vrachtwagen, de aanhangwagen, de oplegger met of zonder trekker, de wissellaadbak of de container van 20 voet en
      meer in Nederland is gelegen.

      5 De periode waarover de teruggaaf wordt uitbetaald, is niet korter dan drie maanden.

      6 De teruggaaf voor een dag bedraagt voor een motorrijtuig waarvoor de belasting is betaald over een tijdvak van:

      a. een dag: de voor het motorrijtuig over het tijdvak betaalde belasting;

      b. een week: een zevende deel van de voor het motorrijtuig over het tijdvak betaalde belasting;

      c. een maand: een dertigste deel van de voor het motorrijtuig over het tijdvak betaalde belasting;

      d. een jaar: een driehonderdvijfenzestigste deel van de voor het motorrijtuig over het tijdvak betaalde belasting.

      7 Het verzoek om teruggaaf wordt gedaan bij de inspecteur, die daarop bij voor bezwaar vatbare beschikking beslist.

      8 Bij ministeriële regeling kunnen nadere voorwaarden en beperkingen worden gesteld ter uitvoering van de teruggaaf
      en met betrekking tot de administratieve vereisten waaraan voldaan moet worden om voor teruggaaf in aanmerking
      te komen.
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel14a
  - number: '15'
    text: |-
      1 Vrijstelling van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen,
      verleend voor motorrijtuigen:

      a. die uitsluitend worden gebruikt door defensie;

      b. die uitsluitend worden gebruikt door politie en brandweer en als zodanig uiterlijk herkenbaar zijn;

      c. die behoren tot een bedrijfsvoorraad, bedoeld in
      [artikel 2, onderdeel i, van de Wet op de motorrijtuigenbelasting 1994][ref1];

      d. die zijn ingericht en uitsluitend worden gebruikt voor de aanleg en het onderhoud van wegen;

      e. waarmee gewoonlijk slechts over een geringe afstand gebruik van de autosnelweg wordt gemaakt;

      f. die uitsluitend worden gebruikt voor het vervoer van kermis- of circusbenodigdheden.

      2 [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] is van toepassing op verzoeken aan de inspecteur tot
      vrijstelling als bedoeld in het eerste lid, onderdeel e.


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel15
