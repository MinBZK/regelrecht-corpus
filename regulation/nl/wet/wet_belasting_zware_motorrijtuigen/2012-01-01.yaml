  - number: '21'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels
      worden gesteld ter aanvulling van de in deze wet geregelde onderwerpen.

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0007678/2012-01-01#Artikel21
  - number: '26'
    text: |-
      1 Deze wet treedt in werking met ingang van 1 december 1995, met uitzondering van [artikel 1][ref1], dat in werking
      treedt met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst.

      2 In afwijking in zoverre van het eerste lid vangt het eerste tijdvak waarover de belasting ingevolge deze wet kan
      worden geheven, aan met ingang van 1 januari 1996.


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel1
