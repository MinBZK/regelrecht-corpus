$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_belasting_zware_motorrijtuigen
regulatory_layer: WET
publication_date: '2022-08-30'
valid_from: '2020-01-01'
bwb_id: BWBR0007678
url: https://wetten.overheid.nl/BWBR0007678/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het op 9 februari 1994 te Brussel tot stand gekomen verdrag inzake
    de heffing van rechten voor het gebruik van bepaalde wegen door zware vrachtwagens ingevolge artikel 91, eerste
    lid, van de Grondwet de goedkeuring van de Staten-Generaal behoeft, alvorens het Koninkrijk daaraan kan worden
    gebonden; alsmede dat het wenselijk is, gelet op dit verdrag en gelet op de richtlijn nr. 93/89/EEG van de Raad
    van de Europese Gemeenschappen van 25 oktober 1993 (PbEG L 279) betreffende de toepassing door de Lid-Staten van
    de belastingen op sommige voor het goederenvervoer over de weg gebruikte voertuigen en van de voor het gebruik van
    sommige infrastructuurvoorzieningen geheven tolgelden en gebruiksrechten, een belasting te heffen met betrekking
    tot zware motorrijtuigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het op 9 februari 1994 te Brussel tot stand gekomen verdrag inzake de heffing van rechten voor het gebruik van
      bepaalde wegen door zware vrachtwagens, waarvan de Nederlandse en Franse tekst is geplaatst in *Tractatenblad*
      1994, 69, wordt goedgekeurd voor Nederland.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel1
  - number: '2'
    text: |-
      Het gemeenschappelijke gebruiksrecht, bedoeld in het in [artikel 1][ref1] genoemde verdrag, wordt in Nederland
      onder de naam "belasting zware motorrijtuigen" geheven ter zake van het gebruik van de autosnelweg met een zwaar
      motorrijtuig.


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel1
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: '1'
        hoofdstuk: I
  - number: '3'
    text: 'In deze wet en in de daarop berustende regelingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel3
  - number: 3.a
    text: |-
      zwaar motorrijtuig: een motorrijtuig als bedoeld in [artikel 2, onderdeel ][ref1], bestemd of gebruikt voor
      het goederenvervoer over de weg, waarvan de toegestane maximum massa 12 000 kilogram of meer bedraagt dan wel
      waarvan de toegestane maximum massa vermeerderd met de toegestane maximum massa van het voertuig, niet zijnde een
      motorrijtuig, dat door dat motorrijtuig wordt voortbewogen, 12 000 kilogram of meer bedraagt;


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel2
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '2'
  - number: 3.b
    text: |-
      toegestane maximum massa: de eigen massa van het voertuig vermeerderd met de voor het voertuig toegestane maximum
      massa aan lading;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel3
  - number: 3.c
    text: |-
      weg: elke voor het openbaar rijverkeer of ander verkeer openstaande weg en elk zodanig pad, de in de weg of het pad
      liggende bruggen en duikers alsmede de tot de weg behorende paden en bermen of zijkanten;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel3
  - number: 3.d
    text: |-
      autosnelweg: een weg die speciaal is ontworpen en aangelegd voor verkeer met motorrijtuigen, zonder uitwegen naar
      aanliggende percelen, en die:
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel3
  - number: 3.d.1°
    text: |-
      behalve op bepaalde plaatsen of tijdelijk is voorzien van gescheiden rijbanen voor beide verkeersrichtingen, welke
      rijbanen van elkaar gescheiden zijn door een strook die niet voor het verkeer is bestemd, hetzij, bij uitzondering,
      op andere wijze;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel3
  - number: 3.d.2°
    text: geen andere weg, geen spoor- of tramweg of voetpad gelijkvloers kruist; en
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel3
  - number: 3.d.3°
    text: door specifieke verkeerstekens als autosnelweg is aangeduid;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel3
  - number: 3.e
    text: |-
      richtlijn: [Richtlijn 1999/62/EG](31999L0062) van het Europees Parlement en de Raad van 17 juni 1999 betreffende
      het in rekening brengen van het gebruik van bepaalde infrastructuurvoorzieningen aan zware vrachtvoertuigen (PbEG
      1999, L 187);
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel3
  - number: 3.f
    text: |-
      categorieën EURO 0, EURO I, EURO II, EURO III, EURO IV en EURO V: motorrijtuigen met een emissiegrenswaarde als
      bedoeld in de respectievelijke tabel van bijlage 0 bij de richtlijn;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel3
  - number: 3.g
    text: |-
      categorie EURO VI en schoner: motorrijtuigen met een emissiegrenswaarde als bedoeld in bijlage I bij Verordening
      (EG) nr. 595/2009 van het Europees Parlement en de Raad van 18 juni 2009 betreffende de typegoedkeuring van
      motorvoertuigen en motoren met betrekking tot emissies van zware bedrijfsvoertuigen (Euro VI) en de toegang tot
      reparatie- en onderhoudsinformatie, tot wijziging van Verordening (EG) nr. 715/2007 en [Richtlijn 2007/46/EG]
      (32007L0046) en tot intrekking van de [Richtlijnen 80/1269/EEG](31980L1269), [2005/55/EG](32005L0055) en [2005/78/
      EG](32005L0078) (PbEG 2009, L 188), of een lagere emissiegrenswaarde (PbEU 2009, L 188).
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel3
  - number: '4'
    text: De belasting wordt geheven met betrekking tot elk motorrijtuig afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel4
  - number: '5'
    text: De belasting wordt geheven van de houder van het motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel5
  - number: '6'
    text: 'Als houder wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel6
  - number: 6.a
    text: |-
      van een motorrijtuig dat in het kentekenregister, genoemd in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1], is ingeschreven op basis van de
      [Wegenverkeerswet 1994][ref2], degene op wiens naam het motorrijtuig is gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006622
  - number: 6.b
    text: |-
      van een motorrijtuig dat niet in het kentekenregister, genoemd in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref1], is ingeschreven, degene die het
      motorrijtuig feitelijk ter beschikking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 6.c
    text: |-
      van een in het buitenland geregistreerd motorrijtuig, degene die het motorrijtuig in Nederland feitelijk ter
      beschikking heeft.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      Indien een motorrijtuig als bedoeld in [artikel 6, onderdeel a][ref1], feitelijk en niet geheel voorbijgaand ter
      beschikking staat van een ander dan degene op wiens naam het motorrijtuig in het kentekenregister, genoemd in
      [artikel 1, eerste lid, onderdeel i, van de Wegenverkeerswet 1994][ref2], is gesteld, kan de inspecteur:


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel1
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: '6'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '1'
  - number: 7.1.a
    text: deze op gezamenlijk verzoek aanmerken als degene die het motorrijtuig houdt;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel7
  - number: 7.1.b
    text: deze ambtshalve aanmerken als degene die het motorrijtuig houdt.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel7
  - number: '7.2'
    text: |-
      De inspecteur neemt de beslissing op het verzoek, bedoeld in het eerste lid, onderdeel *a*, en de beslissing,
      bedoeld in het eerste lid, onderdeel *b*, bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel7
  - number: '8'
    text: |-
      Als degene die het motorrijtuig feitelijk ter beschikking heeft, wordt beschouwd degene ten aanzien van wie het
      gebruik van de autosnelweg is geconstateerd, met dien verstande dat ingeval het gebruik van de autosnelweg met een
      in het buitenland geregistreerd motorrijtuig wordt geconstateerd zonder dat gevorderd wordt het motorrijtuig te
      doen stilstaan, degene op wiens naam het buitenlandse kenteken is gesteld wordt beschouwd als degene ten aanzien
      van wie het gebruik van de autosnelweg is geconstateerd.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel8
  - number: '9'
