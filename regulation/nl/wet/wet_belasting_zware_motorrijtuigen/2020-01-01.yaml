  - number: '10.4'
    text: 'Het tarief bedraagt voor een tijdvak van één dag: € 12.'
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel10
  - number: '10.5'
    text: |-
      Onder het aantal assen van een motorrijtuig wordt verstaan het aantal assen van het motorrijtuig tezamen met het
      aantal assen van een met dat motorrijtuig verbonden voertuig, niet zijnde een motorrijtuig.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel10
  - number: '10.6'
    text: |-
      Indien de Euronorm van een motorrijtuig niet is geregistreerd, wordt voor de bepaling van de Euronorm uitgegaan van
      de datum van eerste toelating van dit motorrijtuig zoals vermeld in het kentekenregister.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel10
  - number: '10.7'
    text: |-
      Het motorrijtuig waarvan ten aanzien van de Euronorm geen aantekening in het kentekenregister of op het
      kentekenbewijs aanwezig is, wordt voor de toepassing van het eerste, tweede en derde lid aangemerkt als:
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel10
  - number: 10.7.a
    text: |-
      EURO 0 – motorrijtuig wanneer blijkens de aantekening in het kentekenregister of op het kentekenbewijs de datum
      voor de eerste toelating tot het verkeer voor 1 juli 1992 ligt;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel10
  - number: 10.7.b
    text: |-
      EURO I – motorrijtuig wanneer blijkens de aantekening in het kentekenregister of op het kentekenbewijs de datum
      voor de eerste toelating tot het verkeer na 30 juni 1992 maar voor 1 oktober 1995 ligt;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel10
  - number: 10.7.c
    text: |-
      EURO II – motorrijtuig wanneer blijkens de aantekening in het kentekenregister of op het kentekenbewijs de datum
      voor de eerste toelating tot het verkeer na 30 september 1995 maar voor 1 oktober 2000 ligt;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel10
  - number: 10.7.d
    text: |-
      EURO III – motorrijtuig wanneer blijkens de aantekening in het kentekenregister of op het kentekenbewijs de datum
      voor de eerste toelating tot het verkeer na 30 september 2000 maar voor 1 oktober 2005 ligt;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel10
  - number: 10.7.e
    text: |-
      EURO IV – motorrijtuig wanneer blijkens de aantekening in het kentekenregister of op het kentekenbewijs de datum
      voor de eerste toelating tot het verkeer na 30 september 2005 maar voor 1 oktober 2008 ligt;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel10
  - number: 10.7.f
    text: |-
      EURO V – motorrijtuig wanneer blijkens de aantekening in het kentekenregister of op het kentekenbewijs de datum
      voor de eerste toelating tot het verkeer na 30 september 2008 maar voor 1 januari 2013 ligt;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel10
  - number: 10.7.g
    text: |-
      EURO VI – motorrijtuig en schoner wanneer blijkens de aantekening in het kentekenregister of op het kentekenbewijs
      de datum voor de eerste toelating tot het verkeer na 31 december 2012 ligt.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel10
  - number: '11.1'
    text: De belasting moet op aangifte worden voldaan.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel11
  - number: '11.2'
    text: |-
      In afwijking van [artikel 19 van de Algemene wet inzake rijksbelastingen][ref1] moet de belasting worden betaald
      vóór de aanvang van het gebruik van de autosnelweg.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel19
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '19'
  - number: '11.3'
    text: |-
      Op bij ministeriële regeling aangewezen aangiftepunten kan door invoering van tijdvak, tarief alsmede identiteit
      en nationaliteit van het motorrijtuig in de op deze aangiftepunten aanwezige betalingsapparatuur aangifte worden
      gedaan, gelijktijdig met de ingevolge het tweede lid te verrichten betaling.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel11
  - number: '11.4'
    text: |-
      [Hoofdstuk II van de Algemene wet inzake rijksbelastingen][ref1] is, met uitzondering van
      [artikel 8, tweede lid, van die wet][ref2], niet van toepassing op de in het derde lid bedoelde aangifte.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel8
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002320
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '8'
  - number: '13.1'
    text: |-
      Indien wordt geconstateerd dat de verschuldigde belasting niet, niet tijdig of niet geheel is betaald, vormt
      dit een verzuim ter zake waarvan de inspecteur, in afwijking van de [artikelen 67b][ref1], [67c][ref2] en
      [67f van de Algemene wet inzake rijksbelastingen][ref3], een bestuurlijke boete van ten hoogste € 5.514 kan
      opleggen aan de houder.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67b
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel67c
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel67f
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67b
      - id: ref2
        bwb_id: BWBR0002320
        artikel: 67c
      - id: ref3
        bwb_id: BWBR0002320
        artikel: 67f
  - number: '13.2'
    text: |-
      [Artikel 67cb van de Algemene wet inzake rijksbelastingen][ref1] is van overeenkomstige toepassing op het bedrag
      van de boete, genoemd in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel67cb
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 67cb
  - number: '13.3'
    text: |-
      Indien de verschuldigde belasting wordt nageheven, legt de inspecteur de boete op gelijktijdig
      met de vaststelling van de naheffingsaanslag. In andere gevallen vervalt, in afwijking van
      [artikel 5:45, tweede lid, van de Algemene wet bestuursrecht][ref1], de bevoegdheid tot het opleggen van de boete
      door verloop van vijf jaren na het einde van het kalenderjaar waarin de constatering, bedoeld in het eerste lid,
      heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '14.1'
    text: Op verzoek wordt aan de houder van het motorrijtuig teruggaaf van belasting verleend.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      De teruggaaf wordt verleend over het op de datum van indiening van het verzoek nog niet verstreken aantal dagen van
      het tijdvak. [Artikel 14a, zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel14a
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: 14a
        hoofdstuk: VII
        afdeling: '1'
  - number: '14.3'
    text: Het verzoek om teruggaaf wordt gedaan bij de inspecteur, die daarop bij voor bezwaar vatbare beschikking beslist.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14
  - number: '14.4'
    text: |-
      De ingevolge het tweede lid berekende teruggaaf wordt verminderd met een bedrag van € 25 voor administratiekosten.
      Onder bij ministeriële regeling te stellen voorwaarden wordt geen vermindering toegepast.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14
  - number: 14a.1
    text: |-
      Voor motorrijtuigen die worden gebruikt voor gecombineerd vervoer wordt op verzoek teruggaaf verleend van de
      belasting of een gedeelte daarvan.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.2
    text: |-
      Onder gecombineerd vervoer wordt verstaan: het goederenvervoer tussen lidstaten van de Europese Unie waarbij de
      vrachtwagen, de aanhangwagen, de oplegger met of zonder trekker, de wissellaadbak of de container van 20 voet en
      meer gebruik maken van de weg voor het eerste of het laatste gedeelte in het traject, en voor het andere gedeelte
      van het spoor of de binnenwateren, of van een zeetraject wanneer dat traject meer bedraagt dan 100 km hemelsbreed
      gemeten, en het begin- of het eindvervoer over de weg verrichten:
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.2.a
    text: |-
      hetzij tussen de laadplaats van de goederen en het dichtstbij gelegen geschikte station van inlading, wat het
      beginvervoer betreft, en tussen het dichtstbij gelegen geschikte station van uitlading en de losplaats van de
      goederen, wat het eindvervoer betreft;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.2.b
    text: |-
      hetzij binnen een afstand van ten hoogste 150 km hemelsbreed gemeten, vanaf de rivier- of zeehaven van in- of
      uitlading.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.3
    text: |-
      Indien goederen worden vervoerd over zee of per spoor, wordt dat vervoer, in afwijking in zoverre van het tweede
      lid, slechts begrepen onder gecombineerd vervoer indien voor het betreffende traject over zee of per spoor een
      alternatief vervoerstraject over de weg voorhanden is.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.4
    text: |-
      De teruggaaf wordt verleend voor iedere dag waarop het motorrijtuig is gebruikt voor een begin- of eindtraject over
      de weg dat deel uitmaakt van een traject van gecombineerd vervoer, waarbij de plaats van in- of uitlading van de
      vrachtwagen, de aanhangwagen, de oplegger met of zonder trekker, de wissellaadbak of de container van 20 voet en
      meer in Nederland is gelegen.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.5
    text: De periode waarover de teruggaaf wordt uitbetaald, is niet korter dan drie maanden.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.6
    text: 'De teruggaaf voor een dag bedraagt voor een motorrijtuig waarvoor de belasting is betaald over een tijdvak van:'
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.6.a
    text: 'een dag: de voor het motorrijtuig over het tijdvak betaalde belasting;'
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.6.b
    text: 'een week: een zevende deel van de voor het motorrijtuig over het tijdvak betaalde belasting;'
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.6.c
    text: 'een maand: een dertigste deel van de voor het motorrijtuig over het tijdvak betaalde belasting;'
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.6.d
    text: 'een jaar: een driehonderdvijfenzestigste deel van de voor het motorrijtuig over het tijdvak betaalde belasting.'
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.7
    text: Het verzoek om teruggaaf wordt gedaan bij de inspecteur, die daarop bij voor bezwaar vatbare beschikking beslist.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: 14a.8
    text: |-
      Bij ministeriële regeling kunnen nadere voorwaarden en beperkingen worden gesteld ter uitvoering van de teruggaaf
      en met betrekking tot de administratieve vereisten waaraan voldaan moet worden om voor teruggaaf in aanmerking
      te komen.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel14a
  - number: '15.1'
    text: |-
      Vrijstelling van belasting wordt, onder bij algemene maatregel van bestuur te stellen voorwaarden en beperkingen,
      verleend voor motorrijtuigen:
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel15
  - number: 15.1.a
    text: die uitsluitend worden gebruikt door defensie;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel15
  - number: 15.1.b
    text: die uitsluitend worden gebruikt door politie en brandweer en als zodanig uiterlijk herkenbaar zijn;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel15
  - number: 15.1.c
    text: |-
      die behoren tot een bedrijfsvoorraad, bedoeld in
      [artikel 2, onderdeel i, van de Wet op de motorrijtuigenbelasting 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006324#Artikel2
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0006324
        artikel: '2'
  - number: 15.1.d
    text: die zijn ingericht en uitsluitend worden gebruikt voor de aanleg en het onderhoud van wegen;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel15
  - number: 15.1.e
    text: waarmee gewoonlijk slechts over een geringe afstand gebruik van de autosnelweg wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel15
  - number: 15.1.f
    text: die uitsluitend worden gebruikt voor het vervoer van kermis- of circusbenodigdheden.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel15
  - number: '15.2'
    text: |-
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op verzoeken aan de inspecteur tot
      vrijstelling als bedoeld in het eerste lid, onderdeel e.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '16'
    text: |-
      Voor motorrijtuigen die in Griekenland geregistreerd staan wordt tot 1 juli 2002 een reductie van 50% toegepast op
      het tarief, genoemd in [artikel 10, eerste tot en met vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel10
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: '10'
        hoofdstuk: IV
        afdeling: '2'
  - number: '17'
    text: |-
      Bij algemene maatregel van bestuur kunnen met name om redenen van verkeersveiligheid bepaalde wegen, niet zijnde
      autosnelwegen, of delen daarvan worden aangewezen waarvan het gebruik aan de belasting is onderworpen.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel17
  - number: '18.1'
    text: |-
      Op eerste vordering van ambtenaren van de rijksbelastingdienst, van opsporingsambtenaren als bedoeld in
      [artikel 141 van het Wetboek van Strafvordering][ref1], of van bij besluit van Onze Minister van Financiën in
      overeenstemming met Onze Minister van Infrastructuur en Waterstaat aangewezen ambtenaren van het Ministerie van
      Infrastructuur en Waterstaat, is de bestuurder van een motorrijtuig verplicht dat te doen stilstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '18.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel18
  - number: '19'
    text: |-
      De in [artikel 18][ref1] bedoelde ambtenaren zijn bevoegd een motorrijtuig, alsmede het daarmee verbonden voertuig
      te onderwerpen aan een onderzoek en het daartoe te brengen of te doen brengen naar een nabij gelegen plaats.
      De bestuurder van het motorrijtuig of bij diens afwezigheid degene die het motorrijtuig houdt, is verplicht
      desgevorderd zijn voor het onderzoek en het vervoer noodzakelijke medewerking te verlenen en de ambtenaren met het
      motorrijtuig te vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel18
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: '18'
        hoofdstuk: VIII
  - number: '20.1'
    text: |-
      Voorzover ter zake van een motorrijtuig het gemeenschappelijke gebruiksrecht, bedoeld in het in [artikel 1][ref1]
      genoemde verdrag, buiten Nederland is voldaan vóór aanvang van het gebruik van de autosnelweg in Nederland, blijft
      de heffing in Nederland achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel1
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: '1'
        hoofdstuk: I
  - number: '20.2'
    text: |-
      Indien het gemeenschappelijke gebruiksrecht buiten Nederland is voldaan, is daarop [artikel 14a][ref1] van
      overeenkomstige toepassing. De teruggaaf wordt verleend op basis van het in [artikel 10][ref2] bedoelde tarief,
      zoals dat gold voor het tijdvak waarvoor het gemeenschappelijke gebruiksrecht is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0007678#Artikel10
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: 14a
        hoofdstuk: VII
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0007678
        artikel: '10'
        hoofdstuk: IV
        afdeling: '2'
  - number: '21.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen ter verzekering van een juiste toepassing van de wet nadere regels worden
      gesteld ter aanvulling van de in deze wet geregelde onderwerpen.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel21
  - number: '21.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten behoeve van de uitvoering van de in het eerste
      lid bedoelde algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel21
  - number: '26.1'
    text: |-
      Deze wet treedt in werking met ingang van 1 december 1995, met uitzondering van [artikel 1][ref1], dat in werking
      treedt met ingang van de dag na de datum van uitgifte van het *Staatsblad* waarin zij wordt geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0007678#Artikel1
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007678
        artikel: '1'
        hoofdstuk: I
  - number: '26.2'
    text: |-
      In afwijking in zoverre van het eerste lid vangt het eerste tijdvak waarover de belasting ingevolge deze wet kan
      worden geheven, aan met ingang van 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel26
  - number: '27'
    text: 'Deze wet wordt aangehaald als: Wet belasting zware motorrijtuigen.'
    url: https://wetten.overheid.nl/BWBR0007678/2020-01-01#Artikel27
