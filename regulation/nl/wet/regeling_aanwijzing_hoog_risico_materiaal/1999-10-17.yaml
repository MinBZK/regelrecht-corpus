  - number: '2'
    text: |-
      Ten aanzien van dierlijk afval als bedoeld in [artikel 1, onderdelen a en b][ref1], is
      [artikel 17, eerste en derde lid, van de Destructiewet][ref2] van overeenkomstige toepassing.


