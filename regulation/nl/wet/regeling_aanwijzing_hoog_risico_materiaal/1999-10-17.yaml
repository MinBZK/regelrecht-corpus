preamble:
  text: |-
    Gelet op artikel 2, tweede lid, van de Destructiewet;

    Gezien het advies van de Destructieraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007330/1999-10-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Als dierlijk afval als bedoeld in [artikel 2, tweede lid, van de Destructiewet][ref1] worden aangewezen:

      a. op één of meer door het gemeentebestuur aangewezen plaatsen bijeengebrachte vogels die vermoedelijk zijn
      gestorven ten gevolge van intoxicatie door Clostridium Botulinum;

      b. op één of meer door het gemeentebestuur aangewezen plaatsen bijeengebrachte vissen die vermoedelijk zijn
      gestorven ten gevolge van de vrieskou.

      c. dieren, gestorven in dierentuinen, met uitzondering van dode dieren of delen van dode dieren die ter plekke
      aan dierentuindieren ter vervoedering worden aangeboden en van die dode dieren of delen van dode dieren die voor
      educatieve doeleinden worden gebruikt;

      d. materiaal van dierlijke herkomst, dat ingevolge de [Veewet][ref2] onschadelijk moet worden gemaakt;

      e. vlees, gehakt, vleesbereidingen of vleesprodukten afkomstig van runderen die in het Verenigd Koninkrijk zijn
      geslacht en vóór 28 maart 1996 binnen Nederlands grondgebied zijn gebracht;

      f. overige dierlijke produkten als bedoeld in artikel 11.2, onderdeel f, l, onderscheidenlijk m, van de Regeling
      keuring en handel dierlijke produkten afkomstig van runderen die in het Verenigd Koninkrijk zijn geslacht en in de
      periode tussen 23 en 28 maart 1996 binnen Nederlands grondgebied zijn gebracht;

      g. uit het Verenigd Koninkrijk afkomstige en in Nederland ingevoerde dieren als bedoeld in artikel 3.8, tweede
      lid, van de Regeling handel levende dieren en levende produkten, die ingevolge artikel 3.10 van deze regeling zijn
      gedood, alsmede het vrijgekomen bloed van deze dieren.


      [ref1]: https://wetten.overheid.nl/BWBR0002244#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001900
