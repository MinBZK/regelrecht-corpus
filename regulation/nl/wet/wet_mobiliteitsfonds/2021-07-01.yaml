preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is het Infrastructuurfonds ter verruiming van de
    reikwijdte om te vormen tot een Mobiliteitsfonds en daartoe de Wet Infrastructuurfonds te vervangen door de Wet
    Mobiliteitsfonds;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0044860/2021-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *basisinformatie:* gegevens nodig voor het beschrijven van het verkeer of vervoer van personen of goederen met
      het oog op aanleg, verbetering of gebruik van infrastructuur;
        - *bediening:* handelingen ten behoeve van verkeersbeheersing of -begeleiding of die nodig zijn om gebruik mogelijk
      te maken;
        - *fonds:* Mobiliteitsfonds, bedoeld in [artikel 2, eerste lid][ref1];
        - *infrastructuur:* onroerende zaken ten behoeve van verkeer of vervoer van personen of goederen met daarbij
      behorende voorzieningen ten behoeve van de verkeersveiligheid, verkeersmanagement en bescherming van het milieu;
        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0044860#Artikel2
    url: https://wetten.overheid.nl/BWBR0044860/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0044860
        artikel: '2'
  - number: '2'
    text: |-
      1 Er is een Mobiliteitsfonds.

      2 Het fonds heeft ten doel het faciliteren van de bereikbaarheid van heel Nederland door veilige, innovatieve en
      duurzame mobiliteit van personen en goederen door middel van financiering en bekostiging van:

      a. aanleg, verbetering, beheer en onderhoud en bediening van infrastructuur die door het Rijk wordt beheerd;

      b. aanleg, verbetering, beheer en onderhoud en bediening van infrastructuur die niet door het Rijk wordt beheerd;

      c. maatregelen en voorzieningen waarmee wordt beoogd de doelmatigheid of de veiligheid van het gebruik van
      infrastructuur als bedoeld in de onderdelen a en b, te vergroten; en

      d. het inwinnen, bewerken en verspreiden van met onderdeel a samenhangende basisinformatie, onderzoek ter
      voorbereiding van maatregelen of voorzieningen als bedoeld in de onderdelen a, b en c, en proefprojecten en
      experimenten gericht op maatregelen of voorzieningen als bedoeld in de onderdelen a, b en c.
    url: https://wetten.overheid.nl/BWBR0044860/2021-07-01#Artikel2
  - number: '3'
    text: |-
      1 Het fonds is een begrotingsfonds als bedoeld in [artikel 2.11, eerste lid, van de Comptabiliteitswet 2016][ref1].

      2 Onze Minister beheert het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2.11
    url: https://wetten.overheid.nl/BWBR0044860/2021-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2.11'
  - number: '4'
    text: |-
      1 Jaarlijks biedt Onze Minister gelijktijdig met het voorstel van wet tot vaststelling van de begrotingsstaat van
      het fonds een Meerjarenprogramma Infrastructuur, Ruimte en Transport aan de Staten-Generaal aan.

      2 In het meerjarenprogramma wordt, voor zover als redelijkerwijze mogelijk is, beschreven hoe de middelen van
      het fonds voor het faciliteren van mobiliteit worden verdeeld over afzonderlijke projecten, projectpakketten of
      beleidsterreinen.

      3 Het meerjarenprogramma verschaft informatie over de uitgaven die ten laste van de rijksbegroting worden gebracht
      om mobiliteit te faciliteren. Het maakt tevens zichtbaar welk verband er daarbij bestaat tussen de via het
      fonds gefinancierde en bekostigde uitgaven en de daaruit voortvloeiende uitgaven via andere begrotingen van de
      rijksbegroting, waaronder de exploitatiesubsidies openbaar vervoer.

      4 Het meerjarenprogramma bevat een overzicht van de wijzigingen ten opzichte van het voorgaande jaar in de status
      van projecten en projectpakketten die bekostigd worden uit het fonds.
    url: https://wetten.overheid.nl/BWBR0044860/2021-07-01#Artikel4
  - number: '5'
    text: |-
      De ontvangsten van het fonds zijn:

      a. een bijdrage ten laste van de begroting van het Ministerie van Infrastructuur en Waterstaat;

      b. bijdragen ten laste van andere begrotingen van het Rijk;

      c. bijdragen van derden;

      d. andere ontvangsten in het kader van het bereiken van de doelen van het fonds.
    url: https://wetten.overheid.nl/BWBR0044860/2021-07-01#Artikel5
  - number: '6'
    text: |-
      1 Ten laste van het fonds komen de uitgaven ten behoeve van:

      a. aanleg, verbetering, beheer en onderhoud en bediening van infrastructuur die door het Rijk wordt beheerd;

      b. het inwinnen, bewerken en verspreiden van met onderdeel a samenhangende basisinformatie;

      c. onderzoek ter voorbereiding van maatregelen of voorzieningen als bedoeld in onderdeel a.

      2 Uit het fonds kunnen subsidies worden verstrekt aan provincies, gemeenten, waterschappen, andere
      publiekrechtelijke rechtspersonen of privaatrechtelijke rechtspersonen ten behoeve van:

      a. aanleg, verbetering, beheer en onderhoud en bediening van infrastructuur die door hen wordt beheerd;

      b. onderzoek ter voorbereiding van maatregelen of voorzieningen als bedoeld in onderdeel a.

      3 Ten laste van het fonds kunnen tevens uitgaven en subsidies worden gebracht ten behoeve van:

      a. maatregelen en voorzieningen waarmee wordt beoogd de doelmatigheid van het gebruik van infrastructuur, als
      bedoeld in het eerste lid, onderdeel a, of het tweede lid, onderdeel a, te vergroten;

      b. onderzoek ter voorbereiding van maatregelen of voorzieningen als bedoeld in de onderdeel a.

      4 Ten laste van het fonds kunnen daarnaast uitgaven en subsidies worden gebracht ten behoeve van proefprojecten en
      experimenten gericht op maatregelen of voorzieningen als bedoeld in het eerste lid, onderdeel a, het tweede lid,
      onderdeel a, of het derde lid, onderdeel a.

      5 Ten laste van het fonds kunnen verder uitgaven en subsidies worden gebracht ten behoeve van aanleg, verbetering
      of beheer en onderhoud van infrastructuur buiten het Europese deel van Nederland, maar binnen Europa.

      6 Ten laste van het fonds komen voorts andere uitgaven in het kader van het bereiken van de doelen van het fonds.

      7 Uit het fonds worden geen uitgaven gedaan of subsidies verstrekt ten behoeve van:

      a. aanleg, verbetering en beheer en onderhoud van een zee- of luchthaven;

      b. zeehaven- en luchthaveninfrastructuur, behoudens infrastructuur ten behoeve van de ontsluiting van een zee-
      of luchthaven;

      c. militaire doeleinden;

      d. culturele doeleinden.
    url: https://wetten.overheid.nl/BWBR0044860/2021-07-01#Artikel6
  - number: '7'
    text: |-
      1 Onverminderd [hoofdstuk 3 van de Financiële-verhoudingswet][ref1] is op subsidies die verstrekt worden ten laste
      van het fonds, de [Kaderwet subsidies I en M][ref2] van toepassing.

      2 Het eerste lid geldt niet voor subsidies aan zelfstandige bestuursorganen als bedoeld in
      [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref3], voor de uitvoering van hun wettelijke taken.

      3 Subsidies die worden verleend ten laste van een begroting van het fonds die nog niet is vastgesteld, worden
      verleend onder de voorwaarde, bedoeld in [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref4].

      4 Een algemene maatregel van bestuur of ministeriële regeling op basis waarvan subsidies kunnen worden verstrekt
      waarop het eerste lid van toepassing is, wordt niet eerder vastgesteld dan 30 dagen nadat het ontwerp van de
      subsidieregeling schriftelijk ter kennis is gebracht van de Tweede Kamer der Staten-Generaal, indien het jaarlijkse
      subsidieplafond meer dan 10 miljoen euro bedraagt.

      5 Indien binnen de in het vierde lid genoemde termijn van 30 dagen ten minste een vijfde van het grondwettelijk
      aantal leden van de Tweede Kamer der Staten-Generaal nadere inlichtingen vraagt, wordt de subsidieregeling, bedoeld
      in het vierde lid, niet eerder vastgesteld dan 14 dagen nadat de inlichtingen zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0032789
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0044860/2021-07-01#Artikel7
