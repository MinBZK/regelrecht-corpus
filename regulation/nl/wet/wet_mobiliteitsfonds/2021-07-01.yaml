  - number: '8'
    text: |-
      1 Het wetsvoorstel tot vaststelling van de eerste begrotingsstaat van het fonds wordt aangeboden aan de Tweede
      Kamer der Staten-Generaal op de eerstvolgende derde dinsdag van september na het tijdstip van inwerkingtreding van
      deze wet.

      2 De [Wet Infrastructuurfonds][ref1] en het [Besluit Infrastructuurfonds][ref2] worden ingetrokken met ingang van
      1 januari van het eerstvolgende kalenderjaar na het tijdstip van inwerkingtreding van deze wet, met dien verstande
      dat:

      a. in afwijking van [artikel 3, derde lid, van de Wet Infrastructuurfonds][ref3] het wetsvoorstel tot vaststelling
      van de laatste begrotingsstaat van het Infrastructuurfonds wordt aangeboden aan de Tweede Kamer der Staten-Generaal
      op de laatste derde dinsdag van september voor het tijdstip van inwerkingtreding van deze wet;

      b. op de begrotingsstaat, bedoeld in onderdeel a, de [Wet Infrastructuurfonds][ref4] van toepassing blijft, zoals
      die luidde onmiddellijk voor het tijdstip van intrekking van die wet; en

      c. op subsidieverstrekkingen en -aanvragen die hebben plaatsgevonden voor het tijdstip van intrekking van de
      [Wet Infrastructuurfonds][ref5], het bij of krachtens die wet bepaalde van toepassing blijft, zoals dat luidde
      onmiddellijk voor dit tijdstip.


