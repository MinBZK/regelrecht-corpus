articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *voortstuwingsvermogen:*


              het maximale vermogen, uitgedrukt in kiloWatt (kW), dat door de voortstuwingsmachines zonder overbelasting
      gedurende onbeperkte tijdsduur kan worden geleverd;



            b

              *scheepslengte:*


              tenzij anders bepaald, 96 procent van de totale lengte op een waterlijn op 85 procent van de kleinste holte
      gemeten vanaf de kiellijn, of de lengte van de voorzijde van de voorsteven tot de hartlijn van de roerkoning op die
      waterlijn, indien deze lengte groter is. Bij vissersvaartuigen die met stuurlast ontworpen zijn, moet de waterlijn
      waarop deze lengte gemeten wordt, evenwijdig aan de ontwerplastlijn worden genomen;



            c

              *vaargebied:*


              onbeperkt vaargebied of, indien het gebied geografisch beperkt is, het vaargebied, genoemd in
      [artikel 1, onderdeel c, d of e, van het Besluit zeevisvaartbemanning][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012790#Artikel1
    url: https://wetten.overheid.nl/BWBR0013473/2014-05-03#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012790
        artikel: '1'
  - number: '2'
    text: |-
      De gegevens die bij de aanvraag voor een bemanningscertificaat voor een vissersvaartuig worden ingediend, zijn,
      voorzover van toepassing:
