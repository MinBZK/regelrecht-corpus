---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_groenprojecten_nederlandse_antillen_en_aruba_2002
regulatory_layer: WET
publication_date: '2002-10-18'
valid_from: '2002-10-20'
bwb_id: BWBR0013273
url: https://wetten.overheid.nl/BWBR0013273/2002-10-20
preamble:
  text: |-
    Gelet op artikel 5.14, derde lid, onderdeel a, zesde lid, en artikel 10.10, vierde lid, van de Wet
    inkomstenbelasting 2001;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Deze regeling geeft uitvoering aan [artikel 5.14, derde lid, onderdeel a, zesde lid][ref1], en
      [artikel 10.10, vierde lid, van de Wet inkomstenbelasting 2001][ref2] met betrekking tot projecten welke op de
      Nederlandse Antillen en Aruba zijn gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '1.2'
    text: |-
      In deze regeling wordt verstaan onder:

              a

                *project:*


                in het Koninkrijk der Nederlanden buiten Europa gelegen technisch, functioneel en in de tijd samenhangend
      geheel van activa en werkzaamheden;



              b

                *bestaand project:*


                project dat een jaar voor de dag waarop de aanvraag tot afgifte van een verklaring wordt ingediend reeds
      voldoet aan een van de projectomschrijvingen van [artikel 2][ref1] dan wel een project waarvoor een jaar voor die
      dag reeds een begin met de uitvoering van de bijbehorende fysieke werkzaamheden is gemaakt;



              c

                *projectbeheerder:*


                degene voor wiens rekening en risico het project wordt ontwikkeld en in stand gehouden;



              d

                *projectvermogen:*


                vermogen dat nodig is voor de financiering van activa die noodzakelijk zijn voor en uitsluitend
      dienstbaar zijn aan de uitvoering van een project;



              e

                *verklaring:*


                schriftelijk besluit van de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer als
      bedoeld in [artikel 10.10. derde lid, van de Wet inkomstenbelasting 2001][ref2], waarin wordt verklaard dat een
      project in het belang is van de bescherming van het milieu, waaronder natuur en bos;



              f

                *accountantsverklaring:*


                verklaring afgegeven door een registeraccountant of een accountant-administratieconsulent.



              g

                *de ministers:*


                de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, in overeenstemming met de
      Staatssecretaris van Financiën, en na overleg met de Minister van Landbouw, Natuurbeheer en Visserij en de Minister
      van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0013273#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013273
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '2'
    text: 'Een verklaring kan slechts worden afgegeven voor projecten die naar het oordeel van de ministers:'
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel2
  - number: 2.a
    text: 'gericht zijn op:'
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel2
  - number: 2.a.1º
    text: het opwekken van energie uit hout en energierijke gewassen;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel2
  - number: 2.a.2º
    text: |-
      het opwekken van elektrische energie door middel van een windturbine die - voorzover deze normen daarop van
      toepassing zijn - is gecertificeerd volgens NEN 6096/2 indien certificatie heeft plaatsgevonden voor 1 april 2000,
      of volgens NVN 11400-0, indien certificatie heeft plaatsgevonden op of na 1 april 2000;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel2
  - number: 2.a.3º
    text: het opwekken van elektrische energie met behulp van fotovoltaïsche cellen;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel2
  - number: 2.a.4º
    text: het gebruik van thermische zonne-energie door middel van zonnecollectoren;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel2
  - number: 2.a.5º
    text: het winnen van aardwarmte;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel2
  - number: 2.a.6º
    text: het opwekken van elektrische energie uit waterkracht;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel2
  - number: 2.a.7º
    text: |-
      het met behulp van warmtepompen, met een Seasonal Performance Factor van ten minste 1,2 opwaarderen van
      laagwaardige warmte naar hoogwaardige warmte, zodanig dat de hoogwaardige warmte nuttig wordt aangewend;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel2
  - number: 2.a.8º
    text: warmte-, onderscheidenlijk koude-opslag in een aquifer gedurende ten minste een maand;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel2
  - number: 2.b
    text: die naar zijn oordeel in het belang zijn van de bescherming van het milieu, waaronder natuur en bos.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel2
  - number: '3'
    text: 'Een verklaring wordt niet afgegeven op aanvragen voor:'
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel3
  - number: 3.a
    text: een bestaand project;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel3
  - number: 3.b
    text: een project waarvan het projectvermogen minder bedraagt dan € 22.689;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel3
  - number: 3.c
    text: een project waarvan niet aannemelijk is dat het enig eigen rendement heeft;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel3
  - number: 3.d
    text: |-
      een project waarvan het te verwachten economisch rendement in verhouding tot het risico en het milieubelang zodanig
      is dat het zonder toepassing van deze regeling tot stand kan komen;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel3
  - number: 3.e
    text: |-
      projecten terzake waarvan de projectbeheerder niet schriftelijk instemt met de controlebepalingen, bedoeld in
      [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013273#Artikel9
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013273
        artikel: '9'
  - number: 3.f
    text: |-
      projecten terzake waarvan de projectbeheerder niet schriftelijk instemt met door de ministers te stellen
      controlevoorwaarden;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel3
  - number: 3.g
    text: projecten die het lokale belang dan wel het lokale milieu in onvoldoende mate dienen.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel3
  - number: '4.1'
    text: 'Een verklaring kan slechts worden aangevraagd door en afgegeven aan:'
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel4
  - number: 4.1.a
    text: |-
      een kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1] die is ingeschreven in
      het register, bedoeld in [artikel 52 van die wet][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
  - number: 4.1.b
    text: |-
      een beleggingsinstelling die is ingeschreven in het register, bedoeld in
      [artikel 18 van de Wet toezicht beleggingsinstellingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004809#Artikel18
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0004809
        artikel: '18'
  - number: '4.2'
    text: |-
      De aanvraag voor een verklaring voor projecten bedoeld in [artikel 2][ref1], dient te worden ingediend bij de
      Nederlandse onderneming voor energie en milieu bv (Novem).


      [ref1]: https://wetten.overheid.nl/BWBR0013273#Artikel2
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013273
        artikel: '2'
  - number: '4.3'
    text: |-
      Voor projecten waarvoor reeds eerder een verklaring is afgegeven kan een nieuwe aanvraag eerst drie jaar voor de
      afloop van de geldende verklaring worden ingediend.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel4
  - number: '4.4'
    text: |-
      De aanvraag wordt ingediend met gebruikmaking van een formulier dat door de Minister van Volkshuisvesting,
      Ruimtelijke Ordening en Milieubeheer op aanvraag beschikbaar wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel4
  - number: '4.5'
    text: |-
      Aan een aanvrager kan worden verzocht nadere gegevens te verstrekken die van belang kunnen zijn voor de beoordeling
      van het project.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel4
  - number: '4.6'
    text: |-
      Aan een aanvrager kan worden verzocht een accountantsverklaring te overleggen, waaruit de juistheid of
      aannemelijkheid van de in de aanvraag vermelde gegevens blijkt.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel4
  - number: '5.1'
    text: |-
      De Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer beslist, in overeenstemming met de
      Staatssecretaris van Financiën en na overleg met de Minister van Landbouw, Natuurbeheer en Visserij, de Minister
      van Verkeer en Waterstaat en gehoord hebbende de Minister van Volksgezondheid en Milieuhygiëne van de Nederlandse
      Antillen dan wel gehoord hebbende de Minister van Volkshuisvesting, Ruimtelijke Ontwikkeling en Milieu (Aruba), op
      een aanvraag binnen acht weken na de indiening ervan.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel5
  - number: '5.2'
    text: Een afschrift van het besluit wordt gezonden aan de projectbeheerder.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel5
  - number: '6.1'
    text: |-
      De verklaring kan maximaal negen maanden na afgifte van de verklaring in werking treden en wordt voor geen langere
      periode dan voor de verwachte levensduur van het project en de duur van ten hoogste tien jaar afgegeven.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel6
  - number: '6.2'
    text: De verklaring vermeldt de aard van het project, het projectvermogen en de periode waarvoor de verklaring geldt.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel6
  - number: '6.3'
    text: |-
      De verklaring voor een project als bedoeld in [artikel 2][ref1] vervalt indien binnen 12 maanden na de dag van
      afgifte van een verklaring, geen aanvang is gemaakt met de uitvoering der werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0013273#Artikel2
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013273
        artikel: '2'
  - number: '6.4'
    text: |-
      De verklaring voor een project vervalt indien de projectbeheerder een ander is dan degene die de schriftelijke
      instemming, bedoeld in [artikel 3, onderdeel e en onderdeel f][ref1], heeft afgegeven, tenzij de nieuwe
      projectbeheerder schriftelijk verklaart, in te stemmen met de controlebepalingen, bedoeld in [artikel 9][ref2],
      alsmede met de door de minister te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0013273#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013273#Artikel9
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013273
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0013273
        artikel: '9'
  - number: '6.5'
    text: In de verklaring kunnen nadere voorwaarden worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel6
  - number: '7.1'
    text: 'De verklaring kan door de ministers worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel7
  - number: 7.1.a
    text: |-
      de ter zake verstrekte gegevens zodanig onjuist of onvolledig blijken, dat op de aanvraag een andere beslissing zou
      zijn genomen als bij de beoordeling daarvan de juiste of volledige gegevens bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel7
  - number: 7.1.b
    text: |-
      blijkt dat de uitvoering van het project in aanzienlijke mate afwijkt van het project op grond waarvan de
      verklaring is afgegeven;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel7
  - number: 7.1.c
    text: blijkt dat de projectbeheerder de vermogenstoestand van het project niet afzonderlijk administreert;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel7
  - number: 7.1.d
    text: niet wordt voldaan aan de voorwaarden die in de verklaring zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel7
  - number: 7.1.e
    text: |-
      de melding bedoeld in [artikel 8, tweede lid][ref1], niet onverwijld is geschied;


      [ref1]: https://wetten.overheid.nl/BWBR0013273#Artikel8
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013273
        artikel: '8'
  - number: 7.1.f
    text: |-
      de voorwaarden opgenomen in de verklaring, bedoeld in [artikel 6, vierde en vijfde lid][ref1], of de voorwaarden,
      bedoeld in [artikel 9][ref2], niet worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0013273#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013273#Artikel9
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013273
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0013273
        artikel: '9'
  - number: '7.2'
    text: Het besluit tot intrekking kan terugwerkende kracht hebben.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel7
  - number: '7.3'
    text: |-
      Het besluit tot intrekking wordt gezonden aan de aanvrager die ingevolge [artikel 4, eerste lid][ref1], een
      aanvraag heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0013273#Artikel4
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0013273
        artikel: '4'
  - number: '7.4'
    text: |-
      Een afschrift van het besluit wordt gezonden aan de projectbeheerder en aan de inspecteur van de Belastingdienst/
      Grote Ondernemingen Amsterdam.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel7
  - number: '8.1'
    text: |-
      De kredietinstelling en de beleggingsinstelling, bedoeld in
      [artikel 5.14, tweede lid, onderdeel a, onderscheidenlijk onderdeel b, van de Wet inkomstenbelasting 2001][ref1],
      die kapitaal verschaft ten behoeve van een project waarvoor een verklaring is afgegeven, ziet er op toe dat de
      vermogenstoestand van het project door de projectbeheerder afzonderlijk wordt geadministreerd op een zodanige wijze
      dat te allen tijde uit boeken en andere bescheiden de voor de belastingheffing van belang zijnde gegevens duidelijk
      blijken.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '8.2'
    text: |-
      Indien de uitvoering van een project wordt gewijzigd doet de kredietinstelling of de beleggingsinstelling, die
      kapitaal verschaft ten behoeve van een project waarvoor een verklaring is afgegeven, daarvan onverwijld melding aan
      de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel8
  - number: '9'
    text: |-
      Ten behoeve van de uitvoering van deze regeling is met betrekking
      tot de kredietinstelling en de beleggingsinstelling, bedoeld in
      [artikel 5.14, tweede lid, onderdeel a, onderscheidenlijk onderdeel b, van de Wet inkomstenbelasting 2001][ref1]
      en de projectbeheerder, [Hoofdstuk VIII][ref2], [afdeling 2, van de Algemene wet inzake rijksbelastingen][ref3] van
      overeenkomstige toepassing, waarbij de aldaar jegens de inspecteur opgelegde verplichtingen mede gelden jegens de
      door de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, of de Staatssecretaris van Financiën
      aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Afdeling2
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0002320
        afdeling: '2'
  - number: '10'
    text: |-
      Met de in deze regeling bedoelde normen, meetvoorschriften, tests, verklaringen en certificaten, worden
      gelijkgesteld normen, meetvoorschriften, tests, verklaringen en certificaten die tenminste een gelijkwaardig niveau
      waarborgen dan wel indien het verklaringen en certificaten betreft, deze zijn afgegeven op basis van onderzoekingen
      die aan tenminste gelijkwaardige eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel10
  - number: '11'
    text: De Regeling groenprojecten Nederlandse Antillen en Aruba (Stcrt. 82, 1998) vervalt.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel11
  - number: '12'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst, en werkt terug tot en met 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel12
  - number: '13'
    text: 'Deze regeling kan worden aangehaald als: Regeling groenprojecten Nederlandse Antillen en Aruba 2002.'
    url: https://wetten.overheid.nl/BWBR0013273/2002-10-20#Artikel13
