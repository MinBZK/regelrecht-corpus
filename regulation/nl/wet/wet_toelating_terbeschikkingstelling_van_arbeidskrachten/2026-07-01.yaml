valid_from: '2026-07-01'
bwb_id: BWBR0051817
url: https://wetten.overheid.nl/BWBR0051817/2026-07-01
preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat in het belang van een gelijk speelveld voor de uitleenbranche en de
    bescherming van de belangen van de betrokken arbeidskrachten een betere regulering van die branche is aangewezen
    en het om die reden wenselijk is dat in de Wet allocatie arbeidskrachten door intermediairs een toelatingsprocedure
    voor het ter beschikking stellen van arbeidskrachten op de Nederlandse arbeidsmarkt wordt ingevoerd;


    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0051817/2026-07-01#ArtikelAanhef
articles:
  - number: VI
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0051817/2026-07-01#ArtikelVI
  - number: VII
    text: 'Deze wet wordt aangehaald als: Wet toelating terbeschikkingstelling van arbeidskrachten.'
    url: https://wetten.overheid.nl/BWBR0051817/2026-07-01#ArtikelVII
