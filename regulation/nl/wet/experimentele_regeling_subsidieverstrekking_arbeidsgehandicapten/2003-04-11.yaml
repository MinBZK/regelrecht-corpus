---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: experimentele_regeling_subsidieverstrekking_arbeidsgehandicapten
regulatory_layer: WET
publication_date: '2009-09-30'
valid_from: '2003-04-11'
bwb_id: BWBR0009957
url: https://wetten.overheid.nl/BWBR0009957/2003-04-11
preamble:
  text: |-
    Gelet op artikel 33 van de Wet op de (re)integratie arbeidsgehandicapten, artikel 8e van het Besluit uitvoering
    en financiering Wet inschakeling werkzoekenden en artikel 3 van het Besluit reïntegratie-instrumenten
    arbeidsgehandicapten Arbeidsvoorziening;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            a
             persoonsgebonden reïntegratiebudget:

              een subsidie ter voldoening van de noodzakelijk te maken kosten van werkzaamheden die zijn gericht op
      behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid;



            b
             Wet REA:

              [Wet op de (re)integratie arbeidsgehandicapten][ref1];



            c
            arbeidsgehandicapte:

              arbeidsgehandicapte als bedoeld in [artikel 2 van de Wet REA][ref2];



            d
             subsidieontvanger:

              de arbeidsgehandicapte aan wie een persoonsgebonden reïntegratiebudget is verstrekt;



            e
             UWV:

              het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];



            f
            reïntegratiebedrijf:

              natuurlijke persoon of rechtspersoon die in het kader van de uitoefening van beroep of bedrijf de
      inschakeling van personen in het arbeidsproces bevordert.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009565
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0013060
        hoofdstuk: '5'
  - number: '2.1'
    text: |-
      De gemeenten Maastricht, Eysden, Gulpen-Wittem, Margaten, Meerssen, Vaals, Valkenburg aan de Geul, Utrecht,
      Amersfoort en 's-Gravenhage kunnen op aanvraag aan een arbeidsgehandicapte als bedoeld in artikel 12 van de
      Wet REA, die woonachtig is in de desbetreffende gemeente, in plaats van voorzieningen als bedoeld in de Wet
      inschakeling werkzoekenden, een persoonsgebonden reïntegratiebudget verstrekken, indien die arbeidsgehandicapte
      geen betaalde arbeid verricht.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2
  - number: '2.2'
    text: |-
      Het UWV kan op aanvraag aan een arbeidsgehandicapte als bedoeld in artikel 10 van de Wet REA, die woonachtig is in
      een gemeente als bedoeld in de bijlage bij deze regeling, in plaats van voorzieningen als bedoeld in artikel 22 van
      de Wet REA een persoonsgebonden reïntegratiebudget verstrekken, indien de arbeidsgehandicapte:
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2
  - number: 2.2.a
    text: geen betaalde arbeid verricht en;
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2
  - number: 2.2.b
    text: als werkzoekende is geregistreerd bij de Centrale organisatie werk en inkomen.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2
  - number: '2.3'
    text: 'Het persoonsgebonden budget, bedoeld in het eerste en tweede lid, dient uitsluitend ter bekostiging van:'
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2
  - number: 2.3.a
    text: begeleiding en advisering;
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2
  - number: 2.3.b
    text: opleiding;
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2
  - number: 2.3.c
    text: |-
      arbeidsbemiddeling en andere werkzaamheden die, in aansluiting op de onder a en b bedoelde werkzaamheden, zijn
      gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2
  - number: '2.4'
    text: |-
      De subsidie wordt verstrekt voorzover de kosten van de activiteiten, bedoeld in het derde lid, naar het oordeel van
      de subsidieverstrekkende instantie, niet onevenredig zijn met het te bereiken doel.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2
  - number: '2.5'
    text: |-
      Kosten van werkzaamheden die niet zijn beschreven in het in artikel 3 bedoelde trajectplan komen niet voor
      subsidiëring in aanmerking tenzij de subsidieverstrekkende instantie voor het verrichten van die werkzaamheden
      schriftelijk goedkeuring heeft verleend.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2
  - number: 2a.1
    text: |-
      Ter bekostiging van de persoonlijke begeleiding van de arbeidsgehandicapte bij oriëntatie op activiteiten als
      bedoeld in [artikel 2, derde lid][ref1], kunnen het UWV en de gemeenten, bedoeld in [artikel 2, eerste lid][ref2],
      aan de arbeidsgehandicapte een oriëntatiebudget verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009957
        artikel: '2'
  - number: 2a.2
    text: De in het eerste lid bedoelde begeleiding vindt plaats door een deskundige op het terrein van loopbaanbegeleiding.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2a
  - number: 2a.3
    text: |-
      Het oriëntatiebudget, bedoeld in het eerste lid, bestaat uit een eenmalig te verstrekken subsidie van ten hoogste €
      1135,00 voor een periode van ten hoogste drie maanden, te rekenen vanaf de datum waarop subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2a
  - number: 2a.4
    text: |-
      Het oriëntatiebudget kan uitsluitend worden verstrekt voorafgaand aan de aanvraag om een persoonsgebonden
      reïntegratiebudget.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel2a
  - number: '3'
    text: |-
      Het UWV of de in [artikel 2, eerste lid][ref1], genoemde gemeenten kunnen uitsluitend een persoonsgebonden
      reïntegratiebudget verstrekken indien de aanvraag vergezeld gaat van een door of namens de arbeidsgehandicapte
      opgesteld trajectplan waarin in elk geval zijn opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
  - number: 3.a
    text: het opleidingsniveau en het sociaal-fiscaalnummer van de arbeidsgehandicapte;
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel3
  - number: 3.b
    text: |-
      een beschrijving van de werkzaamheden die, in opdracht van de aanvrager, met het persoonsgebonden
      reïntegratiebudget bekostigd zullen worden;
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel3
  - number: 3.c
    text: de verwachte begin- en einddatum van de werkzaamheden, bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel3
  - number: 3.d
    text: de beroepsactiviteiten die de aanvrager naar verwachting na afloop van die periode kan vervullen;
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel3
  - number: 3.e
    text: een begroting van de kosten van de werkzaamheden, bedoeld onder b.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel3
  - number: '4.1'
    text: Op de aanvraag om een persoonsgebonden reïntegratiebudget wordt een beschikking omtrent subsidieverlening gegeven.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel4
  - number: '4.2'
    text: |-
      In de subsidievoorwaarden bij een beschikking als bedoeld in het eerste lid wordt in elk geval opgenomen dat in een
      overeenkomst die de subsidieontvanger met een reïntegratiebedrijf sluit wordt geregeld, dat het reïntegratiebedrijf
      aan de instantie die, op grond van [artikel 2][ref1], een persoonsgebonden reïntegratiebudget heeft verstrekt, op
      verzoek of na toestemming van de subsidieontvanger gegevens verstrekt over de besteding van het persoonsgebonden
      reïntegratiebudget.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
  - number: '5.1'
    text: Het persoonsgebonden reïntegratiebudget bedraagt ten hoogste € 3630 per subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel5
  - number: '5.2'
    text: |-
      Het persoonsgebonden reïntegratiebudget wordt verleend voor werkzaamheden als bedoeld in
      [artikel 2, derde lid][ref1], gedurende een tijdvak van ten hoogste een jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
  - number: '5.3'
    text: |-
      Indien de aanvrager van een persoonsgebonden reïntegratiebudget of de subsidieontvanger aantoont dat de
      noodzakelijke kosten van de werkzaamheden die zijn gericht op behoud, herstel of bevordering van mogelijkheden tot
      het verrichten van arbeid hoger zijn dan het in het eerste lid bedoelde bedrag of die werkzaamheden langer zullen
      duren dan een tijdvak van een jaar, kan subsidie worden verleend voor een hoger bedrag of een langere periode.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel5
  - number: '5.4'
    text: |-
      De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of de in
      het tweede lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen leiden
      tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel5
  - number: '6.1'
    text: |-
      Het UWV en de in [artikel 2, eerste lid][ref1], genoemde gemeenten kunnen aan de subsidieontvanger voorschotten op
      de vast te stellen subsidie verlenen aan de hand van aan het UWV of die gemeenten overgelegde declaraties voor de
      werkzaamheden, die voortvloeien uit het trajectplan.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
  - number: '6.2'
    text: |-
      Indien het UWV of een in [artikel 2, eerste lid][ref1], genoemde gemeente besluit tot het verlenen van
      voorschotten, kan het UWV of die gemeente de voorschotten direct betalen aan het reïntegratiebedrijf, waarmee de
      subsidieontvanger een overeenkomst heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
  - number: 6a.1
    text: |-
      De subsidieontvanger rapporteert iedere drie maanden bij de subsidieverstrekkende instantie over de verrichte
      werkzaamheden, bedoeld in [artikel 2, derde lid][ref1]. Daarbij worden in ieder geval de resultaten van de
      uitvoering van het trajectplan en de prognose voor de resterende periode van het traject gemeld en wordt een
      overzicht gegeven van de tot op dat moment gemaakte kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
  - number: 6a.2
    text: |-
      De subsidieontvanger verstrekt onverwijld en uit eigen beweging alle gegevens en inlichtingen omtrent voortijdige
      beëindiging van gesubsidieerde trajecten aan de subsidieverstrekkende instantie.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel6a
  - number: 6a.3
    text: |-
      De subsidieontvanger verstrekt op verzoek aan de subsidieverstrekkende instantie alle gegevens en inlichtingen
      die van belang zijn voor de vaststelling van de rechtmatigheid en doelmatigheid van de uitvoering van deze
      subsidieregeling, alsmede binnen vier weken alle hem betreffende informatie die noodzakelijk is voor de evaluatie
      van deze regeling.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel6a
  - number: '7.1'
    text: |-
      De subsidie-ontvanger dient binnen vier weken na afloop van de gesubsidieerde werkzaamheden dan wel na afloop van
      het tijdvak waarover het persoonsgebonden reïntegratiebudget is verstrekt een aanvraag tot vaststelling van de
      subsidie in. Bij de aanvraag worden een verantwoording en de niet eerder overgelegde declaraties overgelegd.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel7
  - number: '7.2'
    text: |-
      De verantwoording, bedoeld in het eerste lid, geeft duidelijk inzicht in de aard, de duur en de omvang van de
      gesubsidieerde werkzaamheden en bevat een vergelijking van de verrichte werkzaamheden en met de in het individuele
      trajectplan voorgenomen activiteiten.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel7
  - number: '8.1'
    text: |-
      Per werkgebied van de Centra voor werk en inkomen als bedoeld in [artikel 24 van de Wet SUWI][ref1], waarin één of
      meer van de gemeenten Maastricht, Eysden, Gulpen-Wittem, Meerssen, Vaals, Valkenburg aan de Geul of 's-Gravenhage
      gelegen zijn, wordt aan niet meer dan 150 personen als bedoeld in [artikel 2, eerste lid en tweede lid][ref2], een
      persoonsgebonden reïntegratiebudget verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0009957
        artikel: '2'
  - number: '8.2'
    text: |-
      Per werkgebied van de Centra voor werk en inkomen als bedoeld in [artikel 24 van de Wet SUWI][ref1],
      waarin de gemeenten Utrecht en Amersfoort zijn gelegen, wordt aan niet meer dan 400 personen als bedoeld in
      [artikel 2, eerste lid en tweede lid][ref2], een persoonsgebonden reïntegratiebudget verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0009957
        artikel: '2'
  - number: '8.3'
    text: Subsidieaanvragen worden per werkgebied in volgorde van binnenkomst van de aanvraag behandeld.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel8
  - number: '9.1'
    text: |-
      Op grond van deze regeling kan geen persoonsgebonden reïntegratiebudget worden verstrekt
      indien de aanvraag daartoe is ingediend nadat [artikel 57, onderdeel V][ref1], en
      [artikel 81, onderdeel Bb, van de Invoeringswet Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] in
      werking zijn getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0013061#Artikel81
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013061
        artikel: '57'
      - id: ref2
        bwb_id: BWBR0013061
        artikel: '81'
  - number: '9.2'
    text: |-
      Op grond een aanvraag, die is ingediend voor 1 januari 2002 wordt subsidie verleend met toepassing van de
      bepalingen van deze regeling, zoals deze luidde voor 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel9
  - number: '9.3'
    text: |-
      Een voor 1 januari 2002 verleend standaardbudget op grond van deze regeling, zoals deze luidde voor die datum,
      wordt omgezet in een budget op maat als bedoeld in [artikel 5][ref1], zoals dit artikel luidde voor die datum,
      indien het verzoek daartoe is ingediend binnen 13 weken na die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel5
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '5'
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Experimentele regeling subsidieverstrekking arbeidsgehandicapten.'
    url: https://wetten.overheid.nl/BWBR0009957/2003-04-11#Artikel11
