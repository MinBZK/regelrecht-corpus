        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009957
        artikel: '2'
  - number: '3'
    text: |-
      Het UWV of de in [artikel 2, eerste lid][ref1], genoemde colleges kunnen uitsluitend een persoonsgebonden
      reïntegratiebudget verstrekken indien de aanvraag vergezeld gaat van een door of namens de arbeidsgehandicapte
      opgesteld trajectplan waarin in elk geval zijn opgenomen:

      a. het opleidingsniveau en het sociaal-fiscaalnummer van de arbeidsgehandicapte;

      b. een beschrijving van de werkzaamheden die, in opdracht van de aanvrager, met het persoonsgebonden
      reïntegratiebudget bekostigd zullen worden;

      c. de verwachte begin- en einddatum van de werkzaamheden, bedoeld onder b;

      d. de beroepsactiviteiten die de aanvrager naar verwachting na afloop van die periode kan vervullen;

      e. een begroting van de kosten van de werkzaamheden, bedoeld onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
  - number: '4'
    text: |-
      1 Op de aanvraag om een persoonsgebonden reïntegratiebudget wordt een beschikking omtrent subsidieverlening
      gegeven.

      2 In de subsidievoorwaarden bij een beschikking als bedoeld in het eerste lid wordt in elk geval opgenomen
      dat in een overeenkomst die de subsidieontvanger met een reïntegratiebedrijf sluit wordt geregeld, dat het
      reïntegratiebedrijf aan de instantie die, op grond van [artikel 2][ref1], een persoonsgebonden reïntegratiebudget
      heeft verstrekt, op verzoek of na toestemming van de subsidieontvanger gegevens verstrekt over de besteding van het
      persoonsgebonden reïntegratiebudget.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
  - number: '5'
    text: |-
      1 Het persoonsgebonden reïntegratiebudget bedraagt ten hoogste € 3630 per subsidieontvanger.

      2 Het persoonsgebonden reïntegratiebudget wordt verleend voor werkzaamheden als bedoeld in
      [artikel 2, derde lid][ref1], gedurende een tijdvak van ten hoogste een jaar.

      3 Indien de aanvrager van een persoonsgebonden reïntegratiebudget of de subsidieontvanger aantoont dat de
      noodzakelijke kosten van de werkzaamheden die zijn gericht op behoud, herstel of bevordering van mogelijkheden tot
      het verrichten van arbeid hoger zijn dan het in het eerste lid bedoelde bedrag of die werkzaamheden langer zullen
      duren dan een tijdvak van een jaar, kan subsidie worden verleend voor een hoger bedrag of een langere periode.

      4 De in het derde lid bedoelde bevoegdheid bestaat uitsluitend indien het in het eerste lid bedoelde bedrag of
      de in het tweede lid bedoelde werkzaamheden gedurende een tijdvak van een jaar redelijkerwijs niet zullen kunnen
      leiden tot behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2009-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
  - number: '6'
    text: |-
      1 Het UWV en de in [artikel 2, eerste lid][ref1], genoemde colleges kunnen aan de subsidieontvanger voorschotten
      op de vast te stellen subsidie verlenen aan de hand van aan het UWV of die colleges overgelegde declaraties voor de
      werkzaamheden, die voortvloeien uit het trajectplan.

      2 Indien het UWV of een in [artikel 2, eerste lid][ref2], genoemd college besluit tot het verlenen van
      voorschotten, kan het UWV of dat college de voorschotten direct betalen aan het reïntegratiebedrijf, waarmee de
      subsidieontvanger een overeenkomst heeft gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0009957
        artikel: '2'
  - number: 6a
    text: |-
      1 De subsidieontvanger rapporteert iedere drie maanden bij de subsidieverstrekkende instantie over de verrichte
      werkzaamheden, bedoeld in [artikel 2, derde lid][ref1]. Daarbij worden in ieder geval de resultaten van de
      uitvoering van het trajectplan en de prognose voor de resterende periode van het traject gemeld en wordt een
      overzicht gegeven van de tot op dat moment gemaakte kosten.

      2 De subsidieontvanger verstrekt onverwijld en uit eigen beweging alle gegevens en inlichtingen omtrent voortijdige
      beëindiging van gesubsidieerde trajecten aan de subsidieverstrekkende instantie.

      3 De subsidieontvanger verstrekt op verzoek aan de subsidieverstrekkende instantie alle gegevens en inlichtingen
      die van belang zijn voor de vaststelling van de rechtmatigheid en doelmatigheid van de uitvoering van deze
      subsidieregeling, alsmede binnen vier weken alle hem betreffende informatie die noodzakelijk is voor de evaluatie
      van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2009-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0009957
        artikel: '2'
  - number: '7'
    text: |-
      1 De subsidie-ontvanger dient binnen vier weken na afloop van de gesubsidieerde werkzaamheden dan wel na afloop
      van het tijdvak waarover het persoonsgebonden reïntegratiebudget is verstrekt een aanvraag tot vaststelling van de
      subsidie in. Bij de aanvraag worden een verantwoording en de niet eerder overgelegde declaraties overgelegd.

      2 De verantwoording, bedoeld in het eerste lid, geeft duidelijk inzicht in de aard, de duur en de omvang van de
      gesubsidieerde werkzaamheden en bevat een vergelijking van de verrichte werkzaamheden en met de in het individuele
      trajectplan voorgenomen activiteiten.
    url: https://wetten.overheid.nl/BWBR0009957/2009-01-01#Artikel7
  - number: '8'
    text: |-
      1 Per werkgebied van de Centra voor werk en inkomen als bedoeld in [artikel 24 van de Wet SUWI][ref1] zoals dit
      luidde op 31 december 2008, waarin één of meer van de gemeenten Maastricht, Eysden, Gulpen-Wittem, Meerssen,
      Vaals, Valkenburg aan de Geul of 's-Gravenhage gelegen zijn, wordt aan niet meer dan 150 personen als bedoeld in
      [artikel 2, eerste lid en tweede lid][ref2], een persoonsgebonden reïntegratiebudget verstrekt.

      2 Per werkgebied van de Centra voor werk en inkomen als bedoeld in [artikel 24 van de Wet SUWI][ref3] zoals dit
      luidde op 31 december 2008, waarin de gemeenten Utrecht en Amersfoort zijn gelegen, wordt aan niet meer dan 400
      personen als bedoeld in [artikel 2, eerste lid en tweede lid][ref4], een persoonsgebonden reïntegratiebudget
      verstrekt.

      3 Subsidieaanvragen worden per werkgebied in volgorde van binnenkomst van de aanvraag behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009957#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0009957#Artikel2
