  - number: 2a
    text: |-
      1 Ter bekostiging van de persoonlijke begeleiding van de arbeidsgehandicapte bij oriëntatie op activiteiten als
      bedoeld in [artikel 2, derde lid][ref1], kunnen het UWV en de colleges, bedoeld in [artikel 2, eerste lid][ref2],
      aan de arbeidsgehandicapte een oriëntatiebudget verstrekken.

      2 De in het eerste lid bedoelde begeleiding vindt plaats door een deskundige op het terrein van
      loopbaanbegeleiding.

      3 Het oriëntatiebudget, bedoeld in het eerste lid, bestaat uit een eenmalig te verstrekken subsidie van ten hoogste
      € 1135,00 voor een periode van ten hoogste drie maanden, te rekenen vanaf de datum waarop subsidie is verleend.

      4 Het oriëntatiebudget kan uitsluitend worden verstrekt voorafgaand aan de aanvraag om een persoonsgebonden
      reïntegratiebudget.


      [ref1]: https://wetten.overheid.nl/BWBR0009957#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009957#Artikel2
    url: https://wetten.overheid.nl/BWBR0009957/2009-01-01#Artikel2a
    references:
      - id: ref1
