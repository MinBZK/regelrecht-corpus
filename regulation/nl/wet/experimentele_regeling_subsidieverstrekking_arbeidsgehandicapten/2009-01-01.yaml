  - number: '2'
    text: |-
      1 De colleges van de gemeenten Maastricht, Eysden, Gulpen-Wittem, Margaten, Meerssen, Vaals, Valkenburg aan
      de Geul, Utrecht, Amersfoort en 's-Gravenhage kunnen op aanvraag aan een arbeidsgehandicapte als bedoeld in
      [artikel 12 van de Wet REA][ref1], die woonachtig is in de desbetreffende gemeente, in plaats van voorzieningen
      als bedoeld in [artikel 7, eerste lid, onderdeel a, van de Wet werk en bijstand][ref2], een persoonsgebonden
      reïntegratiebudget verstrekken, indien die arbeidsgehandicapte geen betaalde arbeid verricht.

      2 Het UWV kan op aanvraag aan een arbeidsgehandicapte als bedoeld in [artikel 10 van de Wet REA][ref3], die
      woonachtig is in een gemeente als bedoeld in de bijlage bij deze regeling, in plaats van voorzieningen als
      bedoeld in [artikel 22 van de Wet REA][ref4] een persoonsgebonden reïntegratiebudget verstrekken, indien de
      arbeidsgehandicapte:

      a. geen betaalde arbeid verricht en;

      b. als werkzoekende is geregistreerd bij het Uitvoeringsinstituut werknemersverzekeringen.

      3 Het persoonsgebonden budget, bedoeld in het eerste en tweede lid, dient uitsluitend ter bekostiging van:

      a. begeleiding en advisering;

      b. opleiding;

      c. arbeidsbemiddeling en andere werkzaamheden die, in aansluiting op de onder a en b bedoelde werkzaamheden, zijn
      gericht op behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid.

      4 De subsidie wordt verstrekt voorzover de kosten van de activiteiten, bedoeld in het derde lid, naar het oordeel
      van de subsidieverstrekkende instantie, niet onevenredig zijn met het te bereiken doel.

      5 Kosten van werkzaamheden die niet zijn beschreven in het in [artikel 3][ref5] bedoelde trajectplan komen niet
      voor subsidiëring in aanmerking tenzij de subsidieverstrekkende instantie voor het verrichten van die werkzaamheden
      schriftelijk goedkeuring heeft verleend.


