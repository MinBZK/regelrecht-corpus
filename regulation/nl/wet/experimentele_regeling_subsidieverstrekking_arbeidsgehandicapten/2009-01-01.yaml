  - number: '9'
    text: |-
      1 Op grond van deze regeling kan geen persoonsgebonden reïntegratiebudget worden verstrekt
      indien de aanvraag daartoe is ingediend nadat [artikel 57, onderdeel V][ref1], en
      [artikel 81, onderdeel Bb, van de Invoeringswet Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] in
      werking zijn getreden.

      2 Op grond een aanvraag, die is ingediend voor 1 januari 2002 wordt subsidie verleend met toepassing van de
      bepalingen van deze regeling, zoals deze luidde voor 1 januari 2002.

      3 Een voor 1 januari 2002 verleend standaardbudget op grond van deze regeling, zoals deze luidde voor die datum,
      wordt omgezet in een budget op maat als bedoeld in [artikel 5][ref3], zoals dit artikel luidde voor die datum,
      indien het verzoek daartoe is ingediend binnen 13 weken na die datum.


      [ref1]: https://wetten.overheid.nl/BWBR0013061#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0013061#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0009957#Artikel5
