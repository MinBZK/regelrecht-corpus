preamble:
  text: |-
    Gelet op artikel 33 van de Wet op de (re)integratie arbeidsgehandicapten, artikel 8e van het Besluit uitvoering
    en financiering Wet inschakeling werkzoekenden en artikel 3 van het Besluit reïntegratie-instrumenten
    arbeidsgehandicapten Arbeidsvoorziening;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0009957/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             persoonsgebonden reïntegratiebudget:

              een subsidie ter voldoening van de noodzakelijk te maken kosten van werkzaamheden die zijn gericht op
      behoud, herstel of bevordering van mogelijkheden tot het verrichten van arbeid;



            b
             Wet REA:

              [Wet op de (re)integratie arbeidsgehandicapten][ref1];



            c
            arbeidsgehandicapte:

              arbeidsgehandicapte als bedoeld in [artikel 2 van de Wet REA][ref2];



            d
             subsidieontvanger:

              de arbeidsgehandicapte aan wie een persoonsgebonden reïntegratiebudget is verstrekt;



            e
             UWV:

              het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];



            f
            reïntegratiebedrijf:

              natuurlijke persoon of rechtspersoon die in het kader van de uitoefening van beroep of bedrijf de
      inschakeling van personen in het arbeidsproces bevordert;



            g
            college:

              college van burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0009565
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel2
