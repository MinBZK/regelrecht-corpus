---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_gelijke_behandeling_op_grond_van_handicap_of_chronische_ziekte
regulatory_layer: WET
publication_date: '2025-11-25'
valid_from: '2026-01-01'
bwb_id: BWBR0014915
url: https://wetten.overheid.nl/BWBR0014915/2026-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om, mede in verband met artikel 1 van de Grondwet
    en alsmede op grond van de Richtlijn nr. 2000/78/EG van de Raad van de Europese Unie van 27 november 2000, tot
    instelling van een algemeen kader voor gelijke behandeling in arbeid en beroep (PbEG, 2000, L303), ter bevordering
    van de deelneming op gelijke voet aan het maatschappelijke leven bescherming te bieden tegen discriminatie op grond
    van handicap of chronische ziekte en dat het daarom wenselijk is behoudens de door de wet genoemde uitzonderingen
    onderscheid op deze grond te verbieden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#ArtikelAanhef
articles:
  - number: '01'
    text: Ieder mens moet in staat worden gesteld aansluitend bij zijn eigen mogelijkheden autonoom te zijn.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel01
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel1
  - number: 1.a
    text: 'onderscheid: direct en indirect onderscheid, alsmede de opdracht daartoe;'
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel1
  - number: 1.b
    text: |-
      direct onderscheid: indien een persoon op grond van handicap of chronische ziekte op een andere wijze wordt
      behandeld dan een ander in een vergelijkbare situatie wordt, is of zou worden behandeld;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel1
  - number: 1.c
    text: |-
      indirect onderscheid: indien een ogenschijnlijk neutrale bepaling, maatstaf of handelwijze personen met een
      handicap of chronische ziekte in vergelijking met andere personen bijzonder treft;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel1
  - number: 1.d
    text: |-
      richtlijn (EU) 2019/882: [Richtlijn (EU) 2019/882](32019L0882) van het Europees Parlement en de Raad van 17 april
      2019 betreffende de toegankelijkheidsvoorschriften voor producten en diensten (PbEU 2019, L151).
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel1
  - number: 1a.1
    text: Het in deze wet neergelegde verbod van onderscheid houdt mede in een verbod van intimidatie.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Onder intimidatie als bedoeld in het eerste lid wordt verstaan: gedrag dat verband houdt met handicap of chronische
      ziekte en dat tot doel of gevolg heeft dat de waardigheid van de persoon wordt aangetast en dat een bedreigende,
      vijandige, beledigende, vernederende of kwetsende omgeving wordt gecreëerd.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel1a
  - number: 1a.3
    text: |-
      Op het in deze wet neergelegde verbod van intimidatie is [artikel 3][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014915#Artikel3
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0014915
        artikel: '3'
        paragraaf: '1'
  - number: '2.1'
    text: |-
      Het verbod van onderscheid houdt mede in dat degene, tot wie dit verbod zich richt, gehouden is naar gelang de
      behoefte doeltreffende aanpassingen te verrichten, tenzij deze voor hem een onevenredige belasting vormen.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onder het verrichten van doeltreffende aanpassingen wordt in ieder geval verstaan het toelaten van
      assistentiehonden.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel2
  - number: 2a.1
    text: |-
      Degene tot wie het verbod van onderscheid zich richt, draagt daarnaast tenminste geleidelijk zorg voor de algemene
      toegankelijkheid voor personen met een handicap of chronische ziekte, tenzij dat voor hem een onevenredige
      belasting vormt.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel2a
  - number: 2a.2
    text: |-
      Onverminderd het bepaalde bij of krachtens enige wettelijke bepaling, worden bij algemene maatregel van bestuur
      regels gesteld ter uitvoering van het eerste lid. Deze regels hebben in ieder geval betrekking op de geleidelijke
      verwezenlijking van de algemene toegankelijkheid, op het treffen van voorzieningen van eenvoudige aard en op de
      evenredigheid van de belasting.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel2a
  - number: 2a.3
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel2a
  - number: '3.1'
    text: 'Het verbod van onderscheid geldt niet indien:'
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel3
  - number: 3.1.a
    text: het onderscheid noodzakelijk is ter bescherming van de veiligheid en de gezondheid;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel3
  - number: 3.1.b
    text: |-
      het onderscheid een regeling, norm of praktijk betreft die tot doel heeft specifieke voorzieningen en faciliteiten
      te creëren of in stand te houden ten behoeve van personen met een handicap of chronische ziekte;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel3
  - number: 3.1.c
    text: |-
      het onderscheid een specifieke maatregel betreft die tot doel heeft personen met een handicap of chronische ziekte
      een bevoorrechte positie toe te kennen ten einde feitelijke nadelen verband houdende met de gronden handicap of
      chronische ziekte op te heffen of te verminderen en het onderscheid in een redelijke verhouding staat tot dat doel.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel3
  - number: '3.2'
    text: |-
      Het in deze wet neergelegde verbod van onderscheid geldt niet ten aanzien van indirect onderscheid indien dat
      onderscheid objectief gerechtvaardigd wordt door een legitiem doel en de middelen voor het bereiken van dat doel
      passend en noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel3
  - number: '4'
    text: 'Onderscheid is verboden bij:'
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel4
  - number: 4.a
    text: de aanbieding van een betrekking en de behandeling bij de vervulling van een openstaande betrekking;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel4
  - number: 4.b
    text: het aangaan en het beëindigen van een arbeidsverhouding;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel4
  - number: 4.c
    text: |-
      het aanstellen of ontslaan van personen, op wie [artikel 3 van de Ambtenarenwet 2017][ref1] van toepassing is en
      het aanstellen of ontslaan van ambtenaren als bedoeld in de [Ambtenarenwet BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0028215
  - number: 4.d
    text: de arbeidsbemiddeling;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel4
  - number: 4.e
    text: arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel4
  - number: 4.f
    text: het laten volgen van onderwijs, scholing en vorming tijdens of voorafgaand aan een arbeidsverhouding;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel4
  - number: 4.g
    text: bevordering;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel4
  - number: 4.h
    text: arbeidsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel4
  - number: '5'
    text: |-
      Onderscheid is verboden met betrekking tot de voorwaarden voor en de toegang tot het vrije beroep en de
      mogelijkheden tot uitoefening van en ontplooiing binnen het vrije beroep.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5
  - number: 5a
    text: |-
      Onderscheid is verboden bij het lidmaatschap van of de betrokkenheid bij een werkgevers- of werknemersorganisatie
      of een vereniging van beroepsgenoten, alsmede bij de voordelen die uit dat lidmaatschap of uit die betrokkenheid
      voortvloeien.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5a
  - number: 5b.1
    text: |-
      Onderscheid is verboden bij het aanbieden van of verlenen van toegang tot goederen of diensten en bij het sluiten,
      uitvoeren of beëindigen van overeenkomsten ter zake, alsmede bij het geven van loopbaanoriëntatie en advies of
      voorlichting over school- of beroepskeuze, indien dit geschiedt:
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5b
  - number: 5b.1.a
    text: in de uitoefening van een beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5b
  - number: 5b.1.b
    text: door de openbare dienst;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5b
  - number: 5b.1.c
    text: |-
      door instellingen die werkzaam zijn op het gebied van volkshuisvesting, welzijn, gezondheidszorg, cultuur of
      onderwijs of
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5b
  - number: 5b.1.d
    text: |-
      door natuurlijke personen die niet handelen in de uitoefening van een beroep of bedrijf, voor zover het aanbod in
      het openbaar geschiedt.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5b
  - number: 5b.2
    text: |-
      Het eerste lid is niet van toepassing op terreinen bestreken door de [paragrafen 3a][ref1] en [4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0014915#Paragraaf3a
      [ref2]: https://wetten.overheid.nl/BWBR0014915#Paragraaf4
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5b
    references:
      - id: ref1
        bwb_id: BWBR0014915
        paragraaf: 3a
      - id: ref2
        bwb_id: BWBR0014915
        paragraaf: '4'
  - number: 5c.1
    text: |-
      De bij algemene maatregel van bestuur aangewezen dienstverleners ontwerpen en verlenen hun diensten ter uitvoering
      van [richtlijn (EU) 2019/882](32019L0882) in overeenstemming met de bij of krachtens die maatregel gestelde regels.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5c
  - number: 5c.2
    text: 'De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5c
  - number: 5c.2.a
    text: |-
      de wijze waarop en voorwaarden waaronder diensten worden aangeboden. Tot die voorwaarden behoren de
      toegankelijkheidsvoorschriften waaraan diensten moeten voldoen;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5c
  - number: 5c.2.b
    text: |-
      de conformiteit van diensten met de toegankelijkheidsvoorschriften, waaronder de gevallen waarin diensten geacht
      worden daarmee reeds in overeenstemming te zijn, en het treffen van corrigerende maatregelen indien diensten niet
      aan de toegankelijkheidsvoorschriften voldoen;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5c
  - number: 5c.2.c
    text: de gevallen waarin en voorwaarden waaronder toegankelijkheidsvoorschriften beperkt of niet van toepassing zijn; en
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5c
  - number: 5c.2.d
    text: |-
      het bijhouden en verstrekken van informatie of documentatie over de dienst of corrigerende maatregelen aan Onze
      Minister die het aangaat, de aangewezen toezichthouders of het publiek.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5c
  - number: 5d.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van door de Europese
      Commissie krachtens artikel 26 van [richtlijn (EU) 2019/882](32019L0882) vastgestelde regels.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5d
  - number: 5d.2
    text: |-
      Een wijziging van de richtlijn gaat voor de toepassing van het bij of krachtens deze paragraaf bepaalde, gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel5d
  - number: 6a
    text: 'In deze paragraaf wordt onder woonruimte verstaan:'
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6a
  - number: 6a.a
    text: |-
      een tot bewoning bestemde gebouwde onroerende zaak die een zelfstandige woning vormt, of een tot zelfstandige of
      onzelfstandige bewoning bestemd gedeelte van een gebouwde onroerende zaak, met inbegrip van de daarbij behorende
      gemeenschappelijke ruimte;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6a
  - number: 6a.b
    text: |-
      een woonwagen, zijnde een voor bewoning bestemd gebouw dat is geplaatst op een standplaats en dat in zijn geheel of
      in delen kan worden verplaatst;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6a
  - number: 6a.c
    text: een woonschip, zijnde een schip dat uitsluitend of in hoofdzaak gebezigd wordt of bestemd is voor bewoning;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6a
  - number: 6a.d
    text: een tot bewoning bestemd verblijf van een binnenschip.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6a
  - number: 6b
    text: 'Onderscheid is verboden bij:'
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6b
  - number: 6b.a
    text: het aanbieden van woonruimte ter bewoning;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6b
  - number: 6b.b
    text: |-
      het sluiten, uitvoeren, wijzigen of beëindigen van een overeenkomst betreffende het huren, kopen of bewonen van
      woonruimte voor eigen gebruik, waarbij onder eigen gebruik mede wordt verstaan bewoning door een persoon tot wie
      de contractant, diens echtgenoot of geregistreerde partner in een familierechtelijke betrekking staat of met wie de
      contractant, diens echtgenoot of geregistreerde partner in gezinsverband leeft;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6b
  - number: 6b.c
    text: het bemiddelen bij een overeenkomst als bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6b
  - number: 6b.d
    text: |-
      het opmaken, uitvoeren of wijzigen van een reglement als bedoeld in
      [artikel 111, onder d, van Boek 5 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005288#Artikel111
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0005288
        artikel: '111'
  - number: 6b.e
    text: het inschrijven als woningzoekende.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6b
  - number: 6c
    text: |-
      [Artikel 2, eerste lid,][ref1] is op deze paragraaf niet van toepassing, indien het een bouwkundige- of
      woontechnische aanpassing in of aan de woonruimte betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0014915#Artikel2
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0014915
        artikel: '2'
        paragraaf: '1'
  - number: '7'
    text: |-
      In [artikel 8][ref1] en de daarop berustende bepalingen wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0014915#Artikel8
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014915
        artikel: '8'
        paragraaf: '4'
  - number: 7.a
    text: |-
      openbaar vervoer: voor een ieder openstaand personenvervoer volgens een dienstregeling met een bus, trein, metro,
      tram of een via een geleidesysteem voortbewogen voertuig;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel7
  - number: 7.b
    text: |-
      reisinformatie: informatie over de dienstregeling met de geldigheidsduur daarvan, gegarandeerde
      overstapmogelijkheden binnen de dienstregeling, wijzigingen van de dienstregeling en over tarieven en de daarbij
      behorende zone-indeling.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel7
  - number: '8.1'
    text: 'Onderscheid is verboden bij:'
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel8
  - number: 8.1.a
    text: |-
      het verlenen van de voor het reizen vereiste toegang tot de bij het openbaar vervoer behorende gebouwen en
      infrastructuur;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel8
  - number: 8.1.b
    text: het aanbieden van openbaar-vervoersdiensten en reisinformatie;
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel8
  - number: 8.1.c
    text: het sluiten, uitvoeren of beëindigen van overeenkomsten met betrekking tot openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel8
  - number: '8.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de ingevolge het eerste lid, in
      samenhang met [artikel 2][ref1], te verrichten aanpassingen als bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0014915#Artikel2
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0014915
        artikel: '2'
        paragraaf: '1'
  - number: '9'
    text: |-
      In geval van een beëindiging van de arbeidsverhouding door de werkgever in strijd met [artikel 4][ref1],
      of wegens de omstandigheid dat de werknemer in of buiten rechte een beroep heeft gedaan op artikel 4
      of ter zake bijstand heeft verleend, is [artikel 681 van Boek 7 van het Burgerlijk Wetboek][ref2] of
      [artikel 1615s van Boek 7a van het Burgerlijk Wetboek BES][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014915#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel681
      [ref3]: https://wetten.overheid.nl/BWBR0028752#Artikel1615s
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0014915
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '681'
      - id: ref3
        bwb_id: BWBR0028752
        artikel: 1615s
  - number: 9a
    text: |-
      Onverminderd [artikel 9][ref1] is het verboden personen te benadelen wegens het feit dat zij in of buiten rechte
      een beroep hebben gedaan op deze wet of ter zake bijstand hebben verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014915#Artikel9
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0014915
        artikel: '9'
        paragraaf: '5'
  - number: '10.1'
    text: |-
      Indien degene die meent dat te zijnen nadeel een onderscheid is of wordt gemaakt als bedoeld in deze wet, in rechte
      feiten aanvoert die dat onderscheid kunnen doen vermoeden, dient de wederpartij te bewijzen dat niet in strijd met
      deze wet is gehandeld.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel10
  - number: '10.2'
    text: |-
      Indien degene die meent dat te zijnen nadeel is gehandeld in strijd met [artikel 2][ref1] in rechte feiten aanvoert
      die kunnen doen vermoeden dat is nagelaten doeltreffende aanpassingen te treffen, dient de wederpartij te bewijzen
      dat niet in strijd met deze bepaling is gehandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0014915#Artikel2
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0014915
        artikel: '2'
        paragraaf: '1'
  - number: '10.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op vorderingen
      als bedoeld in [artikel 305a van Boek 3 van het Burgerlijk Wetboek][ref1] of
      [artikel 305a van Boek 3 van het Burgerlijk Wetboek BES][ref2] en op beroepen ingesteld door
      belanghebbenden in de zin van [artikel 1:2, derde lid, van de Algemene wet bestuursrecht][ref3] of
      [artikel 7, eerste lid, derde zin, van de Wet administratieve rechtspraak BES][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305a
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel305a
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0028455#Artikel7
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 305a
      - id: ref2
        bwb_id: BWBR0028745
        artikel: 305a
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0028455
        artikel: '7'
  - number: '11'
    text: Bedingen in strijd met deze wet zijn nietig.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel11
  - number: '12'
    text: |-
      De [artikelen 1 tot en met 11][ref1] van deze wet zijn mede van toepassing in de openbare lichamen Bonaire, Sint
      Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0014915#Artikel1
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0014915
        artikel: '1'
        paragraaf: '1'
  - number: '13'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport zendt in overeenstemming met Onze Ministers van Binnenlandse
      Zaken en Koninkrijksrelaties, van Justitie, van Sociale Zaken en Werkgelegenheid, van Verkeer en Waterstaat, van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer en van Onderwijs, Cultuur en Wetenschappen binnen vijf jaar
      na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van
      deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel13
  - number: '14'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel14
  - number: '15'
    text: 'Deze wet wordt aangehaald als: Wet gelijke behandeling op grond van handicap of chronische ziekte.'
    url: https://wetten.overheid.nl/BWBR0014915/2026-01-01#Artikel15
