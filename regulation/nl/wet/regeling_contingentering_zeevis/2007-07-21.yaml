  - number: '27'
    text: |-
      1 Een verzoek als bedoeld in de [artikelen 11, eerste lid][ref1], [12, eerste lid][ref2],
      [13, eerste en zesde lid][ref3], [14, eerste lid][ref4], [15, eerste lid][ref5], [18, eerste lid][ref6],
      [19, eerste lid][ref7], [20, eerste lid][ref8], [23, vierde lid][ref9] en [25, tweede lid][ref10], wordt bij de
      minister ingediend op een daartoe bestemd formulier.

      2 Een verzoek op grond van de in het eerste lid genoemde artikelen wordt slechts in behandeling genomen indien
      aan het eerste lid, en voorzover het een verzoek op grond van [artikel 13, eerste lid][ref11], betreft, aan
      [artikel 13, tweede en achtste lid][ref12], is voldaan.

      3 Een verzoek als bedoeld in de [artikelen 11, eerste lid][ref13], alsmede - indien het een contingent haring
      of makreel betreft - een verzoek als bedoeld in [artikel 12, eerste lid][ref14], wordt vóór 1 december van het
      kalenderjaar ingediend.

      4 Een verzoek als bedoeld in de [artikelen 18, eerste lid][ref15], en [20, eerste lid][ref16], wordt voor 20
      december van het kalenderjaar ingediend.

      5 Een verzoek als bedoeld in de [artikelen 19, eerste lid][ref17], en [23, vierde lid][ref18], alsmede - indien
      het een contingent van een andere vissoort dan genoemd in het derde lid betreft - een verzoek als bedoeld in
      [artikel 12, eerste lid][ref19], wordt vóór 1 maart van het kalenderjaar ingediend.


