  - number: '14'
    text: |-
      1 De minister kan voor een door hem vast te stellen periode:

      a. de toekenning van een contingent van een vissoort ten behoeve van een nader door de ondernemer aan te wijzen
      vissersvaartuig of vissersvaartuigen aanhouden, of

      b. op verzoek van de ondernemer aan wie het contingent van een vissoort op grond van [artikel 13][ref1] wordt
      overgedragen, de kennisgeving van de toekenning van het contingent, bedoeld in [artikel 13, tiende lid][ref2], ten
      behoeve van een door de ondernemer aan te wijzen vissersvaartuig of vissersvaartuigen, aanhouden.

      2 Indien de ondernemer overeenkomstig het eerste lid meer dan één vissersvaartuig heeft aangewezen, geeft hij voor
      elk van deze vaartuigen aan, voor welk deel van het aangehouden contingent hij de toekenning wenst.

      3 De toekenning van een contingent van een vissoort, bedoeld in het tweede lid, kan alleen betrekking hebben op
      vissersvaartuigen waarvoor reeds een contingent van dezelfde of - in voorkomend geval - van de desbetreffende
      aanverwante vissoort is toegekend.

      4 De toekenning van een aangehouden contingent van een aanverwante vissoort kan alleen betrekking hebben op
      vissersvaartuigen waarvoor reeds een contingent van die vissoort en van de in de bijlage, onderdeel b, bij die
      vissoort genoemde vissoort is toegekend.

      5 De toekenning van een contingent tijdens de door de minister vastgestelde periode van aanhouding kan slechts
      plaatsvinden:

      a. voorzover de ondernemer één of meer vissersvaartuigen heeft aangewezen waarvoor een contingent van dezelfde
      vissoort of - in voorkomend geval - van de desbetreffende aanverwante vissoort is vastgesteld, en het contingent
      van die vissoort of van die aanverwante vissoort nog niet voor 90% is opgevist op het moment van ontvangst van het
      verzoek tot toekenning;

      b. indien de minister de vrijstelling nog niet heeft ingetrokken;

      c. indien het contingent van de desbetreffende vissoort of - in voorkomend geval - van de desbetreffende
      aanverwante vissoort niet als gevolg van de korting overeenkomstig [artikel 23][ref3] is vastgesteld op nul, en

      d. - voorzover het een contingent haring, makreel, tong, blauwe wijting, grote zilvervis of schol betreft - indien
      de ondernemer een vissersvaartuig heeft aangewezen waarvoor geen contingent van de desbetreffende vissoort met - in
      voorkomend geval - een contingent van de desbetreffende aanverwante vissoort is vastgesteld en in het kalenderjaar
      met dat vissersvaartuig geen hoeveelheden van die vissoort of van die aanverwante vissoort zijn aangeland.

      6 Indien de ondernemer binnen de door de minister vastgestelde periode van aanhouding geen vissersvaartuig of
      vissersvaartuigen heeft aangewezen ten behoeve waarvan een contingent kan worden toegekend, vervalt na afloop van
      deze periode de toekenning van het contingent.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel13
