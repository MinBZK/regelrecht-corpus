  - number: '8'
    text: |-
      1 Het is verboden:

      a. per kalendermaand meer dan de in de bijlage, onderdeel d, aangegeven hoeveelheid makreel uit de sector
      IIa en deelgebied IV aan boord te hebben of aan te landen met een vissersvaartuig waarvoor geen contingent
      makreel, doch enig ander contingent ingevolge [artikel 10][ref1], [10a][ref2], [11][ref3], [13][ref4] of
      [14][ref5] is toegekend, of waaraan een vergunning is verleend voor het vangen van garnalen overeenkomstig
      [artikel 11 van de Beschikking visserij, visserijzone, zeegebied en kustwateren][ref6].

      b. makreel uit de sector of het deelgebied, als bedoeld in onderdeel a, aan boord te hebben
      van of aan te landen met een vissersvaartuig, behorende tot de groep vissersvaartuigen waarvoor
      geen contingent is toegekend ingevolge [artikel 10][ref7], [10a][ref8], [11][ref9], [13][ref10]
      of [14][ref11] en waarvoor geen vergunning is verleend voor het vangen van garnalen ingevolge
      [artikel 11 van de Beschikking visserij, visserijzone, zeegebied en kustwateren][ref12], indien die
      vissersvaartuigen in een kalenderjaar gezamenlijk de in de bijlage, onderdeel f, bedoelde hoeveelheid makreel
      hebben opgevist.

      2 De ondernemer die met een vissersvaartuig waarvoor geen contingent makreel is toegekend, deelneemt aan een
      groepscontingent, wordt geacht de som van de ingevolge het eerste lid voor het kalenderjaar toegestane hoeveelheden
      makreel ten titel van beheer in de groep dan wel producentenorganisatie te hebben ingebracht.

      3 Het is verboden met vissersvaartuigen die aan een groepscontingent deelnemen en waarvoor geen contingent makreel
      is toegekend, een grotere hoeveelheid makreel uit sector IIa en deelgebied IV aan boord te houden of aan te landen
      dan de som van de op grond van het tweede lid in een groep dan wel producentenorganisatie ingebrachte hoeveelheid
      makreel.


