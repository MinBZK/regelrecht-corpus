  - number: '21'
    text: |-
      1 De ten behoeve van een groepscontingent samengevoegde contingenten van een vissoort kunnen gedurende een
      kalenderjaar niet aan het groepscontingent worden onttrokken.

      2 Onverminderd het eerste lid kan de minister toestemming verlenen één of meer van de tot een groepscontingent
      samengevoegde contingenten van een vissoort, of een gedeelte daarvan, aan het groepscontingent te onttrekken in het
      geval van:

      a. definitieve bedrijfsbeëindiging;

      b. faillissement van een ondernemer;

      c. overdracht van één of meer van de desbetreffende vissersvaartuigen, of

      d. een verzoek tot onttrekking van de desbetreffende ondernemer of ondernemers, mits:

      1°. het verzoek vergezeld gaat van een schriftelijke verklaring van het groepsbestuur dan wel bestuur van de
      producentenorganisatie dat het desbetreffende groepscontingent beheert, dat het met de onttrekking instemt, en

      2°. het groepscontingent van de desbetreffende vissoort of - in voorkomend geval - van de desbetreffende
      aanverwante vissoort, op het moment van ontvangst van het verzoek nog niet voor 90% is opgevist.

      3 Indien de minister de toestemming, bedoeld in het tweede lid, verleent, worden de te onttrekken contingenten
      van een vissoort verminderd met de vangsten die tot de datum van onttrekking op basis van die contingenten zijn
      gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel21
  - number: '22'
    text: |-
      1 De minister kan op verzoek van het Produktschap Vis en het desbetreffende groepsbestuur dan wel bestuur van de
      producentenorganisatie een deelnemer aan een groepscontingent van verdere deelname uitsluiten indien de deelnemer
      de binnen de groep dan wel producentenorganisatie geldende regels niet naleeft.

      2 De minister kent aan de uitgesloten deelnemer, bedoeld in het eerste lid, voor zijn vissersvaartuig een
      contingent van de desbetreffende vissoort en - in voorkomend geval - van de desbetreffende aanverwante vissoort-
      toe dat gelijk is aan het op grond van de [artikelen 10, eerste lid][ref1], en [10a][ref2] toegekende contingent
      van die vissoort, onderscheidenlijk van die aanverwante vissoort, verminderd met de tot de datum van uitsluiting
      met dat vissersvaartuig gerealiseerde vangsten of indien deze hoger zijn, verminderd met het evenredig aandeel van
      de vangsten gerealiseerd door de deelnemers aan het groepscontingent.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008477#Artikel10a
