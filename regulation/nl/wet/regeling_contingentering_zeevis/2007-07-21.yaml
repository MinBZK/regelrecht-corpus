  - number: '12'
    text: |-
      1 De minister kan een ondernemer op diens verzoek toestaan dat het contingent van een vissoort dat voor zijn
      vissersvaartuig is toegekend of waarvan de toekenning ingevolge [artikel 14][ref1] is aangehouden, in het
      kalenderjaar geheel of voor een door de ondernemer gelijktijdig op te geven gedeelte wordt opgevist, aan boord
      gehouden en aangeland door:

      a. een met name genoemde ondernemer met één of meer vissersvaartuigen waarvan het toegekende contingent van
      dezelfde vissoort of – in voorkomend geval – van de desbetreffende aanverwante vissoort op het moment van ontvangst
      van het verzoek nog niet voor 90% is opgevist, of

      b. ondernemers die hun contingent van de desbetreffende vissoort hebben ingebracht in een groepscontingent, indien
      het groepscontingent van die vissoort of – in voorkomend geval – van de desbetreffende aanverwante vissoort op het
      moment van ontvangst van het verzoek nog niet voor 90% is opgevist.

      2 De minister verleent de toestemming, bedoeld in het eerste lid, niet indien:

      a. het verzoek betrekking heeft op de ingebruikgeving voor een vissersvaartuig of vissersvaartuigen waarvan het
      toegekende contingent van de desbetreffende vissoort of – in voorkomend geval – van de desbetreffende aanverwante
      vissoort als gevolg van de korting overeenkomstig [artikel 23][ref2] is vastgesteld op nul, of

      b. de vrijstelling is ingetrokken.

      3 Onverminderd het eerste lid dient op het moment van het verzoek de periode waarvoor de kennisgeving van de
      toekenning van een contingent van een vissoort is aangehouden, ten minste gelijk te zijn aan de periode waarvoor
      het contingent van de desbetreffende vissoort waarvan de kennisgeving van de toekenning is aangehouden, geheel of
      gedeeltelijk in gebruik wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008477#Artikel23
