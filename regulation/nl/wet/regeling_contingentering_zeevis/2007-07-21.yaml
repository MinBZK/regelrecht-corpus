    text: |-
      De minister kan bij regeling een tijdstip vaststellen waarna verzoeken als bedoeld in de
      [artikelen 13, eerste lid][ref1], en [15, eerste lid][ref2], voor een daarbij te noemen vissoort niet meer kunnen
      worden ingediend.


