  - number: 8a
    text: |-
      Het is voor de vissersvaartuigen waaraan geen contingent horsmakreel uit sector IIa (EG-zone) en deelgebied IV (EG-
      zone) tezamen is toegewezen verboden per kalenderjaar gezamenlijk meer horsmakreel uit die sector en dat deelgebied
      tezamen aan boord te hebben of aan te landen, dan de hoeveelheid horsmakreel genoemd in de bijlage, onderdeel f.
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel8a
  - number: 8b
    text: |-
      Kabeljauw, wijting of makreel, gevangen door vaartuigen, bedoeld in [artikel 7, eerste lid, onderdeel b][ref1], of
      [artikel 8, eerste lid, onderdeel b][ref2], mag slechts dan worden aangeland als de hoeveelheid kabeljauw, wijting
      of makreel niet meer bedraagt dan 20% van het gewicht van de totale vangst aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008477#Artikel8
