  - number: '24'
    text: |-
      1 Indien de ondernemer het voor het kalenderjaar toegekende contingent van een vissoort overschrijdt, wordt het
      voor het jaar volgend op het kalenderjaar toe te kennen contingent van die vissoort overeenkomstig gekort. Indien
      de hoeveelheid van die vissoort waarmee het voor het kalenderjaar toe te kennen contingent van die vissoort wordt
      overschreden, groter is dan de omvang van het voor het jaar volgend op het kalenderjaar toe te kennen contingent
      van die vissoort, wordt het voor de jaren na laatstbedoeld jaar toe te kennen contingent van die vissoort
      overeenkomstig gekort.

      2 Indien de hoeveelheid van een vissoort waarmee het voor een aan het kalenderjaar voorafgaand jaar toegekende
      contingent van een vissoort werd overschreden, groter is dan de omvang van het voor een daaropvolgend jaar
      toegekend contingent van die vissoort, wordt het voor de op laatstbedoeld jaar volgende jaren toe te kennen
      contingent van die vissoort overeenkomstig gekort.

      3 Het eerste lid is van overeenkomstige toepassing indien de ondernemer in het kalenderjaar de som van de voor zijn
      vissersvaartuigen toegekende contingenten overschrijdt.

      4 Indien het voor het kalenderjaar gevormde groepscontingent van een vissoort wordt overschreden, wordt de
      hoeveelheid van de desbetreffende vissoort waarmee het groepscontingent is overschreden, op de voor het op het
      kalenderjaar volgende jaar toe te kennen contingenten van die vissoort van die deelnemers in mindering gebracht
      die in het kalenderjaar hun individueel aandeel van die vissoort in dat groepscontingent hebben overschreden.
      Indien de hoeveelheid van die vissoort waarmee het individueel aandeel in het groepscontingent in het kalenderjaar
      wordt overschreden groter is dan de omvang van het voor op het kalenderjaar volgende jaar toe te kennen contingent
      van die vissoort, wordt het voor de jaren na laatstbedoeld jaar toe te kennen contingent van die vissoort
      overeenkomstig gekort.

      5 Indien de hoeveelheid van een vissoort waarmee het individueel aandeel van een vissoort in het groepscontingent
      in het aan het kalenderjaar voorafgaande jaar werd overschreden, groter is dan de omvang van het voor het
      kalenderjaar toe te kennen contingent van die vissoort wordt het voor het op het kalenderjaar volgende jaar en de
      daarop volgende jaren toe te kennen contingent van die vissoort overeenkomstig gekort.

      6 Het eerste en tweede lid zijn van overeenkomstige toepassing op de ondernemer die de toestemming, bedoeld in
      [artikel 15][ref1], heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel15
