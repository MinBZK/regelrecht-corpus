  - number: 10a
    text: |-
      De minister kent voor de duur van een kalenderjaar aan een ondernemer een contingent grote zilvervis toe,
      met inachtneming van het aandeel van die ondernemer in de totale van die vissoort gevangen hoeveelheid in de
      kalenderjaren 1998, 1999 of 2000. Artikel 23, eerste lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel10a
  - number: '11'
    text: |-
      1 In afwijking van [artikel 10, eerste lid][ref1], kan de minister op verzoek van een ondernemer die meer dan één
      vissersvaartuig in eigendom heeft waarvoor een contingent van dezelfde vissoort is toegekend, die contingenten
      volgens een door de ondernemer aangegeven andere verdeling voor deze vissersvaartuigen opnieuw toekennen.

      2 De minister willigt het verzoek, bedoeld in het eerste lid, slechts in:

      a. - voorzover het contingenten van een aanverwante vissoort betreft - mits voor de betrokken vissersvaartuigen
      zowel een contingent van de desbetreffende aanverwante vissoort als een contingent van de in de bijlage, onderdeel
      b, bij die aanverwante vissoort genoemde vissoort wordt toegekend;

      b. indien de contingenten van de desbetreffende vissoort of - in voorkomend geval - van de desbetreffende
      aanverwante vissoort van de betrokken vissersvaartuigen nog niet voor 90% zijn opgevist, dan wel niet als gevolg
      van de korting overeenkomstig [artikel 23][ref2] zijn vastgesteld op nul op het moment van ontvangst van het
      verzoek, en

      c. de vrijstelling nog niet is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008477#Artikel23
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel11
