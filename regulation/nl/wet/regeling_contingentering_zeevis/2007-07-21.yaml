  - number: 22a
    text: |-
      Bij de onttrekking van contingenten, bedoeld in [artikel 21, tweede en derde lid][ref1], alsmede bij de toekenning
      van een contingent, bedoeld in [artikel 22, tweede lid][ref2], gaat de minister bij de berekening van het
      desbetreffende toe te kennen contingent uit van de gegevens uit het Visserij Registratie en Informatie Systeem
      van het ministerie van Landbouw, Natuurbeheer en Visserij, aangevuld met de gegevens uit de laatst door het
      groepsbestuur dan wel bestuur van de producentenorganisatie overgelegde kopie van de administratieve gegevens,
      bedoeld in [artikel 17, onderdeel h][ref3], behoudens tegenbewijs van de belanghebbende bij dat contingent.


