        artikel: '23'
        hoofdstuk: '5'
  - number: '20'
    text: |-
      1 De minister kan op verzoek van een groepsbestuur dan wel bestuur van de producentenorganisatie toestaan dat een
      gedeelte van de op grond van [artikel 8, tweede lid][ref1], ingebrachte hoeveelheden makreel wordt opgevist, aan
      boord gehouden en aangeland door deelnemers aan een ander groepscontingent.

      2 De minister verleent de toestemming, bedoeld in het voorgaande lid, alleen indien hij de op grond van
      [artikel 2, tweede lid, van de Regeling vangstbeperking][ref2] verleende vrijstelling op visserij op makreel in het
      vangstgebied nog niet heeft ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel8
