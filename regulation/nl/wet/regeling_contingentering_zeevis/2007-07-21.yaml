        artikel: '25'
        hoofdstuk: '6'
  - number: '3'
    text: |-
      1 Het is verboden met een vissersvaartuig op tong in het vangstgebied te vissen, dan wel tong uit dat gebied aan te
      landen of aan boord te houden, indien het voor dat vissersvaartuig toegekende contingent schol is opgevist.

      2 Het is verboden met een vissersvaartuig op kabeljauw in het vangstgebied te vissen, dan wel kabeljauw uit dat
      gebied aan te landen of aan boord te houden, indien het voor dat vissersvaartuig toegekende contingent wijting
      is opgevist.
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel3
  - number: '4'
    text: |-
      1 Het is verboden met een vissersvaartuig waarvan het toegekende contingent van een vissoort met andere
      contingenten van die vissoort is samengevoegd tot een groepscontingent, in het voor die vissoort aangewezen
      vangstgebied op de desbetreffende vissoort te vissen, dan wel die vissoort uit dat gebied aan te landen of aan
      boord te houden, indien het groepscontingent is opgevist.

      2 Het is verboden met een vissersvaartuig waarvan de toegekende contingenten tong en schol met andere contingenten
      van die vissoorten zijn samengevoegd tot een groepscontingent, op tong in het vangstgebied te vissen, dan wel tong
      uit dat gebied aan te landen of aan boord te houden, indien het groepscontingent schol is opgevist.

      3 Het is verboden met een vissersvaartuig waarvan de toegekende contingenten kabeljauw en wijting met andere
      contingenten van die vissoorten zijn samengevoegd tot een groepscontingent, op kabeljauw in het vangstgebied te
      vissen, dan wel kabeljauw uit dat gebied aan te landen of aan boord te houden, indien het groepscontingent wijting
      is opgevist.
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel4
  - number: '5'
    text: |-
      1 Het is verboden met de vissersvaartuigen waarvoor de toestemming, bedoeld in [artikel 15, eerste lid][ref1], is
      verleend, op een grotere hoeveelheid van een vissoort in het voor die vissoort aangewezen vangstgebied te vissen,
      dan wel een vissoort uit dat gebied aan te landen of aan boord te houden, indien het samengevoegde contingent van
      de desbetreffende vissoort is opgevist.

      2 Het is verboden met de vissersvaartuigen waarvoor de toestemming, bedoeld in [artikel 15, eerste lid][ref2], is
      verleend, tong in het vangstgebied te vissen, dan wel tong uit dat gebied aan te landen of aan boord te houden,
      indien het samengevoegde contingent schol is opgevist.

      3 Het is verboden met de vissersvaartuigen waarvoor de toestemming, bedoeld in [artikel 15, eerste lid][ref3], is
      verleend, op kabeljauw in het vangstgebied te vissen, dan wel kabeljauw uit dat gebied aan te landen of aan boord
      te houden, indien het samengevoegde contingent wijting is opgevist.


