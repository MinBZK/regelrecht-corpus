    text: |-
      1 De Regeling contingentering haring 1996, de Regeling contingentering kabeljauw en wijting 1996, de Regeling
      contingentering makreel westelijke wateren 1996 en de Regeling contingentering tong en schol 1996 worden
      ingetrokken.

      2 Het bepaalde bij of krachtens de regelingen, genoemd in het eerste lid, blijft van toepassing ten aanzien van op
      grond van die regelingen gedane verzoeken waarop vóór 1 januari 1997 nog niet onherroepelijk is beslist.
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel30
