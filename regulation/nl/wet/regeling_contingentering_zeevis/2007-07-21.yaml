  - number: '13'
    text: |-
      1 Het aan een ondernemer toegekende contingent van een vissoort is op verzoek geheel of gedeeltelijk overdraagbaar
      aan één of meer ondernemers.

      2 Een ondernemer die het aan hem toegekende contingent geheel of gedeeltelijk wil overdragen, dient daartoe een
      verzoek in bij de minister. Dit verzoek gaat vergezeld van het document, bedoeld in [artikel 25][ref1].

      3 Een geheel contingent van een aanverwante vissoort kan slechts worden overgedragen aan een ondernemer ten behoeve
      van een vissersvaartuig waarvoor reeds een contingent van die vissoort en van de in de bijlage, onderdeel b, bij
      die vissoort genoemde vissoort is toegekend.

      4 Een gedeeltelijk contingent kabeljauw kan slechts worden overgedragen aan een ondernemer ten behoeve van een
      vissersvaartuig waarvoor reeds contingenten kabeljauw en wijting zijn toegekend.

      5 Een gedeeltelijk contingent van een andere vissoort dan genoemd in het vierde lid kan slechts worden overgedragen
      aan een ondernemer ten behoeve van een vissersvaartuig waarvoor reeds een contingent van dezelfde vissoort is
      toegekend.

      6 Een geheel contingent van een aanverwante vissoort kan slechts worden overgedragen tegelijkertijd met de gehele
      overdracht van het aan de desbetreffende ondernemer toegekende contingent van de in de bijlage, onderdeel b, bij
      de desbetreffende aanverwante vissoort genoemde vissoort, met dien verstande dat de minister op verzoek van die
      ondernemer kan toestaan het verzoek tot overdracht van laatstbedoelde vissoort voor een door hem vast te stellen
      periode aan te houden.

      7 Indien ten behoeve van de ondernemer een pandrecht op het contingent van de desbetreffende vissoort is verleend,
      gaat een verzoek als bedoeld in het tweede lid eveneens vergezeld van een verklaring dat de pandhouder met de
      overdracht instemt.

      8 De instemming, bedoeld in het achtste lid, is slechts vereist indien de pandhouder de minister door middel van
      een afschrift van de akte van verpanding in kennis heeft gesteld van het gevestigde pandrecht.

      9 De overdracht vindt plaats door kennisgeving van de minister aan de ondernemer aan wie het contingent van een
      vissoort wordt overgedragen, dat voor een door de ondernemer aangewezen vissersvaartuig of vissersvaartuigen
      op zijn naam een contingent van dezelfde vissoort is toegekend, gelijk aan het eerder voor de ondernemer die
      overdraagt, toegekend contingent van die vissoort, en dat voor het lopende jaar dat contingent is verminderd met
      het eventueel reeds opgeviste deel daarvan en de hoeveelheden, bedoeld in [artikel 23][ref2].

      10 Indien de ondernemer aan wie de kennisgeving, bedoeld in het tiende lid, is gericht, meer dan één
      vissersvaartuig heeft aangewezen, geeft hij voor elk van deze vissersvaartuigen aan op welk deel van het
      desbetreffende contingent of van de desbetreffende contingenten de overdracht betrekking heeft.

      11 De kennisgeving, bedoeld in het tiende lid, vindt voor het lopende jaar slechts plaats:

      a. voorzover aan een ondernemer wordt overgedragen ten behoeve van een vissersvaartuig of vissersvaartuigen
      waarvoor een contingent van dezelfde vissoort met - in voorkomend geval - een contingent van de desbetreffende
      aanverwante vissoort is vastgesteld, indien het voor dat jaar aan de ondernemer aan wie wordt overgedragen,
      toegekende contingent van die vissoort of van die aanverwante vissoort nog niet voor 90% is opgevist, op het moment
      van ontvangst van het verzoek, bedoeld in het tweede lid;

      b. voorzover niet aan een ondernemer wordt overdragen ten behoeve van een vissersvaartuig of vissersvaartuigen
      waarvoor het toegekende contingent van de desbetreffende vissoort of - in voorkomend geval - van de desbetreffende
      aanverwante vissoort als gevolg van de korting overeenkomstig [artikel 23][ref3] is vastgesteld op nul;

      c. indien de minister de vrijstelling nog niet heeft ingetrokken, en

      d. - voorzover het de overdracht van een contingent haring, makreel, tong, blauwe wijting, grote zilvervis of schol
      betreft - aan een ondernemer ten behoeve van een vissersvaartuig waarvoor geen contingent van dezelfde vissoort of
        - in voorkomend geval - van de desbetreffende aanverwante vissoort is vastgesteld, indien in het kalenderjaar met
      dat vissersvaartuig geen hoeveelheden van die vissoort of van die aanverwante vissoort is aangeland.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0008477#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0008477#Artikel23
