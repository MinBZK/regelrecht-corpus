    text: |-
      1 Indien twee of meer vissersvaartuigen waarvoor contingenten haring betrekking hebbend op hetzelfde vangstgebied,
      kabeljauw en wijting, of makreel zijn toegekend, de visserij in span uitoefenen, wordt elk van de betrokken
      vissersvaartuigen geacht een evenredig deel van de totale door deze vissersvaartuigen aangelande hoeveelheid van de
      desbetreffende vissoort of vissoorten te hebben aangeland.

      2 Alle tot het span te rekenen vissersvaartuigen als bedoeld in het eerste lid moeten in dezelfde haven aanlanden
      en gezamenlijk uitlossen.
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel9
  - number: '10'
    text: |-
      1 De minister kent voor de duur van het kalenderjaar aan een ondernemer voor wie op 31 december van het
      voorafgaande jaar om 24.00 uur voor zijn vissersvaartuig een contingent van een vissoort was toegekend, een
      contingent van die vissoort toe tot een in de bijlage, onderdeel e, vermeld percentage van het in het voorafgaande
      jaar aan de ondernemer voor die vissoort toegekende contingent en met inachtneming van [artikel 23][ref1].

      2 Een contingent van een aanverwante vissoort wordt aan een ondernemer slechts tezamen met een contingent van de in
      de bijlage, onderdeel b, bij de desbetreffende aanverwante vissoort genoemde vissoort toegekend.

      3 Bij de vaststelling van een contingent voor het kalenderjaar wordt het percentage waarmee het contingent voor
      het voorafgaande jaar is verhoogd, meegerekend, ongeacht of voor het voorafgaande jaar het contingent niet met dat
      percentage is verhoogd als gevolg van overschrijding van het desbetreffende contingent in dat jaar.

      4 De minister wijzigt het in het eerste lid genoemde percentage voor een vissoort indien ten gevolge van een
      bindend besluit van de Raad van de Europese Unie, van het Europees Parlement en de Raad gezamenlijk of van de
      Commissie van de Europese Gemeenschappen de voor de gezamenlijke Nederlandse vissers beschikbare hoeveelheid van
      die vissoort wordt verlaagd.

      5 Tenzij de vrijstelling is ingetrokken, kan de minister ten behoeve van een ondernemer die het aan hem toegekende
      contingent van een vissoort nog niet heeft overschreden, het in het eerste lid genoemde percentage wijzigen indien:

      a. de voor de gezamenlijke Nederlandse vissers beschikbare hoeveelheid van die vissoort daartoe ruimte biedt, of

      b. ten gevolge van een ruil van quota als bedoeld in artikel 9, eerste lid, van [verordening (EEG) nr. 3760/92]
      (31992R3760) van de Raad van de Europese Gemeenschappen van 20 december 1992 tot invoering van een communautaire
      regeling voor de visserij en de aquacultuur (PbEG L 389) wijziging optreedt in de voor de gezamenlijke Nederlandse
      vissers beschikbare hoeveelheid van die vissoort.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel23
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel10
