  - number: '16'
    text: |-
      1 Indien ondernemers de voor hun vissersvaartuigen toegekende contingenten van een vissoort voor het kalenderjaar
      ten behoeve van de vorming van een groepscontingent van die vissoort samenvoegen, kent de minister, mits hij vóór
      1 februari van het kalenderjaar het daartoe strekkende verzoek heeft ontvangen, groepscontingenten van die vissoort
      toe gelijk aan de som van de gezamenlijke ingebrachte contingenten van die vissoort voor zoveel deze niet reeds
      zijn opgevist en aangeland en verminderd met de hoeveelheden, bedoeld in [artikel 23][ref1], en met inachtneming
      van deze paragraaf.

      2 Een groepscontingent kan worden toegekend aan een groep:

        - die bestaat uit ten minste 15 ondernemers die lid zijn van één dezelfde producentenorganisatie;
        - die rechtspersoonlijkheid bezit, en
        - die onder leiding staat van een voorzitter wiens benoeming door het Productschap Vis moet zijn goedgekeurd,

      dan wel aan een producentenorganisatie.

      3 Een ondernemer kan slechts deelnemen aan een groepscontingent indien:

      a. hij alle aan hem toegekende, en gedurende het kalenderjaar eventueel nog toe te kennen, contingenten van de
      desbetreffende vissoort ten titel van beheer in de groep dan wel producentenorganisatie inbrengt;

      b. - voorzover het een aanverwante vissoort betreft - hij alle aan hem toegekende, en gedurende het kalenderjaar
      eventueel nog toe te kennen contingenten van de in de bijlage, onderdeel b, bij die aanverwante vissoort genoemde
      vissoort ten titel van beheer in de groep dan wel producentenorganisatie inbrengt;

      c. hij zijn contingenten van de desbetreffende vissoort of - in voorkomend geval - van de desbetreffende
      aanverwante vissoort nog niet voor 90% heeft opgevist op het tijdstip van ontvangst van het verzoek, bedoeld in het
      eerste lid, en

      d. de voor het kalenderjaar aan zijn vissersvaartuig of vissersvaartuigen toegekende contingenten van de
      desbetreffende vissoort of - in voorkomend geval - van de desbetreffende aanverwante vissoort als gevolg van de
      korting overeenkomstig [artikel 23][ref2] niet zijn vastgesteld op nul.

      4 De ondernemer aan wie in het kalenderjaar voor zijn vissersvaartuig of vissersvaartuigen contingenten van
      verschillende vissoorten zijn toegekend, kan slechts met zijn vissersvaartuig of vissersvaartuigen aan één van de
      groepscontingenten deelnemen.

      5 Indien een ondernemer die deelneemt aan een groepscontingent, gedurende het kalenderjaar een contingent van de
      vissoort waarvan contingenten zijn ingebracht in dat groepscontingent, verwerft, wordt dat contingent toegevoegd
      aan dat groepscontingent, tenzij dat groepscontingent of - in voorkomend geval - het groepscontingent van de
      desbetreffende aanverwante vissoort voor meer dan 90% is opgevist.

      6 Het verzoek, bedoeld in het eerste lid, wordt door de groep dan wel producentenorganisatie ingediend waarbij de
      volgende bescheiden worden overgelegd:

      a. een visplan;

      b. de statuten van de groep dan wel producentenorganisatie waarin in ieder geval is bepaald dat de leden van de
      groep dan wel producentenorganisatie alle aan te voeren vis via bemiddeling van visafslagen moeten verhandelen en
      dat bij niet-naleving van de door de groep dan wel producentenorganisatie opgestelde bepalingen een sanctiesysteem
      zal worden toegepast en op welke wijze de geïnde boetes door de groep dan wel producentenorganisatie zullen worden
      besteed;

      c. het huishoudelijk reglement van de groep dan wel producentenorganisatie, en

      d. een ondertekende verklaring van alle leden van de groep dan wel producentenorganisatie waaruit blijkt dat zij de
      voor het kalenderjaar toegekende contingenten aan de groep dan wel producentenorganisatie in beheer hebben gegeven.

      7 In het visplan, bedoeld in het zesde lid, onderdeel a, moet ten minste worden aangegeven:

      a. de spreiding van de aanvoer van het beschikbare groepscontingent;

      b. welke maatregelen genomen zijn of zullen worden genomen om de visserij-inspanning van de deelnemers aan het
      groepscontingent af te stemmen op de desbetreffende groepscontingenten.

      8 De minister willigt het verzoek, bedoeld in het eerste lid, niet in indien:

      a. de bescheiden, bedoeld in het zesde lid, niet zijn overgelegd, of

      b. naar zijn oordeel de naleving van deze regeling en van de afspraken die binnen de groep dan wel
      producentenorganisatie zijn gemaakt, onvoldoende is verzekerd.

      9 De minister kent een groepscontingent toe op naam van de groep dan wel producentenorganisatie en ten gunste van
      de vissersvaartuigen waarvan de contingenten aan de groep dan wel producentenorganisatie in beheer zijn gegeven.

      10 De toekenning van een groepscontingent aan een producentenorganisatie is voor 2007 slechts mogelijk indien de
      producentenorganisatie vóór 1 september 2007 een in [artikel 16, eerste lid][ref3], bedoeld verzoek heeft ingediend
      bij de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008477#Artikel23
