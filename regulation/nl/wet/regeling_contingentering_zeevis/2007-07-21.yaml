  - number: '6'
    text: |-
      1 Het is verboden, indien voor meer dan één visservaartuig van één ondernemer contingenten van een vissoort zijn
      toegekend, op de desbetreffende vissoort met één van deze vissersvaartuigen in het vangstgebied te vissen, dan wel
      die vissoort uit dat gebied aan te landen of aan boord te houden, indien de som van de voor de vissersvaartuigen
      van die ondernemer toegekende, op dat gebied betrekking hebbende, contingenten van die vissoort is opgevist.

      2 Het is verboden, indien voor meer dan één vissersvaartuig van één ondernemer contingenten tong en schol zijn
      toegekend, met één van deze vissersvaartuigen op tong in het vangstgebied te vissen, dan wel tong uit dat gebied
      aan te landen of aan boord te houden, indien de som van de voor de vissersvaartuigen van die ondernemer toegekende
      contingenten schol is opgevist.

      3 Het is verboden, indien voor meer dan één vissersvaartuig van één ondernemer contingenten kabeljauw en wijting
      zijn toegekend, met één van deze vissersvaartuigen op kabeljauw in het vangstgebied te vissen, dan wel kabeljauw
      uit dat gebied aan te landen of aan boord te houden, indien de som van de voor de vissersvaartuigen van die
      ondernemer toegekende contingenten wijting is opgevist.
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel6
  - number: '7'
    text: |-
      1 Het is verboden:

      a. per kalendermaand meer dan de in de bijlage, onderdeel c, aangegeven hoeveelheden kabeljauw of wijting uit
      het vangstgebied aan boord te hebben van of aan te landen met een vissersvaartuig waarvoor geen contingent
      kabeljauw of wijting, doch enig ander contingent ingevolge [artikel 10][ref1], [10a][ref2], [11][ref3],
      [13][ref4] of [14][ref5] is toegekend of waaraan een vergunning voor het vangen van garnalen overeenkomstig
      [artikel 11 van de Beschikking visserij, visserijzone, zeegebied en kustwateren][ref6] is verleend.

      b. kabeljauw of wijting uit het vangstgebied aan boord te hebben van of aan te landen met een vissersvaartuig,
      behorende tot de groep van vissersvaartuigen waarvoor geen contingent ingevolge [artikel 10][ref7], [10a][ref8],
      [11][ref9], [13][ref10] of [14][ref11] is toegekend en waarvoor geen vergunning is verleend voor het vangen van
      garnalen ingevolge [artikel 11 van de Beschikking visserij, visserijzone, zeegebied en kustwateren][ref12], indien
      die vissersvaartuigen in een kalenderjaar gezamenlijk de in de bijlage, onderdeel f, bedoelde hoeveelheid kabeljauw
      of wijting hebben opgevist.

      2 In afwijking van het eerste lid, is het verboden voor een vissersvaartuig met een brutotonnage van meer dan 1.200
      BT waarmee de pelagische visserij wordt uitgeoefend:

      a. in het kalenderjaar meer kabeljauw of wijting aan te landen dan de som van de ingevolge het eerste lid voor het
      kalenderjaar voor dat vaartuig toegestane hoeveelheden kabeljauw of wijting, of

      b. kabeljauw of wijting aan boord te hebben nadat de som van de ingevolge het eerste lid voor het kalenderjaar voor
      dat vaartuig toegestane hoeveelheden kabeljauw of wijting is aangeland.

      3 De ondernemer die met een vissersvaartuig waarvoor geen contingenten kabeljauw en wijting zijn toegekend,
      deelneemt aan een groepscontingent, wordt geacht de som van de ingevolge het eerste lid voor het kalenderjaar
      toegestane hoeveelheden kabeljauw of wijting ten titel van beheer in de groep dan wel producentenorganisatie te
      hebben ingebracht.

      4 Het is verboden met vissersvaartuigen die aan een groepscontingent deelnemen en waarvoor geen contingenten
      kabeljauw of wijting zijn toegekend, een grotere hoeveelheid kabeljauw of wijting aan boord te houden of aan
      te landen dan de som van de op grond van het derde lid in een groep dan wel producentenorganisatie ingebrachte
      hoeveelheden kabeljauw of wijting.


