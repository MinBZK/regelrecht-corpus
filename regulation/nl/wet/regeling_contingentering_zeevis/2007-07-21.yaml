  - number: '28'
    text: |-
      De [artikelen 11, tweede lid, aanhef en onderdeel b][ref1], [12, eerste lid, aanhef en onderdeel a][ref2],
      [13, twaalfde lid, aanhef en onderdeel a][ref3], [14, zevende lid, aanhef en onderdeel a][ref4], 15, tweede lid,
      aanhef en onderdeel a, en vierde lid, [16, derde lid, aanhef en onderdeel c][ref5], en [19, eerste lid][ref6], zijn
        - voorzover het betreft het nog niet voor 90% hebben opgevist van het contingent - niet van toepassing op tong en
      schol voor de ondernemer voor wie als gevolg van de korting, bedoeld in [artikel 23][ref7], minder dan 10% van het
      op grond van [artikel 10, eerste lid][ref8], toegekende contingent tong of schol resteert, onder de voorwaarde dat
      het contingent tong of schol nog niet is overschreden op het tijdstip van ontvangst van het verzoek.


