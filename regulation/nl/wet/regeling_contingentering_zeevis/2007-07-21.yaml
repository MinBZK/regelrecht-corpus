  - number: '17'
    text: |-
      Het groepsbestuur dan wel bestuur van de producentenorganisatie is verplicht om:

      a. een visplan op te stellen en toe te zien op de naleving daarvan;

      b. erop toe te zien dat de leden van de groep dan wel producentenorganisatie het groepscontingent niet
      overschrijden;

      c. de visserij op de desbetreffende vissoort te verbieden indien het groepscontingent is opgevist;

      d. in geval van overschrijding van het individueel aandeel of van het groepscontingent sanctiemaatregelen toe te
      passen;

      e. huur- en verhuurtransacties te registreren en te administreren;

      f. een deugdelijke administratie te voeren waaruit te allen tijde de omvang van het groepscontingent blijkt,
      alsmede welke hoeveelheden van de desbetreffende vissoort per vissersvaartuig, per deelgebied of sector zijn
      aangeland;

      g. elke wijziging van de statuten en huishoudelijke reglementen, bedoeld in [artikel 16, zesde lid][ref1],
      onverwijld aan de minister en aan het Produktschap Vis over te leggen;

      h. De Algemene Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij en het Produktschap Vis te
      allen tijde inzage te verlenen in de gegevens, bedoeld in onderdelen e en f;

      i. op verzoek de minister een kopie te verstrekken van de gegevens, bedoeld in onderdeel h, en

      j. de door het groepsbestuur dan wel bestuur van de producentenorganisatie ontvangen gegevens ingevolge
      [artikel 3, eerste lid, van de Regeling visserij-inspanning herstelplannen][ref2] na ontvangst onverwijld door te
      sturen aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0016340#Artikel3
