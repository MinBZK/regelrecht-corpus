  - number: '23'
    text: |-
      1 Het op grond van de [artikelen 10, eerste lid][ref1], en [10a][ref2], toegekende contingent van een vissoort
      wordt voor het kalenderjaar verminderd met een eventuele overschrijding van een voor een aan het kalenderjaar
      voorafgaand jaar toegekend contingent van die vissoort inclusief de eventueel in het desbetreffende jaar in
      gebruik gekregen hoeveelheden van die vissoort, voorzover die overschrijding het voor het jaar voorafgaande aan het
      kalenderjaar toegekende contingent van de desbetreffende vissoort te boven gaat.

      2 Indien aan de ondernemer in een jaar voorafgaande aan het kalenderjaar toestemming is verleend voor het
      samenvoegen van contingenten van een vissoort tot een rederijcontingent, dan wordt het op grond van de
      [artikelen 10, eerste lid][ref3], en [10a][ref4], toegekende contingent van een vissoort voor het kalenderjaar
      verminderd met de hoeveelheid van die vissoort, die de ondernemer in een jaar voorafgaande aan het kalenderjaar
      heeft aangeland nadat het samengevoegde contingent van die vissoort inclusief de eventueel in gebruik gekregen
      hoeveelheden van die vissoort, was opgevist, voorzover die hoeveelheid het voor het jaar voorafgaande aan het
      kalenderjaar toegekende contingent van de desbetreffende vissoort te boven gaat.

      3 Indien in een jaar voorafgaande aan het kalenderjaar een groepscontingent van een vissoort is overschreden, wordt
      het op grond van de [artikelen 10, eerste lid][ref5], en [10a][ref6], toegekende contingent van die vissoort voor
      een ondernemer die in een jaar voorafgaande aan het kalenderjaar heeft deelgenomen aan dat groepscontingent van die
      vissoort voor het kalenderjaar verminderd met de hoeveelheid van die vissoort waarmee hij in een jaar voorafgaande
      aan het kalenderjaar zijn individueel aandeel van die vissoort in dat groepscontingent heeft overschreden,
      voorzover die overschrijding het voor het jaar voorafgaande aan het kalenderjaar toegekende contingent van de
      desbetreffende vissoort te boven gaat.

      4 In afwijking van het eerste tot en met het derde lid, kan de minister op verzoek van de ondernemer de
      overschrijding van:

      a. het contingent schol geheel of gedeeltelijk in mindering brengen op het op grond van
      [artikel 10, eerste lid][ref7], toe te kennen contingent tong waarbij voor elke 5 kilogram schol 1 kilogram tong in
      mindering wordt gebracht, of

      b. het contingent tong geheel of gedeeltelijk in mindering brengen op het op grond van
      [artikel 10, eerste lid][ref8], toe te kennen contingent schol, waarbij voor elke kilogram tong 5 kilogram schol in
      mindering wordt gebracht.


