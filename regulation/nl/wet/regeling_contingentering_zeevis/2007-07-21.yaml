  - number: '25'
    text: |-
      1 De minister reikt bij de toekenning van een contingent van een vissoort voor het kalenderjaar aan de ondernemer
      een document voor de desbetreffende vissoort uit, dat onder meer de volgende gegevens bevat:

      a. de naam van de ondernemer op wiens naam het vissersvaartuig, waarop het document betrekking heeft, staat
      geregistreerd, en

      b. de lettertekens en het nummer van het vissersvaartuig, bedoeld in onderdeel a.

      2 Indien na ontbinding van een samenwerkingsverband dat een vissersvaartuig in exploitatie heeft, één of meer van
      de deelnemers van dit samenwerkingsverband de exploitatie van dat vissersvaartuig voortzetten, kan op verzoek van
      alle deelnemers van het samenwerkingsverband de tenaamstelling van het document, bedoeld in het eerste lid, worden
      gewijzigd.

      3 Een verzoek als bedoeld in het tweede lid wordt bij de minister ingediend.
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel25
