  - number: '2'
    text: |-
      1 Het is verboden met een vissersvaartuig op een vissoort in het voor die vissoort aangewezen vangstgebied te
      vissen dan wel een vissoort uit dat gebied aan te landen of aan boord te houden indien:

      a. de minister de vrijstelling heeft ingetrokken;

      b. - voor zover het geen kabeljauw, wijting of horsmakreel betreft - aan dat vissersvaartuig geen contingent van de
      desbetreffende vissoort is toegekend, of

      c. het document, bedoeld in [artikel 25][ref1], niet aan boord aanwezig is.

      2 Het is verboden met een vissersvaartuig op een grotere hoeveelheid van een vissoort in het voor die vissoort
      aangewezen vangstgebied te vissen, dan wel een grotere hoeveelheid van een vissoort uit dat gebied aan te landen of
      aan boord te houden, dan overeenkomt met het voor dat vissersvaartuig voor dat gebied toegekende contingent van de
      desbetreffende vissoort.

      3 Het is verboden tong, onderscheidenlijk schol, uit het vangstgebied aan te landen met, of aan boord te houden
      van, een ander vaartuig dan waarmee op die vissoort is gevist.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel25
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel2
