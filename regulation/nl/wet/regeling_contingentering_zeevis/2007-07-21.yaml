  - number: '18'
    text: |-
      1 De minister kan op verzoek van een groepsbestuur dat een groepscontingent van een vissoort beheert, een gedeelte
      van dit groepscontingent van die vissoort voegen bij een ander groepscontingent van die vissoort.

      2 Een samenvoeging als bedoeld in het eerste lid, vindt slechts plaats indien het groepscontingent van de
      desbetreffende vissoort of - in voorkomend geval - van de desbetreffende aanverwante vissoort, beheerd door een
      groepsbestuur aan wie in gebruik wordt gegeven, nog niet voor 90% is opgevist op het moment van ontvangst van het
      verzoek, bedoeld in het eerste lid, en de minister de vrijstelling nog niet heeft ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel18
  - number: '19'
    text: |-
      1 De minister kan op verzoek van een groepsbestuur dan wel bestuur van de producentenorganisatie toestaan dat
      een gedeelte van het groepscontingent van een vissoort in het kalenderjaar wordt opgevist, aan boord gehouden
      en aangeland door een of meer met name genoemde ondernemers met een vissersvaartuig dat niet deelneemt aan
      een groepscontingent en waarvoor het toegekende contingent van die vissoort of - in voorkomend geval - van de
      desbetreffende aanverwante vissoort, nog niet voor 90% is opgevist op het moment van ontvangst van het verzoek.

      2 De minister verleent de toestemming, bedoeld in het eerste lid, niet indien:

      a. het verzoek betrekking heeft op de ingebruikgeving aan een ondernemer of ondernemers, aan wie de voor het
      kalenderjaar voor hun vissersvaartuig of vissersvaartuigen toegekende contingent van de desbetreffende vissoort
      of - in voorkomend geval - van de desbetreffende aanverwante vissoort als gevolg van de korting overeenkomstig
      [artikel 23][ref1] is vastgesteld op nul, of

      b. hij de vrijstelling heeft ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008477#Artikel23
    url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#Artikel19
    references:
