  - number: '15'
    text: |-
      1 De minister kan de ondernemer die meer dan één vissersvaartuig in eigendom heeft, op diens verzoek toestaan het
      totaal van de voor zijn vissersvaartuigen toegekende contingenten van dezelfde vissoort samen te voegen tot een
      rederijcontingent, en op andere wijze met die vissersvaartuigen te vissen, aan te landen, aan boord te houden, dan
      ingevolge de [artikelen 2 tot en met 6][ref1] is toegestaan.

      2 De minister verleent slechts de toestemming, bedoeld in het eerste lid, indien:

      a. de contingenten van de desbetreffende vissoort of – in voorkomend geval – van de desbetreffende aanverwante
      vissoort nog niet voor 90% zijn opgevist, dan wel niet als gevolg van de korting overeenkomstig [artikel 23][ref2]
      zijn vastgesteld op nul op het moment van ontvangst van het verzoek;

      b. hij de vrijstelling nog niet heeft ingetrokken, en

      c. het verzoek, bedoeld in het eerste lid, betrekking heeft op alle aan de ondernemer toegekende contingenten van
      de desbetreffende vissoort en – voorzover het contingenten van een aanverwante vissoort betreft – op alle aan de
      ondernemer toegekende contingenten van de in de bijlage, onderdeel b, bij de desbetreffende aanverwante vissoort
      genoemde vissoort.

      3 De samenvoeging van contingenten als bedoeld in het eerste lid, geldt voor het kalenderjaar. De minister kan
      echter toestemming verlenen één of meer van de samengevoegde contingenten van een vissoort aan het samengevoegde
      contingent te onttrekken in het geval van:

      a. definitieve bedrijfsbeëindiging;

      b. faillissement van de ondernemer, of

      c. overdracht van één of meer van de desbetreffende vissersvaartuigen.

      4 Indien een ondernemer aan wie de toestemming, bedoeld in het eerste lid, is verleend, gedurende het kalenderjaar
      een contingent van dezelfde vissoort waarvan contingenten zijn ingebracht in het desbetreffende rederijcontingent,
      verwerft, wordt dit contingent toegevoegd aan de reeds ingevolge het eerste lid samengevoegde contingenten, tenzij
      het desbetreffende rederijcontingent van die vissoort of – in voorkomend geval – van de desbetreffende aanverwante
      vissoort voor meer dan 90% is opgevist.


