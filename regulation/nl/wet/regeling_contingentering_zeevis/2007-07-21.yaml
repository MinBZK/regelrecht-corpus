preamble:
  text: |-
    Gelet op de artikelen 3, 4 en 6 van het Reglement zee- en kustvisserij 1977;

    Na overleg met het Produktschap Vis;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008477/2007-07-21#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. *minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;

      b. *ondernemer:* degene te wiens naam het vissersvaartuig in het visserijregister, bedoeld in
      [artikel 4 van het Besluit registratie vissersvaartuigen 1998][ref1], is geregistreerd;

      c. *vissoort:* vissoort, genoemd in de bijlage, onderdeel a;

      d. *aanverwante vissoort:* vissoort, genoemd in de bijlage, onderdeel b;

      e. *kalenderjaar:* kalenderjaar, vermeld in [bijlage 3 van de Regeling vangstbeperking][ref2];

      f. *vangstgebied:* één of meerdere sectoren of deelgebieden als bedoeld in
      [artikel 1 van de Regeling vangstbeperking][ref3], waarvoor in [bijlage 3 van die regeling][ref4] een te vangen
      hoeveelheid van een vissoort is vastgesteld, en voorzover genoemd in de bijlage, onderdeel a;

      g. *contingent:* in kilogrammen uitgedrukte in het kalenderjaar in een vangstgebied te vangen hoeveelheid
      van een vissoort in levend gewicht, vermeerderd, onderscheidenlijk verminderd, met eventueel op grond van de
      [artikelen 12][ref5] of [19][ref6] voor het kalenderjaar in gebruik gekregen, onderscheidenlijk in gebruik gegeven,
      hoeveelheden van de desbetreffende vissoort, die per vissersvaartuig ten hoogste mag worden aangeland;

      h. *rederijcontingent:* rederijcontingent als bedoeld in [artikel 15][ref7], vermeerderd, onderscheidenlijk
      verminderd, met eventueel op grond van de [artikelen 12][ref8] of [19][ref9] voor het kalenderjaar in gebruik
      gekregen, onderscheidenlijk in gebruik gegeven, hoeveelheden van de desbetreffende vissoort;

      i. *groepscontingent:* groepscontingent als bedoeld in [artikel 16][ref10], vermeerderd, onderscheidenlijk
      verminderd, met eventueel op grond van de [artikelen 12][ref11] of [18][ref12] voor het kalenderjaar in gebruik
      gekregen, onderscheidenlijk in gebruik gegeven, hoeveelheden van de desbetreffende vissoort;

      j. *individueel aandeel:* het contingent van een vissoort dat een ondernemer heeft ingebracht in een
      groepscontingent, vermeerderd met door hem gekochte en in gebruik gekregen hoeveelheden van die vissoort en
      verminderd met door hem verkochte en in gebruik gegeven hoeveelheden van die vissoort waarover hij als deelnemer
      aan een groepscontingent in het kalenderjaar kan beschikken;

      k. *vrijstelling:* door de minister op grond van [artikel 2, tweede lid, van de Regeling vangstbeperking][ref13] te
      verlenen vrijstelling voor de visserij op een vissoort in het voor die vissoort aangewezen vangstgebied;

      l. *producentenorganisatie:* producentenorganisatie als bedoeld in artikel 5 van de Verordening (EG) nr. 104/2000
      van de Raad van de Europese Unie van 17 december 1999 houdende een gemeenschappelijke ordening der markten in de
      sector visserijproducten en producten van de aquacultuur (PbEG L 17);

      m. *groep:* groep als bedoeld in [artikel 16, tweede lid][ref14].

      2 Voor de toepassing van deze regeling vindt het aanlanden van een vissoort plaats op het tijdstip waarop het
      vissersvaartuig direct of indirect verbinding met de wal heeft gekregen.

      3 Indien kabeljauw of wijting wordt aangeland in gefileerde of op enige andere wijze bewerkte toestand, met
      uitzondering van gestripte toestand, dan geldt telkens de helft van de in de bijlage genoemde hoeveelheden
      kilogram.

      4 Deze regeling is van toepassing op vissersvaartuigen ten aanzien waarvan een visvergunning als bedoeld in
      [artikel 1, onderdeel g, van de Regeling visvergunning][ref15] is verleend en die behoren tot het segment MFL1,
      bedoeld in [artikel 1, onderdeel l, van die regeling][ref16].


