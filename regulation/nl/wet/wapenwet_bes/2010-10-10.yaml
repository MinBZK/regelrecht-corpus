  - number: 13c
    text: |-
      1 De in [artikel 13, eerste lid, onderdeel a][ref1], bedoelde ambtenaren zijn bevoegd te vorderen dat de verpakking
      van goederen, met inbegrip van reisbagage, wordt geopend, indien daartoe redelijkerwijs aanleiding bestaat op
      grond van een gepleegd strafbaar feit waarbij wapenen zijn gebruikt of op grond van aanwijzingen dat een dergelijk
      strafbaar feit zal worden gepleegd.

      2 De in het eerste lid bedoelde bevoegdheid kan slechts worden uitgeoefend tegen bepaalde personen, indien daartoe
      jegens hen aanleiding bestaat. De officier van justitie kan bij schriftelijk bevel gelasten dat deze bevoegdheid
      tegenover een ieder kan worden uitgeoefend. Het bevel is met redenen omkleed.

      3 Indien geen medewerking wordt verleend, kunnen de in het eerste lid bedoelde ambtenaren en personen, op kosten en
      risico van de houder van de goederen, in het nodige voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0028756#Artikel13
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel13c
    references:
      - id: ref1
        bwb_id: BWBR0028756
        artikel: '13'
  - number: 13d
    text: |-
      1 De in [artikel 13, eerste lid, onderdeel a][ref1], bedoelde ambtenaren zijn bevoegd vervoermiddelen te
      onderzoeken, indien daartoe redelijkerwijs aanleiding bestaat op grond van een gepleegd strafbaar feit waarbij
      wapenen zijn gebruikt of op grond van aanwijzingen dat een dergelijk strafbaar feit zal worden gepleegd.

      2 De in het eerste lid bedoelde bevoegdheid kan slechts worden uitgeoefend ten aanzien van bepaalde
      vervoersmiddelen, indien daartoe jegens deze aanleiding bestaat. De officier van justitie kan bij schriftelijk
      bevel gelasten dat deze bevoegdheid tegenover elk vervoermiddel kan worden uitgeoefend. Het bevel is met redenen
      omkleed.

      3 De in het eerste lid bedoelde ambtenaren kunnen van de bestuurders van voertuigen en van de schippers van
      vaartuigen daartoe vorderen dat deze de vervoermiddelen tot stilstand brengen, deze vervoermiddelen naar een door
      hen aangewezen plaats overbrengen en overeenkomstig hun aanwijzingen terzake medewerking verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028756#Artikel13
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel13d
    references:
      - id: ref1
        bwb_id: BWBR0028756
        artikel: '13'
  - number: 13e
    text: |-
      1 De in [artikel 13, eerste lid, onderdeel a][ref1], bedoelde ambtenaren zijn bevoegd van personen die zich op
      de openbare weg of op enige voor het publiek toegankelijke plaats bevinden te vorderen dat deze hun medewerking
      verlenen aan een onderzoek aan de kleding, indien daartoe redelijkerwijs aanleiding bestaat op grond van een
      gepleegd strafbaar feit waarbij wapenen zijn gebruikt of op grond van aanwijzingen dat een dergelijk strafbaar feit
      zal worden gepleegd.

      2 De in het eerste lid bedoelde bevoegdheid kan slechts worden uitgeoefend tegen bepaalde personen, indien daartoe
      jegens hen aanleiding bestaat. De officier van justitie kan bij schriftelijk bevel gelasten dat deze bevoegdheid
      tegenover een ieder kan worden uitgeoefend. Het bevel is met redenen omkleed.


      [ref1]: https://wetten.overheid.nl/BWBR0028756#Artikel13
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel13e
