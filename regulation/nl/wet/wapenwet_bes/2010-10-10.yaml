        artikel: '13'
  - number: '14'
    text: |-
      1 De in [artikel 13, eerste lid][ref1], bedoelde ambtenaren zijn bevoegd een persoon, verdacht van overtreding
      van het in [artikel 1][ref2] gestelde verbod, door het voorhanden hebben van een wapen, indien tegen hem ernstige
      bezwaren bestaan, aan zijn lichaam en kleding te onderzoeken.

      2 De in [artikel 13, eerste lid][ref3], bedoelde ambtenaren alsmede andere daartoe door af vanwege het bevoegde
      gezag aangewezen personen zijn bevoegd een persoon die zich bevindt op een voor aankomst en vertrek van reizigers
      bestemd gedeelte van een luchtvaartterrein te allen tijde aan zijn kleding en reisbagage te onderzoeken.


