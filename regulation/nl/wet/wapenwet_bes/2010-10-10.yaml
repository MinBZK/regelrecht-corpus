  - number: '13'
    text: |-
      1 Met het toezicht op de naleving van het bij en krachtens deze wet bepaalde zijn belast:

      a. de bij [artikel 184 van het Wetboek van Strafvordering BES][ref1] aangewezen ambtenaren;

      b. de douaneambtenaren.

      2 De in het eerste lid bedoelde ambtenaren zijn bevoegd alle plaatsen, met uitzondering van woningen zonder de
      uitdrukkelijke toestemming van de bewoner, waar, naar zij redelijkerwijs kunnen vermoeden, in verband met de
      uitoefening van een bedrijf, wapenen aanwezig zijn, te betreden, voor zover dit redelijkerwijs voor de vervulling
      van hun taak met betrekking tot deze wet nodig is. Wordt hun de toegang geweigerd, dan verschaffen zij zich die
      desnoods met behulp van de sterke arm.

      3 De in het eerste lid, onderdeel a, bedoelde ambtenaren hebben te allen tijde toegang tot alle plaatsen, waar,
      naar zij redelijkerwijze kunnen vermoeden, wapenen aanwezig zijn, en kunnen op die plaatsen ter inbeslagneming
      huiszoeking doen. Is de plaats een woning, tevens een woning of alleen door een woning toegankelijk, dan treden zij
      deze zonder de uitdrukkelijke toestemming van de bewoner niet binnen dan op algemene of bijzondere schriftelijke
      last van de officier van justitie, of op een bijzondere schriftelijke last van een hulpofficier van justitie. Van
      het binnentreden wordt door hen proces-verbaal opgemaakt, dat binnen twee maal vierentwintig uur aan degene, wiens
      woning is binnengetreden, in afschrift worden toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 13a
    text: |-
      De in [artikel 13, eerste lid][ref1], bedoelde ambtenaren zijn bevoegd ladingen, waarvan zij redelijkerwijs kunnen
      vermoeden dat wapenen daarvan deel uitmaken, aan onderzoekingen te onderwerpen, voor zover dit redelijkerwijs voor
      de vervulling van hun taak met betrekking tot deze wet nodig is. Daartoe kunnen zij vorderen dat de verpakking van
      goederen wordt geopend en dat ook overigens de medewerking wordt verleend die voor die onderzoekingen is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0028756#Artikel13
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0028756
        artikel: '13'
  - number: 13b
    text: |-
      1 De in [artikel 13, eerste lid][ref1], bedoelde ambtenaren zijn bevoegd van de in
      [artikel 2 onderdeel 4° tot en met 10°][ref2], bedoelde personen alle inlichtingen te verlangen die
      redelijkerwijs voor de vervulling van hun taak met betrekking tot deze wet nodig zijn.

      2 Zij zijn bevoegd van de in het eerste lid bedoelde personen inzage te verlangen van boeken en andere zakelijke
      gegevens en bescheiden, voor zover dit redelijkerwijs voor de vervulling van hun taak met betrekking tot deze wet
      nodig is.

      3 Zij zijn bevoegd van de boeken en andere zakelijke gegevens en bescheiden kopieën te maken. Indien het maken van
      kopieën niet ter plaatse kan geschieden, zijn zij bevoegd de boeken en andere zakelijke gegevens en bescheiden voor
      dat doel voor korte tijd mee te nemen tegen een door hen af te geven schriftelijk bewijs.

      4 De personen van wie inlichtingen of inzage van boeken en ander zakelijke gegevens en bescheiden worden verlangd
      zijn, onverminderd het bepaalde in [artikel 5, eerste lid][ref3], verplicht, die onverwijld te verstrekken.

      5 Zij die uit hoofde van hun stand, beroep of ambt tot geheimhouding verplicht zijn, kunnen zich verschonen van
      het verschaffen van inlichtingen, doch uitsluitend voor zover het betreft hetgeen hun in hun hoedanigheid is
      toevertrouwd. Zij kunnen voorts het verlenen van medewerking weigeren, voor zover hun plicht tot geheimhouding zich
      daartoe uitstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0028756#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028756#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0028756#Artikel5
