  - number: 2a
    text: |-
      1 Schietverenigingen met volledige rechtsbevoegdheid dienen, alvorens als zodanig te kunnen optreden, in het bezit
      te zijn van een daartoe bestemde vergunning, welke door Onze Minister van Justitie kan worden verleend onder door
      hem te stellen voorwaarden.

      2 Onze Minister van Justitie kan, nadat de in het voorgaande lid bedoelde vergunning is verleend, de daaraan
      verbonden voorwaarden wijzigen en/of nadere voorwaarden stellen.

      3 Onze Minister van Justitie kan de vergunning schorsen of intrekken, indien de aan de vergunning verbonden
      voorwaarden niet worden nagekomen dan wel indien de openbare orde of de veiligheid van Bonaire, Sint Eustatius of
      Saba of een deel daarvan in gevaar zou worden gebracht door gebruikmaking van de vergunning.
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel2a
  - number: '3'
    text: |-
      De in [artikel 2][ref1] bedoelde machtiging wordt verleend door de betrokken gezaghebber:

      1°. slechts voor de loop van het kalenderjaar, waarin zij wordt afgegeven;

      2°. slechts voor het openbaar lichaam, waar zij wordt afgegeven, met de onderhorigheden daarvan;

      3°. slechts ten name van één persoon, wordende deze persoon daarin zo nauwkeurig mogelijk aangewezen door
      vermelding van voornamen, geslachtsnaam, geboorteplaats, leeftijd, ambt of beroep, woon- of verblijfplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0028756#Artikel2
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028756
        artikel: '2'
  - number: '4'
    text: |-
      De machtiging vermeldt het soort van wapen, tot het bij zich hebben waarvan zij verleend wordt en is overigens
      ingericht naar een bij ministeriële regeling vast te stellen model.
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel4
  - number: '5'
    text: |-
      1 De machtiging wordt schriftelijk aangevraagd. De aanvrager verstrekt zoveel mogelijk de van hem gevraagde
      inlichtingen en bescheiden.

      2 Binnen een maand wordt op de aanvraag schriftelijk beschikt. Indien de aanvraag geheel of gedeeltelijk niet wordt
      ingewilligd, is de beschikking met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel5
  - number: '6'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel6
  - number: '7'
    text: |-
      De gezaghebber is te allen tijde bevoegd elke verleende machtiging bij een met redenen omklede beschikking te
      schorsen of in te trekken. Hij kan in dringende gevallen deze beschikking bij voorraad uitvoerbaar verklaren.
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel7
  - number: '8'
    text: |-
      De gezaghebber is verplicht een register te houden en daarin aantekening te doen zowel van elke verleende
      machtiging, met vermelding van de dag der uitreiking en van hetgeen de machtiging volgens deze wet moet inhouden,
      als van elke intrekking van zodanige machtiging, met vermelding van de dag, waarop zulks is geschied.
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel8
  - number: '9'
    text: |-
      Hij, die krachtens verleende machtiging, op de openbare weg of op enige voor het publiek toegankelijke plaats
      een wapen bij zich heeft, is verplicht deze machtiging bij zich te hebben en die op de eerste vordering van de in
      [artikel 13, eerste lid][ref1], bedoelde ambtenaren, terstond ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0028756#Artikel13
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028756
        artikel: '13'
  - number: '10'
    text: |-
      1 Onze Minister van Justitie kan bij nadere regels:

      a. het in voorraad hebben van bepaalde wapens boven een daarbij te vermelden aantal en van andere dan daarbij te
      bepalen afmetingen, verbieden;

      b. het overbrengen binnen een termijn en op daarbij aan te wijzen een plaats van zodanige wapens, of wapens van
      zodanige afmetingen, bevelen;

      c. voorschriften stellen voor personen, die een beroep maken van het afleveren van zodanige wapens, of van wapens
      van zodanige afmetingen aan particulieren.

      2 De regels, bedoeld in het eerste lid, zijn niet van toepassing op vuurwapens, bedoeld in de Vuurwapenwet BES.
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel10
  - number: '11'
    text: |-
      1 Hij die de verbodsbepaling van [artikel 1][ref1], overtreedt, wordt gestraft met gevangenisstraf van ten hoogste
      vier jaren of geldboete van de derde categorie.

      2 Hij die handelt in strijd met de [artikelen 9][ref2], [13b, vierde lid][ref3], of met de bij of krachtens deze
      wet vastgestelde voorschriften, of niet voldoet aan een vordering als bedoeld in [artikel 13d, derde lid][ref4],
      of [artikel 13e eerste lid][ref5], wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van de
      eerste categorie.

      3 Indien echter, naar hij weet of redelijkerwijze moet vermoeden, enig voorwerp met betrekking tot hetwelk het
      feit wordt begaan, is een bom, een handgranaat of een dergelijk voor ontploffing of voor het verspreiden van
      verstikkende of vergiftigde gassen bestemd wapen, wordt gevangenisstraf van ten hoogste vier jaren of geldboete van
      de tweede categorie.

      4 De bij deze wet strafbaar gestelde feiten worden, indien daarop mede gevangenisstraf is gesteld, als misdrijven
      en overigens als overtredingen beschouwd.


