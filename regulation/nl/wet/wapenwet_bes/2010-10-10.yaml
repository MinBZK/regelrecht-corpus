  - number: '1'
    text: |-
      1 Het is verboden op de openbare weg of op enige voor het publiek toegankelijke plaats een wapen bij zich te
      hebben.

      2 Onder wapenen worden in deze wet verstaan:

      a. de vuurwapenen, vallende onder de Vuurwapenwet BES, zomede geweren en pistolen waarmede projectielen door middel
      van samengeperste lucht of gas kunnen worden afgeschoten, dolken, dolkmessen, bajonetten, ponjaarden, zwaarden,
      sabels, degens, klewangs, degenstokken, priemstokken, wapenstokken, gummistokken, bullepezen, ploertendoders,
      boksbeugels, lansen, speren, spiesen, pijlen en andere soortgelijke voorwerpen die kennelijk vervaardigd zijn om
      als wapen te dienen;

      b. andere voorwerpen, die door de drager of gebruiker daarvan zijn bedoeld om als wapenen of mede als wapenen te
      dienen, blijkende uit de omstandigheid waaronder of de wijze waarop zij worden gedragen of gebruikt.
    url: https://wetten.overheid.nl/BWBR0028756/2010-10-10#Artikel1
  - number: '2'
    text: |-
      De bepaling van [artikel 1][ref1] is niet toepasselijk:

      1°. op ambtenaren en beambten, die bij ministeriële regeling een wapen bij zich mogen hebben;

      2°. op hen, die een wapen bij zich hebben, dat behoort bij hun ambtskleding;

      3°. op hen, die deel uitmaken van de gewapende macht, van de politie, voor zover het wapen, dat zij bij zich
      hebben, tot hun uitrusting behoort;

      4°. op hen, die deel uitmaken van rechtspersoonlijkheid bezittende verenigingen tot oefening in de wapenhandel –
      met uitzondering van schietverenigingen met volledige rechtsbevoegdheid – doch slechts gedurende de tijd voor die
      oefeningen bestemd, daaronder begrepen de tijd om zich naar en van de oefenplaatsen te begeven;

      5°. op hen, die deel uitmaken van schietverenigingen met volledige rechtsbevoegdheid, die in het bezit zijn van
      de in [artikel 2a][ref2] bedoelde vergunning, doch slechts gedurende de tijd voor oefeningen bestemd, daaronder
      begrepen de tijd om zich naar en van de oefenplaatsen te begeven;

      6°. op hen, die een vuurwapen vervoeren overeenkomstig de [Vuurwapenregeling BES][ref3];

      7°. op hen, die andere dan vuurwapenen vervoeren zodanig ingepakt, dat zij niet voor dadelijk gebruik kunnen worden
      aangewend;

      8°. op hen, die voorzien zijn van een daartoe strekkende en overeenkomstig de volgende bepalingen geldige
      machtiging;

      9°. ten aanzien van de in [artikel 1, tweede lid][ref4] bedoelde voorwerpen, op ogenblikken dat zij als werktuig
      gebruikt worden of kennelijk tot de uitrusting ten dienste van de uitoefening van een beroep of bedrijf behoren;

      10°. op hen, die krachtens een tot bepaalde plaatsen beperkte machtiging van het bevoegde gezag een vuurwapen en
      munitie voorhanden mogen hebben gedurende de tijd, dat zij zich bewegen tussen de plaatsen, waarvoor de machtiging
      geldt, mits het vuurwapen gedurende het vervoer zodanig is ingepakt, dat het niet voor dadelijk gebruik kan worden
      aangewend.


