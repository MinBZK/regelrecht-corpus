preamble:
  text: |-
    Gelet op de artikelen 40, derde lid, 70 a, derde lid, 70 b, tweede en zesde lid, 70 d, eerste en tweede lid, en 70
    e, derde lid, van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.a
    text: |-
      erkenning: erkenning als bedoeld in [artikel 70a, eerste lid, van de Wegenverkeerswet 1994][ref1] voor het
      produceren en afgeven van blanco-kentekenplaten;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
  - number: 1.1.b
    text: |-
      erkenninghouder: houder van een erkenning als bedoeld in
      [artikel 70a, eerste lid, van de Wegenverkeerswet 1994][ref1] voor het produceren en afgeven van blanco-
      kentekenplaten;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
  - number: 1.1.c
    text: 'blanco-kentekenplaat: blanco-kentekenplaat, geschikt voor het produceren van een kentekenplaat;'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.d
    text: |-
      lamineerderswaarmerk: het door de lamineerder op de blanco-kentekenplaat aan te brengen merk volgens het model in
      de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.e
    text: |-
      lamineercode: het door de lamineerder op een blanco-kentekenplaat aan te brengen nummer volgens model E in de
      [bijlage bij de Regeling kentekens en kentekenplaten](onbekend), aan de hand waarvan iedere kentekenplaat kan
      worden geïdentificeerd;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.f
    text: |-
      productie: het verwerken van folie en overige grondstoffen tot blanco-kentekenplaten, waaronder mede wordt begrepen
      het aanbrengen van het lamineerderswaarmerk, de lamineercode en het hologram;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.g
    text: 'productieplaats: inrichting waarin productie plaats vindt;'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.h
    text: |-
      foliefabrikant: houder van een erkenning als bedoeld in [artikel 70a van de wet][ref1] voor de productie en afgifte
      van folie;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
  - number: 1.1.i
    text: 'folie: folie afkomstig van een foliefabrikant en geschikt voor het produceren van:'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.i.1°
    text: |-
      gele kentekenplaten volgens de modellen 1.1 tot en met 18.2E, 27.1A tot en met 27.2G, 27.10A tot en met 27.10E en
      30.1A tot en met 30.2D van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.i.2°
    text: |-
      lichtblauwe kentekenplaten volgens de modellen 18.2A tot en met 18.2E, 27.30A tot en met 27.31E en 30.3A tot en met
      30.4D van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.i.3°
    text: |-
      lichtgroene kentekenplaten volgens de modellen 27.11 tot en met 27.14, 30.5 en 30.6 van de [bijlage bij de Regeling
      kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.i.4°
    text: |-
      witte kentekenplaten volgens de modellen 27.15A tot en met 27.17E, 27.24A tot en met 27.26E, 30.7, 30.8 en 30.13
      tot en met 30.16 van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.j
    text: |-
      kentekenplaatfabrikant: houder van een erkenning als bedoeld [artikel 70a van de wet][ref1] voor de productie en
      afgifte van kentekenplaten;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
  - number: 1.1.k
    text: |-
      fabrikantenkeurmerk: door de fabrikant van de kentekenplaat aan te brengen merk volgens het model in de [bijlage
      bij de Regeling kentekens en kentekenplaten](onbekend);
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.l
    text: |-
      kentekenplaat: plaat als bedoeld in [artikel 70a van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70a
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70a
  - number: 1.1.m
    text: 'de Minister: de Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: 1.1.n
    text: |-
      wet: [Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: 1.1.o
    text: 'hologram: hologram als bedoeld in model F van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend).'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van deze regeling maken besloten ruimten die zijn gelegen in één gebouw, dan wel in verscheidene
      belendende of nagenoeg belendende gebouwen, waarin dezelfde erkenninghouder blanco-kentekenplaten fabriceert, deel
      uit van één productieplaats.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel1
  - number: '2.1'
    text: |-
      Een erkenning kan worden verleend aan een natuurlijk persoon of rechtspersoon die exploitant is van een
      productieplaats en die is gevestigd in de Europese Unie of in eenstaat die partij is bij het Verdrag inzake de
      Europese economische ruimte.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel2
  - number: '2.2'
    text: Per productieplaats wordt slechts één erkenning afgegeven.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel2
  - number: '2.3'
    text: |-
      Een erkenning kan slechts worden verleend voor een productieplaats die zich bevindt in de Europese Unie of
      in een staat die partij is bij het Verdrag inzake de Europese economische ruimte en die voldoet aan de in de
      [artikel 3][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel3
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '3'
        hoofdstuk: '2'
  - number: '3.1'
    text: |-
      Het productieproces geschiedt in een overdekte en behoorlijk af te sluiten en goed verlichte ruimte die is voorzien
      van passende verwarming. In deze ruimte bevindt zich een afsluitbare kast dan wel een gelijkwaardige voorziening,
      waarin grondstoffen en blanco-kentekenplaten, met inbegrip van afgekeurde blanco-kentekenplaten, afgesloten en
      gescheiden kunnen worden bewaard.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel3
  - number: '3.2'
    text: |-
      Er dient een ruimte aanwezig te zijn waarin de administratie, bedoeld in [artikel 20][ref1] kan worden gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel20
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '20'
        hoofdstuk: '4'
  - number: '4'
    text: Voor de aanvraag van een erkenning wordt gebruik gemaakt van een door de Dienst Wegverkeer vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel4
  - number: '5'
    text: 'De aanvrager van een erkenning legt bij de aanvraag de volgende bescheiden over:'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel5
  - number: 5.a
    text: |-
      een bewijs van inschrijving als bedoeld in de [Handelsregisterwet 1996][ref1], dan wel, bij vestiging buiten
      Nederland, een gelijkwaardig document afgegeven in het land van vestiging, waaruit blijkt dat een bedrijf blanco-
      kentekenplaten fabriceert, welk bewijs niet ouder mag zijn dan een maand, en


      [ref1]: https://wetten.overheid.nl/BWBR0007893
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007893
  - number: 5.b
    text: |-
      een testrapport van een door de Dienst Wegverkeer aangewezen onderzoeksinstelling, waaruit blijkt,
      dat de aanvrager blanco-kentekenplaten kan produceren, die voldoen aan de eisen, gesteld in de
      [Regeling kentekens en kentekenplaten][ref1] en de [Regeling eisen goedkeuring kentekenplaten 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009071
      - id: ref2
        bwb_id: BWBR0012172
  - number: '6.1'
    text: 'Bij de aanvraag van de erkenning wordt een organogram overgelegd, waarin ten minste zijn vermeld:'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel6
  - number: 6.1.a
    text: |-
      de functies waarbinnen verantwoordelijkheid wordt gedragen voor de naleving van de voorschriften in de
      [artikelen 14 tot en met 20][ref1] en van de algemene voorwaarden voor procesbeheersing;


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel14
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '14'
        hoofdstuk: '4'
  - number: 6.1.b
    text: |-
      de personen die verantwoordelijk zijn voor de naleving van de voorschriften in de
      [artikelen 14 tot en met 20][ref1] en van de algemene voorwaarden voor procesbeheersing; en


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel14
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '14'
        hoofdstuk: '4'
  - number: 6.1.c
    text: |-
      de plaatsvervangers van de onder b bedoelde personen, tenzij is vastgelegd dat bij afwezigheid van één of meer van
      deze personen de desbetreffende werkzaamheden niet worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel6
  - number: '6.2'
    text: |-
      Er wordt voorts een beschrijving overgelegd van de procedures met betrekking tot: de naleving van de voorschriften
      in de [artikelen 14 tot en met 20][ref1] en van de algemene voorwaarden voor procesbeheersing.


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel14
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '14'
        hoofdstuk: '4'
  - number: 6a
    text: |-
      De aanvrager van de erkenning beschikt over voor de erkenning door de Dienst Wegverkeer goedgekeurde
      datacommunicatieapparatuur, geschikt voor communicatie in een door de Dienst Wegverkeer geaccepteerd netwerk.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel6a
  - number: '7'
    text: |-
      Indien aan de aanvrager van een erkenning eerder een erkenning is verleend, die op grond
      van [artikel 70d van de wet][ref1] is ingetrokken, kan, onverminderd het bepaalde in
      [artikel 70 d, derde lid, van de wet][ref2], door de Dienst Wegverkeer worden bepaald dat van onderdelen van
      [hoofdstuk 3][ref3] kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel70d
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel70d
      [ref3]: https://wetten.overheid.nl/BWBR0011084#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 70d
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 70d
      - id: ref3
        bwb_id: BWBR0011084
        hoofdstuk: '3'
  - number: '8'
    text: |-
      Wijzigingen ten aanzien van de in [artikel 6][ref1] beschreven organisatiestructuur, verantwoordelijkheden en
      procedures worden vooraf bij de Dienst Wegverkeer aangemeld, evenals overige wijzigingen die voor de erkenning van
      belang kunnen zijn. De door de Dienst Wegverkeer hieromtrent gegeven aanwijzingen worden in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel6
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '6'
        hoofdstuk: '3'
  - number: '9.1'
    text: |-
      De erkenninghouder draagt zorg voor een zodanige behandeling van folie en blanco-kentekenplaten dat beschadiging of
      achteruitgang wordt voorkomen. De zorg strekt zich uit tot en met de aflevering van de blanco-kentekenplaten op de
      plaats van bestemming.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel9
  - number: '9.2'
    text: |-
      In afwachting van gebruik of aflevering maakt de erkenninghouder gebruik van aangewezen afsluitbare opslag- of
      voorraadruimten om beschadiging, diefstal of achteruitgang van folie en blanco-kentekenplaten te voorkomen.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel9
  - number: '9.3'
    text: De erkenninghouder voorkomt onbedoeld gebruik van folie en blanco-kentekenplaten.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel9
  - number: '9.4'
    text: |-
      In geval van diefstal van blanco-kentekenplaten stelt de erkenninghouder de Dienst Wegverkeer hiervan terstond op
      de hoogte.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel9
  - number: '10.1'
    text: |-
      In de productieplaats waarvoor de erkenning is verleend is het besluit van de Dienst Wegverkeer, waarbij die
      erkenning is verleend, aanwezig.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel10
  - number: '10.2'
    text: |-
      Aan de kentekenplaatfabrikant, aan wie de erkenninghouder blanco-kentekenplaten levert, respectievelijk aan de
      foliefabrikant die folie aan de erkenninghouder levert, geeft de erkenninghouder op hun verzoek het in het eerste
      lid bedoelde besluit ter inzage.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel10
  - number: '11'
    text: |-
      Een productieplaats waarvoor de erkenning geldt moet voortdurend blijven voldoen aan de in de [artikelen 2][ref1]
      en [3][ref2] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011084#Artikel3
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011084
        artikel: '3'
        hoofdstuk: '2'
  - number: '12'
    text: |-
      De erkenninghouder is ervoor verantwoordelijk, dat het bij de productie en aflevering betrokken personeel op de
      hoogte is van de op de productie en aflevering toepasselijke voorschriften.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel12
  - number: '13'
    text: |-
      De erkenninghouder dient te allen tijde te kunnen aangeven waar in ontvangst genomen folie, hologrammen en blanco-
      kentenkenplaten, die nog niet zijn afgeleverd, zich bevinden.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel13
  - number: '14.1'
    text: |-
      De erkenninghouder verricht de productie met inachtneming van de [Regeling kentekens en kentekenplaten][ref1] en de
      [Regeling eisen goedkeuring kentekenplaten 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009071
      - id: ref2
        bwb_id: BWBR0012172
  - number: '14.2'
    text: |-
      De fabricage van blanco-kentekenplaten vindt slechts plaats in de productieplaatsen waarvoor de erkenning is
      verleend.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel14
  - number: '15'
    text: |-
      De erkenninghouder neemt uitsluitend folie in ontvangst die is voorzien van het door de foliefabrikant aan te
      brengen waarmerk en die vergezeld gaat van een document van de foliefabrikant dat tenminste de volgende gegevens
      bevat:
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel15
  - number: 15.a
    text: naam en adres van de folie-fabrikant;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel15
  - number: 15.b
    text: datum van levering; en
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel15
  - number: 15.c
    text: hoeveelheid en soort van de folie, onderverdeeld naar kleur en model.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel15
  - number: '16.1'
    text: 'Door middel van een ingangscontrole wordt, alvorens tot productie wordt overgegaan, vastgesteld dat de folie:'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
  - number: 16.1.a
    text: |-
      voldoet aan de eisen van de [Regeling eisen goedkeuring kentekenplaten 2000][ref1], voor zover deze van toepassing
      zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0012172
  - number: 16.1.b
    text: is voorzien van het door de foliefabrikant aan te brengen waarmerk, indien dat is voorgeschreven, en
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
  - number: 16.1.c
    text: onbeschadigd is.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
  - number: '16.2'
    text: 'Van de ingangscontrole wordt een ingangscontrolerapport opgemaakt, dat in ieder geval bevat:'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
  - number: 16.2.a
    text: de naam en adres van de betrokken foliefabrikant;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
  - number: 16.2.b
    text: de hoeveelheid en de soort folie, onderverdeeld naar kleur en model;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
  - number: 16.2.c
    text: de datum van levering,
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
  - number: 16.2.d
    text: |-
      een verwijzing naar het in [artikel 15][ref1] bedoelde document,


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel15
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '15'
        hoofdstuk: '4'
  - number: 16.2.e
    text: de ondertekening door de functionaris die verantwoordelijk is voor de ingangscontrole, en
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
  - number: 16.2.f
    text: de datum van de ingangscontrole.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
  - number: '16.3'
    text: |-
      Folie waarop nog geen ingangscontrole heeft plaatsgehad moet duidelijk als zodanig te erkennen zijn, doordat het
      apart is opgeslagen.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel16
  - number: '17.1'
    text: |-
      De erkenninghouder dient folie, die niet aan de in het [eerste lid van artikel 16][ref1] gestelde eisen voldoet
      terstondte vernietigen, dan wel te retourneren aan de foliefabrikant.


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel16
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '16'
        hoofdstuk: '4'
  - number: '17.2'
    text: 'Indien de erkenninghouder de folie retourneert, gaat deze vergezeld van een document, waarop is vermeld:'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: 17.2.a
    text: de hoeveelheid en de soort folie, onderverdeeld naar kleur en model;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: 17.2.b
    text: de datum van levering;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: 17.2.c
    text: |-
      een verwijzing naar het in [artikel 15][ref1] bedoelde document;


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel15
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '15'
        hoofdstuk: '4'
  - number: 17.2.d
    text: de ondertekening door de functionaris die verantwoordelijk is voor de ingangscontrole;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: 17.2.e
    text: de datum van de ingangscontrole, en
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: 17.2.f
    text: de reden van afkeuring.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: '17.3'
    text: Van het onder 2 genoemde document wordt een afschrift bewaard.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: '17.4'
    text: |-
      In het geval, bedoeld in het tweede lid, vraagt de erkenninghouder van de betrokken foliefabrikant een
      ontvangstbevestiging.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: '17.5'
    text: |-
      Indien de erkenninghouder de afgekeurde folie vernietigt, wordt daarvan een rapport opgemaakt en bewaard, dat
      tenminste bevat:
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: 17.5.a
    text: de naam en adres van de betrokken foliefabrikant;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: 17.5.b
    text: de hoeveelheid en de soort folie, onderverdeeld naar kleur en model;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: 17.5.c
    text: de datum van levering;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: 17.5.d
    text: |-
      een verwijzing naar het in [artikel 15][ref1] bedoelde document;


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel15
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '15'
        hoofdstuk: '4'
  - number: 17.5.e
    text: de ondertekening door de functionaris die verantwoordelijk is voor de ingangscontrole;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel17
  - number: '18.1'
    text: |-
      Alvorens de erkenninghouder overgaat tot aflevering van blanco-kentekenplaten controleert hij of deze voldoen
      aan de in de Regeling kentekens en kentekenplaten en de [Regeling eisen goedkeuring kentekenplaten 2000][ref1]
      gestelde eisen en of zij zijn voorzien van het door de erkenninghouder aan te brengen waarmerk, indien dat is
      voorgeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0012172
  - number: '18.2'
    text: |-
      Blanco-kentekenplaten die niet aan de eisen voldoen worden terstond vernietigd. Van de vernietiging wordt een
      rapport opgemaakt en bewaard dat in ieder geval de volgende gegevens per kentekenplaat bevat:
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel18
  - number: 18.2.a
    text: de lamineercode indien deze is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel18
  - number: 18.2.b
    text: het model en de kleur van de blanco-kentekenplaat, en
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel18
  - number: 18.2.c
    text: de naam en adres van de fabrikant van de folie.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel18
  - number: '19.1'
    text: Blanco-kentekenplaten worden uitsluitend afgegeven aan erkende kentekenplaatfabrikanten.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel19
  - number: '19.2'
    text: |-
      Voorafgaand aan de levering van blanco-kentekenplaten, die voorzien zijn van een lamineercode, meldt de
      erkenninghouder bij de Dienst Wegverkeer, op door deze dienst te bepalen wijze, de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel19
  - number: 19.2.a
    text: de lamineercodes;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel19
  - number: 19.2.b
    text: de hoeveelheid blanco-kentekenplaten;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel19
  - number: 19.2.c
    text: de soort, de kleur en het model van de blanco-kentekenplaten;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel19
  - number: 19.2.d
    text: de kentekenplatenfabrikant aan wie de blanco-kentekenplaten worden geleverd.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel19
  - number: '19.3'
    text: |-
      Onverminderd [artikel 20a][ref1], mag een erkenningshouder geen doorgeleverde blanco-kentekenplaten in ontvangst
      nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel20a
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: 20a
        hoofdstuk: '4'
  - number: '20.1'
    text: 'De erkenninghouder voert een overzichtelijke administratie, waarin zijn opgenomen:'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20
  - number: 20.1.a
    text: |-
      de documenten, bedoeld in [artikel 15][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel15
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '15'
        hoofdstuk: '4'
  - number: 20.1.b
    text: |-
      de rapporten van de ingangscontrole, bedoeld in [artikel 16, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel16
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '16'
        hoofdstuk: '4'
  - number: 20.1.c
    text: |-
      de afschriften, bedoeld in [artikel 17, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel17
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '17'
        hoofdstuk: '4'
  - number: 20.1.d
    text: |-
      de ontvangstbevestigingen als bedoeld in [artikel 17, vierde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel17
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '17'
        hoofdstuk: '4'
  - number: 20.1.e
    text: |-
      de rapporten, bedoeld in [artikel 17, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel17
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '17'
        hoofdstuk: '4'
  - number: 20.1.f
    text: |-
      de rapporten, bedoeld in [artikel 18, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel18
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '18'
        hoofdstuk: '4'
  - number: '20.2'
    text: De bescheiden, bedoeld in het eerste lid, worden twee jaar bewaard.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20
  - number: 20a.1
    text: |-
      In afwijking van [artikel 19][ref1] mag de erkenninghouder blanco-kentekenplaten leveren aan een andere
      erkenninghouder. Deze blanco-kentekenplaten zijn bij die levering voorzien van het hologram, indien dit is
      voorschreven, en van het waarmerk van de erkenninghouder die de platen levert.


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel19
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: '19'
        hoofdstuk: '4'
  - number: 20a.2
    text: |-
      De blanco-kentekenplaten worden, indien een lamineercode is voorgeschreven, bij de levering door de erkenninghouder
      die levert, voorzien van de lamineercode van de erkenninghouder aan wie wordt geleverd.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20a
  - number: 20a.3
    text: 'De erkenninghouder die levert, registreert bij de levering:'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20a
  - number: 20a.3.a
    text: de hoeveelheid en de soort blanco-kentekenplaten, onderverdeeld naar kleur en model;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20a
  - number: 20a.3.b
    text: de lamineercodes, indien een lamineercode is voorgeschreven;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20a
  - number: 20a.3.c
    text: de datum van levering;
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20a
  - number: 20a.3.d
    text: de naam en het adres van de erkenninghouder aan wie is geleverd, en
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20a
  - number: 20a.3.e
    text: de naam en handtekening van de voor de levering verantwoordelijke functionaris.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20a
  - number: 20a.4
    text: De registratie, bedoeld in het derde lid, wordt gedurende twee jaar op de productieplaats bewaard.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20a
  - number: 20b.1
    text: |-
      De erkenninghouder aan wie blanco-kentekenplaten zijn geleverd met toepassing van [artikel 20a][ref1], registreert
      bij de inontvangstneming van die kentekenplaten:


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel20a
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: 20a
        hoofdstuk: '4'
  - number: 20b.1.a
    text: |-
      de gegevens, bedoeld in [artikel 20a, derde lid, onder a, b en c][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel20a
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: 20a
        hoofdstuk: '4'
  - number: 20b.1.b
    text: de naam en het adres van de erkenninghouder die heeft geleverd.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20b
  - number: 20b.2
    text: |-
      De erkenninghouder aan wie de blanco-kentekenplaten zijn geleverd, mag deze niet met toepassing van
      [artikel 20a][ref1] doorleveren aan een andere erkenninghouder.


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Artikel20a
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0011084
        artikel: 20a
        hoofdstuk: '4'
  - number: 20b.3
    text: De registratie, bedoeld in het eerste lid, wordt gedurende twee jaar op de productieplaats bewaard.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel20b
  - number: '21.1'
    text: |-
      Nadat een erkenning is verleend wordt door de daartoe aangewezen ambtenaren van de Dienst Wegverkeer periodiek dan
      wel steekproefsgewijs onaangekondigd onderzocht of de erkenninghouder alsmede de productieplaats nog voldoen aan de
      in [hoofdstuk 2][ref1] opgenomen erkenningseisen, en of de in [hoofdstuk 4][ref2] opgenomen erkenningvoorschriften
      en de overige bij of krachtens de wet gestelde voorschriften worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0011084#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0011084#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0011084
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011084
        hoofdstuk: '4'
  - number: '21.2'
    text: |-
      Aan een controle wordt door de erkenninghouder alle medewerking verleend. Onder alle medewerking wordt in ieder
      geval verstaan dat:
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel21
  - number: 21.2.a
    text: de verantwoordelijke functionarissen van de erkenninghouder of hun vervangers bij de controle aanwezig zijn, en
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel21
  - number: 21.2.b
    text: |-
      feitelijke assistentie wordt verleend bij het uitvoeren van de controle. De ter zake door de Dienst Wegverkeer
      gegeven aanwijzingen worden in acht genomen.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel21
  - number: '21.3'
    text: |-
      Het toezicht kan tevens inhouden, dat de Dienst Wegverkeer de erkenninghouder vraagt een gedeelte van de
      door de erkenninghouder in ontvangst genomen folie voor onderzoek ter beschikking te stellen dan wel met
      betrekking tot een of meer door de Dienst Wegverkeer aan te wijzen blanco-kentekenplaten een testrapport
      van een door de Dienst Wegverkeer aangewezen onderzoeksinstelling over te leggen waaruit blijkt dat de
      kentekenplaten voldoen aan de eisen, gesteld in de [Regeling kentekens en kentekenplaten][ref1] en de
      [Regeling eisen goedkeuring kentekenplaten 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009071
      [ref2]: https://wetten.overheid.nl/BWBR0012172
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009071
      - id: ref2
        bwb_id: BWBR0012172
  - number: '22.1'
    text: |-
      Een op de dagvóór die van de inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      _______________________ (Stb.1999, 459) geldende goedkeuring of machtiging tot het aanbrengen van een keurmerk op
      blanco-kentekenplaten en de daarop op die dag van toepassing zijnde voorschriften blijven tot 1 februari 2003 van
      kracht ten aanzien van blanco-kentekenplaten bestemd voor kentekenplaten volgens de modellen 1.1 tot en met 26.1
      van de [bijlage bij de Regeling kentekens en kentekenplaten](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0010759
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0010759
  - number: '22.2'
    text: |-
      Een goedkeuring of machtiging als bedoeld in het eerste lid vervalt met ingang van de dag waarop aan degene, aan
      wie de goedkeuring of machtiging is afgegeven, een erkenning wordt verleend.
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel22
  - number: '23'
    text: |-
      Deze regeling treedt in werking met ingang van de dag waarop de Wet van 6 oktober 1999 houdende wijziging van de
      [Wegenverkeerswet 1994][ref1] met betrekking tot de afgifte en inname van kentekenplaten (Staatsblad 1999, 459) in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '24'
    text: 'Deze regeling wordt aangehaald als: Erkenningsregeling lamineerders.'
    url: https://wetten.overheid.nl/BWBR0011084/2014-04-01#Artikel24
