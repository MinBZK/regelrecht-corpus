    Besluit:
  url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

              a
              minister:

                Minister van Sociale Zaken en Werkgelegenheid;



              b
              Wet SUWI:

                [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]



              c
              SVB:

                Sociale verzekeringsbank, genoemd in [hoofdstuk 6 van de Wet SUWI][ref2];



              d
              instituut asbestslachtoffers:

                Stichting Instituut Asbestslachtoffers te ‘s-Gravenhage;



              e
              werknemer:

                degene die voor een natuurlijke of rechtspersoon arbeid in Nederland verricht of heeft verricht krachtens
      een Nederlandse publiekrechtelijke aanstelling of krachtens een arbeidsovereenkomst waarop Nederlands recht van
      toepassing is of was;



              f
              werkgever:

                de natuurlijke of rechtspersoon, bedoeld in onderdeel e;



              g
              asbest:

                stoffen die een of meer van de volgende vezelachtige silicaten bevatten:
                actinoliet (Cas-nummer 77536-66-4);
      amosiet (Cas-nummer 12172-73-5);
      anthofylliet (Cas-nummer 77536-67-5);
      chrysotiel (Cas-nummer 12001-29-5);
      tremoliet (Cas-nummer 77536-68-6);
      crocidoliet (Cas-nummer 12001-28-4);



              h
              maligne mesothelioom:

                door blootstelling aan asbest veroorzaakte tumor van het longvlies, het buikvlies of het hartvlies als
      bedoeld in het protocol diagnostiek;



              i
              protocol diagnostiek:

                protocol diagnostiek maligne mesothelioom, opgenomen in de bijlage bij deze regeling;



              j
              nabestaanden:

                de langstlevende van de echtgenoten;
      bij ontstentenis van de onder 1°. bedoelde persoon, de minderjarige kinderen, tot wie de overledene in
      familierechtelijke betrekking stond;
      bij ontstentenis van de onder 1°. en 2°. bedoelde personen, degenen ten aanzien van wie de overledene grotendeels
      in de kosten van het bestaan voorzag en met wie hij in gezins-verband leefde;



              k
              voorschot:

                een uitkering als voorschot op de eventuele vordering op de werkgever op wie de immateriële schade kan
      worden verhaald;



              l
              de lasten:

                de eenmalige uitkeringen, bedoeld in [artikel 6][ref3];
      het voorschot;
      de vergoedingen die door de SVB aan het instituut asbestslachtoffers worden verstrekt voor de advisering ten
      behoeve van deze regeling.



              m
              huisgenoot:

                de persoon met wie de werknemer een duurzaam hoofdverblijf heeft gehad in dezelfde woning ten tijde van
      de blootstelling aan asbest.


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0011113#Artikel6
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0011113
        artikel: '6'
        hoofdstuk: '2'
  - number: '1.2'
    text: |-
      In deze regeling wordt met de echtgenoot gelijkgesteld de geregistreerde partner en de persoon die op grond van
      [artikel 1, derde lid, onderdeel a, en vierde tot en met zevende lid, van de Algemene Ouderdomswet][ref1] en de
      daarop berustende bepalingen mede als zodanig wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel1
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '1'
  - number: '1.3'
    text: |-
      In deze regeling wordt niet als echtgenoot aangemerkt degene die duurzaam gescheiden leeft van de persoon met wie
      hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel1
  - number: '1.4'
    text: |-
      Indien de nabestaanden een eenmalige uitkering hebben aangevraagd op grond van [artikel 7, derde lid][ref1], is
      voor de beoordeling welke persoon of personen met toepassing van het eerste lid, onderdeel j, als nabestaande wordt
      aangemerkt, bepalend de situatie ten tijde van de indiening van de aanvraag. In andere gevallen geschiedt deze
      beoordeling op basis van de omstandigheden op het tijdstip van overlijden van de werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel7
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '7'
        hoofdstuk: '3'
  - number: '2'
    text: |-
      Arbeid die wordt verricht aan boord van schepen en luchtvaartuigen die in Nederland hun thuishaven hebben, wordt
      ten opzichte van de bemanning aangemerkt als in Nederland verrichte arbeid.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel2
  - number: '3'
    text: |-
      De werknemer die op het moment van de aanvraag in leven is en bij wie met toepassing van het protocol diagnostiek
      de ziekte maligne mesothelioom is vastgesteld heeft recht op een eenmalige uitkering indien:
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel3
  - number: 3.a
    text: |-
      is vastgesteld dat het maligne mesothelioom is veroorzaakt door blootstelling aan asbest tijdens het verrichten van
      arbeid als werknemer;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel3
  - number: 3.b
    text: |-
      hij geen betaling in verband met de blootstelling aan asbest tijdens het verrichten van die arbeid en het daardoor
      veroorzaakte maligne mesothelioom van de werkgever heeft ontvangen, dan wel in verband daarmee een bedrag heeft
      ontvangen dat lager is dan € 19.201,– ongeacht de vorm waarin de betaling is gedaan en de aard van de kosten waarin
      de betaling voorziet; en
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel3
  - number: 3.c
    text: de schade niet langs burgerrechtelijke weg kan of kon worden verhaald.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel3
  - number: '4'
    text: 'Indien de werknemer is overleden:'
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel4
  - number: 4.a
    text: nadat hij de aanvraag heeft ingediend, doch voordat op de aanvraag is beslist, of
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel4
  - number: 4.b
    text: |-
      voordat hij de aanvraag heeft ingediend, doch nadat hij bij het instituut asbestslachtoffers een verzoek tot
      bemiddeling heeft ingediend, hebben in zijn plaats de nabestaanden recht op de eenmalige uitkering indien de
      overledene recht op de uitkering zou hebben gehad.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel4
  - number: '5.1'
    text: |-
      Indien de werknemer ten behoeve van meer dan één werkgever arbeid heeft verricht gedurende welke hij is
      blootgesteld aan asbest en die het maligne mesothelioom kan hebben veroorzaakt, bestaat het recht op een eenmalige
      uitkering uitsluitend als de omstandigheden, bedoeld in [artikel 3][ref1], zich ten aanzien van elk van de
      betreffende werkgevers voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel3
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      Indien de werknemer in verband met de blootstelling aan asbest tijdens het verrichten van arbeid buiten Nederland
      en het daardoor veroorzaakte maligne mesothelioom een betaling van de werkgever heeft ontvangen, bestaat het
      recht op eenmalige uitkering in afwijking van [artikel 3][ref1] uitsluitend voor zover die betaling lager is dan
      € 19.201,– ongeacht de vorm waarin de betaling is gedaan en de aard van de kosten waarin de betaling voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel3
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.3'
    text: |-
      Geen recht op een eenmalige uitkering bestaat indien aan de werknemer of diens nabestaanden reeds een voorschot
      als bedoeld in [artikel 6a][ref1] of [artikel 10b][ref2] dan wel een eenmalige uitkering als bedoeld in
      [artikel 10a][ref3] is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0011113#Artikel10b
      [ref3]: https://wetten.overheid.nl/BWBR0011113#Artikel10a
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: 6a
        hoofdstuk: 2a
      - id: ref2
        bwb_id: BWBR0011113
        artikel: 10b
        hoofdstuk: 3a
      - id: ref3
        bwb_id: BWBR0011113
        artikel: 10a
        hoofdstuk: 3a
  - number: '6.1'
    text: De eenmalige uitkering strekt tot tegemoetkoming in immateriële schade en bedraagt € 19.201,–.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien de werkgever in verband met de blootstelling aan asbest van de werknemer tijdens het verrichten van arbeid
      en het daardoor veroorzaakte maligne mesothelioom een bedrag heeft betaald dat lager is dan € 19.201,– of indien
      de werknemer een betaling heeft ontvangen als bedoeld in [artikel 5, tweede lid][ref1], wordt de hoogte van de
      eenmalige uitkering vastgesteld op het verschil tussen het ontvangen bedrag en € 19.201,–.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel5
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '5'
        hoofdstuk: '2'
  - number: '6.3'
    text: |-
      Voor de toepassing van het tweede lid van dit artikel en van [artikel 3, onderdeel b][ref1],
      wordt als maatstaf genomen de hoogte van de betaling nadat daarop de verschuldigde belasting
      ingevolge de [Wet inkomstenbelasting 2001][ref2] en premie voor de volksverzekeringen ingevolge de
      [Wet financiering sociale verzekeringen][ref3] in mindering zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353
      [ref3]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011353
      - id: ref3
        bwb_id: BWBR0017745
  - number: 6a
    text: |-
      De werknemer die op het moment van de aanvraag in leven is en bij wie met toepassing van het protocol diagnostiek
      de ziekte maligne mesothelioom is vastgesteld heeft recht op een voorschot, indien:
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6a
  - number: 6a.a
    text: |-
      hij aannemelijk heeft gemaakt dat het maligne mesothelioom is veroorzaakt door blootstelling aan asbest tijdens het
      verrichten van arbeid als werknemer;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6a
  - number: 6a.b
    text: |-
      hij geen betaling in verband met de blootstelling aan asbest tijdens het verrichten van die arbeid en het daardoor
      veroorzaakte maligne mesothelioom van de werkgever heeft ontvangen, dan wel in verband daarmee een bedrag heeft
      ontvangen dat lager is dan € 19.201,– ongeacht de vorm waarin de betaling is gedaan en de aard van de kosten waarin
      de betaling voorziet;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6a
  - number: 6a.c
    text: |-
      hij zich verplicht tot medewerking aan bemiddeling door het instituut asbestslachtoffers tussen hem en de werkgever
      om de schade vergoed te krijgen en, met inachtneming van onderdeel d, tot medewerking om de schade zo nodig langs
      gerechtelijke weg vergoed te krijgen;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6a
  - number: 6a.d
    text: |-
      hij de SVB een onherroepelijke volmacht als bedoeld in [artikel 74 van Boek 3 van het Burgerlijk Wetboek][ref1]
      heeft verleend om zo nodig de immateriële schade langs gerechtelijke weg te verhalen tot een bedrag zoals is
      overeengekomen in het convenant tot oprichting van het instituut asbestslachtoffers;


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel74
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '74'
  - number: 6a.e
    text: |-
      hij de SVB een onherroepelijke volmacht als bedoeld in [artikel 74 van Boek 3 van het Burgerlijk Wetboek][ref1]
      heeft verleend om de immateriële schadevergoeding namens hem van de werkgever te innen, teneinde dit te verrekenen
      met het verleende voorschot;


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel74
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '74'
  - number: 6a.f
    text: |-
      hij, na ontvangst van de schadevergoeding van de werkgever, het voorschot voor het geheel of, wanneer de
      schadevergoeding lager is dan het verleende voorschot, het voorschot voor dat deel aan de SVB terugbetaalt, indien
      geen gebruik wordt gemaakt van de volmacht, bedoeld in onderdeel d, en
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6a
  - number: 6a.g
    text: hij aan de SVB onverwijld mededeling doet van ontvangst van de schadevergoeding, bedoeld in onderdeel f.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6a
  - number: 6b
    text: |-
      Indien de werknemer is overleden nadat hij de aanvraag heeft ingediend, doch voordat op de aanvraag is beslist,
      hebben in zijn plaats de nabestaanden recht op het voorschot indien de overledene recht op dat voorschot zou hebben
      gehad.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6b
  - number: 6c.1
    text: |-
      Indien de werknemer in verband met de blootstelling aan asbest tijdens het verrichten van arbeid buiten Nederland
      en het daardoor veroorzaakte maligne mesothelioom een betaling van de werkgever heeft ontvangen, bestaat het recht
      op een voorschot in afwijking van [artikel 6a][ref1] uitsluitend voorzover die betaling lager is dan € 19.201,–
      ongeacht de vorm waarin de betaling is gedaan en de aard van de kosten waarin de betaling voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel6a
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: 6a
        hoofdstuk: 2a
  - number: 6c.2
    text: |-
      Geen recht op een voorschot bestaat indien aan de werknemer of diens nabestaanden reeds een eenmalige uitkering
      als bedoeld in [artikel 3][ref1] of [artikel 10a][ref2] dan wel een voorschot als bedoeld in [artikel 10b][ref3]
      is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011113#Artikel10a
      [ref3]: https://wetten.overheid.nl/BWBR0011113#Artikel10b
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6c
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011113
        artikel: 10a
        hoofdstuk: 3a
      - id: ref3
        bwb_id: BWBR0011113
        artikel: 10b
        hoofdstuk: 3a
  - number: 6d.1
    text: Het voorschot bedraagt € 19.201,–.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6d
  - number: 6d.2
    text: |-
      Indien de werkgever in verband met de blootstelling aan asbest van de werknemer tijdens het verrichten van arbeid
      en het daardoor veroorzaakte maligne mesothelioom een bedrag heeft betaald dat lager is dan € 19.201,– of indien
      de werknemer een betaling heeft ontvangen als bedoeld in [artikel 6c, eerste lid][ref1], wordt de hoogte van het
      voorschot vastgesteld op het verschil tussen het ontvangen bedrag en € 19.201,–.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel6c
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6d
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: 6c
        hoofdstuk: 2a
  - number: 6d.3
    text: |-
      Voor de toepassing van het tweede lid en van [artikel 6a, onderdeel b][ref1], wordt als maatstaf genomen de hoogte
      van de betaling nadat daarop de verschuldigde belasting op grond van de [Wet inkomstenbelasting 2001][ref2] en
      premies voor de volksverzekeringen op grond van de [Wet financiering sociale verzekeringen][ref3] in mindering
      zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0011353
      [ref3]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel6d
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: 6a
        hoofdstuk: 2a
      - id: ref2
        bwb_id: BWBR0011353
      - id: ref3
        bwb_id: BWBR0017745
  - number: '7.1'
    text: |-
      De SVB stelt op aanvraag van de werknemer vast of recht op de eenmalige uitkering bestaat en of er recht op het
      voorschot bestaat.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel7
  - number: '7.2'
    text: |-
      Een aanvraag om de eenmalige uitkering en een aanvraag om het voorschot wordt bij de SVB ingediend door middel van
      door de SVB beschikbaar gestelde aanvraagformulieren.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien de werknemer, na het indienen van een verzoek om bemiddeling bij het instituut asbestslachtoffers, is
      overleden kan de aanvraag om de eenmalige uitkering worden gedaan door de nabestaanden binnen twaalf maanden nadat
      tijdens het bemiddelingstraject toepassing van deze regeling is gebleken.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel7
  - number: '7.4'
    text: |-
      Indien er meer dan één nabestaande is, dragen de nabestaanden er zorg voor dat aan één van hen een volmacht wordt
      verleend tot vertegenwoordiging ten behoeve van de uitvoering van deze regeling, het in ontvangst nemen van de
      eenmalige uitkering of het voorschot daarbij inbegrepen.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel7
  - number: '8.1'
    text: |-
      Indien de werknemer is overleden nadat hij de aanvraag heeft ingediend, doch voorafgaand aan het tijdstip waarop
      op de aanvraag om de eenmalige uitkering of de aanvraag om het voorschot is beslist, wordt de behandeling van de
      aanvraag ten behoeve van de nabestaanden voortgezet, tenzij deze schriftelijk te kennen geven daarop geen prijs
      te stellen.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel8
  - number: '8.2'
    text: |-
      [Artikel 7, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel7
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '7'
        hoofdstuk: '3'
  - number: '9.1'
    text: |-
      De werknemer verstrekt de SVB of de door haar aangewezen personen of instellingen bij de indiening van de aanvraag
      om de eenmalige uitkering in ieder geval de inlichtingen en bewijsstukken die noodzakelijk zijn ter vaststelling
      van:
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9
  - number: 9.1.a
    text: maligne mesothelioom;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9
  - number: 9.1.b
    text: de blootstelling aan asbest gedurende het verrichten van arbeid als werknemer;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9
  - number: 9.1.c
    text: de periode gedurende welke die blootstelling aan asbest heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9
  - number: 9.1.d
    text: |-
      degenen die in verband met de arbeid waarbij de blootstelling aan asbest heeft plaatsgevonden als werkgever worden
      aangemerkt; en
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9
  - number: 9.1.e
    text: de mogelijkheden of reeds gedane inspanningen om de schade langs burgerrechtelijke weg te verhalen.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9
  - number: '9.2'
    text: |-
      De werknemer verstrekt de SVB of de door haar aangewezen personen of instellingen op verzoek of uit eigen beweging
      de overige inlichtingen en bewijsstukken die nodig zijn voor de uitvoering van deze regeling en verleent ook
      overigens de medewerking die redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de aanvraag is ingediend door de nabestaanden of de behandeling van de aanvraag van een werknemer na
      diens overlijden wordt voortgezet ten behoeve van de nabestaanden, is het eerste en het tweede lid op hen van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9
  - number: 9a.1
    text: |-
      De werknemer verstrekt de SVB of de door haar aangewezen personen of instellingen bij de indiening van de aanvraag
      om een voorschot in ieder geval de inlichtingen en bewijsstukken die noodzakelijk zijn ter vaststelling van maligne
      mesothelioom.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9a
  - number: 9a.2
    text: |-
      In verband met de voorwaarde dat aannemelijk dient te worden gemaakt dat het maligne mesothelioom is veroorzaakt
      door blootstelling aan asbest tijdens het verrichten van arbeid als werknemer verstrekt de werknemer de SVB of de
      door haar aangewezen personen of instellingen bij de indiening van de aanvraag om een voorschot voorts in ieder
      geval de inlichtingen en zo mogelijk bewijsstukken omtrent: a. de blootstelling aan asbest gedurende het verrichten
      van arbeid als werknemer; b. de periode gedurende welke die blootstelling aan asbest heeft plaatsgevonden; c.
      degenen die in verband met de arbeid waarbij de blootstelling aan asbest heeft plaatsgevonden als werkgever worden
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9a
  - number: 9a.3
    text: |-
      De werknemer verstrekt de SVB of de door haar aangewezen personen of instellingen op verzoek of uit eigen beweging
      de overige inlichtingen en bewijsstukken die nodig zijn voor de uitvoering van deze regeling en verleent ook
      overigens de medewerking die redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9a
  - number: 9a.4
    text: |-
      Indien de aanvraag om het voorschot van een werknemer na diens overlijden wordt voortgezet ten behoeve van de
      nabestaanden, is dit artikel op hen van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel9a
  - number: '10'
    text: |-
      Deze regeling is, met inachtneming van de artikelen 10a tot en met 10c, van overeenkomstige toepassing op
      huisgenoten.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel10
  - number: 10a
    text: |-
      In afwijking van [artikel 3, onderdeel a][ref1], heeft de huisgenoot die op het moment van aanvraag in leven is
      en bij wie met toepassing van het protocol diagnostiek de ziekte maligne mesothelioom is vastgesteld, recht op een
      eenmalige uitkering als bedoeld in [artikel 3][ref2] indien:


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011113#Artikel3
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011113
        artikel: '3'
        hoofdstuk: '2'
  - number: 10a.a
    text: |-
      hij het duurzaam hoofdverblijf, bedoeld in [artikel 1, eerste lid, onderdeel m][ref1], aannemelijk heeft gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel1
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '1'
        hoofdstuk: '1'
  - number: 10a.b
    text: 'is vastgesteld dat:'
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel10a
  - number: 10a.b.1°
    text: |-
      de werknemer, bedoeld in [artikel 1, eerste lid, onderdeel m][ref1], is blootgesteld aan asbest tijdens het
      verrichten van arbeid als werknemer, en


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel1
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '1'
        hoofdstuk: '1'
  - number: 10a.b.2°
    text: de huisgenoot als gevolg hiervan de ziekte maligne mesothelioom heeft opgelopen.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel10a
  - number: 10b
    text: |-
      In afwijking van [artikel 6a, onderdeel a][ref1], heeft de huisgenoot die op het moment van aanvraag in leven is
      en bij wie met toepassing van het protocol diagnostiek de ziekte maligne mesothelioom is vastgesteld, recht op een
      voorschot als bedoeld in [artikel 6a][ref2] indien hij aannemelijk heeft gemaakt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0011113#Artikel6a
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: 6a
        hoofdstuk: 2a
      - id: ref2
        bwb_id: BWBR0011113
        artikel: 6a
        hoofdstuk: 2a
  - number: 10b.a
    text: |-
      er sprake is van een duurzaam hoofdverblijf als bedoeld in [artikel 1, eerste lid, onderdeel m][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel1
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '1'
        hoofdstuk: '1'
  - number: 10b.b
    text: |-
      de werknemer, bedoeld in [artikel 1, eerste lid, onderdeel m][ref1], is blootgesteld aan asbest tijdens het
      verrichten van arbeid als werknemer, en


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel1
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '1'
        hoofdstuk: '1'
  - number: 10b.c
    text: hij als gevolg hiervan de ziekte maligne mesothelioom heeft opgelopen.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel10b
  - number: 10c
    text: |-
      Geen recht op een eenmalige uitkering of een voorschot met toepassing van dit hoofdstuk bestaat indien aan een
      huisgenoot of diens nabestaanden reeds een eenmalige uitkering als bedoeld in [artikel 3][ref1] of een voorschot
      als bedoeld in [artikel 6a][ref2] is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011113#Artikel6a
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel10c
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0011113
        artikel: 6a
        hoofdstuk: 2a
  - number: '11'
    text: |-
      De eenmalige uitkering en het voorschot worden door de SVB zo spoedig mogelijk uitbetaald aan de werknemer of de
      nabestaande, bedoeld in [artikel 7, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel7
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '7'
        hoofdstuk: '3'
  - number: '12.1'
    text: |-
      De SVB herziet een besluit tot toekenning van de eenmalige uitkering of het voorschot of trekt dat in indien degene
      aan wie de eenmalige uitkering of het voorschot is toegekend:
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel12
  - number: 12.1.a
    text: |-
      nadien alsnog een betaling heeft ontvangen waarmee rekening zou zijn gehouden bij de vaststelling van het recht op
      de eenmalige uitkering of het voorschot, of
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel12
  - number: 12.1.b
    text: |-
      de verplichtingen, bedoeld in de [artikelen 6a, onderdelen c, f en g][ref1], [9][ref2] en [9a][ref3] niet of
      niet behoorlijk zijn nagekomen en dit heeft geleid tot het ten onrechte of tot een te hoog bedrag verlenen van de
      eenmalige uitkering of het voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0011113#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0011113#Artikel9a
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: 6a
        hoofdstuk: 2a
      - id: ref2
        bwb_id: BWBR0011113
        artikel: '9'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0011113
        artikel: 9a
        hoofdstuk: '3'
  - number: '12.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan de SVB besluiten geheel of gedeeltelijk van herziening of
      intrekking af te zien.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel12
  - number: '12.3'
    text: |-
      De eenmalige uitkering of het voorschot die als gevolg van een besluit als bedoeld in het eerste lid ten onrechte
      of tot een te hoog bedrag is verleend, alsmede hetgeen anderszins onverschuldigd is betaald, wordt van degene aan
      wie de eenmalige uitkering of het voorschot is toegekend teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel12
  - number: 12a
    text: |-
      Wanneer de ontwikkeling van het wettelijk minimumloon daartoe aanleiding geeft, maakt de minister een wijziging van
      de bedragen, vermeld in deze regeling tijdig vóór de aanvang van een kalenderjaar, met ingang van 2004, bekend in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel12a
  - number: '13'
    text: Deze regeling wordt uitgevoerd door de SVB.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel13
  - number: '14.1'
    text: |-
      De SVB kan over het recht op de eenmalige uitkering of het voorschot advies vragen aan het instituut
      asbestslachtoffers.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel14
  - number: '14.2'
    text: De SVB stelt de eisen vast waaraan het advies voldoet en stelt een termijn binnen welke het advies wordt verwacht.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel14
  - number: '15.1'
    text: |-
      De SVB en het instituut asbestslachtoffers stellen een overeenkomst op betreffende de samenwerking en werkwijze in
      het kader van de uitvoering van deze regeling.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel15
  - number: '15.2'
    text: 'In de in het eerste lid bedoelde overeenkomst wordt ten minste vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel15
  - number: 15.2.a
    text: op welke wijze de behandeling van aanvragen van een eenmalige uitkering of een voorschot plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel15
  - number: 15.2.b
    text: op welke wijze de juistheid en de volledigheid van de verkregen inlichtingen wordt onderzocht;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel15
  - number: 15.2.c
    text: op welke wijze de informatievoorziening aan belanghebbenden wordt ingericht;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel15
  - number: 15.2.d
    text: welke vergoeding door de SVB aan het instituut asbestslachtoffers zal worden verstrekt per uitgebracht advies;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel15
  - number: 15.2.e
    text: op welke wijze de verstrekking van de vergoedingen, bedoeld in onderdeel d, zal worden ingericht;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel15
  - number: 15.2.f
    text: |-
      dat periodiek overleg zal worden gevoerd betreffende de uitvoering van deze regeling, alsmede de frequentie
      daarvan;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel15
  - number: 15.2.g
    text: |-
      welke informatie door het instituut asbestslachtoffers aan de SVB wordt verstrekt ten behoeve van de
      informatieverplichting van de SVB aan de minister;
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel15
  - number: 15.2.h
    text: hoe uit de overeenkomst voortvloeiende geschillen zullen worden beslecht.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel15
  - number: '16.1'
    text: |-
      Voor 1 oktober van elk jaar verstrekt de SVB aan de Minister in het jaarplan met begroting een opgave van het
      totaalbedrag aan de voor het komende jaar geraamde baten en lasten met betrekking tot deze regeling, uitgesplitst
      naar uitkeringslasten per maand en uitvoeringskosten per jaar.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel16
  - number: '16.2'
    text: |-
      In de opgave van de uitkeringslasten, bedoeld in het eerste lid, wordt rekening gehouden met de posten genoemd in
      [artikel 19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel19
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '19'
        hoofdstuk: '5'
  - number: '17.1'
    text: |-
      De uitkeringslasten en uitvoeringskosten van deze regeling worden gefinancierd uit een rijksbijdrage ten laste van
      de begroting van de minister.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel17
  - number: '17.2'
    text: |-
      De Minister stort op de rekening-courant, bedoeld in [artikel 5.16, onderdeel a, van de Regeling Wfsv][ref1], een
      periodiek voorschot op het bedrag, bedoeld in [artikel 16][ref2], van:


      [ref1]: https://wetten.overheid.nl/BWBR0019150#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011113#Artikel16
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019150
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011113
        artikel: '16'
        hoofdstuk: '5'
  - number: 17.2.a
    text: geraamde uitkeringslasten met als valutadatum de tweeëntwintigste dag van elke maand, en
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel17
  - number: 17.2.b
    text: 1/12de deel van de geraamde uitvoeringskosten met als valutadatum de vijftiende dag van elke maand.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel17
  - number: '17.3'
    text: De Minister kan, na overleg met de SVB, van de in het tweede lid, onderdelen a en b, bedoelde bedragen afwijken.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel17
  - number: '19.1'
    text: |-
      In de jaarrekening, bedoeld in [artikel 49 van de Wet SUWI][ref1], worden de baten en lasten, alsmede de ontvangen
      voorschotten, bedoeld in [artikel 17, tweede lid][ref2], uitgesplitst naar uitkeringslasten en uitvoeringskosten,
      met betrekking tot deze regeling opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0011113#Artikel17
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '49'
      - id: ref2
        bwb_id: BWBR0011113
        artikel: '17'
        hoofdstuk: '5'
  - number: '19.2'
    text: 'Op de in het eerste lid bedoelde uitkeringslasten komen in mindering:'
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel19
  - number: 19.2.a
    text: |-
      de bedragen die op grond van [artikel 6a, onderdelen e en f][ref1], zijn terugbetaald;


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel6a
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: 6a
        hoofdstuk: 2a
  - number: 19.2.b
    text: |-
      de eenmalige uitkeringen en voorschotten die op grond van [artikel 12][ref1] zijn teruggevorderd en zijn
      terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0011113#Artikel12
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0011113
        artikel: '12'
        hoofdstuk: '4'
  - number: '19.3'
    text: |-
      Na goedkeuring van het besluit tot vaststelling van de jaarrekening, bedoeld in
      [artikel 34, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1], rekent de Minister van Sociale Zaken
      en Werkgelegenheid de baten en lasten, alsmede de ontvangen voorschotten, met betrekking tot het desbetreffende
      kalenderjaar af, met als valutadatum 1 juni van het hierop volgende kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel34
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '34'
  - number: '21'
    text: |-
      Deze regeling berust mede op [artikel 121, tweede lid, van de Wet financiering sociale verzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel121
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '121'
  - number: '22'
    text: Deze regeling treedt in werking met ingang van 26 januari 2000 en werkt terug tot en met 6 juni 1997.
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel22
  - number: '23'
    text: 'Deze regeling wordt aangehaald als: Regeling tegemoetkoming asbestslachtoffers.'
    url: https://wetten.overheid.nl/BWBR0011113/2014-01-01#Artikel23
