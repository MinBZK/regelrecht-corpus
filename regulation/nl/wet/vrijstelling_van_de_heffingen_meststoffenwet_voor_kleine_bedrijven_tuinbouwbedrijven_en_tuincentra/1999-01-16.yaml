    Handelende in overeenstemming met de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;

    Gelet op artikel 59, eerste lid en derde lid, van de Meststoffenwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010206/1999-01-16#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             wet:

              [Meststoffenwet][ref1];



            b
            minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            c
             niet-grondgebonden tuinbouw:

              vorm van tuinbouw waarbij de voedingsbodem voor de teelt van gewassen uitsluitend een groeimedium is;



            d
            grondgebonden tuinbouw:

              vorm van tuinbouw in een tot het bedrijf behorend gebouw waarbij de voedingsbodem voor de teelt van
      gewassen geheel of gedeeltelijk bestaat in grond.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0010206/1999-01-16#Artikel1
