  - number: '11'
    text: |-
      Indien op het tuincentrum mede tuinbouw wordt uitgeoefend, en het tuincentrum daarvoor dierlijke of
      overige organische meststoffen aanvoert, zijn ten aanzien van deze aanvoer de voorwaarden, bedoeld in
      [artikel 10, onderdelen a, b en c][ref1], niet van toepassing. Als aan-vullende voorwaarden voor de vrijstelling
      gelden in dat geval:

      a. indien er sprake is van tuinbouw die plaatsvindt op landbouwgrond, is de gemiddeld in het betreffende
      kalenderjaar tot het bedrijf behorende oppervlakte landbouwgrond niet groter dan drie hectare, en is de som
      van de hoeveelheid aangevoerde dierlijke en overige organische meststoffen, uitgedrukt in kilogrammen fosfaat,
      aangevoerd voor deze tuinbouw, per kalenderjaar per hectare van de gemiddeld in het betreffende kalenderjaar tot
      het tuincentrum behorende oppervlakte landbouwgrond minder dan 100 kilogram fosfaat in de jaren 1998 en 1999, 85
      kilogram fosfaat in de jaren 2000 en 2001 en 80 kilogram fosfaat in de jaren 2002 en volgende;

      b. indien er sprake is van niet-grondgebonden tuinbouw of grondgebonden tuinbouw, de voorwaarden, bedoeld in
      [artikel 3][ref2];

      c. het tuincentrum levert uitsluitend meststoffen af aan derden, niet zijnde een bedrijf of een onderneming als
      bedoeld in [artikel 29 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010206#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0010206#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel29
