  - number: '9'
    text: |-
      De gemiddeld in het betreffend kalenderjaar door het bedrijf gebruikte oppervlakte groeimedium, de gemiddelde
      oppervlakte van het gebouw of de gebouwen die in het betreffende kalenderjaar bij het bedrijf voor grondgebonden
      en niet-grondgebonden tuinbouw daadwerkelijk in gebruik is, alsmede de totaal in het kalenderjaar aangevoerde
      hoeveelheid fosfaat en stikstof in meststoffen die voor niet-grondgebonden en grondgebonden tuinbouw zijn gebruikt,
      worden door degene die het bedrijf voert vóór 1 september van het jaar volgend op het betreffende kalenderjaar aan
      het Bureau Heffingen gemeld:

      a. indien op het bedrijf artikel 4 van toepassing is, door middel van het formulier, bedoeld in artikel 11, eerste
      lid, van de Regeling administratieve verplichtingen Meststoffenwet op de daartoe bestemde plaats; en

      b. indien op het bedrijf artikel 5 van toepassing is, door middel van het formulier, dat is vastgesteld op grond
      van artikel 41, tweede lid, van de wet in samenhang met artikel 7 van de Algemene wet inzake rijksbelastingen, op
      de daartoe bestemde plaats.
    url: https://wetten.overheid.nl/BWBR0010206/1999-01-16#Artikel9
  - number: '10'
    text: |-
      Van de heffingen, bedoeld in de [titels 1][ref1] tot en met [3][ref2] van [hoofdstuk IV van de wet][ref3], zijn
      vrijgesteld tuincentra die in het betreffende kalenderjaar voldoen aan de volgende voorwaarden:

      a. de dierlijke meststoffen die worden aangeleverd zijn niet verpompbaar;

      b. de dierlijke meststoffen, compost en zwarte grond als bedoeld in artikel 1, eerste lid, onderdelen d en f, van
      het Besluit kwaliteit en gebruik overige organische meststoffen, worden aangeleverd in hoeveelheden van ten hoogste
      5.000 kilogram per vracht, de overige organische meststoffen, niet zijnde compost of zwarte grond, en andere
      meststoffen worden aangeleverd in verpakte eenheden van ten hoogste 25 kilogram per stuk;

      c. alle door het tuincentrum aangevoerde meststoffen worden uitsluitend afgeleverd aan derden, niet zijnde een
      bedrijf of een onderneming als bedoeld in [artikel 29 van de wet][ref4];

      d. de meststoffen worden uitsluitend verkocht in een daartoe bestemde, voor het publiek toegankelijke ruimte,
      zijnde een onroerende zaak of een gedeelte daarvan;

      e. voor de meststoffen wordt door de derde, bedoeld in onderdeel c, aan het tuincentrum een bedrag betaald van ten
      minste nihil;

      f. het aandeel van de verkoop van meststoffen in de jaarlijkse omzet van het tuincentrum is ten hoogste 20%;

      g. het tuincentrum is ingeschreven in het handelsregister, bedoeld in
      [artikel 2, eerste lid, van de Handelsregisterwet 1996][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0004054
