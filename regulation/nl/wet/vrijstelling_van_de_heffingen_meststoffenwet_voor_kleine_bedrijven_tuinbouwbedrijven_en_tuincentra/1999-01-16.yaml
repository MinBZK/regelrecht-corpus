  - number: '3'
    text: |-
      1 Van de heffingen, bedoeld in de [titels 1][ref1] en [2][ref2] van [hoofdstuk IV van de wet][ref3], zijn
      vrijgesteld bedrijven waarop in het betreffende kalenderjaar uitsluitend niet-grondgebonden tuinbouw of
      grondgebonden tuinbouw wordt uitgeoefend, die voldoen aan de voorwaarden van [artikel 7][ref4], en waarvan:

      a. de aangevoerde dierlijke en overige organische meststoffen die worden gebruikt voor niet-grondgebonden tuinbouw,
      uitgedrukt in kilogrammen fosfaat per kalenderjaar per hectare van de gemiddeld in het betreffende kalenderjaar bij
      het bedrijf voor deze vorm van tuinbouw daadwerkelijk in gebruik zijnde oppervlakte groeimedium, niet groter is dan
      460, en

      b. de aangevoerde dierlijke en overige organische meststoffen die worden gebruikt voor grondgebonden tuinbouw,
      uitgedrukt in kilogrammen fosfaat per kalenderjaar per hectare van de gemiddelde oppervlakte van het gebouw of de
      gebouwen die in het betreffende kalenderjaar bij het bedrijf voor deze vorm van tuinbouw daadwerkelijk in gebruik
      is, niet groter is dan 460.

      2 Op de vaststelling van de hoeveelheid aangevoerde dierlijke en overige organische meststoffen is
      [artikel 17 van de wet][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0004054
      [ref3]: https://wetten.overheid.nl/BWBR0004054#HoofdstukIV
      [ref4]: https://wetten.overheid.nl/BWBR0010206#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0004054#Artikel17
