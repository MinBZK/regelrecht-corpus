  - number: '12'
    text: |-
      Van de verplichting tot het opmaken van een afleveringsbewijs, bedoeld in [artikel 7][ref1] en
      [artikel 13 van het Besluit administratieve verplichtingen Meststoffenwet][ref2], zijn vrijgesteld het tuincentrum
      en derden, bedoeld in [artikel 10, onderdeel c][ref3], voorzover het betreft de door het tuincentrum aan deze
      derden afgeleverde dierlijke, onderscheidenlijk overige organische meststoffen.


