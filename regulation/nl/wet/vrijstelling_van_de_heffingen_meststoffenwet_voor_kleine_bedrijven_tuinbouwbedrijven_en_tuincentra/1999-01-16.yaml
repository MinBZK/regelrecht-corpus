      1 Van de heffingen, bedoeld in de [titels 1][ref1], [2][ref2] en [4][ref3] van [hoofdstuk IV van de wet][ref4],
      zijn vrijgesteld bedrijven die in het betreffende kalenderjaar voldoen aan elk van de volgende voorwaarden:

      a. de gemiddelde veebezetting is niet groter dan drie grootvee-eenheden;

      b. de gemiddeld tot het bedrijf behorende oppervlakte landbouwgrond is niet groter dan drie hectare;

      c. er worden geen dierlijke en overige organische meststoffen aangevoerd.

      2 De omrekening van dieren van de onderscheiden diercategorieën naar grootvee-eenheden geschiedt overeenkomstig de
      daarvoor in [bijlage A bij de wet][ref5] opgenomen normen.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
