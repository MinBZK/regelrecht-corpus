  - number: '7'
    text: |-
      1 Ten aanzien van het bedrijf wordt een administratie bijgehouden van de aangevoerde hoeveelheid fosfaat en
      stikstof in meststoffen die voor niet-grondgebonden en grondgebonden tuinbouw worden gebruikt, zodanig dat daaruit
      te allen tijde de in het betreffende kalenderjaar aan het bedrijf afgeleverde hoeveelheid fosfaat en stikstof in
      meststoffen die voor deze vormen van tuinbouw worden gebruikt, duidelijk blijkt.

      2 Ten aanzien van het bedrijf wordt elke maand de oppervlakte bepaald van de groeimedia en de voor de niet-
      grondgebonden of grondgebonden tuinbouw daadwerkelijk gebruikte oppervlakte van het gebouw of de gebouwen die in
      het betreffende kalenderjaar bij het bedrijf voor deze vorm van tuinbouw daadwerkelijk in gebruik is, en onverwijld
      in de administratie opgenomen.

      3 Met betrekking tot 1998 worden de gegevens, bedoeld in het eerste en het tweede lid, desgevraagd ten genoegen
      van de inspecteur van het Bureau Heffingen aannemelijk gemaakt uit de ten aanzien van het bedrijf gevoerde
      administratie en de daartoe behorende boeken, bescheiden en andere gegevensdragers.

      4 De gegevens, bedoeld in het eerste en tweede lid, worden gedurende zeven jaren bewaard.
    url: https://wetten.overheid.nl/BWBR0010206/1999-01-16#Artikel7
  - number: '8'
    text: |-
      1 De gemiddeld in het betreffende kalenderjaar door het bedrijf gebruikte oppervlakte groeimedium, en de gemiddelde
      oppervlakte van het gebouw of de gebouwen die in het betreffende kalenderjaar bij het bedrijf voor grondgebonden
      en niet-grondgebonden tuinbouw daadwerkelijk in gebruik is, worden bepaald door de som van de ingevolge
      [artikel 7, tweede lid][ref1], maandelijks bepaalde oppervlakten, te delen door 12.

      2 Het gemiddelde in 1998 wordt bepaald op basis van de gegevens, bedoeld in [artikel 7, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010206#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0010206#Artikel7
    url: https://wetten.overheid.nl/BWBR0010206/1999-01-16#Artikel8
