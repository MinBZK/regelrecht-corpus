  - number: '6'
    text: |-
      Indien de niet-grondgebonden tuinbouw plaatsvindt in een gebouw, is de oppervlakte groeimedium,
      bedoeld in [artikel 3, eerste lid, onderdeel a][ref1], [artikel 4, eerste lid, onderdeel a][ref2], en
      [artikel 5, tweede lid, onderdeel a, en derde lid, onderdeel a][ref3], de oppervlakte van het gebouw of de gebouwen
      die in het betreffende kalenderjaar bij het bedrijf voor deze vorm van tuinbouw daadwerkelijk in gebruik is.


      [ref1]: https://wetten.overheid.nl/BWBR0010206#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0010206#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0010206#Artikel5
