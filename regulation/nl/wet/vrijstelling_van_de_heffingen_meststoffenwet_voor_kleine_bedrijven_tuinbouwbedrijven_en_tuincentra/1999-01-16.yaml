  - number: '4'
    text: |-
      1 Van de heffingen, bedoeld in de titels 1 en 2 van hoofdstuk IV van de wet, zijn vrijgesteld bedrijven waarop in
      het betreffende kalenderjaar mede niet-grondgebonden tuinbouw of grondgebonden tuinbouw wordt uitgeoefend, en die
      voldoen aan de voorwaarden van artikel 38 van de wet, paragraaf 4 van de Regeling administratieve verplichtingen
      Meststoffenwet en artikel 7, met dien verstande dat voor de toepassing van artikel 38, eerste lid, onderdeel b, van
      de wet, niet in aanmerking worden genomen:

      a. de aangevoerde dierlijke en overige organische meststoffen die worden gebruikt voor niet-grondgebonden tuinbouw,
      tot ten hoogste 460 kilogram fosfaat per kalenderjaar per hectare van de gemiddeld in het betreffende kalenderjaar
      bij het bedrijf voor deze vorm van tuinbouw daadwerkelijk in gebruik zijnde oppervlakte groeimedium, en

      b. de aangevoerde dierlijke en overige organische meststoffen die worden gebruikt voor grondgebonden tuinbouw, tot
      ten hoogste 460 kilogram fosfaat per kalenderjaar per hectare van de gemiddelde oppervlakte van het gebouw of de
      gebouwen die in het betreffende kalenderjaar bij het bedrijf voor deze vorm van tuinbouw daadwerkelijk in gebruik
      is.

      2 De omrekening van dieren van de onderscheiden diercategorieën naar grootvee-eenheden geschiedt overeenkomstig
      de daarvoor in bijlage A bij de wet opgenomen normen. Op de vaststelling van de hoeveelheid aangevoerde dierlijke
      meststoffen, de hoeveelheid aangevoerde overige organische meststoffen en de hoeveelheid geproduceerde dierlijke
      meststoffen is artikel 17 van de wet van overeenkomstige toepassing.

      3 De regels gesteld bij of krachtens de wet en de Wet herstructurering varkenshouderij die betrekking hebben op
      bedrijven waarop de vrijstelling, bedoeld in artikel 38 van de wet van toepassing is, zijn van overeenkomstige
      toepassing op de bedrijven waarop de vrij-stelling, bedoeld in het eerste lid, van toepassing is.
    url: https://wetten.overheid.nl/BWBR0010206/1999-01-16#Artikel4
  - number: '5'
    text: |-
      1 Van de heffingen, bedoeld in de [titels 1][ref1] en [2][ref2] van [hoofdstuk IV van de wet][ref3], zijn
      bedrijven waarop de [artikelen 3][ref4] en [4][ref5] niet van toepassing zijn en waarop in het betreffende
      kalenderjaar uitsluitend of mede niet-grondgebonden tuinbouw of grondgebonden tuinbouw wordt uitgeoefend, en
      die aan de voorwaarden van [artikel 7][ref6] voldoen vrijgesteld tot een overeenkomstig het tweede en derde
      lid bepaalde belastbare hoeveelheid meststoffen, onderscheidenlijk mineralen, als bedoeld in artikel 15,
      onderscheidenlijk 23, van de wet.

      2 De belastbare hoeveelheid meststoffen, onderscheidenlijk mineralen, uitgedrukt in kilogrammen fosfaat, waarvoor
      de vrijstelling geldt, is de som van:

      a. de aangevoerde dierlijke en overige organische meststoffen die worden gebruikt voor niet-grondgebonden tuinbouw,
      tot ten hoogste 460 kilogram per kalenderjaar per hectare van de gemiddeld in het betreffende kalenderjaar bij het
      bedrijf voor deze vorm van tuinbouw daadwerkelijk in gebruik zijnde oppervlakte groeimedium, en

      b. de aangevoerde dierlijke en overige organische meststoffen die worden gebruikt voor grondgebonden tuinbouw, tot
      ten hoogste 460 kilogram per kalenderjaar per hectare van de gemiddelde oppervlakte van het gebouw of de gebouwen
      die in het betreffende kalenderjaar bij het bedrijf voor deze vorm van tuinbouw daadwerkelijk in gebruik is.

      3 De belastbare hoeveelheid meststoffen, onderscheidenlijk mineralen, uitgedrukt in kilogrammen stikstof, waarvoor
      de vrijstelling geldt, is de som van:

      a. de aangevoerde dierlijke, overige organische en andere meststoffen die worden gebruikt voor niet-grondgebonden
      tuinbouw, tot ten hoogste 800 kilogram per kalenderjaar per hectare van de gemiddeld in het betreffende
      kalenderjaar bij het bedrijf voor deze vorm van tuinbouw daadwerkelijk in gebruik zijnde oppervlakte groeimedium,
      en

      b. de aangevoerde dierlijke, overige organische en andere meststoffen die worden gebruikt voor grondgebonden
      tuinbouw, tot ten hoogste 800 kilogram per kalenderjaar per hectare van het gebouw of de gebouwen die in het
      betreffende kalenderjaar bij het bedrijf voor deze vorm van tuinbouw daadwerkelijk in gebruik is.


