articles:
  - number: '1'
    text: |-
      In deze regeling en de daarbij behorende bijlage wordt verstaan onder:



            a
             minister:

              Minister van Verkeer en Waterstaat;



            b
            wet:

              [Wet personenvervoer 2000][ref1];



            c
            besluit:

              [Besluit personenvervoer 2000][ref2];



            d
             decentrale overheid:

              de provincies en regionale openbare lichamen op, naar of van wier grondgebied een regionale treindienst
      wordt gereden;



            e
             bijdrage:

              de in [artikel 3, eerste lid][ref3], bedoelde bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
      [ref2]: https://wetten.overheid.nl/BWBR0011982
      [ref3]: https://wetten.overheid.nl/BWBR0009697#Artikel3
    url: https://wetten.overheid.nl/BWBR0009697/2005-03-16#Artikel1
