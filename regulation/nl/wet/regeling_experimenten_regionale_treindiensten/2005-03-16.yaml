        artikel: '3'
        paragraaf: '2'
  - number: '2'
    text: |-
      Deze regeling is van toepassing op openbaar vervoer met de regionale treindiensten, vermeld in bijlage 1 bij deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0009697/2005-03-16#Artikel2
  - number: '3'
    text: |-
      1 De minister kan op aanvraag van de decentrale overheid overeenkomstig [artikel 77 van de wet][ref1] een
      financiële bijdrage verstrekken voor de exploitatie van regionale treindiensten.

      2 In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref2] is
      [titel 4.2 van de Algemene wet bestuursrecht][ref3] van toepassing op de bijdrage voor regionale treindiensten.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel421
      [ref3]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0009697/2005-03-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '77'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:21
      - id: ref3
        bwb_id: BWBR0005537
  - number: '4'
    text: |-
      1 De bijdrage wordt jaarlijks verleend voor de aanvang van het jaar waarop de bijdrage betrekking heeft.

      2 In afwijking van het eerste lid kan de minister:

      a. in verband met de start van een regionale treindienst de bijdrage verlenen in de loop van het jaar waarop deze
      betrekking heeft, en

      b. incidentele aanvullingen op de bijdrage verlenen in de loop van het jaar waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0009697/2005-03-16#Artikel4
  - number: '5'
    text: |-
      1 De bijdrage wordt slechts verleend indien:

      a. de decentrale overheid een opdracht voor het openbaar vervoer per regionale treindienst openbaar heeft
      aanbesteed, of

      b. de decentrale overheid een opdracht voor het openbaar vervoer per regionale treindienst onderhands aan een
      vervoerder, niet zijnde de vervoerder die op het tijdstip van inwerkingtre-ding van deze regeling op betreffend
      traject openbaar vervoer per trein verricht, heeft verleend en dit vervoer naar het oordeel van de minister
      in vervoerkundig opzicht meerwaarde heeft in vergelijking met het vervoer per trein dat voorafgaande aan de
      opdrachtverlening op het traject werd verricht.

      2 De minister beoordeelt de meerwaarde, bedoeld in het eerste lid, onderdeel b, aan de hand van de door hem
      verwachte toename van reizigers of vervoeropbrengsten, de verhouding tussen de door hem verwachte kosten en
      opbrengsten van het vervoer of de afstemming met het overige openbaar vervoer.
    url: https://wetten.overheid.nl/BWBR0009697/2005-03-16#Artikel5
  - number: '7'
    text: |-
      De bijdrage wordt jaarlijks ambtshalve vastgesteld zo spoedig mogelijk na afloop van het jaar waarop de bijdrage
      betrekking heeft. Onverminderd [artikel 4:46, tweede lid, van de Algemene wet bestuursrecht][ref1] kan de bijdrage
      gewijzigd worden vastgesteld indien de lonen en prijzen in het jaar waarop de bijdrage betrekking heeft zijn
      veranderd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel446
    url: https://wetten.overheid.nl/BWBR0009697/2005-03-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:46
  - number: '8'
    text: |-
      1 Het bedrag van de vastgestelde bijdrage wordt binnen 8 weken na vaststelling betaald.

      2 De minister kan voorschotten verlenen aan de decentrale overheid aan wie een bijdrage is verleend.

      3 De betaling van de voorschotten geschiedt in dertien maandelijkse termijnbedragen, waarbij in de maand april
      twee termijnbedragen worden betaald, met uitzondering van het geval waarin [artikel 4][ref1]. tweede lid, wordt
      toegepast, in welk geval de voorschotten in maandelijkse termijnen over resterende periode tot het einde van het
      jaar worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009697#Artikel4
    url: https://wetten.overheid.nl/BWBR0009697/2005-03-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009697
        artikel: '4'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 In afwijking van de [artikelen 4, eerste lid][ref1], en [7][ref2] kan de minister de bijdrage zonder
      voorafgaande verlening vaststellen voor aanvang van het jaar waarop de bijdrage betrekking heeft. De
      [artikelen 4, tweede lid][ref3], [5][ref4] en [6][ref5] zijn van overeenkomstige toepassing.

      2 Bij toepassing van het eerste lid wordt de bijdrage in afwijking van [artikel 8, eerste lid][ref6], betaald
      overeenkomstig [artikel 8, derde lid][ref7].


