---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_financien_en_personeel_kabinetten_van_de_gouverneurs
regulatory_layer: WET
publication_date: '2011-12-06'
valid_from: '2012-12-07'
bwb_id: BWBR0030723
url: https://wetten.overheid.nl/BWBR0030723/2012-12-07
preamble:
  text: |-
    Gelet op artikel 19, vijfde lid, en 21, zesde lid, van de Comptabiliteitswet 2001, artikel 4 van het
    Instellingsbesluit Kabinet van de Gouverneur van Aruba, artikel 4 van het Instellingsbesluit Kabinet van de
    Gouverneur van Curaçao en artikel 4 van het Instellingsbesluit Kabinet van de Gouverneur van Sint Maarten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel1
  - number: 1.a
    text: '*minister:* Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel1
  - number: 1.b
    text: |-
      *directeur van het Kabinet:* directeur van het Kabinet van de Gouverneur van Aruba, directeur van het Kabinet van
      de Gouverneur van Curaçao of directeur van het Kabinet van de Gouverneur van Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel1
  - number: 1.c
    text: |-
      *Kabinet:* Kabinet van de Gouverneur van Aruba, Kabinet van de Gouverneur van Curaçao of Kabinet van de Gouverneur
      van Sint Maarten;
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel1
  - number: 1.d
    text: '*secretaris-generaal:* secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel1
  - number: 1.e
    text: |-
      *directeur FEZ:* directeur van de directie Financieel-Economische Zaken van het Ministerie van Binnenlandse Zaken
      en Koninkrijksrelaties;
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel1
  - number: 1.f
    text: |-
      *directeur PRIO:* directeur van de directie Personeel, Regie, ICT en Organisatie van het Ministerie van
      Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel1
  - number: '2.1'
    text: |-
      De directeur van het Kabinet zendt de minister jaarlijks vóór 1 januari van een begrotingsjaar een bestedingsplan
      ten behoeve van de aan de taakvervulling van het Kabinet verbonden uitgaven voor het volgende begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel2
  - number: '2.2'
    text: 'Voorts zendt de directeur van het Kabinet jaarlijks aan de directeur FEZ:'
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel2
  - number: 2.2.a
    text: |-
      vóór 15 februari een verantwoording van de ontvangsten en de uitgaven van het Kabinet over de periode van januari
      tot en met december van het voorgaande jaar;
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel2
  - number: 2.2.b
    text: |-
      vóór 15 augustus een tussentijdse verantwoording van de ontvangsten en de uitgaven van het Kabinet over de periode
      van januari tot en met juni.
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel2
  - number: '3.1'
    text: |-
      In aanvulling op [artikel 12, tweede lid, van het Besluit Taak FEZ][ref1], beschikt de directeur van het Kabinet
      over het budget met betrekking tot het Kabinet, zoals vastgesteld in de begroting voor de Overige Hoge Colleges van
      Staat en Kabinetten (IIB).


      [ref1]: https://wetten.overheid.nl/BWBR0005333#Artikel12
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005333
        artikel: '12'
  - number: '3.2'
    text: |-
      De directeur van het Kabinet is, met inachtneming van de [Comptabiliteitswet 2001][ref1] en de daaruit
      voortvloeiende nadere regelgeving, verantwoordelijk voor het beheer van de geldelijke en niet-geldelijke zaken van
      het Kabinet alsmede voor de begroting van het Kabinet.


      [ref1]: https://wetten.overheid.nl/BWBR0013891
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013891
  - number: '3.3'
    text: De directeur van het Kabinet kan een beroep doen op de directeur FEZ voor advies en bijstand.
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel3
  - number: '3.4'
    text: De directeur FEZ ziet toe op de uitvoering van de taken van de directeur van het Kabinet, bedoeld in dit artikel.
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel3
  - number: '3.5'
    text: |-
      De Rijksauditdienst is belast met de controle op de door de directeur van het Kabinet gehouden administratie. De
      directeur Rijksauditdienst rapporteert zijn bevindingen aan de minister en aan de directeur van het Kabinet.
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel3
  - number: '4.1'
    text: |-
      De directeur van het Kabinet is bevoegd om namens de minister de bevoegdheden, genoemd in [bijlage 1][ref1], uit te
      oefenen ten aanzien van de personeelsleden werkzaam bij het Kabinet.


      [ref1]: https://wetten.overheid.nl/BWBR0030723
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0030723
  - number: '4.2'
    text: |-
      De uitoefening van de bevoegdheden, genoemd in [bijlage 1][ref1], geschiedt met inachtneming van de algemene en
      bijzondere voor de rijksdienst vastgestelde regels, nadere regels voor lokale arbeidskrachten, nadere regels voor
      zogenoemde uitgezonden personeelsleden en rekening houdend met de bijzondere staatsrechtelijke positie van het
      Kabinet.


      [ref1]: https://wetten.overheid.nl/BWBR0030723
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0030723
  - number: '4.3'
    text: |-
      De directeur van het Kabinet zendt de minister jaarlijks vóór 1 april een verslag omtrent de uitgeoefende
      bevoegdheden, genoemd in [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030723
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0030723
  - number: '5.1'
    text: |-
      De directeur van het Kabinet kan een beroep doen op de directeur PRIO voor advies en bijstand ten aanzien van de
      uitvoering van de bevoegdheden, genoemd in [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030723
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0030723
  - number: '5.2'
    text: |-
      De directeur PRIO ziet toe op de uitvoering van de bevoegdheden van de directeur van het Kabinet, genoemd in
      [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030723
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0030723
  - number: '6'
    text: |-
      Ten minste twee maal per jaar vindt een overleg plaats tussen de directeur van het Kabinet en, namens de minister,
      de Secretaris-generaal over de uitvoering van deze regeling bij het Kabinet.
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel6
  - number: '7'
    text: |-
      Het [Beheersbesluit KABGNA/KABGA 1998][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009743
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009743
  - number: '8.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 10 oktober 2010.
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel8
  - number: '8.2'
    text: |-
      In tegenstelling tot het eerste lid treedt dit besluit in Aruba in werking op het tijdstip waarop een nieuw besluit
      tot instelling van het Kabinet van de Gouverneur van Aruba, op basis van [artikel 2 van het Statuut][ref1], in
      werking treedt


      [ref1]: https://wetten.overheid.nl/BWBR0002154#Artikel2
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002154
        artikel: '2'
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit financiën en personeel Kabinetten van de Gouverneurs.'
    url: https://wetten.overheid.nl/BWBR0030723/2012-12-07#Artikel9
