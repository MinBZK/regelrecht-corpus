  - number: '14'
    text: |-
      1 De A.I.D. is belast met de in de communautaire verordeningen voorgeschreven controles en monsterneming in de
      verwerkende bedrijven en verifieert daarbij tevens de juistheid van de opgemaakte verwerkingsstaten.

      Van de bevindingen bij de verificatie van de verwerkingsstaten, het verdere onderzoek en de monsterneming brengt de
      A.I.D. rapport uit aan het Hoofdproduktschap en zonodig aan LASER

      2 Indien de verwerking van het magere melkpoeder ingevolge [Verordening 1624/76](31976R1624) plaatsvindt, brengt de
      AID tevens rapport uit aan het produktschap.
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel14
  - number: '15'
    text: |-
      1 Onverminderd het bepaalde in het derde lid wordt steun door het Hoofdproduktschap verleend aan de hand van:

        - de ontvangen verzoeken om steun en de daarbij behorende verwerkingsstaten en overzichtsstaten.
        - de bevindingen van de A.I.D. bij de verificatie van deze staten;
        - in voorkomend geval de ontvangen analyse-resusltaten van de in de betrokken verwerkingsperiode van het verwerkt
      magere melkpoeder, de ondermelk en het vervaardigd mengvoeder genomen monsters.

      2 De steun wordt verleend onder voorbehoud van terugbetaling of verrekening indien uit nadien ingestelde controles
      of anderszins is gebleken dat de steun ten onrechte of voor een te hoog bedrag is verleend.

      3 Indien niet van alle op een bedrijf in de betrokken verwerkingsperiode genomen monsters de analyse-resultaten
      bekend zijn en uit ontvangen analyseresultaten van de in de voorafgaande verwerkingsperiode genomen monsters blijkt
      dat in die periode de bepalingen van de communautaire verordeningen niet volledig zijn in acht genomen, wordt op
      het in dat bedrijf verwerkt magere melkpoeder of ondermelk geen steun verleend zolang niet alle analyse-resultaten
      over de uit te betalen verwerkingsperiode beschikbaar zijn.

      4 Het Hoofdproduktschap informeert met betrekking tot iedere verwerkingsperiode, in voorkomend gevaar onder
      toezending van een exemplaar van de desbetreffende overzichtsstaten, LASER en de A.I.D. omtrent de met toekenning
      van steun verwerkte hoeveelheden magere melkpoeder en ondermelk.
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel15
  - number: 16a
    text: |-
      1 Degenen, die voornemens zijn ter zake van de verzending van in Nederland vervaardigd mager melkpoeder naar
      een andere lid-staat om aldaar te worden gedenatureerd of verwerkt tot mengvoeder steun aan te vragen, dienen
      voorafgaand aan de verzending van hun bedrijf bij de AID een verklaring als bedoeld in artikel 2, vierde lid,
      van de [Verordening 1624/76](31976R1624) aan te vragen onder opgave van de plaats waar de zending kan worden
      bemonsterd.

      2 Ingeval het mager melkpoeder verwerkt in een mengsel zal worden verzonden, dient de in het vorige lid omschreven
      verklaring te worden aangevraagd voordat het magere melkpoeder in het mengsel is verwerkt.

      3 De monsters, nodig voor de beoordeling van de aanvraag voor de in het eerste lid bedoelde verklaring worden
      genomen door de A.I.D.

      4 Indien de plaats van bemonstering een andere is dan de plaats van de aangifte ten uitvoer, zal de zending door de
      A.I.D. worden verzegeld en kan tussentijds vervoer slechts onder verzegeling geschieden.

      5 De AID geeft de verklaring slechts af met inachtneming van de vereisten uit hoofde van [artikel 5][ref1] en
      de bij het onderzoek van de monsters behaalde analyseresultaten. Van de afgegeven verklaring zendt de AID een
      afschrift, al naar gelang het betreft verzending van mager melkpoeder als zodanig of verwerkt in een mengsel, aan
      het Produktschap onderscheidenlijk het Hoofdproduktschap.


      [ref1]: https://wetten.overheid.nl/BWBR0003281#Artikel5
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0003281
        artikel: '5'
        paragraaf: '1'
  - number: 16b
    text: |-
      1 Verzoeken om steun ter zake van de verzending van mager melkpoeder naar een andere lid-staat om aldaar
      overeenkomstig [Verordening 1725/79](31979R1725) te worden gedenatureerd of verwerkt tot mengvoeder worden
      ingediend bij het Produktschap onderscheidenlijk het Hoofdproduktschap, al naar gelang het betreft verzending van
      mager melkpoeder als zodanig of verwerkt in een mengsel.

      2 Het Produktschap onderscheidenlijk het Hoofdproduktschap bepaalt welke gegevens het verzoek om steun dient te
      bevatten en stelt het model daarvan vast.
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel16b
  - number: 16c
    text: |-
      1 De steun wordt door het Produktschap onderscheidenlijk het Hoofdproduktschap verleend aan de hand van:

        - de gedane aangifte ten uitvoer en de bevindingen van de douane bij de verificatie daarvan zoals deze blijken uit
      het formulier EX L;
        - het terugontvangen controle-exemplaar T nr. 5.

      In voorkomend geval kan volgens de communautaire voorschriften een voorschot op de steun worden verleend.

      2 Het Produktschap onderscheidenlijk het Hoofdproduktschap informeert de A.I.D. periodiek, onder toezending van een
      exemplaar van de verzoeken om steun, omtrent de verleende steunbedragen.
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel16c
  - number: 16e
    text: |-
      1 In afwijking van artikel 36, onder a, van de In- en uitvoerbeschikking landbouwgoederen 1981 (Stcrt. 50) kan
      invoer in Nederland van magere melkpoeder als zodanig of verwerkt in een mengsel, waarvoor in een andere Lid-
      Staat ingevolge [Verordening 1624/76](31976R1624) steun wordt betaald, slechts geschieden tegen overlegging van een
      formulier L, als bedoeld in [artikel 15][ref1] van genoemde beschikking, dat, ten bewijze dat het magere melkpoeder
      onder de in artikel 2, eerste lid, van [Verordening 1624/76](31976R1624) bedoelde administratieve controle is
      geplaatst, is gewaarmerkt dat de aldaar bedoelde zekerheid overeenkomstig de communautaire voorschriften is
      gesteld.

      2 Het produktschap onderscheidenlijk het hoofdproduktschap al naar gelang het betreft invoer van magere melkpoeder
      als zodanig of verwerkt in een mengsel is belast met de uitvoering van de in het eerste lid bedoelde controle en
      met de waarmerking van het in het eerste lid bedoelde formulier.

      3 Op het moment dat het in het eerste lid bedoelde formulier ter waarmerking aan het produktschap onderscheidenlijk
      hoofdproduktschap wordt aangeboden, dient in vak 44 van dit formulier het nummer van de in artikel 2, vierde lid,
      van [Verordening 1624/76](31976R1624) bedoelde en in kopie bijgevoegde verklaring te zijn vermeld. Bij de aangifte
      ten invoer dient in vak 44 van het genoemde formulier tevens de datum waarop de douaneformaliteiten bij uitvoer uit
      de Lid-Staat van uitvoer zijn vervuld te zijn vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003281#Artikel15
