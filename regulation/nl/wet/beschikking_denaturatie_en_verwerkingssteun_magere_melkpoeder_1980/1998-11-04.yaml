    text: |-
      1 In deze beschikking wordt verstaan onder:




                *Minister:*


                de Minister van Landbouw, Natuurbeheer en Visserij;




                *LASER:*


                de dienst Landelijke service bij regelingen van het ministerie van Landbouw, Natuurbeheer en Visserij;




                *Hoofdproduktschap:*


                Hoofdproduktschap voor Akkerbouwprodukten;




                *Produktschap:*


                Produktschap voor Zuivel;




                *A.I.D.:*


                Algemene Inspectiedienst van het Ministerie van Landbouw, Natuurbeheer en Visserij;




                *Rikilt:*


                Rijks-Kwaliteitsinstituut voor Land- en Tuinbouwprodukten te Wageningen;




                *Verordening 804/68:*


                Verordening (EEG) no. 804/68 van de Raad, houdende een gemeenschappelijke ordening der markten in de
      sector melk en zuivelprodukten (Pb. E.G. no. L 148);




                *Verordening 1844/77:*


                Verordening (EEG) no. 1844/77 van de Commissie (Pb. E.G. no. L 205);




                *Verordening 1725/79:*


                Verordening (EEG) no. 1725/79 van de Commissie (Pb. E.G. no. L 199);




                *Verordening 3314/80:*


                [Verordening (EEG) nr. 3314/80](31980R3314) van de Commissie (Pb. E.G. nr. L 345);




                *Verordening 1624/76:*


                Verordening (EEG) no. 1624/76 van de Commissie (Pb.E.G. no. L 180/9);




                *magere-melkpoeder:*


                melk en karnemelk in poedervorm die ten hoogste 11% vetstoffen bevat;




                *ondermelk:*


                melk en karnemelk met een vetgehalte van ten hoogste 1%;




                *mengvoeder:*


                goederen van de posten 2309 10 11 tot en met 2309 10 70 en 2309 90 31 tot en met 2309 90 70 van de
      gecombineerde nomenclatuur;




                *denaturatie:*


                denaturatie in de zin van artikel 9, tweede lid, eerste gedachtenstreepje, van [Verordening 1844/77]
      (31977R1844) of artikel 2 van [Verordening 1725/79](31979R1725).




                *mengsel:*


                mengsel als bedoeld in artikel 1, derde lid, van [Verordening 1725/79](31979R1725).




      2 Tot 1 maart 1980 dient in de volgende artikelen in plaats van ‘[Verordening 1725/79](31979R1725)' telkens te
      worden gelezen:

      Verordening (EEG) no. 990/72 van de Commissie (Pb. E.G. no. L 155).
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel1
  - number: '2'
    text: |-
      1 Aan degenen die mager melkpoeder of ondermelk verwerken of doen verwerken tot mengvoeder dan wel magere
      melkpoeder voor veevoederdoeleinden denatureren of doen denatureren wordt op hun verzoek overeenkomstig artikel
      10 van [Verordening 804/68](31968R0804) ter zake van die verwerking of denaturatie als bijdrage in de zin
      van [artikel 15 van de Landbouwwet][ref1] steun verleend, naar de onderscheidingen en maatstaven en onder de
      beperkingen en voorwaarden, die in die Verordening, de ter uitvoering daarvan vastgestelde of vast te stellen
      verordeningen dan wel bij of krachtens deze beschikking zijn gesteld.

      2 Onder de in [Verordening 1624/76](31976R1624) gestelde voorwaarden en beperkingen wordt, op dezelfde voet als in
      het voorgaande lid, aan exporteurs van mager melkpoeder, dat in Nederland is vervaardigd en als zodanig of verwerkt
      in een mengsel is verzonden naar een andere lid-staat om aldaar overeenkomstig [Verordening 1725/79](31979R1725) te
      worden gedenatureerd of verwerkt tot mengvoeder, op hun verzoek ter zake van die verzending steun verleend.

      3 Indien het magere melkpoeder in een andere Lid-Staat onder de in [Verordening 1624/76](31976R1624) gestelde
      voorwaarden en beperkingen is vervaardigd en als zodanig of verwerkt in een mengsel is verzonden naar Nederland om
      alhier overeenkomstig [Verordening 1725/79](31979R1725) te worden gedenatureerd of verwerkt tot mengvoeder, wordt
      ter zake van de denaturatie of verwerking geen steun betaald.

      4 Voor de toepassing van het tweede en het derde lid wordt het magere melkpoeder, dat door het interventiebureau
      van de Lid-Staat van verzending is verkocht, beschouwd als in die Lid-Staat vervaardigd magere melkpoeder.

      5 De steun ter zake van de denaturatie van mager melkpoeder wordt verleend door het Produktschap.

      De steun ter zake van de verwerking van mager melkpoeder of ondermelk wordt verleend door het Hoofdproduktschap.

      De steun ter zake van de verzending van mager melkpoeder als zodanig naar een andere lid-staat om aldaar
      overeenkomstig [Verordening 1725/79](31979R1725) te worden gedenatureerd of verwerkt tot mengvoeder wordt verleend
      door het Produktschap. De steun ter zake van de verzending van in een mengsel verwerkt mager melkpoeder naar een
      andere lidstaat om aldaar overeenkomstig [Verordening 1725/79](31979R1725) te worden verwerkt tot mengvoeder, wordt
      verleend door het Hoofdproduktschap.


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel15
