  - number: '8'
    text: |-
      1 Het toezicht op de denaturatie van het mager melkpoeder wordt uitgeoefend door LASER

      2 Verzoeken om toezicht moeten schriftelijk en in tweevoud worden ingediend op formulieren waarvan het model
      door de Minister wordt vastgesteld. de Minister bepaalt welke gegevens daarbij moeten worden verstrekt en welke
      termijnen daarbij in acht moeten worden genomen.

      3 Het magere melkpoeder wordt door de ambtenaren van LASER zowel voor als na de denaturatie bemonsterd.

      4 Degene, die voornemens is voor eigen rekening of voor rekening van derden magere melkpoeder ingevolge
      [Verordening 1624/76](31976R1624) ,[Verordening 1844/77](31977R1844), [Verordening 1725/79](31979R1725) of
      [Verordening 3314/80](31980R3314) te denatureren is verplicht in de gevallen waarvoor de Minister dit heeft
      bepaald, op de daarbij aangegeven wijze aan LASER mededeling te doen van de aankomst van dat melkpoeder.

      5 Van de bevindingen bij het toezicht wordt door LASER rapport uitgebracht aan het Produktschap onder gelijktijdige
      toezending van een exemplaar van het verzoek om toezicht.
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel8
  - number: '9'
    text: |-
      1 Verzoeken om steun ter zake van de denaturatie dienen door degene die de denaturatie heeft verricht of daartoe
      opdracht heeft gegeven maandelijks bij het Produktschap te worden ingediend, vergezeld van overzichtsstaten in
      drievoud, betreffende de hoeveelheden magere melkpoeder waarvoor steun wordt aangevraagd.

      Het Produktschap bepaalt welke gegevens, nodig voor de beoordeling van het verzoek om steun, deze staten moeten
      bevatten en stelt het model daarvan vast.

      2 De steun wordt door het Produktschap verleend aan de hand van het ingediend verzoek en de daarbij behorende
      overzichtsstaat, de rapporten van bevindingen bij het toezicht van LASER op de denaturatie en de analyse-resultaten
      van de voor- en na-denaturatie van het magere melkpoeder genomen monsters. De verlening geschiedt onder voorbehoud
      van terugbetaling of verrekening indien uit nadien ingestelde controles of anderszins is gebleken dat de steun ten
      onrechte of voor een te hoog bedrag is verleend.

      3 Het Produktschap informeert maandelijks onder toezending van een exemplaar van de overzichtsstaten LASER en de
      A.I.D. omtrent de verleende steunbedragen.
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel9
  - number: '11'
    text: |-
      Het Hoofdproduktschap is bevoegd:

        - over te gaan tot toepassing van het bepaalde in [artikel 4, eerste lid][ref1], laatste alinea en derde lid van
      [Verordening 1725/79](31979R1725);
        - aan naar zijn oordeel daarvoor in aanmerking komende bedrijven een machtiging te verlenen als bedoeld in
      artikel 6, eerste lid, onder a, van [Verordening 1725/79](31979R1725), zulks onder gehoudenheid aan de machtiging
      voorschriften van administratieve aard te verbinden waardoor wordt gewaarborgd dat het mengvoeder de voorgeschreven
      bestemming bereikt.


