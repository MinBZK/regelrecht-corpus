  - number: '4'
    text: |-
      1 De door [Verordening 1844/77](31977R1844) en [Verordening 1725/79](31979R1725) voorgeschreven erkenning van
      de bedrijven die voor steun in aanmerking te brengen magere melkpoeder denatureren geschiedt door de Minister in
      overleg met de AID.

      2 De door de communautaire verordeningen voorgeschreven erkenning van bedrijven die voor steun in aanmerking te
      brengen magere melkpoeder of ondermelk tot mengvoeder verwerken geschiedt, voor wat betreft de toepassing van
      [Verordening 1844/77](31977R1844) door de Minister en voor wat betreft de toepassing van [Verordening 1725/79]
      (31979R1725) door het Hoofdproduktschap, in beide gevallen in overleg met de A.I.D.
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel4
  - number: '5'
    text: |-
      1 Mager melkpoeder, dat voor steun in aanmerking wordt gebracht, moet zijn van normale samenstelling, deugdelijk
      en van een goede bacteriologische hoedanigheid. Het mag geen vreemde bestanddelen, verontreinigingen of verbrande
      deeltjes bevatten.

      2 Bij het onderzoek van monsters, genomen van mager melkpoeder, dat voor steun in aanmerking wordt gebracht, wordt
      het in de bijlage bepaalde in acht genomen.’
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel5
  - number: '6'
    text: |-
      De ter uitvoering van deze beschikking genomen monsters worden onderzocht door het Rikilt.

      Voor wat betreft monsters genomen ingevolge [artikel 8][ref1] wordt de uitslag ter kennis gebracht van het
      Produktschap en LASER

      Voor wat betreft monsters genomen ingevolge [artikel 14][ref2] wordt de uitslag ter kennis gebracht van het
      Hoofdproduktschap en de A.I.D.

      Voor wat betreft de monsters genomen ingevolge [artikel 14][ref3] van als zodanig ingevoerde en ingevolge
      [Verordening 1624/76](31976R1624) verwerkt magere melkpoeder, wordt de uitslag tevens ter kennis van het
      produktschap gebracht.

      Voor wat betreft monsters van mager melkpoeder als zodanig, genomen ingevolge [artikel 16a][ref4], wordt de
      uitslag ter kennis gebracht van de A.I.D. en het Produktschap. Voor wat betreft monsters van mengsels, waarin mager
      melkpoeder is verwerkt, en die zijn genomen ingevolge [artikel 16a][ref5], wordt de uitslag ter kennis gebracht van
      de A.I.D. en het Hoofdproduktschap.


