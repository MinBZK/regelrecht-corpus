  - number: '17'
    text: |-
      De bevoegdheden die in de voorgaande artikelen zijn toegekend aan het Hoofdproduktschap en het Produktschap, zijn
      overgedragen op de voet van [artikel 23 van de Landbouwwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002252#Artikel23
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel17
