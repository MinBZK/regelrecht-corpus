        bwb_id: BWBR0002252
        artikel: '23'
  - number: '18'
    text: |-
      1 Het is een ieder, die magere melkpoeder of ondermelk tot mengvoeder verwerkt of doet verwerken, denatureert
      of doet denatureren en daarvoor aanspraak op steun maakt of zodanige aanspraak doet ontstaan als in de
      voorgaande artikelen aangegeven, verboden aan LASER, onderscheidenlijk het Produktschap gegevens als bedoeld in
      [artikel 8, tweede lid][ref1], [artikel 9, eerste lid][ref2], of [artikel 13, vierde lid][ref3], te verstrekken die
      niet volledig of niet overeenkomstig de waarheid zijn.

      2 De in het eerste lid bedoelde personen zijn verplicht aan LASER, het Produktschap en het Hoofdproduktschap op hun
      verzoek, alle ter zake van die gegevens gewenste nadere inlichtingen terstond en naar waarheid te verstrekken.


