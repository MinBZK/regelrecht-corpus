  - number: '13'
    text: |-
      1 De verwerkingssteun wordt steeds over een vierwekelijkse periode te rekenen vanaf 31 december 1979 verleend.
      Evenwel wordt aan door het Hoofdproduktschap aangewezen bedrijven voor de eerste maal steun verleend over een
      driewekelijkse periode lopend van 31 december 1979 tot en met 20 januari 1980 en vervolgens over elke daarop
      volgende periode van vier weken. Voor de resterende bedrijven wordt voor de eerste maal steun verleend over een
      periode van één week lopend van 31 december 1979 tot en met 6 januari 1980 en vervolgens over elk daaropvolgende
      periode van vier weken.

      2 Degene die een erkenning, als bedoeld in [artikel 4, tweede lid][ref1], voor het verwerken van magere melkpoeder
      en ondermelk tot mengvoeder ingevolge [Verordening 1844/77](31977R1844) en/of [Verordening 1725/79](31979R1725)
      heeft verkregen dan wel degene die magere melkpoeder denatureert of verwerkt tot mengvoeder ingevolge [Verordening
      3314/80](31980R3314), is verplicht voor elke verwerkingsperiode verwerkingsstaten op te maken.

      Hij dient van deze staten:

        - vanaf de derde dag na afloop van de periode op zijn bedrijf een exemplaar ter beschikking van de controlerende
      ambtenaar van de A.I.D. te houden en
        - uiterlijk op dezelfde dag aan LASER voor wat betreft het ingevolge [Verordening 1844/77](31977R1844) verwerkte
      magere melkpoeder en ondermelk benevens het ingevolge [Verordening 3314/80](31980R3314) verwerkte magere
      melkpoeder, alsmede aan het Hoofdproduktschap voor wat betreft het ingevolge [Verordening 1844/77](31977R1844)
      en [Verordening 3314/80](31980R3314) benevens het ingevolge [Verordening 1725/79](31979R1725) verwerkte magere
      melkpoeder en ondermelk een exemplaar toe te zenden; in het laatste geval vergezeld van het door hem bij het
      Hoofdproduktschap in te dienen verzoek om steun voor zover hij daarop aanspraak maakt.

      3 Degene die aanspraak maakt op steun voor magere melkpoeder of ondermelk dat hij heeft doen verwerken dient
      uiterlijk op de derde dag na afloop van de periode waarin de verwerking daarvan heeft plaatsgevonden een verzoek
      om steun bij het Hoofdproduktschap in te dienen, vergezeld van een overzichtsstaat in drievoud betreffende de
      hoeveelheden magere melkpoeder of ondermelk waarvoor steun wordt aangevraagd.

      4 Het Hoofdproduktschap bepaalt welke gegevens, nodig voor de beoordeling van de verzoeken om steun – naast de
      gegevens bedoeld in [artikel 12][ref2] – de verwerkingsstaten en overzichtsstaten moeten bevatten en stelt de
      modellen daarvan vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003281#Artikel12
