  - number: '12'
    text: |-
      1 Degene die een erkenning, als bedoeld in [artikel 4, tweede lid][ref1], voor het verwerken van magere melkpoeder
      of ondermelk tot mengvoeder heeft verkregen, is verplicht van het voornemen tot zodanige verwerking over te gaan
      steeds uiterlijk twee werkdagen voor de aanvang van de verwerking aan de A.I.D. mededeling te doen.

      2 Van het verloop van zodanige verwerkingen dient te blijken uit de ingevolge [artikel 13][ref2] op te maken
      verwerkingsstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0003281#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003281#Artikel13
    url: https://wetten.overheid.nl/BWBR0003281/1998-11-04#Artikel12
