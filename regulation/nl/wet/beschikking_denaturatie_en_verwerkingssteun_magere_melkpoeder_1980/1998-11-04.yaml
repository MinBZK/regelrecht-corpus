        artikel: '15'
        paragraaf: '3'
  - number: 16f
    text: |-
      1 Degene die het in [artikel 16e, eerste lid][ref1], bedoelde magere melkpoeder invoert is verplicht dit binnen
      een termijn van zes maanden na de datum van de aanvaarding van de aangifte ten invoer overeenkomstig [Verordening
      1725/79](31979R1725) te denatureren of doen denatureren dan wel te verwerken of doen verwerken. Het betreffende
      magere melkpoeder dient gescheiden van ander magere melkpoeder te worden opgeslagen en te worden gedenatureerd dan
      wel verwerkt tot mengvoeder.

      2 Indien ten genoege van het produktschap onderscheidenlijk hoofdproduktschap is aangetoond dat aan de verplichting
      van het eerste lid is voldaan, wordt de in [artikel 16e, eerste lid][ref2], bedoelde zekerheid vrijgegeven.

      3 Het in [artikel 13, tweede lid][ref3], bepaalde is van overeenkomstige toepassing, met dien verstande dat van
      de verwerking ingevolge [Verordening 1624/76](31976R1624) aparte verwerkingsstaten dienen te worden opgemaakt,
      welke naar het hoofdproduktschap dienen te worden gezonden. Indien het verwerking van als zodanig ingevoerde magere
      melkpoeder betreft zendt het hoofdproduktschap afschriften van de verwerkingsstaten naar het produktschap.

      4 Het produktschap onderscheidenlijk het hoofdproduktschap informeert LASER en de AID periodiek omtrent de
      vrijgegeven zekerheden.


