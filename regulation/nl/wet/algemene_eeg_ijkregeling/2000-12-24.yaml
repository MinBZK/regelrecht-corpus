---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: algemene_eeg_ijkregeling
regulatory_layer: WET
publication_date: '2006-03-16'
valid_from: '2000-12-24'
bwb_id: BWBR0003178
url: https://wetten.overheid.nl/BWBR0003178/2000-12-24
preamble:
  text: |-
    Gelet op artikel 23 van de IJkwet 1937 (Stb. 627) en de artikelen 4, 6, 7, 8, 11, 12, 14, 15, 17, 22 en 24 van het
    Algemeen EEG-IJkbesluit (Stb. 1978, 168);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Een aanvraag tot EEG-modelgoedkeuring dient de volgende gegevens te bevatten:'
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.1.a
    text: naam en adres van de fabrikant van het betrokken meetmiddel,
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.1.b
    text: 'indien de aanvraag namens de fabrikant wordt ingediend door een door hem gemachtigde:'
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.1.b.1°
    text: naam en adres van de gemachtigde,
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.1.b.2°
    text: een verklaring van de fabrikant waaruit blijkt dat de indiener van de aanvraag naar behoren gemachtigd is,
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.1.c
    text: het beoogde gebruiksdoel van het betrokken meetmiddel, indien dit voor het onderzoek noodzakelijk is,
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.1.d
    text: de metrologische kenmerken van het model en
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.1.e
    text: |-
      indien het betrokken meetmiddel onder een benaming of type-aanduiding in de handel is of wordt gebracht, die
      benaming of die type-aanduiding.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: '1.2'
    text: De aanvraag tot EEG-modelgoedkeuring dient van tien afschriften daarvan vergezeld te gaan.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: '1.3'
    text: |-
      De aanvraag tot EEG-modelgoedkeuring dient, voor zover de constructie van het model daartoe aanleiding geeft,
      bovendien vergezeld te gaan van de volgende op het model of op de daarnaar vervaardigde of te vervaardigen
      meetmiddelen betrekking hebbende bescheiden in viervoud:
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.3.a
    text: 'een beschrijving ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.3.a.1°
    text: de constructie en de werking van het betrokken meetmiddel,
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.3.a.2°
    text: de beveiligingsinrichtingen die een goede werking van het betrokken meetmiddel waarborgen,
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.3.a.3°
    text: de regel- en justeerinrichtingen,
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.3.a.4°
    text: |-
      de plaatsen, bestemd voor het ijkmerk van eerste EEG-ijk en - voor zover voor het meetmiddel regelen, gesteld
      krachtens artikel 18, vijfde lid, van het Algemeen EEG-IJkbesluit (Stb. 1978, 168) gelden - de zegelmerken;
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: 1.3.b
    text: |-
      samenstellingstekeningen en tekeningen van belangrijke details; c. een principeschema; d. een foto of een
      perspectieftekening van het uitwendige van het betrokken meetmiddel.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: '1.4'
    text: |-
      Indien het model, waarop de aanvraag betrekking heeft, in Nederland ingevolge artikel 11a van de wet is toegelaten
      of met betrekking tot dat model in een ander land reeds een modelgoedkeuring, niet zijnde een EEG-modelgoedkeuring,
      is verleend, dient de aanvraag tot EEG-modelgoedkeuring vergezeld te gaan van de bescheiden in enkelvoud
      betreffende onderscheidenlijk die toelating van het model of die modelgoedkeuring.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel1
  - number: '2.1'
    text: |-
      Het model van het certificaat van EEG-modelgoedkeuring, bedoeld in artikel 7, eerste lid, van het Algemeen EEG-
      IJkbesluit, wordt vastgesteld overeenkomstig de bij deze regeling behorende bijlage 1.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel2
  - number: '2.2'
    text: |-
      Het model van het certificaat van aanvullende EEG-modelgoedkeuring, bedoeld in artikel 8, eerste lid, van het
      Algemeen EEG-IJkbesluit, wordt vastgesteld overeenkomstig de bij deze regeling behorende bijlage 2.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel2
  - number: '3.1'
    text: |-
      Het model van het EEG-modelgoedkeuringsteken, bedoeld in de artikelen 7, tweede lid, onder b, en 14, eerste lid,
      onder a, van het Algemeen EEG-IJkbesluit, is weergegeven in de bij deze regeling behorende bijlage 3, onder I.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel3
  - number: '3.2'
    text: |-
      Voor zover het betreft een model van een meetmiddel als in artikel 6, eerste lid, van het Algemeen EEG-IJkbesluit
      bedoeld is het model van het EEG-modelgoedkeuringsteken weergegeven in de bij deze regeling behorende bijlage 3,
      onder II.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel3
  - number: '4.1'
    text: |-
      Voor het model van een meetmiddel als in artikel 6, eerste lid, van het Algemeen EEG-IJkbesluit bedoeld kan de
      EEG-modelgoedkeuring niet worden verleend of verlengd dan onder beperking van de geldigheidsduur van die EEG-
      modelgoedkeuring met dien verstande dat die goedkeuring:
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel4
  - number: 4.1.a
    text: voor ten hoogste twee jaar kan worden verleend en
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel4
  - number: 4.1.b
    text: slechts eenmaal voor ten hoogste drie jaar kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel4
  - number: '4.2'
    text: |-
      Een besluit van de ijkinstelling tot weigering van de verlenging van de EEG-modelgoedkeuring voor een zodanig model
      wordt de aanvrager van die verlenging onder opgave van redenen medegedeeld.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel4
  - number: '6'
    text: |-
      Het EEG-teken, bedoeld in artikel 17 van het Algemeen EEG-IJkbesluit, is weergegeven in de bij deze regeling
      behorende bijlage 4.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel6
  - number: '7.1'
    text: Het uit twee delen bestaande ijkmerk van eerste EEG-ijk is weergegeven in bijlage 5 van deze regeling.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel7
  - number: '7.2'
    text: |-
      Het zegelmerk, dat door de ijkinstelling, een ijkbevoegde of door of vanwege een andere EER-Staat kan worden
      aangebracht op meetmiddelen, ten aanzien waarvan toepassing is gegeven aan artikel 18, vijfde lid, of artikel 19a,
      eerste lid juncto artikel 18, vijfde lid, van het Algemeen EEG-IJkbesluit, is gelijk aan het eerste deel van het
      ijkmerk van eerste EEG-ijk, dat onderscheidenlijk in Nederland of de betrokken andere EER-Staat op een meetmiddel
      kan worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel7
  - number: '8.1'
    text: |-
      Ten aanzien van afzonderlijke onderdelen en afzonderlijke hulpinrichtingen als bedoeld in artikel 15, eerste
      lid, van het Algemeen EEG-IJkbesluit, zijn de artikelen 1-3 en 5 van de onderhavige regeling van overeenkomstige
      toepassing; ten aanzien van het model van zodanige voorwerpen, waarvoor de EEG-modelgoedkeuring op de voet van
      de artikelen 15, derde lid, en in samenhang daarmede 6, eerste lid, of 11, vierde, zesde en zevende lid, van het
      Algemeen EEG-IJkbesluit wordt verleend of verlengd, is artikel 4 van de onderhavige regeling van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel8
  - number: '8.2'
    text: |-
      Ten aanzien van afzonderlijke onderdelen en afzonderlijke hulpinrichtingen, die krachtens artikel 24, eerste lid,
      van het Algemeen EEG-IJkbesluit zijn aangewezen, is - voor zover ten aanzien van die voorwerpen toepassing is
      gegeven aan de artikelen 24, tweede lid, en, in samenhang daarmede, 18, vijfde lid, van het Algemeen EEG-IJkbesluit
        - artikel 7, tweede lid, van de onderhavige regeling van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel8
  - number: '9.1'
    text: |-
      Het onderzoek tot EEG-modelgoedkeuring en de eerste EEG-ijk worden uitgevoerd, rekening houdende met de voor het
      betrokken meetmiddel normale gebruiksomstandigheden.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van de herkeuring of het onderzoek, bedoeld in artikel
      16 van de wet, van meetmiddelen als bedoeld in artikel 26, eerste lid, onder b, c en d, van het Algemeen EEG-
      IJkbesluit.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Algemene EEG-IJkregeling.'
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel10
  - number: '11.1'
    text: Deze beschikking wordt in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel11
  - number: '11.2'
    text: Zij treedt in werking op het tijdstip waarop het Algemeen EEG-IJkbesluit in werking treedt.
    url: https://wetten.overheid.nl/BWBR0003178/2000-12-24#Artikel11
