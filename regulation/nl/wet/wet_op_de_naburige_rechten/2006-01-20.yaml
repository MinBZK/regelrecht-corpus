  - number: '17.2'
    text: |-
      De bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] betreffende beslag en executie tot afgifte
      van roerende zaken die geen registergoederen zijn, zijn van toepassing. Bij samenloop met een ander beslag gaat
      degene die beslag heeft gelegd krachtens dit artikel voor.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '17.3'
    text: |-
      De rechter kan gelasten dat de afgifte niet plaatsvindt dan tegen een door hem vast te stellen door de eiser te
      betalen vergoeding.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel17
  - number: '17.4'
    text: |-
      Tenzij anders is overeengekomen, heeft de licentienemer het recht de uit het eerste lid voortvloeiende bevoegdheden
      uit te oefenen, voor zover deze strekken tot bescherming van de rechten waarvan de uitoefening hem is toegestaan.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel17
  - number: '17.5'
    text: |-
      Gelijke bevoegdheid tot opeising, dan wel tot vernietiging of onbruikbaarmaking alsmede tot afgifte teneinde tot
      vernietiging of onbruikbaarmaking over te gaan, bestaat ten aanzien van inrichtingen, producten en onderdelen als
      bedoeld in [artikel 19][ref1] en reproducties als bedoeld in [artikel 19a][ref2], die geen registergoederen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel19a
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: 19a
        hoofdstuk: '3'
  - number: '18'
    text: |-
      De in [artikel 17, eerste lid][ref1], bedoelde bevoegdheid kan niet worden uitgeoefend ten aanzien van opnamen
      of reprodukties daarvan, die onder personen berusten, die niet in soortgelijke zaken handel drijven en deze
      uitsluitend voor eigen gebruik hebben verkregen, tenzij zij zelf inbreuk op het desbetreffende recht hebben
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel17
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '17'
        hoofdstuk: '3'
  - number: '19.1'
    text: |-
      Degene, die doeltreffende technische voorzieningen omzeilt en dat weet of redelijkerwijs behoort te weten, handelt
      onrechtmatig.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel19
  - number: '19.2'
    text: |-
      Degene die diensten verricht of inrichtingen, producten of onderdelen vervaardigt, invoert, distribueert, verkoopt,
      verhuurt, adverteert of voor commerciële doeleinden bezit die:
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel19
  - number: 19.2.a)
    text: |-
      aangeboden, aangeprezen of in de handel gebracht worden met het doel om de beschermende werking van doeltreffende
      technische voorzieningen te omzeilen, of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel19
  - number: 19.2.b)
    text: |-
      slechts een commercieel beperkt doel of nut hebben anders dan het omzeilen van de beschermende werking van
      doeltreffende technische voorzieningen, of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel19
  - number: 19.2.c)
    text: |-
      vooral ontworpen, vervaardigd of aangepast worden met het doel het omzeilen van de beschermende werking van
      doeltreffende technische voorzieningen mogelijk of gemakkelijker te maken,
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel19
  - number: '19.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden vastgesteld die de uitvoerende kunstenaar, producent
      van fonogrammen, producent van films en omroeporganisatie, of hun rechtverkrijgenden, er toe verplichten aan de
      gebruiker van een uitvoering, opname van een uitvoering, fonogram, film of programma, of een reproductie daarvan
      voor doeleinden als omschreven in [artikel 10, onderdelen e, f, g, i en k][ref1], en [artikel 11][ref2] de
      nodige middelen te verschaffen om van deze beperkingen te profiteren, mits de gebruiker rechtmatig toegang tot
      door de technische voorziening beschermde uitvoering, opname van een uitvoering, fonogram, film of programma,
      of reproductie daarvan, heeft. Het bepaalde in de voorgaande zin geldt niet ten aanzien van uitvoeringen,
      opnamen van uitvoeringen, fonogrammen, films of programma's, of reproducties daarvan, die onder contractuele
      voorwaarden aan gebruikers beschikbaar worden gesteld op een door hen individueel gekozen plaats en tijd.
      [Artikel 17d van de Auteurswet 1912][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel17d
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '11'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 17d
  - number: 19a
    text: |-
      Degene die opzettelijk en zonder daartoe gerechtigd te zijn elektronische informatie betreffende het beheer
      van rechten verwijdert of wijzigt, of van opnamen van uitvoeringen, fonogrammen, films of programma's, of
      reproducties daarvan, op ongeoorloofde wijze dergelijke informatie is verwijderd of waarin op ongeoorloofde
      wijze dergelijke informatie is gewijzigd, verspreidt, ter verspreiding invoert, uitzendt of anderszins openbaar
      maakt, en weet of redelijkerwijs behoort te weten dat hij zodoende aanzet tot inbreuk op de rechten als bedoeld
      in de [artikelen 2][ref1], [6][ref2], [7a][ref3] en [8][ref4] dan wel een dergelijke inbreuk mogelijk maakt,
      vergemakkelijkt of verbergt, handelt onrechtmatig.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005921
        artikel: 7a
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005921
        artikel: '8'
        hoofdstuk: '2'
  - number: '20.1'
    text: |-
      Op verzoek van een of meer naar het oordeel van de Minister van Justitie representatieve organisaties van bedrijfs-
      of beroepsgenoten, die rechtspersonen met volledige rechtsbevoegdheid zijn en die ten doel hebben de behartiging
      van de belangen van personen die beroeps- of bedrijfsmatig opnamen of reprodukties daarvan, verkopen, verhuren,
      uitlenen, afleveren of anderszins in het verkeer brengen dan wel voor die doeleinden invoeren, aanbieden of in
      voorraad hebben, kan voornoemde minister bepalen dat door hem aangewezen beroeps- of bedrijfsgenoten verplicht zijn
      hun administratie te voeren op een nader door hem aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel20
  - number: '20.2'
    text: |-
      Hij die de in het vorige lid bedoelde verplichting niet nakomt, wordt gestraft met een geldboete van de tweede
      categorie. Het feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel20
  - number: '21'
    text: |-
      Hij die opzettelijk inbreuk maakt op de rechten, bedoeld in de [artikelen 2][ref1], [6][ref2], [7][ref3] en
      [8][ref4] van deze wet, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005921
        artikel: 7a
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005921
        artikel: '8'
        hoofdstuk: '2'
  - number: '22'
    text: |-
      Hij, die opzettelijk een opname of een reproduktie daarvan waarvan hij weet dat inbreuk wordt gemaakt op de
      rechten, bedoeld in de [artikelen 2][ref1], [6][ref2], [7][ref3] en [8][ref4] van deze wet,


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005921
        artikel: 7a
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005921
        artikel: '8'
        hoofdstuk: '2'
  - number: 22.a
    text: uitzendt, heruitzendt of op een andere wijze openbaar maakt;
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel22
  - number: 22.b
    text: openlijk ter verspreiding aanbiedt;
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel22
  - number: 22.c
    text: ter reproduktie of ter verspreiding voorhanden heeft;
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel22
  - number: 22.d
    text: invoert, doorvoert, uitvoert; of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel22
  - number: 22.e
    text: bewaart uit winstbejag,
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel22
  - number: '23'
    text: |-
      Hij, die van het plegen van de misdrijven als bedoeld in de [artikelen 21][ref1] en [22][ref2], zijn beroep maakt
      of het plegen van deze misdrijven als bedrijf uitoefent, wordt gestraft met gevangenisstraf van ten hoogste vier
      jaar of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel22
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '21'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '22'
        hoofdstuk: '4'
  - number: '24'
    text: |-
      Hij, die een opname of een reproduktie daarvan waarvan hij redelijkerwijs kan vermoeden dat inbreuk wordt gemaakt
      op de rechten, bedoeld in de [artikelen 2][ref1], [6][ref2], [7][ref3] en [8][ref4] van deze wet,


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005921
        artikel: 7a
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005921
        artikel: '8'
        hoofdstuk: '2'
  - number: 24.a
    text: uitzendt, heruitzendt of op een andere wijze openbaar maakt;
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel24
  - number: 24.b
    text: openlijk ter verspreiding aanbiedt;
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel24
  - number: 24.c
    text: ter reproduktie of ter verspreiding voorhanden heeft;
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel24
  - number: 24.d
    text: invoert, doorvoert, uitvoert; of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel24
  - number: 24.e
    text: bewaart uit winstbejag,
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel24
  - number: '25'
    text: |-
      Hij die opzettelijk in een uitvoering, in de benaming daarvan of in de aanduiding van de uitvoerende kunstenaar
      wederrechtelijk enige wijziging aanbrengt, of wel een zodanige uitvoering op enige andere wijze, welke nadeel zou
      kunnen toebrengen aan de eer of de naam van de uitvoerende kunstenaar of aan zijn waarde in deze hoedanigheid,
      aantast, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel25
  - number: '26'
    text: |-
      De feiten strafbaar gesteld in de [artikelen 21][ref1], [22][ref2], [23][ref3], [24][ref4] en [25][ref5] zijn
      misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0005921#Artikel25
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '21'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '22'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0005921
        artikel: '23'
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0005921
        artikel: '24'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0005921
        artikel: '25'
        hoofdstuk: '4'
  - number: '27'
    text: |-
      Hij die in een schriftelijke aanvrage of opgave aan de in [artikel 15, eerste lid][ref1], bedoelde rechtspersoon,
      dienende voor de vaststelling van het op grond van [artikel 7][ref2] van deze wet verschuldigde, opzettelijk een
      onjuiste of onvolledige mededeling doet, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van
      de derde categorie. Het feit wordt beschouwd als een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel7
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '15'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '7'
        hoofdstuk: '2'
  - number: 27a
    text: |-
      Degene die een opgave, bedoeld in [artikel 15][ref1], opzettelijk nalaat dan wel in een dergelijke opgave
      opzettelijk een onjuiste of onvolledige mededeling doet, wordt gestraft met hechtenis van ten hoogste drie maanden
      of geldboete van de derde categorie. Het feit wordt beschouwd als een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel15d
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 15d
        hoofdstuk: '3'
  - number: '28'
    text: |-
      De opsporingsambtenaren zijn bevoegd, tot het opsporen van de bij deze wet strafbaar gestelde feiten en ter
      inbeslagneming van hetgeen daarvoor vatbaar is, elke plaats te betreden. Indien hun de toegang wordt geweigerd,
      verschaffen zij zich die desnoods met inroeping van de sterke arm. In woningen treden zij tegen de wil van de
      bewoner niet binnen dan op vertoon van een schriftelijke bijzondere last van of in tegenwoordigheid van een
      officier van justitie of een hulpofficier van justitie. Van dit binnentreden wordt door hen binnen vierentwintig
      uren procesverbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel28
  - number: '29'
    text: |-
      De opsporingsambtenaren kunnen te allen tijde tot het opsporen van bij deze wet strafbaar gestelde feiten
      inzage vorderen van alle bescheiden of andere gegevensdragers, waarvan inzage voor de vervulling van hun taak
      redelijkerwijze nodig is, bij hen die in de uitoefening van hun beroep of bedrijf opnamen of reprodukties daarvan,
      waarop de in de [artikelen 2][ref1], [6][ref2], [7][ref3] en [8][ref4] bedoelde rechten betrekking hebben,
      reproduceren, verkopen, afleveren of anderszins in het verkeer brengen dan wel voor die doeleinden invoeren,
      doorvoeren, uitvoeren aanbieden of in voorraad hebben of openbaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005921
        artikel: 7a
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005921
        artikel: '8'
        hoofdstuk: '2'
  - number: '30.1'
    text: |-
      De door de strafrechter verbeurd verklaarde reprodukties worden vernietigd; echter kan de rechter bij het vonnis
      bepalen, dat zij aan de rechthebbende zullen worden afgegeven, indien deze zich daartoe ter griffie aanmeldt binnen
      een maand nadat de uitspraak in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel30
  - number: '30.2'
    text: |-
      Door de afgifte gaat de eigendom van de reprodukties op de rechthebbende over. De rechter zal kunnen gelasten, dat
      die afgifte niet zal geschieden dan tegen een bepaalde door de rechthebbende te betalen vergoeding, welke ten bate
      komt van de Staat.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel30
  - number: '31'
    text: |-
      Een ieder, die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijk karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel31
  - number: '32.1'
    text: 'De voorgaande artikelen zijn op de uitvoerende kunstenaar van toepassing ingeval:'
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.1.a
    text: |-
      hij onderdaan is van een van de lid-staten van de Europese Unie of van een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte van 2 mei 1992 of zijn gewone verblijfplaats in Nederland heeft dan
      wel onderdaan is van een Staat die partij is bij het Verdrag van Rome inzake de bescherming van uitvoerende
      kunstenaars, producenten van fonogrammen en omroeporganisaties; of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.1.b
    text: |-
      zijn uitvoering in Nederland plaats had dan wel in een Staat die partij is bij het Verdrag van Rome inzake de
      bescherming van uitvoerende kunstenaars, producenten van fonogrammen en omroeporganisaties; of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.1.c
    text: zijn uitvoering is opgenomen op een fonogram als bedoeld in het tweede lid van dit artikel; of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.1.d
    text: |-
      zijn uitvoering, die niet is opgenomen op een fonogram, is openbaar gemaakt door middel van een programma van een
      omroeporganisatie als bedoeld in het zesde lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: '32.2'
    text: 'De voorgaande artikelen zijn op de producenten van fonogrammen van toepassing ingeval:'
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.2.a
    text: |-
      hij onderdaan is van of rechtspersoon is opgericht naar het recht van een van de lid-staten van de Europese Unie of
      van een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 dan wel
      in Nederland zijn zetel of gewone verblijfplaats heeft of onderdaan is van dan wel rechtspersoon is opgericht naar
      het recht van een Staat die partij is bij het in het eerste lid, onder *a*, bedoelde Verdrag van Rome of bij de
      Overeenkomst ter bescherming van producenten van fonogrammen tegen het ongeoorloofd kopiëren van hun fonogrammen;
      of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.2.b
    text: |-
      het opnemen in Nederland plaats had dan wel in een Staat die partij is bij het in het eerste lid, onder *a*,
      bedoelde Verdrag van Rome of bij de Overeenkomst ter bescherming van producenten van fonogrammen tegen het
      ongeoorloofd kopiëren van hun fonogrammen; of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.2.c
    text: |-
      het fonogram voor de eerste maal, of binnen dertig dagen na de eerste uitgave in een ander land, in het verkeer
      is gebracht in Nederland dan wel in een Staat die partij is bij het in het eerste lid, onder *a*, bedoelde Verdrag
      van Rome of bij de Overeenkomst ter bescherming van producenten van fonogrammen tegen het ongeoorloofd kopiëren van
      hun fonogrammen.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: '32.3'
    text: |-
      Van het in het verkeer brengen als bedoeld in het tweede lid is sprake, wanneer van op rechtmatige wijze
      vervaardigde reprodukties van een fonogram een zodanig aanbod van exemplaren daarvan heeft plaatsgevonden dat
      daardoor wordt voorzien in de redelijke behoeften van het publiek.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: '32.4'
    text: |-
      Met betrekking tot fonogrammen, waarvan de producent onderdaan is van dan wel rechtspersoon is opgericht
      naar het recht van een Staat die partij is bij het in het eerste lid, onder *a*, bedoelde Verdrag van Rome is
      [artikel 7][ref1] slechts van toepassing in de mate waarin en voor de duur waarvoor deze Staat bescherming verleent
      ten aanzien van fonogrammen waarvan de producent Nederlander is dan wel zijn zetel heeft in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel7
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '7'
        hoofdstuk: '2'
  - number: '32.5'
    text: |-
      Het recht op een billijke vergoeding, als bedoeld in [artikel 7][ref1], geldt niet voor fonogrammen waarvan de
      producent geen onderdaan is van noch rechtspersoon is opgericht naar het recht van een Staat die partij is bij het
      in het eerste lid, onder *a*, bedoelde Verdrag van Rome.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel7
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '7'
        hoofdstuk: '2'
  - number: '32.6'
    text: 'De voorgaande artikelen zijn op omroeporganisaties van toepassing ingeval:'
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.6.a
    text: |-
      het hoofdkantoor van de omroeporganisatie is gevestigd in een van de lid-staten van de Europese Unie of in een
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 dan wel in een
      Staat die partij is bij het in het eerste lid, onder *a*, bedoelde Verdrag van Rome; of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.6.b
    text: |-
      de uitzending van het programma heeft plaatsgevonden in Nederland dan wel in een Staat die partij is bij het in het
      eerste lid onder *a*, bedoelde Verdrag van Rome; of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: '32.7'
    text: |-
      Het bepaalde in het vierde en vijfde lid van dit artikel is niet van toepassing op fonogrammen waarvan de producent
      onderdaan is van of rechtspersoon is opgericht naar het recht van een van de lid-staten van de Europese Unie of van
      een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: '32.8'
    text: 'De voorgaande artikelen zijn op de producent van de eerste vastleggingen van films van toepassing ingeval:'
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.8.a
    text: |-
      hij onderdaan is van of rechtspersoon is opgericht naar het recht van een van de lid-staten van de Europese Unie of
      van een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 dan wel
      in Nederland zijn zetel of gewone verblijfplaats heeft; of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.8.b
    text: de vastlegging in Nederland plaats had; of
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32.8.c
    text: |-
      de vastlegging voor de eerste maal, of binnen dertig dagen na de eerste uitgave in een ander land, in het verkeer
      is gebracht in Nederland.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32
  - number: 32a.1
    text: |-
      De voorgaande artikelen zijn van toepassing op het uitzenden van een uitvoering, fonogram, of programma of een
      reproduktie daarvan door middel van een satelliet, indien in Nederland onder controle en verantwoordelijkheid
      van een omroeporganisatie de programmadragende signalen voor ontvangst door het publiek zijn ingevoerd in een
      ononderbroken mededelingenketen die naar de satelliet en terug naar de aarde loopt. Indien de programmadragende
      signalen in gecodeerde vorm worden uitgezonden, is er sprake van een uitzending, bedoeld in de eerste zin, indien
      de middelen voor het decoderen van de uitzending door of met toestemming van de omroeporganisatie ter beschikking
      van het publiek worden gesteld.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32a
  - number: 32a.2
    text: 'De voorgaande artikelen zijn voorts van toepassing op het uitzenden, bedoeld in het eerste lid, indien:'
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32a
  - number: 32a.2.a
    text: |-
      de handeling, bedoeld in het eerste lid, plaatsvindt in een land dat niet tot de Europese Unie behoort of dat niet
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992;
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32a
  - number: 32a.2.b
    text: |-
      het land waar de handeling, bedoeld in het eerste lid, plaatsvindt niet het niveau van bescherming biedt, voorzien
      in hoofdstuk II van [richtlijn nr. 93/83/EEG](31993L0083) van de Raad van de Europese Gemeenschappen van 27
      september 1993 tot coördinatie van bepaalde voorschriften betreffende het auteursrecht en naburige rechten op het
      gebied van de satellietomroep en de doorgifte via de kabel (*PbEG* L 248); en
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32a
  - number: 32a.2.c
    text: |-
      hetzij de programmadragende signalen naar de satelliet worden doorgezonden vanuit een grondstation in Nederland,
      hetzij een omroeporganisatie die in Nederland haar hoofdvestiging heeft, opdracht heeft gegeven tot de uitzending
      en geen gebruik wordt gemaakt van een grondstation in een lid-staat van de Europese Unie of in een staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel32a
  - number: '33'
    text: |-
      Ten aanzien van uitvoeringen, fonogrammen of programma's, die voor het tijdstip van in werking treden van deze wet
      hebben plaatsgevonden, zijn vervaardigd onderscheidenlijk zijn uitgezonden, zijn de door deze wet verleende rechten
      van toepassing voor zover het gedragingen betreft die plaatsvinden na het tijdstip van in werking treden van deze
      wet.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel33
  - number: 33a.1
    text: |-
      Uitvoerende kunstenaars die onderdaan zijn van een staat, niet zijnde een lid-staat van de Europese Unie of een
      staat die partij is bij de overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992, die geen partij
      is bij het Verdrag van Rome inzake de bescherming van uitvoerende kunstenaars, producenten van fonogrammen en
      omroeporganisaties, en omroeporganisaties, waarvan het hoofdkantoor is gevestigd in een staat als hiervoor bedoeld,
      kunnen geen beroep doen op de door deze wet verleende rechten, indien de duur daarvan ingevolge de nationale
      wetgeving reeds is verstreken.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel33a
  - number: 33a.2
    text: Het in het eerste lid bepaalde is eveneens van toepassing op
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel33a
  - number: 33a.2.a
    text: |-
      producenten van fonogrammen die onderdaan zijn van een staat, niet zijnde ene lid-staat van de Europese Unie of
      een staat die partij is bij de overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992, die geen
      partij is bij het in het eerste lid bedoelde Verdrag of bij de Overeenkomst ter bescherming van producenten van
      fonogrammen tegen het ongeoorloofd kopiëren van hun fonogrammen;
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel33a
  - number: 33a.2.b
    text: |-
      producenten van eerste vastlegging van films die onderdaan zijn van een staat, niet zijnde een lid-staat van
      de Europese Unie of een staat die partij is bij de overeenkomst betreffende de Europese Economische Ruimte
      van 2 mei 1992, waarvan de nationale wetgeving in een kortere beschermingstermijn voorziet dan die bedoeld in
      [artikel 12, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel12
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel33a
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '12'
        hoofdstuk: '2'
  - number: '34'
    text: |-
      De voorgaande artikelen van deze wet laten een beroep op [artikel 162 van Boek 6 van het Burgerlijk Wetboek][ref1]
      onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel162
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '162'
  - number: '35.1'
    text: |-
      De in deze wet voorziene beschermingstermijnen zijn met ingang van het tijdstip van inwerkingtreding van dit
      artikel van toepassing op uitvoeringen, fonogrammen, eerste vastleggingen van films of programma's, die op 1 juli
      1995 in ten minste één lid-staat van de Europese Unie of een staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte van 2 mei 1992 beschermd worden door de nationale wetgeving op het gebied van
      de naburige rechten of die op die datum voldoen aan de beschermingscriteria van de Richtlijn van de Raad van de
      Europese Gemeenschappen van 19 november 1992, *PbEG* 1992, L 346/61, betreffende het verhuurrecht, het uitleenrecht
      en bepaalde naburige rechten op het gebied van intellectuele eigendom.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel35
  - number: '35.2'
    text: |-
      Deze wet laat vóór inwerkingtreding van dit artikel rechtmatig verrichte exploitatiehandelingen alsmede vóór dat
      tijdstip verworven rechten onverlet.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel35
  - number: '35.3'
    text: |-
      Hij die met betrekking tot een uitvoering, fonogram, eerste vastlegging van een film of een programma, waarvan de
      beschermingstermijn vóór inwerkingtreding van dit artikel was verstreken en waarop met ingang van inwerkingtreding
      van dit artikel deze wet weer van toepassing is, vóór 24 november 1993 rechtmatig exploitatiehandelingen heeft
      verricht, is bevoegd deze exploitatiehandelingen met ingang van inwerkingtreding van dit artikel voort te zetten.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel35
  - number: '36'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel36
  - number: '37'
    text: Deze wet kan worden aangehaald als de Wet op de naburige rechten.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel37
