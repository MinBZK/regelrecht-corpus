  - number: 10.b
    text: |-
      het citeren in een aankondiging, beoordeling, polemiek of wetenschappelijke verhandeling of een uiting met
      een vergelijkbaar doel; [artikel 15a, eerste lid, onder 1°, 2° en 4°, van de Auteurswet 1912][ref1] is van
      overeenkomstige toepassing; ten aanzien van een uitvoering dient [artikel 5][ref2] in acht te worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel5
