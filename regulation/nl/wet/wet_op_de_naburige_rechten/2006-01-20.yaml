        artikel: '8'
        hoofdstuk: '2'
  - number: 9a
    text: |-
      De rechten, bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3] en [8][ref4], zijn niet van toepassing
      op een door of vanwege de openbare macht in het verkeer gebrachte opname van een uitvoering, fonogram, eerste
      vastlegging van een film, opnamen van een programma, en een reproductie daarvan en openbaar gemaakte uitvoering,
      opname van een uitvoering, fonogram, eerste vastlegging van een film, programma, opname van een programma, en een
      reproductie daarvan, waarvan de openbare macht de rechthebbende is, tenzij de rechten hetzij in het algemeen bij
      de wet, besluit of verordening, hetzij in een bepaald geval blijkens mededeling op of in het op grond van deze
      wet beschermde materiaal zelf dan wel bij het in het verkeer brengen of openbaar maken daarvan uitdrukkelijk zijn
      voorbehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel8
