  - number: '12.1'
    text: |-
      De rechten van uitvoerende kunstenaars vervallen door verloop van 50 jaren te rekenen van de 1e januari van het
      jaar, volgend op dat waarin de uitvoering heeft plaatsgehad. Indien echter binnen deze termijn een opname van
      de uitvoering op rechtmatige wijze in het verkeer is gebracht of is openbaar gemaakt, vervallen de rechten door
      verloop van 50 jaren te rekenen van de 1e januari van het jaar, volgend op dat waarin de opname voor het eerst op
      rechtmatige wijze in het verkeer is gebracht of, indien dit eerder valt, is openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel12
  - number: '12.2'
    text: |-
      De rechten van producenten van fonogrammen vervallen door verloop van 50 jaren te rekenen van de 1e januari van
      het jaar, volgend op dat waarin het fonogram is vervaardigd. Indien binnen deze termijn het fonogram op rechtmatige
      wijze in het verkeer is gebracht, vervallen de rechten door verloop van 50 jaren te rekenen van de 1e januari
      van het jaar, volgende op dat waarin het fonogram voor het eerst op rechtmatige wijze in het verkeer is gebracht.
      Indien het fonogram binnen de in de vorige zin bedoelde termijn niet op rechtmatige wijze in het verkeer is
      gebracht maar wel openbaar is gemaakt, vervallen de rechten 50 jaar na de datum waarop het fonogram voor het eerst
      is openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel12
  - number: '12.3'
    text: |-
      De rechten van omroeporganisaties vervallen door verloop van 50 jaren te rekenen van de 1e januari van het jaar,
      volgend op dat waarin een programma voor het eerst is uitgezonden, ongeacht welke technische hulpmiddelen daarbij
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel12
  - number: '12.4'
    text: |-
      De rechten van producenten van de eerste vastlegging van een film vervallen door verloop van 50 jaren te rekenen
      van de 1e januari van het jaar, volgend op dat waarin de eerste vastlegging heeft plaatsgehad. Indien echter
      binnen deze termijn de eerste vastlegging op rechtmatige wijze in het verkeer is gebracht of is openbaar gemaakt,
      vervallen de rechten door verloop van 50 jaren te rekenen van de 1e januari van het jaar, volgend op dat waarin de
      eerste vastlegging voor het eerst op rechtmatige wijze in het verkeer is gebracht, of indien dit eerder valt, is
      openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel12
  - number: '13'
    text: |-
      De in [artikel 2][ref1] bedoelde rechten kunnen, ingeval het een gezamenlijke uitvoering door zes of meer personen
      betreft, uitsluitend worden uitgeoefend door een door de aan die uitvoering deelnemende uitvoerende kunstenaars bij
      meerderheid gekozen vertegenwoordiger. Het bepaalde in de eerste zin van dit artikel is niet van toepassing op de
      aan de gezamenlijke uitvoering meewerkende solist, regisseur en dirigent. De handhaving van de in [artikel 2][ref2]
      bedoelde rechten kan, ingeval het een gezamenlijke uitvoering betreft, door een ieder van de aan die uitvoering
      deelnemende uitvoerende kunstenaars geschieden, tenzij anders is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel2
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      Indien aan twee of meer producenten van fonogrammen of van eerste vastleggingen van films of omroeporganisaties een
      gemeenschappelijk recht ten aanzien van eenzelfde fonogram, eerste vastlegging van een film of programma toekomt,
      kan de handhaving van dit recht door ieder van hen geschieden, tenzij anders is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel14
  - number: 14a.1
    text: |-
      Het recht van de uitvoerende kunstenaar en de producent van fonogrammen om toestemming te verlenen voor het
      ongewijzigd en onverkort heruitzenden van een uitvoering onderscheidenlijk een fonogram of een reproduktie
      daarvan door middel van een omroepnetwerk als bedoeld in [artikel 1, onderdeel q, van de Mediawet][ref1], kan
      uitsluitend worden uitgeoefend door rechtspersonen die zich ingevolge hun statuten ten doel stellen de belangen van
      rechthebbenden door de uitoefening van het aan hen toekomende hiervoor bedoelde recht te behartigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004149
        artikel: '1'
  - number: 14a.2
    text: |-
      De in het eerste lid bedoelde rechtspersonen zijn ook bevoegd de belangen te behartigen van rechthebbenden die
      daartoe geen opdracht hebben gegeven, indien het betreft de uitoefening van dezelfde rechten als in de statuten
      vermeld. Indien meerdere rechtspersonen zich blijkens de statuten de behartiging van de belangen van dezelfde
      categorie rechthebbenden ten doel stellen, kan de rechthebbende, bedoeld in de eerste zin van dit lid, een van hen
      aanwijzen als bevoegd tot de behartiging van zijn belangen.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel14a
  - number: 14a.3
    text: |-
      Voor rechthebbenden die geen opdracht hebben gegeven als bedoeld in het tweede lid, gelden de rechten en
      verplichtingen die voortvloeien uit een overeenkomst die een tot de uitoefening van dezelfde rechten bevoegde
      rechtspersoon heeft gesloten met betrekking tot de in het eerste lid bedoelde uitzending, onverkort.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel14a
  - number: 14a.4
    text: |-
      Vorderingen jegens de in het eerste lid bedoelde rechtspersoon terzake van de door deze geïnde gelden vervallen
      door verloop van drie jaren na de aanvang van de dag volgende op die waarop de in het eerste lid bedoelde
      heruitzending heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel14a
  - number: 14a.5
    text: |-
      Dit artikel is niet van toepassing op rechten als bedoeld in het eerste lid die toekomen aan een omroeporganisatie
      met betrekking tot haar eigen uitzendingen.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel14a
  - number: 14b
    text: |-
      Partijen zijn verplicht de onderhandelingen over de toestemming voor het heruitzenden, bedoeld in
      [artikel 14][ref1], te goeder trouw te voeren en niet zonder geldige reden te verhinderen of te belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel14a
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 14a
        hoofdstuk: '3'
  - number: 14c.1
    text: |-
      Indien over het heruitzenden, bedoeld in [artikel 14][ref1], geen overeenstemming kan worden bereikt, kan iedere
      partij een beroep doen op een of meer bemiddelaars. De bemiddelaars worden zodanig geselecteerd dat over hun
      onafhankelijkheid en onpartijdigheid in redelijkheid geen twijfel kan bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel14a
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel14c
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 14a
        hoofdstuk: '3'
  - number: 14c.2
    text: |-
      De bemiddelaars verlenen bijstand bij het voeren van de onderhandelingen en zijn bevoegd aan de partijen
      voorstellen te betekenen. Tot drie maanden na de dag van ontvangst van de voorstellen van de bemiddelaars kan een
      partij zijn bezwaren tegen deze voorstellen betekenen aan de andere partij. De voorstellen van de bemiddelaars
      binden de partijen, tenzij binnen de in de vorige zin bedoelde termijn door een van hen bezwaren zijn betekend. De
      voorstellen en de bezwaren worden aan de partijen betekend overeenkomstig het bepaalde in de [zesde afdeling van de
      eerste titel van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel14c
  - number: 14d
    text: |-
      De [artikelen 14b][ref1] en [14c][ref2] zijn van overeenkomstige toepassing op het ongewijzigde en onverkorte
      heruitzenden van het programma van een omroeporganisatie door middel van een omroepnetwerk als bedoeld in
      [artikel 1, onderdeel q, van de Mediawet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel14b
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel14c
      [ref3]: https://wetten.overheid.nl/BWBR0004149#Artikel1
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel14d
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 14b
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: 14c
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0004149
        artikel: '1'
  - number: '15.1'
    text: |-
      De betaling van de in [artikel 7][ref1] bedoelde billijke vergoeding dient te geschieden aan een door Onze Minister
      van Justitie aan te wijzen representatieve rechtspersoon die met uitsluiting van anderen met de inning en verdeling
      van deze vergoeding is belast. Ten aanzien van de vaststelling van de hoogte van de vergoeding en de inning daarvan
      alsmede de uitoefening van het uitsluitend recht vertegenwoordigt de in de vorige zin bedoelde rechtspersoon de
      rechthebbenden in en buiten rechte.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel7
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '7'
        hoofdstuk: '2'
  - number: '15.2'
    text: |-
      De in het eerste lid bedoelde rechtspersoon staat onder toezicht van het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014779
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014779
  - number: '15.3'
    text: |-
      De verdeling van de geïnde vergoedingen geschiedt overeenkomstig een reglement dat is opgesteld door de
      rechtspersoon, bedoeld in het eerste lid, en dat is goedgekeurd door het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014779
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0014779
  - number: 15a.1
    text: |-
      De betaling van de in de [artikelen 2][ref1], [6][ref2], [7a][ref3] en [8][ref4] bedoelde vergoeding dient te
      geschieden aan een door Onze Minister van Justitie in overeenstemming met Onze Minister van Onderwijs, Cultuur en
      Wetenschappen aan te wijzen naar hun oordeel representatieve rechtspersoon, die met uitsluiting van anderen belast
      is met de inning en de verdeling van deze vergoeding. In aangelegenheden betreffende de vaststelling van de hoogte
      van de vergoeding en de inning daarvan alsmede de uitoefening van het uitsluitende recht vertegenwoordigt de in de
      vorige zin bedoelde rechtspersoon de rechthebbenden in en buiten rechte.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel15a
    references:
