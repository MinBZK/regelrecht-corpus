        artikel: '8'
        hoofdstuk: '2'
  - number: 15c
    text: |-
      Geschillen met betrekking tot de in de [artikelen 2, derde lid][ref1], [6, derde lid][ref2], [7][ref3], en
      [8, derde lid][ref4], bedoelde vergoeding worden in eerste aanleg bij uitsluiting beslist door de rechtbank te
      's-Gravenhage.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel15c
    references:
