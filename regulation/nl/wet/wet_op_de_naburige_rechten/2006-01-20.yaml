        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005921
        artikel: '8'
        hoofdstuk: '2'
  - number: 15a.2
    text: |-
      De in het eerste lid bedoelde rechtspersoon staat onder toezicht van het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014779
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0014779
  - number: 15a.3
    text: |-
      De verdeling van de geïnde vergoedingen geschiedt overeenkomstig een reglement, dat is opgesteld door de
      rechtspersoon, bedoeld in het eerste lid, en dat is goedgekeurd door het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014779
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0014779
  - number: 15b
    text: |-
      De hoogte van de in de [artikelen 2, derde lid][ref1], [6, derde lid][ref2], [7][ref3], en [8, derde lid][ref4],
      bedoelde vergoeding wordt vastgesteld door een door Onze Minister van Justitie in overeenstemming met Onze Minister
      van Onderwijs, Cultuur en Wetenschappen aan te wijzen stichting waarvan het bestuur zodanig is samengesteld dat
      de belangen van rechthebbenden en de ingevolge voornoemde artikelen betalingsplichtigen op evenwichtige wijze
      worden behartigd. De voorzitter van het bestuur van deze stichting wordt benoemd door Onze Minister van Justitie
      in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen. Het aantal bestuursleden van deze
      stichting dient oneven te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel15b
    references:
      - id: ref1
