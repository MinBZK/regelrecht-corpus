  - number: '16.1'
    text: |-
      Naast schadevergoeding kan de rechthebbende, bedoeld in de [artikelen 2][ref1], [6][ref2], [7][ref3] en
      [8][ref4], vorderen dat degene die inbreuk op zijn recht heeft gemaakt wordt veroordeeld de door deze tengevolge
      van de inbreuk genoten winst af te dragen en dienaangaande rekening en verantwoording af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005921
        artikel: 7a
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005921
        artikel: '8'
        hoofdstuk: '2'
  - number: '16.2'
    text: |-
      De rechthebbende kan de in het eerste lid bedoelde vorderingen of een van deze ook namens of mede namens een
      licentienemer instellen, onverminderd de bevoegdheid van deze laatste in een al of niet namens hem of mede namens
      hem door de rechthebbende ingesteld geding tussen te komen om rechtstreeks de door hem geleden schade vergoed
      te krijgen of om zich een evenredig deel van de door de gedaagde af te dragen winst te doen toewijzen. De in het
      eerste lid bedoelde vorderingen of een van deze kan een licentienemer slechts instellen als hij de bevoegdheid
      daartoe heeft bedongen.
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel16
  - number: '17.1'
    text: |-
      De rechten, bedoeld in de [artikelen 2][ref1], [5][ref2], [6][ref3], [7][ref4] en [8][ref5], geven de
      bevoegdheid om opnamen of reprodukties daarvan die in strijd met die rechten zijn openbaar gemaakt alsmede niet
      geoorloofde reprodukties, als zijn eigendom op te eisen dan wel daarvan de vernietiging of onbruikbaarmaking
      te vorderen. Gelijke bevoegdheid bestaat ten aanzien van roerende zaken die geen registergoederen zijn en
      die rechtstreeks hebben gediend tot de vervaardiging van de in de eerste zin bedoelde opnamen of reprodukties
      alsmede ten aanzien van het bedrag der toegangsgelden, betaald voor het bijwonen van een uitvoering en andere
      gelden waarvan aannemelijk is dat zij zijn verkregen door of als gevolg van inbreuk op een van de in de
      [artikelen 2][ref6], [5][ref7], [6][ref8], [7][ref9] en [8][ref10] bedoelde rechten.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref5]: https://wetten.overheid.nl/BWBR0005921#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0005921#Artikel5
      [ref8]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref9]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref10]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel17
    references:
