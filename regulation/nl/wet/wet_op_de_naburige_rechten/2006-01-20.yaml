      natuurlijke persoon die de reproductie vervaardigt; de [artikelen 16c, tweede tot en met zevende lid][ref1],
      [16d tot en met 16ga][ref2], [17d][ref3] en [35c van de Auteurswet 1912][ref4] zijn van overeenkomstige toepassing;


