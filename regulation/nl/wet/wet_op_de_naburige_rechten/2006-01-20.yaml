  - number: 10.c
    text: |-
      het door middel van een besloten netwerk beschikbaar stellen van een opname van een uitvoering, fonogram, eerste
      vastlegging van een film of opname van een programma, of een reproductie daarvan, dat onderdeel uitmaakt van
      verzamelingen van voor het publiek toegankelijke bibliotheken en musea of archieven die niet het behalen van een
      direct of indirect economisch of commercieel voordeel nastreven, door middel van daarvoor bestemde terminals in de
      gebouwen van die instellingen aan individuele leden van het publiek voor onderzoek of privé-studie, tenzij anders
      is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel10
  - number: 10.d
    text: |-
      de verslaggeving in het openbaar in een film-, radio- of televisiereportage over actuele gebeurtenissen,
      voorzover zulks voor het behoorlijk weergeven van de actuele gebeurtenis die het onderwerp van de
      reportage uitmaakt gerechtvaardigd is en mits slechts gebruik wordt gemaakt van korte fragmenten;
      [artikel 16a van de Auteurswet 1912][ref1] is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16a
    url: https://wetten.overheid.nl/BWBR0005921/2006-01-20#Artikel10
