        hoofdstuk: '2'
  - number: 27a
    text: |-
      Degene die een opgave, bedoeld in [artikel 15][ref1], opzettelijk nalaat dan wel in een dergelijke opgave
      opzettelijk een onjuiste of onvolledige mededeling doet, wordt gestraft met hechtenis van ten hoogste drie maanden
      of geldboete van de derde categorie. Het feit wordt beschouwd als een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel15d
    url: https://wetten.overheid.nl/BWBR0005921/2017-09-01#Artikel27a
    references:
