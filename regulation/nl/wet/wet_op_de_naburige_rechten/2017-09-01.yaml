    text: |-
      1 Op de uitvoering van een uitvoerende kunstenaar, die bestemd is als bijdrage voor de
      totstandkoming van een filmwerk als bedoeld in [artikel 45a van de Auteurswet][ref1], zijn de
      [artikelen 45a tot en met 45g van voornoemde wet][ref2] van overeenkomstige toepassing.

      2 Op een uitvoerend kunstenaar als bedoeld in het eerste lid die in het filmwerk een hoofdrol vervult, is
      [artikel 45d, tweede lid tot en met zesde lid, van de Auteurswet][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel45a
