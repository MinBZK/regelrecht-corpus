  - number: 9a
    text: |-
      De in [artikel 25e, derde lid van de Auteurswet][ref1] genoemde termijn bedraagt ten minste één jaar indien:

      a. de in [artikel 9, eerste lid][ref2] bedoelde overdracht behelst een overdracht door een uitvoerende kunstenaar
      van zijn rechten op de uitvoering van een muziekwerk aan de producent van een fonogram, en

      b. sinds het fonogram is openbaar gemaakt dan wel op rechtmatige wijze in het verkeer is gebracht ten minste 50
      jaar zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25e
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel9
    url: https://wetten.overheid.nl/BWBR0005921/2017-09-01#Artikel9a
