  - number: '10'
    text: |-
      Als inbreuk op de rechten, bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3] en [8][ref4], wordt niet
      beschouwd:

      a. het overnemen van op grond van deze wet beschermd materiaal over actuele economische, politieke,
      godsdienstige of levensbeschouwelijke onderwerpen, die in een radio- of televisieprogramma of ander
      medium dat eenzelfde functie vervult, zijn openbaar gemaakt of in het verkeer gebracht, indien het
      overnemen geschiedt in een radio- of televisieprogramma of ander medium dat eenzelfde functie vervult;
      [artikel 15, eerste lid, onder 3° en 4°, van de Auteurswet][ref5] is van overeenkomstige toepassing; ten aanzien
      van een uitvoering dient [artikel 5][ref6] in acht te worden genomen;

      b. het citeren in een aankondiging, beoordeling, polemiek of wetenschappelijke verhandeling of een uiting
      met een vergelijkbaar doel; [artikel 15a, eerste lid, onder 1°, 2° en 4°, van de Auteurswet][ref7] is van
      overeenkomstige toepassing; ten aanzien van een uitvoering dient [artikel 5][ref8] in acht te worden genomen;

      c. het door middel van een besloten netwerk beschikbaar stellen van een opname van een uitvoering, fonogram,
      eerste vastlegging van een film of opname van een programma, of een reproductie daarvan, dat onderdeel uitmaakt van
      verzamelingen van voor het publiek toegankelijke bibliotheken en musea of archieven die niet het behalen van een
      direct of indirect economisch of commercieel voordeel nastreven, door middel van daarvoor bestemde terminals in de
      gebouwen van die instellingen aan individuele leden van het publiek voor onderzoek of privé-studie, tenzij anders
      is overeengekomen;

      d. de verslaggeving in het openbaar in een film-, radio- of televisiereportage over actuele gebeurtenissen,
      voorzover zulks voor het behoorlijk weergeven van de actuele gebeurtenis die het onderwerp van de
      reportage uitmaakt gerechtvaardigd is en mits slechts gebruik wordt gemaakt van korte fragmenten;
      [artikel 16a van de Auteurswet][ref9] is van overeenkomstige toepassing;

      e. het reproduceren van op grond van deze wet beschermd materiaal, mits het reproduceren geschiedt zonder
      direct of indirect commercieel oogmerk en uitsluitend dient tot eigen oefening, studie of gebruik van een
      natuurlijke persoon die de reproductie vervaardigt; de [artikelen 16c, tweede tot en met zevende lid][ref10],
      [16d tot en met 16ga][ref11], [17d][ref12] en [35c van de Auteurswet][ref13] zijn van overeenkomstige toepassing;

      f. de reproductie van een opname van een uitvoering, fonogram, eerste vastlegging van een film of opname van een
      programma, of een reproductie daarvan, door voor het publiek toegankelijke bibliotheken, onderwijsinstellingen
      of musea of door archieven die niet het behalen van een direct of indirect economisch of commercieel voordeel
      nastreven, indien het reproduceren geschiedt met als enig doel een opname van een uitvoering, fonogram, eerste
      vastlegging van een film of opname van een programma, of een reproductie daarvan, voor de instelling te behouden
      bij aantoonbare dreiging van verval dan wel raadpleegbaar te houden als de technologie waarmee het toegankelijk
      kan worden gemaakt in onbruik raakt; [artikel 16n, tweede lid, onder 1° en 2°, van de Auteurswet][ref14] is van
      overeenkomstige toepassing; ten aanzien van een uitvoering dient [artikel 5][ref15] in acht te worden genomen;

      g. de tijdelijke vastlegging door een omroeporganisatie die bevoegd is tot de openbaarmaking door uitzending van
      een radio- of televisieprogramma via radio of televisie, of een ander medium dat eenzelfde functie vervult, met
      haar eigen middelen en uitsluitend voor uitzending van haar eigen programma’s; ten aanzien van een uitvoering dient
      [artikel 5][ref16] in acht te worden genomen; [artikel 17b, eerste en derde lid, van de Auteurswet][ref17] is van
      overeenkomstige toepassing;

      h. de incidentele verwerking van op grond van deze wet beschermd materiaal als onderdeel van ondergeschikte
      betekenis in ander materiaal;

      i. de reproductie, het openbaar maken of het in het verkeer brengen van op grond van deze wet beschermd materiaal
      voor zover dat uitsluitend voor mensen met een handicap bestemd is, met de handicap direct verband houdt, van
      niet commerciële aard is en wegens die handicap noodzakelijk is; de [artikelen 15i, tweede lid][ref18], en
      [16g van de Auteurswet][ref19] zijn van overeenkomstige toepassing;

      j. een karikatuur, parodie of pastiche mits het gebruik in overeenstemming is met hetgeen naar de regels van het
      maatschappelijk verkeer redelijkerwijs geoorloofd is;

      k. het overnemen van op grond van deze wet beschermd materiaal ten behoeve van de opsporing van strafbare feiten,
      de openbare veiligheid of om het goede verloop van een bestuurlijke, parlementaire of gerechtelijke procedure of de
      berichtgeving daarover te waarborgen; en

      l. het reproduceren en het beschikbaar stellen voor het publiek van een voor het eerst in een lidstaat van de
      Europese Unie of in een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte in
      het verkeer gebracht of openbaar gemaakte opname van een uitvoering, fonogram of eerste vastlegging van een film,
      of een reproductie daarvan, deel uitmakende van de verzameling van voor het publiek toegankelijke bibliotheken,
      onderwijsinstellingen en musea, alsmede archieven en instellingen voor cinematografisch of audiovisueel erfgoed die
      niet het behalen van direct of indirect economisch of commercieel voordeel nastreven en publieke media-instellingen
      als bedoeld in [hoofdstuk 2 van de Mediawet 2008][ref20], indien de rechthebbende na een zorgvuldige zoektocht niet
      is geïdentificeerd en opgespoord. De [artikelen 16o tot en met 16q](onbekend) en [17 van de Auteurswet][ref21] zijn
      van overeenkomstige toepassing.


