      1 De betaling van de in [artikel 7][ref1] bedoelde billijke vergoeding dient te geschieden aan een door Onze
      Minister van Justitie aan te wijzen representatieve rechtspersoon die met uitsluiting van anderen met de inning
      en verdeling van deze vergoeding is belast. Ten aanzien van de vaststelling van de hoogte van de vergoeding en
      de inning daarvan alsmede de uitoefening van het uitsluitend recht vertegenwoordigt de in de vorige zin bedoelde
      rechtspersoon de rechthebbenden in en buiten rechte.

      2 De in het eerste lid bedoelde rechtspersoon staat onder toezicht van het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref2].

      3 De verdeling van de geïnde vergoedingen geschiedt overeenkomstig een reglement dat is opgesteld door de
      rechtspersoon, bedoeld in het eerste lid, en dat is goedgekeurd door het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0014779
