        hoofdstuk: '2'
  - number: 9b
    text: |-
      1 Indien de in [artikel 9, eerste lid][ref1] bedoelde overdracht behelst de overdracht van de rechten van
      zijn uitvoering aan de producent van een fonogram, en bij die overdracht een niet-periodieke vergoeding is
      overeengekomen, heeft de uitvoerende kunstenaar, of in het geval van meerdere uitvoerende kunstenaars, de
      uitvoerende kunstenaars gezamenlijk het recht om van die producent een jaarlijkse aanvullende vergoeding te
      ontvangen voor ieder volledig jaar volgend op het 50ste jaar nadat dat fonogram voor het eerst op rechtmatige wijze
      in het verkeer is gebracht, of indien dit eerder valt, is openbaar gemaakt.

      2 De in het vorige lid bedoelde vergoeding bedraagt 20 procent van de inkomsten die de producent van het fonogram
      heeft verkregen met de reproductie, verspreiding en beschikbaarstelling van het fonogram in het jaar voorafgaand
      aan het jaar waarvoor de vergoeding wordt betaald.

      3 Indien de in [artikel 9, eerste lid][ref2] bedoelde overdracht behelst de overdracht van de rechten op de
      vastlegging van zijn uitvoering aan de producent van een fonogram, en bij die overdracht een periodieke vergoeding
      is overeengekomen, wordt die vergoeding vanaf het jaar volgend op het 50ste jaar nadat dat fonogram voor het eerst
      op rechtmatige wijze in het verkeer is gebracht, of indien dit eerder valt, is openbaar gemaakt, uitgekeerd zonder
      dat daarop contractueel bedongen voorschotten of kortingen worden ingehouden.

      4 Van de in de leden 1 tot en met 3 genoemde rechten kan de uitvoerende kunstenaar geen afstand doen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel9
