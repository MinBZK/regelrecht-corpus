  - number: '20'
    text: |-
      1 Op verzoek van een of meer naar het oordeel van de Minister van Justitie representatieve organisaties van
      bedrijfs- of beroepsgenoten, die rechtspersonen met volledige rechtsbevoegdheid zijn en die ten doel hebben de
      behartiging van de belangen van personen die beroeps- of bedrijfsmatig opnamen of reprodukties daarvan, verkopen,
      verhuren, uitlenen, afleveren of anderszins in het verkeer brengen dan wel voor die doeleinden invoeren, aanbieden
      of in voorraad hebben, kan voornoemde minister bepalen dat door hem aangewezen beroeps- of bedrijfsgenoten
      verplicht zijn hun administratie te voeren op een nader door hem aan te geven wijze.

      2 Hij die de in het vorige lid bedoelde verplichting niet nakomt, wordt gestraft met een geldboete van de tweede
      categorie. Het feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0005921/2017-09-01#Artikel20
  - number: '21'
    text: |-
      Hij die opzettelijk inbreuk maakt op de rechten, bedoeld in de [artikelen 2][ref1], [6][ref2], [7][ref3] en
      [8][ref4] van deze wet, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde
      categorie.


