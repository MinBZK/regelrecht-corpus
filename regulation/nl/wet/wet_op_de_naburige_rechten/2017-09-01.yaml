  - number: '8'
    text: |-
      1 Een omroeporganisatie heeft het uitsluitend recht om toestemming te verlenen voor een of meer van de volgende
      handelingen:

      a. het heruitzenden van programma's;

      b. het opnemen van programma’s en het reproduceren van een dergelijke opname;

      c. het verkopen, verhuren, uitlenen, afleveren of anderszins in het verkeer brengen van een opname van een
      uitzending of van een reproduktie daarvan dan wel het voor die doeleinden invoeren, aanbieden of in voorraad
      hebben;

      d. het openbaarmaken van programma's, indien deze openbaarmaking geschiedt in voor het publiek toegankelijke
      plaatsen tegen betaling van entreegeld, ongeacht welke technische hulpmiddelen daarbij worden gebruikt;

      e. het beschikbaar stellen voor het publiek of op andere wijze openbaar maken van opnamen van
      programma's of reproducties daarvan, ongeacht welke technische hulpmiddelen daarbij worden gebruikt.
      [Artikel 2, zevende tot en met negende lid][ref1], is van overeenkomstige toepassing.

      2 Is een opname van een uitzending of een reproduktie daarvan door de houder van het uitsluitend recht, bedoeld
      in het eerste lid, of met zijn toestemming voor de eerste maal in een van de lid-staten van de Europese Unie of
      in een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 in het
      verkeer gebracht door eigendomsoverdracht, dan handelt de verkrijger van die opname of die reproduktie niet in
      strijd met dit uitsluitend recht door ten aanzien daarvan de in het eerste lid, onder *c*, genoemde handelingen,
      met uitzondering van verhuur en uitlening, te verrichten.

      3 Onverminderd het bepaalde in het tweede lid is het uitlenen van de in dat lid bedoelde opname van een uitzending
      of een reproduktie daarvan toegestaan mits degene die de uitlening verricht of doet verrichten een billijke
      vergoeding betaalt.

      4 Instellingen van onderwijs en instellingen van onderzoek en de aan die instellingen verbonden bibliotheken en de
      Koninklijke Bibliotheek zijn vrijgesteld van de betaling van een vergoeding voor uitlenen als bedoeld in het derde
      lid.

      5 Publiek toegankelijke bibliotheekvoorzieningen, die in overwegende mate door gemeenten, provincies, het rijk
      of het openbaar lichaam Bonaire, Sint Eustatius of Saba worden gesubsidieerd of in stand gehouden, zijn voor
      het uitlenen van op basis van [artikel 10, onderdeel i][ref2], omgezette materialen aan bij die voorzieningen
      ingeschreven personen met een handicap, vrijgesteld van betaling van de vergoeding, bedoeld in het derde lid.

      6 De in het derde lid bedoelde vergoeding is niet verschuldigd indien de betalingsplichtige kan aantonen dat de
      houder van het uitsluitend recht afstand heeft gedaan van het recht op een billijke vergoeding. De houder van het
      uitsluitend recht dient de afstand schriftelijk mee te delen aan de in de [artikelen 15a][ref3] en [15b][ref4]
      bedoelde rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel15a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel15b
