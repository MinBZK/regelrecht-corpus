  - number: '22'
    text: |-
      Hij, die opzettelijk een voorwerp waarin met inbreuk op de rechten als bedoeld in de [artikelen 2][ref1],
      [6][ref2], [7a][ref3] en [8][ref4] van deze wet een opname van een uitvoering, fonogram, eerste vastlegging van
      een film of een opname van een programma, of een reproductie daarvan, is vervat,

      a. openlijk ter verspreiding aanbiedt,

      b. ter reproductie of ter verspreiding voorhanden heeft,

      c. invoert, doorvoert of uitvoert, of

      d. bewaart uit winstbejag,

      wordt gestraft met gevangenisstraf van ten hoogste één jaar of geldboete van de vijfde categorie.


