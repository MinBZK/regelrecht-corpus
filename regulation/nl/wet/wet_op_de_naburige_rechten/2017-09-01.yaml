preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met het voornemen toe te treden tot het in 1961 te Rome
    gesloten Internationaal Verdrag inzake de bescherming van uitvoerende kunstenaars, producenten van fonogrammen en
    omroeporganisaties (Trb. 1986, 182) en de in 1971 te Genève gesloten Overeenkomst ter bescherming van producenten
    van fonogrammen tegen het ongeoorloofd kopiëren van hun fonogrammen (Trb. 1986, 183) wenselijk is regelen te
    treffen inzake de bescherming van uitvoerende kunstenaars, producenten van fonogrammen en omroeporganisaties en dat
    het voorts in verband hiermee wenselijk is de Auteurswet 1912 te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005921/2017-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. **uitvoerende kunstenaar**: de toneelspeler, zanger, musicus, danser en iedere andere persoon die een werk van
      letterkunde, wetenschap of kunst of een uiting van folklore opvoert, zingt, voordraagt of op enige andere wijze
      uitvoert, alsmede de artiest, die een variété- of circusnummer of een poppenspel uitvoert;

      b. **opnemen**: geluiden, beelden of een combinatie daarvan voor de eerste maal vastleggen op enig voorwerp dat
      geschikt is om deze te reproduceren of openbaar te maken;

      c. **fonogram**: iedere opname van uitsluitend geluiden van een uitvoering of andere geluiden;

      d. **producent van fonogrammen**: de natuurlijke of rechtspersoon die een fonogram voor de eerste maal vervaardigt
      of doet vervaardigen;

      e. **omroeporganisatie**: een instelling, die in overeenstemming met de wetgeving van het land waar de uitzending
      plaatsvindt, programma’s verzorgt en onder haar verantwoordelijkheid uitzendt of doet uitzenden;

      f. **reproduceren**: de directe of indirecte, tijdelijke of duurzame, volledige of gedeeltelijke reproductie van
      een opname of een reproductie daarvan, met welke middelen en in welke vorm ook; onder reproduceren wordt niet
      verstaan de tijdelijke reproductie die van voorbijgaande of incidentele aard is, en die een integraal en essentieel
      onderdeel vormt van een technisch procédé dat wordt toegepast met als enig doel de doorgifte in een netwerk tussen
      derden door een tussenpersoon of een rechtmatig gebruik mogelijk te maken, en die geen zelfstandige economische
      waarde bezit;

      g. **uitzenden**: het verspreiden van programma’s door middel van een omroepzender als
      bedoeld in [artikel 1.1 van de Mediawet 2008][ref1] of een omroepnetwerk als bedoeld in
      [artikel 1.1 van de Mediawet 2008][ref2];

      h. **heruitzenden**: het door een instelling gelijktijdig uitzenden van een programma dat door een andere
      instelling of omroeporganisatie wordt uitgezonden;

      i. **programma**: een uitgezonden radio- of televisieprogramma, of -programma-onderdeel;

      j. **verhuren**: het voor een beperkte tijd en tegen een direct of indirect economisch of commercieel voordeel voor
      gebruik ter beschikking stellen;

      k. **uitlenen**: het voor een beperkte tijd en zonder direct of indirect economisch of commercieel voordeel voor
      gebruik ter beschikking stellen door voor het publiek toegankelijke instellingen;

      l. **uitvoering**: de activiteit van de uitvoerend kunstenaar als zodanig;

      m. **beschikbaar stellen voor het publiek**: op grond van deze wet beschermd materiaal per draad of draadloos voor
      leden van het publiek beschikbaar stellen op zodanige wijze dat zij daartoe op een door hen individueel gekozen
      plaats en tijd toegang toe hebben;

      n. **technische voorzieningen**: technologie, inrichtingen of onderdelen die in het kader van hun normale
      werking dienen voor het voorkomen of beperken van handelingen ten aanzien van het op grond van deze wet beschermd
      materiaal, die door de uitvoerend kunstenaar, producent van fonogrammen, producent van eerste vastleggingen
      van films of omroeporganisatie niet zijn toegestaan; technische voorzieningen worden geacht «doeltreffend» te
      zijn indien het gebruik van op grond van deze wet beschermd materiaal door de uitvoerend kunstenaar, producent
      van fonogrammen, producent van eerste vastleggingen van films of omroeporganisatie, of hun rechtverkrijgenden,
      wordt beheerst door middel van toegangscontrole of door toepassing van een beschermingsprocédé zoals encryptie,
      vervorming of andere transformatie van op grond van deze wet beschermd materiaal of een kopieerbeveiliging die de
      beoogde bescherming bereikt;

      o. **informatie betreffende het beheer van rechten**: alle door de uitvoerende kunstenaar, producent van
      fonogrammen, producent van eerste vastleggingen van films, of omroeporganisaties, en hun rechtverkrijgenden
      verstrekte informatie, welke is verbonden met een reproductie van op grond van deze wet beschermd materiaal of bij
      de openbaarmaking dan wel het in het verkeer brengen daarvan is bekend gemaakt, die dient ter identificatie van
      dat materiaal, of informatie betreffende de voorwaarden voor het gebruik van het op grond van deze wet beschermd
      materiaal alsmede de cijfers of codes waarin die informatie is vervat.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1.1
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel1.1
