  - number: 1a
    text: |-
      Behoudens bewijs van het tegendeel wordt voor de houder van een naburig recht gehouden degene die op of in het op
      grond van deze wet beschermde materiaal als zodanig is aangeduid, of bij gebreke van een dergelijke aanduiding,
      degene die bij de openbaarmaking of het in het verkeer brengen van dit materiaal als uitvoerende kunstenaar,
      producent van fonogrammen, producent van eerste vastleggingen van films, of omroeporganisatie, daarvan is bekend
      gemaakt door degene die het materiaal openbaar maakt of in het verkeer brengt.
    url: https://wetten.overheid.nl/BWBR0005921/2017-09-01#Artikel1a
  - number: '2'
    text: |-
      1 De uitvoerende kunstenaar heeft het uitsluitend recht om toestemming te verlenen voor een of meer van de volgende
      handelingen:

      a. het opnemen van een uitvoering;

      b. het reproduceren van een opname van een uitvoering;

      c. het verkopen, verhuren, uitlenen, afleveren of anderszins in het verkeer brengen van een opname van een
      uitvoering of van een reproduktie daarvan dan wel het voor die doeleinden invoeren, aanbieden of in voorraad
      hebben;

      d. het uitzenden, het heruitzenden, het beschikbaar stellen voor het publiek of het op een andere wijze openbaar
      maken van een uitvoering of een opname van een uitvoering of een reproductie daarvan.

      2 Is een opname van een uitvoering of een reproduktie daarvan door de houder van het uitsluitend recht, bedoeld
      in het eerste lid, of met zijn toestemming voor de eerste maal in een van de lid-staten van de Europese Unie of
      in een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 in het
      verkeer gebracht door eigendomsoverdracht, dan handelt de verkrijger van die opname of die reproduktie niet in
      strijd met dit uitsluitend recht door ten aanzien daarvan de in het eerste lid, onder *c*, genoemde handelingen,
      met uitzondering van verhuur en uitlening, te verrichten.

      3 Onverminderd het bepaalde in het tweede lid is het uitlenen van de in dat lid bedoelde opname van een uitvoering
      of een reproduktie daarvan toegestaan, mits degene die de uitlening verricht of doet verrichten een billijke
      vergoeding betaalt.

      4 Instellingen van onderwijs en instellingen van onderzoek en de aan die instellingen verbonden bibliotheken en de
      Koninklijke Bibliotheek zijn vrijgesteld van de betaling van een vergoeding voor uitlenen als bedoeld in het derde
      lid.

      5 Publiek toegankelijke bibliotheekvoorzieningen, die in overwegende mate door gemeenten, provincies, het rijk
      of het openbaar lichaam Bonaire, Sint Eustatius of Saba worden gesubsidieerd of in stand gehouden, zijn voor
      het uitlenen van op basis van [artikel 10, onderdeel i][ref1], omgezette materialen aan bij die voorzieningen
      ingeschreven personen met een handicap, vrijgesteld van betaling van de vergoeding, bedoeld in het derde lid.

      6 De in het derde lid bedoelde vergoeding is niet verschuldigd indien de betalingsplichtige kan aantonen dat de
      houder van het uitsluitend recht afstand heeft gedaan van het recht op een billijke vergoeding. De houder van
      het uitsluitend recht dient de afstand schriftelijk mee te delen aan de in [de artikelen 15][ref2] en [15][ref3]
      bedoelde rechtspersonen.

      7 Ten aanzien van het in het eerste lid, onder *d*, bepaalde wordt onder openbaar maken mede verstaan de uitvoering
      die plaatsvindt in besloten kring, tenzij deze zich beperkt tot de familie-, vrienden- of daaraan gelijk te stellen
      kring en voor het bijwonen daarvan geen betaling, in welke vorm ook, geschiedt.

      8 Onder het openbaar maken van een uitvoering wordt niet begrepen de uitvoering welke uitsluitend gebruikt
      wordt voor het onderwijs dat vanwege de overheid of vanwege een rechtspersoon zonder winstoogmerk wordt gegeven,
      voorzover deze uitvoering deel uitmaakt van het schoolwerkplan, leerplan of instellingswerkplan of dient tot een
      wetenschappelijk doel.

      9 Als afzonderlijke openbaarmaking wordt niet beschouwd de heruitzending van een programma door hetzelfde organisme
      dat dat programma oorspronkelijk uitzendt.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel15b
