  - number: '9'
    text: |-
      1 De rechten die deze wet verleent gaan over bij erfopvolging. Deze rechten zijn vatbaar voor gehele of
      gedeeltelijke overdracht. Voor het verrichten van handelingen als bedoeld in de [artikelen 2][ref1], [6][ref2],
      [7a][ref3] en [8][ref4] kan voor het geheel of een gedeelte van het uitsluitend recht een licentie worden
      verleend.

      2 De levering vereist voor gehele of gedeeltelijke overdracht, alsmede het verlenen van een exclusieve licentie,
      geschiedt door een daartoe bestemde akte.

      3 De overdracht of het verlenen van een exclusieve licentie door de uitvoerende kunstenaar of de natuurlijke
      persoon die het uitsluitend recht als bedoeld in [artikel 2][ref5] als erfgenaam of legataris heeft verkregen
      omvat alleen die bevoegdheden waarvan dit in de akte is vermeld of uit de aard of de strekking van de titel
      noodzakelijkerwijs voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
