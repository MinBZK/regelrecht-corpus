    text: |-
      1 De betaling van de in de [artikelen 2][ref1], [6][ref2], [7a][ref3] en [8][ref4] bedoelde vergoeding dient te
      geschieden aan een door Onze Minister van Justitie in overeenstemming met Onze Minister van Onderwijs, Cultuur en
      Wetenschappen aan te wijzen naar hun oordeel representatieve rechtspersoon, die met uitsluiting van anderen belast
      is met de inning en de verdeling van deze vergoeding. In aangelegenheden betreffende de vaststelling van de hoogte
      van de vergoeding en de inning daarvan alsmede de uitoefening van het uitsluitende recht vertegenwoordigt de in de
      vorige zin bedoelde rechtspersoon de rechthebbenden in en buiten rechte.

      2 De in het eerste lid bedoelde rechtspersoon staat onder toezicht van het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref5].

      3 De verdeling van de geïnde vergoedingen geschiedt overeenkomstig een reglement, dat is opgesteld door de
      rechtspersoon, bedoeld in het eerste lid, en dat is goedgekeurd door het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref6].


