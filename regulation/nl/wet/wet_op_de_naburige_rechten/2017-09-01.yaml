  - number: 2b
    text: |-
      [Hoofdstuk 1a van de Auteurswet][ref1] is van overeenkomstige toepassing op de uitvoerende kunstenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#HoofdstukIa
    url: https://wetten.overheid.nl/BWBR0005921/2017-09-01#Artikel2b
