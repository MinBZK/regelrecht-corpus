  - number: '11'
    text: |-
      Van inbreuk op de rechten, bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3] en [8][ref4], is geen
      sprake indien de handelingen, bedoeld in de[ artikelen 2][ref5], [6][ref6], [7a][ref7] en [8][ref8], uitsluitend
      worden verricht ter toelichting bij het onderwijs, voor zover dit door het beoogde, niet commerciële doel
      wordt gerechtvaardigd; [artikel 16, eerste lid, onder 1°, 2°, 4° en 5°, van de Auteurswet][ref9] is van
      overeenkomstige toepassing; ten aanzien van een uitvoering dient [artikel 5][ref10] in acht genomen te worden.


