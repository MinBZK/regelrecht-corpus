  - number: '17'
    text: |-
      1 De rechten, bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3] en [8][ref4], geven de bevoegdheid om
      opnamen of reproducties daarvan die in strijd met die rechten in het verkeer zijn gebracht alsmede niet geoorloofde
      opnamen of reproducties, als zijn eigendom op te eisen dan wel onttrekking aan het handelsverkeer, vernietiging
      of onbruikbaarmaking daarvan te vorderen. Gelijke bevoegdheid bestaat ten aanzien van roerende zaken die geen
      registergoederen zijn en die rechtstreeks hebben gediend tot de vervaardiging van de in de eerste zin bedoelde
      opnamen of reproducties. Bevoegdheid tot opeising bestaat tevens ten aanzien van gelden waarvan aannemelijk is dat
      zij zijn verkregen door of als gevolg van inbreuk op een van de in de [artikelen 2][ref5], [6][ref6], [7a][ref7]
      en [8][ref8] bedoelde rechten. Teneinde tot vernietiging of onbruikbaarmaking over te gaan, kan de gerechtigde de
      afgifte van deze zaken vorderen.

      2 De bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref9] betreffende beslag en executie tot afgifte
      van roerende zaken die geen registergoederen zijn, zijn van toepassing. Bij samenloop met een ander beslag gaat
      degene die beslag heeft gelegd krachtens dit artikel voor.

      3 Tenzij anders is overeengekomen, heeft de licentienemer het recht de uit het eerste lid voortvloeiende
      bevoegdheden uit te oefenen, voor zover deze strekken tot bescherming van de rechten waarvan de uitoefening hem
      is toegestaan.

      4 Gelijke bevoegdheid tot opeising, dan wel tot onttrekking aan het handelsverkeer, vernietiging of
      onbruikbaarmaking alsmede tot afgifte teneinde tot vernietiging of onbruikbaarmaking over te gaan, bestaat ten
      aanzien van inrichtingen, producten en onderdelen als bedoeld in [artikel 19][ref10] en reproducties als bedoeld in
      [artikel 19a][ref11], die geen registergoederen zijn.

      5 De maatregelen bedoeld in het eerste en vierde lid worden op kosten van de verweerder uitgevoerd, tenzij
      bijzondere redenen dit beletten.

      6 De rechter kan op vordering van de rechthebbende bedoeld in de [artikelen 2][ref12], [6][ref13], [7a][ref14]
      en [8][ref15], degene die inbreuk op diens recht heeft gemaakt, bevelen al hetgeen hem bekend is omtrent de
      herkomst en distributiekanalen van de goederen of diensten die inbreuk maken, aan de gerechtigde mee te delen
      en alle daarop betrekking hebbende gegevens aan deze te verstrekken. Onder dezelfde voorwaarden kan dit bevel
      worden gegeven aan een derde die op commerciële schaal inbreukmakende goederen in zijn bezit heeft of gebruikt,
      die op commerciële schaal diensten verleent die bij de inbreuk worden gebruikt, of die door een van deze derden
      is aangewezen als zijnde betrokken bij de productie, fabricage of distributie van deze goederen of bij het
      verlenen van deze diensten. Deze derde kan zich verschonen van het verstrekken van informatie die bewijs zou
      vormen van deelname aan een inbreuk op een recht van intellectuele eigendom door hem zelf of door de andere in
      [artikel 165, derde lid, Wetboek van Burgerlijke Rechtsvordering][ref16] bedoelde personen.

      7 Bij de beoordeling van de maatregelen die de rechthebbende, bedoeld in de [artikelen 2][ref17], [6][ref18],
      [7a][ref19] en [8][ref20], of diens licentienemer kan vorderen ingevolge de bevoegdheden, genoemd in het eerste
      en vierde lid, houdt de rechter rekening met de noodzakelijke evenredigheid tussen de ernst van de inbreuk en de
      gevorderde maatregelen en met de belangen van derden.


