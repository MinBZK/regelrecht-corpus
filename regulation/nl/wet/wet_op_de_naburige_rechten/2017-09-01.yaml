  - number: '30'
    text: |-
      1 De door de strafrechter verbeurd verklaarde opnamen en reprodukties worden vernietigd; echter kan de rechter
      bij het vonnis bepalen, dat zij aan de rechthebbende zullen worden afgegeven, indien deze zich daartoe ter griffie
      aanmeldt binnen een maand nadat de uitspraak in kracht van gewijsde is gegaan.

      2 Door de afgifte gaat de eigendom van de opnamen en reprodukties op de rechthebbende over. De rechter zal kunnen
      gelasten, dat die afgifte niet zal geschieden dan tegen een bepaalde door de rechthebbende te betalen vergoeding,
      welke ten bate komt van de Staat.
    url: https://wetten.overheid.nl/BWBR0005921/2017-09-01#Artikel30
  - number: '32'
    text: |-
      1 De voorgaande artikelen zijn op de uitvoerende kunstenaar van toepassing ingeval:

      a. hij onderdaan is van een van de lid-staten van de Europese Unie of van een staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 of zijn gewone verblijfplaats in Nederland
      heeft dan wel onderdaan is van een Staat die partij is bij het Verdrag van Rome inzake de bescherming van
      uitvoerende kunstenaars, producenten van fonogrammen en omroeporganisaties; of

      b. zijn uitvoering in Nederland plaats had dan wel in een Staat die partij is bij het Verdrag van Rome inzake de
      bescherming van uitvoerende kunstenaars, producenten van fonogrammen en omroeporganisaties; of

      c. zijn uitvoering is opgenomen op een fonogram als bedoeld in het tweede lid van dit artikel; of

      d. zijn uitvoering, die niet is opgenomen op een fonogram, is openbaar gemaakt door middel van een programma van
      een omroeporganisatie als bedoeld in het zesde lid van dit artikel.

      2 De voorgaande artikelen zijn op de producenten van fonogrammen van toepassing ingeval:

      a. hij onderdaan is van of rechtspersoon is opgericht naar het recht van een van de lid-staten van de Europese
      Unie of van een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei
      1992 dan wel in Nederland zijn zetel of gewone verblijfplaats heeft of onderdaan is van dan wel rechtspersoon is
      opgericht naar het recht van een Staat die partij is bij het in het eerste lid, onder *a*, bedoelde Verdrag van
      Rome of bij de Overeenkomst ter bescherming van producenten van fonogrammen tegen het ongeoorloofd kopiëren van hun
      fonogrammen; of

      b. het opnemen in Nederland plaats had dan wel in een Staat die partij is bij het in het eerste lid, onder
      *a*, bedoelde Verdrag van Rome of bij de Overeenkomst ter bescherming van producenten van fonogrammen tegen het
      ongeoorloofd kopiëren van hun fonogrammen; of

      c. het fonogram voor de eerste maal, of binnen dertig dagen na de eerste uitgave in een ander land, in het verkeer
      is gebracht in Nederland dan wel in een Staat die partij is bij het in het eerste lid, onder *a*, bedoelde Verdrag
      van Rome of bij de Overeenkomst ter bescherming van producenten van fonogrammen tegen het ongeoorloofd kopiëren van
      hun fonogrammen.

      3 Van het in het verkeer brengen als bedoeld in het tweede lid is sprake, wanneer van op rechtmatige wijze
      vervaardigde reprodukties van een fonogram een zodanig aanbod van exemplaren daarvan heeft plaatsgevonden dat
      daardoor wordt voorzien in de redelijke behoeften van het publiek.

      4 Met betrekking tot fonogrammen, waarvan de producent onderdaan is van dan wel rechtspersoon is opgericht
      naar het recht van een Staat die partij is bij het in het eerste lid, onder *a*, bedoelde Verdrag van Rome is
      [artikel 7][ref1] slechts van toepassing in de mate waarin en voor de duur waarvoor deze Staat bescherming verleent
      ten aanzien van fonogrammen waarvan de producent Nederlander is dan wel zijn zetel heeft in Nederland.

      5 Het recht op een billijke vergoeding, als bedoeld in [artikel 7][ref2], geldt niet voor fonogrammen waarvan de
      producent geen onderdaan is van noch rechtspersoon is opgericht naar het recht van een Staat die partij is bij het
      in het eerste lid, onder *a*, bedoelde Verdrag van Rome.

      6 De voorgaande artikelen zijn op omroeporganisaties van toepassing ingeval:

      a. het hoofdkantoor van de omroeporganisatie is gevestigd in een van de lid-staten van de Europese Unie of in een
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 dan wel in een
      Staat die partij is bij het in het eerste lid, onder *a*, bedoelde Verdrag van Rome; of

      b. de uitzending van het programma heeft plaatsgevonden in Nederland dan wel in een Staat die partij is bij het in
      het eerste lid onder *a*, bedoelde Verdrag van Rome; of

      7 Het bepaalde in het vierde en vijfde lid van dit artikel is niet van toepassing op fonogrammen waarvan de
      producent onderdaan is van of rechtspersoon is opgericht naar het recht van een van de lid-staten van de Europese
      Unie of van een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992.

      8 De voorgaande artikelen zijn op de producent van de eerste vastleggingen van films van toepassing ingeval:

      a. hij onderdaan is van of rechtspersoon is opgericht naar het recht van een van de lid-staten van de Europese Unie
      of van een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 dan
      wel in Nederland zijn zetel of gewone verblijfplaats heeft; of

      b. de vastlegging in Nederland plaats had; of

      c. de vastlegging voor de eerste maal, of binnen dertig dagen na de eerste uitgave in een ander land, in het
      verkeer is gebracht in Nederland.

      Het derde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel7
