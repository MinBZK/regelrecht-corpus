    text: |-
      1 De uitvoerende kunstenaar heeft, zelfs nadat hij zijn in [artikel 2][ref1] bedoelde recht heeft overgedragen:

      a. het recht zich te verzetten tegen de openbaarmaking van de uitvoering zonder vermelding van zijn naam of andere
      aanduiding als uitvoerende kunstenaar tenzij het verzet zou zijn in strijd met de redelijkheid;

      b. het recht zich te verzetten tegen de openbaarmaking van de uitvoering onder een andere naam dan de zijne,
      alsmede tegen het aanbrengen van enige wijziging in de wijze waarop hij is aangeduid, voorzover deze naam of
      aanduiding in verband met de uitvoering is vermeld of openbaar is gemaakt;

      c. het recht zich te verzetten tegen elke andere wijziging in de uitvoering, tenzij deze wijziging van zodanige
      aard is dat het verzet in strijd zou zijn met de redelijkheid;

      d. het recht zich te verzetten tegen elke misvorming, verminking of andere aantasting van de uitvoering, die nadeel
      zou kunnen toebrengen aan de eer of de naam van de uitvoerende kunstenaar of aan zijn waarde in deze hoedanigheid.

      2 De in het voorgaande lid genoemde rechten komen na het overlijden van de uitvoerende kunstenaar tot aan
      het vervallen van zijn in [artikel 2][ref2] bedoelde recht toe aan de door hem bij uiterste wilsbeschikking
      aangewezene.

      3 Van de in het eerste lid onder *a*-*c* genoemde rechten kan schriftelijk afstand worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel2
