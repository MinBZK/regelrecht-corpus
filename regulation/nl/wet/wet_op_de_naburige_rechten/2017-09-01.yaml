  - number: '7'
    text: |-
      1 Een voor commerciële doeleinden uitgebracht fonogram of een reproduktie daarvan kan zonder toestemming
      van de producent van het fonogram en de uitvoerende kunstenaar of hun rechtverkrijgenden worden uitgezonden,
      heruitgezonden of op een andere wijze openbaar gemaakt, mits daarvoor een billijke vergoeding wordt betaald. Het
      in het eerste volzin bepaalde is niet van toepassing op het beschikbaar stellen voor het publiek van een dergelijk
      fonogram.

      2 Voor de toepassing van het eerste lid wordt onder een voor commerciële doeleinden uitgebracht fonogram mede
      begrepen een fonogram dat beschikbaar wordt gesteld voor het publiek.

      3 Bij gebreke van overeenstemming over de hoogte van de billijke vergoeding is de rechtbank Den Haag in eerste
      aanleg bij uitsluiting bevoegd om op vordering van de meest gerede partij de hoogte van de vergoeding vast te
      stellen.

      4 De vergoeding komt toe aan zowel de uitvoerende kunstenaar als de producent of hun rechtverkrijgenden en wordt
      tussen hen gelijkelijk verdeeld.
    url: https://wetten.overheid.nl/BWBR0005921/2017-09-01#Artikel7
  - number: 7a
    text: |-
      1 De producent van de eerste vastleggingen van films heeft het uitsluitend recht om toestemming te verlenen voor:

      a. het reproduceren van een door hem vervaardigde eerste vastlegging van een film of van een reproduktie daarvan;

      b. het verkopen, verhuren, uitlenen, afleveren of anderszins in het verkeer brengen van een door hem vervaardigde
      eerste vastlegging van een film of een reproduktie daarvan, dan wel het voor die doeleinden invoeren, aanbieden of
      in voorraad hebben;

      c. het beschikbaar stellen voor het publiek van een door hem vervaardigde eerste vastlegging van een film of een
      reproductie daarvan.

      2 Is een eerste vastlegging van een film of een reproduktie daarvan door de houder van het uitsluitend recht,
      bedoeld in het eerste lid, of met zijn toestemming voor de eerste maal in een van de lid-staten van de Europese
      Unie of in een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992
      in het verkeer gebracht door eigendomsoverdracht, dan handelt de verkrijger van die eerste vastlegging of die
      reproduktie niet in strijd met dit uitsluitend recht door ten aanzien daarvan de in het eerste lid, onder *b*,
      genoemde handelingen, met uitzondering van verhuur en uitlening, te verrichten.

      3 Onverminderd het bepaalde in het tweede lid is het uitlenen van de in dat lid bedoelde eerste vastlegging of een
      reproduktie daarvan toegestaan, mits degene die de uitlening verricht of doet verrichten een billijke vergoeding
      betaalt.

      4 Instellingen van onderwijs en instellingen van onderzoek en de aan die instellingen verbonden bibliotheken en de
      Koninklijke Bibliotheek zijn vrijgesteld van de betaling van een vergoeding voor uitlenen als bedoeld in het derde
      lid.

      5 Publiek toegankelijke bibliotheekvoorzieningen, die in overwegende mate door gemeenten, provincies, het rijk
      of het openbaar lichaam Bonaire, Sint Eustatius of Saba worden gesubsidieerd of in stand gehouden, zijn voor
      het uitlenen van op basis van [artikel 10, onderdeel i][ref1], omgezette materialen aan bij die voorzieningen
      ingeschreven personen met een handicap, vrijgesteld van betaling van de vergoeding, bedoeld in het derde lid.

      6 De in het derde lid bedoelde vergoeding is niet verschuldigd indien de betalingsplichtige kan aantonen dat de
      houder van het uitsluitend recht afstand heeft gedaan van het recht op een billijke vergoeding. De houder van
      het uitsluitend recht dient de afstand schriftelijk mee te delen aan de in de [artikelen 15][ref2] en [15][ref3]
      bedoelde rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel15a
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel15b
