  - number: '16'
    text: |-
      1 In passende gevallen kan de rechter de schadevergoeding vaststellen als een forfaitair bedrag.

      2 Naast schadevergoeding kan de rechthebbende, bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3] en
      [8][ref4], vorderen dat degene die inbreuk op zijn recht heeft gemaakt wordt veroordeeld de door deze tengevolge
      van de inbreuk genoten winst af te dragen en dienaangaande rekening en verantwoording af te leggen.

      3 De rechthebbende kan de in het tweede lid bedoelde vorderingen of een van deze ook namens of mede namens een
      licentienemer instellen, onverminderd de bevoegdheid van deze laatste in een al of niet namens hem of mede namens
      hem door de rechthebbende ingesteld geding tussen te komen om rechtstreeks de door hem geleden schade vergoed te
      krijgen of om zich een evenredig deel van de door de verweerder af te dragen winst te doen toewijzen. De in het
      tweede lid bedoelde vorderingen of een van deze kan een licentienemer slechts instellen als hij de bevoegdheid
      daartoe heeft bedongen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
