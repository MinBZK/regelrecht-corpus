  - number: '27'
    text: |-
      Hij die in een schriftelijke aanvrage of opgave aan de in [artikel 15, eerste lid][ref1], bedoelde rechtspersoon,
      dienende voor de vaststelling van het op grond van [artikel 7][ref2] van deze wet verschuldigde, opzettelijk een
      onjuiste of onvolledige mededeling doet, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van
      de derde categorie. Het feit wordt beschouwd als een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel7
    url: https://wetten.overheid.nl/BWBR0005921/2017-09-01#Artikel27
