      de incidentele verwerking van op grond van deze wet beschermd materiaal als onderdeel van ondergeschikte betekenis
      in ander materiaal;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
  - number: 10.i
    text: |-
      de reproductie, het openbaar maken of het in het verkeer brengen van op grond van deze wet beschermd materiaal
      voor zover dat uitsluitend voor mensen met een handicap bestemd is, met de handicap direct verband houdt, van niet
      commerciële aard is en wegens die handicap noodzakelijk is, onverminderd het bepaalde in artikel 10, onderdeel m of
      n; de [artikelen 15i, tweede lid][ref1], en [16g van de Auteurswet][ref2] zijn van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15i
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16g
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
    references:
