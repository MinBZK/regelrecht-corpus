  - number: 10.b
    text: |-
      het citeren in een aankondiging, beoordeling, polemiek of wetenschappelijke verhandeling of een uiting met
      een vergelijkbaar doel; [artikel 15a, eerste lid, onder 1°, 2° en 4°, van de Auteurswet][ref1] is van
