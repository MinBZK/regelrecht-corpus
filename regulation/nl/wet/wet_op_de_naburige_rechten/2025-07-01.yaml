  - number: 19a
    text: |-
      Degene die opzettelijk en zonder daartoe gerechtigd te zijn elektronische informatie betreffende het beheer van
      rechten verwijdert of wijzigt, of van opnamen van uitvoeringen, fonogrammen, films, perspublicaties of programma's,
      of reproducties daarvan, op ongeoorloofde wijze dergelijke informatie is verwijderd of waarin op ongeoorloofde
      wijze dergelijke informatie is gewijzigd, verspreidt, ter verspreiding invoert, uitzendt of anderszins openbaar
      maakt, en weet of redelijkerwijs behoort te weten dat hij zodoende aanzet tot inbreuk op de rechten als bedoeld in
      de [artikelen 2][ref1], [6][ref2], [7a][ref3], [7b][ref4] en [8][ref5] dan wel een dergelijke inbreuk mogelijk
      maakt, vergemakkelijkt of verbergt, handelt onrechtmatig.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
