  - number: '25'
    text: |-
      Hij die opzettelijk in een uitvoering, in de benaming daarvan of in de aanduiding van de uitvoerende kunstenaar
      wederrechtelijk enige wijziging aanbrengt, of wel een zodanige uitvoering op enige andere wijze, welke nadeel zou
      kunnen toebrengen aan de eer of de naam van de uitvoerende kunstenaar of aan zijn waarde in deze hoedanigheid,
      aantast, wordt gestraft met gevangenisstraf van ten hoogste zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel25
  - number: '26'
    text: |-
      De feiten strafbaar gesteld in de [artikelen 21][ref1], [22][ref2], [23][ref3], [24][ref4] en [25][ref5] zijn
      misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel24
      [ref5]: https://wetten.overheid.nl/BWBR0005921#Artikel25
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel26
    references:
