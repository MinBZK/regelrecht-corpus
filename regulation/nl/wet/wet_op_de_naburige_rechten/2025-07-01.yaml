  - number: '19.1'
    text: |-
      Degene, die doeltreffende technische voorzieningen omzeilt en dat weet of redelijkerwijs behoort te weten, handelt
      onrechtmatig.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel19
  - number: '19.2'
    text: |-
      Degene die diensten verricht of inrichtingen, producten of onderdelen vervaardigt, invoert, distribueert, verkoopt,
      verhuurt, adverteert of voor commerciële doeleinden bezit die:
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel19
  - number: 19.2.a)
    text: |-
      aangeboden, aangeprezen of in de handel gebracht worden met het doel om de beschermende werking van doeltreffende
      technische voorzieningen te omzeilen, of
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel19
  - number: 19.2.b)
    text: |-
      slechts een commercieel beperkt doel of nut hebben anders dan het omzeilen van de beschermende werking van
      doeltreffende technische voorzieningen, of
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel19
  - number: 19.2.c)
    text: |-
      vooral ontworpen, vervaardigd of aangepast worden met het doel het omzeilen van de beschermende werking van
      doeltreffende technische voorzieningen mogelijk of gemakkelijker te maken,
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel19
  - number: '19.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden vastgesteld die de uitvoerende kunstenaar, producent van
      fonogrammen, producent van films, uitgever van perspublicaties en omroeporganisatie, of hun rechtverkrijgenden, er
      toe verplichten aan de gebruiker van een uitvoering, opname van een uitvoering, fonogram, film, perspublicatie of
      programma, of een reproductie daarvan voor doeleinden als omschreven in [artikel 10, onderdelen g, i en k][ref1],
      en [artikel 11][ref2] de nodige middelen te verschaffen om van deze beperkingen te profiteren, mits de gebruiker
      rechtmatig toegang tot door de technische voorziening beschermde uitvoering, opname van een uitvoering, fonogram,
      film, perspublicatie of programma, of reproductie daarvan, heeft. Het bepaalde in de voorgaande zin geldt niet
      ten aanzien van uitvoeringen, opnamen van uitvoeringen, fonogrammen, films, perspublicaties of programma's, of
      reproducties daarvan, die onder contractuele voorwaarden aan gebruikers beschikbaar worden gesteld op een door hen
      individueel gekozen plaats en tijd. [Artikel 17d van de Auteurswet][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel17d
