  - number: 15d
    text: |-
      Degene die tot betaling van de in de [artikelen 2, derde lid][ref1], [6, derde lid][ref2], [7][ref3],
      en [8, derde lid][ref4], bedoelde vergoeding verplicht is, is gehouden, voor zover geen ander tijdstip is
      overeengekomen, vóór 1 april van ieder kalenderjaar aan de in [artikel 15][ref5], bedoelde rechtspersoon opgave te
      doen van het aantal rechtshandelingen, bedoeld in eerstgenoemde artikelen. Hij is voorts gehouden desgevraagd aan
      deze rechtspersoon onverwijld de bescheiden of andere informatiedragers ter inzage te geven, waarvan kennisneming
      noodzakelijk is voor de vaststelling van de verschuldigdheid en de hoogte van de vergoeding.


