  - number: '23'
    text: |-
      Hij, die van het plegen van de misdrijven als bedoeld in de [artikelen 21][ref1] en [22][ref2], zijn beroep maakt
      of het plegen van deze misdrijven als bedrijf uitoefent, wordt gestraft met gevangenisstraf van ten hoogste vier
      jaar of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel22
