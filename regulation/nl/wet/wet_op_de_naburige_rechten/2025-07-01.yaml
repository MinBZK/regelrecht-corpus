      De hoogte van de in de [artikelen 2, derde lid][ref1], [6, derde lid][ref2], [7][ref3], en [8, derde lid][ref4],
      bedoelde vergoeding wordt vastgesteld door een door Onze Minister van Justitie en Veiligheid in overeenstemming
      met Onze Minister van Onderwijs, Cultuur en Wetenschap aan te wijzen stichting waarvan het bestuur zodanig is
      samengesteld dat de belangen van rechthebbenden en de ingevolge voornoemde artikelen betalingsplichtigen op
      evenwichtige wijze worden behartigd. De voorzitter van het bestuur van deze stichting wordt benoemd door Onze
      Minister van Justitie en Veiligheid in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap. Het
      aantal bestuursleden van deze stichting dient oneven te zijn.


