      openbaar maken van een opname van een uitvoering, fonogram, eerste vastlegging van een film, perspublicatie
      of opname van een programma, of een reproductie daarvan, die permanent deel uitmaken van de collectie van die
      erfgoedinstelling en de op grond van deze wet beschermde prestaties niet in de handel verkrijgbaar zijn, zijn
      [artikel 17d][ref2] en de [eerste paragraaf van hoofdstuk IVa van de Auteurswet][ref3] van overeenkomstige
      toepassing.


