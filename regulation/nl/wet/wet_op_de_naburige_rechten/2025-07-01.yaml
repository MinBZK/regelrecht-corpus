  - number: '12.1'
    text: |-
      De rechten van uitvoerende kunstenaars vervallen door verloop van 50 jaren te rekenen van de 1e januari van het
      jaar, volgend op dat waarin de uitvoering heeft plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel12
  - number: '12.2'
    text: |-
      Indien binnen de in het eerste lid bedoelde termijn een opname van de uitvoering anders dan op een fonogram op
      rechtmatige wijze in het verkeer is gebracht of openbaar gemaakt, vervallen de rechten door verloop van 50 jaren te
      rekenen van de 1e januari van het jaar, volgend op dat waarin de opname voor het eerst op rechtmatige wijze in het
      verkeer is gebracht of, indien dit eerder valt, is openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel12
  - number: '12.3'
    text: |-
      Indien binnen de in het eerste lid bedoelde termijn een opname van de uitvoering op een fonogram op rechtmatige
      wijze in het verkeer is gebracht of openbaar gemaakt, vervallen de rechten door verloop van 70 jaren te rekenen van
      de 1e januari van het jaar, volgend op dat waarin het fonogram voor het eerst op rechtmatige wijze in het verkeer
      is gebracht of, indien dit eerder valt, is openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel12
  - number: '12.4'
    text: |-
      De rechten van producenten van fonogrammen vervallen door verloop van 70 jaren te rekenen van de 1e januari
      van het jaar, volgend op dat waarin het fonogram is vervaardigd. Indien binnen deze termijn het fonogram op
      rechtmatige wijze in het verkeer is gebracht, vervallen de rechten door verloop van 70 jaren te rekenen van de
      1e januari van het jaar, volgende op dat waarin het fonogram voor het eerst op rechtmatige wijze in het verkeer
      is gebracht. Indien het fonogram binnen de in de vorige zin bedoelde termijn niet op rechtmatige wijze in het
      verkeer is gebracht maar wel openbaar is gemaakt, vervallen de rechten 70 jaar na de datum waarop het fonogram
      voor het eerst is openbaar gemaakt. Indien een uitvoerend kunstenaar na verloop van vijftig jaar nadat het fonogram
      openbaar is gemaakt dan wel op rechtmatige wijze in het verkeer is gebracht, de overeenkomst waarin hij de rechten
      van zijn uitvoering aan de producent van een fonogram over heeft gedragen op grond van [artikel 2b][ref1] en
      [artikel 25e van de Auteurswet][ref2] ontbindt, vervallen de rechten van de producent van het fonogram.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2b
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel25e
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 2b
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 25e
  - number: '12.5'
    text: |-
      De rechten van omroeporganisaties vervallen door verloop van 50 jaren te rekenen van de 1e januari van het jaar,
      volgend op dat waarin een programma voor het eerst is uitgezonden, ongeacht welke technische hulpmiddelen daarbij
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel12
  - number: '12.6'
    text: |-
      De rechten van producenten van de eerste vastlegging van een film vervallen door verloop van 50 jaren te rekenen
      van de 1e januari van het jaar, volgend op dat waarin de eerste vastlegging heeft plaatsgehad. Indien echter
      binnen deze termijn de eerste vastlegging op rechtmatige wijze in het verkeer is gebracht of is openbaar gemaakt,
      vervallen de rechten door verloop van 50 jaren te rekenen van de 1e januari van het jaar, volgend op dat waarin de
      eerste vastlegging voor het eerst op rechtmatige wijze in het verkeer is gebracht, of indien dit eerder valt, is
      openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel12
  - number: '12.7'
    text: |-
      De rechten van uitgevers van perspublicaties vervallen door verloop van 2 jaren te rekenen van de 1e januari van
      het jaar, volgend op dat waarin de perspublicatie is openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel12
  - number: '13'
    text: |-
      De in [artikel 2][ref1] bedoelde rechten kunnen, ingeval het een gezamenlijke uitvoering door zes of meer personen
      betreft, uitsluitend worden uitgeoefend door een door de aan die uitvoering deelnemende uitvoerende kunstenaars bij
      meerderheid gekozen vertegenwoordiger. Het bepaalde in de eerste zin van dit artikel is niet van toepassing op de
      aan de gezamenlijke uitvoering meewerkende solist, regisseur en dirigent. De handhaving van de in [artikel 2][ref2]
      bedoelde rechten kan, ingeval het een gezamenlijke uitvoering betreft, door een ieder van de aan die uitvoering
      deelnemende uitvoerende kunstenaars geschieden, tenzij anders is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel2
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
  - number: '14'
    text: |-
      Indien aan twee of meer producenten van fonogrammen of van eerste vastleggingen van films of omroeporganisaties een
      gemeenschappelijk recht ten aanzien van eenzelfde fonogram, eerste vastlegging van een film of programma toekomt,
      kan de handhaving van dit recht door ieder van hen geschieden, tenzij anders is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel14
  - number: 14a
    text: |-
      Op het recht toestemming te verlenen voor het openbaar maken door middel van het doorgeven
      van op grond van deze wet beschermd materiaal via de kabel of langs andere weg, zijn de
      [artikelen 26a tot en met 26c van de Auteurswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel26a
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 26a
  - number: 14b
    text: |-
      Wanneer een omroeporganisatie de programmadragende signalen rechtstreeks aanlevert bij degene die de uitzending van
      op grond van deze wet beschermd materiaal via de kabel of langs andere weg verzorgt zonder dat de omroeporganisatie
      de signalen zelf gelijktijdig uitzendt, is er sprake van een enkele mededeling aan het publiek van in een radio
      of televisieprogramma opgenomen op grond van deze wet beschermd materiaal waarvoor de omroeporganisatie en degene
      die de programmadragende signalen uitzendt ieder voor zijn eigen bijdrage aan die mededeling aan het publiek
      verantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel14b
  - number: '15.1'
    text: |-
      De betaling van de in [artikel 7][ref1] bedoelde billijke vergoeding dient te geschieden aan een door Onze Minister
      van Justitie en Veiligheid aan te wijzen representatieve rechtspersoon die met uitsluiting van anderen met de
      inning en verdeling van deze vergoeding is belast. Ten aanzien van de vaststelling van de hoogte van de vergoeding
      en de inning daarvan alsmede de uitoefening van het uitsluitend recht vertegenwoordigt de in de vorige zin bedoelde
      rechtspersoon de rechthebbenden in en buiten rechte.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel7
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '7'
        hoofdstuk: '2'
  - number: '15.2'
    text: |-
