  - number: 15f
    text: |-
      De voorzieningenrechter kan op vordering van de rechthebbende, bedoeld in de [artikelen 2][ref1], [6][ref2],
      [7a][ref3], [7b][ref4] en [8][ref5], tijdelijke voortzetting van de vermeende inbreuk toestaan onder de voorwaarde
      dat zekerheid wordt gesteld voor vergoeding van de door de rechthebbende geleden schade. Onder dezelfde voorwaarden
      kan de rechter voortzetting van de dienstverlening door de tussenpersoon als bedoeld in [artikel 15e][ref6]
      toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
