  - number: 15g.1
    text: |-
      De betaling van de in [artikel 9b, eerste lid][ref1] bedoelde vergoeding geschiedt aan een door Onze Minister
      van Justitie en Veiligheid, in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschap aan te
      wijzen rechtspersoon. Deze rechtspersoon is met uitsluiting van anderen belast met de inning en verdeling van de
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel9b
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 9b
        hoofdstuk: '2'
  - number: 15g.2
    text: |-
      Degene die is verplicht tot betaling van de in [artikel 9b, eerste lid][ref1] bedoelde vergoeding verschaft de
      gerechtigde tot die vergoeding op zijn verzoek alle informatie die noodzakelijk is ter verkrijging van de betaling.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel9b
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 9b
        hoofdstuk: '2'
  - number: 15g.3
    text: |-
      Degene die is verplicht tot betaling van de in [artikel 9b, eerste lid][ref1] bedoelde vergoeding, doet, voor
      zover geen ander tijdstip is overeengekomen, vóór 1 april van ieder kalenderjaar aan de in het eerste lid bedoelde
      rechtspersoon opgave van de inkomsten die hij met het fonogram heeft verkregen. Hij is voorts gehouden desgevraagd
      aan deze rechtspersoon onverwijld de bescheiden of andere informatiedragers ter inzage te geven, waarvan
      kennisneming noodzakelijk is voor de vaststelling van de verschuldigdheid en de hoogte van de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel9b
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 9b
        hoofdstuk: '2'
  - number: 15g.4
    text: |-
      Degene die de in het vorige lid bedoelde opgave opzettelijk nalaat dan wel in die opgave opzettelijk een onjuiste
      of onvolledige mededeling doet, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete van de derde
      categorie. Het feit wordt beschouwd als een overtreding.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel15g
  - number: '16.1'
    text: In passende gevallen kan de rechter de schadevergoeding vaststellen als een forfaitair bedrag.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel16
  - number: '16.2'
    text: |-
      Naast schadevergoeding kan de rechthebbende, bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3], [7b][ref4]
      en [8][ref5], vorderen dat degene die inbreuk op zijn recht heeft gemaakt wordt veroordeeld de door deze
      tengevolge van de inbreuk genoten winst af te dragen en dienaangaande rekening en verantwoording af te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
