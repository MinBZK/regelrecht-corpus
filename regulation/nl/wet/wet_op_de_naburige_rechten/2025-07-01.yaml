  - number: 15a.1
    text: |-
      De betaling van de in de [artikelen 2][ref1], [6][ref2], [7a][ref3] en [8][ref4] bedoelde vergoeding dient
      te geschieden aan een door Onze Minister van Justitie en Veiligheid in overeenstemming met Onze Minister van
