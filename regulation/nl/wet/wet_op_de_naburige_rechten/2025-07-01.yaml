  - number: '11'
    text: |-
      Als inbreuk op de rechten, bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3], en [8][ref4], wordt niet
      beschouwd het reproduceren van een opname van een uitvoering, fonogram, eerste vastlegging van een film, of
      opname van een programma, of een reproductie daarvan, mits het reproduceren geschiedt zonder direct of indirect
      commercieel oogmerk en uitsluitend dient tot eigen oefening, studie of gebruik van een natuurlijke persoon die
      de reproductie vervaardigt; de [artikelen 16c, tweede tot en met zevende lid][ref5], [16d tot en met 16ga][ref6],
      [17d][ref7] en [35c van de Auteurswet][ref8] zijn van overeenkomstige toepassing.


