      - id: ref2
        bwb_id: BWBR0005921
        artikel: '5'
        hoofdstuk: '2'
  - number: 10.c
    text: |-
      het door middel van een besloten netwerk beschikbaar stellen van een opname van een uitvoering, fonogram, eerste
      vastlegging van een film, perspublicatie, of opname van een programma, of een reproductie daarvan, dat onderdeel
      uitmaakt van verzamelingen van voor het publiek toegankelijke bibliotheken en musea of archieven die niet het
      behalen van een direct of indirect economisch of commercieel voordeel nastreven, door middel van daarvoor bestemde
      terminals in de gebouwen van die instellingen aan individuele leden van het publiek voor onderzoek of privé-studie,
      tenzij anders is overeengekomen;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
  - number: 10.d
    text: |-
      de verslaggeving in het openbaar in een foto-, film-, radio- of televisiereportage over actuele
      gebeurtenissen, voorzover zulks voor het behoorlijk weergeven van de actuele gebeurtenis die het onderwerp
      van de reportage uitmaakt gerechtvaardigd is en mits slechts gebruik wordt gemaakt van korte fragmenten;
      [artikel 16a van de Auteurswet][ref1] is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16a
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16a
  - number: 10.e
    text: |-
      de handelingen, bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3], [7b][ref4]
      en [8][ref5], die uitsluitend worden verricht ter toelichting bij het onderwijs,
      voor zover dit door het beoogde, niet commerciële doel wordt gerechtvaardigd; de
      [artikelen 16, eerste lid, onder 1°, 2°, 4° en 5°, tweede, derde, vijfde en zesde lid][ref6], en
      [47d, eerste lid, van de Auteurswet][ref7] zijn van overeenkomstige toepassing; ten aanzien van een uitvoering
      dient [artikel 5][ref8] in acht genomen te worden;


