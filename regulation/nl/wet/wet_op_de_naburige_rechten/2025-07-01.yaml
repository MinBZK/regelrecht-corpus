  - number: '17.2'
    text: |-
      De bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] betreffende beslag en executie tot afgifte
      van roerende zaken die geen registergoederen zijn, zijn van toepassing. Bij samenloop met een ander beslag gaat
      degene die beslag heeft gelegd krachtens dit artikel voor.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '17.3'
    text: |-
      Tenzij anders is overeengekomen, heeft de licentienemer het recht de uit het eerste lid voortvloeiende bevoegdheden
      uit te oefenen, voor zover deze strekken tot bescherming van de rechten waarvan de uitoefening hem is toegestaan.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel17
  - number: '17.4'
    text: |-
      Gelijke bevoegdheid tot opeising, dan wel tot onttrekking aan het handelsverkeer, vernietiging of onbruikbaarmaking
      alsmede tot afgifte teneinde tot vernietiging of onbruikbaarmaking over te gaan, bestaat ten aanzien van
      inrichtingen, producten en onderdelen als bedoeld in [artikel 19][ref1] en reproducties als bedoeld in
      [artikel 19a][ref2], die geen registergoederen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel19a
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '19'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: 19a
        hoofdstuk: '3'
  - number: '17.5'
    text: |-
      De maatregelen bedoeld in het eerste en vierde lid worden op kosten van de verweerder uitgevoerd, tenzij bijzondere
      redenen dit beletten.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel17
  - number: '17.6'
    text: |-
      De rechter kan op vordering van de rechthebbende bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3],
      [7b][ref4] en [8][ref5], degene die inbreuk op diens recht heeft gemaakt, bevelen al hetgeen hem bekend is
      omtrent de herkomst en distributiekanalen van de goederen of diensten die inbreuk maken, aan de gerechtigde mee
      te delen en alle daarop betrekking hebbende gegevens aan deze te verstrekken. Onder dezelfde voorwaarden kan
      dit bevel worden gegeven aan een derde die op commerciële schaal inbreukmakende goederen in zijn bezit heeft of
      gebruikt, die op commerciële schaal diensten verleent die bij de inbreuk worden gebruikt, of die door een van
      deze derden is aangewezen als zijnde betrokken bij de productie, fabricage of distributie van deze goederen of
      bij het verlenen van deze diensten. Deze derde kan zich verschonen van het verstrekken van informatie die bewijs
      zou vormen van deelname aan een inbreuk op een recht van intellectuele eigendom door hem zelf of door de andere in
      [artikel 165, derde lid, Wetboek van Burgerlijke Rechtsvordering][ref6] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel7b
      [ref5]: https://wetten.overheid.nl/BWBR0005921#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
