        artikel: '22'
        hoofdstuk: '4'
  - number: '24'
    text: |-
      Hij, die een voorwerp waarvan hij redelijkerwijs kan vermoeden dat daarin met inbreuk op de rechten als bedoeld in
      de [artikelen 2][ref1], [6][ref2], [7a][ref3] en [8][ref4] van deze wet een opname van een uitvoering, fonogram,
      eerste vastlegging van een film of een opname van een programma, of een reproductie daarvan, is vervat,


