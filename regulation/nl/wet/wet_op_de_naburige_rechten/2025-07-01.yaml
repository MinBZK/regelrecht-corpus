        artikel: '8'
        hoofdstuk: '2'
  - number: '16.3'
    text: |-
      De rechthebbende kan de in het tweede lid bedoelde vorderingen of een van deze ook namens of mede namens een
      licentienemer instellen, onverminderd de bevoegdheid van deze laatste in een al of niet namens hem of mede namens
      hem door de rechthebbende ingesteld geding tussen te komen om rechtstreeks de door hem geleden schade vergoed te
      krijgen of om zich een evenredig deel van de door de verweerder af te dragen winst te doen toewijzen. De in het
      tweede lid bedoelde vorderingen of een van deze kan een licentienemer slechts instellen als hij de bevoegdheid
      daartoe heeft bedongen.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel16
  - number: '17.1'
    text: |-
      De rechten, bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3], [7b][ref4] en [8][ref5], geven de
      bevoegdheid om opnamen of reproducties daarvan die in strijd met die rechten in het verkeer zijn gebracht alsmede
      niet geoorloofde opnamen of reproducties, als zijn eigendom op te eisen dan wel onttrekking aan het handelsverkeer,
      vernietiging of onbruikbaarmaking daarvan te vorderen. Gelijke bevoegdheid bestaat ten aanzien van roerende
      zaken die geen registergoederen zijn en die rechtstreeks hebben gediend tot de vervaardiging van de in de eerste
      zin bedoelde opnamen of reproducties. Bevoegdheid tot opeising bestaat tevens ten aanzien van gelden waarvan
      aannemelijk is dat zij zijn verkregen door of als gevolg van inbreuk op een van de in de [artikelen 2][ref6],
      [6][ref7], [7a][ref8], [7b][ref9] en [8][ref10] bedoelde rechten. Teneinde tot vernietiging of onbruikbaarmaking
      over te gaan, kan de gerechtigde de afgifte van deze zaken vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel7b
      [ref5]: https://wetten.overheid.nl/BWBR0005921#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref7]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref8]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref9]: https://wetten.overheid.nl/BWBR0005921#Artikel7b
      [ref10]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel17
