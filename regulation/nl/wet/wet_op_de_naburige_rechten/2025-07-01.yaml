$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_naburige_rechten
regulatory_layer: WET
publication_date: '2025-11-26'
valid_from: '2025-07-01'
bwb_id: BWBR0005921
url: https://wetten.overheid.nl/BWBR0005921/2025-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in verband met het voornemen toe te treden tot het in 1961 te Rome
    gesloten Internationaal Verdrag inzake de bescherming van uitvoerende kunstenaars, producenten van fonogrammen en
    omroeporganisaties (Trb. 1986, 182) en de in 1971 te Genève gesloten Overeenkomst ter bescherming van producenten
    van fonogrammen tegen het ongeoorloofd kopiëren van hun fonogrammen (Trb. 1986, 183) wenselijk is regelen te
    treffen inzake de bescherming van uitvoerende kunstenaars, producenten van fonogrammen en omroeporganisaties en dat
    het voorts in verband hiermee wenselijk is de Auteurswet 1912 te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.a
    text: |-
      **uitvoerende kunstenaar**: de toneelspeler, zanger, musicus, danser en iedere andere persoon die een werk van
      letterkunde, wetenschap of kunst of een uiting van folklore opvoert, zingt, voordraagt of op enige andere wijze
      uitvoert, alsmede de artiest, die een variété- of circusnummer of een poppenspel uitvoert;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.b
    text: |-
      **opnemen**: geluiden, beelden of een combinatie daarvan voor de eerste maal vastleggen op enig voorwerp dat
      geschikt is om deze te reproduceren of openbaar te maken;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.c
    text: '**fonogram**: iedere opname van uitsluitend geluiden van een uitvoering of andere geluiden;'
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.d
    text: |-
      **producent van fonogrammen**: de natuurlijke of rechtspersoon die een fonogram voor de eerste maal vervaardigt of
      doet vervaardigen;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.e
    text: |-
      **omroeporganisatie**: een instelling, die in overeenstemming met de wetgeving van het land waar de uitzending
      plaatsvindt, programma’s verzorgt en onder haar verantwoordelijkheid uitzendt of doet uitzenden;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.f
    text: |-
      **reproduceren**: de directe of indirecte, tijdelijke of duurzame, volledige of gedeeltelijke reproductie van
      een opname of een reproductie daarvan, met welke middelen en in welke vorm ook; onder reproduceren wordt niet
      verstaan de tijdelijke reproductie die van voorbijgaande of incidentele aard is, en die een integraal en essentieel
      onderdeel vormt van een technisch procédé dat wordt toegepast met als enig doel de doorgifte in een netwerk tussen
      derden door een tussenpersoon of een rechtmatig gebruik mogelijk te maken, en die geen zelfstandige economische
      waarde bezit;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.g
    text: |-
      **uitzenden**: het verspreiden van programma’s door middel van een omroepzender als
      bedoeld in [artikel 1.1 van de Mediawet 2008][ref1] of een omroepnetwerk als bedoeld in
      [artikel 1.1 van de Mediawet 2008][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 1.h
    text: |-
      **doorgeven via de kabel**: de gelijktijdige, ongewijzigde en integrale doorgifte, door middel van een kabel- of
      microgolfsysteem, aan het publiek, van een oorspronkelijke uitzending, al dan niet via de ether, ook per satelliet,
      van in een radio of televisieprogramma opgenomen op grond van deze wet beschermd materiaal, die voor ontvangst door
      het publiek bestemd is, ongeacht de wijze waarop degene die de doorgifte via de kabel verzorgt de programmadragende
      signalen van de omroeporganisatie ten behoeve van de doorgifte verkrijgt;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.i
    text: '**programma**: een uitgezonden radio- of televisieprogramma, of -programma-onderdeel;'
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.j
    text: |-
      **verhuren**: het voor een beperkte tijd en tegen een direct of indirect economisch of commercieel voordeel voor
      gebruik ter beschikking stellen;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.k
    text: |-
      **uitlenen**: het voor een beperkte tijd en zonder direct of indirect economisch of commercieel voordeel voor
      gebruik ter beschikking stellen door voor het publiek toegankelijke instellingen;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.l
    text: '**uitvoering**: de activiteit van de uitvoerend kunstenaar als zodanig;'
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.m
    text: |-
      **beschikbaar stellen voor het publiek**: op grond van deze wet beschermd materiaal per draad of draadloos voor
      leden van het publiek beschikbaar stellen op zodanige wijze dat zij daartoe op een door hen individueel gekozen
      plaats en tijd toegang toe hebben;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.n
    text: |-
      **technische voorzieningen**: technologie, inrichtingen of onderdelen die in het kader van hun normale werking
      dienen voor het voorkomen of beperken van handelingen ten aanzien van het op grond van deze wet beschermd
      materiaal, die door de uitvoerend kunstenaar, producent van fonogrammen, producent van eerste vastleggingen van
      films uitgever van perspublicaties, of omroeporganisatie niet zijn toegestaan; technische voorzieningen worden
      geacht «doeltreffend» te zijn indien het gebruik van op grond van deze wet beschermd materiaal door de uitvoerend
      kunstenaar, producent van fonogrammen, producent van eerste vastleggingen van films uitgever van perspublicaties,
      of omroeporganisatie, of hun rechtverkrijgenden, wordt beheerst door middel van toegangscontrole of door toepassing
      van een beschermingsprocédé zoals encryptie, vervorming of andere transformatie van op grond van deze wet beschermd
      materiaal of een kopieerbeveiliging die de beoogde bescherming bereikt;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.o
    text: |-
      **informatie betreffende het beheer van rechten**: alle door de uitvoerende kunstenaar, producent van fonogrammen,
      producent van eerste vastleggingen van films, uitgever van perspublicaties, of omroeporganisaties, en hun
      rechtverkrijgenden verstrekte informatie, welke is verbonden met een reproductie van op grond van deze wet
      beschermd materiaal of bij de openbaarmaking dan wel het in het verkeer brengen daarvan is bekend gemaakt, die
      dient ter identificatie van dat materiaal, of informatie betreffende de voorwaarden voor het gebruik van het op
      grond van deze wet beschermd materiaal alsmede de cijfers of codes waarin die informatie is vervat;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.p
    text: |-
      **doorgeven langs andere weg**: de gelijktijdige, ongewijzigde en integrale doorgifte anders dan het doorgeven
      via de kabel, bedoeld in onderdeel h, aan het publiek, van een oorspronkelijke uitzending, per draad of via de
      ether, met inbegrip van satellietuitzending, met uitzondering van een online uitzending, van in een radio- of
      televisieprogramma opgenomen op grond van deze wet beschermd materiaal, die voor het publiek bestemd is, ongeacht
      de wijze waarop degene die de doorgifte verzorgt de programmadragende signalen van de omroeporganisatie ten
      behoeve van de doorgifte verkrijgt; de tweede volzin van [artikel 12, negende lid, van de Auteurswet][ref1] is van
      overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel12
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '12'
  - number: 1.q
    text: |-
      **ondersteunende onlinedienst**: het online aanbieden van radio- of televisieprogramma’s gelijktijdig met of voor
      een bepaalde periode na de uitzending ervan door een omroeporganisatie, alsmede van materiaal dat een ondersteuning
      vormt van die uitzending;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.r
    text: |-
      **perspublicatie**: een verzameling die voornamelijk bestaat uit literaire werken van journalistieke aard maar ook
      andere werken of op grond van de [Databankenwet][ref1] of deze wet beschermde prestaties kan omvatten, en die


      [ref1]: https://wetten.overheid.nl/BWBR0010591
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0010591
  - number: 1.r.1°
    text: |-
      een afzonderlijk element onder één titel vormt in een periodiek uitgegeven of regelmatig bijgewerkte publicatie,
      zoals een krant of een tijdschrift met een algemene of specifieke inhoud;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.r.2°
    text: als doel heeft het algemene publiek informatie te verstrekken over nieuws of andere onderwerpen; en
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.r.3°
    text: |-
      via een medium wordt gepubliceerd op initiatief van en onder redactionele verantwoordelijkheid en controle van
      een dienstverlener;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.s
    text: |-
      **aanbieder van een onlinedienst voor het delen van inhoud**: een aanbieder van een dienst van de
      informatiemaatschappij die als belangrijkste of een van de belangrijkste doelstellingen heeft een grote hoeveelheid
      door de gebruikers van de dienst aangeboden opnames van uitvoeringen, fonogrammen, eerste vastleggingen van films,
      opnames van programma’s, of reproducties daarvan, op te slaan en toegankelijk te maken voor het publiek, waarbij
      hij die op grond van deze wet beschermde prestaties ordent en promoot met een winstoogmerk; aanbieders van diensten
      als online-encyclopedieën zonder winstoogmerk, onderwijs- of wetenschappelijke gegevensbanken zonder winstoogmerk,
      platforms voor het ontwikkelen en delen van opensourcesoftware, aanbieders van elektronische communicatiediensten,
      onlinemarktplaatsen en business-to-business clouddiensten en clouddiensten waarmee gebruikers informatie kunnen
      uploaden voor eigen gebruik, zijn geen aanbieders van een onlinedienst voor het delen van inhoud;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.t
    text: |-
      **onderzoeksorganisatie**: een universiteit, inclusief de bibliotheken ervan, een onderzoeksinstelling of een
      andere entiteit die hoofdzakelijk tot doel heeft wetenschappelijk onderzoek te verrichten of onderwijsactiviteiten
      te verrichten die ook de verrichting van wetenschappelijk onderzoek omvatten:
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.t.1°
    text: zonder winstoogmerk of door herinvestering van alle winst in haar wetenschappelijk onderzoek, of
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.t.2°
    text: |-
      op grond van een door een staat die partij is bij de Europese Unie of Europese Economische Ruimte, erkende taak van
      algemeen belang;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.u
    text: |-
      **tekst- en datamining**: een geautomatiseerde analysetechniek die gericht is op de ontleding van tekst en gegevens
      in digitale vorm om informatie te genereren zoals, maar niet uitsluitend, patronen, trends en onderlinge verbanden;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1.v
    text: |-
      **instelling voor cultureel erfgoed**: een voor het publiek toegankelijke bibliotheek of een voor het publiek
      toegankelijk museum, een archief of een instelling voor cinematografisch of audio(visueel) erfgoed.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1
  - number: 1a
    text: |-
      Behoudens bewijs van het tegendeel wordt voor de houder van een naburig recht gehouden degene die op of in het op
      grond van deze wet beschermde materiaal als zodanig is aangeduid, of bij gebreke van een dergelijke aanduiding,
      degene die bij de openbaarmaking of het in het verkeer brengen van dit materiaal als uitvoerende kunstenaar,
      producent van fonogrammen, producent van eerste vastleggingen van films, uitgever van een perspublicatie of
      omroeporganisatie, daarvan is bekend gemaakt door degene die het materiaal openbaar maakt of in het verkeer brengt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel1a
  - number: '2.1'
    text: |-
      De uitvoerende kunstenaar heeft het uitsluitend recht om toestemming te verlenen voor een of meer van de volgende
      handelingen:
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
  - number: 2.1.a
    text: het opnemen van een uitvoering;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
  - number: 2.1.b
    text: het reproduceren van een opname van een uitvoering;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
  - number: 2.1.c
    text: |-
      het verkopen, verhuren, uitlenen, afleveren of anderszins in het verkeer brengen van een opname van een uitvoering
      of van een reproduktie daarvan dan wel het voor die doeleinden invoeren, aanbieden of in voorraad hebben;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
  - number: 2.1.d
    text: |-
      het uitzenden, het openbaar maken door middel van doorgeven via de kabel of langs andere weg, het beschikbaar
      stellen voor het publiek of het op een andere wijze openbaar maken van een uitvoering of een opname van een
      uitvoering of een reproductie daarvan.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
  - number: '2.2'
    text: |-
      Is een opname van een uitvoering of een reproduktie daarvan door de houder van het uitsluitend recht, bedoeld in
      het eerste lid, of met zijn toestemming voor de eerste maal in een van de lid-staten van de Europese Unie of in een
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 in het verkeer
      gebracht door eigendomsoverdracht, dan handelt de verkrijger van die opname of die reproduktie niet in strijd
      met dit uitsluitend recht door ten aanzien daarvan de in het eerste lid, onder *c*, genoemde handelingen, met
      uitzondering van verhuur en uitlening, te verrichten.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
  - number: '2.3'
    text: |-
      Onverminderd het bepaalde in het tweede lid is het uitlenen van de in dat lid bedoelde opname van een uitvoering
      of een reproduktie daarvan toegestaan, mits degene die de uitlening verricht of doet verrichten een billijke
      vergoeding betaalt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
  - number: '2.4'
    text: |-
      Instellingen van onderwijs en instellingen van onderzoek en de aan die instellingen verbonden bibliotheken en de
      Koninklijke Bibliotheek zijn vrijgesteld van de betaling van een vergoeding voor uitlenen als bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
  - number: '2.5'
    text: |-
      Openbare bibliotheekvoorzieningen, die in overwegende mate door gemeenten, provincies of het rijk worden
      gesubsidieerd of in stand gehouden, zijn voor het uitlenen van op basis van [artikel 10, onderdeel i of m][ref1],
      omgezette materialen en op basis van artikel 10, onderdeel o, omgezette materialen die zijn ingevoerd door een
      toegelaten entiteit aan bij die voorzieningen ingeschreven personen met een handicap, vrijgesteld van betaling van
      de vergoeding, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel10
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '10'
        hoofdstuk: '2'
  - number: '2.6'
    text: |-
      De in het derde lid bedoelde vergoeding is niet verschuldigd indien de betalingsplichtige kan aantonen dat de
      houder van het uitsluitend recht afstand heeft gedaan van het recht op een billijke vergoeding. De houder van
      het uitsluitend recht dient de afstand schriftelijk mee te delen aan de in [de artikelen 15][ref1] en [15][ref2]
      bedoelde rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel15b
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 15a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: 15b
        hoofdstuk: '3'
  - number: '2.7'
    text: |-
      Ten aanzien van het in het eerste lid, onder *d*, bepaalde wordt onder openbaar maken mede verstaan de uitvoering
      die plaatsvindt in besloten kring, tenzij deze zich beperkt tot de familie-, vrienden- of daaraan gelijk te stellen
      kring en voor het bijwonen daarvan geen betaling, in welke vorm ook, geschiedt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
  - number: '2.8'
    text: |-
      Onder het openbaar maken van een uitvoering wordt niet begrepen de uitvoering welke uitsluitend gebruikt
      wordt voor het onderwijs dat vanwege de overheid of vanwege een rechtspersoon zonder winstoogmerk wordt
      gegeven, voorzover deze uitvoering deel uitmaakt van het schoolwerkplan, leerplan of instellingswerkplan
      of dient tot een wetenschappelijk doel. De [artikelen 12, vijfde lid, tweede volzin][ref1], en
      [47c, eerste lid, van de Auteurswet][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel47c
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 47c
  - number: '2.9'
    text: |-
      Als afzonderlijke openbaarmaking wordt niet beschouwd de gelijktijdige uitzending van een in een radio- of
      televisieprogramma opgenomen uitvoering of opname van een uitvoering of reproductie daarvan door hetzelfde
      organisme dat dat programma oorspronkelijk uitzendt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2
  - number: 2a.1
    text: |-
      Indien een uitvoerende kunstenaar het verhuurrecht, bedoeld in [artikel 2, eerste lid, onder ][ref1], met
      betrekking tot een op een fonogram opgenomen uitvoering heeft overgedragen aan de producent daarvan, is de
      producent de uitvoerende kunstenaar een billijke vergoeding verschuldigd voor de verhuur.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
  - number: 2a.2
    text: Van het in het eerste lid bedoelde recht op een billijke vergoeding kan geen afstand worden gedaan.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2a
  - number: 2b
    text: |-
      [Hoofdstuk 1a van de Auteurswet][ref1] is van overeenkomstige toepassing op de uitvoerende kunstenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#HoofdstukIa
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        hoofdstuk: Ia
  - number: '3'
    text: |-
      De werkgever is bevoegd de rechten van de uitvoerende kunstenaar, bedoeld in [artikel 2][ref1], te exploiteren,
      voor zover dit tussen partijen is overeengekomen dan wel voortvloeit uit de aard van de tussen hen gesloten
      arbeidsovereenkomst, de gewoonte of de eisen van redelijkheid en billijkheid. Tenzij anders is overeengekomen of
      uit de aard van de overeenkomst, de gewoonte of de eisen van redelijkheid en billijkheid anders voortvloeit, is de
      werkgever aan de uitvoerende kunstenaar of zijn rechtverkrijgende een billijke vergoeding verschuldigd voor iedere
      vorm van exploitatie van diens rechten. De werkgever eerbiedigt de in [artikel 5][ref2] bedoelde rechten van de
      uitvoerende kunstenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel5
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '5'
        hoofdstuk: '2'
  - number: '4.1'
    text: |-
      Op de uitvoering van een uitvoerende kunstenaar, die bestemd is als bijdrage voor de totstandkoming van een
      filmwerk als bedoeld in [artikel 45a van de Auteurswet][ref1], zijn de [artikelen 45a tot en met 45ga][ref2] van
      voornoemde wet van overeenkomstige toepassing met uitzondering van [artikel 45d, tweede lid, derde volzin][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel45a
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel45a
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel45d
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 45a
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 45a
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 45d
  - number: '4.2'
    text: |-
      Op een uitvoerend kunstenaar als bedoeld in het eerste lid die in het filmwerk een hoofdrol vervult, is ook
      [artikel 45d, tweede lid, derde volzin, van de Auteurswet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel45d
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 45d
  - number: '5.1'
    text: |-
      De uitvoerende kunstenaar heeft, zelfs nadat hij zijn in [artikel 2][ref1] bedoelde recht heeft overgedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
  - number: 5.1.a
    text: |-
      het recht zich te verzetten tegen de openbaarmaking van de uitvoering zonder vermelding van zijn naam of andere
      aanduiding als uitvoerende kunstenaar tenzij het verzet zou zijn in strijd met de redelijkheid;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel5
  - number: 5.1.b
    text: |-
      het recht zich te verzetten tegen de openbaarmaking van de uitvoering onder een andere naam dan de zijne, alsmede
      tegen het aanbrengen van enige wijziging in de wijze waarop hij is aangeduid, voorzover deze naam of aanduiding in
      verband met de uitvoering is vermeld of openbaar is gemaakt;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel5
  - number: 5.1.c
    text: |-
      het recht zich te verzetten tegen elke andere wijziging in de uitvoering, tenzij deze wijziging van zodanige aard
      is dat het verzet in strijd zou zijn met de redelijkheid;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel5
  - number: 5.1.d
    text: |-
      het recht zich te verzetten tegen elke misvorming, verminking of andere aantasting van de uitvoering, die nadeel
      zou kunnen toebrengen aan de eer of de naam van de uitvoerende kunstenaar of aan zijn waarde in deze hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel5
  - number: '5.2'
    text: |-
      De in het voorgaande lid genoemde rechten komen na het overlijden van de uitvoerende kunstenaar tot aan
      het vervallen van zijn in [artikel 2][ref1] bedoelde recht toe aan de door hem bij uiterste wilsbeschikking
      aangewezene.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
  - number: '5.3'
    text: Van de in het eerste lid onder *a*-*c* genoemde rechten kan schriftelijk afstand worden gedaan.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel5
  - number: '6.1'
    text: De producent van fonogrammen heeft het uitsluitend recht om toestemming te verlenen voor
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel6
  - number: 6.1.a
    text: het reproduceren van een door hem vervaardigd fonogram;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel6
  - number: 6.1.b
    text: |-
      het verkopen, verhuren, uitlenen, afleveren of anderszins in het verkeer brengen van een door hem vervaardigd
      fonogram of van een reproduktie daarvan dan wel het voor die doeleinden invoeren, aanbieden of in voorraad hebben;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel6
  - number: 6.1.c
    text: |-
      het uitzenden, het openbaar maken door middel van doorgeven via de kabel of langs andere weg, het beschikbaar
      stellen voor het publiek of het op een andere wijze openbaar maken van een door hem vervaardigd fonogram of een
      reproductie daarvan. [Artikel 2, zevende tot en met het negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.2'
    text: |-
      Is een fonogram of een reproduktie daarvan door de houder van het uitsluitend recht, bedoeld in het eerste lid,
      of met zijn toestemming voor de eerste maal in een van de lid-staten van de Europese Unie of in een staat die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van van 2 mei 1992 in het verkeer gebracht
      door eigendomsoverdracht, dan handelt de verkrijger van dat fonogram of die reproduktie niet in strijd met dit
      uitsluitend recht door ten aanzien daarvan de in het eerste lid, onder *b*, genoemde handelingen, met uitzondering
      van verhuur en uitlening, te verrichten.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel6
  - number: '6.3'
    text: |-
      Onverminderd het bepaalde in het tweede lid is het uitlenen van het in dat lid bedoelde fonogram of een reproduktie
      daarvan toegestaan, mits degene die de uitlening verricht of doet verrichten een billijke vergoeding betaalt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel6
  - number: '6.4'
    text: |-
      Instellingen van onderwijs en instellingen van onderzoek en de aan die instellingen verbonden bibliotheken en de
      Koninklijke Bibliotheek zijn vrijgesteld van de betaling van een vergoeding voor uitlenen als bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel6
  - number: '6.5'
    text: |-
      Publiek toegankelijke bibliotheekvoorzieningen, die in overwegende mate door gemeenten, provincies of het rijk
      worden gesubsidieerd of in stand gehouden, zijn voor het uitlenen van op basis van [artikel 10, onderdeel i][ref1],
      omgezette materialen aan bij die voorzieningen ingeschreven personen met een handicap, vrijgesteld van betaling van
      de vergoeding, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel10
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '10'
        hoofdstuk: '2'
  - number: '6.6'
    text: |-
      De in het derde lid bedoelde vergoeding is niet verschuldigd indien de betalingsplichtige kan aantonen dat de
      houder van het uitsluitend recht afstand heeft gedaan van het recht op een billijke vergoeding. De houder van
      het uitsluitend recht dient de afstand schriftelijk mee te delen aan de in de [artikelen 15][ref1] en [15][ref2]
      bedoelde rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel15b
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 15a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: 15b
        hoofdstuk: '3'
  - number: '7.1'
    text: |-
      Een voor commerciële doeleinden uitgebracht fonogram of een reproduktie daarvan kan zonder toestemming van de
      producent van het fonogram en de uitvoerende kunstenaar of hun rechtverkrijgenden worden uitgezonden, openbaar
      maken door middel van doorgeven via de kabel of langs andere weg, dan wel op een andere wijze openbaar gemaakt,
      mits daarvoor een billijke vergoeding wordt betaald. Het in het eerste volzin bepaalde is niet van toepassing op
      het beschikbaar stellen voor het publiek van een dergelijk fonogram.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7
  - number: '7.2'
    text: |-
      Voor de toepassing van het eerste lid wordt onder een voor commerciële doeleinden uitgebracht fonogram mede
      begrepen een fonogram dat beschikbaar wordt gesteld voor het publiek.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7
  - number: '7.3'
    text: |-
      Bij gebreke van overeenstemming over de hoogte van de billijke vergoeding is de rechtbank Den Haag in eerste aanleg
      bij uitsluiting bevoegd om op vordering van de meest gerede partij de hoogte van de vergoeding vast te stellen.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7
  - number: '7.4'
    text: |-
      De vergoeding komt toe aan zowel de uitvoerende kunstenaar als de producent of hun rechtverkrijgenden en wordt
      tussen hen gelijkelijk verdeeld.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7
  - number: 7a.1
    text: 'De producent van de eerste vastleggingen van films heeft het uitsluitend recht om toestemming te verlenen voor:'
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7a
  - number: 7a.1.a
    text: het reproduceren van een door hem vervaardigde eerste vastlegging van een film of van een reproduktie daarvan;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7a
  - number: 7a.1.b
    text: |-
      het verkopen, verhuren, uitlenen, afleveren of anderszins in het verkeer brengen van een door hem vervaardigde
      eerste vastlegging van een film of een reproduktie daarvan, dan wel het voor die doeleinden invoeren, aanbieden of
      in voorraad hebben;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7a
  - number: 7a.1.c
    text: |-
      het beschikbaar stellen voor het publiek van een door hem vervaardigde eerste vastlegging van een film of een
      reproductie daarvan.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7a
  - number: 7a.2
    text: |-
      Is een eerste vastlegging van een film of een reproduktie daarvan door de houder van het uitsluitend recht, bedoeld
      in het eerste lid, of met zijn toestemming voor de eerste maal in een van de lid-staten van de Europese Unie of
      in een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 in het
      verkeer gebracht door eigendomsoverdracht, dan handelt de verkrijger van die eerste vastlegging of die reproduktie
      niet in strijd met dit uitsluitend recht door ten aanzien daarvan de in het eerste lid, onder *b*, genoemde
      handelingen, met uitzondering van verhuur en uitlening, te verrichten.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7a
  - number: 7a.3
    text: |-
      Onverminderd het bepaalde in het tweede lid is het uitlenen van de in dat lid bedoelde eerste vastlegging of een
      reproduktie daarvan toegestaan, mits degene die de uitlening verricht of doet verrichten een billijke vergoeding
      betaalt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7a
  - number: 7a.4
    text: |-
      Instellingen van onderwijs en instellingen van onderzoek en de aan die instellingen verbonden bibliotheken en de
      Koninklijke Bibliotheek zijn vrijgesteld van de betaling van een vergoeding voor uitlenen als bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7a
  - number: 7a.5
    text: |-
      Publiek toegankelijke bibliotheekvoorzieningen, die in overwegende mate door gemeenten, provincies of het rijk
      worden gesubsidieerd of in stand gehouden, zijn voor het uitlenen van op basis van [artikel 10, onderdeel i][ref1],
      omgezette materialen aan bij die voorzieningen ingeschreven personen met een handicap, vrijgesteld van betaling van
      de vergoeding, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel10
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '10'
        hoofdstuk: '2'
  - number: 7a.6
    text: |-
      De in het derde lid bedoelde vergoeding is niet verschuldigd indien de betalingsplichtige kan aantonen dat de
      houder van het uitsluitend recht afstand heeft gedaan van het recht op een billijke vergoeding. De houder van
      het uitsluitend recht dient de afstand schriftelijk mee te delen aan de in de [artikelen 15][ref1] en [15][ref2]
      bedoelde rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel15b
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 15a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: 15b
        hoofdstuk: '3'
  - number: 7b.1
    text: |-
      De uitgever van een perspublicatie heeft het uitsluitende recht om toestemming te verlenen voor een of meer van de
      volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7b
  - number: 7b.1.a
    text: |-
      het reproduceren van zijn perspublicatie voor online gebruik door een dienstverlener van de informatiemaatschappij;
      en
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7b
  - number: 7b.1.b
    text: |-
      het beschikbaar stellen voor het publiek van zijn perspublicatie voor online gebruik door een dienstverlener van
      de informatiemaatschappij.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7b
  - number: 7b.2
    text: |-
      Het in het eerste lid bedoelde uitsluitende recht om toestemming te verlenen is niet van toepassing op een of meer
      van de volgende handelingen:
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7b
  - number: 7b.2.a
    text: het privé of niet commercieel gebruik van een perspublicatie door individuele gebruikers;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7b
  - number: 7b.2.b
    text: het hyperlinken naar een perspublicatie;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7b
  - number: 7b.2.c
    text: het gebruik van enkele woorden of heel korte fragmenten uit een perspublicatie; en
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7b
  - number: 7b.2.d
    text: |-
      het gebruik van een werk, een opname van een uitvoering of een reproductie daarvan, een fonogram of een reproductie
      daarvan, een opname van een programma of een reproductie daarvan, een film of een reproductie daarvan, een
      perspublicatie of een reproductie daarvan, of een databank waarvan de beschermingsduur is verstreken en die is
      opgenomen in een perspublicatie.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7b
  - number: 7b.3
    text: |-
      Het in het eerste lid bedoelde recht om toestemming te verlenen kan niet worden ingeroepen tegen een maker,
      uitvoerende kunstenaar, producent van fonogrammen, omroeporganisatie, producent van eerste vastleggingen van
      films, en producent van een databank waarvan het werk, de opname van een uitvoering of een reproductie daarvan,
      het fonogram of een reproductie daarvan, de opname van een programma of een reproductie daarvan, de film of een
      reproductie daarvan, of databank is opgenomen in de perspublicatie.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7b
  - number: 7b.4
    text: |-
      Wanneer een werk, een opname van een uitvoering of een reproductie daarvan, een fonogram of een reproductie
      daarvan, een opname van een programma of een reproductie daarvan, een film of een reproductie daarvan, een
      perspublicatie of een reproductie daarvan, of een databank is opgenomen in een perspublicatie op basis van
      een niet-exclusieve licentie, dan mag het in eerste lid bedoelde recht om toestemming te verlenen niet worden
      ingeroepen jegens een dienstverlener van de informatiemaatschappij die voor het gebruik van die prestaties ook
      toestemming heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7b
  - number: 7b.5
    text: |-
      De maker van een in een perspublicatie opgenomen werk van letterkunde, wetenschap of kunst krijgt een passend
      aandeel van de vergoeding die de uitgever ontvangt voor het gebruik van de perspublicatie door een dienstverlener
      van de informatiemaatschappij. [Artikel 25g van de Auteurswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25g
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 25g
  - number: '8.1'
    text: |-
      Een omroeporganisatie heeft het uitsluitend recht om toestemming te verlenen voor een of meer van de volgende
      handelingen:
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel8
  - number: 8.1.a
    text: het openbaar maken van programma’s door middel van doorgeven via de kabel of langs andere weg;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel8
  - number: 8.1.b
    text: het opnemen van programma’s en het reproduceren van een dergelijke opname;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel8
  - number: 8.1.c
    text: |-
      het verkopen, verhuren, uitlenen, afleveren of anderszins in het verkeer brengen van een opname van een uitzending
      of van een reproduktie daarvan dan wel het voor die doeleinden invoeren, aanbieden of in voorraad hebben;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel8
  - number: 8.1.d
    text: |-
      het openbaarmaken van programma's, indien deze openbaarmaking geschiedt in voor het publiek toegankelijke plaatsen
      tegen betaling van entreegeld, ongeacht welke technische hulpmiddelen daarbij worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel8
  - number: 8.1.e
    text: |-
      het beschikbaar stellen voor het publiek of op andere wijze openbaar maken van opnamen van
      programma's of reproducties daarvan, ongeacht welke technische hulpmiddelen daarbij worden gebruikt.
      [Artikel 2, zevende tot en met negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
  - number: '8.2'
    text: |-
      Is een opname van een uitzending of een reproduktie daarvan door de houder van het uitsluitend recht, bedoeld in
      het eerste lid, of met zijn toestemming voor de eerste maal in een van de lid-staten van de Europese Unie of in een
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 in het verkeer
      gebracht door eigendomsoverdracht, dan handelt de verkrijger van die opname of die reproduktie niet in strijd
      met dit uitsluitend recht door ten aanzien daarvan de in het eerste lid, onder *c*, genoemde handelingen, met
      uitzondering van verhuur en uitlening, te verrichten.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel8
  - number: '8.3'
    text: |-
      Onverminderd het bepaalde in het tweede lid is het uitlenen van de in dat lid bedoelde opname van een uitzending of
      een reproduktie daarvan toegestaan mits degene die de uitlening verricht of doet verrichten een billijke vergoeding
      betaalt.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel8
  - number: '8.4'
    text: |-
      Instellingen van onderwijs en instellingen van onderzoek en de aan die instellingen verbonden bibliotheken en de
      Koninklijke Bibliotheek zijn vrijgesteld van de betaling van een vergoeding voor uitlenen als bedoeld in het derde
      lid.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel8
  - number: '8.5'
    text: |-
      Publiek toegankelijke bibliotheekvoorzieningen, die in overwegende mate door gemeenten, provincies of het rijk
      worden gesubsidieerd of in stand gehouden, zijn voor het uitlenen van op basis van [artikel 10, onderdeel i][ref1],
      omgezette materialen aan bij die voorzieningen ingeschreven personen met een handicap, vrijgesteld van betaling van
      de vergoeding, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel10
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '10'
        hoofdstuk: '2'
  - number: '8.6'
    text: |-
      De in het derde lid bedoelde vergoeding is niet verschuldigd indien de betalingsplichtige kan aantonen dat de
      houder van het uitsluitend recht afstand heeft gedaan van het recht op een billijke vergoeding. De houder van het
      uitsluitend recht dient de afstand schriftelijk mee te delen aan de in de [artikelen 15a][ref1] en [15b][ref2]
      bedoelde rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel15b
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: 15a
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: 15b
        hoofdstuk: '3'
  - number: '9.1'
    text: |-
      De rechten die deze wet verleent gaan over bij erfopvolging. Deze rechten zijn vatbaar voor gehele of gedeeltelijke
      overdracht. Voor het verrichten van handelingen als bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3],
      [7b][ref4] en [8][ref5] kan voor het geheel of een gedeelte van het uitsluitend recht een licentie worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel7b
      [ref5]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0005921
        artikel: 7a
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0005921
        artikel: 7b
        hoofdstuk: '2'
      - id: ref5
        bwb_id: BWBR0005921
        artikel: '8'
        hoofdstuk: '2'
  - number: '9.2'
    text: |-
      De levering vereist voor gehele of gedeeltelijke overdracht, alsmede het verlenen van een exclusieve licentie,
      geschiedt door een daartoe bestemde akte.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel9
  - number: '9.3'
    text: |-
      De overdracht of het verlenen van een exclusieve licentie door de uitvoerende kunstenaar of de natuurlijke persoon
      die het uitsluitend recht als bedoeld in [artikel 2][ref1] als erfgenaam of legataris heeft verkregen omvat alleen
      die bevoegdheden waarvan dit in de akte is vermeld of uit de aard of de strekking van de titel noodzakelijkerwijs
      voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
  - number: 9a
    text: |-
      De in [artikel 25e, derde lid van de Auteurswet][ref1] genoemde termijn bedraagt te allen tijde ten minste één
      jaar indien:


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25e
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 25e
  - number: 9a.a
    text: |-
      de in [artikel 9, eerste lid][ref1] bedoelde overdracht behelst een overdracht door een uitvoerende kunstenaar van
      zijn rechten op de uitvoering van een muziekwerk aan de producent van een fonogram, en


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel9
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '9'
        hoofdstuk: '2'
  - number: 9a.b
    text: |-
      sinds het fonogram is openbaar gemaakt dan wel op rechtmatige wijze in het verkeer is gebracht ten minste 50 jaar
      zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel9a
  - number: 9b.1
    text: |-
      Indien de in [artikel 9, eerste lid][ref1] bedoelde overdracht behelst de overdracht van de rechten van
      zijn uitvoering aan de producent van een fonogram, en bij die overdracht een niet-periodieke vergoeding is
      overeengekomen, heeft de uitvoerende kunstenaar, of in het geval van meerdere uitvoerende kunstenaars, de
      uitvoerende kunstenaars gezamenlijk het recht om van die producent een jaarlijkse aanvullende vergoeding te
      ontvangen voor ieder volledig jaar volgend op het 50ste jaar nadat dat fonogram voor het eerst op rechtmatige wijze
      in het verkeer is gebracht, of indien dit eerder valt, is openbaar gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel9
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '9'
        hoofdstuk: '2'
  - number: 9b.2
    text: |-
      De in het vorige lid bedoelde vergoeding bedraagt 20 procent van de inkomsten die de producent van het fonogram
      heeft verkregen met de reproductie, verspreiding en beschikbaarstelling van het fonogram in het jaar voorafgaand
      aan het jaar waarvoor de vergoeding wordt betaald.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel9b
  - number: 9b.3
    text: |-
      Indien de in [artikel 9, eerste lid][ref1] bedoelde overdracht behelst de overdracht van de rechten op de
      vastlegging van zijn uitvoering aan de producent van een fonogram, en bij die overdracht een periodieke vergoeding
      is overeengekomen, wordt die vergoeding vanaf het jaar volgend op het 50ste jaar nadat dat fonogram voor het eerst
      op rechtmatige wijze in het verkeer is gebracht, of indien dit eerder valt, is openbaar gemaakt, uitgekeerd zonder
      dat daarop contractueel bedongen voorschotten of kortingen worden ingehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel9
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel9b
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '9'
        hoofdstuk: '2'
  - number: 9b.4
    text: Van de in de leden 1 tot en met 3 genoemde rechten kan de uitvoerende kunstenaar geen afstand doen.
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel9b
  - number: 9c
    text: |-
      De rechten, bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3], [7b][ref4] en [8][ref5], zijn niet van
      toepassing op een door of vanwege de openbare macht in het verkeer gebrachte opname van een uitvoering, fonogram,
      eerste vastlegging van een film, perspublicatie, opnamen van een programma, en een reproductie daarvan en openbaar
      gemaakte uitvoering, opname van een uitvoering, fonogram, eerste vastlegging van een film, perspublicatie,
      programma, opname van een programma, en een reproductie daarvan, waarvan de openbare macht de rechthebbende is,
      tenzij de rechten hetzij in het algemeen bij de wet, besluit of verordening, hetzij in een bepaald geval blijkens
      mededeling op of in het op grond van deze wet beschermde materiaal zelf dan wel bij het in het verkeer brengen of
      openbaar maken daarvan uitdrukkelijk zijn voorbehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel7b
      [ref5]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel9c
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005921
        artikel: '6'
        hoofdstuk: '2'
      - id: ref3
