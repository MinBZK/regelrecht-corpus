      - id: ref5
        bwb_id: BWBR0005921
        artikel: '8'
        hoofdstuk: '2'
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '165'
  - number: '17.7'
    text: |-
      Bij de beoordeling van de maatregelen die de rechthebbende, bedoeld in de [artikelen 2][ref1], [6][ref2],
      [7a][ref3], [7b][ref4] en [8][ref5], of diens licentienemer kan vorderen ingevolge de bevoegdheden, genoemd in het
      eerste en vierde lid, houdt de rechter rekening met de noodzakelijke evenredigheid tussen de ernst van de inbreuk
      en de gevorderde maatregelen en met de belangen van derden.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel7b
      [ref5]: https://wetten.overheid.nl/BWBR0005921#Artikel8
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
