  - number: '19.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden vastgesteld die de uitvoerende kunstenaar, producent
      van fonogrammen, producent van films en omroeporganisatie, of hun rechtverkrijgenden, er toe verplichten
      aan de gebruiker van een uitvoering, opname van een uitvoering, fonogram, eerste vastlegging van een film,
      programma en opname van een programma, of een reproductie daarvan, voor het gebruik als omschreven in
      [artikel 10, onderdelen e, f, m, n, p en q][ref1], de nodige middelen te verschaffen om van deze beperkingen te
      profiteren, mits de gebruiker rechtmatig toegang heeft tot door de technische voorziening beschermde uitvoering,
      opname van een uitvoering, fonogram, eerste vastlegging van een film, programma of opname van een programma, of
      reproductie daarvan. [Artikel 17d van de Auteurswet][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel17d
