      van anderen belast is met de inning en de verdeling van deze vergoeding. In aangelegenheden betreffende de
      vaststelling van de hoogte van de vergoeding en de inning daarvan alsmede de uitoefening van het uitsluitende recht
      vertegenwoordigt de in de vorige zin bedoelde rechtspersoon de rechthebbenden in en buiten rechte.


