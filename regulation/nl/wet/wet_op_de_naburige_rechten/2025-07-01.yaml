  - number: 10.a
    text: |-
      het overnemen van op grond van deze wet beschermd materiaal over actuele economische, politieke,
      godsdienstige of levensbeschouwelijke onderwerpen, die in een radio- of televisieprogramma of ander
      medium dat eenzelfde functie vervult, zijn openbaar gemaakt of in het verkeer gebracht, indien het
      overnemen geschiedt in een radio- of televisieprogramma of ander medium dat eenzelfde functie vervult;
      [artikel 15, eerste lid, onder 3° en 4°, van de Auteurswet][ref1] is van overeenkomstige toepassing; ten aanzien
      van een uitvoering dient [artikel 5][ref2] in acht te worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel5
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
