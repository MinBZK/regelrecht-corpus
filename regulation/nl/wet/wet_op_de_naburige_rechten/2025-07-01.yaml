  - number: 10.f
    text: |-
      de reproductie van een opname van een uitvoering, fonogram, eerste vastlegging van een film, of opname van een
      programma, of een reproductie daarvan, door een cultureel erfgoedinstelling mits:
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
  - number: 10.f.1°
    text: |-
      de reproductie geschiedt met als doel het behoud van de opname van een uitvoering, het fonogram, de eerste
      vastlegging van een film, of de opname van een programma, of de reproductie daarvan, en de reproductie daarvoor
      noodzakelijk is; en
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
  - number: 10.f.2°
    text: |-
      de opname van een uitvoering, het fonogram, de eerste vastlegging van een film, of de opname van een programma, of
      de reproductie daarvan, permanent deel uitmaakt van de collectie van de cultureel erfgoedinstelling;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
  - number: 10.g
    text: |-
      de tijdelijke vastlegging door een omroeporganisatie die bevoegd is tot de openbaarmaking door uitzending van een
      radio- of televisieprogramma via radio of televisie, of een ander medium dat eenzelfde functie vervult, met haar
      eigen middelen en uitsluitend voor uitzending van haar eigen programma’s; ten aanzien van een uitvoering dient
      [artikel 5][ref1] in acht te worden genomen; [artikel 17b, eerste en derde lid, van de Auteurswet][ref2] is van
      overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel17b
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
