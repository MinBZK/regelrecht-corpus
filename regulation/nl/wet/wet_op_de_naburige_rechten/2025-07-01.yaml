        artikel: 15i
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 16g
  - number: 10.j
    text: |-
      een karikatuur, parodie of pastiche mits het gebruik in overeenstemming is met hetgeen naar de regels van het
      maatschappelijk verkeer redelijkerwijs geoorloofd is;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
  - number: 10.k
    text: |-
      het overnemen van op grond van deze wet beschermd materiaal ten behoeve van de opsporing van strafbare feiten, de
      openbare veiligheid of om het goede verloop van een bestuurlijke, parlementaire of gerechtelijke procedure of de
      berichtgeving daarover te waarborgen;
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
  - number: 10.l
    text: |-
      het reproduceren en het beschikbaar stellen voor het publiek van een voor het eerst in een lidstaat van de
      Europese Unie of in een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte in
      het verkeer gebracht of openbaar gemaakte opname van een uitvoering, fonogram, eerste vastlegging van een film of
      perspublicatie, of een reproductie daarvan, deel uitmakende van de verzameling van voor het publiek toegankelijke
      bibliotheken, onderwijsinstellingen en musea, alsmede archieven en instellingen voor cinematografisch of
      audiovisueel erfgoed die niet het behalen van direct of indirect economisch of commercieel voordeel nastreven
      en publieke media-instellingen als bedoeld in [hoofdstuk 2 van de Mediawet 2008][ref1], indien de rechthebbende
      na een zorgvuldige zoektocht niet is geïdentificeerd en opgespoord. De [artikelen 16o tot en met 16q][ref2] en
      [17 van de Auteurswet][ref3] zijn van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16o
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel17
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel10
    references:
