  - number: '18'
    text: |-
      De in [artikel 17, eerste lid][ref1], bedoelde bevoegdheid kan niet worden uitgeoefend ten aanzien van opnamen
      of reprodukties daarvan, die onder personen berusten, die niet in soortgelijke zaken handel drijven en deze
      uitsluitend voor eigen gebruik hebben verkregen, tenzij zij zelf inbreuk op het desbetreffende recht hebben
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel17
    url: https://wetten.overheid.nl/BWBR0005921/2025-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005921
        artikel: '17'
        hoofdstuk: '3'
  - number: 18a
    text: |-
      De rechter kan op vordering van de rechthebbende, bedoeld in de [artikelen 2][ref1], [6][ref2], [7a][ref3],
      [7b][ref4] en [8][ref5], gelasten dat op kosten van degene die inbreuk op diens recht heeft gemaakt passende
      maatregelen worden getroffen tot verspreiding van informatie over de uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0005921#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005921#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005921#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0005921#Artikel7b
      [ref5]: https://wetten.overheid.nl/BWBR0005921#Artikel8
