valid_from: '2013-08-07'
bwb_id: BWBR0033702
url: https://wetten.overheid.nl/BWBR0033702/2013-08-07
preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is het bestuur bij pensioenfondsen te versterken;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0033702/2013-08-07#ArtikelAanhef
articles:
  - number: VII
    text: >-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0033702/2013-08-07#ArtikelVII
  - number: VIII
    text: 'Deze wet wordt aangehaald als: Wet versterking bestuur pensioenfondsen.'
    url: https://wetten.overheid.nl/BWBR0033702/2013-08-07#ArtikelVIII
