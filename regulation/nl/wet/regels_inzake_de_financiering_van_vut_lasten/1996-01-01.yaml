---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regels_inzake_de_financiering_van_vut_lasten
regulatory_layer: WET
publication_date: '1996-01-23'
valid_from: '1996-01-01'
bwb_id: BWBR0007824
url: https://wetten.overheid.nl/BWBR0007824/1996-01-01
preamble:
  text: |-
    Het bestuur van de Stichting fonds vrijwillig vervroegd uittreden overheidspersoneel,

    gezien de goedkeuring van de Minister van Binnenlandse Zaken en de Centrale Commissie voor Georganiseerd Overleg in
    Ambtenarenzaken d.d. 13 december 1995,

    gelet op artikel 9, zesde lid van de Wet kaderregeling vut overheidspersoneel (Stb. 1995, 640),

    Bepaalt:
  url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van dit besluit wordt, tenzij uit de bepaling het tegendeel blijkt, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel1
  - number: 1.a
    text: '*pensioenreglement*: het pensioenreglement van de Stichting Pensioenfonds ABP;'
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel1
  - number: 1.b
    text: '*inkomen*: het inkomen bedoeld in artikel 3.1, eerste tot en met vijfde lid van het pensioenreglement;'
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel1
  - number: 1.c
    text: '*werkgever*: de werkgever bedoeld in artikel 2.2 van het pensioenreglement;'
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel1
  - number: 1.d
    text: '*werknemer*: de werknemer bedoeld in artikel 2.3 van het pensioenreglement;'
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel1
  - number: 1.e
    text: '*deeltijdfactor*: de deeltijdfactor bedoeld in artikel 1.4 van het pensioenreglement;'
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel1
  - number: 1.f
    text: '*belanghebbende*: de werknemer die door vrijwillig vervroegd uittreden recht op uitkering heeft verkregen;'
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel1
  - number: 1.g
    text: '*vut-fonds*: de Stichting fonds vrijwillig vervroegd uittreden overheidspersoneel, gevestigd te Heerlen;'
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel1
  - number: 1.h
    text: |-
      *kaderwet*: de [Wet kaderregeling vut overheidspersoneel][ref1] (Stb. 1995, 640);


      [ref1]: https://wetten.overheid.nl/BWBR0007792
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007792
  - number: 1.i
    text: |-
      *vut-overeenkomst*: de centrale vut-overeenkomst overheids- en onderwijspersoneel, zoals door de gezamenlijke
      sectorwerkgevers en de centrales van overheids- en onderwijspersoneel aangegaan op 30 oktober 1995 en nader
      vastgesteld op 20 december 1995;
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel1
  - number: 1.j
    text: '*vut-wet*: de [Wet uitkering wegens vrijwillig vervroegd uittreden](onbekend) (Stb. 1984, 273).'
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel1
  - number: '2.1'
    text: |-
      De lasten die voor het Vut-fonds ontstaan uit het bepaalde in [artikel 8 van de kaderwet][ref1] en uit de vut-
      overeenkomst, worden met inachtneming van het bepaalde in [artikel 9, derde en vierde lid van die kaderwet][ref2],
      respectievelijk artikel 2, derde lid van die overeenkomst gedekt door bijdragen (vut-bijdragen) van de werkgevers.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007792#Artikel9
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0007792
        artikel: '9'
  - number: '2.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid, worden de lasten met inachtneming van het bepaalde in
      [artikel 9, derde lid van de kaderwet][ref1] respectievelijk artikel 3, derde lid van de vut-overeenkomst tot de
      eerste dag van de maand volgende op die waarin de belanghebbende de leeftijd van 61 jaar heeft bereikt, gedekt
      door vergoedingen (vut-vergoedingen) van de werkgever uit wiens dienst een werknemer vrijwillig vervroegd is
      uitgetreden, zulks indien en voorzover de lasten verband houden met uitkeringen waarop recht is verkregen door
      toepassing van het bepaalde in de [artikelen 3, negende tot en met elfde lid](onbekend) en [6, achtste lid van de
      vut-wet](onbekend) dan wel krachtens artikel 3, eerste en tweede lid van de vut-overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0007792#Artikel9
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007792
        artikel: '9'
  - number: '2.3'
    text: |-
      In afwijking van het bepaalde in de vorige twee leden, worden de lasten die verband houden met uitkeringen waarop
      recht is verkregen krachtens de [Wet bevordering doorstroming onderwijspersoneel II][ref1], overeenkomstig het
      bepaalde in [artikel 15, eerste lid van die wet][ref2], door het Rijk aan het Vut-fonds vergoed tot de dag waarop
      de belanghebbende de leeftijd van 61 jaar heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0004586
      [ref2]: https://wetten.overheid.nl/BWBR0004586#Artikel15
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004586
      - id: ref2
        bwb_id: BWBR0004586
        artikel: '15'
  - number: '3.1'
    text: |-
      De werkgever, bedoeld in artikel 2.2, eerste lid, onderdeel a van het pensioenreglement is vut-bijdrage
      verschuldigd voor iedere in zijn dienst zijnde werknemer.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel3
  - number: '3.2'
    text: |-
      De werkgever ten aanzien van wie de verklaring bedoeld in artikel 5, eerste lid van de vut-overeenkomst is
      afgegeven, is vut-bijdrage verschuldigd overeenkomstig het bepaalde in die verklaring.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel3
  - number: '4.1'
    text: |-
      De vut-bijdrage, ter dekking van de lasten bedoeld in [artikel 2, eerste lid][ref1], bedraagt een jaarlijks vast te
      stellen percentage van het inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007824#Artikel2
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007824
        artikel: '2'
  - number: '4.2'
    text: |-
      Het percentage, bedoeld in het eerste lid, wordt op zodanige manier vastgesteld, dat per kalenderjaar de lasten
      bedoeld in [artikel 2, eerste lid][ref1] zijn gedekt en een vermogensreserve, ter grootte van minimaal 10 procent
      van de uitgaven van het Vut-fonds per kalenderjaar, in stand wordt gehouden. Daarbij wordt voorts rekening gehouden
      met de opbrengst van de beleggingen van die vermogensreserve.


      [ref1]: https://wetten.overheid.nl/BWBR0007824#Artikel2
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007824
        artikel: '2'
  - number: '4.3'
    text: |-
      De vut-bijdrage voor een werknemer in een deeltijddienstverhouding bedraagt, gedurende de periode waarvoor een
      deeltijdfactor is vastgesteld, de in het eerste lid bedoelde vut-bijdrage vermenigvuldigd met die deeltijdfactor.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel4
  - number: '4.4'
    text: |-
      Gedurende de periode van 1 januari 1996 tot 1 januari 2001 is de werkgever, bedoeld in artikel 2.2, eerste lid,
      onderdeel a, van het pensioenreglement, dat deel van de vut-bijdrage niet verschuldigd dat overeenkomt met de in
      [artikel 6, tweede lid][ref1], aangegeven verlaging van het vut-bijdrageverhaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007824#Artikel6
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007824
        artikel: '6'
  - number: '4.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing, indien dit is bepaald in de verklaring bedoeld in artikel 5,
      eerste lid van de vut-overeenkomst.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel4
  - number: '5.1'
    text: |-
      De werkgever betaalt de verschuldigde vut-bijdrage, in twaalf evenredige termijnen aan het Vut-fonds. De betaling
      dient te geschieden voor het einde van de maand volgende op de uitbetalingstermijn waarop die bijdrage betrekking
      heeft.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel5
  - number: '5.2'
    text: |-
      De werkgever voldoet de vut-vergoeding bedoeld in [artikel 2, tweede lid][ref1], op basis van een declaratie van
      het bestuur van het Vut-fonds. In die declaratie wordt een opslag ter zake van uitvoeringskosten verdisconteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007824#Artikel2
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007824
        artikel: '2'
  - number: '5.3'
    text: De werkgever is aan het Vut-fonds wettelijke rente verschuldigd over bedragen die niet of niet tijdig zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel5
  - number: '5.4'
    text: |-
      De betaling van de bijdrage en de aanlevering van de ter zake benodigde gegevens geschiedt overeenkomstig de
      uitvoeringsregels van het bestuur van de Stichting Pensioenfonds ABP d.d. 1 januari 1996 met betrekking tot het
      verstrekken van diensttijd, grondslaggegevens en incasso van pensioenpremies/bijdragen en met inachtneming van
      nader door het bestuur van het Vut-fonds verstrekte voorschriften.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel5
  - number: '6.1'
    text: De werkgever verhaalt 35 procent van de verschuldigde vut-bijdrage op de werknemer als vut-bijdrageverhaal.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel6
  - number: '6.2'
    text: |-
      In afwijking van het eerste lid wordt het vut-bijdrageverhaal, berekend als percentage van het inkomen, voor
      de werknemer die in dienst is van een werkgever als bedoeld in artikel 2.2, eerste lid, onderdeel a, van het
      pensioenreglement van de Stichting Pensioenfonds ABP, in de periode van 1 januari 1996 tot 1 januari 2001 verlaagd
      met:
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel6
  - number: 6.2.a
    text: 1,17 procentpunten in het jaar 1996;
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel6
  - number: 6.2.b
    text: 0,94 procentpunten in het jaar 1997;
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel6
  - number: 6.2.c
    text: 0,71 procentpunten in het jaar 1998;
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel6
  - number: 6.2.d
    text: 0,47 procentpunten in het jaar 1999;
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel6
  - number: 6.2.e
    text: 0,24 procentpunten in het jaar 2000;
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing, indien dit is bepaald in de verklaring bedoeld in artikel 5,
      eerste lid van de vut-overeenkomst.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel6
  - number: '6.4'
    text: |-
      In afwijking van het eerste lid en onverminderd het tweede lid wordt het verhaal, op de werknemer die slechts een
      gedeelte van zijn inkomen geniet omdat hij wegens ziekte verhinderd is dienst te verrichten, naar evenredigheid
      verminderd.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel6
  - number: '6.5'
    text: |-
      In afwijking van het eerste lid is het verhaal op de werknemer, die geen of slechts gedeeltelijk inkomen geniet
      wegens schorsing of omdat hij zonder daartoe verkregen verlof zijn betrekking niet uitoefent, gelijk aan de door
      de werkgever verschuldigde vut-bijdrage die geacht kan worden betrekking te hebben op de tijd waarvoor de schorsing
      geldt, onderscheidenlijk de betrekking niet wordt uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel6
  - number: '6.6'
    text: |-
      Indien de werknemer verzoekt geheel of gedeeltelijk te worden ontheven van zijn betrekking kan de werkgever als
      voorwaarde stellen, dat de door hem verschuldigde bijdrage geheel, onderscheidenlijk voor een groter deel dan het
      in het eerste lid genoemde percentage op die werknemer wordt verhaald.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel6
  - number: '7'
    text: Dit besluit treedt in werking op 1 januari 1996.
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel7
  - number: '8'
    text: 'Dit besluit kan worden aangehaald als: Regels inzake de financiering van vut-lasten.'
    url: https://wetten.overheid.nl/BWBR0007824/1996-01-01#Artikel8
