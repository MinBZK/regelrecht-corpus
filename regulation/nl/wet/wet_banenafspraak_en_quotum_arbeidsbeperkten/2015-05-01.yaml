preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om de arbeidsparticipatie van werknemers met
    een beperking, die met ondersteuning van de gemeenten naar arbeid worden begeleid, te bevorderen en daarmee
    het volume van de uitkeringen te beperken door een werkgeversheffing te introduceren ten gunste van het
    Arbeidsongeschiktheidsfonds indien de werkgever niet of onvoldoende de quotumdoelstelling haalt en slechts tot
    invoering van deze regeling over te gaan indien de in het sociaal akkoord overeengekomen garantstelling voor extra
    banen voor deze doelgroep niet wordt gehaald;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036551/2015-05-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036551/2015-05-01#ArtikelIII
  - number: IV
    text: 'Deze wet wordt aangehaald als: Wet banenafspraak en quotum arbeidsbeperkten.'
    url: https://wetten.overheid.nl/BWBR0036551/2015-05-01#ArtikelIV
