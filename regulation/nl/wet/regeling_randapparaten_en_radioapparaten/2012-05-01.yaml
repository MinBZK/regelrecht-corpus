  - number: '3'
    text: |-
      1 Radioapparaten als bedoeld in artikel 1 en artikel 2, eerste lid, van beschikking nr. 2000/637/EG voldoen aan
      [artikel 2][ref1] van deze beschikking.

      2 Radioapparaten als bedoeld in artikel 1 van beschikking nr. 2004/71/EG voldoen aan [artikel 2][ref2] van deze
      beschikking.

      3 De in artikel 1 van beschikking nr. 2001/148/EG bedoelde lawinebakens voldoen aan [artikel 2][ref3] van deze
      beschikking.

      4 Radioapparaten, bedoeld in artikel 1, eerste alinea, van beschikking nr. 2005/53/EG voldoen aan
      [artikel 1, tweede alinea][ref4], van deze beschikking.

      5 Radioapparaten als bedoeld in artikel 1 van beschikking nr. 2005/631/EG voldoen aan [artikel 2][ref5] van deze
      beschikking.


