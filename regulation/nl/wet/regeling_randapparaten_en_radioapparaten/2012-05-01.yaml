  - number: '10'
    text: |-
      Een aanvraag tot aanwijzing als bedoeld in [artikel 11 van het besluit][ref1] wordt ingediend bij het Agentschap
      Telecom en bevat:

      a. gegevens waaruit blijkt dat de instantie waarop de aanvraag betrekking heeft blijkens accreditatie aantoonbaar
      voldoet aan de norm NEN-EN 45011 of de norm NEN-EN 45012, en

      b. de categorieën van randapparaten of radioapparaten en de conformiteitsbeoordelingsprocedures dan wel de
      onderdelen daarvan, waarop de aanvraag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel11
    url: https://wetten.overheid.nl/BWBR0011347/2012-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0021037
        artikel: '11'
  - number: 10a
    text: |-
      1 Een aanvraag om een aanwijzing als bedoeld in [artikel 12a, eerste lid, van het besluit][ref1] wordt ingediend
      bij het Agentschap Telecom van het Ministerie van Economische Zaken, Landbouw en Innovatie.

      2 De aanvraag, bedoeld in het eerste lid, bevat:

      a. gegevens waaruit blijkt dat de instantie waarop de aanvraag betrekking heeft voldoet aan het bij of krachtens
      [artikel 12a van het besluit][ref2] bepaalde;

      b. de categorieën apparaten waarop de aanvraag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0021037#Artikel12a
    url: https://wetten.overheid.nl/BWBR0011347/2012-05-01#Artikel10a
