preamble:
  text: |-
    Gelet op richtlijn nr. 1999/5/EG van het Europees Parlement en de Raad van de Europese Unie van 9 maart 1999
    betreffende radioapparatuur en telecommunicatie-eindapparatuur en de wederzijdse erkenning van hun conformiteit
    (PbEG L 91), op Beschikking nr. 6/4/2000 van de Commissie van de Europese Gemeenschappen van 6 april 2000
    houdende vaststelling van de eerste indeling van radioapparatuur en telecommunicatie-eindapparaten en de
    overeenkomstige merktekens (PbEG L 97), op artikel 3, tweede lid en de sectorbijlage betreffende radioapparatuur
    en telecommunicatie-eindapparatuur van de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap
    en de Verenigde Staten van Amerika (PbEG 1999/L31), artikel 2, derde lid en de sectorbijlage betreffende
    radioapparatuur en telecommunicatie-eindapparatuur van de Overeenkomst inzake wederzijdse erkenning tussen
    de Europese Gemeenschap en Canada (PbEG 1998/L280), artikel 2, tweede lid en de sectorbijlage betreffende
    radioapparatuur en telecommunicatie-eindapparatuur van de Overeenkomst inzake wederzijdse erkenning van
    overeenstemmingsbeoordeling, certificaten en markeringen tussen de Europese Gemeenschap en Australië (PbEG 1998/
    L229) en artikel 2, tweede lid en de sectorbijlage betreffende radioapparatuur en telecommunicatie-eindapparatuur
    van de Overeenkomst inzake de wederzijdse erkenning van overeenstemmingsbeoordeling tussen de Europese Gemeenschap
    en Nieuw-Zeeland (PbEG 1998/L229) en op de artikelen 1, onderdeel i, 5, derde lid, 11, 13, 14, derde lid en 21 van
    het Besluit randapparaten en radioapparaten;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0011347/2012-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a

              *besluit:*


              [Besluit randapparaten en radioapparaten 2007][ref1];



            b
            beschikking nr. 2000/299/EG:

              beschikking nr. 2000/299/EG van de Commissie van de Europese Gemeenschappen van 6 april 2000 houdende
      vaststelling van de eerste indeling van radioapparatuur en telecommunicatie-eindapparatuur en de overeenkomstige
      merktekens (PbEG L 97);



            c
            beschikking nr. 2000/637/EG:

              beschikking nr. 2000/637/EG van de Commissie van de Europese Gemeenschappen van 22 september 2000 over de
      toepassing van artikel 3, lid 3, onder e), van [Richtlijn 1999/5/EG](31999L0005) van het Europees Parlement en de
      Raad op radioapparatuur die onder de regionale regeling betreffende de radiotelefoondienst op binnenwateren valt
      (PbEG L 269);



            d
            beschikking nr. 2004/71/EG:

              beschikking nr. 2004/71/EG van de Commissie van de Europese Gemeenschappen van 4 september 2003 betreffende
      essentiële eisen ten aanzien van radioapparatuur die bedoeld is om op niet-SOLAS-schepen te worden gebruikt voor
      deelname aan het wereldwijde maritieme nood- en veiligheidssysteem (GMDSS) (PbEU L 16);



            e
            beschikking nr. 2001/148/EG:

              beschikking nr. 2001/148/EG van de Commissie van de Europese Gemeenschappen van 21 februari 2001
      betreffende de toepassing van artikel 3, lid 3, onder e), van [Richtlijn 1999/5/EG](31999L0005) op lawinebakens
      (PbEG L55);



            f

              *beschikking nr. 2005/53/EG:*


              beschikking nr. 2005/53/EG van de Commissie van de Europese Gemeenschappen van 25 januari 2005 betreffende
      de toepassing van artikel 3, lid 3, onder e) van [Richtlijn 1999/5/EG](31999L0005) van het Europees Parlement en
      de Raad op radioapparatuur die bedoeld is om deel te nemen aan het automatische identificatiesysteem (AIS) (PbEU
      L 22);



            g
            beschikking nr. 2005/631/EG:

              beschikking nr. 2005/631/EG van de Commissie van de Europese Gemeenschappen van 29 augustus 2005
      betreffende essentiële eisen zoals bedoeld in [Richtlijn 1999/5/EG](31999L0005) van het Europees Parlement en de
      Raad om de toegang tot alarmdiensten via de Cospas-Sarsat-noodbakens te waarborgen (PbEU L 225);



            h
            Agentschap Telecom:

              Agentschap Telecom van het Ministerie van Economische Zaken, Landbouw en Innovatie.


