  - number: '2'
    text: |-
      1 De kennisgeving, bedoeld in [artikel 4, eerste lid, van het besluit][ref1], geschiedt aan het Agentschap Telecom.

      2 De informatie inzake de radiokenmerken van de radioapparaten, bedoeld in
      [artikel 4, tweede lid, van het besluit][ref2] betreft:

      a. het beoogde gebruik of de bestemming van de radioapparaten;

      b. de frequentieband of de frequentiebanden waarin de radioapparaten kunnen worden gebruikt;

      c. de norm of andere technische specificatie volgens welke de radioapparaten zijn geproduceerd;

      d. de modulatiesoort;

      e. het kanaalraster of de bandbreedte;

      f. het zendvermogen;

      g. de uitzendtijd in verhouding tot een volle periodetijd of het toegangsprotocol;

      h. de duplex afstand, voor zover van toepassing; en

      i. het type antenne, voor zover nodig voor het beoogde gebruik of de bestemming van de radioapparaten.

      3 De kennisgeving, bedoeld in het eerste lid, bevat tevens de naam en het adres van degene die het voornemen
      heeft om de radioapparaten in Nederland in de handel te brengen en de naam en het adres van de fabrikant van de
      radioapparaten alsmede het type-, partij- of serienummer van het betreffende radioapparaat, waardoor het mogelijk
      is om degene die het voornemen heeft om de radioapparaten in Nederland in de handel te brengen of de fabrikant
      te identificeren.


      [ref1]: https://wetten.overheid.nl/BWBR0021037#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021037#Artikel4
