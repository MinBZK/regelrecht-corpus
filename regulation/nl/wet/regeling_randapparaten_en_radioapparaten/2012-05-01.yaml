  - number: '11'
    text: |-
      De overeenkomsten, bedoeld in [artikel 1, onderdeel h, van het besluit][ref1] zijn

      a. de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap en de Verenigde Staten van Amerika
      (PbEG 1999, L 31);

      b. de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap en Canada (PbEG 1998, L 280);

      c. de Overeenkomst inzake wederzijdse erkenning van overeenstemmingsbeoordeling, certificaten en markeringen tussen
      de Europese Gemeenschap en Australië (PbEG 1998, L 229);

      d. de Overeenkomst inzake wederzijdse erkenning van overeenstemmingsbeoordeling tussen de Europese Gemeenschap en
      Nieuw-Zeeland (PbEG 1998, L 229);

      e. de Overeenkomst inzake wederzijdse erkenning van overeenstemmingsbeoordeling, tussen de Europese Gemeenschap en
      Japan (PbEG 2001, L 284) en

      f. de Overeenkomst inzake wederzijdse erkenning van overeenstemmingsbeoordeling tussen de Europese Gemeenschap en
      Zwitserland (PbEG 2002, L 114).


