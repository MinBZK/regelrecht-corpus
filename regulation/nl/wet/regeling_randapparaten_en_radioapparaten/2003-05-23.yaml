        artikel: '5'
  - number: '3'
    text: |-
      1 Radioapparaten als bedoeld in [artikel 1][ref1] en [artikel 2, eerste lid][ref2], van beschikking nr. 2000/637/EG
      voldoen aan [artikel 2][ref3] van deze beschikking.

      2 Radioapparaten als bedoeld in [artikel 1][ref4] van beschikking nr. 2000/638/EG voldoen aan [artikel 2][ref5] van
      deze beschikking.

      3 De in [artikel 1][ref6] van beschikking nr. 2001/148/EG bedoelde lawinebakens voldoen aan [artikel 2][ref7] van
      deze beschikking.

      4 Radioapparaten, bedoeld in [artikel 1][ref8], eerste alinea, van beschikking nr. 2003/213/EG voldoen aan
      [artikel 1][ref9], tweede alinea, van deze beschikking.


