  - number: '10'
    text: |-
      Een aanvraag tot aanwijzing als bedoeld in [artikel 12 van het besluit][ref1] wordt ingediend bij de divisie
      Telecom en bevat:

      a. gegevens waaruit blijkt dat de instantie waarop de aanvraag betrekking heeft blijkens accreditatie aantoonbaar
      voldoet aan de norm NEN-EN 45011 of de norm NEN-EN 45012, en

      b. de categorieën van randapparaten of radioapparaten en de conformiteitsbeoordelingsprocedures dan wel de
      onderdelen daarvan, waarop de aanvraag betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel12
    url: https://wetten.overheid.nl/BWBR0011347/2003-05-23#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '12'
  - number: '11'
    text: |-
      De overeenkomsten, bedoeld in [artikel 1, onderdeel i, van het besluit][ref1] zijn de Overeenkomst inzake
      wederzijdse erkenning tussen de Europese Gemeenschap en de Verenigde Staten van Amerika (PbEG 1999/L31),
      de Overeenkomst inzake wederzijdse erkenning tussen de Europese Gemeenschap en Canada (PbEG 1998/L280), de
      Overeenkomst inzake wederzijdse erkenning van overeenstemmingsbeoordeling, certificaten en markeringen tussen
      de Europese Gemeenschap en Australië (PbEG 1998/L229), de Overeenkomst inzake de wederzijdse erkenning van
      overeenstemmingsbeoordeling tussen de Europese Gemeenschap en Nieuw-Zeeland (PbEG 1998/L229) of de Overeenkomst
      inzake wederzijdse erkenning tussen de Europese Gemeenschap en Japan (PbEG 2002/L284).


