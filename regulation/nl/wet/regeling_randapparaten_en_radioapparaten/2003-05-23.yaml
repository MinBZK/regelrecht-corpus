  - number: '4'
    text: |-
      De markering, bedoeld in [artikel 11, eerste lid, van het besluit][ref1] is de CE-markering, bedoeld in bijlage
      VII, onder 1, van [richtlijn nr. 1999/5/EG](31999L0005).


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel11
    url: https://wetten.overheid.nl/BWBR0011347/2003-05-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '11'
  - number: '5'
    text: |-
      1 Onverminderd [artikel 11, eerste lid][ref1], van het besluit wordt de in [artikel 4][ref2] bedoelde CE-markering
      op het randapparaat of radioapparaat zelf dan wel op een daarop bevestigd gegevensplaatje aangebracht.

      2 De verhoudingen van de in bijlage VII, onder 1, van [richtlijn nr. 1999/5/EG](31999L0005) aangegeven afbeelding
      worden in acht genomen, ook in het geval waarin deze wordt verkleind of vergroot.

      3 De hoogte van de CE-markering bedraagt ten minste vijf millimeter, tenzij dit gezien de aard van de randapparaten
      of radioapparaten niet mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011347#Artikel4
    url: https://wetten.overheid.nl/BWBR0011347/2003-05-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0011347
        artikel: '4'
        paragraaf: '4'
  - number: '6'
    text: |-
      1 De in [artikel 4][ref1] bedoelde CE-markering wordt zichtbaar, leesbaar en onuitwisbaar aangebracht.

      2 De zichtbaarheid, leesbaarheid of herkenbaarheid van de CE-markering wordt niet verminderd door andere
      markeringen die op de randapparaten of radioapparaten zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0011347#Artikel4
    url: https://wetten.overheid.nl/BWBR0011347/2003-05-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011347
        artikel: '4'
        paragraaf: '4'
  - number: '7'
    text: |-
      Indien bij de conformiteitsbeoordelingsprocedures, bedoeld in [artikel 8][ref1] van het besluit, een of meer
      aangemelde instanties zijn betrokken, gaat de in [artikel 4][ref2] bedoelde CE-markering vergezeld van het
      identificatienummer van deze aangemelde instantie, onderscheidenlijk aangemelde instanties.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011347#Artikel4
    url: https://wetten.overheid.nl/BWBR0011347/2003-05-23#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011261
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011347
        artikel: '4'
        paragraaf: '4'
  - number: '8'
    text: |-
      In de in [artikel 4][ref1] bedoelde CE-markering alsmede in de gebruiksaanwijzing of de handleiding en in andere
      documenten met betrekking tot de randapparaten of radioapparaten, die deze apparaten vergezellen, wordt door degene
      die de randapparaten of radioapparaten in de handel brengt het referentienummer van [richtlijn nr. 1999/5/EG]
      (31999L0005), zoals gepubliceerd in het Publicatieblad van de Europese Gemeenschappen opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0011347#Artikel4
    url: https://wetten.overheid.nl/BWBR0011347/2003-05-23#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0011347
        artikel: '4'
        paragraaf: '4'
  - number: '9'
    text: |-
      1 De markering, bedoeld in [artikel 11, tweede en derde lid][ref1], van het besluit is de markering, bedoeld in
      [artikel 1, tweede lid][ref2], van de beschikking nr. 2000/299/EG.

      2 Onverminderd [artikel 11, derde lid][ref3], van het besluit wordt de in het eerste lid bedoelde markering
      aangebracht op radioapparaten waarvoor in een of meer lidstaten voorschriften inzake het gebruik van deze apparaten
      gelden of waarvoor in een of meer lidstaten op grond van artikel 9, vijfde lid, van [richtlijn nr. 1999/5/EG]
      (31999L0005) voorschriften inzake het in de handel brengen van deze apparaten gelden.

      3 De in het eerste lid bedoelde markering moet zichtbaar, leesbaar en herkenbaar zijn en moet dezelfde hoogte
      hebben als de in [artikel 4][ref4] bedoelde CE-markering.


      [ref1]: https://wetten.overheid.nl/BWBR0011261#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011347#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0011261#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0011347#Artikel4
