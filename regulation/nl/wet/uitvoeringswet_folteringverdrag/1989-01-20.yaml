        artikel: '2'
  - number: '6'
    text: |-
      1 De uitdrukking ambtenaar heeft in deze wet dezelfde betekenis als in het [Wetboek van Strafrecht][ref1].

      2 Voor de toepassing van de Nederlandse strafwet wordt onder ambtenaar mede begrepen degene die ten dienste van een
      vreemde staat een openbaar ambt bekleedt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0004409/1989-01-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: '10'
    text: |-
      1 Deze wet treedt in werking met ingang van de dag waarop voor Nederland het Verdrag tegen foltering en andere
      wrede, onmenselijke of onterende behandeling of bestraffing in werking treedt.

      2 Deze wet kan worden aangehaald als Uitvoeringswet folteringverdrag.
    url: https://wetten.overheid.nl/BWBR0004409/1989-01-20#Artikel10
