  - number: '4'
    text: |-
      De bij de [artikelen 1][ref1] en [2][ref2] strafbaar gestelde feiten zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0004409#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004409#Artikel2
