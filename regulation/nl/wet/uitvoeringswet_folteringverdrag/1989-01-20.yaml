preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat enige wettelijke voorzieningen moeten worden getroffen ter uitvoering
    van het op 10 december 1984 te New York tot stand gekomen Verdrag tegen foltering en andere wrede, onmenselijke of
    onterende behandeling of bestraffing;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004409/1989-01-20#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Mishandeling gepleegd door een ambtenaar of een anderszins ten dienste van de overheid werkzame persoon in de
      uitoefening van zijn functie aan iemand die van zijn vrijheid is beroofd, met het oogmerk om inlichtingen of een
      bekentenis te verkrijgen, hem te bestraffen, hem of een ander vrees aan te jagen of te dwingen iets te doen of te
      dulden, of uit minachting voor diens aanspraken op menselijke gelijkwaardigheid, wordt, zo deze gedragingen van
      dien aard zijn, dat zij het beoogde doel kunnen bevorderen, als foltering gestraft met gevangenisstraf van ten
      hoogste vijftien jaren of geldboete van de vijfde categorie.

      2 Met mishandeling wordt gelijkgesteld het opzettelijk teweegbrengen van een toestand van hevige angst of een
      andere vorm van ernstige geestelijke ontreddering.

      3 Indien het feit de dood tengevolge heeft wordt de schuldige gestraft met levenslange gevangenisstraf of met
      tijdelijke van ten hoogste twintig jaren of geldboete van de vijfde categorie.
    url: https://wetten.overheid.nl/BWBR0004409/1989-01-20#Artikel1
  - number: '2'
    text: |-
      Met gelijke straffen als gesteld op de in het voorgaande artikel bedoelde feiten, wordt gestraft:

      a. de ambtenaar of anderszins ten dienste van de overheid werkzame persoon die door een der in
      [artikel 47, eerste lid, onder 2°, van het Wetboek van Strafrecht][ref1] vermelde middelen tot de in
      [artikel 1][ref2] bedoelde vorm van mishandeling uitlokt of die opzettelijk toelaat dat een ander die vorm van
      mishandeling pleegt;

      b. hij die de in [artikel 1][ref3] bedoelde vorm van mishandeling pleegt, indien een ambtenaar of een
      anderszins ten dienste van de overheid werkzame persoon in de uitoefening van zijn functie zulks door een der in
      [artikel 47, eerste lid, onder 2°, van het Wetboek van Strafrecht][ref4] vermelde middelen heeft uitgelokt of
      zulks opzettelijk heeft toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0004409#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0004409#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel47
