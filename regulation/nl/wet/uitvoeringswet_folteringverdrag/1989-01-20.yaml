  - number: '5'
    text: |-
      De Nederlandse strafwet is toepasselijk op ieder die zich buiten Nederland aan een van de in de [artikelen 1][ref1]
      en [2][ref2] van deze wet omschreven misdrijven schuldig maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0004409#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004409#Artikel2
    url: https://wetten.overheid.nl/BWBR0004409/1989-01-20#Artikel5
