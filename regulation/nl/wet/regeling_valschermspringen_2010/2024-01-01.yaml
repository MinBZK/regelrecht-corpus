  - number: 1b
    text: |-
      1 Het valscherm verleent voorrang aan vliegtuigen, helikopters, zweeftoestellen, vrije ballonen en luchtschepen.

      2 In alle overige gevallen dat twee luchtvaartuigen kruisen op of omstreeks hetzelfde niveau, verleent het
      luchtvaartuig dat het andere aan zijn rechterzijde heeft voorrang.
    url: https://wetten.overheid.nl/BWBR0027968/2024-01-01#Artikel1b
  - number: '2'
    text: Deze regeling is niet van toepassing op valschermspringen door de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0027968/2024-01-01#Artikel2
  - number: '3'
    text: |-
      1 Valschermspringen is uitsluitend toegestaan:

      a. binnen een vast valschermspringgebied onder de voorwaarden, bedoeld in [artikel 4][ref1], dan wel binnen een
      incidenteel valschermspringgebied onder de voorwaarden, bedoeld in de artikelen 4 en [5][ref2];

      b. na toestemming van de gezagvoerder van het luchtvaartuig waaruit gesprongen wordt;

      c. binnen de daglichtperiode, bekendgemaakt in de luchtvaartgids, en

      d. wanneer het vliegzicht en de minimumafstand tot de wolken voldoen aan de minimumwaarden
      voor VFR-vluchten die gelden in het betreffende deel van het luchtruim, bepaald krachtens
      [artikel 17 van het Besluit luchtverkeer 2014][ref3].

      2 De Minister van Infrastructuur en Milieu kan ontheffing verlenen van het eerste lid, onderdeel c. Aan de
      ontheffing kunnen voorschriften en beperkingen worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0027968#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0027968#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0035899#Artikel17
