articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      *cluster:* groep van valschermspringgebieden als bedoeld in [bijlage 1][ref1] bij deze regeling;

      *doelgebied*: gebied waarin de valschermspringer beoogt neer te komen;

      *incidenteel valschermspringgebied*: valschermspringgebied dat niet is opgenomen in de lijst van
      valschermspringgebieden, bedoeld in [bijlage 1][ref2] bij deze regeling;

      *klimgebied*: kolom luchtruim in de vorm van een cilinder met een straal van 9,26 km rond het middelpunt van het
      doelgebied en een hoogte gelijk aan de voorgenomen springhoogte in het luchtruim;

      *NOTAM:* bericht als bedoeld in [artikel 1 van de Regeling Burgerluchtvaartinlichtingen][ref3] (Notice to Airmen);

      *valscherm*: scherm dat dient om de daalsnelheid van een persoon zodanig te beperken, dat deze veilig het
      aardoppervlak kan bereiken;

      *valschermspringen*: uit een zich in de lucht bevindend luchtvaartuig springen met een valscherm;

      *valschermspringgebied*: kolom luchtruimte in de vorm van een cilinder met een straal van 3,7 km rond het
      middelpunt van het doelgebied en een hoogte die ten minste gelijk is aan de voorgenomen springhoogte;

      *vast valschermspringgebied*: valschermspringgebied opgenomen in de lijst van valschermspringgebieden, bedoeld in
      [bijlage 1][ref4] bij deze regeling.


