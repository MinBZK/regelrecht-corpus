  - number: '4'
    text: |-
      1 Voor het gebruik van een vast valschermspringgebied of een incidenteel valschermspringgebied gelden de volgende
      voorwaarden voor het luchtvaartuig waaruit gesprongen wordt:

      a. de vlucht wordt uitgevoerd als IFR-vlucht binnen luchtruim klasse A, tenzij de vlucht wordt uitgevoerd
      in een door de Minister van Infrastructuur en Milieu aangewezen gebied met beperkingen als bedoeld in
      [artikel 5.10, eerste lid, van de Wet luchtvaart][ref1], en als gecontroleerde VFR-vlucht binnen luchtruim klasse
      B, C of D;

      b. voor aanvang van de vlucht is een voorlopige klaring aangevraagd bij de betrokken luchtverkeersleidingsdienst en
      voor het binnenvliegen van het betrokken luchtruim is een definitieve klaring verkregen;

      c. onmiddellijk voor het uitvoeren van iedere valschermsprong is luchtverkeersinformatie van de betrokken
      luchtverkeersleidingdienst verkregen, waarbij de luchtverkeersleidingsdienst de mogelijkheid tot het aanvangen van
      de valschermsprong aangeeft;

      d. het luchtvaartuig blijft tijdens het klimmen en dalen binnen luchtruim klasse A of B binnen het klimgebied;

      e. ingeval van een opening van een valscherm in luchtruim klasse A of B blijft het luchtvaartuig in luchtruim
      klasse A of B binnen het klimgebied boven het hoogste valscherm totdat het valscherm luchtruim klasse A of B heeft
      verlaten;

      f. binnen een klimgebied in luchtruimklasse A bevindt zich slechts één luchtvaartuig tegelijk, tenzij het een
      formatie betreft in een klimgebied dat gelegen is:

        - volledig buiten het naderingsluchtverkeersleidingsgebied van Schiphol en
        - buiten dat deel van het algemene luchtverkeersleidingsgebied CTA South 1 dat binnen de laterale grenzen van de
      provincie Zuid-Holland ligt.

      De gezagvoerder is in een dergelijk geval zelf verantwoordelijk voor onderlinge separatie, en;

      g. binnen een cluster wordt slechts één valschermspringgebied tegelijk gebruikt.

      2 Het eerste lid, onderdelen c en d, zijn niet van toepassing indien de betrokken luchtverkeersleidingsdienst
      anders bepaalt in het belang van de algemene luchtverkeersveiligheid, een veilig, ordelijk en vlot verloop van het
      luchtverkeer, of de situatie op de grond.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel5.10
