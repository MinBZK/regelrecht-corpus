        artikel: '4'
  - number: '6'
    text: |-
      1 Als gebieden met beperkingen worden aangewezen de klimgebieden van de vaste valschermspringgebieden die zijn
      opgenomen in [bijlage 1][ref1] behorende bij deze regeling. Deze gebieden gelden als gebieden met beperkingen,
      gedurende de in bijlage 1 gespecificeerde tijdstippen en voor zover die gebieden in gebruik zijn als klimgebied
      door een luchtvaartuig ten behoeve van valschermspringen.

      2 Onverminderd het eerste lid, wordt als gebied met beperkingen aangewezen het klimgebied in het
      valschermspringgebied cluster Utrecht, opgenomen in [bijlage 2][ref2] bij deze regeling.

      3 IFR-vluchten zijn binnen de gebieden, bedoeld in het eerste lid, toegestaan.

      4 VFR-vluchten zijn onder de volgende voorwaarden toegestaan binnen de gebieden, bedoeld in het eerste lid:

      a. de betrokken luchtverkeersleidingsdienst is van oordeel dat het aanbod van het luchtverkeer binnen dat deel van
      het betrokken gebied dat binnen gecontroleerd luchtruim valt, het toelaat;

      b. voor contact met de grond is een tweede radioset aanwezig;

      c. de vlucht wordt uitgevoerd als een gecontroleerde VFR-vlucht;

      d. de gezagvoerder van het betrokken luchtvaartuig onderhoudt voortdurend tweezijdig radiocontact met de betrokken
      luchtverkeersdienst, tenzij anders aangegeven door deze dienst;

      e. de SSR-transponder wordt ingesteld op de code, verkregen van de betrokken luchtverkeersleidingsdienst, en

      f. indien de radioverbinding tussen het luchtvaartuig en de luchtverkeersdienst is verbroken:

      1°. worden geen valschermsprongen uitgevoerd;

      2°. wordt de transpondercode 7600 ingesteld, en

      3°. wordt gedurende 3 minuten de op dat moment gevlogen hoogte gehandhaafd, waarna wordt teruggekeerd naar het
      luchtvaartterrein van vertrek.


