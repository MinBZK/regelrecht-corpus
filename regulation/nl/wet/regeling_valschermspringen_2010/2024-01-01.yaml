  - number: '5'
    text: |-
      In aanvulling op [artikel 4][ref1] gelden voor het gebruik van een incidenteel valschermspringgebied de volgende
      voorwaarden:

      a. voor het valschermspringgebied is een NOTAM uitgegeven. Deze NOTAM moet ten minste vijf werkdagen tevoren zijn
      aangevraagd bij de betrokken luchtverkeersdienst. Wanneer verschillende luchtverkeersdiensten zijn betrokken,
      wordt de aanvraag ingediend bij de dienst die luchtverkeersleiding geeft in het gebied met de laagste verticale
      begrenzing, inclusief luchtruim klasse E. Deze dienst stemt de beoordeling van de aanvraag af met de andere
      betrokken luchtverkeersdiensten;

      b. de valschermspringer heeft schriftelijk toestemming verkregen van de beheerder van een niet gecontroleerd
      luchtvaartterrein, inclusief een zweefvliegterrein, helikopterlandingsplaats, zeilvliegterrein of
      schermvliegterrein, wanneer het valschermspringgebied ligt binnen een afstand van 5,56 km van de grens van een
      dergelijk terrein;

      c. in het vliegplan zijn vermeld:

      1°. de coördinaten en eventuele plaatsnaam van het centrum van het valschermspringgebied;

      2°. de periode waarin de sprong wordt uitgevoerd;

      3°. het NOTAM nummer, en

      4°. de hoogte waarvan de sprong wordt uitgevoerd, en

      d. het valschermspringgebied en het klimgebied liggen niet binnen de naderingsluchtverkeersleidingsgebieden van
      Schiphol, tenzij het gaat om een sprong waarbij het naderingsluchtverkeer niet wordt gehinderd of vertraagd en
      die plaatsvindt:

      1°. op maximaal 2500 voet boven gemiddeld zeeniveau, en

      2°. buiten de in gebruik zijnde Standard Instrument Departures.


      [ref1]: https://wetten.overheid.nl/BWBR0027968#Artikel4
