  - number: '4'
    text: |-
      1 De HOSOWO-instantie voert de monstername voor en analyse vam een Hygiënogram, op een pluimveebedrijf uit
      overeenkomstig de voorschriften opgenomen in [Bijlage l][ref1] en [III][ref2].

      2 De HOSOWO-instantie voert de monstername voor een Swabonderzoek op een pluimveebedrijf uit overeenkomstig de
      voorschriften opgenomen in [Bijlage l][ref3] en [IV][ref4].

      3 De HOSOWO-instantie voert een Wateronderzoek uit overeenkomstig hetgeen is bepaald in het
      [Hygiënebesluit drinkwateronderzoek (PPE) 2007][ref5] en [Bijlage l][ref6].

      4 De HOSOWO-instantie voert een Mestonderzoek uit overeenkomstig hetgeen is bepaald in het
      [Hygiënebesluit leghennenbedrijven (PPE) 2007][ref7] en [Bijlage l][ref8].


