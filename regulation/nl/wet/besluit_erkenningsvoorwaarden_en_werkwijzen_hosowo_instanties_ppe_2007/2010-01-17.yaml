preamble:
  text: |-
    Gelet op de artikelen 2, artikel 3, artikel 6, artikel 7, en artikel 8, van de Verordening hygiënevoorschriften
    pluimveehouderij (PPE) 2007;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023545/2010-01-17#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Dit besluit neemt de terminologie, als omschreven in
      [artikel 1 van de Verordening hygiënevoorschriften pluimveehouderij (PPE) 2007][ref1] (hierna: de Verordening),
      over. In aanvulling daarop wordt voor de toepassing van dit besluit verstaan onder:








                  Swabonderzoek:


                  Het uitvoeren van een onderzoek op de aanwezigheid van Salmonella of Campylobacter bij
      een pluimveebedrijf als bedoeld in [artikel 6, zesde lid][ref2], [artikel 7, tweede lid][ref3] en
      [artikel 8, zevende lid 7 van de verordening][ref4];




                  Wateronderzoek:


                  Het analyseren van drinkwater van een pluimveebedrijf;




                  Mestonderzoek:


                  Het uitvoeren van een officieel onderzoek door een HOSOWO instantie
      op de aanwezigheid van Salmonella bij leghennenbedrijven als bedoeld in
      [Bijlage II 'Onderzoeksprogramma leghennenbedrijven' van Hygiënebesluit leghennenbedrijven (PPE) 2007][ref5];




                  Certificerende Instantie:


                  Rechtspersoon die is geaccrediteerd volgens de norm NEN-EN-45011 en die door middel van een daartoe
      met het productschap gesloten overeenkomst in het kader van de uitvoering van het Besluit erkenningsvoorwaarden en
      werkwijzen HOSOWO-instanties is belast met de beoordeling van instanties die erkend zijn als HOSOWO-instantie of
      die zich voor erkenning als HOSOWO-instantie hebben aangemeld.




                  Controle Organisatie:


                  Rechtspersoon die is geaccrediteerd volgens de norm NEN-EN-17020 en die door middel van een daartoe
      met het productschap gesloten overeenkomst in het kader van de uitvoering van het Besluit erkenningsvoorwaarden en
      werkwijzen HOSOWO-instanties is belast met de controles van instanties die erkend zijn als HOSOWO-instantie of die
      zich voor erkenning als HOSOWO-instantie hebben aangemeld.




                  Register:


                  Een lijst met erkende HOSOWO-instanties welke wordt bijgehouden door het Productschap.




                  Erkenningsvoorwaarden:


                  De naar een bepaalde HOSOWO-activiteit gespecificeerde voorwaarden als bedoeld in [Bijlage l][ref6]
      van het Besluit erkenningsvoorwaarden en werkwijzen HOSOWO-instanties en die door een in die betreffende activiteit
      functionerende HOSOWO-instantie in acht dienen te worden genomen.




                  Richtlijn 2003/99/EG:


                  Richtlijn 2003/99/EG van het Europees parlement en de Raad van 17 november 2003 inzake de bewaking
      van zoönoses en zoönoseverwekkers en houdende wijziging van Beschikking 90/424/EEG van de Raad en intrekking van
      Richtlijn 92/117/EEG van de Raad.


