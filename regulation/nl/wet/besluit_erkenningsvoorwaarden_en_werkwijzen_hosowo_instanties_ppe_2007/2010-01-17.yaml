  - number: '2'
    text: |-
      1 De voorzitter kan een HOSOWO-instantie erkennen voor de monstername en analyse van een Hygiënogram op een
      pluimveebedrijf indien deze naar zijn oordeel voldoet aan de in [hoofdstuk 1 en 2 van Bijlage l][ref1] opgenomen
      erkenningsvoorwaarden.

      2 De voorzitter kan een HOSOWO-instantie erkennen voor de monstername van een Swabonderzoek op een
      pluimveebedrijf indien deze naar zijn oordeel voldoet aan de in [hoofdstuk 1 en 3 van Bijlage l][ref2] opgenomen
      erkenningsvoorwaarden.

      3 De voorzitter kan een HOSOWO-instantie erkennen voor het analyseren van een Wateronderzoek op een
      pluimveebedrijf indien deze naar zijn oordeel voldoet aan de in [hoofdstuk 1 en 4 van Bijlage l][ref3] opgenomen
      erkenningsvoorwaarden.

      4 De voorzitter kan een HOSOWO-instantie erkennen voor de monstername van een Mestonderzoek op een
      legpluimveebedrijf indien deze naar zijn oordeel voldoet aan de in [hoofdstuk 1 en 5 van Bijlage l][ref4] opgenomen
      erkenningsvoorwaarden.

      5 Aan een erkenning als bedoeld in het eerste, tweede, derde en vierde lid, kunnen nadere voorschriften of
      voorwaarden worden verbonden. De erkenning kan door de voorzitter worden ingetrokken indien is vastgesteld dat niet
      langer aan de erkenningsvoorwaarden of de nadere voorschriften of voorwaarden wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0023545
