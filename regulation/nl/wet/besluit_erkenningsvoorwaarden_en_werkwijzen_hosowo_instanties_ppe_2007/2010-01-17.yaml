  - number: '3'
    text: |-
      1 Door of namens de voorzitter wordt voorafgaand aan de erkenning een controle uitgevoerd bij de instantie die
      erkend wil worden als HOSOWO-instantie.

      2 Door of namens de voorzitter wordt voorafgaand aan de erkenning een beoordeling van de controle bedoeld in lid
      1 uitgevoerd.

      3 Nadat de instantie op basis van een controle als bedoeld in het eerste lid door de voorzitter als HOSOWO-
      instantie is erkend, wordt jaarlijks door of namens de voorzitter een vervolgcontrole uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0023545/2010-01-17#Artikel3
  - number: 3a
    text: |-
      De procedure voor de erkenning, als bedoeld in [artikel 2][ref1] en de procedure voor de controle, als
      bedoeld in [artikel 3][ref2], worden overeenkomstig de 'Erkenningsprocedure HOSOWO-instanties', opgenomen in
      [Bijlage IV][ref3] uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0023545#Artikel2
