    text: |-
      Over de periode van een jaar bedraagt de gemiddelde arbeidsduur voor de voorzitter van het bestuur van het
      Bedrijfsfonds voor de pers 8 uur per week, en voor de overige leden van het bestuur van het Bedrijfsfonds voor de
      pers 4 uur per week.
    url: https://wetten.overheid.nl/BWBR0012595/2001-06-27#Artikel3
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
