        artikel: '2'
  - number: 1.c
    text: |-
      scheidsrechter: de deskundige, bedoeld in [artikel 21, tweede lid, van de Binnenschepenwet][ref1] of de arts,
      bedoeld in [artikel 19, tweede lid, van het Besluit vaartijden en bemanningssterkte binnenvaart][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0007124#Artikel19
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0007124
        artikel: '19'
  - number: 1.d
    text: |-
      medisch adviseur scheepvaart: de medisch adviseur scheepvaart van de Inspectie Verkeer en Waterstaat en diens
      plaatsvervanger;
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel1
  - number: 1.e
    text: |-
      geneeskundig onderzoek: het onderzoek, bedoeld in [artikel 4][ref1], ter verkrijging van de in onderdeel a genoemde
      documenten;


      [ref1]: https://wetten.overheid.nl/BWBR0023699#Artikel4
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023699
        artikel: '4'
  - number: 1.f
    text: |-
      eigen verklaring: de verklaring, bedoeld in [artikel 23, tweede lid, van de Binnenschepenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003443#Artikel23
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003443
        artikel: '23'
  - number: '2.1'
    text: |-
      Als arts zijn aangewezen de in Nederland en België gevestigde geneeskundigen die op grond van
      [artikel 40, eerste lid, van de Zeevaartbemanningswet][ref1] zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel40
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '40'
  - number: '2.2'
    text: |-
      Als scheidsrechter zijn aangewezen de in Nederland gevestigde geneeskundigen die op grond van
      [artikel 42, eerste lid, van de Zeevaartbemanningswet][ref1] zijn aangewezen. De scheidsrechter is niet degene door
      wie het eerste onderzoek is verricht


      [ref1]: https://wetten.overheid.nl/BWBR0009124#Artikel42
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009124
        artikel: '42'
  - number: '3.1'
    text: |-
      De aanvrager wendt zich voor een geneeskundig onderzoek tot een arts, niet zijnde de behandelend arts van de
      aanvrager.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel3
  - number: '3.2'
    text: |-
      De arts gaat niet tot een geneeskundig onderzoek over dan nadat de aanvrager zich heeft gelegitimeerd en de arts
      in het register van keuringsuitslagen heeft kunnen vaststellen dat hij gezien de eerdere uitslagen of aantekeningen
      gerechtigd is de keuring te verrichten.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel3
  - number: '4.1'
    text: |-
      De arts verricht het geneeskundig onderzoek op basis van de keuringseisen en keuringsaanwijzingen, opgenomen in
      [bijlage I][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023699
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023699
  - number: '4.2'
    text: |-
      Indien ingevolge [bijlage I][ref1] een medisch rapport is voorgeschreven, dan wel bij twijfel of de aanvrager
      voldoet aan de keuringseisen, vraagt de arts de benodigde geneeskundige informatie op bij de behandelend arts.
      Bij het ontbreken van voldoende informatie verwijst de arts de aanvrager voor een deelonderzoek door naar een
      specialist.


      [ref1]: https://wetten.overheid.nl/BWBR0023699
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023699
  - number: '4.3'
    text: |-
      Het geneeskundig onderzoek wordt door de arts afgerond na ontvangst van de informatie van de behandelend arts of de
      uitslag van het specialistisch deelonderzoek.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel4
  - number: '4.4'
    text: |-
      De arts maakt uitsluitend gebruik van het keuringsformulier en de formulieren voor de geneeskundige verklaring en
      het bericht van afkeuring die hem door de medisch adviseur scheepvaart kosteloos worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel4
  - number: '4.5'
    text: |-
      De arts bewaart het keuringsformulier en eventuele andere stukken betrekking hebbende op het onderzoek, gedurende
      de termijn en op de wijze, bepaald in [artikel 454, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel454
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '454'
  - number: '5.1'
    text: |-
      De aanvrager is geschikt als hij voldoet aan de keuringseisen en keuringsaanwijzingen, opgenomen in
      [bijlage I][ref1]. De arts vermeldt bij geschiktheid van de aanvrager de uitslag van het geneeskundig onderzoek op
      de geneeskundige verklaring, die is vastgesteld volgens het model, opgenomen in [bijlage II][ref2] en verstrekt de
      geneeskundige verklaring aan de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0023699
      [ref2]: https://wetten.overheid.nl/BWBR0023699
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0023699
      - id: ref2
        bwb_id: BWBR0023699
  - number: '5.2'
    text: |-
      Bij tijdelijke geschiktheid van de aanvrager verstrekt de arts de aanvrager een geneeskundige verklaring van
      tijdelijke geschiktheid.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel5
  - number: '5.3'
    text: |-
      In het geval, bedoeld in het tweede lid, vindt een volgende keuring plaats door dezelfde arts die de aanvrager
      tijdelijk geschikt heeft bevonden, dan wel diens opvolger of waarnemer, tenzij de medisch adviseur scheepvaart
      instemt met keuring door een andere arts.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel5
  - number: '6.1'
    text: |-
      De aanvrager is ongeschikt als hij niet voldoet aan de keuringseisen en keuringsaanwijzingen, opgenomen in
      [bijlage I][ref1]. De arts die na het volledige geneeskundig onderzoek van oordeel is dat de aanvrager ongeschikt
      is, deelt dit de aanvrager mee. De arts overhandigt de aanvrager een bericht van afkeuring, die is vastgesteld,
      volgens het model, opgenomen in [bijlage III][ref2], waarin de reden of redenen tot afkeuring zijn vermeld. De arts
      deelt de aanvrager tevens mee dat een heronderzoek kan worden aangevraagd bij een scheidsrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0023699
      [ref2]: https://wetten.overheid.nl/BWBR0023699
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023699
      - id: ref2
        bwb_id: BWBR0023699
  - number: '6.2'
    text: |-
      In het geval, bedoeld in het eerste lid, verzendt de arts nog dezelfde dag het bericht van afkeuring, waarin de
      reden of redenen tot afkeuring zijn vermeld, aan de medisch adviseur scheepvaart. De medisch adviseur scheepvaart
      doet mededeling van de afkeuring aan de instanties die belast zijn met de afgifte van vaarbewijzen en Rijnpatenten
      en de afgifte van dienstboekjes.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel6
  - number: '6.3'
    text: |-
      De aanvrager die een heronderzoek wenst, richt zich daarvoor tot een scheidsrechter onder toezending van het
      bericht van afkeuring.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel6
  - number: '6.4'
    text: |-
      Ten aanzien van het heronderzoek zijn de [artikelen 3, tweede lid][ref1], en [4][ref2] van overeenkomstige
      toepassing, met dien verstande dat reeds door de arts in orde bevonden onderdelen van de keuring niet behoeven
      te worden herhaald, tenzij over de uitslag twijfel bestaat bij de scheidsrechter. In voorkomende gevallen kan het
      heronderzoek bestaan uit het uitsluitend beoordelen van de reeds ter beschikking staande gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0023699#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023699#Artikel4
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023699
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0023699
        artikel: '4'
  - number: '6.5'
    text: |-
      Indien de scheidsrechter na het heronderzoek van oordeel is dat de aanvrager medisch ongeschikt is, doet de medisch
      adviseur scheepvaart na ontvangst van het bericht van afkeuring hiervan mededeling aan de instanties die belast
      zijn met de afgifte van vaarbewijzen en Rijnpatenten en de afgifte van dienstboekjes.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel6
  - number: '7'
    text: |-
      De arts die na het volledige geneeskundig onderzoek van oordeel is dat de aanvrager tijdelijk ongeschikt is, deelt
      dit de aanvrager mee. De arts overhandigt de aanvrager een verklaring van tijdelijke ongeschiktheid. In afwijking
      van [artikel 6][ref1] deelt de arts de aanvrager tevens mee dat een heronderzoek kan worden aangevraagd bij
      dezelfde arts die de aanvrager tijdelijk geschikt heeft bevonden, dan wel diens opvolger of waarnemer, tenzij de
      medisch adviseur scheepvaart instemt met keuring door een andere arts.


      [ref1]: https://wetten.overheid.nl/BWBR0023699#Artikel6
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023699
        artikel: '6'
  - number: '8'
    text: |-
      Indien nog geen heronderzoek heeft plaatsgevonden, is een geneeskundige verklaring, waarop is aangegeven dat de
      aanvrager geschikt is en die is afgegeven nadat hij door een andere arts ongeschikt is bevonden, ongeldig.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel8
  - number: '9.1'
    text: |-
      Indien de aanvrager in de gevallen, bedoeld in
      [artikel 7, eerste lid, aanhef en onder a, van het Besluit vaarbewijzen binnenvaart][ref1], een eigen verklaring
      overlegt aan de instantie die het klein vaarbewijs afgeeft, maakt hij daartoe gebruik van het formulier dat is
      opgenomen in [Bijlage IV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0023699
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0023699
  - number: '9.2'
    text: |-
      Indien de aanvrager in de gevallen, bedoeld in
      [artikel 7, eerste lid, aanhef en onder b tot en met e, van het Besluit vaarbewijzen binnenvaart][ref1], een eigen
      verklaring overlegt aan de instantie die belast is met de afgifte van het groot vaarbewijs of het Rijnpatent, maakt
      hij daartoe gebruik van het formulier dat is opgenomen in [Bijlage IV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003526#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0023699
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003526
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0023699
  - number: '9.3'
    text: |-
      Indien alle vragen van de eigen verklaring met ‘nee’ zijn beantwoord, stuurt de aanvrager de ingevulde en
      ondertekende eigen verklaring samen met de aanvraag voor het vaardocument naar:
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel9
  - number: 9.3.a
    text: de instantie belast met de afgifte van klein vaarbewijzen in het geval, bedoeld in het eerste lid; of
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel9
  - number: 9.3.b
    text: |-
      de instantie belast met de afgifte van groot vaarbewijzen en Rijnpatenten in de gevallen, bedoeld in het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel9
  - number: '10.1'
    text: |-
      Indien ten minste een van de vragen van de eigen verklaring met ‘ja’ is beantwoord wordt deze voorzien van een
      aantekening van een arts naar eigen keuze, waaruit de aard en de ernst van de afwijking blijkt.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel10
  - number: '10.2'
    text: 'De aanvrager verzendt de in het eerste lid bedoelde eigen verklaring ter beoordeling aan:'
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel10
  - number: 10.2.a
    text: |-
      de medisch adviseur scheepvaart indien de eigen verklaring betrekking heeft op het klein vaarbewijs, dan wel het
      groot vaarbewijs; of
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel10
  - number: 10.2.b
    text: |-
      de keuringsartsen van het Centraal Bureau Rijvaardigheidsbewijzen indien de eigen verklaring betrekking heeft op
      het klein vaarbewijs.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel10
  - number: '11.1'
    text: |-
      In het geval, bedoeld in [artikel 10, eerste lid][ref1], verklaart de beoordelaar de aanvrager geschikt of
      ongeschikt op basis van de keuringseisen en keuringsaanwijzingen, opgenomen in [bijlage I][ref2]. In geval van
      twijfel kan de beoordelaar de aanvrager oproepen voor een nader onderzoek. Indien nodig kan de beoordelaar de
      aanvrager doorverwijzen voor een deelonderzoek naar een specialist.


      [ref1]: https://wetten.overheid.nl/BWBR0023699#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0023699
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023699
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0023699
  - number: '11.2'
    text: |-
      De aanvrager is geschikt als hij voldoet aan de keuringseisen en keuringsaanwijzingen, opgenomen in
      [bijlage I][ref1]. In geval de beoordelaar de aanvrager geschikt verklaart, verstrekt de beoordelaar, onder
      vermelding van deze uitslag, de aanvrager een geneeskundige verklaring, die is vastgesteld volgens het model,
      opgenomen in [Bijlage II][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023699
      [ref2]: https://wetten.overheid.nl/BWBR0023699
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023699
      - id: ref2
        bwb_id: BWBR0023699
  - number: '11.3'
    text: |-
      De aanvrager is ongeschikt als hij niet voldoet aan de keuringseisen en keuringsaanwijzingen, opgenomen in
      [bijlage I][ref1]. In het geval, dat de beoordelaar de aanvrager ongeschikt verklaart, zendt de beoordelaar de
      aanvrager een bericht van afkeuring, onder mededeling van de mogelijkheid van heronderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0023699
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023699
  - number: '11.4'
    text: |-
      In het geval, bedoeld in het derde lid, zendt de beoordelaar de medisch adviseur scheepvaart nog dezelfde dag het
      bericht van afkeuring, waarin de reden of redenen tot afkeuring zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel11
  - number: '11.5'
    text: |-
      De aanvrager die ongeschikt is verklaard en een heronderzoek wenst, wendt zich tot een scheidsrechter die
      niet reeds bij de beoordeling van de eigen verklaring was betrokken. Ten aanzien van het heronderzoek zijn
      de [artikelen 3, tweede lid][ref1], en [4][ref2] van overeenkomstige toepassing, met dien verstande, dat het
      heronderzoek kan bestaan uit het uitsluitend beoordelen van de ter beschikking staande gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0023699#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023699#Artikel4
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023699
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0023699
        artikel: '4'
  - number: '11.6'
    text: |-
      De medisch adviseur scheepvaart doet mededeling van de afkeuring aan de instanties die belast zijn met de afgifte
      van vaarbewijzen en Rijnpatenten en de afgifte van dienstboekjes.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel11
  - number: '11.7'
    text: |-
      De keuringsartsen van het Centraal Bureau Rijvaardigheidsbewijzen doen melding van de afkeuring aan de instantie
      belast met de afgifte van klein vaarbewijzen.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel11
  - number: '12'
    text: |-
      De resultaten van het geneeskundig onderzoek worden door de arts, met inachtneming van de instructie van de medisch
      adviseur scheepvaart binnen de door deze vast te stellen termijn, aangetekend in het daarvoor bestemde register.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel12
  - number: '14'
    text: De Minister kan aanwijzingen geven ter uitvoering van de in deze regeling opgenomen bepalingen.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel14
  - number: '15'
    text: 'Ingetrokken worden:'
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel15
  - number: 15.a
    text: |-
      de [Regeling geneeskundig onderzoek vaarbewijzen binnenvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0010270
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0010270
  - number: 15.b
    text: |-
      de [Regeling aanwijzing keuringsartsen Reglement Rijnpatenten 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009767
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009767
  - number: '16'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel16
  - number: '17'
    text: 'Deze regeling wordt aangehaald als: Regeling medische keuringen binnenvaart 2008.'
    url: https://wetten.overheid.nl/BWBR0023699/2008-04-01#Artikel17
