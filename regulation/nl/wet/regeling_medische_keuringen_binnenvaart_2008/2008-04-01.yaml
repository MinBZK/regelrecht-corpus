      [artikel 19, eerste lid, van het Besluit vaartijden en bemanningssterkte binnenvaart][ref1] en
      [artikel 23.03, eerste lid, van het Reglement onderzoek schepen op de Rijn 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007124#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0007858#Artikel23
