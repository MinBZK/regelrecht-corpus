$id: rijkswet_instelling_exclusieve_economische_zone
regulatory_layer: WET
publication_date: '2013-12-18'
valid_from: '2023-01-01'
bwb_id: BWBR0010480
url: https://wetten.overheid.nl/BWBR0010480/2023-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het, in het bijzonder voor een verhoogde bescherming en een beter behoud
    van het mariene milieu, wenselijk is de rechtsmacht van het Koninkrijk uit te breiden en daartoe over te gaan tot
    de instelling van een exclusieve economische zone;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010480/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Er is een exclusieve economische zone van het Koninkrijk.

      2 De exclusieve economische zone van het Koninkrijk is het gebied buiten en grenzend aan de territoriale zee
      van het Koninkrijk dat zich niet verder uitstrekt dan tweehonderd zeemijlen vanaf de basislijnen, vanaf welke de
      breedte van de territoriale zee wordt gemeten.
    url: https://wetten.overheid.nl/BWBR0010480/2023-01-01#Artikel1
  - number: '2'
    text: |-
      De buitengrens van de exclusieve economische zone wordt voor Nederland vastgesteld bij algemene maatregel van
      bestuur en voor Curaçao, Aruba, Sint Maarten en de openbare lichamen Bonaire, Sint Eustatius en Saba bij algemene
      maatregel van rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0010480/2023-01-01#Artikel2
  - number: '3'
    text: |-
      Het Koninkrijk heeft, met inachtneming van de grenzen die het volkenrecht stelt, in de exclusieve economische zone:

      a. soevereine rechten ten behoeve van de exploratie en exploitatie, het behoud en het beheer van de levende en
      niet-levende natuurlijke rijkdommen van de wateren boven de zeebodem en van de zeebodem en de ondergrond daarvan,
      en met betrekking tot andere activiteiten voor de economische exploitatie en exploratie van de zone, zoals de
      opwekking van energie uit het water, de stromen en de winden;

      b. rechtsmacht ten aanzien van de bouw en het gebruik van kunstmatige eilanden, installaties en inrichtingen, het
      wetenschappelijk zeeonderzoek en de bescherming en het behoud van het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0010480/2023-01-01#Artikel3
  - number: '4'
    text: |-
      Deze rijkswet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor elk der landen van het
      Koninkrijk verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0010480/2023-01-01#Artikel4
  - number: '5'
    text: 'Deze rijkswet kan worden aangehaald als: Rijkswet instelling exclusieve economische zone.'
    url: https://wetten.overheid.nl/BWBR0010480/2023-01-01#Artikel5
