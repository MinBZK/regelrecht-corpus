---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_toezicht_trustwezen_bes
regulatory_layer: WET
publication_date: '2011-12-20'
valid_from: '2010-10-10'
bwb_id: BWBR0028368
url: https://wetten.overheid.nl/BWBR0028368/2010-10-10
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: 1.a
    text: '*beheersdiensten:*'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: 1.a.1
    text: |-
      het oprichten of doen oprichten van een buitengaatse onderneming wanneer zulks wordt verricht door een ingezetene
      van een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: 1.a.2
    text: |-
      het optreden als plaatselijk vertegenwoordiger of als in een openbaar lichaam wonende of gevestigde bestuurder van
      een buitengaatse onderneming;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: 1.a.3
    text: |-
      het aan een buitengaatse onderneming beschikbaar stellen van in een openbaar lichaam wonende of gevestigde
      natuurlijke personen of rechtspersonen als plaatselijk vertegenwoordiger of bestuurder;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: 1.a.4
    text: |-
      het liquideren of doen liquideren van een buitengaatse onderneming wanneer zulks wordt verricht door een ingezetene
      van een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: 1.a.5
    text: het verrichten van andere bij ministeriële regeling aangewezen diensten;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: 1.b
    text: |-
      *verlener van beheersdiensten:* degene die op grond van [artikel 2][ref1] bevoegd is om beheersdiensten te
      verlenen;


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel2
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.c
    text: |-
      *trustkantoor:* een rechtspersoon, een maatschap of een natuurlijk persoon die beroeps- of bedrijfsmatig
      beheersdiensten verleent;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: 1.d
    text: |-
      *buitengaatse onderneming:* een statutair of feitelijk in een openbaar lichaam gevestigde rechtspersoon, waarvan
      het statutaire doel in opdracht en ten behoeve van een of meer niet-ingezetenen of de rechtspersoon zelf wordt
      nagestreefd met middelen, toebehorend aan een of meer niet-ingezetenen of de rechtspersoon zelf, en waarvan de
      geplaatste aandelen eigendom zijn van een of meer niet-ingezetenen;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: 1.e
    text: '*Bank:* De Nederlandsche Bank N.V.;'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: 1.f
    text: '*Onze Minister:* Onze Minister van Financiën;'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: 1.g
    text: '*openbaar lichaam:* het openbaar lichaam Bonaire, Sint Eustatius of Saba.'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel1
  - number: '2.1'
    text: |-
      Het is een ieder, met uitzondering van degenen vermeld in het tweede lid, verboden in of vanuit een openbaar
      lichaam beheersdiensten te verlenen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel2
  - number: '2.2'
    text: 'Beheersdiensten mogen uitsluitend verleend worden door:'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel2
  - number: 2.2.a
    text: |-
      trustkantoren die in het bezit zijn van een vergunning als bedoeld in [artikel 3][ref1] en door de natuurlijke
      personen en rechtspersonen die staan vermeld op de bijlagen van een aan een trustkantoor verleende vergunning;


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel3
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 2.2.b
    text: personen die daartoe ontheffing hebben verkregen van de Bank.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      Een ontheffing kan worden verleend aan een natuurlijk persoon of rechtspersoon die van het verlenen van
      beheersdiensten geen bedrijf maakt, indien er naar het oordeel van de Bank gegronde redenen aanwezig zijn voor de
      buitengaatse onderneming om de diensten door die persoon te doen verlenen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel2
  - number: '2.4'
    text: |-
      Een ontheffing geldt slechts voor diensten die worden verleend aan de in de ontheffing genoemde buitengaatse
      onderneming of aan entiteiten die behoren tot een in de ontheffing genoemd concern.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel2
  - number: '2.5'
    text: |-
      Aan een ontheffing kunnen voorwaarden worden verbonden. De voorwaarden kunnen worden gewijzigd. Een ontheffing kan
      worden ingetrokken wanneer daarvan misbruik of oneigenlijk gebruik wordt gemaakt, of wanneer aan de voorwaarden
      niet of niet voldoende wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel2
  - number: '3.1'
    text: De Bank verleent de vergunning voor het werkzaam zijn als trustkantoor.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      Voor het verkrijgen van een vergunning is vereist dat de aanvrager kantoor houdt in een openbaar lichaam en voldoet
      aan bij ministeriële regeling te stellen eisen met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel3
  - number: 3.2.a
    text: deskundigheid en integriteit;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel3
  - number: 3.2.b
    text: financiële waarborgen; en
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel3
  - number: 3.2.c
    text: bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      Aan een aanvrager die zulks verzoekt, kan een vergunning worden verleend onder de voorwaarde dat het bedrijf zich
      zal beperken tot, of zich zal onthouden van, het verlenen van diensten aan buitengaatse ondernemingen met bepaalde
      kenmerken. De in het tweede lid bedoelde vereisten van deskundigheid en integriteit worden aan de opgelegde
      beperkingen aangepast.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel3
  - number: '3.4'
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      Bij de aanvraag voor een vergunning legt de aanvrager aan de Bank over zodanige documentatie als redelijkerwijs
      nodig is om te kunnen beoordelen of de aanvrager aan de in [artikel 3][ref1] bedoelde vereisten voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel3
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '4.2'
    text: 'Bij de aanvrage worden voorts overgelegd:'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel4
  - number: 4.2.a
    text: |-
      Indien de aanvrager een natuurlijk persoon is: zijn curriculum vitae en een naar genoegen van de Bank gewaarmerkte
      kopie van een geldig paspoort, onder vermelding van zijn woonplaats en adres.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel4
  - number: 4.2.b
    text: |-
      Indien de aanvrager een rechtspersoon is: een uittreksel van de inschrijving van de aanvrager in het
      handelsregister ter plaatse waar de aanvrager is gevestigd, alsmede de door een notaris gewaarmerkte tekst van de
      geldende statuten, de namen en de adressen van de aandeelhouders, en de namen en de adressen van de personen die
      anders dan als bestuurder of middellijke of onmiddellijke aandeelhouder het beleid van de aanvrager bepalen of
      mede bepalen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel4
  - number: 4.2.c
    text: |-
      Indien de aanvrager een maatschap is: het onder a en b bedoelde met betrekking tot ieder der maten, ook de
      eventuele commanditaire vennoten, alsmede een door een notaris gewaarmerkt afschrift van de maatschapovereenkomst
      waaruit blijkt het doel van de maatschap en de onderlinge taakverdeling der maten.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      Indien de Bank na ontvangst van de aanvraag nadere informatie nodig acht, stelt zij de aanvrager in de gelegenheid
      om deze nadere informatie binnen een door haar te stellen redelijke termijn te verschaffen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel4
  - number: '4.4'
    text: |-
      De aanvraag wordt afgewezen indien de aanvrager niet of onvoldoende heeft aangetoond dat hij aan de in
      [artikel 3][ref1] gestelde vereisten voldoet, wanneer de Bank redenen heeft om aan zijn integriteit te twijfelen
      of wanneer de Bank het niet aannemelijk acht dat de aanvrager voornemens is hetgeen in [artikel 12][ref2] is
      voorgeschreven nauwgezet na te leven.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028368#Artikel12
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028368
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.5'
    text: |-
      Op de aanvraag wordt door de Bank binnen 60 dagen na volledige ontvangst daarvan, respectievelijk binnen 60 dagen
      na ontvangst van de nadere informatie, beschikt.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel4
  - number: '5.1'
    text: 'De Bank trekt een vergunning in:'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel5
  - number: 5.1.a
    text: wanneer de vergunninghouder zulks verzoekt;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel5
  - number: 5.1.b
    text: |-
      wanneer de vergunninghouder is opgehouden beroeps- of bedrijfsmatig beheersdiensten te verlenen of daarmee niet is
      aangevangen binnen een door de Bank gestelde termijn na het verlenen van de vergunning;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel5
  - number: 5.1.c
    text: |-
      indien de gegevens of bescheiden die zijn verstrekt ter verkrijging van de vergunning zodanig onjuist of onvolledig
      blijken dat op het verzoek een andere beslissing zou zijn genomen als bij de beoordeling van het verzoek de juiste
      omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel5
  - number: 5.1.d
    text: |-
      indien zich omstandigheden voordoen of feiten bekend worden op grond waarvan zo zij vóór het tijdstip waarop de
      vergunning werd verleend zich hadden voorgedaan, of bekend waren geweest, de vergunning zou zijn geweigerd;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel5
  - number: 5.1.e
    text: |-
      indien de vergunninghouder handelt in strijd met deze wet, de [Wet identificatie bij dienstverlening BES][ref1], de
      [Wet melding ongebruikelijke transacties BES][ref2] of de [Sanctiewet 1977][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0028490
      [ref2]: https://wetten.overheid.nl/BWBR0028598
      [ref3]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028490
      - id: ref2
        bwb_id: BWBR0028598
      - id: ref3
        bwb_id: BWBR0003296
  - number: 5.1.f
    text: |-
      indien de vergunninghouder niet meer voldoet aan de vereisten, bedoeld in [artikel 3, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel3
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 5.1.g
    text: wanneer van de vergunning misbruik of oneigenlijk gebruik wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel5
  - number: 5.1.h
    text: |-
      wanneer de vergunninghouder of een van de beleidsbepalende personen van het betreffende trustkantoor door een
      binnenlandse of buitenlandse rechter veroordeeld wordt wegens een door de Bank vooraf te publiceren misdrijf.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      Wanneer de vergunning is ingetrokken, is de vergunninghouder verplicht het verlenen van beheersdiensten
      onmiddellijk te staken, ongeacht een ingesteld beroep.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel5
  - number: '5.3'
    text: De intrekking, bedoeld in het eerste lid, wordt door de Bank bij deurwaardersexploit aan de betrokkene betekend.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel5
  - number: '6.1'
    text: |-
      De Bank voegt aan de vergunning toe een bijlage «A» waarop staan geplaatst de rechtspersonen die voor de toepassing
      van deze wet onder de verantwoordelijkheid van de vergunninghouder diensten verlenen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel6
  - number: '6.2'
    text: |-
      Bij het verzoek tot plaatsing van een naam op deze bijlage, verklaart de vergunninghouder de wijze waarop
      het bedrijf van de rechtspersoon in dat van de vergunninghouder is geconsolideerd of op welke andere wijze de
      werkzaamheden van de rechtspersoon in het toezicht op de vergunninghouder zullen worden betrokken.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel6
  - number: '6.3'
    text: |-
      Bij het verzoek tot plaatsing worden voorts overgelegd een uittreksel van de inschrijving in het handelsregister
      ter plaatse waar de rechtspersoon is gevestigd, alsmede de door een notaris gewaarmerkte tekst van de geldende
      statuten, de namen en de adressen van de aandeelhouders en de namen en de adressen van de personen die anders dan
      als bestuurder of onmiddellijke aandeelhouder het beleid van de rechtspersoon bepalen of mede bepalen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      De Bank voegt aan de vergunning toe een bijlage «B» waarop staan geplaatst de natuurlijke personen die voor de
      toepassing van deze wet onder verantwoordelijkheid van de vergunninghouder diensten verlenen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      Bij het verzoek tot plaatsing van een naam op deze bijlage, geeft de vergunninghouder op welke functie de persoon
      vervult binnen de organisatie van de vergunninghouder.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel7
  - number: '7.3'
    text: |-
      Bij het verzoek tot plaatsing worden voorts overgelegd het curriculum vitae van de persoon en een naar genoegen van
      de Bank gewaarmerkte kopie van een geldig paspoort, onder vermelding van zijn woonplaats en adres.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel7
  - number: '8.1'
    text: |-
      Indien de Bank na ontvangst van een verzoek tot plaatsing op een der bijlagen nadere informatie nodig acht, stelt
      zij de verzoeker in de gelegenheid om deze nadere informatie binnen een door haar te stellen redelijke termijn
      te verschaffen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      Plaatsing op de bijlage wordt geweigerd indien de Bank van oordeel is dat de werkzaamheden van de natuurlijke
      of rechtspersoon niet of onvoldoende betrokken zullen worden in het toezicht op de vergunninghouder of indien
      niet wordt voldaan aan bij ministeriële regeling te stellen voorschriften met betrekking tot deskundigheid en
      integriteit.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel8
  - number: '8.3'
    text: |-
      Op het verzoek wordt door de Bank binnen 60 dagen na ontvangst daarvan, respectievelijk binnen 60 dagen na
      ontvangst van de nadere informatie, beschikt.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel8
  - number: '9.1'
    text: |-
      De plaatsing op een bijlage als bedoeld in de [artikelen 6][ref1] of [7][ref2] wordt doorgehaald door de Bank:


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028368#Artikel7
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028368
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 9.1.a
    text: wanneer de vergunninghouder of de geplaatste zelf zulks verzoekt;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel9
  - number: 9.1.b
    text: |-
      indien de gegevens of bescheiden die zijn verstrekt ter plaatsing op de bijlage zodanig onjuist of onvolledig
      blijken dat op het verzoek een andere beslissing zou zijn genomen als bij de beoordeling van het verzoek de juiste
      omstandigheden volledig bekend waren geweest;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel9
  - number: 9.1.c
    text: |-
      indien zich omstandigheden voordoen of feiten bekend worden op grond waarvan zo zij vóór het tijdstip waarop
      plaatsing op de bijlage is geschied zich hadden voorgedaan, of bekend waren geweest, de plaatsing zou zijn
      geweigerd;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel9
  - number: 9.1.d
    text: |-
      indien blijkt dat de werkzaamheden van de geplaatste niet of niet meer voldoende betrokken zijn in het toezicht op
      de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel9
  - number: 9.1.e
    text: |-
      indien zij niet meer voldoen aan de eisen, bedoeld in [artikel 8, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel8
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 9.1.f
    text: |-
      wanneer de vergunninghouder of een van de beleidsbepalende personen van het betreffende trustkantoor door een
      binnenlandse of buitenlandse rechter veroordeeld wordt wegens het witwassen van gelden, fraude, onrechtmatige
      verrijking ten koste van een buitengaatse onderneming, financiering van terrorisme of een ander bij ministeriële
      regeling aan te geven misdrijf.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel9
  - number: '9.2'
    text: |-
      In de gevallen, genoemd in het eerste lid, dient de betrokkene onmiddellijk zijn werkzaamheden te staken, ongeacht
      een ingesteld beroep. De ontheffing van de buitengaatse onderneming, als bedoeld in [artikel 1, onder d][ref1],
      blijft niettegenstaande de intrekking van de vergunning van de vergunninghouder van kracht tot 60 dagen na de datum
      van de intrekking van genoemde vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel1
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '1'
        hoofdstuk: '1'
  - number: '10.1'
    text: De Bank houdt een register voor trustkantoren.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel10
  - number: '10.2'
    text: |-
      Een trustkantoor waaraan krachtens [artikel 3][ref1] een vergunning is verleend, wordt door de Bank per gelijke
      datum als waarop de vergunning is verleend, door de Bank ingeschreven in het register. Eveneens worden de bijlagen,
      bedoeld in de [artikelen 6][ref2] en [7][ref3], en de wijzigingen daarin door de Bank in het register ingeschreven
      bij het desbetreffende trustkantoor.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028368#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0028368#Artikel7
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028368
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028368
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '10.3'
    text: |-
      De inschrijving van een trustkantoor waarvan de vergunning is ingetrokken wordt doorgehaald. De bijlagen worden
      alsmede doorgehaald.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel10
  - number: '10.4'
    text: |-
      De inschrijving van een trustkantoor alsmede de doorhaling worden binnen twee weken na de dag, waarop zij heeft
      plaatsgehad, medegedeeld in de Staatscourant. De kosten van de publicatie van de inschrijving en de doorhaling
      komen ten laste van degene die de vergunning heeft gekregen respectievelijk van degene wiens vergunning is
      ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel10
  - number: '10.5'
    text: |-
      De Bank kan bepalen dat de in het vierde lid bedoelde mededeling van een doorhaling tot een nader door haar te
      bepalen tijdstip wordt aangehouden indien openbaarmaking ernstige schade aan de belangen van de belanghebbende zou
      kunnen toebrengen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel10
  - number: '10.6'
    text: |-
      In de maand januari van elk jaar wordt een lijst van de ingeschreven trustkantoren naar de stand per 31 december
      van het voorafgaande jaar in de Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel10
  - number: '10.7'
    text: De Bank houdt een afschrift van het register voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Een trustkantoor waaraan een vergunning is verleend, is verplicht zich te blijven houden aan bij ministeriële
      regeling te stellen voorschriften met betrekking tot deskundigheid en integriteit, financiële waarborgen en
      bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel11
  - number: '11.2'
    text: |-
      Een trustkantoor is verplicht de Bank doorlopend te informeren omtrent voorgenomen wijzigingen van zijn
      statuten, in de samenstelling van zijn aandeelhouders, bestuur en raad van commissarissen, en in de feiten en
      omstandigheden betreffende de natuurlijke of rechtspersonen die geplaatst zijn op één van de bij de vergunning
      behorende bijlagen, alsmede omtrent bij ministeriële regeling aan te wijzen onderwerpen. De Bank toetst
      deze informatie aan de voorschriften, genoemd in het eerste lid respectievelijk de voorschriften, genoemd in
      [artikel 8, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel8
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '12.1'
    text: |-
      Een verlener van beheersdiensten is verplicht met betrekking tot iedere buitengaatse onderneming aan wie hij
      beheersdiensten verleent over gegevens te beschikken die aanwijzen:
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel12
  - number: 12.1.a
    text: |-
      de directe en indirecte bron of bronnen van het kapitaal dat bij de oprichting en daarna in de onderneming is
      ingebracht; en
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel12
  - number: 12.1.b
    text: |-
      degene of degenen door wie middellijk of onmiddellijk aanspraken gemaakt kunnen worden op de uitkering, het
      kapitaal en het overschot na ontbinding.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel12
  - number: '12.2'
    text: |-
      Bij ministeriële regeling, houdende algemene maatregelen, kunnen regels worden gesteld op welke wijze de verleners
      van beheersdiensten aan de in het eerste lid bedoelde verplichtingen dienen te voldoen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel12
  - number: '13.1'
    text: |-
      Wanneer een verlener van beheersdiensten met betrekking tot een buitengaatse onderneming waaraan hij
      beheersdiensten verleent niet of niet meer kan beschikken over bijgewerkte gegevens als bedoeld in
      [artikel 12][ref1], dient hij onverwijld de dienstverlening te staken. Hij kan daarop de Bank verzoeken toe te
      staan de dienstverlening voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel12
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '13.2'
    text: |-
      De Bank kan het verzoek, bedoeld in het eerste lid, slechts toestaan onder het stellen van voorwaarden die erop
      gericht zijn de beschikbaarheid van gegevens te normaliseren of om te komen tot een ordelijke ontbinding van de
      buitengaatse onderneming waarom het gaat.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel13
  - number: '13.3'
    text: |-
      Een verlener van beheersdiensten die de dienstverlening staakt op grond van hetgeen in een van de voorgaande leden
      van dit artikel is bepaald, kan door belanghebbenden of derden niet aansprakelijk worden gesteld voor daaruit
      voortvloeiende schade, tenzij er sprake is van opzet of grove schuld van de verlener van beheersdiensten.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel13
  - number: '14.1'
    text: |-
      De verlener van beheersdiensten is jegens een ieder, met uitzondering van de Bank, verplicht tot geheimhouding van
      de in [artikel 12][ref1] bedoelde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel12
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '14.2'
    text: 'De in het eerste lid bedoelde verplichting is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel14
  - number: 14.2.a
    text: |-
      voor zover de geheimhouding in strijd zou komen met een meldingsplicht of een andere verplichting ingevolge de
      [Wet melding ongebruikelijke transacties BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028598
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028598
  - number: 14.2.b
    text: |-
      wanneer de verlener van beheersdiensten wordt geroepen om als getuige op te treden in het kader van de opsporing,
      het gerechtelijk vooronderzoek of de behandeling ter terechtzitting van een strafbaar feit.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel14
  - number: '14.3'
    text: |-
      Het eerste en tweede lid zijn eveneens van toepassing op de op de bijlagen van een vergunning geplaatste
      natuurlijke of rechtspersonen en diens eventueel personeel evenals op het niet op die bijlagen geplaatste personeel
      van een trustkantoor.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel14
  - number: 14a
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de bij of krachtens de [artikelen 12 tot en met 14][ref1]
      gestelde regels geheel of gedeeltelijk van overeenkomstige toepassing zijn op personen die bij die maatregel aan te
      wijzen diensten verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel12
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '15'
    text: 'Een verlener van beheersdiensten is verplicht onverwijld aan de Bank te melden:'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel15
  - number: 15.a
    text: |-
      wanneer hij op grond van het in [artikel 13][ref1] bepaalde de dienstverlening aan een buitengaatse onderneming
      staakt;


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel13
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 15.b
    text: |-
      wanneer hij aanwijzingen heeft dat een of meer personen en entiteiten die zijn aangewezen in of bij
      een algemene maatregel van bestuur of ministeriële regeling ter uitvoering van [artikel 2][ref1] of
      [7 van de Sanctiewet 1977][ref2], de bron of een van de bronnen zijn van kapitaal, als bedoeld in
      [artikel 12, eerste lid, onder a][ref3], of aanspraken kunnen maken, als bedoeld in artikel 12, eerste lid, onder
      b.


      [ref1]: https://wetten.overheid.nl/BWBR0003296#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003296#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028368#Artikel12
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003296
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003296
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0028368
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '16.1'
    text: |-
      Een verlener van beheersdiensten dient vóór 30 april van ieder jaar aan de Bank te overleggen een gecertificeerde
      verklaring dat onderzoek is gedaan naar de beschikbaarheid van de in [artikel 12][ref1] bedoelde gegevens per de
      eerste januari van dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel12
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '16.2'
    text: |-
      De verklaring van de verlener van beheersdiensten, bedoeld in het eerste lid stelt ook dat de verlener van
      beheersdiensten met betrekking tot iedere buitengaatse vennootschap waaraan hij beheersdiensten verleent, beschikt
      over de in [artikel 12][ref1] bedoelde gegevens. Indien zulks niet zonder voorbehoud kan worden verklaard, wordt
      zulks in de verklaring nader toegelicht onder opgave van de buitengaatse ondernemingen waarop het voorbehoud
      betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel12
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '17.1'
    text: |-
      Ieder trustkantoor is verplicht jaarlijks binnen een bij ministeriële regeling te bepalen termijn een
      jaarrekening ten minste bevattend een balans en een verlies- en winstrekening met bijbehorende toelichting
      over het afgelopen boekjaar in een bij ministeriële regeling vast te stellen vorm bij de Bank in te dienen.
      De verplichtingen, genoemd in dit lid, gelden ook voor rechtspersonen met een ontheffing als bedoeld in
      [artikel 2, tweede lid, onder b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel2
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '2'
        hoofdstuk: '2'
  - number: '17.2'
    text: |-
      Indien de Bank zulks in het belang van een doelmatig toezicht nodig acht, kan zij een trustkantoor opdragen
      rapportage staten nopens zijn bedrijf bij haar in te dienen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel17
  - number: '18'
    text: |-
      De Bank ziet erop toe dat een ieder die beheersdiensten verleent, daartoe bevoegd is op grond van
      [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel2
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '2'
        hoofdstuk: '2'
  - number: '19'
    text: |-
      De Bank ziet erop toe dat een ieder die bevoegd is tot het verlenen van beheersdiensten over de in
      [artikel 12][ref1] bedoelde gegevens beschikt en dat bij het vergaren en bijhouden van die gegevens de in het
      tweede lid van dat artikel bedoelde regels zijn nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel12
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '20.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de daartoe bij besluit van
      de Bank aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel20
  - number: '20.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel20
  - number: '20.3'
    text: |-
      [Titel 5.2 van de Algemene wet bestuursrecht][ref1] is van toepassing, met uitzondering van de
      [artikelen 5.18][ref2] en [5.19][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '21.1'
    text: |-
      De aanvrager van een besluit op grond van deze wet is voor het in behandeling nemen van de aanvraag een vergoeding
      verschuldigd van de met de behandeling van de aanvraag verband houdende kosten.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel21
  - number: '21.2'
    text: Bij ministeriële regeling worden de tarieven vastgesteld ter vergoeding van de in het eerste lid bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel21
  - number: '21.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de doorberekening van
      kosten, verband houdend met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel21
  - number: 21a.1
    text: |-
      Indien een verlener van beheersdiensten niet voldoet aan het bij of krachtens deze wet bepaalde, kan de Bank deze
      verlener van beheersdiensten bij aangetekende brief een met redenen omklede aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel21a
  - number: 21a.2
    text: De verlener van beheersdiensten is verplicht de aanwijzing binnen de door de Bank gestelde termijn op te volgen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel21a
  - number: '22.1'
    text: |-
      De Bank kan degene die niet of niet tijdig voldoet aan zijn uit deze wet voortvloeiende verplichtingen, een
      geldboete opleggen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel22
  - number: '22.2'
    text: |-
      De hoogte van de boete voor de verscheidene overtredingen wordt bepaald bij algemene maatregel van bestuur, met
      dien verstande dat de boete voor een afzonderlijke overtreding ten hoogste USD 250.000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel22
  - number: '22.3'
    text: |-
      Alvorens over te gaan tot oplegging van een boete stelt de Bank betrokkene schriftelijk op de hoogte van het
      voornemen hem een boete op te leggen, onder vermelding van de gronden waarop dat voornemen berust.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel22
  - number: '23.1'
    text: |-
      Het is aan een ieder die uit hoofde van de toepassing van deze wet of van krachtens deze wet genomen besluiten
      enige taak vervult, verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt of ontvangen, of van
      gegevens of inlichtingen bij het onderzoek van boeken, bescheiden of andere informatiedragers verkregen, verder of
      anders gebruik te maken of daaraan verder of anders bekendheid te geven dan voor de uitoefening van zijn taak of
      door deze wet wordt geëist.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel23
  - number: '23.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid is de Bank bevoegd aangifte te doen van een vermoeden van een
      strafbaar feit. In de gevallen waarin door de Bank aangifte is gedaan, dan wel in de gevallen waarin de Bank
      wordt geroepen om als getuige of deskundige op te treden, is de Bank bevoegd in het kader van de opsporing, het
      gerechtelijk vooronderzoek of de behandeling ter terechtzitting, inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel23
  - number: '23.3'
    text: |-
      De Bank kan, in afwijking van het eerste lid, periodiek met gebruikmaking van gegevens of inlichtingen verkregen
      bij de vervulling van de haar ingevolge deze wet opgedragen taak mededeling doen van de voornaamste gegevens,
      mits deze niet worden herleid tot afzonderlijke verleners van beheersdiensten. Met schriftelijke toestemming van
      de verlener van beheersdiensten die het aangaat, worden gegevens met betrekking tot afzonderlijke verleners van
      beheersdiensten wel gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel23
  - number: '24.1'
    text: |-
      De Bank is, in afwijking van [artikel 23][ref1], bevoegd om gegevens of inlichtingen verkregen bij de vervulling
      van de haar ingevolge deze wet opgedragen taak, te verstrekken aan het bevoegd gezag dat in de openbare lichamen,
      andere delen van het Koninkrijk of andere Staten is belast met het toezicht op verleners van beheersdiensten,
      tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel23
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '23'
        hoofdstuk: '6'
  - number: 24.1.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel24
  - number: 24.1.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op verleners van
      beheersdiensten;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel24
  - number: 24.1.c
    text: |-
      de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de wet of de openbare orde
      onderscheidenlijk betrekking hebben op individuele buitengaatse ondernemingen;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel24
  - number: 24.1.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel24
  - number: 24.1.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel24
  - number: 24.1.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel24
  - number: '24.2'
    text: |-
      De Bank is, in afwijking van [artikel 23][ref1], bevoegd om gegevens en inlichtingen verkregen bij de vervulling
      van haar taak aan het Meldpunt Ongebruikelijke Transacties, bedoeld in de Wet melding ongebruikelijke transacties
      BES, te melden.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel23
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '23'
        hoofdstuk: '6'
  - number: '25.1'
    text: |-
      Het bedrijfsmatig verlenen van beheersdiensten zonder de daartoe vereiste vergunning, wordt gestraft met een
      gevangenisstraf van ten hoogste vier jaar en een geldboete van de vijfde categorie, dan wel met één van deze
      straffen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel25
  - number: '25.2'
    text: |-
      Het anders dan bedrijfsmatig verlenen van beheersdiensten zonder daartoe ingevolge [artikel 2][ref1] bevoegd te
      zijn, wordt gestraft met een hechtenis van ten hoogste een jaar en een geldboete van de vijfde categorie, dan wel
      met één van deze straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel2
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0028368
        artikel: '2'
        hoofdstuk: '2'
  - number: '25.3'
    text: |-
      Opzettelijk handelen in strijd met [artikel 12, eerste lid][ref1], [14, eerste lid][ref2], [15][ref3], [17][ref4]
      en [23, eerste lid][ref5], wordt gestraft met een gevangenisstraf van ten hoogste vier jaar en een geldboete van de
      vijfde categorie, dan wel met één van deze straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028368#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0028368#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0028368#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0028368#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0028368#Artikel23
