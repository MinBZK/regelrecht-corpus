  - number: '25.5'
    text: |-
      De in het eerste en derde lid strafbaar gestelde feiten zijn misdrijven. De in het tweede en vierde lid strafbaar
      gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel25
  - number: 25a.1
    text: |-
      Met de opsporing van de in deze wet strafbaar gestelde feiten zijn, naast de in
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] bedoelde ambtenaren, belast de daartoe bij besluit van
      Onze Minister van Justitie in overeenstemming met Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel25a
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: 25a.2
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel25a
  - number: '26.1'
    text: |-
      De Bank stelt jaarlijks een begroting, een verantwoording en een jaarverslag op terzake van de haar op grond van
      deze wet opgedragen taken en de daaruit voortvloeiende werkzaamheden. De [artikelen 1:30 tot en met 1:32][ref1] en
      [1:34 tot en met 1:36 van de Wet op het financieel toezicht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '26.2'
    text: Tegen besluiten van Onze Minister inzake instemming met de begroting of de verantwoording staat geen beroep open.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel26
  - number: '27'
    text: |-
      De Bank verstrekt Onze Minister desgevraagd de gegevens of inlichtingen die deze behoeft om zich over de
      uitvoering van deze wet in de praktijk of over de uitvoerbaarheid van beleidsvoornemens of voorgenomen wettelijke
      voorschriften een oordeel te vormen.
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel27
  - number: '28'
    text: 'Deze wet wordt aangehaald als: Wet toezicht trustwezen BES.'
    url: https://wetten.overheid.nl/BWBR0028368/2010-10-10#Artikel28
