  - number: '25.4'
    text: |-
      Handelen in strijd met [artikel 12, eerste lid][ref1], [14, eerste lid][ref2], [15][ref3], [17][ref4] en
      [23, eerste lid][ref5], wordt gestraft met een hechtenis van ten hoogste een jaar en een geldboete van de vijfde
