  - number: '22.05'
    text: |-
      1. Voor de toepassing van dit hoofdstuk en in afwijking van [artikel 1.01][ref1] is het resterende
      vrijboord de kleinste verticale afstand tussen de gladde waterspiegel en de zijkant van het dek, waarbij
      rekening wordt gehouden met trim en slagzij, die optreden onder invloed van de momenten als bedoeld in
      [artikel 22.07, vierde tot en met negende lid][ref2].

      2. Het resterend vrijboord als bedoeld in [artikel 22.07, eerste lid][ref3], is voldoende indien het 300 mm
      bedraagt.

      3. Het resterend vrijboord mag worden verminderd wanneer wordt aangetoond dat [artikel 22.08][ref4] in acht is
      genomen.

      4. Indien de vorm van het drijvend voorwerp in belangrijke mate afwijkt van de vorm van een ponton, zoals bij
      cilindrische drijvende voorwerpen of bij een drijvend voorwerp waarvan de dwarsdoorsnede meer bedraagt dan vier
      zijden, kan de Commissie van deskundigen een resterend vrijboord eisen of toelaten dat afwijkt van het tweede lid.
      Dit geldt ook voor een drijvend werktuig met verscheidene drijvende voorwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel1.01
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel22.07
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel22.07
      [ref4]: https://wetten.overheid.nl/BWBR0041395#Artikel22.08
