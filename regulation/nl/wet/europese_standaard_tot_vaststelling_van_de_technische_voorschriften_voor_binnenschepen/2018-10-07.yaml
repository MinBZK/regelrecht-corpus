  - number: 33.03.1
    text: |-
      Voor vaartuigen waarvan de kiel is gelegd vóór 1 januari 1985 mogen, aanvullend aan de overgangsbepalingen van
      [artikel 33.02][ref1], de hierna genoemde overgangsbepalingen worden toegepast, mits de veiligheid van het vaartuig
      en de bemanning op passende wijze is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel33
