  - number: 19.11.2.b)
    text: 'Scheidingsvlakken van het type ‘A’ zijn schotten, wanden en dekken, die aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.2.b).aa)
    text: Ze zijn vervaardigd van staal of een ander gelijkwaardig materiaal;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.2.b).bb)
    text: Ze zijn op een geschikte wijze versterkt;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.2.b).cc)
    text: |-
      Ze zijn zodanig geïsoleerd met een toegelaten onbrandbaar materiaal, dat de gemiddelde temperatuur aan de van de
      brand afgekeerde zijde niet meer dan 140 °C boven de begintemperatuur stijgt en op geen enkele plaats met inbegrip
      van de verbindingen een temperatuurverhoging van meer dan 180 °C boven de begintemperatuur plaatsvindt binnen de
      hierna aangegeven tijdsduur: type A60 60 minuten type A30 30 minuten type A0 0 minuten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.2.b).dd)
    text: |-
      Ze zijn zodanig gebouwd, dat ze de doorvoer van rook en vuur verhinderen tot aan het einde van de
      standaardbrandtest van één uur;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.2.c)
    text: |-
      Scheidingsvlakken van het type ‘B’ zijn schotten, wanden, dekken, dekens of bekledingen, die aan de volgende eisen
      voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.2.c).aa)
    text: |-
      Ze bestaan uit een toegelaten onbrandbaar materiaal, en alle materialen die voor de constructie en het installeren
      van de scheidingsvlakken worden toegepast zijn onbrandbaar met uitzondering van oppervlaktemateriaal dat ten minste
      moeilijk ontvlambaar moet zijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.2.c).bb)
    text: |-
      Ze hebben een zodanige isolatiewaarde, dat de gemiddelde temperatuur aan de van de brand afgekeerde zijde niet
      meer dan 140 °C boven de begintemperatuur stijgt en op geen enkele plaats met inbegrip van de verbindingen
      een temperatuurverhoging van meer dan 225 °C boven de begintemperatuur plaatsvindt binnen de hierna aangegeven
      tijdsduur: type B15 15 minuten type B0 0 minuten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.2.c).cc)
    text: |-
      Ze zijn zodanig gebouwd dat ze de doorvoer van vuur verhinderen tot aan het eind van het eerste half uur van de
      standaardbrandtest.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.3
    text: |-
      In ruimten, met uitzondering van machinekamers en voorraadruimten, toegepaste verf, lak en andere producten
      voor het behandelen van oppervlakken, alsmede bedekking van dekken moeten moeilijk ontvlambaar zijn. Vaste
      vloerbedekking, stoffen, gordijnen en andere hangende materialen van textiel, alsmede gestoffeerde meubels en
      beddengoed, moeten moeilijk ontvlambaar zijn voor zover de ruimten waarin ze zich bevinden niet beschikken over een
      automatisch werkende sprinklerinstallatie als bedoeld in [artikel 13.04][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.11.4
    text: |-
      De in ruimten voor passagiers aangebrachte plafonds en stofferingen van wanden met inbegrip van de constructies
      daaronder moeten, voor zover die ruimten niet over een automatisch werkende sprinklerinstallatie beschikken als
      bedoeld in [artikel 13.04][ref1], van onbrandbaar materiaal zijn vervaardigd met uitzondering van de oppervlakken
      ervan die tenminste moeilijk ontvlambaar moeten zijn. De eerste volzin geldt niet voor sauna’s.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.11.5
    text: |-
      Meubels en constructies in verblijfsruimten, waarin zich verzamelruimten bevinden, moeten, voor zover die ruimten
      niet beschikken over een automatisch werkende sprinklerinstallatie als bedoeld in [artikel 13.04][ref1], van
      onbrandbaar materiaal zijn vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.11.6
    text: |-
      Verf, lak en andere stoffen, die worden toegepast op onbeschermde oppervlakken aan de binnenkant, mogen bij brand
      niet meer dan normale hoeveelheden rook en giftige stoffen ontwikkelen. Dit moet worden aangetoond met toetsing aan
      de code voor brandtestmethoden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.7
    text: |-
      Isolatiemateriaal in verblijfsruimten moet onbrandbaar zijn. Dit geldt niet voor isolaties van leidingen voor
      koelvloeistof. De oppervlakken van de isolatie van deze leidingen moeten ten minste moeilijk ontvlambaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.8
    text: |-
      Dekzeilen of dergelijke mobiele inrichtingen, waarmee dekzones gedeeltelijk of geheel worden overdekt, evenals
      constructies daaronder moeten moeilijk ontvlambaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.9
    text: 'Deuren in scheidingsvlakken als bedoeld in het tweede lid moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.9.a)
    text: Ze moeten aan dezelfde eisen, bedoeld in het tweede lid, voldoen als de scheidingsvlakken zelf.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.9.b)
    text: |-
      Ze moeten, voor zover het deuren in scheidingsvlakken, bedoeld in het tiende lid, dan wel deuren in wanden die
      machinekamers omsluiten, keukens en trappen betreft, automatisch sluitend zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.9.c)
    text: |-
      Automatisch sluitende deuren, die bij een normale situatie open staan, moeten ter plaatse en vanuit een permanent
      door boordpersoneel of leden van de bemanning bezette plaats kunnen worden gesloten. Na sluiting op afstand moet de
      deur ter plaatse opnieuw geopend en veilig gesloten kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.9.d)
    text: |-
      Waterdichte deuren als bedoeld in [artikel 19.02][ref1] hoeven niet te worden geïsoleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.11.10
    text: |-
      Wanden als bedoeld in het tweede lid moeten van dek tot dek opgetrokken zijn, dan wel eindigen bij doorlopende
      plafonds die aan dezelfde eisen, bedoeld in het tweede lid, voldoen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.11
    text: |-
      De volgende passagiersruimten moeten zijn onderverdeeld met verticale scheidingsvlakken als bedoeld in het tweede
      lid:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.11.a)
    text: Passagiersruimten met een totale oppervlakte van meer dan 800 m2;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.11.b)
    text: |-
      Passagiersruimten waarin zich hutten bevinden met tussenruimten van ten hoogste 40 m Deze verticale
      scheidingsvlakken wanden moeten onder normale omstandigheden rookdicht en van dek tot dek zijn opgetrokken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.12
    text: |-
      Holle ruimten boven de plafonds, onder vloeren en achter wandbekleding moeten met tussenruimten van ten hoogste 14
      m door niet brandbare, ook bij brand goed afsluitende, tochtkleppen gescheiden zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.13
    text: Trappen moeten van staal of een ander gelijkwaardig onbrandbaar materiaal zijn vervaardigd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.14
    text: |-
      Inwendig gelegen trappen en liften moeten op alle niveaus door wanden als bedoeld in het tweede lid zijn omgeven.
      De volgende uitzonderingen kunnen worden toegestaan:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.14.a)
    text: |-
      Een trap die slechts tussen twee dekken ligt hoeft niet in een schacht te liggen, wanneer de trap op één dek door
      wanden als bedoeld in het tweede lid is omgeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.14.b)
    text: |-
      In een verblijfsruimte hoeven trappen niet in een schacht te liggen, wanneer ze volledig binnen deze ruimte liggen
      en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.14.b).aa)
    text: wanneer deze ruimte niet meer dan 2 dekken omvat dan wel
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.14.b).bb)
    text: |-
      indien in deze ruimte op alle dekken een automatisch werkende sprinklerinstallatie als bedoeld in
      [artikel 13.04][ref1] is geïnstalleerd, deze ruimte beschikt over een installatie voor het afzuigen van rook als
      bedoeld in het zestiende lid en deze ruimte op alle dekken een toegang tot een trappenschacht heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.11.15
    text: 'Ventilatie- en airconditioningsystemen moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.15.a)
    text: Ze moeten zodanig zijn uitgevoerd dat vuur en rook zich niet via deze systemen kunnen verspreiden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.15.b)
    text: Openingen voor toe- en afvoer van lucht en airconditioningsystemen moeten kunnen worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.15.c)
    text: |-
      Ventilatiekanalen moeten van staal of een gelijkwaardig onbrandbaar materiaal zijn vervaardigd en op een veilige
      wijze met elkaar en met de scheepsconstructie verbonden zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.15.d)
    text: |-
      Indien ventilatiekanalen met een doorsnede van meer dan 0,02 m2 door scheidingsvlakken van type A als bedoeld
      in het tweede lid of door scheidingsvlakken als bedoeld in het tiende lid lopen, moeten ze zijn uitgerust met
      automatische brandkleppen die vanaf een permanent door het boordpersoneel of leden van de bemanning bezette plaats
      kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.15.e)
    text: |-
      Ventilatiesystemen voor keuken en machinekamers moeten zijn gescheiden van ventilatiesystemen die voor andere
      ruimten werken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.15.f)
    text: |-
      Ontluchtingskanalen moeten voorzien zijn van afsluitbare openingen ten behoeve van controle en reiniging. De
      betreffende openingen moeten in de nabijheid van de brandkleppen zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.15.g)
    text: Ingebouwde ventilatoren moeten kunnen worden uitgeschakeld vanaf een centrale plaats buiten de machinekamer.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.16
    text: |-
      Keukens moeten zijn voorzien van een ventilatiesysteem en keukenfornuizen met een afzuiging. De ontluchtingskanalen
      van de afzuigingen moeten voldoen aan de eisen als bedoeld in het veertiende lid en bovendien zijn voorzien van
      handbediende brandkleppen aan de ingangsopeningen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.17
    text: |-
      Controleposten, trappenschachten en binnen het schip gelegen verzamelruimten moeten zijn voorzien van inrichtingen
      voor het afzuigen van rook via een natuurlijke of machinale weg. Inrichtingen voor het afzuigen van rook moeten aan
      de volgende eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.17.a)
    text: Ze moeten voldoende capaciteit hebben en betrouwbaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.17.b)
    text: Ze moeten passen bij de bedrijfsomstandigheden van het passagiersschip.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.17.c)
    text: |-
      Indien inrichtingen voor het afzuigen van rook ook dienen voor de algemene ventilatie van de ruimten mag daardoor
      hun functie als inrichting voor het afzuigen van rook in geval van brand niet worden gehinderd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.17.d)
    text: Inrichtingen voor het afzuigen van rook moeten voorzien zijn van een handmatige inschakeling.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.17.e)
    text: |-
      Machinale inrichtingen voor het afzuigen van rook moeten bovendien vanaf een permanent door boordpersoneel of leden
      van de bemanning bezette plaats kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.17.f)
    text: |-
      Inrichtingen voor afzuiging van rook via natuurlijke weg moeten zijn voorzien van een handmatig te bedienen
      openingsmechanisme of met een energiebron binnen deze inrichtingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.17.g)
    text: |-
      Handmatig te bedienen inschakelinrichtingen en openingsmechanismen moeten van binnen en van buiten de te beschermen
      ruimte bereikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.18
    text: |-
      Verblijfsruimten waarop niet permanent door boordpersoneel en leden van de bemanning wordt gelet, keukens,
      machinekamers en andere bedreigde ruimten moeten op een doelmatige brandmeldinstallatie zijn aangesloten. De
      aanwezigheid van een brand alsmede de plaats daarvan moeten automatisch worden gemeld op een permanent door
      boordpersoneel of leden van de bemanning bezette plaats
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.12.1
    text: |-
      Behalve de draagbare blustoestellen als bedoeld in [artikel 13.03][ref1] moeten ten minste de volgende draagbare
      blustoestellen aanwezig zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.12.1.a)
    text: één draagbaar blustoestel voor elke 120 m2 bruto vloeroppervlak van de verblijfsruimten voor passagiers;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.1.b)
    text: één draagbaar blustoestel per tien hutten of deel daarvan;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.1.c)
    text: |-
      één draagbaar blustoestel in iedere keuken en in de nabijheid van iedere ruimte waarin brandbare vloeistoffen
      worden opgeslagen of gebruikt. In keukens moet het blusmiddel tevens geschikt zijn voor het blussen van branden
      met vet.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.2
    text: 'Passagiersschepen moeten zijn voorzien van een blusinstallatie, die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.2.a)
    text: |-
      twee bluspompen waarvan er één vast is opgesteld, die door een motor worden aangedreven en voldoende capaciteit
      hebben;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.2.b)
    text: |-
      een brandblusleiding met een voldoend aantal brandkranen, met daaraan vast aangesloten ten minste 20 m lange
      brandslangen met straalpijp, die geschikt is om zowel een sproeinevel als een waterstraal voort te brengen en die
      van een afsluitmogelijkheid is voorzien.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.3
    text: 'Blusinstallaties moeten zodanig zijn uitgevoerd en een zodanige capaciteit hebben dat:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.3.a)
    text: |-
      elke willekeurige plaats van het schip door ten minste twee stralen water, niet afkomstig van dezelfde brandkraan
      en met voor elk slechts een slanglengte van ten hoogste 20 m, kan worden bestreken;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.3.b)
    text: de druk bij de brandkranen ten minste 300 kPa bedraagt, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.3.c)
    text: op alle dekken een lengte van de waterstralen van ten minste 6 m kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.4
    text: |-
      Aansluitingen van blusinstallaties met schroefdraad of kraan moeten zo zijn afgesteld dat elk van de brandslangen
      bij draaiende bluspompen afgekoppeld en verwijderd kan worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.5
    text: Brandslangen binnen in het schip moeten zijn opgerold op een axiaal aangebrachte haspel.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.6
    text: |-
      Materiaal voor inrichtingen voor brandbestrijding moeten ofwel hittebestendig ofwel voldoende zijn beschermd tegen
      uitvallen bij hitte.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.7
    text: Pijpleidingen en blusinstallaties moeten zodanig zijn aangebracht dat de risico op bevriezen wordt vermeden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.8
    text: 'De twee bluspompen moeten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.8.a)
    text: niet in dezelfde ruimte zijn opgesteld of geplaatst worden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.8.b)
    text: onafhankelijk van elkaar kunnen functioneren;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.8.c)
    text: |-
      ieder op zich op alle dekken in staat zijn om de noodzakelijke druk op de blusinstallatie te houden en de vereiste
      lengte van de waterstraal te bereiken;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.8.d)
    text: voor het achterpiekschot zijn opgesteld; Brandbluspompen mogen worden gebruikt voor algemene bedrijfsmatige taken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.9
    text: |-
      Machinekamers moeten zijn uitgerust met een vast ingebouwde brandblusinstallatie als bedoeld in
      [artikel 13.05][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.12.10
    text: 'Op hotelschepen moeten beschikbaar zijn:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.10.a)
    text: |-
      twee ademhalingsapparaten die onafhankelijk van de omgevingslucht werken en voldoen aan de Europese norm EN 137 :
      2006 type 2, met volledig masker overeenkomstig de Europese norm EN 136 : 1998;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.10.b)
    text: |-
      twee uitrustingspakketten die ten minste bestaan uit veiligheidskleding, helm, laarzen, handschoenen, bijl,
      koevoet, zaklamp en geleidingslijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.12.10.c)
    text: vier vluchtmaskers.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.12
  - number: 19.13.1
    text: |-
      Op ieder passagiersschip moet een veiligheidsrol aanwezig zijn. Hierin worden de instructies voor de bemanning en
      het boordpersoneel voor de volgende gevallen omschreven:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.1.a)
    text: averij van het schip;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.1.b)
    text: brand aan boord;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.1.c)
    text: evacuatie van de passagiers;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.1.d)
    text: man-over-boord.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2
    text: |-
      Bij de veiligheidsrol behoort een veiligheidsplan van het schip, waarop duidelijk en overzichtelijk ten minste
      zijn aangegeven:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.a)
    text: ruimten die zijn bestemd voor gebruik door personen met beperkte mobiliteit;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.b)
    text: vluchtwegen, nooduitgangen, verzamel- en evacuatieruimten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.c)
    text: reddingsmiddelen en bijboten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.d)
    text: blustoestellen, brandblusinstallaties en automatisch werkende sprinklerinstallaties;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.e)
    text: overige veiligheidsuitrusting;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.f)
    text: |-
      alarminstallatie, bedoeld in [artikel 19.08, derde lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.13.2.g)
    text: |-
      alarminstallatie, bedoeld in [artikel 19.08, derde lid, onder b en c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.13.2.h)
    text: |-
      deuren in schotten, bedoeld in [artikel 19.02, vijfde lid][ref1], en de plaatsen van waaruit deze
      worden bediend, alsook overige openingen, bedoeld in artikel 19.02, negende, tiende en dertiende lid, en
      [artikel 19.03, twaalfde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.13.2.i)
    text: |-
      deuren, bedoeld in [artikel 19.11, negende lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.13.2.j)
    text: brandkleppen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.k)
    text: brandmeldsysteem;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.l)
    text: noodstroominstallatie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.m)
    text: schakelaars van ventilatiesystemen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.n)
    text: walaansluitingen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.o)
    text: afsluiters van brandstofleidingen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.p)
    text: vloeibaargasinstallaties;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.q)
    text: luidsprekerinstallaties;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.r)
    text: marifooninstallaties;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.2.s)
    text: verbandtrommels.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.3
    text: 'De veiligheidsrol, bedoeld in het eerste lid, en het veiligheidsplan, bedoeld in het tweede lid, moeten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.3.a)
    text: door de Commissie van deskundigen zijn gewaarmerkt en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.3.b)
    text: op ieder dek op geschikte plaatsen duidelijk zichtbaar zijn opgehangen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4
    text: |-
      In elke hut moeten de nodige instructies aanwezig zijn voor het gedrag van de passagiers alsmede een verkort
      veiligheidsplan waarin alleen de indicaties, bedoeld in het tweede lid, onder a tot en met f, zijn opgenomen. Deze
      instructies moeten ten minste bevatten:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.a)
    text: 'Aangeven van noodsituaties:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.a).aa)
    text: brand;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.a).bb)
    text: lek raken van het schip;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.a).cc)
    text: algemeen gevaar;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.b)
    text: beschrijving van de verschillende noodsignalen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.c)
    text: 'aanwijzingen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.c).aa)
    text: vluchtweg;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.c).bb)
    text: gedrag;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.c).cc)
    text: bewaren van kalmte;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.d)
    text: 'aanwijzingen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.d).aa)
    text: roken;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.d).bb)
    text: gebruik van vuur en open licht;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.d).cc)
    text: openen van vensters;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.13.4.d).dd)
    text: gebruik van bepaalde inrichtingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.13
  - number: 19.14.1
    text: |-
      Passagiersschepen moeten ofwel van verzameltanks voor huishoudelijk afvalwater overeenkomstig het tweede lid ofwel
      van boordzuiveringsinstallaties overeenkomstig [hoofdstuk 18][ref1] zijn voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk18
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.14
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '18'
  - number: 19.14.2
    text: |-
      Tanks voor het verzamelen van afvalwater moeten voldoende capaciteit hebben. De tanks moeten zijn voorzien van een
      inrichting waarmee het niveau kan worden vastgesteld, dan wel hoever de tank gevuld is. Om de tanks leeg te maken
      moeten aan boord pompen en leidingen aanwezig zijn, waarmee het afvalwater op aanlegplaatsen aan beide zijden van
      het schip kan worden afgegeven. Doorvoer van afvalwater van andere schepen moet mogelijk zijn. De leidingen moeten
      zijn voorzien van een aansluiting voor afgifte overeenkomstig de Europese norm EN 1306 : 1996.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.14
  - number: 19.15.1
    text: |-
      Een passagiersschip dat voor het vervoer van minder dan 50 passagiers is toegelaten en waarvan *L* niet groter is
      dan 25 m. moet het rekenkundig bewijs van voldoende lekstabiliteit als bedoeld in [artikel 19.03][ref1], zevende
      tot en met dertiende lid aantonen, of bewijzen dat het schip in symmetrische leksituaties aan de volgende criteria
      voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.15.1.a)
    text: het schip mag maximaal tot aan de indompelingsgrenslijn inzinken, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.1.b)
    text: de resterende metacentrische hoogte *GM* mag niet kleiner zijn dan 0,10 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.2
    text: |-
      De Commissie van deskundigen kan bij passagiersschepen als bedoeld in het eerste lid kleine afwijkingen toelaten
      van de bij [artikel 19.06, derde lid, onder c, en vijfde lid, onder b][ref1], vereiste vrije hoogte. De afwijking
      mag niet meer zijn dan 5%. In geval van afwijkingen moeten de betreffende plaatsen in het schip met verf worden
      gemarkeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.15.3
    text: |-
      In afwijking van [artikel 19.03, negende lid][ref1], behoeven passagiersschepen die voor het vervoer van ten
      hoogste 250 passagiers zijn toegelaten en waarvan de lengte *L* niet groter is dan 45 m niet te voldoen aan de
      2-compartimentstatus.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.15.4
    text: |-
      De Commissie van deskundigen kan bij passagiersschepen, die zijn toegelaten voor het vervoer van ten
      hoogste 250 passagiers en waarvan de lengte *L* niet groter is dan 25 m, afzien van het moeten voldoen aan
      [artikel 13.07][ref1], indien het passagiersschip is uitgerust met een van twee kanten bereikbaar platform vlak
      boven de waterlijn, dat het mogelijk maakt personen uit het water te redden. Het passagiersschip mag van een
      vergelijkbare inrichting zijn voorzien, in welk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.15.4.a)
    text: voor de bediening van de inrichting één persoon volstaat;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.4.b)
    text: mobiele inrichtingen toegestaan zijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.4.c)
    text: de inrichting zich buiten de gevarenzone van de middelen tot voortbeweging bevinden moet, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.4.d)
    text: een effectieve communicatie tussen de schipper en de persoon die de inrichting bedient mogelijk moet zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.5
    text: |-
      De Commissie van deskundigen kan bij passagiersschepen, die zijn toegelaten voor het vervoer van ten
      hoogste 600 passagiers en waarvan de lengte *L* niet groter is dan 45 m, afzien van het moeten voldoen aan
      [artikel 13.07][ref1], indien het passagiersschip is uitgerust met een platform overeenkomstig het vierde lid,
      eerste zin, dan wel met een vergelijkbare inrichting als een platform als bedoeld in het vierde lid, tweede zin.
      Bovendien moet het passagiersschip beschikken over:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.15.5.a)
    text: als hoofdaandrijving een roerpropeller, een cycloïdaalschroef of een waterstraalaandrijving, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.5.b)
    text: een hoofdaandrijving met 2 voortstuwingsorganen, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.5.c)
    text: een hoofdaandrijving en een boegschroefinstallatie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.6
    text: |-
      In afwijking van [artikel 19.02, negende lid][ref1], mag op passagiersschepen, waarvan de lengte *L* niet groter is
      dan 45 m en waarvan het ten hoogste toegelaten aantal passagiers overeenkomt met de lengte van het schip in meters,
      een handbediende deur, die niet op afstand kan worden bediend, in een schot als bedoeld in artikel 19.02, vijfde
      lid, in de verblijfsruimte voor passagiers aanwezig zijn, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.15.6.a)
    text: het schip slechts één dek heeft;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.6.b)
    text: deze deur vanaf het dek direct te bereiken is en niet meer dan 10 m van de toegang tot het dek verwijderd is;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.6.c)
    text: |-
      de onderkant van de deuropening ten minste 30 cm boven de bodem van de verblijfsruimte voor passagiers is gelegen,
      en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.6.d)
    text: de beide compartimenten die door de deur worden gescheiden zijn uitgerust met een bilge alarm.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.7
    text: |-
      In afwijking van [artikel 19.06, zesde lid, onder c][ref1], mag op passagiersschepen als bedoeld in het zesde lid
      een vluchtweg door een keuken leiden, indien een tweede vluchtweg beschikbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.15.8
    text: |-
      Voor passagiersschepen, waarvan de lengte *L* niet groter is dan 45 m, geldt
      [artikel 19.01, tweede lid, onder e][ref1], niet, wanneer de vloeibaargasinstallaties met geschikte
      alarminstallaties voor gezondheidsbedreigende concentraties van CO alsmede voor explosieve gasmengsels zijn
      uitgerust.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.15.9
    text: 'De volgende voorschriften gelden niet voor passagiersschepen waarvan de lengte *L* niet groter is dan 25 m:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
  - number: 19.15.9.a)
    text: |-
      [artikel 19.04, eerste lid][ref1], laatste zin;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.15.9.b)
    text: |-
      [artikel 19.06, zesde lid, onder c][ref1], voor zover het keukens betreft, indien een tweede vluchtweg beschikbaar
      is;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.15.9.c)
    text: |-
      [artikel 19.07][ref1].

      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.15.10
    text: |-
      Op hotelschepen, waarvan de lengte *L* niet groter is dan 45 m, is [artikel 19.12, tiende lid][ref1], niet van
      toepassing voor zover in iedere hut vluchtmaskers, in een aantal dat overeenkomt met de zich in die hut bevindende
      bedden, direct bereikbaar aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: '20.01'
    text: |-
      Naast de bepalingen van [deel II][ref1] en [III][ref2] gelden voor zeilende passagiersschepen die uitsluitend
      buiten de Rijn (zone R) varen de bepalingen van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
      [ref2]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
      - id: ref2
        bwb_id: BWBR0041395
  - number: 20.02.1
    text: |-
      Voor zeilende passagiersschepen waarvan de *L* niet meer bedraagt dan 45 m en waarvan het hoogste toegestane aantal
      passagiers niet meer bedraagt dan *L* in gehele meters, gelden de volgende bepalingen niet:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.02
  - number: 20.02.1.a)
    text: artikel 3.03, zevende lid, voorzover het anker niet binnen de buitenhuid is weggewerkt;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.02
  - number: 20.02.1.b)
    text: artikel 13.02, tweede lid, onderdeel d, met betrekking tot de lengte;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.02
  - number: 20.02.1.c)
    text: artikel 19.08, derde lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.02
  - number: 20.02.1.d)
    text: artikel 19.15, achtste lid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.02
  - number: 20.02.2
    text: |-
      In afwijking van eerste lid kan het aantal passagiers worden verhoogd tot anderhalf maal *L* in gehele meters
      indien de zeilvoering en de inrichting van het dek dit toelaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.02
  - number: 20.03.1
    text: |-
      Voor de berekening van het kenterend moment volgens [artikel 19.03, derde lid][ref1], moet bij de vaststelling van
      het zwaartepunt van het schip het opgedoekte zeil in de berekening worden meegenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 20.03.2
    text: |-
      Met inachtneming van alle beladingstoestanden volgens [artikel 19.02, tweede lid][ref1], en bij een standaard
      zeilvoering mag het door de winddruk veroorzaakte kenterend moment niet zo hoog zijn dat de hoek van slagzij groter
      wordt dan 20°. Daarbij moet:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 20.03.2.a)
    text: voor de berekening van een gelijk blijvende winddruk van 0,07 kN/m2 aangehouden worden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.03
  - number: 20.03.2.b)
    text: de resterende veiligheidsafstand minstens 100 mm bedragen, en mag
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.03
  - number: 20.03.2.c)
    text: het resterende vrijboord niet negatief zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.03
  - number: 20.03.3
    text: De oprichtende arm van statische stabiliteit moet bij een hoek van slagzij
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.03
  - number: 20.03.3.a)
    text: van 25° of meer zijn maximale waarde *h* bereiken;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.03
  - number: 20.03.3.b)
    text: van 30° of meer minstens 0,20 m bedragen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.03
  - number: 20.03.3.c)
    text: tot 60° positief zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.03
  - number: 20.03.4
    text: |-
      Het vlak A onder de kromme van de oprichtende armen van statische stabiliteit mag a) tot 30° niet minder dan 0,055
      *m* • *rad* bedragen; b) tot 40° of bij de hoek *φ* waarbij een onafgeschermde opening onder water raakt en die
      kleiner is dan 40°, niet minder dan 0,09 *m* • *rad* bedragen. Tussen c) 30° en 40° of d) tussen 30° en de hoek *φ*
      waarbij een onafgeschermde opening onder water raakt en die kleiner is dan 40°, mag dit vlak niet onder 0,03 *m* •
      *rad* liggen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.03
  - number: 20.04.1
    text: |-
      In afwijking van [artikel 6.01, derde lid][ref1], en [artikel 10.01, derde lid][ref2], moeten de installaties op
      een permanente slagzij van het schip tot 20° berekend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel10
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '10'
        hoofdstuk: '10'
  - number: 20.04.2
    text: |-
      In afwijking van [artikel 19.06, vijfde lid, onderdeel a][ref1], en artikel 19.06, negende lid, onderdeel b, kan
      de Commissie van deskundigen voor zeilende passagiersschepen waarvan de lengte niet meer bedraagt dan 25 m, een
      kleinere vrije breedte voor de verbindingsgangen en -trappen dan 0,80 m toestaan. Deze breedte mag echter niet
      minder zijn dan 0,60 m.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 20.04.3
    text: |-
      In afwijking van [artikel 19.06, tiende lid, onderdeel a][ref1], kan de Commissie van deskundigen in bijzondere
      gevallen wegneembare relingen toestaan, op plaatsen waar de zeilvoering dat noodzakelijk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 20.04.4
    text: |-
      In de zin van [artikel 19.07][ref1] gelden de zeilen als hoofdaandrijfsysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 20.04.5
    text: |-
      In afwijking van [artikel 19.15, zesde lid, onderdeel c][ref1], mag de hoogte van de onderkant van de deuropening
      tot 0,20 m boven de bodem van de passagiersruimte verminderd worden. Daarbij moet de deur zich na het openen
      automatisch sluiten en vergrendelen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 20.04.6
    text: |-
      Indien de schroef gedurende het zeilen loos meedraaien, moeten voorzieningen zijn getroffen om schade aan de delen
      van de voortstuwingsinstallatie die gevaar lopen, te voorkomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.04
  - number: 20.05.1
    text: De tuigage is zodanig ingericht dat ontoelaatbaar schavielen vermeden wordt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.05
  - number: 20.05.2
    text: |-
      Bij gebruik van een ander materiaal dan hout of bij gebruik van bijzondere tuigvormen moeten constructies worden
      toegepast die een gelijkwaardige veiligheid waarborgen als de in dit hoofdstuk voorgeschreven afmetingen en
      sterktes. Ter staving van voldoende sterkte moet:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.05
  - number: 20.05.2.a)
    text: een sterkteberekening worden opgesteld; of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.05
  - number: 20.05.2.b)
    text: de voldoende sterkte door een erkend classificatiebureau bevestigd zijn, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.05
  - number: 20.05.2.c)
    text: de dimensionering uit een erkende berekeningsmethode zijn afgeleid (bv. Middendorf; Kusk-Jensen).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.05
  - number: 20.06.1
    text: Het materiaal van alle rondhouten is van goede kwaliteit.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
  - number: 20.06.2
    text: 'Hout voor masten moet voldoen aan de volgende vereisten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
  - number: 20.06.2.a)
    text: vrij van concentraties van kwasten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
  - number: 20.06.2.b)
    text: binnen de vereiste diktes spintvrij;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
  - number: 20.06.2.c)
    text: zoveel mogelijk rechtdradig;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
  - number: 20.06.2.d)
    text: zo min mogelijk gedraaid gegroeid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
  - number: 20.06.3
    text: |-
      Bij gebruik van de houtsoorten Pitchpine of Oregonpine (van de kwaliteit ‘clear and better’) geldt een reductie van
      5% op de diameters in de tabellen van de [artikelen 20.07 tot en met 20.12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel20
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '20'
        hoofdstuk: '20'
  - number: 20.06.4
    text: Indien masten en rondhouten zonder ronde diameter worden gebruikt, moeten deze van gelijkwaardige sterkte zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
  - number: 20.06.5
    text: |-
      Mastdekken, mastkokers, bevestigingen op dek, op wrangen en aan stevens worden zodanig geconstrueerd, dat de daarop
      uitgeoefende krachten kunnen worden opgenomen of overgedragen op andere verbanddelen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
  - number: 20.06.6
    text: |-
      Afhankelijk van de belasting en stabiliteit van het schip en de verdeling van het beschikbare zeiloppervlak
      kan de Commissie van deskundigen op de in de [artikelen 20.07 tot en met 20.12][ref1] voorgeschreven afmetingen
      een vermindering van de diameters van de rondhouten en eventueel minder strenge eisen voor de tuigage toestaan.
      Daarvoor moeten documenten ter staving overeenkomstig [artikel 20.05, tweede lid][ref2], worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel20
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '20'
        hoofdstuk: '20'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '20'
        hoofdstuk: '20'
  - number: 20.06.7
    text: |-
      Indien de slingertijd van het schip in seconden korter is dan 3/4 van de scheepsbreedte in meters, moeten de in de
      [artikelen 20.07 tot en met 20.12][ref1] voorgeschreven afmetingen worden verhoogd. Daarvoor moeten documenten ter
      staving overeenkomstig [artikel 20.05, tweede lid][ref2], worden overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel20
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '20'
        hoofdstuk: '20'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '20'
        hoofdstuk: '20'
  - number: 20.06.8
    text: |-
      In de tabellen van de [artikelen 20.07 tot en met 20.12][ref1] en [20.14][ref2] kunnen eventueel tussenwaarden
      worden geïnterpoleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel20
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '20'
        hoofdstuk: '20'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '20'
        hoofdstuk: '20'
  - number: 20.07.1
    text: |-
      Houten masten moeten ten minste aan de volgende eisen voldoen:








                      Lengte1 [m]


