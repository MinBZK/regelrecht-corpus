  - number: '20.01'
    text: |-
      Naast de bepalingen van [deel II][ref1] en [III][ref2] gelden voor zeilende passagiersschepen die uitsluitend
      buiten de Rijn (zone R) varen de bepalingen van dit hoofdstuk.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
      [ref2]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.01
