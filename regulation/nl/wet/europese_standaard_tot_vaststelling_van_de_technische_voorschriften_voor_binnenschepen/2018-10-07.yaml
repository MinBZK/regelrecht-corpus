  - number: '24.03'
    text: |-
      1. De Commissie van deskundigen bepaalt overeenkomstig de gebruiks- en veiligheidsconcepten als bedoeld in
      [artikel 24.02, tweede lid, onderdelen b en c][ref1], en overeenkomstig de staat qua bouw, inrichting en uitrusting
      van het traditionele vaartuig:

      a) de minimumbemanning en hun bekwaamheid;

      b) het toegestane aantal personen, dat tot op de minimumbemanning kan worden beperkt;

      c) beperkende bepalingen voor het verblijf van personen, met uitzondering van de leden van de bemanning, aan boord;

      d) de toegestane belading, die tot op ‘nul’ kan worden beperkt;

      e) het toegestane vaarbereik;

      f) meteorologische grensvoorwaarden;

      g) nautische grensvoorwaarden;

      h) overige beperkende voorwaarden.

      2. Bij periodieke onderzoeken kan de Commissie van deskundigen in het licht van de ontwikkeling van de
      technische voorschriften van de onderhavige standaard, de overeenkomstig het artikel 24.03, eerste lid en
      [artikel 24.01, derde lid][ref2] vastgelegde voorwaarden wijzigen. Deze wijzigingen moeten in de bijlage
      ‘Traditioneel vaartuig’ bij het binnenschipcertificaat worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel24.02
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel24.01
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.03
