                      lid 2, tabel 1 en 2, en lid 5


                      Grens-/controlewaarden en typegoedkeuringen


                      N.V.O. voor zover
                      a) de grens- en controlewaarden de waarden van fase II met niet meer dan de factor 2 overschrijden;
                      b) de boordzuiveringsinstallatie over een certificaat van de fabrikant of een erkend deskundige
      beschikt, waarin bevestigd wordt dat de installatie de voor het schip kenmerkende belasting aankan, en
                      c) een zuiveringsslibmanagement beschikbaar is, dat aan de voorwaarden voor het gebruik van een
      boordzuiveringsinstallatie op een passagiersschip voldoet.





                      Boordzuiveringsinstallaties die vanaf 1 december 2011 overeenkomstig de voorschriften van Besluit
      2010-II-27 van de CCR (Fase II) zijn goedgekeurd, mogen verder worden ingebouwd en gebruikt.





                      Boordzuiveringsinstallaties die vanaf 10 januari 2013 overeenkomstig de voorschriften van
      [Richtlijn 2012/49](32012L0049)/EU (Fase II) zijn goedgekeurd, mogen verder worden ingebouwd en gebruikt.





                      **HOOFDSTUK 19**








                      Passagiersschepen


                      Zie de bepalingen van het reglementaire kader voor schepen die van het toepassingsgebied van
      [Richtlijn 82/714/EEG](31982L0714) waren uitgesloten: ‘Geen klaarblijkelijk gevaar’.
                      Geldt voor alle bepalingen van hoofdstuk 19 met uitzondering van de navolgend vermelde bepalingen.





                      [19.01][ref76]


                      lid 5 en 6


                      De dode hoek voor de boeg niet meer dan tweemaal de scheepslengte of 250 m
                      Voldoende zicht naar achteren


                      N.V.O., uiterlijk bij verlenging van het binnenschipcertificaat na


                      1.1.2049




                      [19.11][ref77]


                      lid 1


                      Technische geschiktheid op het gebied van brandbescherming van materialen en onderdelen


                      Voor de materialen en onderdelen die zijn goedgekeurd overeenkomstig de Internationale Code voor
      brandtestprocedures (FTP-Code) aangenomen bij resolutie MSC.61(67)3: N.V.O.





                      **HOOFDSTUK 20**








                      Zeilende passagiersschepen


                      Zie de bepalingen van het reglementaire kader voor schepen die van het toepassingsgebied van
      [Richtlijn 82/714/EEG](31982L0714) waren uitgesloten: ‘Geen klaarblijkelijk gevaar’.





                      **HOOFDSTUK 21**






                      [21.01][ref78]


                      lid 2


                      Speciale lieren of gelijkwaardige inrichtingen op het voor het duwen geschikte vaartuig


                      N.V.O., uiterlijk bij verlenging van het binnenschipcertificaat na


                      30.12.2049




                      lid 3, laatste zin


                      Eisen met betrekking tot aandrijvingen


                      N.V.O., uiterlijk bij verlenging van het binnenschipcertificaat na


                      30.12.2049




                      **HOOFDSTUK 22**








                      Drijvende werktuigen


                      Zie de bepalingen van het reglementaire kader voor schepen die van het toepassingsgebied van
      [Richtlijn 82/714/EEG](31982L0714) waren uitgesloten: ‘Geen klaarblijkelijk gevaar’.





                      **HOOFDSTUK 26**








                      Pleziervaartuigen


                      Zie de bepalingen van het reglementaire kader voor schepen die van het toepassingsgebied van
      [Richtlijn 82/714/EEG](31982L0714) waren uitgesloten: ‘Geen klaarblijkelijk gevaar’.





                      **HOOFDSTUK 29**






                      [29.02][ref79]


                      lid 3


                      Tweede aandrijfinstallatie voor stuurmachines


                      N.V.O., uiterlijk bij verlenging van het binnenschipcertificaat na


                      30.12.2029






      1 De vaartuigen moeten echter uiterlijk bij verlenging van het binnenvaartcertificaat na 1.1.2015 aan de volgende
      eisen voldoen:

        - – Buitenkanten van de dekken en de werkplekken, waarbij de valhoogte meer dan 1 m kan bedragen, zijn voorzien van
      een verschansing of den van elk ten minste 0,70 m hoogte of van relingen die voldoen aan de Europese norm EN 711 :
      1995, die bestaan uit een handreling een tussenroede op kniehoogte en een voetlijst.
        - - Bij gangboorden moet een voetlijst en een doorlopende handreling aan de denneboom zijn aangebracht. De
      handreling aan de dennenboom kan achterwege worden gelaten, indien het gangboord voorzien is van een niet
      neerklapbare reling.

      2 Dit artikel geldt voor schepen waarvan de kiel is gelegd ná 31.12.1994 en voor in bedrijf zijnde schepen met in
      acht name van het volgende:

        - Bij vernieuwingswerkzaamheden, het gehele laadruim omvattend, is [artikel 14.04][ref80] van toepassing. Bij een
      verbouwing, die de totale lengte van de gangboorden omvat en waardoor de vrije breedte van het gangboord wordt
      gewijzigd:
        - a) is artikel 14.04 van toepassing, indien de vóór de verbouwing beschikbare vrije breedte van het gangboord tot
      een hoogte van 0,90 m, of de vrije breedte daarboven, moet worden verminderd;
        - b) mag de vóór de verbouwing beschikbare vrije breedte van het gangboord tot een hoogte van 0,90 m, of de vrije
      breedte daarboven, niet worden verminderd, indien deze afmetingen kleiner zijn dan die bedoeld in artikel 14.04.

      3 MSC.61(67) aangenomen op 5 december 1996 – Internationale Code voor brandtestprocedures.


