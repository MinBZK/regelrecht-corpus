  - number: '20.04'
    text: |-
      1. In afwijking van [artikel 6.01, derde lid][ref1], en [artikel 10.01, derde lid][ref2], moeten de installaties op
      een permanente slagzij van het schip tot 20° berekend zijn.

      2. In afwijking van [artikel 19.06, vijfde lid, onderdeel a][ref3], en artikel 19.06, negende lid, onderdeel b,
      kan de Commissie van deskundigen voor zeilende passagiersschepen waarvan de lengte niet meer bedraagt dan 25 m,
      een kleinere vrije breedte voor de verbindingsgangen en -trappen dan 0,80 m toestaan. Deze breedte mag echter niet
      minder zijn dan 0,60 m.

      3. In afwijking van [artikel 19.06, tiende lid, onderdeel a][ref4], kan de Commissie van deskundigen in bijzondere
      gevallen wegneembare relingen toestaan, op plaatsen waar de zeilvoering dat noodzakelijk maakt.

      4. In de zin van [artikel 19.07][ref5] gelden de zeilen als hoofdaandrijfsysteem.

      5. In afwijking van [artikel 19.15, zesde lid, onderdeel c][ref6], mag de hoogte van de onderkant van de
      deuropening tot 0,20 m boven de bodem van de passagiersruimte verminderd worden. Daarbij moet de deur zich na het
      openen automatisch sluiten en vergrendelen.

      6. Indien de schroef gedurende het zeilen loos meedraaien, moeten voorzieningen zijn getroffen om schade aan de
      delen van de voortstuwingsinstallatie die gevaar lopen, te voorkomen.


