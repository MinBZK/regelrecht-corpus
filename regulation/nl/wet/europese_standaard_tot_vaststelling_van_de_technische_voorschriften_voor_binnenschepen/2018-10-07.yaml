  - number: '10.18'
    text: |-
      1. Elk systeem dat deel uitmaakt van de vermogenselektronica moet afzonderlijk van het net kunnen worden
      gescheiden. Bij verbruikers met een nominale stroom tot 315 A is een combinatie van zekering en bescherming
      toegestaan. In alle andere gevallen moet binnen het net een vermogensschakelaar worden voorzien.

      2. De vermogenselektronica moet voor reparaties en metingen goed toegankelijk zijn. Voor een controle van de
      werking en het opsporen van storingen moeten dienovereenkomstige voorzieningen worden getroffen.

      3. De regel- en signaalelektronica moet galvanisch van de hoofdstroomkringen gescheiden zijn.

      4. Stroomomvormers moeten ook bij de maximaal toelaatbare spannings- en frequentieschommelingen een veilig gebruik
      waarborgen. Bij ontoelaatbaar hoge frequentie- en/of spanningsafwijkingen in de stroomverzorging moet het systeem
      uitschakelen of in een veilige bedrijfstoestand blijven.

      5. Elektrische lading in bouwgroepen moet na loskoppeling van het net in minder dan 5 seconden terugvallen op een
      spanning onder de 50 V. Indien een langere ontladingstijd vereist is, moet op het toestel een waarschuwingsplaatje
      zijn aangebracht.

      6. Het wegvallen van externe sturingssignalen mag niet tot een gevaarlijke situatie leiden.

      7. De vermogenselektronica moet zodanig voorzien en ingebouwd zijn dat het wegvallen van de voor de sturing
      vereiste spanning geen gevaren voor of schade aan de installatie of het apparaat waarin de vermogenselektronica is
      ingebouwd of de algehele installatie veroorzaakt.

      8. Bij installaties die voor de aandrijving en manoeuvreerbaarheid van het vaartuig, alsook voor de veiligheid
      van de bemanning, het vaartuig of de lading onontbeerlijk zijn, moeten voor de bewaking van de afzonderlijke
      bouwgroepen van de vermogenselektronica en systeemonderdelen componenten worden voorzien die een opsporing van
      storingen mogelijk maken en het optreden van niet onderkende fouten voorkomen.

      9. De vermogenselektronica moet over zodanige bewakingsfuncties beschikken dat fouten feilloos worden opgespoord en
      niet onderkende fouten worden voorkomen.

      10. Er mag, met uitzondering van bouwonderdelen, slechts vermogenselektronica worden gebruikt die over
      een typegoedkeuring beschikt. Indien beschermings- en bewakingsapparatuur een onderdeel vormen van de
      vermogenselektronica, moeten ook de drempelwaarden worden geverifieerd en moet worden aangetoond dat alle
      beschermings- en bewakingsvoorzieningen naar behoren op elkaar zijn afgestemd. Het inspectieprotocol moet bij de
      documentatie van de installatie worden gevoegd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.18
  - number: '10.19'
    text: |-
      Alarm- en beveiligingssystemen voor controle en beveiliging van werktuigbouwkundige inrichtingen moeten aan de
      volgende voorwaarden voldoen:

      1. Alarmsystemen:

      Alarmsystemen moeten zodanig worden uitgevoerd, dat fouten in het alarmsysteem niet tot uitval van het te
      controleren apparaat of de te controleren installatie kunnen leiden.

      Binaire gevers moeten volgens het ruststroomprincipe of als bewaakt arbeidsstroomprincipe zijn uitgevoerd.

      Optische alarmsignalen moeten zichtbaar blijven totdat de desbetreffende storing is opgeheven. Een geaccepteerd
      alarmsignaal moet onderscheiden kunnen worden van een niet geaccepteerd alarmsignaal. Elk alarmsignaal moet ook
      akoestisch worden gemeld. Akoestische alarmsignalen moeten kunnen worden uitgeschakeld. Door het uitschakelen van
      een akoestisch alarmsignaal mag het inwerkingtreden van een door nieuwe oorzaken geactiveerd alarmsignaal niet
      worden verhinderd.

      Bij alarminstallaties met minder dan vijf meetpunten kan met goedkeuring van de Commissie van deskundigen hiervan
      worden afgeweken.

      2. Beveiligingssystemen:

      Beveiligingssystemen moeten zodanig worden uitgevoerd, dat zij voor het bereiken van kritieke bedrijfstoestanden de
      bedreigde installatie uitschakelen, reduceren of op een permanent bezette post daartoe oproepen.

      Binaire gevers moeten volgens het arbeidsstroomprincipe zijn uitgevoerd.

      Indien beveiligingssystemen niet van een eigen controlesysteem zijn voorzien, moet het functioneren van deze
      systemen kunnen worden getest.

      Beveiligingssystemen moeten onafhankelijk van andere systemen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.19
  - number: '10.20'
    text: |-
      1. Algemeen

      De in het tweede lid gestelde testvoorwaarden zijn uitsluitend van toepassing op elektronische apparaten die voor
      stuurinrichtingen en machine-installaties voor de voortbeweging van het vaartuig, met inbegrip van de daarbij
      behorende randapparatuur, benodigd zijn.

      2. Testvoorwaarden

      a) De volgende testbelastingen mogen niet leiden tot schade aan of verkeerd functioneren van elektronische
      apparaten. De tests overeenkomstig de desbetreffende internationale normen (zoals IEC 60092-504 : 2016) moeten,
      met uitzondering van de koudetest, met een ingeschakeld apparaat worden uitgevoerd, waarbij de functie moet worden
      getest.

      b) Spannings- en frequentieafwijkingen:











