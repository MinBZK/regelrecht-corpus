  - number: '1.02'
    text: De bijgevoegde instructies beogen een eenvoudige en uniforme toepassing van deze standaard.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel1.02
  - number: '3.01'
    text: Schepen moeten volgens goed scheepsbouwgebruik zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.01
  - number: 3.02.1
    text: |-
      De sterkte van de scheepsromp moet zodanig zijn dat zij in overeenstemming is met de belasting waaraan de romp
      onder normale omstandigheden is blootgesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.02
  - number: 3.02.1.a)
    text: |-
      Bij nieuwbouw van een schip en bij verbouwingen waardoor de sterkte van het schip kan worden beïnvloed, dient
      door berekeningen te worden aangetoond dat de scheepsromp sterk genoeg is. Dit is niet nodig, indien een
      klassecertificaat of een verklaring van een erkend classificatiebureau wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.02
  - number: 3.02.1.b)
    text: |-
      Bij periodieke onderzoeken moeten bij schepen die van staal zijn gebouwd als minimale dikten van de bodem-, kim-
      en zijbeplating ten minste de grootste van de aan de hand van de volgende formules vastgestelde waarden worden
      genomen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.02
  - number: 3.02.1.b).1
    text: |-
      Voor schepen met een lengte *L* van meer dan 40 m: *t* = *f* • *b* • *c* (2,3 + 0,04 *L*)[*mm*]; voor schepen met
      een lengte *L* van 40 m of minder: *t* = *f* • *b* ∙ *c* (1,5 + 0,06 *L*)[*mm*] echter ten minste 3,0 mm.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.02
  - number: 3.02.1.b).2
    text: '*tmin* = 0,005 ∙ *a* √*T* [*mm*].'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.02
  - number: 3.02.1.c)
    text: |-
      De minimale plaatdikte die met de onderdeel b vermelde formules is berekend mag bij schepen die in langsrichting
      zijn gebouwd en die van een dubbele bodem en zijtanks zijn voorzien, zoveel minder zijn als door een erkend
      classificatiebureau is vastgesteld en gedocumenteerd nadat de voldoende sterkte (sterkte in langs- en dwarsrichting
      alsmede plaatselijke sterkte) van de scheepsromp rekenkundig is aangetoond. Vernieuwing van de beplating is
      noodzakelijk wanneer de dikte van bodem-, kim- of zijbeplating minder is dan de aldus vastgestelde toelaatbare
      waarde. De volgens bovenstaande methode vastgestelde waarden voor de minimumdikten van de beplating van de
      scheepshuid zijn grenswaarden bij een normale en gelijkmatige slijtage onder de voorwaarde dat scheepsbouwstaal is
      gebruikt en dat de inwendige constructiedelen, zoals spanten, bodemwrangen en hoofd-, langs- en dwarsverbanddelen
      zich in goede staat bevinden en dat het casco geen schade heeft opgelopen die wijst op overbelasting van de romp in
      langsscheepse richting. Indien de werkelijke waarden lager zijn dan de berekende waarden, moeten de desbetreffende
      platen worden vervangen of gerepareerd. Plaatselijke kleine, dunnere plekken kunnen worden toegestaan tot een
      afwijking van ten hoogste 10% van de minimumdikte.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.02
  - number: 3.02.2
    text: |-
      Indien voor de scheepsromp een ander materiaal dan staal wordt gebruikt, moet met een berekening worden aangetoond
      dat de sterkte (sterkte in langs- en dwarsrichting alsmede plaatselijke sterkte) ten minste overeenkomt met
      die, welke bij het gebruik van staal met inachtneming van de minimale dikten als bedoeld in het eerste lid zou
      zijn geresulteerd. Indien een klassecertificaat dan wel een verklaring van een erkend classificatiebureau wordt
      overgelegd kan deze berekening achterwege blijven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.02
  - number: 3.02.3
    text: De stabiliteit van de schepen moet in overeenstemming zijn met het doel waarvoor zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.02
  - number: 3.03.1
    text: |-
      De volgende waterdichte schotten, die reiken tot tegen het dek of, wanneer er geen dek is, tot aan de bovenkant van
      het scheepsboord, moeten ten minste zijn aangebracht:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.03
  - number: 3.03.1.a)
    text: |-
      een aanvaringsschot op een redelijke afstand van de voorsteven, zodanig dat bij vollopen van het vóór het
      aanvaringsschot gelegen waterdichte compartiment het drijfvermogen van het beladen schip behouden blijft en dat
      een resterende veiligheidsafstand van 100 mm in stand blijft. Aan deze eis wordt geacht te zijn voldaan indien het
      aanvaringsschot op een afstand tussen 0,04 *L* en 0,04 *L* + 2 *m*, gemeten vanaf de voorloodlijn, is aangebracht.
      Indien deze afstand meer is dan 0,04 *L* + 2 *m*, moet het voldoen aan deze eis rekenkundig worden aangetoond. De
      afstand mag tot 0,03 *L* worden gereduceerd. In dat geval moet rekenkundig worden aangetoond dat aan de eis in de
      eerste alinea kan worden voldaan, wanneer het vóór het aanvaringsschot gelegen waterdichte compartiment alsmede de
      direct daaraan grenzende compartimenten samen zijn volgelopen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.03
  - number: 3.03.1.b)
    text: |-
      Een achterpiekschot op een redelijke afstand van de achtersteven bij schepen met een lengte *L* van meer dan 25
      m, zodanig dat bij vollopen van het achter het achterpiekschot gelegen waterdichte compartiment het drijfvermogen
      van het vol beladen schip behouden blijft en dat een resterende veiligheidsafstand van 100 mm in stand blijft.
      Aan deze eis wordt geacht te zijn voldaan indien het achterpiekschot op een afstand tussen 1,4 m en 0,04 *L* + 2
      *m*, gemeten vanaf het snijpunt van de achterzijde van de scheepsromp met het vlak van de grootste inzinking, is
      aangebracht. Indien deze afstand meer is dan 0,04 *L* + 2 *m*, moet het voldoen aan deze eis rekenkundig worden
      aangetoond. De afstand mag tot 1 m worden gereduceerd. In dat geval moet rekenkundig worden aangetoond dat aan de
      eis in de eerste alinea kan worden voldaan, wanneer de achter het achterpiekschot gelegen waterdichte compartiment
      alsmede de direct daaraan grenzende compartimenten samen zijn volgelopen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.03
  - number: 3.03.2
    text: |-
      Verblijven alsmede voor de veiligheid van het schip en van de bedrijfsvoering noodzakelijke inrichtingen mogen
      zich niet vóór het vlak van het aanvaringsschot of achter het achterpiekschot bevinden. Dit geldt niet voor
      ankerinrichtingen en stuurmachines.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.03
  - number: 3.03.3
    text: |-
      Verblijven, machinekamers en ketelruimen, alsmede de bijbehorende werkruimten, moeten van de laadruimen zijn
      gescheiden door middel van waterdichte schotten die reiken tot tegen het dek.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.03
  - number: 3.03.4
    text: |-
      Verblijven moeten van de machinekamers en ketel- en laadruimen gasdicht zijn gescheiden en rechtstreeks van het
      dek af toegankelijk zijn. Wanneer een dergelijke toegang niet aanwezig is, moet een extra nooduitgang rechtstreeks
      toegang geven tot het dek.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.03
  - number: 3.03.5
    text: |-
      In de bij het eerste en derde lid voorgeschreven schotten en de in het vierde lid bedoelde begrenzing van ruimten
      mogen zich geen openingen bevinden. Deuren in het achterpiekschot en openingen voor de doorvoering van assen,
      leidingen enz. zijn evenwel toegestaan, wanneer zij zodanig zijn uitgevoerd dat de doelmatigheid van deze schotten
      en van de begrenzing van ruimten onverlet blijft. Deuren in het achterpiekschot zijn alleen toegestaan, indien door
      middel van afstandsbewaking in het stuurhuis kan worden vastgesteld of zij gesloten dan wel geopend zijn en indien
      aan beide zijden goed leesbaar het volgende opschrift is aangebracht: ‘Deur steeds onmiddellijk na het openen weer
      sluiten’.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.03
  - number: 3.03.6
    text: |-
      Openingen waarlangs water wordt in- of uitgelaten, alsmede de aangesloten leidingen moeten zo geconstrueerd zijn
      dat onopzettelijk binnendringen van water in de scheepsromp niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.03
  - number: 3.03.7
    text: Een voorschip moet zodanig gebouwd zijn dat ankers noch geheel, noch gedeeltelijk buiten de scheepshuid uitsteken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.03
  - number: 3.04.1
    text: |-
      De ruimten waarin machine-installaties of ketels, alsmede hun toebehoren, zijn opgesteld, moeten zodanig uitgerust
      en ingericht zijn dat bediening, toezicht en onderhoud van de zich aldaar bevindende installaties gemakkelijk en
      zonder gevaar kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.04
  - number: 3.04.2
    text: |-
      Bunkers voor vloeibare brandstof of smeerolie mogen met ruimten bestemd voor passagiersverblijven en met verblijven
      geen begrenzingsvlakken gemeen hebben die bij normaal bedrijf onder de statische druk van de vloeistof staan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.04
  - number: 3.04.3
    text: |-
      Wanden, dekken en deuren van de machinekamers, ketelruimen en bunkers moeten van staal of een ander gelijkwaardig
      onbrandbaar materiaal zijn gemaakt. Isolaties in machinekamers moeten zijn beschermd tegen het binnendringen van
      olie en oliedampen. Alle openingen in wanden, dekken en deuren van machinekamers, ketelruimen en bunkers moeten
      van buitenaf kunnen worden gesloten. De afsluitinrichtingen moeten van staal of een ander gelijkwaardig onbrandbaar
      materiaal zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.04
  - number: 3.04.4
    text: |-
      Machinekamers, ketelruimen en andere ruimten waarin zich brandbare of giftige gassen kunnen ontwikkelen, moeten
      voldoende kunnen worden geventileerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.04
  - number: 3.04.5
    text: |-
      De trappen en ladders die toegang geven tot machinekamers, ketelruimen en bunkers moeten vast zijn aangebracht en
      zijn gemaakt van staal of van een ander stootvast en onbrandbaar materiaal.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.04
  - number: 3.04.6
    text: |-
      Machinekamers en ketelruimen moeten twee uitgangen hebben, waarvan er een als nooduitgang mag zijn uitgevoerd. Van
      een tweede uitgang kan worden afgezien, indien:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.04
  - number: 3.04.6.a)
    text: |-
      het grondvlak (gemiddelde lengte • gemiddelde breedte ter hoogte van de vloerplaten) van een machinekamer of
      ketelruim in totaal niet meer bedraagt dan 35 m2,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.04
  - number: 3.04.6.b)
    text: |-
      de vluchtweg vanaf iedere standplaats waar bedieningshandelingen of onderhoudswerkzaamheden moeten worden
      uitgevoerd tot aan de uitgang, of tot aan het voetpunt van de trap bij de uitgang die naar buiten leidt, niet meer
      bedraagt dan 5 m, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.04
  - number: 3.04.6.c)
    text: |-
      bij de plaats van onderhoud die het verst verwijderd is van de uitgang een draagbaar blustoestel aanwezig is, en in
      afwijking van [artikel 13.03, eerste lid onderdeel e][ref1], ook indien de geïnstalleerde motorcapaciteit 100 kW of
      minder bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 3.04.7
    text: |-
      Het toegestane niveau van de geluidsdruk in de machinekamers mag niet groter zijn dan 110 dB(A). De meetpunten
      moeten worden gekozen met inachtneming van de noodzakelijke onderhoudswerkzaamheden tijdens het normale bedrijf van
      de installaties.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.04
  - number: 4.01.1
    text: De veiligheidsafstand moet ten minste 300 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.01
  - number: 4.01.2
    text: |-
      De veiligheidsafstand van schepen waarvan de openingen niet spatwater- en regendicht kunnen worden afgesloten en
      van schepen die met open laadruimen varen, moet zodanig worden verhoogd dat elk van deze openingen ten minste 500
      mm van het vlak van de grootste inzinking is verwijderd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.01
  - number: 4.02.1
    text: Het vrijboord bedraagt voor schepen met een doorlopend dek zonder zeeg en zonder bovenbouw 150 mm.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.02
  - number: 4.02.2
    text: |-
      Bij schepen met zeeg en bovenbouw wordt het vrijboord berekend volgens de formule: In deze formule betekent: α de
      correctiecoëfficiënt, waarin met alle aanwezige bovenbouwen rekening wordt gehouden; β** de correctiecoëfficiënt
      voor de invloed van de voorste zeeg, veroorzaakt door de aanwezigheid van bovenbouwen in het voorste vierde deel
      van de scheepslengte *L*; β** de correctiecoëfficiënt voor de invloed van de achterste zeeg, veroorzaakt door de
      aanwezigheid van bovenbouwen in het achterste vierde deel van de scheepslengte *L*; *Se* de in rekening te brengen
      voorste zeeg in mm; *Se* de in rekening te brengen achterste zeeg in mm.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.02
  - number: 4.02.3
    text: |-
      De coëfficiënt α wordt berekend volgens de formule: In deze formule betekent: *le* de in rekening te brengen lengte
      van een bovenbouw in m op de middelste helft van de scheepslengte *L*; *le* de in rekening te brengen lengte van
      een bovenbouw in m in het voorste vierde deel van de scheepslengte *L*; *le* de in rekening te brengen lengte van
      een bovenbouw in m in het achterste vierde deel van de scheepslengte *L*. De in rekening te brengen lengte van een
      bovenbouw wordt berekend volgens de volgende formules: In deze formules betekent: *l* de werkelijke lengte van de
      desbetreffende bovenbouw in m; *b* de breedte van de desbetreffende bovenbouw in m; *B*  de breedte van het schip
      in m, gemeten op de buitenkant van de huidbeplating ter hoogte van het dek, gemeten op de halve lengte van de
      desbetreffende bovenbouw; *h* de hoogte van de desbetreffende bovenbouw in m. Voor luikhoofden wordt *h* evenwel
      berekend door de hoogte van de luikhoofden met de halve veiligheidsafstand overeenkomstig [artikel 4.01][ref1] te
      verminderen. Voor *h* wordt in geen geval een hogere waarde dan 0,36 m aangenomen. Indien of kleiner is dan 0,6,
      moet de in rekening te brengen effectieve lengte *le* van de bovenbouw gelijk aan nul worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.02.4
    text: 'De coëfficiënten *β* en *β* worden volgens de volgende formules berekend:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.02
  - number: 4.02.5
    text: |-
      De respectievelijk in rekening te brengen voorste en achterste zeeg *Se* en *Se* worden volgens de volgende
      formules berekend: *Se* = *S* ∙ *p* *Se* = *S* ∙ *p* In deze formules betekent: *Se* de werkelijke zeeg in het
      voorschip in mm; voor *S* mag echter geen grotere waarde dan 1.000 mm worden aangenomen; *Se* de werkelijke zeeg in
      het achterschip in mm; voor *S* mag echter geen grotere waarde dan 500 mm worden aangenomen; *p* een coëfficiënt,
      die volgens de volgende formule wordt berekend: Hierin is *x* de van het scheepseinde af gemeten abscis tot het
      punt waar de zeeg gelijk is aan 0,25 *S* of 0,25 *S* (zie onderstaande schets): Voor de coëfficiënt *p* mag echter
      geen waarde groter dan 1 worden genomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.02
  - number: 4.02.6
    text: |-
      Wanneer de waarde van *β* • *Se* groter is dan die van β ∙ *Se* wordt in plaats van de waarde van *β* • *Se* die
      van β • *Se* genomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.02
  - number: '4.03'
    text: |-
      Rekening houdende met de vermindering overeenkomstig [artikel 4.02][ref1] mag het kleinste vrijboord niet minder
      dan 0 mm bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.04.1
    text: |-
      Voor de toepassing van artikel 4.04 en [4.05][ref1] is de zone R gelijkwaardig aan zone 3.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.04.2
    text: |-
      Het vlak van de grootste inzinking moet zo worden vastgesteld dat gelijktijdig aan de voorschriften omtrent het
      kleinste vrijboord en aan die omtrent de kleinste veiligheidsafstand wordt voldaan. De Commissie van deskundigen
      kan echter uit veiligheidsoverwegingen een groter vrijboord, dan wel een grotere veiligheidsafstand vaststellen.
      Het vlak van de grootste inzinking wordt ten minste vastgesteld voor zone 3.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.04
  - number: 4.04.3
    text: Het vlak van de grootste inzinking wordt door goed zichtbare en onuitwisbare inzinkingsmerken aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.04
  - number: 4.04.4
    text: |-
      De inzinkingsmerken voor zone 3 bestaan uit een rechthoek met horizontale zijden van 300 mm en verticale zijden van
      40 mm, waarvan de basis samenvalt met het vlak van de toegelaten grootste inzinking. Andersoortige inzinkingsmerken
      dienen een dergelijke rechthoek te bevatten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.04
  - number: 4.04.5
    text: |-
      Schepen moeten ten minste drie paar inzinkingsmerken hebben, waarvan één paar ongeveer midscheeps en de twee
      andere op ongeveer 1/6 van de lengte *L* achter de voorsteven, respectievelijk vóór de achtersteven moeten zijn
      aangebracht. Evenwel kan:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.04
  - number: 4.04.5.a)
    text: |-
      bij schepen waarvan de lengte *L* minder dan 40 m bedraagt, met twee paar merken worden volstaan, die op 1/4 van de
      lengte *L* achter de voorsteven, respectievelijk vóór de achtersteven moeten zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.04
  - number: 4.04.5.b)
    text: |-
      bij schepen die niet zijn bestemd voor het vervoer van goederen, met één paar merken worden volstaan, dat ongeveer
      midscheeps moet zijn aangebracht
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.04
  - number: 4.04.6
    text: |-
      De ingevolge een nieuw onderzoek ongeldig geworden inzinkingsmerken of aanduidingen moeten onder toezicht
      van de Commissie van deskundigen worden verwijderd of als ongeldig worden gekenmerkt. Onduidelijk geworden
      inzinkingsmerken mogen alleen onder toezicht van een Commissie van deskundigen worden vervangen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.04
  - number: 4.04.7
    text: |-
      Wanneer het schip overeenkomstig het Verdrag van 1966 betreffende de meting van binnenschepen is gemeten en de
      ijkmerken in hetzelfde vlak liggen als de in deze standaard voorgeschreven inzinkingsmerken, gelden deze ijkmerken
      ook als inzinkingsmerken; dit wordt aangetekend in het binnenschipcertificaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.04
  - number: 4.04.8
    text: |-
      Op schepen die op andere binnenwaterzones dan zone 3 varen (zones 1, 2 of 4), moet aan de in lid 4 voorgeschreven
      paren inzinkingsmerken aan voor- en achtersteven een verticale streep worden toegevoegd, van waaruit met een extra
      lijn, of voor meerdere zones meerdere extra lijnen, met een lengte van 150 mm naar de boeg van het schip toe het
      inzinkingsniveau ten opzichte van het inzinkingsmerk voor zone 3 wordt aangegeven. Deze verticale streep en de
      horizontale lijn hebben een dikte van 30 mm. Naast het inzinkingsmerk op de boeg van het schip moet het cijfer van
      de betreffende zone worden aangegeven. De afmetingen van dit cijfer zijn 60 x 40 mm (zie figuur 1).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.04
  - number: '4.05'
    text: |-
      Wanneer het vlak van de grootste inzinking voor zone 3 is vastgesteld onder de voorwaarde dat de laadruimen
      spatwater- en regendicht moeten kunnen worden gesloten en de afstand tussen het vlak van de grootste inzinking en
      de bovenrand van de dennenboom minder dan 500 mm bedraagt, moet de ten hoogste toegelaten inzinking voor de vaart
      met open laadruimen worden vastgesteld. In het binnenschipcertificaat moet dan worden ingevuld: ‘Wanneer de luiken
      van de laadruimen geheel of gedeeltelijk zijn geopend, mag het schip ten hoogste tot … mm onder de inzinkingsmerken
      voor zone 3 / zone R zijn beladen.’
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.05
  - number: 4.06.1
    text: |-
      Elk schip waarvan de diepgang meer dan 1 m kan bereiken moet aan het achterschip aan iedere zijde van een
      diepgangsschaal zijn voorzien; aanvullende diepgangsschalen zijn toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.06
  - number: 4.06.2
    text: |-
      Het nulpunt van iedere diepgangsschaal moet loodrecht daaronder liggen in een vlak evenwijdig aan het vlak van
      de grootste inzinking, dat door het laagste punt van de scheepsromp gaat of van de kiel, wanneer deze aanwezig
      is. De afstand loodrecht boven het nulpunt moet in decimeters zijn ingedeeld. Deze indeling moet vanaf het vlak
      voor de waterlijn bij ledig schip tot 100 mm boven het vlak van de grootste inzinking op iedere diepgangsschaal
      door ingehakte of ingeslagen merken zijn aangebracht. Deze indeling moet voorts in de vorm van goed zichtbare,
      afwisselend in twee verschillende kleuren geschilderde stroken zijn aangeduid. De indeling moet naast de schaal ten
      minste bij elke 5 decimeter, alsmede aan het boveneinde, door cijfers zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.06
  - number: 4.06.3
    text: |-
      De twee achterste ijkschalen, die met toepassing van het in [artikel 4.04, lid 7][ref1], genoemde verdrag zijn
      aangebracht, kunnen als diepgangsschalen dienstdoen, mits zij overeenkomstig bovenstaande voorschriften zijn
      ingedeeld; in voorkomend geval moeten de cijfers voor de diepgang zijn toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.07.1
    text: |-
      In afwijking van [artikel 4.01, leden 1 en 2][ref1], wordt de veiligheidsafstand voor schepen die op de
      binnenwateren van zone 4 varen, voor deuren en ander openingen zoals de luiken van de vrachtruimen als volgt
      verminderd:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.07.1.a)
    text: wanneer ze spatwater- en regendicht kunnen worden afgesloten tot 150 mm;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.07
  - number: 4.07.1.b)
    text: wanneer ze niet spatwater- en regendicht kunnen worden afgesloten tot 200 mm.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.07
  - number: 4.07.2
    text: |-
      In afwijking van [artikel 4.02][ref1] bedraagt het kleinste vrijboord voor schepen die op de binnenwateren van zone
      4 varen, 0 mm, wanneer de veiligheidsafstand van lid 1 wordt aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
  - number: 5.01.1
    text: Schepen en samenstellen moeten over voldoende vaar- en manoeuvreereigenschappen beschikken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.01
  - number: 5.01.2
    text: |-
      Schepen zonder eigen mechanische middelen tot voortbeweging die bestemd zijn om gesleept te worden, moeten voldoen
      aan de bijzondere eisen van de Commissie van deskundigen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.01
  - number: 5.01.3
    text: |-
      Schepen met eigen mechanische middelen tot voortbeweging en samenstellen moeten voldoen aan de
      [artikelen 5.02 tot en met 5.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.02.1
    text: |-
      De vaar- en manoeuvreereigenschappen dienen door proefvaarten te worden aangetoond. Daarbij dient met name te
      worden vastgesteld of is voldaan aan de eisen van de [artikelen 5.06 tot en met 5.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.02.2
    text: |-
      De Commissie van deskundigen kan geheel of gedeeltelijk afzien van proefvaarten, wanneer op andere wijze wordt
      aangetoond dat aan de eisen wat betreft vaar- en manoeuvreereigenschappen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.02
  - number: 5.03.1
    text: |-
      De in [artikel 5.02][ref1] bedoelde proefvaarten dienen in de door de bevoegde instanties aangewezen vakken van
      binnenwateren te worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.03.2
    text: |-
      Deze proefvaarttrajecten moeten zich bevinden in zo recht mogelijke vakken met een lengte van ten minste 2 km en
      voldoende breedte in stromend of stil water en moeten zijn voorzien van duidelijk herkenbare markeringen om de
      positie van het schip vast te kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.03
  - number: 5.03.3
    text: |-
      De hydrologische gegevens, zoals waterdiepte, vaarwaterbreedte en gemiddelde stroomsnelheid in het vaarwater bij
      verschillende waterstanden moeten door de Commissie van deskundigen kunnen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.03
  - number: '5.04'
    text: |-
      Schepen en samenstellen die bestemd zijn voor het vervoer van goederen moeten voor de proefvaarten zo mogelijk
      gelijklastig en ten minste voor 70% zijn beladen. Wanneer de proefvaart met minder lading wordt uitgevoerd, moet de
      toelating voor wat betreft de afvaart tot deze belading worden beperkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.04
  - number: 5.05.1
    text: |-
      Bij de proefvaarten mogen geen ankers worden gebruikt, maar wel alle in het binnenschipcertificaat onder nummers 34
      en 52 ingevulde inrichtingen die vanuit de stuurstelling te bedienen zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.05
  - number: 5.05.2
    text: |-
      Bij opdraaimanoeuvres als bedoeld in [artikel 5.10][ref1] mogen echter de boegankers worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.05
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
  - number: 5.06.1
    text: |-
      Schepen en samenstellen moeten een snelheid ten opzichte van het water van ten minste 13 km/u kunnen bereiken. Dit
      geldt niet voor duwboten indien zij alleen varen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.06
  - number: 5.06.2
    text: |-
      Voor schepen en samenstellen die slechts op de reden en in de havens varen kan de Commissie van deskundigen
      afwijkingen toestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.06
  - number: 5.06.3
    text: |-
      De Commissie van deskundigen gaat na of het vaartuig in onbeladen toestand een snelheid ten opzichte van het water
      van 40 km/u kan overschrijden. Is dit het geval, dan moet in het binnenschipcertificaat onder nummer 52 worden
      vermeld: ‘Het vaartuig is in staat een snelheid van 40 km/u ten opzichte van het water te overschrijden.’
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.06
  - number: 5.07.1
    text: |-
      Schepen en samenstellen moeten tijdig kop vóór kunnen stilhouden en moeten tegelijkertijd voldoende bestuurbaar
      blijven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.07
  - number: 5.07.2
    text: |-
      Bij schepen en samenstellen met een lengte *L* van 86 m of minder en een breedte *B* van 22,90 m of minder kunnen
      deze stopeigenschappen worden vervangen door de keereigenschappen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.07
  - number: 5.07.3
    text: |-
      De stopeigenschappen dienen door stopmanoeuvres op een der in [artikel 5.03][ref1] bedoelde proefvaartvakken en de
      keereigenschappen door opdraaimanoeuvres als bedoeld in [artikel 5.10][ref2] te worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.08'
    text: |-
      Wanneer de in [artikel 5.07][ref1] genoemde noodzakelijke stopmanoeuvre in stilstaand water wordt uitgevoerd, dient
      tevens een achteruitvaarproef te worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.08
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.09'
    text: |-
      Schepen en samenstellen moeten tijdig kunnen uitwijken. De uitwijkeigenschappen dienen te worden aangetoond door
      uitwijkmanoeuvres op één der in [artikel 5.03][ref1] bedoelde proefvaartvakken.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.10'
    text: |-
      Schepen en samenstellen met een lengte *L* van 86 m of minder en een breedte *B* van 22,90 m of minder moeten
      tijdig kunnen keren. Deze keereigenschappen kunnen door de in [artikel 5.07][ref1] bedoelde stopeigenschappen
      worden vervangen. De keereigenschappen dienen door opdraaimanoeuvres te worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
  - number: 6.01.1
    text: |-
      Schepen moeten zijn voorzien van een betrouwbaar werkende stuurinrichting waarmee ten minste de in
      [hoofdstuk 5][ref1] bedoelde manoeuvreereigenschappen worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '5'
  - number: 6.01.2
    text: |-
      Werktuiglijk aangedreven stuurinrichtingen moeten zodanig zijn uitgevoerd dat het roer niet onvoorzien van stand
      kan veranderen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.01
  - number: 6.01.3
    text: |-
      De gehele stuurinrichting moet voor een permanente slagzij van het schip tot 15° en omgevingstemperaturen van – 20
      °C tot + 50 °C geschikt zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.01
  - number: 6.01.4
    text: |-
      De afzonderlijke onderdelen van de stuurinrichting moeten qua sterkte zodanig zijn geconstrueerd dat alle onder
      normale omstandigheden daarop inwerkende krachten goed kunnen worden opgenomen. De van buitenaf op het roer
      inwerkende krachten mogen het functioneren van de stuurmachine en zijn aandrijving niet beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.01
  - number: 6.01.5
    text: |-
      Stuurinrichtingen moeten een mechanisch aangedreven stuurmachine hebben, wanneer de voor de bediening van het roer
      te leveren krachten dit vereisen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.01
  - number: 6.01.6
    text: |-
      Stuurmachines met een mechanische aandrijving moeten een beveiliging tegen overbelasting hebben die het door de
      aandrijving uitgeoefende koppel begrenst.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.01
  - number: 6.01.7
    text: |-
      Asdoorvoeringen van roerkoningen moeten zodanig zijn uitgevoerd dat geen waterverontreinigende smeermiddelen naar
      buiten kunnen treden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.01
  - number: 6.02.1
    text: |-
      Bij stuurmachines met mechanische aandrijving moet een tweede onafhankelijke aandrijving of handaandrijving
      beschikbaar zijn. In geval van uitval of storing van de aandrijving moet de tweede onafhankelijke aandrijving of
      handaandrijving binnen 5 seconden in werking kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.02
  - number: 6.02.2
    text: |-
      Wanneer het inschakelen van de tweede aandrijving of van de handaandrijving niet automatisch geschiedt, moet de
      roerganger deze met één enkele handeling onmiddellijk, snel en eenvoudig kunnen inschakelen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.02
  - number: 6.02.3
    text: |-
      Ook wanneer de tweede aandrijving of de handaandrijving in werking is, moeten de in [hoofdstuk 5][ref1] bedoelde
      manoeuvreereigenschappen kunnen worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '5'
  - number: 6.03.1
    text: Op de hydraulische aandrijfinstallatie van de stuurmachine mogen geen andere verbruikers zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.03
  - number: 6.03.2
    text: |-
      De hydraulische tanks dienen te zijn uitgerust met een niveaualarmsysteem, dat het dalen van het olieniveau beneden
      de voor het veilig kunnen functioneren laagst toegestane stand controleert.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.03
  - number: 6.03.3
    text: |-
      De afmetingen, constructie en plaatsing van de pijpleidingen moeten beschadigingen door mechanische invloeden of
      vuur zoveel mogelijk uitsluiten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.03
  - number: 6.03.4
    text: Hydraulische slangen
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.03
  - number: 6.03.4.a)
    text: |-
      zijn alleen toegelaten indien de trillingsabsorptie of de bewegingsvrijheid van onderdelen hun gebruik
      onvermijdelijk maken;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.03
  - number: 6.03.4.b)
    text: moeten ontworpen zijn om ten minste de hoogst toegelaten werkdruk aan te kunnen, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.03
  - number: 6.03.4.c)
    text: moeten ten laatste na acht jaar worden vernieuwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.03
  - number: 6.03.5
    text: |-
      Hydraulische cilinders, hydraulische pompen en hydraulische en elektrische motoren moeten ten minste om de acht
      jaar door een gespecialiseerde firma worden onderzocht en indien nodig hersteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.03
  - number: 6.04.1
    text: Stuurinrichtingen met twee mechanische aandrijvingen moeten beschikken over twee energiebronnen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.04
  - number: 6.04.2
    text: |-
      Wanneer de tweede energiebron van een stuurmachine met mechanische aandrijving tijdens de vaart niet continu kan
      worden gebruikt, moet de voor het starten daarvan benodigde tijd door een buffersysteem van voldoende capaciteit
      worden overbrugd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.04
  - number: 6.04.3
    text: Bij elektrische energiebronnen mogen uit de toevoer van de stuurinrichtingen geen andere verbruikers worden gevoed.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.04
  - number: 6.05.1
    text: Het handstuurwiel mag niet meegedraaid kunnen worden door een mechanische aandrijving.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.05
  - number: 6.05.2
    text: |-
      Terugslag van het stuurwiel moet bij automatisch inschakelen van de handaandrijving bij iedere stand van het roer
      zijn verhinderd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.05
  - number: 6.06.1
    text: |-
      Indien bij roerpropeller-, waterstraal-, cycloïdaalschroef- en boegschroefinstallaties de afstandsbediening voor
      de verandering van de richting van de stuwkracht elektrisch, hydraulisch of pneumatisch is, dan moeten vanaf de
      stuurstelling tot de propeller- of straalinstallatie twee van elkaar onafhankelijke besturingssystemen aanwezig
      zijn die, mutatis mutandis, voldoen aan de in de [artikelen 6.01 tot en met 6.05][ref1] genoemde eisen. Dit is
      niet van toepassing indien het gebruik van dergelijke installaties niet noodzakelijk is om te kunnen voldoen aan de
      manoeuvreereigenschappen bedoeld in [hoofdstuk 5][ref2], dan wel uitsluitend voor de stopproef.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0041395
        hoofdstuk: '5'
  - number: 6.06.2
    text: |-
      Indien twee of meer van elkaar onafhankelijke roerpropeller-, waterstraal- of cycloïdaalschroefinstallaties
      aanwezig zijn, is het tweede besturingssysteem niet vereist indien het schip bij het uitvallen van één van deze
      installaties manoeuvreerbaar blijft overeenkomstig [hoofdstuk 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '5'
  - number: 6.07.1
    text: |-
      De stand van het roer moet bij de stuurstelling duidelijk zichtbaar zijn. Elektrische roerstandaanwijzers moeten
      een eigen voeding hebben.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.07
  - number: 6.07.2
    text: 'De stuurstelling moet voorzien zijn van een optisch en akoestisch alarm om de volgende zaken te signaleren:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.07
  - number: 6.07.2.a)
    text: |-
      daling van het oliepeil van de hydraulische tanks onder het in [artikel 6.03, lid 2][ref1], bepaalde laagste peil
      en daling van de werkdruk van het hydraulische systeem;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.07.2.b)
    text: het uitvallen van de voeding van de elektrische besturingsenergie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.07
  - number: 6.07.2.c)
    text: het uitvallen van de voeding van de elektrische energie ten behoeve van de aandrijving;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.07
  - number: 6.07.2.d)
    text: het uitvallen van de stuurautomaat;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.07
  - number: 6.07.2.e)
    text: het uitvallen van de voorgeschreven buffersystemen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.07
  - number: 6.08.1
    text: |-
      Stuurautomaten en de onderdelen daarvan moeten voldoen aan [artikel 10.20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel10
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.08
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '10'
        hoofdstuk: '10'
  - number: 6.08.2
    text: |-
      Een groen lampje in de stuurstelling moet aangeven dat de stuurautomaat voor gebruik gereed is. Uitval,
      ontoelaatbare afwijkingen van de voedingsspanning en ontoelaatbare daling van de rotatiefrequentie van de gyroscoop
      moeten worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.08
  - number: 6.08.3
    text: |-
      Wanneer er naast de stuurautomaat nog andere besturingssystemen aanwezig zijn, moet bij de stuurstelling duidelijk
      te zien zijn welk systeem is ingeschakeld. De omschakeling van het ene systeem naar het andere moet onmiddellijk
      kunnen geschieden. Storingen van stuurautomaten mogen het betrouwbaar functioneren van de stuurinrichting niet
      kunnen beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.08
  - number: 6.08.4
    text: De voeding van de elektrische energie van de stuurautomaat moet onafhankelijk zijn van andere verbruikers.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.08
  - number: 6.08.5
    text: |-
      De in stuurautomaten gebruikte gyroscopen, sensoren of bochtaanwijzers moeten aan de eisen van bijlage 5, onderdeel
      II, voldoen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.08
  - number: 6.09.1
    text: |-
      De correcte installatie van de stuurinrichting dient door een Commissie van deskundigen te worden gekeurd. Daartoe
      kan de Commissie van deskundigen om de volgende documenten vragen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.1.a)
    text: beschrijving van de stuurinrichting;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.1.b)
    text: tekeningen en gegevens over de aandrijvingen van de stuurmachine en de besturing;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.1.c)
    text: gegevens over de stuurmachine;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.1.d)
    text: schakelschema voor de elektrische installatie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.1.e)
    text: beschrijving van de stuurautomaat;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.1.f)
    text: aanwijzingen voor gebruik en onderhoud van de installatie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.2
    text: |-
      Bij een proefvaart dient de werking van de stuurinrichting als geheel te worden gekeurd. Bij stuurautomaten dient
      te worden getest of op veilige wijze een rechte koers wordt gehouden en of op veilige wijze in bochten wordt
      gevaren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.3
    text: 'Stuurmachines met mechanische aandrijving moeten door een deskundige worden gekeurd:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.3.a)
    text: vóór ingebruikstelling;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.3.b)
    text: na een defect;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.3.c)
    text: na verandering of reparatie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.3.d)
    text: met regelmaat ten minste elke drie jaar.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.4
    text: 'De keuring omvat ten minste:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.4.a)
    text: |-
      een controle van de overeenstemming met de goedgekeurde tekeningen en bij periodieke keuringen, controle of de
      stuurinrichting wijzigingen heeft ondergaan;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.4.b)
    text: een functionele test van de stuurinrichting voor alle operationele functies;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.4.c)
    text: |-
      visuele controle en dichtheidscontrole van de hydraulische componenten, in het bijzonder kleppen, pijpleidingen,
      hydraulische leidingen, hydraulische cilinders, hydraulische pompen en hydraulische filters;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.4.d)
    text: |-
      visuele controle van de elektrische onderdelen, in het bijzonder relais, elektrische motoren en
      veiligheidsapparaten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.4.e)
    text: controle van de optische en akoestische controleapparaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 6.09.5
    text: |-
      Inzake de keuring moet een door de deskundige ondertekende verklaring worden opgesteld waaruit de datum van de
      keuring blijkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: 7.01.1
    text: |-
      Stuurhuizen moeten zodanig zijn ingericht dat de roerganger zijn werkzaamheden tijdens de vaart te allen tijde
      kan verrichten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.01
  - number: 7.01.2
    text: |-
      Tijdens het normale bedrijf van het schip mag het niveau van de geluidsdruk voortgebracht door het schip bij de
      stuurstelling ter hoogte van het hoofd van de roerganger niet hoger zijn dan 70 dB(A).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.01
  - number: 7.01.3
    text: |-
      Bij éénmansstuurstellingen voor het varen op radar moet de roerganger zijn werkzaamheden zittend kunnen
      verrichten en moeten alle voor het voeren van het schip noodzakelijke signalerings- en controle-instrumenten en de
      bedieningsapparatuur zodanig zijn gerangschikt dat de roerganger ze tijdens de vaart gemakkelijk kan observeren en
      bedienen zonder daarbij zijn plaats te hoeven verlaten en zonder het radarbeeld uit het oog te verliezen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.01
  - number: 7.02.1
    text: Het uitzicht vanaf de stuurstelling moet naar alle zijden voldoende vrij zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.02
  - number: 7.02.2
    text: |-
      De dode hoek voor de boeg van het lege schip met halve voorraden en zonder ballast mag voor de roerganger niet meer
      dan 250 m zijn. Om de dode hoek nog verder te verkleinen mogen alleen geschikte hulpmiddelen worden gebruikt. Bij
      het onderzoek mogen deze hulpmiddelen niet in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.02
  - number: 7.02.3
    text: |-
      Het vrije gezichtsveld vanaf de plaats waar de roerganger zich gewoonlijk bevindt moet ten minste 240° van de
      horizon bedragen. Daarvan moet een gezichtsveld van ten minste 140° binnen de voorste halve cirkel liggen. In de
      normale zichtas van de roerganger mogen zich geen vensterstijlen, steunen of opbouwen bevinden. Indien, ook in het
      geval van een vrij gezichtsveld van 240° of meer, geen voldoende vrij uitzicht naar achteren gewaarborgd is, kan
      de Commissie van deskundigen andere maatregelen eisen, zoals de inbouw van geschikte hulpmiddelen. De hoogte van de
      onderrand van de zijvensters moet zo laag mogelijk en de hoogte van de bovenrand van de zij- en achtervensters moet
      zo hoog mogelijk worden gehouden. Bij de vaststelling of aan de bepalingen van dit artikel inzake het gezichtsveld
      vanuit het stuurhuis is voldaan, wordt ervan uitgegaan dat de ooghoogte van de roerganger zich op 1,65 m boven de
      vloer van het stuurhuis bevindt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.02
  - number: 7.02.4
    text: |-
      De bovenrand van het boegvenster van het stuurhuis moet voldoende hoog zijn om de roerganger een vrij zichtveld
      naar voren te bieden. Aan dit voorschrift wordt in elk geval voldaan indien een persoon op de stuurstelling met een
      ooghoogte van 1,80 m een vrij gezichtsveld heeft tot op ten minste 10° boven het horizontale vlak op ooghoogte.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.02
  - number: 7.02.5
    text: |-
      Door adequate middelen moet zijn gewaarborgd dat onder alle weersomstandigheden door de voorruiten helder zicht
      mogelijk is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.02
  - number: 7.02.6
    text: |-
      In stuurhuizen gebruikte ruiten moeten vervaardigd zijn van veiligheidsglas en een minimale lichtdoorlatendheid
      van 75% hebben. Om lichtweerkaatsing te voorkomen zijn de voorruiten van het stuurhuis ontspiegeld of zijn ze zo
      geplaatst dat weerkaatsingen effectief uitgesloten zijn. Aan het voorschrift van de tweede volzin wordt in elk
      geval voldaan indien de ruiten schuin ingezet zijn en zij naar voren toe met de bovenkant van het venster een hoek
      van minimaal 10° en maximaal 25° met de loodlijn maken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.02
  - number: 7.03.1
    text: |-
      De voor het voeren van een schip noodzakelijke bedieningsapparatuur moet gemakkelijk kunnen worden bediend. De
      stand waarin zij zijn gebracht, moet duidelijk herkenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.03
  - number: 7.03.2
    text: |-
      Controle-instrumenten moeten gemakkelijk kunnen worden afgelezen; zij moeten traploos regelbaar kunnen worden
      verlicht. Lichtbronnen mogen niet storen of de zichtbaarheid van de controle-instrumenten hinderen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.03
  - number: 7.03.3
    text: Er moet een inrichting voor het controleren van de signaallampjes aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.03
  - number: 7.03.4
    text: |-
      Of een inrichting in werking is, moet duidelijk zichtbaar zijn. Wanneer dit door een signaallampje wordt
      aangegeven, moet dit groen zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.03
  - number: 7.03.5
    text: |-
      Storingen of het uitvallen van inrichtingen waarvan controle verplicht is, dienen door rode signaallampjes te
      worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.03
  - number: 7.03.6
    text: |-
      Wanneer één van de rode signaallampjes gaat branden, moet een akoestisch signaal klinken. Voor de verschillende
      lampjes kan hetzelfde akoestische alarmsignaal worden gegeven. Het geluidsniveau van dit signaal moet ten minste 3
      dB(A) meer bedragen dan het maximaal heersende geluidsniveau ter plaatse van de stuurstelling.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.03
  - number: 7.03.7
    text: |-
      Het akoestische signaal moet kunnen worden uitgezet na het constateren van het uitvallen of van de storing. Dit
      mag geen nadelige invloed hebben op het functioneren van het signaal voor andere storingen. De rode signaallampjes
      mogen echter pas na het verhelpen van de storing uitgaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.03
  - number: 7.03.8
    text: |-
      De signalerings- en controle-instrumenten moeten bij het uitvallen van de voeding automatisch op een andere
      energiebron worden geschakeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.03
  - number: 7.04.1
    text: |-
      De bediening en de controle van de voortstuwingsmotoren en van de stuurinrichtingen moet vanaf de stuurstelling
      mogelijk zijn. Voortstuwingsmotoren die zijn voorzien van een vanaf de stuurstelling bedienbare koppeling, of die
      een vanaf de stuurstelling bedienbare verstelbare schroef aandrijven, hoeven slechts in de machinekamer aan- en
      uitgezet te kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.04
  - number: 7.04.2
    text: |-
      De bediening van elke voortstuwingsmotor moet kunnen geschieden door één enkele hefboom. De hefboom moet volgens
      een cirkelboog in een verticaal vlak dat nagenoeg evenwijdig is aan de lengteas van het schip kunnen worden
      bewogen. Het verplaatsen van deze hefboom in de richting van het voorschip moet het schip vooruit doen varen,
      terwijl verplaatsing van de hefboom in de richting van het achterschip het schip achteruit doet varen. Aan
      weerszijden van de nulstand van de hefboom vindt het koppelen of omkeren plaats. In de nulstand moet de hefboom
      vanzelf blijven staan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.04
  - number: 7.04.3
    text: |-
      De richting van de door de aandrijving op het schip werkende stuwingskracht alsmede het toerental van de schroeven
      of stuwingsmotoren moet worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.04
  - number: 7.04.4
    text: |-
      De in de [artikelen 6.07, tweede lid][ref1], [8.03, tweede lid][ref2], en [8.05, dertiende lid][ref3],
      voorgeschreven signalerings- en controle-instrumenten moeten in de stuurstelling zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel8
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
  - number: 7.04.5
    text: |-
      Bij éénmansstuurstellingen voor het varen op radar moet de besturing van het schip plaats vinden door middel
      van een hefboom. Deze hefboom moet gemakkelijk met de hand bediend kunnen worden. De hoek van de hefboom moet
      overeenkomen met de stand van de roerbladen ten opzichte van de lengteas van het schip. De hefboom moet in
      onverschillig welke positie kunnen worden losgelaten, zonder dat dan de stand van de roerbladen verandert. De
      nulstand van de hefboom moet duidelijk voelbaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.04
  - number: 7.04.6
    text: |-
      Wanneer het schip is voorzien van koproeren of bijzondere roeren (bijv. voor achteruitvaren), moeten deze
      bij éénmansstuurstellingen voor het varen op radar kunnen worden bediend door speciale hefbomen die, mutatis
      mutandis, aan de in het vijfde lid genoemde toepasselijke eisen voldoen. Dit geldt ook wanneer bij samenstellen
      de roerinstallaties van andere vaartuigen dan het voor het voeren van het samenstel gebruikte vaartuig worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.04
  - number: 7.04.7
    text: |-
      Bij het gebruik van stuurautomaten moet het bedieningsorgaan voor het instellen van de draaisnelheid in elke
      willekeurige positie kunnen worden losgelaten zonder dat daardoor de ingestelde draaisnelheid verandert. Het
      bedieningsorgaan moet een zodanige zwenkhoek hebben dat voldoende nauwkeurigheid van de instelling is gewaarborgd.
      De nulstand moet voelbaar van andere standen zijn te onderscheiden. De schaalverdeling moet traploos regelbaar
      kunnen worden verlicht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.04
  - number: 7.04.8
    text: |-
      Inrichtingen voor afstandsbediening van de gehele stuurinrichting moeten vast ingebouwd zijn en zodanig zijn
      geïnstalleerd dat de gekozen vaarrichting duidelijk zichtbaar is. Wanneer zij uitgeschakeld kunnen worden, moeten
      zij voorzien zijn van een aanwijzer die aangeeft of de inrichting ‘aan’ of ‘uit’ is. De opstelling en bediening
      van de verschillende onderdelen van deze inrichtingen moeten overeenkomen met de functie daarvan. Voor aanvullende
      installaties van de stuurinrichting, zoals boegschroefinstallaties, zijn niet vast ingebouwde afstandsbedieningen
      toegestaan wanneer door een prioriteitsschakeling in het stuurhuis de bediening van de aanvullende installatie te
      allen tijde kan worden overgenomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.04
  - number: 7.04.9
    text: |-
      Bij roerpropeller-, waterstraal-, cycloïdaalschroef- en boegschroefinstallaties zijn gelijkwaardige
      bedieningsapparatuur en signalerings- en controle-instrumenten toegestaan. Voor deze installaties zijn het eerste
      tot en met achtste lid met inachtneming van de bijzondere kenmerken en de gekozen opstelling van de genoemde
      actieve stuurinrichtingen en de voortstuwingsinrichtingen van overeenkomstige toepassing. Naar analogie van lid
      2 moet elke inrichting worden bediend door één enkele hefboom die beweegt volgens een cirkelboog in een verticaal
      vlak dat nagenoeg evenwijdig is aan de lengteas van de inrichting. Uit de positie van de hefboom moet duidelijk de
      richting van de aandrijving van het schip blijken. Voor zover roerpropeller- of cycloïdaalschroefinstallaties niet
      door middel van hefbomen worden bediend, kan de Commissie van deskundigen afwijkingen op de voorschriften van het
      tweede lid toestaan. Deze afwijkingen moeten worden vermeld onder nummer 52 van het binnenschipcertificaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.04
  - number: 7.05.1
    text: |-
      Navigatielantaarns, evenals hun behuizing en toebehoren, dragen het keurmerk dat is bepaald in de gewijzigde
      [Richtlijn 2014/90](32014L0090)/EU.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.05
  - number: 7.05.2
    text: |-
      Voor zover de controle van de navigatielantaarns niet rechtstreeks vanuit het stuurhuis mogelijk is, moeten
      ter controle van deze lichten in het stuurhuis stroomaanwijslampen of gelijkwaardige inrichtingen, zoals
      controlelampjes, zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.05
  - number: 7.05.3
    text: |-
      Bij éénmansstuurstellingen voor het varen op radar moeten ter controle van de navigatielantaarns en de lichtseinen
      controlelampen in de stuurstelling zijn ingebouwd. De schakelaars van de navigatielantaarns moeten in of vlakbij
      de daarbij behorende controlelampen zijn aangebracht en daar duidelijk bij behoren. De groepering en de kleur van
      de controlelampen van de navigatielantaarns en de lichtseinen moeten overeenkomen met de werkelijke opstelling en
      de kleur van de ingeschakelde navigatielantaarns en de lichtseinen. Het niet-functioneren van een navigatielantaarn
      of lichtsein moet het uitgaan van de overeenkomstige controlelamp tot gevolg hebben dan wel op andere wijze door de
      betreffende controlelamp worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.05
  - number: 7.05.4
    text: |-
      Bij éénmansstuurstellingen voor het varen op radar dient de bediening van de geluidsseinen met de voet te kunnen
      geschieden. Dit geldt niet voor het ‘blijf weg-sein’ overeenkomstig de toepasselijke scheepvaartpolitiereglementen
      van de lidstaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.05
  - number: 7.06.1
    text: |-
      Navigatieradarinstallaties en bochtaanwijzers voldoen aan de in bijlage 5 vermelde voorschriften Een bevoegde
      instantie stelt vast of aan deze eisen is voldaan en geeft vervolgens een typegoedkeuring af.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.06
  - number: 7.06.2
    text: |-
      Inland ECDIS-apparaten die in de navigatiemodus kunnen worden gebruikt, worden beschouwd als een
      navigatieradarinstallatie. Zij moeten voldoen aan de eisen van Inland ECDIS-standaard. Aan de in bijlage 5 vermelde
      voorschriften moet zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.06
  - number: 7.06.3
    text: |-
      De Inland AIS-apparatuur moet voldoen aan de eisen van de Inland AIS-teststandaard. Aan de in bijlage 5 vermelde
      voorschriften moet zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.06
  - number: 7.06.4
    text: De bochtaanwijzer moet vóór de roerganger in diens gezichtsveld zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.06
  - number: 7.06.5
    text: 'Bij éénmansstuurstellingen voor het varen op radar:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.06
  - number: 7.06.5.a)
    text: mag het radarscherm in normale stand niet wezenlijk buiten de blikrichting van de roerganger vallen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.06
  - number: 7.06.5.b)
    text: |-
      moet het radarbeeld zonder kap of scherm, ongeacht de buiten het stuurhuis heersende lichtomstandigheden, duidelijk
      zichtbaar zijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.06
  - number: 7.06.5.c)
    text: moet de bochtaanwijzer direct boven of onder het radarbeeld zijn geplaatst of hierin zijn geïntegreerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.06
  - number: 7.07.1
    text: |-
      Op schepen met een éénmansstuurstelling voor het varen op radar moet voor het schip-schipverkeer en de nautische
      informatie het ontvangen door een luidspreker en het zenden door een vast opgestelde microfoon geschieden. Het
      overschakelen van ‘ontvangen’ naar ‘zenden’ moet door middel van drukknoppen geschieden. In geen geval mag de
      microfoon van dit verkeer voor verbindingen van het openbaar verkeer kunnen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.07
  - number: 7.07.2
    text: |-
      Wanneer een schip met een éénmansstuurstelling voor het varen op radar is uitgerust met een marifooninstallatie
      bestemd voor het openbaar verkeer, moet de ontvangst daarvan vanaf de zitplaats van de roerganger mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.07
  - number: '7.08'
    text: |-
      Aan boord van schepen met een éénmansstuurstelling voor het varen op radar moet een interne spreekverbinding
      aanwezig zijn. Vanaf de stuurstelling moeten de volgende spreekverbindingen tot stand kunnen worden gebracht:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.08
  - number: 7.08.a)
    text: met het voorschip van het schip of het voorste gedeelte van het samenstel;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.08
  - number: 7.08.b)
    text: |-
      met het achterschip van het schip of het achterste gedeelte van het samenstel, indien geen directe communicatie
      daarmee vanaf de stuurstelling mogelijk is;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.08
  - number: 7.08.c)
    text: met het verblijf of de verblijven van de bemanning;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.08
  - number: 7.08.d)
    text: met de hut van de schipper.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.08
  - number: 7.09.1
    text: |-
      Er moet een onafhankelijke alarminstallatie aanwezig zijn, waarmee de verblijven, de machinekamers en eventueel
      aparte pompkamers kunnen worden bereikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.09
  - number: 7.09.2
    text: |-
      De roerganger moet een schakelaar ‘AAN/UIT’ voor de bediening van het alarmsein binnen zijn bereik hebben. Voor
      dit sein mag geen schakelaar worden gebruikt die, wanneer men hem loslaat, automatisch in de stand ‘UIT’ kan
      terugspringen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.09
  - number: 7.09.3
    text: |-
      Het geluidsniveau van het alarmsignaal moet in de verblijven ten minste 75 dB(A) bedragen. In de machine- en
      pompkamers moet een overal goed waarneembaar, rondom zichtbaar knipperlicht als alarmsignaal aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.09
  - number: '7.10'
    text: Stuurhuizen moeten zijn voorzien van een doeltreffende en regelbare verwarming en ventilatie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.10
  - number: '7.11'
    text: |-
      Op schepen en samenstellen met een éénmansstuurstelling voor het varen op radar waarvan de lengte L meer dan 86 m
      of de breedte B meer dan 22,90 m bedraagt, moet de roerganger de hekankers vanaf zijn plaats kunnen presenteren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.11
  - number: 7.12.1
    text: |-
      Mechanisch aangedreven in hoogte verstelbare stuurhuizen en toebehoren moeten zodanig zijn ontworpen dat de
      veiligheid van personen aan boord niet in gevaar wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.2
    text: Een in hoogte verstelbaar stuurhuis mag de stabiliteit van het schip niet in gevaar brengen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.3
    text: |-
      Bij het heffen en zakken mogen de vanuit het stuurhuis uitgevoerde handelingen niet worden gehinderd. In alle
      hoogtestanden moet de toegang tot en het verlaten van het stuurhuis mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.4
    text: |-
      Het hefmechanisme moet vanuit het stuurhuis bediend kunnen worden. Bij de stuurstelling moeten de volgende
      indicaties zijn aangebracht:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.4.a)
    text: spanning aanwezig,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.4.b)
    text: stuurhuis in laagste stand,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.4.c)
    text: stuurhuis in hoogste stand,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.4.d)
    text: stuurhuis vergrendeld in vaste stand (indien van toepassing).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.5
    text: |-
      Het hefmechanisme moet het stuurhuis in elke stand kunnen stoppen. Ingeval het stuurhuis in een bepaalde
      stand vergrendeld kan worden, moet het hefmechanisme zich bij een vergrendeling automatisch uitschakelen. Een
      vergrendeling moet onder alle bedrijfsomstandigheden gedeblokkeerd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.6
    text: Het hefmechanisme moet zodanig zijn uitgevoerd dat een overschrijding van de uiterste standen onmogelijk is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.7
    text: |-
      Ter voorkoming van ongecontroleerd neerlaten moeten bouwkundige maatregelen zijn voorzien. Ter voorkoming van
      het gevaar van persoonlijk letsel ten gevolge van het neerlaten van het stuurhuis moeten adequate beschermende
      voorzieningen aanwezig zijn. Telkens wanneer het stuurhuis in een lagere stand wordt gezet, moet automatisch een
      optisch en akoestisch waarschuwingssignaal duidelijk waarneembaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.8
    text: |-
      In hoogte verstelbare stuurhuizen moeten zijn voorzien van een neerlaatsysteem voor noodgevallen, dat onafhankelijk
      is van het normale hefmechanisme en dat zelfs bij een uitval van de energievoorziening gebruikt kan worden. Dit
      noodsysteem moet vanuit het stuurhuis bediend kunnen worden. Bij het gebruik van dit noodsysteem moet het stuurhuis
      net zo snel neergelaten kunnen worden als onder normale omstandigheden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.9
    text: (zonder inhoud)
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.10
    text: 'Hydraulische slangen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.10.a)
    text: |-
      zijn slechts toegestaan wanneer het gebruik daarvan in verband met het verminderen van trillingen of de
      bewegingsvrijheid van de componenten absoluut noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.10.b)
    text: moeten ten minste zijn berekend op de ten hoogste toegelaten werkdruk;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.10.c)
    text: moeten uiterlijk om de acht jaar worden vernieuwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.11
    text: |-
      In hoogte verstelbare stuurhuizen dienen regelmatig, echter ten minste eens in de twaalf maanden door een
      deskundige te worden onderzocht. Hierbij dient door visuele controle en controle van het functioneren te worden
      vastgesteld of de installatie veilig is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.12
    text: 'In hoogte verstelbare stuurhuizen en toebehoren moeten door een erkend deskundige worden gekeurd:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.12.a)
    text: vóór de eerste ingebruikstelling,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.12.b)
    text: vóór de hernieuwde ingebruikstelling na een wezenlijke verandering of reparatie, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: 7.12.12.c)
    text: met een regelmaat van ten minste elke vijf jaar.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: '7.13'
    text: |-
      Wanneer een schip voldoet aan de in de [artikelen 7.01, derde lid][ref1], [7.04, vijfe en zesde lid][ref2],
      [7.05, derde en vierde lid][ref3], [7.06, tweede lid][ref4], [7.07][ref5], [7.08][ref6] en [7.11][ref7] bedoelde
      voorschriften voor schepen met een éénmansstuurstelling voor het varen op radar, moet in het binnenschipcertificaat
      worden aangetekend: ‘Goedgekeurd voor het voeren van het schip met behulp van radar door één persoon’.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0041395#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0041395#Artikel7
      [ref6]: https://wetten.overheid.nl/BWBR0041395#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
      - id: ref6
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
      - id: ref7
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 8.01.1
    text: |-
      Werktuigen alsmede de bijbehorende installaties moeten volgens de regels van de techniek zijn ontworpen, uitgevoerd
      en geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.01
  - number: 8.01.2
    text: |-
      Drukvaten voor de bedrijfsvoering van het schip moeten door een erkend deskundige op de bedrijfszekerheid worden
      gekeurd:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.01
  - number: 8.01.2.a)
    text: vóór de eerste ingebruikstelling;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.01
  - number: 8.01.2.b)
    text: vóór een hernieuwde ingebruikstelling na een verandering of reparatie, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.01
  - number: 8.01.2.c)
    text: regelmatig, ten minste om de vijf jaar.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.01
  - number: 8.01.3
    text: Er mogen alleen verbrandingsmotoren worden geïnstalleerd die brandstoffen gebruiken met een vlampunt boven 55 °C.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.01
  - number: 8.02.1
    text: |-
      Machineinstallaties moeten zo zijn ingericht en opgesteld, dat zij voor bediening en onderhoud voldoende
      toegankelijk zijn en personen, die ze moeten bedienen of onderhouden, niet in gevaar kunnen worden gebracht. Zij
      moeten kunnen worden beveiligd tegen onopzettelijke inbedrijfstelling.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.02
  - number: 8.02.2
    text: |-
      Aan de hoofd- en hulpmotoren alsmede de stoomketels en drukvaten moeten beschermende inrichtingen zijn aangebracht;
      hetzelfde geldt voor hun toebehoren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.02
  - number: 8.02.3
    text: |-
      Aandrijvingen voor de pers- en zuigventilatoren moeten in geval van nood ook buiten de ruimte waar zij zich
      bevinden en buiten de machinekamer uitgeschakeld kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.02
  - number: 8.02.4
    text: |-
      Waar het noodzakelijk is moeten verbindingen van leidingen voor brandstof, smeerolie en oliën, die in
      krachtoverbrengingssystemen, schakel-, aandrijf- en verwarmingssystemen worden gebruikt, afgeschermd of op
      andere geschikte wijze zijn beschermd, om te vermijden dat deze vloeibare stoffen op hete vlakken, in de
      aanzuigkanalen van de machines of andere ontstekingsbronnen sproeien of uitlopen. Het aantal verbindingen in deze
      pijpleidingensystemen moet tot een minimum worden beperkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.02
  - number: 8.02.5
    text: |-
      Niet ingebouwde hogedrukbrandstofleidingen van dieselmotoren tussen de hogedrukbrandstofpompen en de
      inspuitsystemen moeten door een mantelbuissysteem worden beschermd, dat in geval van een lek in de hogedrukleiding,
      de uitlopende brandstof opvangt. In het mantelbuissysteem moet een lekbak zijn voorzien alsook inrichtingen die een
      alarmsignaal geven in geval van lekkage aan een brandstofleiding; voor machines met slechts twee cilinders is dit
      alarmsysteem echter niet vereist. Bij machines voor ankerlieren en spillen op open dek zijn geen mantelbuissystemen
      vereist.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.02
  - number: 8.02.6
    text: |-
      Isolaties van machineonderdelen moeten in overeenstemming zijn met [artikel 3.04, derde lid][ref1], tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel3
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '3'
        hoofdstuk: '3'
  - number: 8.03.1
    text: |-
      De aandrijving van een schip moet op betrouwbare en snelle wijze aangezet, gestopt en van vooruit op achteruit of
      andersom gezet kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.03
  - number: 8.03.2
    text: |-
      De volgende peilen moeten worden gecontroleerd door daartoe geschikte inrichtingen die bij het bereiken van een
      kritische waarde een alarmsignaal in werking stellen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.03
  - number: 8.03.2.a)
    text: de temperatuur van het koelwater van de voortstuwingsmotoren;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.03
  - number: 8.03.2.b)
    text: de druk van de smeerolie van de voortstuwingsmotoren en de transmissie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.03
  - number: 8.03.2.c)
    text: de olie- en luchtdruk van de omkeerinrichting van de voortstuwingsmotoren, de keerkoppeling of de schroeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.03
  - number: 8.03.3
    text: |-
      Bij schepen met slechts één voortstuwingsmotor mag, behalve in geval van overtoeren, de motor niet automatisch
      worden stopgezet.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.03
  - number: 8.03.4
    text: |-
      Bij schepen met slechts één voortstuwingsmotor mag deze slechts zijn uitgerust met een inrichting voor automatische
      reductie van het toerental indien een automatische reductie van het toerental in het stuurhuis optisch en
      akoestisch wordt aangegeven en de inrichting voor reductie van het toerental vanaf de stuurstelling kan worden
      uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.03
  - number: 8.03.5
    text: |-
      Doorvoeringen van assen moeten zodanig zijn uitgevoerd dat geen waterverontreinigende smeermiddelen naar buiten
      kunnen treden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.03
  - number: 8.04.1
    text: Uitlaatgassen moeten volledig naar buitenboord worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.04
  - number: 8.04.2
    text: |-
      Het binnendringen van uitlaatgassen in de verschillende ruimten van het schip moet door doelmatige maatregelen zijn
      verhinderd. Uitlaatgassenleidingen die door verblijven of het stuurhuis gaan, moeten in die ruimten zijn voorzien
      van een gasdichte mantel. De ruimte tussen de uitlaatgassenleiding en de mantel moet in verbinding staan met de
      open lucht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.04
  - number: 8.04.3
    text: Uitlaatgassenleidingen moeten zodanig zijn aangelegd en beschermd dat zij geen brand kunnen veroorzaken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.04
  - number: 8.04.4
    text: |-
      In de machinekamer moeten uitlaatgassenleidingen voldoende geïsoleerd of gekoeld zijn. Buiten de machinekamer kan
      een beveiliging tegen aanraken voldoende zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.04
  - number: 8.05.1
    text: |-
      Vloeibare brandstoffen moeten zijn opgeslagen in tot de scheepsromp behorende of vast in het schip bevestigde tanks
      van staal of, wanneer dit wegens de constructie van het schip nodig is, van een met het oog op brandveiligheid
      gelijkwaardig materiaal. Dit geldt niet voor tanks van hulpaggregaten met een inhoud van maximaal 12 liter, die
      van fabriekswege hecht met deze zijn verbonden. Brandstoftanks mogen geen begrenzingsvlakken gemeen hebben met
      drinkwaterreservoirs.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.2
    text: |-
      Deze tanks, alsmede brandstofleidingen en verdere toebehoren, moeten zodanig zijn uitgevoerd en ingericht
      dat zich geen brandstof of brandstofdampen onopzettelijk in het inwendige van het schip kunnen verspreiden.
      Afsluitinrichtingen op brandstoftanks, die dienen voor het ontnemen van brandstof of voor de afwatering, moeten
      zelfsluitend zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.3
    text: Voor het aanvaringsschot en achter het achterpiekschot mag zich geen brandstoftank bevinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.4
    text: Brandstoftanks en hun appendages mogen niet boven motoren of uitlaatgassenleidingen zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.5
    text: De vulopeningen van brandstoftanks moeten duidelijk zijn gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.6
    text: |-
      De vulleidingen van brandstoftanks moeten aan dek uitmonden, met uitzondering van die der dagtanks. De vulleidingen
      moeten voorzien zijn van een aansluitkoppeling volgens de Europese norm EN 12827 : 1999. Deze tanks moeten zijn
      voorzien van een ontluchtingsleiding die bovendeks in de open lucht uitmondt en zo zijn ingericht dat geen water
      kan binnendringen. De doorsnede van deze ontluchtingsleiding moet ten minste 1,25 maal zo groot zijn als de
      doorsnede van de vulleiding. Indien tanks voor brandstoffen met elkaar in verbinding staan, moet de doorsnede van
      de verbindingsleiding ten minste 1,25 maal zo groot zijn als de doorsnede van de vulleiding.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.7
    text: |-
      De uitgaande leidingen voor vloeibare brandstoffen moeten onmiddellijk bij de tanks zijn voorzien van een
      snelsluitklep, die van het dek af kan worden bediend, ook wanneer de betrokken ruimten zijn gesloten. Wanneer de
      bedieningsinrichting door de wijze van opstelling aan het gezicht is onttrokken, mag de bedekking of de afscherming
      niet afsluitbaar zijn De bedieningsinrichting moet met een rode kleur zijn gemarkeerd. Wanneer de inrichting
      door de wijze van opstelling aan het gezicht is onttrokken, moet deze worden gemarkeerd met een symbool voor de
      ‘snelsluitklep van de tank’ overeenkomstig schets 9 van bijlage 4, met een lengte van de zijde van ten minste 10
      cm. De eerste zin geldt niet voor brandstoftanks die rechtstreeks aan de motor zijn aangebouwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.8
    text: |-
      Brandstofleidingen, hun verbindingen, afdichtingen en appendages moeten zijn vervaardigd uit materiaal dat bestand
      is tegen de te verwachten mechanische, chemische en thermische belasting. Brandstofleidingen mogen niet onderhevig
      zijn aan schadelijke invloeden van warmte en moeten over hun volle lengte gecontroleerd kunnen worden
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.9
    text: |-
      Brandstoftanks moeten zijn voorzien van een geschikte peilinrichting. De peilinrichting moet tot aan de hoogste
      vulstand afleesbaar zijn. De peilglazen moeten tegen beschadigingen zijn beschermd, aan de onderkant zijn voorzien
      van automatisch sluitende inrichtingen en het boveneinde moet weer naar de tank zijn gevoerd, boven de hoogste
      vulstand. Het materiaal van de peilglazen moet bij normale omgevingstemperaturen niet vervormen. De peilkokers
      moeten niet in verblijven eindigen. Peilkokers die in een machinekamer of ketelruim eindigen, moeten zijn voorzien
      van zelfsluitende afsluitinrichtingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.10.a)
    text: |-
      Brandstoftanks moeten door geschikte technische inrichtingen aan boord, die in het binnenschipcertificaat onder
      nummer 52 moeten worden vermeld, zijn beveiligd tegen het uitstromen van brandstof tijdens het bunkeren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.10.b)
    text: |-
      Wanneer brandstof wordt ingenomen van bunkerstations die door hun eigen technische inrichtingen tegen het
      uitstromen van brandstof aan boord tijdens het bunkeren beveiligd zijn, is het uitrustingsvoorschrift, bedoeld in
      onderdeel a en in het elfde lid, niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.11
    text: |-
      Indien brandstoftanks zijn uitgerust met een automatische uitschakelinrichting, moeten de meetelementen bij
      een tankvulstand van 97% het bunkeren onderbreken; deze inrichtingen moeten voldoen aan de maatstaf ‘failsafe’.
      Indien het meetelement een elektrisch contact in werking stelt, dat in de vorm van een binair signaal de van het
      bunkerstation afkomstige en gevoede stroomkring kan onderbreken, moet het signaal naar het bunkerstation kunnen
      worden overgebracht via een waterdichte apparatenstekker van een koppelingsinrichting volgens de internationale
      norm IEC 60309-1 : 2012 voor gelijkstroom van 40 tot en met 50 V, kleur wit, geleidingsnok 10 uur.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.12
    text: Tanks voor brandstoffen moeten zijn voorzien van lekdichte afsluitbare openingen voor reiniging en keuring.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.05.13
    text: |-
      Brandstoftanks die onmiddellijk aan de voortstuwingsmotoren en aan de voor de vaart noodzakelijke andere motoren
      zijn aangesloten, moeten zijn voorzien van een inrichting waardoor zowel optisch als akoestisch in het stuurhuis
      wordt aangegeven dat de hoeveelheid brandstof in de tank niet meer voldoende is voor een veilige voortzetting van
      de vaart.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: 8.06.1
    text: |-
      Smeerolie moet zijn ondergebracht in tot de scheepsromp behorende of vast in het schip bevestigde tanks van staal
      of, wanneer dit wegens de constructie van het schip nodig is, van een met het oog op brandveiligheid gelijkwaardig
      materiaal. Dit is niet van toepassing voor tanks met een inhoud van minder dan 25 liter. Smeerolietanks mogen geen
      begrenzingsvlakken gemeen hebben met drinkwaterreservoirs.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.06
  - number: 8.06.2
    text: |-
      Smeerolietanks, alsmede de daartoe behorende leidingen en verdere toebehoren, moeten zodanig zijn uitgevoerd en
      ingericht dat zich geen smeerolie of smeeroliedampen onopzettelijk in het inwendige van het schip kan verspreiden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.06
  - number: 8.06.3
    text: Voor het aanvaringsschot mogen zich geen smeerolietanks bevinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.06
  - number: 8.06.4
    text: Smeerolietanks en hun appendages mogen niet direct boven motoren of uitlaatgassenleidingen zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.06
  - number: 8.06.5
    text: De vulopeningen van smeerolietanks moeten duidelijk zijn gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.06
  - number: 8.06.6
    text: |-
      Smeerolieleidingen, hun verbindingen, afdichtingen en appendages moeten zijn vervaardigd uit materiaal dat bestand
      is tegen de te verwachten mechanische, chemische en thermische belasting. De leidingen mogen niet onderhevig zijn
      aan schadelijke invloeden van warmte en moeten over hun volle lengte gecontroleerd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.06
  - number: 8.06.7
    text: |-
      Smeerolietanks moeten zijn voorzien van een geschikte peilinrichting. De peilinrichting moet tot aan de hoogste
      vulstand afleesbaar zijn. De peilglazen moeten tegen beschadigingen zijn beschermd, aan de onderkant zijn voorzien
      van automatisch sluitende inrichtingen en het boveneinde moet weer naar de tank zijn gevoerd, boven de hoogste
      vulstand. Het materiaal van de peilglazen moet bij normale omgevingstemperaturen niet vervormen. De peilkokers
      moeten niet in verblijven eindigen. Peilkokers die in een machinekamer of ketelruim eindigen, moeten zijn voorzien
      van zelfsluitende afsluitinrichtingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.06
  - number: 8.07.1
    text: |-
      Olie die in krachtoverbrengingsystemen, schakel-, voortstuwings- en verwarmingssytemen wordt gebruikt moet zijn
      ondergebracht in tot de scheepsromp behorende of vast in het schip bevestigde tanks van staal of, wanneer dit
      wegens de constructie van het schip nodig is, van een met het oog op brandveiligheid gelijkwaardig materiaal.
      Dit geldt niet voor tanks met een inhoud van maximaal 25 liter. Tanks als bedoeld in de eerste volzin mogen geen
      begrenzingsvlakken gemeen hebben met drinkwaterreservoirs.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.07
  - number: 8.07.2
    text: |-
      De in het eerste lid bedoelde tanks evenals hun leidingen en verdere toebehoren, moeten zodanig zijn uitgevoerd
      en ingericht dat zich noch bovengenoemde olie noch oliedampen onopzettelijk in het inwendige van het schip kan
      verspreiden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.07
  - number: 8.07.3
    text: Voor het aanvaringsschot mogen zich geen in het eerste lid bedoelde tanks bevinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.07
  - number: 8.07.4
    text: |-
      De in het eerste lid bedoelde tanks en hun appendages mogen niet zijn geplaatst boven motoren of
      uitlaatgassenleidingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.07
  - number: 8.07.5
    text: De vulopeningen van de in het eerste lid bedoelde tanks moeten duidelijk zijn gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.07
  - number: 8.07.6
    text: |-
      De leidingen voor olie als bedoeld in het eerste lid, hun verbindingen, afdichtingen en appendages moeten zijn
      vervaardigd uit materiaal dat bestand is tegen de te verwachten mechanische, chemische en thermische belasting.
      De leidingen mogen niet onderhevig zijn aan schadelijke invloeden van warmte en moeten over hun volle lengte
      gecontroleerd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.07
  - number: 8.07.7
    text: |-
      De in het eerste lid bedoelde tanks moeten zijn voorzien van een geschikte peilinrichting. De peilinrichting
      moet tot aan de hoogste vulstand afleesbaar zijn. De peilglazen moeten tegen beschadigingen zijn beschermd, aan
      de onderkant zijn voorzien van automatisch sluitende inrichtingen en het boveneinde moet weer naar de tank zijn
      gevoerd, boven de hoogste vulstand. Het materiaal van de peilglazen moet bij normale omgevingstemperaturen niet
      vervormen. De peilkokers moeten niet in verblijven eindigen. Peilkokers die in een machinekamer of ketelruim
      eindigen, moeten zijn voorzien van zelfsluitende afsluitinrichtingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.07
  - number: 8.08.1
    text: |-
      Ieder waterdicht compartiment moet afzonderlijk kunnen worden gelensd. Dit geldt niet voor waterdichte
      compartimenten die tijdens de vaart gewoonlijk luchtdicht zijn afgesloten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: 8.08.2
    text: |-
      Op schepen waarvoor een bemanning is voorgeschreven, moeten twee onafhankelijk van elkaar werkende lenspompen
      aanwezig zijn, die niet in dezelfde ruimte mogen staan, en waarvan er ten minste één door een motor wordt
      aangedreven. Indien deze schepen echter een motorvermogen hebben van minder dan 225 kW of een laadvermogen
      van minder dan 350 t, dan wel, in geval van schepen die niet bestemd zijn voor het vervoer van goederen, een
      waterverplaatsing van minder dan 250 m3, is een hand- of motorlenspomp voldoende. Elk der voorgeschreven pompen
      moet voor elk waterdicht compartiment te gebruiken zijn
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: 8.08.3
    text: |-
      De minimale capaciteit *Q* van de eerste lenspomp moet worden berekend volgens de volgende formule: *Q*  = 0,1
      • *d*2 [*l/min*] *d*  moet worden berekend volgens de volgende formule: De minimale capaciteit *Q* van de tweede
      lenspomp moet worden berekend volgens de volgende formule: *Q*  = 0,1 • *d*2 [*l/min*] *d*  moet worden berekend
      volgens de volgende formule: De afmeting *d* behoeft echter niet groter te zijn dan de afmeting *d*. Bij het
      berekenen van *Q* heeft *l* betrekking op het langste waterdichte compartiment. In deze formules betekent: *l*
      de lengte van het desbetreffende waterdichte compartiment in [m]; *d*  de rekenkundige inwendige diameter van de
      hoofdlensleiding in [mm]; *d*  de rekenkundige inwendige diameter van de aftakking van de lensleiding in [mm].
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: 8.08.4
    text: |-
      Indien de lenspompen zijn aangesloten op een lenssysteem, moet de inwendige diameter van de lensleidingen ten
      minste afmeting *d* hebben, in mm, en de inwendige diameter van de aftakkingen ten minste afmeting *d*, in mm. Voor
      schepen met een lengte *L* van minder dan 25 m mogen de afmetingen *d* en *d* worden verminderd tot 35 mm.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: 8.08.5
    text: Er zijn slechts zelfaanzuigende lenspompen toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: 8.08.6
    text: |-
      In ieder lensbaar compartiment met een vlakke bodem en een breedte van meer dan 5 m moet zich aan stuurboord en aan
      bakboord ten minste één lenskorf bevinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: 8.08.7
    text: |-
      De achterpiek mag door middel van een gemakkelijk toegankelijke, zelfsluitende aftapinrichting, die naar de
      machinekamer loopt, gelenst kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: 8.08.8
    text: |-
      De aftakkingen van de leidingen van afzonderlijke compartimenten moeten door een vastzetbare terugslagklep aan
      de hoofdlensleiding zijn aangesloten. Compartimenten of andere ruimten, die als ballastruimten dienen, behoeven
      slechts via een afsluiter aan het lenssysteem te zijn aangesloten. Dit geldt niet voor laadruimen die zijn
      ingericht voor het opnemen van ballast. Het vullen van dergelijke laadruimen met ballastwater moet door een van
      de lensleiding gescheiden, vast geïnstalleerde ballastleiding of door aftakkingen geschieden, die als flexibele
      leidingen of door middel van beweegbare tussenstukken met de hoofdlensleiding kunnen worden verbonden. Bodemkleppen
      zijn hiervoor niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: 8.08.9
    text: Vullingen van laadruimen moeten zijn voorzien van peilmogelijkheden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: 8.08.10
    text: |-
      Indien een lensinrichting is uitgevoerd met vast aangebrachte leidingen, moeten de lensleidingen van de bilgen
      die voor het verzamelen van oliehoudend water zijn bestemd, zijn voorzien van door een Commissie van deskundigen
      in gesloten stand verzegelde afsluiters. Het aantal en de plaats van deze afsluiters moeten worden vermeld in het
      binnenschipcertificaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: 8.08.11
    text: |-
      Het afgesloten zijn moet worden beschouwd als gelijkwaardig aan een verzegeling als bedoeld in het tiende lid. De
      sleutel of sleutels van de sloten van de afsluitinrichtingen moeten overeenkomstig gekenmerkt op een gemakkelijk
      toegankelijke en aangeduide plaats in de machinekamer worden bewaard.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: 8.09.1
    text: |-
      Het tijdens het bedrijf van een schip vrijkomend oliehoudend water moet aan boord kunnen worden verzameld. In dit
      verband wordt de machinekamerbilge aangemerkt als verzamelruimte.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.09
  - number: 8.09.2
    text: |-
      Voor het verzamelen van afgewerkte olie moeten in de machinekamer(s) één of meer speciaal daarvoor bestemde
      reservoirs zijn aangebracht die ten minste 1,5 keer de hoeveelheid afgewerkte olie uit de carters van alle
      ingebouwde verbrandingsmotoren en tandwielkasten, alsmede de hoeveelheid hydraulische olie afkomstig uit de
      hydraulische olietanks, kunnen bevatten. Aansluitingen voor het leeghalen van deze reservoirs moeten voldoen aan de
      Europese norm EN 1305 : 1996.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.09
  - number: 8.09.3
    text: |-
      Voor schepen die slechts worden ingezet op korte trajecten kan de Commissie van deskundigen ontheffing verlenen van
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.09
  - number: 8.10.1
    text: |-
      Het door een varend schip voortgebrachte geluid, in het bijzonder de door het aanzuigen van lucht en door de
      uitlaat van de motoren veroorzaakte geluiden, moet met daartoe geschikte middelen worden gedempt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.10
  - number: 8.10.2
    text: |-
      Het door een varend schip voortgebrachte geluid mag op 25 m afstand zijdelings van de scheepswand niet meer
      bedragen dan 75 dB(A).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.10
  - number: 8.10.3
    text: |-
      Bij stilliggende schepen mag het geluid, behalve tijdens het laden en lossen, op 25 m afstand zijdelings van de
      scheepswand niet meer bedragen dan 65 dB(A).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.10
  - number: '9.00'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder: - *‘interne verbrandingsmotor’:* een energieomzetter,
      maar geen gasturbine, waarin brandstof wordt verbrand in een afgesloten ruimte, zodat uitzettend gas wordt
      geproduceerd dat direct wordt gebruikt voor het leveren van mechanisch vermogen, en waarvoor EU-typegoedkeuring kan
      worden verleend; ‘motor’ omvat het emissiebeheersingssysteem en de communicatie-interface (hardware en berichten)
      tussen de elektronische regeleenheid of -eenheden van het motorsysteem (ECU) en elke andere regeleenheid van de
      aandrijflijn;
        - *‘typegoedkeuring’:* de beslissing waarbij de bevoegde autoriteit verklaart dat een motortype of een motorfamilie
      wat betreft het niveau van de uitstoot van verontreinigende deeltjes en gassen voldoet aan de desbetreffende
      administratieve bepalingen en technische vereisten;
        - *‘motorfamilie’:* een door de motorfabrikant bepaalde groep van motoren die vanwege hun ontwerp vergelijkbare
      eigenschappen bezitten wat betreft de uitlaatemissie en die aan de geldende emissiegrenswaarden voldoen;
        - *‘referentievermogen’:* het nettovermogen dat wordt gebruikt om toepasselijke emissiegrenswaarden voor de motor
      vast te stellen;
        - *‘motorfabrikant’:* de natuurlijke of rechtspersoon die jegens de goedkeuringsinstantie verantwoordelijk is voor
      alle aspecten van de typegoedkeuring voor motoren, de vergunningsprocedure en de conformiteit van de productie
      van de motor en die tevens verantwoordelijk is voor kwesties met betrekking tot het markttoezicht op de door hem
      geproduceerde motoren, ongeacht of deze direct betrokken is bij alle fasen van het ontwerp en de bouw van de motor
      waarvoor de typegoedkeuring wordt aangevraagd;
        - *‘proces-verbaal van de motorkenmerken ‘:* het document, overeenkomstig bijlage 6, waarin alle parameters, samen
      met de wijzigingen, en met inbegrip van onderdelen en motorinstellingen die een invloed hebben op het emissieniveau
      van verontreinigende gassen en deeltjes door de motor, naar behoren worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.00
  - number: 9.01.1
    text: |-
      De bepalingen van dit hoofdstuk van toepassing op alle interne verbrandingsmotoren met een referentievermogen
      gelijk aan of groter dan 19 kW die in vaartuigen aan boord zijn geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.01
  - number: 9.01.2
    text: |-
      De interne verbrandingsmotoren moeten voldoen aan de vereisten van Verordening (EU) 2016/1628. Er worden alleen
      interne verbrandingsmotoren van de categorieën
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.01
  - number: 9.01.2.a)
    text: IWP,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.01
  - number: 9.01.2.b)
    text: IWA,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.01
  - number: 9.01.2.c)
    text: NRE met een referentievermogen van minder dan 560 kW of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.01
  - number: 9.01.2.d)
    text: motoren die overeenkomstig Verordening (EU) 2016/1628 als gelijkwaardig worden erkend,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.01
  - number: 9.01.3
    text: |-
      Een kopie van de typegoedkeuring, alsmede het inlichtingenformulier van de motorfabrikant en het proces-verbaal van
      de motorkenmerken moeten zich aan boord bevinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.01
  - number: 9.01.4
    text: De montage van ruilmotoren, zoals gedefinieerd in Verordening (EU) 2016/1628, is verboden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.01
  - number: 9.01.5
    text: |-
      De Commissie van deskundigen kan zich voor de vervulling van taken, bedoeld in dit hoofdstuk, doen bijstaan door
      een technische dienst. Alleen technische diensten die zijn aangemeld overeenkomstig Verordening (EU) 2016/1628 zijn
      erkend voor de toepassing van deze standaard.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.01
  - number: '9.02'
    text: |-
      Het identificatienummer, en indien van toepassing het typegoedkeuringsnummer, van alle interne verbrandingsmotoren
      aan boord worden onder nummer 52 van het binnenschipcertificaat vermeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.02
  - number: '9.03'
    text: |-
      De installatie van interne verbrandingsmotoren in vaartuigen dient in overeenstemming te zijn met de beperkingen
      die in de typegoedkeuring zijn uiteengezet.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.03
  - number: 9.04.1
    text: |-
      In het inlichtingenformulier van de motorfabrikantdat wordt opgesteld door de motorfabrikant worden de
      relevante onderdelen, aanpassingen en parameters gespecificeerd, op grond waarvan kan worden aangenomen dat de
      emissiegrenswaarden voor uitlaatgassen voortdurend worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.04
  - number: 9.04.2
    text: 'De instructies omvatten ten minste de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.04
  - number: 9.04.2.a)
    text: motortype en, waar aangewezen, motorfamilie met een indicatie van het referentievermogen en het nominale toerental;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.04
  - number: 9.04.2.b)
    text: lijst met onderdelen en motorparameters die van belang zijn voor de uitlaatgasemissie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.04
  - number: 9.04.2.c)
    text: |-
      niet te verwarren merktekens om de toegelaten componenten betrekking hebbend op de uitlaatgassen te identificeren
      (bijv. nummers van onderdelen die zich op de componenten bevinden);
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.04
  - number: 9.04.2.d)
    text: |-
      vermelding van de motorkenmerken die betrekking hebben op de uitlaatgassen zoals instellingsmogelijkheden van het
      injectiemoment, van de toegelaten temperatuur van het koelwater en van de maximale tegendruk van het uitlaatgas.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.04
  - number: 9.05.1
    text: |-
      Bij gelegenheid van de inbouwkeuring, van de tussentijdse keuring en van de bijzondere keuring verifieert de
      Commissie van deskundigen de feitelijke toestand van de motor met betrekking tot de onderdelen, de ijking en de
      afstellingen van de parameters zoals die in het inlichtingenformulier van de motorfabrikant en in het proces-
      verbaal van de motorkenmerken zijn gespecificeerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.05
  - number: 9.05.2
    text: |-
      De resultaten van de keuringen overeenkomstig eerste lid worden geregistreerd in het proces-verbaal van de
      motorkenmerken overeenkomstig bijlage 6.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.05
  - number: 9.05.3
    text: |-
      Indien de inbouwkeuring, de tussentijdse en bijzondere keuringen aantonen dat de aan boord geïnstalleerde
      interne verbrandingsmotoren motoren wat de parameters, onderdelen en aanpasbare kenmerken betreft, voldoen aan
      de specificaties van de in [artikel 9.01, derde lid][ref1], bedoelde documenten, mag worden aangenomen dat de
      emissies van uitlaatgassen en deeltjes van de interne verbrandingsmotoren aan de maximale waarden voldoen. Indien
      de Commissie van deskundigen vindt dat de interne verbrandingsmotor niet in overeenstemming is met de vereisten van
      de in in artikel 9.01, derde lid, bedoelde documenten, wordt geëist dat er maatregelen worden getroffen om ervoor
      te zorgen dat de conformiteit van de motor wordt hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel9
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.05
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.05.4
    text: |-
      Bij interne verbrandingsmotoren met uitlaatgasnabehandelingssystemen worden in het kader van de inbouw-,
      tussentijdse of bijzondere keuringen controles uitgevoerd om na te gaan of deze systemen correct functioneren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.05
  - number: 9.06.1
    text: |-
      Na de inbouw van de interne verbrandingsmotor aan boord, maar voor zijn ingebruikstelling, moet een inbouwkeuring
      worden uitgevoerd. Deze keuring, die deel uitmaakt van het eerste onderzoek van het vaartuig of van een bijzonder
      onderzoek naar aanleiding van de inbouw van de betreffende motor, leidt ofwel tot het inschrijven van de interne
      verbrandingsmotor in het eerste af te geven binnenschipcertificaat ofwel tot een wijziging van het bestaande
      binnenschipcertificaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.06
  - number: 9.06.2
    text: |-
      Tijdens de inbouwkeuring verifieert de Commissie van Deskundigen of de ingebouwde motor nog steeds voldoet aan
      de technische vereisten met betrekking tot het uitstootniveau van schadelijke gassen en luchtverontreinigende
      deeltjes, ook nadat deze na afgifte van de typegoedkeuring wijzigingen of aanpassingen heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.06
  - number: 9.06.3
    text: |-
      De Commissie van deskundigen kan van een inbouwkeuring, bedoeld in lid 1, afzien indien een motor waarvan het
      nominale referentievermogen *P* minder dan 130 kW bedraagt, wordt vervangen door een interne verbrandingsmotor
      met een zelfde typegoedkeuring overeenkomstig artikel 9.01, tweede lid. Voorwaarde hiervoor is dat de Commissie
      van deskundigen in kennis wordt gesteld van de vervanging van de interne verbrandingsmotor en een kopie van het
      certificaat van typegoedkeuring alsmede het identificatienummer van de nieuw ingebouwde motor ontvangt. Ten gevolge
      hiervan wordt nummer 52 van het binnenschipcertificaat gewijzigd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.06
  - number: 9.07.1
    text: |-
      In geval van een tussentijdse keuring verifieert de Commissie van Deskundigen of de ingebouwde motor nog
      steeds voldoet aan de technische vereisten met betrekking tot het uitstootniveau van schadelijke gassen en
      luchtverontreinigende deeltjes, ook nadat deze sinds de inbouwkeuring wijzigingen of aanpassingen heeft ondergaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.07
  - number: 9.07.2
    text: |-
      De tussentijdse keuringen van de interne verbrandingsmotor worden uitgevoerd in het kader van de periodieke
      controle van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.07
  - number: 9.08.1
    text: |-
      In geval van een bijzondere keuring verifieert de Commissie van Deskundigen of de ingebouwde motor na elke
      belangrijke wijziging nog steeds voldoet aan de technische vereisten met betrekking tot het uitstootniveau van
      schadelijke gassen en luchtverontreinigende deeltjes.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.08
  - number: 9.08.2
    text: |-
      Na elke belangrijke wijziging van een interne verbrandingsmotor die een invloed heeft op de uitstoot van
      schadelijke gassen en luchtverontreinigende deeltjes, moet altijd een bijzondere keuring plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.08
  - number: 9.09.1
    text: |-
      De uitlaatgasnabehandelingssystemen mogen de veilige werking van het vaartuig, met inbegrip van het
      voortstuwingssysteem en de stroomvoorziening, niet in gevaar brengen, noch het uitlaatsysteem blokkeren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 9.09.2
    text: |-
      Als het uitlaatgasnabehandelingssysteem van een interne verbrandingsmotor die de hoofdvoortstuwing van het vaartuig
      vormt, met een omloopsysteem is uitgerust, moet het omloopsysteem aan de volgende voorwaarden voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 9.09.2.a)
    text: |-
      Als het uitlaatgasnabehandelingssysteem uitvalt, moet het vaartuig door inschakeling van het omloopsysteem in staat
      zijn zich op eigen kracht voort te bewegen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 9.09.2.b)
    text: |-
      Als het omloopsysteem wordt ingeschakeld, moet het controlesysteem ervan een akoestisch en optisch alarmsignaal
      geven in het stuurhuis.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 9.09.2.c)
    text: |-
      Het omloopcontrolesysteem registreert alle incidenten waarbij de motor in bedrijf was met een ingeschakeld
      omloopsysteem, in een permanent computergeheugen. Deze informatie moet ter beschikking worden gesteld van de
      bevoegde autoriteiten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 9.09.3
    text: |-
      Controlediagnosesystemen die overeenkomstig artikel 25, derde lid, onderdeel f van Verordening (EU) 2016/1628 zijn
      geïnstalleerd, zijn uitgerust met de voorgeschreven alarmen die in geval van een defect een akoestisch en optisch
      alarmsignaal geven in het stuurhuis.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 9.09.4
    text: |-
      Als het nabehandelingssysteem gebruik maakt van een reagens om de emissies te verlagen, moeten de voorgeschreven
      alarmen de bemanning waarschuwen dat het reagens moet worden aangevuld vóór de tank leeg is of dat het reagens
      moet worden vervangen als er niet wordt voldaan aan de vereiste concentratie. Indien het in artikel 25, derde
      lid, onderdeel f van Verordening (EU) 2016/1628 bedoelde controlediagnosesysteem tot een vermogensreductie van de
      interne verbrandingsmotor kan leiden, moet aan de volgende vereisten worden voldaan:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 9.09.4.a)
    text: |-
      Ondanks het activeren van de vermogensreductie moet het vaartuig in staat blijven om zich op eigen kracht voort
      te bewegen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 9.09.4.b)
    text: |-
      Als de vermogensreductie geactiveerd wordt, moet er een akoestisch en optisch alarmsignaal in het stuurhuis worden
      afgegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 9.09.5
    text: Aan de in het eerste lid bedoelde verplichting wordt geacht te zijn voldaan als het vaartuig is uitgerust met een
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 9.09.5.a)
    text: |-
      tweede onafhankelijk voortstuwingssysteem (zelfs wanneer dit tweede systeem ook met een
      uitlaatgasnabehandelingssysteem is uitgerust), zodat het zich op eigen kracht kan blijven voortbewegen; of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 9.09.5.b)
    text: nabehandelingssysteem met een omloopsysteem overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: 10.01.1
    text: |-
      Indien voor bepaalde onderdelen van een elektrische installatie of een elektrisch apparaat bijzondere voorschriften
      ontbreken, wordt de veiligheidsgraad als voldoende beschouwd wanneer die onderdelen zijn vervaardigd volgens een
      geldende Europese norm of volgens de voorschriften van een erkend classificatiebureau. De vereiste documenten
      moeten worden voorgelegd aan de Commissie van deskundigen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.01.2
    text: 'Aan boord moeten de volgende, door de Commissie van deskundigen gewaarmerkte, documenten aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.01.2.a)
    text: overzichtsschema's van de gehele elektrische installatie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.01.2.b)
    text: |-
      schema's van het hoofdschakelbord, het noodschakelbord en de verdeelschakelborden waarop de belangrijkste
      technische gegevens zoals de nominale stroom van zekeringen en schakeltoestellen zijn aangegeven;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.01.2.c)
    text: gegevens betreffende het vermogen van elektrische apparaten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.01.2.d)
    text: soort en doorsnede van de kabels;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.01.2.e)
    text: |-
      bij elektrische scheepsaandrijvingen schema’s van de schakelborden en documentatie met betrekking tot de
      elektrische aandrijfmotoren;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.01.2.f)
    text: schema’s van de elektronische sturing, regel-, alarm- en veiligheidssystemen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.01.2.g)
    text: |-
      schema’s van de stuurstroomkringen. In geval van onbemande vaartuigen hoeven deze documenten zich niet aan boord te
      bevinden, daarentegen te allen tijde door de eigenaar getoond kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.01.3
    text: |-
      De apparaten en installaties moeten bestand zijn tegen permanente slagzij van het vaartuig tot 15° en een
      omgevingstemperatuur, bij plaatsing binnen in het schip, van 0 °C tot + 40 °C en, bij plaatsing aan dek, van – 20
      °C tot + 40 °C geschikt zijn. Zij moeten binnen deze grenswaarden onberispelijk functioneren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.01.4
    text: Elektrische apparaten en installaties moeten goed toegankelijk en onderhoudsvriendelijk zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.01.5
    text: |-
      Elektrische apparaten en installaties moeten zodanig uitgevoerd en ingebouwd zijn dat de trillingen die onder
      normale bedrijfsomstandigheden aan boord optreden geen storingen of schade veroorzaken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: 10.02.1
    text: |-
      Aan boord van vaartuigen die zijn voorzien van een elektrische installatie moeten ten behoeve van de
      energieverzorging ten minste twee energiebronnen aanwezig zijn, zodat bij het uitvallen van één energiebron de
      resterende energiebron in staat is om verbruikers die voor de veilige vaart noodzakelijk zijn, gedurende ten minste
      30 minuten te voeden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.02
  - number: 10.02.2
    text: |-
      Aan de hand van een vermogensbalansberekening moet worden aangetoond dat de energieverzorging over voldoende
      capaciteit beschikt. Hierbij kan een passende gelijktijdigheidsfactor in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.02
  - number: 10.02.3
    text: |-
      Onverminderd het eerste lid is voor de energiebronnen van stuurinrichtingen [artikel 6.04][ref1] van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6'
        hoofdstuk: '6'
  - number: '10.03'
    text: |-
