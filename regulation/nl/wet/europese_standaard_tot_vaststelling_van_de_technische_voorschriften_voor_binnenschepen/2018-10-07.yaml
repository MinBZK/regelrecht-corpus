  - number: '10.10'
    text: |-
      1. Generatoren die worden aangedreven door de hoofdmotor, de schroefas of een voor andere doeleinden bestemd
      hulpaggregaat, moeten voor de onder bedrijfsomstandigheden optredende toerentalvariaties geschikt zijn.

      2. Transformatoren moeten op goed geventileerde plaatsen of in goed geventileerde ruimten worden geplaatst.

      3. Primaire en secondaire transformatorwikkelingen dienen elektrisch gescheiden van elkaar uitgevoerd zijn. Dit
      geldt niet voor starttransformatoren.

      4. Voor de instelling van de secundaire spanning van transformatoren moeten de dienovereenkomstige aftakkingen van
      de nominale spanning worden voorzien. Dit geldt niet voor starttransformatoren.

      5. Motoren, generatoren en transformatoren moeten door de fabrikant worden voorzien van een kentekening
      die afgezien van de firmanaam van de fabrikant, het serienummer van het apparaat en het vermogen tevens de
      belangrijkste nominale kengegevens moet vermelden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.10
  - number: '10.11'
    text: |-
      1. Accumulatoren moeten zodanig zijn opgesteld, dat zij toegankelijk zijn en niet kunnen verschuiven ten gevolge
      van de bewegingen van het vaartuig. Zij mogen niet zijn opgesteld op plaatsen waar zij aan overmatige hitte,
      extreme koude, spatwater of dampen zijn blootgesteld.

      2. In stuurhuis, woonverblijf, laadruim en verblijfsruimten, of op passagiersschepen in passagiersruimten, hutten
      en keukens mogen geen accumulatoren worden ondergebracht. De eerste volzin geldt niet voor accumulatoren

      a) in verplaatsbare toestellen, of

      b) met een laadvermogen van minder dan 0,2 kW.

      3. Accumulatoren met een laadvermogen van meer dan 2,0 kW moeten in een speciale ruimte zijn ondergebracht. Bij
      opstelling aan dek is het voldoende indien zij in een kast zijn geplaatst. Deze ruimte of kast moet naar het open
      dek mechanisch geventileerd worden (luchttoevoer en -afvoer), voor zover uit de accumulatoren gas kan ontsnappen.

      4. Het laadvermogen van een accumulator wordt berekend uit de maximale laadstroom en de nominale spanning van de
      accumulator, met inachtneming van de laadkarakteristiek van de laadinrichting.

      5. Accumulatoren met een laadvermogen tot en met 2,0 kW mogen ook benedendeks in een kast of kist zijn opgesteld.
      Zij mogen ook open in de machinekamer, een elektrische bedrijfsruimte of een andere goed geventileerde ruimte zijn
      geplaatst, mits zij zijn beschermd tegen vallende voorwerpen en druipwater.

      6. De binnenzijde van alle voor accumulatoren bestemde ruimten, kasten of kisten, alsmede rekken en andere
      bouwtechnische onderdelen, moeten tegen de schadelijke inwerking van elektrolyt zijn beschermd.

      7. Gesloten ruimten, kasten of kisten waarin accumulatoren zijn opgesteld, moeten doeltreffend kunnen worden
      geventileerd. Een mechanische ventilatie moet zijn aangebracht indien het laadvermogen groter is dan

      a) 2,0 kW voor nikkel-cadmium accumulatoren;

      b) 3,0 kW voor loodaccumulatoren.

      De luchttoevoer aan de onderzijde en de luchtafvoer aan de bovenzijde moeten zodanig zijn dat een goede afvoer van
      de gassen is gewaarborgd.

      Ventilatiekanalen mogen geen inrichtingen zoals afsluitinrichtingen bevatten die de vrije doorgang van de lucht
      belemmeren.

      8. De vereiste hoeveelheid lucht *Q* moet worden berekend volgens de formule:

      *Q* = *f* • *I* • *n* [*m*3/*h*]

      Daarbij betekent:

      *f* = 0,11 voor accumulatoren met vloeibare elektrolyten

      *f* = 0,03 voor accumulatoren met gesloten cellen (elektrolyt gebonden in gel of vlies)

      *I* = ¼ van de maximale stroom van de laadinrichting in A;

      *n* = het aantal in serie geschakelde cellen.

      Voor accumulatoren die in een bufferschakeling met het boordnet zijn opgenomen, kan door de Commissie van
      deskundigen op grond van de laadkarakteristiek van de laadinrichting een andere berekeningsmethode voor
      de benodigde luchthoeveelheid worden toegelaten voor zover deze berust op voorschriften van een erkend
      classificatiebureau of daartoe in aanmerking komende normen.

      9. Bij natuurlijke ventilatie moet de doorsnede van de luchtkanalen zo groot zijn dat bij een luchtsnelheid van 0,5
      m/s de vereiste luchthoeveelheid wordt opgebracht. De doorsnede moet echter ten minste

      a) 80 cm2 voor loodaccumulatoren;

      b) 120 cm2 voor nikkel-cadmiumaccumulatoren

      bedragen.

      10. Bij mechanische ventilatie moet, bij voorkeur, een afzuigventilator worden gebruikt waarvan de motor niet in
      de gas- of luchtstroom mag zijn geplaatst. Deze ventilator moet zodanig zijn uitgevoerd dat geen vonkvorming bij
      aanraking van een waaier met het ventilatorhuis en geen elektrostatische oplading kunnen optreden.

      11. Op de deuren of deksels van ruimten, kasten of kisten voor accumulatoren moet een teken ‘vuur, open licht en
      roken verboden’ met een diameter van ten minste 10 cm, overeenkomstig schets 2 van bijlage 4, zijn aangebracht.

      12. Laadinrichtingen moeten altijd zodanig bemeten zijn dat lege accumulatoren binnen ten hoogste 15 uur weer voor
      80% van hun nominale vermogen kunnen worden opgeladen, zonder dat daarbij de maximaal toegelaten laadstroomsterkte
      wordt overschreden.

      13. Automatische laadinrichtingen zijn alleen toegelaten als zij zijn afgestemd op de laadeigenschappen van het
      desbetreffende accumulatortype.

      14. Indien tijdens het laden tegelijkertijd verbruikers van stroom worden voorzien, moet bij de keuze van de
      laadinrichting rekening worden gehouden met het door de verbruikers benodigde vermogen. Afgezien van het tijdelijk
      vereiste vermogen, moet een laadspanning van maximaal 120% van de nominale spanning worden gewaarborgd.

      15. Voor lithium-ionen-accumulatoren gelden de vereisten van de Europese normen EN 62619 in de op 6 juli 2017
      geldende versie en EN 62620 : 2015.

      16. Ter bewaking van de accumulatoren moeten zo mogelijk accumulatormanagementsystemen worden benut. Lithium-ionen-
      accumulatoren moeten met dergelijke systemen zijn uitgerust.

      Deze systemen moeten ten minste de volgende functionele mogelijkheden bieden:

      a) bescherming van de cel (tegen externe en interne kortsluiting, overspanning, volledige ontlading, etc.);

      b) controle op de laadtoestand, voor zover dit niet via het laadtoestel geschiedt;

      c) vermogensmanagement;

      d) bepaling van de laadtoestand;

      e) gelijkmatige spanningsregeling tussen de cellen;

      f) thermomanagement.

      Voor zover mogelijk dienen zij al naar gelang de toepassing bovendien de volgende functionele mogelijkheden te
      bieden:

      g) vaststelling van slijtage, restcapaciteit, interne weerstand, etc.;

      h) communicatie (bijv. met omvormers en sturing);

      i) authenticatie en identificatie;

      j) historische data.

      17. Voor batterijen gelden de leden 1 tot 12 en 16 dienovereenkomstig.
