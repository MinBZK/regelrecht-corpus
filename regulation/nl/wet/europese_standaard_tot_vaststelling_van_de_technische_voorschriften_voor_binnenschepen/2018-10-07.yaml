  - number: '13.02'
    text: |-
      1. Ten minste de volgende uitrustingsstukken overeenkomstig de in één van de lidstaten van kracht zijnde
      scheepvaartpolitiereglementen moeten aan boord aanwezig zijn:

      a) marifooninstallatie;

      b) apparaten en installaties die nodig zijn voor het geven van de voorgeschreven licht- en geluidsseinen, alsmede
      voor het voeren en tonen van de optische tekens;

      c) onafhankelijk van het aan boord aanwezige elektriciteitsnet werkende lichten ter vervanging van de voor het
      stilliggen voorgeschreven lichten.

      2. Bovendien moeten ten minste de volgende verzamelreservoirs aanwezig zijn:

      a) als zodanig aangeduide verzamelreservoirs voor huisvuil;

      b) een als zodanig aangeduid verzamelreservoir van staal of van ander stootvast brandbestendig materiaal met
      sluitend deksel van voldoende grootte, maar ten minste 10 liter inhoud, voor het verzamelen van:

      aa) oliehoudende poetslappen;

      bb) vast klein chemisch afval;

      cc) vloeibaar klein chemisch afval;

      en, voor zover dit geproduceerd kan worden, voor het verzamelen van

      dd) slops;

      ee) overig vethoudend scheepsbedrijfsafval.

      3. Voorts moeten ten minste aanwezig zijn:

      a) stalen trossen voor het meren:

      Ieder schip moet zijn uitgerust met 3 stalen trossen voor het meren. De minimumlengte daarvan moet bedragen:

      1ste tros: *L* + 20 *m*, echter niet meer dan 100 m,

      2de tros: 2/3 van de eerste tros,

      3de tros: 1/3 van de eerste tros.

      Bij schepen met een lengte *L* van minder dan 20 m kan de kortste tros achterwege blijven.

      Deze trossen moeten berekend zijn op een minimumbreeksterkte *Rs* die met behulp van de volgende formule wordt
      vastgesteld:

      Voor de voorgeschreven stalen trossen moet zich een keuringsbewijs volgens de Europese norm EN 10204 : 2004, model
      3.1, aan boord bevinden.

      Deze trossen mogen worden vervangen door andere kabels van dezelfde lengte en met dezelfde breeksterkte. De
      minimumbreeksterkte voor deze kabels moet in een verklaring worden aangetekend.

      b) trossen voor het slepen:

      Sleepboten moeten zijn uitgerust met een bij hun functie passend aantal trossen.

      De hoofdtros moet echter ten minste 100 m lang zijn en een breeksterkte hebben in kN die overeenkomt met ten minste
      een derde van het totale vermogen in kW van de voortstuwingsmotor(en).

      Motorschepen en duwboten die mogen slepen moeten ten minste zijn uitgerust met een sleeptros van 100 m lengte,
      waarvan de breeksterkte in kN overeenkomt met ten minste een kwart van het totale vermogen in kW van de
      voortstuwingsmotor(en);

      c) een werplijn;

      d) een loopplank, ten minste 0,40 m breed en ten minste 4 m lang, waarvan de zijkanten door een lichte streep zijn
      gemarkeerd; deze loopplank moet van een leuning zijn voorzien. Voor kleine schepen kan de Commissie van deskundigen
      kortere loopplanken toelaten;

      e) een bootshaak;

      f) een geschikte verbandtrommel met een inhoud overeenkomstig een norm van een van de lidstaten. De verbandtrommel
      moet in een verblijf of in het stuurhuis worden bewaard en zo zijn opgeborgen dat hij indien nodig gemakkelijk en
      zeker kan worden bereikt. Indien verbandtrommels aan het zicht zijn onttrokken moet de afdekking zijn gemarkeerd
      met een symbool voor verbandtrommels overeenkomstig schets 8 van bijlage 4 met een lengte van de zijde van ten
      minste 10 cm;

      g) een verrekijker, 7 x 50 of een grotere lensdiameter;

      h) een bord met aanwijzingen betreffende het redden en het bijbrengen van drenkelingen;

      i) een vanaf de stuurstelling bedienbare schijnwerper.

      4. Op schepen waarvan de hoogte van het boord boven de waterlijn bij ledig schip meer dan 1,50 m bedraagt moet een
      buitenboordtrap of -ladder aanwezig zijn.
