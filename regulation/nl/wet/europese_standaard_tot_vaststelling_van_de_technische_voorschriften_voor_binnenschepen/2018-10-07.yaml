  - number: 33.01.1
    text: |-
      De bepalingen in [artikel 33.02 tot en met 33.03][ref1] gelden voor vaartuigen die uitsluitend waterwegen buiten de
      Rijn (zone R) bevaren:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel33
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel33.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '33'
        hoofdstuk: '33'
  - number: 33.01.1.a)
    text: waarvoor voor de eerste maal vóór 30 december 2008 een communautair certificaat,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel33.01
  - number: 33.01.1.b)
    text: waarvoor vóór 30 december 2008 een andere vergunning voor het in de vaart brengen is afgegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel33.01
  - number: 33.01.2
    text: |-
      Voor vaartuigen moet worden bewezen dat ze op de datum van afgifte van hun communautair certificaat of van de
      andere vergunning voor het in de vaart brengen voldoen aan de technische voorschriften van de hoofdstukken 1 tot en
      met 12 van bijlage II van Richtlijn nr. 82/714/EEG.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel33.01
  - number: 33.01.3
    text: |-
      De communautaire certificaten die vóór 30 december 2008 afgegeven zijn, blijven tot de op het certificaat
      aangegeven datum geldig.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel33.01
  - number: 33.02.1
    text: 'Vaartuigen die niet volledig aan de bepalingen van deze Standaard voldoen, moeten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel33.02
  - number: 33.02.1.a)
    text: daaraan volgens de overgangsbepalingen die worden vermeld in de onderstaande tabel, worden aangepast, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel33.02
  - number: 33.02.1.b)
    text: |-
      totdat de aanpassing heeft plaatsgevonden, voldoen aan de voorschriften van hoofdstukken 1 tot en met 12 van
      bijlage II van [Richtlijn 82/714/EEG](31982L0714).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel33.02
  - number: 33.02.2
    text: |-
      In de onderstaande tabel zijn de volgende definities van toepassing: ‘N.V.O.’: het voorschrift is niet van
      toepassing op reeds in bedrijf zijnde vaartuigen, tenzij de betreffende delen worden vervangen of omgebouwd, dat
      wil zeggen dat dit voorschrift slechts van toepassing is op *N*ieuwbouw, bij *V*ervanging of bij *O*mbouw van de
      betreffende delen of sectoren. Worden bestaande delen vervangen door delen welke in technische zin en bouwwijze
      gelijk zijn, dan wordt dit niet beschouwd als vervanging ‘V’ volgens deze overgangsbepalingen. ‘Afgifte of
      verlenging van het binnenschipcertificaat’: aan het voorschrift moet zijn voldaan bij de eerstvolgende afgifte of
      bij de eerstvolgende verlenging van het binnenschipcertificaat na de daarop aangegeven datum.









