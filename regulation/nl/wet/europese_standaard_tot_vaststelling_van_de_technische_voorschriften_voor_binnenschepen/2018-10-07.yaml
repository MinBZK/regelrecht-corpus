  - number: '19.09'
    text: |-
      1. Behalve de in [artikel 13.08, eerste lid][ref1], genoemde reddingsboeien moeten op alle voor passagiers
      bestemde, niet gesloten delen van de dekken geschikte reddingsboeien beschikbaar zijn die aan beide zijden van het
      schip op een afstand van telkens niet meer dan 20 m uit elkaar worden geplaatst. Reddingsboeien worden als geschikt
      beschouwd als zij voldoen

        - aan de Europese norm EN 14144 : 2003, of
        - aan het Internationaal Verdrag van 1974 voor de beveiliging van mensenlevens op zee (Solas 1974), Hoofdstuk III,
      Regel 7.1, en aan de internationale code betreffende de reddingsmiddelen (LSA), paragraaf 2.1.

      De ene helft van alle voorgeschreven reddingsboeien moet zijn voorzien van een drijvende lijn die ten minste 30 m
      lang moet zijn en een doorsnede van 8 tot 11 mm moet hebben. De andere helft van de voorgeschreven reddingsboeien
      moet zijn voorzien van een automatisch ontbrandend licht, gevoed door batterijen, dat in het water niet kan
      uitgaan.

      2. Behalve de reddingsboeien als bedoeld in het eerste lid moeten: voor alle leden van het boordpersoneel
      individuele reddingsmiddelen als bedoeld in [artikel 13.08, tweede lid][ref2], onder handbereik beschikbaar
      zijn; voor de leden van het boordpersoneel die geen taak volgens de veiligheidsrol hebben, zijn ook harde of
      halfautomatisch opblaasbare zwemvesten als bedoeld in artikel 13.08, tweede lid, toegestaan.

      3. Passagiersschepen moeten over geschikte inrichtingen beschikken die personen op een veilige manier van boord in
      ondiep water, aan de oever of aan boord van een ander vaartuig kunnen brengen.

      4. Behalve de reddingsmiddelen als bedoeld in het eerste en tweede lid, moeten voor in totaal 100% van het ten
      hoogste toegelaten aantal passagiers individuele reddingsmiddelen als bedoeld in [artikel 13.08, tweede lid][ref3],
      aanwezig zijn, waarbij ook harde of halfautomatisch opblaasbare zwemvesten als bedoeld in artikel 13.08, tweede
      lid, zijn toegestaan.

      5. Onder „gemeenschappelijke reddingsmiddelen’ vallen ook bijboten als bedoeld in [artikel 13.07][ref4] en
      reddingsvlotten.

      Reddingsvlotten moeten:

      a) over een opschrift beschikken waaruit de bestemming blijkt en het aantal personen waarvoor ze geschikt zijn;

      b) voldoende zitruimte bieden voor het toegestane aantal personen;

      c) een drijfvermogen in zoet water hebben van ten minste 750 N per persoon;

      d) voorzien zijn van een met het passagiersschip verbonden touw om wegdrijven te vermijden;

      e) van geschikt materiaal zijn vervaardigd en bestand zijn tegen olie en olieproducten, alsmede tegen temperaturen
      tot 50 °C;

      f) drijvend een stabiele ligging kunnen aannemen en behouden en voorzien zijn van geschikte middelen waaraan het
      aangegeven aantal personen zich vast kunnen houden;

      g) een fluorescerende oranje kleur hebben dan wel fluorescerende naar alle zijden zichtbare vlakken hebben van ten
      minste 100 cm2, en

      h) vanaf de plaats waar ze opgesteld zijn door één persoon snel en veilig over boord kunnen worden gezet dan wel
      vanzelf boven drijven, en

      i) zijn voorzien van passende inrichtingen voor evacuatie van de in [artikel 19.06, lid 8][ref5], bedoelde
      evacuatieruimten naar de reddingsvlotten, indien de verticale afstand tussen het dek van de evacuatieruimten en het
      vlak van grootste inzinking groter is dan 1 m.

      6. Extra gemeenschappelijke reddingsmiddelen zijn uitrustingsstukken die het mogelijk maken meerdere personen die
      zich te water bevinden drijvende te houden. Zij moeten:

      a) over een opschrift beschikken waaruit de bestemming blijkt en het aantal personen waarvoor ze geschikt zijn;

      b) een drijfvermogen in zoet water hebben van ten minste 100 N per persoon;

      c) van geschikt materiaal zijn vervaardigd en bestand zijn tegen olie en olieproducten, alsmede tegen temperaturen
      tot 50 °C;

      d) drijvend een stabiele ligging kunnen innemen en behouden en voorzien zijn van geschikte middelen om zich vast te
      houden voor het aangegeven aantal personen;

      e) een fluorescerende oranje kleur hebben dan wel duurzaam aangebrachte fluorescerende naar alle zijden zichtbare
      vlakken hebben van ten minste 100 cm2, en

      f) vanaf de plaats waar ze opgesteld zijn door één persoon snel en veilig over boord kunnen worden gezet dan wel
      vanzelf boven drijven.

      7. Opblaasbare gemeenschappelijke reddingsmiddelen moeten bovendien:

      a) uit ten minste twee gescheiden luchtkamers bestaan;

      b) bij het in het water belanden zich automatisch opblazen of door handbediening kunnen worden opgeblazen, en

      c) bij iedere mogelijke belasting, ook wanneer slechts de helft van de luchtkamers is opgeblazen, drijvend een
      stabiele ligging innemen en behouden.

      8. Reddingsmiddelen moeten aan boord zodanig zijn ondergebracht dat zij als het nodig is gemakkelijk en veilig
      kunnen worden bereikt. Aan het gezicht onttrokken depots moeten duidelijk zijn gemarkeerd.

      9. Reddingsmiddelen moeten zijn getest volgens de indicaties van de fabrikant.

      10. De bijboot moet zijn uitgerust met een motor en met een verstelbare schijnwerper.

      11. Er moet een geschikte draagbaar beschikbaar zijn.


