  - number: '19.12'
    text: |-
      1. Behalve de draagbare blustoestellen als bedoeld in [artikel 13.03][ref1] moeten ten minste de volgende draagbare
      blustoestellen aanwezig zijn:

      a) één draagbaar blustoestel voor elke 120 m2 bruto vloeroppervlak van de verblijfsruimten voor passagiers;

      b) één draagbaar blustoestel per tien hutten of deel daarvan;

      c) één draagbaar blustoestel in iedere keuken en in de nabijheid van iedere ruimte waarin brandbare vloeistoffen
      worden opgeslagen of gebruikt. In keukens moet het blusmiddel tevens geschikt zijn voor het blussen van branden
      met vet.

      Deze extra brandblussers moeten voldoen aan de eisen, bedoeld in [artikel 13.03][ref2], tweede lid, en zo opgesteld
      en over het schip verdeeld zijn dat bij een brandhaard altijd op elke plaats een blustoestel direct bereikbaar is.
      In iedere keuken alsmede in kapsalons en parfumerieën moet een branddeken binnen handbereik zijn.

      2. Passagiersschepen moeten zijn voorzien van een blusinstallatie, die bestaat uit:

      a) twee bluspompen waarvan er één vast is opgesteld, die door een motor worden aangedreven en voldoende capaciteit
      hebben;

      b) een brandblusleiding met een voldoend aantal brandkranen, met daaraan vast aangesloten ten minste 20 m lange
      brandslangen met straalpijp, die geschikt is om zowel een sproeinevel als een waterstraal voort te brengen en die
      van een afsluitmogelijkheid is voorzien.

      3. Blusinstallaties moeten zodanig zijn uitgevoerd en een zodanige capaciteit hebben dat:

      a) elke willekeurige plaats van het schip door ten minste twee stralen water, niet afkomstig van dezelfde
      brandkraan en met voor elk slechts een slanglengte van ten hoogste 20 m, kan worden bestreken;

      b) de druk bij de brandkranen ten minste 300 kPa bedraagt, en

      c) op alle dekken een lengte van de waterstralen van ten minste 6 m kan worden bereikt.

      Wanneer er brandbluskasten aanwezig zijn moeten deze aan de buitenkant zijn voorzien van een symbool voor
      ‘brandslang’ volgens schets 5 van bijlage 4 met een lengte van de zijde van 10 cm.

      4. Aansluitingen van blusinstallaties met schroefdraad of kraan moeten zo zijn afgesteld dat elk van de
      brandslangen bij draaiende bluspompen afgekoppeld en verwijderd kan worden.

      5. Brandslangen binnen in het schip moeten zijn opgerold op een axiaal aangebrachte haspel.

      6. Materiaal voor inrichtingen voor brandbestrijding moeten ofwel hittebestendig ofwel voldoende zijn beschermd
      tegen uitvallen bij hitte.

      7. Pijpleidingen en blusinstallaties moeten zodanig zijn aangebracht dat de risico op bevriezen wordt vermeden.

      8. De twee bluspompen moeten:

      a) niet in dezelfde ruimte zijn opgesteld of geplaatst worden;

      b) onafhankelijk van elkaar kunnen functioneren;

      c) ieder op zich op alle dekken in staat zijn om de noodzakelijke druk op de blusinstallatie te houden en de
      vereiste lengte van de waterstraal te bereiken;

      d) voor het achterpiekschot zijn opgesteld;

      Brandbluspompen mogen worden gebruikt voor algemene bedrijfsmatige taken.

      9. Machinekamers moeten zijn uitgerust met een vast ingebouwde brandblusinstallatie als bedoeld in
      [artikel 13.05][ref3].

      10. Op hotelschepen moeten beschikbaar zijn:

      a) twee ademhalingsapparaten die onafhankelijk van de omgevingslucht werken en voldoen aan de Europese norm EN
      137 : 2006 type 2, met volledig masker overeenkomstig de Europese norm EN 136 : 1998;

      b) twee uitrustingspakketten die ten minste bestaan uit veiligheidskleding, helm, laarzen, handschoenen, bijl,
      koevoet, zaklamp en geleidingslijn;

      c) vier vluchtmaskers.


