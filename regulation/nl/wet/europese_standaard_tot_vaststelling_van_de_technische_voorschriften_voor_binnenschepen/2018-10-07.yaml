  - number: '23.03'
    text: |-
      1. a) [Artikel 3.03, eerste lid][ref1], is van overeenkomstige toepassing;

      b) de [hoofdstukken 5][ref2] en [6][ref3] zijn van overeenkomstige toepassing, indien het schip is voorzien van
      eigen mechanische middelen tot voortbeweging;

      c) [artikel 13.02, tweede lid, onderdeel a en b][ref4], is van overeenkomstige toepassing;

      d) De Commissie van deskundigen kan van de toepassing van de overige bepalingen met betrekking tot de bouw,
      inrichting en uitrusting afwijkingen toelaten, voor zover in het elke geval een zelfde mate van veiligheid is
      aangetoond.

      2. De Commissie van deskundigen kan afzien van de toepassing van de volgende bepalingen:

      a) [artikel 8.08, tweede tot en met achtste lid][ref5], wanneer geen bemanning is voorgeschreven;

      b) [artikel 13.01, eerste en derde lid][ref6], wanneer het schip bestemd voor bouwwerkzaamheden door middel van
      werkankers of palen veilig kan worden verankerd. Een schip bestemd voor bouwwerkzaamheden met eigen mechanische
      middelen tot voortbeweging moet echter ten minste één anker hebben als bedoeld in artikel 13.01, eerste lid,
      waarbij de coëfficiënt *k* en voor *T* gelijk aan holte *H*;

      c) [artikel 13.02, eerste lid, onderdeel c][ref7], wanneer het schip bestemd voor bouwwerkzaamheden niet over eigen
      mechanische middelen tot voortbeweging beschikt.


