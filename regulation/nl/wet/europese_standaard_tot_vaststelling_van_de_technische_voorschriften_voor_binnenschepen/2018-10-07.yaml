  - number: '8.03'
    text: |-
      1. De aandrijving van een schip moet op betrouwbare en snelle wijze aangezet, gestopt en van vooruit op achteruit
      of andersom gezet kunnen worden.

      2. De volgende peilen moeten worden gecontroleerd door daartoe geschikte inrichtingen die bij het bereiken van een
      kritische waarde een alarmsignaal in werking stellen:

      a) de temperatuur van het koelwater van de voortstuwingsmotoren;

      b) de druk van de smeerolie van de voortstuwingsmotoren en de transmissie;

      c) de olie- en luchtdruk van de omkeerinrichting van de voortstuwingsmotoren, de keerkoppeling of de schroeven.

      3. Bij schepen met slechts één voortstuwingsmotor mag, behalve in geval van overtoeren, de motor niet automatisch
      worden stopgezet.

      4. Bij schepen met slechts één voortstuwingsmotor mag deze slechts zijn uitgerust met een inrichting voor
      automatische reductie van het toerental indien een automatische reductie van het toerental in het stuurhuis optisch
      en akoestisch wordt aangegeven en de inrichting voor reductie van het toerental vanaf de stuurstelling kan worden
      uitgeschakeld.

      5. Doorvoeringen van assen moeten zodanig zijn uitgevoerd dat geen waterverontreinigende smeermiddelen naar buiten
      kunnen treden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.03
  - number: '8.04'
    text: |-
      1. Uitlaatgassen moeten volledig naar buitenboord worden afgevoerd.

      2. Het binnendringen van uitlaatgassen in de verschillende ruimten van het schip moet door doelmatige maatregelen
      zijn verhinderd. Uitlaatgassenleidingen die door verblijven of het stuurhuis gaan, moeten in die ruimten zijn
      voorzien van een gasdichte mantel. De ruimte tussen de uitlaatgassenleiding en de mantel moet in verbinding staan
      met de open lucht.

      3. Uitlaatgassenleidingen moeten zodanig zijn aangelegd en beschermd dat zij geen brand kunnen veroorzaken.

      4. In de machinekamer moeten uitlaatgassenleidingen voldoende geïsoleerd of gekoeld zijn. Buiten de machinekamer
      kan een beveiliging tegen aanraken voldoende zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.04
  - number: '8.05'
    text: |-
      1. Vloeibare brandstoffen moeten zijn opgeslagen in tot de scheepsromp behorende of vast in het schip
      bevestigde tanks van staal of, wanneer dit wegens de constructie van het schip nodig is, van een met het oog op
      brandveiligheid gelijkwaardig materiaal. Dit geldt niet voor tanks van hulpaggregaten met een inhoud van maximaal
      12 liter, die van fabriekswege hecht met deze zijn verbonden. Brandstoftanks mogen geen begrenzingsvlakken gemeen
      hebben met drinkwaterreservoirs.

      2. Deze tanks, alsmede brandstofleidingen en verdere toebehoren, moeten zodanig zijn uitgevoerd en ingericht
      dat zich geen brandstof of brandstofdampen onopzettelijk in het inwendige van het schip kunnen verspreiden.
      Afsluitinrichtingen op brandstoftanks, die dienen voor het ontnemen van brandstof of voor de afwatering, moeten
      zelfsluitend zijn.

      3. Voor het aanvaringsschot en achter het achterpiekschot mag zich geen brandstoftank bevinden.

      4. Brandstoftanks en hun appendages mogen niet boven motoren of uitlaatgassenleidingen zijn geplaatst.

      5. De vulopeningen van brandstoftanks moeten duidelijk zijn gekenmerkt.

      6. De vulleidingen van brandstoftanks moeten aan dek uitmonden, met uitzondering van die der dagtanks. De
      vulleidingen moeten voorzien zijn van een aansluitkoppeling volgens de Europese norm EN 12827 : 1999.

      Deze tanks moeten zijn voorzien van een ontluchtingsleiding die bovendeks in de open lucht uitmondt en zo zijn
      ingericht dat geen water kan binnendringen. De doorsnede van deze ontluchtingsleiding moet ten minste 1,25 maal zo
      groot zijn als de doorsnede van de vulleiding.

      Indien tanks voor brandstoffen met elkaar in verbinding staan, moet de doorsnede van de verbindingsleiding ten
      minste 1,25 maal zo groot zijn als de doorsnede van de vulleiding.

      7. De uitgaande leidingen voor vloeibare brandstoffen moeten onmiddellijk bij de tanks zijn voorzien van een
      snelsluitklep, die van het dek af kan worden bediend, ook wanneer de betrokken ruimten zijn gesloten.

      Wanneer de bedieningsinrichting door de wijze van opstelling aan het gezicht is onttrokken, mag de bedekking of de
      afscherming niet afsluitbaar zijn

      De bedieningsinrichting moet met een rode kleur zijn gemarkeerd. Wanneer de inrichting door de wijze van opstelling
      aan het gezicht is onttrokken, moet deze worden gemarkeerd met een symbool voor de ‘snelsluitklep van de tank’
      overeenkomstig schets 9 van bijlage 4, met een lengte van de zijde van ten minste 10 cm.

      De eerste zin geldt niet voor brandstoftanks die rechtstreeks aan de motor zijn aangebouwd.

      8. Brandstofleidingen, hun verbindingen, afdichtingen en appendages moeten zijn vervaardigd uit materiaal dat
      bestand is tegen de te verwachten mechanische, chemische en thermische belasting. Brandstofleidingen mogen niet
      onderhevig zijn aan schadelijke invloeden van warmte en moeten over hun volle lengte gecontroleerd kunnen worden

      9. Brandstoftanks moeten zijn voorzien van een geschikte peilinrichting. De peilinrichting moet tot aan de hoogste
      vulstand afleesbaar zijn. De peilglazen moeten tegen beschadigingen zijn beschermd, aan de onderkant zijn voorzien
      van automatisch sluitende inrichtingen en het boveneinde moet weer naar de tank zijn gevoerd, boven de hoogste
      vulstand. Het materiaal van de peilglazen moet bij normale omgevingstemperaturen niet vervormen. De peilkokers
      moeten niet in verblijven eindigen. Peilkokers die in een machinekamer of ketelruim eindigen, moeten zijn voorzien
      van zelfsluitende afsluitinrichtingen.

      10. a) Brandstoftanks moeten door geschikte technische inrichtingen aan boord, die in het binnenschipcertificaat
      onder nummer 52 moeten worden vermeld, zijn beveiligd tegen het uitstromen van brandstof tijdens het bunkeren.

      b) Wanneer brandstof wordt ingenomen van bunkerstations die door hun eigen technische inrichtingen tegen het
      uitstromen van brandstof aan boord tijdens het bunkeren beveiligd zijn, is het uitrustingsvoorschrift, bedoeld in
      onderdeel a en in het elfde lid, niet van toepassing.

      11. Indien brandstoftanks zijn uitgerust met een automatische uitschakelinrichting, moeten de meetelementen bij een
      tankvulstand van 97% het bunkeren onderbreken; deze inrichtingen moeten voldoen aan de maatstaf ‘failsafe’.

      Indien het meetelement een elektrisch contact in werking stelt, dat in de vorm van een binair signaal de van het
      bunkerstation afkomstige en gevoede stroomkring kan onderbreken, moet het signaal naar het bunkerstation kunnen
      worden overgebracht via een waterdichte apparatenstekker van een koppelingsinrichting volgens de internationale
      norm IEC 60309-1 : 2012 voor gelijkstroom van 40 tot en met 50 V, kleur wit, geleidingsnok 10 uur.

      12. Tanks voor brandstoffen moeten zijn voorzien van lekdichte afsluitbare openingen voor reiniging en keuring.

      13. Brandstoftanks die onmiddellijk aan de voortstuwingsmotoren en aan de voor de vaart noodzakelijke andere
      motoren zijn aangesloten, moeten zijn voorzien van een inrichting waardoor zowel optisch als akoestisch in
      het stuurhuis wordt aangegeven dat de hoeveelheid brandstof in de tank niet meer voldoende is voor een veilige
      voortzetting van de vaart.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.05
  - number: '8.06'
    text: |-
      1. Smeerolie moet zijn ondergebracht in tot de scheepsromp behorende of vast in het schip bevestigde tanks
      van staal of, wanneer dit wegens de constructie van het schip nodig is, van een met het oog op brandveiligheid
      gelijkwaardig materiaal. Dit is niet van toepassing voor tanks met een inhoud van minder dan 25 liter.
      Smeerolietanks mogen geen begrenzingsvlakken gemeen hebben met drinkwaterreservoirs.

      2. Smeerolietanks, alsmede de daartoe behorende leidingen en verdere toebehoren, moeten zodanig zijn uitgevoerd en
      ingericht dat zich geen smeerolie of smeeroliedampen onopzettelijk in het inwendige van het schip kan verspreiden.

      3. Voor het aanvaringsschot mogen zich geen smeerolietanks bevinden.

      4. Smeerolietanks en hun appendages mogen niet direct boven motoren of uitlaatgassenleidingen zijn geplaatst.

      5. De vulopeningen van smeerolietanks moeten duidelijk zijn gekenmerkt.

      6. Smeerolieleidingen, hun verbindingen, afdichtingen en appendages moeten zijn vervaardigd uit materiaal
      dat bestand is tegen de te verwachten mechanische, chemische en thermische belasting. De leidingen mogen niet
      onderhevig zijn aan schadelijke invloeden van warmte en moeten over hun volle lengte gecontroleerd kunnen worden.

      7. Smeerolietanks moeten zijn voorzien van een geschikte peilinrichting. De peilinrichting moet tot aan de hoogste
      vulstand afleesbaar zijn. De peilglazen moeten tegen beschadigingen zijn beschermd, aan de onderkant zijn voorzien
      van automatisch sluitende inrichtingen en het boveneinde moet weer naar de tank zijn gevoerd, boven de hoogste
      vulstand. Het materiaal van de peilglazen moet bij normale omgevingstemperaturen niet vervormen. De peilkokers
      moeten niet in verblijven eindigen. Peilkokers die in een machinekamer of ketelruim eindigen, moeten zijn voorzien
      van zelfsluitende afsluitinrichtingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.06
  - number: '8.07'
    text: |-
      1. Olie die in krachtoverbrengingsystemen, schakel-, voortstuwings- en verwarmingssytemen wordt gebruikt moet
      zijn ondergebracht in tot de scheepsromp behorende of vast in het schip bevestigde tanks van staal of, wanneer
      dit wegens de constructie van het schip nodig is, van een met het oog op brandveiligheid gelijkwaardig materiaal.
      Dit geldt niet voor tanks met een inhoud van maximaal 25 liter. Tanks als bedoeld in de eerste volzin mogen geen
      begrenzingsvlakken gemeen hebben met drinkwaterreservoirs.

      2. De in het eerste lid bedoelde tanks evenals hun leidingen en verdere toebehoren, moeten zodanig zijn uitgevoerd
      en ingericht dat zich noch bovengenoemde olie noch oliedampen onopzettelijk in het inwendige van het schip kan
      verspreiden.

      3. Voor het aanvaringsschot mogen zich geen in het eerste lid bedoelde tanks bevinden.

      4. De in het eerste lid bedoelde tanks en hun appendages mogen niet zijn geplaatst boven motoren of
      uitlaatgassenleidingen.

      5. De vulopeningen van de in het eerste lid bedoelde tanks moeten duidelijk zijn gekenmerkt.

      6. De leidingen voor olie als bedoeld in het eerste lid, hun verbindingen, afdichtingen en appendages moeten zijn
      vervaardigd uit materiaal dat bestand is tegen de te verwachten mechanische, chemische en thermische belasting.
      De leidingen mogen niet onderhevig zijn aan schadelijke invloeden van warmte en moeten over hun volle lengte
      gecontroleerd kunnen worden.

      7. De in het eerste lid bedoelde tanks moeten zijn voorzien van een geschikte peilinrichting. De peilinrichting
      moet tot aan de hoogste vulstand afleesbaar zijn. De peilglazen moeten tegen beschadigingen zijn beschermd, aan
      de onderkant zijn voorzien van automatisch sluitende inrichtingen en het boveneinde moet weer naar de tank zijn
      gevoerd, boven de hoogste vulstand. Het materiaal van de peilglazen moet bij normale omgevingstemperaturen niet
      vervormen. De peilkokers moeten niet in verblijven eindigen. Peilkokers die in een machinekamer of ketelruim
      eindigen, moeten zijn voorzien van zelfsluitende afsluitinrichtingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.07
  - number: '8.08'
    text: |-
      1. Ieder waterdicht compartiment moet afzonderlijk kunnen worden gelensd. Dit geldt niet voor waterdichte
      compartimenten die tijdens de vaart gewoonlijk luchtdicht zijn afgesloten.

      2. Op schepen waarvoor een bemanning is voorgeschreven, moeten twee onafhankelijk van elkaar werkende lenspompen
      aanwezig zijn, die niet in dezelfde ruimte mogen staan, en waarvan er ten minste één door een motor wordt
      aangedreven. Indien deze schepen echter een motorvermogen hebben van minder dan 225 kW of een laadvermogen
      van minder dan 350 t, dan wel, in geval van schepen die niet bestemd zijn voor het vervoer van goederen, een
      waterverplaatsing van minder dan 250 m3, is een hand- of motorlenspomp voldoende.

      Elk der voorgeschreven pompen moet voor elk waterdicht compartiment te gebruiken zijn

      3. De minimale capaciteit *Q* van de eerste lenspomp moet worden berekend volgens de volgende formule:

      *Q*  = 0,1 • *d*2 [*l/min*]

      *d*  moet worden berekend volgens de volgende formule:

      De minimale capaciteit *Q* van de tweede lenspomp moet worden berekend volgens de volgende formule:

      *Q*  = 0,1 • *d*2 [*l/min*]

      *d*  moet worden berekend volgens de volgende formule:

      De afmeting *d* behoeft echter niet groter te zijn dan de afmeting *d*.

      Bij het berekenen van *Q* heeft *l* betrekking op het langste waterdichte compartiment.

      In deze formules betekent:

      *l* de lengte van het desbetreffende waterdichte compartiment in [m];

      *d*  de rekenkundige inwendige diameter van de hoofdlensleiding in [mm];

      *d*  de rekenkundige inwendige diameter van de aftakking van de lensleiding in [mm].

      4. Indien de lenspompen zijn aangesloten op een lenssysteem, moet de inwendige diameter van de lensleidingen ten
      minste afmeting *d* hebben, in mm, en de inwendige diameter van de aftakkingen ten minste afmeting *d*, in mm.

      Voor schepen met een lengte *L* van minder dan 25 m mogen de afmetingen *d* en *d* worden verminderd tot 35 mm.

      5. Er zijn slechts zelfaanzuigende lenspompen toegestaan.

      6. In ieder lensbaar compartiment met een vlakke bodem en een breedte van meer dan 5 m moet zich aan stuurboord en
      aan bakboord ten minste één lenskorf bevinden.

      7. De achterpiek mag door middel van een gemakkelijk toegankelijke, zelfsluitende aftapinrichting, die naar de
      machinekamer loopt, gelenst kunnen worden.

      8. De aftakkingen van de leidingen van afzonderlijke compartimenten moeten door een vastzetbare terugslagklep aan
      de hoofdlensleiding zijn aangesloten.

      Compartimenten of andere ruimten, die als ballastruimten dienen, behoeven slechts via een afsluiter aan
      het lenssysteem te zijn aangesloten. Dit geldt niet voor laadruimen die zijn ingericht voor het opnemen van
      ballast. Het vullen van dergelijke laadruimen met ballastwater moet door een van de lensleiding gescheiden,
      vast geïnstalleerde ballastleiding of door aftakkingen geschieden, die als flexibele leidingen of door middel
      van beweegbare tussenstukken met de hoofdlensleiding kunnen worden verbonden. Bodemkleppen zijn hiervoor niet
      toegestaan.

      9. Vullingen van laadruimen moeten zijn voorzien van peilmogelijkheden.

      10. Indien een lensinrichting is uitgevoerd met vast aangebrachte leidingen, moeten de lensleidingen van de bilgen
      die voor het verzamelen van oliehoudend water zijn bestemd, zijn voorzien van door een Commissie van deskundigen
      in gesloten stand verzegelde afsluiters. Het aantal en de plaats van deze afsluiters moeten worden vermeld in het
      binnenschipcertificaat.

      11. Het afgesloten zijn moet worden beschouwd als gelijkwaardig aan een verzegeling als bedoeld in het tiende lid.
      De sleutel of sleutels van de sloten van de afsluitinrichtingen moeten overeenkomstig gekenmerkt op een gemakkelijk
      toegankelijke en aangeduide plaats in de machinekamer worden bewaard.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.08
  - number: '8.09'
    text: |-
      1. Het tijdens het bedrijf van een schip vrijkomend oliehoudend water moet aan boord kunnen worden verzameld. In
      dit verband wordt de machinekamerbilge aangemerkt als verzamelruimte.

      2. Voor het verzamelen van afgewerkte olie moeten in de machinekamer(s) één of meer speciaal daarvoor bestemde
      reservoirs zijn aangebracht die ten minste 1,5 keer de hoeveelheid afgewerkte olie uit de carters van alle
      ingebouwde verbrandingsmotoren en tandwielkasten, alsmede de hoeveelheid hydraulische olie afkomstig uit de
      hydraulische olietanks, kunnen bevatten.

      Aansluitingen voor het leeghalen van deze reservoirs moeten voldoen aan de Europese norm EN 1305 : 1996.

      3. Voor schepen die slechts worden ingezet op korte trajecten kan de Commissie van deskundigen ontheffing verlenen
      van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.09
  - number: '8.10'
    text: |-
      1. Het door een varend schip voortgebrachte geluid, in het bijzonder de door het aanzuigen van lucht en door de
      uitlaat van de motoren veroorzaakte geluiden, moet met daartoe geschikte middelen worden gedempt.

      2. Het door een varend schip voortgebrachte geluid mag op 25 m afstand zijdelings van de scheepswand niet meer
      bedragen dan 75 dB(A).

      3. Bij stilliggende schepen mag het geluid, behalve tijdens het laden en lossen, op 25 m afstand zijdelings van de
      scheepswand niet meer bedragen dan 65 dB(A).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.10
  - number: '9.00'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder:

        - *‘interne verbrandingsmotor’:* een energieomzetter, maar geen gasturbine, waarin brandstof wordt verbrand
      in een afgesloten ruimte, zodat uitzettend gas wordt geproduceerd dat direct wordt gebruikt voor het
      leveren van mechanisch vermogen, en waarvoor EU-typegoedkeuring kan worden verleend; ‘motor’ omvat het
      emissiebeheersingssysteem en de communicatie-interface (hardware en berichten) tussen de elektronische regeleenheid
      of -eenheden van het motorsysteem (ECU) en elke andere regeleenheid van de aandrijflijn;
        - *‘typegoedkeuring’:* de beslissing waarbij de bevoegde autoriteit verklaart dat een motortype of een motorfamilie
      wat betreft het niveau van de uitstoot van verontreinigende deeltjes en gassen voldoet aan de desbetreffende
      administratieve bepalingen en technische vereisten;
        - *‘motorfamilie’:* een door de motorfabrikant bepaalde groep van motoren die vanwege hun ontwerp vergelijkbare
      eigenschappen bezitten wat betreft de uitlaatemissie en die aan de geldende emissiegrenswaarden voldoen;
        - *‘referentievermogen’:* het nettovermogen dat wordt gebruikt om toepasselijke emissiegrenswaarden voor de motor
      vast te stellen;
        - *‘motorfabrikant’:* de natuurlijke of rechtspersoon die jegens de goedkeuringsinstantie verantwoordelijk is voor
      alle aspecten van de typegoedkeuring voor motoren, de vergunningsprocedure en de conformiteit van de productie
      van de motor en die tevens verantwoordelijk is voor kwesties met betrekking tot het markttoezicht op de door hem
      geproduceerde motoren, ongeacht of deze direct betrokken is bij alle fasen van het ontwerp en de bouw van de motor
      waarvoor de typegoedkeuring wordt aangevraagd;
        - *‘proces-verbaal van de motorkenmerken ‘:* het document, overeenkomstig bijlage 6, waarin alle parameters, samen
      met de wijzigingen, en met inbegrip van onderdelen en motorinstellingen die een invloed hebben op het emissieniveau
      van verontreinigende gassen en deeltjes door de motor, naar behoren worden geregistreerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.00
  - number: '9.01'
    text: |-
      1. De bepalingen van dit hoofdstuk van toepassing op alle interne verbrandingsmotoren met een referentievermogen
      gelijk aan of groter dan 19 kW die in vaartuigen aan boord zijn geïnstalleerd.

      2. De interne verbrandingsmotoren moeten voldoen aan de vereisten van Verordening (EU) 2016/1628. Er worden alleen
      interne verbrandingsmotoren van de categorieën

      a) IWP,

      b) IWA,

      c) NRE met een referentievermogen van minder dan 560 kW of

      d) motoren die overeenkomstig Verordening (EU) 2016/1628 als gelijkwaardig worden erkend,

      geïnstalleerd. Deze conformiteit wordt aangetoond door middel van een typegoedkeuring.

      3. Een kopie van de typegoedkeuring, alsmede het inlichtingenformulier van de motorfabrikant en het proces-verbaal
      van de motorkenmerken moeten zich aan boord bevinden.

      4. De montage van ruilmotoren, zoals gedefinieerd in Verordening (EU) 2016/1628, is verboden.

      5. De Commissie van deskundigen kan zich voor de vervulling van taken, bedoeld in dit hoofdstuk, doen bijstaan door
      een technische dienst. Alleen technische diensten die zijn aangemeld overeenkomstig Verordening (EU) 2016/1628 zijn
      erkend voor de toepassing van deze standaard.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.01
  - number: '9.02'
    text: |-
      Het identificatienummer, en indien van toepassing het typegoedkeuringsnummer, van alle interne verbrandingsmotoren
      aan boord worden onder nummer 52 van het binnenschipcertificaat vermeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.02
  - number: '9.03'
    text: |-
      De installatie van interne verbrandingsmotoren in vaartuigen dient in overeenstemming te zijn met de beperkingen
      die in de typegoedkeuring zijn uiteengezet.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.03
  - number: '9.04'
    text: |-
      1. In het inlichtingenformulier van de motorfabrikantdat wordt opgesteld door de motorfabrikant worden de
      relevante onderdelen, aanpassingen en parameters gespecificeerd, op grond waarvan kan worden aangenomen dat de
      emissiegrenswaarden voor uitlaatgassen voortdurend worden nageleefd.

      2. De instructies omvatten ten minste de volgende informatie:

      a) motortype en, waar aangewezen, motorfamilie met een indicatie van het referentievermogen en het nominale
      toerental;

      b) lijst met onderdelen en motorparameters die van belang zijn voor de uitlaatgasemissie;

      c) niet te verwarren merktekens om de toegelaten componenten betrekking hebbend op de uitlaatgassen te
      identificeren (bijv. nummers van onderdelen die zich op de componenten bevinden);

      d) vermelding van de motorkenmerken die betrekking hebben op de uitlaatgassen zoals instellingsmogelijkheden
      van het injectiemoment, van de toegelaten temperatuur van het koelwater en van de maximale tegendruk van het
      uitlaatgas.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.04
  - number: '9.05'
    text: |-
      1. Bij gelegenheid van de inbouwkeuring, van de tussentijdse keuring en van de bijzondere keuring verifieert de
      Commissie van deskundigen de feitelijke toestand van de motor met betrekking tot de onderdelen, de ijking en de
      afstellingen van de parameters zoals die in het inlichtingenformulier van de motorfabrikant en in het proces-
      verbaal van de motorkenmerken zijn gespecificeerd.

      2. De resultaten van de keuringen overeenkomstig eerste lid worden geregistreerd in het proces-verbaal van de
      motorkenmerken overeenkomstig bijlage 6.

      3. Indien de inbouwkeuring, de tussentijdse en bijzondere keuringen aantonen dat de aan boord geïnstalleerde
      interne verbrandingsmotoren motoren wat de parameters, onderdelen en aanpasbare kenmerken betreft, voldoen aan de
      specificaties van de in [artikel 9.01, derde lid][ref1], bedoelde documenten, mag worden aangenomen dat de emissies
      van uitlaatgassen en deeltjes van de interne verbrandingsmotoren aan de maximale waarden voldoen.

      Indien de Commissie van deskundigen vindt dat de interne verbrandingsmotor niet in overeenstemming is met de
      vereisten van de in in artikel 9.01, derde lid, bedoelde documenten, wordt geëist dat er maatregelen worden
      getroffen om ervoor te zorgen dat de conformiteit van de motor wordt hersteld.

      4. Bij interne verbrandingsmotoren met uitlaatgasnabehandelingssystemen worden in het kader van de inbouw-,
      tussentijdse of bijzondere keuringen controles uitgevoerd om na te gaan of deze systemen correct functioneren.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel9.01
