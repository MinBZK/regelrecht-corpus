      1 De overgangsbepaling juncto [artikel 3.04, zevende lid][ref23], is een voorschrift van tijdelijke aard en
      is geldig tot en met 31 december 2019. De toepasselijke overgangsbepaling vóór 1 december 2014 luidde als
      volgt: '*‘3.04 lid 7 / Ten hoogste toegestane niveau van de geluidsdruk / V.O., uiterlijk bij verlenging van het'
      binnenschipcertificaat na 1.1.2015’*

      2 De overgangsbepaling juncto [artikel 7.01, tweede lid][ref24], is een voorschrift van tijdelijke aard en is
      geldig tot en met 31 december 2019. De toepasselijke overgangsbepaling vóór 1 december 2014 luidde als volgt:
      *‘7.01 lid 2 / Niveau van de geluidsdruk voortgebracht door het schip / V.O., uiterlijk bij verlenging van het
      binnenschipcertificaat na 1.1.2015’*.

      3 De overgangsbepaling juncto [artikel 8.10, tweede lid][ref25], is een voorschrift van tijdelijke aard en
      is geldig tot en met 31 december 2019. De toepasselijke overgangsbepaling vóór 1 december 2014 luidde als
      volgt: '*‘8.10 lid 2 / Door een varend schip voortgebracht geluid / V.O., uiterlijk bij verlenging van het'
      binnenschipcertificaat na 1.1.2015’*.

      4 De overgangsbepaling juncto [artikel 10.01][ref26] is een voorschrift van tijdelijke aard en is geldig tot en
      met 31 december 2019. De toepasselijke overgangsbepaling vóór 1 december 2014 luidde als volgt: *‘10.01 / Eisen aan
      elektrische installaties / V.O., uiterlijk bij verlenging van het binnenschipcertificaat na 1.1.2015’*.

      5 *“15.02 lid 5 / Geluidshinder en trillingen in verblijven / Verlenging van het binnenschipcertificaat na
      1.1.2015“*.

      3. [Artikel 19.11, derde lid, eerste volzin en zesde lid][ref27], is op schepen voor dagtochten, waarvan de kiel
      is gelegd op 1 april 1976 of daarvóór, tot aan de eerste verlenging van het binnenschipcertificaat ná 1 januari
      2045 slechts met dien verstande van toepassing dat slechts de verven, lakken en andere behandelingsmiddelen voor
      interieurs, gebruikt voor de naar de vluchtwegen toegekeerde oppervlakken, moeilijk ontvlambaar moeten zijn en rook
      en andere giftige gassen niet in gevaarlijke mate kunnen ontstaan.

      4. [Artikel 19.11, twaalfde lid][ref28], is op schepen voor dagtochten, waarvan de kiel is gelegd op 1 april
      1976 of daarvóór, tot aan de eerste verlenging van het binnenschipcertificaat ná 1 januari 2045 slechts met dien
      verstande van toepassing dat het voldoende is wanneer, in plaats van de dragende constructie vervaardigd van staal
      van trappen die als vluchtweg dienen, deze trappen zo zijn uitgevoerd dat zij in geval van brand ongeveer even lang
      bruikbaar blijven als trappen met een dragende constructie van staal.


