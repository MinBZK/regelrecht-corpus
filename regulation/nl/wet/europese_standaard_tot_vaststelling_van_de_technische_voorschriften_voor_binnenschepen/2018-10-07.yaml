  - number: '10.21'
    text: |-
      Elektrische en elektronische installaties mogen niet door elektromagnetische verstoringen in hun functioneren
      worden gehinderd. Algemene maatregelen dienen betrekking te hebben op:

      a) de ontkoppeling van de overdrachtswegen tussen de storingsbron en het aan storing blootstaande apparaat;

      b) het onderdrukken van de stooroorzaken van de storingsbron;

      c) de vermindering van de stoorgevoeligheid van het aan storing blootstaande apparaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.21
  - number: '13.01'
    text: |-
      1. Schepen die voor het vervoer van goederen zijn bestemd, met uitzondering van zeeschipbakken met een lengte *L*
      van ten hoogste 40 m, moeten zijn uitgerust met boegankers, waarvan de totale massa *P* wordt berekend met behulp
      van de volgende formule:

      *P* = *k* • *B* • *T* [*kg*]

      In deze formule betekent:

      *k*: een coëfficiënt die rekening houdt met de verhouding tussen de lengte *L* en de breedte *B* en met het soort
      vaartuig:

      Voor duwbakken wordt *k* gelijkgesteld aan *c*;

      *c* een ervaringscoëfficiënt overeenkomstig de volgende tabel:








                      Laadvermogen [t]


                      Ervaringscoëfficiënt c






                      tot en met 400


                      45




                      400 tot en met 650


                      55




                      650 tot en met 1.000


                      65




                      meer dan 1.000


                      70






      De Commissie van deskundigen kan toestaan dat op schepen met een laadvermogen van ten hoogste 400 t, die vanwege
      hun constructie en bestemming slechts op bepaalde korte riviergedeelten worden ingezet, voor de boegankers slechts
      2/3 van de totale massa *P* vereist is.

      2. a) Passagiersschepen en schepen die niet bestemd zijn voor goederenvervoer, met uitzondering van duwboten,
      moeten zijn uitgerust met boegankers waarvan de totale massa *P* volgens de volgende formule wordt berekend:

      *P* • *k* • *B* • *T* [*kg*]

      b) In afwijking van onderdeel a en rekening houdend met de in de lidstaten geldende politievoorschriften op sommige
      gedeelten van het vaarwater, voor passagiersschepen waarvoor de totale massa *P* van de boegankers is berekend
      volgens de volgende formule, moet in het binnenschipcertificaat onder nummer 52 worden vermeld dat de totale massa
      van de boegankers voldoet aan de voorschriften van artikel 13.01, tweede lid, onderdeel b:

      *P* • *k* • *B* • *T* + 4 *A* [*kg*]

      In deze formules betekent:

      *k* de coëfficiënt als bedoeld in het eerste lid; bij het vaststellen van de ervaringscoëfficiënt *c* moet evenwel
      de in het binnenschipcertificaat vermelde waterverplaatsing in m3 in plaats van het laadvermogen in aanmerking
      worden genomen;

      *A*  het frontale windvangend oppervlak in m2.

      3. Schepen als bedoeld in lid 1 waarvan de grootste lengte *L* 86 m of minder bedraagt, moeten zijn uitgerust met
      hekankers waarvan de totale massa 25% bedraagt van de massa *P*.

      Schepen waarvan de grootste lengte *L* meer dan 86 m bedraagt, moeten echter zijn uitgerust met hekankers waarvan
      de totale massa 50% bedraagt van de massa *P* als bedoeld in het eerste of het tweede lid.

      Geen hekankers behoeven te hebben:

      a) schepen waarvoor de totale massa van de hekankers minder dan 150 kg zou bedragen; voor schepen als bedoeld in
      het eerste lid, laatste alinea, moet daarbij worden uitgegaan van de gereduceerde massa van het boeganker;

      b) duwbakken.

      4. Schepen die zijn bestemd voor het voortbewegen van hechte samenstellen met een lengte *L* van niet meer dan
      86 m moeten zijn uitgerust met hekankers waarvan de totale massa 25% bedraagt van de grootste massa *P* die
      overeenkomstig het eerste lid wordt berekend voor de in het binnenschipcertificaat toegestane samenstellingen (als
      nautische eenheid beschouwd).

      Schepen die zijn bestemd voor het voortbewegen in afvaart van hechte samenstellen met een lengte *L* van meer
      dan 86 m moeten zijn uitgerust met hekankers waarvan de totale massa 50% bedraagt van de grootste massa *P* die
      overeenkomstig het eerste lid wordt berekend voor de in het binnenschipcertificaat toegestane samenstellingen (als
      nautische eenheid beschouwd).

      5. De volgens het eerste tot en met het vierde lid berekende massa's van de ankers mogen bij bepaalde bijzondere
      ankers worden verminderd.

      6. De voor boegankers voorgeschreven totale massa *P* kan worden verdeeld over één of twee ankers. De totale massa
      mag 15% minder zijn, indien het schip slechts met één boeganker is uitgerust en de ankerkluis zich op hart schip
      bevindt.

      De voor hekankers voorgeschreven totale massa *P* mag bij duwboten en schepen met een lengte *L* van meer dan 86 m
      worden verdeeld over één of twee ankers.

      De massa van het lichtste anker mag niet minder dan 45% van deze totale massa bedragen.

      7. Gietijzeren ankers zijn niet toegelaten.

      8. Op ieder anker moet de massa duurzaam in letters en cijfers in reliëf zijn aangegeven.

      9. Voor ankers met een massa van meer dan 50 kg zijn ankerlieren vereist.

      10. Boegankerkettingen moeten ten minste de volgende lengte hebben:

      a) 40 m voor schepen met een lengte *L* van 30 m of minder;

      b) 10 m meer dan de lengte *L* van het schip, wanneer deze tussen 30 en 50 m ligt;

      c) 60 m voor schepen met een lengte *L* van meer dan 50 m.

      De kettingen van de hekankers moeten ten minste 40 m lang zijn. Schepen die kop vóór moeten kunnen stoppen, moeten
      evenwel hekankerkettingen van ten minste 60 m lengte hebben.

      11. De minimumbreeksterkte *R* van een ankerketting wordt met behulp van de volgende formules berekend:

      a) bij ankers met een massa tot en met 500 kg:

      *R* = 0,35 • *P'* [*kN*]

      b) bij ankers met een massa van meer dan 500 t/m 2.000 kg:

      c) bij ankers met een massa van meer dan 2.000 kg:

      *R* = 0,25 • *P'* [*kN*]

      In deze formules betekent:

      *P'*: de overeenkomstig het eerste tot en met het vierde lid en het zesde lid bepaalde theoretische massa van het
      betreffende anker.

      De breeksterkte van de ankerkettingen wordt bepaald aan de hand van de daarvoor in een van de lidstaten geldende
      normen.

      12. Indien zwaardere ankers worden gekozen dan in het eerste tot en met het zesde lid beschreven, wordt de
      minimumbreeksterkte van de ankerketting bepaald aan de hand van de gegeven grotere massa.

      Indien dergelijke zwaardere ankers en de bijbehorende sterkere ankerkettingen aan boord zijn, moeten desondanks in
      het binnenschipcertificaat de massa's en de minimumbreeksterkte worden ingevuld die zijn voorgeschreven op grond
      van het eerste tot en met zesde lid en het elfde lid.

      13. De verbindingsdelen (wartels) tussen het anker en de ketting moeten bestand zijn tegen een trekkracht die 20%
      groter is dan de breeksterkte van de dienovereenkomstige ketting.

      14. Het gebruik van trossen of kabels in plaats van kettingen is toegestaan. Deze moeten dezelfde breeksterkte
      hebben die voor de kettingen is voorgeschreven, maar hun lengte moet 20% meer bedragen.
