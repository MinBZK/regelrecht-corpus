             1 De vaartuigen moeten echter uiterlijk bij verlenging van het binnenvaartcertificaat na 1.1.2015 aan de
      volgende eisen voldoen: - – Buitenkanten van de dekken en de werkplekken, waarbij de valhoogte meer dan 1 m kan
      bedragen, zijn voorzien van een verschansing of den van elk ten minste 0,70 m hoogte of van relingen die voldoen
      aan de Europese norm EN 711 : 1995, die bestaan uit een handreling een tussenroede op kniehoogte en een voetlijst.
        - - Bij gangboorden moet een voetlijst en een doorlopende handreling aan de denneboom zijn aangebracht. De
      handreling aan de dennenboom kan achterwege worden gelaten, indien het gangboord voorzien is van een niet
      neerklapbare reling. 2 Dit artikel geldt voor schepen waarvan de kiel is gelegd ná 31.12.1994 en voor in bedrijf
      zijnde schepen met in acht name van het volgende: - Bij vernieuwingswerkzaamheden, het gehele laadruim omvattend,
      is [artikel 14.04][ref79] van toepassing. Bij een verbouwing, die de totale lengte van de gangboorden omvat en
      waardoor de vrije breedte van het gangboord wordt gewijzigd:
        - a) is artikel 14.04 van toepassing, indien de vóór de verbouwing beschikbare vrije breedte van het gangboord tot
      een hoogte van 0,90 m, of de vrije breedte daarboven, moet worden verminderd;
        - b) mag de vóór de verbouwing beschikbare vrije breedte van het gangboord tot een hoogte van 0,90 m, of de vrije
      breedte daarboven, niet worden verminderd, indien deze afmetingen kleiner zijn dan die bedoeld in artikel 14.04. 3
      MSC.61(67) aangenomen op 5 december 1996 – Internationale Code voor brandtestprocedures.


