    text: |-
      1. a) [Artikel 3.03, eerste en tweede lid][ref1], is van overeenkomstige toepassing;

      b) [artikel 7.02][ref2] is van overeenkomstige toepassing;

      c) de ten hoogste toegelaten niveaus van de geluidsdruk als bedoeld in [artikel 15.02, vijfde lid][ref3], tweede
      alinea, mogen worden overschreden wanneer de werkinrichtingen in bedrijf zijn en voor zover er dan niet aan boord
      wordt overnacht;

      d) De Commissie van deskundigen kan van de toepassing van de overige bepalingen met betrekking tot de bouw,
      inrichting en uitrusting afwijkingen toelaten, voor zover in het elke geval een zelfde mate van veiligheid is
      aangetoond.

      2. De Commissie van deskundigen kan afzien van de toepassing van de volgende bepalingen:

      a) [artikel 13.01, eerste lid][ref4], wanneer het drijvende werktuig veilig kan worden verankerd terwijl de
      werkinrichtingen in bedrijf zijn, bijvoorbeeld door middel van werkankers of palen. Een drijvend werktuig met eigen
      mechanische middelen tot voortbeweging moet echter ten minste één anker hebben als bedoeld in artikel 13.01, eerste
      lid, waarbij de coëfficiënt *k* = 45 en voor *T* gelijk aan holte *H*;

      b) [artikel 15.02, eerste lid][ref5], tweede gedeelte van de zin, wanneer de ruimten voldoende elektrisch kunnen
      worden verlicht.

      3. Bovendien geldt:

      a) in afwijking van [artikel 8.08, tweede lid, tweede volzin][ref6], de lenspomp moet mechanisch worden
      aangedreven;

      b) in afwijking van [artikel 8.10, derde lid][ref7], bij stilliggende drijvende werktuigen mag het geluid wanneer
      de werkinrichtingen in bedrijf zijn op 25 m afstand zijdelings van de scheepshuid meer bedragen dan 65 dB(A);

      c) in afwijking van [artikel 13.03, eerste lid][ref8], bij vrij op het dek staande werktuigen moet ten minste één
      extra draagbaar blustoestel aanwezig zijn;

      d) in afwijking van [artikel 17.02, tweede lid][ref9], naast vloeibaargasinstallaties voor huishoudelijk gebruik
      mogen ook andere vloeibaargasinstallaties aanwezig zijn. Deze installaties met toebehoren moeten voldoen aan de
      voorschriften van een van de lidstaten.


