  - number: '4.06'
    text: |-
      1. Elk schip waarvan de diepgang meer dan 1 m kan bereiken moet aan het achterschip aan iedere zijde van een
      diepgangsschaal zijn voorzien; aanvullende diepgangsschalen zijn toegestaan.

      2. Het nulpunt van iedere diepgangsschaal moet loodrecht daaronder liggen in een vlak evenwijdig aan het vlak van
      de grootste inzinking, dat door het laagste punt van de scheepsromp gaat of van de kiel, wanneer deze aanwezig
      is. De afstand loodrecht boven het nulpunt moet in decimeters zijn ingedeeld. Deze indeling moet vanaf het vlak
      voor de waterlijn bij ledig schip tot 100 mm boven het vlak van de grootste inzinking op iedere diepgangsschaal
      door ingehakte of ingeslagen merken zijn aangebracht. Deze indeling moet voorts in de vorm van goed zichtbare,
      afwisselend in twee verschillende kleuren geschilderde stroken zijn aangeduid. De indeling moet naast de schaal ten
      minste bij elke 5 decimeter, alsmede aan het boveneinde, door cijfers zijn aangegeven.

      3. De twee achterste ijkschalen, die met toepassing van het in [artikel 4.04, lid 7][ref1], genoemde verdrag
      zijn aangebracht, kunnen als diepgangsschalen dienstdoen, mits zij overeenkomstig bovenstaande voorschriften zijn
      ingedeeld; in voorkomend geval moeten de cijfers voor de diepgang zijn toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4.04
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4.04'
        hoofdstuk: '4'
  - number: '4.07'
    text: |-
      1. In afwijking van [artikel 4.01, leden 1 en 2][ref1], wordt de veiligheidsafstand voor schepen die op de
      binnenwateren van zone 4 varen, voor deuren en ander openingen zoals de luiken van de vrachtruimen als volgt
      verminderd:

      a) wanneer ze spatwater- en regendicht kunnen worden afgesloten tot 150 mm;

      b) wanneer ze niet spatwater- en regendicht kunnen worden afgesloten tot 200 mm.

      2. In afwijking van [artikel 4.02][ref2] bedraagt het kleinste vrijboord voor schepen die op de binnenwateren van
      zone 4 varen, 0 mm, wanneer de veiligheidsafstand van lid 1 wordt aangehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4.01
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel4.02
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel4.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4.01'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '4.02'
        hoofdstuk: '4'
  - number: '5.01'
    text: |-
      1. Schepen en samenstellen moeten over voldoende vaar- en manoeuvreereigenschappen beschikken.

      2. Schepen zonder eigen mechanische middelen tot voortbeweging die bestemd zijn om gesleept te worden, moeten
      voldoen aan de bijzondere eisen van de Commissie van deskundigen.

      3. Schepen met eigen mechanische middelen tot voortbeweging en samenstellen moeten voldoen aan de
      [artikelen 5.02 tot en met 5.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5.02
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5.02'
        hoofdstuk: '5'
  - number: '5.02'
    text: |-
      1. De vaar- en manoeuvreereigenschappen dienen door proefvaarten te worden aangetoond. Daarbij dient met name te
      worden vastgesteld of is voldaan aan de eisen van de [artikelen 5.06 tot en met 5.10][ref1].

      2. De Commissie van deskundigen kan geheel of gedeeltelijk afzien van proefvaarten, wanneer op andere wijze wordt
      aangetoond dat aan de eisen wat betreft vaar- en manoeuvreereigenschappen wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5.06
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5.06'
        hoofdstuk: '5'
  - number: '5.03'
    text: |-
      1. De in [artikel 5.02][ref1] bedoelde proefvaarten dienen in de door de bevoegde instanties aangewezen vakken van
      binnenwateren te worden uitgevoerd.

      2. Deze proefvaarttrajecten moeten zich bevinden in zo recht mogelijke vakken met een lengte van ten minste 2 km
      en voldoende breedte in stromend of stil water en moeten zijn voorzien van duidelijk herkenbare markeringen om de
      positie van het schip vast te kunnen stellen.

      3. De hydrologische gegevens, zoals waterdiepte, vaarwaterbreedte en gemiddelde stroomsnelheid in het vaarwater bij
      verschillende waterstanden moeten door de Commissie van deskundigen kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5.02
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5.02'
        hoofdstuk: '5'
  - number: '5.04'
    text: |-
      Schepen en samenstellen die bestemd zijn voor het vervoer van goederen moeten voor de proefvaarten zo mogelijk
      gelijklastig en ten minste voor 70% zijn beladen. Wanneer de proefvaart met minder lading wordt uitgevoerd, moet de
      toelating voor wat betreft de afvaart tot deze belading worden beperkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.04
  - number: '5.05'
    text: |-
      1. Bij de proefvaarten mogen geen ankers worden gebruikt, maar wel alle in het binnenschipcertificaat onder nummers
      34 en 52 ingevulde inrichtingen die vanuit de stuurstelling te bedienen zijn.

      2. Bij opdraaimanoeuvres als bedoeld in [artikel 5.10][ref1] mogen echter de boegankers worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5.10
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.05
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5.10'
        hoofdstuk: '5'
  - number: '5.06'
    text: |-
      1. Schepen en samenstellen moeten een snelheid ten opzichte van het water van ten minste 13 km/u kunnen bereiken.
      Dit geldt niet voor duwboten indien zij alleen varen.

      2. Voor schepen en samenstellen die slechts op de reden en in de havens varen kan de Commissie van deskundigen
      afwijkingen toestaan.

      3. De Commissie van deskundigen gaat na of het vaartuig in onbeladen toestand een snelheid ten opzichte van het
      water van 40 km/u kan overschrijden. Is dit het geval, dan moet in het binnenschipcertificaat onder nummer 52
      worden vermeld:

      ‘Het vaartuig is in staat een snelheid van 40 km/u

      ten opzichte van het water te overschrijden.’
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.06
  - number: '5.07'
    text: |-
      1. Schepen en samenstellen moeten tijdig kop vóór kunnen stilhouden en moeten tegelijkertijd voldoende bestuurbaar
      blijven.

      2. Bij schepen en samenstellen met een lengte *L* van 86 m of minder en een breedte *B* van 22,90 m of minder
      kunnen deze stopeigenschappen worden vervangen door de keereigenschappen.

      3. De stopeigenschappen dienen door stopmanoeuvres op een der in [artikel 5.03][ref1] bedoelde proefvaartvakken en
      de keereigenschappen door opdraaimanoeuvres als bedoeld in [artikel 5.10][ref2] te worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5.03
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel5.10
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5.03'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '5.10'
        hoofdstuk: '5'
  - number: '5.08'
    text: |-
      Wanneer de in [artikel 5.07][ref1] genoemde noodzakelijke stopmanoeuvre in stilstaand water wordt uitgevoerd, dient
      tevens een achteruitvaarproef te worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5.07
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.08
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5.07'
        hoofdstuk: '5'
  - number: '5.09'
    text: |-
      Schepen en samenstellen moeten tijdig kunnen uitwijken. De uitwijkeigenschappen dienen te worden aangetoond door
      uitwijkmanoeuvres op één der in [artikel 5.03][ref1] bedoelde proefvaartvakken.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5.03
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5.03'
        hoofdstuk: '5'
  - number: '5.10'
    text: |-
      Schepen en samenstellen met een lengte *L* van 86 m of minder en een breedte *B* van 22,90 m of minder moeten
      tijdig kunnen keren.

      Deze keereigenschappen kunnen door de in [artikel 5.07][ref1] bedoelde stopeigenschappen worden vervangen.

      De keereigenschappen dienen door opdraaimanoeuvres te worden aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5.07
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel5.10
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5.07'
        hoofdstuk: '5'
  - number: '6.01'
    text: |-
      1. Schepen moeten zijn voorzien van een betrouwbaar werkende stuurinrichting waarmee ten minste de in
      [hoofdstuk 5][ref1] bedoelde manoeuvreereigenschappen worden bereikt.

      2. Werktuiglijk aangedreven stuurinrichtingen moeten zodanig zijn uitgevoerd dat het roer niet onvoorzien van stand
      kan veranderen.

      3. De gehele stuurinrichting moet voor een permanente slagzij van het schip tot 15° en omgevingstemperaturen van –
      20 °C tot + 50 °C geschikt zijn.

      4. De afzonderlijke onderdelen van de stuurinrichting moeten qua sterkte zodanig zijn geconstrueerd dat alle
      onder normale omstandigheden daarop inwerkende krachten goed kunnen worden opgenomen. De van buitenaf op het roer
      inwerkende krachten mogen het functioneren van de stuurmachine en zijn aandrijving niet beïnvloeden.

      5. Stuurinrichtingen moeten een mechanisch aangedreven stuurmachine hebben, wanneer de voor de bediening van het
      roer te leveren krachten dit vereisen.

      6. Stuurmachines met een mechanische aandrijving moeten een beveiliging tegen overbelasting hebben die het door de
      aandrijving uitgeoefende koppel begrenst.

      7. Asdoorvoeringen van roerkoningen moeten zodanig zijn uitgevoerd dat geen waterverontreinigende smeermiddelen
      naar buiten kunnen treden.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '5'
  - number: '6.02'
    text: |-
      1. Bij stuurmachines met mechanische aandrijving moet een tweede onafhankelijke aandrijving of handaandrijving
      beschikbaar zijn. In geval van uitval of storing van de aandrijving moet de tweede onafhankelijke aandrijving of
      handaandrijving binnen 5 seconden in werking kunnen worden gesteld.

      2. Wanneer het inschakelen van de tweede aandrijving of van de handaandrijving niet automatisch geschiedt, moet de
      roerganger deze met één enkele handeling onmiddellijk, snel en eenvoudig kunnen inschakelen.

      3. Ook wanneer de tweede aandrijving of de handaandrijving in werking is, moeten de in [hoofdstuk 5][ref1] bedoelde
      manoeuvreereigenschappen kunnen worden gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '5'
  - number: '6.03'
    text: |-
      1. Op de hydraulische aandrijfinstallatie van de stuurmachine mogen geen andere verbruikers zijn aangesloten.

      2. De hydraulische tanks dienen te zijn uitgerust met een niveaualarmsysteem, dat het dalen van het olieniveau
      beneden de voor het veilig kunnen functioneren laagst toegestane stand controleert.

      3. De afmetingen, constructie en plaatsing van de pijpleidingen moeten beschadigingen door mechanische invloeden of
      vuur zoveel mogelijk uitsluiten.

      4. Hydraulische slangen

      a) zijn alleen toegelaten indien de trillingsabsorptie of de bewegingsvrijheid van onderdelen hun gebruik
      onvermijdelijk maken;

      b) moeten ontworpen zijn om ten minste de hoogst toegelaten werkdruk aan te kunnen, en

      c) moeten ten laatste na acht jaar worden vernieuwd.

      5. Hydraulische cilinders, hydraulische pompen en hydraulische en elektrische motoren moeten ten minste om de acht
      jaar door een gespecialiseerde firma worden onderzocht en indien nodig hersteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.03
  - number: '6.04'
    text: |-
      1. Stuurinrichtingen met twee mechanische aandrijvingen moeten beschikken over twee energiebronnen.

      2. Wanneer de tweede energiebron van een stuurmachine met mechanische aandrijving tijdens de vaart niet continu kan
      worden gebruikt, moet de voor het starten daarvan benodigde tijd door een buffersysteem van voldoende capaciteit
      worden overbrugd.

      3. Bij elektrische energiebronnen mogen uit de toevoer van de stuurinrichtingen geen andere verbruikers worden
      gevoed.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.04
  - number: '6.05'
    text: |-
      1. Het handstuurwiel mag niet meegedraaid kunnen worden door een mechanische aandrijving.

      2. Terugslag van het stuurwiel moet bij automatisch inschakelen van de handaandrijving bij iedere stand van het
      roer zijn verhinderd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.05
  - number: '6.06'
    text: |-
      1. Indien bij roerpropeller-, waterstraal-, cycloïdaalschroef- en boegschroefinstallaties de afstandsbediening
      voor de verandering van de richting van de stuwkracht elektrisch, hydraulisch of pneumatisch is, dan moeten vanaf
      de stuurstelling tot de propeller- of straalinstallatie twee van elkaar onafhankelijke besturingssystemen aanwezig
      zijn die, mutatis mutandis, voldoen aan de in de [artikelen 6.01 tot en met 6.05][ref1] genoemde eisen.

      Dit is niet van toepassing indien het gebruik van dergelijke installaties niet noodzakelijk is om te kunnen voldoen
      aan de manoeuvreereigenschappen bedoeld in [hoofdstuk 5][ref2], dan wel uitsluitend voor de stopproef.

      2. Indien twee of meer van elkaar onafhankelijke roerpropeller-, waterstraal- of cycloïdaalschroefinstallaties
      aanwezig zijn, is het tweede besturingssysteem niet vereist indien het schip bij het uitvallen van één van deze
      installaties manoeuvreerbaar blijft overeenkomstig [hoofdstuk 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6.01
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6.01'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0041395
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0041395
        hoofdstuk: '5'
  - number: '6.07'
    text: |-
      1. De stand van het roer moet bij de stuurstelling duidelijk zichtbaar zijn. Elektrische roerstandaanwijzers moeten
      een eigen voeding hebben.

      2. De stuurstelling moet voorzien zijn van een optisch en akoestisch alarm om de volgende zaken te signaleren:

      a) daling van het oliepeil van de hydraulische tanks onder het in [artikel 6.03, lid 2][ref1], bepaalde laagste
      peil en daling van de werkdruk van het hydraulische systeem;

      b) het uitvallen van de voeding van de elektrische besturingsenergie;

      c) het uitvallen van de voeding van de elektrische energie ten behoeve van de aandrijving;

      d) het uitvallen van de stuurautomaat;

      e) het uitvallen van de voorgeschreven buffersystemen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6.03
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6.03'
        hoofdstuk: '6'
  - number: '6.08'
    text: |-
      1. Stuurautomaten en de onderdelen daarvan moeten voldoen aan [artikel 10.20][ref1].

      2. Een groen lampje in de stuurstelling moet aangeven dat de stuurautomaat voor gebruik gereed is.

      Uitval, ontoelaatbare afwijkingen van de voedingsspanning en ontoelaatbare daling van de rotatiefrequentie van de
      gyroscoop moeten worden gecontroleerd.

      3. Wanneer er naast de stuurautomaat nog andere besturingssystemen aanwezig zijn, moet bij de stuurstelling
      duidelijk te zien zijn welk systeem is ingeschakeld. De omschakeling van het ene systeem naar het andere
      moet onmiddellijk kunnen geschieden. Storingen van stuurautomaten mogen het betrouwbaar functioneren van de
      stuurinrichting niet kunnen beïnvloeden.

      4. De voeding van de elektrische energie van de stuurautomaat moet onafhankelijk zijn van andere verbruikers.

      5. De in stuurautomaten gebruikte gyroscopen, sensoren of bochtaanwijzers moeten aan de eisen van bijlage 5,
      onderdeel II, voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel10.20
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.08
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '10.20'
        hoofdstuk: '10'
  - number: '6.09'
    text: |-
      1. De correcte installatie van de stuurinrichting dient door een Commissie van deskundigen te worden gekeurd.
      Daartoe kan de Commissie van deskundigen om de volgende documenten vragen:

      a) beschrijving van de stuurinrichting;

      b) tekeningen en gegevens over de aandrijvingen van de stuurmachine en de besturing;

      c) gegevens over de stuurmachine;

      d) schakelschema voor de elektrische installatie;

      e) beschrijving van de stuurautomaat;

      f) aanwijzingen voor gebruik en onderhoud van de installatie.

      2. Bij een proefvaart dient de werking van de stuurinrichting als geheel te worden gekeurd. Bij stuurautomaten
      dient te worden getest of op veilige wijze een rechte koers wordt gehouden en of op veilige wijze in bochten wordt
      gevaren.

      3. Stuurmachines met mechanische aandrijving moeten door een deskundige worden gekeurd:

      a) vóór ingebruikstelling;

      b) na een defect;

      c) na verandering of reparatie;

      d) met regelmaat ten minste elke drie jaar.

      4. De keuring omvat ten minste:

      a) een controle van de overeenstemming met de goedgekeurde tekeningen en bij periodieke keuringen, controle of de
      stuurinrichting wijzigingen heeft ondergaan;

      b) een functionele test van de stuurinrichting voor alle operationele functies;

      c) visuele controle en dichtheidscontrole van de hydraulische componenten, in het bijzonder kleppen, pijpleidingen,
      hydraulische leidingen, hydraulische cilinders, hydraulische pompen en hydraulische filters;

      d) visuele controle van de elektrische onderdelen, in het bijzonder relais, elektrische motoren en
      veiligheidsapparaten;

      e) controle van de optische en akoestische controleapparaten.

      5. Inzake de keuring moet een door de deskundige ondertekende verklaring worden opgesteld waaruit de datum van de
      keuring blijkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel6.09
  - number: '7.01'
    text: |-
      1. Stuurhuizen moeten zodanig zijn ingericht dat de roerganger zijn werkzaamheden tijdens de vaart te allen tijde
      kan verrichten.

      2. Tijdens het normale bedrijf van het schip mag het niveau van de geluidsdruk voortgebracht door het schip bij de
      stuurstelling ter hoogte van het hoofd van de roerganger niet hoger zijn dan 70 dB(A).

      3. Bij éénmansstuurstellingen voor het varen op radar moet de roerganger zijn werkzaamheden zittend kunnen
      verrichten en moeten alle voor het voeren van het schip noodzakelijke signalerings- en controle-instrumenten en de
      bedieningsapparatuur zodanig zijn gerangschikt dat de roerganger ze tijdens de vaart gemakkelijk kan observeren en
      bedienen zonder daarbij zijn plaats te hoeven verlaten en zonder het radarbeeld uit het oog te verliezen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.01
  - number: '7.02'
    text: |-
      1. Het uitzicht vanaf de stuurstelling moet naar alle zijden voldoende vrij zijn.

      2. De dode hoek voor de boeg van het lege schip met halve voorraden en zonder ballast mag voor de roerganger niet
      meer dan 250 m zijn.

      Om de dode hoek nog verder te verkleinen mogen alleen geschikte hulpmiddelen worden gebruikt.

      Bij het onderzoek mogen deze hulpmiddelen niet in aanmerking worden genomen.

      3. Het vrije gezichtsveld vanaf de plaats waar de roerganger zich gewoonlijk bevindt moet ten minste 240° van de
      horizon bedragen. Daarvan moet een gezichtsveld van ten minste 140° binnen de voorste halve cirkel liggen.

      In de normale zichtas van de roerganger mogen zich geen vensterstijlen, steunen of opbouwen bevinden.

      Indien, ook in het geval van een vrij gezichtsveld van 240° of meer, geen voldoende vrij uitzicht naar achteren
      gewaarborgd is, kan de Commissie van deskundigen andere maatregelen eisen, zoals de inbouw van geschikte
      hulpmiddelen.

      De hoogte van de onderrand van de zijvensters moet zo laag mogelijk en de hoogte van de bovenrand van de zij- en
      achtervensters moet zo hoog mogelijk worden gehouden.

      Bij de vaststelling of aan de bepalingen van dit artikel inzake het gezichtsveld vanuit het stuurhuis is voldaan,
      wordt ervan uitgegaan dat de ooghoogte van de roerganger zich op 1,65 m boven de vloer van het stuurhuis bevindt.

      4. De bovenrand van het boegvenster van het stuurhuis moet voldoende hoog zijn om de roerganger een vrij zichtveld
      naar voren te bieden.

      Aan dit voorschrift wordt in elk geval voldaan indien een persoon op de stuurstelling met een ooghoogte van 1,80 m
      een vrij gezichtsveld heeft tot op ten minste 10° boven het horizontale vlak op ooghoogte.

      5. Door adequate middelen moet zijn gewaarborgd dat onder alle weersomstandigheden door de voorruiten helder zicht
      mogelijk is.

      6. In stuurhuizen gebruikte ruiten moeten vervaardigd zijn van veiligheidsglas en een minimale lichtdoorlatendheid
      van 75% hebben.

      Om lichtweerkaatsing te voorkomen zijn de voorruiten van het stuurhuis ontspiegeld of zijn ze zo geplaatst dat
      weerkaatsingen effectief uitgesloten zijn.

      Aan het voorschrift van de tweede volzin wordt in elk geval voldaan indien de ruiten schuin ingezet zijn en zij
      naar voren toe met de bovenkant van het venster een hoek van minimaal 10° en maximaal 25° met de loodlijn maken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.02
  - number: '7.03'
    text: |-
      1. De voor het voeren van een schip noodzakelijke bedieningsapparatuur moet gemakkelijk kunnen worden bediend. De
      stand waarin zij zijn gebracht, moet duidelijk herkenbaar zijn.

      2. Controle-instrumenten moeten gemakkelijk kunnen worden afgelezen; zij moeten traploos regelbaar kunnen worden
      verlicht. Lichtbronnen mogen niet storen of de zichtbaarheid van de controle-instrumenten hinderen.

      3. Er moet een inrichting voor het controleren van de signaallampjes aanwezig zijn.

      4. Of een inrichting in werking is, moet duidelijk zichtbaar zijn. Wanneer dit door een signaallampje wordt
      aangegeven, moet dit groen zijn.

      5. Storingen of het uitvallen van inrichtingen waarvan controle verplicht is, dienen door rode signaallampjes te
      worden aangegeven.

      6. Wanneer één van de rode signaallampjes gaat branden, moet een akoestisch signaal klinken. Voor de verschillende
      lampjes kan hetzelfde akoestische alarmsignaal worden gegeven. Het geluidsniveau van dit signaal moet ten minste 3
      dB(A) meer bedragen dan het maximaal heersende geluidsniveau ter plaatse van de stuurstelling.

      7. Het akoestische signaal moet kunnen worden uitgezet na het constateren van het uitvallen of van de storing. Dit
      mag geen nadelige invloed hebben op het functioneren van het signaal voor andere storingen. De rode signaallampjes
      mogen echter pas na het verhelpen van de storing uitgaan.

      8. De signalerings- en controle-instrumenten moeten bij het uitvallen van de voeding automatisch op een andere
      energiebron worden geschakeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.03
  - number: '7.04'
    text: |-
      1. De bediening en de controle van de voortstuwingsmotoren en van de stuurinrichtingen moet vanaf de stuurstelling
      mogelijk zijn. Voortstuwingsmotoren die zijn voorzien van een vanaf de stuurstelling bedienbare koppeling, of die
      een vanaf de stuurstelling bedienbare verstelbare schroef aandrijven, hoeven slechts in de machinekamer aan- en
      uitgezet te kunnen worden.

      2. De bediening van elke voortstuwingsmotor moet kunnen geschieden door één enkele hefboom. De hefboom moet
      volgens een cirkelboog in een verticaal vlak dat nagenoeg evenwijdig is aan de lengteas van het schip kunnen
      worden bewogen. Het verplaatsen van deze hefboom in de richting van het voorschip moet het schip vooruit doen
      varen, terwijl verplaatsing van de hefboom in de richting van het achterschip het schip achteruit doet varen. Aan
      weerszijden van de nulstand van de hefboom vindt het koppelen of omkeren plaats. In de nulstand moet de hefboom
      vanzelf blijven staan.

      3. De richting van de door de aandrijving op het schip werkende stuwingskracht alsmede het toerental van de
      schroeven of stuwingsmotoren moet worden aangegeven.

      4. De in de [artikelen 6.07, tweede lid][ref1], [8.03, tweede lid][ref2], en [8.05, dertiende lid][ref3],
      voorgeschreven signalerings- en controle-instrumenten moeten in de stuurstelling zijn aangebracht.

      5. Bij éénmansstuurstellingen voor het varen op radar moet de besturing van het schip plaats vinden door middel
      van een hefboom. Deze hefboom moet gemakkelijk met de hand bediend kunnen worden. De hoek van de hefboom moet
      overeenkomen met de stand van de roerbladen ten opzichte van de lengteas van het schip. De hefboom moet in
      onverschillig welke positie kunnen worden losgelaten, zonder dat dan de stand van de roerbladen verandert. De
      nulstand van de hefboom moet duidelijk voelbaar zijn.

      6. Wanneer het schip is voorzien van koproeren of bijzondere roeren (bijv. voor achteruitvaren), moeten deze bij
      éénmansstuurstellingen voor het varen op radar kunnen worden bediend door speciale hefbomen die, mutatis mutandis,
      aan de in het vijfde lid genoemde toepasselijke eisen voldoen.

      Dit geldt ook wanneer bij samenstellen de roerinstallaties van andere vaartuigen dan het voor het voeren van het
      samenstel gebruikte vaartuig worden gebruikt.

      7. Bij het gebruik van stuurautomaten moet het bedieningsorgaan voor het instellen van de draaisnelheid in elke
      willekeurige positie kunnen worden losgelaten zonder dat daardoor de ingestelde draaisnelheid verandert.

      Het bedieningsorgaan moet een zodanige zwenkhoek hebben dat voldoende nauwkeurigheid van de instelling is
      gewaarborgd. De nulstand moet voelbaar van andere standen zijn te onderscheiden. De schaalverdeling moet traploos
      regelbaar kunnen worden verlicht.

      8. Inrichtingen voor afstandsbediening van de gehele stuurinrichting moeten vast ingebouwd zijn en zodanig zijn
      geïnstalleerd dat de gekozen vaarrichting duidelijk zichtbaar is. Wanneer zij uitgeschakeld kunnen worden, moeten
      zij voorzien zijn van een aanwijzer die aangeeft of de inrichting ‘aan’ of ‘uit’ is. De opstelling en bediening van
      de verschillende onderdelen van deze inrichtingen moeten overeenkomen met de functie daarvan.

      Voor aanvullende installaties van de stuurinrichting, zoals boegschroefinstallaties, zijn niet vast ingebouwde
      afstandsbedieningen toegestaan wanneer door een prioriteitsschakeling in het stuurhuis de bediening van de
      aanvullende installatie te allen tijde kan worden overgenomen.

      9. Bij roerpropeller-, waterstraal-, cycloïdaalschroef- en boegschroefinstallaties zijn gelijkwaardige
      bedieningsapparatuur en signalerings- en controle-instrumenten toegestaan.

      Voor deze installaties zijn het eerste tot en met achtste lid met inachtneming van de bijzondere kenmerken en de
      gekozen opstelling van de genoemde actieve stuurinrichtingen en de voortstuwingsinrichtingen van overeenkomstige
      toepassing. Naar analogie van lid 2 moet elke inrichting worden bediend door één enkele hefboom die beweegt volgens
      een cirkelboog in een verticaal vlak dat nagenoeg evenwijdig is aan de lengteas van de inrichting. Uit de positie
      van de hefboom moet duidelijk de richting van de aandrijving van het schip blijken.

      Voor zover roerpropeller- of cycloïdaalschroefinstallaties niet door middel van hefbomen worden bediend, kan de
      Commissie van deskundigen afwijkingen op de voorschriften van het tweede lid toestaan. Deze afwijkingen moeten
      worden vermeld onder nummer 52 van het binnenschipcertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6.07
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel8.03
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel8.05
