                      155


                      165
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.16
  - number: 20.16.2
    text: |-
      In afwijking van eerste lid mag de diameter van de schijven het zesvoudige van de draaddiameter bedragen indien het
      staaldraad niet constant over de schijven loopt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.16
  - number: 20.16.3
    text: |-
      De breeksterkte van het beslag (bijvoorbeeld sluitingen, ogen, spanschroeven, oogplaten, bouten, ringen en
      schakels) is in overeenstemming met de breeksterkte van het daaraan bevestigde staand of lopend want.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.16
  - number: 20.16.4
    text: De bevestiging van stag- en wantputtingen kan de daarop uitgeoefende krachten opnemen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.16
  - number: 20.16.5
    text: Aan elk oog mag slechts een schakel en het daarbij behorende stag of want bevestigd zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.16
  - number: 20.16.6
    text: |-
      De blokken van vallen en dirken zijn op een deugdelijke wijze aan de mast bevestigd, waarbij de hiertoe gebruikte
      draaiende hanenpoten in goede staat verkeren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.16
  - number: 20.16.7
    text: |-
      De bevestiging van oogbouten, klampen, kikkers en nagelbanken is in overeenstemming met de daarop uitgeoefende
      belasting.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.16
  - number: 20.17.1
    text: De zeilen moeten eenvoudig, snel en veilig kunnen worden gestreken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.17
  - number: 20.17.2
    text: Het zeiloppervlak is passend voor het scheepstype en de waterverplaatsing.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.17
  - number: 20.18.1
    text: |-
      Schepen die met een kluiverboom of een boegspriet zijn uitgerust, moeten voorzien zijn van een kluivernet en een
      toereikend aantal daarbij behorende rem- en spanvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.18
  - number: 20.18.2
    text: |-
      Van de in eerste lid bedoelde uitrusting kan worden afgezien indien de kluiverboom of boegspriet met een hand-
      en voetgeleiding is uitgerust die voldoende is gedimensioneerd voor het gebruik van een aan boord mee te voeren
      veiligheidsgordel.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.18
  - number: 20.18.3
    text: Voor het werken aan de tuigage dient een bootmansstoeltje beschikbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.18
  - number: 20.19.1
    text: |-
      De tuigage wordt om de 2,5 jaar door de Commissie van deskundigen gekeurd. De keuring omvat ten minste een
      inspectie van:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 20.19.1.a)
    text: de zeilen, inclusief de lijken, schoothoek en reefogen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 20.19.1.b)
    text: de toestand van masten en rondhouten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 20.19.1.c)
    text: de toestand van het staand en lopend want, inclusief de draadverbindingen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 20.19.1.d)
    text: de uitrusting om het zeil snel en veilig te kunnen strijken;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 20.19.1.e)
    text: de deugdelijke bevestiging van blokken van vallen en dirken;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 20.19.1.f)
    text: |-
      de bevestiging van mastkokers en overig aan de scheepsconstructie aangebrachte bevestigingspunten van staand en
      lopend want;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 20.19.1.g)
    text: de voor de zeilvoering aanwezige lieren;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 20.19.1.h)
    text: |-
      de overige ten behoeve van het zeilen aangebrachte voorzieningen zoals zwaarden en de voor de bediening daarvan
      aanwezige installaties;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 20.19.1.i)
    text: de voorzieningen die zijn getroffen om schavielen van rondhouten, staand en lopend want en zeilen te voorkomen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 20.19.1.j)
    text: |-
      de uitrusting als bedoeld in [artikel 20.18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel20
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '20'
        hoofdstuk: '20'
  - number: 20.19.2
    text: |-
      Het onderdeks gelegen deel van doorgestoken houten masten wordt regelmatig, na een door de Commissie van
      deskundigen vastgelegde tussentijd, maar uiterlijk bij ieder periodiek onderzoek onderzocht. Hiertoe wordt de mast
      getrokken voor inspectie aangeboden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 20.19.3
    text: |-
      Een door de Commissie van deskundigen afgegeven, gedateerd en ondertekend bewijsstuk van de laatste overeenkomstig
      eerste lid uitgevoerde keuring bevindt zich aan boord.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.19
  - number: 21.01.1
    text: |-
      Vaartuigen die bestemd zijn om te duwen moeten zijn voorzien van een geschikte duwinrichting. Zij moeten zo zijn
      gebouwd en uitgerust dat:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.01
  - number: 21.01.1.a)
    text: |-
      voor het personeel de passage naar het geduwde vaartuig gemakkelijk en zonder gevaar mogelijk is, ook wanneer de
      koppelingsmiddelen zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.01
  - number: 21.01.1.b)
    text: zij een vaste positie kunnen innemen ten opzichte van het gekoppelde vaartuig of de gekoppelde vaartuigen, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.01
  - number: 21.01.1.c)
    text: ten opzichte van elkaar verschuiven van de vaartuigen wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.01
  - number: 21.01.2
    text: |-
      Indien bij het koppelen kabels worden gebruikt, moeten op het voor het duwen geschikte vaartuig ten minste twee
      speciale lieren of gelijkwaardige inrichtingen voor het spannen van de kabels zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.01
  - number: 21.01.3
    text: |-
      De koppelingsinrichting moet een hechte verbinding met het geduwde vaartuig of de geduwde vaartuigen mogelijk
      maken. Bij duwstellen die bestaan uit één duwend en slechts één geduwd vaartuig mogen de koppelingsinrichtingen
      echter ook een gestuurd knikken mogelijk maken. De daartoe vereiste aandrijvingen moeten de over te brengen
      krachten probleemloos kunnen opvangen en zij moeten gemakkelijk en zonder gevaar kunnen worden bediend. Voor deze
      aandrijvingen zijn de [artikelen 6.02 tot en met 6.04][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6'
        hoofdstuk: '6'
  - number: 21.01.4
    text: |-
      Bij duwboten is een aanvaringsschot als bedoeld in [artikel 3.03, eerste lid onderdeel a][ref1], niet vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel3
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '3'
        hoofdstuk: '3'
  - number: 21.02.1
    text: 'Voor duwbakken zonder stuurinrichting, verblijven, machinekamers of ketelruimen zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.02
  - number: 21.02.1.a)
    text: |-
      de [hoofdstukken 5][ref1], [6][ref2], [7][ref3] en [15][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk15
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0041395
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0041395
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0041395
        hoofdstuk: '15'
  - number: 21.02.1.b)
    text: |-
      [Artikel 8.08, tweede tot en met achtste lid][ref1], [artikel 13.02][ref2], [artikel 13.08, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 21.02.2
    text: 'Voor zeeschipbakken met een lengte *L* van ten hoogste 40 m geldt bovendien:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.02
  - number: 21.02.2.a)
    text: |-
      Waterdichte schotten als bedoeld in [artikel 3.03, eerste lid][ref1], zijn niet vereist, wanneer de frontale
      gedeelten van de bak zodanig zijn versterkt dat zij een belasting kunnen opnemen die ten minste 2,5 maal zo groot
      is als die van het aanvaringsschot van een binnenschip met een overeenkomstige diepgang dat is gebouwd volgens de
      voorschriften van een erkend classificatiebureau;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel3
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '3'
        hoofdstuk: '3'
  - number: 21.02.2.b)
    text: |-
      In afwijking van [artikel 8.08, eerste lid][ref1], behoeven moeilijk toegankelijke compartimenten van een dubbele
      bodem slechts gelensd te kunnen worden, wanneer hun inhoud meer bedraagt dan 5% van de waterverplaatsing van de
      zeeschipbak bij de grootste toegelaten inzinking.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel8
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
  - number: 21.02.3
    text: |-
      Vaartuigen die geduwd moeten worden moeten zijn voorzien van koppelingsinrichtingen die een veilige verbinding met
      andere vaartuigen waarborgen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.02
  - number: '21.03'
    text: |-
      Op vaartuigen die bestemd zijn om een gekoppeld samenstel voort te bewegen moeten bolders of gelijkwaardige
      inrichtingen aanwezig zijn die het door hun aantal en opstelling mogelijk maken een afdoende verbinding tot stand
      te brengen tussen de gekoppelde vaartuigen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.03
  - number: '21.04'
    text: |-
      Vaartuigen die bestemd zijn om te worden voortbewogen in een samenstel moeten zijn voorzien van hiervoor geschikte
      koppelingsinrichtingen, bolders of gelijkwaardige inrichtingen die door hun aantal en opstelling een afdoende
      verbinding met het andere vaartuig of de andere vaartuigen van het samenstel waarborgen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.04
  - number: 21.05.1
    text: 'Vaartuigen die moeten kunnen worden gebruikt om te slepen moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.05
  - number: 21.05.1.a)
    text: |-
      De sleepinrichtingen moeten zo zijn aangebracht dat door het gebruik daarvan de veiligheid van het schip, de
      bemanning of de lading niet in gevaar komt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.05
  - number: 21.05.1.b)
    text: |-
      Assisterende en slepende schepen moeten zijn uitgerust met een vanuit het stuurhuis veilig te bedienen sleephaak;
      dit geldt niet wanneer op grond van de bouwwijze of door andere voorzieningen kenteren niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.05
  - number: 21.05.1.c)
    text: |-
      Als sleepinrichting moeten sleeplieren of een sleephaak aanwezig zijn. De sleepinrichtingen moeten vóór de
      schroeven zijn aangebracht. Dit geldt niet voor sleepboten die met het aandrijforgaan worden gestuurd, zoals een
      roerpropeller of cycloïdaalschroef.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.05
  - number: 21.05.1.d)
    text: |-
      In afwijking van onderdeel c is bij schepen die uitsluitend overeenkomstig de toepasselijke
      scheepvaartpolitiereglementen van de lidstaten worden gebruikt voor het verlenen van sleepbijstand voor
      motorschepen, ook een sleepinrichting zoals bolders of gelijkwaardige inrichtingen voldoende. Het onderdeel b is
      van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.05
  - number: 21.05.1.e)
    text: |-
      Wanneer de sleeptrossen op een achterschip zouden kunnen blijven haken dienen daar sleepbogen met draadvangers te
      zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.05
  - number: 21.05.2
    text: Schepen met een lengte *L* van meer dan 86 m mogen niet worden toegelaten om afvarend te slepen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.05
  - number: 21.06.1
    text: |-
      Met het oog op de toelating als duwboot of motorschip voor het voortbewegen van vaartuigen in een hecht samenstel
      en met het oog op het plaatsen van een desbetreffende aantekening in het binnenschipcertificaat bepaalt de
      Commissie van deskundigen welke formaties haar voor onderzoek moeten worden getoond en laat zij proefvaarten
      als bedoeld in [artikel 5.02][ref1] uitvoeren met het samenstel in de verzochte formatie(s) die haar het meest
      ongunstig voorkomen. Daarbij moet dit samenstel aan de [artikelen 5.02 tot en met 5.10][ref2] voldoen. De Commissie
      van deskundigen vergewist zich ervan of een hechte verbinding van alle vaartuigen van het samenstel bij de volgens
      [hoofdstuk 5][ref3] voorgeschreven manoeuvres verzekerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0041395
        hoofdstuk: '5'
  - number: 21.06.2
    text: |-
      Indien tijdens de in het eerste lid bedoelde proefvaarten bijzondere inrichtingen op de in het samenstel
      voortbewogen vaartuigen (zoals de stuurinrichting, de aandrijf- of manoeuvreerinrichtingen of de
      scharnierkoppelingen) worden gebruikt om te voldoen aan de [artikelen 5.02 tot en met 5.10][ref1], moet in het
      binnenschipcertificaat van het vaartuig dat het samenstel voortbeweegt worden vermeld: de formatie, de positie,
      de naam en het uniek Europees scheepsidentificatienummer van de toegelaten vaartuigen die over deze bijzondere
      inrichtingen beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '5'
        hoofdstuk: '5'
  - number: 21.07.1
    text: |-
      Indien een vaartuig een samenstel moet voortbewegen of daarin moet worden voortbewogen, moet in het certificaat van
      onderzoek zijn aangetekend dat het daarvoor geschikt is overeenkomstig de [artikelen 21.01 tot en met 21.06][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel21
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '21'
        hoofdstuk: '21'
  - number: 21.07.2
    text: 'In het binnenschipcertificaat van het vaartuig dat voor de voortbeweging zorgtmoet worden aangetekend:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.07
  - number: 21.07.2.a)
    text: de toegelaten samenstellen en formaties;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.07
  - number: 21.07.2.b)
    text: het soort koppelingen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.07
  - number: 21.07.2.c)
    text: de vastgestelde grootste koppelingskrachten, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.07
  - number: 21.07.2.d)
    text: |-
      eventueel de minimumbreeksterkte van de koppelingskabels van de langsverbindingen, alsmede het aantal windingen van
      de koppelingskabels.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.07
  - number: '22.01'
    text: |-
      Voor drijvende werktuigen zijn voor wat betreft bouw en uitrusting de [hoofdstukken 3][ref1],
      [7 tot en met 17][ref2] en [21][ref3] van toepassing. Drijvende werktuigen met mechanische middelen tot
      voortbeweging moeten ook voldoen aan de [hoofdstukken 5][ref4] en [6][ref5]. Aandrijvingen die slechts een geringe
      verplaatsing mogelijk maken worden niet beschouwd als mechanische middelen tot voortbeweging.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk21
      [ref4]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
      [ref5]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0041395
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0041395
        hoofdstuk: '21'
      - id: ref4
        bwb_id: BWBR0041395
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0041395
        hoofdstuk: '6'
  - number: 22.02.1.a)
    text: |-
      [Artikel 3.03, eerste en tweede lid][ref1], is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel3
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '3'
        hoofdstuk: '3'
  - number: 22.02.1.b)
    text: |-
      [artikel 7.02][ref1] is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 22.02.1.c)
    text: |-
      de ten hoogste toegelaten niveaus van de geluidsdruk als bedoeld in [artikel 15.02, vijfde lid][ref1], tweede
      alinea, mogen worden overschreden wanneer de werkinrichtingen in bedrijf zijn en voor zover er dan niet aan boord
      wordt overnacht;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel15
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '15'
        hoofdstuk: '15'
  - number: 22.02.1.d)
    text: |-
      De Commissie van deskundigen kan van de toepassing van de overige bepalingen met betrekking tot de bouw, inrichting
      en uitrusting afwijkingen toelaten, voor zover in het elke geval een zelfde mate van veiligheid is aangetoond.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
  - number: 22.02.2
    text: 'De Commissie van deskundigen kan afzien van de toepassing van de volgende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
  - number: 22.02.2.a)
    text: |-
      [artikel 13.01, eerste lid][ref1], wanneer het drijvende werktuig veilig kan worden verankerd terwijl de
      werkinrichtingen in bedrijf zijn, bijvoorbeeld door middel van werkankers of palen. Een drijvend werktuig met eigen
      mechanische middelen tot voortbeweging moet echter ten minste één anker hebben als bedoeld in artikel 13.01, eerste
      lid, waarbij de coëfficiënt *k* = 45 en voor *T* gelijk aan holte *H*;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 22.02.2.b)
    text: |-
      [artikel 15.02, eerste lid][ref1], tweede gedeelte van de zin, wanneer de ruimten voldoende elektrisch kunnen
      worden verlicht.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel15
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '15'
        hoofdstuk: '15'
  - number: 22.02.3
    text: 'Bovendien geldt:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
  - number: 22.02.3.a)
    text: |-
      in afwijking van [artikel 8.08, tweede lid, tweede volzin][ref1], de lenspomp moet mechanisch worden aangedreven;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel8
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
  - number: 22.02.3.b)
    text: |-
      in afwijking van [artikel 8.10, derde lid][ref1], bij stilliggende drijvende werktuigen mag het geluid wanneer de
      werkinrichtingen in bedrijf zijn op 25 m afstand zijdelings van de scheepshuid meer bedragen dan 65 dB(A);


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel8
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
  - number: 22.02.3.c)
    text: |-
      in afwijking van [artikel 13.03, eerste lid][ref1], bij vrij op het dek staande werktuigen moet ten minste één
      extra draagbaar blustoestel aanwezig zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 22.02.3.d)
    text: |-
      in afwijking van [artikel 17.02, tweede lid][ref1], naast vloeibaargasinstallaties voor huishoudelijk gebruik
      mogen ook andere vloeibaargasinstallaties aanwezig zijn. Deze installaties met toebehoren moeten voldoen aan de
      voorschriften van een van de lidstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '17'
        hoofdstuk: '17'
  - number: 22.03.1
    text: |-
      Op drijvende werktuigen waarop tijdens het werk personen aanwezig zijn is de aanwezigheid van een algemene
      alarminstallatie vereist. Het alarmsignaal moet zich duidelijk onderscheiden van andere signalen en in alle
      verblijven en op alle werkplekken een geluidsdrukniveau doen ontstaan dat ten minste 5 dB(A) hoger is dan het ter
      plaatse overheersende maximale geluidsniveau. De alarminstallatie moet in het stuurhuis en op de belangrijkste
      bedieningspunten in werking kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.03
  - number: 22.03.2
    text: |-
      Werkinrichtingen moeten voor hun belasting voldoende sterkte hebben en zij moeten voldoen aan de voorschriften van
      een van de lidstaten van de CCR of aan de voorschriften van gewijzigde [Richtlijn 2006/42/EG](32006L0042).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.03
  - number: 22.03.3
    text: |-
      De kantelingsstabiliteit en de sterkte van de werkinrichtingen en eventueel de bevestiging daarvan moeten zodanig
      zijn dat zij bestand zijn tegen belastingen door te verwachten slagzij, trim en bewegingen van het drijvend
      werktuig.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.03
  - number: 22.03.4
    text: |-
      Indien lasten met heftoestellen omhoog worden gebracht, dient de uit stabiliteit en sterkte resulterende maximaal
      toelaatbare last duidelijk te worden aangegeven op een bord aan dek en op de bedieningspunten. Indien het
      hefvermogen door het aankoppelen van extra drijvende voorwerpen kan worden vergroot, moeten de waarden met en
      zonder extra drijvende voorwerpen zijn vermeld
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.03
  - number: 22.04.1
    text: |-
      Voor de toepassing van dit hoofdstuk en in afwijking van [artikel 1.01][ref1] is de resterende veiligheidsafstand
      de kleinste verticale afstand tussen de gladde waterspiegel en het laagste punt waarboven het drijvend werktuig
      niet meer waterdicht is, waarbij rekening wordt gehouden met trim en slagzij die optreden onder invloed van de
      momenten als bedoeld in [artikel 22.07, vierde tot en met negende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel22
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '22'
        hoofdstuk: '22'
  - number: 22.04.2
    text: |-
      Een resterende veiligheidsafstand bij spatwater- en regendicht afsluitbare openingen is voldoende in de zin van
      [artikel 22.07, eerste lid][ref1], wanneer deze 300 mm bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel22
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '22'
        hoofdstuk: '22'
  - number: 22.04.3
    text: |-
      De resterende veiligheidsafstand bij niet spatwater- en regendicht afsluitbare openingen moet ten minste 400 mm
      bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.04
  - number: 22.05.1
    text: |-
      Voor de toepassing van dit hoofdstuk en in afwijking van [artikel 1.01][ref1] is het resterende
      vrijboord de kleinste verticale afstand tussen de gladde waterspiegel en de zijkant van het dek, waarbij
      rekening wordt gehouden met trim en slagzij, die optreden onder invloed van de momenten als bedoeld in
      [artikel 22.07, vierde tot en met negende lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel22
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.05
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '22'
        hoofdstuk: '22'
  - number: 22.05.2
    text: |-
      Het resterend vrijboord als bedoeld in [artikel 22.07, eerste lid][ref1], is voldoende indien het 300 mm bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel22
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.05
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '22'
        hoofdstuk: '22'
  - number: 22.05.3
    text: |-
      Het resterend vrijboord mag worden verminderd wanneer wordt aangetoond dat [artikel 22.08][ref1] in acht is
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel22
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.05
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '22'
        hoofdstuk: '22'
  - number: 22.05.4
    text: |-
      Indien de vorm van het drijvend voorwerp in belangrijke mate afwijkt van de vorm van een ponton, zoals bij
      cilindrische drijvende voorwerpen of bij een drijvend voorwerp waarvan de dwarsdoorsnede meer bedraagt dan vier
      zijden, kan de Commissie van deskundigen een resterend vrijboord eisen of toelaten dat afwijkt van het tweede lid.
      Dit geldt ook voor een drijvend werktuig met verscheidene drijvende voorwerpen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.05
  - number: 22.06.1
    text: |-
      Het bewijs van stabiliteit als bedoeld in de [artikelen 22.07][ref1] en [22.08][ref2] moet worden geleverd op basis
      van een volgens goed scheepsbouwgebruik uitgevoerde hellingproef.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel22
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '22'
        hoofdstuk: '22'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '22'
        hoofdstuk: '22'
  - number: 22.06.2
    text: |-
      Indien bij de hellingproef geen voldoende hellingshoek kan worden bereikt, of indien de uitvoering van de
      hellingproef onoverkomelijke technische problemen met zich meebrengt, kan in plaats daarvan een berekening
      van het gewicht en het zwaartepunt worden gemaakt. Het resultaat van de berekening van het gewicht moet worden
      gecontroleerd met behulp van metingen van de diepgang, waarbij het verschil niet meer dan ± 5% mag bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.06
  - number: 22.07.1
    text: |-
      Bewezen dient te worden dat bij de tijdens het in bedrijf zijn van de installaties en tijdens de vaart optredende
      belastingen voldoende resterende veiligheidsafstand en voldoende resterend vrijboord aanwezig zijn. Daarbij mag de
      som van de hoeken tussen slagzij en trim niet meer dan 10° bedragen en mag de bodem van de scheepsromp niet boven
      het water uitkomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.2
    text: 'Het bewijs van stabiliteit moet de volgende gegevens en documenten bevatten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.2.a)
    text: |-
      tekeningen op schaal van de drijvende voorwerpen en de werkinrichtingen alsmede de voor het bewijs van stabiliteit
      vereiste gedetailleerde gegevens, zoals de inhoud van tanks en openingen die naar het binnenste van het schip
      voeren;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.2.b)
    text: hydrostatische gegevens of krommen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.2.c)
    text: |-
      krommen van de armen van intactstabiliteit, voor zover vereist ingevolge het vijfde lid of [artikel 22.08][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel22
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '22'
        hoofdstuk: '22'
  - number: 22.07.2.d)
    text: |-
      beschrijving van de bedrijfstoestanden met de dienovereenkomstige gegevens inzake gewicht en zwaartepunt met
      inbegrip van de onbeladen toestand en de toestand van het werktuig bij verplaatsing;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.2.e)
    text: |-
      berekening van het kenterende, trimmende en oprichtende moment met vermelding van de optredende hellings- en
      trimhoeken, resterende veiligheidsafstanden en resterende vrijboorden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.2.f)
    text: overzicht van de uitkomsten van de berekeningen met vermelding van de grenzen van gebruik en belasting.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.3
    text: 'Het bewijs van stabiliteit moet ten minste zijn gebaseerd op de volgende veronderstelde belading:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.3.a)
    text: |-
      dichtheid van de baggerspecie bij baggermolens: zeer nat zand 2,0 t/m3, grond gemiddeld 1,8 t/m3, mengsel uit zand
      en water in buisleidingen 1,3 t/m3;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.3.b)
    text: bij baggerwerktuigen met grijptanden moeten de waarden onder a met 15% worden verhoogd;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.3.c)
    text: bij hydraulische baggerwerktuigen moet worden uitgegaan van het maximale hefvermogen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.4
    text: 'In het bewijs van de stabiliteit moet rekening worden gehouden met de momenten resulterend uit:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.4.a)
    text: de belading;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.4.b)
    text: bouwkundige asymmetrieën;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.4.c)
    text: de winddruk;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.4.d)
    text: de draaibeweging bij werktuigen met eigen aandrijvingskracht;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.4.e)
    text: dwarsstroming voor zover vereist;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.4.f)
    text: ballast en voorraden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.4.g)
    text: deklasten en eventueel lading;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.4.h)
    text: vrije oppervlakken van vloeistof;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.4.i)
    text: dynamische traagheidskrachten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.4.j)
    text: andere mechanische inrichtingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.5
    text: |-
      Het moment ten gevolge van de winddruk dient te worden berekend volgens de volgende formule: In deze formule
      betekent: '*c* = de vormafhankelijke weerstandscoëfficiënt; Voor vakwerk moet worden uitgegaan van *c* = 1,2 en voor'
      gesloten constructies van *c* = 1,6, waarbij rekening is gehouden met de invloed van windstoten. Het windvangend
      oppervlak is de omhullende oppervlakte van het vakwerk. *P* = de specifieke winddruk; deze moet uniform op 0,25 kN/
      m2 worden gesteld; *A* = zijdelings oppervlak van het schip boven het vlak van de grootste inzinking in [m2], dat
      overeenkomt met de betreffende beladingstoestand; *l* = afstand van het zwaartepunt van het zijdelingse vlak *A*
      tot het vlak van de inzinking in m. die overeenkomt met de betreffende beladingstoestand in [m].
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.6
    text: |-
      Voor de vaststelling van de momenten bij de draaibeweging als bedoeld in het vierde lid, onderdeel d, dient bij
      drijvende werktuigen met mechanische middelen tot voortbeweging de formule van [artikel 19.03, zesde lid][ref1], te
      worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 22.07.7
    text: |-
      Het door dwarsstroming als bedoeld in het vierde lid, onderdeel e, veroorzaakte moment hoeft alleen te worden
      meegerekend bij drijvende werktuigen die gedurende het werk in stromend water dwarsliggend met ankers of kabels
      zijn vastgemaakt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.8
    text: |-
      Bij de berekening van de momenten resulterend uit vloeibare ballast en vloeibare voorraden als bedoeld in het
      vierde lid, onderdeel f, dient de voor de stabiliteit meest ongunstige vullingsgraad van de tanks te worden
      vastgesteld en het dienovereenkomstige moment in de berekening te worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.9
    text: |-
      Met het uit dynamische traagheidskrachten resulterende moment als bedoeld in het vierde lid, onderdeel i, moet
      op passende wijze rekening worden gehouden, wanneer door bewegingen van de lading en van de werkinrichtingen een
      beïnvloeding van de stabiliteit te verwachten is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: 22.07.10
    text: |-
      De oprichtende momenten kunnen bij drijvende voorwerpen met loodrechte zijwanden worden berekend volgens de
      formule: 'In deze formule betekent: = de metacentrumhoogte in m; *φ*= de hellingshoek in graden. Deze formule'
      is van toepassing tot hellingshoeken van ten hoogste 10° of tot een hellingshoek waarbij de zijde van het dek
      wordt ingedompeld of de bodem boven water uitkomt. Daarbij is de kleinste hoek doorslaggevend. Bij schuin lopende
      zijwanden is de formule van toepassing tot hellingshoeken van ten hoogste 5°; voor het overige zijn de criteria als
      bedoeld in het derde tot en met negende lid van toepassing. Wanneer de bijzondere vorm van het drijvend voorwerp
      of de drijvende voorwerpen dit niet toelaat, zijn stabiliteitskrommen als bedoeld in het tweede lid, onderdeel
      c, vereist.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.07
  - number: '22.08'
    text: |-
      Indien gebruik wordt gemaakt van een verminderd resterend vrijboord als bedoeld in
      [artikel 22.05, derde lid][ref1], moet voor alle bedrijfsomstandigheden zijn aangetoond dat


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel22
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.08
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '22'
        hoofdstuk: '22'
  - number: 22.08.a)
    text: na correctie voor vrije vloeistofoppervlakken de metacentrumhoogte niet minder dan 0,15 m bedraagt;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.08
  - number: 22.08.b)
    text: |-
      binnen een slagzij van 0° tot en met 30° een oprichtende arm van ten minste *h* = 0,30 – 0,28 • *φ* [*m*] aanwezig
      is. Daarbij is *φ* de hellingshoek, waar vandaan de stabiliteitskromme negatief wordt (stabiliteitsomvang). Hij mag
      niet kleiner zijn dan 20° of 0,35 rad en moet in de formule op ten hoogste 30° of 0,52 rad worden gesteld, waarbij
      voor *φ* de eenheid radiaal (rad) moet worden gebruikt (1° = 0,01745 rad);
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.08
  - number: 22.08.c)
    text: de som van de hoeken resulterend uit slagzij en trim niet meer dan 10° bedraagt;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.08
  - number: 22.08.d)
    text: |-
      een resterende veiligheidsafstand als bedoeld in [artikel 22.04][ref1] aanwezig is;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel22
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.08
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '22'
        hoofdstuk: '22'
  - number: 22.08.e)
    text: een resterend vrijboord van ten minste 0,05 m aanwezig is;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.08
  - number: 22.08.f)
    text: |-
      binnen een slagzij van 0° tot en met 30° een resterende arm van ten minste *h* = 0,20 – 0,23 • *φ* [*m*] aanwezig
      is. Daarbij is *φ* de hellingshoek, waarvandaan de stabiliteitskromme negatief wordt; deze moet in de formule
      op ten hoogste 30° of 0,52 rad worden gesteld. Onder resterende arm moet worden verstaan het tussen 0° en 30°
      hellingshoek aanwezige grootste verschil tussen de kromme van de oprichtende armen en de kromme van de kenterende
      armen. Indien een opening naar het inwendige van het schip in het water terecht komt bij een hellingshoek die
      kleiner is dan de hellingshoek die bij het grootste verschil hoort, is de eis inzake de resterende arm van
      toepassing op deze hellingshoek.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.08
  - number: '22.09'
    text: |-
      Inzinkingsmerken als bedoeld in [artikel 4.04][ref1] en diepgangsschalen als bedoeld in [artikel 4.06][ref2] moeten
      zijn aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel4
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
  - number: 22.10.1
    text: |-
      Bij de onderstaande drijvende werktuigen kan worden afgezien van de toepassing van de
      [artikelen 22.04 tot en met 22.08][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel22
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.10
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '22'
        hoofdstuk: '22'
  - number: 22.10.1.a)
    text: door de werkinrichting waarvan geen enkele wijziging van de slagzij of de trim kan worden veroorzaakt, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.10
  - number: 22.10.1.b)
    text: waarbij een verschuiving van het gewichtszwaartepunt verregaand kan worden uitgesloten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.10
  - number: 22.10.2
    text: 'Echter moet:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.10
  - number: 22.10.2.a)
    text: bij maximale belading de veiligheidsafstand ten minste 300 mm en het vrijboord ten minste 150 mm bedragen; en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.10
  - number: 22.10.2.b)
    text: de veiligheidsafstand voor niet spatwater- en regendicht afsluitbare openingen ten minste 500 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.10
  - number: '23.01'
    text: |-
      Schepen bestemd voor bouwwerkzaamheden, die als zodanig in het binnenschipcertificaat zijn aangeduid, mogen
      buiten werkterreinen slechts onbeladen varen. Deze voorwaarde dient in het binnenschipcertificaat te worden
      vermeld. Hiertoe moeten deze schepen bestemd voor bouwwerkzaamheden beschikken over een verklaring van de bevoegde
      autoriteit over de duur van de werkzaamheden en de begrenzing van het werkterrein waarop het schip mag worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.01
  - number: '23.02'
    text: |-
      Voor zover in dit hoofdstuk niets anders is bepaald, zijn met betrekking tot de bouw en de uitrusting van schepen
      bestemd voor bouwwerkzaamheden de [hoofdstukken 3 tot en met 17][ref1] van Deel II van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '3'
  - number: 23.03.1.a)
    text: |-
      [Artikel 3.03, eerste lid][ref1], is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel3
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '3'
        hoofdstuk: '3'
  - number: 23.03.1.b)
    text: |-
      de [hoofdstukken 5][ref1] en [6][ref2] zijn van overeenkomstige toepassing, indien het schip is voorzien van eigen
      mechanische middelen tot voortbeweging;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0041395
        hoofdstuk: '6'
  - number: 23.03.1.c)
    text: |-
      [artikel 13.02, tweede lid, onderdeel a en b][ref1], is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 23.03.1.d)
    text: |-
      De Commissie van deskundigen kan van de toepassing van de overige bepalingen met betrekking tot de bouw, inrichting
      en uitrusting afwijkingen toelaten, voor zover in het elke geval een zelfde mate van veiligheid is aangetoond.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.03
  - number: 23.03.2
    text: 'De Commissie van deskundigen kan afzien van de toepassing van de volgende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.03
  - number: 23.03.2.a)
    text: |-
      [artikel 8.08, tweede tot en met achtste lid][ref1], wanneer geen bemanning is voorgeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel8
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
  - number: 23.03.2.b)
    text: |-
      [artikel 13.01, eerste en derde lid][ref1], wanneer het schip bestemd voor bouwwerkzaamheden door middel van
      werkankers of palen veilig kan worden verankerd. Een schip bestemd voor bouwwerkzaamheden met eigen mechanische
      middelen tot voortbeweging moet echter ten minste één anker hebben als bedoeld in artikel 13.01, eerste lid,
      waarbij de coëfficiënt *k* en voor *T* gelijk aan holte *H*;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 23.03.2.c)
    text: |-
      [artikel 13.02, eerste lid, onderdeel c][ref1], wanneer het schip bestemd voor bouwwerkzaamheden niet over eigen
      mechanische middelen tot voortbeweging beschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 23.04.1
    text: |-
      Indien een schip bestemd voor bouwwerkzaamheden als spoel- en klepbak wordt geëxploiteerd moet de
      veiligheidsafstand buiten het laadruim ten minste 300 mm en het vrijboord ten minste 150 mm bedragen. De Commissie
      van deskundigen kan een kleiner vrijboord toestaan, wanneer rekenkundig is bewezen dat de stabiliteit bij belading
      met een dichtheid van 1,5 t/m3 voldoende is en er geen zijde van het dek in het water komt. De invloed van
      vloeibaar gemaakte lading moet daarbij in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.04
  - number: 23.04.2
    text: |-
      Voor een schip bestemd voor bouwwerkzaamheden dat niet onder het eerste lid valt zijn de [artikelen 4.01][ref1] en
      [4.02][ref2] van overeenkomstige toepassing. Daarbij kan de Commissie van deskundigen voor de veiligheidsafstand en
      voor het vrijboord afwijkende waarden vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel4
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
  - number: '23.05'
    text: Schepen bestemd voor bouwwerkzaamheden hoeven niet met een bijboot te zijn uitgerust, indien
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.05
  - number: 23.05.a)
    text: ze niet zijn uitgerust met mechanische middelen tot voortbeweging, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.05
  - number: 23.05.b)
    text: op het werkterrein een andere bijboot beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.05
  - number: 24.01.1
    text: |-
      Traditionele vaartuigen moeten volgens goed scheepsbouwgebruik zijn gebouwd, in overeenstemming met de stand van de
      techniek op de gekozen historische datum. De staat van het traditionele vaartuig qua bouw, inrichting en uitrusting
      moet minstens aan de nationale voorschriften van de lidstaat waar het traditionele vaartuig oorspronkelijk werd
      geëxploiteerd, op de gekozen historische datum, voldoen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.01
  - number: 24.01.2
    text: |-
      Alle bouwonderdelen, inrichtingen en uitrustingen die niet tot de staat qua bouw, inrichting en uitrusting van
      de gekozen historische datum behoren, moeten aan de daarvoor geldende bepalingen van de [delen II][ref1] en
      [III][ref2] van deze standaard voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
      [ref2]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
      - id: ref2
        bwb_id: BWBR0041395
  - number: 24.01.3
    text: |-
      Bij afwijkingen van de bepalingen van deze standaard worden door de Commissie van deskundigen compenserende
      vereisten bepaald, die de technische functie en de uiterlijke indruk van het traditionele vaartuig in aanmerking
      nemend, een gelijkwaardige veiligheid waarborgen. Afwijkingen zijn uitsluitend toegestaan indien hiertoe op grond
      van de historische aard een noodzaak bestaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.01
  - number: 24.02.1
    text: Voor de erkenning van een vaartuig als ‘traditioneel vaartuig’ moet
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.1.a)
    text: een initieel onderzoek dat voorafgaat aan de eerste afgifte van een binnenschipcertificaat of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.1.b)
    text: |-
      een bijzonder onderzoek voor de afgifte van een gewijzigd binnenschipcertificaat na de ombouw of de wijziging van
      de bestemming van een vaartuig tot traditioneel vaartuig worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.2
    text: |-
      Aan de Commissie van deskundigen moeten met de aanvraag van het onderzoek, behalve de reglementair voorgeschreven
      bescheiden, de volgende documenten worden voorgelegd:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.2.a)
    text: |-
      een advies van een instantie voor monumentenzorg met de desbetreffende kennis of van een erkend deskundige
      voor traditionele vaartuigen, dat is opgesteld op grond van een inspectie die binnen een termijn van drie
      maanden vóór de indiening van de aanvraag is uitgevoerd, en waarin wordt bevestigd dat aan de eisen van
      [artikel 24.01, eerste lid][ref1], wordt voldaan en dat moet worden uitgegaan van een geschiktheid voor een gebruik
      als bedoeld in [artikel 1.01, lid 1.29][ref2], en het dientengevolge de moeite waard is het vaartuig te behouden;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel1
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '24'
        hoofdstuk: '24'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '1'
        hoofdstuk: '1'
  - number: 24.02.2.b)
    text: het gebruiksconcept;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.2.c)
    text: een veiligheidsconcept dat is gebaseerd op het in onderdeel b bedoelde gebruiksconcept;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.2.d)
    text: 'de uit de volgende delen bestaande documentatie van het traditionele vaartuig:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.2.d).aa)
    text: |-
      gegevens betreffende de staat qua bouw, inrichting en uitrusting van het voor het onderzoek aangeboden vaartuig
      door middel van beschrijvingen, tekeningen, foto’s en overige documenten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.2.d).bb)
    text: |-
      lijst van de op de gekozen historische datum geldende voorschriften en kopieën daarvan, voor zover deze voor de
      motivering van de afwijkingen van de eisen van de delen II en III van deze standaard nodig zijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.2.d).cc)
    text: |-
      bewijs dat de staat qua bouw, inrichting en uitrusting geschikt is om het vaartuig als een traditioneel vaartuig
      te exploiteren;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.2.d).dd)
    text: |-
      krachtens deze standaard vereiste tekeningen, ontwerpen, berekeningen en bewijzen. Deze moeten overeenkomen met de
      stand van het vaartuig op de datum van de indiening van de aanvraag;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.2.d).ee)
    text: |-
      lijst van de afwijkingen van de staat van de bouw, inrichting en uitrusting overeenkomstig de in onderdeel aa
      bedoelde gegevens ten opzichte van de op de datum van de indiening van de aanvraag geldige technische voorschriften
      van deze standaard;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.2.d).ff)
    text: gegevens over de bemanning van het traditionele vaartuig op de gekozen historische datum.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.3
    text: |-
      De aanvrager vermeldt de historische datum voor het traditionele vaartuig, waarbij deze datum niet vóór de datum
      van de eerste ingebruikneming van het vaartuig mag liggen. Bij de replica van een traditioneel vaartuig blijkt de
      historische datum uit het advies overeenkomstig het tweede lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.4
    text: |-
      Op grond van de bovengenoemde bescheiden en van het onderzoek als bedoeld in het eerste lid, wordt
      door de Commissie van deskundigen de geschiktheid overeenkomstig [artikel 1.01, lid 1.29][ref1], en
      [artikel 24.01][ref2] vastgesteld en de erkenning door de vermelding ‘traditioneel vaartuig’ onder nummer 2 van
      het binnenschipcertificaat ingeschreven. De geschiktheid mag hierbij niet worden vastgesteld in tegenspraak met de
      uitspraak van de erkend deskundige voor traditionele vaartuigen of met het advies zoals bedoeld in het tweede lid,
      onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel24
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '24'
        hoofdstuk: '24'
  - number: 24.02.5
    text: |-
      Buiten de vermelding ‘traditioneel vaartuig’ wordt de bijlage ‘traditioneel vaartuig’ volgens het model uit bijlage
      3, deel V, afgegeven. De volgende aantekening moet onder nummer 52 van het binnenschipcertificaat worden gemaakt:
      ‘zie Bijlage traditioneel vaartuig’.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.6
    text: |-
      Indien in de documentatie overeenkomstig het tweede lid, onderdeel d, onderdeel ee, of bij het onderzoek als
      bedoeld in het eerste lid, afwijkingen worden vastgesteld ten opzichte van de op de datum van aanvraag geldende
      versie van deze standaard
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.6.a)
    text: |-
      mogen tijdens de vaart uitsluitend bemanningsleden of personen die zich om dienstredenen aan boord bevinden, zich
      aan boord ophouden en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.02.6.b)
    text: |-
      is de werking van vrij toegankelijke machines of mechanisch aangedreven inrichtingen uitsluitend toegestaan indien
      zich geen andere personen aan boord ophouden dan de bemanning of personen die zich om dienstredenen aan boord
      bevinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.02
  - number: 24.03.1
    text: |-
      De Commissie van deskundigen bepaalt overeenkomstig de gebruiks- en veiligheidsconcepten als bedoeld in
      [artikel 24.02, tweede lid, onderdelen b en c][ref1], en overeenkomstig de staat qua bouw, inrichting en uitrusting
      van het traditionele vaartuig:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel24
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '24'
        hoofdstuk: '24'
  - number: 24.03.1.a)
    text: de minimumbemanning en hun bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.03
  - number: 24.03.1.b)
    text: het toegestane aantal personen, dat tot op de minimumbemanning kan worden beperkt;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.03
  - number: 24.03.1.c)
    text: beperkende bepalingen voor het verblijf van personen, met uitzondering van de leden van de bemanning, aan boord;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.03
  - number: 24.03.1.d)
    text: de toegestane belading, die tot op ‘nul’ kan worden beperkt;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.03
  - number: 24.03.1.e)
    text: het toegestane vaarbereik;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.03
  - number: 24.03.1.f)
    text: meteorologische grensvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.03
  - number: 24.03.1.g)
    text: nautische grensvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.03
  - number: 24.03.1.h)
    text: overige beperkende voorwaarden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.03
  - number: 24.03.2
    text: |-
      Bij periodieke onderzoeken kan de Commissie van deskundigen in het licht van de ontwikkeling van de
      technische voorschriften van de onderhavige standaard, de overeenkomstig het artikel 24.03, eerste lid en
      [artikel 24.01, derde lid][ref1] vastgelegde voorwaarden wijzigen. Deze wijzigingen moeten in de bijlage
      ‘Traditioneel vaartuig’ bij het binnenschipcertificaat worden opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel24
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '24'
        hoofdstuk: '24'
  - number: 25.01.1
    text: |-
      Zeeschepen, die op de Rijn varen, moeten voldoen aan de geldende nationale en internationale bepalingen betreffende
      de technische voorschriften inzake de bouw, de uitrusting en het milieu die van toepassing zijn op zeeschepen en
      dit kunnen aantonen door middel van de hiervoor benodigde certificaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel25.01
  - number: 25.01.2
    text: |-
      Zeeschepen moeten in aanvulling op de in het eerste lid genoemde voorschriften voldoen aan de volgende bepalingen
      van deze standaard:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel25.01
  - number: 25.01.2.a)
    text: |-
      [hoofdstuk 5][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel25.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '5'
  - number: 25.01.2.b)
    text: |-
      van [hoofdstuk 6][ref1]: de [artikelen 6.01, eerste lid][ref2], en [6.02, eerste en tweede lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel6
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel25.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0041395
        artikel: '6'
        hoofdstuk: '6'
  - number: 25.01.2.c)
    text: |-
      van [hoofdstuk 7][ref1]: de [artikelen 7.01, tweede lid][ref2],
      [7.02, eerste lid, en derde lid, eerste en derde alinea][ref3], [7.05, tweede lid][ref4], [artikel 7.13][ref5] voor
      schepen die voor het voeren van het schip door één persoon met behulp van radar zijn toegelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0041395#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel25.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
      - id: ref4
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
      - id: ref5
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 25.01.2.d)
    text: |-
      van [hoofdstuk 8][ref1]: [artikel 8.03, derde lid][ref2], indien vanaf de stuurstelling een inrichting om
      de motor automatisch te stoppen kan worden uitgeschakeld, voorts [artikelen 8.05, dertiende lid][ref3],
      [8.08, tiende lid][ref4], [8.09, eerste en tweede lid][ref5], en [8.10][ref6]. Een verzegeling van de
      afsluitorganen overeenkomstig artikel 8.08, tiende lid, wordt geacht overeen te komen met het afsluiten van de
      afsluitorganen in het lenssysteem, via welke het oliehoudende water overboord kan worden gepompt. De sleutel
      of sleutels daarvan moeten op een centrale als zodanig gekenmerkte plaats worden bewaard. Een bewakings- en
      controlesysteem voor olielozingen, overeenkomstig voorschrift 16 van de MARPOL 73/78, wordt geacht overeen te
      komen met het verzegelen van het afsluitorgaan overeenkomstig artikel 8.08, tiende lid. De aanwezigheid van een
      bewakings- en controlesysteem moet door een internationaal document inzake de voorkoming van verontreiniging van
      de zee (IOPP document) overeenkomstig de MARPOL 73/78 worden aangetoond. Blijkt uit het IOPP document dat het schip
      voorzien is van opslagtanks waarin al het aan boord aanwezige oliehoudende bilgewater en alle olieresten kunnen
      worden verzameld, dan wordt geacht dat aan artikel 8.09, tweede lid, is voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0041395#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0041395#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0041395#Artikel8
