  - number: '33.02'
    text: |-
      1. Vaartuigen die niet volledig aan de bepalingen van deze Standaard voldoen, moeten:

      a) daaraan volgens de overgangsbepalingen die worden vermeld in de onderstaande tabel, worden aangepast, en

      b) totdat de aanpassing heeft plaatsgevonden, voldoen aan de voorschriften van hoofdstukken 1 tot en met 12 van
      bijlage II van [Richtlijn 82/714/EEG](31982L0714).

      In geval van afgifte van een nieuw binnenschipcertificaat voor een vaartuig als bedoeld in
      [artikel 33.01, eerste lid][ref1], moet het communautair certificaat of een andere vergunning voor het in de vaart
      brengen als bewijs worden voorgelegd, het communautair certificaat of een andere vergunning voor het in de vaart
      brengen worden ingetrokken en onder nummer 52 in het nieuwe binnenschipcertificaat de datum van de afgifte van het
      dienovereenkomstige communautair certificaat of de andere vergunning voor het in de vaart brengen als volgt worden
      ingeschreven:

      ‘Een communautair certificaat werd overeenkomstig [richtlijn 82/714/EEG](31982L0714) werd afgegeven op: …’

      /

      ‘Een vergunning voor het in de vaart brengen overeenkomstig … werd afgegeven op: …’

      2. In de onderstaande tabel zijn de volgende definities van toepassing:

      ‘N.V.O.’: het voorschrift is niet van toepassing op reeds in bedrijf zijnde vaartuigen, tenzij de betreffende
      delen worden vervangen of omgebouwd, dat wil zeggen dat dit voorschrift slechts van toepassing is op *N*ieuwbouw,
      bij *V*ervanging of bij *O*mbouw van de betreffende delen of sectoren. Worden bestaande delen vervangen door delen
      welke in technische zin en bouwwijze gelijk zijn, dan wordt dit niet beschouwd als vervanging ‘V’ volgens deze
      overgangsbepalingen.

      ‘Afgifte of verlenging van het binnenschipcertificaat’: aan het voorschrift moet zijn voldaan bij de eerstvolgende
      afgifte of bij de eerstvolgende verlenging van het binnenschipcertificaat na de daarop aangegeven datum.











