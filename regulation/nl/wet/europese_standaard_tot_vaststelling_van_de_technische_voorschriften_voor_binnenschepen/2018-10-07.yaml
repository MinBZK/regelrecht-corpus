      2. In afwijking van eerste lid mag de diameter van de schijven het zesvoudige van de draaddiameter bedragen indien
      het staaldraad niet constant over de schijven loopt.

      3. De breeksterkte van het beslag (bijvoorbeeld sluitingen, ogen, spanschroeven, oogplaten, bouten, ringen en
      schakels) is in overeenstemming met de breeksterkte van het daaraan bevestigde staand of lopend want.

      4. De bevestiging van stag- en wantputtingen kan de daarop uitgeoefende krachten opnemen.

      5. Aan elk oog mag slechts een schakel en het daarbij behorende stag of want bevestigd zijn.

      6. De blokken van vallen en dirken zijn op een deugdelijke wijze aan de mast bevestigd, waarbij de hiertoe
      gebruikte draaiende hanenpoten in goede staat verkeren.

      7. De bevestiging van oogbouten, klampen, kikkers en nagelbanken is in overeenstemming met de daarop uitgeoefende
      belasting.
