  - number: '32.04'
    text: |-
      1. De bepalingen van dit artikel gelden aanvullend op de overgangsbepalingen van de [artikelen 32.02][ref1] en
      [32.03][ref2].

      2. Voor vaartuigen, waarvan het minste vrijboord overeenkomstig [artikel 4.04][ref3] van de op 31 maart 1983
      geldende voorschriften is vastgesteld, kan de Commissie van deskundigen op verzoek van de eigenaar het vrijboord
      vaststellen op grond van [artikel 4.03][ref4] van de op 1 januari 1995 geldende voorschriften.

      3. Vaartuigen, waarvan de kiel is gelegd vóór 1 juli 1983, behoeven niet te voldoen aan [hoofdstuk 10][ref5]
      van deze standaard. Deze vaartuigen moeten echter ten minste voldoen aan hoofdstuk 6 van het Reglement onderzoek
      schepen op de Rijn van de op 31 maart 1983 geldende voorschriften.

      4. [Artikel 19.06, derde lid, onder a tot en met e][ref6], en [artikel 19.12, derde lid, onder a][ref7], met
      betrekking tot de bepaling over de enige slanglengte, zijn slechts van toepassing op passagiersschepen waarvan de
      kiel is gelegd ná 30 september 1984, alsmede in geval van ombouw van de betreffende delen, uiterlijk bij verlenging
      van het certificaat van onderzoek voor Rijnschepen na 1 januari 2045.

      5. Indien dit voorschrift bij de vereisten aan de hoedanigheid

      a) van mobiele uitrustingsstukken verwijst naar een Europese of internationale norm, mogen na een nieuwe
      formulering of bewerking van die norm de betreffende uitrustingsstukken nog maximaal 20 jaar na de nieuwe
      formulering of bewerking van de norm verder worden gebruikt,

      b) van permanent geïnstalleerde uitrustingsstukken verwijst naar een Europese of internationale norm, mogen na een
      nieuwe formulering of bewerking van die norm de betreffende uitrustingsstukken nog verder worden gebruikt tot de
      vervanging of de ombouw van de betreffende sector.

      6. Voor snelle schepen, die beschickten over een geldig certificaat van onderzoek voor Rijnschepen, op 31 maart
      2003, moeten de bepalingen van [artikelen 29.01 derde lid][ref8], [29.02][ref9], [29.04][ref10], [29.05][ref11],
      [29.06, tweede lid][ref12], [29.10, tweede en derde lid][ref13] vanaf 1 januari 2023 worden toegepast.


