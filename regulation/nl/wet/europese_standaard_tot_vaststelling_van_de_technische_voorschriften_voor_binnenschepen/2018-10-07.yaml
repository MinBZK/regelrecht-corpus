  - number: '20.05'
    text: |-
      1. De tuigage is zodanig ingericht dat ontoelaatbaar schavielen vermeden wordt.

      2. Bij gebruik van een ander materiaal dan hout of bij gebruik van bijzondere tuigvormen moeten constructies
      worden toegepast die een gelijkwaardige veiligheid waarborgen als de in dit hoofdstuk voorgeschreven afmetingen
      en sterktes.

      Ter staving van voldoende sterkte moet:

      a) een sterkteberekening worden opgesteld; of

      b) de voldoende sterkte door een erkend classificatiebureau bevestigd zijn, of

      c) de dimensionering uit een erkende berekeningsmethode zijn afgeleid (bv. Middendorf; Kusk-Jensen).

      Een document ter staving van de voldoende sterkte moet aan de Commissie van deskundigen worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.05
  - number: '20.06'
    text: |-
      1. Het materiaal van alle rondhouten is van goede kwaliteit.

      2. Hout voor masten moet voldoen aan de volgende vereisten:

      a) vrij van concentraties van kwasten;

      b) binnen de vereiste diktes spintvrij;

      c) zoveel mogelijk rechtdradig;

      d) zo min mogelijk gedraaid gegroeid.

      3. Bij gebruik van de houtsoorten Pitchpine of Oregonpine (van de kwaliteit ‘clear and better’) geldt een reductie
      van 5% op de diameters in de tabellen van de [artikelen 20.07 tot en met 20.12][ref1].

      4. Indien masten en rondhouten zonder ronde diameter worden gebruikt, moeten deze van gelijkwaardige sterkte zijn.

      5. Mastdekken, mastkokers, bevestigingen op dek, op wrangen en aan stevens worden zodanig geconstrueerd, dat de
      daarop uitgeoefende krachten kunnen worden opgenomen of overgedragen op andere verbanddelen.

      6. Afhankelijk van de belasting en stabiliteit van het schip en de verdeling van het beschikbare zeiloppervlak
      kan de Commissie van deskundigen op de in de [artikelen 20.07 tot en met 20.12][ref2] voorgeschreven afmetingen
      een vermindering van de diameters van de rondhouten en eventueel minder strenge eisen voor de tuigage toestaan.
      Daarvoor moeten documenten ter staving overeenkomstig [artikel 20.05, tweede lid][ref3], worden overgelegd.

      7. Indien de slingertijd van het schip in seconden korter is dan 3/4 van de scheepsbreedte in meters, moeten de in
      de [artikelen 20.07 tot en met 20.12][ref4] voorgeschreven afmetingen worden verhoogd. Daarvoor moeten documenten
      ter staving overeenkomstig [artikel 20.05, tweede lid][ref5], worden overgelegd.

      8. In de tabellen van de [artikelen 20.07 tot en met 20.12][ref6] en [20.14][ref7] kunnen eventueel tussenwaarden
      worden geïnterpoleerd.


