  - number: '8.01'
    text: |-
      1. Werktuigen alsmede de bijbehorende installaties moeten volgens de regels van de techniek zijn ontworpen,
      uitgevoerd en geïnstalleerd.

      2. Drukvaten voor de bedrijfsvoering van het schip moeten door een erkend deskundige op de bedrijfszekerheid worden
      gekeurd:

      a) vóór de eerste ingebruikstelling;

      b) vóór een hernieuwde ingebruikstelling na een verandering of reparatie, en

      c) regelmatig, ten minste om de vijf jaar.

      De keuring bestaat uit een interne en externe controle. Voor persluchthouders die intern niet goed kunnen worden
      gecontroleerd of waarvan de staat bij de interne controle niet afdoend kan worden vastgesteld, moet bijkomend een
      niet-destructief onderzoek of een waterdrukcontrole worden uitgevoerd.

      Hiervan moet een verklaring worden afgegeven, ondertekend door de erkend deskundige die de keuring heeft verricht,
      en waarin de datum van de keuring is aangegeven.

      Andere installaties die regelmatige controle vereisen zoals stoomketels, andere drukvaten, alsmede hun toebehoren
      en liften moeten voldoen aan de voorschriften van één van de lidstaten.

      3. Er mogen alleen verbrandingsmotoren worden geïnstalleerd die brandstoffen gebruiken met een vlampunt boven 55
      °C.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel8.01
  - number: '8.02'
    text: |-
      1. Machineinstallaties moeten zo zijn ingericht en opgesteld, dat zij voor bediening en onderhoud voldoende
      toegankelijk zijn en personen, die ze moeten bedienen of onderhouden, niet in gevaar kunnen worden gebracht. Zij
      moeten kunnen worden beveiligd tegen onopzettelijke inbedrijfstelling.

      2. Aan de hoofd- en hulpmotoren alsmede de stoomketels en drukvaten moeten beschermende inrichtingen zijn
      aangebracht; hetzelfde geldt voor hun toebehoren.

      3. Aandrijvingen voor de pers- en zuigventilatoren moeten in geval van nood ook buiten de ruimte waar zij zich
      bevinden en buiten de machinekamer uitgeschakeld kunnen worden.

      4. Waar het noodzakelijk is moeten verbindingen van leidingen voor brandstof, smeerolie en oliën, die in
      krachtoverbrengingssystemen, schakel-, aandrijf- en verwarmingssystemen worden gebruikt, afgeschermd of op
      andere geschikte wijze zijn beschermd, om te vermijden dat deze vloeibare stoffen op hete vlakken, in de
      aanzuigkanalen van de machines of andere ontstekingsbronnen sproeien of uitlopen. Het aantal verbindingen in deze
      pijpleidingensystemen moet tot een minimum worden beperkt.

      5. Niet ingebouwde hogedrukbrandstofleidingen van dieselmotoren tussen de hogedrukbrandstofpompen en de
      inspuitsystemen moeten door een mantelbuissysteem worden beschermd, dat in geval van een lek in de hogedrukleiding,
      de uitlopende brandstof opvangt. In het mantelbuissysteem moet een lekbak zijn voorzien alsook inrichtingen die een
      alarmsignaal geven in geval van lekkage aan een brandstofleiding; voor machines met slechts twee cilinders is dit
      alarmsysteem echter niet vereist. Bij machines voor ankerlieren en spillen op open dek zijn geen mantelbuissystemen
      vereist.

      6. Isolaties van machineonderdelen moeten in overeenstemming zijn met [artikel 3.04, derde lid][ref1], tweede
      volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel3.04
