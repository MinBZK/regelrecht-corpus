  - number: '23.05'
    text: |-
      Schepen bestemd voor bouwwerkzaamheden hoeven niet met een bijboot te zijn uitgerust, indien

      a) ze niet zijn uitgerust met mechanische middelen tot voortbeweging, en

      b) op het werkterrein een andere bijboot beschikbaar is.

      Deze vrijstelling dient in het binnenschipcertificaat te worden vermeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.05
  - number: '24.01'
    text: |-
      1. Traditionele vaartuigen moeten volgens goed scheepsbouwgebruik zijn gebouwd, in overeenstemming met de stand van
      de techniek op de gekozen historische datum.

      De staat van het traditionele vaartuig qua bouw, inrichting en uitrusting moet minstens aan de nationale
      voorschriften van de lidstaat waar het traditionele vaartuig oorspronkelijk werd geëxploiteerd, op de gekozen
      historische datum, voldoen.

      2. Alle bouwonderdelen, inrichtingen en uitrustingen die niet tot de staat qua bouw, inrichting en uitrusting
      van de gekozen historische datum behoren, moeten aan de daarvoor geldende bepalingen van de [delen II][ref1] en
      [III][ref2] van deze standaard voldoen.

      3. Bij afwijkingen van de bepalingen van deze standaard worden door de Commissie van deskundigen compenserende
      vereisten bepaald, die de technische functie en de uiterlijke indruk van het traditionele vaartuig in aanmerking
      nemend, een gelijkwaardige veiligheid waarborgen. Afwijkingen zijn uitsluitend toegestaan indien hiertoe op grond
      van de historische aard een noodzaak bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
      [ref2]: https://wetten.overheid.nl/BWBR0041395
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel24.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
      - id: ref2
        bwb_id: BWBR0041395
  - number: '24.02'
    text: |-
      1. Voor de erkenning van een vaartuig als ‘traditioneel vaartuig’ moet

      a) een initieel onderzoek dat voorafgaat aan de eerste afgifte van een binnenschipcertificaat of

      b) een bijzonder onderzoek voor de afgifte van een gewijzigd binnenschipcertificaat na de ombouw of de wijziging
      van de bestemming van een vaartuig tot traditioneel vaartuig worden uitgevoerd.

      2. Aan de Commissie van deskundigen moeten met de aanvraag van het onderzoek, behalve de reglementair
      voorgeschreven bescheiden, de volgende documenten worden voorgelegd:

      a) een advies van een instantie voor monumentenzorg met de desbetreffende kennis of van een erkend deskundige
      voor traditionele vaartuigen, dat is opgesteld op grond van een inspectie die binnen een termijn van drie
      maanden vóór de indiening van de aanvraag is uitgevoerd, en waarin wordt bevestigd dat aan de eisen van
      [artikel 24.01, eerste lid][ref1], wordt voldaan en dat moet worden uitgegaan van een geschiktheid voor een gebruik
      als bedoeld in [artikel 1.01, lid 1.29][ref2], en het dientengevolge de moeite waard is het vaartuig te behouden;

      b) het gebruiksconcept;

      c) een veiligheidsconcept dat is gebaseerd op het in onderdeel b bedoelde gebruiksconcept;

      d) de uit de volgende delen bestaande documentatie van het traditionele vaartuig:

      aa) gegevens betreffende de staat qua bouw, inrichting en uitrusting van het voor het onderzoek aangeboden vaartuig
      door middel van beschrijvingen, tekeningen, foto’s en overige documenten;

      bb) lijst van de op de gekozen historische datum geldende voorschriften en kopieën daarvan, voor zover deze voor de
      motivering van de afwijkingen van de eisen van de delen II en III van deze standaard nodig zijn;

      cc) bewijs dat de staat qua bouw, inrichting en uitrusting geschikt is om het vaartuig als een traditioneel
      vaartuig te exploiteren;

      dd) krachtens deze standaard vereiste tekeningen, ontwerpen, berekeningen en bewijzen. Deze moeten overeenkomen met
      de stand van het vaartuig op de datum van de indiening van de aanvraag;

      ee) lijst van de afwijkingen van de staat van de bouw, inrichting en uitrusting overeenkomstig de in onderdeel aa
      bedoelde gegevens ten opzichte van de op de datum van de indiening van de aanvraag geldige technische voorschriften
      van deze standaard;

      ff) gegevens over de bemanning van het traditionele vaartuig op de gekozen historische datum.

      3. De aanvrager vermeldt de historische datum voor het traditionele vaartuig, waarbij deze datum niet vóór de datum
      van de eerste ingebruikneming van het vaartuig mag liggen. Bij de replica van een traditioneel vaartuig blijkt de
      historische datum uit het advies overeenkomstig het tweede lid, onderdeel a.

      4. Op grond van de bovengenoemde bescheiden en van het onderzoek als bedoeld in het eerste lid, wordt
      door de Commissie van deskundigen de geschiktheid overeenkomstig [artikel 1.01, lid 1.29][ref3], en
      [artikel 24.01][ref4] vastgesteld en de erkenning door de vermelding ‘traditioneel vaartuig’ onder nummer 2 van het
      binnenschipcertificaat ingeschreven.

      De geschiktheid mag hierbij niet worden vastgesteld in tegenspraak met de uitspraak van de erkend deskundige voor
      traditionele vaartuigen of met het advies zoals bedoeld in het tweede lid, onderdeel a.

      5. Buiten de vermelding ‘traditioneel vaartuig’ wordt de bijlage ‘traditioneel vaartuig’ volgens het model uit
      bijlage 3, deel V, afgegeven. De volgende aantekening moet onder nummer 52 van het binnenschipcertificaat worden
      gemaakt:

      ‘zie Bijlage traditioneel vaartuig’.

      6. Indien in de documentatie overeenkomstig het tweede lid, onderdeel d, onderdeel ee, of bij het onderzoek als
      bedoeld in het eerste lid, afwijkingen worden vastgesteld ten opzichte van de op de datum van aanvraag geldende
      versie van deze standaard

      a) mogen tijdens de vaart uitsluitend bemanningsleden of personen die zich om dienstredenen aan boord bevinden,
      zich aan boord ophouden en

      b) is de werking van vrij toegankelijke machines of mechanisch aangedreven inrichtingen uitsluitend toegestaan
      indien zich geen andere personen aan boord ophouden dan de bemanning of personen die zich om dienstredenen aan
      boord bevinden.

      De volgende aantekening wordt ingeschreven onder nummer 52 van het binnenschipcertificaat:

      ‘Andere personen dan de bemanning of dan personen die zich om dienstredenen aan boord bevinden, mogen zich
      uitsluitend aan boord ophouden, indien het vaartuig veilig gemeerd is en vrij toegankelijke machines en mechanisch
      aangedreven inrichtingen niet in werking zijn.’


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel24.01
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel1.01
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel1.01
      [ref4]: https://wetten.overheid.nl/BWBR0041395#Artikel24.01
