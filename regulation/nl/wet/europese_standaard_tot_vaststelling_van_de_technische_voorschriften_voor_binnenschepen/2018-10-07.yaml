  - number: '10.13'
    text: |-
      Voor oliebranderinstallaties, olie- en brandstofpompen, olie- en brandstofseparatoren en machinekamerventilatoren
      moeten buiten de opstellingsruimten nooduitschakeltoestellen op een centrale plaats aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.13
  - number: '10.14'
    text: |-
      1. Kabelinvoeren van apparaten moeten passend zijn voor de afmetingen en het type van de aan te sluiten kabels.

      2. Wandcontactdozen van verdeelsystemen met van elkaar afwijkende spanningen of frequenties moeten van
      verschillende uitvoering zijn.

      3. Schakelaars moeten alle niet geaarde geleiders van een stroomkring gelijktijdig schakelen. Bij niet geaarde
      netten zijn in stroomkringen van de verlichting voor verblijven, uitgezonderd was-, bad- en overige natte ruimten,
      eenpolige schakelaars toegestaan.

      4. Bij stroomsterkten van meer dan 16 A moeten de wandcontactdozen zodanig met een schakelaar worden vergrendeld,
      dat noch het insteken, noch het uittrekken van de stekker mogelijk is wanneer de contactbussen van de contactdoos
      onder spanning staan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.14
  - number: '10.15'
    text: |-
      1. Kabels moeten moeilijk ontvlambaar, zelfdovend en bestendig tegen water en olie zijn.

      In de verblijven kan de toepassing van andere kabeltypen door de Commissie van deskundigen worden toegestaan, mits
      deze kabels doeltreffend zijn beschermd, moeilijk ontvlambaar en zelfdovend zijn.

      Ter vaststelling van het moeilijk ontvlambaar zijn van elektrische kabels moet hetzij

      a) aan de vereisten van de Europese normenreeks EN 60332-1 en EN 60332-3 in de op 6 juli 2017 geldende versies of

      b) aan gelijkwaardige voorschriften van een van de lidstaten

      worden voldaan.

      2. Voor kracht- en verlichtingsinstallaties moeten de aders van de kabels een doorsnede van ten minste 1,5 mm2
      hebben.

      3. De metalen bewapening, afscherming en mantels van kabels mogen bij normaal gebruik niet als geleider of
      aardleiding dienen.

      4. Metalen bewapeningen en mantels van kabels van kracht- en verlichtingsinstallaties moeten ten minste aan één
      uiteinde geaard zijn.

      5. De doorsnede van de geleiders moet in overeenstemming zijn met de ten hoogste toegestane geleidertemperatuur
      (toelaatbare stroomsterkte) alsmede met het toelaatbare spanningsverlies. Dit spanningsverlies, optredend tussen
      het hoofdschakelbord en het meest ongunstige punt van de installatie, mag bij verlichtingsinstallaties niet meer
      dan 5% en voor kracht- en verwarmingsinstallaties niet meer dan 7% van de nominale spanning bedragen.

      6. Kabels moeten tegen het gevaar van mechanische beschadigingen beschermd zijn.

      7. Kabelbevestigingen moeten tegen mechanische belasting en tegen trekbelasting beschermd zijn.

      8. De doorvoeringen van kabels door schotten of dekken mogen de sterkte, dichtheid en de vereiste brandwerende
      eigenschappen (o.a. het niet brandbaar zijn, moeilijk ontbrandbaar zijn of brandbestendigheid) van de schotten of
      de dekken niet nadelig beïnvloeden.

      9. De uiteinden en verbindingen van alle leidingen moeten zo zijn vervaardigd dat de oorspronkelijke elektrische,
      mechanische, en de vereiste brandwerende eigenschappen (o.a. het niet brandbaar zijn, moeilijk ontbrandbaar zijn
      of brandbestendigheid) van de kabel gehandhaafd blijven. Hieraan is voldaan wanneer de uiteinden en verbindingen
      voldoen aan

      a) de internationale norm IEC 60092-352 : 2005 nummer 3.28 in verbinding met Bijlage D van de norm of

      b) een door de lidstaten als gelijkwaardig erkend voorschrift of norm.

      Het aantal kabelverbindingen moet tot een minimum worden beperkt.

      Bij gerepareerde of vervangen kabels wordt geacht aan de vereisten van de eerste zin te zijn voldaan indien de
      kabelverbindingen voldoen aan de internationale norm IEC 60092-352 : 2005 nummer 3.28 in verbinding met bijlage D
      van de norm of aan een door een lidstaat als gelijkwaardig erkend voorschrift.

      10. Kabels die naar in de hoogte verstelbare stuurhuizen worden gevoerd, moeten voldoende buigzaam zijn en van een
      isolatie zijn voorzien die voldoende buigzaam blijft tot een temperatuur van - 20 °C, alsmede bestand zijn tegen de
      inwerking van dampen, ultraviolette straling en ozon.

      11. De doorvoeringen van kabelbundels mogen de brandwerende eigenschappen van de afscheidingen niet nadelig
      beïnvloeden. Hieraan is voldaan wanneer de kabels voldoen aan de bepalingen van de Europese normenreeks EN 60332-
      3 in de op 6 juli 2017 geldende versie, of voldoen aan door een lidstaat als gelijkwaardig erkende voorschriften.
      Indien dit niet het geval is, moeten in lange doorvoeringen van kabelbundels (meer dan 6 m verticaal en 14 m
      horizontaal) brandwerende voorzieningen worden getroffen, voor zover de kabels niet volledig door kabelschachten
      omhuld zijn.

      12. Kabels die van een noodstroombron naar verbruikers leiden, moeten zoveel mogelijk in veilige zones worden
      gelegd.

      13. In zones met een verhoogde omgevingstemperatuur, moet de aanwezigheid van kabels worden vermeden. Indien dit
      niet mogelijk is,

      a) moet bij de bepaling van de toelaatbare stroomsterkte rekening worden gehouden met de omgevingstemperaturen, of

      b) moeten de kabels tegen beschadiging door hitte en vuur worden beschermd.

      14. Hoofd- en noodstroomverzorgingskabels mogen niet door dezelfde ruimte worden gelegd. De Commissie van
      deskundigen kan een uitzondering hierop toestaan, wanneer

      a) de hoofd- en noodstroomverzorgingskabels zo ver mogelijk van elkaar worden gelegd of

      b) de noodstroomverzorgingskabels brandbestendig zijn. Hieraan is voldaan wanneer zij voldoen aan de eisen van de
      internationale normenreeks IEC 60331 in de op 6 juli 2017 geldende versie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: '10.16'
    text: |-
      1. Verlichtingsarmaturen moeten zodanig zijn aangebracht, dat brandbare voorwerpen of constructiedelen niet door de
      uitgestraalde warmte in brand kunnen geraken.

      2. De verlichtingsarmaturen op het open dek moeten zodanig zijn geplaatst, dat de waarneembaarheid van de
      navigatielichten niet nadelig wordt beïnvloed.

      3. Indien in een machinekamer of een ketelruim twee of meer lichtpunten zijn aangebracht, moeten deze over
      ten minste twee stroomkringen zijn verdeeld. Dit geldt eveneens voor ruimten waarin koelmachines, hydraulische
      inrichtingen of elektromotoren zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.16
  - number: '10.17'
    text: |-
      1. Schakelborden voor navigatielantaarns moeten in het stuurhuis zijn geïnstalleerd. Zij moeten door een aparte
      kabel vanaf het hoofdschakelbord worden gevoed of door twee van elkaar onafhankelijke onderverdelingen kunnen
      worden verzorgd.

      2. Elke navigatielantaarn moet vanaf het navigatieschakelbord afzonderlijk gevoed, beveiligd en geschakeld kunnen
      worden.

      3. Het uitvallen van de controle-inrichtingen als bedoeld in [artikel 7.05, tweede lid][ref1], mag de werking van
      de bijbehorende navigatielantaarns niet nadelig beïnvloeden.

      4. Dicht bijeen geplaatste, bij elkaar behorende navigatielantaarns mogen gemeenschappelijk worden gevoed,
      beveiligd en geschakeld. De controle-inrichting moet dan echter het uitvallen van één der lantaarns kunnen
      signaleren. Twee in één armatuur boven elkaar geplaatste navigatielantaarns mogen niet gelijktijdig ingeschakeld
      kunnen zijn.


