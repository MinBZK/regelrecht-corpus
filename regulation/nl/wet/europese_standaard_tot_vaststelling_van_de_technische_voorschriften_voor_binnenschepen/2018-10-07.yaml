  - number: '28.03'
    text: |-
      1. Op vaartuigen met een lengte *L* van meer dan 110 m, met uitzondering van passagiers-schepen, zijn het tweede
      tot en met tiende lid van toepassing.

      2. De basisgegevens voor de stabiliteitsberekening – ledig scheepsgewicht en ligging gewichtszwaartepunt – moeten
      worden bepaald door een hellingproef overeenkomstig bijlage 1 van de IMO-Resolutie MSC.267(85).

      3. De aanvrager moet met een berekening aantonen dat de lekstabiliteit van het schip voldoende is. Hierbij
      moet voor de eindtoestand van het vollopen een berekening die berust op de procedure van het ‘wegvallen van het
      draagvermogen’, en voor de tussentoestanden van het vollopen een berekening die berust op het ‘toenemen van het
      gewicht’ worden gebruikt. Alle berekeningen moeten zodanig worden uitgevoerd dat daarbij aan trim en inzinking geen
      vaste waarden zijn toegekend.

      Het bewijs van voldoende drijfvermogen en stabiliteit van het schip in lekke toestand moet worden aangetoond bij
      een belading, die met de grootste inzinking van het schip overeenkomt en gelijkmatig over alle laadruimten is
      verdeeld, en bij maximale voorraden en een volle tank van het schip.

      Bij een ongelijksoortige lading, moet de stabiliteitsberekening worden gebaseerd op de meest ongunstige
      beladingstoestand. Deze stabiliteitsberekening moet aan boord worden bewaard.

      Hierbij moet voor de tussenstadia van het volstromen (25%, 50% en 75% van de eindtoestand van het volgestroomd zijn
      en, indien van toepassing, vlak vóór het volstromen uit dwarsrichting) en vóór de eindtoestand van het volgelopen
      zijn, onder de bovenstaande beladingcondities aan het rekenkundig bewijs van voldoende stabiliteit zijn voldaan.

      4. Voor de lekke toestand moeten de volgende uitgangspunten in acht worden genomen:

      a) Omvang van de schade aan een scheepszijde:

      langsscheeps: ten minste 0,10 *L*,

      dwarsscheeps: 0,59 m,

      verticaal: vanaf de scheepsbodem naar boven onbegrensd,

      b) Omvang van de schade aan de scheepsbodem:

      langsscheeps: ten minste 0,10 *L*,

      dwarsscheeps: 3,00 m,

      verticaal: vanaf de scheepsbodem naar boven 0,39 m, lensput uitgezonderd.

      c) Alle in de beschadigde zone aanwezige schotten zijn als lek te beschouwen, dat wil zeggen dat de schotindeling
      zo gekozen moet zijn dat het vaartuig ook bij het vollopen van twee of meer direct achter elkaar liggende
      afdelingen blijft drijven. Voor de hoofdmachinekamer behoeft slechts het drijfvermogen aangetoond te worden voor de
      ééncompartimentsstandaard, dat wil zeggen machinekamereindschotten worden als niet beschadigd beschouwd.

      Bij een bodembeschadiging moeten ook dwarsscheeps naast elkaar liggende afdelingen als volgelopen worden beschouwd.

      d) Permeabiliteit

      Er moet met een permeabiliteit van 95% worden gerekend.

      Wordt door een berekening aangetoond, dat de gemiddelde permeabiliteit van een compartiment kleiner is dan 95%, dan
      kan de berekende waarde worden aangehouden.

      De volgende waarden moeten ten minste worden bereikt:








                          Machinekamers en bedrijfsruimten


                          85%




                          Laadruimen


                          70%




                          Dubbele bodems, brandstoftanks, ballasttanks enz. en al naar gelang deze tanks uit hoofde van
      hun bestemming bij het in het vlak van de grootste inzinking liggende vaartuig als vol of als ledig moeten worden
      aangenomen


                          0 of 95%.






      e) Voor de berekening van het effect van de vrije oppervlakken bij alle tussenstadia van het volstromen wordt
      uitgegaan van het bruto grondvlak van de beschadigde ruimten.

      5. Bij alle tussenstadia van het vollopen als bedoeld in het derde lid moet aan de volgende criteria worden
      voldaan:

      a) De hoek van de slagzij *φ* van de evenwichtssituatie van het betreffende tussenstadium mag niet meer bedragen
      dan 15° (5° bij niet vastgezette containers).

      b) Afgezien van de slagzij vanuit de evenwichtssituatie van het betreffende tussenstadium moet het positieve bereik
      van de kromme van de armen van statische stabiliteit een oprichtende arm van statische stabiliteit aangeven van
      *GZ* ≥ 0,02 *m* (0,03 m bij niet vastgezette containers), voordat de eerste onbeschermde opening onder water komt
      dan wel een hoek van de slagzij *φ* van 27° bereikt wordt (15° bij niet vastgezette containers).

      c) Niet waterdichte openingen mogen niet onder water komen voordat de hoek van de slagzij van de evenwichtssituatie
      van het betreffende tussenstadium is bereikt.

      6. Bij de eindtoestand van het volgelopen zijn moet aan de volgende criteria worden voldaan:

      a) De onderzijde van niet waterdicht afsluitbare openingen (bijv. van deuren, ramen, toegangsluiken) moet in de
      eindtoestand van het volgelopen zijn ten minste 0,10 m boven het vlak van inzinking liggen.

      b) De hoek van de slagzij *φ* van de evenwichtssituatie mag niet meer bedragen dan 12° (5° bij niet vastgezette
      containers).

      c) Afgezien van de slagzij vanuit de evenwichtssituatie moet het positieve bereik van de kromme van de armen van
      statische stabiliteit een oprichtende arm van statische stabiliteit aangeven van *GZ* ≥ 0,05 *m* en het vlak onder
      de kromme moet ten minste 0,0065 *m* • *rad* bereiken, voordat de eerste onbeschermde opening onder water komt dan
      wel een hoek van de slagzij *φ* van 27° bereikt wordt. (10° bij niet vastgezette containers).

      d) Indien niet waterdichte openingen onder water komen voordat de evenwichtssituatie is bereikt, wordt het vollopen
      van de ruimten die daarmee in verbinding staan in de berekening van de lekstabiliteit meegenomen.

      7. Wanneer doorstroomopeningen in de langsschotten worden voorzien ten behoeve van vermindering van asymmetrisch
      volstromen, moet aan de volgende voorwaarden worden voldaan:

      a) voor de berekening van het uit dwarsrichting volstromen wordt IMO-Resolutie A.266 (VIII) toegepast;

      b) ze moeten automatisch functioneren;

      c) ze mogen niet van afsluitmechanismen zijn voorzien;

      d) de tijd die nodig is voor een volledige vereffening mag niet meer bedragen dan 15 minuten.

      8. Indien openingen, waardoor onbeschadigde afdelingen alsnog vol kunnen lopen, waterdicht kunnen worden
      afgesloten, dan moeten deze afsluitinrichtingen aan beide zijden goed leesbaar van het volgende opschrift zijn
      voorzien:

      ‘Opening na doorgang direct sluiten’.

      9. Het rekenkundig bewijs als bedoeld in het derde tot en met zevende lid wordt geacht te zijn geleverd wanneer
      lekstabiliteitsberekeningen overeenkomstig Deel 9 van het ADN, met een positief resultaat worden overgelegd.

      10. Indien het noodzakelijk is om aan de voorwaarden van het derde lid te voldoen moet het vlak van de grootste
      inzinking opnieuw worden vastgesteld.
