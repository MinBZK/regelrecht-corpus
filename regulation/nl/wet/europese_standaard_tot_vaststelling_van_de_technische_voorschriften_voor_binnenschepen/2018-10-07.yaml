        bwb_id: BWBR0041395
        artikel: '32'
        hoofdstuk: '32'
  - number: 32.03.2
    text: |-
      In de onderstaande tabel zijn de volgende definities van toepassing: ‘V.O.’: Het voorschrift is niet van
      toepassing op reeds in bedrijf zijnde vaartuigen, tenzij de betreffende delen worden vervangen of omgebouwd,
      dat wil zeggen dat dit voorschrift slechts van toepassing is bij *V*ervanging of bij *O*mbouw van de betreffende
      delen of sectoren. Worden bestaande delen vervangen door delen welke in technische zin en bouwwijze gelijk zijn,
      dan wordt dit niet beschouwd als vervanging ‘V’ volgens deze overgangsbepalingen. ‘Afgifte of verlenging van het
      binnenschipcertificaat’: aan het voorschrift moet zijn voldaan bij de eerstvolgende afgifte of bij de eerstvolgende
      verlenging van het binnenschipcertificaat na de daarop aangegeven datum.









