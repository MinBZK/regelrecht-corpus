  - number: '31.03'
    text: |-
      Standaard S1 en bovendien een uitrusting met

      1. Voor alleenvarende motorschepen:

      een vanuit de stuurstelling bedienbare boegschroefinstallatie;

      2. Voor motorschepen, die gekoppelde vaartuigen voortbewegen:

      een vanuit de stuurstelling bedienbare boegschroefinstallatie;

      3. Voor motorschepen, die een duwstel, bestaande uit het motorschip en een vaartuig ervoor, voortbewegen:

      hydraulisch of elektrisch aangedreven koppellieren. Deze uitrusting is echter niet vereist, wanneer het vaartuig
      aan de kop van het duwstel met een boegschroefinstallatie is uitgerust, die vanuit de stuurstelling van het duwende
      motorschip te bedienen is;

      4. Voor duwboten, die een duwstel voortbewegen:

      hydraulisch of elektrisch aangedreven koppellieren. Deze uitrusting is echter niet vereist, wanneer het vaartuig
      aan de kop van het duwstel met een boegschroefinstallatie is uitgerust, die vanuit de stuurstelling van het duwende
      duwboot te bedienen is;

      5. Voor passagiersschepen:

      een vanuit de stuurstelling bedienbare boegschroefinstallatie. Deze uitrusting is echter niet vereist, indien de
      voortstuwingsinstallatie en de stuurinrichting van het passagiersschip gelijkwaardige manoeuvreereigenschappen
      waarborgen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.03
  - number: '32.01'
    text: |-
      1. De [artikelen 32.02 tot en met 32.04][ref1] zijn slechts van toepassing op vaartuigen voorzien van een geldig
      certificaat van onderzoek voor Rijnschepen,

      a) dat voor de eerste maal overeenkomstig het op 31 december 1994 geldende Reglement onderzoek schepen op de Rijn
      werd afgegeven, of

      b) dat ten minste eenmaal werd vernieuwd voor 31 december 1994, of

      c) die op 31 december 1994 in aanbouw waren dan wel verbouwd werden.

      2. Op vaartuigen die niet onder het eerste lid vallen, is [artikel 32.05][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel32.02
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel32.05
