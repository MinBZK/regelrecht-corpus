                     1 Scheidingsvlakken tussen controleposten en binnen het schip gelegen verzamelruimten moeten voldoen
      aan type A0, in het geval van buiten gelegen verzamelruimten echter aan type B15. 2 Scheidingsvlakken tussen
      verblijfsruimten en binnen het schip gelegen verzamelruimten moeten voldoen aan type A30, in het geval van buiten
