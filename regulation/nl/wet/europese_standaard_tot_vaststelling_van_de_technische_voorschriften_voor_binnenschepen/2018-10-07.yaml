                      Grens-/controlewaarden en typegoedkeuringen


                      N.V.O. voor zover
                      a) de grens- en controlewaarden de waarden van fase II met niet meer dan de factor 2 overschrijden;
                      b) de boordzuiveringsinstallatie over een certificaat van de fabrikant of een erkend deskundige
      beschikt, waarin bevestigd wordt dat de installatie de voor het schip kenmerkende belasting aankan, en
                      c) een zuiveringsslibmanagement beschikbaar is, dat aan de voorwaarden voor het gebruik van een
      boordzuiveringsinstallatie op een passagiersschip voldoet.





                      Boordzuiveringsinstallaties die vanaf 1 december 2011 overeenkomstig de voorschriften van Besluit
      2010-II-27 van de CCR (Fase II) zijn goedgekeurd, mogen verder worden ingebouwd en gebruikt.





