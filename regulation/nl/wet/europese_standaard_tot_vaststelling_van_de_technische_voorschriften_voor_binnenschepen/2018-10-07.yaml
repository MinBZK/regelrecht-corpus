  - number: '19.11'
    text: |-
      1. De technische geschiktheid van materialen en onderdelen op het gebied van brandbescherming moet worden
      vastgesteld door een geaccrediteerd testinstituut op grond van geschikte testmethoden.

      a) Het testinstituut moet voldoen aan:

      aa) de code voor brandtestprocedures, of

      bb) de Europese norm EN ISO/IEC 17025 : 2005.

      b) Erkend als testmethoden ten behoeve van het vaststellen van de onbrandbaarheid van materialen zijn:

      aa) bijlage 1, deel 1, van de code voor brandtestprocedures, en

      bb) gelijkwaardige voorschriften van een lidstaat.

      c) Erkend als testmethoden ten behoeve van het vaststellen van het moeilijk ontvlambaar zijn van materialen zijn:

      aa) de eisen overeenkomstig bijlage 1, deel 5 (ontvlambaarheidstest van het oppervlak – test van
      bekledingsmaterialen en materialen voor dekbedekking), deel 7 (test van stofferingen en kunststoffen), deel 8 (test
      van gestoffeerd meubilair) en deel 9 (test van beddengoed) van de code voor brandtestprocedures en

      bb) gelijkwaardige voorschriften van een lidstaat.

      d) Erkend als testmethoden ten behoeve van het vaststellen van brandbestendigheid zijn:

      aa) bijlage 1, deel 3, van de code voor brandtestprocedures, en

      bb) gelijkwaardige voorschriften van een lidstaat.

      e) De Commissie van deskundigen kan in overeenstemming met de code voor brandtestprocedures een test voor een
      modelscheidingsvlak voorschrijven teneinde zeker te stellen dat aan de voorschriften inzake weerstandsvermogen en
      temperatuurverhoging, bedoeld in het tweede lid, is voldaan.

      2. Scheidingsvlakken

      a) Scheidingsvlakken van ruimten moeten worden uitgevoerd in overeenstemming met de volgende tabellen:

      aa) Tabel voor scheidingsvlakken van ruimten waarin geen sprinklerinstallaties als bedoeld in [artikel 13.04][ref1]
