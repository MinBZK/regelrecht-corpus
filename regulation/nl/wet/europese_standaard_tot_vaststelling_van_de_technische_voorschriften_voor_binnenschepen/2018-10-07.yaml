  - number: 27.01.1
    text: |-
      Indien overeenkomstig de toepasselijke scheepvaartpolitiereglementen van de lidstaten voor schepen die containers
      vervoeren stabiliteitsbescheiden zijn vereist, is dit hoofdstuk van toepassing. De stabiliteitsdocumenten moeten
      door een Commissie van deskundigen worden geverifieerd en van haar waarmerk worden voorzien.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.01
  - number: 27.01.2
    text: |-
      De stabiliteitsdocumenten moeten de schipper begrijpelijke informatie bieden over de stabiliteit van het schip in
      elke voorkomende beladingstoestand. De stabiliteitsdocumenten moeten ten minste bevatten:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.01
  - number: 27.01.2.a)
    text: |-
      gegevens betreffende de toelaatbare stabiliteitscoëfficiënten, de toegestane of de toegestane zwaartepuntshoogten
      van de lading;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.01
  - number: 27.01.2.b)
    text: gegevens betreffende de ruimten die met ballastwater kunnen worden gevuld;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.01
  - number: 27.01.2.c)
    text: formulieren voor de stabiliteitscontrole;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.01
  - number: 27.01.2.d)
    text: een berekeningsvoorbeeld of handleiding voor de schipper.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.01
  - number: 27.01.3
    text: |-
      Indien containers op een schip al dan niet vastgezet kunnen worden vervoerd, zijn voor het vervoer van niet-
      vastgezette en voor het vervoer van vastgezette containerladingen afzonderlijke berekeningsmethoden vereist voor
      het bewijs van stabiliteit.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.01
  - number: 27.01.4
    text: |-
      Een containerlading geldt alleen als vastgezet wanneer de afzonderlijke containers door middel van geleiders
      of spaninrichtingen hecht met de scheepsromp zijn verbonden en zij tijdens het varen niet van plaats kunnen
      veranderen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.01
  - number: 27.02.1
    text: |-
      Voor niet-vastgezette containers moet bij elke berekeningsmethode om de stabiliteit van het schip vast te stellen
      van de volgende criteria worden uitgegaan:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.1.a)
    text: De metacentrumhoogte mag niet minder zijn dan 1,00 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.1.b)
    text: |-
      Onder de gelijktijdige invloed van de middelpuntvliedende kracht bij het draaien van het schip, de winddruk en de
      vrije vloeistofoppervlakken mag de optredende slagzij niet meer zijn dan 5° en mag de zijde van het dek niet in het
      water komen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.1.c)
    text: |-
      De arm van het moment veroorzaakt door de middelpuntvliedende kracht bij het draaien van het schip wordt berekend
      volgens de formule: In deze formule betekent: *c* coëfficiënt (*c* = 0,04) [s2/m]; *v* de grootste snelheid van het
      schip ten opzichte van het water [m/s]; de hoogte van het gewichtszwaartepunt van het geladen schip boven de basis
      [m]; *T'* de diepgang van het geladen schip [m].
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.1.d)
    text: |-
      De arm van het moment veroorzaakt door de winddruk wordt berekend volgens de formule: In deze formule betekent:
      *c* coëfficiënt (*c* = 0,025) [t/m2]; *A'* het lateraal oppervlak van het geladen schip boven water [m2]; *D'* het
      deplacement van het geladen schip [t]; *l* de afstand van het zwaartepunt van het lateraal oppervlak A' boven de
      waterlijn [m]; *T'* de diepgang van het geladen schip [m].
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.1.e)
    text: |-
      De arm van het moment veroorzaakt door de vrije vloeistofoppervlakken van regen- en restwater in het laadruim of
      de dubbele bodem wordt berekend volgens de formule: In deze formule betekent: *c* coëfficiënt (*c*) = 0,015 [t/
      m2]; *b* de breedte van het desbetreffende ruim of ruimgedeelte [m]; *l* de lengte van het desbetreffende ruim of
      ruimgedeelte [m]; *D'* het deplacement van het geladen schip [t].
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.1.f)
    text: Voor elke beladingstoestand moet met de halve voorraad aan brandstof en drinkwater worden gerekend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.2
    text: |-
      De stabiliteit van een met niet-vastgezette containers geladen schip wordt geacht voldoende te zijn wanneer
      de aanwezige gelijk aan of kleiner is dan volgens de volgende formules. Daarbij moet worden berekend voor
      verschillende verplaatsingen over het gehele diepgangsbereik.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.2.a)
    text: Voor mag geen kleinere waarde dan (11,5 worden genomen 11,5 = 1/tan5°).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.2.b)
    text: |-
      De kleinere waarde voor uit de formule a of b is doorslaggevend. In deze formules betekent: de maximaal toelaatbare
      hoogte van het gewichtszwaartepunt van het geladen schip boven de basis [m]; de hoogte van het metacentrum boven
      de basis [m] volgens de benaderingsformule in het derde lid; *F* het voorhanden vrijboord op 1/2 van de lengte *L*
      [m]; *Z* coëfficiënt voor de middelpuntvliedende kracht bij het draaien van het schip *v* de grootste snelheid van
      het schip ten opzichte van het water [m/s]; *T* gemiddelde diepgang [m]; *h* de arm van het moment veroorzaakt door
      de zijdelingse winddruk als bedoeld in het eerste lid, onderdeel d [m]; *h* som van de momenten veroorzaakt door de
      vrije vloeistofoppervlakken als bedoeld in het eerste lid, onderdeel e [m].
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.3
    text: |-
      Benaderingsformule voor Indien geen carènediagram ter beschikking is, kan voor de berekening volgens het tweede lid
      en artikel 27.03, tweede lid, de waarde van met behulp van bijvoorbeeld de onderstaande benaderingsformules worden
      berekend:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.3.a)
    text: voor schepen met een pontonvorm
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.02.3.b)
    text: voor andere schepen
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.02
  - number: 27.03.1
    text: |-
      Voor vastgezette containers moet bij elke berekeningsmethode om de stabiliteit van het schip vast te stellen van de
      volgende criteria worden uitgegaan:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.03
  - number: 27.03.1.a)
    text: De metacentrumhoogte mag niet minder zijn dan 0,50 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.03
  - number: 27.03.1.b)
    text: |-
      Onder de gelijktijdige invloed van de middelpuntvliedende kracht bij het draaien van het schip, de winddruk en de
      vrije vloeistofoppervlakken mag geen opening van de scheepsromp onder water komen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.03
  - number: 27.03.1.c)
    text: |-
      De armen van de momenten veroorzaakt door de middelpuntvliedende kracht bij het draaien van het
      schip, door de winddruk en de vrije vloeistofoppervlakken worden berekend volgens de formules van
      [artikel 27.02, eerste lid, onderdelen c, d en e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel27
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.03
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '27'
        hoofdstuk: '27'
  - number: 27.03.1.d)
    text: Voor elke beladingstoestand moet met de halve voorraad aan brandstof en drinkwater worden gerekend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.03
  - number: 27.03.2
    text: |-
      De stabiliteit van een met vastgezette containers geladen binnenschip wordt geacht voldoende te zijn, wanneer
      de aanwezige waarde gelijk aan of kleiner is dan volgens de volgende formules. Daarbij moet worden berekend voor
      verschillende verplaatsingen over het gehele diepgangsbereik.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.03
  - number: 27.03.2.a)
    text: Voor mag geen kleinere waarde dan 6,6 worden genomen en voor geen kleinere waarde dan 0.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.03
  - number: 27.03.2.b
    text: |-
      De kleinste waarde voor uit de formule a) of b) is doorslaggevend. In de formules betekent: *I* het
      dwarstraagheidsmoment van de waterlijn bij *T* [m4], overeenkomstig de benaderingsformule van het derde lid; *i*
      het dwarstraagheidsmoment van de waterlijn evenwijdig aan de basis bij een diepgang van ∀ de waterverplaatsing van
      het schip bij *T* [m3]; *F'* het denkbeeldige vrijboord waarbij de kleinste van de beide waarden dient te worden
      genomen; *a* verticale afstand van de onderkant van de bij een helling het eerst onder water komende opening
      tot de waterlijn in rechte stand van het schip [m]; *b* de afstand van deze opening tot hart schip [m]; *H'* de
      denkbeeldige holte *q* de som der inhouden van dekhuizen, luiken, trunks en andere opbouwen tot een hoogte van
      maximaal 1,00 m boven *H*, of tot de laagste opening van de desbetreffende ruimte, waarbij de kleinste waarde
      kleiner maatgevend is. Ruimten gelegen op minder dan 0,05 *L* van de scheepseinden blijven buiten beschouwing [m3].
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.03
  - number: 27.03.3
    text: |-
      Benaderingsformule voor I Indien geen carènediagram ter beschikking is, kan voor de berekening volgens het tweede
      lid de waarde van het dwarstraagheidsmoment van de waterlijn l met behulp van de onderstaande benaderingsformules
      worden berekend:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.03
  - number: 27.03.3.a)
    text: voor schepen met een pontonvorm
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.03
  - number: 27.03.3.b)
    text: voor andere schepen
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.03
  - number: '27.04'
    text: |-
      De methode voor de stabiliteitsbeoordeling kan aan de in [artikel 27.01, tweede lid][ref1], bedoelde documenten
      worden ontleend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel27
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel27.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '27'
        hoofdstuk: '27'
  - number: '28.01'
    text: |-
      Op vaartuigen met een lengte *L* van meer dan 110 m zijn, behalve [delen II][ref1] en [III][ref2], de
      [artikelen 28.02 tot en met 28.04][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041395
      [ref2]: https://wetten.overheid.nl/BWBR0041395
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel28
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
      - id: ref2
        bwb_id: BWBR0041395
      - id: ref3
        bwb_id: BWBR0041395
        artikel: '28'
        hoofdstuk: '28'
  - number: '28.02'
    text: |-
      De voldoende sterkte van de scheepsromp als bedoeld in [artikel 3.02, eerste lid, onderdeel a][ref1], (sterkte in
      langs- en dwarsrichting alsmede plaatselijke sterkte) moet worden aangetoond door een verklaring van een erkend
      classificatiebureau.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel3
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '3'
        hoofdstuk: '3'
  - number: 28.03.1
    text: |-
      Op vaartuigen met een lengte *L* van meer dan 110 m, met uitzondering van passagiers-schepen, zijn het tweede tot
      en met tiende lid van toepassing.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.2
    text: |-
      De basisgegevens voor de stabiliteitsberekening – ledig scheepsgewicht en ligging gewichtszwaartepunt – moeten
      worden bepaald door een hellingproef overeenkomstig bijlage 1 van de IMO-Resolutie MSC.267(85).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.3
    text: |-
      De aanvrager moet met een berekening aantonen dat de lekstabiliteit van het schip voldoende is. Hierbij moet
      voor de eindtoestand van het vollopen een berekening die berust op de procedure van het ‘wegvallen van het
      draagvermogen’, en voor de tussentoestanden van het vollopen een berekening die berust op het ‘toenemen van het
      gewicht’ worden gebruikt. Alle berekeningen moeten zodanig worden uitgevoerd dat daarbij aan trim en inzinking
      geen vaste waarden zijn toegekend. Het bewijs van voldoende drijfvermogen en stabiliteit van het schip in lekke
      toestand moet worden aangetoond bij een belading, die met de grootste inzinking van het schip overeenkomt en
      gelijkmatig over alle laadruimten is verdeeld, en bij maximale voorraden en een volle tank van het schip. Bij een
      ongelijksoortige lading, moet de stabiliteitsberekening worden gebaseerd op de meest ongunstige beladingstoestand.
      Deze stabiliteitsberekening moet aan boord worden bewaard. Hierbij moet voor de tussenstadia van het volstromen
      (25%, 50% en 75% van de eindtoestand van het volgestroomd zijn en, indien van toepassing, vlak vóór het volstromen
      uit dwarsrichting) en vóór de eindtoestand van het volgelopen zijn, onder de bovenstaande beladingcondities aan het
      rekenkundig bewijs van voldoende stabiliteit zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.4
    text: 'Voor de lekke toestand moeten de volgende uitgangspunten in acht worden genomen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.4.a)
    text: |-
      Omvang van de schade aan een scheepszijde: langsscheeps: ten minste 0,10 *L*, dwarsscheeps: 0,59 m, verticaal:
      vanaf de scheepsbodem naar boven onbegrensd,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.4.b)
    text: |-
      Omvang van de schade aan de scheepsbodem: langsscheeps: ten minste 0,10 *L*, dwarsscheeps: 3,00 m, verticaal: vanaf
      de scheepsbodem naar boven 0,39 m, lensput uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.4.c)
    text: |-
      Alle in de beschadigde zone aanwezige schotten zijn als lek te beschouwen, dat wil zeggen dat de schotindeling
      zo gekozen moet zijn dat het vaartuig ook bij het vollopen van twee of meer direct achter elkaar liggende
      afdelingen blijft drijven. Voor de hoofdmachinekamer behoeft slechts het drijfvermogen aangetoond te worden voor
      de ééncompartimentsstandaard, dat wil zeggen machinekamereindschotten worden als niet beschadigd beschouwd. Bij een
      bodembeschadiging moeten ook dwarsscheeps naast elkaar liggende afdelingen als volgelopen worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.4.d)
    text: |-
      Permeabiliteit Er moet met een permeabiliteit van 95% worden gerekend. Wordt door een berekening aangetoond, dat de
      gemiddelde permeabiliteit van een compartiment kleiner is dan 95%, dan kan de berekende waarde worden aangehouden.
      De volgende waarden moeten ten minste worden bereikt:






                          Machinekamers en bedrijfsruimten


                          85%




                          Laadruimen


                          70%




                          Dubbele bodems, brandstoftanks, ballasttanks enz. en al naar gelang deze tanks uit hoofde van
      hun bestemming bij het in het vlak van de grootste inzinking liggende vaartuig als vol of als ledig moeten worden
      aangenomen


                          0 of 95%.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.4.e)
    text: |-
      Voor de berekening van het effect van de vrije oppervlakken bij alle tussenstadia van het volstromen wordt
      uitgegaan van het bruto grondvlak van de beschadigde ruimten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.5
    text: 'Bij alle tussenstadia van het vollopen als bedoeld in het derde lid moet aan de volgende criteria worden voldaan:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.5.a)
    text: |-
      De hoek van de slagzij *φ* van de evenwichtssituatie van het betreffende tussenstadium mag niet meer bedragen dan
      15° (5° bij niet vastgezette containers).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.5.b)
    text: |-
      Afgezien van de slagzij vanuit de evenwichtssituatie van het betreffende tussenstadium moet het positieve bereik
      van de kromme van de armen van statische stabiliteit een oprichtende arm van statische stabiliteit aangeven van
      *GZ* ≥ 0,02 *m* (0,03 m bij niet vastgezette containers), voordat de eerste onbeschermde opening onder water komt
      dan wel een hoek van de slagzij *φ* van 27° bereikt wordt (15° bij niet vastgezette containers).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.5.c)
    text: |-
      Niet waterdichte openingen mogen niet onder water komen voordat de hoek van de slagzij van de evenwichtssituatie
      van het betreffende tussenstadium is bereikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.6
    text: 'Bij de eindtoestand van het volgelopen zijn moet aan de volgende criteria worden voldaan:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.6.a)
    text: |-
      De onderzijde van niet waterdicht afsluitbare openingen (bijv. van deuren, ramen, toegangsluiken) moet in de
      eindtoestand van het volgelopen zijn ten minste 0,10 m boven het vlak van inzinking liggen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.6.b)
    text: |-
      De hoek van de slagzij *φ* van de evenwichtssituatie mag niet meer bedragen dan 12° (5° bij niet vastgezette
      containers).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.6.c)
    text: |-
      Afgezien van de slagzij vanuit de evenwichtssituatie moet het positieve bereik van de kromme van de armen van
      statische stabiliteit een oprichtende arm van statische stabiliteit aangeven van *GZ* ≥ 0,05 *m* en het vlak onder
      de kromme moet ten minste 0,0065 *m* • *rad* bereiken, voordat de eerste onbeschermde opening onder water komt dan
      wel een hoek van de slagzij *φ* van 27° bereikt wordt. (10° bij niet vastgezette containers).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.6.d)
    text: |-
      Indien niet waterdichte openingen onder water komen voordat de evenwichtssituatie is bereikt, wordt het vollopen
      van de ruimten die daarmee in verbinding staan in de berekening van de lekstabiliteit meegenomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.7
    text: |-
      Wanneer doorstroomopeningen in de langsschotten worden voorzien ten behoeve van vermindering van asymmetrisch
      volstromen, moet aan de volgende voorwaarden worden voldaan:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.7.a)
    text: voor de berekening van het uit dwarsrichting volstromen wordt IMO-Resolutie A.266 (VIII) toegepast;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.7.b)
    text: ze moeten automatisch functioneren;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.7.c)
    text: ze mogen niet van afsluitmechanismen zijn voorzien;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.7.d)
    text: de tijd die nodig is voor een volledige vereffening mag niet meer bedragen dan 15 minuten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.8
    text: |-
      Indien openingen, waardoor onbeschadigde afdelingen alsnog vol kunnen lopen, waterdicht kunnen worden afgesloten,
      dan moeten deze afsluitinrichtingen aan beide zijden goed leesbaar van het volgende opschrift zijn voorzien:
      ‘Opening na doorgang direct sluiten’.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.9
    text: |-
      Het rekenkundig bewijs als bedoeld in het derde tot en met zevende lid wordt geacht te zijn geleverd wanneer
      lekstabiliteitsberekeningen overeenkomstig Deel 9 van het ADN, met een positief resultaat worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.03.10
    text: |-
      Indien het noodzakelijk is om aan de voorwaarden van het derde lid te voldoen moet het vlak van de grootste
      inzinking opnieuw worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.03
  - number: 28.04.1
    text: 'Vaartuigen met een lengte *L* van meer dan 110 m moeten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.1.a)
    text: |-
      beschikken over een meerschroefsaandrijving met ten minste twee van elkaar onafhankelijke aandrijfmotoren
      met eenzelfde vermogen en een vanuit het stuurhuis bedienbare boegschroefinstallatie die ook werkt indien het
      vaartuig niet geladen is; of beschikken over een enkelschroefsaandrijving en een vanuit het stuurhuis bedienbare
      boegschroefinstallatie. De boegschroefinstallatie moet voorzien zijn van een eigen energieverzorging, ook werken
      indien het vaartuig niet geladen is en bij uitval van de hoofdaandrijving het voortbewegen op eigen kracht mogelijk
      maken;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.1.b)
    text: |-
      beschikken over een navigatieradarinstallatie met bochtaanwijzer als bedoeld in [artikel 7.06, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 28.04.1.c)
    text: |-
      beschikken over een vast ingebouwde lensinrichting als bedoeld in [artikel 8.08][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel8
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
  - number: 28.04.1.d)
    text: voldoen aan de eisen van artikel 31.09, eerste lid, onderdeel 1.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.2
    text: |-
      In afwijking van het eerste lid en rekening houdend met de in de lidstaten geldende politievoorschriften op
      sommige gedeelten van het vaarwater, voor vaartuigen met een lengte *L* van meer dan 110 m – met uitzondering van
      passagiersschepen – die:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.2.a)
    text: aan de voorschriften van eerste lid, onderdelen a tot en met d voldoen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.2.b)
    text: |-
      in geval van averij in het middelste derde deel van het vaartuig, zonder dat de inzet van zwaar bergingsmaterieel
      noodzakelijk is, kunnen worden gedeeld, waarbij de gedeelde stukken van het vaartuig na het delen moeten kunnen
      blijven drijven;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.2.c)
    text: |-
      over een bewijs van een erkend classificatiebureau beschikken, waarmee het drijfvermogen, de trimsituatie en
      de stabiliteit van de gedeelde stukken van het schip worden aangetoond en waaruit tevens blijkt vanaf welke
      beladingstoestand het drijfvermogen van de beide delen niet meer gewaarborgd is, waarbij in dit laatste geval het
      bewijs aan boord aanwezig moet zijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.2.d)
    text: |-
      als dubbelwandig schip volgens het ADN zijn gebouwd. Motorschepen moeten aan 9.1.0.91 tot en met 9.1.0.95 en
      tankschepen aan 9.3.2.11.7 en 9.3.2.13 tot en met 9.3.2.15 van Deel 9 van het ADN voldoen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.2.e)
    text: over een meerschroefsaandrijving overeenkomstig het eerste lid, onderdeel a, eerste alinea, beschikken;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.3
    text: |-
      In afwijking van het eerste lid en rekening houdend met de in de lidstaten geldende politievoorschriften op sommige
      gedeelten van het vaarwater, voor passagiersschepen met een lengte *L* van meer dan 110 m, die:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.3.a)
    text: aan de voorschriften van eerste lid, onderdelen a tot en met d voldoen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.3.b)
    text: |-
      onder toezicht van een erkend classificatiebureau voor de hoogste klasse daarvan zijn gebouwd of omgebouwd, hetgeen
      moet worden bevestigd door een verklaring van het classificatiebureau en waarbij de lopende klasse niet vereist is;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.3.c)
    text: |-
      hetzij een dubbele bodem met een hoogte van ten minste 600 mm hebben, en een schotindeling hebben die garandeert
      dat het schip bij vollopen van twee willekeurige, naast elkaar gelegen waterdichte compartimenten niet inzinkt
      tot onder de indompelingsgrenslijn en er een resterende veiligheidsafstand van 100 mm blijft bestaan; hetzij een
      dubbele bodem met een hoogte van ten minste 600 mm hebben, en een dubbele romp met een afstand tussen de buitenwand
      van het schip en het langsschot van ten minste 800 mm hebben;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.3.d)
    text: |-
      beschikken over een meerschroefsaandrijving met ten minste twee van elkaar onafhankelijke aandrijfmotoren met
      eenzelfde vermogen en een vanuit het stuurhuis bedienbare boegschroefinstallatie die zowel in de lengte- als
      dwarsrichting werkt;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 28.04.3.e)
    text: de hekankers van uit het stuurhuis direct kunnen presenteren;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel28.04
  - number: 29.01.1
    text: Snelle schepen mogen niet gebouwd zijn als hotelschepen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.01
  - number: 29.01.2
    text: 'De volgende inrichtingen zijn op snelle schepen verboden:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.01
  - number: 29.01.2.a)
    text: |-
      met pitbranders uitgeruste inrichtingen, bedoeld in [artikel 16.02][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel16
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '16'
        hoofdstuk: '16'
  - number: 29.01.2.b)
    text: |-
      oliekachels met verdampingsbranders, bedoeld in de [artikelen 16.03][ref1] en [16.04][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel16
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '16'
        hoofdstuk: '16'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '16'
        hoofdstuk: '16'
  - number: 29.01.2.c)
    text: |-
      verwarmingsapparaten met vaste brandstoffen, bedoeld in [artikel 16.07][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel16
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '16'
        hoofdstuk: '16'
  - number: 29.01.2.d)
    text: |-
      vloeibaargasinstallaties als bedoeld in [hoofdstuk 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '17'
  - number: 29.01.3
    text: |-
      Snelle schepen moeten worden gebouwd onder toezicht en volgens de toepasselijke voorschriften van een erkend
      classificatiebureau, dat beschikt over bijzondere regels voor snelle schepen, en door dat bureau geclassificeerd
      zijn. De klasse moet worden gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.01
  - number: 29.02.1
    text: |-
      Onverminderd het tweede lid, gelden voor snelle schepen de [hoofdstukken 3 tot en met 19][ref1] met uitzondering
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '3'
  - number: 29.02.1.a)
    text: |-
      [artikel 3.04, zesde lid, tweede alinea][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel3
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '3'
        hoofdstuk: '3'
  - number: 29.02.1.b)
    text: |-
      [artikel 8.08, tweede lid, tweede zin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel8
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
  - number: 29.02.1.c)
    text: |-
      [artikel 14.02, vierde lid, tweede en derde zin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel14
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '14'
        hoofdstuk: '14'
  - number: 29.02.1.d)
    text: |-
      [artikel 15.02, vierde lid, tweede zin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel15
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '15'
        hoofdstuk: '15'
  - number: 29.02.1.e)
    text: |-
      [artikel 19.06, derde lid, onderdeel a, tweede zin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 29.02.2
    text: |-
      In afwijking van [artikel 19.02, negende lid][ref1], en [artikel 19.15, zevende lid][ref2], moeten alle deuren in
      waterdichte schotten op afstand kunnen worden bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 29.02.3
    text: |-
      In afwijking van [artikel 6.02, eerste lid][ref1], moet bij uitvallen of storing van de aandrijving van de
      stuurmachine onverwijld een tweede onafhankelijke aandrijving van de stuurmachine dan wel een handaandrijving in
      werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6'
        hoofdstuk: '6'
  - number: 29.02.4
    text: |-
      Behalve de eisen van het eerste tot en met derde lid gelden voor snelle schepen de
      [artikelen 29.03 tot en met 29.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel29
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '29'
        hoofdstuk: '29'
  - number: '29.03'
    text: |-
      Voor het ten hoogste aan boord toegelaten aantal passagiers moeten zitplaatsen beschikbaar zijn. Zitplaatsen moeten
      van veiligheidsgordels voorzien zijn. Veiligheidsgordels kunnen achterwege blijven indien een geschikte bescherming
      tegen stoten aanwezig is, dan wel wanneer zij volgens de HSC Code 2000, hoofdstuk 4, deel 6, niet vereist zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.03
  - number: '29.04'
    text: |-
      In afwijking van de [artikelen 4.02][ref1] en [4.03][ref2] moet het vrijboord ten minste 500 mm bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel4
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
  - number: '29.05'
    text: 'In het geval van snelle schepen moet de aanwezigheid van:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.05
  - number: 29.05.a)
    text: |-
      eigenschappen wat betreft drijfvermogen en stabiliteit, de veiligheid van het schip tijdens het varen met
      waterverplaatsing zowel in onbeschadigde toestand als in lekke toestand waarborgen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.05
  - number: 29.05.b)
    text: |-
      stabiliteitseigenschappen en stabiliseringssystemen, de veiligheid van het schip tijdens het bedrijf met dynamisch
      draagvermogen en in de overgangsfase waarborgen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.05
  - number: 29.05.c)
    text: |-
      stabiliteitseigenschappen tijdens het bedrijf met dynamisch draagvermogen en in de overgangsfase, het voor het
      schip mogelijk maken op veilige wijze de overgang te maken naar het varen met waterverplaatsing bij een eventueel
      niet functioneren van het systeem, in voldoende mate worden aangetoond.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.05
  - number: 29.06.1
    text: Inrichting
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
  - number: 29.06.1.a)
    text: |-
      In afwijking van [artikel 7.01, eerste lid][ref1], moet het stuurhuis zo worden ingericht, dat zowel de roerganger
      als een tweede lid van de bemanning tijdens de vaart steeds hun taken kunnen uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 29.06.1.b)
    text: |-
      De stuurstelling moet zo worden ingericht, dat de onderdeel a genoemde personen daar hun werkplek hebben. De
      inrichtingen voor de navigatie, het manoeuvreren, de controle, het uitwisselen van berichten en de overige
      apparaten die voor het bedrijf van belang zijn moeten zo dicht bij elkaar zijn opgesteld, dat zowel de roerganger
      als een tweede lid van de bemanning over alle noodzakelijke informatie kan beschikken om indien nodig zittend alle
      uitrustings- en bedieningsinrichtingen te kunnen bedienen. In ieder geval moet:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
  - number: 29.06.1.b).aa)
    text: de stuurstelling van de roerganger zijn uitgevoerd als éénmansstuurstelling voor het varen op radar;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
  - number: 29.06.1.b).bb)
    text: |-
      het tweede lid van de bemanning op zijn werkplek beschikken over een eigen radarbeeld (slave) en vanaf zijn
      werkplek in staat zijn in te grijpen in de uitwisseling van berichten en in de aandrijving van het schip.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
  - number: 29.06.1.c)
    text: |-
      De onderdeel a vermelde personen moeten, ook indien de veiligheidsgordels normaal zijn gesloten, in staat zijn de
      inrichtingen, bedoeld onderdeel b, zonder belemmering te bedienen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
  - number: 29.06.2
    text: Vrij zicht
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
  - number: 29.06.2.a)
    text: |-
      In afwijking van [artikel 7.02, tweede lid][ref1], mag de dode hoek vanaf een zittende positie en bij elke
      beladingstoestand niet meer bedragen dan één scheepslengte voor de boeg.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 29.06.2.b)
    text: |-
      In afwijking van [artikel 7.02, derde lid][ref1], mag de som van de sectoren zonder vrij gezichtsveld van recht
      vooruit tot 22,5° achterlijker dan dwars aan iedere zijde niet meer dan 20° bedragen. Iedere afzonderlijke sector
      zonder vrij gezichtsveld mag niet meer bedragen dan 5°. De sector met vrij zicht tussen twee sectoren zonder vrij
      gezichtsveld mag niet minder bedragen dan 10°.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 29.06.3
    text: |-
      Instrumenten De instrumentenpanelen voor de bediening en de controle van de in [artikel 29.10][ref1] genoemde
      installaties moeten gescheiden op een duidelijk herkenbare plaats binnen het stuurhuis zijn aangebracht. Dit geldt
      in voorkomend geval ook voor inrichtingen voor het te water laten van gemeenschappelijke reddingsmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel29
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '29'
        hoofdstuk: '29'
  - number: 29.06.4
    text: |-
      Verlichting In zones of bij onderdelen van de uitrusting, die tijdens het bedrijf verlicht moeten zijn, moet rood
      licht worden toegepast.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
  - number: 29.06.5
    text: |-
      Vensters Reflecties moeten vermeden worden. Er moeten inrichtingen ter vermijding van verblinding door zonlicht
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
  - number: 29.06.6
    text: Oppervlaktematerialen In het stuurhuis moeten reflecties door oppervlaktematerialen vermeden worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.06
  - number: '29.07'
    text: 'Snelle schepen moeten zijn uitgerust met:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.07
  - number: 29.07.a)
    text: |-
      een navigatieradarinstallatie en een bochtaanwijzer, bedoeld in [artikel 7.06, eerste lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 29.07.b)
    text: |-
      individuele reddingsmiddelen, die direct bereikbaar zijn ondergebracht, overeenkomstig
      [artikel 19.09, vierde lid][ref1], voor het ten hoogste toegelaten aantal personen aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 29.08.1
    text: |-
      Algemeen Voor het publiek toegankelijke ruimten en verblijven en de uitrusting daarvan moeten zo zijn uitgevoerd
      dat personen bij normaal gebruik niet kunnen worden verwond bij een normale start of stop, dan wel bij een
      noodstart of noodstop, noch bij manoeuvreren onder normale vaaromstandigheden dan wel bij motoruitval of een
      stuurfout.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.08
  - number: 29.08.2
    text: Communicatie
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.08
  - number: 29.08.2.a)
    text: |-
      Passagiersschepen moeten, ten behoeve van informatieverstrekking over veiligheidsmaatregelen, zijn uitgerust met
      optische en akoestische inrichtingen, die door alle passagiers gezien en gehoord kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.08
  - number: 29.08.2.b)
    text: |-
      De schipper moet in staat zijn om met behulp van de onderdeel a bedoelde inrichtingen aanwijzingen aan de
      passagiers te geven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.08
  - number: 29.08.2.c)
    text: |-
      Voor iedere passagier moeten in de nabijheid van zijn zitplaats aanwijzingen voor noodsituaties voorhanden zijn,
      met inbegrip van een overzichtsschets van het schip waarop alle uitgangen, evacuatieroutes, nooduitrusting,
      reddingsmiddelen alsmede het gebruik van de zwemvesten duidelijk zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.08
  - number: '29.09'
    text: 'Uitgangen en vluchtwegen moeten voldoen aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.09
  - number: 29.09.a)
    text: |-
      Een gemakkelijke, veilige en snelle toegang vanuit de stuurstelling naar de voor het publiek toegankelijke ruimten
      en verblijven moet zijn gegarandeerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.09
  - number: 29.09.b)
    text: De vluchtwegen naar de nooduitgangen moeten duidelijk en duurzaam zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.09
  - number: 29.09.c)
    text: |-
      Alle uitgangen moeten voldoende gemarkeerd zijn. Het functioneren van het openingsmechanisme moet van buiten en van
      binnen duidelijk zijn te herkennen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.09
  - number: 29.09.d)
    text: De vluchtwegen en nooduitgangen moeten over een geschikt veiligheidsgeleidesysteem beschikken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.09
  - number: 29.09.e)
    text: Naast de uitgangen moet voldoende ruimte voor een lid van de bemanning aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.09
  - number: 29.10.1
    text: |-
      Gangen, voor het publiek toegankelijke ruimten en verblijven, alsmede keukens en machinekamers moeten zijn
      aangesloten op een doelmatige brandmeldinstallatie. De aanwezigheid van een brand en de plaats daarvan moeten
      automatisch op een permanent door het scheepspersoneel bezette plaats worden aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.10
  - number: 29.10.2
    text: |-
      Machinekamers moeten zijn voorzien van een vast ingebouwde brandblusinstallatie, bedoeld in [artikel 13.05][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.10
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 29.10.3
    text: |-
      Voor het publiek toegankelijke ruimten en verblijven en de daarbij horende vluchtwegen moeten zijn uitgerust met
      een automatisch werkende vaste brandblusinstallatie, bedoeld in [artikel 13.04][ref1] Bluswater moet snel en direct
      naar buiten kunnen worden afgevoerd


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.10
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 30.01.1
    text: |-
      In dit hoofdstuk wordt verstaan onder ‘voortstuwings- en hulpsystemen’ elk systeem dat brandstof gebruikt, met
      inbegrip van:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.1.a)
    text: brandstoftanks en tankaansluitingen,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.1.b)
    text: gasverwerkingssystemen,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.1.c)
    text: leidingen en afsluiters,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.1.d)
    text: motoren en turbines,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.1.e)
    text: besturings-, bewakings- en veiligheidssystemen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.2
    text: |-
      In afwijking van de [artikelen 8.01, derde lid][ref1], en
      [artikel 8.05 eerste, zesde, negende, elfde en twaalfde lid][ref2] en de bepalingen van [hoofdstuk 9][ref3] mogen
      voortstuwings- en hulpsystemen die brandstoffen gebruiken met een vlampunt van 55 °C of minder op een vaartuig
      worden geïnstalleerd, mits aan de in dit hoofdstuk en bijlage 8 vermelde eisen is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0041395
        hoofdstuk: '9'
  - number: 30.01.3
    text: |-
      Voortstuwings- en hulpsystemen als bedoeld in het tweede lid moeten onder toezicht van de Commissie van deskundigen
      worden gebouwd en geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.4
    text: |-
      Voor het verrichten van taken uit hoofde van dit hoofdstuk kan de Commissie van deskundigen een beroep doen op een
      technische dienst als bedoeld in [artikel 30.07][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel30
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '30'
        hoofdstuk: '30'
  - number: 30.01.5
    text: |-
      Vóór de eerste ingebruikstelling van een voortstuwings- of hulpsysteem als bedoeld in het tweede lid moeten de
      volgende bescheiden aan de Commissie van deskundigen worden voorgelegd:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.5.a)
    text: een risicobeoordeling overeenkomstig bijlage 8,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.5.b)
    text: een beschrijving van het voortstuwings- of hulpsysteem,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.5.c)
    text: bouwtekeningen van het voortstuwings- of hulpsysteem,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.5.d)
    text: een diagram van de druk en temperatuur in het systeem,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.5.e)
    text: een gebruiksaanwijzing met alle procedures voor het gebruik van het systeem in de praktijk,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.01.5.f)
    text: |-
      een veiligheidsrol overeenkomstig [artikel 30.03][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel30
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '30'
        hoofdstuk: '30'
  - number: 30.01.5.g)
    text: |-
      een kopie van de verklaring van keuring als bedoeld in [artikel 30.02, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel30
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '30'
        hoofdstuk: '30'
  - number: 30.01.6
    text: Er moet een kopie van de in het vijfde lid genoemde bescheiden aan boord voorhanden zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.01
  - number: 30.02.1
    text: Voortstuwings- en hulpsystemen die brandstoffen gebruiken met een vlampunt van 55 °C of minder moeten
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.02.1.a)
    text: vóór de eerste ingebruikstelling,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.02.1.b)
    text: na een verandering of reparatie,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.02.1.c)
    text: met regelmaat en ten minste eenmaal per jaar
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.02.2
    text: 'De keuringen als bedoeld in het eerste lid, onderdeel a en c, moeten ten minste bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.02.2.a)
    text: |-
      controle op het overeenstemmen van het voortstuwings- en hulpsysteem met de goedgekeurde bouwtekeningen, en bij een
      hernieuwde test, of er veranderingen in het voortstuwings- of hulpsysteem hebben plaatsgevonden,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.02.2.b)
    text: |-
      indien noodzakelijk, controle op de goede werking van het voortstuwings- en hulpsysteem met alle
      bedrijfsmogelijkheden,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.02.2.c)
    text: |-
      visuele controle en controle op de dichtheid van alle onderdelen van het systeem, in het bijzonder kleppen,
      pijpleidingen, slangen, cilinders, pompen en filters,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.02.2.d)
    text: visuele controle van de elektrische en elektronische delen van de installatie,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.02.2.e)
    text: controle van de besturings-, bewakings- en veiligheidssystemen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.02.3
    text: |-
      De keuringen als bedoeld in het eerste lid, onderdeel b, moeten de desbetreffende aspecten van het tweede lid
      bevatten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.02.4
    text: |-
      Bij elke keuring als bedoeld in het eerste lid, moet een verklaring worden opgesteld waaruit de datum van de
      keuring blijkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: 30.03.1
    text: |-
      Op vaartuigen uitgerust met voortstuwings- of hulpsystemen die worden aangedreven met brandstoffen met een vlampunt
      van 55 °C of lager moet een veiligheidsrol aanwezig zijn. De veiligheidsrol moet instructies als bedoeld in het
      tweede lid en een veiligheidsplan als bedoeld in het derde lid van het vaartuig bevatten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.2
    text: 'Deze veiligheidsinstructies moeten ten minste de volgende gegevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.2.a)
    text: de noodstop van het systeem,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.2.b)
    text: |-
      maatregelen in geval van onopzettelijk vrijkomen van vloeibare of gasvormige brandstof, bij voorbeeld bij het
      bunkeren,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.2.c)
    text: maatregelen in geval van brand of andere incidenten aan boord,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.2.d)
    text: maatregelen in geval van aanvaring,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.2.e)
    text: gebruik van de veiligheidsuitrusting,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.2.f)
    text: activering van de alarminstallatie,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.2.g)
    text: evacuatieprocedures.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3
    text: 'Het veiligheidsplan moet ten minste de volgende gegevens bevatten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3.a)
    text: gevaarlijke zones,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3.b)
    text: vluchtwegen, nooduitgangen en gasdichte ruimten,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3.c)
    text: reddingsmiddelen en bijboten,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3.d)
    text: blustoestellen, brandblusinstallaties en sprinklerinstallaties,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3.e)
    text: alarmsystemen,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3.f)
    text: bedieningsapparatuur van noodstopschakelaars,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3.g)
    text: brandkleppen,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3.h)
    text: noodstroominstallatie,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3.i)
    text: schakelaars van ventilatiesystemen,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3.j)
    text: bedieningsapparatuur voor brandstoftoevoerleidingen,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.3.k)
    text: veiligheidsuitrusting.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.4
    text: 'De veiligheidsrol moet:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.4.a)
    text: door de Commissie van deskundigen zijn gewaarmerkt, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: 30.03.4.b)
    text: duidelijk zichtbaar op één of meer daarvoor geëigende plaatsen aan boord zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: '30.04'
    text: (zonder inhoud)
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.04
  - number: '30.05'
    text: |-
      Bedrijfsruimten en systeemonderdelen moeten dusdanig gekenmerkt zijn dat duidelijk is voor welke brandstoffen zij
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.05
  - number: '30.06'
    text: |-
      In geval van een automatische uitschakeling van het voortstuwingssysteem of delen daarvan, moet het vaartuig op
      eigen kracht kunnen blijven voortbewegen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.06
  - number: 30.07.1
    text: 'De technische diensten moeten voldoen aan de Europese norm EN ISO 17020 : 2012).'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.07
  - number: 30.07.2
    text: |-
      De fabrikanten en leveranciers van voortstuwings- en hulpsystemen of van delen van een dergelijke installatie
      kunnen niet als technische dienst worden erkend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.07
  - number: 30.07.3
    text: |-
      De technische dienst moet beschikken over de kennis van zaken die nodig is op grond van de in bijlage 8 genoemde
      vereisten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.07
  - number: 30.07.4
    text: |-
      De controles en tests als bedoeld in [artikel 30.01][ref1] en [30.02][ref2] mogen door verschillende technische
      diensten worden verricht, op voorwaarde dat de in het derde lid bedoelde kennis hierbij voorhanden is.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel30
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '30'
        hoofdstuk: '30'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '30'
        hoofdstuk: '30'
  - number: '31.01'
    text: |-
      Voor motorschepen, duwboten, duwstellen en passagiersschepen wordt het al dan niet voldoen aan de voorschriften
      van [artikel 31.02][ref1] of [artikel 31.03][ref2] door de Commissie van deskundigen in het binnenschipcertificaat
      onder nummer 47 gewaarmerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel31
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '31'
        hoofdstuk: '31'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '31'
        hoofdstuk: '31'
  - number: 31.02.1
    text: |-
      De voortstuwingsinstallaties moeten zo zijn ingericht, dat de verandering van de vaarsnelheid en de omkering van de
      richting van de stuwkracht van de schroef vanaf de stuurstelling kunnen geschieden. De hulpmotoren die nodig zijn
      bij het varen met het schip moeten vanaf de stuurstelling kunnen worden aan- en afgezet, tenzij dit automatisch
      geschiedt, dan wel deze motoren gedurende elke reis ononderbroken in bedrijf zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.02
  - number: 31.02.2
    text: |-
      Het kritieke peil - van de temperatuur van het koelwater van de hoofdmotoren,
        - van de druk van de smeerolie van de hoofdmotoren en de transmissie,
        - van de oliedruk en de luchtdruk van de omkeerinrichting van de hoofdmotoren, de keerkoppeling of de schroeven,
        - van het bilgewater in de hoofdmachinekamer moet worden aangegeven door installaties die in het stuurhuis
      akoestische en optische alarmsignalen in werking stellen. De akoestische alarmsignalen mogen in één akoestisch
      apparaat verenigd zijn. Zij mogen worden uitgeschakeld zodra de storing is vastgesteld. De optische alarmsignalen
      mogen pas worden uitgeschakeld, nadat de desbetreffende storingen zijn verholpen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.02
  - number: 31.02.3
    text: De brandstoftoevoer en de koeling van de hoofdmotoren dienen automatisch te geschieden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.02
  - number: 31.02.4
    text: |-
      De bediening van de stuurinrichting moet zelfs bij de grootste toegelaten inzinking door één persoon zonder
      bijzondere krachtsinspanning kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.02
  - number: 31.02.5
    text: |-
      De overeenkomstig de toepasselijke scheepvaartpolitiereglementen van de lidstaten voorgeschreven optische of
      akoestische tekens van varende schepen dienen vanaf de stuurstelling te kunnen worden gegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.02
  - number: 31.02.6
    text: |-
      Indien geen rechtstreeks contact mogelijk is tussen de stuurstelling en het voorschip, het achterschip, de
      verblijven en de machinekamer, dient een spreekverbinding te zijn aangebracht. Voor contact met de machinekamer
      mogen in plaats van een spreekverbinding optische en akoestische signalen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.02
  - number: 31.02.7
    text: |-
      De kracht die nodig is om zwengels en soortgelijke draaibare voorzieningen van hefwerktuigen te bedienen mag niet
      meer dan 160 N bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.02
  - number: 31.02.8
    text: De in het binnenschipcertificaat van onderzoek vermelde sleeplieren dienen door een motor te worden aangedreven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.02
  - number: 31.02.9
    text: De lenspompen en de dekwaspompen dienen door een motor te worden aangedreven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.02
  - number: 31.02.10
    text: De voornaamste bedieningsinrichtingen en controle-instrumenten dienen ergonomisch te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.02
  - number: 31.02.11
    text: |-
      De krachtens [artikel 6.01, eerste lid][ref1], vereiste inrichtingen dienen vanaf de stuurstelling te kunnen worden
      bediend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6'
        hoofdstuk: '6'
  - number: '31.03'
    text: Standaard S1 en bovendien een uitrusting met
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.03
  - number: 31.03.1
    text: 'Voor alleenvarende motorschepen: een vanuit de stuurstelling bedienbare boegschroefinstallatie;'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.03
  - number: 31.03.2
    text: |-
      Voor motorschepen, die gekoppelde vaartuigen voortbewegen: een vanuit de stuurstelling bedienbare
      boegschroefinstallatie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.03
  - number: 31.03.3
    text: |-
      Voor motorschepen, die een duwstel, bestaande uit het motorschip en een vaartuig ervoor, voortbewegen: hydraulisch
      of elektrisch aangedreven koppellieren. Deze uitrusting is echter niet vereist, wanneer het vaartuig aan de kop van
      het duwstel met een boegschroefinstallatie is uitgerust, die vanuit de stuurstelling van het duwende motorschip te
      bedienen is;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.03
  - number: 31.03.4
    text: |-
      Voor duwboten, die een duwstel voortbewegen: hydraulisch of elektrisch aangedreven koppellieren. Deze uitrusting is
      echter niet vereist, wanneer het vaartuig aan de kop van het duwstel met een boegschroefinstallatie is uitgerust,
      die vanuit de stuurstelling van het duwende duwboot te bedienen is;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.03
  - number: 31.03.5
    text: |-
      Voor passagiersschepen: een vanuit de stuurstelling bedienbare boegschroefinstallatie. Deze uitrusting is echter
      niet vereist, indien de voortstuwingsinstallatie en de stuurinrichting van het passagiersschip gelijkwaardige
      manoeuvreereigenschappen waarborgen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.03
  - number: 32.01.1
    text: |-
      De [artikelen 32.02 tot en met 32.04][ref1] zijn slechts van toepassing op vaartuigen voorzien van een geldig
      certificaat van onderzoek voor Rijnschepen,


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel32
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '32'
        hoofdstuk: '32'
  - number: 32.01.1.a)
    text: |-
      dat voor de eerste maal overeenkomstig het op 31 december 1994 geldende Reglement onderzoek schepen op de Rijn werd
      afgegeven, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.01
  - number: 32.01.1.b)
    text: dat ten minste eenmaal werd vernieuwd voor 31 december 1994, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.01
  - number: 32.01.1.c)
    text: die op 31 december 1994 in aanbouw waren dan wel verbouwd werden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.01
  - number: 32.01.2
    text: |-
      Op vaartuigen die niet onder het eerste lid vallen, is [artikel 32.05][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel32
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.01
    references:
