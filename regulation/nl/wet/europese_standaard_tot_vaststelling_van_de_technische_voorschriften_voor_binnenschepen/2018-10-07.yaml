  - number: '27.01'
    text: |-
      1. Indien overeenkomstig de toepasselijke scheepvaartpolitiereglementen van de lidstaten voor schepen die
      containers vervoeren stabiliteitsbescheiden zijn vereist, is dit hoofdstuk van toepassing.

      De stabiliteitsdocumenten moeten door een Commissie van deskundigen worden geverifieerd en van haar waarmerk worden
      voorzien.

      2. De stabiliteitsdocumenten moeten de schipper begrijpelijke informatie bieden over de stabiliteit van het schip
      in elke voorkomende beladingstoestand.

      De stabiliteitsdocumenten moeten ten minste bevatten:

      a) gegevens betreffende de toelaatbare stabiliteitscoëfficiënten, de toegestane

      of de toegestane zwaartepuntshoogten van de lading;

      b) gegevens betreffende de ruimten die met ballastwater kunnen worden gevuld;

      c) formulieren voor de stabiliteitscontrole;

      d) een berekeningsvoorbeeld of handleiding voor de schipper.

      3. Indien containers op een schip al dan niet vastgezet kunnen worden vervoerd, zijn voor het vervoer van niet-
      vastgezette en voor het vervoer van vastgezette containerladingen afzonderlijke berekeningsmethoden vereist voor
      het bewijs van stabiliteit.

      4. Een containerlading geldt alleen als vastgezet wanneer de afzonderlijke containers door middel van geleiders
      of spaninrichtingen hecht met de scheepsromp zijn verbonden en zij tijdens het varen niet van plaats kunnen
      veranderen.
