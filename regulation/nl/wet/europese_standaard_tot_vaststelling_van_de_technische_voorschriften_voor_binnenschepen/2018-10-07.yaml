  - number: '30.02'
    text: |-
      1. Voortstuwings- en hulpsystemen die brandstoffen gebruiken met een vlampunt van 55 °C of minder moeten

      a) vóór de eerste ingebruikstelling,

      b) na een verandering of reparatie,

      c) met regelmaat en ten minste eenmaal per jaar

      door een Commissie van deskundigen worden gekeurd.

      Daarbij moeten de relevante instructies van de fabrikanten in acht worden genomen.

      2. De keuringen als bedoeld in het eerste lid, onderdeel a en c, moeten ten minste bestaan uit:

      a) controle op het overeenstemmen van het voortstuwings- en hulpsysteem met de goedgekeurde bouwtekeningen, en bij
      een hernieuwde test, of er veranderingen in het voortstuwings- of hulpsysteem hebben plaatsgevonden,

      b) indien noodzakelijk, controle op de goede werking van het voortstuwings- en hulpsysteem met alle
      bedrijfsmogelijkheden,

      c) visuele controle en controle op de dichtheid van alle onderdelen van het systeem, in het bijzonder kleppen,
      pijpleidingen, slangen, cilinders, pompen en filters,

      d) visuele controle van de elektrische en elektronische delen van de installatie,

      e) controle van de besturings-, bewakings- en veiligheidssystemen.

      3. De keuringen als bedoeld in het eerste lid, onderdeel b, moeten de desbetreffende aspecten van het tweede lid
      bevatten.

      4. Bij elke keuring als bedoeld in het eerste lid, moet een verklaring worden opgesteld waaruit de datum van de
      keuring blijkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.02
  - number: '30.03'
    text: |-
      1. Op vaartuigen uitgerust met voortstuwings- of hulpsystemen die worden aangedreven met brandstoffen met een
      vlampunt van 55 °C of lager moet een veiligheidsrol aanwezig zijn. De veiligheidsrol moet instructies als bedoeld
      in het tweede lid en een veiligheidsplan als bedoeld in het derde lid van het vaartuig bevatten.

      2. Deze veiligheidsinstructies moeten ten minste de volgende gegevens bevatten:

      a) de noodstop van het systeem,

      b) maatregelen in geval van onopzettelijk vrijkomen van vloeibare of gasvormige brandstof, bij voorbeeld bij het
      bunkeren,

      c) maatregelen in geval van brand of andere incidenten aan boord,

      d) maatregelen in geval van aanvaring,

      e) gebruik van de veiligheidsuitrusting,

      f) activering van de alarminstallatie,

      g) evacuatieprocedures.

      3. Het veiligheidsplan moet ten minste de volgende gegevens bevatten:

      a) gevaarlijke zones,

      b) vluchtwegen, nooduitgangen en gasdichte ruimten,

      c) reddingsmiddelen en bijboten,

      d) blustoestellen, brandblusinstallaties en sprinklerinstallaties,

      e) alarmsystemen,

      f) bedieningsapparatuur van noodstopschakelaars,

      g) brandkleppen,

      h) noodstroominstallatie,

      i) schakelaars van ventilatiesystemen,

      j) bedieningsapparatuur voor brandstoftoevoerleidingen,

      k) veiligheidsuitrusting.

      4. De veiligheidsrol moet:

      a) door de Commissie van deskundigen zijn gewaarmerkt, en

      b) duidelijk zichtbaar op één of meer daarvoor geëigende plaatsen aan boord zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.03
  - number: '30.04'
    text: (zonder inhoud)
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.04
  - number: '30.05'
    text: |-
      Bedrijfsruimten en systeemonderdelen moeten dusdanig gekenmerkt zijn dat duidelijk is voor welke brandstoffen zij
      worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.05
  - number: '30.06'
    text: |-
      In geval van een automatische uitschakeling van het voortstuwingssysteem of delen daarvan, moet het vaartuig op
      eigen kracht kunnen blijven voortbewegen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.06
  - number: '30.07'
    text: |-
      1. De technische diensten moeten voldoen aan de Europese norm EN ISO 17020 : 2012).

      2. De fabrikanten en leveranciers van voortstuwings- en hulpsystemen of van delen van een dergelijke installatie
      kunnen niet als technische dienst worden erkend.

      3. De technische dienst moet beschikken over de kennis van zaken die nodig is op grond van de in bijlage 8 genoemde
      vereisten.

      4. De controles en tests als bedoeld in [artikel 30.01][ref1] en [30.02][ref2] mogen door verschillende technische
      diensten worden verricht, op voorwaarde dat de in het derde lid bedoelde kennis hierbij voorhanden is.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel30.01
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel30.02
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel30.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '30.01'
        hoofdstuk: '30'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '30.02'
        hoofdstuk: '30'
  - number: '31.01'
    text: |-
      Voor motorschepen, duwboten, duwstellen en passagiersschepen wordt het al dan niet voldoen aan de voorschriften
      van [artikel 31.02][ref1] of [artikel 31.03][ref2] door de Commissie van deskundigen in het binnenschipcertificaat
      onder nummer 47 gewaarmerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel31.02
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel31.03
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel31.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '31.02'
        hoofdstuk: '31'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '31.03'
        hoofdstuk: '31'
  - number: '31.02'
    text: |-
      1. De voortstuwingsinstallaties moeten zo zijn ingericht, dat de verandering van de vaarsnelheid en de omkering van
      de richting van de stuwkracht van de schroef vanaf de stuurstelling kunnen geschieden.

      De hulpmotoren die nodig zijn bij het varen met het schip moeten vanaf de stuurstelling kunnen worden aan- en
      afgezet, tenzij dit automatisch geschiedt, dan wel deze motoren gedurende elke reis ononderbroken in bedrijf zijn.

      2. Het kritieke peil

        - van de temperatuur van het koelwater van de hoofdmotoren,
        - van de druk van de smeerolie van de hoofdmotoren en de transmissie,
        - van de oliedruk en de luchtdruk van de omkeerinrichting van de hoofdmotoren, de keerkoppeling of de schroeven,
        - van het bilgewater in de hoofdmachinekamer

      moet worden aangegeven door installaties die in het stuurhuis akoestische en optische alarmsignalen in
      werking stellen. De akoestische alarmsignalen mogen in één akoestisch apparaat verenigd zijn. Zij mogen worden
      uitgeschakeld zodra de storing is vastgesteld. De optische alarmsignalen mogen pas worden uitgeschakeld, nadat de
      desbetreffende storingen zijn verholpen.

      3. De brandstoftoevoer en de koeling van de hoofdmotoren dienen automatisch te geschieden.

      4. De bediening van de stuurinrichting moet zelfs bij de grootste toegelaten inzinking door één persoon zonder
      bijzondere krachtsinspanning kunnen worden verricht.

      5. De overeenkomstig de toepasselijke scheepvaartpolitiereglementen van de lidstaten voorgeschreven optische of
      akoestische tekens van varende schepen dienen vanaf de stuurstelling te kunnen worden gegeven.

      6. Indien geen rechtstreeks contact mogelijk is tussen de stuurstelling en het voorschip, het achterschip, de
      verblijven en de machinekamer, dient een spreekverbinding te zijn aangebracht. Voor contact met de machinekamer
      mogen in plaats van een spreekverbinding optische en akoestische signalen worden gebruikt.

      7. De kracht die nodig is om zwengels en soortgelijke draaibare voorzieningen van hefwerktuigen te bedienen mag
      niet meer dan 160 N bedragen.

      8. De in het binnenschipcertificaat van onderzoek vermelde sleeplieren dienen door een motor te worden aangedreven.

      9. De lenspompen en de dekwaspompen dienen door een motor te worden aangedreven.

      10. De voornaamste bedieningsinrichtingen en controle-instrumenten dienen ergonomisch te zijn aangebracht.

      11. De krachtens [artikel 6.01, eerste lid][ref1], vereiste inrichtingen dienen vanaf de stuurstelling te kunnen
      worden bediend.


