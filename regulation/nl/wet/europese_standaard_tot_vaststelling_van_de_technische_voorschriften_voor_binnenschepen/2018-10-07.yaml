  - number: '4.04'
    text: |-
      1. Voor de toepassing van artikel 4.04 en [4.05][ref1] is de zone R gelijkwaardig aan zone 3.

      2. Het vlak van de grootste inzinking moet zo worden vastgesteld dat gelijktijdig aan de voorschriften omtrent het
      kleinste vrijboord en aan die omtrent de kleinste veiligheidsafstand wordt voldaan. De Commissie van deskundigen
      kan echter uit veiligheidsoverwegingen een groter vrijboord, dan wel een grotere veiligheidsafstand vaststellen.

      Het vlak van de grootste inzinking wordt ten minste vastgesteld voor zone 3.

      3. Het vlak van de grootste inzinking wordt door goed zichtbare en onuitwisbare inzinkingsmerken aangegeven.

      4. De inzinkingsmerken voor zone 3 bestaan uit een rechthoek met horizontale zijden van 300 mm en verticale
      zijden van 40 mm, waarvan de basis samenvalt met het vlak van de toegelaten grootste inzinking. Andersoortige
      inzinkingsmerken dienen een dergelijke rechthoek te bevatten.

      5. Schepen moeten ten minste drie paar inzinkingsmerken hebben, waarvan één paar ongeveer midscheeps en de twee
      andere op ongeveer 1/6 van de lengte *L* achter de voorsteven, respectievelijk vóór de achtersteven moeten zijn
      aangebracht.

      Evenwel kan:

      a) bij schepen waarvan de lengte *L* minder dan 40 m bedraagt, met twee paar merken worden volstaan, die op 1/4 van
      de lengte *L* achter de voorsteven, respectievelijk vóór de achtersteven moeten zijn aangebracht;

      b) bij schepen die niet zijn bestemd voor het vervoer van goederen, met één paar merken worden volstaan, dat
      ongeveer midscheeps moet zijn aangebracht

      6. De ingevolge een nieuw onderzoek ongeldig geworden inzinkingsmerken of aanduidingen moeten onder toezicht
      van de Commissie van deskundigen worden verwijderd of als ongeldig worden gekenmerkt. Onduidelijk geworden
      inzinkingsmerken mogen alleen onder toezicht van een Commissie van deskundigen worden vervangen.

      7. Wanneer het schip overeenkomstig het Verdrag van 1966 betreffende de meting van binnenschepen is gemeten en de
      ijkmerken in hetzelfde vlak liggen als de in deze standaard voorgeschreven inzinkingsmerken, gelden deze ijkmerken
      ook als inzinkingsmerken; dit wordt aangetekend in het binnenschipcertificaat.

      8. Op schepen die op andere binnenwaterzones dan zone 3 varen (zones 1, 2 of 4), moet aan de in lid 4
      voorgeschreven paren inzinkingsmerken aan voor- en achtersteven een verticale streep worden toegevoegd, van waaruit
      met een extra lijn, of voor meerdere zones meerdere extra lijnen, met een lengte van 150 mm naar de boeg van het
      schip toe het inzinkingsniveau ten opzichte van het inzinkingsmerk voor zone 3 wordt aangegeven.

      Deze verticale streep en de horizontale lijn hebben een dikte van 30 mm. Naast het inzinkingsmerk op de boeg van
      het schip moet het cijfer van de betreffende zone worden aangegeven. De afmetingen van dit cijfer zijn 60 x 40 mm
      (zie figuur 1).


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4.05
