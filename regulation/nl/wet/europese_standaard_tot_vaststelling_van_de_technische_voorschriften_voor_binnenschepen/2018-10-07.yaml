                     1 Scheidingsvlakken tussen controleposten en binnen het schip gelegen verzamelruimten moeten voldoen
      aan type A0, in het geval van buiten gelegen verzamelruimten echter aan type B15. 2 Scheidingsvlakken tussen
      verblijfsruimten en binnen het schip gelegen verzamelruimten moeten voldoen aan type A30, in het geval van buiten
      gelegen verzamelruimten echter aan type B15. 3 Wanden tussen hutten, wanden tussen hutten en gangen en verticale
      scheidingsvlakken van passagiersverblijven, bedoeld in het tiende lid, moeten voldoen aan type B15 en in ruimten
      met sprinklerinstallaties moeten zij voldoen aan type B0. Scheidingsvlakken tussen hutten en sauna’s moeten voldoen
      aan type A0 en in ruimten met sprinklerinstallaties moeten zij voldoen aan type B15. 4 Scheidingsvlakken tussen
      machinekamers, bedoeld in de [artikelen 19.07][ref2] en [19.10, zesde lid][ref3], moeten voldoen aan type A60,
      en overigens aan type A0. 5 Scheidingsvlakken tussen voorraadruimten voor de opslag van brandbare vloeistoffen en
      controleposten evenals verzamelruimten moeten voldoen aan type A60 en ruimten met sprinklerinstallaties aan type A
      30. 6 Voor scheidingsvlakken tussen keukens en koelruimten of voorraadruimten voor levensmiddelen is B15 voldoende.


