  - number: '20.13'
    text: |-
      1. Staand en lopend want moeten voldoen aan de sterkte-eisen van de [artikelen 20.14][ref1] en [20.15][ref2].

      2. Als staaldraadverbindingen zijn toegestaan:

      a) splitsen,

      b) klemhulzen, of

      c) taluritklemmen.

      Splitsen moeten bekleed zijn en uiteinden moeten afgeschermd zijn.

      3. Oogsplitsen moeten van een kous zijn voorzien.

      4. Draden moeten zodanig lopen dat hinder bij ingangen en trappen vermeden wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel20.14
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel20.15
