  - number: '13.04'
    text: |-
      1. In verblijven, stuurhuizen en passagiersruimten mogen, ter bescherming van deze ruimten, slechts geschikte,
      automatisch werkende sprinklerinstallaties als vast ingebouwde brandblusinstallaties worden geïnstalleerd.

      2. Deze installaties mogen slechts door deskundige bedrijven worden ingebouwd of omgebouwd.

      3. Deze installaties moeten van staal of van gelijkwaardig niet brandbaar materiaal zijn gebouwd.

      4. Deze installaties moeten over de oppervlakken van de grootste te beschermen ruimte ten minste een hoeveelheid
      water van 5 l/m2 per minuut kunnen sproeien.

      5. Installaties die een kleinere hoeveelheid water sproeien moeten beschikken over een typegoedkeuring op
      grond van de IMO-Resolutie A.800 (19) of een andere door één van de lidstaten erkende norm. De typegoedkeuring
      wordt uitgevoerd door een erkend classificatiebureau of door een gemachtigde testinstelling. De gemachtigde
      testinstelling moet voldoen aan de Europese norm EN ISO/IEC 17025 : 2005.

      6. De installaties moeten door een erkend deskundige worden gekeurd:

      a) vóór de eerste ingebruikstelling;

      b) vóór een hernieuwde ingebruikstelling na in werking te zijn geweest;

      c) vóór een hernieuwde ingebruikstelling na een wezenlijke verandering of reparatie, en

      d) met regelmaat en ten minste elke twee jaar.

      Keuringen overeenkomstig onderdeel d kunnen ook worden uitgevoerd door een deskundige van een bedrijf dat deskundig
      is op het gebied van brandblusinstallaties.

      7. Bij de keuring, bedoeld in het zesde lid, moet de erkend deskundige of deskundige controleren of de installaties
      aan de eisen van dit artikel voldoen.

      De keuring moet ten minste bestaan uit:

      a) inspectie van de buitenkant van de installatie als geheel;

      b) controle van de bedrijfszekerheid van de veiligheidssystemen en de sproeikoppen;

      c) controle van het systeem van druktanks en pompen.

      8. Met betrekking tot de keuring moet een door de erkend deskundige of deskundige ondertekende verklaring worden
      opgesteld waaruit de datum van de keuring blijkt.

      9. Het aantal van de aanwezige installaties moet in het binnenschipcertificaat worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: '13.05'
    text: |-
      1. Blusmiddelen

      In machinekamers, ketelruimen en pompkamers mogen, ter bescherming van deze ruimten, in vast ingebouwde
      brandblusinstallaties de volgende blusmiddelen worden gebruikt:

      a) CO (koolstofdioxide);

      b) HFC-227ea (heptafluorpropaan);

      c) IG-541 (52% stikstof, 40% argon, 8% koolstofdioxide);

      d) FK-5-1-12 (dodecafluoro-2-methylpentane-3-on);

      e) water.

      2. Ventilatie, luchtaanzuiging

      a) Verbrandingslucht voor de voor de vaart benodigde verbrandingsmotoren mag niet worden aangezogen uit door
      vast ingebouwde brandblusinstallaties te beschermen ruimten. Dit is niet van toepassing wanneer er twee van
      elkaar onafhankelijke, gasdicht gescheiden hoofdmachinekamers aanwezig zijn dan wel er naast de hoofdmachinekamer
      een boegbesturingsaandrijving in een aparte machinekamer beschikbaar is, waardoor in geval van brand in de
      hoofdmachinekamer het voortbewegen op eigen kracht wordt verzekerd.

      b) Een mechanische ventilatie van de te beschermen ruimte, indien aanwezig, moet bij het in werking stellen van de
      brandblusinstallatie automatisch worden uitgeschakeld.

      c) Er moeten middelen beschikbaar zijn waarmee alle openingen, waardoor lucht zou kunnen toetreden tot, dan wel gas
      zou kunnen ontsnappen uit de te beschermen ruimte, snel kunnen worden gesloten. De gesloten toestand moet duidelijk
      herkenbaar zijn.

      d) De lucht die via de overdrukventielen uit in de machinekamers geïnstalleerde persluchthouders stroomt moet naar
      buiten worden gevoerd.

      e) De bij het binnenstromen van het blusmiddel ontstane over- of onderdruk mag de essentiële onderdelen van de te
      beschermen ruimte niet vernielen. De compensatie van de druk moet zonder gevaar kunnen geschieden.

      f) Beschermde ruimten moeten beschikken over een mogelijkheid om het blusmiddel en het brandgas af te zuigen.
      Dergelijke afzuiginrichtingen moeten vanaf een plek buiten de beschermde ruimten kunnen worden bediend. Die
      plek mag door een brand in die ruimten niet ontoegankelijk worden. Indien vast geïnstalleerde afzuiginrichtingen
      aanwezig zijn, mogen deze tijdens het blussen niet kunnen worden ingeschakeld.

      3. Brandmeldsysteem

      De te beschermen ruimte moet voorzien zijn van een doelmatig brandmeldsysteem. De brandmelding moet in het
      stuurhuis, in de verblijven en in de te beschermen ruimte kunnen worden waargenomen.

      4. Pijpleidingensysteem

      a) Het blusmiddel moet door een vast geïnstalleerd pijpleidingenstelsel naar de te beschermen ruimte worden
      toegevoerd en daarin worden verdeeld. In de te beschermen ruimte moeten de pijpleidingen en de daarbij behorende
      armaturen van staal zijn vervaardigd. Dit geldt niet voor de aansluitleidingen van de houders en de compensatoren
      indien de daarvoor gebruikte materialen met betrekking tot brand over gelijkwaardige eigenschappen beschikken. De
      pijpleidingen moeten zowel in- als uitwendig tegen corrosie beschermd zijn.

      b) De sproeikoppen moeten zodanig van afmeting zijn en zodanig zijn aangebracht dat het blusmiddel gelijkmatig
      wordt verdeeld. In het bijzonder moet het blusmiddel ook onder de vloerplaten werkzaam zijn.

      5. Inrichting voor het in werking stellen

      a) Brandblusinstallaties die automatisch in werking worden gesteld zijn niet toegestaan.

      b) De brandblusinstallatie moet vanaf een geschikte plaats buiten de te beschermen ruimte in werking kunnen worden
      gesteld.

      c) Inrichtingen voor het in werking stellen moeten zodanig zijn geïnstalleerd dat ze ook in geval van brand kunnen
      worden bediend en dat, in het geval van een beschadiging als gevolg van brand of explosie in de te beschermen
      ruimte, de daarvoor benodigde hoeveelheid blusmiddel nog kan worden toegevoerd.

      Niet mechanische inrichtingen voor het in werking stellen moeten door twee verschillende van elkaar onafhankelijke
      energiebronnen worden gevoed. Deze energiebronnen moeten zich buiten de te beschermen ruimte bevinden. Leidingen
      voor de aansturing in de beschermde ruimte moeten zodanig zijn uitgevoerd, dat zij in geval van brand ten minste
      gedurende 30 minuten kunnen blijven functioneren. Elektrische leidingen voldoen aan deze eis indien zij voldoen aan
      de internationale norm IEC 60331-21 : 1999.

      Wanneer inrichtingen voor het in werking stellen door hun wijze van opstelling aan het gezicht zijn onttrokken
      moet de bedekking of afscherming zijn voorzien van een teken ‘brandblusinstallatie’ met een lengte van de zijde
      van ten minste 10 cm, overeenkomstig schets 6 van bijlage 4, alsmede van de volgende tekst in rode letters op witte
      ondergrond:

      „Feuerlöscheinrichtung

      Installation d'extinction

      Brandblusinstallatie

      Fire-fighting installation’.

      d) Indien de brandblusinstallatie bedoeld is voor het beschermen van meerdere ruimten, moeten de inrichtingen voor
      het in werking stellen voor iedere ruimte gescheiden en duidelijk zijn gemarkeerd.

      e) de handelwijze van de bemanning in het geval van een storing in de brandblusinstallatie.

      aa) Bij iedere inrichting voor het in werking stellen moet een gebruiksaanwijzing in een officiële taal van een van
      de lidstaten duidelijk zichtbaar en duurzaam uitgevoerd zijn aangebracht. Deze moet met name informatie bevatten
      inzake

      bb) het in werking stellen van de brandblusinstallatie;

      cc) de noodzaak van de controle dat alle personen de te beschermen ruimte hebben verlaten;

      dd) de handelswijze van de bemanning bij het in werking stellen van de brandblusinstallatie en wanneer zij de
      beschermde ruimte betreden na het in werking stellen van de installatie of na het uitstromen van het blusmiddel, in
      het bijzonder met betrekking tot de mogelijke aanwezigheid van gevaarlijke substanties;

      f) De gebruiksaanwijzing moet erop wijzen dat vóór het in werking stellen van de brandblusinstallatie de in de
      ruimte aanwezige verbrandingsmotoren die lucht aanzuigen uit de te beschermen ruimte buiten bedrijf moeten worden
      gesteld.

      6. Waarschuwingssysteem

      a) Vast ingebouwde brandblusinstallaties moeten zijn voorzien van een waarschuwingssysteem.

      b) Het waarschuwingssysteem moet automatisch gaan werken bij de eerste handeling voor het in werking stellen van
      de brandblusinstallatie. Het waarschuwingssignaal moet gedurende een redelijke tijd vóór het vrijkomen van het
      blusmiddel klinken en mag niet kunnen worden uitgeschakeld.

      c) De waarschuwingssignalen moeten in de te beschermen ruimten alsmede bij iedere toegang daartoe duidelijk
      zichtbaar zijn en ook onder de bedrijfsomstandigheden, waarbij aldaar het meeste geluid wordt geproduceerd,
      duidelijk hoorbaar zijn. Zij moeten in de te beschermen ruimte duidelijk van alle andere akoestische en optische
      waarschuwingssignalen te onderscheiden zijn.

      d) De akoestische waarschuwingssignalen moeten, ook wanneer de verbindingsdeuren gesloten zijn, onder de
      bedrijfsomstandigheden waarbij aldaar het meeste geluid wordt geproduceerd in de ernaast gelegen ruimten duidelijk
      hoorbaar zijn.

      e) Indien het waarschuwingssysteem niet van een eigen controlesysteem terzake van kortsluiting, draadbreuk en
      spanningsvermindering is voorzien, moet het functioneren ervan kunnen worden getest.

      f) Bij iedere ingang van een ruimte, die met blusmiddel kan worden gevuld, moet duidelijk zichtbaar een bord zijn
      aangebracht met daarop in rode letters op witte ondergrond de volgende tekst:

      ‘Vorsicht, Feuerlöscheinrichtung!

      Bei Ertönen des Warnsignals (Beschreibung des Signals) den Raum sofort verlassen!

      Attention, installation d'extinction d'incendie!

      Quitter immédiatement ce local au signal (description du signal)!

      Let op, brandblusinstallatie!

      Bij het in werking treden van het alarmsignaal (omschrijving van het signaal) deze ruimte onmiddellijk verlaten!

      Warning, fire-fighting installation!

      Leave the room as soon as the warning signal sounds (description of signal)!’.

      7. Drukhouders, armaturen en persleidingen

      a) Drukhouders, armaturen en persleidingen moeten voldoen aan de in een van de lidstaten geldende voorschriften.

      b) Drukhouders moeten volgens de indicaties van de fabrikant zijn geïnstalleerd.

      c) Drukhouders, armaturen en persleidingen mogen niet in verblijven geïnstalleerd zijn.

      d) De temperatuur in de kasten of ruimten waarin drukhouders zijn opgesteld mag niet meer bedragen dan 50 °C.

      e) Kasten of ruimten aan dek moeten vast aan het dek bevestigd zijn en voorzien zijn van ventilatieopeningen, die
      zo zijn aangebracht dat, in geval de drukhouders niet dicht zijn, geen ontsnappend gas in het binnenste van het
      schip kan doordringen. Directe verbindingen met andere ruimten zijn niet toegestaan.

      8. Hoeveelheid van het blusmiddel

      Indien de hoeveelheid blusmiddel bedoeld is voor het beschermen van meer dan één ruimte, behoeft de totale
      hoeveelheid van het beschikbare blusmiddel niet meer te zijn dan de hoeveelheid die nodig is voor de grootste te
      beschermen ruimte.

      9. Installatie, controle en documentatie

      a) De installatie mag slechts worden geïnstalleerd of omgebouwd door een bedrijf dat deskundig is op het gebied van
      brandblusinstallaties. De documentatie (folders met gegevens van het product en met de veiligheidsgegevens) van de
      fabrikant van het blusmiddel en de fabrikant van de installatie moeten in acht worden genomen. De installatie, en
      met name de toestand van de sproeikoppen, moet regelmatig overeenkomstig de aanwijzingen van de fabrikant van de
      installatie of van het brandblusmiddel (technische gegevensbladen) worden onderhouden en gecontroleerd.

      b) de installatie moet door een erkend deskundige worden gekeurd:

      aa) vóór de eerste ingebruikstelling;

      bb) vóór een hernieuwde ingebruikstelling na in werking te zijn geweest;

      cc) vóór een hernieuwde ingebruikstelling na een wezenlijke verandering of reparatie, en

      dd) met regelmaat en ten minste elke twee jaar.

      Keuringen overeenkomstig onderdeel dd kunnen ook worden uitgevoerd door een deskundige van een bedrijf dat
      deskundig is op het gebied van brandblusinstallaties.

      c) Bij de keuring moet de erkend deskundige of de deskundige controleren of de installatie aan de eisen van dit
      artikel voldoet.

      d) De keuring moet ten minste betrekking hebben op:

      aa) uitwendige inspectie van de installatie als geheel;

      bb) test van de pijpleidingen op hun dichtheid;

      cc) controle van de bedrijfszekerheid van de bedieningssystemen en de systemen voor het in werking stellen;

      dd) controle van de druk in de houders alsmede de inhoud daarvan;

      ee) controle van de dichtheid en van de afsluitinrichtingen van de te beschermen ruimte;

      ff) test van het brandmeldingssysteem, alsmede

      gg) test van het waarschuwingssysteem.

      e) Inzake de keuring moet een door de erkend deskundige ondertekende verklaring worden opgesteld waaruit de datum
      van de keuring blijkt.

      f) Het aantal aanwezige vast ingebouwde brandblusinstallaties moet in het binnenschipcertificaat worden
      aangetekend.

      10. Brandblusinstallaties met CO

      Brandblusinstallaties die met CO als blusmiddel werken moeten, behalve aan de eisen, bedoeld in het eerste tot en
      met negende lid, aan de volgende bepalingen voldoen:

      a) CO-houders moeten buiten de te beschermen ruimte in een van de overige ruimten gasdicht gescheiden ruimte
      of kast zijn ondergebracht. De deuren van de ruimten waar ze opgesteld zijn of van de kasten moeten naar buiten
      openen, afsluitbaar zijn en aan de buitenkant zijn voorzien van een teken ‘Waarschuwing voor algemeen gevaar’
      overeenkomstig schets 4 van bijlage 4 met een hoogte van ten minste 5 cm alsmede van het bijkomend opschrift ‘CO’
      in dezelfde kleur en met dezelfde hoogte.

      b) De benedendekse ruimten waar CO-houders zijn opgesteld mogen slechts van buitenaf toegankelijk zijn. Deze
      ruimten moeten over een eigen, van de andere ventilatiesystemen aan boord volledig gescheiden, voldoende
      kunstmatige ventilatie met afzuigkanalen beschikken.

      c) De vulgraad van met CO gevulde houders mag niet meer zijn dan 0,75 kg/l. Voor het volume van het uitgestroomde
      CO-gas moet worden uitgegaan van 0,56 m3/kg.

      d) De hoeveelheid CO-gas benodigd voor het beschermen van een ruimte moet ten minste 40% van de bruto inhoud van
      die ruimte bedragen. Deze hoeveelheid moet binnen 120 seconden kunnen worden toegevoerd. Het moet controleerbaar
      zijn of het gas is toegevoerd.

      e) Het openen van de ventielen van de houders en het bedienen van het ventiel waardoor het gas uitstroomt moet door
      gescheiden handelingen geschieden.

      f) De redelijke tijd, bedoeld in het zesde lid, onderdeel b, moet ten minste 20 seconden bedragen. De vertraging
      tot aan het vrijkomen van het CO-gas moet zijn gegarandeerd door een betrouwbare inrichting.

      11. Brandblusinstallaties met HFC-227ea

      Brandblusinstallaties die werken met HFC-227ea als blusmiddel moeten, behalve aan de eisen, bedoeld in het eerste
      tot en met negende lid, aan de volgende bepalingen voldoen:

      a) Indien er sprake is van meerdere te beschermen ruimten met een verschillende bruto inhoud, moet iedere ruimte
      voorzien zijn van een eigen brandblusinstallatie.

      b) Iedere houder die HFC-227ea bevat en in de te beschermen ruimte is opgesteld moet voorzien zijn van een
      overdrukventiel. Deze moet ervoor zorgen dat de inhoud van de houder zonder gevaar in de te beschermen ruimte
      stroomt, wanneer de houder aan de invloed van brand is blootgesteld en de brandblusinstallatie niet in werking
      is gesteld.

      c) Iedere houder moet zijn uitgerust met een inrichting waardoor de gasdruk kan worden gecontroleerd.

      d) De vulgraad van de houders mag niet meer zijn dan 1,15 kg/l. Voor het volume van het uitgestroomde HFC-227ea
      moet worden uitgegaan van 0,1374 m3/kg.

      e) De hoeveelheid HFC-227ea voor de te beschermen ruimte moet ten minste 8% van het bruto volume van die ruimte
      bedragen. Deze hoeveelheid moet binnen 10 seconden toegevoerd zijn.

      f) De houders van HFC-227ea moeten voorzien zijn van een controlesysteem van de druk dat bij een ontoelaatbaar
      verlies van drijfgas een akoestisch en optisch alarmsignaal in het stuurhuis in werking stelt. Wanneer er geen
      sprake is van een stuurhuis moet het alarmsignaal buiten de te beschermen ruimte in werking worden gesteld.

      g) Na het uitstromen van het blusmiddel mag de concentratie in de te beschermen ruimte niet groter zijn dan 10,5%.

      h) De brandblusinstallatie mag geen enkel onderdeel uit aluminium bevatten.

      12. Brandblusinstallaties met IG-541

      Brandblusinstallaties die werken met IG-541 als blusmiddel moeten, behalve aan de eisen, bedoeld in het eerste tot
      en met negende lid, aan de volgende bepalingen voldoen:

      a) Indien er sprake is van meerdere te beschermen ruimten met een verschillende bruto inhoud, moet iedere ruimte
      voorzien zijn van een eigen brandblusinstallatie.

      b) Iedere houder die IG-541 bevat en in de te beschermen ruimte is opgesteld moet voorzien zijn van een
      overdrukventiel. Deze moet ervoor zorgen dat de inhoud van de houder zonder gevaar in de te beschermen ruimte
      stroomt, wanneer de houder aan de invloed van brand is blootgesteld en de brandblusinstallatie niet in werking
      is gesteld.

      c) Iedere houder moet zijn uitgerust met een inrichting waarmee de gasdruk kan worden gecontroleerd.

      d) De druk waaronder de houders zijn gevuld mag bij + 15 °C niet meer bedragen dan 200 bar.

      e) De hoeveelheid IG-541 voor de te beschermen ruimte moet ten minste 44% en niet meer dan 50% van het bruto volume
      van die ruimte bedragen. Deze hoeveelheid moet binnen 120 seconden toegevoerd zijn.

      13. Brandblusinstallaties met FK-5-1-12

      Brandblusinstallaties die werken met FK-5-1-12 als blusmiddel moeten, behalve aan de eisen bedoeld in het eerste
      tot en met negende lid, aan de volgende bepalingen voldoen:

      a) Indien er sprake is van meerdere te beschermen ruimten met een verschillende bruto inhoud, moet iedere ruimte
      voorzien zijn van een eigen brandblusinstallatie.

      b) Iedere houder die FK-5-1-12 bevat en in de te beschermen ruimte is opgesteld moet voorzien zijn van een
      overdrukventiel. Deze moet ervoor zorgen dat de inhoud van de houder zonder gevaar in de te beschermen ruimte
      stroomt, wanneer de houder aan de invloed van de brand is blootgesteld en de brandblusinstallatie niet in werking
      is gesteld.

      c) Iedere houder moet zijn uitgerust met een inrichting waarmee de gasdruk kan worden gecontroleerd.

      d) De vulgraad van de houders mag niet meer zijn dan 1,00 kg/l. Voor het specifieke volume van het uitgestroomde
      FK-5-1-12 moet 0,0719 m3/kg genomen worden.

      e) Het volume FK-5-1-12 in de te beschermen ruimte moet minstens 5,5% van het bruto volume van die ruimte bedragen.
      Deze hoeveelheid moet binnen 10 seconden toegevoerd zijn.

      f) De houders van FK-5-1-12 moeten voorzien zijn van een controlesysteem van de druk dat bij een ontoelaatbaar
      verlies van drijfgas een akoestisch en optisch alarmsignaal in het stuurhuis in werking stelt. Wanneer er geen
      sprake is van een stuurhuis moet het alarmsignaal buiten de te beschermen ruimte in werking worden gesteld.

      g) Na het uitstromen van het blusmiddel mag de concentratie in de te beschermen ruimte niet groter zijn dan 10,0%.

      14. Brandblusinstallaties met water als brandblusmiddel

      De brandblusinstallaties die gebruik maken van water als brandblusmiddel mogen dit water uitsluitend in de vorm van
      verneveld water in de te beschermen ruimte afgeven. De druppelgrootte moet 5 tot 300 micrometer bedragen.

      De bedoelde brandblusinstallaties moeten behalve aan de eisen bedoeld in het eerste tot en met zevende lid en in
      het negende lid, aan de volgende eisen voldoen, waarbij het achtste lid van overeenkomstige toepassing is:

      a) Brandblusinstallaties moeten beschikken over een typegoedkeuring op grond van MSC/Circ. 1165 of een andere
      door één van de lidstaten erkende norm. De typegoedkeuring wordt uitgevoerd door een erkend classificatiebureau of
      door een gemachtigde testinstelling. De gemachtigde testinstelling moet voldoen aan de Europese normen inzake de
      algemene eisen aan de kundigheid van test- en kalibreerlaboratoria (EN ISO/IEC 17025 : 2005).

      b) De brandblusinstallatie moet overeenkomstig de afmetingen van de grootste te beschermen ruimte gedimensioneerd
      zijn en het water gedurende ten minste 30 minuten continu in de ruimte kunnen sproeien.

      c) De pompen, hun schakelinrichtingen en de ventielen die nodig zijn voor de werking van de installatie moeten
      in een ruimte buiten de te beschermen ruimten worden geïnstalleerd. De ruimte waarin zij zich bevinden, moet
      gescheiden zijn van daarnaast gelegen ruimten door scheidingsvlakken van ten minste type A30.

      d) De brandblusinstallatie moet ten minste tot aan de inschakelventielen permanent volledig met water gevuld
      zijn en onder de vereiste bedrijfsdruk staan. De pompen voor de watertoevoer moeten bij een inschakeling van de
      installatie automatisch in werking treden. De installatie moet continu met water worden gevoed. De installatie moet
      beschermd zijn tegen verontreinigingen die het functioneren kunnen belemmeren.

      e) Het leidingsysteem van de installatie moet zijn gedimensioneerd aan de hand van een hydraulische
      berekeningsmethode.

      f) Het aantal en de plaatsing van de sproeikoppen moeten een toereikende verspreiding van het water in de te
      beschermen ruimten garanderen. De installatie van de sproeikoppen moet de verspreiding van het vernevelde water in
      de totale te beschermen ruimte garanderen, in het bijzonder op plaatsen met een verhoogd brandrisico, ook achter de
      installaties en onder de vloerplaten.

      g) De elektrische componenten van de brandblusinstallatie in de te beschermen ruimte moeten ten minste voldoen aan
      de beschermingsklasse IP54. Het systeem moet over twee onafhankelijke energiebronnen met automatische schakeling
      beschikken. Eén van de energiebronnen moet zich buiten de te beschermen ruimte bevinden. Elke energiebron moet de
      installatie op eigen kracht kunnen aandrijven.

      h) De brandblusinstallatie moet zijn voorzien van redundante pompen.

      i) De brandblusinstallatie moet zijn uitgerust met een controlesysteem dat in de volgende gevallen een alarmsignaal
      in het stuurhuis in werking kan stellen:

        - laag peil in de watertank (indien aanwezig),
        - wegvallen van de stroom,
        - drukverlaging in de leidingen van de lagedrukinstallatie,
        - drukverlaging in het hogedrukcircuit,
        - bij de inschakeling van de installatie.

      j) De benodigde documenten voor de installatie, de controle en de documentatie van de installatie zoals bedoeld in
      het negende lid, moeten ten minste omvatten:

        - een algemeen overzicht van het systeem met vermelding van de leidingsecties en de soorten sproeikoppen,
        - de hydraulische berekening bedoeld onder letter d,
        - de technische documentatie van de fabrikant met alle componenten van de installatie,
        - de onderhoudshandleiding.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
