  - number: '29.08'
    text: |-
      1. Algemeen

      Voor het publiek toegankelijke ruimten en verblijven en de uitrusting daarvan moeten zo zijn uitgevoerd dat
      personen bij normaal gebruik niet kunnen worden verwond bij een normale start of stop, dan wel bij een noodstart of
      noodstop, noch bij manoeuvreren onder normale vaaromstandigheden dan wel bij motoruitval of een stuurfout.

      2. Communicatie

      a) Passagiersschepen moeten, ten behoeve van informatieverstrekking over veiligheidsmaatregelen, zijn uitgerust met
      optische en akoestische inrichtingen, die door alle passagiers gezien en gehoord kunnen worden.

      b) De schipper moet in staat zijn om met behulp van de onderdeel a bedoelde inrichtingen aanwijzingen aan de
      passagiers te geven.

      c) Voor iedere passagier moeten in de nabijheid van zijn zitplaats aanwijzingen voor noodsituaties voorhanden
      zijn, met inbegrip van een overzichtsschets van het schip waarop alle uitgangen, evacuatieroutes, nooduitrusting,
      reddingsmiddelen alsmede het gebruik van de zwemvesten duidelijk zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.08
  - number: '29.09'
    text: |-
      Uitgangen en vluchtwegen moeten voldoen aan de volgende eisen:

      a) Een gemakkelijke, veilige en snelle toegang vanuit de stuurstelling naar de voor het publiek toegankelijke
      ruimten en verblijven moet zijn gegarandeerd.

      b) De vluchtwegen naar de nooduitgangen moeten duidelijk en duurzaam zijn gemarkeerd.

      c) Alle uitgangen moeten voldoende gemarkeerd zijn. Het functioneren van het openingsmechanisme moet van buiten en
      van binnen duidelijk zijn te herkennen.

      d) De vluchtwegen en nooduitgangen moeten over een geschikt veiligheidsgeleidesysteem beschikken.

      e) Naast de uitgangen moet voldoende ruimte voor een lid van de bemanning aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.09
  - number: '29.10'
    text: |-
      1. Gangen, voor het publiek toegankelijke ruimten en verblijven, alsmede keukens en machinekamers moeten zijn
      aangesloten op een doelmatige brandmeldinstallatie. De aanwezigheid van een brand en de plaats daarvan moeten
      automatisch op een permanent door het scheepspersoneel bezette plaats worden aangegeven.

      2. Machinekamers moeten zijn voorzien van een vast ingebouwde brandblusinstallatie, bedoeld in
      [artikel 13.05][ref1].

      3. Voor het publiek toegankelijke ruimten en verblijven en de daarbij horende vluchtwegen moeten zijn uitgerust met
      een automatisch werkende vaste brandblusinstallatie, bedoeld in [artikel 13.04][ref2] Bluswater moet snel en direct
      naar buiten kunnen worden afgevoerd


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13.05
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel13.04
