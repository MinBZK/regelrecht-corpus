  - number: '3.04'
    text: |-
      1. De ruimten waarin machine-installaties of ketels, alsmede hun toebehoren, zijn opgesteld, moeten zodanig
      uitgerust en ingericht zijn dat bediening, toezicht en onderhoud van de zich aldaar bevindende installaties
      gemakkelijk en zonder gevaar kunnen geschieden.

      2. Bunkers voor vloeibare brandstof of smeerolie mogen met ruimten bestemd voor passagiersverblijven en met
      verblijven geen begrenzingsvlakken gemeen hebben die bij normaal bedrijf onder de statische druk van de vloeistof
      staan.

      3. Wanden, dekken en deuren van de machinekamers, ketelruimen en bunkers moeten van staal of een ander
      gelijkwaardig onbrandbaar materiaal zijn gemaakt.

      Isolaties in machinekamers moeten zijn beschermd tegen het binnendringen van olie en oliedampen.

      Alle openingen in wanden, dekken en deuren van machinekamers, ketelruimen en bunkers moeten van buitenaf kunnen
      worden gesloten. De afsluitinrichtingen moeten van staal of een ander gelijkwaardig onbrandbaar materiaal zijn
      gemaakt.

      4. Machinekamers, ketelruimen en andere ruimten waarin zich brandbare of giftige gassen kunnen ontwikkelen, moeten
      voldoende kunnen worden geventileerd.

      5. De trappen en ladders die toegang geven tot machinekamers, ketelruimen en bunkers moeten vast zijn aangebracht
      en zijn gemaakt van staal of van een ander stootvast en onbrandbaar materiaal.

      6. Machinekamers en ketelruimen moeten twee uitgangen hebben, waarvan er een als nooduitgang mag zijn uitgevoerd.

      Van een tweede uitgang kan worden afgezien, indien:

      a) het grondvlak (gemiddelde lengte • gemiddelde breedte ter hoogte van de vloerplaten) van een machinekamer of
      ketelruim in totaal niet meer bedraagt dan 35 m2,

      b) de vluchtweg vanaf iedere standplaats waar bedieningshandelingen of onderhoudswerkzaamheden moeten worden
      uitgevoerd tot aan de uitgang, of tot aan het voetpunt van de trap bij de uitgang die naar buiten leidt, niet meer
      bedraagt dan 5 m, en

      c) bij de plaats van onderhoud die het verst verwijderd is van de uitgang een draagbaar blustoestel aanwezig is, en
      in afwijking van [artikel 13.03, eerste lid onderdeel e][ref1], ook indien de geïnstalleerde motorcapaciteit 100 kW
      of minder bedraagt.

      7. Het toegestane niveau van de geluidsdruk in de machinekamers mag niet groter zijn dan 110 dB(A). De meetpunten
      moeten worden gekozen met inachtneming van de noodzakelijke onderhoudswerkzaamheden tijdens het normale bedrijf van
      de installaties.


