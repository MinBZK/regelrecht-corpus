  - number: '21.01'
    text: |-
      1. Vaartuigen die bestemd zijn om te duwen moeten zijn voorzien van een geschikte duwinrichting. Zij moeten zo zijn
      gebouwd en uitgerust dat:

      a) voor het personeel de passage naar het geduwde vaartuig gemakkelijk en zonder gevaar mogelijk is, ook wanneer de
      koppelingsmiddelen zijn aangebracht;

      b) zij een vaste positie kunnen innemen ten opzichte van het gekoppelde vaartuig of de gekoppelde vaartuigen, en

      c) ten opzichte van elkaar verschuiven van de vaartuigen wordt voorkomen.

      2. Indien bij het koppelen kabels worden gebruikt, moeten op het voor het duwen geschikte vaartuig ten minste twee
      speciale lieren of gelijkwaardige inrichtingen voor het spannen van de kabels zijn aangebracht.

      3. De koppelingsinrichting moet een hechte verbinding met het geduwde vaartuig of de geduwde vaartuigen mogelijk
      maken.

      Bij duwstellen die bestaan uit één duwend en slechts één geduwd vaartuig mogen de koppelingsinrichtingen echter
      ook een gestuurd knikken mogelijk maken. De daartoe vereiste aandrijvingen moeten de over te brengen krachten
      probleemloos kunnen opvangen en zij moeten gemakkelijk en zonder gevaar kunnen worden bediend. Voor deze
      aandrijvingen zijn de [artikelen 6.02 tot en met 6.04][ref1] van overeenkomstige toepassing.

      4. Bij duwboten is een aanvaringsschot als bedoeld in [artikel 3.03, eerste lid onderdeel a][ref2], niet vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6.02
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel3.03
