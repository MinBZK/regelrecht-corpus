  - number: '18.10'
    text: |-
      De gemachtigde testinstelling moet voldoen aan de Europese norm EN ISO/IEC 17025 : 2005, en is onderworpen aan de
      volgende voorwaarden:

      a) de fabrikanten van boordzuiveringsinstallaties kunnen niet als technische dienst worden erkend;

      b) voor de toepassing van doeleinden van dit hoofdstuk mag een technische dienst met toestemming van de bevoegde
      autoriteit gebruik maken van inrichtingen buiten zijn eigen testinstelling.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.10
  - number: '19.01'
    text: |-
      1. De volgende bepalingen zijn niet van toepassing:

      a) [artikel 3.02, eerste lid, onderdeel b][ref1];

      b) [artikelen 4.01 tot en met 4.03][ref2];

      c) [artikel 8.08, tweede lid, tweede zin, en zevende lid][ref3];

      d) [artikel 10.14, derde lid, tweede zin][ref4], bij nominale spanningen van meer dan 50 V.

      2. De volgende installaties zijn op passagiersschepen verboden:

      a) lampen die werken op vloeibaar gas en vloeibare brandstof als bedoeld in
      [artikel 15.07, derde lid, tweede zin][ref5];

      b) met pitbranders uitgeruste installaties als bedoeld in [artikel 16.02, tweede en derde lid][ref6];

      c) oliekachels met verdampingsbranders als bedoeld in [artikel 16.04][ref7];

      d) verwarmingsapparaten en verwarmingsketels als bedoeld in [artikel 16.07][ref8];

      e) vloeibaargasinstallaties als bedoeld in [hoofdstuk 17][ref9].

      3. Schepen, die niet van eigen mechanische middelen tot voortbeweging zijn voorzien, kunnen niet tot het vervoer
      van passagiers worden toegelaten.

      4. Op passagiersschepen moeten ruimten beschikbaar zijn voor mensen met een beperkte mobiliteit, die aan de in dit
      hoofdstuk genoemde bepalingen voldoen.

      5. In afwijking van [artikel 7.02, tweede lid, eerste volzin][ref10], mag de dode hoek voor de boeg van het lege
      schip met halve voorraden en zonder ballast voor de roerganger niet meer zijn dan twee maal de scheepslengte of 250
      m, al naargelang welke afstand het kortste is.

      6. In afwijking van [artikel 7.02, derde lid, derde alinea][ref11], moet een passagiersschip met geschikte
      hulpmiddelen zijn uitgerust wanneer een vrij zicht naar achteren niet gewaarborgd is. Ingeval met deze
      hulpmiddelen bij het varen des nachts vrij zicht niet gewaarborgd is, moet de dienovereenkomstige beperking in het
      binnenschipcertificaat onder nummer 52 worden aangetekend.


