  - number: '9.06'
    text: |-
      1. Na de inbouw van de interne verbrandingsmotor aan boord, maar voor zijn ingebruikstelling, moet een
      inbouwkeuring worden uitgevoerd. Deze keuring, die deel uitmaakt van het eerste onderzoek van het vaartuig of van
      een bijzonder onderzoek naar aanleiding van de inbouw van de betreffende motor, leidt ofwel tot het inschrijven
      van de interne verbrandingsmotor in het eerste af te geven binnenschipcertificaat ofwel tot een wijziging van het
      bestaande binnenschipcertificaat.

      2. Tijdens de inbouwkeuring verifieert de Commissie van Deskundigen of de ingebouwde motor nog steeds voldoet
      aan de technische vereisten met betrekking tot het uitstootniveau van schadelijke gassen en luchtverontreinigende
      deeltjes, ook nadat deze na afgifte van de typegoedkeuring wijzigingen of aanpassingen heeft ondergaan.

      3. De Commissie van deskundigen kan van een inbouwkeuring, bedoeld in lid 1, afzien indien een motor waarvan het
      nominale referentievermogen *P* minder dan 130 kW bedraagt, wordt vervangen door een interne verbrandingsmotor
      met een zelfde typegoedkeuring overeenkomstig artikel 9.01, tweede lid. Voorwaarde hiervoor is dat de Commissie
      van deskundigen in kennis wordt gesteld van de vervanging van de interne verbrandingsmotor en een kopie van het
      certificaat van typegoedkeuring alsmede het identificatienummer van de nieuw ingebouwde motor ontvangt. Ten gevolge
      hiervan wordt nummer 52 van het binnenschipcertificaat gewijzigd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.06
  - number: '9.07'
    text: |-
      1. In geval van een tussentijdse keuring verifieert de Commissie van Deskundigen of de ingebouwde motor nog
      steeds voldoet aan de technische vereisten met betrekking tot het uitstootniveau van schadelijke gassen en
      luchtverontreinigende deeltjes, ook nadat deze sinds de inbouwkeuring wijzigingen of aanpassingen heeft ondergaan.

      2. De tussentijdse keuringen van de interne verbrandingsmotor worden uitgevoerd in het kader van de periodieke
      controle van het vaartuig.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.07
  - number: '9.08'
    text: |-
      1. In geval van een bijzondere keuring verifieert de Commissie van Deskundigen of de ingebouwde motor na elke
      belangrijke wijziging nog steeds voldoet aan de technische vereisten met betrekking tot het uitstootniveau van
      schadelijke gassen en luchtverontreinigende deeltjes.

      2. Na elke belangrijke wijziging van een interne verbrandingsmotor die een invloed heeft op de uitstoot van
      schadelijke gassen en luchtverontreinigende deeltjes, moet altijd een bijzondere keuring plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.08
  - number: '9.09'
    text: |-
      1. De uitlaatgasnabehandelingssystemen mogen de veilige werking van het vaartuig, met inbegrip van het
      voortstuwingssysteem en de stroomvoorziening, niet in gevaar brengen, noch het uitlaatsysteem blokkeren.

      2. Als het uitlaatgasnabehandelingssysteem van een interne verbrandingsmotor die de hoofdvoortstuwing van het
      vaartuig vormt, met een omloopsysteem is uitgerust, moet het omloopsysteem aan de volgende voorwaarden voldoen:

      a) Als het uitlaatgasnabehandelingssysteem uitvalt, moet het vaartuig door inschakeling van het omloopsysteem in
      staat zijn zich op eigen kracht voort te bewegen.

      b) Als het omloopsysteem wordt ingeschakeld, moet het controlesysteem ervan een akoestisch en optisch alarmsignaal
      geven in het stuurhuis.

      c) Het omloopcontrolesysteem registreert alle incidenten waarbij de motor in bedrijf was met een ingeschakeld
      omloopsysteem, in een permanent computergeheugen. Deze informatie moet ter beschikking worden gesteld van de
      bevoegde autoriteiten.

      3. Controlediagnosesystemen die overeenkomstig artikel 25, derde lid, onderdeel f van Verordening (EU) 2016/1628
      zijn geïnstalleerd, zijn uitgerust met de voorgeschreven alarmen die in geval van een defect een akoestisch en
      optisch alarmsignaal geven in het stuurhuis.

      4. Als het nabehandelingssysteem gebruik maakt van een reagens om de emissies te verlagen, moeten de voorgeschreven
      alarmen de bemanning waarschuwen dat het reagens moet worden aangevuld vóór de tank leeg is of dat het reagens moet
      worden vervangen als er niet wordt voldaan aan de vereiste concentratie.

      Indien het in artikel 25, derde lid, onderdeel f van Verordening (EU) 2016/1628 bedoelde controlediagnosesysteem
      tot een vermogensreductie van de interne verbrandingsmotor kan leiden, moet aan de volgende vereisten worden
      voldaan:

      a) Ondanks het activeren van de vermogensreductie moet het vaartuig in staat blijven om zich op eigen kracht voort
      te bewegen.

      b) Als de vermogensreductie geactiveerd wordt, moet er een akoestisch en optisch alarmsignaal in het stuurhuis
      worden afgegeven.

      5. Aan de in het eerste lid bedoelde verplichting wordt geacht te zijn voldaan als het vaartuig is uitgerust met
      een

      a) tweede onafhankelijk voortstuwingssysteem (zelfs wanneer dit tweede systeem ook met een
      uitlaatgasnabehandelingssysteem is uitgerust), zodat het zich op eigen kracht kan blijven voortbewegen; of

      b) nabehandelingssysteem met een omloopsysteem overeenkomstig het tweede lid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel9.09
  - number: '10.01'
    text: |-
      1. Indien voor bepaalde onderdelen van een elektrische installatie of een elektrisch apparaat bijzondere
      voorschriften ontbreken, wordt de veiligheidsgraad als voldoende beschouwd wanneer die onderdelen zijn vervaardigd
      volgens een geldende Europese norm of volgens de voorschriften van een erkend classificatiebureau.

      De vereiste documenten moeten worden voorgelegd aan de Commissie van deskundigen.

      2. Aan boord moeten de volgende, door de Commissie van deskundigen gewaarmerkte, documenten aanwezig zijn:

      a) overzichtsschema's van de gehele elektrische installatie;

      b) schema's van het hoofdschakelbord, het noodschakelbord en de verdeelschakelborden waarop de belangrijkste
      technische gegevens zoals de nominale stroom van zekeringen en schakeltoestellen zijn aangegeven;

      c) gegevens betreffende het vermogen van elektrische apparaten;

      d) soort en doorsnede van de kabels;

      e) bij elektrische scheepsaandrijvingen schema’s van de schakelborden en documentatie met betrekking tot de
      elektrische aandrijfmotoren;

      f) schema’s van de elektronische sturing, regel-, alarm- en veiligheidssystemen;

      g) schema’s van de stuurstroomkringen.

      In geval van onbemande vaartuigen hoeven deze documenten zich niet aan boord te bevinden, daarentegen te allen
      tijde door de eigenaar getoond kunnen worden.

      3. De apparaten en installaties moeten bestand zijn tegen permanente slagzij van het vaartuig tot 15° en een
      omgevingstemperatuur, bij plaatsing binnen in het schip, van 0 °C tot + 40 °C en, bij plaatsing aan dek, van – 20
      °C tot + 40 °C geschikt zijn. Zij moeten binnen deze grenswaarden onberispelijk functioneren.

      4. Elektrische apparaten en installaties moeten goed toegankelijk en onderhoudsvriendelijk zijn.

      5. Elektrische apparaten en installaties moeten zodanig uitgevoerd en ingebouwd zijn dat de trillingen die onder
      normale bedrijfsomstandigheden aan boord optreden geen storingen of schade veroorzaken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.01
  - number: '10.02'
    text: |-
      1. Aan boord van vaartuigen die zijn voorzien van een elektrische installatie moeten ten behoeve van de
      energieverzorging ten minste twee energiebronnen aanwezig zijn, zodat bij het uitvallen van één energiebron de
      resterende energiebron in staat is om verbruikers die voor de veilige vaart noodzakelijk zijn, gedurende ten minste
      30 minuten te voeden.

      2. Aan de hand van een vermogensbalansberekening moet worden aangetoond dat de energieverzorging over voldoende
      capaciteit beschikt. Hierbij kan een passende gelijktijdigheidsfactor in aanmerking worden genomen.

      3. Onverminderd het eerste lid is voor de energiebronnen van stuurinrichtingen [artikel 6.04][ref1] van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6.04
