  - number: '10.04'
    text: |-
      1. In ruimten of zones waarin een explosiegevaarlijke atmosfeer kan ontstaan, mag alleen explosies beschermde
      elektrisch inrichtingen (erkend veilig) worden toegepast. Deze inrichtingen moeten ten aanzien van hun
      bedrijfszekerheid in een explosiegevaarlijke omgeving door een krachtens de nationale bepalingen van een lidstaat
      erkend keuringsinstituut gekeurd en toegelaten zijn.

      In deze ruimten of zones moet de installatie van schakeltoestellen voor verlichting en voor andere elektrische
      apparaten zoveel mogelijk worden vermeden. De beschermingsgraad tegen explosies moet zijn afgestemd op de
      eigenschappen met betrekking tot de atmosfeer die zich daar kan voordoen en de vereisten van de desbetreffende zone
      (explosiegroep, temperatuurklasse).

      De aanwijzingen en voorwaarden van de toelatingsverklaringen voor de inrichtingen moeten in acht worden genomen.

      De indeling en beoordeling van explosieve zones moet geschieden en gedocumenteerd worden overeenkomstig de
      internationale normen EN 60079-10-1 : 2015 en EN 60079-10-2 : 2015.

      2. Voor explosiegevaarlijke gebieden geldt:

      a) In zone 0 zijn uitsluitend intrinsiek veilige stroomkringen met een explosiebescherming (bescherming Ex ia)
      overeenkomstig de internationale norm IEC 60079-11 : 2012 toegelaten.

      b) In zone 1 zijn uitsluitend elektrische installaties toegelaten die geschikt zijn voor gebruik in een
      explosiegevaarlijke omgeving (erkend veilig).

      c) Voor elektrische installaties in gebieden van zone 2 moeten beschermende maatregelen worden getroffen die met de
      aard en toepassing van de elektrische functionele apparaten overeenstemmen.

      In deze gebieden zijn toegelaten:

      aa) elektrische installaties die geschikt zijn voor gebruik in een explosiegevaarlijke omgeving (erkend veilig), of

      bb) elektrische functionele apparaten die wanneer zij in werking zijn geen vonken afgeven en waarvan het oppervlak
      dat in contact staat met de omgevende lucht, geen ontoelaatbare temperatuur kan bereiken, of

      cc) elektrische functionele apparaten die op eenvoudige wijze tegen overdruk of dampdicht geïsoleerd zijn (minimale
      bescherming IP 55) en waarvan het oppervlak geen ontoelaatbare temperatuur kan bereiken.

      3. Voor de bescherming tegen stofexplosies gelden de vereisten van de Europese norm EN 60079-10-2 : 2015.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.04
