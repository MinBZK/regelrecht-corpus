      - id: ref4
        bwb_id: BWBR0041395
        artikel: '18.08'
        hoofdstuk: '18'
  - number: '18.07'
    text: |-
      1. De bevoegde autoriteit die een typegoedkeuring verleent, vergewist er zich van tevoren van dat de met betrekking
      tot bijlage 7, onderdeel I, passende voorzorgsmaatregelen zijn getroffen om een doeltreffende controle van de
      conformiteit van de productie te waarborgen. Zij kan hierbij samenwerken met andere krachtens dit hoofdstuk
      bevoegde autoriteiten en met de bevoegde autoriteiten van de lidstaten.

      2. De bevoegde autoriteit die een typegoedkeuring heeft verleend, vergewist zich ervan dat de in het eerste lid
      bedoelde voorzorgsmaatregelen met betrekking tot de bepalingen van bijlage 7, onderdeel I, nog steeds afdoende
      zijn en elke geproduceerde boordzuiveringsinstallatie die krachtens dit hoofdstuk van een typegoedkeuringsnummer
      is voorzien, nog steeds beantwoordt aan de beschrijving die in het certificaat van typegoedkeuring en de daarbij
      horende bijlagen inzake het boordzuiveringsinstallatietype is gegeven. Zij kan hierbij samenwerken met andere
      krachtens dit hoofdstuk bevoegde autoriteiten en met de bevoegde autoriteiten van de lidstaten.

      3. De bevoegde autoriteit kan vergelijkbare controles van andere bevoegde autoriteiten met betrekking tot de
      bepalingen in het eerste en tweede lid als gelijkwaardig erkennen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.07
  - number: '18.08'
    text: |-
      1. Er is sprake van non-conformiteit met het typegoedgekeurde boordzuiveringsinstallatietype, indien er afwijkingen
      worden vastgesteld van de kenmerken in het certificaat van typegoedkeuring of eventueel in het informatiepakket,
      indien deze afwijkingen niet door de bevoegde autoriteit die de typegoedkeuring heeft verleend zijn toegestaan op
      grond van artikel 18.04, derde lid.

      2. Indien de bevoegde autoriteit die een typegoedkeuring heeft verleend, vaststelt dat boordzuiveringsinstallaties
      niet conform zijn met het boordzuiveringsinstallatietype waarvoor zij de goedkeuring heeft verleend, neemt zij
      de nodige maatregelen om ervoor te zorgen dat de in productie zijnde boordzuiveringsinstallaties opnieuw in
      overeenstemming worden gebracht met het typegoedgekeurde boordzuiveringsinstallatietype. De bevoegde autoriteit die
      de non-conformiteit heeft vastgesteld, stelt de andere bevoegde autoriteiten in kennis van de genomen maatregelen,
      die kunnen gaan tot de intrekking van de typegoedkeuring.

      3. Indien een bevoegde autoriteit kan aantonen dat boordzuiveringsinstallaties die van een typegoedkeuringsnummer
      zijn voorzien, niet conform zijn met het typegoedgekeurde boordzuiveringsinstallatietype, kan zij van de
      bevoegde autoriteit die de typegoedkeuring heeft verleend, verzoeken te controleren of de in productie zijnde
      boordzuiveringsinstallaties conform zijn met het typegoedgekeurde boordzuiveringsinstallatietype. De hiertoe
      vereiste maatregelen moeten binnen zes maanden na de datum van het verzoek worden genomen
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.08
  - number: '18.09'
    text: |-
      1. Uiterlijk drie maanden na de ingebruikname van het vaartuig of na de inbouw achteraf en de
      overeenkomstige controle van het functioneren van de boordzuiveringsinstallatie, neemt de bevoegde
      autoriteit tijdens de exploitatie van het vaartuig een steekproef ter controle van het nakomen van de in
      [artikel 18.01, tweede lid, tabel 2][ref1] vermelde controlewaarden.

      De bevoegde autoriteit controleert bovendien door middel van steekproefmetingen van tijd tot tijd zonder vaste
      regelmaat het goede functioneren van de boordzuiveringsinstallatie om vast te stellen of de in artikel 18.01,
      tweede lid, tabel 2, vermelde controlewaarden nog worden nagekomen.

      Indien de bevoegde autoriteit vaststelt dat de waarden van de steekproefmetingen de controlewaarden, bedoeld in
      [artikel 18.01, eerste lid, tabel 2][ref2], niet nakomen dan kan zij eisen:

      a) dat de gebreken van de boordzuiveringsinstallatie worden verholpen, zodat de installatie weer naar behoren
      werkt;

      b) dat de conformiteit van de boordzuiveringsinstallatie met de typegoedkeuring wordt hersteld, of

      c) dat een speciale test overeenkomstig het derde lid wordt verricht.

      Indien de gebreken worden verholpen en de conformiteit van de boordzuiveringsinstallatie met de vereisten van de
      typegoedkeuring wordt hersteld, kan de bevoegde autoriteit opnieuw steekproefmetingen verrichten.

      Indien de gebreken niet worden verholpen of indien de conformiteit van de boordzuiveringsinstallatie
      met de vereisten van de typegoedkeuring niet wordt hersteld, verzegelt de bevoegde autoriteit de
      boordzuiveringsinstallatie en informeert de Commissie van deskundigen, die vervolgens een overeenkomstige
      aantekening op het binnenschipcertificaat onder nummer 52 maakt.

      2. De metingen van de steekproeven moeten geschieden volgens de in [artikel 18.01, tweede lid, tabel 2][ref3],
      voorgeschreven normen.

      3. Indien de bevoegde autoriteit aan de boordzuiveringsinstallatie bijzonderheden vaststelt die op een afwijking
      van de typegoedkeuring zou kunnen wijzen, dan voert de bevoegde autoriteit een speciale test uit, om de feitelijke
      toestand van de boordzuiveringsinstallatie met betrekking tot de onderdelen, de ijking en de afstellingen van de
      parameters zoals die in het proces-verbaal van de kenmerken van de boordzuiveringsinstallatie zijn gespecificeerd,
      vast te stellen.

      Indien de bevoegde autoriteit vaststelt dat de boordzuiveringsinstallatie niet conform is met het typegoedgekeurde
      boordzuiveringsinstallatietype, kan zij:

      a) eisen dat

      aa) de conformiteit van de boordzuiveringsinstallatie wordt hersteld, of

      bb) als bedoeld in [artikel 18.04][ref4] de typegoedkeuring dienovereenkomstig wordt gewijzigd of

      b) een meting overeenkomstig het keuringsvoorschrift wordt uitgevoerd, als bedoeld in bijlage 7, onderdeel IX.

      Indien de conformiteit niet wordt hersteld of de typegoedkeuring niet dienovereenkomstig wordt aangepast, of
      indien de uitgevoerde metingen, bedoeld onder onderdeel b, aantonen dat de vastgestelde grenswaarden, bedoeld in
      [artikel 18.01, tweede lid, onderdeel a, tabel 1][ref5], niet worden nagekomen, verzegelt de bevoegde autoriteit
      de boordzuiveringsinstallatie en informeert de Commissie van deskundigen, die vervolgens een overeenkomstige
      aantekening op het binnenschipcertificaat onder nummer 52 maakt.

      4. De keuringen als bedoeld in het derde lid geschieden aan de hand van het inlichtingenformulier van de
      fabrikant ter controle van de componenten betrekking hebbend op de afvalwaterreiniging en de kenmerken van de
      boordzuiveringsinstallatie. In dit formulier, dat door de fabrikant wordt opgesteld en dat door een bevoegde
      autoriteit moet worden goedgekeurd, worden de onderdelen die betrekking hebben op de afvalwaterreiniging alsmede de
      instellingen, dimensioneringscriteria, en kenmerken gespecificeerd, bij toepassing waarvan kan worden uitgegaan van
      een onafgebroken inachtneming van de waarden van [artikel 18.01, tweede lid, tabel 1 en 2][ref6]. Daarin wordt ten
      minste vermeld:

      a) het boordzuiveringsinstallatietype met een beschrijving van de werkwijze en of afvalwaterverzameltanks vóór de
      boordzuiveringsinstallatie moeten worden geïnstalleerd;

      b) een lijst van de voor de reiniging van het afvalwater specifieke componenten;

      c) toegepaste bouw- en dimensioneringscriteria, dimensioneringsvereisten en regelgeving;

      d) schematische weergave van de boordzuiveringsinstallatie met niet te verwarren merktekens om de toegelaten
      componenten betrekking hebbend op de afvalwaterreiniging te identificeren (bijv. nummers van onderdelen die zich op
      de componenten bevinden).

      5. De krachtens het derde lid, derde volzin, buiten bedrijf verzegelde boordzuiveringsinstallatie mag alleen na een
      speciale test, bedoeld in het derde lid, eerste volzin, weer in gebruik genomen worden.


