      controleposten evenals verzamelruimten moeten voldoen aan type A60 en ruimten met sprinklerinstallaties aan type A
      30. 6 Voor scheidingsvlakken tussen keukens en koelruimten of voorraadruimten voor levensmiddelen is B15 voldoende.


