  - number: '21.07'
    text: |-
      1. Indien een vaartuig een samenstel moet voortbewegen of daarin moet worden voortbewogen, moet
      in het certificaat van onderzoek zijn aangetekend dat het daarvoor geschikt is overeenkomstig de
      [artikelen 21.01 tot en met 21.06][ref1].

      2. In het binnenschipcertificaat van het vaartuig dat voor de voortbeweging zorgtmoet worden aangetekend:

      a) de toegelaten samenstellen en formaties;

      b) het soort koppelingen;

      c) de vastgestelde grootste koppelingskrachten, en

      d) eventueel de minimumbreeksterkte van de koppelingskabels van de langsverbindingen, alsmede het aantal windingen
      van de koppelingskabels.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel21.01
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel21.07
