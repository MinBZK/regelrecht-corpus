  - number: 32.04.2
    text: |-
      Voor vaartuigen, waarvan het minste vrijboord overeenkomstig [artikel 4.04][ref1] van de op 31 maart 1983 geldende
      voorschriften is vastgesteld, kan de Commissie van deskundigen op verzoek van de eigenaar het vrijboord vaststellen
      op grond van [artikel 4.03][ref2] van de op 1 januari 1995 geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel4
