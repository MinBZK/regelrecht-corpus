  - number: '19.06'
    text: |-
      1. Passagiersverblijven moeten:

      a) zich op alle dekken achter het vlak van het aanvaringsschot en, voor zover ze onder het schottendek zijn
      gelegen, vóór het vlak van het achterpiekschot bevinden, en

      b) gasdicht gescheiden zijn van machinekamers en ketelruimen.

      Dekzones, die door dekzeilen of dergelijke mobiele inrichtingen niet alleen naar boven, maar ook zijdelings
      gedeeltelijk of geheel zijn overdekt, moeten aan dezelfde eisen als aan gesloten passagiersverblijven voldoen.

      2. Kasten als bedoeld in [artikel 14.13][ref1] en ruimten voor brandbare vloeistoffen moeten zich buiten het gebied
      bestemd voor passagiers bevinden.

      3. Aantal en breedte van uitgangen van passagiersverblijven moeten aan de volgende voorwaarden voldoen:

      a) Verblijven of groepen van verblijven die voor 30 of meer passagiers zijn bestemd of ingericht, dan wel voor
      12 of meer passagiers bedden bieden, moeten ten minste twee uitgangen hebben. Op schepen voor dagtochten mag één
      van deze twee uitgangen door twee nooduitgangen worden vervangen. Verblijven, uitgezonderd hutten, en groepen van
      verblijven met slechts één uitgang moeten ten minste één nooduitgang hebben.

      b) Indien zich verblijven onder het schottendek bevinden, mag één van de uitgangen een waterdichte deur in een
      schot, bedoeld in [artikel 19.02, tiende lid][ref2], zijn die toegang geeft tot een aangrenzend compartiment
      van waaruit het hoger gelegen dek rechtstreeks kan worden bereikt. De andere uitgang moet direct of, wanneer dit
      overeenkomstig onderdeel a is toegestaan, als nooduitgang naar het schottendek dan wel naar buiten leiden. Dit
      geldt niet voor de afzonderlijke hutten.

      c) Uitgangen, bedoeld onder a en b, moeten doelmatig zijn aangebracht en een vrije breedte van ten minste 0,80 m
      en een vrije hoogte van ten minste 2,00 m hebben. Bij deuren van hutten voor passagiers en andere kleine verblijven
      mag de vrije breedte worden verminderd tot 0,70 m.

      d) Bij verblijven of groepen van verblijven die voor meer dan 80 passagiers zijn bestemd moet het totaal van de
      breedte van alle uitgangen die voor passagiers zijn bestemd, en door hen in geval van nood moeten worden gebruikt,
      ten minste 0,01 m per passagier bedragen.

      e) Indien het aantal passagiers voor de totale breedte van de uitgangen maatgevend is, moet de breedte van elke
      uitgang ten minste 0,005 m per passagier bedragen.

      f) Nooduitgangen moeten een kleinste zijdelingse lengte van ten minste 0,60 m hebben of een minimale diameter van
      0,70 m. Zij moeten kunnen worden geopend in de vluchtrichting en aan beide zijden zijn gekenmerkt.

      g) Uitgangen van verblijven die zijn bestemd om gebruikt te worden door personen met beperkte mobiliteit, moeten
      een vrije breedte hebben van ten minste 0,90 m. Uitgangen die gewoonlijk worden gebruikt voor het aan of van boord
      gaan van personen met beperkte mobiliteit, moeten over een vrije breedte beschikken van 1,50 m.

      4. Deuren van passagiersverblijven moeten aan de volgende eisen voldoen:

      a) Met uitzondering van deuren die naar verbindingsgangen leiden, moeten ze naar buiten opengaan of als
      schuifdeuren zijn uitgevoerd.

      b) Hutdeuren moeten zodanig zijn uitgevoerd dat zij te allen tijde ook van buitenaf kunnen worden geopend.

      c) Automatische deuren moeten wanneer de aandrijfenergie uitvalt gemakkelijk kunnen worden geopend.

      d) Bij deuren die zijn bestemd om gebruikt te worden door personen met beperkte mobiliteit moet aan de zijde
      waarnaar de deur opengaat een zijdelingse afstand bestaan tussen binnenkant van de deurpost aan de kant van het
      slot en de naburige loodrecht op het vlak van de deur aangebrachte wand van ten minste 0,60 m.

      5. Verbindingsgangen moeten aan de volgende eisen voldoen:

      a) Zij moeten een vrije breedte hebben van ten minste 0,80 m. Wanneer zij naar ruimten leiden die voor meer dan 80
      passagiers zijn voorzien, moeten zij aan de in het derde lid, onderdeel d en e, bedoelde vereisten ten aanzien van
      de breedte van de naar de verbindingsgangen leidende uitgangen voldoen.

      b) Hun vrije hoogte mag niet minder zijn dan 2,00 m.

      c) Verbindingsgangen die zijn bestemd voor het gebruik door personen met een beperkte mobiliteit moeten een vrije
      breedte hebben van minstens 1,30 m. Verbindingsgangen met een breedte van meer dan 1,50 m moeten aan beide zijden
      van een handrail zijn voorzien.

      d) Indien slechts één verbindingsgang of -trap naar een voor passagiers bestemde ruimte leidt, moet de vrije
      breedte daarvan ten minste 1,00 m bedragen.

      e) Verbindingsgangen mogen geen treden of niveauverschillen hebben.

      f) Zij mogen alleen naar vrije dekken, ruimten of trappen leiden.

      g) Doodlopende gedeelten van verbindingsgangen mogen niet langer dan twee meter zijn.

      6. Vluchtwegen moeten behalve aan het vijfde lid aan de volgende voorwaarden voldoen:

      a) Bij de inrichting van trappen, uitgangen en nooduitgangen moet ingecalculeerd zijn dat bij brand in een
      willekeurig verblijf alle andere verblijven verlaten kunnen worden.

      b) Vluchtwegen moeten de kortste weg volgen naar verzamelruimten als bedoeld in het achtste lid.

      c) Vluchtwegen mogen niet door machinekamers en keukens leiden.

      d) In vluchtwegen mogen geen gangen met klimtreden, ladders en dergelijke zijn ingebouwd.

      e) Deuren in vluchtwegen moeten zodanig zijn gebouwd dat ze geen inbreuk maken op de minimale breedte van
      vluchtwegen als bedoeld in het vijfde lid, onder a of d.

      f) Vluchtwegen en nooduitgangen moeten duidelijk zijn gemarkeerd. De markeringen moeten door de noodverlichting
      worden belicht.

      7. Vluchtwegen en nooduitgangen moeten beschikken over een geschikt veiligheidsgeleidesysteem.

      8. Voor alle personen aan boord moeten verzamelruimten beschikbaar zijn, die aan de volgende eisen voldoen:

      a) De totale oppervlakte *A* van de verzamelruimten moet ten minste voldoen aan de volgende waarde:

      Schepen voor dagtochten *A* = 0,35 • *F* [*m*2 ]

      Hotelschepen *A* = 0,45 • *F* [*m*2 ]

      In deze formule betekent:

      *F* = ten hoogste aan boord toegelaten aantal passagiers.

      b) Iedere individuele verzamel- en evacuatieruimte moet groter zijn dan 10 m2.

      c) De verzamelruimten moeten vrij zijn van zowel losstaand als vast meubilair.

      d) Indien zich in een ruimte, waarin een verzamelruimte aangewezen is, verplaatsbaar meubilair bevindt, moet dit
      voldoende zijn beveiligd tegen verschuiven.

      e) Indien zich in een ruimte, waarin een verzamelruimte aangewezen is, vast ingebouwde zitplaatsen bevinden,
      behoeft het aantal personen waarvoor de ruimte geschikt is bij de berekening van het totaal van de oppervlakken
      van de in onderdeel a bedoelde verzamelruimten niet in acht te worden genomen. Het aantal personen waarvoor in een
      ruimte vast ingebouwde zitplaatsen aanwezig zijn mag echter niet groter zijn dan het aantal personen waarvoor in
      dezelfde ruimte verzamelruimten beschikbaar zijn.

      f) Vanuit de evacuatieruimten moeten de reddingsmiddelen eenvoudig toegankelijk zijn.

      g) Een veilige evacuatie van personen vanuit deze evacuatieruimten moet aan beide zijden van het schip mogelijk
      zijn.

      h) De verzamelruimten moeten boven de indompelingsgrenslijn liggen.

      i) De verzamel- en evacuatieruimten moeten in het veiligheidsplan als zodanig worden aangegeven en aan boord worden
      gemarkeerd.

      j) De voorschriften, bedoeld onder d en e, gelden eveneens voor open dekken waarop verzamelruimten zijn aangewezen.

      k) Indien gemeenschappelijke reddingsmiddelen overeenkomstig [artikel 19.09, vijfde lid][ref3], aan boord aanwezig
      zijn, behoeft het aantal personen, waarvoor zij geschikt zijn, bij de berekening van het totaaloppervlak van de
      verzamelruimten, bedoeld onder a, niet in acht te worden genomen.

      l) Het totaaloppervlak, bedoeld onder a, moet echter voor alle gevallen, waarbij een reductie overeenkomstig de
      onderdelen e, j en k wordt toegepast, voor ten minste 50% van het ten hoogste toegelaten aantal passagiers aan
      boord toereikend zijn.

      9. Trappen in het gedeelte voor passagiers en hun portalen moeten:

      a) Overeenkomstig de Europese norm EN 13056 : 2000, zijn gebouwd.

      b) Een vrije breedte van ten minste 0,80 m hebben dan wel, wanneer zij naar verbindingsgangen of trappen leiden die
      door meer dan 80 passagiers worden gebruikt, van ten minste 0,01 m per passagier.

      c) Een vrije breedte van minstens 1,00 m hebben, wanneer zij naar een voor passagiers bestemde ruimte leiden, die
      slechts over deze verbindingstrap toegankelijk is.

      d) Zich in de veilige zone bevinden voor zover aan iedere zijde van het schip in dezelfde ruimte niet ten minste
      één trap beschikbaar is.

      e) Bovendien, indien zij zijn bestemd voor het gebruik door personen met beperkte mobiliteit, aan de volgende eisen
      voldoen:

      aa) de helling van de trappen mag niet steiler zijn dan 38°;

      bb) de trappen moeten een vrije breedte hebben van minstens 0,90 m.

      cc) wenteltrappen zijn niet toegestaan;

      dd) trappen mogen niet in dwarsrichting in het schip zijn aangebracht;

      ee) de leuningen van trappen moeten aan het begin en het eind van een horizontale uitloop van 0,30 m zijn voorzien
      zodanig, dat zij doorgang voorlangs niet bemoeilijken;

      ff) leuningen en voorkanten ten minste van de eerste en de laatste trede alsook de vloerbedekking aan de uiteinden
      van de trap moeten wat de kleur betreft contrasteren.

      Liften die zijn bestemd voor het gebruik door personen met beperkte mobiliteit en stijgvoorzieningen als trapliften
      of hefplatformen moeten volgens een desbetreffende norm of voorschrift van een lidstaten uitgevoerd zijn.

      10. De voor passagiers bestemde, niet afgesloten delen van de dekken moeten aan de volgende eisen voldoen:

      a) Zij moeten door een vaste verschansing van ten minste 1,00 m hoogte of een reling volgens de Europese norm EN
      711 : 2016, bouwwijze PF, PG of PZ, zijn omgeven. Verschansing en relingen van dekken die zijn bestemd voor het
      gebruik door personen met beperkte mobiliteit moeten een hoogte hebben van ten minste 1,10 m.

      b) Openingen en inrichtingen voor embarkeren en debarkeren en voor laden en lossen moeten kunnen worden beveiligd
      en een vrije breedte hebben van ten minste 1,00 m. Openingen die gewoonlijk worden gebruikt voor embarkeren en
      debarkeren van personen met beperkte mobiliteit moeten een vrije breedte hebben van ten minste 1,50 m.

      c) Indien de openingen en inrichtingen voor embarkeren en debarkeren niet vanuit het stuurhuis te zien zijn, moeten
      er optische of elektronische hulpmiddelen aanwezig zijn.

      11. De gedeelten van het schip die niet voor passagiers zijn bestemd, met name de toegangen tot het stuurhuis,
      tot de lieren en tot de machinekamers, moeten voor het betreden door onbevoegden kunnen worden beveiligd. Bij deze
      toegangen moet bovendien op een opvallende plaats een teken overeenkomstig schets 1 van bijlage 4 zijn aangebracht.

      12. Loopplanken moeten overeenkomstig de Europese norm EN 14206 : 2003, zijn vervaardigd. In afwijking van
      [artikel 13.02, derde lid, onder d][ref4], mag hun lengte minder dan 4 m bedragen.

      13. Verkeerswegen die zijn bestemd voor gebruik door personen met beperkte mobiliteit moeten een vrije breedte van
      ten minste 1,30 m hebben en vrij zijn van drempels en opstaande randen die een hoogte van 0,025 m te boven gaan.
      Wanden van verkeerswegen die zijn bestemd voor gebruik door personen met beperkte mobiliteit moeten zijn voorzien
      van handrelingen op een hoogte van 0,90 m boven de vloer.

      14. Glazen deuren, glazen wanden van verkeerswegen en vensterruiten moeten van voorgespannen glas of van gelaagd
      glas zijn vervaardigd. Zij mogen ook van kunststof zijn vervaardigd, indien dit uit een oogpunt van brandveiligheid
      toelaatbaar is.

      Doorzichtige deuren en tot aan de vloer doorlopende doorzichtige wanden van verkeerswegen moeten opvallend zijn
      gemarkeerd.

      15. Opbouwen die volledig of waarvan de daken uit panoramaruiten bestaan, of overdekkingen door dekzeilen of
      dergelijke mobiele inrichtingen evenals de constructies daaronder mogen slechts van dergelijk materiaal zijn
      vervaardigd en dusdanig zijn gerealiseerd dat in geval van schade de kans op verwonding van personen aan boord zo
      klein mogelijk houdt.

      16. Drinkwaterinstallaties moeten ten minste aan de eisen van [artikel 15.05][ref5] voldoen.

      17. Er moeten toiletten voor passagiers beschikbaar zijn. Ten minste één toilet moet volgens een betreffende norm
      of voorschrift van een lidstaat voor het gebruik door personen met beperkte mobiliteit uitgevoerd zijn en via een
      passagiersverblijf dat is bestemd voor het gebruik door personen met beperkte mobiliteit te bereiken zijn.

      18. Hutten die geen venster hebben dat geopend kan worden moeten zijn aangesloten op een airconditioning- of
      ventilatiesysteem.

      19. Op verblijven waarin bemanning of boordpersoneel is ondergebracht is dit artikel van overeenkomstige
      toepassing.


