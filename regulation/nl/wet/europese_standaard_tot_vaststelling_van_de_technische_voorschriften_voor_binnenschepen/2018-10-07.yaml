  - number: '22.01'
    text: |-
      Voor drijvende werktuigen zijn voor wat betreft bouw en uitrusting de [hoofdstukken 3][ref1],
      [7 tot en met 17][ref2] en [21][ref3] van toepassing. Drijvende werktuigen met mechanische middelen tot
      voortbeweging moeten ook voldoen aan de [hoofdstukken 5][ref4] en [6][ref5]. Aandrijvingen die slechts een geringe
      verplaatsing mogelijk maken worden niet beschouwd als mechanische middelen tot voortbeweging.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk3
