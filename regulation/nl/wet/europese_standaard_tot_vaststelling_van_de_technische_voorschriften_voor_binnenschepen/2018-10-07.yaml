  - number: '20.17'
    text: |-
      1. De zeilen moeten eenvoudig, snel en veilig kunnen worden gestreken.

      2. Het zeiloppervlak is passend voor het scheepstype en de waterverplaatsing.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.17
  - number: '20.18'
    text: |-
      1. Schepen die met een kluiverboom of een boegspriet zijn uitgerust, moeten voorzien zijn van een kluivernet en een
      toereikend aantal daarbij behorende rem- en spanvoorzieningen.

      2. Van de in eerste lid bedoelde uitrusting kan worden afgezien indien de kluiverboom of boegspriet met een hand-
      en voetgeleiding is uitgerust die voldoende is gedimensioneerd voor het gebruik van een aan boord mee te voeren
      veiligheidsgordel.

      3. Voor het werken aan de tuigage dient een bootmansstoeltje beschikbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.18
  - number: '20.19'
    text: |-
      1. De tuigage wordt om de 2,5 jaar door de Commissie van deskundigen gekeurd. De keuring omvat ten minste een
      inspectie van:

      a) de zeilen, inclusief de lijken, schoothoek en reefogen;

      b) de toestand van masten en rondhouten;

      c) de toestand van het staand en lopend want, inclusief de draadverbindingen;

      d) de uitrusting om het zeil snel en veilig te kunnen strijken;

      e) de deugdelijke bevestiging van blokken van vallen en dirken;

      f) de bevestiging van mastkokers en overig aan de scheepsconstructie aangebrachte bevestigingspunten van staand en
      lopend want;

      g) de voor de zeilvoering aanwezige lieren;

      h) de overige ten behoeve van het zeilen aangebrachte voorzieningen zoals zwaarden en de voor de bediening daarvan
      aanwezige installaties;

      i) de voorzieningen die zijn getroffen om schavielen van rondhouten, staand en lopend want en zeilen te voorkomen;

      j) de uitrusting als bedoeld in [artikel 20.18][ref1].

      2. Het onderdeks gelegen deel van doorgestoken houten masten wordt regelmatig, na een door de Commissie van
      deskundigen vastgelegde tussentijd, maar uiterlijk bij ieder periodiek onderzoek onderzocht. Hiertoe wordt de mast
      getrokken voor inspectie aangeboden.

      3. Een door de Commissie van deskundigen afgegeven, gedateerd en ondertekend bewijsstuk van de laatste
      overeenkomstig eerste lid uitgevoerde keuring bevindt zich aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel20.18
