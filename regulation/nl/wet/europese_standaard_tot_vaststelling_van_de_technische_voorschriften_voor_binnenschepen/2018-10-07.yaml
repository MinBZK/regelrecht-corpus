  - number: 32.03.1
    text: |-
      Voor vaartuigen waarvan de kiel is gelegd op 1 april 1976 of daarvóór mogen, aanvullend aan de overgangsbepalingen
      van [artikel 32.02][ref1], de hierna genoemde bepalingen, worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel32
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.03
    references:
