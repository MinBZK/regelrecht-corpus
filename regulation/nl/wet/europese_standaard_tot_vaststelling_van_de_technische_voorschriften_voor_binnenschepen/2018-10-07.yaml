articles:
  - number: '1.01'
    text: |-
      In deze standaard gelden de volgende definities:

      1.1 *‘vaartuig’:* een schip of een drijvend werktuig; 1.2 *‘schip’:* een binnenschip of een zeeschip; 1.3
      *‘binnenschip’:* een schip dat uitsluitend of overwegend bestemd is voor de vaart op de binnenwateren; 1.4
      *‘zeeschip’:* een schip dat is toegelaten voor de zee- of kustvaart en overwegend daartoe is bestemd; 1.5
      *‘motorschip’:* een motortankschip of een motorvrachtschip; 1.6 *‘motortankschip’:* een schip dat is bestemd
      voor het vervoer van goederen in vaste tanks en gebouwd om door middel van zijn eigen mechanische middelen
      tot voortbeweging zelfstandig te varen; 1.7 *‘motorvrachtschip’:* een schip, niet zijnde een motortankschip,
      dat is bestemd voor het vervoer van goederen en gebouwd om door middel van zijn eigen mechanische middelen tot
      voortbeweging zelfstandig te varen; 1.8 *‘kanaalspits’:* een binnenschip waarvan de lengte niet meer dan 38,50 m
      en de breedte niet meer dan 5,05 m bedraagt; 1.9 *‘sleepboot’:* een schip dat speciaal is gebouwd om te slepen;
      1.10 *‘duwboot’:* een schip dat speciaal is gebouwd voor het voortbewegen van een duwstel; 1.11 *‘sleepschip’:*
      een sleeptankschip of een sleepvrachtschip; 1.12 *‘sleeptankschip’:* een schip dat is bestemd voor het vervoer van
      goederen in vaste tanks en is gebouwd om te worden gesleept zonder eigen mechanische middelen tot voortbeweging,
      dan wel met eigen mechanische middelen tot voortbeweging die slechts verplaatsingen over kleine afstanden
      toelaten; 1.13 *‘sleepvrachtschip’:* een schip, niet zijnde een sleeptankschip, dat is bestemd voor het vervoer
      van goederen en is gebouwd om te worden gesleept zonder eigen mechanische middelen tot voortbeweging, dan wel
      met eigen mechanische middelen tot voortbeweging die slechts verplaatsingen over kleine afstanden toelaten; 1.14
      *‘duwbak’:* een tankduwbak, een vrachtduwbak of een zeeschipbak; 1.15 *‘tankduwbak’:* een schip dat is bestemd
      voor het vervoer van goederen in vaste tanks en gebouwd of in het bijzonder geschikt is om te worden geduwd
      zonder eigen mechanische middelen tot voortbeweging, dan wel met eigen mechanische middelen tot voortbeweging
      die slechts verplaatsingen over kleine afstanden toelaten, wanneer het geen deel uitmaakt van een duwstel; 1.16
      *‘vrachtduwbak’:* een schip, niet zijnde een tankduwbak, dat is bestemd voor het vervoer van goederen en gebouwd
      of in het bijzonder geschikt is om te worden geduwd zonder eigen mechanische middelen tot voortbeweging, dan
      wel met eigen mechanische middelen tot voortbeweging die slechts verplaatsingen over kleine afstanden toelaten,
      wanneer het geen deel uitmaakt van een duwstel; 1.17 *‘zeeschipbak’:* een duwbak die is gebouwd om aan boord van
      een zeeschip te kunnen worden vervoerd en om de binnenwateren te bevaren; 1.18 *‘passagiersschip’:* een schip
      voor dagtochten of een hotelschip dat is gebouwd en ingericht voor het vervoer van meer dan 12 passagiers; 1.19
      *‘zeilend passagiersschip’:* een passagiersschip dat is gebouwd en ingericht om ook door middel van zeilen te
      worden voortbewogen; 1.20 *‘schip voor dagtochten’:* een passagiersschip waarop zich geen hutten bevinden voor
      overnachting van passagiers; 1.21 *‘hotelschip’:* een passagiersschip waarop zich hutten bevinden voor overnachting
      van passagiers; 1.22 *‘snel schip’:* een schip met eigen mechanische middelen tot voortbeweging dat een snelheid
      ten opzichte van het water kan bereiken van meer dan 40 km/u; 1.23 *‘drijvend werktuig’:* een drijvend bouwsel
      waarop zich werkinstallaties bevinden, zoals kranen, baggermolens, hei-installaties of elevatoren; 1.24 *‘schip
      bestemd voor bouwwerkzaamheden’:* een schip dat vanwege zijn bouwwijze en uitrusting geschikt en bestemd is om
      voor werkzaamheden op bouwlocaties te worden gebruikt, zoals spoelbakken, onderlossers, dekschuiten, pontons of
      steenstorters; 1.25 *‘pleziervaartuig’:* een schip, niet zijnde een passagiersschip, dat is bestemd voor sportieve
      en recreatieve doeleinden; 1.26 *‘bijboot’:* een boot om gebruikt te worden voor vervoer, redding, berging en
      werkzaamheden; 1.27 *‘drijvende inrichting’:* een drijvend bouwsel dat vanwege zijn bestemming in de regel niet
      wordt verplaatst, zoals een badinrichting, een dok, een steiger of een botenhuis; 1.28 *‘drijvend voorwerp’:* een
      vlot, alsmede een ander voorwerp of samenstel van voorwerpen dat geschikt is gemaakt om te varen en dat geen schip,
      drijvend werktuig of drijvende inrichting is; 1.29 *‘Traditioneel vaartuig’* een vaartuig, of de replica daarvan,
      dat op grond van zijn leeftijd, zijn technische of karakteristieke constructieve eigenschappen, zijn zeldzaamheid,
      zijn betekenis voor het behoud van traditionele principes van het zeemanschap of van binnenvaarttechnieken of zijn
      betekenis voor een tijdperk uit historisch oogpunt het waard is, te worden behouden, en dat in het bijzonder voor
      demonstratiedoeleinden wordt gebruikt; 1.30 *‘Replica van een traditioneel vaartuig’* een vaartuig dat voornamelijk
      uit oorspronkelijk materiaal in overeenkomstige bouwwijze volgens tekeningen of ontwerpen als traditioneel vaartuig
      werd nagebouwd;

      2.1 *‘samenstel’:* een hecht samenstel of een sleep; 2.2 *‘formatie’:* vorm van de samenstelling van een
      samenstel; 2.3 *‘hecht samenstel’:* een duwstel of een gekoppeld samenstel; 2.4 *‘duwstel’:* een hecht samenstel
      van vaartuigen, waarvan er ten minste één is geplaatst vóór het vaartuig met motoraandrijving dat dient voor
      het voortbewegen van het samenstel, dan wel voor de beide vaartuigen met motoraandrijving die dienen voor het
      voortbewegen van het samenstel en die worden aangeduid als ‘duwboot’ of ‘duwboten’. Hieronder wordt ook verstaan
      een duwstel dat is samengesteld uit een duwend en een geduwd vaartuig waarvan de koppelingen een beheerst knikken
      mogelijk maken; 2.5 *‘gekoppeld samenstel’:* een samenstel van langszijde van elkaar vastgemaakte vaartuigen,
      waarvan er geen is geplaatst vóór het vaartuig met motoraandrijving dat dient voor het voortbewegen van het
      samenstel; 2.6 *‘sleep’:* een samenstel van één of meer vaartuigen, drijvende inrichtingen of drijvende voorwerpen,
      dat wordt gesleept door één of meer tot het samenstel behorende vaartuigen met motoraandrijving;

      3.1 *‘hoofdmachinekamer’:* de ruimte waarin de voortstuwingsmotoren zijn opgesteld; 3.2 *‘machinekamer’:* een
      ruimte waarin verbrandingsmotoren zijn opgesteld; 3.3 *‘ketelruim’:* een ruimte waarin een met brandstof gestookte
      inrichting voor het opwekken van stoom of het verwarmen van thermische olie is opgesteld; 3.4 *‘elektrische
      bedrijfsruimte’:* een ruimte waarin zich onderdelen van een elektrische aandrijvingsinstallatie bevinden zoals
      schakelkasten of elektrische motoren en geen hoofdmachinekamer of machinekamer is; 3.5 *‘gesloten opbouw’:* een
      doorlopende vaste en waterdichte opbouw met vaste wanden die blijvend en waterdicht met het dek zijn verbonden; 3.6
      *‘stuurhuis’:* de ruimte waarin de voor het voeren van het schip noodzakelijke bedienings- en controleapparatuur
      is opgesteld; 3.7 *‘verblijf’:* de ruimte die bestemd is voor de gewoonlijk aan boord verblijvende personen, met
      inbegrip van keukens, provisiekamers, toiletten, wasgelegenheden, washokken, portalen en gangen, met uitzondering
      van het stuurhuis; 3.8 *‘passagiersverblijf’:* voor passagiers aan boord aangewezen ruimten en afgesloten zones
      zoals salons, kantoren, verkoopruimten, kapsalons, droogruimten, wasserijen, sauna's, toiletten, wasgelegenheden,
      gangen, verbindingsgangen en open trappenhuizen; 3.9 *‘controlepost’:* een stuurhuis, een ruimte waarin een
      noodstroominstallatie dan wel onderdelen daarvan aanwezig zijn of een ruimte met een permanent door boordpersoneel
      of leden van de bemanning bezette post, zoals voor brandmeldinstallaties, afstandsbedieningen van deuren of
      brandkleppen; 3.10 *‘trappenschacht’:* een schacht van een binnen het schip gelegen trap of van een lift; 3.11
      *‘verblijfsruimte’:* een ruimte van een verblijf of een passagiersverblijf. Op passagiersschepen zijn keukens
      geen verblijfsruimten; 3.12 *‘keuken’:* een ruimte met een fornuis of een vergelijkbare kookgelegenheid; 3.13
      *‘voorraadruimte’:* een ruimte voor de opslag van brandbare vloeistoffen of een ruimte met een vloeroppervlak van
      meer dan 4 m2 voor de opslag van voorraden; 3.14 *‘laadruim’:* een naar voren en achteren door schotten begrensd,
      open of door luiken gesloten deel van het schip, dat is bestemd voor het vervoer van goederen als stukgoed of in
      bulk, dan wel voor het onderbrengen van tanks die onafhankelijk zijn van de scheepsromp; 3.15 *‘vaste tank’:* een
      met het schip verbonden tank, waarbij de tankwanden kunnen worden gevormd ofwel door de scheepsromp zelf ofwel door
      wanden die onafhankelijk zijn van de scheepsromp; 3.16 *‘werkplek’:* een gebied waar de bemanning zijn werk moet
      verrichten, met inbegrip van loopplank, slingergiek en bijboot; 3.17 *‘verkeersweg’:* een gebied dat gewoonlijk
      dient voor het verplaatsen van personen en goederen; 3.18 *‘veilige zone’:* een gebied dat aan de buitenkant wordt
      begrensd door een loodrecht vlak, dat op een afstand van 1/5 *B* evenwijdig aan de scheepshuid in het vlak van
      de grootste inzinking loopt; 3.19 *‘verzamelruimten’:* ruimten op het schip die speciaal beschermd zijn en waar
      personen zich in geval van gevaar moeten ophouden; 3.20 *‘evacuatieruimten’:* deel van de verzamelruimten op het
      schip van waaruit een evacuatie van personen kan worden gerealiseerd; 3.21 *‘explosieve atmosfeer’:* een mengsel
      van lucht onder atmosferische condities met brandbare stoffen in de vorm van gas, damp, stof, vezels of pluizen,
      dat na ontsteking een zelfstandige uitbreiding van het vuur mogelijk maakt; 3.22 *‘explosiegevaarlijk gebied’:*
      een gebied waar een zodanige explosieve atmosfeer voorhanden is of zich kan voordoen dat voor de bouwwijze,
      de inrichting en het gebruik van apparatuur bijzondere beschermingsmaatregelen vereist zijn; 3.23 *‘zones’:*
      de indeling in explosiegevaarlijke gebieden in functie van de waarschijnlijkheid en de duur van het voorhanden
      zijn van een explosieve atmosfeer;‘zone 0’: een gebied waar een explosieve atmosfeer gedurende lange perioden of
      herhaaldelĳk aanwezig is.‘zone 1’: een gebied waar een explosieve atmosfeer onder normaal bedrĳf waarschĳnlĳk af en
      toe aanwezig kan zijn.‘zone 2’: een gebied waar de aanwezigheid van een explosieve atmosfeer onder normaal bedrijf
      niet waarschĳnlĳk is en waar, wanneer dit toch gebeurt, het verschĳnsel van korte duur is. Tot deze gebieden
      behoren ook zones die rechtstreeks aan zone 1 grenzen en niet gasdicht daarvan gescheiden zijn. 3.24 *‘elektrische
      inrichting (erkend veilig)’:* een elektrische inrichting die door de bevoegde autoriteit ten aanzien van zijn
      bedrijfszekerheid in een explosieve atmosfeer beproefd en toegelaten is;

      4.1 *‘vlak van de grootste inzinking’:* het vlak door de waterlijn, overeenkomende met de grootst mogelijke
      inzinking waarbij het vaartuig nog mag varen; 4.2 *‘veiligheidsafstand’:* de afstand tussen het vlak van de
      grootste inzinking en het daaraan evenwijdige vlak door het laagste punt waarboven het vaartuig niet meer als
      waterdicht wordt beschouwd; 4.3 *‘resterende veiligheidsafstand’:* de bij slagzij van het vaartuig aanwezige
      loodrechte afstand tussen het wateroppervlak en het laagste punt van de ingedompelde zijde, waarboven het
      vaartuig niet meer als waterdicht wordt beschouwd; 4.4 *‘vrijboord’ of ‘F’:* de afstand tussen het vlak van de
      grootste inzinking en het daaraan evenwijdige vlak door het laagste punt van het gangboord of, bij ontbreken
      van een gangboord, het laagste punt van het vaste boord; 4.5 *‘resterend vrijboord’:* de bij slagzij van het
      vaartuig aanwezige loodrechte afstand tussen het wateroppervlak en de bovenkant van het dek op het laagste
      punt van de ondergedompelde zijde of, indien er geen dek is, het laagste punt van het vaste boord; 4.6
      *‘indompelingsgrenslijn’:* een denkbeeldige lijn op de boordwand, die ten minste 10 cm onder het schottendek en
      ten minste 10 cm onder het laagste niet waterdichte punt van de boordwand loopt. Bij ontbreken van een schottendek
      moet worden uitgegaan van een lijn, die ten minste 10 cm onder de laagste lijn loopt tot waar de buitenbeplating
      waterdicht is; 4.7 *‘waterverplaatsing’ of ‘∀’:* het ingedompelde volume van het schip in m3; 4.8 *‘deplacement’
      of ‘Δ’:* totaal gewicht van het schip met inbegrip van de lading in t; 4.9 *‘blokcoëfficiënt’ of ‘CB’:* de
      verhouding van de waterverplaatsing tot het product van lengte *L* x breedte *B* x diepgang *T*; 4.10 *‘lateraal
      oppervlak boven de waterlijn’of ‘AV’:* het zijvlak van het schip boven de waterlijn in m2; 4.11 *‘schottendek’:*
      het dek tot waar de voorgeschreven waterdichte schotten zijn opgetrokken en vanwaar het vrijboord wordt gemeten;
      4.12 *‘schot’:* een over het algemeen verticale wand, dienend voor de indeling van het schip, en grenzend aan de
      scheepsbodem, boordwanden of andere schotten en die tot een zekere hoogte wordt opgetrokken; 4.13 *‘dwarsschot’:*
      een schot dat van boordwand tot boordwand reikt; 4.14 *‘wand’:* een over het algemeen verticaal scheidingsvlak;
      4.15 *‘scheidingswand’:* een niet waterdichte wand; 4.16 *‘lengte’ of ‘L’:* de grootste lengte van de scheepsromp
      in m, het roer en de boegspriet niet inbegrepen; 4.17 *‘lengte over alles’ of ‘LOA’:* de grootste lengte van
      het vaartuig in m met inbegrip van alle vaste aanbouwsels, zoals delen van roer- en voortstuwingsinstallaties,
      werktuigbouwkundige inrichtingen en dergelijke; 4.18 *‘lengte op de waterlijn’ of ‘LWL’:* de in het vlak van
      de grootste inzinking van het schip gemeten grootste lengte van de scheepsromp in m; 4.19 *‘breedte’ of ‘B’:*
      de grootste breedte van de scheepsromp in m, gemeten op de buitenkant van de huidbeplating (schoepraderen,
      schuurlijsten en dergelijke niet inbegrepen); 4.20 *‘breedte over alles’ of ‘BOA’:* de grootste breedte van het
      vaartuig in m met inbegrip van alle vaste aanbouwsels, zoals schoepraderen, schuurlijsten, werktuigbouwkundige
      inrichtingen en dergelijke; 4.21 *‘breedte op de waterlijn’ of ‘BWL’:* de grootste breedte van de scheepsromp,
      gemeten in het vlak van de grootste inzinking van het schip, op de buitenkant van de huidbeplating in m; 4.22
      *‘holte’ of ‘H’:* kleinste verticale afstand tussen de onderkant van de bodembeplating of van de kiel en het
      laagste punt van het dek aan de zijde van het schip in m; 4.23 *‘diepgang’ of ‘T’:* de verticale afstand in m
      tussen het laagste punt van de scheepsromp, zonder rekening te houden met de kiel of andere vaste onderdelen, en
      het vlak van de grootste inzinking van het schip; 4.24 *‘grootste diepgang’ of ‘TOA’:* de verticale afstand in m
      tussen het laagste punt van de scheepsromp, met inbegrip van de kiel of andere vaste onderdelen, en het vlak van de
      grootste inzinking van het schip; 4.25 *‘voorloodlijn’:* de loodrechte lijn door het snijpunt van de voorzijde van
      de scheepsromp met het vlak van de grootste inzinking; 4.26 *‘vrije breedte van het gangboord’:* de afstand tussen
      de loodrechte lijn door het meest ver in het gangboord uitstekende deel van het luikhoofd en de loodrechte lijn
      door de binnenkant van de beveiliging tegen vallen (reling, voetlijst) aan de buitenkant van het gangboord;

      5.1 *‘stuurinrichting’:* iedere voor het sturen van het schip benodigde inrichting die voor het bereiken van
      de manoeuvreereigenschappen als bedoeld in [hoofdstuk 5][ref1] moet worden gebruikt; 5.2 *‘roer’:* het roerblad
      of de roerbladen met de roerkoning en met inbegrip van het kwadrant, de helmstok en de verbindingsdelen met de
      stuurmachine; 5.3 *‘stuurmachine’:* het deel van de stuurinrichting dat de beweging van het roer bewerkstelligt;
      5.4 *‘stuurmachine-aandrijving’:* de aandrijving van de stuurmachine vanaf de energiebron tot de verbinding met de
      stuurmachine; 5.5 ** (zonder inhoud); 5.6 *‘besturing’:* de elementen en stroomkringen voor het bedienen van een
      motorische stuurmachine-aandrijving; 5.7 *‘aandrijfinstallatie van de stuurmachine’:* de stuurmachine-aandrijving
      met inbegrip van de bijbehorende besturing en energiebron; 5.8 *‘handaandrijving’:* een aandrijving waarbij
      de beweging van het roer wordt bewerkstelligd door een handbewogen stuurwiel met mechanische of hydraulische
      overbrenging, zonder gebruik van een extra energiebron; 5.9 *‘handhydraulische aandrijving’:* een handaandrijving
      met hydraulische overbrenging; 5.10 *‘stuurautomaat’:* een inrichting die, afhankelijk van de ingestelde waarde,
      een bepaalde draaisnelheid van het schip automatisch bewerkstelligt en handhaaft; 5.11 *‘éénmansstuurstelling voor
      het varen op radar’:* een stuurstelling die zodanig is ingericht dat het schip gedurende het varen op radar door
      één persoon kan worden gevoerd;

      6.1 *‘waterdicht’:* constructiedelen of inrichtingen die zo zijn uitgevoerd dat het binnendringen van water wordt
      verhinderd; 6.2 *‘spatwater- en regendicht’:* constructiedelen of inrichtingen die zo zijn uitgevoerd dat zij onder
      normale omstandigheden slechts een onbeduidende hoeveelheid water doorlaten; 6.3 *‘gasdicht’:* constructiedelen of
      inrichtingen die zo zijn uitgevoerd dat het doordringen van gassen of dampen wordt verhinderd; 6.4 *‘onbrandbaar’:*
      een materiaal dat niet brandbaar is en geen ontvlambare gassen ontwikkelt in zodanige hoeveelheden dat deze bij
      verhitting tot ongeveer 750 °C tot zelfontbranding overgaan; 6.5 *‘moeilijk ontvlambaar’:* een materiaal dat zelf
      of waarbij ten minste de oppervlakken daarvan het uitbreiden van een brand volgens de testprocedure als bedoeld in
      [artikel 19.11, eerste lid, onderdeel c][ref2], beperken; 6.6 *‘zelfdovend’:* de eigenschap van een brandbare stof
      om na verwijdering van de ontstekingsbron binnen korte tijd zelfstandig te doven, oftewel op te houden met branden;
      6.7 *‘brandwerendheid’:* de eigenschap van constructiedelen of inrichtingen die is aangetoond met de testprocedure
      als bedoeld in [artikel 19.11, eerste lid, onderdeel d][ref3]; 6.8 *‘code voor brandtestprocedures’:* de bij de
      resolutie MSC.307(88) van het maritieme veiligheidscommissie van de Internationale Maritieme Organisatie (IMO)
      aangenomen Internationale code voor de toepassing van brandtestprocedures (FTP-code);

      7.1 *‘navigatielichten’:* licht van navigatielantaarns voor het aanduiden van schepen; 7.2 *‘lichtseinen’:*
      flikkeringen ter versterking van optische of akoestische tekens; 7.3. *‘navigatieradarinstallatie’:* elektronisch
      hulpmiddel bij de navigatie voor de registratie en de weergave van de omgeving en het verkeer; 7.4 *‘Inland
      ECDIS’:* een systeem dat overeenkomstig de huidig geldende versie van de Inland ECDIS-standaard wordt gebruikt
      voor de elektronische weergave van binnenvaartkaarten en de daarmee verbonden informatie, dat geselecteerde
      informatie uit een specifiek geproduceerde elektronische binnenvaartkaart en naar keuze informatie van andere
      navigatiesensoren weergeeft; 7.5 *‘Inland ECDIS-apparaat’:* apparaat voor de weergave van elektronische
      binnenvaartkaarten dat in twee verschillende modi gebruikt kan worden: de informatiemodus en de navigatiemodus;
      7.6 *‘informatiemodus’:* gebruik van Inland ECDIS alleen voor informatiedoeleinden zonder geïntegreerd radarbeeld;
      7.7 *‘navigatiemodus’:* gebruik van Inland ECDIS bij het sturen van het schip met geïntegreerd radarbeeld; 7.8
      *‘Inland AIS-apparaat’:* een apparaat dat op een schip is ingebouwd en dat wordt gebruikt in de zin van de VTT-
      standaard; 7.9 *‘VTT-standaard’:* de Standaard voor Tracking en Tracing van schepen in de binnenvaart, editie 1.2,
      van de CCR of de technische specificaties zoals vastgelegd in de Uitvoeringsverordening (EU) nr. 689/2012; 7.10
      *‘Inland ECDIS-standaard’:* de Standaard Systeem voor elektronische weergave van binnenvaartkaarten en de daaraan
      verbonden informatie (Inland ECDIS), editie 2.3, van de CCR of de technische specificaties zoals vastgelegd in
      de Uitvoeringsverordening (EU) nr. 909/2013; 7.11 *‘Inland AIS-teststandaard’:* de Teststandaard voor Inland AIS,
      Editie 2.0, van CESNI;

      (zonder inhoud);

      (zonder inhoud);

      10.1 *‘erkend classificatiebureau’:* een classificatiebureau dat is erkend overeenkomstig de respectieve procedures
      van de CCR of van de EU; 10.2 *‘hoogste klasse’* een schip heeft de hoogste klasse, indien: – de scheepsromp met
      inbegrip van de roerinstallatie en het manoeuvreersysteem alsmede de uitrusting met ankers en kettingen beantwoordt
      aan de voorschriften van een erkend classificatiebureau en is gebouwd en getest onder toezicht daarvan; – de
      drijfinrichting alsmede de voor het gebruik aan boord noodzakelijke hulpmotoren en inrichtingen op het gebied van
      machinebouw en elektriciteit zijn aangelegd en getest volgens de voorschriften van dit classificatiebureau, de
      inbouw daarvan onder toezicht van het classificatiebureau is uitgevoerd en de installatie als geheel na de inbouw
      door het bureau met succes is beproefd; 10.3 *‘erkend deskundige’:* een persoon die door een bevoegde instantie
      of door een gemachtigde instantie is erkend, die bijzondere kennis heeft op het relevante gebied op grond van zijn
      vakkundige opleiding en ervaring, die volkomen vertrouwd is met de relevante voorschriften en algemeen erkende
      technische regels (bijv. EN-normen, relevante reglementen, technische regels) en die de betrokken installaties of
      inrichtingen kan keuren en met kennis van zaken kan beoordelen; 10.4 *‘deskundige’:* een persoon die bijzondere
      kennis heeft op het relevante gebied op grond van zijn vakkundige opleiding en ervaring, die volkomen vertrouwd
      is met de relevante voorschriften en algemeen erkende technische regels (bijv. EN-normen, relevante reglementen,
      technische regels) en die de betrokken installaties of inrichtingen kan keuren en met kennis van zaken kan
      beoordelen;

      11.1 *‘energiebron’:* een energiedrager of een energieomzetter die wordt gebruikt voor de winning van nuttige
      energie. Bij stuurmachine-aandrijvingen de energieverzorging van de stuurmachine-aandrijving en van de besturing
      vanuit het boordnet, een batterij, een accumulator of een verbrandingsmotor; 11.2 *‘stroombron’:* de energiebron
      van waaruit elektrische stroom wordt geleverd; 11.3 *‘accumulator’:* een oplaadbare energiebron op elektrochemische
      basis voor elektrische energie; 11.4 *‘batterij’:* een niet oplaadbare energiebron op elektrochemische basis voor
      elektrische energie; 11.5 *‘vermogenselektronica’:* een installatie, een toestel, een bouwgroep of -element voor de
      omvorming van elektrische stroom met elektronische schakelelementen of een systeem daarvan;

      12.1 *‘boordpersoneel’:* alle aan boord van een passagiersschip aangestelde personen die niet tot de bemanning
      behoren; 12.2 *‘personen met beperkte mobiliteit’:* personen die specifieke moeilijkheden hebben bij het gebruik
      van openbare vervoermiddelen, zoals oudere mensen, gehandicapten, personen met een handicap op het gebied van de
      zintuigen, rolstoelgebruikers, zwangere vrouwen en personen die kleine kinderen begeleiden; 12.3 *‘ADN’:* het in
      de bijlage bij het Europees Verdrag inzake het internationaal vervoer van gevaarlijke goederen over binnenwateren
      vermelde Reglement (ADN) in de huidig geldende versie; 12.4 *‘binnenschipcertificaat’:* Uniecertificaat voor
      binnenschepen of certificaat van onderzoek voor Rijnschepen dat door de bevoegde instantie is afgegeven, ten
      bewijze dat het voldoet aan de technische voorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel19
