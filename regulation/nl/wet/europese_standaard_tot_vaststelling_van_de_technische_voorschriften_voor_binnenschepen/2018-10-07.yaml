  - number: '26.01'
    text: |-
      1. Op pleziervaartuigen zijn van toepassing:

      a) van [hoofdstuk 3][ref1]:

      de [artikelen 3.01][ref2], [3.02, eerste lid, onderdeel a, en tweede lid][ref3],
      [3.03, eerste lid, onderdeel a, en zesde lid][ref4], en [3.04, eerste lid][ref5];

      b) [hoofdstuk 5][ref6];

      c) van [hoofdstuk 6][ref7]:

      de [artikelen 6.01, eerste lid][ref8], en [6.08][ref9];

      d) van [hoofdstuk 7][ref10]:

      de [artikelen 7.01, eerste en tweede lid][ref11], [7.02][ref12], [7.03, eerste en tweede lid][ref13],
      [7.04, eerste lid][ref14], en [7.05, tweede lid][ref15], en

      [artikel 7.13][ref16] voor pleziervaartuigen met een éénmansstuurstelling voor het varen op radar;

      e) van [hoofdstuk 8][ref17]:

      [artikel 8.01, eerste en tweede lid][ref18], [artikel 8.02, eerste en tweede lid][ref19],
      [artikel 8.03, eerste en derde lid][ref20], [artikel 8.04][ref21],
      [artikel 8.05, eerste tot en met tiende lid en dertiende lid][ref22], [artikel 8.06][ref23], [artikel 8.07][ref24],
      [artikel 8.08, eerste, tweede, vijfde, zevende en tiende lid][ref25], [artikel 8.09, eerste lid][ref26],
      [artikel 8.10][ref27];

      f) [hoofdstuk 9][ref28];

      g) van [hoofdstuk 10][ref29]:

      [artikel 10.01, eerste lid][ref30], van overeenkomstige toepassing;

      h) van [hoofdstuk 13][ref31]:

      [artikel 13.01, tweede, derde en vijfde tot en met veertiende lid][ref32],
      [artikel 13.02, eerste lid, onderdelen a tot en met c, en derde lid, onderdelen a en e tot en met h][ref33],
      [artikel 13.03, eerste lid, onderdelen a, b en d][ref34]: er moeten echter minstens twee blustoestellen aan
      boord aanwezig zijn; en voorts de artikelen 13.03, tweede tot en met zesde lid, [13.04][ref35], [13.05][ref36],
      [13.07][ref37] en [13.08][ref38];

      i) [hoofdstuk 16][ref39];

      j) [hoofdstuk 17][ref40].

      2. In het geval van pleziervaartuigen waarop [Richtlijn 2013/53](32013L0053)/EU van toepassing is, hebben het
      aanvankelijk onderzoek en de periodieke onderzoeken slechts betrekking op:

      a) [artikel 6.08][ref41], in het geval dat een bochtaanwijzer aanwezig is;

      b) de [artikelen 7.01, tweede lid][ref42], [7.02][ref43], en [7.03, eerste lid][ref44], alsmede
      [artikel 7.13][ref45], in het geval dat er sprake is van een éénmansstuurstelling voor het varen op radar;

      c) [artikel 8.01, tweede lid][ref46], [artikel 8.02, eerste lid][ref47], [artikel 8.03, derde lid][ref48],
      [artikel 8.05, vijfde lid][ref49], [artikel 8.08, tweede lid][ref50], [artikel 8.10][ref51];

      d) [artikel 13.01, tweede, derde, zesde en veertiende lid][ref52],
      [artikel 13.02, eerste lid, onderdelen b en c, en derde lid, onderdelen a en e tot en met h][ref53],
      [artikel 13.03, eerste lid, onderdelen b en d, en tweede tot en met zesde lid][ref54], en [artikel 13.08][ref55];

      e) [hoofdstuk 16][ref56];

      f) van [hoofdstuk 17][ref57]:

      aa) [artikel 17.12][ref58];

      bb) [artikel 17.13][ref59], waarbij de keuring na ingebruikneming van de vloeibaargasinstallatie overeenkomstig de
      eisen van [Richtlijn 2013/53/EG](32013L0053) geschiedt en aan de Commissie van deskundigen hierover een verklaring
      van goedkeuring moet wordenovergelegd;

      cc) de [artikelen 17.14][ref60] en [17.15][ref61] met dien verstande, dat de vloeibaargasinstallatie aan de eisen
      van [Richtlijn 2013/53/EG](32013L0053) moet beantwoorden;

      dd) [hoofdstuk 17][ref62] in zijn geheel, indien de vloeibaargasinstallatie wordt ingebouwd nadat het
      pleziervaartuig in het verkeer is gebracht.


