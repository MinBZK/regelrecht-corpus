    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.15
  - number: 20.15.2
    text: |-
      Het lopend want heeft, voorzover het deel uitmaakt van de verstaging, een breeksterkte die overeenkomt met die van
      het betrokken stag of want.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.15
  - number: 20.15.3
    text: |-
      Bij toepassing van andere dan de in eerste lid genoemde materialen moeten de sterktewaarden van de tabel uit eerste
      lid aangehouden worden. Touw uit polyethyleen mag niet worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.15
  - number: 20.16.1
    text: |-
      De diameter van de schijven (gemeten van het midden van de draad tot het midden van de draad) moet bij gebruik van
      staaldraad of touw ten minste aan de volgende eisen voldoen:












                      Diameter staaldraad [mm]


                      6


                      7


                      8


                      9


                      10


                      11


                      12




