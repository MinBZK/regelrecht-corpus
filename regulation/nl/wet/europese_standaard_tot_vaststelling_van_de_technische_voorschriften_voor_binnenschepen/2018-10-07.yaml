        bwb_id: BWBR0041395
  - number: '20.02'
    text: |-
      1. Voor zeilende passagiersschepen waarvan de *L* niet meer bedraagt dan 45 m en waarvan het hoogste toegestane
      aantal passagiers niet meer bedraagt dan *L* in gehele meters, gelden de volgende bepalingen niet:

      a) artikel 3.03, zevende lid, voorzover het anker niet binnen de buitenhuid is weggewerkt;

      b) artikel 13.02, tweede lid, onderdeel d, met betrekking tot de lengte;

      c) artikel 19.08, derde lid, onderdeel a;

      d) artikel 19.15, achtste lid.

      2. In afwijking van eerste lid kan het aantal passagiers worden verhoogd tot anderhalf maal *L* in gehele meters
      indien de zeilvoering en de inrichting van het dek dit toelaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.02
  - number: '20.03'
    text: |-
      1. Voor de berekening van het kenterend moment volgens [artikel 19.03, derde lid][ref1], moet bij de vaststelling
      van het zwaartepunt van het schip het opgedoekte zeil in de berekening worden meegenomen.

      2. Met inachtneming van alle beladingstoestanden volgens [artikel 19.02, tweede lid][ref2], en bij een standaard
      zeilvoering mag het door de winddruk veroorzaakte kenterend moment niet zo hoog zijn dat de hoek van slagzij groter
      wordt dan 20°. Daarbij moet:

      a) voor de berekening van een gelijk blijvende winddruk van 0,07 kN/m2 aangehouden worden;

      b) de resterende veiligheidsafstand minstens 100 mm bedragen, en mag

      c) het resterende vrijboord niet negatief zijn.

      3. De oprichtende arm van statische stabiliteit moet bij een hoek van slagzij

      a) van 25° of meer zijn maximale waarde *h* bereiken;

      b) van 30° of meer minstens 0,20 m bedragen;

      c) tot 60° positief zijn.

      4. Het vlak A onder de kromme van de oprichtende armen van statische stabiliteit mag

      a) tot 30° niet minder dan 0,055 *m* • *rad* bedragen;

      b) tot 40° of bij de hoek *φ* waarbij een onafgeschermde opening onder water raakt en die kleiner is dan 40°, niet
      minder dan 0,09 *m* • *rad* bedragen.

      Tussen

      c) 30° en 40° of

      d) tussen 30° en de hoek *φ* waarbij een onafgeschermde opening onder water raakt en die kleiner is dan 40°,

      mag dit vlak niet onder 0,03 *m* • *rad* liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19.03
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel19.02
