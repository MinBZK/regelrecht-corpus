  - number: 18.01.1
    text: Dit hoofdstuk is van toepassing op alle boordzuiveringsinstallaties die geïnstalleerd zijn in vaartuigen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.2.a)
    text: |-
      Boordzuiveringsinstallaties moeten bij de typekeuring aan de volgende grenswaarden voldoen:
                  Tabel 1: Tijdens de typekeuring bij de afvoer van de boordzuiveringsinstallatie (testinstallatie) na te
      komen grenswaarden







                          Kenmerk


                          Concentratie (Fase II)


                          Monstertype






                          Biochemische zuurstofbehoefte (*BZB*)
                          ISO 5815-1 en 5815-2 : 20031


                          20 mg/l


                          24-u-mengmonster, gehomogeniseerd




                          25 mg/l


                          Steekproef, gehomogeniseerd




                          Chemische zuurstofbehoefte (CZB)2
                          ISO 6060 : 19891


                          100 mg/l


                          24-u-mengmonster, gehomogeniseerd




                          125 mg/l


                          Steekproef, gehomogeniseerd




                          Totaal organisch gebonden koolstof (TOC)
                          EN 1484 : 19971


                          35 mg/l


                          24-u-mengmonster, gehomogeniseerd




                          45 mg/l


                          Steekproef, gehomogeniseerd




                 1 Lidstaten kunnen gelijkwaardige procedures voorzien. 2 In plaats van de chemische zuurstofbehoefte
      (CZB) kan voor de typekeuring ook van het totaal organisch gebonden koolstof (TOC) worden uitgegaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.2.b)
    text: |-
      Bij gebruik moet aan de volgende controlewaarden worden voldaan:
                  Tabel 2: Tijdens gebruik bij de afvoer vanuit de boordzuiveringsinstallatie na te komen controlewaarden







                          Kenmerk


                          Concentratie (Fase II)


                          Monstertype






                          Biochemische zuurstofbehoefte (*BZB*)
                          ISO 5815-1 en 5815-2 : 20031


                          25 mg/l


                          Steekproef, gehomogeniseerd




                          Chemische zuurstofbehoefte (CZB)2
                          ISO 6060 : 19891


                          125 mg/l


                          Steekproef, gehomogeniseerd




                          150 mg/l


                          Steekproef




                          Totaal organisch gebonden koolstof (TOC)
                          EN 1484 : 19971


                          45 mg/l


                          Steekproef, gehomogeniseerd




                 1 Lidstaten kunnen gelijkwaardige procedures voorzien. 2 In plaats van de chemische zuurstofbehoefte
      (CZB) kan voor de controle ook van het totaal organisch gebonden koolstof (TOC) worden uitgegaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.3
    text: |-
      Procedures met gebruik van chloorhoudende stoffen zijn niet toegestaan. Het is evenmin toegelaten, het
      huishoudelijk afvalwater te verdunnen om de specifieke belasting te verminderen en daardoor een verwerking mogelijk
      te maken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.4
    text: |-
      Voor de opslag, conservering (voor zover noodzakelijk) en afgifte van het slib moeten de nodige
      voorzorgsmaatregelen worden getroffen. Dit houdt tevens een beheerplan voor het zuiveringsslib in.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.5
    text: |-
      Het voldoen aan de grenswaarden bedoeld in het tweede lid, onderdeel a, tabel 1, wordt door een typekeuring
      bevestigd en door een typegoedkeuring vastgesteld. De typegoedkeuring wordt vastgelegd in een certificaat
      van typegoedkeuring. Voor de inbouw van de boordzuiveringsinstallatie moet een kopie van het certificaat van
      typegoedkeuring aan de Commissie van deskundigen worden gezonden. Een kopie van het certificaat van typegoedkeuring
      en van het proces-verbaal van de kenmerken van de boordzuiveringsinstallatie moeten zich aan boord bevinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.6
    text: |-
      Na de inbouw van de boordzuiveringsinstallatie aan boord, moet, voordat de installatie normaal in gebruik wordt
      genomen, door de fabrikant een controle van het functioneren worden uitgevoerd. De boordzuiveringsinstallatie
      moet met de onderstaande gegevens onder nummer 52 van het binnenschipcertificaat worden vermeld, met de volgende
      gegevens van de installatie:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.6.a)
    text: naam;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.6.b)
    text: typegoedkeuringsnummer;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.6.c)
    text: serienummer;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.6.d)
    text: bouwjaar.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.7
    text: |-
      Na elke belangrijke wijziging van een boordzuiveringsinstallatie die een invloed heeft op de reiniging van
      huishoudelijk afvalwater, moet altijd een speciale test, bedoeld in artikel 18.09, derde lid, plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.8
    text: |-
      De bevoegde autoriteit kan zich voor de vervulling van taken, bedoeld in dit hoofdstuk doen bijstaan door een
      technische dienst.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.01.9
    text: |-
      Om zeker te zijn dat de boordzuiveringsinstallatie functioneert, moet de installatie regelmatig overeenkomstig de
      instructies van de fabrikant worden onderhouden. Een dienovereenkomstig bewijs van onderhoud moet zich aan boord
      bevinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.01
  - number: 18.02.1
    text: |-
      Een aanvraag van een typegoedkeuring voor een boordzuiveringsinstallatietype moet door de fabrikant
      bij de bevoegde autoriteit worden ingediend. Bij de aanvraag moet een informatiedossier, als
      bedoeld in [artikel 18.00, zesde lid][ref1], het ontwerp van een proces-verbaal van de kenmerken de
      boordzuiveringsinstallatie, bedoeld in artikel 18.00, negende lid, en het ontwerp van een inlichtingenformulier
      van de fabrikant ter controle van de componenten betrekking hebbend op de afvalwaterreiniging en de kenmerken van
      het boordzuiveringsinstallatietype, bedoeld in artikel 18.00, tiende lid, worden gevoegd. De fabrikant moet voor de
      typegoedkeuring een prototype van een boordzuiveringsinstallatie demonstreren.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel18
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.02.2
    text: |-
      Indien de bevoegde autoriteit in het geval van een aanvraag van een typegoedkeuring van een
      boordzuiveringsinstallatie vaststelt dat de ingediende aanvraag met betrekking tot het gepresenteerde prototype
      van de boordzuiveringsinstallatie, voor de in bijlage 7, onderdeel II, aanhangsel 1, beschreven kenmerken van dit
      boordzuiveringsinstallatietype niet representatief is, moet een ander, en eventueel een extra, prototype dat door
      de bevoegde autoriteit wordt aangewezen ten behoeve van de goedkeuring, bedoeld in het eerste lid, ter beschikking
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.02
  - number: 18.02.3
    text: |-
      Een aanvraag van een typegoedkeuring voor een boordzuiveringsinstallatietype mag bij niet meer dan één bevoegde
      autoriteit worden ingediend. Voor ieder goed te keuren boordzuiveringsinstallatietype moet een afzonderlijke
      aanvraag worden ingediend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.02
  - number: 18.03.1
    text: |-
      De bevoegde autoriteit bij wie de aanvraag wordt ingediend, verleent de typegoedkeuring voor het
      boordzuiveringsinstallatietype dat met de gegevens in het informatiedossier overeenstemt en aan de voorschriften
      van dit hoofdstuk voldoet. Het voldoen aan deze voorschriften wordt overeenkomstig bijlage 7, onderdeel IX
      gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.03
  - number: 18.03.2
    text: |-
      De bevoegde autoriteit vult voor ieder boordzuiveringsinstallatietype waarvoor zij goedkeuring verleent, alle
      desbetreffende onderdelen van het certificaat van typegoedkeuring in, waarvan het model is opgenomen in bijlage
      7, onderdeel III; zij stelt een inhoudsopgave van het informatiepakket op of verifieert deze. De certificaten van
      typegoedkeuring moeten volgens het systeem aangegeven in bijlage 7, onderdeel IV, worden genummerd. Het ingevulde
      certificaat van typegoedkeuring en de bijbehorende bijlagen worden aan de aanvrager toegezonden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.03
  - number: 18.03.3
    text: |-
      Indien de goed te keuren boordzuiveringsinstallatie haar functie slechts vervult of bijzondere kenmerken
      slechts vertoont in combinatie met andere onderdelen van het vaartuig waarin de boordzuiveringsinstallatie
      zal worden ingebouwd, en om die reden de naleving van één of meer eisen slechts kan worden geverifieerd,
      wanneer de goed te keuren boordzuiveringsinstallatie in combinatie met andere echte of gesimuleerde onderdelen
      van het vaartuig functioneert, moet de geldigheid van de typegoedkeuring van deze boordzuiveringsinstallatie
      dienovereenkomstig worden beperkt. In dergelijke gevallen moeten in het certificaat van typegoedkeuring van een
      boordzuiveringsinstallatietype de eventuele beperkingen in het gebruik, alsmede eventuele voorwaarden waaraan bij
      montage moet worden voldaan, worden vermeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.03
  - number: 18.04.1
    text: |-
      De bevoegde autoriteit die de typegoedkeuring heeft verleend, moet de nodige maatregelen treffen om ervoor te
      zorgen dat zij in kennis wordt gesteld van iedere wijziging van de gegevens in het informatiepakket.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.04
  - number: 18.04.2
    text: |-
      De aanvraag om wijziging of uitbreiding van een typegoedkeuring wordt uitsluitend ingediend bij de bevoegde
      autoriteit die de oorspronkelijke typegoedkeuring heeft verleend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.04
  - number: 18.04.3
    text: |-
      Indien in het informatiepakket beschreven kenmerken van de boordzuiveringsinstallatie worden gewijzigd, verstrekt
      de bevoegde autoriteit:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.04
  - number: 18.04.3.a)
    text: |-
      indien nodig, de herziene bladzijden van het informatiepakket, waarbij zij op elke afzonderlijke bladzijde
      duidelijk de aard van de wijziging en de datum van de herziene versie vermeldt. Bij iedere heruitgave van
      bladzijden moet ook de inhoudsopgave van het informatiepakket dat bij het certificaat van typegoedkeuring is
      gevoegd, dienovereenkomstig worden gewijzigd;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.04
  - number: 18.04.3.b)
    text: |-
      een herzien certificaat van typegoedkeuring (met een uitbreidingsnummer), indien de daarin voorkomende
      gegevens (met uitzondering van de bijlagen) zijn gewijzigd of indien de minimumeisen van dit hoofdstuk sinds de
      oorspronkelijke datum van de goedkeuring zijn gewijzigd. In dit herziene certificaat van typegoedkeuring moeten
      duidelijk de reden voor de herziening en de datum van afgifte van de herziene versie worden vermeld. Indien de
      bevoegde autoriteit die de typegoedkeuring heeft afgegeven van oordeel is dat nieuwe proeven of tests moeten worden
      uitgevoerd naar aanleiding van een wijziging van het informatiepakket, stelt zij de fabrikant daarvan in kennis en
      geeft zij de bovenvermelde documenten pas af nadat de nieuwe proeven of tests met goed gevolg zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.04
  - number: 18.05.1
    text: |-
      De fabrikant brengt op iedere boordzuiveringsinstallatie die conform de typegoedkeuring is geproduceerd, de in
      bijlage 7, onderdeel I, vastgestelde merktekens aan, met inbegrip van het typegoedkeuringsnummer.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.05
  - number: 18.05.2
    text: |-
      Indien de typegoedkeuring overeenkomstig [artikel 18.03, derde lid][ref1], beperkingen aan het gebruik bevat,
      moeten door de fabrikant bij iedere gefabriceerde eenheid gedetailleerde gegevens over deze beperkingen en de
      volledige inbouwvoorschriften worden bijgeleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel18
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.05
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.05.3
    text: |-
      De fabrikant zendt op verzoek van de bevoegde autoriteit die de typegoedkeuring heeft verleend, binnen 45 dagen
      na het einde van ieder kalenderjaar en onmiddellijk na ieder verder tijdstip dat door de bevoegde autoriteit
      is vastgesteld, een lijst met serienummers van alle boordzuiveringsinstallaties die conform de eisen van dit
      hoofdstuk zijn geproduceerd sinds de laatste lijst werd ingediend of sinds de datum waarop deze voorschriften
      voor het eerst van kracht werden. Deze lijst moet het verband tussen de serienummers en de daarbij behorende
      boordzuiveringsinstallatietypes en de typegoedkeuringsnummers aangeven. Bovendien moet de lijst bijzondere gegevens
      bevatten indien de fabrikant niet langer een typegoedgekeurd boordzuiveringsinstallatietype produceert. Indien
      de bevoegde autoriteit niet verlangt dat deze lijst haar regelmatig wordt toegezonden, moet de fabrikant de
      geregistreerde gegevens gedurende ten minste 40 jaar bewaren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.05
  - number: 18.06.1
    text: |-
      De bevoegde autoriteit die een typegoedkeuring verleent, zorgt ervoor dat de serienummers van de
      boordzuiveringsinstallaties die overeenkomstig de voorschriften van dit hoofdstuk zijn geproduceerd worden
      geregistreerd en gecontroleerd. Zij kan hierbij samenwerken met andere krachtens dit hoofdstuk bevoegde
      autoriteiten en met de bevoegde autoriteiten van de lidstaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.06
  - number: 18.06.2
    text: |-
      Een bijkomende controle van de serienummers kan plaatsvinden ter gelegenheid van de controle van de conformiteit
      van de productie met de eisen bedoeld in [artikel 18.07][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel18
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.06.3
    text: |-
      Met betrekking tot de controle van de serienummers verstrekken de fabrikant of zijn in de lidstaten
      gevestigde agenten op verzoek van de bevoegde autoriteit onverwijld alle benodigde gegevens betreffende de
      cliënten alsook de serienummers van de boordzuiveringsinstallaties, waarvan is medegedeeld dat zij conform
      [artikel 18.05, derde lid][ref1], zijn geproduceerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel18
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.06.4
    text: |-
      Indien een fabrikant, na een verzoek daartoe van de bevoegde autoriteit, niet in staat is de in
      [artikel 18.05][ref1] bedoelde voorschriften na te komen, kan de goedkeuring voor de betreffende
      boordzuiveringsinstallatie worden ingetrokken. Daarvan wordt kennis gegeven volgens de procedure overeenkomstig
      [artikel 18.08, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel18
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.07.1
    text: |-
      De bevoegde autoriteit die een typegoedkeuring verleent, vergewist er zich van tevoren van dat de met betrekking
      tot bijlage 7, onderdeel I, passende voorzorgsmaatregelen zijn getroffen om een doeltreffende controle van de
      conformiteit van de productie te waarborgen. Zij kan hierbij samenwerken met andere krachtens dit hoofdstuk
      bevoegde autoriteiten en met de bevoegde autoriteiten van de lidstaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.07
  - number: 18.07.2
    text: |-
      De bevoegde autoriteit die een typegoedkeuring heeft verleend, vergewist zich ervan dat de in het eerste lid
      bedoelde voorzorgsmaatregelen met betrekking tot de bepalingen van bijlage 7, onderdeel I, nog steeds afdoende
      zijn en elke geproduceerde boordzuiveringsinstallatie die krachtens dit hoofdstuk van een typegoedkeuringsnummer
      is voorzien, nog steeds beantwoordt aan de beschrijving die in het certificaat van typegoedkeuring en de daarbij
      horende bijlagen inzake het boordzuiveringsinstallatietype is gegeven. Zij kan hierbij samenwerken met andere
      krachtens dit hoofdstuk bevoegde autoriteiten en met de bevoegde autoriteiten van de lidstaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.07
  - number: 18.07.3
    text: |-
      De bevoegde autoriteit kan vergelijkbare controles van andere bevoegde autoriteiten met betrekking tot de
      bepalingen in het eerste en tweede lid als gelijkwaardig erkennen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.07
  - number: 18.08.1
    text: |-
      Er is sprake van non-conformiteit met het typegoedgekeurde boordzuiveringsinstallatietype, indien er afwijkingen
      worden vastgesteld van de kenmerken in het certificaat van typegoedkeuring of eventueel in het informatiepakket,
      indien deze afwijkingen niet door de bevoegde autoriteit die de typegoedkeuring heeft verleend zijn toegestaan op
      grond van artikel 18.04, derde lid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.08
  - number: 18.08.2
    text: |-
      Indien de bevoegde autoriteit die een typegoedkeuring heeft verleend, vaststelt dat boordzuiveringsinstallaties
      niet conform zijn met het boordzuiveringsinstallatietype waarvoor zij de goedkeuring heeft verleend, neemt zij
      de nodige maatregelen om ervoor te zorgen dat de in productie zijnde boordzuiveringsinstallaties opnieuw in
      overeenstemming worden gebracht met het typegoedgekeurde boordzuiveringsinstallatietype. De bevoegde autoriteit die
      de non-conformiteit heeft vastgesteld, stelt de andere bevoegde autoriteiten in kennis van de genomen maatregelen,
      die kunnen gaan tot de intrekking van de typegoedkeuring.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.08
  - number: 18.08.3
    text: |-
      Indien een bevoegde autoriteit kan aantonen dat boordzuiveringsinstallaties die van een typegoedkeuringsnummer
      zijn voorzien, niet conform zijn met het typegoedgekeurde boordzuiveringsinstallatietype, kan zij van de
      bevoegde autoriteit die de typegoedkeuring heeft verleend, verzoeken te controleren of de in productie zijnde
      boordzuiveringsinstallaties conform zijn met het typegoedgekeurde boordzuiveringsinstallatietype. De hiertoe
      vereiste maatregelen moeten binnen zes maanden na de datum van het verzoek worden genomen
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.08
  - number: 18.09.1
    text: |-
      Uiterlijk drie maanden na de ingebruikname van het vaartuig of na de inbouw achteraf en de overeenkomstige controle
      van het functioneren van de boordzuiveringsinstallatie, neemt de bevoegde autoriteit tijdens de exploitatie van het
      vaartuig een steekproef ter controle van het nakomen van de in [artikel 18.01, tweede lid, tabel 2][ref1] vermelde
      controlewaarden. De bevoegde autoriteit controleert bovendien door middel van steekproefmetingen van tijd tot tijd
      zonder vaste regelmaat het goede functioneren van de boordzuiveringsinstallatie om vast te stellen of de in artikel
      18.01, tweede lid, tabel 2, vermelde controlewaarden nog worden nagekomen. Indien de bevoegde autoriteit vaststelt
      dat de waarden van de steekproefmetingen de controlewaarden, bedoeld in [artikel 18.01, eerste lid, tabel 2][ref2],
      niet nakomen dan kan zij eisen:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel18
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '18'
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.09.1.a)
    text: dat de gebreken van de boordzuiveringsinstallatie worden verholpen, zodat de installatie weer naar behoren werkt;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: 18.09.1.b)
    text: dat de conformiteit van de boordzuiveringsinstallatie met de typegoedkeuring wordt hersteld, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: 18.09.1.c)
    text: dat een speciale test overeenkomstig het derde lid wordt verricht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: 18.09.2
    text: |-
      De metingen van de steekproeven moeten geschieden volgens de in [artikel 18.01, tweede lid, tabel 2][ref1],
      voorgeschreven normen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel18
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.09.3
    text: |-
      Indien de bevoegde autoriteit aan de boordzuiveringsinstallatie bijzonderheden vaststelt die op een afwijking van
      de typegoedkeuring zou kunnen wijzen, dan voert de bevoegde autoriteit een speciale test uit, om de feitelijke
      toestand van de boordzuiveringsinstallatie met betrekking tot de onderdelen, de ijking en de afstellingen van de
      parameters zoals die in het proces-verbaal van de kenmerken van de boordzuiveringsinstallatie zijn gespecificeerd,
      vast te stellen. Indien de bevoegde autoriteit vaststelt dat de boordzuiveringsinstallatie niet conform is met het
      typegoedgekeurde boordzuiveringsinstallatietype, kan zij:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: 18.09.3.a)
    text: eisen dat
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: 18.09.3.a).aa)
    text: de conformiteit van de boordzuiveringsinstallatie wordt hersteld, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: 18.09.3.a).bb)
    text: |-
      als bedoeld in [artikel 18.04][ref1] de typegoedkeuring dienovereenkomstig wordt gewijzigd of


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel18
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.09.3.b)
    text: een meting overeenkomstig het keuringsvoorschrift wordt uitgevoerd, als bedoeld in bijlage 7, onderdeel IX.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: 18.09.4
    text: |-
      De keuringen als bedoeld in het derde lid geschieden aan de hand van het inlichtingenformulier van de
      fabrikant ter controle van de componenten betrekking hebbend op de afvalwaterreiniging en de kenmerken van de
      boordzuiveringsinstallatie. In dit formulier, dat door de fabrikant wordt opgesteld en dat door een bevoegde
      autoriteit moet worden goedgekeurd, worden de onderdelen die betrekking hebben op de afvalwaterreiniging alsmede de
      instellingen, dimensioneringscriteria, en kenmerken gespecificeerd, bij toepassing waarvan kan worden uitgegaan van
      een onafgebroken inachtneming van de waarden van [artikel 18.01, tweede lid, tabel 1 en 2][ref1]. Daarin wordt ten
      minste vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel18
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '18'
        hoofdstuk: '18'
  - number: 18.09.4.a)
    text: |-
      het boordzuiveringsinstallatietype met een beschrijving van de werkwijze en of afvalwaterverzameltanks vóór de
      boordzuiveringsinstallatie moeten worden geïnstalleerd;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: 18.09.4.b)
    text: een lijst van de voor de reiniging van het afvalwater specifieke componenten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: 18.09.4.c)
    text: toegepaste bouw- en dimensioneringscriteria, dimensioneringsvereisten en regelgeving;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: 18.09.4.d)
    text: |-
      schematische weergave van de boordzuiveringsinstallatie met niet te verwarren merktekens om de toegelaten
      componenten betrekking hebbend op de afvalwaterreiniging te identificeren (bijv. nummers van onderdelen die zich op
      de componenten bevinden).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: 18.09.5
    text: |-
      De krachtens het derde lid, derde volzin, buiten bedrijf verzegelde boordzuiveringsinstallatie mag alleen na een
      speciale test, bedoeld in het derde lid, eerste volzin, weer in gebruik genomen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.09
  - number: '18.10'
    text: |-
      De gemachtigde testinstelling moet voldoen aan de Europese norm EN ISO/IEC 17025 : 2005, en is onderworpen aan de
      volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.10
  - number: 18.10.a)
    text: de fabrikanten van boordzuiveringsinstallaties kunnen niet als technische dienst worden erkend;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.10
  - number: 18.10.b)
    text: |-
      voor de toepassing van doeleinden van dit hoofdstuk mag een technische dienst met toestemming van de bevoegde
      autoriteit gebruik maken van inrichtingen buiten zijn eigen testinstelling.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.10
  - number: 19.01.1
    text: 'De volgende bepalingen zijn niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
  - number: 19.01.1.a)
    text: |-
      [artikel 3.02, eerste lid, onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel3
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '3'
        hoofdstuk: '3'
  - number: 19.01.1.b)
    text: |-
      [artikelen 4.01 tot en met 4.03][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '4'
        hoofdstuk: '4'
  - number: 19.01.1.c)
    text: |-
      [artikel 8.08, tweede lid, tweede zin, en zevende lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel8
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '8'
        hoofdstuk: '8'
  - number: 19.01.1.d)
    text: |-
      [artikel 10.14, derde lid, tweede zin][ref1], bij nominale spanningen van meer dan 50 V.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel10
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '10'
        hoofdstuk: '10'
  - number: 19.01.2
    text: 'De volgende installaties zijn op passagiersschepen verboden:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
  - number: 19.01.2.a)
    text: |-
      lampen die werken op vloeibaar gas en vloeibare brandstof als bedoeld in
      [artikel 15.07, derde lid, tweede zin][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel15
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '15'
        hoofdstuk: '15'
  - number: 19.01.2.b)
    text: |-
      met pitbranders uitgeruste installaties als bedoeld in [artikel 16.02, tweede en derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel16
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '16'
        hoofdstuk: '16'
  - number: 19.01.2.c)
    text: |-
      oliekachels met verdampingsbranders als bedoeld in [artikel 16.04][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel16
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '16'
        hoofdstuk: '16'
  - number: 19.01.2.d)
    text: |-
      verwarmingsapparaten en verwarmingsketels als bedoeld in [artikel 16.07][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel16
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '16'
        hoofdstuk: '16'
  - number: 19.01.2.e)
    text: |-
      vloeibaargasinstallaties als bedoeld in [hoofdstuk 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '17'
  - number: 19.01.3
    text: |-
      Schepen, die niet van eigen mechanische middelen tot voortbeweging zijn voorzien, kunnen niet tot het vervoer van
      passagiers worden toegelaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
  - number: 19.01.4
    text: |-
      Op passagiersschepen moeten ruimten beschikbaar zijn voor mensen met een beperkte mobiliteit, die aan de in dit
      hoofdstuk genoemde bepalingen voldoen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
  - number: 19.01.5
    text: |-
      In afwijking van [artikel 7.02, tweede lid, eerste volzin][ref1], mag de dode hoek voor de boeg van het lege schip
      met halve voorraden en zonder ballast voor de roerganger niet meer zijn dan twee maal de scheepslengte of 250 m, al
      naargelang welke afstand het kortste is.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 19.01.6
    text: |-
      In afwijking van [artikel 7.02, derde lid, derde alinea][ref1], moet een passagiersschip met geschikte
      hulpmiddelen zijn uitgerust wanneer een vrij zicht naar achteren niet gewaarborgd is. Ingeval met deze
      hulpmiddelen bij het varen des nachts vrij zicht niet gewaarborgd is, moet de dienovereenkomstige beperking in het
      binnenschipcertificaat onder nummer 52 worden aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 19.02.1
    text: 'Bij een periodiek onderzoek wordt de dikte van de scheepshuid van stalen passagiersschepen als volgt vastgesteld:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.1.a)
    text: |-
      De minimale dikte *t* van de bodem-, kim- en zijbeplating van de scheepshuid van passagiersschepen wordt bepaald
      volgens de grootste waarde van de volgende formules: Daarbij betekent: *F* = 1 + 0,0013 • (*a* – 500) *a* =
      spantafstand in de lengte of de breedte [mm]; bij een kleinere spantafstand dan 400 mm moet *a* worden genomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.1.b)
    text: |-
      De uit onderdeel a voortvloeiende minimale waarde voor de plaatdikte behoeft niet te worden gehaald, wanneer de
      toegestane waarde op basis van een rekenkundig bewijs voor de voldoende sterkte van de scheepsromp (langs- en
      dwarssterkte als ook plaatselijke sterkte) is vastgelegd en dit uit een verklaring blijkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.1.c)
    text: |-
      Op geen enkele plaats van de scheepshuid mag de volgens onderdeel a of onderdeel b berekende waarde minder zijn dan
      3 mm.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.1.d)
    text: |-
      Platen moeten worden vervangen, wanneer de dikte van de bodem-, kim- of zijplaten niet langer de volgens onderdelen
      a of b, in samenhang met onderdeel c, vastgestelde minimale waarde heeft.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.2
    text: |-
      Het aantal en de indeling van de schotten moeten zodanig zijn gekozen dat het schip in lekke toestand volgens
      de standaarden van [artikel 19.03, zevende tot en met dertiende lid][ref1], kan blijven drijven. Ieder deel van
      de interne constructie, die de functionaliteit van de indeling van het schip beïnvloedt, moet waterdicht en zo
      geconstrueerd zijn, dat de integriteit van de indeling in stand blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.02.3
    text: |-
      Voor het bepalen van de plaats van het aanvaringsschot en het achterpiekschot gelden de bepalingen van
      [artikel 3.03, eerste lid][ref1], waarbij afwijkend daarvan als referentiegrootte de lengte in de waterlijn *L* in
      plaats van de lengte *L* moet worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel3
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '3'
        hoofdstuk: '3'
  - number: 19.02.4
    text: |-
      In een dwarsschot mag een sprong of nis voorkomen, mits alle delen van de sprong of nis binnen de veilige zone
      zijn gelegen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.5
    text: |-
      De schotten die bij de lekberekening als bedoeld in [artikel 19.03, zevende tot en met dertiende lid][ref1],
      in aanmerking zijn genomen, moeten waterdicht zijn en tot boven het schottendek opgetrokken zijn. Ontbreekt het
      schottendek, dan moeten zij ten minste 0,20 m boven de indompelingsgrenslijn zijn opgetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.02.6
    text: |-
      Het aantal openingen in deze schotten moet zo gering worden gehouden als vanwege de bouwwijze en voor de normale
      bedrijfsvoering van het schip toelaatbaar is. Openingen en doorvoeringen mogen de waterdichte functie van de
      schotten niet nadelig beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.7
    text: In het aanvaringsschot zijn openingen en deuren niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.8
    text: |-
      In schotten die machinekamers van passagiersruimten of woonruimten voor het boordpersoneel scheiden, zijn deuren
      niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.9
    text: |-
      Met de hand te bedienen deuren in schotten als bedoeld in het vijfde lid die niet op afstand bediend kunnen worden,
      zijn slechts toegestaan buiten de voor passagiers bestemde plaatsen. Zij moeten:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.9.a)
    text: voortdurend gesloten blijven en mogen slechts voor passage kortstondig worden geopend;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.9.b)
    text: snel en veilig door geschikte inrichtingen gesloten kunnen worden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.9.c)
    text: 'aan beide zijden voorzien zijn van het opschrift: ‘Deur na doorgang direct sluiten’.'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.10
    text: 'Deuren in schotten als bedoeld in het vijfde lid die langdurig open staan moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.10.a)
    text: |-
      zij moeten ter plaatse aan beide zijden van het schot en vanaf een goed toegankelijke plaats boven het schottendek
      kunnen worden gesloten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.10.b)
    text: |-
      na sluiting door afstandsbediening moeten de deuren ter plaatse opnieuw kunnen worden geopend en op veilige wijze
      worden gesloten. Het afsluitproces mag met name niet door tapijten of drempels gehinderd worden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.10.c)
    text: |-
      de duur van het sluiten door afstandsbediening moet ten minste 30 seconden bedragen, maar mag niet meer bedragen
      dan 60 seconden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.10.d)
    text: tijdens het sluiten moet bij de deur automatisch een akoestisch alarmsignaal worden gegeven;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.10.e)
    text: |-
      gewaarborgd moet zijn dat het bedienen van deur en het alarmsignaal ook onafhankelijk van het boordnet kunnen
      geschieden. Ter plaatse van de afstandsbediening moet een inrichting aanwezig zijn die aangeeft of de deur open dan
      wel gesloten is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.11
    text: |-
      Alle deuren in schotten als bedoeld in het vijfde lid en hun bedieningsinrichtingen moeten in de veilige zone
      liggen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.12
    text: |-
      In het stuurhuis moet een alarminstallatie aanwezig zijn, die aangeeft welke deur in schotten als bedoeld in het
      vijfde lid geopend is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.13
    text: |-
      Pijpleidingen met open uitmondingen en ventilatiekanalen moeten zo zijn aangelegd, dat daardoor bij elke
      lektoestand geen water naar andere ruimten of tanks kan stromen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.13.a)
    text: |-
      Wanneer verschillende compartimenten door middel van pijpleidingen of ventilatiekanalen met elkaar in open
      verbinding staan, moeten deze op een geschikte plaats tot boven de ongunstigste lastlijn in lekke toestand worden
      geleid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.13.b)
    text: |-
      Pijpleidingen behoeven niet aan onderdeel a te voldoen, wanneer op de doorboorde schotten afsluiters zijn
      aangebracht, die van boven het schottendek op afstand kunnen worden bediend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.13.c)
    text: |-
      Wanneer een pijpleidingsysteem in een compartiment geen open uitmonding heeft, wordt de pijpleiding bij
      beschadiging van dit compartiment als onbeschadigd beschouwd, wanneer zij binnen de veilige zone loopt en de
      afstand tot de scheepsbodem meer dan 0,50 m bedraagt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.14
    text: |-
      Afstandsbedieningen van deuren in schotten als bedoeld in het tiende lid en afsluitmechanismen als bedoeld in het
      dertiende lid, onderdeel b, boven het schottendek moeten als zodanig duidelijk gemarkeerd zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.15
    text: Bij een dubbele bodem moet de hoogte daarvan en bij dubbele wanden de breedte daarvan ten minste 0,60 m bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
  - number: 19.02.16
    text: |-
      Vensters mogen onder de indompelingsgrenslijn liggen, wanneer zij waterdicht zijn, niet geopend kunnen worden, een
      voldoende sterkte bezitten en voldoen aan [artikel 19.06, veertiende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.02
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.03.1
    text: |-
      De aanvrager moet het bewijs van voldoende stabiliteit van het onbeschadigde schip leveren met een berekening die
      is gebaseerd op de resultaten van het toepassen van een standaard van voldoende stabiliteit van het onbeschadigde
      schip. Alle berekeningen moeten zodanig worden uitgevoerd dat daarbij aan trim en inzinking geen vaste waarden zijn
      toegekend. De gegevens over het vaartuig in onbeladen toestand waarop de stabiliteitsberekeningen zijn gebaseerd
      moeten door een hellingproef worden bepaald.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.2
    text: 'De intactstabiliteit moet voor de volgende standaardbeladingcondities worden aangetoond:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.2.a)
    text: 'bij het begin van de vaart: 100% passagiers, 98% brandstof en drinkwater, 10% afvalwater;'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.2.b)
    text: 'tijdens de vaart: 100% passagiers, 50% brandstof en drinkwater, 50% afvalwater;'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.2.c)
    text: 'bij het eind van de vaart: 100% passagiers, 10% brandstof en drinkwater, 98% afvalwater;'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.2.d)
    text: |-
      leeg schip: geen passagiers, 10% brandstof en drinkwater, geen afvalwater. Voor alle standaardbeladingcondities
      moet uitgegaan worden van lege dan wel volle ballasttanks, overeenkomstig hun normale gebruik. Daarnaast moet voor
      de volgende beladingsconditie voor het derde lid, onder d, worden aangetoond: 100% passagiers, 50% brandstof en
      drinkwater, 50% afvalwater, het totaal van de andere vloeistoftanks met inbegrip van ballast voor 50% gevuld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.3
    text: |-
      Het bewijs van voldoende stabiliteit van het onbeschadigde schip via een berekening moet worden geleverd met
      toepassing van de volgende eisen voor voldoende stabiliteit van het onbeschadigde schip en voor de in het tweede
      lid, onder a tot en met d, genoemde standaardbeladingcondities:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.3.a)
    text: |-
      De maximale oprichtende hefboomarm *h* moet bij een slagzij van *φ* ≥ (*φ* + 3°) optreden en moet minstens 0,20
      m bedragen; Wanneer *φ* < *φ* is, moet de oprichtende hefboomarm bij een hoek van het onder water komen *φ* ten
      minste 0,20 m bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.3.b)
    text: De hoek van het onder water komen *φ* mag niet kleiner zijn dan (*φ* + 3°).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.3.c)
    text: |-
      Het vlak A onder de kromme van de oprichtende hefboomarm moet, afhankelijk van de positie van *φ* et de *φ* ten
      minste de volgende waarden bereiken:








                          Geval




                          A






                          1


                          *φ* ≤ 15° of *φ* ≤ 15°°



                          0,05 m • rad tot aan de kleinste van de hoeken *φ* of *φ*




                          2


                          15° < *φ* < 30°


                          *φ* ≤ *φ*


                          0,035 + 0,001 • (30 – *φ*) *m* •∙*rad* tot aan de hoek *φ*




                          3


                          15° < *φ* < 30°


                          *φ* > *φ*


                          0,035 + 0,001 • (30 – *φ*) *m* •∙*rad* tot aan de hoek *φ*




                          4


                          *φ* ≥ 30° en *φ* ≥ 30°°



                          0,035 *m* •∙*rad* tot aan de hoek *φ* =  30°




                 Daarbij betekent: *h* de maximale hefboomarm; *φ* de hoek van de slagzij; *φ* de hoek van het onder
      water komen, d.w.z. de hoek van de slagzij waarbij de openingen in de scheepsromp, in de opbouwen of dekhuizen, die
      niet waterdicht gesloten kunnen worden, onderwater komen te staan; *φ* de maximale hoek van de slagzij als bedoeld
      onder e; *φ* de hoek van de slagzij waarbij sprake is van de maximale oprichtende hefboomarm: *A* vlakken onder de
      kromme van de oprichtende hefboomarm;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.3.d)
    text: |-
      De metacentrische hoogte bij het begin van *GM*, gecorrigeerd in verband met het effect van de vrije oppervlakken
      in vloeistoftanks, mag niet minder bedragen dan 0,15 m;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.3.e)
    text: 'De hoek van de slagzij *φ* mag in de beide hiernavolgende gevallen niet meer bedragen dan 12°:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.3.e).aa)
    text: op basis van het kenterende moment ten gevolge van personen en wind als bedoeld in het vierde en vijfde lid;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.3.e).bb)
    text: |-
      op basis van het kenterende moment ten gevolge van personen en het draaien van het schip als bedoeld in het vierde
      en zesde lid;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.3.f)
    text: |-
      Het resterende vrijboord mag bij een kenterend moment ten gevolge van personen, wind en het draaien van het schip
      als bedoeld in het vierde, vijfde en zesde lid niet minder bedragen dan 0,20 m;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.3.g)
    text: |-
      De resterende veiligheidsafstand moet voor schepen met vensters, of andere openingen in de scheepshuid die beneden
      het schottendek zijn gelegen en die niet waterdicht gesloten zijn, ten minste 0,10 m bedragen uitgaande van de drie
      kenterende momenten, bedoeld in onderdeel f.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.4
    text: |-
      Het kenterende moment ten gevolge van een concentratie van personen *M* op één plaats moet op grond van de volgende
      formule als volgt worden berekend: In deze formule betekent: *P* = totale massa van personen aan boord in [t], te
      berekenen uit de som van het hoogste toegestane aantal passagiers en het maximale aantal van het boordpersoneel
      en de bemanning onder normale bedrijfsomstandigheden onder aanname van een gemiddelde massa van 0,075 t per
      persoon; *y* = zijdelingse afstand van het zwaartepunt van de massa van personen *P* vanaf de middellijn van
      het schip in [m]; *g* = acceleratie van de zwaartekracht (*g* = 9,81 *m/s2*); *P*= massa van de op een vlak A
      verzamelde personen volgens: *P* - *n* • 0,075 • *A* [*t*] Daarbij betekent in deze formule: *A* = vlak waarop
      zich personen bevinden in [m²]; *n* = aantal personen per vierkante meter bij *n* = 3,75 in geval van vrije
      dekoppervlakken en vlakken met verplaatsbaar meubilair; in geval van vlakken met vast ingebouwde zitplaatsen
      zoals banken, moet *n* worden berekend onder aanname van een zitbreedte van 0,50 m en een zitdiepte van 0,75 m
      per persoon; *y* = zijdelingse afstand van het vlakzwaartepunt van het vlak *A* vanaf de middellijn van het schip
      in [m]. De berekening moet worden uitgevoerd zowel voor een concentratie van personen aan stuurboord als voor
      een concentratie aan bakboord. De verdeling van personen moet het meest ongunstige zijn vanuit het oogpunt van
      stabiliteit. Ingeval er hutten aanwezig zijn moet voor de berekening van het moment van personen ervan worden
      uitgegaan dat deze niet bezet zijn. Voor de berekening van beladen situaties moet het middelpunt van de zwaarte
      van een persoon worden genomen op 1 m boven het laagste punt van het betreffende dek op 0,5 *L* zonder rekening
      te houden met een verlaging of verhoging in het dek of de kromming van het dek en onder aanname van een massa van
      0,075 t per persoon. Een gedetailleerde vaststelling van de vlakken aan dek, die door personen bezet zijn, kan
      achterwege blijven, indien de volgende waarden worden toegepast: *P* = 1,1 • *F* • 0,075 in het geval van schepen
      voor dagtochten; = 1,5 • *F* • 0,075 in het geval van hotelschepen. In deze formules betekent: *F* = ten hoogste
      aan boord toegelaten aantal passagiers; *y* = *B*/2in [m].
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.5
    text: |-
      Het moment ten gevolge van wind *M* moet als volgt worden aangetoond: In deze formule betekent: *p* = specifieke
      winddruk van 0,25 kN/m; *A* = zijdelings oppervlak van het schip boven het vlak van de grootste inzinking in [m2],
      dat overeenkomt met de betreffende beladingstoestand; *l* = afstand van het zwaartepunt van het zijdelingse vlak
      *A* tot het vlak van de inzinking in [m]. die overeenkomt met de betreffende beladingstoestand in [m]. Bij de
      berekening van het zijdelingse oppervlak moeten de voorziene overdekkingen van het dek door dekzeilen of dergelijke
      mobiele inrichtingen in aanmerking worden genomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.6
    text: |-
      Het moment ten gevolge van de centrifugale kracht *M*, veroorzaakt door het draaien van het schip, moet als volgt
      worden berekend: In deze formule betekent: *C* = coëfficiënt van 0,45; *C* = de blokcoëfficiënt (indien niet
      bekend moet hiervoor 1,0 worden aangenomen); *v* = grootste snelheid van het schip in [m/s]; *KG* = afstand van het
      zwaartepunt tot de bovenkant van de kiel in [m]. In geval het passagiersschip is uitgerust met een aandrijfsysteem
      overeenkomstig artikel 6.06 moet *M* worden afgeleid uit beproevingen op ware grootte dan wel met modellen, hetzij
      op basis van daarmee overeenkomende berekeningen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.7
    text: |-
      De aanvrager moet met een berekening aantonen dat de lekstabiliteit van het schip voldoende is. Hierbij moet
      voor de eindtoestand van het vollopen een berekening die berust op de procedure van het ‘wegvallen van het
      drijfvermogen’, en voor de tussentoestanden van het vollopen een berekening die berust op het ‘toenemen van het
      gewicht’ worden gebruikt. Alle berekeningen moeten zodanig worden uitgevoerd dat daarbij aan trim en inzinking geen
      vaste waarden zijn toegekend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.8
    text: |-
      Het drijfvermogen in lekke toestand moet voor de in het tweede lid bedoelde standaardbeladingcondities worden
      aangetoond. Hierbij moet voor drie tussenstadia van het volstromen (25%, 50% en 75% van de eindtoestand van
      het volgestroomd zijn) en voor de eindtoestand van het volgelopen zijn aan het rekenkundig bewijs van voldoende
      stabiliteit zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.9
    text: |-
      Passagiersschepen moeten voldoen aan de 1-compartimentstatus en aan de 2-compartimentstatus. De volgende indicaties
      moeten voor het geval van een lekke toestand in acht worden genomen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.9.a)
    text: |-
      Voor de 1-compartimentstatus kunnen de schotten als onbeschadigd worden beschouwd, wanneer de onderlinge afstand
      tussen twee aangrenzende schotten groter is dan de lengte van het lek. Langsschotten die zich op een afstand
      van minder dan B/3 ten opzichte van de scheepshuid bevinden, gemeten in een rechte hoek ten opzichte van de
      scheepsmiddellijn in het vlak van de grootste inzinking, mogen in de berekening niet worden meegenomen. Een sprong
      of een nis in een dwarsschot, waarvan de lengte groter is dan 2,50 m wordt als een langsschot beschouwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.9.b)
    text: |-
      Voor de 2-compartimentstatus wordt ieder schot dat is gelegen binnen het gebied waar het lek van invloed is
      als beschadigd aangemerkt. Dit betekent dat de plaats van de schotten zodanig moet worden gekozen, dat het
      passagiersschip na het volstromen van twee of meer aangrenzende compartimenten in de langsrichting nog kan blijven
      drijven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.9.c)
    text: |-
      Het laagste punt van iedere niet waterdichte opening (bijv. van deuren, vensters, luiken) moet bij de eindtoestand
      van het volgestroomd zijn ten minste 0,10 m boven de lastlijn in lekke toestand liggen. Het schottendek mag bij de
      eindtoestand van het volstromen niet onder water komen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.9.d)
    text: |-
      Er wordt met een permeabiliteit van 95% rekening gehouden. Wordt door een berekening aangetoond, dat de gemiddelde
      permeabiliteit van een compartiment kleiner is dan 95%, dan kan de berekende waarde worden aangehouden. De volgende
      waarden moeten ten minste worden bereikt:






                          verblijfsruimten


                          95%




                          machinekamers en ketelruimen


                          85%




                          bagage- en voorraadruimten


                          75%




                          dubbele bodems, brandstoftanks, ballasttanks en andere tanks al naar gelang deze tanks uit
      hoofde van hun bestemming bij het in het vlak van de grootste inzinking liggende schip als vol of leeg moeten
      worden aangenomen


                          0% of 95%.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.9.e)
    text: |-
      Ingeval een lek van kleinere omvang dan hierboven aangegeven leidt tot ongunstiger verhoudingen met betrekking tot
      slagzij of verlies aan metacentrische hoogte, moet een zodanig lek bij de berekening worden betrokken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.10
    text: 'Bij alle tussenstadia van het vollopen als bedoeld in het achtste lid moet aan de volgende criteria worden voldaan:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.10.a)
    text: |-
      De hoek van de slagzij *φ* van de evenwichtssituatie van het betreffende tussenstadium mag niet meer bedragen dan
      15°.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.10.b)
    text: |-
      Afgezien van de hoek van de slagzij van de evenwichtssituatie van het betreffende tussenstadium moet het positieve
      bereik van de kromme van de hefboomarmen een oprichtende hefboomarm aangeven van *GZ* ≥ 0,02 *m*, voordat de eerste
      onbeschermde opening onder water komt dan wel een hoek van de slagzij *φ* van 25° bereikt wordt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.10.c)
    text: |-
      Niet waterdichte openingen mogen niet onder water komen voordat de hoek van de slagzij van de evenwichtssituatie
      van het betreffende tussenstadium is bereikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.10.d)
    text: |-
      Voor de berekening van het effect van de vrije oppervlakken bij alle tussenstadia van het volstromen wordt
      uitgegaan van het bruto grondvlak van de beschadigde ruimten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.11
    text: |-
      Bij de eindtoestand van het volgestroomd zijn moet aan de volgende criteria worden voldaan met inachtneming van het
      kenterende moment als bedoeld in het vierde lid:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.11.a)
    text: De hoek van de slagzij *φ* mag niet meer bedragen dan 10°.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.11.b)
    text: |-
      Afgezien van de evenwichtssituatie moet het positieve bereik van de kromme van de hefboomarmen een oprichtende
      hefboomarm aangeven van *GZ* ≥ 0,02 *m* gecombineerd met een vlak *A* ≥ 0,0025 *m* • *rad*. Deze minimumwaarden
      van de stabiliteit moeten worden bereikt tot aan het onder water komen van de eerste onbeschermde opening of in
      ieder geval vóór het bereiken van een hoek van de slagzij van 25°. Daarbij betekent *φ* de hoek van de slagzij bij
      het volledig onder water komen met inachtneming van het moment als bedoeld in het vierde lid; *φ* de hoek van de
      afnemende stabiliteit dan wel de hoek waarbij de eerste onbeschermde opening onder water komt, of 25°: de kleinste
      van deze waarden moet worden aangehouden; *GZ* de resterende oprichtende hefboomarm bij volledig onder water
      komen met inachtneming van het kenterende moment als bedoeld in het vierde lid; *GZ* het moment van de hefboomarm
      resulterend uit het moment als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.11.c)
    text: |-
      niet waterdichte openingen mogen niet onder water komen voordat de hoek van de slagzij van de evenwichtssituatie
      van het betreffende tussenstadium is bereikt. In geval dat dergelijke openingen onder water komen voordat dit
      punt is bereikt moeten de ruimten die daarmee in verbinding staan bij de berekening van de lekstabiliteit als
      volgestroomd worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.12
    text: |-
      Afsluitvoorzieningen van openingen die waterdicht afsluitbaar moeten zijn, moeten als zodanig duidelijk gemarkeerd
      worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.13
    text: |-
      Wanneer doorstroomopeningen in de langsschotten worden voorzien ten behoeve van vermindering van asymmetrisch
      volstromen, moeten deze aan de volgende voorwaarden voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.13.a)
    text: voor de berekening van het uit dwarsrichting volstromen moet de IMO resolutie A.266 (VIII) worden toegepast;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.13.b)
    text: ze moeten automatisch functioneren;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.13.c)
    text: ze mogen niet van afsluitmechanismen zijn voorzien;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.03.13.d)
    text: de tijd die nodig is voor een volledige vereffening mag niet meer bedragen dan 15 minuten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.03
  - number: 19.04.1
    text: 'De veiligheidsafstand moet ten minste gelijk zijn aan de som van:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.04
  - number: 19.04.1.a)
    text: |-
      de extra zijdelingse inzinking die, gemeten langs de scheepshuid, ontstaat door de toelaatbare slagzij, bedoeld in
      [artikel 19.03, derde lid, onder e][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.04.1.b)
    text: |-
      de resterende veiligheidsafstand, bedoeld in [artikel 19.03, derde lid, onder g][ref1]. De veiligheidsafstand van
      schepen zonder schottendek moet ten minste 0,50 m bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.04.2
    text: 'Het vrijboord moet ten minste gelijk zijn aan de som van:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.04
  - number: 19.04.2.a)
    text: |-
      de extra zijdelingse inzinking die door de volgens [artikel 19.03, derde lid, onder e][ref1], berekende slagzij,
      gemeten langs de scheepshuid, ontstaat, en


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.04.2.b)
    text: |-
      het resterende vrijboord, bedoeld in [artikel 19.03, derde lid, onder f][ref1]. Het vrijboord moet echter ten
      minste 0,30 m bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.04.3
    text: |-
      Het vlak van de grootste inzinking moet zodanig worden vastgesteld dat zowel de veiligheidsafstand als bedoeld in
      het eerste lid als het vrijboord als bedoeld in het tweede lid als de [artikelen 19.02][ref1] en [19.03][ref2] in
      acht zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.04
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.04.4
    text: |-
      De Commissie van deskundigen kan uit veiligheidsoverwegingen een grotere veiligheidsafstand of een groter vrijboord
      bepalen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.04
  - number: 19.05.1
    text: |-
      De Commissie van deskundigen bepaalt het ten hoogste toegelaten aantal passagiers en tekent dit in het
      binnenschipcertificaat aan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.05
  - number: 19.05.2
    text: 'Het ten hoogste toegelaten aantal passagiers mag niet meer zijn dan:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.05
  - number: 19.05.2.a)
    text: |-
      het aantal passagiers waarvoor een verzamelruimte, bedoeld in [artikel 19.06, achtste lid][ref1], is aangetoond;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.05
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.05.2.b)
    text: |-
      het aantal passagiers waarvoor de stabiliteitsberekening, bedoeld in [artikel 19.03][ref1], is uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.05
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.05.2.c)
    text: het aantal beschikbare bedden voor passagiers op hotelschepen, die voor reizen met overnachting worden ingezet.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.05
  - number: 19.05.3
    text: |-
      Voor hotelschepen die ook als schip voor dagtochten worden ingezet moet het aantal passagiers zowel voor een schip
      voor dagtochten als voor een hotelschip worden berekend en in het binnenschipcertificaat worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.05
  - number: 19.05.4
    text: |-
      Het ten hoogste toegelaten aantal passagiers moet aan boord op een opvallende plaats duidelijk leesbaar worden
      aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.05
  - number: 19.06.1
    text: 'Passagiersverblijven moeten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.1.a)
    text: |-
      zich op alle dekken achter het vlak van het aanvaringsschot en, voor zover ze onder het schottendek zijn gelegen,
      vóór het vlak van het achterpiekschot bevinden, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.1.b)
    text: gasdicht gescheiden zijn van machinekamers en ketelruimen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.2
    text: |-
      Kasten als bedoeld in [artikel 14.13][ref1] en ruimten voor brandbare vloeistoffen moeten zich buiten het gebied
      bestemd voor passagiers bevinden.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel14
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '14'
        hoofdstuk: '14'
  - number: 19.06.3
    text: 'Aantal en breedte van uitgangen van passagiersverblijven moeten aan de volgende voorwaarden voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.3.a)
    text: |-
      Verblijven of groepen van verblijven die voor 30 of meer passagiers zijn bestemd of ingericht, dan wel voor 12 of
      meer passagiers bedden bieden, moeten ten minste twee uitgangen hebben. Op schepen voor dagtochten mag één van deze
      twee uitgangen door twee nooduitgangen worden vervangen. Verblijven, uitgezonderd hutten, en groepen van verblijven
      met slechts één uitgang moeten ten minste één nooduitgang hebben.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.3.b)
    text: |-
      Indien zich verblijven onder het schottendek bevinden, mag één van de uitgangen een waterdichte deur in een schot,
      bedoeld in [artikel 19.02, tiende lid][ref1], zijn die toegang geeft tot een aangrenzend compartiment van waaruit
      het hoger gelegen dek rechtstreeks kan worden bereikt. De andere uitgang moet direct of, wanneer dit overeenkomstig
      onderdeel a is toegestaan, als nooduitgang naar het schottendek dan wel naar buiten leiden. Dit geldt niet voor de
      afzonderlijke hutten.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.06.3.c)
    text: |-
      Uitgangen, bedoeld onder a en b, moeten doelmatig zijn aangebracht en een vrije breedte van ten minste 0,80 m en
      een vrije hoogte van ten minste 2,00 m hebben. Bij deuren van hutten voor passagiers en andere kleine verblijven
      mag de vrije breedte worden verminderd tot 0,70 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.3.d)
    text: |-
      Bij verblijven of groepen van verblijven die voor meer dan 80 passagiers zijn bestemd moet het totaal van de
      breedte van alle uitgangen die voor passagiers zijn bestemd, en door hen in geval van nood moeten worden gebruikt,
      ten minste 0,01 m per passagier bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.3.e)
    text: |-
      Indien het aantal passagiers voor de totale breedte van de uitgangen maatgevend is, moet de breedte van elke
      uitgang ten minste 0,005 m per passagier bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.3.f)
    text: |-
      Nooduitgangen moeten een kleinste zijdelingse lengte van ten minste 0,60 m hebben of een minimale diameter van 0,70
      m. Zij moeten kunnen worden geopend in de vluchtrichting en aan beide zijden zijn gekenmerkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.3.g)
    text: |-
      Uitgangen van verblijven die zijn bestemd om gebruikt te worden door personen met beperkte mobiliteit, moeten een
      vrije breedte hebben van ten minste 0,90 m. Uitgangen die gewoonlijk worden gebruikt voor het aan of van boord gaan
      van personen met beperkte mobiliteit, moeten over een vrije breedte beschikken van 1,50 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.4
    text: 'Deuren van passagiersverblijven moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.4.a)
    text: |-
      Met uitzondering van deuren die naar verbindingsgangen leiden, moeten ze naar buiten opengaan of als schuifdeuren
      zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.4.b)
    text: Hutdeuren moeten zodanig zijn uitgevoerd dat zij te allen tijde ook van buitenaf kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.4.c)
    text: Automatische deuren moeten wanneer de aandrijfenergie uitvalt gemakkelijk kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.4.d)
    text: |-
      Bij deuren die zijn bestemd om gebruikt te worden door personen met beperkte mobiliteit moet aan de zijde waarnaar
      de deur opengaat een zijdelingse afstand bestaan tussen binnenkant van de deurpost aan de kant van het slot en de
      naburige loodrecht op het vlak van de deur aangebrachte wand van ten minste 0,60 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.5
    text: 'Verbindingsgangen moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.5.a)
    text: |-
      Zij moeten een vrije breedte hebben van ten minste 0,80 m. Wanneer zij naar ruimten leiden die voor meer dan 80
      passagiers zijn voorzien, moeten zij aan de in het derde lid, onderdeel d en e, bedoelde vereisten ten aanzien van
      de breedte van de naar de verbindingsgangen leidende uitgangen voldoen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.5.b)
    text: Hun vrije hoogte mag niet minder zijn dan 2,00 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.5.c)
    text: |-
      Verbindingsgangen die zijn bestemd voor het gebruik door personen met een beperkte mobiliteit moeten een vrije
      breedte hebben van minstens 1,30 m. Verbindingsgangen met een breedte van meer dan 1,50 m moeten aan beide zijden
      van een handrail zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.5.d)
    text: |-
      Indien slechts één verbindingsgang of -trap naar een voor passagiers bestemde ruimte leidt, moet de vrije breedte
      daarvan ten minste 1,00 m bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.5.e)
    text: Verbindingsgangen mogen geen treden of niveauverschillen hebben.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.5.f)
    text: Zij mogen alleen naar vrije dekken, ruimten of trappen leiden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.5.g)
    text: Doodlopende gedeelten van verbindingsgangen mogen niet langer dan twee meter zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.6
    text: 'Vluchtwegen moeten behalve aan het vijfde lid aan de volgende voorwaarden voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.6.a)
    text: |-
      Bij de inrichting van trappen, uitgangen en nooduitgangen moet ingecalculeerd zijn dat bij brand in een willekeurig
      verblijf alle andere verblijven verlaten kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.6.b)
    text: Vluchtwegen moeten de kortste weg volgen naar verzamelruimten als bedoeld in het achtste lid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.6.c)
    text: Vluchtwegen mogen niet door machinekamers en keukens leiden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.6.d)
    text: In vluchtwegen mogen geen gangen met klimtreden, ladders en dergelijke zijn ingebouwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.6.e)
    text: |-
      Deuren in vluchtwegen moeten zodanig zijn gebouwd dat ze geen inbreuk maken op de minimale breedte van vluchtwegen
      als bedoeld in het vijfde lid, onder a of d.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.6.f)
    text: |-
      Vluchtwegen en nooduitgangen moeten duidelijk zijn gemarkeerd. De markeringen moeten door de noodverlichting worden
      belicht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.7
    text: Vluchtwegen en nooduitgangen moeten beschikken over een geschikt veiligheidsgeleidesysteem.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8
    text: 'Voor alle personen aan boord moeten verzamelruimten beschikbaar zijn, die aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8.a)
    text: |-
      De totale oppervlakte *A* van de verzamelruimten moet ten minste voldoen aan de volgende waarde: Schepen voor
      dagtochten *A* = 0,35 • *F* [*m*2 ] Hotelschepen *A* = 0,45 • *F* [*m*2 ] In deze formule betekent: *F* = ten
      hoogste aan boord toegelaten aantal passagiers.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8.b)
    text: Iedere individuele verzamel- en evacuatieruimte moet groter zijn dan 10 m2.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8.c)
    text: De verzamelruimten moeten vrij zijn van zowel losstaand als vast meubilair.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8.d)
    text: |-
      Indien zich in een ruimte, waarin een verzamelruimte aangewezen is, verplaatsbaar meubilair bevindt, moet dit
      voldoende zijn beveiligd tegen verschuiven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8.e)
    text: |-
      Indien zich in een ruimte, waarin een verzamelruimte aangewezen is, vast ingebouwde zitplaatsen bevinden, behoeft
      het aantal personen waarvoor de ruimte geschikt is bij de berekening van het totaal van de oppervlakken van de in
      onderdeel a bedoelde verzamelruimten niet in acht te worden genomen. Het aantal personen waarvoor in een ruimte
      vast ingebouwde zitplaatsen aanwezig zijn mag echter niet groter zijn dan het aantal personen waarvoor in dezelfde
      ruimte verzamelruimten beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8.f)
    text: Vanuit de evacuatieruimten moeten de reddingsmiddelen eenvoudig toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8.g)
    text: Een veilige evacuatie van personen vanuit deze evacuatieruimten moet aan beide zijden van het schip mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8.h)
    text: De verzamelruimten moeten boven de indompelingsgrenslijn liggen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8.i)
    text: |-
      De verzamel- en evacuatieruimten moeten in het veiligheidsplan als zodanig worden aangegeven en aan boord worden
      gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8.j)
    text: De voorschriften, bedoeld onder d en e, gelden eveneens voor open dekken waarop verzamelruimten zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.8.k)
    text: |-
      Indien gemeenschappelijke reddingsmiddelen overeenkomstig [artikel 19.09, vijfde lid][ref1], aan boord aanwezig
      zijn, behoeft het aantal personen, waarvoor zij geschikt zijn, bij de berekening van het totaaloppervlak van de
      verzamelruimten, bedoeld onder a, niet in acht te worden genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.06.8.l)
    text: |-
      Het totaaloppervlak, bedoeld onder a, moet echter voor alle gevallen, waarbij een reductie overeenkomstig de
      onderdelen e, j en k wordt toegepast, voor ten minste 50% van het ten hoogste toegelaten aantal passagiers aan
      boord toereikend zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9
    text: 'Trappen in het gedeelte voor passagiers en hun portalen moeten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9.a)
    text: 'Overeenkomstig de Europese norm EN 13056 : 2000, zijn gebouwd.'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9.b)
    text: |-
      Een vrije breedte van ten minste 0,80 m hebben dan wel, wanneer zij naar verbindingsgangen of trappen leiden die
      door meer dan 80 passagiers worden gebruikt, van ten minste 0,01 m per passagier.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9.c)
    text: |-
      Een vrije breedte van minstens 1,00 m hebben, wanneer zij naar een voor passagiers bestemde ruimte leiden, die
      slechts over deze verbindingstrap toegankelijk is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9.d)
    text: |-
      Zich in de veilige zone bevinden voor zover aan iedere zijde van het schip in dezelfde ruimte niet ten minste één
      trap beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9.e)
    text: |-
      Bovendien, indien zij zijn bestemd voor het gebruik door personen met beperkte mobiliteit, aan de volgende eisen
      voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9.e).aa)
    text: de helling van de trappen mag niet steiler zijn dan 38°;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9.e).bb)
    text: de trappen moeten een vrije breedte hebben van minstens 0,90 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9.e).cc)
    text: wenteltrappen zijn niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9.e).dd)
    text: trappen mogen niet in dwarsrichting in het schip zijn aangebracht;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9.e).ee)
    text: |-
      de leuningen van trappen moeten aan het begin en het eind van een horizontale uitloop van 0,30 m zijn voorzien
      zodanig, dat zij doorgang voorlangs niet bemoeilijken;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.9.e).ff)
    text: |-
      leuningen en voorkanten ten minste van de eerste en de laatste trede alsook de vloerbedekking aan de uiteinden van
      de trap moeten wat de kleur betreft contrasteren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.10
    text: 'De voor passagiers bestemde, niet afgesloten delen van de dekken moeten aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.10.a)
    text: |-
      Zij moeten door een vaste verschansing van ten minste 1,00 m hoogte of een reling volgens de Europese norm EN 711 :
      2016, bouwwijze PF, PG of PZ, zijn omgeven. Verschansing en relingen van dekken die zijn bestemd voor het gebruik
      door personen met beperkte mobiliteit moeten een hoogte hebben van ten minste 1,10 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.10.b)
    text: |-
      Openingen en inrichtingen voor embarkeren en debarkeren en voor laden en lossen moeten kunnen worden beveiligd
      en een vrije breedte hebben van ten minste 1,00 m. Openingen die gewoonlijk worden gebruikt voor embarkeren en
      debarkeren van personen met beperkte mobiliteit moeten een vrije breedte hebben van ten minste 1,50 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.10.c)
    text: |-
      Indien de openingen en inrichtingen voor embarkeren en debarkeren niet vanuit het stuurhuis te zien zijn, moeten er
      optische of elektronische hulpmiddelen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.11
    text: |-
      De gedeelten van het schip die niet voor passagiers zijn bestemd, met name de toegangen tot het stuurhuis, tot
      de lieren en tot de machinekamers, moeten voor het betreden door onbevoegden kunnen worden beveiligd. Bij deze
      toegangen moet bovendien op een opvallende plaats een teken overeenkomstig schets 1 van bijlage 4 zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.12
    text: |-
      Loopplanken moeten overeenkomstig de Europese norm EN 14206 : 2003, zijn vervaardigd. In afwijking van
      [artikel 13.02, derde lid, onder d][ref1], mag hun lengte minder dan 4 m bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.06.13
    text: |-
      Verkeerswegen die zijn bestemd voor gebruik door personen met beperkte mobiliteit moeten een vrije breedte van ten
      minste 1,30 m hebben en vrij zijn van drempels en opstaande randen die een hoogte van 0,025 m te boven gaan. Wanden
      van verkeerswegen die zijn bestemd voor gebruik door personen met beperkte mobiliteit moeten zijn voorzien van
      handrelingen op een hoogte van 0,90 m boven de vloer.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.14
    text: |-
      Glazen deuren, glazen wanden van verkeerswegen en vensterruiten moeten van voorgespannen glas of van gelaagd glas
      zijn vervaardigd. Zij mogen ook van kunststof zijn vervaardigd, indien dit uit een oogpunt van brandveiligheid
      toelaatbaar is. Doorzichtige deuren en tot aan de vloer doorlopende doorzichtige wanden van verkeerswegen moeten
      opvallend zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.15
    text: |-
      Opbouwen die volledig of waarvan de daken uit panoramaruiten bestaan, of overdekkingen door dekzeilen of dergelijke
      mobiele inrichtingen evenals de constructies daaronder mogen slechts van dergelijk materiaal zijn vervaardigd en
      dusdanig zijn gerealiseerd dat in geval van schade de kans op verwonding van personen aan boord zo klein mogelijk
      houdt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.16
    text: |-
      Drinkwaterinstallaties moeten ten minste aan de eisen van [artikel 15.05][ref1] voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel15
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '15'
        hoofdstuk: '15'
  - number: 19.06.17
    text: |-
      Er moeten toiletten voor passagiers beschikbaar zijn. Ten minste één toilet moet volgens een betreffende norm of
      voorschrift van een lidstaat voor het gebruik door personen met beperkte mobiliteit uitgevoerd zijn en via een
      passagiersverblijf dat is bestemd voor het gebruik door personen met beperkte mobiliteit te bereiken zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.18
    text: |-
      Hutten die geen venster hebben dat geopend kan worden moeten zijn aangesloten op een airconditioning- of
      ventilatiesysteem.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.06.19
    text: Op verblijven waarin bemanning of boordpersoneel is ondergebracht is dit artikel van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.06
  - number: 19.07.1
    text: |-
      Behalve met het hoofdvoortstuwingssysteem moet het schip zijn uitgerust met een tweede onafhankelijk
      voortstuwingssysteem, dat garandeert dat het schip bij uitval van het hoofdvoortstuwingssysteem zich op eigen
      kracht kan voortbewegen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.07
  - number: 19.07.2
    text: |-
      Het tweede onafhankelijke voortstuwingssysteem moet zich in een aparte machinekamer bevinden.
      Wanneer de beide machinekamers gemeenschappelijke scheidingsvlakken hebben moet deze overeenkomstig
      [artikel 19.11, tweede lid][ref1], gebouwd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.07
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.08.1
    text: |-
      Ieder passagiersschip moet beschikken over een interne spreekverbinding als bedoeld in [artikel 7.08][ref1]. Deze
      moet bovendien de bedrijfsruimten en – voor zover daar geen directe communicatiemogelijkheid vanaf de stuurstelling
      aanwezig is – de plaatsen voor het embarkeren van passagiers en de verzamelruimten voor passagiers als bedoeld in
      [artikel 19.06, achtste lid][ref2], omvatten.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.08.2
    text: |-
      Alle passagiersverblijven moeten met een luidsprekerinstallatie bereikt kunnen worden. De installatie moet zo
      gedimensioneerd zijn dat de overgebrachte informatie duidelijk van achtergrondlawaai kan worden onderscheiden.
      Voor zover er een directe communicatiemogelijkheid vanaf de stuurstelling naar het passagiersgedeelte aanwezig is,
      behoeft er aldaar geen luidspreker beschikbaar te zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.3
    text: 'Er moet een alarmsysteem aanwezig zijn. Deze moet bestaan uit:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.3.a)
    text: |-
      een alarminstallatie waarmee passagiers, bemanningsleden en leden van het boordpersoneel de leiding van het schip
      en de bemanning kunnen alarmeren. Dit alarm mag slechts klinken in de ruimten bestemd voor de scheepsleiding en
      voor de bemanning en mag slechts door de scheepsleiding kunnen worden afgezet. Dit alarm moet ten minste op de
      volgende plaatsen kunnen worden aangezet:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.3.a).aa)
    text: in iedere hut;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.3.a).bb)
    text: |-
      in gangen, liften en trappenhuizen, zodanig dat de afstand naar de dichtstbijzijnde schakelaar ten hoogste 10 m
      bedraagt, terwijl er ten minste één schakelaar per waterdicht compartiment moet zijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.3.a).cc)
    text: in salons, eetzalen en vergelijkbare dagverblijven;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.3.a).dd)
    text: in toiletten die zijn bestemd voor gebruik door personen met beperkte mobiliteit;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.3.a).ee)
    text: in machinekamers, keukens en vergelijkbare ruimten waar brand mogelijk is;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.3.a).ff)
    text: in koelruimten en overige opslagruimten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.3.b)
    text: |-
      een alarminstallatie waarmee de scheepsleiding de passagiers kan waarschuwen. Dit alarm moet duidelijk en zonder
      dat verwarring mogelijk is waarneembaar zijn in alle ruimten die toegankelijk zijn voor passagiers. Het moet
      ingeschakeld kunnen worden vanuit het stuurhuis en vanaf een plaats die constant door het personeel wordt bezet;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.3.c)
    text: |-
      een alarminstallatie waarmee de scheepsleiding, bedoeld in [artikel 7.09, eerste lid][ref1], de bemanning en het
      boordpersoneel kan waarschuwen. Deze alarminstallatie moet eveneens functioneren in de verblijfsruimten voor het
      boordpersoneel, de koelruimten en andere opslagruimten.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 19.08.4
    text: Ieder waterdicht compartiment moet zijn uitgerust met een bilge alarm.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.5
    text: Er moeten twee gemotoriseerde lenspompen aan boord beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.6
    text: Een lenssysteem met vast geïnstalleerde lensleidingen moet beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.7
    text: Koelruimten moeten, ook wanneer de deur afgesloten is, van binnen uit kunnen worden geopend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.8
    text: |-
      Indien zich onderdelen van in kasten opgestelde CO-installaties in onderdeks gesitueerde ruimten bevinden, moeten
      deze zijn voorzien van een automatische ventilatie, die automatisch in werking treedt bij het openen van de deur of
      van het luik van deze ruimte. De ventilatieschachten moeten reiken tot op 0,05 m van de bodem van deze ruimte.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
  - number: 19.08.9
    text: |-
      Behalve de verbandtrommel, bedoeld in [artikel 13.02, tweede lid, onder f][ref1], moeten er verdere verbandtrommels
      in voldoende aantal aanwezig zijn. De verbandtrommels en de plaats waar ze opgeborgen zijn moeten voldoen aan de
      eisen van artikel 13.02, tweede lid, onder f.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.08
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.09.1
    text: |-
      Behalve de in [artikel 13.08, eerste lid][ref1], genoemde reddingsboeien moeten op alle voor passagiers bestemde,
      niet gesloten delen van de dekken geschikte reddingsboeien beschikbaar zijn die aan beide zijden van het schip
      op een afstand van telkens niet meer dan 20 m uit elkaar worden geplaatst. Reddingsboeien worden als geschikt
      beschouwd als zij voldoen - aan de Europese norm EN 14144 : 2003, of
        - aan het Internationaal Verdrag van 1974 voor de beveiliging van mensenlevens op zee (Solas 1974), Hoofdstuk III,
      Regel 7.1, en aan de internationale code betreffende de reddingsmiddelen (LSA), paragraaf 2.1. De ene helft van
      alle voorgeschreven reddingsboeien moet zijn voorzien van een drijvende lijn die ten minste 30 m lang moet zijn en
      een doorsnede van 8 tot 11 mm moet hebben. De andere helft van de voorgeschreven reddingsboeien moet zijn voorzien
      van een automatisch ontbrandend licht, gevoed door batterijen, dat in het water niet kan uitgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.09.2
    text: |-
      Behalve de reddingsboeien als bedoeld in het eerste lid moeten: voor alle leden van het boordpersoneel individuele
      reddingsmiddelen als bedoeld in [artikel 13.08, tweede lid][ref1], onder handbereik beschikbaar zijn; voor de
      leden van het boordpersoneel die geen taak volgens de veiligheidsrol hebben, zijn ook harde of halfautomatisch
      opblaasbare zwemvesten als bedoeld in artikel 13.08, tweede lid, toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.09.3
    text: |-
      Passagiersschepen moeten over geschikte inrichtingen beschikken die personen op een veilige manier van boord in
      ondiep water, aan de oever of aan boord van een ander vaartuig kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.4
    text: |-
      Behalve de reddingsmiddelen als bedoeld in het eerste en tweede lid, moeten voor in totaal 100% van het ten
      hoogste toegelaten aantal passagiers individuele reddingsmiddelen als bedoeld in [artikel 13.08, tweede lid][ref1],
      aanwezig zijn, waarbij ook harde of halfautomatisch opblaasbare zwemvesten als bedoeld in artikel 13.08, tweede
      lid, zijn toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.09.5
    text: |-
      Onder „gemeenschappelijke reddingsmiddelen’ vallen ook bijboten als bedoeld in [artikel 13.07][ref1] en
      reddingsvlotten. Reddingsvlotten moeten:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.09.5.a)
    text: over een opschrift beschikken waaruit de bestemming blijkt en het aantal personen waarvoor ze geschikt zijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.5.b)
    text: voldoende zitruimte bieden voor het toegestane aantal personen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.5.c)
    text: een drijfvermogen in zoet water hebben van ten minste 750 N per persoon;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.5.d)
    text: voorzien zijn van een met het passagiersschip verbonden touw om wegdrijven te vermijden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.5.e)
    text: |-
      van geschikt materiaal zijn vervaardigd en bestand zijn tegen olie en olieproducten, alsmede tegen temperaturen tot
      50 °C;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.5.f)
    text: |-
      drijvend een stabiele ligging kunnen aannemen en behouden en voorzien zijn van geschikte middelen waaraan het
      aangegeven aantal personen zich vast kunnen houden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.5.g)
    text: |-
      een fluorescerende oranje kleur hebben dan wel fluorescerende naar alle zijden zichtbare vlakken hebben van ten
      minste 100 cm2, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.5.h)
    text: |-
      vanaf de plaats waar ze opgesteld zijn door één persoon snel en veilig over boord kunnen worden gezet dan wel
      vanzelf boven drijven, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.5.i)
    text: |-
      zijn voorzien van passende inrichtingen voor evacuatie van de in [artikel 19.06, lid 8][ref1], bedoelde
      evacuatieruimten naar de reddingsvlotten, indien de verticale afstand tussen het dek van de evacuatieruimten en het
      vlak van grootste inzinking groter is dan 1 m.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.09.6
    text: |-
      Extra gemeenschappelijke reddingsmiddelen zijn uitrustingsstukken die het mogelijk maken meerdere personen die zich
      te water bevinden drijvende te houden. Zij moeten:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.6.a)
    text: over een opschrift beschikken waaruit de bestemming blijkt en het aantal personen waarvoor ze geschikt zijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.6.b)
    text: een drijfvermogen in zoet water hebben van ten minste 100 N per persoon;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.6.c)
    text: |-
      van geschikt materiaal zijn vervaardigd en bestand zijn tegen olie en olieproducten, alsmede tegen temperaturen tot
      50 °C;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.6.d)
    text: |-
      drijvend een stabiele ligging kunnen innemen en behouden en voorzien zijn van geschikte middelen om zich vast te
      houden voor het aangegeven aantal personen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.6.e)
    text: |-
      een fluorescerende oranje kleur hebben dan wel duurzaam aangebrachte fluorescerende naar alle zijden zichtbare
      vlakken hebben van ten minste 100 cm2, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.6.f)
    text: |-
      vanaf de plaats waar ze opgesteld zijn door één persoon snel en veilig over boord kunnen worden gezet dan wel
      vanzelf boven drijven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.7
    text: 'Opblaasbare gemeenschappelijke reddingsmiddelen moeten bovendien:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.7.a)
    text: uit ten minste twee gescheiden luchtkamers bestaan;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.7.b)
    text: bij het in het water belanden zich automatisch opblazen of door handbediening kunnen worden opgeblazen, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.7.c)
    text: |-
      bij iedere mogelijke belasting, ook wanneer slechts de helft van de luchtkamers is opgeblazen, drijvend een
      stabiele ligging innemen en behouden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.8
    text: |-
      Reddingsmiddelen moeten aan boord zodanig zijn ondergebracht dat zij als het nodig is gemakkelijk en veilig kunnen
      worden bereikt. Aan het gezicht onttrokken depots moeten duidelijk zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.9
    text: Reddingsmiddelen moeten zijn getest volgens de indicaties van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.10
    text: De bijboot moet zijn uitgerust met een motor en met een verstelbare schijnwerper.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.09.11
    text: Er moet een geschikte draagbaar beschikbaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.09
  - number: 19.10.1
    text: Voor de verlichting zijn slechts elektrische installaties toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.2
    text: |-
      [Artikel 10.16, derde lid][ref1], geldt ook voor passagiersverblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel10
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '10'
        hoofdstuk: '10'
  - number: 19.10.3
    text: |-
      Een voldoende verlichting alsmede een noodverlichting moet voor ten minste de volgende ruimten en plaatsen aanwezig
      zijn:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.3.a)
    text: plaatsen waar reddingsmiddelen worden bewaard en waar zij normaal voor het gebruik worden gereedgemaakt;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.3.b)
    text: |-
      vluchtwegen, instapplaatsen voor passagiers met inbegrip van loopplanken, toe- en uitgangen, verbindingsgangen,
      liften en trappen van verblijven, hutten en woonruimten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.3.c)
    text: markeringen van de vluchtwegen en nooduitgangen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.3.d)
    text: overige ruimten die zijn bestemd voor gebruik door personen met beperkte mobiliteit;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.3.e)
    text: bedrijfsruimten, machinekamers en roermachinekamers en de uitgangen daarvan;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.3.f)
    text: stuurhuis;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.3.g)
    text: ruimte voor de noodkrachtbron;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.3.h)
    text: plaatsen waar zich blustoestellen en de bediening van brandblusinstallaties bevinden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.3.i)
    text: plaatsen waar de passagiers, het boordpersoneel en de bemanning zich in noodgevallen verzamelen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.4
    text: |-
      Er moet een noodstroominstallatie aanwezig zijn, die bestaat uit een noodstroombron en noodschakelbord en die bij
      uitval van de voeding de stroomvoorziening van de volgende elektrische inrichtingen kan overnemen; zij moet in
      staat zijn deze gelijktijdig te voeden, voor zover deze inrichtingen niet van een eigen stroombron zijn voorzien:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.4.a)
    text: navigatielantaarns;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.4.b)
    text: installaties voor geluidsseinen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.4.c)
    text: noodverlichting als bedoeld in het derde lid;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.4.d)
    text: marifooninstallatie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.4.e)
    text: alarm- en luidsprekerinstallaties en installaties voor de interne communicatie aan boord;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.4.f)
    text: |-
      schijnwerpers als bedoeld in [artikel 13.02, tweede lid, onder i][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel13
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '13'
        hoofdstuk: '13'
  - number: 19.10.4.g)
    text: brandmeldinstallatie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.4.h)
    text: overige veiligheidsinstallaties zoals automatische sprinklerinstallaties of brandbluspompen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.4.i)
    text: |-
      liften en hefinrichtingen als bedoeld in [artikel 19.06, negende lid, tweede zin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.10.5
    text: De lichtbronnen voor de noodverlichting moeten als zodanig zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.6
    text: |-
      De noodstroominstallatie moet zijn aangebracht buiten de hoofdmachinekamer, buiten de ruimte waarin de
      energiebronnen als bedoeld in [artikel 10.02, eerste lid][ref1], ondergebracht zijn en buiten de ruimte
      waarin het hoofdschakelbord staat opgesteld en van deze ruimten door scheidingsvlakken als bedoeld in
      [artikel 19.11, tweede lid][ref2], zijn gescheiden. Kabels die elektrische installaties in noodgevallen voeden,
      moeten zodanig zijn ingebouwd en doorgeleid dat de continuïteit van de voeding van deze installaties in geval
      van brand en overstroming gehandhaafd blijft. In ieder geval mogen deze kabels niet door de hoofdmachinekamer,
      door keukens of door ruimten geleid worden waarin de elektrische hoofdenergiebron en de daarbij behorende
      uitrusting staan, behalve indien het nodig is om ook deze ruimte van een noodstroominstallatie te voorzien. De
      noodstroominstallatie moet ofwel zijn opgesteld boven de indompelingsgrenslijn, ofwel zo ver verwijderd van de
      energiebronnen bedoeld in [artikel 10.02, eerste lid][ref3], dat hij in het geval van een lekke toestand als
      bedoeld in [artikel 19.03, negende lid][ref4], niet tegelijkertijd met deze energiebronnen onder water komt.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0041395#Artikel19
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
      - id: ref3
        bwb_id: BWBR0041395
        artikel: '10'
        hoofdstuk: '10'
      - id: ref4
        bwb_id: BWBR0041395
        artikel: '19'
        hoofdstuk: '19'
  - number: 19.10.7
    text: 'Als noodstroombron zijn toegelaten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.7.a)
    text: |-
      aggregaten met een eigen onafhankelijke brandstofvoorziening en onafhankelijk koelsysteem, die bij het uitvallen
      van het hoofdnet automatisch moeten aanlopen en binnen 30 seconden de stroomvoorziening automatisch moeten kunnen
      overnemen, dan wel, indien zij zich bevinden in de onmiddellijke nabijheid van het stuurhuis of een andere plaats
      waar voortdurend leden van de bemanning aanwezig zijn, met de hand kunnen worden gestart;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.7.b)
    text: |-
      accumulatoren, die bij uitvallen van het hoofdnet automatisch de stroomvoorziening overnemen, dan wel, indien zij
      zich in de onmiddellijke nabijheid van het stuurhuis of een andere plaats waar voortdurend leden van de bemanning
      aanwezig zijn, met de hand kunnen worden ingeschakeld. Zij moeten in staat zijn om de aangegeven installaties
      gedurende de voorgeschreven tijd zonder oplading en zonder ontoelaatbaar spanningsverlies te voeden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.8
    text: |-
      De voor de noodstroomvoorziening benodigde bedrijfsduur wordt bepaald naar gelang het gebruiksdoel van het
      passagiersschip, maar mag niet minder dan 30 minuten bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.9
    text: |-
      De isolatieweerstanden en de aarding van de elektrische systemen moeten worden getest tijdens de periodieke
      onderzoeken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.10.10
    text: |-
      De energiebronnen, bedoeld in [artikel 10.02, eerste lid][ref1], moeten onafhankelijk van elkaar zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel10
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '10'
        hoofdstuk: '10'
  - number: 19.10.11
    text: |-
      Storingen in de hoofd- of noodstroominstallatie mogen geen aanleiding kunnen zijn tot onderlinge beïnvloeding van
      de bedrijfszekerheid van de inrichtingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.10
  - number: 19.11.1
    text: |-
      De technische geschiktheid van materialen en onderdelen op het gebied van brandbescherming moet worden vastgesteld
      door een geaccrediteerd testinstituut op grond van geschikte testmethoden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.a)
    text: 'Het testinstituut moet voldoen aan:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.a).aa)
    text: de code voor brandtestprocedures, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.a).bb)
    text: 'de Europese norm EN ISO/IEC 17025 : 2005.'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.b)
    text: 'Erkend als testmethoden ten behoeve van het vaststellen van de onbrandbaarheid van materialen zijn:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.b).aa)
    text: bijlage 1, deel 1, van de code voor brandtestprocedures, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.b).bb)
    text: gelijkwaardige voorschriften van een lidstaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.c)
    text: 'Erkend als testmethoden ten behoeve van het vaststellen van het moeilijk ontvlambaar zijn van materialen zijn:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.c).aa)
    text: |-
      de eisen overeenkomstig bijlage 1, deel 5 (ontvlambaarheidstest van het oppervlak – test van bekledingsmaterialen
      en materialen voor dekbedekking), deel 7 (test van stofferingen en kunststoffen), deel 8 (test van gestoffeerd
      meubilair) en deel 9 (test van beddengoed) van de code voor brandtestprocedures en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.c).bb)
    text: gelijkwaardige voorschriften van een lidstaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.d)
    text: 'Erkend als testmethoden ten behoeve van het vaststellen van brandbestendigheid zijn:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.d).aa)
    text: bijlage 1, deel 3, van de code voor brandtestprocedures, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.d).bb)
    text: gelijkwaardige voorschriften van een lidstaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.1.e)
    text: |-
      De Commissie van deskundigen kan in overeenstemming met de code voor brandtestprocedures een test voor een
      modelscheidingsvlak voorschrijven teneinde zeker te stellen dat aan de voorschriften inzake weerstandsvermogen en
      temperatuurverhoging, bedoeld in het tweede lid, is voldaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.2
    text: Scheidingsvlakken
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.2.a)
    text: 'Scheidingsvlakken van ruimten moeten worden uitgevoerd in overeenstemming met de volgende tabellen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel19.11
  - number: 19.11.2.a).aa)
