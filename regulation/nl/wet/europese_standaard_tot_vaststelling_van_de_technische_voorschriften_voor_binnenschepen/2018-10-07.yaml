      1. Voor elektrische installaties met spanningen boven 50 V is aarding noodzakelijk.

      2. Metalen delen die bij normaal gebruik niet onder spanning staan, maar waar aanraking mogelijk is, zoals
      fundaties en behuizingen van elektrische installaties en vast gemonteerde elektrische apparaten, moeten
      afzonderlijk geaard zijn, voor zover zij niet al door de wijze waarop zij bevestigd zijn elektrisch geleidend met
      de scheepsromp zijn verbonden.

      3. De behuizing van verplaatsbare elektrische apparaten moet geaard zijn door middel van een extra ader die bij
      normaal bedrijf geen stroom voert en die in de voedingskabel is opgenomen. Dit geldt niet bij het gebruik van
      scheidingstransformatoren en voor apparaten waarvan de behuizing bestaat uit isolatiemateriaal (dubbel geïsoleerd).

      4. De doorsnede van de aardleiding moet ten minste gelijk zijn aan de waarde zoals aangegeven in de onderstaande
