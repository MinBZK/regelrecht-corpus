             1 2006/87/EG Richtlijn van het Europees Parlement en de Raad van 12 december 2006 tot vaststelling van
      de technische voorschriften voor binnenschepen en tot intrekking van [Richtlijn 82/714/EEG](31982L0714) van de
      Raad (OJ L 389, 30.12.2006). 2 De overgangsbepaling juncto [artikel 8.10, derde lid][ref98], is een voorschrift
      van tijdelijke aard en is geldig tot en met 31 december 2019. De toepasselijke overgangsbepaling vóór 1 december
      2014 luidde als volgt: ‘8.10 lid 3 / Geluidsgrens van 65 dB(A) voor stilliggende schepen/ N.V.O., uiterlijk bij
      verlenging van het binnenschipcertificaat na 1.1.2015’. 3 De overgangsbepaling juncto [artikel 13.07][ref99] is
      een voorschrift van tijdelijke aard en is geldig tot en met 31 december 2019. De toepasselijke bepaling vóór 1
      december 2014 luidde als volgt: “13.07 / Toepassing Europese norm op bijboten / N.V.O., uiterlijk bij verlenging
      van het binnenschipcertificaat na 1.1.2015“. 4 De vaartuigen moeten echter uiterlijk bij verlenging van het
      binnenvaartcertificaat na 1.1.2015 aan de volgende eisen voldoen: - - Buitenkanten van de dekken en de werkplekken,
      waarbij de valhoogte meer dan 1 m kan bedragen, zijn voorzien van een verschansing of den van elk ten minste
      0,70 m hoogte of van relingen die voldoen aan de Europese norm EN 711 : 1995, die bestaan uit een handreling een
      tussenroede op kniehoogte en een voetlijst.
        - - Bij gangboorden moet een voetlijst en een doorlopende handreling aan de denneboom zijn aangebracht. De
      handreling aan de dennenboom kan achterwege worden gelaten, indien het gangboord voorzien is van een niet
      neerklapbare reling. 5 Dit artikel geldt voor schepen waarvan de kiel is gelegd ná 31.12.1994 en voor in bedrijf
      zijnde schepen met in acht name van het volgende: - Bij vernieuwingswerkzaamheden, het gehele laadruim omvattend,
      is [artikel 14.04][ref100] van toepassing. Bij een verbouwing, die de totale lengte van de gangboorden omvat en
      waardoor de vrije breedte van het gangboord wordt gewijzigd:
        - a) is [artikel 14.04][ref101] van toepassing, indien de vóór de verbouwing beschikbare vrije breedte van het
      gangboord tot een hoogte van 0,90 m, of de vrije breedte daarboven, moet worden verminderd;
        - b) mag de vóór de verbouwing beschikbare vrije breedte van het gangboord tot een hoogte van 0,90 m, of
      de vrije breedte daarboven, niet worden verminderd, indien deze afmetingen kleiner zijn dan die bedoeld in
      [artikel 14.04][ref102]. 6 De overgangsbepaling juncto [artikel 19.06, zesde lid, onderdeel c][ref103], is een
      voorschrift van tijdelijke aard en is geldig tot en met 31 december 2019. De toepasselijke overgangsbepaling vóór
      1 december 2014 luidde als volgt: *‘19.06 lid 6 onder c / Vluchtwegen niet door keukens / N.V.O., uiterlijk bij
      verlenging van het binnenschipcertificaat na 1.1.2015’*. 7 De overgangsbepaling juncto [artikel 19.07][ref104]
      is een voorschrift van tijdelijke aard en is geldig tot en met 31 december 2019. De toepasselijke
      overgangsbepaling vóór 1 december 2014 luidde als volgt: *‘19.07 / Eisen aan het voortstuwingssysteem /
      N.V.O., uiterlijk bij verlenging van het binnenschipcertificaat na 1.1.2015’*. 8 De overgangsbepaling juncto
      [artikel 19.08, derde lid][ref105], is een voorschrift van tijdelijke aard en is geldig tot en met 31 december
      2019. De toepasselijke overgangsbepaling vóór 1 december 2014 luidde als volgt: *‘19.08 lid 3 / Eisen aan
      de alarminstallatie / N.V.O., uiterlijk bij verlenging van het binnenschipcertificaat na 1.1.2015’* evenals
      *‘19.08 lid 3 onder c / Alarminstallatie voor het waarschuwen van de bemanning en het boordpersoneel door
      de scheepsleiding / Voor hotelschepen geldt het voorschrift bij N.V.O., uiterlijk bij verlenging van het
      binnenschipcertificaat na 1.1.2007’*. 9 MSC.61(67) aangenomen op 5 december 1996 – Internationale Code voor
      brandtestprocedures.


