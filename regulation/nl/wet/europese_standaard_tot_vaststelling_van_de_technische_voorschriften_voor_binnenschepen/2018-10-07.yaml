      1. De veiligheidsafstand moet ten minste 300 mm bedragen.

      2. De veiligheidsafstand van schepen waarvan de openingen niet spatwater- en regendicht kunnen worden afgesloten en
      van schepen die met open laadruimen varen, moet zodanig worden verhoogd dat elk van deze openingen ten minste 500
      mm van het vlak van de grootste inzinking is verwijderd.
