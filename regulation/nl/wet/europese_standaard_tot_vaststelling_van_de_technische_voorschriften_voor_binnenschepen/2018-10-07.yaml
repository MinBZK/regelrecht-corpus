  - number: '7.05'
    text: |-
      1. Navigatielantaarns, evenals hun behuizing en toebehoren, dragen het keurmerk dat is bepaald in de gewijzigde
      [Richtlijn 2014/90](32014L0090)/EU.

      2. Voor zover de controle van de navigatielantaarns niet rechtstreeks vanuit het stuurhuis mogelijk is, moeten
      ter controle van deze lichten in het stuurhuis stroomaanwijslampen of gelijkwaardige inrichtingen, zoals
      controlelampjes, zijn aangebracht.

      3. Bij éénmansstuurstellingen voor het varen op radar moeten ter controle van de navigatielantaarns en de
      lichtseinen controlelampen in de stuurstelling zijn ingebouwd. De schakelaars van de navigatielantaarns moeten in
      of vlakbij de daarbij behorende controlelampen zijn aangebracht en daar duidelijk bij behoren.

      De groepering en de kleur van de controlelampen van de navigatielantaarns en de lichtseinen moeten overeenkomen met
      de werkelijke opstelling en de kleur van de ingeschakelde navigatielantaarns en de lichtseinen.

      Het niet-functioneren van een navigatielantaarn of lichtsein moet het uitgaan van de overeenkomstige controlelamp
      tot gevolg hebben dan wel op andere wijze door de betreffende controlelamp worden aangegeven.

      4. Bij éénmansstuurstellingen voor het varen op radar dient de bediening van de geluidsseinen met de voet te kunnen
      geschieden. Dit geldt niet voor het ‘blijf weg-sein’ overeenkomstig de toepasselijke scheepvaartpolitiereglementen
      van de lidstaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.05
  - number: '7.06'
    text: |-
      1. Navigatieradarinstallaties en bochtaanwijzers voldoen aan de in bijlage 5 vermelde voorschriften Een bevoegde
      instantie stelt vast of aan deze eisen is voldaan en geeft vervolgens een typegoedkeuring af.

      2. Inland ECDIS-apparaten die in de navigatiemodus kunnen worden gebruikt, worden beschouwd als een
      navigatieradarinstallatie. Zij moeten voldoen aan de eisen van Inland ECDIS-standaard. Aan de in bijlage 5 vermelde
      voorschriften moet zijn voldaan.

      3. De Inland AIS-apparatuur moet voldoen aan de eisen van de Inland AIS-teststandaard. Aan de in bijlage 5 vermelde
      voorschriften moet zijn voldaan.

      4. De bochtaanwijzer moet vóór de roerganger in diens gezichtsveld zijn geplaatst.

      5. Bij éénmansstuurstellingen voor het varen op radar:

      a) mag het radarscherm in normale stand niet wezenlijk buiten de blikrichting van de roerganger vallen;

      b) moet het radarbeeld zonder kap of scherm, ongeacht de buiten het stuurhuis heersende lichtomstandigheden,
      duidelijk zichtbaar zijn;

      c) moet de bochtaanwijzer direct boven of onder het radarbeeld zijn geplaatst of hierin zijn geïntegreerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.06
  - number: '7.07'
    text: |-
      1. Op schepen met een éénmansstuurstelling voor het varen op radar moet voor het schip-schipverkeer en de nautische
      informatie het ontvangen door een luidspreker en het zenden door een vast opgestelde microfoon geschieden. Het
      overschakelen van ‘ontvangen’ naar ‘zenden’ moet door middel van drukknoppen geschieden.

      In geen geval mag de microfoon van dit verkeer voor verbindingen van het openbaar verkeer kunnen worden gebruikt.

      2. Wanneer een schip met een éénmansstuurstelling voor het varen op radar is uitgerust met een marifooninstallatie
      bestemd voor het openbaar verkeer, moet de ontvangst daarvan vanaf de zitplaats van de roerganger mogelijk zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.07
  - number: '7.08'
    text: |-
      Aan boord van schepen met een éénmansstuurstelling voor het varen op radar moet een interne spreekverbinding
      aanwezig zijn.

      Vanaf de stuurstelling moeten de volgende spreekverbindingen tot stand kunnen worden gebracht:

      a) met het voorschip van het schip of het voorste gedeelte van het samenstel;

      b) met het achterschip van het schip of het achterste gedeelte van het samenstel, indien geen directe communicatie
      daarmee vanaf de stuurstelling mogelijk is;

      c) met het verblijf of de verblijven van de bemanning;

      d) met de hut van de schipper.

      Op alle punten van deze spreekverbinding dient het luisteren door luidsprekers en het spreken door vast opgestelde
      microfoons te kunnen geschieden. Met het voorschip en het achterschip van het schip of van het samenstel is een
      marifoonverbinding toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.08
  - number: '7.09'
    text: |-
      1. Er moet een onafhankelijke alarminstallatie aanwezig zijn, waarmee de verblijven, de machinekamers en eventueel
      aparte pompkamers kunnen worden bereikt.

      2. De roerganger moet een schakelaar ‘AAN/UIT’ voor de bediening van het alarmsein binnen zijn bereik hebben.
      Voor dit sein mag geen schakelaar worden gebruikt die, wanneer men hem loslaat, automatisch in de stand ‘UIT’ kan
      terugspringen.

      3. Het geluidsniveau van het alarmsignaal moet in de verblijven ten minste 75 dB(A) bedragen.

      In de machine- en pompkamers moet een overal goed waarneembaar, rondom zichtbaar knipperlicht als alarmsignaal
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.09
  - number: '7.10'
    text: Stuurhuizen moeten zijn voorzien van een doeltreffende en regelbare verwarming en ventilatie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.10
  - number: '7.11'
    text: |-
      Op schepen en samenstellen met een éénmansstuurstelling voor het varen op radar waarvan de lengte L meer dan 86 m
      of de breedte B meer dan 22,90 m bedraagt, moet de roerganger de hekankers vanaf zijn plaats kunnen presenteren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.11
  - number: '7.12'
    text: |-
      1. Mechanisch aangedreven in hoogte verstelbare stuurhuizen en toebehoren moeten zodanig zijn ontworpen dat de
      veiligheid van personen aan boord niet in gevaar wordt gebracht.

      2. Een in hoogte verstelbaar stuurhuis mag de stabiliteit van het schip niet in gevaar brengen.

      3. Bij het heffen en zakken mogen de vanuit het stuurhuis uitgevoerde handelingen niet worden gehinderd. In alle
      hoogtestanden moet de toegang tot en het verlaten van het stuurhuis mogelijk zijn.

      4. Het hefmechanisme moet vanuit het stuurhuis bediend kunnen worden. Bij de stuurstelling moeten de volgende
      indicaties zijn aangebracht:

      a) spanning aanwezig,

      b) stuurhuis in laagste stand,

      c) stuurhuis in hoogste stand,

      d) stuurhuis vergrendeld in vaste stand (indien van toepassing).

      5. Het hefmechanisme moet het stuurhuis in elke stand kunnen stoppen. Ingeval het stuurhuis in een bepaalde
      stand vergrendeld kan worden, moet het hefmechanisme zich bij een vergrendeling automatisch uitschakelen. Een
      vergrendeling moet onder alle bedrijfsomstandigheden gedeblokkeerd kunnen worden.

      6. Het hefmechanisme moet zodanig zijn uitgevoerd dat een overschrijding van de uiterste standen onmogelijk is.

      7. Ter voorkoming van ongecontroleerd neerlaten moeten bouwkundige maatregelen zijn voorzien. Ter voorkoming van
      het gevaar van persoonlijk letsel ten gevolge van het neerlaten van het stuurhuis moeten adequate beschermende
      voorzieningen aanwezig zijn. Telkens wanneer het stuurhuis in een lagere stand wordt gezet, moet automatisch een
      optisch en akoestisch waarschuwingssignaal duidelijk waarneembaar zijn.

      8. In hoogte verstelbare stuurhuizen moeten zijn voorzien van een neerlaatsysteem voor noodgevallen, dat
      onafhankelijk is van het normale hefmechanisme en dat zelfs bij een uitval van de energievoorziening gebruikt kan
      worden. Dit noodsysteem moet vanuit het stuurhuis bediend kunnen worden. Bij het gebruik van dit noodsysteem moet
      het stuurhuis net zo snel neergelaten kunnen worden als onder normale omstandigheden.

      9. (zonder inhoud)

      10. Hydraulische slangen:

      a) zijn slechts toegestaan wanneer het gebruik daarvan in verband met het verminderen van trillingen of de
      bewegingsvrijheid van de componenten absoluut noodzakelijk is;

      b) moeten ten minste zijn berekend op de ten hoogste toegelaten werkdruk;

      c) moeten uiterlijk om de acht jaar worden vernieuwd.

      11. In hoogte verstelbare stuurhuizen dienen regelmatig, echter ten minste eens in de twaalf maanden door een
      deskundige te worden onderzocht. Hierbij dient door visuele controle en controle van het functioneren te worden
      vastgesteld of de installatie veilig is.

      12. In hoogte verstelbare stuurhuizen en toebehoren moeten door een erkend deskundige worden gekeurd:

      a) vóór de eerste ingebruikstelling,

      b) vóór de hernieuwde ingebruikstelling na een wezenlijke verandering of reparatie, en

      c) met een regelmaat van ten minste elke vijf jaar.

      Ter gelegenheid van deze keuringen moet de voldoende sterkte en stabiliteit rekenkundig worden aangetoond.

      Inzake de keuring moet een door de erkend deskundige ondertekende verklaring worden opgesteld waaruit de datum van
      de keuring blijkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel7.12
  - number: '7.13'
    text: |-
      Wanneer een schip voldoet aan de in de [artikelen 7.01, derde lid][ref1], [7.04, vijfe en zesde lid][ref2],
      [7.05, derde en vierde lid][ref3], [7.06, tweede lid][ref4], [7.07][ref5], [7.08][ref6] en [7.11][ref7] bedoelde
      voorschriften voor schepen met een éénmansstuurstelling voor het varen op radar, moet in het binnenschipcertificaat
      worden aangetekend:

      ‘Goedgekeurd voor het voeren van het schip met behulp van radar door één persoon’.


