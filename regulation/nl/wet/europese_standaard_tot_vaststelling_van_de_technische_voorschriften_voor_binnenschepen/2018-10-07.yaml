      geldig tot en met 31 december 2019. De toepasselijke overgangsbepaling vóór 1 december 2014 luidde als volgt:
      *‘13.07 / Toepassing Europese norm op bijboten / N.V.O., uiterlijk bij verlenging van het binnenschipcertificaat
      na 1.1.2015 / 1.10.2003’*. 4 De overgangsbepaling juncto [artikel 19.06, zesde lid, onderdeel c][ref54], is een
      voorschrift van tijdelijke aard en is geldig tot en met 31 december 2019. De toepasselijke overgangsbepaling
      vóór 1 december 2014 luidde als volgt: *‘19.06 lid 6 onder c / Vluchtwegen niet door keukens / N.V.O.,
      uiterlijk bij verlenging van het binnenschipcertificaat na 1.1.2015 / 1.1.2006’*. 5 De overgangsbepaling
      juncto [artikel 19.07][ref55] is een voorschrift van tijdelijke aard en is geldig tot en met 31 december
      2019. De toepasselijke overgangsbepaling vóór 1 december 2014 luidde als volgt: *‘19.07 / Eisen aan het
      voortstuwingssysteem / N.V.O., uiterlijk bij verlenging van het binnenschipcertificaat na 1.1.2015 / 1.1.2006’*.
      6 De overgangsbepaling juncto [artikel 19.08, derde lid][ref56], is een voorschrift van tijdelijke aard en is
      geldig tot en met 31 december 2019. De toepasselijke overgangsbepaling vóór 1 december 2014 luidde als volgt:
      *‘19.08 lid 3 / Eisen aan de alarminstallatie / N.V.O., uiterlijk bij verlenging van het binnenschipcertificaat
      na 1.1.2015 / 1.1.2006’* evenals *‘19.08 lid 3 onder c / Alarminstallatie voor het waarschuwen van de bemanning
      en het boordpersoneel door de scheepsleiding / Voor hotelschepen geldt het voorschrift bij N.V.O., uiterlijk bij
      verlenging van het binnenschipcertificaat na 1.1.2007 / 1.1.2006’*. 7 MSC.61(67) aangenomen op 5 december 1996 –
      Internationale Code voor brandtestprocedures.


