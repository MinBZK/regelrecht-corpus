  - number: '19.04'
    text: |-
      1. De veiligheidsafstand moet ten minste gelijk zijn aan de som van:

      a) de extra zijdelingse inzinking die, gemeten langs de scheepshuid, ontstaat door de toelaatbare slagzij, bedoeld
      in [artikel 19.03, derde lid, onder e][ref1], en

      b) de resterende veiligheidsafstand, bedoeld in [artikel 19.03, derde lid, onder g][ref2].

      De veiligheidsafstand van schepen zonder schottendek moet ten minste 0,50 m bedragen.

      2. Het vrijboord moet ten minste gelijk zijn aan de som van:

      a) de extra zijdelingse inzinking die door de volgens [artikel 19.03, derde lid, onder e][ref3], berekende slagzij,
      gemeten langs de scheepshuid, ontstaat, en

      b) het resterende vrijboord, bedoeld in [artikel 19.03, derde lid, onder f][ref4].

      Het vrijboord moet echter ten minste 0,30 m bedragen.

      3. Het vlak van de grootste inzinking moet zodanig worden vastgesteld dat zowel de veiligheidsafstand als bedoeld
      in het eerste lid als het vrijboord als bedoeld in het tweede lid als de [artikelen 19.02][ref5] en [19.03][ref6]
      in acht zijn genomen.

      4. De Commissie van deskundigen kan uit veiligheidsoverwegingen een grotere veiligheidsafstand of een groter
      vrijboord bepalen.


