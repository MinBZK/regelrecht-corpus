  - number: '29.03'
    text: |-
      Voor het ten hoogste aan boord toegelaten aantal passagiers moeten zitplaatsen beschikbaar zijn. Zitplaatsen moeten
      van veiligheidsgordels voorzien zijn. Veiligheidsgordels kunnen achterwege blijven indien een geschikte bescherming
      tegen stoten aanwezig is, dan wel wanneer zij volgens de HSC Code 2000, hoofdstuk 4, deel 6, niet vereist zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.03
  - number: '29.04'
    text: |-
      In afwijking van de [artikelen 4.02][ref1] en [4.03][ref2] moet het vrijboord ten minste 500 mm bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4.02
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel4.03
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel29.04
