  - number: 32.05.1
    text: 'De onderstaande bepalingen gelden voor:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.05
  - number: 32.05.1.a)
    text: |-
      vaartuigen waarvoor vanaf 1 januari 1995 voor de eerste maal een certificaat van onderzoek voor Rijnschepen
      overeenkomstig het Reglement onderzoek schepen op de Rijn is afgegeven voorzover die op 31 december 1994 niet in
      aanbouw dan wel in verbouw waren,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.05
  - number: 32.05.1.b)
    text: |-
      vaartuigen waarvoor tussen 1 januari 1995 en 30 december 2008 een andere vergunning voor het in de vaart brengen
      is afgegeven,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.05
  - number: 32.05.1.c)
    text: |-
      vaartuigen waarvoor tussen 30 december 2008 en 6 october 2018 voor de eerste maal een communautair certificaat
      geldig voor zone R overeenkomstig [richtlijn 2006/87/EG](32006L0087) werd afgegeven,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.05
  - number: 32.05.1.d)
    text: |-
      vaartuigen waarvoor vanaf 7 october 2018 voor de eerste maal een Uniecertificaat geldig voor zone R overeenkomstig
      richtlijn (EU) 2016/1629 is afgegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.05
  - number: 32.05.2
    text: Voor deze vaartuigen moet worden aangetoond
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.05
  - number: 32.05.2.a)
    text: |-
      dat zij voldoen aan de versie van het Reglement onderzoek schepen op de Rijn die van kracht is op de datum waarop
      het certificaat van onderzoek voor Rijnschepen of een andere vergunning voor het in de vaart brengen of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.05
  - number: 32.05.2.b)
    text: |-
      dat zij voldoen aan de bepalingen van [Richtlijn 2006/87/EG](32006L0087) van toepassing voor zone R, zoals van
      toepassing op de datum van de uitgifte van het communautair certificaat, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.05
  - number: 32.05.2.c)
    text: |-
      dat zij voldoen aan de bepalingen van Richtlijn (EU) 2016/1629 van toepassing voor zone R, zoals van toepassing op
      de datum van de uitgifte van het Uniecertificaat
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.05
  - number: 32.05.3
    text: |-
      Deze vaartuigen moeten aan deze Standaard volgens de in onderstaande tabel vermelde overgangsbepalingen worden
      aangepast.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel32.05
  - number: 32.05.4
    text: |-
      [Artikel 32.04, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel32
