        bwb_id: BWBR0041395
        hoofdstuk: '18'
  - number: '19.15'
    text: |-
      1. Een passagiersschip dat voor het vervoer van minder dan 50 passagiers is toegelaten en waarvan *L* niet groter
      is dan 25 m. moet het rekenkundig bewijs van voldoende lekstabiliteit als bedoeld in [artikel 19.03][ref1], zevende
      tot en met dertiende lid aantonen, of bewijzen dat het schip in symmetrische leksituaties aan de volgende criteria
      voldoet:

      a) het schip mag maximaal tot aan de indompelingsgrenslijn inzinken, en

      b) de resterende metacentrische hoogte *GM* mag niet kleiner zijn dan 0,10 m.

      Het benodigde resterende drijfvermogen moet worden verzekerd door de juiste keuze van het materiaal van de
      scheepshuid of door drijflichamen van blokken schuim, die vast met de romp verbonden zijn. Voor schepen met een
      lengte van meer dan 15 m mag het resterend drijfvermogen door een combinatie van drijflichamen en een schotindeling
      overeenkomstig de 1-compartimentstatus als bedoeld in [artikel 19.03][ref2] zijn verzekerd.

      2. De Commissie van deskundigen kan bij passagiersschepen als bedoeld in het eerste lid kleine afwijkingen toelaten
      van de bij [artikel 19.06, derde lid, onder c, en vijfde lid, onder b][ref3], vereiste vrije hoogte. De afwijking
      mag niet meer zijn dan 5%. In geval van afwijkingen moeten de betreffende plaatsen in het schip met verf worden
      gemarkeerd.

      3. In afwijking van [artikel 19.03, negende lid][ref4], behoeven passagiersschepen die voor het vervoer van ten
      hoogste 250 passagiers zijn toegelaten en waarvan de lengte *L* niet groter is dan 45 m niet te voldoen aan de
      2-compartimentstatus.

      4. De Commissie van deskundigen kan bij passagiersschepen, die zijn toegelaten voor het vervoer van ten
      hoogste 250 passagiers en waarvan de lengte *L* niet groter is dan 25 m, afzien van het moeten voldoen aan
      [artikel 13.07][ref5], indien het passagiersschip is uitgerust met een van twee kanten bereikbaar platform vlak
      boven de waterlijn, dat het mogelijk maakt personen uit het water te redden. Het passagiersschip mag van een
      vergelijkbare inrichting zijn voorzien, in welk geval:

      a) voor de bediening van de inrichting één persoon volstaat;

      b) mobiele inrichtingen toegestaan zijn;

      c) de inrichting zich buiten de gevarenzone van de middelen tot voortbeweging bevinden moet, en

      d) een effectieve communicatie tussen de schipper en de persoon die de inrichting bedient mogelijk moet zijn.

      5. De Commissie van deskundigen kan bij passagiersschepen, die zijn toegelaten voor het vervoer van ten
      hoogste 600 passagiers en waarvan de lengte *L* niet groter is dan 45 m, afzien van het moeten voldoen aan
      [artikel 13.07][ref6], indien het passagiersschip is uitgerust met een platform overeenkomstig het vierde lid,
      eerste zin, dan wel met een vergelijkbare inrichting als een platform als bedoeld in het vierde lid, tweede zin.
      Bovendien moet het passagiersschip beschikken over:

      a) als hoofdaandrijving een roerpropeller, een cycloïdaalschroef of een waterstraalaandrijving, of

      b) een hoofdaandrijving met 2 voortstuwingsorganen, of

      c) een hoofdaandrijving en een boegschroefinstallatie.

      6. In afwijking van [artikel 19.02, negende lid][ref7], mag op passagiersschepen, waarvan de lengte *L* niet groter
      is dan 45 m en waarvan het ten hoogste toegelaten aantal passagiers overeenkomt met de lengte van het schip in
      meters, een handbediende deur, die niet op afstand kan worden bediend, in een schot als bedoeld in artikel 19.02,
      vijfde lid, in de verblijfsruimte voor passagiers aanwezig zijn, indien:

      a) het schip slechts één dek heeft;

      b) deze deur vanaf het dek direct te bereiken is en niet meer dan 10 m van de toegang tot het dek verwijderd is;

      c) de onderkant van de deuropening ten minste 30 cm boven de bodem van de verblijfsruimte voor passagiers is
      gelegen, en

      d) de beide compartimenten die door de deur worden gescheiden zijn uitgerust met een bilge alarm.

      7. In afwijking van [artikel 19.06, zesde lid, onder c][ref8], mag op passagiersschepen als bedoeld in het zesde
      lid een vluchtweg door een keuken leiden, indien een tweede vluchtweg beschikbaar is.

      8. Voor passagiersschepen, waarvan de lengte *L* niet groter is dan 45 m, geldt
      [artikel 19.01, tweede lid, onder e][ref9], niet, wanneer de vloeibaargasinstallaties met geschikte
      alarminstallaties voor gezondheidsbedreigende concentraties van CO alsmede voor explosieve gasmengsels zijn
      uitgerust.

      9. De volgende voorschriften gelden niet voor passagiersschepen waarvan de lengte *L* niet groter is dan 25 m:

      a) [artikel 19.04, eerste lid][ref10], laatste zin;

      b) [artikel 19.06, zesde lid, onder c][ref11], voor zover het keukens betreft, indien een tweede vluchtweg
      beschikbaar is;

      c) [artikel 19.07][ref12].

      10. Op hotelschepen, waarvan de lengte *L* niet groter is dan 45 m, is [artikel 19.12, tiende lid][ref13], niet van
      toepassing voor zover in iedere hut vluchtmaskers, in een aantal dat overeenkomt met de zich in die hut bevindende
      bedden, direct bereikbaar aanwezig zijn.


