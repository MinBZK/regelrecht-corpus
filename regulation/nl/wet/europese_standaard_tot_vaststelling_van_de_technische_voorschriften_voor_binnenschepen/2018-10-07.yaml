  - number: '10.07'
    text: |-
      1. Voor gelijkstroom en 1-fase wisselstroom zijn de volgende verdeelsystemen toegestaan:

      a) twee geleiders waarvan één is geaard (L1/N/PE);

      b) één geleider met terugleiding via de scheepsromp, alleen voor plaatselijk begrensde installaties, zoals de
      startinstallaties van een verbrandingsmotor (L1/PEN);

      c) twee geleiders geïsoleerd van de scheepsromp (L1/L2/PE).

      2. Voor draaistroom (3-fasen wisselstroom) zijn de volgende verdeelsystemen toegestaan:

      a) vier geleiders met geaard sterpunt zonder terugleiding via de scheepsromp (L1/L2/L3/N/PE) = (TN-S-Net) of (TT-
      Net);

      b) drie geleiders geïsoleerd van de scheepsromp (L1/L2/L3/PE) = (IT-Net);

      c) drie geleiders met geaard sterpunt en terugleiding via de scheepsromp, echter niet voor eindstroomkringen (L1/
      L2/L3/PEN).

      3. De Commissie van deskundigen kan het gebruik van andere verdeelsystemen toestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.07
  - number: '10.08'
    text: |-
      1. De voedingseenheid, oftewel alle installaties aan boord die bestemd zijn om elektrische stroom aan boord te
      brengen, moeten aan de volgende vereisten voldoen:

      a) voor stroomlevering via een walaansluiting:

      aa) voor een stroomsterkte tot en met 125 A moet voldaan worden aan de vereisten van de Europese normen EN 15869-1
      en EN 15869-3 in de op 6 juli 2017 geldende versie.

      bb) voor een stroomsterkte boven 250 A moet worden voldaan aan de vereisten van Europese norm EN 16840 : 2017.

      b) In alle andere gevallen gelden de vereisten van het tweede tot en met het negende lid. Aan de genoemde vereisten
      is voldaan, wanneer de onder a genoemde normen voor de desbetreffende toepassing zijn nagekomen.

      2. Voedingskabels van het walnet en andere externe netten naar het boordnet moeten aan boord door middel van vast
      aangebrachte klemmen of door een vast aangebrachte stekkerinrichting kunnen worden aangesloten. Kabelverbindingen
      mogen niet op trek worden belast.

      3. De scheepsromp moet bij een aansluitspanning van meer dan 50 V over een aardaansluiting beschikken.
      Aardaansluitingen moeten duidelijk gekenmerkt zijn.

      4. De aansluitingen moeten dusdanig beveiligd zijn dat parallelbedrijf van de boordnetgeneratoren en het walnet
      of andere externe netten wordt vermeden. Een kortstondig parallelbedrijf ten behoeve van omschakelen zonder
      spanningsonderbreking van de systemen is toegestaan.

      5. De aansluiting moet tegen kortsluiting en overbelasting zijn beveiligd.

      6. Op het hoofdschakelbord moet zijn aangegeven of de aansluiting onder spanning staat.

      7. Teneinde bij gelijkspanning de polariteit en bij draaistroom de fasevolgorde van het walnet of van andere
      externe netten met die van het boordnet te kunnen vergelijken, moet een aanwijsinrichting zijn geïnstalleerd.

      8. Een instructiebord bij de aansluiting moet vermelden:

      a) welke maatregelen voor het tot stand brengen van de aansluiting getroffen moeten worden;

      b) de stroomsoort, de nominale spanning en bij wisselstroom eveneens de frequentie.

      9. Bij gebruik van stekkeraansluitingen voor een nominale stroomsterkte boven 16 A moeten voorzieningen worden
      getroffen waardoor het tot stand brengen of scheiden van de aansluiting slechts mogelijk is als de stroom is
      uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: '10.09'
    text: |-
      1. Indien aan andere vaartuigen stroom wordt geleverd, moet daarvoor een afzonderlijke aansluitinrichting aanwezig
      zijn.

      2. [Artikel 10.08, tweede en vierde tot en met negende lid][ref1], is van overeenkomstige toepassing.


