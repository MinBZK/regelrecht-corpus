  - number: '22.03'
    text: |-
      1. Op drijvende werktuigen waarop tijdens het werk personen aanwezig zijn is de aanwezigheid van een algemene
      alarminstallatie vereist. Het alarmsignaal moet zich duidelijk onderscheiden van andere signalen en in alle
      verblijven en op alle werkplekken een geluidsdrukniveau doen ontstaan dat ten minste 5 dB(A) hoger is dan het ter
      plaatse overheersende maximale geluidsniveau. De alarminstallatie moet in het stuurhuis en op de belangrijkste
      bedieningspunten in werking kunnen worden gesteld.

      2. Werkinrichtingen moeten voor hun belasting voldoende sterkte hebben en zij moeten voldoen aan de voorschriften
      van een van de lidstaten van de CCR of aan de voorschriften van gewijzigde [Richtlijn 2006/42/EG](32006L0042).

      3. De kantelingsstabiliteit en de sterkte van de werkinrichtingen en eventueel de bevestiging daarvan moeten
      zodanig zijn dat zij bestand zijn tegen belastingen door te verwachten slagzij, trim en bewegingen van het drijvend
      werktuig.

      4. Indien lasten met heftoestellen omhoog worden gebracht, dient de uit stabiliteit en sterkte resulterende
      maximaal toelaatbare last duidelijk te worden aangegeven op een bord aan dek en op de bedieningspunten. Indien
      het hefvermogen door het aankoppelen van extra drijvende voorwerpen kan worden vergroot, moeten de waarden met en
      zonder extra drijvende voorwerpen zijn vermeld
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel22.03
  - number: '22.04'
    text: |-
      1. Voor de toepassing van dit hoofdstuk en in afwijking van [artikel 1.01][ref1] is de resterende
      veiligheidsafstand de kleinste verticale afstand tussen de gladde waterspiegel en het laagste punt waarboven het
      drijvend werktuig niet meer waterdicht is, waarbij rekening wordt gehouden met trim en slagzij die optreden onder
      invloed van de momenten als bedoeld in [artikel 22.07, vierde tot en met negende lid][ref2].

      2. Een resterende veiligheidsafstand bij spatwater- en regendicht afsluitbare openingen is voldoende in de zin van
      [artikel 22.07, eerste lid][ref3], wanneer deze 300 mm bedraagt.

      3. De resterende veiligheidsafstand bij niet spatwater- en regendicht afsluitbare openingen moet ten minste 400
      mm bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel1.01
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel22.07
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Artikel22.07
