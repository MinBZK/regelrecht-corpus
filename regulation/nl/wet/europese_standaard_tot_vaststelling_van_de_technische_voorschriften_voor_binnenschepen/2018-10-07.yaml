        artikel: '24.01'
        hoofdstuk: '24'
  - number: '25.01'
    text: |-
      1. Zeeschepen, die op de Rijn varen, moeten voldoen aan de geldende nationale en internationale bepalingen
      betreffende de technische voorschriften inzake de bouw, de uitrusting en het milieu die van toepassing zijn op
      zeeschepen en dit kunnen aantonen door middel van de hiervoor benodigde certificaten.

      2. Zeeschepen moeten in aanvulling op de in het eerste lid genoemde voorschriften voldoen aan de volgende
      bepalingen van deze standaard:

      a) [hoofdstuk 5][ref1];

      b) van [hoofdstuk 6][ref2]:

      de [artikelen 6.01, eerste lid][ref3], en [6.02, eerste en tweede lid][ref4];

      c) van [hoofdstuk 7][ref5]:

      de [artikelen 7.01, tweede lid][ref6], [7.02, eerste lid, en derde lid, eerste en derde alinea][ref7],
      [7.05, tweede lid][ref8],

      [artikel 7.13][ref9] voor schepen die voor het voeren van het schip door één persoon met behulp van radar zijn
      toegelaten;

      d) van [hoofdstuk 8][ref10]:

      [artikel 8.03, derde lid][ref11], indien vanaf de stuurstelling een inrichting om de motor automatisch te
      stoppen kan worden uitgeschakeld, voorts [artikelen 8.05, dertiende lid][ref12], [8.08, tiende lid][ref13],
      [8.09, eerste en tweede lid][ref14], en [8.10][ref15].

      Een verzegeling van de afsluitorganen overeenkomstig artikel 8.08, tiende lid, wordt geacht overeen te komen met
      het afsluiten van de afsluitorganen in het lenssysteem, via welke het oliehoudende water overboord kan worden
      gepompt. De sleutel of sleutels daarvan moeten op een centrale als zodanig gekenmerkte plaats worden bewaard.

      Een bewakings- en controlesysteem voor olielozingen, overeenkomstig voorschrift 16 van de MARPOL 73/78, wordt
      geacht overeen te komen met het verzegelen van het afsluitorgaan overeenkomstig artikel 8.08, tiende lid. De
      aanwezigheid van een bewakings- en controlesysteem moet door een internationaal document inzake de voorkoming van
      verontreiniging van de zee (IOPP document) overeenkomstig de MARPOL 73/78 worden aangetoond.

      Blijkt uit het IOPP document dat het schip voorzien is van opslagtanks waarin al het aan boord aanwezige
      oliehoudende bilgewater en alle olieresten kunnen worden verzameld, dan wordt geacht dat aan artikel 8.09, tweede
      lid, is voldaan;

      e) van [hoofdstuk 10][ref16]:

      [artikel 10.17][ref17];

      f) van [hoofdstuk 13][ref18]:

      de [artikelen 13.01][ref19] en [13.02, eerste lid][ref20];

      g) [hoofdstuk 21][ref21]:

      voor zeeschepen die zijn toegelaten om deel uit te maken van een samenstel;

      h) [hoofdstuk 27][ref22]:

      Aan hoofdstuk 27 is voldaan indien de stabiliteit voldoet aan de van kracht zijnde resoluties van de IMO en de
      betreffende stabiliteitsberekeningen door de bevoegde autoriteit gekeurd zijn en de containers op een voor de
      zeevaart gebruikelijke wijze zijn vastgezet.


