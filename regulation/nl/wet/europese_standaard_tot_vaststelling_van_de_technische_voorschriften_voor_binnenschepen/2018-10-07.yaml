  - number: '3.01'
    text: Schepen moeten volgens goed scheepsbouwgebruik zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.01
  - number: '3.02'
    text: |-
      1. De sterkte van de scheepsromp moet zodanig zijn dat zij in overeenstemming is met de belasting waaraan de romp
      onder normale omstandigheden is blootgesteld.

      a) Bij nieuwbouw van een schip en bij verbouwingen waardoor de sterkte van het schip kan worden beïnvloed,
      dient door berekeningen te worden aangetoond dat de scheepsromp sterk genoeg is. Dit is niet nodig, indien een
      klassecertificaat of een verklaring van een erkend classificatiebureau wordt overgelegd.

      b) Bij periodieke onderzoeken moeten bij schepen die van staal zijn gebouwd als minimale dikten van de bodem-,
      kim- en zijbeplating ten minste de grootste van de aan de hand van de volgende formules vastgestelde waarden worden
      genomen:

      1. Voor schepen met een lengte *L* van meer dan 40 m: *t* = *f* • *b* • *c* (2,3 + 0,04 *L*)[*mm*];

      voor schepen met een lengte *L* van 40 m of minder: *t* = *f* • *b* ∙ *c* (1,5 + 0,06 *L*)[*mm*] echter ten minste
      3,0 mm.

      2. *tmin* = 0,005 ∙ *a* √*T* [*mm*].

      In deze formules betekent:

      *a* = spantafstand in [mm];

      *f*= factor voor spantafstand:

      *f* = 1 voor *a* ≤ 500 *mm*,

      *f* = 1 + 0,0013 (*a* – 500) voor *a* > 500 *mm*;

      *b* = factor voor bodem- en zijbeplating of kimbeplating:

      *b* = 1,0 voor bodem- en zijbeplating,

      *b* = 1,25 voor kimbeplating.

      Bij de berekening van de minimumdikte van de kimbeplating kan voor de factor voor de spantafstand worden uitgegaan
      van *f* = 1. De minimumdikte van de kimbeplating mag echter in geen geval minder zijn dan die van de bodem- en
      zijbeplating.

      *c* = factor voor bouwwijze:

      *c* = 0,95 voor schepen met een dubbele bodem en zijtanks, waarvan het laadruimlangsschot in de zijde verticaal
      onder de dennenboom is geplaatst,

      *c* = 1,0 voor schepen met een andere bouwwijze.

      c) De minimale plaatdikte die met de onderdeel b vermelde formules is berekend mag bij schepen die in langsrichting
      zijn gebouwd en die van een dubbele bodem en zijtanks zijn voorzien, zoveel minder zijn als door een erkend
      classificatiebureau is vastgesteld en gedocumenteerd nadat de voldoende sterkte (sterkte in langs- en dwarsrichting
      alsmede plaatselijke sterkte) van de scheepsromp rekenkundig is aangetoond.

      Vernieuwing van de beplating is noodzakelijk wanneer de dikte van bodem-, kim- of zijbeplating minder is dan de
      aldus vastgestelde toelaatbare waarde.

      De volgens bovenstaande methode vastgestelde waarden voor de minimumdikten van de beplating van de scheepshuid zijn
      grenswaarden bij een normale en gelijkmatige slijtage onder de voorwaarde dat scheepsbouwstaal is gebruikt en dat
      de inwendige constructiedelen, zoals spanten, bodemwrangen en hoofd-, langs- en dwarsverbanddelen zich in goede
      staat bevinden en dat het casco geen schade heeft opgelopen die wijst op overbelasting van de romp in langsscheepse
      richting.

      Indien de werkelijke waarden lager zijn dan de berekende waarden, moeten de desbetreffende platen worden vervangen
      of gerepareerd. Plaatselijke kleine, dunnere plekken kunnen worden toegestaan tot een afwijking van ten hoogste 10%
      van de minimumdikte.

      2. Indien voor de scheepsromp een ander materiaal dan staal wordt gebruikt, moet met een berekening worden
      aangetoond dat de sterkte (sterkte in langs- en dwarsrichting alsmede plaatselijke sterkte) ten minste overeenkomt
      met die, welke bij het gebruik van staal met inachtneming van de minimale dikten als bedoeld in het eerste lid zou
      zijn geresulteerd. Indien een klassecertificaat dan wel een verklaring van een erkend classificatiebureau wordt
      overgelegd kan deze berekening achterwege blijven.

      3. De stabiliteit van de schepen moet in overeenstemming zijn met het doel waarvoor zij zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel3.02
  - number: '3.03'
    text: |-
      1. De volgende waterdichte schotten, die reiken tot tegen het dek of, wanneer er geen dek is, tot aan de bovenkant
      van het scheepsboord, moeten ten minste zijn aangebracht:

      a) een aanvaringsschot op een redelijke afstand van de voorsteven, zodanig dat bij vollopen van het vóór het
      aanvaringsschot gelegen waterdichte compartiment het drijfvermogen van het beladen schip behouden blijft en dat een
      resterende veiligheidsafstand van 100 mm in stand blijft.

      Aan deze eis wordt geacht te zijn voldaan indien het aanvaringsschot op een afstand tussen 0,04 *L* en 0,04 *L* + 2
      *m*, gemeten vanaf de voorloodlijn, is aangebracht.

      Indien deze afstand meer is dan 0,04 *L* + 2 *m*, moet het voldoen aan deze eis rekenkundig worden aangetoond.

      De afstand mag tot 0,03 *L* worden gereduceerd. In dat geval moet rekenkundig worden aangetoond dat aan de eis in
      de eerste alinea kan worden voldaan, wanneer het vóór het aanvaringsschot gelegen waterdichte compartiment alsmede
      de direct daaraan grenzende compartimenten samen zijn volgelopen.

      b) Een achterpiekschot op een redelijke afstand van de achtersteven bij schepen met een lengte *L* van meer dan 25
      m, zodanig dat bij vollopen van het achter het achterpiekschot gelegen waterdichte compartiment het drijfvermogen
      van het vol beladen schip behouden blijft en dat een resterende veiligheidsafstand van 100 mm in stand blijft.

      Aan deze eis wordt geacht te zijn voldaan indien het achterpiekschot op een afstand tussen 1,4 m en 0,04 *L* +
      2 *m*, gemeten vanaf het snijpunt van de achterzijde van de scheepsromp met het vlak van de grootste inzinking,
      is aangebracht.

      Indien deze afstand meer is dan 0,04 *L* + 2 *m*, moet het voldoen aan deze eis rekenkundig worden aangetoond.

      De afstand mag tot 1 m worden gereduceerd. In dat geval moet rekenkundig worden aangetoond dat aan de eis in de
      eerste alinea kan worden voldaan, wanneer de achter het achterpiekschot gelegen waterdichte compartiment alsmede de
      direct daaraan grenzende compartimenten samen zijn volgelopen.

      2. Verblijven alsmede voor de veiligheid van het schip en van de bedrijfsvoering noodzakelijke inrichtingen mogen
      zich niet vóór het vlak van het aanvaringsschot of achter het achterpiekschot bevinden.

      Dit geldt niet voor ankerinrichtingen en stuurmachines.

      3. Verblijven, machinekamers en ketelruimen, alsmede de bijbehorende werkruimten, moeten van de laadruimen zijn
      gescheiden door middel van waterdichte schotten die reiken tot tegen het dek.

      4. Verblijven moeten van de machinekamers en ketel- en laadruimen gasdicht zijn gescheiden en rechtstreeks van het
      dek af toegankelijk zijn. Wanneer een dergelijke toegang niet aanwezig is, moet een extra nooduitgang rechtstreeks
      toegang geven tot het dek.

      5. In de bij het eerste en derde lid voorgeschreven schotten en de in het vierde lid bedoelde begrenzing van
      ruimten mogen zich geen openingen bevinden.

      Deuren in het achterpiekschot en openingen voor de doorvoering van assen, leidingen enz. zijn evenwel toegestaan,
      wanneer zij zodanig zijn uitgevoerd dat de doelmatigheid van deze schotten en van de begrenzing van ruimten
      onverlet blijft. Deuren in het achterpiekschot zijn alleen toegestaan, indien door middel van afstandsbewaking in
      het stuurhuis kan worden vastgesteld of zij gesloten dan wel geopend zijn en indien aan beide zijden goed leesbaar
      het volgende opschrift is aangebracht:

      ‘Deur steeds onmiddellijk na het openen weer sluiten’.

      6. Openingen waarlangs water wordt in- of uitgelaten, alsmede de aangesloten leidingen moeten zo geconstrueerd zijn
      dat onopzettelijk binnendringen van water in de scheepsromp niet mogelijk is.

      7. Een voorschip moet zodanig gebouwd zijn dat ankers noch geheel, noch gedeeltelijk buiten de scheepshuid
      uitsteken.
