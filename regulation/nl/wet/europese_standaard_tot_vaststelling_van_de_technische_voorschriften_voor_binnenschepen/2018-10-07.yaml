  - number: '29.02'
    text: |-
      1. Onverminderd het tweede lid, gelden voor snelle schepen de [hoofdstukken 3 tot en met 19][ref1] met uitzondering
      van:

      a) [artikel 3.04, zesde lid, tweede alinea][ref2];

      b) [artikel 8.08, tweede lid, tweede zin][ref3];

      c) [artikel 14.02, vierde lid, tweede en derde zin][ref4];

      d) [artikel 15.02, vierde lid, tweede zin][ref5];

      e) [artikel 19.06, derde lid, onderdeel a, tweede zin][ref6].

      2. In afwijking van [artikel 19.02, negende lid][ref7], en [artikel 19.15, zevende lid][ref8], moeten alle deuren
      in waterdichte schotten op afstand kunnen worden bediend.

      3. In afwijking van [artikel 6.02, eerste lid][ref9], moet bij uitvallen of storing van de aandrijving van de
      stuurmachine onverwijld een tweede onafhankelijke aandrijving van de stuurmachine dan wel een handaandrijving in
      werking worden gesteld.

      4. Behalve de eisen van het eerste tot en met derde lid gelden voor snelle schepen de
      [artikelen 29.03 tot en met 29.10][ref10].


