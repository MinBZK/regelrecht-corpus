  - number: '23.01'
    text: |-
      Schepen bestemd voor bouwwerkzaamheden, die als zodanig in het binnenschipcertificaat zijn aangeduid, mogen buiten
      werkterreinen slechts onbeladen varen. Deze voorwaarde dient in het binnenschipcertificaat te worden vermeld.

      Hiertoe moeten deze schepen bestemd voor bouwwerkzaamheden beschikken over een verklaring van de bevoegde
      autoriteit over de duur van de werkzaamheden en de begrenzing van het werkterrein waarop het schip mag worden
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel23.01
  - number: '23.02'
    text: |-
      Voor zover in dit hoofdstuk niets anders is bepaald, zijn met betrekking tot de bouw en de uitrusting van schepen
      bestemd voor bouwwerkzaamheden de [hoofdstukken 3 tot en met 17][ref1] van Deel II van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk3
