      1. Snelle schepen mogen niet gebouwd zijn als hotelschepen.

      2. De volgende inrichtingen zijn op snelle schepen verboden:

      a) met pitbranders uitgeruste inrichtingen, bedoeld in [artikel 16.02][ref1];

      b) oliekachels met verdampingsbranders, bedoeld in de [artikelen 16.03][ref2] en [16.04][ref3];

      c) verwarmingsapparaten met vaste brandstoffen, bedoeld in [artikel 16.07][ref4];

      d) vloeibaargasinstallaties als bedoeld in [hoofdstuk 17][ref5].

      3. Snelle schepen moeten worden gebouwd onder toezicht en volgens de toepasselijke voorschriften van een erkend
      classificatiebureau, dat beschikt over bijzondere regels voor snelle schepen, en door dat bureau geclassificeerd
      zijn. De klasse moet worden gehandhaafd.


