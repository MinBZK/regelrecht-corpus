  - number: '23.04'
    text: |-
      1. Indien een schip bestemd voor bouwwerkzaamheden als spoel- en klepbak wordt geëxploiteerd moet de
      veiligheidsafstand buiten het laadruim ten minste 300 mm en het vrijboord ten minste 150 mm bedragen. De Commissie
      van deskundigen kan een kleiner vrijboord toestaan, wanneer rekenkundig is bewezen dat de stabiliteit bij belading
      met een dichtheid van 1,5 t/m3 voldoende is en er geen zijde van het dek in het water komt. De invloed van
      vloeibaar gemaakte lading moet daarbij in aanmerking worden genomen.

      2. Voor een schip bestemd voor bouwwerkzaamheden dat niet onder het eerste lid valt zijn de [artikelen 4.01][ref1]
      en [4.02][ref2] van overeenkomstige toepassing. Daarbij kan de Commissie van deskundigen voor de veiligheidsafstand
      en voor het vrijboord afwijkende waarden vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel4.01
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel4.02
