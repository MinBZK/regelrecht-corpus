      c) Warmtetest:

      Het te testen apparaat wordt binnen een half uur tot op 55 °C opgewarmd en wordt na het bereiken van deze
      temperatuur gedurende 16 uren op deze temperatuur gehouden. Aansluitend wordt een functietest uitgevoerd.

      d) Koudetest:

      Het te testen apparaat wordt in uitgeschakelde toestand tot op – 25 °C afgekoeld en gedurende twee uren op deze
      temperatuur gehouden. Aansluitend wordt de temperatuur tot op 0 °C verhoogd en een functietest uitgevoerd.

      e) Trillingstest:

      Trillingstests moeten bij de resonantiefrequentie van het apparaat of het onderdeel in de drie richtingsassen voor
      de duur van telkens 90 minuten worden uitgevoerd. Indien geen bijzondere resonantie wordt geconstateerd, vindt de
      trillingstest plaats bij 30 Hz.

      De trillingstest wordt uitgevoerd met een sinusvormige slingering tussen de volgende grenzen:

      Algemeen:

      *f* = 2,0 tot 13,2 Hz; a = ± 1 mm

      (amplitude *f* = ½ slingerbreedte)

      *f* = 13,2 Hz tot 100 Hz: versnelling ± 0,7 g.

      Functionele apparaten voor montage op verbrandingsmotoren of stuurmachines moeten als volgt worden getest:

      *f* = 2,0 tot 25 Hz; *a* = ± 1,6 mm

      (amplitude *a* = ½ slingerbreedte)

      *f* = 25 Hz tot 100 Hz; versnelling ± 4 g.

      Voelers voor montage in uitlaatgassenleidingen van verbrandingsmotoren kunnen worden blootgesteld aan beduidend
      hogere belastingen. Hiermee moet bij de tests rekening worden gehouden.

      4. Tests van de elektromagnetische verdraagbaarheid moeten op basis van de Europese normen EN 61000-4-2 : 2009, EN
      61000-4-3 : 2010, EN 61000-4-4 : 2012, met het testniveau 3 worden uitgevoerd.

      5. Het bewijs dat de apparaten voldoen aan deze testvoorwaarden moet door de fabrikant worden geleverd. Als bewijs
      geldt ook een verklaring van een erkend classificatiebureau.
