  - number: '28.04'
    text: |-
      1. Vaartuigen met een lengte *L* van meer dan 110 m moeten:

      a) beschikken over een meerschroefsaandrijving met ten minste twee van elkaar onafhankelijke aandrijfmotoren met
      eenzelfde vermogen en een vanuit het stuurhuis bedienbare boegschroefinstallatie die ook werkt indien het vaartuig
      niet geladen is;

      of

      beschikken over een enkelschroefsaandrijving en een vanuit het stuurhuis bedienbare boegschroefinstallatie. De
      boegschroefinstallatie moet voorzien zijn van een eigen energieverzorging, ook werken indien het vaartuig niet
      geladen is en bij uitval van de hoofdaandrijving het voortbewegen op eigen kracht mogelijk maken;

      b) beschikken over een navigatieradarinstallatie met bochtaanwijzer als bedoeld in
      [artikel 7.06, eerste lid][ref1];

      c) beschikken over een vast ingebouwde lensinrichting als bedoeld in [artikel 8.08][ref2];

      d) voldoen aan de eisen van artikel 31.09, eerste lid, onderdeel 1.

      2. In afwijking van het eerste lid en rekening houdend met de in de lidstaten geldende politievoorschriften op
      sommige gedeelten van het vaarwater, voor vaartuigen met een lengte *L* van meer dan 110 m – met uitzondering van
      passagiersschepen – die:

      a) aan de voorschriften van eerste lid, onderdelen a tot en met d voldoen;

      b) in geval van averij in het middelste derde deel van het vaartuig, zonder dat de inzet van zwaar
      bergingsmaterieel noodzakelijk is, kunnen worden gedeeld, waarbij de gedeelde stukken van het vaartuig na het delen
      moeten kunnen blijven drijven;

      c) over een bewijs van een erkend classificatiebureau beschikken, waarmee het drijfvermogen, de trimsituatie
      en de stabiliteit van de gedeelde stukken van het schip worden aangetoond en waaruit tevens blijkt vanaf welke
      beladingstoestand het drijfvermogen van de beide delen niet meer gewaarborgd is, waarbij in dit laatste geval het
      bewijs aan boord aanwezig moet zijn;

      d) als dubbelwandig schip volgens het ADN zijn gebouwd. Motorschepen moeten aan 9.1.0.91 tot en met 9.1.0.95 en
      tankschepen aan 9.3.2.11.7 en 9.3.2.13 tot en met 9.3.2.15 van Deel 9 van het ADN voldoen;

      e) over een meerschroefsaandrijving overeenkomstig het eerste lid, onderdeel a, eerste alinea, beschikken;

      moet in het binnenschipcertificaat onder nummer 52 een notitie worden opgenomen dat zij voldoen aan alle eisen van
      de onderdelen a tot en met e.

      3. In afwijking van het eerste lid en rekening houdend met de in de lidstaten geldende politievoorschriften op
      sommige gedeelten van het vaarwater, voor passagiersschepen met een lengte *L* van meer dan 110 m, die:

      a) aan de voorschriften van eerste lid, onderdelen a tot en met d voldoen;

      b) onder toezicht van een erkend classificatiebureau voor de hoogste klasse daarvan zijn gebouwd of omgebouwd,
      hetgeen moet worden bevestigd door een verklaring van het classificatiebureau en waarbij de lopende klasse niet
      vereist is;

      c) hetzij

      een dubbele bodem met een hoogte van ten minste 600 mm hebben, en een schotindeling hebben die garandeert dat het
      schip bij vollopen van twee willekeurige, naast elkaar gelegen waterdichte compartimenten niet inzinkt tot onder de
      indompelingsgrenslijn en er een resterende veiligheidsafstand van 100 mm blijft bestaan;

      hetzij

      een dubbele bodem met een hoogte van ten minste 600 mm hebben, en een dubbele romp met een afstand tussen de
      buitenwand van het schip en het langsschot van ten minste 800 mm hebben;

      d) beschikken over een meerschroefsaandrijving met ten minste twee van elkaar onafhankelijke aandrijfmotoren
      met eenzelfde vermogen en een vanuit het stuurhuis bedienbare boegschroefinstallatie die zowel in de lengte- als
      dwarsrichting werkt;

      e) de hekankers van uit het stuurhuis direct kunnen presenteren;

      moet in het binnenschipcertificaat onder nummer 52 een notitie worden opgenomen dat zij voldoen aan alle eisen van
      de onderdelen a tot en met e.


