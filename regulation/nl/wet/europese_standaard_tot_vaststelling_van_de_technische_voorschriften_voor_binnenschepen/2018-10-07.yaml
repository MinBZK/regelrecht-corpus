  - number: '19.03'
    text: |-
      1. De aanvrager moet het bewijs van voldoende stabiliteit van het onbeschadigde schip leveren met een
      berekening die is gebaseerd op de resultaten van het toepassen van een standaard van voldoende stabiliteit
      van het onbeschadigde schip. Alle berekeningen moeten zodanig worden uitgevoerd dat daarbij aan trim en
      inzinking geen vaste waarden zijn toegekend. De gegevens over het vaartuig in onbeladen toestand waarop de
      stabiliteitsberekeningen zijn gebaseerd moeten door een hellingproef worden bepaald.

      2. De intactstabiliteit moet voor de volgende standaardbeladingcondities worden aangetoond:

      a) bij het begin van de vaart:

      100% passagiers, 98% brandstof en drinkwater, 10% afvalwater;

      b) tijdens de vaart:

      100% passagiers, 50% brandstof en drinkwater, 50% afvalwater;

      c) bij het eind van de vaart:

      100% passagiers, 10% brandstof en drinkwater, 98% afvalwater;

      d) leeg schip:

      geen passagiers, 10% brandstof en drinkwater, geen afvalwater.

      Voor alle standaardbeladingcondities moet uitgegaan worden van lege dan wel volle ballasttanks, overeenkomstig hun
      normale gebruik.

      Daarnaast moet voor de volgende beladingsconditie voor het derde lid, onder d, worden aangetoond:

      100% passagiers, 50% brandstof en drinkwater, 50% afvalwater, het totaal van de andere vloeistoftanks met inbegrip
      van ballast voor 50% gevuld.

      3. Het bewijs van voldoende stabiliteit van het onbeschadigde schip via een berekening moet worden geleverd met
      toepassing van de volgende eisen voor voldoende stabiliteit van het onbeschadigde schip en voor de in het tweede
      lid, onder a tot en met d, genoemde standaardbeladingcondities:

      a) De maximale oprichtende hefboomarm *h* moet bij een slagzij van *φ* ≥ (*φ* + 3°) optreden en moet minstens 0,20
      m bedragen; Wanneer *φ* < *φ* is, moet de oprichtende hefboomarm bij een hoek van het onder water komen *φ* ten
      minste 0,20 m bedragen.

      b) De hoek van het onder water komen *φ* mag niet kleiner zijn dan (*φ* + 3°).

      c) Het vlak A onder de kromme van de oprichtende hefboomarm moet, afhankelijk van de positie van *φ* et de *φ* ten
      minste de volgende waarden bereiken:










                          Geval




                          A






                          1


                          *φ* ≤ 15° of *φ* ≤ 15°°



                          0,05 m • rad tot aan de kleinste van de hoeken *φ* of *φ*




                          2


                          15° < *φ* < 30°


                          *φ* ≤ *φ*


                          0,035 + 0,001 • (30 – *φ*) *m* •∙*rad* tot aan de hoek *φ*




                          3


                          15° < *φ* < 30°


                          *φ* > *φ*


                          0,035 + 0,001 • (30 – *φ*) *m* •∙*rad* tot aan de hoek *φ*




                          4


                          *φ* ≥ 30° en *φ* ≥ 30°°



                          0,035 *m* •∙*rad* tot aan de hoek *φ* =  30°






      Daarbij betekent:

      *h* de maximale hefboomarm;

      *φ* de hoek van de slagzij;

      *φ* de hoek van het onder water komen, d.w.z. de hoek van de slagzij waarbij de openingen in de scheepsromp, in de
      opbouwen of dekhuizen, die niet waterdicht gesloten kunnen worden, onderwater komen te staan;

      *φ* de maximale hoek van de slagzij als bedoeld onder e;

      *φ* de hoek van de slagzij waarbij sprake is van de maximale oprichtende hefboomarm:

      *A* vlakken onder de kromme van de oprichtende hefboomarm;

      d) De metacentrische hoogte bij het begin van *GM*, gecorrigeerd in verband met het effect van de vrije
      oppervlakken in vloeistoftanks, mag niet minder bedragen dan 0,15 m;

      e) De hoek van de slagzij *φ* mag in de beide hiernavolgende gevallen niet meer bedragen dan 12°:

      aa) op basis van het kenterende moment ten gevolge van personen en wind als bedoeld in het vierde en vijfde lid;

      bb) op basis van het kenterende moment ten gevolge van personen en het draaien van het schip als bedoeld in het
      vierde en zesde lid;

      f) Het resterende vrijboord mag bij een kenterend moment ten gevolge van personen, wind en het draaien van het
      schip als bedoeld in het vierde, vijfde en zesde lid niet minder bedragen dan 0,20 m;

      g) De resterende veiligheidsafstand moet voor schepen met vensters, of andere openingen in de scheepshuid die
      beneden het schottendek zijn gelegen en die niet waterdicht gesloten zijn, ten minste 0,10 m bedragen uitgaande van
      de drie kenterende momenten, bedoeld in onderdeel f.

      4. Het kenterende moment ten gevolge van een concentratie van personen *M* op één plaats moet op grond van de
      volgende formule als volgt worden berekend:

      In deze formule betekent:

      *P* = totale massa van personen aan boord in [t], te berekenen uit de som van het hoogste toegestane aantal
      passagiers en het maximale aantal van het boordpersoneel en de bemanning onder normale bedrijfsomstandigheden onder
      aanname van een gemiddelde massa van 0,075 t per persoon;

      *y* = zijdelingse afstand van het zwaartepunt van de massa van personen *P* vanaf de middellijn van het schip in
      [m];

      *g* = acceleratie van de zwaartekracht (*g* = 9,81 *m/s2*);

      *P*= massa van de op een vlak A verzamelde personen volgens:

      *P* - *n* • 0,075 • *A* [*t*]

      Daarbij betekent in deze formule:

      *A* = vlak waarop zich personen bevinden in [m²];

      *n* = aantal personen per vierkante meter bij

      *n* = 3,75 in geval van vrije dekoppervlakken en vlakken met verplaatsbaar meubilair; in geval van vlakken met vast
      ingebouwde zitplaatsen zoals banken, moet *n* worden berekend onder aanname van een zitbreedte van 0,50 m en een
      zitdiepte van 0,75 m per persoon;

      *y* = zijdelingse afstand van het vlakzwaartepunt van het vlak *A* vanaf de middellijn van het schip in [m].

      De berekening moet worden uitgevoerd zowel voor een concentratie van personen aan stuurboord als voor een
      concentratie aan bakboord.

      De verdeling van personen moet het meest ongunstige zijn vanuit het oogpunt van stabiliteit. Ingeval er hutten
      aanwezig zijn moet voor de berekening van het moment van personen ervan worden uitgegaan dat deze niet bezet zijn.

      Voor de berekening van beladen situaties moet het middelpunt van de zwaarte van een persoon worden genomen op 1 m
      boven het laagste punt van het betreffende dek op 0,5 *L* zonder rekening te houden met een verlaging of verhoging
      in het dek of de kromming van het dek en onder aanname van een massa van 0,075 t per persoon.

      Een gedetailleerde vaststelling van de vlakken aan dek, die door personen bezet zijn, kan achterwege blijven,
      indien de volgende waarden worden toegepast:

      *P* = 1,1 • *F* • 0,075 in het geval van schepen voor dagtochten;

      = 1,5 • *F* • 0,075 in het geval van hotelschepen.

      In deze formules betekent:

      *F* = ten hoogste aan boord toegelaten aantal passagiers;

      *y* = *B*/2in [m].

      5. Het moment ten gevolge van wind *M* moet als volgt worden aangetoond:

      In deze formule betekent:

      *p* = specifieke winddruk van 0,25 kN/m;

      *A* = zijdelings oppervlak van het schip boven het vlak van de grootste inzinking in [m2], dat overeenkomt met de
      betreffende beladingstoestand;

      *l* = afstand van het zwaartepunt van het zijdelingse vlak *A* tot het vlak van de inzinking in [m]. die
      overeenkomt met de betreffende beladingstoestand in [m].

      Bij de berekening van het zijdelingse oppervlak moeten de voorziene overdekkingen van het dek door dekzeilen of
      dergelijke mobiele inrichtingen in aanmerking worden genomen.

      6. Het moment ten gevolge van de centrifugale kracht *M*, veroorzaakt door het draaien van het schip, moet als
      volgt worden berekend:

      In deze formule betekent:

      *C* = coëfficiënt van 0,45;

      *C* = de blokcoëfficiënt (indien niet bekend moet hiervoor 1,0 worden aangenomen);

      *v* = grootste snelheid van het schip in [m/s];

      *KG* = afstand van het zwaartepunt tot de bovenkant van de kiel in [m].

      In geval het passagiersschip is uitgerust met een aandrijfsysteem overeenkomstig artikel 6.06 moet *M* worden
      afgeleid uit beproevingen op ware grootte dan wel met modellen, hetzij op basis van daarmee overeenkomende
      berekeningen.

      7. De aanvrager moet met een berekening aantonen dat de lekstabiliteit van het schip voldoende is. Hierbij
      moet voor de eindtoestand van het vollopen een berekening die berust op de procedure van het ‘wegvallen van het
      drijfvermogen’, en voor de tussentoestanden van het vollopen een berekening die berust op het ‘toenemen van het
      gewicht’ worden gebruikt. Alle berekeningen moeten zodanig worden uitgevoerd dat daarbij aan trim en inzinking geen
      vaste waarden zijn toegekend.

      8. Het drijfvermogen in lekke toestand moet voor de in het tweede lid bedoelde standaardbeladingcondities worden
      aangetoond. Hierbij moet voor drie tussenstadia van het volstromen (25%, 50% en 75% van de eindtoestand van
      het volgestroomd zijn) en voor de eindtoestand van het volgelopen zijn aan het rekenkundig bewijs van voldoende
      stabiliteit zijn voldaan.

      9. Passagiersschepen moeten voldoen aan de 1-compartimentstatus en aan de 2-compartimentstatus.

      De volgende indicaties moeten voor het geval van een lekke toestand in acht worden genomen:










                      1-compartimentstatus


                      2-compartimentstatus






                      Omvang van het lek aan de zijde





                      in langsrichting *l* [m]


                      0,10 • *L*maar niet minder dan 4,00 m


                      0,05 • *L* maar niet minder dan 2,25 m




                      in dwarsrichting *d* [m]


                      B/5


                      0,59




                      loodrecht *h* [m]


                      Vanaf de bodem van het schip onbeperkt naar boven




                      Omvang van het lek in de bodem





                      in langsrichting *l* [m]


                      0,10 • *L* maar niet minder dan 4,00 m


                      0,05 • *L* maar niet minder dan 2,25 m




                      in dwarsrichting *b* [m]


                      B/5




                      loodrecht *h* [m]


                      0,59; pijpleidingen die overeenkomstig artikel 19.02, dertiende lid, onder c, zijn aangelegd kunnen
      als onbeschadigd worden beschouwd






      a) Voor de 1-compartimentstatus kunnen de schotten als onbeschadigd worden beschouwd, wanneer de onderlinge
      afstand tussen twee aangrenzende schotten groter is dan de lengte van het lek. Langsschotten die zich op een
      afstand van minder dan B/3 ten opzichte van de scheepshuid bevinden, gemeten in een rechte hoek ten opzichte van de
      scheepsmiddellijn in het vlak van de grootste inzinking, mogen in de berekening niet worden meegenomen. Een sprong
      of een nis in een dwarsschot, waarvan de lengte groter is dan 2,50 m wordt als een langsschot beschouwd.

      b) Voor de 2-compartimentstatus wordt ieder schot dat is gelegen binnen het gebied waar het lek van invloed
      is als beschadigd aangemerkt. Dit betekent dat de plaats van de schotten zodanig moet worden gekozen, dat het
      passagiersschip na het volstromen van twee of meer aangrenzende compartimenten in de langsrichting nog kan blijven
      drijven.

      c) Het laagste punt van iedere niet waterdichte opening (bijv. van deuren, vensters, luiken) moet bij de
      eindtoestand van het volgestroomd zijn ten minste 0,10 m boven de lastlijn in lekke toestand liggen. Het
      schottendek mag bij de eindtoestand van het volstromen niet onder water komen.

      d) Er wordt met een permeabiliteit van 95% rekening gehouden. Wordt door een berekening aangetoond, dat de
      gemiddelde permeabiliteit van een compartiment kleiner is dan 95%, dan kan de berekende waarde worden aangehouden.

      De volgende waarden moeten ten minste worden bereikt:








                          verblijfsruimten


                          95%




                          machinekamers en ketelruimen


                          85%




                          bagage- en voorraadruimten


                          75%




                          dubbele bodems, brandstoftanks, ballasttanks en andere tanks al naar gelang deze tanks uit
      hoofde van hun bestemming bij het in het vlak van de grootste inzinking liggende schip als vol of leeg moeten
      worden aangenomen


                          0% of 95%.






      e) Ingeval een lek van kleinere omvang dan hierboven aangegeven leidt tot ongunstiger verhoudingen met betrekking
      tot slagzij of verlies aan metacentrische hoogte, moet een zodanig lek bij de berekening worden betrokken.

      10. Bij alle tussenstadia van het vollopen als bedoeld in het achtste lid moet aan de volgende criteria worden
      voldaan:

      a) De hoek van de slagzij *φ* van de evenwichtssituatie van het betreffende tussenstadium mag niet meer bedragen
      dan 15°.

      b) Afgezien van de hoek van de slagzij van de evenwichtssituatie van het betreffende tussenstadium moet het
      positieve bereik van de kromme van de hefboomarmen een oprichtende hefboomarm aangeven van *GZ* ≥ 0,02 *m*, voordat
      de eerste onbeschermde opening onder water komt dan wel een hoek van de slagzij *φ* van 25° bereikt wordt.

      c) Niet waterdichte openingen mogen niet onder water komen voordat de hoek van de slagzij van de evenwichtssituatie
      van het betreffende tussenstadium is bereikt.

      d) Voor de berekening van het effect van de vrije oppervlakken bij alle tussenstadia van het volstromen wordt
      uitgegaan van het bruto grondvlak van de beschadigde ruimten.

      11. Bij de eindtoestand van het volgestroomd zijn moet aan de volgende criteria worden voldaan met inachtneming van
      het kenterende moment als bedoeld in het vierde lid:

      a) De hoek van de slagzij *φ* mag niet meer bedragen dan 10°.

      b) Afgezien van de evenwichtssituatie moet het positieve bereik van de kromme van de hefboomarmen een oprichtende
      hefboomarm aangeven van *GZ* ≥ 0,02 *m* gecombineerd met een vlak *A* ≥ 0,0025 *m* • *rad*. Deze minimumwaarden van
      de stabiliteit moeten worden bereikt tot aan het onder water komen van de eerste onbeschermde opening of in ieder
      geval vóór het bereiken van een hoek van de slagzij van 25°.

      Daarbij betekent

      *φ* de hoek van de slagzij bij het volledig onder water komen met inachtneming van het moment als bedoeld in het
      vierde lid;

      *φ* de hoek van de afnemende stabiliteit dan wel de hoek waarbij de eerste onbeschermde opening onder water komt,
      of 25°: de kleinste van deze waarden moet worden aangehouden;

      *GZ* de resterende oprichtende hefboomarm bij volledig onder water komen met inachtneming van het kenterende moment
      als bedoeld in het vierde lid;

      *GZ* het moment van de hefboomarm resulterend uit het moment als bedoeld in het vierde lid.

      c) niet waterdichte openingen mogen niet onder water komen voordat de hoek van de slagzij van de evenwichtssituatie
      van het betreffende tussenstadium is bereikt. In geval dat dergelijke openingen onder water komen voordat dit
      punt is bereikt moeten de ruimten die daarmee in verbinding staan bij de berekening van de lekstabiliteit als
      volgestroomd worden beschouwd.

      12. Afsluitvoorzieningen van openingen die waterdicht afsluitbaar moeten zijn, moeten als zodanig duidelijk
      gemarkeerd worden.

      13. Wanneer doorstroomopeningen in de langsschotten worden voorzien ten behoeve van vermindering van asymmetrisch
      volstromen, moeten deze aan de volgende voorwaarden voldoen:

      a) voor de berekening van het uit dwarsrichting volstromen moet de IMO resolutie A.266 (VIII) worden toegepast;

      b) ze moeten automatisch functioneren;

      c) ze mogen niet van afsluitmechanismen zijn voorzien;

      d) de tijd die nodig is voor een volledige vereffening mag niet meer bedragen dan 15 minuten.
