  - number: 20.14.3
    text: |-
      De draadconstructie is bij voorkeur uitgevoerd volgens 6 maal 7 FE in de sterkteklasse 1.550 N/mm2. In afwijking
      daarvan kan bij gelijke sterkteklasse de constructie 6 maal 36 SE of 6 maal 19 FE gebruikt worden. Wegens de
      grotere elasticiteit van de constructie 6 maal 19 moeten de in de tabel aangegeven breekkrachten met 10% worden
      verhoogd. Gebruik van andere draadconstructies zijn toegestaan, mits deze vergelijkbare eigenschappen bezitten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.14
  - number: 20.14.4
    text: Bij gebruik van massieve verstaging geldt een toeslag van 30% op de breeksterkte volgens de tabel.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.14
  - number: 20.14.5
    text: In de verstaging worden alleen gekeurde sluitingen, ogen en bouten toegepast.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.14
  - number: 20.14.6
    text: Bouten, sluitingen, ogen en spanschroeven zijn deugdelijk geborgd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.14
  - number: 20.14.7
    text: |-
      De breeksterkte van de waterstag is ten minste 1,2 maal de breeksterkte van het aangrijpende kluiver- en
      vliegerstag.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel20.14
  - number: 20.14.8
    text: |-
      Voor schepen met minder dan 30 m3 waterverplaatsing kan de Commissie van deskundigen de volgende reducties op de
      breeksterkten volgens de tabel toestaan:






