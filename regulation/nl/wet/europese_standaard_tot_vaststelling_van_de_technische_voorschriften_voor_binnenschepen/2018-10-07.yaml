      of waarin verf is opgeslagen lampen of brandmelders gemonteerd zijn, moet aan beide vereisten worden voldaan. 4
      Voor installatiemateriaal voor een stroomsterkte vanaf 125 A: IP 66 (EN 60529 : 2014).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.03
  - number: 10.04.1
    text: |-
      In ruimten of zones waarin een explosiegevaarlijke atmosfeer kan ontstaan, mag alleen explosies beschermde
      elektrisch inrichtingen (erkend veilig) worden toegepast. Deze inrichtingen moeten ten aanzien van hun
      bedrijfszekerheid in een explosiegevaarlijke omgeving door een krachtens de nationale bepalingen van een
      lidstaat erkend keuringsinstituut gekeurd en toegelaten zijn. In deze ruimten of zones moet de installatie van
      schakeltoestellen voor verlichting en voor andere elektrische apparaten zoveel mogelijk worden vermeden. De
      beschermingsgraad tegen explosies moet zijn afgestemd op de eigenschappen met betrekking tot de atmosfeer die zich
      daar kan voordoen en de vereisten van de desbetreffende zone (explosiegroep, temperatuurklasse). De aanwijzingen
      en voorwaarden van de toelatingsverklaringen voor de inrichtingen moeten in acht worden genomen. De indeling en
      beoordeling van explosieve zones moet geschieden en gedocumenteerd worden overeenkomstig de internationale normen
      EN 60079-10-1 : 2015 en EN 60079-10-2 : 2015.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.04
  - number: 10.04.2
    text: 'Voor explosiegevaarlijke gebieden geldt:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.04
  - number: 10.04.2.a)
    text: |-
      In zone 0 zijn uitsluitend intrinsiek veilige stroomkringen met een explosiebescherming (bescherming Ex ia)
      overeenkomstig de internationale norm IEC 60079-11 : 2012 toegelaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.04
  - number: 10.04.2.b)
    text: |-
      In zone 1 zijn uitsluitend elektrische installaties toegelaten die geschikt zijn voor gebruik in een
      explosiegevaarlijke omgeving (erkend veilig).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.04
  - number: 10.04.2.c)
    text: |-
      Voor elektrische installaties in gebieden van zone 2 moeten beschermende maatregelen worden getroffen die met de
      aard en toepassing van de elektrische functionele apparaten overeenstemmen. In deze gebieden zijn toegelaten:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.04
  - number: 10.04.2.c).aa)
    text: elektrische installaties die geschikt zijn voor gebruik in een explosiegevaarlijke omgeving (erkend veilig), of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.04
  - number: 10.04.2.c).bb)
    text: |-
      elektrische functionele apparaten die wanneer zij in werking zijn geen vonken afgeven en waarvan het oppervlak dat
      in contact staat met de omgevende lucht, geen ontoelaatbare temperatuur kan bereiken, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.04
  - number: 10.04.2.c).cc)
    text: |-
      elektrische functionele apparaten die op eenvoudige wijze tegen overdruk of dampdicht geïsoleerd zijn (minimale
      bescherming IP 55) en waarvan het oppervlak geen ontoelaatbare temperatuur kan bereiken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.04
  - number: 10.04.3
    text: 'Voor de bescherming tegen stofexplosies gelden de vereisten van de Europese norm EN 60079-10-2 : 2015.'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.04
  - number: 10.05.1
    text: Voor elektrische installaties met spanningen boven 50 V is aarding noodzakelijk.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.05
  - number: 10.05.2
    text: |-
      Metalen delen die bij normaal gebruik niet onder spanning staan, maar waar aanraking mogelijk is, zoals fundaties
      en behuizingen van elektrische installaties en vast gemonteerde elektrische apparaten, moeten afzonderlijk geaard
      zijn, voor zover zij niet al door de wijze waarop zij bevestigd zijn elektrisch geleidend met de scheepsromp zijn
      verbonden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.05
  - number: 10.05.3
    text: |-
      De behuizing van verplaatsbare elektrische apparaten moet geaard zijn door middel van een extra ader die bij
      normaal bedrijf geen stroom voert en die in de voedingskabel is opgenomen. Dit geldt niet bij het gebruik van
      scheidingstransformatoren en voor apparaten waarvan de behuizing bestaat uit isolatiemateriaal (dubbel geïsoleerd).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.05
  - number: 10.05.4
    text: |-
      De doorsnede van de aardleiding moet ten minste gelijk zijn aan de waarde zoals aangegeven in de onderstaande
      tabel:







                      Doorsnede van de stroomgeleider (S) [mm2]


                      Minimumdoorsnede van de aardleiding




                      In geïsoleerde kabels [mm2]


                      Separate kabels [mm2]






                      0,5 < S < 4


                      gelijk aan de doorsnede van de stroomgeleider


                      4




                      4 < S < 16


                      gelijk aan de doorsnede van de stroomgeleider




                      16 < S < 35


                      16




                      35 < S < 120


                      gelijk aan de halve doorsnede van de stroomgeleider




                      S > 120


                      70
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.05
  - number: 10.06.1
    text: |-
      Spanningen mogen de volgende waarden niet overschrijden:









                      Soort apparaat of installatie


                      Ten hoogste toegestane spanning bij




                      Gelijkstroom


                      Wisselstroom


                      Draaistroom






                      a)


                      Kracht- en verwarmingsinstallaties met inbegrip van de wandcontactdozen voor algemeen
      gebruik ..........


                      250 V


                      250 V


                      690 V




                      b)


                      Installaties voor verlichting, communicatie en signalering met inbegrip van de wandcontactdozen
      voor algemeen gebruik ..........


                      250 V


                      250 V


                      –




                      c)


                      Wandcontactdozen voor de voeding van verplaatsbare elektrische apparaten die op het open dek of in
      nauwe geleidende ruimten of vochtige, ruimten, met uitzondering van ketels of tanks, worden gebruikt








                      1. Algemeen ..........


                      50 V1


                      50 V1






                      2. Bij gebruik van een scheidingstransformator die slechts één apparaat voedt ..........


                      –


                      250 V2


                      –





                      3. Bij gebruik van apparaten uit isolatiemateriaal (dubbel geïsoleerd) zijn uitgevoerd ..........


                      250 V


                      250 V


                      –





                      4. Bij gebruik van een aardlekschakelaar ≤ 30 mA ..........


                      –


                      250 V


                      690 V




                      d)


                      Verplaatsbare elektrische apparaten zoals elektrische voorzieningen van containers, aangehangen
      motoren, verplaatsbare ventilatoren of pompen, die wanneer zij in bedrijf zijn normaliter niet worden verplaatst en
      waarvan de voor aanraking toegankelijke delen door een aardleiding in de aansluitkabel geaard zijn en die bovendien
      door de montage op een bepaalde plaats of door een extra geleider met de scheepsromp zijn verbonden ..........


                      250 V


                      250 V


                      690 V




                      e)


                      Wandcontactdozen voor de voeding van verplaatsbare elektrische apparaten die in ketels en tanks
      worden gebruikt ..........


                      50 V1


                      50 V1


                      –




             Opmerking: 1 Indien deze spanning vanuit een net met hogere spanning wordt verkregen, moet een galvanische
      scheiding (scheidingstransformator) worden toegepast. 2 De secundaire stroomkring moet geheel van aarde zijn
      geïsoleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.06
  - number: 10.06.2
    text: 'Met inachtneming van de noodzakelijke veiligheidsmaatregelen zijn hogere spanningen toegestaan:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.06
  - number: 10.06.2.a)
    text: voor krachtinstallaties waarvan het vermogen dit vereist;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.06
  - number: 10.06.2.b)
    text: voor speciale inrichtingen aan boord, zoals radio-installaties en ontstekingsinrichtingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.06
  - number: 10.06.3
    text: |-
      De Commissie van deskundigen kan in met redenen omklede gevallen en onder naleving van de vereiste beschermende
      maatregelen andere uitzonderingen toelaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.06
  - number: 10.07.1
    text: 'Voor gelijkstroom en 1-fase wisselstroom zijn de volgende verdeelsystemen toegestaan:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.07
  - number: 10.07.1.a)
    text: twee geleiders waarvan één is geaard (L1/N/PE);
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.07
  - number: 10.07.1.b)
    text: |-
      één geleider met terugleiding via de scheepsromp, alleen voor plaatselijk begrensde installaties, zoals de
      startinstallaties van een verbrandingsmotor (L1/PEN);
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.07
  - number: 10.07.1.c)
    text: twee geleiders geïsoleerd van de scheepsromp (L1/L2/PE).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.07
  - number: 10.07.2
    text: 'Voor draaistroom (3-fasen wisselstroom) zijn de volgende verdeelsystemen toegestaan:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.07
  - number: 10.07.2.a)
    text: vier geleiders met geaard sterpunt zonder terugleiding via de scheepsromp (L1/L2/L3/N/PE) = (TN-S-Net) of (TT-Net);
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.07
  - number: 10.07.2.b)
    text: drie geleiders geïsoleerd van de scheepsromp (L1/L2/L3/PE) = (IT-Net);
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.07
  - number: 10.07.2.c)
    text: |-
      drie geleiders met geaard sterpunt en terugleiding via de scheepsromp, echter niet voor eindstroomkringen (L1/L2/
      L3/PEN).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.07
  - number: 10.07.3
    text: De Commissie van deskundigen kan het gebruik van andere verdeelsystemen toestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.07
  - number: 10.08.1
    text: |-
      De voedingseenheid, oftewel alle installaties aan boord die bestemd zijn om elektrische stroom aan boord te
      brengen, moeten aan de volgende vereisten voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.1.a)
    text: 'voor stroomlevering via een walaansluiting:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.1.a).aa)
    text: |-
      voor een stroomsterkte tot en met 125 A moet voldaan worden aan de vereisten van de Europese normen EN 15869-1 en
      EN 15869-3 in de op 6 juli 2017 geldende versie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.1.a).bb)
    text: 'voor een stroomsterkte boven 250 A moet worden voldaan aan de vereisten van Europese norm EN 16840 : 2017.'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.1.b)
    text: |-
      In alle andere gevallen gelden de vereisten van het tweede tot en met het negende lid. Aan de genoemde vereisten is
      voldaan, wanneer de onder a genoemde normen voor de desbetreffende toepassing zijn nagekomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.2
    text: |-
      Voedingskabels van het walnet en andere externe netten naar het boordnet moeten aan boord door middel van vast
      aangebrachte klemmen of door een vast aangebrachte stekkerinrichting kunnen worden aangesloten. Kabelverbindingen
      mogen niet op trek worden belast.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.3
    text: |-
      De scheepsromp moet bij een aansluitspanning van meer dan 50 V over een aardaansluiting beschikken.
      Aardaansluitingen moeten duidelijk gekenmerkt zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.4
    text: |-
      De aansluitingen moeten dusdanig beveiligd zijn dat parallelbedrijf van de boordnetgeneratoren en het walnet
      of andere externe netten wordt vermeden. Een kortstondig parallelbedrijf ten behoeve van omschakelen zonder
      spanningsonderbreking van de systemen is toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.5
    text: De aansluiting moet tegen kortsluiting en overbelasting zijn beveiligd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.6
    text: Op het hoofdschakelbord moet zijn aangegeven of de aansluiting onder spanning staat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.7
    text: |-
      Teneinde bij gelijkspanning de polariteit en bij draaistroom de fasevolgorde van het walnet of van andere externe
      netten met die van het boordnet te kunnen vergelijken, moet een aanwijsinrichting zijn geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.8
    text: 'Een instructiebord bij de aansluiting moet vermelden:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.8.a)
    text: welke maatregelen voor het tot stand brengen van de aansluiting getroffen moeten worden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.8.b)
    text: de stroomsoort, de nominale spanning en bij wisselstroom eveneens de frequentie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.08.9
    text: |-
      Bij gebruik van stekkeraansluitingen voor een nominale stroomsterkte boven 16 A moeten voorzieningen worden
      getroffen waardoor het tot stand brengen of scheiden van de aansluiting slechts mogelijk is als de stroom is
      uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.08
  - number: 10.09.1
    text: |-
      Indien aan andere vaartuigen stroom wordt geleverd, moet daarvoor een afzonderlijke aansluitinrichting aanwezig
      zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.09
  - number: 10.09.2
    text: |-
      [Artikel 10.08, tweede en vierde tot en met negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel10
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.09
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.10.1
    text: |-
      Generatoren die worden aangedreven door de hoofdmotor, de schroefas of een voor andere doeleinden bestemd
      hulpaggregaat, moeten voor de onder bedrijfsomstandigheden optredende toerentalvariaties geschikt zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.10
  - number: 10.10.2
    text: Transformatoren moeten op goed geventileerde plaatsen of in goed geventileerde ruimten worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.10
  - number: 10.10.3
    text: |-
      Primaire en secondaire transformatorwikkelingen dienen elektrisch gescheiden van elkaar uitgevoerd zijn. Dit geldt
      niet voor starttransformatoren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.10
  - number: 10.10.4
    text: |-
      Voor de instelling van de secundaire spanning van transformatoren moeten de dienovereenkomstige aftakkingen van de
      nominale spanning worden voorzien. Dit geldt niet voor starttransformatoren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.10
  - number: 10.10.5
    text: |-
      Motoren, generatoren en transformatoren moeten door de fabrikant worden voorzien van een kentekening die afgezien
      van de firmanaam van de fabrikant, het serienummer van het apparaat en het vermogen tevens de belangrijkste
      nominale kengegevens moet vermelden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.10
  - number: 10.11.1
    text: |-
      Accumulatoren moeten zodanig zijn opgesteld, dat zij toegankelijk zijn en niet kunnen verschuiven ten gevolge van
      de bewegingen van het vaartuig. Zij mogen niet zijn opgesteld op plaatsen waar zij aan overmatige hitte, extreme
      koude, spatwater of dampen zijn blootgesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.2
    text: |-
      In stuurhuis, woonverblijf, laadruim en verblijfsruimten, of op passagiersschepen in passagiersruimten, hutten en
      keukens mogen geen accumulatoren worden ondergebracht. De eerste volzin geldt niet voor accumulatoren
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.2.a)
    text: in verplaatsbare toestellen, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.2.b)
    text: met een laadvermogen van minder dan 0,2 kW.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.3
    text: |-
      Accumulatoren met een laadvermogen van meer dan 2,0 kW moeten in een speciale ruimte zijn ondergebracht. Bij
      opstelling aan dek is het voldoende indien zij in een kast zijn geplaatst. Deze ruimte of kast moet naar het open
      dek mechanisch geventileerd worden (luchttoevoer en -afvoer), voor zover uit de accumulatoren gas kan ontsnappen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.4
    text: |-
      Het laadvermogen van een accumulator wordt berekend uit de maximale laadstroom en de nominale spanning van de
      accumulator, met inachtneming van de laadkarakteristiek van de laadinrichting.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.5
    text: |-
      Accumulatoren met een laadvermogen tot en met 2,0 kW mogen ook benedendeks in een kast of kist zijn opgesteld.
      Zij mogen ook open in de machinekamer, een elektrische bedrijfsruimte of een andere goed geventileerde ruimte zijn
      geplaatst, mits zij zijn beschermd tegen vallende voorwerpen en druipwater.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.6
    text: |-
      De binnenzijde van alle voor accumulatoren bestemde ruimten, kasten of kisten, alsmede rekken en andere
      bouwtechnische onderdelen, moeten tegen de schadelijke inwerking van elektrolyt zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.7
    text: |-
      Gesloten ruimten, kasten of kisten waarin accumulatoren zijn opgesteld, moeten doeltreffend kunnen worden
      geventileerd. Een mechanische ventilatie moet zijn aangebracht indien het laadvermogen groter is dan
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.7.a)
    text: 2,0 kW voor nikkel-cadmium accumulatoren;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.7.b)
    text: 3,0 kW voor loodaccumulatoren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.8
    text: |-
      De vereiste hoeveelheid lucht *Q* moet worden berekend volgens de formule: *Q* = *f* • *I* • *n* [*m*3/*h*] Daarbij
      betekent: '*f* = 0,11 voor accumulatoren met vloeibare elektrolyten *f* = 0,03 voor accumulatoren met gesloten'
      cellen (elektrolyt gebonden in gel of vlies) *I* = ¼ van de maximale stroom van de laadinrichting in A; *n* = het
      aantal in serie geschakelde cellen. Voor accumulatoren die in een bufferschakeling met het boordnet zijn opgenomen,
      kan door de Commissie van deskundigen op grond van de laadkarakteristiek van de laadinrichting een andere
      berekeningsmethode voor de benodigde luchthoeveelheid worden toegelaten voor zover deze berust op voorschriften van
      een erkend classificatiebureau of daartoe in aanmerking komende normen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.9
    text: |-
      Bij natuurlijke ventilatie moet de doorsnede van de luchtkanalen zo groot zijn dat bij een luchtsnelheid van 0,5 m/
      s de vereiste luchthoeveelheid wordt opgebracht. De doorsnede moet echter ten minste
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.9.a)
    text: 80 cm2 voor loodaccumulatoren;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.9.b)
    text: 120 cm2 voor nikkel-cadmiumaccumulatoren
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.10
    text: |-
      Bij mechanische ventilatie moet, bij voorkeur, een afzuigventilator worden gebruikt waarvan de motor niet in de
      gas- of luchtstroom mag zijn geplaatst. Deze ventilator moet zodanig zijn uitgevoerd dat geen vonkvorming bij
      aanraking van een waaier met het ventilatorhuis en geen elektrostatische oplading kunnen optreden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.11
    text: |-
      Op de deuren of deksels van ruimten, kasten of kisten voor accumulatoren moet een teken ‘vuur, open licht en roken
      verboden’ met een diameter van ten minste 10 cm, overeenkomstig schets 2 van bijlage 4, zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.12
    text: |-
      Laadinrichtingen moeten altijd zodanig bemeten zijn dat lege accumulatoren binnen ten hoogste 15 uur weer voor
      80% van hun nominale vermogen kunnen worden opgeladen, zonder dat daarbij de maximaal toegelaten laadstroomsterkte
      wordt overschreden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.13
    text: |-
      Automatische laadinrichtingen zijn alleen toegelaten als zij zijn afgestemd op de laadeigenschappen van het
      desbetreffende accumulatortype.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.14
    text: |-
      Indien tijdens het laden tegelijkertijd verbruikers van stroom worden voorzien, moet bij de keuze van de
      laadinrichting rekening worden gehouden met het door de verbruikers benodigde vermogen. Afgezien van het tijdelijk
      vereiste vermogen, moet een laadspanning van maximaal 120% van de nominale spanning worden gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.15
    text: |-
      Voor lithium-ionen-accumulatoren gelden de vereisten van de Europese normen EN 62619 in de op 6 juli 2017 geldende
      versie en EN 62620 : 2015.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.16
    text: |-
      Ter bewaking van de accumulatoren moeten zo mogelijk accumulatormanagementsystemen worden benut. Lithium-
      ionen-accumulatoren moeten met dergelijke systemen zijn uitgerust. Deze systemen moeten ten minste de volgende
      functionele mogelijkheden bieden: a) bescherming van de cel (tegen externe en interne kortsluiting, overspanning,
      volledige ontlading, etc.); b) controle op de laadtoestand, voor zover dit niet via het laadtoestel geschiedt;
      c) vermogensmanagement; d) bepaling van de laadtoestand; e) gelijkmatige spanningsregeling tussen de cellen; f)
      thermomanagement. Voor zover mogelijk dienen zij al naar gelang de toepassing bovendien de volgende functionele
      mogelijkheden te bieden: g) vaststelling van slijtage, restcapaciteit, interne weerstand, etc.; h) communicatie
      (bijv. met omvormers en sturing); i) authenticatie en identificatie; j) historische data.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.11.17
    text: Voor batterijen gelden de leden 1 tot 12 en 16 dienovereenkomstig.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.11
  - number: 10.12.1
    text: 'Schakelborden:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.1.a)
    text: |-
      Apparaten, schakelaars, zekeringen en instrumenten in schakelborden moeten overzichtelijk zijn gerangschikt en ten
      behoeve van onderhoud en reparatie toegankelijk zijn. Aansluitklemmen voor spanningen tot en met 50 V en die voor
      spanningen boven 50 V moeten van elkaar gescheiden zijn aangebracht en doelmatig gekenmerkt zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.1.b)
    text: |-
      Op de schakelborden moeten naamplaatjes voor alle schakelaars en apparaten met de aanduiding van de stroomkring
      zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.1.c)
    text: |-
      Indien zich achter de deuren apparaten met een bedrijfsspanning van meer dan 50 V bevinden, moeten de onder
      spanning staande delen van deze apparaten tegen onvoorzien aanraken bij geopende deuren zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.1.d)
    text: |-
      Materialen van schakelborden moeten mechanisch sterk, duurzaam, moeilijk ontvlambaar, zelfdovend en niet
      hygroscopisch zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.1.e)
    text: |-
      Zijn in schakelborden laagspannings- hoogvermogensmeltveiligheden (NH) ingebouwd, dan moeten in de nabijheid van
      deze schakelborden adequate hulpmiddelen en persoonlijke beschermingsmiddelen aanwezig zijn om de smeltdraden te
      kunnen vervangen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.2
    text: 'Schakelaars, beveiligingen: Veiligheden moeten met de nominale stroom en de stroomkring zijn aangeduid.'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.2.a)
    text: |-
      Generator- en afgaande groepen moeten in elke niet geaarde geleider tegen kortsluiting en overbelasting beveiligd
      zijn. Daartoe kunnen schakeltoestellen met kortsluit- en overbelastingbeveiliging of smeltveiligheden worden
      gebruikt. Stroomkringen van de elektrische aandrijving van stuurinrichtingen overeenkomstig [artikel 6.04][ref1],
      alsmede de stuurstroomkringen van stuurinrichtingen, mogen alleen tegen kortsluiting zijn beveiligd.
      Indien vermogensschakelaars met een thermische uitschakelinrichting worden toegepast, moeten de thermische
      uitschakelinrichtingen buiten werking zijn gesteld of op ten minste tweemaal de nominale stroom zijn afgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '6'
        hoofdstuk: '6'
  - number: 10.12.2.b)
    text: |-
      De afgaande groepen van het hoofdschakelbord moeten bij stroomsterkten van meer dan 16 A van last- of
      vermogensschakelaars zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.2.c)
    text: |-
      Verbruikers die voor de voortstuwing, de stuurinrichting overeenkomstig [hoofdstuk 6][ref1], de roerstandaanwijzer,
      de navigatie en de beveiligingssystemen noodzakelijk zijn, alsmede de verbruikers met een nominale stroom van meer
      dan 16 A, moeten via afzonderlijke stroomkringen worden gevoed.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '6'
  - number: 10.12.2.d)
    text: |-
      Stroomkringen van verbruikers die voor de voortstuwing en het manoeuvreren noodzakelijk zijn, moeten rechtstreeks
      vanuit het hoofdschakelbord worden gevoed.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.2.e)
    text: |-
      Schakeltoestellen moet volgens de nominale stroom, thermische en dynamische sterkte alsmede het schakelvermogen
      worden gekozen. Schakelaars moeten alle onder spanning staande geleiders gelijktijdig schakelen. De schakelstand
      moet eenvoudig zichtbaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.2.f)
    text: |-
      Smeltdraden moeten van het gesloten type zijn en uit keramisch of gelijkwaardig materiaal bestaan. Zij moeten
      zonder aanrakingsgevaar voor personen kunnen worden vervangen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.3
    text: 'Meet- en controle-inrichtingen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.3.a)
    text: |-
      Voor generator-, accumulator- en verdeelstroomkringen moeten meet- en controle-inrichtingen, die voor een veilig
      gebruik van de installatie noodzakelijk zijn, aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.3.b)
    text: |-
      Niet geaarde netten met een spanning boven de 50 V moeten van een doelmatige aardfoutbewakingsinrichting met zowel
      een optisch als een akoestisch alarm zijn voorzien. Voor secundaire inrichtingen, zoals stuurstroomschakelingen,
      kan van een aardfoutbewakingsinrichting worden afgezien.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.4
    text: 'Opstelling van schakelborden:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.4.a)
    text: |-
      Schakelborden moeten in goed toegankelijke en goed geventileerde ruimten zijn opgesteld, zodanig dat zij tegen
      waterschade en mechanische beschadigingen zijn beschermd. Pijpleidingen en luchtkanalen moeten zodanig zijn
      geplaatst, dat schakelborden bij lekkages geen gevaar lopen. Indien de ligging in de nabijheid van schakelborden
      niet vermeden kan worden, mogen de leidingen en kanalen op die plaats geen losneembare koppelingen hebben.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.4.b)
    text: |-
      Kasten en nissen waarin open schakeltoestellen zijn ondergebracht, moeten uit moeilijk ontvlambaar materiaal
      bestaan, dan wel door een bekleding van metaal of een ander niet brandbaar materiaal zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: 10.12.4.c)
    text: |-
      Bij spanningen boven 50 V moeten aan de bedieningszijde van het hoofdschakelbord isolerende roosters of matten
      liggen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.12
  - number: '10.13'
    text: |-
      Voor oliebranderinstallaties, olie- en brandstofpompen, olie- en brandstofseparatoren en machinekamerventilatoren
      moeten buiten de opstellingsruimten nooduitschakeltoestellen op een centrale plaats aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.13
  - number: 10.14.1
    text: Kabelinvoeren van apparaten moeten passend zijn voor de afmetingen en het type van de aan te sluiten kabels.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.14
  - number: 10.14.2
    text: |-
      Wandcontactdozen van verdeelsystemen met van elkaar afwijkende spanningen of frequenties moeten van verschillende
      uitvoering zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.14
  - number: 10.14.3
    text: |-
      Schakelaars moeten alle niet geaarde geleiders van een stroomkring gelijktijdig schakelen. Bij niet geaarde
      netten zijn in stroomkringen van de verlichting voor verblijven, uitgezonderd was-, bad- en overige natte ruimten,
      eenpolige schakelaars toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.14
  - number: 10.14.4
    text: |-
      Bij stroomsterkten van meer dan 16 A moeten de wandcontactdozen zodanig met een schakelaar worden vergrendeld, dat
      noch het insteken, noch het uittrekken van de stekker mogelijk is wanneer de contactbussen van de contactdoos onder
      spanning staan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.14
  - number: 10.15.1
    text: |-
      Kabels moeten moeilijk ontvlambaar, zelfdovend en bestendig tegen water en olie zijn. In de verblijven kan de
      toepassing van andere kabeltypen door de Commissie van deskundigen worden toegestaan, mits deze kabels doeltreffend
      zijn beschermd, moeilijk ontvlambaar en zelfdovend zijn. Ter vaststelling van het moeilijk ontvlambaar zijn van
      elektrische kabels moet hetzij
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.1.a)
    text: aan de vereisten van de Europese normenreeks EN 60332-1 en EN 60332-3 in de op 6 juli 2017 geldende versies of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.1.b)
    text: aan gelijkwaardige voorschriften van een van de lidstaten
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.2
    text: Voor kracht- en verlichtingsinstallaties moeten de aders van de kabels een doorsnede van ten minste 1,5 mm2 hebben.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.3
    text: |-
      De metalen bewapening, afscherming en mantels van kabels mogen bij normaal gebruik niet als geleider of aardleiding
      dienen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.4
    text: |-
      Metalen bewapeningen en mantels van kabels van kracht- en verlichtingsinstallaties moeten ten minste aan één
      uiteinde geaard zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.5
    text: |-
      De doorsnede van de geleiders moet in overeenstemming zijn met de ten hoogste toegestane geleidertemperatuur
      (toelaatbare stroomsterkte) alsmede met het toelaatbare spanningsverlies. Dit spanningsverlies, optredend tussen
      het hoofdschakelbord en het meest ongunstige punt van de installatie, mag bij verlichtingsinstallaties niet meer
      dan 5% en voor kracht- en verwarmingsinstallaties niet meer dan 7% van de nominale spanning bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.6
    text: Kabels moeten tegen het gevaar van mechanische beschadigingen beschermd zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.7
    text: Kabelbevestigingen moeten tegen mechanische belasting en tegen trekbelasting beschermd zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.8
    text: |-
      De doorvoeringen van kabels door schotten of dekken mogen de sterkte, dichtheid en de vereiste brandwerende
      eigenschappen (o.a. het niet brandbaar zijn, moeilijk ontbrandbaar zijn of brandbestendigheid) van de schotten of
      de dekken niet nadelig beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.9
    text: |-
      De uiteinden en verbindingen van alle leidingen moeten zo zijn vervaardigd dat de oorspronkelijke elektrische,
      mechanische, en de vereiste brandwerende eigenschappen (o.a. het niet brandbaar zijn, moeilijk ontbrandbaar zijn
      of brandbestendigheid) van de kabel gehandhaafd blijven. Hieraan is voldaan wanneer de uiteinden en verbindingen
      voldoen aan
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.9.a)
    text: 'de internationale norm IEC 60092-352 : 2005 nummer 3.28 in verbinding met Bijlage D van de norm of'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.9.b)
    text: een door de lidstaten als gelijkwaardig erkend voorschrift of norm.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.10
    text: |-
      Kabels die naar in de hoogte verstelbare stuurhuizen worden gevoerd, moeten voldoende buigzaam zijn en van een
      isolatie zijn voorzien die voldoende buigzaam blijft tot een temperatuur van - 20 °C, alsmede bestand zijn tegen de
      inwerking van dampen, ultraviolette straling en ozon.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.11
    text: |-
      De doorvoeringen van kabelbundels mogen de brandwerende eigenschappen van de afscheidingen niet nadelig
      beïnvloeden. Hieraan is voldaan wanneer de kabels voldoen aan de bepalingen van de Europese normenreeks EN 60332-
      3 in de op 6 juli 2017 geldende versie, of voldoen aan door een lidstaat als gelijkwaardig erkende voorschriften.
      Indien dit niet het geval is, moeten in lange doorvoeringen van kabelbundels (meer dan 6 m verticaal en 14 m
      horizontaal) brandwerende voorzieningen worden getroffen, voor zover de kabels niet volledig door kabelschachten
      omhuld zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.12
    text: Kabels die van een noodstroombron naar verbruikers leiden, moeten zoveel mogelijk in veilige zones worden gelegd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.13
    text: |-
      In zones met een verhoogde omgevingstemperatuur, moet de aanwezigheid van kabels worden vermeden. Indien dit niet
      mogelijk is,
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.13.a)
    text: moet bij de bepaling van de toelaatbare stroomsterkte rekening worden gehouden met de omgevingstemperaturen, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.13.b)
    text: moeten de kabels tegen beschadiging door hitte en vuur worden beschermd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.14
    text: |-
      Hoofd- en noodstroomverzorgingskabels mogen niet door dezelfde ruimte worden gelegd. De Commissie van deskundigen
      kan een uitzondering hierop toestaan, wanneer
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.14.a)
    text: de hoofd- en noodstroomverzorgingskabels zo ver mogelijk van elkaar worden gelegd of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.15.14.b)
    text: |-
      de noodstroomverzorgingskabels brandbestendig zijn. Hieraan is voldaan wanneer zij voldoen aan de eisen van de
      internationale normenreeks IEC 60331 in de op 6 juli 2017 geldende versie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.15
  - number: 10.16.1
    text: |-
      Verlichtingsarmaturen moeten zodanig zijn aangebracht, dat brandbare voorwerpen of constructiedelen niet door de
      uitgestraalde warmte in brand kunnen geraken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.16
  - number: 10.16.2
    text: |-
      De verlichtingsarmaturen op het open dek moeten zodanig zijn geplaatst, dat de waarneembaarheid van de
      navigatielichten niet nadelig wordt beïnvloed.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.16
  - number: 10.16.3
    text: |-
      Indien in een machinekamer of een ketelruim twee of meer lichtpunten zijn aangebracht, moeten deze over ten minste
      twee stroomkringen zijn verdeeld. Dit geldt eveneens voor ruimten waarin koelmachines, hydraulische inrichtingen of
      elektromotoren zijn geplaatst.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.16
  - number: 10.17.1
    text: |-
      Schakelborden voor navigatielantaarns moeten in het stuurhuis zijn geïnstalleerd. Zij moeten door een aparte kabel
      vanaf het hoofdschakelbord worden gevoed of door twee van elkaar onafhankelijke onderverdelingen kunnen worden
      verzorgd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.17
  - number: 10.17.2
    text: |-
      Elke navigatielantaarn moet vanaf het navigatieschakelbord afzonderlijk gevoed, beveiligd en geschakeld kunnen
      worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.17
  - number: 10.17.3
    text: |-
      Het uitvallen van de controle-inrichtingen als bedoeld in [artikel 7.05, tweede lid][ref1], mag de werking van de
      bijbehorende navigatielantaarns niet nadelig beïnvloeden.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.17
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '7'
        hoofdstuk: '7'
  - number: 10.17.4
    text: |-
      Dicht bijeen geplaatste, bij elkaar behorende navigatielantaarns mogen gemeenschappelijk worden gevoed, beveiligd
      en geschakeld. De controle-inrichting moet dan echter het uitvallen van één der lantaarns kunnen signaleren. Twee
      in één armatuur boven elkaar geplaatste navigatielantaarns mogen niet gelijktijdig ingeschakeld kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.17
  - number: 10.18.1
    text: |-
      Elk systeem dat deel uitmaakt van de vermogenselektronica moet afzonderlijk van het net kunnen worden gescheiden.
      Bij verbruikers met een nominale stroom tot 315 A is een combinatie van zekering en bescherming toegestaan. In alle
      andere gevallen moet binnen het net een vermogensschakelaar worden voorzien.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.18
  - number: 10.18.2
    text: |-
      De vermogenselektronica moet voor reparaties en metingen goed toegankelijk zijn. Voor een controle van de werking
      en het opsporen van storingen moeten dienovereenkomstige voorzieningen worden getroffen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.18
  - number: 10.18.3
    text: De regel- en signaalelektronica moet galvanisch van de hoofdstroomkringen gescheiden zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.18
  - number: 10.18.4
    text: |-
      Stroomomvormers moeten ook bij de maximaal toelaatbare spannings- en frequentieschommelingen een veilig gebruik
      waarborgen. Bij ontoelaatbaar hoge frequentie- en/of spanningsafwijkingen in de stroomverzorging moet het systeem
      uitschakelen of in een veilige bedrijfstoestand blijven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.18
  - number: 10.18.5
    text: |-
      Elektrische lading in bouwgroepen moet na loskoppeling van het net in minder dan 5 seconden terugvallen op een
      spanning onder de 50 V. Indien een langere ontladingstijd vereist is, moet op het toestel een waarschuwingsplaatje
      zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.18
  - number: 10.18.6
    text: Het wegvallen van externe sturingssignalen mag niet tot een gevaarlijke situatie leiden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.18
  - number: 10.18.7
    text: |-
      De vermogenselektronica moet zodanig voorzien en ingebouwd zijn dat het wegvallen van de voor de sturing vereiste
      spanning geen gevaren voor of schade aan de installatie of het apparaat waarin de vermogenselektronica is ingebouwd
      of de algehele installatie veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.18
  - number: 10.18.8
    text: |-
      Bij installaties die voor de aandrijving en manoeuvreerbaarheid van het vaartuig, alsook voor de veiligheid van de
      bemanning, het vaartuig of de lading onontbeerlijk zijn, moeten voor de bewaking van de afzonderlijke bouwgroepen
      van de vermogenselektronica en systeemonderdelen componenten worden voorzien die een opsporing van storingen
      mogelijk maken en het optreden van niet onderkende fouten voorkomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.18
  - number: 10.18.9
    text: |-
      De vermogenselektronica moet over zodanige bewakingsfuncties beschikken dat fouten feilloos worden opgespoord en
      niet onderkende fouten worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.18
  - number: 10.18.10
    text: |-
      Er mag, met uitzondering van bouwonderdelen, slechts vermogenselektronica worden gebruikt die over
      een typegoedkeuring beschikt. Indien beschermings- en bewakingsapparatuur een onderdeel vormen van de
      vermogenselektronica, moeten ook de drempelwaarden worden geverifieerd en moet worden aangetoond dat alle
      beschermings- en bewakingsvoorzieningen naar behoren op elkaar zijn afgestemd. Het inspectieprotocol moet bij de
      documentatie van de installatie worden gevoegd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.18
  - number: '10.19'
    text: |-
      Alarm- en beveiligingssystemen voor controle en beveiliging van werktuigbouwkundige inrichtingen moeten aan de
      volgende voorwaarden voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.19
  - number: 10.19.1
    text: |-
      Alarmsystemen: Alarmsystemen moeten zodanig worden uitgevoerd, dat fouten in het alarmsysteem niet tot uitval
      van het te controleren apparaat of de te controleren installatie kunnen leiden. Binaire gevers moeten volgens het
      ruststroomprincipe of als bewaakt arbeidsstroomprincipe zijn uitgevoerd. Optische alarmsignalen moeten zichtbaar
      blijven totdat de desbetreffende storing is opgeheven. Een geaccepteerd alarmsignaal moet onderscheiden kunnen
      worden van een niet geaccepteerd alarmsignaal. Elk alarmsignaal moet ook akoestisch worden gemeld. Akoestische
      alarmsignalen moeten kunnen worden uitgeschakeld. Door het uitschakelen van een akoestisch alarmsignaal mag het
      inwerkingtreden van een door nieuwe oorzaken geactiveerd alarmsignaal niet worden verhinderd. Bij alarminstallaties
      met minder dan vijf meetpunten kan met goedkeuring van de Commissie van deskundigen hiervan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.19
  - number: 10.19.2
    text: |-
      Beveiligingssystemen: Beveiligingssystemen moeten zodanig worden uitgevoerd, dat zij voor het bereiken van kritieke
      bedrijfstoestanden de bedreigde installatie uitschakelen, reduceren of op een permanent bezette post daartoe
      oproepen. Binaire gevers moeten volgens het arbeidsstroomprincipe zijn uitgevoerd. Indien beveiligingssystemen
      niet van een eigen controlesysteem zijn voorzien, moet het functioneren van deze systemen kunnen worden getest.
      Beveiligingssystemen moeten onafhankelijk van andere systemen worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.19
  - number: 10.20.1
    text: |-
      Algemeen De in het tweede lid gestelde testvoorwaarden zijn uitsluitend van toepassing op elektronische apparaten
      die voor stuurinrichtingen en machine-installaties voor de voortbeweging van het vaartuig, met inbegrip van de
      daarbij behorende randapparatuur, benodigd zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.20
  - number: 10.20.2
    text: Testvoorwaarden
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.20
  - number: 10.20.2.a)
    text: |-
      De volgende testbelastingen mogen niet leiden tot schade aan of verkeerd functioneren van elektronische apparaten.
      De tests overeenkomstig de desbetreffende internationale normen (zoals IEC 60092-504 : 2016) moeten, met
      uitzondering van de koudetest, met een ingeschakeld apparaat worden uitgevoerd, waarbij de functie moet worden
      getest.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.20
  - number: 10.20.2.b)
    text: |-
      Spannings- en frequentieafwijkingen:









                          eenheid


                          afwijkingen




                          blijvend


                          kortstondig






                          Algemeen


                          frequentie
                          spanning


                          ± 5%
                          ± 10%


                          ± 10% 5 s
                          ± 20% 1,5 s




                          Accumulatorwerking


                          spanning


                          + 30% / – 25%


                          –
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.20
  - number: 10.20.2.c)
    text: |-
      Warmtetest: Het te testen apparaat wordt binnen een half uur tot op 55 °C opgewarmd en wordt na het bereiken van
      deze temperatuur gedurende 16 uren op deze temperatuur gehouden. Aansluitend wordt een functietest uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.20
  - number: 10.20.2.d)
    text: |-
      Koudetest: Het te testen apparaat wordt in uitgeschakelde toestand tot op – 25 °C afgekoeld en gedurende twee uren
      op deze temperatuur gehouden. Aansluitend wordt de temperatuur tot op 0 °C verhoogd en een functietest uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.20
  - number: 10.20.2.e)
    text: |-
      Trillingstest: Trillingstests moeten bij de resonantiefrequentie van het apparaat of het onderdeel in de
      drie richtingsassen voor de duur van telkens 90 minuten worden uitgevoerd. Indien geen bijzondere resonantie
      wordt geconstateerd, vindt de trillingstest plaats bij 30 Hz. De trillingstest wordt uitgevoerd met een
      sinusvormige slingering tussen de volgende grenzen: Algemeen: *f* = 2,0 tot 13,2 Hz; a = ± 1 mm (amplitude
      *f* = ½ slingerbreedte) *f* = 13,2 Hz tot 100 Hz: versnelling ± 0,7 g. Functionele apparaten voor montage op
      verbrandingsmotoren of stuurmachines moeten als volgt worden getest: *f* = 2,0 tot 25 Hz; *a* = ± 1,6 mm (amplitude
      *a* = ½ slingerbreedte) *f* = 25 Hz tot 100 Hz; versnelling ± 4 g. Voelers voor montage in uitlaatgassenleidingen
      van verbrandingsmotoren kunnen worden blootgesteld aan beduidend hogere belastingen. Hiermee moet bij de tests
      rekening worden gehouden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.20
  - number: 10.20.4
    text: |-
      Tests van de elektromagnetische verdraagbaarheid moeten op basis van de Europese normen EN 61000-4-2 : 2009, EN
      61000-4-3 : 2010, EN 61000-4-4 : 2012, met het testniveau 3 worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.20
  - number: 10.20.5
    text: |-
      Het bewijs dat de apparaten voldoen aan deze testvoorwaarden moet door de fabrikant worden geleverd. Als bewijs
      geldt ook een verklaring van een erkend classificatiebureau.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.20
  - number: '10.21'
    text: |-
      Elektrische en elektronische installaties mogen niet door elektromagnetische verstoringen in hun functioneren
      worden gehinderd. Algemene maatregelen dienen betrekking te hebben op:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.21
  - number: 10.21.a)
    text: de ontkoppeling van de overdrachtswegen tussen de storingsbron en het aan storing blootstaande apparaat;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.21
  - number: 10.21.b)
    text: het onderdrukken van de stooroorzaken van de storingsbron;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.21
  - number: 10.21.c)
    text: de vermindering van de stoorgevoeligheid van het aan storing blootstaande apparaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel10.21
  - number: 13.01.1
    text: |-
      Schepen die voor het vervoer van goederen zijn bestemd, met uitzondering van zeeschipbakken met een lengte *L*
      van ten hoogste 40 m, moeten zijn uitgerust met boegankers, waarvan de totale massa *P* wordt berekend met behulp
      van de volgende formule: *P* = *k* • *B* • *T* [*kg*] In deze formule betekent: *k*: een coëfficiënt die rekening
      houdt met de verhouding tussen de lengte *L* en de breedte *B* en met het soort vaartuig: Voor duwbakken wordt *k*
      gelijkgesteld aan *c*; *c* een ervaringscoëfficiënt overeenkomstig de volgende tabel:






                      Laadvermogen [t]


                      Ervaringscoëfficiënt c






                      tot en met 400


                      45




                      400 tot en met 650


                      55




                      650 tot en met 1.000


                      65




                      meer dan 1.000


                      70




             De Commissie van deskundigen kan toestaan dat op schepen met een laadvermogen van ten hoogste 400 t, die
      vanwege hun constructie en bestemming slechts op bepaalde korte riviergedeelten worden ingezet, voor de boegankers
      slechts 2/3 van de totale massa *P* vereist is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.2.a)
    text: |-
      Passagiersschepen en schepen die niet bestemd zijn voor goederenvervoer, met uitzondering van duwboten, moeten zijn
      uitgerust met boegankers waarvan de totale massa *P* volgens de volgende formule wordt berekend: *P* • *k* • *B* •
      *T* [*kg*]
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.2.b)
    text: |-
      In afwijking van onderdeel a en rekening houdend met de in de lidstaten geldende politievoorschriften op sommige
      gedeelten van het vaarwater, voor passagiersschepen waarvoor de totale massa *P* van de boegankers is berekend
      volgens de volgende formule, moet in het binnenschipcertificaat onder nummer 52 worden vermeld dat de totale massa
      van de boegankers voldoet aan de voorschriften van artikel 13.01, tweede lid, onderdeel b: *P* • *k* • *B* • *T*
      + 4 *A* [*kg*] In deze formules betekent: *k* de coëfficiënt als bedoeld in het eerste lid; bij het vaststellen
      van de ervaringscoëfficiënt *c* moet evenwel de in het binnenschipcertificaat vermelde waterverplaatsing in m3 in
      plaats van het laadvermogen in aanmerking worden genomen; *A*  het frontale windvangend oppervlak in m2.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.3
    text: |-
      Schepen als bedoeld in lid 1 waarvan de grootste lengte *L* 86 m of minder bedraagt, moeten zijn uitgerust met
      hekankers waarvan de totale massa 25% bedraagt van de massa *P*. Schepen waarvan de grootste lengte *L* meer dan
      86 m bedraagt, moeten echter zijn uitgerust met hekankers waarvan de totale massa 50% bedraagt van de massa *P* als
      bedoeld in het eerste of het tweede lid. Geen hekankers behoeven te hebben:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.3.a)
    text: |-
      schepen waarvoor de totale massa van de hekankers minder dan 150 kg zou bedragen; voor schepen als bedoeld in het
      eerste lid, laatste alinea, moet daarbij worden uitgegaan van de gereduceerde massa van het boeganker;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.3.b)
    text: duwbakken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.4
    text: |-
      Schepen die zijn bestemd voor het voortbewegen van hechte samenstellen met een lengte *L* van niet meer dan
      86 m moeten zijn uitgerust met hekankers waarvan de totale massa 25% bedraagt van de grootste massa *P* die
      overeenkomstig het eerste lid wordt berekend voor de in het binnenschipcertificaat toegestane samenstellingen (als
      nautische eenheid beschouwd). Schepen die zijn bestemd voor het voortbewegen in afvaart van hechte samenstellen
      met een lengte *L* van meer dan 86 m moeten zijn uitgerust met hekankers waarvan de totale massa 50% bedraagt
      van de grootste massa *P* die overeenkomstig het eerste lid wordt berekend voor de in het binnenschipcertificaat
      toegestane samenstellingen (als nautische eenheid beschouwd).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.5
    text: |-
      De volgens het eerste tot en met het vierde lid berekende massa's van de ankers mogen bij bepaalde bijzondere
      ankers worden verminderd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.6
    text: |-
      De voor boegankers voorgeschreven totale massa *P* kan worden verdeeld over één of twee ankers. De totale massa
      mag 15% minder zijn, indien het schip slechts met één boeganker is uitgerust en de ankerkluis zich op hart schip
      bevindt. De voor hekankers voorgeschreven totale massa *P* mag bij duwboten en schepen met een lengte *L* van meer
      dan 86 m worden verdeeld over één of twee ankers. De massa van het lichtste anker mag niet minder dan 45% van deze
      totale massa bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.7
    text: Gietijzeren ankers zijn niet toegelaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.8
    text: Op ieder anker moet de massa duurzaam in letters en cijfers in reliëf zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.9
    text: Voor ankers met een massa van meer dan 50 kg zijn ankerlieren vereist.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.10
    text: 'Boegankerkettingen moeten ten minste de volgende lengte hebben:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.10.a)
    text: 40 m voor schepen met een lengte *L* van 30 m of minder;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.10.b)
    text: 10 m meer dan de lengte *L* van het schip, wanneer deze tussen 30 en 50 m ligt;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.10.c)
    text: 60 m voor schepen met een lengte *L* van meer dan 50 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.11
    text: 'De minimumbreeksterkte *R* van een ankerketting wordt met behulp van de volgende formules berekend:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.11.a)
    text: 'bij ankers met een massa tot en met 500 kg: *R* = 0,35 • *P''* [*kN*]'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.11.b)
    text: 'bij ankers met een massa van meer dan 500 t/m 2.000 kg:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.11.c)
    text: |-
      bij ankers met een massa van meer dan 2.000 kg: *R* = 0,25 • *P'* [*kN*] In deze formules betekent: *P'*:
      de overeenkomstig het eerste tot en met het vierde lid en het zesde lid bepaalde theoretische massa van het
      betreffende anker. De breeksterkte van de ankerkettingen wordt bepaald aan de hand van de daarvoor in een van de
      lidstaten geldende normen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.12
    text: |-
      Indien zwaardere ankers worden gekozen dan in het eerste tot en met het zesde lid beschreven, wordt de
      minimumbreeksterkte van de ankerketting bepaald aan de hand van de gegeven grotere massa. Indien dergelijke
      zwaardere ankers en de bijbehorende sterkere ankerkettingen aan boord zijn, moeten desondanks in het
      binnenschipcertificaat de massa's en de minimumbreeksterkte worden ingevuld die zijn voorgeschreven op grond van
      het eerste tot en met zesde lid en het elfde lid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.13
    text: |-
      De verbindingsdelen (wartels) tussen het anker en de ketting moeten bestand zijn tegen een trekkracht die 20%
      groter is dan de breeksterkte van de dienovereenkomstige ketting.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.01.14
    text: |-
      Het gebruik van trossen of kabels in plaats van kettingen is toegestaan. Deze moeten dezelfde breeksterkte hebben
      die voor de kettingen is voorgeschreven, maar hun lengte moet 20% meer bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.01
  - number: 13.02.1
    text: |-
      Ten minste de volgende uitrustingsstukken overeenkomstig de in één van de lidstaten van kracht zijnde
      scheepvaartpolitiereglementen moeten aan boord aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.1.a)
    text: marifooninstallatie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.1.b)
    text: |-
      apparaten en installaties die nodig zijn voor het geven van de voorgeschreven licht- en geluidsseinen, alsmede voor
      het voeren en tonen van de optische tekens;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.1.c)
    text: |-
      onafhankelijk van het aan boord aanwezige elektriciteitsnet werkende lichten ter vervanging van de voor het
      stilliggen voorgeschreven lichten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.2
    text: 'Bovendien moeten ten minste de volgende verzamelreservoirs aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.2.a)
    text: als zodanig aangeduide verzamelreservoirs voor huisvuil;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.2.b)
    text: |-
      een als zodanig aangeduid verzamelreservoir van staal of van ander stootvast brandbestendig materiaal met
      sluitend deksel van voldoende grootte, maar ten minste 10 liter inhoud, voor het verzamelen van: aa) oliehoudende
      poetslappen; bb) vast klein chemisch afval; cc) vloeibaar klein chemisch afval; en, voor zover dit geproduceerd kan
      worden, voor het verzamelen van dd) slops; ee) overig vethoudend scheepsbedrijfsafval.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.3
    text: 'Voorts moeten ten minste aanwezig zijn:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.3.a)
    text: |-
      stalen trossen voor het meren: Ieder schip moet zijn uitgerust met 3 stalen trossen voor het meren. De
      minimumlengte daarvan moet bedragen: 1ste tros: *L* + 20 *m*, echter niet meer dan 100 m, 2de tros: 2/3 van de
      eerste tros, 3de tros: 1/3 van de eerste tros. Bij schepen met een lengte *L* van minder dan 20 m kan de kortste
      tros achterwege blijven. Deze trossen moeten berekend zijn op een minimumbreeksterkte *Rs* die met behulp van de
      volgende formule wordt vastgesteld: Voor de voorgeschreven stalen trossen moet zich een keuringsbewijs volgens
      de Europese norm EN 10204 : 2004, model 3.1, aan boord bevinden. Deze trossen mogen worden vervangen door andere
      kabels van dezelfde lengte en met dezelfde breeksterkte. De minimumbreeksterkte voor deze kabels moet in een
      verklaring worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.3.b)
    text: |-
      trossen voor het slepen: Sleepboten moeten zijn uitgerust met een bij hun functie passend aantal trossen. De
      hoofdtros moet echter ten minste 100 m lang zijn en een breeksterkte hebben in kN die overeenkomt met ten minste
      een derde van het totale vermogen in kW van de voortstuwingsmotor(en). Motorschepen en duwboten die mogen slepen
      moeten ten minste zijn uitgerust met een sleeptros van 100 m lengte, waarvan de breeksterkte in kN overeenkomt met
      ten minste een kwart van het totale vermogen in kW van de voortstuwingsmotor(en);
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.3.c)
    text: een werplijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.3.d)
    text: |-
      een loopplank, ten minste 0,40 m breed en ten minste 4 m lang, waarvan de zijkanten door een lichte streep zijn
      gemarkeerd; deze loopplank moet van een leuning zijn voorzien. Voor kleine schepen kan de Commissie van deskundigen
      kortere loopplanken toelaten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.3.e)
    text: een bootshaak;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.3.f)
    text: |-
      een geschikte verbandtrommel met een inhoud overeenkomstig een norm van een van de lidstaten. De verbandtrommel
      moet in een verblijf of in het stuurhuis worden bewaard en zo zijn opgeborgen dat hij indien nodig gemakkelijk en
      zeker kan worden bereikt. Indien verbandtrommels aan het zicht zijn onttrokken moet de afdekking zijn gemarkeerd
      met een symbool voor verbandtrommels overeenkomstig schets 8 van bijlage 4 met een lengte van de zijde van ten
      minste 10 cm;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.3.g)
    text: een verrekijker, 7 x 50 of een grotere lensdiameter;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.3.h)
    text: een bord met aanwijzingen betreffende het redden en het bijbrengen van drenkelingen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.3.i)
    text: een vanaf de stuurstelling bedienbare schijnwerper.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.02.4
    text: |-
      Op schepen waarvan de hoogte van het boord boven de waterlijn bij ledig schip meer dan 1,50 m bedraagt moet een
      buitenboordtrap of -ladder aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.02
  - number: 13.03.1
    text: |-
      Op de volgende plaatsen moet telkens één draagbaar blustoestel overeenkomstig de Europese normen EN 3-7 : 2007 en
      EN 3-8 : 2007 aanwezig zijn:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.03
  - number: 13.03.1.a)
    text: in het stuurhuis;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.03
  - number: 13.03.1.b)
    text: in de nabijheid van iedere toegang van het dek naar de verblijven;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.03
  - number: 13.03.1.c)
    text: |-
      in de nabijheid van iedere toegang tot niet van de verblijven uit toegankelijke bedrijfsruimten waarin zich
      verwarmings-, kook-, of koelinstallaties bevinden, die op vaste of vloeibare brandstoffen werken dan wel op
      vloeibaar gas;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.03
  - number: 13.03.1.d)
    text: bij iedere toegang tot machinekamers of ketelruimen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.03
  - number: 13.03.1.e)
    text: |-
      op geschikte plaatsen benedendeks in de machinekamers en ketelruimen, en wel zodanig dat de afstand tot een
      brandblusapparaat vanaf geen enkel punt van deze ruimten meer dan tien meter bedraagt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.03
  - number: 13.03.2
    text: |-
      Als draagbare blustoestellen, voorgeschreven in lid 1, mogen slechts poederblussers worden gebruikt met een inhoud
      van ten minste 6 kg dan wel andere draagbare blustoestellen met eenzelfde bluscapaciteit. Zij moeten geschikt
      zijn voor de brandklassen A, B en C. Afwijkend daarvan zijn op schepen waarop geen vloeibaargasinstallaties zijn
      geïnstalleerd, sproeischuimbrandblussers met tot – 20 °C vorstvrije blusmiddelen bestaande uit water met AFFF-
      AR-schuim (Aqua Film Forming Foam) toegestaan, ook wanneer deze niet voor de brandklasse C geschikt zijn. De
      minimuminhoud van deze brandblussers moet 9 liter bedragen. Alle brandblussers moeten voor het blussen van branden
      in elektrische installaties tot 1.000 V geschikt zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.03
  - number: 13.03.3
    text: |-
      Daarnaast mogen poederblussers, blussers met vloeibare inhoud of schuimblussers worden gebruikt indien deze
      ten minste geschikt zijn voor die brandklasse, welke in de ruimte waarvoor het toestel bestemd is het meest
      waarschijnlijk is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.03
  - number: 13.03.4
    text: |-
      Draagbare blustoestellen die als blusmiddel CO bevatten mogen slechts voor het blussen van branden in keukens en
      elektrische inrichtingen worden aangewend. De inhoud van deze blustoestellen mag niet meer bedragen dan 1 kg voor
      iedere 15 m3 van de ruimte waarin zij worden bewaard en gebruikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.03
  - number: 13.03.5
    text: |-
      Draagbare blustoestellen moeten ten minste iedere twee jaar door een deskundige worden gekeurd. Hiervan moet een
      kenmerking op het blustoestel worden aangebracht, ondertekend door de deskundige die de keuring heeft verricht, en
      waarop de datum van de keuring is aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.03
  - number: 13.03.6
    text: |-
      Wanneer draagbare blustoestellen door hun wijze van opstelling aan het gezicht zijn onttrokken moet de bedekking
      of afscherming zijn voorzien van een teken ‘brandblusapparaat’ met een lengte van de zijde van ten minste 10 cm,
      overeenkomstig schets 3 van bijlage 4.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.03
  - number: 13.04.1
    text: |-
      In verblijven, stuurhuizen en passagiersruimten mogen, ter bescherming van deze ruimten, slechts geschikte,
      automatisch werkende sprinklerinstallaties als vast ingebouwde brandblusinstallaties worden geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.2
    text: Deze installaties mogen slechts door deskundige bedrijven worden ingebouwd of omgebouwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.3
    text: Deze installaties moeten van staal of van gelijkwaardig niet brandbaar materiaal zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.4
    text: |-
      Deze installaties moeten over de oppervlakken van de grootste te beschermen ruimte ten minste een hoeveelheid water
      van 5 l/m2 per minuut kunnen sproeien.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.5
    text: |-
      Installaties die een kleinere hoeveelheid water sproeien moeten beschikken over een typegoedkeuring op grond van de
      IMO-Resolutie A.800 (19) of een andere door één van de lidstaten erkende norm. De typegoedkeuring wordt uitgevoerd
      door een erkend classificatiebureau of door een gemachtigde testinstelling. De gemachtigde testinstelling moet
      voldoen aan de Europese norm EN ISO/IEC 17025 : 2005.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.6
    text: 'De installaties moeten door een erkend deskundige worden gekeurd:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.6.a)
    text: vóór de eerste ingebruikstelling;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.6.b)
    text: vóór een hernieuwde ingebruikstelling na in werking te zijn geweest;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.6.c)
    text: vóór een hernieuwde ingebruikstelling na een wezenlijke verandering of reparatie, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.6.d)
    text: met regelmaat en ten minste elke twee jaar.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.7
    text: |-
      Bij de keuring, bedoeld in het zesde lid, moet de erkend deskundige of deskundige controleren of de installaties
      aan de eisen van dit artikel voldoen. De keuring moet ten minste bestaan uit:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.7.a)
    text: inspectie van de buitenkant van de installatie als geheel;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.7.b)
    text: controle van de bedrijfszekerheid van de veiligheidssystemen en de sproeikoppen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.7.c)
    text: controle van het systeem van druktanks en pompen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.8
    text: |-
      Met betrekking tot de keuring moet een door de erkend deskundige of deskundige ondertekende verklaring worden
      opgesteld waaruit de datum van de keuring blijkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.04.9
    text: Het aantal van de aanwezige installaties moet in het binnenschipcertificaat worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.04
  - number: 13.05.1
    text: |-
      Blusmiddelen In machinekamers, ketelruimen en pompkamers mogen, ter bescherming van deze ruimten, in vast
      ingebouwde brandblusinstallaties de volgende blusmiddelen worden gebruikt:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.1.a)
    text: CO (koolstofdioxide);
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.1.b)
    text: HFC-227ea (heptafluorpropaan);
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.1.c)
    text: IG-541 (52% stikstof, 40% argon, 8% koolstofdioxide);
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.1.d)
    text: FK-5-1-12 (dodecafluoro-2-methylpentane-3-on);
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.1.e)
    text: water.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.2
    text: Ventilatie, luchtaanzuiging
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.2.a)
    text: |-
      Verbrandingslucht voor de voor de vaart benodigde verbrandingsmotoren mag niet worden aangezogen uit door vast
      ingebouwde brandblusinstallaties te beschermen ruimten. Dit is niet van toepassing wanneer er twee van elkaar
      onafhankelijke, gasdicht gescheiden hoofdmachinekamers aanwezig zijn dan wel er naast de hoofdmachinekamer
      een boegbesturingsaandrijving in een aparte machinekamer beschikbaar is, waardoor in geval van brand in de
      hoofdmachinekamer het voortbewegen op eigen kracht wordt verzekerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.2.b)
    text: |-
      Een mechanische ventilatie van de te beschermen ruimte, indien aanwezig, moet bij het in werking stellen van de
      brandblusinstallatie automatisch worden uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.2.c)
    text: |-
      Er moeten middelen beschikbaar zijn waarmee alle openingen, waardoor lucht zou kunnen toetreden tot, dan wel gas
      zou kunnen ontsnappen uit de te beschermen ruimte, snel kunnen worden gesloten. De gesloten toestand moet duidelijk
      herkenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.2.d)
    text: |-
      De lucht die via de overdrukventielen uit in de machinekamers geïnstalleerde persluchthouders stroomt moet naar
      buiten worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.2.e)
    text: |-
      De bij het binnenstromen van het blusmiddel ontstane over- of onderdruk mag de essentiële onderdelen van de te
      beschermen ruimte niet vernielen. De compensatie van de druk moet zonder gevaar kunnen geschieden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.2.f)
    text: |-
      Beschermde ruimten moeten beschikken over een mogelijkheid om het blusmiddel en het brandgas af te zuigen.
      Dergelijke afzuiginrichtingen moeten vanaf een plek buiten de beschermde ruimten kunnen worden bediend. Die
      plek mag door een brand in die ruimten niet ontoegankelijk worden. Indien vast geïnstalleerde afzuiginrichtingen
      aanwezig zijn, mogen deze tijdens het blussen niet kunnen worden ingeschakeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.3
    text: |-
      Brandmeldsysteem De te beschermen ruimte moet voorzien zijn van een doelmatig brandmeldsysteem. De brandmelding
      moet in het stuurhuis, in de verblijven en in de te beschermen ruimte kunnen worden waargenomen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.4
    text: Pijpleidingensysteem
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.4.a)
    text: |-
      Het blusmiddel moet door een vast geïnstalleerd pijpleidingenstelsel naar de te beschermen ruimte worden toegevoerd
      en daarin worden verdeeld. In de te beschermen ruimte moeten de pijpleidingen en de daarbij behorende armaturen
      van staal zijn vervaardigd. Dit geldt niet voor de aansluitleidingen van de houders en de compensatoren indien
      de daarvoor gebruikte materialen met betrekking tot brand over gelijkwaardige eigenschappen beschikken. De
      pijpleidingen moeten zowel in- als uitwendig tegen corrosie beschermd zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.4.b)
    text: |-
      De sproeikoppen moeten zodanig van afmeting zijn en zodanig zijn aangebracht dat het blusmiddel gelijkmatig wordt
      verdeeld. In het bijzonder moet het blusmiddel ook onder de vloerplaten werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5
    text: Inrichting voor het in werking stellen
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.a)
    text: Brandblusinstallaties die automatisch in werking worden gesteld zijn niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.b)
    text: |-
      De brandblusinstallatie moet vanaf een geschikte plaats buiten de te beschermen ruimte in werking kunnen worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.c)
    text: |-
      Inrichtingen voor het in werking stellen moeten zodanig zijn geïnstalleerd dat ze ook in geval van brand kunnen
      worden bediend en dat, in het geval van een beschadiging als gevolg van brand of explosie in de te beschermen
      ruimte, de daarvoor benodigde hoeveelheid blusmiddel nog kan worden toegevoerd. Niet mechanische inrichtingen voor
      het in werking stellen moeten door twee verschillende van elkaar onafhankelijke energiebronnen worden gevoed. Deze
      energiebronnen moeten zich buiten de te beschermen ruimte bevinden. Leidingen voor de aansturing in de beschermde
      ruimte moeten zodanig zijn uitgevoerd, dat zij in geval van brand ten minste gedurende 30 minuten kunnen blijven
      functioneren. Elektrische leidingen voldoen aan deze eis indien zij voldoen aan de internationale norm IEC 60331-
      21 : 1999. Wanneer inrichtingen voor het in werking stellen door hun wijze van opstelling aan het gezicht zijn
      onttrokken moet de bedekking of afscherming zijn voorzien van een teken ‘brandblusinstallatie’ met een lengte
      van de zijde van ten minste 10 cm, overeenkomstig schets 6 van bijlage 4, alsmede van de volgende tekst in rode
      letters op witte ondergrond: „Feuerlöscheinrichtung Installation d'extinction Brandblusinstallatie Fire-fighting
      installation’.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.d)
    text: |-
      Indien de brandblusinstallatie bedoeld is voor het beschermen van meerdere ruimten, moeten de inrichtingen voor het
      in werking stellen voor iedere ruimte gescheiden en duidelijk zijn gemarkeerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.e)
    text: de handelwijze van de bemanning in het geval van een storing in de brandblusinstallatie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.e).aa)
    text: |-
      Bij iedere inrichting voor het in werking stellen moet een gebruiksaanwijzing in een officiële taal van een van
      de lidstaten duidelijk zichtbaar en duurzaam uitgevoerd zijn aangebracht. Deze moet met name informatie bevatten
      inzake
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.e).bb)
    text: het in werking stellen van de brandblusinstallatie;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.e).cc)
    text: de noodzaak van de controle dat alle personen de te beschermen ruimte hebben verlaten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.e).dd)
    text: |-
      de handelswijze van de bemanning bij het in werking stellen van de brandblusinstallatie en wanneer zij de
      beschermde ruimte betreden na het in werking stellen van de installatie of na het uitstromen van het blusmiddel, in
      het bijzonder met betrekking tot de mogelijke aanwezigheid van gevaarlijke substanties;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.f)
    text: |-
      De gebruiksaanwijzing moet erop wijzen dat vóór het in werking stellen van de brandblusinstallatie de in de ruimte
      aanwezige verbrandingsmotoren die lucht aanzuigen uit de te beschermen ruimte buiten bedrijf moeten worden gesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.6
    text: Waarschuwingssysteem
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.6.a)
    text: Vast ingebouwde brandblusinstallaties moeten zijn voorzien van een waarschuwingssysteem.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.6.b)
    text: |-
      Het waarschuwingssysteem moet automatisch gaan werken bij de eerste handeling voor het in werking stellen van
      de brandblusinstallatie. Het waarschuwingssignaal moet gedurende een redelijke tijd vóór het vrijkomen van het
      blusmiddel klinken en mag niet kunnen worden uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.6.c)
    text: |-
      De waarschuwingssignalen moeten in de te beschermen ruimten alsmede bij iedere toegang daartoe duidelijk
      zichtbaar zijn en ook onder de bedrijfsomstandigheden, waarbij aldaar het meeste geluid wordt geproduceerd,
      duidelijk hoorbaar zijn. Zij moeten in de te beschermen ruimte duidelijk van alle andere akoestische en optische
      waarschuwingssignalen te onderscheiden zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.6.d)
    text: |-
      De akoestische waarschuwingssignalen moeten, ook wanneer de verbindingsdeuren gesloten zijn, onder de
      bedrijfsomstandigheden waarbij aldaar het meeste geluid wordt geproduceerd in de ernaast gelegen ruimten duidelijk
      hoorbaar zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.6.e)
    text: |-
      Indien het waarschuwingssysteem niet van een eigen controlesysteem terzake van kortsluiting, draadbreuk en
      spanningsvermindering is voorzien, moet het functioneren ervan kunnen worden getest.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.6.f)
    text: |-
      Bij iedere ingang van een ruimte, die met blusmiddel kan worden gevuld, moet duidelijk zichtbaar een bord zijn
      aangebracht met daarop in rode letters op witte ondergrond de volgende tekst: ‘Vorsicht, Feuerlöscheinrichtung! Bei
      Ertönen des Warnsignals (Beschreibung des Signals) den Raum sofort verlassen! Attention, installation d'extinction
      d'incendie! Quitter immédiatement ce local au signal (description du signal)! Let op, brandblusinstallatie! Bij het
      in werking treden van het alarmsignaal (omschrijving van het signaal) deze ruimte onmiddellijk verlaten! Warning,
      fire-fighting installation! Leave the room as soon as the warning signal sounds (description of signal)!’.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.7
    text: Drukhouders, armaturen en persleidingen
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.7.a)
    text: Drukhouders, armaturen en persleidingen moeten voldoen aan de in een van de lidstaten geldende voorschriften.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.7.b)
    text: Drukhouders moeten volgens de indicaties van de fabrikant zijn geïnstalleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.7.c)
    text: Drukhouders, armaturen en persleidingen mogen niet in verblijven geïnstalleerd zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.7.d)
    text: De temperatuur in de kasten of ruimten waarin drukhouders zijn opgesteld mag niet meer bedragen dan 50 °C.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.7.e)
    text: |-
      Kasten of ruimten aan dek moeten vast aan het dek bevestigd zijn en voorzien zijn van ventilatieopeningen, die zo
      zijn aangebracht dat, in geval de drukhouders niet dicht zijn, geen ontsnappend gas in het binnenste van het schip
      kan doordringen. Directe verbindingen met andere ruimten zijn niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.8
    text: |-
      Hoeveelheid van het blusmiddel Indien de hoeveelheid blusmiddel bedoeld is voor het beschermen van meer dan één
      ruimte, behoeft de totale hoeveelheid van het beschikbare blusmiddel niet meer te zijn dan de hoeveelheid die nodig
      is voor de grootste te beschermen ruimte.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9
    text: Installatie, controle en documentatie
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.a)
    text: |-
      De installatie mag slechts worden geïnstalleerd of omgebouwd door een bedrijf dat deskundig is op het gebied van
      brandblusinstallaties. De documentatie (folders met gegevens van het product en met de veiligheidsgegevens) van de
      fabrikant van het blusmiddel en de fabrikant van de installatie moeten in acht worden genomen. De installatie, en
      met name de toestand van de sproeikoppen, moet regelmatig overeenkomstig de aanwijzingen van de fabrikant van de
      installatie of van het brandblusmiddel (technische gegevensbladen) worden onderhouden en gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.b)
    text: 'de installatie moet door een erkend deskundige worden gekeurd:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.b).aa)
    text: vóór de eerste ingebruikstelling;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.b).bb)
    text: vóór een hernieuwde ingebruikstelling na in werking te zijn geweest;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.b).cc)
    text: vóór een hernieuwde ingebruikstelling na een wezenlijke verandering of reparatie, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.b).dd)
    text: |-
      met regelmaat en ten minste elke twee jaar. Keuringen overeenkomstig onderdeel dd kunnen ook worden uitgevoerd door
      een deskundige van een bedrijf dat deskundig is op het gebied van brandblusinstallaties.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.c)
    text: |-
      Bij de keuring moet de erkend deskundige of de deskundige controleren of de installatie aan de eisen van dit
      artikel voldoet.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.d)
    text: 'De keuring moet ten minste betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.d).aa)
    text: uitwendige inspectie van de installatie als geheel;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.d).bb)
    text: test van de pijpleidingen op hun dichtheid;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.d).cc)
    text: controle van de bedrijfszekerheid van de bedieningssystemen en de systemen voor het in werking stellen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.d).dd)
    text: controle van de druk in de houders alsmede de inhoud daarvan;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.d).ee)
    text: controle van de dichtheid en van de afsluitinrichtingen van de te beschermen ruimte;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.d).ff)
    text: test van het brandmeldingssysteem, alsmede
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.d).gg)
    text: test van het waarschuwingssysteem.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.e)
    text: |-
      Inzake de keuring moet een door de erkend deskundige ondertekende verklaring worden opgesteld waaruit de datum van
      de keuring blijkt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.9.f)
    text: Het aantal aanwezige vast ingebouwde brandblusinstallaties moet in het binnenschipcertificaat worden aangetekend.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.10
    text: |-
      Brandblusinstallaties met CO Brandblusinstallaties die met CO als blusmiddel werken moeten, behalve aan de eisen,
      bedoeld in het eerste tot en met negende lid, aan de volgende bepalingen voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.10.a)
    text: |-
      CO-houders moeten buiten de te beschermen ruimte in een van de overige ruimten gasdicht gescheiden ruimte of
      kast zijn ondergebracht. De deuren van de ruimten waar ze opgesteld zijn of van de kasten moeten naar buiten
      openen, afsluitbaar zijn en aan de buitenkant zijn voorzien van een teken ‘Waarschuwing voor algemeen gevaar’
      overeenkomstig schets 4 van bijlage 4 met een hoogte van ten minste 5 cm alsmede van het bijkomend opschrift ‘CO’
      in dezelfde kleur en met dezelfde hoogte.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.10.b)
    text: |-
      De benedendekse ruimten waar CO-houders zijn opgesteld mogen slechts van buitenaf toegankelijk zijn. Deze ruimten
      moeten over een eigen, van de andere ventilatiesystemen aan boord volledig gescheiden, voldoende kunstmatige
      ventilatie met afzuigkanalen beschikken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.10.c)
    text: |-
      De vulgraad van met CO gevulde houders mag niet meer zijn dan 0,75 kg/l. Voor het volume van het uitgestroomde CO-
      gas moet worden uitgegaan van 0,56 m3/kg.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.10.d)
    text: |-
      De hoeveelheid CO-gas benodigd voor het beschermen van een ruimte moet ten minste 40% van de bruto inhoud van die
      ruimte bedragen. Deze hoeveelheid moet binnen 120 seconden kunnen worden toegevoerd. Het moet controleerbaar zijn
      of het gas is toegevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.10.e)
    text: |-
      Het openen van de ventielen van de houders en het bedienen van het ventiel waardoor het gas uitstroomt moet door
      gescheiden handelingen geschieden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.10.f)
    text: |-
      De redelijke tijd, bedoeld in het zesde lid, onderdeel b, moet ten minste 20 seconden bedragen. De vertraging tot
      aan het vrijkomen van het CO-gas moet zijn gegarandeerd door een betrouwbare inrichting.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.11
    text: |-
      Brandblusinstallaties met HFC-227ea Brandblusinstallaties die werken met HFC-227ea als blusmiddel moeten, behalve
      aan de eisen, bedoeld in het eerste tot en met negende lid, aan de volgende bepalingen voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.11.a)
    text: |-
      Indien er sprake is van meerdere te beschermen ruimten met een verschillende bruto inhoud, moet iedere ruimte
      voorzien zijn van een eigen brandblusinstallatie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.11.b)
    text: |-
      Iedere houder die HFC-227ea bevat en in de te beschermen ruimte is opgesteld moet voorzien zijn van een
      overdrukventiel. Deze moet ervoor zorgen dat de inhoud van de houder zonder gevaar in de te beschermen ruimte
      stroomt, wanneer de houder aan de invloed van brand is blootgesteld en de brandblusinstallatie niet in werking
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.11.c)
    text: Iedere houder moet zijn uitgerust met een inrichting waardoor de gasdruk kan worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.11.d)
    text: |-
      De vulgraad van de houders mag niet meer zijn dan 1,15 kg/l. Voor het volume van het uitgestroomde HFC-227ea moet
      worden uitgegaan van 0,1374 m3/kg.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.11.e)
    text: |-
      De hoeveelheid HFC-227ea voor de te beschermen ruimte moet ten minste 8% van het bruto volume van die ruimte
      bedragen. Deze hoeveelheid moet binnen 10 seconden toegevoerd zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.11.f)
    text: |-
      De houders van HFC-227ea moeten voorzien zijn van een controlesysteem van de druk dat bij een ontoelaatbaar verlies
      van drijfgas een akoestisch en optisch alarmsignaal in het stuurhuis in werking stelt. Wanneer er geen sprake is
      van een stuurhuis moet het alarmsignaal buiten de te beschermen ruimte in werking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.11.g)
    text: Na het uitstromen van het blusmiddel mag de concentratie in de te beschermen ruimte niet groter zijn dan 10,5%.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.11.h)
    text: De brandblusinstallatie mag geen enkel onderdeel uit aluminium bevatten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.12
    text: |-
      Brandblusinstallaties met IG-541 Brandblusinstallaties die werken met IG-541 als blusmiddel moeten, behalve aan de
      eisen, bedoeld in het eerste tot en met negende lid, aan de volgende bepalingen voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.12.a)
    text: |-
      Indien er sprake is van meerdere te beschermen ruimten met een verschillende bruto inhoud, moet iedere ruimte
      voorzien zijn van een eigen brandblusinstallatie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.12.b)
    text: |-
      Iedere houder die IG-541 bevat en in de te beschermen ruimte is opgesteld moet voorzien zijn van een
      overdrukventiel. Deze moet ervoor zorgen dat de inhoud van de houder zonder gevaar in de te beschermen ruimte
      stroomt, wanneer de houder aan de invloed van brand is blootgesteld en de brandblusinstallatie niet in werking
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.12.c)
    text: Iedere houder moet zijn uitgerust met een inrichting waarmee de gasdruk kan worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.12.d)
    text: De druk waaronder de houders zijn gevuld mag bij + 15 °C niet meer bedragen dan 200 bar.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.12.e)
    text: |-
      De hoeveelheid IG-541 voor de te beschermen ruimte moet ten minste 44% en niet meer dan 50% van het bruto volume
      van die ruimte bedragen. Deze hoeveelheid moet binnen 120 seconden toegevoerd zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.13
    text: |-
      Brandblusinstallaties met FK-5-1-12 Brandblusinstallaties die werken met FK-5-1-12 als blusmiddel moeten, behalve
      aan de eisen bedoeld in het eerste tot en met negende lid, aan de volgende bepalingen voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.13.a)
    text: |-
      Indien er sprake is van meerdere te beschermen ruimten met een verschillende bruto inhoud, moet iedere ruimte
      voorzien zijn van een eigen brandblusinstallatie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.13.b)
    text: |-
      Iedere houder die FK-5-1-12 bevat en in de te beschermen ruimte is opgesteld moet voorzien zijn van een
      overdrukventiel. Deze moet ervoor zorgen dat de inhoud van de houder zonder gevaar in de te beschermen ruimte
      stroomt, wanneer de houder aan de invloed van de brand is blootgesteld en de brandblusinstallatie niet in werking
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.13.c)
    text: Iedere houder moet zijn uitgerust met een inrichting waarmee de gasdruk kan worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.13.d)
    text: |-
      De vulgraad van de houders mag niet meer zijn dan 1,00 kg/l. Voor het specifieke volume van het uitgestroomde FK-5-
      1-12 moet 0,0719 m3/kg genomen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.13.e)
    text: |-
      Het volume FK-5-1-12 in de te beschermen ruimte moet minstens 5,5% van het bruto volume van die ruimte bedragen.
      Deze hoeveelheid moet binnen 10 seconden toegevoerd zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.13.f)
    text: |-
      De houders van FK-5-1-12 moeten voorzien zijn van een controlesysteem van de druk dat bij een ontoelaatbaar verlies
      van drijfgas een akoestisch en optisch alarmsignaal in het stuurhuis in werking stelt. Wanneer er geen sprake is
      van een stuurhuis moet het alarmsignaal buiten de te beschermen ruimte in werking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.13.g)
    text: Na het uitstromen van het blusmiddel mag de concentratie in de te beschermen ruimte niet groter zijn dan 10,0%.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.14
    text: |-
      Brandblusinstallaties met water als brandblusmiddel De brandblusinstallaties die gebruik maken van water als
      brandblusmiddel mogen dit water uitsluitend in de vorm van verneveld water in de te beschermen ruimte afgeven. De
      druppelgrootte moet 5 tot 300 micrometer bedragen. De bedoelde brandblusinstallaties moeten behalve aan de eisen
      bedoeld in het eerste tot en met zevende lid en in het negende lid, aan de volgende eisen voldoen, waarbij het
      achtste lid van overeenkomstige toepassing is:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.14.a)
    text: |-
      Brandblusinstallaties moeten beschikken over een typegoedkeuring op grond van MSC/Circ. 1165 of een andere door één
      van de lidstaten erkende norm. De typegoedkeuring wordt uitgevoerd door een erkend classificatiebureau of door een
      gemachtigde testinstelling. De gemachtigde testinstelling moet voldoen aan de Europese normen inzake de algemene
      eisen aan de kundigheid van test- en kalibreerlaboratoria (EN ISO/IEC 17025 : 2005).
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.14.b)
    text: |-
      De brandblusinstallatie moet overeenkomstig de afmetingen van de grootste te beschermen ruimte gedimensioneerd zijn
      en het water gedurende ten minste 30 minuten continu in de ruimte kunnen sproeien.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.14.c)
    text: |-
      De pompen, hun schakelinrichtingen en de ventielen die nodig zijn voor de werking van de installatie moeten in een
      ruimte buiten de te beschermen ruimten worden geïnstalleerd. De ruimte waarin zij zich bevinden, moet gescheiden
      zijn van daarnaast gelegen ruimten door scheidingsvlakken van ten minste type A30.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.14.d)
    text: |-
      De brandblusinstallatie moet ten minste tot aan de inschakelventielen permanent volledig met water gevuld zijn en
      onder de vereiste bedrijfsdruk staan. De pompen voor de watertoevoer moeten bij een inschakeling van de installatie
      automatisch in werking treden. De installatie moet continu met water worden gevoed. De installatie moet beschermd
      zijn tegen verontreinigingen die het functioneren kunnen belemmeren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.14.e)
    text: |-
      Het leidingsysteem van de installatie moet zijn gedimensioneerd aan de hand van een hydraulische
      berekeningsmethode.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.14.f)
    text: |-
      Het aantal en de plaatsing van de sproeikoppen moeten een toereikende verspreiding van het water in de te
      beschermen ruimten garanderen. De installatie van de sproeikoppen moet de verspreiding van het vernevelde water in
      de totale te beschermen ruimte garanderen, in het bijzonder op plaatsen met een verhoogd brandrisico, ook achter de
      installaties en onder de vloerplaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.14.g)
    text: |-
      De elektrische componenten van de brandblusinstallatie in de te beschermen ruimte moeten ten minste voldoen aan
      de beschermingsklasse IP54. Het systeem moet over twee onafhankelijke energiebronnen met automatische schakeling
      beschikken. Eén van de energiebronnen moet zich buiten de te beschermen ruimte bevinden. Elke energiebron moet de
      installatie op eigen kracht kunnen aandrijven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.14.h)
    text: De brandblusinstallatie moet zijn voorzien van redundante pompen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.14.i)
    text: |-
      De brandblusinstallatie moet zijn uitgerust met een controlesysteem dat in de volgende gevallen een alarmsignaal in
      het stuurhuis in werking kan stellen: - laag peil in de watertank (indien aanwezig),
        - wegvallen van de stroom,
        - drukverlaging in de leidingen van de lagedrukinstallatie,
        - drukverlaging in het hogedrukcircuit,
        - bij de inschakeling van de installatie.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: 13.05.5.14.j)
    text: |-
      De benodigde documenten voor de installatie, de controle en de documentatie van de installatie zoals bedoeld
      in het negende lid, moeten ten minste omvatten: - een algemeen overzicht van het systeem met vermelding van de
      leidingsecties en de soorten sproeikoppen,
        - de hydraulische berekening bedoeld onder letter d,
        - de technische documentatie van de fabrikant met alle componenten van de installatie,
        - de onderhoudshandleiding.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.05
  - number: '13.06'
    text: Voor de bescherming van objecten zijn vast ingebouwde brandblusinstallaties verboden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.06
  - number: 13.07.1
    text: 'De volgende vaartuigen moeten met een bijboot overeenkomstig de Europese norm EN 1914 : 2016, zijn uitgerust:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.07
  - number: 13.07.1.a)
    text: motorschepen en sleepschepen met een laadvermogen van meer dan 150 t;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.07
  - number: 13.07.1.b)
    text: sleepboten en duwboten met een waterverplaatsing van meer dan 150 m3;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.07
  - number: 13.07.1.c)
    text: drijvende werktuigen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.07
  - number: 13.07.1.d)
    text: passagiersschepen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.07
  - number: 13.07.2
    text: |-
      Bijboten moeten binnen 5 minuten, te rekenen vanaf de eerste daartoe noodzakelijke handeling, door één persoon
      veilig te water kunnen worden gelaten. Indien zij door middel van een door een motor aangedreven inrichting te
      water worden gelaten, moet deze zo zijn ingericht dat uitvallen van de energietoevoer het snel en veilig te water
      laten niet kan verhinderen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.07
  - number: 13.07.3
    text: Opblaasbare bijboten moeten zijn getest overeenkomstig de instructies van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.07
  - number: 13.08.1
    text: |-
      Aan boord van vaartuigen moeten ten minste drie reddingsboeien aanwezig zijn, die - aan de Europese norm EN 14144 :
      2003, of
        - aan het Internationaal Verdrag van 1974 voor de beveiliging van mensenlevens op zee (Solas 1974), Hoofdstuk
      III, Regel 7.1, en aan de internationale code betreffende de reddingsmiddelen (LSA), paragraaf 2.1 voldoen. Ze
      moeten zich in gebruiksklare toestand op vaste en daarvoor geschikte plaatsen aan dek bevinden en mogen niet zijn
      vastgemaakt aan de houders. Ten minste één reddingsboei moet zich in de onmiddellijke nabijheid van het stuurhuis
      bevinden en deze moet zijn voorzien van een automatisch ontbrandend licht, gevoed door batterijen, dat in het water
      niet kan uitgaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.08
  - number: 13.08.2
    text: |-
      Aan boord van vaartuigen moet zich voor ieder zich regelmatig aan boord bevindend persoon een voor hem persoonlijk
      geschikt, automatisch opblaasbaar zwemvest, dat voldoet - aan de Europese normen EN ISO 12402-2 : 2006, EN ISO
      12402-3 : 2006, EN ISO 12402-4 : 2006, of
        - aan het Internationaal Verdrag van 1974 voor de beveiliging van mensenlevens op zee (Solas 1974), Hoofdstuk III,
      Regel 7.2, en aan de internationale code betreffende de reddingsmiddelen (LSA), paragraaf 2.2, onder handbereik
      bevinden. Voor kinderen zijn ook harde zwemvesten, die aan deze normen voldoen, toegelaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.08
  - number: 13.08.3
    text: Zwemvesten moeten zijn getest overeenkomstig de indicaties van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel13.08
  - number: 14.01.1
    text: |-
      Vaartuigen moeten zodanig zijn gebouwd, ingericht en uitgerust, dat personen daarop veilig kunnen werken en de
      verkeerswegen kunnen gebruiken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.01
  - number: 14.01.2
    text: |-
      De voor het werk aan boord noodzakelijke en vast opgestelde voorzieningen moeten zodanig zijn ingericht, opgesteld
      en beveiligd, dat ze gemakkelijk en zonder gevaar bediend, gebruikt en onderhouden kunnen worden. Zo nodig moeten
      bewegende en hete delen van beschermende inrichtingen zijn voorzien.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.01
  - number: 14.02.1
    text: |-
      Dekken en gangboorden moeten vlak zijn en moeten vrij zijn van obstakels waarover men kan struikelen; ze moeten
      zodanig zijn uitgevoerd dat er geen water op kan blijven staan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.2
    text: |-
      Dekken alsmede gangboorden, machinekamervloeren, bordessen, trappen en de bolderdeksels in de gangboorden moeten
      veiligheid bieden tegen uitglijden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.3
    text: |-
      Bolderdeksels in de gangboorden en hindernissen in de verkeerswegen, zoals bijvoorbeeld randen van traptreden,
      moeten in een met het omgevende dek contrasterende kleur zijn geverfd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.4
    text: |-
      De buitenkanten van de dekken, de gangboorden en de werkplekken, waarbij de valhoogte meer dan 1 m kan bedragen,
      moeten zijn voorzien van een verschansing of denneboom van elk ten minste 0,90 m hoogte of van doorlopende relingen
      die voldoen aan de Europese norm EN 711 : 2016. Indien het gangboord een neerklapbare reling bezit, dan moeten
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.4.a)
    text: |-
      aan de denneboom tevens doorlopende handrelingen met een diameter van 0,02 tot 0,04 m op een hoogte tussen 0,7 en
      1,1 m, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.4.b)
    text: |-
      op goed zichtbare plaatsen aan het begin van het gangboord tekens overeenkomstig Bijlage 4, schets 10, met een
      diameter van ten minste 15 cm zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.5
    text: |-
      In afwijking van het vierde lid hoeven bij duwbakken en sleepschepen zonder verblijven geen verschansingen of
      relingen aanwezig te zijn, indien
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.5.a)
    text: aan de buitenkanten van de dekken en gangboorden voetlijsten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.5.b)
    text: aan de dennebomen handrelingen als bedoeld in het vierde lid, onderdeel a, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.5.c)
    text: |-
      op goed zichtbare plaatsen op het dek tekens overeenkomstig Bijlage 4, schets 10, met een diameter van ten minste
      15 cm zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.6
    text: |-
      In afwijking van het vierde lid hoeven bij schepen met een glad- of trunkdek de relingen niet onmiddellijk aan de
      buitenkanten van dat dek of in de gangboorden te zijn aangebracht, indien
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.6.a)
    text: de verkeerswegen over deze dekken lopen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.6.b)
    text: |-
      de verkeerswegen en werkgebieden op deze dekken door vaste relingen overeenkomstig de Europese norm EN 711 : 2016
      zijn omgeven, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.6.c)
    text: |-
      op goed zichtbare plaatsen op de passages naar de niet door relingen beschermde gebieden tekens overeenkomstig
      Bijlage 4, schets 10, met een diameter van ten minste 15 cm zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: 14.02.7
    text: |-
      Voor werkplekken, waar de valhoogte meer dan 1 m bedraagt, kan de Commissie van deskundigen geschikte inrichtingen
      en uitrustingen ten behoeve van het veilig werken eisen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.02
  - number: '14.03'
    text: Werkplekken moeten zo groot zijn dat iedere persoon die er werkt voldoende bewegingsvrijheid heeft.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.03
  - number: 14.04.1
    text: |-
      De vrije breedte van het gangboord moet ten minste 0,60 m bedragen. Op de plaats van bepaalde ingebouwde
      noodzakelijke constructies zoals afsluiters voor dekwasleidingen behoeft dit slechts 0,50 m te zijn en bij bolders
      en klampen 0,40 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.04
  - number: 14.04.2
    text: |-
      De vrije breedte van het gangboord kan tot een hoogte van 0,90 m daarboven tot 0,50 m beperkt blijven wanneer de
      vrije breedte in het gedeelte daarboven tussen de buitenkant van de scheepshuid en de binnenkant van de opening van
      het laadruim ten minste 0,65 m bedraagt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.04
  - number: 14.04.3
    text: Het eerste en tweede lid gelden tot een hoogte van 2,00 m boven het gangboord.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.04
  - number: 14.05.1
    text: 'Bij gangen, toegangen en doorgangen, die door personen of voor het verplaatsen van goederen worden gebruikt, moet:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.05
  - number: 14.05.1.a)
    text: voor de toegangsopeningen voldoende plaats zijn voor onbelemmerde beweging;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.05
  - number: 14.05.1.b)
    text: |-
      de vrije breedte van de doorgangen overeenkomen met de bestemming van de werkplekken, maar ten minste 0,60 m
      bedragen. Bij schepen met een breedte van niet meer dan 8 m behoeft de breedte van de doorgangen slechts 0,50 m
      te bedragen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.05
  - number: 14.05.1.c)
    text: de vrije hoogte van de doorgangen inclusief de hoogte van de drempels ten minste 1,90 m bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.05
  - number: 14.05.2
    text: |-
      Deuren moeten van beide zijden zonder gevaar geopend en gesloten kunnen worden. Ze moeten zodanig zijn uitgevoerd
      dat zij niet onopzettelijk open of dicht kunnen gaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.05
  - number: 14.05.3
    text: |-
      In- en uitgangen en gangen die hoogteverschillen van meer dan 0,50 m hebben moeten zijn voorzien van adequate
      trappen, ladders of klimtreden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.05
  - number: 14.05.4
    text: |-
      Wanneer het hoogteverschil bij permanent bezette werkplekken meer dan 1,00 m bedraagt, moeten er trappen zijn. Dit
      geldt niet voor nooduitgangen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.05
  - number: 14.05.5
    text: |-
      Bij schepen met laadruimen moet ten minste bij ieder uiteinde van ieder laadruim een vast ingebouwde
      klimvoorziening aanwezig zijn. In afwijking hiervan behoeft geen vast ingebouwde klimvoorziening aanwezig te zijn
      indien er ten minste twee draagbare ruimladders aanwezig zijn die bij een hellingshoek van 60° met ten minste drie
      treden tot boven de rand van het luik moeten reiken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.05
  - number: 14.06.1
    text: |-
      Het aantal, de constructie en de afmetingen van de uitgangen met inbegrip van de nooduitgangen moeten overeenkomen
      met de bestemming en de grootte van de ruimten. Wanneer één van deze uitgangen een nooduitgang is, moet die
      duidelijk als zodanig zijn aangeduid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.06
  - number: 14.06.2
    text: |-
      Nooduitgangen of als nooduitgang dienende vensters of bovenlichten moeten een vrije opening van ten minste 0,36 m2
      hebben, waarbij de kortste zijde ten minste 0,50 m moet bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.06
  - number: 14.07.1
    text: |-
      Trappen en ladders moeten veilig zijn bevestigd. Trappen moeten ten minste 0,60 m breed zijn; de vrije breedte
      tussen de handrelingen moet ten minste 0,60 m bedragen; de diepte van de treden mag niet minder zijn dan 0,15
      m; het oppervlak van de treden moet veiligheid bieden tegen uitglijden; trappen met meer dan drie treden moeten
      handrelingen hebben.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.07
  - number: 14.07.2
    text: |-
      Ladders en klimtreden moeten een vrije breedte van ten minste 0,30 m hebben; de afstand tussen de sporten mag niet
      meer dan 0,30 m bedragen; de afstand van de sporten tot constructiedelen moet ten minste 0,15 m zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.07
  - number: 14.07.3
    text: Ladders en klimtreden moeten van boven herkenbaar zijn en met handgrepen boven de uitgangsopeningen zijn uitgerust.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.07
  - number: 14.07.4
    text: |-
      Aanleunladders moeten ten minste 0,40 m en onderaan ten minste 0,50 m breed zijn; ze moeten kunnen worden beveiligd
      tegen kantelen en wegglijden; de sporten moeten vast in de boom zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.07
  - number: 14.08.1
    text: |-
      Binnen in het schip gelegen werkplekken moeten naar grootte, inrichting en indeling zijn aangepast aan de daar
      te verrichten werkzaamheden en voldoen aan de eisen inzake hygiëne en veiligheid. Ze moeten voldoende en niet
      verblindend kunnen worden verlicht en voldoende kunnen worden geventileerd; zo nodig moeten zij zijn voorzien van
      verwarmingsapparaten die een redelijke temperatuur waarborgen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.08
  - number: 14.08.2
    text: |-
      Vloeren van binnen in het schip gelegen werkplekken moeten vast zijn, duurzaam uitgevoerd, en veiligheid bieden
      tegen struikelen en uitglijden. Openingen in dekken en vloeren moeten in geopende toestand een beveiliging hebben
      tegen het gevaar van vallen. Vensters en bovenlichten moeten zodanig zijn uitgevoerd en gesitueerd dat ze zonder
      gevaar kunnen worden bediend en gereinigd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.08
  - number: 14.09.1
    text: |-
      De werkplekken moeten zodanig zijn gelegen, ingericht en ontworpen dat de werknemers niet aan het gevaar van
      trillingen zijn blootgesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.09
  - number: 14.09.2
    text: |-
      Permanent gebruikte werkruimten moeten bovendien zodanig zijn gebouwd en geïsoleerd tegen geluid dat de veiligheid
      en de gezondheid van de werknemers niet door geluidshinder in gevaar worden gebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.09
  - number: 14.09.3
    text: |-
      Voor werknemers die dagelijks aan een geluidsdruk van meer dan 85 dB(A) worden blootgesteld, moeten persoonlijke
      gehoorbeschermingsmiddelen aanwezig zijn. Werkplekken waar deze waarden meer zijn dan 90 dB(A) moeten zijn voorzien
      van een teken ‘gehoorbescherming verplicht’ met een diameter van ten minste 10 cm, overeenkomstig schets 7 van
      bijlage 4, waarin wordt gewezen op de plicht tot het gebruiken van deze gehoorbeschermingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.09
  - number: 14.10.1
    text: |-
      Luiken moeten gemakkelijk bereikt en veilig bewogen kunnen worden. Delen van luiken met een gewicht van meer dan
      40 kg moeten bovendien schuifbaar of neerklapbaar zijn of zodanig zijn ingericht dat zij mechanisch kunnen worden
      opgetild. Luiken die met behulp van hefwerktuigen worden bewogen, moeten zijn voorzien van adequate en gemakkelijk
      toegankelijke inrichtingen voor het vastmaken van de aanslagmiddelen. Op luiken of schaarstokken die niet
      uitwisselbaar zijn moet duidelijk het luik waarbij ze behoren en de exacte plaats daarop zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.10
  - number: 14.10.2
    text: |-
      Luiken moeten beveiligd kunnen worden tegen oplichten door wind en laadinrichtingen. Schuifluiken moeten zijn
      voorzien van vergrendelingen die onopzettelijke beweging in de lengterichting met meer dan 0,40 m verhinderen;
      zij moeten in hun uiterste stand kunnen worden vastgezet. Er moeten geschikte inrichtingen aanwezig zijn voor het
      bevestigen van opgestapelde luiken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.10
  - number: 14.10.3
    text: |-
      Bij mechanisch bediende luiken moet de energietoevoer na het loslaten van de bedieningsschakelaar automatisch
      worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.10
  - number: 14.10.4
    text: |-
      Luiken moeten de te verwachten belasting, begaanbare luiken ten minste 75 kg, als puntlast kunnen opnemen. Niet
      begaanbare luiken moeten als zodanig zijn aangeduid. Op luiken die bestemd zijn voor het dragen van deklast moet
      de toegelaten belasting in t/m2 staan aangeduid. Indien voor het bereiken van de toegelaten belasting stutten nodig
      zijn, moet daarop op een geschikte plaats worden gewezen; in dat geval moeten tekeningen voor dit doel aan boord
      aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.10
  - number: 14.11.1
    text: |-
      Lieren moeten zodanig zijn ingericht dat veilig werken mogelijk is. Ze moeten voorzieningen hebben die het
      onopzettelijk teruglopen van de last verhinderen. Lieren die geen automatische rem hebben moeten zijn uitgerust met
      een op de trekkracht berekende rem.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.11
  - number: 14.11.2
    text: |-
      Lieren die met de hand worden bediend moeten zijn voorzien van inrichtingen die het terugslaan van de zwengels
      verhinderen. Lieren die zowel met de hand als mechanisch kunnen worden bediend moeten zodanig zijn ingericht dat de
      mechanische aandrijving niet het handmechanisme in werking kan stellen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.11
  - number: 14.12.1
    text: |-
      Kranen moeten volgens de regels van de techniek zijn gebouwd. De tijdens het in bedrijf zijn optredende krachten
      moeten veilig worden overgebracht op de scheepsconstructie; zij mogen de stabiliteit niet in gevaar brengen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.2
    text: 'Op elke kraan moet een fabriekslabel met de volgende gegevens zijn aangebracht:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.2.a)
    text: naam en adres van de fabrikant;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.2.b)
    text: het EG-markering met vermelding van het bouwjaar;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.2.c)
    text: aanduiding van de serie of het type;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.2.d)
    text: eventueel serienummer.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.3
    text: |-
      Op elke kraan moet de ten hoogste toelaatbare belasting duurzaam en duidelijk zichtbaar zijn aangebracht. Bij
      kranen waarvan de bedrijfslast niet meer bedraagt dan 2.000 kg hoeft alleen de ten hoogste toelaatbare bedrijfslast
      bij de grootste vlucht van de kraan duurzaam en duidelijk zichtbaar te zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.4
    text: |-
      Ter voorkoming van het gevaar van persoonlijk letsel moeten beschermende voorzieningen aanwezig zijn. De buitenste
      delen van de kraan moeten ten opzichte van vaste opbouwen binnen het gebied waar gewerkt en gelopen wordt een
      veiligheidsafstand van ten minste 0,50 m hebben.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.5
    text: |-
      Kranen die mechanisch worden aangedreven moeten kunnen worden beschermd tegen gebruik door onbevoegden. Ze mogen
      slechts aan de voor de kraan voorziene bedieningsinrichting in werking kunnen worden gesteld. De bedieningsorganen
      moeten automatisch in de stopstand terugkeren (schakelaar die niet automatisch in de in werking gestelde stand
      blijft); duidelijk zichtbaar moet zijn in welke richting zij functioneren. Bij het uitvallen van de aandrijfenergie
      mag de last niet automatisch kunnen teruglopen. Onopzettelijke kraanbewegingen moeten worden voorkomen. De
      opwaartse beweging van het hijsmiddel en de overschrijding van de bedrijfslast moeten door adequate voorzieningen
      zijn beperkt. De neerwaartse beweging van het hijsmiddel moet beperkt zijn wanneer bij het voorziene gebruik van de
      kraan, op het moment dat het hijsmiddel wordt bevestigd aan de last, minder dan twee wikkelingen van de hijskabel
      op de liertrommel over zijn. Na het aanspreken van de automatische (beveiligings)voorzieningen, moet de respectieve
      tegengestelde beweging nog mogelijk zijn. De breeksterkte van draadkabels voor het lopende werk moet ten minste
      het vijfvoudige van de maximaal toelaatbare kabeltreksterkte bedragen. De constructie van de draadkabel moet
      onberispelijk zijn en moet geschikt zijn voor het gebruik bij kranen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.6
    text: 'Kranen moeten door een erkende deskundige worden gekeurd:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.6.a)
    text: vóór de eerste ingebruikstelling;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.6.b)
    text: vóór een hernieuwde ingebruikstelling na een wezenlijke verandering of reparatie, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.6.c)
    text: met regelmaat en ten minste elke tien jaar.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.7
    text: |-
      Kranen dienen regelmatig, echter ten minste één keer per jaar, door een deskundige te worden gekeurd. Hierbij dient
      door visuele controle en controle van het functioneren te worden vastgesteld dat de kraan veilig is. Hiervan moet
      een verklaring worden afgegeven, ondertekend door de deskundige die de keuring heeft verricht, en waarin de datum
      van de keuring is aangegeven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.8
    text: |-
      Kranen waarvan de bedrijfslast meer dan 2.000 kg bedraagt, die dienen voor de overslag van vracht, of die aan boord
      van bokken, pontons en andere drijvende werktuigen of schepen bestemd voor bouwwerkzaamheden zijn opgesteld, moeten
      bovendien voldoen aan de voorschriften een van de lidstaten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.9
    text: |-
      Voor kranen moeten de gebruiksaanwijzingen van de fabrikant van de kraan aan boord aanwezig zijn. Deze moeten ten
      minste de volgende gegevens bevatten:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.9.a)
    text: toepassing en functie van de bedieningsorganen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.9.b)
    text: maximaal toelaatbare bedrijfslast overeenkomstig de vlucht;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.9.c)
    text: maximaal toelaatbare helling van de kraan;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.9.d)
    text: handleiding voor montage en onderhoud;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: 14.12.9.e)
    text: algemene technische gegevens.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.12
  - number: '14.13'
    text: |-
      Ten behoeve van de opslag van brandbare vloeistoffen met een vlampunt van minder dan 55 °C moet zich aan dek een
      geventileerde kast van onbrandbaar materiaal bevinden. De buitenkant daarvan moet zijn voorzien van een teken
      ‘Vuur, open licht en roken verboden’ met een lengte van de zijde van ten minste 10 cm, overeenkomstig schets 2 van
      bijlage 4.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel14.13
  - number: 15.01.1
    text: |-
      Schepen moeten voor de gewoonlijk aan boord verblijvende personen, althans ten minste voor de minimumbemanning,
      voorzien zijn van verblijven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.01
  - number: 15.01.2
    text: |-
      Verblijven moeten zodanig zijn gebouwd, ingericht en uitgerust dat zij voldoen aan de eisen met betrekking tot de
      veiligheid, de gezondheid en het welzijn van de personen aan boord. Zij moeten gemakkelijk en veilig toegankelijk
      zijn, alsmede voldoende geïsoleerd zijn tegen kou en warmte.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.01
  - number: 15.01.3
    text: |-
      De Commissie van deskundigen kan afwijkingen van dit hoofdstuk toestaan indien de veiligheid en gezondheid van de
      personen aan boord op andere wijze zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.01
  - number: 15.01.4
    text: |-
      De Commissie van deskundigen vermeldt in het binnenschipcertificaat beperkingen van de exploitatiewijze of van de
      soort bedrijfsvoering van het schip die zijn vereist op grond van afwijkingen als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.01
  - number: 15.02.1
    text: |-
      Verblijven moeten, ook wanneer de deuren gesloten zijn, voldoende kunnen worden geventileerd; bovendien moeten de
      woonruimten voldoende daglicht verkrijgen en zo mogelijk uitzicht naar buiten hebben.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.2
    text: |-
      Verblijven moeten, indien zij niet op dekhoogte toegankelijk zijn en het hoogteverschil meer dan 0,30 m bedraagt,
      via trappen toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.3
    text: In het voorschip mogen de vloeren niet lager dan 1,20 m onder het vlak van de grootste inzinking liggen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.4
    text: |-
      Woon- en slaapruimten moeten ten minste twee zo ver mogelijk van elkaar verwijderde uitgangen hebben, die als
      vluchtwegen dienen. Eén uitgang kan als nooduitgang zijn geconstrueerd. Dit geldt niet voor ruimten waarvan
      de uitgang rechtstreeks naar het dek leidt of naar een gang die als vluchtweg dient, voor zover deze gang twee
      van elkaar verwijderd liggende uitgangen heeft naar bak- en stuurboord. Nooduitgangen, waartoe ook bovenlichten
      en ramen kunnen behoren, moeten een vrije opening van ten minste 0,36 m2 hebben, een kleinste zijde van ten
      minste 0,50 m hebben en een snelle evacuatie in geval van nood mogelijk maken. De isolering en de bekleding van
      oppervlakken van de vluchtwegen moeten van moeilijk ontvlambaar materiaal zijn gemaakt en het gebruik van de
      vluchtwegen moet door adequate maatregelen zoals ladders of klimtreden te allen tijde zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.5
    text: |-
      Verblijven moeten zijn beschermd tegen ontoelaatbare geluidshinder en trillingen. De ten hoogste toegelaten niveaus
      van de geluidsdruk zijn:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.5.a)
    text: 'in woonruimten: 70 dB(A);'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.5.b)
    text: |-
      in slaapruimten: 60 dB(A). Dit geldt niet voor schepen die uitsluitend buiten de door de lidstaten in hun nationale
      bepalingen voorgeschreven rusttijden van de bemanning worden geëxploiteerd. De beperking genoemd in onderdeel b wat
      betreft de exploitatiewijze dient in het Binnenschipcertificaat te worden vermeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.6
    text: In verblijven mag de stahoogte niet minder zijn dan 2,00 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.7
    text: In de regel moeten de schepen ten minste één van de slaapruimte afgescheiden woonruimte hebben.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.8
    text: |-
      In woonruimten mag het vrije vloeroppervlak niet minder zijn dan 2 m2 per persoon, maar moet dit in totaal ten
      minste 8 m2 zijn. De oppervlakte bezet met verplaatsbaar meubilair, zoals tafels en stoelen, maakt deel uit van de
      vrije oppervlakte.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.9
    text: Elke woon- of slaapruimte moet een inhoud van ten minste 7 m3 hebben.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.10
    text: |-
      In woonruimten bedraagt het minimale luchtvolume 3,5 m3 per persoon. In slaapruimten moet het luchtvolume voor
      de eerste persoon ten minste 5 m3 bedragen, voor iedere verdere persoon moet nog eens ten minste 3 m3 aanwezig
      zijn (het volume van het meubilair dient daarvan te worden afgetrokken). Slaapruimten mogen slechts voor ten
      hoogste twee personen bestemd zijn. De bedden moeten ten minste 0,30 m boven de vloer zijn aangebracht. Indien het
      stapelbedden betreft, moet boven elk bed een vrije ruimte van ten minste 0,60 m hoogte aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.11
    text: |-
      Deuren moeten een opening hebben waarvan de bovenkant ten minste 1,90 m boven het dek of de vloer ligt en
      zij moeten een vrije breedte van ten minste 0,60 m hebben. De voorgeschreven hoogte mag door het aanbrengen
      van schuifkappen of luiken worden bereikt. Deuren moeten van beide kanten naar buiten kunnen worden geopend.
      Deurdrempels mogen ten hoogste 0,40 m hoog zijn. Bovendien moeten andere veiligheidsvoorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.12
    text: 'Trappen moeten vast aangebracht en veilig begaanbaar zijn. Dit is het geval wanneer:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.12.a)
    text: zij ten minste 0,60 m breed zijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.12.b)
    text: de treden ten minste 0,15 m diep zijn;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.12.c)
    text: de treden een antisliplaag hebben, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.12.d)
    text: trappen met meer dan drie treden zijn voorzien van ten minste een handgreep of leuning.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.02.13
    text: |-
      Leidingen voor gevaarlijke gassen en gevaarlijke vloeistoffen, in het bijzonder als ze onder een zodanig hoge
      druk staan dat een lek personen in gevaar zou kunnen brengen, mogen niet zijn aangelegd in de verblijven en in
      de daarheen leidende gangen. Dit geldt niet voor leidingen voor stoomsystemen en hydraulische systemen die zijn
      ondergebracht in een metalen beschermkoker en voor vast aangelegde leidingen van vloeibaargasinstallaties voor
      huishoudelijk gebruik.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.02
  - number: 15.03.1
    text: 'Schepen met verblijven moeten ten minste over de volgende sanitaire voorzieningen beschikken:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.03
  - number: 15.03.1.a)
    text: een toilet per wooneenheid of per zes bemanningsleden. Dit toilet moet van frisse lucht kunnen worden voorzien;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.03
  - number: 15.03.1.b)
    text: |-
      een wasbak met afvoer en met drinkwateraansluiting voor koud en warm water per wooneenheid of per vier
      bemanningsleden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.03
  - number: 15.03.1.c)
    text: een douche of badkuip met drinkwateraansluiting voor koud en warm water per wooneenheid of per zes bemanningsleden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.03
  - number: 15.03.2
    text: |-
      Sanitaire voorzieningen moeten zich in de directe nabijheid van de woonruimten bevinden. Toiletten mogen geen
      rechtstreekse verbinding hebben met de keukens, eetruimten of woonkeukens.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.03
  - number: 15.03.3
    text: |-
      Toiletruimten moeten een grondoppervlak van ten minste 1 m2 hebben. Daarbij moet de breedte ten minste 0,75 m
      en de lengte ten minste 1,10 m bedragen. Toiletruimten in hutten voor maximaal twee personen mogen kleiner zijn.
      Indien zich een wasgelegenheid en/of douche in de toiletruimte bevindt, moet het grondoppervlak met ten minste het
      oppervlak van de wasbak en/of de douchebak (of eventueel van de badkuip) zijn vergroot.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.03
  - number: 15.04.1
    text: Keukens mogen gecombineerd zijn met woonruimten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.04
  - number: 15.04.2
    text: 'Keukens moeten uitgerust zijn met:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.04
  - number: 15.04.2.a)
    text: kookgerei;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.04
  - number: 15.04.2.b)
    text: spoelbak met afvoer;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.04
  - number: 15.04.2.c)
    text: installatie voor de drinkwatervoorziening;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.04
  - number: 15.04.2.d)
    text: koelkast;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.04
  - number: 15.04.2.e)
    text: voldoende berg-, werk- en voorraadruimte.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.04
  - number: 15.04.3
    text: |-
      Eetruimten in woonkeukens moeten voldoende zijn voor het aantal bemanningsleden dat deze ruimten gewoonlijk
      gelijktijdig gebruikt. De breedte van de zitplaatsen mag niet minder dan 0,60 m bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.04
  - number: 15.05.1
    text: |-
      Schepen waarop zich verblijven bevinden moeten van een drinkwaterinstallatie zijn voorzien. Op de vulopeningen van
      de drinkwatertanks en de drinkwaterslangen dient te zijn vermeld dat zij uitsluitend voor drinkwater zijn bestemd.
      Vulaansluitingen voor drinkwater moeten boven het dek zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.05.2
    text: 'Drinkwaterinstallaties moeten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.05.2.a)
    text: van binnen uit corrosiebestendig en fysiologisch ongevaarlijk materiaal bestaan;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.05.2.b)
    text: zijn samengesteld zonder leidinggedeelten waarin een regelmatige doorstroming niet is gegarandeerd, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.05.2.c)
    text: tegen overmatige verhitting zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.05.3
    text: 'Drinkwatertanks moeten bovendien:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.05.3.a)
    text: |-
      een capaciteit hebben van ten minste 150 liter per gewoonlijk aan boord verblijvende persoon, maar ten minste per
      bemanningslid;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.05.3.b)
    text: een adequaat afsluitbare opening hebben voor het schoonmaken van de binnenkant;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.05.3.c)
    text: een inrichting voor het aanwijzen van de inhoud hebben, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.05.3.d)
    text: |-
      aansluitingen hebben voor beluchten en ontluchten, die afvoeren in de open lucht of die van adequate filters zijn
      voorzien.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.05.4
    text: |-
      Drinkwatertanks mogen geen wanden gemeen hebben met andere tanks. Drinkwaterleidingen mogen niet door tanks lopen
      die andere vloeistoffen bevatten. Verbindingen tussen het drinkwatersysteem en andere pijpleidingen zijn niet
      toegestaan. Pijpleidingen voor gas of andere vloeistoffen dan drinkwater mogen niet door drinkwatertanks lopen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.05.5
    text: |-
      Drukvaten voor drinkwater mogen slechts met niet verontreinigde perslucht worden bediend. Indien de perslucht
      afkomstig is van compressoren, moeten vlak vóór de drukvaten voor drinkwater geschikte luchtfilters en
      olieafscheiders zijn aangebracht, tenzij het drinkwater door een membraan van de perslucht is gescheiden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.05
  - number: 15.06.1
    text: |-
      Verblijven moeten overeenkomstig hun doel kunnen worden verwarmd. De verwarmingen moeten berekend zijn op de
      heersende weersomstandigheden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.06
  - number: 15.06.2
    text: |-
      Woon- en slaapruimten moeten – ook bij gesloten deuren – voldoende kunnen worden geventileerd. De toevoer en afvoer
      van lucht moeten onder alle klimatologische omstandigheden voldoende luchtcirculatie mogelijk maken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.06
  - number: 15.06.3
    text: |-
      Verblijven moeten zodanig zijn ingericht en uitgevoerd dat voor zover mogelijk wordt voorkomen dat verontreinigde
      lucht uit andere compartimenten van het schip, zoals machinekamers of laadruimen, binnendringt; bij geforceerde
      ventilatie dienen de inlaatopeningen zodanig te worden aangebracht dat ze aan bovengenoemde eisen voldoen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.06
  - number: 15.07.1
    text: |-
      Ieder aan boord verblijvend bemanningslid moet over een eigen bed en een eigen afsluitbare klerenkast beschikken.
      Het bed moet ten minste een binnenmaat van 2,00 m lengte bij 0,90 m breedte hebben.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.07
  - number: 15.07.2
    text: Buiten de slaapruimten dient te zijn voorzien in adequate gelegenheden voor het bewaren en drogen van werkkleding.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.07
  - number: 15.07.3
    text: |-
      Alle ruimten moeten elektrisch kunnen worden verlicht. Extra lampen voor gasvormige of vloeibare brandstoffen
      zijn slechts in woonruimten toegestaan. Verlichtingsvoorzieningen met vloeibare brandstof moeten van metaal zijn
      vervaardigd en mogen slechts op brandstoffen werken waarvan het vlampunt boven 55 °C ligt of op handelspetroleum.
      Ze moeten zodanig zijn opgesteld of aangebracht dat er geen brandgevaar bestaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel15.07
  - number: 16.01.1
    text: |-
      Op verwarmings-, kook- en koelinstallaties die werken op vloeibaar gas zijn de voorschriften van
      [hoofdstuk 17][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '17'
  - number: 16.01.2
    text: |-
      Verwarmings-, kook- en koelinstallaties met toebehoren moeten zo zijn uitgevoerd en opgesteld dat zij ook bij
      oververhitting geen gevaar opleveren; ze moeten zijn beveiligd tegen onopzettelijk kantelen of verschuiven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.01
  - number: 16.01.3
    text: |-
      De in het tweede lid genoemde installaties mogen niet worden opgesteld in ruimten waar stoffen met een vlampunt
      onder 55 °C worden opgeslagen of gebruikt. Afvoerleidingen van de installaties mogen niet door deze ruimten lopen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.01
  - number: 16.01.4
    text: De voor de verbranding noodzakelijke luchttoevoer moet zijn gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.01
  - number: 16.01.5
    text: |-
      Verwarmingsapparaten moeten vast verbonden zijn met schoorstenen. Deze schoorstenen moeten in goede staat zijn
      en zijn voorzien van geschikte kappen of tegen wind beschermd zijn. Zij moeten zodanig zijn aangelegd dat zij
      gereinigd kunnen worden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.01
  - number: 16.02.1
    text: |-
      Wanneer verwarmings-, kook- en koelinstallaties op vloeibare brandstoffen werken, mogen alleen brandstoffen met een
      vlampunt boven 55 °C worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.02
  - number: 16.02.2
    text: |-
      In afwijking van het eerste lid kunnen kooktoestellen en van pitbranders voorziene verwarmings- en koeltoestellen
      die op handelspetroleum werken worden toegestaan in verblijven en stuurhuizen, mits de inhoud van hun reservoir
      niet meer bedraagt dan 12 liter.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.02
  - number: 16.02.3
    text: 'Met pitbranders uitgeruste installaties moeten:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.02
  - number: 16.02.3.a)
    text: |-
      een metalen brandstoftank met een afsluitbare vulopening hebben, die geen zacht gesoldeerde naden heeft onder de
      hoogste vulstand en die zo is gebouwd en aangebracht dat hij niet onopzettelijk kan opengaan of leeglopen;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.02
  - number: 16.02.3.b)
    text: zonder behulp van een andere brandbare vloeistof kunnen worden ontstoken, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.02
  - number: 16.02.3.c)
    text: zo zijn opgesteld dat de verbrandingsgassen veilig worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.02
  - number: 16.03.1
    text: |-
      Oliekachels met verdampingsbranders en oliestookinstallaties met verstuivingsbranders moeten volgens de algemeen
      erkende regels van de techniek zijn gebouwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.03
  - number: 16.03.2
    text: |-
      Indien een oliekachel met een verdampingsbrander of een oliestookinstallatie met een verstuivingsbrander in een
      machinekamer is opgesteld, moet de luchttoevoer voor het verwarmingsapparaat en de motoren zodanig zijn dat het
      verwarmingsapparaat en de motoren onafhankelijk van elkaar, probleemloos en veilig kunnen functioneren. Indien
      nodig moeten afzonderlijke luchttoevoerkokers aanwezig zijn. De opstelling van het apparaat moet zodanig zijn dat
      een eventueel uit de verbrandingsruimte terugslaande vlam niet met andere delen van de machinekamerinstallatie in
      aanraking kan komen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.03
  - number: 16.04.1
    text: |-
      Oliekachels met verdampingsbranders moeten zonder behulp van andere brandbare vloeistoffen kunnen worden
      aangestoken. Zij moeten zijn aangebracht boven een metalen lekbak van zodanige omvang dat alle kachelonderdelen
      waarin olie aanwezig kan zijn zich boven deze bak bevinden. De inhoud van de lekbak mag niet minder dan 2 liter en
      de randhoogte niet minder dan 20 mm bedragen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.04
  - number: 16.04.2
    text: |-
      Voor oliekachels met verdampingsbranders die in de machinekamer zijn opgesteld moet de randhoogte van de in het
      eerste lid bedoelde lekbak ten minste 200 mm bedragen. De onderkant van de brander moet boven de bovenrand van de
      lekbak liggen. Bovendien moet de bovenrand van de lekbak ten minste 100 mm boven de vloerplaat uitsteken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.04
  - number: 16.04.3
    text: |-
      Oliekachels met verdampingsbranders moeten van een geschikte brandstofregelaar zijn voorzien, die bij elke
      ingestelde stand een praktisch gelijkblijvende olietoevoer naar de brander waarborgt en bij eventueel uitdoven van
      de vlam de brandstoftoevoer afsluit. De brandstofregelaar is als geschikt te beschouwen als deze ook bij trillingen
      en bij slagzij tot 12° probleemloos functioneert en, behalve van een vlotter voor de regulering van het niveau, is
      voorzien van:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.04
  - number: 16.04.3.a)
    text: |-
      een tweede vlotter, die bij het overschrijden van het toelaatbare olieniveau de toevoer van brandstof veilig en
      betrouwbaar afsluit, of
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.04
  - number: 16.04.3.b)
    text: een overloopleiding, mits de olie-opvangbak ten minste de inhoud van de verbruikstank kan bevatten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.04
  - number: 16.04.4
    text: 'Indien de brandstoftank gescheiden is van de oliekachel met verdampingsbrander:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.04
  - number: 16.04.4.a)
    text: mag deze tank niet hoger zijn geplaatst dan volgens de gebruiksaanwijzing van de fabrikant is toegestaan;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.04
  - number: 16.04.4.b)
    text: moet de tank zodanig zijn geplaatst dat deze tegen ontoelaatbare verwarming is beschermd;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.04
  - number: 16.04.4.c)
    text: moet de brandstoftoevoer vanaf het dek kunnen worden onderbroken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.04
  - number: 16.04.5
    text: |-
      De schoorstenen van oliekachels met natuurlijke trek moeten zijn voorzien van een inrichting die terugslag van de
      trek verhindert.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.04
  - number: '16.05'
    text: 'Oliestookinstallaties met verstuivingsbranders moeten met name aan de volgende eisen voldoen:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.05
  - number: 16.05.a)
    text: Vóór het begin van de olietoevoer moet voldoende ventilatie van de verbrandingsruimte zijn gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.05
  - number: 16.05.b)
    text: De brandstoftoevoer moet door een thermostatische regelaar worden geregeld;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.05
  - number: 16.05.c)
    text: De ontsteking moet elektrisch of met een waakvlam geschieden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.05
  - number: 16.05.d)
    text: Er moet een inrichting aanwezig zijn die bij het uitdoven van de vlam de brandstoftoevoer automatisch afsluit;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.05
  - number: 16.05.e)
    text: |-
      De hoofdschakelaar moet zijn aangebracht op een gemakkelijk toegankelijke plaats buiten de ruimte waar de
      installatie staat opgesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.05
  - number: '16.06'
    text: |-
      Luchtverhitters waarbij de verwarmingslucht onder druk rondom een verbrandingskamer naar een verdeelsysteem of een
      ruimte wordt geleid moeten aan de volgende eisen voldoen:
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.06
  - number: 16.06.a)
    text: |-
      Indien de brandstof onder druk wordt verstoven, moet de toevoer van de verbrandingslucht door middel van een
      ventilator geschieden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.06
  - number: 16.06.b)
    text: |-
      Voordat de brander kan worden ontstoken, moet de verbrandingskamer goed geventileerd zijn. Dit kan ook gebeuren
      door het nalopen van de verbrandingsluchtventilator;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.06
  - number: 16.06.c)
    text: |-
      De brandstoftoevoer moet automatisch worden gesloten, wanneer het vuur uitdooft; geen voldoende toevoer
      van verbrandingslucht aanwezig is; de verhitte lucht een eerder ingestelde temperatuur overschrijdt, of de
      stroomvoorziening van de veiligheidsinrichtingen uitvalt; In deze gevallen mag de brandstoftoevoer na te zijn
      gesloten niet weer automatisch starten;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.06
  - number: 16.06.d)
    text: |-
      De ventilatoren voor verbrandingslucht en verwarmingslucht moeten kunnen worden uitgeschakeld buiten de ruimte
      waarin het verwarmingsapparaat is opgesteld;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.06
  - number: 16.06.e)
    text: |-
      Indien de verwarmingslucht van buitenaf wordt aangezogen, moeten de aanzuigopeningen zo hoog mogelijk boven het dek
      liggen. De uitvoering daarvan moet spatwater- en regendicht zijn.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.06
  - number: 16.06.f)
    text: De leidingen voor de verwarmingslucht moeten van metaal zijn vervaardigd;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.06
  - number: 16.06.g)
    text: De uitgangsopeningen voor de verwarmingslucht mogen niet volledig gesloten kunnen worden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.06
  - number: 16.06.h)
    text: De bij lekkage vrijkomende brandstof mag zich niet tot in de leidingen voor de verwarmingslucht kunnen verspreiden;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.06
  - number: 16.06.i)
    text: Luchtverhitters mogen hun verwarmingslucht niet uit een machinekamer kunnen aanzuigen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.06
  - number: 16.07.1
    text: |-
      Verwarmingsapparaten die op vaste brandstoffen werken moeten zodanig op een metalen plaat met een opstaande
      rand staan dat gloeiende brandstoffen of hete as niet buiten deze plaat kunnen geraken. Dit is niet vereist in
      ruimten die zijn gebouwd van onbrandbaar materiaal en die uitsluitend zijn bestemd voor het onderbrengen van een
      verwarmingsketel.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.07
  - number: 16.07.2
    text: |-
      De met vaste brandstoffen verwarmde ketels moeten zijn voorzien van thermostatische regelaars, die de voor de
      verbranding noodzakelijke luchttoevoer regelen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.07
  - number: 16.07.3
    text: |-
      In de nabijheid van ieder verwarmingsapparaat moeten middelen aanwezig zijn waarmee de as gemakkelijk kan worden
      afgekoeld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel16.07
  - number: 17.01.1
    text: |-
      Vloeibaargasinstallaties bestaan in hoofdzaak uit een flessenkast met één of meer gasflessen, één of meer
      drukregelaars, een distributienet en gebruiksapparaten. Reserveflessen en lege flessen die zich niet in de
      flessenkast bevinden zijn geen delen van een vloeibaargasinstallatie. [Artikel 17.05][ref1] is hierop van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.01
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.01.2
    text: De installaties mogen slechts op handelspropaan werken.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.01
  - number: 17.02.1
    text: |-
      Vloeibaargasinstallaties moeten in al hun onderdelen geschikt zijn voor het gebruik van propaan en deugdelijk zijn
      uitgevoerd en opgesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.02
  - number: 17.02.2
    text: |-
      Vloeibaargasinstallaties mogen slechts worden gebruikt voor huishoudelijke doeleinden in de verblijven en in het
      stuurhuis, alsmede voor overeenkomstige doeleinden op passagiersschepen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.02
  - number: 17.02.3
    text: |-
      Er kunnen zich aan boord verschillende afzonderlijke vloeibaargasinstallaties bevinden. Eén en dezelfde installatie
      mag niet worden gebruikt voor verblijven die door een ruim of een vaste tank zijn gescheiden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.02
  - number: 17.02.4
    text: In de machinekamer mag zich geen onderdeel van de vloeibaargasinstallatie bevinden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.02
  - number: 17.03.1
    text: |-
      Toegestaan zijn uitsluitend flessen waarvan de toegelaten vulmassa ligt tussen 5 en 35 kg. Voor passagiersschepen
      kan de Commissie van deskundigen flessen met een hoger vulgewicht toestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.03
  - number: 17.03.2
    text: |-
      De flessen moeten voldoen aan de voorschriften die in een van de lidstaten van kracht zijn. Zij moeten zijn
      voorzien van het officiële stempel ten bewijze van de keuring op basis van de voorgeschreven beproevingen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.03
  - number: 17.04.1
    text: |-
      Aangesloten flessen moeten aan dek zijn opgesteld in een al dan niet ingebouwde flessenkast buiten de verblijven
      en wel zodanig dat het zich verplaatsen aan boord niet wordt gehinderd. De flessenkast mag echter niet op het voor-
      of achterschip tegen de verschansing zijn opgesteld. De flessenkast mag alleen dan in de bovenbouw zijn ingebouwd,
      wanneer zij gasdicht is ten opzichte daarvan en wanneer zij slechts naar de buitenzijde kan worden geopend. Zij
      moet zo zijn ingericht dat de distributieleidingen naar de plaatsen van verbruik zo kort mogelijk zijn. Er mogen
      slechts zo veel flessen voor gelijktijdige afname zijn aangesloten als de verbruiksinstallatie vereist. In geval
      van meer dan één fles moet in elk geval gebruik worden gemaakt van een omschakel- of afsluitinrichting. Per
      flessenkast mogen ten hoogste vier flessen worden aangesloten. Met inbegrip van de reserveflessen mogen zich per
      flessenkast niet meer dan zes flessen aan boord bevinden. Op passagiersschepen met keukens of kantines voor de
      passagiers mogen ten hoogste zes flessen worden aangesloten. Met inbegrip van de reserveflessen mogen zich per
      flessenkast niet meer dan negen flessen aan boord bevinden. De drukregelaar, of in geval van een drukregeling in
      twee trappen, de eerste drukregelaar, moet zich in dezelfde kast bevinden als de flessen en vast zijn ingebouwd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.04
  - number: 17.04.2
    text: |-
      Aangesloten flessen moeten zodanig zijn geplaatst dat in geval van lekkage ontsnappend gas uit de flessenkast in de
      open lucht kan afvloeien, zonder dat daarbij enig gevaar bestaat dat gas doordringt in het inwendige van het schip
      of in aanraking kan komen met een ontstekingsbron.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.04
  - number: 17.04.3
    text: |-
      Flessenkasten moeten zijn vervaardigd van moeilijk ontvlambaar materiaal en door aan de beneden- en bovenzijde
      aangebrachte openingen voldoende worden geventileerd. De flessen moeten staande zijn opgesteld en niet kunnen
      omvallen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.04
  - number: 17.04.4
    text: |-
      De flessenkast moet zodanig zijn ingericht en opgesteld dat de temperatuur van de flessen niet boven 50 °C kan
      stijgen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.04
  - number: 17.04.5
    text: |-
      Aan de buitenzijde van de flessenkast moet het opschrift ‘vloeibaar gas’ en een teken ‘vuur, open licht en roken
      verboden’ met een diameter van ten minste 10 cm, overeenkomstig schets 2 van bijlage 4, zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.04
  - number: '17.05'
    text: |-
      Reserveflessen en lege flessen die zich niet in de flessenkast bevinden moeten buiten de verblijven en het
      stuurhuis in een overeenkomstig [artikel 17.04][ref1] uitgevoerde kast zijn opgeslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.05
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.06.1
    text: |-
      De gebruiksapparaten mogen slechts op de flessen worden aangesloten door middel van een distributienet dat is
      voorzien van één of meer drukregelaars, die de gasdruk verlagen tot de gebruiksdruk. Deze drukvermindering kan
      in één of twee trappen worden bewerkstelligd. Alle drukregelaars moeten op een bepaalde druk overeenkomstig
      [artikel 17.07][ref1] zijn afgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.06
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.06.2
    text: |-
      De laatste drukregelaar moet zijn voorzien van, dan wel worden gevolgd door een inrichting waardoor het
      distributienet automatisch is beveiligd tegen overdruk, wanneer de drukregelaar onvoldoende zou functioneren.
      Gewaarborgd moet zijn dat in geval van een lek uit deze veiligheidsvoorziening ontsnappend gas in de open
      lucht wordt afgevoerd en niet in het inwendige van het schip kan doordringen of in aanraking kan komen met een
      ontstekingsbron; zo nodig moet daartoe een afzonderlijke leiding worden aangelegd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.06
  - number: 17.06.3
    text: Veiligheidsventielen en afblaasleidingen moeten tegen het binnendringen van water zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.06
  - number: 17.07.1
    text: |-
      Bij een drukregeling in twee trappen mag de waarde van de middeldruk niet meer bedragen dan 2,5 bar boven de
      heersende atmosferische druk.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.07
  - number: 17.07.2
    text: |-
      De einddruk van het gas bij het verlaten van de laatste drukregelaar mag niet meer bedragen dan 0,05 bar boven de
      heersende atmosferische druk, waarbij een speling van 10% is toegestaan.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.07
  - number: 17.08.1
    text: |-
      Leidingen moeten uit vast aangelegde stalen of koperen pijpen bestaan. Aansluitleidingen aan de flessen moeten
      evenwel bestaan uit voor propaan geschikte hoge-drukslangen of spiraalvormige pijpen. Gebruiksapparaten die niet
      vast zijn ingebouwd mogen echter zijn aangesloten door middel van geschikte slangen met een lengte van ten hoogste
      1 m.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.08
  - number: 17.08.2
    text: |-
      Leidingen moeten bestand zijn tegen alle aan boord bij normale bedrijfsomstandigheden optredende invloeden,
      met name wat corrosie en sterkte betreft, en door hun eigenschappen en opstelling voldoende gastoevoer naar de
      gebruiksapparaten met betrekking tot hoeveelheid en druk verzekeren.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.08
  - number: 17.08.3
    text: |-
      Pijpleidingen moeten zo weinig mogelijk koppelingen bevatten. De pijpen en koppelingen moeten gasdicht zijn en bij
      alle trillingen en uitzettingen waaraan zij kunnen worden blootgesteld gasdicht blijven.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.08
  - number: 17.08.4
    text: |-
      Pijpleidingen moet goed toegankelijk, behoorlijk bevestigd en overal op die plaatsen beschermd zijn, waar gevaar
      van stoten of wrijvingen bestaat, vooral bij de doorvoeringen door stalen schotten of metalen wanden. Stalen pijpen
      moeten over hun gehele uitwendige oppervlakte corrosiebestendig zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.08
  - number: 17.08.5
    text: |-
      Flexibele leidingen en de koppelingen daarvan moeten bestand zijn tegen alle aan boord bij normale
      bedrijfsomstandigheden optredende invloeden. Zij moeten bovendien zo zijn aangelegd dat zij niet onder spanning
      staan, niet ontoelaatbaar worden verwarmd en over hun gehele lengte kunnen worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.08
  - number: 17.09.1
    text: Het gehele distributienet moet door een steeds gemakkelijk en snel te bereiken hoofdkraan kunnen worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.09
  - number: 17.09.2
    text: |-
      Ieder gebruiksappparaat moet aan een aftakking zijn geplaatst die door middel van een afzonderlijke kraan kan
      worden afgesloten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.09
  - number: 17.09.3
    text: Kranen moeten beschermd tegen weersinvloeden en stoten zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.09
  - number: 17.09.4
    text: |-
      Achter elke drukregelaar moet een testaansluiting zijn aangebracht. Door middel van een kraan moet zijn gewaarborgd
      dat de drukregelaar bij een test niet aan de testdruk wordt blootgesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.09
  - number: 17.10.1
    text: |-
      Er mogen slechts gebruiksapparaten worden geïnstalleerd die in één van de lidstaten voor propaan zijn toegelaten.
      Zij moeten van inrichtingen zijn voorzien waardoor het uitstromen van gas bij het uitgaan van zowel de branders als
      de waakvlam geheel wordt verhinderd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.10
  - number: 17.10.2
    text: |-
      Elk gebruiksapparaat moet zodanig zijn opgesteld en aangesloten dat het niet kan omvallen of onopzettelijk
      verschuiven en dat onopzettelijk losraken van de aansluitleidingen niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.10
  - number: 17.10.3
    text: |-
      Verwarmingstoestellen, geisers en koelkasten moeten zijn voorzien van een leiding waardoor verbrandingsgassen in de
      open lucht worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.10
  - number: 17.10.4
    text: |-
      Gebruiksapparaten mogen slechts in het stuurhuis zijn opgesteld, wanneer deze zo is gebouwd dat eventueel
      ontsnappend gas niet vanuit het stuurhuis in de lager gelegen gedeelten van het schip, met name via doorvoeringen
      van de afstandbedieningen in de machinekamer, kan doordringen.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.10
  - number: 17.10.5
    text: |-
      Gebruiksapparaten mogen in slaapruimten slechts worden opgesteld, wanneer de verbranding onafhankelijk van de in
      deze ruimte aanwezige lucht plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.10
  - number: 17.10.6
    text: |-
      Gebruiksapparaten waarvan de verbranding afhankelijk van de in de ruimte aanwezige lucht plaatsvindt moeten in een
      ruimte van voldoende afmeting zijn opgesteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.10
  - number: 17.11.1
    text: |-
      De ventilatie in de ruimten, waarin gebruiksapparaten zijn opgesteld waarvan de verbranding afhankelijk van de in
      de ruimte aanwezige lucht plaatsvindt, moet zijn verzekerd door ventilatieopeningen van voldoende afmetingen, elk
      echter met een vrije doorsnede van ten minste 150 cm2.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.11
  - number: 17.11.2
    text: Ventilatieopeningen mogen geen afsluitinrichtingen hebben en niet in verbinding staan met slaapruimten.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.11
  - number: 17.11.3
    text: |-
      Afvoerkanalen moeten zo zijn uitgevoerd dat de verbrandingsgassen afdoende worden afgevoerd. Zij moeten
      bedrijfszeker en onbrandbaar zijn. Ventilatoren voor de luchtverversing van verblijven mogen de afvoer niet nadelig
      beïnvloeden.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.11
  - number: '17.12'
    text: |-
      Op een geschikte plaats aan boord moet een gebruiksinstructie zijn aangebracht; hierop moeten ten minste de
      volgende opschriften voorkomen: ‘De afsluitkranen van de flessen, die niet op het distributienet zijn aangesloten,
      moeten zijn gesloten, zelfs wanneer de flessen geacht worden leeg te zijn.’ ‘De slangen moeten worden vervangen,
      zodra hun toestand dit noodzakelijk maakt.’ ‘Alle gebruiksapparaten moeten zijn aangesloten, tenzij de bijbehorende
      toevoerleidingen zijn gesloten.’
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.12
  - number: '17.13'
    text: 'Een erkend deskundige keurt of de vloeibaargasinstallaties in overeenstemming zijn met dit hoofdstuk:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.13
  - number: 17.13.a)
    text: vóór de eerste ingebruikstelling;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.13
  - number: 17.13.b)
    text: vóór een hernieuwde ingebruikstelling na een wezenlijke verandering of reparatie, en
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.13
  - number: 17.13.c)
    text: |-
      bij iedere vernieuwing van de in [artikel 17.15][ref1] bedoelde aantekening.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.13
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '17'
        hoofdstuk: '17'
  - number: '17.14'
    text: 'Het beproeven van de installatie moet onder de volgende voorwaarden geschieden:'
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.14
  - number: 17.14.1
    text: |-
      Pijpleidingen voor de middeldruk tussen de in [artikel 17.09, vierde lid][ref1], bedoelde kraan van de eerste
      drukregelaar en de kranen voor de laatste drukregelaars:


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.14
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.14.1.a)
    text: |-
      een sterktebeproeving uitgevoerd met lucht, met een inert gas of met een vloeistof, onder een druk van 20 bar boven
      de heersende atmosferische druk;
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.14
  - number: 17.14.1.b)
    text: |-
      een beproeving van de luchtdichtheid, uitgevoerd met lucht of met een inert gas, onder een druk van 3,5 bar boven
      de heersende atmosferische druk.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.14
  - number: 17.14.2
    text: |-
      Pijpleidingen onder de bedrijfsdruk tussen de in [artikel 17.09, vierde lid][ref1], bedoelde kraan van de
      enige drukregelaar of de drukregelaar van de laatste trap en de kranen voor de gebruiksapparaten: beproeving
      van de luchtdichtheid, uitgevoerd met lucht of met een inert gas, onder een druk van 1 bar boven de heersende
      atmosferische druk.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.14
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.14.3
    text: |-
      Leidingen tussen de in [artikel 17.09, vierde lid][ref1], bedoelde kraan van de enige drukregelaar of van
      de drukregelaar van de laatste trap en de bedieningsarmaturen van de gebruiksapparaten: beproeving van de
      luchtdichtheid onder een druk van 0,15 bar boven de heersende atmosferische druk.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.14
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.14.4
    text: |-
      Bij de beproevingen, bedoeld in het eerste lid, onderdeel b, het tweede en het derde lid, worden de leidingen
      als dicht beschouwd, wanneer de testdruk na een voor aanpassing aan de temperatuur voldoende wachttijd en een
      aansluitende beproevingsduur van 10 minuten niet daalt.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.14
  - number: 17.14.5
    text: |-
      De aansluitingen aan de flessen, de verbindingsstukken en de armaturen die onder flessendruk staan, alsmede de
      aansluiting van de regelaar aan de gebruiksleiding: beproeving onder bedrijfsdruk van de luchtdichtheid met een
      schuimvormend middel.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.14
  - number: 17.14.6
    text: |-
      Gebruiksapparaten moeten bij de nominale belasting in gebruik worden genomen en worden gecontroleerd op goed
      branden bij verschillende instellingen van de regelknop. De ontstekingsbeveiligingen moeten op hun goede werking
      worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.14
  - number: 17.14.7
    text: |-
      Na de in het zesde lid bedoelde controle moet voor ieder gebruiksapparaat dat aan een afvoergassenleiding is
      aangesloten, na vijf minuten functioneren bij nominale belasting met gesloten ramen en deuren en in werking zijnde
      ventilatie-inrichtingen, worden gecontroleerd of verbrandingsgassen naar buiten uittreden. Wanneer het ontsnappen
      van verbrandingsgassen niet van voorbijgaande aard is, moet onmiddellijk de oorzaak worden opgespoord. Het apparaat
      mag niet voor gebruik worden vrijgegeven, voordat alle gebreken zijn hersteld.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.14
  - number: 17.15.1
    text: |-
      Voor elke vloeibaargasinstallatie die aan de eisen van dit hoofdstuk voldoet moet een aantekening worden geplaatst
      in het binnenschipcertificaat.
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.15
  - number: 17.15.2
    text: |-
      Deze aantekening wordt afgegeven door de Commissie van deskundigen geplaatst na de in [artikel 17.13][ref1]
      bedoelde keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '17'
        hoofdstuk: '17'
  - number: 17.15.3
    text: |-
      De geldigheidsduur van de aantekening bedraagt maximum drie jaar. Vóór iedere vernieuwing dient een nieuwe keuring
      overeenkomstig [artikel 17.13][ref1] plaats te vinden. Bij wijze van uitzondering kan de Commissie van deskundigen
      op een met redenen omkleed verzoek van de eigenaar van een schip of zijn vertegenwoordiger de geldigheidsduur van
      het attest met maximum drie maanden verlengen, zonder dat eerst een keuring overeenkomstig [artikel 17.13][ref2]
      heeft plaatsgehad. Deze verlenging wordt in het binnenschipcertificaat aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel17
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel17.15
    references:
      - id: ref1
        bwb_id: BWBR0041395
        artikel: '17'
        hoofdstuk: '17'
      - id: ref2
        bwb_id: BWBR0041395
        artikel: '17'
        hoofdstuk: '17'
  - number: '18.00'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *‘boordzuiveringsinstallatie’:* een compact gebouwde zuiveringsinstallatie
      voor de reiniging van huishoudelijk afvalwater aan boord van schepen;
        - *‘typegoedkeuring’:* de beslissing waarbij de bevoegde autoriteit verklaart dat een boordzuiveringsinstallatie
      aan de technische voorschriften van dit [hoofdstuk 18][ref1] voldoet;
        - *‘speciale test’:* de procedure overeenkomstig [artikel 18.09][ref2], waarbij door de bevoegde autoriteit wordt
      gewaarborgd dat de in een vaartuig in gebruik zijnde boordzuiveringsinstallatie aan de voorschriften van dit
      [hoofdstuk 18][ref3] voldoet;
        - *‘fabrikant’:* de persoon of organisatie die tegenover de bevoegde autoriteit verantwoordelijk is voor alle
      aspecten van de typegoedkeuringsprocedure en voor de conformiteit van de productie. Het is niet noodzakelijk dat
      deze persoon of organisatie rechtstreeks betrokken is bij alle fasen van de bouw van de boordzuiveringsinstallatie.
      Indien de boordzuiveringsinstallatie pas na haar oorspronkelijke fabricage door veranderingen en aanvullingen
      wordt aangepast voor gebruik op een vaartuig in de zin van dit [hoofdstuk 18][ref4], is de fabrikant gewoonlijk de
      persoon of de organisatie die deze veranderingen of aanvullingen heeft uitgevoerd;
        - *‘inlichtingenformulier’:* het formulier bedoeld in bijlage 7, onderdeel II, waarin staat vermeld welke gegevens
      door de aanvrager moeten worden verstrekt;
        - *‘informatiedossier’:* het geheel van gegevens, tekeningen, foto’s en andere bescheiden die de aanvrager
      overeenkomstig de eisen van het inlichtingenformulier aan de technische dienst of de bevoegde autoriteit moet
      verstrekken;
        - *‘informatiepakket’:* het informatiedossier plus alle testrapporten en andere documenten die de technische dienst
      of de bevoegde autoriteit tijdens de uitvoering van hun taken aan het informatiedossier hebben toegevoegd;
        - *‘certificaat van typegoedkeuring’:* het document bedoeld in bijlage 7, onderdeel III, waarin de bevoegde
      autoriteit de typegoedkeuring vaststelt;
        - *‘proces-verbaal van de kenmerken van de boordzuiveringsinstallatie’:* het document, bedoeld in bijlage
      7, onderdeel VIII, waarin alle kenmerken van de boordzuiveringsinstallatie, met inbegrip van de onderdelen
      (componenten) en afstellingen die een weerslag hebben op het niveau van de afvalwaterreiniging, evenals alle
      veranderingen daarvan, vastgelegd zijn;
        - *‘inlichtingenformulier van de fabrikant ter controle van de componenten betrekking hebbend op
      de afvalwaterreiniging en kenmerken van de boordzuiveringsinstallatie’:* het document bedoeld in
      [artikel 18.09, vierde lid][ref5], ten behoeve van de speciale test;
        - *‘huishoudelijk afvalwater’:* afvalwater uit keukens, eetruimten, wasruimten en bijkeukens, evenals uit de
      toiletten;
        - *‘zuiveringsslib’:* restanten die bij gebruik van een zuiveringsinstallatie aan boord van het schip ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk18
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk18
      [ref4]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk18
      [ref5]: https://wetten.overheid.nl/BWBR0041395#Artikel18
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel18.00
    references:
      - id: ref1
        bwb_id: BWBR0041395
        hoofdstuk: '18'
      - id: ref2
        bwb_id: BWBR0041395
