  - number: '30.01'
    text: |-
      1. In dit hoofdstuk wordt verstaan onder ‘voortstuwings- en hulpsystemen’ elk systeem dat brandstof gebruikt, met
      inbegrip van:

      a) brandstoftanks en tankaansluitingen,

      b) gasverwerkingssystemen,

      c) leidingen en afsluiters,

      d) motoren en turbines,

      e) besturings-, bewakings- en veiligheidssystemen.

      2. In afwijking van de [artikelen 8.01, derde lid][ref1], en
      [artikel 8.05 eerste, zesde, negende, elfde en twaalfde lid][ref2] en de bepalingen van [hoofdstuk 9][ref3] mogen
      voortstuwings- en hulpsystemen die brandstoffen gebruiken met een vlampunt van 55 °C of minder op een vaartuig
      worden geïnstalleerd, mits aan de in dit hoofdstuk en bijlage 8 vermelde eisen is voldaan.

      3. Voortstuwings- en hulpsystemen als bedoeld in het tweede lid moeten onder toezicht van de Commissie van
      deskundigen worden gebouwd en geïnstalleerd.

      4. Voor het verrichten van taken uit hoofde van dit hoofdstuk kan de Commissie van deskundigen een beroep doen op
      een technische dienst als bedoeld in [artikel 30.07][ref4].

      5. Vóór de eerste ingebruikstelling van een voortstuwings- of hulpsysteem als bedoeld in het tweede lid moeten de
      volgende bescheiden aan de Commissie van deskundigen worden voorgelegd:

      a) een risicobeoordeling overeenkomstig bijlage 8,

      b) een beschrijving van het voortstuwings- of hulpsysteem,

      c) bouwtekeningen van het voortstuwings- of hulpsysteem,

      d) een diagram van de druk en temperatuur in het systeem,

      e) een gebruiksaanwijzing met alle procedures voor het gebruik van het systeem in de praktijk,

      f) een veiligheidsrol overeenkomstig [artikel 30.03][ref5],

      g) een kopie van de verklaring van keuring als bedoeld in [artikel 30.02, vierde lid][ref6].

      6. Er moet een kopie van de in het vijfde lid genoemde bescheiden aan boord voorhanden zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel8.01
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel8.05
      [ref3]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk9
      [ref4]: https://wetten.overheid.nl/BWBR0041395#Artikel30.07
