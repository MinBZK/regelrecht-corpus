  - number: '33.01'
    text: |-
      1. De bepalingen in [artikel 33.02 tot en met 33.03][ref1] gelden voor vaartuigen die uitsluitend waterwegen buiten
      de Rijn (zone R) bevaren:

      a) waarvoor voor de eerste maal vóór 30 december 2008 een communautair certificaat,

      b) waarvoor vóór 30 december 2008 een andere vergunning voor het in de vaart brengen is afgegeven.

      2. Voor vaartuigen moet worden bewezen dat ze op de datum van afgifte van hun communautair certificaat of van de
      andere vergunning voor het in de vaart brengen voldoen aan de technische voorschriften van de hoofdstukken 1 tot en
      met 12 van bijlage II van Richtlijn nr. 82/714/EEG.

      3. De communautaire certificaten die vóór 30 december 2008 afgegeven zijn, blijven tot de op het certificaat
      aangegeven datum geldig.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel33.02
    url: https://wetten.overheid.nl/BWBR0041395/2018-10-07#Artikel33.01
