  - number: '10.12'
    text: |-
      1. Schakelborden:

      a) Apparaten, schakelaars, zekeringen en instrumenten in schakelborden moeten overzichtelijk zijn gerangschikt en
      ten behoeve van onderhoud en reparatie toegankelijk zijn.

      Aansluitklemmen voor spanningen tot en met 50 V en die voor spanningen boven 50 V moeten van elkaar gescheiden zijn
      aangebracht en doelmatig gekenmerkt zijn.

      b) Op de schakelborden moeten naamplaatjes voor alle schakelaars en apparaten met de aanduiding van de stroomkring
      zijn aangebracht.

      c) Indien zich achter de deuren apparaten met een bedrijfsspanning van meer dan 50 V bevinden, moeten de onder
      spanning staande delen van deze apparaten tegen onvoorzien aanraken bij geopende deuren zijn beschermd.

      d) Materialen van schakelborden moeten mechanisch sterk, duurzaam, moeilijk ontvlambaar, zelfdovend en niet
      hygroscopisch zijn.

      e) Zijn in schakelborden laagspannings- hoogvermogensmeltveiligheden (NH) ingebouwd, dan moeten in de nabijheid van
      deze schakelborden adequate hulpmiddelen en persoonlijke beschermingsmiddelen aanwezig zijn om de smeltdraden te
      kunnen vervangen.

      2. Schakelaars, beveiligingen:

      Veiligheden moeten met de nominale stroom en de stroomkring zijn aangeduid.

      a) Generator- en afgaande groepen moeten in elke niet geaarde geleider tegen kortsluiting en overbelasting
      beveiligd zijn. Daartoe kunnen schakeltoestellen met kortsluit- en overbelastingbeveiliging of smeltveiligheden
      worden gebruikt.

      Stroomkringen van de elektrische aandrijving van stuurinrichtingen overeenkomstig [artikel 6.04][ref1],
      alsmede de stuurstroomkringen van stuurinrichtingen, mogen alleen tegen kortsluiting zijn beveiligd.
      Indien vermogensschakelaars met een thermische uitschakelinrichting worden toegepast, moeten de thermische
      uitschakelinrichtingen buiten werking zijn gesteld of op ten minste tweemaal de nominale stroom zijn afgesteld.

      b) De afgaande groepen van het hoofdschakelbord moeten bij stroomsterkten van meer dan 16 A van last- of
      vermogensschakelaars zijn voorzien.

      c) Verbruikers die voor de voortstuwing, de stuurinrichting overeenkomstig [hoofdstuk 6][ref2], de
      roerstandaanwijzer, de navigatie en de beveiligingssystemen noodzakelijk zijn, alsmede de verbruikers met een
      nominale stroom van meer dan 16 A, moeten via afzonderlijke stroomkringen worden gevoed.

      d) Stroomkringen van verbruikers die voor de voortstuwing en het manoeuvreren noodzakelijk zijn, moeten
      rechtstreeks vanuit het hoofdschakelbord worden gevoed.

      e) Schakeltoestellen moet volgens de nominale stroom, thermische en dynamische sterkte alsmede het schakelvermogen
      worden gekozen. Schakelaars moeten alle onder spanning staande geleiders gelijktijdig schakelen. De schakelstand
      moet eenvoudig zichtbaar zijn.

      f) Smeltdraden moeten van het gesloten type zijn en uit keramisch of gelijkwaardig materiaal bestaan. Zij moeten
      zonder aanrakingsgevaar voor personen kunnen worden vervangen.

      3. Meet- en controle-inrichtingen:

      a) Voor generator-, accumulator- en verdeelstroomkringen moeten meet- en controle-inrichtingen, die voor een veilig
      gebruik van de installatie noodzakelijk zijn, aanwezig zijn.

      b) Niet geaarde netten met een spanning boven de 50 V moeten van een doelmatige aardfoutbewakingsinrichting
      met zowel een optisch als een akoestisch alarm zijn voorzien. Voor secundaire inrichtingen, zoals
      stuurstroomschakelingen, kan van een aardfoutbewakingsinrichting worden afgezien.

      4. Opstelling van schakelborden:

      a) Schakelborden moeten in goed toegankelijke en goed geventileerde ruimten zijn opgesteld, zodanig dat zij tegen
      waterschade en mechanische beschadigingen zijn beschermd.

      Pijpleidingen en luchtkanalen moeten zodanig zijn geplaatst, dat schakelborden bij lekkages geen gevaar lopen.
      Indien de ligging in de nabijheid van schakelborden niet vermeden kan worden, mogen de leidingen en kanalen op die
      plaats geen losneembare koppelingen hebben.

      b) Kasten en nissen waarin open schakeltoestellen zijn ondergebracht, moeten uit moeilijk ontvlambaar materiaal
      bestaan, dan wel door een bekleding van metaal of een ander niet brandbaar materiaal zijn beschermd.

      c) Bij spanningen boven 50 V moeten aan de bedieningszijde van het hoofdschakelbord isolerende roosters of matten
      liggen.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel6.04
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk6
