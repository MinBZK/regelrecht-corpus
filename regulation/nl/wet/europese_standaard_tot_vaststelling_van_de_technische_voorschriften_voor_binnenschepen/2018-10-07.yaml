  - number: '13.03'
    text: |-
      1. Op de volgende plaatsen moet telkens één draagbaar blustoestel overeenkomstig de Europese normen EN 3-7 : 2007
      en EN 3-8 : 2007 aanwezig zijn:

      a) in het stuurhuis;

      b) in de nabijheid van iedere toegang van het dek naar de verblijven;

      c) in de nabijheid van iedere toegang tot niet van de verblijven uit toegankelijke bedrijfsruimten waarin zich
      verwarmings-, kook-, of koelinstallaties bevinden, die op vaste of vloeibare brandstoffen werken dan wel op
      vloeibaar gas;

      d) bij iedere toegang tot machinekamers of ketelruimen;

      e) op geschikte plaatsen benedendeks in de machinekamers en ketelruimen, en wel zodanig dat de afstand tot een
      brandblusapparaat vanaf geen enkel punt van deze ruimten meer dan tien meter bedraagt.

      2. Als draagbare blustoestellen, voorgeschreven in lid 1, mogen slechts poederblussers worden gebruikt met een
      inhoud van ten minste 6 kg dan wel andere draagbare blustoestellen met eenzelfde bluscapaciteit. Zij moeten
      geschikt zijn voor de brandklassen A, B en C.

      Afwijkend daarvan zijn op schepen waarop geen vloeibaargasinstallaties zijn geïnstalleerd,
      sproeischuimbrandblussers met tot – 20 °C vorstvrije blusmiddelen bestaande uit water met AFFF-AR-schuim (Aqua
      Film Forming Foam) toegestaan, ook wanneer deze niet voor de brandklasse C geschikt zijn. De minimuminhoud van deze
      brandblussers moet 9 liter bedragen.

      Alle brandblussers moeten voor het blussen van branden in elektrische installaties tot 1.000 V geschikt zijn.

      3. Daarnaast mogen poederblussers, blussers met vloeibare inhoud of schuimblussers worden gebruikt indien deze
      ten minste geschikt zijn voor die brandklasse, welke in de ruimte waarvoor het toestel bestemd is het meest
      waarschijnlijk is.

      4. Draagbare blustoestellen die als blusmiddel CO bevatten mogen slechts voor het blussen van branden in keukens en
      elektrische inrichtingen worden aangewend. De inhoud van deze blustoestellen mag niet meer bedragen dan 1 kg voor
      iedere 15 m3 van de ruimte waarin zij worden bewaard en gebruikt.

      5. Draagbare blustoestellen moeten ten minste iedere twee jaar door een deskundige worden gekeurd. Hiervan moet een
      kenmerking op het blustoestel worden aangebracht, ondertekend door de deskundige die de keuring heeft verricht, en
      waarop de datum van de keuring is aangegeven.

      6. Wanneer draagbare blustoestellen door hun wijze van opstelling aan het gezicht zijn onttrokken moet de bedekking
      of afscherming zijn voorzien van een teken ‘brandblusapparaat’ met een lengte van de zijde van ten minste 10 cm,
      overeenkomstig schets 3 van bijlage 4.
