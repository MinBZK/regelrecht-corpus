  - number: '4.05'
    text: |-
      Wanneer het vlak van de grootste inzinking voor zone 3 is vastgesteld onder de voorwaarde dat de laadruimen
      spatwater- en regendicht moeten kunnen worden gesloten en de afstand tussen het vlak van de grootste inzinking en
      de bovenrand van de dennenboom minder dan 500 mm bedraagt, moet de ten hoogste toegelaten inzinking voor de vaart
      met open laadruimen worden vastgesteld.

      In het binnenschipcertificaat moet dan worden ingevuld:

      ‘Wanneer de luiken van de laadruimen geheel of gedeeltelijk zijn geopend, mag het schip ten hoogste tot … mm onder
      de inzinkingsmerken voor zone 3 / zone R zijn beladen.’
