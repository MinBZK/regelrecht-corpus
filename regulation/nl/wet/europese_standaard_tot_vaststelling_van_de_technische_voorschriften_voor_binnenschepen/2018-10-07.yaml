  - number: '22.08'
    text: |-
      Indien gebruik wordt gemaakt van een verminderd resterend vrijboord als bedoeld in
      [artikel 22.05, derde lid][ref1], moet voor alle bedrijfsomstandigheden zijn aangetoond dat

      a) na correctie voor vrije vloeistofoppervlakken de metacentrumhoogte niet minder dan 0,15 m bedraagt;

      b) binnen een slagzij van 0° tot en met 30° een oprichtende arm van ten minste

      *h* = 0,30 – 0,28 • *φ* [*m*]

      aanwezig is. Daarbij is *φ* de hellingshoek, waar vandaan de stabiliteitskromme negatief wordt
      (stabiliteitsomvang). Hij mag niet kleiner zijn dan 20° of 0,35 rad en moet in de formule op ten hoogste 30° of
      0,52 rad worden gesteld, waarbij voor *φ* de eenheid radiaal (rad) moet worden gebruikt (1° = 0,01745 rad);

      c) de som van de hoeken resulterend uit slagzij en trim niet meer dan 10° bedraagt;

      d) een resterende veiligheidsafstand als bedoeld in [artikel 22.04][ref2] aanwezig is;

      e) een resterend vrijboord van ten minste 0,05 m aanwezig is;

      f) binnen een slagzij van 0° tot en met 30° een resterende arm van ten minste

      *h* = 0,20 – 0,23 • *φ* [*m*]

      aanwezig is. Daarbij is *φ* de hellingshoek, waarvandaan de stabiliteitskromme negatief wordt; deze moet in de
      formule op ten hoogste 30° of 0,52 rad worden gesteld.

      Onder resterende arm moet worden verstaan het tussen 0° en 30° hellingshoek aanwezige grootste verschil tussen de
      kromme van de oprichtende armen en de kromme van de kenterende armen. Indien een opening naar het inwendige van
      het schip in het water terecht komt bij een hellingshoek die kleiner is dan de hellingshoek die bij het grootste
      verschil hoort, is de eis inzake de resterende arm van toepassing op deze hellingshoek.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel22.05
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel22.04
