  - number: '19.02'
    text: |-
      1. Bij een periodiek onderzoek wordt de dikte van de scheepshuid van stalen passagiersschepen als volgt
      vastgesteld:

      a) De minimale dikte *t* van de bodem-, kim- en zijbeplating van de scheepshuid van passagiersschepen wordt bepaald
      volgens de grootste waarde van de volgende formules:

      Daarbij betekent:

      *F* = 1 + 0,0013 • (*a* – 500)

      *a* = spantafstand in de lengte of de breedte [mm]; bij een kleinere spantafstand dan 400 mm moet *a* worden
      genomen.

      b) De uit onderdeel a voortvloeiende minimale waarde voor de plaatdikte behoeft niet te worden gehaald, wanneer
      de toegestane waarde op basis van een rekenkundig bewijs voor de voldoende sterkte van de scheepsromp (langs- en
      dwarssterkte als ook plaatselijke sterkte) is vastgelegd en dit uit een verklaring blijkt.

      c) Op geen enkele plaats van de scheepshuid mag de volgens onderdeel a of onderdeel b berekende waarde minder zijn
      dan 3 mm.

      d) Platen moeten worden vervangen, wanneer de dikte van de bodem-, kim- of zijplaten niet langer de volgens
      onderdelen a of b, in samenhang met onderdeel c, vastgestelde minimale waarde heeft.

      2. Het aantal en de indeling van de schotten moeten zodanig zijn gekozen dat het schip in lekke toestand volgens
      de standaarden van [artikel 19.03, zevende tot en met dertiende lid][ref1], kan blijven drijven. Ieder deel van
      de interne constructie, die de functionaliteit van de indeling van het schip beïnvloedt, moet waterdicht en zo
      geconstrueerd zijn, dat de integriteit van de indeling in stand blijft.

      3. Voor het bepalen van de plaats van het aanvaringsschot en het achterpiekschot gelden de bepalingen van
      [artikel 3.03, eerste lid][ref2], waarbij afwijkend daarvan als referentiegrootte de lengte in de waterlijn *L* in
      plaats van de lengte *L* moet worden gebruikt.

      4. In een dwarsschot mag een sprong of nis voorkomen, mits alle delen van de sprong of nis binnen de veilige zone
      zijn gelegen.

      5. De schotten die bij de lekberekening als bedoeld in [artikel 19.03, zevende tot en met dertiende lid][ref3],
      in aanmerking zijn genomen, moeten waterdicht zijn en tot boven het schottendek opgetrokken zijn. Ontbreekt het
      schottendek, dan moeten zij ten minste 0,20 m boven de indompelingsgrenslijn zijn opgetrokken.

      6. Het aantal openingen in deze schotten moet zo gering worden gehouden als vanwege de bouwwijze en voor de normale
      bedrijfsvoering van het schip toelaatbaar is. Openingen en doorvoeringen mogen de waterdichte functie van de
      schotten niet nadelig beïnvloeden.

      7. In het aanvaringsschot zijn openingen en deuren niet toegestaan.

      8. In schotten die machinekamers van passagiersruimten of woonruimten voor het boordpersoneel scheiden, zijn deuren
      niet toegestaan.

      9. Met de hand te bedienen deuren in schotten als bedoeld in het vijfde lid die niet op afstand bediend kunnen
      worden, zijn slechts toegestaan buiten de voor passagiers bestemde plaatsen. Zij moeten:

      a) voortdurend gesloten blijven en mogen slechts voor passage kortstondig worden geopend;

      b) snel en veilig door geschikte inrichtingen gesloten kunnen worden;

      c) aan beide zijden voorzien zijn van het opschrift:

      ‘Deur na doorgang direct sluiten’.

      10. Deuren in schotten als bedoeld in het vijfde lid die langdurig open staan moeten aan de volgende eisen voldoen:

      a) zij moeten ter plaatse aan beide zijden van het schot en vanaf een goed toegankelijke plaats boven het
      schottendek kunnen worden gesloten;

      b) na sluiting door afstandsbediening moeten de deuren ter plaatse opnieuw kunnen worden geopend en op veilige
      wijze worden gesloten. Het afsluitproces mag met name niet door tapijten of drempels gehinderd worden;

      c) de duur van het sluiten door afstandsbediening moet ten minste 30 seconden bedragen, maar mag niet meer bedragen
      dan 60 seconden;

      d) tijdens het sluiten moet bij de deur automatisch een akoestisch alarmsignaal worden gegeven;

      e) gewaarborgd moet zijn dat het bedienen van deur en het alarmsignaal ook onafhankelijk van het boordnet kunnen
      geschieden. Ter plaatse van de afstandsbediening moet een inrichting aanwezig zijn die aangeeft of de deur open dan
      wel gesloten is.

      11. Alle deuren in schotten als bedoeld in het vijfde lid en hun bedieningsinrichtingen moeten in de veilige zone
      liggen.

      12. In het stuurhuis moet een alarminstallatie aanwezig zijn, die aangeeft welke deur in schotten als bedoeld in
      het vijfde lid geopend is.

      13. Pijpleidingen met open uitmondingen en ventilatiekanalen moeten zo zijn aangelegd, dat daardoor bij elke
      lektoestand geen water naar andere ruimten of tanks kan stromen:

      a) Wanneer verschillende compartimenten door middel van pijpleidingen of ventilatiekanalen met elkaar in open
      verbinding staan, moeten deze op een geschikte plaats tot boven de ongunstigste lastlijn in lekke toestand worden
      geleid.

      b) Pijpleidingen behoeven niet aan onderdeel a te voldoen, wanneer op de doorboorde schotten afsluiters zijn
      aangebracht, die van boven het schottendek op afstand kunnen worden bediend.

      c) Wanneer een pijpleidingsysteem in een compartiment geen open uitmonding heeft, wordt de pijpleiding bij
      beschadiging van dit compartiment als onbeschadigd beschouwd, wanneer zij binnen de veilige zone loopt en de
      afstand tot de scheepsbodem meer dan 0,50 m bedraagt.

      14. Afstandsbedieningen van deuren in schotten als bedoeld in het tiende lid en afsluitmechanismen als bedoeld in
      het dertiende lid, onderdeel b, boven het schottendek moeten als zodanig duidelijk gemarkeerd zijn.

      15. Bij een dubbele bodem moet de hoogte daarvan en bij dubbele wanden de breedte daarvan ten minste 0,60 m
      bedragen.

      16. Vensters mogen onder de indompelingsgrenslijn liggen, wanneer zij waterdicht zijn, niet geopend kunnen worden,
      een voldoende sterkte bezitten en voldoen aan [artikel 19.06, veertiende lid][ref4].


