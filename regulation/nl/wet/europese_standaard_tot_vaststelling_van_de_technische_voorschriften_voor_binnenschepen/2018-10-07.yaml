  - number: '29.07'
    text: |-
      Snelle schepen moeten zijn uitgerust met:

      a) een navigatieradarinstallatie en een bochtaanwijzer, bedoeld in [artikel 7.06, eerste lid][ref1], en

      b) individuele reddingsmiddelen, die direct bereikbaar zijn ondergebracht, overeenkomstig
      [artikel 19.09, vierde lid][ref2], voor het ten hoogste toegelaten aantal personen aan boord.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel7.06
      [ref2]: https://wetten.overheid.nl/BWBR0041395#Artikel19.09
