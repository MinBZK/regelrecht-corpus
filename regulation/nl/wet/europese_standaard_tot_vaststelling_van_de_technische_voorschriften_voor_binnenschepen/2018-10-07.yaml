  - number: '32.05'
    text: |-
      1. De onderstaande bepalingen gelden voor:

      a) vaartuigen waarvoor vanaf 1 januari 1995 voor de eerste maal een certificaat van onderzoek voor Rijnschepen
      overeenkomstig het Reglement onderzoek schepen op de Rijn is afgegeven voorzover die op 31 december 1994 niet in
      aanbouw dan wel in verbouw waren,

      b) vaartuigen waarvoor tussen 1 januari 1995 en 30 december 2008 een andere vergunning voor het in de vaart brengen
      is afgegeven,

      c) vaartuigen waarvoor tussen 30 december 2008 en 6 october 2018 voor de eerste maal een communautair certificaat
      geldig voor zone R overeenkomstig [richtlijn 2006/87/EG](32006L0087) werd afgegeven,

      d) vaartuigen waarvoor vanaf 7 october 2018 voor de eerste maal een Uniecertificaat geldig voor zone R
      overeenkomstig richtlijn (EU) 2016/1629 is afgegeven.

      2. Voor deze vaartuigen moet worden aangetoond

      a) dat zij voldoen aan de versie van het Reglement onderzoek schepen op de Rijn die van kracht is op de datum
      waarop het certificaat van onderzoek voor Rijnschepen of een andere vergunning voor het in de vaart brengen of

      b) dat zij voldoen aan de bepalingen van [Richtlijn 2006/87/EG](32006L0087) van toepassing voor zone R, zoals van
      toepassing op de datum van de uitgifte van het communautair certificaat, of

      c) dat zij voldoen aan de bepalingen van Richtlijn (EU) 2016/1629 van toepassing voor zone R, zoals van toepassing
      op de datum van de uitgifte van het Uniecertificaat

      is afgegeven.

      3. Deze vaartuigen moeten aan deze Standaard volgens de in onderstaande tabel vermelde overgangsbepalingen worden
      aangepast.

      4. [Artikel 32.04, vierde en vijfde lid][ref1], is van overeenkomstige toepassing.

      5. In de onderstaande tabel zijn de volgende definities van toepassing:

      ‘N.V.O.’: het voorschrift is niet van toepassing op reeds in bedrijf zijnde vaartuigen, tenzij de betreffende
      delen worden vervangen of omgebouwd, dat wil zeggen dat dit voorschrift slechts van toepassing is op *N*ieuwbouw,
      bij *V*ervanging of bij Ombouw van de betreffende delen of sectoren. Worden bestaande delen vervangen door delen
      welke in technische zin en bouwwijze gelijk zijn, dan wordt dit niet beschouwd als vervanging ‘V’ volgens deze
      overgangsbepalingen.

      ‘Afgifte of verlenging van het binnenschipcertificaat’: aan het voorschrift moet zijn voldaan bij de eerstvolgende
      afgifte of bij de eerstvolgende verlenging van het binnenschipcertificaat na de daarop aangegeven datum.












