  - number: '17.15'
    text: |-
      1. Voor elke vloeibaargasinstallatie die aan de eisen van dit hoofdstuk voldoet moet een aantekening worden
      geplaatst in het binnenschipcertificaat.

      2. Deze aantekening wordt afgegeven door de Commissie van deskundigen geplaatst na de in [artikel 17.13][ref1]
      bedoelde keuring.

      3. De geldigheidsduur van de aantekening bedraagt maximum drie jaar. Vóór iedere vernieuwing dient een nieuwe
      keuring overeenkomstig [artikel 17.13][ref2] plaats te vinden.

      Bij wijze van uitzondering kan de Commissie van deskundigen op een met redenen omkleed verzoek van de eigenaar
      van een schip of zijn vertegenwoordiger de geldigheidsduur van het attest met maximum drie maanden verlengen,
      zonder dat eerst een keuring overeenkomstig [artikel 17.13][ref3] heeft plaatsgehad. Deze verlenging wordt in het
      binnenschipcertificaat aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Artikel17.13
