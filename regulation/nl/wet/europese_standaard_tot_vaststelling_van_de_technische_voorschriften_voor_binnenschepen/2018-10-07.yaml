  - number: 32.04.3
    text: |-
      Vaartuigen, waarvan de kiel is gelegd vóór 1 juli 1983, behoeven niet te voldoen aan [hoofdstuk 10][ref1] van deze
      standaard. Deze vaartuigen moeten echter ten minste voldoen aan hoofdstuk 6 van het Reglement onderzoek schepen op
      de Rijn van de op 31 maart 1983 geldende voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0041395#Hoofdstuk10
