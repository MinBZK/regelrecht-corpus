  - number: 51.1.a
    text: een last onder bestuursdwang opleggen; en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel51
  - number: 51.1.b
    text: een bestuurlijke boete opleggen.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel51
  - number: '51.2'
    text: |-
      Onze Minister kan in geval van overtreding van de [artikelen, 10, eerste lid][ref1], [26, eerste lid][ref2],
      [28, vijfde lid][ref3], [30][ref4], [37, tweede lid][ref5], [40, zesde lid en zevende lid][ref6],
      [41 eerste lid en tweede lid][ref7], [42, derde lid][ref8], [44, eerste lid][ref9], [45, vierde lid][ref10],
      [58, tweede lid][ref11], de overtreder een bestuurlijke boete opleggen.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel26
