  - number: 7.3.c.3°
    text: |-
      beschikt over een inrichting als bedoeld in [artikel 1 van het Besluit risico's zware ongevallen 2015][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036791#Artikel1
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0036791
        artikel: '1'
  - number: '7.4'
    text: |-
      Als vitale aanbieder in het havengebied wordt een onderneming aangemerkt waarvan de havenmeester gemandateerd is
      voor de nautische veiligheid in de haven Rotterdam op basis van onder meer de [Scheepvaartverkeerswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004364
  - number: '7.5'
    text: |-
      Als vitale aanbieder op het gebied van het bankwezen wordt een onderneming aangemerkt die een bank is als bedoeld
      in [artikel 17d, onderdeel a, van het Besluit prudentiële regels Wft][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020420#Artikel17d
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
