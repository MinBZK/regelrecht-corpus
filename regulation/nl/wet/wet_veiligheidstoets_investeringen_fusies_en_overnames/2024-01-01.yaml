  - number: '51.3'
    text: |-
      De bestuurlijke boete, bedoeld in het eerste en tweede lid, bedraagt ten hoogste een geldboete van het bedrag van
      de zesde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] of, indien de zesde
      categorie geen passende bestraffing toelaat, ten hoogste 10% van de omzet van de desbetreffende onderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '51.4'
    text: |-
      Onze Minister kan in het geval van een overtreding van de [artikelen 38, derde lid][ref1], [40, tweede lid][ref2],
      [43, vierde lid][ref3], [44, vierde lid en vijfde lid][ref4], [45, eerste lid][ref5] en 45, derde lid, de
      overtreder een bestuurlijke boete opleggen van ten hoogste 10% van de omzet van de groep waarvan de desbetreffende
      partij in de bewaarketen, deel uitmaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel40
