  - number: '58.1'
    text: |-
      Indien bij Onze Minister een op redelijke gronden gebaseerd vermoeden is ontstaan dat een verwervingsactiviteit
      die heeft plaatsgevonden voorafgaand aan de inwerkingtreding van deze wet, maar na 8 september 2020, een risico
      voor de nationale veiligheid zou kunnen opleveren, kan Onze Minister de betrokkenen bij de verwervingsactiviteit
      binnen acht maanden na de inwerkingtreding van deze wet gelasten alsnog een melding te doen, waarna Onze
      Minister de verwervingsactiviteit kan beoordelen op risico’s voor de nationale veiligheid en op basis van deze
      beoordeling een mededeling als bedoeld in [artikel 10, eerste lid, onderdeel a][ref1], kan doen of een ambtshalve
      toetsingsbesluit kan nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel10
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '58.2'
    text: |-
      De betrokkenen geven uitvoering aan de last, opgelegd op grond van het eerste lid, tot het doen van melding, waarop
      [artikel 11, tweede tot en met vijfde lid, eerste volzin][ref1], van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel11
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '58.3'
    text: |-
      Op het nemen van een ambtshalve toetsingsbesluit is [artikel 16, derde lid][ref1], en
      [artikel 18, eerste en derde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel18
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '16'
