  - number: 7.3.c.1°
    text: verantwoordelijk is voor de inrichting voor de opslag, de overslag en het tanken van vliegtuigbrandstof,
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: 7.3.c.2°
    text: |-
      bedrijfsbrandweerplichtig is als bedoeld in [artikel 31, eerste lid, van de Wet veiligheidsregio’s][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel31
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
