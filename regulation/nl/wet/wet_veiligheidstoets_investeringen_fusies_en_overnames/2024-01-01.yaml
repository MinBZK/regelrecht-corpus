    text: |-
      een gebruiker als bedoeld in [artikel 8.1b van de Wet luchtvaart][ref1], voor zover het betreft de Luchthaven
      Schiphol, die beschikt over:


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '8'
  - number: 7.3.b.1°
    text: |-
      een door Onze Minister van Infrastructuur en Waterstaat afgegeven exploitatievergunning als bedoeld in artikel 2,
      eerste lid, van Verordening (EG) nr. 1008/2008 van het Europees Parlement en de Raad van 24 september 2008
      inzake gemeenschappelijke regels voor de exploitatie van luchtdiensten in de Gemeenschap (PbEU 2008, L 293), en
      [artikel 16a van de Luchtvaartwet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16a
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: 16a
  - number: 7.3.b.2°
    text: |-
      ten minste één derde van de jaarlijks beschikbare slots, bedoeld in artikel 2, onderdeel a, van Verordening (EEG)
      nr. 95/93 van de Raad van 18 januari 1993 betreffende gemeenschappelijke regels voor de toewijzing van «slots» op
      communautaire luchthavens (PbEG 1993, L 14); of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: 7.3.c
    text: |-
      een verlener van grondafhandelingsdiensten als bedoeld in
      [artikel 1, onderdeel d, van de Regeling grondafhandeling luchtvaartterreinen][ref1] die op de Luchthaven
      Schiphol:


      [ref1]: https://wetten.overheid.nl/BWBR0009365#Artikel1
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
