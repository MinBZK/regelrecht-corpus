        artikel: '26'
  - number: '2'
    text: |-
      Deze wet is van toepassing op de volgende verwervingsactiviteiten, indien zij betrekking hebben op een
      doelonderneming die een vitale aanbieder of beheerder van een bedrijfscampus is of een onderneming is die actief is
      op het gebied van sensitieve technologie:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel2
  - number: 2.a
    text: |-
      investeringen in een doelonderneming door een verwerver die leiden tot het verkrijgen van zeggenschap in die
      onderneming;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel2
  - number: 2.b
    text: het fuseren van twee of meer voorheen van elkaar onafhankelijke ondernemingen tot een doelonderneming;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel2
  - number: 2.c
    text: |-
      het tot stand brengen van een gemeenschappelijke onderneming die duurzaam alle functies van een zelfstandige
      economische eenheid vervult, indien deze onderneming een doelonderneming zal zijn;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel2
  - number: 2.d
    text: 'de splitsing van een onderneming, indien:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel2
  - number: 2.d.1°
    text: |-
      de onderneming die gesplitst wordt een onderneming is die een vitale aanbieder of beheerder van een bedrijfscampus
      is of op het gebied van sensitieve technologie actief is; en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel2
  - number: 2.d.2°
    text: |-
      de splitsing gepaard gaat met een verkrijging van de zeggenschap in de onderneming die na de splitsing een
      doelonderneming is;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel2
  - number: 2.e
    text: |-
      het verwerven van een deel van de vermogensbestanddelen van een doelonderneming, indien deze essentieel zijn voor
      het kunnen functioneren als vitale aanbieder of beheerder van een bedrijfscampus of als onderneming op het gebied
      van sensitieve technologie;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel2
  - number: 2.f
    text: |-
      andere rechtshandelingen dan die als bedoeld onder a tot en met e, die tot gevolg hebben dat een of meer personen,
      of een of meer ondernemingen, zeggenschap verwerven in een doelonderneming; en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel2
  - number: 2.g
    text: |-
      de verkrijging van goederen als bedoeld in [artikel 1 van boek 3 van het Burgerlijk Wetboek][ref1] onder algemene
      titel als bedoeld in [artikel 80, tweede lid, van boek 3 van dat wetboek][ref2], met uitzondering van een fusie of
      splitsing, van een doelonderneming.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel80
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel2
