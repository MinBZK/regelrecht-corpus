        bwb_id: BWBR0020420
        artikel: 17d
  - number: '7.6'
    text: |-
      Als vitale aanbieder op het gebied van infrastructuur voor de financiële markt wordt een onderneming aangemerkt
      die een exploitant is van een handelsplatform in Nederland, waarop ten minste de helft van de eerste toelating of
      verhandeling van effecten als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] plaatsvindt,
      gerekend naar de totale nominale waarde van de eerste toelating of verhandeling van effecten in Nederland over de
      afgelopen twaalf maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '7.7'
    text: |-
      Voor de toepassing van het zesde lid wordt verstaan onder: - *een handelsplatform in Nederland:* een
      handelsplatform als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] dat in Nederland
      wordt beheerd of geëxploiteerd door een persoon met zetel in Nederland die het op grond van die wet is
      toegestaan in Nederland een georganiseerde handelsfaciliteit of een multilaterale handelsfaciliteit als
      bedoeld in [artikel 1:1 van die wet][ref2] te exploiteren of die het op grond van de [artikelen 5:26][ref3] en
      [5:27 van die wet][ref4] is toegestaan in Nederland een gereglementeerde markt als bedoeld in artikel 1:1 van die
      wet, te exploiteren of te beheren;
        - *eerste toelating of verhandeling:* de eerste maal dat een effect wordt toegelaten tot
      de handel op een gereglementeerde markt of multilaterale handelsfaciliteit als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref5] of een daarmee vergelijkbaar systeem of de eerste maal
      dat een effect wordt verhandeld op een handelsplatform als bedoeld in artikel 1:1 van de Wet op het financieel
      toezicht of een daarmee vergelijkbaar systeem.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
