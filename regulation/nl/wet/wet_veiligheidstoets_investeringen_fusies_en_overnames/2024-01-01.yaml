    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
  - number: '7.10'
    text: 'Als vitale aanbieder op het gebied van gasopslag wordt een onderneming aangemerkt die:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: 7.10.a
    text: |-
      de houder is van een vergunning, bedoeld in [artikel 25 van de Mijnbouwwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel25
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0014168
        artikel: '25'
  - number: 7.10.b
    text: |-
      op grond van [artikel 9a van de Gaswet][ref1] is aangewezen als beheerder van een gasopslaginstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel9a
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 9a
  - number: '7.11'
    text: |-
      Andere categorieën vitale aanbieders dan die als bedoeld in de voorgaande leden kunnen bij algemene maatregel van
      bestuur worden aangewezen. De voordracht voor deze algemene maatregel van bestuur wordt niet eerder gedaan dan vier
      weken nadat het ontwerp aan de beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: '7.12'
    text: |-
      Na de plaatsing in het Staatsblad van een krachtens het elfde lid vastgestelde algemene maatregel van bestuur
      wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Tweede Kamer der
      Staten-Generaal ingediend. Indien het voorstel wordt ingetrokken of indien een van de beide Kamers der Staten-
      Generaal besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken.
      Wordt het voorstel tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van
      inwerkingtreding van die wet.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: '8.1'
    text: 'Sensitieve technologie omvat, tenzij anders bepaald op grond van het tweede of derde lid:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel8
  - number: 8.1.a
    text: |-
      producten voor tweeërlei gebruik waarvan de uitvoer vergunningplichtig is op grond van artikel 3, eerste lid,
      van verordening (EU) nr. 2021/821 van het Europees Parlement en de Raad van 20 mei 2021 tot instelling van een
      Unieregeling voor controle op de uitvoer, de tussenhandel, de technische bijstand, de doorvoer en de overbrenging
      van producten voor tweeërlei gebruik (PbEU 2021, L 206); en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel8
  - number: 8.1.b
    text: |-
      militaire goederen als bedoeld in [artikel 2 van de Uitvoeringsregeling strategische goederen 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030610#Artikel2
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0030610
        artikel: '2'
  - number: '8.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen producten voor tweeërlei gebruik en militaire goederen worden
      uitgezonderd als sensitieve technologie.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel8
  - number: '8.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere technologieën worden aangewezen als sensitieve technologie,
      indien:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel8
  - number: 8.3.a
    text: |-
      deze van essentieel belang kunnen zijn voor het functioneren van defensie, opsporings-, inlichtingen- en
      veiligheidsdiensten bij de uitoefening van hun taken;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel8
  - number: 8.3.b
    text: |-
      de beschikbaarheid en aanwezigheid van deze technologieën binnen Nederland of haar bondgenoten essentieel is om
      onaanvaardbare risico’s voor de verkrijgbaarheid van bepaalde essentiële producten of voorzieningen te voorkomen;
      of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel8
  - number: 8.3.c
    text: |-
      deze worden gekenmerkt door een breed toepassingsbereik binnen verschillende vitale processen of processen die
      raken aan de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel8
  - number: '8.4'
    text: |-
      De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan de beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel8
  - number: '9.1'
    text: Onze Minister verstrekt op verzoek informatie over de toepassing van dit hoofdstuk in de praktijk.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel9
  - number: '9.2'
    text: |-
      De informatie, bedoeld in het eerste lid, wordt zo spoedig mogelijk verstrekt. Waar passend wordt informatie
      verstrekt in de vorm van een handleiding.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel9
  - number: '10.1'
    text: |-
      Een verwervingsactiviteit, uitgezonderd een verwervingsactiviteit als bedoeld in [artikel 2, onderdeel g][ref1],
      of [artikel 3, onderdeel d][ref2], vindt niet plaats voordat:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel3
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 10.1.a
    text: Onze Minister een mededeling heeft gedaan aan een meldingsplichtige dat geen toetsingsbesluit vereist is; of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel10
  - number: 10.1.b
    text: een toetsingsbesluit is genomen.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel10
  - number: '10.2'
    text: |-
      Onze Minister neemt een toetsingsbesluit in overeenstemming met Onze Minister van Justitie en Veiligheid, en,
      indien van toepassing, Onze Minister of Ministers die het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel10
  - number: '10.3'
    text: |-
      Onze Minister kan, indien nodig, andere Ministers dan bedoeld in het tweede lid raadplegen, alvorens een
      toetsingsbesluit wordt genomen of mededeling wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel10
  - number: '11.1'
    text: |-
      Ieder voornemen een verwervingsactiviteit uit te voeren, wordt door een van de meldingsplichtigen gemeld aan Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel11
  - number: '11.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald welke informatie een melding bevat, op welke wijze de
      melding wordt gedaan en kunnen voorschriften worden gesteld met betrekking tot de melding.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel11
  - number: '11.3'
    text: |-
      Een meldingsplichtige die voorafgaand aan een melding op grond van een wettelijke plicht informatie
      aan een bestuursorgaan, dienst, toezichthouder of andere persoon als bedoeld bij of krachtens
      [artikel 34, vierde lid][ref1], heeft verstrekt, die hetzelfde is als de informatie die een melding dient te
      bevatten, kan ten aanzien van die informatie in de melding volstaan met te vermelden dat die eerder is verstrekt,
      indien bij of krachtens algemene maatregel van bestuur onder daarin vast te stellen voorwaarden is bepaald dat dit
      is toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel34
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '34'
        hoofdstuk: '5'
  - number: '11.4'
    text: |-
      De informatie die bij de melding wordt verstrekt of waarnaar op grond van het derde lid bij de melding wordt
      verwezen, is waarheidsgetrouw en zo volledig als redelijkerwijs van de meldingsplichtige verwacht kan worden.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel11
  - number: '11.5'
    text: |-
      De meldplicht op grond van het eerste lid geldt niet ten aanzien van een verwerver die wegens een
      geheimhoudingsplicht van de doelonderneming niet kan weten dat een verwervingsactiviteit binnen de reikwijdte
      valt van deze wet. De doelonderneming waarvoor deze geheimhoudingsplicht geldt, meldt het voornemen een
      verwervingsactiviteit uit te voeren in dat geval aan Onze Minister zodra zij daar kennis van heeft.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel11
  - number: '11.6'
    text: |-
      In afwijking van het eerste lid, wordt een verwervingsactiviteit als bedoeld in [artikel 2, onderdeel g][ref1],
      of [artikel 3, onderdeel d][ref2], door de verwerver gemeld aan Onze Minister binnen twee weken nadat deze heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel3
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '12.1'
    text: |-
      Onze Minister deelt binnen acht weken na ontvangst van een melding als bedoeld in [artikel 11][ref1] mede of een
      toetsingsbesluit vereist is.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel11
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '12.2'
    text: |-
      Onze Minister bepaalt dat een toetsingsbesluit vereist is, indien een verwervingsactiviteit kan leiden tot een
      risico voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel12
  - number: '12.3'
    text: |-
      Indien nader onderzoek nodig is voor het doen van een mededeling als bedoeld in het eerste lid, kan Onze Minister
      de termijn, bedoeld in het eerste lid, verlengen met een redelijke termijn, doch uiterlijk met zes maanden.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel12
  - number: '12.4'
    text: |-
      Indien binnen de termijn, bedoeld in het eerste lid, of binnen een termijn van verlenging als bedoeld in het derde
      of achtste lid geen mededeling is gedaan dan is geen toetsingsbesluit vereist.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel12
  - number: '12.5'
    text: |-
      Indien een aanvraag voor een toetsingsbesluit is ingediend die volgt op een mededeling als bedoeld in het eerste
      lid inhoudende dat een toetsingsbesluit vereist is, neemt Onze Minister binnen acht weken na ontvangst van de
      aanvraag een toetsingsbesluit.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel12
  - number: '12.6'
    text: |-
      Onze Minister kan de termijn voor het nemen van een toetsingsbesluit als bedoeld in het vijfde lid verlengen met
      een redelijke termijn, doch uiterlijk met zes maanden, verminderd met de termijn die is verstreken voor het doen
      van nader onderzoek als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel12
  - number: '12.7'
    text: |-
      Onverminderd de toepasselijkheid van [artikel 4:15 van de Algemene wet bestuursrecht][ref1] op het nemen van een
      toetsingsbesluit op aanvraag, wordt de termijn voor het doen van een mededeling als bedoeld in het eerste lid,
      opgeschort met ingang van de dag waarop Onze Minister op grond van [artikel 34, zevende lid][ref2], verzoekt om
      aanvullende informatie, tot de dag waarop de verzochte informatie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel34
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '34'
        hoofdstuk: '5'
  - number: '12.8'
    text: |-
      Indien na een melding blijkt dat er sprake is van een buitenlandse directe investering die valt binnen de
      reikwijdte van [Verordening (EU) 2019/452](32352R2019) van het Europees Parlement en de Raad van 19 maart 2019 tot
      vaststelling van een kader voor de screening van buitenlandse directe investeringen in de Unie (PbEU 2019, L 79),
      kan de termijn, bedoeld in het derde of zesde lid, met nog ten hoogste drie maanden verlengd worden.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel12
  - number: '12.9'
    text: |-
      Op een aanvraag voor een toetsingsbesluit is [paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Paragraaf4.1.3.3
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        paragraaf: 4.1.3.3
  - number: '12.10'
    text: |-
      Onze Minister neemt een aanvraag voor een toetsingsbesluit niet eerder in behandeling dan nadat naar aanleiding van
      een melding over het voornemen een verwervingsactiviteit uit te voeren Onze Minister een mededeling als bedoeld in
      het eerste lid heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister kan op verzoek van de meldingsplichtige ontheffing verlenen van het in
      [artikel 10, eerste lid][ref1], gestelde verbod nadat de meldingsplichtige aan Onze Minister melding heeft gedaan
      van het voornemen de verwervingsactiviteit te willen uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel10
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '13.2'
    text: |-
      Ontheffing kan alleen worden verleend indien het algemeen belang in het geding is, met een risico op economische,
      fysieke of sociaalmaatschappelijke schade aan de samenleving of delen daarvan of nadelige gevolgen voor de
      financiële stabiliteit, indien de ontheffing niet wordt verleend.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel13
  - number: '13.3'
    text: Een ontheffing kan onder beperkingen worden verleend; aan een ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel13
  - number: '13.4'
    text: Het is verboden in strijd te handelen met op grond van dit artikel opgelegde beperkingen of voorschriften.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel13
  - number: '13.5'
    text: 'Een verleende ontheffing vervalt, zodra Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel13
  - number: 13.5.a
    text: |-
      naar aanleiding van een melding als bedoeld in het eerste lid schriftelijk mededeelt dat geen toetsingsbesluit
      vereist is of niet binnen de termijnen waarnaar in [artikel 12, vierde lid][ref1], wordt verwezen, mededeelt dat
      een toetsingsbesluit vereist is;


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel12
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 13.5.b
    text: |-
      schriftelijk mededeelt dat een toetsingsbesluit vereist is en niet binnen een in die mededeling door Onze Minister
      gestelde redelijke termijn een aanvraag voor een toetsingsbesluit is ingediend;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel13
  - number: 13.5.c
    text: een tijdig ingediende aanvraag als bedoeld onder b niet in behandeling neemt;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel13
  - number: 13.5.d
    text: een toetsingsbesluit neemt.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel13
  - number: '14.1'
    text: |-
      Indien ontheffing is verleend, kan Onze Minister een of meer personen aanwijzen met kennis van bedrijfsvoering
      waarbij het algemeen belang een rol speelt, die opdrachten kunnen verstrekken aan de doelonderneming of de
      verwerver.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel14
  - number: '14.2'
    text: Onze Minister maakt een besluit tot benoeming van een aangewezen persoon bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel14
  - number: '14.3'
    text: |-
      De aangewezen persoon verstrekt uitsluitend opdrachten die tot doel hebben te voorkomen dat er risico’s ontstaan
      voor de nationale veiligheid en indien de persoon is aangewezen om opdrachten te verstrekken aan de verwerver,
      kunnen deze opdrachten enkel betrekking hebben op de bedrijfsvoering, kennis of vermogensbestanddelen waarover de
      verwerver het bezit, de zeggenschap of significante invloed heeft verworven met de verwervingsactiviteit waarvoor
      de ontheffing is verleend.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel14
  - number: '14.4'
    text: |-
      Alle bestuurders, commissarissen, personen die feitelijke leiding geven en andere werknemers binnen de
      doelonderneming of verwerver, verstrekken de aangewezen persoon alle informatie die benodigd is in verband met
      het doel, bedoeld in het derde lid, volgen de opdrachten verstrekt door de aangewezen persoon op en verlenen de
      aangewezen persoon alle medewerking. Degene die op grond van de vorige volzin verplicht is tot medewerking of
      informatieverstrekking aan de aangewezen persoon of het opvolgen van een opdracht verstrekt door de aangewezen
      persoon, is niet aansprakelijk voor schade ten gevolge van het nakomen van die verplichting.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel14
  - number: '14.5'
    text: |-
      Rechtshandelingen in strijd met een opdracht van een aangewezen persoon zijn vernietigbaar. De vernietigingsgrond
      kan enkel worden ingeroepen door de aangewezen persoon of Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel14
  - number: '14.6'
    text: Tegen een opdracht van een aangewezen persoon kan administratief beroep worden ingesteld bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel14
  - number: '14.7'
    text: Onze Minister kan de aangewezen persoon vervangen door een andere persoon.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel14
  - number: '14.8'
    text: |-
      Een aanwijzing vervalt zodra een ontheffing vervalt en indien een ontheffing nog niet is vervallen, trekt Onze
      Minister een aanwijzing als bedoeld in het eerste lid in zodra deze niet meer nodig is.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel14
  - number: '14.9'
    text: |-
      Onverminderd de aansprakelijkheid van de Staat, is een aangewezen persoon niet aansprakelijk voor schade ten
      gevolge van door hem verstrekte opdrachten.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel14
  - number: '15.1'
    text: |-
      Indien naar aanleiding van een melding van een voorgenomen verwervingsactiviteit Onze Minister heeft medegedeeld
      dat een toetsingsbesluit vereist is en niettemin een verwervingsactiviteit heeft plaatsgevonden zonder dat er
      een voorafgaand toetsingsbesluit op aanvraag is genomen, neemt Onze Minister, wanneer hij bekend is met deze
      plaatsgevonden verwervingsactiviteit, ambtshalve een toetsingsbesluit op basis van een beoordeling van de
      verwervingsactiviteit op risico’s voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel15
  - number: '15.2'
    text: |-
      Voor de toepassing van het eerste lid, is niet van invloed of de verwervingsactiviteit heeft plaatsgevonden
      voorafgaand aan of na het doen door Onze Minister van de mededeling dat een toetsingsbesluit vereist is.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel15
  - number: '15.3'
    text: |-
      Onze Minister neemt een ambtshalve toetsingsbesluit als bedoeld in het eerste lid binnen acht weken nadat hij
      bekend is geworden met de plaatsgevonden verwervingsactiviteit of binnen acht weken na het doen van de mededeling
      dat een toetsingsbesluit vereist is, indien die mededeling nog niet was gedaan op het tijdstip waarop hij bekend
      werd met de plaatsgevonden verwervingsactiviteit.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel15
  - number: '15.4'
    text: |-
      Het eerste lid is niet van toepassing indien voor de verwervingsactiviteit die met inachtneming van een ontheffing
      heeft plaatsgevonden, een aanvraag voor een toetsingsbesluit is ingediend op een tijdstip waarop de ontheffing
      werking heeft en op de aanvraag een toetsingsbesluit wordt genomen. De termijn voor een toetsingsbesluit op
      aanvraag, genoemd in [artikel 12, vijfde lid][ref1], is van toepassing en artikel 12, zesde tot en met negende
      lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel12
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '16.1'
    text: |-
      Indien een verwervingsactiviteit heeft plaatsgevonden zonder voorafgaande melding van het voornemen daarvan aan
      Onze Minister, dan wel niet voldaan is aan de verplichting, bedoeld in [artikel 11, zesde lid][ref1], en bij Onze
      Minister ondanks het ontbreken van de melding of het niet voldoen aan die verplichting de verwervingsactiviteit
      bekend is geworden, deelt Onze Minister op basis van een beoordeling op risico’s voor de nationale veiligheid
      aan een meldingsplichtige schriftelijk mede dat geen toetsingsbesluit vereist is of neemt hij ambtshalve een
      toetsingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel11
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '16.2'
    text: |-
      Alvorens een schriftelijke mededeling te doen of een ambtshalve toetsingsbesluit te nemen als bedoeld
      in het eerste lid, kan Onze Minister binnen drie maanden nadat de verwervingsactiviteit bij hem bekend
      werd, een meldingsplichtige gelasten binnen een redelijke termijn alsnog van de verwervingsactiviteit
      melding te doen. Een meldingsplichtige geeft uitvoering aan de last en op het doen van de melding is
      [artikel 11, tweede tot en met vijfde lid, eerste volzin][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel11
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '16.3'
    text: |-
      Onze Minister doet een schriftelijke mededeling als bedoeld in het eerste lid of neemt ambtshalve een
      toetsingsbesluit binnen acht weken:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel16
  - number: 16.3.a
    text: nadat Onze Minister met de uitvoering van de verwervingsactiviteit bekend werd; of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel16
  - number: 16.3.b
    text: |-
      na het verstrijken van een redelijke termijn als bedoeld in het tweede lid indien een last tot het alsnog doen van
      een melding als bedoeld in dat lid is opgelegd en ongeacht of aan die last uitvoering is gegeven.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel16
  - number: '17.1'
    text: |-
      Indien het voornemen van een verwervingsactiviteit is gemeld aan Onze Minister of als is voldaan aan
      [artikel 11, zesde lid][ref1], en bij hem bekend is geworden of een redelijk vermoeden is ontstaan dat door
      een meldingsplichtige onjuiste of onvolledige informatie is verstrekt, bevestigt Onze Minister op basis van een
      beoordeling op risico’s voor de nationale veiligheid schriftelijk dat een eerdere gedane mededeling als bedoeld in
      [artikel 10, eerste lid, onderdeel a][ref2], of een eerder genomen toetsingsbesluit in stand blijft of neemt hij
      ambtshalve een toetsingsbesluit dat de eerdere gedane mededeling vervangt of het eerder genomen toetsingsbesluit
      vervangt of aanvult.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel10
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '17.2'
    text: |-
      Alvorens een schriftelijke bevestiging te geven of een ambtshalve toetsingsbesluit te nemen als bedoeld in het
      eerste lid, kan Onze Minister binnen drie maanden nadat bij Onze Minister bekend is geworden of een redelijk
      vermoeden is ontstaan dat door een meldingsplichtige onjuiste of onvolledige informatie is verstrekt, de
      meldingsplichtige gelasten binnen een redelijke termijn aan Onze Minister een hernieuwde melding van de voorgenomen
      of inmiddels uitgevoerde verwervingsactiviteit te doen. De meldingsplichtige geeft uitvoering aan de last en op
      het doen van de melding is [artikel 11, tweede tot en met vijfde lid, eerste volzin][ref1], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel11
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '17.3'
    text: |-
      Onze Minister geeft een schriftelijke bevestiging als bedoeld in het eerste lid of neemt ambtshalve een
      toetsingsbesluit ter vervanging of aanvulling van het eerder genomen toetsingsbesluit binnen acht weken na:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel17
  - number: 17.3.a
    text: |-
      het bekend worden of ontstaan van het redelijk vermoeden bij Onze Minister van de verstrekking van onjuiste of
      onvolledige informatie; of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel17
  - number: 17.3.b
    text: |-
      het verstrijken van een gestelde redelijke termijn als bedoeld in tweede lid, indien een last tot het doen van een
      hernieuwde melding als bedoeld in dat lid is opgelegd en ongeacht of aan die last uitvoering is gegeven.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel17
  - number: '18.1'
    text: |-
      De termijn van acht weken, bedoeld voor het nemen van een ambtshalve toetsingsbesluit als bedoeld in deze
      paragraaf, het doen van een schriftelijke mededeling als bedoeld in [artikel 16, eerste lid][ref1], of het afgeven
      van een schriftelijke bevestiging als bedoeld in [artikel 17, eerste lid][ref2], kan Onze Minister verlengen met
      een redelijke termijn, doch uiterlijk met zes maanden. De verlengde termijn, bedoeld in de vorige volzin, kan met
      nog ten hoogste drie maanden verlengd worden als blijkt dat er sprake is van een buitenlandse directe investering
      als bedoeld in [artikel 12, achtste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0046747#Artikel12
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0046747
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '18.2'
    text: |-
      De termijn voor het afgeven van een schriftelijke bevestiging of het doen van een schriftelijke mededeling,
      of de verlenging daarvan, wordt opgeschort met ingang van de dag waarop Onze Minister op grond van
      [artikel 34, zevende lid][ref1], verzoekt om aanvullende informatie, tot de dag waarop de verzochte informatie
      is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel34
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '34'
        hoofdstuk: '5'
  - number: '18.3'
    text: |-
      De gronden tot en duur van de opschorting, bedoeld in
      [artikel 4:15, eerste lid, onderdeel b, en tweede lid, van de Algemene wet bestuursrecht][ref1], zijn van
      overeenkomstige toepassing op het door Onze Minister opschorten van de termijn tot het nemen van een ambtshalve
      toetsingsbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '19.1'
    text: |-
      Bij de beoordeling van Onze Minister of een verwervingsactiviteit kan leiden tot een risico voor de nationale
      veiligheid wordt rekening gehouden met de volgende factoren, in onderlinge samenhang bezien:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel19
  - number: 19.1.a
    text: de eigendomsstructuur en -verhoudingen van een verwerver zijn onvoldoende transparant;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel19
  - number: 19.1.b
    text: |-
      een verwerver is, of staat onder invloed van, een natuurlijke persoon, rechtspersoon of een niet-statelijke
      entiteit die onderworpen is aan beperkende maatregelen krachtens:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel19
  - number: 19.1.b.1°
    text: hoofdstuk 7 van het Handvest van de Verenigde Naties;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel19
  - number: 19.1.b.2°
    text: artikel 215 van het Verdrag betreffende de werking van de Europese Unie;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel19
  - number: 19.1.b.3°
    text: |-
      de [Sanctiewet 1977][ref1];

      [ref1]: https://wetten.overheid.nl/BWBR0003296
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003296
  - number: 19.1.c
    text: |-
      de veiligheidssituatie in het land waarvan een verwerver ingezetene is, in het land waarin het hoofdbestuur van
      een verwerver gevestigd is of in de landen van de omliggende regio is onzeker of slecht doordat de stabiliteit
      van dat land of van de landen in die regio onder grote druk staat of ernstig is aangetast als gevolg van
      ongewenste buitenlandse inmenging of ondermijning of dreiging daarvan, militaire dreigingen, cyberdreigingen,
      terroristische dreigingen, dreigingen door gewapende niet-statelijke actoren of toenemende proliferatie van
      massavernietigingswapens of risico daarop binnen de regio, dan wel als gevolg van intern gewapende conflicten of
      het uitroepen van de staat van beleg of de noodtoestand wegens een poging tot omverwerping van de internationaal
      erkende regering;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel19
  - number: 19.1.d
    text: |-
      de verwerver heeft een misdrijf begaan dat overeenkomt met een voor de toepassing van dit onderdeel bij
      ministeriële regeling aangewezen misdrijf, of staat onder invloed van een persoon of rechtspersoon die een
      dergelijk misdrijf heeft begaan;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel19
  - number: 19.1.e
    text: |-
      een verwerver heeft niet of onvoldoende meegewerkt aan het onderzoek naar de factoren onder a tot en met d en, voor
      zover van toepassing, de factoren genoemd in de [artikelen 20][ref1] en [21][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel21
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.5'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 19.1.f
    text: |-
      indien de beoordeling betrekking heeft op een melding op grond van [artikel 17, tweede lid][ref1]: de aard van de
      onjuist aangeleverde informatie en het motief voor het fout aanleveren van die informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel17
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '19.2'
    text: |-
      Met een misdrijf als bedoeld in het eerste lid, onderdeel d, wordt gelijkgesteld een strafbaar feit naar
      buitenlands recht, dat naar het oordeel van Onze Minister gelijksoortig is aan een bij ministeriële regeling
      aangewezen misdrijf naar Nederlands recht.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel19
  - number: '20'
    text: |-
      In aanvulling op de toepasselijkheid van [artikel 19][ref1], houdt Onze Minister bij de beoordeling of een
      verwervingsactiviteit die betrekking heeft op een vitale aanbieder kan leiden tot een risico voor de nationale
      veiligheid, voorts rekening met de volgende factoren:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel19
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 20.a
    text: |-
      een verwerver heeft geen goede staat van dienst inzake de exploitatie of het beheer van het relevante proces
      waarvan de continuïteit van vitaal belang is voor de Nederlandse samenleving of de naleving van wettelijke
      voorschriften ten aanzien hiervan;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel20
  - number: 20.b
    text: |-
      een verwerver is ingezetene van, het hoofdbestuur van de verwerver is gevestigd in, of de verwerver staat onder
      invloed van een staat waarvan bekend is dat het een of meer offensieve programma’s heeft, gericht op het verstoren
      of aantasten van de integriteit, beveiliging, veiligheid of beschikbaarheid van een proces als bedoeld onder a;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel20
  - number: 20.c
    text: |-
      de financiële solvabiliteit of anderszins financiële stabiliteit van de verwerver in relatie tot de noodzakelijke
      financiële slagkracht voor het verrichten van de noodzakelijke investeringen ten bate van continuïteit en
      weerbaarheid van een proces als bedoeld onder a van de vitale aanbieder is onzeker;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel20
  - number: 20.d
    text: |-
      de staat waarvan de verwerver ingezetene is, waarin het hoofdbestuur van de verwerver gevestigd is, of onder
      wiens invloed de verwerver staat, is niet gebonden aan voor een proces als bedoeld onder a relevante verdragen
      en besluiten van volkenrechtelijke organisaties of heeft geen goede staat van dienst in de naleving van deze
      verdragen.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel20
  - number: '21'
    text: |-
      In aanvulling op de toepasselijkheid van [artikel 19][ref1], houdt Onze Minister bij de beoordeling of een
      verwervingsactiviteit die betrekking heeft op een onderneming die actief is op het gebied van sensitieve
      technologie kan leiden tot een risico voor de nationale veiligheid, voorts rekening met de volgende factoren:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel19
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 21.a
    text: |-
      een verwerver heeft geen goede staat van dienst inzake de beveiliging, de verhandeling of het gebruik van
      sensitieve technologie en de naleving van de toepasselijke wettelijke voorschriften inzake beveiliging, rubricering
      of exportcontrole;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel21
  - number: 21.b
    text: |-
      in een staat waarvan de verwerver ingezetene is, waarin het hoofdbestuur van de verwerver gevestigd is, of onder
      wiens invloed de verwerver staat, is geen exportcontrolebeleid aanwezig, of deze heeft geen goede staat van dienst
      inzake exportcontrole, of is niet gebonden aan relevante verdragen of besluiten van volkenrechtelijke organisaties
      inzake beveiliging, rubricering of exportcontrole of heeft geen goede staat van dienst in de naleving van deze
      verdragen;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel21
  - number: 21.c
    text: |-
      de verwerver is ingezetene van, het hoofdbestuur van de verwerver is gevestigd in, of een verwerver staat onder
      invloed van een staat waarvan bekend is of waarvoor gronden zijn te vermoeden dat deze geen of een ontoereikende of
      niet-transparante scheiding heeft tussen civiele en militaire onderzoeks- en ontwikkelingsprogramma’s;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel21
  - number: 21.d
    text: |-
      de verwerver heeft motieven voor het uitvoeren van de verwervingsactiviteit, die niet behoren tot gebruikelijke
      bedrijfseconomische motieven, waarbij een dergelijk motief in ieder geval is het verkrijgen van toegang tot de
      sensitieve technologie voor andere doeleinden dan enkel commerciële exploitatie;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel21
  - number: 21.e
    text: |-
      de verwerver is ingezetene van, het hoofdbestuur van de verwerver is gevestigd in, of de verwerver staat onder
      invloed van een staat waarvan bekend is of waarvoor gronden zijn te vermoeden dat deze een offensief programma
      heeft, gericht op het verwerven van sensitieve technologie om een technologische of strategische machtspositie
      te verwerven;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel21
  - number: 21.f
    text: |-
      de verwerver heeft een staat van dienst of voert een programma waardoor het aannemelijk is dat hij, na
      het verkrijgen van toegang tot of beheersmacht over de sensitieve technologie en de daarvoor benodigde
      productiemiddelen, een strategische machtspositie zal uitoefenen ten aanzien van de beschikbaarheid, beprijzing
      of doorontwikkeling van deze technologie die niet behoort tot gebruikelijke bedrijfseconomische motieven en
      praktijken.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel21
  - number: '22'
    text: |-
      Onze Minister stelt bij ministeriële regeling de strafbare feiten vast die op grond van
      [artikel 19, eerste lid, onderdeel d][ref1], van invloed kunnen zijn op de beoordeling van een risico voor de
      nationale veiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel19
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '23.1'
    text: |-
      Aan een verwervingsactiviteit die naar het oordeel van Onze Minister op basis van de beoordeling, bedoeld in
      [paragraaf 3.5][ref1], leidt tot een risico voor de nationale veiligheid, kan Onze Minister, voor zover toepasbaar,
      in het toetsingsbesluit de volgende eisen stellen of de volgende nadere voorschriften verbinden, indien dit
      noodzakelijk is om hieraan verbonden risico’s voor de nationale veiligheid te voorkomen of tot een aanvaardbaar
      niveau te beperken:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0046747
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: 23.1.a
    text: |-
      de naleving van, ten opzichte van de geldende wet- en regelgeving, aanvullende veiligheids- en
      gebruiksvoorschriften met betrekking tot de omgang met gevoelige informatie van afnemers van goederen en diensten
      die door de doelonderneming worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: 23.1.b
    text: |-
      de vaststelling en toepassing van een veiligheids- en integriteitsbeleid door de verwerver en doelonderneming ten
      aanzien van de werving en aanstelling van bestuurders en medewerkers voor sleutelfuncties die toegang geven tot
      gevoelige informatie of bedrijfsprocessen;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: 23.1.c
    text: |-
      de instelling van een veiligheidscommissie of het aanstellen van een beveiligingsfunctionaris tot bescherming van
      gevoelige informatie en bedrijfsprocessen, die bevoegd is om:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: 23.1.c.1°
    text: de toegang tot of overdracht van informatie en de toegang tot bedrijfsprocessen te beperken of te verbieden;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: 23.1.c.2°
    text: |-
      advies te geven over de veiligheids- en integriteitsrisico’s of afwezigheid daarvan bij de werving en
      aanstelling van bestuurders en medewerkers voor sleutelfuncties die toegang geven tot gevoelige informatie of
      bedrijfsprocessen; en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: 23.1.c.3°
    text: |-
      inbreuken of dreigende inbreuken op beperkingen of verboden betreffende toegang tot of overdracht van informatie
      of toegang tot bedrijfsprocessen, te rapporteren aan Onze Minister zonder voorafgaande toestemming van enige
      leidinggevende of bestuurder en, indien nodig, te doen vergezellen van een handhavingsverzoek dat gericht is aan de
      toezichthoudende ambtenaren, bedoeld in [artikel 46][ref1], ter bescherming tegen inbreuken;


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel46
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '46'
        hoofdstuk: '7'
  - number: 23.1.d
    text: |-
      het in een aparte in Nederland gevestigde dochtermaatschappij bundelen en onderbrengen van bepaalde delen van de
      onderneming die deel uitmaken van vitale processen in Nederland of met behulp waarvan voor de nationale veiligheid
      gevoelige dienstverlening aan de Nederlandse overheid wordt verzorgd.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: 23.1.e
    text: |-
      het verbieden van het aangaan van bepaalde vormen van dienstverlening of de verkoop van bepaalde goederen vanuit de
      Nederlandse vestiging van de onderneming aan bepaalde andere ondernemingen of bepaalde landen;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: 23.1.f
    text: het instellen van een aparte raad van commissarissen voor een Nederlandse dochtermaatschappij;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: 23.1.g
    text: |-
      het verbieden dat bepaalde vermogensbestanddelen, onderdelen of dochtermaatschappijen van de doelonderneming
      onderdeel uitmaken van de transactie;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: 23.1.h
    text: het opleggen van een maximum aandelenbelang dat lager ligt dan de voorgenomen investering;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: 23.1.i
    text: |-
      het verplichten tot certificering van alle of een deel van de aandelen van de verwerver via een stichting. Deze
      certificaten worden niet geacht te zijn uitgegeven met medewerking van de vennootschap;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: 23.1.j
    text: |-
      het verbinden van de toestemming van Onze Minister aan de beëindiging van de verhandeling van aandelen van een
      beursgenoteerde doelonderneming met gebruikmaking van een effectenafwikkelingssysteem, op enig moment na een
      voorgenomen investering en waarbij het verlenen van die toestemming afhankelijk wordt gesteld van een beoordeling
      overeenkomstig de [artikelen 19 tot en met 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel19
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.5'
  - number: '23.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels gesteld worden over de wijze waarop moet worden voldaan aan
      de eisen of nadere voorschriften die in een toetsingsbesluit aan een verwervingsactiviteit kunnen worden gesteld
      of verbonden.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: '23.3'
    text: |-
      Indien Onze Minister voorschriften als bedoeld in het eerste lid, onderdelen b en c gezamenlijk oplegt, wordt aan
      het voorschrift tot het vaststellen van een integriteitsbeleid de voorwaarde verbonden dat die vaststelling met
      instemming van de veiligheidscommissie of de aangestelde beveiligingsfunctionaris plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
  - number: '23.4'
    text: |-
      Indien Onze Minister het voorschrift, bedoeld in het eerste lid, onderdeel i, oplegt, wordt geen volmacht gegeven
      aan de certificaathouder op grond van [artikel 118a van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel118a
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 118a
  - number: '24'
    text: |-
      In aanvulling op de toepasselijkheid van [artikel 23][ref1] kan Onze Minister in het toetsingsbesluit de volgende
      eisen stellen of de volgende nadere voorschriften verbinden aan een verwervingsactiviteit die betrekking heeft
      op een onderneming die actief is op het gebied van sensitieve technologie, indien dit noodzakelijk is om hieraan
      verbonden risico’s voor de nationale veiligheid te voorkomen of tot een aanvaardbaar niveau te beperken:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel23
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 24.a
    text: |-
      de verplichting bepaalde technologie, broncode, genetische code, of kennis bij de Staat of een derde partij
      in Nederland in bewaring te geven en toe te staan dat deze ter beschikking kan worden gesteld door de staat
      of een derde partij voor niet-commerciële doeleinden bij acute risico’s voor bepaalde vitale processen of
      veiligheidsbelangen voor de duur dat die risico’s zich voordoen;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel24
  - number: 24.b
    text: |-
      verplichten tot het delen van informatie jegens Onze Minister voordat wordt overgegaan tot beëindiging of
      verplaatsing van een ondernemingsactiviteit naar een derde land en daarbij het in de gelegenheid stellen van Onze
      Minister om binnen een redelijke termijn voorafgaand aan deze beëindiging of verplaatsing:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel24
  - number: 24.b.1.
    text: |-
      aanvullende eisen te stellen of voorschriften op te leggen als bedoeld in dit artikel of [artikel 23][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel23
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 24.b.2.
    text: |-
      de onderneming, delen van de onderneming of bepaalde vermogensbestanddelen, met inbegrip van intellectuele
      eigendomsrechten, te verwerven voor een redelijke en op dat moment marktconforme prijs;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel24
  - number: 24.c
    text: |-
      het eisen dat op eerlijke, redelijke en non-discriminatoire voorwaarden een licentie wordt aangeboden op bepaalde
      kennis, beschermd door octrooien of andere intellectuele eigendomsrechten, aan of een of meer derde partijen die
      gevestigd zijn in de Europese Unie om kennis of technologie beschikbaar te houden voor Nederland of de Europese
      Unie.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel24
  - number: '25.1'
    text: |-
      Indien een verwerver of doelonderneming niet voldoet aan een eis of nader voorschrift uit een toetsingsbesluit
      dat verbonden is aan een verwervingsactiviteit, gelast Onze Minister de relevante partijen om binnen een redelijke
      termijn alsnog hieraan te voldoen.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel25
  - number: '25.2'
    text: |-
      Indien de verwerver na verloop van de termijn, bedoeld in het eerste lid, niet heeft voldaan aan de opgelegde last,
      kan Onze Minister:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel25
  - number: 25.2.a
    text: |-
      andere eisen of andere nadere voorschriften dan die als bedoeld in het eerste lid verbinden aan de
      verwervingsactiviteit; of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel25
  - number: 25.2.b
    text: de verwervingsactiviteit verbieden.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel25
  - number: '25.3'
    text: |-
      Indien een verwervingsactiviteit naar het oordeel van Onze Minister leidt tot een risico voor de nationale
      veiligheid, dat niet in voldoende mate beperkt kan worden door eisen of voorschriften als bedoeld in
      [artikel 23, eerste lid][ref1], of [artikel 24][ref2], verbiedt Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel24
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 25.3.a
    text: de verwervingsactiviteit; of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel25
  - number: 25.3.b
    text: |-
      de zeggenschap of significante invloed te houden, indien er sprake is van een verwervingsactiviteit als bedoeld in
      [artikel 2, onderdeel g][ref1], of [artikel 3, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel3
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '26.1'
    text: |-
      Het is verboden in strijd te handelen met een op grond van de [artikelen 23 tot en met 25][ref1] opgelegde eis of
      ander nader voorschrift, last of verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel23
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '26.2'
    text: |-
      Onze Minister is bevoegd, voor zover eisen worden gesteld of nadere voorschriften worden verbonden aan een
      verwervingsactiviteit, een uitvoeringsovereenkomst te sluiten met een doelonderneming over de aanwijzing door de
      doelonderneming van een onafhankelijke persoon die informatie verzamelt over de eerbiediging van bepaalde gestelde
      eisen of nadere voorschriften en die hierover periodiek rapporteert aan de toezichthoudende ambtenaren, bedoeld
      in [artikel 46][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel46
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '46'
        hoofdstuk: '7'
  - number: '27.1'
    text: |-
      Onze Minister kan een verwervingsactiviteit waarvoor eerder een mededeling als bedoeld in
      [artikel 10, eerste lid, onderdeel a][ref1], of [artikel 16, eerste lid][ref2], is gedaan of, al dan niet
      ambtshalve, een toetsingsbesluit is genomen, opnieuw beoordelen op risico’s voor de nationale veiligheid als feiten
      die zich voordoen nadat een toetsingsbesluit is genomen, leiden tot:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel16
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 27.1.a
    text: een potentiële maatschappelijke ontwrichting met economische, sociale of fysieke gevolgen; of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel27
  - number: 27.1.b
    text: een directe toegenomen reële bedreiging van de Nederlandse soevereiniteit.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel27
  - number: '27.2'
    text: |-
      Een nieuwe beoordeling als bedoeld in het eerste lid wordt uitgevoerd binnen zes maanden nadat dit risico bij
      Onze Minister bekend is geworden en op basis daarvan bevestigt Onze Minister een eerder gedane mededeling dat geen
      toetsingsbesluit vereist is of neemt hij ambtshalve een toetsingsbesluit, ondanks de eerdere mededeling dat een
      dergelijk besluit niet vereist is, of ter vervanging van het eerder genomen toetsingsbesluit.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel27
  - number: '27.3'
    text: Onze Minister neemt het besluit tot herbeoordeling in overeenstemming met het gevoelen van de ministerraad.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel27
  - number: '27.4'
    text: |-
      Indien Onze Minister op grond van [artikel 34, achtste lid, onderdeel b][ref1], verzoekt om informatie, wordt de
      termijn, bedoeld in het eerste lid, opgeschort met ingang van de dag waarop Onze Minister het verzoek om informatie
      heeft gedaan tot de dag waarop de verzochte informatie is verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel34
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '34'
        hoofdstuk: '5'
  - number: '28.1'
    text: |-
      Het uitvoeren van een verwervingsactiviteit als bedoeld in [artikel 2, onderdeel a][ref1], in strijd met een
      verbod op grond van [artikel 25, derde lid, onderdeel a][ref2], is nietig, tenzij de afwikkeling van deze
      activiteit plaatsvindt met gebruikmaking van een effectenafwikkelingssysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel25
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '28.2'
    text: |-
      Indien de uitvoering van een verwervingsactiviteit niet met gebruikmaking van een effectenafwikkelingssysteem
      is afgewikkeld, terwijl er ten tijde van of na de uitvoering sprake is van een verbod op grond van
      [artikel 25, tweede lid, onderdeel b][ref1], of van artikel 25, derde lid, onderdeel a, kan Onze Minister
      de verwerver of doelonderneming gelasten, binnen een door Onze Minister vast te stellen redelijke termijn, de
      noodzakelijke handelingen te verrichten om de ongewenste effecten van de verwervingsactiviteit te voorkomen of de
      verwervingsactiviteit ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel25
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '28.3'
    text: 'Onverminderd de toepasselijkheid van het tweede lid, zijn door een rechterlijke uitspraak vernietigbaar:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel28
  - number: 28.3.a
    text: |-
      fusies, met uitzondering van grensoverschrijdende fusies als bedoeld in
      [artikel 333b, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel333b
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 333b
  - number: 28.3.b
    text: andere verwervingsactiviteiten als bedoeld in het tweede lid, die niet nietig zijn op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel28
  - number: '28.4'
    text: |-
      Indien Onze Minister een verbod heeft opgelegd als bedoeld in [25, derde lid, onderdeel b][ref1], gelast
      Onze Minister de verwerver, binnen een door Onze Minister vast te stellen redelijke termijn de zeggenschap of
      significante invloed die met deze verwervingsactiviteit is verkregen terug te brengen of te beëindigen, zodat niet
      meer wordt gehandeld in strijd met het opgelegde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel25
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '28.5'
    text: De verwerver of doelonderneming geeft uitvoering aan de last, opgelegd op grond van het tweede of vierde lid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel28
  - number: '28.6'
    text: |-
      De verwerver of doelonderneming stelt Onze Minister onverwijld op de hoogte van de wijze waarop aan de last is
      voldaan.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel28
  - number: '28.7'
    text: |-
      Onze Minister doet mededeling aan de andere bij de verwervingsactiviteit betrokken meldingsplichtigen van een
      opgelegde last als bedoeld in het tweede of vierde lid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel28
  - number: '28.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop en de periode
      waarbinnen een last als bedoeld in het tweede of vierde lid ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel28
  - number: '29.1'
    text: |-
      Indien na verloop van de termijn, bedoeld in [artikel 28, tweede of vierde lid][ref1], de zeggenschap of
      significante invloed niet overeenkomstig de last is teruggebracht, is Onze Minister bij uitsluiting onherroepelijk
      gemachtigd om namens en voor rekening van de verwerver of doelonderneming, diens aandelen overeenkomstig de last te
      vervreemden of anderszins uitvoering te geven aan de opgelegde last, alsmede gehouden om een eventuele opbrengst te
      verstrekken aan of ten bate te doen komen van de verwerver.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel28
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '29.2'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel29
  - number: 29.2.a
    text: de termijn waarbinnen uitvoering wordt gegeven aan het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel29
  - number: 29.2.b
    text: de wijze waarop, voor zover van toepassing, opbrengst wordt verstrekt aan of ten bate komt van de verwerver.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel29
  - number: '30'
    text: |-
      De door een verwerver of doelonderneming met een verwervingsactiviteit verworven rechten worden niet uitgeoefend,
      met uitzondering van, voor zo ver van toepassing, het recht op de opbrengsten van een onderneming, dividend en de
      ontvangst van uitkeringen uit de reserves, indien:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel30
  - number: 30.a
    text: |-
      een verwervingsactiviteit is uitgevoerd in strijd met [artikel 10, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel10
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 30.b
    text: |-
      de op grond van [artikel 23, eerste lid][ref1], [24][ref2] of [25, tweede lid, onderdeel a][ref3], aan een
      verwervingsactiviteit verbonden eisen of nadere voorschriften niet of niet naar behoren worden uitgevoerd;


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0046747#Artikel25
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref3
        bwb_id: BWBR0046747
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 30.c
    text: |-
      er sprake is van een verbod op grond van [artikel 25, tweede lid, onderdeel b][ref1], of 25, derde lid,
      onderdeel a, en de strijdigheid met het verbod nog niet is opgeheven;


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel25
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 30.d
    text: |-
      er sprake is van een verbod op grond van [artikel 25, derde lid, onderdeel b][ref1], en de strijdigheid met het
      verbod nog niet is opgeheven;


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel25
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 30.e
    text: |-
      Onze Minister een last heeft opgelegd als bedoeld in [artikel 16, tweede lid][ref1], en er nog geen schriftelijke
      mededeling of toetsingsbesluit als bedoeld in dat lid is gedaan respectievelijk genomen of een last heeft opgelegd
      als bedoeld in [artikel 17, tweede lid][ref2], en er nog geen schriftelijke bevestiging of toetsingsbesluit als
      bedoeld in dat lid is gedaan respectievelijk genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel17
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 30.f
    text: |-
      Onze Minister gebruik maakt van de bevoegdheid, bedoeld in [artikel 27, eerste lid][ref1], vanaf het moment dat in
      overeenstemming met het gevoelen van de ministerraad is vastgesteld dat een van de omstandigheden, bedoeld in dat
      lid, zich voordoet, totdat is medegedeeld dat geen toetsingsbesluit nodig is, een toetsingsbesluit in stand blijft
      of een nieuw toetsingsbesluit is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel27
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '31'
    text: |-
      Een doelonderneming die zelf geen rechten heeft verworven als bedoeld in [artikel 30][ref1] geeft, voor zover
      mogelijk, gevolg aan de schorsing, bedoeld in dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel30
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '32.1'
    text: |-
      Indien dat naar het oordeel van Onze Minister nodig is om de effectiviteit van de schorsing, bedoeld in
      [artikel 30][ref1] te verzekeren, kan Onze Minister een of meer personen aanwijzen met in ieder geval kennis
      en ervaring op het gebied van controle op naleving van wettelijke voorschriften, die opdrachten kan of kunnen
      verstrekken aan de doelonderneming die uitsluitend ertoe strekken om de medewerking van de verwerver of
      doelonderneming aan de effectiviteit van de schorsing te verzekeren.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel30
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '32.2'
    text: Onze Minister maakt een besluit tot benoeming van een aangewezen persoon bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel32
  - number: '32.3'
    text: |-
      Alle bestuurders, commissarissen, personen die feitelijke leidinggeven en andere werknemers binnen de
      doelonderneming, verstrekken de aangewezen persoon alle informatie die benodigd is in verband met het doel, bedoeld
      in het eerste lid, volgen de opdrachten verstrekt door de aangewezen persoon op en verlenen de aangewezen persoon
      alle medewerking. Degene die op grond van de vorige volzin verplicht is tot medewerking of informatieverstrekking
      aan de aangewezen persoon of het opvolgen van een opdracht verstrekt door de aangewezen persoon, is niet
      aansprakelijk voor schade ten gevolge van het nakomen van die verplichting.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel32
  - number: '32.4'
    text: |-
      Rechtshandelingen in strijd met een opdracht van een aangewezen persoon zijn vernietigbaar. De vernietigingsgrond
      kan enkel worden ingeroepen door de aangewezen persoon of Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel32
  - number: '32.5'
    text: Tegen een opdracht van een aangewezen persoon kan administratief beroep worden ingesteld bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel32
  - number: '32.6'
    text: Onze Minister kan de aangewezen persoon vervangen door een andere persoon.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel32
  - number: '32.7'
    text: |-
      Onze Minister trekt een aanwijzing als bedoeld in het eerste lid in zodra deze niet meer nodig is, maar in ieder
      geval niet later dan het moment waarop de schorsing van rechten als bedoeld in [artikel 30][ref1], niet meer van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel30
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '32.8'
    text: |-
      Onverminderd de aansprakelijkheid van de staat, is een aangewezen persoon niet aansprakelijk voor schade ten
      gevolge van door hem verstrekte opdrachten.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister kan een of meer personen aanwijzen die het bestuur of de leiding van een doelonderneming die een
      vitale aanbieder is, vervangt dan wel vervangen, indien er:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel33
  - number: 33.1.a
    text: |-
      sprake is van een schorsing van rechten als bedoeld in [artikel 30][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel30
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 33.1.b
    text: sprake is van een risico op misbruik of uitval van de doelonderneming.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel33
  - number: '33.2'
    text: Onze Minister maakt een besluit tot benoeming van een aangewezen persoon bekend in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel33
  - number: '33.3'
    text: 'De werkzaamheden van de aangewezen vervanger hebben tot doel:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel33
  - number: 33.3.a
    text: te verzekeren dat de onderneming handelt overeenkomstig deze wet; en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel33
  - number: 33.3.b
    text: te voorkomen dat de continuïteit van het vitale proces in het geding komt.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel33
  - number: '33.4'
    text: |-
      Voor zover dit verenigbaar is met de doelen, genoemd in het derde lid, richt de aangewezen vervanger zich naar het
      belang van de doelonderneming.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel33
  - number: '33.5'
    text: |-
      [Artikel 32, derde en zevende lid][ref1], zijn van overeenkomstige toepassing, met dien verstande dat onder het
      doel, bedoeld in artikel 32, derde lid, wordt verstaan: het doel van de werkzaamheden van de aangewezen vervanger,
      bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel32
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '32'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '34.1'
    text: |-
      Onze op grond van [artikel 10, tweede en derde lid][ref1], betrokken Ministers en de partijen, bedoeld in
      het derde tot en met zesde lid, verwerken slechts persoonsgegevens voor zover dit noodzakelijk is voor het
      overeenkomstig deze wet beoordelen van, vaststellen van en beschermen tegen risico’s voor de nationale veiligheid
      die door de uitvoering van een verwervingsactiviteit ten aanzien van een doelonderneming waarop deze wet van
      toepassing is, kunnen ontstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel10
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '34.2'
    text: |-
      De verwerking van persoonsgegevens, bedoeld in het eerste lid, is toegestaan voor zover dit noodzakelijk is voor
      het:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: 34.2.a
    text: |-
      doen van een mededeling of een toetsingsbesluit vereist is, het nemen van een, al dan niet ambtshalve,
      toetsingsbesluit, het afgeven van een schriftelijke bevestiging als bedoeld in [artikel 17, eerste lid][ref1],
      of het verbinden van andere eisen of voorschriften als bedoeld in [artikel 25, tweede lid][ref2], aan een
      toetsingsbesluit;


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel25
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 34.2.b
    text: verlenen van een ontheffing;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: 34.2.c
    text: |-
      aanwijzen van een of meer personen die opdrachten kunnen verstrekken aan de doelonderneming of de verwerver
      respectievelijk van een of meer personen die het bestuur of de leiding vervangen van een doelonderneming die een
      vitale aanbieder is, de kennisgeving daarvan in de Staatscourant en de intrekking van een aanwijzing;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: 34.2.d
    text: vervangen van een aangewezen persoon als bedoeld onder c;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: 34.2.e
    text: opleggen van een last en het doen van de mededeling daarvan;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: 34.2.f
    text: |-
      machtigen krachtens [artikel 29][ref1] of [artikel 43, eerste lid, onderdeel a][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel43
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '29'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '43'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 34.2.g
    text: |-
      verstrekken van een opdracht als bedoeld in [artikel 44, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel44
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '44'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 34.2.h
    text: |-
      verrichten van werkzaamheden die noodzakelijk zijn ter uitvoering van de onderdelen a tot en met g, waaronder de
      beoordeling van een verwervingsactiviteit op risico’s voor de nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: 34.2.i
    text: |-
      kunnen identificeren van personen op basis van gegevens verkregen bij of krachtens [paragraaf 3.6][ref1] tot
      uitvoering van deze wet; en


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0046747
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 34.2.j
    text: |-
      toepassen van [hoofdstuk 7][ref1] en [artikel 56][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel56
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0046747
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '56'
        hoofdstuk: '8'
  - number: '34.3'
    text: |-
      Onze Minister maakt voor de uitvoering van deze wet, naast gegevens die door de meldingsplichtige op grond van
      [artikel 11][ref1] worden aangeleverd of waarnaar wordt verwezen, gebruik van gegevens die afkomstig zijn uit:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel11
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 34.3.a
    text: het handelsregister;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: 34.3.b
    text: |-
      de basisregistratie kadaster en de openbare registers, bedoeld in
      [artikel 1, eerste lid, van de Kadasterwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004541#Artikel1
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004541
        artikel: '1'
  - number: 34.3.c
    text: overige openbare registers bij de wet ingesteld; en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: 34.3.d
    text: openbare informatie.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: '34.4'
    text: |-
      De volgende bestuursorganen, diensten, toezichthouders of andere personen, verstrekken desgevraagd alle informatie
      aan Onze Minister die noodzakelijk is voor de uitvoering van deze wet:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: 34.4.a
    text: |-
      Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking, voor zover het gegevens betreft die verwerkt
      worden in het kader van de [Wet strategische diensten][ref1], het Besluit strategische goederen en verordening
      (EU) nr. 2021/821 van het Europees Parlement en de Raad van 20 mei 2021 tot instelling van een Unieregeling voor
      controle op de uitvoer, de tussenhandel, de technische bijstand, de doorvoer en de overbrenging van producten voor
      tweeërlei gebruik (PbEU 2021, L 206);


      [ref1]: https://wetten.overheid.nl/BWBR0030545
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0030545
  - number: 34.4.b
    text: Onze Minister van Financiën, voor zover het gegevens betreft die verwerkt worden door de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: 34.4.c
    text: |-
      Onze Minister van Justitie en Veiligheid, met inachtneming van de
      [Wet justitiële en strafvorderlijke gegevens][ref1], voor zover het justitiële gegevens in relatie tot de
      verwerver, of bestuurders, leidinggevenden of sleutelfunctionarissen binnen de verwerver betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0014194
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0014194
  - number: 34.4.d
    text: |-
      de Autoriteit Consument en Markt, voor zover het gegevens betreft die worden verwerkt in het kader van
      [hoofdstuk 5 van de Mededingingswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008691
        hoofdstuk: '5'
  - number: 34.4.e
    text: |-
      de veiligheidscommissie of beveiligingsfunctionaris, bedoeld in [artikel 23][ref1], voor zover het gegevens
      betreft inzake inbreuken of dreigende inbreuken op beperkingen of verboden ten aanzien van toegang tot gevoelige
      informatie of bedrijfsprocessen;


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel23
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: 34.4.f
    text: bij algemene maatregel van bestuur aan te wijzen bestuursorganen, diensten, toezichthouders of andere personen.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: '34.5'
    text: |-
      Onze Minister kan voor zover dit noodzakelijk is voor de uitvoering van deze wet, voorts de
      Minister van Binnenlandse Zaken en Koninkrijksrelaties verzoeken mededeling als bedoeld in
      [artikel 8, tweede lid, onderdeel f, van de Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1]
      te doen of de Minister van Defensie verzoeken mededeling als bedoeld in
      [artikel 10, tweede lid, onderdeel g, van die wet][ref2] te doen.


      [ref1]: https://wetten.overheid.nl/BWBR0039896#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0039896#Artikel10
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0039896
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0039896
        artikel: '10'
  - number: '34.6'
    text: |-
      Een notaris geeft van tot zijn protocol behorende verklaringen van erfrecht desgevraagd
      afschriften uit aan Onze Minister, voor zover dit noodzakelijk is voor de uitvoering van deze wet.
      [Artikel 49b van de Wet op het notarisambt][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel49b
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: 49b
  - number: '34.7'
    text: |-
      Voor zover de gegevens die de meldingsplichtige bij een melding heeft aangeleverd en de verzameling of
      verstrekking, bedoeld in het derde tot en met zesde lid, niet de benodigde gegevens heeft opgeleverd, verstrekken
      de meldingsplichtigen desgevraagd alle informatie aan Onze Minister die noodzakelijk is voor de uitvoering van
      deze wet.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: '34.8'
    text: 'Onze Minister verzoekt ingeval van:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: 34.8.a
    text: |-
      een beoordeling of op grond van [artikel 17, tweede lid][ref1], een nieuwe melding gedaan moet worden slechts om
      informatie, indien er bij Onze Minister een op redelijke gronden gebaseerd vermoeden is ontstaan dat sprake kan
      zijn van de verstrekking van onjuiste of onvolledige informatie door de meldingsplichtige;


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel17
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 34.8.b
    text: |-
      een beoordeling of er sprake is van feiten als bedoeld in [artikel 27, eerste lid][ref1], slechts om informatie,
      indien er overeenstemming met de ministerraad, bedoeld in artikel 27, derde lid, is bereikt over het uitvoeren van
      die beoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel27
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.7'
  - number: '34.9'
    text: |-
      Ten behoeve van de naleving van de verplichting, bedoeld in het zesde lid, zijn de notaris en de onder
      zijn verantwoordelijkheid werkzame personen niet gehouden aan de geheimhoudingsplicht, bedoeld in
      [artikel 22 van de Wet op het notarisambt][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010388#Artikel22
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0010388
        artikel: '22'
  - number: '34.10'
    text: |-
      De gegevensverstrekking ingevolge het derde lid, onder c, en het vierde tot en met achtste lid, geschiedt
      kosteloos.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: '34.11'
    text: Onze Minister is verwerkingsverantwoordelijke voor de verwerking van persoonsgegevens in het kader van deze wet.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: '34.12'
    text: |-
      Onze Minister deelt gegevens die op grond van deze wet zijn verkregen met de Minister van Justitie en
      Veiligheid en, indien van toepassing, Onze Minister of Ministers die het mede aangaat als bedoeld in
      [artikel 10, tweede lid][ref1], en andere Ministers als bedoeld in artikel 10, derde lid, voor zover dit
      noodzakelijk is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel10
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '34.13'
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de gegevens die op grond van het derde
      lid, onderdelen c en d, gebruikt worden.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: '34.14'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de informatie
      die op grond van het vierde lid verstrekt wordt en over de bewaartermijnen van de op grond van deze wet verkregen
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel34
  - number: '35.1'
    text: |-
      Indien bij Onze Minister, al dan niet na een melding op grond van deze wet, onduidelijkheid bestaat over de
      eigendomsstructuur en -verhoudingen binnen de verwerver, voor zover deze een onderneming is, of binnen de
      doelonderneming verstrekt de onderneming aan Onze Minister op verzoek om niet een uittreksel uit het door de
      onderneming gehouden register met betrekking tot een recht op een aandeel, als bedoeld in [artikel 85][ref1] en
      [194 van Boek 2 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel85
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel194
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '85'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '194'
  - number: '35.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing op een verwerver, voor zover deze geen beursgenoteerde onderneming is,
      of de doelonderneming, voor zover deze geen beursgenoteerde doelonderneming is.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel35
  - number: '36'
    text: |-
      Voor de toepassing van dit hoofdstuk wordt verstaan onder: - *bewaarder:* bewaarder als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref1];
        - *depot:* rekening met een aandelenbelang of rekening waarin een aandelenbelang tot uitdrukking komt die
      beroepsmatig en anders dan als aandeelhouder wordt geadministreerd of aangehouden, waaronder een verzameldepot of
      een girodepot in de zin van de [Wet giraal effectenverkeer][ref2], een depot van een instelling in het buitenland
      of een depot van een buitenlandse instelling met een functie vergelijkbaar met die van centraal instituut;
        - *effecten met een aandelenkarakter:* 1°. verhandelbare aandelen als bedoeld in
      [artikel 79, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref3] of aandelen van de besloten vennootschap
      als bedoeld in [artikel 187 van Boek 2 van het Burgerlijk Wetboek][ref4]; 2°. verhandelbare aandelen die
      zijn uitgegeven door een rechtspersoon, opgericht naar het recht van een andere lidstaat als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref5] dan Nederland, die gelijk te stellen zijn met aandelen
      als bedoeld onder 1°; 3°. certificaten van aandelen of andere met certificaten van aandelen gelijk te stellen
      verhandelbare waardebewijzen;
        - *instelling in het buitenland:* een instelling met zetel in het buitenland waaraan het op grond van het op die
      instelling van toepassing zijnde recht is toegestaan ten name van cliënten rekeningen in effecten te administreren
      of aan te houden;
        - *partij in de bewaarketen:* centraal instituut, rechtspersoon die als aangesloten instelling
      door een centraal instituut is toegelaten, beleggingsonderneming of bank in de zin van
      [artikel 1:1 van de Wet op het financieel toezicht][ref6] waaraan het op grond van die wet is toegestaan
      beleggingsdiensten te verlenen respectievelijk het bedrijf van bank uit te oefenen, bewaarder of instelling in het
      buitenland of instelling buiten de Europese Economische Ruimte met een functie vergelijkbaar met die van centraal
      instituut;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003109
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel79
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel187
      [ref5]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref6]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003109
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '79'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '187'
      - id: ref5
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref6
        bwb_id: BWBR0020368
        artikel: '1'
  - number: '37.1'
    text: |-
      Indien de meldplicht op grond van [artikel 11, eerste lid][ref1], betrekking heeft op een openbaar bod op een
      beursgenoteerde doelonderneming wordt de melding gelijktijdig gedaan met een aankondiging van het openbaar bod als
      bedoeld in [artikel 5:70, eerste lid, van de Wet op het financieel toezicht][ref2] of een aankondiging als bedoeld
      in [artikel 5, eerste tot en met derde lid, van het Besluit openbare biedingen Wft][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0022511#Artikel5
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0022511
        artikel: '5'
  - number: '37.2'
    text: |-
      Een verplicht bod als bedoeld in [artikel 5:70, eerste lid, van de Wet op het financieel toezicht][ref1]
      wordt niet gestand gedaan overeenkomstig [artikel 16 van het Besluit Openbare Biedingen Wft][ref2],
      voordat Onze Minister een mededeling heeft gedaan aan een meldingsplichtige dat geen toetsingsbesluit
      vereist is, een toetsingsbesluit is genomen of als een toetsingsbesluit is vastgesteld overeenkomstig
      [artikel 25, derde lid, onderdeel a][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0022511#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0046747#Artikel25
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0022511
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0046747
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '38.1'
    text: |-
      Indien bij Onze Minister, al dan niet na een melding op grond van deze wet, onduidelijkheid bestaat over de
      eigendomsstructuur en -verhoudingen binnen de verwerver, voor zover deze een beursgenoteerde onderneming is, of
      binnen de beursgenoteerde doelonderneming stelt de verwerver of doelonderneming, op verzoek van Onze Minister om
      niet een onderzoek in naar de identiteit van een houder van zeggenschap of significante invloed en de banden die
      deze heeft met derden.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel38
  - number: '38.2'
    text: |-
      Indien de identiteit van de houder of houders van een aandelenbelang niet met zekerheid is vast te stellen,
      wordt geacht verwerver te zijn en de daaraan verbonden zeggenschap of significante invloed in een beursgenoteerde
      doelonderneming uit te oefenen, de natuurlijke persoon of rechtspersoon die op grond van het onderzoek, bedoeld in
      het eerste lid, of op een andere wijze, als laatste is geïdentificeerd als deelgenoot in een depot of als cliënt
      waarvoor een aandelenbelang wordt bewaard, geadministreerd of aangehouden. Het bepaalde in de eerste volzin betreft
      het volledige aandelenbelang dat de betreffende natuurlijke persoon of rechtspersoon houdt in de betrokken partij.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel38
  - number: '38.3'
    text: |-
      Een partij in de bewaarketen verleent medewerking aan een beursgenoteerde doelonderneming bij het onderzoek,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel38
  - number: '38.4'
    text: |-
      De medewerking, bedoeld in het derde lid, wordt door een partij als bedoeld in het derde lid die een instelling in
      het buitenland met een zetel buiten de Europese Economische Ruimte is of die een instelling met een zetel buiten de
      Europese Economische Ruimte met een functie vergelijkbaar met die van centraal instituut is, uitsluitend verleend
      voor zover de wetgeving van dat land zich daartegen niet verzet.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel38
  - number: '38.5'
    text: |-
      Indien, ondanks het onderzoek, bedoeld in het eerste lid, de identiteit van de houder of houders van een
      aandelenbelang niet met zekerheid is vast te stellen, wordt voor de toepassing van deze wet ingeval van een
      beursgenoteerde doelonderneming onder verwerver telkens verstaan de natuurlijke persoon of rechtspersoon die
      op grond van het tweede lid, geacht is verwerver te zijn. De toepassing van dit artikellid wordt actief kenbaar
      gemaakt bij de toepassing van de [artikelen 12][ref1], [23][ref2], [24][ref3], [25][ref4], [30][ref5], [31][ref6]
      en [42][ref7] aan de alsdan vastgestelde verwerver.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0046747#Artikel24
      [ref4]: https://wetten.overheid.nl/BWBR0046747#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0046747#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0046747#Artikel31
      [ref7]: https://wetten.overheid.nl/BWBR0046747#Artikel42
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '12'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref3
        bwb_id: BWBR0046747
        artikel: '24'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref4
        bwb_id: BWBR0046747
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.6'
      - id: ref5
        bwb_id: BWBR0046747
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref6
        bwb_id: BWBR0046747
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref7
        bwb_id: BWBR0046747
        artikel: '42'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '39.1'
    text: |-
      Het onderzoek, bedoeld in [artikel 38, eerste lid][ref1], omvat het inwinnen van informatie bij partijen in de
      bewaarketen.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel38
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '38'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '39.2'
    text: |-
      Op het onderzoek, bedoeld in eerste lid, zijn de [artikelen 49a][ref1],
      [49b, eerste, tweede, vierde, vijfde lid][ref2], [49d][ref3] en [49e van de Wet giraal effectenverkeer][ref4] van
      overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49a
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
      [ref3]: https://wetten.overheid.nl/BWBR0003109#Artikel49d
      [ref4]: https://wetten.overheid.nl/BWBR0003109#Artikel49e
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49a
      - id: ref2
        bwb_id: BWBR0003109
        artikel: 49b
      - id: ref3
        bwb_id: BWBR0003109
        artikel: 49d
      - id: ref4
        bwb_id: BWBR0003109
        artikel: 49e
  - number: 39.2.a
    text: |-
      in aanvulling op [artikel 49a, onderdeel d, van de Wet giraal effectenverkeer][ref1] onder een uitgevende
      instelling tevens wordt verstaan: een beursgenoteerde onderneming;


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49a
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49a
  - number: 39.2.b
    text: |-
      in aanvulling op [artikel 49b, eerste lid, onderdeel d, van de Wet giraal effectenverkeer][ref1] een
      uitgevende instelling tevens een bewaarder kan verzoeken informatie te verstrekken over de beheerder van een
      beleggingsinstelling als bedoeld in [artikel 1.1 van de Wet op het financieel toezicht][ref2] of van een icbe als
      bedoeld in artikel 1.1 van de Wet op het financieel toezicht;


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49b
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 39.2.c
    text: |-
      in afwijking van [artikel 49d van de Wet giraal effectenverkeer][ref1] een beursgenoteerde onderneming de
      resultaten van het onderzoek meldt aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49d
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49d
  - number: '39.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de
      wijze waarop het inwinnen van informatie, bedoeld in het eerste lid, op grond van
      [artikel 49b, eerste lid, van de Wet giraal effectenverkeer][ref1] gelezen in samenhang met het vorige lid, wordt
      gedaan en beantwoord.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49b
  - number: '40.1'
    text: |-
      Een beursgenoteerde onderneming stelt bij de uitvoering van een onderzoek als bedoeld in
      [artikel 38, eerste lid][ref1], telkens de tot dusver als laatste geïdentificeerde natuurlijke persoon of
      rechtspersoon die niet de verwerver is er van op de hoogte dat hij wordt geacht verwerver te zijn als bedoeld in
      artikel 38, tweede lid, en welke gevolgen daarvan op grond van deze wet verbonden kunnen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel38
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '38'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '40.2'
    text: |-
      De tijdens het onderzoek, bedoeld in [artikel 38, eerste lid][ref1], tot dusver als laatste geïdentificeerde
      natuurlijke persoon of rechtspersoon die een partij in de bewaarketen is en die aan de beursgenoteerde onderneming
      de identiteit niet kenbaar maakt van een deelgenoot in een door die partij gehouden depot of van een cliënt
      voor wie die partij de door de beursgenoteerde onderneming uitgegeven effecten met een aandelenkarakter bewaart,
      administreert of aanhoudt, geleidt een van de beursgenoteerde onderneming afkomstig schriftelijk bericht met een
      verzoek tot identiteitsvaststelling onverwijld door naar de deelgenoten of cliënten voor wie die partij direct of
      indirect een aandelenbelang houdt respectievelijk bewaart, administreert of aanhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel38
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '38'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '40.3'
    text: 'De informatie die in een door te geleiden bericht als bedoeld in het tweede lid wordt verzocht, is:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
  - number: 40.3.a
    text: |-
      voor een deelgenoot in een depot van een centraal instituut, de informatie, bedoeld in
      [artikel 49b, eerste lid, onderdeel a, van de Wet giraal effectenverkeer][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49b
  - number: 40.3.b
    text: |-
      voor een deelgenoot in een depot van een intermediair als bedoeld in
      [artikel 1 van de Wet giraal effectenverkeer][ref1], de informatie, bedoeld in
      [artikel 49b, eerste lid, onderdeel b, van de Wet giraal effectenverkeer][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003109
        artikel: 49b
  - number: 40.3.c
    text: |-
      voor een client voor wie een instelling in het buitenland, en met inbegrip van een instelling buiten de Europese
      Economische Ruimte met een functie vergelijkbaar met die van centraal instituut, de door de beursgenoteerde
      onderneming uitgegeven effecten met een aandelenkarakter bewaart, administreert of aanhoudt, de informatie, bedoeld
      in [artikel 49b, eerste lid, onderdeel c, van de Wet giraal effectenverkeer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel49b
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: 49b
  - number: '40.4'
    text: 'Een door te geleiden bericht als bedoeld in het tweede lid, vermeldt:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
  - number: 40.4.a
    text: de adresgegevens van de beursgenoteerde onderneming en het e-mailadres waaronder deze onderneming bereikbaar is;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
  - number: 40.4.b
    text: |-
      dat het verzoek ertoe strekt degene voor wie het bericht beoogd is in de gelegenheid te stellen de in het bericht
      verzochte informatie onverwijld aan de beursgenoteerde onderneming te verstrekken;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
  - number: 40.4.c
    text: |-
      de gevolgen die het niet onverwijld overgaan tot verstrekking van de verzochte informatie kan hebben voor door
      de ontvanger van het bericht direct of indirect gehouden, bewaarde, geadministreerde of aangehouden door de
      beursgenoteerde onderneming uitgegeven effecten met een aandelenkarakter;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
  - number: 40.4.d
    text: |-
      dat ontvangen informatie uitsluitend wordt gebruikt ter uitvoering van deze wet en op de verkregen informatie de
      geheimhouding krachtens deze wet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
  - number: '40.5'
    text: |-
      De beursgenoteerde onderneming informeert de tot dusver als laatste geïdentificeerde natuurlijke persoon of
      rechtspersoon die tevens partij in een bewaarketen, bedoeld in het tweede lid, is, indien de hoedanigheid als
      laatste geïdentificeerde op een ander is overgegaan als resultaat van de informatie-uitwisseling op grond van het
      tweede tot en met vierde lid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
  - number: '40.6'
    text: |-
      Bij het beëindigen van het onderzoek, bedoeld in [artikel 38, eerste lid][ref1], stelt de beursgenoteerde
      onderneming de als laatste geïdentificeerde natuurlijke persoon of rechtspersoon hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel38
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '38'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '40.7'
    text: |-
      De beursgenoteerde onderneming verstrekt krachtens dit artikel verkregen gegevens onverwijld aan Onze Minister
      en deelt aan de natuurlijke persoon of rechtspersoon, bedoeld in het tweede lid, die het bericht, bedoeld in het
      tweede lid, heeft doorgeleid of aan een door deze natuurlijke persoon of rechtspersoon aangewezen derde, mede dat
      de verzochte gegevens zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel40
  - number: '41.1'
    text: 'Een beursgenoteerde onderneming:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel41
  - number: 41.1.a
    text: |-
      is verplicht tot geheimhouding van de gegevens, bedoeld in [artikel 40, derde lid][ref1], waarvan zij kennis
      neemt;


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel40
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '40'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 41.1.b
    text: |-
      verleent geen volmacht om namens haar gegevens, bedoeld in [artikel 40, derde lid][ref1], te ontvangen;


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel40
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '40'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 41.1.c
    text: |-
      verwerkt de gegevens, bedoeld in [artikel 40, derde lid][ref1], uitsluitend voor zover dit noodzakelijk is ter
      uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel40
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '40'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '41.2'
    text: |-
      Rechtspersonen hebben het recht om gegevens betreffende hun identiteit die door de beursgenoteerde onderneming
      verkregen zijn na doorgeleiding van een bericht als bedoeld in [artikel 40, tweede lid][ref1], te corrigeren
      wanneer deze onvolledig of onjuist zijn gebleken.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel40
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '40'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '41.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze van verwerking van de gegevens,
      bedoeld in [artikel 40, derde lid][ref1], en over de bewaartermijnen daarvan door de doelonderneming en door Onze
      Minister die deze gegevens ter uitvoering van deze wet heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel40
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '40'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '42.1'
    text: |-
      Indien een verwervingsactiviteit is uitgevoerd, terwijl er ten tijde van of na de uitvoering sprake is
      van een verbod op grond van [artikel 25, tweede lid, onderdeel b][ref1], of artikel 25, derde lid,
      onderdeel a, en de afwikkeling van de verwervingsactiviteit heeft plaatsgevonden met gebruikmaking van een
      effectenafwikkelingssysteem, gelast Onze Minister de verwerver, binnen een door Onze Minister vast te stellen
      redelijke termijn de zeggenschap of significante invloed die met deze verwervingsactiviteit is verkregen terug te
      brengen of te beëindigen zodat niet meer wordt gehandeld in strijd met het opgelegde verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel25
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.6'
  - number: '42.2'
    text: De verwerver of doelonderneming geeft uitvoering aan de last, opgelegd op grond van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel42
  - number: '42.3'
    text: |-
      De verwerver of doelonderneming stelt Onze Minister onverwijld op de hoogte van de wijze waarop aan de last is
      voldaan.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel42
  - number: '42.4'
    text: |-
      Onze Minister doet mededeling aan de andere bij de verwervingsactiviteit betrokken meldingsplichtigen van een
      opgelegde last als bedoeld in het eerste lid. De beursgenoteerde doelonderneming informeert, indien van toepassing,
      de beheerder van een depot.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel42
  - number: '42.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop en de periode
      waarbinnen een last als bedoeld in eerste lid ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel42
  - number: '43.1'
    text: |-
      Indien na verloop van de termijn, bedoeld in [artikel 42, eerste lid][ref1], de zeggenschap of significante
      invloed in een beursgenoteerde doelonderneming niet overeenkomstig de last, bedoeld in artikel 42, eerste lid,
      is teruggebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel42
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '42'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 43.1.a
    text: |-
      is de beursgenoteerde doelonderneming bij uitsluiting onherroepelijk gemachtigd tot gehele vervreemding of tot
      terugbrenging namens en voor rekening van de verwerver van de zeggenschap of het aandelenbelang; en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
  - number: 43.1.b
    text: |-
      is de beursgenoteerde doelonderneming verplicht een aandeel of zeggenschap te vervreemden of een aandelenbelang te
      vervreemden of terug te brengen namens en voor rekening van de verwerver.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
  - number: '43.2'
    text: |-
      Indien de verwerver deelgenoot is in een depot dan wel cliënt is van een bewaarder, verstrekt de beursgenoteerde
      doelonderneming ter uitvoering van de verplichting, bedoeld in het eerste lid, onderdeel b, aan de houder van dat
      depot respectievelijk aan die bewaarder, de opdracht het aandelenbelang te vervreemden of terug te brengen namens
      en voor rekening van de verwerver.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
  - number: '43.3'
    text: |-
      Indien een partij als houder van een depot of als bewaarder geen medewerking verleent aan de uitvoering van een
      opdracht tot vervreemding of terugbrenging van een tot de naar een doelonderneming te herleiden aandelenbelang,
      verstrekt de beursgenoteerde doelonderneming ter uitvoering van de verplichting, bedoeld in het eerste lid,
      onderdeel b, de opdracht tot het vervreemden of terugbrengen van het aandelenbelang aan de eerstvolgende:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
  - number: 43.3.a
    text: |-
      depothouder die voor deze partij een aandelenbelang in een depot houdt dat te herleiden is tot de beursgenoteerde
      doelonderneming, of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
  - number: 43.3.b
    text: bewaarder die voor deze partij een aandelenbelang bewaart, administreert of aanhoudt.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
  - number: '43.4'
    text: |-
      Een houder van een depot of bewaarder waaraan een opdracht tot vervreemding of terugbrenging als bedoeld in het
      tweede of derde lid, is verstrekt, vermindert bij de uitvoering daarvan het tegoed in het desbetreffende depot met
      een hoeveelheid waarvoor de verwerver met zijn aandelenbelang direct of indirect deelgenoot is in dat depot. De
      vermindering vindt alleen plaats ten laste van de verwerver die direct of indirect deelgenoot is in het depot of
      cliënt is van een bewaarder en een eventuele opbrengst wordt verstrekt aan of komt ten bate van de verwerver.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
  - number: '43.5'
    text: |-
      Degene tot wie een opdracht van een beursgenoteerde doelonderneming als bedoeld in het tweede of derde lid zich
      richt, verleent zoveel mogelijk medewerking aan de tenuitvoerlegging daarvan.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
  - number: '43.6'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
  - number: 43.6.a
    text: de termijn waarbinnen uitvoering wordt gegeven aan het eerste lid, en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
  - number: 43.6.b
    text: de wijze waarop, voor zover van toepassing, opbrengst wordt verstrekt aan of ten bate komt van de verwerver.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
  - number: '43.7'
    text: |-
      Op de uitvoering van een opdracht als bedoeld in het tweede of derde lid, zijn de
      [artikelen 26, derde en vierde lid][ref1], en [45, derde en vierde lid, van de Wet giraal effectenverkeer][ref2]
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel45
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0003109
        artikel: '45'
  - number: '44.1'
    text: |-
      Indien ondanks een door de beursgenoteerde doelonderneming verstrekte opdracht als bedoeld in
      [artikel 43, tweede en derde lid][ref1], geen enkele partij daaraan uitvoering geeft of kan geven, meldt de
      beursgenoteerde doelonderneming dit aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel43
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '43'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '44.2'
    text: |-
      Na een melding als bedoeld in het eerste lid te hebben gedaan, draagt Onze Minister de beursgenoteerde
      doelonderneming op om het aandelenbelang waarvoor de verwerver direct of indirect deelgenoot in een depot is dat
      door een centraal instituut of instelling wordt gehouden met uitsluiting van anderen te leveren aan de verwerver
      door de volgende handelingen te verrichten:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
  - number: 44.2.a
    text: |-
      dit aandelenbelang in het aandeelhoudersregister, bedoeld in
      [artikel 85, van Boek 2 van het Burgerlijk Wetboek][ref1] op naam van de verwerver in te schrijven;


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel85
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '85'
  - number: 44.2.b
    text: |-
      het aandelenbelang dat in dit aandeelhoudersregister geregistreerd staat op naam van een centraal instituut of
      instelling buiten de Europese Economische Ruimte met een functie vergelijkbaar met die van centraal instituut in
      dat register evenredig te verminderen met het aandelenbelang dat op naam van de verwerver is ingeschreven; en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
  - number: 44.2.c
    text: |-
      een centraal instituut of instelling buiten de Europese Economische Ruimte met een functie vergelijkbaar met
      die van centraal instituut te verzoeken het door dat instituut of die instelling gehouden depot evenredig te
      verminderen met het tegoed dat overeenkomt met het aandelenbelang dat op naam van de verwerver is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
  - number: '44.3'
    text: |-
      Bij het verzoek, bedoeld in het tweede lid, onderdeel c, deelt de beursgenoteerde doelonderneming de identiteit van
      de verwerver mede en zover beschikbaar de gegevens van de eerstvolgende partij in de bewaarketen.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
  - number: '44.4'
    text: |-
      Een centraal instituut of instelling buiten de Europese Unie met een functie vergelijkbaar met die van centraal
      instituut verleent medewerking aan de uitvoering van de door een beursgenoteerde doelonderneming gegeven opdracht
      tot levering, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
  - number: '44.5'
    text: |-
      Een partij in de bewaarketen die direct of indirect een aandelenbelang in een depot voor de verwerver houdt dan
      wel degene die een aandelenbelang bewaart, administreert of aanhoudt voor de verwerver als direct of indirect
      deelgenoot, vermindert het voor de verwerver in het depot aanwezige of bewaarde, geadministreerde of aangehouden
      aandelenbelang met de hoeveelheid aandelen die op naam van de verwerver is gesteld als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
  - number: '44.6'
    text: |-
      Het vijfde lid is niet van toepassing op de partij in de bewaarketen voor wie een wijziging in tenaamstelling als
      bedoeld in het tweede lid, heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
  - number: '44.7'
    text: |-
      De inschrijving en wijziging van tenaamstelling in het aandeelhoudersregister kan worden tegengeworpen aan een
      ieder die na de datum van opdracht tot tenaamstelling, bedoeld in het tweede lid, deelgenoot is geworden in een
      depot of voor wie na deze datum een aandelenbelang wordt bewaard, geadministreerd of aangehouden.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
  - number: '44.8'
    text: |-
      Nadat de beursgenoteerde doelonderneming het aandelenregister heeft gewijzigd, bedoeld in het tweede lid, geeft
      de beursgenoteerde doelonderneming uitvoering aan de verplichting, bedoeld in [artikel 43, eerste lid][ref1], en
      wordt een eventuele opbrengst verstrekt aan of komt een eventuele opbrengst ten bate van de verwerver.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel43
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '43'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '44.9'
    text: |-
      Op de uitvoering van een opdracht als bedoeld in het tweede lid, zijn de [artikelen 26, derde en vierde lid][ref1]
      en [45, derde en vierde lid, van de Wet giraal effectenverkeer][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003109#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0003109#Artikel45
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003109
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0003109
        artikel: '45'
  - number: '45.1'
    text: |-
      Een partij in de bewaarketen onthoudt zich van gedragingen waarvan hij weet of redelijkerwijs behoort te weten
      dat de verwerver of beursgenoteerde doelonderneming, daardoor in strijd met het bepaalde in [artikel 30][ref1]
      kan handelen.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel30
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: '45.2'
    text: |-
      In geval van een schorsing als bedoeld in [artikel 30][ref1], verzoekt de beursgenoteerde doelonderneming een
      partij in de bewaarketen, een bericht door te geleiden aan de verwerver waarin het volgende wordt vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel30
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '30'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 45.2.a
    text: |-
      de adresgegevens van de beursgenoteerde doelonderneming en het e-mailadres waaronder deze onderneming bereikbaar
      is;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
  - number: 45.2.b
    text: |-
      de mededeling dat de verwerver ingevolge het besluit van Onze Minister is geschorst in al zijn rechten met
      uitzondering van het recht op de opbrengsten van een onderneming, dividend en de ontvangst van uitkeringen uit de
      reserves van het recht op dividend en recht op uitkering uit de reserves;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
  - number: 45.2.c
    text: de adresgegevens van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
  - number: '45.3'
    text: |-
      Een partij in de bewaarketen verleent medewerking aan een beursgenoteerde doelonderneming bij het gevolg geven aan
      het verzoek, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
  - number: '45.4'
    text: Indien de medewerking niet wordt verleend, meldt een beursgenoteerde doelonderneming dit aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
  - number: '45.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop aan de
      verplichting, bedoeld in [artikel 31][ref1], gevolg wordt gegeven door de doelonderneming. Deze regels hebben in
      ieder geval betrekking op de wijze waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel31
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '31'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 45.5.a
    text: deelname van de verwerver aan de algemene vergadering wordt verhinderd;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
  - number: 45.5.b
    text: |-
      het verstrekken van relevante informatie aan de verwerver wordt beperkt zonder afbreuk te doen aan de
      informatieverplichtingen aan overige belanghebbenden;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
  - number: 45.5.c
    text: |-
      het bestuur van de beursgenoteerde doelonderneming geen gevolg geeft aan de aanwijzingen of instructies van de
      verwerver voor zover deze statutair mogelijk zijn gemaakt; en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
  - number: 45.5.d
    text: |-
      de beursgenoteerde doelonderneming andere maatregelen treft om toegang tot informatiesystemen en vestigingen van de
      doelonderneming en daarin aanwezige data en productiemiddelen door de verwerver te verhinderen.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel45
  - number: '46'
    text: Met het toezicht op de naleving van deze wet zijn belast de bij besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel46
  - number: '47.1'
    text: |-
      De op grond van [artikel 46][ref1] aangewezen ambtenaren zijn in afwijking van
      [artikel 5:15, eerste lid, van de Algemene wet bestuursrecht][ref2], bevoegd een woning zonder toestemming van de
      bewoner binnen te treden en te doorzoeken, voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '46'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 47.1.a
    text: |-
      dat voor de uitoefening van de in [artikel 5:17 van de Algemene wet bestuursrecht][ref1] bedoelde bevoegdheden
      redelijkerwijs noodzakelijk is; en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 47.1.b
    text: 'het betreft:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel47
  - number: 47.1.b.1.
    text: |-
      een woning van de verwerver, bestuurder, leidinggevende of sleutelfunctionaris van de verwerver of de
      doelonderneming; of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel47
  - number: 47.1.b.2.
    text: een woning waarin de verwerver of doelonderneming gevestigd is.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel47
  - number: '47.2'
    text: Zo nodig oefenen zij de bevoegdheid tot binnentreding en doorzoeken uit met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel47
  - number: '48.1'
    text: |-
      Voor het binnentreden en doorzoeken, bedoeld in [artikel 47, eerste lid][ref1], is een voorafgaande machtiging
      vereist van de rechter-commissaris, belast met de behandeling van strafzaken bij de rechtbank Rotterdam, waaraan
      een verzoek van een op grond van [artikel 46][ref2] aangewezen ambtenaar ten grondslag ligt. De vereiste
      machtiging kan bij wijze van voorzorgsmaatregel worden gevraagd. De machtiging wordt zo mogelijk getoond.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel46
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '47'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '46'
        hoofdstuk: '7'
  - number: '48.2'
    text: |-
      [Artikel 171 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing. De rechter-commissaris
      kan het openbaar ministerie horen alvorens te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel171
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '171'
  - number: '48.3'
    text: |-
      Tegen de beslissing van de rechter-commissaris staat voor zover het verzoek om een machtiging niet is toegewezen,
      voor de op grond van [artikel 46][ref1] aangewezen ambtenaren binnen veertien dagen beroep open bij de rechtbank
      Rotterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel46
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '46'
        hoofdstuk: '7'
  - number: '48.4'
    text: Het binnentreden en doorzoeken vindt plaats onder toezicht van de rechter-commissaris.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel48
  - number: '48.5'
    text: |-
      De rechter-commissaris die de machtiging heeft gegeven, kan degene die bevoegd is binnen te treden en tot
      doorzoeking gemachtigd is, vergezellen.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel48
  - number: '48.6'
    text: |-
      Dit artikel geldt in afwijking van de [artikelen 2][ref1], [3][ref2] en
      [8 van de Algemene wet op het binnentreden][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0006763#Artikel8
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006763
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0006763
        artikel: '8'
  - number: '49.1'
    text: |-
      Een machtiging als bedoeld in [artikel 48, eerste lid][ref1], is met redenen omkleed en ondertekend en vermeldt:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel48
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '48'
        hoofdstuk: '7'
  - number: 49.1.a
    text: de naam van de rechter-commissaris die de machtiging heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel49
  - number: 49.1.b
    text: de naam of het nummer en de hoedanigheid van degene aan wie de machtiging is gegeven;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel49
  - number: 49.1.c
    text: de wettelijke bepaling waarop de doorzoeking berust en het doel waartoe wordt doorzocht;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel49
  - number: 49.1.d
    text: de dagtekening.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel49
  - number: '49.2'
    text: |-
      Indien het doorzoeken dermate spoedeisend is dat de machtiging niet tevoren op schrift kan worden gesteld, zorgt de
      rechter-commissaris zo spoedig mogelijk voor de opschriftstelling.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel49
  - number: '49.3'
    text: De machtiging blijft ten hoogste van kracht tot en met de derde dag na die waarop zij is gegeven.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel49
  - number: '49.4'
    text: |-
      Dit artikel geldt in afwijking van [artikel 6 van de Algemene wet op het binnentreden][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel6
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '6'
  - number: '50.1'
    text: |-
      De ambtenaar die een doorzoeking als bedoeld in [artikel 47, eerste lid][ref1], heeft verricht, maakt op zijn
      ambtseed of -belofte een schriftelijk verslag op omtrent de doorzoeking.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel47
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '47'
        hoofdstuk: '7'
  - number: '50.2'
    text: 'In het verslag vermeldt hij:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel50
  - number: 50.2.a
    text: zijn naam of nummer en zijn hoedanigheid;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel50
  - number: 50.2.b
    text: de dagtekening van de machtiging en de naam van de rechter-commissaris die de machtiging heeft gegeven;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel50
  - number: 50.2.c
    text: de wettelijke bepaling waarop de doorzoeking berust;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel50
  - number: 50.2.d
    text: de plaats waar is doorzocht en de naam van degene bij wie de doorzoeking is verricht;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel50
  - number: 50.2.e
    text: het tijdstip waarop de doorzoeking is begonnen en is beëindigd;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel50
  - number: 50.2.f
    text: hetgeen tijdens het doorzoeken is verricht en overigens is voorgevallen;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel50
  - number: 50.2.g
    text: de namen of nummers en de hoedanigheid van de overige personen die aan de doorzoeking hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel50
  - number: '50.3'
    text: |-
      Het verslag wordt uiterlijk op de vierde dag na die waarop de doorzoeking is beëindigd, toegezonden aan de rechter-
      commissaris die de machtiging heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel50
  - number: '50.4'
    text: |-
      Een afschrift van het verslag wordt uiterlijk op de vierde dag na die waarop de doorzoeking is beëindigd, aan
      degene bij wie de doorzoeking is verricht, uitgereikt of toegezonden. Indien het doel waartoe is doorzocht daartoe
      noodzaakt, kan deze uitreiking of toezending worden uitgesteld. Uitreiking of toezending geschiedt in dat geval,
      zodra het belang van dit doel het toestaat. Indien het niet mogelijk is het afschrift uit te reiken of toe te
      zenden, houdt de rechter-commissaris of de ambtenaar die de doorzoeking heeft verricht, het afschrift gedurende zes
      maanden beschikbaar voor degene bij wie de doorzoeking is verricht.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel50
  - number: '51.1'
    text: |-
      Onze Minister kan in geval van overtreding van de [artikelen 13, vierde lid][ref1],
