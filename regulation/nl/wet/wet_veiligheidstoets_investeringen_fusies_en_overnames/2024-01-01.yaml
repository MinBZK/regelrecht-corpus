        artikel: 52a
  - number: 7.9.b
    text: |-
      is aangewezen krachtens [artikel 10a, vijftiende lid, van de Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
