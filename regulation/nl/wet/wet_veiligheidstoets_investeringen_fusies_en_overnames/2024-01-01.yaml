        artikel: '1'
  - number: '7.8'
    text: 'Als vitale aanbieder op het gebied van infrastructuur voor de financiële markt wordt verder aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: 7.8.a
    text: |-
      een centrale tegenpartij als bedoeld in artikel 2, punt 1, van Verordening (EU) nr. 648/2012 van het Europees
      Parlement en de Raad van 4 juli 2012 betreffende otc-derivaten, centrale tegenpartijen en transactieregisters (PbEU
      2012, L 201), met zetel in Nederland;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: 7.8.b
    text: |-
      een clearinginstelling als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], die over een
      vergunning als bedoeld in [artikel 2:4, eerste lid, van de Wet op het financieel toezicht][ref2] beschikt en die
      binnen Nederland en grensoverschrijdend in totaliteit meer dan 1 miljard transacties per jaar afwikkelt;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 7.8.c
    text: |-
      een financiële onderneming als bedoeld in [artikel 1:1, van de Wet op het financieel toezicht][ref1],
      die over een door de Europese Centrale Bank of De Nederlandsche Bank verleende vergunning als bedoeld in
      [artikel 2:4, tweede lid, van de Wet op het financieel toezicht][ref2], beschikt en die bij de uitoefening van het
      bedrijf van clearinginstelling binnen Nederland en grensoverschrijdend in totaliteit meer dan 1 miljard transacties
      per jaar afwikkelt;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 7.8.d
    text: |-
      een afwikkelonderneming als bedoeld in [artikel 1:1][ref1] juncto
      [art. 2:3.0b van de Wet op het financieel toezicht][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 7.8.e
    text: een centraal instituut met zetel in Nederland.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: '7.9'
    text: 'Als vitale aanbieder op het gebied van winbare energie wordt een onderneming aangemerkt die:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: 7.9.a
    text: |-
      de houder is van de winningsvergunning Groningenveld, bedoeld in [artikel 52a van de Mijnbouwwet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0014168#Artikel52a
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
