preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een toets in te richten betreffende
    verwervingsactiviteiten die een risico kunnen vormen voor de nationale veiligheid gezien het effect hiervan op
    vitale aanbieders, beheerders van bedrijfscampussen of ondernemingen die actief zijn op het gebied van sensitieve
    technologie;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aandeel:* aandeel als bedoeld in:
      a. [artikel 5:33, eerste lid, onderdeel b, van de Wet op het financieel toezicht][ref1], in geval van een
      beursgenoteerde onderneming; of b. [artikel 82, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2] in
      geval van een naamloze vennootschap, niet zijnde een beursgenoteerde onderneming als bedoeld in onderdeel a, of c.
      [artikel 175 van Boek 2 van het Burgerlijk Wetboek][ref3] in geval van een besloten vennootschap, niet zijnde een
      beursgenoteerde onderneming als bedoeld in onderdeel a;
        - *aandelenbelang:* bepaalde hoeveelheid aandelen, waaronder tevens begrepen een tegoed ter zake van een
      hoeveelheid van aandelen dat wordt aangehouden bij een partij in de bewaarketen;
        - *beheerder van een bedrijfscampus:* onderneming die een terrein beheert waarop een verzameling van ondernemingen
      actief is en waar publiek-privaat wordt samengewerkt aan technologieën en toepassingen die van economisch en
      strategisch belang zijn voor Nederland;
        - *beursgenoteerde doelonderneming:* een doelonderneming die tevens beursgenoteerde onderneming is;
        - *beursgenoteerde onderneming:* onderneming waarvan de aandelen worden verhandeld met gebruikmaking van een
      effectenafwikkelingssysteem;
        - *centraal instituut:* een centrale effectenbewaarinstelling als bedoeld in artikel 2 van Verordening
      (EU) nr. 909/2014 van het Europees Parlement en de Raad van 23 juli 2014 betreffende de verbetering van de
      effectenafwikkeling in de Europese Unie, betreffende centrale effectenbewaarinstellingen en tot wijziging van
      [Richtlijnen 98/26/EG](31998L0026) en [2014/65](32014L0065)/EU en Verordening (EU) nr. [236/2012](32136L2012) (PbEU
      2014, L 257);
        - *doelonderneming:* a. de in Nederland gevestigde onderneming waarin een verwerver een investering doet, die
      partij is bij een fusie of splitsing als bedoeld in de onderdelen b en d, of die betrokken is bij de totstandkoming
      van een gemeenschappelijke onderneming; b. de onderneming die ontstaat na een fusie tussen twee of meer voorheen
      van elkaar onafhankelijke ondernemingen waarvan er ten minste een in Nederland gevestigd is; c. de tot stand
      gebrachte gemeenschappelijke onderneming die in Nederland is gevestigd; d. de onderneming die na een splitsing
      als bedoeld in [artikel 2, onderdeel d][ref4], of [artikel 3, onderdeel b][ref5], een in Nederland gevestigde
      onderneming is; e. de in Nederland gevestigde onderneming of de persoon handelend voor de in Nederland gevestigde
      onderneming die is opgehouden te bestaan, waarvan vermogensbestanddelen worden vervreemd; of f. de in Nederland
      gevestigde onderneming die, geheel of gedeeltelijk, voorwerp is van een verkrijging onder algemene titel;
        - *effectenafwikkelingssysteem:* een effectenafwikkelingssysteem als bedoeld in punt 3 van afdeling A van de
      bijlage van de Verordening (EU) nr. 909/2014 van het Europees Parlement en de Raad van 23 juli 2014 betreffende
      de verbetering van de effectenafwikkeling in de Europese Unie, betreffende centrale effectenbewaarinstellingen
      en tot wijziging van [Richtlijnen 98/26/EG](31998L0026) en [2014/65](32014L0065)/EU en Verordening (EU)
      nr. [236/2012](32136L2012) (PbEU 2014, L 257) of een daarmee vergelijkbaar systeem dat wordt geëxploiteerd door
      een instelling buiten de Europese Economische Ruimte met een functie vergelijkbaar met die van een centrale
      effectenbewaarinstelling als bedoeld in artikel 2 van die verordening;
        - *investering:* verwerving van participaties in het kapitaal of vermogensbestanddelen, door een of meer personen,
      bij overeenkomst of op elke andere wijze, rechtstreeks of middellijk, over een of meer ondernemingen of delen
      daarvan;
        - *meldingsplichtige:* a. verwerver; b. doelonderneming;
        - *nationale veiligheid:* de nationale veiligheid als bedoeld in artikel 4, tweede lid, van het Verdrag betreffende
      de Europese Unie, openbare veiligheid als bedoeld in de artikelen 45, derde lid, 52, eerste lid, en 65, eerste
      lid, onderdeel b, van het Verdrag betreffende de werking van de Europese Unie, of de wezenlijke belangen van de
      veiligheid van de staat als bedoeld in artikel 346, eerste lid, onderdeel a, van het Verdrag betreffende de werking
      van de Europese Unie, die strekken tot bescherming van de belangen die binnen Nederland wezenlijk zijn voor het
      voortbestaan van de democratische rechtsorde, voor de veiligheid of voor andere gewichtige belangen van de staat,
      of voor de instandhouding van de maatschappelijke stabiliteit, voor zover die zien op het raakvlak tussen economie
      en veiligheid, te weten: i. de instandhouding van de continuïteit van vitale processen; ii. het behoud van de
      integriteit en exclusiviteit van kennis en informatie met kritieke of strategische betekenis voor Nederland; of
      iii. het voorkomen van ongewenste strategische afhankelijkheden van Nederland van andere landen;
        - *onderneming:* een onderneming in de zin van artikel 101, eerste lid, van het Verdrag betreffende de werking van
      de Europese Unie;
        - *Onze Minister:* Onze Minister van Economische Zaken en Klimaat;
        - *stemmen:* a. bij een beursgenoteerde onderneming, niet toebehorende aan
      een besloten vennootschap als bedoeld in onderdeel b: stemmen als bedoeld in
      [artikel 5:33, eerste lid, onderdeel d, van de Wet op het financieel toezicht][ref6], met
      inbegrip van stemmen waarover een persoon beschikt of geacht wordt te beschikken op grond van
      [artikel 5:45, eerste tot en met elfde lid, van de Wet op het financieel toezicht][ref7]; b. bij een besloten
      vennootschap waarop [artikel 187 van Boek 2 van het Burgerlijk Wetboek][ref8] van toepassing is: stemmen
      die op aandelen kunnen worden uitgebracht, waarbij de [artikelen 5:33, eerste lid, onderdeel d][ref9],
      en [5:45, eerste tot en met elfde lid, van de Wet op het financieel toezicht][ref10] van
      overeenkomstige toepassing zijn; c. bij een niet-beursgenoteerde onderneming: stemmen die op
      aandelen kunnen worden uitgebracht, waarbij de [artikelen 5:33, eerste lid, onderdeel d][ref11], en
      [5:45, eerste tot en met elfde lid, van de Wet op het financieel toezicht][ref12] van overeenkomstige toepassing
      zijn; d. bij een vereniging of coöperatie: stemmen die kunnen worden uitgebracht in de algemene vergadering,
      waarbij de [artikelen 5:45, vijfde, zesde en negende lid, van de Wet op het financieel toezicht][ref13] van
      overeenkomstige toepassing zijn;
        - *sensitieve technologie:* sensitieve technologie als bedoeld in [artikel 8][ref14];
        - *significante invloed:* significante invloed als bedoeld in [artikel 4, eerste tot en met vierde lid][ref15];
        - *toetsingsbesluit:* besluit waarin wordt bepaald dat: a. een verwervingsactiviteit wordt: 1°. toegelaten
      op voorwaarde dat aan bepaalde eisen of nadere voorschriften als bedoeld in [artikel 23][ref16]
      of [artikel 24][ref17] wordt voldaan; of 2°. verboden; of b. wordt verboden dat de zeggenschap of
      significante invloed wordt gehouden, indien er sprake is van een verwervingsactiviteit als bedoeld in
      [artikel 2, onderdeel g][ref18], of [artikel 3, onderdeel d][ref19];
        - *verordening 806/2014:* verordening (EU) nr. 806/2014 van het Europees Parlement en de Raad van 15 juli 2014
      tot vaststelling van eenvormige regels en een eenvormige procedure voor de afwikkeling van kredietinstellingen
      en bepaalde beleggingsondernemingen in het kader van een gemeenschappelijk afwikkelingsmechanisme en een
      gemeenschappelijk bankenafwikkelingsfonds en tot wijziging van Verordening (EU) nr. 1093/2010 van het Europees
      Parlement en de Raad (PbEU 2014, L 225);
        - *verwerver:* a. de investeerder of investeerders die met een investering in de doelonderneming zeggenschap
      willen verkrijgen of significante invloed willen verkrijgen of vergroten; b. de partijen die willen fuseren
      waardoor de doelonderneming ontstaat; c. de partijen die een gemeenschappelijke onderneming die duurzaam alle
      functies van een zelfstandige economische eenheid vervult, tot stand willen brengen; d. de partij of partijen
      die willen splitsen waardoor na de splitsing een doelonderneming zal ontstaan; e. de partij of partijen die de
      vermogensbestanddelen van een doelonderneming willen verwerven, indien deze essentieel zijn voor de doelonderneming
      om te kunnen functioneren als vitale aanbieder of op het gebied van sensitieve technologie; f. de partij of
      partijen die door andere rechtshandelingen dan die als bedoeld onder a tot en met e, in de doelonderneming
      zeggenschap verkrijgen of significante invloed verkrijgen of vergroten. g. de partij die onder algemene titel als
      bedoeld in [artikel 80, tweede lid, van boek 3 van het Burgerlijk Wetboek][ref20], met uitzondering van een fusie
      of splitsing, in de doelonderneming goederen als bedoeld in [artikel 1 van dat wetboek][ref21] wil verkrijgen om
      zeggenschap te verkrijgen of significante invloed op de doelonderneming te verkrijgen of te vergroten;
        - *verwervingsactiviteit:* activiteit als omschreven in [artikel 2][ref22] of [artikel 3][ref23], waarbij een
      verwerver betrokken is;
        - *vitale aanbieder:* onderneming die een dienst exploiteert, beheert of beschikbaar stelt waarvan de continuïteit
      van vitaal belang is voor de Nederlandse samenleving;
        - *zeggenschap:* zeggenschap als bedoeld in [artikel 26 van de Mededingingswet][ref24].


