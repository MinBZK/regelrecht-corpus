        artikel: '80'
  - number: '3'
    text: |-
      Deze wet is tevens van toepassing op de volgende verwervingsactiviteiten, indien zij betrekking hebben op een
      doelonderneming die actief is op het gebied van sensitieve technologie:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel3
  - number: 3.a
    text: investeringen tot het verkrijgen of vergroten van significante invloed door een verwerver op een doelonderneming;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel3
  - number: 3.b
    text: 'de splitsing van een onderneming, indien:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel3
  - number: 3.b.1°
    text: de onderneming die gesplitst wordt een doelonderneming is; en
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel3
  - number: 3.b.2°
    text: |-
      de splitsing gepaard gaat met een verkrijging of vergroting van significante invloed op een onderneming die na de
      splitsing op het gebied van sensitieve technologie actief is;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel3
  - number: 3.c
    text: |-
      andere rechtshandelingen dan die als bedoeld onder a en b, die tot gevolg hebben dat een of meer personen, of een
      of meer ondernemingen, significante invloed verkrijgen of vergroten op een doelonderneming;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel3
  - number: 3.d
    text: |-
      de verkrijging van goederen als bedoeld in [artikel 1 van boek 3 van het Burgerlijk Wetboek][ref1] onder algemene
      titel als bedoeld in [artikel 80, tweede lid, van boek 3 van dat wetboek][ref2], met uitzondering van een fusie of
      splitsing, waardoor significante invloed op een doelonderneming wordt verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel80
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel3
    references:
      - id: ref1
