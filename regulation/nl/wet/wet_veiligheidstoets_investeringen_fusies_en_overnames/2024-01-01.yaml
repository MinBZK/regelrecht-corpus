        artikel: '80'
  - number: '4.1'
    text: |-
      Tenzij is voorzien in een algemene maatregel van bestuur als bedoeld in het derde lid, doet het verkrijgen of
      vergroten van significante invloed in een doelonderneming op het gebied van sensitieve technologie zich voor,
      indien:
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel4
  - number: 4.1.a
    text: |-
      een persoon ten minste een tiende van de stemmen van de algemene vergadering in een doelonderneming kan uitbrengen
      of kan laten uitbrengen;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel4
  - number: 4.1.b
    text: |-
      een persoon ten minste een vijfde van de stemmen van de algemene vergadering in een doelonderneming kan uitbrengen
      of kan laten uitbrengen;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel4
  - number: 4.1.c
    text: |-
      een persoon ten minste een vierde van de stemmen van de algemene vergadering in een doelonderneming kan uitbrengen
      of kan laten uitbrengen;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel4
  - number: 4.1.d
    text: |-
      de onderneming zich jegens een derde verbindt of heeft verbonden om te bevorderen dat de daartoe bevoegde organen
      van een doelonderneming een of meer bestuurders die zijn voorgedragen door deze derde, benoemen of ontslaan; of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel4
  - number: 4.1.e
    text: |-
      tussen aandeelhouders is overeengekomen dat een aandeelhouder de significante invloed via een van de mogelijkheden
      genoemd in onderdelen a tot en met c, verkrijgt of vergroot.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel4
  - number: '4.2'
    text: Geen significante invloed als bedoeld in het eerste lid is aanwezig, indien er sprake is van zeggenschap.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel4
  - number: '4.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen specifieke categorieën van doelondernemingen worden aangewezen waarvoor
      per aangewezen categorie op basis van de aard van de activiteiten of inrichting van doelondernemingen die onder
      een categorie vallen, wordt bepaald welke van de onderdelen, genoemd in het eerste lid, daarop van toepassing is
      of zijn.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel4
  - number: '4.4'
    text: |-
      Indien is voorzien in een algemene maatregel van bestuur als bedoeld in het derde lid, doet het verkrijgen of
      vergroten van significante invloed in een doelonderneming op het gebied van sensitieve technologie zich uitsluitend
      voor als is voldaan aan een of meer onderdelen als bedoeld in het eerste lid, die in de algemene maatregel van
      bestuur van toepassing is of zijn verklaard op een daarin aangewezen categorie van doelondernemingen waartoe de
      desbetreffende doelonderneming behoort.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel4
  - number: '4.5'
    text: |-
      Bij de bepaling van het percentage van de stemmen in de algemene vergadering van een doelonderneming waarover
      een verwerver na de uitvoering van een verwervingsactiviteit zal beschikken, worden de stemmen meegerekend van
      natuurlijke personen, rechtspersonen of vennootschappen met wie, onderscheidenlijk waarmee wordt samengewerkt op
      grond van een overeenkomst of onderling afgestemde feitelijke gedraging.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel4
  - number: '5.1'
    text: |-
      In afwijking van de [artikelen 2][ref1] en [3][ref2] is deze wet niet van toepassing indien:


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0046747#Artikel3
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0046747
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 5.1.a
    text: |-
      het bij een bepaalde verwervingsactiviteit, op grond van een wettelijk voorschrift, slechts mogelijk is voor de
      Staat der Nederlanden, provincies, gemeenten of andere openbare lichamen om verwerver te zijn, onmiddellijk, dan
      wel middellijk;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel5
  - number: 5.1.b
    text: |-
      er op de verwervingsactiviteit op grond van een andere wet een specifieke toets uit hoofde van nationale veiligheid
      van toepassing is, ongeacht de inhoud van die specifieke toets;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel5
  - number: 5.1.c
    text: |-
      er een andere wet van toepassing is die voorziet in een specifieke toets uit hoofde van nationale veiligheid, maar
      die toets enkel niet op een doelonderneming van toepassing is doordat de verwervingsactiviteit niet voldoet aan een
      in de andere wet gestelde minimale omvang van de verwervingsactiviteit of van een andere aard is dan in de andere
      wet voor toetsing is voorgeschreven.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel5
  - number: 5.1.d
    text: |-
      de verwerver een rechtspersoon is die onafhankelijk is van een beursgenoteerde doelonderneming, indien deze
      verwerver ten doel heeft het behartigen van de belangen van deze doelonderneming, en een met haar verbonden
      onderneming, die de zeggenschap of significante invloed na aankondiging van een openbaar bod voor de duur van
      maximaal twee jaar verkrijgt ter bescherming van deze doelonderneming;
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel5
  - number: 5.1.e
    text: |-
      de verwerver de Staat der Nederlanden, een provincie of een gemeente gelegen in Nederland of een ander openbaar
      lichaam naar Nederlands recht is; of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel5
  - number: 5.1.f
    text: |-
      de verwerver een rechtspersoon is die statutair ten doel heeft het behartigen van de belangen van het financiële
      stelsel die gemoeid zijn met een ordentelijke en gecontroleerde wijze van afwikkeling van een entiteit als bedoeld
      in [artikel 7, vijfde tot en met achtste lid][ref1], waarvan door De Nederlandsche Bank of, al naar gelang de
      bevoegdheidsverdeling op grond van artikel 7 van [verordening 806/2014](32014R0806), de afwikkelingsraad genoemd
      in artikel 42 van die verordening, is vastgesteld dat aan de voorwaarden voor afwikkeling van die doelonderneming
      is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel7
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '5.2'
    text: |-
      Als verwerver als bedoeld in het eerste lid, onderdeel f, wordt
      in ieder geval beschouwd een overbruggingsstichting als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __, een overbruggingsonderneming als bedoeld in [artikel 7c van dat besluit][ref2], en een entiteit voor activa-
      en passivabeheer als bedoeld in [artikel 7d, van dat besluit][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0020414#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0020414#Artikel7c
      [ref3]: https://wetten.overheid.nl/BWBR0020414#Artikel7d
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020414
        artikel: 7b
      - id: ref2
        bwb_id: BWBR0020414
        artikel: 7c
      - id: ref3
        bwb_id: BWBR0020414
        artikel: 7d
  - number: '6'
    text: |-
      Voor de toepassing van deze wet wordt onder een doelonderneming die een vitale aanbieder of beheerder van een
      bedrijfscampus is tevens verstaan een doelonderneming die zeggenschap heeft over een in Nederland gevestigde
      vitale aanbieder of beheerder van een bedrijfscampus en onder een doelonderneming die actief is op het gebied van
      sensitieve technologie wordt tevens een doelonderneming verstaan die zeggenschap heeft over of significante invloed
      heeft op een in Nederland gevestigde onderneming die actief is op het gebied van sensitieve technologie.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel6
  - number: '7.1'
    text: |-
      Als vitale aanbieder op het gebied van transport van warmte wordt een onderneming aangemerkt die geheel van tot
      elkaar behorende en met elkaar verbonden leidingen, bijbehorende installaties en overige hulpmiddelen ten behoeve
      van het transport van warmte dat van belang is voor de regionale warmtevoorziening vanaf de aansluiting op het
      warmtetransportnet van een warmtebron naar de aansluitingen op het warmtetransportnet van afnemers van warmte van
      een warmtetransportnet en de warmtetransportaansluitingen van warmtenetten, verzorgt.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: '7.2'
    text: 'Als vitale aanbieder op het gebied van kernenergie wordt een onderneming aangemerkt die:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: 7.2.a
    text: |-
      houder is van een vergunning als bedoeld in [artikel 15, onderdeel b, van de Kernenergiewet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel15
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '15'
  - number: 7.2.b
    text: |-
      op wie het [Geheimhoudingsbesluit Kernenergiewet][ref1] of het
      [Toepassingsbesluit 24 september 1971/nr.671/524][ref2] (Stcrt. 1971, nr. 187 en Stcrt. 1989, nr. 52) van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002768
      [ref2]: https://wetten.overheid.nl/BWBR0045254
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002768
      - id: ref2
        bwb_id: BWBR0045254
  - number: '7.3'
    text: 'Als vitale aanbieder op het gebied van luchtvervoer wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
  - number: 7.3.a
    text: |-
      de exploitant van de luchthaven Schiphol, bedoeld in [artikel 8.1b, van de Wet luchtvaart][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel8
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel7
    references:
