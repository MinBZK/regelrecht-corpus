        paragraaf: '3.4'
  - number: '58.4'
    text: 'Het eerste lid is niet van toepassing op een verwervingsactiviteit die betrekking heeft op een doelonderneming:'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel58
  - number: 58.4.a
    text: |-
      die actief is op het gebied van sensitieve technologie, die is aangewezen op grond van
      [artikel 8, derde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0046747#Artikel8
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0046747
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 58.4.b
    text: |-
      die dat is door zeggenschap of significante invloed uit te oefenen op een doelonderneming als bedoeld in
      onderdeel a; of
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel58
  - number: 58.4.c
    text: zijnde een beheerder van een bedrijfscampus.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel58
  - number: '59'
    text: |-
      Onze Minister zendt vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel59
  - number: '60'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel60
  - number: '61'
    text: 'Deze wet wordt aangehaald als: Wet veiligheidstoets investeringen, fusies en overnames.'
    url: https://wetten.overheid.nl/BWBR0046747/2024-01-01#Artikel61
