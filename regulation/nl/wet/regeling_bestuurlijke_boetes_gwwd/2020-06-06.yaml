preamble:
  text: |-
    Gelet op artikel 120b van de Gezondheids- en Welzijnswet voor dieren en de artikelen 4:81 tot en met 4:84 van de
    Algemene wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0028149/2020-06-06#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *wet:* [Gezondheids- en welzijnswet voor dieren](onbekend);
        - *Minister:* Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *vervoersverbod:* vervoersverbod als bedoeld in [artikel 30, eerste lid, van de wet][ref1]
        - *EU-maatregel:* een richtlijn, verordening onderscheidenlijk besluit als bedoeld in artikel 288 van het Verdrag
      betreffende de werking van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel30
    url: https://wetten.overheid.nl/BWBR0028149/2020-06-06#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '30'
  - number: '2'
    text: |-
      1 De hoogte van de bestuurlijke boetes die de Minister op grond van [artikel 120b van de wet][ref1] voor
      overtredingen als bedoeld in [artikel 120a, eerste lid, onderdeel a, van de wet][ref2] kan opleggen, wordt
      vastgesteld overeenkomstig de bedragen die horen bij de boetecategorieën die in de [bijlagen 1][ref3], [2][ref4],
      [3][ref5] of [4][ref6] voor de desbetreffende overtredingen zijn vastgelegd.

      2 De bedragen bij de boetecategorieën, bedoeld in het eerste lid, zijn:

      a. voor de categorie geringe overtredingen: € 500,−;

      b. voor de categorie overtredingen: € 1.500,−;

      c. voor de categorie ernstige overtredingen: € 2.500,−.

      d. voor de categorie overtredingen met verhoogde boete, zijnde overtredingen begaan ten aanzien van:

      1°. zes of meer dieren, met uitzondering van pluimvee;

      2°. indien het pluimvee betreft:

        - meer dan 7,5 procent van het aantal dieren op een transport, of
        - meer dan 5 procent van het aantal dieren op een transport ingeval die dieren dood zijn aangetroffen: € 6000,−


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel120b
