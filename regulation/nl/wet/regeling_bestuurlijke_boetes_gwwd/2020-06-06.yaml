  - number: '3'
    text: |-
      Indien in Nederland of in bepaalde gedeelten van Nederland een vervoersverbod geldt ten gevolge van een uitbraak
      van een krachtens [artikel 15 van de wet][ref1] of van een krachtens een EU-maatregel aangewezen dierziekte,
      en door de beboetbare gedraging een risico op verspreiding van deze ziekte kan ontstaan, is de bestuurlijke
      boete die wordt opgelegd gelijk aan het voor die overtreding ingevolge [artikel 2][ref2] bepaalde boetebedrag,
      vermenigvuldigd met een factor 1,5.


      [ref1]: https://wetten.overheid.nl/BWBR0005662#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0028149#Artikel2
    url: https://wetten.overheid.nl/BWBR0028149/2020-06-06#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005662
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0028149
        artikel: '2'
        paragraaf: '2'
  - number: '4'
    text: |-
      Indien binnen een tijdsbestek van vijf jaren door dezelfde persoon of rechtspersoon een eerder geconstateerde
      overtreding of een soortgelijke overtreding wordt herhaald, is de bestuurlijke boete gelijk aan de optelling van de
      voor die categorie overtredingen op te leggen boete en van de voor die eerdere overtreding opgelegde bestuurlijke
      boete.
    url: https://wetten.overheid.nl/BWBR0028149/2020-06-06#Artikel4
  - number: 4a
    text: |-
      Indien een overtreding is begaan van de voorschriften in de
      [Regeling identificatie en registratie van dieren][ref1], anders dan in de uitoefening van een beroep of bedrijf,
      wordt het voor die overtreding op grond van de [artikelen 2][ref2], [3][ref3] en [4][ref4] op te leggen
      boetebedrag gehalveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
      [ref2]: https://wetten.overheid.nl/BWBR0028149#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0028149#Artikel3
