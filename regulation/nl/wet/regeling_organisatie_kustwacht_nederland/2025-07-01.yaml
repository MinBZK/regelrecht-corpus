  - number: '2.1'
    text: Er is een Kustwacht.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel2
  - number: '2.2'
    text: |-
      De Kustwacht heeft tot doel om op een effectieve en efficiënte wijze te komen tot een zo verantwoord en veilig
      mogelijk gebruik van de wateren die deel uitmaken van het geografisch gebied, bedoeld in [artikel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel5
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '5'
        paragraaf: '1'
  - number: '2.3'
    text: |-
      De Kustwacht is een samenwerkingsverband van de ministers en de in [artikel 6][ref1] genoemde diensten.


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel6
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '6'
        paragraaf: '2'
  - number: '3.1'
    text: Er is een kustwachtcentrum.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel3
  - number: '3.2'
    text: |-
      Het kustwachtcentrum is het maritiem operatiecentrum, aeronautisch en maritiem reddings- en coördinatiecentrum en
      het maritiem informatieknooppunt ten behoeve van het doel van de Kustwacht, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel2
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '2'
        paragraaf: '1'
  - number: '4'
    text: De kustwachtorganisatie omvat
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel4
  - number: 4.a
    text: het kustwachtcentrum; en
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel4
  - number: 4.b
    text: ten behoeve van de taakuitvoering in de Kustwacht beschikbaar gesteld materieel en daarbij in te zetten personeel.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel4
  - number: '5'
    text: 'Het gebied waarin de taakuitvoering in de Kustwacht wordt verricht omvat:'
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel5
  - number: 5.a
    text: de Europese Nederlandse territoriale zee en de aangrenzende exclusieve economische zone;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel5
  - number: 5.b
    text: |-
      de Waddenzee, het IJsselmeer, inclusief Markermeer en Randmeren, en de Zeeuwse en Hollandse Stromen, voor zover de
      werkzaamheden betrekking hebben op maritieme hulpverlening;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel5
  - number: 5.c
    text: |-
      de Flight Information Region (FIR) Amsterdam, voor zover de werkzaamheden betrekking hebben op maritieme en
      aeronautische hulpverlening en voor zover deze werkzaamheden niet op land plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel5
  - number: 5.d
    text: |-
      alle voor de zeescheepvaart bevaarbare wateren wereldwijd voor zover het betreft activiteiten die voortvloeien
      uit Hoofdstuk V, Voorschrift 19-1, van het SOLAS-verdrag, voor zover het betreft zeeschepen die op grond van voor
      Nederland geldende rechtsregels gerechtigd zijn de vlag van het Koninkrijk te voeren die onder dit verdrag vallen;
      en
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel5
  - number: 5.e
    text: |-
      wateren die relevant zijn voor de nakoming van andere op Nederland rustende nationale en internationale
      verplichtingen.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel5
  - number: '6.1'
    text: 'De volgende diensten werken samen in de Kustwacht:'
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: 6.1.a
    text: Directoraat-Generaal Rijkswaterstaat;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: 6.1.b
    text: Inspectie Leefomgeving en Transport;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: 6.1.c
    text: Koninklijke Marechaussee;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: 6.1.d
    text: Politie;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: 6.1.e
    text: Douane;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: 6.1.f
    text: Fiscale inlichtingen- en opsporingsdienst;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: 6.1.g
    text: Staatstoezicht op de Mijnen; en
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: 6.1.h
    text: Nederlandse Voedsel- en Warenautoriteit.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: '6.2'
    text: 'De samenwerking in de Kustwacht brengt geen wijziging aan in:'
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: 6.2.a
    text: het gezag over de politie en de Koninklijke Marechaussee bij de uitvoering van de politietaak; of
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: 6.2.b
    text: |-
      in andere bij of krachtens verdrag of wet vastgestelde taken en andere taken en verantwoordelijkheden van een
      dienst.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel6
  - number: '7.1'
    text: |-
      Elke dienst wijst, indien van toepassing in opdracht van het gezag, voldoende en gekwalificeerd personeel aan ten
      behoeve van de inzet in de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel7
  - number: '7.2'
    text: |-
      De aanwijzing geschiedt overeenkomstig hetgeen hierover is afgesproken in de operationele overeenkomst, bedoeld in
      [artikel 15, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel15
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '15'
        paragraaf: '4'
  - number: '7.3'
    text: |-
      Personen die ten behoeve van de taakuitvoering in de Kustwacht door hun dienst zijn aangewezen, blijven deel
      uitmaken van de betrokken dienst.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel7
  - number: '7.4'
    text: De Directeur Kustwacht coördineert de taakuitvoering van de in het eerste lid bedoelde personen in de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel7
  - number: '8.1'
    text: |-
      De diensten stellen ten behoeve van de taakuitvoering in de Kustwacht in het kustwachtcentrum zo veel mogelijk
      informatie beschikbaar aan de Directeur Kustwacht of aan de andere diensten voor zover de Directeur Kustwacht
      of die diensten deze informatie nodig hebben voor de taakuitvoering in de Kustwacht en voor zover tegen
      terbeschikkingstelling geen beletselen bestaan bij of krachtens een verdrag of een wet of om andere zwaarwegende
      redenen.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel8
  - number: '8.2'
    text: |-
      In verband met toepassing van het eerste lid wordt door de betrokken diensten en, voor zover van toepassing, de
      Directeur Kustwacht schriftelijk vastgelegd welke gegevens voor welk doel en op welke wettelijke basis aan welke
      ontvanger ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel8
  - number: '9.1'
    text: De ministers zijn gezamenlijk verantwoordelijk voor het functioneren van de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel9
  - number: '9.2'
    text: |-
      Een opdrachtgevende minister blijft verantwoordelijk voor de taken die namens hem in de kustwachtorganisatie worden
      verricht.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel9
  - number: '9.3'
    text: |-
      Elke minister informeert andere ministers tijdig en volledig over zaken die aard, inhoud en taakuitvoering in de
      Kustwacht of het doel van de Kustwacht kunnen beïnvloeden. Hij treedt zo nodig met de andere ministers in overleg
      om ongewenste effecten voor de taakuitvoering in de Kustwacht of met betrekking tot het doel van de Kustwacht te
      voorkomen of te beperken.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel9
  - number: '9.4'
    text: |-
      Elke minister is verantwoordelijk voor het vertalen van het voor hem toepasselijke beleid in duidelijke en
      uitvoerbare opdrachten ten behoeve van de Directeur Kustwacht en voor het daartoe aan hem beschikbaar stellen van
      kwalitatief en kwantitatief voldoende middelen en informatie.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel9
  - number: '9.5'
    text: |-
      Elke minister neemt de exploitatie-uitgaven en investeringsuitgaven, bedoeld in [artikel 17][ref1] op in zijn eigen
      begroting en legt hierover verantwoording af voor zover deze budgetten nog niet zijn overgeheveld naar de Minister
      van Defensie. Tot dat tijdstip neemt elke minister in de begroting meerjarige reeksen op inzake de bekostiging van
      de Kustwacht, ter borging van de continuïteit van de kustwachtorganisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel17
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '17'
        paragraaf: '5'
  - number: '10.1'
    text: |-
      De Minister van Infrastructuur en Waterstaat treedt op als coördinerend bewindspersoon voor de Kustwacht. Dit
      betekent dat hij verantwoordelijk is voor:
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel10
  - number: 10.1.a
    text: |-
      de afstemmingsprocessen tussen de ministers om te komen tot een duurzame en integrale visie op de Kustwacht, de
      kustwachtorganisatie en de inzet van personeel en materieel;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel10
  - number: 10.1.b
    text: |-
      de afstemmingsprocessen tussen de ministers ten behoeve van de integrale opdrachtverlening aan de Directeur
      Kustwacht; en
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel10
  - number: 10.1.c
    text: het bewaken van de uitvoering van de afgesproken taken namens de ministers.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel10
  - number: '10.2'
    text: |-
      De Minister van Infrastructuur en Waterstaat is verantwoordelijk voor het jaarlijks opstellen van een
      dienstverleningsplan en een maritieme security plan en legt deze, als onderdeel van het gecombineerde jaarplan, ter
      goedkeuring voor aan de ministerraad.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel10
  - number: '10.3'
    text: |-
      De Minister van Infrastructuur en Waterstaat richt samen met de andere Ministers die het aangaat en het gezag een
      of meer overlegstructuren in ten behoeve van het opstellen van het maritieme security plan. Aan het overleg nemen
      de opdrachtgevende en uitvoerende vertegenwoordigers van de betrokken Ministers deel.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel10
  - number: '10.4'
    text: |-
      De Minister van Infrastructuur en Waterstaat organiseert de afstemmingsprocessen tussen de ministers die opdracht
      geven tot uitvoering van dienstverleningstaken en maritieme securitytaken om zo te komen tot een samenhangende
      opdrachtverlening ten behoeve van de uitvoering van deze taken.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel10
  - number: '10.5'
    text: |-
      De Minister van Infrastructuur en Waterstaat neemt het overzicht, genoemd in
      [artikel 12, eerste lid, onderdeel d][ref1], op in zijn begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel12
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '12'
        paragraaf: '3'
  - number: '10.6'
    text: |-
      De Minister van Infrastructuur en Waterstaat legt het gecombineerd jaarplan ter goedkeuring voor aan de
      ministerraad.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel10
  - number: '11.1'
    text: |-
      De Minister van Justitie en Veiligheid is verantwoordelijk voor het jaarlijks opstellen van een handhavingsplan
      en legt dit met inachtneming van [artikel 10, vijfde lid][ref1], als onderdeel van het gecombineerde jaarplan, ter
      goedkeuring voor aan de ministerraad.


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel10
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '10'
        paragraaf: '3'
  - number: '11.2'
    text: |-
      De Minister van Justitie en Veiligheid richt samen met de andere ministers die het aangaan en het gezag een of
      meer overlegstructuren in ten behoeve van het opstellen van een handhavingsplan. Aan het overleg nemen de relevante
      vertegenwoordigers van de betrokken ministers deel.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel11
  - number: '11.3'
    text: |-
      De Minister van Justitie en Veiligheid organiseert de afstemmingsprocessen tussen de ministers en het gezag die het
      aangaan en opdracht geven tot uitvoering van toezichts- en handhavingstaken om zo te komen tot een samenhangende
      opdrachtverlening ten behoeve van de uitvoering van deze taken.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel11
  - number: '12.1'
    text: |-
      De Minister van Defensie is verantwoordelijk voor de organisatie en het beheer van de kustwachtorganisatie. Dit
      betekent dat hij verantwoordelijk is voor:
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel12
  - number: 12.1.a
    text: |-
      de bewaking van de kwaliteit van de bedrijfsvoering en de bedrijfsvoeringsprocessen van het kustwachtcentrum op
      korte en lange termijn;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel12
  - number: 12.1.b
    text: |-
      het faciliteren en ondersteunen van het kustwachtcentrum voor die aspecten van de bedrijfsvoering die niet bij de
      kustwachtorganisatie zelf zijn belegd; en
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel12
  - number: 12.1.c
    text: |-
      het op verzoek van de opdrachtgevende ministers uitvoeren van investeringsprojecten binnen de daarvoor geldende
      regels en procedures van het Ministerie van Defensie; en
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel12
  - number: 12.1.d
    text: |-
      het opstellen van een totaaloverzicht van de onderdelen van de begrotingen van alle ministers die betrekking hebben
      op de kustwachtorganisatie, ten behoeve van de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel12
  - number: '12.2'
    text: |-
      De Minister van Defensie is verantwoordelijk voor het jaarlijks opstellen van een APB en legt dit, als onderdeel
      van het gecombineerde jaarplan, met inachtneming van [artikel 10, vijfde lid][ref1], ter goedkeuring voor aan de
      ministerraad.


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel10
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '10'
        paragraaf: '3'
  - number: '12.3'
    text: |-
      De Minister van Defensie voert de regie over de begrotings- en verantwoordingsprocessen in verband met de
      kustwachtorganisatie.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel12
  - number: '12.4'
    text: |-
      De Minister van Defensie bewaakt het nakomen van de in het APB gemaakte afspraken tussen de opdrachtgevende
      ministers en de afspraken tussen de diensten en de Directeur Kustwacht, bedoeld in [artikel 15, derde lid][ref1].
      Indien een minister of een dienst zijn financiële, materiële of personele verplichtingen niet of niet volledig
      nakomt is de Minister van Defensie bevoegd de uitvoering van taken ten behoeve van een dienst aan te laten passen
      door de Directeur Kustwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel15
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '15'
        paragraaf: '4'
  - number: '12.5'
    text: De Minister van Defensie benoemt de Directeur Kustwacht, gehoord de andere ministers.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel12
  - number: '13.1'
    text: |-
      De ministers laten zich, ten behoeve van de coördinatie van de uitvoering van de taken genoemd in de
      [artikelen 9][ref1], [10][ref2], [11][ref3] en [12][ref4], bijstaan door de Raad voor de Kustwacht.


      [ref1]: https://wetten.overheid.nl/BWBR0042251#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0042251#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0042251#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0042251#Artikel12
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0042251
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0042251
        artikel: '10'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0042251
        artikel: '11'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0042251
        artikel: '12'
        paragraaf: '3'
  - number: '13.2'
    text: |-
      De Raad voor de Kustwacht heeft tot doel de samenwerking tussen de ministers en de diensten te borgen en te
      versterken. De Raad voor de Kustwacht neemt daarom in elk geval besluiten over:
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: 13.2.a
    text: |-
      een integrale visie op de Kustwacht en de kustwachtorganisatie en in verband daarmee de wijze waarop de uitoefening
      van de samenwerking in Kustwacht plaats dient te vinden;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: 13.2.b
    text: |-
      het dienstverleningsplan, het handhavingsplan, het maritieme security plan en het APB en de wijze van
      totstandkoming daarvan ten behoeve van de integrale opdrachtverlening aan de Directeur Kustwacht en de
      randvoorwaarden waarbinnen de opdrachten dienen te worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: 13.2.c
    text: |-
      alle aspecten betreffende de coördinatie- en sturingsrelaties tussen de ministers en hun diensten alsmede overige
      relevante actoren, voor zover dit door de Raad voor de Kustwacht nodig wordt geacht;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: 13.2.d
    text: |-
      de wijze van aansturing van en verantwoording door de Directeur Kustwacht over de organisatie en diens
      taakuitvoering en het tijdig signaleren van mogelijke knelpunten daarin.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: '13.3'
    text: |-
      De Raad voor de Kustwacht neemt besluiten met volledige instemming van ieder lid. Indien in de Raad niet
      tot overeenstemming tussen de ministers kan worden gekomen, doet de Raad voor de Kustwacht bij monde van
      haar voorzitter, een voorstel aan de Minister van Infrastructuur en Waterstaat tot nadere beraadslaging en
      besluitvorming over het betreffende onderwerp door de ministerraad.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: '13.4'
    text: |-
      De Raad voor de Kustwacht bestaat uit een vertegenwoordiger van elke minister. De desbetreffende minister benoemt
      de vertegenwoordiger en kan deze ook schorsen of uit deze functie ontheffen.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: '13.5'
    text: |-
      De Raad voor de Kustwacht wordt voorgezeten door de vertegenwoordiger van de Minister van Infrastructuur en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: '13.6'
    text: |-
      De in het vierde lid bedoelde vertegenwoordigers hebben, gelet op het op hen van toepassing zijn departementale
      mandaatbesluit, het mandaat om besluiten te nemen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: '13.7'
    text: |-
      De vertegenwoordiger van de Minister van Infrastructuur en Waterstaat draagt zorg voor het secretariaat van de Raad
      voor de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: '13.8'
    text: De Directeur Kustwacht neemt als adviseur deel aan vergaderingen van de Raad voor de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: '13.9'
    text: |-
      De Raad voor de Kustwacht is bevoegd ook anderen dan de in het achtste lid genoemde persoon uit te nodigen om als
      adviseur deel te nemen aan de vergaderingen van de Raad voor de Kustwacht.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel13
  - number: '14'
    text: 'De Directeur Kustwacht:'
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel14
  - number: 14.a
    text: is belast met de dagelijkse leiding over het Kustwachtcentrum en de kustwachtorganisatie;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel14
  - number: 14.b
    text: |-
      zorgt en is verantwoordelijk voor een doeltreffende uitvoering door de diensten van de taken die zijn vastgesteld
      in het APB binnen de financiële kaders daarvan;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel14
  - number: 14.c
    text: |-
      coördineert ten behoeve van onderdeel b de nationale en internationale werkprocessen en de inzet van materieel
      en middelen;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel14
  - number: 14.d
    text: stelt ter besluitvorming door de ministers het APB op;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel14
  - number: 14.e
    text: |-
      stelt ter verantwoording aan de ministers inzake de realisatie van het APB viermaandelijks een voortgangsrapportage
      en jaarlijks een jaarverslag op;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel14
  - number: 14.f
    text: stelt een lange termijnplan op en legt dit plan ter goedkeuring voor aan de Raad voor de Kustwacht;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel14
  - number: 14.g
    text: |-
      adviseert gevraagd en ongevraagd de Ministers bij het opstellen van het dienstverleningsplan, het handhavingsplan
      en het maritieme security plan;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel14
  - number: 14.h
    text: |-
      adviseert gevraagd en ongevraagd de ministers over doelmatige en doeltreffende uitvoering van het door hen
      vastgestelde beleid en de benodigde inzet van middelen daarbij;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel14
  - number: 14.i
    text: |-
      adviseert gevraagd en ongevraagd de ministers ten aanzien van andere zaken die van belang zijn voor de
      taakuitvoering in de Kustwacht in nationaal en internationaal verband;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel14
  - number: 14.j
    text: |-
      is bevoegd om namens de Minister van Defensie de coördinatie en ondersteuning van de taakuitvoering in de Kustwacht
      aan te passen indien een minister of een dienst zijn financiële, materiele of personele verplichtingen niet of niet
      volledig nakomt.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel14
  - number: '15.1'
    text: |-
      De Directeur Kustwacht krijgt ten behoeve van opsporing en redding, rampenbestrijding, of ten behoeve van de
      coördinatie en ondersteuning in verband met de noodzakelijke opsporing van strafbare feiten en incidenten, op
      diens eerste verzoek onmiddellijk de beschikking over één of meer schepen of luchtvaartuigen en daarbij behorende
      bemanning van de diensten.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel15
  - number: '15.2'
    text: |-
      De gezagvoerder of commandant van het schip of luchtvaartuig, bedoeld in het eerste lid, blijft verantwoordelijk
      voor de veiligheid van het schip of luchtvaartuig en de daarbij behorende bemanning.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel15
  - number: '15.3'
    text: |-
      Directeur Kustwacht en een dienst sluiten een operationele overeenkomst in verband met de specifieke inzet van
      materieel en personeel van de betreffende dienst.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel15
  - number: '16.1'
    text: |-
      De Directeur Kustwacht is na instemming van de ministers binnen de kaders van het APB, gemachtigd om namens een of
      meer ministers die het aangaan of een of meer diensten die het aangaan, bindende afspraken te maken met betrekking
      tot de taakuitvoering in de Kustwacht met:
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel16
  - number: 16.1.a
    text: |-
      bestuursorganen, waarbij van de informatie die bij een of meer diensten beschikbaar is, gebruik kan worden gemaakt
      voor zover dat bestuursorgaan deze informatie nodig heeft voor het uitvoeren van de eigen taak en voor zover
      daartegen bij of krachtens een verdrag of wet of om andere zwaarwegende redenen geen beletselen bestaan;
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel16
  - number: 16.1.b
    text: |-
      derden over aan hem ter beschikking te stellen schepen en luchtvaartuigen en daarbij behorende bemanning, die nodig
      zijn voor de uitvoering van taken van een of meer diensten of de samenwerking tussen diensten; en
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel16
  - number: 16.1.c
    text: derden in verband met de taakuitvoering in de Kustwacht voor zover niet genoemd in onderdeel a of b.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel16
  - number: '16.2'
    text: |-
      Bij de afspraak bedoeld in het eerste lid, onderdeel b, wordt door hem in elk geval vastgelegd dat de gezagvoerder
      of de commandant van het betreffende schip of luchtvaartuig in alle gevallen verantwoordelijk blijft voor de
      veiligheid van het schip of luchtvaartuig en de daarbij behorende bemanning.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel16
  - number: '17.1'
    text: |-
      De begroting van de kustwachtorganisatie is opgebouwd uit een exploitatiedeel en een investeringendeel. De
      begroting wordt onderbouwd met het APB.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel17
  - number: '17.2'
    text: |-
      De begroting van de kustwachtorganisatie is gebaseerd op meerjarige afspraken tussen de ministers over de verwachte
      verdeling van de exploitatie- en investeringsuitgaven.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel17
  - number: '17.3'
    text: |-
      De verantwoording van de begroting is gebaseerd op meerjarige afspraken tussen de ministers over de verdeling van
      de exploitatie- en investeringsuitgaven.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel17
  - number: '18.1'
    text: |-
      Schepen en luchtvaartuigen, die toebehoren aan een dienst of aan de Minister van Defensie of worden ingehuurd
      en langdurig worden ingezet voor de taakuitvoering in de Kustwacht zijn in de kustwachtkleuren geschilderd
      respectievelijk voorzien van het kustwachtlogo.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel18
  - number: '18.2'
    text: |-
      Andere dan de in het eerste lid bedoelde schepen of luchtvaartuigen die worden ingezet voor de taakuitvoering in de
      Kustwacht, voeren de kustwachtvlag, respectievelijk zijn voorzien van het kustwachtlogo.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel18
  - number: '19'
    text: |-
      Op basis van [Besluit instelling Kustwacht][ref1] bestaande overeenkomsten en andere afspraken worden, tenzij in
      die documenten anders is bepaald, geacht onder deze regeling te vallen.


      [ref1]: https://wetten.overheid.nl/BWBR0020546
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0020546
  - number: '29'
    text: |-
      Het [Besluit instelling Kustwacht][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0020546
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0020546
  - number: '30'
    text: Deze regeling treedt in werking met ingang van 1 juli 2019.
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel30
  - number: '31'
    text: 'Deze regeling wordt aangehaald als: Regeling organisatie Kustwacht Nederland.'
    url: https://wetten.overheid.nl/BWBR0042251/2025-07-01#Artikel31
