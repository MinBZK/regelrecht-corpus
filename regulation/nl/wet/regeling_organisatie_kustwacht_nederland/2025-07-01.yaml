preamble:
  text: |-
    Handelende in overeenstemming met de Ministers van Justitie en Veiligheid, van Financiën, van Economische Zaken en
    Klimaat en van Landbouw, Natuur en Voedselkwaliteit,

    Gelet op artikel 44 van de Grondwet, de artikelen 5, eerste lid, 17, eerste lid, 23 en 36, eerste lid, van
    de Wet bestrijding maritieme ongevallen en de artikelen 10:3, 10:4, eerste lid, en 10:6 van de Algemene wet
    bestuursrecht, Richtlijn nr. 2010/65/EU van het Europees Parlement en de Raad van 20 oktober 2010 betreffende
    meldingsformaliteiten voor schepen die aankomen in en/of vertrekken uit havens van de lidstaten en tot intrekking
    van Richtlijn 2002/6/EG (PbEU L 283), Hoofdstuk V, Voorschrift 19-1, van het op 1 november 1974 te Londen tot
    stand gekomen Verdrag voor de beveiliging van mensenlevens op zee (Trb. 1976, 157), en de bij dat verdrag behorende
    bindende protocollen, aanhangsels en bijlagen (SOLAS-verdrag), Richtlijn nr. 2000/59/EG van het Europees Parlement
    en de Raad van 27 november 2000 betreffende havenontvangstvoorzieningen voor scheepsafval en ladingresiduen
    (PbEG L 332), Richtlijn nr. 2002/59/EG van het Europees Parlement en de Raad van 27 juni 2002 betreffende de
    invoering van een communautair monitoring- en informatiesysteem voor de zeescheepvaart en tot het intrekken van
    Richtlijn 93/75/EEG van de Raad (PbEG L 131), verordening (EG) nr. 725/2004 van het Europees Parlement en de Raad
    van 31 maart 2004 betreffende de verbetering van de beveiliging van schepen en havenfaciliteiten (PbEU L 129),
    richtlijn nr. 2005/44/EG van het Europees Parlement en de Raad van 7 september 2005 betreffende geharmoniseerde
    River Information Services (RIS) op de binnenwateren in de Gemeenschap (PbEU L 255), richtlijn nr. 2009/16/
    EG van het Europees Parlement en de Raad van 23 april 2009 betreffende havenstaatcontrole (Herschikking) (PbEU
    L 131), en de artikelen 29 en 30 van de Wet havenstaatcontrole, 12 en 12a van de Wet voorkoming verontreiniging
    door schepen, 1, 2, 3, 4, 10, eerste lid, 11, 12, 16, 21, derde lid, en 22 van het Besluit meldingsformaliteiten
    en gegevensverwerkingen scheepvaart, 9.07 van het Binnenvaartpolitiereglement, 9 van het Loodsplichtbesluit
    1995, 21, 29 en 38, van het Scheepvaartreglement Eemsmonding, 5 van het Scheepvaartreglement territoriale zee,
    2, tweede lid, onderdeel a, onder 1°, van het Scheepvaartreglement voor het Kanaal van Gent naar Terneuzen,
    51 van het Scheepvaartreglement Westerschelde, 5 van het Vaststellingsbesluit binnenvaartpolitiereglement; de
    artikelen 27, eerste lid, van de Vervoersnoodwet, 22, eerste lid, van de Havennoodwet en 16, tweede lid, van de
    Prijzennoodwet; artikel 25 van het op 7 december 1944 te Chicago tot stand gekomen Verdrag inzake de internationale
    burgerluchtvaart (Trb. 1973, 109) en het op 27 april 1979 te Hamburg tot stand gekomen Internationaal Verdrag
    inzake opsporing en redding op zee (Trb. 1980, 181); de artikelen 3, 18, tweede lid, en 19, eerste en tweede
    lid, van het Besluit luchtverkeer 2014; het in 1960 in Londen mede door de Nederlandse Regering ondertekende
    Internationale Verdrag voor de Beveiliging van Mensenlevens op Zee, Hoofdstuk 5 bepaling 4 (meteorologische
    dienstverlening), en gezien het rapport van overleg dat terzake heeft plaats gehad tussen met name de
    vertegenwoordigers van het Koninklijk Nederlands Meteorologisch Instituut, de Hoofddirectie van Rijkswaterstaat en
    het Ministerie van Defensie in het Interdepartementaal Directeurenoverleg Noordzee van 13 juni 2001; de artikelen
    12, 22, 32, 46, 48, eerste lid, 51, 54, 58 en 65 van het Schepenbesluit 2004, de artikelen 5, eerste lid, 26e,
    tweede lid, en 26f van de Schepenwet en de artikelen 3, eerste lid, 7, eerste lid, en 11, tweede lid, van de
    Wet buitenlandse schepen, op richtlijn nr. 92/29/EEG van de Raad van de Europese Gemeenschappen van 31 maart
    1992 betreffende de minimumvoorschriften inzake veiligheid en gezondheid ter bevordering van een betere medische
    hulpverlening aan boord van schepen (PbEG L 113), alsmede op de in artikel 1 van deze regeling genoemde Codes,
    richtlijnen en verordeningen;

    BESLUITEN
