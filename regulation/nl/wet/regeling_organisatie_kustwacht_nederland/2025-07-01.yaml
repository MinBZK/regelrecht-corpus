articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - *APB:* activiteitenplan en begroting waarin onder andere uitgaande van het
      dienstverleningsplan, het handhavingsplan en het maritieme security plan, de middelen voor en de prioritering van
      de taakuitvoering in de Kustwacht worden vastgelegd voor een bepaald kalenderjaar en gepland voor de daaropvolgende
      vijf kalenderjaren;
        - *diensten:* diensten en organisaties, genoemd in [artikel 6][ref1];
        - *dienstverleningsplan:* plan waarin de gewenste taakuitvoering in de Kustwacht en resultaten met betrekking
      tot dienstverlening worden vastgelegd op basis van beleidsdoelen en beleidsprioriteiten voor een kalenderjaar en
      gepland voor de daarop volgende vijf kalenderjaren;
        - *Directeur Kustwacht:* Directeur Kustwacht, genoemd in [artikel 14][ref2];
        - *gecombineerd jaarplan:* het document waarin het handhavingsplan, het dienstverleningsplan, het maritieme
      security plan en het APB zijn samengevoegd;
        - *gezag:* het gezag over de uitvoering van de politietaak, genoemd in [artikelen 11][ref3], [12][ref4], [13][ref5]
      en [14 van de Politiewet 2012][ref6];
        - *handhavingsplan:* plan waarin de gewenste taakuitvoering in de Kustwacht en resultaten met betrekking tot
      toezicht en handhaving worden vastgelegd op basis van beleidsdoelen en beleidsprioriteiten voor een bepaald
      kalenderjaar en gepland voor de daarop volgende vier kalenderjaren;
        - *Kustwacht:* samenwerkingsverband, bedoeld in [artikel 2][ref7];
        - *kustwachtcentrum:* kustwachtcentrum, bedoeld in [artikel 3][ref8];
        - *kustwachtorganisatie:* kustwachtorganisatie, bedoeld in [artikel 4][ref9];
        - *maritieme security plan:* plan waarin de gewenste taakuitvoering in de Kustwacht en de resultaten met betrekking
      tot de maritieme security taken worden vastgelegd op basis van de beleidsdoelen en de beleidsprioriteiten voor een
      kalenderjaar en gepland voor de daarop volgende vijf kalenderjaren;
        - *middelen:* financiële en materiële en personele middelen die de Directeur Kustwacht ter beschikking worden
      gesteld ten behoeve van de taakuitvoering van de Kustwacht;
        - *ministers:* de Minister van Infrastructuur en Waterstaat, de Minister van Defensie, de Minister van Justitie
      en Veiligheid, de Minister van Financiën, de Minister van Economische Zaken en Klimaat, de Minister van Landbouw,
      Natuur en Voedselkwaliteit;
        - *opdrachtgevende ministers:* de Minister van Infrastructuur en Waterstaat, de Minister van Justitie en
      Veiligheid, de Minister van Financiën, de Minister van Economische Zaken en Klimaat, de Minister van Landbouw,
      Natuur en Voedselkwaliteit;
        - *SAR-taken:* search and rescue-taken, zijnde de opsporing en redding van in nood verkerende bemanningen en
      passagiers van vliegtuigen en schepen.
        - *taakuitvoering in de Kustwacht:* geheel van bij of krachtens een verdrag of wet vastgestelde taken die de
      diensten of de Directeur Kustwacht gelet op het APB uitvoeren en andere, uit het APB voortvloeiende taken die de
      diensten of de Directeur Kustwacht uitvoeren in de Kustwacht;


