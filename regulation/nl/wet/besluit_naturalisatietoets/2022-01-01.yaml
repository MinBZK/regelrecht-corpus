        artikel: '8'
  - number: '3'
    text: |-
      1 Van het afleggen van een naturalisatietoets is vrijgesteld de verzoeker die kan aantonen dat:

      a. hij valt onder de [Wet van 9 september 1976 (Stb. 1976, 468) betreffende de positie van Molukkers][ref1];

      b. hij, na onderwijs te hebben gevolgd in de Nederlandse taal, dan wel – indien de verzoeker in een openbaar
      lichaam, Aruba, Curaçao of Sint Maarten hoofdverblijf heeft – in de taal die op het eiland van hoofdverblijf naast
      het Nederlands gangbaar is, in het bezit is gesteld van een op wettelijke basis uitgereikt diploma of getuigschrift
      van afronding van een opleiding van wetenschappelijk onderwijs, hoger onderwijs, algemeen voortgezet onderwijs,
      beroepsonderwijs of leerlingwezen. De verzoeker, bedoeld in de voorgaande zin, die in de taal die op het eiland
      van hoofdverblijf naast het Nederlands gangbaar is onderwijs heeft gevolgd, toont tevens aan dat hij in een vak
      Nederlandse taal is onderwezen en voor dat vak een voldoende heeft behaald;

      c. hij in het bezit is van een diploma staatsexamen Nederlands als Tweede taal, programma I dan wel programma II
      als bedoeld in [artikel 7.3.1 van de Wet educatie en beroepsonderwijs][ref2];

      d. hij in het bezit is van een certificaat als bedoeld in
      [artikel 13, tweede lid, van de Wet inburgering nieuwkomers][ref3], indien uit de vermelding daarop blijkt dat
      tenminste de volgende niveaus zijn behaald:

      1°. voor de onderdelen «Luisteren», «Spreken» en «Lezen» en «Schrijven» van de eindtermen Referentiekader
      Nederlands als Tweede Taal: niveau 2:

      2°. voor het onderdeel «Maatschappij Oriëntatie»: het niveau van
      [artikel 11, eerste lid, onderdeel b, van die wet][ref4];

      e. met toepassing van [artikel 5, tweede lid, van de Wet inburgering nieuwkomers][ref5] ten aanzien van hem is
      besloten het vaststellen van een inburgeringsprogramma achterwege te laten, omdat tijdens het inburgeringsonderzoek
      aannemelijk is geworden dat hij de kennis, het inzicht en de vaardigheden die hij door het deelnemen aan een
      inburgeringsprogramma zou kunnen verwerven, reeds in voldoende mate op een andere wijze heeft verworven;

      f. hij een toets als bedoeld in [artikel 5, vierde lid, van de Wet inburgering nieuwkomers][ref6] met goed
      gevolg heeft afgelegd, als gevolg waarvan hij beschikt over een besluit, inhoudende dat de vaststelling van een
      inburgeringsprogramma achterwege wordt gelaten;

      g. hij met toepassing van [artikel 3, derde lid, onder a, van de Wet inburgering nieuwkomers][ref7] wegens
      psychische of lichamelijke redenen voor onbepaalde duur is ontheven van de verplichting een inburgeringsprogramma
      te volgen;

      h. hij in het bezit is van het diploma, bedoeld in
      [artikel 7, vierde lid, onderdeel g, van de Wet inburgering][ref8] dan wel het inburgeringsdiploma, bedoeld
      in [artikel 14, tweede lid, van de Wet inburgering][ref9] zoals die wet luidde voor de inwerkingtreding van de
      __REF002___________________________________________________________________________________________________________
      __________________________________________________________________________ (Stb. 2012, 430) met daarop de
      vermelding dat de vaardigheden in de Nederlandse taal op het niveau A2 van het Europees Raamwerk voor Moderne
      Vreemde Talen zijn verworven;

      i. hij in het bezit is van het document, bedoeld in [artikel 2.7, tweede lid, van het Besluit inburgering][ref11],
      zoals dat besluit luidde voor de inwerkingtreding van het
      __REF001___________________________________________________________________________________________________________
      ______________________________________________________________________________________ (Stb. 2012, 432);

      j. hij ten minste acht jaren tijdens de leerplichtige leeftijd in het Europese deel van Nederland heeft verbleven
      als bedoeld in [artikel 5, eerste lid, onderdeel b, van de Wet inburgering][ref13];

      k. hij in het bezit is van een met een van de in onderdeel b genoemde diploma’s of getuigschriften vergelijkbaar
      diploma of een ander document, behaald in het Nederlandstalig onderwijs in België, mits een voldoende is behaald
      voor het vak Nederlandse taal;

      l. hij in het bezit is van een met een van de in onderdeel b genoemde diploma’s of getuigschriften vergelijkbaar
      diploma of een ander document, behaald in het Nederlandstalig onderwijs in Suriname, mits een voldoende is behaald
      voor het vak Nederlands;

      m. hij in het bezit is van het diploma van het Europees baccalaureaat van de Europese school (Trb. 1957, 246),
      voorzover dat baccalaureaat het vak Nederlands als eerste of tweede taal omvat en voor dat vak een voldoende is
      behaald; of

      n. hij in het bezit is van het getuigschrift Internationaal Baccalaureate Middle Years Certificate, International
      General Certificate of Secondary Education of Internationaal Baccalaureaat, indien daartoe een cursus Engels-
      Nederlandstalig onderwijs of een cursus Internationaal Baccalaureaat met daarin het vak Nederlands is gevolgd en
      voor dat vak een voldoende is behaald.

      2 Bij een certificaat als bedoeld in het eerste lid, onder d, legt de verzoeker de verklaring over van het
      Regionaal Opleidingencentrum op grond waarvan het certificaat is afgegeven.

      3 Bij ministeriële regeling kan worden voorzien in gedeeltelijke vrijstelling van de naturalisatietoets op grond
      van andere diploma’s, certificaten of documenten dan genoemd in het eerste en het tweede lid.


