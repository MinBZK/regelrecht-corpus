---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: besluit_naturalisatietoets
regulatory_layer: WET
publication_date: '2022-03-18'
valid_from: '2022-01-01'
bwb_id: BWBR0013604
url: https://wetten.overheid.nl/BWBR0013604/2022-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van de Staatssecretaris van Justitie van 31 januari 2002, Directie Wetgeving, nr. 5140649/01/6;

    Gelet op artikel 8, eerste lid, aanhef en onder d, en artikel 23 van de Rijkswet op het Nederlanderschap;

    De Raad van State van het Koninkrijk gehoord (advies van 8 maart 2002, nr. W03.02.0053/I/K);

    Gezien het nader rapport van de Staatssecretaris van Justitie van 9 april 2002, Directie Wetgeving, nr.
    5157553/02/6;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel1
  - number: 1.a
    text: |-
      Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in zijn hoedanigheid van minister van
      het Koninkrijk;
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel1
  - number: 1.b
    text: |-
      verzoeker: vreemdeling die op grond van de [Rijkswet op het Nederlanderschap][ref1] verzoekt om verlening van het
      Nederlanderschap;


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: 1.c
    text: |-
      de naturalisatietoets: de toets, genoemd in [artikel 2, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013604#Artikel2
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013604
        artikel: '2'
  - number: 1.d
    text: 'openbaar lichaam: de openbare lichamen Bonaire, Sint Eustatius en Saba.'
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel1
  - number: '2.1'
    text: |-
      Een verzoeker beschikt over voldoende kennis van de taal alsmede van de staatsinrichting en maatschappij als
      bedoeld in [artikel 8, eerste lid, aanhef en onder d, van de Rijkswet op het Nederlanderschap][ref1], indien hij
      beschikt over een zodanige mate van kennis van de taal alsmede van de staatsinrichting en maatschappij, dat hij
      zelfstandig in de samenleving van Nederland, Aruba, Curaçao, Sint Maarten of van de openbare lichamen Bonaire, Sint
      Eustatius en Saba kan functioneren.


      [ref1]: https://wetten.overheid.nl/BWBR0003738#Artikel8
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003738
        artikel: '8'
  - number: '2.2'
    text: |-
      Of hij beschikt over de mate van kennis van de taal alsmede van de staatsinrichting en maatschappij, bedoeld in
      het eerste lid, wordt vastgesteld aan de hand van een door Onze Minister op te stellen naturalisatietoets. Onze
      Minister stelt de naturalisatietoets voor Aruba, Curaçao en Sint Maarten vast na overleg met de Minister van
      Justitie van het betrokken land.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel2
  - number: '2.3'
    text: 'De toets van de kennis van de taal omvat een onderzoek naar:'
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel2
  - number: 2.3.a
    text: spreekvaardigheid;
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel2
  - number: 2.3.b
    text: luistervaardigheid;
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel2
  - number: 2.3.c
    text: schrijfvaardigheid; en
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel2
  - number: 2.3.d
    text: leesvaardigheid.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel2
  - number: '2.4'
    text: |-
      Onze Minister wijst de ambtenaren, autoriteiten of instellingen aan die de naturalisatietoets afnemen. Indien de
      plaatselijke omstandigheden daartoe aanleiding geven, kan Onze Minister in overeenstemming met de Minister die het
      aangaat de beoordeling of de verzoeker beschikt over de mate van kennis van de taal alsmede van de staatsinrichting
      en maatschappij, bedoeld in het eerste lid, opdragen aan de autoriteit of ambtenaar die het verzoek om verlening
      van het Nederlanderschap in ontvangst neemt.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel2
  - number: '3.1'
    text: 'Van het afleggen van een naturalisatietoets is vrijgesteld de verzoeker die kan aantonen dat:'
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
  - number: 3.1.a
    text: |-
      hij valt onder de [Wet van 9 september 1976 (Stb. 1976, 468) betreffende de positie van Molukkers][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003052
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003052
  - number: 3.1.b
    text: |-
      hij, na onderwijs te hebben gevolgd in de Nederlandse taal, dan wel – indien de verzoeker in een openbaar lichaam,
      Aruba, Curaçao of Sint Maarten hoofdverblijf heeft – in de taal die op het eiland van hoofdverblijf naast het
      Nederlands gangbaar is, in het bezit is gesteld van een op wettelijke basis uitgereikt diploma of getuigschrift
      van afronding van een opleiding van wetenschappelijk onderwijs, hoger onderwijs, algemeen voortgezet onderwijs,
      beroepsonderwijs of leerlingwezen. De verzoeker, bedoeld in de voorgaande zin, die in de taal die op het eiland
      van hoofdverblijf naast het Nederlands gangbaar is onderwijs heeft gevolgd, toont tevens aan dat hij in een vak
      Nederlandse taal is onderwezen en voor dat vak een voldoende heeft behaald;
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
  - number: 3.1.c
    text: |-
      hij in het bezit is van een diploma staatsexamen Nederlands als Tweede taal, programma I dan wel programma II als
      bedoeld in [artikel 7.3.1 van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 3.1.d
    text: |-
      hij in het bezit is van een certificaat als bedoeld in
      [artikel 13, tweede lid, van de Wet inburgering nieuwkomers][ref1], indien uit de vermelding daarop blijkt dat
      tenminste de volgende niveaus zijn behaald:


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel13
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '13'
  - number: 3.1.d.1°
    text: |-
      voor de onderdelen «Luisteren», «Spreken» en «Lezen» en «Schrijven» van de eindtermen Referentiekader Nederlands
      als Tweede Taal: niveau 2:
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
  - number: 3.1.d.2°
    text: |-
      voor het onderdeel «Maatschappij Oriëntatie»: het niveau van
      [artikel 11, eerste lid, onderdeel b, van die wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel11
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '11'
  - number: 3.1.e
    text: |-
      met toepassing van [artikel 5, tweede lid, van de Wet inburgering nieuwkomers][ref1] ten aanzien van hem is
      besloten het vaststellen van een inburgeringsprogramma achterwege te laten, omdat tijdens het inburgeringsonderzoek
      aannemelijk is geworden dat hij de kennis, het inzicht en de vaardigheden die hij door het deelnemen aan een
      inburgeringsprogramma zou kunnen verwerven, reeds in voldoende mate op een andere wijze heeft verworven;


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel5
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '5'
  - number: 3.1.f
    text: |-
      hij een toets als bedoeld in [artikel 5, vierde lid, van de Wet inburgering nieuwkomers][ref1] met goed gevolg
      heeft afgelegd, als gevolg waarvan hij beschikt over een besluit, inhoudende dat de vaststelling van een
      inburgeringsprogramma achterwege wordt gelaten;


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel5
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '5'
  - number: 3.1.g
    text: |-
      hij met toepassing van [artikel 3, derde lid, onder a, van de Wet inburgering nieuwkomers][ref1] wegens psychische
      of lichamelijke redenen voor onbepaalde duur is ontheven van de verplichting een inburgeringsprogramma te volgen;


      [ref1]: https://wetten.overheid.nl/BWBR0009544#Artikel3
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009544
        artikel: '3'
  - number: 3.1.h
    text: |-
      hij in het bezit is van het diploma, bedoeld in [artikel 7, vierde lid, onderdeel g, van de Wet inburgering][ref1]
      dan wel het inburgeringsdiploma, bedoeld in [artikel 14, tweede lid, van de Wet inburgering][ref2]
      zoals die wet luidde voor de inwerkingtreding van de
      __REF002___________________________________________________________________________________________________________
      _________________________________________________________________________ (Stb. 2012, 430) met daarop de vermelding
      dat de vaardigheden in de Nederlandse taal op het niveau A2 van het Europees Raamwerk voor Moderne Vreemde Talen
      zijn verworven;


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0032031
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0032031
  - number: 3.1.i
    text: |-
      hij in het bezit is van het document, bedoeld in [artikel 2.7, tweede lid, van het Besluit inburgering][ref1],
      zoals dat besluit luidde voor de inwerkingtreding van het
      __REF001___________________________________________________________________________________________________________
      _____________________________________________________________________________________ (Stb. 2012, 432);


      [ref1]: https://wetten.overheid.nl/BWBR0020674#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0032034
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020674
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0032034
  - number: 3.1.j
    text: |-
      hij ten minste acht jaren tijdens de leerplichtige leeftijd in het Europese deel van Nederland heeft verbleven als
      bedoeld in [artikel 5, eerste lid, onderdeel b, van de Wet inburgering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel5
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '5'
  - number: 3.1.k
    text: |-
      hij in het bezit is van een met een van de in onderdeel b genoemde diploma’s of getuigschriften vergelijkbaar
      diploma of een ander document, behaald in het Nederlandstalig onderwijs in België, mits een voldoende is behaald
      voor het vak Nederlandse taal;
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
  - number: 3.1.l
    text: |-
      hij in het bezit is van een met een van de in onderdeel b genoemde diploma’s of getuigschriften vergelijkbaar
      diploma of een ander document, behaald in het Nederlandstalig onderwijs in Suriname, mits een voldoende is behaald
      voor het vak Nederlands;
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
  - number: 3.1.m
    text: |-
      hij in het bezit is van het diploma van het Europees baccalaureaat van de Europese school (Trb. 1957, 246),
      voorzover dat baccalaureaat het vak Nederlands als eerste of tweede taal omvat en voor dat vak een voldoende is
      behaald; of
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
  - number: 3.1.n
    text: |-
      hij in het bezit is van het getuigschrift Internationaal Baccalaureate Middle Years Certificate, International
      General Certificate of Secondary Education of Internationaal Baccalaureaat, indien daartoe een cursus Engels-
      Nederlandstalig onderwijs of een cursus Internationaal Baccalaureaat met daarin het vak Nederlands is gevolgd en
      voor dat vak een voldoende is behaald.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
  - number: '3.2'
    text: |-
      Bij een certificaat als bedoeld in het eerste lid, onder d, legt de verzoeker de verklaring over van het Regionaal
      Opleidingencentrum op grond waarvan het certificaat is afgegeven.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
  - number: '3.3'
    text: |-
      Bij ministeriële regeling kan worden voorzien in gedeeltelijke vrijstelling van de naturalisatietoets op grond van
      andere diploma’s, certificaten of documenten dan genoemd in het eerste en het tweede lid.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel3
  - number: '4.1'
    text: |-
      Het verzoek wordt niet afgewezen om de reden dat de naturalisatietoets niet is behaald, indien ten genoegen van
      Onze Minister is aangetoond dat:
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel4
  - number: 4.1.a
    text: |-
      de verzoeker door een psychische of lichamelijke belemmering, dan wel een verstandelijke handicap, niet binnen vijf
      jaar in staat is de naturalisatietoets te behalen; of
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel4
  - number: 4.1.b
    text: |-
      het op grond van door de verzoeker geleverde inspanningen voor hem redelijkerwijs niet mogelijk is de
      naturalisatietoets te behalen.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel4
  - number: '5.1'
    text: |-
      Indien de verzoeker de naturalisatietoets met goed gevolg heeft afgelegd,
      wordt hem in het Europese deel van Nederland uitgereikt het diploma, bedoeld in
      [artikel 7, vierde lid, onderdeel g, van de Wet inburgering][ref1] dan wel het inburgeringsdiploma, bedoeld
      in [artikel 14, tweede lid, van de Wet inburgering][ref2] zoals die wet luidde voor de inwerkingtreding van de
      __REF002___________________________________________________________________________________________________________
      _________________________________________________________________________ (Stb. 2012, 430) met daarop de vermelding
      dat de vaardigheden in de Nederlandse taal op het niveau A2 van het Europees Raamwerk voor Moderne Vreemde Talen
      zijn verworven, en in een openbaar lichaam, Aruba, Curaçao of Sint Maarten een certificaat. Op het certificaat
      worden de onderdelen vermeld, die door de verzoeker met goed gevolg zijn afgelegd. Bij ministeriële regeling wordt
      voor het certificaat een model vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0020611#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0032031
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0020611
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0032031
  - number: '5.2'
    text: |-
      Het in het eerste lid bedoelde diploma alsmede het certificaat met de aantekening dat de verzoeker beschikt over
      de vereiste kennis van de Nederlandse taal worden in het kader van een verzoek om naturalisatie in het gehele
      Koninkrijk erkend.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel5
  - number: '5.3'
    text: |-
      Het certificaat met de aantekening dat de verzoeker beschikt over de vereiste kennis van de Engelse of Papiamentse
      taal wordt in het kader van zijn verzoek om naturalisatie alleen erkend op de eilanden waar die taal naast het
      Nederlands gangbaar is.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel5
  - number: '6'
    text: |-
      Bij ministeriële regeling kunnen, de Ministers van Justitie van Aruba, Curaçao en Sint Maarten gehoord, ter
      uitvoering van dit besluit nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel6
  - number: '7'
    text: |-
      Dit besluit is van toepassing op verzoeken om verlening van het Nederlanderschap die op of na de datum van
      inwerkingtreding van dit besluit zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel7
  - number: '8'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip,
      dat voor de verschillende artikelen of onderdelen daarvan en voor elk van de landen van het
      Koninkrijk verschillend kan worden vastgesteld. Dit besluit treedt niet eerder in werking dan de bij
      [Rijkswet van 21 december 2000][ref1] (Stb. 618) gewijzigde [artikelen 8, eerste lid, aanhef en onder d][ref2], en
      [23 van de Rijkswet op het Nederlanderschap][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0012089
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel23
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0012089
      - id: ref2
        bwb_id: BWBR0003738
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0003738
        artikel: '23'
  - number: '9'
    text: 'Dit besluit wordt aangehaald als: Besluit naturalisatietoets.'
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel9
