      Bij ministeriële regeling kunnen, de Ministers van Justitie van Aruba, Curaçao en Sint Maarten gehoord, ter
      uitvoering van dit besluit nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel6
  - number: '7'
    text: |-
      Dit besluit is van toepassing op verzoeken om verlening van het Nederlanderschap die op of na de datum van
      inwerkingtreding van dit besluit zijn ingediend.
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel7
  - number: '8'
    text: |-
      De artikelen van dit besluit treden in werking op een bij koninklijk besluit te bepalen tijdstip,
      dat voor de verschillende artikelen of onderdelen daarvan en voor elk van de landen van het
      Koninkrijk verschillend kan worden vastgesteld. Dit besluit treedt niet eerder in werking dan de bij
      [Rijkswet van 21 december 2000][ref1] (Stb. 618) gewijzigde [artikelen 8, eerste lid, aanhef en onder d][ref2], en
      [23 van de Rijkswet op het Nederlanderschap][ref3].


