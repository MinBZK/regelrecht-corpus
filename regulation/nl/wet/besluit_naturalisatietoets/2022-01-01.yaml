preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op voordracht van de Staatssecretaris van Justitie van 31 januari 2002, Directie Wetgeving, nr. 5140649/01/6;

    Gelet op artikel 8, eerste lid, aanhef en onder d, en artikel 23 van de Rijkswet op het Nederlanderschap;

    De Raad van State van het Koninkrijk gehoord (advies van 8 maart 2002, nr. W03.02.0053/I/K);

    Gezien het nader rapport van de Staatssecretaris van Justitie van 9 april 2002, Directie Wetgeving, nr.
    5157553/02/6;

    De bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties in zijn hoedanigheid van minister van
      het Koninkrijk;

      b. verzoeker: vreemdeling die op grond van de [Rijkswet op het Nederlanderschap][ref1] verzoekt om verlening van
      het Nederlanderschap;

      c. de naturalisatietoets: de toets, genoemd in [artikel 2, tweede lid][ref2];

      d. openbaar lichaam: de openbare lichamen Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0003738
      [ref2]: https://wetten.overheid.nl/BWBR0013604#Artikel2
    url: https://wetten.overheid.nl/BWBR0013604/2022-01-01#Artikel1
