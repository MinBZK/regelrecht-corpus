  - number: '2'
    text: |-
      Indien een schadeloosstelling, schadevergoeding of betaling, bedoeld in
      [artikel 1, eerste lid, onderdeel b, c, d of e][ref1], niet over een bepaalde periode is berekend, bepaalt het UWV
      op welke periode deze betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0004069#Artikel1
    url: https://wetten.overheid.nl/BWBR0004069/2009-04-01#Artikel2
