        artikel: '16'
  - number: '4'
    text: |-
      1 Indien de uitkomst van de berekening van het aantal arbeidsuren, bedoeld in
      [artikel 16, tweede lid, van de Werkloosheidswet][ref1] ten aanzien van de werknemer, die in ploegendienst of
      volgens andere vormen van werkroosters heeft gewerkt, gelet op zijn arbeidspatroon geen juist beeld geeft van dat
      arbeidspatroon, worden zonodig in afwijking van de voorgaande artikelen niet-gewerkte uren zodanig gelijkgesteld
      met gewerkte uren dan wel, worden gewerkte uren zodanig buiten beschouwing gelaten, dat het gemiddeld aantal
      arbeidsuren overeenkomt met het aantal uren van dat arbeidspatroon.

      2 Het eerste lid is van overeenkomstige toepassing indien voor de berekening van het aantal arbeidsuren, bedoeld in
      [artikel 16, tweede lid van de Werkloosheidswet][ref2], uren waarin de werknemer niet heeft gewerkt als gevolg van
      compensatieverlofdagen, op grond van [artikel 1][ref3] zijn gelijkgesteld met gewerkte uren.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel16
