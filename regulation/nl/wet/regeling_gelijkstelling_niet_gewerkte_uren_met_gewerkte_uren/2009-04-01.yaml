preamble:
  text: |-
    Overwegende, dat het wenselijk is voor de berekening van het aantal arbeidsuren, bedoeld in artikel 16, tweede lid,
    van de Werkloosheidswet, uren, waarin geen arbeid is verricht gelijk te stellen met arbeidsuren en uren, waarin
    arbeid is verricht, buiten beschouwing te laten;

    Overwegende voorts, dat er thans geen aanleiding is regels te stellen voor de berekening van het verlies
    van arbeidsuren, bedoeld in artikel 16, tweede lid, van de Werkloosheidswet met betrekking tot wisselende
    arbeidspatronen;

    Gelet op artikel 16, vierde lid, van de Werkloosheidswet (Stb. 1986, 566);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0004069/2009-04-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de berekening van het aantal arbeidsuren, bedoeld in [artikel 16, tweede lid, van de Werkloosheidswet][ref1],
      worden met arbeidsuren gelijkgesteld:

      a. uren, waarvoor de werknemer zonder te werken loon heeft ontvangen;

      b. uren, waarin de werknemer niet heeft gewerkt als gevolg van vakantie-, snipper-, of compensatieverlofdagen, voor
      zover hij voor die dagen geen loon maar een schadeloosstelling wegens loonderving heeft ontvangen of een aanspraak
      hierop heeft verkregen;

      c. uren, waarin de werknemer niet heeft gewerkt als gevolg van feestdagen, voor zover hij voor die dagen geen loon,
      maar een schadeloosstelling wegens loonderving heeft ontvangen;

      d. uren, waarin de werknemer niet heeft gewerkt en waarvoor hij schadeloosstelling of schadevergoeding wegens het
      beëindigen van de dienstbetrekking heeft ontvangen;

      e. uren, waarin de werknemer niet heeft gewerkt en waarvoor hij een betaling heeft ontvangen wegens niet-genoten
      compensatie- of periodiek verlof bij de beëindiging van de dienstbetrekking;

      f. uren, waarin de werknemer niet heeft gewerkt als gevolg van een regeling tot toepassing van een kortere dan de
      normale werktijd;

      g. uren, waarin de werknemer niet heeft gewerkt en waarvoor hij een uitkering op grond van een
      vorstuitkeringsreglement danwel een uitkering op grond van [artikel 18 van de Werkloosheidswet][ref2] heeft
      ontvangen;

      h. uren, waarin de werknemer niet heeft gewerkt en waarover hij recht op uitkering op grond van
      [hoofdstuk IV van de Werkloosheidswet][ref3] heeft;

      i. uren, waarin de werknemer niet heeft gewerkt als gevolg van ziekte of arbeidsongeschiktheid;

      j. uren, waarin de werknemer niet heeft gewerkt als gevolg van een verplichte bedrijfssluiting en waarvoor de
      werknemer geen loon of inkomsten wegens loonderving danwel vakantiebonnen of daarmee overeenkomende aanspraken
      heeft ontvangen of verkregen;

      k. uren, waarin de werknemer niet heeft gewerkt en waarover hij een uitkering heeft ontvangen op grond van
      [hoofdstuk 3, afdeling 2, paragraaf 1, van de Wet arbeid en zorg][ref4].

      2 Indien de periode van ziekte of arbeidsongeschiktheid dan wel de periode waarover uitkering als bedoeld in het
      eerste lid, onderdeel k, is ontvangen, gelet op het arbeidspatroon van de werknemer, aansluit op een periode waarin
      de werknemer in dienstbetrekking werkzaam was is het aantal uren dat op grond van het eerste lid, onderdeel i
      respectievelijk k, gelijkgesteld wordt, gelijk aan:

      a. het aantal arbeidsuren dat de werknemer zou hebben gewerkt indien hij niet ziek of arbeidsongeschikt zou zijn
      geworden dan wel zich geen situatie zou hebben voorgedaan op grond waarvan hij recht heeft op een uitkering als
      bedoeld in het eerste lid, onderdeel k, en hij op een vast aantal arbeidsuren werkzaam was;

      b. het gemiddeld aantal arbeidsuren dat de werknemer zou hebben gewerkt indien hij niet ziek of arbeidsongeschikt
      zou zijn geworden dan wel zich geen situatie zou hebben voorgedaan op grond waarvan hij recht heeft op een
      uitkering als bedoeld in het eerste lid, onderdeel k, en hij niet op een vast aantal arbeidsuren werkzaam was.

      Het gemiddeld aantal arbeidsuren, bedoeld in onderdeel b, wordt berekend over de periode, bedoeld in
      [artikel 16 van de Werkloosheidswet][ref5], met dien verstande dat buiten aanmerking blijven de in die periode
      gelegen dagen, waarop hij ten gevolge van ziekte of arbeidsongeschiktheid dan wel de situatie op grond waarvan hij
      recht heeft op een uitkering als bedoeld in het eerste lid, onderdeel k, niet werkzaam was.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
