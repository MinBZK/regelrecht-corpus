        bwb_id: BWBR0004045
        artikel: '16'
  - number: 4ca
    text: |-
      [Artikel 4b][ref1] zoals dat artikel luidde op de dag voorafgaand aan de inwerkingtreding van de regeling van de
      Minister van Sociale Zaken en Werkgelegenheid van 16 december 2005 tot wijziging van de Regeling gelijkstelling
      niet-gewerkte uren met gewerkte uren blijft van toepassing op de werknemer die op die datum:

      a. in een cyclus werkzaam is als bedoeld in dat [artikel 4b][ref2], en

      b. niet werkt, maar geen relevant arbeidsurenverlies heeft als bedoeld in dat [artikel 4b][ref3].


