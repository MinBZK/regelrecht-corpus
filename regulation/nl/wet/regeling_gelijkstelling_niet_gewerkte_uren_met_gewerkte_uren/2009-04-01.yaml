  - number: 4a
    text: |-
      1 Voor de berekening van het aantal arbeidsuren, bedoeld in [artikel 16, tweede lid van de Werkloosheidswet][ref1],
      worden zonodig in afwijking van de voorgaande artikelen buiten beschouwing gelaten de uren waarin de werknemer
      overwerk heeft verricht.

      2 Onder overwerk als bedoeld in het eerste lid wordt niet verstaan de uren:

      a. waarin de werknemer krachtens arbeidsovereenkomst of CAO verplicht was arbeid te verrichten en die uren zonder
      die verplichting als overuren zouden moeten worden aangemerkt; of

      b. waarin de werknemer meer dan de normale arbeidstijd arbeid heeft verricht en die uren inherent zijn aan de
      functie.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004069/2009-04-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '16'
  - number: 4c
    text: |-
      1 Voor de berekening van het aantal arbeidsuren, bedoeld in [artikel 16, tweede lid, van de Werkloosheidswet][ref1],
      worden buiten beschouwing gelaten de arbeidsuren waarin bereikbaarheidsdiensten zijn verricht.

      2 Het eerste lid van dit artikel is niet van toepassing indien voor de arbeidsuren waarin bereikbaarheidsdiensten
      zijn verricht, een vergoeding is ontvangen die tenminste gelijk is aan de voor de betreffende werknemer geldende
      vergoeding voor het verrichten van zijn overige arbeid.

      3 Voor de toepassing van dit besluit wordt onder bereikbaarheidsdiensten verstaan: het buiten de gebruikelijke
      werktijden en/of plaats beschikbaar zijn om op aanwijzing door of namens de werkgever direct arbeid te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16
    url: https://wetten.overheid.nl/BWBR0004069/2009-04-01#Artikel4c
    references:
