preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is de regels ter beperking van de omvang van de
    mestproductie te vereenvoudigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018780/2006-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      De [Wet herstructurering varkenshouderij][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0009542
    url: https://wetten.overheid.nl/BWBR0018780/2006-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0009542
  - number: III
    text: |-
      De [Wet verplaatsing mestproductie][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006285
    url: https://wetten.overheid.nl/BWBR0018780/2006-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0006285
  - number: VII
    text: |-
      De wijzigingen voorzien in deze wet zijn niet van toepassing op gedragingen die hebben plaatsgevonden voor de dag
      waarop de desbetreffende artikelonderdelen in werking treden.
    url: https://wetten.overheid.nl/BWBR0018780/2006-01-01#ArtikelVII
  - number: IX.1
    text: |-
      De tekst van de [Meststoffenwet][ref1] wordt in het Staatsblad geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0018780/2006-01-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: IX.2
    text: |-
      Voor de plaatsing van de [Meststoffenwet][ref1] in het Staatsblad stelt Onze Minister van Landbouw, Natuur en
      Voedselkwaliteit de nummering van de artikelen en hoofdstukken van die wet opnieuw vast en brengt hij de in die wet
      voorkomende aanhalingen van de artikelen en hoofdstukken met de nieuwe nummering in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0018780/2006-01-01#ArtikelIX
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: X
    text: |-
      Indien [artikel I, onderdeel D][ref1], in werking treedt op een ander tijdstip dan 1 januari,
      worden voor de berekening van het gemiddelde aantal kippen en kalkoenen, bedoeld in
      [artikel 57, eerste lid, van de Meststoffenwe][ref2]t, welke bepaling na de tekstplaatsing ingevolge
      [artikel IX][ref3] wordt vernummerd tot [artikel 20, eerste lid, van de Meststoffenwet][ref4], de aantallen kippen
      en kalkoenen, onderscheiden naar diercategorieën, die in het desbetreffende kalenderjaar op het bedrijf werden
      gehouden voorafgaand aan het tijdstip van inwerkingtreding uitgedrukt in pluimvee-eenheden overeenkomstig de in
      [bijlage II van de Meststoffenwet][ref5] daarvoor opgenomen normen.


      [ref1]: https://wetten.overheid.nl/BWBR0018780#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0018780#ArtikelIX
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0018780/2006-01-01#ArtikelX
    references:
