  - number: XI
    text: |-
      [Artikel X][ref1] vervalt op 1 januari van het jaar volgend op het jaar waarin het artikel in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0018780#ArtikelX
    url: https://wetten.overheid.nl/BWBR0018780/2006-01-01#ArtikelXI
    references:
      - id: ref1
        bwb_id: BWBR0018780
        artikel: X
  - number: XII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018780/2006-01-01#ArtikelXII
