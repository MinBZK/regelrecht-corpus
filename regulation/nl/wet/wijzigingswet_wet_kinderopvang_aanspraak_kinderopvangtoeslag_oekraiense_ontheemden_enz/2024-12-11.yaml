preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om Oekraïense ontheemden aanspraak te laten maken op
    kinderopvangtoeslag gelet op het recht op toegang tot de arbeidsmarkt en tevens de aanspraak op kinderopvangtoeslag
    voor eenieder met een partner buiten de Europese Unie mogelijk te maken;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050542/2024-12-11#ArtikelAanhef
articles:
  - number: Ia
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid zendt binnen achttien maanden na de inwerkingtreding van deze
      wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0050542/2024-12-11#ArtikelIa
  - number: II
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst en werkt terug tot en met 4 maart 2022, met uitzondering van [artikel I, onderdelen B, D en G][ref1], dat
      in werking treedt op een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0050542#ArtikelI
    url: https://wetten.overheid.nl/BWBR0050542/2024-12-11#ArtikelII
