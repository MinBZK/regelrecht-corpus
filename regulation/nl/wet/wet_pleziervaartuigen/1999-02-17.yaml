  - number: '27'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel27
  - number: '28'
    text: 'Deze wet wordt aangehaald als: Wet pleziervaartuigen.'
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel28
