preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op richtlijn nr. 94/25/EG van het Europees Parlement
    en van de Raad van de Europese Unie van 16 juni 1994 inzake de onderlinge aanpassing van de wettelijke en
    bestuursrechtelijke bepalingen van de Lid-Staten met betrekking tot pleziervaartuigen (PbEG L 164), noodzakelijk is
    regels te stellen met betrekking tot de veiligheid van pleziervaartuigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel1
  - number: 1.1.a
    text: |-
      pleziervaartuig: een schip dat is bestemd voor sportbeoefening of vrijetijdsbesteding, met een romplengte van
      minimaal 2,5 meter en maximaal 24 meter;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel1
  - number: 1.1.b
    text: |-
      richtlijn: [richtlijn nr. 94/25/EG](31994L0025) van het Europees Parlement en van de Raad van de Europese Unie van
      16 juni 1994 inzake de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van de Lid-Staten
      met betrekking tot pleziervaartuigen (*PbEG* L 164);
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel1
  - number: 1.1.c
    text: |-
      CE-markering van overeenstemming: de aanduiding op een pleziervaartuig ten teken dat het voldoet aan alle
      verplichtingen krachtens de regelingen ter uitvoering van de toepasselijke communautaire richtlijnen die in het
      aanbrengen ervan voorzien;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel1
  - number: 1.1.d
    text: |-
      onderdelen van pleziervaartuigen: onderdelen van of voor pleziervaartuigen als bedoeld in bijlage II van de
      richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel1
  - number: 1.1.e
    text: |-
      overeenstemmingsbeoordeling: het onderzoek naar het voldoen van ontwerp en bouw van pleziervaartuigen aan de
      desbetreffende essentiële veiligheidseisen;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel1
  - number: 1.1.f
    text: |-
      keuringsinstantie: een ingevolge [artikel 8, eerste lid][ref1], aangewezen dienst, instelling, onderzoekingsbureau
      of onderneming, dan wel een door een andere lid-staat van de Europese Unie of een andere staat die partij is bij
      de Overeenkomst inzake de Europese Economische Ruimte, bij de Commissie van de Europese Gemeenschappen aangemelde
      instantie, die als zodanig is belast met het verrichten van een of meer van de in [artikel 8, eerste lid][ref2],
      bedoelde taken;


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008366#Artikel8
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008366
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 1.1.g
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel1
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder een pleziervaartuig mede verstaan een als zodanig in de
      handel gebracht schip dat wordt gebruikt bij de instructie ten behoeve van de uitoefening van de pleziervaart.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel1
  - number: '1.3'
    text: |-
      De romplengte van een pleziervaartuig wordt gemeten volgens de desbetreffende aangewezen normen, bedoeld in
      [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel4
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '4'
        hoofdstuk: '2'
  - number: '2'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.a
    text: schepen, gebouwd of bestemd voor het bedrijfsmatig vervoer van personen, buiten de bemanning;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.b
    text: wedstrijdboten;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.c
    text: kano's, kajaks, gondels en waterfietsen;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.d
    text: boten voor roei-instructie, die als zodanig door de fabrikant zijn aangemerkt;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.e
    text: zeilplanken;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.f
    text: motorzeilplanken, waterscooters en soortgelijke schepen;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.g
    text: |-
      historische schepen die vóór 1950 zijn gebouwd, alsmede individuele replica’s van zulke schepen, indien zij
      hoofdzakelijk met de oorspronkelijke materialen zijn gebouwd en als zodanig door de fabrikant zijn aangemerkt;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.h
    text: experimentele schepen, voor zover zij niet op de gemeenschappelijke markt worden gebracht;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.i
    text: |-
      voor persoonlijk gebruik gebouwde schepen, voor zover zij gedurende een periode van vijf jaar na de bouw niet op de
      gemeenschappelijke markt worden gebracht;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.j
    text: onderzeeboten;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.k
    text: luchtkussenvoertuigen; en
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: 2.l
    text: draagvleugelboten.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel2
  - number: '3.1'
    text: |-
      Pleziervaartuigen worden slechts in de handel gebracht of als zodanig in bedrijf gesteld, indien zij bij gebruik
      volgens hun bestemming geen gevaar opleveren voor de veiligheid en gezondheid van personen, goederen of het milieu
      wanneer zij op correcte wijze zijn gebouwd en worden onderhouden, en zij zijn voorzien van een CE-markering van
      overeenstemming, overeenkomstig bijlage IV van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel3
  - number: '3.2'
    text: |-
      Pleziervaartuigen voldoen aan de in bijlage I van de richtlijn opgenomen essentiële veiligheidseisen met betrekking
      tot ontwerp en bouw.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel3
  - number: '3.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op pleziervaartuigen die nog niet zijn afgebouwd en op
      onderdelen van pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel3
  - number: '4.1'
    text: |-
      Pleziervaartuigen die overeenstemmen met de bij ministeriële regeling aangewezen normen, die overeenkomen
      met de geharmoniseerde normen, bedoeld in artikel 5 van de richtlijn, worden vermoed te voldoen aan
      [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op pleziervaartuigen die nog niet zijn afgebouwd en op onderdelen
      van pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel4
  - number: '5.1'
    text: |-
      De fabrikant volgt een voor het desbetreffende, in [artikel 3, eerste of derde lid][ref1], bedoelde produkt
      geldende procedure van overeenstemmingsbeoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      Indien de fabrikant niet aan de verplichting, bedoeld in het eerste lid, heeft voldaan, rust deze verplichting op
      de gemachtigde van de fabrikant of op de persoon die het produkt in de handel brengt. Zodra de gemachtigde van de
      fabrikant of de persoon die het produkt in de handel brengt aan deze verplichting heeft voldaan, is de verplichting
      voor de ander opgeheven.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: '5.3'
    text: |-
      De procedure van overeenstemmingsbeoordeling wordt voor zover mogelijk gevolgd voordat het desbetreffende produkt
      in produktie wordt genomen. Deze procedure wordt in elk geval gevolgd voordat het desbetreffende produkt in de
      handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: '5.4'
    text: |-
      De procedure van overeenstemmingsbeoordeling is voor de categorieën scheepsontwerpen A en B, bedoeld in bijlage I,
      onderdeel 1, van de richtlijn:
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.4.a
    text: |-
      voor schepen met een romplengte van minder dan 12 meter: de interne fabricagecontrole met proeven, zoals opgenomen
      in bijlage VI van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.4.b
    text: 'voor schepen met een romplengte van 12 meter of meer:'
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.4.b.1°
    text: |-
      het EG-typeonderzoek, zoals opgenomen in bijlage VII van de richtlijn, aangevuld met de procedure van
      overeenstemming met het type, zoals opgenomen in bijlage VIII van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.4.b.2°
    text: |-
      het EG-typeonderzoek, zoals opgenomen in bijlage VII van de richtlijn, aangevuld met de procedure van
      produktkwaliteitsborging, zoals opgenomen in bijlage IX van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.4.b.3°
    text: |-
      het EG-typeonderzoek, zoals opgenomen in bijlage VII van de richtlijn, aangevuld met de produktkeuring, zoals
      opgenomen in bijlage X van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.4.b.4°
    text: de eenheidskeuring, zoals opgenomen in bijlage XI van de richtlijn; of
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.4.b.5°
    text: de procedure van volledige kwaliteitsborging, zoals opgenomen in bijlage XII van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: '5.5'
    text: |-
      De procedure van overeenstemmingsbeoordeling is voor de categorie scheepsontwerp C, bedoeld in bijlage I, onderdeel
      1, van de richtlijn:
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.5.a
    text: 'voor schepen met een romplengte van minder dan 12 meter:'
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.5.a.1°
    text: |-
      indien er overeenstemming is met de bij ministeriële regeling aangewezen normen, die overeenkomen met de
      geharmoniseerde normen, bedoeld in artikel 5 van de richtlijn, betreffende de onderdelen 3.2 en 3.3 van bijlage I
      van de richtlijn: de interne fabricagecontrole, zoals opgenomen in bijlage V van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.5.a.2°
    text: |-
      indien er geen overeenstemming is met de bij ministeriële regeling aangewezen normen, die overeenkomen met de
      geharmoniseerde normen, bedoeld in artikel 5 van de richtlijn, betreffende de onderdelen 3.2 en 3.3 van bijlage I
      van de richtlijn: de interne fabricagecontrole met proeven, zoals opgenomen in bijlage VI van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.5.b
    text: 'voor schepen met een romplengte van 12 meter of meer:'
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.5.b.1°
    text: |-
      het EG-typeonderzoek, zoals opgenomen in bijlage VII van de richtlijn, aangevuld met de procedure van
      overeenstemming met het type, zoals opgenomen in bijlage VIII van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.5.b.2°
    text: |-
      het EG-typeonderzoek, zoals opgenomen in bijlage VII van de richtlijn, aangevuld met de procedure van
      produktkwaliteitsborging, zoals opgenomen in bijlage IX van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.5.b.3°
    text: |-
      het EG-typeonderzoek, zoals opgenomen in bijlage VII van de richtlijn, aangevuld met de produktkeuring, zoals
      opgenomen in bijlage X van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.5.b.4°
    text: de eenheidskeuring, zoals opgenomen in bijlage XI van de richtlijn; of
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.5.b.5°
    text: de procedure van volledige kwaliteitsborging, zoals opgenomen in bijlage XII van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: '5.6'
    text: |-
      De procedure van overeenstemmingsbeoordeling is voor de categorie scheepsontwerp D, bedoeld in bijlage I, onderdeel
      1, van de richtlijn: de interne fabricagecontrole, zoals opgenomen in bijlage V van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: '5.7'
    text: 'De procedure van overeenstemmingsbeoordeling is voor onderdelen van pleziervaartuigen:'
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.7.a
    text: |-
      het EG-typeonderzoek, zoals opgenomen in bijlage VII van de richtlijn, aangevuld met de procedure van
      overeenstemming met het type, zoals opgenomen in bijlage VIII van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.7.b
    text: |-
      het EG-typeonderzoek, zoals opgenomen in bijlage VII van de richtlijn, aangevuld met de procedure van
      produktkwaliteitsborging, zoals opgenomen in bijlage IX van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.7.c
    text: |-
      het EG-typeonderzoek, zoals opgenomen in bijlage VII van de richtlijn, aangevuld met de produktkeuring, zoals
      opgenomen in bijlage X van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.7.d
    text: de eenheidskeuring, zoals opgenomen in bijlage XI van de richtlijn; of
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: 5.7.e
    text: de procedure van volledige kwaliteitsborging, zoals opgenomen in bijlage XII van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel5
  - number: '6.1'
    text: |-
      De fabrikant voegt de verklaring van overeenstemming, bedoeld in de procedures van overeenstemmingsbeoordeling,
      zoals opgenomen in de  bijlagen V, VI, VIII, IX, X, XI of XII van de richtlijn, gesteld in de officiële taal of
      talen van de lid-staat waar het produkt in de handel wordt gebracht, bij de handleiding bij het produkt, bedoeld in
      bijlage I, onderdeel 2.5, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel6
  - number: '6.2'
    text: |-
      Indien de fabrikant niet aan de verplichting, bedoeld in het eerste lid, heeft voldaan, rust deze verplichting op
      de gemachtigde van de fabrikant of op de persoon die het produkt in de handel brengt. Zodra de gemachtigde van de
      fabrikant of de persoon die het produkt in de handel brengt aan deze verplichting heeft voldaan, is de verplichting
      voor de ander opgeheven.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel6
  - number: '7.1'
    text: |-
      Onverminderd het derde lid brengt de fabrikant de CE-markering van overeenstemming aan, indien een pleziervaartuig
      wordt vermoed te voldoen aan [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      Indien de fabrikant niet aan de verplichting, bedoeld in het eerste lid, heeft voldaan, rust deze verplichting op
      de gemachtigde van de fabrikant of op de persoon die het produkt in de handel brengt. Zodra de gemachtigde van de
      fabrikant of de persoon die het produkt in de handel brengt aan deze verplichting heeft voldaan, is de verplichting
      voor de ander opgeheven.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel7
  - number: '7.3'
    text: |-
      De CE-markering van overeenstemming wordt zichtbaar, leesbaar en onuitwisbaar aangebracht op het pleziervaartuig,
      overeenkomstig de bijlagen I, onderdeel 2.2, en IV van de richtlijn, en gaat, uitgezonderd de gevallen waarin
      uitsluitend de procedure zoals bedoeld in bijlage V van de richtlijn van toepassing is, vergezeld van het
      identificatienummer van de desbetreffende keuringsinstantie.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel7
  - number: '7.4'
    text: |-
      De CE-markering van overeenstemming geeft tevens aan, dat het pleziervaartuig voldoet aan alle andere regelingen
      ter uitvoering van communautaire richtlijnen. Indien echter in een of meer van deze andere regelingen ter
      uitvoering van communautaire richtlijnen gedurende een overgangsperiode de fabrikant de keuze heeft van de toe te
      passen regeling, geeft de CE-markering slechts aan dat aan de voorschriften van de door de fabrikant toegepaste
      regeling is voldaan. In dat geval worden de in het Publikatieblad van de Europese Gemeenschappen bekendgemaakte
      referenties van de toegepaste communautaire richtlijnen vermeld op de in die richtlijnen voorgeschreven bescheiden,
      handleidingen of gebruiksaanwijzingen die bij het pleziervaartuig zijn gevoegd.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel7
  - number: '7.5'
    text: |-
      Dit artikel is van overeenkomstige toepassing op pleziervaartuigen die nog niet zijn afgebouwd en op onderdelen van
      pleziervaartuigen, met dien verstande, dat de CE-markering van overeenstemming wordt aangebracht op de verpakking
      van een onderdeel, indien aanbrenging op het onderdeel zelf niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister wijst, met inachtneming van bijlage XIV van de richtlijn, de instanties aan die met betrekking tot
      de door hem te bepalen categorieën pleziervaartuigen, dan wel onderdelen van pleziervaartuigen, belast zijn met
      door hem aan te geven taken als het verrichten van keuringen, de afgifte van certificaten van EG-typeonderzoek, de
      afgifte van certificaten van overeenstemming of het verrichten van controles, dan wel andere taken in het kader van
      de procedures van overeenstemmingsbeoordeling, zoals opgenomen in de bijlagen VI, VII, en IX tot en met XII van de
      richtlijn. Aan een dergelijke aanwijzing kunnen voorschriften worden verbonden, die mede betrekking kunnen hebben
      op de door de keuringsinstanties in rekening te brengen tarieven.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel8
  - number: '8.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven betreffende de criteria voor de beoordeling van instanties
      die in aanmerking wensen te komen voor een aanwijzing als bedoeld in het eerste lid, de wijze van beoordeling, het
      op deze instanties uit te oefenen toezicht en de door deze instanties verschuldigde vergoeding voor de kosten van
      de beoordeling en de uitoefening van het toezicht.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel8
  - number: '8.3'
    text: |-
      Een ingevolge het eerste lid aangewezen instantie verstrekt desgevraagd aan Onze Minister de voor de uitoefening
      van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van de zakelijke gegevens en bescheiden,
      voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel8
  - number: '8.4'
    text: |-
      Onze Minister trekt de aanwijzing in, indien hij van oordeel is dat de desbetreffende instantie niet meer voldoet
      aan de criteria van bijlage XIV van de richtlijn of de criteria voor de beoordeling van instanties, opgenomen in de
      ministeriële regeling, bedoeld in het tweede lid, dan wel indien de desbetreffende instantie de aan de aanwijzing
      verbonden voorschriften niet naleeft.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel8
  - number: '9'
    text: |-
      Onze Minister stelt de Commissie van de Europese Gemeenschappen en de andere lid-staten van de Europese Unie
      en de andere staten die partij zijn bij de Overeenkomst inzake de Europese Economische Ruimte in kennis van
      een aanwijzing of een intrekking ingevolge [artikel 8][ref1] en vermeldt in geval van een aanwijzing de aan de
      desbetreffende instantie toegekende taken en het door de Commissie van de Europese Gemeenschappen aan die instantie
      toegekende identificatienummer.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel8
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '10'
    text: |-
      Een keuringsinstantie, aangewezen ingevolge [artikel 8, eerste lid][ref1], is bevoegd om met inachtneming van bij
      ministeriële regeling gegeven voorschriften, beproevingen en controles door anderen te doen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel8
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '11.1'
    text: |-
      Indien de keuringsinstantie die een EG-typeonderzoekverklaring heeft afgegeven, vermoedt dat het model niet
      meer voldoet aan de geldende essentiële veiligheidseisen van bijlage I van de richtlijn, stelt zij daarnaar een
      onderzoek in.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel11
  - number: '11.2'
    text: |-
      Een EG-typeonderzoekverklaring wordt door de keuringsinstantie ingetrokken, indien het in het eerste lid bedoelde
      onderzoek uitwijst dat het model niet meer aan de gewijzigde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel11
  - number: '12.1'
    text: |-
      Op verzoek van de fabrikant bepaalt Onze Minister de door de fabrikant te hanteren fabriekscode, bedoeld in bijlage
      I, onderdeel 2.1, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister kan een dienst, instelling of onderneming aanwijzen die bevoegd is tot de bepaling van de
      fabriekscode.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel12
  - number: '12.3'
    text: Aan een aanwijzing als bedoeld in het tweede lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel12
  - number: '13.1'
    text: |-
      De fabrikant verleent een keuringsinstantie of de door deze ingevolge [artikel 10][ref1] aangewezen persoon of
      personen alle medewerking voor zover dat noodzakelijk is ten behoeve van de uitvoering van de desbetreffende
      procedure van overeenstemmingsbeoordeling en de uitoefening van andere in deze wet bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel10
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '13.2'
    text: |-
      Een gelijke verplichting als bedoeld in het eerste lid rust op de gemachtigde van de fabrikant of op de persoon die
      het produkt in de handel brengt.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel13
  - number: '14.1'
    text: |-
      De door de fabrikant ingevolge een toegepaste procedure van overeenstemmingsbeoordeling geleverde technische
      documentatie voldoet aan bijlage XIII van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel14
  - number: '14.2'
    text: 'De fabrikant bewaart de in het eerste lid bedoelde technische documentatie en:'
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel14
  - number: 14.2.a
    text: |-
      indien de procedure van overeenstemmingsbeoordeling, zoals opgenomen in bijlage V, VI, VIII of X van de richtlijn,
      is toegepast: een afschrift van de verklaring van overeenstemming;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel14
  - number: 14.2.b
    text: |-
      indien het EG-typeonderzoek, zoals opgenomen in bijlage VII van de richtlijn, is toegepast: een afschrift van het
      certificaat van EG-typeonderzoek en van de eventuele aanvullingen daarop;
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel14
  - number: 14.2.c
    text: |-
      indien de procedure van kwaliteitsborging, zoals opgenomen in bijlage IX, of van volledige kwaliteitsborging, zoals
      opgenomen in bijlage XII van de richtlijn, is toegepast: de in bijlage IX, onderdeel 5, onderscheidenlijk bijlage
      XII, onderdeel 5, van de richtlijn bedoelde documenten en gegevens.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel14
  - number: '14.3'
    text: De bewaring vindt gedurende een periode van ten minste tien jaren plaats.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel14
  - number: '14.4'
    text: |-
      Indien de fabrikant niet aan de verplichtingen, bedoeld in het eerste of tweede lid, voldoet, rusten deze
      verplichtingen op de gemachtigde van de fabrikant of op de persoon die het produkt in de handel brengt. Zodra de
      gemachtigde van de fabrikant of de persoon die het produkt in de handel brengt aan deze verplichting heeft voldaan,
      is de verplichting voor de ander opgeheven.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel14
  - number: '15.1'
    text: |-
      In afwijking van [artikel 3, derde lid][ref1], mag de fabrikant, zijn gemachtigde of, indien de fabrikant en zijn
      gemachtigde niet zijn gevestigd in een van de gebieden waarop de Overeenkomst betreffende de Europese Economische
      Ruimte van toepassing is, de persoon die verantwoordelijk is voor het in de handel brengen, gedeeltelijk afgebouwde
      pleziervaartuigen die niet zijn voorzien van de CE-markering van overeenstemming, in de handel brengen, indien zij
      zijn bestemd om door anderen te worden afgebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '15.2'
    text: |-
      In een geval als bedoeld in het eerste lid dient een daartoe strekkende verklaring van de fabrikant, zijn
      gemachtigde of, indien de fabrikant en zijn gemachtigde niet zijn gevestigd in een van de gebieden waarop de
      Overeenkomst betreffende de Europese Economische Ruimte van toepassing is, de persoon die verantwoordelijk is voor
      het in de handel brengen, met de in bijlage III, onderdeel *a*, van de richtlijn genoemde gegevens voorhanden te
      zijn.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel15
  - number: '15.3'
    text: |-
      In afwijking van [artikel 3, eerste en derde lid][ref1], mogen pleziervaartuigen, al dan niet afgebouwd, en
      onderdelen van pleziervaartuigen, die niet zijn voorzien van de CE-markering van overeenstemming, worden getoond
      op beurzen en tentoonstellingen en bij demonstraties, mits met een duidelijk zichtbaar teken is aangegeven dat deze
      produkten noch in de handel kunnen worden gebracht, noch in bedrijf kunnen worden gesteld, voordat zij met deze wet
      in overeenstemming zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '16.1'
    text: |-
      Indien Onze Minister van oordeel is dat een van een CE-markering van overeenstemming voorzien pleziervaartuig
      in geval van een juiste constructie, montage, correct onderhoud en gebruik volgens hun bestemming, gevaar kan
      opleveren voor de veiligheid en de gezondheid van personen, goederen of het milieu, neemt hij alle dienstige
      voorlopige maatregelen om dat pleziervaartuig uit de handel te nemen. Zo nodig kan hij het in bedrijf stellen ervan
      verbieden of daaraan beperkingen opleggen.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel16
  - number: '16.2'
    text: |-
      Indien Onze Minister van oordeel is dat de CE-markering van overeenstemming ten onrechte is aangebracht, neemt hij
      de nodige maatregelen om dat pleziervaartuig uit de handel te nemen. Zo nodig kan hij het in bedrijf stellen ervan
      verbieden of daaraan beperkingen opleggen.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel16
  - number: '16.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op pleziervaartuigen die nog niet zijn afgebouwd en op
      onderdelen van pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel16
  - number: '16.4'
    text: |-
      De fabrikant, zijn gemachtigde of de persoon die verantwoordelijk is voor het in de handel brengen, verleent alle
      noodzakelijke medewerking aan de uitvoering van een maatregel als bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel16
  - number: '16.5'
    text: |-
      Onze Minister stelt de Commissie van de Europese Gemeenschappen onmiddellijk onder opgave van redenen in kennis van
      een maatregel als bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel16
  - number: '17.1'
    text: |-
      Het is verboden een pleziervaartuig, al dan niet afgebouwd, of een onderdeel van een pleziervaartuig als bedoeld in
      artikel 3, derde lid, in de handel te brengen of als zodanig in bedrijf te stellen, indien het niet voldoet aan de
      desbetreffende in bijlage I van de richtlijn opgenomen essentiële eisen met betrekking tot ontwerp en bouw.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel17
  - number: '17.2'
    text: |-
      Het is verboden een pleziervaartuig, al dan niet afgebouwd, of een onderdeel van een pleziervaartuig als bedoeld
      in artikel 3, derde lid, in de handel te brengen of als zodanig in bedrijf te stellen, indien het pleziervaartuig
      of het onderdeel, dan wel de verpakking ervan, niet op deugdelijke wijze is voorzien van de vereiste CE-markering
      van overeenstemming.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel17
  - number: '17.3'
    text: |-
      Het is verboden een CE-markering van overeenstemming aan te brengen, indien niet een van toepassing zijnde
      procedure van overeenstemmingsbeoordeling is gevolgd of het desbetreffende pleziervaartuig, al dan niet afgebouwd,
      of onderdeel daarvan, bedoeld in [artikel 3, derde lid][ref1], niet voldoet aan de desbetreffende in bijlage I van
      de richtlijn opgenomen essentiële eisen met betrekking tot ontwerp en bouw.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '17.4'
    text: |-
      Het is verboden merktekens of opschriften aan te brengen die anderen kunnen misleiden omtrent de betekenis of de
      grafische vormgeving van de CE-markering van overeenstemming, of die de zichtbaarheid of de leesbaarheid van de CE-
      markering verminderen.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel17
  - number: '17.5'
    text: |-
      Het is verboden te handelen in strijd met de [artikelen 6][ref1], [13][ref2], [14][ref3],
      [15, tweede en derde lid][ref4], en [16, vierde lid][ref5], en het verbod of de beperkingen, bedoeld in
      [artikel 16, eerste lid, tweede volzin, en tweede lid, tweede volzin][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008366#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008366#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0008366#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0008366#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0008366#Artikel16
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
