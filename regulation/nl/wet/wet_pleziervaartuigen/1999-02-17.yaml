        bwb_id: BWBR0008366
        artikel: '16'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0008366
        artikel: '16'
        hoofdstuk: '4'
  - number: '18'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      scheepvaartinspectie.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel18
  - number: '24.1'
    text: |-
      De [artikelen 3][ref1], [5][ref2], [6][ref3], [7, eerste en tweede lid][ref4], [13][ref5], [15][ref6],
      [16, eerste lid][ref7], en [17, eerste, tweede en vijfde lid][ref8], zijn tot 16 juni 1998 niet van toepassing op
      het in de handel brengen en in bedrijf stellen van pleziervaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008366#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0008366#Artikel6
