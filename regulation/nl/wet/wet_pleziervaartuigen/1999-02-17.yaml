  - number: '24.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op pleziervaartuigen die nog niet zijn afgebouwd en op onderdelen
      van pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel24
  - number: '25.1'
    text: |-
      Een wijziging van artikel 5 van de richtlijn gaat voor de toepassing van [artikel 4, eerste lid][ref1], en
      [artikel 5, vijfde lid][ref2], gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering
      moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008366#Artikel5
    url: https://wetten.overheid.nl/BWBR0008366/1999-02-17#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008366
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '25.2'
    text: |-
      Een wijziging van een van de bijlagen van de richtlijn gaat voor de toepassing van de [artikelen 1][ref1],
      [3][ref2], [5 tot en met 8][ref3], [11][ref4], [12][ref5], [14][ref6], [15][ref7] en [17][ref8] gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008366#Artikel3
