  - number: '25'
    text: |-
      Een wijziging van [richtlijn nr. 94/25/EG](31994L0025) gaat voor de toepassing van deze wet gelden met ingang van
      de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit,
      dat in de Staatscourant wordt bekendgemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel25
  - number: '27'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel27
  - number: '28'
    text: 'Deze wet wordt aangehaald als: Wet pleziervaartuigen.'
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel28
