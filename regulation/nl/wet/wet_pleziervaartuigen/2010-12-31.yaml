---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_pleziervaartuigen
regulatory_layer: WET
publication_date: '2016-01-15'
valid_from: '2010-12-31'
bwb_id: BWBR0008366
url: https://wetten.overheid.nl/BWBR0008366/2010-12-31
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op richtlijn nr. 94/25/EG van het Europees Parlement
    en van de Raad van de Europese Unie van 16 juni 1994 inzake de onderlinge aanpassing van de wettelijke en
    bestuursrechtelijke bepalingen van de Lid-Staten met betrekking tot pleziervaartuigen (PbEG L 164), noodzakelijk is
    regels te stellen met betrekking tot de veiligheid van pleziervaartuigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: 1.1.a
    text: |-
      pleziervaartuig: vaartuig dat is bestemd voor sportbeoefening of vrijetijdsbesteding, met een romplengte van
      minimaal 2,5 meter en maximaal 24 meter;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: 1.1.b
    text: |-
      voortstuwingsmotor: voor voortstuwing gebruikte inwendige-verbrandingsmotor met vonkontsteking of
      compressieontsteking, met inbegrip van tweetakt- en viertaktbinnenboordmotoren, hekmotoren met of zonder
      geïntegreerde uitlaat en buitenboordmotoren, die gemonteerd is op of in of specifiek bestemd is voor montage op of
      in pleziervaartuigen;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: 1.1.c
    text: |-
      richtlijn: [richtlijn nr. 94/25/EG](31994L0025) van het Europees Parlement en van de Raad van de Europese Unie van
      16 juni 1994 inzake de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van de Lid-Staten
      met betrekking tot pleziervaartuigen (PbEG L 164);
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: 1.1.d
    text: |-
      CE-markering van overeenstemming: de aanduiding op een pleziervaartuig, onderdeel van een pleziervaartuig of een
      voortstuwingsmotor ten teken dat deze voldoet aan alle verplichtingen krachtens de regelingen ter uitvoering van de
      toepasselijke communautaire richtlijnen die in het aanbrengen ervan voorzien;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: 1.1.e
    text: |-
      onderdelen van pleziervaartuigen: onderdelen van of voor pleziervaartuigen als bedoeld in bijlage II van de
      richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: 1.1.f
    text: |-
      fabrikant: natuurlijke persoon of rechtspersoon die een onder deze richtlijn vallend product ontwerpt en
      vervaardigt, of die een dergelijk product laat ontwerpen dan wel vervaardigen, met de bedoeling het onder zijn
      eigen naam in de handel te brengen;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: 1.1.g
    text: |-
      gemachtigde: in de Europese Gemeenschap gevestigde natuurlijke persoon of rechtspersoon met een schriftelijke
      volmacht van de fabrikant om namens deze op te treden wat diens uit de richtlijn voortvloeiende verplichtingen
      betreft;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: 1.1.h
    text: |-
      overeenstemmingsbeoordeling: het onderzoek naar het voldoen van pleziervaartuigen, onderdelen van pleziervaartuigen
      en voortstuwingsmotoren aan de desbetreffende essentiële veiligheidseisen;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: 1.1.i
    text: |-
      keuringsinstantie: een ingevolge [artikel 8, eerste lid][ref1], aangewezen dienst, instelling, onderzoekingsbureau
      of onderneming, dan wel een door een andere lidstaat van de Europese Unie of een andere staat die partij is bij
      de Overeenkomst inzake de Europese Economische Ruimte, bij de Commissie van de Europese Gemeenschappen aangemelde
      instantie, die als zodanig is belast met het verrichten van een of meer van de in [artikel 8, eerste lid][ref2],
      bedoelde taken;


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008366#Artikel8
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008366
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 1.1.j
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat.'
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: '1.2'
    text: 'In deze wet en de daarop berustende bepalingen wordt onder een pleziervaartuig mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: 1.2.a
    text: |-
      een als zodanig in de handel gebracht vaartuig dat wordt gebruikt bij de instructie ten behoeve van de uitoefening
      van de pleziervaart;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: 1.2.b
    text: |-
      een waterscooter, zijnde een vaartuig met een lengte van minder dan 4 meter met een motor met inwendige
      verbranding, primair aangedreven door een waterstraalpomp en ontworpen om door een of meer personen zittend, staand
      of knielend op en niet in de romp te worden bediend.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
  - number: '1.3'
    text: |-
      De romplengte van een pleziervaartuig wordt gemeten volgens de desbetreffende aangewezen normen, bedoeld in
      [artikel 4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel4
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '4'
        hoofdstuk: '2'
  - number: '2.1'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.a
    text: kano’s, kajaks, gondels en waterfietsen;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.b
    text: boten voor roei-instructie en wedstrijdroeiboten die als zodanig door de fabrikant zijn aangemerkt;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.c
    text: zeilplanken;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.d
    text: al dan niet gemotoriseerde surfplanken;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.e
    text: |-
      met stoomkracht aangedreven vaartuigen met externe verbranding die als brandstof gebruik maken van kolen, cokes,
      hout, olie of gas;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.f
    text: |-
      voor persoonlijk gebruik gebouwde vaartuigen die gedurende vijf jaar na de bouw niet in de Europese Gemeenschap in
      de handel worden gebracht;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.g
    text: |-
      historische vaartuigen die voor 1950 zijn gebouwd, alsmede individuele replica’s van zulke vaartuigen, indien zij
      hoofdzakelijk met de oorspronkelijke materialen zijn gebouwd en als zodanig door de fabrikant zijn aangemerkt;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.h
    text: experimentele vaartuigen die niet in de Europese Gemeenschap in de handel worden gebracht;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.i
    text: wedstrijdvaartuigen die als zodanig door de fabrikant zijn aangemerkt;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.j
    text: voor het bedrijfsmatig vervoer van personen, buiten de bemanning, gebouwde of bestemde vaartuigen;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.k
    text: onderzeeboten;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.l
    text: luchtkussenvoertuigen;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.1.m
    text: draagvleugelboten.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: '2.2'
    text: 'Deze wet is eveneens niet van toepassing op de volgende voortstuwingsmotoren:'
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.2.a
    text: |-
      voor persoonlijk gebruik gebouwde voortstuwingsmotoren die gedurende vijf jaar na de bouw niet in de Gemeenschap in
      de handel worden gebracht;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.2.b
    text: |-
      voortstuwingsmotoren die op de in het eerste lid, onderdelen h tot en met m, bedoelde vaartuigen zijn gemonteerd of
      specifiek daarvoor zijn bestemd;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: 2.2.c
    text: |-
      originelen en replica’s van historische voortstuwingsmotoren die op een ontwerp van voor 1950 zijn gebaseerd, niet
      in serie zijn geproduceerd en op de in het eerste lid, onderdelen f of g, bedoelde vaartuigen zijn gemonteerd.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel2
  - number: '3.1'
    text: |-
      Pleziervaartuigen, onderdelen van pleziervaartuigen en voortstuwingsmotoren worden slechts in de handel gebracht
      of als zodanig in bedrijf gesteld, indien zij bij gebruik volgens hun bestemming geen gevaar opleveren voor de
      veiligheid en gezondheid van personen, goederen of het milieu wanneer zij op correcte wijze zijn gebouwd en worden
      onderhouden, en zij in voorkomend geval zijn voorzien van de in [artikel 7][ref1] voorgeschreven CE-markering van
      overeenstemming, overeenkomstig bijlage IV van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel7
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '3.2'
    text: |-
      Pleziervaartuigen, onderdelen van pleziervaartuigen en voortstuwingsmotoren voldoen aan de in bijlage I van de
      richtlijn opgenomen essentiële eisen
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel3
  - number: '3.3'
    text: 'Het eerste en tweede lid zijn van overeenkomstige toepassing op:'
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel3
  - number: 3.3.a
    text: pleziervaartuigen die gedeeltelijk zijn afgebouwd;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel3
  - number: 3.3.b
    text: ingrijpend gewijzigde voortstuwingsmotoren, als bedoeld in artikel 1, derde lid, onderdeel d, van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel3
  - number: 3.3.c
    text: ingrijpend verbouwde vaartuigen, als bedoeld in artikel 1, derde lid, onderdeel e, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel3
  - number: '3.4'
    text: |-
      Onderdelen voldoen, onverminderd het eerste lid, tevens aan artikel 4, derde lid, van de richtlijn, voorzover
      daarin aanvullende voorschriften zijn gesteld voor het in de handel brengen of als zodanig in gebruik stellen van
      die onderdelen.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel3
  - number: '4.1'
    text: |-
      Pleziervaartuigen, onderdelen van pleziervaartuigen, en voortstuwingsmotoren die overeenstemmen met de door Onze
      Minister aangewezen normen, die overeenkomen met de geharmoniseerde normen, bedoeld in artikel 5 van de richtlijn,
      worden vermoed te voldoen aan [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '4.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op ingrijpend gewijzigde en verbouwde voortstuwingsmotoren en
      vaartuigen, als bedoeld in [artikel 3, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.1'
    text: |-
      De fabrikant of diens gemachtigde volgt voor een product als bedoeld in [artikel 3, eerste of derde lid][ref1], een
      ingevolge artikel 8 van de richtlijn toepasselijke procedure van overeenstemmingsbeoordeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      Een procedure van overeenstemmingsbeoordeling als bedoeld in het eerste lid wordt, voor zover mogelijk, gevolgd
      voordat het desbetreffende product in productie wordt genomen. Een dergelijke procedure wordt in elk geval gevolgd
      voordat het desbetreffende product in de handel wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel5
  - number: '6'
    text: |-
      De fabrikant of diens gemachtigde voegt de verklaring van overeenstemming, bedoeld in bijlage XV van de richtlijn,
      gesteld in de officiële taal of talen van de lidstaat waar het product in de handel wordt gebracht:
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel6
  - number: 6.a
    text: bij de handleiding bedoeld in bijlage I, delen A, punt 2.5, en B, punt 4, van de richtlijn;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel6
  - number: 6.b
    text: bij onderdelen van pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel6
  - number: '7.1'
    text: |-
      De fabrikant of diens gemachtigde brengt de CE-markering van overeenstemming aan, indien een pleziervaartuig, een
      onderdeel van een pleziervaartuig, een buitenboordmotor, of een hekmotor met geïntegreerde uitlaat wordt vermoed te
      voldoen aan [artikel 3, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      De CE-markering van overeenstemming wordt zichtbaar, leesbaar en onuitwisbaar aangebracht op het pleziervaartuig,
      overeenkomstig de bijlagen I, deel A, punt 2.2, en IV van de richtlijn, en gaat, uitgezonderd de gevallen waarin
      uitsluitend de procedures, bedoeld in bijlagen V en VI van de richtlijn van toepassing zijn, vergezeld van het
      identificatienummer van de desbetreffende keuringsinstantie.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7
  - number: '7.3'
    text: |-
      Indien de beoordeling van overeenstemming na de bouw van het pleziervaartuig is verricht, wordt, onverminderd
      het tweede lid, op het in bijlage I, deel A, punt 2.2, van de richtlijn, bedoelde plaatje van de bouwer eveneens
      vermeld: «Certificering na de bouw.».
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7
  - number: '7.4'
    text: |-
      De CE-markering van overeenstemming wordt zichtbaar, leesbaar en onuitwisbaar aangebracht op de buitenboordmotor of
      de hekmotor met geïntegreerde uitlaat, overeenkomstig de bijlagen I, deel B, punt 1.1, en IV van de richtlijn, en
      gaat vergezeld van het identificatienummer van de desbetreffende keuringsinstantie.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7
  - number: '7.5'
    text: |-
      De CE-markering van overeenstemming wordt zichtbaar, leesbaar en onuitwisbaar aangebracht op onderdelen van
      pleziervaartuigen of op de verpakking van een onderdeel indien aanbrenging op het onderdeel zelf niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7
  - number: '7.6'
    text: |-
      Dit artikel is van overeenkomstige toepassing op pleziervaartuigen die nog niet zijn afgebouwd en op onderdelen van
      pleziervaartuigen, met dien verstande, dat de CE-markering van overeenstemming wordt aangebracht op de verpakking
      van een onderdeel, indien aanbrenging op het onderdeel zelf niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7
  - number: 7a
    text: |-
      De CE-markering van overeenstemming geeft tevens aan, dat het desbetreffende product voldoet aan alle andere
      regelingen ter uitvoering van communautaire richtlijnen met betrekking tot dat product. Indien echter in een
      of meer van deze andere regelingen ter uitvoering van communautaire richtlijnen de fabrikant gedurende een
      overgangsperiode de keuze heeft van de toe te passen regeling, geeft de CE-markering slechts aan dat aan de
      voorschriften van de door de fabrikant toegepaste regeling is voldaan. In dat geval worden de in het Publikatieblad
      van de Europese Unie bekendgemaakte referenties van de toegepaste communautaire richtlijnen vermeld op de in die
      richtlijnen voorgeschreven bescheiden, handleidingen of gebruiksaanwijzingen die bij het product zijn gevoegd.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7a
  - number: 7b.1
    text: |-
      De door de fabrikant of diens gemachtigde, ingevolge een toegepaste procedure van overeenstemmingsbeoordeling,
      geleverde technische documentatie voldoet aan bijlage XIII van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7b
  - number: 7b.2
    text: |-
      De fabrikant of diens gemachtigde bewaart op een systematische en behoorlijke wijze gedurende een periode van ten
      minste tien jaar:
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7b
  - number: 7b.2.a
    text: de in het eerste lid bedoelde technische documentatie;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7b
  - number: 7b.2.b
    text: |-
      de ingevolge een toegepaste procedure van overeenstemmingsbeoordeling door een keuringsinstantie afgegeven
      afschriften van verklaringen, certificaten, aanvullingen op certificaten, beoordelingsrapporten en
      controleverslagen en
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7b
  - number: 7b.2.c
    text: de door hem verstrekte gegevens ter verkrijging van de in onderdeel b genoemde documenten.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel7b
  - number: '8.1'
    text: |-
      Onze Minister wijst, met inachtneming van bijlage XIV van de richtlijn, de instanties aan die met betrekking tot
      de door hem te bepalen categorieën pleziervaartuigen, voortstuwingsmotoren en onderdelen van pleziervaartuigen
      belast zijn met door hem aan te geven taken als het verrichten van keuringen, de afgifte van certificaten van EG-
      typeonderzoek of het verrichten van controles, dan wel andere taken in het kader van de procedures, opgenomen in
      de bijlagen VI, VII, IX tot en met XII en XVI van de richtlijn. Aan een dergelijke aanwijzing kunnen voorschriften
      worden verbonden, die mede betrekking kunnen hebben op de door de keuringsinstanties in rekening te brengen
      tarieven.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel8
  - number: '8.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven betreffende de criteria voor de beoordeling van instanties
      die in aanmerking wensen te komen voor een aanwijzing als bedoeld in het eerste lid, de wijze van beoordeling, het
      op deze instanties uit te oefenen toezicht en de door deze instanties verschuldigde vergoeding voor de kosten van
      de beoordeling en de uitoefening van het toezicht.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel8
  - number: '8.3'
    text: |-
      Een ingevolge het eerste lid aangewezen instantie verstrekt desgevraagd aan Onze Minister de voor de uitoefening
      van zijn taak benodigde inlichtingen. Onze Minister kan inzage vorderen van de zakelijke gegevens en bescheiden,
      voor zover dat voor de vervulling van zijn taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel8
  - number: '8.4'
    text: |-
      Onze Minister trekt de aanwijzing in, indien hij van oordeel is dat de desbetreffende instantie niet meer voldoet
      aan de criteria van bijlage XIV van de richtlijn of de criteria voor de beoordeling van instanties, opgenomen in de
      ministeriële regeling, bedoeld in het tweede lid, dan wel indien de desbetreffende instantie de aan de aanwijzing
      verbonden voorschriften niet naleeft.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel8
  - number: '9'
    text: |-
      Onze Minister stelt de Commissie van de Europese Gemeenschappen en de andere lid-staten van de Europese Unie
      en de andere staten die partij zijn bij de Overeenkomst inzake de Europese Economische Ruimte in kennis van
      een aanwijzing of een intrekking ingevolge [artikel 8][ref1] en vermeldt in geval van een aanwijzing de aan de
      desbetreffende instantie toegekende taken en het door de Commissie van de Europese Gemeenschappen aan die instantie
      toegekende identificatienummer.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel8
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '10'
    text: |-
      Een keuringsinstantie, aangewezen ingevolge [artikel 8, eerste lid][ref1], is bevoegd om met inachtneming van bij
      ministeriële regeling gegeven voorschriften, beproevingen en controles door anderen te doen verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel8
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '8'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '11.1'
    text: |-
      Indien de keuringsinstantie die een EG-typeonderzoekverklaring heeft afgegeven, vermoedt dat het model niet
      meer voldoet aan de geldende essentiële veiligheidseisen van bijlage I van de richtlijn, stelt zij daarnaar een
      onderzoek in.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel11
  - number: '11.2'
    text: |-
      Een EG-typeonderzoekverklaring wordt door de keuringsinstantie ingetrokken, indien het in het eerste lid bedoelde
      onderzoek uitwijst dat het model niet meer aan de gewijzigde eisen voldoet.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel11
  - number: '12.1'
    text: |-
      Op verzoek van de fabrikant bepaalt Onze Minister de door de fabrikant te hanteren fabriekscode, bedoeld in bijlage
      I, deel A, punt 2.1, van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister kan een dienst, instelling of onderneming aanwijzen die bevoegd is tot de bepaling van de
      fabriekscode.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel12
  - number: '12.3'
    text: Aan een aanwijzing als bedoeld in het tweede lid kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel12
  - number: '13'
    text: |-
      De fabrikant of diens gemachtigde verleent een keuringsinstantie of de door deze ingevolge [artikel 10][ref1]
      aangewezen persoon of personen alle medewerking voor zover dat noodzakelijk is ten behoeve van de uitvoering van de
      desbetreffende procedure van overeenstemmingsbeoordeling en de uitoefening van andere in deze wet bedoelde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel10
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '14.1'
    text: |-
      Indien voor een pleziervaartuig, een onderdeel van een pleziervaartuig, een voortstuwingsmotor dan wel een
      ingrijpend gewijzigde voortstuwingsmotor of een ingrijpend verbouwd pleziervaartuig, als bedoeld in artikel 1,
      derde lid, onderdelen d, respectievelijk e, van de richtlijn door een fabrikant of diens gemachtigde geen procedure
      van overeenstemmingsbeoordeling is gevolgd, rust die verplichting op degene die het product in de handel brengt of
      in bedrijf stelt.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel14
  - number: '14.2'
    text: |-
      In een geval als bedoeld in het eerste lid zijn de artikelen [5][ref1], [6][ref2], [7][ref3], [7a][ref4],
      [7b][ref5], [13][ref6], [15][ref7] en [16, vierde lid][ref8], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008366#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008366#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0008366#Artikel7a
      [ref5]: https://wetten.overheid.nl/BWBR0008366#Artikel7b
      [ref6]: https://wetten.overheid.nl/BWBR0008366#Artikel13
      [ref7]: https://wetten.overheid.nl/BWBR0008366#Artikel15
      [ref8]: https://wetten.overheid.nl/BWBR0008366#Artikel16
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008366
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
