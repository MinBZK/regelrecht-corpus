        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref7
        bwb_id: BWBR0008366
        artikel: '15'
        hoofdstuk: '4'
      - id: ref8
        bwb_id: BWBR0008366
        artikel: '16'
        hoofdstuk: '4'
  - number: '14.3'
    text: |-
      Onverminderd het eerste lid, vraagt degene die het product in de handel brengt of in bedrijf stelt, bij een
      keuringsinstantie een zogenoemd rapport na de bouw aan, indien hij de verantwoordelijkheid neemt voor de
      overeenstemming van een reeds gebouwd pleziervaartuig met de in bijlage I van de richtlijn opgenomen essentiële
      eisen.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel14
  - number: '14.4'
    text: |-
      Onverminderd het eerste lid, verstrekt degene die het product in de handel brengt of in bedrijf stelt, bij de
      beoordeling van een reeds gebouwd pleziervaartuig, de keuringsinstantie alle beschikbare documenten en technische
      dossiers die betrekking hebben op het voor het eerst in de handel brengen van een pleziervaartuig in het land van
      oorsprong.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel14
  - number: '15.1'
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], mogen gedeeltelijk afgebouwde pleziervaartuigen zonder CE-markering
      van overeenstemming in de handel worden gebracht of als zodanig in bedrijf worden gesteld indien deze vergezeld
      gaan van een verklaring als bedoeld in bijlage III, punt a, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '15.2'
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], mogen de in dat lid bedoelde producten die niet zijn voorzien van
      de CE-markering van overeenstemming worden getoond op beurzen en tentoonstellingen en bij demonstraties indien met
      een duidelijk zichtbaar teken is aangegeven dat deze producten noch in de handel kunnen worden gebracht, noch in
      bedrijf kunnen worden gesteld, voordat zij met deze wet in overeenstemming zijn gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '15.3'
    text: |-
      In afwijking van [artikel 3, eerste lid][ref1], mogen de volgende producten zonder CE-markering van overeenstemming
      in de handel worden gebracht of als zodanig in bedrijf worden gesteld indien deze vergezeld gaan van een verklaring
      van overeenstemming overeenkomstig bijlage XV, punt 3, van de richtlijn:


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: 15.3.a
    text: binnenboord- en hekmotoren zonder geïntegreerde uitlaat;
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel15
  - number: 15.3.b
    text: de voortstuwingsmotoren die zijn goedgekeurd volgens een bij ministeriële regeling aangewezen EG-richtlijn.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel15
  - number: '16.1'
    text: |-
      Indien Onze Minister van oordeel is dat een van een CE-markering van overeenstemming voorzien pleziervaartuig,
      onderdeel van een pleziervaartuig of een van deze markering voorziene voortstuwingsmotor in geval van een juiste
      constructie, montage, correct onderhoud en gebruik volgens hun bestemming, gevaar kan opleveren voor de veiligheid
      en de gezondheid van personen, goederen of het milieu, neemt hij alle dienstige voorlopige maatregelen om dat
      pleziervaartuig, dat onderdeel of die voortstuwingsmotor uit de handel te nemen. Zo nodig kan hij het in bedrijf
      stellen ervan verbieden of daaraan beperkingen opleggen.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel16
  - number: '16.2'
    text: |-
      Indien Onze Minister van oordeel is dat de CE-markering van overeenstemming ten onrechte is aangebracht, neemt hij
      de nodige maatregelen om het desbetreffende product uit de handel te nemen. Zo nodig kan hij het in bedrijf stellen
      ervan verbieden of daaraan beperkingen opleggen.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel16
  - number: '16.3'
    text: |-
      De fabrikant of diens gemachtigde verleent alle noodzakelijke medewerking aan de uitvoering van een maatregel als
      bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel16
  - number: '16.4'
    text: |-
      Onze Minister stelt de Commissie van de Europese Gemeenschappen onmiddellijk onder opgave van redenen in kennis van
      een maatregel als bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel16
  - number: '17.1'
    text: |-
      Het is verboden een in [artikel 3, eerste of derde lid][ref1], bedoeld product in de handel te brengen of als
      zodanig in bedrijf te stellen, indien dit niet voldoet aan de desbetreffende in bijlage I van de richtlijn
      opgenomen essentiële eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '17.2'
    text: |-
      Het is verboden een in [artikel 3, eerste lid][ref1], bedoeld product in de handel te brengen of als zodanig
      in bedrijf te stellen, indien dit niet op deugdelijke wijze is voorzien van de vereiste CE-markering van
      overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '3'
        hoofdstuk: '2'
  - number: '17.3'
    text: |-
      Het is verboden een CE-markering van overeenstemming aan te brengen, indien niet een van toepassing zijnde
      procedure van overeenstemmingsbeoordeling is gevolgd of indien het betrokken product niet voldoet aan de
      desbetreffende in bijlage I van de richtlijn opgenomen essentiële eisen.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel17
  - number: '17.4'
    text: |-
      Het is verboden merktekens of opschriften aan te brengen die anderen kunnen misleiden omtrent de betekenis of de
      grafische vormgeving van de CE-markering van overeenstemming, of die de zichtbaarheid of de leesbaarheid van die
      CE-markering verminderen.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel17
  - number: '17.5'
    text: |-
      Het is verboden te handelen in strijd met de artikelen [6][ref1], [13][ref2], [14][ref3],
      [15][ref4] en [16, derde lid][ref5], en een verbod of beperking, als bedoeld in
      [artikel 16, eerste lid, tweede volzin, en tweede lid, tweede volzin][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008366#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008366#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0008366#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0008366#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0008366#Artikel16
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008366
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008366
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0008366
        artikel: '15'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0008366
        artikel: '16'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0008366
        artikel: '16'
        hoofdstuk: '4'
  - number: '18.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de door Onze Minister
      aangewezen ambtenaren van de Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel18
  - number: '18.2'
    text: |-
      Onze Minister kan tevens ambtenaren van een andere diensttak aanwijzen voor het toezicht op de naleving van het
      bij of krachtens deze wet bepaalde. Indien hij ambtenaren van een ander ministerie aanwijst, doet hij dit in
      overeenstemming met zijn ambtgenoot die het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel18
  - number: '18.3'
    text: Van een besluit als bedoeld in het tweede lid wordt mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel18
  - number: '24.1'
    text: |-
      De artikelen [3][ref1], [4][ref2], [5][ref3], [6][ref4], [7, eerste lid][ref5], [7a][ref6], [7b][ref7],
      [13][ref8], [14, eerste lid][ref9], [15][ref10], [16][ref11], en [17][ref12], zijn tot en met 31 december 2005 niet
      van toepassing op het in de handel brengen en in bedrijf stellen van waterscooters, compressieontstekingsmotoren en
      viertaktmotoren met elektrische ontsteking.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008366#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008366#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0008366#Artikel6
