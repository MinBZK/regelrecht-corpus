        hoofdstuk: '5'
  - number: '24.2'
    text: |-
      De artikelen, bedoeld in het eerste lid, zijn tot en met 31 december 2006 niet van toepassing op tweetaktmotoren
      met elektrische ontsteking.
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel24
  - number: '24.3'
    text: |-
      De [artikelen 7, derde lid][ref1], en [14, derde en vierde lid][ref2], zijn tot en met 31 december 2005 niet van
      toepassing bij de beoordeling van pleziervaartuigen na de bouw.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008366#Artikel14
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '7'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008366
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '24.4'
    text: |-
      In afwijking van [artikel 5, eerste lid][ref1], mogen voor andere pleziervaartuigen dan waterscooters en voor
      onderdelen van pleziervaartuigen tot en met 31 december 2005 de procedures van overeenstemmingsbeoordeling
      gevolgd worden overeenkomstig artikel 8 van [richtlijn nr. 94/25/EG](31994L0025), naar de tekst zoals deze bij die
      richtlijn is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel5
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '5'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 24a.1
    text: |-
      Onverminderd [artikel 24, eerste en tweede lid][ref1], kan een fabrikant, diens gemachtigde of de persoon die
      waterscooters, compressieontstekingsmotoren, viertaktmotoren of tweetaktmotoren met elektrische ontsteking eerder
      dan 1 januari 2006, respectievelijk 1 januari 2007, in de handel brengt, hiervoor een ingevolge artikel 8 van de
      richtlijn toepasselijke procedure van overeenstemmingsbeoordeling volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel24
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '24'
        hoofdstuk: '7'
  - number: 24a.2
    text: |-
      In dat geval zijn de artikelen [6][ref1], [7][ref2], [7a][ref3] en [7b][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008366#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008366#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008366#Artikel7a
      [ref4]: https://wetten.overheid.nl/BWBR0008366#Artikel7b
    url: https://wetten.overheid.nl/BWBR0008366/2010-12-31#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0008366
        artikel: '6'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
