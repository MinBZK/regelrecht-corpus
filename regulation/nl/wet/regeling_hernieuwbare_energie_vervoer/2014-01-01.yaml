  - number: '18'
    text: |-
      1 Het percentage van de jaarverplichting dat wordt ingevuld met biobrandstoffen als bedoeld in
      [artikel 3, zesde lid, onderdeel b, van het besluit][ref1] is ten hoogste 25.

      2 De biobrandstoffen, bedoeld in het eerste lid, voldoen in het kalenderjaar waarin deze worden meegeteld aan de
      voor dat kalenderjaar geldende eisen, bedoeld in [artikel 3, derde lid, van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029926#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029926#Artikel3
