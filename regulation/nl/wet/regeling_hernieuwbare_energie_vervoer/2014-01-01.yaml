  - number: '19'
    text: |-
      Het bioticket wordt opgesteld overeenkomstig het model in [bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029954
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0029954
  - number: '20'
    text: |-
      Het [besluit][ref1] is niet van toepassing op diesel waarvoor vrijstelling van accijns als bedoeld
      in [artikel 66 van de Wet op de accijns][ref2] dan wel teruggaaf van accijns als bedoeld in
      [artikel 70, eerste lid, onderdeel b, van die wet][ref3] is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0029926
