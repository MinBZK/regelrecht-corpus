  - number: 1a
    text: |-
      1 De hoeveelheid, bedoeld in [artikel 1a, eerste lid, van het besluit][ref1] is: 50.000 liter.

      2 De brandstoffen, bedoeld in [artikel 1a, eerste en tweede lid, van het besluit][ref2] zijn:

      a. benzine;

      b. diesel;

      c. biobrandstoffen, met uitzondering van biogas.


      [ref1]: https://wetten.overheid.nl/BWBR0029926#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0029926#Artikel1a
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel1a
    references:
