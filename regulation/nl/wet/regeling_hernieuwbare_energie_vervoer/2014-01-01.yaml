        artikel: '70'
  - number: '21'
    text: |-
      1 Als categorieën ondernemingen als bedoeld in [artikel 12.33, eerste lid, van de Wet milieubeheer][ref1] worden
      aangewezen de registratieplichtigen die biobrandstoffen fysiek bijmengen in benzine of diesel.

      2 Het overzicht, bedoeld in [artikel 12.33, eerste lid, van de Wet milieubeheer][ref2], heeft betrekking op de
      biobrandstoffen, bedoeld in het eerste lid, wordt langs elektronische weg bekendgemaakt, en bestaat uit drie
      overzichten waarin over het laatst verstreken kalenderjaar per geregistreerde van de hoeveelheid ten behoeve van
      wegvoertuigen en mobiele machines op de Nederlandse markt gebrachte biobrandstoffen wordt vermeld:

      a. de aard van de verschillende grondstoffen;

      b. de herkomst van de grondstoffen, en

      c. de gehanteerde duurzaamheidssystemen.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel12.33
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel12.33
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel21
    references:
