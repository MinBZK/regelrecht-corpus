        artikel: '12.33'
  - number: '22'
    text: |-
      De geregistreerde bewaart ten minste vijf jaar na indiening van de biobrandstoffenbalans:

      a. de biobrandstoffenbalans;

      b. de verklaringen, bedoeld in [artikel 6, eerste lid][ref1];

      c. de gegevens, bedoeld in [artikel 6, tweede lid][ref2];

      d. de gegevens, bedoeld in [artikel 8, tweede lid][ref3];

      e. de verklaringen, bedoeld in [artikel 17, eerste lid][ref4];

      f. de biotickets.


