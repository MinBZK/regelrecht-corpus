      - id: ref2
        bwb_id: BWBR0029926
        artikel: 1a
  - number: '2'
    text: |-
      De energie-inhoud op basis van de onderste verbrandingswaarde van biobrandstoffen waarvoor in bijlage III bij de
      richtlijn geen energie-inhoud wordt vermeld, wordt door de geregistreerde aangetoond aan de hand van bestaande
      gegevens of vastgesteld door een volgens ISO-/IEC 17025 geaccrediteerd laboratorium.
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel2
  - number: '3'
    text: |-
      Het aandeel elektriciteit uit hernieuwbare bronnen, bedoeld in artikel 6, vijfde lid, van het besluit, is het door
      Eurostat bekend gemaakte gemiddelde aandeel van elektriciteit uit hernieuwbare bronnen in de Europese Unie twee
      jaar voorafgaand aan het betreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel3
  - number: '4'
    text: |-
      De geregistreerde dient voor 1 maart bij het bestuur van de emissieautoriteit langs elektronische weg een
      biobrandstoffenbalans in over het voorafgaande kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel4
  - number: '5'
    text: |-
      1 De biobrandstoffenbalans wordt ingediend door middel van een door de minister vastgesteld en door het bestuur van
      de emissieautoriteit op elektronische wijze ter beschikking gesteld model. Het model en de in te dienen gegevens
      kunnen voor verschillende categorieën geregistreerden verschillend zijn.

      2 De hoeveelheid diesel, benzine en vloeibare biobrandstoffen wordt op de biobrandstoffenbalans vermeld in liters
      bij een temperatuur van 15°C. De hoeveelheid biogas wordt in de biobrandstoffenbalans vermeld in kilogrammen. De
      hoeveelheid elektriciteit wordt vermeld in kWh.
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel5
  - number: '6'
    text: |-
      1 De geregistreerde die een ten behoeve van wegvoertuigen en mobiele machines op de Nederlandse markt gebrachte
      hoeveelheid biogas of elektriciteit uit hernieuwbare bronnen meetelt voor de jaarverplichting of als bioticket
      verhandelt, overlegt op verzoek van het bestuur van de emissieautoriteit een verklaring dat die hoeveelheid biogas
      respectievelijk elektriciteit als brandstof voor wegvoertuigen of mobiele machines is geleverd. De verklaring wordt
      opgesteld overeenkomstig het van toepassing zijnde model in [bijlage I][ref1].

      2 De geregistreerde verstrekt het bestuur van de emissieautoriteit op verzoek de gegevens die hij gebruikt heeft om
      de verklaring, bedoeld in het eerste lid, op te stellen.

      3 Een verklaring als bedoeld in het eerste lid, omvat tevens de gegevens, bedoeld in [artikel 8, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029954
      [ref2]: https://wetten.overheid.nl/BWBR0029954#Artikel8
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0029954
      - id: ref2
        bwb_id: BWBR0029954
        artikel: '8'
        paragraaf: '3'
  - number: '7'
    text: |-
      1 Een geregistreerde brengt in de biobrandstoffenbalans opgenomen biobrandstoffen die al dan niet bijgemengd bij
      benzine of diesel naar het buitenland worden overgebracht, in de biobrandstoffenbalans in mindering.

      2 Een geregistreerde kan aan biobrandstoffen in benzine of diesel, die niet naar het buitenland worden
      overgebracht, na het moment van mengen, de bestemming geven dat ze ten behoeve van wegvoertuigen en mobiele
      machines op de Nederlandse markt worden gebracht.

      3 Een geregistreerde brengt biobrandstoffen die de bestemming, bedoeld in het tweede lid, hebben gekregen, niet in
      mindering in zijn biobrandstoffenbalans.
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel7
  - number: '8'
    text: |-
      1 De geregistreerde vermeldt in de biobrandstoffenbalans voor elke hoeveelheid biobrandstoffen die hij heeft
      geproduceerd of ingeslagen en voor elke hoeveelheid biobrandstoffen uit zijn fysieke beginvoorraad van het
      betreffende kalenderjaar en zijn administratieve eindvoorraad van het voorafgaande kalenderjaar, de in de
      biobrandstoffenbalans gevraagde kenmerken, waaronder:

      a. het door hem toegepaste duurzaamheidssysteem;

      b. de GN-code van het gewas of de grondstof waaruit die hoeveelheid is geproduceerd;

      c. het land van herkomst van het gewas of de grondstof, bedoeld in onderdeel b;

      d. de reductie van broeikasgasemissies gedurende de levenscyclus.

      Voor elke hoeveelheid wordt één set kenmerken vermeld.

      2 In geval van eerste inslag of productie van biobrandstoffen in Nederland en in geval van biobrandstoffen uit de
      fysieke beginvoorraad van het betreffende kalenderjaar en de fysieke eindvoorraad van het voorafgaande kalenderjaar
      verstrekt de geregistreerde het bestuur van de emissieautoriteit op verzoek de gegevens die hij gebruikt heeft om
      de kenmerken, bedoeld in het eerste lid, op te stellen.
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel8
  - number: '9'
    text: |-
      1 Op verzoek van het bestuur van de emissieautoriteit, toont de geregistreerde met betrekking tot de
      biobrandstoffen die hij ten behoeve van wegvoertuigen en mobiele machines op de Nederlandse markt brengt aan dat
      een duurzaamheidssysteem is toegepast dat door de Europese Commissie op grond van artikel 18, vierde lid, van de
      richtlijn is geaccepteerd.

      2 Een duurzaamheidssysteem als bedoeld in het eerste lid kan tevens betreffen een door de minister geaccepteerd
      duurzaamheidssysteem voor het werkveld waarvoor die geregistreerde dat systeem toepast, voor zover:

      a. de acceptatie heeft plaatsgevonden op grond van [artikel 10][ref1], zoals die bepaling gold onmiddellijk
      voorafgaand aan 1 juli 2013, en

      b. de termijn van die acceptatie nog niet is verlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0029954#Artikel10
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0029954
        artikel: '10'
        paragraaf: '3'
  - number: '15'
    text: |-
      De geregistreerde opent voor een kalenderjaar een rekening door voor de eerste keer in dat kalenderjaar een
      biobrandstoffenbalans in te dienen bij de emissieautoriteit. De emissieautoriteit zendt een bevestiging daarvan aan
      de geregistreerde.
    url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#Artikel15
  - number: '16'
    text: |-
      1 Bij de vaststelling van het percentage, bedoeld in [artikel 3, eerste lid, van het besluit][ref1], telt
      biobrandstof die is geproduceerd uit materialen genoemd in:

      a. [bijlage II][ref2], tabel 1, 2 en 3: dubbel;

      b. [bijlage II][ref3], tabel 4 en 5: niet dubbel.

      2 In afwijking van het eerste lid, aanhef en onder b, kan de minister op verzoek van de drijver van een inrichting
      besluiten dat biobrandstof die is geproduceerd uit materialen genoemd in tabel 5 van [bijlage II][ref4] onder
      specifieke locatie- of bedrijfsomstandigheden dubbeltellen. De minister kan voorwaarden verbinden aan zijn besluit.

      3 Een verzoek als bedoeld in het tweede lid omvat in ieder geval de ontstaanswijze van het materiaal, de huidige
      toepassingen van het materiaal en de marktcondities. De minister kan om nadere informatie vragen.

      4 De minister beoordeelt bij een verzoek als bedoeld in het tweede lid, de materialen als volgt:

      a. materiaal dat in de richtlijn of bijbehorende communicaties als residu wordt genoemd, is residu;

      b. materiaal dat niet in de richtlijn of bijbehorende communicaties als afval of residu wordt genoemd, is alleen
      afval of residu als:

      1°. er geen alternatieve toepassing is;

      2°. het niet een materiaal betreft dat in kwaliteit zodanig is verlaagd of verontreinigd dat het niet meer geschikt
      is voor zijn oorspronkelijke toepassing;

      3°. het geen ongebruikt product betreft waarvan de houdbaarheidsdatum is verstreken;

      c. materiaal dat niet op grond van onderdeel a of b kan worden gecategoriseerd, is een co-product als:

      1°. het productieproces waaruit het materiaal overblijft is aangepast om een grotere hoeveelheid of een hogere
      kwaliteit van het betreffende materiaal te verkrijgen, of

      2°. het in aanzienlijke mate bijdraagt aan de waarde van alle producten uit het proces waarin het ontstaat;

      d. materiaal dat niet op grond van onderdeel a, b of c kan worden gecategoriseerd, is afval of residu.

      5 Ten behoeve van de beoordeling, bedoeld in het vierde lid, wordt verstaan onder:

      a. *alternatieve toepassing:* toepassing anders dan opwekking van elektriciteit of warmte, compostering of
      benutting van het lignocellulosedeel van biomassa als diervoerder;

      b. *residu:* van landbouw, aquacultuur, visserij of bosbouw afkomstig restproduct of stof die niet het eindproduct
      vormt waarop een productieproces rechtstreeks is gericht.


      [ref1]: https://wetten.overheid.nl/BWBR0029926#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0029954
      [ref3]: https://wetten.overheid.nl/BWBR0029954
      [ref4]: https://wetten.overheid.nl/BWBR0029954
