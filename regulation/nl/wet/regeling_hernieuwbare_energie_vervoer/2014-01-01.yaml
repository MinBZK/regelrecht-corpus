  - number: '17'
    text: |-
      1 Op verzoek van het bestuur van de emissieautoriteit legt de geregistreerde die biobrandstoffen als bedoeld in
      [artikel 16][ref1] produceert, of voor de eerste keer in Nederland inslaat, een verklaring over waaruit blijkt
      dat die biobrandstoffen geproduceerd zijn uit materiaal als bedoeld in [bijlage II][ref2], tabel 1, 2, 3 of uit
      materiaal waarop artikel 16, tweede lid, van toepassing is.

      2 De verklaring, bedoeld in het eerste lid, wordt afgegeven door een onafhankelijke instelling:

      a. die door een accreditatie-instantie, die ondertekenaar is van de Multilateral Agreement van de European co-
      operation for Accreditation, is geaccrediteerd:

      1°. volgens NEN-EN-ISO 17020, type A, en

      2°. voor de aanvullende werkzaamheden met betrekking tot het werkveld dubbeltelling biobrandstoffen, of

      b. ten aanzien waarvan een accreditatie-instantie als bedoeld in onderdeel a het accreditatieproces nog niet heeft
      geëindigd, maar het vooronderzoek ten behoeve van accreditatie als bedoeld in onderdeel a met goed gevolg heeft
      afgerond.

      3 De onafhankelijke instelling, bedoeld in het tweede lid, geeft de verklaring, bedoeld in het eerste lid, niet af
      indien niet voldaan wordt aan de eisen, genoemd in [bijlage III][ref3].

      4 De onafhankelijke instelling, bedoeld in het tweede lid:

      a. beheert de unieke codes van de verklaringen, bedoeld in het eerste lid;

      b. geeft bij splitsing van de verklaring opnieuw een unieke code af;

      c. verstrekt op verzoek van het bestuur van de emissieautoriteit, binnen zes maanden na het kalenderjaar een
      overzicht van de door haar afgegeven en ingenomen verklaringen;

      d. ziet erop toe dat te verifiëren hoeveelheden grondstoffen en biobrandstoffen zijn bepaald overeenkomstig
      [artikel 2 van het Meetinstrumentenbesluit I][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0029954#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0029954
      [ref3]: https://wetten.overheid.nl/BWBR0029954
      [ref4]: https://wetten.overheid.nl/BWBR0019897#Artikel2
