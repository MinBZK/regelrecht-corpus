preamble:
  text: |-
    Gelet op de artikelen 12.31, vierde en vijfde lid, van de Wet milieubeheer, de artikelen 3, vierde, vijfde en zesde
    lid, 4, tweede lid, 5, derde lid, en 6, vijfde lid, van het Besluit hernieuwbare energie vervoer en artikel 2.9,
    vijfde lid, van het Besluit brandstoffen luchtverontreiniging;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0029954/2014-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *besluit:* [Besluit hernieuwbare energie vervoer][ref1];
        - *biobrandstoffenbalans:* overzicht van de op de Nederlandse markt gebrachte en geleverde biobrandstoffen
      en elektriciteit ten behoeve van wegvoertuigen en mobiele machines, in het kalenderjaar waarop die
      biobrandstoffenbalans betrekking heeft;
        - *broeikasgasemissies gedurende de levenscyclus:* broeikasgasemissies gedurende de levenscyclus als bedoeld in het
      [Besluit brandstoffen luchtverontreiniging][ref2];
        - *duurzaamheidssysteem:* systeem voor de beoordeling van de duurzaamheid van biobrandstoffen;
        - *jaarverplichting:* verplichting in een percentage over een kalenderjaar als genoemd in
      [artikel 3, eerste lid, van het besluit][ref3];
        - *minister:* Minister van Infrastructuur en Milieu;
        - *rekening:* rekening als bedoeld in [artikel 5, eerste lid, van het besluit][ref4];
        - *verificateur:* onafhankelijke deskundige als bedoeld in [artikel 3, derde lid, van het besluit][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0029926
      [ref2]: https://wetten.overheid.nl/BWBR0029909
      [ref3]: https://wetten.overheid.nl/BWBR0029926#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0029926#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0029926#Artikel3
