  - number: '2'
    text: |-
      De laatste zin van [artikel 2, vierde lid, van de Regeling eisen eigenaar of houder van destructiemateriaal][ref1]
      vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0007341#Artikel2
    url: https://wetten.overheid.nl/BWBR0011797/2002-04-14#Artikel2
    references:
