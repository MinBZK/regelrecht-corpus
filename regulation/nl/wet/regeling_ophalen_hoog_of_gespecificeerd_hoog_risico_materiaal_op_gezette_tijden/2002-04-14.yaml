articles:
  - number: '1'
    text: |-
      Na een aangifte wordt in de daaropvolgende week in ieder geval éénmaal het volgende hoog-risico-materiaal of
      gespecificeerd hoog-risico-materiaal opgehaald:
    url: https://wetten.overheid.nl/BWBR0011797/2002-04-14#Artikel1
  - number: 1.a
    text: |-
      kadavers van slachtdieren en van voor de landbouwproductie gehouden dieren, beide tot een gewicht van 40 kg, met
      uitzondering van kalveren;
    url: https://wetten.overheid.nl/BWBR0011797/2002-04-14#Artikel1
  - number: 1.b
    text: hoog-risico-materiaal als bedoeld in artikel 2, eerste lid, onderdelen c, d, en e, van de wet;
    url: https://wetten.overheid.nl/BWBR0011797/2002-04-14#Artikel1
  - number: 1.c
    text: |-
      gespecificeerd hoog-risico-materiaal als bedoeld in [artikel 2, eerste lid, onderdelen c][ref1] en k, van de
      [Regeling aanwijzing gespecificeerd hoog-risico-materiaal 2000][ref2]..


      [ref1]: https://wetten.overheid.nl/BWBR0011797#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0011443
    url: https://wetten.overheid.nl/BWBR0011797/2002-04-14#Artikel1
    references:
      - id: ref1
