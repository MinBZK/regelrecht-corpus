  - number: '3'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0011797/2002-04-14#Artikel3
  - number: '4'
    text: |-
      Deze regeling wordt aangehaald als: Regeling ophalen hoog- of gespecificeerd hoog-risico-materiaal op gezette
      tijden.
