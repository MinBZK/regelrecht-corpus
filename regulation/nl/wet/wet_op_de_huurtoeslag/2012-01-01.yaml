  - number: '27'
    text: |-
      1 Bij ministeriële regeling worden met ingang van 1 januari van elk jaar de bedragen, genoemd in de
      [artikelen 13, eerste lid, onderdeel a][ref1] (maximale huurgrens), en [14, eerste lid][ref2] (norminkomen),
      gewijzigd met de factor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref3], met dien verstande dat
      in het eerste en tweede lid van laatstgenoemd artikel voor «kalenderjaar» telkens wordt gelezen «berekeningsjaar»
      en dat in het tweede lid van dat artikel voor «Consumentenprijsindex Alle Huishoudens afgeleid» wordt gelezen
      «Consumentenprijsindex Alle Huishoudens».

      2 Naast de wijziging op grond van het eerste lid kan het bedrag, genoemd in [artikel 14, eerste lid][ref4]
      (norminkomen), bij ministeriële regeling worden gewijzigd ter voorkoming van onbedoelde gevolgen van maatregelen
      met betrekking tot de inkomens boven het minimum-inkomensijkpunt.

      3 Bij ministeriële regeling worden, met ingang van 1 januari van elk jaar, de bedragen, genoemd in de
      [artikelen 13, eerste lid, onderdeel b][ref5] (maximale huurgrens), [17, tweede lid][ref6] (bij minimum-
      inkomensijkpunt behorende normhuur), [18, derde lid][ref7] (bij referentie-inkomensijkpunt behorende normhuur), en
      [20, eerste en tweede lid][ref8] (kwaliteitskortingsgrens en aftoppingsgrenzen), gewijzigd met het percentage van
      de huurprijsontwikkeling, zoals die naar redelijke verwachting in het tijdvak dat loopt van 1 juli van het aan het
      berekeningsjaar voorafgaande jaar tot 1 juli van het berekeningsjaar zal plaatsvinden.

      4 In afwijking van het derde lid worden de bedragen, genoemd in de [artikelen 17, tweede lid][ref9] (bij minimum-
      inkomensijkpunt behorende normhuur), en [18, derde lid][ref10] (bij referentie-inkomensijkpunt behorende normhuur),
      bij ministeriële regeling met ingang van 1 januari van elk jaar gewijzigd met het percentage waarmee het bedrag,
      bedoeld in [artikel 21, eerste lid, van de Wet werk en bijstand][ref11], naar redelijke verwachting wordt gewijzigd
      in het tijdvak dat loopt van 1 januari van het aan het berekeningsjaar voorafgaande jaar tot 1 januari van het
      berekeningsjaar, indien dat percentage lager is dan het in het derde lid bedoelde percentage.

      5 Bij ministeriële regeling wordt elk jaar, na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid, de
      hoogte vastgesteld van de bedragen, zoals die met ingang van 1 januari krachtens [artikel 17, eerste lid][ref12],
      als minimum-inkomensijkpunten gelden.

      6 Bij ministeriële regeling worden met ingang van 1 januari van elk jaar de bedragen, genoemd in
      [artikel 18, eerste lid][ref13] (referentie-inkomensijkpunten), gewijzigd met het percentage, waarmee de in het
      berekeningsjaar verwachte corresponderende bedragen krachtens [artikel 17, eerste lid, onderdelen a en b][ref14],
      en de in het berekeningsjaar verwachte corresponderende bedragen en tegemoetkomingen krachtens de onderdelen c en
      d van dat artikellid (minimum-inkomensijkpunten), afwijken van de corresponderende bedragen en tegemoetkomingen
      die in het daaraan voorafgaande berekeningsjaar gelden krachtens de in dat artikellid genoemde wetten. Van dit
      percentage kan worden afgeweken, voor zover de wijziging van de in [artikel 17, eerste lid][ref15], bedoelde
      jaarinkomens onbedoeld afwijkt van de wijziging welke naar verwachting plaats zal vinden met betrekking tot de
      inkomens boven het minimum-inkomensijkpunt.

      7 De bedragen, bedoeld in het eerste, tweede, derde en vierde lid, worden naar boven afgerond op hele eurocenten,
      met uitzondering van de norminkomens, bedoeld in [artikel 14, eerste lid, onderdelen a en b][ref16] (maximum
      inkomen bij een- en meerpersoonshuishoudens), die naar boven worden afgerond op een veelvoud van € 25. De
      som van de bedragen, bedoeld in [artikel 14, derde lid, onderdeel b][ref17] (maximum inkomen bij een- en
      meerpersoonsouderenhuishoudens en de bedragen, bedoeld in het vijfde en zesde lid, worden naar boven afgerond op
      een veelvoud van € 25. Bij een volgende wijziging van de norminkomens en de bedragen, bedoeld in het zesde lid,
      wordt uitgegaan van de bedragen zoals die waren, voordat zij werden afgerond.

      8 De overeenkomstig het eerste tot en met zevende lid vastgestelde, vanaf 1 januari geldende minimum-
      inkomensijkpunten, referentie-inkomensijkpunten, maximale inkomensgrenzen, normhuren, de als gevolg daarvan
      voor de onderscheiden typen huishouden gewijzigde factoren, bedoeld in [artikel 19, tweede lid][ref18], maximale
      huur-, kwaliteitskortings- en aftoppingsgrenzen, worden elk jaar uiterlijk op 1 november daaraan voorafgaand in de
      Staatscourant bekendgemaakt.

      9 Bij algemene maatregel van bestuur kunnen de bedragen, genoemd in de
      [artikelen 5, derde lid, onderdelen a, b, c, en d][ref19] (maximum service-kosten), [16][ref20] (verhoging
      van de normhuur), [17, eerste lid, onderdelen c en d][ref21] (ouderentoeslag bij minimum-inkomensijkpunt),
      en [derde lid, onderdelen a en b][ref22] (verlaging van de normhuur bij minimum-inkomensijkpunt), en
      [18, vierde lid, onderdelen a, b, c en d][ref23] (verlaging van de normhuur bij referentie-inkomensijkpunt), hoger
      of lager worden gesteld.


