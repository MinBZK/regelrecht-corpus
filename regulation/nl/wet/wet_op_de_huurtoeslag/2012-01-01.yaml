  - number: '54'
    text: De Wet individuele huursubsidie wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel54
  - number: '55'
    text: |-
      1 Op subsidietijdvakken die zijn aangevangen onder de werking van de Wet individuele huursubsidie blijven de
      daarop vóór de inwerkingtreding van de Huursubsidiewet geldende bepalingen van toepassing. Gedurende de eerste
      vijf subsidiejaren na de inwerkingtreding van [artikel 44][ref1], wordt de huursubsidie-uitgavennorm zodanig
      lager vastgesteld dan uit [artikel 41][ref2] voortvloeit, dat een eventuele overschrijding van de huursubsidie-
      uitgavennorm die is ontstaan gedurende het eerste subsidiejaar na inwerkingtreding van deze wet, wordt
      tenietgedaan.

      2 In het eerste subsidiejaar na inwerkingtreding van deze wet wordt in afwijking van [artikel 4, eerste lid][ref3],
      verstaan onder rekenvermogen: het gezamenlijk vermogen van de huurder en de medebewoners op 0.00 uur op de datum
      van inwerkingtreding van [artikel 4, eerste lid][ref4].

      3 [Artikel 11][ref5] blijft buiten toepassing ten aanzien van een huurder van onzelfstandige woonruimte, anders
      dan bedoeld in dat artikel, indien die woonruimte onmiddellijk voorafgaand aan het moment dat de Wet individuele
      huursubsidie werd ingetrokken, was aangewezen als woonruimte aan de huurder waarvan een bijdrage op voet van die
      wet kon worden verstrekt.

      4 [Artikel 13, eerste lid][ref6], is niet van toepassing op een huurder op wie artikel 41 van de Wet individuele
      huursubsidie of [artikel II van de wet van 9 juni 1994 houdende wijziging van de Wet individuele huursubsidie][ref7]
      (Stb. 439) van toepassing was over de aan de dag van inwerkingtreding van deze wet voorafgaande kalendermaand,
      zolang deze huurder het genot van de desbetreffende woning behoudt. [Artikel 13, derde lid][ref8], is in deze
      gevallen van overeenkomstige toepassing.

      5 Bij de toepassing van [artikel 2][ref9], en bij de toepassing van
      [artikel 7 van de Algemene wet inkomensafhankelijke regelingen][ref10] kan de Belastingdienst/Toeslagen op verzoek
      van de huurder het op 31 december 2005 van kracht zijnde beleid toepassen dat Onze Minister heeft getroffen op
      grond van [artikel 9][ref11] en [artikel 26][ref12], eerste lid, zoals die artikelen onmiddellijk voorafgaand aan
      de inwerkingtreding van de [Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref13] luidden.

      6 Het vijfde lid geldt uitsluitend in bij of krachtens algemene maatregel van bestuur vast te stellen gevallen.

      7 Een verrekening als bedoeld in [artikel 36, derde lid][ref14], kan mede betrekking hebben op te veel betaalde
      bedragen en de daarop betrekking hebbende verhogingen op voet van de Wet individuele huursubsidie.

      8 Voor de toepassing van [artikel 41][ref15] voor het eerste subsidiejaar na inwerkingtreding van deze wet, gelden
      de bijdragen op voet van de Wet individuele huursubsidie over het daaraan voorafgaande jaar als uitgaven aan
      huursubsidie.


