  - number: '13'
    text: |-
      1 Geen huurtoeslag wordt toegekend als de rekenhuur:

      a. hoger is dan € 664,66 per maand als:

      1º. de huurder, diens partner of een van de medebewoners 23 jaar of ouder is, dan wel de woning deelt met een kind
      of pleegkind van de huurder, diens partner of een medebewoner of

      2º. de huurder, diens partner of de medebewoner jonger dan 23 jaar is, en een handicap heeft

      of

      b. hoger is dan € 366,37 per maand in andere gevallen dan bedoeld onder a.

      2 Het eerste lid is niet van toepassing:

      a. als sprake is van overschrijding van een daar genoemd bedrag omdat voorzieningen zijn aangebracht in en rond de
      woning, die noodzakelijk zijn in verband met een handicap van de huurder, van diens partner of van een medebewoner;

      b. als de woning geschikt en bestemd is voor de huisvesting van een huishouden van ten minste acht personen, en het
      huishouden van de huurder uit ten minste acht personen bestaat;

      c. na overschrijding van de bedragen, genoemd in het eerste lid, als over de maand die onmiddellijk voorafging aan
      die overschrijding een huurtoeslag is toegekend en die overschrijding niet het gevolg is van een verhuizing naar
      een andere woning.

      3 Als een huurtoeslag wordt toegekend met toepassing van het tweede lid, ontvangt de huurder geen huurtoeslag voor
      het deel van de rekenhuur dat ligt boven het maximum dat in het eerste lid is genoemd.

      4 De in het eerste lid, onder a en b, genoemde bedragen worden met ingang van 1 januari van elk jaar gewijzigd
      overeenkomstig [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
