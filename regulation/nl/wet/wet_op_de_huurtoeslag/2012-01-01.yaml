  - number: '18'
    text: |-
      1 Het referentie-inkomensijkpunt bedraagt:

      a. voor een eenpersoonshuishouden: € 22 875;

      b. voor een meerpersoonshuishouden: € 29 725;

      c. voor een eenpersoonsouderenhuishouden: € 21 550;

      d. voor een meerpersoonsouderenhuishouden: € 28 925.

      2 Voor de toepassing van het derde lid en van [artikel 19, tweede lid][ref1], worden de bedragen, genoemd in het
      eerste lid, onderdelen c en d, vermeerderd met € 665 onderscheidenlijk € 1 462.

      3 Bij het referentie-inkomensijkpunt behoort een normhuur van € 400,23.

      4 De normhuur, bedoeld in het tweede lid, wordt verlaagd met:

      a. € 1,82 als sprake is van een eenpersoonshuishouden;

      b. € 2,27 als sprake is van een eenpersoonsouderenhuishouden;

      c. € 3,63 als sprake is van een meerpersoonshuishouden en

      d. € 4,54 als sprake is van een meerpersoonsouderenhuishouden.

      5 De in het eerste en tweede lid genoemde bedragen worden met ingang van 1 januari van elk jaar gewijzigd
      overeenkomstig [artikel 27][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel27
