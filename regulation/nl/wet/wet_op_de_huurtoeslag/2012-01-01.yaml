  - number: '56'
    text: |-
      Indien artikel I, onder B en C, van het bij koninklijke boodschap van 26 juni 1995 ingediende voorstel van wet
      tot wijziging van de Vreemdelingenwet en enige andere wetten teneinde de aanspraak van vreemdelingen jegens
      bestuursorganen op verstrekkingen, voorzieningen, uitkeringen, ontheffingen en vergunningen te koppelen aan het
      rechtmatig verblijf van de vreemdeling in Nederland (*kamerstukken* 24 233) tot wet wordt verheven en in werking
      treedt:

      a. met ingang van 1 juli van enig jaar, treedt artikel 10 in werking met ingang van die datum;

      b. met ingang van een andere datum dan 1 juli, treedt artikel 10 in werking met ingang van de 1 juli die volgt op
      die datum.
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel56
  - number: 56b
    text: |-
      In afwijking van artikel 13, eerste lid, onderdeel a, aanhef, onderscheidenlijk onderdeel
      b, van de Huursubsidiewet, zoals die luidden na het tijdstip van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ____ (Stb. 61), luiden de daarin genoemde bedragen voor het tijdvak dat loopt van 1 juli 2003 tot en met 30 juni
      2004: € 585,24 onderscheidenlijk € 317,03.


      [ref1]: https://wetten.overheid.nl/BWBR0016332#ArtikelI
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0016332
        artikel: I
  - number: '57'
    text: |-
      1 Onze Minister brengt jaarlijks verslag uit aan de Staten-Generaal over de werking van deze wet.

      2 Onverminderd het bepaalde in het eerste lid zendt Onze Minister binnen drie jaar na de inwerkingtreding van deze
      wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel57
  - number: '58'
    text: |-
      1 Deze wet treedt in werking met ingang van 1 juli van een bij koninklijk besluit te bepalen jaar, met uitzondering
      van artikel 4, eerste lid, dat zes maanden later in werking treedt, en met uitzondering van artikel 10, dat in
      werking treedt op het tijdstip, bedoeld in artikel 56.

      2 In afwijking van het eerste lid treden de artikelen 39, 40, 44 en 45 in werking met ingang van de 1 juli die
      volgt op het bij koninklijk besluit bepaalde jaar, bedoeld in het eerste lid.

      3 Met ingang van de dag van inwerkingtreding van deze wet worden de daarin voorkomende bedragen aangepast
      overeenkomstig artikel 27, met als uitgangspunt dat de laatste aanpassing daarvan per 1 juli 1997 heeft
      plaatsgevonden.

      4 Het derde lid blijft buiten toepassing als deze wet met ingang van 1 juli 1997 in werking treedt.
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel58
  - number: '59'
    text: 'Deze wet wordt aangehaald als: Wet op de huurtoeslag.'
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel59
