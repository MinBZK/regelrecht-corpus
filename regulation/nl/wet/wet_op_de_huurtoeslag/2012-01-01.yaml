preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet individuele huursubsidie te herzien, ter
    matiging van de huurlasten van huishoudens met lagere inkomens, ter vereenvoudiging van de wettelijke bepalingen,
    alsmede ter vergroting van de doelmatigheid van de huursubsidieverstrekking;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de bepalingen die daarop berusten wordt verstaan onder:

      a. burgemeester en wethouders: burgemeester en wethouders van de gemeente waar de woning is gelegen waarop de
      huurtoeslag betrekking heeft;

      b. huurcommissie: de huurcommissie, bedoeld in
      [artikel 3a, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref1];

      c. huurder: persoon die zijn hoofdverblijf heeft in:

      1º. een door hem gehuurde woning, daaronder begrepen een woonwagen, tenzij de overeenkomst van huur en verhuur een
      gebruik van de woning betreft dat naar zijn aard slechts van korte duur is; of

      2º. een krachtens de [Huisvestingswet][ref2] gevorderde en toegewezen woning.

      d. huurprijs: de prijs die bij huur en verhuur is verschuldigd voor het enkele gebruik van een woning;

      e. huurtoeslag: een tegemoetkoming van het Rijk als bedoeld in
      [artikel 2, eerste lid, onderdeel h, van de Algemene wet inkomensafhankelijke regelingen][ref3] in de kosten van
      het huren van een woning;

      f. onderhuurder: persoon als bedoeld in
      [artikel 2, eerste lid, onderdeel e, onder 2°, van de Algemene wet inkomensafhankelijke regelingen][ref4];

      g. Onze Minister: Onze Minister voor Wonen, Wijken en Integratie;

      h. rekenhuur: de rekenhuur, bedoeld in [artikel 5][ref5];

      i. rekeninkomen: de gezamenlijke toetsingsinkomens, bedoeld in
      [artikel 8 van de Algemene wet inkomensafhankelijke regelingen][ref6], die in aanmerking worden genomen voor het
      bepalen van de draagkracht, bedoeld in [artikel 7 van die wet][ref7];

      j. woning: een gebouwde onroerende zaak voor zover deze als zelfstandige woonruimte, onvrije etage dan wel andere
      onzelfstandige woonruimte is verhuurd, alsmede de onroerende aanhorigheden;

      k. woonwagen: een woonwagen als bedoeld in [artikel 1, eerste lid, onder f, van de Huisvestingswet][ref8], zonder
      eigen aandrijving.


