  - number: '2'
    text: |-
      In deze wet en de bepalingen die daarop berusten wordt verstaan onder:

      a. eenpersoonshuishouden: het huishouden van een huurder die, afgezien van een eventuele onderhuurder en de tot het
      huishouden van de onderhuurder behorende personen, als enige een woning bewoont, en die jonger dan 65 jaar is op 1
      januari van het berekeningsjaar;

      b. meerpersoonshuishouden: het huishouden van een huurder die samen met diens partner of een of meer medebewoners
      een woning bewoont, als het aandeel in het rekeninkomen, afkomstig van personen die op 1 januari van het
      berekeningsjaar 65 jaar of ouder zijn, de helft of minder bedraagt;

      c. eenpersoonsouderenhuishouden: het huishouden van een huurder die, afgezien van een eventuele onderhuurder en de
      tot het huishouden van de onderhuurder behorende personen, als enige een woning bewoont, en die 65 jaar of ouder is
      op 1 januari van het berekeningsjaar;

      d. meerpersoonsouderenhuishouden: het huishouden van een huurder die samen met diens partner of een of meer
      medebewoners een woning bewoont, als het aandeel in het rekeninkomen, afkomstig van personen die op 1 januari van
      het berekeningsjaar 65 jaar of ouder zijn, meer dan de helft bedraagt.
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel2
  - number: '5'
    text: |-
      1 In deze wet en de bepalingen die daarop berusten wordt verstaan onder rekenhuur: de huurprijs die
      de huurder per maand is verschuldigd, of, als dat lager is dan de huurprijs, een bedrag dat gelijk
      is aan de maximale huurprijsgrens, bedoeld in de krachtens de [artikelen 10, eerste lid][ref1], en
      [12, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref2] daarover gestelde regels, vermeerderd met:

      a. een bedrag voor door de huurder verschuldigde servicekosten, en

      b. in geval van huur van een woonwagen het bedrag dat verschuldigd is voor de huur van de standplaats.

      2 Bij de toepassing van het eerste lid kan het in de aanhef van dat lid laatstbedoelde bedrag slechts in plaats
      van de verschuldigde huurprijs in aanmerking worden genomen nadat, op verzoek van de Belastingdienst/Toeslagen,
      de huurcommissie, dan wel de voorzitter van de huurcommissie, aan de Belastingdienst/Toeslagen en aan de huurder
      advies heeft uitgebracht, dan wel een verklaring heeft verstrekt, over de redelijk te achten huurprijs. Bij
      algemene maatregel van bestuur kunnen omtrent die verklaring nadere regels worden gesteld.

      3 Als servicekosten als bedoeld in het eerste lid, onderdeel a, worden uitsluitend in aanmerking genomen:

      a. kosten voor het in bedrijf zijn van lift-, ventilatie-, hydrofoor- en alarminstallaties, en van verlichting van
      door de huurder met anderen gemeenschappelijk gebruikte ruimten, met een maximum van € 12 per maand;

      b. schoonmaakkosten van de lift en andere gemeenschappelijke ruimten, met een maximum van € 12 per maand;

      c. de kosten voor de diensten van een huismeester, met een maximum van € 12 per maand;

      d. kapitaals- en onderhoudskosten van dienstruimten en gemeenschappelijke recreatieruimten, met een maximum van €
      12 per maand.


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel12
