  - number: '14'
    text: |-
      1 Het norminkomen bedraagt:

      a. € 22 025 bij een eenpersoonshuishouden;

      b. € 29 900 bij een meerpersoonshuishouden;

      c. € 19 605,36 bij een eenpersoonsouderenhuishouden;

      d. € 25 952,71 bij een meerpersoonsouderenhuishouden.

      2 Het norminkomen, genoemd in het eerste lid, onderdelen c en d,
      wordt vermeerderd met het bedrag van de tegemoetkoming, bedoeld in
      [artikel 3 van de Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen][ref1], per kalenderjaar,
      zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, onderscheidenlijk twee maal dat
      bedrag, en verder vermeerderd met € 665 onderscheidenlijk € 1 462.

      3 Geen huurtoeslag wordt toegekend als het rekeninkomen meer bedraagt dan:

      a. het norminkomen, bedoeld in het eerste lid, onderdelen a of b, of

      b. de som van de bedragen, genoemd in het eerste lid, onderdelen c of d, en bedoeld in het tweede lid.

      4 De in het eerste lid genoemde bedragen worden met ingang van 1 januari van elk jaar gewijzigd overeenkomstig
      [artikel 27][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel27
