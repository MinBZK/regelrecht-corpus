  - number: '17'
    text: |-
      1 Het minimum-inkomensijkpunt wordt verkregen door:

      a. voor een eenpersoonshuishouden: de uitkomst van 81% van het twaalfvoud
      van het voor de maand januari van het berekeningsjaar geldende in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1] bedoelde bedrag per
      maand, zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden:

      1°. te verminderen met het werknemersaandeel in de premie, bedoeld in
      [artikel 25, tweede lid, van de Wet financiering sociale verzekeringen][ref2];

      2°. te vermeerderen met de vergoeding ingevolge [artikel 46, eerste lid, van de Zorgverzekeringswet][ref3] over dat
      bedrag, en

      3°. te vermeerderen met € 572;

      b. voor een meerpersoonshuishouden: de uitkomst van 108% van het twaalfvoud van het bedrag per maand, bedoeld in
      onderdeel a, aanhef, zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, te verminderen
      overeenkomstig onderdeel a, onder 1°, te vermeerderen overeenkomstig onderdeel a, onder 2°, en te vermeerderen met
      € 144;

      c. voor een eenpersoonsouderenhuishouden: de uitkomst van het bedrag van het bruto-ouderdomspensioen voor de
      pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder a, van de Algemene Ouderdomswet][ref4], zoals dat
      bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, vermeerderd met het bedrag van de bruto-
      vakantie-uitkering, vastgesteld overeenkomstig [artikel 29, eerste lid, aanhef en onder b, van die wet][ref5],
      zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, en de tegemoetkoming, bedoeld in
      [artikel 3 van de Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen][ref6], per kalenderjaar,
      zoals die tegemoetkoming naar redelijke verwachting in het berekeningsjaar zal luiden, te herrekenen naar een
      jaarinkomen in het berekeningsjaar en dat jaarinkomen te vermeerderen met € 2 340;

      d. voor een meerpersoonsouderenhuishouden: de uitkomst van twee maal het bedrag van het bruto-ouderdomspensioen
      voor de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder b, van de Algemene Ouderdomswet][ref7], zoals
      dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, vermeerderd met het bedrag van de bruto-
      vakantie-uitkering, vastgesteld overeenkomstig [artikel 29, eerste lid, aanhef en onder c, van die wet][ref8],
      zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, en twee maal de tegemoetkoming,
      bedoeld in [artikel 3 van de Wet mogelijkheid koopkrachttegemoetkoming oudere belastingplichtigen][ref9], per
      kalenderjaar, zoals die tegemoetkoming naar redelijke verwachting in het berekeningsjaar zal luiden, te herrekenen
      naar een jaarinkomen in het berekeningsjaar en dat jaarinkomen te vermeerderen met € 2 512.

      2 Bij het minimum-inkomensijkpunt behoort een normhuur van € 196,86.

      3 De normhuur, bedoeld in het tweede lid, wordt verlaagd met:

      a. € 1,82 als sprake is van een eenpersoonsouderenhuishouden, en

      b. € 3,63 als sprake is van een meerpersoonsouderenhuishouden.

      4 Het in het tweede lid genoemde bedrag wordt met ingang van 1 januari van elk jaar gewijzigd overeenkomstig
      [artikel 27][ref10].


