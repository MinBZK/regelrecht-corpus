  - number: '7'
    text: |-
      1 Het recht op en de hoogte van de huurtoeslag is afhankelijk van de draagkracht, waaronder begrepen het vermogen,
      van de huurder, diens partner en de medebewoners.

      2 Ten aanzien van een bepaalde woning kan slechts aan één huurder een huurtoeslag worden toegekend.
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel7
  - number: '8'
    text: Een huurtoeslag wordt slechts toegekend aan een huurder die meerderjarig is.
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel8
  - number: '9'
    text: |-
      1 Een huurtoeslag wordt slechts toegekend:

      a. als de huurder, diens partner alsmede degenen die medebewoner van de woning zijn, op het adres van die woning
      zijn ingeschreven in de gemeentelijke basisadministratie persoonsgegevens;

      b. als op dat adres geen andere personen staan ingeschreven in de gemeentelijke basisadministratie
      persoonsgegevens, behoudens eventueel een onderhuurder en personen die behoren tot diens huishouden.

      2 In afwijking van het eerste lid kan een huurtoeslag worden toegekend, als de onjuiste inschrijving in de
      gemeentelijke basisadministratie persoonsgegevens niet aan de huurder kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel9
  - number: '11'
    text: |-
      1 Een huurtoeslag wordt slechts toegekend voor de huur van een woning die:

      a. een zelfstandige woonruimte of een onvrije etage is, of

      b. een onzelfstandige woonruimte is, welke deel uitmaakt van een woongebouw of woning, geheel of gedeeltelijk
      verhuurd ten behoeve van begeleid wonen, groepswonen door ouderen of een daarmee vergelijkbare woonvorm, en in
      eigendom van en aan de huurder verhuurd door een rechtspersoon zonder winstoogmerk, die mede op het gebied van de
      volkshuisvesting werkzaam is.

      2 Het eerste lid onder b vindt slechts toepassing als de onzelfstandige woonruimte deel uitmaakt van een
      woongebouw of woning, die door de Belastingdienst/Toeslagen is aangewezen. Bij algemene maatregel van bestuur
      kunnen terzake nadere regels worden gesteld, waarbij een lagere maximale rekenhuur kan worden vastgesteld dan uit
      [artikel 13][ref1] voortvloeit.

      3 Voor de huur van een woonwagen wordt slechts een huurtoeslag toegekend, indien deze:

      a. is geplaatst op een standplaats als bedoeld in [artikel 1, eerste lid onder e, van de Huisvestingswet][ref2], of
      op een regionaal woonwagencentrum dat tot stand is gekomen voor 1 oktober 1970, en

      b. voldoet aan de eisen, daaraan gesteld krachtens de [Woningwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0005674#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005181
