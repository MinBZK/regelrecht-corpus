  - number: 1a
    text: |-
      1 Op deze wet is de [Algemene wet inkomensafhankelijke regelingen][ref1], met uitzondering van
      [artikel 6, eerste en tweede lid][ref2], van toepassing.

      2 De uitvoering van het toekennen, uitbetalen en terugvorderen van een huurtoeslag is opgedragen aan de
      Belastingdienst/Toeslagen.

      3 In afwijking van [artikel 3, eerste lid, onder a, van de Algemene wet inkomensafhankelijke regelingen][ref3]
      wordt in deze wet en de daarop berustende bepalingen de niet duurzaam gescheiden levende echtgenoot en
      geregistreerde partner uitsluitend als partner aangemerkt indien deze in de gemeentelijke basisadministratie
      persoonsgegevens op het adres van de huurder staat ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel6
