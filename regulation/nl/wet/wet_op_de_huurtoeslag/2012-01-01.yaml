  - number: '20'
    text: |-
      1 De kwaliteitskortingsgrens is € 366,37 per maand.

      2 De aftoppingsgrens is:

      a. € 524,37 per maand als het huishouden van de huurder, afgezien van eventuele onderhuurders en personen die tot
      diens huishouden behoren, uit één of twee personen bestaat;

      b. € 561,98 per maand als het huishouden van de huurder, afgezien van eventuele onderhuurders en personen die tot
      diens huishouden behoren, uit drie of meer personen bestaat.

      3 De in het eerste en tweede lid genoemde bedragen worden met ingang van 1 januari van elk jaar gewijzigd
      overeenkomstig [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '21'
    text: |-
      1 De hoogte van de huurtoeslag wordt als volgt bepaald:

      a. het deel van de rekenhuur boven de basishuur tot aan de kwaliteitskortingsgrens wordt voor 100 procent
      gesubsidieerd;

      b. het deel van de rekenhuur boven de kwaliteitskortingsgrens tot aan de aftoppingsgrens wordt voor een bij
      algemene maatregel van bestuur vast te stellen percentage gesubsidieerd;

      c. het deel van de rekenhuur boven de aftoppingsgrens wordt voor een bij algemene maatregel van bestuur vast te
      stellen percentage gesubsidieerd:

      1º. als de huurder, diens partner of één van de medebewoners 65 jaar of ouder is;

      2º. als het een eenpersoonshuishouden betreft, of

      3º. als de huurder een woning bewoont of betrekt waarin aanpassingen zijn aangebracht in en rond de woning, die
      noodzakelijk zijn in verband met een handicap van de huurder, diens partner of een medebewoner.

      2 In afwijking van het eerste lid, onderdelen a en b, wordt, als de basishuur op of boven de
      kwaliteitskortingsgrens ligt, het deel van de rekenhuur boven de basishuur tot aan de aftoppingsgrens voor het
      percentage, bedoeld in het eerste lid, onderdeel b, gesubsidieerd.
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel21
  - number: '23'
    text: |-
      Bij verhuizing van de huurder blijft het in [artikel 7, eerste lid][ref1], bedoelde recht op huurtoeslag in stand,
      mits hij de woning naar welke hij verhuist huurt en vervolgens bewoont en ook overigens aan de voorwaarden voor
      verkrijging van huurtoeslag wordt voldaan. [Artikel 5, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel7
