  - number: '19'
    text: |-
      1 Voor elk rekeninkomen onder of gelijk aan het minimum-inkomensijkpunt, bedoeld in [artikel 17][ref1], geldt de
      normhuur, bedoeld in artikel 17, tweede en derde lid.

      2 Voor elk rekeninkomen boven het minimum-inkomensijkpunt is, per type huishouden als bedoeld in [artikel 2][ref2],
      de hoogte van de normhuur de uitkomst van de formule:

      (a x Y2) + (b x Y)

      in welke formule voorstelt:

      a en b: de factoren, vast te stellen bij ministeriële regeling, die, per type huishouden, worden afgeleid uit
      de lineaire relatie tussen de bij het minimum-inkomensijkpunt behorende normhuurquote en de bij het referentie-
      inkomensijkpunt behorende normhuurquote;

      Y: het rekeninkomen.

      3 De overeenkomstig het tweede lid berekende normhuur wordt naar boven afgerond op hele eurocenten.

      4 Bij ministeriële regeling worden met ingang van 1 januari van elk jaar de factoren, bedoeld in het tweede lid,
      gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel2
    url: https://wetten.overheid.nl/BWBR0008659/2012-01-01#Artikel19
