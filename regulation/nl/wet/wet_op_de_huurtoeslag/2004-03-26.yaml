preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet individuele huursubsidie te herzien, ter
    matiging van de huurlasten van huishoudens met lagere inkomens, ter vereenvoudiging van de wettelijke bepalingen,
    alsmede ter vergroting van de doelmatigheid van de huursubsidieverstrekking;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de bepalingen die daarop berusten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.a
    text: 'beperkt huursubsidiebericht: een schriftelijke kennisgeving van Onze Minister aan een huurder met gegevens over:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.a.1º
    text: samenstelling van het huishouden, inkomen en vermogen;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.a.2º
    text: samenstelling van het huishouden en huurprijs, of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.a.3º
    text: samenstelling van het huishouden.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.b
    text: |-
      burgemeester en wethouders: burgemeester en wethouders van de gemeente waar de woning gelegen is waarop de
      huursubsidie of de bijzondere bijdrage in de huurlasten, bedoeld in [artikel 26b][ref1], betrekking heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26b
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 26b
        hoofdstuk: 4A
  - number: 1.c
    text: |-
      huurcommissie: de huurcommissie, bedoeld in [artikel 21 van de Uitvoeringswet huurprijzen woonruimte][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel21
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '21'
  - number: 1.d
    text: 'huurder: persoon die zijn hoofdverblijf heeft in:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.d.1°
    text: |-
      een door hem gehuurde woning, daaronder begrepen een woonwagen, tenzij de overeenkomst van huur en verhuur een
      gebruik van de woning betreft dat naar zijn aard slechts van korte duur is; of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.d.2°
    text: |-
      een krachtens de [Huisvestingswet][ref1] gevorderde en toegewezen woning;


      [ref1]: https://wetten.overheid.nl/BWBR0005674
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005674
  - number: 1.e
    text: 'huurprijs: de prijs die bij huur en verhuur is verschuldigd voor het enkele gebruik van een woning;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.f
    text: |-
      huursubsidie: een financiële bijdrage krachtens deze wet, met uitzondering van [artikel 26b][ref1], ter
      tegemoetkoming in de kosten van het huren van een woning;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26b
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 26b
        hoofdstuk: 4A
  - number: 1.g
    text: |-
      huursubsidiebericht: een schriftelijke kennisgeving van Onze Minister aan een huurder met gegevens over
      samenstelling van het huishouden, huurprijs, inkomen, vermogen en op basis van die gegevens berekende huursubsidie;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.h
    text: |-
      medebewoner: persoon die zijn hoofdverblijf heeft op hetzelfde adres als de huurder, en die geen onderhuurder is
      noch tot het huishouden van de onderhuurder behoort;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.i
    text: |-
      onderhuurder: persoon aan wie de huurder, op basis van een schriftelijke overeenkomst, een deel van de woning heeft
      verhuurd en die niet is de echtgenoot of geregistreerde partner van de huurder, of een bloed- of aanverwant in de
      eerste graad van de huurder of van zijn echtgenoot of geregistreerde partner;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.j
    text: 'Onze Minister: Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.k
    text: 'peildatum:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.k.1º
    text: |-
      als de huurder een aanvraag als bedoeld in [artikel 28, eerste lid][ref1], heeft ingediend: de eerste dag van de
      kalendermaand volgend op die waarin die aanvraag is ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel28
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '28'
        hoofdstuk: '6'
  - number: 1.k.2º
    text: |-
      als, in andere gevallen dan bedoeld onder 1°, aan de huurder een beperkt huursubsidiebericht of huursubsidiebericht
      is toegezonden: de eerste dag van het subsidietijdvak;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.l
    text: 'peiljaar: het kalenderjaar dat voorafgaat aan het subsidiejaar;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.m
    text: |-
      rekenhuur, rekeninkomen, rekenvermogen: de rekenhuur, het rekeninkomen, en het rekenvermogen, bedoeld in
      [artikel 5][ref1], [artikel 3][ref2] onderscheidenlijk [artikel 4][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel4
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.n
    text: 'subsidiejaar: het tijdvak dat loopt van 1 juli tot en met 30 juni van het daaropvolgende jaar;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.o
    text: 'subsidietijdvak:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
  - number: 1.o.1º
    text: |-
      het subsidiejaar, als de huurder in het daaraan voorafgaande subsidiejaar huursubsidie heeft ontvangen dan wel in
      de maand juni voorafgaand aan dat subsidiejaar een aanvraag als bedoeld in [artikel 28, eerste lid][ref1], heeft
      ingediend;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel28
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '28'
        hoofdstuk: '6'
  - number: 1.o.2º
    text: |-
      de resterende volle kalendermaanden van het subsidiejaar, als de huurder in een andere maand dan de maand juni een
      aanvraag als bedoeld in [artikel 28, eerste lid][ref1], heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel28
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '28'
        hoofdstuk: '6'
  - number: 1.p
    text: |-
      woonwagen: een woonwagen als bedoeld in [artikel 1, eerste lid onder e, van de Woningwet][ref1], zonder eigen
      aandrijving.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel1
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '1'
  - number: 1a.1
    text: |-
      In deze wet en de bepalingen die daarop berusten wordt onder het gecorrigeerde verzamelinkomen verstaan: het
      verzamelinkomen, bedoeld in [artikel 2.18 van de Wet inkomstenbelasting 2001][ref1], verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '2'
  - number: 1a.1.a
    text: |-
      indien in het peiljaar de zelfstandigenaftrek, bedoeld in [artikel 3.76 van de Wet inkomstenbelasting 2001][ref1],
      is toegepast: € 1 355;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 1a.1.b
    text: |-
      indien in het peiljaar loon wordt genoten: het hoogste van de uit de toepassing van de volgende onderdelen
      voortvloeiende bedragen:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.1.b.1°
    text: 'bij loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119 en niet meer dan € 1 605;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.1.b.2°
    text: 'bij loon uit vroegere dienstbetrekking: € 487;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.1.c
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen kosten van woon-werkverkeer (reiskostenforfait),
      maar niet meer dan € 939;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.1.d
    text: |-
      indien in het kalenderjaar 2000 loon uit dienstbetrekking wordt genoten: het bedrag van de in dat jaar in
      aanmerking genomen aftrekbare kosten terzake van inkomsten uit arbeid andere dan kosten van woon-werkverkeer, na
      toepassing van artikel 37, tweede lid, van de Wet op de inkomstenbelasting 1964, verminderd met 12% van het loon
      uit tegenwoordige dienstbetrekking in dat jaar, maar met niet minder dan € 119 en met niet meer dan € 1 605;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.1.e
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen renten van schulden, kosten van geldleningen
      daaronder begrepen, bedoeld in [artikel 45, eerste lid, onderdeel f, van de Wet op de inkomstenbelasting 1964]
      (onbekend);
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.1.f
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen premies voor lijfrenten, maar niet meer dan
      € 2 804, verminderd met € 1 036, maar niet verder dan tot nihil; indien bij de echtgenoot van degene van wie het
      gecorrigeerd verzamelinkomen wordt berekend geen premies voor lijfrenten in aanmerking genomen zijn, worden de
      bedragen van € 2 804 en € 1 036 verhoogd tot € 5 608 respectievelijk € 2 072;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.1.g
    text: |-
      het bedrag van de in het kalenderjaar 2000 in aanmerking genomen uitgaven tot voorziening in het levensonderhoud
      van kinderen en pleegkinderen van 27 jaar en ouder, alsmede andere bloed- en aanverwanten in de rechte lijn of
      in de tweede graad van de zijlijn, bedoeld in artikel 46, eerste lid, onderdeel a, onder 2°, van de Wet op de
      inkomstenbelasting 1964.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.2
    text: |-
      In het eerste lid wordt onder loon verstaan loon in de zin van de [Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0011353
  - number: 1a.3
    text: |-
      In deze wet en de bepalingen die daarop berusten wordt onder het gecorrigeerde belastbare loon verstaan: het
      belastbare loon, bedoeld in [artikel 9 van de Wet op de loonbelasting 1964][ref1], verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel9
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '9'
  - number: 1a.3.a
    text: 'het hoogste van de uit de toepassing van de volgende onderdelen voortvloeiende bedragen:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.3.a.1°
    text: 'bij loon uit tegenwoordige dienstbetrekking: 12% van dat loon, maar niet minder dan € 119 en niet meer dan € 1 605;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.3.a.2°
    text: 'bij loon uit vroegere dienstbetrekking: € 487;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.3.b
    text: de bedragen, bedoeld in het eerste lid, onderdelen c tot en met g.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.4
    text: |-
      De in het eerste lid, onderdelen c tot en met g, en derde lid, onderdeel b, bedoelde correctieposten worden
      over het peiljaar 2001 voor het geheel in aanmerking genomen, over het peiljaar 2002 voor 2/3 deel en over het
      peiljaar 2003 voor 1/3 deel. Over het peiljaar 2004 en volgende peiljaren worden deze correctieposten niet meer in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.5
    text: 'Met loon uit tegenwoordige dienstbetrekking wordt gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.5.a
    text: |-
      loon genoten wegens tijdelijke arbeidsongeschiktheid, anders dan
      ingevolge de [Wet op de arbeidsongeschiktheidsverzekering][ref1], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2] behoudens uitkeringen in verband met bevalling, en de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0002524
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
  - number: 1a.5.b
    text: |-
      loon in de vorm van uitkeringen ingevolge de Wet financiering loopbaanonderbreking en aanvullingen daarop door
      degene tot wie de belastingplichtige in dienstbetrekking staat.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.6
    text: |-
      De inspecteur, onder wie de huurder of de medebewoners krachtens [artikel 3, tweede lid, van de Algemene wet
      inzake rijksbelastingen](onbekend) ressorteren voor de heffing van de inkomstenbelasting, bepaalt op verzoek
      van Onze Minister het gecorrigeerde verzamelinkomen of het gecorrigeerde belastbare loon in het peiljaar van de
      desbetreffende huurder of medebewoners.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: 1a.7
    text: |-
      De in het zesde lid bedoelde inspecteur verstrekt de gegevens inzake het gecorrigeerde verzamelinkomen aan Onze
      Minister volgens bij of krachtens algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel1a
  - number: '2'
    text: 'In deze wet en de bepalingen die daarop berusten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel2
  - number: 2.a
    text: |-
      eenpersoonshuishouden: het huishouden van een huurder die, afgezien van een eventuele onderhuurder en de tot het
      huishouden van de onderhuurder behorende personen, als enige een woning bewoont, en die jonger dan 65 jaar was op 1
      januari van het peiljaar;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel2
  - number: 2.b
    text: |-
      meerpersoonshuishouden: het huishouden van een huurder die samen met een of meer medebewoners een woning bewoont,
      als het aandeel in het rekeninkomen, afkomstig van personen die op 1 januari van het peiljaar 65 jaar of ouder
      waren, de helft of minder bedraagt;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel2
  - number: 2.c
    text: |-
      eenpersoonsouderenhuishouden: het huishouden van een huurder die, afgezien van een eventuele onderhuurder en de tot
      het huishouden van de onderhuurder behorende personen, als enige een woning bewoont, en die 65 jaar of ouder was op
      1 januari van het peiljaar;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel2
  - number: 2.d
    text: |-
      meerpersoonsouderenhuishouden: het huishouden van een huurder die samen met een of meer medebewoners een woning
      bewoont, als het aandeel in het rekeninkomen, afkomstig van personen die op 1 januari van het peiljaar 65 jaar of
      ouder waren, meer dan de helft bedraagt.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel2
  - number: '3.1'
    text: |-
      In deze wet en de bepalingen die daarop berusten wordt verstaan onder rekeninkomen: het gezamenlijk inkomen van de
      huurder en de medebewoners in het peiljaar.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel3
  - number: '3.2'
    text: 'Bij de bepaling van het gezamenlijk inkomen:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel3
  - number: 3.2.a
    text: wordt elk persoonlijk inkomen dat negatief is op nul gesteld;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel3
  - number: 3.2.b
    text: |-
      wordt het inkomen van een inwonend kind of pleegkind van de huurder of een medebewoner, dat op de peildatum jonger
      dan 23 jaar is, slechts in beschouwing genomen voor zover het meer dan € 4100 bedraagt.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel3
  - number: '3.3'
    text: 'In deze wet en de bepalingen die daarop berusten wordt onder inkomen verstaan:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel3
  - number: 3.3.a
    text: |-
      als over het peiljaar een aanslag inkomstenbelasting is of wordt vastgesteld: het gecorrigeerde verzamelinkomen,
      over het peiljaar;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel3
  - number: 3.3.b
    text: 'in een ander geval dan bedoeld onder a: het gecorrigeerde belastbare loon over het peiljaar.'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel3
  - number: '3.4'
    text: |-
      Inkomen dat in het buitenland wordt belast, dan wel is vrijgesteld van belasting op grond van bepalingen van
      internationaal recht, wordt mede in aanmerking genomen als ware dit aan de Nederlandse belastingwetgeving
      onderworpen.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel3
  - number: '4.1'
    text: |-
      In deze wet en de bepalingen die daarop berusten wordt verstaan onder rekenvermogen: het gezamenlijk vermogen van
      de huurder en de medebewoners in het peiljaar.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel4
  - number: '4.2'
    text: |-
      Bij de bepaling van het gezamenlijk vermogen wordt het vermogen van een inwonend kind of pleegkind van de huurder
      of een medebewoner, dat op de peildatum jonger dan 23 jaar is, slechts in beschouwing genomen voor zover het meer
      dan € 925 bedraagt.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel4
  - number: '4.3'
    text: |-
      Onder vermogen wordt verstaan: de gemiddelde rendementsgrondslag, bedoeld in
      [artikel 5.2 van de Wet inkomstenbelasting 2001][ref1], met dien verstande dat die grondslag wordt bepaald zonder
      rekening te houden met de vrijstelling maatschappelijke beleggingen, bedoeld in [afdeling 5.3 van die wet][ref2] en
      de vrijstelling beleggingen in durfkapitaal, bedoeld in [afdeling 5.3a van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.3
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Afdeling5.3
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0011353
        afdeling: '5.3'
      - id: ref3
        bwb_id: BWBR0011353
        afdeling: '5.3'
  - number: '5.1'
    text: |-
      In deze wet en de bepalingen die daarop berusten wordt verstaan onder rekenhuur: de huurprijs die de
      huurder op de peildatum per maand is verschuldigd, of, als dat lager is dan de huurprijs, een bedrag dat
      gelijk is aan de maximale huurprijsgrens, bedoeld in de krachtens de [artikelen 10, eerste lid][ref1], en
      [12, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref2] daarover gestelde regels


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel12
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '12'
  - number: 5.1.a
    text: verminderd met het bedrag dat daarin is begrepen voor een bedrijfsruimte die tot de woning behoort,
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
  - number: 5.1.b
    text: verminderd met € 22 per maand voor een garage die bij de woning behoort,
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
  - number: 5.1.c
    text: vermeerderd met een bedrag voor door de huurder verschuldigde servicekosten, en
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
  - number: 5.1.d
    text: |-
      in geval van huur van een woonwagen vermeerderd met het bedrag dat verschuldigd is voor de huur van de standplaats,
      verminderd met het bedrag dat daarin is begrepen voor een bedrijfsruimte.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
  - number: '5.2'
    text: |-
      Bij de toepassing van het eerste lid kan het in de aanhef van dat lid laatstbedoelde bedrag slechts in plaats
      van de verschuldigde huurprijs in aanmerking worden genomen nadat de huurcommissie, dan wel de voorzitter van
      de huurcommissie, aan Onze Minister en aan de huurder advies heeft uitgebracht, dan wel een verklaring heeft
      verstrekt, over de redelijk te achten huurprijs. Bij algemene maatregel van bestuur kunnen omtrent die verklaring
      nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
  - number: '5.3'
    text: 'Als servicekosten als bedoeld in het eerste lid, onder c, worden uitsluitend in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
  - number: 5.3.a
    text: |-
      kosten voor het in bedrijf zijn van lift-, ventilatie-, hydrofoor- en alarminstallaties, en van verlichting van
      door de huurder met anderen gemeenschappelijk gebruikte ruimten, met een maximum van € 12 per maand;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
  - number: 5.3.b
    text: schoonmaakkosten van de lift en andere gemeenschappelijke ruimten, met een maximum van € 12 per maand;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
  - number: 5.3.c
    text: de kosten voor de diensten van een huismeester, met een maximum van € 12 per maand;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
  - number: 5.3.d
    text: |-
      kapitaals- en onderhoudskosten van dienstruimten en gemeenschappelijke recreatieruimten, met een maximum van € 12
      per maand.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
  - number: '5.4'
    text: |-
      Als de huurder een deel van de woning heeft verhuurd, geldt als rekenhuur het bedrag, berekend overeenkomstig de
      voorgaande leden, verminderd met een bedrag dat evenredig is met het gedeelte van de woning dat is onderverhuurd.
      Bij ministeriële regeling kunnen hieromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel5
  - number: '7.1'
    text: |-
      Als aan de navolgende bepalingen wordt voldaan, kent Onze Minister ambtshalve of op aanvraag aan een huurder
      huursubsidie toe over het subsidietijdvak.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel7
  - number: '7.2'
    text: Ten aanzien van een bepaalde woning kan slechts aan één huurder huursubsidie worden toegekend.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel7
  - number: '7.3'
    text: |-
      [Titel 4.2 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op het verstrekken van huursubsidie
      krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '8'
    text: Huursubsidie wordt slechts toegekend aan een huurder die op de peildatum meerderjarig is.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel8
  - number: '9.1'
    text: 'Huursubsidie wordt slechts toegekend:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel9
  - number: 9.1.a
    text: |-
      als de huurder, alsmede degenen die op de peildatum medebewoner of onderhuurder van de woning zijn, zich
      uiterlijk vijf dagen na de peildatum op het adres van die woning hebben doen inschrijven in de gemeentelijke
      basisadministratie persoonsgegevens;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel9
  - number: 9.1.b
    text: |-
      als op de peildatum op dat adres geen andere personen staan ingeschreven in de gemeentelijke basisadministratie
      persoonsgegevens, behoudens eventueel personen die behoren tot het huishouden van de onderhuurder.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid kan huursubsidie worden toegekend, als de onjuiste inschrijving in de gemeentelijke
      basisadministratie persoonsgegevens niet aan de huurder kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel9
  - number: '9.3'
    text: |-
      Onverminderd het bepaalde in het tweede lid wordt, als eerst met ingang van een later tijdstip aan de in het eerste
      lid gestelde inschrijvingsvoorwaarden wordt voldaan, de huursubsidie toegekend met ingang van de eerstvolgende
      kalendermaand waarin aan die voorwaarden wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel9
  - number: '10'
    text: 'Huursubsidie wordt slechts toegekend:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel10
  - number: 10.a
    text: 'als de huurder:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel10
  - number: 10.a.1°
    text: de Nederlandse nationaliteit bezit of op grond van een wettelijke bepaling als Nederlander wordt behandeld;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel10
  - number: 10.a.2°
    text: |-
      vreemdeling is en rechtmatig verblijf houdt als bedoeld in
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 10.a.3°
    text: |-
      vreemdeling is en, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onder a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig verblijf houdt als bedoeld
      in [artikel 8, onder g of h, van die wet][ref2] en huursubsidie heeft ontvangen over het subsidietijdvak waarin hij
      voor het laatst rechtmatig verblijf hield, en


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 10.b
    text: 'als degenen die op de peildatum medebewoner van de woning zijn:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel10
  - number: 10.b.1°
    text: de Nederlandse nationaliteit bezitten of op grond van een wettelijke bepaling als Nederlander worden behandeld, of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel10
  - number: 10.b.2°
    text: |-
      vreemdeling zijn en rechtmatig verblijf houden als bedoeld in [artikel 8 van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '11.1'
    text: 'Huursubsidie wordt slechts toegekend voor de huur van een woning die:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel11
  - number: 11.1.a
    text: een zelfstandige woonruimte of een onvrije etage is, of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel11
  - number: 11.1.b
    text: |-
      een onzelfstandige woonruimte is, welke deel uitmaakt van een woongebouw of woning, geheel of gedeeltelijk
      verhuurd ten behoeve van begeleid wonen, groepswonen door ouderen of een daarmee vergelijkbare woonvorm, en in
      eigendom van en aan de huurder verhuurd door een rechtspersoon zonder winstoogmerk, die mede op het gebied van de
      volkshuisvesting werkzaam is.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel11
  - number: '11.2'
    text: |-
      Het eerste lid onder b vindt slechts toepassing als de onzelfstandige woonruimte deel uitmaakt van een woongebouw
      of woning, die door Onze Minister is aangewezen. Bij algemene maatregel van bestuur kunnen terzake nadere
      regels worden gesteld, waarbij een lagere maximale rekenhuur kan worden vastgesteld dan uit [artikel 13][ref1]
      voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '11.3'
    text: Geen huursubsidie wordt toegekend voor de huur van een woonschip.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel11
  - number: '11.4'
    text: 'Voor de huur van een woonwagen wordt slechts huursubsidie toegekend, indien deze op de peildatum:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel11
  - number: 11.4.a
    text: |-
      is geplaatst op een standplaats als bedoeld in [artikel 1, eerste lid onder e, van de Huisvestingswet][ref1], of op
      een regionaal woonwagencentrum dat tot stand is gekomen voor 1 oktober 1970, en


      [ref1]: https://wetten.overheid.nl/BWBR0005674#Artikel1
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005674
        artikel: '1'
  - number: 11.4.b
    text: |-
      voldoet aan de eisen, daaraan gesteld krachtens de [Woningwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005181
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005181
  - number: '12.1'
    text: |-
      Geen huursubsidie wordt toegekend als de huurder van een woning met een rekenhuur boven de aftoppingsgrenzen,
      bedoeld in [artikel 20, tweede lid][ref1], naar het oordeel van Onze Minister, op het tijdstip dat de huur
      ingaat, het gebruik had kunnen krijgen of behouden van een andere woning die beter past bij zijn economische en
      persoonlijke omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel20
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '12.2'
    text: |-
      Alvorens Onze Minister tot toepassing van het eerste lid overgaat, stelt hij burgemeester en wethouders in de
      gelegenheid om binnen vier weken een advies daarover uit te brengen. Op verzoek van burgemeester en wethouders
      wordt die termijn met ten hoogste vier weken verlengd.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel12
  - number: '12.3'
    text: |-
      Onze Minister volgt in zijn besluit het advies van burgemeester en wethouders, behoudens de mogelijkheid tot
      afwijking van een voor de huurder negatief advies in uitzonderlijke gevallen.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel12
  - number: '13.1'
    text: |-
      Geen huursubsidie wordt toegekend als de rekenhuur, vermeerderd met het bedrag dat daarop eventueel krachtens
      [artikel 5, vierde lid][ref1], in mindering wordt gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel5
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 13.1.a
    text: 'hoger is dan EUR 565,44 per maand als:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel13
  - number: 13.1.a.1°
    text: |-
      de huurder of een van de medebewoners op de peildatum 23 jaar of ouder is, dan wel de woning deelt met een kind of
      pleegkind van de huurder of een medebewoner of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel13
  - number: 13.1.a.2°
    text: |-
      de huurder of de medebewoner, ten behoeve van wie in en rond de woning voorzieningen zijn aangebracht die
      noodzakelijk zijn in verband met een handicap van die huurder of die medebewoner, op de peildatum 18 jaar of ouder
      is of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel13
  - number: 13.1.b
    text: hoger is dan EUR 307,49 per maand in andere gevallen dan bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel13
  - number: '13.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel13
  - number: 13.2.a
    text: |-
      als sprake is van overschrijding van een daar genoemd bedrag omdat voorzieningen zijn aangebracht in en rond de
      woning, die noodzakelijk zijn in verband met een handicap van de huurder of van een medebewoner;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel13
  - number: 13.2.b
    text: |-
      als de woning geschikt en bestemd is voor de huisvesting van een huishouden van ten minste acht personen, en het
      huishouden van de huurder uit ten minste acht personen bestaat;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel13
  - number: 13.2.c
    text: |-
      na overschrijding van de bedragen, genoemd in het eerste lid, als over de maand juni die onmiddellijk voorafging
      aan die overschrijding huursubsidie is toegekend.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel13
  - number: '13.3'
    text: |-
      Als huursubsidie wordt toegekend met toepassing van het tweede lid, ontvangt de huurder geen huursubsidie voor het
      deel van de rekenhuur dat ligt boven het maximum dat in het eerste lid is genoemd.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel13
  - number: '13.4'
    text: |-
      De in het eerste lid, onder a en b, genoemde bedragen worden met ingang van 1 juli van elk jaar aangepast
      overeenkomstig [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '14.1'
    text: 'Geen huursubsidie wordt toegekend als het rekeninkomen meer bedraagt dan:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel14
  - number: 14.1.a
    text: € 16 948,69 bij een eenpersoonshuishouden;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel14
  - number: 14.1.b
    text: € 22 711,70 bij een meerpersoonshuishouden;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel14
  - number: 14.1.c
    text: € 15 042,81 bij een eenpersoonsouderenhuishouden;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel14
  - number: 14.1.d
    text: € 19 625,99 bij een meerpersoonsouderenhuishouden.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel14
  - number: '14.2'
    text: |-
      De in het eerste lid genoemde bedragen worden met ingang van 1 juli van elk jaar aangepast overeenkomstig
      [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '15.1'
    text: 'Geen huursubsidie wordt toegekend als het rekenvermogen meer bedraagt dan:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel15
  - number: 15.1.a
    text: |-
      € 18 378,10 bij een eenpersoonshuishouden, als de huurder op de laatste dag van het subsidiejaar jonger is dan
      65 jaar;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel15
  - number: 15.1.b
    text: |-
      het bedrag, genoemd in [artikel 5.5, tweede lid, van de Wet inkomstenbelasting 2001][ref1], zoals dit luidt in het
      peiljaar, bij een meerpersoonshuishouden, als de huurder en de medebewoners op de laatste dag van het subsidiejaar
      jonger zijn dan 65 jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 15.1.c
    text: |-
      € 31 424,28 bij een eenpersoonshuishouden of een eenpersoonsouderenhuishouden als de huurder op de laatste dag van
      het subsidiejaar 65 jaar of ouder is;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel15
  - number: 15.1.d
    text: |-
      € 43 517,52 bij een meerpersoonshuishouden of een meerpersoonsouderenhuishouden, als de huurder of een medebewoner
      op de laatste dag van het subsidiejaar 65 jaar of ouder is.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel15
  - number: '15.2'
    text: |-
      De in het eerste lid, onder a, c en d, genoemde bedragen worden met ingang van 1 juli van elk jaar aangepast
      overeenkomstig [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '16.1'
    text: De normhuur is het gedeelte van de rekenhuur dat ten minste voor rekening van de huurder blijft.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel16
  - number: '16.2'
    text: |-
      Voor de hoogte van de normhuur is het rekeninkomen bepalend. Met het oog hierop worden bij ministeriële regeling de
      inkomens in inkomensklassen verdeeld.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel16
  - number: '16.3'
    text: |-
      De laagste inkomensklasse bevat de inkomens, gelijk aan of lager dan het minimum-inkomensijkpunt, bedoeld in
      [artikel 17][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel17
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '16.4'
    text: |-
      De inkomens in een zelfde inkomensklasse, boven het minimum-inkomensijkpunt, mogen ten hoogste € 500 van elkaar
      verschillen.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel16
  - number: '16.5'
    text: Bij ministeriële regeling wordt elk jaar, met ingang van 1 juli, de indeling in inkomensklassen herzien.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel16
  - number: '17.1'
    text: 'Het minimum-inkomensijkpunt bedraagt, herrekend naar een jaarinkomen in het peiljaar:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel17
  - number: 17.1.a
    text: |-
      voor een eenpersoonshuishouden: de som van de bedragen, bedoeld in de [artikelen 21, onder a][ref1], en
      [25, tweede lid, van de Wet werk en bijstand][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '25'
  - number: 17.1.b
    text: |-
      voor een meerpersoonshuishouden: het bedrag, bedoeld in [artikel 21, onder c, van de Wet werk en bijstand][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel21
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '21'
  - number: 17.1.c
    text: |-
      voor een eenpersoonsouderenhuishouden: het bedrag, bedoeld in
      [artikel 9, tiende lid onder a, van de Algemene Ouderdomswet][ref1], vermeerderd met de vakantietoeslag, bedoeld in
      [artikel 29, negende lid onder c, van de Algemene Ouderdomswet][ref2], en verder vermeerderd met € 1675;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '29'
  - number: 17.1.d
    text: |-
      voor een meerpersoonsouderenhuishouden: twee maal het bedrag, bedoeld in
      [artikel 9, tiende lid onder b, van de Algemene Ouderdomswet][ref1], vermeerderd met de vakantietoeslag, bedoeld in
      [artikel 29, negende lid onder a, van de Algemene Ouderdomswet][ref2], en verder vermeerderd met € 1050.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '29'
  - number: '17.2'
    text: Bij het minimum-inkomensijkpunt behoort een normhuur van € 166,08 .
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel17
  - number: '17.3'
    text: 'De normhuur, bedoeld in het tweede lid, wordt verlaagd met:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel17
  - number: 17.3.a
    text: € 1,82 als op de peildatum sprake is van een eenpersoonsouderenhuishouden, en
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel17
  - number: 17.3.b
    text: € 3,63 als op de peildatum sprake is van een meerpersoonsouderenhuishouden.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel17
  - number: '17.4'
    text: |-
      Het in het tweede lid genoemde bedrag wordt met ingang van 1 juli van elk jaar aangepast overeenkomstig
      [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '18.1'
    text: 'Het referentie-inkomensijkpunt bedraagt:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
  - number: 18.1.a
    text: 'voor een eenpersoonshuishouden: € 14 997,44 ;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
  - number: 18.1.b
    text: 'voor een meerpersoonshuishouden: € 20 283,98 ;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
  - number: 18.1.c
    text: 'voor een eenpersoonsouderenhuishouden: € 14 770,55 ;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
  - number: 18.1.d
    text: 'voor een meerpersoonsouderenhuishouden: € 18 922,64 .'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
  - number: '18.2'
    text: Bij het referentie-inkomensijkpunt behoort een normhuur van € 337,61 .
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
  - number: '18.3'
    text: 'De normhuur, bedoeld in het tweede lid, wordt verlaagd met:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
  - number: 18.3.a
    text: € 1,82 als op de peildatum sprake is van een eenpersoonshuishouden;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
  - number: 18.3.b
    text: € 2,27 als op de peildatum sprake is van een eenpersoonsouderenhuishouden;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
  - number: 18.3.c
    text: € 3,63 als op de peildatum sprake is van een meerpersoonshuishouden en
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
  - number: 18.3.d
    text: € 4,54 als op de peildatum sprake is van een meerpersoonsouderenhuishouden.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
  - number: '18.4'
    text: |-
      De in het eerste en tweede lid genoemde bedragen worden met ingang van 1 juli van elk jaar aangepast overeenkomstig
      [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '19.1'
    text: |-
      Voor elke inkomensklasse boven het minimum-inkomensijkpunt wordt, per type huishouden als bedoeld in artikel 2, de
      hoogte van de normhuur bepaald, waarbij steeds het midden van die klasse als uitgangspunt wordt genomen.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel19
  - number: '19.2'
    text: |-
      De bij deze inkomensklassen behorende normhuren worden, per type huishouden, afgeleid uit de lineaire relatie
      tussen de bij het minimum-inkomensijkpunt behorende normhuurquote en de bij het referentie-inkomensijkpunt
      behorende normhuurquote.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel19
  - number: '20.1'
    text: De kwaliteitskortingsgrens is € 298,59  per maand.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel20
  - number: '20.2'
    text: 'De aftoppingsgrens is:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel20
  - number: 20.2.a
    text: |-
      a. € 427,46  per maand als het huishouden van de huurder, afgezien van eventuele onderhuurders en personen die tot
      diens huishouden behoren, uit één of twee personen bestaat;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel20
  - number: 20.2.b
    text: |-
      b. € 458,32  per maand als het huishouden van de huurder, afgezien van eventuele onderhuurders en personen die tot
      diens huishouden behoren, uit drie of meer personen bestaat.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel20
  - number: '20.3'
    text: |-
      De in het eerste en tweede lid genoemde bedragen worden met ingang van 1 juli van elk jaar aangepast overeenkomstig
      [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '21.1'
    text: 'De hoogte van de huursubsidie wordt als volgt bepaald:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel21
  - number: 21.1.a
    text: |-
      het deel van de rekenhuur boven de normhuur tot aan de kwaliteitskortingsgrens wordt voor 100 procent
      gesubsidieerd;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel21
  - number: 21.1.b
    text: |-
      het deel van de rekenhuur boven de kwaliteitskortingsgrens tot aan de aftoppingsgrens wordt voor 75 procent
      gesubsidieerd;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel21
  - number: 21.1.c
    text: 'het deel van de rekenhuur boven de aftoppingsgrens wordt voor 50 procent gesubsidieerd:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel21
  - number: 21.1.c.1°
    text: als de huurder of één van de medebewoners op de peildatum 65 jaar of ouder is,
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel21
  - number: 21.1.c.2°
    text: als het een eenpersoonshuishouden betreft, of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel21
  - number: 21.1.c.3°
    text: |-
      als de huurder een woning bewoont of betrekt waarin aanpassingen zijn aangebracht in en rond de woning, die
      noodzakelijk zijn in verband met een handicap van de huurder of een medebewoner.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel21
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid, onderdelen a en b, wordt, als de normhuur op of boven de kwaliteitskortingsgrens
      ligt, het deel van de rekenhuur boven de normhuur tot aan de aftoppingsgrens voor 75 procent gesubsidieerd.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel21
  - number: '21.3'
    text: Het toe te kennen bedrag wordt afgerond op hele eurocenten.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel21
  - number: '22'
    text: Geen huursubsidie wordt toegekend als deze minder dan € 4 per maand zou bedragen.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel22
  - number: '23.1'
    text: |-
      Als de huurder in de loop van het subsidietijdvak het genot van de woning verliest, wordt de huursubsidie
      ingetrokken met ingang van de eerste dag van de kalendermaand waarover geen huur meer is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel23
  - number: '23.2'
    text: |-
      Als, in een geval als bedoeld in het eerste lid, de huur wordt voortgezet door een medebewoner, wordt de toegekende
      huursubsidie op diens naam gesteld.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel23
  - number: '24.1'
    text: |-
      Als de rekenhuur gedurende het subsidietijdvak met een bedrag van € 20 of meer wordt gewijzigd, dan wel wordt
      gewijzigd door een onherroepelijke uitspraak van de huurcommissie of de kantonrechter:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel24
  - number: 24.1.a
    text: |-
      wordt de hoogte van de huursubsidie, op aanvraag van de huurder dan wel ambtshalve, aan deze wijziging aangepast
      met ingang van de eerste dag van de kalendermaand waarover de gewijzigde huurprijs is verschuldigd;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel24
  - number: 24.1.b
    text: |-
      wordt, als door deze wijziging alsnog aanspraak op huursubsidie ontstaat, op aanvraag van de huurder alsnog
      huursubsidie toegekend over de resterende volle kalendermaanden van het subsidiejaar, waarbij de eerste dag van die
      periode als peildatum geldt.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel24
  - number: '24.2'
    text: |-
      Onze Minister kan bij de toepassing van het eerste lid uitgaan van een lager bedrag dan daar genoemd, als de
      wijziging van de rekenhuur voortvloeit uit aanpassing van de woning in verband met een handicap van de huurder of
      een medebewoner.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel24
  - number: '24.3'
    text: |-
      Een aanvraag als bedoeld in het eerste lid wordt uiterlijk drie maanden na de datum waarop de wijziging van de huur
      inging ingediend.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel24
  - number: '24.4'
    text: |-
      Na het verstrijken van de termijn, genoemd in het derde lid, is ambtshalve wijziging van de hoogte van de
      huursubsidie slechts in bijzondere gevallen mogelijk.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel24
  - number: '26.1'
    text: |-
      Onze Minister kan ambtshalve of op verzoek van de huurder, als in een bepaald geval de onverkorte toepassing van
      de desbetreffende bepalingen, gelet op het belang dat deze wet beoogt te beschermen, tot een onbillijkheid van
      overwegende aard zou leiden:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26
  - number: 26.1.a
    text: |-
      bij de toepassing van de [artikelen 2][ref1], [3, eerste lid][ref2], en [4, eerste lid][ref3], bepaalde
      medebewoners buiten beschouwing laten;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel4
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 26.1.b
    text: |-
      bij de toepassing van de [artikelen 3, derde lid][ref1], of [4, derde lid][ref2], bepaalde inkomsten of
      vermogensbestanddelen geheel of gedeeltelijk buiten beschouwing laten;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel4
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 26.1.c
    text: |-
      het in [artikel 8][ref1] gestelde meerderjarigheidsvereiste buiten toepassing laten.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel8
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '26.2'
    text: |-
      Een daling van het inkomen ten opzichte van het peiljaar, of een daling van het vermogen na het peiljaar, kan niet
      leiden tot toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26
  - number: '26.3'
    text: |-
      Een verzoek als bedoeld in de aanhef van het eerste lid wordt ingediend binnen zes maanden na het einde van
      het subsidietijdvak waarop de aanvraag tot toekenning van huursubsidie, het huursubsidiebericht of het beperkt
      huursubsidiebericht betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26
  - number: '26.4'
    text: |-
      Onze Minister beslist op een verzoek binnen vijftien maanden na de datum van indiening van dat verzoek of na de
      aanvulling daarvan, bedoeld in [artikel 29, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel29
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '29'
        hoofdstuk: '6'
  - number: 26a.1
    text: 'In dit hoofdstuk en de bepalingen die daarop berusten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26a
  - number: 26a.1.a
    text: |-
      actueel inkomen: het gezamenlijk inkomen van de huurder en de medebewoners, dat wordt berekend door het netto
      inkomen over de eerste kalendermaand van het desbetreffende bijdragetijdvak te herrekenen naar een gecorrigeerd
      verzamelinkomen over het peiljaar;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26a
  - number: 26a.1.b
    text: |-
      bijzondere bijdrage in de huurlasten: bijzondere bijdrage als bedoeld in [artikel 26b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26b
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 26b
        hoofdstuk: 4A
  - number: 26a.1.c
    text: 'bijdragetijdvak: het tijdvak waarvoor telkens een bijzondere bijdrage in de huurlasten kan worden toegekend;'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26a
  - number: 26a.1.d
    text: 'toetsdatum:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26a
  - number: 26a.1.d.1º
    text: |-
      als de huurder een aanvraag als bedoeld in [artikel 26b, eerste lid][ref1], binnen drie maanden na de
      inkomensdaling heeft ingediend: de eerste dag van een kalendermaand als de inkomensdaling per die datum heeft
      plaatsgevonden of de eerste dag van de kalendermaand die volgt op de inkomensdaling in andere gevallen;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26b
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 26b
        hoofdstuk: 4A
  - number: 26a.1.d.2º
    text: |-
      als de huurder een aanvraag als bedoeld in [artikel 26b, eerste lid][ref1], niet binnen drie maanden na de
      inkomensdaling heeft ingediend: de eerste dag van een kalendermaand als de aanvraag op die datum is ingediend of de
      eerste dag van de kalendermaand die volgt op de indiening van de aanvraag in andere gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26b
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 26b
        hoofdstuk: 4A
  - number: 26a.2
    text: |-
      [Artikel 3, tweede, derde en vierde lid][ref1], is van overeenkomstige toepassing op de bepaling van het actueel
      inkomen, met dien verstande dat in het tweede lid van dat artikel voor «peildatum» wordt gelezen: toetsdatum.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel3
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 26a.3
    text: |-
      Bij ministeriële regeling worden nadere regels gesteld omtrent de wijze waarop de herrekening plaatsvindt die is
      bedoeld in het eerste lid, onder a. Bij of krachtens algemene maatregel van bestuur kunnen ook overigens regels
      worden gesteld omtrent de bepaling van het actueel inkomen.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26a
  - number: 26a.4
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het derde lid, laatste volzin, kunnen regels worden
      gesteld omtrent het bij de bepaling van het actueel inkomen in bepaalde gevallen geheel of gedeeltelijk buiten
      beschouwing laten van medebewoners of inkomensbestanddelen.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26a
  - number: 26b.1
    text: |-
      Indien voor het einde van het subsidietijdvak blijkt dat het actueel inkomen ten minste 20 procent lager ligt dan
      het rekeninkomen, kennen burgemeester en wethouders op aanvraag aan een huurder een bijzondere bijdrage toe ter
      tegemoetkoming in de kosten van het huren van een woning.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26b
  - number: 26b.2
    text: |-
      De hoogte van de bijzondere bijdrage in de huurlasten wordt bepaald door, op de wijze die is bedoeld in
      [artikel 21][ref1], het bedrag te berekenen van de huursubsidie dat behoort bij het actueel inkomen, en dit bedrag
      te verminderen met het bedrag van de huursubsidie dat behoort bij het rekeninkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel21
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 26b.3
    text: |-
      De [artikelen 7, tweede en derde lid][ref1], [8 tot en met 11][ref2], en [13 tot en met 22][ref3] zijn van
      overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 26b.3.a
    text: |-
      indien de huurder geen aanvraag als bedoeld in [artikel 28, eerste lid][ref1], heeft ingediend dan wel geen beperkt
      huursubsidiebericht of een huursubsidiebericht heeft ontvangen, in de [artikelen 8][ref2], [9, eerste lid][ref3],
      [10, onder b][ref4], [11, vierde lid][ref5], en [13, eerste lid, onderdeel a][ref6], voor «peildatum» telkenmale
      wordt gelezen: toetsdatum;.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0008659#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0008659#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '28'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0008659
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0008659
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref6
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 26b.3.b
    text: |-
      in [artikel 13, tweede lid, onderdeel c][ref1], voor «over de maand juni» wordt gelezen: over de maand;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 26b.3.c
    text: |-
      in [artikel 14][ref1] voor «rekeninkomen» wordt gelezen: actueel inkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel14
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 26b.4
    text: |-
      Voor de toepassing van het begrip «subsidietijdvak», genoemd in het eerste lid, wordt de huurder geacht tevens
      huursubsidie te hebben aangevraagd op dezelfde dag als waarop hij een aanvraag als bedoeld in het eerste lid heeft
      ingediend, dan wel een beperkt huursubsidiebericht of een huursubsidiebericht te hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26b
  - number: 26b.5
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26b
  - number: 26c.1
    text: |-
      Indien de aanvraag betrekking heeft op het eerste op de inkomensdaling betrekking hebbende bijdragetijdvak waarvoor
      een bijzondere bijdrage in de huurlasten wordt toegekend (eerste aanvraag), vangt dat tijdvak aan:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.1.a
    text: 'indien de aanvraag wordt ingediend binnen drie maanden na de inkomensdaling:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.1.a.1°
    text: op de eerste dag van de kalendermaand als de inkomensdaling per die datum heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.1.a.2°
    text: |-
      op de eerste dag van de kalendermaand die volgt op de inkomensdaling in andere gevallen dan bedoeld onder ten
      eerste;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.1.b
    text: |-
      indien de aanvraag ten minste drie maanden na de inkomensdaling wordt ingediend: op de eerste dag van de
      kalendermaand die volgt op de indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.2
    text: 'Indien de aanvraag geen eerste aanvraag is (vervolgaanvraag), vangt het bijdragetijdvak aan:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.2.a
    text: |-
      indien de aanvraag wordt ingediend binnen drie maanden na afloop van het voorgaande bijdragetijdvak waarvoor een
      bijzondere bijdrage is toegekend: op de eerste dag van de kalendermaand die volgt op de afloop van het voorgaande
      bijdragetijdvak;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.2.b
    text: |-
      op de eerste dag van de kalendermaand die volgt op de indiening van de aanvraag in andere gevallen dan bedoeld
      onder a.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.3
    text: |-
      Op een aanvraag wordt binnen 13 weken na de indiening beslist. Voor ingewikkelde gevallen kunnen burgemeester en
      wethouders die termijn, onder opgaaf van redenen, met ten hoogste zes weken verlengen. Een zodanig besluit wordt
      aan de aanvrager bekend gemaakt binnen 13 weken na de indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.4
    text: |-
      De bijzondere bijdrage in de huurlasten wordt steeds toegekend voor een tijdvak van ten hoogste drie maanden; dat
      tijdvak eindigt niet op een latere datum dan 30 juni.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.5
    text: |-
      Burgemeester en wethouders kunnen op aanvraag voorschotten verstrekken terzake van de bijzondere bijdrage in de
      huurlasten.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.6
    text: |-
      De bijzondere bijdrage in de huurlasten wordt steeds over een tijdvak van ten hoogste drie maanden uitbetaald, na
      afloop van dat tijdvak, onder verrekening van de betaalde voorschotten.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
  - number: 26c.7
    text: |-
      De [artikelen 23][ref1], [24, eerste lid, onder a, en tweede lid][ref2],
      [28, eerste lid, eerste en tweede volzin, en tweede lid][ref3], [29, eerste en tweede lid][ref4],
      [31, tweede lid][ref5], [32][ref6], [33][ref7], [35][ref8] en [48][ref9] zijn van overeenkomstige toepassing, met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0008659#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0008659#Artikel31
      [ref6]: https://wetten.overheid.nl/BWBR0008659#Artikel32
      [ref7]: https://wetten.overheid.nl/BWBR0008659#Artikel33
      [ref8]: https://wetten.overheid.nl/BWBR0008659#Artikel35
      [ref9]: https://wetten.overheid.nl/BWBR0008659#Artikel48
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '23'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '24'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '28'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0008659
        artikel: '29'
        hoofdstuk: '6'
      - id: ref5
        bwb_id: BWBR0008659
        artikel: '31'
        hoofdstuk: '6'
      - id: ref6
        bwb_id: BWBR0008659
        artikel: '32'
        hoofdstuk: '6'
      - id: ref7
        bwb_id: BWBR0008659
        artikel: '33'
        hoofdstuk: '7'
      - id: ref8
        bwb_id: BWBR0008659
        artikel: '35'
        hoofdstuk: '7'
      - id: ref9
        bwb_id: BWBR0008659
        artikel: '48'
        hoofdstuk: '9'
  - number: 26c.7.a
    text: |-
      In [artikel 23, eerste lid][ref1], voor «met ingang van de eerste dag van de kalendermaand waarover geen
      huur is verschuldigd» en in [artikel 24, eerste lid, onder a][ref2], voor «met ingang van de eerste dag van
      de kalendermaand waarover de gewijzigde huurprijs is verschuldigd» steeds wordt gelezen: met ingang van het
      eerstvolgende bijdragetijdvak;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel24
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '23'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '24'
        hoofdstuk: '4'
  - number: 26c.7.b
    text: |-
      burgemeester en wethouders, in plaats van Onze Minister, de bevoegdheden en taken hebben die zijn genoemd
      in de [artikelen 24, tweede lid][ref1], [28, eerste lid, eerste en tweede volzin, en tweede lid][ref2],
      [29, eerste en tweede lid][ref3], en [35][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0008659#Artikel35
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '24'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '28'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '29'
        hoofdstuk: '6'
      - id: ref4
        bwb_id: BWBR0008659
        artikel: '35'
        hoofdstuk: '7'
  - number: 26c.7.c
    text: |-
      aan burgemeester en wethouders en aan de daartoe door hen aangewezen ambtenaren, in plaats van aan Onze
      Minister en aan de daartoe door hem aangewezen ambtenaren, de informatie wordt verstrekt die is bedoeld in
      [artikel 33, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel33
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26c
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '33'
        hoofdstuk: '7'
  - number: 26d.1
    text: |-
      In bij algemene maatregel van bestuur te bepalen categorieën van gevallen waarin bijzondere bijdragen in de
      huurlasten zijn toegekend in afwijking van dit hoofdstuk of de daarop berustende bepalingen, dan wel artikel 33,
      tweede lid, niet wordt nageleefd, besluiten burgemeester en wethouders dat de ten onrechte of tot een te hoog
      bedrag toegekende bijdragen, dan wel de voorschotten daarop, worden teruggevorderd dan wel verrekend.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26d
  - number: 26d.2
    text: |-
      Artikel 36, tweede lid, is van overeenkomstige toepassing op besluiten tot terugvordering of verrekening als
      bedoeld in het eerste lid, met dien verstande dat in onderdeel a van dat artikellid voor «Onze Minister» wordt
      gelezen: burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26d
  - number: 26d.3
    text: |-
      Burgemeester en wethouders kunnen besluiten te verrekenen met aanspraken op een bijzondere bijdrage in de
      huurlasten van de huurder.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26d
  - number: 26d.4
    text: |-
      In door Onze Minister te bepalen gevallen onderzoeken burgemeester en wethouders na afloop van het desbetreffende
      subsidiejaar of zij een bijzondere bijdrage in de huurlasten hebben toegekend met inachtneming van de juiste
      gegevens.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26d
  - number: 26e.1
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van dit hoofdstuk
      over de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de uitvoering
      van deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26e
  - number: 26e.2
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26e
  - number: 26e.2.a
    text: enig wettelijk voorschrift tot bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26e
  - number: 26e.2.b
    text: |-
      degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben, of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26e
  - number: 26e.2.c
    text: de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26e
  - number: 26e.3
    text: |-
      Ten behoeve van wetenschappelijk onderzoek of statistiek kunnen desgevraagd gegevens aan derden worden verstrekt
      voor zover de persoonlijke levenssfeer daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26e
  - number: 26e.4
    text: |-
      Voor zover Onze Minister over de desbetreffende gegevens beschikt, maakt hij op verzoek van burgemeester en
      wethouders dan wel ambtshalve, aan burgemeester en wethouders de gegevens bekend die naar zijn oordeel noodzakelijk
      zijn voor een juiste toepassing van dit hoofdstuk.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26e
  - number: 26f.1
    text: |-
      Uit 's Rijks kas worden de kosten bestreden die ten laste van de gemeente zijn gebleven bij de toepassing van
      artikel 26b.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26f
  - number: 26f.2
    text: |-
      Het Rijk verstrekt op aanvraag voorschotten terzake van de vergoeding, waaronder voorschotten terzake van de door
      burgemeester en wethouders toegekende bijzondere bijdragen in de huurlasten of voorschotten daarop.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26f
  - number: 26f.3
    text: |-
      Burgemeester en wethouders declareren de in een subsidiejaar gemaakte kosten uiterlijk 30 september
      volgend op dat jaar. Bij de opgave wordt een verklaring gevoegd van de accountant, belast met de in
      [artikel 213 van de Gemeentewet][ref1] voorgeschreven controle omtrent de juistheid van de verstrekte gegevens en
      de rechtmatigheid van de uitbetaalde bijzondere bijdragen in de huurlasten.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26f
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '213'
  - number: 26f.4
    text: |-
      Indien burgemeester en wethouders niet voldoen aan het derde lid, stelt Onze Minister eigener beweging of op een
      daartoe strekkend verzoek een termijn van ten hoogste vier weken vanaf de verzenddatum van de kennisgeving, binnen
      welke alsnog aan dat lid kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26f
  - number: 26f.5
    text: |-
      Indien burgemeester en wethouders niet binnen de krachtens het vierde lid gestelde termijn alsnog voldoen aan
      het derde lid, is het eerste lid niet van toepassing en kunnen de onder toepassing van het tweede lid verstrekte
      voorschotten worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26f
  - number: 26f.6
    text: 'Bij algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26f
  - number: 26f.6.a
    text: |-
      gevallen worden aangewezen waarin, in afwijking van het derde lid, geen verklaring bij de opgave behoeft te worden
      gevoegd of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26f
  - number: 26f.6.b
    text: |-
      nadere regels worden gesteld omtrent het eerste tot en met vijfde lid, alsmede omtrent de bij de declaratie te
      verstrekken gegevens.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26f
  - number: 26g.1
    text: |-
      Onze Minister past [artikel 26, eerste lid][ref1], toe overeenkomstig het bepaalde in
      [artikel 26b, eerste en tweede lid][ref2], in gevallen waarin, hoewel het inkomen is gedaald ten opzichte van het
      peiljaar, geen bijzondere bijdrage in de huurlasten wordt toegekend omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel26b
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26g
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: 26b
        hoofdstuk: 4A
  - number: 26g.1.a
    text: |-
      niet is voldaan aan het meerderjarigheidsvereiste dat is gesteld in [artikel 8][ref1] juncto
      [artikel 26b, derde lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel26b
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26g
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: 26b
        hoofdstuk: 4A
  - number: 26g.1.b
    text: |-
      het rekenvermogen hoger is dan het relevante bedrag, genoemd in [artikel 15][ref1], juncto
      [artikel 26b, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel26b
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26g
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: 26b
        hoofdstuk: 4A
  - number: 26g.2
    text: |-
      Een verzoek om toepassing te geven aan het eerste lid wordt bij burgemeester en wethouders ingediend binnen zes
      maanden na het einde van het tijdvak, bedoeld in [artikel 26a, eerste lid, onder c][ref1], waarop de aanvraag tot
      toekenning van een bijzondere bijdrage in de huurlasten betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26a
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26g
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 26a
        hoofdstuk: 4A
  - number: 26g.3
    text: |-
      Burgemeester en wethouders zenden een volledig verzoek binnen drie maanden na de datum van ontvangst door aan Onze
      Minister, met daarop een advies over de afhandeling.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26g
  - number: 26g.4
    text: |-
      [Artikel 26, vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat voor «binnen vijftien
      maanden na de datum van indiening van dat verzoek» wordt gelezen: binnen vijftien maanden na de datum van indiening
      bij burgemeester en wethouders.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel26g
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '26'
        hoofdstuk: '4'
  - number: '27.1'
    text: |-
      Met ingang van 1 juli van elk jaar worden aangepast aan de huurprijsontwikkeling, zoals die naar redelijke
      verwachting in het subsidiejaar zal plaatsvinden:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel27
  - number: 27.1.a
    text: |-
      de bedragen die zijn genoemd in de [artikelen 17, tweede lid][ref1], (bij minimum-inkomensijkpunt behorende
      normhuur) en [18, tweede lid][ref2], (bij referentie-inkomensijkpunt behorende normhuur), bij algemene maatregel
      van bestuur, en


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel18
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 27.1.b
    text: |-
      de bedragen die zijn genoemd in de [artikelen 13, eerste lid, onder b ][ref1], (maximale huurgrens) en
      [20, eerste en tweede lid][ref2], (kwaliteitskortings- en aftoppingsgrens), bij ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel20
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '27.2'
    text: |-
      De in het eerste lid onder a genoemde bedragen kunnen, in afwijking van de aanhef van het eerste lid,
      bij algemene maatregel van bestuur worden aangepast met het percentage waarmee het bedrag, bedoeld in
      [artikel 21, onder c, van de Wet werk en bijstand][ref1] is aangepast. Indien de bedragen, bedoeld in het eerste
      lid, onder a, met ingang van 1 juli van enig jaar zijn aangepast op de wijze, bedoeld in het eerste lid, aanhef, en
      met ingang van 1 juli van het daaropvolgende jaar worden aangepast op de wijze, bedoeld in de eerste volzin, wordt
      toepassing gegeven aan het eerste lid, tweede volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel21
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '21'
  - number: '27.3'
    text: |-
      Bij ministeriële regeling worden elk jaar, met ingang van 1 juli, de bedragen genoemd in de
      [artikelen 13, eerste lid, onder a][ref1] (maximale huurgrens), [14, eerste lid][ref2] (maximum-inkomensgrens),
      en [15, eerste lid, onder a, c en d][ref3], (maximum-vermogensgrens) aangepast aan de ontwikkeling van de
      consumentenprijzen (alle huishoudens) in het peiljaar, als in januari volgend op het peiljaar in de Staatscourant
      bekendgemaakt. De maximum-inkomensgrens kan, naast de aanpassing daarvan volgens de eerste volzin, worden
      aangepast ter voorkoming van onbedoelde gevolgen van maatregelen met betrekking tot de inkomens boven het minimum-
      inkomensijkpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel15
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '27.4'
    text: |-
      Bij regeling van Onze Minister wordt jaarlijks, na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid,
      de hoogte vastgesteld van de bedragen die vanaf 1 juli krachtens [artikel 17, eerste lid][ref1], als minimum-
      inkomensijkpunt zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel17
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '27.5'
    text: |-
      Bij ministeriële regeling wordt elk jaar, met ingang van 1 juli, de hoogte van de bedragen, die krachtens
      [artikel 18, eerste lid][ref1] als referentie-inkomensijkpunt zullen gelden, aangepast met hetzelfde percentage,
      waarmee de corresponderende bedragen in [artikel 17, eerste lid][ref2], (minimum-inkomensijkpunt) worden aangepast.
      Van dit percentage kan worden afgeweken, voor zover de wijziging van de in [artikel 17, eerste lid][ref3], bedoelde
      jaarinkomens onbedoeld afwijkt van de wijziging welke naar verwachting plaats zal vinden met betrekking tot de
      inkomens boven het minimum-inkomensijkpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel17
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '27.6'
    text: |-
      De bedragen, bedoeld in het eerste en tweede lid, en de maximale huurgrens, bedoeld in het derde lid, worden naar
      boven afgerond op hele eurocenten. De maximum-inkomensgrens en de maximum-vermogensgrens, bedoeld in het derde lid,
      en de bedragen, bedoeld in het vierde en vijfde lid, worden naar boven afgerond op een veelvoud van € 25. Bij een
      volgende aanpassing van de grenzen en de bedragen, bedoeld in de tweede volzin, wordt uitgegaan van de grenzen en
      de bedragen zoals die waren, voordat zij werden afgerond.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel27
  - number: '27.7'
    text: |-
      De minimum-inkomensijkpunten en de overeenkomstig het eerste tot en met zesde lid vastgestelde, vanaf 1
      juli geldende, referentie-inkomensijkpunten, maximale huur-, inkomens-, vermogens-, kwaliteitskortings-, en
      aftoppingsgrenzen, alsmede de voor de verschillende inkomensklassen en typen huishouden geldende normhuren worden
      elk jaar uiterlijk op 1 mei in de *Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel27
  - number: '27.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen de bedragen, genoemd in de
      [artikelen 3, tweede lid, onder b][ref1] (inkomensvrijlating), [4, tweede lid][ref2] (vermogensvrijlating),
      [5, eerste lid, onder b, en derde lid, onder a, b, c en d][ref3] (garage-aftrek en maximum-servicekosten),
      [17, eerste lid, onder c en d (ouderentoeslag bij minimum-inkomensijkpunt), en derde lid, onder a en b][ref4]
      (verlaging van de normhuur bij minimum-inkomensijkpunt), en [18, derde lid, onder a, b, c en d][ref5] (verlaging
      van de normhuur bij referentie-inkomensijkpunt), hoger of lager worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0008659#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0008659#Artikel18
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0008659
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '28.1'
    text: |-
      Een aanvraag om toekenning van huursubsidie wordt gedaan door de huurder, door middel van een volledig ingevuld en
      ondertekend formulier, dat wordt vastgesteld door Onze Minister. Onze Minister stelt het formulier verkrijgbaar. De
      aanvraag wordt ingediend bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel28
  - number: '28.2'
    text: |-
      Bij de aanvraag verklaart elk van de medebewoners dat hij er mee instemt dat de inspecteur der rijksbelastingen
      of Onze Minister terzake van de hen betreffende gegevens inzake inkomen en vermogen inlichtingen inwint bij,
      en informatie verschaft aan, de huurder, zo daartoe bij de toepassing van de [artikelen 1a, zesde lid][ref1],
      [35][ref2] en [36][ref3] aanleiding mocht zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel36
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '35'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '36'
        hoofdstuk: '7'
  - number: '29.1'
    text: |-
      Onze Minister onderzoekt de juistheid en volledigheid van de bij de aanvraag verstrekte gegevens en bescheiden.
      Tevens onderzoekt Onze Minister of de personen die in de aanvraag als bewoners van de woning worden vermeld, als
      zodanig staan ingeschreven in de gemeentelijke basisadministratie persoonsgegevens, en of in die administratie
      geen andere personen als bewoner van de woning staan ingeschreven. Bij of krachtens algemene maatregel van bestuur
      kunnen hieromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel29
  - number: '29.2'
    text: |-
      Als de aanvrager het aanvraagformulier, bedoeld in [artikel 28, eerste lid][ref1], niet volledig of niet juist
      heeft ingevuld of niet heeft ondertekend, of de verstrekte gegevens onvoldoende zijn voor de beoordeling van de
      aanvraag, geeft Onze Minister de aanvrager ten minste vier weken de gelegenheid de aanvraag aan te vullen.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel28
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '28'
        hoofdstuk: '6'
  - number: '29.3'
    text: |-
      Onze Minister beslist met betrekking tot het aan de huurder toezenden van een huursubsidiebericht of een beperkt
      huursubsidiebericht, na een daartoe ingesteld onderzoek, mede op basis van de door de huurder onder toepassing van
      het tweede lid overgelegde gegevens.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel29
  - number: '29.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op een verzoek als bedoeld in de
      [artikelen 26, eerste lid][ref1], en [26g, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel26g
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '26'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: 26g
        hoofdstuk: 4A
  - number: '30'
    text: |-
      Indien de gegevens, bedoeld in [artikel 29, tweede lid][ref1], na het verstrijken van de in dat artikellid genoemde
      termijn door de huurder worden ingediend, wordt geen huursubsidie toegekend voor de kalendermaand waarin de datum
      van de aanvraag, bedoeld in [artikel 28, eerste lid][ref2], valt, de kalendermaand waarin die gegevens worden
      ingediend en de tussenliggende kalendermaanden.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel28
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '29'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '28'
        hoofdstuk: '6'
  - number: 30a.1
    text: |-
      Onze Minister zendt over een subsidietijdvak een door hem vastgesteld huursubsidiebericht of beperkt
      huursubsidiebericht:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30a
  - number: 30a.1.a
    text: |-
      aan de huurders die een aanvraag om toekenning van huursubsidie hebben ingediend en waarvan Onze Minister de
      gegevens, bedoeld in de [artikelen 5, tweede lid][ref1], [12, tweede lid][ref2], en [30b][ref3], heeft ontvangen,
      binnen vier weken na ontvangst van die gegevens, en


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel30b
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: 30b
        hoofdstuk: '6'
  - number: 30a.1.b
    text: |-
      aan de huurders die over het subsidietijdvak voorafgaand aan het in de aanhef genoemde subsidietijdvak een
      huursubsidiebericht of een beperkt huursubsidiebericht hebben ontvangen, waarna in eerstgenoemd tijdvak positief is
      beschikt, uiterlijk 1 juli van elk jaar.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30a
  - number: 30a.2
    text: |-
      Tegen een huursubsidiebericht of een beperkt huursubsidiebericht kan geen bezwaar worden gemaakt of beroep worden
      ingesteld.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30a
  - number: 30a.3
    text: |-
      Indien de huurder na ontvangst van een huursubsidiebericht van mening is dat hij op meer huursubsidie aanspraak kan
      maken dan de huursubsidie die is opgenomen in dat bericht, kan hij dit binnen vier weken na de verzenddatum van dat
      bericht aan Onze Minister kenbaar maken.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30a
  - number: 30a.4
    text: |-
      De huurder stelt na ontvangst van een huursubsidiebericht, indien door hemzelf of door de medebewoners wordt
      beschikt over inlichtingen die kunnen inhouden dat hij op minder huursubsidie aanspraak kan maken dan de
      huursubsidie die is opgenomen in dat bericht, Onze Minister hiervan binnen vier weken na de verzenddatum van dat
      bericht in kennis.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30a
  - number: 30a.5
    text: |-
      Onze Minister onderzoekt in de gevallen, bedoeld in het derde en vierde lid, de juistheid en volledigheid van de
      gegevens als opgenomen in het huursubsidiebericht en de juistheid van de door de huurder overgelegde gegevens.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30a
  - number: 30a.6
    text: |-
      Indien Onze Minister, na een daartoe ingesteld onderzoek, van mening is dat de door de huurder onder toepassing van
      het derde of vierde lid overgelegde gegevens juist zijn, beslist Onze Minister mede op basis van die gegevens.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30a
  - number: 30a.7
    text: |-
      Indien Onze Minister, na een daartoe ingesteld onderzoek, van mening is dat de door de huurder onder
      toepassing van het derde of vierde lid overgelegde gegevens niet juist zijn en de gegevens als opgenomen in
      het huursubsidiebericht juist en volledig zijn, alsmede indien de huurder niet binnen de in het derde en vierde
      lid genoemde termijn op het huursubsidiebericht reageert, beslist Onze Minister op basis van de gegevens in het
      huursubsidiebericht.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30a
  - number: 30a.8
    text: |-
      Indien de peildatum is gelegen op of na het verstrijken van de in het derde en vierde lid genoemde termijn, beslist
      Onze Minister binnen acht weken na die peildatum. Indien de peildatum is gelegen voor het verstrijken van de in het
      derde en vierde lid genoemde termijn, beslist Onze Minister binnen acht weken na het verstrijken van die termijn.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30a
  - number: 30aa.1
    text: |-
      Indien een huurder een beperkt huursubsidiebericht ontvangt, zendt hij de ontbrekende gegevens binnen vier weken na
      de verzenddatum van dat bericht aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30aa
  - number: 30aa.2
    text: |-
      Indien de huurder niet voldoet aan het eerste lid, stelt Onze Minister ambtshalve een termijn van ten hoogste vier
      weken vanaf de verzenddatum van de kennisgeving, binnen welke alsnog aan dat lid kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30aa
  - number: 30aa.3
    text: |-
      Onze Minister beslist, na een daartoe ingesteld onderzoek, mede op basis van de inlichtingen, verstrekt ingevolge
      [artikel 33, eerste lid][ref1], en mede op basis van de door de huurder onder toepassing van het eerste of tweede
      lid overgelegde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel33
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30aa
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '33'
        hoofdstuk: '7'
  - number: 30aa.4
    text: |-
      Nadat de huurder heeft voldaan aan het eerste of tweede lid, beslist Onze Minister, indien de peildatum is gelegen
      op of na het verstrijken van de in het eerste en tweede lid genoemde termijn, binnen acht weken na die peildatum.
      Nadat de huurder heeft voldaan aan het eerste of tweede lid, beslist Onze Minister, indien de peildatum is gelegen
      voor het verstrijken van de in het eerste en tweede lid genoemde termijn, binnen acht weken na het verstrijken van
      die termijn.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30aa
  - number: 30aa.5
    text: |-
      Indien de huurder niet heeft voldaan aan het tweede lid, beslist Onze Minister binnen acht weken na het verstrijken
      van de in dat lid bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30aa
  - number: 30ab.1
    text: |-
      Indien de gegevens, bedoeld in [artikel 30aa, eerste lid][ref1], na het verstrijken van de termijn, bedoeld in
      [artikel 30aa, tweede lid][ref2], door de huurder worden ingediend, wordt geen huursubsidie toegekend voor de
      kalendermaand waarin de peildatum valt, de kalendermaand waarin die gegevens worden ingediend en de tussenliggende
      kalendermaanden.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel30aa
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel30aa
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30ab
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 30aa
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: 30aa
        hoofdstuk: '6'
  - number: 30ab.2
    text: |-
      [Artikel 30aa, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel30aa
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30ab
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 30aa
        hoofdstuk: '6'
  - number: 30ab.3
    text: |-
      Onze Minister beslist binnen acht weken nadat de huurder de gegevens, bedoeld in het eerste lid, heeft
      ingediend. Indien de huurder die gegevens volledig indient voordat Onze Minister toepassing heeft gegeven aan
      [artikel 30aa, vijfde lid][ref1], blijft dat lid buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel30aa
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30ab
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 30aa
        hoofdstuk: '6'
  - number: 30b.1
    text: |-
      De volgende organen verstrekken, voor zover het persoonsgegevens betreft voor de verwerking waarvan zij de
      verantwoordelijke zijn, Onze Minister desgevraagd alle persoonsgegevens die noodzakelijk zijn voor het opstellen
      van het huursubsidiebericht of beperkt huursubsidiebericht:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30b
  - number: 30b.1.a
    text: |-
      het college van burgemeester en wethouders van een gemeente, voor zover het de in de gemeentelijke
      basisadministratie persoonsgegevens van die gemeente opgenomen gegevens betreft omtrent het woonadres van de
      huurder en de overige op dat adres als ingezetene ingeschreven personen;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30b
  - number: 30b.1.b
    text: |-
      Onze Minister van Financiën, voor zover het gegevens betreft inzake het inkomen en het vermogen, bedoeld in
      [artikel 4][ref1], van de huurder en de medebewoners, die worden verwerkt door de Rijksbelastingdienst, en


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel4
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 30b.1.c
    text: de verhuurders, voor zover het gegevens betreft inzake de huurprijs van de woning.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30b
  - number: 30b.2
    text: |-
      Onze Minister verzamelt en analyseert de gegevens, bedoeld in het eerste lid, uitsluitend ten behoeve van het
      huursubsidiebericht of beperkt huursubsidiebericht.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30b
  - number: 30b.3
    text: |-
      Het huursubsidiebericht omvat uitsluitend de gegevens, verstrekt krachtens het eerste lid, en de op basis van die
      gegevens berekende huursubsidie.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30b
  - number: 30b.4
    text: 'Het beperkt huursubsidiebericht omvat:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30b
  - number: 30b.4.a
    text: |-
      indien het een beperkt huursubsidiebericht is als bedoeld in [artikel 1, onder a, onder 1°][ref1]: uitsluitend de
      gegevens, verstrekt krachtens het eerste lid, onder a en b;


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel1
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 30b.4.b
    text: |-
      indien het een beperkt huursubsidiebericht is als bedoeld in [artikel 1, onder a, onder 2°][ref1]: uitsluitend de
      gegevens, verstrekt krachtens het eerste lid, onder a en c, of


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel1
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 30b.4.c
    text: |-
      indien het een beperkt huursubsidiebericht is als bedoeld in [artikel 1, onder a, onder 3°][ref1]: uitsluitend de
      gegevens, verstrekt krachtens het eerste lid, onder a.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel1
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 30c.1
    text: |-
      Burgemeester en wethouders bevorderen dat binnen hun gemeente een of meer voorzieningen tot stand komen die de
      dienstverlening, voortvloeiende uit de uitvoering van deze wet, welke ten goede komt aan de huurders, verbeteren.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30c
  - number: 30c.2
    text: |-
      Onze Minister verstrekt de gegevens, bedoeld in [artikel 30b, eerste lid][ref1], uitsluitend ten behoeve van de
      voorzieningen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel30b
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30c
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 30b
        hoofdstuk: '6'
  - number: 30c.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de taken en van de
      inrichting van de voorzieningen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30c
  - number: 30d
    text: |-
      Onze Minister voert ten behoeve van een getrouwe weergave van de uitvoering en een effectief uitvoeringsproces,
      alsmede omtrent de verzonden huursubsidieberichten of beperkte huursubsidieberichten een zodanige administratie dat
      de juiste, volledige en tijdige vastlegging is gewaarborgd van de gegevens en bescheiden die verband houden met de
      toepassing van de [artikelen 28 tot en met 30c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel28
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel30d
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '28'
        hoofdstuk: '6'
  - number: '31.1'
    text: De huursubsidie wordt maandelijks uitbetaald.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel31
  - number: '31.2'
    text: Uitbetaling geschiedt door overmaking op een door de huurder opgegeven bank- of girorekening.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel31
  - number: '31.3'
    text: |-
      Onze Minister kan aan de huurder, voordat op een aanvraag als bedoeld in [artikel 28, eerste lid][ref1], een
      huursubsidiebericht of een beperkt huursubsidiebericht is beschikt, de huursubsidie zo nodig in de vorm van een
      voorschot uitbetalen.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel28
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '28'
        hoofdstuk: '6'
  - number: '31.4'
    text: |-
      Onze Minister kan, na een daartoe ingesteld onderzoek, de ten onrechte of te veel onder toepassing van het derde
      lid uitbetaalde voorschotten van de huurder terugvorderen of verrekenen met aanspraken op huursubsidie van de
      huurder. Onze Minister stelt de hoogte van het terug te vorderen of te verrekenen voorschot en de wijze van
      terugvordering of verrekening vast.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel31
  - number: '31.5'
    text: |-
      Op verzoek of met instemming van de huurder kan Onze Minister de huursubsidie uitbetalen aan de verhuurder van
      de woning; de verhuurder verleent hieraan zijn medewerking. Bij ministeriële regeling kunnen nadere regels worden
      gesteld over de gevallen waarin en de wijze waarop zodanige betaling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel31
  - number: '32.1'
    text: |-
      De huursubsidie is niet vatbaar voor vervreemding, verpanding, belening of beslag, behoudens dat beslag is
      toegestaan met het oog op de inning van de huur.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel32
  - number: '32.2'
    text: Elk beding, strijdig met het eerste lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel32
  - number: '33.1'
    text: |-
      De huurder en de medebewoners zijn verplicht uit eigen beweging aan Onze Minister onmiddellijk alle inlichtingen
      te verstrekken waarover zij redelijkerwijs kunnen beschikken, en die redelijkerwijs van belang kunnen zijn voor de
      vaststelling van het recht op en de hoogte van de huursubsidie.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel33
  - number: '33.2'
    text: |-
      De in het eerste lid bedoelde personen zijn verplicht de in dat lid bedoelde gegevens desgevraagd te verstrekken
      aan burgemeester en wethouders, aan Onze Minister, en aan de door Onze Minister daartoe aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel33
  - number: '35'
    text: |-
      Onze Minister kan de uitbetaling van de huursubsidie geheel of gedeeltelijk opschorten als hij redelijkerwijs kan
      vermoeden dat ten onrechte of tot een te hoog bedrag huursubsidie is toegekend.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel35
  - number: '36.1'
    text: 'Onze Minister kan de toekenning herzien, als huursubsidie is toegekend:'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel36
  - number: 36.1.a
    text: in afwijking van deze wet of de daarop berustende bepalingen, of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel36
  - number: 36.1.b
    text: |-
      als gevolg van het niet naleven van de [artikelen 30a, vierde lid][ref1], of [33, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel33
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 30a
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '33'
        hoofdstuk: '7'
  - number: '36.2'
    text: |-
      Aan een besluit als bedoeld in het eerste lid kan terugwerkende kracht worden verleend over ten hoogste vijf
      subsidietijdvakken, voorafgaande aan het lopende subsidietijdvak:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel36
  - number: 36.2.a
    text: |-
      als de door de huurder of de medebewoners verstrekte gegevens zodanig onjuist of onvolledig blijken te zijn
      geweest, dat een ander besluit zou zijn genomen indien de juiste of volledige gegevens bij Onze Minister bekend
      zouden zijn geweest,
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel36
  - number: 36.2.b
    text: |-
      als de [artikelen 30a, vierde lid][ref1], of [33, tweede lid][ref2], niet worden nageleefd, of.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel30a
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel33
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 30a
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '33'
        hoofdstuk: '7'
  - number: 36.2.c
    text: |-
      als de huurder redelijkerwijs had kunnen begrijpen dat de huursubsidie ten onrechte of tot een te hoog bedrag is
      verleend.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel36
  - number: '36.3'
    text: |-
      Als het eerste lid toepassing vindt kan de ten onrechte of te veel uitbetaalde huursubsidie van de huurder worden
      teruggevorderd, of worden verrekend met aanspraken op huursubsidie van de huurder. Onze Minister stelt de hoogte
      van het terug te vorderen of te verrekenen bedrag en de wijze van terugvordering of verrekening vast.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel36
  - number: '36.4'
    text: |-
      Onze Minister kan, als de herziening haar grond vindt in het feit dat het aanvraagformulier, bedoeld in
      [artikel 28, eerste lid][ref1], niet naar waarheid is ingevuld, dan wel de [artikelen 30a, vierde lid][ref2],
      of [33][ref3] niet zijn nageleefd, het terug te vorderen bedrag verhogen met 25 procent, met dien verstande
      dat deze verhoging niet meer mag bedragen dan € 225 per subsidietijdvak waarover ten onrechte huursubsidie werd
      genoten. De verhoging kan worden betrokken bij een verrekening als bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel33
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '28'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: 30a
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '33'
        hoofdstuk: '7'
  - number: '37.1'
    text: |-
      Een krachtens de [artikelen 26f, vijfde lid][ref1], en [31, vierde lid][ref2], teruggevorderd voorschot en een
      bedrag als bedoeld in [artikel 36, derde en vierde lid][ref3], wordt ingevorderd door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26f
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel36
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 26f
        hoofdstuk: 4A
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '31'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '36'
        hoofdstuk: '7'
  - number: '37.2'
    text: |-
      Onze Minister zendt een aanmaning om binnen een vastgestelde termijn van ten minste vier weken na dagtekening van
      de aanmaning de voorschotten terug te betalen, of het verschuldigde bedrag te voldoen, indien:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
  - number: 37.2.a
    text: |-
      burgemeester en wethouders in gebreke blijven de door hen ontvangen voorschotten terug te betalen binnen de
      daarvoor gestelde termijn of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
  - number: 37.2.b
    text: |-
      de huurder in gebreke blijft het door hem ontvangen voorschot terug te betalen en het door hem verschuldigde bedrag
      te voldoen binnen de daarvoor gestelde termijn.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
  - number: '37.3'
    text: |-
      De invordering van de voorschotten of het verschuldigde bedrag, vermeerderd met de kosten van aanmaning en
      invordering, kan zonder rechterlijke tussenkomst geschieden bij dwangbevel, indien:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
  - number: 37.3.a
    text: burgemeester en wethouders ook na aanmaning in gebreke blijven of
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
  - number: 37.3.b
    text: de huurder ook na aanmaning in gebreke blijft.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
  - number: '37.4'
    text: |-
      De betekening en tenuitvoerlegging van het dwangbevel geschieden door de ontvanger van de rijksbelastingen
      en door de belastingdeurwaarder van de rijksbelastingen, met toepassing van de [artikelen 13][ref1] en
      [14 van de Invorderingswet 1990][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel14
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '14'
  - number: '37.5'
    text: |-
      Zolang de ontvanger met de zorg voor de invordering is belast, kan hij een vordering doen op grond van
      [artikel 19 van de Invorderingswet 1990][ref1], alsmede verrekenen op grond van [artikel 24 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '24'
  - number: '37.6'
    text: |-
      De ontvanger kan, zolang hij met de zorg voor de invordering is belast, onder door hem te stellen voorwaarden aan
      de huurder en aan burgemeester en wethouders voor een bepaalde tijd bij beschikking uitstel van betaling verlenen.
      Gedurende het uitstel wordt de dwanginvordering geschorst. Het uitstel kan tussentijds bij beschikking worden
      beëindigd.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
  - number: '37.7'
    text: |-
      Met betrekking tot het verzet tegen de tenuitvoerlegging van het dwangbevel is
      [artikel 17 van de Invorderingswet 1990][ref1] van overeenkomstige toepassing, met dien verstande dat in dat
      artikel in plaats van «de ontvanger die het dwangbevel heeft uitgevaardigd» telkens moet worden gelezen: de met de
      tenuitvoerlegging van het dwangbevel belaste ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
  - number: '37.8'
    text: |-
      De kosten van aanmaning en verdere invordering worden berekend op de voet van de
      [Kostenwet invordering rijksbelastingen][ref1]. De [artikelen 6 en 7 van de Invorderingswet 1990][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002645
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel6
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002645
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '6'
  - number: '38.1'
    text: |-
      Burgemeester en wethouders zien erop toe dat het aantal gevallen, waarin huursubsidie wordt toegekend aan huurders
      die in de gemeente een woning betrekken met een rekenhuur, hoger dan de in artikel 20, tweede lid, bedoelde
      aftoppingsgrens, elk subsidiejaar niet meer bedraagt dan vier procent van het totaal aantal van de gevallen waarin
      in dat subsidiejaar huursubsidie wordt toegekend aan huurders die in die gemeente een woning betrekken.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel38
  - number: '38.2'
    text: |-
      Onder huurders die een woning betrekken worden voor de toepassing van het eerste lid mede verstaan huurders die
      aanspraak maken op huursubsidie vanaf een datum die ten hoogste zes maanden ligt na de datum waarop zij huurder
      zijn geworden.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel38
  - number: '38.3'
    text: |-
      Bij algemene maatregel van bestuur kan, in afwijking van het eerste lid, een hoger percentage dan vier worden
      vastgesteld voor in die maatregel aan te wijzen gebieden waarin evident wordt afgeweken van het landelijk
      gemiddelde.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel38
  - number: '39.1'
    text: |-
      De gemeente waarin in enig subsidiejaar het in artikel 38 genoemde percentage wordt overschreden, is aan het Rijk
      een financiële bijdrage verschuldigd.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel39
  - number: '39.2'
    text: |-
      De hoogte van de bijdrage is gelijk aan het aantal van de gevallen waarin in het subsidiejaar in die gemeente
      het in artikel 38 genoemde percentage werd overschreden verminderd met het aantal gevallen waarin Onze Minister
      is afgeweken van het advies van burgemeester en wethouders, bedoeld in artikel 12, vermenigvuldigd met een bij
      algemene maatregel van bestuur vastgesteld tarief. Daarbij is bepalend het aantal gevallen dat bij Onze Minister
      bekend is op 1 januari na afloop van het subsidiejaar.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel39
  - number: '39.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de berekening en de invordering van de
      verschuldigde financiële bijdrage.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel39
  - number: '39.4'
    text: |-
      Onze Minister kan, als in een bepaald geval de onverkorte toepassing van het eerste lid, gelet op het belang dat
      deze wet beoogt te beschermen, tot een onbillijkheid van overwegende aard zou leiden, afzien van toepassing van het
      eerste lid, dan wel een lagere bijdrage vaststellen dan voortvloeit uit toepassing van het tweede lid.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel39
  - number: '40'
    text: |-
      Het verschuldigd zijn van de financiële bijdrage, alsmede de hoogte daarvan, worden bij beschikking door Onze
      Minister vastgesteld, uiterlijk vijf jaren na afloop van het subsidiejaar waarop de bijdrage betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel40
  - number: '46'
    text: |-
      Bij algemene maatregel van bestuur kunnen de bij die maatregel aangewezen personen en instanties worden verplicht
      kosteloos gegevens en afschriften van stukken te verstrekken aan burgemeester en wethouders, en Onze Minister,
      voor zover die verstrekking noodzakelijk is voor de uitvoering van deze wet. Bij die maatregel kunnen nadere regels
      worden gesteld met betrekking tot die verstrekking.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel46
  - number: '47'
    text: |-
      Burgemeester en wethouders verstrekken desgevraagd aan Onze Minister de gegevens over de uitvoering van deze wet,
      alsmede inzage in de stukken daarover, op de wijze als door Onze Minister bepaald.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel47
  - number: '48'
    text: |-
      In de administratie over de uitvoering van deze wet wordt het sociaal-fiscaal nummer opgenomen
      waaronder een aanvrager van huursubsidie, een huurder aan wie een huursubsidiebericht of beperkt
      huursubsidiebericht wordt toegezonden en de medebewoners zijn geregistreerd bij de rijksbelastingdienst.
      Bij de verstrekking van gegevens over de uitvoering van deze wet wordt gebruik gemaakt van
      dit sociaal-fiscaalnummer. Onder sociaal-fiscaalnummer wordt verstaan: het nummer, bedoeld in
      [artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 48a.1
    text: |-
      Burgemeester en wethouders voeren ten behoeve van een getrouwe weergave van de uitvoering en een effectief
      uitvoeringsproces een zodanige administratie dat de juiste, volledige en tijdige vastlegging zijn gewaarborgd van
      de gegevens en bescheiden die verband houden met:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel48a
  - number: 48a.1.a
    text: |-
      de besluiten over aanvragen, onderzoeken, toekenningen, vorderingen en verplichtingen en de hieruit voortvloeiende
      betalingen en ontvangsten, genomen en gedaan ingevolge [hoofdstuk 4A][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Hoofdstuk4A
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0008659
        hoofdstuk: 4A
  - number: 48a.1.b
    text: |-
      de onderzoeken die worden verricht ingevolge [artikel 26c, zevende lid, aanhef, juncto onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel26c
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: 26c
        hoofdstuk: 4A
  - number: 48a.1.c
    text: |-
      de toepassing van de [artikelen 12, tweede lid][ref1], en [38][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel38
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '38'
        hoofdstuk: '8'
  - number: 48a.2
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel48a
  - number: 48b.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel48b
  - number: 48b.2
    text: |-
      De in het eerste lid bedoelde ambtenaren beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:15][ref1], [5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel48b
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 48c
    text: |-
      Onze Minister verstrekt op verzoek aan burgemeester en wethouders de gegevens, bedoeld in artikel 30b,
      eerste lid, uitsluitend ten behoeve van het doen van uitkeringen uit een bij verordening op basis van
      [artikel 108 van de Gemeentewet][ref1] ingesteld gemeentelijk woonlastenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel108
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '108'
  - number: '49.1'
    text: |-
      Onze Minister kan voor de huur van nader door hem aangewezen woningen of categorieën van woningen huursubsidie
      toekennen in afwijking van de artikelen 1, onder d en e, 11, 13 en 28 tot en met 32, ten behoeve van experimenten
      die naar zijn oordeel in het belang van de volkshuisvesting zijn. Onze Minister bepaalt hierbij vooraf de duur van
      het experiment.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel49
  - number: '49.2'
    text: |-
      Onze Minister kan ook na afsluiting van het experiment af blijven wijken van de in het eerste lid genoemde
      artikelen, voor zover het de bewoners betreft die tijdens de duur van het experiment huursubsidie ontvingen met
      toepassing van het eerste lid en zolang een door hem op basis van het experiment noodzakelijk geoordeelde wijziging
      van deze wet nog niet van kracht is geworden en in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel49
  - number: '50'
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens
      [artikel 27, eerste lid, onder a, en tweede lid, eerste volzin][ref1], wordt niet gedaan dan nadat het ontwerp aan
      de beide kamers der Staten-Generaal is overgelegd en sedert die overlegging acht weken zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '54'
    text: De Wet individuele huursubsidie wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel54
  - number: '55.1'
    text: |-
      Op subsidietijdvakken die zijn aangevangen onder de werking van de Wet individuele huursubsidie blijven de daarop
      vóór de inwerkingtreding van de Huursubsidiewet geldende bepalingen van toepassing. Gedurende de eerste vijf
      subsidiejaren na de inwerkingtreding van artikel 44, wordt de huursubsidie-uitgavennorm zodanig lager vastgesteld
      dan uit artikel 41 voortvloeit, dat een eventuele overschrijding van de huursubsidie-uitgavennorm die is ontstaan
      gedurende het eerste subsidiejaar na inwerkingtreding van deze wet, wordt tenietgedaan.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel55
  - number: '55.2'
    text: |-
      In het eerste subsidiejaar na inwerkingtreding van deze wet wordt in afwijking van artikel 4, eerste lid, verstaan
      onder rekenvermogen: het gezamenlijk vermogen van de huurder en de medebewoners op 0.00 uur op de datum van
      inwerkingtreding van artikel 4, eerste lid.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel55
  - number: '55.3'
    text: |-
      Artikel 11 blijft buiten toepassing ten aanzien van een huurder van onzelfstandige woonruimte, anders dan bedoeld
      in dat artikel, indien die woonruimte onmiddellijk voorafgaand aan het moment dat de Wet individuele huursubsidie
      werd ingetrokken, was aangewezen als woonruimte aan de huurder waarvan een bijdrage op voet van die wet kon worden
      verstrekt.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel55
  - number: '55.4'
    text: |-
      Artikel 13, eerste lid, is niet van toepassing op een huurder op wie artikel 41 van de Wet individuele huursubsidie
      of artikel II van de wet van 9 juni 1994 houdende wijziging van de Wet individuele huursubsidie (*Stb.* 439) van
      toepassing was over de aan de dag van inwerkingtreding van deze wet voorafgaande kalendermaand, zolang deze huurder
      het genot van de desbetreffende woning behoudt. Artikel 13, derde lid, is in deze gevallen van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel55
  - number: '55.5'
    text: |-
      Een verrekening als bedoeld in artikel 36, derde lid, kan mede betrekking hebben op te veel betaalde bedragen en de
      daarop betrekking hebbende verhogingen op voet van de Wet individuele huursubsidie.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel55
  - number: '55.6'
    text: |-
      Voor de toepassing van artikel 41 voor het eerste subsidiejaar na inwerkingtreding van deze wet, gelden de
      bijdragen op voet van de Wet individuele huursubsidie over het daaraan voorafgaande jaar als uitgaven aan
      huursubsidie.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel55
  - number: '56'
    text: |-
      Indien artikel I, onder B en C, van het bij koninklijke boodschap van 26 juni 1995 ingediende voorstel van wet
      tot wijziging van de Vreemdelingenwet en enige andere wetten teneinde de aanspraak van vreemdelingen jegens
      bestuursorganen op verstrekkingen, voorzieningen, uitkeringen, ontheffingen en vergunningen te koppelen aan het
      rechtmatig verblijf van de vreemdeling in Nederland (*kamerstukken* 24 233) tot wet wordt verheven en in werking
      treedt:
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel56
  - number: 56.a
    text: met ingang van 1 juli van enig jaar, treedt artikel 10 in werking met ingang van die datum;
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel56
  - number: 56.b
    text: |-
      met ingang van een andere datum dan 1 juli, treedt artikel 10 in werking met ingang van de 1 juli die volgt op
      die datum.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel56
  - number: '57.1'
    text: Onze Minister brengt jaarlijks verslag uit aan de Staten-Generaal over de werking van deze wet.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel57
  - number: '57.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid zendt Onze Minister binnen drie jaar na de inwerkingtreding van deze
      wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel57
  - number: '58.1'
    text: |-
      Deze wet treedt in werking met ingang van 1 juli van een bij koninklijk besluit te bepalen jaar, met uitzondering
      van artikel 4, eerste lid, dat zes maanden later in werking treedt, en met uitzondering van artikel 10, dat in
      werking treedt op het tijdstip, bedoeld in artikel 56.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel58
  - number: '58.2'
    text: |-
      In afwijking van het eerste lid treden de artikelen 39, 40, 44 en 45 in werking met ingang van de 1 juli die volgt
      op het bij koninklijk besluit bepaalde jaar, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel58
  - number: '58.3'
    text: |-
      Met ingang van de dag van inwerkingtreding van deze wet worden de daarin voorkomende bedragen aangepast
      overeenkomstig artikel 27, met als uitgangspunt dat de laatste aanpassing daarvan per 1 juli 1997 heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel58
  - number: '58.4'
    text: Het derde lid blijft buiten toepassing als deze wet met ingang van 1 juli 1997 in werking treedt.
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel58
  - number: '59'
    text: 'Deze wet wordt aangehaald als: Huursubsidiewet.'
    url: https://wetten.overheid.nl/BWBR0008659/2004-03-26#Artikel59
