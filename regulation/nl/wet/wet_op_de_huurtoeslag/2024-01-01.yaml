---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_de_huurtoeslag
regulatory_layer: WET
publication_date: '2024-12-20'
valid_from: '2024-01-01'
bwb_id: BWBR0008659
url: https://wetten.overheid.nl/BWBR0008659/2024-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet individuele huursubsidie te herzien, ter
    matiging van de huurlasten van huishoudens met lagere inkomens, ter vereenvoudiging van de wettelijke bepalingen,
    alsmede ter vergroting van de doelmatigheid van de huursubsidieverstrekking;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de bepalingen die daarop berusten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
  - number: 1.a
    text: |-
      burgemeester en wethouders: burgemeester en wethouders van de gemeente waar de woning is gelegen waarop de
      huurtoeslag betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
  - number: 1.b
    text: |-
      huurcommissie: de huurcommissie, bedoeld in
      [artikel 3a, eerste lid, van de Uitvoeringswet huurprijzen woonruimte][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel3a
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: 3a
  - number: 1.c
    text: |-
      huurder: persoon die zijn hoofdverblijf heeft in een door hem gehuurde woning, daaronder begrepen een woonwagen,
      tenzij:
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
  - number: 1.c.1°
    text: |-
      de overeenkomst van huur en verhuur een gebruik van de woning betreft dat naar zijn aard slechts van korte duur
      is, of
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
  - number: 1.c.2°
    text: |-
      de woning onderdeel uitmaakt van een hotel-, pension-, kamp- of vakantiebestedingsbedrijf, ongeacht de duur van
      de huurovereenkomst;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
  - number: 1.d
    text: 'huurprijs: de prijs die bij huur en verhuur is verschuldigd voor het enkele gebruik van een woning;'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
  - number: 1.e
    text: |-
      huurtoeslag: een tegemoetkoming van het Rijk als bedoeld in
      [artikel 2, eerste lid, onderdeel h, van de Algemene wet inkomensafhankelijke regelingen][ref1] in de kosten van
      het huren van een woning;


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel2
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '2'
  - number: 1.f
    text: |-
      onderhuurder: persoon als bedoeld in
      [artikel 2, eerste lid, onderdeel e, onder 2°, van de Algemene wet inkomensafhankelijke regelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel2
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '2'
  - number: 1.g
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
  - number: 1.h
    text: |-
      rekenhuur: de rekenhuur, bedoeld in [artikel 5][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel5
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.i
    text: |-
      rekeninkomen: de gezamenlijke toetsingsinkomens, bedoeld in
      [artikel 8 van de Algemene wet inkomensafhankelijke regelingen][ref1], die in aanmerking worden genomen voor het
      bepalen van de draagkracht, bedoeld in [artikel 7 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel7
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '7'
  - number: 1.j
    text: |-
      standplaats: kavel, bestemd voor het plaatsen van een woonwagen, waarop voorzieningen aanwezig zijn die op het
      leidingnet van de openbare nutsbedrijven, andere instellingen of van gemeenten kunnen worden aangesloten;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
  - number: 1.k
    text: |-
      woning: een gebouwde onroerende zaak voor zover deze als zelfstandige woonruimte, onvrije etage dan wel andere
      onzelfstandige woonruimte is verhuurd, alsmede de onroerende aanhorigheden;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
  - number: 1.l
    text: |-
      woonwagen: voor bewoning bestemd gebouw dat is geplaatst op een standplaats en dat in zijn geheel of in delen kan
      worden verplaatst.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1
  - number: 1a.1
    text: |-
      Op deze wet is de [Algemene wet inkomensafhankelijke regelingen][ref1], met uitzondering van
      [artikel 6, eerste en tweede lid][ref2], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel6
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0018472
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '6'
  - number: 1a.2
    text: |-
      De uitvoering van het toekennen, uitbetalen en terugvorderen van een huurtoeslag is opgedragen aan de Dienst
      Toeslagen.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1a
  - number: 1a.3
    text: |-
      In afwijking van [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref1] wordt in deze wet en de
      daarop berustende bepalingen de partner uitsluitend als partner aangemerkt indien deze in de basisregistratie
      personen op het adres van de huurder staat ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel3
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '3'
  - number: '2'
    text: 'In deze wet en de bepalingen die daarop berusten wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel2
  - number: 2.a
    text: |-
      eenpersoonshuishouden: het huishouden van een huurder die, afgezien van een eventuele onderhuurder
      en de tot het huishouden van de onderhuurder behorende personen, als enige een woning bewoont, en
      die op 1 januari van het berekeningsjaar jonger is dan de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 2.b
    text: |-
      meerpersoonshuishouden: het huishouden van een huurder die samen met diens partner of een of meer medebewoners een
      woning bewoont, indien geen van deze personen op 1 januari van het berekeningsjaar de pensioengerechtigde leeftijd,
      bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 2.c
    text: |-
      eenpersoonsouderenhuishouden: het huishouden van een huurder die, afgezien van een eventuele
      onderhuurder en de tot het huishouden van de onderhuurder behorende personen, als enige een woning
      bewoont, en die op 1 januari van het berekeningsjaar de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 2.d
    text: |-
      meerpersoonsouderenhuishouden: het huishouden van een huurder die samen met diens partner of een of meer
      medebewoners een woning bewoont, indien een of meer van deze personen op 1 januari van het berekeningsjaar de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft
      bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '5.1'
    text: |-
      In deze wet en de bepalingen die daarop berusten wordt verstaan onder rekenhuur: de huurprijs die
      de huurder per maand is verschuldigd, of, als dat lager is dan de huurprijs, een bedrag dat gelijk
      is aan de maximale huurprijsgrens, bedoeld in de krachtens de [artikelen 10, eerste lid][ref1], en
      [12, tweede lid, van de Uitvoeringswet huurprijzen woonruimte][ref2] daarover gestelde regels, vermeerderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0014315#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014315#Artikel12
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014315
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0014315
        artikel: '12'
  - number: 5.1.a
    text: een bedrag voor door de huurder verschuldigde servicekosten, en
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel5
  - number: 5.1.b
    text: |-
      in geval van huur van een woonwagen zonder eigen aandrijving het bedrag dat verschuldigd is voor de huur van de
      standplaats.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel5
  - number: '5.2'
    text: |-
      Bij de toepassing van het eerste lid kan het in de aanhef van dat lid laatstbedoelde bedrag slechts in plaats
      van de verschuldigde huurprijs in aanmerking worden genomen nadat, op verzoek van de Dienst Toeslagen, de
      huurcommissie, dan wel de voorzitter van de huurcommissie, aan de Dienst Toeslagen en aan de huurder advies heeft
      uitgebracht, dan wel een verklaring heeft verstrekt, over de redelijk te achten huurprijs. Bij algemene maatregel
      van bestuur kunnen omtrent die verklaring nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel5
  - number: '5.3'
    text: 'Als servicekosten als bedoeld in het eerste lid, onderdeel a, worden uitsluitend in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel5
  - number: 5.3.a
    text: |-
      kosten voor het in bedrijf zijn van lift-, ventilatie-, hydrofoor- en alarminstallaties, en van verlichting van
      door de huurder met anderen gemeenschappelijk gebruikte ruimten, met een maximum van € 12 per maand;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel5
  - number: 5.3.b
    text: schoonmaakkosten van de lift en andere gemeenschappelijke ruimten, met een maximum van € 12 per maand;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel5
  - number: 5.3.c
    text: de kosten voor de diensten van een huismeester, met een maximum van € 12 per maand;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel5
  - number: 5.3.d
    text: |-
      kapitaals- en onderhoudskosten van dienstruimten en gemeenschappelijke recreatieruimten, met een maximum van € 12
      per maand.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel5
  - number: '7.1'
    text: |-
      Het recht op en de hoogte van de huurtoeslag is afhankelijk van de draagkracht, waaronder begrepen het vermogen,
      van de huurder, diens partner en de medebewoners.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel7
  - number: '7.2'
    text: Ten aanzien van een bepaalde woning kan slechts aan één huurder een huurtoeslag worden toegekend.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel7
  - number: '8'
    text: Een huurtoeslag wordt slechts toegekend aan een huurder die meerderjarig is.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel8
  - number: '9.1'
    text: 'Een huurtoeslag wordt slechts toegekend:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel9
  - number: 9.1.a
    text: |-
      als de huurder, diens partner alsmede degenen die medebewoner van de woning zijn, als ingezetene op het adres van
      die woning zijn ingeschreven in de basisregistratie personen;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel9
  - number: 9.1.b
    text: |-
      als geen andere personen met dat adres in de basisregistratie personen zijn ingeschreven, behoudens eventueel een
      onderhuurder en personen die behoren tot diens huishouden.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel9
  - number: '9.2'
    text: |-
      In afwijking van het eerste lid kan een huurtoeslag worden toegekend, als de onjuiste inschrijving in de
      basisregistratie personen niet aan de huurder kan worden toegerekend.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel9
  - number: '10'
    text: |-
      De huurder die tijdelijke bescherming geniet als bedoeld in [artikel 1 van de Vreemdelingenwet 2000][ref1] omdat
      hij onder de reikwijdte valt van het Uitvoeringsbesluit (EU) 2022/382 van de Raad van 4 maart 2022 tot vaststelling
      van het bestaan van een massale toestroom van ontheemden uit Oekraïne in de zin van artikel 5 van [Richtlijn
      2001/55/EG](32001L0055), en tot invoering van tijdelijke bescherming naar aanleiding daarvan (PbEU 2022, L 71/1) of
      een verlenging van dat besluit, heeft recht op huurtoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel1
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '1'
  - number: '11.1'
    text: 'Een huurtoeslag wordt slechts toegekend voor de huur van een woning die:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel11
  - number: 11.1.a
    text: een zelfstandige woonruimte of een onvrije etage is, of
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel11
  - number: 11.1.b
    text: |-
      een onzelfstandige woonruimte is, welke deel uitmaakt van een woongebouw of woning, geheel of gedeeltelijk
      verhuurd ten behoeve van begeleid wonen, groepswonen door ouderen of een daarmee vergelijkbare woonvorm, en in
      eigendom van en aan de huurder verhuurd door een rechtspersoon zonder winstoogmerk, die mede op het gebied van de
      volkshuisvesting werkzaam is.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel11
  - number: '11.2'
    text: |-
      Het eerste lid onder b vindt slechts toepassing als de onzelfstandige woonruimte deel uitmaakt van een woongebouw
      of woning, die door de Dienst Toeslagen is aangewezen. Bij algemene maatregel van bestuur kunnen terzake nadere
      regels worden gesteld, waarbij een lagere maximale rekenhuur kan worden vastgesteld dan uit [artikel 13][ref1]
      voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '11.3'
    text: 'Voor de huur van een woonwagen zonder eigen aandrijving wordt slechts een huurtoeslag toegekend, indien deze:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel11
  - number: 11.3.a
    text: |-
      is geplaatst op een standplaats of op een regionaal woonwagencentrum dat tot stand is gekomen voor 1 oktober 1970,
      en
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel11
  - number: 11.3.b
    text: |-
      voldoet aan de eisen, daaraan gesteld krachtens de [Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '13.1'
    text: 'Geen huurtoeslag wordt toegekend als de rekenhuur:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel13
  - number: 13.1.a
    text: 'hoger is dan € 879,66 per maand als:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel13
  - number: 13.1.a.1º
    text: |-
      de huurder, diens partner of een van de medebewoners 23 jaar of ouder is, dan wel de woning deelt met een kind of
      pleegkind van de huurder, diens partner of een medebewoner of
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel13
  - number: 13.1.a.2º
    text: de huurder, diens partner of de medebewoner jonger dan 23 jaar is, en een handicap heeft of
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel13
  - number: 13.1.b
    text: hoger is dan € 454,47 per maand in andere gevallen dan bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel13
  - number: '13.2'
    text: 'Het eerste lid is niet van toepassing:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel13
  - number: 13.2.a
    text: |-
      als sprake is van overschrijding van een daar genoemd bedrag omdat voorzieningen zijn aangebracht in en rond de
      woning, die noodzakelijk zijn in verband met een handicap van de huurder, van diens partner of van een medebewoner;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel13
  - number: 13.2.b
    text: |-
      als de woning geschikt en bestemd is voor de huisvesting van een huishouden van ten minste acht personen, en het
      huishouden van de huurder uit ten minste acht personen bestaat;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel13
  - number: 13.2.c
    text: |-
      na overschrijding van de bedragen, genoemd in het eerste lid, als de huurder eerder een huurtoeslag ten aanzien van
      de desbetreffende woning is toegekend.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel13
  - number: '13.3'
    text: |-
      Als een huurtoeslag wordt toegekend met toepassing van het tweede lid, ontvangt de huurder geen huurtoeslag voor
      het deel van de rekenhuur dat ligt boven het maximum dat in het eerste lid is genoemd.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel13
  - number: '13.4'
    text: |-
      De in het eerste lid, onder a en b, genoemde bedragen worden met ingang van 1 januari van elk jaar gewijzigd
      overeenkomstig [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '14.1'
    text: 'Het norminkomen bedraagt:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel14
  - number: 14.1.a
    text: € 27.725 bij een eenpersoonshuishouden;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel14
  - number: 14.1.b
    text: € 37.625 bij een meerpersoonshuishouden;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel14
  - number: 14.1.c
    text: € 26.486,12 bij een eenpersoonsouderenhuishouden;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel14
  - number: 14.1.d
    text: € 35.061,14 bij een meerpersoonsouderenhuishouden.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel14
  - number: '14.2'
    text: |-
      Het norminkomen, genoemd in het eerste lid, onderdelen c en d, wordt vermeerderd met het bedrag van de
      inkomensondersteuning, bedoeld in [artikel 33a, eerste lid, van de Algemene Ouderdomswet][ref1], per kalenderjaar,
      zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, onderscheidenlijk twee maal dat
      bedrag, en verder vermeerderd met € 665 onderscheidenlijk € 1 462.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel33a
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 33a
  - number: '14.3'
    text: |-
      De in het eerste lid genoemde bedragen worden met ingang van 1 januari van elk jaar gewijzigd overeenkomstig
      [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '16'
    text: |-
      De basishuur is het gedeelte van de rekenhuur dat voor rekening van de huurder blijft. De basishuur is het
      overeenkomstig de [artikelen 17][ref1], [18][ref2] en [19][ref3] berekende bedrag van de normhuur verhoogd met
      € 12 .


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel19
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '17.1'
    text: 'Het minimum-inkomensijkpunt wordt verkregen door:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel17
  - number: 17.1.a
    text: |-
      voor een eenpersoonshuishouden: de uitkomst van 81% van het twaalfvoud
      van het voor de maand januari van het berekeningsjaar geldende in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref1] bedoelde bedrag per
      maand, zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, te vermeerderen met € 572;


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
  - number: 17.1.b
    text: |-
      voor een meerpersoonshuishouden: de uitkomst van 108% van het twaalfvoud van het bedrag per maand, bedoeld in
      onderdeel a, zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, te vermeerderen met
      € 144;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel17
  - number: 17.1.c
    text: |-
      voor een eenpersoonsouderenhuishouden: de uitkomst van het bedrag van het bruto-ouderdomspensioen voor de
      pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder a, van de Algemene Ouderdomswet][ref1], zoals dat
      bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, vermeerderd met het bedrag van de bruto-
      vakantie-uitkering, vastgesteld overeenkomstig [artikel 29, eerste lid, aanhef en onder a, van die wet][ref2],
      zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, en de inkomensondersteuning, bedoeld
      in [artikel 33a, eerste lid, van die wet][ref3], per kalenderjaar, zoals die inkomensondersteuning naar redelijke
      verwachting in het berekeningsjaar zal luiden, te herrekenen naar een jaarinkomen in het berekeningsjaar en dat
      jaarinkomen te vermeerderen met € 2 340;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel33a
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: 33a
  - number: 17.1.d
    text: |-
      voor een meerpersoonsouderenhuishouden: de uitkomst van twee maal het bedrag van het bruto-ouderdomspensioen voor
      de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder b, van de Algemene Ouderdomswet][ref1], zoals
      dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, vermeerderd met het bedrag van de bruto-
      vakantie-uitkering, vastgesteld overeenkomstig [artikel 29, eerste lid, aanhef en onder b, van die wet][ref2],
      zoals dat bedrag naar redelijke verwachting in het berekeningsjaar zal luiden, en twee maal de
      inkomensondersteuning, bedoeld in [artikel 33a, eerste lid, van die wet][ref3], per kalenderjaar, zoals die
      inkomensondersteuning naar redelijke verwachting in het berekeningsjaar zal luiden, te herrekenen naar een
      jaarinkomen in het berekeningsjaar en dat jaarinkomen te vermeerderen met € 2 512.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel33a
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: 33a
  - number: '17.2'
    text: Bij het minimum-inkomensijkpunt behoort een normhuur van € 226,67.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel17
  - number: '17.3'
    text: 'De normhuur, bedoeld in het tweede lid, wordt verlaagd met:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel17
  - number: 17.3.a
    text: € 1,82 als sprake is van een eenpersoonsouderenhuishouden, en
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel17
  - number: 17.3.b
    text: € 3,63 als sprake is van een meerpersoonsouderenhuishouden.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel17
  - number: '17.4'
    text: |-
      Het in het tweede lid genoemde bedrag wordt met ingang van 1 januari van elk jaar gewijzigd overeenkomstig
      [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '18.1'
    text: 'Het referentie-inkomensijkpunt bedraagt:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
  - number: 18.1.a
    text: 'voor een eenpersoonshuishouden: € 30.550;'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
  - number: 18.1.b
    text: 'voor een meerpersoonshuishouden: € 39.700;'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
  - number: 18.1.c
    text: 'voor een eenpersoonsouderenhuishouden: € 30.575;'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
  - number: 18.1.d
    text: 'voor een meerpersoonsouderenhuishouden: € 39.875.'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
  - number: '18.2'
    text: |-
      Voor de toepassing van het derde lid en van [artikel 19, tweede lid][ref1], worden de bedragen, genoemd in het
      eerste lid, onderdelen c en d, vermeerderd met € 665 onderscheidenlijk € 1 462.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel19
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '18.3'
    text: Bij het referentie-inkomensijkpunt behoort een normhuur van € 460,74.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
  - number: '18.4'
    text: 'De normhuur, bedoeld in het tweede lid, wordt verlaagd met:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
  - number: 18.4.a
    text: € 1,82 als sprake is van een eenpersoonshuishouden;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
  - number: 18.4.b
    text: € 2,27 als sprake is van een eenpersoonsouderenhuishouden;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
  - number: 18.4.c
    text: € 3,63 als sprake is van een meerpersoonshuishouden en
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
  - number: 18.4.d
    text: € 4,54 als sprake is van een meerpersoonsouderenhuishouden.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
  - number: '18.5'
    text: |-
      De in het eerste en tweede lid genoemde bedragen worden met ingang van 1 januari van elk jaar gewijzigd
      overeenkomstig [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '19.1'
    text: |-
      Voor elk rekeninkomen onder of gelijk aan het minimum-inkomensijkpunt, bedoeld in [artikel 17][ref1], geldt de
      normhuur, bedoeld in artikel 17, tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel17
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '19.2'
    text: |-
      Voor elk rekeninkomen boven het minimum-inkomensijkpunt is, per type huishouden als bedoeld in [artikel 2][ref1],
      de hoogte van de normhuur de uitkomst van de formule: (a x Y2) + (b x Y) in welke formule voorstelt: a en b: de
      factoren, vast te stellen bij ministeriële regeling, die, per type huishouden, worden afgeleid uit de lineaire
      relatie tussen de bij het minimum-inkomensijkpunt behorende normhuurquote en de bij het referentie-inkomensijkpunt
      behorende normhuurquote; Y: het rekeninkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel2
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '19.3'
    text: De overeenkomstig het tweede lid berekende normhuur wordt naar boven afgerond op hele eurocenten.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel19
  - number: '19.4'
    text: |-
      Bij ministeriële regeling worden met ingang van 1 januari van elk jaar de factoren, bedoeld in het tweede lid,
      gewijzigd.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel19
  - number: '20.1'
    text: De kwaliteitskortingsgrens is € 454,47 per maand.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel20
  - number: '20.2'
    text: 'De aftoppingsgrens is:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel20
  - number: 20.2.a
    text: |-
      € 650,43 per maand als het huishouden van de huurder, afgezien van eventuele onderhuurders en personen die tot
      diens huishouden behoren, uit één of twee personen bestaat;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel20
  - number: 20.2.b
    text: |-
      € 697,07 per maand als het huishouden van de huurder, afgezien van eventuele onderhuurders en personen die tot
      diens huishouden behoren, uit drie of meer personen bestaat.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel20
  - number: '20.3'
    text: |-
      De in het eerste en tweede lid genoemde bedragen worden met ingang van 1 januari van elk jaar gewijzigd
      overeenkomstig [artikel 27][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '21.1'
    text: 'De hoogte van de huurtoeslag wordt als volgt bepaald:'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel21
  - number: 21.1.a
    text: |-
      het deel van de rekenhuur boven de basishuur tot aan de kwaliteitskortingsgrens wordt voor 100 procent
      gesubsidieerd;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel21
  - number: 21.1.b
    text: |-
      het deel van de rekenhuur boven de kwaliteitskortingsgrens tot aan de aftoppingsgrens wordt voor een bij algemene
      maatregel van bestuur vast te stellen percentage gesubsidieerd;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel21
  - number: 21.1.c
    text: |-
      het deel van de rekenhuur boven de aftoppingsgrens wordt voor een bij algemene maatregel van bestuur vast te
      stellen percentage gesubsidieerd:
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel21
  - number: 21.1.c.1º
    text: |-
      als de huurder, diens partner of één van de medebewoners de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], heeft bereikt;


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 21.1.c.2º
    text: als het een eenpersoonshuishouden betreft, of
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel21
  - number: 21.1.c.3º
    text: |-
      als de huurder een woning bewoont of betrekt waarin aanpassingen zijn aangebracht in en rond de woning, die
      noodzakelijk zijn in verband met een handicap van de huurder, diens partner of een medebewoner.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel21
  - number: '21.2'
    text: |-
      In afwijking van het eerste lid, onderdelen a en b, wordt, als de basishuur op of boven de kwaliteitskortingsgrens
      ligt, het deel van de rekenhuur boven de basishuur tot aan de aftoppingsgrens voor het percentage, bedoeld in het
      eerste lid, onderdeel b, gesubsidieerd.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel21
  - number: '21.3'
    text: |-
      In afwijking van het eerste lid wordt, als de basishuur op of boven de aftoppingsgrens ligt, het deel van de
      rekenhuur boven de basishuur voor het percentage, bedoeld in het eerste lid, onderdeel c, gesubsidieerd, in de
      gevallen, bedoeld in dat onderdeel.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel21
  - number: '23'
    text: |-
      Bij verhuizing van de huurder blijft het in [artikel 7, eerste lid][ref1], bedoelde recht op huurtoeslag in stand,
      mits hij de woning naar welke hij verhuist huurt en vervolgens bewoont en ook overigens aan de voorwaarden voor
      verkrijging van huurtoeslag wordt voldaan. [Artikel 5, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel5
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '27.1'
    text: |-
      Bij ministeriële regeling worden met ingang van 1 januari van elk jaar de bedragen, genoemd in de
      [artikelen 13, eerste lid, onderdeel a][ref1] (maximale huurgrens), en [14, eerste lid][ref2] (norminkomen),
      gewijzigd met de factor, bedoeld in [artikel 10.2 van de Wet inkomstenbelasting 2001][ref3], met dien verstande dat
      in het eerste en tweede lid van laatstgenoemd artikel voor «kalenderjaar» telkens wordt gelezen «berekeningsjaar»
      en dat in het tweede lid van dat artikel voor «Consumentenprijsindex Alle Huishoudens afgeleid» wordt gelezen
      «Consumentenprijsindex Alle Huishoudens».


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel10
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '10'
  - number: '27.2'
    text: |-
      Naast de wijziging op grond van het eerste lid kan het bedrag, genoemd in [artikel 14, eerste lid][ref1]
      (norminkomen), bij ministeriële regeling worden gewijzigd ter voorkoming van onbedoelde gevolgen van maatregelen
      met betrekking tot de inkomens boven het minimum-inkomensijkpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel14
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '27.3'
    text: |-
      Bij ministeriële regeling worden, met ingang van 1 januari van elk jaar, de bedragen, genoemd in de
      [artikelen 13, eerste lid, onderdeel b][ref1] (maximale huurgrens), [17, tweede lid][ref2] (bij minimum-
      inkomensijkpunt behorende normhuur), [18, derde lid][ref3] (bij referentie-inkomensijkpunt behorende normhuur), en
      [20, eerste en tweede lid][ref4] (kwaliteitskortingsgrens en aftoppingsgrenzen), gewijzigd met het percentage van
      de huurprijsontwikkeling, zoals die naar redelijke verwachting in het tijdvak dat loopt van 1 juli van het aan het
      berekeningsjaar voorafgaande jaar tot 1 juli van het berekeningsjaar zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0008659#Artikel20
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0008659
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '27.4'
    text: |-
      Bij ministeriële regeling wordt elk jaar, na overleg met Onze Minister van Sociale Zaken en Werkgelegenheid, de
      hoogte vastgesteld van de bedragen, zoals die met ingang van 1 januari krachtens [artikel 17, eerste lid][ref1],
      als minimum-inkomensijkpunten gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel17
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '27.5'
    text: |-
      Bij ministeriële regeling worden met ingang van 1 januari van elk jaar de bedragen, genoemd in
      [artikel 18, eerste lid][ref1] (referentie-inkomensijkpunten), gewijzigd met het percentage, waarmee de in het
      berekeningsjaar verwachte corresponderende bedragen krachtens [artikel 17, eerste lid, onderdelen a en b][ref2],
      en de in het berekeningsjaar verwachte corresponderende bedragen en tegemoetkomingen krachtens de onderdelen c en
      d van dat artikellid (minimum-inkomensijkpunten), afwijken van de corresponderende bedragen en tegemoetkomingen
      die in het daaraan voorafgaande berekeningsjaar gelden krachtens de in dat artikellid genoemde wetten. Van dit
      percentage kan worden afgeweken, voor zover de wijziging van de in artikel 17, eerste lid, bedoelde jaarinkomens
      onbedoeld afwijkt van de wijziging welke naar verwachting plaats zal vinden met betrekking tot de inkomens boven
      het minimum-inkomensijkpunt.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel17
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '27.6'
    text: |-
      De bedragen, bedoeld in het eerste, tweede en derde lid, worden naar boven afgerond op hele eurocenten, met
      uitzondering van de norminkomens, bedoeld in [artikel 14, eerste lid, onderdelen a en b][ref1] (maximum inkomen
      bij een- en meerpersoonshuishoudens), die naar boven worden afgerond op een veelvoud van € 25. De bedragen, bedoeld
      in het vierde en vijfde lid, en de som van de bedragen, genoemd in artikel 14, eerste lid, onderdelen c of d, en
      bedoeld in artikel 14, tweede lid (maximum inkomen bij een- en meerpersoonsouderenhuishoudens), worden naar boven
      afgerond op een veelvoud van € 25. Bij een volgende wijziging van de norminkomens en de bedragen, bedoeld in het
      vijfde lid, wordt uitgegaan van de bedragen zoals die waren, voordat zij werden afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel14
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '27.7'
    text: |-
      De overeenkomstig het eerste tot en met zesde lid vastgestelde, vanaf 1 januari geldende minimum-
      inkomensijkpunten, referentie-inkomensijkpunten, maximale inkomensgrenzen, normhuren, de als gevolg daarvan voor
      de onderscheiden typen huishouden gewijzigde factoren, bedoeld in [artikel 19, tweede lid][ref1], maximale huur-,
      kwaliteitskortings- en aftoppingsgrenzen, worden elk jaar uiterlijk op 1 november daaraan voorafgaand in de
      Staatscourant bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel19
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '27.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen de bedragen, genoemd in de
      [artikelen 5, derde lid, onderdelen a, b, c, en d][ref1] (maximum service-kosten), [16][ref2]
      (verhoging van de normhuur), [17, eerste lid, onderdelen c en d][ref3] (ouderentoeslag bij minimum-
      inkomensijkpunt), en derde lid, onderdelen a en b (verlaging van de normhuur bij minimum-inkomensijkpunt), en
      [18, vierde lid, onderdelen a, b, c en d][ref4] (verlaging van de normhuur bij referentie-inkomensijkpunt), hoger
      of lager worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0008659#Artikel18
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0008659
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '28.1'
    text: |-
      Burgemeester en wethouders bevorderen dat binnen hun gemeente een of meer voorzieningen tot stand komen die
      de dienstverlening, voortvloeiende uit de uitvoering van deze wet en van de Algemene wet inkomensafhankelijke
      regelingen, welke ten goede komt aan de huurders, verbeteren.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel28
  - number: '28.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de taken en van de
      inrichting van de voorzieningen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel28
  - number: 48c
    text: |-
      De Dienst Toeslagen verstrekt op verzoek aan burgemeester en wethouders de voor de uitvoering ten behoeve
      van het doen van uitkeringen uit een bij verordening op basis van [artikel 108 van de Gemeentewet][ref1]
      ingesteld gemeentelijk woonlastenfonds benodigde gegevens behoudens het bepaalde in
      [artikel 38a van de Algemene wet inkomensafhankelijke regelingen][ref2], uitsluitend ten behoeve van dat
      woonlastenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel108
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel38a
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '108'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: 38a
  - number: '49.1'
    text: |-
      De Dienst Toeslagen kan voor de huur van nader door Onze Minister aangewezen woningen of categorieën van woningen
      een huurtoeslag toekennen in afwijking van de [artikelen 1, onder c en d][ref1], [11][ref2] en [13][ref3], ten
      behoeve van experimenten die naar het oordeel van Onze Minister in het belang van de volkshuisvesting zijn. Onze
      Minister bepaalt hierbij vooraf de duur van het experiment.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '49.2'
    text: |-
      De Dienst Toeslagen kan op verzoek van Onze Minister na afsluiting van het experiment af blijven wijken van de
      in het eerste lid genoemde artikelen, voor zover het de bewoners betreft die tijdens de duur van het experiment
      een huurtoeslag ontvingen met toepassing van het eerste lid en zolang een door Onze Minister op basis van het
      experiment noodzakelijk geoordeelde wijziging van deze wet nog niet van kracht is geworden en in werking is
      getreden.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel49
  - number: '50'
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens de [artikelen 21, eerste lid][ref1], en
      [27, negende lid][ref2], wordt niet gedaan dan nadat het ontwerp aan de beide kamers der Staten-Generaal is
      overgelegd en sedert die overlegging acht weken zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel27
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '27'
        hoofdstuk: '5'
  - number: '54'
    text: De Wet individuele huursubsidie wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel54
  - number: '55.1'
    text: |-
      Op subsidietijdvakken die zijn aangevangen onder de werking van de Wet individuele huursubsidie blijven de
      daarop vóór de inwerkingtreding van de Huursubsidiewet geldende bepalingen van toepassing. Gedurende de eerste
      vijf subsidiejaren na de inwerkingtreding van [artikel 44][ref1], wordt de huursubsidie-uitgavennorm zodanig
      lager vastgesteld dan uit [artikel 41][ref2] voortvloeit, dat een eventuele overschrijding van de huursubsidie-
      uitgavennorm die is ontstaan gedurende het eerste subsidiejaar na inwerkingtreding van deze wet, wordt
      tenietgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel41
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '44'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '41'
        hoofdstuk: '8'
  - number: '55.2'
    text: |-
      In het eerste subsidiejaar na inwerkingtreding van deze wet wordt in afwijking van [artikel 4, eerste lid][ref1],
      verstaan onder rekenvermogen: het gezamenlijk vermogen van de huurder en de medebewoners op 0.00 uur op de datum
      van inwerkingtreding van [artikel 4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008659#Artikel4
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008659
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '55.3'
    text: |-
      [Artikel 11][ref1] blijft buiten toepassing ten aanzien van een huurder van onzelfstandige woonruimte, anders
      dan bedoeld in dat artikel, indien die woonruimte onmiddellijk voorafgaand aan het moment dat de Wet individuele
      huursubsidie werd ingetrokken, was aangewezen als woonruimte aan de huurder waarvan een bijdrage op voet van die
      wet kon worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel11
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '55.4'
    text: |-
      [Artikel 13, eerste lid][ref1], is niet van toepassing op een huurder op wie artikel 41 van de Wet individuele
      huursubsidie of [artikel II van de wet van 9 juni 1994 houdende wijziging van de Wet individuele huursubsidie][ref2]
      (Stb. 439) van toepassing was over de aan de dag van inwerkingtreding van deze wet voorafgaande kalendermaand,
      zolang deze huurder het genot van de desbetreffende woning behoudt. [Artikel 13, derde lid][ref3], is in deze
      gevallen van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0006720#ArtikelII
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel13
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006720
        artikel: II
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '55.5'
    text: |-
      Bij de toepassing van [artikel 2][ref1], en bij de toepassing van
      [artikel 7 van de Algemene wet inkomensafhankelijke regelingen][ref2] kan de Dienst Toeslagen op verzoek van de
      huurder het op 31 december 2005 van kracht zijnde beleid toepassen dat Onze Minister heeft getroffen op grond
      van [artikel 9][ref3] en [artikel 26][ref4], eerste lid, zoals die artikelen onmiddellijk voorafgaand aan de
      inwerkingtreding van de [Aanpassingswet Algemene wet inkomensafhankelijke regelingen][ref5] luidden.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0008659#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0008659#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0018471
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0008659
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0008659
        artikel: '26'
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0018471
  - number: '55.6'
    text: Het vijfde lid geldt uitsluitend in bij of krachtens algemene maatregel van bestuur vast te stellen gevallen.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel55
  - number: '55.7'
    text: |-
      Een verrekening als bedoeld in [artikel 36, derde lid][ref1], kan mede betrekking hebben op te veel betaalde
      bedragen en de daarop betrekking hebbende verhogingen op voet van de Wet individuele huursubsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel36
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '36'
        hoofdstuk: '7'
  - number: '55.8'
    text: |-
      Voor de toepassing van [artikel 41][ref1] voor het eerste subsidiejaar na inwerkingtreding van deze wet, gelden
      de bijdragen op voet van de Wet individuele huursubsidie over het daaraan voorafgaande jaar als uitgaven aan
      huursubsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0008659#Artikel41
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008659
        artikel: '41'
        hoofdstuk: '8'
  - number: '56'
    text: |-
      Indien artikel I, onder B en C, van het bij koninklijke boodschap van 26 juni 1995 ingediende voorstel van wet
      tot wijziging van de Vreemdelingenwet en enige andere wetten teneinde de aanspraak van vreemdelingen jegens
      bestuursorganen op verstrekkingen, voorzieningen, uitkeringen, ontheffingen en vergunningen te koppelen aan het
      rechtmatig verblijf van de vreemdeling in Nederland (*kamerstukken* 24 233) tot wet wordt verheven en in werking
      treedt:
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel56
  - number: 56.a
    text: met ingang van 1 juli van enig jaar, treedt artikel 10 in werking met ingang van die datum;
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel56
  - number: 56.b
    text: |-
      met ingang van een andere datum dan 1 juli, treedt artikel 10 in werking met ingang van de 1 juli die volgt op
      die datum.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel56
  - number: 56b
    text: |-
      In afwijking van artikel 13, eerste lid, onderdeel a, aanhef, onderscheidenlijk onderdeel
      b, van de Huursubsidiewet, zoals die luidden na het tijdstip van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _____ (Stb. 61), luiden de daarin genoemde bedragen voor het tijdvak dat loopt van 1 juli 2003 tot en met 30 juni
      2004: € 585,24 onderscheidenlijk € 317,03.


      [ref1]: https://wetten.overheid.nl/BWBR0016332#ArtikelI
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0016332
        artikel: I
  - number: '57.1'
    text: Onze Minister brengt jaarlijks verslag uit aan de Staten-Generaal over de werking van deze wet.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel57
  - number: '57.2'
    text: |-
      Onverminderd het bepaalde in het eerste lid zendt Onze Minister binnen drie jaar na de inwerkingtreding van deze
      wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel57
  - number: '58.1'
    text: |-
      Deze wet treedt in werking met ingang van 1 juli van een bij koninklijk besluit te bepalen jaar, met uitzondering
      van artikel 4, eerste lid, dat zes maanden later in werking treedt, en met uitzondering van artikel 10, dat in
      werking treedt op het tijdstip, bedoeld in artikel 56.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel58
  - number: '58.2'
    text: |-
      In afwijking van het eerste lid treden de artikelen 39, 40, 44 en 45 in werking met ingang van de 1 juli die volgt
      op het bij koninklijk besluit bepaalde jaar, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel58
  - number: '58.3'
    text: |-
      Met ingang van de dag van inwerkingtreding van deze wet worden de daarin voorkomende bedragen aangepast
      overeenkomstig artikel 27, met als uitgangspunt dat de laatste aanpassing daarvan per 1 juli 1997 heeft
      plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel58
  - number: '58.4'
    text: Het derde lid blijft buiten toepassing als deze wet met ingang van 1 juli 1997 in werking treedt.
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel58
  - number: '59'
    text: 'Deze wet wordt aangehaald als: Wet op de huurtoeslag.'
    url: https://wetten.overheid.nl/BWBR0008659/2024-01-01#Artikel59
