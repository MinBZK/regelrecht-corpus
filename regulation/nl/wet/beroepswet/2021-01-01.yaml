  - number: 4.1.a
    text: het bestuur wordt aangemerkt als hun functionele autoriteit;
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel4
  - number: 4.1.b
    text: |-
      zij met betrekking tot hun benoeming en salaris worden gelijkgesteld met degenen die hetzelfde ambt vervullen bij
      een gerechtshof;
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel4
  - number: 4.1.c
    text: |-
      het bestuur de lijst van aanbeveling opmaakt bij het openvallen van een plaats van senior raadsheer, raadsheer
      of raadsheer-plaatsvervanger en de Raad voor de rechtspraak deze lijst telkens, onder medezending van een advies
      hierover, aan Onze Minister van Veiligheid en Justitie doorzendt met het oog op een voordracht voor benoeming
      overeenkomstig [artikel 2, eerste lid, van de Wet rechtspositie rechterlijke ambtenaren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel2
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '2'
  - number: 4.1.d
    text: |-
      zij voor de overeenkomstige toepassing van de [artikelen 6][ref1], [45][ref2] en [46][ref3] worden gelijkgesteld
      met bij een gerechtshof of rechtbank werkzame rechterlijke ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel4
    references:
