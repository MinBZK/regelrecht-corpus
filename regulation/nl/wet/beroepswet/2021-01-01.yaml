  - number: 4.2.c
    text: het bestuur de werkzaamheden van de senior-gerechtsauditeurs en gerechtsauditeurs verdeelt; en
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel4
  - number: 4.2.d
    text: |-
      zij voor de overeenkomstige toepassing van [artikel 13][ref1] worden gelijkgesteld met rechterlijke ambtenaren van
      wie de eerste benoeming een ambt bij een gerechtshof of rechtbank betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel13
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel4
    references:
      - id: ref1
