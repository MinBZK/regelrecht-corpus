  - number: '4.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de overeenkomstige
      toepassing van het krachtens de [Wet rechtspositie rechterlijke ambtenaren][ref1] bepaalde ten aanzien van de in
      het eerste en tweede lid genoemde leden met rechtspraak belast, senior-gerechtsauditeurs en gerechtsauditeurs.


      [ref1]: https://wetten.overheid.nl/BWBR0008365
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008365
  - number: '5'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over de werkwijze van de Centrale Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel5
  - number: '6'
    text: |-
      De rechtbanken en de presidenten geven inlichtingen wanneer die door de president van de Centrale Raad van Beroep
      voor de behandeling van een zaak noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel6
