preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de organisatie en procedure van de Centrale Raad van
    Beroep en de raden van beroep opnieuw te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: Er is een Centrale Raad van Beroep, gevestigd te Utrecht.
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel1
  - number: '2.1'
    text: 'Bij de Centrale Raad van Beroep zijn werkzaam:'
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel2
  - number: 2.1.a
    text: leden met rechtspraak belast, en
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel2
  - number: 2.1.b
    text: gerechtsambtenaren.
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel2
  - number: '2.2'
    text: 'De leden met rechtspraak belast, werkzaam bij de Centrale Raad van Beroep zijn:'
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel2
  - number: 2.2.a
    text: senior raadsheren;
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel2
  - number: 2.2.b
    text: raadsheren;
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel2
  - number: 2.2.c
    text: raadsheren-plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel2
