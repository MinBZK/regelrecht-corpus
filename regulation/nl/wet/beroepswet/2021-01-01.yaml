  - number: 3.a
    text: |-
      het bestuur bestaat uit drie leden, waaronder de voorzitter, waarbij geldt dat twee leden,
      waaronder de voorzitter, leden met rechtspraak belast van de Centrale Raad van Beroep als bedoeld in
      [artikel 2, tweede lid, onderdeel a of b][ref1], zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0002170#Artikel2
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002170
        artikel: '2'
  - number: 3.b
    text: |-
      de voorzitter onderscheidenlijk het andere rechterlijk lid gedurende zijn benoemingsduur als voorzitter
      onderscheidenlijk ander rechterlijk lid, in plaats van zijn salaris overeenkomstig het bepaalde bij en krachtens
      [artikel 7 van de Wet rechtspositie rechterlijke ambtenaren][ref1], een bij algemene maatregel van bestuur vast te
      stellen salaris behorende bij de vervulling van de functie van voorzitter onderscheidenlijk ander rechterlijk lid
      ontvangt, en dat daarop de [artikelen 6][ref2], [13 tot en met 15][ref3], [17, eerste tot en met vijfde lid][ref4],
      en [18 tot en met 19 van de Wet rechtspositie rechterlijke ambtenaren][ref5] van overeenkomstige toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel18
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0008365
