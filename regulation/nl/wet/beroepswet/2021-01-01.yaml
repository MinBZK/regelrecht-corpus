        artikel: '18'
  - number: 3.c
    text: |-
      de voorzitter onderscheidenlijk het andere rechterlijk lid na het verstrijken van een benoemingsduur van ten
      minste zes aaneengesloten jaren, met ingang van de datum waarop hij zijn werkzaamheden als zodanig beëindigt,
      gedurende drie jaren een toelage ontvangt op het salaris dat hij overeenkomstig het bepaalde bij en krachtens
      [artikel 7 van de Wet rechtspositie rechterlijke ambtenaren][ref1] geniet, waarvan het bedrag gelijk is
      aan het verschil tussen dat salaris en de bij algemene maatregel van bestuur voor de functie van voorzitter
      onderscheidenlijk ander rechterlijk lid vast te stellen salarishoogte;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel7
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '7'
  - number: 3.d
    text: |-
      bij algemene maatregel van bestuur nadere regels worden gesteld over het salaris van de leden van het bestuur en de
      onkostenvergoeding van de voorzitter en het andere rechterlijk lid;
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel3
  - number: 3.e
    text: de griffie alle werkdagen gedurende ten minste zes uren per dag is geopend;
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel3
  - number: 3.f
    text: de voorzitter en het andere rechterlijk lid tevens staatsraad of staatsraad in buitengewone dienst kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel3
  - number: 3.g
    text: |-
      de voorzitter en het andere rechterlijk lid van het bestuur niet tevens lid kunnen zijn van het bestuur van een
      rechtbank, het bestuur van een gerechtshof of het bestuur van het College van Beroep voor het bedrijfsleven,
      behoudens in het geval van tijdelijke waarneming, en het niet-rechterlijk lid van het bestuur, naast het geval van
      tijdelijke waarneming, slechts in bijzondere gevallen tevens lid kan zijn van het bestuur van één rechtbank, het
      bestuur van één gerechtshof of het bestuur van het College van Beroep voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel3
  - number: 3a
    text: |-
      De Centrale Raad van Beroep vormt en bezet op voorstel van de president grote kamers. Deze bestaan uit vijf leden,
      van wie een als voorzitter optreedt.
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel3a
  - number: '4.1'
    text: |-
      Op de leden met rechtspraak belast is de [Wet rechtspositie rechterlijke ambtenaren][ref1], voor zover betrekking
      hebbend op rechterlijke ambtenaren met rechtspraak belast, met uitzondering van de [artikelen 5a][ref2],
      [5b][ref3], [5c, vierde tot en met zesde lid][ref4], en [5g, tweede lid, onderdeel a, en vierde lid][ref5], van
      overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008365
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel5b
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel5c
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel5g
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel4
    references:
