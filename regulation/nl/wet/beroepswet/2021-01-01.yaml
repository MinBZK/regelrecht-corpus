        bwb_id: BWBR0008365
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0008365
        artikel: '46'
  - number: 4.1.e
    text: |-
      zij voor de overeenkomstige toepassing van [artikel 13][ref1] worden gelijkgesteld met rechterlijke ambtenaren van
      wie de eerste benoeming een ambt bij een gerechtshof of rechtbank betreft;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel13
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: '13'
  - number: 4.1.f
    text: het bestuur de werkzaamheden van de leden met rechtspraak belast verdeelt; en
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel4
  - number: 4.1.g
    text: |-
      het lid met rechtspraak belast, dat tevens president is van de Centrale Raad van Beroep, ten aanzien van hen
      bevoegd is tot het opleggen van de disciplinaire maatregel van schriftelijke berisping, het verrichten van de
      beoordeling, bedoeld in [artikel 44, zesde lid][ref1], en het doen van een verzoek aan de procureur-generaal bij de
      Hoge Raad, bedoeld in [artikel 46o, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
    url: https://wetten.overheid.nl/BWBR0002170/2021-01-01#Artikel4
