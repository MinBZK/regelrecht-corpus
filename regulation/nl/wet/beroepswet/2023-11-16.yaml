  - number: 4a
    text: |-
      De leden met rechtspraak belast worden voor de overeenkomstige toepassing van
      [artikel 54a van de Wet rechtspositie rechterlijke ambtenaren][ref1] gelijkgesteld met een rechterlijk ambtenaar
      als bedoeld in [artikel 1, onderdeel b, onder 2° en 3°, van de Wet op de rechterlijke organisatie][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel54a
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel1
