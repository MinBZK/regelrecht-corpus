  - number: '18'
    text: |-
      1 Een belanghebbende en het bestuursorgaan kunnen bij de Centrale Raad van Beroep hoger beroep instellen tegen een
      uitspraak van de rechtbank als bedoeld in [afdeling 8.2.6 van de Algemene wet bestuursrecht][ref1] en tegen een
      uitspraak van de voorzieningenrechter van de rechtbank als bedoeld in [artikel 8:86 van die wet][ref2], inzake:

      a. een besluit of een andere handeling van een bestuursorgaan waarbij een ambtenaar als bedoeld
      in [artikel 1 van de Ambtenarenwet][ref3] als zodanig of een dienstplichtige als bedoeld in
      [hoofdstuk 2 van de Kaderwet dienstplicht][ref4] als zodanig, hun nagelaten betrekkingen of hun rechtverkrijgenden
      belanghebbende zijn, en

      b. een besluit, genomen op grond van een wettelijk voorschrift dat is opgenomen in de bijlage die bij deze wet
      behoort.

      2 Geen hoger beroep kan worden ingesteld tegen:

      a. een uitspraak van de rechtbank na toepassing van
      [artikel 8:54, eerste lid, van de Algemene wet bestuursrecht][ref5],

      b. een uitspraak van de rechtbank als bedoeld in [artikel 8:54a van die wet][ref6],

      c. een uitspraak van de rechtbank als bedoeld in [artikel 8:55, vijfde lid, van die wet][ref7],

      d. een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:84, tweede lid, van die wet][ref8], en

      e. een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:75][ref9], in verband met
      [artikel 8:84, vierde lid, van die wet][ref10].

      3 Tegelijkertijd met het hoger beroep tegen de in het eerste lid bedoelde uitspraak kan hoger beroep worden
      ingesteld tegen:

      a. een tussenuitspraak als bedoeld in [artikel 8:80a van de Algemene wet bestuursrecht][ref11]; of

      b. een andere beslissing van de rechtbank.


