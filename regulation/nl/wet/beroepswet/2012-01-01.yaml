  - number: '24'
    text: |-
      De Centrale Raad van Beroep bevestigt de uitspraak van de rechtbank, hetzij met overneming, hetzij met verbetering
      van de gronden, of doet, met gehele of gedeeltelijke vernietiging van de uitspraak, hetgeen de rechtbank zou
      behoren te doen.
    url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#Artikel24
  - number: '25'
    text: |-
      1 Indien de Centrale Raad van Beroep de uitspraak van de rechtbank geheel of gedeeltelijk vernietigt, houdt de
      uitspraak tevens in dat aan de indiener van het beroepschrift het door hem betaalde griffierecht door de door de
      Centrale Raad van Beroep aangewezen rechtspersoon wordt vergoed.

      2 In de overige gevallen kan de uitspraak inhouden dat het betaalde griffierecht door de door de Centrale Raad van
      Beroep aangewezen rechtspersoon geheel of gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#Artikel25
  - number: '26'
    text: |-
      1 De Centrale Raad van Beroep wijst de zaak terug naar de rechtbank die deze in eerste aanleg heeft behandeld,
      indien:

      a. de rechtbank haar onbevoegdheid of de niet-ontvankelijkheid van het beroep heeft uitgesproken en de
      Centrale Raad van Beroep deze uitspraak vernietigt met bevoegdverklaring van de rechtbank onderscheidenlijk
      ontvankelijkverklaring van het beroep, of

      b. de Centrale Raad van Beroep om andere redenen dan bedoeld in onderdeel *a* van oordeel is dat de zaak opnieuw
      door de rechtbank moet worden behandeld.

      2 De griffier zendt de gedingstukken, onder medezending van een afschrift van de uitspraak, zo spoedig mogelijk aan
      de griffier van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#Artikel26
  - number: '27'
    text: |-
      In de gevallen, bedoeld in [artikel 26, eerste lid, onderdeel ][ref1], kan de Centrale Raad van Beroep de zaak
      zonder terugwijzing afdoen, indien zij naar zijn oordeel geen nadere behandeling door de rechtbank behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002170#Artikel26
    url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002170
        artikel: '26'
        hoofdstuk: II
  - number: '28'
    text: |-
      Indien de Centrale Raad van Beroep van oordeel is dat de uitspraak is gedaan door een andere rechtbank dan de
      bevoegde, kan hij de onbevoegdheid voor gedekt verklaren en de uitspraak als bevoegdelijk gedaan aanmerken.
    url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#Artikel28
  - number: 28a
    text: |-
      Bij een wijziging van de bijlage die bij deze wet behoort, blijft de bijlage zoals deze luidde voor het tijdstip
      van inwerkingtreding van de wijziging van toepassing ten aanzien van:

      a. de mogelijkheid om hoger beroep in te stellen tegen een uitspraak die voor dat tijdstip is gedaan;

      b. de in [artikel 19][ref1] bedoelde gevolgen van dat hoger beroep;

      c. de hoogte van het griffierecht bij hoger beroep tegen een uitspraak inzake een besluit als bedoeld in
      [artikel 22, tweede lid, onderdeel a, onder 1°][ref2], dat voor dat tijdstip is bekendgemaakt;

      d. de hoogte van het griffierecht bij beroep tegen een besluit als bedoeld in
      [artikel 8:41, derde lid, onderdeel a, onder 1°, van de Algemene wet bestuursrecht][ref3], dat voor dat tijdstip
      is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002170#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002170#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel841
