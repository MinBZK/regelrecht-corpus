  - number: '22'
    text: |-
      1 Van de indiener van het beroepschrift wordt door de griffier een griffierecht geheven. Indien de uitspraak van
      de rechtbank, voor zover daartegen hoger beroep is ingesteld, betrekking heeft op meer dan één besluit of indien
      het een gezamenlijk beroepschrift van twee of meer indieners ter zake van dezelfde uitspraak betreft, is eenmaal
      griffierecht verschuldigd. In die gevallen bedraagt het griffierecht het hoogste op grond van het tweede lid ter
      zake van een van de besluiten onderscheidenlijk door een van de indieners verschuldigde griffierecht.

      2 Het griffierecht bedraagt:

      a. € 115, indien door een natuurlijke persoon hoger beroep is ingesteld tegen een uitspraak inzake:

      1°. een besluit, genomen op grond van een wettelijk voorschrift dat is opgenomen in de onderdelen B
      en C, onder 1 tot en met 25, 29 en 33, dit laatste voor zover het een besluit betreft gebaseerd op
      [artikel 30d van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], van de bijlage die bij deze wet
      behoort,

      2°. een besluit inzake een uitkering bij werkloosheid of ziekte, genomen ten aanzien van een ambtenaar
      als bedoeld in [artikel 1 van de Ambtenarenwet][ref2] als zodanig of een dienstplichtige als bedoeld in
      [hoofdstuk 2 van de Kaderwet dienstplicht][ref3] als zodanig, hun nagelaten betrekkingen of hun rechtverkrijgenden,
      of

      3°. een besluit inzake een uitkering op grond van blijvende arbeidsongeschiktheid op grond van een wettelijk
      voorschrift waarbij de natuurlijke persoon ter zake van zijn arbeidsongeschiktheid vanwege het Rijk
      invaliditeitspensioen is verzekerd, of een besluit, genomen op grond van artikel P 9 van de Algemene burgerlijke
      pensioenwet,

      b. € 232 indien door een natuurlijke persoon hoger beroep is ingesteld tegen een uitspraak inzake een ander besluit
      dan een besluit als bedoeld in onderdeel *a*, tenzij bij wet anders is bepaald, en

      c. € 466 indien anders dan door een natuurlijke persoon hoger beroep is ingesteld.

      3 Indien het bestuursorgaan hoger beroep heeft ingesteld en de uitspraak van de rechtbank wordt in stand gelaten,
      wordt van de desbetreffende rechtspersoon een griffierecht geheven van € 466.

      4 De griffier wijst de indiener van het beroepschrift op de verschuldigdheid van het griffierecht en deelt hem
      mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn
      bijgeschreven op de rekening van de Centrale Raad van Beroep dan wel ter griffie dient te zijn gestort. Indien het
      bedrag niet binnen deze termijn is bijgeschreven of gestort, wordt het hoger beroep niet-ontvankelijk verklaard,
      tenzij redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.

      5 Indien het hoger beroep wordt ingetrokken omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van
      het beroepschrift is tegemoetgekomen, wordt het door de indiener betaalde griffierecht aan hem vergoed door de
      desbetreffende rechtspersoon. In de overige gevallen kan de desbetreffende rechtspersoon, indien het hoger beroep
      wordt ingetrokken, het betaalde griffierecht geheel of gedeeltelijk vergoeden.

      6 De in het tweede en derde lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden gewijzigd voor
      zover de consumentenprijsindex daartoe aanleiding geeft.

      7 Dit artikel is van overeenkomstige toepassing op een verzoek om herziening.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30d
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk2
