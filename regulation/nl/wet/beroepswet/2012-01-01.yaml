  - number: '19'
    text: |-
      1 De werking van een uitspraak met betrekking tot een besluit, genomen op grond van een wettelijk voorschrift dat
      is opgenomen in onderdeel C, onder 1 tot en met 24, van de bijlage die bij deze wet behoort, wordt opgeschort,
      totdat de termijn voor het instellen van hoger beroep is verstreken of, indien hoger beroep is ingesteld, op het
      hoger beroep is beslist.

      2 Het eerste lid geldt niet indien de uitspraak een beroep tegen het niet tijdig nemen van een besluit betreft.
    url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#Artikel19
  - number: '20'
    text: |-
      1 De griffier doet van het ingestelde hoger beroep zo spoedig mogelijk mededeling aan de griffier van de rechtbank
      die de uitspraak heeft gedaan.

      2 De griffier van de rechtbank, bedoeld in het eerste lid, zendt de gedingstukken met vier afschriften van het
      proces-verbaal van de zitting, voor zover dit op de zaak betrekking heeft, en vier afschriften van de uitspraak
      binnen een week na ontvangst van de in het eerste lid bedoelde mededeling aan de griffier van de Centrale Raad
      van Beroep.
    url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#Artikel20
  - number: '21'
    text: |-
      1 Op het hoger beroep is [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], met uitzondering van
      [afdeling 8.1.1][ref2] en de [artikelen 8:10][ref3], [8:13][ref4], [8:41][ref5], [8:51a, eerste lid][ref6],
      [8:74][ref7] en [8:82][ref8], van overeenkomstige toepassing, voor zover in dit hoofdstuk niet anders is bepaald.
      [Artikel 8:86, eerste lid][ref9], kan slechts worden toegepast indien een enkelvoudige kamer van de rechtbank
      uitspraak op het beroep heeft gedaan.

      2 De zaken die bij de Centrale Raad van Beroep aanhangig worden gemaakt, worden in behandeling genomen door een
      meervoudige kamer.

      3 Indien een zaak die door een enkelvoudige kamer van de rechtbank is behandeld naar het oordeel van de meervoudige
      kamer geschikt is voor verdere behandeling door één rechter, kan zij deze verwijzen naar een enkelvoudige kamer.

      4 Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.

      5 Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.

      6 De Centrale Raad van Beroep kan het bestuursorgaan opdragen een gebrek in het bestreden besluit te herstellen
      of te laten herstellen. De vorige volzin vindt geen toepassing, indien belanghebbenden die niet als partij aan het
      geding deelnemen daardoor onevenredig kunnen worden benadeeld.


