  - number: '5'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over de werkwijze van de Centrale Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#Artikel5
  - number: '6'
    text: |-
      De rechtbanken en de presidenten geven inlichtingen wanneer die door de president van de Centrale Raad van Beroep
      voor de behandeling van een zaak noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#Artikel6
  - number: '17'
    text: |-
      1 Indien bij de Centrale Raad van Beroep beroep kan worden ingesteld, is
      [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], met uitzondering van de
      [artikelen 8:1, eerste en tweede lid][ref2], [8:4][ref3], [8:5][ref4], [8:6, eerste lid][ref5], [8:7][ref6],
      [8:8][ref7] , [8:9][ref8], [8:10][ref9] , [8:13][ref10] en [8:51a, eerste lid][ref11], van overeenkomstige
      toepassing, met dien verstande dat [artikel 8:86, eerste lid][ref12], slechts kan worden toegepast indien
      partijen daarvoor toestemming hebben gegeven. Ook hierop worden partijen in de uitnodiging, bedoeld in
      [artikel 8:83, eerste lid][ref13], gewezen.

      2 De zaken die bij de Centrale Raad van Beroep aanhangig worden gemaakt, worden in behandeling genomen door een
      meervoudige kamer.

      3 Indien een zaak naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door één rechter,
      kan zij deze verwijzen naar een enkelvoudige kamer.

      4 Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.

      5 Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.

      6 De Centrale Raad van Beroep kan het bestuursorgaan opdragen een gebrek in het bestreden besluit te herstellen
      of te laten herstellen. De vorige volzin vindt geen toepassing, indien belanghebbenden die niet als partij aan het
      geding deelnemen daardoor onevenredig kunnen worden benadeeld.


