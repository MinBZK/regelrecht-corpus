preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de organisatie en procedure van de Centrale Raad van
    Beroep en de raden van beroep opnieuw te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: Er is een Centrale Raad van Beroep, gevestigd te Utrecht.
    url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#Artikel1
  - number: '2'
    text: |-
      1 Bij de Centrale Raad van Beroep zijn werkzaam:

      a. leden met rechtspraak belast, en

      b. gerechtsambtenaren.

      2 De leden met rechtspraak belast, werkzaam bij de Centrale Raad van Beroep zijn:

      a. senior raadsheren;

      b. raadsheren;

      c. raadsheren-plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0002170/2012-01-01#Artikel2
  - number: '3'
    text: |-
      Het bij en krachtens de [afdelingen 1][ref1], [1A][ref2], [2][ref3] en
      [6 van hoofdstuk 2 van de Wet op de rechterlijke organisatie][ref4] bepaalde is, met uitzondering van de
      [artikelen 2][ref5], [3][ref6], [9][ref7], [11][ref8], [20][ref9] en [21][ref10], van overeenkomstige toepassing
      op de Centrale Raad van Beroep, met dien verstande dat:

      a. het bestuur bestaat uit een voorzitter, een niet-rechterlijk lid en ten hoogste vier andere leden met rechtspraak
      belast van de Centrale Raad van Beroep als bedoeld in [artikel 2, tweede lid, onderdelen a en b][ref11];

      b. de voorzitter onderscheidenlijk de andere leden met rechtspraak belast, bedoeld in onderdeel a, in verband met
      het verrichten van de werkzaamheden als voorzitter onderscheidenlijk lid van het bestuur een toelage ontvangen op
      het salaris dat zij overeenkomstig de Wet rechtspositie rechterlijke ambtenaren genieten, waarvan het bedrag gelijk
      is aan het verschil tussen dat salaris en de bij algemene maatregel van bestuur voor de functie van voorzitter
      onderscheidenlijk lid van het bestuur vast te stellen salarishoogte;

      c. de voorzitter onderscheidenlijk een ander lid met rechtspraak belast, bedoeld in onderdeel a, na het
      verstrijken van een benoemingsduur van ten minste zes aaneengesloten jaren, met ingang van de datum waarop
      hij zijn werkzaamheden als zodanig beëindigt, gedurende drie jaren een toelage ontvangt op het salaris dat
      hij overeenkomstig de [Wet rechtspositie rechterlijke ambtenaren][ref12] geniet, waarvan het bedrag gelijk is
      aan het verschil tussen dat salaris en de bij algemene maatregel van bestuur voor de functie van voorzitter
      onderscheidenlijk lid van het bestuur vast te stellen salarishoogte;

      d. bij algemene maatregel van bestuur nadere regels worden gesteld over de onkostenvergoeding van de voorzitter en
      de andere leden met rechtspraak belast, bedoeld in onderdeel a, en de bezoldiging van het niet-rechterlijk lid;

      e. een lid van het bestuur, niet zijnde voorzitter of niet-rechterlijk lid, wordt ontslagen onderscheidenlijk
      geschorst als lid van het bestuur indien hij als lid met rechtspraak belast wordt ontslagen onderscheidenlijk
      geschorst;

      f. een lid van het bestuur, niet zijnde voorzitter of niet-rechterlijk lid, op eigen verzoek wordt ontslagen;

      g. de voorzitter en de andere leden, niet zijnde niet-rechterlijk lid, tevens staatsraad of staatsraad in
      buitengewone dienst kunnen zijn;

      h. ten aanzien van een lid van het bestuur, niet zijnde voorzitter of niet-rechterlijk lid, de bij en krachtens de
      [Wet rechtspositie rechterlijke ambtenaren][ref13] aan het bestuur toegekende bevoegdheden worden uitgeoefend door
      het bestuur uitgezonderd dat lid;

      i. het bestuur bevoegd is organisatorische eenheden in te stellen die belast worden met het behandelen en beslissen
      van de soorten zaken die door het bestuur aan die eenheden worden opgedragen.


