preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de organisatie en procedure van de Centrale Raad van
    Beroep en de raden van beroep opnieuw te regelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: Er is een Centrale Raad van Beroep, gevestigd te Utrecht.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel1
  - number: '2.1'
    text: 'Bij de Centrale Raad van Beroep zijn werkzaam:'
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel2
  - number: 2.1.a
    text: leden met rechtspraak belast, en
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel2
  - number: 2.1.b
    text: gerechtsambtenaren.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel2
  - number: '2.2'
    text: 'De leden met rechtspraak belast, werkzaam bij de Centrale Raad van Beroep zijn:'
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel2
  - number: 2.2.a
    text: coördinerend vice-presidenten,
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel2
  - number: 2.2.b
    text: vice-presidenten,
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel2
  - number: 2.2.c
    text: raadsheren,
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel2
  - number: 2.2.d
    text: raadsheren-plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel2
  - number: '2.3'
    text: |-
      Alvorens zijn ambt te aanvaarden legt een lid met rechtspraak belast of een gerechtsauditeur de eed of belofte af
      die voor een rechterlijk ambtenaar is voorgeschreven. Bij een opvolgende benoeming wordt een lid met rechtspraak
      belast niet opnieuw beëdigd.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel2
  - number: '3'
    text: |-
      Het bij en krachtens de [afdelingen 1][ref1], [2](onbekend) en
      [6 van hoofdstuk 2 van de Wet op de rechterlijke organisatie][ref2] bepaalde is, met uitzondering van de
      [artikelen 2][ref3], [3][ref4], [9][ref5], [20][ref6] en [21][ref7], van overeenkomstige toepassing op de
      Centrale Raad van Beroep, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Afdeling1
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Afdeling2
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0001830#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0001830#Artikel9
      [ref6]: https://wetten.overheid.nl/BWBR0001830#Artikel20
      [ref7]: https://wetten.overheid.nl/BWBR0001830#Artikel21
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001830
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0001830
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0001830
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0001830
        artikel: '9'
      - id: ref6
        bwb_id: BWBR0001830
        artikel: '20'
      - id: ref7
        bwb_id: BWBR0001830
        artikel: '21'
  - number: 3.a
    text: |-
      het bestuur bestaat uit een voorzitter, een niet-rechterlijk lid en ten hoogste vier andere leden met rechtspraak
      belast van de Centrale Raad van Beroep als bedoeld in [artikel 2, tweede lid, onderdelen a tot en met c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002170#Artikel2
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002170
        artikel: '2'
  - number: 3.b
    text: |-
      de voorzitter onderscheidenlijk de andere leden met rechtspraak belast, bedoeld in onderdeel a, in verband met het
      verrichten van de werkzaamheden als voorzitter onderscheidenlijk lid van het bestuur een toelage ontvangen op het
      salaris dat zij overeenkomstig de Wet rechtspositie rechterlijke ambtenaren genieten, waarvan het bedrag gelijk
      is aan het verschil tussen dat salaris en de bij algemene maatregel van bestuur voor de functie van voorzitter
      onderscheidenlijk lid van het bestuur vast te stellen salarishoogte;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel3
  - number: 3.c
    text: |-
      bij algemene maatregel van bestuur nadere regels worden gesteld over de onkostenvergoeding van de voorzitter en de
      andere leden met rechtspraak belast, bedoeld in onderdeel a, en de bezoldiging van het niet-rechterlijk lid;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel3
  - number: 3.d
    text: |-
      een lid van het bestuur, niet zijnde voorzitter of niet-rechterlijk lid, wordt ontslagen onderscheidenlijk
      geschorst als lid van het bestuur indien hij als lid met rechtspraak belast wordt ontslagen onderscheidenlijk
      geschorst;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel3
  - number: 3.e
    text: een lid van het bestuur, niet zijnde voorzitter of niet-rechterlijk lid, op eigen verzoek wordt ontslagen;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel3
  - number: 3.f
    text: |-
      de voorzitter en de andere leden, niet zijnde niet-rechterlijk lid, tevens staatsraad in buitengewone dienst kunnen
      zijn;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel3
  - number: 3.g
    text: |-
      het bestuur bevoegd is organisatorische eenheden in te stellen die belast worden met het behandelen en beslissen
      van de soorten zaken die door het bestuur aan die eenheden worden opgedragen.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel3
  - number: '4.1'
    text: |-
      Op de leden met rechtspraak belast is het bepaalde bij en krachtens de
      [Wet rechtspositie rechterlijke ambtenaren][ref1], met uitzondering van het bepaalde bij en krachtens de [artikelen
      1b](onbekend), [1g](onbekend) en [10][ref2] en het krachtens [artikel 54, eerste lid][ref3], ter aanvulling hiervan
      bepaalde, van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001830
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001830#Artikel54
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001830
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0001830
        artikel: '54'
  - number: 4.1.a
    text: |-
      wat hun bezoldiging, onkostenvergoeding en benoeming betreft de coördinerend vice-presidenten, de vice-presidenten,
      de raadsheren en de raadsheren-plaatsvervangers worden gelijkgesteld met diezelfde ambten bij een gerechtshof;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel4
  - number: 4.1.b
    text: het bestuur wordt aangemerkt als hun functionele autoriteit;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel4
  - number: 4.1.c
    text: |-
      het bestuur de lijst van aanbeveling opmaakt bij het openvallen van een plaats van coördinerend vice-president,
      vice-president, raadsheer of raadsheer-plaatsvervanger, de raadsheren-plaatsvervangers oproept voor het verrichten
      van werkzaamheden, en de werkzaamheden van de leden met rechtspraak belast verdeelt;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel4
  - number: 4.1.d
    text: |-
      voor de overeenkomstige toepassing van [artikel 46 van de Wet rechtspositie rechterlijke ambtenaren](onbekend) de
      leden met rechtspraak belast worden gelijkgesteld met rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof
      of een rechtbank;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel4
  - number: 4.1.e
    text: |-
      het lid met rechtspraak belast, dat tevens voorzitter van het bestuur is, bevoegd is tot het opleggen van de
      disciplinaire maatregel van schriftelijke waarschuwing;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel4
  - number: 4.1.f
    text: |-
      voor de overeenkomstige toepassing van [artikel 46a van de Wet rechtspositie rechterlijke ambtenaren](onbekend)
      onder functionele autoriteit het bestuur, uitgezonderd het niet-rechterlijk lid, wordt verstaan;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel4
  - number: 4.1.g
    text: |-
      voor de overeenkomstige toepassing van [artikel 46o, tweede lid, van de Wet rechtspositie rechterlijke ambtenaren]
      (onbekend) onder functionele autoriteit het lid met rechtspraak belast, dat tevens voorzitter van het bestuur is,
      wordt verstaan.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel4
  - number: '4.2'
    text: |-
      Op de gerechtsauditeurs is het bepaalde bij of krachtens de [Wet rechtspositie rechterlijke ambtenaren][ref1],
      voor zover betrekking hebbend op gerechtsauditeurs, van overeenkomstige toepassing, met dien verstande
      dat het bestuur wordt aangemerkt als functionele autoriteit. Voor de overeenkomstige toepassing van
      [artikel 46 van de Wet rechtspositie rechterlijke ambtenaren][ref2] worden de gerechtsauditeurs gelijkgesteld met
      rechterlijke ambtenaren die werkzaam zijn bij een gerechtshof of een rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0001830
      [ref2]: https://wetten.overheid.nl/BWBR0001830#Artikel46
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001830
      - id: ref2
        bwb_id: BWBR0001830
        artikel: '46'
  - number: '5'
    text: Bij algemene maatregel van bestuur kunnen regels worden gesteld over de werkwijze van de Centrale Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel5
  - number: '6'
    text: |-
      De rechtbanken en de presidenten geven inlichtingen wanneer die door de president van de Centrale Raad van Beroep
      voor de behandeling van een zaak noodzakelijk worden geacht.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel6
  - number: '17.1'
    text: |-
      Indien bij de Centrale Raad van Beroep beroep kan worden ingesteld, is
      [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], met uitzondering van de
      [artikelen 8:1, eerste en tweede lid][ref2], [8:4][ref3], [8:5][ref4], [8:6, eerste lid][ref5], [8:7][ref6],
      [8:8][ref7] , [8:9][ref8], [8:10][ref9] en [8:13][ref10], van overeenkomstige toepassing, met dien verstande
      dat [artikel 8:86, eerste lid][ref11], slechts kan worden toegepast indien partijen daarvoor toestemming hebben
      gegeven. Ook hierop worden partijen in de uitnodiging, bedoeld in [artikel 8:83, eerste lid][ref12], gewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref8]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref10]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref11]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref12]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel17
    references:
