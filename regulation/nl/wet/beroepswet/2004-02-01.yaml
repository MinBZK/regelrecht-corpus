  - number: '17.2'
    text: |-
      De zaken die bij de Centrale Raad van Beroep aanhangig worden gemaakt, worden in behandeling genomen door een
      meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel17
  - number: '17.3'
    text: |-
      Indien een zaak naar het oordeel van de meervoudige kamer geschikt is voor verdere behandeling door één rechter,
      kan zij deze verwijzen naar een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel17
  - number: '17.4'
    text: |-
      Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel17
  - number: '17.5'
    text: |-
      Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel17
  - number: '18.1'
    text: |-
      Een belanghebbende en het bestuursorgaan kunnen bij de Centrale Raad van Beroep hoger beroep instellen tegen een
      uitspraak van de rechtbank als bedoeld in [afdeling 8.2.6 van de Algemene wet bestuursrecht][ref1] en tegen een
      uitspraak van de voorzieningenrechter van de rechtbank als bedoeld in [artikel 8:86 van die wet][ref2], inzake:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling8.2.6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 8.2.6
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 18.1.a
    text: |-
      een besluit of een andere handeling van een bestuursorgaan waarbij een ambtenaar als bedoeld
      in [artikel 1 van de Ambtenarenwet][ref1] als zodanig of een dienstplichtige als bedoeld in
      [hoofdstuk 2 van de Kaderwet dienstplicht][ref2] als zodanig, hun nagelaten betrekkingen of hun rechtverkrijgenden
      belanghebbende zijn, en


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008589
        hoofdstuk: '2'
  - number: 18.1.b
    text: |-
      een besluit, genomen op grond van een wettelijk voorschrift dat is opgenomen in de bijlage die bij deze wet
      behoort.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel18
  - number: '18.2'
    text: 'Geen hoger beroep kan worden ingesteld tegen:'
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel18
  - number: 18.2.a
    text: |-
      een uitspraak van de rechtbank na toepassing van [artikel 8:54, eerste lid, van de Algemene wet bestuursrecht][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 18.2.b
    text: |-
      een uitspraak van de rechtbank als bedoeld in [artikel 8:55, vijfde lid, van die wet][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 18.2.c
    text: |-
      een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:84, tweede lid, van die wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 18.2.d
    text: |-
      een uitspraak van de voorzieningenrechter als bedoeld in [artikel 8:75][ref1], in verband met
      [artikel 8:84, vierde lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '18.3'
    text: |-
      Tegen andere beslissingen van de rechtbank onderscheidenlijk de voorzieningenrechter kan slechts tegelijkertijd met
      het hoger beroep tegen de in het eerste lid bedoelde uitspraak hoger beroep worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel18
  - number: '19'
    text: |-
      De werking van een uitspraak met betrekking tot een besluit, genomen op grond van een wettelijk voorschrift dat is
      opgenomen in onderdeel C, onder 1 tot en met 24, van de bijlage die bij deze wet behoort, wordt opgeschort, totdat
      de termijn voor het instellen van hoger beroep is verstreken of, indien hoger beroep is ingesteld, op het hoger
      beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel19
  - number: '20.1'
    text: |-
      De griffier doet van het ingestelde hoger beroep zo spoedig mogelijk mededeling aan de griffier van de rechtbank
      die de uitspraak heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel20
  - number: '20.2'
    text: |-
      De griffier van de rechtbank, bedoeld in het eerste lid, zendt de gedingstukken met vier afschriften van het
      proces-verbaal van de zitting, voor zover dit op de zaak betrekking heeft, en vier afschriften van de uitspraak
      binnen een week na ontvangst van de in het eerste lid bedoelde mededeling aan de griffier van de Centrale Raad
      van Beroep.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel20
  - number: '21.1'
    text: |-
      Op het hoger beroep is [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], met uitzondering van afdeling 8.1.1
      en de artikelen 8:10, 8:13, 8:41, 8:74 en 8:82, van overeenkomstige toepassing, voor zover in dit hoofdstuk niet
      anders is bepaald. Artikel 8:86, eerste lid, kan slechts worden toegepast indien een enkelvoudige kamer van de
      rechtbank uitspraak op het beroep heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '21.2'
    text: |-
      De zaken die bij de Centrale Raad van Beroep aanhangig worden gemaakt, worden in behandeling genomen door een
      meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel21
  - number: '21.3'
    text: |-
      Indien een zaak die door een enkelvoudige kamer van de rechtbank is behandeld naar het oordeel van de meervoudige
      kamer geschikt is voor verdere behandeling door één rechter, kan zij deze verwijzen naar een enkelvoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel21
  - number: '21.4'
    text: |-
      Indien een zaak naar het oordeel van de enkelvoudige kamer ongeschikt is voor behandeling door één rechter,
      verwijst zij deze naar een meervoudige kamer.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel21
  - number: '21.5'
    text: |-
      Verwijzing kan geschieden in elke stand van het geding. Een verwezen zaak wordt voortgezet in de stand waarin zij
      zich bevindt.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel21
  - number: 21a.1
    text: |-
      In geval van intrekking van het hoger beroep door het bestuursorgaan kan het bestuursorgaan
      op verzoek van een partij bij afzonderlijke uitspraak met overeenkomstige toepassing van
      [artikel 8:75 van de Algemene wet bestuursrecht][ref1] in de kosten worden veroordeeld. Indien het hoger beroep
      mondeling wordt ingetrokken, wordt het verzoek door de partij die daarbij aanwezig is mondeling gedaan tegelijk
      met de intrekking van het hoger beroep. Indien aan dit vereiste niet is voldaan, wordt het verzoek niet-
      ontvankelijk verklaard. Indien het hoger beroep schriftelijk wordt ingetrokken, wordt het verzoek schriftelijk
      gedaan. De [artikelen 6:5 tot en met 6:9][ref2], [6:11][ref3], [6:14][ref4], [6:15][ref5], [6:17][ref6] en
      [6:21 van de Algemene wet bestuursrecht][ref7] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref7
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 21a.2
    text: |-
      [Artikel 8:73a, tweede en derde lid, van de Algemene wet bestuursrecht][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '22.1'
    text: |-
      Van de indiener van het beroepschrift wordt door de griffier een griffierecht geheven. Indien de uitspraak van
      de rechtbank, voor zover daartegen hoger beroep is ingesteld, betrekking heeft op meer dan één besluit of indien
      het een gezamenlijk beroepschrift van twee of meer indieners ter zake van dezelfde uitspraak betreft, is eenmaal
      griffierecht verschuldigd. In die gevallen bedraagt het griffierecht het hoogste op grond van het tweede lid ter
      zake van een van de besluiten onderscheidenlijk door een van de indieners verschuldigde griffierecht.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: '22.2'
    text: 'Het griffierecht bedraagt:'
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: 22.2.a
    text: '€ 102, indien door een natuurlijke persoon hoger beroep is ingesteld tegen een uitspraak inzake:'
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: 22.2.a.1°
    text: |-
      een besluit, genomen op grond van een wettelijk voorschrift dat is opgenomen in de onderdelen B en C, onder 1 tot
      en met 25 en 29, van de bijlage die bij deze wet behoort,
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: 22.2.a.2°
    text: |-
      een besluit inzake een uitkering bij werkloosheid of ziekte, genomen ten aanzien van een ambtenaar als
      bedoeld in [artikel 1 van de Ambtenarenwet][ref1] als zodanig of een dienstplichtige als bedoeld in
      [hoofdstuk 2 van de Kaderwet dienstplicht][ref2] als zodanig, hun nagelaten betrekkingen of hun rechtverkrijgenden,
      of


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008589#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008589
        hoofdstuk: '2'
  - number: 22.2.a.3°
    text: |-
      een besluit inzake een uitkering op grond van blijvende arbeidsongeschiktheid op grond van een wettelijk
      voorschrift waarbij de natuurlijke persoon ter zake van zijn arbeidsongeschiktheid vanwege het Rijk
      invaliditeitspensioen is verzekerd, of een besluit, genomen op grond van artikel P 9 van de Algemene burgerlijke
      pensioenwet,
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: 22.2.b
    text: |-
      € 205 indien door een natuurlijke persoon hoger beroep is ingesteld tegen een uitspraak inzake een ander besluit
      dan een besluit als bedoeld in onderdeel *a*, tenzij bij wet anders is bepaald, en
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: 22.2.c
    text: € 409 indien anders dan door een natuurlijke persoon hoger beroep is ingesteld.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: '22.3'
    text: |-
      Indien het bestuursorgaan hoger beroep heeft ingesteld en de uitspraak van de rechtbank wordt in stand gelaten,
      wordt van de desbetreffende rechtspersoon een griffierecht geheven van € 409.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: '22.4'
    text: |-
      De griffier wijst de indiener van het beroepschrift op de verschuldigdheid van het griffierecht en deelt hem
      mee dat het verschuldigde bedrag binnen vier weken na de dag van verzending van zijn mededeling dient te zijn
      bijgeschreven op de rekening van de Centrale Raad van Beroep dan wel ter griffie dient te zijn gestort. Indien het
      bedrag niet binnen deze termijn is bijgeschreven of gestort, wordt het hoger beroep niet-ontvankelijk verklaard,
      tenzij redelijkerwijs niet kan worden geoordeeld dat de indiener in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: '22.5'
    text: |-
      Indien het hoger beroep wordt ingetrokken omdat het bestuursorgaan geheel of gedeeltelijk aan de indiener van
      het beroepschrift is tegemoetgekomen, wordt het door de indiener betaalde griffierecht aan hem vergoed door de
      desbetreffende rechtspersoon. In de overige gevallen kan de desbetreffende rechtspersoon, indien het hoger beroep
      wordt ingetrokken, het betaalde griffierecht geheel of gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: '22.6'
    text: |-
      De in het tweede en derde lid genoemde bedragen kunnen bij algemene maatregel van bestuur worden gewijzigd voor
      zover het prijsindexcijfer van de gezinsconsumptie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: '22.7'
    text: Dit artikel is van overeenkomstige toepassing op een verzoek om herziening.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel22
  - number: '23.1'
    text: |-
      Van de verzoeker om een voorlopige voorziening wordt door de griffier een griffierecht geheven.
      [Artikel 22, eerste lid, tweede en derde volzin, tweede en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002170#Artikel22
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002170
        artikel: '22'
        hoofdstuk: II
  - number: '23.2'
    text: |-
      [Artikel 22, vierde lid][ref1], is van overeenkomstige toepassing, met dien verstande dat de termijn binnen welke
      de bijschrijving of storting van het verschuldigde bedrag dient plaats te vinden, twee weken bedraagt. De president
      kan een kortere termijn stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002170#Artikel22
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002170
        artikel: '22'
        hoofdstuk: II
  - number: '23.3'
    text: |-
      Indien het verzoek wordt ingetrokken omdat het bestuursorgaan, onderscheidenlijk de belanghebbende tot wie het
      bestreden besluit is gericht, aan de president schriftelijk heeft medegedeeld de uitvoering van het bestreden
      besluit hangende de procedure met betrekking tot de hoofdzaak op te schorten dan wel de gevraagde voorlopige
      maatregelen te zullen nemen, wordt het betaalde griffierecht door de griffier terugbetaald. In de overige gevallen
      kan de desbetreffende rechtspersoon, indien het verzoek wordt ingetrokken, het betaalde griffierecht geheel of
      gedeeltelijk vergoeden.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel23
  - number: '23.4'
    text: |-
      De uitspraak kan inhouden dat het betaalde griffierecht door de door de president aangewezen rechtspersoon geheel
      of gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel23
  - number: '23.5'
    text: |-
      Indien het verzoek is gedaan door het bestuursorgaan en het verzoek geheel of gedeeltelijk wordt toegewezen, kan
      de uitspraak inhouden dat het betaalde griffierecht door de griffier aan de desbetreffende rechtspersoon wordt
      terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel23
  - number: '23.6'
    text: |-
      Dit artikel is van overeenkomstige toepassing op een verzoek om voorlopige voorziening dat wordt gedaan nadat een
      verzoek om herziening is gedaan.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel23
  - number: '24'
    text: |-
      De Centrale Raad van Beroep bevestigt de uitspraak van de rechtbank, hetzij met overneming, hetzij met verbetering
      van de gronden, of doet, met gehele of gedeeltelijke vernietiging van de uitspraak, hetgeen de rechtbank zou
      behoren te doen.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel24
  - number: '25.1'
    text: |-
      Indien de Centrale Raad van Beroep de uitspraak van de rechtbank geheel of gedeeltelijk vernietigt, houdt de
      uitspraak tevens in dat aan de indiener van het beroepschrift het door hem betaalde griffierecht door de door de
      Centrale Raad van Beroep aangewezen rechtspersoon wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel25
  - number: '25.2'
    text: |-
      In de overige gevallen kan de uitspraak inhouden dat het betaalde griffierecht door de door de Centrale Raad van
      Beroep aangewezen rechtspersoon geheel of gedeeltelijk wordt vergoed.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel25
  - number: '26.1'
    text: |-
      De Centrale Raad van Beroep wijst de zaak terug naar de rechtbank die deze in eerste aanleg heeft behandeld,
      indien:
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel26
  - number: 26.1.a
    text: |-
      de rechtbank haar onbevoegdheid of de niet-ontvankelijkheid van het beroep heeft uitgesproken en de
      Centrale Raad van Beroep deze uitspraak vernietigt met bevoegdverklaring van de rechtbank onderscheidenlijk
      ontvankelijkverklaring van het beroep, of
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel26
  - number: 26.1.b
    text: |-
      de Centrale Raad van Beroep om andere redenen dan bedoeld in onderdeel *a* van oordeel is dat de zaak opnieuw door
      de rechtbank moet worden behandeld.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel26
  - number: '26.2'
    text: |-
      De griffier zendt de gedingstukken, onder medezending van een afschrift van de uitspraak, zo spoedig mogelijk aan
      de griffier van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel26
  - number: '27'
    text: |-
      In de gevallen, bedoeld in [artikel 26, eerste lid, onderdeel ][ref1], kan de Centrale Raad van Beroep de zaak
      zonder terugwijzing afdoen, indien zij naar zijn oordeel geen nadere behandeling door de rechtbank behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002170#Artikel26
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002170
        artikel: '26'
        hoofdstuk: II
  - number: '28'
    text: |-
      Indien de Centrale Raad van Beroep van oordeel is dat de uitspraak is gedaan door een andere rechtbank dan de
      bevoegde, kan hij de onbevoegdheid voor gedekt verklaren en de uitspraak als bevoegdelijk gedaan aanmerken.
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel28
  - number: 28a
    text: |-
      Bij een wijziging van de bijlage die bij deze wet behoort, blijft de bijlage zoals deze luidde voor het tijdstip
      van inwerkingtreding van de wijziging van toepassing ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel28a
  - number: 28a.a
    text: de mogelijkheid om hoger beroep in te stellen tegen een uitspraak die voor dat tijdstip is gedaan;
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel28a
  - number: 28a.b
    text: |-
      de in [artikel 19][ref1] bedoelde gevolgen van dat hoger beroep;


      [ref1]: https://wetten.overheid.nl/BWBR0002170#Artikel19
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002170
        artikel: '19'
        hoofdstuk: II
  - number: 28a.c
    text: |-
      de hoogte van het griffierecht bij hoger beroep tegen een uitspraak inzake een besluit als bedoeld in
      [artikel 22, tweede lid, onderdeel a, onder 1°][ref1], dat voor dat tijdstip is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002170#Artikel22
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0002170
        artikel: '22'
        hoofdstuk: II
  - number: '29'
    text: 'Deze wet wordt aangehaald als: Beroepswet.'
    url: https://wetten.overheid.nl/BWBR0002170/2004-02-01#Artikel29
