    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.b.8°
    text: |-
      de op 11 november 1988 te Londen tot stand gekomen Protocollen inzake het onder 1° en 5° genoemde verdrag, met
      bijlagen (*Trb*. 1990, 57),
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.b.9°
    text: |-
      een bij de onder 1° tot en met 7° genoemde verdragen Nederland bindend protocol, bindende bijlage of bindend
      aanhangsel, of
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.b.10°
    text: |-
      een bij algemene maatregel van bestuur aan te wijzen ander verdrag of Nederland bindend besluit van een
      volkenrechtelijke organisatie inzake de veiligheid van schepen, voorkoming van verontreiniging door schepen of
      leef- en werkomstandigheden aan boord van schepen, of een daarbij behorend Nederland bindend protocol, bindende
      bijlage of bindend aanhangsel;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.c
    text: |-
      richtlijn: richtlijn nr. 2009/16/EG van het Europees Parlement en de Raad van de Europese Unie van 23 april 2009
      betreffende havenstaatcontrole (PbEU L 131);
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.d
    text: |-
      haven: een anker- of ligplaats voor schepen, al of niet in zee, onder jurisdictie van een haven die, tenzij anders
      bepaald, in Nederland ligt;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.e
    text: |-
      inspectie: een bezoek aan boord van een schip teneinde na te gaan of wordt voldaan aan de geldende verdragen
      en voorschriften waarbij ten minste de in artikel 13, eerste lid, van de richtlijn vermelde controles worden
      uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.f
    text: |-
      meer gedetailleerde inspectie: inspectie waarbij het schip, de uitrusting en de bemanning, geheel of, voor zover
      van toepassing, gedeeltelijk onder de in artikel 13, derde lid, van de richtlijn beschreven omstandigheden worden
      onderworpen aan een grondig onderzoek, dat de constructie van het schip, de uitrusting, de personeelssterkte, de
      leef- en werkomstandigheden en de naleving van de operationele voorschriften aan boord omvat;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.g
    text: |-
      uitgebreide inspectie: een inspectie die ten minste de in bijlage VII van de richtlijn opgesomde onderdelen omvat
      en in voorkomend geval tevens een meer gedetailleerde inspectie kan omvatten indien daarvoor gegronde redenen als
      bedoeld in artikel 13, derde lid, van de richtlijn zijn;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.h
    text: 'exploitant: de eigenaar, rompbevrachter of ieder ander die de zeggenschap heeft over het gebruik van het schip;'
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.i
    text: |-
      uitvaren: het verlaten van een aan de buitenzijde van de lijn, bedoeld in
      [artikel 1, eerste lid, onder a, van de Schepenwet][ref1], gelegen anker- of ligplaats onder Nederlandse
      jurisdictie, of het in de richting van de zee overschrijden van deze lijn;


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '1'
  - number: 1.j
    text: 'aanhouding: het verbod voor de kapitein van een schip om met dat schip uit te varen;'
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.k
    text: |-
      stopzetting van een activiteit: het verbod voor de exploitant of de kapitein van een schip om een activiteit voort
      te zetten;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.l
    text: |-
      de ambtenaren van de Inspectie Leefomgeving en Transport: de door Onze Minister aangewezen ambtenaren van de
      Inspectie Leefomgeving en Transport.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.m
    text: |-
      havenbeheerder: degene die ingevolge de krachtens [artikel 4, eerste lid, van de Scheepvaartverkeerswet][ref1],
      gestelde regels, dan wel door het bevoegd gezag, bedoeld in [artikel 2 van de Scheepvaartverkeerswet][ref2],
      van de desbetreffende scheepvaartweg, is belast met de uitoefening van de bij of krachtens de
      [Scheepvaartverkeerswet][ref3] verleende bevoegdheden ten aanzien van de deelname aan het scheepvaartverkeer in een
      haven of op een scheepvaartweg die toegang geeft tot een haven in Europees Nederland onderscheidenlijk degene die
      door het bestuurscollege van Bonaire, Sint Eustatius of Saba is belast met de uitoefening van de bevoegdheden ten
      aanzien van de deelname aan het scheepvaartverkeer in een haven of op een scheepvaartweg die toegang geeft tot een
      haven in Bonaire, Sint Eustatius of Saba;


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
    references:
