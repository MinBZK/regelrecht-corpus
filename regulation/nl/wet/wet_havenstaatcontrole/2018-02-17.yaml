      - id: ref3
        bwb_id: BWBR0004364
  - number: 1.n
    text: |-
      MOU: het op 26 januari 1982 te Parijs tot stand gekomen Memorandum van overeenstemming inzake toezicht op schepen
      door de havenstaat (*Trb*. 1996, 248);
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.o
    text: |-
      schip/havenraakvlak: de interactie die plaatsvindt wanneer een schip rechtstreeks en onmiddellijk betrokken is bij
      handelingen die gepaard gaan met de verplaatsing van personen of goederen, dan wel de verlening van havendiensten
      aan of vanuit het schip;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.p
    text: |-
      klacht: informatie of rapport ingediend door een persoon of organisatie die een legitiem belang heeft bij de
      veiligheid van een schip, met inbegrip van de veiligheids- en gezondheidsrisico’s voor de bemanning, leef- en
      werkomstandigheden aan boord en de voorkoming van verontreiniging;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.q
    text: |-
      inspectiedatabank: het informatiesysteem dat bijdraagt tot de uitvoering van de regeling inzake het
      havenstaatcontrolestelsel in de Europese Unie en betreffende de gegevens van inspecties uitgevoerd in de Europese
      Gemeenschap en in bij het MOU aangesloten havenstaten;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.r
    text: |-
      controle: bezoek aan boord van een schip teneinde na te gaan of wordt voldaan aan een of meer geldende verdragen of
      voorschriften als bedoeld onder b;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.s
    text: |-
      CCSS-Code: de in het kader van het op 9 februari 1996 te Barbados tot stand gekomen Memorandum van overeenstemming
      inzake toezicht op schepen door de havenstaat vastgestelde Code voor de veiligheid van vrachtschepen waarmee reizen
      worden ondernomen in het Caribisch gebied (Code of Safety for Caribbean Cargo Ships);
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: 1.t
    text: |-
      SCV-Code: de in februari 2001 onder auspiciën van de IMO opgestelde, in december 2007 herziene en bij circulaire
      SLS.14/Circ.396, als voor het Koninkrijk der Nederlanden geldende equivalente regeling, aangemelde Code voor de
      veiligheid van kleine commerciële schepen waarmee reizen worden ondernomen in het Caribisch gebied (Code of Safety
      for Small Commercial Vessels).
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel1
  - number: '2.1'
    text: |-
      Het bij of krachtens deze wet bepaalde is, met uitzondering van [hoofdstuk Va][ref1], van toepassing op een schip
      dat niet gerechtigd is op grond van Nederlandse rechtsregels de vlag van het Koninkrijk te voeren, en dat, met
      uitzondering van de situaties, bedoeld in de [artikelen 11][ref2], [11a][ref3] en [12, tweede lid][ref4], een haven
      aandoet om een schip/havenraakvlak te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#HoofdstukVa
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008999#Artikel11a
      [ref4]: https://wetten.overheid.nl/BWBR0008999#Artikel12
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008999
        hoofdstuk: Va
      - id: ref2
        bwb_id: BWBR0008999
        artikel: '11'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0008999
        artikel: 11a
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0008999
        artikel: '12'
        hoofdstuk: V
  - number: '2.2'
    text: |-
      Het bij of krachtens deze wet bepaalde is, met uitzondering van de [hoofdstukken II tot en met V][ref1] en
      [Vb][ref2], van toepassing op een schip dat niet gerechtigd is op grond van Nederlandse rechtsregels de vlag
      van het Koninkrijk te voeren, en dat een haven gelegen in Bonaire, Sint Eustatius of Saba aandoet om een schip/
      havenraakvlak te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0008999#HoofdstukVb
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008999
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008999
        hoofdstuk: Vb
  - number: '2.3'
    text: |-
      Bij ministeriële regeling gestelde regels op grond van [artikel 26a, tweede lid][ref1], en [artikel 30][ref2] zijn
      slechts van toepassing op schepen als bedoeld in het tweede lid voor zover dat bij die regeling is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel26a
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel30
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 26a
        hoofdstuk: VII
      - id: ref2
        bwb_id: BWBR0008999
        artikel: '30'
        hoofdstuk: IX
  - number: '2.4'
    text: |-
      Het bij of krachtens deze wet bepaalde is niet van toepassing op oorlogsschepen, marinehulpschepen of andere
      schepen die in gebruik zijn voor de uitvoering van de militaire taak, houten schepen van primitieve bouw en voor
      andere dan handelsdoeleinden gebruikte overheidsschepen en pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel2
  - number: '3.1'
    text: |-
      Een ambtenaar van de Inspectie Leefomgeving en Transport kan een schip ten behoeve waarvan ingevolge een of
      meer van de verdragen een certificaat of ander document is vereist, aan een inspectie of uitgebreide inspectie
      onderwerpen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel3
  - number: '3.2'
    text: |-
      Indien het schip niet is voorzien van een geldig ingevolge een of meer van de verdragen vereist certificaat of
      ander document of indien er gegronde redenen zijn om aan te nemen dat de toestand van het schip, de uitrusting,
      de bemanning of de leef- en werkomstandigheden aan boord niet in overeenstemming zijn met de gegevens van het
      desbetreffende vereiste certificaat of document, of met de voorschriften van een of meer van de verdragen,
      onderwerpt een ambtenaar van de Inspectie Leefomgeving en Transport het schip aan een meer gedetailleerde
      inspectie.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel3
  - number: '3.3'
    text: |-
      Na een inspectie, een meer gedetailleerde inspectie of een uitgebreide inspectie overhandigt de ambtenaar van
      de Inspectie Leefomgeving en Transport in kopie een rapport aan de kapitein van het schip dat gegevens bevat
      betreffende:
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel3
  - number: 3.3.a
    text: de resultaten van de inspectie, de meer gedetailleerde inspectie of de uitgebreide inspectie,
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel3
  - number: 3.3.b
    text: de door de ambtenaar van de Inspectie Leefomgeving en Transport genomen besluiten, en
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel3
  - number: 3.3.c
    text: de door de kapitein of de exploitant van het schip te treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel3
  - number: '4'
    text: |-
      Voorzover [artikel 3][ref1] niet van toepassing is, kan een ambtenaar van de Inspectie Leefomgeving en Transport
      een schip ten behoeve waarvan ingevolge een of meer van de verdragen geen certificaat of ander document is vereist,
      of een schip dat de vlag voert van een staat die geen partij is bij een of meer van de verdragen, onderwerpen
      aan een inspectie, meer gedetailleerde inspectie of een uitgebreide inspectie, teneinde op een zoveel mogelijk
      overeenkomstige wijze als bedoeld in [artikel 3][ref2] na te gaan of de toestand van het schip, de uitrusting,
      de leden van de bemanning, of de leef- en werkomstandigheden aan boord van het schip geen gevaar vormen voor de
      veiligheid, de gezondheid of de verontreiniging van het mariene milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel3
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008999
        artikel: '3'
        hoofdstuk: II
  - number: '5.1'
    text: |-
      Bij ministeriële regeling worden met inachtneming van de richtlijn regels gesteld over de te stellen minimumeisen,
      waaraan de ambtenaren, bedoeld in [artikel 1, onderdeel l][ref1], moeten voldoen en over de wijze waarop die
      ambtenaren hun taak ingevolge deze wet uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel1
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '5.2'
    text: 'In de regeling worden ten minste regels gesteld betreffende:'
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
  - number: 5.2.a
    text: aantallen jaarlijks te inspecteren schepen,
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
  - number: 5.2.b
    text: categorieën met voorrang te inspecteren schepen,
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
  - number: 5.2.c
    text: categorieën van een inspectie uit te zonderen schepen,
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
  - number: 5.2.d
    text: |-
      tijdstippen waarop en periodes waarbinnen een inspectie, een meer gedetailleerde of een uitgebreide inspectie
      plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
  - number: 5.2.e
    text: omstandigheden waarin een inspectie kan worden uitgesteld,
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
  - number: 5.2.f
    text: gegronde redenen voor een meer gedetailleerde inspectie,
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
  - number: 5.2.g
    text: te controleren certificaten en andere documenten,
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
  - number: 5.2.h
    text: |-
      de te stellen eisen aan het rapport, bedoeld in [artikel 3, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel3
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '3'
        hoofdstuk: II
  - number: 5.2.i
    text: |-
      de in acht te nemen procedures en richtsnoeren bij een inspectie, een meer gedetailleerde inspectie en een
      uitgebreide inspectie.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
  - number: '5.3'
    text: In de regeling kan worden bepaald dat deze geheel of gedeeltelijk niet van toepassing is op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel5
  - number: '6'
    text: |-
      Een ambtenaar van de Inspectie Leefomgeving en Transport zet een activiteit stop indien bij een inspectie, een
      meer gedetailleerde inspectie of een uitgebreide inspectie, tekortkomingen zijn geconstateerd die afzonderlijk of
      gezamenlijk maken dat voortzetting van deze activiteit duidelijk gevaarlijk is voor de veiligheid of de gezondheid
      dan wel schadelijk is voor het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel6
  - number: '7.1'
    text: 'Een ambtenaar van de Inspectie Leefomgeving en Transport houdt een schip aan:'
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel7
  - number: 7.1.a
    text: |-
      indien wordt voldaan aan een of meer van de criteria die ingevolge bijlage X van de richtlijn tot de aanhouding van
      een schip kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel7
  - number: 7.1.b
    text: |-
      indien het niet is uitgerust met een functionerend reisgegevens-recordersysteem, terwijl het gebruik daarvan voor
      dat schip verplicht is op grond van richtlijn 2002/59/EG van het Europees Parlement en de Raad van de Europese
      Unie van 27 juni 2002 betreffende de invoering van een communautair monitoring- en informatiesysteem voor der
      zeescheepvaart en tot intrekking van richtlijn 93/75/EEG van de Raad (PbEG L 208);
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel7
  - number: 7.1.c
    text: |-
      indien de kapitein of de bemanning niet voldoet aan operationele voorschriften, bedoeld in een of meer van de
      verdragen;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel7
  - number: 7.1.d
    text: |-
      indien andere tekortkomingen dan bedoeld onder a zijn geconstateerd die afzonderlijk of gezamenlijk maken dat
      uitvaren gevaarlijk is voor de veiligheid of de gezondheid dan wel schadelijk is voor het mariene milieu;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel7
  - number: 7.1.e
    text: indien de ambtenaar wordt belemmerd in de uitoefening van zijn taak; of
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel7
  - number: 7.1.f
    text: |-
      indien de normen van het in artikel 1, onderdeel b, onder 6° genoemde verdrag herhaaldelijk of ernstig zijn
      overtreden.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel7
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, zijn voor de aanhouding van een vissersvaartuig niet van toepassing
      de bij ministeriële regeling aan te geven onderdelen van bijlage X van de richtlijn, die ingevolge de verdragen
      niet op vissersvaartuigen kunnen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel7
  - number: '7.3'
    text: |-
      Het eerste lid, onder c, is niet van toepassing op de aanhouding van vissersvaartuigen, met dien verstande dat
      onbekendheid met operationele voorschriften een aanhoudingsgrond voor vissersvaartuigen kan vormen, voorzover de
      verdragen dat toestaan.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel7
  - number: '7.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op een schip als bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel4
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '4'
        hoofdstuk: II
  - number: 7a
    text: |-
      [Afdeling 5.3.1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de in de [artikelen 6][ref2] en
      [7][ref3] bedoelde bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008999#Artikel7
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 5.3.1
      - id: ref2
        bwb_id: BWBR0008999
        artikel: '6'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0008999
        artikel: '7'
        hoofdstuk: III
  - number: '8.1'
    text: |-
      In afwijking van [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht][ref1] geschiedt de bekendmaking van
      het besluit dat strekt tot de stopzetting van een activiteit of de aanhouding door uitreiking van dit besluit aan
      de kapitein.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '8.2'
    text: |-
      Indien uitreiking aan de kapitein niet mogelijk is, geschiedt de bekendmaking van het besluit dat strekt tot
      stopzetting van een activiteit of de aanhouding door uitreiking van dit besluit aan de naar het oordeel van de
      ambtenaar van de Inspectie Leefomgeving en Transport daarvoor meest gerede persoon, zo spoedig mogelijk gevolgd
      door kennisgeving aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel8
  - number: '8.3'
    text: |-
      De ambtenaar van de Inspectie Leefomgeving en Transport stelt de administratie van de desbetreffende vlaggenstaat
      of de consul, of bij zijn afwezigheid, de dichtstbijzijnde diplomatieke vertegenwoordiger, onmiddellijk
      schriftelijk van de aanhouding en de omstandigheden die tot de aanhouding hebben geleid, in kennis.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel8
  - number: '9.1'
    text: |-
      Indien een aangehouden schip niet in de haven van aanhouding kan worden gerepareerd of indien het gebrek, bedoeld
      in [artikel 7, tweede lid, onderdeel b][ref1], niet zonder meer in de haven van aanhouding kan worden verholpen,
      kan de ambtenaar van de Inspectie Leefomgeving en Transport het schip toestaan naar de dichtstbijzijnde door de
      kapitein en de ambtenaar van de Inspectie Leefomgeving en Transport gekozen geschikte reparatiewerf te vertrekken.
      Indien de reparatiewerf zich buiten Nederland bevindt, geschiedt dit onder door de bevoegde autoriteit van de
      vlaggenstaat vastgestelde en door de ambtenaar van de Inspectie Leefomgeving en Transport goedgekeurde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel7
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '7'
        hoofdstuk: III
  - number: '9.2'
    text: |-
      Indien de reparatiewerf, bedoeld in het eerste lid, zich buiten Nederland bevindt, stelt de ambtenaar van de
      Inspectie Leefomgeving en Transport de bevoegde instantie van de staat waar de reparatiewerf zich bevindt en
      de administratie van de desbetreffende vlaggenstaat, of de consul, of bij zijn afwezigheid de dichtstbijzijnde
      diplomatieke vertegenwoordiger alsmede de aangewezen inspecteurs of de erkende organisaties die verantwoordelijk
      zijn voor de afgifte van de klassecertificaten of de wettelijk voorgeschreven certificaten die overeenkomstig de
      verdragen worden afgegeven, in kennis van de voorwaarden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel9
  - number: '9.3'
    text: |-
      Indien het gebrek, bedoeld in [artikel 7, eerste lid, onderdeel b][ref1], niet zonder meer in de haven van
      aanhouding kan worden verholpen, kan de ambtenaar in plaats van het schip op grond van het eerste lid toe te staan
      naar de dichtstbijzijnde reparatiewerf te vertrekken, verlangen dat dit gebrek wordt verholpen binnen een termijn
      van ten hoogste dertig dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel7
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '7'
        hoofdstuk: III
  - number: '9.4'
    text: |-
      Om havencongestie te voorkomen kan de ambtenaar van de Inspectie Leefomgeving en Transport op verzoek van de
      havenbeheerder toestemming verlenen om een aangehouden schip naar een ander deel van de haven te verplaatsen indien
      dat op een veilige manier kan gebeuren.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel9
  - number: '10.1'
    text: |-
      Een ambtenaar van de Inspectie Leefomgeving en Transport heft de stopzetting van een activiteit op indien geen
      duidelijk gevaar bestaat voor de veiligheid, de gezondheid en het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel10
  - number: '10.2'
    text: 'Een ambtenaar van de Inspectie Leefomgeving en Transport heft de aanhouding op indien:'
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel10
  - number: 10.2.a
    text: |-
      de redenen, genoemd in [artikel 7, eerste lid, onder a tot en met d][ref1], niet van toepassing zijn, of het schip
      onder voorwaarden als bedoeld in [artikel 9, eerste lid][ref2], mag vertrekken; en


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel9
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0008999
        artikel: '9'
        hoofdstuk: III
  - number: 10.2.b
    text: |-
      de exploitant de vergoeding voor de kosten, bedoeld in [artikel 14, eerste lid][ref1], heeft voldaan of ten
      genoegen van Onze Minister voldoende zekerheid heeft gesteld voor de vergoeding voor deze kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '14'
        hoofdstuk: V
  - number: '10.3'
    text: |-
      In afwijking van [artikel 3:41 van de Algemene wet bestuursrecht][ref1] geschiedt de bekendmaking van het besluit
      dat strekt tot opheffing van de stopzetting van een activiteit of de aanhouding door uitreiking van dit besluit aan
      de kapitein.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '10.4'
    text: |-
      Op het besluit dat strekt tot opheffing van de stopzetting van een activiteit of de aanhouding, is
      [artikel 8, tweede en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel8
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '8'
        hoofdstuk: III
  - number: '11.1'
    text: 'De havenbeheerder weigert de toegang tot de haven van elk schip, dat:'
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11
  - number: 11.1.a
    text: |-
      vaart onder de vlag van een staat met een aanhoudingsgraad die onder de zwarte lijst valt die overeenkomstig
      het MOU op basis van in de inspectiedatabank geregistreerde informatie is vastgesteld en zoals jaarlijks door
      de Europese Commissie wordt bekendgemaakt, en dat meer dan twee keer is aangehouden of waarvan de inzet meer dan
      twee keer is belet in de voorafgaande 36 maanden in een haven van een lidstaat of een staat die het MOU heeft
      ondertekend, of
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11
  - number: 11.1.b
    text: |-
      vaart onder de vlag van een staat met een aanhoudingsgraad die onder de grijze lijst valt die overeenkomstig het
      MOU op basis van in de inspectiedatabank geregistreerde informatie is vastgesteld en jaarlijks door de Europese
      Commissie wordt bekendgemaakt, en dat meer dan twee keer is aangehouden of waarvan de inzet meer dan twee keer is
      belet in de voorafgaande 24 maanden in een haven van een lidstaat of een staat die het MOU heeft ondertekend.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11
  - number: '11.2'
    text: |-
      De weigering van toegang, bedoeld in het eerste lid, geldt zodra een schip de haven van een lidstaat heeft verlaten
      waar het voor een derde keer is aangehouden en waar een besluit is bekendgemaakt aan de kapitein van het schip, de
      verantwoordelijke rederij en de vlaggenstaat, waarin wordt meegedeeld dat het schip de toegang tot alle havens van
      de lidstaten zal worden geweigerd.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11
  - number: '11.3'
    text: |-
      De havenbeheerder van een haven weigert een schip de toegang tot zijn haven in geval van een aanhouding van
      dit schip in een haven van een lidstaat nadat een schip reeds tweemaal een weigering van toegang heeft opgelegd
      gekregen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11
  - number: '11.4'
    text: 'De havenbeheerder weigert een schip permanent de toegang tot een haven indien:'
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11
  - number: 11.4.a
    text: |-
      een schip 24 maanden na de uitvaardiging van de weigering van toegang als bedoeld in
      [artikel 11a, eerste lid, aanhef en onder b][ref1], niet voldoet aan de voorwaarden, bedoeld in artikel 11a, vierde
      lid, of


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11a
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 11a
        hoofdstuk: IV
  - number: 11.4.b
    text: een schip is aangehouden in een haven in een lidstaat en deze aanhouding volgt op een derde weigering van toegang.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11
  - number: '11.5'
    text: |-
      In afwijking van het bepaalde in het eerste tot en met derde lid, kan de havenbeheerder in overeenstemming met
      Onze Minister een schip toestaan zich naar een haven te begeven ten behoeve van het uitvoeren van een hernieuwde
      inspectie van het schip als bedoel in bijlage VIII van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11
  - number: 11a.1
    text: |-
      Onze Minister neemt een besluit als bedoeld in [artikel 11, tweede lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '11'
        hoofdstuk: IV
  - number: 11a.1.a
    text: |-
      de derde aanhouding, bedoeld in [artikel 11, eerste lid][ref1], plaatsvindt in een haven,


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '11'
        hoofdstuk: IV
  - number: 11a.1.b
    text: |-
      de aanhouding, bedoeld in [artikel 11, derde lid][ref1], plaatsvindt in een haven, of


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '11'
        hoofdstuk: IV
  - number: 11a.1.c
    text: |-
      de aanhouding, bedoeld in [artikel 11, vierde lid, onder b][ref1], plaatsvindt in een haven, waarbij tevens wordt
      meegedeeld dat de weigering van toegang van het schip tot alle havens van de lidstaten permanent is.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '11'
        hoofdstuk: IV
  - number: 11a.2
    text: |-
      Onze Minister trekt het besluit, bedoeld in het eerste lid, aanhef en onder a, in indien een periode van drie
      maanden is verstreken na de bekendmaking van dit besluit en wordt voldaan aan de punten 3 tot en met 9 van bijlage
      VIII van de richtlijn.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
  - number: 11a.3
    text: Bij een tweede weigering van toegang bedraagt de periode, bedoeld in het tweede lid, twaalf maanden.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
  - number: 11a.4
    text: |-
      Onze Minister trekt het besluit, bedoeld in het eerste lid, aanhef en onder b in na het verstrijken van een periode
      van 24 maanden, indien binnen deze periode:
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
  - number: 11a.4.a
    text: |-
      het schip vaart onder de vlag van een staat met een aanhoudingsgraad die niet onder de in het eerste lid bedoelde
      zwarte of grijze lijst valt,
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
  - number: 11a.4.b
    text: |-
      de wettelijk voorgeschreven certificaten en de classificatiecertificaten van het schip zijn afgegeven door een
      organisatie of organisaties die is, onderscheidenlijk zijn, erkend op grond van verordening (EG) nr. 391/2009 van
      het Europees Parlement en de Raad van de Europese Unie van 23 april 2009 inzake gemeenschappelijke voorschriften en
      normen voor met de inspectie en controle van schepen belaste organisaties (PbEU L 131),
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
  - number: 11a.4.c
    text: |-
      het schip wordt geëxploiteerd door een rederij die goed presteert als bedoeld in bijlage I, deel I.1, van de
      richtlijn, en
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
  - number: 11a.4.d
    text: aan de voorwaarden van bijlage VIII, punten 3 tot en met 9 van de richtlijn, is voldaan.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
  - number: 11a.5
    text: |-
      Onze Minister maakt het besluit, bedoeld in het eerste lid, bekend aan de kapitein van het schip, de
      verantwoordelijke rederij en de vlaggenstaat en doet een afschrift toekomen aan de in punt 2 van bijlage VIII van
      de richtlijn genoemde organisaties.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
  - number: 11a.6
    text: |-
      Onze Minister stelt de in punten 10 en 11 van bijlage VIII van de richtlijn genoemde organisaties schriftelijk in
      kennis van het in het tweede en vierde lid bedoelde besluit.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11a
  - number: 11b.1
    text: |-
      De havenbeheerder weigert een schip, met uitzondering van een vissersvaartuig, waarvoor toestemming is verleend om
      naar een reparatiewerf te vertrekken, de toegang tot de haven, indien dat schip vanuit een haven van een lidstaat
      is uitgevaren of vanuit een andere bij het MOU aangesloten havenstaat naar zee is vertrokken:
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11b
  - number: 11b.1.a
    text: zonder dat voldaan is aan de gestelde voorwaarden voor de reis, of
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11b
  - number: 11b.1.b
    text: zonder zich te begeven naar de gekozen dichtstbijzijnde reparatiewerf.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11b
  - number: 11b.2
    text: De havenbeheerder bevestigt een weigering als bedoeld in het eerste lid zo spoedig mogelijk schriftelijk.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11b
  - number: 11b.3
    text: |-
      In een situatie als bedoeld in het eerste lid laat de havenbeheerder het schip toe in de haven op het moment dat
      de kapitein of exploitant naar het oordeel van de bevoegde autoriteit van de lidstaat waar de tekortkoming aan het
      schip is geconstateerd, heeft aangetoond dat het schip aan de voorschriften van de verdragen voldoet.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11b
  - number: 11c
    text: |-
      In afwijking van het bepaalde in [artikel 11][ref1] en [11b][ref2] kan de havenbeheerder in overeenstemming met
      Onze Minister een schip in de haven toelaten in geval van overmacht, prevalerende veiligheidsredenen of om het
      gevaar van vervuiling te beperken of te minimaliseren of tekortkomingen te verhelpen, mits de kapitein of de
      exploitant naar het oordeel van de havenbeheerder afdoende maatregelen voor een veilige binnenkomst heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel11b
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '11'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0008999
        artikel: 11b
        hoofdstuk: IV
  - number: 11d.1
    text: |-
      Onze Minister kan een besluit nemen tot verwijdering van een schip uit een haven indien bij een inspectie wordt
      vastgesteld dat het certificaat, bedoeld in bijlage IV, onder 41, van de richtlijn of het conformiteitsdocument,
      bedoeld in bijlage IV, onder 50, van de richtlijn, niet aan boord is.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11d
  - number: 11d.2
    text: |-
      De havenbeheerder van een haven weigert een schip de toegang tot zijn haven, indien met betrekking tot dit schip in
      een haven van een lidstaat een besluit is genomen tot verwijdering ervan vanwege het niet aan boord hebben van het
      certificaat, bedoeld in bijlage IV, onder 41, van de richtlijn of het conformiteitsdocument, bedoeld in bijlage IV,
      onder 50, van de richtlijn, totdat de exploitant kennis geeft van een dergelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel11d
  - number: '12.1'
    text: |-
      De kapitein en de exploitant van een schip zijn verplicht te voldoen aan de voorwaarden, bedoeld in
      [artikel 9, eerste lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel9
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '9'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      Zolang een schip de toegang tot een haven wordt geweigerd, is het de kapitein verboden het schip die haven te doen
      binnenvaren.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel12
  - number: '12.3'
    text: |-
      De kapitein van een aangehouden schip is verplicht dat schip na de aanhouding ligplaats te doen nemen op een door
      een ambtenaar van de Inspectie Leefomgeving en Transport in overeenstemming met de havenbeheerder aan te wijzen
      plaats.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel12
  - number: '12.4'
    text: |-
      Indien het de kapitein van een schip op grond van [artikel 11, vijfde lid][ref1], is toegestaan een schip de haven
      binnen te varen, is het de kapitein en de exploitant verboden ladinghandelingen uit te voeren totdat het besluit,
      bedoeld in artikel 11, tweede lid, is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '11'
        hoofdstuk: IV
  - number: '13.1'
    text: |-
      Het is de kapitein van een aangehouden schip verboden dat schip te doen verplaatsen zonder voorafgaande toestemming
      van een ambtenaar van de Inspectie Leefomgeving en Transport.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel13
  - number: '13.2'
    text: Het is de kapitein van een aangehouden schip verboden om met dat schip uit te varen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel13
  - number: '13.3'
    text: |-
      Indien een activiteit is stopgezet, is het de kapitein en de exploitant verboden om deze activiteit voort te
      zetten, dan wel deze activiteit te hervatten.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel13
  - number: '13.4'
    text: |-
      Zonder voorafgaande toestemming als bedoeld in het eerste lid, of zolang een schip is aangehouden, weigeren alle
      betrokken ambtenaren en registerloodsen hun medewerking bij de uitklaring en de verplaatsing van het schip.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel13
  - number: '14.1'
    text: |-
      Indien een schip, met uitzondering van een vissersvaartuig, is aangehouden, betaalt de exploitant van dat schip aan
      de inspecteur-generaal een vergoeding:
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14
  - number: 14.1.a
    text: |-
      voor alle kosten van de inspectie, de meer gedetailleerde inspectie, de uitgebreide inspectie of de controle,
      bedoeld in [artikel 14j][ref1], die tot de aanhouding heeft geleid,


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '14'
        hoofdstuk: V
  - number: 14.1.b
    text: |-
      voor alle kosten van de inspectie, de meer gedetailleerde inspectie, de uitgebreide inspectie of de controle,
      bedoeld in [artikel 14j][ref1], die tot de opheffing daarvan heeft geleid, en


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '14'
        hoofdstuk: V
  - number: 14.1.c
    text: voor alle kosten in verband met de aanhouding in de haven.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14
  - number: '14.2'
    text: |-
      Indien een schip dat de toegang tot de haven is geweigerd, aan een inspectie wordt onderworpen alvorens
      het besluit, bedoeld in [artikel 11, tweede lid][ref1], wordt ingetrokken dan wel het schip op grond van
      [artikel 11b, derde lid][ref2], kan worden toegelaten, betaalt de exploitant van dat schip aan Onze Minister een
      vergoeding voor de kosten van deze inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel11b
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '11'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0008999
        artikel: 11b
        hoofdstuk: IV
  - number: '14.3'
    text: |-
      Bij ministeriële regeling worden de tarieven vastgesteld voor de vergoedingen, bedoeld in het eerste en het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14
  - number: 14a.1
    text: |-
      Een ambtenaar van de Inspectie Leefomgeving en Transport kan een schip ten behoeve waarvan ingevolge een of meer
      van de verdragen, voor zover geldend in Bonaire, Sint Eustatius en Saba, een certificaat of ander document is
      vereist, aan een controle onderwerpen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14a
  - number: 14a.2
    text: |-
      Een ambtenaar van de Inspectie Leefomgeving en Transport kan tevens een schip waarop de CCSS-Code of de SCV-Code
      van toepassing is aan een controle onderwerpen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14a
  - number: 14a.3
    text: |-
      Na een controle overhandigt de ambtenaar van de Inspectie Leefomgeving en Transport in kopie een rapport aan de
      kapitein van het schip dat gegevens bevat betreffende:
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14a
  - number: 14a.3.a
    text: de resultaten van de controle,
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14a
  - number: 14a.3.b
    text: de door de ambtenaar van de Inspectie Leefomgeving en Transport genomen besluiten, en
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14a
  - number: 14a.3.c
    text: de door de kapitein of de exploitant van het schip te treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14a
  - number: 14b
    text: |-
      Een ambtenaar van de Inspectie Leefomgeving en Transport zet een activiteit stop indien bij een controle
      tekortkomingen zijn geconstateerd die afzonderlijk of gezamenlijk maken dat voortzetting van deze activiteit
      duidelijk gevaarlijk is voor de veiligheid of de gezondheid dan wel schadelijk is voor het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14b
  - number: 14c.1
    text: 'Een ambtenaar van de Inspectie Leefomgeving en Transport houdt een schip aan:'
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14c
  - number: 14c.1.a
    text: |-
      indien de kapitein of de bemanning niet voldoet aan operationele voorschriften, bedoeld in een of meer van de
      verdragen, voor zover geldend in Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14c
  - number: 14c.1.b
    text: |-
      indien andere tekortkomingen zijn geconstateerd die afzonderlijk of gezamenlijk maken dat uitvaren gevaarlijk is
      voor de veiligheid of de gezondheid dan wel schadelijk is voor het mariene milieu; of
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14c
  - number: 14c.1.c
    text: indien de ambtenaar wordt belemmerd in de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14c
  - number: 14c.2
    text: |-
      Het eerste lid, onder a, is niet van toepassing op de aanhouding van vissersvaartuigen, met dien verstande dat
      onbekendheid met operationele voorschriften een aanhoudingsgrond voor vissersvaartuigen kan vormen, voor zover de
      verdragen dat toestaan.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14c
  - number: 14d.1
    text: |-
      De bekendmaking van het besluit dat strekt tot de stopzetting van een activiteit of de aanhouding geschiedt door
      uitreiking van dit besluit aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14d
  - number: 14d.2
    text: |-
      Indien uitreiking aan de kapitein niet mogelijk is, geschiedt de bekendmaking van het besluit dat strekt tot
      stopzetting van een activiteit of de aanhouding door uitreiking van dit besluit aan de naar het oordeel van de
      ambtenaar van de Inspectie Leefomgeving en Transport daarvoor meest gerede persoon, zo spoedig mogelijk gevolgd
      door kennisgeving aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14d
  - number: 14d.3
    text: |-
      De ambtenaar van de Inspectie Leefomgeving en Transport stelt de administratie van de desbetreffende vlaggenstaat
      of de consul, of bij zijn afwezigheid, de dichtstbijzijnde diplomatieke vertegenwoordiger, onmiddellijk
      schriftelijk van de aanhouding en de omstandigheden die tot de aanhouding hebben geleid, in kennis.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14d
  - number: 14e.1
    text: |-
      Indien een aangehouden schip niet in de haven van aanhouding kan worden gerepareerd of indien de tekortkoming,
      bedoeld in [artikel 14c, eerste lid, onderdeel b][ref1], niet zonder meer in de haven van aanhouding kan worden
      verholpen, kan de ambtenaar van de Inspectie Leefomgeving en Transport het schip toestaan naar de dichtstbijzijnde
      door de kapitein en de ambtenaar van de Inspectie Leefomgeving en Transport gekozen geschikte reparatiewerf te
      vertrekken. Indien de reparatiewerf zich buiten Bonaire, Sint Eustatius of Saba bevindt, geschiedt dit onder door
      de bevoegde autoriteit van de vlaggenstaat vastgestelde en door de ambtenaar van de Inspectie Leefomgeving en
      Transport goedgekeurde voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14c
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14e
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 14c
        hoofdstuk: Va
  - number: 14e.2
    text: |-
      Indien de reparatiewerf, bedoeld in het eerste lid, zich buiten Bonaire, Sint Eustatius of Saba bevindt, stelt
      de ambtenaar van de Inspectie Leefomgeving en Transport de bevoegde instantie van de staat waar de reparatiewerf
      zich bevindt en de administratie van de desbetreffende vlaggenstaat, of de consul, of bij zijn afwezigheid de
      dichtstbijzijnde diplomatieke vertegenwoordiger alsmede de aangewezen inspecteurs of de erkende organisaties die
      verantwoordelijk zijn voor de afgifte van de klassecertificaten of de wettelijk voorgeschreven certificaten die
      overeenkomstig de verdragen worden afgegeven, in kennis van de voorwaarden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14e
  - number: 14e.3
    text: |-
      Indien de tekortkoming, bedoeld in [artikel 14c, eerste lid, onderdeel b][ref1], niet zonder meer in de haven van
      aanhouding kan worden verholpen, kan de ambtenaar in plaats van het schip op grond van het eerste lid toe te staan
      naar de dichtstbijzijnde reparatiewerf te vertrekken, verlangen dat deze tekortkoming wordt verholpen binnen een
      termijn van ten hoogste dertig dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14c
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14e
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 14c
        hoofdstuk: Va
  - number: 14e.4
    text: |-
      Om havencongestie te voorkomen kan de ambtenaar van de Inspectie Leefomgeving en Transport op verzoek van de
      havenbeheerder toestemming verlenen om een aangehouden schip naar een ander deel van de haven te verplaatsen indien
      dat op een veilige manier kan gebeuren.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14e
  - number: 14e.5
    text: |-
      In verband met de veiligheid van een aangehouden schip of de haven kan de ambtenaar van de Inspectie Leefomgeving
      en Transport op verzoek van de havenbeheerder toestemming verlenen om een aangehouden schip tijdelijk naar een
      locatie buiten de haven te verplaatsen onder voorwaarde dat de kapitein van het aangehouden schip radiocontact
      behoudt met de havenbeheerder.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14e
  - number: 14f.1
    text: |-
      Een ambtenaar van de Inspectie Leefomgeving en Transport heft de stopzetting van een activiteit op indien geen
      duidelijk gevaar meer bestaat voor de veiligheid, de gezondheid en het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14f
  - number: 14f.2
    text: 'Een ambtenaar van de Inspectie Leefomgeving en Transport heft de aanhouding op indien:'
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14f
  - number: 14f.2.a
    text: |-
      de redenen, genoemd in [artikel 14c, eerste lid, onder a en b][ref1], niet meer van toepassing zijn, of het schip
      onder voorwaarden als bedoeld in [artikel 14e, eerste lid][ref2], mag vertrekken; en


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14c
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel14e
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 14c
        hoofdstuk: Va
      - id: ref2
        bwb_id: BWBR0008999
        artikel: 14e
        hoofdstuk: Va
  - number: 14f.2.b
    text: |-
      de exploitant de vergoeding voor de kosten, bedoeld in [artikel 14i, eerste lid][ref1], heeft voldaan of ten
      genoegen van Onze Minister voldoende zekerheid heeft gesteld voor de vergoeding voor deze kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14i
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 14i
        hoofdstuk: Va
  - number: 14f.3
    text: |-
      De bekendmaking van het besluit dat strekt tot opheffing van de stopzetting van een activiteit of de aanhouding
      geschiedt door uitreiking van dit besluit aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14f
  - number: 14f.4
    text: |-
      Op het besluit dat strekt tot opheffing van de stopzetting van een activiteit of de aanhouding, is
      [artikel 14d, tweede en derde lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14d
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14f
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 14d
        hoofdstuk: Va
  - number: 14g.1
    text: |-
      De kapitein en de exploitant van een schip zijn verplicht te voldoen aan de voorwaarden, bedoeld in
      [artikel 14e, eerste lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14e
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14g
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 14e
        hoofdstuk: Va
  - number: 14g.2
    text: |-
      Zolang een schip de toegang tot een haven wordt geweigerd, is het de kapitein verboden het schip die haven te doen
      binnenvaren.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14g
  - number: 14g.3
    text: |-
      De kapitein van een aangehouden schip is verplicht dat schip na de aanhouding ligplaats te doen nemen op een door
      een ambtenaar van de Inspectie Leefomgeving en Transport in overeenstemming met de havenbeheerder aan te wijzen
      plaats.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14g
  - number: 14h.1
    text: |-
      Het is de kapitein van een aangehouden schip verboden dat schip te doen verplaatsen zonder voorafgaande toestemming
      van een ambtenaar van de Inspectie Leefomgeving en Transport.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14h
  - number: 14h.2
    text: Het is de kapitein van een aangehouden schip verboden om met dat schip uit te varen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14h
  - number: 14h.3
    text: |-
      Indien een activiteit is stopgezet, is het de kapitein en de exploitant verboden om deze activiteit voort te
      zetten, dan wel deze activiteit te hervatten.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14h
  - number: 14h.4
    text: |-
      Zonder voorafgaande toestemming als bedoeld in het eerste lid, of zolang een schip is aangehouden, weigeren alle
      betrokken ambtenaren en loodsen hun medewerking bij de uitklaring en de verplaatsing van het schip.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14h
  - number: 14i.1
    text: |-
      Indien een schip, met uitzondering van een vissersvaartuig, is aangehouden, betaalt de exploitant van dat schip aan
      de inspecteur-generaal een vergoeding:
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14i
  - number: 14i.1.a
    text: voor alle kosten van de controle die tot de aanhouding heeft geleid,
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14i
  - number: 14i.1.b
    text: voor alle kosten van de controle die tot de opheffing daarvan heeft geleid, en
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14i
  - number: 14i.1.c
    text: voor alle kosten in verband met de aanhouding in de haven.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14i
  - number: 14i.2
    text: Bij ministeriële regeling worden de tarieven vastgesteld voor de vergoedingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14i
  - number: 14j.1
    text: |-
      Onverminderd het bepaalde in [artikel 3, eerste lid][ref1], kan een schip dat niet gerechtigd is op grond van
      Nederlandse rechtsregels de vlag van het Koninkrijk te voeren in een Nederlandse haven worden onderworpen aan een
      controle door een ambtenaar van de Inspectie Leefomgeving en Transport.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel3
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14j
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '3'
        hoofdstuk: II
  - number: 14j.2
    text: |-
      De [artikelen 6 tot en met 10][ref1] zijn van overeenkomstige toepassing op een controle als bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel6
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel14j
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '6'
        hoofdstuk: III
  - number: '15.1'
    text: |-
      Onze Minister kan voor bepaalde door hem aan te wijzen taken verband houdende met de inspectie, de meer
      gedetailleerde inspectie, de uitgebreide inspectie of de controle, ambtenaren van andere diensttakken ter
      beschikking stellen van de Inspectie Leefomgeving en Transport. Indien de terbeschikkingstelling ambtenaren betreft
      ressorterende onder een ander ministerie dan dat van Onze Minister, wordt het desbetreffende besluit genomen in
      overeenstemming met de minister van het andere ministerie.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel15
  - number: '15.2'
    text: Van het besluit, bedoeld in het eerste lid, wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel15
  - number: '16'
    text: |-
      Met het toezicht op de naleving van de [hoofdstukken IV][ref1] en [V][ref2] en de [artikelen 14g ][ref3]en
      [14h][ref4] zijn belast de ambtenaren van de Inspectie Leefomgeving en Transport, alsmede de bij besluit van Onze
      Minister aangewezen ambtenaren of andere personen.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0008999#HoofdstukV
      [ref3]: https://wetten.overheid.nl/BWBR0008999#Artikel14g
      [ref4]: https://wetten.overheid.nl/BWBR0008999#Artikel14h
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008999
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0008999
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0008999
        artikel: 14g
        hoofdstuk: Va
      - id: ref4
        bwb_id: BWBR0008999
        artikel: 14h
        hoofdstuk: Va
  - number: '17.1'
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2] en [5:15 tot en met 5:20 van de Algemene wet bestuursrecht][ref3], zijn
      van overeenkomstige toepassing op een ambtenaar van de Inspectie Leefomgeving en Transport bij de uitoefening
      van taken, verband houdende met de inspectie, de meer gedetailleerde inspectie, de uitgebreide inspectie of de
      controle, en op een ter beschikking gestelde ambtenaar als bedoeld in [artikel 15, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0008999#Artikel15
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0008999
        artikel: '15'
        hoofdstuk: VI
  - number: '17.2'
    text: |-
      Een ambtenaar van de Inspectie Leefomgeving en Transport draagt, voorzover nodig in afwijking van
      [artikel 5:12, derde lid, van de Algemene wet bestuursrecht][ref1], een legitimatiebewijs bij zich, overeenkomstig
      het model, bedoeld in artikel 22, vierde lid, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '18.1'
    text: |-
      Een ambtenaar van de Inspectie Leefomgeving en Transport en een ter beschikking gestelde ambtenaar als bedoeld in
      [artikel 15, eerste lid][ref1], zijn bevoegd, met medeneming van de benodigde apparatuur, woongedeelten van schepen
      binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel15
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '15'
        hoofdstuk: VI
  - number: '18.2'
    text: |-
      Op het binnentreden van woongedeelten van een schip dat een haven gelegen in Bonaire, Sint Eustatius
      of Saba aandoet is tevens [Titel X van het Derde Boek van het Wetboek van Strafvordering BES][ref1] van
      overeenkomstige toepassing, met uitzondering van de [artikelen 155, vierde lid][ref2], [156, tweede lid][ref3],
      [157, tweede en derde lid][ref4], [158, eerste lid, laatste zinsnede][ref5], en [160, eerste lid][ref6], en met
      dien verstande dat de machtiging wordt verleend door de procureur-generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0028681
      [ref2]: https://wetten.overheid.nl/BWBR0028681#Artikel155
      [ref3]: https://wetten.overheid.nl/BWBR0028681#Artikel156
      [ref4]: https://wetten.overheid.nl/BWBR0028681#Artikel157
      [ref5]: https://wetten.overheid.nl/BWBR0028681#Artikel158
      [ref6]: https://wetten.overheid.nl/BWBR0028681#Artikel160
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0028681
      - id: ref2
        bwb_id: BWBR0028681
        artikel: '155'
      - id: ref3
        bwb_id: BWBR0028681
        artikel: '156'
      - id: ref4
        bwb_id: BWBR0028681
        artikel: '157'
      - id: ref5
        bwb_id: BWBR0028681
        artikel: '158'
      - id: ref6
        bwb_id: BWBR0028681
        artikel: '160'
  - number: '19'
    text: |-
      Een ambtenaar van de Inspectie Leefomgeving en Transport is bevoegd leden van de bemanning te onderwerpen aan
      een onderzoek inzake hun vakbekwaamheid, met inbegrip van hun bekwaamheid in het verrichten van operationele
      handelingen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel19
  - number: '26.1'
    text: |-
      Tegen besluiten van een ambtenaar van de Inspectie Leefomgeving en Transport of een havenbeheerder kan iedere
      belanghebbende beroep instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel26
  - number: '26.2'
    text: Het beroepschrift is gesteld in de Nederlandse of de Engelse taal.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel26
  - number: '26.3'
    text: |-
      Indien het beroepschrift telegrafisch of per telex wordt ingediend, kan de ondertekening,
      in afwijking van [artikel 6:5 van de Algemene wet bestuursrecht][ref1] onderscheidenlijk
      [artikel 15, vijfde lid, onderdeel e, van de Wet administratieve rechtspraak BES][ref2], achterwege blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028455#Artikel15
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0028455
        artikel: '15'
  - number: '26.4'
    text: |-
      Indien onverwijlde spoed, gelet op de betrokken belangen, dat vereist, kan Onze Minister bepalen dat het beroep
      de werking schorst van het besluit waartegen het is gericht, met uitzondering van het besluit dat strekt tot de
      aanhouding of de weigering van toegang van een schip.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel26
  - number: 26a.1
    text: Onze Minister draagt zorg voor de behandeling van alle klachten die worden ingediend.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel26a
  - number: 26a.2
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot de behandeling van klachten als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel26a
  - number: '27'
    text: |-
      De exploitant die zich bij beroep bij de rechtbank beroept op een onnodige aanhouding of onnodig oponthoud, draagt
      de bewijslast daarvan.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel27
  - number: '29'
    text: |-
      Bij ministeriële regeling worden ter uitvoering van de [hoofdstukken II tot en met V][ref1] en met inachtneming van
      de artikelen 19, 21 en 23, eerste en tweede lid, van de richtlijn regels gesteld inzake de instanties:


      [ref1]: https://wetten.overheid.nl/BWBR0008999#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008999
        hoofdstuk: II
  - number: 29.a
    text: |-
      met wie en op welke wijze een ambtenaar van de Inspectie Leefomgeving en Transport overleg moet voeren, dan wel
      door wie en op welke wijze met hem overleg moet worden gevoerd; of
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel29
  - number: 29.b
    text: |-
      aan wie een ambtenaar van de Inspectie Leefomgeving en Transport gegevens kan of moet melden, dan wel door wie aan
      hem gegevens kunnen of moeten worden gemeld.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel29
  - number: '30'
    text: |-
      Ter uitvoering van internationale afspraken of besluiten van volkenrechtelijke organisaties inzake onderwerpen
      waarop deze wet van toepassing is, kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel30
  - number: '31.1'
    text: |-
      Een wijziging van bijlage X van de richtlijn, van het model bedoeld in artikel 22, vierde lid, van de richtlijn
      of van de artikelen 19, 21 en 23, eerste en tweede lid, van de richtlijn, gaat voor de toepassing van de
      [artikelen 7, eerste lid, onder a, en tweede lid][ref1], [17, tweede lid][ref2], en [29][ref3] gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0008999#Artikel29
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '7'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0008999
        artikel: '17'
        hoofdstuk: VI
      - id: ref3
        bwb_id: BWBR0008999
        artikel: '29'
        hoofdstuk: VIII
  - number: '31.2'
    text: |-
      Een wijziging van de verdragen gaat voor de toepassing van de [artikelen 3][ref1], [4][ref2],
      [7, eerste lid, onder c, en derde lid][ref3], [11a, derde lid][ref4], [14a][ref5] en [14c][ref6] gelden met ingang
      van de dag waarop de betrokken wijziging door Nederland is aanvaard en internationaal in werking is getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008999#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0008999#Artikel11a
      [ref5]: https://wetten.overheid.nl/BWBR0008999#Artikel14a
      [ref6]: https://wetten.overheid.nl/BWBR0008999#Artikel14c
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008999
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0008999
        artikel: '7'
        hoofdstuk: III
      - id: ref4
        bwb_id: BWBR0008999
        artikel: 11a
        hoofdstuk: IV
      - id: ref5
        bwb_id: BWBR0008999
        artikel: 14a
        hoofdstuk: Va
      - id: ref6
        bwb_id: BWBR0008999
        artikel: 14c
        hoofdstuk: Va
  - number: '31.3'
    text: |-
      Een wijziging van de CCSS-Code of de SCV-Code gaat voor de toepassing van [artikel 14a, tweede lid][ref1], gelden
      met ingang van de dag waarop de betrokken wijziging door Nederland is aanvaard en internationaal in werking is
      getreden.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14a
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 14a
        hoofdstuk: Va
  - number: '33.1'
    text: |-
      Overtreding van [artikel 12, tweede lid][ref1], wordt gestraft met hechtenis van ten hoogste twee maanden of
      geldboete van de derde categorie, [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '12'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '33.2'
    text: |-
      Overtreding van [artikel 14g, tweede lid][ref1], wordt gestraft met hechtenis van ten hoogste twee maanden of
      geldboete van de derde categorie, [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14g
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel27
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 14g
        hoofdstuk: Va
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '27'
  - number: '33.3'
    text: |-
      Overtreding van [artikel 14h][ref1], eerste en tweede lid, wordt gestraft met een geldboete van de derde categorie,
      [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel14h
      [ref2]: https://wetten.overheid.nl/BWBR0028570#Artikel27
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 14h
        hoofdstuk: Va
      - id: ref2
        bwb_id: BWBR0028570
        artikel: '27'
  - number: '33.4'
    text: De in het eerste tot en met derde lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel33
  - number: '38'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel38
  - number: '39'
    text: 'Deze wet wordt aangehaald als: Wet havenstaatcontrole.'
    url: https://wetten.overheid.nl/BWBR0008999/2018-02-17#Artikel39
