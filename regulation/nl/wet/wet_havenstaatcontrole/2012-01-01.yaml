  - number: '3'
    text: |-
      1 Een ambtenaar van de Inspectie Verkeer en Waterstaat kan een schip ten behoeve waarvan ingevolge een of meer van
      de verdragen een certificaat of ander document is vereist, aan een inspectie of uitgebreide inspectie onderwerpen.

      2 Indien het schip niet is voorzien van een geldig ingevolge een of meer van de verdragen vereist certificaat of
      ander document of indien er gegronde redenen zijn om aan te nemen dat de toestand van het schip, de uitrusting,
      de bemanning of de leef- en werkomstandigheden aan boord niet in overeenstemming zijn met de gegevens van het
      desbetreffende vereiste certificaat of document, of met de voorschriften van een of meer van de verdragen,
      onderwerpt een ambtenaar van de Inspectie Verkeer en Waterstaat het schip aan een meer gedetailleerde inspectie.

      3 Na een inspectie, een meer gedetailleerde inspectie of een uitgebreide inspectie overhandigt de ambtenaar van de
      Inspectie Verkeer en Waterstaat in kopie een rapport aan de kapitein van het schip dat gegevens bevat betreffende:

      a. de resultaten van de inspectie, de meer gedetailleerde inspectie of de uitgebreide inspectie,

      b. de door de ambtenaar van de Inspectie Verkeer en Waterstaat genomen besluiten, en

      c. de door de kapitein of de exploitant van het schip te treffen maatregelen.
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel3
  - number: '4'
    text: |-
      Voorzover [artikel 3][ref1] niet van toepassing is, kan een ambtenaar van de Inspectie Verkeer en Waterstaat een
      schip ten behoeve waarvan ingevolge een of meer van de verdragen geen certificaat of ander document is vereist, of
      een schip dat de vlag voert van een staat die geen partij is bij een of meer van de verdragen, onderwerpen aan een
      controle, teneinde op een zoveel mogelijk overeenkomstige wijze als bedoeld in [artikel 3][ref2] na te gaan of de
      toestand van het schip, de uitrusting, de leden van de bemanning, of de leef- en werkomstandigheden aan boord van
      het schip geen gevaar vormen voor de veiligheid, de gezondheid of de verontreiniging van het mariene milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel3
