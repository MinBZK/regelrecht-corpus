  - number: 11b
    text: |-
      1 De havenbeheerder weigert een schip, met uitzondering van een vissersvaartuig, waarvoor toestemming is verleend
      om naar een reparatiewerf te vertrekken, de toegang tot de haven, indien dat schip vanuit een haven van een
      lidstaat is uitgevaren of vanuit een andere bij het MOU aangesloten havenstaat naar zee is vertrokken:

      a. zonder dat voldaan is aan de gestelde voorwaarden voor de reis, of

      b. zonder zich te begeven naar de gekozen dichtstbijzijnde reparatiewerf.

      2 De havenbeheerder bevestigt een weigering als bedoeld in het eerste lid zo spoedig mogelijk schriftelijk.

      3 In een situatie als bedoeld in het eerste lid laat de havenbeheerder het schip toe in de haven op het moment dat
      de kapitein of exploitant naar het oordeel van de bevoegde autoriteit van de lidstaat waar de tekortkoming aan het
      schip is geconstateerd, heeft aangetoond dat het schip aan de voorschriften van de verdragen voldoet.
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel11b
  - number: 11c
    text: |-
      In afwijking van het bepaalde in [artikel 11][ref1] en [11b][ref2] kan de havenbeheerder in overeenstemming met
      Onze Minister een schip in de haven toelaten in geval van overmacht, prevalerende veiligheidsredenen of om het
      gevaar van vervuiling te beperken of te minimaliseren of tekortkomingen te verhelpen, mits de kapitein of de
      exploitant naar het oordeel van de havenbeheerder afdoende maatregelen voor een veilige binnenkomst heeft genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel11b
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel11c
