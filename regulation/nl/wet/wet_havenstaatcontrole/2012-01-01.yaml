  - number: '10'
    text: |-
      1 Een ambtenaar van de Inspectie Verkeer en Waterstaat heft de stopzetting van een activiteit op indien geen
      duidelijk gevaar bestaat voor de veiligheid, de gezondheid en het mariene milieu.

      2 Een ambtenaar van de Inspectie Verkeer en Waterstaat heft de aanhouding op indien:

      a. de redenen, genoemd in [artikel 7, eerste lid, onder a tot en met d][ref1], niet van toepassing zijn, of het
      schip onder voorwaarden als bedoeld in [artikel 9, eerste lid][ref2], mag vertrekken; en

      b. de exploitant de vergoeding voor de kosten, bedoeld in [artikel 14, eerste lid][ref3], heeft voldaan of ten
      genoegen van Onze Minister voldoende zekerheid heeft gesteld voor de vergoeding voor deze kosten.

      3 In afwijking van [artikel 3:41 van de Algemene wet bestuursrecht][ref4] geschiedt de bekendmaking van het besluit
      dat strekt tot opheffing van de stopzetting van een activiteit of de aanhouding door uitreiking van dit besluit aan
      de kapitein.

      4 Op het besluit dat strekt tot opheffing van de stopzetting van een activiteit of de aanhouding, is
      [artikel 8, tweede en derde lid][ref5], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel7
