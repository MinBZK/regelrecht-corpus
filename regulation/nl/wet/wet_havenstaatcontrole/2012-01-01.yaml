        artikel: '4'
        hoofdstuk: II
  - number: '7'
    text: |-
      1 Een ambtenaar van de Inspectie Verkeer en Waterstaat houdt een schip aan:

      a. indien wordt voldaan aan een of meer van de criteria die ingevolge bijlage X van de richtlijn tot de aanhouding
      van een schip kunnen leiden;

      b. indien het niet is uitgerust met een functionerend reisgegevens-recordersysteem, terwijl het gebruik daarvan
      voor dat schip verplicht is op grond van richtlijn 2002/59/EG van het Europees Parlement en de Raad van de Europese
      Unie van 27 juni 2002 betreffende de invoering van een communautair monitoring- en informatiesysteem voor der
      zeescheepvaart en tot intrekking van richtlijn 93/75/EEG van de Raad (PbEG L 208);

      c. indien de kapitein of de bemanning niet voldoet aan operationele voorschriften, bedoeld in een of meer van de
      verdragen;

      d. indien andere tekortkomingen dan bedoeld onder a zijn geconstateerd die afzonderlijk of gezamenlijk maken dat
      uitvaren gevaarlijk is voor de veiligheid of de gezondheid dan wel schadelijk is voor het mariene milieu; of

      e. indien de ambtenaar wordt belemmerd in de uitoefening van zijn taak.

      2 In afwijking van het eerste lid, onderdeel a, zijn voor de aanhouding van een vissersvaartuig niet van toepassing
      de bij ministeriële regeling aan te geven onderdelen van bijlage X van de richtlijn, die ingevolge de verdragen
      niet op vissersvaartuigen kunnen worden toegepast.

      3 Het eerste lid, onder c, is niet van toepassing op de aanhouding van vissersvaartuigen, met dien verstande dat
      onbekendheid met operationele voorschriften een aanhoudingsgrond voor vissersvaartuigen kan vormen, voorzover de
      verdragen dat toestaan.

      4 Het eerste en tweede lid zijn van overeenkomstige toepassing op een schip als bedoeld in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel4
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel7
