  - number: '13'
    text: |-
      1 Het is de kapitein van een aangehouden schip verboden dat schip te doen verplaatsen zonder voorafgaande
      toestemming van een ambtenaar van de Inspectie Verkeer en Waterstaat.

      2 Het is de kapitein van een aangehouden schip verboden om met dat schip uit te varen.

      3 Indien een activiteit is stopgezet, is het de kapitein en de exploitant verboden om deze activiteit voort te
      zetten, dan wel deze activiteit te hervatten.

      4 Zonder voorafgaande toestemming als bedoeld in het eerste lid, of zolang een schip is aangehouden, weigeren alle
      betrokken ambtenaren en registerloodsen hun medewerking bij de uitklaring en de verplaatsing van het schip.
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel13
  - number: '14'
    text: |-
      1 Indien een schip, met uitzondering van een vissersvaartuig, is aangehouden, betaalt de exploitant van dat schip
      aan de inspecteur-generaal een vergoeding:

      a. voor alle kosten van de inspectie, de meer gedetailleerde inspectie, de uitgebreide inspectie of de controle,
      bedoeld in [artikel 4][ref1], die tot de aanhouding heeft geleid,

      b. voor alle kosten van de inspectie, de meer gedetailleerde inspectie, de uitgebreide inspectie of de controle,
      bedoeld in [artikel 4][ref2], die tot de opheffing daarvan heeft geleid, en

      c. voor alle kosten in verband met de aanhouding in de haven.

      2 Indien een schip dat de toegang tot de haven is geweigerd, aan een inspectie wordt onderworpen alvorens
      het besluit, bedoeld in [artikel 11, tweede lid][ref3], wordt ingetrokken dan wel het schip op grond van
      [artikel 11b, derde lid][ref4], kan worden toegelaten, betaalt de exploitant van dat schip aan Onze Minister een
      vergoeding voor de kosten van deze inspectie.

      3 Bij ministeriële regeling worden de tarieven vastgesteld voor de vergoedingen, bedoeld in het eerste en het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008999#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0008999#Artikel11b
