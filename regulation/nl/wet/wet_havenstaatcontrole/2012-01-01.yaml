  - number: '15'
    text: |-
      1 Onze Minister kan voor bepaalde door hem aan te wijzen taken verband houdende met de inspectie, de
      meer gedetailleerde inspectie, de uitgebreide inspectie of de controle, bedoeld in [artikel 4][ref1],
      ambtenaren van andere diensttakken ter beschikking stellen van de Inspectie Verkeer en Waterstaat. Indien de
      terbeschikkingstelling ambtenaren betreft ressorterende onder een ander ministerie dan dat van Onze Minister, wordt
      het desbetreffende besluit genomen in overeenstemming met de minister van het andere ministerie.

      2 Van het besluit, bedoeld in het eerste lid, wordt mededeling gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel4
