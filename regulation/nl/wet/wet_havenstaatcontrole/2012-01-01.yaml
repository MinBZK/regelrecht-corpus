      - id: ref2
        bwb_id: BWBR0008999
        artikel: 11b
        hoofdstuk: IV
  - number: 11d
    text: |-
      1 Onze Minister kan een besluit nemen tot verwijdering van een schip uit een haven indien bij een inspectie wordt
      vastgesteld dat het certificaat, bedoeld in bijlage IV, onder 41, van de richtlijn niet aan boord is.

      2 De havenbeheerder van een haven weigert een schip de toegang tot zijn haven, indien met betrekking tot dit schip
      in een haven van een lidstaat een besluit is genomen tot verwijdering ervan vanwege het niet aan boord hebben
      van het certificaat, bedoeld in bijlage IV, onder 41, van de richtlijn totdat de exploitant kennis geeft van een
      dergelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel11d
  - number: '12'
    text: |-
      1 De kapitein en de exploitant van een schip zijn verplicht te voldoen aan de voorwaarden, bedoeld in
      [artikel 9, eerste lid, tweede volzin][ref1].

      2 Zolang een schip de toegang tot een haven wordt geweigerd, is het de kapitein verboden het schip die haven te
      doen binnenvaren.

      3 De kapitein van een aangehouden schip is verplicht dat schip na de aanhouding ligplaats te doen nemen op een door
      een ambtenaar van de Inspectie Verkeer en Waterstaat in overeenstemming met de havenbeheerder aan te wijzen plaats.

      4 Indien het de kapitein van een schip op grond van [artikel 11, vijfde lid][ref2], is toegestaan een schip de
      haven binnen te varen, is het de kapitein en de exploitant verboden ladinghandelingen uit te voeren totdat het
      besluit, bedoeld in artikel 11, tweede lid, is ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel11
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel12
