  - number: '11'
    text: |-
      1 De havenbeheerder weigert de toegang tot de haven van elk schip, dat:

      a. vaart onder de vlag van een staat met een aanhoudingsgraad die onder de zwarte lijst valt die overeenkomstig
      het MOU op basis van in de inspectiedatabank geregistreerde informatie is vastgesteld en zoals jaarlijks door
      de Europese Commissie wordt bekendgemaakt, en dat meer dan twee keer is aangehouden of waarvan de inzet meer dan
      twee keer is belet in de voorafgaande 36 maanden in een haven van een lidstaat of een staat die het MOU heeft
      ondertekend, of

      b. vaart onder de vlag van een staat met een aanhoudingsgraad die onder de grijze lijst valt die overeenkomstig
      het MOU op basis van in de inspectiedatabank geregistreerde informatie is vastgesteld en jaarlijks door de Europese
      Commissie wordt bekendgemaakt, en dat meer dan twee keer is aangehouden of waarvan de inzet meer dan twee keer is
      belet in de voorafgaande 24 maanden in een haven van een lidstaat of een staat die het MOU heeft ondertekend.

      2 De weigering van toegang, bedoeld in het eerste lid, geldt zodra een schip de haven van een lidstaat heeft
      verlaten waar het voor een derde keer is aangehouden en waar een besluit is bekendgemaakt aan de kapitein van het
      schip, de verantwoordelijke rederij en de vlaggenstaat, waarin wordt meegedeeld dat het schip de toegang tot alle
      havens van de lidstaten zal worden geweigerd.

      3 De havenbeheerder van een haven weigert een schip de toegang tot zijn haven in geval van een aanhouding van
      dit schip in een haven van een lidstaat nadat een schip reeds tweemaal een weigering van toegang heeft opgelegd
      gekregen.

      4 De havenbeheerder weigert een schip permanent de toegang tot een haven indien:

      a. een schip 24 maanden na de uitvaardiging van de weigering van toegang als bedoeld in
      [artikel 11a, eerste lid, aanhef en onder b][ref1], niet voldoet aan de voorwaarden, bedoeld in artikel 11a, vierde
      lid, of

      b. een schip is aangehouden in een haven in een lidstaat en deze aanhouding volgt op een derde weigering van
      toegang.

      5 In afwijking van het bepaalde in het eerste tot en met derde lid, kan de havenbeheerder in overeenstemming met
      Onze Minister een schip toestaan zich naar een haven te begeven ten behoeve van het uitvoeren van een hernieuwde
      inspectie van het schip als bedoel in bijlage VIII van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11a
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: 11a
        hoofdstuk: IV
  - number: 11a
    text: |-
      1 Onze Minister neemt een besluit als bedoeld in [artikel 11, tweede lid][ref1], indien:

      a. de derde aanhouding, bedoeld in [artikel 11, eerste lid][ref2], plaatsvindt in een haven,

      b. de aanhouding, bedoeld in [artikel 11, derde lid][ref3], plaatsvindt in een haven, of

      c. de aanhouding, bedoeld in [artikel 11, vierde lid, onder b][ref4], plaatsvindt in een haven, waarbij tevens
      wordt meegedeeld dat de weigering van toegang van het schip tot alle havens van de lidstaten permanent is.

      2 Onze Minister trekt het besluit, bedoeld in het eerste lid, aanhef en onder a, in indien een periode van drie
      maanden is verstreken na de bekendmaking van dit besluit en wordt voldaan aan de punten 3 tot en met 9 van bijlage
      VIII van de richtlijn.

      3 Bij een tweede weigering van toegang bedraagt de periode, bedoeld in het tweede lid, twaalf maanden.

      4 Onze Minister trekt het besluit, bedoeld in het eerste lid, aanhef en onder b in na het verstrijken van een
      periode van 24 maanden, indien binnen deze periode:

      a. het schip vaart onder de vlag van een staat met een aanhoudingsgraad die niet onder de in het eerste lid
      bedoelde zwarte of grijze lijst valt,

      b. de wettelijk voorgeschreven certificaten en de classificatiecertificaten van het schip zijn afgegeven door een
      organisatie of organisaties die is, onderscheidenlijk zijn, erkend op grond van verordening (EG) nr. 391/2009 van
      het Europees Parlement en de Raad van de Europese Unie van 23 april 2009 inzake gemeenschappelijke voorschriften en
      normen voor met de inspectie en controle van schepen belaste organisaties (PbEU L 131),

      c. het schip wordt geëxploiteerd door een rederij die goed presteert als bedoeld in bijlage I, deel I.1, van de
      richtlijn, en

      d. aan de voorwaarden van bijlage VIII, punten 3 tot en met 9 van de richtlijn, is voldaan.

      5 Onze Minister maakt het besluit, bedoeld in het eerste lid, bekend aan de kapitein van het schip, de
      verantwoordelijke rederij en de vlaggenstaat en doet een afschrift toekomen aan de in punt 2 van bijlage VIII van
      de richtlijn genoemde organisaties.

      6 Onze Minister stelt de in punten 10 en 11 van bijlage VIII van de richtlijn genoemde organisaties schriftelijk in
      kennis van het in het tweede en vierde lid bedoelde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008999#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0008999#Artikel11
