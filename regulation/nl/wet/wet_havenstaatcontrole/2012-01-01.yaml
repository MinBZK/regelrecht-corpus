  - number: '8'
    text: |-
      1 In afwijking van [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht][ref1] geschiedt de bekendmaking
      van het besluit dat strekt tot de stopzetting van een activiteit of de aanhouding door uitreiking van dit besluit
      aan de kapitein.

      2 Indien uitreiking aan de kapitein niet mogelijk is, geschiedt de bekendmaking van het besluit dat strekt tot
      stopzetting van een activiteit of de aanhouding door uitreiking van dit besluit aan de naar het oordeel van de
      ambtenaar van de Inspectie Verkeer en Waterstaat daarvoor meest gerede persoon, zo spoedig mogelijk gevolgd door
      kennisgeving aan de kapitein.

      3 De ambtenaar van de Inspectie Verkeer en Waterstaat stelt de administratie van de desbetreffende vlaggenstaat of
      de consul, of bij zijn afwezigheid, de dichtstbijzijnde diplomatieke vertegenwoordiger, onmiddellijk schriftelijk
      van de aanhouding en de omstandigheden die tot de aanhouding hebben geleid, in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel341
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:41
  - number: '9'
    text: |-
      1 Indien een aangehouden schip niet in de haven van aanhouding kan worden gerepareerd of indien het gebrek, bedoeld
      in [artikel 7, tweede lid, onderdeel b][ref1], niet zonder meer in de haven van aanhouding kan worden verholpen,
      kan de ambtenaar van de Inspectie Verkeer en Waterstaat het schip toestaan naar de dichtstbijzijnde door de
      kapitein en de ambtenaar van de Inspectie Verkeer en Waterstaat gekozen geschikte reparatiewerf te vertrekken.
      Indien de reparatiewerf zich buiten Nederland bevindt, geschiedt dit onder door de bevoegde autoriteit van de
      vlaggenstaat vastgestelde en door de ambtenaar van de Inspectie Verkeer en Waterstaat goedgekeurde voorwaarden.

      2 Indien de reparatiewerf, bedoeld in het eerste lid, zich buiten Nederland bevindt, stelt de ambtenaar van
      de Inspectie Verkeer en Waterstaat de bevoegde instantie van de staat waar de reparatiewerf zich bevindt en
      de administratie van de desbetreffende vlaggenstaat, of de consul, of bij zijn afwezigheid de dichtstbijzijnde
      diplomatieke vertegenwoordiger alsmede de aangewezen inspecteurs of de erkende organisaties die verantwoordelijk
      zijn voor de afgifte van de klassecertificaten of de wettelijk voorgeschreven certificaten die overeenkomstig de
      verdragen worden afgegeven, in kennis van de voorwaarden, bedoeld in het eerste lid.

      3 Indien het gebrek, bedoeld in [artikel 7, eerste lid, onderdeel b][ref2], niet zonder meer in de haven van
      aanhouding kan worden verholpen, kan de ambtenaar in plaats van het schip op grond van het eerste lid toe te staan
      naar de dichtstbijzijnde reparatiewerf te vertrekken, verlangen dat dit gebrek wordt verholpen binnen een termijn
      van ten hoogste dertig dagen.

      4 Om havencongestie te voorkomen kan de ambtenaar van de Inspectie Verkeer en Waterstaat op verzoek van de
      havenbeheerder toestemming verlenen om een aangehouden schip naar een ander deel van de haven te verplaatsen indien
      dat op een veilige manier kan gebeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel7
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel9
