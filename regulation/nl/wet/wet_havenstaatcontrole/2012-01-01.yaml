  - number: '17'
    text: |-
      1 De [artikelen 5:12][ref1], [5:13][ref2] en [5:15 tot en met 5:20 van de Algemene wet bestuursrecht][ref3],
      zijn van overeenkomstige toepassing op een ambtenaar van de Inspectie Verkeer en Waterstaat bij de uitoefening
      van taken, verband houdende met de inspectie, de meer gedetailleerde inspectie, de uitgebreide inspectie
      of de controle, bedoeld in [artikel 4][ref4], en op een ter beschikking gestelde ambtenaar als bedoeld in
      [artikel 15, eerste lid][ref5].

      2 Een ambtenaar van de Inspectie Verkeer en Waterstaat draagt, voorzover nodig in afwijking van
      [artikel 5:12, derde lid, van de Algemene wet bestuursrecht][ref6], een legitimatiebewijs bij zich, overeenkomstig
      het model, bedoeld in artikel 22, vierde lid, van de richtlijn.


