preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op richtlijn nr. 95/21/EG van de Raad van de Europese
    Unie van 19 juni 1995 betreffende de naleving, met betrekking tot de schepen die gebruik maken van havens in de
    Gemeenschap en varen in de onder de jurisdictie van de lid-staten vallende wateren, van internationale normen
    op het gebied van de veiligheid van schepen, voorkoming van verontreiniging en leef- en werkomstandigheden aan
    boord (havenstaatcontrole) (PbEG L 157), noodzakelijk is, mede ter vervanging van de daarop betrekking hebbende
    bepalingen in enkele wetten, algemene regels te stellen ten aanzien van havenstaatcontrole;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. verdrag:

      1°. het op 5 april 1966 te Londen tot stand gekomen Verdrag inzake de uitwatering van schepen (*Trb*. 1966, 275),

      2°. het op 23 juni 1969 te Londen tot stand gekomen Verdrag inzake de meting van schepen (*Trb*. 1970, 122),

      3°. het op 20 oktober 1972 te Londen tot stand gekomen Verdrag inzake voorkoming van aanvaringen op zee (*Trb*.
      1974, 51),

      4°. het op 2 november 1973 te Londen tot stand gekomen Verdrag inzake voorkoming van verontreiniging door schepen
      (*Trb*. 1975, 147),

      5°. het op 1 november 1974 te Londen tot stand gekomen Verdrag inzake de beveiliging van mensenlevens op zee
      (*Trb*. 1977, 77),

      6°. het op 29 oktober 1976 te Genève tot stand gekomen Verdrag inzake de minimumnormen op koopvaardijschepen
      (*Trb*. 1977, 108),

      7°. het op 7 juli 1978 te Londen tot stand gekomen Verdrag inzake de normen voor zeevarenden inzake opleiding,
      diplomering en wachtdienst (*Trb*. 1981, 144),

      8°. de op 11 november 1988 te Londen tot stand gekomen Protocollen inzake het onder 1° en 5° genoemde verdrag, met
      bijlagen (*Trb*. 1990, 57),

      9°. een bij de onder 1° tot en met 7° genoemde verdragen Nederland bindend protocol, bindende bijlage of bindend
      aanhangsel, of

      10°. een bij algemene maatregel van bestuur aan te wijzen ander verdrag of Nederland bindend besluit van een
      volkenrechtelijke organisatie inzake de veiligheid van schepen, voorkoming van verontreiniging door schepen of
      leef- en werkomstandigheden aan boord van schepen, of een daarbij behorend Nederland bindend protocol, bindende
      bijlage of bindend aanhangsel;

      c. richtlijn: richtlijn nr. 2009/16/EG van het Europees Parlement en de Raad van de Europese Unie van 23 april 2009
      betreffende havenstaatcontrole (PbEU L 131);

      d. haven: een anker- of ligplaats voor schepen, al of niet in zee, onder jurisdictie van een haven die, tenzij
      anders bepaald, in Nederland ligt;

      e. inspectie: een bezoek aan boord van een schip teneinde na te gaan of wordt voldaan aan de geldende verdragen
      en voorschriften waarbij ten minste de in artikel 13, eerste lid, van de richtlijn vermelde controles worden
      uitgevoerd;

      f. meer gedetailleerde inspectie: inspectie waarbij het schip, de uitrusting en de bemanning, geheel of, voor zover
      van toepassing, gedeeltelijk onder de in artikel 13, derde lid, van de richtlijn beschreven omstandigheden worden
      onderworpen aan een grondig onderzoek, dat de constructie van het schip, de uitrusting, de personeelssterkte, de
      leef- en werkomstandigheden en de naleving van de operationele voorschriften aan boord omvat;

      g. uitgebreide inspectie: een inspectie die ten minste de in bijlage VII van de richtlijn opgesomde onderdelen
      omvat en in voorkomend geval tevens een meer gedetailleerde inspectie kan omvatten indien daarvoor gegronde redenen
      als bedoeld in artikel 13, derde lid, van de richtlijn zijn;

      h. exploitant: de eigenaar, rompbevrachter of ieder ander die de zeggenschap heeft over het gebruik van het schip;

      i. uitvaren: het verlaten van een aan de buitenzijde van de lijn, bedoeld in
      [artikel 1, eerste lid, onder a, van de Schepenwet][ref1], gelegen anker- of ligplaats onder Nederlandse
      jurisdictie, of het in de richting van de zee overschrijden van deze lijn;

      j. aanhouding: het verbod voor de kapitein van een schip om met dat schip uit te varen;

      k. stopzetting van een activiteit: het verbod voor de exploitant of de kapitein van een schip om een activiteit
      voort te zetten;

      l. de ambtenaren van de Inspectie Verkeer en Waterstaat: de door Onze Minister aangewezen ambtenaren van de
      Inspectie Verkeer en Waterstaat.

      m. havenbeheerder: degene die ingevolge de krachtens [artikel 4, eerste lid, van de Scheepvaartverkeerswet][ref2],
      gestelde regels, dan wel door het bevoegd gezag, bedoeld in [artikel 2 van de Scheepvaartverkeerswet][ref3],
      van de desbetreffende scheepvaartweg, is belast met de uitoefening van de bij of krachtens de
      [Scheepvaartverkeerswet][ref4] verleende bevoegdheden ten aanzien van de deelname aan het scheepvaartverkeer in een
      haven of op een scheepvaartweg die toegang geeft tot een haven;

      n. MOU: het op 26 januari 1982 te Parijs tot stand gekomen Memorandum van overeenstemming inzake toezicht op
      schepen door de havenstaat (*Trb*. 1996, 248);

      o. schip/havenraakvlak: de interactie die plaatsvindt wanneer een schip rechtstreeks en onmiddellijk betrokken
      is bij handelingen die gepaard gaan met de verplaatsing van personen of goederen, dan wel de verlening van
      havendiensten aan of vanuit het schip;

      p. klacht: informatie of rapport ingediend door een persoon of organisatie die een legitiem belang heeft bij de
      veiligheid van een schip, met inbegrip van de veiligheids- en gezondheidsrisico’s voor de bemanning, leef- en
      werkomstandigheden aan boord en de voorkoming van verontreiniging;

      q. inspectiedatabank: het informatiesysteem dat bijdraagt tot de uitvoering van de regeling inzake het
      havenstaatcontrolestelsel in de Europese Unie en betreffende de gegevens van inspecties uitgevoerd in de Europese
      Gemeenschap en in bij het MOU aangesloten havenstaten.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004364#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0004364
