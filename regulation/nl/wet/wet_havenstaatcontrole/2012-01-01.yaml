  - number: '5'
    text: |-
      1 Bij ministeriële regeling worden met inachtneming van de richtlijn regels gesteld over de te stellen
      minimumeisen, waaraan de ambtenaren, bedoeld in [artikel 1, onderdeel k][ref1], moeten voldoen en over de wijze
      waarop die ambtenaren hun taak ingevolge deze wet uitoefenen.

      2 In de regeling worden ten minste regels gesteld betreffende:

      a. aantallen jaarlijks te inspecteren schepen,

      b. categorieën met voorrang te inspecteren schepen,

      c. categorieën van een inspectie uit te zonderen schepen,

      d. tijdstippen waarop en periodes waarbinnen een inspectie, een meer gedetailleerde of een uitgebreide inspectie
      plaatsvindt,

      e. omstandigheden waarin een inspectie kan worden uitgesteld,

      f. gegronde redenen voor een meer gedetailleerde inspectie,

      g. te controleren certificaten en andere documenten,

      h. de te stellen eisen aan het rapport, bedoeld in [artikel 3, derde lid][ref2],

      i. de in acht te nemen procedures en richtsnoeren bij een inspectie, een meer gedetailleerde inspectie, een
      uitgebreide inspectie en een controle als bedoeld in [artikel 4][ref3].

      3 In de regeling kan worden bepaald dat deze geheel of gedeeltelijk niet van toepassing is op vissersvaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008999#Artikel4
