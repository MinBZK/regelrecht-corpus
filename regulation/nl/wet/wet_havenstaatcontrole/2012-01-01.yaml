        artikel: '15'
        hoofdstuk: VI
  - number: '19'
    text: |-
      Een ambtenaar van de Inspectie Verkeer en Waterstaat is bevoegd leden van de bemanning te onderwerpen aan
      een onderzoek inzake hun vakbekwaamheid, met inbegrip van hun bekwaamheid in het verrichten van operationele
      handelingen.
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel19
  - number: '26'
    text: |-
      1 Tegen besluiten van een ambtenaar van de Inspectie Verkeer en Waterstaat of een havenbeheerder kan iedere
      belanghebbende beroep instellen bij Onze Minister.

      2 Het beroepschrift is gesteld in de Nederlandse of de Engelse taal.

      3 Indien het beroepschrift telegrafisch of per telex wordt ingediend, kan de ondertekening, in afwijking van
      [artikel 6:5 van de Algemene wet bestuursrecht][ref1], achterwege blijven.

      4 Indien onverwijlde spoed, gelet op de betrokken belangen, dat vereist, kan Onze Minister bepalen dat het beroep
      de werking schorst van het besluit waartegen het is gericht, met uitzondering van het besluit dat strekt tot de
      aanhouding of de weigering van toegang van een schip.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel65
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 6:5
  - number: 26a
    text: |-
      1 Onze Minister draagt zorg voor de behandeling van alle klachten die worden ingediend.

      2 Bij ministeriële regeling worden regels gesteld met betrekking tot de behandeling van klachten als bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel26a
  - number: '27'
    text: |-
      De exploitant die zich bij beroep bij de rechtbank beroept op een onnodige aanhouding of onnodig oponthoud, draagt
      de bewijslast daarvan.
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel27
  - number: '29'
    text: |-
      Bij ministeriële regeling worden ter uitvoering van de [hoofdstukken II tot en met V][ref1] en met inachtneming van
      de artikelen 19, 21 en 23, eerste en tweede lid, van de richtlijn regels gesteld inzake de instanties:

      a. met wie en op welke wijze een ambtenaar van de Inspectie Verkeer en Waterstaat overleg moet voeren, dan wel door
      wie en op welke wijze met hem overleg moet worden gevoerd; of

      b. aan wie een ambtenaar van de Inspectie Verkeer en Waterstaat gegevens kan of moet melden, dan wel door wie aan
      hem gegevens kunnen of moeten worden gemeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008999
        hoofdstuk: II
  - number: '30'
    text: |-
      Ter uitvoering van internationale afspraken of besluiten van volkenrechtelijke organisaties inzake onderwerpen
      waarop deze wet van toepassing is, kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel30
  - number: '31'
    text: |-
      1 Een wijziging van bijlage X van de richtlijn, van het model bedoeld in artikel 22, vierde lid, van de richtlijn
      of van de artikelen 19, 21 en 23, eerste en tweede lid, van de richtlijn, gaat voor de toepassing van de
      [artikelen 7, eerste lid, onder a, en tweede lid][ref1], [17, tweede lid][ref2], en [29][ref3] gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.

      2 Een wijziging van de verdragen gaat voor de toepassing van de [artikelen 3][ref4], [4][ref5],
      [7, eerste lid, onder c, en derde lid][ref6], en [artikel 11a, derde lid][ref7], gelden met ingang van de dag
      waarop de betrokken wijziging door Nederland is aanvaard en internationaal in werking is getreden.

      3 Een wijziging van bijlage 2 van het MOU gaat voor de toepassing van [artikel 9, tweede lid][ref8], gelden met
      ingang van de dag waarop de wijziging in werking treedt.


