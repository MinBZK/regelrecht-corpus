  - number: '2'
    text: |-
      1 Het bij of krachtens deze wet bepaalde is van toepassing op een schip dat niet gerechtigd is op grond van
      Nederlandse rechtsregels de vlag van het Koninkrijk te voeren, en dat, met uitzondering van de situaties, bedoeld
      in de [artikelen 11][ref1], [11a][ref2] en [12, tweede lid][ref3], een haven aandoet om een interactie schip/
      havenraakvlak te verrichten.

      2 Het bij of krachtens deze wet bepaalde is niet van toepassing op oorlogsschepen, marinehulpschepen of andere
      schepen die in gebruik zijn voor de uitvoering van de militaire taak, houten schepen van primitieve bouw en voor
      andere dan handelsdoeleinden gebruikte overheidsschepen en pleziervaartuigen.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel11a
