  - number: '6'
    text: |-
      Een ambtenaar van de Inspectie Verkeer en Waterstaat zet een activiteit stop indien bij een inspectie, een
      meer gedetailleerde inspectie, een uitgebreide inspectie of een controle als bedoeld in [artikel 4][ref1],
      tekortkomingen zijn geconstateerd die afzonderlijk of gezamenlijk maken dat voortzetting van deze activiteit
      duidelijk gevaarlijk is voor de veiligheid of de gezondheid dan wel schadelijk is voor het mariene milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel4
    url: https://wetten.overheid.nl/BWBR0008999/2012-01-01#Artikel6
    references:
