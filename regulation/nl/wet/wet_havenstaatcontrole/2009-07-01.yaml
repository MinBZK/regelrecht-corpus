$id: wet_havenstaatcontrole
regulatory_layer: WET
publication_date: '2024-05-24'
valid_from: '2009-07-01'
bwb_id: BWBR0008999
url: https://wetten.overheid.nl/BWBR0008999/2009-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op richtlijn nr. 95/21/EG van de Raad van de Europese
    Unie van 19 juni 1995 betreffende de naleving, met betrekking tot de schepen die gebruik maken van havens in de
    Gemeenschap en varen in de onder de jurisdictie van de lid-staten vallende wateren, van internationale normen
    op het gebied van de veiligheid van schepen, voorkoming van verontreiniging en leef- en werkomstandigheden aan
    boord (havenstaatcontrole) (PbEG L 157), noodzakelijk is, mede ter vervanging van de daarop betrekking hebbende
    bepalingen in enkele wetten, algemene regels te stellen ten aanzien van havenstaatcontrole;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.b
    text: 'verdrag:'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.b.1°
    text: het op 5 april 1966 te Londen tot stand gekomen Verdrag inzake de uitwatering van schepen (*Trb*. 1966, 275),
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.b.2°
    text: het op 23 juni 1969 te Londen tot stand gekomen Verdrag inzake de meting van schepen (*Trb*. 1970, 122),
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.b.3°
    text: |-
      het op 20 oktober 1972 te Londen tot stand gekomen Verdrag inzake voorkoming van aanvaringen op zee (*Trb*. 1974,
      51),
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.b.4°
    text: |-
      het op 2 november 1973 te Londen tot stand gekomen Verdrag inzake voorkoming van verontreiniging door schepen
      (*Trb*. 1975, 147),
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.b.5°
    text: |-
      het op 1 november 1974 te Londen tot stand gekomen Verdrag inzake de beveiliging van mensenlevens op zee (*Trb*.
      1977, 77),
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.b.6°
    text: |-
      het op 29 oktober 1976 te Genève tot stand gekomen Verdrag inzake de minimumnormen op koopvaardijschepen (*Trb*.
      1977, 108),
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.b.7°
    text: |-
      het op 7 juli 1978 te Londen tot stand gekomen Verdrag inzake de normen voor zeevarenden inzake opleiding,
      diplomering en wachtdienst (*Trb*. 1981, 144),
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.b.8°
    text: |-
      de op 11 november 1988 te Londen tot stand gekomen Protocollen inzake het onder 1° en 5° genoemde verdrag, met
      bijlagen (*Trb*. 1990, 57),
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.b.9°
    text: |-
      een bij de onder 1° tot en met 7° genoemde verdragen Nederland bindend protocol, bindende bijlage of bindend
      aanhangsel, of
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.b.10°
    text: |-
      een bij algemene maatregel van bestuur aan te wijzen ander verdrag of Nederland bindend besluit van een
      volkenrechtelijke organisatie inzake de veiligheid van schepen, voorkoming van verontreiniging door schepen of
      leef- en werkomstandigheden aan boord van schepen, of een daarbij behorend Nederland bindend protocol, bindende
      bijlage of bindend aanhangsel;
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.c
    text: |-
      richtlijn: de [richtlijn nr. 95/21/EG](31995L0021) van de Raad van de Europese Unie van 19 juni 1995 betreffende
      de naleving, met betrekking tot de schepen die gebruik maken van havens in de Gemeenschap en varen in de onder
      de jurisdictie van de lid-staten vallende wateren, van internationale normen op het gebied van de veiligheid
      van schepen, voorkoming van verontreiniging en leef- en werkomstandigheden aan boord (havenstaatcontrole)(*PbEG*
      L 157);
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.d
    text: 'haven: een anker- of ligplaats onder Nederlandse jurisdictie voor schepen, al of niet in zee;'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.e
    text: |-
      inspectie: een bezoek aan boord van een schip om de geldigheid van de relevante certificaten en andere documenten,
      alsmede de toestand van het schip, de uitrusting, de bemanning en de leef- en werkomstandigheden aan boord te
      controleren;
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.f
    text: |-
      nadere inspectie: een inspectie waarbij tevens het schip, de uitrusting of de bemanning, geheel of
      gedeeltelijk, worden onderworpen aan een grondig onderzoek dat de constructie van het schip, de uitrusting, de
      bemanningssamenstelling, de leef- en werkomstandigheden en de naleving van de operationele voorschriften aan boord
      omvat;
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.g
    text: 'exploitant: de eigenaar, rompbevrachter of ieder ander die de zeggenschap heeft over het gebruik van het schip;'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.h
    text: |-
      uitvaren: het verlaten van een aan de buitenzijde van de lijn, bedoeld in [artikel 1, eerste lid, onder ][ref1],
      gelegen anker- of ligplaats onder Nederlandse jurisdictie, of het in de richting van de zee overschrijden van deze
      lijn;


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '1'
  - number: 1.i
    text: 'aanhouding: het verbod voor de kapitein van een schip om met dat schip uit te varen;'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.j
    text: |-
      stopzetting van een activiteit: het verbod voor de exploitant of de kapitein van een schip om een activiteit voort
      te zetten;
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.k
    text: 'inspecteur-generaal: inspecteur-generaal van de Inspectie Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.l
    text: 'divisie Scheepvaart: divisie Scheepvaart van de Inspectie Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.m
    text: |-
      ambtenaar van de divisie Scheepvaart: een door de inspecteur-generaal aangewezen ambtenaar van de divisie
      Scheepvaart;
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: 1.n
    text: |-
      havenbeheerder: degene die ingevolge de krachtens [artikel 4, eerste lid, van de Scheepvaartverkeerswet][ref1],
      gestelde regels, dan wel door het bevoegd gezag, bedoeld in [artikel 2 van de Scheepvaartverkeerswet][ref2],
      van de desbetreffende scheepvaartweg, is belast met de uitoefening van de bij of krachtens de
      [Scheepvaartverkeerswet][ref3] verleende bevoegdheden ten aanzien van de deelname aan het scheepvaartverkeer in een
      haven of op een scheepvaartweg die toegang geeft tot een haven;


      [ref1]: https://wetten.overheid.nl/BWBR0004364#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004364#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0004364
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0004364
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004364
  - number: 1.o
    text: |-
      MOU: het op 26 januari 1982 te Parijs tot stand gekomen Memorandum van overeenstemming inzake toezicht op schepen
      door de havenstaat (*Trb*. 1996, 248).
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel1
  - number: '2.1'
    text: |-
      Het bij of krachtens deze wet bepaalde is van toepassing op een schip dat niet gerechtigd is de Nederlandse vlag
      te voeren, en dat zich, met uitzondering van de situaties, bedoeld in de artikelen 11 en 12, tweede lid, in een
      haven bevindt.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel2
  - number: '2.2'
    text: |-
      Het bij of krachtens deze wet bepaalde is niet van toepassing op oorlogsschepen, marinehulpschepen of andere
      schepen die in gebruik zijn voor de uitvoering van de militaire taak, houten schepen van primitieve bouw en voor
      andere dan handelsdoeleinden gebruikte overheidsschepen en pleziervaartuigen.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel2
  - number: '3.1'
    text: |-
      Een ambtenaar van de divisie Scheepvaart kan een schip ten behoeve waarvan ingevolge een of meer van de verdragen
      een certificaat of ander document is vereist, aan een inspectie onderwerpen.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel3
  - number: '3.2'
    text: |-
      Indien het schip niet is voorzien van een geldig ingevolge een of meer van de verdragen vereist certificaat of
      ander document of indien er gegronde redenen zijn om aan te nemen dat de toestand van het schip, de uitrusting,
      de bemanning of de leef- en werkomstandigheden aan boord niet in overeenstemming zijn met de gegevens van het
      desbetreffende vereiste certificaat of document, of met de voorschriften van een of meer van de verdragen,
      onderwerpt een ambtenaar van de divisie Scheepvaart het schip aan een nadere inspectie.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel3
  - number: '3.3'
    text: |-
      Na een inspectie of een nadere inspectie overhandigt de ambtenaar van de divisie Scheepvaart een rapport aan de
      kapitein van het schip dat gegevens bevat betreffende:
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel3
  - number: 3.3.a
    text: de resultaten van de inspectie of de nadere inspectie,
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel3
  - number: 3.3.b
    text: de door de ambtenaar van de divisie Scheepvaart genomen besluiten,
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel3
  - number: 3.3.c
    text: de door de kapitein of de exploitant van het schip te treffen maatregelen, en
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel3
  - number: 3.3.d
    text: |-
      de mogelijkheid van de publicatie, bedoeld in [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel28
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '28'
        hoofdstuk: VIII
  - number: '3.4'
    text: Het derde lid, onder *d*, is niet van toepassing op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel3
  - number: '4'
    text: |-
      Voorzover [artikel 3][ref1] niet van toepassing is, kan een ambtenaar van de divisie Scheepvaart een schip ten
      behoeve waarvan ingevolge een of meer van de verdragen geen certificaat of ander document is vereist, of een schip
      dat de vlag voert van een staat die geen partij is bij een of meer van de verdragen, onderwerpen aan een controle,
      teneinde op een zoveel mogelijk overeenkomstige wijze als bedoeld in [artikel 3][ref2] na te gaan of de toestand
      van het schip, de uitrusting, de leden van de bemanning, of de leef- en werkomstandigheden aan boord van het schip
      geen gevaar vormen voor de veiligheid, de gezondheid of de verontreiniging van het mariene milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel3
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008999
        artikel: '3'
        hoofdstuk: II
  - number: '5.1'
    text: |-
      Bij ministeriële regeling worden met inachtneming van de richtlijn regels gesteld over de te stellen minimumeisen,
      alvorens de aanwijzing, bedoeld in [artikel 1, onder k][ref1], kan plaatsvinden en over de wijze waarop de
      ambtenaren van de divisie Scheepvaart hun taak ingevolge deze wet uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel1
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: '5.2'
    text: 'In de regeling worden ten minste regels gesteld betreffende:'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel5
  - number: 5.2.a
    text: aantallen jaarlijks te inspecteren schepen,
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel5
  - number: 5.2.b
    text: categorieën met voorrang te inspecteren schepen,
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel5
  - number: 5.2.c
    text: categorieën van een inspectie uit te zonderen schepen,
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel5
  - number: 5.2.d
    text: tijdstippen waarop en periodes waarbinnen een inspectie of een nadere inspectie plaatsvindt,
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel5
  - number: 5.2.e
    text: gegronde redenen voor een nadere inspectie,
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel5
  - number: 5.2.f
    text: te controleren certificaten en andere documenten,
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel5
  - number: 5.2.g
    text: |-
      de te stellen eisen aan het rapport, bedoeld in [artikel 3, derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel3
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '3'
        hoofdstuk: II
  - number: 5.2.h
    text: |-
      de in acht te nemen procedures en richtsnoeren bij een inspectie, een nadere inspectie en een controle als bedoeld
      in [artikel 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel4
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '4'
        hoofdstuk: II
  - number: '5.3'
    text: In de regeling kan worden bepaald dat deze geheel of gedeeltelijk niet van toepassing is op vissersvaartuigen.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel5
  - number: '6'
    text: |-
      Een ambtenaar van de divisie Scheepvaart zet een activiteit stop indien bij een inspectie, een nadere inspectie of
      een controle als bedoeld in [artikel 4][ref1], tekortkomingen zijn geconstateerd die afzonderlijk of gezamenlijk
      maken dat voortzetting van deze activiteit duidelijk gevaarlijk is voor de veiligheid of de gezondheid dan wel
      schadelijk is voor het mariene milieu.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel4
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '4'
        hoofdstuk: II
  - number: '7.1'
    text: 'Een ambtenaar van de divisie Scheepvaart houdt een schip aan:'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel7
  - number: 7.1.a
    text: |-
      indien wordt voldaan aan een of meer van de criteria die ingevolge bijlage VI van de richtlijn tot de aanhouding
      van een schip kunnen leiden;
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel7
  - number: 7.1.b
    text: |-
      indien het door het in artikel 1, onderdeel b, onder 5°, genoemde verdrag voor het schip voorgeschreven geldige
      veiligheidsmanagementcertificaat (*safety management certificate*) of het ingevolge dat verdrag voorgeschreven
      afschrift van het geldige conformiteitsdocument (*document of compliance*) voor de bedrijfsvoering van de
      organisatie, aan boord van het schip ontbreekt;
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel7
  - number: 7.1.c
    text: |-
      indien de kapitein of de bemanning niet voldoet aan operationele voorschriften, bedoeld in een of meer van de
      verdragen;
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel7
  - number: 7.1.d
    text: |-
      indien andere tekortkomingen dan bedoeld onder a zijn geconstateerd die afzonderlijk of gezamenlijk maken dat
      uitvaren gevaarlijk is voor de veiligheid of de gezondheid dan wel schadelijk is voor het mariene milieu; of
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel7
  - number: 7.1.e
    text: indien de ambtenaar wordt belemmerd in de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel7
  - number: '7.2'
    text: |-
      In afwijking van het eerste lid, onderdeel a, zijn voor de aanhouding van een vissersvaartuig niet van toepassing
      de bij ministeriële regeling aan te geven onderdelen van bijlage VI van de richtlijn, die ingevolge de verdragen
      niet op vissersvaartuigen kunnen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel7
  - number: '7.3'
    text: |-
      Het eerste lid, onder *b* en *c*, is niet van toepassing op de aanhouding van vissersvaartuigen, met dien verstande
      dat onbekendheid met operationele voorschriften als bedoeld onder c een aanhoudingsgrond voor vissersvaartuigen kan
      vormen, voorzover de verdragen dat toestaan.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel7
  - number: '7.4'
    text: Het eerste en tweede lid zijn van overeenkomstige toepassing op een schip als bedoeld in artikel 4.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel7
  - number: 7a
    text: |-
      [Afdeling 5.3.1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de in de [artikelen 6][ref2] en
      [7][ref3] bedoelde bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3.1
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0008999#Artikel7
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 5.3.1
      - id: ref2
        bwb_id: BWBR0008999
        artikel: '6'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0008999
        artikel: '7'
        hoofdstuk: III
  - number: '8.1'
    text: |-
      In afwijking van [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht][ref1] geschiedt de bekendmaking van
      het besluit dat strekt tot de stopzetting van een activiteit of de aanhouding door uitreiking van dit besluit aan
      de kapitein.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '8.2'
    text: |-
      Indien uitreiking aan de kapitein niet mogelijk is, geschiedt de bekendmaking van het besluit dat strekt tot
      stopzetting van een activiteit of de aanhouding door uitreiking van dit besluit aan de naar het oordeel van de
      ambtenaar van de divisie Scheepvaart daarvoor meest gerede persoon, zo spoedig mogelijk gevolgd door kennisgeving
      aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel8
  - number: '8.3'
    text: |-
      De ambtenaar van de divisie Scheepvaart stelt de administratie van de desbetreffende vlaggenstaat of de consul,
      of bij zijn afwezigheid, de dichtstbijzijnde diplomatieke vertegenwoordiger, onmiddellijk schriftelijk van de
      aanhouding en de omstandigheden die tot de aanhouding hebben geleid, in kennis.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel8
  - number: '9.1'
    text: |-
      Indien een aangehouden schip niet in de haven van aanhouding kan worden gerepareerd, mag het schip naar de
      dichtstbijzijnde door de kapitein en de ambtenaar van de divisie Scheepvaart gekozen geschikte reparatiewerf
      vertrekken. Indien de reparatiewerf zich buiten Nederland bevindt, geschiedt dit onder door de ambtenaar van de
      divisie Scheepvaart gestelde en goedgekeurde voorwaarden die betrekking hebben op de reis naar de reparatiewerf.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel9
  - number: '9.2'
    text: |-
      Indien de reparatiewerf, bedoeld in het eerste lid, zich buiten Nederland bevindt, stelt de ambtenaar van de
      divisie Scheepvaart de bevoegde instantie van de staat waar de reparatiewerf zich bevindt en de administratie
      van de desbetreffende vlaggenstaat, of de consul, of bij zijn afwezigheid, de dichtstbijzijnde diplomatieke
      vertegenwoordiger in overeenstemming met bijlage 2 van het MOU in kennis van de voorwaarden, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel9
  - number: '10.1'
    text: |-
      Een ambtenaar van de divisie Scheepvaart heft de stopzetting van een activiteit op indien geen duidelijk gevaar
      bestaat voor de veiligheid, de gezondheid en het mariene milieu.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel10
  - number: '10.2'
    text: 'Een ambtenaar van de divisie Scheepvaart heft de aanhouding op indien:'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel10
  - number: 10.2.a
    text: |-
      de redenen, genoemd in artikel 7, eerste lid, onder *a* tot en met *e*, niet van toepassing zijn, of het schip
      onder voorwaarden als bedoeld in artikel 9, eerste lid, mag vertrekken; en
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel10
  - number: 10.2.b
    text: |-
      de exploitant de vergoeding voor de kosten, bedoeld in artikel 14, eerste lid, heeft voldaan of ten genoegen van de
      inspecteur-generaal voldoende zekerheid heeft gesteld voor de vergoeding voor deze kosten.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel10
  - number: '10.3'
    text: |-
      Een ambtenaar van de divisie Scheepvaart kan de aanhouding, gegrond op artikel 7, eerste lid, onderdeel b,
      opheffen, indien:
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel10
  - number: 10.3.a
    text: er geen andere redenen aanwezig zijn op grond waarvan het schip kan worden aangehouden; en
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel10
  - number: 10.3.b
    text: de voortzetting van de aanhouding tot congestie in de haven van aanhouding zou leiden.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel10
  - number: '10.4'
    text: |-
      In afwijking van [artikel 3:41 van de Algemene wet bestuursrecht][ref1] geschiedt de bekendmaking van het besluit
      dat strekt tot opheffing van de stopzetting van een activiteit of de aanhouding door uitreiking van dit besluit aan
      de kapitein.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '10.5'
    text: |-
      Op het besluit dat strekt tot opheffing van de stopzetting van een activiteit of de aanhouding, is artikel 8,
      tweede en derde lid, van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel10
  - number: '11.1'
    text: |-
      De havenbeheerder weigert in overeenstemming met de inspecteur-generaal een schip, met uitzondering van een
      vissersvaartuig, waarvoor toestemming is verleend om naar een reparatiewerf te vertrekken, de toegang tot de haven,
      met uitzondering van anker- of ligplaatsen in zee, indien dat schip vanuit een andere haven is uitgevaren of vanuit
      een andere bij het MOU aangesloten havenstaat naar zee is vertrokken:
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel11
  - number: 11.1.a
    text: zonder dat voldaan is aan de gestelde voorwaarden voor de reis; of
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel11
  - number: 11.1.b
    text: zonder zich te begeven naar de gekozen dichtstbijzijnde reparatiewerf.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel11
  - number: '11.2'
    text: |-
      De havenbeheerder weigert in overeenstemming met de inspecteur-generaal een schip waarvan de aanhouding is
      opgeheven ingevolge artikel 10, derde lid, dan wel waarvan de aanhouding in een andere bij het MOU aangesloten
      havenstaat om dezelfde reden is opgeheven, de toegang tot de haven, met uitzondering van anker- of ligplaatsen
      in zee.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel11
  - number: '11.3'
    text: De havenbeheerder bevestigt een weigering als bedoeld in het eerste of tweede lid zo spoedig mogelijk schriftelijk.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel11
  - number: '11.4'
    text: |-
      In een situatie als bedoeld in het eerste of tweede lid, laat de havenbeheerder in overeenstemming met de
      inspecteur-generaal het schip toe in de haven op het moment dat de kapitein of de exploitant heeft aangetoond dat
      het schip aan de voorschriften van de verdragen voldoet.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel11
  - number: '11.5'
    text: |-
      In afwijking van het eerste of tweede lid, kan de havenbeheerder in overeenstemming met de inspecteur-generaal het
      schip in de haven toelaten in geval van overmacht, prevalerende veiligheidsredenen of om het gevaar van vervuiling
      te beperken of te minimaliseren of tekortkomingen te verhelpen, mits de kapitein of de exploitant afdoende
      maatregelen voor een veilige binnenkomst heeft genomen.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel11
  - number: '12.1'
    text: |-
      De kapitein en de exploitant van een schip zijn verplicht te voldoen aan de voorwaarden, bedoeld in
      [artikel 9, eerste lid, tweede volzin][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel9
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '9'
        hoofdstuk: III
  - number: '12.2'
    text: |-
      Zolang een schip de toegang tot een haven wordt geweigerd, is het de kapitein verboden het schip die haven te doen
      binnenvaren.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel12
  - number: '12.3'
    text: |-
      De kapitein van een aangehouden schip is verplicht dat schip na de aanhouding ligplaats te doen nemen op een door
      een ambtenaar van de divisie Scheepvaart in overeenstemming met de havenbeheerder aan te wijzen plaats.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel12
  - number: '13.1'
    text: |-
      Het is de kapitein van een aangehouden schip verboden dat schip te doen verplaatsen zonder voorafgaande toestemming
      van een ambtenaar van de divisie Scheepvaart.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel13
  - number: '13.2'
    text: Het is de kapitein van een aangehouden schip verboden om met dat schip uit te varen.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel13
  - number: '13.3'
    text: |-
      Indien een activiteit is stopgezet, is het de kapitein en de exploitant verboden om deze activiteit voort te
      zetten, dan wel deze activiteit te hervatten.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel13
  - number: '13.4'
    text: |-
      Zonder voorafgaande toestemming als bedoeld in het eerste lid, of zolang een schip is aangehouden, weigeren alle
      betrokken ambtenaren en registerloodsen hun medewerking bij de uitklaring en de verplaatsing van het schip.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel13
  - number: '14.1'
    text: |-
      Indien een schip, met uitzondering van een vissersvaartuig, is aangehouden, betaalt de exploitant van dat schip aan
      de inspecteur-generaal een vergoeding voor de kosten van de inspectie, de nadere inspectie of de controle, bedoeld
      in [artikel 4][ref1], die tot de aanhouding heeft geleid, en van de inspectie, de nadere inspectie of de controle,
      bedoeld in [artikel 4][ref2], die tot de opheffing daarvan heeft geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008999#Artikel4
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008999
        artikel: '4'
        hoofdstuk: II
  - number: '14.2'
    text: |-
      Indien een schip dat de toegang tot de haven is geweigerd, aan een inspectie wordt onderworpen alvorens het schip
      op grond van [artikel 11, derde lid][ref1], kan worden toegelaten, betaalt de exploitant van dat schip aan de
      inspecteur-generaal een vergoeding voor de kosten van deze inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel11
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '11'
        hoofdstuk: IV
  - number: '14.3'
    text: |-
      Bij ministeriële regeling worden de tarieven vastgesteld voor de vergoedingen, bedoeld in het eerste en het tweede
      lid.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister kan voor bepaalde door hem aan te wijzen taken verband houdende met de inspectie, de nadere inspectie
      of de controle, bedoeld in artikel 4, ambtenaren van andere diensttakken ter beschikking stellen van de divisie
      Scheepvaart. Indien de terbeschikkingstelling ambtenaren betreft ressorterende onder een ander ministerie dan
      dat van Onze Minister, wordt het desbetreffende besluit genomen in overeenstemming met de minister van het andere
      ministerie.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel15
  - number: '15.2'
    text: Van het besluit, bedoeld in het eerste lid, wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel15
  - number: '16'
    text: |-
      Met het toezicht op de naleving van de [hoofdstukken IV][ref1] en [V][ref2] zijn belast de ambtenaren van de
      divisie Scheepvaart.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0008999#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008999
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0008999
        hoofdstuk: V
  - number: '17.1'
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2] en [5:15][ref3] tot en met [5:20 van de Algemene wet bestuursrecht][ref4],
      zijn van overeenkomstige toepassing op een ambtenaar van de divisie Scheepvaart bij de uitoefening van taken,
      verband houdende met de inspectie, de nadere inspectie of de controle, bedoeld in [artikel 4][ref5], en op een ter
      beschikking gestelde ambtenaar als bedoeld in [artikel 15, eerste lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0008999#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0008999#Artikel15
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0008999
        artikel: '4'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0008999
        artikel: '15'
        hoofdstuk: VI
  - number: '17.2'
    text: |-
      Een ambtenaar van de divisie Scheepvaart draagt, voorzover nodig in afwijking van
      [artikel 5:12, derde lid, van de Algemene wet bestuursrecht][ref1], een legitimatiebewijs bij zich, overeenkomstig
      het model, bedoeld in artikel 12, vierde lid, van de richtlijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '18'
    text: |-
      Een ambtenaar van de divisie Scheepvaart en een ter beschikking gestelde ambtenaar als bedoeld in
      [artikel 15, eerste lid][ref1], zijn bevoegd, met medeneming van de benodigde apparatuur, woongedeelten van schepen
      binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0008999#Artikel15
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008999
        artikel: '15'
        hoofdstuk: VI
  - number: '19'
    text: |-
      Een ambtenaar van de divisie Scheepvaart is bevoegd leden van de bemanning te onderwerpen aan een onderzoek inzake
      hun vakbekwaamheid, met inbegrip van hun bekwaamheid in het verrichten van operationele handelingen.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel19
  - number: '26.1'
    text: |-
      Tegen besluiten van een ambtenaar van de divisie Scheepvaart of een havenbeheerder kan iedere belanghebbende beroep
      instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel26
  - number: '26.2'
    text: Het beroepschrift is gesteld in de Nederlandse of de Engelse taal.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel26
  - number: '26.3'
    text: |-
      Indien het beroepschrift telegrafisch of per telex wordt ingediend, kan de ondertekening, in afwijking van
      [artikel 6:5 van de Algemene wet bestuursrecht][ref1], achterwege blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '26.4'
    text: |-
      Indien onverwijlde spoed, gelet op de betrokken belangen, dat vereist, kan Onze Minister bepalen dat het beroep
      de werking schorst van het besluit waartegen het is gericht, met uitzondering van het besluit dat strekt tot de
      aanhouding van een schip.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel26
  - number: '27'
    text: |-
      De exploitant die zich bij beroep bij de rechtbank beroept op een onnodige aanhouding of onnodig oponthoud, draagt
      de bewijslast daarvan.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel27
  - number: '28'
    text: |-
      Onze Minister draagt er zorg voor dat ten minste elke maand de gegevens, bedoeld in bijlage VIII, deel I, van de
      richtlijn, worden gepubliceerd betreffende schepen, met uitzondering van vissersvaartuigen, die de voorgaande maand
      zijn aangehouden in, of die onderworpen zijn aan een weigering van toegang tot een haven.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel28
  - number: '29'
    text: |-
      Bij ministeriële regeling worden ter uitvoering van de [hoofdstukken II tot en met V][ref1] en met inachtneming
      van de artikelen 9, 9bis, 11 en 13 van de richtlijn regels gesteld inzake de instanties andere dan genoemd in de
      [hoofdstukken II tot en met V][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0008999#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0008999#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008999
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0008999
        hoofdstuk: II
  - number: 29.a
    text: |-
      met wie en op welke wijze een ambtenaar van de divisie Scheepvaart overleg moet voeren, dan wel door wie en op
      welke wijze met hem overleg moet worden gevoerd; of
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel29
  - number: 29.b
    text: |-
      aan wie een ambtenaar van de divisie Scheepvaart gegevens kan of moet melden, dan wel door wie aan hem gegevens
      kunnen of moeten worden gemeld.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel29
  - number: '30'
    text: |-
      Ter uitvoering van internationale afspraken of besluiten van volkenrechtelijke organisaties inzake onderwerpen
      waarop deze wet van toepassing is, kunnen bij ministeriële regeling nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel30
  - number: '31.1'
    text: |-
      Een wijziging van bijlage VI van de richtlijn, van het model, bedoeld in artikel 12, vierde lid, van de richtlijn,
      in de publicatiegegevens, bedoeld in bijlage VIII, van de richtlijn, of van de artikelen 9, 9bis, 11 en 13 van de
      richtlijn, gaat voor de toepassing van de artikelen 7, eerste lid, onder a, en tweede lid, 17, tweede lid, 28 en 29
      gelden met ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel31
  - number: '31.2'
    text: |-
      Een wijziging van de verdragen gaat voor de toepassing van de artikelen 3, 4, 7, eerste lid, onder c, en derde
      lid, en 11, vierde lid, gelden met ingang van de dag waarop de betrokken wijziging door Nederland is aanvaard en
      internationaal in werking is getreden.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel31
  - number: '31.3'
    text: |-
      Een wijziging van bijlage 2 van het MOU gaat voor de toepassing van artikel 9, tweede lid, gelden met ingang van de
      dag waarop de wijziging in werking treedt.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel31
  - number: '32'
    text: |-
      De eerste publicatie, bedoeld in artikel 28, eerste lid, na inwerkingtreding van deze wet, kan betrekking hebben op
      een gedeelte van een kwartaal.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel32
  - number: '33.1'
    text: |-
      Overtreding van artikel 12, tweede lid, wordt gestraft met hechtenis van ten hoogste twee maanden of geldboete van
      de derde categorie.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel33
  - number: '33.2'
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel33
  - number: '38'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel38
  - number: '39'
    text: 'Deze wet wordt aangehaald als: Wet havenstaatcontrole.'
    url: https://wetten.overheid.nl/BWBR0008999/2009-07-01#Artikel39
