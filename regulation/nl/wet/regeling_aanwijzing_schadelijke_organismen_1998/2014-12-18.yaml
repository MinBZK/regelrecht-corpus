$id: regeling_aanwijzing_schadelijke_organismen_1998
regulatory_layer: WET
publication_date: '2021-02-26'
valid_from: '2014-12-18'
bwb_id: BWBR0009774
url: https://wetten.overheid.nl/BWBR0009774/2014-12-18
preamble:
  text: |-
    Gelet op de artikelen 16, 17 en 18 van het Besluit bestrijding schadelijke organismen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009774/2014-12-18#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            besluit:

              [Besluit bestrijding schadelijke organismen][ref1];




              [richtlijn 2000/29/EG](32000L0029):

              richtlijn van de Raad van 8 mei 2000 betreffende de beschermende maatregelen tegen het binnenbrengen en de
      verspreiding in de Gemeenschap van voor planten en voor plantaardige producten schadelijke organismen (PbEG L 169).


      [ref1]: https://wetten.overheid.nl/BWBR0005206
    url: https://wetten.overheid.nl/BWBR0009774/2014-12-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005206
  - number: '2'
    text: |-
      Als ambtenaar bedoeld in [artikel 16 van het besluit][ref1] worden aangewezen de ambtenaren van de
      Plantenziektenkundige Dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel16
    url: https://wetten.overheid.nl/BWBR0009774/2014-12-18#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '16'
  - number: '3'
    text: |-
      Als schadelijke organismen bedoeld in [artikel 16 van het besluit][ref1] worden aangewezen de schadelijke
      organismen genoemd in bijlage I, deel A, en bijlage II, deel A, bij [richtlijn 2000/29/EG](32000L0029),
      uitgezonderd de organismen genoemd in de bijlage bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel16
    url: https://wetten.overheid.nl/BWBR0009774/2014-12-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '16'
  - number: '4'
    text: |-
      Als schadelijke organismen bedoeld in de [artikelen 17, eerste lid][ref1], en [18 van het besluit][ref2] worden
      aangewezen de schadelijke organismen genoemd in bijlage I, deel A, en bijlage II, deel A, bij [richtlijn 2000/29/
      EG](32000L0029).


      [ref1]: https://wetten.overheid.nl/BWBR0005206#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0005206#Artikel18
    url: https://wetten.overheid.nl/BWBR0009774/2014-12-18#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005206
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0005206
        artikel: '18'
  - number: '5'
    text: |-
      Een wijziging van een of meer onderdelen van de in de [artikelen 3][ref1] en [4][ref2] genoemde bijlagen bij
      [richtlijn 2000/29/EG](32000L0029) treedt voor de toepassing van deze artikelen in werking met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven. Onze minister doet van een wijziging als
      bedoeld in het eerste lid mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009774#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009774#Artikel4
    url: https://wetten.overheid.nl/BWBR0009774/2014-12-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0009774
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0009774
        artikel: '4'
  - number: '6'
    text: De Regeling aanwijzing schadelijke organismen 1984 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009774/2014-12-18#Artikel6
  - number: '7'
    text: 'Deze regeling kan worden aangehaald als: Regeling aanwijzing schadelijke organismen 1998.'
    url: https://wetten.overheid.nl/BWBR0009774/2014-12-18#Artikel7
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009774/2014-12-18#Artikel8
