  - number: '4.1'
    text: |-
      1 De bepaling van de samenstelling van schone grond bedoeld in [artikel 5, tweede lid, van het besluit][ref1]
      vindt plaats overeenkomstig [bijlage F, hoofdstuk 1][ref2]. Voorzover daarbij geen gebruik kan worden gemaakt
      van de in [bijlage A][ref3] aangegeven normen of van de VPR’s wordt de bepaling van de samenstelling van grond
      overeenkomstig [bijlage G][ref4] uitgevoerd. De bepaling van de samenstelling van schone grond mag in afwijking van
      [bijlage F, hoofdstuk 1][ref5], ook plaatsvinden met behulp van een steekproefopzet en daarbij behorende toetsing
      zoals beschreven in [bijlage J][ref6] van deze regeling.

      2 Gevallen als bedoeld in [artikel 5, derde lid, onder a, van het besluit][ref7] zijn:

      a. het gebruiken van schone grond in een werk waarbij de totale hoeveelheid niet meer dan 50 m3 bedraagt;

      b. het gebruiken van schone grond in een werk dat niet anders omvat dan de bouw van een particuliere woning, danwel
      van een bedrijfspand van vergelijkbare omvang.


