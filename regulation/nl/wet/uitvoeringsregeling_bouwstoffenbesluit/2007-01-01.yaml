  - number: 7.5.1.1
    text: |-
      1 De bepaling of de uitloging van een anorganische stof uit een vormgegeven bouwstof diffusie-bepaald is, vindt
      plaats door onderzoek van de bouwstof volgens NEN 7345, onderdelen 8.4 en 9.3.

      2 De uitloging wordt ook als diffusie-bepaald aangemerkt, indien bij het in het eerste lid bedoelde onderzoek
      blijkt dat van de in NEN 7345 genoemde inerte stoffen en van alle anorganische stoffen, genoemd in bijlage 2 van
      het besluit, geen andere afgifte dan door afspoeling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel7.5.1.1
  - number: 7.5.2.1
    text: |-
      In deze paragraaf wordt verstaan onder:









                  *E*


                  :


                  berekende uitloging over 64 dagen, in mg/m², bepaald volgens NEN 7345, onderdeel 9.5;









                  *E*


                  :


                  berekende uitloging over T dagen, in mg/m², bepaald volgens NEN 7345, onderdeel 9.7, respectievelijk
      volgens NEN 7345, bijlage D, bedoeld om in bijzondere gevallen de uitloging te kunnen bepalen;









                  type-A toepassing:


                  toepassing van een vormgegeven bouwstof niet zijnde een type-B toepassing;









                  type-B toepassing:


                  toepassing van een vormgegeven bouwstof boven het maaiveld, waarbij de bouwstof alleen bevochtigd kan
      worden door neerslag en vochtige lucht, alsmede de toepassing van een vormgegeven bouwstof in de bovenste laag van
      een wegdek, waarbij die bouwstof zichtbaar blijft;









                  *f*


                  :


                  factor voor de bevochtigingsperiode, die bij een type-B toepassing 0,1 bedraagt en in alle andere
      gevallen 1 bedraagt;









                  *f*


                  :


                  factor voor de isolatiemaatregelen, die 1 bedraagt, tenzij categorie 2-bouwstoffen worden toegepast, in
      welk geval deze factor 0,1 bedraagt;









                  *f*


                  factor voor de extrapolatie van de uitloging van de bouwstof bij de kort durende laboratoriumproef naar
      de uitloging over 100 jaar;









                  *f*


                  :


                  rekenkundige factor die de extrapolatiefactor (*f*), de isolatiefactor (*f*) en de bevochtigingsfactor
      (*f*) combineert;









                  U


                  de volgens NEN 7341 voor uitloging beschikbare hoeveelheid van een component in mg/kg d.s.;









                  *ρ*


                  :


                  volumieke massa in kg/m³ volgens NEN 7345;









                  *d*


                  :


                  dikte van het bouwmateriaal;









                  *D* :


                  :


                  effectieve diffusiecoëfficiënt van een anorganische stof, in m²/s, bepaald volgens NEN 7345, onderdeel
      9.4;









                  *f*


                  :


                  factor voor het verschil in temperatuur bij bepaling van de uitloging van een bouwstof in het
      laboratorium en bij het gebruik van die bouwstof, die in alle gevallen 0,7 bedraagt;









                  *I*


                  :


                  berekende immissie in de bodem als gevolg van het gebruik van een vormgegeven bouwstof, in mg/m²;









                  *ε*


                  :


                  de in de diffusieproef volgens NEN 7345 cumulatief uitgeloogde hoeveelheid van een component over 64
      dagen, in mg/m²;




                  *ε*



                  de in de diffusieproef volgens NEN 7345 cumulatief uitgeloogde hoeveelheid van een component over *T*
      dagen, in mg/m².
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel7.5.2.1
  - number: 7.5.2.2
    text: |-
      1 Voor de anorganische stoffen waarvoor in NEN 7345, onderdeel 9.3, wordt verwezen naar onderdeel 9.4 van die NEN,
      is *E* gelijk aan ε, bepaald volgens onderdeel 9.5 van NEN 7345.

      2 Voor de anorganische stoffen waarvoor in NEN 7345, onderdeel 9.3, wordt verwezen naar onderdeel 9.7 van die NEN,
      wordt de *E* gelijk gesteld aan ε, bepaald volgens bijlage D van NEN 7345.

      3 Voor de anorganische stoffen waarvan overeenkomstig NEN 7345, onderdeel 9.3, wordt bepaald dat de uitloging
      afspoelingsbepaald is, wordt de *E* gelijk gesteld aan ε, bepaald volgens bijlage D.2.2 van NEN 7345.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel7.5.2.2
  - number: 7.5.2.3
    text: |-
      1 De dikte van een toegepaste vormgegeven bouwstof wordt bepaald voor elk deel van de constructie waarin het
      materiaal op een eenvormige wijze wordt toegepast.

      2 Van elk deel wordt de gemiddelde dikte bepaald, zoals aangebracht in het werk. De dunste lagen in de constructie
      worden gesteld op 0,10 m.

      3 De hoogte wordt steeds berekend over oppervlakken van niet meer dan 10³ m².

      4 De dikte wordt gemeten loodrecht op het oppervlak van de grootste vlakke of gebogen zijde van het materiaal die
      door regen-, oppervlakte- of grondwater kan worden bevochtigd.

      5 De dikte wordt uitgedrukt in m, afgerond op twee decimalen na de komma, en bedraagt minimaal 0,10 m.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel7.5.2.3
