  - number: 10.3.1
    text: |-
      Bij een voorgenomen gebruik van bijzondere categorie avi-bodemas of een bouwstof met teerhoudend asfaltgranulaat
      als bedoeld in [artikel 14, zesde lid, van het besluit][ref1] worden de in dat artikellid bedoelde gegevens
      overgelegd op de wijze die is aangegeven in [bijlage I][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009345
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel10.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0009345
  - number: 12.2.1
    text: |-
      1 Mededeling van de opstelling van het in [artikel 28, eerste lid, van het besluit][ref1] bedoelde overzicht
      wordt voor de eerste maal gedaan, niet later dan vier weken na het tijdstip waarop een voor een bouwstof afgegeven
      kwaliteitsverklaring is erkend.

      2 Mededeling van de opstelling van een wijziging van het in [artikel 28, eerste lid, van het besluit][ref2]
      bedoelde overzicht of van een bijgesteld overzicht wordt gedaan vóór 1 april en vóór 1 oktober van elk
      kalenderjaar.

      3 Een mededeling als bedoeld in het eerste of tweede lid, wordt gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0007667#Artikel28
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel12.2.1
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0007667
        artikel: '28'
  - number: 12.3.1
    text: |-
      1 Voor een bouwstof met teerhoudend asfaltgranulaat is ten aanzien van de in die bouwstof aanwezige polycyclische
      aromaten, tot 1 januari 2001 het in [artikel 7, eerste lid, van het besluit][ref1] gestelde verbod niet van
      toepassing.

      2 Ten aanzien van polycyclische aromatische koolwaterstoffen in een bouwstof met teerhoudend asfaltgranulaat die
      voor 1 januari 2001 in een werk is aangebracht blijft dit verbod voor wat betreft het houden van die bouwstof in
      dat werk niet van toepassing tot het tijdstip waarop het deel van het werk waarvan die bouwstof deel uitmaakt,
      wordt verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel12.3.1
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: 12.3.2
    text: |-
      1 Voor de bijzondere categorie avi-bodemas is tot 1 januari 2008
      [artikel 7, eerste, tweede en derde lid, van het besluit][ref1] niet van toepassing.

      2 Voor de bijzondere categorie avi-bodemas die voor 1 januari 2008 in een werk is aangebracht blijft dit verbod
      voor wat betreft het houden van die bodemas in dat werk niet van toepassing tot het tijdstip waarop het deel van
      het werk waarvan die bodemas deel uitmaakt, wordt verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel7
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel12.3.2
    references:
      - id: ref1
        bwb_id: BWBR0007667
        artikel: '7'
  - number: '13.1'
    text: De Uitvoeringsregeling Bouwstoffenbesluit van 6 december 1995 (Stcrt. 1995, 247) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel13.1
