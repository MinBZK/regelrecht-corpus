  - number: 7.5.2.6
    text: |-
      In de diffusieproef, die nodig is om *E* te bepalen, wordt de diffusie-coëfficiënt van de proefstukken bepaald
      uitsluitend aan de hand van de oppervlakken van de bouwstof zoals die in de betreffende toepassing van die bouwstof
      worden toegepast.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel7.5.2.6
  - number: 7.5.2.7
    text: |-
      Bouwstoffen die worden gevormd door verharding van een mengsel van diverse grondstoffen en bindmiddelen, worden in
      de diffusieproef niet eerder dan 28 dagen na verharding onderzocht.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel7.5.2.7
  - number: 7.5.3.1
    text: |-
      In deze paragraaf wordt verstaan onder:

      *A*: correctie voor de uitloging van een bouwstof in het laboratorium en de uitloging in de praktijk in mg/kg,
      waarvan de waarde is af te lezen uit de tabel in [artikel 7.5.3.2][ref1];

      κ: constante, die een maat is voor de snelheid van uitloging, waarvan de waarde is af te lezen uit de tabel in
      [artikel 7.5.3.2][ref2];

      *E* : cumulatieve uitloging van een bouwstof door percolatie tot *L/S=10*, bepaald in het laboratorium volgens
      NEN 7340 en berekend volgens NEN 7373, hoofdstuk 9, uitgedrukt in mg/kg. Indien in één of meer eluaatfracties de
      gemeten waarde lager is dan de bepalingsgrens, bepaald volgens NEN 7320, wordt de ondergrens van de cumulatieve
      uitloging berekend volgens NEN 7373;

      E: cumulatieve uitloging van een bouwstof door percolatie zoals beschreven bij E maar waarbij door slechte
      doorlatendheid van het materiaal in een periode van ten hoogste 28 dagen een geringere hoeveelheid percolaat wordt
      verkregen zodat y kleiner is dan 10, maar groter dan 2 of gelijk aan 2;

      *h*: hoogte waarin de bouwstof in het werk wordt aangebracht;

      *f* : factor voor extrapolatie van de uitloging van niet-vormgegeven bouwstoffen en vormgegeven bouwstoffen waarvan
      de uitloging niet-diffussiebepaald is, bij een kort durende laboratoriumproef naar de uitloging over 100 jaar, voor
      toepassingen met isolatiemaatregelen en zonder isolatiemaatregelen;

      *e*: grondtal voor de natuurlijke logaritme, zijnde 2, 718281828;

      *N* : effectieve infiltratie in mm/jaar;

      *t*: tijd in jaren;

      *I* : berekende immissie van een niet-vormgegeven bouwstof in de bodem als gevolg van het gebruik ervan in mg/
      m2.100j.


      [ref1]: https://wetten.overheid.nl/BWBR0009345#Artikel7.5.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0009345#Artikel7.5.3.2
