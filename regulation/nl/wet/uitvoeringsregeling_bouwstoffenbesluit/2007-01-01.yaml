      instantie als bedoeld in [artikel 5 van het besluit][ref3], overeenkomstig [bijlage F, hoofdstuk 2][ref4]. Voor
      zover daarbij geen gebruik kan worden gemaakt van de in [bijlage A][ref5] aangegeven normen of van de VPR’s wordt
      de bepaling van de samenstelling van grond overeenkomstig [bijlage G][ref6] uitgevoerd.


