    text: |-
      1 In deze regeling wordt verstaan onder:



              a
              besluit:

                [ Bouwstoffenbesluit bodem- en oppervlaktewaterenbescherming][ref1];



              b
              GHG:

                gemiddeld hoogste grondwaterstand zoals omschreven in
      [artikel 1, eerste lid, onder n, van het besluit][ref2];



              c
              ontwerp-GHG:

                GHG zoals die voorafgaand aan het op of in de bodem brengen van een categorie 2-bouwstof wordt bepaald;



              d
              grondwatertrap:

                voor landbouwkundige toepassing bepaalde aanduiding van de gemiddelde grondwaterstand, gedefinieerd op
      basis van langjarige gemiddelden van hoogste grondwaterstanden (GHG) en laagste grondwaterstanden in een gebied;



              e
              bijlagen A t/m I:

                de bij deze regeling behorende [bijlagen A t/m I][ref3];



              f
              NEN:

                door het Nederlands Normalisatie Instituut (NNI) uitgegeven norm;



              g
              NEN-EN:

                door het Comité Européen de Normalisation opgestelde en door het NNI als Nederlandse norm aanvaarde en
      uitgegeven norm;



              h
              NVN:

                Nederlandse VoorNorm, uitgegeven door het NNI, vooruitlopend op een NEN-norm;



              i
              VPR:

                Voorlopige Praktijk Richtlijn, zoals beschreven in deel 55B van de reeks Bodembescherming, Ministerie van
      Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer, 1986 en herdruk 1995.




      2 Waar in het besluit of in deze regeling wordt verwezen naar een NEN, ontwerp-NEN, NVN of ontwerp-NVN, wordt van
      die norm de uitgave bedoeld, die is aangegeven in [bijlage A][ref4].


