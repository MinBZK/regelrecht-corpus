      uitgevoerd door een instantie als bedoeld in [artikel 9, eerste en vierde lid, van het besluit][ref3],
      overeenkomstig [bijlage F, hoofdstuk 3][ref4]. Voor zover daarbij geen gebruik kan worden gemaakt van de in
