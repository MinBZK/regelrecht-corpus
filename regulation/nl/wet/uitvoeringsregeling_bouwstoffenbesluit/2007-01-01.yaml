  - number: 3.2.1
    text: |-
      Een bouwstof wordt als niet-duurzaam vormvast aangemerkt indien:

      a. die bouwstof in de betreffende toepassing volgens de in [bijlage D][ref1] opgenomen lijst als niet-duurzaam
      vormvast is aangemerkt, of

      b. die bouwstof weliswaar volgens de in [bijlage D][ref2] opgenomen lijst niet als niet-duurzaam vormvast wordt
      aangemerkt, maar in een diffusieproef, uitgevoerd overeenkomstig [bijlage E][ref3], gedurende 64 dagen meer
      massaverlies vertoont dan:

        - 1500 g/m² voor lichtgebonden steenmengsels voor wegfunderingen, beproefd direct na een verhardingstijd van
      28 dagen, of 500 g/m² voor lichtgebonden steenmengsels, beproefd direct na een verhardingstijd van 91 dagen
      (verharding bij 20 ± 1°C en bij een relatieve vochtigheid van tenminste 90%), dan wel
        - 30 g/m² voor andere materialen.


      [ref1]: https://wetten.overheid.nl/BWBR0009345
      [ref2]: https://wetten.overheid.nl/BWBR0009345
      [ref3]: https://wetten.overheid.nl/BWBR0009345
