  - number: 7.5.3.3
    text: |-
      1 De hoogte van een toegepaste niet-vormgegeven bouwstof wordt bepaald voor elk deel van een werk waarin het
      materiaal op een eenvormige wijze wordt toegepast.

      2 Van elk deel wordt de gemiddelde hoogte bepaald, zoals aangebracht in het werk. De dunste lagen in de constructie
      worden gesteld op 0,20 m.

      3 De hoogte wordt berekend over aaneensluitende hoeveelheden materiaal over een oppervlak van niet meer dan 2.000
      m2.

      4 Indien verschillende lagen van eenzelfde soort materiaal boven elkaar worden aangebracht, al of niet gescheiden
      door lagen van een ander materiaal, is h gelijk aan de som van de aangebrachte hoogtes van eerstbedoeld materiaal.

      5 Indien voor de verschillende lagen als bedoeld in het vierde lid verschillende waarden voor E zijn vastgesteld,
      geldt de hoogste van deze waarden voor de berekening van de immissie.

      6 De hoogte wordt bepaald loodrecht op het aardoppervlak.

      7 De kleinste in de berekening in te voeren hoogte is 0,20 m.

      8 De hoogte wordt uitgedrukt in m, afgerond op twee decimalen na de komma.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel7.5.3.3
