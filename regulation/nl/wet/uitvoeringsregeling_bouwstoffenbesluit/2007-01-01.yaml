                        *I* =


                        *E** *f* * *f*


                        **(7.3)**






      b. Indien er snelle uitputting of geringe uitloogbaarheid wordt verwacht mag ook gebruik worden gemaakt van de
      volgende formule:









                        *I* =


                        *U** *p* * *d*


                        **(7.4)**






