  - number: 7.1.1
    text: |-
      De bepaling van de samenstelling, of de uitloging van een bouwstof, bedoeld in [artikel 9 van het besluit][ref1],
      vindt plaats overeenkomstig [bijlage F, hoofdstuk 1][ref2]. Voorzover daarbij geen gebruik kan worden gemaakt
      van de in [bijlage A][ref3] aangegeven normen of van de VPR's wordt de bepaling van de samenstelling van grond
      overeenkomstig [bijlage G][ref4] uitgevoerd. Indien blijkt dat de vormgegeven bouwstof diffusiebepaald is, geldt
      het bepaalde in [§7.5.2][ref5], in alle andere gevallen geldt het bepaalde in [§7.5.3][ref6].

      De bepaling van de samenstelling of de uitloging mag in afwijking van [bijlage F, hoofdstuk 1][ref7], ook
      plaatsvinden met behulp van een steekproefopzet en daarbij behorende toetsing zoals beschreven in [bijlage 4][ref8]
      van deze regeling.

      De bepaling van de samenstelling, of de uitloging van een bouwstof, bedoeld in [artikel 9 van het besluit][ref9],
      vindt plaats overeenkomstig [bijlage F, hoofdstuk 1][ref10]. Voor zover daarbij geen gebruik kan worden gemaakt
      van de in [bijlage A][ref11] aangegeven normen of van de VPR’s wordt de bepaling van de samenstelling van grond
      overeenkomstig [bijlage G][ref12] uitgevoerd. Indien blijkt dat de vormgegeven bouwstof diffusiebepaald is, geldt
      het bepaalde in [§7.5.2][ref13], in alle andere gevallen geldt het bepaalde in [§7.5.3][ref14]. De bepaling van
      de samenstelling of de uitloging mag in afwijking van [bijlage F, hoofdstuk 1][ref15], ook plaatsvinden met behulp
      van een steekproefopzet en daarbij behorende toetsing zoals beschreven in [bijlage J][ref16] van deze regeling.


