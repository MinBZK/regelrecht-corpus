  - number: 9.1.1.1
    text: |-
      De bepaling van de ontwerp-GHG door een deskundig bedrijf kan achterwege blijven, indien door dat bedrijf is
      vastgesteld dat de categorie 2-bouwstof:

      a. na zetting van de bodem, op of boven het maaiveld zal liggen bij een grondwatertrap VII ter plaatse van het
      werk;

      b. na zetting van de bodem op ten minste 50 cm boven het maaiveld zal liggen, of

      c. zal worden toegepast in een gebied met duurzame voorzieningen ter beheersing van de grondwaterstand en door deze
      voorzieningen na zetting van de bodem op ten minste 50 cm boven de ontwerp-GHG zal liggen.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel9.1.1.1
  - number: 9.1.1.2
    text: |-
      1 Het deskundig bedrijf hanteert voor de bepaling van de ontwerp-GHG de “SC-buis-regressiemethode”, als beschreven
      in rapport 158 van het DLO-Staringcentrum, Wageningen, 1991.

      2 Indien ter plaatse van het gebruiken van de bouwstof geen landbouwbuizen beschikbaar zijn als bedoeld in het in
      het eerste lid genoemde rapport, kan het deskundig bedrijf gegevens gebruiken afkomstig van andere peilbuizen, die
      voor de bepaling van de ontwerp-GHG volgens de in het eerste lid genoemde methode geschikt zijn.

      3 Indien de methode, genoemd in het eerste lid, niet kan worden toegepast, bepaalt
      het deskundig bedrijf de ontwerp-GHG op de wijze als voorgeschreven bij en krachtens
      [artikel 3 van de Uitvoeringsregeling Stortbesluit bodembescherming][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005877#Artikel3
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel9.1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0005877
        artikel: '3'
  - number: 9.1.2.1
    text: |-
      Bij het bepalen van de afstand van de bouwstof tot de ontwerp-GHG neemt het deskundig bedrijf in aanmerking:

      a. bij de betreffende overheden verkrijgbare informatie over voorgenomen kunstmatige wijzigingen van de GHG;

      b. gegevens over de te verwachten invloed van het werk op de GHG, verkregen door eigen onderzoek door het bedrijf
      naar de hydrologische situatie ter plaatse van het gebruiken van de bouwstof, en

      c. gegevens over de te verwachten zetting van de bodem, daaronder begrepen gegevens over de primaire zetting en
      over het tijdstip waarop die zetting bereikt zal zijn.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel9.1.2.1
  - number: 9.2.1
    text: |-
      1 Het deskundig bedrijf bepaalt de GHG en de afstand van de bouwstof tot de GHG voor de eerste maal uiterlijk
      binnen één jaar nadat de bouwstof in het werk is aangebracht en vervolgens telkens na afloop van een periode van
      één jaar.

      2 Bij het verrichten van de bepalingen neemt het deskundig bedrijf in aanmerking:

      a. gegevens van het meetnet van landbouwbuizen of van andere representatieve peilbuizen of gegevens, verkregen door
      eigen metingen, en

      b. bij de betreffende overheden verkrijgbare informatie over gerealiseerde kunstmatige wijzigingen van de GHG.

      3 Het deskundig bedrijf stelt zich bij het verrichten van de bepalingen op de hoogte van voorgenomen kunstmatige
      wijzigingen van de GHG.

      4 Bij de eerste bepalingen die worden uitgevoerd nadat de primaire zetting van de bodem is bereikt, bepaalt het
      deskundig bedrijf de feitelijke zetting.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel9.2.1
  - number: 9.2.2
    text: |-
      Degene die een categorie 2-bouwstof gebruikt, verstrekt op verzoek van het bevoegd gezag de gegevens, verkregen bij
      de laatste, overeenkomstig [artikel 9.2.1][ref1] uitgevoerde bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009345#Artikel9.2.1
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel9.2.2
    references:
      - id: ref1
        bwb_id: BWBR0009345
        artikel: 9.2.1
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: 9.3.1
    text: |-
      1 Als wijzen van gebruik van categorie 2-bouwstoffen als bedoeld in artikel 14, vierde lid, van het besluit, worden
      aangewezen toepassingen van die bouwstoffen:

      a. in uitsluitend een wegfundering of onder verhard terrein;

      b. in uitsluitend een belastingspreidende laag of in een wegfundering in combinatie met toepassing in een
      belastingspreidende laag;

      c. in een wegfundering in combinatie met toepassing in een constructieve ophoging of aanvulling;

      d. in een belastingspreidende laag en een constructieve ophoging of aanvulling, al dan niet in combinatie met
      toepassing in de wegfundering;

      e. in uitsluitend een constructieve ophoging of aanvulling;

      f. in een niet-constructieve ophoging of aanvulling, en

      g. in een spoorwegconstructie,

      zoals nader omschreven in bijlage H (de richtlijn ibc-maatregelen), hoofdstuk 5. De in de eerste volzin bedoelde
      toepassingen worden hierna aangeduid als: de standaard-toepassingen van categorie 2-bouwstoffen.

      2 Voor categorie 2-bouwstoffen die volgens de standaard-toepassingen van categorie 2-bouwstoffen worden gebruikt,
      worden aangewezen de isolatiemaatregelen en daarbij behorende beheers- en controlemaatregelen zoals aangegeven in
      bijlage H, hoofdstukken 6 en 9, onder het opschrift “standaard”.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel9.3.1
  - number: 9.4.1
    text: |-
      Bij een voorgenomen gebruik van een categorie 2-bouwstof als bedoeld in
      [artikel 14, zesde lid, van het besluit][ref1] worden de in dat artikellid bedoelde gegevens overgelegd op de wijze
      die is aangegeven in [bijlage I][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007667#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0009345
