    text: |-
      1 a. Indien de uitloging is berekend volgens [artikel 7.5.2.2, eerste lid][ref1], wordt de immissie van de
      anorganische stoffen in de bodem als gevolg van de emissie van een vormgegeven bouwstof waarvan de uitloging
