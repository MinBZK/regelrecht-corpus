  - number: '2.1'
    text: |-
      De bepaling van de totaalgehalten aan silicium, calcium en aluminium in een materiaal dat is bestemd om in een werk
      te worden gebruikt, ter bepaling of dat materiaal als bouwstof kan worden aangemerkt, vindt als volgt plaats:

      a. de monsterneming vindt zodanig plaats dat het monster representatief is voor het te onderzoeken materiaal, voor
      de monsternemingsstrategie geldt het bepaalde in [bijlage B][ref1].

      b. de ontsluiting van het monster alsmede de analyse van silicium, calcium en aluminium in het monster worden
      uitgevoerd overeenkomstig ASTM D 3682-91 (uitgave van de American Society for Testing and Materials, 1991), met
      dien verstande dat de berekening van de massa's van genoemde stoffen in afwijking van de paragrafen 9.5, 10.5 en
      12.5 van ASTM D 3682-91, plaats vindt overeenkomstig [bijlage B][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009345
      [ref2]: https://wetten.overheid.nl/BWBR0009345
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel2.1
