  - number: 10.1.1
    text: |-
      1 Als de bijzondere categorie avi-bodemas, bedoeld in [artikel 7, vijfde lid, van het besluit][ref1],
      wordt aangewezen avi-bodemas waarvan overeenkomstig [paragraaf 7.5.3][ref2] en [artikel 8.2][ref3] wordt
      vastgesteld dat deze één of meer van de immissiewaarden voor koper, molybdeen en antimoon zoals aangegeven in
      [bijlage 2 van het besluit][ref4] overschrijdt. Avi-bodemas die behoort tot de in de eerste volzin bedoelde
      categorie wordt hierna aangeduid als: bijzondere categorie avi-bodemas, en voor deze stoffen de immissiewaarden
      niet hoger zijn dan 4000 mg/m² in 100 jaar voor koper, 5000 mg/m² in 100 jaar voor molybdeen en 200 mg/m² in 100
      jaar voor antimoon.

      2 Als wijzen van gebruik van bijzondere categorie avi-bodemas als bedoeld in
      [artikel 14, vierde lid, van het besluit][ref5], worden aangewezen toepassingen van die avi-bodemas:

      a. in uitsluitend een constructieve ophoging of aanvulling;

      b. in een niet-constructieve ophoging of aanvulling;

      c. in uitsluitend een constructieve ophoging of aanvulling waarbij de isolerende kunststoffolie is doorgetrokken
      tot de wegverharding, en

      d. in een belastingspreidende laag en een constructieve ophoging of aanvulling, al dan niet in combinatie met
      toepassing in de wegfundering,

      zoals nader omschreven in [bijlage H, hoofdstuk 5][ref6]. De in de eerste volzin bedoelde toepassingen worden
      hierna aangeduid als: de standaard-toepassingen van bijzondere categorie avi-bodemas.

      3 Voor de bijzondere categorie avi-bodemas die volgens één van de standaard-toepassingen van bijzondere
      categorie avi-bodemas wordt gebruikt, worden aangewezen de isolatiemaatregelen en daarbij behorende beheers- en
      controlemaatregelen zoals aangegeven in [bijlage H, hoofdstukken 7 en 9][ref7], onder het opschrift “standaard”.

      4 Bij het gebruik van de bijzondere categorie avi-bodemas zijn de [paragrafen 9.1][ref8] en [9.2][ref9] van
      overeenkomstige toepassing.


