  - number: 3.1.1
    text: |-
      De bepaling van het volume van de kleinste eenheid van een bouwstof vindt plaats op basis van de afmetingen dan wel
      door middel van een zeefproef.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel3.1.1
  - number: 3.1.2
    text: |-
      1 De bepaling op basis van de afmetingen vindt als volgt plaats:

      a. het volume wordt bepaald uit de daarvoor kenmerkende afmetingen van de bouwstof zoals lengte, breedte, hoogte
      en straal;

      b. volumina van holten en gaten in het oppervlak van de eenheid worden in mindering gebracht;

      c. afmetingen worden in hele centimeters bepaald en afgerond naar beneden.

      2 Indien het overeenkomstig het eerste lid berekende volume kleiner is dan 100 cm³, maar groter is dan 50 cm³,
      dient het volume nader te worden bepaald door onderdompeling van het element in water op de wijze zoals aangegeven
      in NEN 5186. Voor de finale berekening van het volume wordt dan als formule gehanteerd:









                    *V* = 1000 *


                    *m*  - *m*





                    *f*


                    **(3.1)**






      waarbij:









                    *V*


                    =


                    volume van het element, in m³




                    *m*


                    =


                    de schijnbare massa onder water bedoeld in NEN 5186 van het element, in g




                    *m*


                    =


                    de massa van het vochtige proefstuk, in g




                    *f*


                    =


                    de dichtheid van water, in kg/m³, bij de beproevingstemperatuur van het waterbad.
    url: https://wetten.overheid.nl/BWBR0009345/2007-01-01#Artikel3.1.2
  - number: 3.1.3
    text: |-
      1 De bepaling door middel van een zeefproef vindt als volgt plaats:

      a. de monsterneming vindt plaats overeenkomstig ontwerp-NEN 7300;

      b. voor de monsternemingsstrategie geldt het bepaalde in bijlage C.

      2 Een bouwstof wordt op grond van de resultaten van een bepaling van de korrelverdeling door middel van
      een zeefproef aangemerkt als bouwstof met een volume per kleinste eenheid van ten minste 50 cm⁳, indien het
      korrelverdelingsdiagram van een monster van die bouwstof, vastgesteld door zeving volgens NEN 5181, voldoet aan
