  - number: 1.4.1.5
    text: |-
      De aanvraag om erkenning wordt ingediend bij Onze Minister. Indien de gegevens bij de aanvraag onjuist of niet
      volledig zijn, stelt Onze Minister binnen twee weken na indiening van de aanvraag de aanvrager in de gelegenheid om
      binnen een door Onze Minister te bepalen termijn alsnog te voorzien in de vereiste gegevens.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.1
  - number: 1.4.1.6
    text: |-
      Onze Minister beslist binnen zes maanden na de aanvraag om erkenning. Indien de beschikking niet binnen zes maanden
      kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen
      de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.1
  - number: 1.4.1.7
    text: |-
      Het bevoegd gezag verstrekt Onze Minister op diens verzoek de nodige inlichtingen omtrent de instelling. Het
      bevoegd gezag doet Onze Minister en, indien het betreft op grond van [artikel 2.1.1][ref1] bekostigde opleidingen,
      de desbetreffende eilandsraad jaarlijks vóór 1 februari een verslag toekomen omtrent de werkzaamheden van de
      instelling voor zover betrekking hebbend op opleidingen. Het verslag bevat tevens het aantal deelnemers per
      opleiding en het aantal uitgereikte certificaten en diploma's, bedoeld in [artikel 7.4.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.4.1.8
    text: Een aanvraag om erkenning geldt mede als aanmelding voor registratie in het Centraal register.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.1
  - number: 1.4.2.1
    text: Onze Minister kan op aanvraag van het bevoegd gezag een opleiding educatie erkennen.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.2
  - number: 1.4.2.2
    text: |-
      Erkenning houdt in dat de met goed gevolg afgelegde examens of onderdelen van examens van die opleiding een diploma
      of certificaat als bedoeld in [artikel 7.4.8][ref1] is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.4.2.3
    text: |-
      Voorwaarde voor erkenning is dat de instelling voor die opleiding in acht neemt hetgeen bij of krachtens deze wet
      is bepaald ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.2
  - number: 1.4.2.3.a
    text: |-
      de kwaliteitszorg, bedoeld in [artikel 1.3.2][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.4.2.3.b
    text: |-
      het onderwijs en de examens, bedoeld in [hoofdstuk 7][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        hoofdstuk: '7'
  - number: 1.4.2.3.c
    text: |-
      de rechtsbescherming van de deelnemers, bedoeld in [hoofdstuk 7, titel 5][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        hoofdstuk: '7'
  - number: 1.4.2.3.d
    text: |-
      de onderwijsovereenkomst, bedoeld in [artikel 8.1.5, eerste tot en met derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 1.4.2.3.e
    text: het toezicht door de inspectie.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.2
  - number: 1.4.2.4
    text: |-
      De aanvraag om erkenning gaat in elk geval vergezeld van een beschrijving van het stelsel van kwaliteitszorg,
      bedoeld in [artikel 1.3.2, tweede lid][ref1] alsmede het ontwerp van de in [artikel 7.4.9][ref2] bedoelde
      onderwijs- en examenregeling van de opleiding.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.4.2.5
    text: Onze Minister beslist binnen 3 maanden na de aanvraag.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.2
  - number: 1.4.2.6
    text: Het bevoegd gezag verstrekt Onze Minister op diens verzoek de nodige inlichtingen omtrent de instelling.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.2
  - number: 1.5.1.1
    text: |-
      Onze Minister stelt voor een openbaar lichaam of voor een combinatie van openbare lichamen een Raad onderwijs
      arbeidsmarkt in.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.5.1
  - number: 1.5.1.2
    text: De raad is een rechtspersoon met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.5.1
  - number: 1.5.1.3
    text: |-
      De raad heeft een bestuur bestaande uit vertegenwoordigers van werkgeversorganisaties, uit vertegenwoordigers van
      werknemersorganisaties en uit vertegenwoordigers van de instellingen.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.5.1
  - number: 1.5.1.4
    text: Onze Minister kan de raad subsidiëren voor de uitoefening van zijn taken.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.5.1
  - number: 1.5.1.5
    text: |-
      Voor zover het vierde lid van toepassing is, zijn [titel 4.1][ref1] en [4.2 van de Algemene wet bestuursrecht][ref2]
      en de [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.5.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
  - number: 1.5.2.1
    text: |-
      De raad adviseert Onze Minister over de doelmatigheid van de beroepsopleidingen die de instellingen voornemens zijn
      te verzorgen of reeds verzorgen, gelet op de arbeidsmarktrelevantie van die opleidingen.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.5.2
  - number: 1.5.2.2
    text: |-
      De raad draagt bij aan een doelmatige en doelgerichte inzet van overheidsmiddelen door het doen van voorstellen,
      welke beroepsopleidingen voor bekostiging uit ’s Rijks kas in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.5.2
  - number: 1.5.2.3
    text: |-
      De raad doet in voorkomende gevallen voorstellen aan Onze Minister inzake het ontwikkelen van beroepsopleidingen
      dan wel delen van beroepsopleidingen die relevant zijn voor de regionale arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.5.2
  - number: 1.5.2.4
    text: |-
      De raad draagt bij aan de bevordering van de kwaliteit van de plaatsen waar de beroepspraktijkvorming wordt
      verzorgd.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.5.2
  - number: 1.5.2.5
    text: |-
      De raad draagt er zoveel mogelijk zorg voor dat er een toereikend aantal bedrijven en organisaties van voldoende
      kwaliteit beschikbaar zijn die de beroepspraktijkvorming voor de opleidingen verzorgen. De raad is voorts belast
      met een regelmatige beoordeling van die bedrijven en organisaties.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.5.2
  - number: 1.6.1.1
    text: |-
      Onze Minister besluit op aanvraag van het bevoegd gezag van een exameninstelling, dat de exameninstelling het recht
      heeft tot examinering van een beroepsopleiding in opdracht van een instelling, indien die exameninstelling in acht
      neemt hetgeen bij of krachtens deze wet is bepaald over:
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.6.1
  - number: 1.6.1.1.a
    text: |-
      de kwaliteitszorg, bedoeld in [artikel 1.3.2][ref1] voor zover het betreft de examinering,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.6.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.6.1.1.b
    text: de examens, en
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.6.1
  - number: 1.6.1.1.c
    text: |-
      de rechtsbescherming van de deelnemers, bedoeld in [hoofdstuk 7, titel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.6.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        hoofdstuk: '7'
  - number: 1.6.1.2
    text: |-
      Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien de
      beschikking niet binnen drie maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.6.1
  - number: 2.1.1.1
    text: |-
      Onze Minister kan, de eilandsraad gehoord, op aanvraag van het bevoegd gezag besluiten dat een beroepsopleiding
      ten aanzien waarvan het bevoegd gezag een erkenning heeft verkregen op grond van [artikel 1.4.1][ref1], voor
      bekostiging in aanmerking komt. Bij inwilliging van de aanvraag ontstaat de aanspraak op bekostiging met ingang van
      het studiejaar daaropvolgend.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.1.1.2
    text: 'Bekostiging van een opleiding vindt slechts plaats indien:'
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.1.1
  - number: 2.1.1.2.a
    text: |-
      de opleiding wordt aangeboden door een instelling in stand gehouden door een rechtspersoon met volledige
      rechtsbevoegdheid die niet het maken van winst tot oogmerk heeft,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.1.1
  - number: 2.1.1.2.b
    text: de door de begrotingswetgever beschikbaar gestelde middelen dat toelaten,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.1.1
  - number: 2.1.1.2.c
    text: er maatschappelijke behoefte aan de opleiding bestaat,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.1.1
  - number: 2.1.1.2.d
    text: er arbeidsmarktperspectieven zijn voor afgestudeerden,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.1.1
  - number: 2.1.1.2.e
    text: de inhoud van de opleiding bijdraagt aan een duurzame en brede beroepskwalificatie, alsmede
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.1.1
  - number: 2.1.1.2.f
    text: |-
      de opleiding bijdraagt aan het tot stand komen van een samenhangend aanbod met het voorbereidend middelbaar
      beroepsonderwijs dat wordt bekostigd op grond van de [Wet voortgezet onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0030284
  - number: 2.1.2.1
    text: |-
      De aanspraak op bekostiging voor een beroepsopleiding eindigt van rechtswege met ingang van het tijdstip waarop de
      erkenning ten aanzien van die opleiding is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.1.2
  - number: 2.1.2.2
    text: |-
      Onze Minister kan, de eilandsraad gehoord, besluiten dat een beroepsopleiding, verzorgd door een instelling, niet
      meer voor bekostiging in aanmerking komt, indien mede gezien de arbeidsmarktomstandigheden niet langer sprake is
      van voldoende behoefte aan die opleiding.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.1.2
  - number: 2.1.2.3
    text: |-
      Bij een besluit als bedoeld in het eerste lid bepaalt Onze Minister het tijdstip waarop de aanspraak op bekostiging
      voor een bepaalde beroepsopleiding ontnomen wordt zodanig dat de ingeschreven deelnemers de opleiding waarvoor zij
      zijn ingeschreven, aan dezelfde of aan een andere instelling binnen een redelijke tijd kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.1.2
  - number: 2.2.1.1
    text: |-
      De rijksbijdrage voor de beroepsopleidingen waarop de in [artikel 2.1.1][ref1] bedoelde aanspraak betrekking heeft
      wordt, binnen het raam van de door de begrotingswetgever beschikbaar gestelde middelen, per instelling berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.1.2
    text: 'De in het eerste lid bedoelde rijksbijdrage heeft in ieder geval betrekking op kosten van:'
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.1.2.a
    text: |-
      personeel wegens voorschriften die zijn gegeven bij of krachtens de [Wet materieel ambtenarenrecht BES][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: 2.2.1.2.b
    text: onderhoud en vervanging van inventaris,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.1.2.c
    text: onderhoud van gebouwen en terreinen,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.1.2.d
    text: energie,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.1.2.e
    text: administratie, beheer en bestuur,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.1.2.f
    text: schoonmaken,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.1.2.g
    text: heffingen
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.1.2.h
    text: inkoop van diensten,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.1.2.i
    text: loopbaanoriëntatie en -begeleiding,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.1.2.j
    text: gehandicapte deelnemers, alsmede
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.1.2.k
    text: zorg voor deelnemers met specifieke onderwijsbehoefte te verlenen door de instelling.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.1.3
    text: Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.1
  - number: 2.2.2.1
    text: |-
      De in [artikel 2.2.1][ref1] bedoelde berekeningswijze bevat voor elke instelling en elke opleiding een gelijkelijk
      geldende maatstaf.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.2.2
    text: De maatstaf voorziet in bekostiging aan de hand van de instroom van deelnemers.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.2
  - number: 2.2.2.3
    text: |-
      Voor voorbereidende en ondersteunende activiteiten als bedoeld in [artikel 7.2.2, vierde lid][ref1], voor zover
      betrekking hebbend op beroepsopleidingen als bedoeld in artikel 7.2.2, eerste lid, onder a en b, wordt een
      afzonderlijk bedrag berekend, aan de hand van de instroom van deelnemers.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.2.2.4
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, geldt inschrijving van een deelnemer voor twee of
      meer voltijdse dan wel twee of meer deeltijdse beroepsopleidingen in enig studiejaar als inschrijving voor één
      voltijdse respectievelijk één deeltijdse beroepsopleiding. Inschrijving van een deelnemer voor zowel voltijdse als
      deeltijdse beroepsopleidingen in enig studiejaar geldt voor de toepassing van die maatstaf als inschrijving voor
      een voltijdse opleiding.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.2
  - number: 2.2.2.5
    text: |-
      Bij de toepassing van de maatstaf, bedoeld in het tweede lid, blijven buiten beschouwing deelnemers aan een
      deeltijdse opleiding waarvoor het bevoegd gezag een in instellingstijd verzorgd onderwijsprogramma, met inbegrip
      van de beroepspraktijkvorming, heeft ingericht dat minder dan 300 uren per volledig studiejaar omvat.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.2
  - number: 2.2.2.6
    text: |-
      In de maatstaf, bedoeld in het tweede lid, kan onderscheid worden gemaakt naar groepen van deelnemers en naar
      opleidingen. De maatstaf, bedoeld in tweede lid, kan verschillend worden vastgesteld voor opleidingen die worden
      verzorgd door een instelling die deel uitmaakt van een scholengemeenschap als bedoeld in [artikel 123 van de Wet
      voortgezet onderwijs BES](onbekend).
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.2
  - number: 2.2.3.1
    text: |-
      Onze Minister kan aan de rijksbijdrage, berekend op grond van [artikel 2.2.2][ref1], een bedrag toevoegen in
      verband met een onevenredig grote toename van het aantal deelnemers ten opzichte van het voorafgaande jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.3.2
    text: |-
      Onze Minister kan, al dan niet onder door hem op te leggen verplichtingen, ten behoeve van de ontwikkeling van het
      bestel van het beroepsonderwijs op de onderscheiden openbare lichamen een bedrag toevoegen aan de rijksbijdrage,
      berekend op grond van [artikel 2.2.2][ref1]. In dat geval worden bij ministeriële regeling daaromtrent
      voorschriften gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.3.3
    text: |-
      Onze Minister kan een bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent
      de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.3
  - number: 2.2.5.1
    text: |-
      Onze Minister maakt aan elke instelling jaarlijks in september bekend welke rijksbijdrage voor het daarop volgende
      jaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage is berekend.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.5
  - number: 2.2.5.2
    text: De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.5
  - number: 2.2.5.3
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      betaald. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.5
  - number: 2.2.5.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van deze paragraaf. Deze voorschriften hebben in elk geval betrekking op aard, inrichting en wijze van
      verstrekking van gegevens met betrekking tot de deelnemers.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.5
  - number: 2.2.5.5
    text: |-
      De in het vierde lid bedoelde gegevens die op enigerlei wijze een rol spelen in de berekeningswijze, bedoeld
      in [artikel 2.2.2][ref1], gaan vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door
      het bevoegd gezag aangewezen deskundige. Deze gegevens en de verklaring worden ingediend voor een bij algemene
      maatregel van bestuur te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.6
    text: |-
      De eilandsraad of het bestuurscollege draagt overeenkomstig de [artikelen 129 tot en met 147 van de Wet voortgezet
      onderwijs BES](onbekend) zorg voor de voorzieningen in de huisvesting van instellingen op het grondgebied van het
      openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.2.6
  - number: 2.3.8
    text: |-
      Onze Minister kan naast het deskundigenonderzoek, bedoeld in [artikel 2.3.1, vierde lid][ref1], een onderzoek
      instellen of doen instellen naar de jaarrekening en naar de gegevens, bedoeld in [artikel 2.3.3][ref2], naar
      de rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer van de instelling. Het bevoegd
      gezag verstrekt aan degene die door Onze Minister met het onderzoek is belast alle inlichtingen die deze voor de
      uitvoering van zijn taak nodig oordeelt en geeft desgevraagd inzage in informatie, boeken en bescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.3.8
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.9
    text: |-
      De deskundige die door Onze Minister is belast met het onderzoek van de ministeriële jaarrekening, heeft met het
      oog op het verrichten van dat onderzoek toegang tot elke instelling. Aan de deskundige wordt desgevraagd inzage
      in de informatie en in de boeken en bescheiden gegeven en worden alle inlichtingen verstrekt die deze voor de
      uitvoering van zijn taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.3.9
  - number: 2.3.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de controle van de
      boekhouding, de jaarrekening en de administratie van de instellingen.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.3.10
  - number: 2.3.11.1
    text: |-
      Indien de vaststelling van de rijksbegroting daartoe noopt, kan Onze Minister tot acht weken na die vaststelling
      correcties aanbrengen op de rijksbijdrage. Onze Minister maakt het bevoegd gezag binnen acht weken na de
      vaststelling van de rijksbegroting een correctie als bedoeld in de eerste volzin bekend. Onze Minister verrekent de
      correctie met de rijksbijdrage voor het desbetreffende jaar of betaalt uit in dat jaar.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.3.11
  - number: 2.3.11.2
    text: |-
      Indien uit de jaarrekening, uit de verklaring van de deskundige, bedoeld in [artikel 2.3.1, vierde lid][ref1], uit
      de resultaten van het onderzoek, bedoeld in [artikel 2.3.8][ref2], of uit de resultaten van het onderzoek, bedoeld
      in [artikel 2.3.9][ref3] blijkt dat de rijksbijdrage op onjuiste gronden is vastgesteld dan wel de besteding
      daarvan niet rechtmatig of niet doelmatig was, kan Onze Minister binnen een jaar na ontvangst van de jaarrekening
      correcties aanbrengen op de rijksbijdrage. Onze Minister maakt het bevoegd gezag binnen een jaar na ontvangst van
      de jaarrekening een correctie als bedoeld in de eerste volzin bekend. Onze Minister verrekent de correctie met de
      rijksbijdrage voor het eerstvolgende jaar of betaalt uit in dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.3.11
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.11.3
    text: |-
      Onverminderd het eerste en tweede lid is Onze Minister bevoegd tot verrekening van vorderingen krachtens deze wet
      van of op het bevoegd gezag met vorderingen krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.3.11
  - number: 2.4.1
    text: |-
      Onze Minister kan aan andere rechtspersonen dan die waarvan de instellingen uitgaan, een bijdrage toekennen
      ter bevordering van de verwezenlijking van de in [artikel 1.2.1][ref1] bedoelde doelstellingen van de educatie
      en het beroepsonderwijs dan wel ten behoeve van de afstemming tussen onderwijs en arbeidsmarkt. In dat geval
      worden bij ministeriële regeling daaromtrent regels gegeven. Voor zover toepassing van de eerste volzin het
      verstrekken van subsidie betreft, zijn [titel 4.1][ref2] en [4.2 van de Algemene wet bestuursrecht][ref3] en de
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref4] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0005537
      - id: ref4
        bwb_id: BWBR0009458
        artikel: '4'
  - number: 2.5.1.1
    text: |-
      Bij de opheffing van een openbare instelling en bij de beëindiging van de bekostiging van een bijzondere instelling
      draagt het bevoegd gezag zo spoedig mogelijk na de opheffing dan wel na de beëindiging van de bekostiging, zorg
      voor de vaststelling van een eindafrekening. De eindafrekening wordt aan Onze Minister gezonden en gaat vergezeld
      van een verklaring omtrent de getrouwheid van een door het bevoegd gezag aangewezen deskundige.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.5.1
  - number: 2.5.1.2
    text: |-
      Tenzij met Onze Minister een andere regeling wordt getroffen, is het bevoegd gezag aan het Rijk een bedrag
      verschuldigd, indien de eindafrekening een batig saldo bevat. Het bedrag wordt door Onze Minister vastgesteld en
      mag niet hoger zijn dan het saldo van de eindafrekening. Bij de vaststelling van het bedrag wordt rekening gehouden
      met door het bevoegd gezag uit de eigen middelen aan investeringen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.5.1
  - number: 2.5.1.3
    text: |-
      Indien de in het eerste lid bedoelde opheffing dan wel beëindiging van de bekostiging zich voordoet, maakt
      het bevoegd gezag zo spoedig mogelijk aan Onze Minister bekend welke maatregelen het heeft genomen teneinde
      te waarborgen dat de aan die instelling ingeschreven deelnemers het onderwijs aan een andere instelling kunnen
      voltooien.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.5.1
  - number: 2.5.2
    text: |-
      Het bevoegd gezag beheert de middelen van de instelling op zodanige wijze dat een behoorlijke exploitatie en het
      voortbestaan van de instelling zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel2.5.2
  - number: 4.1.1.1
    text: De onderwijsgevenden aan een instelling dragen de titel van docent.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.1
  - number: 4.1.1.2
    text: Aan een instelling zijn één of meer directeuren verbonden.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.1
  - number: 4.1.1.3
    text: |-
      Het bevoegd gezag benoemt één of meer van de docenten om een directeur bij te staan en bij afwezigheid te
      vervangen. Deze dragen de titel van adjunct-directeur.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.1
  - number: 4.1.1.4
    text: Het bevoegd gezag kan overig personeel aanwijzen, dat tot taak heeft, het onderwijs te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.1
  - number: 4.1.2
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de directeuren, de adjunct- directeuren, de docenten en het overige
      personeel.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.2
  - number: 4.1.3
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van het personeel van de
      instelling. Zoveel mogelijk tegelijk met die vaststelling bepaalt het bevoegd gezag functies en taken van het
      personeel van de instelling, met inachtneming van de daaromtrent bij eilandsbesluit, houdende algemene maatregelen,
      te geven nadere voorschriften.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.3
  - number: 4.1.4.1
    text: |-
      De [Wet materieel ambtenarenrecht BES][ref1] en de daarop berustende regelingen zijn voor het personeel van een
      instelling voor bijzonder onderwijs van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: 4.1.4.2
    text: Voor de salarissen en toelagen van het personeel wordt een regeling vastgesteld bij eilandsbesluit.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.4
  - number: 4.1.4.3
    text: |-
      Het bestuurscollege stelt de regeling, bedoeld in het tweede lid, dan wel een wijziging daarvan niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met de bevoegde gezagsorganen en met de onderwijsvakbonden
      of, bij het ontbreken daarvan, met een representatief te achten vertegenwoordiging van het personeel.
      [Artikel 101 van de Wet materieel ambtenarenrecht BES][ref1] is niet van toepassing op de vaststelling dan wel
      wijziging van de regeling, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel101
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '101'
  - number: 4.1.5
    text: |-
      [Artikel 6, eerste lid, onderdeel b, van de Wet materieel ambtenarenrecht BES][ref1] is niet van toepassing op
      het personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '6'
  - number: 4.1.7.1
    text: |-
      In afwijking van [artikel 11 van de Wet materieel ambtenarenrecht BES][ref1] is ieder personeelslid van een
      bijzondere instelling in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel11
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.7
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '11'
  - number: 4.1.7.2
    text: |-
      De akte van benoeming bevat ten minste bepalingen van gelijke inhoud als de bepalingen die zijn vastgesteld in
      [artikel 11 van de Wet materieel ambtenarenrecht BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel11
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.7
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '11'
  - number: 4.1.8
    text: |-
      De Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba is, in afwijking van
      [artikel 4.1.2, eerste lid][ref1], bevoegd de disciplinaire straf of de schorsing op te leggen dan wel het ontslag
      te verlenen, indien het een directeur, een adjunct-directeur, of een ander lid van het onderwijzend personeel van
      een openbare instelling betreft en deze tevens lid is van de eilandsraad van het openbaar lichaam die de school in
      stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel4
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel4.1.8
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '4'
        hoofdstuk: '4'
  - number: 6.1.1.1
    text: |-
      Het Centraal register is een systematisch geordende verzameling gegevens met betrekking tot de erkende
      beroepsopleidingen. Onze Minister is belast met de aanleg, het beheer en de bekendmaking van het register en met
      het verstrekken van informatie uit het register. De bekendmaking en het verstrekken van informatie kunnen digitaal
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.1.1
  - number: 6.1.1.2
    text: 'Het Centraal register bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.1.1
  - number: 6.1.1.2.a
    text: de naam en de code van de beroepsopleidingen,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.1.1
  - number: 6.1.1.2.b
    text: |-
      de naam van de instelling die de beroepsopleiding verzorgt, alsmede in welke leerweg of leerwegen de opleiding
      wordt verzorgd,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.1.1
  - number: 6.1.1.2.c
    text: of het een bekostigde beroepsopleiding betreft,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.1.1
  - number: 6.1.1.2.d
    text: de studieduur,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.1.1
  - number: 6.1.1.2.e
    text: |-
      de naam van de beroepsopleiding ten aanzien waarvan bij een instelling het recht op examinering is ontnomen en de
      ingangsdatum daarvan,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.1.1
  - number: 6.1.1.2.f
    text: |-
      de namen van de exameninstellingen, die het recht hebben op examinering van de betreffende beroepsopleiding,
      voorzover het recht op examinering niet is ontnomen.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.1.1
  - number: 6.2.1.1
    text: |-
      De erkenning van een beroepsopleiding vervalt indien een instelling blijk geeft de erkende beroepsopleiding niet
      meer te verzorgen of indien een instelling gedurende vier jaar een erkende opleiding niet heeft verzorgd.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.1
  - number: 6.2.1.2
    text: |-
      Onze Minister kan, ten aanzien van een beroepsopleiding die de instelling verzorgt, de in [artikel 1.4.1][ref1]
      bedoelde erkenning intrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.1.2.a
    text: gebleken is dat de kwaliteit van die opleiding onvoldoende is, of
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.1
  - number: 6.2.1.2.b
    text: |-
      niet of niet meer wordt voldaan aan de voorwaarden, bedoeld in [artikel 1.4.1, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.1.3
    text: 'Een beschikking op grond van het tweede lid houdt in dat ten aanzien van het desbetreffende onderwijs:'
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.1
  - number: 6.2.1.3.a
    text: |-
      de aanspraak op bekostiging, bedoeld in [artikel 2.1.1][ref1], voor zover van toepassing, vervalt,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 6.2.1.3.b
    text: |-
      aan de examens of onderdelen daarvan geen diploma of certificaat als bedoeld in [artikel 7.4.8][ref1] meer is
      verbonden, en


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.1.3.c
    text: de registratie in het Centraal register wordt beëindigd.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.1
  - number: 6.2.1.4
    text: Onze Minister maakt de ontneming van rechten, bedoeld in dit artikel, openbaar.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.1
  - number: 6.2.2.1
    text: |-
      De erkenning van een opleiding educatie vervalt indien een instelling blijk geeft de erkende opleiding educatie
      niet meer te verzorgen of indien een instelling gedurende vier jaar een erkende opleiding niet heeft verzorgd.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.2
  - number: 6.2.2.2
    text: |-
      Onze Minister kan, ten aanzien van een opleiding educatie die de instelling verzorgt, de in [artikel 1.4.2][ref1]
      bedoelde erkenning intrekken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.2.2.a
    text: gebleken is dat de kwaliteit van die opleiding onvoldoende is, of
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.2
  - number: 6.2.2.2.b
    text: |-
      niet of niet meer wordt voldaan aan de voorwaarden, bedoeld in [artikel 1.4.2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.2.3
    text: |-
      Een beschikking op grond van het tweede lid houdt in dat ten aanzien van het desbetreffende onderwijs aan de
      examens of onderdelen daarvan geen diploma of certificaat als bedoeld in [artikel 7.4.8][ref1] meer is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.2.4
    text: Onze Minister maakt de ontneming van rechten, bedoeld in dit artikel, openbaar.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.2
  - number: 6.2.3.1
    text: |-
      Voordat Onze Minister een beschikking treft op grond van [artikel 6.2.1, tweede lid, onderdeel a][ref1],
      respectievelijk [6.2.2, tweede lid, onderdeel a][ref2], geeft hij aan het bevoegd gezag een waarschuwing op grond
      van zijn bevindingen ten aanzien van de kwaliteit van de opleiding. Onze Minister geeft eerst toepassing aan
      artikel 6.2.1, tweede lid, onderdeel a, respectievelijk 6.2.2, tweede lid, onderdeel a, nadat:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.3.1.a
    text: de waarschuwing ten minste een jaar verstreken is, en
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.3
  - number: 6.2.3.1.b
    text: |-
      Onze Minister aan de hand van een nader onderzoek tot het oordeel is gekomen dat niet of niet in voldoende mate
      gevolg is gegeven aan de waarschuwing.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.3
  - number: 6.2.3.2
    text: |-
      Voordat Onze Minister een beschikking neemt op grond van [artikel 6.2.1, tweede, onderdeel b][ref1],
      respectievelijk [6.2.2, tweede lid, onderdeel b][ref2], geeft hij aan het bevoegd gezag een waarschuwing, onder
      bepaling van een termijn waarbinnen aan die waarschuwing gevolg moet zijn gegeven en desgewenst overleg met hem
      dienaangaande plaats kan vinden. De termijn waarbinnen aan de waarschuwing gevolg moet zijn gegeven, bedraagt ten
      minste drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.3.3
    text: Onze Minister maakt de waarschuwingen, bedoeld in dit artikel, openbaar.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.3
  - number: 6.2.4.1
    text: |-
      Onze Minister kan aan een instelling het recht op examinering van een beroepsopleiding ontnemen, indien de
      kwaliteit van de examens van die opleiding niet voldoet aan de standaarden, bedoeld in [artikel 7.4.5][ref1]. Bij
      de ontneming van het recht wordt bepaald met ingang van welk tijdstip dit geschiedt. De ontneming wordt in het
      Centraal register bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 6.2.4.2
    text: |-
      Voordat Onze Minister een besluit als bedoeld in het eerste lid neemt, geeft hij het bevoegd gezag een waarschuwing
      op grond van zijn bevindingen over de kwaliteit van de examinering onder bepaling van de termijn waarbinnen aan die
      waarschuwing gevolg moet zijn gegeven. Onze Minister maakt de waarschuwing openbaar.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.4
  - number: 6.2.4.3
    text: |-
      Het bevoegd gezag kan niet eerder dan na verloop van drie studiejaren na de ontneming, bedoeld in het eerste lid,
      het recht opnieuw verkrijgen. [Artikel 1.6.1][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.5.1
    text: |-
      In de gevallen, bedoeld in [artikel 6.2.1, tweede lid, onder a en b][ref1],
      [artikel 6.2.2, tweede lid, onderdeel a en b][ref2], en [artikel 6.2.4, eerste lid][ref3] kan Onze Minister op
      verzoek van het bevoegd gezag of uit eigen beweging in overeenstemming met het bevoegd gezag maatregelen treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.2.5.2
    text: |-
      Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het bestuur van de instelling te laten
      bijstaan door een extern deskundige, niet zijnde de deskundige als bedoeld in [artikel 1.1.1][ref1]. Ook kunnen
      onder voorwaarden extra financiële middelen aan de instelling ter beschikking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 6.2.5.3
    text: |-
      Onze Minister stelt nadere regels omtrent de toekenning van en verantwoording voor maatregelen, voor zover deze het
      verstrekken van financiële middelen betreffen.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.2.5
  - number: 6.3.1
    text: |-
      [Artikel 6.2.4][ref1] en [6.2.5][ref2] zijn van overeenkomstige toepassing op exameninstellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '6'
        hoofdstuk: '6'
  - number: 8.1.8.1
    text: |-
      Het bevoegd gezag doet onverwijld opgave aan het bestuurscollege van het openbaar lichaam waar de betrokkene woon-
      of verblijfplaats heeft van de gegevens van degene:
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.1.8
  - number: 8.1.8.1.a
    text: |-
      op wie de [Leerplichtwet BES][ref1] niet meer van toepassing is en die de leeftijd van 23 jaren nog niet heeft
      bereikt,


      [ref1]: https://wetten.overheid.nl/BWBR0030281
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0030281
  - number: 8.1.8.1.b
    text: |-
      die niet in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e][ref1], dan wel een diploma voorbereidend wetenschappelijk
      onderwijs of hoger algemeen voortgezet onderwijs als bedoeld in [artikel 13][ref2] onderscheidenlijk
      [14 van de Wet voortgezet onderwijs BES][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel14
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '14'
  - number: 8.1.8.1.c
    text: 'die:'
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.1.8
  - number: 8.1.8.1.c.1
    text: |-
      het onderwijs aan de instelling gedurende een aaneengesloten periode van ten minste een maand of een door het
      bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.1.8
  - number: 8.1.8.1.c.2
    text: bij de instelling wordt in- of uitgeschreven of van de instelling wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.1.8
  - number: 8.1.8.2
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven omtrent de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.1.8
  - number: 8.1.8.3
    text: |-
      Bij de verwerking van gegevens, bedoeld in dit artikel, wordt het persoonsgebonden nummer BES van de betrokkene
      gebruikt.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.1.8
  - number: 8.1.8.4
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van de verstrekking van
      gegevens op grond van het eerste lid en wordt een nadere specificatie gegeven van de gegevens die op grond van het
      eerste lid worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.1.8
  - number: 8.1.8.5
    text: |-
      De gegevens die worden verstrekt op grond van het eerste lid kunnen persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens BES][ref1] omvatten, met uitzondering van gegevens over ras,
      politieke gezindheid, seksueel leven of het lidmaatschap van een vakvereniging, voor zover deze persoonsgegevens
      noodzakelijk zijn met het oog op de informatieverstrekking over de achtergronden van het verzuim.


      [ref1]: https://wetten.overheid.nl/BWBR0028067#Artikel16
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0028067
        artikel: '16'
  - number: 8.3.1.1
    text: |-
      Onder een voortijdige schoolverlater in de zin van deze titel wordt verstaan degene op wie
      [artikel 8.1.8, eerste lid onder a en b][ref1], van toepassing is en


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.1.1.a
    text: |-
      die het onderwijs aan de instelling waaraan hij is ingeschreven gedurende een aaneengesloten periode van ten minste
      een maand of een door het bevoegd gezag te bepalen kortere periode zonder geldige reden niet meer volgt, of
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.1
  - number: 8.3.1.1.b
    text: |-
      die niet meer aan een instelling is ingeschreven en evenmin is ingeschreven aan een school als bedoeld in de
      [Wet voortgezet onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0030284
  - number: 8.3.1.2
    text: |-
      Voor zover nodig in afwijking van het eerste lid wordt onder een voortijdig schoolverlater
      niet verstaan degene die in het bezit is van een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid onderdeel a][ref1], dan wel een getuigschrift van het praktijkonderwijs als bedoeld
      in [artikel 31 van de Wet voortgezet onderwijs BES][ref2] en werkzaam is op grond van een aanstelling of
      arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel31
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '31'
  - number: 8.3.2.1
    text: |-
      Het bevoegd gezag meldt onverwijld voortijdige schoolverlaters aan het bestuurscollege, voor zover het bevoegd
      gezag dat niet op grond van artikel 9.1.7 heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.2
  - number: 8.3.2.2
    text: |-
      Het bestuurscollege draagt ten behoeve van doorverwijzing naar onderwijs of arbeidsmarkt zorg voor registratie
      van de gegevens die het bevoegd gezag ingevolge het eerste lid of artikel 9.1.7 heeft gemeld, of waarover het
      bestuurscollege op grond van [artikel 24f, derde en vierde lid, van de Wet op het onderwijstoezicht][ref1]
      beschikt. Het systeem heeft mede betrekking op de gegevens waarover het openbaar lichaam beschikt in het kader van
      de uitvoering van de [Leerplichtwet BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013800#Artikel24f
      [ref2]: https://wetten.overheid.nl/BWBR0030281
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0013800
        artikel: 24f
      - id: ref2
        bwb_id: BWBR0030281
  - number: 8.3.2.3
    text: |-
      Het bestuurscollege maakt afspraken met instellingen, scholen als bedoeld in de
      [Wet voortgezet onderwijs BES][ref1] en organisaties die zijn betrokken bij het voorkomen en bestrijden van
      voortijdig schoolverlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0030284
  - number: 8.3.2.4
    text: |-
      Ter tegemoetkoming in de kosten van uitvoering van het tweede en derde lid kent Onze Minister binnen
      het raam van de door de begrotingswetgever beschikbaar gestelde middelen jaarlijks uiterlijk in
      september ten behoeve van de activiteiten het bestuurscollege een bijzondere uitkering als bedoeld in
      [artikel 91 van de Wet financiën openbare lichamen Bonaire, Sint Eustatius en Saba][ref1] toe. Deze uitkering
      heeft betrekking op het daarop volgende kalenderjaar. Bij ministeriële regeling worden regels gegeven voor de
      berekening en betaling van de uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0028151#Artikel91
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0028151
        artikel: '91'
  - number: 8.3.2.5
    text: |-
      Het bevoegd gezag geeft aan de door het bestuurscollege aangewezen personen alle gevraagde bescheiden ter inzage
      en verstrekt de gevraagde inlichtingen die van belang zijn voor het voorkomen en bestrijden van voortijdig
      schoolverlaten.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.2
  - number: 8.3.2.6
    text: |-
      De eilandsraad stelt streefcijfers vast voor de te behalen resultaten. Het bestuurscollege stelt jaarlijks
      een effectrapportage vast waarin zowel de streefcijfers als de bereikte resultaten zijn aangegeven en waarin
      afwijkingen worden toegelicht.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.2
  - number: 8.3.2.7
    text: |-
      Indien het bestuurscollege het bepaalde bij of krachtens het eerste tot en met zesde lid niet nakomt, kan Onze
      Minister de uitkering geheel of gedeeltelijk inhouden of opschorten. Onze Minister gaat niet over tot gehele of
      gedeeltelijke inhouding dan na overleg met het bestuurscollege. Onze Minister kan de uitkering wederom toekennen
      indien de reden voor inhouding of opschorting is vervallen.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.2
  - number: 8.3.2.8
    text: |-
      Onze Minister kan de in het vierde lid bedoelde uitkering geheel of gedeeltelijk terugvorderen indien niet uit de
      informatie, verstrekt krachtens [artikel 214 van de Wet openbare lichamen Bonaire, Sint Eustatius en Saba][ref1],
      blijkt dat de uitkering is besteed in overeenstemming met dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0028142#Artikel214
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0028142
        artikel: '214'
  - number: 8.3.3.1
    text: |-
      Het bestuurscollege zendt de in [artikel 8.3.2, zesde lid][ref1], bedoelde effectrapportage aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.3.3.2
    text: |-
      Het bestuurscollege is gehouden aan de door Onze Minister aangewezen personen alle gevraagde bescheiden ter inzage
      te geven en de gevraagde inlichtingen te verstrekken die van belang zijn voor het door Onze Minister te voeren
      beleid met betrekking tot het voortijdig schoolverlaten door niet-leerplichtigen.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.3
  - number: 8.3.3.3
    text: |-
      Bij ministeriële regeling kunnen nadere voorschriften worden gegeven omtrent het tijdstip van indiening en de
      inrichting van de effectrapportage en inzake de wijze van beschikbaarstelling van de gegevens, bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.3.3
  - number: 8.4.1.1
    text: |-
      Leer-werktrajecten als bedoeld in [artikel 19 van de Wet voortgezet onderwijs BES][ref1] worden verzorgd op
      grondslag van een samenwerkingsovereenkomst tussen het bevoegd gezag van een instelling en het bevoegd gezag van
      een school voor voortgezet onderwijs als bedoeld in de [Wet voortgezet onderwijs BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0030284
  - number: 8.4.1.2
    text: |-
      Een samenwerkingsovereenkomst als bedoeld in het eerste lid, voldoet aan
      [artikel 25 van de Wet voortgezet onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel25
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '25'
  - number: 8.4.2.1
    text: |-
      De assistentopleiding, bedoeld in [artikel 26 van de Wet voortgezet onderwijs BES][ref1], wordt verzorgd op
      grondslag van een samenwerkingsovereenkomst tussen het bevoegd gezag van een instelling en het bevoegd gezag van
      een school voor voortgezet onderwijs als bedoeld in de [Wet voortgezet onderwijs BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0030284
