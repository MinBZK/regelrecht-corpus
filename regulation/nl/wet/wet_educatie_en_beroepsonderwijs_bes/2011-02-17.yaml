  - number: 1.2.1.1
    text: |-
      Educatie is gericht op de bevordering van de persoonlijke ontplooiing ten dienste van het maatschappelijk
      functioneren van volwassenen door de ontwikkeling van kennis, inzicht, vaardigheden en houdingen op een wijze die
      aansluit bij hun behoeften, mogelijkheden en ervaringen alsmede bij maatschappelijke behoeften. Waar mogelijk sluit
      de educatie aan op het ingangsniveau van het beroepsonderwijs. Educatie omvat niet activiteiten op het niveau van
      het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.2.1
  - number: 1.2.1.2
    text: |-
      Beroepsonderwijs is gericht op de theoretische en praktische voorbereiding voor de uitoefening van beroepen
      waarvoor een beroepskwalificerende opleiding is vereist of dienstig kan zijn. Het beroepsonderwijs bevordert
      tevens de algemene vorming en de persoonlijke ontplooiing van de deelnemers en draagt bij tot het maatschappelijk
      functioneren. Beroepsonderwijs sluit aan op het voorbereidend beroepsonderwijs en het algemeen voortgezet
      onderwijs. Beroepsonderwijs omvat niet het hoger onderwijs.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.2.1
  - number: 1.3.1
    text: |-
      Bij de uitvoering van hun taak dragen de instellingen, onverminderd het bij of krachtens deze wet bepaalde, mede
      zorg voor:
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.1
  - number: 1.3.1.a
    text: de toegankelijkheid van het onderwijs, in het bijzonder voor kansarme groepen,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.1
  - number: 1.3.1.b
    text: |-
      het aanbieden van doelmatige leerwegen, in het bijzonder door het zorg dragen voor een zorgvuldige afstemming
      tussen opleidingen educatie en beroepsopleidingen,
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.1
  - number: 1.3.1.c
    text: het bieden van mogelijkheden voor loopbaanoriëntatie en -begeleiding, en
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.1
  - number: 1.3.1.d
    text: |-
      de afstemming op de ontwikkelingen in de samenleving op nationaal en internationaal gebied in het algemeen en ten
      aanzien van de arbeidsmarkt in het bijzonder.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.1
  - number: 1.3.3.1
    text: |-
      Het openbaar onderwijs draagt bij aan de ontwikkeling van de deelnemers met aandacht voor de godsdienstige,
      levensbeschouwelijke en maatschappelijke waarden zoals die leven in de Nederlandse samenleving en de Caribische
      regio en met onderkenning van de betekenis van de verscheidenheid van die waarden.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.3
  - number: 1.3.3.2
    text: Openbaar onderwijs wordt gegeven met eerbiediging van ieders godsdienst of levensovertuiging.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.3
  - number: 1.3.4.1
    text: 'Een instelling kan in stand gehouden worden door:'
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.4
  - number: 1.3.4.1.a
    text: een natuurlijke persoon, of
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.4
  - number: 1.3.4.1.b
    text: een rechtspersoon met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.4
  - number: 1.3.4.2
    text: 'Een rechtspersoon die een instelling in stand kan houden kan zijn:'
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.4
  - number: 1.3.4.2.a
    text: een openbaar lichaam of een door een openbaar lichaam ingestelde openbare rechtspersoon, dan wel
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.4
  - number: 1.3.4.2.b
    text: een privaatrechtelijke rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.4
  - number: 1.3.5.1
    text: |-
      Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn instelling met
      taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf tegen de zeden als bedoeld
      in het [Tweede Boek, titel XIV, van het Wetboek van Strafrecht BES][ref1] jegens een minderjarige deelnemer
      van de instelling, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028570
      [ref2]: https://wetten.overheid.nl/BWBR0013800#Artikel6
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.5
    references:
      - id: ref1
        bwb_id: BWBR0028570
      - id: ref2
        bwb_id: BWBR0013800
        artikel: '6'
  - number: 1.3.5.2
    text: |-
      Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van een redelijk
      vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste
      lid jegens een minderjarige deelnemer van de instelling, doet het bevoegd gezag onverwijld aangifte bij een
      opsporingsambtenaar als bedoeld in [artikel 1 van het Wetboek van Strafvordering BES][ref1], en stelt het bevoegd
      gezag de vertrouwensinspecteur daarvan onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van
      aangifte, stelt het de ouders van de betrokken deelnemer, onderscheidenlijk de betreffende ten behoeve van de
      instelling met taken belaste persoon, hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.5
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '1'
  - number: 1.3.5.3
    text: |-
      Indien een personeelslid bekend is geworden dat een ten behoeve van de instelling met taken belast persoon zich
      mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een minderjarige
      deelnemer van de instelling, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.3.5
  - number: 1.4.1.1
    text: Onze Minister kan op aanvraag van het bevoegd gezag een beroepsopleiding erkennen.
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.1
  - number: 1.4.1.2
    text: |-
      Erkenning houdt in dat aan de met goed gevolg afgelegde examens of onderdelen van examens van die opleiding een
      diploma of certificaat als bedoeld in [artikel 7.4.8][ref1] is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2011-02-17#Artikel1.4.1
    references:
