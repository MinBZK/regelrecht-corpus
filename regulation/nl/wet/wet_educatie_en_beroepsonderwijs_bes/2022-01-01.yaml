      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.4.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.4.1.5
    text: |-
      De aanvraag om erkenning wordt ingediend bij Onze Minister. Indien de gegevens bij de aanvraag onjuist of niet
      volledig zijn, stelt Onze Minister binnen twee weken na indiening van de aanvraag de aanvrager in de gelegenheid om
      binnen een door Onze Minister te bepalen termijn alsnog te voorzien in de vereiste gegevens.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.4.1
  - number: 1.4.1.6
    text: |-
      Onze Minister beslist binnen zes maanden na de aanvraag om erkenning. Indien de beschikking niet binnen zes maanden
      kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en noemt hij daarbij een termijn waarbinnen
      de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.4.1
  - number: 1.4.1.7
    text: |-
      Het bevoegd gezag verstrekt Onze Minister op diens verzoek de nodige inlichtingen omtrent de instelling. Het
      bevoegd gezag doet Onze Minister en, indien het betreft op grond van [artikel 2.1.1][ref1] bekostigde opleidingen,
      de desbetreffende eilandsraad jaarlijks vóór 1 februari een verslag toekomen omtrent de werkzaamheden van de
      instelling voor zover betrekking hebbend op opleidingen. Het verslag bevat tevens het aantal studenten per
      opleiding en het aantal uitgereikte certificaten en diploma's, bedoeld in [artikel 7.4.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.4.1
    references:
