    text: |-
      De aanvraag om erkenning gaat in elk geval vergezeld van een beschrijving van het stelsel van kwaliteitszorg,
      bedoeld in [artikel 1.3.2, tweede lid][ref1] alsmede het ontwerp van de in [artikel 7.4.9][ref2] bedoelde
