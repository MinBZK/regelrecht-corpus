        artikel: '8'
        hoofdstuk: '8'
      - id: ref4
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4a.14.3
    text: Het eerste lid is niet van toepassing indien de student definitief van de instelling wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.14
  - number: 8.4a.15
    text: |-
      Het bevoegd gezag van de instelling kan met het bevoegd gezag van de school waarmee een samenwerkingsovereenkomst
      is gesloten als bedoeld in [artikel 8.4a.3][ref1], overeenkomen om vanwege een doorlopende leerroute vmbo-mbo een
      deel van de rijksbijdrage over te dragen aan dat andere bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.15
    references:
