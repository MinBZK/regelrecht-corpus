        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4a.16
    text: |-
      De [artikelen 8.0.1][ref1], [8.0.3][ref2], 8.0.4, [8.1.1b][ref3], [8.1.7a][ref4], [8.2.1][ref5], [8.2.2][ref6] en
      [8.2.2a][ref7] zijn niet van toepassing op een doorlopende leerroute vmbo-mbo.


