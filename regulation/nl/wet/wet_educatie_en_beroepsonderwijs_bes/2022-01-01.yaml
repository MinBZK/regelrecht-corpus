        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: 27l
  - number: 1.4.3.2
    text: |-
      Toepassing van het eerste lid berust op een samenwerkingsovereenkomst, gesloten tussen het bevoegd gezag, bedoeld
      in het eerste lid, en het bevoegd gezag van een ingevolgde [artikel 112 van de Wet voortgezet onderwijs BES][ref1]
      aangewezen school.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel112
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.4.3
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '112'
  - number: 1.4.3.3
    text: |-
      De [artikelen 8.4.3][ref1], [8.4a.2][ref2], [8.4a.3, met uitzondering van het tweede lid][ref3] wat betreft
      [artikel 27b, tweede lid, onderdeel e, van de Wet voortgezet onderwijs BES][ref4], [8.4a.4 tot en met 8.4a.7][ref5],
      [8.4a.8, eerste en tweede lid][ref6], [8.4a.9][ref7], [8.4a.11][ref8], [8.4a.12][ref9], [8.4a.14][ref10] en
      [8.4a.16][ref11] zijn van overeenkomstige toepassing, met dien verstande dat voor «school» telkens wordt gelezen
      «school aangewezen ingevolge [artikel 112 van de Wet voortgezet onderwijs BES][ref12]».


