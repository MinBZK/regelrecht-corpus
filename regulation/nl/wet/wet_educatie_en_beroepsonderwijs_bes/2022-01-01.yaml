  - number: '9.2'
    text: |-
      Indien de uitspraak op een beroep als bedoeld in [artikel 9.1][ref1] strekt tot examinering als bedoeld in
      [artikel 1.6.1][ref2], of registratie in het Centraal register, treden de gevolgen daarvan in met ingang van het
      studiejaar dat aanvangt in het jaar waarin de uitspraak is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
