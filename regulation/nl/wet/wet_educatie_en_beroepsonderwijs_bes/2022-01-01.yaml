        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 1.4.1.8
    text: Een aanvraag om erkenning geldt mede als aanmelding voor registratie in het Centraal register.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.4.1
  - number: 1.4.2.1
    text: Onze Minister kan op aanvraag van het bevoegd gezag een opleiding educatie erkennen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.4.2
  - number: 1.4.2.2
    text: |-
      Erkenning houdt in dat de met goed gevolg afgelegde examens of onderdelen van examens van die opleiding een diploma
      of certificaat als bedoeld in [artikel 7.4.8][ref1] is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.4.2
    references:
