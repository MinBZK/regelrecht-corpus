        artikel: '1'
        hoofdstuk: '1'
  - number: 10.1.1
    text: |-
      Indien sprake is van wanbeheer van een of meer bestuurders of toezichthouders kan Onze Minister het bevoegd gezag
      een aanwijzing geven. Een aanwijzing omvat een of meer maatregelen en is evenredig aan het doel waarvoor zij wordt
      gegeven.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.1
  - number: 10.1.2
    text: Onze Minister is bevoegd de aanwijzing te geven tot en met een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.1
  - number: 10.1.3
    text: 'Onder wanbeheer wordt uitsluitend verstaan:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.1
  - number: 10.1.3.a
    text: financieel wanbeleid,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.1
  - number: 10.1.3.b
    text: |-
      ernstige nalatigheid om, in ieder geval in strijd met [artikel 1.3.2][ref1], maatregelen te treffen die
      noodzakelijk zijn voor het waarborgen van de kwaliteit en goede voortgang van het onderwijs aan de instelling en om
      te voorkomen dat de kwaliteit van het stelsel van beroepsonderwijs en educatie in gevaar komt,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 10.1.3.c
    text: ongerechtvaardigde verrijking, al dan niet beoogd, van het bevoegd gezag, zichzelf dan wel een derde, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.1
  - number: 10.1.3.d
    text: |-
      onrechtmatig handelen, waaronder wordt verstaan het in de hoedanigheid van bestuurder of toezichthouder handelen
      in strijd met wettelijke bepalingen waarmee financieel voordeel wordt behaald ten gunste van het bevoegd gezag,
      zichzelf of een derde.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.1
  - number: 10.1.4
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten sprake is van wanbeheer alsmede de in
      verband daarmee te nemen maatregelen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.1
  - number: 10.1.5
    text: Een aanwijzing bevat de termijn waarbinnen het bevoegd gezag aan de aanwijzing moet voldoen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.1
  - number: 10.1.6
    text: |-
      Alvorens een aanwijzing te geven, stelt Onze Minister het bevoegd gezag vier weken in de gelegenheid zijn
      zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.1
  - number: 10.2.1
    text: |-
      Indien het bevoegd gezag in strijd handelt met het bepaalde bij of krachtens deze wet, kan Onze Minister bepalen
      dat de rijksbijdrage, voorschotten daaronder begrepen, geheel of gedeeltelijk wordt ingehouden dan wel opgeschort.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.2
  - number: 10.2.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het bevoegd gezag of het personeel van een school
      de inspectie bij de uitoefening van zijn bevoegdheden niet alle medewerking heeft verleend die de inspectie
      redelijkerwijs kan vorderen binnen een door hem gestelde redelijke termijn. Zij die uit hoofde van ambt, beroep of
      wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het verlenen van medewerking weigeren, voor zover
      dit uit hun geheimhoudingsplicht voorvloeit.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.2
  - number: 10.2.3
    text: |-
      Onze Minister kan de rijksbijdrage wederom toekennen, indien blijkt dat de reden voor de toepassing van het eerste
      of tweede lid is vervallen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.2
  - number: 10.3.1
    text: |-
      Het is anderen dan de instellingen die daartoe ingevolge deze wet gerechtigd zijn, verboden onderwijs aan te
      bieden of te verzorgen, dan wel examinering te verzorgen, onder de naam van een in het Centraal register opgenomen
      opleiding.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.3
  - number: 10.3.2
    text: Degene die in strijd handelt met het eerste lid, wordt gestraft met geldboete van de eerste categorie.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.3
  - number: 10.3.3
    text: Het in het eerste lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10.3
  - number: 10a.1.1
    text: |-
      Met het oog op verbetering van de kwaliteit, toegankelijkheid of doelmatigheid van het beroepsonderwijs kan bij
      wijze van experiment bij algemene maatregel van bestuur worden afgeweken van: - [titel 2 van hoofdstuk 2][ref1],
        - [hoofdstuk 6][ref2], en
        - [hoofdstuk 7][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028395
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0028395
        hoofdstuk: '7'
  - number: 10a.1.2
    text: 'In geval van toepassing van het eerste lid worden bij algemene maatregel van bestuur in ieder geval bepaald:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
  - number: 10a.1.2.a
    text: het doel van het experiment,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
  - number: 10a.1.2.b
    text: |-
      op welke wijze van welke artikelen van de in het eerste lid genoemde hoofdstukken, titels of paragrafen wordt
      afgeweken,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
  - number: 10a.1.2.c
    text: de duur van het experiment, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
  - number: 10a.1.2.d
    text: op welke wijze en aan de hand van welke criteria de met het experiment beoogde effecten worden geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
  - number: 10a.1.3
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van een experiment.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
  - number: 10a.1.4
    text: |-
      Een experiment duurt ten hoogste zes jaar. Indien, voordat een experiment is afgelopen, een voorstel van wet is
      ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele wettelijke regeling, kan Onze
      Minister het experiment verlengen tot het tijdstip waarop het wetsvoorstel tot wet is verheven en in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
  - number: 10a.1.5
    text: |-
      Onze Minister zendt drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur als
      bedoeld in het eerste lid aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van het
      experiment in de praktijk, evenals een standpunt over de voortzetting van die algemene maatregel van bestuur,
      anders dan een voortzetting als experiment.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
  - number: 10a.1.6
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het tweede lid, kan bij wijze van experiment tevens worden
      afgeweken van:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
  - number: 10a.1.6.a
    text: |-
      [artikel 1 van de Leerplichtwet BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0030281#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
    references:
      - id: ref1
        bwb_id: BWBR0030281
        artikel: '1'
  - number: 10a.1.6.b
    text: |-
      [artikel 1.1 van de Wet studiefinanciering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028393#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
    references:
      - id: ref1
        bwb_id: BWBR0028393
        artikel: '1'
  - number: 10a.1.7
    text: |-
      Dit artikel is van overeenkomstige toepassing op een samenwerkingsverband tussen een instelling en een school
      als bedoeld in de [Wet op het voortgezet onderwijs BES][ref1] of een instelling als bedoeld in de Wet op het
      hoger onderwijs en wetenschappelijk onderzoek. Bij samenwerking met een school als bedoeld in de Wet op het
      voortgezet onderwijs BES kan voor die school worden afgeweken van [titel II, afdeling I, hoofdstuk I][ref2]
      en van [titel III, afdeling III][ref3], van die wet. Bij de algemene maatregel van bestuur, bedoeld in het
      tweede lid, wordt geregeld welke bij of krachtens de Wet op het voortgezet onderwijs BES onderscheidenlijk de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4] vastgestelde voorschriften van toepassing of van
      overeenkomstige toepassing zijn op de samenwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0030284
      [ref2]: https://wetten.overheid.nl/BWBR0030284#HoofdstukI
      [ref3]: https://wetten.overheid.nl/BWBR0030284#AfdelingIII
      [ref4]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel10a.1
    references:
      - id: ref1
        bwb_id: BWBR0030284
      - id: ref2
        bwb_id: BWBR0030284
        hoofdstuk: I
      - id: ref3
        bwb_id: BWBR0030284
        afdeling: III
      - id: ref4
        bwb_id: BWBR0005682
  - number: 11.1.1
    text: |-
      De opleidingen die in het schooljaar 2008–2009 werden erkend en bekostigd als secundair beroepsonderwijs in
      de zin van de Landsverordening secundair beroepsonderwijs en educatie, worden met ingang van het tijdstip van
      inwerkingtreding van dit artikel, aangemerkt als erkende en bekostigde opleidingen voor beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.1
  - number: 11.1.2
    text: |-
      De niet bekostigde opleidingen die op de dag voorafgaand aan het tijdstip van de inwerkingtreding van dit artikel,
      op grond van artikel 3 van de Landsverordening secundair beroepsonderwijs en educatie, of de Wet educatie en
      beroepsonderwijs BES zoals die wet op 10 oktober 2010 is komen te luiden, zijn aangewezen als beroepsonderwijs,
      worden aangemerkt als erkende niet bekostigde opleidingen voor beroepsonderwijs.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.1
  - number: 11.1a
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip kan bij of krachtens algemene maatregel van bestuur worden
      afgeweken van [artikel 2.2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.1a
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 11.1b.1
    text: |-
      In afwijking van [artikel 2.2.6][ref1] en met van overeenkomstige toepassingverklaring van de
      [artikelen 136 tot en met 147 van de Wet voortgezet onderwijs BES][ref2] gelden voor het jaar 2011 tot en met
      een bij koninklijk besluit te bepalen tijdstip de voorschriften van het tweede tot en met zevende lid voor de
      voorziening in de huisvesting van uit ’s Rijks kas bekostigde instellingen.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel136
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.1b
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '136'
  - number: 11.1b.2
    text: |-
      Onze Minister en het bestuurscollege van het openbaar lichaam zijn voor het jaar 2011 tot en met een bij koninklijk
      besluit te bepalen tijdstip gezamenlijk verantwoordelijk voor de huisvesting van uit 's Rijks kas bekostigde
      instellingen alsmede voor de financiering daarvan.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.1b
  - number: 11.1b.3
    text: |-
      Onze Minister en het bestuurscollege van het openbaar lichaam sluiten ter invulling van de gezamenlijke
      verantwoordelijkheid, bedoeld in het tweede lid, namens de Staat der Nederlanden onderscheidenlijk namens het
      betreffende openbaar lichaam, een of meer convenanten.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.1b
  - number: 11.1b.4
    text: |-
      Overeenkomstig het convenant of de convenanten, bedoeld in het derde lid, stelt Onze Minister voor elk van de
      openbare lichamen een plan vast, waarin de voornemens op het terrein van de huisvesting, bedoeld in het tweede lid,
      alsmede de financiering daarvan, op hoofdlijnen worden beschreven.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.1b
  - number: 11.1b.5
    text: |-
      Onze Minister stelt de plannen, bedoeld in het vierde lid, vast in overeenstemming met het bestuurscollege van het
      openbaar lichaam en na overleg met de betreffende bevoegde gezagsorganen van de instellingen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.1b
  - number: 11.1b.6
    text: |-
      Onze Minister kan een of meer plannen, bedoeld in het vierde lid, in overeenstemming met het bestuurscollege van
      het betreffende openbaar lichaam, wijzigen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.1b
  - number: 11.1b.7
    text: |-
      De plannen dan wel een wijziging daarvan, worden aan de betrokken bevoegde gezagsorganen van de instellingen en in
      de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.1b
  - number: '11.2'
    text: |-
      Onverminderd [artikel 4.2.1, eerste lid, onderdelen a en d][ref1], kunnen in afwijking van artikel 4.2.1, eerste
      lid onderdeel b, docenten worden benoemd dan wel tewerkgesteld zonder benoeming die op de dag voorafgaand aan
      het tijdstip van de inwerkingtreding van dit artikel, bevoegd waren tot het geven van onderwijs op grond van de
      Landsverordening secundair beroepsonderwijs en educatie of van de Wet educatie en beroepsonderwijs BES zoals die
      wet op 10 oktober 2010 is komen te luiden.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel4
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '4'
        hoofdstuk: '4'
  - number: '11.3'
    text: |-
      Onverminderd [artikel 4.2.1, eerste lid, onderdelen, a en d][ref1], mag in afwijking van artikel 4.2.1, eerste
      lid, onderdeel b, gedurende een periode van vijf jaar na het tijdstip van de inwerkingtreding van dit artikel
      beroepsonderwijs en educatie gegeven worden door degenen die op die dag secundair beroepsonderwijs en educatie
      gaven op een van de instellingen in de openbare lichamen zonder daartoe bevoegd te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel4
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '4'
        hoofdstuk: '4'
  - number: '11.4'
    text: |-
      Onverminderd [artikel 4.2.1, eerste lid, onderdelen a en d][ref1], kunnen in afwijking van artikel 4.2.1, eerste
      lid onderdeel b, degenen die geen getuigschrift bezitten als bedoeld in artikel 4.2.1, eerste lid onderdeel b,
      ten eerste, maar voorafgaand aan het tijdstip van de inwerkingtreding van dit artikel, een opleiding begonnen zijn
      die leidt tot een bewijs van bekwaamheid tot het geven van onderwijs als bedoeld in de Landsverordening secundair
      beroepsonderwijs en educatie, gedurende een periode van vijf jaar na dat tijdstip na het behalen van dit bewijs
      van bekwaamheid worden benoemd dan wel tewerkgesteld worden zonder benoeming tot docent in het beroepsonderwijs
      en educatie.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel4
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.4
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '4'
        hoofdstuk: '4'
  - number: 11.6a
    text: |-
      Tot een bij koninklijk besluit te bepalen tijdstip blijven de bepalingen van de Wet educatie en beroepsonderwijs
      BES zoals die is komen te luiden op 10 oktober 2010, van kracht voor zover de regeling van de daarin opgenomen
      onderwerpen niet is vervangen door de inwerkingtreding van overeenkomstige onderwerpen in deze wet.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel11.6a
  - number: 11.6b
    text: |-
      Het bevoegd gezag kan tot een bij koninklijk besluit te bepalen tijdstip op eindtermen gerichte beroepsopleidingen
      verzorgen. Op deze opleidingen zijn de [artikelen 1.1.1][ref1], [1.4.1][ref2], [2.2.2][ref3], [7.1.2][ref4],
      [7.1.3][ref5], [7.2.2][ref6], [7.2.3][ref7], [7.2.4][ref8], [7.2.5][ref9], [7.2.6][ref10], [7.2.7][ref11],
      [7.4.2][ref12], [7.4.3][ref13], 7[.4.5][ref14], [7.4.8][ref15], [8.1.1][ref16] en [8.1.5][ref17] zoals luidend op
      de dag voor de inwerkingtreding van de wijzigingen van die artikelen op grond van deze wet en de eindtermen die
      gelden op die dag van toepassing.


