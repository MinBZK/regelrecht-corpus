  - number: 8.4a.8.3
    text: |-
      [Artikel 7.4.10a][ref1] is van overeenkomstige toepassing op klachten over met de doorlopende leerroute
      vmbo-mbo verband houdende gedragingen en beslissingen van het bevoegd gezag van de school waarmee een
      samenwerkingsovereenkomst als bedoeld in [artikel is 8.4a.3][ref2] is gesloten, of van het personeel van
      dat bevoegd gezag. Onverminderd [artikel 7.4.10a, vierde lid, onderdeel a][ref3], maakt de voorzitter van de
      klachtencommissie geen deel uit van dat bevoegd gezag en is hij niet werkzaam voor of bij dat bevoegd gezag.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.8
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref3
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 8.4a.9.1
    text: |-
      In het kader van de onderwijs- en examenregeling, bedoeld in [artikel 7.4.9, eerste lid][ref1], die wordt opgesteld
      ten aanzien van een doorlopende leerroute, beschrijft het bevoegd gezag van de instelling samen met het bevoegd
      gezag van de school voor de gehele doorlopende leerroute vmbo-mbo het onderwijsprogramma en de examinering per
      studiejaar. Daarbij wordt vermeld welke onderdelen van het onderwijsprogramma en van het examen:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.9
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 8.4a.9.1.a
    text: voortgezet onderwijs betreffen, en welk deel daarbinnen vakoverstijgend is;
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.9
  - number: 8.4a.9.1.b
    text: beroepsonderwijs betreffen;
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.9
  - number: 8.4a.9.1.c
    text: |-
      een combinatie van voortgezet onderwijs en beroepsonderwijs betreffen, en welk deel daarbinnen voortgezet onderwijs
      onderscheidenlijk beroepsonderwijs betreft.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.9
  - number: 8.4a.9.2
    text: |-
      Bij de beschrijving van het onderwijsprogramma wordt tevens vermeld bij welk deel gebruik wordt gemaakt van de
      teambevoegdheid, bedoeld in [artikel 8.4a.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.9
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
  - number: 8.4a.13
    text: |-
      Voor de vakoverstijgende delen van het onderwijsprogramma, bedoeld in
      [artikel 8.4a.9, eerste lid, onderdeel a][ref1], en voor de delen van het onderwijsprogramma die een combinatie van
      voortgezet onderwijs en beroepsonderwijs betreffen, als bedoeld 8.4a.9, onderdeel c, kan, voor zover wordt voldaan
      aan [artikel 80, negende en tiende lid, van de Wet voortgezet onderwijs BES][ref2], worden gewerkt met teams die
      verantwoordelijk zijn voor de kwaliteit van dat deel van het onderwijsprogramma.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel80
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.13
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '80'
  - number: 8.4a.14.1
    text: |-
      Indien deelname van de student aan een doorlopende leerroute vmbo-mbo wordt beëindigd voordat hij deze met succes
      heeft afgerond wordt hij door het bevoegd gezag van de instelling en het bevoegd gezag van de school in staat
      gesteld een vmbo-diploma of het diploma van een beroepsopleiding te behalen, passend bij het naar het gezamenlijk
      oordeel van beide betrokken bevoegde gezagsorganen bereikte onderwijsniveau en de leeftijd van de student.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.14
  - number: 8.4a.14.2
    text: |-
      Indien de student ingevolge het eerste lid een diploma van een beroepsopleiding wil behalen bij dezelfde
      instelling, zijn de [artikelen 8.1.1b][ref1], [8.2.1][ref2], [8.2.2][ref3] en [8.2.2a][ref4] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0028395#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0028395#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel8.4a.14
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '8'
        hoofdstuk: '8'
