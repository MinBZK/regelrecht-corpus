  - number: 1.5.1.1
    text: |-
      Onze Minister stelt voor een openbaar lichaam of voor een combinatie van openbare lichamen een Raad onderwijs
      arbeidsmarkt in.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.5.1
  - number: 1.5.1.2
    text: De raad is een rechtspersoon met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.5.1
  - number: 1.5.1.3
    text: |-
      De raad heeft een bestuur bestaande uit vertegenwoordigers van werkgeversorganisaties, uit vertegenwoordigers van
      werknemersorganisaties en uit vertegenwoordigers van de instellingen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.5.1
  - number: 1.5.1.4
    text: Onze Minister kan de raad subsidiëren voor de uitoefening van zijn taken.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.5.1
  - number: 1.5.1.5
    text: |-
      Voor zover het vierde lid van toepassing is, zijn [titel 4.1][ref1] en [4.2 van de Algemene wet bestuursrecht][ref2]
      en de [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref3] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.5.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
  - number: 1.5.2.1
    text: |-
      De raad adviseert Onze Minister over de doelmatigheid van de beroepsopleidingen die de instellingen voornemens zijn
      te verzorgen of reeds verzorgen, gelet op de arbeidsmarktrelevantie van die opleidingen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.5.2
  - number: 1.5.2.2
    text: |-
      De raad draagt bij aan een doelmatige en doelgerichte inzet van overheidsmiddelen door het doen van voorstellen,
      welke beroepsopleidingen voor bekostiging uit ’s Rijks kas in aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.5.2
  - number: 1.5.2.3
    text: |-
      De raad doet in voorkomende gevallen voorstellen aan Onze Minister inzake het ontwikkelen van beroepsopleidingen
      dan wel delen van beroepsopleidingen die relevant zijn voor de regionale arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.5.2
  - number: 1.5.2.4
    text: |-
      De raad draagt bij aan de bevordering van de kwaliteit van de plaatsen waar de beroepspraktijkvorming wordt
      verzorgd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.5.2
  - number: 1.5.2.5
    text: |-
      De raad draagt er zoveel mogelijk zorg voor dat er een toereikend aantal bedrijven en organisaties van voldoende
      kwaliteit beschikbaar zijn die de beroepspraktijkvorming voor de opleidingen verzorgen. De raad is voorts belast
      met een regelmatige beoordeling van die bedrijven en organisaties.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.5.2
  - number: 1.6.1.1
    text: |-
      Onze Minister besluit op aanvraag van het bevoegd gezag van een exameninstelling, dat de exameninstelling het recht
      heeft tot examinering van een beroepsopleiding in opdracht van een instelling, indien die exameninstelling in acht
      neemt hetgeen bij of krachtens deze wet is bepaald over:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.6.1
  - number: 1.6.1.1.a
    text: |-
      de kwaliteitszorg, bedoeld in [artikel 1.3.2][ref1] voor zover het betreft de examinering,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.6.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 1.6.1.1.b
    text: de examens, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.6.1
  - number: 1.6.1.1.c
    text: |-
      de rechtsbescherming, bedoeld in [hoofdstuk 7, titel 5][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.6.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        hoofdstuk: '7'
  - number: 1.6.1.2
    text: |-
      Onze Minister besluit binnen drie maanden na ontvangst van een aanvraag als bedoeld in het eerste lid. Indien de
      beschikking niet binnen drie maanden kan worden gegeven, stelt Onze Minister de aanvrager daarvan in kennis en
      noemt hij daarbij een termijn waarbinnen de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel1.6.1
  - number: 2.1.1.1
    text: |-
      Onze Minister kan, de eilandsraad gehoord, op aanvraag van het bevoegd gezag besluiten dat een beroepsopleiding
      ten aanzien waarvan het bevoegd gezag een erkenning heeft verkregen op grond van [artikel 1.4.1][ref1], voor
      bekostiging in aanmerking komt. Bij inwilliging van de aanvraag ontstaat de aanspraak op bekostiging met ingang van
      het kalenderjaar daaropvolgend.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.1.1.2
    text: 'Bekostiging van een beroepsopleiding vindt slechts plaats indien:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.1.1
  - number: 2.1.1.2.a
    text: |-
      de beroepsopleiding wordt aangeboden door een instelling in stand gehouden door een rechtspersoon met volledige
      rechtsbevoegdheid die niet het maken van winst tot oogmerk heeft,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.1.1
  - number: 2.1.1.2.b
    text: er maatschappelijke behoefte aan de beroepsopleiding bestaat,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.1.1
  - number: 2.1.1.2.c
    text: er arbeidsmarktperspectieven zijn voor afgestudeerden,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.1.1
  - number: 2.1.1.2.d
    text: de inhoud van de beroepsopleiding bijdraagt aan een duurzame en brede beroepskwalificatie, alsmede
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.1.1
  - number: 2.1.1.2.e
    text: |-
      de beroepsopleiding bijdraagt aan het tot stand komen van een samenhangend aanbod met het voorbereidend middelbaar
      beroepsonderwijs dat wordt bekostigd op grond van de [Wet voortgezet onderwijs BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0030284
  - number: 2.1.2.1
    text: |-
      De aanspraak op bekostiging voor een beroepsopleiding eindigt van rechtswege met ingang van het tijdstip waarop de
      erkenning ten aanzien van die opleiding is ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.1.2
  - number: 2.1.2.2
    text: |-
      Onze Minister kan, de eilandsraad gehoord, besluiten dat een beroepsopleiding, verzorgd door een instelling, niet
      meer voor bekostiging in aanmerking komt, indien mede gezien de arbeidsmarktomstandigheden niet langer sprake is
      van voldoende behoefte aan die opleiding.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.1.2
  - number: 2.1.2.3
    text: |-
      Bij een besluit als bedoeld in het eerste lid bepaalt Onze Minister het tijdstip waarop de aanspraak op bekostiging
      voor een bepaalde beroepsopleiding ontnomen wordt zodanig dat de ingeschreven studenten de beroepsopleiding
      waarvoor zij zijn ingeschreven, aan dezelfde of aan een andere instelling binnen een redelijke tijd kunnen
      voltooien.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.1.2
  - number: 2.2.1.1
    text: |-
      De rijksbijdrage voor beroepsopleidingen waarop de in [artikel 2.2.1, eerste lid][ref1], bedoelde aanspraak
      betrekking heeft, wordt per instelling berekend en bestaat uit een bedrag per student, waarbij onderscheid kan
      worden gemaakt naar leerweg.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.1.2
    text: |-
      De rijksbijdrage is bestemd voor kosten voor personeel en exploitatie van een instelling. De bekostiging
      wordt per instelling berekend aan de hand van een bij of krachtens algemene maatregel van bestuur vastgestelde
      berekeningswijze.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.1.3
    text: 'De rijksbijdrage wordt verstrekt voor:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.1.3.a
    text: |-
      personeel wegens voorschriften die zijn gegeven bij of krachtens de [Ambtenarenwet BES][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: 2.2.1.3.b
    text: onderhoud en vervanging van inventaris,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.1.3.c
    text: onderhoud van gebouwen en terreinen,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.1.3.d
    text: energie,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.1.3.e
    text: administratie, beheer en bestuur,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.1.3.f
    text: schoonmaken,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.1.3.g
    text: heffingen
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.1.3.h
    text: inkoop van diensten,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.1.3.i
    text: loopbaanoriëntatie en -begeleiding,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.1.3.j
    text: gehandicapte studenten, alsmede
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.1.3.k
    text: zorg voor studenten met specifieke onderwijsbehoefte te verlenen door de instelling.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.1
  - number: 2.2.2.1
    text: |-
      De in [artikel 2.2.1][ref1] bedoelde berekeningswijze bevat voor elke instelling en elke beroepsopleiding een
      gelijkelijk geldende maatstaf.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.2.2
    text: De maatstaf voorziet in bekostiging aan de hand van de instroom van studenten.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.2
  - number: 2.2.2.3
    text: |-
      Bij ministeriële regeling worden jaarlijks voor 1 oktober de bedragen, bedoeld in
      [artikel 2.2.1, eerste lid][ref1], vastgesteld, die per leerweg kunnen verschillen en worden nadere regels gesteld
      over de wijze waarop de hoogte van de bekostiging wordt berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.2.4
    text: |-
      Voor de toepassing van de maatstaf, bedoeld in het tweede lid, geldt inschrijving van een student voor twee of meer
      voltijdse dan wel twee of meer deeltijdse beroepsopleidingen in enig studiejaar als inschrijving voor één voltijdse
      respectievelijk één deeltijdse beroepsopleiding. Inschrijving van een student voor zowel voltijdse als deeltijdse
      beroepsopleidingen in enig studiejaar geldt voor de toepassing van die maatstaf als inschrijving voor een voltijdse
      opleiding.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.2
  - number: 2.2.2.5
    text: |-
      Bij de toepassing van de maatstaf, bedoeld in het tweede lid, blijven buiten beschouwing studenten aan een
      deeltijdse opleiding waarvoor het bevoegd gezag een in instellingstijd verzorgd onderwijsprogramma, met inbegrip
      van de beroepspraktijkvorming, heeft ingericht dat minder dan 300 uren per volledig studiejaar omvat.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.2
  - number: 2.2.2.6
    text: |-
      In de maatstaf, bedoeld in het tweede lid, kan onderscheid worden gemaakt naar groepen van studenten en naar
      opleidingen. De maatstaf, bedoeld in tweede lid, kan verschillend worden vastgesteld voor opleidingen die worden
      verzorgd door een instelling die deel uitmaakt van een scholengemeenschap als bedoeld in [artikel 123 van de Wet
      voortgezet onderwijs BES](onbekend).
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.2
  - number: 2.2.3.1
    text: |-
      Onze Minister kan aan de rijksbijdrage, berekend op grond van [artikel 2.2.2][ref1], een bedrag toevoegen in
      verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.3.1.a
    text: |-
      bijzondere omstandigheden die in redelijkheid niet door de instelling binnen de rijksbijdrage voor het betreffende
      bekostigingsjaar of binnen de normale bedrijfsvoering kunnen worden opgevangen; of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.3
  - number: 2.2.3.1.b
    text: de ontwikkelingen van het bestel van het beroepsonderwijs op de onderscheiden openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.3
  - number: 2.2.3.2
    text: |-
      Het bedrag bedoeld in het eerste lid, onderdeel a, kan op de rijksbijdrage van een later jaar geheel of
      gedeeltelijk in mindering worden gebracht. Indien dat het geval is wordt dit vermeld in de beschikking en wordt in
      die beschikking tevens de hoogte vermeld van het bedrag dat in mindering zal worden gebracht of de criteria voor de
      bepaling van dat bedrag.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.3
  - number: 2.2.3.3
    text: |-
      Bij ministeriële regeling kunnen voorschriften worden gegeven voor de verstrekking bedoeld in het eerste lid,
      onderdeel b.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.3
  - number: 2.2.3.4
    text: |-
      Onze Minister kan een bekostigingsplafond instellen. In dat geval worden bij ministeriële regeling regels omtrent
      de verdeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.3
  - number: 2.2.3a
    text: |-
      Bij het bepalen van de hoogte van de bekostiging, bedoeld in [artikel 2.2.2][ref1], gaat Onze Minister volgens
      daarover bij of krachtens algemene maatregel van bestuur gestelde regels, uit van het aantal studenten op 1 oktober
      van het jaar voorafgaand aan het jaar waarop de bekostiging betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.3a
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.5.1
    text: |-
      Onze Minister maakt aan elke instelling jaarlijks in december bekend welke rijksbijdrage voor het daarop volgende
      kalenderjaar wordt verstrekt. Hij deelt daarbij mee op welke wijze de rijksbijdrage is berekend.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.5
  - number: 2.2.5.2
    text: De rijksbijdrage wordt betaald volgens een door Onze Minister te bepalen kasritme.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.5
  - number: 2.2.5.3
    text: |-
      Zolang de rijksbijdrage niet is vastgesteld of nader vastgesteld, wordt daarop door Onze Minister een voorschot
      betaald. Het tweede lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.5
  - number: 2.2.5.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere voorschriften gegeven met betrekking tot de
      uitvoering van deze paragraaf. Deze voorschriften hebben in elk geval betrekking op aard, inrichting en wijze van
      verstrekking van gegevens met betrekking tot de studenten.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.5
  - number: 2.2.5.5
    text: |-
      De in het vierde lid bedoelde gegevens die op enigerlei wijze een rol spelen in de berekeningswijze, bedoeld
      in [artikel 2.2.2][ref1], gaan vergezeld van een verklaring omtrent de getrouwheid, afgegeven door een door
      het bevoegd gezag aangewezen deskundige. Deze gegevens en de verklaring worden ingediend voor een bij algemene
      maatregel van bestuur te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.2.6
    text: |-
      De eilandsraad of het bestuurscollege draagt overeenkomstig de [artikelen 129 tot en met 147 van de Wet voortgezet
      onderwijs BES](onbekend) zorg voor de voorzieningen in de huisvesting van instellingen op het grondgebied van het
      openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.2.6
  - number: 2.3.1.1
    text: |-
      Het bevoegd gezag van een instelling voor beroepsonderwijs stelt jaarlijks een jaarrekening vast over het afgelopen
      jaar.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.1
  - number: 2.3.1.2
    text: |-
      In de jaarrekening legt het bevoegd gezag verantwoording af over het financiële beheer van de instelling voor zover
      het betreft de ingevolge deze wet uit 's Rijks kas ontvangen middelen. Uit de jaarrekening dient te blijken dat
      sprake is van een rechtmatige en doelmatige aanwending van de rijksbijdrage. Van niet doelmatige aanwending van
      de rijksbijdrage is in ieder geval sprake voor zover bedragen daaruit worden aangewend voor het op enigerlei wijze
      compenseren van de extraneï voor examengeld. Bij ministeriële regeling kunnen met het oog op de verantwoording van
      de rechtmatigheid en doelmatigheid van de aanwending van de rijksbijdrage nadere voorschriften worden gegeven voor
      de inrichting van de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.1
  - number: 2.3.1.3
    text: |-
      Het resultaat van het jaar waarop de jaarrekening betrekking heeft wordt verrekend met de algemene reserve van
      de instelling.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.1
  - number: 2.3.1.4
    text: |-
      Het bevoegd gezag dient de jaarrekening voor 1 juli van het jaar volgend op het boekjaar
      bij Onze Minister in. De jaarrekening gaat vergezeld van de overige gegevens, bedoeld in
      [artikel 392 van Boek 2 van het Burgerlijk Wetboek][ref1] en een verklaring omtrent de getrouwheid, afgegeven door
      een door het bevoegd gezag aangewezen deskundige.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel392
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '392'
  - number: 2.3.1.5
    text: |-
      Het bevoegd gezag maakt de jaarrekening, vergezeld van de overige gegevens en de verklaring, bedoeld in het vierde
      lid, openbaar. Bij ministeriële regeling kunnen nadere voorschriften worden gegeven over de wijze en het tijdstip
      waarop openbaarmaking plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.1
  - number: 2.3.1.6
    text: |-
      Het bevoegd gezag draagt er zorg voor dat het ten behoeve van Onze Minister beschikt over een overzichtelijke
      informatieverzameling van de financiële gegevens die op enigerlei wijze van belang zijn voor de berekeningswijze,
      bedoeld in [artikel 2.2.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.1.7
    text: |-
      Het bevoegd gezag houdt per begrotingsjaar nauwkeurig boek van baten en lasten en draagt er zorg voor dat de baten
      en lasten nauwkeurig en herkenbaar zijn verwerkt in de in het zesde lid bedoelde informatieverzameling.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.1
  - number: 2.3.1.8
    text: |-
      Het bevoegd gezag bewaart de informatieverzameling en de desbetreffende boeken en bescheiden, bedoeld in het zesde
      en zevende lid, gedurende een periode van zeven jaren.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.1
  - number: 2.3.1.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen voorschriften worden vastgesteld omtrent de wijze van
      beschikbaarstelling van de gegevens en de wijze van ordening daarvan.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.1
  - number: 2.3.2.1
    text: |-
      Het bevoegd gezag stelt jaarlijks een jaarverslag over het afgelopen jaar vast en maakt het openbaar. Het
      jaarverslag bevat ten minste het verslag, bedoeld in [artikel 1.3.2, derde lid][ref1], voor zover dat in het
      desbetreffende jaar is uitgebracht, dan wel de hoofdpunten van laatstgenoemd verslag, alsmede de hoofdpunten van de
      bevindingen van de inspectie met betrekking tot de examens.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.2
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 2.3.2.2
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de inrichting en de wijze en het tijdstip van
      openbaarmaking van het jaarverslag.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.2
  - number: 2.3.8
    text: |-
      Onze Minister kan naast het deskundigenonderzoek, bedoeld in [artikel 2.3.1, vierde lid][ref1], een onderzoek
      instellen of doen instellen naar de jaarrekening en naar de gegevens, bedoeld in [artikel 2.3.3][ref2], naar de
      rechtmatigheid van de bestedingen en naar de doelmatigheid van het beheer van de instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.8
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voorschriften gegeven omtrent de controle van de
      boekhouding, de jaarrekening en de administratie van de instellingen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.10
  - number: 2.3.11.1
    text: |-
      Indien de vaststelling van de rijksbegroting daartoe noopt, kan Onze Minister tot acht weken na die vaststelling
      correcties aanbrengen op de rijksbijdrage. Onze Minister maakt het bevoegd gezag binnen acht weken na de
      vaststelling van de rijksbegroting een correctie als bedoeld in de eerste volzin bekend. Onze Minister verrekent de
      correctie met de rijksbijdrage voor het desbetreffende jaar of betaalt uit in dat jaar.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.11
  - number: 2.3.11.2
    text: |-
      Indien uit de jaarrekening, uit de verklaring van de deskundige, bedoeld in [artikel 2.3.1, vierde lid][ref1], uit
      de resultaten van het onderzoek, bedoeld in [artikel 2.3.8][ref2], blijkt dat de rijksbijdrage op onjuiste gronden
      is vastgesteld dan wel de besteding daarvan niet rechtmatig of niet doelmatig was, kan Onze Minister binnen een
      jaar na ontvangst van de jaarrekening correcties aanbrengen op de rijksbijdrage. Onze Minister maakt het bevoegd
      gezag binnen een jaar na ontvangst van de jaarrekening een correctie als bedoeld in de eerste volzin bekend. Onze
      Minister verrekent de correctie met de rijksbijdrage voor het eerstvolgende jaar of betaalt uit in dat jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.11
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.3.11.3
    text: |-
      Onverminderd het eerste en tweede lid is Onze Minister bevoegd tot verrekening van vorderingen krachtens deze wet
      van of op het bevoegd gezag met vorderingen krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.3.11
  - number: 2.4.1
    text: |-
      Onze Minister kan aan andere rechtspersonen dan die waarvan de instellingen uitgaan, een bijdrage toekennen ter
      bevordering van de verwezenlijking van de in [artikel 1.2.1][ref1] bedoelde doelstellingen van de educatie en het
      beroepsonderwijs dan wel ten behoeve van de afstemming tussen onderwijs en arbeidsmarkt. In dat geval worden bij
      ministeriële regeling daaromtrent regels gegeven. Bij de toepassing van dit artikel zijn de [titels 4.1][ref2]
      en [4.2 van de Algemene wet bestuursrecht][ref3] en de [artikelen 4][ref4], [5][ref5], [9][ref6] en
      [10 van de Wet overige OCW-subsidies][ref7] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0009458#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0009458#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0009458#Artikel9
      [ref7]: https://wetten.overheid.nl/BWBR0009458#Artikel10
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.4.1
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0005537
      - id: ref4
        bwb_id: BWBR0009458
        artikel: '4'
      - id: ref5
        bwb_id: BWBR0009458
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0009458
        artikel: '9'
      - id: ref7
        bwb_id: BWBR0009458
        artikel: '10'
  - number: 2.5.1.1
    text: |-
      Bij de opheffing van een openbare instelling en bij de beëindiging van de bekostiging van een bijzondere instelling
      draagt het bevoegd gezag zo spoedig mogelijk na de opheffing dan wel na de beëindiging van de bekostiging, zorg
      voor de vaststelling van een eindafrekening. De eindafrekening wordt aan Onze Minister gezonden en gaat vergezeld
      van een verklaring omtrent de getrouwheid van een door het bevoegd gezag aangewezen deskundige.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.5.1
  - number: 2.5.1.2
    text: |-
      Tenzij met Onze Minister een andere regeling wordt getroffen, is het bevoegd gezag aan het Rijk een bedrag
      verschuldigd, indien de eindafrekening een batig saldo bevat. Het bedrag wordt door Onze Minister vastgesteld en
      mag niet hoger zijn dan het saldo van de eindafrekening. Bij de vaststelling van het bedrag wordt rekening gehouden
      met door het bevoegd gezag uit de eigen middelen aan investeringen bestede gelden.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.5.1
  - number: 2.5.1.3
    text: |-
      Indien de in het eerste lid bedoelde opheffing dan wel beëindiging van de bekostiging zich voordoet, maakt
      het bevoegd gezag zo spoedig mogelijk aan Onze Minister bekend welke maatregelen het heeft genomen teneinde
      te waarborgen dat de aan die instelling ingeschreven studenten en vavo-studenten het onderwijs aan een andere
      instelling kunnen voltooien.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.5.1
  - number: 2.5.2
    text: |-
      Het bevoegd gezag beheert de middelen van de instelling op zodanige wijze dat een behoorlijke exploitatie en het
      voortbestaan van de instelling zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel2.5.2
  - number: 3.1.1
    text: |-
      Het bevoegd gezag van een instelling waar een student of vavo-student met een specifieke onderwijsbehoefte is
      ingeschreven, stelt voor deze student of vavo-student elk studiejaar een handelingsplan op.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.1
  - number: 3.1.2
    text: |-
      Het handelingsplan wordt opgesteld in overeenstemming met de student of vavo-student of indien de student of vavo-
      student minderjarig is tevens met diens ouders, voogden of verzorgers.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.1
  - number: 3.1.3
    text: |-
      Indien de inschrijving van de in het eerste lid bedoelde student of vavo-student plaatsvindt op of na 1 augustus
      wordt het handelingsplan zo spoedig mogelijk maar uiterlijk een maand na die inschrijving opgesteld.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.1
  - number: 3.1.4
    text: |-
      Het bevoegd gezag evalueert jaarlijks het handelingsplan met de student of vavo-student of indien de student of
      vavo-student minderjarig is tevens met diens ouders, voogden of verzorgers.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.1
  - number: 3.2.1
    text: |-
      Het bevoegd gezag is voor elk van zijn instellingen aangesloten bij een samenwerkingsverband met, voor zover
      aanwezig in het openbaar lichaam:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.2
  - number: 3.2.1.a
    text: een of meer instellingen,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.2
  - number: 3.2.1.b
    text: een of meer scholen voor primair onderwijs,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.2
  - number: 3.2.1.c
    text: een of meer scholen voor voortgezet onderwijs,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.2
  - number: 3.2.1.d
    text: |-
      de uitvoeringsinstantie, bedoeld in [artikel 5, tweede lid, van de Wet sociale kanstrajecten jongeren BES][ref1],
      en


      [ref1]: https://wetten.overheid.nl/BWBR0028506#Artikel5
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0028506
        artikel: '5'
  - number: 3.2.1.e
    text: een expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.2
  - number: 3.2.2
    text: |-
      In afwijking van het eerste lid kan een samenwerkingsverband bestaan uit de betrokkene, bedoeld in de onderdelen a,
      b, c of d die gezamenlijk een expertisecentrum onderwijszorg in stand houden.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.2
  - number: 3.2.3
    text: |-
      Het samenwerkingsverband stelt zich ten doel een samenhangend geheel van zorgvoorzieningen binnen en tussen
      instellingen en in samenwerking met de betrokkenen, bedoeld in het eerste lid, onderdelen b tot en met e,
      te realiseren en wel zodanig dat zoveel mogelijk studenten, vavo-studenten en leerlingen een ononderbroken
      ontwikkelingsproces kunnen doormaken.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.2
  - number: 3.2.4
    text: Per openbaar lichaam is er één samenwerkingsverband.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.2
  - number: 3.2.5
    text: |-
      Indien een bevoegd gezag wenst deel te nemen aan het samenwerkingsverband, wordt deze deelname door de bevoegde
      gezagsorganen van het samenwerkingsverband niet geweigerd.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.2
  - number: 3.2.6
    text: |-
      Bij of krachtens ministeriële regeling worden regels gesteld over de wijze waarop een geschil tussen de
      organisaties, bedoeld in het eerste lid, over aangelegenheden die het samenwerkingsverband aangaan, wordt beslecht.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.2
  - number: 3.3.1
    text: |-
      Het bevoegd gezag stelt samen met de bevoegde gezagsorganen die samenwerken in een samenwerkingsverband en met het
      expertisecentrum onderwijszorg indien [artikel 3.2 eerste lid][ref1], van toepassing is, jaarlijks voor 1 mei een
      gezamenlijk eilandelijk zorgplan vast voor het daaropvolgende studiejaar.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.3.2
    text: 'Het eilandelijk zorgplan bevat in elk geval een beschrijving van:'
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.3
  - number: 3.3.2.a
    text: |-
      de wijze waarop wordt voldaan aan [artikel 3.2, eerste en derde lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.3.2.b
    text: |-
      de wijze, waarop de bekostiging voor de zorgvoorzieningen, bedoeld in
      [artikel 2.2.1, vierde lid, onderdelen j en k][ref1] wordt ingezet,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel2
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.3.2.c
    text: |-
      de wijze waarop de subsidie voor de taken, bedoeld in [artikel 3.4, eerste lid][ref1], en voor zover van toepassing
      het zevende lid van dat artikel, wordt ingezet,


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.3.2.d
    text: |-
      de beoogde en bereikte kwalitatieve en kwantitatieve resultaten ten aanzien van de onderwijskundige opvang van
      studenten, vavo-studenten en leerlingen met een specifieke onderwijsbehoefte,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.3
  - number: 3.3.2.e
    text: de procedures voor de handelingsgerichte diagnose van studenten, vavo-studenten en leerlingen, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.3
  - number: 3.3.2.f
    text: de wijze waarop aan de ouders informatie wordt verstrekt over de zorgvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.3
  - number: 3.3.3
    text: |-
      Het eilandelijk zorgplan wordt voor 15 mei voorafgaand aan het studiejaar waarop het betrekking heeft, toegezonden
      aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.3
  - number: 3.4.1
    text: |-
      Onze Minister kan op verzoek een rechtspersoon aanwijzen die naar zijn oordeel in staat is deskundige ondersteuning
      te bieden aan studenten en vavo-studenten met een specifieke onderwijsbehoefte waarin de instelling redelijkerwijs
      niet kan voorzien en waaronder in elk geval de volgende taken worden verstaan:
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
  - number: 3.4.1.a
    text: |-
      het verzorgen van onderwijsondersteunende activiteiten aan studenten en vavo-studenten met een lichamelijke,
      verstandelijke, zintuiglijke, geestelijke of meervoudige handicap of stoornis,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
  - number: 3.4.1.b
    text: |-
      het verzorgen van ambulante begeleiding ten behoeve van studenten en vavo-studenten met een lichamelijke,
      verstandelijke, zintuiglijke, geestelijke of meervoudige handicap of stoornis,
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
  - number: 3.4.1.c
    text: |-
      het verrichten van handelingsgerichte diagnostiek ten behoeve van de studenten en vavo-studenten op verzoek van het
      bevoegd gezag, het samenwerkingsverband of de ouders, of
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
  - number: 3.4.1.d
    text: |-
      het op verzoek van een bevoegd gezag, het samenwerkingsverband of de ouders van studenten en vavo-studenten
      adviseren en collegiaal consulteren.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
  - number: 3.4.2
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, wordt voor de toepassing van deze wet aangeduid als een
      expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Een student of vavo-student die binnen een locatie van het expertisecentrum onderwijszorg wordt begeleid, blijft
      ingeschreven bij de instelling. Het bevoegd gezag van deze instelling blijft verantwoordelijk voor de student of
      vavo-student tijdens het verblijf binnen het expertisecentrum onderwijszorg. Onder deze verantwoordelijkheid valt
      in elk geval de zorg voor het geven van adequaat onderwijs door een docent die daartoe bevoegd is op grond van
      [artikel 4.2.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel4
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '4'
        hoofdstuk: '4'
  - number: 3.4.4
    text: |-
      Het bevoegd gezag vergoedt voor het begeleiden van zijn student of vavo-student, bedoeld in het derde lid, naar
      redelijkheid en indien dit naar oordeel van het samenwerkingsverband, bedoeld in [artikel 3.2][ref1], nodig is, de
      kosten die worden gemaakt door:


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.4.4.a
    text: het expertisecentrum onderwijszorg, en
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
  - number: 3.4.4.b
    text: |-
      een ander bevoegd gezag van een instelling of school als bedoeld in de [Wet primair onderwijs BES][ref1] of de
      [Wet voortgezet onderwijs BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030280
      [ref2]: https://wetten.overheid.nl/BWBR0030284
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0030280
      - id: ref2
        bwb_id: BWBR0030284
  - number: 3.4.5
    text: Per openbaar lichaam is er één expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
  - number: 3.4.6
    text: |-
      Het expertisecentrum onderwijszorg treft een regeling voor de behandeling van klachten over gedragingen en
      beslissingen van het bestuur van dit centrum of het personeel, waaronder discriminatie, dan wel het nalaten van
      gedragingen en het niet nemen van beslissingen door het bestuur of het personeel voor zover het betreft zijn
      onderscheidenlijk hun werkzaamheden in het kader van het onderwijsproces of de deskundige ondersteuning, bedoeld
      in het eerste lid. [Artikel 52 van de Wet voortgezet onderwijs BES][ref1] is op deze regeling van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel52
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '52'
  - number: 3.4.7
    text: Bij ministeriële regeling kunnen voorschriften worden gegeven over de taken van het expertisecentrum onderwijszorg.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.4
  - number: 3.5.1
    text: Onze Minister verstrekt het expertisecentrum onderwijszorg subsidie.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.5
  - number: 3.5.2
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven over het verstrekken van subsidie aan het expertisecentrum
      onderwijszorg voor de taken, bedoeld in [3.4, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.5.3
    text: |-
      De [titels 4.1][ref1] en [4.2 van de Algemene wet bestuursrecht][ref2] en de
      [artikelen 4 tot en met 19 van de Wet overige OCW-subsidies][ref3] zijn van toepassing op de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0009458#Artikel4
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0009458
        artikel: '4'
  - number: 3.6.1
    text: |-
      Met het toezicht op de uitvoering van de taken, bedoeld in [artikel 3.4, eerste lid][ref1], en voor zover van
      toepassing het zevende lid van dat artikel, zijn belast de bij besluit van Onze Minister aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel3
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0028395
        artikel: '3'
        hoofdstuk: '3'
  - number: 3.6.2
    text: |-
      De [artikelen 5:13][ref1], [5:15][ref2], [5:16][ref3], [5:17][ref4] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 3.6.3
    text: |-
      Onze Minister is bevoegd tot overeenkomstige toepassing van
      [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref1] ten aanzien van de in het eerste lid bedoelde
      ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 3.7.1
    text: |-
      Onze Minister is bevoegd tot het treffen van noodzakelijke voorzieningen indien het expertisecentrum onderwijszorg
      naar het oordeel van Onze Minister zijn taken ernstig verwaarloost.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.7
  - number: 3.7.2
    text: |-
      De voorzieningen, bedoeld in het eerste lid, worden niet eerder getroffen dan nadat het expertisecentrum
      onderwijszorg in de gelegenheid is gesteld om binnen een door Onze Minister te stellen redelijke termijn alsnog
      zijn taken naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel3.7
  - number: 4.1.1.1
    text: De onderwijsgevenden aan een instelling dragen de titel van docent.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.1
  - number: 4.1.1.2
    text: Aan een instelling zijn één of meer directeuren verbonden.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.1
  - number: 4.1.1.3
    text: |-
      Het bevoegd gezag benoemt één of meer van de docenten om een directeur bij te staan en bij afwezigheid te
      vervangen. Deze dragen de titel van adjunct-directeur.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.1
  - number: 4.1.1.4
    text: Het bevoegd gezag kan overig personeel aanwijzen, dat tot taak heeft, het onderwijs te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.1
  - number: 4.1.2
    text: |-
      Het bevoegd gezag benoemt, schorst en ontslaat de directeuren, de adjunct- directeuren, de docenten en het overige
      personeel.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.2
  - number: 4.1.3
    text: |-
      Het bevoegd gezag stelt jaarlijks het beleid vast met betrekking tot de formatie van het personeel van de
      instelling. Zoveel mogelijk tegelijk met die vaststelling bepaalt het bevoegd gezag functies en taken van het
      personeel van de instelling, met inachtneming van de daaromtrent bij eilandsbesluit, houdende algemene maatregelen,
      te geven nadere voorschriften.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.3
  - number: 4.1.4.1
    text: |-
      De [Ambtenarenwet BES][ref1] en de daarop berustende regelingen zijn voor het personeel van een instelling voor
      bijzonder onderwijs van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028215
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0028215
  - number: 4.1.4.2
    text: Voor de salarissen en toelagen van het personeel wordt een regeling vastgesteld bij eilandsbesluit.
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.4
  - number: 4.1.4.3
    text: |-
      Het bestuurscollege stelt de regeling, bedoeld in het tweede lid, dan wel een wijziging daarvan niet vast dan nadat
      daarover op overeenstemming gericht overleg is gevoerd met de bevoegde gezagsorganen en met de onderwijsvakbonden
      of, bij het ontbreken daarvan, met een representatief te achten vertegenwoordiging van het personeel.
      [Artikel 101 van de Ambtenarenwet BES][ref1] is niet van toepassing op de vaststelling dan wel wijziging van de
      regeling, bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0028215#Artikel101
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0028215
        artikel: '101'
  - number: 4.1.5
    text: |-
      [Artikel 3, eerste lid, onderdeel b, van het Rechtspositiebesluit ambtenaren BES][ref1] is niet van toepassing op
      het personeel.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel3
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '3'
  - number: 4.1.7.1
    text: |-
      In afwijking van [artikel 8 van het Rechtspositiebesluit ambtenaren BES][ref1] is ieder personeelslid van een
      bijzondere instelling in het bezit van een door het bevoegd gezag en hemzelf getekende akte van benoeming.


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.7
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '8'
  - number: 4.1.7.2
    text: |-
      De akte van benoeming bevat ten minste bepalingen van gelijke inhoud als de bepalingen die zijn vastgesteld in
      [artikel 8 van het Rechtspositiebesluit ambtenaren BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028693#Artikel8
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.7
    references:
      - id: ref1
        bwb_id: BWBR0028693
        artikel: '8'
  - number: 4.1.8
    text: |-
      De Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba is, in afwijking van
      [artikel 4.1.2, eerste lid][ref1], bevoegd de disciplinaire straf of de schorsing op te leggen dan wel het ontslag
      te verlenen, indien het een directeur, een adjunct-directeur, of een ander lid van het onderwijzend personeel van
      een openbare instelling betreft en deze tevens lid is van de eilandsraad van het openbaar lichaam die de school in
      stand houdt.


      [ref1]: https://wetten.overheid.nl/BWBR0028395#Artikel4
    url: https://wetten.overheid.nl/BWBR0028395/2022-01-01#Artikel4.1.8
    references:
