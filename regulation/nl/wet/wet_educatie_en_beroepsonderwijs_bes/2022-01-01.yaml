      In deze wet en de daarop berustende bepalingen wordt verstaan onder: **beroepsbegeleidende leerweg**:
      de leerweg, bedoeld in [artikel 7.2.2, tweede lid, onder b][ref1]; **beroepsonderwijs**: onderwijs
      als bedoeld in [artikel 1.2.1, tweede lid][ref2]; **beroepsopleidende leerweg**: de leerweg, bedoeld
      in [artikel 7.2.2, tweede lid, onder a][ref3]; **beroepsopleiding**: een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid][ref4]; **beroepspraktijkvorming**: het onderricht in de praktijk van het beroep,
      bedoeld in [artikel 7.2.7, eerste lid][ref5]; **bevoegd gezag**:


